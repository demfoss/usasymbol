faq:
  - question: "Where is Great Basin National Park?"
    answer: "Great Basin National Park is in eastern Nevada near the small town of Baker. It is about 285 miles west of Salt Lake City, Utah, and 290 miles north of Las Vegas, Nevada. The nearest commercial airport is Salt Lake City International (SLC)."
  - question: "Is there an entrance fee for Great Basin National Park?"
    answer: "No. The park charges no vehicle or person entrance fee. Lehman Caves guided tours cost $10 for adults and $5 for children ages 5 to 15. Campsites run $15 to $20 per night depending on the campground."
  - question: "When is the best time to visit Great Basin National Park?"
    answer: "Fall, specifically September through early October, offers the best overall conditions: cool temperatures, thin crowds, aspen color, and full access to all trails and campgrounds. Summer provides the widest access but comes with afternoon thunderstorms at high elevation. Spring is quiet but the upper road and summit trails stay closed into late May or June."
  - question: "What is Great Basin National Park known for?"
    answer: "The park is best known for Lehman Caves, a marble cavern accessible only by guided tour, and for a grove of ancient bristlecone pines near Wheeler Peak, some more than 4,000 years old. It also holds a Gold Tier International Dark Sky Park designation and protects the only glacier in Nevada."
  - question: "How hard is the hike to Wheeler Peak?"
    answer: "The Wheeler Peak Summit Trail is strenuous: 8.6 miles round trip with 2,900 feet of elevation gain to 13,063 feet. The upper section crosses loose quartzite scree. Start before 7 a.m. in summer to clear the exposed ridge before afternoon lightning develops."
  - question: "Do I need reservations to visit Great Basin National Park?"
    answer: "No reservation is needed for park entry. Lehman Caves tours can be reserved up to one week in advance at the visitor center or online and fill quickly on summer mornings. Upper Lehman Creek and Wheeler Peak campgrounds accept reservations through Recreation.gov and fill on summer weekends."
  - question: "Are there bears in Great Basin National Park?"
    answer: "No bears have been documented in Great Basin National Park. The park does have mountain lions, coyotes, and Great Basin rattlesnakes in the lower rocky areas. Food storage regulations still apply at all campgrounds."

  - question: What state is Great Basin National Park in?
    answer: Great Basin National Park is in [Nevada](/states/nevada), near Baker, Nevada.

