intro_text: "Great Basin National Park in eastern [Nevada](/states/nevada) rises from sagebrush desert to the 13,063-foot summit of Wheeler Peak. Established in 1986 and free to enter, the park shelters Lehman Caves, a grove of ancient bristlecone pines, and Nevada's only glacier."

