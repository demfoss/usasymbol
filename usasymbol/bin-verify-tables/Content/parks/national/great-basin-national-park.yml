sections:
  overview: |
    Great Basin National Park occupies 77,180 acres of Nevada's Snake Range, roughly 285 miles west of Salt Lake City and 290 miles north of Las Vegas. Wheeler Peak anchors the skyline at 13,063 feet, and elevation climbs from sagebrush valleys at 6,200 feet through four distinct vegetation zones to alpine tundra and a permanent glacier above 11,000 feet. The park's only paved entrance lies on U.S. Highway 6/50 near the town of Baker, Nevada. Ranked 61st of 63 national parks by annual visitation, Great Basin receives about 132,000 visitors a year, making it one of the quietest parks in the system.

  known_for: |
    **Lehman Caves**: a half-mile marble cavern open only by guided tour, containing shields, stalactites, and helictites rare in North American caves. **Ancient bristlecone pines**: trees older than 4,000 years growing on rocky slopes above 10,600 feet near Wheeler Peak, among the oldest living organisms on Earth. **Gold Tier Dark Sky Park**: exceptionally dark, dry air at high elevation produces some of the least light-polluted skies in the contiguous United States. **Nevada's only glacier**: a small active ice mass survives in the north-facing cirque below Wheeler Peak, a remnant of Pleistocene glaciation.

  best_time_to_visit: |
    **Spring (April-May)** Temperatures at the visitor center run 45 to 65 degrees Fahrenheit. Wildflowers appear in the lower foothills and Lehman Caves tours operate on a full schedule. Wheeler Peak Road stays closed above Upper Lehman Creek Campground until snowpack clears, typically late May or June. Crowds are minimal.

    **Summer (June-August)** Wheeler Peak Road opens to 10,000 feet, unlocking all upper trails and campgrounds. Temperatures reach 75 to 85 degrees at the park entrance and drop sharply above 10,000 feet. July and August bring afternoon thunderstorms; start summit and ridge hikes before 7 a.m. This is peak season, though total visitor numbers remain modest compared to most national parks.

    **Fall (September-October)** Aspen groves along Lehman Creek turn gold in late September. Daytime temperatures cool to 35 to 65 degrees and crowds thin sharply after Labor Day. Wheeler Peak is generally snow-free through early October. Upper campgrounds close by mid-October, and Wheeler Peak Road typically closes after the first heavy snow.

    **Winter (November-March)** Wheeler Peak Road closes beyond Upper Lehman Creek Campground. The visitor center operates on a reduced schedule and cave tours run on weekends. Snowshoeing and cross-country skiing draw a small crowd to lower elevations. Daytime temperatures average 25 to 45 degrees at the entrance.

  hiking: |
    **Easy** The Mountain View Nature Trail near the visitor center is a 0.3-mile paved loop through pinyon-juniper forest at 6,800 feet. It introduces the park's lower-elevation ecology and is accessible to all fitness levels.

    **Moderate** The Alpine Lakes Loop links Stella Lake and Teresa Lake in 2.7 miles with 630 feet of elevation gain, starting from Wheeler Peak Campground at 10,000 feet. Afternoon thunderstorms are common in July and August; finish before noon. The Bristlecone Pine Trail extends the loop by 1.6 miles one way to an ancient grove above 10,600 feet; bring water, as there are no facilities above the campground. The Glacier Trail covers 1.4 miles round trip from Wheeler Peak Campground to views of Nevada's only glacier.

    **Strenuous** The Wheeler Peak Summit Trail gains 2,900 feet over 8.6 miles round trip, finishing on loose quartzite scree at 13,063 feet. Start by 7 a.m. in summer to clear the exposed ridge before afternoon lightning. The Baker Lake Trail on the park's south side covers 12 miles round trip with 2,900 feet of gain to a remote alpine lake; reach the trailhead via gravel Baker Creek Road.

  camping: |
    The park has five developed campgrounds and open backcountry camping by free permit. Lower Lehman Creek Campground offers 11 sites at 7,300 feet and is the only year-round option; it is first-come, first-served at $15 per night. Upper Lehman Creek (22 sites, 7,700 feet) and Wheeler Peak (37 sites, 10,000 feet) take reservations through Recreation.gov and fill on summer weekends by Thursday; both cost $20 per night. Baker Creek Campground (34 sites, 7,550 feet) is first-come, first-served at $15 per night on the quieter south side of the park. Snake Creek Campground (24 sites) is free, primitive, and reached by dirt road requiring a high-clearance vehicle. Backcountry camping is free and self-issued at the visitor center; camp at least 200 feet from water and 100 feet from trails.

  fees_reservations: |
    Great Basin National Park charges no entrance fee. Lehman Caves guided tours cost $10 per adult and $5 per child ages 5 to 15; children 4 and under are free. Purchase tickets at the visitor center the day of, or up to one week in advance online; tours fill quickly on summer mornings. Campsite fees run $15 per night at Lower Lehman Creek and Baker Creek, and $20 per night at Upper Lehman Creek and Wheeler Peak. The America the Beautiful annual pass ($80) covers cave tour fees for the pass holder and is available at the visitor center. Backcountry permits are free and self-issued. Confirm current fees and rules at the official park page at nps.gov/grba.

  getting_there: |
    **By car** The main entrance is on Nevada State Route 488, branching south from U.S. Highway 6/50 at Baker, Nevada, 5 miles from the visitor center. From Salt Lake City, drive west on I-80 to U.S. 93 south, then west on U.S. 6/50, approximately 285 miles. From Las Vegas, take I-15 north to U.S. 93 north, then west on U.S. 6/50, approximately 290 miles. No shuttle service operates within the park.

    **By air** Salt Lake City International Airport (SLC) is about 285 miles northeast and is the most practical option for most travelers. Harry Reid International (LAS) in Las Vegas is roughly 290 miles south. A rental car is required from either airport; no public transit connects to Baker.

  geology: |
    Great Basin National Park sits within the Basin and Range Province, where the Earth's crust has stretched and faulted over tens of millions of years, producing parallel north-south mountain ranges separated by broad, flat valleys. The Snake Range rose as a fault-block mountain, a rigid wedge of crust tilted upward along a steep fault on its western edge.

    The rock beneath Wheeler Peak is ancient limestone and quartzite, originally deposited as seafloor sediment more than 500 million years ago when a shallow ocean covered the region. Later tectonic heat and pressure converted some of that limestone into marble. Lehman Caves formed within this marble as slightly acidic groundwater dissolved passages and chambers over millions of years.

    After the water table dropped, calcite-rich water dripping into the cave deposited the formations visitors see today: stalactites, stalagmites, and the large disc-shaped shields that distinguish Lehman Caves from most other caverns in the United States. Shields form when pressurized water seeps through fractures in the cave walls, a process not fully understood.

    During the last ice age, glaciers carved the cirque bowl below Wheeler Peak's north face. One remnant ice mass survives in that cirque today, the only glacier in Nevada. Ice-carved walls of the cirque frame Teresa and Stella Lakes at about 10,200 feet.

  wildlife: |
    Mule deer are common throughout the park's lower elevations and are often visible near campgrounds at dawn and dusk. Pronghorn range across the sagebrush flats approaching the park boundary on the valley floor. On rocky slopes above 9,000 feet, American pikas call from boulder fields and yellow-bellied marmots sun on exposed rocks near the Alpine Lakes Loop.

    Bristlecone pine habitat supports Clark's nutcrackers, which cache seeds and inadvertently plant new trees across the upper slopes. Peregrine falcons nest on Wheeler Peak's cliff faces. Pinyon jays and mountain bluebirds are easy to spot in the pinyon-juniper zone between 6,000 and 8,000 feet. Brook trout inhabit Lehman Creek and Baker Creek and are available for catch-and-release fishing with a Nevada license.

    Great Basin rattlesnakes live in the lower desert and rocky areas; watch where you step on warm evenings below 8,000 feet. Mountain lions are present but rarely seen. No bears have been documented in the park, though food storage regulations apply at all campgrounds.

  history: |
    Western Shoshone people have inhabited the Snake Range and surrounding Great Basin for thousands of years. They harvested pinyon pine nuts each autumn as a primary food source, gathered medicinal plants in the foothills, and used the mountain's springs during seasonal movements. Their descendants maintain cultural connections to the land today.

    American explorers and government surveyors began crossing the Great Basin in the 1840s. Absalom Lehman, a rancher who settled near the mountain in the 1870s, found the cave entrance in 1885 and soon began guiding visitors through by lantern light. Word of the cave spread, and in 1922 President Warren G. Harding proclaimed Lehman Caves a national monument under the Antiquities Act. The monument boundary expanded in 1959 to include the Wheeler Peak area.

    Advocates pushed for full national park status throughout the following decades, arguing that the area's ecological range, from desert scrub at 6,200 feet to alpine glacier above 11,000 feet, warranted stronger protection than monument status provided. Congress established Great Basin National Park on October 27, 1986. The designation added nearly 60,000 acres to the earlier monument core and brought sustained federal investment in visitor infrastructure and cave research.

  best_things_to_see_items:
    - name: "Lehman Caves"
      description: "A half-mile marble cavern accessible only by guided tour, running daily year-round. Shields, large disc-shaped speleothems found in few other caves, line the walls alongside stalactites, stalagmites, and helictites. Tours take 60 or 90 minutes; purchase tickets at the visitor center or online up to one week ahead, as summer morning tours fill quickly."
      image: "/images/parks/national/great-basin-national-park/06-lehman-caves.jpg"
      alt: "Brown and tan cave formation in the shape of a parachute"
      credit: "NPS Photo"
    - name: "Wheeler Peak Summit"
      description: "At 13,063 feet, Wheeler Peak is Nevada's second-highest mountain and the highest summit reachable by trail in the Great Basin region. The 8.6-mile round-trip trail gains 2,900 feet over quartzite and talus, finishing on a rocky ridge with views spanning hundreds of miles of basin-and-range terrain. Start before 7 a.m. in summer to avoid afternoon lightning on the exposed upper ridge."
      image: "/images/parks/national/great-basin-national-park/07-wheeler-peak-summit.jpg"
      alt: "View from wheeler peak with blue skies and rocky mountain peaks."
      credit: "J. Hamilton"
    - name: "Bristlecone Pine Grove"
      description: "A grove of Great Basin bristlecone pines grows on the ridge above 10,600 feet near Wheeler Peak, some exceeding 4,000 years in age. The Bristlecone Pine Trail reaches the grove as a 1.6-mile spur from the Alpine Lakes Loop, starting at Wheeler Peak Campground. The oldest trees show dramatic wind-sculpted trunks of orange and gray wood."
      image: "/images/parks/national/great-basin-national-park/08-bristlecone-pine-grove.jpg"
      alt: "Bristlecone pine tree with a dark blue sky behind it with a bright Jupiter shining"
      credit: "Kelly Carrol"
    - name: "Wheeler Peak Glacier"
      description: "A small active glacier survives in the north-facing cirque below Wheeler Peak, making it the only glacier in Nevada. The Glacier Trail covers 1.4 miles round trip from Wheeler Peak Campground and gives a clear view of the ice mass and the carved rock walls above. The glacier has retreated since the mid-20th century but remains a recognizable permanent ice body."
      image: "/images/parks/national/great-basin-national-park/09-wheeler-peak-glacier.jpg"
      alt: "Wheeler Peak Glacier comes into view on the Bristlecone/Glacier Trail."
      credit: "Alana Dimmick"
    - name: "Alpine Lakes"
      description: "Stella Lake and Teresa Lake sit at about 10,200 feet in the glacially carved cirque below Wheeler Peak. The 2.7-mile Alpine Lakes Loop connects both lakes, with open views of the surrounding peaks and the glacier above. Both lakes are cold year-round; the loop is open from roughly June through October when Wheeler Peak Road is passable."
      image: "/images/parks/national/great-basin-national-park/10-alpine-lakes.jpg"
      alt: "Stella Lake in early spring with snow and ice"
      credit: "NPS"
    - name: "Stargazing"
      description: "Great Basin holds a Gold Tier International Dark Sky Park designation, reflecting some of the darkest skies in the contiguous United States. The park's elevation, dry desert air, and distance from major cities reduce light pollution to near-natural levels. The Astronomy Festival in October draws observers from across the country, and the visitor center parking area is a reliable public viewing spot on clear nights throughout the year."
      image: "/images/parks/national/great-basin-national-park/11-stargazing.jpg"
      alt: "Colorful Milky Way over the red lit Lehman Caves Visitor Center"
      credit: "Tom Auchter"
    - name: "Wheeler Peak Scenic Drive"
      description: "A 12-mile paved road climbs from the visitor center at 6,800 feet to Wheeler Peak Campground at 10,000 feet, passing through pinyon-juniper, mountain mahogany, aspen, and subalpine fir zones. Pull-outs along the route offer long views west across Snake Valley to Utah's Deep Creek Range. The road is open from approximately June through October, depending on snowpack."
      image: "/images/parks/national/great-basin-national-park/12-wheeler-peak-scenic-drive.jpg"
      alt: "Wheeler Peak Scenic Drive with mountains in the background"
      credit: "NPS Photo"

