sections:
  overview: |
    North Cascades National Park spans a section of the northern Washington Cascades centered on Highway 20, roughly 105 miles northeast of Seattle. The park is part of the North Cascades Complex, managed alongside Ross Lake National Recreation Area to the north and Lake Chelan National Recreation Area to the south; most campgrounds and visitor facilities sit within those recreation areas rather than the national park unit itself. Entry is free, and the park draws about 30,000 visitors per year, making it one of the least visited large parks in the system. Highway 20 is closed from roughly November through April due to snow and avalanche risk, concentrating the visitor season into late spring through early fall.

  known_for: |
    - More than 300 active glaciers, the highest concentration in the contiguous United States
    - Cascade Pass, one of the most accessible high-alpine destinations in Washington, with sweeping views of glaciated peaks
    - Diablo Lake, whose intensely turquoise color comes from glacial rock flour suspended in the water
    - Stehekin, a roadless community at the head of Lake Chelan reachable only by boat, floatplane, or trail

  best_things_to_see: |
    Diablo Lake draws the most roadside visitors, its vivid turquoise water visible from a pullout on Highway 20 and from the Diablo Lake Trail. Cascade Pass is the premier hiking destination inside the national park unit, with a direct view of the Cascade Glacier and connecting routes into the backcountry. Washington Pass Overlook on Highway 20 puts the granite spires of Liberty Bell Mountain at eye level with minimal walking. Stehekin, at the far end of Lake Chelan, requires a ferry ride and rewards visitors with a quiet valley, waterfalls, and trails that connect to the Cascades backcountry. Mountain goats are regularly spotted on the rocky slopes above Cascade Pass and along the ridgelines above Diablo Lake.

  best_things_to_see_items:
    - name: "Diablo Lake"
      description: "Diablo Lake sits behind Diablo Dam on the Skagit River in Ross Lake National Recreation Area. Its turquoise color comes from finely ground rock flour carried by glacial meltwater into the reservoir. A viewpoint on Highway 20 gives a quick look; the Diablo Lake Trail covers the full shoreline."
      image: "/images/parks/national/north-cascades-national-park/01-diablo-lake-kayak.jpg"
      alt: "Take advantage of the boat launch at Colonial Creek Campground to launch kayaks for a quiet morning on Diablo Lake."
    - name: "Cascade Pass"
      description: "Cascade Pass sits at 5,392 feet in the national park unit and is reached by a 7.4-mile round trip trail gaining about 1,800 feet. The pass looks directly across to the Cascade Glacier and the surrounding peaks of the Picket Range. It is one of the most popular day hikes in the North Cascades and the starting point for several multi-day routes."
      image: "/images/parks/national/north-cascades-national-park/02-cascade-pass-and-pelton-basin.jpg"
      alt: "Mountain slopes with blue sky"
      credit: "NPS Photo/Deby Dixon"
    - name: "Washington Pass Overlook"
      description: "The Washington Pass Overlook on Highway 20 sits at 5,477 feet and places visitors directly below the granite towers of Liberty Bell Mountain and the Early Winters Spires. A short paved path leads from the parking area to the main viewpoint. The overlook is accessible only when Highway 20 is open, typically late April through October."
      image: "/images/parks/national/north-cascades-national-park/05-washington-pass-overlook.jpg"
      alt: "granite spires near Washington Pass Overlook"
    - name: "Stehekin"
      description: "Stehekin is a small community at the northern end of Lake Chelan with no road connection to the rest of Washington. The Lady of the Lake ferry runs from Chelan, about 55 miles south, with a travel time of roughly 4 hours. Once there, visitors can hike, bike, or ride a shuttle bus to Rainbow Falls and backcountry trailheads."
      image: "/images/parks/national/north-cascades-national-park/03-stehekin-lake-chelan.jpg"
      alt: "Boats and float plane dock along the banks of Lake Chelan in Stehekin."
      credit: "NPS Photo/Deby Dixon"
    - name: "Ross Lake"
      description: "Ross Lake is a 24-mile reservoir stretching north from Ross Dam to the Canadian border. It is accessible by boat or by hiking in from Highway 20; there is no road to the lake itself. The lake offers flatwater paddling, fishing for rainbow and cutthroat trout, and remote campsites accessible only by water."
      image: "/images/parks/national/north-cascades-national-park/04-ross-lake-desolation-peak.jpg"
      alt: "View of Ross Lake from Desolation Peak"
    - name: "Skagit River Bald Eagle Festival"
      description: "Each winter, one of the largest concentrations of bald eagles in the lower 48 gathers along the Skagit River below the park to feed on spawning salmon. The peak count typically falls in January and February. The town of Concrete and the Rockport State Park area are the main viewing points, about 10 miles west of the park entrance."
      image: "/images/parks/national/north-cascades-national-park/06-skagit-river-bald-eagle-festival.jpg"
      alt: "Bald eagle with a fish carcass at the edge of a river"

  best_time_to_visit: |
    **Spring (May–June):** Highway 20 typically reopens in late April or early May after the winter closure. Waterfalls run at full volume from snowmelt, and wildflowers reach lower elevations in June. Many high trails remain snow-covered through early June; call ahead before attempting Cascade Pass before mid-June.

    **Summer (July–August):** The reliable window for high-country hiking. All trails are accessible, campgrounds fill on weekends, and the park's alpine meadows are at peak color in late July. Daytime temperatures in the valley reach the mid-70s°F while high ridges stay cool. Book campsites through recreation.gov well in advance for July and August weekends.

    **Fall (September–October):** Crowds thin significantly after Labor Day. The larch forests on the east side of the Cascades turn gold in early October, and huckleberry bushes add red color to the ridgelines. Early snow can close Highway 20 in October; check road conditions before departure. The highway typically closes for the season by mid- to late November.

  hiking: |
    **Easy:** The Diablo Lake Trail runs about 3.8 miles round trip from the Colonial Creek Campground area along the north shore of Diablo Lake. Elevation gain is minimal and the turquoise water is visible for most of the route. The Thunder Knob Trail, also near Colonial Creek, is a 3.6-mile round trip that climbs 500 feet to a forested knoll above the lake. Pets are allowed on leash on both trails.

    **Moderate:** Cascade Pass Trail is 7.4 miles round trip from the Cascade Pass Trailhead and gains about 1,800 feet. The upper mile passes through open meadow with direct views of the Cascade Glacier and the Picket Range. The trail is in the national park unit; a Northwest Forest Pass or equivalent is required for trailhead parking. Snow can linger at the pass into early July.

    **Strenuous:** Thornton Lakes Trail is approximately 10.4 miles round trip with more than 2,200 feet of elevation gain to a chain of lakes below Trappers Peak. The upper section is unmaintained and involves scrambling. The trailhead is west of Newhalem on Highway 20. For technical terrain, the park's granitic peaks, including Liberty Bell and the Picket Range, draw experienced rock climbers who should register at the park's backcountry office in Marblemount.

