  camping: |
    Most campgrounds in the North Cascades Complex sit within Ross Lake National Recreation Area, not the national park unit itself. Newhalem Creek Campground near the town of Newhalem is the largest, with 138 sites. Colonial Creek Campground, 10 miles east of Newhalem on Highway 20, has 130 sites split between two loops. Goodell Creek Campground offers 21 sites near Newhalem and remains open year-round when accessible. Gorge Lake Campground has 6 sites and is a smaller, quieter option. All developed sites require a fee; reservations are accepted through recreation.gov for the larger campgrounds and are recommended for summer weekends. Hozomeen Campground near the Canadian border has 75 sites accessible only via a gravel road through British Columbia. Backcountry camping requires a free wilderness permit, available at the Wilderness Information Center in Marblemount or by self-registration at select trailheads.

