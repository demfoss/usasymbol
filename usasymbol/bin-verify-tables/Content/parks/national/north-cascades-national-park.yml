  fees_reservations: |
    Park entry is free. No entrance fee is charged at any access point within the North Cascades Complex. Developed campsites at Newhalem Creek and Colonial Creek have a nightly fee; reservations are accepted through recreation.gov. Hozomeen Campground is free and first-come. A Northwest Forest Pass ($5/day or $30/year) is required for some trailhead parking areas, including the Cascade Pass Trailhead; America the Beautiful Pass holders are exempt. Backcountry wilderness permits are free and required for overnight stays outside developed campgrounds; obtain them at the Wilderness Information Center in Marblemount or by self-registration at trailhead permit stations. Confirm current fees and rules at the official park page: nps.gov/noca.

