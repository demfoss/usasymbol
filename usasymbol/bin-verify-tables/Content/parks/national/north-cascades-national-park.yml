  getting_there: |
    By car, the primary route is Washington State Route 20 (North Cascades Highway). From Seattle, take I-5 north to Burlington and turn east on WA-20; the drive to the Newhalem visitor area is about 105 miles and takes roughly 2.5 hours. From eastern Washington, approach from Twisp or Winthrop heading west on WA-20. Highway 20 closes each winter, typically from mid-November through late April, due to snowpack and avalanche risk; check current road status with WSDOT before traveling. The nearest commercial airport is Seattle-Tacoma International (SEA), about 105 miles southwest. No public transit serves the park. To reach Stehekin and the Lake Chelan NRA, take a ferry from the town of Chelan, about 4 hours by boat.

  geology: |
    The North Cascades contain some of the most complex and ancient rock in the western United States. The core of the range is built from metamorphic gneisses and schists that were buried, heated, and deformed deep in the crust roughly 90 million years ago. These rocks were later intruded by granitic magma, producing the jagged spires and glacier-polished walls that define the range's character. The result is a mosaic of rock types unlike the younger volcanic terrain found further south in the Cascades.

    The region's more than 300 glaciers are the direct product of heavy snowfall and a cold maritime climate. The western slopes of the range receive some of the highest snowfall totals in the contiguous United States, feeding glaciers that persist year-round on north-facing slopes above 5,000 feet. Many of these glaciers are retreating due to warming temperatures; Boston Glacier and Cascade Glacier show measurable shrinkage in aerial comparisons over the past century.

    The major river valleys, including the Skagit, were carved to their present depth by repeated advances of ice-age glaciers over the past two million years. The Skagit River now flows through a glacially widened valley whose walls expose the full sequence of metamorphic and granitic rock. Seattle City Light dammed the Skagit in three stages between the 1920s and 1949, creating Gorge, Diablo, and Ross lakes for hydroelectric power.

  wildlife: |
    Mountain goats are the most reliably spotted large mammals in the high country. They frequent rocky terrain above treeline near Cascade Pass and along the ridges above Diablo Lake. Black bears are common throughout the forest and meadow zones; store food in bear canisters in the backcountry. Gray wolves have been reestablishing themselves in the North Cascades over the past decade; sightings are infrequent but documented. Grizzly bears are present in very small numbers in the remote northern sections of the park and are listed as threatened.

    Bald eagles gather each winter along the Skagit River downstream of the park, with peak concentrations in January and February. The river hosts runs of all five Pacific salmon species; chinook, coho, and pink salmon move through the Skagit in season, drawing eagles and providing a visible example of the connection between alpine watersheds and coastal fisheries. River otters and American dippers are common along the Skagit and its tributaries.

    Pikas and hoary marmots inhabit the talus slopes above treeline and are active from snowmelt through early fall. Spotted owls and marbled murrelets nest in old-growth stands within the park. The park's isolation and low visitor numbers make it one of the better places in Washington to hear and see forest-interior species without disturbance.

  history: |
    The Skagit River valley has been inhabited for thousands of years by the Upper Skagit, Sauk-Suiattle, and other Coast Salish peoples, who used the valley for fishing, hunting, and seasonal travel across the mountain passes. Cascade Pass was a known trade route between the wet western slopes and the drier interior plateau. These communities were heavily affected by the smallpox epidemics of the eighteenth and nineteenth centuries before direct contact with American settlers.

    Fur trappers entered the region in the early 1800s, followed by prospectors after gold was found in the upper Skagit drainage in the 1880s. Mining towns appeared briefly and collapsed within a generation as high-grade ore played out. Logging began in the lower valleys in the early twentieth century, though the rugged upper terrain remained largely inaccessible. Seattle City Light's construction of three dams on the Skagit between 1924 and 1949 drowned portions of the valley but also created the road infrastructure that would later become Highway 20.

    Conservationists began pushing for a national park in the North Cascades in the 1950s. Competing interests from the Forest Service, timber industry, and power utility delayed action for over a decade. President Lyndon Johnson signed the North Cascades Act in 1968, establishing the national park and the two adjacent recreation areas as a single complex. The Stephen Mather Wilderness, covering 93 percent of the park, was designated by Congress in 1988.

