faq:
  - question: "Where is North Cascades National Park?"
    answer: "North Cascades National Park is in northwestern Washington state, about 105 miles northeast of Seattle. The main access road is Washington State Route 20 (North Cascades Highway), which passes through the Ross Lake National Recreation Area adjacent to the park."
  - question: "Is there an entrance fee for North Cascades?"
    answer: "No. The park and all units of the North Cascades Complex are free to enter. Some trailhead parking areas require a Northwest Forest Pass ($5/day); America the Beautiful Annual Pass holders are exempt."
  - question: "When is Highway 20 open through the park?"
    answer: "Highway 20 (North Cascades Highway) typically opens in late April or early May and closes for the season between mid-November and early December. Exact dates depend on snowpack and avalanche conditions. Check WSDOT road reports before traveling."
  - question: "What is the best hike in North Cascades?"
    answer: "Cascade Pass is the most popular day hike in the national park unit. The 7.4-mile round trip gains 1,800 feet and ends at a 5,392-foot pass with views of the Cascade Glacier and Picket Range. Snow can linger at the pass into early July."
  - question: "Can you see glaciers at North Cascades?"
    answer: "Yes. The park holds more than 300 glaciers, the highest concentration in the contiguous United States. Cascade Glacier is visible from Cascade Pass. Several others are visible from the Washington Pass Overlook and from ridgeline hikes above Diablo Lake."
  - question: "Where do you stay near North Cascades?"
    answer: "Newhalem Creek (138 sites) and Colonial Creek (130 sites) are the main developed campgrounds, both in Ross Lake National Recreation Area. Reservations are accepted through recreation.gov. The towns of Marblemount and Concrete to the west have limited lodging options."
  - question: "How do you get to Stehekin?"
    answer: "Stehekin has no road connection to the rest of Washington. Reach it by ferry from the town of Chelan, about 4 hours south on Lake Chelan; a faster high-speed passenger ferry cuts the trip to about 75 minutes. Floatplane service is also available. Stehekin is part of Lake Chelan National Recreation Area, managed as part of the North Cascades Complex."

  - question: What state is North Cascades National Park in?
    answer: North Cascades National Park is in [Washington](/states/washington), near Marblemount, Washington.

