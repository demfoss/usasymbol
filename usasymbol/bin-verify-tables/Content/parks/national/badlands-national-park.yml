sections:
  overview: |
    Badlands National Park lies in the southwestern corner of South Dakota, roughly 75 miles east of Rapid City along Interstate 90. The park covers 242,756 acres of sharply eroded buttes, spires, and grassland on the edge of the Great Plains. The formations contain one of the world's richest concentrations of Oligocene mammal fossils, dating from about 37 to 23 million years ago, when the area supported subtropical forests and savannas. About 1,200 American bison roam the mixed-grass prairie alongside bighorn sheep, pronghorn, and one of the country's only wild populations of black-footed ferrets. Badlands ranks 30th among the 63 national parks by annual visitation, drawing roughly 1.1 million visitors in 2023.

  known_for: |
    One of the world's richest Oligocene fossil beds, yielding remains of three-toed horses, ancient rhinos, saber-toothed cats, and camels that lived 23 to 37 million years ago. A herd of roughly 1,200 American bison that roam freely across the mixed-grass prairie and are regularly visible from the road. The 39-mile Badlands Loop Road (South Dakota 240), which passes dozens of overlooks and cuts directly through the eroded formations. One of the largest populations of black-tailed prairie dogs in the United States, concentrated at Roberts Prairie Dog Town near the Sage Creek Wilderness.

  best_things_to_see_items:
    - name: "Badlands Loop Road"
      description: "South Dakota 240 runs 39 miles through the heart of the North Unit, passing more than a dozen named overlooks and cutting between the upper and lower prairie through gaps in the Badlands Wall. The road is open year-round and most major formations are visible without leaving the pavement. Big Badlands Overlook, near the northeast entrance, offers one of the widest panoramic views in the park."
      image: "/images/parks/national/badlands-national-park/06-badlands-loop-road.jpg"
      alt: "road leading between snow covered badlands formations"
      credit: "NPS Photo/Brad Barker"
    - name: "Yellow Mounds"
      description: "The Yellow Mounds are a cluster of rounded formations near the Pinnacles entrance that expose an ancient soil layer colored deep yellow and orange by weathered iron. They contrast sharply with the gray-white spires above and the green prairie below. A pullout on the Loop Road provides a direct view; the mounds are at their most vivid in the two hours after sunrise and before sunset."
      image: "/images/parks/national/badlands-national-park/07-yellow-mounds.jpg"
      alt: "The yellow mounds are peaking out of the formations in this photo."
      credit: "NPS Photo"
    - name: "Notch Trail"
      description: "The Notch Trail climbs a log ladder fixed into a canyon wall, then follows a narrow ledge above the White River Valley before reaching a notch with a long view across the lower prairie and the Pine Ridge country to the south. The round trip is 1.5 miles with modest elevation gain. The ladder section requires two free hands; leave large packs at the base."
      image: "/images/parks/national/badlands-national-park/08-notch-trail.jpg"
      alt: "Badlands formations are very rugged and often have sharp peaks."
      credit: "NPS Photo"
    - name: "Roberts Prairie Dog Town"
      description: "Roberts Prairie Dog Town is one of the largest black-tailed prairie dog colonies in the United States, spread across hundreds of acres along Sage Creek Rim Road west of the main loop. Prairie dogs are active from dawn to dusk and are best observed from the road shoulder without approaching their burrows. Bison and coyotes frequently move through the colony."
      image: "/images/parks/national/badlands-national-park/09-roberts-prairie-dog-town.jpg"
      alt: "A wooden sign reads "
      credit: "NPS Photo / Ed Welsh"
    - name: "Fossil Exhibit Trail"
      description: "The Fossil Exhibit Trail is a 0.25-mile paved loop near the Conata Picnic Area with covered outdoor displays of fossil replicas cast from specimens found in the park. Each station identifies a species and places it in its geologic time period. The trail is wheelchair accessible and is a practical introduction to the park's paleontology before visiting the Ben Reifel Visitor Center museum."
      image: "/images/parks/national/badlands-national-park/10-fossil-exhibit-trail.jpg"
      alt: "A boardwalk extends towards badlands formations under blue sky amid exhibit and rattlesnake sign."
      credit: "NPS Photo / Serena Rosales"
    - name: "Ben Reifel Visitor Center"
      description: "The Ben Reifel Visitor Center at Cedar Pass is the park's main interpretive hub. The museum holds original fossils, a geologic cross-section display, and exhibits on Lakota history and the Ghost Dance era. Rangers here post current wildlife sighting reports and lead daily programs in summer. The center is named for Ben Reifel, a Lakota Sioux ranger who later became the first Sioux member of the U.S. Congress."
      image: "/images/parks/national/badlands-national-park/11-ben-reifel-visitor-center.jpg"
      alt: "a sign reading ben reifel visitor center sits in front of a road and badlands formations, all bathed in a warm sunset glow."
      credit: "NPS Photo"

