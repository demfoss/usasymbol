faq:
  - question: "Where is Badlands National Park?"
    answer: "Badlands is in southwestern South Dakota, about 75 miles east of Rapid City. The Northeast Entrance is off Exit 131 on I-90 near the town of Interior; the Pinnacles Entrance is off Exit 110 near Wall, South Dakota."
  - question: "When is the best time to visit Badlands National Park?"
    answer: "Fall (September–October) and spring (April–May) offer the most comfortable temperatures, 40–75 °F, and lighter crowds than summer. Summer is the busiest season with all facilities open, but midday temperatures regularly exceed 95 °F and the formations offer no shade. Winter is quiet but road closures and extreme wind chills are possible."
  - question: "How much does it cost to enter Badlands National Park?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals on foot or bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers Badlands and all other national parks for 12 months. Confirm current fees at nps.gov/badl."
  - question: "Do I need a reservation to visit Badlands?"
    answer: "No reservation is required to enter the park. Cedar Pass Campground accepts reservations April through October via Recreation.gov; summer weekends fill in advance. Sage Creek Campground is always first-come, first-served and free. No timed-entry reservation is in place."
  - question: "What is the best hike in Badlands National Park?"
    answer: "Notch Trail (1.5 miles round trip, moderate) is the most rewarding short hike — a log ladder on a canyon wall leads to a ledge with a wide view across the lower prairie. For a longer route, Castle Trail (10 miles round trip) follows the base of the formations through open grassland. Door Trail (0.75 miles) is the easiest way to walk into the formations."
  - question: "Can you see bison in Badlands National Park?"
    answer: "Yes. A herd of roughly 1,200 bison roams the park year-round and is regularly visible from the Loop Road, especially in the open prairie between the Cedar Pass and Pinnacles areas. Stay in your vehicle and keep at least 25 yards of distance at all times."
  - question: "Are there fossils you can see at Badlands?"
    answer: "The Fossil Exhibit Trail (0.25-mile loop near the Conata Picnic Area) displays replica casts of fossils found in the park, including ancient horses, rhinos, and saber-toothed cats. Original fossils and full skeletons are on display at the Ben Reifel Visitor Center. Collecting fossils in the park is illegal; report any fresh exposures to a ranger."

  - question: What state is Badlands National Park in?
    answer: Badlands National Park is in [South Dakota](/states/south-dakota), near Wall, South Dakota.
