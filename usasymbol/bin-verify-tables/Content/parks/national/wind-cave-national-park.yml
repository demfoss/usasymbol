  camping: |
    Elk Mountain Campground is the only developed campground in the park, with 62 sites in a ponderosa pine setting a short walk from the visitor center. Electric hookup sites and standard tent sites are available. The campground operates year-round, with some loops closed and no hookups available in winter. Reservations through Recreation.gov are recommended from Memorial Day through Labor Day; walk-up sites are often available in spring and fall.

    Backcountry camping is allowed in designated areas away from the cave and developed zones. A free permit is required and available at the visitor center. No water sources exist in the backcountry; carry enough for the entire trip.

