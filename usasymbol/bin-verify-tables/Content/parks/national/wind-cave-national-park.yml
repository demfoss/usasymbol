  fees_reservations: |
    Park entry is free. Cave tours are ticketed separately through Recreation.gov and cost roughly $14 to $30 per adult depending on tour type. The Garden of Eden Tour runs about $14 per adult; the Natural Entrance and Fairgrounds tours run $14 to $22; the Wild Caving Tour runs about $30. Child rates are approximately half the adult price. Cave tour slots sell out in summer, particularly on weekends and holidays; book as soon as the window opens.

    America the Beautiful annual passes ($80) provide a discount on cave tour fees for qualifying pass holders. Elk Mountain Campground fees run roughly $18 to $32 per night depending on site type; reserve on Recreation.gov. Backcountry permits are free at the visitor center.

    Confirm current fees and rules at the official park page: nps.gov/wica.

  getting_there: |
    **By car:** Wind Cave is 11 miles north of Hot Springs, South Dakota, on US-385. From Rapid City, take US-16 south to US-385 south for about 60 miles. No entrance gate or fee plaza exists; visitors drive in freely. A wildlife loop road branches from US-385 in the northern section of the park.

    **By air:** Rapid City Regional Airport (RAP) is the nearest commercial airport, about 55 miles north. No shuttle connects the airport to the park; a rental car is the practical option.

  geology: |
    Wind Cave formed in Pahasapa Limestone, a rock layer deposited under a warm, shallow sea roughly 330 million years ago. Slightly acidic groundwater dissolved the limestone along faults and fractures over millions of years, carving a maze of passages that now extend more than 150 mapped miles.

    The park's signature formation is boxwork: thin blades of calcite that project from cave walls and ceilings in honeycomb grids. Boxwork formed when calcite filled hairline cracks in the limestone before the surrounding rock dissolved away, leaving the harder fins standing. Wind Cave contains 95 percent of all known boxwork on Earth, making it the defining feature of the park underground.

    Differences in air pressure between the surface and the cave create a natural draft at the cave's small natural entrance. The cave breathes in when outside pressure rises and out when it falls. Early settlers noticed this airflow in 1881; it is still detectable at the entrance today. The cave temperature stays at a constant 53 F year-round regardless of season.

    Above ground, the geology shifts to younger Lakota Sandstone and stream-cut hillsides. The visible edge between dark ponderosa pine forest and open grassland follows the limestone ridge boundary and the soil chemistry that comes with it.

  wildlife: |
    Bison are the most visible large animal in the park. About 400 to 500 bison descended from a 1913 conservation reintroduction graze the northern prairie and are visible from park roads year-round. The herd is managed to maintain genetic diversity and is one of the oldest plains bison conservation populations in North America. Keep at least 100 yards of distance; bison can run faster than humans and are unpredictable.

    Pronghorn share the open grasslands and move quickly at first light. Elk work between forest edges and meadows, with September rut producing audible bugling across the hillsides. Mule deer are common throughout. Coyotes and badgers hunt the grasslands; bobcat sightings are possible but uncommon.

    Black-tailed prairie dog colonies along the wildlife loop road attract burrowing owls, raptors, and black-footed ferrets. Wind Cave participates in the federal black-footed ferret recovery program; ferrets are present but nocturnal. The park offers occasional guided night programs during which ferret sightings are more likely. Turkey vultures, red-tailed hawks, and golden eagles ride thermals above Rankin Ridge throughout the warmer months.

  history: |
    The Lakota Sioux have a sacred relationship with Wind Cave that predates written records. In Lakota tradition, the cave is the place from which Tatanka — the bison people — and then humans first emerged onto the earth. The natural opening on the hillside held ceremonial significance and was a known landmark for generations before European contact.

    Jesse Bingham and his son Tom are credited with the first recorded European encounter in 1881, after hearing a whistling sound from a hillside crack that blew off Jesse's hat. A mining company later filed a land claim over the cave, but a General Land Office investigation in 1901 found the claim invalid because the cave contained no extractable mineral wealth.

    President Theodore Roosevelt signed the act creating Wind Cave National Park on January 9, 1903. It became the seventh national park in the United States and the first cave in the world to receive national park designation. The Civilian Conservation Corps built many of the park's roads, trails, and facilities during the 1930s.

    Bison were eliminated from the Black Hills by hunting pressure in the 1870s. The New York Zoological Society donated 14 bison to Wind Cave in 1913 to reestablish a wild population on the plains. That herd has grown into one of the most genetically important conservation populations in the country today.

faq:
  - question: "Where is Wind Cave National Park?"
    answer: "Wind Cave is in the southern Black Hills of South Dakota, 11 miles north of Hot Springs on US-385 and about 60 miles south of Rapid City."
  - question: "Is it free to enter Wind Cave National Park?"
    answer: "Yes, park entry is free. Cave tours are ticketed separately through Recreation.gov and cost roughly $14 to $30 per adult depending on the tour. Campground fees apply separately."
  - question: "When is the best time to visit Wind Cave?"
    answer: "Fall (September to October) offers the best combination of elk rut, manageable crowds, and open tours. Summer is the busiest season; book cave tour tickets weeks in advance. Spring is quieter with good wildlife viewing but possible late snow."
  - question: "How long is Wind Cave?"
    answer: "Explorers have mapped more than 150 miles of passages, ranking it among the ten longest known caves in the world. New sections are still being discovered by cave survey teams."
  - question: "Do I need a reservation for cave tours?"
    answer: "Yes. Cave tours at Wind Cave are sold through Recreation.gov and sell out in summer, especially on weekends. Book as soon as your dates open, up to 60 days in advance."
  - question: "Can I see bison at Wind Cave National Park?"
    answer: "Yes. A herd of about 400 to 500 bison roams the park year-round. The wildlife loop road in the northern section is the most reliable place to find them. Stay at least 100 yards away."
  - question: "Are pets allowed at Wind Cave?"
    answer: "Pets are allowed on above-ground trails and in Elk Mountain Campground on a 6-foot leash. They are not permitted inside the cave, on cave tour routes, or in the backcountry."

  - question: What state is Wind Cave National Park in?
    answer: Wind Cave National Park is in [South Dakota](/states/south-dakota), near Hot Springs, South Dakota.

