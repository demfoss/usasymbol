sections:
  overview: |
    Wind Cave National Park covers 33,847 acres in the southern Black Hills of South Dakota, 11 miles north of Hot Springs. The park protects two distinct environments: a mixed-grass and ponderosa pine landscape above ground and one of the world's longest cave systems below. More than 150 miles of passages have been mapped in the cave, ranking it among the top ten longest known caves on Earth. The park draws about 656,000 visitors a year, placing it 32nd in national park visitation. Most visitors split their time between a guided cave tour and a slow drive through the wildlife loop road on the northern prairie.

  known_for: |
    **Boxwork**: Wind Cave holds 95 percent of all known boxwork on Earth — a rare formation of thin calcite fins projecting from cave walls and ceilings in honeycomb-like grids.
    **Free park entry**: There is no vehicle or per-person entrance fee; cave tour tickets are the only required purchase.
    **Free-roaming bison herd**: About 400 to 500 bison descended from a 1913 conservation reintroduction graze the park's prairie year-round.
    **Prairie dog towns**: Black-tailed prairie dog colonies are visible along park roads and attract raptors, burrowing owls, and recovering black-footed ferrets.

  best_things_to_see_items:
    - name: "Guided Cave Tours"
      description: "Ranger-led tours depart from the visitor center and descend into Wind Cave through electrically lit passages. The Natural Entrance and Fairgrounds tours cover the most boxwork; the Garden of Eden Tour is the shortest and best for families. All tours maintain a constant 53 F underground regardless of surface conditions."
      image: "/images/parks/national/wind-cave-national-park/17-guided-cave-tours.jpg"
      alt: "A child looks up at a ceiling full of boxwork"
      credit: "NPS Photo"
    - name: "Wildlife Loop Road"
      description: "A 6-mile unpaved road through the northern prairie offers reliable sightings of bison, pronghorn, prairie dogs, and raptors from a vehicle. Early morning and late afternoon give the highest animal activity. The road is passable by standard car in dry conditions."
      image: "/images/parks/national/wind-cave-national-park/11-wildlife-loop-road.jpg"
      alt: "three adult bison walk down the road past a sign reading 'large wildife on road next 13 miles'"
      credit: "NPS Photo"
    - name: "Prairie Dog Towns"
      description: "Black-tailed prairie dog colonies dot the grasslands along the wildlife loop road and are active mid-morning and late afternoon. Burrowing owls nest in abandoned burrows from April through September. The park participates in black-footed ferret recovery, and ferrets are occasionally spotted near active colonies on ranger-led night programs."
      image: "/images/parks/national/wind-cave-national-park/09-prairie-dog-towns.jpg"
      alt: "two prairie dogs watch from their burrow"
      credit: "NPS Photo"
    - name: "Wild Caving Tour"
      description: "A 4-hour off-trail crawl through undeveloped cave passages for visitors 16 and older. Helmets, knee pads, and lights are provided by the park. This tour reaches sections never visited on standard routes and requires advance reservation through Recreation.gov; summer slots sell out weeks ahead."
      image: "/images/parks/national/wind-cave-national-park/10-wild-caving-tour.jpg"
      alt: "a caver with pads and helmet crawling in the cave"
      credit: "NPS Photo"
    - name: "Rankin Ridge Overlook"
      description: "A fire lookout tower sits at 5,013 feet, the highest point in the park, reached by a 1-mile loop trail from a trailhead off Highway 87 in the park's northwest corner. On clear days the view extends across the mixed-grass prairie and into the broader Black Hills. The short, flat loop is suitable for all fitness levels."
      image: "/images/parks/national/wind-cave-national-park/18-rankin-ridge-fire-tower.jpg"
      alt: "A fire tower rises above a hill of pine trees."
    - name: "Bison Herd"
      description: "About 400 to 500 bison roam the park year-round. The herd descends from 14 animals donated by the New York Zoological Society in 1913, making it one of the oldest and genetically most significant conservation populations on the plains. Stay at least 100 yards away at all times."
      image: "/images/parks/national/wind-cave-national-park/12-bison-herd.jpg"
      alt: "a bison cow and calf on the prairie"
      credit: "NPS Photo / Dan Roddy"

