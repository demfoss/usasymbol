faq:
  - question: "How do you get to Channel Islands National Park?"
    answer: "The only public access to all five islands is by boat. Island Packers, the primary NPS-authorized operator, runs boats from Ventura Harbor to all five islands; Santa Barbara also has service from its harbor. The crossing to Anacapa takes about 1 hour; San Miguel takes up to 4 hours in good conditions. Private pilots may land on Santa Cruz and Santa Rosa with NPS permits. There are no bridges or roads to any island."
  - question: "Is there an entrance fee for Channel Islands National Park?"
    answer: "The park itself has no entrance fee. The main cost is boat transportation, which is charged separately by Island Packers and other concessionaires. Campground reservations require a booking fee through Recreation.gov. The America the Beautiful Annual Pass covers the park entrance but does not cover boat fares."
  - question: "When is the best time to visit Channel Islands National Park?"
    answer: "Fall (September through November) offers the calmest seas, warmest ocean temperatures, and best underwater visibility — the best overall window for snorkeling, kayaking, and camping. Spring (March through May) is best for wildflower blooms on Anacapa and northbound gray whale watching. Summer is busiest but afternoon winds are strong and June fog can limit activities on the outer islands."
  - question: "What is the island fox?"
    answer: "The island fox is a cat-sized canid found only on the Channel Islands, with a distinct subspecies on each of the six largest islands. Adults weigh about 4 pounds. Four subspecies were listed as endangered after populations crashed in the early 2000s due to golden eagle predation. A recovery effort involving eagle removal, captive breeding, and feral pig eradication restored the populations; all four endangered subspecies were delisted in 2016. Foxes are commonly seen at campgrounds and trailheads."
  - question: "Can you kayak the sea caves at Channel Islands?"
    answer: "Yes. Painted Cave on Santa Cruz, one of the world's largest sea caves, is accessible by kayak when seas are calm enough, typically fall through early spring. A concessionaire at Scorpion Ranch on Santa Cruz offers kayak rentals and guided cave tours; book in advance. Sea conditions change quickly — always check with the concessionaire on the day of your trip before entering any cave."
  - question: "Is camping available at Channel Islands?"
    answer: "Yes, all five islands have primitive NPS campgrounds totaling 72 sites. Reservations are required and made through Recreation.gov. Scorpion Ranch on Santa Cruz (31 sites) is the most accessible, with water on site. All other campgrounds have no water; carry everything from the mainland. Boat schedules control your arrival and departure, and weather can delay or cancel trips to the outer islands."
  - question: "What whales can you see at Channel Islands?"
    answer: "Blue whales — the largest animals on Earth — feed in the Santa Barbara Channel from June through September. Gray whales migrate south from December through February and north from February through April, passing close to Anacapa. Humpback and fin whales are seen regularly year-round. Island Packers runs dedicated whale-watching trips that do not require landing on an island."

  - question: What state is Channel Islands National Park in?
    answer: Channel Islands National Park is in [California](/states/california), near Ventura, California.
