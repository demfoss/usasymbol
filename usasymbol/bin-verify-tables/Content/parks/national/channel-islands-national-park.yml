sections:
  overview: |
    Channel Islands National Park protects five islands off the coast of southern California — Anacapa, Santa Cruz, Santa Rosa, San Miguel, and Santa Barbara — along with approximately 1 nautical mile of surrounding ocean, covering 249,561 acres in total. The islands lie 14 to 70 miles from the mainland and are accessible only by concessionaire boat or private aircraft; no roads or bridges connect any island to the shore. The park ranks 51st among the 63 U.S. national parks by annual visitation, drawing roughly 360,000 visitors in 2023. Santa Cruz is the largest island and the most visited, with most visitors arriving on day trips from Ventura Harbor via Island Packers, the primary NPS-authorized boat operator. Thousands of years of isolation produced species found nowhere else on Earth, including six subspecies of island fox and the island scrub-jay, which is the only bird in the continental United States restricted to a single island.

  known_for: |
    The island fox, a cat-sized canid with six subspecies — one unique to each of the six largest islands — that nearly went extinct in the early 2000s and recovered to healthy numbers by 2016 in one of the fastest mammal recoveries in U.S. conservation history.
    Painted Cave on the northwest coast of Santa Cruz, one of the largest sea caves in the world with an entrance roughly 100 feet wide and a total depth of more than a mile, accessible by kayak when seas are calm enough to enter.
    Giant kelp forests in the surrounding waters, among the most productive marine ecosystems on Earth, supporting hundreds of fish species and providing world-class snorkeling and diving within the national park boundary.
    The Chumash people's 13,000-year history on the islands, documented in shell middens, rock art, and village sites, with the Chumash tomol — a hand-sewn plank canoe — still paddled between the islands and mainland in annual crossings.

  best_things_to_see_items:
    - name: "Anacapa Island"
      description: "Anacapa is the closest island to the mainland, about 14 miles from Ventura, and consists of three small islets linked by arches and accessed by a 154-step staircase from the landing dock. The East Islet has the park's only staffed lighthouse, a flat plateau of giant coreopsis tree sunflowers that bloom yellow from January through April, and Inspiration Point — the best panoramic overlook in the park. Brown pelicans nest here in one of the largest colonies on the West Coast."
      image: "/images/parks/national/channel-islands-national-park/06-anacapa-island.jpg"
      alt: "Yellow flowers in foreground extending out along a rocky coastline to a natural arch."
      credit: "Tim Hauf, timhaufphotography.com"
    - name: "Santa Cruz Island"
      description: "Santa Cruz is the largest island in the park at 96 square miles, with rugged mountains, a central valley, sea caves, and more than 50 miles of hiking trails. Scorpion Ranch, the main landing site, has a historic ranch complex, a campground, and access to the kelp forest for snorkeling. Painted Cave on the northwest coast, accessible by kayak, is one of the largest sea caves in the world, with colorful lichen walls and a waterfall at its entrance."
      image: "/images/parks/national/channel-islands-national-park/07-santa-cruz-island.jpg"
      alt: "Rugged coastline and green interior hills on Santa Cruz Island."
      credit: "Tim Hauf, timhaufphotography.com"
    - name: "Island Fox Encounter"
      description: "The island fox is a unique species found only on the Channel Islands, with a separate subspecies on each of the six largest islands. Adults weigh about 4 pounds — roughly half the size of a gray fox. The foxes on San Miguel, Santa Rosa, and Santa Cruz nearly went extinct by 2004 due to golden eagle predation; a recovery program removed the golden eagles, reintroduced bald eagles, and eliminated feral pigs. All subspecies were removed from the endangered species list in 2016. Foxes are commonly seen at Scorpion Ranch and near the Santa Cruz campground."
      image: "/images/parks/national/channel-islands-national-park/08-island-fox-encounter.jpg"
      alt: "Rust and grey colored fox in green grass."
      credit: "Tim Hauf, timhaufphotography.com"
    - name: "Santa Rosa Island"
      description: "Santa Rosa is the second largest island, with wide sandy beaches, ancient Torrey pines — one of only two native stands in the world — and the richest archaeological record of any Channel Island. The Torrey Pine grove on the island's north shore is older and larger than the mainland grove at Torrey Pines State Reserve near San Diego. Pygmy mammoth (Mammuthus exilis) fossils have been found here, including one of the most complete specimens ever recovered."
      image: "/images/parks/national/channel-islands-national-park/09-santa-rosa-island.jpg"
      alt: "Pine tree high on a ridge overlooking a bay with blue water and white sand beach."
      credit: "Tim Hauf, timhaufphotography.com"
    - name: "San Miguel Island Pinniped Rookery"
      description: "San Miguel is the most remote of the five islands, about 55 miles from Ventura in open Pacific waters. Point Bennett at the island's western tip hosts one of the world's largest pinniped rookeries, where five species breed simultaneously: California sea lion, northern elephant seal, harbor seal, northern fur seal, and Steller sea lion. As many as 15,000 animals haul out on the beach at once. A ranger-guided 16-mile round-trip hike reaches Point Bennett; the crossing to San Miguel can be rough."
      image: "/images/parks/national/channel-islands-national-park/10-san-miguel-island-pinniped-rookery.jpg"
      alt: "Windswept San Miguel Island coastline and bluffs."
      credit: "Tim Hauf, timhaufphotography.com"
    - name: "Kelp Forest Snorkeling and Diving"
      description: "Giant kelp (Macrocystis pyrifera) forms underwater forests off all five islands, with individual plants reaching 200 feet tall in ideal conditions. The kelp canopy supports more than 800 species of fish, invertebrates, and marine mammals. Scorpion Anchorage on Santa Cruz and the waters around Anacapa are the most accessible sites. Water temperatures range from 55 to 68 °F depending on season and depth; a wetsuit is recommended year-round."
      image: "/images/parks/national/channel-islands-national-park/11-kelp-forest-snorkeling-and-diving.jpg"
      alt: "Kelp forest in Gull Island Marine Reserve off of Santa Cruz Island"
      credit: "NPS / Brett Seymour"
    - name: "Whale Watching"
      description: "The waters around Channel Islands are among the most productive whale-watching areas on the Pacific Coast. Gray whales migrate through from December through April, passing close to Anacapa. Blue whales — the largest animals on Earth — feed in the Santa Barbara Channel from June through September. Humpback, fin, and minke whales are also seen regularly. Island Packers runs dedicated whale-watching trips that stay on the water without landing on any island."
      image: "/images/parks/national/channel-islands-national-park/12-whale-watching.jpg"
      alt: "blue whale spouting"
      credit: "Brad Sillasen"

