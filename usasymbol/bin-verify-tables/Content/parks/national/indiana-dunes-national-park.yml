faq:
  - question: "Where is Indiana Dunes National Park?"
    answer: "Indiana Dunes National Park sits along the southern shore of Lake Michigan in northwest Indiana, about 50 miles from downtown Chicago. The nearest town is Chesterton, Indiana. The main visitor contact area is on Kemil Road in Porter."
  - question: "What is the best time to visit Indiana Dunes?"
    answer: "Spring (April-May) is best for birding and wildflowers with light crowds. Summer brings warm swimming water and full facilities. Fall offers comfortable hiking and fall color after Labor Day, when crowds thin."
  - question: "How much does it cost to enter Indiana Dunes?"
    answer: "$25 per vehicle for a 7-day pass. Motorcycles pay $20, and individuals entering on foot or by bicycle pay $15 per person. The America the Beautiful annual pass ($80) covers entry to all federal fee areas."
  - question: "Can you swim at Indiana Dunes?"
    answer: "Yes. The park has 15 miles of Lake Michigan beach open for swimming from late spring through summer. No lifeguards are on duty. Check posted rip-current flags before entering the water."
  - question: "Can you get to Indiana Dunes without a car?"
    answer: "Yes. The South Shore Line commuter rail runs from Millennium Station in downtown Chicago to Dune Park and Beverly Shores stations within or adjacent to the park, with multiple daily departures year-round."
  - question: "Is Indiana Dunes good for birdwatching?"
    answer: "It is one of the best birding sites in the Midwest. Over 350 species have been recorded. May brings peak warbler migration, and October concentrates raptors along the lakeshore. West Beach and Beverly Shores are the top spots."
  - question: "Can you climb Mount Baldy?"
    answer: "The trail to the base of Mount Baldy is open year-round. Reaching the dune crest requires a ranger-led guided tour due to ongoing erosion and sinkholes from buried trees beneath the sand. Tours run daily in summer and can be reserved through the park."

  - question: What state is Indiana Dunes National Park in?
    answer: Indiana Dunes National Park is in [Indiana](/states/indiana), near Chesterton, Indiana.

