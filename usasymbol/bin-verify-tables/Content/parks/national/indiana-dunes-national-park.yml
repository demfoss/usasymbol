sections:
  overview: |
    Indiana Dunes National Park protects 15,349 acres along the southern shore of Lake Michigan in northwest Indiana. The park's 15 miles of beaches, active dunes, wetlands, and oak savannas support over 1,100 plant species and 350 bird species. Mount Baldy, the park's tallest active dune at 126 feet, migrates several feet south each year as prevailing winds move its sand. Chicago lies about 50 miles northwest, and the South Shore Line commuter train connects the city directly to stations inside park boundaries.

  known_for: |
    - **Active sand dunes**: Mount Baldy rises 126 feet and migrates roughly 4 feet south each year, advancing over a buried forest whose dead trunks periodically re-emerge through the sand.
    - **Exceptional biodiversity**: Over 1,100 plant species and 350 bird species have been recorded within 15,349 acres, a concentration that drew ecologists here over a century ago.
    - **Cowles Bog**: A National Natural Landmark where botanist Henry Chandler Cowles first described plant succession in 1899, founding the science of plant ecology.
    - **Train access from Chicago**: The South Shore Line runs from Millennium Station in downtown Chicago to stations within or adjacent to the park, making car-free visits practical year-round.


  best_things_to_see_items:
    - name: "Mount Baldy"
      description: "The park's tallest active dune rises 126 feet above Lake Michigan. Its south face advances roughly 4 feet per year, burying trees whose trunks re-emerge decades later as a ghost forest. Ranger-led guided tours run daily in summer and are required to reach the dune crest."
      image: "/images/parks/national/indiana-dunes-national-park/06-mount-baldy.jpg"
      alt: "Mount Baldy closure imaging showing the comfort station with a sand dune behind it."
      credit: "Jeff Manuszak"
    - name: "Lake Michigan Beach"
      description: "Fifteen miles of sandy shoreline offer swimming, kayaking, and clear-water views of the Chicago skyline on calm days. Water temperatures reach the low 70s°F in July and August. No lifeguards are on duty; check posted rip-current flags before entering the water."
      image: "/images/parks/national/indiana-dunes-national-park/07-lake-michigan-beach.jpg"
      alt: "West Beach"
      credit: "Nathaniel Moreno, NPS Collection"
    - name: "Cowles Bog"
      description: "A National Natural Landmark and one of the best-preserved coastal wetland complexes on the Great Lakes. The 4.7-mile loop trail passes sphagnum bog, open foredune, and mature beech-maple forest in a single walk, tracing the same succession sequence Cowles mapped in 1899."
      image: "/images/parks/national/indiana-dunes-national-park/08-cowles-bog.jpg"
      alt: "Cowles Bog Trail"
    - name: "Spring Warbler Migration"
      description: "May concentrates migrating songbirds along the Lake Michigan shoreline. Over 100 warbler species have been recorded in the park during peak migration weeks, drawing birders from across the Midwest. West Beach and Beverly Shores are the most productive spots."
      image: "/images/parks/national/indiana-dunes-national-park/04-spring-warbler-migration.jpg"
      alt: "Yellow Warbler off of broadway."
    - name: "Century of Progress Homes"
      description: "Five modernist houses were transported by barge from the 1933-1934 Chicago World's Fair to Beverly Shores, where they still stand on the Lake Michigan shore. All five are listed on the National Register of Historic Places. A spring open house allows interior access; exteriors are visible year-round."
      image: "/images/parks/national/indiana-dunes-national-park/09-century-of-progress-homes.jpg"
      alt: "Aerial view looking south from the Lake at the Century of Progress Homes."
      credit: "NPS Photo / C. Dillion"
    - name: "Dune Succession Trail"
      description: "A half-mile paved interpretive loop walks visitors through the full ecological sequence from bare sand to oak woodland, the same progression Henry Chandler Cowles made famous. Interpretive signs explain each vegetation zone. The trail is accessible and flat, completing in under 30 minutes."
      image: "/images/parks/national/indiana-dunes-national-park/06-dune-succession-trail.jpg"
      alt: "Image of cottonwood tree roots and marram grass growing along stairs on succession trail."
      credit: "Jeff Manuszak - NPS"

  best_time_to_visit: |
    **Spring (April-May)** is the best window for birding and wildflowers. Over 100 warbler species have been recorded during peak migration weeks in May. Trails are uncrowded, parking is easy, and spring ephemerals bloom in the forest sections.

    **Summer (June-August)** is beach season. Lake Michigan water temperatures climb to the low 70s°F, and all park facilities are open. Parking lots fill by mid-morning on weekends; arrive before 9 a.m. or take the South Shore Line from Chicago.

    **Fall (September-October)** offers comfortable hiking temperatures and fall color in the maple and oak forests. Hawk migration peaks in October with thousands of raptors funneling south along the lakeshore. Crowds drop sharply after Labor Day.

    **Winter (November-March)** is the quietest season. Ice formations build along the shore in January and February, and snowshoeing is possible after good snowfall. Some facilities close, but trails and beaches stay open.

  hiking: |
    **Easy trails** form the best introduction to the park. The Dune Succession Trail is a 0.5-mile paved loop showing the complete progression from bare sand to oak forest, with interpretive signs at each vegetation zone. The Dunbar Beach Trail covers about 1.2 miles of flat shoreline walking. The Calumet Dunes Trail runs roughly 2.5 miles through wooded old-dune ridges with minimal elevation change.

    **Moderate trails** reach the ecological heart of the park. The Cowles Bog Trail covers 4.7 miles in a loop through bog wetlands, open foredune, and beech-maple forest; sections are wet after rain and buggy in early summer. The Tolleston Dunes Trail runs about 3.4 miles through oak savanna in the park's western section. The Mount Baldy Trail is 1.5 miles round trip to the dune base, but crest access requires a ranger-led guided tour; tours fill in summer, so reserve ahead through the park.

    **No backcountry routes** exist within Indiana Dunes. Carry water on all warm-weather hikes; shade is limited on open dune sections. Pets are allowed on most trails on a 6-foot leash.

  camping: |
    Dunewood Campground is the park's only developed campground, with 73 sites open year-round. Sites accommodate tents and most RV sizes; some sites have electrical hookups. Flush toilets and shower facilities are available in season.

    Summer weekends fill fast: book at recreation.gov well in advance. No backcountry or dispersed camping exists within Indiana Dunes National Park. Campers wanting additional options can check Indiana Dunes State Park, which is adjacent and operates its own separate campground.

  fees_reservations: |
    The 7-day vehicle pass costs $25 and covers all passengers in one private vehicle. A motorcycle pass is $20; visitors entering on foot, by bicycle, or by train pay $15 per person. The America the Beautiful annual pass ($80) covers entry to all federal fee sites.

    No timed entry reservation is required for general park access. Dunewood Campground reservations are made at recreation.gov; summer weekends book out weeks in advance. Ranger-led guided tours of Mount Baldy can also be reserved through the park.

    Confirm current fees and rules at the official park page at nps.gov/indu.

  getting_there: |
    **By car**: The park stretches 15 miles along Lake Michigan with multiple access points. The main visitor contact area is on Kemil Road in Porter. From Chicago, take I-90/94 east to I-80/94, then exit onto US-12 or US-20 east depending on which section you are heading to. Parking lots fill quickly on summer weekends.

    **By train**: The South Shore Line commuter rail runs from Millennium Station in downtown Chicago to Dune Park station (near the visitor center) and Beverly Shores station (near the Century of Progress homes). This is the most practical car-free option from Chicago, with multiple daily departures.

    **By air**: Chicago Midway International Airport (MDW) is approximately 45 miles west.

  geology: |
    The dunes formed after the retreat of the Laurentide Ice Sheet roughly 10,000 to 14,000 years ago. Glacial meltwater created a series of higher lake levels, and each drop in water level left a ridge of exposed sand vulnerable to wind.

    Prevailing westerly winds from Lake Michigan pile sand into dunes up to 200 feet high. Mount Baldy, at 126 feet, advances roughly 4 feet south each year, swallowing a forest on its lee face. Buried tree trunks re-emerge from the sand as the dune passes over them.

    Behind the active foredunes lie older, stabilized dune ridges at successively higher elevations, each representing a former lake shoreline now carrying oak savanna or beech-maple forest. The progression from bare sand to mature woodland is visible within a single short walk.

    Low swales between ridges collect groundwater perched above glacial clay layers. These basins became the bogs and wetlands that cross the park, including Cowles Bog, a National Natural Landmark supporting carnivorous plants and rare sedge communities.

  wildlife: |
    Indiana Dunes records over 350 bird species, driven by the park's position at the southern tip of Lake Michigan where migrating birds concentrate along the shoreline funnel. May is peak warbler month, with over 35 warbler species possible in a single morning. October brings sustained hawk counts including sharp-shinned hawks, Cooper's hawks, and bald eagles.

    White-tailed deer are common in the forest sections year-round. Red foxes and coyotes hunt the dune grasslands and woodland edges at dawn and dusk. Blanding's turtles, a state-threatened species, inhabit the wetlands, and eastern box turtles use the oak savannas.

    Plant diversity is a signature feature of Indiana Dunes: over 1,100 species recorded within 15,349 acres. Carnivorous pitcher plants and sundews grow in Cowles Bog just yards from prickly pear cactus on hot south-facing dune slopes.

  history: |
    The Potawatomi people lived along the southern shore of Lake Michigan for centuries, fishing and trading through a network across the western Great Lakes. Earlier cultures dating back at least 5,000 years left evidence of habitation in the dunes. The 1833 Treaty of Chicago forced the Potawatomi from Indiana; most were removed west by 1838.

    French missionary Jacques Marquette passed the dunes in 1675, one of the earliest European records of the site. The steel industry established Gary, Indiana, in 1906, and industrial pressure on remaining Lake Michigan shoreline intensified through the first half of the twentieth century.

    Henry Chandler Cowles published his landmark study of dune plant succession in 1899, giving the site international scientific recognition. Landscape architect Jens Jensen and U.S. Senator Paul Douglas spent decades campaigning for federal protection. Congress established Indiana Dunes National Lakeshore in 1966.

    On February 15, 2019, the lakeshore was redesignated Indiana Dunes National Park, the 61st national park unit. The Beverly Shores section preserves five houses transported from the 1933-1934 Chicago World's Fair, listed on the National Register of Historic Places as the Century of Progress Architectural District.

