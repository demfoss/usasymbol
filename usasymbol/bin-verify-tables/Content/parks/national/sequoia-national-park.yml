  camping: |
    Lodgepole Campground near the Lodgepole Visitor Center is the largest and most central in the park, with 214 sites open most of the year, including some loops that remain accessible in winter. Dorst Creek Campground, about 8 miles northwest of Lodgepole, has 218 sites and operates from late June through early September. Both are at roughly 6,700 feet elevation. Potwisha Campground near the Ash Mountain entrance has 42 sites at 2,100 feet and stays open year-round, making it the best option for late fall and spring visits when upper roads may be closed. Buckeye Flat Campground, also in the foothills near Three Rivers, has 28 tent-only sites from spring through fall. Atwell Mill Campground in the Mineral King area offers 21 sites accessible only after the road opens in late May. All campgrounds require reservations from spring through fall via recreation.gov; walk-up sites are available only in the off-season. Backcountry camping requires a free wilderness permit.

