faq:
  - question: "Where is Sequoia National Park?"
    answer: "Sequoia National Park is in the southern Sierra Nevada in California, about 55 miles east of Visalia. The main entrance is the Ash Mountain gate on CA-198. The nearest major airport is Fresno Yosemite International (FAT), about 55 miles away."
  - question: "What is the most famous thing to see at Sequoia?"
    answer: "General Sherman Tree is the primary destination. It is the world's largest living tree by volume at 52,500 cubic feet, standing 274 feet tall. A short paved trail leads from the parking area to the base, and the Congress Trail continues through the rest of the Giant Forest grove."
  - question: "Do you need reservations for Sequoia National Park?"
    answer: "No timed-entry permit is required to enter the park. Campsite reservations are required at Lodgepole and Dorst Creek from May through September; book via recreation.gov in January when summer dates open. Crystal Cave tour tickets must be purchased in advance."
  - question: "Does the Sequoia entrance fee cover Kings Canyon?"
    answer: "Yes. The $35 7-day vehicle pass covers both Sequoia and Kings Canyon national parks. The two parks are managed together and share a continuous road system."
  - question: "When is the best time to visit Sequoia?"
    answer: "Summer (June through August) gives access to all areas including Crystal Cave and the high trails. Fall (September through October) offers thinner crowds and stable weather with all main roads still open. Spring can be beautiful in the foothills but upper roads may be closed by snow."
  - question: "What should I know about bears at Sequoia?"
    answer: "Black bears are active throughout the park. Never leave food, drinks, or scented items in your car; bears have broken into thousands of vehicles. Use the metal bear boxes at campsites or a hard-sided canister in the backcountry. Backcountry permits require a food storage plan."
  - question: "Can you drive to General Sherman Tree?"
    answer: "You can drive to the General Sherman parking area off Wolverton Road and walk a short paved path to the tree. Vehicles longer than 22 feet are not permitted past Hospital Rock on Generals Highway. In winter, snow chains may be required; call ahead for road conditions."

  - question: What state is Sequoia National Park in?
    answer: Sequoia National Park is in [California](/states/california), near Visalia, California.

