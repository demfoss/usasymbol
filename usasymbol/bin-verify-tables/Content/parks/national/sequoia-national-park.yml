  getting_there: |
    By car, the main entrance is the Ash Mountain entrance on CA-198, about 55 miles east of Visalia. From Visalia, take CA-198 east through Three Rivers; the entrance station is at the foot of the park's steep western slope. Generals Highway climbs from Ash Mountain to the Giant Forest, gaining about 5,000 feet in 16 miles; vehicles longer than 22 feet are not permitted past the Hospital Rock area due to sharp curves. The Big Stump entrance on CA-180 from Fresno serves the Kings Canyon side and also provides access to Sequoia via Generals Highway. Fresno Yosemite International Airport (FAT) is about 55 miles from the Ash Mountain entrance. No public transit serves the park. Mineral King is accessed via a separate 25-mile road that branches off CA-198 in Three Rivers, open late May through October.

  geology: |
    The Sierra Nevada is a tilted block of granite that was pushed upward along a fault on its eastern edge while the western slope subsided gradually toward the Central Valley. The granite formed when large bodies of magma cooled slowly underground during the Jurassic and Cretaceous periods, roughly 100 to 200 million years ago, before being exposed by erosion over tens of millions of years. The massive scale of the rock is visible everywhere in the park, from the walls of Kings Canyon to the smooth faces of Moro Rock.

    Giant sequoias grow in a narrow band on the western slope between about 4,500 and 7,000 feet, where winter snowpack and well-drained granitic soils combine with the moisture and cold the trees require. They do not grow in dense stands everywhere; they cluster in groves wherever soil conditions are right. The trees depend on fire to reproduce: their cones remain closed on the tree for up to 20 years, then open in the heat of a fire to release seeds onto the ash-fertilized soil below.

    The high eastern terrain, including the approaches to Mount Whitney, was scoured by glaciers during the last ice age. The U-shaped valleys, polished granite slabs, and moraines visible throughout the park above 7,000 feet are all products of ice that was hundreds of feet thick in some areas. The Crystal Cave marble was formed when limestone was caught between colliding tectonic plates and recrystallized under heat and pressure roughly 250 million years ago.

  wildlife: |
    Black bears are the primary wildlife concern for visitors. The park has an active bear management program; hard-sided bear canisters or park-provided food storage boxes are required for all overnight camping, and rangers actively patrol campgrounds. Bears have broken into hundreds of cars; never leave food, drinks, or scented items in a vehicle overnight. Black bears in the park are not dangerous if encountered at distance, but they are persistent and habituated to humans.

    Mule deer are common throughout the Giant Forest and meadow areas, often grazing at dawn and dusk. Mountain lions are present but extremely rarely seen; their prey includes the deer population. Steller's jays are the most conspicuous bird in camp, aggressively seeking unattended food. Acorn woodpeckers drill storage holes in dead sequoias and are visible in the mixed forest zone.

    Marmots at Mineral King are notorious for chewing rubber components on parked cars — hoses, belts, and wiring. The park rents protective chicken-wire wraps for vehicle undersides at the Mineral King Ranger Station. Pikas inhabit the talus fields above 9,000 feet; their short barks are often heard before they are seen. The park's waterways hold rainbow and brown trout and are open to fishing with a California fishing license.

  history: |
    The western Sierra slopes were home to the Monache (Western Mono) and Yokuts peoples, who hunted deer and gathered acorns and pine nuts on the lower slopes and used the high valleys seasonally. Their use of the land dates back thousands of years; the Kaweah River drainage was a primary travel corridor between the foothills and the mountain interior. Contact with American settlers in the mid-nineteenth century brought epidemic disease and forced displacement from most of the Sierra.

    American prospectors and settlers reached the sequoia groves in the 1850s. By the 1880s, a utopian socialist commune called the Kaweah Colony had claimed the Giant Forest timber and built a road toward it, intending to log the big trees commercially. Conservationists, led in part by the arguments of Visalia newspaper editor George Stewart, pushed Congress to protect the grove before logging began. President Benjamin Harrison signed Sequoia into law on September 25, 1890, making it the second national park in the United States, after Yellowstone. One week later, Congress established Yosemite. The U.S. Army administered Sequoia from 1891 until the National Park Service took over in 1916.

    John Muir visited the Giant Forest and wrote extensively about the sequoias, helping build national support for the park. The Giant Forest Village, a cluster of lodges and cabins built inside the grove during the early twentieth century, was removed in the 1990s and replaced with the Wuksachi Lodge outside the grove boundary to reduce root compaction damage to the trees.

