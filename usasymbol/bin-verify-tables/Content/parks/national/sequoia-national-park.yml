sections:
  overview: |
    Sequoia is managed jointly with Kings Canyon National Park; a single $35 vehicle pass covers both parks for seven days. Ranked 15th among the 63 national parks by visitation, the park draws about 1 million visitors per year. No timed-entry permit is required, unlike Yosemite to the north. The Giant Forest area, centered on Lodgepole Village, holds the highest concentration of large sequoias and most visitor facilities. Generals Highway climbs from the Ash Mountain entrance near Visalia through the Giant Forest and continues north into Kings Canyon. Pets are not permitted on any trails.

  known_for: |
    - General Sherman Tree, the world's largest living tree by volume at 52,500 cubic feet, standing 274 feet tall
    - Giant Forest, the largest intact sequoia grove in the world, with five of the ten largest trees on Earth
    - Moro Rock, a granite dome at 6,725 feet with a 350-step stairway and panoramic views of the Great Western Divide
    - Crystal Cave, a marble cavern with guided tours and a constant temperature of 48°F year-round

  best_things_to_see: |
    General Sherman Tree is the first stop for most visitors: a 2,100-year-old sequoia reached by a short paved trail from the Wolverton cutoff road, with the Congress Trail loop continuing past 19 other named giants. Moro Rock rises above the Giant Forest plateau and rewards the 350-step climb with views stretching to the Great Western Divide and, on clear days, into the Central Valley. Crystal Cave requires advance tickets but provides a rare look at the park's marble interior, formed from the same limestone belt that extends across the Sierra. Mineral King valley in the park's southern section is a remote glacial cirque used primarily by backpackers, with resident marmots notorious for chewing car wiring. Mount Whitney at 14,494 feet anchors the park's eastern edge as the highest point in the contiguous United States.

  best_things_to_see_items:
    - name: "General Sherman Tree"
      description: "General Sherman is the world's largest living tree by volume, measuring 52,500 cubic feet. It stands 274 feet tall, has a base circumference of 102 feet, and is estimated to be about 2,100 years old. A short 0.5-mile paved path descends from the parking area to the base; the Congress Trail continues from here through the Giant Forest."
      image: "/images/parks/national/sequoia-national-park/01-general-sherman.jpg"
      alt: "General Sherman"
      credit: "Anna Cirimele"
    - name: "Moro Rock"
      description: "Moro Rock is a granite dome in the Giant Forest area at 6,725 feet. A 350-step stairway carved into the rock climbs 0.25 miles to the summit, where the view spans the Great Western Divide and peaks above 12,000 feet. The climb is exposed and involves narrow ledges with railings. The trailhead is on Moro Rock Road, accessible from Generals Highway."
      image: "/images/parks/national/sequoia-national-park/02-moro-rock.jpg"
      alt: "People admire views from within the narrow railing at the top of Moro Rock. Photo courtesy of Paul Johnson."
      credit: "Paul G. Johnson"
    - name: "Crystal Cave"
      description: "Crystal Cave is a marble cavern about 4 miles off Generals Highway on a narrow, winding road. Stalactites, stalagmites, and columns line the cave passages, which stay at 48°F year-round. Guided tours last 50 minutes; tickets must be purchased in advance through recreation.gov or at the Lodgepole or Foothills visitor centers, not at the cave itself."
      image: "/images/parks/national/sequoia-national-park/03-crystal-cave-trail.jpg"
      alt: "Two people walk along a lush trail down to Crystal Cave."
    - name: "Giant Forest and Congress Trail"
      description: "The Congress Trail is a 2-mile paved loop through the heart of Giant Forest, passing General Sherman and 19 other named sequoias including the President and Chief Sequoyah trees. The Giant Forest grove contains 5 of the 10 largest trees on Earth by volume. The trail is mostly flat and accessible; snow can close the upper sections from November through April."
      image: "/images/parks/national/sequoia-national-park/13-best-giant-forest-congress-trail.jpg"
      alt: "A visitor walks on a boardwalk overlooking a group of sequoia trees."
    - name: "Mineral King"
      description: "Mineral King is a glacial valley in the southern park, reached by a 25-mile unpaved road from the town of Three Rivers. The valley sits at 7,800 feet and is a trailhead for backcountry routes into the southern Sierra. Marmots in the area are known to chew rubber hoses and wiring on parked vehicles; the park rents chicken-wire wraps to protect cars."
      image: "/images/parks/national/sequoia-national-park/07-mineral-king.jpg"
      alt: "a trail runs through a valley in Mineral King"
    - name: "Mount Whitney Approach"
      description: "Mount Whitney at 14,494 feet is the highest point in the contiguous United States and sits on the park's eastern boundary. The standard summit route from the east (Whitney Portal Trailhead) is entirely outside the park; the western approach via the High Sierra Trail from Crescent Meadow is a multi-day route through the park's backcountry. Permits are required for overnight travel on both routes."
      image: "/images/parks/national/sequoia-national-park/05-high-sierra-trail.jpg"
      alt: "Hiker stands near the edge of a drop off looking out at an expansive view of mountains."

  best_time_to_visit: |
    **Spring (April–May):** The Foothills and lower Giant Forest areas are accessible from early spring. Wildflowers bloom on the lower slopes in March and April. Snow can close Generals Highway above 6,000 feet through April or into May; check road conditions before driving to the Giant Forest. Crystal Cave tours begin in late spring.

    **Summer (June–August):** All roads and trails are open, Crystal Cave tours run daily, and the park is at peak capacity. Daytime highs in the Giant Forest reach the mid-70s°F; the valley floor near Three Rivers can hit 100°F. Afternoon thunderstorms develop over the high country from mid-July; be below 10,000 feet by noon on most summer days. No timed-entry permit is required, but campsite and lodging reservations should be made months in advance.

    **Fall (September–October):** The best combination of open trails, thinning crowds, and stable weather. Highs in the Giant Forest fall to 50–65°F by October. The high trails remain clear through early October. Mineral King Road closes in late October. Fall light on the sequoia groves is excellent for photography.

    **Winter (November–March):** Generals Highway can close above the Giant Forest in heavy snow. The Lodgepole area is accessible year-round; the Foothills area near Ash Mountain stays open even in winter. Wolverton has groomed snowshoe trails and ski rentals. Crystal Cave and Mineral King are closed.

  hiking: |
    **Easy:** Congress Trail is a 2-mile paved loop from the General Sherman parking area through the core of Giant Forest, passing the two largest trees in the world by volume and 17 other named giants. Total elevation gain is minimal. Tokopah Falls Trail starts at Lodgepole Campground and follows the Marble Fork of the Kaweah River 1.7 miles to a 1,200-foot cascade, 3.4 miles round trip with about 500 feet of gain. Pets are not permitted on either trail or anywhere else in the park.

    **Moderate:** Moro Rock Trail is 0.5 miles round trip but climbs 300 feet via a carved stone stairway on a steep exposed granite dome. The summit at 6,725 feet offers the widest panorama in the park. Most fit visitors complete the climb in 20 minutes; those with a fear of heights should note the narrow ledges near the top.

    **Strenuous:** Alta Peak Trail starts at Wolverton (7,200 ft) and climbs 13.5 miles round trip to the 11,204-foot summit with about 4,000 feet of elevation gain. The upper 3 miles traverse open tundra and talus with no shade. Alta Peak offers an unobstructed view of the Great Western Divide and Mount Whitney on clear days. Carry at least 3 liters of water; no water is available above the lower forest.

