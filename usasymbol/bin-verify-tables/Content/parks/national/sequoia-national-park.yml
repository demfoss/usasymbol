  fees_reservations: |
    The 7-day vehicle pass costs $35 and covers both Sequoia and Kings Canyon national parks. Motorcycles pay $30 for the same window. Individuals arriving on foot or by bicycle pay $20. The America the Beautiful Annual Pass is valid for both parks at $80. No timed-entry permit is required to enter the park. Crystal Cave tours require a separate ticket of approximately $16 per adult, purchased in advance through recreation.gov or at Lodgepole or Foothills visitor centers — tickets cannot be bought at the cave. Summer campsite reservations open in January on recreation.gov and sell out quickly; Lodgepole and Dorst Creek are the most competitive. Wuksachi Lodge, the only in-park lodging, books up months in advance for summer weekends. Confirm current fees and rules at the official park page: nps.gov/sequ.

