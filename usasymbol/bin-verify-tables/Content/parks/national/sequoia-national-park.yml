seo_title: "Sequoia National Park: Giant Trees, Hiking & Tips"
seo_description: "Visit Sequoia National Park in California: General Sherman Tree, giant sequoia groves, alpine hikes, and a $35 entrance fee."
intro_text: "Sequoia National Park protects the world's largest trees by volume, including General Sherman, which stands 274 feet tall and measures 102 feet around the base. The park covers 404,051 acres of the southern Sierra Nevada in California, from chaparral foothills to snow-capped peaks above 14,000 feet."

