sections:
  overview: |
    Big Bend National Park occupies the remote southwest corner of Texas, where the Rio Grande makes a sharp southward curve — the "big bend" that names the park. The park covers 801,163 acres across three distinct landscapes: the Chihuahuan Desert at its base, the Chisos Mountains rising to 7,832 feet at Emory Peak, and 118 miles of Rio Grande canyon border with Mexico. More than 450 bird species have been recorded here, the highest count of any national park in the United States. About 519,000 visitors reached the park in 2023, making it the 44th most visited among the 63 national parks — and one of the least crowded parks of comparable size in the country. The nearest sizable town, Alpine, is roughly 80 miles north; the nearest commercial airport is about 165 miles away.

  known_for: |
    More than 450 recorded bird species, including the Colima warbler, which nests in the Chisos Mountains and occurs nowhere else in the United States. Three major Rio Grande canyons — Santa Elena, Mariscal, and Boquillas — with limestone walls rising up to 1,500 feet above the river. The Chisos Mountains, an isolated "sky island" in the Chihuahuan Desert with peaks above 7,000 feet that support a different ecosystem from the surrounding desert. Some of the darkest skies of any national park in the lower 48 states, recognized by the International Dark Sky Association.

  best_things_to_see_items:
    - name: "Santa Elena Canyon"
      description: "Santa Elena Canyon cuts 1,500 feet deep through a mesa of ancient limestone, with the Rio Grande running between near-vertical walls at the base. The canyon entrance is 8 miles west of Castolon via Ross Maxwell Scenic Drive. The Santa Elena Canyon Trail (1.7 miles round trip) begins at the canyon mouth; early in the season a wade or rock-hop across Terlingua Creek is required to reach the trail's far side."
      image: "/images/parks/national/big-bend-national-park/06-santa-elena-canyon.jpg"
      alt: "The light from a sunrise highlights two cliff faces in various colors."
      credit: "NPS/Mark Schuler"
    - name: "Chisos Mountains and The Window"
      description: "The Chisos Mountains are a volcanic sky island rising from the desert floor, with peaks above 7,000 feet and temperatures 10 to 20 degrees cooler than the desert below. The Window is a V-shaped gap in the mountain rim that frames a view across 100 miles of the Chihuahuan Desert and into Mexico. The Window Trail (5.6 miles round trip) descends Oak Canyon to reach the pour-off; the trailhead is at the Chisos Basin."
      image: "/images/parks/national/big-bend-national-park/07-chisos-mountains-and-the-window.jpg"
      alt: "A paved trail and metal exhibit sign overlook a low basin surrounded by mountains."
      credit: "NPS/CA Hoyt"
    - name: "Rio Grande Paddling"
      description: "The Rio Grande forms the entire southern and western boundary of the park and offers multi-day canoe and kayak routes through three major canyons. Santa Elena Canyon (about 20 miles) and Boquillas Canyon (about 33 miles) are the most popular. Paddlers must carry a permit and observe international customs rules, as the Mexican riverbank is part of the journey. Several outfitters in the Terlingua and Study Butte area rent equipment and run shuttles."
      image: "/images/parks/national/big-bend-national-park/08-rio-grande-paddling.jpg"
      alt: "Floating the Rio"
    - name: "Desert Plants and Agave"
      description: "The Chihuahuan Desert supports more than 1,200 plant species in the park, including 60 species of cactus. Agave plants spend 10 to 30 years growing before sending up a single towering flower stalk — sometimes reaching 15 feet — then die. The cenizo (purple sage) blooms pink-purple across hillsides after summer rains. Ocotillo, sotol, prickly pear, and candelilla wax plant are visible along nearly every trail."
      image: "/images/parks/national/big-bend-national-park/09-desert-plants-and-agave.jpg"
      alt: "Century Plant Agave"
      credit: "NPS / C. Negele"
    - name: "Birding"
      description: "Big Bend holds the highest recorded bird count of any U.S. national park — more than 450 species. Spring migration (April–May) brings the peak variety, including the Colima warbler, which nests only in the Chisos Mountains within the United States. The Vermilion flycatcher, painted bunting, peregrine falcon, and zone-tailed hawk are among the most sought-after species. The Rio Grande Village nature trail and the Chisos Basin are the two most productive areas."
      image: "/images/parks/national/big-bend-national-park/10-birding.jpg"
      alt: "Vermilion Flycatcher"
      credit: "NPS"
    - name: "Hot Springs Historic District"
      description: "The Hot Springs Historic District sits on the Rio Grande bank about 2 miles south of Rio Grande Village, reached by a short unpaved road. A natural spring flows at 105 °F into a small pool directly on the river's edge. The surrounding area preserves ruins of a 1920s resort and bath house. The round-trip walk from the parking area to the spring and back along the river is about 1.5 miles and is mostly flat."
      image: "/images/parks/national/big-bend-national-park/11-hot-springs-historic-district.jpg"
      alt: "A pool of water encircled by a square rock foundation rises above a river."
      credit: "NPS/CA Hoyt"
    - name: "Dark Skies and Stargazing"
      description: "Big Bend is one of the most remote national parks in the lower 48 states and has some of the least light-polluted skies of any national park. The Milky Way is visible to the naked eye on most clear nights from spring through fall. The park's ranger-led night sky programs run at the Chisos Basin Amphitheater most weekends from March through November. Perseid and Leonid meteor showers are visible with no equipment from any open overlook."
      image: "/images/parks/national/big-bend-national-park/12-dark-skies-and-stargazing.jpg"
      alt: "The Milky Way galaxy streaks across the sky."
      credit: "NPS"

