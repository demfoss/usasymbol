faq:
  - question: "Where is Big Bend National Park?"
    answer: "Big Bend is in the remote southwest corner of Texas, along the Rio Grande border with Mexico. The nearest town with services is Terlingua/Study Butte, just outside the west entrance. The nearest sizable city is Alpine, about 80 miles north. Midland International Airport (MAF) is approximately 165 miles away."
  - question: "When is the best time to visit Big Bend National Park?"
    answer: "Spring (March–May) is the best season for weather and birding, with desert temperatures of 60–85 °F and peak migration. Fall (October–November) is nearly as good and less crowded. Summer temperatures in the desert exceed 100 °F, making early morning or mountain hiking the only safe options. Winter is mild and quiet, though Chisos Mountain trails can be icy."
  - question: "How much does it cost to enter Big Bend National Park?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals on foot or bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers Big Bend and all other national parks for 12 months. Confirm current fees at nps.gov/bibe."
  - question: "Do I need a reservation to visit Big Bend?"
    answer: "No timed-entry reservation is required to drive into the park. Chisos Basin Campground requires advance reservations via Recreation.gov during spring and fall peak weeks. Rio Grande Village and Cottonwood campgrounds are first-come, first-served. Backcountry permits are issued in person at Panther Junction Visitor Center."
  - question: "What is the best hike in Big Bend National Park?"
    answer: "Lost Mine Trail (4.8 miles round trip, 1,100 ft gain, moderate) offers the best views for the effort — a ridgeline walk above the Chisos with views into Mexico and across Pine Canyon. For a shorter option, Santa Elena Canyon Trail (1.7 miles round trip) enters the 1,500-foot canyon walls along the Rio Grande. The South Rim Trail (12.5 miles, strenuous) is the park's most dramatic route but requires an overnight permit."
  - question: "Can you see birds at Big Bend National Park?"
    answer: "Yes — Big Bend has the highest recorded bird count of any U.S. national park, with more than 450 species. Spring migration (April–May) is peak season. The Colima warbler nests in Boot Canyon in the Chisos Mountains and can only be seen in the U.S. here. Rio Grande Village nature trail and the Chisos Basin are the most productive areas for birders."
  - question: "How remote is Big Bend National Park?"
    answer: "Very remote. The nearest full-service gas station and grocery store are in Terlingua or Study Butte, just outside the park. Alpine, 80 miles north, is the nearest town with a hospital and full services. Fill your gas tank and bring several days of food and water before entering. Cell service is unavailable throughout most of the park."

  - question: What state is Big Bend National Park in?
    answer: Big Bend National Park is in [Texas](/states/texas), near Alpine, Texas.
