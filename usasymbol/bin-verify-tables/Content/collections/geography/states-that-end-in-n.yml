sections:
  - id: "states-ending-n"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That End in N"
    subsections:
      - subtitle: "Michigan"
        text: |
          **Letters:** 8
          **Ending:** -gan

          Michigan ends in N and has Lansing as its capital. Four of the five Great Lakes touch the state.

          The terminal N supplies the spelling criterion, while the Great Lakes connection distinguishes Michigan within this four-state group.
      - subtitle: "Oregon"
        text: |
          **Letters:** 6
          **Ending:** -gon

          Oregon ends in N and has Salem as its capital. Its Pacific coastline lies directly south of Washington.

          The last letter qualifies Oregon, and its 6-letter name makes it the shortest entry here.
      - subtitle: "Washington"
        text: |
          **Letters:** 10
          **Ending:** -ton

          Washington ends in N and has Olympia as its capital. It is the only state named for a U.S. president.

          The final N places Washington on the list, while its 10 letters make it the longest of the four names.
      - subtitle: "Wisconsin"
        text: |
          **Letters:** 9
          **Ending:** -sin

          Wisconsin ends in N and has Madison as its capital. Lakes Michigan and Superior border the state.

          Its terminal N qualifies the name, and its Great Lakes geography pairs it with Michigan rather than the two Pacific states.

