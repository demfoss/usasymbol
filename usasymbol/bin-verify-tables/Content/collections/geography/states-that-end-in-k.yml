    subsections:
      - subtitle: "New York"
        text: |
          **Letters:** 7
          **Ending:** -ork

          New York ends in K and has Albany as its capital. The English renamed the former New Netherland colony for the Duke of York in 1664.

          Its final K is unmatched among state names, so New York is the collection's only entry.

