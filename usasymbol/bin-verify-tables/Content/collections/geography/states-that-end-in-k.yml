faq:
  - question: "What state ends in K?"
    answer: "New York is the only U.S. state that ends in K."
  - question: "How many states end in K?"
    answer: "Exactly one state ends in K: New York."
  - question: "How many letters are in New York?"
    answer: "New York has seven letters when the space is excluded and eight characters when the space is counted."
  - question: "Do any other New states end in K?"
    answer: "No. New Hampshire ends in E, New Jersey in Y, and New Mexico in O."

