faq:
  - question: "What states start with New?"
    answer: "New Hampshire, New Jersey, New Mexico, and New York are the four states that start with New."
  - question: "How many states start with New?"
    answer: "Four of the 50 U.S. state names begin with the complete word New."
  - question: "Which New state is shortest?"
    answer: "New York is shortest at seven letters when its space is excluded."
