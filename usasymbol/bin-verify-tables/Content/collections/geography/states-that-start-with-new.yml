sections:
  - id: "states-starting-new"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That Start With New"
    subsections:
      - subtitle: "New Hampshire"
        text: |
          **Abbreviation:** NH
          **Capital:** Concord

          New Hampshire begins with New and has 12 letters when its space is excluded. The name refers to Hampshire in southern England.

          Its opening word places New Hampshire in this group, while its length makes it the longest of the four names.
      - subtitle: "New Jersey"
        text: |
          **Abbreviation:** NJ
          **Capital:** Trenton

          New Jersey begins with New and has 9 letters without its space. Jersey refers to the Channel Island of the same name.

          Its first complete word qualifies New Jersey as one of the three northeastern entries.
      - subtitle: "New Mexico"
        text: |
          **Abbreviation:** NM
          **Capital:** Santa Fe

          New Mexico begins with New and has 9 letters without its space. The project table places it in the West region.

          Its opening word qualifies New Mexico and distinguishes it geographically from the three northeastern states.
      - subtitle: "New York"
        text: |
          **Abbreviation:** NY
          **Capital:** Albany

          New York begins with New and has 7 letters without its space. York refers to the English title held by the Duke of York.

          Its first word qualifies New York, and its 7 letters make it the shortest name in the group.

