sections:
  - id: "states-ending-e"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That End in E"
    paragraphs:
      - "The four names range from Maine's 5 letters to New Hampshire's 12. Their final E is silent in three names and pronounced in Tennessee."
    subsections:
      - subtitle: "Delaware"
        text: |
          **Letters:** 8
          **Ending:** -are

          Delaware ends in E and takes its name from the Delaware River and Bay. Dover is the state capital.

          Its final written letter is the objective reason Delaware belongs here, even though the E is silent in ordinary pronunciation.
      - subtitle: "Maine"
        text: |
          **Letters:** 5
          **Ending:** -ine

          Maine ends in E and has the shortest name in this group. Augusta is its capital.

          The last character places Maine on the list, while its five-letter length makes it the compact contrast to New Hampshire.
      - subtitle: "New Hampshire"
        text: |
          **Letters:** 12
          **Ending:** -ire

          New Hampshire ends in E and has the longest name in the group when spaces are excluded. Concord is its capital.

          Its terminal E qualifies the name, and its 12 letters define the upper end of this set's length range.
      - subtitle: "Tennessee"
        text: |
          **Letters:** 9
          **Ending:** -see

          Tennessee ends with a double E and is the only state whose name ends in **-see**. Nashville is its capital.

          The final E is both written and pronounced, making Tennessee the clearest phonetic example in the set.

