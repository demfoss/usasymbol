faq:
  - question: "How many states end in E?"
    answer: "Four U.S. states end in E: Delaware, Maine, New Hampshire, and Tennessee."
  - question: "What is the shortest state ending in E?"
    answer: "Maine is the shortest at five letters. Delaware has eight, Tennessee has nine, and New Hampshire has twelve without its space."
  - question: "Which state ends with two E letters?"
    answer: "Tennessee ends with a double E. No other state name has the same final two-letter pattern."
  - question: "Which states ending in E are on the East Coast?"
    answer: "Delaware, Maine, and New Hampshire are the three E-ending states on the East Coast."

