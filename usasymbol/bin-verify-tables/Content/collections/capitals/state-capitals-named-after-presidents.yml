sections:
  - id: the-four-capitals-table
    icon: "fa-solid fa-table"
    title: "State Capitals Named After Presidents: The Complete List"
    snippet_paragraph: "Exactly four U.S. state capitals are named after American presidents. The table below lists each city with its president, order of presidency, and year of naming."
    table:
      headers: ["State Capital", "State", "President Honored", "President #", "Year Named Capital"]
      rows:
        - ["Jefferson City", "Missouri", "Thomas Jefferson", "3rd", "1821"]
        - ["Jackson", "Mississippi", "Andrew Jackson", "7th", "1821"]
        - ["Madison", "Wisconsin", "James Madison", "4th", "1836"]
        - ["Lincoln", "Nebraska", "Abraham Lincoln", "16th", "1867"]

  - id: jefferson-city-card
    icon: "fa-solid fa-landmark"
    style: compare-cards
    title: "Jefferson City, Missouri | Thomas Jefferson, 3rd President"
    subsections:
      - subtitle: "Jefferson City, Missouri"
        text: "Jefferson City was selected as Missouri's permanent capital in 1821, the same year Missouri joined the Union. It sits on a bluff above the Missouri River, the same river Lewis and Clark followed on Jefferson's orders during the Corps of Discovery expedition."
      - subtitle: "Thomas Jefferson (1743-1826)"
        text: "The legislature named the city to honor the author of the Declaration of Independence and the president who authorized the **Louisiana Purchase**, the land deal that brought Missouri into the United States."

  - id: jackson-card
    icon: "fa-solid fa-landmark"
    style: compare-cards
    title: "Jackson, Mississippi | Andrew Jackson, 7th President"
    subsections:
      - subtitle: "Jackson, Mississippi"
        text: "Mississippi's legislature named its new capital after Andrew Jackson in 1821, replacing Natchez. It is one of two presidential capitals named that year, alongside Jefferson City, Missouri."
      - subtitle: "Andrew Jackson (1767-1845)"
        text: "At the time of naming, Jackson was a national hero for his victory at the **Battle of New Orleans** in 1815 but had not yet been elected president. He is the only person on this list whose capital was named before he took office."

  - id: madison-card
    icon: "fa-solid fa-landmark"
    style: compare-cards
    title: "Madison, Wisconsin | James Madison, 4th President"
    subsections:
      - subtitle: "Madison, Wisconsin"
        text: "Madison was platted as the capital of Wisconsin Territory in 1836, on an isthmus between Lake Mendota and Lake Monona. Wisconsin became a state in 1848, with Madison continuing as the capital."
      - subtitle: "James Madison (1751-1836)"
        text: "Madison was the fourth president and principal architect of the **U.S. Constitution** and the Bill of Rights. He died in June 1836, the same year the territory was organized, making the naming a tribute to a Founding Father who had died months before."

  - id: lincoln-card
    icon: "fa-solid fa-landmark"
    style: compare-cards
    title: "Lincoln, Nebraska | Abraham Lincoln, 16th President"
    subsections:
      - subtitle: "Lincoln, Nebraska"
        text: "Lincoln became Nebraska's state capital in 1867, replacing Lancaster. The Nebraska State Capitol, completed in 1932, is a 400-foot Art Deco tower topped with a bronze statue of \"The Sower.\""
      - subtitle: "Abraham Lincoln (1809-1865)"
        text: "Lincoln signed the act enabling Nebraska's path to statehood in 1864, a year before his assassination. Nebraska entered the Union in 1867, and the legislature named the capital after the president who made statehood possible. Lincoln is the only figure on this list honored posthumously."

  - id: washington-anomaly
    icon: "fa-solid fa-circle-question"
    title: "The Washington Trick Question"
    paragraphs:
      - "No state capital is named after George Washington. This surprises many people, because the state of Washington carries his name."
      - "Washington's capital is **Olympia**, named after the Olympic Mountains, which take their name from Mount Olympus in Greece. It has no connection to any president."
      - "Washington D.C. is named after George Washington but is the federal capital, not a state capital. D.C. is not a state and has no Senate representation."

  - id: columbus-case
    icon: "fa-solid fa-compass"
    title: "Why Columbus, Ohio Doesn't Count"
    paragraphs:
      - "Columbus, Ohio is the most common wrong answer to this question. Christopher Columbus was an Italian explorer sailing for Spain who died in 1506, nearly 300 years before the United States existed."
      - "Ohio's capital was named in 1812 as a tribute to the explorer's legacy of discovery, not as a presidential honor. Columbia, South Carolina is off the list for the same reason."

  - id: naming-patterns
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Only Four?"
    paragraphs:
      - "Three of the four capitals were named in 1821-1836, when reverence for the founding generation was at its peak. Lincoln is the outlier, named in 1867 after the Civil War and Lincoln's assassination."
      - "Most state capitals took their names from geographic features, Indigenous place names, or European cities. After 1870, no new state capital was named after a president."

  - id: other-cities-named-after-presidents
    icon: "fa-solid fa-map-pin"
    title: "Presidential Names That Are Not State Capitals"
    subsections:
      - subtitle: "Washington D.C."
        text: "The federal capital, not a state capital. Named for George Washington. D.C. is a federal district with no Senate representation."
      - subtitle: "Montgomery, Alabama"
        text: "Named after General Richard Montgomery, a Revolutionary War officer, not a president."
      - subtitle: "Harrison, Cleveland, Grant, and others"
        text: "Many U.S. cities carry presidential names, but none of these are state capitals."


faq:
  - question: "How many state capitals are named after presidents?"
    answer: "Four: Lincoln (Nebraska), Madison (Wisconsin), Jackson (Mississippi), and Jefferson City (Missouri). No other U.S. state capital is named after an American president."

  - question: "Which presidents have a state capital named after them?"
    answer: "Thomas Jefferson (Jefferson City, Missouri), Andrew Jackson (Jackson, Mississippi), James Madison (Madison, Wisconsin), and Abraham Lincoln (Lincoln, Nebraska)."

  - question: "Is Jackson, Mississippi named after Andrew Jackson?"
    answer: "Yes. Jackson was named after Andrew Jackson in 1821, before he was elected president. At the time he was a national hero for his victory at the Battle of New Orleans in 1815."

  - question: "Is Jefferson City named after Thomas Jefferson?"
    answer: "Yes. Jefferson City was named Missouri's capital in 1821 to honor Thomas Jefferson, who authorized the Louisiana Purchase that made Missouri part of the United States."

  - question: "Is Madison named after a president?"
    answer: "Yes. Madison, Wisconsin is named after James Madison, the 4th President and principal author of the U.S. Constitution. The city was named in 1836, the year Madison died."

  - question: "Is Columbus, Ohio named after a president?"
    answer: "No. Columbus is named after Christopher Columbus, an Italian explorer who died in 1506. He was never a U.S. president."

  - question: "Are there 5 state capitals named after presidents?"
    answer: "No. There are exactly four. Washington D.C. is sometimes cited as a fifth, but it is the federal capital, not a state capital."
