page:
  h1: "Which US State Capitals Are Named After Presidents?"
  intro_title: "Four Capitals, Four Presidents: One Famous Trick Question"

  quick_answer:
    - "Four state capitals are named after U.S. presidents: Lincoln (Nebraska), Madison (Wisconsin), Jackson (Mississippi), and Jefferson City (Missouri)."
    - "All four were named between 1821 and 1867, during or shortly after their states joined the Union."
    - "Washington D.C. does not count: it is the federal capital, not a state capital. The state of Washington's capital is Olympia, named after the Olympic Mountains."
    - "Columbus, Ohio is not on the list. Christopher Columbus was an explorer who died in 1506, not a U.S. president."
    - "No state capital has been renamed to honor a president since the 19th century."

  methodology: "State capitals only; presidential naming confirmed by state legislative records."
  sources:
big_stat:
  number: "4"
  description: "U.S. state capitals named after presidents, out of 50 total."


expert_quote:
  text: "The naming of a capital after a revered statesman was among the most visible acts of civic symbolism available to a new state legislature. It aligned the community's identity with national ideals at the moment of founding."
  source: "Historians of early American urban naming traditions"


