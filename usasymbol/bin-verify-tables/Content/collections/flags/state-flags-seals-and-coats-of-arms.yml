sections:
  - id: "flag-seal-coat-of-arms-difference"
    icon: "fa-solid fa-shield-halved"
    title: "How a State Flag, Seal, and Coat of Arms Differ"
    paragraphs:
      - "A state flag is the rectangular banner flown on poles and displayed publicly, usually adopted by a state legislature as the official state ensign. A state seal is a circular device used to authenticate documents, proclamations, and government correspondence; it typically carries the state's name, motto, and year of statehood around a central image."
      - "A coat of arms is the shield-and-crest emblem at the center of that design, the heraldic core that seal makers, and in many cases flag designers, build around. Several states place that same shield directly on their flag or inside their seal's border, which is why the three emblems often look related at a glance."

  - id: "seal-on-blue-flags"
    icon: "fa-solid fa-flag"
    title: "States With a Seal on Their Flag"
    paragraphs:
      - "Sixteen state flags consist of nothing more than the state seal centered on a plain blue field: Connecticut, Idaho, Kansas, Kentucky, Maine, Michigan, Montana, Nebraska, New Hampshire, New York, Oregon, Pennsylvania, South Dakota, Vermont, Virginia, and Wisconsin. A 2001 survey by the North American Vexillological Association ranked this format near the bottom of 72 US and Canadian flags for failing basic design criteria."
      - "Minnesota and Utah both retired seal-on-blue flags in 2024. Minnesota replaced its seal with a single eight-pointed North Star, and Utah replaced its seal with a golden beehive, moving both states away from the format most others on this list still use."

  - id: "state-insignia-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "State Flag, Seal, and Coat of Arms Facts"
    facts:
      - "Sixteen state flags place the official state seal on a plain blue field, the single most common state flag format in the country."
      - "Missouri's flag rings its state coat of arms with 24 gold stars, one for each state in the Union when Missouri joined in 1821."
      - "Ohio is the only U.S. state flag that is not rectangular. Its swallowtail burgee shape carries 17 stars instead of a seal."
      - "Illinois added the word ILLINOIS beneath its state seal in 1970, after a soldier serving in Vietnam could not identify the flag among other state flags on display."
      - "Minnesota and Utah both replaced seal-on-blue flag designs in 2024, moving away from the format most other states still use."
      - "Alabama's coat of arms places the emblems of five governments, France, Spain, Great Britain, the Confederacy, and the United States, on a single quartered shield."

faq:
  - question: "What is the difference between a state seal and a state flag?"
    answer: "A state seal is a circular device used to authenticate official documents, proclamations, and legal papers. A state flag is the rectangular banner flown on poles and displayed publicly. Many states, including Pennsylvania and Wisconsin, place their seal directly on their flag, which is why the two often look identical at a glance."

  - question: "Which state flags just show the state seal on a blue background?"
    answer: "Sixteen states use this format: Connecticut, Idaho, Kansas, Kentucky, Maine, Michigan, Montana, Nebraska, New Hampshire, New York, Oregon, Pennsylvania, South Dakota, Vermont, Virginia, and Wisconsin. Minnesota and Utah both used this format until they adopted new flag designs in 2024."

  - question: "What is a state's coat of arms used for?"
    answer: "A coat of arms is the shield-and-crest emblem at the center of a state's heraldry, most often reused as the central image inside the state seal. Alabama's coat of arms, for example, places the emblems of five different governments that once held authority over its territory on a single shield."

  - question: "Does every U.S. state have its own flag, seal, and coat of arms?"
    answer: "All 50 states maintain an official flag and an official seal. Most states also display a distinct coat of arms, typically the shield or central emblem drawn from their seal, shown separately for reference in the table above."

  - question: "Why do so many state flags look alike?"
    answer: "Sixteen states place their seal on a plain blue field with no other design element, which makes them easy to confuse from a distance. A 2001 vexillology survey ranked this format among the least distinctive of 72 North American flags, and Minnesota and Utah have since redesigned their flags to stand apart from the group."

