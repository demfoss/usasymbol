sections:
  - id: us-malaysia
    icon: "fa-solid fa-flag"
    style: compare-cards
    title: "Malaysia Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag has **13 red and white stripes** for the original colonies and **50 stars** for the states. The blue canton makes the star field the visual anchor."
      - subtitle: "Malaysia flag"
        text: "Malaysia's **Jalur Gemilang** uses red and white stripes with a blue canton, which creates the immediate resemblance. The crescent and 14-point star mark Islam, federation, and unity rather than U.S.-style state stars. For state-level lookalikes, compare [Texas and Chile](/collections/flags/texas-flag-vs-chile-flag)."

  - id: us-liberia
    icon: "fa-solid fa-star"
    style: compare-cards
    title: "Liberia Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. design uses a field of many stars to represent states inside one federal union. Its 13 stripes remain fixed even as the star count changes."
      - subtitle: "Liberia flag"
        text: "Liberia is the closest national flag lookalike. It has **11 red and white stripes** and a blue canton with one white star. The CIA World Factbook explicitly notes that the design is based on the U.S. flag, unlike most [state flags that look like country flags](/collections/flags/state-flags-that-look-like-country-flags)."

  - id: us-bikini-atoll
    icon: "fa-solid fa-radiation"
    style: compare-cards
    title: "Bikini Atoll Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag represents a federal union through stripes and stars. Bikini Atoll borrows that structure because its modern history is directly tied to U.S. nuclear testing."
      - subtitle: "Bikini Atoll flag"
        text: "Bikini Atoll uses a blue canton with stars and red-white striping, but the meaning is critical rather than imitative. The separated stars represent displaced island communities, and the text means 'Everything is in the hands of God.'"

  - id: us-brittany
    icon: "fa-solid fa-flag"
    style: compare-cards
    title: "Brittany Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag uses red and white stripes with a blue canton. The canton carries stars, making the upper-left field the main identifying zone."
      - subtitle: "Brittany flag"
        text: "Brittany's **Gwenn-ha-du** uses nine black and white stripes with an ermine canton. It looks structurally American, but the symbols come from Breton heraldry."

  - id: us-cuba
    icon: "fa-solid fa-play"
    style: compare-cards
    title: "Cuba Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag combines red, white, blue, stripes, and stars inside a square canton. That mix is why Cuba can look related at a glance."
      - subtitle: "Cuba flag"
        text: "Cuba uses five blue and white stripes with a red triangle and one white star. The geometry is different: the star sits in a triangle, not a canton. The CIA World Factbook notes that Cuba's star was taken from the flag of Texas."

  - id: us-puerto-rico
    icon: "fa-solid fa-play"
    style: compare-cards
    title: "Puerto Rico Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag uses 13 stripes and a blue canton with many stars. Puerto Rico keeps the American color language but changes the structure."
      - subtitle: "Puerto Rico flag"
        text: "Puerto Rico uses five red and white stripes with a blue triangle and one white star. It was designed as a color-inverted companion to Cuba's flag. See the [state flags that look like country flags](/collections/flags/state-flags-that-look-like-country-flags) comparison for that pair."

  - id: us-togo
    icon: "fa-solid fa-star"
    style: compare-cards
    title: "Togo Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag uses a star-filled canton above a field of horizontal stripes. That canton-and-stripes structure is the shared visual grammar."
      - subtitle: "Togo flag"
        text: "Togo uses five green and yellow stripes with a red canton and one white star. The layout reads as U.S.-like, but the palette comes from Pan-African colors."

  - id: us-uruguay
    icon: "fa-solid fa-sun"
    style: compare-cards
    title: "Uruguay Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag uses stripes for the original colonies and stars for the states. Uruguay keeps the stripes-and-canton structure but swaps the symbol."
      - subtitle: "Uruguay flag"
        text: "Uruguay uses nine blue and white stripes with a white canton containing the **Sun of May**. Britannica describes the design as combining the Sun of May with a pattern related to the United States flag."

  - id: us-texas
    icon: "fa-solid fa-star"
    style: compare-cards
    title: "Texas Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The U.S. flag has 13 stripes and a blue canton filled with 50 stars. Texas uses the same national colors, but its structure is much simpler."
      - subtitle: "Texas flag"
        text: "Texas uses a full-height blue hoist stripe with one white star, plus white over red horizontal stripes. The design sits closer to Chile than to the U.S.; compare [Texas vs Chile](/collections/flags/texas-flag-vs-chile-flag) for the layout difference."

  - id: us-grand-union
    icon: "fa-solid fa-clock-rotate-left"
    style: compare-cards
    title: "Grand Union Flag vs U.S. Flag"
    subsections:
      - subtitle: "United States flag"
        text: "The modern U.S. flag replaced the British canton with a blue star field. For the color story, see [meaning of the colors on the U.S. flag](/collections/flags/meaning-of-the-colors-on-the-us-flag)."
      - subtitle: "Grand Union Flag"
        text: "The Grand Union Flag is the direct predecessor of the Stars and Stripes. It used 13 colonial stripes with the British Union Flag in the canton before the 1777 flag resolution introduced stars."

  - id: robert-heft-and-the-50-star-flag
    icon: "fa-solid fa-user-pen"
    title: "50-Star U.S. Flag Design"
    paragraphs:
      - "Robert G. Heft did not invent the U.S. flag's stripe-and-canton system. He designed the 50-star arrangement as a high school project before Hawaii became a state."
      - "That distinction matters. The look copied by other flags is older than Heft's version: stripes, canton, and stars were already the American visual language before the 50-star update."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "U.S. Flag Lookalike Facts"
    facts:
      - "Liberia is the closest current national flag lookalike to the U.S. flag."
      - "Malaysia has 14 stripes, not 13, and a crescent with a 14-point star in the canton."
      - "Uruguay's flag uses nine stripes for the country's original departments."
      - "Cuba and Puerto Rico use triangles instead of cantons."
      - "Bikini Atoll's flag intentionally echoes the U.S. flag because of the atoll's nuclear-testing history."
      - "The Grand Union Flag had 13 stripes before the Stars and Stripes replaced the British canton with stars in 1777."
      - "Robert G. Heft designed the 50-star arrangement, not the original U.S. flag layout."


faq:
  - question: "What flags look like the US flag?"
    answer: "The closest flags that look like the US flag are Liberia, Malaysia, Bikini Atoll, Uruguay, Togo, Brittany, Cuba, Puerto Rico, Texas, and the Grand Union Flag. They share stripes, a canton, stars, or the red-white-blue color system."

  - question: "Which country flag looks most like the US flag?"
    answer: "Liberia is the country flag that looks most like the US flag. It uses red and white stripes, a blue canton, and one white star. The main differences are 11 stripes instead of 13 and one star instead of 50."

  - question: "Why does Malaysia's flag look like the American flag?"
    answer: "Malaysia's flag looks like the American flag because both use horizontal red and white stripes with a blue canton. Malaysia uses 14 stripes and a yellow crescent with a 14-point star, which refer to the federation and Islam."

  - question: "Was Liberia's flag copied from the United States flag?"
    answer: "Liberia's flag was directly based on the United States flag. The similarity reflects Liberia's founding history and its connection to formerly enslaved African Americans. Liberia reduced the design to 11 stripes and one large star."

  - question: "Does Cuba's flag copy the US flag?"
    answer: "No. Cuba's flag shares red, white, blue, stripes, and a lone star, but it uses a red triangle instead of a canton. The CIA World Factbook notes that Cuba's white star was taken from the flag of Texas."

  - question: "Why does Uruguay's flag look like the US flag?"
    answer: "Uruguay's flag looks like the US flag because it uses horizontal stripes and a canton. Britannica notes that the design combined the Sun of May with a flag pattern connected to the United States. Uruguay uses nine blue-white stripes and no stars."

  - question: "What was the Grand Union Flag?"
    answer: "The Grand Union Flag was an early American flag with 13 red and white stripes and the British Union Flag in the canton. It was displayed in 1776 before the Stars and Stripes replaced the British canton with stars."

  - question: "Who designed the current 50-star US flag?"
    answer: "Robert G. Heft designed the 50-star arrangement as a high school project before Hawaii became the 50th state. He did not design the original American flag system of 13 stripes and a canton."

