faq:
  - question: "Is it really illegal to get a tattoo in Arkansas?"
    answer: "Arkansas maintained a statewide ban on tattooing for most of the 20th century under its professional licensing code. The legislature repealed the prohibition in 2003, making Arkansas the last U.S. state to lift such a restriction."
  - question: "Is mispronouncing 'Arkansas' actually illegal?"
    answer: "No. Arkansas law officially declares the correct pronunciation to be 'Arkansaw,' but no penalty has ever been attached to saying it differently. Calling it 'Ar-KAN-sas' is wrong by statute, not criminal."
  - question: "Can you buy a car on Sunday in Arkansas?"
    answer: "No. Arkansas Sabbath laws prohibit licensed auto dealers from selling vehicles on Sunday. The restriction is statewide, applies to all franchised dealerships, and has been upheld by courts."
  - question: "What is the weirdest law still on the books in Arkansas?"
    answer: "The Sunday car sales ban is the most actively enforced oddity. Every licensed dealership in the state is closed by law on Sundays — not by choice, and not by store policy."
  - question: "Why does Arkansas have so many old laws still in effect?"
    answer: "Arkansas's legislature meets for only 60 days in odd-numbered years. That limited calendar leaves almost no time for reviewing and repealing outdated statutes. Most survive simply because they never reach the agenda."
