faq:
  - question: "What is Alabama's state insect?"
    answer: "Alabama's state insect is the monarch butterfly, adopted by the Alabama Legislature in 1989."

  - question: "Why does Alabama have three official insect symbols?"
    answer: "Alabama named the monarch butterfly its state insect and the eastern tiger swallowtail its separate state butterfly, both in 1989, then added the queen honey bee as state agricultural insect in 2015 to recognize honey bees' role in farming."

  - question: "Why do so many states choose the monarch butterfly?"
    answer: "The monarch's wide range across nearly every U.S. state and its recognizable orange-and-black pattern make it a popular pick for a state insect or state butterfly."

