page:
  h1: "List of State Insects"

  quick_answer:
    - "State insects are official insects designated by state legislatures, usually butterflies, honeybees, or beetles chosen to represent a state's wildlife or agriculture."
    - "Alabama recognizes three separate insect symbols: the monarch butterfly (state insect, 1989), the eastern tiger swallowtail (state butterfly, 1989), and the queen honey bee (state agricultural insect, 2015)."
    - "This page currently covers Alabama. More states will be added as pages are published."

  intro_paragraphs:
    - "State insects are a smaller, lesser-known category of official state symbols compared to state birds or flowers. Many were adopted after student-led campaigns rather than legislative initiative."
    - "Several states, including Alabama, recognize more than one insect symbol at once, splitting the category into designations such as state insect, state butterfly, and state agricultural insect."

  sections:
    - id: insects-overview
      icon: fa-solid fa-bug
      title: Official State Insects
      paragraphs:
        - "The table below lists official state insect-related symbols with their designation, adoption year, and a short note on why or how each was chosen."
        - "Alabama adopted the monarch butterfly as its state insect in 1989, the same year it separately named the eastern tiger swallowtail as its state butterfly. In 2015, Alabama added a third designation, naming the queen honey bee its state agricultural insect."

  methodology: "Adoption years reflect the year of official legislative designation, drawn from each state's official code and legislative history."

