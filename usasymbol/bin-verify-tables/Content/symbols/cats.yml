page:
  h1: "Official State Cats of the United States"

  quick_answer:
    - "Three U.S. states have official state cats: Maine (Maine Coon Cat), Maryland (Calico Cat), and Massachusetts (Tabby Cat). Maine was first in 1985; Maryland was last in 2001."
    - "Maryland chose the Calico Cat because its orange, black, and white coat mirrors two other Maryland symbols: the Baltimore Oriole and the Baltimore Checkerspot butterfly."
    - "Massachusetts designated the Tabby Cat in 1988 after schoolchildren campaigned for the designation. Maine's Maine Coon is the only recognized breed on the list; Calico and Tabby are coat patterns."

  intro_paragraphs:
    - "Only three U.S. states have official state cats: Maine, Maryland, and Massachusetts. Maine chose the Maine Coon Cat in 1985, Massachusetts chose the Tabby Cat in 1988, and Maryland chose the Calico Cat in 2001."
    - "The state cat list is short by design. Most states have official birds, flowers, and mammals, but official cats remain rare. Each of the three designations has its own story: a breed tied to a state's identity, a coat pattern chosen for its colors, and a campaign driven by schoolchildren."

  insights:
    - "Maine was the first state to designate an official cat. The Maine Coon Cat has been Maine's state cat since 1985, more than fifteen years before Maryland added the Calico in 2001."
    - "Maryland's Calico was chosen because its tri-color coat matches two existing Maryland state symbols: the black-and-orange Baltimore Oriole and the Baltimore Checkerspot butterfly."
    - "Massachusetts's Tabby Cat was designated in 1988 after schoolchildren supported the campaign, the same grassroots pattern that produced several state dog designations in the same era."
    - "Only the Maine Coon is a recognized cat breed. Calico and tabby are coat patterns that appear across many different breeds."

  methodology: "This page lists official state cat designations enacted by state legislatures. Coat pattern designations (Calico, Tabby) are noted in the table."

  sources:
