faq:
  - question: "How many U.S. states have official state cats?"
    answer: "Three states have official state cats: Maine (Maine Coon Cat, 1985), Maryland (Calico Cat, 2001), and Massachusetts (Tabby Cat, 1988). No other state has designated an official cat."

  - question: "Which state has the Maine Coon as its state cat?"
    answer: "Maine designated the Maine Coon Cat as its official state cat in 1985. The breed is closely associated with Maine and New England, and takes its name from the state. It is the only recognized breed on the state cat list."

  - question: "What is Maryland's state cat?"
    answer: "Maryland's state cat is the Calico Cat, designated in 2001. Maryland chose the calico because its orange, black, and white coat matches the colors of the Baltimore Oriole (state bird) and the Baltimore Checkerspot butterfly (state insect)."

  - question: "What is Massachusetts's state cat?"
    answer: "Massachusetts's state cat is the Tabby Cat, designated in 1988 after schoolchildren campaigned for the designation. Tabby is a coat pattern, not a breed -- it covers striped, spotted, and blotched markings found across many cat breeds."

  - question: "Are calico and tabby cats breeds?"
    answer: "No. Calico and tabby are coat patterns, not breeds. A calico cat has a tri-color coat of orange, black, and white. A tabby cat has striped, spotted, or swirled markings. Both patterns can appear across many different breeds. Only Maine's Maine Coon is a recognized breed."

  - question: "Why don't more states have official cats?"
    answer: "Most states have official birds, flowers, and mammals, but official cats are rare. Unlike state dogs, which were driven by breed clubs and school campaigns, cats have had fewer organized advocates. Only three states had a specific enough reason -- a local breed, a color match, or a student campaign -- to pass a designation."

