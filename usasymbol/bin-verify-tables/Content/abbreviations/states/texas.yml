formation_summary: Texas uses the USPS abbreviation TX.
formation_detail: USPS adopted TX for Texas in 1963. The older form Tex. still appears in
  older publications, but TX is the standard postal abbreviation now.
search_intent_summary: TX is used for Texas in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: TX is more often checked against the older written form Tex. than
  against another state's postal code.
