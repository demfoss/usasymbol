formation_summary: Nevada's USPS abbreviation is NV.
formation_detail: USPS has used NV for Nevada since 1963. The older abbreviation Nev. still
  appears in older sources, but NV is the standard postal form today.
search_intent_summary: NV is used for Nevada in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: NV is commonly checked against NE, NH, and NJ because several N-state
  abbreviations differ by only one letter.
