type: State Abbreviation Override
state_slug: arkansas
traditional_abbreviation: Ark.
formation_summary: Arkansas uses the USPS abbreviation AR.
formation_detail: AR became the standard postal abbreviation for Arkansas in 1963. Older
  abbreviations such as Ark. still appear in older material, but AR is the form used in
  current addresses and forms.
search_intent_summary: Use AR for Arkansas in postal addresses, shipping systems, official
  forms, and data entry.
similar_codes_summary: AR is commonly compared with AL, AK, and AZ because the A-state codes
  are easy to misread when entered quickly.
