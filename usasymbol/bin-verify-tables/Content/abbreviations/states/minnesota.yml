state_slug: minnesota
traditional_abbreviation: Minn.
formation_summary: Minnesota's USPS abbreviation is MN.
formation_detail: MN has been Minnesota's standard postal abbreviation since 1963. Minn.
  still appears in older writing, but MN is the form used in current addresses and forms.
search_intent_summary: Use MN for Minnesota in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: MN is often compared with MI, MS, and MO because the M-state codes
  are easy to misread in lists and spreadsheets.
