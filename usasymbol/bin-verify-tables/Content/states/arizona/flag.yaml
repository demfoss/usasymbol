faq:
  - question: "Who designed the Arizona state flag?"
    answer: "Colonel Charles W. Harris designed the Arizona flag in 1910 when the rifle team needed an emblem for national matches. Carl Hayden, Arizona's first U.S. Representative, contributed to the final design. The bill passed the Arizona Legislature on February 27, 1917."
  - question: "What does the copper star on Arizona's flag mean?"
    answer: "The copper star represents Arizona's copper mining industry. Arizona ranked first in U.S. copper production in 1917 when the flag was adopted, and has held that position since. The metallic copper color is defined in state law."
  - question: "Why does Arizona's flag have 13 rays?"
    answer: "Thirteen, one for each original colony. Harris included that specific number to connect a new state, admitted in 1912, to the country's 1776 founding. He also described the rays as a sun setting in the west, giving the number a geographic meaning."
  - question: "Why are the rays red and gold?"
    answer: "Red and gold came from Spain's colonial banner. Coronado crossed Arizona in 1540 searching for the Seven Cities of Cibola, and Harris chose those colors to mark that history. Blue in the lower half was chosen separately to match the U.S. flag."
  - question: "Did Arizona's governor sign the flag into law?"
    answer: "No. The bill landed on Governor Campbell's desk in February 1917. He neither signed nor vetoed it, and it passed by operation of law. His reasoning was never recorded, and he served out his term without addressing the matter publicly."

