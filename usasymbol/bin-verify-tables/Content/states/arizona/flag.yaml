seo_title: "Flag of Arizona | History, Meaning & Colors"
seo_description: "Arizona's flag was sketched on an envelope in 1910 for a rifle team. Adopted in 1917, it became law without the governor's signature."
meaning: "Arizona's flag began as a rifle team banner in 1910. Thirteen rays record the original colonies. A copper star names Arizona's largest industry. Red and gold honor the Spanish explorers who crossed the territory. Navy blue matches the U.S. flag."

intro_text: "Arizona's state flag shows thirteen alternating **red and gold rays** above a **copper star** and **navy blue** field, adopted in 1917 by the Arizona Legislature. Colonel Charles W. Harris drew the design in 1910 for a National Guard rifle team at the national rifle matches in Ohio, not as a state symbol."

