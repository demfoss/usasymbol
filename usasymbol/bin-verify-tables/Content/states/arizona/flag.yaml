  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "The copper star is specified as metallic copper in state law, but manufactured flags typically show it in an orange-tan shade."
      - "Carl Hayden, who contributed to the flag's design, later served in the U.S. Senate for 30 years."
      - "State law specifies flag dimensions at four feet high and six feet wide, a 2:3 ratio."
      - "Shooting matches at Camp Perry began in 1907 and drew teams from across the country within three years."
      - "Arizona's flag carries no seal, state name, or motto, making it one of the simpler designs among all fifty states."

