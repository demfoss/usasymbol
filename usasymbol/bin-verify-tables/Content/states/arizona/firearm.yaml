seo_title: "Arizona State Firearm | Colt Single Action Army"
seo_description: "Arizona named the Colt Single Action Army its official state firearm in 2011, leaning into frontier symbolism and Peacemaker lore."

intro_text: "The Colt Single Action Army — in continuous production since 1873 and carried by Wyatt Earp at Tombstone — is the official state firearm of Arizona. Governor Jan Brewer signed **Senate Bill 1610** on April 28, 2011, making Arizona the second state in U.S. history to adopt an official firearm — part of the growing [list of official state firearms](/symbols/firearms) — weeks after Utah set the precedent with the Browning M1911."

sections:
  - id: "peacemaker-arizona"
    icon: "fa-solid fa-star"
    title: "Why the \"Peacemaker\" Represents Arizona"
    paragraphs:
      - "Arizona achieved statehood on February 14, 1912, but its character was shaped in the territorial years of the 1870s through the 1890s — exactly the era when the Colt Single Action Army ruled the American frontier. The revolvers carried by sheriffs, ranchers, soldiers, and outlaws across the Arizona Territory were, overwhelmingly, Colts."
      - "Tombstone makes the case most vividly. The Gunfight at the O.K. Corral on October 26, 1881 — the most famous confrontation in American frontier history — was fought at close range with Colt revolvers. Wyatt Earp carried a Colt. Doc Holliday carried a Colt. The Clanton faction carried Colts. When Arizona legislators looked for a firearm that embodied the state's formative years, they did not have to search far."
      - "The 'Peacemaker' nickname was not ironic — it was functional. In an era before reliable law enforcement infrastructure, the Colt SAA was the tool that enforced order, protected livestock, and determined disputes. It was the most widely distributed sidearm across the territories that became the American Southwest, and no state better embodies that history than Arizona, especially when read with [Arizona's state motto](/states/arizona/motto/ditat-deus)."

  - id: "legislation-sb1610"
    icon: "fa-solid fa-scale-balanced"
    title: "The Legislation: Senate Bill 1610"
    subsections:
      - subtitle: "The Bill and Its Author"
        text: "Senator Ron Gould of Lake Havasu City introduced Senate Bill 1610 in early 2011. The bill was brief and specific: it designated the Colt Single Action Army revolver as Arizona's official state firearm and directed the Secretary of State to record the designation. Gould framed the bill as recognition of Arizona's frontier heritage rather than a statement about contemporary gun policy."

      - subtitle: "The Centennial Connection"
        text: "The timing was deliberate. Arizona was preparing to celebrate its Centennial — the 100th anniversary of statehood on February 14, 2012. Lawmakers were adopting or updating several state symbols in the run-up to the anniversary, and the Colt SAA fit the narrative: a revolver that was already 38 years old when Arizona became a state, and that had defined the territorial period that made Arizona what it is, in parallel with [the Arizona state flag](/states/arizona/flag/arizona-state-flag)."

      - subtitle: "The Vote and the Signature"
        text: "The bill passed the Arizona Senate 15-10, a margin that reflected genuine disagreement rather than unanimous enthusiasm. Opposition was geographically concentrated in urban districts — primarily Tucson representatives who argued the designation sent a message inconsistent with a modernizing state. Governor Jan Brewer signed SB 1610 on April 28, 2011."

      - subtitle: "Second State in U.S. History"
        text: "Arizona's designation came approximately six weeks after Utah became the first state to adopt an official firearm (the Browning M1911, signed March 14, 2011). The rapid follow-through was not coincidental — Arizona legislators had been watching the Utah bill advance, and SB 1610 was introduced with the explicit awareness that the category of 'state firearm' was being established in real time."

  - id: "manufacturing-irony"
    icon: "fa-solid fa-industry"
    title: "Arizona vs. Connecticut: The Manufacturing Irony"
    paragraphs:
      - "The Colt Single Action Army has never been manufactured in Arizona. Every Peacemaker produced — from the original 1873 military contract to today's collector editions — has come out of Colt's factory in Hartford, Connecticut, roughly 2,600 miles from Tombstone. Arizona is the only state whose official firearm has no industrial or manufacturing connection to the state that claims it."
      - "During the SB 1610 debates, critics raised exactly this point. Why should Arizona adopt as its signature symbol a product built entirely in New England by a Connecticut company? Supporters answered that a state symbol honors history and identity, not supply chains. The Colt SAA matters to Arizona not because it was made here, but because it was used here — in quantities and in circumstances that shaped the state's formation."
      - "The contrast with other state firearms is sharp. Tennessee's Barrett M82 is designed and manufactured in Murfreesboro, Tennessee. Utah's M1911 was designed by a Utah native. [Indiana's Grouseland Rifle](/states/indiana/firearm/grouseland-rifle) was crafted by an Indiana resident. Arizona is the exception — a state that chose a symbol for what it meant rather than where it came from, which is a defensible but distinct choice."

  - id: "comparison"
    style: "compare-cards"
    icon: "fa-solid fa-arrows-left-right"
    title: "Colt SAA vs. Other State Firearms"
    subsections:
      - subtitle: "Arizona vs. Utah (Browning M1911, 2011)"
        text: "Both states designated firearms in 2011, but the contrast in technology and era is stark. Utah's M1911 is a semi-automatic pistol designed in 1911 — a modern feed-and-fire mechanism with a detachable magazine. Arizona's Colt SAA is a single-action revolver from 1873 — each shot requires manually cocking the hammer. The M1911 honored a designer born in Utah; the Colt SAA honored an era experienced in Arizona. Same year, opposite philosophy."
        link:
          label: "See Utah State Firearm"
          url: "/states/utah/firearm/browning-m1911-pistol"

      - subtitle: "Arizona vs. Tennessee (Barrett M82, 2016)"
        text: "Tennessee's Barrett M82 is a .50 BMG semi-automatic rifle in current military production, designed in 1982 by a living Tennessee native. Arizona's Colt SAA is 150+ years old and discontinued from military service in 1892. The comparison captures the full range of approaches to state firearm designation: Arizona looks backward to frontier heritage; Tennessee looks forward to modern industrial identity. Both are legitimate; neither is more 'correct.'"
        link:
          label: "See Tennessee State Firearm"
          url: "/states/tennessee/firearm/barrett-m82"

      - subtitle: "Arizona vs. Texas (1847 Colt Walker, 2021)"
        text: "Texas also chose a Colt revolver — but the Walker, which predates the SAA by 26 years and is considerably more powerful and unwieldy. The Colt Walker (1847) was the most powerful handgun of its era; the Colt SAA (1873) was the most refined and widely distributed. Both states chose historical Colt revolvers to represent frontier identity, but Texas went older and rawer while Arizona went with the iconic standard."
        link:
          label: "See Texas State Firearm"
          url: "/states/texas/firearm/1847-colt-walker"

  - id: "where-to-see"
    icon: "fa-solid fa-location-dot"
    title: "Where to See It: Arizona's Gun Heritage Today"
    subsections:
      - subtitle: "Arizona Capitol Museum — Phoenix"
        text: "The Arizona Capitol Museum occupies the original 1900 Arizona Capitol building in Phoenix and houses artifacts, documents, and objects related to Arizona's history and official symbols. The museum covers the territorial period and the Centennial era. A commemorative Colt SAA with serial designation 'AZ-1' is among the symbolic objects associated with the 2011–2012 Centennial celebration."

      - subtitle: "Tombstone Courthouse State Historic Park — Tombstone"
        text: "The Tombstone Courthouse State Historic Park preserves the original 1882 Cochise County Courthouse and serves as a museum of territorial-era justice and law enforcement. Exhibits document the Earp-Clanton conflict, frontier court proceedings, and the firearms that defined the period. The park places the Colt SAA in its actual historical context — not as a symbol, but as a working tool of the era."

      - subtitle: "Tombstone, Arizona — The Living Museum"
        text: "Tombstone itself functions as a preserved frontier town and draws visitors specifically for its connection to the Colt-era of American history. The Bird Cage Theatre, the O.K. Corral site, and Crystal Palace Saloon are all open to visitors. Regular reenactments of the 1881 gunfight use period-correct Colt SAA reproductions. No other city in the United States makes the argument for the Colt SAA as vividly as Tombstone does."

  - id: "opposition"
    icon: "fa-solid fa-comment-slash"
    title: "The Opposition: What the 15-10 Vote Tells Us"
    paragraphs:
      - "The Arizona Senate's 15-10 vote on SB 1610 was not a formality. Ten senators voted no, and their objections were substantive. Representatives from Tucson's urban districts argued that designating a firearm as an official state symbol normalized a culture of gun violence in official state identity — and that a modernizing state with growing urban and diverse populations needed symbols that spoke to all residents, not only those who identified with frontier heritage."
      - "The argument is a familiar one in state firearm debates and explains why 40 states have never made such a designation despite having equally valid historical connections to specific firearms — though states like Pennsylvania, which eventually designated the [Pennsylvania Long Rifle](/states/pennsylvania/firearm/pennsylvania-long-rifle), navigated those same objections successfully. New Hampshire, with its strong gun culture and long-rifle history, has seen similar bills die in committee. The difference between states that pass and states that fail is almost always legislative arithmetic — how many urban versus rural districts hold the balance of power."
      - "Arizona's supporters prevailed by arguing that the Colt SAA was not a political symbol but a historical one: a record of what the Arizona Territory was, rather than an endorsement of any contemporary position. That framing succeeded in Arizona in 2011. Whether it would succeed in 2026 — in a state that has shifted substantially toward its urban centers — is a genuinely open question, with context visible in [U.S. states by population](/rankings/demographics/states-by-population)."

  - id: "colt-saa-today"
    icon: "fa-solid fa-circle-info"
    title: "The Colt SAA in 2026: Still in Production After 150 Years"
    paragraphs:
      - "The Colt Single Action Army remains in production more than 150 years after its introduction — one of the longest continuous production runs of any firearm design in history. Colt currently manufactures the SAA in several variants, including the classic 3rd Generation production model in .45 Colt and .357 Magnum, and periodic limited editions for the collector market."
      - "The current production SAA is mechanically nearly identical to the original 1873 design. The materials are updated (modern steel alloys, improved finishes), but the fundamental single-action mechanism — cock the hammer, pull the trigger, rotate the cylinder manually for reloading — is unchanged. Buying a Colt SAA today means owning a functional replica of the same revolver Wyatt Earp carried."
      - "All standard production Colt SAA models are legal for civilian purchase and ownership in Arizona and in most U.S. states. They are available through licensed firearms dealers and direct from Colt's website. Arizona residents who want to own the literal model of their state firearm can do so without restrictions beyond standard federal background check requirements."

