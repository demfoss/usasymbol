faq:
  - question: "What is the official state gun of Arizona?"
    answer: "Arizona's official state firearm is the Colt Single Action Army revolver, commonly known as the Peacemaker. It was designated via Senate Bill 1610, signed by Governor Jan Brewer on April 28, 2011."

  - question: "Who was the first state to have an official state firearm?"
    answer: "Utah was first. Governor Gary Herbert signed HB 219 in March 2011, designating the Browning M1911 pistol as Utah's official state firearm — approximately six weeks before Arizona passed SB 1610. Both designations occurred in 2011."

  - question: "Is the Colt Single Action Army still made today?"
    answer: "Yes. Colt has manufactured the Single Action Army in essentially continuous production since 1873, making it one of the longest-running firearm designs in history. Current production includes the 3rd Generation SAA in .45 Colt and .357 Magnum, along with limited collector editions. It is available through licensed dealers."

  - question: "Can I buy the same model as Arizona's state firearm?"
    answer: "Yes. Colt's current Single Action Army production is commercially available and legal for civilian purchase in Arizona. Standard federal firearms purchase requirements apply. You can purchase directly from licensed dealers or through Colt's authorized distributor network."

  - question: "Who signed Arizona's state firearm bill into law?"
    answer: "Governor Jan Brewer signed Senate Bill 1610 into law on April 28, 2011. The bill was introduced by Senator Ron Gould of Lake Havasu City and passed the Arizona Senate by a 15-10 vote."

  - question: "Why did Arizona choose a revolver and not a rifle?"
    answer: "Arizona's frontier identity — particularly the Tombstone era of the 1880s — is most closely associated with the revolver, not the rifle. The Colt SAA was the dominant sidearm across the Arizona Territory and was carried at the Gunfight at the O.K. Corral. No rifle of the era had an equivalent symbolic connection to specifically Arizona history."

  - question: "What was the vote on Arizona's state firearm bill?"
    answer: "The Arizona Senate passed SB 1610 by a vote of 15-10. Opposition came primarily from legislators representing urban districts, particularly Tucson, who argued the designation was inconsistent with a modernizing state's identity."

  - question: "Is the Colt Peacemaker legal to own in Arizona?"
    answer: "Yes. The Colt Single Action Army is a standard commercially produced revolver and is legal to purchase and own in Arizona under both federal and state law. Standard federal background check requirements apply at the point of purchase from a licensed dealer."

  - question: "Was Arizona's Colt SAA ever manufactured in Arizona?"
    answer: "No. The Colt Single Action Army has always been manufactured by Colt in Hartford, Connecticut. Arizona is the only state whose official firearm has no manufacturing connection to the state — the designation is based on historical use and identity, not industrial origin."

  - question: "What is the connection between the Colt SAA and Tombstone, Arizona?"
    answer: "Tombstone in the 1880s was the most famous frontier town in the Arizona Territory, and the Gunfight at the O.K. Corral (October 26, 1881) was fought almost entirely with Colt revolvers. Wyatt Earp, Doc Holliday, and their opponents were all carrying Colts. Tombstone made the Colt SAA synonymous with Arizona's territorial period."

