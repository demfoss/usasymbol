intro_text: "Utah's state seal centers on a beehive under the word 'Industry,' flanked by sego lilies and two American flags, with a bald eagle at the top. The dates 1847 and 1896 mark the Latter-day Saint pioneer arrival in the Salt Lake Valley and Utah's admission as the 45th state. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
