meaning: "The Great Seal of Utah puts a beehive at its center because the beehive was the defining symbol of the Latter-day Saint settlers who named their proposed territory 'Deseret,' a Book of Mormon word for honeybee. Every other element on the seal, the sego lily, the American flags, the eagle, and the two dates, frames that central story of collective labor and hard-won statehood."
