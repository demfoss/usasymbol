type: State Coat of Arms
state: Florida
name: Florida State Coat of Arms
adopted_year: 1868
is_official: true
meaning: "The Florida coat of arms shows the state as it appeared to its founders in 1868: a land of sun, water, and abundant natural growth. A Seminole woman scatters flowers across the foreground, placing the indigenous people who had lived in Florida for centuries at the center of the design. A sabal palm rises behind her, a steamboat moves across the water in the background, and the sun sends its rays upward from the horizon. The motto In God We Trust appears below the scene."
meaning_title: Meaning of the Florida Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Florida Coat of Arms: Meaning, Symbols and History'
seo_description: "The Florida coat of arms was adopted in 1868 and shows a Seminole woman, a sabal palm, a steamboat, and a sunrise, with the motto In God We Trust."
hero_image: /images/coats-of-arms/florida/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Florida, adopted 1868, showing a Seminole woman scattering flowers before a sabal palm tree, a steamboat on the water, and a rising sun
hero_image_caption: The Florida Coat of Arms, adopted in 1868. A Seminole woman scatters flowers in the foreground. Behind her stands a sabal palm. A steamboat moves across the water in the background and the sun rises on the horizon. The motto In God We Trust appears below.
intro_text: "The Florida coat of arms was adopted in 1868, when Florida rejoined the Union and wrote a new state constitution. It shows a Seminole woman scattering flowers before a sabal palm, a steamboat on the water, and a rising sun, all above the motto In God We Trust. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Florida Coat of Arms?
  paragraphs:
  - "The Florida coat of arms is the central design of the state seal and appears on official state documents, the state flag, and government publications. The state flag places the coat of arms at the intersection of a red diagonal cross on a white background."
  - "Unlike most state coats of arms, the Florida design is a landscape scene rather than a traditional heraldic arrangement of quarters and figures. All elements are drawn together into a single image of a Florida shoreline, with the motto In God We Trust running at the base."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Florida Coat of Arms
  paragraphs:
  - "Florida became the twenty-seventh state on March 3, 1845. When the Civil War began, Florida seceded from the Union on January 10, 1861, and joined the Confederacy. After the war, Florida was required to write a new state constitution before it could rejoin the Union. The current coat of arms dates to that 1868 constitution."
  - "The 1868 design placed a Seminole woman at the center of the coat of arms, recognizing the Seminole people as part of Florida's identity. The Seminoles are one of the few Native American nations that never signed a formal peace treaty with the United States government. Their presence at the heart of the state's official symbol was a deliberate choice by the 1868 legislature."
  - "The design was revised in 1985 by the Florida Legislature. The revision corrected the depiction of the Seminole woman, updating her clothing and appearance to more accurately reflect Seminole dress. The other elements of the design, the sabal palm, the steamboat, the sun, and the motto, were carried forward without significant change."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Florida Coat of Arms
  paragraphs:
  - "The Florida coat of arms presents its symbols as a unified landscape scene, placing all four elements in a single image that describes Florida's environment and history."
  elements:
  - id: seminole-woman
    name: Seminole Woman
    image: /images/coats-of-arms/florida/elements/seminole-woman.svg
    paragraphs:
    - "A Seminole woman stands in the foreground, scattering flowers across the ground. She wears traditional Seminole dress and is the dominant figure in the composition. Her placement at the center of the coat of arms recognizes the Seminole people, who inhabited Florida for centuries before European contact and who remained in Florida after the Seminole Wars of the early nineteenth century."
    - "The 1985 revision updated her depiction to reflect authentic Seminole clothing more accurately. The original 1868 version had depicted her in clothing that did not accurately represent Seminole dress."
  - id: sabal-palm
    name: Sabal Palm Tree
    image: /images/coats-of-arms/florida/elements/sabal-palm.svg
    paragraphs:
    - "A sabal palm tree, also called the cabbage palm, rises behind the Seminole woman. The sabal palm is Florida's official state tree and is one of the most recognizable plants of Florida's landscape. It grows across the Florida peninsula and along the Gulf and Atlantic coasts."
    - "Placing the sabal palm on the coat of arms connects the design to Florida's native vegetation and to the natural environment that defines the state's geography."
  - id: steamboat
    name: Steamboat
    image: /images/coats-of-arms/florida/elements/steamboat.svg
    paragraphs:
    - "A steamboat moves across the water in the background of the design. In the mid-nineteenth century, steam-powered vessels were essential to Florida's economy. They carried goods, passengers, and mail along Florida's rivers, bays, and coastal waters, connecting interior settlements to port cities."
    - "The steamboat on the coat of arms represents commerce and transportation as Florida understood them in 1868, when the design was adopted."
  - id: sun
    name: Rising Sun
    image: /images/coats-of-arms/florida/elements/sun.svg
    paragraphs:
    - "The sun rises on the horizon behind the water and the steamboat, sending rays upward across the upper portion of the design. Florida's climate and its position as the southernmost state in the continental United States made the sun a natural symbol for the state's identity."
    - "Florida would later be nicknamed the Sunshine State, a connection that traces directly to the prominence of the sun in its official imagery."
  - id: motto
    name: In God We Trust
    image: /images/coats-of-arms/florida/elements/motto.svg
    paragraphs:
    - "The motto In God We Trust appears at the base of the coat of arms. Florida adopted this phrase as its state motto in 1868, the same year the coat of arms was established. The phrase is also the national motto of the United States, adopted by Congress in 1956, but Florida's use of it predates the national adoption by nearly ninety years."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Florida Coat of Arms
  paragraphs:
  - "The coat of arms describes Florida through its landscape rather than through abstract symbols. Every element is something a person standing in Florida in 1868 could actually see: a Seminole woman, a palm tree, a steamboat on the water, and the sun rising over the horizon."
  - "Placing the Seminole woman at the center was a statement about Florida's history. The Seminoles had survived wars, forced removal attempts, and a century of pressure from the U.S. government. Putting a Seminole figure on the state's official symbol in 1868 acknowledged a presence that could not be erased."
  - "The steamboat and the sun together point toward the future the 1868 legislature imagined: a state connected by water trade and lit by a climate that distinguished Florida from every other state in the Union."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Florida Coat of Arms Facts
  facts:
  - "Adopted: 1868, when Florida wrote a new state constitution to rejoin the Union after the Civil War. Florida had first become a state on March 3, 1845."
  - "The coat of arms was revised in 1985 by the Florida Legislature to correct the depiction of the Seminole woman, updating her clothing to more accurately reflect authentic Seminole dress."
  - "The Seminole people, shown at the center of the coat of arms, are one of the few Native American nations that never signed a formal peace treaty with the United States government."
  - "The sabal palm on the coat of arms is Florida's official state tree. It is also called the cabbage palm and grows throughout the Florida peninsula."
  - "Florida's motto In God We Trust was adopted in 1868, nearly ninety years before the same phrase became the national motto of the United States in 1956."
  - "The state flag places the coat of arms at the center of a red diagonal cross, known as a Saint Andrew's Cross, on a white field. The red cross was added to the flag in 1900."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Florida Coat of Arms
  paragraphs:
  - "The original Florida coat of arms was adopted in 1868 with the same four elements: the Seminole woman, the sabal palm, the steamboat, and the rising sun. In 1985, the Florida Legislature officially revised the design, primarily to update the depiction of the Seminole woman. Her clothing in the original design did not accurately reflect Seminole dress, and the revision corrected this. The other elements of the design were not substantially changed."
  versions:
  - name: Original Design
    years: 1868-1985
    image: /images/coats-of-arms/florida/versions/1868-original.jpg
    description: The original Florida design used from 1868 until the 1985 revision. It showed the same basic scene of a woman scattering flowers beside a palm, with a steamboat and rising sun, but the woman's clothing did not accurately represent Seminole dress.
  - name: Revised Design
    years: 1985-present
    image: /images/coats-of-arms/florida/versions/1985-revised.jpg
    description: The revised Florida design adopted in 1985. The legislature corrected the figure to show a Seminole woman in historically accurate dress while retaining the sabal palm, steamboat, rising sun, and motto.

faq:
- question: What does the Florida coat of arms show?
  answer: "The Florida coat of arms shows a Seminole woman scattering flowers in the foreground, a sabal palm tree rising behind her, a steamboat moving across the water in the background, and the sun rising on the horizon. The motto In God We Trust appears at the base of the design."
- question: Who is the woman on the Florida coat of arms?
  answer: "The woman is a Seminole woman in traditional Seminole dress. She is shown scattering flowers. The Seminole people have lived in Florida for centuries and are one of the few Native American nations that never signed a formal peace treaty with the United States government. The 1985 revision of the coat of arms updated her clothing to more accurately reflect authentic Seminole dress."
- question: Why is there a palm tree on the Florida coat of arms?
  answer: "The palm tree is a sabal palm, also called the cabbage palm. It is Florida's official state tree. The sabal palm is one of the most recognizable plants in Florida's landscape and grows across the peninsula and along the coasts."
- question: When was the Florida coat of arms adopted?
  answer: "The current design was adopted in 1868, when Florida wrote a new state constitution to rejoin the Union after the Civil War. The design was revised in 1985 to update the depiction of the Seminole woman. Florida first became a state on March 3, 1845."
- question: What does In God We Trust mean on the Florida coat of arms?
  answer: "In God We Trust is Florida's state motto, adopted in 1868. It expresses the founding religious belief that guided the state constitution writers of that year. The phrase later became the national motto of the United States in 1956, but Florida's use predates the national adoption by nearly ninety years."
- question: Why was the Florida coat of arms changed in 1985?
  answer: "The 1985 revision corrected the depiction of the Seminole woman on the coat of arms. Her clothing in the original 1868 version did not accurately reflect authentic Seminole dress. The Florida Legislature updated the design to make her depiction more historically accurate. The other elements of the coat of arms were not substantially changed."

