faq:
  - question: "What is Florida's state motto?"
    answer: "Florida's state motto is \"In God We Trust.\" It was adopted in 1868 when Florida created its first state seal after being readmitted to the Union following the Civil War."

  - question: "What does \"In God We Trust\" mean?"
    answer: "The phrase is a direct statement of religious faith, expressing that the people of Florida place their trust in God. Florida adopted it in 1868 as part of the post-Civil War state seal."

  - question: "When did Florida adopt its state motto?"
    answer: "Florida adopted \"In God We Trust\" in 1868, when the state was readmitted to the Union after the Civil War and created the Great Seal of Florida."

  - question: "Did Florida have \"In God We Trust\" before the United States?"
    answer: "Yes. Florida placed \"In God We Trust\" on its state seal in 1868. Congress did not adopt it as the U.S. national motto until 1956 — 88 years later."

  - question: "Where does Florida's motto appear?"
    answer: "The motto appears around the border of the Great Seal of Florida. The seal — with the motto — also appears at the center of the Florida state flag, on a white field crossed by a red diagonal cross."

