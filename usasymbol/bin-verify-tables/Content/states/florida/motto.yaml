seo_title: "Florida State Motto | In God We Trust"
seo_description: "Florida's state motto is \"In God We Trust.\" Adopted in 1868, Florida used the phrase 88 years before it became the U.S. national motto in 1956."

intro_text: "Florida's state motto is <strong>In God We Trust</strong>. Florida adopted the phrase in 1868 — 88 years before Congress made it the official motto of the United States. It has appeared on the Great Seal of Florida since the seal was first created. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

