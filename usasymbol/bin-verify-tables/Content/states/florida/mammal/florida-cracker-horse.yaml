faq:
  - question: "What is Florida's state horse?"
    answer: "Florida's state horse is the Florida Cracker Horse (Equus caballus), designated as the official state heritage horse on July 1, 2008, through Florida Statutes Section 15.0526."
  
  - question: "When was the Florida Cracker Horse designated as the state horse?"
    answer: "The Florida Legislature designated the Florida Cracker Horse as the official state horse on July 1, 2008, through Chapter 2008-34."
  
  - question: "Why is it called a 'Cracker' horse?"
    answer: "The name comes from Florida's early cowboys, called 'Florida Crackers' after the distinctive cracking sound of their long whips used to drive cattle. The name transferred to both the horses they rode and the cattle they herded. Florida Cracker Horses and Florida Cracker Cattle form a paired heritage representing the state's colonial ranching culture."
  
  - question: "Where did Florida Cracker Horses come from?"
    answer: "Florida Cracker Horses descend from Spanish horses brought to Florida by Ponce de León in 1521 and subsequent Spanish explorers throughout the 1500s. These horses included Barbs, Andalusians, Spanish Jennets, Sorraias, and Garranos—Iberian breeds that adapted to Florida's harsh environment over five centuries to become a distinct type. They are part of the Spanish Colonial Horse family."
  
  - question: "Are Florida Cracker Horses endangered?"
    answer: "Yes, Florida Cracker Horses are critically endangered. Both the Livestock Conservancy and the Equus Survival Trust classify them at critical status, meaning fewer than 2,000 horses exist worldwide with only 100-300 active breeding mares. In 1989, only approximately 175 horses remained. Through conservation efforts, the population has grown to over 1,000 registered horses but remains critically endangered."
  
  - question: "Where can I see Florida Cracker Horses?"
    answer: "The best location to see Florida Cracker Horses is Paynes Prairie Preserve State Park near Micanopy, where a wild herd of approximately 30 horses roams 10,000 acres. The Florida Agricultural Museum in Tallahassee maintains a display herd. The state also holds annual fall sales where excess horses from state herds and private breeders are sold, providing opportunities to see many horses at once."
  
  - question: "What makes Florida Cracker Horses special?"
    answer: "Florida Cracker Horses are gaited breeds with natural four-beat ambling gaits (running walk, single-foot) that provide exceptional rider comfort during long hours in the saddle. They possess strong cow sense, agility in rough terrain, heat tolerance, disease resistance, and intelligence. These traits made them perfectly suited for Florida's cattle industry from the 1600s through the 1930s. They represent a living connection to five centuries of Florida history."
  
  - question: "How big are Florida Cracker Horses?"
    answer: "Florida Cracker Horses are small by modern standards, standing 13.2 to 15 hands (54 to 60 inches) at the withers and weighing 700 to 1,000 pounds. This size reflects their Spanish ancestry and made them perfectly suited for the agility and endurance required to work Florida's quick, scrubby cattle through palmetto thickets and swamps."
  
  - question: "What saved the Florida Cracker Horse from extinction?"
    answer: "John Law Ayers saved the breed by donating his entire herd of purebred Cracker Horses to the State of Florida in 1984. This donation enabled the state to establish three conservation herds. In 1989, the Florida Cracker Horse Association was founded to search for remaining horses and establish a breed registry. State-supported breeding programs, private breeders, and the 2008 state designation have slowly increased the population from approximately 175 horses in 1989 to over 1,000 today."

