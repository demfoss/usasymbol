faq:
  - question: "What is Florida's state animal?"
    answer: "Florida's state animal is the Florida panther (Puma concolor coryi), designated in 1982 following a statewide vote by over 500,000 schoolchildren."
  
  - question: "When was the Florida panther designated as the state animal?"
    answer: "The Florida panther became Florida's official state animal in 1982. Education Commissioner Ralph Turlington organized a statewide student vote in late 1981, and the Legislature formally adopted the panther in 1982 based on the election results."
  
  - question: "Why did Florida choose the Florida panther as its state animal?"
    answer: "Florida chose the Florida panther to represent the state's commitment to conservation and wilderness preservation. In 1982, fewer than 30 Florida panthers survived in the wild, making them one of the most endangered mammals in North America. Students voted for the panther with 211,729 votes, choosing it over the manatee, alligator, and Key deer. The designation elevated public awareness and directed resources toward panther recovery efforts."
  
  - question: "How many Florida panthers are left?"
    answer: "Approximately 200 adult and subadult Florida panthers remain in the wild as of 2024. The population has fluctuated between 120 and 230 individuals in recent years. Panthers were reduced to perhaps 20 animals in the 1970s before conservation efforts began reversing the decline."
  
  - question: "Where can I see a Florida panther?"
    answer: "Florida panthers are extremely difficult to see in the wild due to their secretive, nocturnal behavior and small population. The Florida Panther National Wildlife Refuge east of Naples offers the best viewing opportunity, with 5 to 11 panthers spotted monthly. Big Cypress National Preserve and Everglades National Park provide habitat where you can look for panther tracks and signs even if you don't see the animal itself."
  
  - question: "Are Florida panthers dangerous to humans?"
    answer: "Florida panthers are not dangerous to humans and actively avoid people. There has never been a documented Florida panther attack on a human. If you encounter a panther, face the animal, make yourself appear large, maintain eye contact, back away slowly, and never run. Panthers are solitary, secretive cats that prefer to avoid confrontation."
  
  - question: "What is the biggest threat to Florida panthers?"
    answer: "Vehicle collisions cause more documented Florida panther deaths than any other factor. In 2024, 29 panthers were killed by vehicles. Long-term, habitat loss from development poses the most serious threat. Florida's human population is projected to grow by 1.27 million people in panther country by 2070, potentially eliminating 17 percent of current habitat by 2040."
  
  - question: "How did the Florida panther survive when other Eastern cougars went extinct?"
    answer: "Florida panthers survived in the vast cypress swamps and palmetto prairies of Southwest Florida where terrain discouraged settlement and development. Big Cypress National Preserve, the Everglades, and surrounding areas provided refuges where small numbers of panthers persisted even as populations in other Eastern states were exterminated by the early 1900s."
  
  - question: "Does the Florida panther appear on the state flag or seal?"
    answer: "No, the Florida panther does not appear on the state flag or Great Seal. The Great Seal features a Seminole woman, sabal palm tree, steamboat, and sunshine representing Florida's landscape and history. The environments shown on the seal—forested lands with palms and waterways—are precisely the habitats Florida panthers require for survival."

