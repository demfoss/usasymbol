type: State Coat of Arms
state: West Virginia
name: West Virginia State Coat of Arms
adopted_year: 1863
is_official: true
meaning: "The West Virginia coat of arms uses two working figures to define what the state is: a farming state and a mining state, built on agriculture and mineral wealth. The boulder between them marks the date the state was born, carved from Virginia during the Civil War. The crossed rifles in front declare that the people were prepared to fight for the right to make that choice. The motto below names who they are: mountaineers who are always free."
meaning_title: Meaning of the West Virginia Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2025-12-02'
date_modified: '2026-05-21'
seo_title: 'West Virginia Coat of Arms: Meaning, Symbols and History'
seo_description: "The West Virginia coat of arms was adopted in 1863 and shows a farmer, a miner, and crossed rifles around a boulder dated June 20, 1863."
hero_image: /images/coats-of-arms/west-virginia/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of West Virginia, adopted 1863, showing a farmer and miner flanking a central boulder with crossed rifles and a Liberty cap
hero_image_caption: The West Virginia State Coat of Arms, adopted 1863. A farmer and a miner flank a boulder marked June 20, 1863, the date West Virginia entered the Union during the Civil War.
intro_text: "The West Virginia coat of arms shows a farmer and a miner flanking a boulder inscribed with June 20, 1863, the day West Virginia separated from Virginia and joined the Union during the Civil War. The design was created by artist Joseph H. Diss Debar and adopted with statehood in 1863."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the West Virginia Coat of Arms?
  paragraphs:
  - "The West Virginia coat of arms shows two working men on either side of a large rock. A farmer with an ax stands on the left, and a miner with a pickax stands on the right. Between them, the boulder is inscribed with the date June 20, 1863. Two rifles cross in front of the boulder with a red Liberty cap on top, while ivy frames the scene on both sides."
  - "The motto Montani Semper Liberi appears on a scroll below the central image. The coat of arms appears on official state documents and buildings throughout West Virginia, and its central image also forms the basis of the state seal."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the West Virginia Coat of Arms
  paragraphs:
  - "West Virginia did not exist as a state before the Civil War. When Virginia voted to leave the Union in 1861, the western counties of Virginia refused to follow. They were geographically separated from eastern Virginia by the Appalachian Mountains and economically different from the plantation regions of the east."
  - "The western counties organized their own government, and after a constitutional process, West Virginia was admitted to the Union on June 20, 1863, becoming the thirty-fifth state. It was the only state created by separating from a Confederate state during the Civil War."
  - "Joseph H. Diss Debar, an artist born in Alsace who had settled in what became West Virginia, was asked to design the new state's coat of arms and seal. He created the design adopted with statehood in 1863, incorporating the farmer, the miner, the boulder, the crossed rifles, and the motto to reflect the state's economy, geography, and founding story."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the West Virginia Coat of Arms
  paragraphs:
  - "The West Virginia coat of arms groups its symbols around a central boulder. Each figure and object refers to a specific aspect of the state's economy, geography, or founding moment."
  elements:
  - id: farmer
    name: The Farmer
    image: /images/coats-of-arms/west-virginia/elements/farmer.webp
    paragraphs:
    - "A farmer stands to the left of the central boulder, holding an ax, with farming tools nearby. West Virginia's mountain valleys supported small farms, and agriculture was one of the two main economic activities that defined the state in 1863."
    - "The farmer is placed as an equal partner to the miner on the opposite side, showing that both ways of working the land mattered equally to the state's founders."
  - id: miner
    name: The Miner
    image: /images/coats-of-arms/west-virginia/elements/miner.webp
    paragraphs:
    - "A miner stands to the right of the boulder, holding a pickax. West Virginia sits on top of some of the largest coal and mineral deposits in the eastern United States. Mining, especially coal mining, would define the state's economy for generations after 1863."
    - "Placing the miner on equal footing with the farmer at the time of statehood recognized that the state's wealth would come from underground as much as from the fields."
  - id: boulder
    name: The Boulder and the Date
    image: /images/coats-of-arms/west-virginia/elements/boulder.webp
    paragraphs:
    - "The large rock at the center of the coat of arms is inscribed with the date June 20, 1863, the day West Virginia was admitted to the Union as the thirty-fifth state. The boulder anchors everything else in the design around that single founding moment."
  - id: rifles
    name: Crossed Rifles and Liberty Cap
    image: /images/coats-of-arms/west-virginia/elements/rifles.webp
    paragraphs:
    - "Two rifles cross in front of the boulder. On top of the crossing point sits a red Phrygian cap, also called a Liberty cap. The Phrygian cap was a recognized symbol of freedom in both ancient Roman tradition and the American Revolution, and appeared on many official U.S. seals and coins of the period."
    - "The crossed rifles on West Virginia's coat of arms represent the state's willingness to defend itself and the Union. West Virginia was created specifically because its residents refused to follow Virginia into secession."
  - id: ivy
    name: Ivy
    image: /images/coats-of-arms/west-virginia/elements/ivy.webp
    paragraphs:
    - "Ivy grows along both sides of the coat of arms, framing the central scene. Its inclusion in Diss Debar's 1863 design is associated with persistence and future growth."
  - id: motto
    name: Montani Semper Liberi
    image: /images/coats-of-arms/west-virginia/elements/motto.webp
    paragraphs:
    - "The motto Montani Semper Liberi appears on a scroll below the main image. It is Latin for Mountaineers Are Always Free. The motto was written by Joseph H. Diss Debar as part of his 1863 design."
    - "The motto refers to the Appalachian Mountains that define West Virginia's landscape, and to the act of independence from Virginia that created the state. It is also the official state motto of West Virginia."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the West Virginia Coat of Arms
  paragraphs:
  - "The coat of arms makes the state's founding story visible in one image. The boulder with the date June 20, 1863 is the fixed point. The farmer and miner on either side represent what the state was and what it would become. The crossed rifles explain why it was willing to fight to exist. The motto names the quality that made it possible."
  - "West Virginia is one of the few states whose coat of arms was designed specifically to record a dramatic founding moment. It did not inherit a colonial past or a territorial history with centuries of precedent. It was created in the middle of a war, and the design reflects that directly."

- id: facts
  icon: fa-solid fa-lightbulb
  title: West Virginia Coat of Arms Facts
  facts:
  - "Adopted: 1863, when West Virginia became the thirty-fifth state on June 20, 1863."
  - "West Virginia is the only state created by separating from a Confederate state during the Civil War."
  - "The design was created by Joseph H. Diss Debar, an artist born in Alsace who had settled in what became West Virginia."
  - "The motto Montani Semper Liberi, Latin for Mountaineers Are Always Free, was written by Diss Debar as part of the original 1863 design."
  - "The red Phrygian cap on the crossed rifles was a recognized symbol of liberty in the early United States, appearing on official seals and currency of the period."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the West Virginia Coat of Arms
  paragraphs:
  - "The West Virginia coat of arms has been in use since statehood in 1863. No earlier coat of arms preceded it, because the state itself did not exist before that date. The design created by Joseph H. Diss Debar in 1863 is the only official coat of arms West Virginia has used."
  versions:
  - name: AmCyc Obverse Print
    years: 1879
    image: /images/coats-of-arms/west-virginia/versions/1879-amcyc-obverse.jpg
    description: A nineteenth-century printed obverse rendering from The American Cyclopaedia. It preserves Diss Debar's original 1863 composition with the farmer, miner, dated boulder, crossed rifles, liberty cap, and motto in period engraving style.
  - name: AmCyc Reverse Print
    years: 1879
    image: /images/coats-of-arms/west-virginia/versions/1879-amcyc-reverse.jpg
    description: A historical printed rendering of the reverse of the West Virginia seal as published in 1879. It documents the lesser-seen second face of the Great Seal in nineteenth-century reference form.
  - name: Reverse Seal
    years: 1863-present
    image: /images/coats-of-arms/west-virginia/versions/reverse-seal.png
    description: The reverse face of the Great Seal of West Virginia in a modern official-style rendering. A form of this reverse is also used as the official seal of the governor.
  - name: Official Coat of Arms
    years: 1863-present
    image: /images/coats-of-arms/west-virginia/versions/current-standard.svg
    description: The official West Virginia coat of arms adopted in 1863, designed by Joseph H. Diss Debar. This is the standard design used on official documents and as the basis for the state seal.

faq:
- question: What does the West Virginia coat of arms show?
  answer: "The West Virginia coat of arms shows a farmer with an ax on the left and a miner with a pickax on the right, flanking a boulder inscribed with the date June 20, 1863. Two rifles cross in front of the boulder with a red Liberty cap on top. Ivy frames both sides of the scene. The motto Montani Semper Liberi appears below."
- question: When was the West Virginia coat of arms adopted?
  answer: "The West Virginia coat of arms was adopted in 1863, when West Virginia became the thirty-fifth state on June 20, 1863."
- question: Who designed the West Virginia coat of arms?
  answer: "Joseph H. Diss Debar, an artist born in Alsace who had settled in what became West Virginia, designed the coat of arms in 1863. He also wrote the state motto as part of the design."
- question: What does Montani Semper Liberi mean?
  answer: "Montani Semper Liberi is Latin for Mountaineers Are Always Free. It is the official motto of West Virginia, written by Joseph H. Diss Debar as part of the original 1863 coat of arms design."
- question: What do the crossed rifles mean on the West Virginia coat of arms?
  answer: "The crossed rifles represent West Virginia's willingness to defend itself and the Union. The state was formed when its counties refused to follow Virginia into secession during the Civil War. The red Liberty cap on top of the rifles reinforces the theme of freedom."
- question: What does the boulder represent on the West Virginia coat of arms?
  answer: "The boulder is inscribed with the date June 20, 1863, the day West Virginia was admitted to the Union as the thirty-fifth state. It records the founding moment of the state."

