faq:
- question: What is Illinois's state fossil?
  answer: "Illinois's state fossil is the Tully Monster (Tullimonstrum gregarium), a soft-bodied Pennsylvanian creature whose classification remains scientifically unresolved. It was designated the state fossil in 1989."
- question: When did Illinois adopt its state fossil?
  answer: "Illinois designated the Tully Monster (Tullimonstrum gregarium) as its official state fossil in 1989, following a vote by Illinois schoolchildren."
- question: What did the Tully Monster look like?
  answer: "The Tully Monster had a soft, torpedo-shaped body up to 14 inches long. Its eyes were mounted on rigid stalks that stuck out from either side of its body. A long flexible snout at the front ended in a small jaw with eight teeth."
- question: Where are Tully Monster fossils found in Illinois?
  answer: "All confirmed Tully Monster fossils come from the Mazon Creek fossil beds in northeastern Illinois, centered on Grundy and Will counties. They are found inside ironstone concretions in the Francis Creek Shale near Morris and Braidwood. The Mazonia-Braidwood State Fish and Wildlife Area is a public collecting site."
- question: When did the Tully Monster live?
  answer: "Tullimonstrum gregarium lived during the Pennsylvanian period, about 307 million years ago, in a warm coastal delta that covered northeastern Illinois. It is known only from this one geological deposit."
- question: Who pushed to make it the state fossil?
  answer: "Illinois schoolchildren voted the Tully Monster their choice for state fossil before the legislature took action. It was formally designated in 1989. The creature is named for Francis Tully, the amateur collector who found the first specimens in 1955."

