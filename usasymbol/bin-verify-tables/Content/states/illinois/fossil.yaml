intro_text: "Illinois's state fossil is the Tully Monster (Tullimonstrum gregarium), a soft-bodied Pennsylvanian creature found nowhere on Earth except the Mazon Creek fossil beds of northeastern Illinois, officially designated in 1989. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Illinois State Fossil
  paragraphs:
  - "The Tully Monster is Illinois's official state fossil, designated in 1989. Tullimonstrum gregarium is unlike any other known animal: it had a long flexible body, eyes mounted on rigid stalks protruding from its sides, and a long snout tipped with a small claw-like jaw. Paleontologists have debated its classification for decades and have not reached a consensus. It does not fit cleanly into any recognized animal phylum."
  - "Hundreds of thousands of Tully Monster specimens have been found, all of them from a single fossil deposit in northeastern Illinois. It is the state's own fossil in every sense: no confirmed specimen has ever been found anywhere else in the world."

- id: about
  icon: fa-solid fa-paw
  title: What the Tully Monster Was
  paragraphs:
  - "Tullimonstrum gregarium had a soft, torpedo-shaped body up to 14 inches (35 cm) long. A rigid bar ran across its body near the front, with an eye at each end — eyes that pointed outward rather than forward. At the front of its body grew a long, flexible proboscis that ended in a tiny jaw with eight small teeth, used to grab prey."
  - "Its body had a tail fin divided into lobes, similar in shape to a squid's tail, which it probably used for steering and propulsion. The entire animal was soft-bodied, with no shell or external skeleton, which is why it only survives as fossils in the exceptional preservation conditions of the Mazon Creek deposit."
  - "What it was remains genuinely unresolved. A 2016 study proposed it was a vertebrate related to lampreys. Studies published in 2019 and 2020 disputed that finding and argued it was an invertebrate. No classification has won broad acceptance. It is the only known member of its genus, and possibly the only member of its order."

- id: history
  icon: fa-solid fa-landmark
  title: How the Tully Monster Became Illinois's State Fossil
  paragraphs:
  - "The Tully Monster takes its name from Francis Tully, an amateur fossil collector from Lockport, Illinois. In 1955, Tully was searching through spoil heaps at a coal strip mine near Morris when he found several flattened fossils unlike anything he had seen. He brought them to the Field Museum of Natural History in Chicago, where Eugene Richardson, a paleontologist, formally described the creature in 1966."
  - "Richardson named it Tullimonstrum gregarium — Tully's monster, found in abundance. The word monster was not dramatic license; Richardson genuinely could not place the animal in any known group and the name stuck. The species name gregarium, meaning common or gregarious, reflected the thousands of specimens already emerging from the strip mines."
  - "Illinois schoolchildren voted the Tully Monster their choice for state fossil before the legislature took it up. The legislature designated it officially in 1989. It remains one of the few state fossils found exclusively within the borders of the state that adopted it."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Tully Monster Fossils Are Found in Illinois
  paragraphs:
  - "Every confirmed Tullimonstrum gregarium specimen comes from the Mazon Creek fossil beds of northeastern Illinois, centered on Grundy and Will counties. The fossils occur inside ironstone concretions — egg-shaped nodules of iron carbonate — within the Francis Creek Shale, part of the broader Carbondale Formation deposited in a coastal delta environment about 307 million years ago."
  - "Coal strip mining throughout the 20th century exposed millions of concretions in the spoil heaps around Morris and Braidwood. Collectors crack the nodules open to find the fossils inside, preserved in fine detail because the ironstone hardened quickly around soft-bodied animals before they could decay. The Field Museum in Chicago holds one of the largest Mazon Creek collections in the world."
  - "The Mazonia-Braidwood State Fish and Wildlife Area in Grundy County is a public site where visitors can legally collect Mazon Creek concretions, including — rarely — Tully Monster specimens."
