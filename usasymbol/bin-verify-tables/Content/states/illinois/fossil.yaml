- id: facts
  icon: fa-solid fa-lightbulb
  title: Tully Monster Facts
  facts:
  - "Illinois designated Tullimonstrum gregarium its state fossil in 1989, after a vote among Illinois schoolchildren."
  - "The Tully Monster was discovered in 1955 by amateur collector Francis Tully in a coal mine spoil heap near Morris, Illinois."
  - "Its eyes sat at the ends of a rigid bar that crossed its body — pointing sideways rather than forward."
  - "No confirmed Tully Monster specimen has ever been found outside the Mazon Creek fossil beds of northeastern Illinois."
  - "Paleontologists still disagree on what phylum it belongs to: a 2016 study said vertebrate; studies in 2019 and 2020 said invertebrate."

