sections:
- id: history
  icon: fa-solid fa-landmark
  title: Iowa State Seal History and Origin
  paragraphs:
    - Iowa became the 29th state on December 28, 1846, and the first Iowa General Assembly acted quickly to establish official state symbols. The seal was authorized in 1847, giving the new state a formal emblem for government documents within its first year. Iowa Code § 1.8 has governed the seal's design and use ever since.
    - The seal's adoption came just weeks after statehood, reflecting the urgency Iowa's founders felt in establishing a distinct civic identity. The first General Assembly chose imagery that reflected both the agricultural promise of the Iowa prairie and the civic values of a free citizenry. Those choices have remained essentially unchanged for nearly 180 years.
    - The motto "Our Liberties We Prize And Our Rights We Will Maintain" was adopted only 58 days after statehood. It is the longest state motto in the United States. The motto's presence on the seal tied Iowa's official emblem directly to its founding ideals from the start.

- id: elements
  icon: fa-solid fa-shapes
  title: What the Iowa State Seal Symbols Mean
  paragraphs:
    - The Great Seal of Iowa organizes several distinct figures into a single circular design. Each element contributes to the seal's overall argument about Iowa's civic and agricultural character.
  elements:
  - id: citizen-soldier
    name: Citizen Soldier
    image: /images/state-seals/iowa/elements/citizen-soldier.webp
    paragraphs:
      - The central figure of the Iowa state seal is a citizen soldier, depicted holding a United States flag and a rifle. He stands in the foreground of a landscape that includes farming fields, representing the idea that the defender of the state is also a working member of its community.
      - Iowa's founders chose a citizen soldier rather than a uniformed military officer to express that liberty is defended by ordinary people, not by a standing army separate from civilian life. This figure remains the most visually prominent element of the seal.
  - id: eagle-motto
    name: Bald Eagle with Motto Scroll
    image: /images/state-seals/iowa/elements/eagle-motto.webp
    paragraphs:
      - A bald eagle appears above the central scene, holding a scroll with the state motto, connecting the national symbol of the eagle to Iowa's own declaration of values.
      - The eagle on the Iowa state seal also appears on the [Iowa state flag](/states/iowa/flag), designed by Dixie Cornell Gebhardt in 1921. The flag draws the eagle and motto imagery directly from the seal, making the bird one of the most recognized Iowa symbols.
  - id: state-motto
    name: State Motto
    image: /images/state-seals/iowa/elements/state-motto.webp
    paragraphs:
      - The motto "Our Liberties We Prize And Our Rights We Will Maintain" is displayed on the scroll held by the eagle. It is the longest state motto in the United States, a distinction that sets Iowa apart from every other state.
      - The motto was adopted just 58 days after Iowa achieved statehood on December 28, 1846. Its direct language reflects a frontier-era commitment to civil liberties and self-governance. Read more on the [Iowa state motto](/states/iowa/motto) page.
  - id: agricultural-imagery
    name: Farming Tools and Fields
    image: /images/state-seals/iowa/elements/agricultural-imagery.webp
    paragraphs:
      - A plow and other farming tools appear alongside fields in the seal's background, acknowledging the agricultural economy that defined Iowa in 1847. These elements placed the labor of farmers at the symbolic heart of the new state's identity.
      - Iowa's prairie soil was among the most fertile in North America, and the first settlers were actively breaking new farmland when the seal was adopted. The agricultural imagery was a direct statement about where Iowa's prosperity would come from.
  - id: river-steamboat
    name: River and Steamboat
    image: /images/state-seals/iowa/elements/river-steamboat.webp
    paragraphs:
      - A river appears in the background of the seal, with a steamboat depicted on the water. Iowa is bounded by the Mississippi River to the east and the Missouri River to the west, making rivers central to the state's geography and commerce.
      - The steamboat was the dominant mode of commercial transport in 1847, and its inclusion signals that Iowa expected to participate in national trade. The river landscape anchors the seal to a specific place and distinguishes Iowa from other prairie states with similar agricultural imagery. Iowa's [state flag](/states/iowa/flag) also connects to this river-commerce heritage through its Louisiana Purchase origins.

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Iowa State Seal'
  paragraphs:
    - Iowa used a separate territorial seal before statehood, then adopted the present state seal in 1847. The broad composition of the state seal has remained stable, but historical prints show that details of the soldier, the eagle, and the agricultural background varied from engraver to engraver.
    - Unlike some states, Iowa did not repeatedly reinvent its seal. The most important transition was from territorial symbolism to the statehood-era design centered on the citizen soldier and the long motto.
  versions:
    - name: Territorial Seal
      years: 1838–1846
      image: /images/state-seals/iowa/versions/1838-territorial-seal.jpg
      description: The seal used by Iowa Territory before admission to the Union. It differs completely from the later state seal and belongs to the territorial government rather than the state founded in 1846.
    - name: Early State Seal Print
      years: 19th century
      image: /images/state-seals/iowa/versions/1903-historical-print.jpg
      description: A historical print of the Iowa state seal published in the early 20th century, preserving the 19th-century state-seal tradition. The citizen soldier, eagle, motto, and prairie setting are already in place, though linework and proportions vary from modern renderings.
    - name: Current Standard
      years: 1847–present
      image: /images/state-seals/iowa/versions/current-standard.svg
      description: The modern standard rendering of Iowa's state seal, preserving the statehood-era composition of the citizen soldier, eagle, long motto, agricultural tools, and river commerce scene.

