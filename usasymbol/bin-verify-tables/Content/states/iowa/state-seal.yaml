meaning: "The Great Seal of the State of Iowa places a citizen soldier at its center, flanked by farming tools and fertile fields, with a bald eagle above carrying the longest state motto in the United States. Together these figures express Iowa's founding conviction that free citizens, working the land and ready to defend their rights, form the backbone of a self-governing republic."
