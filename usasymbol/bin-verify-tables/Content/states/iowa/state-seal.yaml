faq:
- question: What is on the Iowa state seal?
  answer: The Iowa state seal features a citizen soldier holding a U.S. flag and rifle as the central figure, surrounded by a plow, farming fields, and tools. A bald eagle above holds a scroll with the state motto, and a river with a steamboat appears in the background.
- question: What does the Iowa state seal mean?
  answer: The seal expresses Iowa's founding values of liberty, civic duty, and agricultural prosperity. The citizen soldier represents a free people ready to defend their rights, the farming imagery honors the settlers who built the state, and the eagle and motto declare Iowa's commitment to civil liberties.
- question: When was the Iowa state seal adopted?
  answer: The Iowa state seal was authorized by the first Iowa General Assembly in 1847, within the first year after Iowa became the 29th state on December 28, 1846.
- question: What is the motto on the Iowa state seal?
  answer: '"Our Liberties We Prize And Our Rights We Will Maintain." It is the longest state motto in the United States and was adopted just 58 days after Iowa achieved statehood.'
- question: What law governs the Iowa state seal?
  answer: The Great Seal of the State of Iowa is governed by Iowa Code § 1.8, which establishes its official design and use on state documents.
- question: How does the Iowa state seal relate to the Iowa state flag?
  answer: The Iowa state flag, designed by Dixie Cornell Gebhardt in 1921, incorporates the bald eagle and the state motto directly from the seal. The flag's central design element is drawn from the seal's most recognizable imagery.
- question: Why does the Iowa seal show a citizen soldier?
  answer: Iowa's founders chose a citizen soldier rather than a professional military figure to express that liberty is defended by ordinary people. The figure holding a flag and rifle represents a free citizenry prepared to protect its own rights, which connects directly to the state motto.

