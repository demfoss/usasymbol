intro_text: "Iowa's state seal centers on a citizen soldier holding a U.S. flag and rifle, surrounded by farming tools and a river landscape, with a bald eagle above carrying the longest state motto in the United States. The seal was authorized in 1847, just weeks after Iowa became the 29th state. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
