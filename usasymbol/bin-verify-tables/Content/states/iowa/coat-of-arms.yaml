type: State Coat of Arms
state: Iowa
name: Iowa State Coat of Arms
adopted_year: 1847
is_official: true
meaning: "The Iowa coat of arms places a citizen soldier at the center of Iowa's founding landscape: on his left, wheat and farming tools; on his right, a lead furnace and smelted pig lead. Behind him, the Mississippi River and a steamboat connect Iowa to national trade routes. Above, a bald eagle carries the words Iowans adopted just 58 days after statehood, the longest state motto in the United States."
meaning_title: Meaning of the Iowa Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Iowa Coat of Arms: Meaning, Symbols and History'
seo_description: "The Iowa coat of arms was adopted in 1847 and shows a citizen soldier flanked by wheat and a lead furnace, representing Iowa's economy at statehood."
hero_image: /images/coats-of-arms/iowa/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Iowa, adopted 1847, showing a citizen soldier, bald eagle, farming tools, lead furnace, and Mississippi River
hero_image_caption: The Iowa Coat of Arms, adopted February 25, 1847. The design centers on a citizen soldier between wheat farming tools and a lead furnace, with the Mississippi River behind and a bald eagle above bearing the state motto.
intro_text: "The Iowa coat of arms shows a citizen soldier at the center, flanked by wheat farming tools on the left and a lead furnace on the right, with the Mississippi River and a bald eagle above. The First Iowa General Assembly adopted the design on February 25, 1847, fifty-eight days after Iowa became the 29th state. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Iowa Coat of Arms?
  paragraphs:
  - "The Iowa coat of arms is the state's official heraldic emblem, built around the same composition as the Great Seal of Iowa. It appears on official state documents, public buildings, and government communications."
  - "The design is circular, following the format of the state seal it shares imagery with. No traditional heraldic shield frames the figures; the citizen soldier, farming tools, and lead furnace stand in an open landscape. The bald eagle and motto scroll occupy the upper arc of the circle, while the river and steamboat fill the middle ground behind the soldier."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Iowa Coat of Arms
  paragraphs:
  - "Iowa was admitted to the Union as the 29th state on December 28, 1846. One of the first acts of the new state government was to create an official emblem. The First Iowa General Assembly approved the coat of arms on February 25, 1847, just fifty-eight days after statehood."
  - "Before statehood, Iowa used a territorial seal from 1839 to 1846. That seal was much simpler: it showed only a federal eagle holding a bow and arrow. The territorial emblem was well regarded as a clean, simple design and continued to appear on official documents and currency well into the 1860s, even after it was officially replaced."
  - "The new state design was far more detailed. The First General Assembly chose imagery that reflected the specific economic reality of Iowa in 1847: settlers breaking prairie land, lead mines operating near Dubuque, and steamboat trade on the Mississippi River. Because the law describing the coat of arms did not include an official illustration, engravers over the decades produced many slightly different visual renderings, varying in details of the soldier's posture, the eagle, and the agricultural background."
  - "Governor Ralph P. Lowe, who served from 1858 to 1860, publicly criticized the design, calling it a 'conglomerate of devices' in bad taste. His criticism did not lead to any official change. The composition adopted in 1847 has remained Iowa's coat of arms to this day."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Iowa Coat of Arms
  paragraphs:
  - "The Iowa coat of arms organizes five distinct visual elements into a single composition. Each element was chosen in 1847 to reflect a specific aspect of Iowa's geography, economy, or civic values."
  elements:
  - id: citizen-soldier
    name: Citizen Soldier
    image: /images/coats-of-arms/iowa/elements/citizen-soldier.webp
    paragraphs:
    - "The central figure is a citizen soldier standing in an open landscape. He holds an American flag and a liberty cap in his right hand and a rifle in his left. A plow stands behind him. Iowa Code specifies the liberty cap, an ancient symbol of freedom, though many historical engravings of the design show a wide-brimmed hat in its place."
    - "Iowa's founders chose a citizen soldier rather than a uniformed officer. The distinction mattered in 1847: the ideal of a self-governing republic depended on ordinary citizens, farmers and tradespeople, who were ready to defend their rights when called upon."
  - id: wheat-farming
    name: Wheat Sheaf and Farming Tools
    image: /images/coats-of-arms/iowa/elements/wheat-farming.webp
    paragraphs:
    - "On the left side, a sheaf of standing wheat, a sickle, and farming utensils appear near the bottom of the design. In 1847, wheat was Iowa's primary crop. Settlers who arrived in the early 1840s planted wheat first. Corn did not become Iowa's dominant crop until railroads arrived in the 1850s and 1860s and opened national markets."
    - "The farming tools placed agricultural labor at the symbolic heart of Iowa's identity from the first year of statehood."
  - id: lead-furnace
    name: Lead Furnace and Pig Lead
    image: /images/coats-of-arms/iowa/elements/lead-furnace.webp
    paragraphs:
    - "On the right side, a lead furnace and a pile of pig lead appear. Pig lead is a large slab of smelted metal with protruding corners used as handles. In 1847, lead mining near Dubuque was one of Iowa's most significant industries. The Dubuque mines had operated since the French colonial period and were still active when the coat of arms was adopted."
    - "No lead is mined in Iowa today. The furnace and pig lead on the coat of arms mark an industry that shaped Iowa's early economy and then disappeared entirely."
  - id: mississippi-steamboat
    name: Mississippi River and Steamboat
    image: /images/coats-of-arms/iowa/elements/mississippi-steamboat.webp
    paragraphs:
    - "The Mississippi River stretches across the background of the design, with a steamboat on the water. In 1847, the river was Iowa's main commercial highway, connecting the state to St. Louis and the wider American market. Iowa is bounded by the Mississippi to the east and the Missouri River to the west."
    - "The steamboat depicted is believed to represent the vessel Iowa, which in 1843 set a speed record on the Mississippi, traveling from Galena, Illinois to St. Louis in 44 hours. That record held until 1849."
  - id: eagle-motto
    name: Bald Eagle and State Motto
    image: /images/coats-of-arms/iowa/elements/eagle-motto.webp
    paragraphs:
    - "A bald eagle flies near the top of the design, holding a scroll in its beak. The scroll carries Iowa's state motto: Our liberties we prize and our rights we will maintain. At twelve words, it is the longest state motto of any U.S. state."
    - "The eagle appears on both the coat of arms and the Iowa state flag. The flag, designed by Dixie Cornell Gebhardt in 1921, took the eagle and motto imagery directly from the coat of arms."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Iowa Coat of Arms
  paragraphs:
  - "The coat of arms frames Iowa's founding moment through three kinds of labor: farming the prairie, smelting lead ore, and moving goods by river. Placing all three in the same image made a specific argument about the state's economic identity in 1847. Iowa was not yet an industrial state, but it was not only a farm. Several industries were taking hold at the same time."
  - "The citizen soldier at the center ties the economic imagery to a civic principle. He does not stand apart from the farmers and miners; he stands among them. The long motto above, twelve words insisting on liberty and rights, connects the visual to the political convictions Iowa's founders considered inseparable from prosperity."
  - "The lead furnace and wheat sheaf on the coat of arms are now historical artifacts. Neither industry looks the same in Iowa today. But the citizen soldier and the eagle with the motto remain unchanged, and the coat of arms continues to appear as Iowa's official heraldic emblem."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Iowa Coat of Arms Facts
  facts:
  - "Adopted: February 25, 1847, by the First Iowa General Assembly, fifty-eight days after Iowa became the 29th state on December 28, 1846."
  - "Iowa's state motto on the coat of arms, 'Our liberties we prize and our rights we will maintain,' is the longest state motto in the United States at twelve words."
  - "The lead mining depicted in the design was from the Dubuque, Iowa region. No lead is mined in Iowa today."
  - "The steamboat on the Mississippi River is believed to represent the vessel Iowa, which set a speed record in 1843 traveling from Galena, Illinois to St. Louis in 44 hours. That record held until 1849."
  - "Because the coat of arms law did not include an official illustration, engravers produced varied visual renderings over the decades, with small differences in the soldier, eagle, and background details."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Iowa Coat of Arms
  paragraphs:
  - "Iowa used a separate territorial seal from 1839 to 1846, before the current coat of arms was created at statehood. After 1847, the overall composition remained stable, but no official illustration was ever written into Iowa law. This allowed engravers to produce varied renderings over the decades."
  versions:
  - name: Territorial Seal
    years: 1839–1846
    image: /images/coats-of-arms/iowa/versions/1838-territorial-seal.jpg
    description: The seal used by Iowa Territory from 1839 to 1846. It showed a federal eagle holding a bow and arrow, a much simpler design than the state coat of arms adopted in 1847. The territorial seal was well regarded and continued appearing on official documents and currency well into the 1860s.
  - name: Historical Print
    years: 19th century
    image: /images/coats-of-arms/iowa/versions/1903-historical-print.jpg
    description: One of several historical print renderings of the Iowa coat of arms produced in the 19th and early 20th centuries. Because no official illustration was specified in Iowa law, engravers varied the details of the soldier, eagle, and agricultural background in their own renditions.
  - name: Official Standard
    years: 1847–present
    image: /images/coats-of-arms/iowa/versions/current-standard.svg
    description: The modern standard rendering of the Iowa coat of arms, preserving the composition adopted in 1847. Citizen soldier at center, wheat and farming tools on the left, lead furnace on the right, Mississippi River behind, and bald eagle above with the state motto.

faq:
- question: What does the Iowa coat of arms show?
  answer: "The Iowa coat of arms shows a citizen soldier at the center holding an American flag and a rifle. On his left are a wheat sheaf and farming tools. On his right are a lead furnace and pig lead. The Mississippi River with a steamboat appears behind him. Above, a bald eagle holds a scroll with the state motto."
- question: When was the Iowa coat of arms adopted?
  answer: "The Iowa coat of arms was adopted on February 25, 1847, by the First Iowa General Assembly. Iowa became a state on December 28, 1846, so the coat of arms was adopted just fifty-eight days after statehood."
- question: What does the citizen soldier on the Iowa coat of arms mean?
  answer: "The citizen soldier represents the idea that a free republic is defended by ordinary people, not by a professional standing army. He holds an American flag and a rifle, with a plow behind him, combining civic defense and agricultural labor in one figure."
- question: Why is there a lead furnace on the Iowa coat of arms?
  answer: "Lead mining near Dubuque was one of Iowa's major industries in 1847 when the coat of arms was adopted. The Dubuque mines had operated since the French colonial period. No lead is mined in Iowa today, so the furnace marks an industry central to early Iowa that has since disappeared."
- question: What is the motto on the Iowa coat of arms?
  answer: "'Our liberties we prize and our rights we will maintain.' At twelve words, it is the longest state motto of any U.S. state. It was adopted on February 25, 1847, fifty-eight days after Iowa became a state."
- question: What was Iowa's coat of arms before 1847?
  answer: "Before statehood, Iowa used a territorial seal that showed a federal eagle holding a bow and arrow. The territorial seal was used from 1839 to 1846 and was considered a simpler, well-liked design. It continued appearing on official documents and currency into the 1860s."
- question: Why does the Iowa coat of arms show wheat instead of corn?
  answer: "In 1847, when the coat of arms was adopted, wheat was Iowa's primary crop. Corn did not become Iowa's dominant crop until railroads arrived in the 1850s and 1860s and opened broader national markets. The wheat on the coat of arms reflects Iowa's economy at the moment of statehood."

