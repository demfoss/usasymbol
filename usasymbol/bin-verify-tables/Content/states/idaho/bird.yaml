title: Mountain Bluebird
scientific_name: Sialia currucoides
adopted_year: 1931
legislation: Idaho Code 67-4501
meaning: Idaho adopted the Mountain Bluebird on February 28, 1931 — the first in a cluster of state symbols formalized that same spring. The bird fits Idaho's open western landscapes rather than any single habitat, and it is one of only two states that chose it over the far more common Western Meadowlark.
conservation_status: Least Concern
habitat: Open country, meadows, sagebrush, fence lines, nesting cavities
size: 6.5-8 inches (16-20 cm)
wingspan: 11-14 inches (28-36 cm)
weight: 0.9-1.1 oz (25-31 g)
shared_states_text: Shared with Nevada
distinctive_song: Soft low warble
coloration: All-blue male
coloration_details: Female is gray-brown with blue in wings and tail
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: "2026-05-02"
seo_title: "Idaho State Bird | Mountain Bluebird"
seo_description: "Idaho adopted the Mountain Bluebird in 1931, the same spring it named a state flower and song. Only Nevada shares it."
intro_text: Idaho made the <strong>Mountain Bluebird</strong> its official state bird on <strong>February 28, 1931</strong>. That date matters because the bird did not enter law alone. In the same spring, Idaho also gave statutory recognition to the <strong>syringa</strong> as state flower and to <strong>Here We Have Idaho</strong> as state song. The state bird belongs to that wider 1931 burst of symbol-making, not just to a stand-alone bird designation. This profile appears in the [list of U.S. state birds](/symbols/birds).
