- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Forkwood Soil Grows in Wyoming
  paragraphs:
  - "Forkwood soil is concentrated in the eastern third of Wyoming — the upland terraces and plains east of the Laramie Range and north of the North Platte River. It is most extensive in Converse, Niobrara, Goshen, and Platte counties, where the terrain is flat to gently rolling at elevations between 4,500 and 6,000 feet."
  - "The soil extends north into Campbell and Weston counties where similar terrace surfaces and grassland conditions persist. It appears on the broad interfluve ridges between stream drainages — the high, flat ground that drains slowly and has accumulated deep alluvial and eolian material over millennia."
  counties:
  - Converse
  - Niobrara
  - Goshen
  - Platte
  - Laramie
  - Albany
  - Campbell
  - Weston
  - Crook

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Forkwood Soil
  paragraphs:
  - "Dryland winter wheat is the primary crop on Forkwood soil. Eastern Wyoming's 12 to 16 inches of annual precipitation sits near the minimum threshold for dryland wheat, and Forkwood's well-drained loamy surface and moderate water-holding capacity make it one of the better dryland crop soils in the region. Goshen and Platte counties produce the largest wheat volumes, with some fields on Forkwood soil rotating into fallow years to conserve moisture."
  - "Cattle rangeland covers the majority of Forkwood soil acreage. Blue grama, buffalo grass, western wheatgrass, and needle-and-thread grass are the native species that built the mollic epipedon and still dominate Forkwood rangeland. The well-drained surface supports livestock grazing without the muddy conditions found on heavier clay soils in wetter parts of the state."
  - "No significant tree cover grows naturally on Forkwood soil. Cottonwood and willow appear only in draws and along creek banks where soil moisture is supplemented by run-in from surrounding uplands. On dryland farms, shelterbelts of Russian olive and green ash were planted in the twentieth century to reduce wind erosion on the flat terrace surfaces."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Forkwood Soil Facts
  facts:
  - "Forkwood soil is classified as a fine-loamy, mixed, superactive, mesic Aridic Argiustoll — a Mollisol with an argillic clay subsoil in a semiarid climate. Aridic Argiustoll means the soil has the dark mollic surface of a grassland Mollisol but is dry for more than half the growing season, bridging the boundary between the wetter Great Plains Mollisols and the fully arid Aridisols of the Wyoming Basin."
  - "The mollic epipedon in Forkwood soil — the dark, organically enriched surface layer — requires centuries of grass growth to develop. Each shortgrass plant dies back annually, depositing roots and organic matter into the soil. The dark color in Forkwood's A horizon is the accumulated result of thousands of years of that cycle on a stable, ungrazed or lightly grazed surface."
  - "Forkwood soil contains a calcic Bk horizon — a layer where calcium carbonate has accumulated from downward-moving water that evaporated before reaching the water table. In Wyoming's semiarid climate, precipitation is barely enough to leach carbonates out of the upper soil, so they concentrate at depth and form the white filaments and soft masses visible in the Bk layer."
  - "Eastern Wyoming sits in the path of the prevailing westerly winds that cross the Rocky Mountains and descend dry onto the Great Plains. Forkwood soil's parent material includes a component of wind-deposited silt (loess) mixed with alluvium, giving the surface loam its fine texture and the profile its uniform, stone-free character across large areas of terrace surface."
  - "The Aridic moisture regime that defines Forkwood soil places it near the dry limit for Mollisols — the richest agricultural soil order. Immediately to the west and at higher elevations where precipitation drops below about 10 inches, the mollic epipedon cannot develop, and soils are classified as Aridisols instead. Forkwood marks the productive eastern edge of Wyoming's rangeland zone."

