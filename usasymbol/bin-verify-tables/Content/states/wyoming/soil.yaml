faq:
- question: What is Wyoming's state soil?
  answer: "Wyoming's state soil is the Forkwood series, a deep, well-drained Mollisol on the upland terraces and plains of eastern Wyoming. It has a dark, organically enriched surface layer built by centuries of shortgrass prairie and a brownish clay subsoil above a calcium carbonate accumulation zone."
- question: Why is it called Forkwood soil?
  answer: "The Forkwood series is named after Forkwood Draw, a drainage feature in eastern Wyoming where USDA soil scientists first formally described and mapped the series. Naming soil series after nearby geographic features — creeks, draws, and ridges — is standard USDA practice."
- question: What color is Forkwood soil?
  answer: "The surface is dark grayish brown from organic carbon built by shortgrass prairie roots. The argillic subsoil is brown to pale brown clay loam. Deeper layers lighten to light yellowish brown with white calcium carbonate accumulations, and the parent material is light brownish gray alluvium."
- question: Where is Forkwood soil found in Wyoming?
  answer: "Forkwood soil is found on the upland terraces and plains of eastern Wyoming, primarily in Converse, Niobrara, Goshen, Platte, and Laramie counties. It occurs at elevations between 4,500 and 6,000 feet on flat to gently rolling terrain east of the Laramie Range."
- question: What grows in Forkwood soil?
  answer: "Dryland winter wheat is the main crop. On rangeland — which covers most Forkwood soil acreage — native grasses dominate: blue grama, buffalo grass, western wheatgrass, and needle-and-thread grass. No native trees grow on Forkwood soil uplands; cottonwood and willow appear only in creek draws."
- question: What makes Forkwood soil dark on top?
  answer: "The dark surface is the mollic epipedon — a layer darkened by organic carbon from centuries of decomposing shortgrass prairie roots. Each year, grasses die back and deposit roots into the soil. Over thousands of years, that process built the thick, dark, organic-rich layer that defines Forkwood and other Mollisols."
- question: How is Forkwood soil different from other Wyoming soils?
  answer: "Most Wyoming soils are Aridisols — dry, pale, and low in organic matter. Forkwood is a Mollisol because its eastern Wyoming location receives just enough precipitation to support grass growth and organic matter accumulation. The dark mollic surface distinguishes it from the lighter Aridisols that dominate the drier Wyoming Basin to the west."

