sections:
- id: what-is-official
  icon: fa-solid fa-circle-info
  title: 'Tennessee State Beverage: Milk Since 2009'
  paragraphs:
  - Tennessee's official state beverage is milk. The state has a world-famous whiskey tradition and a soft drink with genuine Tennessee roots — but the legislature chose the agricultural product tied to Tennessee's working dairy farms, not its distilleries or its vending machines.
  - The 106th General Assembly made it official in 2009, connecting the designation explicitly to the state's dairy industry and its economic contribution to Tennessee agriculture. The act was about agriculture, not nostalgia, and that focus shapes what the symbol actually represents.
  - The Tennessee designation carries a particular edge because the state's global identity runs so strongly in another direction. For many people outside the state — and many inside it — Tennessee and whiskey are nearly synonymous. The [official state beverage list](/symbols/beverages) says otherwise.
- id: adoption
  icon: fa-solid fa-landmark
  title: 'The 2009 Designation: What the Dairy Numbers Said'
  paragraphs:
  - In 2009, the Tennessee General Assembly passed Public Chapter 31, formally designating milk as the official state beverage. The act was grounded in the dairy industry's documented contribution to Tennessee's agricultural economy — not sentiment, not lobbying theater.
  - "The 2007 production numbers cited in the act made the case plainly: Tennessee dairy operations produced nearly 100 million pounds of milk that year. Cash receipts for milk and milk products came in at nearly $202 million. The designation was, among other things, a recognition of an industry that did not always get attention in a state more famous for its corn whiskey and country music. The [Tennessee General Assembly's act](https://www.capitol.tn.gov/) tied the symbol directly to those figures."
- id: why-milk
  icon: fa-solid fa-bullseye
  title: Why Tennessee's Dairy Industry Needed the Symbol
  paragraphs:
  - Tennessee's dairy industry, concentrated in the eastern and middle parts of the state, had long operated in the shadow of more publicized agricultural sectors. Designating milk as the official state beverage put the industry into the symbolic record — the same record that holds the [state bird](/states/tennessee), the state flower, and the rest of the official catalog. For dairy farmers and the co-ops representing them, that visibility mattered.
  - The health angle was also woven into the act. Milk's nutritional case was part of the legislative argument — but whether that framing drove the vote or simply provided cover for an agriculture-industry designation depends on how cynically you read state symbol legislation. The production numbers were doing the real work.
- id: whiskey-confusion
  icon: fa-solid fa-circle-question
  title: Why Isn't Tennessee Whiskey the Official State Beverage?
  paragraphs:
  - Tennessee whiskey is one of the most recognizable American spirits on the planet. It has a legal definition — Tennessee law requires that anything sold as Tennessee whiskey be made in Tennessee, aged in new charred oak barrels, and filtered through maple charcoal before aging. That charcoal filtration step, called the Lincoln County Process, is what separates a Tennessee whiskey from a bourbon by law. The state takes the distinction seriously enough to have codified it.
  - None of that makes it the official state beverage. Fame and official designation are separate categories, and Tennessee has never made whiskey an official state symbol in the beverage category. The confusion is understandable — Jack Daniel's distillery in Lynchburg is one of the most visited tourism sites in the South, Tennessee whiskey is aggressively exported, and the state's identity in global markets is practically inseparable from the spirit. But the legislature chose milk.
  - The same logic applies to Mountain Dew, which has a documented origin story in Tennessee — the name and early formula came out of the state in the mid-twentieth century — but which has no official designation and no place on the [Tennessee state symbols](/states/tennessee) list. Being historically significant, commercially dominant, or culturally embedded does not automatically produce an official symbol. It takes a legislative act. For beverages, Tennessee's only official act named milk.
  - That gap between fame and official recognition is the tell. State symbol designations tend to honor industries that need visibility rather than industries that already have it. Whiskey needs no state seal. Dairy, quietly producing nearly $202 million in cash receipts while attracting none of the tourism headlines, was the one that did.
faq:
- question: What is the official state beverage of Tennessee?
  answer: Milk. Tennessee designated milk as its official state beverage in 2009 under Public Chapter 31 of the Acts of the 106th General Assembly.
- question: Why is Tennessee's state beverage milk and not whiskey?
  answer: Official state beverage designations reflect legislative decisions, not cultural fame. Tennessee whiskey has never received an official state beverage designation. The legislature chose milk in 2009 based on the dairy industry's contribution to Tennessee agriculture — nearly $202 million in cash receipts in 2007.
- question: When did Tennessee designate milk as the state beverage?
  answer: 2009. Public Chapter 31 of the 106th General Assembly made the designation official.
- question: Is Tennessee whiskey an official state symbol?
  answer: Tennessee whiskey is not the official state beverage. It has no official state symbol designation in the beverage category.
- question: Is Mountain Dew an official Tennessee symbol?
  answer: No. Despite having historical roots in Tennessee, Mountain Dew holds no official state symbol designation.
- question: How much milk did Tennessee produce when the designation was made?
  answer: According to figures cited at the time of designation, Tennessee dairy operations produced nearly 100 million pounds of milk in 2007. Cash receipts for milk and milk products totaled nearly $202 million that year.
