intro_text: Tennessee's official state beverage is **milk**, designated in **2009**. The state is known worldwide for Tennessee whiskey — Jack Daniel's and George Dickel among them — and Mountain Dew has its own well-documented Tennessee roots. The 106th General Assembly looked past both and named the one tied to the state's working dairy farms.
