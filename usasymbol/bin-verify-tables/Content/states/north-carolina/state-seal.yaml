meaning: "The Great Seal of North Carolina places two allegorical figures at its center: Liberty on the left and Plenty on the right. Between them, two specific dates anchor the seal to North Carolina's claim as the colony that led America toward independence. May 20, 1775, marks the disputed Mecklenburg Declaration; April 12, 1776, marks the Halifax Resolves, the first official colonial action authorizing a vote for independence."
