intro_text: "North Carolina's state seal shows Liberty and Plenty flanking two dates, May 20, 1775, and April 12, 1776, that mark the state's claim to have led the push for American independence, with the motto Esse Quam Videri, meaning \"To be rather than to seem.\ This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
