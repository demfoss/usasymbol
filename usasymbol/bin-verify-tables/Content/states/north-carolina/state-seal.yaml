sections:
- id: history
  icon: fa-solid fa-landmark
  title: North Carolina State Seal History and Origin
  paragraphs:
  - "North Carolina adopted its first state seal in 1776, as the colony organized itself into an independent state during the Revolutionary War. Like other new states, North Carolina needed official emblems to authenticate legal documents, assert sovereignty, and function as a government."
  - "The design embedded two specific dates that North Carolinians considered central to the revolutionary story. May 20, 1775, commemorates the Mecklenburg Declaration of Independence, a document allegedly signed in Charlotte a full year before the national Declaration. April 12, 1776, marks the Halifax Resolves, the first formal colonial action instructing delegates to vote for independence from Britain."
  - "The seal has been revised and standardized over time. The current version, adopted in 1971, retains the original composition while updating proportions and rendering for modern official use."

- id: elements
  icon: fa-solid fa-shapes
  title: What the North Carolina State Seal Symbols Mean
  paragraphs:
  - 'The Great Seal of North Carolina builds its symbolism around two allegorical figures and two specific historical dates, with a landscape of mountains and sea behind them.'
  elements:
  - id: liberty
    name: Liberty
    image: /images/state-seals/north-carolina/elements/liberty.webp
    paragraphs:
    - "Liberty is the figure on the left side of the seal. She holds a pole topped with a Phrygian cap, the classical symbol of freed slaves in Rome that became a standard emblem of liberty in revolutionary-era American iconography. In her other hand she holds a document representing constitutional government."
    - "The Phrygian cap on Liberty's pole connects North Carolina's seal to a visual language used widely by the American founders. The same cap appears on other state seals, on early American coins, and in French revolutionary imagery. Liberty faces Plenty across the seal's composition, suggesting that freedom and prosperity are mutually dependent."
  - id: plenty
    name: Plenty
    image: /images/state-seals/north-carolina/elements/plenty.webp
    paragraphs:
    - "Plenty stands on the right side of the seal, holding a cornucopia from which grain and produce spill. She represents the agricultural abundance of North Carolina, which was one of the most productive farming colonies before independence."
    - "During the colonial period, North Carolina's economy depended on tobacco, grain, and naval stores: tar, pitch, and turpentine harvested from the state's longleaf pine forests. Plenty's cornucopia reflects that agricultural base, not a generic claim of prosperity."
  - id: mecklenburg-date
    name: May 20, 1775
    image: /images/state-seals/north-carolina/elements/date-1775.webp
    paragraphs:
    - "The date May 20, 1775, refers to the Mecklenburg Declaration of Independence, a document that citizens of Mecklenburg County, near present-day Charlotte, allegedly signed a full year before the national Declaration. If authentic, it would make North Carolina the first place in America to formally declare independence from Britain."
    - "Historians have disputed the Mecklenburg Declaration since the nineteenth century. The original document has never been found; the text in circulation is a reconstruction published in 1819, reportedly assembled from memory after the original was destroyed in a fire. North Carolina has maintained the date on the seal regardless."
  - id: halifax-date
    name: April 12, 1776
    image: /images/state-seals/north-carolina/elements/date-1776.webp
    paragraphs:
    - "The date April 12, 1776, refers to the Halifax Resolves, passed by North Carolina's Provincial Congress in Halifax. The resolves formally instructed North Carolina's delegates to the Continental Congress to vote in favor of independence, the first official action by any colony to do so."
    - "Unlike the Mecklenburg Declaration, the Halifax Resolves survive in their original form and are fully documented in historical records. North Carolina's claim to be the first colony to officially authorize independence is verifiable, which is why April 12 appears not only on the state seal but also on the North Carolina state quarter."
  - id: esse-quam-videri
    name: Esse Quam Videri (The State Motto)
    image: /images/state-seals/north-carolina/elements/motto.webp
    paragraphs:
    - '*Esse Quam Videri* is Latin for "To be rather than to seem." The phrase comes from Cicero''s *De Amicitia*, written in 44 BC as a dialogue on the nature of true friendship and integrity. North Carolina adopted it as the state motto and placed it at the base of the seal.'
    - "The motto connects North Carolina's seal to classical Roman literature and to the founders' familiarity with Latin texts. As a civic statement, it positions substance over reputation, a preference the state has preserved on its official seal since 1776."
  - id: ship
    name: Ship
    image: /images/state-seals/north-carolina/elements/ship.webp
    paragraphs:
    - "A sailing ship appears in the background of the seal, representing North Carolina's maritime commerce. The state's ports, particularly at Wilmington and New Bern on the Cape Fear and Neuse rivers, were active trade hubs throughout the colonial era."
    - "Naval stores (tar, pitch, and turpentine distilled from the longleaf pine forests) were North Carolina's most valuable export to Britain. The ship on the seal connects to that export economy as much as to exploration or settlement."
  - id: mountains
    name: Mountains
    image: /images/state-seals/north-carolina/elements/mountains.webp
    paragraphs:
    - "Mountains rise in the background of the seal, representing the Blue Ridge and Appalachian ranges that define North Carolina's western geography. Their presence acknowledges the full geographic range of the state, from the Atlantic coast to the inland highlands."
    - "The Blue Ridge and Appalachians were a frontier during the colonial period and remained a significant barrier to westward expansion into the eighteenth century. North Carolina describes its terrain as running from the mountains to the sea, and the seal's background reflects that range."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the North Carolina State Seal'
  paragraphs:
  - "North Carolina's seal has kept its core composition since 1776 (Liberty, Plenty, the two dates, and the motto Esse Quam Videri) while the rendering and proportions have been revised over time to meet changing official standards."

