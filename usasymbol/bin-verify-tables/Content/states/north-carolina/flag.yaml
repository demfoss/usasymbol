type: State Flag
state: North Carolina
name: North Carolina State Flag
adopted_year: 1885
standardized_year: 1991
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-05-01"

seo_title: "North Carolina State Flag | Dates & Meaning"
seo_description: "North Carolina's flag highlights the 1775 Mecklenburg Declaration and 1776 Halifax Resolves."

intro_text: "North Carolina established its state flag in 1885, featuring a white star on a blue vertical bar with red and white horizontal stripes and placing it among the defining designs in the [list of U.S. state flags](/symbols/flags). Two dates appear on gold scrolls above and below the star. The letters N and C flank the star in gold."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the North Carolina State Flag Is Designed"
    paragraphs:
      - "The North Carolina state flag is the official state flag of North Carolina. A vertical blue bar covers the left third. Two horizontal stripes fill the right side. Red sits on top. White runs along the bottom."
      - "A white star appears in the center of the blue bar. Gold letters N and C stand on either side of the star. Two dates appear on gold scrolls. May 20th, 1775 curves above. April 12th, 1776 curves below. Schools, courthouses, and public buildings throughout North Carolina raise this flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the North Carolina Flag Communicates"
    paragraphs:
      - "The flag represents North Carolina's early resistance to British authority. May 20th, 1775 commemorates the Mecklenburg Declaration of Independence, traditionally associated with early resistance to British rule in Mecklenburg County. The original document has not survived, and historians debate its exact nature."
      - "April 12th, 1776 marks the Halifax Resolves. North Carolina became the first colony to officially authorize its delegates to vote for independence from Britain. This resolution paved the way for the Declaration of Independence and reinforces values in [North Carolina's motto](/states/north-carolina/motto/esse-quam-videri)."
      - "The white star symbolizes North Carolina's identity as a state and its role in the Union. Red represents courage and sacrifice. White stands for purity. Blue symbolizes vigilance and justice, aligning with the broader identity of [the Tar Heel State](/states/north-carolina/nickname/the-tar-heel-state)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "North Carolina Flag History and Adoption"
    paragraphs:
      - "North Carolina approved its current flag design in 1885. The legislature replaced an earlier Civil War-era flag. Colonel John D. Whitford designed the 1885 flag. He kept the basic layout but changed key elements."
      - "The first official state flag dated to 1861. William G. Browne designed it during the Civil War. That flag showed May 20th, 1861 as the date. This marked North Carolina's secession to join the Confederacy. After the war, the state wanted a design focused on earlier independence history."
      - "The 1885 flag swapped the positions of blue and red stripes. It replaced the secession date with April 12th, 1776. The letters N and C were added flanking the star. In 1991, the legislature changed the proportions from 3:4 to 2:3. This made the flag wider and easier to manufacture, while keeping continuity with [North Carolina's official colors](/states/north-carolina/color/north-carolina-official-state-colors-red-and-blue)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the North Carolina Flag"
    versions:
      - name: "Confederate-Era Flag"
        years: "1861–1865"
        image: "versions/confederate-1861.webp"
        description: "Designed by William G. Browne, featured May 20th 1861 as the secession date with different stripe arrangement."

      - name: "1885 State Flag"
        years: "1885–1991"
        image: "versions/flag-1885.webp"
        description: "Blue and red stripes swapped positions, letters N and C added, May 20th 1861 replaced with April 12th 1776, both dates given golden scrolls."

      - name: "Current State Flag"
        years: "1991–present"
        image: "versions/current-1991.webp"
        description: "Proportions changed from 3:4 to 2:3 ratio making the flag wider."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the North Carolina Flag"
    symbols:
      - id: star
        name: "White Star"
        image: "symbols/star.svg"
        paragraphs:
          - "A white five-pointed star appears in the center of the blue bar. The star represents North Carolina's identity as a state and its role in the Union. It symbolizes the state's place among the United States."
          - "The star connects to North Carolina's early moves toward independence. Both dates surrounding the star mark revolutionary actions taken before the national Declaration of Independence."

      - id: dates
        name: "Historical Dates"
        image: "symbols/dates.svg"
        paragraphs:
          - "Two dates appear on gold scrolls. May 20th, 1775 sits above the star. This date commemorates the Mecklenburg Declaration of Independence, traditionally associated with early resistance to British authority in Mecklenburg County. The original document has not survived, and the event remains historically debated."
          - "April 12th, 1776 appears below the star. The Halifax Resolves were adopted on this date. North Carolina became the first colony to instruct its delegates to vote for independence from Britain. This resolution came three months before the national Declaration of Independence."

      - id: letters
        name: "N and C Letters"
        image: "symbols/letters.svg"
        paragraphs:
          - "The initials N and C appear in gold on either side of the star, identifying the flag as belonging to North Carolina. These letters were added in 1885."
          - "The letters help distinguish North Carolina's flag from other state flags. They make the flag easy to recognize."

      - id: stripes
        name: "Red and White Stripes"
        image: "symbols/stripes.svg"
        paragraphs:
          - "Two horizontal stripes fill the right side of the flag. Red occupies the top stripe. White fills the bottom stripe. These colors match the United States flag."
          - "Red represents courage and sacrifice. White symbolizes purity and innocence. Together they connect North Carolina to the broader American identity."

      - id: blue-bar
        name: "Blue Vertical Bar"
        image: "symbols/blue-bar.svg"
        paragraphs:
          - "A vertical blue bar covers the left third of the flag. This bar holds the star, letters, and dates. Blue represents vigilance, perseverance, and justice."
          - "The blue also connects to the United States flag. It demonstrates North Carolina's loyalty to the Union."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "North Carolina State Flag Colors"
    paragraphs:
      - "The flag uses red, white, blue, and gold. Red and white form the horizontal stripes. Blue creates the vertical bar. Gold appears in the letters N and C and the date scrolls, and these tones can be compared in [U.S. state colors](/symbols/colors)."
    colors:
      - name: "Red"
        hex: "#C8102E"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Blue"
        hex: "#003366"
      - name: "Gold"
        hex: "#FFD700"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Carolina State Flag Facts"
    facts:
      - "North Carolina adopted its current flag design in 1885"
      - "Colonel John D. Whitford designed the 1885 flag"
      - "William G. Browne designed the 1861-1865 flag"
      - "May 20th, 1775 commemorates the Mecklenburg Declaration"
      - "April 12th, 1776 marks the Halifax Resolves"
      - "The flag proportions changed from 3:4 to 2:3 in 1991"

faq:
  - question: "What design is recognized as the state flag of North Carolina?"
    answer: "The North Carolina state flag is the official banner of North Carolina. It features a white star with the letters N and C on a blue vertical bar, with red and white horizontal stripes and two historical dates."

  - question: "What does North Carolina's flag look like?"
    answer: "The flag shows a vertical blue bar on the left with a white star in the center. The letters N and C flank the star. Two dates appear on gold scrolls above and below. Red and white horizontal stripes fill the right side."

  - question: "What meaning is attached to North Carolina's flag?"
    answer: "The flag represents North Carolina's early resistance to British authority. The two dates mark events associated with independence movements occurring before the national Declaration of Independence."

  - question: "How do historians explain the symbolism of North Carolina's flag?"
    answer: "The flag means North Carolina's pioneering role in American independence. May 20th, 1775 commemorates the Mecklenburg Declaration. April 12th, 1776 shows North Carolina authorizing its delegates to vote for independence."

  - question: "What colors are used on North Carolina's flag?"
    answer: "The North Carolina state flag uses red, white, blue, and gold. Red and white form horizontal stripes. Blue creates a vertical bar. Gold appears in the letters and date scrolls."

  - question: "How is North Carolina's flag usually described?"
    answer: "May 20th, 1775 and April 12th, 1776 appear on the flag. The first commemorates the Mecklenburg Declaration. The second marks the Halifax Resolves authorizing a vote for independence."

  - question: "When was the present North Carolina flag approved in law?"
    answer: "North Carolina adopted its current flag design in 1885 and modified the proportions in 1991."

