intro_text: "North Carolina's state motto is <strong>Esse Quam Videri</strong>, a Latin phrase meaning <em>To Be Rather Than to Seem</em>. The General Assembly adopted it on February 21, 1893, making North Carolina the last of the original thirteen colonies to have an official state motto. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

