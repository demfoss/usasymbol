faq:
  - question: "What is North Carolina's state motto?"
    answer: "North Carolina's state motto is \"Esse Quam Videri,\" a Latin phrase meaning \"To Be Rather Than to Seem.\" The General Assembly adopted it in 1893."

  - question: "What does \"Esse Quam Videri\" mean?"
    answer: "The phrase means \"To Be Rather Than to Seem.\" It values real character and genuine action over outward appearance — what a person actually is, not how they look to others."

  - question: "What is the English translation of \"Esse Quam Videri\"?"
    answer: "The English translation is \"To Be Rather Than to Seem.\" Esse means \"to be,\" quam means \"rather than,\" and videri means \"to seem\" or \"to appear.\""

  - question: "When did North Carolina adopt its state motto?"
    answer: "The General Assembly adopted \"Esse Quam Videri\" on February 21, 1893, through Chapter 145. Before that, North Carolina was the only original colony without an official motto."

  - question: "Where did North Carolina's motto come from?"
    answer: "The phrase comes from Cicero's De Amicitia (On Friendship), Chapter 26, written in 44 BCE. Jurist and historian Walter Clark selected it and drafted the bill for adoption."

