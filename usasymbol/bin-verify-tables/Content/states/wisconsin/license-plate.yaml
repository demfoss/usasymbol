    years: 1940-present
    image: /images/license-plates/wisconsin/1940-americas-dairyland.jpg
    description: The only standard plate slogan Wisconsin has used. It continued through wartime tabs, postwar staggered registration, annual plates, graphic plates, and the modern passenger base.
  - name: America's Dairyland / bicentennial-era base
    years: 1976-1986
    image: /images/license-plates/wisconsin/1976-americas-dairyland.png
    description: Wisconsin kept the slogan on the red-white-blue era base before moving to its first graphic passenger plate.
  - name: America's Dairyland / first graphic base
    years: 1986-2000
    image: /images/license-plates/wisconsin/1986-first-graphic-base.jpg
    description: Wisconsin introduced its first graphic passenger plate in 1986, adding a farm scene while retaining "America's Dairyland."
  - name: America's Dairyland / current graphic base
    years: 2000-present
    image: /images/license-plates/wisconsin/current-sample-americas-dairyland.gif
    description: Current passenger base. The serial format changed from 123-ABC to ABC-1234 in 2017, but the slogan stayed unchanged.

timeline:
- year: '1905'
  description: Wisconsin first requires motor vehicle registration and plates.
- year: '1940'
  description: Wisconsin introduces "America's Dairyland" on standard passenger plates.
- year: '1942'
  description: Wartime metal conservation leads Wisconsin to revalidate plates with tabs in the 1940s, but the slogan continues.
- year: '1945'
  description: Wisconsin begins staggered registration and renewal, an important plate-administration change after the wartime period.
- year: '1986'
  description: Wisconsin introduces its first graphic passenger plate while keeping "America's Dairyland."
- year: '2000'
  description: The current passenger graphic base begins.
- year: '2017'
  description: The standard passenger serial format changes to ABC-1234; the slogan remains unchanged.

faq:
- question: What is Wisconsin's license plate slogan?
  answer: Wisconsin's standard license plate slogan is "America's Dairyland."
- question: When did Wisconsin first use America's Dairyland on plates?
  answer: Wisconsin first used "America's Dairyland" on standard passenger plates in 1940.
- question: Has Wisconsin ever used another standard plate slogan?
  answer: No. Wisconsin's standard plate slogan history is essentially no slogan before 1940, then "America's Dairyland" from 1940 to the present.
- question: Is America's Dairyland Wisconsin's official nickname?
  answer: No. Wisconsin's official nickname is "The Badger State." "America's Dairyland" is the license plate slogan and dairy-industry identity phrase.
- question: When did Wisconsin's current plate base begin?
  answer: Wisconsin's current passenger base began in 2000. The current ABC-1234 serial format began in 2017.
- question: What does America's Dairyland mean?
  answer: It refers to Wisconsin's dairy industry, especially milk and cheese production, which has been central to the state's identity and economy for generations.

