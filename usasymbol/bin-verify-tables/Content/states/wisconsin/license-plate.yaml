hero_image_alt: Wisconsin sample license plate with America's Dairyland slogan
hero_image_caption: "WisDOT's current sample passenger plate shows the graphic base and the long-running \"America's Dairyland\" slogan."
intro_text: '**"America''s Dairyland"** is Wisconsin''s standard license plate slogan. It first appeared on Wisconsin passenger plates in **1940** and has remained the state''s plate slogan through every major redesign since. The current passenger base dates to **2000**, while the familiar farm-and-sky graphic style began earlier, in 1986. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: '"America''s Dairyland" is Wisconsin''s license plate slogan, first introduced in 1940 and still used today. Wisconsin has not replaced it with another standard slogan. The current passenger base began in 2000, and the present ABC-1234 serial format began in 2017.'
