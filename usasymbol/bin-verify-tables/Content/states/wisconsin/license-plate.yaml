sections:
- id: current-slogan
  icon: fa-solid fa-cow
  title: Current Slogan
  paragraphs:
  - "\"America's Dairyland\" remains Wisconsin's standard license plate slogan. Wisconsin law requires the words on registration plates, and WisDOT's current sample passenger plate still displays the slogan."
  - The current passenger base began in 2000 with the farm scene, red "WISCONSIN" text, and "America's Dairyland" at the bottom. In 2017, Wisconsin shifted from the `123-ABC` passenger serial format to `ABC-1234`, but the slogan and general base design remained.
  - The slogan is separate from Wisconsin's official nickname, "The Badger State." The nickname points to lead-mining history; the plate slogan names the dairy economy.

- id: slogan-origin
  icon: fa-solid fa-cheese
  title: Why "America's Dairyland"
  paragraphs:
  - Wisconsin adopted the slogan because dairy had become the state's defining agricultural industry. Cheese, butter, milk, and dairy farming shaped the state's rural economy and national image long before the phrase appeared on plates.
  - '"America''s Dairyland" first appeared on passenger plates in 1940. It was not a temporary commemorative phrase; it became the state''s permanent plate identity.'
  - The phrase has survived redesign debates because it still describes a real industry. Wisconsin remains one of the country's dominant dairy and cheese-producing states, even as the state's economy has broadened far beyond agriculture.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Wisconsin License Plate Slogans by Era
  paragraphs:
  - 'Wisconsin''s slogan sequence is simple: no standard slogan before 1940, then "America''s Dairyland" continuously after that.'
  versions:
