faq:
  - question: "What is Georgia's state motto?"
    answer: "Georgia's state motto is \"Wisdom, Justice, Moderation.\" Adopted in 1776, the three words appear divided across the three pillars on the Great Seal of Georgia, one word per branch of government."

  - question: "What does \"Wisdom, Justice, Moderation\" mean?"
    answer: "The three words name the virtues Georgia's founders believed a constitutional republic requires: sound judgment, fairness under law, and restraint against extremes of power. Each word is assigned to one of the three branches of government on the state seal."

  - question: "When did Georgia adopt its state motto?"
    answer: "Georgia adopted \"Wisdom, Justice, Moderation\" in 1776, when the Second Provincial Congress created the Great Seal. The motto has been part of the seal — unchanged in wording — through revisions in 1799 and the standardization in 1914."

  - question: "Where does Georgia's motto appear?"
    answer: "The motto appears divided across the three pillars on the Great Seal of Georgia, one word per column beneath the arch inscribed \"Constitution.\" It also appears in various arrangements on the Georgia state flag."

