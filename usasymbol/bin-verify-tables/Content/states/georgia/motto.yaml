seo_description: "Georgia's state motto is \"Wisdom, Justice, Moderation.\" Adopted in 1776, each word appears on one of the three pillars on the Great Seal of Georgia."

intro_text: "Georgia's state motto is <strong>Wisdom, Justice, Moderation</strong>. Adopted in 1776 — the same year as the Declaration of Independence — the three words appear divided across the three pillars of the Great Seal, one word per branch of government. The seal, and the motto within it, predate the United States Constitution by eleven years. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

