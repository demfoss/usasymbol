faq:
- question: What is Pennsylvania's state fossil?
  answer: "Pennsylvania's state fossil is the trilobite, specifically Phacops rana. It was designated by the Pennsylvania General Assembly in 1988."
- question: When did Pennsylvania adopt its state fossil?
  answer: "Pennsylvania adopted the trilobite (Phacops rana) as its state fossil in 1988, following a push from Pennsylvania schoolchildren who petitioned the state legislature."
- question: What did the trilobite look like?
  answer: "Phacops rana was 1 to 3 inches long with a hard, segmented shell divided into a head, middle section, and tail plate. Its most recognizable feature was a pair of large raised eyes made of individual calcite lenses. It could roll into a tight ball when threatened."
- question: Where are trilobite fossils found in Pennsylvania?
  answer: "Phacops rana fossils are found across Pennsylvania in Devonian shale formations. The Mahantango Formation in Perry, Juniata, and Snyder counties is one of the most productive sites. Fossils also appear in Crawford, Mercer, and Erie counties in western Pennsylvania."
- question: When did the trilobite live?
  answer: "Phacops rana lived during the Middle Devonian period, roughly 385 to 374 million years ago. Trilobites as a group went extinct about 359 million years ago at the end of the Devonian mass extinction."
- question: Who pushed to make the trilobite Pennsylvania's state fossil?
  answer: "Pennsylvania schoolchildren led the effort to designate Phacops rana as the state fossil. Their petition to the General Assembly resulted in the official designation in 1988."

