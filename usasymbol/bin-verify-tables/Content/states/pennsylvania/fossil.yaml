- id: facts
  icon: fa-solid fa-lightbulb
  title: Trilobite Facts
  facts:
  - "Pennsylvania adopted Phacops rana as its state fossil in 1988, driven by a campaign from Pennsylvania schoolchildren."
  - "Phacops rana had schizochroal eyes — calcite lenses spaced individually, unlike the fused lenses of most other trilobites."
  - "Enrolled (curled-up) Phacops specimens are among the most common trilobite fossils in Pennsylvania Devonian shale."
  - "Trilobites first appeared in the Cambrian period, about 521 million years ago, and survived for roughly 270 million years before the last species went extinct at the end of the Permian period, about 252 million years ago."
  - "Pennsylvania's Devonian shale beds belong to the Hamilton Group, one of the most intensively studied Devonian fossil formations in North America."

