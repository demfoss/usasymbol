faq:
- question: What is Rhode Island's state fossil?
  answer: "Rhode Island's state fossil is the trilobite, a prehistoric marine invertebrate that lived during the Paleozoic era. The 2023 law designates trilobites broadly without naming a specific genus or species."
- question: When did Rhode Island adopt its state fossil?
  answer: "Rhode Island designated the trilobite as its official state fossil in 2023, one of the last states in the country to make such a designation."
- question: What did the trilobite look like?
  answer: "Trilobites had a hard, segmented shell divided into three lengthwise lobes. The body had a domed head shield, a flexible segmented middle, and a fused tail plate. Most were a few inches long, though some species grew to over two feet. Many had compound eyes made of calcite crystal."
- question: Where are trilobite fossils found in Rhode Island?
  answer: "Trilobite fossils are found in Paleozoic rock formations, particularly in northern Rhode Island near the Massachusetts border where Cambrian and Ordovician rocks are exposed. Much of the state's bedrock is metamorphic and does not preserve fossils."
- question: When did the trilobite live?
  answer: "Trilobites lived from the Cambrian period about 521 million years ago through the end of the Permian period about 252 million years ago, a span of nearly 270 million years."
- question: Who pushed to make it the state fossil?
  answer: "Rhode Island's General Assembly passed the trilobite designation in 2023. The state was one of the last in the country to adopt an official state fossil."

