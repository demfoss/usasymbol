faq:
- question: What is Massachusetts's state soil?
  answer: "Massachusetts's state soil is the Paxton series, a well-drained glacial loam found across virtually all of mainland Massachusetts. It was designated the official state soil in 1990 under Massachusetts General Laws, Chapter 2, Section 33."
- question: Why is it called Paxton soil?
  answer: "The name comes from the town of Paxton in Worcester County, Massachusetts, where soil scientists first described and mapped this series in 1922."
- question: What color is Paxton soil?
  answer: "The surface layer is dark brown. Below that, the subsoil turns dark yellowish brown, then olive brown. The dense bottom layer of glacial till is olive — a muted greenish-brown from the mix of schist, gneiss, and granite ground up by the glacier."
- question: Where is Paxton soil found in Massachusetts?
  answer: "Paxton soil covers about 400,000 acres across mainland Massachusetts, in nearly every county except the Cape and islands. It sits on the rolling glacial uplands that make up most of the state's interior."
- question: What grows in Paxton soil?
  answer: "The main crops are apples, corn, and silage. Farmers also grow hay and use it for pasture. Where land is wooded, Paxton soil supports red and white oak, hickory, sugar maple, red maple, birch, white pine, and hemlock."
- question: Who chose the Paxton soil as Massachusetts's state soil?
  answer: "The Massachusetts Legislature designated the Paxton series in 1990. Paxton is the most extensive soil series in the state and was first mapped in Massachusetts in 1922, making it a natural choice to represent the commonwealth."
- question: How deep is Paxton soil?
  answer: "The soil goes very deep to bedrock, but most roots stop at about 26 inches, where they hit the dense Cd horizon — compacted glacial till that is very firm and hard to penetrate. This dense layer extends from about 26 to 65 inches below the surface."

