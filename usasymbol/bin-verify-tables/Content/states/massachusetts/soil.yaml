seo_title: "Massachusetts State Soil | Paxton Series"
seo_description: "The Massachusetts state soil is the Paxton series, adopted in 1990. It covers 400,000 acres of mainland Massachusetts and grows apples, corn, and hay."
hero_image: /images/soils/massachusetts/massachusetts-state-soil-hero.webp
