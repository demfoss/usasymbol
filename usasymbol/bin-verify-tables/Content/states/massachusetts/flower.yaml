seo_title: "Massachusetts State Flower | Mayflower"
seo_description: "The Mayflower became Massachusetts's state flower in 1918. This fragrant pink and white wildflower blooms in early spring across Massachusetts forests."

intro_text: "Massachusetts designated the Mayflower as its official state flower in 1918. These small fragrant flowers bloom in woodland areas throughout Massachusetts. Pink and white blossoms appear among evergreen leaves in early spring before most other wildflowers emerge, and this entry appears in the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Massachusetts"
    paragraphs:
      - "Massachusetts officially recognizes the Mayflower as its state flower. Each cluster contains 3 to 10 small tubular flowers. The blooms display pink or white petals. A sweet spicy fragrance attracts early spring pollinators. The flowers measure about half an inch long. Waxy evergreen leaves remain green throughout winter."
      - "Mayflowers bloom from March through May across Massachusetts. Peak flowering occurs in April when the name makes most sense. The plant grows as a low trailing vine. Stems spread along the forest floor. Oval leathery leaves cover the ground year-round. The plant rarely exceeds 6 inches in height."
      - "This native wildflower grows in Massachusetts woodlands and pine forests. Acidic soil suits Mayflower best. The plant prefers partial shade under trees. Well-drained sandy or rocky soil provides ideal conditions. Mayflower grows slowly and takes years to establish. Wild populations have declined due to habitat loss and over-picking."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Mayflower"
    paragraphs:
      - "Known as Mayflower, this plant's scientific designation is Epigaea repens. The species belongs to the Ericaceae family. This family includes blueberries, azaleas, rhododendrons, and mountain laurel along with hundreds of other species worldwide."
      - "The genus name Epigaea comes from Greek words meaning upon the earth. It describes the plant's low growing habit. The species name repens means creeping in Latin. Trailing arbutus serves as another common name. Ground laurel appears in some older botanical texts."
      - "The name Mayflower connects to the ship that brought Pilgrims to Plymouth in 1620. Colonists found this flower blooming their first spring in Massachusetts. They named it after their ship. Some confusion exists because other spring flowers also carry the name Mayflower. Massachusetts specifically recognizes Epigaea repens as the official state flower, reinforcing [The Bay State nickname](/states/massachusetts/nickname/the-bay-state)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Mayflower Became the Massachusetts State Flower"
    paragraphs:
      - "Massachusetts established the Mayflower as its official state flower in 1918. The state legislature passed this designation following a campaign by various civic organizations. Historical connection to the Pilgrims influenced the selection strongly. The flower symbolized Massachusetts's colonial heritage and founding story alongside the [official Massachusetts state flag](/states/massachusetts/flag/massachusetts-state-flag)."
      - "Women's clubs throughout Massachusetts promoted the Mayflower selection. They argued this native wildflower represented Massachusetts history better than any cultivated garden flower. The plant's delicate beauty appealed to residents. Its early spring blooms symbolized hope and renewal after harsh New England winters, much like themes echoed in the [Massachusetts state motto](/states/massachusetts/motto/ense-petit-placidam-sub-libertate-quietem)."
      - "Some debate occurred over the flower's declining wild populations. Conservation groups worried official designation might encourage more picking. The legislature addressed this by including protection language. Massachusetts law prohibits picking Mayflowers on public land. The designation became official on May 1, 1918. This date appropriately fell during the flower's blooming season."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Massachusetts State Flower Facts"
    facts:
      - "The Mayflower grows extremely slowly and can take 10 to 15 years to establish from seed, making wild populations vulnerable to disturbance"
      - "Massachusetts law protects the Mayflower from picking on public lands, with violations subject to fines for removing this protected wildflower"
      - "Massachusetts adopted the Mayflower on May 1, 1918, choosing a date that fell appropriately during the flower's spring blooming period"
      - "Pilgrims found this flower blooming their first spring in Massachusetts and named it after the ship Mayflower that brought them to Plymouth in 1620"
      - "The Mayflower requires specific soil fungi to grow successfully, forming a symbiotic relationship that makes transplanting difficult"
      - "Each Mayflower plant can live for many decades once established, with some specimens surviving over 50 years in protected forest locations"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Massachusetts State Flower and Bird"
    paragraphs:
      - "The Black-capped Chickadee serves as Massachusetts's state bird, a small hardy songbird common in Massachusetts woodlands year-round. Both symbols represent Massachusetts officially. Massachusetts adopted the Mayflower in 1918 and designated the Black-capped Chickadee as state bird in 1941; see the [official Massachusetts state bird](/states/massachusetts/bird/black-capped-chickadee)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Mayflower is commonly seen as representing Massachusetts's colonial heritage and Pilgrim history. The flower has been linked to perseverance and hope through its connection to the Mayflower ship and early settlers. Its delicate early spring blooms carry connotations of renewal and survival after harsh winters across a region captured by [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Massachusetts's state flower?"
    answer: "Massachusetts's state flower is the Mayflower, a small fragrant pink and white wildflower that blooms in early spring in woodland areas across the state."
  
  - question: "When did Massachusetts adopt the Mayflower as its state flower?"
    answer: "Massachusetts adopted the Mayflower on May 1, 1918. The legislature chose this date because it fell during the flower's spring blooming period."
  
  - question: "Why did Massachusetts choose the Mayflower?"
    answer: "Massachusetts chose the Mayflower because of its historical connection to the Pilgrims who arrived on the ship Mayflower in 1620. The colonists found this native wildflower blooming their first spring and named it after their ship. The flower symbolized Massachusetts's colonial heritage and founding story."
  
  - question: "Is it illegal to pick Mayflowers in Massachusetts?"
    answer: "Yes, Massachusetts law prohibits picking Mayflowers on public lands. The flower is protected due to declining wild populations. Violations are subject to fines for removing this endangered wildflower."
  
  - question: "When do Mayflowers bloom in Massachusetts?"
    answer: "Mayflowers bloom from March through May in Massachusetts, with peak flowering occurring in April. The plant is among the first wildflowers to bloom in early spring before most other species emerge."

