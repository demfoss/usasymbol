faq:
  - question: "What is Oklahoma's state motto?"
    answer: "Oklahoma's state motto is \"Labor Omnia Vincit,\" a Latin phrase meaning \"Labor Conquers All Things.\" It has appeared on the state seal since 1893 and was written into the Oklahoma Constitution in 1907."

  - question: "What does \"Labor Omnia Vincit\" mean?"
    answer: "The phrase means \"Labor Conquers All Things.\" Labor means work or toil, omnia means all things, and vincit means to conquer or overcome. The idea is that hard, sustained work can overcome any obstacle."

  - question: "What is the English translation of \"Labor Omnia Vincit\"?"
    answer: "The English translation is \"Labor Conquers All Things.\" Some sources also render it as \"Work Conquers All\" or \"Labor Overcomes All Things\" — all versions carry the same meaning."

  - question: "Where does Oklahoma's motto come from?"
    answer: "The phrase comes from Virgil's Georgics, Book I, line 145, written around 29 BCE. Virgil's original line was \"Labor omnia vicit improbus\" — relentless toil overcame all things. Oklahoma uses the shorter form without the word improbus."

  - question: "When did Oklahoma adopt its state motto?"
    answer: "The motto first appeared on the Oklahoma Territory seal in 1893, promoted by journalist Frank Greer through House Bill 66. When Oklahoma became a state in 1907, the motto was included in the state constitution."

