seo_title: "Oklahoma State Motto | Labor Omnia Vincit"
seo_description: "Oklahoma's state motto is \"Labor Omnia Vincit,\" Latin for \"Labor Conquers All Things.\" From Virgil's Georgics, it has been on the state seal since 1893."

intro_text: "Oklahoma's state motto is <strong>Labor Omnia Vincit</strong>, a Latin phrase meaning <em>Labor Conquers All Things</em>. It appeared on the Oklahoma Territory seal in 1893, fourteen years before Oklahoma became a state, and was written into the state constitution in 1907. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

