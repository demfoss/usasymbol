sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Oklahoma State Motto"
    paragraphs:
      - "Oklahoma's state motto is <strong>Labor Omnia Vincit</strong>, a Latin phrase meaning <em>Labor Conquers All Things</em>. The phrase is part of the Great Seal of Oklahoma and is written into the state constitution."
      - "The motto predates statehood by fourteen years. It first appeared on the official seal of Oklahoma Territory in 1893, adopted by the Second Territorial Legislature meeting in Guthrie. When Oklahoma entered the Union in 1907, the phrase carried over into the new state's founding documents."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Labor Omnia Vincit\""
    paragraphs:
      - "The three Latin words translate directly. <em>Labor</em> means work or toil. <em>Omnia</em> means all things. <em>Vincit</em> comes from <em>vincere</em>, meaning to conquer or overcome. Together: <em>Labor conquers all things</em>."
      - "Some sources render it as <em>Work Conquers All</em> or <em>Labor Overcomes All Things</em>. The meaning is the same across all versions: persistent effort wins out in the end."

  - id: meaning
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Motto Meaning"
    paragraphs:
      - "The phrase comes from the Roman poet Virgil. In the <em>Georgics</em>, Book I, line 145, written around 29 BCE, Virgil wrote <em>Labor omnia vicit improbus</em> — relentless toil overcame all things. The word <em>improbus</em>, meaning persistent or relentless, was part of the original but is not included in Oklahoma's version."
      - "Virgil wrote the <em>Georgics</em> to celebrate farming and agricultural work, in support of Augustus Caesar's effort to bring Romans back to the land. The idea behind the phrase — that sustained hard work can overcome any obstacle — suited a newly settled territory built by homesteaders and farmers."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Oklahoma's State Motto"
    paragraphs:
      - "When the Second Territorial Legislature of Oklahoma met in Guthrie in January 1893, Frank Greer — a journalist and politician — promoted a design for the Grand Seal of Oklahoma Territory. His design, described in House Bill 66, included the <em>Labor Omnia Vincit</em> motto. The legislature passed the bill and the territorial seal became official on March 10, 1893."
      - "Oklahoma entered the Union on November 16, 1907, as the 46th state. The motto carried over from the territorial seal and was incorporated into the Oklahoma Constitution, Article VI, Section 35, which describes the design of the Great Seal of the State of Oklahoma."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Labor Omnia Vincit\" on the Oklahoma State Seal"
    paragraphs:
      - "The motto appears on the Great Seal of Oklahoma. The seal shows a five-pointed star at its center, with each point containing a symbol of one of the Five Civilized Tribes: the Cherokee, Choctaw, Chickasaw, Creek, and Seminole nations. An eagle at the center holds a shield with these symbols."
      - "<em>Labor Omnia Vincit</em> runs along the bottom of the seal. The design descends directly from the 1893 territorial seal that Frank Greer introduced in Guthrie."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Motto Facts"
    style: "gradient"
    facts:
      - "\"Labor Omnia Vincit\" is Latin for \"Labor Conquers All Things.\""
      - "The phrase comes from Virgil's Georgics, Book I, line 145, written around 29 BCE."
      - "Virgil's original included the word improbus (relentless) — Oklahoma's version uses the shorter form."
      - "The motto appeared on the Oklahoma Territory seal in 1893, fourteen years before statehood."
      - "Frank Greer, a journalist from Guthrie, introduced the territorial seal design in House Bill 66."
      - "The territorial seal became official on March 10, 1893."
      - "The motto was written into the Oklahoma Constitution when the state entered the Union in 1907."

