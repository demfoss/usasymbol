intro_text: "**\"The Golden State\"** is California's license plate slogan, rooted in the 1848 gold discovery at Sutter's Mill and the rush that followed. The phrase appeared in writing by 1856, became the official nickname in 1968, and has stayed on standard plates through later designs, including the Half Dome base. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"The Golden State\" is California's license plate slogan, tied to the 1848 Gold Rush. The phrase was first used in print in 1856 and became California's official state nickname in 1968. California's current standard plate, introduced in 1993, features Half Dome in Yosemite Valley alongside the slogan."
