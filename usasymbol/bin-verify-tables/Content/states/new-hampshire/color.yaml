  text: "Green represents the green of the forests; white represents the snow — the two colors that define the landscape of New Hampshire more than any others."
  source: "New Hampshire State Tartan Color Symbolism, RSA 3:21 (1995)"

faq:
  - question: "What are the state colors of New Hampshire?"
    answer: "The traditional state colors of New Hampshire are Green and White, representing the dense forests (green) that cover approximately 84 percent of the state and the White Mountains and winter snow (white) that define the Granite State's alpine landscape. New Hampshire has no formal state color statute."
  - question: "What is the HEX code for New Hampshire Green?"
    answer: "The closest standard HEX code for New Hampshire Green is #2D6A4F, corresponding to Pantone PMS 3425, representing the forest green of New Hampshire's 4.8 million acres of woodland. No official legislative HEX specification exists."
  - question: "Where do New Hampshire's green and white come from?"
    answer: "Green comes from the forests that cover approximately 84 percent of New Hampshire, making it one of the most heavily forested states east of the Mississippi. White comes from the White Mountains — named for their pale appearance — and from New Hampshire's heavy winter snowfall and the white-barked paper birch, the official state tree."
  - question: "Does New Hampshire have official state colors?"
    answer: "No. New Hampshire has not enacted a formal state color statute. Green and white are recognized as traditional colors through natural association and through the official state tartan (RSA 3:21, 1995), which explicitly designates green for the forests and white for the snow."
  - question: "What is special about the White Mountains?"
    answer: "The White Mountains include Mount Washington, at 6,288 feet the highest peak in the northeastern United States, which recorded the world's highest surface wind speed (231 mph) in 1934. The White Mountain National Forest covers more than 750,000 acres and receives approximately six million recreational visits per year, making it the most-visited eastern national forest."
  - question: "What does New Hampshire's state tartan say about color?"
    answer: "The New Hampshire state tartan, adopted under RSA 3:21 in 1995, designates five colors with specific meanings: green for the forests, white for the snow, black for the granite mountains, purple for the state bird and flower, and red for state heroes. Green and white are the two colors most closely associated with New Hampshire's traditional color tradition."

