timeline:
  - year: "1623"
    description: "First permanent European settlement in New Hampshire established at Odiorne's Point in present-day Rye; settlers encounter the dense green forests and white-peaked mountains that will define the Granite State's public imagery for the next four centuries"
  - year: "1784"
    description: "New Hampshire adopts its state seal, featuring the frigate Raleigh being built at Portsmouth against a background that includes the rising sun — the seal's imagery begins the process of codifying New Hampshire's natural symbols, though green and white are not yet formally assigned"
  - year: "1853"
    description: "Mount Washington summit weather observations begin, systematically documenting the extreme alpine conditions of New Hampshire's highest peak; the mountain's white-capped appearance in all seasons reinforces white as a defining state color"
  - year: "1918"
    description: "White Mountain National Forest established, protecting more than 750,000 acres of New Hampshire's northern forests and mountains; the national forest becomes the primary landscape associated with New Hampshire's green-and-white color tradition in tourism and promotional materials"
  - year: "1934"
    description: "Mount Washington Observatory records a wind speed of 231 mph on April 12 — a world record that stands for 76 years, cementing Mount Washington's fame as the home of the world's worst weather and New Hampshire's white alpine summits as an internationally recognized feature"
  - year: "1947"
    description: "Paper birch (Betula papyrifera) designated as New Hampshire's official state tree under RSA 4:41; the birch's white trunk and green canopy make it a living two-color symbol of the state's traditional color palette"
  - year: "1995"
    description: "New Hampshire state tartan adopted into law under RSA 3:21; the tartan explicitly designates green as representing the forests and white as representing the snow — the closest formal legislative recognition of green and white in New Hampshire state law"

