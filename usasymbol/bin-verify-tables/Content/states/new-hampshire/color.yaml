seo_title: "New Hampshire State Colors | Green White"
seo_description: "New Hampshire state colors are Green and White, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of New Hampshire are **Green** and **White**, recognized by natural and cultural convention based on the state's forests and White Mountains visible on [the New Hampshire state flag](/states/new-hampshire/flag/new-hampshire-state-flag). While New Hampshire has not enacted a separate state color law, these colors appear throughout state branding, tourism identity, and official insignia. The specifications below list HEX, RGB, CMYK, and Pantone values for New Hampshire color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Green and White"
official_since: "Traditional / Natural (no formal legislative designation; green and white appear in the official state tartan RSA 3:21, adopted 1995)"
primary_use: "State tourism identity, New Hampshire Division of Travel and Tourism Development branding, White Mountain National Forest imagery, state cultural and environmental communications"
known_for: "New Hampshire's White Mountains include Mount Washington, which at 6,288 feet is the highest peak in the northeastern United States and held the world record for directly observed surface wind speed (231 mph, April 12, 1934) for 76 years; the White Mountain National Forest covers more than 750,000 acres of New Hampshire's northern landscape, making the green-and-white color association with forests and mountains one of the most geographically accurate in American state color history"

