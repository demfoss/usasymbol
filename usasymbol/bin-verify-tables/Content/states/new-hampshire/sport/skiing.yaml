faq:
  - question: What is New Hampshire's state sport?
    answer: "New Hampshire's official state sport is skiing, adopted in 1998."
  - question: When did New Hampshire adopt skiing as its state sport?
    answer: "New Hampshire adopted skiing as its state sport in 1998, effective that July."
  - question: Why did New Hampshire choose skiing?
    answer: "New Hampshire's White Mountains gave the sport reliable terrain close to major East Coast cities, and the state had already built the country's first ski school and first passenger aerial tramway. Dartmouth College added decades of Olympic and collegiate success to the case."
  - question: What college team represents New Hampshire in skiing?
    answer: "Dartmouth College fields New Hampshire's most decorated ski program, with skiers on every U.S. Winter Olympic team since 1924 and three NCAA championships."

