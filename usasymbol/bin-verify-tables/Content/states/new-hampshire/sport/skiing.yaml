sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: New Hampshire State Sport
    paragraphs:
      - "New Hampshire named skiing its official state sport in 1998, giving legal standing to a pastime that had already shaped the state's mountain communities for nearly seven decades. The White Mountains put steep, reliable terrain within a few hours of Boston and New York, drawing early instructors and racers before most other states had a ski industry at all. Lawmakers were formalizing a reputation New Hampshire had built through firsts, not inventing one."

  - id: what-is
    icon: fa-solid fa-person-skiing
    title: "Skiing in New Hampshire"
    paragraphs:
      - "A skier pushes off at the top of a groomed trail and carves turns through gates or open terrain, poles planting rhythm into each pass. Alpine racers chase the clock through slalom and downhill courses, while cross-country skiers kick and glide across groomed tracks that wind through the state's forests. New Hampshire's ski areas cluster around the White Mountains, where Cannon Mountain, Waterville Valley, and Mount Sunapee draw racers and recreational skiers alike."
      - "Dartmouth College fields the state's most decorated ski program, having founded the country's first collegiate ski team through the Dartmouth Outing Club in 1909. The team has sent skiers to every Winter Olympics since the Games began in 1924, and Dartmouth racers have combined for three NCAA championships."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Skiing Represents New Hampshire
    paragraphs:
      - "New Hampshire's White Mountains gave the sport terrain no other state in the region could match, with steep grades and reliable snow within a day's travel of the Northeast's largest cities. That accessibility turned skiing into an industry faster in New Hampshire than in almost any other state. Towns that already existed grew ski areas around them, rather than resorts built from nothing."
      - "Dartmouth's role in that growth went beyond fielding a team. The Dartmouth Outing Club organized a race down Mount Moosilauke in 1927 that the U.S. Ski and Snowboard Association recognizes as the first downhill ski race held in the country. College students racing a New Hampshire mountain helped turn skiing from a Nordic touring skill into the timed, gated sport practiced worldwide today."
      - "New Hampshire backed that head start with infrastructure. Katharine Peckett opened the first ski school in America at Sugar Hill in 1929, bringing European instructors to teach the Arlberg technique. Nine years later, Cannon Mountain opened the first passenger aerial tramway in North America, carrying skiers up Franconia Notch without the long sidestep climbs earlier generations had to make."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Skiing Became New Hampshire's State Sport
    paragraphs:
      - "New Hampshire's state sport designation moved through the legislature in 1998 as a routine addition to the state's list of official symbols, taking effect that July without a competing candidate or a documented public campaign behind it."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Skiing Facts
    facts:
      - "New Hampshire designated skiing its official state sport in 1998."
      - "Katharine Peckett opened the first ski school in America at Sugar Hill in 1929."
      - "Cannon Mountain's 1938 aerial tramway was the first passenger tramway built in North America."
      - "The Nansen Ski Club in Berlin, founded in 1872, is North America's oldest continuously operating ski club."
      - "Dartmouth College organized the first downhill ski race in the country on Mount Moosilauke in 1927."

