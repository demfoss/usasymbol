type: State Flower
state: New Hampshire
name: Purple Lilac
scientific_name: Syringa vulgaris
adopted_year: 1919
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-04-16"
seo_title: "New Hampshire State Flower | Purple Lilac"
seo_description: "The Purple Lilac became New Hampshire's state flower in 1919. These fragrant purple flowers bloom on shrubs across New Hampshire each spring."

intro_text: "New Hampshire designated the Purple Lilac as its official state flower in 1919, and it remains a classic example in the [list of U.S. state flowers](/symbols/flowers). These fragrant purple flower clusters bloom on shrubs throughout New Hampshire. Sweet scent fills New Hampshire neighborhoods each May when thousands of lilac bushes burst into bloom."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of New Hampshire"
    paragraphs:
      - "New Hampshire officially recognizes the Purple Lilac as its state flower. Each flower cluster contains dozens of tiny tubular blooms. Purple petals range from light lavender to deep violet. The flower heads measure 4 to 8 inches long. A powerful sweet fragrance attracts bees and butterflies. Single flowers measure about a quarter inch across."
      - "Purple Lilacs bloom from late April through May across New Hampshire. Southern regions see earlier blooms than northern areas. Peak flowering lasts about two weeks. Individual flowers remain fresh for several days. The shrubs grow 8 to 15 feet tall. Heart-shaped leaves appear dark green. Multiple stems branch from the base forming dense thickets."
      - "Lilac bushes thrive throughout New Hampshire in gardens and along roadsides. The shrubs tolerate cold New Hampshire winters. Well-drained soil suits lilacs best. Full sun produces the most abundant blooms. Old farmhouse foundations often feature ancient lilac bushes. These hardy shrubs can survive decades of neglect and still produce flowers each spring."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Purple Lilac"
    paragraphs:
      - "This flower carries the common name Purple Lilac and the scientific name Syringa vulgaris. The plant belongs to the Oleaceae family. This family includes olives, ash trees, jasmine, and about 600 other species worldwide."
      - "The genus name Syringa comes from the Greek word for tube. It describes the hollow stems. The species name vulgaris means common in Latin. Common lilac serves as another name for this species. The plant originated in southeastern Europe. Colonists brought lilacs to New England in the 1750s."
      - "New Hampshire specifically designated the purple variety rather than white or pink lilacs. Purple blooms were most common in New Hampshire gardens. The distinctive color made identification easy. White lilacs belong to the same species but produce different colored flowers. Some confusion exists because mock orange shrubs sometimes get called syringa despite being unrelated plants."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Purple Lilac Became the New Hampshire State Flower"
    paragraphs:
      - "New Hampshire proclaimed the Purple Lilac its official state flower in 1919. The state legislature made this choice following advocacy by garden clubs. Women's organizations throughout New Hampshire promoted the lilac selection. School children participated in discussions about state symbols, much like later campaigns reflected in the [list of U.S. state birds](/symbols/birds)."
      - "Lilacs grew abundantly in New Hampshire gardens and dooryards. Old farmhouses featured lilac bushes planted by early settlers. The purple blooms symbolized spring and renewal after harsh winters. Their sweet fragrance represented New Hampshire hospitality. Hardy shrubs survived New England's difficult climate without special care."
      - "Some people suggested native wildflowers like lady's slipper or trailing arbutus instead. Supporters of the lilac argued that immigrant plants had become part of New Hampshire's heritage. Lilacs bloomed reliably every spring across the state. The legislature agreed and passed the designation on March 28, 1919. New Hampshire joined other states adopting state flowers during this period and reinforcing an identity often summarized as [the Granite State](/states/new-hampshire/nickname/the-granite-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Hampshire State Flower Facts"
    facts:
      - "Lilac bushes can live for over 100 years, with some New Hampshire specimens planted by early colonists still blooming today"
      - "The shrubs require cold winter temperatures to bloom properly, making them perfectly suited to New Hampshire's climate"
      - "New Hampshire adopted the Purple Lilac on March 28, 1919, specifically designating the purple variety rather than white or pink forms"
      - "Lilac fragrance comes from chemical compounds that inspired many perfumes, with the scent most powerful during warm spring afternoons"
      - "Old farmhouse foundations throughout New Hampshire often feature ancient lilac bushes that mark former homesteads and dooryard gardens"
      - "French hybridizers developed hundreds of lilac varieties in the late 1800s and early 1900s during the height of lilac breeding"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "New Hampshire State Flower and Bird"
    paragraphs:
      - "The Purple Finch serves as New Hampshire's state bird, a small songbird with raspberry red plumage. Both symbols represent New Hampshire officially. New Hampshire adopted the Purple Lilac in 1919 and designated the Purple Finch as state bird in 1957; see [the Purple Finch profile](/states/new-hampshire/bird/purple-finch) for the full legislative history."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Purple Lilac Symbolizes"
    paragraphs:
      - "The Purple Lilac is often associated with spring renewal and New England heritage. The flower traditionally symbolizes first love and youthful innocence in flower language. Its sweet fragrance frequently represents memories and nostalgia while carrying connotations of New Hampshire hospitality and the endurance of early settler traditions, themes that align with [New Hampshire's state motto](/states/new-hampshire/motto/live-free-or-die)."

faq:
  - question: "What is New Hampshire's state flower?"
    answer: "New Hampshire's state flower is the Purple Lilac, a fragrant purple flower that blooms in clusters on shrubs throughout the state each spring."
  
  - question: "When did New Hampshire adopt the Purple Lilac as its state flower?"
    answer: "New Hampshire adopted the Purple Lilac on March 28, 1919. Garden clubs and women's organizations advocated for this selection."
  
  - question: "Why did New Hampshire choose the Purple Lilac?"
    answer: "New Hampshire chose the Purple Lilac because the shrubs grew abundantly throughout the state and symbolized spring renewal after harsh winters. Old farmhouses featured lilac bushes planted by early settlers. The hardy shrubs survived New England's difficult climate and their sweet fragrance represented New Hampshire hospitality."
  
  - question: "Is the lilac native to New Hampshire?"
    answer: "No, the lilac is not native to New Hampshire. The plant originated in southeastern Europe. Colonists brought lilacs to New England in the 1750s. The shrubs became part of New Hampshire's cultural heritage over centuries."
  
  - question: "When do Purple Lilacs bloom in New Hampshire?"
    answer: "Purple Lilacs bloom from late April through May in New Hampshire, with southern regions seeing earlier blooms than northern areas. Peak flowering lasts about two weeks, with the most powerful fragrance during warm spring afternoons."

