intro_text: '**"Live Free or Die"** is New Hampshire''s license plate slogan and state motto. It first appeared on standard plates in 1971 and remains on the current Old Man of the Mountain base. Before the motto arrived, New Hampshire plates used **"SCENIC"** from 1957 through 1970, with a 1963 **"PHOTOSCENIC"** exception. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: '"Live Free or Die" has been New Hampshire''s standard license plate slogan since 1971. The phrase comes from an 1809 toast by Revolutionary War General John Stark and became the official state motto in 1945. Earlier plates used "SCENIC" from 1957 to 1970, except for "PHOTOSCENIC" in 1963.'
