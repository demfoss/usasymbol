faq:
  - question: "What is Hawaii's state land mammal?"
    answer: "Hawaii's state land mammal is the Hawaiian hoary bat (Lasiurus cinereus semotus), designated in 2015 through House Bill 1509. It is one of only two land mammals native to the Hawaiian Islands."

  - question: "When was the Hawaiian hoary bat designated as Hawaii's state land mammal?"
    answer: "The Hawaiian hoary bat became Hawaii's official state land mammal on June 22, 2015, when Governor David Ige signed House Bill 1509 into law."

  - question: "Why did Hawaii choose the Hawaiian hoary bat as its state land mammal?"
    answer: "Hawaii chose the Hawaiian hoary bat because it is one of only two land mammals that reached the Hawaiian Islands naturally—the other being the Hawaiian monk seal. The bat is an endemic subspecies found nowhere else on Earth and has been endangered since 1970. The designation highlighted the urgent need for conservation and represented Hawaii's unique terrestrial wildlife."

  - question: "Where can I see Hawaiian hoary bats?"
    answer: "Hawaiian hoary bats are extremely difficult to observe due to their nocturnal habits, solitary behavior, and small population. Your best chances are at dusk in forested areas of Hawaii Volcanoes National Park, Haleakala National Park, or Kokee State Park on Kauai. Bats occasionally hunt insects around streetlights in forested areas. However, many Hawaii residents have never seen the state land mammal despite living in the islands their entire lives."

  - question: "What is the Hawaiian name for the hoary bat?"
    answer: "The Hawaiian name for the hoary bat is 'ōpe'ape'a. Some Hawaiian families claimed 'ōpe'ape'a as 'aumakua—ancestral guardian spirits that provided spiritual protection."

  - question: "How many Hawaiian hoary bats are left?"
    answer: "Scientists cannot reliably estimate the Hawaiian hoary bat population due to the species' solitary, nocturnal behavior and wide distribution. Conservative estimates suggest fewer than 1,000 individuals statewide, possibly far fewer. The uncertainty highlights the challenges of studying and protecting this rare species."

  - question: "Are Hawaiian hoary bats dangerous?"
    answer: "Hawaiian hoary bats are not dangerous to humans. They are small insectivorous bats that eat moths, beetles, and other insects. Like all wildlife, bats should not be handled or disturbed. The bats are endangered and legally protected—harassing, harming, or killing Hawaiian hoary bats is a federal crime."

  - question: "What are the biggest threats to Hawaiian hoary bats?"
    answer: "Hawaiian hoary bats face multiple threats including habitat loss from deforestation and development, collisions with wind turbine blades, predation by non-native species (rats, feral cats, mongooses), and possibly climate change impacts on insect prey availability. Despite 50+ years of endangered species protection, the population has not recovered significantly."

