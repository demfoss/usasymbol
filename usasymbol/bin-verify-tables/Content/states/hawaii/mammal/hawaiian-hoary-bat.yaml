title: "Hawaii State Land Mammal | Hawaiian Hoary Bat"
scientific_name: "Lasiurus cinereus semotus"
adopted_year: 2015

seo_title: "Hawaii State Land Mammal | Hawaiian Hoary Bat"
seo_description: "Hawaii's state land mammal is the Hawaiian Hoary Bat, adopted in 2015. Learn why this official Hawaii symbol was chosen and what it represents."

intro_text: "The Hawaiian Hoary Bat is the official Hawaii state land mammal, designated in 2015. This page gives the direct answer for searches like 'hawaii state land mammal', 'hawaii state animal', and 'hawaii state mammal' while explaining how the symbol fits the state's official animal designations. Being Hawaii's only native land mammal besides the monk seal and the state's only native bat species."

common_name: "Hawaiian Hoary Bat"
official_since: "2015"
status: "Endangered (U.S. Endangered Species Act since 1970); Critically Imperiled"
habitat_in_state: "Native and non-native forests from sea level to 13,000 feet elevation across all main Hawaiian Islands"
known_for: "Being Hawaii's only native land mammal besides the monk seal and the state's only native bat species"

size: "5 to 6 inches in body length; wingspan 10.5 to 13.5 inches"
weight: "0.5 to 0.7 ounces (14-20 grams)"
coloration: "Brown fur heavily frosted with white or gray tips creating 'hoary' appearance; yellowish-brown throat patch; dark brown to black wings and ears"
distinctive_traits: "Heavily frosted fur, yellowish throat and shoulder patches, short rounded ears, naked interfemoral membrane furred only at base, solitary roosting behavior"

habitat: "Tree canopies in native and non-native forests, gulches with dense vegetation, suburban areas with trees"
range_in_state: "All main Hawaiian Islands (Hawaii, Maui, Molokai, Lanai, Oahu, Kauai); absent from Northwestern Hawaiian Islands due to lack of trees"
conservation_status: "Population size unknown; estimates suggest fewer than 1,000 individuals statewide; listed as endangered since 1970; faces threats from habitat loss, wind turbines, predation by non-native species"
where_to_find: "Difficult to observe due to nocturnal habits; best chances at dusk in forested areas of Hawaii Volcanoes National Park, Haleakala National Park, Kokee State Park on Kauai; occasionally seen hunting insects around streetlights"
symbol_connections: "Represents Hawaii's extreme isolation and unique evolutionary history; only native land mammal that arrived naturally; embodies vulnerability of island ecosystems to extinction; connects to Hawaiian cultural beliefs about night creatures"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Hawaii State Legislature designated the Hawaiian hoary bat as the official state land mammal through House Bill 1509, signed into law by Governor David Ige on June 22, 2015. The ceremony recognized the bat's unique status as one of only two land mammals native to the Hawaiian Islands, the other being the Hawaiian monk seal which spends most of its life in water."
      - "The designation filled a gap in Hawaii's state symbols. Hawaii had designated two state marine mammals—the humpback whale in 1979 and the Hawaiian monk seal in 2008—but had never recognized a terrestrial mammal despite the hoary bat's ecological importance and endangered status. The 2015 designation completed Hawaii's mammal symbolism by acknowledging the state's only native flying mammal and connecting to entries in the [U.S. state mammals hub](/symbols/mammals)."

    subsections:
      - subtitle: "Conservation Advocacy Led the Campaign"
        text: "The push to designate the Hawaiian hoary bat as state land mammal originated with conservation organizations including the Hawaii Wildlife Fund and Bat Conservation International. These groups recognized that official state recognition could increase public awareness of the bat's existence and endangered status. Many Hawaii residents did not know the state had a native bat species, much less that it faced extinction. The designation provided a platform for education about this rarely seen nocturnal animal."

      - subtitle: "Why Hawaii Chose Its Rarest Land Mammal"
        text: "Hawaii made a deliberate choice in selecting an endangered species that most residents have never seen. The Hawaiian hoary bat represents extreme rarity—it is one of only two land mammals that reached Hawaii naturally without human introduction, and it exists as an endemic subspecies found nowhere else. By choosing this bat, Hawaii acknowledged that the most significant species are not always the most visible or charismatic, and that protecting overlooked animals matters as much as protecting iconic species like whales and seals."

  - id: "state-symbolism"
    title: "What the Hawaiian Hoary Bat Represents"
    style: "highlight"
    paragraphs:
      - "The Hawaiian hoary bat embodies the power of isolation in shaping unique life forms. This bat descended from ancestors that flew across 2,500 miles of open ocean from North America to reach the Hawaiian Islands thousands of years ago. Once in Hawaii, the bat population evolved in complete isolation, diverging enough from mainland hoary bats to become a distinct subspecies. This evolutionary journey makes the Hawaiian hoary bat irreplaceable—it exists nowhere else on Earth."
      - "Ancient Hawaiians called the bat 'ōpe'ape'a and recognized it as one of Hawaii's few native mammals. Hawaiian traditions mention bats less frequently than birds or marine animals, likely because bats are nocturnal, solitary, and difficult to observe. However, some Hawaiian families claimed 'ōpe'ape'a as 'aumakua—ancestral guardians that provided spiritual protection. The bat's association with night and its ability to navigate darkness gave it special significance in Hawaiian cosmology."
      - "The designation represents a sobering reality about island ecosystems. Hawaii has lost more bird species to extinction than any other place on Earth. The Hawaiian hoary bat serves as a reminder that island species face extreme vulnerability. Unlike continental animals that can shift ranges or find refuge when habitats disappear, island species have nowhere to go. The bat's endangered status warns that Hawaii could lose this species entirely without sustained conservation action, echoing [Hawaii's flag-and-sovereignty tradition](/states/hawaii/flag/hawaii-state-flag)."

    subsections:
      - subtitle: "One of Two Native Land Mammals"
        text: "Hawaii has the unusual distinction of having only two land mammals that arrived naturally before human contact: the Hawaiian hoary bat and the Hawaiian monk seal. Every other mammal in Hawaii—from mongoose to pigs to deer to rats—was introduced by humans either intentionally or accidentally. This makes the hoary bat extraordinarily significant. It represents baseline Hawaii, the ecosystem that existed before human alteration. Protecting the bat means preserving a direct link to pre-human Hawaii that cannot be replaced if lost."

      - subtitle: "The Mystery of Ocean Crossing"
        text: "Scientists remain uncertain exactly how ancestral hoary bats reached Hawaii. The most likely explanation suggests bats departed North America's Pacific coast and were blown westward by storms, flying or gliding across 2,500 miles of open ocean over multiple days. Hoary bats are long-distance migrants capable of sustained flight, and they occasionally land on ships hundreds of miles offshore. A few pregnant females or a small group arriving in Hawaii could have established the population that evolved into the endemic subspecies over thousands of years."

      - subtitle: "Evolutionary Adaptations to Island Life"
        text: "Hawaiian hoary bats evolved several differences from their mainland relatives after thousands of years of isolation. Hawaiian bats average slightly smaller in size than North American hoary bats. They have adapted to Hawaii's year-round mild climate, breeding throughout the year rather than following the strict seasonal patterns of mainland populations. Hawaiian bats show less migratory behavior since Hawaii lacks the harsh winters that drive mainland bats to migrate south. These adaptations demonstrate how island isolation creates unique evolutionary pressures."

      - subtitle: "Nocturnal Predator in Island Ecosystems"
        text: "The Hawaiian hoary bat serves as Hawaii's only native aerial insectivore, filling an ecological role that no other native species occupies. Bats consume enormous quantities of night-flying insects including moths, beetles, and flies. A single bat can eat thousands of insects nightly. This pest control service benefits both native ecosystems and agriculture, though the bat's small population limits its overall impact. The loss of Hawaiian hoary bats would eliminate this ecological function entirely from native Hawaiian ecosystems."

      - subtitle: "Cultural Symbolism and Education"
        text: "The 2015 designation as state land mammal increased public awareness of the Hawaiian hoary bat's existence. Prior to designation, surveys showed most Hawaii residents did not know the state had a native bat. Conservation organizations used the designation to launch education programs in schools, teaching children about 'ōpe'ape'a and its conservation needs. The bat became a symbol not just of endangered species but of the broader concept that Hawaii's native ecosystems require protection and that residents bear responsibility for species found nowhere else."

  - id: "identification"
    title: "How to Identify Hawaiian Hoary Bats"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Hawaiian hoary bats are small, weighing less than an ounce—roughly the weight of five quarters. The 'hoary' name refers to their distinctive frosted appearance created by white or gray-tipped fur overlaying brown base fur. This frosting gives the bat a silvery, grizzled look that distinguishes it from other bat species."
        list_items:
          - "**Size**: 5-6 inches body length; wingspan 10.5-13.5 inches"
          - "**Weight**: 0.5-0.7 ounces (14-20 grams)"
          - "**Color**: Brown fur with heavy white or gray frosting; yellowish-brown throat and shoulder patches; dark wings and ears"
          - "**Distinguishing features**: Heavily frosted fur creating hoary appearance, short rounded ears, furred tail membrane at base only, solitary roosting (never in colonies)"

      - subtitle: "Distinguishing from Introduced Bats"
        text: "Hawaii has no other native bat species, but several non-native bat species have been accidentally introduced through shipping and air travel. Small insectivorous bats occasionally arrive on aircraft from Asia or the Americas. Hawaiian hoary bats can be distinguished by their larger size compared to most introduced bats, their distinctive hoary frosted appearance, and their solitary behavior. Introduced bats typically roost in small groups, while Hawaiian hoary bats always roost alone."

      - subtitle: "Flight Characteristics"
        text: "Hawaiian hoary bats fly with steady, direct wing beats rather than the erratic, fluttery flight pattern common in many smaller bat species. They typically emerge shortly after sunset to hunt insects, flying 15-30 feet above ground in open areas or along forest edges. Observers describe their flight as moth-like but more powerful and sustained. Bats often hunt around streetlights where insects congregate, making these locations good observation points despite the bat's general rarity."

  - id: "history"
    title: "Hawaiian Hoary Bats Through Time"
    style: "default"
    paragraphs:
      - "Hawaiian hoary bats evolved from North American hoary bat ancestors that reached the Hawaiian Islands thousands of years ago. Genetic studies suggest the colonization occurred between 7,000 and 10,000 years ago, making Hawaiian hoary bats among the more recent arrivals in Hawaii's evolutionary timeline. Once isolated in Hawaii, the population diverged enough from mainland ancestors to warrant subspecies designation, with island context aligned to [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "Ancient Hawaiians encountered 'ōpe'ape'a rarely due to the bat's nocturnal habits and solitary nature. Hawaiian oral traditions include few references to bats compared to the extensive stories about birds, fish, and marine mammals. However, the bat's ability to navigate in complete darkness and its association with night gave it supernatural significance in some Hawaiian traditions."

    subsections:
      - subtitle: "Pre-Contact Population"
        text: "Scientists have no reliable estimates of Hawaiian hoary bat populations before European contact in 1778. However, extensive native forests covering the Hawaiian Islands would have provided far more habitat than exists today. Bats likely numbered in the tens of thousands across the archipelago, roosting in tree canopies throughout lowland and montane forests. The absence of native predators other than the Hawaiian hawk allowed bat populations to thrive without the predation pressure that continental bats face."

      - subtitle: "Forest Loss and Population Decline"
        text: "Hawaiian hoary bat populations declined dramatically following European contact as forests were cleared for agriculture, ranching, and development. By 1900, Hawaii had lost approximately 90 percent of its lowland forests to sugarcane, pineapple cultivation, cattle ranching, and urban expansion. This habitat loss eliminated prime bat roosting and foraging areas. By the mid-1900s, researchers recognized that Hawaiian hoary bats had become rare across their former range."

      - subtitle: "Federal Listing as Endangered"
        text: "The U.S. Fish and Wildlife Service listed the Hawaiian hoary bat as endangered in 1970, making it one of Hawaii's first species to receive federal protection under endangered species legislation. The 1970 listing predated the comprehensive Endangered Species Act of 1973, demonstrating early recognition of the bat's vulnerability. Despite endangered status for over 50 years, the population has not recovered significantly, suggesting ongoing threats and limited success of conservation measures."

      - subtitle: "Modern Threats Emerge"
        text: "Hawaiian hoary bats face new threats that did not exist historically. Wind energy development on Hawaiian Islands beginning in the 2000s created collision risks—bats strike turbine blades while hunting insects attracted to the structures. Non-native predators including rats, feral cats, and mongooses prey on roosting bats and their young. Introduced diseases potentially affect bat health. Climate change alters insect populations and may reduce prey availability. These accumulating threats compound the original habitat loss problem."

  - id: "behavior"
    title: "Hawaiian Hoary Bat Behavior"
    style: "default"

    subsections:
      - subtitle: "Solitary Roosting"
        text: "Unlike most bat species that roost in colonies, Hawaiian hoary bats are strictly solitary. Individual bats roost alone in tree foliage, wrapped in their own wings for camouflage and warmth. Bats select roost sites in tree canopies where dense foliage provides cover from predators and weather. They typically roost 10-50 feet above ground, hanging from branches. Bats change roost sites frequently, rarely using the same location consecutive days. This solitary, mobile roosting behavior makes Hawaiian hoary bats extraordinarily difficult to study and monitor."

      - subtitle: "Nocturnal Hunting"
        text: "Hawaiian hoary bats emerge at dusk to hunt night-flying insects. They use echolocation—emitting high-frequency sound pulses and listening for echoes—to detect and capture prey in complete darkness. Bats hunt along forest edges, over pastures, and in open areas where insect concentrations are highest. Individual bats may travel several miles from roost sites to productive hunting areas. They consume moths, beetles, flies, crickets, and other insects, eating roughly 30-40 percent of their body weight nightly."

      - subtitle: "Reproduction and Pup Rearing"
        text: "Female Hawaiian hoary bats give birth to 1-2 pups, typically between May and August though births can occur year-round in Hawaii's mild climate. Mothers roost with dependent pups for the first few weeks after birth, nursing them while leaving to hunt at night. Pups grow rapidly and begin flying at 3-4 weeks old. Young bats remain with mothers for several more weeks, learning hunting techniques before dispersing to find their own territories. This extended maternal care makes reproduction energetically expensive—females typically produce young only every other year."

      - subtitle: "Year-Round Activity"
        text: "Unlike mainland hoary bats that hibernate or migrate south during winter, Hawaiian hoary bats remain active year-round. Hawaii's mild climate eliminates the need for hibernation, and insects are available throughout the year. This year-round activity pattern represents an evolutionary adaptation to tropical island conditions. However, it also means Hawaiian bats lack the physiological adaptations for surviving extended periods without food, making them vulnerable to any disruption in insect availability."

  - id: "conservation"
    title: "Conservation Challenges and Efforts"
    style: "default"
    paragraphs:
      - "The Hawaiian hoary bat population remains critically low despite 50+ years of endangered species protection. Scientists cannot reliably estimate population size due to the bat's solitary, nocturnal behavior and wide distribution across rugged terrain. Conservative estimates suggest fewer than 1,000 individuals statewide, possibly far fewer. The species faces multiple threats that conservation efforts have struggled to address effectively."

    subsections:
      - subtitle: "Wind Turbine Collisions"
        text: "Wind energy development created an unanticipated threat to Hawaiian hoary bats. Bats strike spinning turbine blades while hunting insects attracted to the structures, suffering fatal injuries from impact or rapid pressure changes near blades. Wind farms on Maui, the Big Island, and Oahu have documented bat fatalities. Wind energy operators now implement seasonal turbine curtailment during peak bat activity periods, reducing blade rotation speeds at night to minimize collisions. However, these measures reduce energy production and remain controversial."

      - subtitle: "Habitat Protection and Restoration"
        text: "Protecting and restoring native forests provides the most important long-term conservation strategy for Hawaiian hoary bats. Federal and state agencies designate critical habitat areas where development is restricted. Conservation organizations work to restore degraded forests with native plants that support insect populations. However, forest restoration is slow and expensive, and bats may not respond immediately to habitat improvements. The effectiveness of habitat-based conservation for recovering bat populations remains uncertain."

      - subtitle: "Predator Control"
        text: "Non-native predators including feral cats, rats, and mongooses prey on roosting bats and their vulnerable pups. Conservation areas implement predator control programs using traps and fencing to reduce predator densities. Some programs show promise—areas with intensive predator control document higher bat activity levels than unmanaged areas. However, maintaining predator control across the bats' entire range is logistically and financially impossible, limiting the overall impact of these efforts."

      - subtitle: "Research Challenges"
        text: "Studying Hawaiian hoary bats presents extraordinary challenges. Bats are solitary, nocturnal, and range across vast areas of rugged terrain. They cannot be reliably captured or tracked using standard wildlife research methods. Acoustic monitoring using bat detectors provides some population data, but interpreting these results requires significant assumptions. Genetic studies require tissue samples that are difficult to obtain. This research challenge means scientists lack basic information about population size, trends, reproduction rates, and habitat preferences needed to guide effective conservation."

      - subtitle: "Climate Change Impacts"
        text: "Climate change poses emerging threats to Hawaiian hoary bats that conservation managers are just beginning to understand. Rising temperatures may alter insect populations and phenology, potentially creating mismatches between bat reproduction timing and peak insect availability. More intense storms could kill bats directly or destroy roost trees. Sea level rise threatens coastal forests where some bats forage. However, the specific impacts of climate change on Hawaiian hoary bats remain largely speculative due to limited baseline data."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Hawaiian hoary bat connects directly to Hawaii's state motto, 'Ua Mau ke Ea o ka Aina i ka Pono' (The life of the land is perpetuated in righteousness). The bat represents native terrestrial life that existed before human alteration of Hawaiian ecosystems. Protecting this endangered species demonstrates righteous stewardship—acknowledging responsibility for species found nowhere else and taking action to prevent extinction, as described on [Hawaii's motto page](/states/hawaii/motto/ua-mau-ke-ea-o-ka-aina-i-ka-pono)."
      - "Hawaii's three mammal symbols—the humpback whale (1979), Hawaiian monk seal (2008), and Hawaiian hoary bat (2015)—create a comprehensive representation of the state's mammalian fauna. The whale represents migratory visitors that connect Hawaii to the broader Pacific. The seal represents endemic marine life. The bat represents endemic terrestrial life. Together, these symbols acknowledge Hawaii's unique position as an isolated archipelago with few native mammals but deep connections to ocean ecosystems."

    subsections:
      - subtitle: "The Nene's Parallel Story"
        text: "Hawaii's state bird, the nene or Hawaiian goose, shares remarkable similarities with the hoary bat. Both are endemic species found only in Hawaii. Both evolved from ancestors that reached Hawaii naturally and then diverged into distinct subspecies. Both faced near-extinction in the mid-1900s due to habitat loss and introduced predators. The nene recovered through intensive captive breeding and reintroduction programs. The hoary bat's conservation presents greater challenges due to its solitary nature and difficulty of study, but the nene's success provides hope that similar dedication could save the bat."
        link:
          label: "See Hawaii state bird"
          url: "/states/hawaii/bird/nene"

      - subtitle: "Kukui and Native Forests"
        text: "Hawaii's state tree, the kukui or candlenut tree, represents native Hawaiian forests that provide essential habitat for hoary bats. Kukui trees grow in lowland and montane forests where bats roost and hunt. The kukui's traditional importance to ancient Hawaiians—providing lamp oil, food, medicine, and wood—parallels the ecological importance of bats as native insect predators. Both symbols remind residents that native species form interconnected ecosystems where each element plays essential roles."
        link:
          label: "See Hawaii state tree"
          url: "/states/hawaii/tree/kukui"

      - subtitle: "Isolation and Endemism"
        text: "Hawaii has more endemic species—plants and animals found nowhere else—than any other U.S. state. The Hawaiian hoary bat exemplifies this endemism, having evolved in complete isolation for thousands of years. This pattern repeats across Hawaiian life: endemic honeycreepers, endemic plants, endemic snails, endemic insects. The bat designation celebrates this uniqueness while acknowledging that endemism creates vulnerability—island species have nowhere to go when habitats disappear or conditions change. The symbol serves as both pride and warning."

