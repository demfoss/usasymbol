seo_title: "Virginia State Tree | Flowering Dogwood"
seo_description: 'Virginia made flowering dogwood its state tree in 1956, matching the state flower and honoring a spring bloomer familiar across the commonwealth.'

intro_text: "Virginia designated the Flowering Dogwood as its state tree in 1956. Its spring bloom made it one of the Commonwealth's most familiar native trees, and Virginia reinforced that connection by naming the same species as both state tree and state flower. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Virginia"
    paragraphs:
      - "The Flowering Dogwood is Virginia's official state tree. This small deciduous tree typically reaches 15 to 30 feet tall in Virginia. The trunk measures six to twelve inches in diameter at maturity. Unlike Virginia's towering oaks and pines, the dogwood functions as an understory tree, growing beneath the forest canopy. This smaller size makes flowering dogwood accessible as both a forest species and a popular ornamental tree in Virginia yards and gardens."
      - "The tree grows naturally in all regions of Virginia, from Tidewater coastal areas through the Piedmont and into the Blue Ridge Mountains. Flowering dogwood thrives in partial shade with well-drained acidic soils. In Virginia forests, dogwoods grow beneath larger trees like oaks, hickories, and tulip poplars. The species tolerates Virginia's hot summers and cold winters, flourishing across the state's diverse climate zones. Virginia contains millions of wild flowering dogwoods in its forests alongside countless planted specimens in urban and suburban landscapes."
      - "Virginia's dogwoods bloom in mid to late April, creating spectacular spring displays before most other trees leaf out. The showy white structures that people call flowers are actually modified leaves called bracts. The true flowers appear as small yellow-green clusters at the center of the bracts. This adaptation allows dogwoods to attract pollinators early in spring when few other food sources exist. The timing makes flowering dogwood one of the first significant nectar sources for Virginia's bees, butterflies, and other pollinators emerging from winter dormancy."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Flowering Dogwood"
    paragraphs:
      - "The common name is Flowering Dogwood, though many Virginians simply call it dogwood. The scientific name is Cornus florida. Cornus is Latin for horn, referring to the wood's hardness and density. Florida means flowering, describing the tree's showy spring blooms. This species belongs to the Cornaceae family, the dogwood family."
      - "The origin of the common name 'dogwood' remains debated. Some sources suggest it derives from 'dagwood,' referring to the wood's historical use for making sharp implements like skewers and arrows. Others trace it to 'dog-tree,' possibly because a decoction made from dogwood bark treated mange in dogs. Virginians have called this tree dogwood since colonial times, and the name appears in written accounts from the 1600s. North Carolina also claims the flowering dogwood as its state flower."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Flowering Dogwood Became the Virginia State Tree"
    paragraphs:
      - "Virginia recognized the Flowering Dogwood as its official state tree on February 28, 1956. The General Assembly passed House Joint Resolution No. 17 during the 1956 legislative session. Governor Thomas B. Stanley signed the resolution establishing the dogwood as Virginia's arboreal emblem. This designation came 38 years after Virginia adopted the dogwood flower as the state floral emblem in 1918."
      - "Virginia chose flowering dogwood because the species already held strong significance in state culture. The 1918 adoption of [dogwood blossoms as the state flower](/states/virginia/flower/dogwood) reflected Virginians' attachment to these spring blooms. Garden clubs, civic organizations, and conservation groups had promoted dogwood appreciation throughout Virginia for decades. The tree appeared prominently in Virginia literature, art, and tourism promotion. By the 1950s, dogwood had become inseparable from Virginia's landscape character. Making it the official state tree formalized what Virginians already understood—the dogwood represented their state."
      - "The tree's native status influenced the selection. Flowering dogwood evolved in Virginia's forests and grew naturally throughout the commonwealth. Virginia legislators wanted a state tree that belonged to Virginia's original landscape rather than an introduced species. The dogwood's manageable size made it familiar to most Virginians. Unlike tall forest trees that grew far from roads and homes, dogwoods grew in yards, parks, and along streets. Every Virginian could recognize and appreciate their state tree. This accessibility contributed to the dogwood's selection over larger, less visible forest species and fit the public-facing image of [the Old Dominion](/states/virginia/nickname/the-old-dominion)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Virginia State Tree Facts"
    facts:
      - "Virginia adopted Flowering Dogwood as state tree on February 28, 1956, through House Joint Resolution No. 17"
      - "Virginia is the only state to designate the same species as both state tree and state flower - the dogwood received flower status in 1918"
      - "North Carolina also claims the flowering dogwood as its state flower, making it one of the few species honored by multiple states"
      - "What appears as white 'petals' are actually bracts - modified leaves surrounding the true flowers in the center"
      - "Dogwood berries turn bright red in fall and provide crucial food for at least 36 bird species migrating through Virginia"
      - "The extremely hard, dense wood was used historically for textile shuttles, tool handles, and golf club heads"
      - "A single mature dogwood produces up to 100 clusters of berries each fall, with each cluster containing 6 to 12 fruits"
      - "The Virginia Department of Forestry distributes thousands of dogwood seedlings annually through conservation programs"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Virginia State Tree and Flower"
    paragraphs:
      - "Virginia's state flower is the American Dogwood (Cornus florida), the same species as the state tree. Virginia adopted the dogwood blossom as its state flower in 1918, making it one of America's earliest state floral emblems. The General Assembly designated the entire tree as the state tree symbol in 1956. This unique arrangement means Virginia honors the same plant as both floral and arboreal symbol. The spring blossoms that made dogwood Virginia's flower choice bloom on the same trees that represent the state's forests. This dual designation reflects how completely the flowering dogwood pervades Virginia's landscape and culture. No other Virginia plant appears so prominently in both wild and cultivated settings throughout the commonwealth, including habitats shared with [Virginia's Northern Cardinal](/states/virginia/bird/northern-cardinal)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Virginia Flowering Dogwood"
    paragraphs:
      - "The bark creates a distinctive pattern that identifies dogwood even in winter. Mature bark breaks into small square or rectangular blocks, giving the trunk a checkered appearance similar to alligator hide. The bark color ranges from gray to reddish-brown. Young trees show smoother bark that develops the blocky pattern as trees age. This characteristic bark texture makes dogwood immediately recognizable among Virginia's native trees."
      - "The flowers provide unmistakable spring identification. Four large white bracts surround a cluster of small yellow-green true flowers. Each bract measures two to four inches long with a distinctive notched tip. Some varieties produce pink bracts instead of white. The bracts open before leaves emerge, making flowering dogwoods highly visible against Virginia's still-brown forests in April. After pollination, the bracts fall and bright red berries develop by autumn. These clustered berries persist into winter, providing another identification feature."
      - "The overall form shows horizontal branching that creates layered tiers of foliage. This growth pattern makes dogwoods distinctive even at a distance. Leaves grow opposite each other along the twigs. Each leaf measures three to six inches long with smooth edges and prominent curved veins that run parallel to the leaf margin. In autumn, leaves turn rich shades of red and purple before falling. The winter silhouette displays the characteristic horizontal branching structure with slightly upturned branch tips."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Virginia State Tree Symbolizes"
    paragraphs:
      - "The Flowering Dogwood symbolizes renewal and resilience in Virginia culture. Its early spring blooms represent hope and new beginnings after winter's dormancy. The tree's presence throughout Virginia—from mountain coves to coastal gardens—connects different regions of the commonwealth through shared spring bloom. For many Virginians, dogwood blossoms signal the arrival of spring more definitively than any calendar date. The tree's dual status as both flower and tree symbol reinforces its central place in Virginia's character and complements values expressed in [Sic Semper Tyrannis](/states/virginia/motto/sic-semper-tyrannis). Conservation efforts to protect dogwoods from disease threats reflect Virginia's commitment to preserving this living emblem for future generations."

faq:
  - question: "What is the Virginia state tree?"
    answer: "The Flowering Dogwood (Cornus florida) is Virginia's official state tree, designated by the General Assembly on February 28, 1956."
  
  - question: "What is the Virginia state tree called?"
    answer: "Virginia's state tree is called the Flowering Dogwood or simply dogwood. The scientific name is Cornus florida, meaning 'flowering horn' in Latin."
  
  - question: "When was the Virginia state tree adopted?"
    answer: "Virginia adopted the Flowering Dogwood as its state tree on February 28, 1956, through House Joint Resolution No. 17. The state had already designated dogwood flowers as the state floral emblem in 1918."
  
  - question: "Why is the Flowering Dogwood Virginia's state tree?"
    answer: "Virginia chose the Flowering Dogwood because it grows naturally throughout the commonwealth and held cultural significance since colonial times. The tree was already Virginia's state flower since 1918, showing its importance to Virginians. Its spring blooms define Virginia's landscape each April, and its manageable size makes it familiar to residents statewide. The native status and accessibility made dogwood an ideal state symbol."
  
  - question: "What is the Virginia state tree name?"
    answer: "The name is Flowering Dogwood. The scientific name is Cornus florida. Many Virginians call it simply 'dogwood.' The name possibly comes from 'dagwood,' referring to the hard wood used for sharp implements."
  
  - question: "Where does the Virginia state tree grow?"
    answer: "The Flowering Dogwood grows naturally throughout Virginia, from Tidewater coastal regions through the Piedmont and into the Blue Ridge Mountains. It thrives as an understory tree in Virginia forests and as an ornamental in yards and parks across the state."
  
  - question: "What are some facts about the Virginia state tree?"
    answer: "The Flowering Dogwood was adopted as state tree in 1956, 38 years after becoming state flower in 1918. Virginia is the only state honoring the same species as both tree and flower. The white 'petals' are actually bracts, not true flowers. The hard wood was used for tool handles and golf clubs. Red berries feed 36 bird species. The tree grows 15 to 30 feet tall throughout Virginia."
  
  - question: "How do you recognize the Virginia state tree?"
    answer: "Look for bark that breaks into small square blocks creating an alligator-hide pattern. In spring, four large white bracts with notched tips surround small yellow-green flowers. The tree has horizontal branching creating layered tiers. Leaves are oval with curved parallel veins. Bright red berry clusters appear in fall. The tree grows 15 to 30 feet tall with a spreading crown."

