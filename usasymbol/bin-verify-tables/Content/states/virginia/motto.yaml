faq:
  - question: "What is Virginia's state motto?"
    answer: "Virginia's state motto is \"Sic Semper Tyrannis,\" a Latin phrase meaning \"Thus Always to Tyrants.\" It was adopted on the state seal by the Virginia Convention in 1776."

  - question: "What is the English translation of \"Sic Semper Tyrannis\"?"
    answer: "\"Sic Semper Tyrannis\" translates from Latin as \"Thus Always to Tyrants.\" It is a statement of consequence: this is how tyranny ends — in defeat. The phrase appears on the Virginia state seal below the figure of Virtus standing over a fallen tyrant."

  - question: "What does the Virginia state seal show?"
    answer: "The seal shows Virtus, a female warrior figure representing Virginia and virtue, standing over a prostrate tyrant. The tyrant's crown has fallen. A chain and whip lie nearby. \"Sic Semper Tyrannis\" appears at the bottom, and \"Virginia\" at the top."

  - question: "When was Virginia's state motto adopted?"
    answer: "The Virginia Convention adopted the state seal — with the motto \"Sic Semper Tyrannis\" — in 1776. Virginia was also the first of the thirteen colonies to adopt a state constitution that same year."

  - question: "Did John Wilkes Booth say \"Sic Semper Tyrannis\"?"
    answer: "Booth reportedly shouted \"Sic Semper Tyrannis\" after shooting President Abraham Lincoln at Ford's Theatre on April 14, 1865. Booth was from Maryland, not Virginia, but he chose Virginia's state motto. Historical accounts consistently report the phrase, though Booth left no direct written confirmation."

