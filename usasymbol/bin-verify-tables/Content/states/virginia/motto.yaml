seo_description: "Virginia's state motto is \"Sic Semper Tyrannis,\" Latin for \"Thus Always to Tyrants.\" The Virginia Convention adopted the seal with the motto in 1776."

intro_text: "Virginia's state motto is <strong>Sic Semper Tyrannis</strong>, a Latin phrase meaning <em>Thus Always to Tyrants</em>. It appears on the state seal below the figure of Virtus, adopted by the Virginia Convention in 1776. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

