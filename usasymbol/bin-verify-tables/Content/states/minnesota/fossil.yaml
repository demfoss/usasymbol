faq:
- question: What is Minnesota's state fossil?
  answer: "Minnesota's state fossil is the giant beaver (Castoroides ohioensis), a bear-sized Ice Age rodent designated by the state legislature in 2025."
- question: When did Minnesota adopt its state fossil?
  answer: "Minnesota adopted the giant beaver as its state fossil in 2025."
- question: What did the giant beaver look like?
  answer: "Castoroides ohioensis was up to 8 feet long and weighed up to 220 pounds. It had 6-inch ridged incisors and looked like an enormous beaver, though it was not closely related to the modern North American beaver."
- question: Where are giant beaver fossils found in Minnesota?
  answer: "Giant beaver fossils have been found in glacial lake sediments, peat bogs, and stream deposits across Minnesota. The Science Museum of Minnesota in St. Paul holds specimens and has exhibits on the state's Ice Age fauna."
- question: When did the giant beaver live?
  answer: "Castoroides ohioensis lived during the Late Pleistocene and went extinct about 10,000 years ago at the end of the last Ice Age."
- question: Who pushed to make it the state fossil?
  answer: "The 2025 designation brought together paleontologists, educators, and legislators who wanted Minnesota to recognize its Ice Age heritage. The giant beaver was chosen for its strong connection to the state's glacial landscape and the prevalence of its fossils in Minnesota's ancient lake deposits."

