faq:
- question: What is Oregon's state fossil?
  answer: "Oregon's state fossil is the dawn redwood (Metasequoia), an ancient conifer preserved in the Eocene Clarno Formation of Wheeler County, designated in 2005."
- question: When did Oregon adopt its state fossil?
  answer: "Oregon designated the dawn redwood as its state fossil in 2005."
- question: What did the dawn redwood look like?
  answer: "The dawn redwood was a large conifer with soft, feathery needles arranged in opposite pairs. It was deciduous — it shed its needles each fall — and could grow over 100 feet tall with reddish-brown fibrous bark."
- question: Where are dawn redwood fossils found in Oregon?
  answer: "Fossils come from the Eocene Clarno Formation in Wheeler County, preserved in the Clarno Unit of John Day Fossil Beds National Monument. Specimens are held at the Thomas Condon Paleontology Center near Kimberly."
- question: When did the dawn redwood live?
  answer: "Dawn redwoods grew across Oregon and the broader Northern Hemisphere during the Eocene epoch, roughly 40 to 56 million years ago. As a genus, Metasequoia still survives in China today."
- question: Who pushed to make it the state fossil?
  answer: "Oregon adopted the dawn redwood in 2005, drawn by the Clarno Formation's exceptional plant fossil record and the tree's worldwide fame as a living fossil rediscovered in China in 1944."

