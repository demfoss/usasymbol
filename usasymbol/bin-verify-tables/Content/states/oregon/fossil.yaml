- id: facts
  icon: fa-solid fa-lightbulb
  title: Dawn Redwood Facts
  facts:
  - "Metasequoia was named in 1941 by Japanese paleobotanist Shigeru Miki from fossil material — three years before anyone knew it was still alive."
  - "A living grove was found in Hubei Province, China, in 1944, making dawn redwood one of the most famous 'living fossils' in botany."
  - "Oregon's dawn redwood fossils come from the Clarno Formation, which dates to about 40 to 54 million years ago during the Eocene epoch."
  - "Unlike most conifers, dawn redwood is deciduous — it drops its needles every fall, a trait that makes its fallen foliage especially easy to preserve as fossils."
  - "Oregon designated the dawn redwood as its official state fossil in 2005."

