faq:
  - question: "What is Arkansas's state dinosaur?"
    answer: "Arkansas's state dinosaur is Arkansaurus fridayi. It was adopted in 2017."

  - question: "Who found Arkansaurus?"
    answer: "James Friday found the bones in 1972."

  - question: "What kind of dinosaur was Arkansaurus?"
    answer: "It was likely a small ornithomimosaur or close relative."

  - question: "Why was Arkansas's state dinosaur designated before it was formally named?"
    answer: "Arkansas passed the law before the formal scientific description appeared in 2019."

  - question: "Is Arkansaurus the only dinosaur found in Arkansas?"
    answer: "It is the only formally named dinosaur from Arkansas."

