type: State Tree
state: South Dakota
name: Black Hills Spruce
scientific_name: Picea glauca var. densata
adopted_year: 1947
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "South Dakota State Tree | Black Hills Spruce"
seo_description: 'South Dakota adopted Black Hills spruce in 1947, honoring the forested mountains that contrast with the prairie and hold Lakota significance.'

intro_text: "South Dakota designated the Black Hills Spruce as its state tree in 1947, honoring the evergreen most closely tied to the Black Hills. The choice reflects the sharp contrast between those forested mountains and the surrounding prairie landscape. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of South Dakota"
    paragraphs:
      - "South Dakota's official state tree is the Black Hills Spruce, a variety of white spruce native to the Black Hills region. This spruce grows 40 to 60 feet tall in the Black Hills, occasionally reaching 80 feet in protected sites. The trunk measures one to two feet in diameter on mature trees. Black Hills Spruce is technically Picea glauca variety densata, meaning it's a denser, more compact form of white spruce rather than a separate species. The variety name 'densata' describes the tree's characteristic dense branching and compact growth. The tree grows slowly in South Dakota's semi-arid climate, adding six to twelve inches per year. Black Hills Spruce can live 200 to 300 years in the Black Hills. The species provided timber for early South Dakota settlers and continues supplying the Black Hills lumber industry today."
      - "The needles appear blue-green to gray-green, measuring one-half to three-quarters inch long. The needles are four-sided and stiff with sharp points, distinguishing spruce from flat, soft fir needles. When rolled between fingers, spruce needles feel square. The needles grow on all sides of twigs rather than in flat sprays. The overall foliage appears denser than typical white spruce, giving Black Hills Spruce its compact, full appearance. The needles smell pungent when crushed. Small cones hang from branches, measuring one to two inches long - smaller than most spruce cones. The cones appear light brown and have flexible scales, unlike the stiff scales of pine cones. The dense foliage and compact form distinguish Black Hills Spruce from the more open growth of typical white spruce."
      - "Black Hills Spruce grows naturally only in South Dakota's Black Hills and adjacent areas of northeastern Wyoming. This limited native range makes the tree strongly associated with South Dakota. The Black Hills rise 3,000 to 4,000 feet above surrounding prairies, creating cooler, wetter conditions that support forest growth. The spruce dominates north-facing slopes and moist ravines throughout the Black Hills. The trees grow alongside ponderosa pine, which covers drier south-facing slopes. Black Hills Spruce requires more moisture than ponderosa pine and occupies cooler microsites. The species grows from 4,000 to 7,000 feet elevation in the Black Hills. Outside this range, Black Hills Spruce is planted as an ornamental and Christmas tree across South Dakota and neighboring states. The tree's compact form and blue-green color make it popular for landscaping."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Black Hills Spruce"
    paragraphs:
      - "The official name is Black Hills Spruce, referring to the South Dakota mountain range where it grows naturally. The scientific name Picea glauca var. densata combines Picea (Latin for pitch, referring to resin) with glauca (Latin for bluish-green) and densata (Latin for dense). The name recognizes this as a variety of white spruce with denser growth. Early South Dakota settlers called it simply spruce or Black Hills white spruce. The Lakota people called the Black Hills Paha Sapa, meaning 'hills that are black' - the name coming from the dark appearance created by dense spruce forests covering mountainsides."
      - "Some references use white spruce since Black Hills Spruce is technically a variety rather than a separate species. The genus Picea includes about 35 spruce species worldwide. The species belongs to the Pinaceae family, the pine family. Black Hills Spruce represents a geographically isolated population of white spruce that adapted to Black Hills conditions over thousands of years. The compact, dense form developed as an adaptation to Black Hills climate and growing conditions."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Black Hills Spruce Became the South Dakota State Tree"
    paragraphs:
      - "South Dakota designated the Black Hills Spruce as its official state tree in 1947. The South Dakota Legislature passed the designation during the 1947 session. The legislation recognized Black Hills Spruce as the tree most representative of South Dakota's distinctive landscape and cultural heritage. By 1947, the Black Hills had become South Dakota's most famous natural feature, home to Mount Rushmore and drawing thousands of tourists annually. The spruce symbolized these distinctive mountains that defined South Dakota's character beyond the prairie stereotype."
      - "South Dakota selected Black Hills Spruce because the Black Hills represent the state's most distinctive landscape feature. South Dakota is primarily Great Plains grassland - vast prairies stretching to horizons. The Black Hills rise as a forested island in this sea of grass, visible from 50 miles away as a dark mass on the western horizon. The mountains got their name from the dark appearance created by dense spruce forests. For the Lakota Sioux, the Black Hills were Paha Sapa - the sacred center of the world. The mountains provided shelter, resources, and spiritual significance. Lakota oral traditions connect the people to these mountains for generations before European contact. The 1868 Fort Laramie Treaty recognized Lakota ownership of the Black Hills and helped shape [the Mount Rushmore State image](/states/south-dakota/nickname/the-mount-rushmore-state)."
      - "The tree also sits inside a difficult Black Hills history. Custer's 1874 expedition led prospectors to gold, and the rush that followed violated the Fort Laramie Treaty and helped spark the Great Sioux War of 1876. Mining towns such as Deadwood and Lead used Black Hills spruce for mine supports, buildings, and fuel; later, the tree also became a regional Christmas tree crop. The 1947 designation tied the spruce to the Black Hills as a forested landscape, a timber resource, and a place with continuing Lakota significance."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Dakota State Tree Facts"
    facts:
      - "South Dakota designated Black Hills Spruce in 1947, recognizing the tree that gives the Black Hills their dark appearance and name"
      - "Black Hills Spruce is a variety of white spruce (Picea glauca var. densata) with denser, more compact growth than typical white spruce"
      - "The tree grows naturally only in South Dakota's Black Hills and adjacent northeastern Wyoming - native mostly to the Black Hills region"
      - "The Lakota Sioux call the Black Hills 'Paha Sapa' meaning 'hills that are black' - named for dense spruce forests creating a dark appearance"
      - "The Black Hills rise as a forested island above Great Plains prairies, visible from 50 miles away as a dark mass on the horizon"
      - "Black Hills Spruce provided timber for mine supports during the 1876 gold rush that followed Custer's 1874 expedition"
      - "The tree's compact form and blue-green color make it popular as a Christmas tree, with South Dakota growers shipping across the region"
      - "Four-sided needles that roll between fingers distinguish spruce from flat fir needles - a reliable identification test"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "South Dakota State Tree and Flower"
    paragraphs:
      - "South Dakota's state flower is the [American Pasqueflower](/states/south-dakota/flower/pasque-flower), designated in 1903. The state adopted its floral symbol 44 years before choosing Black Hills Spruce. Both symbols represent South Dakota's distinctive landscapes. The pasque flower blooms purple in early spring across South Dakota prairies, while Black Hills Spruce towers in the mountains. The pasque flower appears in April on grasslands as spruce trees begin new growth. The pair shows South Dakota's dual character - vast prairies covering most of the state and forested Black Hills rising in the west. One represents the prairie majority, the other the mountain minority that defines state character."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a South Dakota Black Hills Spruce"
    paragraphs:
      - "The needles provide reliable spruce identification. Look for stiff, sharp, four-sided needles measuring one-half to three-quarters inch long. Roll a needle between your fingers - it should feel square because of the four sides. This distinguishes spruce from fir, which has flat needles that won't roll. The needles appear blue-green to gray-green, covering all sides of twigs rather than growing in flat sprays. When crushed, the needles smell pungent and resinous. The overall foliage appears very dense and compact compared to other spruces. This dense branching gives Black Hills Spruce its characteristic full appearance."
      - "The cones help confirm identification. Look for small hanging cones measuring one to two inches long. The cones appear light brown with thin, flexible scales. The scales bend when squeezed rather than remaining stiff like pine cone scales. Cones mature in one season and fall by late winter. The small cone size distinguishes Black Hills Spruce from larger-coned spruces. Cones often cluster near branch tips and hang downward when mature."
      - "The overall form shows a narrow, conical crown when young, becoming more cylindrical with age. Black Hills Spruce maintains a much denser, more compact form than typical white spruce. The branches grow more closely spaced and the foliage appears fuller. Young trees develop perfect Christmas tree shapes. Mature trees form straight trunks with branches to near ground level on open-grown specimens. Forest-grown trees show clean trunks with crowns in the upper portion. The bark appears gray-brown with thin, scaly plates. Twigs are stiff and often slightly hairy. The compact, dense growth distinguishes Black Hills Spruce from the more open appearance of other spruce varieties."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the South Dakota State Tree Symbolizes"
    paragraphs:
      - "Black Hills Spruce represents the part of South Dakota where prairie gives way to forested mountains. It points to the Black Hills as Lakota sacred land, a mining and timber region, and the setting for Mount Rushmore. That mix of meanings is why the tree carries more state-specific weight than a generic evergreen; it marks the landscape that most clearly separates South Dakota from neighboring prairie states."

faq:
  - question: "What is the South Dakota state tree?"
    answer: "The Black Hills Spruce (Picea glauca var. densata) is South Dakota's official state tree. The South Dakota Legislature designated it in 1947, recognizing the spruce that gives the Black Hills their name and dark appearance."
  
  - question: "What is the South Dakota state tree called?"
    answer: "South Dakota's state tree is called Black Hills Spruce. The scientific name is Picea glauca var. densata, meaning it's a dense variety of white spruce. It's also been called Black Hills white spruce or simply spruce. The Lakota called the Black Hills 'Paha Sapa' meaning 'hills that are black.'"
  
  - question: "When was the South Dakota state tree adopted?"
    answer: "South Dakota designated the Black Hills Spruce as its official state tree in 1947. The Legislature passed the designation during the 1947 session, honoring the tree that defines the Black Hills."
  
  - question: "Why is the Black Hills Spruce South Dakota's state tree?"
    answer: "South Dakota chose Black Hills Spruce because it defines the Black Hills - the state's most distinctive landscape feature and sacred Lakota territory. The dense spruce forests create the dark appearance that named these mountains. The Black Hills rise as a forested island in South Dakota's vast prairies. The tree provided timber during the 1876 gold rush and continues supporting the Black Hills lumber industry. Black Hills Spruce grows naturally only in South Dakota's Black Hills (and adjacent Wyoming), making it strongly associated with the state. The tree represents Mount Rushmore, Lakota heritage, and the mountains that define South Dakota beyond prairie stereotypes."
  
  - question: "What is the South Dakota state tree name?"
    answer: "The name is Black Hills Spruce, referring to South Dakota's Black Hills mountains. The scientific name is Picea glauca var. densata - Picea means pitch (resin), glauca means bluish-green, and densata means dense. It's a dense-growing variety of white spruce."
  
  - question: "Where does the South Dakota state tree grow?"
    answer: "The Black Hills Spruce grows naturally only in South Dakota's Black Hills and adjacent areas of northeastern Wyoming. It dominates north-facing slopes and moist ravines from 4,000 to 7,000 feet elevation. The Black Hills rise as forested mountains above Great Plains prairies in western South Dakota. The tree is also planted as an ornamental and Christmas tree across the region."
  
  - question: "What are some facts about the South Dakota state tree?"
    answer: "The Black Hills Spruce grows 40 to 60 feet tall and is a dense variety of white spruce (var. densata). It grows naturally only in South Dakota's Black Hills. The Lakota call the mountains 'Paha Sapa' - 'hills that are black' from spruce forests. Four-sided needles roll between fingers - a spruce identification test. The tree provided timber during the 1876 gold rush. Small cones measure one to two inches. The compact form makes it popular as a Christmas tree. The Black Hills are sacred to the Lakota Sioux."
  
  - question: "How do you recognize the South Dakota state tree?"
    answer: "Look for stiff, sharp, four-sided needles (one-half to three-quarters inch) that roll between fingers. Blue-green to gray-green color. Very dense, compact foliage - fuller than typical spruce. Small hanging cones (one to two inches) with flexible scales. Narrow, conical crown when young. Pungent smell when crushed. Gray-brown bark with thin scales. The dense branching and compact form distinguish Black Hills Spruce from other spruce varieties."

