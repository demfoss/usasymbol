seo_title: "Connecticut State Nickname | The Constitution State"
seo_description: "Connecticut is known as The Constitution State, its official state nickname. Learn why the name fits and what other nicknames the state has used."

intro_text: "Connecticut's official nickname is <i>The Constitution State</i>, a title the General Assembly made official in 1959. The name traces to the Fundamental Orders of 1639 — a document many historians count among the world's first written constitutions. On January 9, 1788, Connecticut became the fifth state to ratify the U.S. Constitution, reinforcing a reputation it had been building for 150 years. The nickname appears alongside related entries in the [official nicknames of the 50 states](/symbols/nicknames)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Constitution State'"
    paragraphs:
      - "On January 14, 1639, settlers from Connecticut's three River Towns — Hartford, Windsor, and Wethersfield — adopted the Fundamental Orders. The document created a General Court, defined voting rights, and set rules for electing magistrates. It was among the first times in colonial America that a governing framework emerged from the colonists themselves rather than from a royal charter."
      - "Roger Ludlow drafted most of the text, drawing on ideas developed by Reverend Thomas Hooker. The orders gave elected officials real authority and extended voting rights further than most colonial governments of the era. The system was still limited by modern standards, but it represented a meaningful shift in where governing power was supposed to come from."
      - "Connecticut historian John Fiske made the boldest version of the claim in the 1880s: that the Fundamental Orders were the world's first written constitution. Other historians have pushed back — earlier governing documents exist — but the argument stuck. In 1959, lawmakers gave it official weight. License plates began carrying the phrase in 1973, and more than 100 million have since."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Nutmeg State"
        text: "This unofficial nickname became popular in the 1800s. Stories say Connecticut peddlers sold wooden nutmegs carved to look like real ones. These traveling salesmen supposedly tricked customers who did not know that nutmeg seeds must be ground into powder. No solid proof shows this actually happened. Another explanation suggests sailors brought nutmeg seeds back from voyages and people thought Connecticut produced the spice. The nickname stuck even though Connecticut never grew nutmegs. People from Connecticut are sometimes called Nutmeggers today."
      - subtitle: "Provisions State"
        text: "Connecticut earned this name during the American Revolution. The colony supplied enormous quantities of food, cannons, and ammunition to the Continental Army. Governor Jonathan Trumbull was the only sitting colonial governor who supported the Patriot cause from the start. Washington wrote to him repeatedly asking for provisions. Connecticut's logistical support was substantial enough that contemporaries took note of it as a defining characteristic of the state."
      - subtitle: "Land of Steady Habits"
        text: "This nickname appeared in newspapers and books around 1800. It meant Connecticut residents followed strict moral rules based on Puritan beliefs. People saw Connecticut as a place with strong values and proper behavior. The name also had a negative side. Critics said Connecticut refused to change and kept electing the same wealthy politicians from old families. The state kept its colonial charter as its government plan until 1818, long after other states wrote new constitutions."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The Fundamental Orders document is on display at the Museum of Connecticut History at the State Library."
      - "Connecticut delegates Roger Sherman and Oliver Ellsworth helped create the Connecticut Compromise at the 1787 Constitutional Convention."
      - "Connecticut kept using its 1662 royal charter as a governing document until 1818 — decades after independence — making it one of the last states to write a new constitution."
      - "Connecticut's current state constitution was adopted in 1965 and is the fourth document to govern the state."
      - "Former Chief Justice Simeon Baldwin defended the claim that the Fundamental Orders were the first written constitution."
      - "State law required the Constitution State nickname to appear on license plates starting in 1973."

faq:
  - question: "What is Connecticut’s nickname?"
    answer: "Connecticut’s nickname is the Constitution State. The name reflects the colony’s early role in developing written systems of government."

  - question: "Why is Connecticut called the Constitution State?"
    answer: "Connecticut is called the Constitution State because of the Fundamental Orders adopted in 1639. The document established a framework for self-government and elections."

  - question: "What is the origin of Connecticut’s Constitution State nickname?"
    answer: "The nickname originates from the Fundamental Orders of 1639. In the 19th century, historian John Fiske helped popularize the idea that the document functioned as an early written constitution."

  - question: "When did Connecticut adopt the Constitution State nickname?"
    answer: "Connecticut officially adopted the Constitution State nickname in 1959 when it was approved by state lawmakers."

  - question: "What does the Constitution State nickname mean?"
    answer: "The nickname points to the Fundamental Orders of 1639, which established written rules for elections and lawmaking in colonial Connecticut — one of the earliest such frameworks in North America."

