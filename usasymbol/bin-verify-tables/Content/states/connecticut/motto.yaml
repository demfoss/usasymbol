faq:
  - question: "What is Connecticut's state motto?"
    answer: "Connecticut's state motto is \"Qui Transtulit Sustinet,\" a Latin phrase meaning \"He Who Transplanted Still Sustains.\" It has appeared on Connecticut's seal since approximately 1647 and was formally adopted with the state seal in 1784."

  - question: "What does \"Qui Transtulit Sustinet\" mean?"
    answer: "It means \"He Who Transplanted Still Sustains\" in Latin. The phrase refers to divine providence transplanting English settlers to Connecticut and continuing to sustain them. The \"He\" means God."

  - question: "What is the English translation of \"Qui Transtulit Sustinet\"?"
    answer: "The standard translation is \"He Who Transplanted Still Sustains.\" Some sources add the implied objects for clarity: \"He Who Transplanted Us Still Sustains Us.\" Both are accepted."

  - question: "When did Connecticut adopt its state motto?"
    answer: "The motto has been in use since approximately 1647, when the colonial General Court adopted a seal with three grapevines and this Latin phrase. The Connecticut General Assembly formally adopted it as part of the state seal in 1784."

  - question: "Where does Connecticut's motto appear?"
    answer: "The motto appears on the Great Seal of Connecticut on a ribbon below the shield, and on the Connecticut state flag as part of the coat of arms on a blue field."

