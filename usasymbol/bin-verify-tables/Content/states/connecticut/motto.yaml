intro_text: "Connecticut's state motto is <strong>Qui Transtulit Sustinet</strong>, Latin for <em>He Who Transplanted Still Sustains</em>. The phrase has appeared on Connecticut's seal since approximately 1647 — more than a century before American independence — making it one of the oldest state mottos in continuous use in the United States. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

