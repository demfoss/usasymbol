seo:
  title: "Most Common Surnames in Connecticut"
  description: "Connecticut's most common surnames include Smith, Jones, and Miller, with Irish, Italian, Polish, and Puerto Rican roots visible."

page:
  h1: "Most Common Last Names in Connecticut"
  intro: "Smith leads the most common last names in Connecticut, but the real story is in the factory towns — Irish, Italian, and Polish surnames saturate the Naugatuck Valley, and Puerto Rican families have reshaped Hartford's name map since the 1950s."
  heritage_title: "Irish, Italian, Polish, and Puerto Rican Roots"
  heritage_body: "Connecticut's Brass Valley — the Naugatuck River towns of Waterbury, Ansonia, and Derby — drew massive Italian and Polish immigration between 1880 and 1920. These factory workers settled alongside Irish families who arrived during the 1840s Famine, building Hartford's railroads and canals. By mid-century, Puerto Rican families established Hartford as one of the most heavily Puerto Rican cities per capita in the United States."
  fun_fact: "New Haven's Wooster Square neighborhood, home to one of the most concentrated Italian-American communities in New England, gave the city its identity as America's pizza capital — surnames like Russo and Ferraro still cluster there at rates far above the national average."

surnames:
  - rank: 1
    name: Smith
    count: 26800
    ratio: 133
    origin: english
    type: Occupational
    meaning: "Metalworker, from Old English 'smið'. Colonial Connecticut's iron forges in the Litchfield Hills and Salisbury made this one of the state's earliest occupational surnames."

  - rank: 2
    name: Johnson
    count: 23200
    ratio: 154
    origin: english
    type: Patronymic
    meaning: "Son of John, from Norse 'Jóhannr' via English. Johnson appears in Hartford and New Haven Colony records from the 1630s — among the first surnames documented in the state."

  - rank: 3
    name: Williams
    count: 19700
    ratio: 181
    origin: english
    type: Patronymic
    meaning: "Son of William, from Norman 'Willahelm' — will and helm. Welsh settlers arriving with English Puritans in the 1630s brought Williams to Connecticut, where it has ranked in the top five ever since."

  - rank: 4
    name: Brown
    count: 19200
    ratio: 186
    origin: english
    type: Descriptive
    meaning: "Named for brown hair or complexion. Brown families appear in Hartford County deeds from the 1650s, making it one of the earliest documented surnames among Connecticut's original Puritan settlers."

  - rank: 5
    name: Jones
    count: 18600
    ratio: 192
    origin: welsh
    type: Patronymic
    meaning: "Son of John, via Welsh 'Ioan'. Welsh settlers arrived alongside English Puritans in Connecticut's founding decade, and Jones has remained one of the most continuously recorded surnames in the state since the 1630s."

  - rank: 6
    name: Miller
    count: 14300
    ratio: 250
    origin: english
    type: Occupational
    meaning: "One who operates a mill, from Old English 'mylenweard'. Connecticut's colonial grist mills along the Connecticut River made Miller one of the state's most common occupational surnames from the earliest settlement period."

  - rank: 7
    name: Davis
    count: 13600
    ratio: 263
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ' — beloved. Davis families appear in New Haven Colony records as early as the 1640s, brought by English and Welsh Puritan settlers."

  - rank: 8
    name: Wilson
    count: 11400
    ratio: 314
    origin: english
    type: Patronymic
    meaning: "Son of Will (William), a contraction of Williamson. Scottish and Northern English settlers brought Wilson into Fairfield County towns throughout the 17th and 18th centuries."

  - rank: 9
    name: Taylor
    count: 10700
    ratio: 334
    origin: english
    type: Occupational
    meaning: "A tailor, from Old French 'tailleur'. Textile manufacturing along the Naugatuck and Quinebaug rivers drew many Taylor families to Connecticut's mill towns in the 19th century."

  - rank: 10
    name: Thomas
    count: 10000
    ratio: 357
    origin: welsh
    type: Patronymic
    meaning: "Son of Thomas, from Aramaic 'Tʼōmā' — twin. Welsh quarrymen and factory workers brought Thomas to northeastern Connecticut in the mid-1800s, working industries near Killingly and Voluntown."

  - rank: 11
    name: Anderson
    count: 9700
    ratio: 369
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders (Andrew), a Scandinavian patronymic. Swedish and Norwegian immigrants who settled New Haven and Bridgeport in the late 19th century for manufacturing work carried this name in significant numbers."

  - rank: 12
    name: Moore
    count: 9500
    ratio: 376
    origin: english
    type: Habitational
    meaning: "Someone who lived near a moor, from Old English 'mōr'; also an anglicization of Irish 'Ó Mórdha'. Famine-era Irish who settled Hartford's South End in the 1840s and 1850s made Moore a lasting Connecticut name."

  - rank: 13
    name: Martin
    count: 9300
    ratio: 384
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus' — of Mars. French-Canadian mill workers who settled in Willimantic and Putnam in the 1870s–1890s brought Martin, one of Quebec's most common surnames, into northeastern Connecticut."

  - rank: 14
    name: White
    count: 9100
    ratio: 393
    origin: english
    type: Descriptive
    meaning: "Named for white or very fair hair, from Old English. White families are recorded in New Haven Colony documents from the 1640s, placing it among Connecticut's oldest English surnames."

  - rank: 15
    name: Thompson
    count: 8900
    ratio: 402
    origin: english
    type: Patronymic
    meaning: "Son of Thom (Thomas), with 'p' inserted as a 15th-century spelling convention. Widely recorded in Fairfield County since the early 1700s, when English colonists settled southwestern Connecticut."

  - rank: 16
    name: Harris
    count: 8600
    ratio: 416
    origin: english
    type: Patronymic
    meaning: "Son of Harry (Henry), from the Norman personal name. Harris appears in Hartford County colonial deeds of the 1650s–1660s and remains consistently common across Tolland and Windham counties."

  - rank: 17
    name: Garcia
    count: 8300
    ratio: 431
    origin: spanish
    type: Habitational
    meaning: "From Basque 'hartz' — bear. Puerto Rican migration to Hartford and Bridgeport in the 1950s–1970s made Garcia the fastest-rising surname in Connecticut during the latter half of the 20th century."

  - rank: 18
    name: Clark
    count: 8100
    ratio: 441
    origin: english
    type: Occupational
    meaning: "A clerk or scholar, from Latin 'clericus'. Recorded in New Haven Colony from the 1640s — the founding of Yale University in 1701 kept the scholarly association of the name prominently visible in the city."

  - rank: 19
    name: Lewis
    count: 7500
    ratio: 477
    origin: welsh
    type: Patronymic
    meaning: "From Welsh 'Llywelyn' or French 'Louis'. Welsh settlers brought Lewis to Connecticut alongside Jones and Williams in the 1630s; early records in Wethersfield and Windsor document the name from the colony's first decade."

  - rank: 20
    name: Robinson
    count: 7100
    ratio: 503
    origin: english
    type: Patronymic
    meaning: "Son of Robin (Robert). Widely recorded in eastern Connecticut since the 1700s, particularly in Windham and New London counties, where English farming families settled inland from the coast."

