- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Tokul Soil
  paragraphs:
  - "Douglas fir is the dominant tree on Tokul soil. Western Washington's timber industry was built on this series — Douglas fir tolerates the shallow, seasonally wet conditions created by the ortstein hardpan and grows tall in the cool, rainy climate. Western red cedar and western hemlock are also native to Tokul landscapes."
  - "Christmas tree farms are a major use of Tokul soil in King, Snohomish, and Pierce counties. Noble fir, Douglas fir, and grand fir grow well in the shallow-rooted conditions. Blueberries, raspberries, and strawberries also grow on Tokul soils where moisture is held near the root zone but drainage is adequate."
  - "Pastureland with orchardgrass and tall fescue occupies flatter Tokul areas with better drainage. Most row crops on Tokul soil need drainage management — tile drains or raised beds — to work around the cemented hardpan."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tokul Soil Facts
  facts:
  - "Washington's Legislature designated the Tokul series as the official state soil in 2010 as part of the Soil Science Society of America's national initiative to give each state an official soil."
  - "The series is named after Tokul Creek in King County, Washington, near the town of Snoqualmie, where USDA soil scientists established the type location."
  - "Tokul soil is classified as a Spodosol — one of the twelve soil orders, defined by an accumulation of iron and organic matter in a subsoil horizon called the spodic horizon."
  - "The defining feature of Tokul soil is its ortstein: sandy material cemented so hard by iron oxides and humus that a standard shovel cannot break it. The hardpan typically begins 12 to 28 inches below the surface."
  - "Tokul soil formed from Vashon Glaciation till — sediment deposited when the Cordilleran Ice Sheet retreated from western Washington approximately 15,000 years ago."
  - "The pale, bleached albic layer between the dark surface and the reddish ortstein is called the E horizon. It gets its washed-out color because thousands of years of rainfall have leached every iron molecule downward, concentrating it in the hardpan below."

