faq:
- question: What is Washington's state soil?
  answer: "Washington's state soil is the Tokul series, a dark Spodosol found across the Puget Sound lowlands of western Washington. It was designated official by the Washington Legislature in 2010 and is named after Tokul Creek in King County."
- question: Why is it called Tokul soil?
  answer: "The series is named after Tokul Creek, a stream in King County near the town of Snoqualmie, where USDA soil scientists first formally described and mapped the series. The type location remains in King County."
- question: What color is Tokul soil?
  answer: "The surface layer is very dark brown from decomposing conifer litter and humus. Below that is a pale, light gray layer where rain has leached out the iron. The ortstein hardpan beneath it is dark reddish brown — colored by iron oxides that have cemented the sandy material into a solid layer."
- question: Where is Tokul soil found in Washington?
  answer: "Tokul soil grows across the Puget Sound lowlands of western Washington, from Whatcom County near the Canadian border south to Clark County near Portland. It is most concentrated in King, Snohomish, Pierce, Kitsap, and Mason counties on the hilly terrain surrounding Puget Sound."
- question: What grows in Tokul soil?
  answer: "Douglas fir is the main tree grown on Tokul soil — western Washington's timber industry depends on it. Western red cedar and western hemlock also grow here. Christmas tree farms, blueberries, raspberries, and strawberries are common agricultural uses in the Puget Sound counties."
- question: Who chose Tokul as Washington's state soil?
  answer: "The Washington Legislature designated Tokul as the state soil in 2010. The Soil Science Society of America organized the campaign, and the Washington Association of Conservation Districts and the USDA Natural Resources Conservation Service supported the designation."
- question: How deep is Tokul soil?
  answer: "The full profile runs about five feet to dense glacial till. The organic duff and dark surface layer together are roughly 6 inches deep. The pale albic zone extends to about 14 inches. The cemented ortstein hardpan begins around 14 inches and can reach 28 inches. Below that is compacted Vashon till that roots cannot penetrate."

