faq:
- question: What is Washington's state fossil?
  answer: "Washington's state fossil is the Columbian mammoth (Mammuthus columbi), a large plant-eating mammal from the Pleistocene epoch, designated in 1998."
- question: When did Washington adopt its state fossil?
  answer: "Washington designated the Columbian mammoth as its official state fossil in 1998."
- question: What did the Columbian mammoth look like?
  answer: "The Columbian mammoth stood up to 13 feet at the shoulder, weighed as much as 10 tons, and had curved tusks up to 16 feet long. Unlike the woolly mammoth, it had little to no fur and lived in warmer grassland and forest habitats."
- question: How is the Columbian mammoth different from the woolly mammoth?
  answer: "The Columbian mammoth was larger, had little or no fur, and lived in warmer climates across much of North America including the Pacific Coast. The woolly mammoth was smaller, covered in thick fur, and lived on cold tundra. The two species overlapped in range and may have interbred."
- question: Where are Columbian mammoth fossils found in Washington?
  answer: "Columbian mammoth remains have been found on the Olympic Peninsula and in central and eastern Washington, including the Yakima Valley. In 2005, a nearly complete skeleton was found near Ellensburg. The Burke Museum in Seattle holds specimens from the state."
- question: When did the Columbian mammoth live?
  answer: "The Columbian mammoth lived from about 1.5 million years ago through the end of the Pleistocene, going extinct around 10,000 years ago as the climate warmed and human hunters spread across North America."

