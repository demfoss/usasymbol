- id: facts
  icon: fa-solid fa-lightbulb
  title: Columbian Mammoth Facts
  facts:
  - "Washington designated the Columbian mammoth as its state fossil in 1998; petrified wood is the state stone and also technically a fossil."
  - "The Columbian mammoth was larger than the woolly mammoth: males reached 13 feet at the shoulder and 10 tons, with little to no fur."
  - "In 2005, a high school student discovered the Wenas Creek Mammoth near Ellensburg, one of the most complete Columbian mammoth skeletons found in the Pacific Northwest."
  - "Columbian mammoth tusks could reach 16 feet in length, among the longest of any proboscidean."
  - "The Columbian mammoth ranged from Alaska to Central America and may have interbred with woolly mammoths where their ranges overlapped."

