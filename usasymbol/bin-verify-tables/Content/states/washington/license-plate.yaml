seo_title: "Washington License Plate Slogan | Evergreen State"
seo_description: "Evergreen State became Washington's standard license plate slogan in 1998 and is tied to the state's forested nickname."
hero_image: /images/license-plates/washington/1998-evergreen-state.jpg
hero_image_alt: Washington license plate with Evergreen State slogan and Mount Rainier
hero_image_caption: Washington added "EVERGREEN STATE" to the standard Mount Rainier passenger plate in July 1998.
intro_text: "**\"Evergreen State\"** is Washington's current standard license plate slogan. It was added to the Mount Rainier passenger base in **July 1998**, after a no-slogan mountain design. Earlier standard slogans were anniversary phrases: **\"1889-GOLDEN JUBILEE-1939\"** in 1939 and **\"Centennial Celebration\"** on the 1987-late 1990 base. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Evergreen State\" is Washington's current standard license plate slogan, introduced in July 1998. Earlier Washington standard slogans were \"1889-GOLDEN JUBILEE-1939\" in 1939 and \"Centennial Celebration\" from 1987 to late 1990. Between late 1990 and July 1998, the Mount Rainier passenger base had no slogan."
