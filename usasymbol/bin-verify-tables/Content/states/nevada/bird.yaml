title: Mountain Bluebird
scientific_name: Sialia currucoides
adopted_year: 1967
legislation: NRS 235.060; Stats. 1967, ch. 235 (A.B. 198)
meaning: Nevada's state bird makes the most sense beside sagebrush. The Legislature added the Mountain Bluebird in the same 1967 act that reaffirmed sagebrush as the state flower, and later Nevada's official tartan tied blue to the bird and yellow to sagebrush.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "Nevada State Bird | Mountain Bluebird"
seo_description: "Nevada adopted the Mountain Bluebird in 1967 in the same act that reaffirmed sagebrush, pairing bird and flower."
intro_text: "Nevada's official state bird is the <strong>Mountain Bluebird</strong>, adopted in <strong>1967</strong> and now codified in <strong>NRS 235.060</strong>. The important part is that Nevada did not add the bird by itself. In the same 1967 act, the Legislature also reaffirmed <strong>sagebrush</strong> as the state flower. That pairing gives the bird a clearer Nevada meaning: not just a blue species from the West, but a bird chosen to sit beside sagebrush in Nevada's official landscape symbolism. This profile appears in the [list of U.S. state birds](/symbols/birds)."
