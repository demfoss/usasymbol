sections:
- id: why-did-nevada-add-the-mountain-bluebird-with-sagebrush
  icon: fa-solid fa-circle-question
  title: Why Did Nevada Add the Mountain Bluebird With Sagebrush?
  paragraphs:
  - The strongest Nevada detail is not simply that the Mountain Bluebird became state bird in 1967. It is that the same act also amended the law on sagebrush. Nevada added the bird beside a plant symbol that was already doing heavy identity work for the state.
  - The choice reads less like an isolated bird selection and more like a paired landscape statement. Sagebrush already anchored Nevada to the Great Basin and high desert. The bluebird added color, motion, and a living counterpart above that terrain.
  - The symbol works best when read next to sagebrush, not as a stand-alone species profile.
- id: how-did-the-bluebird-enter-nevadas-official-color-language
  icon: fa-solid fa-palette
  title: How Did the Bluebird Enter Nevada's Official Color Language?
  paragraphs:
  - 'The pairing did not stop in 1967. Nevada''s official tartan statute later made the color symbolism explicit: blue stands for the state color, Lake Tahoe, and the Mountain Bluebird, while yellow stands for sagebrush and the Great Basin region.'
  - That later echo is useful because it shows the bird did not remain a one-line designation buried in the code. It became part of Nevada's broader symbolic vocabulary.
  - In Nevada's official symbolism, the Mountain Bluebird carries the blue half of the state's blue-and-sage visual identity — a role that extended from the 1967 law into the tartan statute decades later.
faq:
- question: What is Nevada's state bird?
  answer: Nevada's state bird is the Mountain Bluebird.
- question: When did Nevada adopt the Mountain Bluebird?
  answer: Nevada adopted the Mountain Bluebird as its state bird in 1967.
- question: Was Nevada's state bird adopted in the same act as the state flower?
  answer: Yes. The 1967 act that added the Mountain Bluebird also reaffirmed sagebrush as Nevada's state flower.
- question: Why did the Mountain Bluebird fit Nevada?
  answer: It fit best as the bird companion to sagebrush. Nevada's 1967 law makes the two symbols easier to read together, as parts of the same landscape identity rather than as unrelated emblems.
- question: What does the Mountain Bluebird mean for Nevada?
  answer: For Nevada, the Mountain Bluebird means more than a western songbird. It became part of a blue-and-sage symbol system that ties the bird to Nevada's landscape and later to its official color language.
- question: Does Nevada share the Mountain Bluebird with another state?
  answer: Yes. Idaho also uses the Mountain Bluebird as its state bird, but Idaho adopted it earlier in 1931.
