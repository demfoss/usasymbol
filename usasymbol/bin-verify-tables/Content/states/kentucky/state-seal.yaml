type: State Seal
state: Kentucky
name: Great Seal of Kentucky
adopted_year: 1792
is_official: true
legislation: KRS 2.020
meaning: "The Great Seal of the Commonwealth of Kentucky shows two men embracing: a frontiersman in buckskin and a statesman in formal dress. The image enacts the state motto \"United We Stand, Divided We Fall,\" which runs along the outer border. Goldenrod, the state flower, frames the figures in a wreath. The design has been part of Kentucky's official identity since statehood in 1792."
author: USA Symbol Team
date_published: '2026-05-09'
date_modified: '2026-05-15'
seo_title: 'Kentucky State Seal | Two Men & United We Stand'
seo_description: "Kentucky's state seal shows a frontiersman and statesman embracing, enacting United We Stand, Divided We Fall, adopted at statehood in 1792."
hero_image: /images/seals/kentucky/seal.webp
hero_image_alt: Great Seal of the Commonwealth of Kentucky, showing two men embracing under the motto United We Stand, Divided We Fall
hero_image_caption: The Great Seal of the Commonwealth of Kentucky. A frontiersman in buckskin and a statesman in formal dress embrace at center, framed by a goldenrod wreath and the state motto.
intro_text: "Kentucky's state seal is one of the most literal in the country: a frontiersman in buckskin and a statesman in formal dress embrace at the center, acting out the motto \"United We Stand, Divided We Fall\" that encircles them. The seal was adopted in 1792 when Kentucky became the 15th state. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
