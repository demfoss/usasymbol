sections:
  - id: history
    icon: fa-solid fa-landmark
    title: Kentucky State Seal History and Origin
    paragraphs:
      - "Kentucky entered the Union on June 1, 1792, as the 15th state, carved from Virginia's western territory. The new Commonwealth needed a seal immediately, and the design that was adopted placed the motto \"United We Stand, Divided We Fall\" at its center, illustrating it directly with two embracing figures."
      - "The motto came from \"The Liberty Song,\" a popular Revolutionary-era ballad by Philadelphia lawyer John Dickinson, published in 1768. It resonated in Kentucky's early years, when the Commonwealth had to balance the independence of frontier settlers with the legal order of an established civil government."
      - "Kentucky revised and standardized the seal's design over the following decades, refining details of the figures, the goldenrod wreath, and the border lettering. The current version is codified in Kentucky Revised Statutes § 2.020 and defines the seal for all official Commonwealth uses."

  - id: elements
    icon: fa-solid fa-shapes
    title: What the Kentucky State Seal Symbols Mean
    paragraphs:
      - "The seal's central image is uncommon among state seals because it depicts a specific action: two men embracing, one in frontier clothing and one in a gentleman's coat. Most state seals of the era used landscapes, coats of arms, or classical allegory. Kentucky's used a human gesture."
      - "The frontiersman represents the settlers who crossed the Appalachians along Daniel Boone's Wilderness Road and built Kentucky's first communities beyond the mountain barrier. The statesman in formal dress represents civil government, law, and the constitutional order that turned those settlements into a Commonwealth. Together, the figures argue that frontier independence and established governance must hold together."
      - 'The Great Seal of the Commonwealth of Kentucky uses three main visual layers: the two embracing figures at center, the goldenrod wreath, and the motto border.'
    elements:
      - id: two-men
        name: Frontiersman and Statesman
        image: /images/state-seals/kentucky/elements/two-men.webp
        paragraphs:
          - "The two embracing men are the seal's defining image. The figure on the left wears buckskin frontier clothing; the figure on the right wears a formal coat associated with the statesmen and politicians of the late eighteenth century. They face each other and embrace, making the motto a physical act rather than an abstract declaration."
          - "No single historical individual is identified as the model for either figure, though Kentucky's frontier era produced famous names including Daniel Boone, who blazed the Wilderness Road through the Cumberland Gap. The figures are representative types rather than portraits, intentionally broad enough to stand for the whole of each tradition."
      - id: motto
        name: United We Stand, Divided We Fall
        image: /images/state-seals/kentucky/elements/motto.webp
        paragraphs:
          - 'The motto "United We Stand, Divided We Fall" runs along the outer ring of the seal, encircling the central image. It comes from "The Liberty Song," written by John Dickinson in 1768, one of the most quoted patriotic phrases of the Revolutionary era. Kentucky adopted it at statehood in 1792 and it remains on the [Kentucky state motto](/states/kentucky/motto) page today.'
          - "The phrase carried particular force during the Civil War, when Kentucky's border-state position placed it under pressure from both Union and Confederate sides. The Commonwealth declared neutrality in 1861 before remaining in the Union. The motto predated the war by seven decades, but the conflict gave its words a sharper edge than the founders may have anticipated."
      - id: goldenrod-wreath
        name: Goldenrod Wreath
        image: /images/state-seals/kentucky/elements/goldenrod-wreath.webp
        paragraphs:
          - "A wreath of [goldenrod](/states/kentucky/flower) encircles the central figures. Goldenrod is Kentucky's official state flower, formally designated in 1926. Its presence on the seal predates that official adoption and reflects the plant's deep association with Kentucky's meadows and roadsides since the settlement era."
          - "The wreath separates the central image from the motto border and places a native Kentucky plant alongside the human scene at the seal's core. Goldenrod grew throughout the Commonwealth and was familiar to both the frontier settlers and the statesmen of 1792."
      - id: border-text
        name: Commonwealth of Kentucky
        image: /images/state-seals/kentucky/elements/border-text.webp
        paragraphs:
          - "The words \"Commonwealth of Kentucky\" appear in the seal's border, establishing the state's official name. Kentucky is one of four U.S. states that formally style themselves as a Commonwealth rather than a State, the others being Virginia, Pennsylvania, and Massachusetts."
          - "The Commonwealth designation dates directly to Kentucky's separation from Virginia in 1792. Virginia was itself a Commonwealth, and Kentucky retained the term at independence. It carries no difference in federal law but reflects the state's founding political identity."

  - id: previous-versions
    icon: fa-solid fa-clock-rotate-left
    title: 'Previous Versions of the Kentucky State Seal'
    paragraphs:
      - "Kentucky's seal was authorized in 1792, but the law described only \"two friends embracing\" and the surrounding motto. Because the wording was so general, artists and engravers produced very different versions across the 19th and early 20th centuries."
      - 'Official keepers of the seal repeatedly inherited slightly different designs. Some versions show two men in formal dress, others show handshakes rather than embraces, and some make the frontier element much more explicit. In 1962, the General Assembly finally clarified the intended symbolism: a frontiersman and a statesman greeting one another.'
