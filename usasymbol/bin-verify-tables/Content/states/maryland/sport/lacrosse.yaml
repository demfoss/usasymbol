faq:
  - question: What is Maryland's state team sport?
    answer: "Maryland's official state team sport is lacrosse, adopted in 2004."
  - question: When did Maryland adopt lacrosse as its state team sport?
    answer: "Maryland adopted lacrosse as its state team sport in 2004, more than four decades after naming jousting its state sport."
  - question: Why did Maryland choose lacrosse?
    answer: "Lacrosse already had wide participation across Maryland schools and colleges, plus a rivalry between Johns Hopkins and the University of Maryland dating to 1904. The state is also home to US Lacrosse and the National Lacrosse Hall of Fame."
  - question: Is lacrosse Maryland's only official sport?
    answer: "No. Maryland also recognizes jousting as its official state sport, adopted in 1962, and walking as its official state exercise, adopted in 2008."

