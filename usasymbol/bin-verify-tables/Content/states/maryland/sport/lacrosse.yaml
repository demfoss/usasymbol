sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Maryland State Sport
    paragraphs:
      - "Maryland named lacrosse its official state team sport in 2004, formalizing a status the sport already held in schools, colleges, and communities statewide. Unlike jousting, Maryland's individual state sport since 1962, lacrosse recognized a team game whose history in North America predates the United States itself. Maryland is one of the few states where lacrosse rivals football and basketball for attention at the high school and college level."

  - id: what-is
    icon: fa-solid fa-people-group
    title: "Lacrosse in Maryland"
    paragraphs:
      - "Two teams of players carry a small rubber ball in a net at the end of a long stick, passing, cradling, and shooting toward a goal defended by a goalkeeper. Maryland fields some of the sport's most storied college programs, led by the Johns Hopkins Blue Jays, who have played the University of Maryland Terrapins since 1904 in one of college sports' longest-running rivalries. Their 2004 matchup marked the 100th playing of the series, and the rivalry regularly draws more than 10,000 fans to Maryland Stadium."
      - "Youth and high school lacrosse are just as prominent across the state, with programs in nearly every Maryland county feeding directly into college rosters. US Lacrosse, the sport's national governing body, is headquartered in Sparks, Maryland, and the National Lacrosse Hall of Fame moved there after years on the Johns Hopkins campus. For many Maryland families, lacrosse season is as much a fixture of spring as baseball is elsewhere."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Lacrosse Represents Maryland
    paragraphs:
      - "Lacrosse did not start as an American sport in the modern sense; Native American nations across eastern North America played versions of the game for centuries before Europeans arrived, often for training, diplomacy, or ceremony. The first written European account of the game came from a French Jesuit missionary in 1636, more than a century before Maryland became a state. Calling it a team sport barely covers what the game meant to the nations who invented it."
      - "Modern Maryland turned that history into one of the country's densest lacrosse cultures. Johns Hopkins fields one of the sport's most decorated programs, and the Blue Jays' rivalry with the University of Maryland Terrapins has run since 1904, one of the oldest continuous rivalries in college sports. The Naval Academy in Annapolis and dozens of Maryland high schools add to a lacrosse calendar that runs from spring youth leagues through college championship weekends."
      - "Lacrosse also carries institutional weight in Maryland that few other states can claim. US Lacrosse, the sport's national governing body, and the National Lacrosse Hall of Fame are both headquartered in the state. That combination of grassroots participation and national institutions made lacrosse an easy choice once Maryland decided to add a team sport alongside jousting."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Lacrosse Became Maryland's State Team Sport
    paragraphs:
      - "Maryland's legislature designated lacrosse the state's official team sport in 2004, more than four decades after jousting became the state's individual sport in 1962. By 2004, lacrosse had grown rapidly at the club and school level across Maryland, and lawmakers pointed to that growth as reason to give the sport its own official status. The designation gave Maryland two official sports covering different kinds of competition, one ridden alone and one played in teams."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Lacrosse Facts
    facts:
      - "Maryland designated lacrosse its official state team sport in 2004."
      - "The first written European account of lacrosse dates to 1636, recorded by a French Jesuit missionary."
      - "Johns Hopkins and the University of Maryland have played their lacrosse rivalry since 1904."
      - "US Lacrosse and the National Lacrosse Hall of Fame are both headquartered in Sparks, Maryland."
      - "Maryland also recognizes jousting as its state sport, adopted in 1962, and walking as its state exercise, adopted in 2008."

