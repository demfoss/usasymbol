faq:
  - question: "What are Alabama's state colors?"
    answer: "Crimson and white are Alabama's traditional state colors, drawn from the state flag adopted in 1895."
  - question: "Are crimson and white Alabama's official state colors?"
    answer: "They are the official colors of Alabama's state flag but Alabama has no separate law designating official state colors."
  - question: "What do Alabama's colors mean?"
    answer: "Crimson is the color of the diagonal cross on the flag. White is the background field. The 1895 flag act named both colors but assigned no deeper official symbolism."
  - question: "What colors are on the Alabama flag?"
    answer: "The Alabama flag shows a crimson Saint Andrew's cross on a white field, adopted in 1895."

