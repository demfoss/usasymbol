seo_title: "Alabama State Colors | Crimson and White"
seo_description: "Crimson and white are Alabama's traditional state colors, taken from the 1895 state flag's wide saltire cross on a white field."

intro_text: "The traditional state colors of Alabama are **Crimson** and **White**, drawn from the [Alabama state flag](/states/alabama/flag) adopted in 1895. Crimson marks the diagonal cross, white is the open field behind it. The University of Alabama adopted the same colors for athletics, making them the most recognized color combination in the state."

official_colors: "Crimson, White"
official_since: "Traditional"
primary_use: "State Flag, State Seal, University Athletics"
known_for: "The crimson Saint Andrew's cross on a white field, established by the 1895 flag act and reinforced by University of Alabama athletics."

