faq:
- question: What is Alabama's state fossil?
  answer: "Alabama's state fossil is the Basilosaurus Whale (Basilosaurus cetoides), an early whale from the Eocene epoch. The state legislature designated it in 1984."
- question: When did Alabama adopt its state fossil?
  answer: "Alabama adopted the Basilosaurus Whale as its state fossil in 1984, the same year it also designated its state dinosaur."
- question: What did the Basilosaurus Whale look like?
  answer: "Basilosaurus cetoides had a long, eel-like body up to 60 feet long, with elongated vertebrae that gave it a serpentine shape. It had two types of teeth, cone-shaped front teeth and serrated rear teeth, plus tiny vestigial hind legs left over from its land-mammal ancestors."
- question: Where are Basilosaurus Whale fossils found in Alabama?
  answer: "Basilosaurus fossils are found in the Eocene marine deposits of southwest Alabama, particularly in Choctaw, Washington, and Clarke counties. The Alabama Museum of Natural History in Tuscaloosa holds significant specimens from the state."
- question: When did the Basilosaurus Whale live?
  answer: "Basilosaurus cetoides lived during the Late Eocene, roughly 40 to 34 million years ago. It went extinct as the Eocene ended and global climate cooled."
- question: Who pushed to make it Alabama's state fossil?
  answer: "The Alabama state legislature designated Basilosaurus cetoides in 1984. Southwest Alabama's exceptional Eocene marine fossil record made it the clear scientific choice; the state holds some of the richest Basilosaurus deposits in North America."

