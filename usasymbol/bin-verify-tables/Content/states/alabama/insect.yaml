sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Alabama?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Alabama's official state insect. The Alabama Legislature designated it in 1989."
  - "Alabama does not see monarchs year-round as residents. The butterflies pass through the state each fall as part of one of the longest insect migrations in North America."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots. Males have a small black scent patch on each hind wing that females lack."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches, one of the larger butterflies found in Alabama."
  - "Monarch caterpillars are banded in white, yellow, and black, and feed only on milkweed. That single food source is why milkweed plantings matter so much for the species."

- id: history
  icon: fa-solid fa-landmark
  title: How Alabama Chose the Monarch Butterfly
  paragraphs:
  - "Alabama schoolchildren campaigned for a state insect and pressed the Legislature to act. In 1989, lawmakers responded by naming the monarch butterfly the official state insect."
  - "The same year, Alabama also named a separate state butterfly, the eastern tiger swallowtail, championed by Selma resident Mallieve Breeding, known locally as the Butterfly Lady. She argued the swallowtail lives in Alabama year-round, while monarchs only migrate through it."
  - "That is why Alabama is one of the few states with two distinct official butterfly-related symbols: a state insect and a separate state butterfly. Alabama later added a third insect symbol in 2015, naming the [queen honey bee](/states/alabama/insect/queen-honey-bee) its official state agricultural insect."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Alabama
  paragraphs:
  - "Monarchs are seen across Alabama, but the state's Gulf Coast is the best place to find large numbers of them. Migration typically begins in late August and peaks from mid-September through October."
  - "Fort Morgan, at the tip of the Gulf Coast in Baldwin County, is one of the most reliable stopover points. Migrating monarchs cluster in trees there, waiting for favorable winds before continuing across or around the Gulf of Mexico on their way to overwintering sites in central Mexico."
  - "The grounds of the Grand Hotel in Fairhope and Point Clear are another well-known viewing spot during the fall migration."
