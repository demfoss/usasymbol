- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted: 1989, by the Alabama Legislature."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: about 3.5 to 4 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Monarch caterpillars eat only milkweed."
  - "Alabama's Gulf Coast, especially Fort Morgan, is a major fall staging point before monarchs cross toward their overwintering grounds in Mexico."
  - "Alabama also has a separate state butterfly, the eastern tiger swallowtail, adopted the same year."
  - "Alabama recognizes a third insect symbol, the queen honey bee, named the official state agricultural insect in 2015."

faq:
- question: What is Alabama's state insect?
  answer: "Alabama's state insect is the monarch butterfly, adopted by the Alabama Legislature in 1989."
- question: When did Alabama adopt the monarch butterfly?
  answer: "Alabama adopted the monarch butterfly as its official state insect in 1989."
- question: Why did Alabama choose the monarch butterfly?
  answer: "Alabama schoolchildren campaigned for an official state insect and pushed the Legislature to act. Lawmakers responded in 1989 by naming the monarch butterfly."
- question: What does Alabama's state insect look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in Alabama?
  answer: "Monarchs are seen statewide, but Alabama's Gulf Coast, especially Fort Morgan and the Fairhope and Point Clear area, sees large numbers during the fall migration from late August through October."
- question: Does Alabama have a separate state butterfly?
  answer: "Yes. Alabama named the eastern tiger swallowtail as its official state butterfly the same year it adopted the monarch as state insect, since the swallowtail lives in Alabama year-round while monarchs only migrate through."
- question: Does Alabama have other official insect symbols?
  answer: "Yes. Alongside the monarch butterfly, Alabama recognizes the eastern tiger swallowtail as its state butterfly and the queen honey bee as its state agricultural insect, adopted in 2015."

