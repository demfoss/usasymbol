sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is Alabama's State Agricultural Insect?
  paragraphs:
  - "The queen honey bee, Apis mellifera, is Alabama's official state agricultural insect. The Alabama Legislature designated it in 2015."
  - "Alabama created this separate agricultural category because the monarch butterfly already holds the title of state insect. The queen honey bee designation instead recognizes honey bees' role in pollinating Alabama crops."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Queen Honey Bee
  paragraphs:
  - "A queen honey bee is larger than the worker bees in her colony, with a longer, tapered abdomen built to lay eggs rather than gather pollen or nectar."
  - "Each colony has only one queen. She can lay up to 2,000 eggs a day, and every worker bee in the hive is her daughter."
  - "A healthy queen can live two to five years, far longer than worker bees, which typically live only a few weeks during the busy season."

- id: history
  icon: fa-solid fa-landmark
  title: How Alabama Chose the Queen Honey Bee
  paragraphs:
  - "Alabama lawmakers created the state agricultural insect category in 2015 specifically to honor honey bees without disturbing the state's existing state insect, the monarch butterfly, adopted in 1989."
  - "The designation recognizes the value of honey bees to Alabama agriculture. Bees pollinate a wide range of the state's fruit, vegetable, and row crops, and Alabama beekeepers produce honey commercially across the state."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Queen Honey Bee Facts
  facts:
  - "Adopted: 2015, by the Alabama Legislature."
  - "Scientific name: Apis mellifera."
  - "A queen can lay up to 2,000 eggs per day and live two to five years."
  - "Every worker bee in a colony is the queen's daughter."
  - "Alabama also has a separate state insect (monarch butterfly) and state butterfly (eastern tiger swallowtail), both adopted in 1989."

faq:
- question: What is Alabama's state agricultural insect?
  answer: "Alabama's state agricultural insect is the queen honey bee, adopted by the Alabama Legislature in 2015."
- question: When did Alabama adopt the queen honey bee?
  answer: "Alabama adopted the queen honey bee as its official state agricultural insect in 2015."
- question: Why did Alabama choose the queen honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Alabama agriculture and pollination without changing the state's existing state insect, the monarch butterfly."
- question: What does a queen honey bee look like?
  answer: "A queen honey bee is larger than worker bees, with a longer, tapered abdomen. She can lay up to 2,000 eggs a day and live two to five years."
- question: Is the queen honey bee the same as Alabama's state insect?
  answer: "No. Alabama's state insect is the monarch butterfly, adopted in 1989. The queen honey bee is a separate designation, the state agricultural insect, adopted in 2015."

