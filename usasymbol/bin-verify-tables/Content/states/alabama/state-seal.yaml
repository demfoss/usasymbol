hero_image_caption: The Great Seal of Alabama, centered on a map of the state with its principal rivers. The design was first adopted in 1817 when Alabama was still a territory.
intro_text: "Alabama's state seal centers on a map of the state and its principal rivers rather than the allegorical figures used by most early state seals. The design was first adopted in 1817, when Alabama was still a territory, and carried into statehood two years later. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
