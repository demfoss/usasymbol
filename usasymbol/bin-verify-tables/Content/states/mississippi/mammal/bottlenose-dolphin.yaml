faq:
  - question: "What is Mississippi's state water mammal?"
    answer: "Mississippi's state water mammal is the bottlenose dolphin (Tursiops truncatus), designated in 1974 through Senate Bill No. 2324. The same legislation simultaneously designated the white-tailed deer as the state land mammal, creating a unique land-and-water pairing that reflects Mississippi's ecological diversity from interior forests to coastal waters."
  
  - question: "When was the bottlenose dolphin designated as Mississippi's state water mammal?"
    answer: "The bottlenose dolphin became Mississippi's official state water mammal on April 12, 1974. The designation recognized the species' importance to Mississippi's Gulf Coast identity, commercial fishing heritage, and coastal tourism while acknowledging the state's marine resources alongside terrestrial wildlife and symbols such as the [Mississippi state flag](/states/mississippi/flag/mississippi-state-flag)."
  
  - question: "Why does Mississippi Sound have the largest estuarine dolphin population in the United States?"
    answer: "Mississippi Sound harbors the largest bay, sound, and estuarine dolphin population in the United States due to exceptional habitat quality. The Sound is a shallow, semi-enclosed body of water protected by barrier islands, averaging only 10-12 feet deep. This creates extensive shallow-water habitat with productive seagrass beds, oyster reefs, and abundant fish populations. The Sound's position between freshwater river inputs and saltwater from the Gulf creates estuarine conditions that support diverse prey communities. The barrier islands provide protection from Gulf storms while numerous passes between islands create tidal currents that concentrate fish. This combination of factors makes Mississippi Sound ideal dolphin habitat and a critical nursery for juvenile dolphins."
  
  - question: "How did Hurricane Katrina affect Mississippi dolphins?"
    answer: "Hurricane Katrina struck Mississippi's Gulf Coast on August 29, 2005, with immediate devastating effects including increased juvenile dolphin mortality and destruction of the Marine Life Oceanarium in Gulfport (8 dolphins were swept to sea but later rescued). However, researchers documented an unexpected phenomenon beginning in 2007: a 15% increase in dolphin reproductive rates for two years after the hurricane. This baby boom resulted from two factors—female dolphins who lost calves during the storm became reproductively active again rather than waiting 3-4 years between births, and the hurricane destroyed 87% of Mississippi's commercial fishing fleet, reducing fishing pressure and leaving more fish for dolphins, improving maternal nutrition and calf survival."
  
  - question: "What impact did the Deepwater Horizon oil spill have on Mississippi dolphins?"
    answer: "The 2010 Deepwater Horizon oil spill caused catastrophic impacts to Mississippi Sound's bottlenose dolphin population. Mississippi Sound was identified as one of the most severely injured dolphin stocks in the Gulf. Studies documented chronic lung disease, impaired adrenal function indicating damaged stress response, dramatically increased reproductive failure, and increased mortality among exposed dolphins. The spill triggered the largest and longest-lasting dolphin die-off ever recorded in the Gulf, with record numbers of dead dolphins stranding for over four years. Scientists estimated the Mississippi Sound dolphin population would decline by approximately 51% over the decade following the spill and would require 39 years to recover without active restoration. Health problems persisted for years after the spill, with 35% of dolphins examined three years later showing guarded or worse prognoses compared to 11% in healthy reference populations."
  
  - question: "Where can I see dolphins in Mississippi?"
    answer: "The most reliable place to see bottlenose dolphins in Mississippi is during the Ship Island ferry crossing from Gulfport Harbor. Ship Island Excursions, a family-owned business operating since 1926, runs passenger ferries across Mississippi Sound to West Ship Island approximately 11 miles offshore. Dolphins are frequently visible during the one-hour crossing, often swimming near the boat. The company also offers dedicated dolphin-watching cruises that search specifically for dolphin pods. The Mississippi Aquarium in Biloxi maintains a resident pod of bottlenose dolphins in a lagoon habitat with daily presentations. Dolphins can also be spotted from boats in barrier island passes, ship channels, and throughout Mississippi Sound, though wild dolphin sightings from shore are less reliable since dolphins prefer deeper water away from beaches."
  
  - question: "Why does Mississippi have both a land mammal and a water mammal?"
    answer: "Mississippi designated both a land mammal (white-tailed deer) and a water mammal (bottlenose dolphin) in the same 1974 legislation to acknowledge the state's geographic and ecological diversity. Mississippi extends from the Mississippi River Delta and interior forests in the north through central pine forests to 62 miles of Gulf coastline in the south. These different regions support distinct wildlife communities and human cultures—inland hunting and forestry versus coastal fishing and maritime traditions. By creating a land/water mammal pairing, legislators recognized that a single animal symbol could not adequately represent Mississippi's full breadth. The deer represents all 82 counties and inland heritage, while the dolphin represents the three coastal counties and maritime heritage. This dual approach demonstrated sophisticated understanding that different ecosystems require different conservation strategies and that both terrestrial and coastal wildlife contribute to Mississippi's identity."
  
  - question: "Are Mississippi dolphins protected?"
    answer: "Yes, bottlenose dolphins in Mississippi waters are protected under the federal Marine Mammal Protection Act, which prohibits harassment, hunting, capturing, or killing marine mammals in U.S. waters. Violations can result in substantial fines and imprisonment. The Mississippi Department of Marine Resources works with federal agencies to enforce these protections and manage conservation efforts. Following the Deepwater Horizon oil spill, Mississippi Sound dolphins received additional attention as a severely injured stock requiring restoration efforts funded by the $8.8 billion settlement with BP. The Institute for Marine Mammal Studies operates a 24-hour stranding hotline (888-767-3657) for reporting injured, distressed, or dead dolphins. Members of the public should never approach, touch, or attempt to interact with dolphins—federal law requires maintaining distance and avoiding any actions that alter natural behavior."

