title: "Mississippi State Water Mammal | Bottlenose Dolphin"
scientific_name: "Tursiops truncatus"
adopted_year: 1974

seo_title: "Mississippi State Water Mammal | Bottlenose Dolphin"
seo_description: "Mississippi's state water mammal is the Bottlenose Dolphin, adopted in 1974. Learn why this official Mississippi symbol was chosen and what it represents."

intro_text: "The Bottlenose Dolphin is the official Mississippi state water mammal, designated in 1974. This page gives the direct answer for searches like 'mississippi state water mammal', 'mississippi state animal', and 'mississippi state mammal' while explaining how the symbol fits the state's official animal designations. Largest estuarine dolphin population in United States; Hurricane Katrina paradoxical baby boom (2007); Deepwater Horizon oil spill tragedy; Ship Island sightings. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Bottlenose Dolphin"
official_since: "1974"
status: "Protected under Marine Mammal Protection Act; Mississippi Sound population severely impacted by 2010 Deepwater Horizon oil spill with estimated 51% population loss"
