weight: "300-650 pounds; males typically larger than females"
coloration: "Light gray to purplish-gray upper body; pale gray sides; white belly; dolphins in Mississippi Sound often have numerous scars and nicks on dorsal fins from interactions"
distinctive_traits: "Curved dorsal fin in center of back; horizontal tail fluke (unlike vertical fish tails); characteristic 'smile' created by jaw structure; breathe air through single blowhole on top of head"

habitat: "Coastal shallow waters including Mississippi Sound, barrier island passes, ship channels, and offshore waters to 600 feet depth"
range_in_state: "Mississippi Sound from Louisiana border to Alabama border; barrier islands including Ship Island, Horn Island, Cat Island; frequently seen during Ship Island ferry crossings"
