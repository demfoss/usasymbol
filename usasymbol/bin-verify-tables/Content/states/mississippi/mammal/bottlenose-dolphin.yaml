sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Mississippi designated the bottlenose dolphin as the official state water mammal in 1974 through Senate Bill No. 2324, the same legislation that simultaneously named the white-tailed deer as the state land mammal. This deliberate pairing demonstrated legislative recognition that Mississippi encompasses fundamentally different ecosystems from the Delta bottomlands through pine forests to the Gulf Coast, reinforcing [The Magnolia State identity](/states/mississippi/nickname/the-magnolia-state)."
      - "The dual designation in April 1974 reflected Mississippi's geographic breadth extending from interior forests to 62 miles of Gulf coastline. While the white-tailed deer represented Mississippi's terrestrial wildlife and hunting heritage, the bottlenose dolphin represented the state's maritime traditions, commercial fishing industry, and coastal tourism. Florida is the only other state to officially recognize the bottlenose dolphin as a state symbol."
    
    subsections:
      - subtitle: "Land and Water Mammal Partnership"
        text: "Mississippi's simultaneous designation of terrestrial and marine mammal symbols created an unusual and sophisticated approach to state symbolism. The pairing acknowledged that Mississippi contains distinct ecological zones requiring different management approaches—upland forests and agricultural lands supporting deer populations, and coastal waters supporting dolphin populations. The legislation recognized both inland and coastal residents' connections to wildlife. While the deer serves hunters, farmers, and forest managers across all 82 counties, the dolphin serves commercial fishermen, charter boat operators, and coastal communities along the Gulf. Together, these symbols capture Mississippi's full geographic and cultural identity from north to south."
      
      - subtitle: "Why Mississippi Chose the Bottlenose Dolphin"
        text: "Mississippi selected the bottlenose dolphin because the species appears regularly in state coastal waters and represents the Gulf Coast's identity. Bottlenose dolphins frequent Mississippi Sound, the semi-enclosed body of water between the mainland and the barrier islands, providing reliable wildlife viewing opportunities for residents and tourists. The species connects to Mississippi's commercial fishing industry—dolphins and fishermen pursue many of the same species including mullet, croaker, and menhaden. Dolphins also attracted tourism through boat tours and aquarium exhibits. The 1974 designation came during a period when coastal states were formalizing symbols tied to marine resources and maritime heritage. The dolphin's intelligence, sociability, and visibility made it an appropriate choice for representing Mississippi's Gulf Coast."

  - id: "state-symbolism"
    icon: "fa-water"
    title: "What the Bottlenose Dolphin Represents"
    style: "highlight"
    paragraphs:
      - "The bottlenose dolphin symbolizes Mississippi's Gulf Coast heritage and the state's relationship with marine resources. For generations, Mississippi fishermen have shared the Sound's waters with dolphins, observing them hunt the same fish species that support commercial and recreational fisheries. Dolphins represent the wild abundance of Mississippi's coastal waters and the enduring vitality of the Gulf ecosystem."
      - "Mississippi Sound harbors the largest bay, sound, and estuarine bottlenose dolphin population in the United States. This distinction reflects the Sound's exceptional habitat quality with productive seagrass beds, oyster reefs, and abundant fish populations. The Sound's semi-enclosed geography, protected by barrier islands, creates ideal conditions for raising dolphin calves, making it one of the most important nursery areas for juvenile dolphins in the northern Gulf."
      - "The dolphin's recent history in Mississippi waters tells a dramatic story of resilience through catastrophe. Hurricane Katrina in 2005 disrupted the dolphin population but paradoxically led to a baby boom. The 2010 Deepwater Horizon oil spill caused devastating injuries that continue affecting the population today. These events transformed the dolphin from a symbol of coastal abundance to a symbol of environmental vulnerability and the need for conservation vigilance, themes also reflected in the [Mississippi state motto](/states/mississippi/motto/virtute-et-armis)."
    
    subsections:
      - subtitle: "Mississippi Sound: America's Largest Estuarine Dolphin Population"
        text: "Mississippi Sound extends approximately 90 miles along Mississippi's coast from the Louisiana border to the Alabama border, bounded on the south by six barrier islands: Cat Island, West Ship Island, East Ship Island, Horn Island, Petit Bois Island, and Dauphin Island. The Sound averages only 10-12 feet deep with a maximum depth around 20 feet, creating extensive shallow-water habitat perfect for dolphin foraging. Dolphins hunt in the deeper ship channels, around barrier island passes where tidal currents concentrate fish, and in shallow bays where mullet and other prey species congregate. The Sound's position between freshwater inputs from the Pearl River and Pascagoula River and saltwater from the Gulf creates estuarine conditions with variable salinity that supports diverse fish communities. This productivity, combined with the Sound's protected geography, allows Mississippi waters to support more estuarine dolphins than any comparable area in the United States."
      
      - subtitle: "Hurricane Katrina and the Paradoxical Baby Boom"
        text: "When Hurricane Katrina struck the Mississippi Gulf Coast on August 29, 2005, with a 25-30 foot storm surge, the hurricane's immediate effects on dolphins were devastating. Eight bottlenose dolphins from the Marine Life Oceanarium in Gulfport were swept out to sea when the facility was destroyed; all eight were eventually rescued but the oceanarium never reopened. Wild dolphins experienced increased juvenile mortality as young animals struggled with debris, displaced from familiar waters, and separated from mothers. However, researchers from the University of Southern Mississippi documented an unexpected phenomenon beginning in 2007: a massive increase in dolphin calves. Dolphin reproductive rates increased approximately 15 percent for two years following the hurricane before returning to normal levels. Scientists identified two mechanisms driving this baby boom: female dolphins who lost calves during the storm became reproductively active again the following breeding season rather than waiting the normal 3-4 years between births, and the hurricane destroyed 87 percent of Mississippi's commercial fishing fleet, creating a two-year period of dramatically reduced fishing pressure that left more fish for dolphins, improving maternal nutrition and calf survival."
      
      - subtitle: "Deepwater Horizon: The Largest Dolphin Die-Off in Gulf History"
        text: "The Deepwater Horizon oil spill, which began April 20, 2010, released approximately 3.19 million barrels of oil into the Gulf over 87 days. Mississippi Sound received heavy oiling, and bottlenose dolphins living in the Sound encountered oil at the water's surface and throughout the water column. The spill's impacts on dolphins emerged gradually but proved catastrophic. By summer 2010, record numbers of dead dolphins began stranding on Mississippi, Louisiana, and Alabama beaches—the largest and longest-lasting cetacean unusual mortality event ever recorded in the Gulf. Health assessments conducted in 2011 and 2013 revealed that Mississippi Sound dolphins suffered severe injuries including chronic lung disease, impaired adrenal function indicating damaged stress response systems, and dramatically increased reproductive failure. Studies estimated that the Mississippi Sound dolphin population, along with the Barataria Bay population in Louisiana, would decline by approximately 51 percent over the decade following the spill. The die-off continued for over four years, claiming more than a thousand marine mammals, mostly bottlenose dolphins. Even years after the spill, dolphins in Mississippi Sound showed persistent health problems that scientists expect will require decades for the population to recover without active restoration."
      
      - subtitle: "Protected Status and Ongoing Research"
        text: "Bottlenose dolphins receive federal protection under the Marine Mammal Protection Act, which prohibits harassment, hunting, capturing, or killing marine mammals in U.S. waters. The Mississippi Department of Marine Resources coordinates with the National Marine Fisheries Service and the U.S. Fish and Wildlife Service on dolphin conservation issues in state waters. The Institute for Marine Mammal Studies, located in Gulfport, conducts long-term photo-identification research on Mississippi Sound dolphins, photographing individual dolphins' dorsal fins to track population size, survival rates, habitat use, and site fidelity. This research, ongoing since 2010, has become critical for monitoring the population's recovery from the Deepwater Horizon spill. IMMS scientists conduct year-round surveys across Mississippi Sound to the Alabama border, as well as Lake Borgne and Biloxi Marsh in Louisiana, documenting that Mississippi Sound dolphins show strong site fidelity, staying close to home rather than ranging widely."
      
      - subtitle: "Ship Island and Dolphin Tourism"
        text: "Ship Island Excursions, a family-owned business operated by the Skrmetta family since 1926, runs passenger ferry service from Gulfport Harbor to West Ship Island, approximately 11 miles offshore. The one-hour ferry crossing provides one of Mississippi's most reliable opportunities for dolphin watching, as dolphins frequently swim and feed near the ferry route. Passengers regularly observe dolphins surfacing near the boat, sometimes in groups (called pods) of 5-20 individuals. The company also offers dedicated dolphin-watching cruises that search specifically for dolphin pods in Mississippi Sound and provide narrated information about dolphin behavior and ecology. These tourism operations connect thousands of visitors annually to Mississippi's state water mammal while generating economic activity for coastal communities. The Mississippi Aquarium in Biloxi maintains a pod of Atlantic bottlenose dolphins in a 14-acre lagoon habitat where visitors can observe dolphins daily and attend educational presentations about dolphin behavior, communication, and conservation challenges."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Bottlenose Dolphins"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Bottlenose dolphins are robust, medium-sized marine mammals distinguished by several characteristic features. The species gets its name from the short, stubby beak (rostrum) that resembles a bottle's neck. Dolphins in Mississippi waters typically measure 6-8 feet long, though individuals can reach 12 feet. Their streamlined, torpedo-shaped bodies enable efficient swimming at speeds up to 22 mph with brief bursts to 30 mph when pursuing prey or avoiding danger."
        list_items:
          - "**Size**: Most Mississippi Sound dolphins measure 6-8 feet long; males average slightly larger than females"
          - "**Weight**: Adults weigh 300-650 pounds depending on size and sex"
          - "**Coloration**: Light gray to purplish-gray upper body darkening toward dorsal fin; pale gray sides gradually fading to white belly"
          - "**Distinguishing Features**: Curved dorsal fin midway along back; horizontal tail fluke moves up-and-down (unlike fish with vertical tails moving side-to-side); characteristic 'smile' created by jaw structure; single blowhole on top of head for breathing"
      
      - subtitle: "Behavior and Communication"
        text: "Bottlenose dolphins demonstrate remarkable intelligence and complex social behavior. They live in small groups called pods typically containing 5-15 individuals, though larger temporary aggregations form when multiple pods gather in areas with concentrated food. Dolphins communicate through whistles, clicks, and body language. Each dolphin develops a unique signature whistle that functions like a name, allowing pod members to identify and locate one another. Dolphins use echolocation—producing rapid click sounds that bounce off objects and return as echoes—to navigate murky waters and locate prey. Mississippi Sound's turbid waters make echolocation particularly important for dolphins hunting in low visibility conditions. Dolphins demonstrate playful behavior including leaping completely out of the water (breaching), riding bow waves created by boats, and tossing fish or other objects."
      
      - subtitle: "Feeding and Habitat Use in Mississippi Waters"
        text: "Mississippi Sound dolphins feed primarily on fish including mullet, menhaden, croaker, spot, and pinfish. They also consume shrimp, crabs, and squid when available. Dolphins employ various hunting strategies depending on conditions and prey type. Individual dolphins often chase fish into shallow water or against shorelines where the fish become trapped. Groups of dolphins coordinate to herd schools of fish into tight balls, then take turns feeding. Some dolphins have learned to follow shrimp boats, feeding on fish and invertebrates stirred up by trawl nets or discarded as bycatch. Dolphins in Mississippi Sound show distinct ranging patterns: some remain in shallow inshore waters year-round with seasonal movements into mid-Sound, while others stay exclusively around the barrier islands. Research suggests most Mississippi Sound dolphins maintain relatively small home ranges and exhibit strong site fidelity, returning to the same areas repeatedly rather than making long-distance movements."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "Bottlenose Dolphins in Mississippi Waters"
    style: "default"
    paragraphs:
      - "Bottlenose dolphins inhabit Mississippi's coastal waters year-round, with the primary population residing in Mississippi Sound between the mainland coast and the barrier islands. The Sound provides shallow, protected waters rich with fish populations that support what researchers have identified as the largest estuarine dolphin population in the United States."
      - "Mississippi Sound is designated as the Mississippi Sound, Lake Borgne, Bay Boudreau Stock by federal management agencies—one of 38 separate bottlenose dolphin stocks identified in the Gulf. This stock shows strong site fidelity, with individual dolphins photographically documented returning to the same areas across multiple years, suggesting they maintain stable home ranges rather than mixing extensively with dolphins from adjacent regions."
    
    facts:
      - "**Population Distinction**: Mississippi Sound harbors largest bay/sound/estuarine bottlenose dolphin population in United States"
      - "**Nursery Importance**: Mississippi Sound serves as critical nursery habitat for juvenile dolphins; high proportion of calves observed annually"
      - "**Hurricane Katrina Impact (2005)**: Increased juvenile mortality followed by paradoxical 15% increase in reproductive rates for two years; fishing fleet destruction reduced human impacts"
      - "**Deepwater Horizon Impact (2010)**: Mississippi Sound identified as one of most severely injured dolphin stocks; 51% population decline projected; chronic health problems persist"
      - "**Protection Status**: Protected under Marine Mammal Protection Act; harassment, capture, or harm prohibited; violations subject to federal penalties"

  - id: "where-to-see"
    icon: "fa-location-dot"
    title: "Where to See Bottlenose Dolphins"
    style: "default"
    paragraphs:
      - "Mississippi offers numerous opportunities to observe bottlenose dolphins in their natural habitat along the Gulf Coast. The most reliable sightings occur during boat trips crossing Mississippi Sound, particularly the ferry route to Ship Island where dolphins frequently swim near vessels."
    
    list_items:
      - "**Ship Island Ferry (Gulfport)**: Passenger ferries operated by Ship Island Excursions cross Mississippi Sound to West Ship Island; dolphins frequently visible during 11-mile crossing; family-owned business since 1926"
      - "**Dolphin-Watching Cruises**: Dedicated dolphin cruises departing from Gulfport search Mississippi Sound specifically for dolphin pods; 90-minute to 2-hour tours with narrated information about dolphin behavior"
      - "**Mississippi Aquarium (Biloxi)**: Pod of Atlantic bottlenose dolphins in 14-acre lagoon habitat; daily dolphin presentations with trainers; educational exhibits about dolphin biology and conservation"
      - "**Barrier Island Passes**: Dolphins frequently feed in passes between barrier islands where tidal currents concentrate fish; visible from charter boats and private vessels navigating channels"
      - "**Coastal Marinas and Harbors**: Dolphins occasionally enter harbors and marinas pursuing fish; Gulfport Harbor and Biloxi Small Craft Harbor provide occasional viewing opportunities from shore"

  - id: "conservation-challenges"
    icon: "fa-shield"
    title: "Conservation and Recovery"
    style: "default"
    paragraphs:
      - "Mississippi's bottlenose dolphins face ongoing conservation challenges stemming primarily from the 2010 Deepwater Horizon oil spill. The spill's impacts continue affecting the population more than a decade later, with chronic health conditions and reduced reproductive success constraining recovery. Scientists estimate that without active restoration efforts, the Mississippi Sound dolphin population will require 39 years to recover to pre-spill levels."
      - "Current threats to Mississippi dolphins include vessel strikes from increasing boat traffic, entanglement in commercial and recreational fishing gear, habitat degradation from coastal development, freshwater diversions that alter salinity patterns critical to prey distributions, pollution including plastics and agricultural runoff, and underwater noise from vessel traffic and industrial activities. The Marine Mammal Commission coordinates with Mississippi state agencies, federal agencies, and research institutions to enhance dolphin conservation through improved monitoring, threat assessment, and restoration planning."
    
    subsections:
      - subtitle: "Deepwater Horizon Natural Resource Damage Assessment"
        text: "Following the 2010 Deepwater Horizon oil spill, federal and state trustees conducted a Natural Resource Damage Assessment to quantify injuries to natural resources including dolphins. The assessment found that at least 22 stocks representing at least 15 species of dolphins and whales overlapped with the oil spill footprint and suffered demonstrable, quantifiable injuries. The Mississippi Sound and Barataria Bay stocks of common bottlenose dolphins were identified as two of the most severely injured populations. Studies documented increased mortality (35 percent greater than expected), increased reproductive failure (46 percent greater than expected), and high prevalence of adverse health effects. The assessment resulted in an $8.8 billion settlement with BP to fund restoration and improvement projects. Funds allocated to marine mammal restoration support ongoing monitoring, health assessment, habitat restoration, and research to understand long-term population trajectories. Mississippi receives restoration funding to support dolphin recovery efforts in state waters."
      
      - subtitle: "Stranding Response and Research"
        text: "The Mississippi Department of Marine Resources maintains a memorandum of agreement with the Institute for Marine Mammal Studies for assistance with stranded dolphins, sea turtles, and manatees. When dolphins strand—coming ashore alive or dead—IMMS responds to assess the animal's condition, provide veterinary care if alive, or conduct necropsy if dead to determine cause of death. Stranding data provides critical information about population health, causes of mortality, and emerging threats. The stranding network documented the unusual mortality event that began in 2010 after the Deepwater Horizon spill and continues monitoring for any increases above expected background stranding rates. Live strandings may involve dolphins that are sick, injured, disoriented, or trapped in shallow areas during falling tides. IMMS operates a 24-hour hotline (888-767-3657) for reporting stranded marine mammals. Members of the public should never approach, touch, or attempt to return stranded dolphins to water without consulting trained responders."
      
      - subtitle: "Long-Term Population Monitoring"
        text: "The Institute for Marine Mammal Studies conducts year-round boat-based surveys across Mississippi Sound, photographing dolphin dorsal fins to identify individual animals through unique patterns of nicks, notches, and scars accumulated over their lifetimes. This photo-identification research, ongoing since 2010, allows scientists to estimate population size, track survival rates, document reproduction, and assess habitat use patterns. Researchers have developed a catalog of identified individuals and conduct statistical analyses to model population trends. This long-term monitoring has proven essential for understanding the Deepwater Horizon spill's ongoing impacts and tracking recovery progress. Studies using this data estimated monthly survival probability and population growth rates, finding that the Mississippi Sound population showed relatively stable growth by 2015, suggesting gradual recovery from spill impacts. However, the population remains below pre-spill levels, and continued monitoring will be necessary for decades to fully understand the spill's long-term legacy."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The bottlenose dolphin connects to other Mississippi state symbols through shared themes of natural resources, economic importance, and resilience through adversity. The 1974 pairing of dolphin and deer as water and land mammals demonstrated legislative sophistication in recognizing Mississippi's ecological diversity and the different conservation challenges facing terrestrial and marine wildlife, with broader context shown by [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "Several Mississippi symbols reference the state's relationship with water and coastal resources. The largemouth bass (state fish), wood duck (state waterfowl), and bottlenose dolphin all represent Mississippi's aquatic biodiversity and connections to fishing, hunting, and outdoor recreation traditions important to state culture and economy."
    
    subsections:
      - subtitle: "White-Tailed Deer Partnership"
        text: "Mississippi's 1974 designation of both the white-tailed deer (land mammal) and bottlenose dolphin (water mammal) in a single piece of legislation created an intentional symbolic pairing unique among state symbols. The pairing recognized that Mississippi's geography spans from the Mississippi River Delta through central pine forests to the Gulf Coast, encompassing fundamentally different ecosystems. The deer represents Mississippi's interior forests, agricultural lands, and hunting heritage important to rural communities across all 82 counties. The dolphin represents the Gulf Coast's maritime traditions, commercial fishing, and beach tourism concentrated in the three coastal counties. Together, they capture Mississippi's full geographic breadth from inland to coastal waters. Few other states have created such deliberate pairings of terrestrial and marine symbols recognizing distinct but complementary aspects of state identity."
        link:
          label: "See Mississippi state land mammal"
          url: "/states/mississippi/mammal/white-tailed-deer"
      
      - subtitle: "Gulf Coast Maritime Heritage"
        text: "The bottlenose dolphin connects to Mississippi's Gulf Coast heritage extending back centuries. Native American communities along the coast including the Biloxi, Pascagoula, and Choctaw peoples relied on coastal fisheries and would have regularly observed dolphins hunting the same waters. French explorers and colonists who arrived in the early 1700s established settlements along the coast and developed commercial fisheries, sharing the Sound with dolphins. During the nineteenth and early twentieth centuries, Mississippi's seafood industry expanded dramatically with oyster harvesting, shrimping, and commercial fishing becoming economic pillars for coastal communities. Fishermen developed intimate knowledge of dolphin behavior, recognizing individual dolphins that frequented specific areas and learning to interpret dolphin activity as indicators of fish locations. The dolphin designation in 1974 honored these longstanding connections between Mississippi's people and the marine wildlife that shares their coastal waters."

