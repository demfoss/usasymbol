seo_title: "Mississippi State Tree | Southern Magnolia"
seo_description: 'Mississippi declared southern magnolia its state tree in 1938, matching the state flower and honoring a familiar evergreen of towns and forests.'

intro_text: "Mississippi declared the Southern Magnolia its state tree in 1938. Few symbols fit the state more naturally: the magnolia is a familiar part of Mississippi landscapes, and the same species also serves as the state flower. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Mississippi"
    paragraphs:
      - "Mississippi recognizes the Southern Magnolia as its official state tree. This broadleaf evergreen grows 60 to 80 feet tall in Mississippi, though exceptional specimens can reach 100 feet. The trunk measures two to three feet in diameter at maturity. Unlike most Mississippi trees, magnolia keeps its glossy dark green leaves year-round, providing constant color in the landscape. The tree's evergreen nature made it especially valued for Southern landscapes where it maintained beauty through winter months. Mississippi's warm climate provides ideal conditions for Southern Magnolia, allowing the species to thrive throughout the state from the Gulf Coast to northern counties."
      - "The leaves provide the tree's most striking feature. Each leaf measures five to ten inches long and two to four inches wide. The upper surface appears glossy dark green and leathery. The underside shows a rusty brown color covered with fine hairs. The thick leathery leaves resist damage and last two years before dropping. Large white flowers bloom from May through summer, measuring eight to twelve inches across. The flowers produce an intensely sweet fragrance that perfumes the air around Mississippi magnolias. Each flower has six to twelve thick, waxy petals surrounding a cone-like center."
      - "Southern magnolia grows wild in Mississippi forests and swamps, particularly in southern counties. The tree thrives on moist, acidic soils throughout the state. Mississippi's natural magnolia groves grow in bottomlands along rivers and streams. The species also adapts well to cultivation, making it Mississippi's most planted ornamental tree. Historic plantations, college campuses, and town squares across Mississippi feature prominent magnolias. The tree tolerates Mississippi's humid summers and mild winters better than most evergreens. Native wildlife feeds on magnolia seeds, including squirrels, turkey, and numerous songbirds."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Southern Magnolia"
    paragraphs:
      - "The official name is Southern Magnolia, distinguishing it from other magnolia species found across North America. Mississippians often call it simply magnolia or bull bay, an old Southern name. The scientific name Magnolia grandiflora honors French botanist Pierre Magnol and describes the large flowers - grandiflora means 'large-flowered' in Latin. The genus name Magnolia applies to about 210 species worldwide, though Southern Magnolia is the most prominent in Mississippi."
      - "The common name 'bull bay' comes from the tree's habitat in bay swamps and bays along the Gulf Coast. Some old-timers call it evergreen magnolia to distinguish it from deciduous magnolia species. In antebellum Mississippi, people called distinctive trees 'yard magnolias' when planted near homes. The species belongs to the Magnoliaceae family, one of the most ancient flowering plant families. Fossil evidence shows magnolias existed before bees evolved - beetles originally pollinated these primitive flowers."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Southern Magnolia Became the Mississippi State Tree"
    paragraphs:
      - "Mississippi declared the Southern Magnolia as its official state tree on April 1, 1938. The Mississippi Legislature passed Senate Bill 270 during the 1938 session. The legislation established both the magnolia tree and magnolia blossom as state symbols. This dual designation makes Mississippi unique - the state tree and state flower come from the same species. Mississippi became the first state to designate magnolia as an official symbol, though Louisiana later adopted it as state flower in 1900, reinforcing [The Magnolia State nickname](/states/mississippi/nickname/the-magnolia-state)."
      - "Mississippi picked Southern Magnolia because it epitomizes the state's Deep South character. The tree appears throughout Mississippi's cultural landscape - on antebellum plantations, around historic homes, and in town squares across the state. Magnolias shade Mississippi college campuses including the University of Mississippi, where ancient magnolias create one of the South's most beautiful settings. The tree's evergreen foliage and showy flowers represent the lush vegetation and temperate climate that distinguish Mississippi from northern states. The magnolia became an emblem of Southern culture, appearing in literature, art, and architecture associated with Mississippi and the South, and on the [current Mississippi state flag](/states/mississippi/flag/mississippi-state-flag)."
      - "The tree held practical and symbolic importance for Mississippi families. Plantation owners planted magnolias as symbols of permanence and gentility. The large glossy leaves made natural decorations for Mississippi homes during holidays. Magnolia wood provided lumber for furniture and interior finishing in Mississippi houses, though never as commercially important as pine or hardwoods. The fragrant flowers perfumed summer evenings across Mississippi, creating sensory memories tied to place and home. Mississippi writers like Eudora Welty and William Faulkner referenced magnolias in works depicting the state. This combination of visual beauty, cultural significance, and widespread presence made Southern Magnolia the inevitable choice when Mississippi formalized its state tree designation. The magnolia represented everything Mississippi wanted to project about itself - beauty, tradition, and Southern character."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Mississippi State Tree Facts"
    facts:
      - "Mississippi declared Southern Magnolia as state tree on April 1, 1938, through Senate Bill 270"
      - "Mississippi is unique because both state tree and state flower are the same species - the Southern Magnolia"
      - "The glossy dark green leaves last two years on the tree before dropping, providing year-round evergreen color"
      - "Flowers measure eight to twelve inches across with an intense sweet fragrance that can perfume entire Mississippi neighborhoods"
      - "The tree is one of the most primitive flowering plants, with fossil evidence showing magnolias existed over 95 million years ago"
      - "Magnolias evolved before bees - beetles originally pollinated these ancient flowers and still do so today"
      - "The rusty brown underside of magnolia leaves comes from dense fine hairs that protect against moisture loss in Mississippi's heat"
      - "Historic magnolias on Mississippi college campuses and plantations can live 100 to 200 years, witnessing generations of state history"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Mississippi State Tree and Flower"
    paragraphs:
      - "Mississippi's state flower is also the Magnolia blossom, designated alongside the tree in 1938. This makes Mississippi rare among all states - the tree and flower both come from the Southern Magnolia. The Legislature recognized that the magnolia's spectacular blooms deserved separate acknowledgment as the state flower. The large white waxy flowers with their intense fragrance represent Mississippi's southern landscape. The glossy evergreen foliage represents permanence and strength. Together, the magnolia tree and blossom encompass Mississippi's character more completely than separate symbols could; see the [official Mississippi state flower](/states/mississippi/flower/magnolia). The dual designation demonstrates how central magnolia is to Mississippi culture and landscape."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Mississippi Magnolia"
    paragraphs:
      - "The leaves provide instant recognition. Look for large glossy dark green leaves measuring five to ten inches long. The upper surface shines like polished leather. Flip a leaf over to see the rusty brown underside covered with fine fuzzy hairs. The leaves feel thick and stiff, quite different from thin deciduous tree leaves. The evergreen foliage persists year-round, making magnolia easy to identify even in winter when other Mississippi trees stand bare. Young leaves emerge covered in rusty brown hairs on both sides before the upper surface becomes glossy green."
      - "The flowers bloom from May through summer in Mississippi. Each massive bloom measures eight to twelve inches across, among the largest flowers of any tree. Six to twelve thick waxy white petals surround a cone-like center packed with stamens and pistils. The flowers emerge at branch tips. Fresh blooms appear pure white, gradually turning cream-colored before browning. The intense sweet fragrance carries on Mississippi summer breezes. Spent flowers leave cone-like seed pods that mature to brown, opening to reveal bright red seeds in fall."
      - "The overall form shows a pyramidal shape when young, becoming more rounded and spreading with age. Low branches sweep nearly to the ground on open-grown Mississippi magnolias. The trunk is typically straight and divides into several major limbs. The bark appears smooth and gray on young trees, developing shallow furrows and a somewhat scaly texture with age but never developing deep furrows. The dense evergreen crown casts deep shade year-round. In Mississippi landscapes, magnolias often grow as broad specimen trees rather than forest trees, displaying the full pyramidal to rounded form."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Mississippi State Tree Symbolizes"
    paragraphs:
      - "Southern Magnolia reflects Mississippi's Deep South heritage and culture. The tree symbolizes the genteel traditions of antebellum Mississippi, evoking images of columned mansions and gracious hospitality. The evergreen foliage represents endurance through changing times. For many Mississippians, magnolia fragrance evokes powerful memories of home, family, and place. The tree appears so frequently in Mississippi literature and culture that magnolia and Mississippi became inseparable. The species represents both the recognizable look of Mississippi's landscape and the cultural traditions that distinguish the state. Modern Mississippi continues honoring the magnolia's symbolic importance through conservation and planting, ensuring future generations see this familiar tree across a geography summarized by [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Mississippi state tree?"
    answer: "The Southern Magnolia (Magnolia grandiflora) is Mississippi's official state tree. The Legislature declared it the state tree on April 1, 1938, through Senate Bill 270. Mississippi is unique because both the state tree and state flower are the same species."
  
  - question: "What is the Mississippi state tree called?"
    answer: "Mississippi's state tree is called Southern Magnolia or simply magnolia. It's also known as bull bay in older Southern terminology. The scientific name is Magnolia grandiflora, meaning 'magnolia with large flowers.' Some call it evergreen magnolia to distinguish it from deciduous magnolia species."
  
  - question: "When was the Mississippi state tree adopted?"
    answer: "Mississippi declared the Southern Magnolia as its official state tree on April 1, 1938. The Legislature passed Senate Bill 270 establishing both the magnolia tree and magnolia blossom as state symbols during the 1938 session."
  
  - question: "Why is the Southern Magnolia Mississippi's state tree?"
    answer: "Mississippi chose the Southern Magnolia because it epitomizes the state's Deep South character. The tree appears throughout Mississippi's cultural landscape on plantations, historic homes, and town squares. Its evergreen foliage and showy fragrant flowers represent the lush vegetation and temperate climate that define Mississippi. The magnolia became an emblem of Southern culture in literature and art. The tree's beauty, cultural significance, and widespread presence made it the natural symbol for Mississippi culture."
  
  - question: "What is the Mississippi state tree name?"
    answer: "The name is Southern Magnolia. The scientific name is Magnolia grandiflora - Magnolia honors French botanist Pierre Magnol, and grandiflora means 'large-flowered' in Latin. The 'southern' distinguishes it from other magnolia species found in northern regions."
  
  - question: "Where does the Mississippi state tree grow?"
    answer: "The Southern Magnolia grows wild in Mississippi forests and swamps, particularly in southern counties. It thrives on moist, acidic soils throughout the state. The tree is also widely planted as an ornamental across Mississippi on plantations, campuses, and town squares. Southern Magnolia grows naturally along the Gulf Coast from North Carolina to Texas."
  
  - question: "What are some facts about the Mississippi state tree?"
    answer: "The Southern Magnolia grows 60 to 80 feet tall as an evergreen. Mississippi's state tree and state flower are both the Southern Magnolia - rare among all states. Flowers measure eight to twelve inches across with intense fragrance. The glossy leaves have rusty brown undersides. Magnolias existed over 95 million years ago, before bees evolved. The tree can live 100 to 200 years."
  
  - question: "How do you recognize the Mississippi state tree?"
    answer: "Look for large glossy dark green leaves (five to ten inches) with rusty brown fuzzy undersides. The thick leathery leaves stay on year-round. Massive white flowers (eight to twelve inches) bloom May through summer with intense sweet fragrance. The tree has smooth gray bark and a pyramidal to rounded form. The evergreen foliage makes it easy to identify even in winter."

