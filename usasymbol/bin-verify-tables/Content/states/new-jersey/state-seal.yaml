sections:
- id: history
  icon: fa-solid fa-landmark
  title: New Jersey State Seal History and Origin
  paragraphs:
  - "New Jersey adopted its state seal on October 3, 1777, among the earliest states to formalize an official emblem after the Revolution began. The Provincial Congress commissioned Pierre Eugene du Simitiere, a Swiss-born artist and naturalist based in Philadelphia, to design it. Du Simitiere contributed design proposals for the Great Seal of the United States during the same period and created seals for several other states."
  - "New Jersey had adopted its own state constitution on July 2, 1776, two days before the Continental Congress voted for independence. The date 1776 that appears on the shield marks that moment of self-governance. By October 1777, New Jersey had already been the site of some of the heaviest Revolutionary War fighting, including the battles of Trenton and Princeton fought in the winter of 1776 to 1777."
  - "The seal's composition has remained unchanged since 1777. Liberty, Ceres, three plows, the horse's head, the motto, and the date 1776 are the same elements du Simitiere placed in the original design."

- id: elements
  icon: fa-solid fa-shapes
  title: What the New Jersey State Seal Symbols Mean
  paragraphs:
  - "New Jersey's seal organizes its symbols around a central shield supported by two classical figures, with a crest above and a motto scroll below."
  elements:
  - id: liberty
    name: Liberty
    image: /images/state-seals/new-jersey/elements/liberty.webp
    paragraphs:
    - "Liberty stands at the left of the shield, holding a staff topped with a Phrygian cap. The Phrygian cap was a soft conical cap associated in ancient Rome with freed slaves. In the American Revolutionary period, it became a widely used symbol for liberation from monarchy and British rule."
    - "In heraldic convention the left position is the place of honor. Liberty stands there, and the motto opens with the same word: the design and the text say the same thing."
  - id: ceres
    name: Ceres
    image: /images/state-seals/new-jersey/elements/ceres.webp
    paragraphs:
    - "Ceres, the Roman goddess of grain and agriculture, stands at the right of the shield holding a cornucopia overflowing with produce. She appears on several American state seals from the Revolutionary era, reflecting how central farming was to the colonial economy."
    - "New Jersey earned its reputation as the Garden State through productive farmland that supplied wheat, corn, and vegetables to markets in New York and Philadelphia. Placing Ceres beside Liberty makes the seal's argument explicit: the state's founding goals were political freedom and agricultural prosperity."
  - id: three-plows
    name: Three Golden Plows
    image: /images/state-seals/new-jersey/elements/three-plows.webp
    paragraphs:
    - "The shield shows three golden plows on a blue field. Plows are one of the oldest agricultural symbols in European heraldry, representing cultivation and the land. Their presence on New Jersey's shield identifies the state's primary economic activity at the time of founding."
    - "In 1777, New Jersey was among the most productive farming colonies in British North America. Its location between New York and Philadelphia gave it access to two major markets, and its grain and produce moved through both ports."
  - id: horses-head
    name: "Horse's Head"
    image: /images/state-seals/new-jersey/elements/horses-head.webp
    paragraphs:
    - "The horse's head sits at the top of the design as the heraldic crest, above the knight's helmet. New Jersey was a significant horse-breeding and horse-trading region in the colonial era. Its position as the primary land route between New York and Philadelphia made horses central to the state's transportation and commerce."
    - "The horse had appeared in colonial New Jersey imagery before the Revolution. Du Simitiere incorporated it directly into the 1777 design."
  - id: motto
    name: "Liberty and Prosperity"
    image: /images/state-seals/new-jersey/elements/motto.webp
    paragraphs:
    - "The motto \"Liberty and Prosperity\" appears on a scroll at the base of the seal. Each word names one of the two supporting figures: Liberty on the left, and Ceres on the right who represents agricultural abundance. No interpretation is needed; the design and the motto say the same thing twice."
  - id: date-1776
    name: "1776"
    image: /images/state-seals/new-jersey/elements/date-1776.webp
    paragraphs:
    - "The date 1776 appears on the shield. It marks the year New Jersey adopted its own state constitution on July 2, 1776, and the year the Continental Congress declared American independence. New Jersey was among the first colonies to formalize self-governance, and the date anchors the seal to that founding year."
  - id: helmet
    name: "Knight's Helmet"
    image: /images/state-seals/new-jersey/elements/helmet.webp
    paragraphs:
    - "A knight's helmet sits above the shield and below the horse's head crest. In European heraldry, a helmet on a coat of arms indicates sovereignty and the right of self-governance. Its presence on New Jersey's seal signals that the state claims authority as an independent governing entity."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the New Jersey State Seal'
  paragraphs:
  - "New Jersey's seal has kept its original composition since 1777. The figures of Liberty and Ceres, the three plows, the horse's head, and the motto have not changed. Later revisions addressed rendering quality and proportions, not the composition itself."

