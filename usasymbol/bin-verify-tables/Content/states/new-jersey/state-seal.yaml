type: State Seal
state: New Jersey
name: Great Seal of New Jersey
adopted_year: 1777
is_official: true
legislation: N.J.S.A. 52:2-1
meaning: "The Great Seal of New Jersey places agriculture at the center and independence at its foundation. Three plows on the shield represent New Jersey's farming economy in 1777. Liberty on the left and Ceres on the right name the state's two founding commitments: political freedom and agricultural prosperity. The horse's head above the design was a well-established colonial symbol for New Jersey, a state known for horse breeding and positioned as the main overland corridor between New York and Philadelphia."
meaning_title: Great Seal of New Jersey Meaning
meaning_after_section: history
