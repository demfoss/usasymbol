seo_title: 'New Jersey State Seal | Liberty, Plow & Horse'
seo_description: "Why are Liberty and Ceres on the New Jersey state seal? Three plows, a horse's head, and the date 1776 explain the design adopted in 1777."
hero_image: /images/seals/new-jersey/seal.webp
hero_image_alt: Great Seal of the State of New Jersey, featuring Liberty, Ceres, three plows, and a horse's head crest
hero_image_caption: The Great Seal of New Jersey, adopted October 3, 1777. Liberty stands at left holding a Phrygian-capped staff, Ceres at right with a cornucopia. The motto "Liberty and Prosperity" runs along the base.
intro_text: "New Jersey's state seal shows Liberty on the left, Ceres on the right, and a shield bearing three golden plows on a blue field. A horse's head tops the design, the motto reads \"Liberty and Prosperity,\" and 1776 is marked on the shield. Pierre Eugene du Simitiere designed it and New Jersey's Provincial Congress adopted it on October 3, 1777. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
