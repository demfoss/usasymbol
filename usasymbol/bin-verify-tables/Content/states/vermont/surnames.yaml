    why: "Bushey is strongly overrepresented in Vermont, where it ranks 44th compared with 6,514th nationally. The name reflects the French-Canadian surname layer that entered the state through Quebec migration, Catholic parish networks, and mill work in northern Vermont."

  - name: Paquette
