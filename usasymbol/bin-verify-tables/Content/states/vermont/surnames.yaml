seo:
  title: "Most Common Last Names in Vermont"
  description: "Vermont's most common last names are Brown, Johnson, and Davis, with older Yankee and French-Canadian roots visible."

page:
  h1: "Most Common Last Names in Vermont"
  intro: "Brown, Johnson, and Davis are the most common last names in Vermont in the 2026 surname data, with Brown first at 2,905 bearers. The ranking looks different from the national top tier because Vermont's surname map is shaped by old New England farm families, the New Hampshire Grants settlement era, and French-Canadian migration into northern border towns and Winooski Valley mills."
  heritage_title: "Yankee Farm Towns and French-Canadian Mill Families"
  heritage_body: "Vermont's English surname layer grew out of eighteenth-century settlement from Connecticut, Massachusetts, and New Hampshire, especially after Benning Wentworth began issuing New Hampshire Grants in 1749. Vermont became the 14th state in 1791, but its name pattern had already been set by small towns, hill farms, church records, and families who moved along the Connecticut River and Lake Champlain corridors. A later French-Canadian layer arrived through Quebec migration and industrial work in places such as Winooski, Burlington, St. Albans, and Barre, which helps explain why names like Bushey, Roy, Benoit, Paquette, Bessette, Cote, Tatro, and Cota rank so visibly."
  fun_fact: "Bushey ranks 44th in Vermont but 6,514th nationally, making it one of the clearest signals of Vermont's French-Canadian surname layer within the state's top 50."

surnames:
  - rank: 1
    name: Brown
    count: 2905
    ratio: 219
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', referring to brown hair, complexion, or clothing. Brown leads Vermont, a clue that the state's top surnames lean toward old New England English names rather than the national order led by Smith."

  - rank: 2
    name: Johnson
    count: 2482
    ratio: 256
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', meaning God is gracious. Johnson is common across the United States, but in Vermont it sits inside an older Yankee pattern of plain English patronymics carried through farm towns and church records."

  - rank: 3
    name: Davis
    count: 2140
    ratio: 297
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', meaning beloved. Davis fits Vermont's colonial New England layer, where English and Welsh surnames moved north with settlers from Massachusetts, Connecticut, and New Hampshire."

  - rank: 4
    name: Clark
    count: 2119
    ratio: 300
    origin: english
    type: Occupational
    meaning: "From Latin 'clericus', a clerk, scholar, or churchman. Clark ranks unusually high in Vermont because early New England towns produced dense church, probate, land, and town-meeting records where literate officeholding families remained highly visible."

  - rank: 5
    name: Martin
    count: 2069
    ratio: 307
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', meaning of Mars. Martin works as a bridge surname in Vermont: it belongs to both English-speaking New England families and French-Canadian families connected to Quebec and northern New England mill towns."

  - rank: 6
    name: Williams
    count: 1839
    ratio: 346
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Norman name 'Willahelm', meaning will and helmet. Williams is nationally common, but in Vermont it ranks below Brown, Johnson, Davis, Clark, and Martin, showing how strongly regional New England names shape the state list."

  - rank: 7
    name: Miller
    count: 1746
    ratio: 364
    origin: english
    type: Occupational
    meaning: "A grain miller, from Middle English 'miller'. Vermont's streams powered sawmills, gristmills, and small factories, so Miller fits both the older farm economy and the early industrial villages that grew around waterpower."

  - rank: 8
    name: White
    count: 1582
    ratio: 402
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually a nickname for fair hair, pale complexion, or light clothing. White belongs to the same English descriptive surname layer as Brown, a pairing that is especially prominent in northern New England."

  - rank: 9
    name: Jones
    count: 1547
    ratio: 411
    origin: welsh
    type: Patronymic
    meaning: "Son of John, through Welsh 'Ioan'. Jones is one of the most common Welsh surnames in America, but Vermont's ranking places it behind several older New England favorites rather than near the very top."

  - rank: 10
    name: Allen
    count: 1493
    ratio: 426
    origin: english
    type: Patronymic
    meaning: "From the given name Alan, probably Celtic in origin and often explained as little rock or handsome. In Vermont, Allen also echoes the revolutionary-era Green Mountain Boys through Ethan and Ira Allen, whose family name became inseparable from the state's founding story."

  - rank: 11
    name: Wright
    count: 1364
    ratio: 466
    origin: english
    type: Occupational
    meaning: "From Old English 'wyrhta', a craftsman or maker, especially one who worked with wood. Wright suits Vermont's small-town economy of barns, wagons, mills, and local trades before large-scale industry reached the state."

  - rank: 12
    name: Thompson
    count: 1336
    ratio: 476
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson reflects the broad English and Scots-Irish patronymic pattern that moved into Vermont with settlers from southern New England and New Hampshire."

  - rank: 13
    name: Young
    count: 1327
    ratio: 479
    origin: english
    type: Descriptive
    meaning: "From Old English 'geong', used to distinguish a younger man from an older relative with the same given name. Young is common in old New England records because repeated biblical and English first names often needed this kind of family distinction."

  - rank: 14
    name: Anderson
    count: 1285
    ratio: 495
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew, from Greek 'Andreas', meaning manly. Anderson entered Vermont through the wider northern New England stream of English, Scottish, and Scots-Irish family names."

  - rank: 15
    name: Baker
    count: 1252
    ratio: 508
    origin: english
    type: Occupational
    meaning: "A baker of bread, from Middle English 'bakere'. Baker is one of the plain occupational surnames that remained strong in Vermont because small towns preserved older English naming patterns across many generations."

  - rank: 16
    name: King
    count: 1218
    ratio: 522
    origin: english
    type: Descriptive
    meaning: "From Old English 'cyning', originally a nickname for someone connected with a royal household, pageant, or commanding manner. In Vermont it reads less as aristocratic language than as another durable English surname carried through rural New England."

  - rank: 17
    name: Hall
    count: 1172
    ratio: 542
    origin: english
    type: Habitational
    meaning: "For someone who lived or worked at a hall or manor house. Hall is widespread across New England and fits Vermont's early pattern of town-centered settlement, where meetinghouses, farms, and local offices anchored family names."

  - rank: 18
    name: Adams
    count: 1167
    ratio: 545
    origin: english
    type: Patronymic
    meaning: "Son of Adam, from the Hebrew name meaning man or earth. Adams carries deep New England associations, and its high Vermont rank reflects the state's continuity with Massachusetts and Connecticut family networks."

  - rank: 19
    name: Wood
    count: 1112
    ratio: 572
    origin: english
    type: Habitational
    meaning: "For someone who lived near or in a wood. Wood is especially at home in Vermont, where forested hill farms, timber lots, and small sawmill settlements shaped daily life from the eighteenth century forward."

  - rank: 20
    name: Parker
    count: 1096
    ratio: 580
    origin: english
    type: Occupational
    meaning: "A keeper of a park or enclosed hunting ground, from Old French and Middle English usage. Parker's place in Vermont's top 20 shows how medieval English occupational names survived far from their original social setting."

