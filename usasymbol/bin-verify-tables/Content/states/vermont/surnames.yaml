    national_rank: 3437
    origin: french
    why: "Paquette ranks 83rd in Vermont but 3,437th nationally, a sharp regional concentration for a French surname. Its visibility points to the same Quebec-to-Vermont movement that made French-language family names common in border communities and factory towns."

  - name: Bessette
    state_rank: 99
    national_rank: 7195
    origin: french
    why: "Bessette ranks 99th in Vermont and far lower nationally, making it one of the state's most distinctive top-100 surnames. The name is tied to French-Canadian family networks that moved south from Quebec during the nineteenth and early twentieth centuries."

  - name: Tatro
    state_rank: 131
    national_rank: 6914
    origin: french
    why: "Tatro ranks 131st in Vermont but 6,914th nationally. It is a localized French-Canadian surname in Vermont's data, preserved by families whose migration routes crossed the U.S.-Canada border rather than the Atlantic."

  - name: Cota
    state_rank: 134
    national_rank: 4070
    origin: french
    why: "Cota ranks 134th in Vermont and 4,070th nationally, closely related in pattern to Cote and other French-Canadian surnames. Its state concentration helps distinguish Vermont from southern New England states where Irish, Italian, and Polish names dominate more strongly."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Five of Vermont's top 20 surnames are occupational: Clark, Miller, Wright, Baker, and Parker. Their survival near the top fits a state where small towns, farms, mills, and local trades carried older English names forward without being overwhelmed by one later immigrant wave."
    examples:
      - Clark (clerk or scholar)
      - Miller (grain miller)
      - Wright (craftsman)
      - Baker (bread maker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics account for much of Vermont's top 20, including Johnson, Davis, Williams, Jones, Thompson, Anderson, and Adams. These names came through English, Welsh, Scottish, and Scots-Irish naming traditions that entered Vermont during the colonial and early statehood periods."
    examples:
      - Johnson (son of John)
      - Davis (son of David)
      - Williams (son of William)
      - Anderson (son of Andrew)

  - type: Descriptive and Place Names
    icon: fa-solid fa-map-location-dot
    description: "Brown, White, Young, King, Hall, and Wood show how nicknames and place-based surnames remained important in Vermont. Wood is especially telling for a state whose settlement history was built around cleared farms, forest lots, water-powered mills, and small villages."
    examples:
      - Brown (brown hair or complexion)
      - White (fair hair or complexion)
      - Hall (lived or worked at a hall)
      - Wood (near a wood)

faq:
  - question: "What are the most common last names in Vermont?"
    answer: "The most common last names in Vermont are Brown, Johnson, Davis, Clark, and Martin. Brown ranks first in the 2026 surname data, with 2,905 bearers statewide."

  - question: "Why is Brown the most common last name in Vermont?"
    answer: "Brown is the most common last name in Vermont because the state's surname pattern is heavily shaped by older English New England families. Unlike many states where Smith leads, Vermont's top tier preserves a colonial Yankee pattern in which Brown, Clark, Davis, White, Allen, Hall, Adams, Wood, and Parker all rank strongly."

