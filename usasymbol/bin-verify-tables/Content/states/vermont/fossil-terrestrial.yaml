- id: facts
  icon: fa-solid fa-lightbulb
  title: Woolly Mammoth Facts
  facts:
  - "Vermont designated the woolly mammoth tooth and tusk as its state terrestrial fossil in 2014, making it the only state with separate marine and terrestrial fossil designations."
  - "The law specifically names the tooth and tusk, not the full skeleton, because isolated teeth and tusk fragments are the mammoth remains most commonly found in Vermont."
  - "Male woolly mammoths stood up to 11 feet tall at the shoulder and weighed up to 6 tons, larger than any living land animal in North America today."
  - "Woolly mammoth tusks could reach 14 feet in length and curved dramatically outward and upward."
  - "Woolly mammoths went extinct about 10,000 years ago; small island populations in the Arctic survived until about 4,000 years ago."

