faq:
- question: What is Vermont's state terrestrial fossil?
  answer: "Vermont's state terrestrial fossil is the woolly mammoth (Mammuthus primigenius), specifically the tooth and tusk, adopted in 2014."
- question: When did Vermont adopt the woolly mammoth as its state fossil?
  answer: "Vermont designated the woolly mammoth tooth and tusk as its state terrestrial fossil in 2014. The same law reclassified the beluga whale, adopted in 1993, as the state marine fossil."
- question: What did the woolly mammoth look like?
  answer: "Woolly mammoths were covered in thick reddish-brown fur, stood up to 11 feet at the shoulder, and had curved tusks up to 14 feet long. Males weighed up to 6 tons. A fat hump behind the head helped store energy for cold winters."
- question: Where are woolly mammoth fossils found in Vermont?
  answer: "Mammoth teeth and tusk fragments have been found across Vermont in glacial deposits, particularly in the Champlain Valley lowlands and river valleys. Finds are usually isolated pieces rather than full skeletons. The Perkins Museum of Geology at UVM holds Vermont mammoth material."
- question: When did the woolly mammoth live?
  answer: "Woolly mammoths lived from about 400,000 years ago through the end of the Pleistocene, going extinct around 10,000 years ago. Small island populations survived until about 4,000 years ago."
- question: Why does Vermont's law name only the tooth and tusk?
  answer: "Complete mammoth skeletons are almost never found in Vermont. Teeth and tusk fragments are the mammoth remains that most commonly turn up here, in farm fields, stream banks, and construction sites, so the law named the parts that actually represent Vermont's fossil record."

