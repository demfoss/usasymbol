type: State Coat of Arms
state: Vermont
name: Vermont State Coat of Arms
adopted_year: 1862
is_official: true
meaning: "The Vermont coat of arms describes the land and the people who worked it. The pine tree and the mountains name Vermont itself: the state's name comes from the French vert mont, meaning green mountain. The cow and the wheat sheaves show what Vermonters raised and grew on that land. The crossed pine branches below the shield point to 1814, when Vermont soldiers fighting at the Battle of Plattsburgh wore pine sprigs as a badge of identity."
meaning_title: Meaning of the Vermont Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Vermont Coat of Arms: Meaning, Symbols and History'
seo_description: "The Vermont coat of arms was adopted in 1862 and shows a pine tree, red cow, and wheat sheaves on a mountain landscape, topped by a stag's head."
hero_image: /images/coats-of-arms/vermont/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Vermont, adopted 1862, showing a landscape shield with a pine tree, red cow, and wheat sheaves against the Green Mountains, topped by a stag's head crest
hero_image_caption: The Vermont Coat of Arms, adopted 1862. A landscape shield shows a pine tree rising at center, three wheat sheaves on the right, and a red cow on the left, set against the Green Mountains and a yellow sky. A stag's head forms the crest above the shield, and two crossed pine branches appear below as the Vermonter's Badge.
intro_text: "The Vermont coat of arms shows a landscape shield with a pine tree rising at the center, three wheat sheaves on the right, and a red cow on the left, all set against the Green Mountains and a yellow sky. The design was formalized by the Vermont Legislature in 1862, though its elements trace back to the Great Seal designed in 1779. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Vermont Coat of Arms?
  paragraphs:
  - "Vermont's coat of arms uses a full landscape scene instead of the geometric divisions found on most state shields. Where most American state arms divide their field into quarters or geometric bars, Vermont's shows a scene that looks like a view of the state itself."
  - "Above the shield sits a stag's head as the crest. Below the shield, two pine branches cross to form the Vermonter's Badge. A motto scroll beneath that reads Vermont; Freedom and Unity."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Vermont Coat of Arms
  paragraphs:
  - "The design begins with Ira Allen, younger brother of Ethan Allen and one of the founders of Vermont. In 1779, while Vermont was still an independent republic and not yet a U.S. state, Ira Allen designed the Great Seal of Vermont. Reuben Dean carved the image. Most of the elements on the modern coat of arms come directly from that 1779 seal."
  - "The earliest known printed use of the coat of arms is on a $5 banknote issued by the Vermont State Bank in 1807. One of those notes is preserved in the special collections of the Vermont History Center in Barre. Before that note was discovered, historians had placed the earliest record at an 1821 military commission."
  - "In 1821, Robert Temple, Secretary of the Governor and Council, added the stag's head as the crest. He designed the image for military commissions issued by Governor Skinner to officers of the state militia. The pine branches appeared in the Revised Statutes of 1840 and are said to represent the pine sprigs worn by Vermont soldiers at the Battle of Plattsburgh in 1814."
  - "In 1862, Professor George W. Benedict wrote a formal description of the arms using quasi-heraldic terminology. The Vermont Legislature adopted this description as Act No. 11 of 1862, making it the first time the coat of arms had legal standing under state law."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Vermont Coat of Arms
  paragraphs:
  - "The coat of arms places all its major symbols within or immediately around a landscape shield. Each element was present in some form by 1840 and all were codified together in the 1862 statute."
  elements:
  - id: pine_tree
    name: Pine Tree
    image: /images/coats-of-arms/vermont/elements/pine-tree.webp
    paragraphs:
    - "A pine tree rises from near the base of the shield to nearly its top, occupying the center of the landscape. Sources describe it as representing Vermont's forests. The pine tree was part of Ira Allen's original 1779 Great Seal design and has remained the visual anchor of the coat of arms through every version since."
  - id: three_sheaves
    name: Three Wheat Sheaves
    image: /images/coats-of-arms/vermont/elements/sheaves.webp
    paragraphs:
    - "Three upright wheat sheaves, yellow in color, are arranged diagonally on the right side of the shield. Sources describe them as representing the agricultural work of Vermont farmers, specifically the cultivation of crops. They stand in contrast to the red cow on the opposite side, together showing the two sides of Vermont's farm economy."
  - id: red_cow
    name: Red Cow
    image: /images/coats-of-arms/vermont/elements/cow.webp
    paragraphs:
    - "A red cow stands on the left side of the shield. Sources describe it as representing the animal side of Vermont's agriculture, particularly dairy farming and cattle. Vermont was already known as a dairy state before the coat of arms was formalized in 1862, and the cow remained on the design through every version."
  - id: stags_head
    name: Stag's Head
    image: /images/coats-of-arms/vermont/elements/stags-head.webp
    paragraphs:
    - "A stag's head of natural color sits atop the shield as the crest, placed on a blue and yellow scroll. Robert Temple added it in 1821 when designing military commissions for officers under Governor Skinner. It was not part of Ira Allen's original 1779 design."
  - id: pine_branches
    name: Crossed Pine Branches
    image: /images/coats-of-arms/vermont/elements/pine-branches.webp
    paragraphs:
    - "Two pine branches of natural color cross between the shield and the motto scroll below it. This element is called the Vermonter's Badge. Sources say it represents the pine sprigs that Vermont soldiers wore at the Battle of Plattsburgh in October 1814, where American forces repelled a British invasion along Lake Champlain."
    - "The pine branches appeared in the Revised Statutes of 1840, more than two decades before the 1862 formal adoption. Their connection to the Battle of Plattsburgh gives the coat of arms a specific military reference that the other elements do not carry."
  - id: motto
    name: Motto Scroll
    image: /images/coats-of-arms/vermont/elements/motto.webp
    paragraphs:
    - "A scroll below the pine branches displays the motto: Vermont; Freedom and Unity. Freedom and Unity is Vermont's official state motto. The scroll places the state's name above the motto phrase, giving the full wording as it appears in the 1862 statute."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Vermont Coat of Arms
  paragraphs:
  - "The landscape shield does something unusual: it shows what Vermont looks like rather than using abstract heraldic symbols. Mountains, a sky, a tree, a farm animal, and harvested grain together create a picture of the state rather than a geometric diagram of its history."
  - "The pine branches below the shield are the one element that points directly to a single historical event. They connect the coat of arms to the Battle of Plattsburgh and to the Vermont soldiers who fought there, giving the design a specific human reference alongside the agricultural scene above."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Vermont Coat of Arms Facts
  facts:
  - "Adopted: Act No. 11 of 1862. The formal description was written by Professor George W. Benedict using quasi-heraldic terminology."
  - "The original design elements trace to 1779, when Ira Allen designed the Great Seal of Vermont, 12 years before Vermont became a U.S. state."
  - "The earliest known use of the coat of arms is on a $5 banknote of the Vermont State Bank from 1807. That note is held in the Vermont History Center in Barre."
  - "The stag's head crest was not in the 1779 original. Robert Temple added it in 1821 for military commissions issued by Governor Skinner."
  - "The crossed pine branches represent pine sprigs worn by Vermont soldiers at the Battle of Plattsburgh in October 1814, when American forces stopped a British invasion along Lake Champlain."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Vermont Coat of Arms
  paragraphs:
  - "The elements of the Vermont arms appeared in various forms over decades before the 1862 formal adoption. The landscape came from Ira Allen's 1779 seal design, the stag's head entered in 1821, and the pine branches were in use by 1840."
  - "What survives visually are later historical renderings that show how those pieces were combined before and after the 1862 statute. These images document the evolution of the same basic composition rather than complete redesigns."
  versions:
  - name: Historical Arms Drawing
    years: 1852
    image: /images/coats-of-arms/vermont/versions/historical-1852.jpg
    description: An 1852 drawing of the arms for the ceiling of the Hall of Representatives, based on an impression of the seal. It shows the stag's head, landscape shield, motto scroll, and surrounding ornaments in mid-nineteenth-century use before the 1862 statute.
  - name: Illustrated State Arms
    years: 1876
    image: /images/coats-of-arms/vermont/versions/illustrated-1876.jpg
    description: The Vermont arms as illustrated in Henry Mitchell's 1876 State Arms of the Union. This printed color rendering shows the legally established arms after the 1862 adoption and became one of the best-known nineteenth-century depictions.
  - name: Official Standard (Act No. 11, 1862)
    years: 1862-present
    image: /images/coats-of-arms/vermont/versions/current-standard.svg
    description: The legally adopted coat of arms codified under Act No. 11 of 1862. Professor George W. Benedict wrote the formal description that combined all elements previously scattered across different unofficial renderings. This remains the official standard today.

faq:
- question: What does the Vermont coat of arms show?
  answer: "The Vermont coat of arms shows a landscape shield with a tall pine tree at the center, three yellow wheat sheaves on the right, and a red cow on the left, all set against blue mountains and a yellow sky. Above the shield is a stag's head crest. Below it, two crossed pine branches form the Vermonter's Badge, and a scroll beneath reads Vermont; Freedom and Unity."
- question: What does the pine tree mean on the Vermont coat of arms?
  answer: "Sources describe the pine tree as representing Vermont's forests. It was part of Ira Allen's original 1779 Great Seal design and has remained the central visual element of the coat of arms through every version since."
- question: What do the pine branches mean on the Vermont coat of arms?
  answer: "The two crossed pine branches, called the Vermonter's Badge, represent the pine sprigs worn by Vermont soldiers at the Battle of Plattsburgh in October 1814. That battle was an American victory over a British invasion along Lake Champlain. The branches appeared in the Revised Statutes of 1840."
- question: When was the Vermont coat of arms adopted?
  answer: "The Vermont coat of arms was formally adopted in 1862 under Act No. 11 of the Vermont Legislature. However, the design elements had been in use since 1779, and the coat of arms appeared on printed documents at least as early as 1807."
- question: Who designed the Vermont coat of arms?
  answer: "The original design came from Ira Allen, who created Vermont's Great Seal in 1779. The stag's head crest was added in 1821 by Robert Temple. In 1862, Professor George W. Benedict wrote the formal legal description that brought all elements together."
- question: What is the Vermont coat of arms motto?
  answer: "The motto scroll reads: Vermont; Freedom and Unity. Freedom and Unity is Vermont's official state motto. The scroll places the state name above the motto phrase, exactly as the 1862 statute describes."

