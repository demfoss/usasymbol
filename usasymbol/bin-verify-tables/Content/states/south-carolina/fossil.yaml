- id: facts
  icon: fa-solid fa-lightbulb
  title: Columbian Mammoth Facts
  facts:
  - "South Carolina designated the Columbian mammoth as its state fossil in 2014, after a campaign led by South Carolina schoolchildren."
  - "Mammuthus columbi stood up to 14 feet at the shoulder, making it one of the largest land mammals ever to live in North America."
  - "Its spiraling tusks could reach 16 feet in length — longer than those of any living elephant."
  - "The Columbian mammoth lived in warmer, unglaciated regions and was less hairy than the woolly mammoth."
  - "During the Ice Age, South Carolina's coastline was roughly 50 to 75 miles farther east than today, giving mammoths far more coastal plain to roam — and explaining why fossils now wash up in rivers that once ran through dry grassland."

