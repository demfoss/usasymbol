faq:
- question: What is South Carolina's state fossil?
  answer: "South Carolina's state fossil is the Columbian mammoth, Mammuthus columbi. It was designated by the South Carolina General Assembly in 2014."
- question: When did South Carolina adopt its state fossil?
  answer: "South Carolina adopted the Columbian mammoth as its state fossil in 2014. Governor Nikki Haley signed the bill after a campaign led by South Carolina schoolchildren."
- question: What did the Columbian mammoth look like?
  answer: "The Columbian mammoth stood up to 14 feet tall at the shoulder and weighed up to 10 tons. It had large, spiraling tusks up to 16 feet long and was less shaggy than the woolly mammoth, adapted to warmer grassland climates."
- question: Where are Columbian mammoth fossils found in South Carolina?
  answer: "Fossils are found along rivers throughout the coastal plain, especially the Edisto River in Colleton County and the Waccamaw River in Horry County. Offshore dredging has also recovered bones from areas that were dry land during the Ice Age."
- question: When did the Columbian mammoth live?
  answer: "Mammuthus columbi lived during the Late Pleistocene and went extinct about 12,000 years ago at the end of the last Ice Age."
- question: Who pushed to make the Columbian mammoth South Carolina's state fossil?
  answer: "South Carolina schoolchildren led the effort, petitioning the General Assembly to recognize the Columbian mammoth. The bill passed and was signed into law in 2014."

