- id: facts
  icon: fa-solid fa-lightbulb
  title: American Mastodon Facts
  facts:
  - "Indiana adopted the American mastodon as its state fossil in 2022, after students at Randolph Southern Elementary School in Winchester led the campaign."
  - "Over 300 mastodon finds have been recorded in Indiana, one of the highest counts of any state in North America."
  - "The Megenity Mastodon, found in Harrison County in 1960, is one of the most complete mastodon skeletons in the Midwest and is on display at the Indiana State Museum."
  - "Mastodon means 'nipple tooth' in Greek, a reference to the low, rounded cusps on its molars that distinguished it from the ridged teeth of mammoths."
  - "The American mastodon went extinct roughly 10,000 to 11,000 years ago, at the same time early humans first arrived in Indiana."

