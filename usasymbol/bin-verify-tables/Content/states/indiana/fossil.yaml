faq:
- question: What is Indiana's state fossil?
  answer: "Indiana's state fossil is the American mastodon (Mammut americanum), an extinct elephant relative that lived in North America through the end of the last Ice Age. The Indiana General Assembly designated it in 2022."
- question: When did Indiana adopt its state fossil?
  answer: "Indiana adopted the American mastodon as its state fossil in 2022, after students from Randolph Southern Elementary School in Winchester campaigned for the designation."
- question: What did the American mastodon look like?
  answer: "The American mastodon stood about 8 to 10 feet tall at the shoulder and weighed up to 8 tons. It had long tusks up to 8 feet long, a thick brown coat, and low-cusped molars suited for browsing woody plants rather than grazing grass."
- question: Where are American mastodon fossils found in Indiana?
  answer: "Mastodon bones have been found in nearly every county in Indiana. The Megenity Mastodon, one of the most complete specimens in the Midwest, was found in Harrison County and is on display at the Indiana State Museum. Northern Indiana counties like Lagrange and Whitley have the highest concentration of finds."
- question: When did the American mastodon live?
  answer: "Mammut americanum lived from about 3.75 million years ago to roughly 10,000 to 11,000 years ago, spanning the Pliocene through the end of the Pleistocene and into the very early Holocene."
- question: Who pushed to make the mastodon Indiana's state fossil?
  answer: "Students at Randolph Southern Elementary School in Winchester, Indiana started the campaign around 2021. They chose the mastodon, gathered support, and testified before the Indiana General Assembly, which passed the designation in 2022."

