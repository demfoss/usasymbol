faq:
- question: What is Ohio's state fossil fish?
  answer: "Ohio's state fossil fish is Dunkleosteus terrelli, a massive armored predator up to 20 feet long from the Late Devonian period, about 380 to 360 million years ago, designated in 2021."
- question: When did Ohio adopt its state fossil fish?
  answer: "Ohio designated Dunkleosteus terrelli as its official state fossil fish in 2021."
- question: What did Dunkleosteus look like?
  answer: "Dunkleosteus had thick bony armor covering its head and shoulders, no teeth — just sharp bony shearing plates — and a heavily built body up to 20 feet long. The unarmored rear half of the body is rarely preserved in fossils."
- question: Where are Dunkleosteus fossils found in Ohio?
  answer: "Fossils are found in the Cleveland Shale of northeastern Ohio, particularly along the Rocky River, Cuyahoga River, and road cuts in Cuyahoga and Lorain counties. The Cleveland Museum of Natural History has the world's best Dunkleosteus collection."
- question: When did Dunkleosteus live?
  answer: "Dunkleosteus terrelli lived during the Late Devonian period, about 380 to 360 million years ago, and went extinct in the Late Devonian mass extinction about 360 million years ago."
- question: Who discovered Dunkleosteus in Ohio?
  answer: "Jay Terrell found the first specimen near Lorain, Ohio in 1867. The genus was later named for David Dunkle, a paleontologist at the Cleveland Museum of Natural History who studied the species in the mid-20th century."

