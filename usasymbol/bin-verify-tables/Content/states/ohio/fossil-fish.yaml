- id: facts
  icon: fa-solid fa-lightbulb
  title: Dunkleosteus Facts
  facts:
  - "Ohio designated Dunkleosteus terrelli as its state fossil fish in 2021, joining Isotelus maximus as the state's second official state fossil."
  - "Dunkleosteus had no teeth — it used two pairs of bony shearing plates that worked like scissors to cut through prey and armor."
  - "The first specimen was found near Lorain, Ohio in 1867 by Jay Terrell; the genus was named for Cleveland Museum paleontologist David Dunkle."
  - "The Cleveland Shale of northeastern Ohio has produced more Dunkleosteus skulls than any other site in the world."
  - "Dunkleosteus went extinct about 360 million years ago in the Late Devonian mass extinction, which wiped out roughly 75 percent of all species on Earth."

