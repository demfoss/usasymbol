sections:
- id: history
  icon: fa-solid fa-landmark
  title: Louisiana State Seal History and Origin
  paragraphs:
  - "Louisiana became the 18th state on April 30, 1812, and the pelican was chosen as the central image of the first state seal at statehood. The choice drew on a symbol already present in the territory's colonial and Catholic heritage. French and Spanish colonial administrators had both used pelican imagery in the region, and the pelican as a Christian symbol of self-sacrifice was familiar across Louisiana's heavily Catholic population."
  - 'The motto Union, Justice and Confidence was adopted with the seal. The three words reflected the political priorities of a new state that had belonged to France, then Spain, then France again before the Louisiana Purchase of 1803 brought it into the American orbit, only nine years before statehood.'
  - "The pelican design has been revised and standardized since 1812, but the core image has never changed. The mother pelican feeding her young in the nest has remained the center of Louisiana's official emblems through every revision."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Louisiana State Seal Symbols Mean
  paragraphs:
  - 'The Great Seal of Louisiana builds its symbolism around a single central heraldic image and a motto, making it among the more focused designs in American state heraldry.'
  elements:
  - id: pelican-in-piety
    name: Pelican in Her Piety
    image: /images/state-seals/louisiana/elements/pelican.webp
    paragraphs:
    - 'The central image is a mother pelican in a nest, wings partly spread, piercing her own breast with her beak. Three young pelicans in the nest below receive the blood she draws. This heraldic pose is formally called "a pelican in her piety" or "a pelican vulning herself," vulning being the heraldic term for a bird wounding its own breast.'
    - "The image belongs to a tradition stretching back to medieval Christian art. It appears in illuminated manuscripts, the arms of colleges and religious orders, and Catholic church decoration across Europe. Louisiana's founders drew on a symbol already embedded in the territory's colonial institutions to connect the new state to values of sacrifice and parental devotion."
  - id: motto
    name: Union, Justice and Confidence
    image: /images/state-seals/louisiana/elements/motto.webp
    paragraphs:
    - "The motto Union, Justice and Confidence appears on the seal and has been part of Louisiana's official symbolism since statehood in 1812. The three words name civic ideals rather than geography or natural history, making Louisiana's motto more abstract than those of many neighboring states."
    - "The wording reflects the circumstances of Louisiana's admission. A territory with French, Spanish, Creole, and American populations entering a young republic needed a motto that emphasized cohesion and shared purpose over any particular heritage."
  - id: nestlings
    name: Three Young Pelicans
    image: /images/state-seals/louisiana/elements/nestlings.webp
    paragraphs:
    - "Three young pelicans receive their mother's blood in the nest below her. Their number follows the classical depiction of the pelican in her piety, in which three nestlings represent the young saved by the mother's sacrifice."
    - 'The three chicks are a consistent feature across versions of the Louisiana seal. Their presence grounds the heraldic symbolism in a scene of parental devotion rather than a purely abstract emblem.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Louisiana State Seal'
  paragraphs:
  - "Louisiana's state seal has been revised and standardized multiple times since 1812. The core design, the pelican in her piety with the motto Union, Justice and Confidence, has remained constant through every revision. Changes over time have addressed the rendering of the pelican figure, the proportions of the nest and nestlings, and the border text around the circular design."

