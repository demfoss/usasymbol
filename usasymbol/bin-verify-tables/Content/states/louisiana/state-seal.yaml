type: State Seal
state: Louisiana
name: Great Seal of Louisiana
adopted_year: 1812
is_official: true
legislation: Louisiana Revised Statutes § 49:151
meaning: "The Great Seal of Louisiana centers on a pelican in her piety, a mother bird piercing her own breast to feed three nestlings with her blood. Louisiana adopted this image at statehood in 1812, connecting the new state to a symbol of sacrifice already embedded in the region's French and Spanish Catholic colonial heritage. The motto Union, Justice and Confidence has appeared on the seal since the beginning."
author: USA Symbol Team
date_published: '2026-05-09'
