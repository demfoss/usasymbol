hero_image_caption: The Great Seal of Louisiana, featuring the pelican in her piety at center. The mother pelican pierces her breast to feed three young in the nest below her.
intro_text: "Louisiana's state seal shows a pelican in her piety: a mother pelican piercing her own breast to feed three young with her blood, alongside the motto Union, Justice and Confidence. Louisiana adopted this image at statehood in 1812, and the pelican has remained the defining emblem of the seal, the state flag, and the nickname \"Pelican State\" ever since. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
