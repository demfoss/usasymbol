faq:
- question: What is Louisiana's state soil?
  answer: "Louisiana's state soil is the Ruston series, a deep red loamy soil found on the rolling uplands of north and central Louisiana. It is named for Ruston, the seat of Lincoln Parish, where the series was first formally described by USDA soil scientists."
- question: Why is Ruston soil red?
  answer: "The red color comes from hematite — an iron oxide mineral that forms when other minerals dissolve away under warm, wet conditions. North Louisiana gets heavy rainfall and stays warm year-round. Over millions of years, that climate leached out calcium, magnesium, and most other soluble minerals, leaving iron concentrated in the subsoil as hematite. The same process makes soils red across the entire Gulf South."
- question: What is an Ultisol?
  answer: "An Ultisol is a heavily leached soil that forms in warm, humid climates. The name comes from the Latin ultimus, meaning last, because these soils are at an advanced stage of weathering — most of the easily dissolved minerals are gone. Ultisols are common across the southeastern United States, where warm temperatures and high rainfall drive intense long-term leaching. Ruston is an Ultisol; Kentucky's Crider is an Alfisol; Iowa's Tama is a Mollisol — each reflects a different climate and weathering history."
- question: What grows in Ruston soil?
  answer: "Longleaf pine, loblolly pine, and slash pine are the dominant plants on Ruston soil, covering millions of acres of managed timber land in north Louisiana. Sweet potatoes are the most distinctive crop — Louisiana is among the leading sweet potato producers in the United States, and the Ruston series provides the deep, loose, well-drained profile the crop needs. Cotton historically dominated, and corn and soybeans are grown on Ruston soil today."
- question: Where is Ruston soil found in Louisiana?
  answer: "Ruston soil is found on the rolling uplands of north and central Louisiana, primarily in Lincoln, Claiborne, Union, Bienville, Jackson, Winn, Natchitoches, and surrounding parishes. It sits on old Coastal Plain uplands that rise above the river floodplains and marshes of south Louisiana."
- question: How is Ruston soil different from south Louisiana soils?
  answer: "Ruston is an old, leached, red upland soil formed over millions of years on stable high ground in north Louisiana. South Louisiana soils are geologically young — they were deposited by the Mississippi River and the Gulf of Mexico within the last few thousand years. They are dark, organic-rich alluvial silts and marsh peats, not red clay. Ruston and the Mississippi delta soils are among the most geologically different soils in the same state."
- question: Why is the surface of Ruston soil paler than the subsoil?
  answer: "The surface layers of Ruston soil are sandy and relatively pale because water has been washing minerals downward for a very long time. Just below the surface is an eluvial layer — a bleached zone where iron and clay have been leached out and moved deeper. Below that, those same iron compounds accumulated, turning the subsoil bright reddish yellow and then deep red. The dramatic color change from pale surface to vivid subsoil is one of the most recognizable features of Gulf South Ultisols."

