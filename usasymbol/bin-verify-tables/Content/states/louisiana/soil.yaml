  - Red River
  - Webster
  - Bossier

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Ruston Soil
  paragraphs:
  - "Longleaf pine and loblolly pine are the dominant plants on Ruston soil today, covering millions of acres of north Louisiana uplands in managed timber production. The deep, well-drained profile suits pine well — roots reach deep into the red clay subsoil, and the sandy surface layer dries quickly enough to prevent root rot. North Louisiana's timber industry is one of the most productive in the South, and Ruston soil underlies most of it."
  - "Sweet potatoes are the crop most associated with Ruston soil in Louisiana. The state is among the leading sweet potato producers in the United States, and north Louisiana — particularly Beauregard, Evangeline, and neighboring parishes where similar soils occur — grows most of that crop. Sweet potatoes need deep, loose, well-drained soil to develop without cracking or rotting. Ruston's sandy surface and deep profile provide exactly those conditions."
  - "Cotton was the defining crop of north Louisiana for most of the nineteenth and early twentieth centuries, and Ruston soil supported most of it. As cotton declined, farmers shifted to timber, soybeans, corn, and hay. The red clay subsoil holds enough water to carry row crops through short dry spells, which is important in a climate where summer rainfall is inconsistent."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Ruston Soil Facts
  facts:
  - "The Ruston series is named for Ruston, Louisiana, the seat of Lincoln Parish and home of Louisiana Tech University, where the soil was first formally studied and described by USDA soil scientists."
  - "Ruston is an Ultisol — the soil order defined by intensive, long-term leaching in warm, humid climates. The name comes from the Latin ultimus, meaning last, because these soils represent an advanced stage of weathering."
  - "The red color in the subsoil comes from hematite, an iron oxide mineral that forms under the warm, wet conditions of the Gulf South when other minerals dissolve away and iron concentrates in place."
  - "Louisiana uses parishes instead of counties — Ruston soil is most extensive in Lincoln, Claiborne, Union, and Bienville parishes in the north-central part of the state."
  - "The Ruston series belongs to the same family of red Coastal Plain Ultisols as Alabama's Bama series and North Carolina's Cecil series — soils that share a similar origin in ancient marine sediments leached by millions of years of warm, humid weathering."
  - "Sweet potatoes grow best in deep, well-drained, sandy or loamy soils. The Ruston series — with its fine sandy loam surface and deep red clay subsoil — provides enough drainage to prevent rot and enough depth for roots to develop without splitting."

