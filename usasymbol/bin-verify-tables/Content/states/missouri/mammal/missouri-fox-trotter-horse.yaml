title: "Missouri State Horse | Missouri Fox Trotting Horse"
scientific_name: "Equus caballus"
adopted_year: 2002

seo_title: "Missouri State Horse | Missouri Fox Trotting Horse"
seo_description: "Missouri's state horse is the Missouri Fox Trotting Horse, adopted in 2002. Learn why this official Missouri symbol was chosen and what it represents."

intro_text: "The Missouri Fox Trotting Horse is the official Missouri state horse, designated in 2002. This page gives the direct answer for searches like 'missouri state horse', 'missouri state animal', and 'missouri state mammal' while explaining how the symbol fits the state's official animal designations. Unique fox trot gait providing smooth ride; nicknamed 'The Cowboy's Cadillac'; developed entirely in Missouri Ozarks; ideal for trail riding and ranch work in rough terrain. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Missouri Fox Trotter"
official_since: "2002"
status: "Thriving; over 100,000 registered since 1948; found in all 50 states and internationally"
habitat_in_state: "Concentrated in Ozark region where breed originated; MFTHBA headquarters in Ava, Missouri; found statewide on ranches and recreational facilities"
known_for: "Unique fox trot gait providing smooth ride; nicknamed 'The Cowboy's Cadillac'; developed entirely in Missouri Ozarks; ideal for trail riding and ranch work in rough terrain"

size: "14 to 16 hands (56-64 inches at shoulder); ponies 11-14 hands"
weight: "900 to 1,200 pounds"
coloration: "All solid colors and pinto patterns; common: bay, chestnut, black, palomino, buckskin; white facial and leg markings frequent"
distinctive_traits: "Straight facial profile; medium-length neck; pronounced withers; short, strong back; muscular sloped shoulders; sturdy legs; performs three natural gaits without special training; some individuals have curly coats"

habitat: "Ozark Mountains and surrounding regions; adaptable to various climates and terrains"
