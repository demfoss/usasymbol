faq:
  - question: "What is Missouri's state horse?"
    answer: "Missouri's state horse is the Missouri Fox Trotting Horse, designated in 2002. The breed developed entirely in Missouri's Ozark Mountains during the early 1800s and is known for its unique fox trot gait."

  - question: "When was the Missouri Fox Trotter designated as state horse?"
    answer: "The Missouri Legislature designated the Missouri Fox Trotting Horse as the official state horse in 2002, recognizing a breed developed within state borders and preserved by the Missouri Fox Trotting Horse Breed Association since 1948."

  - question: "What is the fox trot gait?"
    answer: "The fox trot is a four-beat broken diagonal gait where the horse walks with its front feet and trots with its hind feet. The front foot of each diagonal pair lands before the opposite hind foot, eliminating the bouncing of a regular trot. This creates exceptional smoothness and stability, allowing riders to comfortably cover 5-8 miles per hour for extended distances over rough terrain."

  - question: "Where did the Missouri Fox Trotter originate?"
    answer: "The Missouri Fox Trotter developed in the Ozark Mountains of southern Missouri. Settlers arriving from Tennessee, Kentucky, and Virginia after 1821 brought various horse breeds and selectively bred for animals with smooth gaits suited to rocky, forested terrain. By Missouri's statehood in 1821, horses in the region were already recognized for the unique gait that would define the breed."

  - question: "Why is the Missouri Fox Trotter called 'The Cowboy's Cadillac'?"
    answer: "The nickname 'The Cowboy's Cadillac' reflects ranchers' appreciation for a horse combining working ability with superior ride comfort. Like a Cadillac automobile offered luxury without sacrificing utility, the Fox Trotter provided smooth travel while maintaining the strength, endurance, and cattle sense required for ranch work."

  - question: "How many Missouri Fox Trotters exist?"
    answer: "The Missouri Fox Trotting Horse Breed Association has registered over 104,000 horses since its founding in 1948, with approximately 8,000 current members worldwide. Fox Trotters are found in all 50 U.S. states, Canada, and Europe. Germany alone hosts around 350 registered Fox Trotters."

  - question: "Can anyone ride a Missouri Fox Trotter?"
    answer: "Yes, Missouri Fox Trotters are particularly suitable for riders of all skill levels. Their gentle temperament, willingness to please, and smooth gaits make them ideal for beginners, children, and therapeutic riding programs. The breed's sure-footedness and calm disposition provide safety for inexperienced riders, while the smooth fox trot gait eliminates the bouncing that causes fatigue and discomfort."

  - question: "Where can I see Missouri Fox Trotters?"
    answer: "The Missouri Fox Trotter World Show and Celebration held annually in Ava, Missouri (first full week of September) is the premier event, featuring over 130 competition classes. The MFTHBA headquarters and Hall of Fame in Ava offers tours year-round. Numerous trail riding facilities throughout the Ozarks provide opportunities to ride Fox Trotters and experience their smooth gait firsthand."

  - question: "What colors do Missouri Fox Trotters come in?"
    answer: "Missouri Fox Trotters can be any solid color or pinto pattern. Common colors include bay, chestnut, black, palomino, buckskin, gray, and roan. White facial and leg markings are frequent. Some Fox Trotters have curly coats (rare), making them suitable for people with horse allergies. The breed standard accepts all colors, focusing on gait and conformation rather than color restrictions."

