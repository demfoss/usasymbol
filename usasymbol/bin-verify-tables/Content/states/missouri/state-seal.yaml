timeline:
- year: '1820'
  description: Missouri adopts its first state constitution. The motto "Salus populi suprema lex esto," taken from Cicero's De Legibus, is written into the constitution. The Missouri Compromise passes in Congress, admitting Missouri as a slave state and Maine as a free state to preserve the Senate balance.
- year: '1821'
  description: Missouri is admitted to the Union as the 24th state on August 10. The 24 stars on the future seal record this moment.
- year: '1822'
  description: The Missouri General Assembly authorizes the Great Seal of Missouri. The design pairs the coat of arms of the United States with Missouri's own bear-and-crescent arms, supported by two grizzly bears, with the Cicero motto in the outer ring.

faq:
- question: What does the Missouri state seal show?
  answer: Missouri's state seal features two grizzly bears holding a divided shield, with the U.S. coat of arms on one half and a grizzly bear and crescent on the other. Around the outer ring are 24 stars, the Latin motto "Salus populi suprema lex esto," and the phrase "United We Stand, Divided We Fall" on a scroll at the base. The Roman numeral MDCCCXX (1820) also appears.
- question: What does the Missouri state seal mean?
  answer: The seal presents Missouri as a state bound to the Union. The divided shield joins U.S. and Missouri arms, while the grizzly bears reflect Missouri's frontier identity as "The Bear State." The Cicero motto and the "United We Stand" ribbon record the constitutional philosophy of the founding era and the political stakes of the Missouri Compromise period.
- question: Why does Missouri's seal have three grizzly bears?
  answer: Two bears stand as supporters on either side of the shield; a third appears inside the shield as the central figure of Missouri's own heraldic arms. Bears were closely tied to Missouri's early identity; the state was called "The Bear State" in its first decades. Together the three bears represent strength and the frontier character of the westernmost state in the Union at the time.
- question: What is the motto on Missouri's state seal?
  answer: The motto is "Salus populi suprema lex esto," Latin for "Let the welfare of the people be the supreme law." It is a direct quotation from Cicero's De Legibus, written around 52 BCE, and was incorporated into Missouri's 1820 constitution before it appeared on the seal. Missouri is the only state with an official motto taken directly from Cicero.
- question: What do the 24 stars on Missouri's seal mean?
  answer: The 24 stars represent the number of states in the Union when Missouri was admitted on August 10, 1821, as the 24th state. They function as a timestamp in the design, recording the exact size of the Union at the moment Missouri joined.
- question: When was the Missouri state seal adopted?
  answer: The Great Seal of Missouri was authorized by the General Assembly in 1822, one year after Missouri entered the Union on August 10, 1821. The design references Missouri's 1820 constitution through the Roman numeral MDCCCXX and the state motto, which had already been written into that document.
- question: What does MDCCCXX mean on Missouri's seal?
  answer: MDCCCXX is the Roman numeral for 1820, the year Missouri adopted its first state constitution. The designers chose the constitutional year rather than the year of admission (1821) or the year the seal was authorized (1822), treating the founding document as the origin point of the state's identity.

