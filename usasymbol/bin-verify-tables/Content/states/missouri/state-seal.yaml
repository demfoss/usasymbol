legislation: Missouri Revised Statutes § 10.020
meaning: "The Great Seal of Missouri pairs the coat of arms of the United States with Missouri's own bear-and-crescent emblem on a single divided shield, making an argument about the relationship between state and nation. The two grizzly bears supporting the shield, the 24 stars marking Missouri's place as the 24th state, and the Latin motto from Cicero together record who Missouri was, what it believed, and when it was founded."
