intro_text: "Missouri's state seal divides its central shield between the coat of arms of the United States and Missouri's own grizzly bear and crescent. Two large bears support the shield on either side, 24 stars mark Missouri's admission as the 24th state in 1821, and the Latin motto from Cicero, Salus populi suprema lex esto, runs along the outer ring. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
