faq:
- question: What does the C on Colorado's flag stand for?
  answer: "The red C stands for three things simultaneously: Colorado (from the Spanish word for reddish or ruddy), centennial (Colorado entered the Union in 1876 during America's centennial year), and columbine (the state flower). The C is red because Colorado itself is named for a color."
- question: Who designed Colorado's state flag?
  answer: Andrew Carlisle Carson designed Colorado's state flag in 1911. His design was selected after the Denver chapter of the Daughters of the American Revolution held a contest — not knowing Colorado already had an official flag from 1907.
- question: Why did Colorado get a new flag in 1911 if it already had one from 1907?
  answer: The 1907 flag was made once and stored in the State Capitol without ever being publicly displayed. When the DAR organized a flag contest in 1910, they were unaware the 1907 design existed. Carson's 1911 design replaced a flag that had never been used.
- question: What do the colors on Colorado's flag mean?
  answer: Blue represents the sky and matches Old Glory Blue from the U.S. flag. White represents the Rocky Mountains and silver mining. Red on the C represents the ruddy landscape and the meaning of the name Colorado. Gold represents sunshine and the gold mining industry. Blue, white, and red are defined by law; gold is not.
- question: When was Colorado's flag officially standardized?
  answer: Color specifications were added in 1929 to match U.S. flag colors. Final proportions — the exact size and position of the C and gold disk — were not set until March 31, 1964, fifty-three years after the flag was adopted.
