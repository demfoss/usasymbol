  title: Quick Facts
  facts:
  - "Colorado's 1907 flag: one copy made, never flown, stored in the Capitol — forgotten for four years"
  - The DAR launched a new flag contest in 1910 without knowing the 1907 flag existed
  - 'Designer: Andrew Carlisle Carson'
  - 'Adopted: June 5, 1911'
  - 'C stands for Colorado (Spanish: reddish), Centennial (1876), and Columbine (state flower)'
