sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Colorado State Sport
    paragraphs:
      - "Colorado named skiing and snowboarding its official state winter sport on April 8, 2008, pairing two activities under one designation instead of choosing between them. The decision reflected an industry, not just a pastime: more people ski and snowboard in Colorado each winter than in any other U.S. state. The winter sport designation stands alongside pack burro racing, Colorado's summer heritage sport, giving the state one official sport for each half of the year."

  - id: what-is
    icon: fa-solid fa-person-skiing
    title: "Skiing and Snowboarding in Colorado"
    paragraphs:
      - "A skier or snowboarder rides a chairlift or gondola to the top of a run, then descends on packed snow, groomed trails, or ungroomed backcountry terrain. Colorado's resorts spread across more than two dozen mountains, from beginner slopes at Winter Park to steep bowls at places like Vail and Crested Butte. Snow typically covers the high country from November into April, giving the state one of the longest ski seasons in the country."
      - "Aspen's Buttermilk Mountain hosts the ESPN Winter X Games, built around a 22-foot superpipe and terrain park that regularly draws Olympic-level snowboarders and skiers. Vail and Breckenridge rank among the most visited resorts in North America, and Colorado's ski areas together record more skier and snowboarder visits each season than any other state's."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Skiing and Snowboarding Represent Colorado
    paragraphs:
      - "Colorado's high peaks and reliable snowfall made the sport possible long before it had an industry behind it. The Rocky Mountains hold more than 50 peaks above 14,000 feet, and many of Colorado's ski towns sit at elevations that keep snow on the ground for months at a time. That terrain is what drew the Army's 10th Mountain Division to train nearby at Camp Hale during World War II."
      - "After the war, 10th Mountain veterans turned their training ground into a ski economy. Larry Jump helped found Arapahoe Basin in 1946, Friedl Pfeifer helped open Aspen Mountain the same year, and Pete Seibert founded Vail in 1962. Veterans of the division went on to help build close to 60 ski areas across the country, many of them in Colorado."
      - "Snowboarding gave the designation a modern half. Colorado terrain parks, especially Buttermilk's Winter X Games course, became testing grounds for competitive snowboarding as the sport grew from a fringe activity into an Olympic event. Naming both sports together let the 2008 designation cover a ski culture built by war veterans and a snowboard culture built by a newer generation."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Skiing and Snowboarding Became Colorado's State Sport
    paragraphs:
      - "Colorado's legislature designated skiing and snowboarding the official state winter sport on April 8, 2008. The move came decades after skiing had already become central to the state's economy and identity, so the legislation formalized a status the sports already held rather than launching something new. Pairing the two sports under one title also reflected how closely they shared the same mountains, resorts, and terrain parks by the 2000s."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Skiing and Snowboarding Facts
    facts:
      - "Colorado designated skiing and snowboarding its official state winter sport on April 8, 2008."
      - "Colorado's ski industry has roots in the Army's 10th Mountain Division, which trained at Camp Hale during World War II."
      - "10th Mountain Division veterans helped found Arapahoe Basin, Aspen Mountain, and Vail."
      - "Aspen's Buttermilk Mountain hosts the ESPN Winter X Games in its terrain park."
      - "Colorado records more skier and snowboarder visits each winter than any other U.S. state."

