faq:
  - question: What is Colorado's state sport?
    answer: "Colorado's official state sport is skiing and snowboarding, designated the state winter sport in 2008."
  - question: When did Colorado adopt skiing and snowboarding as its state sport?
    answer: "Colorado adopted skiing and snowboarding as its state winter sport on April 8, 2008."
  - question: Why did Colorado choose skiing and snowboarding?
    answer: "Skiing was already central to Colorado's mountain economy, built in part by World War II veterans who trained at Camp Hale and later founded major resorts. Snowboarding grew alongside it in the same terrain parks."
  - question: What does the 10th Mountain Division have to do with Colorado skiing?
    answer: "Soldiers of the Army's 10th Mountain Division trained in Colorado's mountains at Camp Hale during World War II. Veterans of the division later helped found Arapahoe Basin, Aspen Mountain, and Vail."

