intro_text: "Colorado's state sport is skiing and snowboarding, designated the official state winter sport in 2008. Many of the mountains that built Colorado's ski industry were shaped by veterans of the Army's 10th Mountain Division, who trained nearby at Camp Hale and later founded some of the state's biggest resorts."

