sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Colorado State Sport
    paragraphs:
      - "Colorado designated pack burro racing its official state summer heritage sport in 2012, recognizing a race that had already run through the mountains for more than 60 years. The choice set Colorado apart from states that picked football or rodeo, tying its sport symbol to the mining camps of the Rocky Mountains instead. Unlike most other state sports, the honor came after a petition drive that started with elementary school students in Fairplay."

  - id: what-is
    icon: fa-solid fa-person-hiking
    title: "Pack Burro Racing Explained"
    paragraphs:
      - "A runner and a burro cover a mountain course together, the animal on a lead rope no longer than 15 feet. Riding is not allowed, so competitors run or hike alongside their burro for miles of steep, rocky trail, sometimes above 13,000 feet. Each burro also carries a pack saddle loaded with a pick, gold pan, and shovel, a nod to the mining gear burros once hauled for real."
      - "Colorado's Triple Crown of pack burro racing runs across three towns each summer: a 29-mile course in Fairplay, a 22-mile course in Leadville that climbs over Mosquito Pass, and a 12-mile course in Buena Vista. Together the three races cover about 63 miles and draw runners and spectators to each town's summer festival. Smaller races also take place in Idaho Springs and Georgetown."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Pack Burro Racing Represents Colorado
    paragraphs:
      - "Pack burro racing grew directly out of Colorado's silver and gold mining era. Miners in the Rockies used burros to haul tools and ore because the animals were sure-footed on steep trail, and prospectors led rather than rode them to save the burro's strength for cargo. Legend credits the sport's start to two miners who found gold at the same spot and raced each other, burros in tow, to file the claim first."
      - "The modern sport is closer to a community tradition than a spectator event. Fairplay, Leadville, and Buena Vista each build a summer festival around their race: Burro Days, Boom Days, and Gold Rush Days. Many participants run the entire Triple Crown in one season, and local ranchers often lend burros to competitors who do not own one."
      - "The gear requirement keeps the mining connection literal rather than symbolic. Racers no longer have to load a fixed 33 pounds onto their burro, but the pack saddle must still hold a pick, gold pan, and shovel. That detail separates pack burro racing from an ordinary trail run and is part of what convinced state lawmakers the sport was worth an official title."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Pack Burro Racing Became Colorado's State Sport
    paragraphs:
      - "The push for official recognition began in 2007, when students at Edith Teter Elementary School in Fairplay started a petition to make pack burro racing Colorado's state sport. The Colorado General Assembly took up the idea years later, and lawmakers approved the designation as a summer heritage sport in May 2012. The timing gave the sport formal recognition a few years shy of the 65th anniversary of that first Leadville-to-Fairplay race in 1949."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Pack Burro Racing Facts
    facts:
      - "Colorado designated pack burro racing its official state summer heritage sport in 2012."
      - "The campaign for the designation began in 2007 with a petition from elementary school students in Fairplay."
      - "The first organized race ran between Leadville and Fairplay in 1949."
      - "Colorado's Triple Crown of pack burro racing covers about 63 miles across races in Fairplay, Leadville, and Buena Vista."
      - "Burros must still carry a pick, gold pan, and shovel in their pack saddle, even though the old 33-pound weight rule has been dropped."

