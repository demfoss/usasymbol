faq:
  - question: What is Colorado's state sport?
    answer: "Colorado's official state sport is pack burro racing, designated a summer heritage sport in 2012."
  - question: When did Colorado adopt pack burro racing as its state sport?
    answer: "Colorado adopted pack burro racing in 2012, after a petition drive that began in 2007."
  - question: Why did Colorado choose pack burro racing?
    answer: "The sport traces directly to the mining era, when prospectors led rather than rode burros loaded with tools and ore. Colorado's own high-country race, running since 1949, made it a natural fit."
  - question: Who started the push to make pack burro racing official?
    answer: "Students at Edith Teter Elementary School in Fairplay started a petition drive in 2007, years before the state legislature made the designation official in 2012."

