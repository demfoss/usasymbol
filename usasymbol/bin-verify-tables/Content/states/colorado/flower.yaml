type: State Flower
state: Colorado
name: Rocky Mountain Columbine
scientific_name: Aquilegia coerulea
adopted_year: 1899
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-14"
seo_title: "Colorado State Flower | Rocky Mountain Columbine"
seo_description: "The Rocky Mountain columbine became Colorado's state flower in 1899. It grows naturally in high mountain meadows."

intro_text: "The Rocky Mountain Columbine represents Colorado's floral emblem, adopted in 1899. Featured in the [list of U.S. state flowers](/symbols/flowers), this delicate wildflower grows in mountain meadows and forests throughout the Rocky Mountains. White petals and lavender blue sepals make it easy to identify during its summer blooming season."

sections:
  - id: "what-is"
    icon: "fa-solid fa-seedling"
    title: "Official State Flower of Colorado"
    paragraphs:
      - "The Rocky Mountain Columbine holds the position of Colorado's official state flower. This native wildflower blooms from late June through August in mountain areas. Elevations between 6,000 and 11,000 feet provide ideal habitat. The plant reaches heights of 12 to 20 inches tall."
      - "Each flower displays five white petals surrounded by five lavender blue sepals. Long spurs extend backward from the petals. These spurs can grow up to 2 inches long. The blooms measure about 2 to 3 inches across when fully open. Hikers spot these flowers in aspen groves and along mountain streams near stands of the [Colorado state tree](/states/colorado/tree/colorado-blue-spruce). Partial shade creates perfect growing conditions."
      - "Moist soil provides necessary nutrients for this alpine wildflower. The plant produces fernlike leaves that remain green throughout the growing season. Rocky soil suits the columbine's root system. Cool mountain temperatures help it thrive where other flowers struggle to survive."

  - id: "name"
    icon: "fa-solid fa-tag"
    title: "About the Rocky Mountain Columbine"
    paragraphs:
      - "Known as Rocky Mountain Columbine, this flower's scientific designation is <i>Aquilegia coerulea</i>. The plant belongs to the buttercup family called Ranunculaceae. This family includes over 2,000 species of flowering plants worldwide."
      - "The word columbine comes from the Latin word columba. That means dove. Early botanists thought the flower's spurs looked like five doves gathered in a circle. The scientific name <i>coerulea</i> refers to the blue color of the sepals."
      - "Other common names include Colorado blue columbine and simply blue columbine. Gardeners and hikers most often use the Rocky Mountain name. Wild specimens growing at high elevations get called mountain columbine by some naturalists."

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "Why the Rocky Mountain Columbine Became the Colorado State Flower"
    paragraphs:
      - "Colorado adopted the Rocky Mountain Columbine in 1899 following a campaign by school children across the state. Teachers organized students to vote for their favorite wildflower. The columbine won this popular vote by a significant margin. Other native flowers received far fewer votes, similar to the school-led adoption history of the [official state bird](/states/colorado/bird/lark-bunting)."
      - "The legislature made it official on April 4, 1899. Colorado residents clearly loved this mountain flower. Native abundance played a major role in the selection. The columbine grew naturally throughout Colorado's mountains and represented the state's beautiful high country. Lawmakers wanted a flower that truly belonged to Colorado. They rejected flowers found in many other states."
      - "The campaign showed strong public support for protecting natural heritage. Women's clubs backed the choice enthusiastically. Garden societies also supported it. They believed the columbine's delicate beauty matched Colorado's mountain character. The legislature passed the designation quickly and demonstrated widespread agreement about the selection."

  - id: "facts"
    icon: "fa-solid fa-clipboard-list"
    title: "Colorado State Flower Facts"
    facts:
      - "Mountain meadows, aspen groves, and forest clearings provide natural habitat for the columbine between 6,000 and 11,000 feet elevation throughout the Rocky Mountains"
      - "Hummingbirds and long-tongued bees serve as primary pollinators, attracted by the deep flower spurs that hold nectar"
      - "Colorado law protects wild columbines under House Bill 1089 passed in 1925, allowing people to pick up to 25 blossoms on public land while digging up plants carries fines up to $50"
      - "Each flower produces five petals, five sepals, and five long spurs, with a single plant capable of producing 15 to 20 flowers during one blooming season"
      - "Wild Rocky Mountain Columbines prefer cooler temperatures and struggle to survive below 5,000 feet elevation where summer heat becomes too intense"
      - "Peak blooming happens in July across most of Colorado's mountains, with the state flower blooming for about six weeks during summer when snowmelt provides necessary moisture"

  - id: "flower-and-bird"
    icon: "fa-solid fa-dove"
    title: "Colorado State Flower and Bird"
    paragraphs:
      - "The Lark Bunting serves as Colorado's state bird, a small songbird with distinctive black and white plumage. Both symbols became official in different years. The columbine was adopted in 1899 while Colorado schoolchildren chose the lark bunting much later in 1931, and both are featured in the [state birds hub](/symbols/birds)."

  - id: "symbolism"
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Rocky Mountain Columbine is often associated with Colorado's mountain heritage and natural beauty. Its blue and white colors traditionally symbolize the state's clear skies and snow-capped peaks. Many Colorado residents consider the flower to reflect the rugged independence of the Rocky Mountain region and the identity of [The Centennial State](/states/colorado/nickname/the-centennial-state). Natural splendor defines its cultural meaning."
      - "The delicate appearance combined with hardy mountain survival carries connotations of hidden strength beneath beauty. Conservation groups frequently represent the columbine as a reminder to protect Colorado's native plants. Natural environments face ongoing threats from development and climate change, especially across interstate ecosystems shown in the [Colorado borders guide](/states/colorado/borders)."

faq:
  - question: "What is the Colorado state flower?"
    answer: "The Colorado state flower is the Rocky Mountain Columbine. This white and lavender blue wildflower grows naturally in mountain areas across the state."

  - question: "When was Colorado's state flower adopted?"
    answer: "Colorado made the Rocky Mountain Columbine its official state flower on April 4, 1899. School children voted for it in a statewide campaign organized by teachers."

  - question: "Where does the Rocky Mountain Columbine grow naturally?"
    answer: "This wildflower grows in mountain meadows, aspen groves, and forest clearings at elevations between 6,000 and 11,000 feet throughout the Rocky Mountains. It prefers partial shade and moist soil near mountain streams."

  - question: "Is the Rocky Mountain Columbine native to Colorado?"
    answer: "Yes, the Rocky Mountain Columbine is native to Colorado and grows naturally throughout the state's mountain regions. Nearby mountain states also have this flower including Wyoming, Utah, Arizona, and New Mexico."

  - question: "Why did Colorado choose the Rocky Mountain Columbine?"
    answer: "Colorado chose this flower because school children voted for it in a popular campaign. It grows abundantly in Colorado's mountains and represented the state's natural landscape. The legislature wanted a flower native to Colorado."

