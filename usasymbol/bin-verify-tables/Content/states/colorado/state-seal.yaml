hero_image_caption: The Great Seal of the State of Colorado. The Eye of Providence sits at the top above a shield divided between three snow-capped Rocky Mountain peaks and crossed mining tools, with the motto Nil Sine Numine below.
intro_text: 'Colorado was admitted to the Union on August 1, 1876 — exactly one hundred years after the Declaration of Independence — and its state seal encodes that year directly above a shield that maps the state''s identity: Rocky Mountains and mining, under the Eye of Providence and the motto *Nil Sine Numine*, "Nothing Without the Deity." This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
