sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Delaware formally designated colonial blue and buff as the official state colors in 1913 under Title 29, Chapter 3 of the Delaware Code, making it one of the earlier states to codify its color tradition by legislative statute. The designation gave legal standing to a color pairing whose historical justification was unambiguous: colonial blue and buff were the precise colors of General George Washington's Continental Army uniform, and Delaware's connection to Washington's Revolutionary War command was a point of deep civic pride in the state and in the wider [state colors reference](/symbols/colors)."
      - "The colors appear most prominently on the [Delaware state flag](/states/delaware/flag/delaware-state-flag), which features the state coat of arms centered on a diamond of colonial blue against a buff background. The flag's buff field and blue diamond directly reverse the layering of Washington's uniform — blue coat over buff facings — creating a complementary visual relationship between the flag's design and its historical source. The flag's colonial blue diamond also incorporates the date December 7, 1787, the day Delaware ratified the United States Constitution and became the First State, permanently linking the state colors to Delaware's most celebrated historical achievement."
    subsections:
      - subtitle: "Washington's Uniform and Delaware's Identity"
        text: "The choice of Washington's uniform colors as Delaware's state colors was a conscious act of Revolutionary War commemoration made in 1913, the same decade that saw widespread celebration of the American founding era. Washington's blue and buff uniform was among the most recognizable military dress of the 18th century: the blue coat, buff waistcoat, buff breeches, and buff facings constituted the standard uniform of the Commander-in-Chief's Guard and were worn by Washington himself throughout the Revolutionary War campaigns from 1775 to 1783. Delaware units, particularly the Delaware Regiment — known as the 'Blue Hen's Chickens' — served with distinction under Washington's command, making the uniform colors a specifically Delaware-relevant symbol rather than a generic patriotic reference."
      - subtitle: "Title 29, Chapter 3 of the Delaware Code"
        text: "Delaware Code Title 29, Chapter 3 governs the state's official symbols and designates colonial blue and buff as the official state colors without specifying exact Pantone values in the legislative text. The Delaware Division of the Arts and the Office of Management and Budget have since standardized the colors for official state applications. The buff background of the Delaware state flag has been described in state flag specifications as 'buff' or 'tan,' and the colonial blue of the diamond has been standardized for procurement purposes to ensure consistent reproduction across government documents, signage, and digital media."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Delaware's colonial blue and buff carry a singular historical meaning that sets them apart from almost every other state's color tradition: they are a direct color quotation from one of the most important military uniforms in American history. No other state has so precisely anchored its official colors to the dress of a specific Revolutionary War commander. This specificity transforms the colors from abstract symbols into historical artifacts — wearing or displaying Delaware's colonial blue and buff is, in a sense, referencing the exact appearance of George Washington leading the Continental Army through the campaigns that created the United States."
    subsections:
      - subtitle: "Colonial Blue in Delaware History"
        text: "The specific shade of colonial blue used in Delaware's state colors and flag is a medium-value periwinkle-leaning blue, notably different from the deep navy blues used by many other states. This lighter, more colonial-era tone reflects the actual dye technology of the 18th century, when the blue used for Continental Army uniforms was produced from indigo — a natural dye that produced this characteristic medium blue rather than the darker synthetic navy blues that became common in the 19th century. Delaware's preservation of this historically accurate shade connects the modern state's public imagery directly to the material culture of the Revolutionary War era."
      - subtitle: "Buff in Delaware History"
        text: "Buff is a color with a precise historical definition: it is the natural yellowish-cream color of undyed or lightly processed leather, specifically the leather of buffalo hide from which the color takes its name. In the Continental Army, buff facings were reserved for Washington's own command and the units under his direct authority, giving the color a specific prestige hierarchy within Revolutionary War military dress. For Delaware — which contributed the Delaware Regiment to Washington's command and whose soldiers fought in nearly every major engagement of the Revolutionary War including the Battle of Long Island, Trenton, Brandywine, and Monmouth — buff carries a direct record of Delaware's Revolutionary generation — the same prestige color that marked Washington's command, worn by the Delaware Regiment at Long Island, Trenton, Brandywine, and Monmouth."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Colonial blue and buff are the two colors that define the Delaware state flag, which is governed by Delaware Code Title 29, Chapter 3, and displayed at the Delaware State Capitol in Dover and all state government buildings. The flag features a buff background with a colonial blue diamond at center bearing the state coat of arms and the date December 7, 1787 below it. The Delaware state seal, adopted in 1777 and revised in 1847, incorporates the same colonial blue alongside additional colors including gold, green, and red that represent Delaware's agricultural and maritime heritage, but the flag's two-color colonial blue and buff palette remains the dominant state public imagery. These colors appear across Delaware state agency branding, the Delaware Tourism Office's marketing materials, official state publications, and Delaware state government procurement specifications, together with the civic language on the [state motto page](/states/delaware/motto/liberty-and-independence). The date on the flag — December 7, 1787 — renders the state colors inseparable from Delaware's most celebrated historical distinction as the First State."

