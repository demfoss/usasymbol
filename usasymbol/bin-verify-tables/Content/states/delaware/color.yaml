seo_title: "Delaware State Colors | Colonial Blue Buff"
seo_description: "Delaware state colors are Colonial Blue and Buff, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Delaware are **Colonial Blue** and **Buff**, formally designated by the Delaware Legislature in 1913 under Title 29, Chapter 3 of the Delaware Code. These colors replicate the uniform of General George Washington and the Continental Army — a blue coat with buff facings — as seen on [the Delaware state flag](/states/delaware/flag/delaware-state-flag) and throughout official state branding. The color cards below list practical HEX, RGB, CMYK, and Pantone references for Colonial Blue and Buff."

