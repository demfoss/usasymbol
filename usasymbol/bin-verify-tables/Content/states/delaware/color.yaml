faq:
  - question: "What are the official colors of Delaware?"
    answer: "The official state colors of Delaware are Colonial Blue and Buff, formally designated in 1913 under Delaware Code Title 29, Chapter 3. These colors replicate the uniform of General George Washington and the Continental Army during the American Revolution."
  - question: "What is the HEX code for Delaware Colonial Blue?"
    answer: "The standard HEX code for Delaware Colonial Blue is #3D6B9E, corresponding to Pantone PMS 7691, representing the medium blue of Washington's Continental Army coat as used on the Delaware state flag's diamond."
  - question: "What is the HEX code for Delaware Buff?"
    answer: "The standard HEX code for Delaware Buff is #E8C97B, corresponding to Pantone PMS 7507, representing the buff-colored facings of Washington's Continental Army uniform as used on the Delaware state flag's background field."
  - question: "Why did Delaware choose colonial blue and buff?"
    answer: "Delaware adopted colonial blue and buff in 1913 to honor the uniform colors of General George Washington and the Continental Army. Delaware units served under Washington throughout the Revolutionary War, and Delaware was the first state to ratify the Constitution in 1787, making Washington's uniform a meaningful historical reference."
  - question: "When were Delaware's state colors officially adopted?"
    answer: "Delaware's state colors were officially adopted in 1913 under Title 29, Chapter 3 of the Delaware Code."
  - question: "What is buff color?"
    answer: "Buff is the natural yellowish-cream color of undyed leather, taking its name from buffalo hide. In the Continental Army, buff facings were used on Washington's command uniforms, giving the color a specific Revolutionary War military significance that Delaware honored by adopting it as an official state color."

