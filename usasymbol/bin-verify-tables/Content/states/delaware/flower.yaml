type: State Flower
state: Delaware
name: Peach Blossom
scientific_name: Prunus persica
adopted_year: 1895
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-25"
seo_title: "Delaware State Flower | Peach Blossom"
seo_description: "The Peach Blossom became Delaware's state flower in 1895. Discover this delicate pink flower and its significance to Delaware's agricultural heritage."

intro_text: "In 1895, Delaware chose the Peach Blossom as its state flower. Included in the [U.S. state flowers hub](/symbols/flowers), these delicate pink and white flowers appear on peach trees throughout Delaware each spring. The Peach Blossom represented Delaware's once-thriving peach industry that dominated the state's economy in the late 1800s."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Delaware"
    paragraphs:
      - "Delaware recognizes the Peach Blossom as its state flower. The flowers bloom in early spring before leaves appear on the trees. Each blossom measures about 1 inch across. Five pink petals surround a center of yellow stamens. The flowers have a light, sweet fragrance."
      - "Peach trees bloom from late March through early April in Delaware. Weather conditions affect exact timing each year. Warm temperatures trigger the blooms. A single peach tree can produce thousands of blossoms during peak season. The flowers last only one to two weeks before petals fall."
      - "Delaware orchards once covered tens of thousands of acres. The state earned the nickname The Peach State before Georgia claimed that title. Disease destroyed most Delaware peach orchards by the early 1900s. Today fewer commercial peach farms operate in the state. The Peach Blossom remains an important historical symbol in [The First State](/states/delaware/nickname/the-first-state)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Peach Blossom"
    paragraphs:
      - "Known as Peach Blossom, this flower's scientific designation is Prunus persica. The species belongs to the Rosaceae family, which includes roses, apples, cherries, and almonds. This family contains over 3,000 species of flowering plants."
      - "The genus name Prunus covers stone fruits like peaches, plums, and cherries. The species name persica means from Persia, reflecting the fruit's ancient origins. Peaches originated in China thousands of years ago. They traveled along trade routes to Persia and eventually reached Europe and America."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Delaware Chose the Peach Blossom"
    paragraphs:
      - "Delaware selected the Peach Blossom as its state flower in 1895. The General Assembly passed this designation without a public vote. Delaware's peach industry influenced the decision significantly. The state produced millions of baskets of peaches annually during this period."
      - "Delaware peach orchards supplied markets throughout the northeastern United States. Farmers planted vast acreages of peach trees across Kent and Sussex counties. The industry employed thousands of workers. Peach growing shaped Delaware's economy and landscape during the late 1800s."
      - "A fungal disease called peach yellows devastated Delaware orchards starting in the 1890s. The disease spread rapidly through peach-growing regions. By 1920, most commercial peach production had ceased. Despite the industry's collapse, Delaware kept the Peach Blossom as its state flower. The symbol honors this important chapter in state history."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Delaware State Flower Facts"
    facts:
      - "Delaware adopted the Peach Blossom on March 9, 1895, making it one of the first states to designate an official state flower"
      - "Peach trees require a period of cold temperatures during winter dormancy before they can bloom properly in spring"
      - "Delaware produced over 800,000 baskets of peaches in 1875, earning significant income from fruit sales to northern cities"
      - "The Peach Blossom blooms appear before the tree's leaves emerge, creating spectacular displays of pink flowers on bare branches"
      - "Peach yellows disease, caused by a phytoplasma, destroyed Delaware's peach industry between 1890 and 1920 with no effective treatment available"
      - "Modern Delaware has fewer than 200 acres of commercial peach orchards compared to tens of thousands of acres in the 1800s"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Delaware State Flower and Bird"
    paragraphs:
      - "The Blue Hen Chicken serves as Delaware's state bird, a breed known for fighting spirit during the Revolutionary War. Both symbols represent Delaware officially. The state adopted the Peach Blossom in 1895 and designated the [Delaware Blue Hen](/states/delaware/bird/delaware-blue-hen) as state bird in 1939."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Peach Blossom Symbolizes"
    paragraphs:
      - "The Peach Blossom has been linked to Delaware's agricultural heritage and economic history. The flower frequently represents the state's resilience despite the collapse of its once-dominant peach industry. Its delicate beauty carries connotations of spring renewal and the importance of agriculture to Delaware's identity, much like the [American Holly state tree](/states/delaware/tree/american-holly)."

faq:
  - question: "What is Delaware's state flower?"
    answer: "Delaware's state flower is the Peach Blossom, the delicate pink and white flower that blooms on peach trees each spring."
  
  - question: "When did Delaware adopt the Peach Blossom as its state flower?"
    answer: "Delaware adopted the Peach Blossom on March 9, 1895. The General Assembly passed this designation during the height of Delaware's peach industry."
  
  - question: "Why did Delaware choose the Peach Blossom?"
    answer: "Delaware chose the Peach Blossom because the state's peach industry dominated its economy in the late 1800s. Delaware produced millions of baskets of peaches annually and the industry employed thousands of workers. The flower represented this important agricultural heritage, reflected in statewide routes shown on the [Delaware borders page](/states/delaware/borders)."
  
  - question: "Does Delaware still grow peaches?"
    answer: "Delaware still grows peaches but on a much smaller scale than the 1800s. Modern Delaware has fewer than 200 acres of commercial peach orchards. Disease destroyed most orchards by 1920, ending the state's position as a major peach producer."
  
  - question: "When do Peach Blossoms bloom in Delaware?"
    answer: "Peach Blossoms bloom from late March through early April in Delaware. The flowers appear before leaves emerge on the trees and last only one to two weeks before petals fall."

