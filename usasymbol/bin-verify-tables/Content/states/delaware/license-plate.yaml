- id: first-state-meaning
  style: meaning-banner
  title: Meaning of The First State
  paragraphs:
  - 'On December 7, 1787, thirty delegates gathered in Dover and voted unanimously to ratify the U.S. Constitution. The vote was 30 to 0 — no dissent, no delay. Delaware beat Pennsylvania to ratification by five days and every other state by weeks or months. That speed and unanimity made Delaware''s claim to "first" unambiguous and unchallengeable.'
  - 'The timing was not accidental. Delaware was a small state with a strategic position between Pennsylvania and Maryland, and its leaders understood that ratifying quickly gave the state influence it could not claim through size or population. Being first was a political calculation that became a permanent identity — and eventually the state''s [official nickname](/states/delaware/nickname) and plate slogan.'
  - 'The date appears on Delaware''s [state flag](/states/delaware/flag) — December 7, 1787 is written directly on the buff-colored diamond — which means the same historical act is encoded in the flag, the nickname, and the plate slogan simultaneously.'

- id: low-numbers
  icon: fa-solid fa-hashtag
  title: Delaware's Low-Number Plates — A Separate Phenomenon
  paragraphs:
  - 'Delaware uses a sequential numbering system for its plates, and low numbers — single digits, double digits, numbers under 1,000 — have become some of the most valuable license plates in the United States. Families pass them down across generations. When they change hands, they sell for prices that can reach six figures. Plate number 6 sold at auction for $675,000 in 2008, setting a record for a U.S. license plate at the time.'
  - 'The low-number culture exists because Delaware started issuing plates early and never reset its numbering. A plate from 1909 with a two-digit number can still be legally registered today. The combination of age, continuity, and a small state with a long institutional memory created conditions for a collector market that does not exist at the same scale anywhere else in the country.'
  - 'The slogan and the numbers are separate systems — "The First State" appears on all plates regardless of number — but together they give Delaware plates a dual identity: a historical claim in the slogan and a status signal in the number. For a broader look at how states distinguish their plates, see [U.S. license plate slogans by state](/symbols/license-plate-slogans).'

