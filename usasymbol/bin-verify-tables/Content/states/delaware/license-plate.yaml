intro_text: '**"The First State"** is Delaware''s license plate slogan, pointing to a specific historical act: on December 7, 1787, Delaware became the first state to ratify the U.S. Constitution. The phrase has appeared on Delaware plates since 1962 and gives the small black-and-white plate its national claim. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: '"The First State" is Delaware''s license plate slogan, referring to Delaware''s unanimous ratification of the U.S. Constitution on December 7, 1787 — making it the first of the original thirteen colonies to join the new nation. The slogan first appeared on Delaware general-issue passenger plates in 1962 and has remained in use since.'
