faq:
- question: What is Delaware's license plate slogan?
  answer: Delaware's license plate slogan is "The First State," referring to Delaware's unanimous ratification of the U.S. Constitution on December 7, 1787 — the first of the thirteen original states to do so.
- question: What does "The First State" mean on Delaware plates?
  answer: The slogan marks Delaware's vote on December 7, 1787, when thirty delegates unanimously ratified the U.S. Constitution, beating every other state to ratification. It is one of the few U.S. plate slogans tied to a specific, documented historical date.
- question: When did "The First State" first appear on Delaware plates?
  answer: '"The First State" first appeared on Delaware general-issue passenger plates in 1962. The current flat blue-and-gold base followed in 1969.'
- question: Why are Delaware's low-number plates so valuable?
  answer: Delaware began issuing sequential plate numbers in 1909 and never reset the system. Low numbers — single and double digits, numbers under 1,000 — have passed through families for generations. Their age, scarcity, and the state's continuous numbering tradition created a collector market where individual plates have sold for hundreds of thousands of dollars.
- question: What color is Delaware's license plate?
  answer: Delaware's standard plate uses a blue-and-gold color scheme, which the state has carried through multiple design generations. The combination matches Delaware's state colors.
- question: When did Delaware ratify the U.S. Constitution?
  answer: Delaware ratified the U.S. Constitution on December 7, 1787, with a unanimous vote of 30 to 0. The date is written on Delaware's state flag and is the historical basis for both the state nickname and the plate slogan.

