faq:
- question: What does the date on Delaware's flag mean?
  answer: The date December 7, 1787 marks when Delaware ratified the United States Constitution — unanimously, in a single day. Delaware was the first state to ratify, five days ahead of Pennsylvania. No other state ratified before Delaware, which is why the date appears on the flag as a founding claim.
- question: Why are Delaware's flag colors colonial blue and buff?
  answer: Colonial blue and buff trace to George Washington's Continental Army uniform — blue was the coat color, buff was the facing color. Delaware adopted these colors for its coat of arms in 1777, during the Revolutionary War. They carried forward unchanged into the 1913 state flag.
- question: What does the diamond on Delaware's flag represent?
  answer: The diamond references Thomas Jefferson's description of Delaware as small but strategically valuable — like a diamond. The buff color matches the facing on Washington's Continental Army uniform. The state coat of arms appears inside the diamond, with the ratification date directly below.
- question: When was Delaware's state flag officially adopted?
  answer: Delaware adopted its current state flag on July 24, 1913. The design formalized a coat of arms that had existed since 1777. Exact color specifications were not established until 1954, when the National Bureau of Standards defined them using colorimetric testing.
- question: What is on Delaware's coat of arms?
  answer: Delaware's coat of arms shows a shield with a wheat sheaf, ear of corn, and ox on striped bands. A farmer with a hilling hoe stands to the left; a soldier with a rifle stands to the right. A sailing ship appears above. The motto Liberty and Independence runs on a banner below. The coat of arms was adopted January 17, 1777.
