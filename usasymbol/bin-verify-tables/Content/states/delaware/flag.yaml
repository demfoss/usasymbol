- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - Delaware ratified the Constitution unanimously on December 7, 1787 — 5 days before Pennsylvania
  - The coat of arms was adopted January 17, 1777 — during the Revolutionary War, before the Constitution existed
  - 'Flag adopted: July 24, 1913'
  - Colors (colonial blue and buff) trace to George Washington's Continental Army uniform
  - Color specifications defined by the National Bureau of Standards in 1954 using colorimetric testing
  - In 1946, Governor Walter Bacon gave Denmark a variant flag with a gold diamond instead of buff
  - The coat of arms uses 14 specified colors, all documented with Munsell and Pantone values
  - Ranked 52nd among all North American flags in the 2001 NAVA design survey
