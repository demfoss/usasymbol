type: State Tree
state: Delaware
name: American Holly
scientific_name: Ilex opaca
adopted_year: 1939
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Delaware State Tree | American Holly"
seo_description: "Delaware made American holly its state tree in 1939, when local growers supplied much of the country's Christmas greenery trade."

intro_text: "Delaware declared the American Holly its official state tree in 1939, recognizing a species that had real economic weight in the early 20th century. At the height of the holly trade, Delaware was famous for producing Christmas greenery on a scale large enough to shape local identity and employment. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Delaware"
    paragraphs:
      - "The American Holly is Delaware's official state tree. This broadleaf evergreen typically grows 40 to 50 feet tall. The Delaware champion American Holly stands in Delaware City at 60 feet tall with a 121-inch trunk circumference. Trees can live 100 years or more."
      - "The tree displays dark green, leathery leaves with spiny edges measuring two to four inches long. Leaves stay on the tree year-round. Female trees produce bright red berries that ripen in fall and persist through winter. Male trees provide pollen but never produce berries."
      - "American Holly grows naturally along the East Coast from Massachusetts to Florida and west to Texas. In Delaware, it thrives in forests as an understory species. Delaware's abundance made the state famous for holly production."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the American Holly"
    paragraphs:
      - "The common names are American Holly, Christmas Holly, and White Holly. The scientific name is Ilex opaca. The species name opaca means 'shady' in Latin, referring to the tree's dark green foliage and shade tolerance."
      - "When Pilgrims landed in Massachusetts in 1620, they recognized American Holly as similar to English Holly, which Europeans used for Christmas decorations."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why American Holly Became the Delaware State Tree"
    paragraphs:
      - "Delaware declared American Holly its state tree on May 1, 1939. Governor Richard C. McMullen signed legislation passed by the General Assembly. William S. Taber, Delaware's State Forester, supported the designation after his secretary Olive Wilkins urged him to propose it, citing the tree's beauty and economic importance."
      - "The timing coincided with Delaware's peak as the Holly Capital of the World. By the 1930s, Delaware led the nation in holly production. The industry employed 8,500 people. Milton became 'Land of Holly.' Farmers harvested holly as the last cash crop of the season, earning up to $500 between Thanksgiving and Christmas across [The First State](/states/delaware/nickname/the-first-state)."
      - "Charles C. Jones Sr. pioneered the export industry. Starting his holly business in 1906, 'Jones, the Holly Wreath Man' became Delaware's leading exporter. The Pennsylvania Railroad ran special 'Holly Express' trains on Saturdays before Christmas to transport products. The industry collapsed in the 1950s when plastic wreaths replaced natural holly."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Delaware State Tree Facts"
    facts:
      - "Delaware designated American Holly on May 1, 1939, during the peak of the state's holly industry"
      - "Milton earned the nickname 'Land of Holly' by producing more Christmas decorations than anywhere else in the world"
      - "The holly industry employed 8,500 people at its peak in Delaware"
      - "Charles C. Jones Sr., known as 'Jones, the Holly Wreath Man,' became Delaware's leading holly exporter in 1906"
      - "The Pennsylvania Railroad ran special 'Holly Express' trains on Saturdays before Christmas"
      - "Delaware's champion American Holly stands 60 feet tall in Delaware City"
      - "Only female American Holly trees produce the distinctive red berries"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Delaware State Tree and Flower"
    paragraphs:
      - "Delaware's state flower is the Peach Blossom (Prunus persica), adopted on March 9, 1895. Delaware earned the nickname 'The Peach State' when orchards contained more than 800,000 peach trees. Both American Holly and [Peach Blossom](/states/delaware/flower/peach-blossom) represent Delaware's agricultural heritage. Delaware also adopted peach pie as the state dessert in 2009."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize American Holly"
    paragraphs:
      - "The evergreen leaves provide the easiest identification. Dark green, leathery leaves with sharp spiny edges stay on year-round. Each leaf measures two to four inches long with a glossy upper surface. The spines along margins vary among individual trees."
      - "Female trees display bright red berries from fall through winter. Male trees produce small greenish-white flowers with yellow pollen in spring. The bark appears light gray and smooth on young trees, developing a warty texture with age. The tree maintains a pyramidal or conical shape."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "American Holly symbolizes Delaware's entrepreneurial spirit and agricultural innovation. The state transformed an abundant native tree into a thriving export industry employing thousands. Roadside hollies throughout Delaware are living reminders of this industrious chapter in state history and complement imagery on the [Delaware state flag](/states/delaware/flag/delaware-state-flag)."

faq:
  - question: "What is the Delaware state tree?"
    answer: "The American Holly (Ilex opaca) is Delaware's official state tree, designated on May 1, 1939. Governor Richard C. McMullen signed the legislation recognizing holly's importance to Delaware's economy."
  
  - question: "What is the Delaware state tree called?"
    answer: "Delaware's state tree is called the American Holly, Christmas Holly, or White Holly. Its scientific name is Ilex opaca, which refers to its ability to grow in shade and dark green foliage; see also the [state motto context](/states/delaware/motto/liberty-and-independence)."
  
  - question: "When was Delaware's state tree adopted?"
    answer: "Delaware adopted the American Holly as its state tree on May 1, 1939. The designation came during Delaware's peak as the Holly Capital of the World in the 1930s."
  
  - question: "Why is the American Holly Delaware's state tree?"
    answer: "Delaware chose American Holly because the state led the nation in holly production during the 1920s and 1930s. Milton produced more Christmas decorations than anywhere else in the world, employing 8,500 workers at peak. The industry generated significant income for rural families as the last cash crop of the growing season. State Forester William S. Taber's secretary Olive Wilkins proposed the designation, citing the tree's beauty, worldwide recognition, and economic importance."
  
  - question: "What is the Delaware state tree name?"
    answer: "The name is American Holly. Other names include Christmas Holly and White Holly. The scientific name is Ilex opaca, meaning 'shady holly' in Latin."
  
  - question: "Where does American Holly grow in Delaware?"
    answer: "American Holly grows throughout Delaware, particularly along rural roadsides and in forest understories. The tree thrives in various soil types and tolerates shade well. Delaware's abundance of American Holly made the state the leading producer of holly products in the 1920s and 1930s."
   
  - question: "What happened to Delaware's holly industry?"
    answer: "Delaware's holly industry thrived from the early 1900s through the 1930s, employing 8,500 workers at its peak. The industry collapsed in the 1950s when cheaper plastic wreaths replaced natural holly decorations. Wage laws affecting piecework businesses also contributed to the decline. American Holly still grows abundantly along Delaware roadsides as a reminder of this economic heritage."

