faq:
- question: What is Michigan's state fossil?
  answer: "Michigan's state fossil is the American mastodon (Mammut americanum), a large Ice Age mammal related to but distinct from mammoths, designated in 2002."
- question: When did Michigan adopt its state fossil?
  answer: "Michigan designated the American mastodon as its state fossil in 2002, following a campaign supported by Michigan school students."
- question: What did the American mastodon look like?
  answer: "The mastodon stood up to 10 feet tall at the shoulder and reached 15 feet in length. It had long curved tusks, a stocky body covered in fur, and cone-shaped molar teeth used for chewing leaves and branches."
- question: Where are American mastodon fossils found in Michigan?
  answer: "Mastodon remains have been found in nearly every county of Michigan's Lower Peninsula. The University of Michigan Museum of Natural History in Ann Arbor has major specimens on public display."
- question: When did the American mastodon live?
  answer: "The American mastodon lived from the late Pleistocene into the early Holocene and went extinct about 10,000 years ago at the end of the last Ice Age."
- question: Who pushed to make it the state fossil?
  answer: "Michigan school students campaigned in the late 1990s and early 2000s for a state fossil designation, pointing to the mastodon as the obvious choice given how many specimens have been found across the state."

