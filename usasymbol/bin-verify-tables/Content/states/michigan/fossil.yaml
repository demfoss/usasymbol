- id: facts
  icon: fa-solid fa-lightbulb
  title: American Mastodon Facts
  facts:
  - "Michigan adopted Mammut americanum as its state fossil in 2002, driven in part by a student campaign to give the state an official fossil."
  - "Mastodon remains have been found in nearly every county of Michigan's Lower Peninsula — one of the densest distributions in North America."
  - "Mastodon teeth have cone-shaped cusps for chewing branches; mammoth teeth have flat ridges for chewing grass — an easy way to tell them apart."
  - "The American mastodon stood up to 10 feet at the shoulder and could weigh over 6 tons."
  - "Michigan's cold, boggy glacial soils preserved mastodon bones for up to 13,000 years, and new specimens still turn up during construction and farm drainage."

