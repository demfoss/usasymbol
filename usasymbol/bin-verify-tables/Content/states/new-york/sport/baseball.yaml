sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: New York State Sport
    paragraphs:
      - "New York named baseball its official state sport in 2021, closing a gap that had stood since the state began naming symbols decades earlier. Few states can claim the sport's living institutions the way New York can, from the National Baseball Hall of Fame in Cooperstown to a professional history reaching back to the 1840s. Lawmakers passed the designation with no serious competition once the idea reached Albany."

  - id: what-is
    icon: fa-solid fa-baseball
    title: "Baseball in New York"
    paragraphs:
      - "A pitcher winds up and throws toward a batter standing at home plate, who tries to put the ball in play and reach base before a fielder throws them out. Nine innings decide the game, with each team taking turns batting and fielding while runners advance around first, second, and third base toward home. A full defense of nine players covers every position, from the pitcher's mound to the outfield grass hundreds of feet away."
      - "The New York Yankees play their home games at Yankee Stadium in the Bronx and have won 27 World Series championships, more than any other franchise in Major League Baseball. New York also hosts the Mets, the Hall of Fame's home city of Cooperstown, and youth and high school programs that fill sandlots across the state every spring."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Baseball Represents New York
    paragraphs:
      - "New York's claim to baseball starts with the rulebook. The Knickerbocker Base Ball Club, formed in New York City in 1845, adopted one of the earliest organized sets of baseball rules, a document historians still credit as a founding text of the modern game. That early codification gave New York a direct hand in shaping the sport long before any team played for a championship."
      - "The National Baseball Hall of Fame opened in Cooperstown in 1939, chosen after an early, later disputed claim that Abner Doubleday invented the game there in 1839. Myth or not, the museum made Cooperstown baseball's permanent address, drawing players and fans to upstate New York every summer for induction weekend."
      - "New York's professional history runs deeper than one franchise. The Yankees have won 27 World Series titles behind players like Babe Ruth and Mickey Mantle, while the Brooklyn Dodgers made history of a different kind when Jackie Robinson broke Major League Baseball's color line at Ebbets Field in 1947. Few states can pair that much championship success with that much historical weight."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Baseball Became New York's State Sport
    paragraphs:
      - "The push for an official state sport began in a Cooperstown elementary school. Fourth-graders in Anne Reis's class were studying New York State government when they realized the state had never named an official sport, and they pitched baseball as the natural choice given their hometown's ties to the sport's history. State Senator Peter Oberacker carried their idea into legislation."
      - "Governor Andrew Cuomo signed the bill into law in the summer of 2021, making baseball New York's official state sport. Lawmakers advanced the fourth-graders' proposal without a competing candidate or notable opposition."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Baseball Facts
    facts:
      - "New York designated baseball its official state sport in 2021, a proposal that began with fourth-graders in a Cooperstown classroom."
      - "The National Baseball Hall of Fame has stood in Cooperstown since 1939."
      - "The Knickerbocker Base Ball Club, founded in New York City in 1845, adopted one of the sport's earliest organized rulebooks."
      - "The New York Yankees have won 27 World Series titles, more than any other Major League Baseball franchise."
      - "Jackie Robinson broke Major League Baseball's color line with the Brooklyn Dodgers at Ebbets Field in 1947."

