faq:
  - question: What is New York's state sport?
    answer: "New York's official state sport is baseball, adopted in 2021."
  - question: When did New York adopt baseball as its state sport?
    answer: "New York adopted baseball as its state sport in 2021, after Governor Andrew Cuomo signed the bill that summer."
  - question: Why did New York choose baseball?
    answer: "New York helped shape the sport's earliest rules in the 1840s and is home to the National Baseball Hall of Fame in Cooperstown. The idea for the designation itself came from Cooperstown fourth-graders studying state symbols."
  - question: What team represents New York in baseball?
    answer: "The New York Yankees represent the state with 27 World Series titles, the most of any Major League Baseball franchise. The Mets also play in New York, based in Queens."

