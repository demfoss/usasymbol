title: "1847 Colt Walker"
adopted_year: 2021
legislation: "SCR 8"
meaning: "The 1847 Colt Walker embodies the partnership between Texas frontier ingenuity and American invention — a weapon born of necessity that saved a company, armed a ranger corps, and became the most powerful production revolver in history for nearly a century."

