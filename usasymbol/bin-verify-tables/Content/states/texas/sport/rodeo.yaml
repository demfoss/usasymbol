faq:
  - question: What is Texas's state sport?
    answer: "Texas's official state sport is rodeo, adopted in 1997."
  - question: When did Texas adopt rodeo as its state sport?
    answer: "Texas adopted rodeo as its state sport in 1997, becoming the first state in the country to name an official state sport."
  - question: Why did Texas choose rodeo?
    answer: "Rodeo traces back to Texas cattle ranches, and the world's first recorded rodeo was held in Pecos in 1883. Texas cowboy Bill Pickett also invented steer wrestling, one of rodeo's core events."
  - question: Where was the world's first rodeo held?
    answer: "The world's first recorded rodeo was held in Pecos, Texas, on July 4, 1883. The event continues today as the West of the Pecos Rodeo."

