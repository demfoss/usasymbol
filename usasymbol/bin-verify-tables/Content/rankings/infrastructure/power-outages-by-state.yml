faq:
- question: Which state had the most power outages in 2024?
  answer: South Carolina had the longest annual outage duration at 3,136.5 minutes, or 52.3 hours, per customer. Maine had the highest outage frequency at 3.636 interruptions per customer.
- question: What is power outage duration by state?
  answer: State SAIDI ranged from 84.7 minutes in South Dakota to 3,136.5 minutes in South Carolina during 2024. The U.S. average was 611.3 minutes, or about 10.2 hours.
- question: Which state has the most reliable power grid?
  answer: South Dakota had the lowest 2024 SAIDI at 84.7 minutes and the lowest SAIFI at 0.815 interruptions per customer. Arizona ranked second for annual duration at 87.5 minutes.
- question: What do SAIDI and SAIFI mean?
  answer: South Carolina's SAIDI of 3,136.5 measures annual interruption minutes for the average customer. Its SAIFI of 2.365 measures interruption frequency, while its CAIDI of 1,326.3 minutes measures average restoration time.
- question: How long is the average power outage?
  answer: National CAIDI was 401.9 minutes per interruption when major events were included in 2024. State averages ranged from Arizona's 88.6 minutes to South Carolina's 1,326.3 minutes.
- question: Is this a live power outage map?
  answer: No, the 50-state ranking summarizes completed 2024 utility reliability reports and does not show customers currently without power. South Carolina's 3,136.5-minute SAIDI is an annual measure, not a current outage total.
