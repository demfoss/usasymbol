- id: weather-related-power-outages
  icon: fa-solid fa-cloud-bolt
  title: Weather-Related Power Outages
  paragraphs:
  - Major events accounted for 80% of U.S. outage hours in 2024. South Carolina's calculated major-event share was about 96%, Florida's was 95%, and the shares in North Carolina and Texas were about 90%.
  - Hurricane Beryl interrupted service to 2.6 million Texas customers, while Hurricane Helene affected 5.9 million customers across 10 states, including at least 1.2 million in South Carolina. Hurricane Milton then affected 3.4 million Florida customers.
