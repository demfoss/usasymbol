  description: South Carolina averaged 52.3 outage hours per customer in 2024, followed by Maine at 29.1 hours and North Carolina at 24.0 hours.
page:
  h1: Power Outages by State
  quick_answer:
  - Power outages by state lasted longest in South Carolina during 2024, where the average customer experienced 3,136.5 interruption minutes, or 52.3 hours. Maine ranked second at 29.1 hours.
  - Maine had the most frequent interruptions at 3.636 per customer, followed by West Virginia at 2.832 and Louisiana at 2.722. Hawaii recorded 2.616 interruptions.
  - Major events produced 80% of nationwide outage hours in 2024. South Carolina's major-event share reached about 96%, compared with 95% in Florida and 90% in North Carolina and Texas.
  methodology: Figures come from 2024 Form EIA-861 utility reliability filings. Outage hours show the average total time a customer spent without power during the year, and outages per year count non-momentary interruptions per customer.
  sources:
  - name: U.S. Energy Information Administration Table 11.3
    url: https://www.eia.gov/electricity/annual/table.php?t=epa_11_03.html
    description: 2024 state SAIDI, SAIFI, CAIDI, major-event, and reporting-coverage data
  - name: EIA Form 861 Detailed Data
    url: https://www.eia.gov/electricity/data/eia861/
    description: Utility-level annual reliability reports and metric definitions
  - name: EIA 2024 Power Interruption Analysis
    url: https://www.eia.gov/todayinenergy/detail.php?id=66744
    description: National major-event share and customer impacts from Hurricanes Beryl, Helene, and Milton
