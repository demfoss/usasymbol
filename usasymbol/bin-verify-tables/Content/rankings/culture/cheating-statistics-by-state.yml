page:
  h1: "Cheating Statistics by State"

  quick_answer:
    - "Hawaii ranks first for infidelity, with 80.56% of respondents saying they cheated on a significant other, the highest share in the survey."
    - "Kentucky and Alaska tie for the highest share of respondents who said they were cheated on, at 97.06% each. Nebraska's cheating rate of 6.25% is the lowest in the table."
    - "North Carolina, Kentucky, and Alaska tie at 100% when combining cheating and being cheated on, the highest rate recorded. Connecticut is lowest on that combined measure at 73.33%."

  methodology: "Cheating statistics reflect the share of survey respondents in each state who answered yes to having cheated on a significant other, having been cheated on, or either, compiled by USA Symbol from self-reported responses."

  sources:
    - name: "USA Symbol Cheating Statistics Survey"
      url: "https://usasymbol.com/rankings/culture/cheating-statistics-by-state"
      description: "State-level percentages of respondents who self-reported having cheated on a significant other, having been cheated on, or either."

