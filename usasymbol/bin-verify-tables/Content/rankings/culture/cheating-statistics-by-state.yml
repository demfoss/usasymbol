sections:
  - id: "states-with-the-highest-cheating-rates"
    icon: "fa-solid fa-heart-crack"
    title: "States With the Highest Cheating Rates"
    paragraphs:
      - "Hawaii tops the list at 80.56%, well above Louisiana and Rhode Island, which tie for second at 62.50% each. Delaware ranks fourth at 52.94%."
      - "Wyoming and New Hampshire tie for fifth at 50.00%, and Maine follows at 46.67%. North Carolina rounds out the top eight at 44.44%."

  - id: "states-most-likely-to-be-cheated-on"
    icon: "fa-solid fa-heart-broken"
    title: "States Most Likely to Be Cheated On"
    paragraphs:
      - "Kentucky and Alaska tie for the highest rate of being cheated on, at 97.06% each. Maryland is third at 96.67%, and North Carolina and North Dakota tie for fourth at 94.44%."
      - "Michigan and West Virginia tie at 93.94%, and Oklahoma follows at 93.55%. Nebraska's cheating rate is only 6.25%, yet 81.25% of its respondents said they had been cheated on."

  - id: "states-with-the-least-infidelity-overall"
    icon: "fa-solid fa-heart"
    title: "States With the Least Infidelity Overall"
    paragraphs:
      - "North Carolina, Kentucky, and Alaska tie for the highest combined rate at 100%, counting respondents who either cheated or were cheated on. Connecticut has the lowest combined rate at 73.33%."
      - "Indiana is next lowest at 74.19%, and Massachusetts follows at 74.29%. Connecticut's cheating rate of 40.00% and its 66.67% rate of being cheated on both rank among the lowest in the table."

