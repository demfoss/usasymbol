faq:
  - question: "Which state has the highest rate of cheating?"
    answer: "Hawaii has the highest self-reported cheating rate at 80.56%. Louisiana and Rhode Island tie for second at 62.50% each."

  - question: "Which state has the lowest rate of cheating?"
    answer: "Nebraska has the lowest self-reported cheating rate at 6.25%, just below Florida at 9.09%."

  - question: "Which state has the highest rate of being cheated on?"
    answer: "Kentucky and Alaska tie for the highest rate at 97.06% each. Maryland ranks third at 96.67%."

  - question: "Which states have the most overall infidelity?"
    answer: "North Carolina, Kentucky, and Alaska tie at 100% when combining cheating and being cheated on. North Dakota is next at 97.22%."

  - question: "Which state has the least overall infidelity?"
    answer: "Connecticut has the lowest combined rate at 73.33%. Indiana follows at 74.19%, and Massachusetts is close behind at 74.29%."

  - question: "What is the cheating rate in Texas?"
    answer: "Texas has a cheating rate of 33.33%, tied with West Virginia, Ohio, Wisconsin, and Missouri. Its rate of being cheated on is 88.89%."

