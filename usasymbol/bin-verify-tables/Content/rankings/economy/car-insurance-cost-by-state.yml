seo:
  title: "Car Insurance Cost by State 2026 | Map & Rates"
  description: "New York has the highest average car insurance cost at $4,535 a year for full coverage. Vermont has the lowest at $1,212."

page:
  h1: "Car Insurance Cost by State"

  quick_answer:
    - "New York has the highest average full coverage car insurance cost at $4,535 a year, more than double the national average of $2,112."
    - "Vermont has the lowest average full coverage premium at $1,212 a year, and Maine follows at $1,251. Minimum coverage averages $671 nationally, ranging from $291 in Wyoming to $1,719 in New York."
    - "Louisiana's full coverage premium equals 6.61% of its median household income, the highest share of any state, even though New York's $4,535 premium is larger in dollar terms. Mississippi has the highest uninsured motorist rate at 29.4%, more than seven times Maine's rate of 4.9%."

  methodology: "Minimum and full coverage premiums are WalletHub's 2026 averages for a 45-year-old driver with a clean record. Percent of income divides the full coverage premium by each state's Census median household income."

  sources:
    - name: "WalletHub, Average Car Insurance Cost by State"
      url: "https://wallethub.com/edu/ci/average-car-insurance-cost/88076"
      description: "2026 average annual minimum and full coverage car insurance premiums by state"
    - name: "ValuePenguin, Uninsured Motorist Statistics"
      url: "https://www.valuepenguin.com/auto-insurance/uninsured-motorist-statistics"
      description: "Uninsured motorist rate by state, based on Insurance Research Council claims data"
    - name: "U.S. Census Bureau, American Community Survey"
      url: "https://data.census.gov"
      description: "Median household income by state, used to calculate premium as a percentage of income"

