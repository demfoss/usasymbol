    answer: "Vermont has the lowest average full coverage premium at $1,212 a year. Wyoming has the lowest minimum coverage premium at just $291 a year."
  - question: "What is the average cost of car insurance by state?"
    answer: "The national average is $2,112 a year for full coverage and $671 a year for minimum coverage. Individual state averages range from $1,212 in Vermont to $4,535 in New York for full coverage."
  - question: "Which state has the highest rate of uninsured drivers?"
    answer: "Mississippi has the highest uninsured motorist rate at 29.4%, nearly one in three drivers. Maine has the lowest rate at 4.9%."
