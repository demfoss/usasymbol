faq:
  - question: "Which state has the most expensive Big Mac?"
    answer: "Massachusetts has the most expensive Big Mac at $7.09. Alaska is second at $6.50, and Maine, New Hampshire, and Vermont are tied for third at $6.29."

  - question: "Which state has the cheapest Big Mac?"
    answer: "Wyoming and North Carolina are tied for the cheapest Big Mac in the country at $4.19. Florida, Nebraska, Ohio, and Pennsylvania are tied just above at $4.29."

  - question: "What is the average Big Mac price in the United States?"
    answer: "The U.S. average is $5.15, a price matched exactly by Georgia. Massachusetts costs $2.90 more than the cheapest states, Wyoming and North Carolina."

  - question: "What is the Big Mac price in California?"
    answer: "California is at $5.89, ranking 9th, despite its reputation as one of the most expensive states to live in. Eight states have a higher Big Mac price."

  - question: "What is the Big Mac price in Texas?"
    answer: "Texas is at $5.36, ranking 19th, just above Hawaii at $5.31."

  - question: "Why do Big Mac prices vary so much by state?"
    answer: "McDonald's sets menu prices by local market, so the same sandwich costs $7.09 in Massachusetts and $4.19 in Wyoming and North Carolina, a difference of $2.90."

