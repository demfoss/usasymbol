page:
  h1: "Big Mac Index by State"

  quick_answer:
    - "Massachusetts has the most expensive Big Mac of any state at $7.09. Alaska is second at $6.50, and Maine, New Hampshire, and Vermont are tied for third at $6.29."
    - "Wyoming and North Carolina are tied for the cheapest Big Mac in the country at $4.19. Florida, Nebraska, Ohio, and Pennsylvania are tied just above at $4.29."
    - "The average U.S. price is $5.15, a figure matched exactly by Georgia. Massachusetts costs $2.90 more than Wyoming and North Carolina, nearly 70% higher."

  methodology: "Prices reflect the cost of a single Big Mac sandwich, not a combo meal, from World Population Review's state guide, compiled using Zippia and Fast Food Menu Prices data."

