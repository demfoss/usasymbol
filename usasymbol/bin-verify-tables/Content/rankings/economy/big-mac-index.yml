sections:
  - id: "states-with-the-highest-big-mac-prices"
    icon: "fa-solid fa-burger"
    title: "States With the Highest Big Mac Prices"
    paragraphs:
      - "Massachusetts has the most expensive Big Mac in the country at $7.09, well above Alaska's $6.50 in second place. Maine, New Hampshire, and Vermont are tied for third at $6.29."
      - "Connecticut and Illinois are tied at $6.09, and Rhode Island follows at $5.99. Every state in the top eight costs at least $5.99, nearly a dollar above the $5.15 national average."

  - id: "states-with-the-lowest-big-mac-prices"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Big Mac Prices"
    paragraphs:
      - "Wyoming and North Carolina are tied for the cheapest Big Mac in the country at $4.19. Florida, Nebraska, Ohio, and Pennsylvania are tied just above at $4.29, a four-way tie for the second-lowest price."
      - "Utah is next at $4.39, and Indiana is at $4.40. Every state in the bottom nine costs $2.70 less than Massachusetts, the most expensive state in the table."

  - id: "how-big-mac-prices-compare-to-the-national-average"
    icon: "fa-solid fa-chart-line"
    title: "How Big Mac Prices Compare to the National Average"
    paragraphs:
      - "The average U.S. Big Mac price is $5.15, a figure matched exactly by Georgia. California, often assumed to be among the priciest states, ranks 9th at $5.89, and Texas ranks 19th at $5.36."
      - "Massachusetts costs $2.90 more than Wyoming and North Carolina, a gap of nearly 70%. That spread is wider than the difference between many entire countries on the international Big Mac Index."

