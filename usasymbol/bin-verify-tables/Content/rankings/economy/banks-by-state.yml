faq:
  - question: "Which state has the most bank branches?"
    answer: "California has the most bank branches of any state at 915. Florida ranks second at 608, and New York is third at 585."

  - question: "Which state has the fewest bank branches?"
    answer: "Wyoming has the fewest bank branches at just 16. North Dakota is next-lowest at 34."

  - question: "What is the most popular bank in the United States?"
    answer: "By state count, Wells Fargo is the most popular bank in 9 states, more than any other. By total branches nationwide, JPMorgan Chase is the largest bank at 4,970 branches."

  - question: "What is the most popular bank in California?"
    answer: "Chase is the most popular bank in California, with 4,806 branches nationwide. Chase is also the top bank in New York, Illinois, Arizona, Washington, Indiana, and Louisiana."

  - question: "What is the most popular bank in Texas?"
    answer: "Wells Fargo is the most popular bank in Texas. It is also the top bank in Florida, New Jersey, Minnesota, Colorado, Alaska, Nevada, New Mexico, and Wyoming."

  - question: "Why do Chase's and Wells Fargo's branch totals differ between the two tables on this page?"
    answer: "The per-state table lists Chase at 4,806 branches and Wells Fargo at 4,687. The national top-15 list, pulled on a different date, shows Chase at 4,970 and Wells Fargo at 4,227. The gap reflects different snapshot dates, since large banks open and close branches on an ongoing basis."

