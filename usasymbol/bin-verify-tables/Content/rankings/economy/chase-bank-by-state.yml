faq:
  - question: "Which state has the most Chase Bank locations?"
    answer: "California has the most Chase Bank locations of any state, with 900, about 17% of the US total. New York ranks second at 597, about 11%."

  - question: "Which states have no Chase Bank locations?"
    answer: "Hawaii and Alaska are the only US states with no Chase Bank locations. Five US territories also have none: Puerto Rico, American Samoa, Guam, the U.S. Virgin Islands, and the Northern Mariana Islands."

  - question: "How many Chase Bank locations are there in the United States?"
    answer: "There are 5,444 Chase Bank locations across the United States and its territories, as of March 25, 2026. They operate in 2,199 cities."

  - question: "Which US city has the most Chase Bank locations?"
    answer: "New York City has the most Chase Bank locations of any US city, at 121. Houston, Texas is second with 88, and Chicago, Illinois is third with 86."

  - question: "Which state has the densest Chase Bank presence?"
    answer: "New York has the densest Chase Bank presence of any state, one location per 32,586 residents, ahead of Arizona's one per 38,306, despite trailing California in total locations."

  - question: "Does Chase Bank have locations in Hawaii?"
    answer: "No. Hawaii is one of only two states, along with Alaska, with no Chase Bank locations."

