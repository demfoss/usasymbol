faq:
  - question: "Which state has the most Bank of America locations?"
    answer: "California has the most Bank of America locations of any state at 1,067, about 19% of the nationwide total of 5,731."

  - question: "Which states have no Bank of America locations?"
    answer: "12 states have no Bank of America locations: Alabama, Alaska, Hawaii, Louisiana, Mississippi, Montana, North Dakota, South Dakota, Vermont, West Virginia, Wisconsin, and Wyoming."

  - question: "Which city has the most Bank of America locations?"
    answer: "Houston has the most Bank of America locations of any U.S. city, with 85, ahead of New York City at 83 and Chicago at 69."

  - question: "How many Bank of America locations are there in the United States?"
    answer: "Bank of America operates 5,731 locations across 2,104 cities in 39 states and territories nationwide."

  - question: "How many Bank of America locations are in Texas?"
    answer: "Texas has 531 Bank of America locations, the second most of any state, with one location for every 54,610 residents."

  - question: "Does Bank of America have locations in Wisconsin?"
    answer: "No. Wisconsin is one of 12 states with no Bank of America locations, along with Alabama, Alaska, Hawaii, Louisiana, Mississippi, Montana, North Dakota, South Dakota, Vermont, West Virginia, and Wyoming."

