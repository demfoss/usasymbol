page:
  h1: "Infant Mortality Rate by State"

  quick_answer:
    - "Mississippi has the highest infant mortality rate of any state at 9.65 deaths per 1,000 live births, more than three times New Hampshire's rate of 2.97."
    - "New Hampshire has the lowest infant mortality rate at 2.97 per 1,000 live births. Arkansas ranks second-highest at 8.28, and Delaware is third at 7.77."
    - "Texas recorded the most infant deaths of any state at 2,226, even though its rate of 5.7 per 1,000 sits close to the national rate of 5.52. California is second in total deaths at 1,682 despite one of the lowest rates in the country, 4.18."

  methodology: "Rates are infant deaths per 1,000 live births, CDC NCHS 2024 data. The national rate was 5.52 per 1,000 in 2024, essentially unchanged from 5.61 in 2023. The District of Columbia is excluded."

  sources:
    - name: "CDC National Center for Health Statistics, Stats of the States: Infant Mortality"
      url: "https://www.cdc.gov/nchs/state-stats/deaths/infant-mortality.html"
      description: "Infant mortality rate and total infant deaths by state, 2024 data"

