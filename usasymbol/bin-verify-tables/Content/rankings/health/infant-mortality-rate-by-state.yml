faq:
  - question: "Which state has the highest infant mortality rate?"
    answer: "Mississippi has the highest infant mortality rate at 9.65 per 1,000 live births. Arkansas ranks second at 8.28."
  - question: "Which state has the lowest infant mortality rate?"
    answer: "New Hampshire's rate of 2.97 per 1,000 live births is the lowest in the country. New Jersey and Massachusetts follow at 3.37 and 3.49."
  - question: "What is the average infant mortality rate in the US?"
    answer: "The national infant mortality rate was 5.52 per 1,000 live births in 2024, essentially unchanged from 5.61 in 2023."
  - question: "Which state has the most infant deaths?"
    answer: "Texas has the most infant deaths at 2,226, ahead of California at 1,682 and Florida at 1,287. Its rate of 5.7 per 1,000 ranks only 27th, close to the national figure."
  - question: "What is the infant mortality rate in Texas?"
    answer: "Texas has an infant mortality rate of 5.7 per 1,000 live births, close to the national rate of 5.52, with 2,226 total infant deaths, the most of any state."
  - question: "What is the infant mortality rate in California?"
    answer: "California's infant mortality rate is 4.18 per 1,000 live births, one of the lowest in the country. Its 1,682 total infant deaths are still the second-highest of any state."

