faq:
  - question: "Which states have Stand Your Ground laws?"
    answer: "39 states have no duty to retreat. 30 have statutory Stand Your Ground laws, including Florida (2005), Texas (2007), Ohio (2021), and Iowa (2021). 9 others, including California, Virginia, and Vermont, have the same rule established by court decisions."

  - question: "Which states require retreat before using deadly force?"
    answer: "11 states impose a duty to retreat in public: Connecticut, Delaware, Hawaii, Maine, Maryland, Massachusetts, Minnesota, Nebraska, New Jersey, New York, and Rhode Island. The duty does not apply inside the home in any of the 11 states."

  - question: "What is the difference between a statutory and judicial Stand Your Ground rule?"
    answer: "A statutory Stand Your Ground rule is enacted by a state legislature, as in Florida (Fla. Stat. § 776.012) or Ohio (Ohio Rev. Code § 2901.09). A judicial rule carries the same legal effect but comes from a court decision, as in California (People v. Collins) or Virginia (Foote v. Commonwealth)."

  - question: "Does California have a Stand Your Ground law?"
    answer: "California has a judicial Stand Your Ground rule established in People v. Collins. Courts have held that a person is not required to retreat before using deadly force in self-defense. California has no statutory Stand Your Ground law."

  - question: "Does Florida have a Stand Your Ground law?"
    answer: "Florida has a statutory Stand Your Ground law under Fla. Stat. § 776.012, enacted in 2005. Florida was the first state in the country to enact a Stand Your Ground statute."

  - question: "Does New York have a Stand Your Ground law?"
    answer: "New York does not have a Stand Your Ground law. Under N.Y. Penal Law § 35.15, a person must retreat if it is possible with complete personal safety before using deadly force in public. The duty does not apply inside the home."

