  quick_answer:
    - "Occupational licensing burden is highest in Hawaii, which averages $506 in fees and 972 training days across the lower-income occupations it licenses."
    - "Nevada is close behind at $727 in average fees and 883 training days, while California ranks third with $517 and 837 days."
    - "Nebraska is the lightest state in this table at $92 and 114 days. Pennsylvania follows at $116 and 120 days, and Utah is next at $321 and 130 days."

  methodology: "Table 6 from the Institute for Justice report License to Work 3 compares average licensing burdens across 102 lower-income occupations using 2022 data. The published IJ table includes Washington, D.C., so this page excludes D.C. and renumbers the 50 states, and Colorado portability and cosmetology compact notes use current 2024-2026 state and compact sources."

  sources:
    - name: "Institute for Justice. License to Work 3. Ranking Burdens by State"
      url: "https://ij.org/report/license-to-work-3/report/results/ranking-burdens-by-state/"
      description: "Average fees, training days, exams, and occupation counts for 102 lower-income occupations by state, 2022 data"
    - name: "Colorado Division of Professions and Occupations. License Portability Program"
      url: "https://dpo.colorado.gov/LicensePortabilityProgram"
      description: "Official Colorado overview of its occupational credential portability program"
    - name: "Cosmetology Compact. News"
      url: "https://cosmetologycompact.gov/news/"
      description: "Official compact enactment updates through June 2026"
    - name: "Cosmetology Compact"
      url: "https://cosmetologycompact.gov/"
      description: "Official site explaining compact activation and multistate license status"

