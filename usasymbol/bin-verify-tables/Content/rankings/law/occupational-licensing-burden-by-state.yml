faq:
  - question: "Which state has the highest occupational licensing burden?"
    answer: "Hawaii ranks first on this page. It averages $506 in fees and 972 training days across the lower-income occupations it licenses."

  - question: "Which state has the lowest occupational licensing burden?"
    answer: "Nebraska ranks last in burden and first in ease. It averages just $92 in fees and 114 training days."

  - question: "What is the occupational licensing burden in Nevada?"
    answer: "Nevada ranks second-heaviest. It has the highest average fees in the state table at $727 and averages 883 training days."

  - question: "What is the occupational licensing burden in Colorado?"
    answer: "Colorado ranks 33rd in this 50-state version of the table. It averages $355 in fees, 257 training days, and 2 exams."

  - question: "Which states are in the cosmetology compact?"
    answer: "As of June 15, 2026, the compact news page lists 12 enacted states. Alabama, Arizona, Colorado, Delaware, Kansas, Kentucky, Maryland, Ohio, Tennessee, Virginia, Washington, and West Virginia. The official compact site also says the compact is not yet active."

  - question: "What is the easiest state to get a contractors license?"
    answer: "Utah is the strongest contractor-related outlier in this source set. IJ says Utah joined the least-burdensome group because of reforms to contractor specialty licenses, and Utah averages 130 training days and $321 in fees across licensed occupations overall."

