seo:
  title: "Rainwater Harvesting Laws by State"
  description: "Rainwater harvesting is legal in all 50 states. Colorado caps residential storage at 110 gallons, while Utah allows up to 2,500 gallons."

page:
  h1: "Rainwater Harvesting Laws by State"

  quick_answer:
    - "Rainwater harvesting laws by state are tightest in Colorado, where eligible homes can use only 2 rain barrels with a combined capacity of 110 gallons."
    - "Utah allows up to 2,500 gallons, but systems above 2 covered containers or above 100 gallons per container require registration with the state."
    - "All 50 states allow rainwater harvesting in some form. California and Washington also mark small-system thresholds at 360 gallons for common outdoor setups."

  methodology: "This page uses NTO Tank's July 2024 50-state compilation as the base dataset and rechecks Colorado, Utah, California, and Washington against official state sources accessed on June 25, 2026. The map covers ordinary residential collection rules, not every plumbing, health, commercial, or local permit rule."

  sources:
    - name: "NTO Tank. Rainwater Harvesting Laws, Regulations, and Rights by US State"
      url: "https://www.ntotank.com/blog/rainwater-harvesting-laws-regulations-and-rights-by-us-state"
      description: "50-state compiled overview used as the base working dataset"
    - name: "Colorado General Assembly. HB16-1005 Residential Precipitation Collection"
      url: "https://leg.colorado.gov/bills/hb16-1005"
      description: "Colorado's official 2-barrel and 110-gallon residential limit"
    - name: "Utah Division of Water Rights. Rainwater Harvesting Registration"
      url: "https://waterrights.utah.gov/forms/rainwater.asp"
      description: "Utah registration thresholds and 2,500-gallon maximum storage rule"
    - name: "California State Water Resources Control Board. Water Rights FAQs"
      url: "https://www.waterboards.ca.gov/waterrights/board_info/faqs.html"
      description: "California rooftop rainwater collection does not require a water right permit"
    - name: "Washington State Department of Ecology. Rainwater Collection"
      url: "https://ecology.wa.gov/water-shorelines/water-supply/water-recovery-solutions/rainwater-collection"
      description: "Washington policy on rainwater collection without a water right permit"

