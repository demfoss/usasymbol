faq:
  - question: "Is it illegal to collect rainwater by state?"
    answer: "No state on this page makes rainwater harvesting broadly illegal. All 50 states allow it in some form, but Colorado limits eligible homes to 110 gallons and Utah requires registration above small-container thresholds."

  - question: "What are the Colorado rain barrel laws?"
    answer: "Colorado allows up to 2 rain barrels with a combined storage capacity of 110 gallons or less. The water must come from an eligible residential rooftop and stay on that same property for outdoor use."

  - question: "What are the Utah rainwater harvesting laws?"
    answer: "Utah allows up to 2,500 gallons. A person can avoid registration only with no more than 2 covered containers and no container above 100 gallons."

  - question: "What is the rainwater harvesting law in California?"
    answer: "California says rooftop rainwater harvesting does not require a water right permit. Common small-system thresholds in the source material are 360 gallons for simple rain barrel setups and up to 5,000 gallons for some outdoor non-spray systems."

  - question: "Which state has the lowest rainwater storage limit?"
    answer: "Colorado has the lowest clear statewide cap on this page at 110 gallons. Utah is much higher at 2,500 gallons, and most other states in the source material do not list a statewide residential gallon cap."

  - question: "What are the rainwater harvesting laws in Washington?"
    answer: "Washington generally does not require a water-right permit for rainwater collection under state policy. The source material also uses 360 gallons as the common threshold where small exterior irrigation systems may avoid other permits."

