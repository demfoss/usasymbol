faq:
  - question: "What states have legalized recreational marijuana in 2026?"
    answer: "24 states allow recreational marijuana in 2026: Alaska, Arizona, California, Colorado, Connecticut, Delaware, Illinois, Maine, Maryland, Massachusetts, Michigan, Minnesota, Missouri, Montana, Nevada, New Jersey, New Mexico, New York, Ohio, Oregon, Rhode Island, Vermont, Virginia, and Washington. Ohio was the most recent to open retail dispensaries, in August 2024."

  - question: "Is marijuana legal in Texas in 2026?"
    answer: "Recreational and standard medical marijuana remain illegal in Texas. The Compassionate Use Program (CUP) permits low-THC products capped at 0.5% THC for patients with qualifying conditions including epilepsy, PTSD, and cancer. No smokeable flower is allowed under the program."

  - question: "Which states is marijuana fully illegal in?"
    answer: "Idaho, Kansas, South Carolina, and Wyoming are the only 4 states with a complete prohibition in 2026. No medical, decriminalized, or CBD dispensary provision exists in any of the four. Possession carries criminal charges in all four."

  - question: "What state allows the most marijuana to carry legally?"
    answer: "New Jersey allows the highest recreational possession limit at 6 oz. Missouri and New York each permit 3 oz. For medical-only states, Oklahoma allows patients to carry 3 oz on their person and 6 oz at home — the highest personal possession limits in any non-recreational state."

  - question: "Is medical marijuana legal in Florida?"
    answer: "Yes. Amendment 2 (2016) legalized medical marijuana in Florida. Qualified patients may purchase up to 2.5 oz of smokeable flower per 35-day period. Recreational marijuana remains illegal after Amendment 3 failed with 55.9% of the vote in November 2024, short of the required 60% supermajority."

  - question: "What is the difference between decriminalized and legal marijuana?"
    answer: "Decriminalization removes criminal penalties for small-amount possession, replacing them with a civil fine, but does not allow legal purchase or sale at dispensaries. North Carolina has decriminalized possession of under 0.5 oz since 1977, carrying only a $200 fine, but has no medical program and no legal dispensaries. In fully legal states, adults 21+ can purchase from licensed retailers."

