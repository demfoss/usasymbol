page:
  h1: "Exotic Pet Laws by State"

  quick_answer:
    - "27 states ban private ownership of big cats, bears, and non-human primates outright, while Arkansas and Virginia impose partial bans. 20 states allow exotic animals with a license or permit."
    - "Texas requires a Certificate of Registration for 19 specified dangerous species, including lions, tigers, bears, baboons, chimpanzees, and gorillas. Florida uses a tiered permit system, with Class I animals (tigers, lions, bears, chimpanzees) requiring inspection and fees."
    - "Virginia bans non-native predatory cats, wolves, bears, and crocodiles but places no state requirement on persons possessing non-human primates. Kansas bans big cats and bears under its Dangerous Regulated Animal statute but does not explicitly address primate ownership."

  methodology: "Legal status reflects state statutes and administrative codes as of June 2026, compiled from Born Free USA state law summaries and individual state wildlife agency regulations, using the B, B*, L, N Born Free USA classification system, and animals in grandfathered possession before effective dates may be retained under applicable permits in several states. This page is for informational purposes only and does not constitute legal advice."

  sources:
    - name: "Born Free USA — Exotic Animal Laws by State"
      url: "https://www.bornfreeusa.org/b4a2_exotic_animals_state.php"
      description: "State-by-state exotic animal law summaries with B/B*/L/N classification for all 50 states"
    - name: "USDA APHIS — Animal Welfare Act"
      url: "https://www.aphis.usda.gov/animal-welfare"
      description: "Federal licensing requirements for exhibitors and dealers of regulated animals, which apply alongside state law"

