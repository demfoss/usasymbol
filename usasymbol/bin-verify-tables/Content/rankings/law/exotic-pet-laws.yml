faq:
  - question: "Can you own a tiger in Texas?"
    answer: "Yes, with a Certificate of Registration issued under Tex. Health & Safety Code § 822.101. Tigers are among 19 specified dangerous wild animals that may be privately owned in Texas with registration. Lions, leopards, cheetahs, jaguars, bears, hyenas, baboons, chimpanzees, orangutans, and gorillas are also on the list."

  - question: "Which states allow you to own a monkey?"
    answer: "20 states allow non-human primate ownership with a license or permit, including Texas, Florida, Pennsylvania, New York, and South Dakota. Virginia places no state-level restriction on primates. Kansas and Wyoming also do not explicitly regulate primate ownership. North Carolina has no statewide permit requirement for any exotic animal, including primates."

  - question: "Which states ban big cat ownership?"
    answer: "27 states ban private ownership of big cats outright, including California, Ohio, New York, Illinois, and Washington. Arkansas and Virginia add partial bans that include big cats. 20 states require a permit or license. North Carolina is the only state with no statewide prohibition or permit requirement for big cats."

  - question: "Is it legal to own a bear in Florida?"
    answer: "Bears are classified as Class I wildlife in Florida, requiring a permit from the Fish and Wildlife Conservation Commission. Class I permits are subject to inspection and are issued primarily for exhibitors and educational facilities. Private pet ownership of bears is effectively prohibited for most residents."

  - question: "What is the most lenient state for exotic pet laws?"
    answer: "North Carolina is the only state with no statewide permit or license requirement for exotic animals, leaving regulation to individual counties. Among permit states, Texas allows 19 specified dangerous species including tigers and chimpanzees under a Certificate of Registration."

  - question: "Can you own a lion in California?"
    answer: "No. California bans all carnivores besides domestic cats and dogs under Cal. Fish & Game Code § 2118. Lions belong to the family Felidae, which is entirely prohibited. A revocable nontransferable permit exists in law but is not issued for private pet possession."

