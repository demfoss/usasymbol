faq:
  - question: "Which states have alienation of affection laws?"
    answer: "Five states have alienation of affection laws on June 25, 2026. Hawaii, Mississippi, North Carolina, South Dakota, and Utah are the full list."

  - question: "Can you sue a homewrecker in North Carolina?"
    answer: "Yes. North Carolina still allows the claim under G.S. 52-13, and the current source set includes North Carolina awards up to $30 million."

  - question: "Is alienation of affection legal in New Mexico?"
    answer: "No. The New Mexico Supreme Court abolished alienation of affections on January 26, 2026, so New Mexico is gray on this map."

  - question: "Can you sue a homewrecker in Illinois?"
    answer: "No for modern claims. Illinois says an action may not be brought for alienation of affections based on facts occurring on or after January 1, 2016."

  - question: "Which state has the biggest alienation of affection award?"
    answer: "North Carolina has the biggest dollar figure in this source set at $30 million. Mississippi is far lower at $756,500, while South Dakota shows $265,000 and Utah shows $84,600."

  - question: "Is Utah still an alienation of affection state in 2026?"
    answer: "Yes on June 25, 2026. Utah enacted a repeal, but the Utah code says the abolition takes effect on May 5, 2027."

