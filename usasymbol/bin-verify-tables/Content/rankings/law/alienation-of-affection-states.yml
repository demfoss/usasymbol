seo:
  title: "Alienation of Affection States | Map, Laws & Cases"
  description: "Five states still allow alienation of affection claims on June 25, 2026. New Mexico ended the tort in January 2026, and Illinois did so in 2016."

page:
  h1: "Alienation of Affection States"

  quick_answer:
    - "Alienation of affection states number five on June 25, 2026. Hawaii, Mississippi, North Carolina, South Dakota, and Utah still allow the claim."
    - "New Mexico is the sharpest recent change. The New Mexico Supreme Court abolished alienation of affections on January 26, 2026."
    - "Illinois is not a yes state anymore. Illinois bars alienation of affections suits based on facts occurring on or after January 1, 2016."

  methodology: "This page starts with the six jurisdictions listed by North Carolina case law in 2019, then updates the map with the New Mexico Supreme Court's January 26, 2026 abolition and Utah's delayed repeal that takes effect on May 5, 2027. Illinois is marked No because 740 ILCS 5 bars new alienation of affections suits based on facts occurring on or after January 1, 2016."

  sources:
    - name: "North Carolina General Statutes. G.S. 52-13"
      url: "https://www.ncleg.gov/enactedlegislation/statutes/html/bysection/chapter_52/gs_52-13.html"
      description: "Current North Carolina statute governing alienation of affection claims"
    - name: "Dipasupil v. Neely, North Carolina Court of Appeals, 2019"
      url: "https://law.justia.com/cases/north-carolina/court-of-appeals/2019/18-1207.html"
      description: "North Carolina appellate opinion identifying the then-six recognizing jurisdictions"
    - name: "New Mexico Administrative Office of the Courts. Jan. 26, 2026 release"
      url: "https://nmcourts.gov/wp-content/uploads/2026/01/NM-Supreme-Court-issues-opinion-abolishing-lawsuits-for-alienation-of-affections.pdf"
      description: "Official announcement that the New Mexico Supreme Court abolished alienation of affections"
    - name: "Illinois Compiled Statutes. Alienation of Affections Abolition Act"
      url: "https://www.ilga.gov/Legislation/ILCS/Articles?ActID=2019&Chapter=CIVIL+LIABILITIES&ChapterID=57++&MajorTopic=RIGHTS+AND+REMEDIES&Print=True"
      description: "Illinois law barring new alienation of affections actions after January 1, 2016"
    - name: "Utah Code Title 78B, Chapter 3"
      url: "https://le.utah.gov/xcode/Title78B/Chapter3/C78B-3_2025050720250507.pdf"
      description: "Current Utah code showing repeal effective May 5, 2027"
    - name: "Hunt v. Chang, Hawaii Supreme Court, 1979"
      url: "https://law.justia.com/cases/hawaii/supreme-court/1979/6197-2.html"
      description: "Modern Hawaii appellate reference for alienation of affection claims"
    - name: "Jerry Fitch, Sr. v. Johnny Valentine, Mississippi Supreme Court, 2007"
      url: "https://law.justia.com/cases/mississippi/supreme-court/2007/co38379.html"
      description: "Mississippi case confirming the tort and listing a $756,500 judgment"
    - name: "South Dakota Codified Law 20-9-7"
      url: "https://sdlegislature.gov/Statutes/20-9-7"
      description: "South Dakota statute on forbidden interference with personal relations"
    - name: "Richardson v. Richardson, South Dakota Supreme Court, 2017"
      url: "https://law.justia.com/cases/south-dakota/supreme-court/2017/27754.html"
      description: "South Dakota opinion stating the legislature has not abolished alienation of affections"
    - name: "Nelson v. Jacobsen, Utah Supreme Court, 1983"
      url: "https://law.justia.com/cases/utah/supreme-court/1983/17667-0.html"
      description: "Utah decision upholding an $84,600 alienation of affections judgment"
    - name: "Beavers v. McMican, North Carolina Court of Appeals, 2022"
      url: "https://law.justia.com/cases/north-carolina/court-of-appeals/2022/21-85.html"
      description: "North Carolina opinion discussing awards from $100,000 to $30 million"

