faq:
  - question: "What states meet at Four Corners?"
    answer: "Four states meet at Four Corners: Arizona, Colorado, New Mexico, and Utah. Their borders converge at a single point — the only quadripoint in the United States — at approximately 36.9991°N, 109.0453°W in the southwestern United States."

  - question: "Where is the Four Corners Monument?"
    answer: "The Four Corners Monument is located at approximately 36.9991°N, 109.0453°W, on Navajo Nation land in the southwestern United States. It is accessible from U.S. Highway 160 and is approximately 290 miles from Phoenix, 215 miles from Santa Fe, 345 miles from Denver, and 430 miles from Salt Lake City."

  - question: "Who operates the Four Corners Monument?"
    answer: "The Four Corners Monument is operated by the Navajo Nation through Navajo Parks and Recreation. The monument sits on Navajo Nation land, and the Navajo Nation and the Ute Mountain Ute Tribe both have reservations that meet at the same quadripoint. An entry fee is required."

  - question: "Is the Four Corners Monument in the right location?"
    answer: "The monument's legal location is correct, but it does not stand at the mathematically precise GPS intersection of the original survey lines. A 2009 National Geodetic Survey found the monument is approximately 1,807 feet east of where a GPS-based calculation would place the exact corner. However, Congress has confirmed the legal boundary at the monument's location — established surveys accepted by all four states cannot be moved."

  - question: "Is there a Four Corners in Wyoming?"
    answer: "Yes, Four Corners is a census-designated place in Natrona County, Wyoming, near Casper, with a population of approximately 3,200. It has no connection to the famous quadripoint. The name refers to intersecting section lines in the Public Land Survey System — a common naming pattern across the western United States."

  - question: "What is a quadripoint?"
    answer: "A quadripoint is a point at which four distinct territories share a single border. The Four Corners in Arizona, Colorado, New Mexico, and Utah is the only quadripoint in the United States. Most U.S. state borders meet at tripoints — where three states touch — but the rectangular survey grid used to establish western state borders created the single quadripoint at Four Corners."

