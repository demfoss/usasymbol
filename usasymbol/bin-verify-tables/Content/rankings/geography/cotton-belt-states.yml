sections:
  - id: "what-states-are-in-the-cotton-belt"
    icon: "fa-solid fa-map-location-dot"
    title: "What States Are in the Cotton Belt?"
    paragraphs:
      - "Six states form the Cotton Belt core: Alabama, Arkansas, Georgia, Louisiana, Mississippi, and South Carolina. Cotton was the dominant cash crop in all six during the antebellum period. Eli Whitney's cotton gin, invented at a Georgia plantation in 1793, made short-staple cotton viable across the region and triggered the plantation economy that defined the antebellum South."
      - "Four states form the extended Cotton Belt: North Carolina (southeastern counties), Oklahoma (southeastern counties), Tennessee (western counties only), and Texas (eastern counties). Texas now ranks 1st in the U.S. at approximately 7,000,000 planted acres, but its dominant production area, the irrigated High Plains near Lubbock, is a 20th-century development unrelated to the historic belt."

  - id: "cotton-belt-railroad-disambiguation"
    icon: "fa-solid fa-train"
    title: "The Cotton Belt Railroad Is a Different Thing"
    paragraphs:
      - "The St. Louis Southwestern Railway was known as the Cotton Belt Route, a freight railroad founded in 1877. It ran from Dallas and Houston through Texarkana and Little Rock to Memphis and St. Louis, built specifically to haul cotton from Texas and Arkansas to Mississippi River ports. Southern Pacific absorbed it in 1932, and Union Pacific acquired it in 1992."
      - "Searches for 'Cotton Belt' frequently return railroad results alongside geographic results. They share a name because the railroad was built to serve the agricultural region, but are distinct: the Cotton Belt region covers 10 states, while the Cotton Belt railway route covered a single corridor through 4."

