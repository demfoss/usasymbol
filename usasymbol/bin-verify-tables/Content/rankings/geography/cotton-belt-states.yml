page:
  h1: "Cotton Belt States"

  quick_answer:
    - "The Cotton Belt is the historic cotton-growing region of the American South, centered on Mississippi, Alabama, and Georgia. Its core includes 6 states where cotton was the dominant crop in the antebellum economy."
    - "Texas now ranks 1st in U.S. cotton production at approximately 7,000,000 planted acres but is classified as Extended Cotton Belt because its dominant production area, the irrigated High Plains near Lubbock, is a 20th-century development, not the historic belt. Louisiana ranks last among the 10 states at approximately 75,000 acres."
    - "Note: 'Cotton Belt' also refers to the St. Louis Southwestern Railway, a freight railroad that ran through Texas, Arkansas, and Tennessee. The railroad and the agricultural region share the name but are unrelated, this page covers the geographic region."

  methodology: "Cotton Belt classification (Core / Extended) reflects the historic geographic consensus — states where short-staple cotton was the primary cash crop in the antebellum South and through the early 20th century, per USDA historical records and academic literature. Planted acreage figures are approximate 2022 values from USDA NASS and reflect whole-state modern production, not only the Cotton Belt portion of each state."

  sources:
