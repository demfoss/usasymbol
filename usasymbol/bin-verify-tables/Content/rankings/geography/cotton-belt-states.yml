faq:
  - question: "What states are in the Cotton Belt?"
    answer: "Six states form the Cotton Belt core: Alabama, Arkansas, Georgia, Louisiana, Mississippi, and South Carolina. Four states are in the extended Cotton Belt: North Carolina (southeast), Oklahoma (southeast), Tennessee (west), and Texas (east). The region centers on the Mississippi Delta and the Deep South states most economically dependent on cotton before the Civil War."

  - question: "What is the Cotton Belt region?"
    answer: "The Cotton Belt is the historic geographic region of the American South where short-staple cotton was the dominant cash crop from the late 18th century through the early 20th century. It centers on Mississippi, Alabama, and Georgia. Today, Texas leads U.S. cotton production at approximately 7,000,000 planted acres, but Georgia (1,100,000 acres) is the leading Core Belt state in modern output."

  - question: "Is the Cotton Belt the same as the Deep South?"
    answer: "They strongly overlap but are not identical. The five core Deep South states — Alabama, Georgia, Louisiana, Mississippi, and South Carolina — are all core Cotton Belt states. Arkansas is in the Cotton Belt but debated as Deep South. North Carolina, Tennessee, Texas, and Oklahoma have Cotton Belt regions but are not typically called Deep South."

  - question: "What is the Cotton Belt railroad?"
    answer: "The Cotton Belt Route is the nickname for the St. Louis Southwestern Railway, a freight railroad founded in 1877. Its route ran from Dallas and Houston through Little Rock and Memphis to St. Louis. Southern Pacific absorbed it in 1932, and Union Pacific acquired it in 1992. It is unrelated to the geographic Cotton Belt region beyond sharing the name."

