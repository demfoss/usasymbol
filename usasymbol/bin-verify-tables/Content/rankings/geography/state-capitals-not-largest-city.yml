  title: "State Capitals Not Largest Cities | Map & Facts"
  description: "In 33 states, the state capital is not the largest city. Many capitals were chosen for geography, politics, history, or central location."

page:
  h1: "State Capitals Not Largest Cities"

  quick_answer:
    - "Of the 50 U.S. states, 33 have a capital that is not the largest city, including Springfield, Illinois, which shares a state with Chicago. Only 17 capitals, among them Phoenix and Denver, are also their state's most populous city."
    - "The gaps range from modest (Saint Paul, Minnesota is smaller than Minneapolis by about 118,000 people) to staggering (Albany, New York is smaller than New York City by more than 8.2 million). Three forces drove most placements: legislators choosing a geographic midpoint, deliberate separation of political from commercial power, and simple timing -- the capital was fixed before the state's future economic engine existed."

  methodology: "Population uses 2020 Census city-proper totals, not metro areas. Consolidated city-counties use consolidated totals."

  sources:
    - name: "U.S. Census Bureau -- 2020 Decennial Census"
      url: "https://www.census.gov/programs-surveys/decennial-census/decade/2020/2020-census-main.html"
