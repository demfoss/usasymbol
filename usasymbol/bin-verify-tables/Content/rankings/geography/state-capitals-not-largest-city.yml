sections:
  - id: "why-capitals-are-not-largest-cities"
    icon: "fa-solid fa-landmark-dome"
    title: "Why Capitals Weren't Placed in the Largest City"
    paragraphs:
      - "The most common explanation is geography: legislators drawing frontier state maps consistently chose a midpoint rather than a coastal or river-port hub that already dominated commerce. Tallahassee became Florida's capital in 1824 because it split the distance between St. Augustine on the Atlantic and Pensacola on the Gulf. Pierre, South Dakota sits near the state's geographic center, chosen so eastern Black Hills towns could not monopolize government access. See all [U.S. state capitals](/rankings/geography/states-capital-cities)."
      - "A second force was deliberate separation of political from economic power. New York's merchant class was concentrated in New York City, and legislators wanted the lawmaking apparatus outside that commercial orbit, so Albany, 150 miles north on the Hudson, gave government a different center of gravity. The same logic put Sacramento above San Francisco, shifting power toward the interior valleys where most farming would later occur."
      - "The third reason is simple timing. Springfield became Illinois's capital in 1837 when Chicago was a lake-front village of about 4,000 people, and no one imagined Chicago would become a railroad hub within 30 years. By the time Chicago's dominance was obvious, Springfield had a statehouse and government apparatus too embedded to relocate. The same dynamic played out in Olympia, Washington, and Lansing, Michigan, small towns overtaken by industrial cities that did not yet exist."

  - id: "most-extreme-cases"
    icon: "fa-solid fa-chart-bar"
    title: "The Most Extreme Cases"
    paragraphs:
      - "Montpelier, Vermont is the smallest state capital in the country, with 7,855 residents in the 2020 Census -- smaller than many suburban high schools. Burlington, Vermont's largest city, is more than five times larger at 45,012. Montpelier has been Vermont's capital since 1805 and has never exceeded about 10,000 residents. Its survival as a capital owes partly to Burlington's position near the Canadian border, which made it geographically peripheral to much of the state."
      - "The widest raw population gap is New York: Albany (99,224) versus New York City (8,336,817), a difference of more than 8.2 million. That gap traces to deliberate 17th-century Dutch planning, Fort Orange (later Albany) as a fur-trading depot versus New Amsterdam commanding the harbor mouth, made permanent by New York City's commercial explosion. Springfield, Illinois presents the most dramatic ratio: a capital of 114,000 sharing a state with Chicago's 2.7 million, roughly 24 to 1."
      - "Juneau, Alaska occupies a category of its own, the only U.S. state capital with no road connection to the rest of the state, reachable only by air or sea. Anchorage, the actual population center with 291,247 residents, is accessible by highway to most of the state. The Alaska Legislature has considered relocating the capital closer to Anchorage since the 1970s, but cost estimates in the billions have defeated every effort. Juneau became capital in 1906 as Alaska's most active mining town."

  - id: "states-where-capital-is-largest-city"
    icon: "fa-solid fa-city"
    title: "The 17 States Where the Capital IS the Largest City"
    paragraphs:
      - "The 17 states where the capital and largest city are the same: Arizona (Phoenix), Arkansas (Little Rock), Colorado (Denver), Georgia (Atlanta), Hawaii (Honolulu), Idaho (Boise), Indiana (Indianapolis), Iowa (Des Moines), Massachusetts (Boston), Mississippi (Jackson), Ohio (Columbus), Oklahoma (Oklahoma City), Rhode Island (Providence), South Carolina (Columbia), Utah (Salt Lake City), West Virginia (Charleston), and Wyoming (Cheyenne). No single region dominates the list -- it spans New England, the Deep South, and the Mountain West."
      - "Western states account for a disproportionate share largely because those territories were organized when the designated city was the only significant settlement. Phoenix was selected as Arizona's territorial capital in 1889 when the Salt River Valley had no rival city, and it simply kept growing."
      - "In the East, the pattern is different: Boston, Providence, and Columbus were already established commercial centers when designated as capitals. Boston had been the seat of colonial government since the 1630s and the legislature saw no reason to create a new administrative city. Columbus, Ohio is the rare exception -- purpose-built as a capital in 1816 on a nearly empty site at the center of the state, yet it grew so quickly via railroad connections that it eventually surpassed Cincinnati and Cleveland to become Ohio's largest city."

