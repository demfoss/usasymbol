seo:
  title: "Lighthouses by State | Map, Counts & Historic Lights"
  description: "Michigan has 203 active and historic lights, more than any state. Cape Hatteras is the tallest U.S. lighthouse at 198 feet."

page:
  h1: "Lighthouses by State"

  quick_answer:
    - "Michigan has the most lighthouses of any state, with 203 active and historic lights on record. New York ranks second with 142, followed by Texas with 104."
    - "North Carolina has the tallest traditional lighthouse. Cape Hatteras Light rises 198 feet, while Virginia's Cape Charles Light reaches 191 feet and Florida's Ponce de Leon Inlet Light reaches 175 feet."
    - "New Jersey has the oldest standing and operating U.S. lighthouse. Sandy Hook Light was first lit in 1764, 27 years before Maine's Portland Head Light in 1791."

  methodology: "Counts come from the ARLHS World List of Lights and include active aids, historic stations, and range and pier lights, so they run higher than surviving-tower totals. Heights and first-lit dates follow U.S. Coast Guard and National Park Service records."

  sources:
    - name: "ARLHS World List of Lights"
      url: "https://wlol.arlhs.com/index.php?mode=na"
      description: "2026 state registry totals for active and historic lights"
