faq:
  - question: "Which state has the most lighthouses?"
    answer: "Michigan has the most lighthouses with 203 active and historic lights. New York follows with 142, and Texas ranks third with 104."

  - question: "How many lighthouses are in each state?"
    answer: "There are 1,431 active and historic lights on record across 35 states, ranging from Michigan's 203 to one each in Missouri, Oklahoma, and West Virginia. Fifteen states have none."

  - question: "What is the tallest lighthouse in the United States?"
    answer: "Cape Hatteras Light in North Carolina is the tallest traditional U.S. lighthouse at 198 feet. It is 7 feet taller than Virginia's 191-foot Cape Charles Light."

  - question: "What is the oldest lighthouse in the United States?"
    answer: "Sandy Hook Light in New Jersey is the oldest standing U.S. lighthouse. First lit in 1764, it remains an active aid to navigation."

  - question: "Which Great Lakes state has the most lighthouses?"
    answer: "Michigan leads the Great Lakes states with 203 active and historic lights. Wisconsin ranks second within that group at 76, followed by Ohio with 37."

  - question: "What is the most visited lighthouse in the United States?"
    answer: "Cape Hatteras Light Station in North Carolina draws about 500,000 visitors a year, the most of any U.S. lighthouse. The surrounding lighthouse area receives more than 1 million visits in a typical year."

