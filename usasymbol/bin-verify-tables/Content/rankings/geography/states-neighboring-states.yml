faq:
  - question: "Which state has the most bordering states?"
    answer: "Missouri and Tennessee are tied with 8 bordering states each. Missouri borders Iowa, Illinois, Kentucky, Tennessee, Arkansas, Oklahoma, Kansas, and Nebraska. Tennessee borders Kentucky, Virginia, North Carolina, Georgia, Alabama, Mississippi, Arkansas, and Missouri."
  
  - question: "Which states have no bordering states?"
    answer: "Alaska and Hawaii are the only U.S. states with no bordering states. Alaska shares a border with Canada but not with any other U.S. state. Hawaii is an island state in the Pacific Ocean, over 2,400 miles from the nearest U.S. state."
  
  - question: "What state only borders one other state?"
    answer: "Maine is the only continental U.S. state that borders just one other state — New Hampshire. Maine's other borders are with Canada (New Brunswick and Quebec). Maine is sometimes called 'the tail of the dog' because of its position on the northeastern corner of the U.S."
  
  - question: "What four states meet at one point?"
    answer: "Arizona, Colorado, New Mexico, and Utah meet at the Four Corners — the only place in the U.S. where four states touch at a single point. The Four Corners monument marks this location, which sits within the Navajo Nation."
  
  - question: "How many states does Texas border?"
    answer: "Texas borders 4 states: New Mexico to the west, Oklahoma to the north, Arkansas to the northeast, and Louisiana to the east. Despite being the second-largest state by area, Texas has fewer neighbors than smaller states like Missouri (8) or Kentucky (7) because much of its border is coastline or the international border with Mexico."
  
  
  - question: "Which states have only two borders?"
    answer: "Four states border only 2 other U.S. states: Florida (Alabama and Georgia), South Carolina (Georgia and North Carolina), Rhode Island (Connecticut and Massachusetts), and Washington (Idaho and Oregon). Alaska and Hawaii are a separate case — they have zero U.S. state borders."

