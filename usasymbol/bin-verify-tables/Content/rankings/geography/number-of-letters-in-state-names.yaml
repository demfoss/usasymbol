faq:
  - question: "Which name has the most letters in the state list?"
    answer: "District of Columbia has the highest listed count at 18 letters. Among the 50 states, Massachusetts, North Carolina, and South Carolina share the lead with 13 each."
  - question: "Which states have the longest names?"
    answer: "Massachusetts, North Carolina, and South Carolina have the longest state names at 13 letters each."
  - question: "Which states have the shortest names?"
    answer: "Iowa, Ohio, and Utah have 4 letters each, the lowest count among the 50 states. Idaho, Maine, and Texas follow with 5."
  - question: "How many letters are in District of Columbia?"
    answer: "District of Columbia has 18 letters when its two spaces are excluded."
  - question: "What is the most common number of letters in a state name?"
    answer: "Eight letters is the most common length, shared by 11 states. Seven letters is next with 9 states."
  - question: "How many letters are in North Carolina?"
    answer: "North Carolina has 13 letters and shares the longest state name length with Massachusetts and South Carolina."

