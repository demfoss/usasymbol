sections:
  - id: "eastern-central-split"
    icon: "fa-solid fa-clock"
    title: "Which States Are Split Between Eastern and Central Time"
    paragraphs:
      - "Five states straddle the Eastern/Central boundary, and none of them feel obvious on a map. Florida's panhandle swings so far west that Pensacola sits firmly in Central Time while Miami, 850 miles east in the same state, follows Eastern. The Apalachicola River marks the rough dividing line, placing eight panhandle counties one hour behind the rest of Florida."
      - "Kentucky's split is a product of its long western reach toward the Mississippi River. The counties closest to Missouri and the western Tennessee border, including Fulton and Hickman, run Central. Most Kentuckians never encounter the line, but it becomes hard to ignore near Hopkinsville and the communities in the far western corner of the state."
      - "Michigan's situation is the most counterintuitive on the list. The entire Lower Peninsula runs Eastern, but two Upper Peninsula counties, Gogebic and Ironwood, use Central Time. This isn't administrative accident, these communities are economically tied to Wisconsin, so the DOT drew the boundary to match their real commercial orientation. Michigan periodically debates whether the whole UP should simply consolidate with Wisconsin's time."
      - "Indiana had one of the most chaotic time zone histories in the country. Before 2006, different counties observed different times, and some skipped DST entirely, making Indiana scheduling a national punch line. The state unified under Eastern in 2006, with select southwestern counties near Evansville and northwestern counties near Chicago remaining Central to stay aligned with their neighboring metro areas."
      - "Tennessee's split follows the Tennessee River roughly through the middle of the state. Memphis and the counties along the Mississippi run Central, while Nashville, Knoxville, and Chattanooga hold Eastern. The boundary roughly traces the old divide between West Tennessee and the rest of the state, a fault line that goes back to the Civil War, when East Tennessee was strongly Unionist while the western counties went Confederate."

  - id: "central-mountain-pacific-splits"
    icon: "fa-solid fa-map-location-dot"
    title: "States Split Across Central, Mountain, and Pacific"
    paragraphs:
      - "Texas's split is the most geographically logical on the list. El Paso and Hudspeth County are so far west that El Paso is closer to Los Angeles than to Houston, by about 200 miles, which also explains why Texas ranks near the top of the [U.S. states by land area](/rankings/geography/states-by-land-area) list. The city shares a metro area with Ciudad Juárez, Mexico, which runs Mountain Time. Mountain Time in El Paso isn't an anomaly, it's the only arrangement that makes practical sense."
      - "Nevada's Mountain/Pacific split exists almost entirely because of one town, West Wendover, which sits directly on the Nevada-Utah border and runs on Salt Lake City's weekend gambling traffic. The DOT placed West Wendover in Mountain Time to align it with its customers. Jackpot, a smaller casino town near the Idaho border, was placed in Mountain for the same reason, since Idaho's southern counties also run Mountain. See the [neighboring states by state](/rankings/geography/states-neighboring-states) map."
      - "Idaho's Pacific/Mountain divide is one of the sharpest in the country. The northern panhandle, including Coeur d'Alene and Sandpoint, orbits Spokane and runs Pacific. The rest of Idaho runs Mountain. The boundary was drawn because the panhandle's entire commercial gravity points toward Spokane, Washington, not toward Boise."
      - "Oregon's split is the least known. Malheur County, in the state's arid southeast corner, uses Mountain Time. The county's towns, Ontario, Nyssa, and Vale, sit right on the Idaho border and do most of their trade with Boise, which runs Mountain. It's effectively Boise's time zone applied to an Oregon county, one of the cleaner examples of commerce drawing the clock line."
      - "South Dakota divides cleanly through its center. The Black Hills, including Rapid City, Deadwood, and Hot Springs, run Mountain, while Sioux Falls and Pierre run Central. North Dakota has a smaller version in its far southwestern corner, where three counties along the Montana border follow Mountain. Nebraska and Kansas work the same way, with panhandle and far-western county pockets whose grain schedules and trade routes run toward Colorado and Wyoming, not east."

  - id: "alaska-arizona-special"
    icon: "fa-solid fa-globe"
    title: "Alaska and Arizona's Time Zone Exceptions"
    paragraphs:
      - "Alaska covers so much longitude, roughly 57 degrees, that it crosses multiple natural time zones. Federal code places the state in Alaska Time for its populated regions, with the far western Aleutian Islands (west of 169°30′ W) in Hawaii-Aleutian Time. In practice, the Hawaii-Aleutian portion of Alaska is nearly uninhabited, covering remote western Aleutian islands including Attu, the westernmost point of the United States. For almost every Alaskan, there is one clock."
      - "Arizona's situation is structurally different from every other state on this list. The DOT doesn't draw a boundary through Arizona, the whole state falls under Mountain Time, but Arizona doesn't observe DST, so it stays on MST year-round. The Navajo Nation, covering a reservation in northeastern Arizona, observes DST by tribal decision, running an hour ahead in summer. The Hopi Reservation, enclosed by Navajo land, does not observe DST, syncing back with the rest of Arizona."
      - "Whether Arizona counts as a split state depends entirely on what you're measuring. By federal boundary lines: no. By clocks that differ inside state borders: yes, seasonally. The honest answer is 14 states under federal code, 15 if you're counting what a traveler crossing northeastern Arizona's reservation land actually encounters on the clock."

