page:
  h1: "States Split by Two Time Zones"

  quick_answer:
    - "14 U.S. states are officially split by federal time zone boundaries. If you include Arizona's Navajo Nation exception, the practical total rises to 15."
    - "The splits fall into three categories: Eastern/Central (Florida, Indiana, Kentucky, Michigan, Tennessee), Central/Mountain (Kansas, Nebraska, North Dakota, South Dakota, Texas), and Pacific/Mountain (Idaho, Nevada, Oregon). Alaska spans two federally defined zones of its own."
    - "Time zone lines aren't drawn by nature. They're administered by the Department of Transportation and follow county boundaries, not state borders, rivers, or longitude, which is why they cut through states in ways that can seem arbitrary until you understand which city each county does business with."

  methodology: "Split states follow federal time zone boundaries in 49 CFR Part 71. Arizona is noted separately because its issue is DST observance."

  sources:

