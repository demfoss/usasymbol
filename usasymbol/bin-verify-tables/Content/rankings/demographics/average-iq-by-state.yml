faq:
  - question: "What state has the highest IQ?"
    answer: "Massachusetts has the highest average IQ of any state at 104.3. New Hampshire ranks second at 104.2, and North Dakota and Vermont both rank third at 103.8."

  - question: "What state has the lowest IQ?"
    answer: "Mississippi has the lowest average IQ at 94.2, the only state below 95. Louisiana ranks 49th at 95.3 and California ranks 48th at 95.5."

  - question: "What is the average IQ in the United States?"
    answer: "The national average IQ is 100 by definition, as IQ scores are normed to a population mean of 100. Texas sits closest to the national average in the state ranking at exactly 100.0."

  - question: "Where does California rank in IQ by state?"
    answer: "California ranks 48th out of 50 states with an average IQ of 95.5, between Louisiana at 95.3 and Hawaii at 95.6."

  - question: "What is a good IQ score?"
    answer: "Under the Wechsler classification scale, an IQ of 90 to 109 is Average, 110 to 119 is High Average, and 120 to 129 is Superior. All 50 states fall within the Average range, from Mississippi at 94.2 to Massachusetts at 104.3. Richard Feynman won the Nobel Prize in Physics with a reported IQ of 125, showing that High Average scores are consistent with exceptional achievement."

  - question: "Why does the Northeast score highest on state IQ rankings?"
    answer: "New England states dominate the top of the ranking: Massachusetts at 104.3, New Hampshire at 104.2, Vermont at 103.8, Maine at 103.4, and Connecticut at 103.1. Researchers attribute high scores to above-average per-pupil education spending, high rates of college attainment, and concentration of research universities."

