page:
  h1: "Average IQ by State"

  quick_answer:
    - "Massachusetts has the highest average IQ of any state at 104.3, followed by New Hampshire at 104.2. North Dakota and Vermont both score 103.8, and Minnesota ranks fifth at 103.7."
    - "Mississippi has the lowest average IQ at 94.2, the only state below 95. Louisiana ranks 49th at 95.3 and California ranks 48th at 95.5. Hawaii ranks 47th at 95.6."
    - "The national average IQ is 100 by definition. Texas sits at exactly 100.0 at rank 30. The spread from #1 Massachusetts to #50 Mississippi is 10.1 IQ points."

  methodology: "State IQ estimates are derived from academic research combining standardized test scores (SAT, ACT, NAEP), educational attainment data, and published cognitive assessments at the state level. The data follow the Wechsler classification scale where 90–109 is Average, 110–119 is High Average, and 120–129 is Superior. All 50 states fall within the Average range under this scale."

  sources:
    - name: "McDaniel, M.A. — Estimating State IQ (Intelligence, 2006)"
      url: "https://doi.org/10.1016/j.intell.2006.08.002"
      description: "Foundational peer-reviewed study estimating average IQ by U.S. state using educational and cognitive assessment data"
    - name: "World Population Review — IQ by State"
      url: "https://worldpopulationreview.com/state-rankings/average-iq-by-state"
      description: "Compiled state IQ estimates based on academic research and standardized test score correlations"

