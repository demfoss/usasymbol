faq:
  - question: "Which state has the most expensive cigarettes?"
    answer: "New York has the highest average cigarette price at $14.83 per pack. Rhode Island is next highest at $13.72, more than a dollar lower."

  - question: "Which state has the cheapest cigarettes?"
    answer: "Missouri has the lowest average cigarette price at $8.01 per pack. Its $0.17 excise tax is also the lowest in the table."

  - question: "What is the average price of a pack of cigarettes by state in 2026?"
    answer: "The national average is $10.15 per pack in 2026, up from $8.41 in 2023. Prices range from $8.01 in Missouri to $14.83 in New York."

  - question: "Which state has the highest cigarette tax?"
    answer: "New York has the highest state cigarette excise tax at $5.35 per pack. Maryland ($5.00) and Rhode Island ($4.50) are next highest."

  - question: "Which state has the lowest cigarette tax?"
    answer: "Missouri has the lowest state cigarette excise tax at $0.17 per pack. Georgia is next lowest at $0.37."

  - question: "How much do cigarettes cost in California?"
    answer: "California's average cigarette price is $11.78 per pack, $1.63 above the $10.15 national average, with a $2.87 state excise tax."

