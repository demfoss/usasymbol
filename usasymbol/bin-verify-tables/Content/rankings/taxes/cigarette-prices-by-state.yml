  quick_answer:
    - "New York has the highest average cigarette price in the country at $14.83 per pack and the highest state excise tax at $5.35."
    - "Missouri has the lowest average price at $8.01 per pack and the smallest state cigarette tax in the table at $0.17."
    - "The national average price is $10.15 per pack in 2026, up from $8.41 in 2023. Rhode Island ($13.72) and Connecticut ($13.63) trail only New York among the priciest states."

  methodology: "Average retail prices and state excise taxes per pack come from World Population Review's 2026 state cigarette price table, current as of January 6, 2026. Local city or county cigarette taxes, where they exist, are not broken out separately."

