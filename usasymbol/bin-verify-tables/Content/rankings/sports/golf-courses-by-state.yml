page:
  h1: "Golf Courses by State"

  quick_answer:
    - "Florida has the most golf courses of any state, about 1,250. California follows at roughly 920, with Texas (845), New York (830), and Michigan (820) close together."
    - "North Dakota leads per capita with about 14.7 courses per 100,000 residents, roughly one course for every 6,800 people. California ranks last at 2.4 per 100,000."
    - "Michigan has more public golf courses than any other state, about 650 of its 820. Nationally, roughly three of every four courses are open to the public."

  methodology: "Course counts are rounded estimates from National Golf Foundation data and state golf association listings; per-capita and density figures combine those counts with Census population and land-area data. Counts include public and private courses of all lengths."

