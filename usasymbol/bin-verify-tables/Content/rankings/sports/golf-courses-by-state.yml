faq:
  - question: "Which state has the most golf courses?"
    answer: "Florida has the most golf courses with about 1,250. California ranks second at roughly 920, and Texas third at 845."

  - question: "Which state has the most golf courses per capita?"
    answer: "North Dakota, with about 14.7 courses per 100,000 residents, roughly one for every 6,800 people. South Dakota (12.5) and Iowa (12.1) rank second and third."

  - question: "Which state has the most public golf courses?"
    answer: "Michigan. About 650 of its 820 courses are open to the public, more public-access golf than any other state, including the larger totals in Florida and California."

  - question: "How many golf courses are in the United States?"
    answer: "The United States has about 16,000 golf courses at roughly 14,000 facilities. Around three of every four are open to the public."

  - question: "What is the best state for golf?"
    answer: "Florida offers the most golf by volume, about 1,250 courses plus TPC Sawgrass. Georgia has Augusta National, California has Pebble Beach, and North Carolina has Pinehurst No. 2. For everyday access, North Dakota's one course per 6,800 residents is unmatched."

  - question: "How much does a round of golf cost?"
    answer: "Public courses in the Midwest and South typically charge $30 to $50 for 18 holes, and industry surveys put the national average near $60. Resort courses run far higher. Pebble Beach charges more than $600 per round."

