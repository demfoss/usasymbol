faq:
  - question: "What state has the most police officers per capita?"
    answer: "New Jersey has the most sworn police officers per capita at 39.2 per 10,000 residents. New York (33.8) ranks second and Louisiana (30.4) ranks third. New Jersey's figure is 70% above the national average of approximately 23 per 10,000."

  - question: "What state has the fewest police officers per capita?"
    answer: "Oregon has the fewest sworn officers per capita at 12.9 per 10,000 residents. Washington (13.5) ranks 49th and Minnesota (14.3) ranks 48th. All three fall more than 9 points below the national average."

  - question: "What is the national average for police officers per capita?"
    answer: "The national average is approximately 23 sworn officers per 10,000 residents, based on FBI Crime Data Explorer figures for state and local law enforcement. Twenty-seven states fall below that threshold, including all 8 states in the bottom tier of this table."

  - question: "How many police officers per capita does New York have?"
    answer: "New York has 33.8 sworn officers per 10,000 residents, ranking 2nd nationally. New York City's police force alone is one of the largest in the world, pulling the statewide average well above the national figure of approximately 23 per 10,000."

  - question: "How many police officers per capita does California have?"
    answer: "California ranks 25th with 20.2 sworn officers per 10,000 residents, just below the national average of approximately 23. Despite having the largest population of any state, California's per-capita police staffing is near the midpoint of the table."

  - question: "What does sworn officer mean?"
    answer: "A sworn officer is a law enforcement employee with full arrest authority, a badge, and the legal power to use force. The category includes police officers, deputy sheriffs, detectives, and state troopers; it excludes civilian staff such as dispatchers, analysts, and administrative personnel. Only sworn officers are counted in this ranking."

