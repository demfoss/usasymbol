  title: "Police Officers Per Capita by State 2026"
  description: "New Jersey has the most sworn police officers per 10,000 residents at 39.2, while Oregon has the fewest at 12.9."

page:
  h1: "Police Officers Per Capita by State"

  quick_answer:
    - "New Jersey has the most sworn police officers per capita at 39.2 per 10,000 residents, the only state above 35. New York (33.8) and Louisiana (30.4) rank second and third."
    - "Oregon ranks last at 12.9 sworn officers per 10,000 residents. Washington (13.5) and Minnesota (14.3) are next lowest. All three fall more than 9 points below the national average of approximately 23 per 10,000."
    - "The national average is approximately 23 sworn officers per 10,000 residents. New Jersey's 39.2 is 70% above that figure, and Oregon's 12.9 is 44% below it. The spread between top and bottom is 26.3 points."

  methodology: "Figures represent full-time sworn law enforcement officers (those with arrest authority) per 10,000 residents, including local police, county sheriffs' deputies, and state police; federal officers, civilian staff, and Washington, D.C. are excluded. Source: FBI Crime Data Explorer, Law Enforcement Employees survey, approximately 2022."

  sources:
    - name: "FBI Crime Data Explorer — Law Enforcement Employees"
      url: "https://cde.ucr.cjis.gov/LATEST/webapp/#/pages/le/employees"
      description: "Annual sworn officer and civilian employee counts by state and agency type"
    - name: "Bureau of Justice Statistics — Census of State and Local Law Enforcement Agencies"
      url: "https://bjs.ojp.gov/programs/lawenforcement"
      description: "Periodic census of all state and local law enforcement agencies and staffing levels"

