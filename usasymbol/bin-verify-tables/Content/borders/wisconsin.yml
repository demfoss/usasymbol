faq:
  - question: "What states border Wisconsin?"
    answer: "Four states border Wisconsin: Michigan (north), Illinois (south), Iowa (southwest), and Minnesota (west)."
  
  - question: "What borders Wisconsin?"
    answer: "Wisconsin borders four states and two Great Lakes. Michigan borders to the north, Illinois to the south, Iowa to the southwest, Minnesota to the west, Lake Superior to the north, and Lake Michigan to the east. Rivers form most of the state borders with Minnesota and Iowa."
  
  - question: "Which Great Lakes border Wisconsin?"
    answer: "Two Great Lakes border Wisconsin: Lake Superior (north) and Lake Michigan (east). Wisconsin is one of only two states that border two Great Lakes, along with Michigan."
  
  - question: "What Great Lake borders Wisconsin on the east?"
    answer: "Lake Michigan borders Wisconsin on the east, providing about 320 miles of shoreline along Wisconsin's eastern coast. Milwaukee, the state's largest city, sits on Lake Michigan."
  
  - question: "Which Great Lake borders Wisconsin on the north?"
    answer: "Lake Superior borders Wisconsin on the north, providing about 190 miles of shoreline. Lake Superior is the largest freshwater lake in the world by surface area. The Apostle Islands sit in Lake Superior off Wisconsin's coast."
  
  - question: "What state borders Wisconsin on the south?"
    answer: "Illinois borders Wisconsin on the south. This boundary runs about 185 miles along a straight surveyed line from Lake Michigan to the Mississippi River."
  
  - question: "Which state borders Wisconsin to the north?"
    answer: "Michigan borders Wisconsin to the north via a land border in northern Wisconsin where the states meet in the Upper Peninsula region. This border runs about 70 miles along rivers. Michigan and Wisconsin also face each other across Lake Michigan."
  
  - question: "What river borders Wisconsin and Minnesota?"
    answer: "Two rivers border Wisconsin and Minnesota: the St. Croix River forms the northern section of the border (about 150 miles), and the Mississippi River creates the southern section (about 110 miles). Together, these rivers form Wisconsin's entire western boundary with Minnesota."
  
  - question: "How many Great Lakes border Wisconsin?"
    answer: "Two Great Lakes border Wisconsin: Lake Superior to the north and Lake Michigan to the east. This makes Wisconsin one of only two states (with Michigan) that border two Great Lakes."

