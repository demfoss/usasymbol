    facts:
      - "Kentucky borders more states than any other U.S. state east of the Mississippi (7 neighbors)"
      - "The Ohio River forms Kentucky's entire northern border with three states"
      - "Kentucky's southern border with Tennessee at the 36°30' parallel is about 425 miles long"
      - "The Mississippi River forms Kentucky's short western border with Missouri — only about 30 miles"
      - "Cumberland Gap, where KY, VA, and TN meet, was the main passage for westward migration in the 18th century"
      - "Kentucky is landlocked — it has no ocean or Great Lake coastline"

faq:
  - question: "What states border Kentucky?"
    answer: "Seven states border Kentucky: Illinois, Indiana, and Ohio to the north, West Virginia and Virginia to the east, Tennessee to the south, and Missouri to the west."
  - question: "How many states border Kentucky?"
    answer: "Seven states border Kentucky, more than any other state east of the Mississippi River."
  - question: "What river forms Kentucky's northern border?"
    answer: "The Ohio River forms Kentucky's entire northern border with Illinois, Indiana, and Ohio."
  - question: "What is Kentucky's longest border?"
    answer: "Kentucky's longest border is with Tennessee, following the 36°30' parallel for about 425 miles."
  - question: "What is Kentucky's shortest border?"
    answer: "Kentucky's shortest border is with Missouri along the Mississippi River, at only about 30 miles."
  - question: "Does Kentucky border the ocean?"
    answer: "No. Kentucky is a landlocked state and does not border any ocean or Great Lake."
  - question: "What is at the junction of Kentucky, Virginia, and Tennessee?"
    answer: "Cumberland Gap, a historic mountain pass through the Appalachians, lies at the tri-state junction of Kentucky, Virginia, and Tennessee."

