seo_title: "Washington Borders | Map, States & Facts"
seo_description: "Washington borders Idaho and Oregon. It also borders Canada."
intro_text: "Washington borders two U.S. states: Idaho to the east and Oregon to the south. Washington also shares an international border with Canada's British Columbia province to the north. The Pacific Ocean forms Washington's entire western coastline. The Columbia River creates most of the southern boundary with Oregon, making it one of the most significant river borders in the American West."

