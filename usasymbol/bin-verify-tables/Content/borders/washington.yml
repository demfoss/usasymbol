faq:
  - question: "What states border Washington?"
    answer: "Two states border Washington: Idaho (east) and Oregon (south). Washington has fewer neighboring states than most U.S. states."
  
  - question: "What borders Washington?"
    answer: "Washington borders two states, Canada, and the Pacific Ocean. Idaho borders to the east, Oregon to the south (across the Columbia River), British Columbia (Canada) to the north, and the Pacific Ocean to the west."
  
  - question: "What country borders Washington?"
    answer: "Canada borders Washington to the north. Specifically, the Canadian province of British Columbia shares about 425 miles of international border with Washington along the 49th parallel."
  
  - question: "What ocean borders Washington?"
    answer: "The Pacific Ocean borders Washington along its entire western coast, providing about 157 miles of rugged, scenic coastline including the Olympic Peninsula."
  
  - question: "What state borders Washington to the east?"
    answer: "Idaho borders Washington to the east. This boundary runs about 270 miles along a straight north-south surveyed line from British Columbia to Oregon."
  
  - question: "What state borders Washington to the south?"
    answer: "Oregon borders Washington to the south. The Columbia River forms most of this boundary for about 300 miles from Idaho to the Pacific Ocean."
  
  - question: "What river borders Washington and Oregon?"
    answer: "The Columbia River borders Washington and Oregon, forming about 300 miles of the southern boundary between the states. This is the largest river in the Pacific Northwest and carved the famous Columbia River Gorge through the Cascade Mountains."
  
  - question: "What Canadian city borders Washington?"
    answer: "Vancouver, British Columbia is the major Canadian city near Washington's border (not to be confused with Vancouver, Washington, which is a different city across from Portland, Oregon). The city of Surrey, BC is also near the border. The border crossing at Blaine, Washington connects to White Rock and Surrey in British Columbia."

