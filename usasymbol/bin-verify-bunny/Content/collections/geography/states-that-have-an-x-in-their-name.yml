    subsections:
      - subtitle: "New Mexico"
        text: |
          **Abbreviation:** NM
          **Capital:** Santa Fe

          New Mexico contains one X in the word Mexico. The project table places the state in the West region.

          That single X is the exact reason New Mexico belongs in this two-state group.
      - subtitle: "Texas"
        text: |
          **Abbreviation:** TX
          **Capital:** Austin

          Texas contains one X as its third letter. The project table places the state in the South region.

          That X qualifies Texas and makes it the shorter of the two matching state names.

