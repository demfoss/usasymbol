sections:
  - id: "states-ending-i"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That End in I"
    subsections:
      - subtitle: "Hawaii"
        text: |
          **Letters:** 6
          **Ending:** -aii

          Hawaii ends in I and closes with two consecutive I letters. Honolulu is the capital of the only U.S. island state.

          Its final character qualifies Hawaii, while the double-I ending distinguishes it from Mississippi.
      - subtitle: "Mississippi"
        text: |
          **Letters:** 11
          **Ending:** -ppi

          Mississippi ends in I after the consonant pair pp. Jackson is its capital, and the state name contains four I letters in total.

          The last of those four I letters places Mississippi with Hawaii and Missouri in this three-state collection.
      - subtitle: "Missouri"
        text: |
          **Letters:** 8
          **Ending:** -uri

          Missouri ends in I and has Jefferson City as its capital. The state lies in the Midwest region in the project's state table.

          Its final written letter places Missouri with Hawaii and Mississippi in the complete three-state group.

