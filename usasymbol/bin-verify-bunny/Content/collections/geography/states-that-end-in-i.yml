faq:
  - question: "What states end in I?"
    answer: "Hawaii, Mississippi, and Missouri are the three U.S. states whose names end in I."
  - question: "How many states end in I?"
    answer: "Three states end in I: Hawaii, Mississippi, and Missouri."
  - question: "Does Hawaii end with two I letters?"
    answer: "Yes. Hawaii is spelled H-A-W-A-I-I, so its final two letters are both I."
  - question: "How many I letters are in Mississippi?"
    answer: "Mississippi contains four I letters. The fourth one is the final character of the name."

