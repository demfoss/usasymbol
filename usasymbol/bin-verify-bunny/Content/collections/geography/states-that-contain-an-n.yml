  - question: "How many states contain the letter N?"
    answer: "Thirty-three U.S. state names contain at least one N."
  - question: "Which states containing N end in N?"
    answer: "Michigan, Oregon, Washington, and Wisconsin contain N as their final letter."
  - question: "Do all states starting with New contain N?"
    answer: "Yes. New Hampshire, New Jersey, New Mexico, and New York all begin with N."
  - question: "How many states start with N?"
    answer: "Eight states start with N: Nebraska, Nevada, four New states, and the two North states."

