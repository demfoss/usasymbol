page:
  h1: "States That End in A"
  intro_title: "The Most Common Final Letter in State Names"
  quick_answer:
    - "21 U.S. states end in A, making A the final letter in 42 percent of all state names."
    - "The list runs from Alabama to West Virginia and includes five two-word names: North Carolina, North Dakota, South Carolina, South Dakota, and West Virginia."
    - "Alabama has the shortest name in the group at 7 letters. North Carolina, South Carolina, and West Virginia are the longest when spaces are included."
  methodology: "Common names of the 50 U.S. states were checked letter by letter. Spaces are ignored for length comparisons, but the final character of the full state name determines inclusion."
