sections:
  - id: "states-ending-a"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That End in A"
    paragraphs:
      - "A closes 21 of the 50 state names. Each entry below shows the spelling pattern and one concrete identifier for the state."
    highlights:
      - name: "Alabama"
        image: "/images/flags/alabama/flag.webp"
        description: "Alabama has 7 letters and ends in **-ama**. Montgomery is its capital, and the terminal A places Alabama first alphabetically in this 21-state set."
      - name: "Alaska"
        image: "/images/flags/alaska/flag.webp"
        description: "Alaska has 6 letters and ends in **-ska**. Juneau is its capital, while the final A qualifies the largest U.S. state by area for this spelling list."
      - name: "Arizona"
        image: "/images/flags/arizona/flag.webp"
        description: "Arizona has 7 letters and ends in **-ona**. Phoenix is its capital, and the last letter supplies Arizona's place among the A-ending state names."
      - name: "California"
        image: "/images/flags/california/flag.webp"
        description: "California has 10 letters and ends in **-nia**. Sacramento is its capital, and that final three-letter pattern recurs in Pennsylvania and Virginia."
      - name: "Florida"
        image: "/images/flags/florida/flag.webp"
        description: "Florida has 7 letters and ends in **-ida**. Tallahassee is its capital, and its final A makes the peninsula state part of the largest ending-letter group."
      - name: "Georgia"
        image: "/images/flags/georgia/flag.webp"
        description: "Georgia has 7 letters and ends in **-gia**. Atlanta is its capital, and Georgia is the only state on the list with that exact three-letter ending."
      - name: "Indiana"
        image: "/images/flags/indiana/flag.webp"
        description: "Indiana has 7 letters and ends in **-ana**. Indianapolis is its capital, and the same ending appears in Louisiana and Montana."
      - name: "Iowa"
        image: "/images/flags/iowa/flag.webp"
        description: "Iowa has 4 letters and ends in **-owa**. Des Moines is its capital, and Iowa is the shortest state name in the A-ending group."
      - name: "Louisiana"
        image: "/images/flags/louisiana/flag.webp"
        description: "Louisiana has 9 letters and ends in **-ana**. Baton Rouge is its capital, and its final A joins it to Indiana and Montana by suffix."
      - name: "Minnesota"
        image: "/images/flags/minnesota/flag.webp"
        description: "Minnesota has 9 letters and ends in **-ota**. Saint Paul is its capital, and the suffix links its spelling to North Dakota and South Dakota."
      - name: "Montana"
        image: "/images/flags/montana/flag.webp"
        description: "Montana has 7 letters and ends in **-ana**. Helena is its capital, and its terminal pattern matches Indiana and Louisiana."
      - name: "Nebraska"
        image: "/images/flags/nebraska/flag.webp"
        description: "Nebraska has 8 letters and ends in **-ska**. Lincoln is its capital, and Nebraska shares its final three letters with Alaska."
      - name: "Nevada"
        image: "/images/flags/nevada/flag.webp"
        description: "Nevada has 6 letters and ends in **-ada**. Carson City is its capital, and Nevada is the only state name with that exact ending."
      - name: "North Carolina"
        image: "/images/flags/north-carolina/flag.webp"
        description: "North Carolina has 13 letters without its space and ends in **-ina**. Raleigh is its capital, and the directional prefix distinguishes it from South Carolina."
      - name: "North Dakota"
        image: "/images/flags/north-dakota/flag.webp"
        description: "North Dakota has 11 letters without its space and ends in **-ota**. Bismarck is its capital, and the paired Dakota names both qualify."
      - name: "Oklahoma"
        image: "/images/flags/oklahoma/flag.webp"
        description: "Oklahoma has 8 letters and ends in **-oma**. Oklahoma City is its capital, and no other state shares that exact three-letter ending."
      - name: "Pennsylvania"
        image: "/images/flags/pennsylvania/flag.webp"
        description: "Pennsylvania has 12 letters and ends in **-nia**. Harrisburg is its capital, and the suffix places it with California, Virginia, and West Virginia."
      - name: "South Carolina"
        image: "/images/flags/south-carolina/flag.webp"
        description: "South Carolina has 13 letters without its space and ends in **-ina**. Columbia is its capital, and its Carolina partner also ends in A."
      - name: "South Dakota"
        image: "/images/flags/south-dakota/flag.webp"
        description: "South Dakota has 11 letters without its space and ends in **-ota**. Pierre is its capital, and both Dakota names share the same terminal A."
      - name: "Virginia"
        image: "/images/flags/virginia/flag.webp"
        description: "Virginia has 8 letters and ends in **-nia**. Richmond is its capital, and the complete name appears inside West Virginia's name."
      - name: "West Virginia"
        image: "/images/flags/west-virginia/flag.webp"
        description: "West Virginia has 12 letters without its space and ends in **-nia**. Charleston is its capital, and it closes the list alphabetically."
  - id: "ending-a-patterns"
    icon: "fa-solid fa-spell-check"
    title: "Common Endings Before the Final A"
    paragraphs:
      - "Four states end in **-nia**: California, Pennsylvania, Virginia, and West Virginia. Three end in **-ana**, while Minnesota and both Dakotas share **-ota**."
      - "A appears so often at the end partly because many state names entered English through Spanish, Latinized, or Indigenous-language forms that English speakers preserved with a terminal vowel."

faq:
  - question: "How many states end in A?"
    answer: "21 U.S. states end in A. That equals 42 percent of the 50 state names."
  - question: "What states end with the letters nia?"
    answer: "California, Pennsylvania, Virginia, and West Virginia end in the letters nia. Virginia is also contained in the full name West Virginia."
  - question: "What is the shortest state that ends in A?"
    answer: "Iowa is the shortest at four letters. Alaska and Nevada follow with six letters each."
  - question: "Do both Carolinas end in A?"
    answer: "Yes. North Carolina and South Carolina both end in A, and both have 13 letters when the space is excluded."
  - question: "Do both Dakotas end in A?"
    answer: "Yes. North Dakota and South Dakota both end in the letter A and share the final three letters ota."

