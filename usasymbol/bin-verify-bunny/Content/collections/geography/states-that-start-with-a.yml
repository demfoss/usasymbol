    title: "All States That Start With A"
    subsections:
      - subtitle: "Alabama"
        text: |
          **Abbreviation:** AL
          **Capital:** Montgomery

          Alabama begins with A and appears in the South region of the project's state table.

          Its first letter is the objective reason Alabama belongs in this four-state group.
      - subtitle: "Alaska"
        text: |
          **Abbreviation:** AK
          **Capital:** Juneau

          Alaska begins with A and appears in the West region of the project's state table.

          Its initial A qualifies Alaska, which has the shortest name in the group at 6 letters.
      - subtitle: "Arizona"
        text: |
          **Abbreviation:** AZ
          **Capital:** Phoenix

          Arizona begins with A and appears in the West region of the project's state table.

          Its initial A places Arizona beside Alaska as the second western member of this group.
      - subtitle: "Arkansas"
        text: |
          **Abbreviation:** AR
          **Capital:** Little Rock

          Arkansas begins with A and appears in the South region of the project's state table.

          Its first character qualifies Arkansas and closes the four-name list alphabetically.

