faq:
  - question: "What state ends in G?"
    answer: "Wyoming is the only U.S. state that ends in G."
  - question: "How many states end in G?"
    answer: "Exactly one of the 50 states ends in G: Wyoming."
  - question: "Does Washington end in G?"
    answer: "No. Washington contains the letter G, but its final letter is N. An ending-letter list uses only the last character."
  - question: "What are the last three letters of Wyoming?"
    answer: "Wyoming ends in ing. No other U.S. state name shares that exact three-letter ending."

