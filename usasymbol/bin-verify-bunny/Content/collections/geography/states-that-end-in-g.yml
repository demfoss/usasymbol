    subsections:
      - subtitle: "Wyoming"
        text: |
          **Letters:** 7
          **Ending:** -ing

          Wyoming ends in G, and Cheyenne is its capital. The name was adopted for the territory in 1868 after first being used for Pennsylvania's Wyoming Valley.

          Its final written character makes Wyoming the sole qualifying state. No second state name ends with the same letter.

