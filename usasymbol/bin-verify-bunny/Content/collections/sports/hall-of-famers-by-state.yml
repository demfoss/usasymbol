sections:
  - id: "hall-of-famer-by-state"
    icon: "fa-solid fa-trophy"
    style: "law-cards"
    title: "NFL, NBA & MLB Hall of Famer From Every State"
    paragraphs:
      - "Some states were an easy call. New York had Lou Gehrig and Louisiana had Bill Russell, both champions whose records stood for decades. Others came down to which league's legend carried the bigger national name."
    highlights:
      - name: "Alabama: Hank Aaron"
        image: "/images/collections/sports/hall-of-famers-by-state/alabama.jpg"
        description: "Hank Aaron, born in Mobile in 1934, hit 755 career home runs, a record that stood for 33 years until Barry Bonds broke it. Baseball Hall of Fame, 1982. Alabama also produced fellow MLB Hall of Famers Willie Mays and Willie McCovey."

      - name: "Arizona: Randall McDaniel"
        image: "/images/collections/sports/hall-of-famers-by-state/arizona.jpg"
        description: "Randall McDaniel made 12 straight Pro Bowls as a Minnesota Vikings guard and won the 2009 Pro Football Hall of Fame induction as one of only two Arizona-born members, alongside Curley Culp."

      - name: "Arkansas: Scottie Pippen"
        image: "/images/collections/sports/hall-of-famers-by-state/arkansas.jpg"
        description: "Scottie Pippen, born in Hamburg in 1965, won 6 NBA championships alongside Michael Jordan on the Chicago Bulls. Basketball Hall of Fame, 2010."

      - name: "California: Joe DiMaggio"
        image: "/images/collections/sports/hall-of-famers-by-state/california.jpg"
        description: "Joe DiMaggio, born in Martinez in 1914, hit safely in 56 consecutive games in 1941, a record no player has come within a season of since. Baseball Hall of Fame, 1955."

      - name: "Colorado: Chauncey Billups"
        image: "/images/collections/sports/hall-of-famers-by-state/colorado.jpg"
        description: "Chauncey Billups, born and raised in Denver, won the 2004 NBA Finals MVP with the Detroit Pistons and made 5 All-Star teams. Basketball Hall of Fame, 2024."

      - name: "Connecticut: Jim O'Rourke"
        image: "/images/collections/sports/hall-of-famers-by-state/connecticut.jpg"
        description: "Jim O'Rourke, born in Bridgeport in 1850, recorded the first base hit in National League history in 1876 and played in the majors until age 54. Baseball Hall of Fame, 1945."

      - name: "Delaware: Randy White"
        image: "/images/collections/sports/hall-of-famers-by-state/delaware.jpg"
        description: "Randy White, born in Wilmington, made 9 Pro Bowls as a Dallas Cowboys defensive tackle and shared Super Bowl XII MVP honors. Pro Football Hall of Fame, 1994."

      - name: "Florida: Steve Carlton"
        image: "/images/collections/sports/hall-of-famers-by-state/florida.jpg"
        description: "Steve Carlton, born in Miami, won 4 Cy Young Awards and finished with 329 career wins, most of them for the Philadelphia Phillies. Baseball Hall of Fame, 1994."

      - name: "Georgia: Jackie Robinson"
        image: "/images/collections/sports/hall-of-famers-by-state/georgia.jpg"
        description: "Jackie Robinson, born in Cairo in 1919, broke Major League Baseball's color barrier with the Brooklyn Dodgers in 1947. Baseball Hall of Fame, 1962."

      - name: "Idaho: Harmon Killebrew"
        image: "/images/collections/sports/hall-of-famers-by-state/idaho.jpg"
        description: "Harmon Killebrew, born in Payette, made 13 All-Star teams and led the American League in home runs 6 times for the Minnesota Twins. Baseball Hall of Fame, 1984."

      - name: "Illinois: Dick Butkus"
        image: "/images/collections/sports/hall-of-famers-by-state/illinois.jpg"
        description: "Dick Butkus, born in Chicago, made 8 Pro Bowls as a Chicago Bears linebacker and is still cited as one of the hardest hitters the position has produced. Pro Football Hall of Fame, 1979."

      - name: "Indiana: Larry Bird"
        image: "/images/collections/sports/hall-of-famers-by-state/indiana.jpg"
        description: "Larry Bird, born in West Baden Springs, won 3 NBA titles and 2 Finals MVPs with the Boston Celtics. Basketball Hall of Fame, 1998."

      - name: "Iowa: Bob Feller"
        image: "/images/collections/sports/hall-of-famers-by-state/iowa.jpg"
        description: "Bob Feller, born in Van Meter, threw 3 career no-hitters for the Cleveland Indians and lost nearly 4 prime seasons to World War II service. Baseball Hall of Fame, 1962."

      - name: "Kansas: Barry Sanders"
        image: "/images/collections/sports/hall-of-famers-by-state/kansas.jpg"
        description: "Barry Sanders, born in Wichita, rushed for 2,053 yards in 1997 and retired 3rd on the NFL's all-time rushing list. Pro Football Hall of Fame, 2004."

      - name: "Kentucky: Paul Hornung"
        image: "/images/collections/sports/hall-of-famers-by-state/kentucky.jpg"
        description: "Paul Hornung, born in Louisville, scored 176 points for the Green Bay Packers in 1960, an NFL single-season scoring record that stood for 46 years. Pro Football Hall of Fame, 1986."

      - name: "Louisiana: Bill Russell"
        image: "/images/collections/sports/hall-of-famers-by-state/louisiana.jpg"
        description: "Bill Russell, born in Monroe in 1934, won 11 NBA championships with the Boston Celtics, more than any player in league history. Basketball Hall of Fame, 1975."

      - name: "Maryland: Cal Ripken Jr."
        image: "/images/collections/sports/hall-of-famers-by-state/maryland.jpg"
        description: "Cal Ripken Jr., born in Havre de Grace, played 2,632 consecutive games for the Baltimore Orioles, breaking Lou Gehrig's 56-year-old record. Baseball Hall of Fame, 2007."

      - name: "Massachusetts: Pie Traynor"
        image: "/images/collections/sports/hall-of-famers-by-state/massachusetts.jpg"
        description: "Pie Traynor, born in Framingham, batted .320 over 17 seasons at third base for the Pittsburgh Pirates and was long ranked the best to ever play the position. Baseball Hall of Fame, 1948."

      - name: "Michigan: Magic Johnson"
        image: "/images/collections/sports/hall-of-famers-by-state/michigan.jpg"
        description: "Magic Johnson, born in Lansing, won 5 NBA titles and 3 Finals MVPs running the Los Angeles Lakers' fast break. Basketball Hall of Fame, 2002."

      - name: "Minnesota: Dave Winfield"
        image: "/images/collections/sports/hall-of-famers-by-state/minnesota.jpg"
        description: "Dave Winfield, born in St. Paul, collected 3,110 hits and made 12 All-Star teams across a 22-year career split mainly between the Padres and Yankees. Baseball Hall of Fame, 2001."

      - name: "Mississippi: Walter Payton"
        image: "/images/collections/sports/hall-of-famers-by-state/mississippi.jpg"
        description: "Walter Payton, born in Columbia, held the NFL's career rushing record of 16,726 yards for nearly 20 years after retiring from the Chicago Bears. Pro Football Hall of Fame, 1993."

      - name: "Missouri: Yogi Berra"
        image: "/images/collections/sports/hall-of-famers-by-state/missouri.jpg"
        description: "Yogi Berra, born in St. Louis, won 10 World Series championships as a player, more than anyone else in MLB history. Baseball Hall of Fame, 1972."

      - name: "Montana: Phil Jackson"
        image: "/images/collections/sports/hall-of-famers-by-state/montana.jpg"
        description: "Phil Jackson, born in Deer Lodge, won 11 NBA championships as head coach of the Chicago Bulls and Los Angeles Lakers, more than any coach in league history. Basketball Hall of Fame, 2007."

      - name: "Nebraska: Bob Gibson"
        image: "/images/collections/sports/hall-of-famers-by-state/nebraska.jpg"
        description: "Bob Gibson, born in Omaha, posted a 1.12 ERA for the St. Louis Cardinals in 1968, the lowest by a starting pitcher in the modern era. Baseball Hall of Fame, 1981."

      - name: "New Jersey: Franco Harris"
        image: "/images/collections/sports/hall-of-famers-by-state/new-jersey.jpg"
        description: "Franco Harris, born at Fort Dix, caught the 1972 'Immaculate Reception' for the Pittsburgh Steelers, one of the most replayed plays in NFL history. Pro Football Hall of Fame, 1990."

      - name: "New Mexico: Ralph Kiner"
        image: "/images/collections/sports/hall-of-famers-by-state/new-mexico.jpg"
        description: "Ralph Kiner, born in Santa Rita, led the National League in home runs in 7 consecutive seasons for the Pittsburgh Pirates, from 1946 through 1952. Baseball Hall of Fame, 1975."

      - name: "New York: Lou Gehrig"
        image: "/images/collections/sports/hall-of-famers-by-state/new-york.jpg"
        description: "Lou Gehrig, born in New York City, played 2,130 consecutive games for the Yankees, a record that stood for 56 years. Baseball Hall of Fame, 1939."

      - name: "North Carolina: Catfish Hunter"
        image: "/images/collections/sports/hall-of-famers-by-state/north-carolina.jpg"
        description: "Catfish Hunter, born in Hertford, threw a perfect game in 1968 and won 224 games across stints with the Athletics and Yankees. Baseball Hall of Fame, 1987."

      - name: "Ohio: Cy Young"
        image: "/images/collections/sports/hall-of-famers-by-state/ohio.jpg"
        description: "Cy Young, born in Gilmore, won 511 games, the all-time MLB record, and gave his name to the award now given annually to each league's best pitcher. Baseball Hall of Fame, 1937."

      - name: "Oklahoma: Mickey Mantle"
        image: "/images/collections/sports/hall-of-famers-by-state/oklahoma.jpg"
        description: "Mickey Mantle, born in Spavinaw, won 3 AL MVP awards and hit 536 home runs as a switch-hitter for the New York Yankees. Baseball Hall of Fame, 1974."

      - name: "Pennsylvania: Joe Montana"
        image: "/images/collections/sports/hall-of-famers-by-state/pennsylvania.jpg"
        description: "Joe Montana, born in New Eagle, won 4 Super Bowls and 3 Super Bowl MVPs quarterbacking the San Francisco 49ers. Pro Football Hall of Fame, 2000."

      - name: "Rhode Island: Napoleon Lajoie"
        image: "/images/collections/sports/hall-of-famers-by-state/rhode-island.jpg"
        description: "Napoleon Lajoie, born in Woonsocket in 1874, batted .426 in 1901, still the American League's modern single-season record. Baseball Hall of Fame, 1937."

      - name: "South Carolina: Jim Rice"
        image: "/images/collections/sports/hall-of-famers-by-state/south-carolina.jpg"
        description: "Jim Rice, born in Anderson, hit 382 home runs for the Boston Red Sox and won the 1978 AL MVP award. Baseball Hall of Fame, 2009."

      - name: "South Dakota: Adam Vinatieri"
        image: "/images/collections/sports/hall-of-famers-by-state/south-dakota.jpg"
        description: "Adam Vinatieri, born in Yankton, made the most postseason field goals in NFL history and won 4 Super Bowls across stints with the Patriots and Colts. Pro Football Hall of Fame, 2026."

      - name: "Tennessee: Todd Helton"
        image: "/images/collections/sports/hall-of-famers-by-state/tennessee.jpg"
        description: "Todd Helton, born in Knoxville, batted .316 over 17 seasons and made 5 All-Star teams for the Colorado Rockies. Baseball Hall of Fame, 2024."

      - name: "Texas: Nolan Ryan"
        image: "/images/collections/sports/hall-of-famers-by-state/texas.jpg"
        description: "Nolan Ryan, born in Refugio, threw a record 7 career no-hitters and struck out 5,714 batters, both marks still unbroken. Baseball Hall of Fame, 1999."

      - name: "Utah: Steve Young"
        image: "/images/collections/sports/hall-of-famers-by-state/utah.jpg"
        description: "Steve Young, born in Salt Lake City, won 2 NFL MVP awards and Super Bowl XXIX MVP quarterbacking the San Francisco 49ers. Pro Football Hall of Fame, 2005."

      - name: "Vermont: Carlton Fisk"
        image: "/images/collections/sports/hall-of-famers-by-state/vermont.jpg"
        description: "Carlton Fisk, born in Bellows Falls, hit one of the most replayed home runs in World Series history in Game 6 of the 1975 Series. Baseball Hall of Fame, 2000."

      - name: "Virginia: Bruce Smith"
        image: "/images/collections/sports/hall-of-famers-by-state/virginia.jpg"
        description: "Bruce Smith, born in Norfolk, retired with 200 career sacks, still the NFL's all-time record. Pro Football Hall of Fame, 2009."

      - name: "Washington: John Elway"
        image: "/images/collections/sports/hall-of-famers-by-state/washington.jpg"
        description: "John Elway, born in Port Angeles, won back-to-back Super Bowls quarterbacking the Denver Broncos to close his career. Pro Football Hall of Fame, 2004."

      - name: "West Virginia: Randy Moss"
        image: "/images/collections/sports/hall-of-famers-by-state/west-virginia.jpg"
        description: "Randy Moss, born in Rand, retired with 156 receiving touchdowns, then the 2nd most in NFL history. Pro Football Hall of Fame, 2018. West Virginia has produced 7 NFL Hall of Famers in all, more per capita than any other state."

      - name: "Wisconsin: Al Simmons"
        image: "/images/collections/sports/hall-of-famers-by-state/wisconsin.jpg"
        description: "Al Simmons, born in Milwaukee in 1902, batted .334 over 20 seasons and drove in 100 or more runs in each of his first 11. Baseball Hall of Fame, 1953."

  - id: "states-without-a-hall-of-famer"
    icon: "fa-solid fa-circle-question"
    title: "States Without a Big Three Hall of Famer"
    paragraphs:
      - "Maine and New Hampshire have never produced a Pro Football, Baseball, or Basketball Hall of Fame member, despite each state fielding professional-caliber athletes over the decades. Alaska, Hawaii, Nevada, North Dakota, Oregon, and Wyoming round out the group of 8 states with no confirmed inductee born within their borders."
      - "The gap has nothing to do with talent alone. Wyoming, Nevada, Hawaii, and Alaska each rank among the least populous states, which shrinks the pool of athletes born there, while Oregon and Maine have sent players to the pros without any yet reaching the highest individual honor their sport gives out."

faq:
  - question: "Who is the Hall of Famer from New York?"
    answer: "Lou Gehrig represents New York, born in New York City in 1903. He played 2,130 consecutive games for the Yankees, a record that stood for 56 years."

  - question: "Which states have no Hall of Fame athlete?"
    answer: "Maine, New Hampshire, Alaska, Hawaii, Nevada, North Dakota, Oregon, and Wyoming have no confirmed NFL, NBA, or MLB Hall of Fame member born there."

  - question: "Who represents Texas in the Hall of Fame?"
    answer: "Nolan Ryan represents Texas, born in Refugio in 1947. He struck out 5,714 batters and threw 7 no-hitters, both records that remain unbroken."

  - question: "Is Larry Bird from Indiana?"
    answer: "Yes. Larry Bird was born in West Baden Springs, Indiana, in 1956 and won 3 NBA championships and 2 Finals MVPs with the Boston Celtics before his 1998 Hall of Fame induction."

  - question: "Which state produced the most Hall of Fame athletes?"
    answer: "Alabama alone accounts for 3 Baseball Hall of Famers on this list's radar: Hank Aaron, Willie Mays, and Willie McCovey. West Virginia has produced 7 Pro Football Hall of Famers, more per capita than any other state."

  - question: "Who is South Dakota's Hall of Fame representative?"
    answer: "Adam Vinatieri, born in Yankton, represents South Dakota. He made more postseason field goals than any kicker in NFL history and won 4 Super Bowls before his 2026 induction."

