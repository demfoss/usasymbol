page:
  h1: "Hall of Famer From Every State"
  intro_title: "One Hall of Fame Legend for Every State That Has One"

  quick_answer:
    - "Lou Gehrig represents New York, playing 2,130 consecutive games for the Yankees, a record that stood for 56 years until Cal Ripken Jr., who represents Maryland, broke it."
    - "Bill Russell represents Louisiana, born in Monroe before winning 11 NBA championships with the Boston Celtics, more than any player in league history. Larry Bird represents Indiana, born in West Baden Springs."
    - "Maine, New Hampshire, Alaska, Hawaii, Nevada, North Dakota, Oregon, and Wyoming have no confirmed NFL, NBA, or MLB Hall of Fame member born within their borders."

  methodology: "One athlete represents each state based on birthplace, chosen by the most decorated NFL, NBA, or MLB Hall of Fame career among that state's natives. Only officially inducted Hall of Fame members are included; active or retired players not yet inducted do not qualify."

  sources:
