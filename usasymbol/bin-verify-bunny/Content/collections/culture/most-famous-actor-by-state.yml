  - id: "acting-credits-vs-popularity-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "Acting Credits vs Popularity by State"
    paragraphs:
      - "Brad Dourif of West Virginia has 168 acting credits, the most in the group, yet draws only 768,436 annual page views. John Goodman of Missouri is close behind with 155 credits."
      - "Jason Momoa of Hawaii shows the opposite pattern: just 28 acting credits but 8,764,490 annual page views, the highest total on the list. Vermont's Damon Wayans Jr. and Wyoming's Matthew Fox made the list with fewer than 30 credits each."

