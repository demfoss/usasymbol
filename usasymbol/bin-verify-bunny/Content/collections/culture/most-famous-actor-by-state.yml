page:
  h1: "Most Famous Actor From Every State"
  intro_title: "One Recognizable Actor for Every State in the Union"

  quick_answer:
    - "John Goodman represents Missouri, with 155 acting credits over a 43-year career, second only to West Virginia's Brad Dourif for most credits on the list."
    - "Fame doesn't always track career length. Vermont's Damon Wayans Jr. and Wyoming's Matthew Fox both made the list with fewer than 30 acting credits each."
    - "Jason Momoa, representing Hawaii, draws the most annual page views in the group at 8,764,490, more than double most other entries, despite just 28 acting credits."
    - "Brad Dourif represents West Virginia with 168 acting credits, more than any other actor on the list, though his 768,436 annual page views rank among the lowest."

  methodology: "24/7 Wall St. ranked actors using an index of IMDb STARmeter position, audience ratings counts across their film and TV work, and Wikipedia page views from May 2017 to May 2018. Only actors in IMDb's top 10,000 STARmeter ranking qualified, each was assigned to their birth state, and people famous mainly for reasons other than acting were excluded."

  sources:
    - name: "24/7 Wall St. Most Famous Actor From Each State"
      url: "https://247wallst.com/special-report/2018/05/08/most-famous-actor-from-each-state/"
      description: "24/7 Wall St.'s fame index for each state's most recognizable actor, based on IMDb STARmeter ranking, audience ratings counts, and Wikipedia page views from May 2017 to May 2018"

