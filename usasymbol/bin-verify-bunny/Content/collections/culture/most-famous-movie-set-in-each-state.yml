seo:
  title: "The Most Famous Movie Set in Each State"
  description: "One defining film represents each US state, from The Wizard of Oz in Kansas to Fargo in Minnesota and Brokeback Mountain in Wyoming."

hero_image: "/images/collections/culture/most-famous-movie-set-in-each-state/hero.jpg"
hero_image_alt: "Collage of iconic American film scenes representing settings across the 50 US states"
hero_image_caption: "One film defines each state's cinematic identity, from Dorothy's Kansas farmhouse to the Las Vegas casino heist of Ocean's Eleven."

page:
  h1: "The Most Famous Movie Set in Each State"
  intro_title: "One Defining Film for Every State, From Kansas Tornadoes to Nevada Casino Heists"

  quick_answer:
    - "Kansas is defined on screen by The Wizard of Oz (1939), whose black-and-white farmhouse opening remains American film's most famous image of the state."
    - "Georgia's Gone with the Wind (1939) and Minnesota's Fargo (1996) anchor their states' film identity decades apart, and Fargo's title city is actually in neighboring North Dakota, where almost none of the story takes place."
    - "Several of the most 'authentic' state films were shot nowhere near the state they portray. Groundhog Day was filmed in Illinois, not Pennsylvania, and The Good, the Bad and the Ugly was filmed in Spain, not New Mexico."

  methodology: "Selections reflect the film most identified with each state's setting or story, drawn from established film-history reference lists, not a box-office ranking or filming-location count. Where a film's actual shooting location differs from its setting, that distinction is noted."

  sources:
    - name: "filmsite.org — 50 US States: Most Authentic and Famous Films"
      url: "https://www.filmsite.org/50states-films.html"
      description: "Film historian Tim Dirks's picks for the film most identified with each US state"

sections:
  - id: "movie-by-state"
    icon: "fa-solid fa-film"
    style: "law-cards"
    title: "The Most Famous Movie Set in Each State"
    paragraphs:
      - "Some states are inseparable from a single film. Kansas will always be The Wizard of Oz and Georgia will always be Gone with the Wind. Others are defined by a smaller, stranger story: Idaho by two hustlers on an empty highway, Vermont by a film crew disrupting small-town life."
    highlights:
      - name: "Alabama: To Kill a Mockingbird (1962)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/alabama.jpg"
        description: "Gregory Peck won the Best Actor Oscar as small-town Alabama lawyer Atticus Finch in this Depression-era adaptation of Harper Lee's novel. It remains the definitive screen portrait of the Jim Crow-era South."

      - name: "Alaska: Grizzly Man (2005)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/alaska.jpg"
        description: "Werner Herzog built his documentary from Timothy Treadwell's own footage of 13 summers living among brown bears in Katmai National Park, footage that ends with the audio of the 2003 attack that killed him."

      - name: "Arizona: The Searchers (1956)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/arizona.jpg"
        description: "John Ford shot this John Wayne Western largely in Arizona's Monument Valley, and it is frequently ranked among the greatest Westerns ever made, cementing Monument Valley's red-rock landscape as the state's cinematic signature."

      - name: "Arkansas: True Grit (1969)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/arkansas.jpg"
        description: "John Wayne won his only Oscar playing one-eyed U.S. Marshal Rooster Cogburn in this adaptation of Charles Portis's novel, set across 1870s Arkansas and Indian Territory."

      - name: "California: The Big Lebowski (1998)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/california.jpg"
        description: "The Coen brothers' cult comedy follows a Los Angeles slacker mistaken for a millionaire of the same name through the city's bowling alleys and canyon estates, shot almost entirely on location around LA."

      - name: "Colorado: The Shining (1980)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/colorado.jpg"
        description: "Stanley Kubrick's horror classic is set at the fictional Overlook Hotel high in the Colorado Rockies, inspired by Stephen King's real stay at the Stanley Hotel in Estes Park."

      - name: "Connecticut: The Ice Storm (1997)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/connecticut.jpg"
        description: "Ang Lee's drama follows two unraveling families in affluent New Canaan, Connecticut, during Thanksgiving week 1973, as suburban New England's composure cracks along with the ice storm of the title."

      - name: "Delaware: Fight Club (1999)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/delaware.jpg"
        description: "The film's city is never named on screen, but its source novel is widely read as placing the story in a decaying corner of Wilmington, Delaware, making it an unusually dark pick for the state's defining film."

      - name: "Florida: Scarface (1983)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/florida.jpg"
        description: "Al Pacino stars as Cuban refugee Tony Montana's rise and fall in Miami's 1980s cocaine trade, filmed partly on location in Miami and now one of the most quoted crime films ever made."

      - name: "Georgia: Gone with the Wind (1939)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/georgia.jpg"
        description: "The Civil War epic, set on the fictional Georgia plantation Tara and in Atlanta, won eight competitive Oscars including Best Picture, even though most of it was filmed on Hollywood backlots rather than in Georgia itself."

      - name: "Hawaii: Pearl Harbor (2001)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/hawaii.jpg"
        description: "The film dramatizes the December 7, 1941 attack on the US naval base at Pearl Harbor and was filmed partly on Oahu at the real Pearl Harbor and Hickam Field."

      - name: "Idaho: My Own Private Idaho (1991)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/idaho.jpg"
        description: "Gus Van Sant's drama stars River Phoenix and Keanu Reeves as two young hustlers, opening on an empty stretch of Idaho highway that becomes the film's recurring dream image."

      - name: "Illinois: Halloween (1978)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/illinois.jpg"
        description: "John Carpenter set his slasher classic in the fictional town of Haddonfield, Illinois, though it was actually filmed in South Pasadena, California, standing in for a quiet Midwestern suburb."

      - name: "Indiana: Hoosiers (1986)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/indiana.jpg"
        description: "Gene Hackman stars as a coach leading a tiny Indiana high school to a state basketball title, loosely based on Milan High School's real 1954 championship run, and filmed on location in small Indiana towns."

      - name: "Iowa: The Music Man (1962)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/iowa.jpg"
        description: "The musical, set in fictional River City, Iowa, in 1912, follows a con man selling band instruments to a skeptical town, and remains one of the most enduring stage-to-screen musicals ever made."

      - name: "Kansas: The Wizard of Oz (1939)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/kansas.jpg"
        description: "Dorothy's black-and-white Kansas farm gives way to Technicolor Oz after a tornado, and that sepia-toned opening remains the single most famous image of Kansas ever put on screen."

      - name: "Kentucky: Coal Miner's Daughter (1980)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/kentucky.jpg"
        description: "Sissy Spacek won the Best Actress Oscar playing country singer Loretta Lynn, tracing her path from a Butcher Holler, Kentucky, coal camp to the Grand Ole Opry stage."

      - name: "Louisiana: A Streetcar Named Desire (1951)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/louisiana.jpg"
        description: "Marlon Brando and Vivien Leigh star in Tennessee Williams's drama set in a sweltering, cramped New Orleans apartment, adapted from Williams's own Pulitzer-winning play."

      - name: "Maine: The Cider House Rules (1999)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/maine.jpg"
        description: "Michael Caine won the Supporting Actor Oscar as the head of a Maine orphanage in this adaptation of John Irving's novel, set among the state's apple orchards."

      - name: "Maryland: Diner (1982)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/maryland.jpg"
        description: "Barry Levinson's semi-autobiographical comedy follows a group of friends hanging around a Baltimore diner in the winter of 1959, launching the careers of Kevin Bacon and Ellen Barkin."

      - name: "Massachusetts: Good Will Hunting (1997)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/massachusetts.jpg"
        description: "Matt Damon and Ben Affleck won the Best Original Screenplay Oscar for the story of a janitor-genius from working-class South Boston, filmed largely on location around Boston and Cambridge."

      - name: "Michigan: RoboCop (1987)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/michigan.jpg"
        description: "Paul Verhoeven's satire imagines a near-future, crime-ravaged Detroit where a slain police officer is rebuilt as a cyborg enforcer, filmed partly at real Detroit locations."

      - name: "Minnesota: Fargo (1996)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/minnesota.jpg"
        description: "Despite the title, most of the Coen brothers' crime classic unfolds in Brainerd and the Minneapolis area of Minnesota, and the film won the Best Actress Oscar for Frances McDormand's unflappable, pregnant police chief."

      - name: "Mississippi: In the Heat of the Night (1967)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/mississippi.jpg"
        description: "Sidney Poitier plays a Philadelphia homicide detective drawn into a murder case in a hostile small Mississippi town, in a Best Picture winner that was actually filmed largely in Illinois rather than Mississippi itself."

      - name: "Missouri: Waiting for Guffman (1996)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/missouri.jpg"
        description: "Christopher Guest's mockumentary follows a small-town Missouri community theater troupe rehearsing a musical for the fictional town of Blaine's 150th anniversary."

      - name: "Montana: Legends of the Fall (1994)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/montana.jpg"
        description: "Brad Pitt stars in this multi-generational family saga set on a Montana ranch in the early 20th century, filmed on location amid the state's mountains, and it won the Best Cinematography Oscar for its landscapes."

      - name: "Nebraska: Nebraska (2013)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/nebraska.jpg"
        description: "Alexander Payne's black-and-white road movie follows an aging, possibly delusional father and his son driving toward Lincoln, Nebraska, to claim a sweepstakes prize that likely doesn't exist, filmed on location across the state."

      - name: "Nevada: Ocean's Eleven (2001)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/nevada.jpg"
        description: "George Clooney leads a crew of con artists plotting to rob three Las Vegas casino vaults simultaneously, filmed on location at real Strip casinos including the Bellagio."

      - name: "New Hampshire: On Golden Pond (1981)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/new-hampshire.jpg"
        description: "Henry Fonda and Katharine Hepburn play an aging couple summering at their New Hampshire lake house, filmed on New Hampshire's Squam Lake, and both won Oscars for the roles, Fonda's only competitive acting win."

      - name: "New Jersey: Clerks (1994)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/new-jersey.jpg"
        description: "Kevin Smith shot his black-and-white comedy for about $27,000 inside the real Quick Stop convenience store in Leonardo, New Jersey, where he actually worked, launching his career."

      - name: "New Mexico: The Good, the Bad and the Ugly (1966)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/new-mexico.jpg"
        description: "Sergio Leone's spaghetti Western, starring Clint Eastwood, was actually filmed in Spain and Italy, not New Mexico, but its desert vistas and Civil War-era gunfighter mythology have made it the state's cinematic stand-in anyway."

      - name: "New York: Manhattan (1979)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/new-york.jpg"
        description: "Woody Allen's black-and-white love letter to New York City opens with a montage of city landmarks set to Gershwin's Rhapsody in Blue, following a comedy writer navigating relationships across Manhattan."

      - name: "North Carolina: Blue Velvet (1986)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/north-carolina.jpg"
        description: "David Lynch's mystery-thriller is set in the fictional town of Lumberton, North Carolina, and was filmed largely in Wilmington, a production that helped establish Wilmington as a major East Coast filming hub still active today."

      - name: "North Dakota: Fargo (1996)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/north-dakota.jpg"
        description: "The Coen brothers' film opens and closes in its title city, though almost none of the actual story takes place there, and the name stuck because the filmmakers liked how the word sounded."

      - name: "Ohio: American Splendor (2003)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/ohio.jpg"
        description: "This part-documentary, part-drama tells the story of Cleveland comic book writer Harvey Pekar, blending real interview footage with dramatized scenes of his working-class life as a VA hospital file clerk."

      - name: "Oklahoma: Oklahoma! (1955)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/oklahoma.jpg"
        description: "The film adaptation of the Rodgers and Hammerstein musical, set among turn-of-the-century Oklahoma Territory farmers, was largely filmed in Arizona, though its title song became Oklahoma's official state song in 1953."

      - name: "Oregon: One Flew Over the Cuckoo's Nest (1975)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/oregon.jpg"
        description: "Filmed inside a real, then-operating psychiatric hospital in Salem, Oregon, the film swept the top five Academy Awards, including Best Picture and a Best Actor win for Jack Nicholson."

      - name: "Pennsylvania: Groundhog Day (1993)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/pennsylvania.jpg"
        description: "Bill Murray plays a weatherman trapped reliving February 2nd in Punxsutawney, Pennsylvania, though the film was actually shot in Woodstock, Illinois, a substitution few viewers ever notice."

      - name: "Rhode Island: The Witches of Eastwick (1987)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/rhode-island.jpg"
        description: "Jack Nicholson stars opposite Cher, Michelle Pfeiffer, and Susan Sarandon in this adaptation of John Updike's novel, set in the fictional Rhode Island town of Eastwick."

      - name: "South Carolina: Glory (1989)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/south-carolina.jpg"
        description: "The Civil War drama follows the 54th Massachusetts Infantry, one of the Union Army's first Black regiments, through its assault on South Carolina's Fort Wagner, and Denzel Washington won the Best Supporting Actor Oscar for it."

      - name: "South Dakota: Badlands (1973)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/south-dakota.jpg"
        description: "Terrence Malick's directorial debut, starring Martin Sheen and Sissy Spacek, follows a young couple on a killing spree across the South Dakota badlands, loosely based on the 1958 Starkweather-Fugate murders."

      - name: "Tennessee: The Evil Dead (1981)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/tennessee.jpg"
        description: "Sam Raimi's low-budget horror debut was actually shot in a remote Tennessee cabin, and it launched both Raimi's career and Bruce Campbell's as horror icon Ash Williams."

      - name: "Texas: Giant (1956)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/texas.jpg"
        description: "James Dean's final film, released after his death, follows a wealthy Texas ranching family across decades, filmed largely around Marfa, where the production's set ruins are still a tourist attraction today."

      - name: "Utah: 127 Hours (2010)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/utah.jpg"
        description: "Danny Boyle's film dramatizes real-life canyoneer Aron Ralston's ordeal after his arm became trapped by a boulder in Utah's Blue John Canyon, filmed on location in the actual canyon country where it happened."

      - name: "Vermont: State and Main (2000)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/vermont.jpg"
        description: "David Mamet's comedy follows a Hollywood film crew descending on a small Vermont town to shoot a movie, with chaos following as the production disrupts everyday small-town life."

      - name: "Virginia: Lincoln (2012)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/virginia.jpg"
        description: "Steven Spielberg's film on the final months of Abraham Lincoln's presidency was filmed largely around Richmond, Virginia, whose historic architecture stood in for 1860s Washington, D.C., and Daniel Day-Lewis won the Best Actor Oscar."

      - name: "Washington: Twilight (2008)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/washington.jpg"
        description: "The vampire romance is set in the real town of Forks, Washington, chosen by author Stephenie Meyer for its famously overcast climate, though the film was actually shot largely in Oregon."

      - name: "West Virginia: The Night of the Hunter (1955)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/west-virginia.jpg"
        description: "Robert Mitchum stars as a murderous, self-styled preacher stalking two children through the rivers and hills of West Virginia in the only film actor Charles Laughton ever directed."

      - name: "Wisconsin: Bridesmaids (2011)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/wisconsin.jpg"
        description: "Kristen Wiig stars as a Milwaukee, Wisconsin, maid of honor whose life unravels while planning her best friend's wedding, in a comedy that earned Melissa McCarthy an Oscar nomination."

      - name: "Wyoming: Brokeback Mountain (2005)"
        image: "/images/collections/culture/most-famous-movie-set-in-each-state/wyoming.jpg"
        description: "Ang Lee's drama follows two Wyoming ranch hands' decades-long secret relationship after a summer herding sheep on the fictional title mountain, filmed largely in Alberta, Canada, and won three Oscars including Best Director."

  - id: "when-the-setting-and-the-filming-location-dont-match"
    icon: "fa-solid fa-map-location-dot"
    title: "State Movies That Were Actually Filmed Somewhere Else"
    paragraphs:
      - "A state's defining film often wasn't shot there at all. Groundhog Day is inseparable from Punxsutawney, Pennsylvania, but was filmed in Woodstock, Illinois. The Good, the Bad and the Ugly stands in for New Mexico Territory despite being filmed in Spain and Italy, and In the Heat of the Night depicts a hostile Mississippi town while it was actually shot in Illinois, a choice the production made because filming in the Deep South during the civil rights era was considered unsafe."
      - "Fargo is the strangest case on this list. The Coen brothers named their film after the North Dakota city where it opens and closes, but nearly the entire story unfolds across the state line in Brainerd and Minneapolis, Minnesota. Both states claim the film as their own."

faq:
  - question: "What is the most famous movie set in every state?"
    answer: "One film represents each state's cinematic identity, from The Wizard of Oz in Kansas to Gone with the Wind in Georgia and Brokeback Mountain in Wyoming, listed state by state above."

  - question: "What movie is most associated with Minnesota and North Dakota?"
    answer: "Fargo (1996). The title city is in North Dakota, but nearly the entire story takes place across the state line in Brainerd and the Minneapolis area of Minnesota."

  - question: "Was Groundhog Day actually filmed in Pennsylvania?"
    answer: "No. The film is set in Punxsutawney, Pennsylvania, but was actually shot in Woodstock, Illinois, a substitution most viewers never notice."

  - question: "Which state's movie won the most Oscars?"
    answer: "Gone with the Wind, Georgia's defining film, won eight competitive Academy Awards including Best Picture, more than any other film on this list."

  - question: "What is the most famous movie set in Texas?"
    answer: "Giant (1956), James Dean's final film, following a wealthy Texas ranching family across decades. It was filmed largely around Marfa, where the set's ruins remain a tourist attraction."

  - question: "Why wasn't In the Heat of the Night filmed in Mississippi?"
    answer: "The production filmed largely in Illinois instead of Mississippi because the filmmakers considered it unsafe to shoot in the Deep South during the civil rights era, even though the story is set in a small Mississippi town."

