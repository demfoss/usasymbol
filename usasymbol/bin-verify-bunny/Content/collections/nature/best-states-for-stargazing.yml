page:
  h1: "The Best US States for Stargazing"
  intro_title: "Best Stargazing Conditions in the United States"

  quick_answer:
    - "South Dakota ranks first for stargazing at 7.79 out of 10, with 52.66% of its land mapped in Bortle Classes 1 through 3."
    - "Wyoming (7.65) and Alaska (7.64) follow. Wyoming has 46.39% of its land in Bortle Classes 1 through 3, while Alaska adds aurora viewing during its dark season."
    - "Arizona ranks fifth despite posting the study's lowest cloud-cover measure at 6.7%. Its smaller share of Class 1 through 3 territory keeps it behind the four leaders."

  methodology: "The published 10-point score combines each state's mapped shares of Bortle Classes 1 through 3 with the study's cloud-cover measure. This page reproduces the published top 10, but the score compares statewide conditions and does not guarantee clear weather at a specific site."

