faq:
  - question: "Is it illegal to paint a horse in Vermont?"
    answer: "Only for competition fraud. Vermont law bans entering a painted or disguised horse in an agricultural society competition to win a prize under a false identity. Decorating a horse for fun is not covered."
  - question: "Is Vermont's billboard ban still enforced?"
    answer: "Yes. Vermont has banned off-premises billboards statewide since 1968 and still enforces limits on the size and placement of on-premises business signs."
  - question: "Can a Vermont homeowners' association ban clotheslines?"
    answer: "No. State law since 2009 has protected clotheslines and other renewable-energy devices from municipal or association bans, with an exception for rented patios in condos and apartments."
  - question: "Did Vermont really require women to get permission for false teeth?"
    answer: "No. That claim is a myth traced back to an 1856 court case about a husband's bill for his wife's dentures, not a permission law."
  - question: "What is the weirdest real law still on the books in Vermont?"
    answer: "The horse-disguising law is the strongest candidate. It sounds absurd until you learn it targeted 19th-century fair fraud, not backyard decorating."
  - question: "Was margarine really required to be dyed pink in Vermont?"
    answer: "Yes, historically. Vermont required pink-dyed margarine in the 1880s to protect the dairy industry, though the requirement became unenforceable once courts struck down similar state laws around 1898."
