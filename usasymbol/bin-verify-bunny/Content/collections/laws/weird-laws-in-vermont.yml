page:
  h1: "Weird Vermont Laws Still on the Books"
  quick_answer:
    - "Three Vermont weird-law claims are genuinely real: the horse-disguising fraud law, the 1968 billboard ban, and the right-to-dry clothesline law."
    - "The horse law only bans disguising a horse to cheat at an agricultural fair, not painting a horse for fun."
    - "Claims about underwater whistling, frozen doves, and a giraffe tied to a telephone pole are myths or unverified stories with no matching statute."
  sources:
    - name: "Vermont Statutes Online — Painting or Disguising Horses, 13 V.S.A. § 2013"
      url: "https://legislature.vermont.gov/statutes/section/13/047/02013"
