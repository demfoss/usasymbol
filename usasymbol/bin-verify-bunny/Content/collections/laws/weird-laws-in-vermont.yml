sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Vermont That Are Real"
    paragraphs:
      - "A horse-fraud statute, a scenic-roads ban, and a laundry-line protection rule anchor the Unusual Laws in Vermont that hold up against the actual statute book."
    highlights:
      - name: "Painting or Disguising a Horse"
        status: "Verified"
        image: "/images/collections/laws/vermont-horse-painting.jpg"
        description: |
          **Law:** Vermont makes it a crime to enter a horse that has been painted or disguised, or falsely represented as a different animal, in a competition for an agricultural society's prize money.

          **Meaning:** Decorating a horse for fun is not covered. The rule targets owners who tried to pass one horse off as another to win money it was not entitled to.

          **Reason:** County and state fairs handed out real cash prizes, and disguising a horse's identity was a cheap way to fool judges before reliable registration records existed.
      - name: "Vermont's Statewide Billboard Ban"
        status: "Verified"
        image: "/images/collections/laws/vermont-billboard-ban.jpg"
        description: |
          **Law:** Vermont bans off-premises billboards statewide and tightly limits the size and placement of on-premises business signs.

          **Meaning:** A business can still post a sign advertising itself on its own property, capped at 150 square feet. Renting space on a highway billboard elsewhere is not allowed.

          **Reason:** Lawmakers passed the ban in 1968 to protect the state's mountain scenery from roadside advertising, making Vermont the first state in the continental U.S. to prohibit billboards outright.
      - name: "The Right to Dry"
        status: "Verified"
        image: "/images/collections/laws/vermont-clothesline-law.jpg"
        description: |
          **Law:** No Vermont municipality, condo bylaw, or homeowners' rule can prohibit clotheslines or other renewable-energy devices like solar collectors.

          **Meaning:** A neighborhood cannot fine a resident for hanging laundry outside. The protection stops short of rented patios in condos and apartments, which are carved out of the rule.

          **Reason:** A state senator added the provision to a 2009 energy bill to shield a low-cost, no-emissions way to dry clothes from aesthetic complaints and covenant restrictions.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Vermont We Couldn't Verify"
    paragraphs:
      - "Underwater whistling and a strangely specific delivery rule top the list of Strange Vermont Laws that keep circulating without a matching statute anywhere in state code."
    subsections:
      - subtitle: "Whistling underwater is against the law in Vermont"
        status: "Not Verified"
        text: |
          **Claim:** Vermont law makes it illegal to whistle underwater.

          **Why We Couldn't Verify It:** No statute or regulation using this language appears anywhere in the Vermont Statutes Online. Whistling underwater is also close to physically impossible, which suggests the claim began as a joke entry on an early weird-laws list and simply kept getting copied.
      - subtitle: "Delivery drivers must walk backward to homes worth over $500,000"
        status: "Not Verified"
        text: |
          **Claim:** Anyone delivering goods to a Vermont home valued above $500,000 must approach the house walking backward.

          **Why We Couldn't Verify It:** No town, county, or state code anywhere in Vermont ties a delivery rule to a specific home value. Dollar thresholds like this one do not appear in the 19th and early 20th century laws that make up most of Vermont's genuinely old statutes, which is a strong sign the claim is invented.
      - subtitle: "It's illegal to keep a dove in your freezer"
        status: "Not Verified"
        text: |
          **Claim:** Vermont law prohibits keeping a frozen dove in a home freezer.

          **Why We Couldn't Verify It:** No fish and wildlife rule, food code, or municipal ordinance matching this claim appears in Vermont statutes. Versions of the same frozen-bird claim get attached to other states' lists too, and none of them has ever produced an actual rule.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Vermont Laws That Are Myths"
    paragraphs:
      - "Real Vermont Laws You Won't Believe include a few famous claims that fall apart once the actual record turns up, starting with a denture rule that traces to a single 1856 court case."
    subsections:
      - subtitle: "Vermont women need a husband's written permission to get false teeth"
        status: "Myth"
        text: |
          **Myth:** A Vermont law requires a woman to get her husband's written permission before getting false teeth.

          **Reality:** The claim grew out of an 1856 case, Gilman v. Andrus, in which a husband was ordered to pay a dentist for dentures made for his wife. That was a bill-payment dispute, not a permission requirement, and no Vermont statute has ever demanded a husband's sign-off for dentures.
      - subtitle: "It's illegal to tie a giraffe to a telephone pole in Vermont"
        status: "Myth"
        text: |
          **Myth:** Vermont law specifically bans tying a giraffe to a telephone pole.

          **Reality:** No such statute exists in the Vermont Statutes Online, and Vermont has no particular history with giraffes that would explain one. The same joke-shaped claim, an exotic animal tied to ordinary street furniture, gets recycled across weird-law lists for other states with the animal swapped out.
      - subtitle: "Calling a Vermont courtroom a 'kangaroo court' carries a $200 fine"
        status: "Myth"
        text: |
          **Myth:** Insulting a Vermont court by calling it a "kangaroo court" is a specific $200 crime.

          **Reality:** Vermont has general contempt-of-court and disorderly-conduct rules that can apply to disruptive courtroom behavior. No statute names the phrase "kangaroo court" or attaches a fixed $200 fine to using it, and that oddly precise detail is what gives the claim away.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Vermont's Part-Time Legislature Leaves Old Statutes Alone"
    paragraphs:
      - "Vermont's General Assembly is one of the last true citizen legislatures in the country, meeting for roughly 18 weeks a year while most lawmakers hold other full-time jobs. Only about 16 percent of Vermont legislators report working 60-plus-hour weeks during session, compared with 63 percent in a state like Maryland. Repealing a 19th-century horse-fraud statute rarely competes for floor time against the budget, education, and energy bills a short session has to finish."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Vermont's billboard ban made it the first state in the continental U.S. to prohibit outdoor advertising outright, a title it has held since 1968."
      - "The 2009 right-to-dry law protects solar collectors in the same sentence as clotheslines, treating a laundry line as a renewable-energy device under Vermont law."
      - "The horse-disguising statute was written for county and state agricultural fairs, aimed at owners who disguised a horse to steal a cash prize meant for a different animal."
      - "Vermont and a handful of other dairy states required margarine to be dyed pink in the 1880s to protect butter sales, a rule courts struck down as unconstitutional within about fifteen years."
      - "Vermont's two-year lawmaking period, called the biennium, is set by the state constitution to begin on 'the first Wednesday next after the first Monday of January' following each election."

