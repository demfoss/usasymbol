  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange New Mexico Laws That Are Myths"
    paragraphs:
      - "One Strange New Mexico Laws claim about camels turns out to be a real law from an entirely different state."
    subsections:
      - subtitle: "It's illegal to drive a camel on a New Mexico highway"
        status: "Myth"
        text: |
          **Myth:** New Mexico bans driving a camel on a public highway.

          **Reality:** This is a genuine law, just in Nevada, not New Mexico. It traces to leftover camels from a failed 1850s U.S. Army pack-animal experiment that were later released into the Nevada desert. No matching statute exists in New Mexico's code.

      - subtitle: "Women aren't allowed to pump gas or change a flat tire"
        status: "Myth"
        text: |
          **Myth:** New Mexico law bans women from pumping their own gas or changing a flat tire.

          **Reality:** No statute anywhere in the code addresses gender and car maintenance. This exact claim pattern recurs across weird-law lists for several other states too, a strong sign of a recycled, fabricated entry.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New Mexico's Unpaid, 30-Day Legislature Leaves Old Rules Standing"
    paragraphs:
      - "New Mexico is the only state in the country with a fully unpaid Legislature, and its regular sessions run just 60 days in odd years and only 30 budget-focused days in even years. With lawmakers working essentially as volunteers on one of the shortest calendars in the nation, a narrow statute like the anthem-medley rule almost never becomes urgent enough to spend scarce floor time repealing."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New Mexico was one of only two states, alongside Louisiana, where cockfighting remained fully legal right up until its 2007 ban."
      - "The horse-tripping law escalates from a misdemeanor to a fourth-degree felony specifically if the horse is injured or killed."
      - "New Mexico is the only U.S. state whose legislators receive no salary at all, only a per diem for expenses."
      - "In even-numbered years, New Mexico's 30-day legislative session is legally restricted to budget matters and the governor's specific requests."
      - "The camel-driving myth traces back to real camels imported by the U.S. Army in the 1850s for a road-building project between New Mexico and California."

