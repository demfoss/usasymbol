sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in New Mexico That Are Real"
    paragraphs:
      - "New Mexico was one of the last states in the country to ban cockfighting, and that's just one of several Unusual Laws in New Mexico that check out against the actual code."
    highlights:
      - name: "Tripping a Horse Can Be a Felony"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-horse-tripping.jpg"
        description: |
          **Law:** Intentionally causing a running horse to trip or fall by roping or tripping its legs is a misdemeanor, and a fourth-degree felony if the horse is injured or killed.

          **Meaning:** The rule targets a specific rodeo-style event, not accidental falls during ordinary riding or ranch work.

          **Reason:** Horse tripping was once a fairground and rodeo spectacle, and the felony-grade penalty for injury reflects a deliberate legislative choice to treat it as serious animal cruelty.

      - name: "Misusing the National Anthem Is a Petty Misdemeanor"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-anthem-law.jpg"
        description: |
          **Law:** Playing the national anthem, or New Mexico's own state song "O, Fair New Mexico," as part of a medley or for commercial advertising is a petty misdemeanor.

          **Meaning:** A marching band playing the anthem straight through at a game is fine. Splicing it into a jingle or a mashup is what the law targets.

          **Reason:** The statute reflects an older legal tradition of protecting patriotic symbols and songs from being trivialized or exploited commercially.

      - name: "Cockfighting Wasn't Banned Until 2007"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-cockfighting-ban.jpg"
        description: |
          **Law:** New Mexico banned causing, sponsoring, or participating in a cockfight, along with training or equipping a rooster for one.

          **Meaning:** Before 2007, New Mexico was one of only two states, along with Louisiana, where cockfighting was still fully legal.

          **Reason:** A single state senator introduced the ban for 20 consecutive years before it finally passed. Governor Bill Richardson signed it into law effective June 15, 2007.

      - name: "The State Constitution Once Barred 'Idiots' From Voting"
        status: "Repealed"
        image: "/images/collections/laws/new-mexico-voting-rights.jpg"
        description: |
          **Law:** New Mexico's 1910 constitution excluded "idiots" and "insane persons" from voting alongside people convicted of certain crimes.

          **Meaning:** The outdated language stayed in the state constitution for a century, even as attitudes and terminology changed completely.

          **Reason:** Voters approved amendments updating the language, and the state Supreme Court affirmed the change, replacing it with narrower, modern criteria tied to demonstrated inability to mark or communicate a ballot.

