faq:
  - question: "Is horse tripping illegal in New Mexico?"
    answer: "Yes. Intentionally tripping a running horse is a misdemeanor, and it escalates to a fourth-degree felony if the horse is injured or killed."
  - question: "When did New Mexico ban cockfighting?"
    answer: "In 2007, after a single state senator introduced the ban for 20 consecutive years. New Mexico was one of the last two states in the country, along with Louisiana, to still allow it."
  - question: "Is it illegal to misuse the national anthem in New Mexico?"
    answer: "Yes. Playing the anthem as part of a medley or for commercial advertising is a petty misdemeanor under state law, and the same protection covers New Mexico's own state song."
  - question: "Is the camel highway law a real New Mexico rule?"
    answer: "No, though it's a real law. It belongs to Nevada, not New Mexico, and traces back to camels released from a failed 1850s Army pack-animal project."
  - question: "Did New Mexico's constitution really ban certain people from voting?"
    answer: "Yes. The 1910 constitution excluded people labeled 'idiots' and 'insane persons' from voting. Voters approved updated language decades later, replacing it with narrower, modern criteria."
  - question: "What is the weirdest real law still on the books in New Mexico?"
    answer: "The felony horse-tripping law surprises people most, since a rodeo-style event most people have never heard of carries a penalty as serious as many violent crimes."
