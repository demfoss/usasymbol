faq:
  - question: "Is cannibalism actually legal in Idaho?"
    answer: "No, it's a felony punishable by up to 14 years in prison. The law only carves out an exception when it was the sole means of survival under extreme, life-threatening conditions."
  - question: "What are Idaho's Deluxe potato standards?"
    answer: "Idaho law sets strict size and quality rules for any potato sold under the 'Idaho Deluxe' label, including freedom from rot and sun damage. Selling substandard potatoes under that label can bring a $5,000 fine."
  - question: "Is Idaho's internet hunting ban real?"
    answer: "Yes. Shooting wildlife using a gun controlled through an internet connection is illegal in Idaho, part of a national wave of bans passed after remote-controlled rifle hunting websites appeared in 2005."
  - question: "Was frowning really illegal in Pocatello?"
    answer: "The stunt was real. A 1948 mayor announced a joke ordinance banning frowning after a brutal winter, and it made national news, but it was never entered into the actual city code."
  - question: "What is the weirdest real law still on the books in Idaho?"
    answer: "The cannibalism statute surprises the most people, mainly because it explicitly names a survival exception rather than leaving the question to a court's discretion."
  - question: "Is the Idaho camel-fishing law real?"
    answer: "Not as written. A real 1917 law banned fishing from any animal's back to protect trout eggs, but it named no specific animal and is no longer in force. The camel detail was added later as a joke."
