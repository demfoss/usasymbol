page:
  h1: "Weird Idaho Laws Still on the Books"
  quick_answer:
    - "Four Idaho weird-law claims check out: a cannibalism statute, Idaho Deluxe potato grading rules, an internet hunting ban, and an old timber-sabotage law."
    - "The cannibalism law is real but narrow. It only punishes cannibalism that wasn't the sole means of surviving an extreme, life-threatening situation."
    - "The famous camel-fishing law is an embellished version of a real 1917 rule that banned fishing from the back of any animal, not just camels."
  sources:
