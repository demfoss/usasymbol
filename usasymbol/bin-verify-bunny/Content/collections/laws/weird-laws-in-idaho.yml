sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Idaho That Are Real"
    paragraphs:
      - "A cannibalism statute with a built-in survival exception anchors the Unusual Laws in Idaho that check out against the actual code. All four are still active parts of Idaho law today."
    highlights:
      - name: "Cannibalism Is Illegal, With One Exception"
        status: "Verified"
        image: "/images/collections/laws/idaho-cannibalism-law.jpg"
        description: |
          **Law:** Idaho law makes willfully eating human flesh or blood a felony punishable by up to 14 years in prison.

          **Meaning:** The statute includes a specific affirmative defense: it doesn't apply if the act happened under extreme, life-threatening conditions as the only apparent way to survive.

          **Reason:** Lawmakers wrote the exception with real survival situations in mind, such as a stranded traveler in Idaho's backcountry, rather than leaving no legal distinction between a genuine emergency and a crime.

      - name: "Idaho Deluxe Potatoes Have Legal Standards"
        status: "Verified"
        image: "/images/collections/laws/idaho-deluxe-potato-law.jpg"
        description: |
          **Law:** Idaho law defines strict grading standards for any potato sold or labeled as "Idaho Deluxe," including minimum size and freedom from rot, blackheart, and sun damage.

          **Meaning:** Selling a substandard potato under that specific label can bring up to six months in jail or a $5,000 fine.

          **Reason:** Idaho built its identity and export economy around potato quality, so the state backed its top grade with real legal weight instead of leaving it as a marketing term.

      - name: "You Can't Hunt With an Internet-Connected Weapon"
        status: "Verified"
        image: "/images/collections/laws/idaho-internet-hunting-ban.jpg"
        description: |
          **Law:** Idaho bans shooting or killing wildlife using a gun or other device that's accessed or controlled through an internet connection.

          **Meaning:** So-called remote or "internet hunting," where someone fires a weapon from a computer far from the animal, is flatly illegal in the state.

          **Reason:** The rule followed a national backlash after a website began offering remote-controlled rifle hunts online in 2005, a practice hunting and animal-welfare groups agreed violated basic fair-chase principles.

      - name: "Driving a Spike Into a Log Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/idaho-log-spiking-law.jpg"
        description: |
          **Law:** Idaho makes it a crime to drive a nail, spike, or piece of metal into any log or timber meant to be milled into lumber, punishable by up to five years in prison.

          **Meaning:** Sabotaging timber before it reaches a sawmill carries the same weight as other serious property crimes.

          **Reason:** The law passed in 1917 during a major IWW-led timber workers' strike that paralyzed Idaho's logging industry, aiming to stop sabotage tactics before they could damage mill equipment or hurt workers.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Idaho We Couldn't Verify"
    paragraphs:
      - "Not all Real Idaho Laws You Won't Believe leave behind an actual ordinance. Pocatello's frowning ban is the most famous example, and an age cutoff for motorcycle riders in Idaho Falls comes close behind it."
    subsections:
      - subtitle: "Frowning was illegal in Pocatello"
        status: "Not Verified"
        text: |
          **Claim:** Pocatello made it illegal to frown, scowl, or otherwise fail to smile within city limits.

          **Why We Couldn't Verify It:** The stunt itself really happened. Mayor George Philips announced the tongue-in-cheek rule in 1948 after a brutal 13-week winter, and it made local news. But it was never formally entered into Pocatello's actual city code, so no citable ordinance number exists behind the famous story.

      - subtitle: "No one over 88 can ride a motorcycle in Idaho Falls"
        status: "Not Verified"
        text: |
          **Claim:** Idaho Falls bans anyone older than 88 from operating a motorcycle within city limits.

          **Why We Couldn't Verify It:** Dozens of sites repeat this exact age cutoff, but none of them cite an actual ordinance number, and no record of anyone ever being cited under it has surfaced. Nobody has offered a clear reason for why 88 specifically would be the cutoff.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Idaho Laws That Are Myths"
    paragraphs:
      - "Fishing from an animal's back is the single most repeated Strange Idaho Laws myth, told with a different animal depending on who's retelling it, and a supposed time limit on public affection tells a similar story."
    subsections:
      - subtitle: "You can't fish while sitting on a camel's back in Idaho"
        status: "Myth"
        text: |
          **Myth:** Idaho specifically bans fishing while seated on a camel's back.

          **Reality:** Idaho never had a camel-specific law. A real 1917 rule banned fishing from the back of any animal at all, passed because a game warden argued that riding a horse up and down streams destroyed trout eggs. The law is no longer in force today, and the "camel" detail is a later embellishment, since Idaho has no wild camels. The same joke also circulates with a giraffe standing in for the camel.

      - subtitle: "Public displays of affection are capped at 18 minutes in Idaho"
        status: "Myth"
        text: |
          **Myth:** Idaho law limits how long a couple can kiss or embrace in public to exactly 18 minutes.

          **Reality:** No such time limit appears anywhere in Idaho's actual code. The claim is a stock entry that shows up on generic "weird law" lists with the same specific number attached to other states, which is a strong sign it was never a real rule tied to Idaho at all.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Idaho's Part-Time Legislature Leaves Old Rules Alone"
    paragraphs:
      - "Idaho's legislature is a part-time, citizen body that typically wraps up its session within a few months each year, leaving little room to revisit century-old statutes nobody is currently breaking. On top of that, Idaho has more than 200 incorporated cities, each keeping its own separate municipal code with no statewide office responsible for auditing them, which is exactly how a 1948 mayoral stunt in Pocatello and an age-88 motorcycle rule in Idaho Falls each ended up sitting untouched in their own city files for decades."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Idaho's cannibalism statute sits inside the state's mayhem chapter, the same section of law that historically covered maiming and disfigurement crimes."
      - "The 1917 timber-sabotage law was passed the same year Idaho lawmakers banned fishing from an animal's back, both responses to disputes in the state's logging and outdoor industries."
      - "Idaho Fish and Game has fielded so many questions about the camel-fishing myth that the agency published an official explainer addressing it directly."
      - "Pocatello still celebrates an annual 'Smile Days' event that grew out of the 1948 frowning stunt, decades after the original joke ordinance was forgotten and rediscovered."
      - "Idaho's internet hunting ban was part of a wider wave of similar state laws passed after a Texas website began offering remote-controlled rifle hunts in 2005."

