page:
  h1: "Real New Jersey Laws You Won't Believe"
  quick_answer:
    - "Four New Jersey claims check out: the recently repealed self-serve gas ban, a sleigh-bell requirement, a body-armor crime statute, and a handcuffs-to-minors sale ban."
    - "New Jersey was the last state to fully ban self-serve gas, a rule that lasted from 1949 until the Legislature finally repealed it in late 2023."
    - "The frowning-at-a-police-officer claim and the birds-on-statues claim are internet fiction with no statute behind either one."
