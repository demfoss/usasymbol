sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in New Jersey That Are Real"
    paragraphs:
      - "New Jersey drivers only started pumping their own gas in 2023, one of several Unusual Laws in New Jersey that hold up once you check the actual code and its history."
    highlights:
      - name: "Self-Serve Gas Was Banned for 74 Years"
        status: "Repealed"
        image: "/images/collections/laws/new-jersey-self-serve-gas.jpg"
        description: |
          **Law:** New Jersey banned customers from pumping their own gasoline starting in 1949, and stayed the only state enforcing a full ban after Oregon lifted its own version in 2023.

          **Meaning:** For 74 years, every gas station attendant in the state pumped gas for you by law, not by choice.

          **Reason:** The original 1949 act cited fire-safety concerns. Legal challenges tried to overturn it for decades, but the ban held until the Legislature finally repealed it and allowed self-service statewide in late 2023.

      - name: "Sleighs Need Enough Bells to Be Heard Coming"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-sleigh-bells.jpg"
        description: |
          **Law:** A horse pulling a sleigh or sled on a highway must wear enough bells on its harness to warn people of its approach.

          **Meaning:** It's still an active provision of the state's traffic code, not a forgotten colonial-era rule.

          **Reason:** Before headlights and engine noise, a horse-drawn sleigh moving quickly across snow could approach silently, so bells served as the era's version of a warning horn.

      - name: "Wearing Body Armor During a Violent Crime Is Its Own Offense"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-body-vest-law.jpg"
        description: |
          **Law:** Wearing bullet-resistant body armor while committing or fleeing a serious crime like robbery or assault is a separate crime on top of the underlying offense.

          **Meaning:** Prosecutors don't have to prove the vest was actually used defensively, just that it was worn during the crime.

          **Reason:** Lawmakers treated body armor as a sign of premeditated violence, since criminals wearing vests are typically planning for an armed confrontation rather than just committing a spontaneous offense.

      - name: "You Can't Sell Handcuffs to a Minor"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-handcuffs-law.jpg"
        description: |
          **Law:** Selling handcuffs to anyone under 18 is a disorderly persons offense, and police can confiscate handcuffs sold in violation of the rule on the spot.

          **Meaning:** The law defines handcuffs specifically as devices conventionally used for law enforcement restraint, not toy versions.

          **Reason:** Enacted in 1991, the law treats real restraint devices in a minor's hands as a public-safety concern serious enough to warrant its own statute rather than general retail rules.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in New Jersey We Couldn't Verify"
    paragraphs:
      - "A famous Trenton pickle story anchors the list of Weird New Jersey Laws Still on the Books claims that couldn't be traced to an actual current ordinance."
    subsections:
      - subtitle: "Eating pickles in Trenton on a Sunday is illegal"
        status: "Not Verified"
        text: |
          **Claim:** Trenton bans eating pickles on Sundays, and separately bans throwing a spoiled pickle into the street.

          **Why We Couldn't Verify It:** The claim traces back to a 1976 humor book cataloging odd local ordinances nationwide, not to a current, citable Trenton code section. No ordinance number has ever been produced to confirm it.

      - subtitle: "Newark ice cream shops must hire security after 4 p.m."
        status: "Not Verified"
        text: |
          **Claim:** Newark requires ice cream shops that draw crowds to provide security starting at 4 p.m.

          **Why We Couldn't Verify It:** No matching Newark municipal code section has been located. The claim appears only on generic listicle round-ups without a citation.

      - subtitle: "Haddon Township bans approaching strangers of the opposite sex"
        status: "Not Verified"
        text: |
          **Claim:** A Haddon Township ordinance bans unsolicited public interaction with strangers of the opposite sex.

          **Why We Couldn't Verify It:** No ordinance number or date has ever been attached to this claim by the sites repeating it, which usually signals it never had a real source.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange New Jersey Laws That Are Myths"
    paragraphs:
      - "Two Strange New Jersey Laws claims collapse immediately once you look for the statute behind either one."
    subsections:
      - subtitle: "Frowning at a police officer is illegal"
        status: "Myth"
        text: |
          **Myth:** New Jersey law makes it illegal to frown at a police officer.

          **Reality:** No statute anywhere addresses facial expressions directed at officers. It's a wildly exaggerated retelling that likely started from general disorderly-conduct or obstruction language, stretched far past what those laws actually cover.

      - subtitle: "Birds are banned from defecating on statues"
        status: "Myth"
        text: |
          **Myth:** A New Jersey law prohibits birds from defecating on public statues.

          **Reality:** No such statute exists, and animals can't legally be bound by human law anyway. This is a pure internet joke with no ordinance behind it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why 564 Separate Towns Keep New Jersey's Old Rules Alive"
    paragraphs:
      - "New Jersey has 564 separate municipal governments, each with real home-rule authority over its own zoning, services, and local ordinances, layered on top of 21 counties and their own school districts. With that much duplicated local machinery and no regional planning requirement, an old ordinance like a Sunday pickle rule can survive for generations simply because no single office is responsible for reviewing every town's code."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New Jersey was the last state fully enforcing a self-serve gas ban, holding out until Oregon lifted its own restriction in 2023."
      - "The original 1949 gas-pumping ban survived a state Supreme Court challenge just a year after it passed."
      - "New Jersey's body-armor statute grades the offense as a second-degree crime if the underlying offense is itself a first-degree crime."
      - "The handcuffs-to-minors law was enacted in 1991 and still requires police to confiscate handcuffs sold in violation of it."
      - "New Jersey packs 564 municipalities into just 21 counties, giving it one of the most fragmented local government structures in the country."

