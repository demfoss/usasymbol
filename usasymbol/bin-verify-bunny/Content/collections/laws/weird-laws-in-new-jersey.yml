faq:
  - question: "Can you pump your own gas in New Jersey now?"
    answer: "Yes. New Jersey banned self-serve gas from 1949 until the Legislature repealed the rule in late 2023, ending the last full statewide ban of its kind in the country."
  - question: "Is it illegal to sell handcuffs to a minor in New Jersey?"
    answer: "Yes. Selling handcuffs to anyone under 18 is a disorderly persons offense, and police can confiscate the handcuffs on the spot."
  - question: "Is the sleigh bell law in New Jersey real?"
    answer: "Yes. State traffic law requires a horse pulling a sleigh or sled on a highway to wear enough bells to warn people of its approach."
  - question: "Is wearing a bulletproof vest illegal in New Jersey?"
    answer: "Only in a specific context. Wearing body armor while committing or fleeing a serious crime is a separate offense on top of the underlying charge, not a general ban on owning or wearing one."
  - question: "Is frowning at a police officer illegal in New Jersey?"
    answer: "No. This is a myth with no statute behind it. No New Jersey law addresses facial expressions directed at law enforcement."
  - question: "What is the weirdest real law still on the books in New Jersey?"
    answer: "The recently repealed self-serve gas ban stands out most, since it shaped daily life for 74 years and only ended in 2023, well within most residents' living memory."
