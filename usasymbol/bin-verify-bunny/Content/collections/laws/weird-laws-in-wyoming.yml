page:
  h1: "Weird Wyoming Laws Still on the Books"
  quick_answer:
    - "Four Wyoming weird-law claims check out: an impaired-skiing ban, a wildlife-harassment law, a DUI statute that technically covered horseback riders, and a Laramie no-spitting ordinance."
    - "Wyoming's DUI law never mentioned horses until a 2026 bill excluded them, meaning riders could technically have faced charges meant for cars."
    - "A rabbit-photo permit and a horse-tattooing ban are unverified, while the giraffe-fishing and donkey-bathtub claims are myths borrowed from other states."
