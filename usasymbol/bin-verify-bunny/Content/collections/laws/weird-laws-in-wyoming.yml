faq:
  - question: "Could you really get a DUI in Wyoming for riding a drunk horse?"
    answer: "Until a 2026 bill fixed the wording, yes, technically. Wyoming's DUI statute defined vehicle broadly enough that a horse being ridden was not clearly excluded, prompting lawmakers to pass the Saddles, Not Steering Wheels Act."
  - question: "Is it illegal to ski drunk in Wyoming?"
    answer: "Yes. Wyoming law bans riding a ski lift uphill or using any slope or trail while impaired by alcohol or drugs."
  - question: "Can you chase wildlife with a snowmobile in Wyoming?"
    answer: "No. State law bans using a vehicle, snowmobile, or aircraft to harass, pursue, or kill wildlife, treating it as a criminal offense separate from ordinary hunting."
  - question: "Is spitting on the sidewalk illegal in Wyoming?"
    answer: "In Laramie, yes. City code bans spitting on public sidewalks and on the floors of theaters, halls, and public buildings, a rule that traces back to early public-health campaigns against tuberculosis."
  - question: "Is the Wyoming rabbit-photo permit law real?"
    answer: "It's unverified. The claim points back to an old 1921 wildlife-photography restriction, but no current statute text or repeal record confirms the exact permit-and-warden version that circulates online."
  - question: "What is the weirdest real law still on the books in Wyoming?"
    answer: "The near-miss horseback DUI wording is the strangest. Almost nobody realized the state's vehicle definition could reach a rider on a horse until a 2026 bill spelled out the exception. Lawmakers fixed it in a single, narrowly written act."
