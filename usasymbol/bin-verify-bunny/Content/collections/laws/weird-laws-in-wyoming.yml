sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Wyoming That Are Real"
    paragraphs:
      - "Wyoming's part-time lawmakers rarely revisit old statutes, so a surprising number of Unusual Laws in Wyoming are still fully enforceable today."
    highlights:
      - name: "Wyoming's DUI Law Almost Applied to Horses"
        status: "Verified"
        image: "/images/collections/laws/wyoming-horse-dui.jpg"
        description: |
          **Law:** Wyoming's drunk driving statute defines "vehicle" broadly enough that, until a 2026 bill fixed the wording, it did not clearly exclude a horse being ridden.

          **Meaning:** A rider who had too much to drink in the saddle could technically have faced the same charge as someone drunk behind the wheel of a car.

          **Reason:** Lawmakers called the loophole absurd and introduced the Saddles, Not Steering Wheels Act in 2026 specifically to write horses out of the vehicle definition.
      - name: "Wyoming's Impaired-Skiing Ban"
        status: "Verified"
        image: "/images/collections/laws/wyoming-ski-safety.jpg"
        description: |
          **Law:** Wyoming makes it illegal to ride uphill on a ski lift or use any slope or trail while impaired by alcohol or drugs.

          **Meaning:** A skier who has had too much at the lodge can be cited the same way a drunk driver would be, without ever touching a car.

          **Reason:** The rule mirrors ski-safety statutes passed across mountain states once lift accidents and slope injuries made alcohol on the mountain a real safety problem.
      - name: "No Chasing Wildlife With a Truck or Snowmobile"
        status: "Verified"
        image: "/images/collections/laws/wyoming-wildlife-vehicle.jpg"
        description: |
          **Law:** Wyoming bans using a car, snowmobile, or aircraft to harass, chase, or kill wildlife.

          **Meaning:** Running an elk or antelope to exhaustion with a vehicle instead of hunting it by legal means is a criminal offense, not just bad sportsmanship.

          **Reason:** Wyoming's open terrain and heavy snowmobile use made it easy to run animals down, so lawmakers drew a hard line separating hunting from harassment.
      - name: "Laramie's No-Spitting Ordinance"
        status: "Verified"
        image: "/images/collections/laws/wyoming-laramie-spitting.jpg"
        description: |
          **Law:** Laramie's city code bans spitting on a public sidewalk or on the floor of a theater, hall, or other public building.

          **Meaning:** The rule targets literal spitting in shared public spaces, not swearing or any other kind of public conduct.

          **Reason:** Ordinances like this trace back to early 1900s public-health campaigns against tuberculosis, when cities tried to curb spitting as a way germs spread indoors.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Wyoming We Couldn't Verify"
    paragraphs:
      - "Rabbit permits and horse tattoos are the kind of Strange Wyoming Laws claims that circulate for years without a single matching statute."
    subsections:
      - subtitle: "You need a permit to photograph a rabbit in Wyoming between January and April"
        status: "Not Verified"
        text: |
          **Claim:** Wyoming requires a permit, plus a game warden present, to photograph rabbits or other wildlife between January and April.

          **Why We Couldn't Verify It:** The claim traces to an old 1921 wildlife-photography restriction repeated on nearly every weird-law list, but no current statute text or archived repeal record confirms it was ever written exactly this way.
      - subtitle: "Tattooing a horse is illegal in Wyoming"
        status: "Not Verified"
        text: |
          **Claim:** Wyoming law makes it illegal to tattoo a horse.

          **Why We Couldn't Verify It:** No statute, brand-inspection rule, or animal-welfare code addressing horse tattoos turns up anywhere in Wyoming law. The claim has no date, no case, and no agency attached to it.
      - subtitle: "Wearing a hat that blocks the view in a Wyoming movie theater is illegal"
        status: "Not Verified"
        text: |
          **Claim:** A hat tall enough to block another moviegoer's view is against the law in Wyoming theaters.

          **Why We Couldn't Verify It:** Not one city or state code section addressing hats in theaters has surfaced. The claim reads like an old house rule that got mistaken for law somewhere along the way.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Wyoming Laws That Are Myths"
    paragraphs:
      - "A donkey in a bathtub and a fishing giraffe are exactly the kind of Real Wyoming Laws You Won't Believe claims that never had a statute behind them."
    subsections:
      - subtitle: "A donkey cannot legally sleep in a bathtub in Wyoming"
        status: "Myth"
        text: |
          **Myth:** Wyoming law forbids a donkey from sleeping in a bathtub.

          **Reality:** The real version of this law was passed in Arizona in 1924, after a rancher's donkey fell asleep in an abandoned tub and nearly drowned in a flash flood. Wyoming's own ranching culture made it an easy, and wrong, guess for list writers reassigning the same story.
      - subtitle: "It's illegal to fish from the back of a giraffe in Wyoming"
        status: "Myth"
        text: |
          **Myth:** Wyoming bans fishing while riding a giraffe.

          **Reality:** No giraffe has ever appeared in Wyoming wildlife or livestock law for the obvious reason that giraffes are not native, ranched, or legal to ride in the state. The line is a stock joke recycled across dozens of state weird-law lists with the animal swapped out each time.
      - subtitle: "Fishing with a firearm is illegal in Wyoming"
        status: "Myth"
        text: |
          **Myth:** Wyoming has a specific law banning fishing with a gun.

          **Reality:** Wyoming Game and Fish regulations simply define legal methods for taking fish, and shooting them has never been one of the approved methods. That is an ordinary methods-of-take rule dressed up online as a standalone novelty law.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Wyoming's 40-Day Legislature Lets Odd Statutes Sit Untouched"
    paragraphs:
      - "Wyoming's citizen legislature meets for a general session of just 40 legislative days in odd-numbered years and a budget session of only 20 days in even-numbered years, capped at 60 total working days per two-year cycle by the state constitution. Lawmakers spend most of that limited floor time on budgets and current bills. Cleaning up a harmless statute rarely becomes anyone's priority unless a viral claim or an obvious loophole forces the issue, the way the horseback DUI wording did in 2026."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Wyoming Territory became the first government in American history to grant women full voting rights, in 1869, more than 50 years before the 19th Amendment."
      - "Every brand burned into a Wyoming cow, horse, or sheep must be individually registered with the state Livestock Board, a system that grew directly out of territorial-era cattle rustling."
      - "Wyoming is the least populated state in the country, so a single legislator in Cheyenne can represent more open land than some entire counties elsewhere."
      - "Wyoming collects no state income tax and leans on mineral severance taxes instead, leaving its citizen legislature even less reason to spend limited floor time on housekeeping bills."
      - "The Saddles, Not Steering Wheels Act was one of the shortest, most specific bills lawmakers considered during the entire 2026 budget session."

