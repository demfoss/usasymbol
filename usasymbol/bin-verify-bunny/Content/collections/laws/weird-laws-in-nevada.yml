faq:
  - question: "Are brothels legal in Nevada?"
    answer: "Yes, but only in counties that choose to license them and only where population stays under 700,000. Clark County, home to Las Vegas, permanently lost that option once its population passed the threshold, so no brothel has ever been legally licensed there."
  - question: "Does Nevada have a state lottery?"
    answer: "No. Nevada's constitution bans lotteries outright, making it one of just five states without one."
  - question: "Was there really an old Nevada law about camels on highways?"
    answer: "Yes. An 1875 statute made it a misdemeanor to let a camel or dromedary run loose on a public highway, with fines up to $100. It no longer appears in the current Nevada Revised Statutes."
  - question: "Is hula-hooping illegal on Fremont Street in Las Vegas?"
    answer: "Only with a hoop larger than four feet in diameter. The same 2010 city code also bans skateboards, unicycles, and roller skates inside the pedestrian mall."
  - question: "Is Reno's nuclear detonation law real?"
    answer: "No confirmed ordinance has ever been found matching this claim, despite it circulating with a specific $500 fine attached. It looks like a stretched version of the symbolic nuclear-free-zone declarations several Cold War-era cities passed during the 1980s."
  - question: "Is there a waiting period to get married in Nevada?"
    answer: "No. Nevada has never required a waiting period or blood test for marriage. That gap is part of why Las Vegas and Reno became famous wedding destinations once neighboring states added both requirements during the 1930s."
