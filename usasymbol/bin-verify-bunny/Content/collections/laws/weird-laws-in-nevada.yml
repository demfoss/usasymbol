sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Nevada That Are Real"
    paragraphs:
      - "A constitutional lottery ban dating back to statehood anchors the Unusual Laws in Nevada that check out against the real code, alongside a county-by-county brothel law and a Fremont Street ordinance most tourists never expect."
    highlights:
      - name: "Nevada's Constitution Bans a State Lottery"
        status: "Verified"
        image: "/images/collections/laws/nevada-lottery-ban.jpg"
        description: |
          **Law:** Nevada's constitution flatly bars the state from authorizing a lottery or selling lottery tickets, with only a narrow carve-out for charitable raffles.

          **Meaning:** Powerball and Mega Millions tickets are not sold anywhere in the state, even though Nevada allows more legal gambling than almost anywhere else in the country.

          **Reason:** Lawmakers wrote the ban into the state's earliest gambling statutes after joining the Union in 1864, treating lotteries as a scam-prone racket separate from licensed casino games. Casino operators have helped defeat roughly thirty attempts to overturn the ban since 1975.

      - name: "Legal Brothels Exist Only by County Choice"
        status: "Verified"
        image: "/images/collections/laws/nevada-brothel-law.jpg"
        description: |
          **Law:** State law lets county licensing boards decide whether to permit brothels, but any county with 700,000 or more residents is barred from licensing one at all.

          **Meaning:** Clark County, home to Las Vegas, crossed that population line long ago, so no brothel can ever be legally licensed there no matter what local officials might want.

          **Reason:** Storey County wrote the first version of this licensing approach in 1971, an ordinance built to keep the Mustang Ranch operating as a regulated business instead of shutting it down as a public nuisance. Nevada later folded that same county-option template into state law.

      - name: "Nevada Once Banned Camels From Public Highways"
        status: "Repealed"
        image: "/images/collections/laws/nevada-camel-law.jpg"
        description: |
          **Law:** An 1875 statute made it a misdemeanor to let a camel or dromedary run loose on a public highway, with fines between $25 and $100 and up to 100 days in jail.

          **Meaning:** Owners had to keep the animals restrained near roads much like the law already treated stray livestock, back when camels were a common enough sight on Nevada's routes to need their own rule.

          **Reason:** The U.S. Army had experimented with camels as desert pack animals starting in 1855, and freight outfits later used them on Nevada's mining routes, where they reportedly spooked horse teams badly enough to draw legislative attention. The rule no longer appears in the current Nevada Revised Statutes.

      - name: "Hula Hoops Over Four Feet Are Banned on Fremont Street"
        status: "Verified"
        image: "/images/collections/laws/nevada-hula-hoop-law.jpg"
        description: |
          **Law:** Las Vegas city code bans unicycles, skateboards, roller skates, and hula hoops larger than four feet in diameter inside the Fremont Street pedestrian mall.

          **Meaning:** Street performers can still hula hoop for tips, just not with an oversized hoop, and the same rule clears out wheeled toys that could collide with crowds packed under the Fremont Street canopy.

          **Reason:** The city council passed the rule in 2010 after complaints that oversized hoops and rolling equipment were blocking foot traffic through a mall built specifically for walking, not sports gear.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Nevada We Couldn't Verify"
    paragraphs:
      - "Not every Real Nevada Laws You Won't Believe claim holds up once you go looking for a citation. A Strip taxi rule and a drink-buying limit are two of the most repeated, and neither has a matching statute anywhere."
    subsections:
      - subtitle: "You can't hail a taxi directly on the Las Vegas Strip"
        status: "Not Verified"
        text: |
          **Claim:** Tourists on the Las Vegas Strip cannot flag down a taxi from the curb and must instead walk to a designated taxi stand.

          **Why We Couldn't Verify It:** Taxi stands are real and heavily used along the Strip, but no statute or ordinance banning curbside hailing has turned up. The habit may just reflect how casino properties route their cab lines, not an actual legal requirement.

      - subtitle: "Buying drinks for more than three people at once is illegal"
        status: "Not Verified"
        text: |
          **Claim:** One version of this claim holds that buying a round of drinks for more than three other people at once breaks Nevada law.

          **Why We Couldn't Verify It:** No statute setting a numeric limit on drink rounds has been located in state or Las Vegas code. The story resembles old Prohibition-era "treating" laws that limited buying rounds in a few other states, but nothing ties that history to Nevada specifically.

      - subtitle: "Posting a fake Beware of Dog sign is illegal"
        status: "Not Verified"
        text: |
          **Claim:** Homeowners without a dog cannot legally post a Beware of Dog sign on their property.

          **Why We Couldn't Verify It:** Neither state law nor the major city codes address dog warning signs one way or another. The story circulates online with no city or county ever named as its actual source.

      - subtitle: "Pawning your dentures is illegal in Las Vegas"
        status: "Not Verified"
        text: |
          **Claim:** Pawn shops in Las Vegas are barred by name from accepting dentures as collateral.

          **Why We Couldn't Verify It:** Nevada's real pawnbroker statute lists categories of people shops can't buy from, not categories of items, and dentures never appear in it. No separate denture-specific rule has surfaced anywhere in state or local code.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Nevada Laws That Are Myths"
    paragraphs:
      - "A camel joke tied to one small county is the most repeated Strange Nevada Laws myth, and a Cold War-era fine invented for Reno runs a close second."
    subsections:
      - subtitle: "Driving a camel through a motel lobby is illegal in Eureka"
        status: "Myth"
        text: |
          **Myth:** Eureka, Nevada has a specific ordinance against riding or driving a camel through a motel.

          **Reality:** No Eureka ordinance naming camels or motels has ever surfaced, and the claim reads like a local embellishment of the real, now-repealed 1875 statewide law that banned camels from public highways in general. Shrinking a real statewide rule down to one tiny county and one specific building is a common way these stories spread.

      - subtitle: "Detonating a nuclear weapon in Reno carries a $500 fine"
        status: "Myth"
        text: |
          **Myth:** An old Reno ordinance supposedly makes it illegal to detonate a nuclear weapon within city limits, punishable by a $500 fine.

          **Reality:** No citable Reno code section matching this claim has turned up anywhere official. Several Cold War-era cities did pass symbolic nuclear-free-zone declarations during the 1980s, and this claim likely grew out of that general trend rather than any specific Reno ordinance with a dollar figure attached.

      - subtitle: "Feather boas are banned in casinos on Election Day"
        status: "Myth"
        text: |
          **Myth:** Nevada casinos supposedly ban feather boas on Election Day to stop voters from using them as disguises.

          **Reality:** General election laws in many states already bar wearing masks or disguises near a polling place, a rule aimed at voter intimidation rather than feathers. The costume detail looks like a colorful add-on to that ordinary rule, not anything unique to Nevada.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Nevada's 120-Day Legislature Can't Keep Up With 17 Counties' Codes"
    paragraphs:
      - "Nevada's constitution has capped regular legislative sessions at 120 calendar days every two years since voters approved the limit in 1998, and only a handful of sessions since then have actually finished on schedule. Lawmakers get little room to revisit narrow, decades-old statutes like the camel law when housing, water, and gaming bills already crowd a short calendar. Local governments fill the gap on their own terms, too. Storey County wrote its own brothel-licensing ordinance decades before state law caught up, and Las Vegas still handles rules as specific as hula hoop diameter through its own municipal code, with no statewide office auditing what each of Nevada's 17 counties and incorporated cities decides to keep on the books."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Nevada currently has licensed brothels operating in seven counties, including Elko, Lyon, Nye, Storey, Lander, Mineral, and White Pine, while several other counties under the population cap ban them anyway by local choice."
      - "Nevada's fast divorce law turned 1930s Reno into a 'divorce ranch' destination, where out-of-state spouses waited out their required weeks of residency at working guest ranches."
      - "Nevada is one of only five states with no state lottery, joined only by Alabama, Alaska, Hawaii, and Utah."
      - "The repealed 1875 camel law named both Bactrian and dromedary camels specifically, since both types were still working Nevada's mining freight routes at the time."
      - "Nevada never added a marriage waiting period or blood test. That gap looked unremarkable for decades until California added a three-day wait and Connecticut required blood tests in the 1930s, sending couples straight to Nevada instead."

