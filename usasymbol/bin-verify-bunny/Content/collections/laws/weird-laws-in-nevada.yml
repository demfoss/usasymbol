page:
  h1: "Weird Nevada Laws Still on the Books"
  quick_answer:
    - "Four Nevada claims check out: the constitutional lottery ban, the county-option brothel law, a repealed 1875 camel highway law, and Fremont Street's hula hoop rule."
    - "Brothels are legal only where a county chooses to license them, and Clark County's population automatically blocks Las Vegas from ever having one."
    - "Claims about hailing taxis, drink-buying limits, and a Reno nuclear-bomb fine are either unverified rumors or recycled internet myths."
  sources:
