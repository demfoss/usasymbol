page:
  h1: "Real Mississippi Laws You Won't Believe"
  quick_answer:
    - "Four Mississippi claims check out: a felony ban on publishing someone's poem without consent, a pecan-picking ban, a public profanity law, and a dueling statute."
    - "Publishing a poem without the author's permission is graded as a felony in Mississippi, a far harsher penalty than most people expect for a copyright-style dispute."
    - "The gorilla-in-the-backseat claim and the Sunday corn flakes ban are recycled internet jokes with no matching statute anywhere in the code."
