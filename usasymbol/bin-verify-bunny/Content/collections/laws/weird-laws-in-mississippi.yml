sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Mississippi That Are Real"
    paragraphs:
      - "Publishing somebody else's poem without permission carries a felony charge in Mississippi, one of several Unusual Laws in Mississippi that hold up under an actual code check."
    highlights:
      - name: "Publishing Someone's Poem Without Consent Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/mississippi-poem-publishing.jpg"
        description: |
          **Law:** Mississippi makes it a felony to publish a literary composition, such as a poem, without the author's consent.

          **Meaning:** Copying and printing someone else's written work without permission is treated far more seriously here than an ordinary copyright dispute would be.

          **Reason:** The statute sits inside the state's chapter on crimes against public morals and decency, reflecting an older legal approach that treated unauthorized publication as a personal-integrity violation, not just a property issue.

      - name: "You Can't Pick Up Fallen Pecans on the Roadside"
        status: "Verified"
        image: "/images/collections/laws/mississippi-pecan-law.jpg"
        description: |
          **Law:** During harvesting season, pecans that fall from a tree onto a public road or right-of-way still belong to the tree's owner, and removing them without permission is a misdemeanor.

          **Meaning:** Stopping to grab "free" pecans off the shoulder of a rural road can be theft if the harvesting season is still active and the trees belong to someone.

          **Reason:** Mississippi has a real commercial pecan industry, and the law closes an obvious loophole where roadside pecans would otherwise be treated as unclaimed property.

      - name: "Public Profanity Can Mean a $100 Fine"
        status: "Verified"
        image: "/images/collections/laws/mississippi-profanity-law.jpg"
        description: |
          **Law:** Swearing, cursing, or using vulgar language in a public place in front of two or more people is punishable by up to $100 or 30 days in jail.

          **Meaning:** The law requires an audience of at least two other people. Cursing alone in your car doesn't trigger it.

          **Reason:** It's an old public-order statute from an era when regulating speech in shared public spaces was treated as a routine part of criminal law.

      - name: "Dueling Is Still a Crime"
        status: "Verified"
        image: "/images/collections/laws/mississippi-dueling-law.jpg"
        description: |
          **Law:** Giving, accepting, or carrying a dueling challenge, or helping arrange or attend a duel, remains a criminal offense under state law.

          **Meaning:** The statute covers the entire chain around a duel, not just the fight itself, including anyone who helps set one up.

          **Reason:** Mississippi's constitution once disqualified duelists from holding office entirely, a rule finally repealed by voters in 1978. The underlying criminal statute against dueling itself was simply never taken off the books.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Mississippi We Couldn't Verify"
    paragraphs:
      - "Several Weird Mississippi Laws Still on the Books claims about specific small towns keep circulating with no ordinance number ever attached."
    subsections:
      - subtitle: "You can't drive in a housecoat on certain Oxford streets"
        status: "Not Verified"
        text: |
          **Claim:** Oxford bans driving on a specific street while wearing a housecoat.

          **Why We Couldn't Verify It:** No Oxford municipal code section matching this claim has been located. It appears only on generic listicle round-ups with no ordinance number or street name attached.

      - subtitle: "Tylertown requires 'Miss' or 'Mister' before 'sir' or 'madam'"
        status: "Not Verified"
        text: |
          **Claim:** A Tylertown ordinance requires adding "Miss" or "Mister" whenever addressing someone as sir or madam.

          **Why We Couldn't Verify It:** No matching Tylertown ordinance has turned up in a search of the town's municipal code. The claim circulates only on multi-state listicle sites.

      - subtitle: "You can't gamble within 20 feet of a public restroom"
        status: "Not Verified"
        text: |
          **Claim:** Mississippi bans wagering within 20 feet of a public toilet.

          **Why We Couldn't Verify It:** No statute using this specific distance and location has been located. Mississippi's real gaming statutes regulate licensed venues broadly, with nothing tying a bet's legality to restroom proximity.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Mississippi Laws That Are Myths"
    paragraphs:
      - "A couple of Strange Mississippi Laws claims are recycled jokes that show up on weird-law lists for half a dozen other states too."
    subsections:
      - subtitle: "It's illegal to carry a gorilla in the backseat of a car"
        status: "Myth"
        text: |
          **Myth:** Mississippi law bans carrying a gorilla in a car's backseat.

          **Reality:** No statute anywhere in the code mentions gorillas. This is a classic stock joke entry, the kind of specific-sounding claim that spreads because it's funny, not because it's true.

      - subtitle: "You can't sell corn flakes on Sundays"
        status: "Myth"
        text: |
          **Myth:** Selling corn flakes on a Sunday is illegal in Mississippi.

          **Reality:** No cereal-specific Sunday sales law has ever existed. This is likely a distortion of general Sunday blue-law history involving alcohol and certain retail categories, stretched into a joke about breakfast cereal.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why a 90-Day Session Cap Leaves Mississippi's Old Statutes Alone"
    paragraphs:
      - "Mississippi's Constitution caps most regular legislative sessions at 90 calendar days, stretching to 125 days only once every four years. With that tight window mostly consumed by budget work and current priorities, a narrowly written statute like the pecan-picking law rarely becomes a legislative priority, even decades after most people forgot it existed."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Mississippi's dueling statute survived even after the state constitution's own dueling disqualification clause was repealed by voters in 1978."
      - "The pecan-harvesting season that triggers the roadside pecan law is separately defined by statute and runs through January 31 each year."
      - "The public profanity law requires an audience of at least two other people to apply, not just a single listener."
      - "Mississippi is one of the country's leading pecan-producing states, which is the practical reason the crop got its own dedicated statute."
      - "A regular Mississippi legislative session can stretch to 125 days once every four years, coinciding with the first session after a statewide election."

