faq:
  - question: "Is it really a felony to publish someone's poem in Mississippi?"
    answer: "Yes. State law makes publishing a literary composition without the author's consent a felony, a harsher classification than most people expect for this kind of dispute."
  - question: "Can you pick up pecans that fall on the road in Mississippi?"
    answer: "Not during harvesting season, if you don't have the tree owner's permission. Fallen pecans on a public right-of-way still legally belong to the owner of the tree until the season ends."
  - question: "Is cursing in public illegal in Mississippi?"
    answer: "It can be. Swearing or using vulgar language in front of two or more people in a public place is punishable by up to $100 or 30 days in jail."
  - question: "Is dueling actually illegal in Mississippi?"
    answer: "Yes. Giving, accepting, or carrying a dueling challenge, or helping arrange or attend one, is still a criminal offense under state law."
  - question: "Is the gorilla-in-a-car law real?"
    answer: "No. No statute anywhere in Mississippi's code mentions gorillas. It's a recycled internet joke, not a real law."
  - question: "What is the weirdest real law still on the books in Mississippi?"
    answer: "The poem-publishing felony surprises people most, since most states treat unauthorized publication as a civil copyright issue rather than a criminal one."
