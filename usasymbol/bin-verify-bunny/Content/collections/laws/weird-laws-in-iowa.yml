page:
  h1: "Weird Laws in Iowa"
  quick_answer:
    - "Four Iowa laws check out: the drug tax stamp statute, the oleomargarine labeling rule, the disability parking permit law, and a 1937 Marshalltown ordinance."
    - "The drug tax stamp law is not a legal loophole. It stacks a felony tax charge on top of any drug charge a dealer already faces."
    - "Claims about a five-minute kiss limit and an Ottumwa no-winking rule have no confirmed statute behind them anywhere in Iowa."
