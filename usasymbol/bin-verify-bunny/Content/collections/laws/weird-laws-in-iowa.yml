sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Iowa That Are Real"
    paragraphs:
      - "A felony drug tax and a 90-year-old hydrant rule both survive a records check, which is more than most states can say for their favorite legends. Unusual Laws in Iowa turn out to be narrower and older than the online version suggests, but each one is genuinely on the books."
    highlights:
      - name: "Iowa's Drug Tax Stamp Law"
        status: "Verified"
        image: "/images/collections/laws/iowa-drug-tax-stamp.jpg"
        description: |
          **Law:** Iowa requires anyone dealing in illegal drugs to buy a tax stamp from the state and attach it to the product before selling it.

          **Meaning:** Getting caught with marijuana or another controlled substance above a set weight, without the matching stamp, adds a separate Class D felony charge on top of whatever drug charge is already filed.

          **Reason:** Iowa modeled the law on tax-evasion tactics used against organized crime figures, giving prosecutors a second charge to pursue even when a straightforward drug case runs into trouble in court.

      - name: "Selling Margarine as Butter Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/iowa-oleomargarine-law.jpg"
        description: |
          **Law:** Iowa bars anyone from selling imitation butter under any name other than oleomargarine.

          **Meaning:** A seller cannot use the words "butter," "creamery," or "dairy" anywhere on the package or in an ad for a margarine product, even when the ingredients are listed correctly elsewhere.

          **Reason:** Dairy farmers pushed statehouses across the Midwest for laws like this one in the mid-1900s, worried that cheaper margarine dressed up to look like butter would cut into their sales.

      - name: "Returning a Disability Parking Permit After Death"
        status: "Verified"
        image: "/images/collections/laws/iowa-disability-parking-permit.jpg"
        description: |
          **Law:** Iowa requires a disability parking permit to be turned in within 10 days if the permit holder dies or moves out of state.

          **Meaning:** Family members cannot legally keep using a relative's placard for convenient parking after the person who qualified for it is gone.

          **Reason:** Lawmakers closed the gap after placards kept circulating among relatives and friends long after the original holder no longer needed one, turning a mobility accommodation into a parking shortcut.

      - name: "Marshalltown's Ban on Animals Damaging Fire Hydrants"
        status: "Verified"
        image: "/images/collections/laws/iowa-marshalltown-fire-hydrant.jpg"
        description: |
          **Law:** A Marshalltown ordinance dating to 1937 bars tying up or placing an animal where it can bite, chew, or otherwise damage a fire hydrant or a telegraph, telephone, or electric pole.

          **Meaning:** An owner whose horse or livestock is left gnawing on city equipment can be cited under the ordinance itself, not just asked to move the animal along.

          **Reason:** Marshalltown passed the rule after animals tied up downtown kept damaging newly installed city property, forcing repair crews out again and again for equipment the city had just paid to fix.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Iowa We Couldn't Verify"
    paragraphs:
      - "Small-town color runs through most of the Weird Laws in Iowa that never turn up in an actual code search. A winking ban, a piano rule, and a permit for traveling ministers all sound plausible, but none of them has a matching ordinance anywhere."
    subsections:
      - subtitle: "Indianola Banned Ice Cream Trucks After a 1967 Accident"
        status: "Not Verified"
        text: |
          **Claim:** Indianola outlawed ice cream trucks and roving vendors in 1967 after a child was struck and killed while buying a treat from one.

          **Why We Couldn't Verify It:** Numerous lifestyle sites repeat the same account, but none cites an ordinance number, and a search of the city's current published code does not surface a vending section matching this description. The story may describe a real local response to a real tragedy. The ordinance text itself has never turned up.

      - subtitle: "One-Armed Piano Players Cannot Charge to Perform"
        status: "Not Verified"
        text: |
          **Claim:** A person who can only play piano with one arm is barred from charging money for the performance.

          **Why We Couldn't Verify It:** No matching section has surfaced in the Iowa Code, and researchers who have gone looking, including a university library that catalogs Iowa's oddest laws, come up empty every time. The claim has no town, date, or bill number attached, which usually signals a story that outgrew any real source.

      - subtitle: "Ottumwa Men Can't Wink at Women They Don't Know"
        status: "Not Verified"
        text: |
          **Claim:** Men in Ottumwa are forbidden from winking at a woman they have not been introduced to.

          **Why We Couldn't Verify It:** Nothing resembling this rule appears in any searchable Ottumwa city code, and no newspaper archive or court record has ever referenced a winking citation. It reads like a stock small-town flirting joke rather than a documented ordinance.

      - subtitle: "Ministers Need a Permit to Carry Alcohol Across State Lines"
        status: "Not Verified"
        text: |
          **Claim:** Iowa requires ordained ministers to obtain a special permit before transporting alcohol across the state line.

          **Why We Couldn't Verify It:** Iowa does regulate who can transport alcohol commercially, but nothing in that framework singles out clergy for a separate permit. No bill number, year, or enforcement case has ever been attached to this version of the story.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Iowa Laws That Are Myths"
    paragraphs:
      - "Two of the most repeated Strange Iowa Laws share the same origin story: an unsourced list of joke statutes that got pinned on states at random decades ago. Both involve kissing, and neither has ever had a real citation attached."
    subsections:
      - subtitle: "A Kiss Can't Legally Last Longer Than Five Minutes"
        status: "Myth"
        text: |
          **Myth:** Iowa law caps a kiss at five minutes.

          **Reality:** This claim belongs to a genre of "dumb laws" trivia that got assigned to states without anyone checking an actual code. Near-identical kissing-time claims turn up pinned to other states in the same unsourced lists. No Iowa statute or city ordinance has ever set a legal time limit on a kiss.

      - subtitle: "A Man With a Mustache Can't Kiss a Woman in Public"
        status: "Myth"
        text: |
          **Myth:** A mustached man is barred from kissing a woman in public in Iowa.

          **Reality:** The same mustache-kissing joke shows up attached to several other states' weird-law lists with nearly identical wording, a sign it spread as a recycled punchline rather than a real ordinance. Nobody has produced an Iowa statute, county code, or city ordinance that matches it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Iowa's Home Rule Cities Keep Their Own Odd Ordinances"
    paragraphs:
      - "Marshalltown's fire hydrant ordinance and Indianola's ice cream truck rule both trace back to individual city councils, not the Iowa Legislature. Iowa granted its cities home rule through a 1968 constitutional amendment, letting any of the state's roughly 940 incorporated cities write, amend, or leave alone its own municipal code without asking Des Moines for permission."
      - "Statewide cleanup happens only when the Iowa Code itself gets outdated, and the General Assembly already convenes every year, unlike states that meet only every other year. Local councils rarely schedule a repeal vote for an old, harmless ordinance when nobody is complaining about it, so a decades-old rule about hydrants or vending can sit on a single city's books indefinitely."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Iowa's drug tax stamp charge carries a six-year statute of limitations, twice as long as other Class D felonies in the state, giving prosecutors extra time to file it after a straight drug charge would already be barred."
      - "Marshalltown's 1937 ordinance protected telegraph, telephone, and electric poles alongside fire hydrants, a detail that only makes sense once you remember that many poles and hydrant housings of that era were built from wood."
      - "Misusing someone else's disability parking permit in Iowa carries a flat $200 fine as a scheduled simple misdemeanor, regardless of how minor the actual parking violation looks."
      - "Both the margarine law and the disability parking permit rule sit in the lowest of Iowa's three misdemeanor tiers, simple misdemeanors, ranked below serious and aggravated misdemeanors in the same criminal code."
      - "The Iowa Legislature republishes the full Iowa Code every two years, yet decades-old chapters like the drug tax stamp law keep their original numbering and structure intact."

