faq:
  - question: "Is Iowa's drug tax stamp law actually enforced?"
    answer: "Yes. Prosecutors in Iowa still file drug tax stamp charges alongside standard drug offenses, especially when a dealer is caught with a quantity over the state's weight threshold. It functions as a separate felony charge, independent of the underlying drug case."

  - question: "Is it illegal to sell margarine as butter in Iowa?"
    answer: "Yes. Iowa law requires imitation butter to be sold and labeled as oleomargarine, and bars using words like 'butter' or 'creamery' anywhere on the packaging or in an advertisement."

  - question: "What happens if I keep using a deceased relative's disability parking permit in Iowa?"
    answer: "Iowa requires the permit to be returned within 10 days of the holder's death. Continuing to use it afterward is a simple misdemeanor, and misuse carries a $200 fine even if the parking spot itself was legitimately open."

  - question: "Is the Indianola ice cream truck ban real?"
    answer: "The story is widely repeated, but no ordinance number or current city code section confirming it has surfaced. It falls into the unverified category rather than a confirmed statute."

  - question: "Is there really a law limiting kisses to five minutes in Iowa?"
    answer: "No. This is one of several recycled 'dumb laws' claims that gets attached to different states with no real statute behind any of the versions."

  - question: "What is the weirdest real law still on the books in Iowa?"
    answer: "The drug tax stamp requirement surprises most people, since it means Iowa technically expects illegal dealers to pay tax on their product. Getting caught without the stamp adds a separate felony on top of any drug charge already filed."
