page:
  h1: "Weird Illinois Laws Still on the Books"
  quick_answer:
    - "Four Illinois weird-law claims check out: a Joliet mispronunciation ordinance, a first-cousin marriage rule, a strict eavesdropping law, and a Mendota bicycle ordinance."
    - "The eavesdropping law is the most serious of the four. Recording your own conversation without the other person's consent can be a felony in Illinois."
    - "Eating inside a burning building in Chicago is a myth. No statute or ordinance has ever matched that specific claim."
