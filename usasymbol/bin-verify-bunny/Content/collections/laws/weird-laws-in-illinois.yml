sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Illinois That Are Real"
    paragraphs:
      - "A city ordinance about pronouncing its own name and a statewide rule about marrying a cousin anchor the Unusual Laws in Illinois that check out against the actual code. All four remain active today."
    highlights:
      - name: "Joliet's Official Pronunciation Ordinance"
        status: "Verified"
        image: "/images/collections/laws/illinois-joliet-pronunciation-law.jpg"
        description: |
          **Law:** Joliet's city code names one official pronunciation of its own name, accenting the first syllable, and sets a $5 fine for saying it wrong.

          **Meaning:** Say the city's name the more common outside way, and you're technically breaking a real ordinance, even if nobody has enforced it in decades.

          **Reason:** City founders reportedly grew tired of visitors, especially from nearby Chicago, mispronouncing the name and wrote the rule to settle the argument permanently.

      - name: "First Cousins Can Only Marry Under Specific Conditions"
        status: "Verified"
        image: "/images/collections/laws/illinois-cousin-marriage-law.jpg"
        description: |
          **Law:** Illinois bans marriage between first cousins unless both parties are over 50, or at least one presents a doctor's certificate confirming permanent sterility.

          **Meaning:** A first-cousin couple under 50 who can still have children cannot legally marry in Illinois, but the same couple can if they wait or provide medical proof.

          **Reason:** The age and sterility conditions target the genetic risk tied to close-relative reproduction, while still allowing the marriage once that specific risk no longer applies.

      - name: "Recording Your Own Conversation Can Be a Felony"
        status: "Verified"
        image: "/images/collections/laws/illinois-eavesdropping-law.jpg"
        description: |
          **Law:** Illinois requires the consent of everyone involved before recording a conversation that any party reasonably expected to be private, even if you're one of the people talking.

          **Meaning:** Secretly recording your own phone call or conversation can bring a felony charge carrying one to three years in prison.

          **Reason:** The state rewrote the law in 2014 after its broader version was struck down as unconstitutional, narrowing it to protect only conversations with a genuine expectation of privacy instead of every recorded conversation.

      - name: "No Acrobatic Bicycle Riding in Mendota"
        status: "Verified"
        image: "/images/collections/laws/illinois-mendota-bicycle-law.jpg"
        description: |
          **Law:** Mendota's city code bans riding a bicycle with both hands off the handlebars, both feet off the pedals, or performing acrobatic or fancy riding on any street.

          **Meaning:** Coasting hands-free or popping a trick on a bike within city limits technically violates the ordinance.

          **Reason:** The rule reads like a standard small-town traffic-safety measure meant to keep cyclists in control of their bikes around other street traffic, not a ban on any particular trick.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Illinois We Couldn't Verify"
    paragraphs:
      - "Not all Real Illinois Laws You Won't Believe leave behind an actual statute. An oddly specific way of addressing unmarried men and a dollar-amount vagrancy rule in Chicago are two of the strangest, and neither has a citation attached anywhere."
    subsections:
      - subtitle: "Unmarried men must be addressed as 'master' in Illinois"
        status: "Not Verified"
        text: |
          **Claim:** Illinois law requires women to address any unmarried man, regardless of age, as "master" instead of "mister."

          **Why We Couldn't Verify It:** No statute matching this description has ever been located in Illinois's compiled statutes, and no source offers a date, a bill number, or a clear explanation for where the claim originated.

      - subtitle: "Carrying less than a dollar can get you arrested for vagrancy in Chicago"
        status: "Not Verified"
        text: |
          **Claim:** Chicago police can arrest someone for vagrancy simply for carrying less than one dollar in cash.

          **Why We Couldn't Verify It:** No Chicago ordinance or Illinois statute ties an arrest to that specific dollar amount. Vagrancy-style laws have existed historically in many cities, but nothing pins this exact claim to a real, citable Chicago rule.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Illinois Laws That Are Myths"
    paragraphs:
      - "Eating inside a burning building is the most repeated Strange Illinois Laws myth of all, and a supposed ban on making faces at a dog turns out to be a joke recycled from other states' lists."
    subsections:
      - subtitle: "It's illegal to eat inside a building that's on fire in Chicago"
        status: "Myth"
        text: |
          **Myth:** Chicago has a specific ordinance making it illegal to eat inside a building that's actively on fire.

          **Reality:** No such ordinance exists anywhere in Chicago's municipal code. Legal researchers who have gone looking for the source have come up empty, and the claim appears to be a pure internet fabrication with no factual basis at all.

      - subtitle: "Illinois bans making funny faces at a dog"
        status: "Myth"
        text: |
          **Myth:** The Illinois Animal Control Act makes it illegal to make funny faces at a dog or hand a lit cigar to a cat.

          **Reality:** No actual bill text matching either claim has ever been produced from the real Animal Control Act. The exact same "making faces at a dog" joke shows up recycled across weird-law lists for several other states with identical wording, which is a strong sign it was never tied to Illinois specifically.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Illinois's Home Rule Cities Keep Their Own Odd Ordinances"
    paragraphs:
      - "Illinois's 1970 constitution gave home rule power to any city with more than 25,000 residents, plus any smaller city that votes to adopt it, letting each one pass its own ordinances without asking permission from Springfield. That's exactly how Joliet ended up with its own pronunciation rule and Mendota got its own bicycle ordinance: hundreds of home rule cities each keep a separate code, and no statewide office is in charge of reviewing or repealing what any single one of them decided decades ago."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Illinois's cousin-marriage exception requires either both spouses to be over 50 or documented proof of permanent sterility, one of the more specific such rules among the states that restrict cousin marriage at all."
      - "The 2014 rewrite of Illinois's eavesdropping law came after the state Supreme Court struck down the earlier version for criminalizing recordings even when nobody involved expected privacy."
      - "Joliet's pronunciation ordinance sets its fine at exactly $5, a number that hasn't been adjusted since the rule was written."
      - "Illinois's Litter Control Act specifically names grass clippings as an example of litter when dumped improperly, alongside more expected items like cigarette butts and packaging."
      - "More than 200 Illinois municipalities currently operate under home rule authority, each maintaining a separate local code from the others."

