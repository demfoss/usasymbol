faq:
  - question: "Is the Joliet pronunciation law actually real?"
    answer: "Yes. The city's code names one official pronunciation and sets a $5 fine for getting it wrong."
  - question: "Can first cousins get married in Illinois?"
    answer: "Only under specific conditions. Illinois requires both parties to be over 50, or at least one to provide a doctor's certificate confirming permanent sterility, before allowing a first-cousin marriage."
  - question: "Is it illegal to record your own phone call in Illinois?"
    answer: "Sometimes, yes. Illinois requires consent from everyone in a conversation that any party reasonably expected to be private, even from the person doing the recording. Violating it can be charged as a felony."
  - question: "Is it illegal to eat in a burning building in Chicago?"
    answer: "No. This is one of the most repeated fake laws about Illinois online, and no matching ordinance has ever been found in Chicago's municipal code."
  - question: "What is the weirdest real law still on the books in Illinois?"
    answer: "The first-cousin marriage rule surprises most people, mainly because of how specific its exception is."
  - question: "Is Illinois's animal-face law real?"
    answer: "No confirmed statute backs up the claim that making funny faces at a dog is illegal. It's a recycled joke that shows up attached to several other states with the same wording."
