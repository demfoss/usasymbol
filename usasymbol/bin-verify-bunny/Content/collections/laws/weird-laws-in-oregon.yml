faq:
  - question: "Can you pump your own gas in Oregon now?"
    answer: "Yes, statewide. Oregon banned self-serve gas from 1951 until Governor Tina Kotek signed a full repeal in August 2023, ending 72 years of the restriction."
  - question: "Is it illegal to release a sky lantern in Oregon?"
    answer: "Yes. Launching a sky lantern anywhere in the state is a Class A violation carrying up to a $2,000 fine, largely due to wildfire risk."
  - question: "What happens if you throw human waste from a car in Oregon?"
    answer: "It's a Class A misdemeanor to throw, place, or leave a container of human waste on or beside a highway from a vehicle, a more serious charge than ordinary littering."
  - question: "Do Oregon drivers have to stop for a frightened horse?"
    answer: "Yes. If a horse's rider or handler signals distress by raising a hand, approaching drivers are legally required to slow down, be cautious, or stop."
  - question: "Is fortune-telling illegal everywhere in Oregon?"
    answer: "No. The real fortune-telling restriction is a local ordinance in the town of Yamhill, not a statewide law."
  - question: "What is the weirdest real law still on the books in Oregon?"
    answer: "The sky lantern ban surprises people most, since it's a specific, currently enforced statewide rule with a real $2,000 penalty attached, not just a wildfire-season guideline."
