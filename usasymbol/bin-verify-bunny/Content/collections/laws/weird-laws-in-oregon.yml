    title: "Why Oregon's Self-Serve Gas Ban Took 72 Years to Repeal"
    paragraphs:
      - "Oregon's self-serve gas ban survived for over seven decades partly because repeal moved in small, incremental steps, first rural nighttime exceptions in 2015, then broader carve-outs in 2017 and 2020, before the Legislature finally passed full repeal in 2023. That gradual pattern is common in Oregon: rather than one clean vote, old statutes often get chipped away at over years before anyone tackles a full repeal."

