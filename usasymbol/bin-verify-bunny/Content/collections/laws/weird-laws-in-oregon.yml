      - subtitle: "Fortune-telling for money is banned statewide"
        status: "Myth"
        text: |
          **Myth:** Oregon has a statewide ban on charging money for fortune-telling.

          **Reality:** The real rule is a local Yamhill ordinance, not a state law. Confusing a single small-town rule for a statewide ban is a common way local ordinances get exaggerated into bigger claims than they actually are.

      - subtitle: "Hitching a ride on a moving car while skateboarding is a specific Oregon law"
        status: "Myth"
        text: |
          **Myth:** Oregon has a dedicated statewide law banning skateboarders from grabbing onto moving cars.

          **Reality:** This is a Portland city code provision about skateboarding rules, not a statewide statute. General reckless-endangerment law would also apply, making a standalone statewide "law" version of this claim inaccurate.

