    paragraphs:
      - "Oregon drivers only started legally pumping their own gas everywhere in 2023, one of several Unusual Laws in Oregon that hold up once you check the actual code and its history."
    highlights:
      - name: "Self-Serve Gas Was Banned for 72 Years"
        status: "Repealed"
        image: "/images/collections/laws/oregon-self-serve-gas.jpg"
        description: |
          **Law:** Oregon's original 1951 law required a station attendant to pump gas for every customer statewide.

          **Meaning:** The rule loosened in stages, first allowing self-service at night in rural areas in 2015, then expanding further in 2017 and 2020, before full repeal.

          **Reason:** Governor Tina Kotek signed House Bill 2426 in August 2023, ending the ban completely and leaving New Jersey as the only state with a full self-serve prohibition.

      - name: "You Can't Throw Human Waste From a Vehicle"
        status: "Verified"
        image: "/images/collections/laws/oregon-human-waste-law.jpg"
        description: |
          **Law:** Throwing, placing, or leaving a container of urine or other human waste on or beside a highway from a vehicle is a Class A misdemeanor.

          **Meaning:** It's a genuinely serious charge, not a minor littering ticket, reflecting the health hazard involved.

          **Reason:** Long-haul trucking created a real disposal problem along Oregon's highways, and lawmakers wrote a dedicated statute rather than relying on general litter law to cover it.

      - name: "Drivers Must Stop for a Frightened Horse's Distress Signal"
        status: "Verified"
        image: "/images/collections/laws/oregon-horse-distress-law.jpg"
        description: |
          **Law:** If a horse becomes frightened on a highway, the rider or handler can raise a hand to signal distress, and approaching drivers are legally required to slow down, be cautious, or stop.

          **Meaning:** The rule creates a real, specific duty for drivers, not just a courtesy suggestion.

          **Reason:** It's a rural-safety holdover from an era when horses were common on Oregon roads, still relevant today in the state's many horse-country areas.

      - name: "Sky Lanterns Are Banned Statewide"
        status: "Verified"
        image: "/images/collections/laws/oregon-sky-lantern-ban.jpg"
        description: |
          **Law:** Launching a sky lantern anywhere in Oregon is a Class A violation carrying up to a $2,000 fine.

          **Meaning:** The ban applies everywhere in the state, not just during fire season.

          **Reason:** Sky lanterns are unmanned open-flame devices that drift with the wind, and Oregon's wildfire risk made an outright statewide ban, effective 2017, the practical choice over a seasonal restriction.

