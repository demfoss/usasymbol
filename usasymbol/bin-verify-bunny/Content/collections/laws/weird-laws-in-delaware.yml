page:
  h1: "Weird Delaware Laws Still on the Books"
  quick_answer:
    - "Four Delaware weird-law claims check out: a margarine disclosure rule, a married-on-a-dare annulment ground, a pawnbroker prosthetic ban, and a ban on advertising for adoption."
    - "The margarine law isn't a full ban. Restaurants can still serve yellow margarine as long as a notice tells customers it isn't butter."
    - "A statewide car-changing-clothes law and a firm-fitting-pants ban are myths or unverified claims with no matching statute anywhere in Delaware code."
