sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Delaware That Are Real"
    paragraphs:
      - "A restaurant disclosure rule about margarine and a genuine annulment ground for marrying on a dare anchor the Unusual Laws in Delaware that check out against the actual code. All four still carry real penalties today."
    highlights:
      - name: "Restaurants Must Disclose Margarine"
        status: "Verified"
        image: "/images/collections/laws/delaware-margarine-law.jpg"
        description: |
          **Law:** Delaware requires any restaurant serving yellow oleomargarine to display a clear notice on the menu or on a placard saying so.

          **Meaning:** Margarine itself isn't banned. Serve it without the required notice, and a restaurant owner can face up to a year in prison under the statute.

          **Reason:** The rule traces back over a century to a period when dairy farmers pushed hard for laws protecting butter from a cheaper, yellow-dyed competitor, and Delaware never repealed the disclosure requirement.

      - name: "You Can Get Your Marriage Annulled for Marrying on a Dare"
        status: "Verified"
        image: "/images/collections/laws/delaware-married-on-a-dare.jpg"
        description: |
          **Law:** Delaware law lets a court grant an annulment when one or both spouses entered the marriage "as a jest or dare."

          **Meaning:** A courthouse marriage made on a bet or a joke can be undone through annulment instead of a full divorce.

          **Reason:** Annulment grounds generally target marriages that never had real consent behind them, and lawmakers apparently decided a dare belongs in the same category as fraud or duress.

      - name: "Pawnbrokers Can't Accept Prosthetic Limbs or Wheelchairs"
        status: "Verified"
        image: "/images/collections/laws/delaware-pawnbroker-prosthetic.jpg"
        description: |
          **Law:** Delaware bans pawnbrokers from taking an artificial limb or a wheelchair as a pledge or pawn.

          **Meaning:** A pawnshop that accepts one of these items as collateral is violating state law, regardless of how the deal was structured.

          **Reason:** The rule dates to 1907 and was written to stop desperate people from losing essential mobility equipment to a pawnshop, protecting a narrow but especially vulnerable group of borrowers.

      - name: "Advertising for Adoption Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/delaware-adoption-advertising.jpg"
        description: |
          **Law:** Delaware makes it illegal to advertise for the adoption of a child outside of a licensed agency process.

          **Meaning:** Placing a public ad offering a child for adoption, or seeking one directly through an ad, runs afoul of the statute regardless of good intentions.

          **Reason:** Routing every adoption through a licensed, regulated agency closes off the kind of informal, ad-driven arrangements that have historically opened the door to exploitation and black-market placement.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Delaware We Couldn't Verify"
    paragraphs:
      - "Not all Real Delaware Laws You Won't Believe hold up once you go looking for the actual ordinance. A Lewes clothing rule is the most repeated example, and it has never turned up in any current code."
    subsections:
      - subtitle: "Firm-fitting pants are illegal in Lewes"
        status: "Not Verified"
        text: |
          **Claim:** Lewes bans wearing firm-fitting pants around the waist.

          **Why We Couldn't Verify It:** The claim's earliest known appearance is a 1967 magazine mention, and no ordinance number, date, or council record has ever surfaced to back it up. It is absent from Lewes's current code of ordinances, and researchers who have searched historical archives specifically for it have come up empty.

      - subtitle: "A special license is required to sell perfume at a Delaware craft fair"
        status: "Not Verified"
        text: |
          **Claim:** Anyone selling perfume or cosmetics at a Delaware craft fair or farmers market needs a special state license.

          **Why We Couldn't Verify It:** General cosmetics-sales licensing exists in many states, but no Delaware statute or regulation specific to craft-fair perfume vendors has been located. The claim circulates without a section number, an agency name, or an enforcement example attached.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Delaware Laws That Are Myths"
    paragraphs:
      - "Search Strange Delaware Laws online and a supposed statewide ban on changing clothes in your car appears again and again, alongside a claim about pilots that has nothing to do with Delaware specifically."
    subsections:
      - subtitle: "Delaware law bans changing clothes inside your car"
        status: "Myth"
        text: |
          **Myth:** A general Delaware statute makes it illegal to change clothes inside a parked car.

          **Reality:** No such statewide law exists. The claim stretches two narrow local ordinances, one in Fenwick Island banning living or changing clothes inside a vehicle within town limits, and one in Rehoboth Beach restricting it in public comfort stations, into a rule that supposedly covers the whole state.

      - subtitle: "Pilots must carry food and water when flying over Delaware's water"
        status: "Myth"
        text: |
          **Myth:** Delaware requires pilots flying over water to carry enough food and drink for every passenger in case of a landing.

          **Reality:** No Delaware aviation statute contains this requirement. The identical claim, often word for word, shows up attached to more than a dozen other states' "weird law" lists, which is the clearest sign it's a recycled internet template rather than a real rule tied to any one place.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Delaware's Small Legislature Leaves Old Rules Alone"
    paragraphs:
      - "Delaware's General Assembly is one of the smallest state legislatures in the country, with just 62 members covering the entire state. A century-old margarine disclosure rule or a 1907 pawnbroker restriction rarely reaches the floor because a small body with a packed modern agenda has little incentive to spend time repealing a law that almost never gets enforced against anyone."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Delaware also bans horse racing on Good Friday and Easter Sunday, a 1973 law that actually loosened an older rule banning racing on every Sunday of the year."
      - "The pawnbroker statute originally also barred accepting workmen's tools as collateral. That part was dropped at some point, but the prosthetic-limb and wheelchair ban stayed on the books."
      - "Delaware's General Assembly has only 62 members combined between its House and Senate, one of the smallest total legislatures of any state."
      - "The margarine disclosure law has roots in an 1899 statute, meaning the current version has been amended and recodified across four different centuries of Delaware code."
      - "Rehoboth Beach separately bans disrupting a church service by talking or whispering within 300 feet of the building, a real ordinance distinct from the car-changing myth."

