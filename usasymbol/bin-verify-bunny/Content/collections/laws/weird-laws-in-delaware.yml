faq:
  - question: "Is it actually illegal to serve margarine in Delaware restaurants?"
    answer: "No, but disclosure is required. Restaurants must post a clear notice when serving yellow margarine."
  - question: "Can you really get an annulment for marrying on a dare in Delaware?"
    answer: "Yes. Delaware law lists marrying as a jest or dare as a specific ground for annulment, alongside fraud, duress, and lacking the legal capacity to consent."
  - question: "Why can't pawnbrokers accept wheelchairs in Delaware?"
    answer: "A 1907 law stops pawnshops from taking essential mobility equipment as collateral. Violators can be charged with a misdemeanor."
  - question: "Is the Delaware car-changing-clothes law real?"
    answer: "Not as a statewide law. Fenwick Island and Rehoboth Beach each have narrow local ordinances touching on it, but no general Delaware statute bans changing clothes in a parked car anywhere in the state."
  - question: "What is the weirdest real law still on the books in Delaware?"
    answer: "The ban on advertising for adoption surprises most people. It exists to keep adoptions moving through licensed agencies instead of informal ads, closing off a path that has historically enabled exploitation."
  - question: "Is the tight-pants law in Lewes real?"
    answer: "No verified source has ever been found. The claim traces to a 1967 magazine mention with no ordinance number attached, and it isn't in the town's current code."
