sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Maryland That Are Real"
    paragraphs:
      - "A ban on stink bombs is one of the strangest entries you'll find in any city's police code, and Baltimore still has one on the books. Real Maryland Laws You Won't Believe also include a bale-throwing ban and a $1,000 license for reading palms."
    highlights:
      - name: "Baltimore's Stench Bomb Ban"
        status: "Verified"
        image: "/images/collections/laws/maryland-stench-bomb-ban.jpg"
        description: |
          **Law:** Baltimore's police code bans manufacturing, selling, or setting off a "stench bomb," defined as any substance meant to produce a noxious or offensive odor when thrown, dropped, or discharged.

          **Meaning:** Setting off a stink bomb anywhere in the city can bring a misdemeanor charge and a fine between $5 and $500.

          **Reason:** The rule dates to an era when stink bombs were a common prank and low-grade act of vandalism in theaters, schools, and stores, serious enough that the city wrote it into permanent police ordinance rather than leaving it to general disorderly conduct rules.

      - name: "You Can't Throw Bales Out a Window in Baltimore"
        status: "Verified"
        image: "/images/collections/laws/maryland-bale-throwing-ban.jpg"
        description: |
          **Law:** Baltimore bans throwing any bale or bulky article from a second-story or higher door or window into the street.

          **Meaning:** Merchants also can't use unsecured chutes or slides to move goods from upper floors without properly fastening them first.

          **Reason:** The ordinance grew out of Baltimore's dense 19th-century warehouse district, where dockworkers regularly dropped heavy cargo straight into crowded streets below.

      - name: "Calvert County's $1,000 Fortune-Teller License"
        status: "Verified"
        image: "/images/collections/laws/maryland-fortune-teller-license.jpg"
        description: |
          **Law:** Anyone offering fortune-telling, palm reading, or similar services for money in Calvert County must get a license from the clerk of the circuit court and pay a $1,000 fee.

          **Meaning:** Applicants must be fingerprinted and photographed by state police and prove they have no criminal record beyond a traffic ticket. The license only lasts three months.

          **Reason:** Lawmakers built the license to work like a screening tool, high enough in cost and paperwork to discourage anyone not seriously running a legitimate business.

      - name: "Rockville Bans Cursing on the Street"
        status: "Verified"
        image: "/images/collections/laws/maryland-rockville-profanity-law.jpg"
        description: |
          **Law:** Rockville's code makes it a misdemeanor to curse or use obscene language on or near a public street, sidewalk, or highway within anyone's hearing.

          **Meaning:** A conviction can carry up to a $100 fine or 90 days in jail, and city police have confirmed the rule covers cursing while driving with your windows down.

          **Reason:** The ordinance sits among Rockville's general disorderly conduct rules meant to keep public streets civil, written decades before anyone imagined it would resurface as a viral warning about road rage.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Maryland We Couldn't Verify"
    paragraphs:
      - "A lion at the movies is the most repeated Weird Laws in Maryland claim with no paper trail behind it. Three more Maryland claims share the same problem: no ordinance number, no court record, no original source."
    subsections:
      - subtitle: "It's illegal to bring a lion to a movie theater in Baltimore"
        status: "Not Verified"
        text: |
          **Claim:** Baltimore has a specific law banning lions from movie theaters.

          **Why We Couldn't Verify It:** No provision matching this claim appears anywhere in the current Baltimore City Code. The story has circulated for years without a date, an ordinance number, or any record of why lions specifically would have been an issue at the movies.

      - subtitle: "Sleeveless shirts are banned in Baltimore's public parks"
        status: "Not Verified"
        text: |
          **Claim:** Wearing a sleeveless shirt in a Baltimore city park breaks the law, with a $10 fine attached.

          **Why We Couldn't Verify It:** Baltimore's park regulations cover things like alcohol, noise, and off-leash pets, but no clause about sleeveless shirts turns up in the current code. The specific $10 fine figure has no cited source anywhere it appears.

      - subtitle: "Growing Canada thistle is illegal in Garrett County"
        status: "Not Verified"
        text: |
          **Claim:** An 1882 Garrett County law still bans landowners from letting Canada thistle grow on their property.

          **Why We Couldn't Verify It:** Canada thistle really is treated as a noxious weed by Maryland's Department of Agriculture, which makes the claim plausible. But the specific 1882 Garrett County ordinance text isn't available in any current county code, so the exact rule can't be confirmed as still active.

      - subtitle: "Selling or coloring baby chicks under three weeks old is illegal statewide"
        status: "Not Verified"
        text: |
          **Claim:** Maryland law bans selling, bartering, or dyeing chickens, ducklings, or other fowl younger than three weeks old.

          **Why We Couldn't Verify It:** Several states do regulate the dyeing and sale of young poultry around Easter, so the claim fits a real pattern. A matching section in Maryland's current agriculture code could not be located to confirm the three-week detail or the penalty attached to it.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Maryland Laws That Are Myths"
    paragraphs:
      - "Borrowed history explains one of the most repeated Strange Maryland Laws myths, and a second one has no origin at all beyond internet listicles."
    subsections:
      - subtitle: "Men can't buy a female bartender a drink in Maryland"
        status: "Myth"
        text: |
          **Myth:** Maryland law bans men from buying a drink for a female bartender.

          **Reality:** No Maryland statute says anything like this. The claim looks like a scrambled echo of Michigan's real 1945 Bartender Act, which barred women from bartending in larger cities unless a father or husband owned the bar, a law the U.S. Supreme Court upheld in the 1948 case Goesaert v. Cleary. That case was about Michigan, not Maryland, and it addressed who could work as a bartender, not who could buy one a drink.

      - subtitle: "Kisses longer than one second are illegal in Halethorpe"
        status: "Myth"
        text: |
          **Myth:** A specific Maryland town bans kisses that last longer than one second.

          **Reality:** No ordinance, timestamp, or enforcement record backs this claim anywhere in Maryland municipal code. A version of the same "one-second kiss" law gets attached to random small towns across several states, which is the clearest sign it was never written down as an actual rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Baltimore's 19th-Century Police Code Still Runs the City"
    paragraphs:
      - "Baltimore's police ordinances still live under Article 19 of the city code, a numbering scheme the city kept through a 1966 recodification instead of starting over. An ordinance from the 1800s about bales or stink bombs sits in the same article as modern rules, and it only disappears if a new bill specifically repeals it. Meanwhile, the Maryland General Assembly meets for a constitutionally fixed 90 days each year, leaving state lawmakers little time to touch city-level ordinances that were never their responsibility in the first place."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Maryland's General Assembly session is capped at 90 days by the state constitution, one of the shortest fixed annual sessions of any state legislature."
      - "Baltimore City functions as its own independent jurisdiction, not part of any county, which is why so many of Maryland's strangest ordinances trace back to the city's own police code rather than state law."
      - "The Calvert County fortune-teller license requires a state police background check even though the underlying activity, reading palms for a fee, is not otherwise regulated anywhere else in Maryland."
      - "Maryland has more than 150 incorporated municipalities, each keeping a separate code book, which is how a Rockville-specific cursing ordinance ends up mislabeled as a statewide Maryland law online."
      - "The Baltimore stench bomb ordinance predates modern environmental and public nuisance statutes by decades, back when a stink bomb prank was handled as a standalone criminal offense."

