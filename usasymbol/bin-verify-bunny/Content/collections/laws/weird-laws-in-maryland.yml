page:
  h1: "Strange Maryland Laws Still on the Books"
  quick_answer:
    - "Four Maryland weird-law claims check out: a Baltimore stench bomb ban, a bale-throwing ordinance, a Calvert County fortune-teller license, and Rockville's public profanity rule."
    - "The fortune-teller license costs $1,000 and requires fingerprints and a police background check, not just a simple business permit."
    - "Claims about lions in movie theaters and sleeveless shirts in Baltimore parks have no confirmed statute or ordinance behind them."
