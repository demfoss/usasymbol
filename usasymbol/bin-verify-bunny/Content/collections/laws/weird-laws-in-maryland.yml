faq:
  - question: "Is it really illegal to set off a stink bomb in Baltimore?"
    answer: "Yes. Baltimore's police code bans manufacturing, trading, or setting off a stench bomb, with a fine between $5 and $500 for anyone convicted."
  - question: "How much does a fortune-teller license cost in Maryland?"
    answer: "In Calvert County, it costs $1,000, plus fingerprinting and a state police background check, and it's only valid for three months at a time. No other Maryland county has this specific requirement."
  - question: "Is cursing in public illegal in Maryland?"
    answer: "Statewide, no. Rockville is the exception, where cursing on or near a public street within someone's hearing is a misdemeanor punishable by up to $100 or 90 days in jail."
  - question: "Is it illegal to bring a lion to a movie theater in Maryland?"
    answer: "No confirmed ordinance backs this claim anywhere in Baltimore or Maryland state law. It's one of the most repeated weird-law stories with no ordinance number ever attached to it."
  - question: "What is the weirdest real law still on the books in Maryland?"
    answer: "Baltimore's stench bomb ban is the strangest, a standalone criminal statute against stink bombs that has stayed in the city's police code for generations."
  - question: "Can men in Maryland legally buy a female bartender a drink?"
    answer: "Yes, there's no law against it. The claim otherwise appears to confuse Maryland with Michigan's old Bartender Act, a 1945 law that restricted who could work as a bartender, not who could buy one a round."
