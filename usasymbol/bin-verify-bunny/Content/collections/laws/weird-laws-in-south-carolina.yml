sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in South Carolina That Are Real"
    paragraphs:
      - "A law written to fight the Ku Klux Klan is still active today, and it's one of several genuine Unusual Laws in South Carolina that survive in the current code."
    highlights:
      - name: "Public Mask-Wearing Is Restricted"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-mask-ban.jpg"
        description: |
          **Law:** Anyone over 16 is barred from wearing a mask or disguise on public property, or entering someone else's property masked without written permission.

          **Meaning:** Costume and safety exceptions exist for holidays, theater, masquerade balls, and protective equipment. It's the deliberate concealment of identity in public that the law targets.

          **Reason:** The statute passed in 1951 specifically to unmask Ku Klux Klan members, whose hoods let them commit intimidation and violence without being identified.

      - name: "Some Stores Can't Sell Certain Goods on Sundays"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-sunday-sales.jpg"
        description: |
          **Law:** South Carolina still restricts Sunday sales of goods like clothing, housewares, furniture, hardware, and jewelry.

          **Meaning:** Counties that collect over $900,000 a year in accommodations tax are automatically exempt, so the rule mostly applies outside tourist-heavy areas now.

          **Reason:** It's a surviving piece of the Sunday "blue law" tradition once common across many states, kept in place with a modern revenue-based carve-out instead of a full repeal.

      - name: "Gaming Tables Can't Run on the Sabbath"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-gaming-sabbath.jpg"
        description: |
          **Law:** Keeping or permitting a gaming table on a Sunday carries a $50 fine.

          **Meaning:** The rule sits inside a larger 19th-century gambling chapter that also bans games at taverns, barns, and open fields, all still stated in the same old dollar figures.

          **Reason:** It's a direct leftover of South Carolina's historic Sabbath-observance laws, never repealed even as most of its companion restrictions faded from enforcement.

      - name: "Fortunetelling for Pay Is Illegal Statewide"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-fortunetelling.jpg"
        description: |
          **Law:** Practicing fortunetelling, palmistry, or clairvoyance as a business is a misdemeanor under state law, not just a local rule.

          **Meaning:** Itinerant fortune-tellers who travel from place to place must get a county clerk's license first, or face a fine or short jail term.

          **Reason:** This is a statewide criminal statute, despite some online lists attaching it to a single town. It reflects a long American legal tradition of treating fortunetelling-for-profit as fraud-adjacent conduct.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in South Carolina We Couldn't Verify"
    paragraphs:
      - "Several Weird South Carolina Laws Still on the Books claims turn up again and again online with no ordinance number ever attached to any of them."
    subsections:
      - subtitle: "You need a permit to fire a missile or rocket"
        status: "Not Verified"
        text: |
          **Claim:** South Carolina requires a special permit to fire a missile or rocket.

          **Why We Couldn't Verify It:** No statute matches this specific wording. It's likely a garbled, exaggerated version of ordinary fireworks and explosives licensing rules, but no section using "missile" or "rocket" language has turned up.

      - subtitle: "Alligators can't be kept as pets without a permit"
        status: "Not Verified"
        text: |
          **Claim:** Keeping an alligator as a pet requires a state permit.

          **Why We Couldn't Verify It:** General wild-animal possession rules likely apply, but no alligator-specific statute or regulation has been located to confirm the exact claim as stated.

      - subtitle: "Fortunetelling is banned specifically in Chester"
        status: "Not Verified"
        text: |
          **Claim:** The town of Chester has its own local ban on telling fortunes.

          **Why We Couldn't Verify It:** The real fortunetelling law is a statewide statute, not a Chester ordinance. No Chester-specific municipal code entry on the subject has been found, so the local framing appears to be an embellishment.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange South Carolina Laws That Are Myths"
    paragraphs:
      - "One Strange South Carolina Laws claim about horses in formalwear keeps circulating even though the sites repeating it admit it's probably made up."
    subsections:
      - subtitle: "Horses in Fountain Inn must wear pants"
        status: "Myth"
        text: |
          **Myth:** A Fountain Inn ordinance requires horses to wear pants in public.

          **Reality:** No ordinance number or municipal code entry supports this claim anywhere. It reads as a classic recycled internet joke, and at least one site that repeats it flags it as likely fiction in the same breath.

      - subtitle: "It's illegal to swear anywhere in South Carolina"
        status: "Myth"
        text: |
          **Myth:** Cursing anywhere in public is against South Carolina law.

          **Reality:** The real law bans obscene or profane language only on a highway, in a public place, or within earshot of a school or church, as part of a general disorderly-conduct statute. It's ordinary public-order law, not a freestanding no-cussing rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why South Carolina's Short Session Leaves Old Statutes Alone"
    paragraphs:
      - "South Carolina's General Assembly convenes each January and is required to adjourn by the second Thursday in May unless two-thirds of both chambers vote to extend it, giving lawmakers only about four working months a year. Spread that short calendar across 271 separate incorporated cities and towns, each keeping its own municipal code, and there's no realistic bandwidth to audit and repeal old statutes that nobody is actively enforcing."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "South Carolina was the first state to secede from the Union, on December 20, 1860."
      - "From 1973 to 2006, every mixed drink served in South Carolina legally had to be poured from a sealed 1.7-ounce mini bottle, the only state with that rule."
      - "South Carolina was the last U.S. state to repeal its Election Day alcohol-sales ban, holding out until 2014."
      - "A 1999 state Supreme Court ruling ended video poker in South Carolina, described at the time as the first time in 50 years any state had banned an entire existing legal gambling industry."
      - "The state has 271 incorporated municipalities across 46 counties, giving it an unusually high number of separate local governments for its size."

