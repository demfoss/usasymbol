faq:
  - question: "Why does South Carolina have a law against wearing masks in public?"
    answer: "The 1951 law was written specifically to unmask Ku Klux Klan members, who used hoods to commit intimidation and violence anonymously. It still applies today, with exceptions for costumes, safety gear, and theater."
  - question: "Are stores really closed on Sundays in South Carolina?"
    answer: "Some sales are restricted. State law bans Sunday sales of goods like clothing, furniture, and hardware, though counties collecting over $900,000 a year in accommodations tax are automatically exempt."
  - question: "Is fortunetelling illegal in South Carolina?"
    answer: "Yes. Practicing fortunetelling, palmistry, or clairvoyance for money is a misdemeanor under state law, and itinerant practitioners need a county clerk's license to travel and work."
  - question: "Do horses in Fountain Inn have to wear pants?"
    answer: "No. This is a recycled internet joke with no ordinance behind it, and even sites that repeat the claim admit it's probably fiction."
  - question: "What is the weirdest real law still on the books in South Carolina?"
    answer: "The mask ban stands out because it's not a random novelty rule. It's a currently enforced statute written with a specific, serious historical purpose: unmasking Klan members."
  - question: "Was South Carolina's mini-bottle liquor law unique?"
    answer: "Yes. From 1973 until 2006, it was the only U.S. state where every mixed drink had to be poured from a sealed 1.7-ounce bottle, until a constitutional amendment let lawmakers repeal it."
