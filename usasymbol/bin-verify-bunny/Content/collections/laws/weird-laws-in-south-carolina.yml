page:
  h1: "Real South Carolina Laws You Won't Believe"
  quick_answer:
    - "Four South Carolina claims check out: a public mask ban, Sunday blue laws on retail sales, a Sabbath gambling law, and a statewide fortunetelling restriction."
    - "The mask ban wasn't written as a costume rule. Lawmakers passed it in 1951 specifically to unmask Ku Klux Klan members who used hoods to commit intimidation anonymously."
    - "A viral claim about horses needing pants in Fountain Inn has no ordinance behind it anywhere, and even sites that repeat it admit it's likely fiction."
