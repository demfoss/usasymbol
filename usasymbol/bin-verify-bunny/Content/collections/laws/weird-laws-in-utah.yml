sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Utah That Are Real"
    paragraphs:
      - "Utah is one of the only states where first cousins can legally marry under specific conditions, one of several Unusual Laws in Utah that check out against the actual code."
    highlights:
      - name: "First Cousins Can Marry, With Age Conditions"
        status: "Verified"
        image: "/images/collections/laws/utah-cousin-marriage-law.jpg"
        description: |
          **Law:** Utah bans marriage between first cousins unless both parties are over 65, or both are 55 or older and one can prove infertility.

          **Meaning:** It's not a blanket ban like most states use. The exception is narrow and tied specifically to age and fertility.

          **Reason:** Lawmakers built in the exception for older couples where the traditional genetic concerns behind cousin-marriage bans no longer apply, since childbearing isn't a realistic factor.

      - name: "Cloud Seeding Requires a State Permit"
        status: "Verified"
        image: "/images/collections/laws/utah-cloud-seeding-law.jpg"
        description: |
          **Law:** The Division of Water Resources is the only entity in Utah authorized to approve cloud-seeding projects meant to alter precipitation or weather patterns.

          **Meaning:** Private individuals or companies can't legally attempt to modify the weather on their own, even on their own land.

          **Reason:** Utah actively uses cloud seeding to boost mountain snowpack for its water supply, so the state keeps tight control over who can attempt it and how, given the real downstream effects on water rights.

      - name: "Bicycle Riders Must Keep One Hand on the Handlebars"
        status: "Verified"
        image: "/images/collections/laws/utah-bicycle-handlebar-law.jpg"
        description: |
          **Law:** Anyone operating a bicycle or moped must keep at least one hand on the handlebars at all times.

          **Meaning:** No-hands riding, even briefly, is a traffic violation, not just risky behavior.

          **Reason:** The rule, added in 2005, treats bicycles under the same basic vehicle-control logic as cars, requiring a rider to maintain steering control at every moment on the road.

      - name: "Hotels Can Charge Parents a $500 Deposit for Kids"
        status: "Verified"
        image: "/images/collections/laws/utah-hotel-deposit-law.jpg"
        description: |
          **Law:** Innkeepers can require a deposit of up to $500 to cover potential damage caused by a minor guest, refunded after a checkout inspection.

          **Meaning:** The deposit specifically targets damage risk tied to having a minor in the room, separate from ordinary hotel security deposits.

          **Reason:** It's part of Utah's Innkeeper's Rights Act, giving hotels a defined, capped tool to manage damage risk without resorting to case-by-case negotiation.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Utah We Couldn't Verify"
    paragraphs:
      - "A cluster of Weird Utah Laws Still on the Books claims about animals and small towns keeps circulating with no confirmed citation behind most of them."
    subsections:
      - subtitle: "Throwing rocks to annoy a traveler is banned in Logan"
        status: "Not Verified"
        text: |
          **Claim:** A Logan ordinance bans throwing rocks to annoy any traveler or pedestrian.

          **Why We Couldn't Verify It:** A city code section is referenced in secondary sources, but the exact current ordinance text couldn't be independently confirmed in the time available.

      - subtitle: "Birds have the right of way on highways"
        status: "Not Verified"
        text: |
          **Claim:** Utah law gives birds the legal right of way on public highways.

          **Why We Couldn't Verify It:** No statute matching this claim has been located anywhere in the Utah Code's traffic or wildlife sections.

      - subtitle: "Dead pets must be buried within two business days"
        status: "Not Verified"
        text: |
          **Claim:** State law requires domestic animals to be buried within two business days of death.

          **Why We Couldn't Verify It:** No specific statute matching this timeframe has been confirmed. General public-health and disposal rules likely apply, but the exact two-day figure couldn't be traced to a citable source.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Utah Laws That Are Myths"
    paragraphs:
      - "One persistent Strange Utah Laws claim about bedroom behavior has been directly debunked, with no statute anywhere close to matching it."
    subsections:
      - subtitle: "State law dictates a specific allowed position for married couples"
        status: "Myth"
        text: |
          **Myth:** Utah law specifies one particular allowed position for sex between married couples.

          **Reality:** No such statute exists. This is a persistent urban legend likely tied to Utah's conservative reputation, not a real law, and it has been directly debunked by multiple sources checking the actual code.

      - subtitle: "Throwing snowballs is illegal in Provo"
        status: "Myth"
        text: |
          **Myth:** Provo has a specific standalone law against throwing snowballs.

          **Reality:** The real ordinance is a general "throwing missiles" provision aimed at frightening or annoying people, not a snowball-specific rule. Framing it as a snowball law makes an ordinary public-safety ordinance sound far more novel than it is.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Utah's 45-Day Session Leaves Small Statutes Alone"
    paragraphs:
      - "Utah's Legislature is constitutionally limited to a 45-day general session each year, one of the shortest in the country, running from mid-January and excluding federal holidays. With hundreds of bills competing for that narrow window every year, a niche rule like the bicycle handlebar law almost never rises high enough on the priority list to get revisited, no matter how long it's been on the books."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Utah's cousin-marriage exception is unusually narrow, requiring either both spouses to be over 65 or both to be 55-plus with proven infertility."
      - "The bicycle handlebar law was added to Utah's traffic code in 2005, treating bikes with the same control standard as cars."
      - "Utah's Division of Water Resources is the sole legal authority for approving cloud-seeding projects statewide."
      - "The $500 hotel deposit law is part of Utah's Innkeeper's Rights Act, a dedicated chapter of the state code just for hotel operations."
      - "Utah's 45-day session limit is one of the shortest of any full state legislature in the country."

