page:
  h1: "Real Utah Laws You Won't Believe"
  quick_answer:
    - "Four Utah claims check out: a bicycle handlebar rule, a cloud-seeding permit law, a cousin-marriage age exception, and a $500 hotel deposit rule for minors."
