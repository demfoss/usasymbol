faq:
  - question: "Can first cousins get married in Utah?"
    answer: "Yes, but only under narrow conditions. Both must be over 65, or both must be 55 or older with proven infertility. It's not an unrestricted allowance."
  - question: "Do you need a permit to seed clouds in Utah?"
    answer: "Yes. The Division of Water Resources is the only entity authorized to approve cloud-seeding projects in the state, since Utah actively uses the technique to boost mountain snowpack."
  - question: "Is it illegal to ride a bike with no hands in Utah?"
    answer: "Yes. State law requires bicycle and moped riders to keep at least one hand on the handlebars at all times."
  - question: "Can a hotel charge extra for bringing kids in Utah?"
    answer: "Hotels can require up to a $500 deposit specifically to cover potential damage caused by a minor guest, refunded after a checkout inspection."
  - question: "Is the specific sex-position law in Utah real?"
    answer: "No. This is a persistent myth with no statute behind it, likely tied to assumptions about Utah's conservative reputation rather than any real law."
  - question: "What is the weirdest real law still on the books in Utah?"
    answer: "The cousin-marriage age exception surprises people most, since Utah is one of only a handful of states that allows it at all, even with the narrow age and fertility conditions attached."
