- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Louisiana Cities Rank Highest for Reported Crime
  paragraphs:
  - Alexandria ranks first because its combined 2024 reported crime rate is 9,309.9 per 100,000, which is 1,684.1
    points above Monroe. Property crime supplies 70.9% of Alexandria's total, while violent crime contributes 2,713.5
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Alexandria has the highest violent-crime
    rate in this group at 2,713.5 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Bogalusa has the smallest FBI coverage population in this
    list at 10,252; one additional reported offense changes its rate by about 9.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Shreveport reports the largest raw combined offense count in this group (9,138), but Alexandria ranks first
    after population adjustment.
  - Alexandria also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 1,684.1 rate points between Alexandria and Monroe.
  - Property crime's share ranges from 70.9% in Alexandria to 91.5% in Gonzales.
faq:
- question: What city has the highest reported crime rate in Louisiana?
  answer: Alexandria ranks first among qualifying city agencies matched to Census places at 9,309.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Alexandria rank first for reported crime in Louisiana?
  answer: Its combined violent and property crime rate is 9,309.9 per 100,000 residents covered. Property crime
    contributes 6,596.3 and violent crime contributes 2,713.5 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Louisiana is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
