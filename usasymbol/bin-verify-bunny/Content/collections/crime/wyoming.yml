- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Wyoming Cities Rank Highest for Reported Crime
  paragraphs:
  - Riverton ranks first because its combined 2024 reported crime rate is 4,688.8 per 100,000, which is 1,371.5
    points above Cheyenne. Property crime supplies 84.1% of Riverton's total, while violent crime contributes 745.1
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Riverton has the highest violent-crime rate
    in this group at 745.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Cody has the smallest FBI coverage population in this list
    at 10,306; one additional reported offense changes its rate by about 9.7 per 100,000. This mathematical effect
    explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Cheyenne reports the largest raw combined offense count in this group (2,161), but Riverton ranks first after
    population adjustment.
  - Riverton also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 1,371.5 rate points between Riverton and Cheyenne.
  - Property crime's share ranges from 73.2% in Green River to 90.9% in Rock Springs.
faq:
- question: What city has the highest reported crime rate in Wyoming?
  answer: Riverton ranks first among qualifying city agencies matched to Census places at 4,688.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Riverton rank first for reported crime in Wyoming?
  answer: Its combined violent and property crime rate is 4,688.8 per 100,000 residents covered. Property crime
    contributes 3,943.7 and violent crime contributes 745.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Wyoming is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
