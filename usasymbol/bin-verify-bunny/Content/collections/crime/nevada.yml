- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Nevada Cities Rank Highest for Reported Crime
  paragraphs:
  - Las Vegas ranks first because its combined 2024 reported crime rate is 3,052.5 per 100,000, which is 74.3 points
    above Sparks. Property crime supplies 85.9% of Las Vegas's total, while violent crime contributes 429.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Reno has the highest violent-crime rate
    in this group at 529.6 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Boulder City has the smallest FBI coverage population in
    this list at 14,800; one additional reported offense changes its rate by about 6.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Las Vegas leads both the per-capita ranking and the raw combined offense count among the included Nevada cities,
    with 52,399 reported offenses.
  - 'Reno, ranked #3 overall, has the highest violent-crime rate; Las Vegas''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 706.9 rate points between Elko and Mesquite.
  - Property crime's share ranges from 78.3% in Elko to 89.1% in Mesquite.
faq:
- question: What city has the highest reported crime rate in Nevada?
  answer: Las Vegas ranks first among qualifying city agencies matched to Census places at 3,052.5 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Las Vegas rank first for reported crime in Nevada?
  answer: Its combined violent and property crime rate is 3,052.5 per 100,000 residents covered. Property crime
    contributes 2,622.7 and violent crime contributes 429.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Nevada is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
