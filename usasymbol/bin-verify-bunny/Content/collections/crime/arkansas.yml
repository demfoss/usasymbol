- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Arkansas Cities Rank Highest for Reported Crime
  paragraphs:
  - Little Rock ranks first because its combined 2024 reported crime rate is 6,886.3 per 100,000, which is 306.3
    points above West Memphis. Property crime supplies 75.7% of Little Rock's total, while violent crime contributes
    1,672.0 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. West Memphis has the highest violent-crime
    rate in this group at 1,922.3 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Camden has the smallest FBI coverage population in this
    list at 10,025; one additional reported offense changes its rate by about 10.0 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Little Rock leads both the per-capita ranking and the raw combined offense count among the included Arkansas
    cities, with 14,065 reported offenses.
  - 'West Memphis, ranked #2 overall, has the highest violent-crime rate; Little Rock''s #1 position comes from
    the combined violent-and-property measure.'
  - The list's largest adjacent gap is 451.4 rate points between West Memphis and Pine Bluff.
  - Property crime's share ranges from 70.8% in West Memphis to 88.6% in Hot Springs.
faq:
- question: What city has the highest reported crime rate in Arkansas?
  answer: Little Rock ranks first among qualifying city agencies matched to Census places at 6,886.3 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Little Rock rank first for reported crime in Arkansas?
  answer: Its combined violent and property crime rate is 6,886.3 per 100,000 residents covered. Property crime
    contributes 5,214.3 and violent crime contributes 1,672.0 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Arkansas is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
