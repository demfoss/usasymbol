- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These South Dakota Cities Rank Highest for Reported Crime
  paragraphs:
  - Rapid City ranks first because its combined 2024 reported crime rate is 4,511.0 per 100,000, which is 1,069.0
    points above Sioux Falls. Property crime supplies 84.1% of Rapid City's total, while violent crime contributes
    718.9 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Rapid City has the highest violent-crime
    rate in this group at 718.9 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Vermillion has the smallest FBI coverage population in
    this list at 12,110; one additional reported offense changes its rate by about 8.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Sioux Falls reports the largest raw combined offense count in this group (7,260), but Rapid City ranks first
    after population adjustment.
  - Rapid City also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 1,069.0 rate points between Rapid City and Sioux Falls.
  - Property crime's share ranges from 77.3% in Box Elder to 88.2% in Mitchell.
faq:
- question: What city has the highest reported crime rate in South Dakota?
  answer: Rapid City ranks first among qualifying city agencies matched to Census places at 4,511.0 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Rapid City rank first for reported crime in South Dakota?
  answer: Its combined violent and property crime rate is 4,511.0 per 100,000 residents covered. Property crime
    contributes 3,792.1 and violent crime contributes 718.9 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in South Dakota is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
