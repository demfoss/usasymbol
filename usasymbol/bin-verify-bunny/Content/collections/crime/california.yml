- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These California Cities Rank Highest for Reported Crime
  paragraphs:
  - Emeryville ranks first because its combined 2024 reported crime rate is 14,718.6 per 100,000, which is 910.2
    points above Commerce. Property crime supplies 91.6% of Emeryville's total, while violent crime contributes
    1,231.2 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Oakland has the highest violent-crime rate
    in this group at 1,925.3 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Signal Hill has the smallest FBI coverage population in
    this list at 11,068; one additional reported offense changes its rate by about 9.0 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Oakland reports the largest raw combined offense count in this group (39,831), but Emeryville ranks first after
    population adjustment.
  - 'Oakland, ranked #3 overall, has the highest violent-crime rate; Emeryville''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 4,652.7 rate points between Commerce and Oakland.
  - Property crime's share ranges from 79.0% in Oakland to 93.8% in Cerritos.
faq:
- question: What city has the highest reported crime rate in California?
  answer: Emeryville ranks first among qualifying city agencies matched to Census places at 14,718.6 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Emeryville rank first for reported crime in California?
  answer: Its combined violent and property crime rate is 14,718.6 per 100,000 residents covered. Property crime
    contributes 13,487.5 and violent crime contributes 1,231.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in California is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
