- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Illinois Cities Rank Highest for Reported Crime
  paragraphs:
  - Danville ranks first because its combined 2024 reported crime rate is 7,360.7 per 100,000, which is 1,403.6
    points above Evergreen Park. Property crime supplies 77.1% of Danville's total, while violent crime contributes
    1,684.3 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Danville has the highest violent-crime rate
    in this group at 1,684.3 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Evergreen Park has the smallest FBI coverage population
    in this list at 18,734; one additional reported offense changes its rate by about 5.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Chicago reports the largest raw combined offense count in this group (105,871), but Danville ranks first after
    population adjustment.
  - Danville also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 1,403.6 rate points between Danville and Evergreen Park.
  - Property crime's share ranges from 68.9% in Chicago Heights to 97.9% in Evergreen Park.
  - 'Evergreen Park has the highest property-crime rate in the group even though it ranks #2 on the combined list.'
faq:
- question: What city has the highest reported crime rate in Illinois?
  answer: Danville ranks first among qualifying city agencies matched to Census places at 7,360.7 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Danville rank first for reported crime in Illinois?
  answer: Its combined violent and property crime rate is 7,360.7 per 100,000 residents covered. Property crime
    contributes 5,676.4 and violent crime contributes 1,684.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Illinois is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
