- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Utah Cities Rank Highest for Reported Crime
  paragraphs:
  - South Salt Lake ranks first because its combined 2024 reported crime rate is 6,641.0 per 100,000, which is 576.8
    points above Salt Lake City. Property crime supplies 88.4% of South Salt Lake's total, while violent crime contributes
    767.5 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Salt Lake City has the highest violent-crime
    rate in this group at 864.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Vernal has the smallest FBI coverage population in this
    list at 10,718; one additional reported offense changes its rate by about 9.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Salt Lake City reports the largest raw combined offense count in this group (12,897), but South Salt Lake ranks
    first after population adjustment.
  - 'Salt Lake City, ranked #2 overall, has the highest violent-crime rate; South Salt Lake''s #1 position comes
    from the combined violent-and-property measure.'
  - The list's largest adjacent gap is 2,467.4 rate points between Salt Lake City and Murray.
  - Property crime's share ranges from 79.2% in Ogden to 96.2% in Lindon.
faq:
- question: What city has the highest reported crime rate in Utah?
  answer: South Salt Lake ranks first among qualifying city agencies matched to Census places at 6,641.0 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does South Salt Lake rank first for reported crime in Utah?
  answer: Its combined violent and property crime rate is 6,641.0 per 100,000 residents covered. Property crime
    contributes 5,873.5 and violent crime contributes 767.5 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Utah is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
