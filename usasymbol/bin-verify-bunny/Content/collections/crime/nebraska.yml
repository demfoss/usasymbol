- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Nebraska Cities Rank Highest for Reported Crime
  paragraphs:
  - Omaha ranks first because its combined 2024 reported crime rate is 3,530.8 per 100,000, which is 159.6 points
    above Scottsbluff. Property crime supplies 89.5% of Omaha's total, while violent crime contributes 369.0 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Scottsbluff has the highest violent-crime
    rate in this group at 588.0 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Lexington has the smallest FBI coverage population in this
    list at 10,867; one additional reported offense changes its rate by about 9.2 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Omaha leads both the per-capita ranking and the raw combined offense count among the included Nebraska cities,
    with 16,956 reported offenses.
  - 'Scottsbluff, ranked #2 overall, has the highest violent-crime rate; Omaha''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 538.1 rate points between Scottsbluff and South Sioux City.
  - Property crime's share ranges from 82.6% in Scottsbluff to 94.6% in North Platte.
faq:
- question: What city has the highest reported crime rate in Nebraska?
  answer: Omaha ranks first among qualifying city agencies matched to Census places at 3,530.8 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Omaha rank first for reported crime in Nebraska?
  answer: Its combined violent and property crime rate is 3,530.8 per 100,000 residents covered. Property crime
    contributes 3,161.8 and violent crime contributes 369.0 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Nebraska is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
