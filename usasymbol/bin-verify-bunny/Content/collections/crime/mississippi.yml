- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Mississippi Cities Rank Highest for Reported Crime
  paragraphs:
  - Pascagoula ranks first because its combined 2024 reported crime rate is 5,196.9 per 100,000, which is 357.0
    points above Laurel. Property crime supplies 93.7% of Pascagoula's total, while violent crime contributes 326.3
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Laurel has the highest violent-crime rate
    in this group at 1,051.9 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Cleveland has the smallest FBI coverage population in this
    list at 10,165; one additional reported offense changes its rate by about 9.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Hattiesburg reports the largest raw combined offense count in this group (1,781), but Pascagoula ranks first
    after population adjustment.
  - 'Laurel, ranked #2 overall, has the highest violent-crime rate; Pascagoula''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 481.5 rate points between Tupelo and Hattiesburg.
  - Property crime's share ranges from 78.3% in Laurel to 95.2% in Bay St. Louis.
faq:
- question: What city has the highest reported crime rate in Mississippi?
  answer: Pascagoula ranks first among qualifying city agencies matched to Census places at 5,196.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Pascagoula rank first for reported crime in Mississippi?
  answer: Its combined violent and property crime rate is 5,196.9 per 100,000 residents covered. Property crime
    contributes 4,870.7 and violent crime contributes 326.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Mississippi is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
