- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Michigan Cities Rank Highest for Reported Crime
  paragraphs:
  - Detroit ranks first because its combined 2024 reported crime rate is 6,086.6 per 100,000, which is 1,044.8 points
    above Harper Woods. Property crime supplies 70.7% of Detroit's total, while violent crime contributes 1,781.3
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Saginaw has the highest violent-crime rate
    in this group at 2,201.5 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Harper Woods has the smallest FBI coverage population in
    this list at 14,717; one additional reported offense changes its rate by about 6.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Detroit leads both the per-capita ranking and the raw combined offense count among the included Michigan cities,
    with 39,634 reported offenses.
  - 'Saginaw, ranked #5 overall, has the highest violent-crime rate; Detroit''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 1,044.8 rate points between Detroit and Harper Woods.
  - Property crime's share ranges from 47.1% in Saginaw to 90.5% in Grandville.
faq:
- question: What city has the highest reported crime rate in Michigan?
  answer: Detroit ranks first among qualifying city agencies matched to Census places at 6,086.6 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Detroit rank first for reported crime in Michigan?
  answer: Its combined violent and property crime rate is 6,086.6 per 100,000 residents covered. Property crime
    contributes 4,305.3 and violent crime contributes 1,781.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Michigan is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
