- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Indiana Cities Rank Highest for Reported Crime
  paragraphs:
  - Evansville ranks first because its combined 2024 reported crime rate is 4,884.9 per 100,000, which is 671.0
    points above Indianapolis. Property crime supplies 75.3% of Evansville's total, while violent crime contributes
    1,206.2 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Evansville has the highest violent-crime
    rate in this group at 1,206.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Clarksville has the smallest FBI coverage population in
    this list at 22,174; one additional reported offense changes its rate by about 4.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Indianapolis reports the largest raw combined offense count in this group (37,533), but Evansville ranks first
    after population adjustment.
  - Evansville also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 671.0 rate points between Evansville and Indianapolis.
  - Property crime's share ranges from 67.9% in South Bend to 93.2% in Clarksville.
faq:
- question: What city has the highest reported crime rate in Indiana?
  answer: Evansville ranks first among qualifying city agencies matched to Census places at 4,884.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Evansville rank first for reported crime in Indiana?
  answer: Its combined violent and property crime rate is 4,884.9 per 100,000 residents covered. Property crime
    contributes 3,678.7 and violent crime contributes 1,206.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Indiana is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
