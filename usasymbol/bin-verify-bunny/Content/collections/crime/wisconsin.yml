- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Wisconsin Cities Rank Highest for Reported Crime
  paragraphs:
  - Glendale ranks first because its combined 2024 reported crime rate is 4,480.9 per 100,000, which is 349.3 points
    above Milwaukee. Property crime supplies 93.4% of Glendale's total, while violent crime contributes 295.1 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Milwaukee has the highest violent-crime
    rate in this group at 1,430.9 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Brown Deer has the smallest FBI coverage population in
    this list at 12,636; one additional reported offense changes its rate by about 7.9 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Milwaukee reports the largest raw combined offense count in this group (23,154), but Glendale ranks first after
    population adjustment.
  - 'Milwaukee, ranked #2 overall, has the highest violent-crime rate; Glendale''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 1,142.9 rate points between La Crosse and Brown Deer.
  - Property crime's share ranges from 65.4% in Milwaukee to 96.2% in Greenfield.
faq:
- question: What city has the highest reported crime rate in Wisconsin?
  answer: Glendale ranks first among qualifying city agencies matched to Census places at 4,480.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Glendale rank first for reported crime in Wisconsin?
  answer: Its combined violent and property crime rate is 4,480.9 per 100,000 residents covered. Property crime
    contributes 4,185.8 and violent crime contributes 295.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Wisconsin is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
