- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Delaware Cities Rank Highest for Reported Crime
  paragraphs:
  - Dover ranks first because its combined 2024 reported crime rate is 7,082.1 per 100,000, which is 2,641.0 points
    above Milford. Property crime supplies 85.7% of Dover's total, while violent crime contributes 1,012.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Wilmington has the highest violent-crime
    rate in this group at 1,127.0 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Smyrna has the smallest FBI coverage population in this
    list at 13,386; one additional reported offense changes its rate by about 7.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Wilmington reports the largest raw combined offense count in this group (3,084), but Dover ranks first after
    population adjustment.
  - 'Wilmington, ranked #3 overall, has the highest violent-crime rate; Dover''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 2,641.0 rate points between Dover and Milford.
  - Property crime's share ranges from 73.7% in Wilmington to 92.5% in Middletown.
faq:
- question: What city has the highest reported crime rate in Delaware?
  answer: Dover ranks first among qualifying city agencies matched to Census places at 7,082.1 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Dover rank first for reported crime in Delaware?
  answer: Its combined violent and property crime rate is 7,082.1 per 100,000 residents covered. Property crime
    contributes 6,069.3 and violent crime contributes 1,012.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Delaware is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
