- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Missouri Cities Rank Highest for Reported Crime
  paragraphs:
  - St. Louis ranks first because its combined 2024 reported crime rate is 7,074.1 per 100,000, which is 580.5 points
    above Branson. Property crime supplies 80.7% of St. Louis's total, while violent crime contributes 1,367.1 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Kansas City has the highest violent-crime
    rate in this group at 1,547.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Bridgeton has the smallest FBI coverage population in this
    list at 11,206; one additional reported offense changes its rate by about 8.9 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Kansas City reports the largest raw combined offense count in this group (31,834), but St. Louis ranks first
    after population adjustment.
  - 'Kansas City, ranked #4 overall, has the highest violent-crime rate; St. Louis''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 860.4 rate points between Kansas City and Springfield.
  - Property crime's share ranges from 75.1% in Kansas City to 92.6% in Branson.
  - 'Branson has the highest property-crime rate in the group even though it ranks #2 on the combined list.'
faq:
- question: What city has the highest reported crime rate in Missouri?
  answer: St. Louis ranks first among qualifying city agencies matched to Census places at 7,074.1 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does St. Louis rank first for reported crime in Missouri?
  answer: Its combined violent and property crime rate is 7,074.1 per 100,000 residents covered. Property crime
    contributes 5,706.9 and violent crime contributes 1,367.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Missouri is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
