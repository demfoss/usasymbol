- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Colorado Cities Rank Highest for Reported Crime
  paragraphs:
  - Lone Tree ranks first because its combined 2024 reported crime rate is 11,413.7 per 100,000, which is 4,800.2
    points above Greenwood Village. Property crime supplies 96.2% of Lone Tree's total, while violent crime contributes
    436.0 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Pueblo has the highest violent-crime rate
    in this group at 1,424.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Glenwood Springs has the smallest FBI coverage population
    in this list at 10,334; one additional reported offense changes its rate by about 9.7 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Denver reports the largest raw combined offense count in this group (41,550), but Lone Tree ranks first after
    population adjustment.
  - 'Pueblo, ranked #3 overall, has the highest violent-crime rate; Lone Tree''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 4,800.2 rate points between Lone Tree and Greenwood Village.
  - Property crime's share ranges from 76.6% in Aurora to 96.2% in Lone Tree.
faq:
- question: What city has the highest reported crime rate in Colorado?
  answer: Lone Tree ranks first among qualifying city agencies matched to Census places at 11,413.7 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Lone Tree rank first for reported crime in Colorado?
  answer: Its combined violent and property crime rate is 11,413.7 per 100,000 residents covered. Property crime
    contributes 10,977.7 and violent crime contributes 436.0 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Colorado is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
