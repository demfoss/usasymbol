- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Tennessee Cities Rank Highest for Reported Crime
  paragraphs:
  - Memphis ranks first because its combined 2024 reported crime rate is 9,400.3 per 100,000, which is 3,387.9 points
    above Dyersburg. Property crime supplies 73.4% of Memphis's total, while violent crime contributes 2,501.3 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Memphis has the highest violent-crime rate
    in this group at 2,501.3 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Millington has the smallest FBI coverage population in
    this list at 11,785; one additional reported offense changes its rate by about 8.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Memphis leads both the per-capita ranking and the raw combined offense count among the included Tennessee cities,
    with 57,643 reported offenses.
  - Memphis also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 3,387.9 rate points between Memphis and Dyersburg.
  - Property crime's share ranges from 73.4% in Memphis to 87.9% in Sevierville.
faq:
- question: What city has the highest reported crime rate in Tennessee?
  answer: Memphis ranks first among qualifying city agencies matched to Census places at 9,400.3 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Memphis rank first for reported crime in Tennessee?
  answer: Its combined violent and property crime rate is 9,400.3 per 100,000 residents covered. Property crime
    contributes 6,899.0 and violent crime contributes 2,501.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Tennessee is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
