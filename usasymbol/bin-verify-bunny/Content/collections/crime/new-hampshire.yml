- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These New Hampshire Cities Rank Highest for Reported Crime
  paragraphs:
  - Somersworth ranks first because its combined 2024 reported crime rate is 2,705.8 per 100,000, which is 28.2
    points above Laconia. Property crime supplies 93.4% of Somersworth's total, while violent crime contributes
    179.3 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Manchester has the highest violent-crime
    rate in this group at 336.0 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Conway has the smallest FBI coverage population in this
    list at 10,441; one additional reported offense changes its rate by about 9.6 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Manchester reports the largest raw combined offense count in this group (2,291), but Somersworth ranks first
    after population adjustment.
  - 'Manchester, ranked #6 overall, has the highest violent-crime rate; Somersworth''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 325.6 rate points between Laconia and Keene.
  - Property crime's share ranges from 83.1% in Manchester to 94.6% in Laconia.
  - 'Laconia has the highest property-crime rate in the group even though it ranks #2 on the combined list.'
faq:
- question: What city has the highest reported crime rate in New Hampshire?
  answer: Somersworth ranks first among qualifying city agencies matched to Census places at 2,705.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Somersworth rank first for reported crime in New Hampshire?
  answer: Its combined violent and property crime rate is 2,705.8 per 100,000 residents covered. Property crime
    contributes 2,526.5 and violent crime contributes 179.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in New Hampshire is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
