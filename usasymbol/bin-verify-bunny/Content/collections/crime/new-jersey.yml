- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These New Jersey Cities Rank Highest for Reported Crime
  paragraphs:
  - Atlantic City ranks first because its combined 2024 reported crime rate is 8,017.2 per 100,000, which is 3,089.2
    points above Paramus. Property crime supplies 77.8% of Atlantic City's total, while violent crime contributes
    1,780.1 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Atlantic City has the highest violent-crime
    rate in this group at 1,780.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Collingswood has the smallest FBI coverage population in
    this list at 14,528; one additional reported offense changes its rate by about 6.9 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Paterson reports the largest raw combined offense count in this group (5,291), but Atlantic City ranks first
    after population adjustment.
  - Atlantic City also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 3,089.2 rate points between Atlantic City and Paramus.
  - Property crime's share ranges from 69.0% in Trenton to 99.4% in Paramus.
faq:
- question: What city has the highest reported crime rate in New Jersey?
  answer: Atlantic City ranks first among qualifying city agencies matched to Census places at 8,017.2 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Atlantic City rank first for reported crime in New Jersey?
  answer: Its combined violent and property crime rate is 8,017.2 per 100,000 residents covered. Property crime
    contributes 6,237.0 and violent crime contributes 1,780.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in New Jersey is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
