sections:
- id: highest-reported-crime-rates
  icon: fa-solid fa-location-dot
  style: law-cards
  title: Hawaii City With the Highest Reported Crime Rate
  paragraphs:
  - Each card separates violent and property crime so the category driving the combined rate remains visible. Counts
    describe offenses reported by the listed city agency during 2024.
  highlights:
  - name: Honolulu
    state: Hawaii
    status: 2024 FBI data
    description: |-
      **Rank:** #1
      **Total crime rate:** 1,974.8 per 100,000
      **Coverage population:** 992,973

      Honolulu reported 19,609 violent and property crimes in 2024. The violent crime rate was 185.2, while the property crime rate was 1,789.6 per 100,000.

      Property crime accounts for the larger share of the combined rate, which places Honolulu at #1 among qualifying Hawaii city agencies matched to Census places.
    image: /images/collections/crime/hawaii/honolulu.webp
- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why Honolulu Has the Highest Reported Crime Rate in Hawaii
  paragraphs:
  - Honolulu is the only qualifying Hawaii city agency in this comparison. It reported 19,609 violent and property
    crimes, producing a combined rate of 1,974.8 per 100,000 residents covered.
  - Property crime contributes 1,789.6 per 100,000, or 90.6% of the combined rate. Violent crime contributes the
    remaining 185.2 per 100,000. The first-place label therefore reflects the only eligible agency in the dataset
    rather than a comparison with every community in the state.
  facts:
  - Honolulu reported 19,609 combined violent and property offenses for an FBI coverage population of 992,973.
  - Property offenses account for 90.6% of its combined reported crime rate; violent offenses account for 9.4%.
  - No second qualifying Hawaii city is available in this matched dataset, so a statewide rate gap cannot be calculated.
faq:
- question: What city has the highest reported crime rate in Hawaii?
  answer: Honolulu ranks first among qualifying city agencies matched to Census places at 1,974.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Honolulu rank first for reported crime in Hawaii?
  answer: Its combined violent and property crime rate is 1,974.8 per 100,000 residents covered. Property crime
    contributes 1,789.6 and violent crime contributes 185.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Hawaii is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
