- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Texas Cities Rank Highest for Reported Crime
  paragraphs:
  - Humble ranks first because its combined 2024 reported crime rate is 11,302.6 per 100,000, which is 4,770.4 points
    above Webster. Property crime supplies 91.3% of Humble's total, while violent crime contributes 982.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Donna has the highest violent-crime rate
    in this group at 1,757.9 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Leon Valley has the smallest FBI coverage population in
    this list at 11,269; one additional reported offense changes its rate by about 8.9 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Houston reports the largest raw combined offense count in this group (126,200), but Humble ranks first after
    population adjustment.
  - 'Donna, ranked #3 overall, has the highest violent-crime rate; Humble''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 4,770.4 rate points between Humble and Webster.
  - Property crime's share ranges from 71.0% in Donna to 93.8% in Addison.
faq:
- question: What city has the highest reported crime rate in Texas?
  answer: Humble ranks first among qualifying city agencies matched to Census places at 11,302.6 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Humble rank first for reported crime in Texas?
  answer: Its combined violent and property crime rate is 11,302.6 per 100,000 residents covered. Property crime
    contributes 10,319.7 and violent crime contributes 982.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Texas is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
