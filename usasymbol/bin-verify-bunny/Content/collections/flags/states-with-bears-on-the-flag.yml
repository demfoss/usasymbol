sections:
  - id: bear-state-flag-spotlights
    icon: "fa-solid fa-paw"
    style: "law-cards"
    title: "State Flags With Bears"
    subsections:
      - id: california
        subtitle: "California"
        text: |-
          **Bear count:** 1
          **Flag adopted:** 1911

          California places one large grizzly above the words CALIFORNIA REPUBLIC. The design descends from the handmade flag raised at Sonoma during the Bear Flag Revolt of 1846, and the Legislature settled the complete design and colors in 1953.

          A dominant animal rather than a small seal detail makes California the clearest answer to which state flag has a bear. The official state account identifies the grizzly with great strength.
        anchor_phrases:
          - "state flag has a bear"
      - id: missouri
        subtitle: "Missouri"
        text: |-
          **Bear count:** 3
          **Flag adopted:** 1913

          Missouri places the coat of arms from its 1822 state seal at the center of Marie Elizabeth Watkins Oliver's red-white-blue flag. The arms contain three grizzly bears: two support the shield, and a third walks across the Missouri half of the shield.

          Three figures give Missouri more bear depictions than California, even though all are confined to the detailed coat of arms. The two supporters officially represent the state's strength and its citizens' bravery.
        anchor_phrases:
          - "three grizzly bears"

  - id: california-flag-bear
    icon: "fa-solid fa-paw"
    title: "California Bear Flag"
    paragraphs:
      - "California's state flag is commonly called the 'Bear Flag.' The grizzly stands at the center of a white field, walking left across a strip of green grass. Below the bear, in bold black capital letters: **CALIFORNIA REPUBLIC**. In the upper left, a red five-pointed star echoes the Lone Star of Texas. A red horizontal stripe runs along the bottom."
      - "California standardized the current artwork in 1953 after decades of inconsistent commercial versions. The State Capitol Museum says the central grizzly was inspired by a nineteenth-century painting by California artist Charles Nahl."
      - "The California grizzly (*Ursus arctos californicus*) disappeared from the state in the early twentieth century. California still preserves it as both the central flag figure and the official state animal."
    subsections:
      - subtitle: "The Bear Flag Revolt of 1846"
        text: "On June 14, 1846, American settlers in Sonoma raised a handmade grizzly-and-star flag and declared the short-lived **California Republic**. The republic lasted 25 days before the U.S. Navy replaced the Bear Flag with the Stars and Stripes. California adopted the Bear Flag as its state flag in 1911 and standardized the design in 1953."
      - subtitle: "The 61-Year Gap Before Official Adoption"
        text: "California entered the Union in September 1850 but did not adopt the Bear Flag as its official state flag until 1911. The Native Sons of the Golden West promoted a marching-banner version during that interval. California set the current design and color specifications in 1953. The [California state flag](/states/california/flag/california-state-flag) page covers the full legislative record."

  - id: missouri-flag-bears
    icon: "fa-solid fa-shield"
    title: "Missouri Bear Flag"
    paragraphs:
      - "Missouri's flag uses horizontal red, white, and blue stripes, the three colors of the United States flag. Official accounts connect the design to national pride and describe the stripe colors as valor, purity, and vigilance, permanency, and justice. At the center, 24 stars encircle the state coat of arms."
      - "Two **grizzly bears** stand upright beside the central shield as heraldic supporters. A third grizzly walks across the Missouri half of the shield. A bald eagle appears within the United States arms on the other half, while 24 stars mark Missouri as the 24th state."
    subsections:
      - subtitle: "Why Does the Missouri Flag Have Bears on It?"
        text: "Missouri placed three grizzly bears on the state seal in 1822, one year after statehood. The Secretary of State says the two supporters symbolize the state's strength and its citizens' bravery. A third grizzly appears with a silver crescent on the Missouri half of the shield."
      - subtitle: "History of the Missouri State Flag"
        text: "Judge Robert William Wells designed the three-bear state seal adopted in 1822. Marie Elizabeth Watkins Oliver designed the flag, and Sen. Arthur L. Oliver introduced its bill in 1909, 1911, and 1913. Missouri adopted the flag on March 22, 1913, so its bears predate the flag by 91 years."

  - id: bear-comparison
    icon: "fa-solid fa-arrows-left-right"
    style: "compare-cards"
    title: "California vs Missouri Bear Flags"
    paragraphs:
      - "Both flags carry grizzly bears, but the similarity ends quickly: California builds the whole design around one bear, while Missouri inherits its bears from the coat of arms created for the state seal."
    subsections:
      - subtitle: "Visibility: Dominant vs. Hidden"
        text: "California's bear dominates the [California state flag](/states/california/flag/california-state-flag) and remains visible at a distance. Missouri's three bears sit inside a detailed coat of arms within a blue ring. The arms date to the state seal adopted 91 years before the flag."

      - subtitle: "Symbolism: Revolution vs. Governance"
        text: "California's bear comes from the 1846 Bear Flag Revolt and represents strength in the official state account. On the [Missouri state flag](/states/missouri/flag/missouri-state-flag), two bears support the shield and represent state strength and citizen bravery. The third belongs to the Missouri half of the shield."

      - subtitle: "Species: Extinct vs. Still Symbolic"
        text: "Both flags show grizzly bears (*Ursus arctos*), but California's specific subspecies, the California grizzly (*Ursus arctos californicus*), became extinct by the 1920s. Missouri's grizzlies are heraldic figures from the 1822 state seal and are not tied to a narrower subspecies."

      - subtitle: "Design Philosophy: Clean Simplicity vs. Heraldic Complexity"
        text: "California gives its bear most of the white field, while Missouri reduces three bears to details within a seal and a ring of 24 stars. The animals therefore remain prominent on California's flag but require close viewing on Missouri's."

  - id: other-state-flags-animals
    icon: "fa-solid fa-shield-cat"
    title: "Other State Flags With Animals"
    paragraphs:
      - "Bears are rare on state flags, but other animals appear as main emblems and as details within state seals and coats of arms."
    subsections:
      - subtitle: "Wyoming, American Bison"
        text: "Wyoming's flag features a silhouette of an American bison at its center, with the state seal placed on the animal's side."
      - subtitle: "Louisiana, Brown Pelican"
        text: "Louisiana's flag features a brown pelican feeding three chicks in a nest. The heraldic image is known as the 'pelican in her piety' and represents self-sacrifice."
      - subtitle: "Michigan, Elk and Moose"
        text: "Michigan's coat of arms, which appears on its flag, features an elk and a moose as shield-holders. Like Missouri's two larger bears, the animals flank a central shield rather than forming the main flag field."
      - subtitle: "New York, Eagle"
        text: "New York's coat of arms features a bald eagle perched atop a globe. The bird functions as the crest above the shield rather than as a central field figure."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Bear Flag Facts"
    facts:
      - "Only 2 of 50 US state flags feature bears: California and Missouri."
      - "Four bear depictions appear across the two flags: one on California and three inside Missouri's seal."
      - "All four figures use grizzly imagery, the only bear type represented on a current US state flag."
      - "The California grizzly became extinct by the 1920s."
      - "Missouri adopted its three-bear seal in 1822 and its flag in 1913."
      - "The original Bear Flag of 1846 was lost in the 1906 San Francisco earthquake and fire."


faq:
  - question: "Which US state flags have a bear on them?"
    answer: "Exactly two: California and Missouri. California makes one California grizzly the dominant image. Missouri places three grizzlies inside its central coat of arms: two supporters beside the shield and one bear on the shield."

  - question: "Why are there bears on the Missouri flag?"
    answer: "Missouri's bears trace to the coat of arms on its 1822 state seal. Two grizzly supporters represent state strength and citizen bravery, while a third appears on the Missouri half of the shield. The flag places those arms at its center."

  - question: "What is the meaning of the bear on the California flag?"
    answer: "California's official account identifies the grizzly as a symbol of great strength. The design descends from the flag raised during the Bear Flag Revolt in June 1846 and was standardized by the legislature in 1953."

  - question: "What bear is on the California flag?"
    answer: "The California state flag shows a California grizzly bear (*Ursus arctos californicus*). The current standardized drawing was inspired by a nineteenth-century grizzly painting by California artist Charles Nahl."

  - question: "When was the California Bear Flag adopted?"
    answer: "The California Bear Flag was officially adopted as the state flag on February 3, 1911. The design traces back to the original Bear Flag raised during the Bear Flag Revolt of June 14, 1846. The flag was standardized with exact specifications in 1953."

  - question: "How many bears are on the Missouri state flag?"
    answer: "Three grizzly bears appear inside Missouri's central coat of arms. Two stand upright as supporters beside the shield, while one walks across the Missouri half of the shield above a silver crescent."
