page:
  h1: "Which US State Flags Have Bears on Them?"
  intro_title: "Complete List of the 2 State Flags With Bears"

  quick_answer:
    - "Exactly two US state flags feature bears: California and Missouri, with four bear depictions between them."
    - "California's flag shows one now-extinct California grizzly bear (*Ursus arctos californicus*) as its dominant central symbol."
    - "Missouri's flag contains three grizzly bears inside the coat of arms drawn from its state seal: two supporters and one bear on the shield."

  methodology: "A flag qualifies when a recognizable bear appears anywhere in its current official design, including inside a seal or coat of arms. Counts use current state law and official state symbol references."
