sections:
  - id: two-flags-visual
    icon: "fa-solid fa-flag"
    style: compare-cards
    title: "The Two Designs People Compare"
    subsections:
      - subtitle: "Old Glory - the official Stars and Stripes"
        text: "**13 horizontal stripes**, alternating red and white, with a blue canton in the upper-left corner containing 50 white stars. This is the flag defined by Title 4, U.S. Code. 'Old Glory' is the historic nickname of the standard U.S. flag - not of the vertical-striped variant."
      - subtitle: "The so-called U.S. Civil Peacetime Flag"
        text: "It keeps the same canton, colors, and 50-star field, but turns the **13 stripes vertical** instead of horizontal. That visual similarity is exactly why people confuse it with a real alternate U.S. flag. No federal statute, executive order, or official government document gives this design any standing as a national flag."

  - id: why-people-think-there-are-two-flags
    icon: "fa-solid fa-circle-question"
    title: "Why People Think There Are Two American Flags"
    subsections:
      - subtitle: "The designs look intentionally related"
        text: "The vertical-striped design keeps the same red, white, and blue palette, the same star field, and the same canton placement. That makes it look like an alternate U.S. flag even though no federal source recognizes it."
      - subtitle: "The name 'Old Glory' gets reused incorrectly"
        text: "Posts about a hidden U.S. peace flag often relabel the vertical-striped version as 'Old Glory' or the 'civil peacetime flag.' Historically, Old Glory refers to the standard Stars and Stripes, a nickname tied to sea captain William Driver's flag in the 1830s."
      - subtitle: "People import foreign flag categories into U.S. law"
        text: "Some countries really do distinguish civil flags, state flags, and war flags in law. That makes the claim sound plausible. In the United States, though, those foreign flag systems do not create a second official national flag."

  - id: flag-code
    icon: "fa-solid fa-book"
    title: "What the U.S. Flag Code Actually Says"
    snippet_paragraph: "The U.S. Flag Code — Title 4 of the United States Code, codified by Congress in 1942 — defines one national flag: 13 horizontal stripes and 50 white stars on a blue canton. It does not recognize a separate peace flag, civil flag, or wartime variant. The word 'peace' does not appear in the context of an alternate design."
    paragraphs:
      - "Three provisions are directly relevant to the peace flag question."
      - "**One flag is described.** The code defines the design — stripes and stars — and governs how it should be displayed. No alternate design for peacetime or civilian use appears anywhere in the text."
      - "**The inverted flag means distress, not peace.** Section 8(a) is explicit: *'The flag should never be displayed with the union down, except as a signal of dire distress in instances of extreme danger to life or property.'* An upside-down American flag is an emergency signal. It is not a peace variant, a protest symbol with separate legal meaning, or a different flag."
      - "**The only congressionally authorized secondary flag is the POW/MIA flag.** A 1998 amendment (36 U.S.C. § 902) designates the POW/MIA flag as the only flag — other than the national flag — that Congress has authorized to fly over federal buildings. No peace flag, civil flag, or alternative national design holds that status."
      - "One point that often gets misread: the Flag Code carries no criminal penalties for civilians. That does not make its definitions advisory. They are the authoritative federal statement on what the U.S. flag is. The absence of penalties describes who can enforce the code — not whether the definitions are binding."

  - id: myth-origins
    icon: "fa-solid fa-magnifying-glass"
    title: "Where the 'Peace Flag vs. War Flag' Idea Comes From"
    paragraphs:
      - "The peace flag vs. war flag claim travels in several forms. They share an ideological origin but have different historical pretexts."
    subsections:
      - subtitle: "The sovereign citizen version"
        text: "The most widely circulated version comes from **sovereign citizen ideology**. It claims gold-fringed courtroom flags signal martial law and that the vertical-striped design is the suppressed civilian flag. Federal courts have rejected arguments built on this framework as frivolous. Gold fringe is decorative; it does not change jurisdiction, law, or the status of a proceeding."
      - subtitle: "The 19th-century customs flag claim"
        text: "A more historical-sounding version cites early U.S. customs houses and revenue practices. Some writers claim port officials used a vertical-striped customs flag to signal civilian authority. The primary record does not establish a nationally authorized vertical-stripe flag. No federal statute, Treasury order, or verified contemporary illustration gives that design official national status."
      - subtitle: "Confusion with other countries' legal systems"
        text: "Some countries legally distinguish **civil flags** from **war flags**. Germany and the UK both have documented systems like that. The United States does not. It has military branch flags, state flags, a presidential flag, and maritime ensigns, but they supplement one national flag rather than replace it."

  - id: is-the-us-flag-a-war-flag
    icon: "fa-solid fa-flag"
    title: "Is the Standard American Flag a 'War Flag'?"
    paragraphs:
      - "The Stars and Stripes flies over post offices, public schools, and private homes. It is the same flag whether it's at a Fourth of July parade or on a military base. The claim that it is exclusively a war emblem requires ignoring the entire civilian history of the object to sustain an argument with no legal foundation."
      - "The horizontal stripe design is not a military designation. The Flag Code specifies horizontal stripes because that is how the flag has always been described in law — not as a coded signal of war power. No federal document, military regulation, or executive order restricts the Stars and Stripes to military use or defines stripe orientation as carrying legal meaning."

  - id: what-is-the-peace-flag
    icon: "fa-solid fa-dove"
    title: "What Is the So-Called U.S. Peace Flag?"
    paragraphs:
      - "There is no single agreed-upon design. The term 'U.S. peace flag' gets applied to several different things, which are worth separating."
      - "**The vertical-stripe variant.** The most common design mirrors the Stars and Stripes but turns the stripes vertical. Sovereign citizen writers often call it the 'civil flag' or 'Old Glory.' That name is historically wrong: Old Glory refers to the standard horizontal-stripe flag associated with sea captain William Driver in the 1830s. The vertical variant has no legal definition or official status."
      - "**The customs-house claim.** Some writers describe an older 'civil flag' used at American ports in the early 19th century to signal civilian revenue authority. The historical documentation is sparse and unverified at the national level. If any variant was flown at some customs offices, it was a local administrative practice — not a congressionally authorized national flag design."
      - "**Modern expressive designs.** Artists and activists have created American flag variants that substitute peace symbols for stars or alter the color scheme. These are expressive works. Their creators do not claim federal status for them, and they are clearly understood as commentary rather than competing national symbols."

  - id: flag-status-reference
    icon: "fa-solid fa-list-check"
    title: "Five Flags That Come Up in This Debate"
    subsections:
      - subtitle: "Stars and Stripes"
        text: "The official national flag. Defined by Title 4, U.S. Code. Used in all contexts — civilian, military, ceremonial. Not restricted to wartime use."
      - subtitle: "So-called civil peace flag (vertical stripes)"
        text: "Not official. No legal authority, no federal statute, no executive order. Promoted primarily by sovereign citizen networks. NAVA does not recognize it as an official U.S. flag design."
      - subtitle: "Upside-down U.S. flag"
        text: "Not a separate flag. A distress signal under Flag Code §8(a) — signals danger to life or property, not peace or protest."
      - subtitle: "Gold-fringed flag"
        text: "A decorative military convention dating to 19th-century army field use. Not a legally distinct flag. Courts have dismissed all legal arguments about fringe significance as frivolous."
      - subtitle: "POW/MIA flag"
        text: "The only non-national flag Congress has authorized to fly over federal buildings (36 U.S.C. § 902). Not a peace-flag alternative — a specific congressional designation for a specific purpose."



faq:
  - question: "Does the U.S. have a peace flag?"
    answer: "No. The U.S. Flag Code — Title 4 of the United States Code — defines one national flag: 13 horizontal stripes and 50 stars on a blue canton. No separate peace flag, civil flag, or peacetime variant is recognized in federal law, any executive order, or any official government document."

  - question: "Is the American flag a war flag?"
    answer: "No. The Stars and Stripes is the national flag for all contexts — civilian and military. It flies over post offices, schools, and private homes. The claim that horizontal stripes make it a 'war flag' has no basis in the U.S. Flag Code or any federal statute. The claim originates primarily in sovereign citizen ideology."

  - question: "Was there ever a real U.S. civil or customs flag in the 19th century?"
    answer: "The evidence is sparse and unverified. Some writers cite a supposed 1799 customs flag or early port practices where variant pennants may have been used locally. No federal statute, Treasury Department order, or verified contemporary record documents a nationally authorized vertical-stripe civil flag as an official alternative to the Stars and Stripes."

  - question: "Why do some people say there are two American flags?"
    answer: "The claim originates mainly in sovereign citizen movements, which argue the gold-fringed courtroom flag signals admiralty jurisdiction and a vertical-striped 'civil flag' is the suppressed peacetime national flag. Federal courts have unanimously rejected these arguments. The claim also borrows from the genuine fact that other countries legally distinguish civil and war flag designs — a real distinction that does not apply to U.S. law."

  - question: "Is the upside-down American flag a peace symbol?"
    answer: "No. Flag Code Section 8(a) is explicit: the flag 'should never be displayed with the union down, except as a signal of dire distress in instances of extreme danger to life or property.' Protesters have used the inverted flag as an expressive act, but its legally defined meaning under the Flag Code is distress — not peace."

  - question: "What does gold fringe on the U.S. flag mean legally?"
    answer: "Nothing. Gold fringe on ceremonial flags is a decorative military convention from 19th-century army use. It does not change the flag's legal status, signal martial law, or indicate admiralty jurisdiction. Federal courts have repeatedly dismissed legal arguments based on flag fringe as frivolous."

  - question: "What is 'Old Glory' — the standard flag or the vertical variant?"
    answer: "The standard flag. 'Old Glory' traces to a specific flag owned by sea captain William Driver of Salem, Massachusetts, who gave it that name around 1831. It has referred to the horizontal-stripe Stars and Stripes ever since. Applying the name to the vertical-stripe civil flag variant is a modern misattribution."

  - question: "What is the only flag Congress has authorized to fly over federal buildings alongside the U.S. flag?"
    answer: "The POW/MIA flag. A 1998 amendment (36 U.S.C. § 902) is the only congressional designation of this kind. No peace flag, civil flag, or alternative national design holds that status."
