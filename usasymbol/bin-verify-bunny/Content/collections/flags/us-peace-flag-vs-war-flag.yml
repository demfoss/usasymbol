timeline:
  - year: "1777"
    description: "The Continental Congress passes the Flag Resolution of June 14, 1777: 'thirteen stripes, alternate red and white' and 'thirteen stars, white in a blue field.' One design, no civilian or military variants defined."
  - year: "1818"
    description: "Congress legislates that the flag will have 13 permanent stripes for the original colonies and one star per state going forward. The law specifies one national flag — no civil or military alternative."
  - year: "1912"
    description: "President Taft's executive order standardizes the proportions and star arrangement for the first time. One uniform design is specified. No alternate peace or civil design is referenced."
  - year: "1942"
    description: "Congress codifies the U.S. Flag Code as Title 4, U.S. Code. One flag is defined. Section 8(a) explicitly designates the inverted flag as a distress signal — not a peace symbol or alternate variant."
  - year: "1998"
    description: "A federal amendment (36 U.S.C. § 902) establishes the POW/MIA flag as the only non-national flag authorized by Congress to fly over federal buildings. No peace flag, civil flag, or alternate design is granted equivalent status."
  - year: "2000s–present"
    description: "Sovereign citizen networks and related online communities popularize the claim that a vertical-striped 'civil peace flag' is the true American peacetime flag. No federal law, vexillological authority, or mainstream historical source supports this claim."

