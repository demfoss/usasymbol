faq:
  - question: "Which US state flags have stars on them?"
    answer: "Multiple US state flags feature stars prominently: Alaska (8 stars — Big Dipper + North Star), Texas (1 Lone Star), Tennessee (3 stars for 3 regions), Indiana (19 stars for 19th state), Arizona (copper star + 13 rays), Ohio (17 stars in triangular section), North Carolina (1 star with dates), and Arkansas (25 border stars + 4 inside the diamond)."

  - question: "Which state flag has the most stars?"
    answer: "Arkansas has the most stars of any US state flag — 29 total: 25 blue stars bordering the white diamond and 4 blue stars inside it. The 25 border stars represent Arkansas as the 25th state admitted to the Union."

  - question: "Which state flag is made entirely of stars?"
    answer: "Alaska's state flag is the closest to a purely stellar design: 8 gold stars on a dark blue field. Seven form the Big Dipper (Ursa Major) and one represents Polaris, the North Star. There are no other design elements — no seal, coat of arms, or letters."

  - question: "What does the star on the Texas flag represent?"
    answer: "Texas's single five-pointed white star, known as the Lone Star, represents unity — specifically, the unity of all Texans regardless of origin. It gave Texas its nickname 'The Lone Star State.' The star has been central to Texas flag designs since the Republic of Texas era in 1836, nine years before statehood."

  - question: "Why does Alaska have a Big Dipper on its flag?"
    answer: "Alaska's Big Dipper represents Ursa Major (the Great Bear) — a symbol of strength. The North Star above it represents Alaska's position as the most northern US state and its status as a 'fixed star' or stable future. The design was created by 13-year-old Benny Benson in 1927 and selected in a territorial contest."

  - question: "What do the 3 stars on the Tennessee flag mean?"
    answer: "Tennessee's three stars represent the state's three geographic and cultural grand divisions: East Tennessee (the Appalachian Mountains region), Middle Tennessee (the central basin including Nashville), and West Tennessee (the flat western lowlands near the Mississippi River). The star design was adopted in 1905."
