sections:
  - id: stars-overview
    icon: "fa-solid fa-star"
    title: "State Flags With Stars List"
    highlights:
      - name: "Alaska — 8 Stars: The Big Dipper and Polaris"
        image: "/images/flags/alaska/flag.webp"
        description: "**What they represent:** Seven stars form the Big Dipper (Ursa Major, symbolizing strength); one larger star set apart represents Polaris, the North Star — Alaska's position as the northernmost US state and its stable future. Designed by 13-year-old Benny Benson in 1927. The only US state flag built entirely around stars, with no seal, no text, no other element."
      - name: "Texas — 1 Lone Star"
        image: "/images/flags/texas/flag.webp"
        description: "**What it represents:** Unity and sovereignty — one star standing for all Texans, separate from the rest. The Lone Star appeared on Republic of Texas flags from 1836, nine years before statehood, giving Texas its nickname. NAVA ranks it among the top five best-designed US state flags."
      - name: "Tennessee — 3 Stars for 3 Regions"
        image: "/images/flags/tennessee/flag.webp"
        description: "**What they represent:** Tennessee's three grand divisions — East Tennessee (the Appalachian Mountains), Middle Tennessee (the central basin and Nashville), and West Tennessee (the flat western lowlands near the Mississippi). Enclosed in a blue circle on crimson, adopted 1905."
      - name: "Indiana — 19 Stars Telling a Story"
        image: "/images/flags/indiana/flag.webp"
        description: "**What they represent:** A numbered narrative: 13 outer stars = the original colonies; 5 inner stars = the next five states admitted; 1 large star above the torch = Indiana as the 19th state. Designer Paul Hadley won a 1916 competition with this layered design. Adopted 1917."
      - name: "Ohio — 17 Stars on the Only Non-Rectangular Flag"
        image: "/images/flags/ohio/flag.webp"
        description: "**What they represent:** Ohio as the 17th state admitted to the Union. Ohio's swallowtail burgee (pennant-shaped, not rectangular) places 17 stars in the triangular blue section plus one large center star. The only non-rectangular US state flag, unchanged since 1902."
      - name: "Arizona — Copper Star + 13 Rays"
        image: "/images/flags/arizona/flag.webp"
        description: "**What they represent:** The 13 rays reference the original colonies; the copper star at center references Arizona's copper mining industry. The rays also read as a desert sunburst. Colonel Harris designed the flag in 1910; the legislature adopted it in 1917."
      - name: "Arkansas — 29 Stars (Most of Any US State Flag)"
        image: "/images/flags/arkansas/flag.webp"
        description: "**What they represent:** 25 border stars on the diamond = Arkansas as the 25th state; 3 lower inner stars = sovereignty under France, Spain, and the US; 1 upper inner star = Arkansas's period in the Confederacy (added 1923). 29 stars total — more than any other US state flag."
      - name: "North Carolina — 1 Dated Star"
        image: "/images/flags/north-carolina/flag.webp"
        description: "**What it represents:** North Carolina's identity and two key dates: May 20, 1775 (Mecklenburg Declaration of Independence) and April 12, 1776 (Halifax Resolves — the first official American call for independence). The star is flanked by 'N' and 'C', functioning as a historical certificate in flag form."

  - id: pure-star-flags
    icon: "fa-solid fa-star"
    title: "Alaska and Texas Star Flags"
    paragraphs:
      - "Alaska's flag is the most purely stellar design in American vexillology. A 13-year-old orphan named Benny Benson submitted the design in a 1927 territorial contest: 8 gold stars on a dark blue field. Seven form the Big Dipper (Ursa Major), and the eighth — larger and set apart — represents Polaris, the North Star. The simplicity was deliberate: every element means exactly what it looks like."
      - "Texas's flag uses a single large star — the Lone Star — on a vertical blue stripe beside red and white horizontal bands. The design has roots in the Republic of Texas era (1836) and carries the state's signature identity. Texas has been called the Lone Star State since before it joined the United States."
      - "Benny Benson's winning entry came with a written explanation: the blue represented Alaska's sky and the forget-me-not (Alaska's state flower); the gold stars represented wealth; the North Star represented Alaska's future as a northern frontier. The design was formally adopted as the territorial flag in 1927 and became the state flag when Alaska joined the Union in 1959."

  - id: stars-with-meaning
    icon: "fa-solid fa-hashtag"
    title: "Indiana Ohio and Tennessee Star Counts"
    paragraphs:
      - "Indiana's flag uses 19 stars arranged in two rings around a central torch, with a larger gold star above. The 13 outer stars represent the original colonies; the inner ring of 5 represents the next five states admitted; the large star above the torch represents Indiana as the 19th state. Designer Paul Hadley won a 1916 Indiana Daughters of the American Revolution competition with this design."
      - "Ohio's swallowtail pennant (the only non-rectangular US state flag) uses a blue triangular wedge with a large 'O' formed by a circle of stars around a red disc. The 17 stars in the triangular section and the large center star represent Ohio as the 17th state. Ohio adopted this design in 1902 and has never changed it."
      - "Tennessee's three stars represent the state's three grand divisions — East Tennessee (mountains), Middle Tennessee (the plateau and Nashville basin), and West Tennessee (the western lowlands and Mississippi Delta edge). The stars are enclosed in a white circle on a blue medallion centered on the crimson field."

  - id: arizona-arkansas-nc
    icon: "fa-solid fa-map"
    title: "Arizona Arkansas and North Carolina Star Flags"
    paragraphs:
      - "Arizona's flag features a copper five-pointed star at the center, surrounded by 13 alternating red and gold rays. The star represents copper mining — Arizona produces more copper than any other US state — while the rays echo the setting sun and represent the 13 original colonies. The flag was adopted in 1917."
      - "Arkansas's flag carries the most stars of any US flag: 25 blue stars border the white diamond (representing Arkansas as the 25th state), and 4 blue stars appear inside the diamond — 3 below the state name and 1 above. The arrangement was amended in 1923 to add the upper star, representing the Confederacy."
      - "North Carolina's flag shows a single star with the letters 'N' and 'C' and two dates: May 20, 1775 (the Mecklenburg Declaration of Independence) and April 12, 1776 (the Halifax Resolves, the first official American action calling for independence). The star frames the dates like a historical certificate."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Star Flag Facts"
    facts:
      - "Alaska's flag was designed by a 13-year-old — the youngest designer of any US state flag"
      - "Ohio is the only US state with a non-rectangular flag — its swallowtail pennant has been unchanged since 1902"
      - "Texas's Lone Star appeared on the Republic of Texas flag in 1836, 9 years before statehood"
      - "Indiana's 19 stars are arranged to tell a story: 13 colonies, then 5 more states, then Indiana as the 19th"
      - "Arizona's flag was designed by a US Army officer — Colonel Charles Harris — for the 1910 National Rifle Championship"
      - "Alaska's blue background exactly matches the color of the Alaska state flower, the forget-me-not"
      - "Arkansas has carried more stars than any other state flag: 29 total (25 on the diamond border + 4 inside)"
      - "Tennessee's 3-star design replaced a flag that had the state seal and was considered too complex to be recognizable"

