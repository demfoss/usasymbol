sections:
  - id: "state-flags-with-visible-words"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "State Flags With Visible Words"
    paragraphs:
      - "Thirty-seven designs qualify under the broad count, but lettering appears at very different scales. These examples show the four main uses: identifying a state, stating a motto, recording a date, or labeling elements inside an official emblem."
    highlights:
      - name: "California"
        image: "/images/flags/california/flag.webp"
        description: "**Category:** State name and other wording. CALIFORNIA REPUBLIC runs across the open white field beneath the grizzly bear. Large freestanding letters make California the clearest example of a state flag identified by a full phrase."
        anchor_phrases:
          - "state flag identified by a full phrase"
      - name: "Arkansas"
        image: "/images/flags/arkansas/flag.webp"
        description: "**Category:** State name. ARKANSAS sits between four blue stars inside the central white diamond. The single word belongs in the list because it is a main design element, not fine print inside a seal."
      - name: "Mississippi"
        image: "/images/flags/mississippi/flag.webp"
        description: "**Category:** Motto. IN GOD WE TRUST curves beneath the magnolia blossom on the flag approved by voters in 2020 and made official in 2021. Mississippi belongs here even though its name does not appear."
      - name: "Delaware"
        image: "/images/flags/delaware/flag.webp"
        description: "**Category:** Motto and date. LIBERTY AND INDEPENDENCE appears on the coat of arms, while DECEMBER 7, 1787 sits below the diamond. The date records Delaware's ratification of the U.S. Constitution."
      - name: "Iowa"
        image: "/images/flags/iowa/flag.webp"
        description: "**Category:** State name and motto. OUR LIBERTIES WE PRIZE AND OUR RIGHTS WE WILL MAINTAIN fills the ribbon carried by the eagle, while IOWA appears below in large red letters. Both inscriptions are primary parts of the design."
      - name: "Michigan"
        image: "/images/flags/michigan/flag.webp"
        description: "**Category:** Mottos. E PLURIBUS UNUM, TUEBOR, and SI QUAERIS PENINSULAM AMOENAM CIRCUMSPICE appear on three separate scrolls. Michigan shows how one coat of arms can put multiple Latin inscriptions on a flag without printing the state's name."
      - name: "North Carolina"
        image: "/images/flags/north-carolina/flag.webp"
        description: "**Category:** State initials and dates. N and C flank the star, while MAY 20TH 1775 and APRIL 12TH 1776 occupy two gold ribbons. North Carolina is the only current design that pairs state initials with two full month-day-year inscriptions."
      - name: "Oregon"
        image: "/images/flags/oregon/flag.webp"
        description: "**Category:** State name and date. STATE OF OREGON and 1859 appear on the obverse above and below the shield. Oregon also has a text-free beaver reverse, making it the only state flag with different designs on its two sides."
      - name: "Rhode Island"
        image: "/images/flags/rhode-island/flag.webp"
        description: "**Category:** Motto. HOPE appears in gold on a blue ribbon beneath the anchor. One short word gives Rhode Island the most compact freestanding motto inscription among current state flags."
      - name: "South Dakota"
        image: "/images/flags/south-dakota/flag.webp"
        description: "**Category:** State name, motto, date, and other wording. SOUTH DAKOTA and THE MOUNT RUSHMORE STATE circle the seal, which adds UNDER GOD THE PEOPLE RULE and 1889. Multiple layers of lettering place the flag in every category used by this guide."
      - name: "Virginia"
        image: "/images/flags/virginia/flag.webp"
        description: "**Category:** State name and motto. VIRGINIA arches over Virtus, and SIC SEMPER TYRANNIS curves below the defeated figure of Tyranny. Both inscriptions are integrated directly into the circular emblem."
      - name: "Wisconsin"
        image: "/images/flags/wisconsin/flag.webp"
        description: "**Category:** State name, motto, and date. WISCONSIN was added above the coat of arms and 1848 below it in 1979, while FORWARD remains inside the crest. Large identification text distinguishes the flag from similar blue-field designs."

  - id: "four-types-of-flag-text"
    icon: "fa-solid fa-list-check"
    title: "State Names, Mottos, Dates, and Other Wording"
    paragraphs:
      - "State-name lettering ranges from a single large word, such as ARKANSAS or OKLAHOMA, to formal seal borders such as THE SEAL OF THE STATE OF WASHINGTON. North Carolina uses the initials N and C rather than spelling out its name."
      - "Mottos form the largest overlapping category. Some are English, including Rhode Island's HOPE, while others are Latin, such as Virginia's SIC SEMPER TYRANNIS, or Spanish, such as Montana's ORO Y PLATA. Dates usually mark statehood, constitutional ratification, or a seal's adoption history."
      - "Other wording covers labels and historical phrases that are not the state name or official motto. Examples include California's REPUBLIC, Nevada's BATTLE BORN, Georgia's CONSTITUTION, and Wyoming's economic labels LIVESTOCK, GRAIN, MINES, and OIL."

  - id: "state-flags-without-text"
    icon: "fa-solid fa-eye-slash"
    title: "State Flags Without Words or Text"
    paragraphs:
      - "Thirteen primary state flags contain no words, letters, or dates: Alabama, Alaska, Arizona, Colorado, Hawaii, Maryland, Minnesota, New Mexico, Ohio, South Carolina, Tennessee, Texas, and Utah. Their designs rely on geometric forms, stars, stripes, heraldry, plants, or other symbols."
      - "Minnesota and Utah joined this group in 2024 after replacing seal-based primary flags. Minnesota's new flag took effect on May 11, while Utah's Beehive Flag took effect on March 9. Utah law also preserves the lettered former design as the historic state flag."

  - id: "state-flag-lettering-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About Text on State Flags"
    facts:
      - "37 current primary state flags contain a word, initial, Roman numeral, or Arabic-number date."
      - "13 primary state flags contain no text at all, including the 2024 Minnesota and Utah designs."
      - "North Carolina uses two state initials and two complete dates rather than spelling out its name."
      - "Oregon's lettered obverse and text-free beaver reverse make it the only two-sided state flag."
      - "New York added E PLURIBUS UNUM to its coat of arms and flag artwork in 2020 while retaining EXCELSIOR."
      - "Mississippi's 2021 flag contains the national motto but does not print the state's name."
      - "Utah's historic state flag retains UTAH, INDUSTRY, 1847, and 1896, although its primary Beehive Flag has no lettering."

faq:
  - question: "How many U.S. state flags have words on them?"
    answer: "Thirty-seven current primary state flags contain text when words, initials, and dates inside seals or coats of arms are included. Thirteen contain no lettering."
  - question: "Which state flags have the state name written on them?"
    answer: "Arkansas, California, Florida, Idaho, Illinois, Indiana, Iowa, Kansas, Kentucky, Maine, Montana, Nebraska, Nevada, New Hampshire, North Dakota, Oklahoma, Oregon, South Dakota, Vermont, Virginia, Washington, West Virginia, Wisconsin, and Wyoming spell out the state name within the design. North Carolina uses N and C as initials."
  - question: "Which state flags have dates on them?"
    answer: "Delaware, Illinois, Missouri, Nebraska, New Hampshire, New Jersey, North Carolina, Oregon, South Dakota, Washington, West Virginia, Wisconsin, and Wyoming show at least one date in Arabic or Roman numerals. North Carolina and Delaware print full month-day-year dates."
  - question: "Which state flags have no words or lettering?"
    answer: "Alabama, Alaska, Arizona, Colorado, Hawaii, Maryland, Minnesota, New Mexico, Ohio, South Carolina, Tennessee, Texas, and Utah have no text on their current primary flags."
  - question: "Does the new Minnesota state flag have words on it?"
    answer: "No. Minnesota's flag adopted on May 11, 2024 uses a white eight-pointed North Star, a dark blue hoist shape, and a light blue field without words, dates, or a seal."
  - question: "Does the new Utah state flag have words on it?"
    answer: "Utah's primary Beehive Flag, effective March 9, 2024, has no words or dates. The former seal-on-blue design remains designated as the historic state flag and still shows UTAH, INDUSTRY, 1847, and 1896."

