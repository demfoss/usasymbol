page:
  h1: "Which State Flags Have Words or Text on Them?"
  intro_title: "Every Word, Motto, and Date on the 50 State Flags"

  quick_answer:
    - "Thirty-seven current U.S. state flags contain words, initials, or dates. Thirteen use symbols and colors without any lettering."
    - "Arkansas, California, Indiana, Oklahoma, and several seal-based flags identify the state in text. Mississippi instead places the national motto IN GOD WE TRUST beneath its magnolia."
    - "Minnesota and Utah removed all lettering when their new primary flags took effect in 2024. Utah's separate historic state flag still contains UTAH, INDUSTRY, 1847, and 1896."

  methodology: "The count covers the primary official flag currently used for each of the 50 states as of August 2026. Any letters, words, Roman numerals, or Arabic-number dates in the official artwork count, including inscriptions inside a seal or coat of arms; purely symbolic designs do not."
