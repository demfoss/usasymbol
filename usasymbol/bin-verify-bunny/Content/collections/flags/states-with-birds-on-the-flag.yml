page:
  h1: "Which US State Flags Have Birds on Them?"
  intro_title: "Complete List of 10 State Flags With Birds"

  quick_answer:
    - "Exactly 10 US state flags feature birds: Illinois, Iowa, Louisiana, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming."
    - "Nine of the ten feature the bald eagle. Louisiana is the only state with a different bird: the brown pelican."
    - "Oregon's eagle appears only on the front of its two-sided flag. The reverse shows a beaver without an eagle."

  methodology: "The list includes a current flag when a bird is visible anywhere in its official design, including within a seal or coat of arms. State specifications and government flag references were prioritized."
  sources:
    - name: "Congressional Research Service, The Great Seal of the United States"
      url: "https://crsreports.congress.gov/product/pdf/RL/98-4"
    - name: "North American Vexillological Association (NAVA)"
      url: "https://nava.org/"
    - name: "Louisiana Secretary of State, State Flag and Seal"
      url: "https://www.sos.la.gov/archives/state-flag-and-seal"
    - name: "Oregon Blue Book, State Flag"
      url: "https://sos.oregon.gov/blue-book/Pages/state/symbols/flag.aspx"
