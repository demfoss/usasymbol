sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "State Flags With Birds List"
    paragraphs:
      - "Bird imagery clusters around state seals: Louisiana uses a pelican as the main emblem, while most eagle states inherit the bird through a seal or coat of arms."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "All State Flags With Birds"
    paragraphs:
      - "Louisiana is the outlier by species and placement: its brown pelican sits at the center of the flag, while most eagles are embedded in seals or crests."

  - id: louisiana-pelican-flag
    icon: "fa-solid fa-dove"
    title: "Louisiana Pelican Flag"
    paragraphs:
      - "Louisiana is the only US state whose flag features a bird other than the bald eagle. That bird is the **brown pelican** (*Pelecanus occidentalis*), rendered in the heraldic pose known as **'pelican in her piety'**: the mother pelican stands in her nest, wings spread, wounding her own breast to feed three chicks below her with her blood. The three drops falling from her breast appear explicitly on the flag."
      - "European heraldry used the pelican-in-her-piety as a symbol of self-sacrifice, parental devotion, and Christian charity. Louisiana carried the pelican emblem from its seal to the state flag, which the legislature adopted in 1912."
    subsections:
      - subtitle: "History of the Louisiana State Flag"
        text: "Louisiana's first American territorial seal used the pelican emblem. The legislature adopted the [pelican in her piety flag](/states/louisiana/flag/louisiana-state-flag) in 1912, and updated official artwork introduced in 2010 standardized details such as the three blood drops."

  - id: eagle-flags-group-1
    icon: "fa-solid fa-feather"
    title: "State Flags With Bald Eagles"
    paragraphs:
      - "Nine US state flags feature the **bald eagle** (*Haliaeetus leucocephalus*). Most arrived at the eagle through a state seal or coat of arms drawn from the **Great Seal of the United States**; Iowa is the main layout exception, with the eagle flying across a tricolor. For each eagle flag in detail, see [US state flags with eagles](/collections/flags/state-flags-with-eagles)."
    subsections:
      - subtitle: "Illinois"
        text: "The **Illinois state flag** places the **state seal** on a white background, with the bald eagle perched on a boulder at center. Its wings are raised, and the bird holds a **shield** bearing thirteen stars and stripes plus a ribbon reading *State Sovereignty, National Union*. The word 'ILLINOIS' was added in 1970 after a Vietnam War-era request. See the [Illinois bald eagle flag history](/states/illinois/flag/illinois-state-flag) for the design story."
      - subtitle: "Iowa"
        text: "The **Iowa state flag** is a vertical **tricolor** of blue, white, and red. On the white center stripe, a **bald eagle** soars with wings spread, carrying a blue ribbon in its beak with the state motto: *Our Liberties We Prize and Our Rights We Will Maintain*. Iowa is the only eagle-flag state where the bird flies freely on the flag rather than within a **state seal** or **coat of arms**. See the [Iowa tricolor eagle flag](/states/iowa/flag/iowa-state-flag) for the full design history."
      - subtitle: "Michigan"
        text: "Michigan's flag displays the **state coat of arms** on a dark blue field, with the bald eagle as the **crest** at the apex. Its spread wings, **olive branch**, and **bundle of arrows** mirror the Great Seal. The central shield shows a man on a peninsula, flanked by an elk and a moose as shield-holders. Michigan is the only US state flag with three distinct animals: eagle, elk, and moose. See the [Michigan state flag](/states/michigan/flag/michigan-state-flag)."

  - id: eagle-flags-group-2
    icon: "fa-solid fa-shield"
    title: "New York North Dakota and Pennsylvania Bird Flags"
    paragraphs:
      - "New York and Pennsylvania use the eagle as a crest above a coat of arms; North Dakota makes the eagle the dominant element of the entire flag."
    subsections:
      - subtitle: "New York"
        text: "New York's flag centers the **state coat of arms** on a deep blue field. The bald eagle forms the **crest**, perched with spread wings atop a globe representing the Western Hemisphere. The coat of arms dates to 1778, making New York's eagle one of the oldest in continuous American state heraldry. Full design history appears on the [New York state flag with eagle crest](/states/new-york/flag/new-york-state-flag)."
      - subtitle: "North Dakota"
        text: "North Dakota's flag gives the **bald eagle** most of the field, following the regimental colors of the First North Dakota Infantry from the Spanish-American War. The eagle holds an **olive branch and arrows**, carries a **shield** of thirteen stripes, and grips a ribbon reading **'E Pluribus Unum'**. The [North Dakota Great Seal eagle flag](/states/north-dakota/flag/north-dakota-state-flag) closely follows the national emblem."
      - subtitle: "Pennsylvania"
        text: "Pennsylvania's flag displays the **state coat of arms** on a deep blue field, with the bald eagle as the **crest** above two horses that act as shield-holders. The coat of arms dates to 1778, and the flag was formally adopted in 1907. Pennsylvania's eagle crest follows founding-era heraldic conventions also seen in the Great Seal. See the [Pennsylvania state flag and coat of arms](/states/pennsylvania/flag/pennsylvania-state-flag)."

  - id: eagle-flags-utah-oregon
    icon: "fa-solid fa-arrows-rotate"
    title: "Oregon Missouri and Wyoming Bird Flags"
    paragraphs:
      - "Oregon, Missouri, and Wyoming show how easy it is for an eagle to be present but visually secondary: one appears on Oregon's front-side seal, one inside Missouri's seal, and one inside the seal printed on Wyoming's bison."
    subsections:
      - subtitle: "Oregon"
        text: "Oregon's flag is the only US state flag with two completely different designs on each side. The **front** shows the state seal on a navy blue background, with a bald eagle perched at the top of the shield above mountains, ocean, and a covered wagon. The **reverse side** shows only a golden beaver. Oregon's eagle is visible on one face of the flag."
      - subtitle: "Missouri"
        text: "Missouri's flag places the state seal inside a blue ring on a red-white-blue tricolor. The seal includes the United States coat of arms, and that coat of arms contains a bald eagle with arrows and an olive branch. Missouri is better known in flag-animal lists for its grizzly bears, but the eagle is also present inside the seal."
      - subtitle: "Wyoming"
        text: "Wyoming's flag is visually a bison flag first: a large white bison carries the state seal on its body. Inside that seal is an eagle resting on a shield. The bird is nested two layers deep, with the seal inside the bison and the eagle inside the seal."

  - id: territories-bird-flags
    icon: "fa-solid fa-globe-americas"
    title: "Territory Flags With Birds"
    paragraphs:
      - "Beyond the 50 states, two US territories feature birds prominently on their official flags. Both use the bald eagle with local or territorial details."
    subsections:
      - subtitle: "American Samoa"
        text: "American Samoa's flag features a **bald eagle** in flight across a red and blue background, holding a **war club** (*uatogi*) and a **fly whisk** (*fue*) in its talons rather than the Great Seal arrows and olive branch. The flag was adopted in 1960."
      - subtitle: "US Virgin Islands"
        text: "The US Virgin Islands flag shows a simplified **US coat of arms** eagle on a white background: a golden bald eagle holding a laurel branch and three arrows, flanked by the yellow letters **'V'** and **'I'**. It was adopted in 1921, four years after the United States purchased the islands from Denmark."

  - id: why-birds-on-flags
    icon: "fa-solid fa-landmark"
    title: "Why Birds Appear on State Flags"
    paragraphs:
      - "The short answer is **state seals**. Most birds on US state flags arrived through a state seal designed before the flag itself. The bald eagle appears again and again because state seals borrowed from the **Great Seal of the United States** (1782)."
      - "Louisiana took a different path. Its early territorial government used the **pelican-in-her-piety**, and the state later carried that emblem onto the flag adopted in 1912. The pelican was not modeled on the national emblem."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Bird Flag Facts"
    facts:
      - "10 of 50 US state flags feature birds: 9 bald eagles and 1 brown pelican"
      - "Louisiana is the only state whose flag features a bird other than the bald eagle"
      - "Louisiana adopted its pelican state flag in 1912 and standardized the current official artwork in 2010"
      - "North Dakota's eagle is almost identical to the Great Seal of the United States"
      - "Oregon's eagle is visible only on the obverse (front) of its two-sided flag"
      - "Iowa's eagle is the only bird-flag eagle not enclosed within a state seal or coat of arms"
      - "The 2024 Minnesota and Utah flag redesigns removed bird imagery from their current flag designs"
      - "The bald eagle was chosen as the US national emblem in 1782 because it is native only to North America"
      - "The pelican-in-her-piety heraldic motif originates in medieval bestiaries, where the pelican was believed to feed her young with her own blood"


faq:
  - question: "How many US state flags have birds on them?"
    answer: "Exactly 10 US state flags feature birds: Illinois, Iowa, Louisiana, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Nine feature the bald eagle. Louisiana uses a brown pelican in the heraldic 'pelican in her piety' pose."

  - question: "What is the most common bird on US state flags?"
    answer: "The bald eagle is by far the most common bird on US state flags, appearing on 9 of the 10 bird-flag states: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Most appear through state seals or coats of arms rather than as standalone flag designs."

  - question: "Does the new 2024 Minnesota flag have a loon on it?"
    answer: "No. Minnesota's redesigned 2024 flag does not feature a bird. The new design centers on an eight-pointed North Star with dark and light blue fields. The common loon remains on the state seal, which is no longer displayed on the flag."

  - question: "What state flag has a pelican on it?"
    answer: "Louisiana's state flag is the only US state flag featuring a pelican. The flag shows a brown pelican (*Pelecanus occidentalis*) in the 'pelican in her piety' pose, standing in a nest and wounding her breast to feed three chicks. Louisiana adopted the flag in 1912."

  - question: "What is 'pelican in her piety' on the Louisiana flag?"
    answer: "The 'pelican in her piety' is a heraldic motif in which a mother pelican wounds her breast to feed her chicks, symbolizing self-sacrifice and parental devotion. Louisiana law requires three blood drops in the design. The flag places the pelican and three chicks above the state motto."

  - question: "What is the only US state flag with two sides?"
    answer: "Oregon is the only US state flag with different designs on each side. The front features the state seal, including a bald eagle, on a navy blue background. The reverse shows a golden beaver without an eagle."

  - question: "Which US state flags have eagles on them?"
    answer: "Nine US state flags feature a bald eagle: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Iowa places its eagle on a tricolor; most of the others inherit the eagle through a state seal or coat of arms."

  - question: "How many US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals, either as central symbols or within incorporated state seals. Birds appear on 10 flags. Other examples include California and Missouri with grizzly bears, Wyoming with a bison, Oregon with a reverse-side beaver, and Maine with a moose in its coat of arms."
