sections:
  - id: state-flag-redesign-cases
    icon: "fa-solid fa-flag"
    style: "law-cards"
    title: "Recent U.S. State Flag Redesigns"
    subsections:
      - subtitle: "Mississippi"
        text: |-
          **Outcome:** New flag adopted
          **Official since:** January 11, 2021

          Mississippi retired its 1894 flag on July 1, 2020, ending use of the last U.S. state flag to contain the Confederate battle emblem. A commission selected the New Magnolia design, voters approved it with 73% of the vote on November 3, and House Bill 1 placed it into law.

          Mississippi belongs at the start of the modern redesign story because the state addressed a disputed historical emblem through legislation, an open design process, a statewide vote, and final statutory adoption.
        anchor_phrases:
          - "New Magnolia design"

      - subtitle: "Utah"
        text: |-
          **Outcome:** New flag adopted
          **Official since:** March 9, 2024

          Utah Governor Spencer Cox signed Senate Bill 31 on March 21, 2023. The new design uses a central beehive, mountain forms, and three broad color fields, while the previous seal-based banner remains legally recognized as the historic state flag.

          Utah shows how a state can simplify its main flag without erasing the previous one. Preserving and displaying the historic flag gave the redesign process a formal bridge between the two designs.
        anchor_phrases:
          - "historic state flag"

      - subtitle: "Minnesota"
        text: |-
          **Outcome:** New flag adopted
          **Official since:** May 11, 2024

          Minnesota's 2023 commission reviewed 2,128 public flag submissions and adapted Andrew Prekker's concept. The official design places a white eight-pointed North Star on a dark blue shape beside a light blue field representing water.

          Minnesota belongs here because its commission replaced a detailed seal scene with a few state-specific elements that remain recognizable at flag scale. The result became the newest official U.S. state flag.
        anchor_phrases:
          - "North Star"
          - "newest official U.S. state flag"

      - subtitle: "Maine"
        text: |-
          **Outcome:** Proposal rejected
          **Vote date:** November 5, 2024

          Maine Question 5 asked voters whether the former Pine Tree Flag, replaced as the official flag in 1909, should return. Certified results recorded 358,912 votes in favor and 451,366 against, so the coat-of-arms design on blue stayed official.

          Maine demonstrates that historical simplicity does not guarantee adoption. A recognizable pine-and-star alternative reached a statewide ballot, but voters chose continuity with the existing flag.
        anchor_phrases:
          - "Pine Tree Flag"

      - subtitle: "Illinois"
        text: |-
          **Outcome:** No replacement enacted
          **Advisory vote:** 2025

          Illinois received 4,844 contest entries and placed 10 finalists, two commemorative flags, and the current flag before the public. The current Illinois state flag led every individual option with 165,602 votes, although all 12 alternatives together received 218,259 votes.

          Illinois belongs here because the result exposes a basic redesign problem: broad interest in change can coexist with no consensus on a replacement. The commission's final report made no recommendation to retain or replace the flag, and no replacement had been enacted by August 14, 2026.
        anchor_phrases:
          - "Illinois state flag"

      - subtitle: "Massachusetts"
        text: |-
          **Outcome:** Redesign process ongoing
          **Status checked:** August 14, 2026

          Massachusetts established an advisory commission in 2024 to recommend a new seal, flag, and motto through a statewide process. The Massachusetts state flag remains unchanged. After presenting new third-round entries on June 25, 2026, the commission posted plans to share three flag ideas for public review at hearings that fall.

          Massachusetts belongs here because it shows redesign as an active civic process, not a finished product. A final recommendation must go to the governor, followed by legislation to codify a new design.
        anchor_phrases:
          - "Massachusetts state flag"

  - id: why-states-redesign-flags
    icon: "fa-solid fa-pen-ruler"
    title: "Why States Change Their Flags"
    paragraphs:
      - "Recent redesigns usually begin with one of two problems. A flag may carry imagery that residents and officials want reconsidered, as in Mississippi and Massachusetts, or it may reproduce a detailed seal that loses clarity when flown, as the former Utah and Minnesota flags did."
      - "Public participation shapes the outcome but does not produce a predictable result. Mississippi voters ratified a commission's choice, Minnesota's commission adapted a public submission, Maine voters rejected a legislative proposal, and Illinois voters divided their support among many alternatives."
      - "Adoption rules also differ by state. Legislatures enacted the Mississippi and Utah designs, Minnesota delegated final design approval to a statutory commission, Maine required a referendum, and Massachusetts is developing recommendations that still need an adoption step."

  - id: state-flag-redesign-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "State Flag Redesign Facts"
    facts:
      - "Mississippi's redesign commission received nearly 3,000 submissions before selecting the New Magnolia flag."
      - "Utah recognizes its previous official banner in law as the historic state flag."
      - "Minnesota received 2,128 public flag submissions and adapted Andrew Prekker's concept for the final design."
      - "Maine Question 5 lost by 92,454 votes in the certified 2024 referendum results."
      - "Illinois voters cast 383,861 votes across the current flag and 12 alternatives in the 2025 advisory contest."
      - "Massachusetts advanced three flag ideas in August 2025, presented new third-round entries in June 2026, and plans public hearings for fall 2026."

faq:
  - question: "Why are states redesigning their flags?"
    answer: "States redesign flags for different reasons, including disputed historical imagery, detailed seals that are hard to distinguish at a distance, and a desire for symbols that more residents recognize. Mississippi focused on removing the Confederate battle emblem, while Utah and Minnesota replaced complex seal-based designs with simpler symbols."

  - question: "Which states recently changed their flags?"
    answer: "Mississippi adopted the New Magnolia flag in January 2021. Utah's beehive flag became official on March 9, 2024, followed by Minnesota's North Star flag on May 11, 2024."

  - question: "What is the newest U.S. state flag?"
    answer: "Minnesota has the newest official state flag. Its current design became official on May 11, 2024, about two months after Utah's new flag took effect."

  - question: "Did Maine change its state flag in 2024?"
    answer: "No. Maine voters rejected Question 5 by 451,366 votes to 358,912. The proposal would have restored the former Pine Tree Flag, so Maine continued using its coat-of-arms design on a blue field."

  - question: "Did Illinois adopt a new state flag?"
    answer: "No. The current flag finished first among 13 choices with 165,602 votes, while all alternatives together received 218,259. The commission's final report made no recommendation to retain or replace the flag, and no replacement had been enacted by August 14, 2026."

  - question: "Is Massachusetts changing its state flag?"
    answer: "Massachusetts is considering a change, but no new flag was official as of August 14, 2026. The commission plans to present three flag ideas at public hearings in fall 2026. A final choice must go to the governor, followed by legislation to codify it."

