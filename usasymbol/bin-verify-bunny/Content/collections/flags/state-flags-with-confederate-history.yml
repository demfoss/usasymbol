page:
  h1: "Which State Flags Have Confederate History?"
  intro_title: "Documented Connections, Influence, and Claims"

  quick_answer:
    - "Mississippi's retired 1894 flag and Georgia's retired 1956 flag had direct, documented Confederate battle-emblem connections. Neither is current."
    - "Georgia's current flag closely follows the Confederacy's first national Stars and Bars pattern, but it does not display the later battle flag used on Georgia's 1956 banner."
    - "Visual resemblance alone cannot prove origin. Official records call Alabama's diagonal form a Cross of St. Andrew, while Florida law describes red bars and does not assign them a Confederate meaning."

  methodology: "Claims are separated by evidence type. Verified requires an official law, archive, or authoritative state history linking the flag to a named Confederate design or adoption context. Not Verified means the proposed link lacks comparable state-specific documentation. Myth marks a claim contradicted by the historical record. Similar geometry alone is not treated as proof, and a documented connection is described without equating unlike designs or contexts."

