sections:
  - id: verified-confederate-flag-connections
    icon: "fa-solid fa-file-circle-check"
    style: "law-cards"
    title: "Verified Confederate Connections in State Flag History"
    paragraphs:
      - "Verified does not mean every entry has the same relationship. Two former flags directly displayed a Confederate battle emblem, Georgia's current layout derives from a national Confederate flag, and North Carolina's former flag was a state banner adopted during secession."
    subsections:
      - subtitle: "Mississippi's 1894 Flag"
        status: "Verified"
        text: |-
          **Connection:** Confederate battle emblem
          **Status today:** Retired

          Mississippi's 1894 flag placed the Beauregard battle flag in its canton. State archival research records that designer E. N. Scudder's daughter said he included it to honor Confederate soldiers, and the emblem remained until July 1, 2020.

          Direct imagery and documented intent make this the clearest state-flag connection. Mississippi's current New Magnolia flag does not contain the emblem, so attaching the old flag's status to the replacement would be inaccurate.
        anchor_phrases:
          - "Mississippi's 1894 flag"
          - "New Magnolia flag"
      - subtitle: "Georgia's 1956 Flag"
        status: "Verified"
        text: |-
          **Connection:** Confederate battle design
          **Status today:** Retired

          Georgia's 1956 flag placed its seal beside a Confederate battle flag covering about two-thirds of the banner. The New Georgia Encyclopedia ties adoption to resistance following Brown v. Board of Education and quotes legislative leadership invoking continued opposition.

          Georgia belongs in the direct category because both the artwork and the adoption setting are documented. The state replaced this banner in 2001, so it must not be shown as Georgia's current flag.
        anchor_phrases:
          - "Georgia's 1956 flag"
          - "Brown v. Board of Education"
      - subtitle: "Georgia's Current Flag"
        status: "Verified"
        text: |-
          **Connection:** First Confederate national pattern
          **Official since:** 2003

          Georgia's current flag uses red-white-red horizontal bars and a blue canton, the basic arrangement of the Confederate States' first national Stars and Bars. Georgia replaces the Confederate stars with its coat of arms encircled by 13 stars.

          Pattern lineage supports inclusion, but precision matters. The current banner derives from a Confederate national flag rather than the diagonal battle flag that dominated Georgia's 1956 design.
        anchor_phrases:
          - "Georgia's current flag"
          - "Stars and Bars"
      - subtitle: "North Carolina's 1861 Flag"
        status: "Verified"
        text: |-
          **Connection:** Secession-era state flag
          **Status today:** Replaced in 1885

          North Carolina's secession convention adopted a state flag on June 22, 1861. Its ribbons showed May 20, 1775 and May 20, 1861, the date of the state's secession ordinance. The 1885 law replaced the latter with April 12, 1776 and changed the layout.

          Adoption during secession makes the former flag part of Confederate-era state history, but it was not the Confederate battle flag. The current design descends from the postwar 1885 revision, not unchanged from the 1861 banner.
        anchor_phrases:
          - "North Carolina's secession convention"
          - "current design"

  - id: confederate-flag-claims-checked
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Confederate State Flag Claims Checked"
    paragraphs:
      - "Repeated online claims often turn resemblance into certainty. These cards identify what official records establish and where they stop. Not Verified does not prove an impossible connection. It means the stronger claim is not supported by the cited state-specific evidence."
    subsections:
      - subtitle: "Alabama's Current Flag"
        status: "Not Verified"
        text: |-
          **Claim:** A simplified Confederate battle flag
          **Official description:** Cross of St. Andrew

          Alabama adopted its white flag with a crimson diagonal cross in 1895. The Department of Archives and History identifies the device as a Cross of St. Andrew, while the short statute supplies no origin story or Confederate attribution.

          Similar diagonal geometry makes the claim understandable but does not verify design intent. Without direct legislative or archival evidence, presenting Confederate origin as settled fact would exceed the record.
        anchor_phrases:
          - "Alabama adopted"
          - "Cross of St. Andrew"
      - subtitle: "Florida's Current Flag"
        status: "Not Verified"
        text: |-
          **Claim:** Red bars honor the Confederacy
          **Legal wording:** Diagonal red bars

          Florida voters approved adding diagonal red bars to the white seal flag in 1900. Current law defines their size and placement but gives no symbolic explanation and does not call them a Confederate saltire.

          Timing and resemblance have produced competing interpretations, yet neither alone establishes official intent. Florida therefore belongs in the claim-check section rather than beside flags with expressly documented Confederate emblems.
        anchor_phrases:
          - "Florida voters"
          - "diagonal red bars"
      - subtitle: "The Republic of Alabama Flag"
        status: "Myth"
        text: |-
          **Claim:** Alabama adopted an official republic flag in 1861
          **Archival finding:** No official flag adopted

          Alabama's Secession Convention accepted a two-sided banner to fly above the Capitol while the convention was in session. The Alabama Department of Archives and History says later accounts incorrectly called it the Republic of Alabama flag and explicitly records that no official flag was adopted.

          A surviving historic banner is not automatically a statutory state flag. The archival provenance directly contradicts the common official-republic-flag label, making this a documented myth rather than an unresolved interpretation.
        anchor_phrases:
          - "Alabama's Secession Convention"
          - "Republic of Alabama flag"

  - id: confederate-flag-terms
    icon: "fa-solid fa-book-open"
    style: "gradient"
    title: "Confederate Flag Terms That Should Not Be Confused"
    facts:
      - "The Stars and Bars was the Confederate States' first national flag and used red-white-red horizontal bars with a blue canton."
      - "The best-known Confederate battle flag used a blue saltire with white stars on red and was not the Confederacy's first national flag."
      - "Mississippi's retired 1894 flag and Georgia's retired 1956 flag incorporated the battle design in different proportions."
      - "Georgia's current flag follows the first national pattern rather than the diagonal battle design."
      - "North Carolina's 1861 banner was a state flag adopted during secession, not a Confederate national flag."

faq:
  - question: "Do any current state flags have the Confederate battle flag?"
    answer: "No. Mississippi retired the last current state flag containing the Confederate battle emblem on July 1, 2020. Georgia had already replaced its battle-design flag in 2001."
  - question: "Is Georgia's current flag a Confederate flag?"
    answer: "Georgia's current design closely follows the Confederacy's first national Stars and Bars pattern, with red-white-red bars and a blue canton. Georgia's canton substitutes the state coat of arms surrounded by 13 stars. It is not the diagonal Confederate battle flag used on the 1956 state banner."
  - question: "Why did Georgia adopt the 1956 state flag?"
    answer: "The New Georgia Encyclopedia links its adoption to state resistance after Brown v. Board of Education. The design placed the Confederate battle flag across most of the banner and remained official until 2001."
  - question: "Is Alabama's flag based on the Confederate flag?"
    answer: "A Confederate origin is not established by the official evidence cited here. Alabama's statute and state archives identify a crimson Cross of St. Andrew on white but provide no Confederate attribution, so the stronger claim remains Not Verified."
  - question: "Is Florida's red cross Confederate?"
    answer: "Florida law calls the elements diagonal red bars and assigns no Confederate meaning. Historical timing and visual similarity fuel the claim, but authoritative state-specific documentation is insufficient to label the origin verified."
  - question: "Was there an official Republic of Alabama flag?"
    answer: "No. Alabama archives say the Secession Convention banner was accepted for use while the convention met, but no official flag for the short-lived republic was adopted."

