faq:
  - question: "Which US state flags have Latin mottos on them?"
    answer: "Nine US state flags display a Latin motto as part of the flag design: Connecticut ('Qui Transtulit Sustinet'), Idaho ('Esto Perpetua'), Maine ('Dirigo'), Massachusetts ('Ense Petit Placidam Sub Libertate Quietem'), Michigan ('Si Quaeris Peninsulam Amoenam Circumspice'), Missouri ('Salus Populi Suprema Lex Esto'), New York ('Excelsior'), North Carolina ('Esse Quam Videri'), and Virginia ('Sic Semper Tyrannis')."

  - question: "What is the most famous Latin motto on a US state flag?"
    answer: "Virginia's 'Sic Semper Tyrannis' (Thus always to tyrants) is the most widely recognized Latin motto on any US state flag. It was adopted in 1776 and became historically notorious when John Wilkes Booth reportedly shouted it after assassinating President Abraham Lincoln in 1865."

  - question: "Which state has the longest Latin motto on its flag?"
    answer: "Michigan and Massachusetts both carry 51-character Latin mottos. Michigan's 'Si Quaeris Peninsulam Amoenam Circumspice' (If you seek a pleasant peninsula, look around you) and Massachusetts's 'Ense Petit Placidam Sub Libertate Quietem' (By the sword we seek peace, but peace only under liberty) share the record."

  - question: "Which US state flag has the shortest Latin motto?"
    answer: "Maine's flag carries the shortest Latin motto — a single word: 'Dirigo,' meaning 'I lead' or 'I direct.' It appears above the pine tree and moose in the coat of arms on Maine's blue state flag."

  - question: "Is Maryland's motto Latin?"
    answer: "No. Maryland's state motto 'Fatti maschii, parole femine' is Old Italian (or Medieval Catalan), not Latin. It means approximately 'Strong deeds, gentle words.' Maryland is the only US state with a motto in Old Italian, making it unique among all 50 states. The motto appears on Maryland's coat of arms but not on the quartered-color state flag."

  - question: "What does 'Sic Semper Tyrannis' mean and which state uses it?"
    answer: "Virginia uses 'Sic Semper Tyrannis' as its state motto, meaning 'Thus always to tyrants.' It appears on the Virginia state flag below the state seal, which shows Virtus (a female warrior figure) standing over a fallen tyrannical king. The motto was adopted in 1776 and gained historical notoriety when John Wilkes Booth reportedly shouted it after assassinating President Lincoln in 1865."

  - question: "What state motto is in Italian?"
    answer: "Maryland's state motto 'Fatti maschii, parole femine' is in Old Italian, making it the only US state motto not in English, Latin, or another commonly used language. It translates to 'Strong deeds, gentle words' and comes from the Calvert family motto of Maryland's colonial founders. It appears on the state coat of arms but not on the quartered-color flag."
