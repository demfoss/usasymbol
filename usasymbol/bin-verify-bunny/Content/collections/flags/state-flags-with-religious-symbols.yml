sections:
  - id: "direct-god-language"
    icon: "fa-solid fa-quote-left"
    style: "law-cards"
    title: "State Flags That Mention God Directly"
    paragraphs:
      - "Four current flags meet the strict wording test. Florida and South Dakota carry the language through their state seals, Georgia places the national motto below its coat of arms, and Mississippi prints the same motto beneath its magnolia."
    subsections:
      - subtitle: "Florida"
        text: |-
          **Classification:** Direct God-language
          **Wording:** IN GOD WE TRUST

          Florida law centers the Great Seal on a white field crossed by red diagonal bars. The seal statute requires the surrounding words GREAT SEAL OF THE STATE OF FLORIDA: IN GOD WE TRUST.

          Literal wording places Florida in the four-flag direct category. The phrase enters the design through a legally prescribed seal, not through an interpretation of the red saltire or another visual shape.
        anchor_phrases:
          - "Great Seal"
          - "IN GOD WE TRUST"
      - subtitle: "Georgia"
        text: |-
          **Classification:** Direct God-language
          **Wording:** IN GOD WE TRUST

          Georgia's blue canton contains the state coat of arms above IN GOD WE TRUST, surrounded by 13 white stars. The General Assembly created the design in 2003, retaining red, white, and blue horizontal bands.

          Visible, legislated wording makes Georgia a direct entry. WISDOM, JUSTICE, MODERATION also appears within the arms, but only IN GOD WE TRUST supplies the explicit deity reference counted here.
        anchor_phrases:
          - "state coat of arms"
          - "IN GOD WE TRUST"
      - subtitle: "Mississippi"
        text: |-
          **Classification:** Direct God-language
          **Wording:** IN GOD WE TRUST

          Mississippi's Magnolia flag places IN GOD WE TRUST below a white magnolia encircled by 20 white stars and topped by a gold star. The 2020 redesign law required the phrase before voters approved the final design.

          Mississippi qualifies through wording built into the flag itself rather than a tiny inherited seal. Its law specifies the motto's placement, capitalization, and type style as part of the official artwork.
        anchor_phrases:
          - "Magnolia flag"
          - "IN GOD WE TRUST"
      - subtitle: "South Dakota"
        text: |-
          **Classification:** Direct God-language
          **Wording:** UNDER GOD THE PEOPLE RULE

          South Dakota places its Great Seal inside a golden sun. Article XXI of the state constitution requires UNDER GOD THE PEOPLE RULE around the inner seal scene, and current seal law requires the complete motto in official reproductions.

          Constitutional wording gives South Dakota the only direct phrase on this list that differs from IN GOD WE TRUST. Its flag qualifies because the legally defined seal is an official component of the banner.
        anchor_phrases:
          - "Great Seal"
          - "UNDER GOD THE PEOPLE RULE"

  - id: "historic-cross-forms"
    icon: "fa-solid fa-shapes"
    style: "law-cards"
    title: "State Flags With Historic or Heraldic Cross Forms"
    paragraphs:
      - "Three flags contain forms named for Christian crosses or inherited from heraldry that used them. Classification describes design history only. A cross form on a civic flag does not prove that the state endorses a current religious doctrine or speaks for residents' beliefs."
      - "Florida is not counted again in this group. Its law calls the diagonal elements red bars rather than assigning them a Christian meaning, while the seal's IN GOD WE TRUST wording independently qualifies the flag for the direct category."
    subsections:
      - subtitle: "Alabama"
        text: |-
          **Classification:** Named historic cross form
          **Element:** Cross of St. Andrew

          Alabama's 1895 flag consists of a crimson diagonal cross on white. The Alabama Department of Archives and History lists the emblem by its official historical name, a crimson Cross of St. Andrew.

          Documented naming supports inclusion in the historical-cross category. Alabama carries no God-language, devotional inscription, or figure of the saint, so the shape alone should not be presented as a modern declaration of faith.
        anchor_phrases:
          - "Cross of St. Andrew"
          - "Alabama Department of Archives and History"
      - subtitle: "Hawaii"
        text: |-
          **Classification:** Inherited national-flag forms
          **Element:** Union Jack

          Hawaii law places a jack in the upper canton and defines it through a compound saltire with a bordered red cross over all. The Union Jack historically combines crosses associated with St. George, St. Andrew, and St. Patrick.

          Hawaii belongs here because those cross forms arrive as one inherited component of the Hawaiian Kingdom's flag. Their presence records flag history and international connection, not a present religious position adopted by Hawaii.
        anchor_phrases:
          - "Union Jack"
          - "Hawaiian Kingdom"
      - subtitle: "Maryland"
        text: |-
          **Classification:** Family heraldry
          **Element:** Crossland cross bottony

          Maryland quarters the Calvert family's black-and-gold arms with the Crossland family's red-and-white arms. The Secretary of State explains that the flag uses a cross bottony, whose arms end in rounded buttons.

          Specific heraldic documentation places Maryland in this category. Family arms supplied the design, so treating its quarters as a statement of contemporary state religion would go beyond what the official flag history establishes.
        anchor_phrases:
          - "cross bottony"
          - "Crossland family"

  - id: "historical-christian-context"
    icon: "fa-solid fa-feather-pointed"
    style: "law-cards"
    title: "Louisiana's Pelican in Historical Christian Art"
    paragraphs:
      - "Louisiana needs a narrower label than the direct and cross-form groups. State law establishes the blood-feeding pelican, while museum scholarship supplies the Christian art context. The state sources do not label the flag a religious banner."
    subsections:
      - subtitle: "Louisiana"
        text: |-
          **Classification:** Historical Christian art context
          **Headline count:** Not included

          Louisiana's flag shows a mother pelican vulning herself to feed three chicks, with three blood drops required by law. A banner below carries the civic motto UNION JUSTICE CONFIDENCE.

          The Met identifies the older pelican-in-her-piety motif as a Christian symbol of loving sacrifice and Christ the Redeemer. Louisiana belongs as documented context, not as direct God-language, because its flag text names no deity and state law does not define the emblem as a current religious profession.
        anchor_phrases:
          - "pelican-in-her-piety"
          - "UNION JUSTICE CONFIDENCE"

  - id: "religious-flag-claims-not-counted"
    icon: "fa-solid fa-circle-xmark"
    style: "law-cards"
    title: "State Flag Symbols Not Counted as Christian References"
    paragraphs:
      - "Four recurring claims fail the Christian-reference test or use the wrong cultural label. The Not Verified badges apply only to proposed official Christian meanings for Rhode Island's anchor and Utah's beehive. Oklahoma and New Mexico instead have documented Indigenous meanings that should not be recast as Christian imagery."
    subsections:
      - subtitle: "Rhode Island"
        status: "Not Verified"
        text: |-
          **Claim checked:** The anchor is officially Christian
          **Official wording:** Anchor and HOPE

          Rhode Island law specifies a gold anchor, the word HOPE, and 13 stars. The statute does not assign a Christian meaning to the anchor or identify a biblical source for the motto.

          Broader art history cannot substitute for state-specific evidence. Rhode Island stays outside the core list unless an authoritative source connects the current flag's anchor to an official Christian meaning.
        anchor_phrases:
          - "Rhode Island law"
          - "Christian meaning"
      - subtitle: "Utah"
        status: "Not Verified"
        text: |-
          **Claim checked:** The current beehive is officially religious
          **Statutory meaning:** Industry, community, and 1847

          Utah Code assigns the current flag's beehive to industry, community, and the year pioneers first settled Utah. The law separately says the blue field symbolizes faith, but that abstract value is not wording printed on the flag or a meaning assigned to the beehive.

          Current statutory language does not classify the beehive as a religious emblem. Its wider place in Latter-day Saint and Utah history does not override the meanings attached to this flag by law.
        anchor_phrases:
          - "Utah Code"
          - "current flag"
      - subtitle: "Oklahoma"
        text: |-
          **Claim checked:** The shield carries Christian crosses
          **Finding:** Indigenous signs for stars, not Christian crosses

          Oklahoma's Osage warrior shield contains six small white marks that can look cross-shaped at a distance. The Oklahoma Historical Society identifies them as Indigenous signs for stars.

          An official cultural explanation defeats the Christian-cross claim. Oklahoma belongs in an Indigenous-symbol guide, but the shield marks do not qualify it for the historical Christian group used here.
        anchor_phrases:
          - "Osage warrior shield"
          - "Oklahoma Historical Society"
      - subtitle: "New Mexico"
        text: |-
          **Claim checked:** The Zia design is a Christian cross
          **Finding:** Sacred Zia Sun Symbol, not a Christian cross

          New Mexico centers the Zia Sun Symbol on a yellow field. The Pueblo of Zia explains four groups of rays through four winds, seasons, directions, and sacred obligations, with a circle binding the elements together.

          Calling the rays a Christian cross replaces a documented Indigenous meaning with visual guesswork. Sacredness is real and verified, but it belongs to Zia culture rather than the Christian category examined on this page.
        anchor_phrases:
          - "Zia Sun Symbol"
          - "Pueblo of Zia"

  - id: "how-the-categories-differ"
    icon: "fa-solid fa-list-check"
    style: "gradient"
    title: "How Religious References on State Flags Differ"
    facts:
      - "Florida, Georgia, and Mississippi display IN GOD WE TRUST, while South Dakota displays UNDER GOD THE PEOPLE RULE."
      - "Alabama's diagonal saltire is officially identified as a Cross of St. Andrew, but the flag contains no words."
      - "Hawaii inherits several named cross forms through the Union Jack rather than displaying a separate devotional emblem."
      - "Maryland's cross bottony comes from Crossland family heraldry."
      - "Louisiana law requires three blood drops on the pelican, but its written motto is UNION JUSTICE CONFIDENCE."
      - "A symbol's historical religious use does not by itself define a state's present legal or political position."

faq:
  - question: "Which state flags mention God?"
    answer: "Florida, Georgia, and Mississippi display IN GOD WE TRUST. South Dakota's seal adds UNDER GOD THE PEOPLE RULE, producing a total of four current state flags with direct God-language."

  - question: "How many state flags say In God We Trust?"
    answer: "Three current state flags carry the exact phrase IN GOD WE TRUST: Florida, Georgia, and Mississippi. South Dakota also mentions God, but its separate state motto reads UNDER GOD THE PEOPLE RULE."

  - question: "Does the Alabama flag have a religious cross?"
    answer: "Alabama's official historical description calls the design a crimson Cross of St. Andrew. That name supports classification as a historic cross form, but the flag contains no religious words or saintly figure and does not establish a modern religious position for Alabama."

  - question: "Why does Hawaii's flag contain crosses?"
    answer: "The forms are part of the Union Jack in Hawaii's canton. Hawaii law describes the jack through a compound saltire and a bordered red cross, while British parliamentary history connects the component designs to named national and saint-associated crosses."

  - question: "Is the pelican on the Louisiana flag a Christian symbol?"
    answer: "The blood-feeding pelican has a documented history in Christian art as an allegory of Christ's sacrifice. Louisiana law requires the mother pelican and three drops of blood, but it does not call the flag religious, so the entry is treated as historical context rather than direct God-language."

  - question: "Is the Zia symbol on New Mexico's flag a Christian cross?"
    answer: "No. The Pueblo of Zia identifies the Zia Sun Symbol as a sacred Indigenous symbol built around the number four and the Circle of Life. Calling its rays a Christian cross would erase the documented cultural meaning."

