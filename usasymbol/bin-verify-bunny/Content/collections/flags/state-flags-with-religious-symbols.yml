page:
  h1: "Which State Flags Have Religious Symbols or Mottos?"
  intro_title: "Direct God-Language, Christian Iconography, and Context"

  quick_answer:
    - "Four current state flags contain direct God-language: Florida, Georgia, Mississippi, and South Dakota."
    - "Alabama, Hawaii, and Maryland display documented cross forms, but those inherited or heraldic designs do not establish a modern religious position for the state."
    - "Louisiana's pelican recalls a historical Christian allegory of sacrifice. It remains contextual rather than part of the four-flag God-language count because neither the flag nor its motto names God."

  methodology: "The direct count requires the current flag artwork to contain the word God in wording prescribed or documented by law. Cross forms and the Louisiana pelican appear separately only when authoritative evidence establishes their Christian iconographic history, while sacred Indigenous symbols remain described on their own terms and visual resemblance never becomes proof of present state belief."

