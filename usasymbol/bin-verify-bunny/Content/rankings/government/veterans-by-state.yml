faq:
  - question: "Which state has the most veterans per capita?"
    answer: "Alaska, at 7,804 veterans per 100,000 residents. Virginia is second at 7,137, and Montana is third at 6,976."

  - question: "Which state has the fewest veterans per capita?"
    answer: "New Jersey, at 2,872 veterans per 100,000 residents. New York is the next lowest at 2,909."

  - question: "Which state has the most veterans overall?"
    answer: "Texas, with 1,402,360 veterans. Florida is second with 1,327,070, and California is third with 1,305,450."

  - question: "How many veterans live in California?"
    answer: "California has 1,305,450 veterans, the third-most of any state. Its rate of 3,316 per 100,000 residents ranks 47th out of 50."

  - question: "How many veterans live in Virginia?"
    answer: "Virginia has 629,500 veterans, the fifth-most overall, and its rate of 7,137 per 100,000 residents ranks second. Only Alaska's rate of 7,804 is higher."

  - question: "What is the difference between the highest and lowest veteran rates by state?"
    answer: "Alaska's 7,804 veterans per 100,000 residents is roughly 2.7 times New Jersey's 2,872, the widest gap in the table."

