page:
  h1: "Veterans by State"

  quick_answer:
    - "Alaska leads the veterans by state ranking on a per-capita basis, with 7,804 per 100,000 residents. Virginia ranks second at 7,137, and Montana third at 6,976."
    - "New Jersey has the fewest veterans per capita at 2,872 per 100,000, just below New York's 2,909. Alaska's rate is roughly 2.7 times New Jersey's."
    - "Texas has the most veterans overall at 1,402,360, ahead of Florida's 1,327,070 and California's 1,305,450. Despite that, Texas ranks 42nd and California 47th out of 50 on the per-capita rate."

  methodology: "Counts and per-100,000 rates use World Population Review's 2024 table. Washington, D.C. and the national total are excluded from the 50-state ranking."

  sources:
    - name: "World Population Review. Veterans by State"
      url: "https://worldpopulationreview.com/state-rankings/veterans-by-state"
      description: "Veteran totals and per-100,000-resident rates for 2024"

