page:
  h1: "50 States in Order of Statehood"

  quick_answer:
    - "Delaware was the 1st state to join the United States, ratifying the U.S. Constitution on December 7, 1787, and earning its nickname 'The First State.' Hawaii became the 50th and last state on August 21, 1959."
    - "The original 13 colonies ratified the Constitution between 1787–1790, while the remaining 37 states were admitted to the Union by Congress between 1791–1959, spanning 168 years of American expansion."

  methodology: "Order follows Constitution ratification dates for the first 13 states and official admission dates for later states."
  
