faq:
  - question: "Which state pays school counselors the most?"
    answer: "Washington, at $65,314 a year, or $31.40 an hour. Maryland and New York follow at $62,337 and $62,287."

  - question: "Which state pays school counselors the least?"
    answer: "Louisiana, at $41,489 a year, or $19.95 an hour."

  - question: "How much do school counselors make in California?"
    answer: "$56,872 a year, or $27.34 an hour, ranking 10th among all states."

  - question: "What is the hourly pay for a school counselor?"
    answer: "Hourly pay ranges from $19.95 in Louisiana to $31.40 in Washington, based on a standard 2,080-hour work year."

  - question: "How much do school counselors make in Texas?"
    answer: "$51,605 a year, almost identical to Indiana's $51,610, a difference of just $5."

  - question: "What is the monthly salary for a school counselor?"
    answer: "Monthly salary ranges from $3,457 in Louisiana to $5,442 in Washington, depending on the state."

