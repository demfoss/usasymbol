sections:
  - id: "states-with-the-highest-school-counselor-salaries"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest School Counselor Salaries"
    paragraphs:
      - "Washington pays school counselors $65,314 a year, the most of any state. Maryland and New York follow closely at $62,337 and $62,287, and Virginia rounds out the top four at $60,464."

  - id: "states-with-the-lowest-school-counselor-salaries"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest School Counselor Salaries"
    paragraphs:
      - "Louisiana pays school counselors $41,489 a year, the least of any state. South Carolina is second-lowest at $42,289, and Georgia follows at $42,741, both still more than $22,500 below Washington."

  - id: "states-with-nearly-identical-school-counselor-pay"
    icon: "fa-solid fa-equals"
    title: "States With Nearly Identical School Counselor Pay"
    paragraphs:
      - "Indiana and Texas pay almost the same annual salary, $51,610 and $51,605, a gap of just $5. Minnesota and Connecticut are similarly close at $52,874 and $52,865, both converting to the same hourly rate of $25.42."

