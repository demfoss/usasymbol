page:
  h1: "School Counselor Salary by State"

  quick_answer:
    - "Washington pays school counselors the highest salary in the country at $65,314 a year, equal to $31.40 an hour."
    - "Louisiana pays the lowest salary of any state at $41,489 a year, $19.95 an hour, roughly $23,825 less than Washington."
    - "Maryland and New York rank second and third, at $62,337 and $62,287 a year, just $50 apart."

  methodology: "Annual, monthly, weekly, and hourly pay reflect each state's school counselor salary estimate on record for 2026. Monthly, weekly, and hourly figures are derived from the annual salary using a standard 2,080-hour work year."

  sources:
    - name: "World Population Review. School Counselor Salary by State"
