sections:
  - id: "states-with-the-highest-college-graduation-rates"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest College Graduation Rates"
    paragraphs:
      - "Massachusetts leads all 50 states at 47.3%, followed by Colorado at 45.7% and Vermont at 43.8%. Washington D.C., not a state, posts an even higher rate at 64.2%, nearly 17 points above Massachusetts."

  - id: "states-with-the-lowest-college-graduation-rates"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest College Graduation Rates"
    paragraphs:
      - "West Virginia has the lowest college graduation rate of any state at 24.1%, just below Mississippi at 25.1% and Arkansas at 25.7%. All three sit more than 23 points behind Massachusetts, the top-ranked state."

  - id: "states-with-nearly-identical-college-graduation-rates"
    icon: "fa-solid fa-equals"
    title: "States With Nearly Identical Graduation Rates"
    paragraphs:
      - "Rhode Island and Utah tie at 37.7%. Montana and Pennsylvania both post 35.2%, and Michigan and Missouri both sit at 32.4%, three separate ties within a data set that otherwise moves in small increments from state to state."

