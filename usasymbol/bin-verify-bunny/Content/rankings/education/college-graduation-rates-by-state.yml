faq:
  - question: "Which state has the highest college graduation rate?"
    answer: "Massachusetts, at 47.3%. Washington D.C., which is not a state, posts an even higher rate of 64.2%."

  - question: "Which state has the lowest college graduation rate?"
    answer: "West Virginia, at 24.1%, the lowest of any state."

  - question: "What is the college graduation rate in California?"
    answer: "37.1%, ranking 16th among all states."

  - question: "Are any states tied for the same college graduation rate?"
    answer: "Yes. Rhode Island and Utah both post 37.7%, Montana and Pennsylvania both post 35.2%, and Michigan and Missouri both post 32.4%."

  - question: "What is the college graduation rate in Texas?"
    answer: "33.8%, ranking 28th among all states."

  - question: "What is the college graduation rate in Washington D.C.?"
    answer: "64.2%, the highest of any jurisdiction in the data, nearly 17 points above Massachusetts."

