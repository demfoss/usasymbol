page:
  h1: "College Graduation Rates by State"

  quick_answer:
    - "Massachusetts has the highest college graduation rate of any state at 47.3%, well ahead of Colorado, the second-ranked state at 45.7%."
    - "West Virginia has the lowest college graduation rate of any state at 24.1%, just below Mississippi's 25.1% and Arkansas's 25.7%."
    - "Washington D.C., which is not a state, posts the highest overall rate in the data at 64.2%, nearly 17 points above Massachusetts."

  methodology: "College graduation rate reflects the share of each state's population with a bachelor's degree or higher, on record for 2026. Washington D.C. is included as a jurisdiction alongside the 50 states."

