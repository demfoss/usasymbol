faq:
  - question: "How many days are in the school year in Kansas?"
    answer: "186 days for grades 1-11 and 181 days for grade 12, the most of any state."

  - question: "Which state has the fewest school days?"
    answer: "Colorado, at 160 days, the fewest minimum required by any state with a set day count."

  - question: "Do all states set a minimum number of school days?"
    answer: "No. 13 states, including Texas, Missouri, and Delaware, set no statewide minimum and instead measure instructional time in hours or minutes, or leave the calendar to local districts."

  - question: "How many days is the school year in Texas?"
    answer: "Texas sets no minimum number of days. It requires 75,600 minutes of instruction instead, equal to 1,260 hours, more than any state's stated hour requirement."

  - question: "What is the minimum number of school days in California?"
    answer: "180 days. California measures instructional time in minutes, from 36,000 minutes for kindergarten up to 64,800 minutes, equal to 1,080 hours, for grades 9-12."

  - question: "Which states require exactly 180 school days?"
    answer: "29 states, including Alabama, Florida, New York, and Pennsylvania, set the minimum at 180 days, the most common requirement nationwide."

