page:
  h1: "Number of Days in School Year by State"

  quick_answer:
    - "Kansas requires the most days in the school year of any state, 186 for grades 1-11 and 181 for grade 12."
    - "Colorado sets the fewest school days among states with a fixed minimum, 160, 26 fewer than Kansas's 186."
    - "13 states, including Texas, Missouri, and Delaware, set no statewide minimum number of days and instead measure instructional time in hours or minutes. Texas requires 75,600 minutes of instruction, equal to 1,260 hours, more than any state's stated hour figure."

  methodology: "Day and hour requirements reflect each state's statutory or regulatory minimum on record for 2026. Figures vary by grade band, and some states set no statewide minimum, leaving the schedule to local districts."

  sources:
    - name: "World Population Review. Number of Days in School Year by State"
