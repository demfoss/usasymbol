sections:
  - id: "states-with-the-most-school-days"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Most School Days"
    paragraphs:
      - "Kansas requires 186 days for grades 1-11 and 181 days for grade 12, the most of any state. Illinois and North Carolina follow at 185 days each, one day short of Kansas's figure for younger grades."

  - id: "states-with-no-minimum-school-day-requirement"
    icon: "fa-solid fa-map-pin"
    title: "States With No Minimum School Day Requirement"
    paragraphs:
      - "13 states set no statewide minimum number of school days: Idaho, Montana, Arkansas, South Dakota, Ohio, Delaware, Nebraska, New Mexico, North Dakota, Oregon, Texas, Wisconsin, and Missouri. Idaho and Montana leave the calendar to each district, while Missouri sets no minimum days at all despite requiring 1,044 hours for grades other than kindergarten."

  - id: "state-with-the-most-required-instructional-time"
    icon: "fa-solid fa-clock"
    title: "State With the Most Required Instructional Time"
    paragraphs:
      - "Texas sets no minimum number of days but requires 75,600 minutes of instruction, equal to 1,260 hours, more than any other state's stated hour requirement. Maryland's public high schools come closest among states that measure in hours, at 1,170 hours."

