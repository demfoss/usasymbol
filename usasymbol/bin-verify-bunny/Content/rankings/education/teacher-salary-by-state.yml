faq:
  - question: "Which state pays teachers the most?"
    answer: "California, with an average of $103,552 a year in 2024-25. No other state crosses $100,000, and California's $59,424 starting salary trails only Washington's $60,658."

  - question: "Which state pays teachers the least?"
    answer: "Mississippi ranks 50th with an average of $54,975, about $19,500 below the national average. Florida at $56,663 and Louisiana at $56,785 are the only other states under $57,000."

  - question: "What is the average teacher salary in the US?"
    answer: "Public school teachers averaged $74,495 in 2024-25, according to the NEA. Despite the one-year increase, NEA reports that salaries in most states have not kept pace with inflation over the past decade."

  - question: "What is the starting teacher salary by state?"
    answer: "New teachers earn $48,112 a year on average nationally. Montana pays the least at $36,682, with Nebraska next at $39,561, while eight states start teachers above $52,000."

  - question: "How much do teachers make in Texas?"
    answer: "Texas ranks 32nd with an average teacher salary of $63,749. Starting pay is stronger at $49,465, 17th in the country and above the national starting average."

  - question: "Which state pays teachers the most adjusted for cost of living?"
    answer: "NEA figures are nominal, not adjusted for living costs. California leads in raw pay at $103,552, but most top-ten states also carry high living costs, so adjusted rankings differ. See [states by cost of living](/rankings/economy/states-by-cost-of-living) for context."

