sections:
  - id: "highest-teacher-salaries"
    icon: "fa-solid fa-arrow-up"
    title: "States with the Highest Teacher Salaries"
    paragraphs:
      - "California is the only state where the average teacher salary tops $100,000, at $103,552. New York follows at $98,655, Washington at $96,589, and Massachusetts at $93,554."
      - "Every state in the top ten touches an ocean, from Connecticut at $89,593 and Maryland at $87,409 down to Oregon at $81,657 and Alaska at $81,450."

  - id: "lowest-teacher-salaries"
    icon: "fa-solid fa-arrow-down"
    title: "States with the Lowest Teacher Salaries"
    paragraphs:
      - "Mississippi pays the lowest average at $54,975, with Florida at $56,663 and Louisiana at $56,785 just above it. Missouri at $57,366 and West Virginia at $58,099 complete the bottom five."
      - "Florida shows the sharpest split in the table. Its average ranks 49th, yet its $49,435 starting salary places 18th, higher than what most states offer new teachers."

  - id: "starting-teacher-salary"
    icon: "fa-solid fa-seedling"
    title: "Starting Teacher Salary by State"
    paragraphs:
      - "Washington pays new teachers the most at $60,658, ahead of California at $59,424 and New Jersey at $58,727. The national average starting salary is $48,112."
      - "Montana pays new teachers the least at $36,682, the only state below $39,000. Arkansas moves the other way, ranking 44th for average pay at $59,193 while its $50,076 starting salary places 15th."

  - id: "teacher-salary-growth"
    icon: "fa-solid fa-chart-line"
    title: "Teacher Salary Growth by State"
    paragraphs:
      - "The national average rose 3.5% from 2023-24 to 2024-25, reaching $74,495. Nevada posted the largest one-year increase among states at 11.8%, followed by Delaware at 7.6%."
      - "NEA reports that average teacher salaries in most states have failed to keep up with inflation over the past decade. Teachers earn 24% more on average in states with collective bargaining."

