page:
  h1: "Teacher Salary by State 2026"

  quick_answer:
    - "Teacher salary by state peaks in California, where the average reached $103,552 in 2024-25. New York follows at $98,655, and Washington ranks third at $96,589."
    - "Mississippi pays the lowest average teacher salary at $54,975, followed by Florida at $56,663 and Louisiana at $56,785. The gap between California and Mississippi is roughly $48,600 a year."
    - "The national average teacher salary is $74,495, up 3.5% from the previous year. New teachers start at $48,112 on average, and Washington offers the highest starting pay at $60,658."

  methodology: "Average and starting salaries are 2024-25 figures from NEA reports. Values are nominal dollars, not adjusted for cost of living."

  sources:
