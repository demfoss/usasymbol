faq:
  - question: "What is the best state for school choice and homeschooling?"
    answer: "Arizona is the strongest single all-around state on this map. Its ESA averages $9,572, eligibility is universal and funded, and HSLDA still places Arizona in the low-regulation homeschool group. Florida and Iowa are the closest competitors."

  - question: "What is the Iowa ESA amount in 2026?"
    answer: "Iowa's Students First ESA is $8,148 for the 2026-27 school year. All K-12 students in Iowa are eligible, but the account is still tuition-first and tied to accredited private school enrollment."

  - question: "Does Texas have school vouchers in 2026?"
    answer: "Texas created a universal ESA that begins in fall 2026. The Texas Education Agency lists the 2026-27 amount as $10,474 for a child attending an approved private school, with up to $2,000 for homeschool use. Funding is capped in the first year, which is why Texas stays yellow on this page."

  - question: "Which states have the strictest homeschool laws?"
    answer: "New York, Massachusetts, Pennsylvania, and Rhode Island are the strictest states on this map because HSLDA places all four in its high-regulation category. New York and Massachusetts are the strongest red examples because neither also offers a statewide private choice program."

  - question: "Which states give money for homeschooling?"
    answer: "Arizona, Arkansas, Texas, Utah, and West Virginia are the clearest examples on this page of states where families can direct publicly backed education dollars outside a standard district campus. Iowa is different. Its ESA is statewide, but funds must go to accredited private school tuition and fees before anything else."

  - question: "Does New York have a statewide voucher or ESA?"
    answer: "No. As of June 23, 2026, EdChoice does not list a statewide private school choice program for New York. New York also stays in HSLDA's high-regulation homeschool category, which is why it appears in red."

