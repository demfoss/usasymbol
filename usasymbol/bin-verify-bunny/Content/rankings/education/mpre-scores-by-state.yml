sections:
  - id: "states-with-the-highest-mpre-passing-score"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest MPRE Passing Score"
    paragraphs:
      - "California and Utah tie for the highest required MPRE score at 86, the strictest threshold in this data. 21 states, the largest single group, set the requirement at 85, including Texas, Virginia, and New York."

  - id: "states-with-the-lowest-mpre-passing-score"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest MPRE Passing Score"
    paragraphs:
      - "Five states and the District of Columbia set the lowest passing score at 75: Alabama, D.C., Georgia, Mississippi, New Jersey, and Pennsylvania. Wisconsin is the only state with no listed MPRE score in this data."

  - id: "states-with-no-mpre-score-expiration"
    icon: "fa-solid fa-infinity"
    title: "States With No MPRE Score Expiration"
    paragraphs:
      - "Oklahoma accepts a passing MPRE score for an unlimited period of time. Kentucky sets no expiration on a passing score either, though a score of 80 or higher is still required to sit for the bar exam."

