page:
  h1: "MPRE Scores by State"

  quick_answer:
    - "California and Utah require the highest Multistate Professional Responsibility Examination (MPRE) passing score in the country at 86."
    - "Five states and the District of Columbia set the lowest passing score at 75: Alabama, Georgia, Mississippi, New Jersey, Pennsylvania, and D.C."
    - "Wisconsin is the only state with no listed MPRE passing score requirement in this data. 21 states, the largest group, set the requirement at 85."

  methodology: "Minimum passing MPRE score reflects each state's bar admission requirement on record for 2026. Wisconsin's score is not applicable in the source data. Score validity period, where reported, appears in the notes."

