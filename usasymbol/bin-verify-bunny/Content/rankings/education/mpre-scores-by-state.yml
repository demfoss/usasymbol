faq:
  - question: "What is the highest MPRE passing score required by any state?"
    answer: "86, required by California and Utah."

  - question: "What is the lowest MPRE passing score required by any state?"
    answer: "75, required by Alabama, D.C., Georgia, Mississippi, New Jersey, and Pennsylvania."

  - question: "Does Wisconsin require the MPRE?"
    answer: "Wisconsin has no listed MPRE passing score in this data, unlike every other state."

  - question: "How long is an MPRE score valid in New York?"
    answer: "4 years from the date the applicant took the MPRE."

  - question: "Do any states have no MPRE score expiration?"
    answer: "Oklahoma accepts a passing score for an unlimited period of time. Kentucky also sets no expiration, though applicants still need an 80 or higher to sit for the bar exam."

  - question: "What is the MPRE passing score in Texas?"
    answer: "85, tied with 20 other states for the second-highest requirement in the country."

