faq:
  - question: "Which state has the best public schools?"
    answer: "New York ranks first in the 2025 public school rankings, up one place from 2024. Connecticut follows in second after a six-spot jump, with Massachusetts third."

  - question: "Which state has the worst public schools?"
    answer: "Arizona ranks 50th. Alaska at 49th, Nevada at 48th, Oklahoma at 47th, and New Mexico at 46th fill out the bottom five."

  - question: "Is Massachusetts the best state for education?"
    answer: "Massachusetts places third in this index after leading in 2024. The [US News K-12 ranking](/rankings/education/states-by-k12-education) still puts Massachusetts first, since it weighs test scores and graduation rates without this index's funding, higher education, and safety factors."

  - question: "Where does Texas rank in public schools?"
    answer: "Texas ranks 34th in 2025, an improvement of six places over 2024."

  - question: "Where does California rank in public schools?"
    answer: "California ranks 8th, after the largest one-year climb in the country. The state rose 24 places from 32nd in 2024."

  - question: "Where does Florida rank in public schools?"
    answer: "Florida ranks 24th, up 17 places from 2024. Only California gained more ground in a single year."

