page:
  h1: "Public School Rankings by State 2026"

  quick_answer:
    - "Public school rankings by state put New York first in 2025, followed by Connecticut and Massachusetts. New Jersey and Illinois complete the top five."
    - "Arizona ranks last at 50th, behind Alaska at 49th and Nevada at 48th. Oklahoma and New Mexico also sit in the bottom five."
    - "California made the biggest one-year jump, climbing 24 places to 8th. Alaska fell furthest, dropping 22 spots to 49th."

  methodology: "Rankings are the 2025 World Population Review public school index, which combines K-12 performance, school funding, higher education quality, and safety. The change column shows movement from the 2024 edition."

  sources:
