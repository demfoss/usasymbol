sections:
  - id: "best-public-schools"
    icon: "fa-solid fa-arrow-up"
    title: "States with the Best Public Schools"
    paragraphs:
      - "New York holds first place in 2025 after climbing one spot, with Connecticut jumping six places to second. Massachusetts, ranked third, slipped two positions from its 2024 lead."
      - "Four of the top five states sit in the Northeast. Illinois is the exception, rising 12 places to fifth, the biggest gain inside the top ten after California's."

  - id: "worst-public-schools"
    icon: "fa-solid fa-arrow-down"
    title: "States with the Worst Public Schools"
    paragraphs:
      - "Arizona ranks 50th, trailing Alaska at 49th, Nevada at 48th, Oklahoma at 47th, and New Mexico at 46th. Four of the bottom five are western states."
      - "Alaska is the newest arrival at the bottom, falling 22 places in a single year, the steepest drop in the country. Nevada slid four spots to 48th."

  - id: "most-improved-states"
    icon: "fa-solid fa-chart-line"
    title: "Most Improved States for Public Schools"
    paragraphs:
      - "California gained 24 places, the largest one-year rise, moving from 32nd to 8th. Florida climbed 17 spots to 24th, Delaware rose 15 to 21st, and Kentucky and Georgia each added 13."
      - "South Dakota fell 18 places to 36th and Michigan dropped 14 to 37th. North Dakota and Montana each lost 13, landing at 32nd and 33rd."

