sections:
  - id: "highest-student-loan-debt"
    icon: "fa-solid fa-arrow-up"
    title: "States with the Highest Student Loan Debt"
    paragraphs:
      - "Maryland borrowers carry the highest average balance at $43,781, followed by Georgia at $42,226 and Virginia at $40,287. No other state tops $40,000."
      - "Mississippi has the largest share of residents with student debt at 15.4%, ahead of Georgia's 15.2% and Ohio's 15.0%. Georgia is the only state that ranks in the top three on both measures."

  - id: "lowest-student-loan-debt"
    icon: "fa-solid fa-arrow-down"
    title: "States with the Lowest Student Loan Debt"
    paragraphs:
      - "North Dakota has the lowest average at $29,115, the only state under $30,000. Wyoming at $30,631, Iowa at $30,698, and South Dakota at $31,171 follow."
      - "Hawaii has the smallest share of residents with student debt at 8.5%, with Alaska at 9.0%, Utah at 9.2%, and Wyoming at 9.4% close behind. Even so, Hawaiian borrowers rank sixth for average balance at $38,929."

  - id: "student-loan-delinquency"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Student Loan Delinquency by State"
    paragraphs:
      - "New Mexico has the highest share of delinquent student debt, with 29.63% of balances 90 or more days past due in early 2025. Oklahoma at 28.23%, West Virginia at 27.78%, and Mississippi at 26.54% follow."
      - "Among borrowers actually in repayment, Mississippi's delinquency rate reaches 44.6%, and six more states exceed 30%, including Alabama, West Virginia, and Kentucky. Massachusetts posts the lowest rate at 13.83%."

