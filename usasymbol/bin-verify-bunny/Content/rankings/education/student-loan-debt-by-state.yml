faq:
  - question: "Which state has the highest student loan debt?"
    answer: "Maryland, where the average federal balance is $43,781 per borrower. Georgia at $42,226 and Virginia at $40,287 are the only other states above $40,000."

  - question: "Which state has the lowest student loan debt?"
    answer: "North Dakota, at an average of $29,115 per borrower. No other state falls below $30,000."

  - question: "What is the average student loan debt per borrower?"
    answer: "State averages range from $29,115 in North Dakota to $43,781 in Maryland. Nationwide, 42.8 million borrowers hold $1.833 trillion in federal student loans."

  - question: "Which state has the highest student loan delinquency rate?"
    answer: "New Mexico, with 29.63% of student debt balances at least 90 days past due in early 2025. Counting only borrowers in repayment, Mississippi is highest at 44.6%."

  - question: "Which states have the lowest student loan delinquency?"
    answer: "Massachusetts at 13.83%, New Hampshire at 14.11%, and Utah at 14.3%. All three sit well below the seven states that exceed 30% among borrowers in repayment."

  - question: "Which state has the most residents with student loan debt?"
    answer: "Mississippi, where 15.4% of residents carry student loans. Georgia follows at 15.2% and Ohio at 15.0%, while Hawaii has the smallest share at 8.5%."

