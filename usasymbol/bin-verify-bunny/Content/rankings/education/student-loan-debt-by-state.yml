page:
  h1: "Student Loan Debt by State"

  quick_answer:
    - "Student loan debt by state runs highest in Maryland, where borrowers owe an average of $43,781. Georgia follows at $42,226 and Virginia at $40,287."
    - "North Dakota has the lowest average at $29,115, the only state under $30,000. Wyoming at $30,631 and Iowa at $30,698 sit just above it."
    - "Nationally, 42.8 million borrowers hold $1.833 trillion in federal student loan debt. In early 2025, 13.7% of borrowers, about six million people, were at least 90 days past due."

  methodology: "Balances cover federal student loans per borrower, from Federal Student Aid data updated in 2025. Delinquency figures come from New York Fed analysis of first-quarter 2025 credit data."

  sources:
    - name: "Education Data Initiative — Student Loan Debt by State"
      url: "https://educationdata.org/student-loan-debt-by-state"
      description: "Average federal student loan debt per borrower and share of residents with debt"
