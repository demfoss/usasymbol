page:
  h1: "UBE Scores by State"

  quick_answer:
    - "19 states require a UBE score of 270 to pass the bar exam, the highest cut score used by any Uniform Bar Exam jurisdiction."
    - "Six states, including Alabama, Minnesota, and Utah, set the lowest UBE cut score at 260, ten points below the top group."
    - "Michigan is the only state with a cut score of 268, between the 270 and 266 tiers. 11 states, including California and Louisiana, do not use the UBE at all."

  methodology: "UBE cut scores reflect each jurisdiction's minimum passing score on the 400-point Uniform Bar Exam scale, on record for 2026. Only jurisdictions that administer the UBE are included. 11 states use their own bar exam instead."

  sources:
