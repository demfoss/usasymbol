faq:
  - question: "Which states require the highest UBE score?"
    answer: "19 states require 270, the highest cut score in use, including Texas, Massachusetts, and Pennsylvania."

  - question: "Which states require the lowest UBE score?"
    answer: "Six states set the minimum at 260: Alabama, Minnesota, Missouri, New Mexico, North Dakota, and Utah."

  - question: "What UBE score do you need to pass the bar exam in Texas?"
    answer: "270, the same cut score used by 18 other states, including Massachusetts and Pennsylvania."

  - question: "What is Michigan's UBE cut score?"
    answer: "268, a score no other state uses. It sits between the 270 tier and the 266 tier used by 11 states and Washington, D.C."

  - question: "Do all states use the UBE?"
    answer: "No. 11 states set their own bar exam standards instead of the UBE, including California, Florida, and Wisconsin."

  - question: "What is the range of UBE cut scores across all states?"
    answer: "260 to 270 on the 400-point UBE scale, a 10-point spread between the lowest and highest jurisdictions."

