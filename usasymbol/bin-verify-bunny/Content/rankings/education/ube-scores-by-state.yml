sections:
  - id: "states-with-the-highest-ube-cut-score"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest UBE Cut Score"
    paragraphs:
      - "19 states require a UBE score of 270, the highest cut score in use: Alaska, Arizona, Arkansas, Colorado, Idaho, Maine, Massachusetts, Nebraska, New Hampshire, North Carolina, Ohio, Oregon, Pennsylvania, Rhode Island, Tennessee, Texas, Vermont, West Virginia, and Wyoming."

  - id: "states-with-the-lowest-ube-cut-score"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest UBE Cut Score"
    paragraphs:
      - "Six states set the lowest UBE cut score at 260: Alabama, Minnesota, Missouri, New Mexico, North Dakota, and Utah. Indiana and Oklahoma sit just above at 264, the only two states at that score."

  - id: "states-that-dont-use-the-ube"
    icon: "fa-solid fa-scale-balanced"
    title: "States That Don't Use the UBE"
    paragraphs:
      - "11 states do not administer the UBE and set their own bar exam standards instead: California, Delaware, Florida, Georgia, Hawaii, Louisiana, Mississippi, Nevada, South Dakota, Virginia, and Wisconsin."

