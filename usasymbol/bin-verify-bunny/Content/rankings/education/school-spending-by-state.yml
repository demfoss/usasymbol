    answer: "Idaho spends the least per student at $11,056 a year. Utah ($11,342) and Nevada ($11,673) rank second and third lowest."
  - question: "What is the average school spending per student?"
    answer: "Nationally, per-pupil spending averages $17,619, a 6.61% increase from the prior year. Twenty-six states spend above that figure and 24 spend below it."
  - question: "How is school spending split between federal, state, and local government?"
    answer: "Nationally, the federal government provides about 8% of K-12 funding, state governments provide roughly 47%, and local governments, mainly through property taxes, contribute about 45%."
  - question: "Does higher school spending mean better student outcomes?"
    answer: "Not necessarily. New York spends the most per student in the country but does not rank first for K-12 outcomes, so the two measures should be compared separately rather than assumed to move together."
  - question: "How much does Texas spend per student?"
    answer: "Texas spends $12,444 per student, ranking 43rd nationally. That equals 2.93% of taxpayer income, and adjusted for cost of living, Texas spending rises slightly to $13,196."

