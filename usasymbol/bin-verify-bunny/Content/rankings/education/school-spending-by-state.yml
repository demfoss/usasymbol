seo:
  title: "School Spending by State 2026 | Per-Pupil Map & Data"
  description: "New York spends the most per student at $30,012 a year. Idaho spends the least at $11,056. The national average is $17,619."

page:
  h1: "School Spending by State"

  quick_answer:
    - "New York spends the most per student at $30,012 a year, nearly triple Idaho's $11,056, the lowest in the country."
    - "Vermont ($28,818) and New Jersey ($26,280) rank second and third nationally. The national average is $17,619 per student, up 6.61% from the prior year."
    - "Adjusted for cost of living, Vermont overtakes New York for the top spot, and Hawaii falls from 5th nationally to 45th, since its cost of living is nearly double the national norm."

  methodology: "Per-pupil spending is World Population Review's 2025 state education finance data. Cost-of-living-adjusted spending divides nominal spending by each state's MERIC cost-of-living index, where 100 equals the U.S. average."

  sources:
    - name: "World Population Review — Per Pupil Spending by State"
      url: "https://worldpopulationreview.com/state-rankings/per-pupil-spending-by-state"
      description: "2025 per-pupil K-12 spending by state and spending as a percentage of taxpayer income"
    - name: "EducationData.org — Public Education Spending Statistics"
      url: "https://educationdata.org/public-education-spending-statistics"
      description: "National federal, state, and local funding shares for K-12 public education"
    - name: "Missouri Economic Research and Information Center (MERIC) — Cost of Living Index"
      url: "https://meric.mo.gov/data/cost-living-data-series"
      description: "Annual average composite cost of living index by state, used to adjust nominal spending"

