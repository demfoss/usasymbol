- id: bar-exam-scores
  icon: fa-solid fa-scale-balanced
  title: Bar Exam Scores by State
  paragraphs:
  - Thirty-nine states use the Uniform Bar Exam, with cut scores between 260 and 270 on a 400-point scale. Eight states, including Utah and Alabama, set the floor at 260, while 18 states require 270.
  - California demands 1390 points on its 2000-point scale, and Delaware requires a scaled 145, the highest passing standard in the country. Delaware also caps candidates at four attempts.
  - Wisconsin sets the lowest written cut score at a scaled 129 but admits graduates of its two in-state law schools without any exam.
- id: easiest-bar-exams
  icon: fa-solid fa-graduation-cap
  title: Easiest Bar Exam States
  paragraphs:
  - Utah passed 82 percent of all takers in 2025, the highest rate in the country, and its 260 cut score ties for the nation's lowest. Minnesota followed at 77 percent.
  - Kansas reached 75 percent, with Idaho and Montana at 74. Wisconsin is a separate case, since graduates of Marquette and the University of Wisconsin skip the exam entirely under diploma privilege.
