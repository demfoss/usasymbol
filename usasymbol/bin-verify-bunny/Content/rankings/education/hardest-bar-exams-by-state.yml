page:
  h1: Hardest Bar Exams by State
  quick_answer:
  - Hardest bar exam by state data puts Alabama first with a 44 percent overall pass rate in 2025. Vermont follows at 49 percent, and Connecticut at 51.
  - California requires 1390 points on its 2000-point scale, and Delaware demands a scaled 145, the highest passing standard in the country. Neither state uses the Uniform Bar Exam.
  - Utah had the highest 2025 pass rate at 82 percent with a UBE cut score of 260, the lowest level any state uses. Wisconsin admits its own law graduates without an exam through diploma privilege.
  methodology: Pass rates combine February and July 2025 results for all examinees, as reported by the National Conference of Bar Examiners. Cut scores are each jurisdiction's published minimum as of July 2026.
  sources:
  - name: NCBE, Persons Taking and Passing the 2025 Bar Examination
    url: https://thebarexaminer.ncbex.org/2025-statistics/persons-taking-and-passing-the-2025-bar-examination/
    description: Official 2025 bar exam pass rates for all takers by jurisdiction
