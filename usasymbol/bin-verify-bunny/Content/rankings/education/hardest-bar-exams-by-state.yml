faq:
- question: What state has the hardest bar exam?
  answer: California combines a 1390 passing score on its 2000-point scale with a 58 percent pass rate in 2025, and Delaware sets the highest scaled standard at 145 with a four-attempt cap. By raw pass rate, Alabama was lowest at 44 percent, though its cut score of 260 is the country's minimum.
- question: What is the easiest bar exam to pass?
  answer: Utah recorded the highest 2025 pass rate at 82 percent and uses the lowest UBE cut score of 260. Wisconsin graduates of the state's two law schools skip the exam entirely under diploma privilege.
- question: Which state has the lowest bar exam pass rate?
  answer: Alabama, at 44 percent overall in 2025. Vermont followed at 49 percent, the only other state below 50.
- question: What score do you need to pass the bar exam?
  answer: UBE states set cut scores between 260 and 270 on a 400-point scale. Eight states use 260 and 18 require 270, while California asks for 1390 on its own 2000-point scale.
- question: How much does the bar exam cost?
  answer: First-time taker fees range from about $250 in New York and Indiana to $1,000 in Florida. California charges $677 for its exam.
- question: Which states have bar exam reciprocity?
  answer: The 39 Uniform Bar Exam states accept scores transferred from other UBE jurisdictions. Texas, for example, accepts UBE scores up to five years old. California, Florida, and Louisiana do not accept transferred scores and require their own exams.
