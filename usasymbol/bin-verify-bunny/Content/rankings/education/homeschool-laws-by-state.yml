page:
  h1: "Homeschool Laws by State"

  quick_answer:
    - "20 states and the District of Columbia set no instructional hours or days requirement at all for homeschoolers, the single largest group in this data."
    - "Compulsory attendance starts earliest, at age 5, in six states: Delaware, Maryland, New Mexico, Oklahoma, South Carolina, and Virginia. It starts latest, at age 8, only in Pennsylvania and Washington."
    - "California and the District of Columbia list no compulsory age range at all. Indiana ties its requirement to graduation instead of a fixed end age."

  methodology: "Compulsory attendance age range and instructional hours or days requirement reflect each state's homeschool law on record for 2026. This page is informational only and does not constitute legal advice."

