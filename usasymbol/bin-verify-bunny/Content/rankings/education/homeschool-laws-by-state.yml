sections:
  - id: "states-with-no-instructional-hour-requirements"
    icon: "fa-solid fa-circle-xmark"
    title: "States With No Homeschool Hour Requirements"
    paragraphs:
      - "20 states and the District of Columbia set no instructional hours or days requirement at all, including Texas, Michigan, New Jersey, and Oregon. Hawaii is a partial exception: it sets no hours requirement but still requires hours to be tracked."

  - id: "earliest-and-latest-compulsory-ages"
    icon: "fa-solid fa-clock"
    title: "Earliest and Latest Compulsory Attendance Ages"
    paragraphs:
      - "Compulsory attendance starts earliest, at age 5, in six states: Delaware, Maryland, New Mexico, Oklahoma, South Carolina, and Virginia. It starts latest, at age 8, only in Pennsylvania and Washington."
      - "California and the District of Columbia list no compulsory age range at all. South Dakota lists an end age of 18 but no start age."

  - id: "states-with-grade-tiered-hour-requirements"
    icon: "fa-solid fa-layer-group"
    title: "States With Grade-Tiered Hour Requirements"
    paragraphs:
      - "South Dakota, Montana, Nebraska, New York, New Mexico, and Pennsylvania break their hours requirement into separate tiers by grade band rather than a single total. South Dakota's is the most detailed: 437 hours for kindergarten, 875 hours for grades 1-5, and 962 hours for grades 6-12."

