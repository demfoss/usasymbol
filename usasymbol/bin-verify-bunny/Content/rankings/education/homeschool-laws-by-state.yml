faq:
  - question: "Which states have no homeschool hour requirements?"
    answer: "20 states and the District of Columbia, including Texas, Michigan, New Jersey, and Oregon."

  - question: "What age does compulsory homeschool attendance start?"
    answer: "It varies by state, from age 5 in Delaware, Maryland, New Mexico, Oklahoma, South Carolina, and Virginia, up to age 8 in Pennsylvania and Washington."

  - question: "Does Indiana have a fixed homeschool age requirement?"
    answer: "Indiana's compulsory attendance starts at age 7 and continues until graduation, rather than ending at a fixed age like most states."

  - question: "How many homeschool hours are required in Texas?"
    answer: "None. Texas sets no instructional hours or days requirement."

  - question: "What is the homeschool hours requirement in New York?"
    answer: "180 days, totaling 900 hours for grades 1-6 and 990 hours for grades 7-12."

  - question: "Does California list a compulsory homeschool age range?"
    answer: "No. California's age range is not listed in the source data, and its instructional requirement is listed as variable."

