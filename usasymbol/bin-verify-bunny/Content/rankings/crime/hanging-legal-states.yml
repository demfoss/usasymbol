sections:
- id: why-new-hampshire-still-has-a-hanging-provision
  icon: fa-solid fa-scale-balanced
  title: Why New Hampshire Still Has a Hanging Provision
  paragraphs:
  - New Hampshire's legislature repealed the death penalty in May 2019, but the repeal was not retroactive. One inmate sentenced before 2019 remains on death row under the old law, which allowed hanging as a backup method if the corrections commissioner found lethal injection impractical.
