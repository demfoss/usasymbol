  description: No state currently authorizes hanging for future death sentences. New Hampshire and Washington repealed their hanging provisions in 2019 and 2023.
page:
  h1: Hanging Legal States
  quick_answer:
  - No state currently authorizes hanging as an execution method for a future death sentence. New Hampshire's statute, which allowed hanging as a backup, applies only to one inmate sentenced before the state repealed the death penalty in 2019.
  - Washington authorized hanging as an inmate choice until its legislature formally repealed the death penalty in April 2023, three years after the state Supreme Court struck the law down in 2018.
  - Delaware limited hanging to crimes committed before June 13, 1986, and dismantled its gallows by 2003. Delaware eliminated capital punishment entirely in 2024.
  methodology: Status reflects each state's execution-method statute as of 2026. Only states with a documented hanging provision, active or repealed, are marked; all others have no record of authorizing hanging in modern statute.
