faq:
- question: Which states allow execution by hanging?
  answer: No state currently authorizes hanging for a future death sentence. New Hampshire's hanging provision applies only to one inmate sentenced before the state's 2019 repeal.
- question: Did Washington state allow hanging?
  answer: Washington allowed inmates to choose hanging over lethal injection and carried out two hangings, in 1993 and 1994. The legislature formally repealed the death penalty, including the hanging option, in April 2023.
- question: Is hanging still legal in New Hampshire?
  answer: New Hampshire's hanging statute survives only for one inmate sentenced before the state's May 2019 repeal of the death penalty. No future sentence can be carried out by hanging in the state.
- question: When was hanging last used as an execution method in the US?
  answer: Delaware carried out the last judicial hanging in the United States on January 25, 1996. Delaware limited hanging to crimes committed before June 13, 1986, and dismantled its gallows by 2003.
