sections:
- id: states-that-have-decriminalized-jaywalking
  icon: fa-solid fa-person-walking
  title: States That Have Decriminalized Jaywalking
  paragraphs:
  - Virginia acted first, amending Section 46.2-924 in March 2021 so officers can no longer stop a pedestrian for a crossing violation alone. Nevada followed in June 2021, turning jaywalking into a civil fine instead of a criminal misdemeanor.
  - California's Freedom to Walk Act took effect January 1, 2023, letting a pedestrian cross outside a crosswalk unless a reasonably careful person would see immediate danger of a collision. Only these 3 states have decriminalized jaywalking statewide as of 2026.
- id: cities-that-limit-jaywalking-enforcement-without-a-statewide-law
  icon: fa-solid fa-city
  title: Cities That Limit Jaywalking Enforcement Without a Statewide Law
  paragraphs:
  - Kansas City, Missouri repealed its local jaywalking ordinance in May 2021, becoming the first major U.S. city to fully drop the charge, even though Missouri state law still allows a citation elsewhere. New York City followed with Local Law 98 in June 2025, while New York state law remains unchanged.
  - Denver and Minneapolis have deprioritized jaywalking enforcement locally. Colorado and Minnesota state law still permits a citation outside those cities.
faq:
- question: Which states have decriminalized jaywalking?
  answer: Virginia, Nevada, and California are the only 3 states that have decriminalized jaywalking statewide. Virginia acted in 2021, Nevada in 2021, and California in 2023.
- question: Is jaywalking illegal in most states?
  answer: Yes. Jaywalking remains a chargeable offense under state law in 47 states. Only Virginia, Nevada, and California have removed criminal or civil liability statewide.
- question: Is jaywalking legal in New York?
  answer: New York state law still allows a citation for crossing outside a marked crosswalk. New York City repealed its own local jaywalking ordinance in June 2025 under Local Law 98, but that repeal does not extend to the rest of the state.
- question: When did California legalize jaywalking?
  answer: California's Freedom to Walk Act took effect January 1, 2023. It stops police from citing a pedestrian crossing outside a crosswalk unless there is immediate danger of a collision.
- question: Did Hawaii legalize jaywalking?
  answer: No. Senate Bill 2630 to decriminalize jaywalking passed the Hawaii Senate in March 2024, but it did not become law. Jaywalking remains a chargeable offense in Hawaii.
