page:
  h1: Jaywalking Laws by State
  quick_answer:
  - Jaywalking laws by state show only 3 states, Virginia, Nevada, and California, have decriminalized jaywalking statewide, while it remains a chargeable traffic offense under state law in the other 47 states.
  - Virginia was first to act, amending its pedestrian crossing statute in March 2021 to bar officers from stopping a pedestrian for a crossing violation alone. Nevada followed in June 2021, converting jaywalking from a criminal misdemeanor into a civil fine.
  - California's Freedom to Walk Act took effect January 1, 2023, and stops police from citing a pedestrian crossing outside a crosswalk unless a reasonably careful person would see immediate danger of a collision.
  methodology: Status reflects each state's pedestrian crossing statute as of 2026. A state counts as decriminalized only where the legislature removed criminal or civil liability for crossing outside a marked crosswalk absent an immediate collision danger.
  sources:
  - name: Virginia Code Ann. Section 46.2-924 (2021 amendment)
    url: https://law.lis.virginia.gov/vacode/46.2-924/
    description: Virginia pedestrian crossing statute barring stops for jaywalking alone
  - name: California Vehicle Code Section 21955 (AB 2147, Freedom to Walk Act)
    url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202120220AB2147
    description: California's 2022 law decriminalizing jaywalking absent immediate collision danger, effective January 1, 2023
  - name: America Walks — The Progress of Jaywalking Reform
    url: https://americawalks.org/jaywalking-reform-progress/
    description: Tracker of state and city jaywalking decriminalization efforts
