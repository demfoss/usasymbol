  description: "Montana has the highest past-year methamphetamine use rate at 1.99%. Maryland is lowest at 0.43%, according to SAMHSA's 2023-2024 survey."

page:
  h1: "Meth Use by State"

  quick_answer:
    - "Montana has the highest past-year methamphetamine use rate of any state at 1.99% of people aged 12 or older, according to SAMHSA's 2023-2024 survey."
    - "West Virginia ranks second at 1.77%, followed by New Mexico at 1.75% and Alaska at 1.62%. All four exceed the national rate of 0.88%."
    - "Maryland has the lowest rate at 0.43%, less than a quarter of Montana's figure. New Jersey is second-lowest at 0.48%, and Connecticut is third at 0.49%."

  methodology: "Rates come from SAMHSA's 2023-2024 National Survey on Drug Use and Health, small area estimation, past-year methamphetamine use among people aged 12 or older, annual average percentages."

  sources:
    - name: "SAMHSA, National Survey on Drug Use and Health, 2023-2024 State Prevalence Estimates"
      url: "https://www.samhsa.gov/data/data-we-collect/nsduh-national-survey-drug-use-and-health/state-releases/2023-2024"
      description: "Table 12, Methamphetamine Use in the Past Year, by age group and state, annual average percentages, 2023-2024"

