sections:
  - id: "states-with-the-highest-meth-use-rate"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest Meth Use Rate"
    paragraphs:
      - "Montana leads at 1.99%, more than double the national rate of 0.88%. West Virginia follows at 1.77%, and New Mexico is third at 1.75%."
      - "Alaska ranks fourth at 1.62%, and Kentucky is fifth at 1.54%. All five top states are more rural than the national average population density."

  - id: "states-with-the-lowest-meth-use-rate"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Meth Use Rate"
    paragraphs:
      - "Maryland has the lowest rate at 0.43%, less than a quarter of Montana's 1.99%. New Jersey follows at 0.48%, and Connecticut is third-lowest at 0.49%."
      - "Virginia and Rhode Island round out the bottom five at 0.52% and 0.55%. All five sit well below the national rate of 0.88%."

