faq:
  - question: "Which state has the highest rate of meth use?"
    answer: "Montana has the highest past-year methamphetamine use rate at 1.99% of people aged 12 or older. That is more than double the national rate of 0.88%."

  - question: "Which state has the lowest rate of meth use?"
    answer: "Maryland has the lowest rate at 0.43%. New Jersey is second-lowest at 0.48%, and Connecticut is third at 0.49%."

  - question: "What is the meth use rate in Montana?"
    answer: "Montana's past-year methamphetamine use rate is 1.99%, the highest of any state in the 2023-2024 survey."

  - question: "What is the national rate of methamphetamine use?"
    answer: "The national past-year methamphetamine use rate is 0.88% among people aged 12 or older. Twenty-four states exceed that figure."

  - question: "How is methamphetamine use by state measured?"
    answer: "Rates are drawn from SAMHSA's National Survey on Drug Use and Health, which uses small area estimation to model past-year use among people aged 12 or older by state."

