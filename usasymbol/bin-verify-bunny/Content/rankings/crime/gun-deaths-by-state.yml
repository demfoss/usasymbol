page:
  h1: Gun Deaths by State
  quick_answer:
  - Texas recorded the most firearm deaths of any state in 2024, with 4,389 total deaths, according to CDC WONDER data.
  - Florida ranks second at 3,191 deaths, followed by California at 2,853 and Georgia at 1,985. These are the only four states above 1,900 total deaths.
  - Rhode Island recorded the fewest firearm deaths at 55, just below Hawaii's 56. Both states are far below the national count of 44,447.
  methodology: Totals reflect all firearm deaths, including suicide, homicide, accidental, and undetermined causes, reported to the CDC WONDER Underlying Cause of Death database for 2024. Raw totals are driven heavily by state population size.
  sources:
  - name: KFF State Health Facts — Firearm Deaths (CDC WONDER data)
