sections:
- id: states-with-the-most-total-firearm-deaths
  icon: fa-solid fa-triangle-exclamation
  title: States With the Most Total Firearm Deaths
  paragraphs:
  - Texas recorded 4,389 firearm deaths in 2024, the most of any state and well above Florida's 3,191 in second place. California follows at 2,853, and Georgia is fourth at 1,985.
  - All four of the top states rank among the ten most populous in the country. North Carolina rounds out the top five at 1,835, the last state above 1,800 total deaths.
- id: states-with-the-fewest-total-firearm-deaths
  icon: fa-solid fa-arrow-trend-down
  title: States With the Fewest Total Firearm Deaths
  paragraphs:
  - Rhode Island recorded the fewest firearm deaths in 2024 at 55, just below Hawaii's 56. Vermont is third-lowest at 76.
  - North Dakota follows at 95 and Delaware at 123, the only other states under 150. All five of the lowest states rank among the least populous in the country.
faq:
- question: What state has the most gun deaths?
  answer: Texas recorded the most firearm deaths in 2024 at 4,389, ahead of Florida at 3,191 and California at 2,853.
- question: What state has the fewest gun deaths?
  answer: Rhode Island recorded the fewest firearm deaths at 55, just below Hawaii's 56 and Vermont's 76.
- question: How many gun deaths were there in Texas in 2024?
  answer: Texas recorded 4,389 total firearm deaths in 2024, the highest raw count of any state.
- question: How many gun deaths were there nationwide in 2024?
  answer: The United States recorded 44,447 total firearm deaths in 2024, according to CDC WONDER data.
- question: How many gun deaths were there in California in 2024?
  answer: California recorded 2,853 total firearm deaths in 2024, the third-highest raw count of any state.
