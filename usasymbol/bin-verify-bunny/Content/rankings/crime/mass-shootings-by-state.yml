sections:
- id: states-with-the-most-mass-shootings
  icon: fa-solid fa-triangle-exclamation
  title: States With the Most Mass Shootings
  paragraphs:
  - California has recorded 27 mass shootings since 1982, the most of any state. Texas follows at 15, and Florida is third at 13.
  - Colorado ranks fourth at 8, and Washington is fifth at 7. New York and Pennsylvania tie for sixth at 6 each.
- id: states-with-no-recorded-mass-shootings
  icon: fa-solid fa-circle-minus
  title: States With No Recorded Mass Shootings
  paragraphs:
  - 'Eight states have recorded no incidents meeting Mother Jones'' mass shooting criteria since 1982: Alaska, Delaware, North Dakota, South Dakota, Vermont, West Virginia, Wyoming, and New Hampshire.'
  - Twenty-one states have recorded exactly 1 incident since 1982, including Hawaii, Iowa, and Massachusetts.
