faq:
- question: Which state has had the most mass shootings?
  answer: California has recorded the most mass shootings since 1982, at 27. Texas ranks second at 15.
- question: How many mass shootings has Texas had?
  answer: Texas has recorded 15 mass shootings since 1982, the second-highest total of any state, behind California's 27.
- question: Which states have never had a mass shooting?
  answer: 'Eight states have recorded no incidents meeting Mother Jones'' mass shooting criteria since 1982: Alaska, Delaware, New Hampshire, North Dakota, South Dakota, Vermont, West Virginia, and Wyoming.'
- question: How is a mass shooting defined in this data?
  answer: Mother Jones counts indiscriminate rampage shootings in public places that killed three or more people, excluding gang violence, armed robbery, and shootings confined to a single private home.
- question: How many mass shootings has the United States had since 1982?
  answer: The Mother Jones database recorded 160 mass shootings across 42 states from 1982 through 2026, excluding an incident in Washington, D.C.
