page:
  h1: Mass Shootings by State
  quick_answer:
  - California has recorded the most mass shootings of any state since 1982, at 27, according to Mother Jones' US Mass Shootings Database.
  - Texas ranks second at 15, followed by Florida at 13 and Colorado at 8.
  - 42 states have recorded at least one mass shooting since 1982. Eight states have recorded none in this database.
  methodology: Counts reflect Mother Jones' US Mass Shootings Database, 1982 through 2026, which tracks indiscriminate rampage shootings in public places that killed three or more people, excluding conventional crimes such as gang violence, armed robbery, and shootings confined to a single private home.
