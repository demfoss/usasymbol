sections:
- id: states-with-the-highest-recidivism-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Recidivism Rate
  paragraphs:
  - Alaska reports the highest recidivism rate at 57% for its 2020 release cohort, though that figure includes jail returns, not just state prison. Hawaii follows at 53% for its 2016 cohort, a measure of arrest or reconviction rather than reincarceration.
  - Connecticut and South Dakota tie for third at 50%, and Delaware also reports 50%. Pennsylvania is sixth at 47%, counting reincarceration or a new arrest.
- id: states-with-the-lowest-recidivism-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Recidivism Rate
  paragraphs:
  - Oregon reports the lowest recidivism rate at 12% for its 2021 cohort, though that figure counts reincarceration for a new felony only, a narrower measure than most states use. Texas and California follow, both at 17%.
  - Virginia, Utah, and Oklahoma tie at 18%. New York is next lowest at 19%, the only state between 17% and 20%.
faq:
- question: What state has the highest recidivism rate?
  answer: Alaska reports the highest recidivism rate at 57% for its 2020 release cohort, though the figure includes jail returns in addition to state prison.
- question: What state has the lowest recidivism rate?
  answer: Oregon reports the lowest recidivism rate at 12% for its 2021 cohort, a narrower measure counting only reincarceration for a new felony.
- question: What is the recidivism rate in Texas?
  answer: Texas reports a recidivism rate of 17% for its 2021 release cohort, tied with California for the second-lowest rate in the table.
- question: Why do recidivism rates vary so much between states?
  answer: States use different definitions and follow-up periods. Minnesota counts only reconviction, Oregon counts only reincarceration for a new felony, and Alaska's 57% figure includes jail as well as prison returns, so figures are not directly comparable.
- question: What is the recidivism rate in California?
  answer: California reports a recidivism rate of 17% for its 2020 release cohort, tied with Texas for the second-lowest rate in the table.
