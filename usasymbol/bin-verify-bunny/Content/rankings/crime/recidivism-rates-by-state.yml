page:
  h1: Recidivism Rates by State
  quick_answer:
  - Alaska reports the highest state prisoner recidivism rate in the country at 57% for its 2020 release cohort, according to state corrections data compiled by the CSG Justice Center.
  - Hawaii ranks second at 53% for its 2016 cohort, followed by Connecticut and South Dakota, tied at 50%. Delaware also reports 50%.
  - Oregon reports the lowest recidivism rate at 12% for its 2021 cohort, measuring reincarceration for a new felony only. Texas and California are next lowest, both at 17%.
  methodology: Rates come from each state's most recent published corrections recidivism study, as compiled by the CSG Justice Center. There is no standardized national definition of recidivism; follow-up periods, release cohort years, and what counts as recidivism vary by state, so figures are not directly comparable across states.
  sources:
  - name: 'CSG Justice Center — 50 States, 1 Goal: Recidivism Rate Trends'
    url: https://csgjusticecenter.org/publications/state-recidivism-rates-2006-2022/
    description: Compilation of each state's most recent published prisoner recidivism rate, sourced from individual state department of corrections studies
