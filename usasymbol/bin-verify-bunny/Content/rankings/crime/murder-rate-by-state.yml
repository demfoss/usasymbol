sections:
- id: states-with-the-highest-murder-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Murder Rate
  paragraphs:
  - Louisiana leads the table at 10.8 murders per 100,000 residents, with New Mexico close behind at 10.5. Alabama ranks third at 8.7, well ahead of Tennessee at 7.9 in fourth.
  - North Carolina and South Carolina tie for sixth at 7.5. Missouri sits between the top three and that pair at 7.8, the only state between 7.5 and 8.7.
- id: states-with-the-lowest-murder-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Murder Rate
  paragraphs:
  - New Hampshire has the lowest murder rate at 1.0 per 100,000, the only state below 1.5. Hawaii and Idaho tie for second-lowest at 1.6, and Massachusetts follows at 1.8.
  - Iowa, Nebraska, and Rhode Island tie at 2.1, the only three-way tie in the table. All three sit well below the national rate of 5.0 reported by the FBI for 2024.
faq:
- question: What state has the highest murder rate?
  answer: Louisiana has the highest murder rate at 10.8 per 100,000 residents in 2024, just ahead of New Mexico at 10.5.
- question: What state has the lowest murder rate?
  answer: New Hampshire has the lowest murder rate at 1.0 per 100,000. Hawaii and Idaho follow, tied at 1.6.
- question: What is the murder rate in Texas?
  answer: Texas has a murder rate of 5.2 per 100,000, tied with Michigan for 20th highest in the table.
- question: Which state has the highest murder rate per capita?
  answer: Louisiana ranks first per capita at 10.8 murders per 100,000 residents, ahead of New Mexico at 10.5 and Alabama at 8.7.
- question: What is the murder rate in California?
  answer: California has a murder rate of 4.5 per 100,000, tied with Colorado, ranking 27th among the states.
