page:
  h1: Murder Rate by State
  quick_answer:
  - Louisiana has the highest murder rate in the nation at 10.8 per 100,000 residents in 2024, according to FBI data.
  - New Mexico ranks second at 10.5, just 0.3 points behind Louisiana. Alabama is third at 8.7, more than a point ahead of fourth-place Tennessee at 7.9.
  - New Hampshire has the lowest murder rate at 1.0 per 100,000, less than a tenth of Louisiana's rate. Hawaii and Idaho tie for second-lowest at 1.6.
  methodology: Rates reflect FBI Uniform Crime Reporting murders and non-negligent manslaughter per 100,000 residents for 2024, as published in FBI Crime in the United States, Table 5.
