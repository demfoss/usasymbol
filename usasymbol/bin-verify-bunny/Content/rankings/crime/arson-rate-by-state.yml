page:
  h1: "Arson Rate by State"

  quick_answer:
    - "Kansas has the highest arson rate of any state, at 62.6 reported cases per 100,000 residents from 2017 through 2021."
    - "West Virginia ranks second at 44.4 per 100,000, followed by Missouri at 31.6 and Illinois at 27.8. Texas logs the most raw cases at 3,835, but ranks 12th by rate at 13.2."
    - "Alaska has the lowest rate at 0.1 per 100,000, with just 1 reported case over the five-year span. Hawaii is second-lowest at 0.2."

  methodology: "Rates reflect arson cases per 100,000 residents from 2017 through 2021, reported by the ATF's United States Bomb Data Center through its Bomb Arson Tracking System. FBI UCR arson participation varies by state and year, so no clean single-year FBI state table exists; ATF notes its real-time reporting likely undercounts actual arson totals."

  sources:
    - name: "ATF United States Bomb Data Center — Arson Incident Reports (2017-2021)"
      url: "https://www.atf.gov/explosives/arson"
      description: "Federal Bureau of Alcohol, Tobacco, Firearms and Explosives division tracking reported arson incidents through the Bomb Arson Tracking System (BATS)."
