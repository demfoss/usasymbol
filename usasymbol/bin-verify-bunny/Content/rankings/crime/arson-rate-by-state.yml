faq:
  - question: "Which state has the highest arson rate?"
    answer: "Kansas has the highest rate at 62.6 cases per 100,000 residents from 2017 to 2021. West Virginia is second at 44.4, and Missouri third at 31.6."

  - question: "Which state has the lowest arson rate?"
    answer: "Alaska has the lowest rate at 0.1 per 100,000, with just 1 reported case over the five-year span. Hawaii is second-lowest at 0.2."

  - question: "Which state has the most arson cases overall?"
    answer: "Texas has the most raw cases at 3,835 from 2017 to 2021. Its rate of 13.2 per 100,000 ranks 12th, well below Kansas's 62.6."

  - question: "How is the arson rate by state measured?"
    answer: "Rates reflect arson cases per 100,000 residents reported to the ATF's Bomb Arson Tracking System from 2017 through 2021. The ATF notes its real-time reporting likely undercounts actual arson totals."

  - question: "What is the arson rate in West Virginia?"
    answer: "West Virginia has the second-highest rate at 44.4 cases per 100,000, with 796 total cases from 2017 to 2021, despite being one of the smaller states by population."

