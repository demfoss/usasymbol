page:
  h1: Most Dangerous States
  quick_answer:
  - Alaska has the highest violent crime rate in the nation at 724.1 per 100,000 residents in 2024, according to FBI Uniform Crime Reporting data.
  - New Mexico ranks second at 717.1, just 7 points behind Alaska. Tennessee is third at 592.3, followed by Arkansas at 579.4 and Louisiana at 519.8.
  - The national violent crime rate was 359.1 per 100,000 in 2024. All five of the top states rank well above that average.
  methodology: Rates reflect violent crime, murder, rape, robbery, and aggravated assault combined, per 100,000 residents reported to the FBI Uniform Crime Reporting Program for 2024.
  sources:
  - name: FBI Crime Data Explorer — Estimated Crimes in the United States
    url: https://cde.ucr.cjis.gov/
    description: State-level violent crime rate per 100,000 population for 2024
