sections:
- id: most-dangerous-states-by-violent-crime-rate
  icon: fa-solid fa-triangle-exclamation
  title: Most Dangerous States by Violent Crime Rate
  paragraphs:
  - Alaska tops the table at 724.1 violent crimes per 100,000 residents, barely ahead of New Mexico's 717.1. Tennessee is a distant third at 592.3.
  - Arkansas follows at 579.4 and Louisiana at 519.8, rounding out the top five. All five states sit at least 160 points above the national rate of 359.1.
- id: states-with-a-violent-crime-rate-above-the-national-average
  icon: fa-solid fa-chart-line
  title: States With a Violent Crime Rate Above the National Average
  paragraphs:
  - California ranks sixth at 486.0 per 100,000, the most populous state in the top ten. Colorado follows at 476.3 and Missouri at 462.0.
  - Kansas and South Carolina sit close together at 438.7 and 436.7. Alabama is the last state above the national average of 359.1, at 359.9.
faq:
- question: What is the most dangerous state in America?
  answer: Alaska has the highest violent crime rate at 724.1 per 100,000 residents in 2024, just ahead of New Mexico at 717.1.
- question: What state has the second highest crime rate?
  answer: New Mexico ranks second at 717.1 violent crimes per 100,000, only 7 points behind top-ranked Alaska.
- question: What is the violent crime rate in Texas?
  answer: Texas has a violent crime rate of 389.4 per 100,000, ranking 17th, above the national average of 359.1.
- question: Which states are the most dangerous?
  answer: Alaska, New Mexico, Tennessee, Arkansas, and Louisiana are the five states with the highest violent crime rates, all above 519 per 100,000 in 2024.
- question: What is the violent crime rate in California?
  answer: California has a violent crime rate of 486.0 per 100,000, ranking sixth among the states.
