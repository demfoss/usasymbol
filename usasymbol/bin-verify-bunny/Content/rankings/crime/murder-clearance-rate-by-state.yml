seo:
  title: "Murder Clearance Rate by State | Map & Solve Rates"
  description: "North Dakota clears 98.5% of murders, the highest rate of any state. Ohio clears just 41.1%, the lowest, per Murder Accountability Project data."

page:
  h1: "Murder Clearance Rate by State"

  quick_answer:
    - "The murder clearance rate is highest in North Dakota, where 98.5% of homicides from 2013 to 2022 were solved, the top rate of any state."
    - "Maine follows at 82.7%, and Alaska at 80.9%. All three states recorded fewer than 550 total murders over the decade, a small caseload compared to larger states."
    - "Ohio has the lowest clearance rate at 41.1%, followed by New Mexico at 41.6% and Indiana at 43.0%. Illinois lacks usable state-level clearance data and is omitted."

  methodology: "Rates reflect the share of murders and non-negligent manslaughters cleared by arrest or exceptional means from 2013 to 2022, as compiled by the Murder Accountability Project from FBI homicide data. Single-year state clearance tables are not published in a usable form, so this cumulative decade rate is used instead."

  sources:
    - name: "Murder Accountability Project"
      url: "https://www.murderdata.org/"
      description: "Nonprofit that compiles FBI Uniform Crime Reporting homicide and clearance data by state and agency."
    - name: "24/7 Wall St. — States Where the Most Murders Go Unsolved"
      url: "https://247wallst.com/special-report/2023/12/14/states-where-the-most-murders-go-unsolved/"
      description: "State-by-state tabulation of Murder Accountability Project clearance data for 2013-2022; used here for the full state breakdown."

