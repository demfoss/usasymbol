sections:
  - id: "states-that-solve-the-most-murders"
    icon: "fa-solid fa-magnifying-glass"
    title: "States That Solve the Most Murders"
    paragraphs:
      - "North Dakota cleared 195 of its 198 murders from 2013 to 2022, a 98.5% clearance rate, the highest in the country. Maine follows at 82.7%, clearing 186 of 225 murders."
      - "Alaska and Nebraska are close behind at 80.9% and 80.8%. Among larger states, Nevada stands out at 73.4%, clearing 1,451 of 1,978 murders over the decade."

  - id: "states-with-the-most-unsolved-murders"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Most Unsolved Murders"
    paragraphs:
      - "Ohio has the lowest clearance rate at 41.1%, solving 2,518 of 6,125 murders from 2013 to 2022. New Mexico is second-lowest at 41.6%, and Indiana third at 43.0%."
      - "Massachusetts and Michigan also rank low, at 45.6% and 45.9%. California, the largest state, clears 61.2% of its murders, above the national range of the lowest-performing states."

faq:
  - question: "Which state has the highest murder clearance rate?"
    answer: "North Dakota has the highest clearance rate at 98.5%, solving 195 of 198 murders from 2013 to 2022. Maine ranks second at 82.7%."

  - question: "Which state has the lowest murder clearance rate?"
    answer: "Ohio has the lowest clearance rate at 41.1%. New Mexico follows at 41.6%, and Indiana at 43.0%."

  - question: "What is the murder clearance rate in California?"
    answer: "California clears 61.2% of its murders, solving 11,789 of 19,261 cases from 2013 to 2022, ranking 27th among states with usable data."

  - question: "What is the murder clearance rate in Texas?"
    answer: "Texas clears 62.3% of its murders, solving 9,513 of 15,266 cases over the same 10-year period, ranking 24th."

  - question: "Why is Illinois missing from murder clearance rate data?"
    answer: "Illinois lacks usable state-level clearance figures in Murder Accountability Project data, so it is omitted here rather than shown with an invented value."

