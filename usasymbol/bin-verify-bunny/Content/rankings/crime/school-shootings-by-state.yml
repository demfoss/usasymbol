faq:
- question: Which state has the most school shootings?
  answer: Texas has logged the most K-12 gunfire-on-school-grounds incidents since 2013, at 100. California ranks second at 84.
- question: Which state has the fewest school shootings?
  answer: Rhode Island, New Hampshire, and Wyoming each recorded just 1 incident since 2013, the fewest of any state.
- question: How many school shootings has Texas had?
  answer: Texas has logged 100 K-12 gunfire-on-school-grounds incidents since 2013, the most of any state in the Everytown Research database.
- question: How is a school shooting defined in this data?
  answer: Everytown Research counts any instance where a firearm discharges inside a K-12 school building or on school grounds, regardless of whether anyone is injured or killed.
- question: How many school shooting incidents have occurred nationwide since 2013?
  answer: The Everytown Research database recorded 1,158 K-12 gunfire-on-school-grounds incidents nationwide from 2013 through 2025.
