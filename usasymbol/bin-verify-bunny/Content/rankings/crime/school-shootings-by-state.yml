page:
  h1: School Shootings by State
  quick_answer:
  - Texas has the most K-12 gunfire-on-school-grounds incidents of any state since 2013 at 100, according to Everytown Research's Gunfire on School Grounds database.
  - California ranks second at 84 incidents, followed by Georgia at 71 and Ohio at 57.
  - Rhode Island, New Hampshire, and Wyoming each recorded the fewest incidents, at just 1 since 2013.
  methodology: Counts reflect K-12 incidents where a firearm discharged inside a school building or on school grounds, from 2013 through 2025, tracked in Everytown Research's Gunfire on School Grounds database. Counts include any discharge regardless of injury, intent, or casualties.
