sections:
- id: states-with-the-most-school-shooting-incidents
  icon: fa-solid fa-school-circle-exclamation
  title: States With the Most School Shooting Incidents
  paragraphs:
  - Texas has logged 100 K-12 gunfire-on-school-grounds incidents since 2013, the most of any state. California follows at 84, and Georgia is third at 71.
  - Ohio ranks fourth at 57, and Florida is fifth at 51. Michigan and North Carolina tie for sixth at 48 each.
- id: states-with-the-fewest-school-shooting-incidents
  icon: fa-solid fa-arrow-trend-down
  title: States With the Fewest School Shooting Incidents
  paragraphs:
  - Rhode Island, New Hampshire, and Wyoming each recorded just 1 incident since 2013, the fewest of any state. Vermont and Montana each recorded 2.
  - Hawaii, South Dakota, and North Dakota each logged 3 incidents. Alaska, Idaho, and West Virginia each recorded 4.
