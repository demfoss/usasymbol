page:
  h1: Executions by State Since 1976
  quick_answer:
  - Texas has carried out 600 executions since 1976, the most of any state and more than the next four states, Florida, Oklahoma, Virginia, and Missouri, combined.
  - Florida ranks second with 137 executions, followed by Oklahoma at 132 and Virginia at 113.
  - Sixteen states have carried out zero executions since 1976, including New York, Michigan, and Wisconsin, all of which have since abolished the death penalty.
  methodology: Execution totals count state-carried-out executions since the Supreme Court's 1976 Gregg v. Georgia ruling reinstated capital punishment, based on Death Penalty Information Center execution records current through July 2026.
