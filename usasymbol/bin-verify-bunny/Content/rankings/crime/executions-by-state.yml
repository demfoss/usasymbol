sections:
- id: states-with-the-most-executions-since-1976
  icon: fa-solid fa-chart-column
  title: States With the Most Executions Since 1976
  paragraphs:
  - Texas has executed 600 people since 1976, more than triple second-place Florida's 137. Oklahoma follows at 132, and Virginia at 113. Missouri rounds out the top five at 102.
  - Alabama ranks sixth at 83 executions, ahead of Georgia's 77 and Ohio's 56. South Carolina and Arizona both exceed 40, at 50 and 43 respectively.
- id: states-with-no-executions-since-1976
  icon: fa-solid fa-ban
  title: States With No Executions Since 1976
  paragraphs:
  - 'Sixteen states have carried out no executions since 1976: Alaska, Hawaii, Iowa, Kansas, Maine, Massachusetts, Michigan, Minnesota, New Hampshire, New Jersey, New York, North Dakota, Rhode Island, Vermont, West Virginia, and Wisconsin. Kansas reinstated the death penalty in 1994 but has never used it.'
faq:
- question: Which state has executed the most people since 1976?
  answer: Texas has carried out 600 executions since 1976, more than four times Alabama's total of 83, the sixth-highest state.
- question: How many executions has Florida carried out since 1976?
  answer: Florida has carried out 137 executions since 1976, the second-highest total after Texas.
- question: Which states have never executed anyone since 1976?
  answer: Sixteen states have carried out zero executions since 1976, including New York, Michigan, Wisconsin, and Massachusetts. All sixteen have since abolished the death penalty.
- question: How many executions has Oklahoma carried out?
  answer: Oklahoma has executed 132 people since 1976, the third-highest total among all states, behind Texas and Florida.
- question: How many total executions have there been in the US since 1976?
  answer: The United States has carried out 1,675 executions since 1976, spread across 34 states and the federal government. Texas alone accounts for roughly a third of that total.
