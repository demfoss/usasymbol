faq:
- question: What state has the highest crime rate?
  answer: New Mexico has the highest combined crime rate at 3,468.2 per 100,000 residents in 2024, driven by the highest property crime rate in the table at 2,751.1.
- question: What state has the lowest crime rate?
  answer: Idaho has the lowest combined crime rate at 966.9 per 100,000, the only state under 1,000. Its property crime rate of 736.3 is also the lowest of any state.
- question: Which state has the highest violent crime rate?
  answer: Alaska has the highest violent crime rate at 724.1 per 100,000, just ahead of New Mexico at 717.1. Both are more than double the combined-rate rank leader's violent figure alone would suggest.
- question: What is the crime rate in Texas?
  answer: Texas has a combined crime rate of 2,429.9 per 100,000, ranking 12th, with a violent crime rate of 389.4 and a property crime rate of 2,040.5.
- question: Which state has the highest property crime rate?
  answer: New Mexico has the highest property crime rate at 2,751.1 per 100,000, followed by Colorado at 2,592.8.
