- id: states-with-the-highest-property-crime-rate
  icon: fa-solid fa-house-circle-exclamation
  title: States With the Highest Property Crime Rate
  paragraphs:
  - New Mexico logs the highest property crime rate at 2,751.1 per 100,000, ahead of Colorado at 2,592.8. Washington is third at 2,466.5, driven by burglary, larceny-theft, and motor vehicle theft.
  - Oregon follows at 2,388.0 and Louisiana at 2,296.4. Idaho sits at the opposite end with a property crime rate of just 736.3, the lowest of any state.
