sections:
- id: states-with-the-highest-violent-crime-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Violent Crime Rate
  paragraphs:
  - Alaska posts the highest violent crime rate in the table at 724.1 per 100,000, narrowly ahead of New Mexico at 717.1. Tennessee follows at 592.3, and Arkansas is fourth at 579.4.
  - Louisiana rounds out the top five at 519.8. New Mexico still leads the combined ranking overall because its property crime rate of 2,751.1 is also the highest in the table.
