page:
  h1: Crime Rate by State
  quick_answer:
  - New Mexico has the highest crime rate in the nation at 3,468.2 incidents per 100,000 residents in 2024, combining FBI violent and property crime data.
  - Idaho has the lowest combined rate at 966.9 per 100,000, roughly a quarter of New Mexico's total and the only state under 1,000.
  - Colorado ranks second overall at 3,069.1, driven mostly by property crime at 2,592.8 per 100,000, the second-highest property rate of any state.
  methodology: Combined rate adds each state's 2024 violent crime rate (murder, rape, robbery, aggravated assault) and property crime rate (burglary, larceny-theft, motor vehicle theft) per 100,000 residents, as reported to the FBI Crime Data Explorer.
  sources:
  - name: FBI Crime Data Explorer
    url: https://cde.ucr.cjis.gov/
    description: State-level violent and property crime rates per 100,000 population, 2024 data
