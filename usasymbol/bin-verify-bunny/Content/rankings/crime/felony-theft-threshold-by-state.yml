sections:
- id: states-with-the-highest-felony-theft-threshold
  icon: fa-solid fa-arrow-trend-up
  title: States With the Highest Felony Theft Threshold
  paragraphs:
  - Texas and Wisconsin both require $2,500 in stolen value before prosecutors can file a felony theft charge, the highest bar of any state. Colorado, Connecticut, Pennsylvania, and South Carolina follow at $2,000.
  - Ten states, including Georgia, Kansas, Maryland, and Utah, set the line at $1,500. Massachusetts and Nevada sit just below that group at $1,200.
- id: states-with-the-lowest-felony-theft-threshold
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Felony Theft Threshold
  paragraphs:
  - New Jersey sets the lowest felony theft threshold in the country at $200 under N.J.S.A. 2C:20-2, meaning theft worth just a few hundred dollars can bring a felony charge. Alabama, Illinois, and New Mexico follow at $500.
  - California's $950 threshold, set by Proposition 47 in 2014, sits just under the $1,000 mark used by 20 states, the largest single cluster in the table.
faq:
- question: What is the felony theft threshold in my state?
  answer: It ranges from $200 in New Jersey to $2,500 in Texas and Wisconsin. The most common threshold, used by 20 states, is $1,000.
- question: Which state has the highest felony theft threshold?
  answer: Texas and Wisconsin tie for the highest threshold at $2,500. Colorado, Connecticut, Pennsylvania, and South Carolina are next at $2,000.
- question: Which state has the lowest felony theft threshold?
  answer: New Jersey has the lowest threshold in the country at $200, under N.J.S.A. 2C:20-2. That is $300 below the next-lowest group of states at $500.
- question: What is the felony theft threshold in California?
  answer: California's threshold is $950 under Penal Code 487, set when voters approved Proposition 47 in 2014. It sits just below the $1,000 line used by 20 other states.
- question: How much theft is a felony in Texas?
  answer: Theft of $2,500 or more is a state jail felony in Texas under Penal Code 31.03. Texas ties Wisconsin for the highest felony theft threshold in the country.
