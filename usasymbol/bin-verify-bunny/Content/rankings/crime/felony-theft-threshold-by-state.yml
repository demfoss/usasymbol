page:
  h1: Felony Theft Threshold by State
  quick_answer:
  - Felony theft threshold by state ranges from $200 in New Jersey to $2,500 in Texas and Wisconsin, the amount of stolen money or property that turns a theft charge from a misdemeanor into a felony.
  - $1,000 is the most common threshold, used by 20 states including Arizona, Kentucky, New York, and Virginia. Only New Jersey sets its line below $500.
  - California's threshold sits at $950 under Penal Code 487, just below the $1,000 mark used by most states, while Massachusetts and Nevada both set the line at $1,200.
  methodology: Thresholds reflect current state penal code provisions defining the dollar value that separates misdemeanor theft from felony theft, current as of 2026. Some states use additional tiers above the base felony line for higher-value theft.
  sources:
  - name: State penal codes, via Justia U.S. Law and state legislature statute text
    url: https://law.justia.com/codes/louisiana/2022/revised-statutes/title-14/rs-14-67/
    description: Primary state statute text defining felony theft dollar thresholds, spot-checked per state (e.g. Louisiana R.S. 14:67, California Penal Code 487, Texas Penal Code 31.03)
