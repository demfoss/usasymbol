sections:
- id: states-with-the-harshest-incest-penalties
  icon: fa-solid fa-gavel
  title: States With the Harshest Incest Penalties
  paragraphs:
  - Georgia's range runs from 10 to 30 years, rising to 25 to 50 years if the victim is under 14, one of the harshest sentencing ranges in the country. New York's most serious degree carries 10 to 25 years, and Massachusetts allows up to 20 years.
  - Nevada classifies incest as a category A felony with a sentence of 2 years to life with the possibility of parole. Texas sets parent-child incest as a second-degree felony, 2 to 20 years plus a fine of up to $10,000.
- id: states-that-treat-incest-as-less-than-a-felony
  icon: fa-solid fa-scale-balanced
  title: States That Treat Incest as Less Than a Felony
  paragraphs:
  - Delaware is the only state that classifies incest as a misdemeanor, a class A misdemeanor under 11 Del. C. Section 766. Every other state that criminalizes incest treats it as a felony.
  - New Jersey and Rhode Island do not criminalize incest between consenting adults at all, the only 2 states in the country. New Jersey sets the age at 18, Rhode Island at 16, and both still prohibit incestuous marriage.
faq:
- question: Is incest a felony in most states?
  answer: Yes. 47 states classify incest as a felony. Delaware is the only state that treats it as a misdemeanor, and New Jersey and Rhode Island do not criminalize it between consenting adults.
- question: Which states don't criminalize incest between consenting adults?
  answer: New Jersey and Rhode Island are the only 2 states. New Jersey sets the age of consent for this exception at 18, and Rhode Island sets it at 16. Both states still prohibit incestuous marriage.
- question: What state has the harshest incest penalty?
  answer: Georgia's range runs from 10 to 30 years, rising to 25 to 50 years if the victim is under 14, one of the harshest ranges among the states reviewed.
- question: Is incest a misdemeanor anywhere?
  answer: Yes, in Delaware. It is the only state that classifies incest as a class A misdemeanor under 11 Del. C. Section 766, rather than a felony.
- question: What is the penalty for incest in Texas?
  answer: Parent-child incest is a second-degree felony in Texas, carrying 2 to 20 years in prison and a fine of up to $10,000.
