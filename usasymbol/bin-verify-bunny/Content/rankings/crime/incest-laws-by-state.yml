page:
  h1: Incest Laws by State
  quick_answer:
  - Incest laws by state classify the offense as a felony in 47 states, with New Jersey and Rhode Island the only 2 states that do not criminalize incest between consenting adults, and Delaware the only state that classifies it as a misdemeanor.
  - Georgia carries one of the harshest ranges in the country, 10 to 30 years in prison, rising to 25 to 50 years if the victim is under 14. Wisconsin classifies incest as a Class F felony with a maximum of 12.5 years.
  - New Jersey does not criminalize incest for adults 18 and older, and Rhode Island sets the age at 16, though both states still prohibit incestuous marriage regardless of age.
  methodology: Classification reflects each state's current penal code provision defining incest, current as of 2026. States are grouped by whether the offense is a felony, a misdemeanor, or not criminalized between consenting adults; specific sentencing ranges are noted where verified against statute text.
  sources:
  - name: 11 Delaware Code Section 766
    url: https://law.justia.com/codes/delaware/title-11/chapter-5/subchapter-ii/section-766/
    description: Delaware's incest statute, classified as a class A misdemeanor
  - name: Georgia Code Section 16-6-22
    url: https://law.justia.com/codes/georgia/title-16/chapter-6/section-16-6-22/
    description: Georgia's incest statute, 10 to 30 years, 25 to 50 years if the victim is under 14
  - name: Wisconsin Statutes Section 944.06
    url: https://docs.legis.wisconsin.gov/document/statutes/944.06
    description: Wisconsin's incest statute, a Class F felony
  - name: Snopes — Incest Is Legal in New Jersey and Rhode Island?
    url: https://www.snopes.com/fact-check/new-jersey-rhode-island-incest/
    description: Fact-check confirming New Jersey and Rhode Island do not criminalize incest between consenting adults
