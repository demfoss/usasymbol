sections:
- id: states-with-no-state-level-fgm-law
  icon: fa-solid fa-gavel
  title: States With No State-Level FGM Law
  paragraphs:
  - '9 states have never enacted their own anti-FGM statute: Alabama, Alaska, Connecticut, Hawaii, Maine, Mississippi, Montana, Nebraska, and New Mexico. Federal law, 18 U.S.C. Section 116, still applies in all 9 and criminalizes the practice nationwide.'
  - Without a state statute, prosecution in these 9 states depends on federal authorities or general criminal laws such as assault or child abuse statutes, rather than a charge written specifically for FGM.
- id: states-with-the-strongest-anti-fgm-laws
  icon: fa-solid fa-shield-halved
  title: States With the Strongest Anti-FGM Laws
  paragraphs:
  - Kentucky's statute earns the only A+ grade from the AHA Foundation among the 41 states with a law. Arkansas, Indiana, Utah, and Wyoming follow with an A grade.
  - Massachusetts and Tennessee grade B, while Rhode Island and Vermont grade lowest among the 41 states with a statute, at D. New York criminalizes FGM as a class E felony under Penal Law Section 130.85.
faq:
- question: Is FGM legal in any U.S. state?
  answer: No. Federal law, 18 U.S.C. Section 116, has criminalized female genital mutilation nationwide since 1996 in every state. This page tracks which states additionally passed their own state-level statute.
- question: Which states don't have their own FGM law?
  answer: '9 states rely solely on federal law: Alabama, Alaska, Connecticut, Hawaii, Maine, Mississippi, Montana, Nebraska, and New Mexico. Federal law still applies in each of them.'
- question: Which state has the strongest FGM law?
  answer: Kentucky's statute is the only one graded A+ by the AHA Foundation. Arkansas, Indiana, Utah, and Wyoming follow with an A grade.
- question: Does New York have a state law against FGM?
  answer: Yes. New York Penal Law Section 130.85 makes female genital mutilation a class E felony, graded C by the AHA Foundation for completeness.
- question: How many states have passed their own anti-FGM statute?
  answer: 41 states have enacted a state-level statute in addition to federal law. 9 states have not.
