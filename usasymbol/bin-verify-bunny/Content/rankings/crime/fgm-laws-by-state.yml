page:
  h1: FGM Laws by State
  quick_answer:
  - FGM laws by state show female genital mutilation is a federal crime nationwide under 18 U.S.C. Section 116, but 9 states, Alabama, Alaska, Connecticut, Hawaii, Maine, Mississippi, Montana, Nebraska, and New Mexico, have no state-level statute of their own.
  - 41 states have enacted their own anti-FGM statute alongside federal law. The AHA Foundation rates Kentucky's law the strongest in the country, grading it A+, while Rhode Island and Vermont grade lowest among states with a law, at D.
  - New York criminalizes FGM as a class E felony under Penal Law Section 130.85. Without a matching state law, prosecution in the 9 remaining states depends on federal authorities or other general criminal statutes.
  methodology: State-law status and letter grades reflect the AHA Foundation's tracking of state anti-FGM legislation as of 2026, cross-checked against state penal code text. Grades reflect completeness of each law's definitions, penalties, and reporting provisions, not enforcement outcomes.
  sources:
  - name: AHA Foundation — FGM Legislation by State
    url: https://www.theahafoundation.org/female-genital-mutilation-fgm-in-the-us/fgm-legislation-by-state/
    description: State-by-state tracker of anti-FGM statutes and letter-grade assessment of law strength
  - name: 18 U.S. Code Section 116
    url: https://www.law.cornell.edu/uscode/text/18/116
    description: Federal statute criminalizing female genital mutilation nationwide since 1996
  - name: New York Penal Law Section 130.85
    url: https://www.nysenate.gov/legislation/laws/PEN/130.85
    description: New York's state-level female genital mutilation statute, a class E felony
