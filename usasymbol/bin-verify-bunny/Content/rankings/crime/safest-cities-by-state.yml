sections:
- id: states-with-the-safest-city-leaders
  icon: fa-solid fa-shield-halved
  title: States With the Lowest-Crime City Leaders
  paragraphs:
  - Westport, Connecticut logs just 3.6 violent crimes per 100,000 residents, the lowest rate of any state's safest city. Harrison, New York follows at 6.3.
  - Cranberry Township, Pennsylvania ranks third at 11.4, and Muskego, Wisconsin is fourth at 11.8. North Royalton, Ohio rounds out the top five at 13.0.
- id: states-where-the-safest-city-still-has-a-high-rate
  icon: fa-solid fa-arrow-trend-up
  title: States Where Even the Safest City Ranks High
  paragraphs:
  - Juneau, Alaska has the highest rate among all state leaders at 537.8 per 100,000, even though it tops Alaska's own list. Kalispell, Montana is second-highest at 292.9.
  - Bismarck, North Dakota follows at 278.0, and Clovis, New Mexico is fourth-highest at 273.3. Each still ranks safest within its own state.
