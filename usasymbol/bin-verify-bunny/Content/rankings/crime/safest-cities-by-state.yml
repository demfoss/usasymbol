faq:
- question: What is the safest city in the United States?
  answer: Westport, Connecticut has the lowest violent crime rate among cities with 25,000 or more residents, at 3.6 per 100,000, the lowest of any state's leading city.
- question: What is the safest city in Texas?
  answer: Fulshear has the lowest violent crime rate among Texas cities with 25,000 or more residents, at 57.6 per 100,000, ranking 18th nationally among state leaders.
- question: What is the safest city in California?
  answer: Danville has the lowest violent crime rate in California at 63.1 per 100,000, tied for 23rd among all state leaders.
- question: Why aren't Hawaii, Indiana, New Jersey, and Vermont listed?
  answer: Each of these states has too few cities with independently reported FBI violent crime data at the 25,000-resident threshold to identify a meaningful safest city distinct from the most dangerous city list.
- question: Which state's safest city has the highest crime rate?
  answer: Juneau, Alaska has the highest violent crime rate among all 46 state leaders at 537.8 per 100,000, well above Westport's 3.6.
