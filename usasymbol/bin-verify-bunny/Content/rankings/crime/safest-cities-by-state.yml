page:
  h1: Safest City in Each State
  quick_answer:
  - Westport, Connecticut is the safest city among state leaders at 3.6 violent crimes per 100,000 residents, among cities with at least 25,000 people.
  - Harrison, New York ranks second at 6.3, followed by Cranberry Township, Pennsylvania at 11.4 and Muskego, Wisconsin at 11.8.
  - Juneau, Alaska has the highest rate among the 46 states with a qualifying safest city, at 537.8 per 100,000. Hawaii, Indiana, New Jersey, and Vermont are excluded for insufficient reporting data.
  methodology: For each state, the city with at least 25,000 residents and the lowest FBI-reported violent crime rate per 100,000 was selected, using the most recent 12-month data submitted to the FBI Crime Data Explorer. States without at least two distinct qualifying cities are excluded.
  sources:
  - name: FBI Crime Data Explorer
    url: https://cde.ucr.cjis.gov/LATEST/webapp/#/pages/explorer/crime/crime-trend
    description: Agency-level violent crime counts and population data, aggregated by CrimeByCity from FBI submissions
  - name: CrimeByCity, Safest Cities by State
    url: https://crimebycity.com/safest-cities
    description: State-by-state city violent crime rate tables compiled from FBI Uniform Crime Reporting data
