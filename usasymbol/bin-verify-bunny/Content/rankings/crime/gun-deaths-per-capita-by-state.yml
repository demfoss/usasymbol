sections:
- id: states-with-the-highest-gun-death-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Gun Death Rate
  paragraphs:
  - Mississippi has the highest firearm death rate at 28.0 per 100,000 residents, ahead of New Mexico's 26.6 in second place. Alaska follows at 24.4, and Alabama is fourth at 23.7.
  - Wyoming rounds out the top five at 23.4, less than five points below Mississippi despite ranking among the least populous states. Louisiana is sixth at 22.9, the last state above 22.
- id: states-with-the-lowest-gun-death-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Gun Death Rate
  paragraphs:
  - Hawaii has the lowest firearm death rate in the table at 3.7 per 100,000, just below Massachusetts at 3.8. New Jersey follows at 4.0, the only other state under 4.4.
  - New York sits at 4.4 and Rhode Island at 4.6, both far below top-ranked Mississippi. California, the most populous state, ranks 44th at 7.0.
faq:
- question: What state has the highest gun death rate?
  answer: Mississippi has the highest firearm death rate at 28.0 per 100,000 residents in 2024, ahead of New Mexico at 26.6.
- question: What state has the lowest gun death rate?
  answer: Hawaii has the lowest firearm death rate at 3.7 per 100,000. Massachusetts follows at 3.8, and New Jersey is third-lowest at 4.0.
- question: What is the gun death rate in Texas?
  answer: Texas has a firearm death rate of 13.9 per 100,000, ranking 26th in the table, despite recording the highest raw death count of any state.
- question: Which state has the highest gun death rate per capita?
  answer: Mississippi ranks first per capita at 28.0 firearm deaths per 100,000 residents, ahead of New Mexico at 26.6 and Alaska at 24.4.
- question: What is the gun death rate in California?
  answer: California has a firearm death rate of 7.0 per 100,000, ranking 44th among the states, well below the national rate of 12.8.
