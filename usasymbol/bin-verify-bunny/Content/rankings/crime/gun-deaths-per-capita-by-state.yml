page:
  h1: Gun Deaths Per Capita by State
  quick_answer:
  - Mississippi has the highest firearm death rate in the nation at 28.0 per 100,000 residents in 2024, according to CDC WONDER data.
  - New Mexico ranks second at 26.6, followed by Alaska at 24.4 and Alabama at 23.7. Wyoming rounds out the top five at 23.4.
  - Hawaii has the lowest rate at 3.7 per 100,000, less than an eighth of Mississippi's rate. Massachusetts is second-lowest at 3.8.
  methodology: Rates reflect all firearm deaths, including suicide, homicide, accidental, and undetermined causes, per 100,000 residents reported to the CDC WONDER Underlying Cause of Death database for 2024.
