sections:
- id: states-with-the-most-human-trafficking-cases
  icon: fa-solid fa-handcuffs
  title: States With the Most Human Trafficking Cases
  paragraphs:
  - California recorded 1,733 identified cases in 2024, the most of any state, followed by Texas at 1,360 and Florida at 832. New York ranks fourth at 570 cases.
  - Illinois rounds out the top five at 385 cases. All five of the highest-ranked states are among the ten most populous states in the country.
- id: states-with-the-fewest-human-trafficking-cases
  icon: fa-solid fa-magnifying-glass
  title: States With the Fewest Human Trafficking Cases
  paragraphs:
  - Vermont recorded the fewest identified cases at 15, followed by Wyoming at 17 and Rhode Island at 19. North Dakota logged 21 cases, and Alaska and New Hampshire tied at 22 each.
  - These low counts reflect smaller state populations rather than lower trafficking risk on their own, since raw case totals are not adjusted per capita.
faq:
- question: Which state has the most human trafficking cases?
  answer: California recorded 1,733 identified cases in 2024, the most of any state. Texas ranks second at 1,360, and Florida is third at 832.
- question: Which state has the fewest human trafficking cases?
  answer: Vermont recorded the fewest cases at 15. Wyoming is second-fewest at 17, and Rhode Island follows at 19.
- question: How many human trafficking cases were reported in Texas?
  answer: Texas recorded 1,360 identified cases in 2024, the second-highest total among the states in this table.
- question: What counts as a human trafficking case in this data?
  answer: A case is one trafficking situation identified through a contact to the National Human Trafficking Hotline, and it can involve more than one victim.
- question: How many human trafficking cases were reported in New York?
  answer: New York recorded 570 identified cases in 2024, ranking fourth among the states in this table, behind California, Texas, and Florida.
