page:
  h1: Human Trafficking Statistics by State
  quick_answer:
  - California recorded 1,733 identified human trafficking cases in 2024, the most of any state, according to the National Human Trafficking Hotline.
  - Texas ranks second at 1,360 cases, and Florida is third at 832. Vermont recorded the fewest cases in the table, at 15.
  - Wyoming recorded the second-fewest cases at 17, and Rhode Island follows at 19. Raw case counts track closely with state population size.
  methodology: Figures count cases identified through contacts to the National Human Trafficking Hotline (operated by Polaris) in 2024. A case reflects one trafficking situation, which may involve multiple victims.
  sources:
  - name: National Human Trafficking Hotline, 2024 State Statistics
    url: https://humantraffickinghotline.org/en/statistics
    description: State-by-state human trafficking cases identified through hotline contacts, operated by Polaris under a federal grant from the U.S. Department of Health and Human Services
