page:
  h1: Elder Fraud by State
  quick_answer:
  - California logged the most elder fraud complaints of any state in 2024, at 18,091 from victims age 60 and over, the highest count on record.
  - Florida ranks second at 11,902 complaints, and Texas follows at 9,473. Texas reports the highest losses among the top three, at $489.8 million.
  - North Dakota logged the fewest elder fraud complaints at 174, with reported losses of $5.8 million among victims 60 and over.
  methodology: Figures count complaints filed by individuals age 60 and over with the FBI's Internet Crime Complaint Center in 2024, as published in its annual report's elder fraud section.
  sources:
  - name: FBI Internet Crime Complaint Center — 2024 IC3 Annual Report
    url: https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf
    description: Annual FBI IC3 report with a dedicated elder fraud section tallying complaints and losses by state for victims age 60 and over in 2024
