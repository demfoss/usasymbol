sections:
- id: states-with-the-most-elder-fraud-victims
  icon: fa-solid fa-user-shield
  title: States With the Most Elder Fraud Victims
  paragraphs:
  - California logged 18,091 elder fraud complaints in 2024, well ahead of Florida at 11,902 and Texas at 9,473. Arizona is fourth at 6,683, followed by Pennsylvania at 6,353.
  - Texas reports the highest losses among the top five states at $489.8 million, ahead of California's $832.7 million total complaint count but a smaller victim pool.
- id: states-with-the-highest-average-loss-per-elder-fraud-victim
  icon: fa-solid fa-sack-dollar
  title: States With the Highest Average Loss per Elder Fraud Victim
  paragraphs:
  - Texas victims lost an average of about $51,700 each in 2024, the highest average among the largest states, ahead of Georgia at roughly $48,200 and Mississippi at about $47,800.
  - California follows at close to $46,000 per victim. West Virginia sits at the opposite end, with 594 complaints and $5.8 million in losses, an average near $9,700.
  table:
    columns:
      rank: Rank
      state: State
      avg_loss_per_victim: Average Loss per Victim
    rows:
    - rank: 1
      state: Texas
      avg_loss_per_victim: "$51,700"
    - rank: 2
      state: Georgia
      avg_loss_per_victim: "$48,200"
    - rank: 3
      state: Mississippi
      avg_loss_per_victim: "$47,800"
    - rank: 4
