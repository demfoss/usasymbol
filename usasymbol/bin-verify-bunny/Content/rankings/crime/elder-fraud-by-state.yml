faq:
- question: Which state has the most elder fraud victims?
  answer: California has the most elder fraud complaints at 18,091 in 2024, ahead of Florida at 11,902 and Texas at 9,473.
- question: Which state has the fewest elder fraud victims?
  answer: North Dakota has the fewest elder fraud complaints at 174 in 2024, with reported losses of $5.8 million.
- question: Which state has the highest elder fraud losses?
  answer: California has the highest reported elder fraud losses at $832.7 million in 2024, the largest total among the states.
- question: What is the average loss per elder fraud victim in Texas?
  answer: Texas victims lost an average of about $51,700 each in 2024, the highest average among the states with the largest victim counts.
- question: How many elder fraud complaints were filed in Florida?
  answer: Florida logged 11,902 elder fraud complaints in 2024, the second-highest count of any state, with $388.4 million in reported losses.
