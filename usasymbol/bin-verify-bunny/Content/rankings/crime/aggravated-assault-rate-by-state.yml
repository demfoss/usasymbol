sections:
- id: states-with-the-highest-aggravated-assault-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Aggravated Assault Rate
  paragraphs:
  - New Mexico posts the highest aggravated assault rate in the table at 587.5 per 100,000 residents, well ahead of Alaska at 513.0. Tennessee ranks third at 488.6.
  - Arkansas follows at 463.5, and Louisiana rounds out the top five at 436.0. Each of these five states more than doubles the national rate of 256.1.
- id: states-with-the-lowest-aggravated-assault-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Aggravated Assault Rate
  paragraphs:
  - Maine has the lowest aggravated assault rate in the table at 55.0 per 100,000, just under New Hampshire's 62.8. Connecticut ranks third-lowest at 77.6.
  - Rhode Island and Wyoming round out the bottom five, at 99.8 and 135.8. All five states sit below one-quarter of New Mexico's top rate of 587.5.
faq:
- question: Which state has the highest aggravated assault rate?
  answer: New Mexico has the highest aggravated assault rate at 587.5 per 100,000 residents in 2024, ahead of Alaska at 513.0.
- question: Which state has the lowest aggravated assault rate?
  answer: Maine has the lowest aggravated assault rate at 55.0 per 100,000, just below New Hampshire's 62.8.
- question: What is the aggravated assault rate in Texas?
  answer: Texas has an aggravated assault rate of 270.7 per 100,000, ranking 20th among the states.
- question: What is the aggravated assault rate in California?
  answer: California has an aggravated assault rate of 325.8 per 100,000, ranking 12th among the states.
- question: Why is New Mexico's aggravated assault rate so high?
  answer: New Mexico's rate of 587.5 per 100,000 is the highest on record among the states, more than double the national rate of 256.1 reported for 2024.
