page:
  h1: Aggravated Assault Rate by State
  quick_answer:
  - New Mexico has the highest aggravated assault rate in the nation at 587.5 per 100,000 residents in 2024, the highest of any state on record.
  - Alaska ranks second at 513.0, and Tennessee follows at 488.6. Both sit well above the national aggravated assault rate of 256.1 per 100,000.
  - Maine has the lowest aggravated assault rate at 55.0 per 100,000, just below New Hampshire's 62.8. Both are a fraction of New Mexico's top figure.
  methodology: Rates reflect FBI Uniform Crime Reporting aggravated assault offenses per 100,000 residents for 2024, as published through the FBI Crime Data Explorer.
