page:
  h1: Fraud and Scam Losses by State
  quick_answer:
  - California consumers reported the highest total fraud and scam losses of any state in 2024, at $1,678.7 million, the highest figure on record.
  - Texas ranks second at $897.9 million, and Florida follows at $866.1 million. Both trail California but still lead every other state by a wide margin.
  - Vermont reported the lowest total losses at $10.6 million, less than one percent of California's total.
  methodology: Figures reflect total dollars consumers reported losing to fraud, identified separately from identity theft, in reports submitted to the FTC's Consumer Sentinel Network in 2024.
  sources:
  - name: Federal Trade Commission — Consumer Sentinel Network Data Book 2024
    url: https://www.ftc.gov/system/files/ftc_gov/pdf/csn-annual-data-book-2024.pdf
    description: Official FTC annual report tallying fraud reports and dollar losses by state submitted to the Consumer Sentinel Network in 2024
