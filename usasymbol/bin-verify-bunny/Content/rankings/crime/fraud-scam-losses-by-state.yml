      median_fraud_loss: "$542"
faq:
- question: Which state has the highest fraud and scam losses?
  answer: California has the highest total fraud losses at $1,678.7 million in 2024, nearly double Texas at $897.9 million.
- question: Which state has the lowest fraud and scam losses?
  answer: Vermont has the lowest total fraud losses at $10.6 million in 2024, well below North Dakota's $14.4 million.
- question: Which state has the highest median fraud loss per report?
  answer: Arizona, Hawaii, and Wyoming tie for the highest median loss per report, each at $600. California's median is $542, ranking fifth.
- question: How much did Texas lose to fraud and scams?
  answer: Texas reported $897.9 million in total fraud losses in 2024, the second-highest total after California, with a median loss of $500 per report.
- question: What is the fraud loss total in Florida?
  answer: Florida reported $866.1 million in total fraud losses in 2024, ranking third, with a median loss of $520 per report.
