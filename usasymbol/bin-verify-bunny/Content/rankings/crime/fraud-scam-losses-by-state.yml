sections:
- id: states-with-the-highest-total-fraud-losses
  icon: fa-solid fa-sack-dollar
  title: States With the Highest Total Fraud Losses
  paragraphs:
  - California consumers reported losing $1,678.7 million to fraud in 2024, nearly double second-ranked Texas at $897.9 million. Florida follows at $866.1 million, and New York is fourth at $534.0 million.
  - Arizona rounds out the top five at $336.7 million. All five states report totals more than 30 times higher than lowest-ranked Vermont's $10.6 million.
- id: states-with-the-highest-median-fraud-loss
  icon: fa-solid fa-chart-line
  title: States With the Highest Median Fraud Loss per Report
  paragraphs:
  - Arizona, Hawaii, and Wyoming tie for the highest median loss per fraud report, each at $600. Utah follows at $550, and California is fifth at $542.
  - Vermont has the lowest median loss at $285, well below its neighbor New Hampshire's $325. A high median can occur in a state with modest total losses, as in Wyoming.
  table:
    columns:
      rank: Rank
      state: State
      median_fraud_loss: Median Loss per Report
    rows:
    - rank: 1
      state: Arizona
      median_fraud_loss: "$600"
