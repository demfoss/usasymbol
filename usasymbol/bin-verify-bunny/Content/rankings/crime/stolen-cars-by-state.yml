page:
  h1: Stolen Cars by State
  quick_answer:
  - California has the highest motor vehicle theft rate of any state in 2024, at 463 stolen vehicles per 100,000 residents, well above the national rate of 250.2.
  - New Mexico ranks second at 458 per 100,000, and Colorado is third at 430. New Hampshire has the lowest rate in the table at 48 per 100,000.
  - Idaho posts the second-lowest rate at 68 per 100,000, and Maine follows at 79. All three of the lowest-ranked states sit in New England or the Mountain West.
  methodology: Rates reflect motor vehicle thefts reported to the FBI's National Incident-Based Reporting System, compiled in the National Insurance Crime Bureau's 2024 Hot Spots report, per 100,000 residents.
  sources:
  - name: National Insurance Crime Bureau, Vehicle Thefts in United States Fell 17% in 2024
    url: https://www.nicb.org/news/news-releases/vehicle-thefts-united-states-fell-17-2024
    description: State-by-state motor vehicle theft rates per 100,000 residents for 2024, compiled from FBI NIBRS data
