sections:
- id: states-with-the-highest-car-theft-rates
  icon: fa-solid fa-car-burst
  title: States With the Highest Car Theft Rates
  paragraphs:
  - California tops the table at 463 stolen vehicles per 100,000 residents, followed by New Mexico at 458 and Colorado at 430. Nevada rounds out the top four at 394, and Missouri is fifth at 380.
  - Washington posts the sixth-highest rate at 375, and Maryland follows at 346. Each of these six states runs at least 125 points above the national rate of 250.2 per 100,000.
- id: states-with-the-lowest-car-theft-rates
  icon: fa-solid fa-shield-halved
  title: States With the Lowest Car Theft Rates
  paragraphs:
  - New Hampshire has the lowest theft rate in the table at 48 per 100,000, less than a tenth of California's rate. Idaho is second-lowest at 68, and Maine follows at 79.
  - Wyoming ranks fourth-lowest at 96, and West Virginia is fifth-lowest at 102. All five of the lowest-ranked states sit in New England, the Mountain West, or Appalachia.
faq:
- question: Which state has the most car theft?
  answer: California has the highest motor vehicle theft rate at 463 per 100,000 residents in 2024. New Mexico is close behind at 458, and Colorado is third at 430.
- question: Which state has the least car theft?
  answer: New Hampshire has the lowest rate at 48 stolen vehicles per 100,000 residents. Idaho is second-lowest at 68, and Maine is third-lowest at 79.
- question: What is the car theft rate in Texas?
  answer: Texas has a motor vehicle theft rate of 316 per 100,000 residents, ranking eighth highest among the states in this table.
- question: What is the national average car theft rate?
  answer: The national motor vehicle theft rate was 250.2 per 100,000 residents in 2024. Twenty states in this table rank above that average.
- question: Is car theft rising or falling nationally?
  answer: Vehicle thefts fell 17% nationwide from 2023 to 2024, the largest annual decrease in 40 years. Maine was the only state to post an increase over the prior year.
