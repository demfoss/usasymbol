sections:
  - id: "states-with-the-most-officer-line-of-duty-deaths"
    icon: "fa-solid fa-shield-halved"
    title: "States With the Most Officer Line-of-Duty Deaths"
    paragraphs:
      - "Texas recorded 18 line-of-duty deaths in 2024, the most of any state. New York followed at 17, and Illinois was third at 9."
      - "Florida logged 8 deaths and Georgia 6, rounding out the top five. Michigan, North Carolina, and Tennessee tied for sixth at 5 each."

  - id: "leading-causes-of-line-of-duty-officer-deaths"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Leading Causes of Line-of-Duty Officer Deaths"
    table:
      columns:
        cause: "Cause"
        deaths: "Deaths"
      rows:
        - cause: "Firearms-related"
          deaths: "52"
        - cause: "Traffic-related"
          deaths: "46"
        - cause: "Physical-related"
          deaths: "35"
        - cause: "Drowned"
          deaths: "4"
        - cause: "Beaten to death"
          deaths: "4"
        - cause: "Aircraft crash"
          deaths: "2"
        - cause: "Stabbed"
          deaths: "2"
        - cause: "Fire-related incident"
          deaths: "1"
        - cause: "Electrocution"
          deaths: "1"
    paragraphs:
      - "Firearms caused 52 of the 147 total officer deaths nationwide in 2024, up 13% from 46 in 2023. Traffic-related incidents caused 46 deaths, a 48% jump from 31 in 2023."
      - "Physical-related causes, including medical events on duty, accounted for 35 deaths. Drowning and beatings each caused 4 deaths, the next most common causes."

