  h1: "Officers Killed in the Line of Duty by State"

  quick_answer:
    - "Texas had the most law enforcement officers killed in the line of duty in 2024, with 18 deaths, the highest of any state."
    - "New York ranks second at 17 deaths, followed by Illinois at 9 and Florida at 8. Georgia rounds out the top five at 6."
    - "15 states had zero line-of-duty deaths in 2024. Firearms were the leading cause nationwide, involved in 52 of the 147 total officer deaths."

  methodology: "Figures count total law enforcement line-of-duty deaths by state for January 1 through December 31, 2024, from the National Law Enforcement Officers Memorial Fund. Federal, tribal, military, and U.S. territory deaths are excluded from the state ranking."

  sources:
    - name: "National Law Enforcement Officers Memorial Fund — 2024 End-of-Year Fatalities Report"
