faq:
  - question: "Which state had the most police officers killed in the line of duty in 2024?"
    answer: "Texas had the most, with 18 line-of-duty deaths. New York was second at 17, and Illinois third at 9."

  - question: "How many police officers died in the line of duty in 2024?"
    answer: "147 officers died in the line of duty nationwide in 2024, including state, federal, tribal, military, and U.S. territory officers. Firearms caused 52 of those deaths, the leading cause."

  - question: "Which states had zero officer line-of-duty deaths in 2024?"
    answer: "15 states recorded zero line-of-duty deaths in 2024, including Alaska, Hawaii, Maine, Vermont, and New Hampshire."

  - question: "What is the leading cause of police officer line-of-duty deaths?"
    answer: "Firearms were the leading cause in 2024, involved in 52 of 147 total deaths, up 13% from 46 in 2023. Traffic-related incidents were second at 46 deaths."

  - question: "How many officers were killed in the line of duty in New York?"
    answer: "New York recorded 17 line-of-duty deaths in 2024, the second-highest total of any state, behind only Texas at 18."

