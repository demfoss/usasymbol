page:
  h1: "Domestic Violence Homicides by State"

  quick_answer:
    - "Alaska has the highest rate of women murdered by men in single victim/single offender incidents, at 3.43 per 100,000 in 2020, according to the Violence Policy Center."
    - "Oklahoma ranks second at 3.28 per 100,000, followed by Wyoming at 2.80 and Arkansas at 2.66. Texas logs the most victims in raw numbers, at 257."
    - "Pennsylvania has the lowest rate at 0.25 per 100,000, well below Massachusetts's second-lowest 0.51. Alabama and Florida did not submit usable data and are excluded."

  methodology: "Rates reflect females murdered by males in single victim/single offender incidents per 100,000 females, from the Violence Policy Center's analysis of 2020 FBI Supplementary Homicide Report data, the most recent year with a complete state ranking. The FBI's 2021 shift to NIBRS reporting disrupted state participation, so VPC has not published full state rankings since. Alabama and Florida did not submit usable 2020 data and are omitted."

  sources:
    - name: "Violence Policy Center — When Men Murder Women, 2022 Edition (2020 Data)"
      url: "https://vpc.org/studies/wmmw2022.pdf"
      description: "Annual analysis of FBI Supplementary Homicide Report data on females murdered by males in single victim/single offender incidents, by state, for 2020, the last year with a complete state ranking."

