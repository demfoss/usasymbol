sections:
  - id: "why-alaska-has-the-highest-rate-of-women-murdered-by-men"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Alaska Has the Highest Rate of Women Murdered by Men"
    paragraphs:
      - "Alaska's rate of 3.43 per 100,000 in 2020 was two and a half times the national rate of 1.34. The Violence Policy Center found Alaska ranked first or second in the nation for this measure for 10 consecutive years, calling it a prolonged epidemic of violence against women in the state."
      - "Of Alaska's 12 female homicide victims in 2020, 92% were killed by someone they knew, and 55% of those were wives, common-law wives, ex-wives, or girlfriends of the offender."

  - id: "states-with-the-most-domestic-violence-homicide-victims"
