faq:
  - question: "Which state has the highest rate of domestic violence homicides?"
    answer: "Alaska has the highest rate at 3.43 per 100,000 women, more than two and a half times the national rate of 1.34. Alaska has ranked first or second nationally for 10 straight years."

  - question: "Which state has the lowest rate of women murdered by men?"
    answer: "Pennsylvania has the lowest rate at 0.25 per 100,000. Massachusetts is second-lowest at 0.51, and Delaware is third-lowest at 0.59."

  - question: "Which state has the most domestic violence homicide victims overall?"
    answer: "Texas has the most victims in raw numbers, at 257. Its rate of 1.74 per 100,000 ranks 17th, well below Alaska's 3.43."

  - question: "Why does the Violence Policy Center only rank states through 2020?"
    answer: "The FBI changed its crime reporting system in 2021, moving to NIBRS, and many police agencies did not immediately participate. That disrupted state-level data enough that the Violence Policy Center has not published a complete state ranking since 2020."

  - question: "Why are Alabama and Florida missing from this ranking?"
    answer: "Alabama and Florida did not submit usable 2020 data to the FBI's Supplementary Homicide Report, the data source for this ranking, so the Violence Policy Center excluded both states."

