page:
  h1: Safest States in the US
  quick_answer:
  - Maine ranks as the safest state in the country, with the lowest violent crime rate at 100.1 per 100,000 residents in 2024, according to FBI data.
  - New Hampshire is second-safest at 110.1, followed by Connecticut at 136.0 and Rhode Island at 153.6. Wyoming rounds out the top five at 203.4.
  - The national violent crime rate was 359.1 per 100,000 in 2024. All five of the safest states sit well below that average.
  methodology: Rates reflect violent crime, murder, rape, robbery, and aggravated assault combined, per 100,000 residents reported to the FBI Uniform Crime Reporting Program for 2024. States are ranked from lowest to highest rate.
  sources:
  - name: FBI Crime Data Explorer — Estimated Crimes in the United States
    url: https://cde.ucr.cjis.gov/
    description: State-level violent crime rate per 100,000 population for 2024
