sections:
- id: safest-states-by-violent-crime-rate
  icon: fa-solid fa-shield-halved
  title: Safest States by Violent Crime Rate
  paragraphs:
  - Maine posts the lowest violent crime rate in the country at 100.1 per 100,000 residents, just below New Hampshire's 110.1. Connecticut is third-safest at 136.0.
  - Rhode Island follows at 153.6 and Wyoming at 203.4, rounding out the top five. All five sit at least 155 points below the national rate of 359.1.
- id: states-with-a-violent-crime-rate-below-the-national-average
  icon: fa-solid fa-chart-line
  title: States With a Violent Crime Rate Below the National Average
  paragraphs:
  - 29 states post a violent crime rate below the national average of 359.1 per 100,000. Mississippi ranks sixth-safest at 210.5, and Kentucky follows at 213.1.
  - Hawaii and New Jersey tie for eighth-safest at 217.7. Oregon is the last state under the national average, at 331.0.
faq:
- question: What is the safest state in America?
  answer: Maine has the lowest violent crime rate at 100.1 per 100,000 residents in 2024, just ahead of New Hampshire at 110.1.
- question: What is the second safest state?
  answer: New Hampshire ranks second-safest at 110.1 violent crimes per 100,000, only 10 points behind top-ranked Maine.
- question: Is Vermont a safe state?
  answer: Vermont ranks 11th-safest with a violent crime rate of 219.1 per 100,000, well below the national average of 359.1.
- question: Which states are the safest?
  answer: Maine, New Hampshire, Connecticut, Rhode Island, and Wyoming are the five states with the lowest violent crime rates, all below 204 per 100,000 in 2024.
- question: What is the violent crime rate in New York?
  answer: New York has a violent crime rate of 380.2 per 100,000, ranking 33rd-safest among the states.
