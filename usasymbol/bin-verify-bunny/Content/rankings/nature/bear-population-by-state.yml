faq:
  - question: "Which state has the most black bears?"
    answer: "Alaska has the most black bears of any state, with an estimated population of 100,000. California and Maine are next, each estimated at 35,000."

  - question: "Which state has the fewest black bears?"
    answer: "Rhode Island has the smallest confirmed black bear population at 7 bears. Ohio and Texas follow at 75 each."

  - question: "What is the black bear population in California?"
    answer: "California's black bear population is estimated at 35,000, tied with Maine for the second-largest total in the country."

  - question: "What is the black bear population in Texas?"
    answer: "Texas has an estimated 75 black bears, tied with Ohio for one of the smallest confirmed populations among states that have any bears at all."

  - question: "Which states have no black bear population?"
    answer: "Hawaii, Illinois, Indiana, Iowa, Kansas, Nebraska, North Dakota, and South Dakota have no confirmed resident black bear population. Delaware's population is considered extirpated."

  - question: "Why does Alaska have so many black bears?"
    answer: "Alaska's forests cover most of the state and support widespread bear distribution, which underlies its estimated 100,000-bear population, the largest of any state."

