  quick_answer:
    - "Alaska has the largest black bear population of any state at an estimated 100,000 bears."
    - "California and Maine follow at 35,000 bears each, and Idaho holds 30,000. Rhode Island has the smallest confirmed population at just 7 bears."
    - "Seven states, including Texas and Mississippi, report black bear populations below 1,000. Several states, such as Hawaii and Illinois, have no confirmed resident black bear population."

  methodology: "Population figures use the World Population Review 2026 black bear population table, cross checked against Wildlife Informer's state estimates, and reflect American black bear (Ursus americanus) counts only, not brown or grizzly bears. States with no confirmed resident population are excluded from the table."

