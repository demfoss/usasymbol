sections:
  - id: "states-with-the-most-black-bears"
    icon: "fa-solid fa-paw"
    title: "States With the Most Black Bears"
    paragraphs:
      - "Alaska holds the largest black bear population at an estimated 100,000, more than double California and Maine's tied estimate of 35,000 each. Idaho follows at 30,000, and Oregon and Washington are tied next at 27,500."
      - "Wisconsin rounds out the next tier at 24,000. North Carolina and Pennsylvania are tied at 20,000, and Colorado sits close behind at 18,500."

  - id: "states-with-the-fewest-black-bears"
    icon: "fa-solid fa-tree"
    title: "States With the Fewest Black Bears"
    paragraphs:
      - "Rhode Island has the smallest confirmed black bear population at just 7 bears. Ohio and Texas are next at 75 each, and Mississippi holds 150."
      - "Alabama reports 200 bears and Nevada reports 600, while Missouri sits at 800. Several states, including Hawaii and Illinois, have no confirmed resident black bear population at all."

  - id: "why-alaska-has-the-most-black-bears"
    icon: "fa-solid fa-mountain"
    title: "Why Alaska Has the Most Black Bears"
    paragraphs:
      - "Alaska's black bears are widely distributed across the state's forests, which cover most of its land area and support the estimated 100,000-bear population. That habitat base is far larger than what any other state offers, which is why Alaska's total outpaces California and Maine's tied 35,000 by nearly threefold."

