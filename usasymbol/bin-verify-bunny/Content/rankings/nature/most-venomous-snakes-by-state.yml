page:
  h1: "Venomous Snakes by State"

  quick_answer:
    - "Arizona has the most venomous snake species of any state, with 19 native species including rattlesnakes, sidewinders, and the Sonoran coral snake."
    - "Texas ranks second with 15 species, and Alabama is third at 11. California, Georgia, New Mexico, and Oklahoma follow with 10 each."
    - "Alaska, Hawaii, Maine, and Rhode Island are the only states with no native venomous snakes. Michigan, Montana, New Hampshire, North Dakota, South Dakota, Vermont, and Washington each have just one species."

  methodology: "Species counts and names are listed by Wildlife Informer's state-by-state venomous snake directory, current as of 2025, and include recognized regional forms such as sidewinder and massasauga subspecies grouped within each state's range."

  sources:
    - name: "Wildlife Informer. List of Venomous Snakes Found in Each U.S. State"
      url: "https://wildlifeinformer.com/venomous-snakes-in-each-state/"
      description: "State-by-state list of venomous snake species and their common names"
