faq:
  - question: "Which state has the most venomous snake species?"
    answer: "Arizona has the most venomous snake species at 19, ahead of Texas at 15 and Alabama at 11."

  - question: "How many venomous snake species does Texas have?"
    answer: "Texas has 15 venomous snake species, including the western diamondback rattlesnake, the Texas coral snake, and three copperhead forms."

  - question: "Which states have no venomous snakes?"
    answer: "Alaska, Hawaii, Maine, and Rhode Island have no native venomous snake species. Every other state has at least one."

  - question: "How many venomous snake species does Alabama have?"
    answer: "Alabama has 11 venomous snake species across all four U.S. venomous snake families: rattlesnakes, copperheads, cottonmouths, and the eastern coral snake."

  - question: "Which states have the fewest venomous snakes, not counting states with none?"
    answer: "Michigan, Montana, New Hampshire, North Dakota, South Dakota, Vermont, and Washington each have just one venomous species. Michigan's only species is the eastern massasauga."

  - question: "What is the only venomous snake in Michigan?"
    answer: "The eastern massasauga, a small rattlesnake, is Michigan's only native venomous snake species."

