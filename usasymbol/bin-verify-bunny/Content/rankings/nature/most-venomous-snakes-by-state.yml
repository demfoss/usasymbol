sections:
  - id: "states-with-the-most-venomous-snake-species"
    icon: "fa-solid fa-snake"
    title: "States With the Most Venomous Snake Species"
    paragraphs:
      - "Arizona has 19 venomous snake species, the most of any state, spanning 13 rattlesnake types, three sidewinder forms, the desert massasauga, and the Sonoran coral snake. Texas ranks second at 15 species, and Alabama is third at 11."
      - "California, Georgia, New Mexico, and Oklahoma each have 10 species. Mississippi and South Carolina follow at 9, and Missouri rounds out the top ten at 8."

  - id: "why-arizona-has-the-most-venomous-snakes"
    icon: "fa-solid fa-sun"
    title: "Why Arizona Has So Many Venomous Snake Species"
    paragraphs:
      - "Arizona's desert habitat mixes hot days, cool nights, and rocky, broken ground, a combination that gives reptiles the sun and shelter they need, according to WorldAtlas. Texas shows a related pattern in its overall snake diversity of 105 species and subspecies, a total WorldAtlas ties to a state whose borders span swamp, prairie, brush, and desert terrain."

  - id: "states-with-no-venomous-snakes"
    icon: "fa-solid fa-ban"
    title: "States With No Venomous Snakes"
    paragraphs:
      - "Alaska, Hawaii, Maine, and Rhode Island are the only states with no native venomous snake species. Every other state has at least one, ranging up from Michigan, Montana, New Hampshire, North Dakota, South Dakota, Vermont, and Washington, which each have just one."

