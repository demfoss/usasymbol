faq:
  - question: "Which state has the most shark attacks?"
    answer: "Florida has the most shark attacks of any state, with 828 confirmed unprovoked incidents since 1837. That total is more than five times Hawaii's 162, the second-highest count."

  - question: "How many shark attacks has Florida had?"
    answer: "Florida has recorded 828 confirmed unprovoked shark attacks since 1837. It also had 11 of the 25 unprovoked bites reported across the United States in 2025."

  - question: "Why does Florida have so many shark attacks?"
    answer: "Volusia County, home to New Smyrna Beach, has logged more than 300 shark bites since 1882 and is called the shark bite capital of the world. Abundant baitfish, murky water, and heavy surfer traffic all raise the odds of a bite."

  - question: "Which state had the most shark attacks in 2025?"
    answer: "Florida led all states in 2025 with 11 unprovoked shark bites. California was next with 5, including 1 fatal attack, and Hawaii recorded 4."

  - question: "What state has the second-most shark attacks?"
    answer: "Hawaii ranks second with 162 confirmed unprovoked shark attacks since 1837. California is third at 124, and South Carolina is fourth at 105."

  - question: "How many shark attacks happen in the U.S. each year?"
    answer: "The United States recorded 25 unprovoked shark bites in 2025. Florida accounted for 11 of those, with California, Hawaii, South Carolina, New York, North Carolina, and Texas making up the rest."

