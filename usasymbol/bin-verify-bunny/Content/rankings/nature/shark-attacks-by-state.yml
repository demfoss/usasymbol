sections:
  - id: "states-with-the-most-shark-attacks"
    icon: "fa-solid fa-water"
    title: "States With the Most Shark Attacks"
    paragraphs:
      - "Florida has recorded 828 confirmed unprovoked shark attacks since 1837, more than five times Hawaii's total of 162. California ranks third at 124, and South Carolina is fourth at 105."
      - "North Carolina follows at 67, and Texas rounds out the top six at 44. Oregon is the only Pacific Northwest state with a notable count, at 27 attacks since 1837."

  - id: "why-florida-leads-the-nation-in-shark-attacks"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Why Florida Leads the Nation in Shark Attacks"
    paragraphs:
      - "Volusia County, home to New Smyrna Beach, has recorded more than 300 shark bites since 1882 and is known as the shark bite capital of the world. Abundant baitfish draw sharks close to shore, and murky water raises the odds a shark mistakes a swimmer for prey."
      - "High numbers of surfers and swimmers in the water add to the contact rate. No one has been killed by a shark in Volusia County, and Florida still recorded 11 of the 25 unprovoked U.S. bites in 2025."

  - id: "shark-attacks-by-state-in-2025"
    icon: "fa-solid fa-calendar-days"
    title: "Shark Attacks by State in 2025"
    paragraphs:
      - "Florida logged 11 unprovoked shark bites in 2025, out of 25 recorded nationwide. California recorded 5, including the year's only fatal attack, and Hawaii logged 4."
      - "South Carolina had 2 bites in 2025, while New York, North Carolina, and Texas each recorded 1. The other 14 states in the table had no unprovoked bites reported that year."

