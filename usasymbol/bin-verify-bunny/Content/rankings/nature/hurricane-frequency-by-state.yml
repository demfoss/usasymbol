faq:
  - question: "Which state has the most hurricanes?"
    answer: "Florida has recorded the most direct hurricane hits of any state at 120 since 1851. Texas ranks second at 64, and North Carolina is third at 56."

  - question: "Which state has the most major hurricanes?"
    answer: "Florida has taken 37 major hurricanes rated Category 3 or higher since 1851, the most of any state. Texas follows at 19, and Louisiana is third at 17."

  - question: "How many hurricanes has Texas had?"
    answer: "Texas has recorded 64 direct hurricane hits since 1851, including 19 rated Category 3 or higher."

  - question: "Which states have had the fewest hurricanes?"
    answer: "New Hampshire and Pennsylvania have each recorded just one direct hurricane hit since 1851. Delaware and Maryland have each taken two, and neither has ever recorded a major hurricane."

  - question: "How many hurricanes has North Carolina had?"
    answer: "North Carolina has recorded 56 direct hurricane hits since 1851, ranking third among all states, with 7 of those reaching major hurricane strength."

  - question: "What percentage of major hurricanes hit Florida or Texas?"
    answer: "Florida and Texas together account for 88 percent of all major hurricane strikes on the U.S. mainland. Florida alone has taken 37 major hits and Texas has taken 19."

