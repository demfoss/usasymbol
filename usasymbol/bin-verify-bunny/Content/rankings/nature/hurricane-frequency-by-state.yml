page:
  h1: "Hurricane Frequency by State"

  quick_answer:
    - "Florida has recorded 120 direct hurricane hits since 1851, the most of any state, including 37 major hurricanes rated Category 3 or higher."
    - "Texas ranks second with 64 direct hits and 19 major hurricanes. North Carolina follows at 56 hits, and Louisiana at 54 hits with 17 major hurricanes, the second-highest major-storm count in the country."
    - "New Hampshire and Pennsylvania have each taken just one direct hurricane hit since 1851. Florida and Texas together account for 88 percent of all major hurricane strikes on the mainland."

  methodology: "Direct hurricane hit counts and major-hurricane (Category 3-5) counts by state cover 1851-2018 and are listed by NOAA's Atlantic Oceanographic and Meteorological Laboratory, Hurricane Research Division. Only the 19 Atlantic and Gulf Coast states with recorded direct hits are ranked; interior and Pacific states are excluded because the source tracks Atlantic basin landfalls only."

  sources:
