    paragraphs:
      - "Florida has taken 120 direct hurricane hits since 1851, more than any other state. Texas ranks second at 64, and North Carolina follows at 56."
      - "Louisiana has recorded 54 direct hits, and South Carolina has taken 30. Alabama and Georgia round out the top seven, with 24 and 22 hits."

  - id: "states-with-the-most-major-hurricanes"
    icon: "fa-solid fa-wind"
    title: "States With the Most Major Hurricanes"
    paragraphs:
      - "Florida has absorbed 37 major hurricanes at Category 3 or higher since 1851, more than any other state. Texas is second at 19, and Louisiana is close behind at 17."
      - "Mississippi has recorded 8 major hurricanes despite only 19 total hits, a higher share of major storms than higher-ranked states like North Carolina, which has taken 56 total hits but only 7 at major strength. Florida and Texas together account for 88 percent of all major hurricane strikes on the mainland."

  - id: "states-with-the-fewest-hurricanes"
    icon: "fa-solid fa-cloud-sun"
    title: "States With the Fewest Hurricane Landfalls"
    paragraphs:
      - "New Hampshire and Pennsylvania have each recorded just one direct hurricane hit since 1851, the fewest of any coastal state. Delaware and Maryland have each taken two."
      - "Maine has recorded three direct hits, and New Jersey has taken four. None of these five states has recorded a single major hurricane at Category 3 or higher."

