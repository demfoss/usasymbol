page:
  h1: "Flood Risk by State"

  quick_answer:
    - "Iowa has reported the most floods of any state since 1953 at 561, the highest total on record among FEMA emergency declarations."
    - "North Dakota follows at 481 and Minnesota at 471, while Texas ranks fourth at 360 floods but has recorded 1,069 flood fatalities, more than any other state."
    - "South Dakota carries the highest fatality rate on record at 5.99, more than double Louisiana's 2.58, despite logging far fewer floods at 271."

  methodology: "Flood counts reflect federal emergency declarations tracked by FEMA since 1953, as compiled by World Population Review. Fatalities and fatality rate figures cover the same period. Rhode Island is excluded here for lack of a reported flood count."

  sources:
