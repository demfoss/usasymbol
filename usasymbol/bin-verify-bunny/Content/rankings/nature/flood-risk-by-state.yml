faq:
  - question: "Which state has had the most floods?"
    answer: "Iowa has reported 561 floods since 1953, the most of any state. North Dakota is second at 481, and Minnesota is third at 471."

  - question: "Which state has had the fewest floods?"
    answer: "Delaware has reported the fewest floods on record at 3. Hawaii is next lowest at 11, followed by Connecticut and Wyoming, tied at 17."

  - question: "Which state has had the most flood fatalities?"
    answer: "Texas has recorded 1,069 flood fatalities since 1953, more than any other state. Louisiana is second at 693."

  - question: "Why does Iowa have the most reported floods?"
    answer: "Iowa's low-lying areas and extensive river systems leave it vulnerable to repeated flooding, producing 561 reported floods since 1953. North Dakota and Minnesota rank close behind, where snowmelt and spring rains regularly push rivers over their banks."

  - question: "Which state has the highest flood fatality rate?"
    answer: "South Dakota has the highest fatality rate on record at 5.99, more than double Louisiana's 2.58. Texas, despite recording the most total fatalities at 1,069, has a lower fatality rate of 1.08."

  - question: "How many floods has Texas had?"
    answer: "Texas has reported 360 floods since 1953, ranking fourth among all states, but its fatality toll of 1,069 is the highest in the country."

