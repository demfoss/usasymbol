sections:
  - id: "states-with-the-most-reported-floods"
    icon: "fa-solid fa-house-flood-water"
    title: "States With the Most Reported Floods"
    paragraphs:
      - "Iowa has reported 561 floods since 1953, the highest total of any state. North Dakota follows at 481 and Minnesota at 471. Texas ranks fourth at 360 floods."
      - "Missouri logged 282 floods and Virginia logged 280, placing both states in the top six. South Dakota is seventh at 271, and Pennsylvania is eighth at 269."

  - id: "why-iowa-has-the-most-reported-floods"
    icon: "fa-solid fa-water"
    title: "Why Iowa Has the Most Reported Floods"
    paragraphs:
      - "Iowa's 561 floods since 1953 trace back to its low-lying terrain and extensive river systems, which leave the state vulnerable to periodic inundation. North Dakota and Minnesota, ranked second and third at 481 and 471, sit in a region where snowmelt combined with spring rains regularly drives rivers over their banks."

  - id: "states-with-the-most-flood-fatalities"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States With the Most Flood Fatalities"
    paragraphs:
      - "Texas has recorded 1,069 flood fatalities since 1953, more than any other state, despite ranking only fourth for flood count at 360. Louisiana follows at 693 fatalities from just 206 floods, giving it a fatality rate of 2.58."
      - "South Dakota carries the highest fatality rate on record at 5.99 from 271 floods and 249 fatalities, well above Louisiana's 2.58 and far above Texas's 1.08."

