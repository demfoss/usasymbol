faq:
  - question: "Which state has the most NASCAR tracks?"
    answer: "North Carolina has the most, with four active NASCAR national series tracks: Bowman Gray Stadium, Charlotte Motor Speedway, North Wilkesboro Speedway, and Rockingham Speedway."

  - question: "How many states have a NASCAR track?"
    answer: "21 states host at least one active NASCAR national series track. The other 29 states have none."

  - question: "Does Florida have more than one NASCAR track?"
    answer: "Yes. Florida has three: Daytona International Speedway, Homestead-Miami Speedway, and the St. Petersburg street circuit."

  - question: "Why does North Carolina have so many NASCAR tracks?"
    answer: "North Carolina's four tracks all sit in or near Charlotte, where most Cup Series teams have kept their shops since the sport's early days racing on Piedmont region short tracks."

  - question: "How many active NASCAR tracks are there in total?"
    answer: "32 tracks host a NASCAR Cup, Xfinity, or Craftsman Truck Series race on the current national schedule, spread across 21 states."

  - question: "Which states are tied for second-most NASCAR tracks?"
    answer: "California, Illinois, Indiana, Tennessee, Texas, and Virginia are each tied with two active NASCAR tracks."

