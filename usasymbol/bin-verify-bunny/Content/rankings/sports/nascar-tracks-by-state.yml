page:
  h1: "NASCAR Tracks by State"

  quick_answer:
    - "North Carolina has the most NASCAR tracks of any state, with four active national series venues: Bowman Gray Stadium, Charlotte Motor Speedway, North Wilkesboro Speedway, and Rockingham Speedway."
    - "Florida ranks second with three tracks: Daytona International Speedway, Homestead-Miami Speedway, and the St. Petersburg street circuit. Six states, California, Illinois, Indiana, Tennessee, Texas, and Virginia, are tied with two tracks apiece."
    - "Twenty-nine states have no active NASCAR national series track at all. The 32 tracks that do host Cup, Xfinity, or Craftsman Truck Series races are spread across just 21 states."

  methodology: "Counts every track that hosted a NASCAR Cup Series, Xfinity Series, or Craftsman Truck Series race on the 2026 national schedule. Each track is counted once per state regardless of how many series race there."

