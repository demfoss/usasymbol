sections:
  - id: "why-north-carolina-has-the-most-nascar-tracks"
    icon: "fa-solid fa-flag-checkered"
    title: "Why North Carolina Has the Most NASCAR Tracks"
    paragraphs:
      - "North Carolina's four tracks, Bowman Gray Stadium, Charlotte Motor Speedway, North Wilkesboro Speedway, and Rockingham Speedway, all sit inside or within an hour of Charlotte, NASCAR's traditional home base. Most Cup Series race teams still keep their shops in the Charlotte area, a legacy of the sport's early roots among stock car racers in the Piedmont region of North Carolina and Virginia."
      - "That geography also explains why Virginia, just across the state line, is tied for second-most with two tracks, Martinsville Speedway and Richmond Raceway. Three of North Carolina's four tracks, Charlotte, North Wilkesboro, and Rockingham, sit within 90 miles of each other."

  - id: "states-tied-with-two-nascar-tracks"
    icon: "fa-solid fa-map-location-dot"
    title: "States Tied With Two NASCAR Tracks"
    paragraphs:
      - "Six states host exactly two NASCAR national series tracks: California (Coronado Street Course and Sonoma Raceway), Illinois (Chicagoland Speedway and World Wide Technology Raceway), Indiana (Indianapolis Motor Speedway and Lucas Oil Indianapolis Raceway Park), Tennessee (Bristol Motor Speedway and Nashville Superspeedway), Texas (Circuit of the Americas and Texas Motor Speedway), and Virginia (Martinsville Speedway and Richmond Raceway)."
      - "Two of the newest entries on this list arrived recently. North Wilkesboro Speedway returned to the NASCAR calendar in 2023 after three decades dormant, and the Coronado Street Course in San Diego debuted on the Cup Series schedule in 2025, both part of NASCAR's push into markets outside its Piedmont core."

