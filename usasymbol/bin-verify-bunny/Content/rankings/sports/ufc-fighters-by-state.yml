    answer: "New York has produced 13 current UFC roster fighters, third most of any state, including two-time light heavyweight champion Jon Jones, born in Rochester."

  - question: "Does Missouri produce a lot of UFC talent?"
    answer: "Yes. Missouri has produced 11 current UFC roster fighters, fourth most of any state, including St. Louis-born Joaquin Buckley."

  - question: "What state ranks fifth for UFC fighters?"
    answer: "Colorado ranks fifth with 9 current UFC roster fighters, including Denver-born Donald Cerrone."

