  - question: "Which states have never produced a UFC fighter?"
    answer: "11 states have no fighter on the current UFC roster: Alaska, Delaware, Kentucky, Maine, New Hampshire, North Dakota, Rhode Island, South Dakota, Vermont, West Virginia, and Wyoming."

