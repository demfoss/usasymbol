faq:
  - question: "Which state has won the most Olympic gold medals?"
    answer: "California has won the most individual Olympic gold medals of any state, 127 dating back to 1896. New York ranks second with 70."

  - question: "How many Olympic gold medals does New York have?"
    answer: "New York has 70 individual Olympic gold medals, second among all states behind California's 127 and ahead of third-place Ohio's 44."

  - question: "Which states are tied for Olympic gold medals?"
    answer: "Pennsylvania and Maryland are tied for sixth place with 31 individual gold medals each."

  - question: "Which state sent the most athletes to the 2024 Olympics?"
    answer: "California sent 143 athletes to the 2024 Paris Olympics, the most of any state. Texas was second with 43, and Florida third with 42."

  - question: "Did every state send an athlete to the 2024 Olympics?"
    answer: "No. Wyoming and North Dakota were the only 2 states that sent no athletes to the 2024 Paris Olympics."

  - question: "Where are the next Summer Olympics?"
    answer: "The next Summer Olympics are scheduled for 2028 in Los Angeles, California, the state with the most all-time individual gold medals."

