  - id: "why-california-leads-all-states-in-olympic-gold-medals"
    icon: "fa-solid fa-star"
    title: "Why California Leads All States in Olympic Gold Medals"
    paragraphs:
      - "Part of California's 127-gold total traces to a single athlete: swimmer Mark Spitz, born in Modesto, won 7 individual golds at the 1972 Munich Games alone, a haul larger than New Jersey's entire all-time state total of 23."
      - "California's lead also reflects decades of sustained output rather than one performance. Its 127 golds stretch across the full 1896-2020 span this count covers, more than double Ohio's third-place total of 44."

  - id: "which-states-sent-the-most-athletes-to-the-2024-olympics"
    icon: "fa-solid fa-flag-usa"
    title: "Which States Sent the Most Athletes to the 2024 Olympics"
    paragraphs:
      - "California sent 143 athletes to the 2024 Paris Olympics, more than any other state and roughly triple Texas's 43. Florida sent 42, and Illinois, Pennsylvania, and Georgia each sent 27."
      - "New York sent 31 athletes and New Jersey 23, while Connecticut sent 11. Wyoming and North Dakota were the only 2 states that sent no athletes to Paris at all."

