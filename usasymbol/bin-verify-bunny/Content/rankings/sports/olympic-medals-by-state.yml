page:
  h1: "Olympic Medals by State"

  quick_answer:
    - "California has produced more Olympic gold medalists than any other state, 127 individual gold medals dating back to 1896, well ahead of second-place New York's 70."
    - "Ohio ranks third with 44 individual golds, ahead of Illinois (40) and Texas (34). Pennsylvania and Maryland are tied for sixth at 31 each, with New Jersey close behind at 23."
    - "At the 2024 Paris Olympics, California again sent the most athletes of any state, 143, while Wyoming and North Dakota sent none."

  methodology: "Counts individual Olympic gold medals by athlete birth state for the Summer Games, 1896 through 2020; team-sport medals are excluded because they cannot be attributed to a single state. The 2024 figures track the home state of each Team USA athlete, a separate measure from the all-time gold count."

