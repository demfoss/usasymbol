sections:
  - id: "states-with-the-most-olympic-gold-medals"
    icon: "fa-solid fa-medal"
    title: "States With the Most Olympic Gold Medals"
    paragraphs:
      - "California's 127 individual Olympic gold medals are more than New York (70), Ohio (44), and Illinois (40) combined. No other state comes within 50 golds of California's total."
      - "Pennsylvania and Maryland are tied for sixth place with 31 golds each, and New Jersey rounds out the group with 23. The next Summer Olympics, in 2028, will be hosted in Los Angeles, California."
