faq:
  - question: "Which state has the most NCAA Division I schools?"
    answer: "California has the most with 24 NCAA Division I schools, including Stanford, UCLA, and USC."

  - question: "Which state has no NCAA Division I schools?"
    answer: "Alaska has zero NCAA Division I schools. The next lowest total is 1, shared by five states: Hawaii, Maine, Minnesota, Vermont, and Wyoming."

  - question: "How many NCAA Division I schools are in Texas?"
    answer: "Texas has 21 NCAA Division I schools, the third most of any state, behind California and New York."

  - question: "How many NCAA Division I schools are in New York?"
    answer: "New York has 22 NCAA Division I schools, the second most of any state."

  - question: "How many total NCAA Division I schools are there by state?"
    answer: "There are 343 NCAA Division I schools spread across 49 states. Alaska is the only state without one."

  - question: "Which states have only one NCAA Division I school?"
    answer: "Five states have exactly one: Hawaii, Maine, Minnesota, Vermont, and Wyoming."

