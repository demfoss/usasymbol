faq:
  - question: "Which state has the most MLB teams?"
    answer: "California has 5 MLB teams, the most of any state: the Angels, Dodgers, Athletics, Padres, and Giants."

  - question: "How many MLB teams does Ohio have?"
    answer: "Ohio has 2 MLB teams, the Cincinnati Reds at Great American Ball Park and the Cleveland Guardians at Progressive Field."

  - question: "Where do the Athletics play now?"
    answer: "The Athletics play at Sutter Health Park in West Sacramento, California, for the 2025-2027 seasons, ahead of a planned relocation to Las Vegas."

  - question: "How many states have an MLB team?"
    answer: "17 states have at least one MLB franchise, out of the 28 teams assigned to a state."

  - question: "Does Florida have more than one MLB team?"
    answer: "Yes. Florida has 2 MLB teams, the Miami Marlins at loanDepot Park and the Tampa Bay Rays at George M. Steinbrenner Field."

  - question: "How many MLB teams are in Missouri?"
    answer: "Missouri has 2 MLB teams, the Kansas City Royals at Kauffman Stadium and the St. Louis Cardinals at Busch Stadium."

