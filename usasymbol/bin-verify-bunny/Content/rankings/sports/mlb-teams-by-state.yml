page:
  h1: "MLB Teams by State"

  quick_answer:
    - "California has the most MLB teams of any state with 5: the Los Angeles Angels, Los Angeles Dodgers, Athletics, San Diego Padres, and San Francisco Giants."
    - "Seven states have 2 teams each: Florida, Illinois, Missouri, New York, Ohio, Pennsylvania, and Texas. Illinois splits Chicago between the Cubs and White Sox."
    - "28 MLB clubs play across 17 states. The Washington Nationals play in the nation's capital, and the Toronto Blue Jays play in Canada, so neither counts toward a state total."

  methodology: "Teams are grouped by the U.S. state of their current home ballpark. The Athletics, playing at Sutter Health Park in West Sacramento for the 2025-2027 seasons before a planned move to Las Vegas, are counted under California. The Washington Nationals and Toronto Blue Jays are not assigned to a state. Data reflects the 2025 MLB season."

