sections:
  - id: "states-with-the-most-mlb-teams"
    icon: "fa-solid fa-baseball"
    title: "States With the Most MLB Teams"
    paragraphs:
      - "California has 5 MLB teams, more than any other state: the Angels, Dodgers, Athletics, Padres, and Giants. Seven states follow with 2 each, Florida, Illinois, Missouri, New York, Ohio, Pennsylvania, and Texas."
      - "Illinois and New York each split their pair inside one city. Chicago hosts the Cubs and White Sox, while the Mets and Yankees both play in New York City."

  - id: "where-the-athletics-play-now"
    icon: "fa-solid fa-location-dot"
    title: "Where the Athletics Play Now"
    paragraphs:
      - "The Athletics, who left Oakland after the 2024 season, play at Sutter Health Park in West Sacramento for the 2025-2027 seasons. That keeps the franchise in California even though it dropped a city name from its identity, ahead of a planned move to Las Vegas, Nevada."

