sections:
  - id: "states-with-the-highest-youth-sports-participation-rates"
    icon: "fa-solid fa-child-reaching"
    title: "States With the Highest Youth Sports Participation Rates"
    paragraphs:
      - "Vermont leads at 71.5%, followed by South Dakota at 68.8% and New Hampshire at 67.6%. Massachusetts ranks fourth at 65.3%, and Minnesota and Colorado tie for fifth at 65.0%."
      - "Iowa follows at 64.8%. North Dakota and Nebraska both sit at 64.0%, while Rhode Island, Wyoming, Maine, Hawaii, and Montana round out the fourteen states that reached 63.0% or higher in 2023."

  - id: "states-with-the-lowest-youth-sports-participation-rates"
    icon: "fa-solid fa-person-falling"
    title: "States With the Lowest Youth Sports Participation Rates"
    paragraphs:
      - "Nevada has the lowest youth sports participation rate at 43.3%, more than four points below every other state. Delaware is next lowest at 47.7%, and Florida follows at 48.4%."
      - "West Virginia sits at 48.6%, and Texas rounds out the bottom five at 49.0%. All five states fall short of the 55.4% national average, and each is more than 20 points behind Vermont's 71.5%."

  - id: "states-that-meet-the-63-percent-youth-sports-goal"
    icon: "fa-solid fa-flag-checkered"
    title: "States That Meet the 63% Youth Sports Goal"
    paragraphs:
      - "Fourteen states reached the federal government's 63% youth sports participation target in 2023: Vermont, South Dakota, New Hampshire, Massachusetts, Minnesota, Colorado, Iowa, North Dakota, Nebraska, Rhode Island, Wyoming, Maine, Hawaii, and Montana. Nine of the fourteen are in the Northeast or Midwest."
      - "The 63% goal comes from the federal government's target for youth sports participation by 2030. Vermont at 71.5% clears that target by more than 8 points, while Montana at 63.0% meets it exactly."

