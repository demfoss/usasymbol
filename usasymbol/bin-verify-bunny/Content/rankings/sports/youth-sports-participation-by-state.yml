page:
  h1: "Youth Sports Participation by State"

  quick_answer:
    - "Youth sports participation by state is highest in Vermont, where 71.5% of children ages 6 to 17 played on a sports team or took lessons in 2023."
    - "South Dakota ranks second at 68.8%, and New Hampshire is third at 67.6%. Fourteen states cleared the federal government's 63% participation target that year."
    - "Nevada has the lowest rate at 43.3%, more than four points below Delaware at 47.7%. The national average is 55.4%, and 43 states reached at least 50%."

  methodology: "Participation rate is the share of children ages 6 to 17 who played on a sports team or took sports lessons in the past 12 months, from 2023 National Survey of Children's Health data reported by USAFacts and Project Play's State of Play 2025 report. Only states with a published rate in those sources are listed."

  sources:
    - name: "USAFacts. Are fewer kids playing sports?"
      url: "https://usafacts.org/articles/are-fewer-kids-playing-sports/"
      description: "State-level 2023 NSCH figures for the highest and lowest youth sports participation states and the national average"
    - name: "Aspen Institute Project Play. State of Play 2025, Participation Trends"
      url: "https://projectplay.org/state-of-play-2025/participation-trends"
      description: "List of states that reached the federal 63% youth sports participation target using 2023 NSCH data"
