faq:
  - question: "Which state has the highest youth sports participation rate?"
    answer: "Vermont has the highest rate at 71.5%. South Dakota is second at 68.8%, and New Hampshire is third at 67.6%."

  - question: "Which state has the lowest youth sports participation rate?"
    answer: "Nevada has the lowest rate at 43.3%. Delaware is next lowest at 47.7%, more than four points higher than Nevada."

  - question: "What is the youth sports participation rate in Texas?"
    answer: "Texas has a youth sports participation rate of 49.0%, the fifth lowest among states with a published rate. That puts Texas below the 55.4% national average."

  - question: "What is the youth sports participation rate in Massachusetts?"
    answer: "Massachusetts has a rate of 65.3%, good for fourth highest. It sits just above Minnesota and Colorado, which both post 65.0%."

  - question: "What is the national youth sports participation rate?"
    answer: "The national rate is 55.4% for children ages 6 to 17, based on 2023 data. Forty-three states reached at least 50%."

  - question: "How many states meet the federal 63% youth sports participation goal?"
    answer: "Fourteen states met the 63% target in 2023: Vermont, South Dakota, New Hampshire, Massachusetts, Minnesota, Colorado, Iowa, North Dakota, Nebraska, Rhode Island, Wyoming, Maine, Hawaii, and Montana. Vermont clears the target by the widest margin at 71.5%."

