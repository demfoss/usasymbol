page:
  h1: "Best States for Fishing"

  quick_answer:
    - "Alaska ranks first among the best states for fishing in the 2024 data. Florida is second and Delaware third."
    - "Florida and Michigan share the highest 2023 score at 126.5. Delaware follows at 125, then Alaska at 122.5, yet Alaska holds the top 2024 rank."
    - "Delaware rose from 38th in 2022 to 3rd in 2024, a 35-place gain. Montana and Alabama each fell 29 places, the largest declines."

  methodology: "The table reproduces World Population Review's FishingBooker Rank 2024 and Fishbox Score 2023, plus a separate fishing rank and score for 2022. Washington, D.C. is excluded."

