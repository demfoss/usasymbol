faq:
  - question: "Which state is best for fishing?"
    answer: "Alaska ranks first overall. Florida ranks second and Delaware ranks third."

  - question: "What was Florida's fishing rank in 2024?"
    answer: "Florida ranks second in the 2024 list. Its 2023 score is 126.5, tied with Michigan for the highest value in that column."

  - question: "Which state ranked last for fishing in 2024?"
    answer: "Idaho ranks 50th in 2024. It ranked 29th in the separate 2022 index, a difference of 21 places."

  - question: "Which state made the biggest jump in the fishing rankings?"
    answer: "Delaware. It moved from 38th in the 2022 index to 3rd in the 2024 list, a 35-place climb."

  - question: "Which state fell the most in the fishing rankings?"
    answer: "Montana and Alabama tie with 29-place drops. Montana fell from 3rd in 2022 to 32nd in 2024, while Alabama moved from 14th to 43rd."

  - question: "What is the fishing rank for Texas?"
    answer: "Texas ranks 28th in the 2024 list. It ranked 5th in the separate 2022 index, a 23-place decline."

