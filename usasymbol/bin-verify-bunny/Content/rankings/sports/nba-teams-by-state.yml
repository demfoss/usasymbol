faq:
  - question: "Which state has the most NBA teams?"
    answer: "California has 4 NBA teams, one more than Texas's 3 and two more than Florida or New York's 2 each."

  - question: "How many NBA teams does Texas have?"
    answer: "Texas has 3 NBA teams: the Dallas Mavericks, Houston Rockets, and San Antonio Spurs."

  - question: "Does Florida have more than one NBA team?"
    answer: "Yes. Florida has 2 NBA teams, the Miami Heat at Kaseya Center and the Orlando Magic at Kia Center."

  - question: "How many states have an NBA team?"
    answer: "21 states have at least one NBA franchise, out of the 28 teams assigned to a state."

  - question: "Does Washington, D.C. have an NBA team?"
    answer: "Yes, the Washington Wizards play in the nation's capital. Since D.C. is not a state, the Wizards are not counted toward any state's total in this ranking."

  - question: "How many NBA teams are in New York?"
    answer: "New York has 2 NBA teams, the Brooklyn Nets at Barclays Center and the New York Knicks at Madison Square Garden."

