          wins: 3
        - state: "Nevada"
          wins: 3

  - id: "why-pennsylvania-has-the-most-super-bowl-wins"
    icon: "fa-solid fa-star"
    title: "Why Pennsylvania Has the Most Super Bowl Wins"
    paragraphs:
      - "Pennsylvania's total leads because it is the only state to field two separate multi-title Super Bowl franchises. The Pittsburgh Steelers won 6 times between 1975 and 2009, and the Philadelphia Eagles added 2 more in 2018 and 2025, roughly 300 miles away on the opposite side of the state."
      - "No other state combines two Super Bowl-winning franchises the way Pennsylvania does. California's 7 wins come from the 49ers and Rams, but Massachusetts, Texas, and Missouri each owe their entire win total to a single team."

  - id: "states-with-super-bowl-losses-but-no-wins"
    icon: "fa-solid fa-face-frown"
    title: "States With Super Bowl Losses but No Wins"
    paragraphs:
      - "Minnesota has the longest winless record of any state, going 0-4 across four Vikings appearances between 1970 and 1977. Ohio follows at 0-3, all Cincinnati Bengals losses, while the Cleveland Browns have never reached a Super Bowl at all."
      - "Georgia and North Carolina are both 0-2, and Tennessee and Arizona have each lost their only appearance. Combined, these 6 states account for 13 Super Bowl losses and zero championships."

