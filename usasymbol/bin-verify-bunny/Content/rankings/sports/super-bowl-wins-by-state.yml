sections:
  - id: "states-with-the-most-super-bowl-wins"
    icon: "fa-solid fa-trophy"
    title: "States With the Most Super Bowl Wins"
    paragraphs:
      - "Pennsylvania's 8 Super Bowl wins are the most of any state, built from the Pittsburgh Steelers' 6 titles and the Philadelphia Eagles' 2. California ranks second with 7 wins across three franchises, and Massachusetts is third with 6, all won by the New England Patriots."
      - "Texas and New York are tied for fourth with 5 wins each. The Dallas Cowboys account for all 5 of Texas's wins, while New York splits its 5 across the Giants and the Jets."
    table:
      numbered: true
      columns:
        state: "State"
        wins: "Wins"
