page:
  h1: "Super Bowl Wins by State"

  quick_answer:
    - "Pennsylvania has won the most Super Bowls of any state, 8 total: 6 by the Pittsburgh Steelers and 2 by the Philadelphia Eagles."
    - "California has appeared in the most Super Bowls of any state, 14, combining the San Francisco 49ers (8 appearances, 5 wins), the Rams (5 appearances, 2 wins), and the Chargers (1 appearance, 0 wins). Its 7 total wins rank second behind Pennsylvania."
    - "Minnesota has the most Super Bowl losses without ever winning: the Vikings have gone 0-4 across four appearances, more than any other winless franchise."

  methodology: "Wins and appearances are counted through Super Bowl LX (February 2026) and grouped by each franchise's current state, following the same convention used for NFL Team locations. The Washington Commanders' 3 wins and 5 appearances are not assigned to any state, since the franchise's identity is tied to Washington, D.C., not a state."

