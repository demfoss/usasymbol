faq:
  - question: "Which state has won the most Super Bowls?"
    answer: "Pennsylvania has won the most Super Bowls with 8: 6 by the Pittsburgh Steelers and 2 by the Philadelphia Eagles."

  - question: "Which state has the most Super Bowl appearances?"
    answer: "California has the most Super Bowl appearances with 14, combining the 49ers (8), Rams (5), and Chargers (1). Its 7 total wins rank second behind Pennsylvania's 8."

  - question: "Which NFL teams have never played in a Super Bowl?"
    answer: "The Cleveland Browns, Detroit Lions, Houston Texans, and Jacksonville Jaguars are the only 4 NFL franchises that have never reached a Super Bowl."

  - question: "Do the Washington Commanders count toward a state's Super Bowl total?"
    answer: "No. The Commanders' 3 wins and 5 Super Bowl appearances are not counted for any state, since the franchise's identity is tied to Washington, D.C., which is not a state."

  - question: "Which state has the most Super Bowl losses without ever winning?"
    answer: "Minnesota has lost all 4 of its Super Bowl appearances, the most of any state without a single title. The Vikings lost in 1970, 1974, 1975, and 1977."

  - question: "Which states have a perfect Super Bowl record?"
    answer: "Maryland is 2-0 behind the Baltimore Ravens, and Louisiana is 1-0 behind the New Orleans Saints. Both states have never lost a Super Bowl appearance."

