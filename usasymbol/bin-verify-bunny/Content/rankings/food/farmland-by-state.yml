  - id: "highest-percentage-of-farmland-by-state"
    icon: "fa-solid fa-percent"
    title: "States With the Highest Farmland Share"
    paragraphs:
      - "Nebraska has the highest share of state land in farmland at 89.4%, narrowly ahead of North Dakota (87.3%) and South Dakota (87.2%). Kansas (85.6%) and Iowa (83.9%) round out the top five, while Texas leads total acreage with 75% of its land in farmland."
    table:
      columns:
        state: "State"
        percent_of_land: "% of State Land"
      rows:
