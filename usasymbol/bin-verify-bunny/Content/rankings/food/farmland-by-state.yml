sections:
  - id: "states-with-the-most-farmland"
    icon: "fa-solid fa-wheat-awn"
    title: "States With the Most Farmland"
    paragraphs:
      - "Texas has the most farmland in the country at 125,471,325 acres, 75% of the state's land area. Montana (57,601,320 acres) is a distant second, followed by Kansas (44,794,702), Nebraska (43,975,693), and South Dakota (42,304,601)."
    table:
      columns:
        state: "State"
        farmland_acres: "Farmland Acres"
      rows:
