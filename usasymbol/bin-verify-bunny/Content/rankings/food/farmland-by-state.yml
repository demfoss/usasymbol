faq:
  - question: "Which state has the most farmland?"
    answer: "Texas has the most farmland at 125,471,325 acres, 75% of the state's land area and 14.26% of all US farmland."

  - question: "Which state has the highest percentage of farmland?"
    answer: "Nebraska has the highest share of state land in farmland at 89.4%. Kansas (85.6%) and Iowa (83.9%) also rank in the top five for farmland share."

  - question: "Which state has the least farmland?"
    answer: "Rhode Island has the least farmland by acreage at 59,076 acres, the smallest total in the table."

  - question: "Which state has the smallest percentage of farmland?"
    answer: "Alaska has the smallest share of state land in farmland at just 0.2%, even though it has more total acres than Rhode Island."

  - question: "How much farmland is there in the United States?"
    answer: "The US has 880,100,848 acres of farmland listed in the most recent full agricultural census."

  - question: "How much farmland does California have?"
    answer: "California has 24,190,604 acres of farmland, 24.3% of the state's land area and 2.75% of all US farmland."

