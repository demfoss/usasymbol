          percent_of_land: "85.6%"
        - state: "Iowa"
          percent_of_land: "83.9%"

  - id: "states-with-the-least-farmland"
    icon: "fa-solid fa-seedling"
    title: "States With the Least Farmland"
    paragraphs:
      - "Rhode Island has the least farmland by acreage in the country at 59,076 acres, just 8.9% of its land area. Connecticut (372,014 acres), New Hampshire (417,187), Massachusetts (464,451), and Delaware (522,834) round out the five smallest by acreage."
      - "Alaska has the smallest share of state land in farmland at 0.2%, even though its 869,852 acres are more than ten times Rhode Island's 59,076 acres."
