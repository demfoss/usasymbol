  description: "Texas has the most farmland at 125.5 million acres. Nebraska has the highest share of state land in farmland at 89.4%."

page:
  h1: "Farmland by State"

  quick_answer:
    - "Texas has the most farmland in the country at 125,471,325 acres, 75% of the state's land area."
    - "Nebraska has the highest share of state land in farmland at 89.4%, ahead of North Dakota (87.3%) and South Dakota (87.2%), even though Texas has more than double Nebraska's total acres."
    - "Rhode Island has the least farmland by acreage at 59,076 acres, but Alaska has the smallest share of state land in farmland at just 0.2%."

  methodology: "Acreage and percentage of state land come from the USDA's 2022 Census of Agriculture, the most recent full survey, which totals 880,100,848 acres of farmland nationwide. Per-acre farmland market values are not tracked in this table."

  sources:
    - name: "World Population Review. States With the Most Farmland"
      url: "https://worldpopulationreview.com/state-rankings/states-with-most-farmland"
      description: "State-by-state farmland acreage and percentage of state land, from the USDA's 2022 Census of Agriculture"
    - name: "Visual Capitalist. Mapped: Farmland by State in 2025"
      url: "https://www.visualcapitalist.com/mapped-farmland-by-state-in-2025/"
      description: "Visual breakdown of US farmland distribution by state"

