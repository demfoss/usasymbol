seo:
  title: "Starbucks vs Dunkin' by State | Map & Rankings"
  description: "Starbucks leads 39 states on a per-capita basis. Dunkin' wins 11, all in the Northeast. Rhode Island has the highest Dunkin' concentration of any state."

page:
  h1: "Starbucks vs Dunkin' by State"

  quick_answer:
    - "Starbucks wins 39 states on a per-capita basis, while Dunkin' wins 11, every one of them in the Northeast. Rhode Island is the most Dunkin'-saturated state in the country at roughly 44 locations per 100,000 residents."
    - "Washington leads all Starbucks states at about 12 locations per 100,000. The six New England states (Rhode Island, New Hampshire, Connecticut, Massachusetts, Maine, Vermont) are the only states where Dunkin' outnumbers Starbucks by a ratio greater than 2 to 1 per capita."
    - "Mississippi (3.1 per 100,000) has the fewest winning-chain locations per capita of any state. Rhode Island (44 per 100,000) has the most, and the gap between the two reflects how differently coffee culture is embedded across regions."

  methodology: "Winner and per-100,000 figures are derived from aggregated U.S. location counts for Starbucks and Dunkin' (approximately 2024) divided by 2023 Census population estimates. State-level location counts are approximate; figures for Washington may be elevated by the Starbucks Reserve Roastery and company-operated density in the Seattle metro."

  sources:
    - name: "U.S. Census Bureau — State and County Population Estimates"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "2023 population estimates used as the denominator for per-100,000 calculations"

