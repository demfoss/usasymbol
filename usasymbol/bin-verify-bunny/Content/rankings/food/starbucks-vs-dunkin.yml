faq:
  - question: "Which state has the most Dunkin' locations per capita?"
    answer: "Rhode Island leads all states with roughly 44 Dunkin' locations per 100,000 residents. New Hampshire ranks second at 24 per 100,000, and Connecticut is third at 17."

  - question: "How many states does Dunkin' win?"
    answer: "Dunkin' wins 11 states on a per-capita basis: Rhode Island, New Hampshire, Connecticut, Massachusetts, Maine, Vermont, New Jersey, New York, Delaware, Maryland, and Pennsylvania. Every one is in the Northeast."

  - question: "Which state has the most Starbucks per capita?"
    answer: "Washington leads Starbucks states at about 12 locations per 100,000 residents. Nevada is second at 9.5. Washington is the home state of Starbucks, which was founded in Seattle in 1971."

  - question: "Does Florida have more Starbucks or Dunkin'?"
    answer: "Starbucks wins Florida at approximately 4.4 locations per 100,000. Dunkin' has a substantial presence in South Florida due to Northeast transplants, but Starbucks outnumbers it statewide on a per-capita basis."

  - question: "What is the dominant coffee chain in Texas?"
    answer: "Starbucks dominates Texas at 4.6 locations per 100,000. Dunkin' has fewer than 500 locations in a state with over 30 million residents, giving Starbucks a wide margin."

  - question: "Which state has the fewest coffee chain locations per capita?"
    answer: "Mississippi ranks last at 3.1 winning-chain locations per 100,000 residents, the lowest figure among all 50 states. West Virginia (3.3) and Arkansas (3.5) follow close behind."

