sections:
  - id: "states-where-dunkin-dominates"
    icon: "fa-solid fa-coffee"
    title: "States Where Dunkin' Dominates"
    paragraphs:
      - "All 11 states where Dunkin' outnumbers Starbucks per capita sit in the Northeast, from Maine to Maryland. Rhode Island leads the country at 44 Dunkin' locations per 100,000 residents, more than triple the next-highest state for any chain."
      - "New Hampshire ranks second at 24 per 100,000. Connecticut, Massachusetts, Maine, and Vermont follow, each between 13 and 17. These six New England states account for Dunkin's deepest market penetration anywhere in the country."

  - id: "most-starbucks-per-capita-by-state"
    icon: "fa-solid fa-star"
    title: "States With the Most Starbucks Per Capita"
    paragraphs:
      - "Washington leads all Starbucks states at 12 locations per 100,000. Nevada ranks second at 9.5, driven by high tourism density in Las Vegas, where drive-through locations concentrate in resort corridors."
      - "Oregon, Colorado, Arizona, Utah, and California all fall between 7.6 and 8.5 per 100,000, forming a dense Starbucks corridor across the Mountain West and Pacific Coast. Mississippi ranks last among Starbucks states at 3.1 per 100,000."

