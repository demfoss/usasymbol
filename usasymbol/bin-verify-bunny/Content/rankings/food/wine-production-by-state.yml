    icon: "fa-solid fa-ban"
    title: "States With No Wine Production Data Reported"
    paragraphs:
      - "Louisiana, New Mexico, and Pennsylvania have no wine production figure listed. The Alcohol and Tobacco Tax and Trade Bureau withholds a state's data when the figure could identify a specific taxpayer, which applies to a small number of states each year."

faq:
  - question: "Which state produces the most wine?"
    answer: "California produces the most wine of any state, at 609,607,342 gallons a year, 80.79% of the national total."

  - question: "What percentage of US wine comes from California?"
    answer: "California accounts for 80.79% of national wine production. New York is a distant second at 4.38%."

  - question: "Which state produces the least wine?"
    answer: "Nevada reports the least wine production among states with data, at 1,526 gallons a year."

  - question: "How much wine does New York produce?"
    answer: "New York produces 33,084,702 gallons of wine a year, 4.38% of the national total and the second most of any state."

  - question: "Why isn't Pennsylvania listed in wine production data?"
    answer: "Pennsylvania, along with Louisiana and New Mexico, has no figure listed because the Alcohol and Tobacco Tax and Trade Bureau withholds a state's data when it could identify a specific taxpayer."

  - question: "How much wine does Washington state produce?"
    answer: "Washington produces 32,373,972 gallons of wine a year, 4.29% of the national total, the third most of any state behind California and New York."

