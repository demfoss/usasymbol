    paragraphs:
      - "California produced 609,607,342 gallons of wine, more than 18 times as much as second-place New York at 33,084,702. Washington is close behind New York at 32,373,972, and Oregon ranks fourth at 17,091,139."
      - "Kentucky rounds out the top five at 7,815,921 gallons. Ohio, Michigan, Massachusetts, Texas, and North Carolina complete the top ten, ranging from 5,779,222 down to 2,857,573."

  - id: "californias-share-of-national-wine-production"
    icon: "fa-solid fa-percent"
    title: "California's Share of National Wine Production"
    paragraphs:
      - "California's 609,607,342 gallons account for 80.79% of national wine production, meaning the other 46 states with reported data combine for less than a fifth of the total. New York's 4.38% share is the next largest, followed by Washington at 4.29%."

