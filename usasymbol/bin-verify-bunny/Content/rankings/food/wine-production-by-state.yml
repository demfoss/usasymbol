page:
  h1: "Wine Production by State"

  quick_answer:
    - "California produced 609,607,342 gallons of wine, 80.79% of the national total and far more than every other state combined."
    - "New York ranks second at 33,084,702 gallons, 4.38% of national production, followed by Washington at 32,373,972 gallons and Oregon at 17,091,139 gallons."
    - "Nevada reported the least wine production at 1,526 gallons. Louisiana, New Mexico, and Pennsylvania report no production data at all."

  methodology: "Annual wine production figures for 2023, in gallons, come from the Alcohol and Tobacco Tax and Trade Bureau. Louisiana, New Mexico, and Pennsylvania are not listed, since the source withholds figures that could identify a specific taxpayer."

