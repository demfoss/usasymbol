faq:
  - question: "What is the most popular Thanksgiving side dish by state?"
    answer: "Stuffing or dressing is the most popular Thanksgiving side dish in 42 states, according to Campbell's 2025 survey. Mashed potatoes rank second, topping the list in 9 states."

  - question: "Which states prefer mashed potatoes over stuffing for Thanksgiving?"
    answer: "Indiana, Kansas, New Mexico, and Washington all rank mashed potatoes as their top Thanksgiving side, part of 9 states nationwide where mashed potatoes take first place."

  - question: "Which states pick mac and cheese as their favorite Thanksgiving side?"
    answer: "Florida and New York are the only two states where mac and cheese ranks first. It's also the #1 side for Gen Z nationally, at 41%."

  - question: "What is the favorite Thanksgiving side dish in California?"
    answer: "Stuffing or dressing. California switched back to stuffing in 2025 after favoring mashed potatoes in 2024, alongside West Virginia and Wyoming."

  - question: "Is green bean casserole the top Thanksgiving side in any state?"
    answer: "No state ranks green bean casserole first in the 2025 survey. It places in the top three in 8 states, including Iowa, Kansas, and Indiana, and reaches the top five in 31 states."

  - question: "Which states have a tie for their favorite Thanksgiving side dish?"
    answer: "Delaware, Idaho, Illinois, and Maryland each show a tie between multiple dishes for the top spot, the only states without one clear favorite."

