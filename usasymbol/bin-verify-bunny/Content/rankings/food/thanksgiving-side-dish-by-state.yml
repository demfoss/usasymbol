page:
  h1: "Favorite Thanksgiving Side Dish by State"

  quick_answer:
    - "Stuffing or dressing is the top Thanksgiving side dish in 42 states, the fourth year running as America's most popular choice, according to Campbell's 2025 State of the Sides survey of 5,000 US adults."
    - "Mashed potatoes rank second nationally, topping the list in 9 states including Indiana, Kansas, New Mexico, and Washington, all of which switched away from stuffing this year."
    - "Florida and New York are the only two states naming mac and cheese their top Thanksgiving side, while Delaware, Idaho, Illinois, and Maryland show ties between multiple dishes."

  methodology: "Data comes from Campbell's 2025 State of the Sides Report, a survey of 5,000 US adults conducted by Reputation Leaders in July-August 2025, with 100 respondents in each state. Margin of error is +/-9.8% at the state level."

