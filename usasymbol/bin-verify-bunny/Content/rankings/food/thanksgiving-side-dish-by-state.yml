sections:
  - id: "most-popular-thanksgiving-side-dish-by-state"
    icon: "fa-solid fa-bowl-food"
    title: "Most Popular Thanksgiving Side Dish by State"
    paragraphs:
      - "Stuffing or dressing ranks first in 42 states, according to Campbell's 2025 State of the Sides survey of 5,000 US adults. It has held the top spot for four consecutive years, and Minnesota, North Dakota, and Alabama show the strongest loyalty to it as a favorite."
      - "Mashed potatoes rank second nationally, topping 9 states. Indiana, Kansas, New Mexico, and Washington switched from stuffing to mashed potatoes as their top side this year, while California, West Virginia, and Wyoming switched back to stuffing after favoring mashed potatoes in 2024."

  - id: "states-where-mac-and-cheese-beats-stuffing"
    icon: "fa-solid fa-cheese"
    title: "States Where Mac and Cheese Beats Stuffing"
    paragraphs:
      - "Florida and New York are the only two states that name mac and cheese their top Thanksgiving side, breaking from stuffing entirely. Mac and cheese ranks in the top three in 19 states overall and is especially popular across the South."
      - "Mac and cheese also posted the fastest growth of any top side, rising to a 20% share in 2025. It is the #1 side dish for Gen Z at 41%, with 70% of that generation saying it should be a staple at every holiday meal."

  - id: "states-with-no-clear-favorite-thanksgiving-side"
    icon: "fa-solid fa-scale-balanced"
    title: "States With No Clear Favorite Thanksgiving Side"
    paragraphs:
      - "Delaware, Idaho, Illinois, and Maryland are the only states where multiple side dishes tie for first place, according to the survey. Maryland's tie comes even though the state also lands in second place for yams and sweet potatoes."
      - "Yams and sweet potatoes never rank first in any state in this survey, but they place in the top three in 24 states and take second in Arkansas, Maryland, Mississippi, New Jersey, and New York."

