faq:
  - question: "Which state has the most Subway stores?"
    answer: "California has the most Subway stores of any state at 2,099, ahead of Texas at 1,876 and Florida at 1,248."

  - question: "Which state has the fewest Subway stores?"
    answer: "Delaware has the fewest Subway stores among states with data, at 24. Vermont follows at 43, and Alaska is next at 53."

  - question: "Which U.S. territories have no Subway stores?"
    answer: "Puerto Rico, American Samoa, Guam, the U.S. Virgin Islands, and Northern Mariana Islands have no Subway stores. All five are territories, not states."

  - question: "Which city has the most Subway locations?"
    answer: "Houston has the most Subway locations of any U.S. city, with 201 stores. Chicago is second with 182, and San Antonio is third with 115."

  - question: "How many Subway stores are in Texas?"
    answer: "Texas has 1,876 Subway stores, the second most of any state, behind only California."

  - question: "How many Subway stores are there in the United States?"
    answer: "State-level counts here total well over 20,000 across 49 states with data. A separate national summary puts the total at 20,156 locations nationwide as of July 6, 2026."

