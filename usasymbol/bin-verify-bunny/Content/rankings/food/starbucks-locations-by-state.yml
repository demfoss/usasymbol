sections:
  - id: "why-california-leads-the-starbucks-store-count"
    icon: "fa-solid fa-mug-hot"
    title: "Why California Leads the Starbucks Store Count"
    paragraphs:
      - "California leads with 3,105 Starbucks stores, more than twice Texas's 1,350. Its large population and many major metro areas create more potential locations for both stand-alone coffee shops and licensed counters."
      - "The source combines company-operated and licensed stores, so these totals cover more than traditional Starbucks cafes. They should not be compared with datasets that count only company-operated stores or only locations found in the public locator."

  - id: "how-to-read-the-lowest-starbucks-counts"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "How to Read the Lowest Starbucks Counts"
    paragraphs:
      - "Vermont has 11 Starbucks stores, followed by Wyoming with 26 and North Dakota with 29. These are absolute totals, so states with smaller populations tend to appear near the bottom."
      - "A low store count does not measure customer demand, sales, or locations per resident. A per-capita ranking could produce a different order, especially for small states."

