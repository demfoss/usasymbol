  description: "Miller is the most popular beer in 29 states, while Coors leads 8. Budweiser wins Missouri and New Hampshire, and Bud Light leads Ohio."

page:
  h1: "Most Popular Beer by State"

  quick_answer:
    - "Miller is the most popular beer by state in 29 states, more than any other brand on this map."
    - "Coors ranks second with 8 states, including Arizona, California, Texas, and Virginia. Budweiser wins only Missouri and New Hampshire, while Bud Light leads only Ohio and North Carolina."
    - "Several brands appear in just one state. Blue Moon wins Colorado, Corona wins Connecticut, Busch wins Illinois and Indiana, and Heineken leads Florida and New York."

  methodology: "This page uses the state-by-state Google Trends results published by MiscMapped from Coffeeness data on April 12, 2025. The District of Columbia appears in the original table but is excluded here so the map covers the 50 U.S. states only."

