      style: chips
      use_colors: true

sections:
  - id: "states-where-miller-is-most-popular"
    icon: "fa-solid fa-beer-mug-empty"
    title: "States Where Miller Is Most Popular"
    paragraphs:
      - "Miller is the most popular beer in 29 of the 50 states on this map. That group stretches from Alabama and Louisiana to Washington and Wyoming."
      - "Miller's footprint includes much of the Midwest, Plains, and interior West. It also wins Hawaii, Maryland, Massachusetts, and Rhode Island, which shows how broad its map is compared with every other brand."

  - id: "states-where-coors-is-most-popular"
    icon: "fa-solid fa-mountain-sun"
    title: "States Where Coors Is Most Popular"
    paragraphs:
      - "Coors ranks second with 8 states. Arizona, California, Michigan, New Mexico, Pennsylvania, Tennessee, Texas, and Virginia all place it first."
      - "That makes Coors the only brand with a clear second tier behind Miller. Budweiser and Bud Light each win only 2 states, so Coors stands alone as the main challenger."

  - id: "beer-brand-outliers-by-state"
    icon: "fa-solid fa-star"
    title: "Beer Brand Outliers by State"
    paragraphs:
      - "Several brands win only one state each. Blue Moon leads Colorado, Corona leads Connecticut, and Busch leads Illinois and Indiana."
      - "Guinness wins Georgia, New Jersey, and South Carolina, while Heineken leads Florida and New York. Those smaller pockets break up what would otherwise be a map dominated almost entirely by Miller and Coors."

faq:
  - question: "What is the most popular beer in Texas?"
    answer: "Coors is the most popular beer in Texas on this map. Arizona and California also rank Coors first."

  - question: "What is the most popular beer in California?"
    answer: "Coors is the most popular beer in California. It is one of 8 states where Coors ranks first."

  - question: "What is the most popular beer in New York?"
    answer: "Heineken is the most popular beer in New York in this dataset. Florida is the only other state where Heineken ranks first."

  - question: "What is the most popular beer in Wisconsin?"
    answer: "Miller is the most popular beer in Wisconsin. Miller leads 29 states overall, more than any other brand on the map."

  - question: "Which beer brand is most popular in the most states?"
    answer: "Miller leads the map with 29 states. Coors is next with 8 states, while Guinness wins 3."

  - question: "What is the most popular beer in Colorado?"
    answer: "Blue Moon is the most popular beer in Colorado on this map. Colorado is the only state where Blue Moon ranks first."

