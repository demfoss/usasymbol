  title: "Most Popular Beer by State"
  image: "/images/rankings/food/most-popular-beer-brand/most-popular-beer-brand-map.webp"
  image_alt: "Map of the United States showing the most popular beer brand in each state with brand logos overlaid on states"
  caption: "Miller leads 29 states, far more than any other brand. Coors wins 8 states, while Budweiser and Bud Light each take only 2."
  metric_key: popular_beer
  metric_label: "beer brand"
  image_key: logo_image
  detail_keys:
    - brand_state_wins
  color_scheme: categorical
  color_map:
    "Miller": "#c9a227"
    "Coors": "#9ca3af"
    "Budweiser": "#c8102e"
    "Bud Light": "#1d4ed8"
    "Busch": "#1e40af"
    "Guinness": "#111111"
    "Heineken": "#007a33"
