faq:
  - question: "Which fast food chain is most popular in the most states?"
    answer: "Wendy's and Sonic, with five states each. Wendy's leads Montana, Ohio, Pennsylvania, Utah, and West Virginia, while Sonic leads Arkansas, Kansas, Mississippi, New Mexico, and Oklahoma."

  - question: "What is the number one fast food chain in the US?"
    answer: "McDonald's by market presence, ranking among the three most-visited chains in 49 of 50 states. Chick-fil-A rates highest with customers, taking the top-rated spot in 34 states."

  - question: "What is the most popular fast food in Texas?"
    answer: "Whataburger, which leads Texas as both the most popular and local favorite chain. Chick-fil-A is the state's top-rated chain and its most visited."

  - question: "What is the most popular fast food in California?"
    answer: "In-N-Out Burger. The chain ranks as California's most popular, top-rated, and local favorite, while Starbucks, McDonald's, and Chick-fil-A lead by visits."

  - question: "What is the most popular fast food in the South?"
    answer: "Sonic leads five Southern and Southwestern states, including Oklahoma, Arkansas, and Mississippi. Bojangles tops both Carolinas, Popeyes leads Louisiana, and Captain D's takes Alabama."

