sections:
  - id: "chains-by-number-of-states"
    icon: "fa-solid fa-trophy"
    title: "Fast Food Chains Leading the Most States"
    paragraphs:
      - "Wendy's and Sonic each lead five states, the most of any chain. Wendy's tops Montana, Ohio, Pennsylvania, Utah, and West Virginia, while Sonic leads Arkansas, Kansas, Mississippi, New Mexico, and Oklahoma."
      - "Jimmy John's and Subway follow with three states each. Jimmy John's holds Illinois, Iowa, and Minnesota, and Subway leads Maine, North Dakota, and Vermont."

  - id: "regional-fast-food-favorites"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Fast Food Favorites"
    paragraphs:
      - "In-N-Out Burger sweeps all three columns in California, ranking as the state's most popular, top-rated, and local favorite chain. Whataburger and Culver's each take two, leading the most-popular and local-favorite columns in Texas and Wisconsin."
      - "Bojangles leads both North Carolina and South Carolina, and Taco John's pairs South Dakota with Wyoming. Single-state leaders include Popeyes in Louisiana, Panda Express in Hawaii, Shake Shack in New York, and Pollo Tropical in Florida."

  - id: "top-rated-fast-food"
    icon: "fa-solid fa-star"
    title: "Top Rated Fast Food Chain by State"
    paragraphs:
      - "Chick-fil-A is the top-rated chain in 34 of 50 states, from Texas to Maine, yet it leads the most-popular column only in Delaware and Georgia."
      - "McDonald's shows the opposite pattern. The chain ranks among the three most-visited in 49 states, missing only Alabama, but never tops the most-popular column."

