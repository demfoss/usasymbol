sections:
  - id: "which-candies-win-most-states"
    icon: "fa-solid fa-trophy"
    title: "Which Candies Win the Most States?"
    paragraphs:
      - "Starburst leads more states than any other candy in this dataset. It ranks first outright in 10 states, and it also appears in ties in Arkansas and Iowa. That gives it the widest overall footprint across the map."
      - "Sour Patch Kids ranks second, leading in 8 states. Reese's Peanut Butter Cups, Skittles, and Sour Punch Straws each lead in 4 states. The result shows that a handful of big national candy brands dominate, even though no single candy comes close to winning everywhere."

  - id: "regional-candy-favorites"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Candy Favorites and Unusual Picks"
    paragraphs:
      - "Some state favorites look national, but a few picks are strongly tied to local identity or regional taste. Delaware stands out with Salt Water Taffy, a candy closely associated with beach towns and boardwalk shops along the Mid-Atlantic coast."
      - "Other states also break from the national pattern. Kentucky favors Dubble Bubble, Idaho picks 3 Musketeers, and Oklahoma goes with Lemonheads. These one-state winners make the map more varied than a simple list of the biggest candy brands."

