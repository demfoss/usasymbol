  - question: "What is the favorite candy by state?"
    answer: "Favorite candy varies by state. Starburst leads in the most states — 10 states, with ties in Arkansas and Iowa. See the full table above for every state's top candy."

  - question: "What is the most popular candy in the U.S.?"
    answer: "Starburst is the most popular candy across U.S. states, ranking first in more states than any other candy. Sour Patch Kids ranks second, leading in 8 states."

  - question: "Which candy is favorite in the most states?"
    answer: "Starburst. It tops the candy rankings in 10 states outright and ties for first in Arkansas and Iowa — 12 total appearances in the data."

  - question: "What is the most popular candy in each state?"
    answer: "See the full table above. Starburst leads across much of the South and Midwest. Sour Patch Kids leads in the Northeast and upper Midwest. Sour Punch Straws tops Arizona, California, Louisiana, and Texas. Reese's Peanut Butter Cups leads in Utah, Vermont, and Wyoming."

