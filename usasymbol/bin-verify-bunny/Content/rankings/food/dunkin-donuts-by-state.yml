faq:
  - question: "Which state has the most Dunkin' Donuts locations?"
    answer: "New York has the most Dunkin' Donuts locations of any state, with 1,453, about 14% of the US total. Massachusetts is second at 1,030, about 10%."

  - question: "Which states have no Dunkin' Donuts locations?"
    answer: "Seven states have zero Dunkin' Donuts locations: Alaska, Idaho, Montana, North Dakota, Oregon, South Dakota, and Washington."

  - question: "How many Dunkin' Donuts locations are there in the United States?"
    answer: "There are 10,069 Dunkin' Donuts locations across the United States and its territories, as of May 15, 2026. They operate in 3,430 cities."

  - question: "Which US city has the most Dunkin' Donuts locations?"
    answer: "Chicago, Illinois has the most Dunkin' Donuts locations of any US city, at 204. New York City is second with 170, and Brooklyn is third with 134."

  - question: "Which state has the densest Dunkin' Donuts presence?"
    answer: "Massachusetts has the densest Dunkin' Donuts presence of any state, with one location for every 6,692 residents, ahead of Connecticut's one per 7,487 and New Jersey's one per 10,349."

  - question: "Is Dunkin' Donuts available in Hawaii?"
    answer: "Yes. Hawaii has 6 Dunkin' Donuts locations. Utah and Wyoming have the fewest of any state with at least one location, with 1 each."

