sections:
  - id: "states-with-the-most-fast-food-restaurants-per-capita"
    icon: "fa-solid fa-burger"
    title: "States With the Most Fast Food Restaurants Per Capita"
    paragraphs:
      - "Alabama has the highest fast food density in the country at 6.3 restaurants per 10,000 residents, nearly a full point above Nebraska's 5.4 in second place. West Virginia and Oklahoma tie for third at 5.3 each."
      - "Tennessee (5.2) and Indiana (5.0) round out the top five. Every one of the top six states sits in the South or the Great Plains, and all six post a rate above 5.0 per 10,000 residents."

  - id: "states-with-the-fewest-fast-food-restaurants-per-capita"
    icon: "fa-solid fa-store-slash"
    title: "States With the Fewest Fast Food Restaurants Per Capita"
    paragraphs:
      - "Vermont has the lowest fast food density at 1.9 restaurants per 10,000 residents, less than a third of Alabama's 6.3. New Jersey is second-lowest at 2.0, and Mississippi and New York tie for third-lowest at 2.1 each."
      - "Connecticut (2.4) and Rhode Island (2.5) complete the bottom five. Four of the five lowest-density states, Vermont, New Jersey, New York, and Connecticut, sit in the Northeast."

