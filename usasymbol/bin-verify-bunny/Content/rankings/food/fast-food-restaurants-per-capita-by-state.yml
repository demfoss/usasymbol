faq:
  - question: "Which state has the most fast food restaurants per capita?"
    answer: "Alabama has the most fast food restaurants per capita at 6.3 per 10,000 residents. Nebraska is second at 5.4, and West Virginia and Oklahoma tie for third at 5.3 each."

  - question: "Which state has the fewest fast food restaurants per capita?"
    answer: "Vermont has the fewest fast food restaurants per capita at 1.9 per 10,000 residents. New Jersey is second-lowest at 2.0."

  - question: "How many fast food restaurants per capita does Texas have?"
    answer: "Texas has 4.3 fast food restaurants per 10,000 residents, tied for 20th with New Mexico, South Dakota, and Virginia."

  - question: "How many fast food restaurants per capita does California have?"
    answer: "California has 3.6 fast food restaurants per 10,000 residents, tied for 31st with North Dakota, Utah, Oregon, Idaho, and Montana."

  - question: "Why does Mississippi rank so low for fast food density despite being a Southern state?"
    answer: "Mississippi ties for third-lowest at 2.1 restaurants per 10,000 residents, alongside New York. The data does not break out a cause, but the figure stands apart from its Southern neighbors, most of which rank in the top 20."

  - question: "What is the average fast food density across all states?"
    answer: "Rates in this table range from 1.9 in Vermont to 6.3 in Alabama, a spread of 4.4 restaurants per 10,000 residents between the highest and lowest states."

