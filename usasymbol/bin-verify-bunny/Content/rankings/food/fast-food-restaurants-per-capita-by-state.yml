page:
  h1: "Fast Food Restaurants Per Capita by State"

  quick_answer:
    - "Alabama has the most fast food restaurants per capita at 6.3 locations per 10,000 residents, more than three times Vermont's rate."
    - "Vermont has the fewest fast food restaurants per capita at 1.9 per 10,000 residents, followed by New Jersey at 2.0 and a tie between Mississippi and New York at 2.1."
    - "Nebraska (5.4) and West Virginia and Oklahoma (5.3 each) are the next-highest states after Alabama, all in the South or Great Plains."

  methodology: "Figures show fast food locations per 10,000 residents, based on a 2022 study by Betsperts analyzing the 30 largest U.S. fast food chains using Data Infiniti location data. More recent complete state-by-state data was not available at time of publication."

  sources:
