faq:
  - question: "Which state has the most farms?"
    answer: "Texas has the most farms in the country at 231,000, 12.29% of all US farms."

  - question: "Which state has the fewest farms?"
    answer: "Rhode Island has the fewest farms at 1,000, the smallest total in the table."

  - question: "Which state has the most farms per capita?"
    answer: "North Dakota has the most farms relative to population at 3,079.5 per 100,000 residents, ahead of South Dakota at 3,000.8."

  - question: "Which state has the largest average farm size?"
    answer: "Wyoming has the largest average farm size at 2,743 acres, followed by Montana at 2,412 acres."

  - question: "Which state has the smallest average farm size?"
    answer: "Rhode Island has the smallest average farm size at 60 acres."

  - question: "How many farms are in California?"
    answer: "California has 62,500 farms with an average size of 379 acres."

