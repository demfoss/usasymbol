  title: "Number of Farms by State Map"
  image_alt: "U.S. map shaded by total number of farms, from Texas's 231,000 high down to Rhode Island's 1,000 low"
  caption: "Texas's 231,000 farms is the darkest shade on the map. Rhode Island's 1,000 farms is the lightest, while Iowa ranks second with 86,700 farms."
  metric_key: farm_count
  metric_label: "Number of Farms"
  color_scheme: purple
  color_scale: log

sections:
  - id: "states-with-the-most-farms"
    icon: "fa-solid fa-tractor"
    title: "Why Texas Has the Most Farms"
    paragraphs:
      - "Texas has the most farms at 231,000, more than double Iowa's 86,700, a lead tied partly to the state's sheer size. Missouri (85,700) and Ohio (74,000) follow, and Illinois and Oklahoma tie for fifth at 70,000 farms each."
    table:
      columns:
        state: "State"
        farm_count: "Number of Farms"
      rows:
        - state: "Texas"
          farm_count: "231,000"
        - state: "Iowa"
          farm_count: "86,700"
        - state: "Missouri"
          farm_count: "85,700"
        - state: "Ohio"
          farm_count: "74,000"
        - state: "Illinois"
          farm_count: "70,000"
        - state: "Oklahoma"
          farm_count: "70,000"

  - id: "farms-per-100000-residents-by-state"
    icon: "fa-solid fa-chart-column"
    title: "Farms per Capita by State"
    paragraphs:
      - "North Dakota has the most farms relative to population at 3,079.5 per 100,000 residents, narrowly ahead of South Dakota (3,000.8) and Iowa (2,670.7). Nebraska (2,181.8) and Montana (2,066.3) round out the top five, while Texas leads the raw count with 231,000 farms."
    table:
      columns:
        state: "State"
        farms_per_100k: "Farms per 100k Residents"
      rows:
        - state: "North Dakota"
          farms_per_100k: "3,079.5"
        - state: "South Dakota"
          farms_per_100k: "3,000.8"
        - state: "Iowa"
          farms_per_100k: "2,670.7"
        - state: "Nebraska"
          farms_per_100k: "2,181.8"
        - state: "Montana"
          farms_per_100k: "2,066.3"

  - id: "average-farm-size-by-state"
    icon: "fa-solid fa-ruler-combined"
    title: "Average Farm Size by State"
    paragraphs:
      - "Wyoming has the largest average farm size in the country at 2,743 acres, ahead of Montana (2,412), Nevada (1,903), New Mexico (1,870), and Arizona (1,656)."
      - "Rhode Island's farms average just 60 acres, the smallest in the table, followed by Massachusetts (68), New Jersey (71), Connecticut (76), and New Hampshire (109)."
    table:
      columns:
        state: "State"
        avg_acres: "Avg. Farm Size (acres)"
      rows:
        - state: "Wyoming"
          avg_acres: "2,743"
        - state: "Montana"
          avg_acres: "2,412"
        - state: "Nevada"
          avg_acres: "1,903"
        - state: "New Mexico"
          avg_acres: "1,870"
        - state: "Arizona"
          avg_acres: "1,656"

