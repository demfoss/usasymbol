page:
  h1: "Farms by State"

  quick_answer:
    - "Texas has the most farms in the country at 231,000, more than double second-place Iowa's 86,700."
    - "Rhode Island has the fewest farms at 1,000, and North Dakota has the most farms relative to population at 3,079.5 per 100,000 residents."
    - "Wyoming has the largest average farm size at 2,743 acres, while Rhode Island's farms average just 60 acres, the smallest in the table."

  methodology: "Farm counts and average farm size reflect 2024 USDA data reported by World Population Review. Farms per 100,000 residents is calculated from each state's 2025 Census Bureau population estimate."

  sources:
    - name: "World Population Review. Farm Count by State"
      url: "https://worldpopulationreview.com/state-rankings/farm-count-by-state"
      description: "State-by-state farm count and average farm size, 2024 USDA data"
    - name: "U.S. Census Bureau Population Estimates"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "2025 state population estimates, used to calculate farms per 100,000 residents"
    - name: "USDA NASS. Family Farms (2022 Census of Agriculture Highlights)"
      url: "https://www.nass.usda.gov/Publications/Highlights/2025/Census22_HL_FamilyFarms_FINAL.pdf"
      description: "National share of family-owned farms, 95% of all US farms in 2022"

