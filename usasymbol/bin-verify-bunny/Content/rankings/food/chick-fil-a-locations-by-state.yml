sections:
  - id: "why-texas-leads-the-chick-fil-a-count"
    icon: "fa-solid fa-drumstick-bite"
    title: "Why Texas Leads the Chick-fil-A Count"
    paragraphs:
      - "Texas has 524 Chick-fil-A locations, 240 more than Florida and 248 more than Georgia. The top of the ranking combines large-population states with several Southern states where the chain has an extensive footprint."
      - "This is a ranking by total restaurants, not locations per resident. Texas's lead therefore reflects the size of its network, but the table alone does not measure popularity or customer demand."

  - id: "what-zero-chick-fil-a-locations-means"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "What Zero Chick-fil-A Locations Means"
    paragraphs:
      - "Alaska and Vermont receive a count of 0 because the July 2026 source does not list either state. Maine and Wyoming have 2 locations each, followed by Rhode Island with 3."
      - "Zero describes this source snapshot, not a permanent status. Store networks change, and a location announced or opened after the source date would not appear in this ranking."

