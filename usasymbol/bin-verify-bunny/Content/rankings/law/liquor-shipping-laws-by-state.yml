page:
  h1: "Liquor Shipping Laws by State"

  quick_answer:
    - "12 states allow direct-to-consumer shipping of all alcohol types: Arizona, California, Florida, Hawaii, Iowa, Kentucky, Louisiana, Nebraska, New Hampshire, Tennessee, Washington, and Wyoming."
    - "31 states permit only beer and wine shipping, the most common policy in the country, including New York, Texas, Ohio, and Pennsylvania."
    - "7 states prohibit direct-to-consumer liquor shipping entirely: Alabama, Arkansas, Delaware, Mississippi, Oklahoma, Rhode Island, and Utah."

  methodology: "Legal status reflects direct-to-consumer alcohol shipping law as of 2026. Rules on licensing and volume limits vary within each category, and this page is not legal advice."

