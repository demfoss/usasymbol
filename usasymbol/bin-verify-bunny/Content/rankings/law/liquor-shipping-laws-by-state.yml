sections:
  - id: "states-where-all-alcohol-shipping-is-legal"
    icon: "fa-solid fa-check"
    title: "States Where All Alcohol Shipping Is Legal"
    paragraphs:
      - "12 states allow direct-to-consumer shipping of all alcohol types, including liquor: Arizona, California, Florida, Hawaii, Iowa, Kentucky, Louisiana, Nebraska, New Hampshire, Tennessee, Washington, and Wyoming. Every other state restricts shipping to beer and wine or bans it outright."

  - id: "states-with-beer-and-wine-shipping-only"
    icon: "fa-solid fa-wine-bottle"
    title: "States With Beer and Wine Shipping Only"
    paragraphs:
      - "31 states allow beer and wine shipping but not liquor, the most common policy in the country. The list includes New York, Texas, Ohio, Pennsylvania, and Virginia, among others."

  - id: "states-where-liquor-shipping-is-prohibited"
    icon: "fa-solid fa-ban"
    title: "States Where Liquor Shipping Is Prohibited"
    paragraphs:
      - "7 states prohibit direct-to-consumer liquor shipping entirely: Alabama, Arkansas, Delaware, Mississippi, Oklahoma, Rhode Island, and Utah. None of these states permit beer, wine, or liquor to be shipped directly to a consumer."

faq:
  - question: "Is it legal to ship liquor to Texas?"
    answer: "No. Texas allows only beer and wine shipping directly to consumers, and liquor cannot be shipped."

  - question: "Which states allow shipping of all alcohol types?"
    answer: "12 states allow direct-to-consumer shipping of all alcohol types, including liquor: Arizona, California, Florida, Hawaii, Iowa, Kentucky, Louisiana, Nebraska, New Hampshire, Tennessee, Washington, and Wyoming."

  - question: "Which states ban direct-to-consumer liquor shipping?"
    answer: "7 states prohibit it entirely: Alabama, Arkansas, Delaware, Mississippi, Oklahoma, Rhode Island, and Utah."

  - question: "Can you ship wine to New York?"
    answer: "Yes. New York allows beer and wine shipping directly to consumers, though liquor shipping is not permitted."

  - question: "What is the most common liquor shipping law among states?"
    answer: "Beer and wine only is the most common policy, covering 31 states."

  - question: "Is liquor shipping legal in Utah?"
    answer: "No. Utah is one of 7 states where direct-to-consumer liquor shipping is prohibited entirely, along with Alabama, Arkansas, Delaware, Mississippi, Oklahoma, and Rhode Island."

