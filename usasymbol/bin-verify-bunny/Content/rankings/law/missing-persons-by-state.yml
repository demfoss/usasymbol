faq:
  - question: "Which state has the most missing persons cases?"
    answer: "California has the most open missing persons cases at 3,764, followed by Texas at 2,879 and Florida at 2,457."
  - question: "Which state has the fewest missing persons cases?"
    answer: "South Dakota has the fewest open missing persons cases at 39. North Dakota is second-fewest at 41."
  - question: "Which state has the highest missing persons rate per capita?"
    answer: "Alaska has the highest rate at 163.76 missing persons per 100,000 residents, more than 20 times California's rate of 7.61."
  - question: "Which state has the lowest missing persons rate per capita?"
    answer: "Massachusetts has the lowest rate at 2.32 per 100,000 residents."
  - question: "How many missing persons cases are there in the US?"
    answer: "There are 26,745 open missing persons cases nationally, compared with 65,634 resolved cases."
  - question: "Which state has resolved the most missing persons cases?"
    answer: "Florida leads the country with 20,531 resolved missing persons cases, more than four times the next closest state. California is a distant second at 4,842, followed by Texas at 4,450."

