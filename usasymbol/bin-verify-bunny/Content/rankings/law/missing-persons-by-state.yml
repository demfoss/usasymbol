page:
  h1: "Missing Persons by State"

  quick_answer:
    - "California has the most open missing persons cases of any state at 3,764, followed by Texas at 2,879 and Florida at 2,457."
    - "Alaska has the highest missing persons rate per capita at 163.76 per 100,000 residents, despite ranking fourth in raw cases at 1,314. Massachusetts has the lowest rate at 2.32 per 100,000."
    - "Florida has resolved 20,531 missing persons cases, more than any other state and nearly eight times its own 2,457 open cases. Nationally, 26,745 cases remain open against 65,634 resolved."

  methodology: "Figures are open and resolved missing persons cases logged in the National Missing and Unidentified Persons System (NamUS), U.S. Department of Justice. The District of Columbia is excluded from the state ranking."

  sources:
    - name: "World Population Review, Missing Persons by State"
      url: "https://worldpopulationreview.com/state-rankings/missing-persons-by-state"
      description: "Open and resolved missing persons case counts by state, plus per-capita rates for select states"

