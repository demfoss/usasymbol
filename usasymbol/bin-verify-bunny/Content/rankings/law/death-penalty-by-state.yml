faq:
  - question: "Which states have the death penalty in 2026?"
    answer: "27 states retain the death penalty in 2026: Alabama, Arizona, Arkansas, California, Florida, Georgia, Idaho, Indiana, Kansas, Kentucky, Louisiana, Mississippi, Missouri, Montana, Nebraska, Nevada, North Carolina, Ohio, Oklahoma, Oregon, Pennsylvania, South Carolina, South Dakota, Tennessee, Texas, Utah, and Wyoming. The U.S. federal government and U.S. Military also retain capital punishment."

  - question: "What states have abolished the death penalty?"
    answer: "23 states have abolished capital punishment: Alaska, Colorado, Connecticut, Delaware, Hawaii, Illinois, Iowa, Maine, Maryland, Massachusetts, Michigan, Minnesota, New Hampshire, New Jersey, New Mexico, New York, North Dakota, Rhode Island, Vermont, Virginia, Washington, West Virginia, and Wisconsin. Michigan abolished it in 1847; Washington was the most recent, in 2023."

  - question: "Which state was the first to abolish the death penalty?"
    answer: "Michigan abolished the death penalty in 1847, the first of any U.S. state and the first English-speaking government in the world to do so. Wisconsin followed in 1853, Maine in 1887, and Minnesota in 1911."

  - question: "Is the death penalty legal in California?"
    answer: "Capital punishment remains legal under California state law, but Gov. Gavin Newsom issued an executive moratorium on March 13, 2019, stating he would not oversee any execution while governor. California has not carried out an execution since 2006."

  - question: "What is the execution method in Texas?"
    answer: "Texas uses lethal injection as its only authorized execution method. Texas has carried out more executions than any other state since capital punishment was reinstated in 1976."

  - question: "When did Virginia abolish the death penalty?"
    answer: "Virginia abolished the death penalty on March 24, 2021, when Gov. Ralph Northam signed the repeal into law. Virginia was the first Southern state to do so."

