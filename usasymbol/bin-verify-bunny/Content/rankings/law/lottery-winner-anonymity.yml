    layout: full-width-tall

faq:
  - question: "Can lottery winners remain anonymous in Texas?"
    answer: "Texas allows anonymity for lottery prizes of $1 million or more. Prizes below $1 million do not get that same protection."

  - question: "Can lottery winners remain anonymous in Virginia?"
    answer: "Virginia allows anonymous claims for prizes of $1 million or more. That rule took effect on July 1, 2025."

  - question: "Can lottery winners remain anonymous in California?"
    answer: "No. California treats lottery winner identity as public record."

  - question: "Can lottery winners remain anonymous in Oregon?"
    answer: "Yes. Oregon Lottery may not publicly disclose a winner's name or address without written authorization under House Bill 3115."

  - question: "Which states allow anonymous lottery winners?"
    answer: "Delaware, Kansas, Kentucky, Maryland, Mississippi, Missouri, Montana, New Jersey, North Dakota, Oregon, South Carolina, and Wyoming allow winners to remain anonymous without a prize threshold."

  - question: "Which states require lottery winners to go public?"
    answer: "California, Connecticut, Idaho, Iowa, New Mexico, Pennsylvania, Rhode Island, Vermont, and Wisconsin are in the public-record group. Colorado also releases a winner's first name, last initial, hometown, prize amount, and game."

