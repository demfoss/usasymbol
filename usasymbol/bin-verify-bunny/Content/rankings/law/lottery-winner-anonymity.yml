sections:
  - id: "states-that-allow-anonymous-lottery-winners"
    icon: "fa-solid fa-user-secret"
    title: "States That Allow Anonymous Lottery Winners"
    paragraphs:
      - "Twelve states allow anonymous lottery claims without a prize threshold. Delaware, Kansas, Maryland, Mississippi, Missouri, Montana, New Jersey, North Dakota, Oregon, South Carolina, Wyoming, and Kentucky make up that group."
      - "Oregon joined that group in September 2025 under House Bill 3115. New Jersey allows anonymity indefinitely, while Delaware and South Carolina allow all winners to stay private."

  - id: "states-where-lottery-winner-anonymity-depends-on-amount"
    icon: "fa-solid fa-sack-dollar"
    title: "States Where Lottery Winner Anonymity Depends on Amount"
    paragraphs:
      - "Twelve states use prize thresholds or limited exceptions. Arizona starts at $100,000, Georgia and Illinois start at $250,000, Nebraska starts at $250,000, and Texas, Virginia, and West Virginia start at $1 million."
      - "North Carolina is the tightest version of that rule. Only prizes of $50 million or more get anonymity there, and only for 90 days after the claim."

  - id: "states-where-lottery-winners-are-public"
    icon: "fa-solid fa-camera"
    title: "States Where Lottery Winners Are Public"
    paragraphs:
      - "Twenty-one states make lottery winners public, including California, Colorado, Connecticut, Idaho, New York, Pennsylvania, Washington, and Wisconsin."
      - "Colorado still withholds more than California. It releases the first name, last initial, hometown, prize amount, and game, but not a full photo unless the winner agrees."

visual_assets:
  - id: anonymous-lottery-winners
