page:
  h1: "Incarceration Rate by State"

  quick_answer:
    - "Louisiana has the highest incarceration rate of any state at 1,067 people per 100,000 residents, nearly double the national rate of 608."
    - "Massachusetts has the lowest incarceration rate at 241 per 100,000, less than a quarter of Louisiana's rate. Mississippi ranks second-highest at 1,020, and Arkansas is third at 912."
    - "Texas holds the largest total incarcerated population of any state at 225,480 people, even though its rate of 751 per 100,000 ranks 12th. California is second in total population at 192,694 despite a rate of just 494."

  methodology: "Rates combine people held in state and federal prisons, local jails, and other correctional facilities, from the Prison Policy Initiative's 2024 'States of Incarceration' compilation. Washington D.C. and Puerto Rico are excluded."

  sources:
