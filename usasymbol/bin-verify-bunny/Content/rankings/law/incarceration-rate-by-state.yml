faq:
  - question: "Which state has the highest incarceration rate?"
    answer: "Louisiana has the highest incarceration rate at 1,067 people per 100,000 residents. Mississippi ranks second at 1,020."
  - question: "Which state has the lowest incarceration rate?"
    answer: "Massachusetts has the lowest incarceration rate at 241 per 100,000. Vermont is second-lowest at 245, and Rhode Island is third at 254."
  - question: "What is the average incarceration rate in the US?"
    answer: "The national incarceration rate is 608 per 100,000 residents, covering a total of 2,048,524 people incarcerated across the country."
  - question: "Which state has the most prisoners overall?"
    answer: "Texas has the largest total incarcerated population at 225,480 people, ahead of California at 192,694 and Florida at 156,734. Its rate of 751 per 100,000 ranks only 12th, well below the leaders."
  - question: "What is the incarceration rate in Georgia?"
    answer: "Georgia's incarceration rate is 881 per 100,000 residents, the seventh highest among all states, with a total incarcerated population of 96,171."
  - question: "How does California's incarceration rate compare to Texas?"
    answer: "California's rate is 494 per 100,000, about two-thirds of Texas's rate of 751. California's total of 192,694 is second to Texas's 225,480."

