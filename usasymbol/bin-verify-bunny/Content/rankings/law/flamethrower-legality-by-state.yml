faq:
  - question: "Are flamethrowers legal in the US?"
    answer: "Yes in 48 states on this map. California is restricted by permit and Maryland is banned."

  - question: "Which states ban flamethrowers?"
    answer: "Maryland is the only full-ban state in the current source set. California is the other red state on this map, but its rule is a permit system rather than a complete ban."

  - question: "Can I buy a flamethrower in California?"
    answer: "Not freely if the device is Tier I. California requires a State Fire Marshal permit for a nonstationary and transportable device that projects a burning liquid stream at least 10 feet."

  - question: "Can I buy a flamethrower in Maryland?"
    answer: "No under this map's statewide rule. Maryland defines a flamethrower as a destructive device and makes possession a felony."

  - question: "Why does Maryland ban flamethrowers?"
    answer: "Maryland bans flamethrowers because § 4-501 puts them inside the state's destructive-device definition. The 2002 recodification bill says that wording was carried over without substantive change from former Article 27, § 139A(c), so the ban is an older destructive-device rule rather than a new stand-alone flamethrower law."

  - question: "Do you need a permit for a flamethrower in California?"
    answer: "Yes for Tier I devices on this page. California's permit rule covers nonstationary and transportable devices that project a burning liquid stream at least 10 feet."

