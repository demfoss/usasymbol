  title: "Flamethrower Legality by State | Map, Laws & Permits"
  description: "48 states have no statewide flamethrower permit or ban in the current source set. California requires a permit, and Maryland bans possession."

page:
  h1: "Flamethrower Legality by State"

  quick_answer:
    - "Flamethrower legality by state is green in 48 states. Texas, Florida, and New York are in the group with no statewide flamethrower permit or ban in the current source set."
    - "Maryland is the strictest outlier. Maryland law puts flamethrowers inside its destructive-device statute, which is why simple possession is a felony there."
    - "California is the permit outlier. Tier I flamethrowing devices that project a burning liquid stream at least 10 feet require a State Fire Marshal permit."

  methodology: "This page uses current state statutes for Maryland and California, then treats the other 48 states as green because the current source set identifies no statewide flamethrower permit or ownership ban there. Federal firearms definitions in 18 U.S.C. § 921 and 26 U.S.C. § 5845 focus on projectile weapons and listed destructive devices, so the 48-state result is an inference from those federal definitions plus the state-law sources below."

  sources:
    - name: "18 U.S.C. § 921. Definitions"
      url: "https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title18-section921"
      description: "Federal firearm and destructive-device definitions"
    - name: "26 U.S.C. § 5845. Definitions"
      url: "https://uscode.house.gov/view.xhtml?req=%28title%3A26+section%3A5845+edition%3Aprelim%29"
      description: "National Firearms Act definitions"
    - name: "Maryland Criminal Law § 4-501"
      url: "https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=gcr&section=4-501"
      description: "Maryland definition of destructive device including flamethrower"
    - name: "Maryland Criminal Law § 4-503"
      url: "https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=gcr&enactments=false&section=4-503"
      description: "Maryland felony ban on manufacturing, transporting, possessing, selling, or using a destructive device"
    - name: "Maryland House Bill 11 of 2002"
      url: "https://mgaleg.maryland.gov/2002rs/bills/hb/hb0011t.pdf"
      description: "2002 recodification note stating the flamethrower language was carried over without substantive change from former Article 27 § 139A(c)"
    - name: "California AB-1949 bill text"
      url: "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=201720180AB1949"
      description: "Official California bill text showing the 10-foot Tier I definition and permit structure"
    - name: "California Office of the State Fire Marshal. Fireworks"
      url: "https://osfm.fire.ca.gov/what-we-do/fire-engineering-and-investigations/fireworks"
      description: "Current State Fire Marshal permit application page for flame throwing devices"
    - name: "California Health and Safety Code § 12755"
      url: "https://law.justia.com/codes/california/code-hsc/division-11/part-3/chapter-2/section-12755/"
      description: "Current code text stating that a person may not use or possess a flamethrowing device without a valid permit"

