      url: "https://www.commerce.alaska.gov/web/amco/AlcoholicBeverageFAQs"
      description: "Alaska rule that specials must run for the full calendar week and cannot be free or under regular weekly price"
    - name: "North Carolina ABC Commission. Happy Hours FAQs"
      url: "https://www.abc.nc.gov/education/happy-hour-frequently-asked-questionspdf/open"
      description: "North Carolina rule requiring any reduced drink price to last at least one full business day"
    - name: "Rhode Island Department of Business Regulation. Liquor Enforcement and Compliance FAQ"
      url: "https://dbr.ri.gov/real-estate-and-commercial-licensing/liquor/liquor-enforcement-and-compliance-frequently-asked"
