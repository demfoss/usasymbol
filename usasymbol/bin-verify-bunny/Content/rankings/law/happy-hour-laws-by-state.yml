faq:
  - question: "Which states have no happy hour?"
    answer: "Massachusetts, Alaska, North Carolina, Rhode Island, Utah, and Vermont are the 6 states where happy hour is illegal on this page. Indiana is not in that group anymore."

  - question: "Is happy hour illegal in Massachusetts?"
    answer: "Yes. Massachusetts is marked No for happy_hour_legal, Restricted or banned for bottomless_mimosas, and No Happy Hour in the rule-type column."

  - question: "Is happy hour illegal in Indiana?"
    answer: "No. Indiana changed on July 1, 2024. The state now allows limited happy hour, capped at 4 hours per day and 15 hours per week, while still banning unlimited fixed-price drinks."

  - question: "Is happy hour illegal in North Carolina?"
    answer: "Yes. North Carolina ABC says alcohol happy hour is not allowed because a reduced drink price cannot run for less than one full business day."

  - question: "Which states ban bottomless mimosas?"
    answer: "24 states on this page mark bottomless mimosas as restricted or banned. Indiana, Oklahoma, New York, Washington, Virginia, and South Carolina are in that group along with the 6 no-happy-hour states."

  - question: "Are bottomless mimosas legal in Oklahoma?"
    answer: "No statewide ban on happy hour is listed for Oklahoma, but bottomless mimosas are marked Restricted or banned. Oklahoma is also in the Promotion Limits rule-type group."

