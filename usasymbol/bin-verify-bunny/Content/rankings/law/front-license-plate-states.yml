sections:
  - id: "states-that-require-a-front-license-plate"
    icon: "fa-solid fa-car-side"
    title: "States That Require a Front License Plate"
    paragraphs:
      - "Twenty-eight states require both a front and rear license plate, including California, Texas, New York, and Illinois. Massachusetts, Virginia, and Washington also require both plates."
      - "Smaller states in the requirement group include Vermont, Rhode Island, and New Hampshire, all in the Northeast, plus Wyoming, Montana, and North Dakota in the West."

  - id: "states-without-front-license-plates"
    icon: "fa-solid fa-car-rear"
    title: "States Without Front License Plates"
    paragraphs:
      - "Twenty-two states require only a rear license plate, including Florida, Georgia, Pennsylvania, and Ohio. Arizona, Michigan, and North Carolina also require only a rear plate."
      - "Alabama, Kentucky, Louisiana, and Tennessee round out the group, along with Utah, the most recent state to drop the front plate requirement."

  - id: "recent-changes-to-front-plate-laws"
    icon: "fa-solid fa-clock-rotate-left"
    title: "Recent Changes to Front Plate Laws"
    paragraphs:
      - "Ohio ended its front plate requirement on July 1, 2020, under House Bill 62. Alaska followed on August 11, 2022, moving to a single rear plate."
      - "Utah is the most recent state to make the change, dropping its front plate requirement on January 1, 2025, under SB45."

