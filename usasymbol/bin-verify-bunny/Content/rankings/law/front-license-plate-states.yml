page:
  h1: "Front License Plate States"

  quick_answer:
    - "Twenty-eight states require a front license plate in addition to a rear plate, while the other 22 states require only a rear plate."
    - "Utah dropped its front plate requirement on January 1, 2025, under SB45. Ohio ended the rule on July 1, 2020, and Alaska followed on August 11, 2022."
    - "California, Texas, and New York all require front plates, while Florida, Georgia, and Pennsylvania do not."

  methodology: "This page tracks whether each state requires a front license plate in addition to a rear plate, based on a 50-state legal-status review current as of 2026 and confirmed statutory changes in Ohio, Alaska, and Utah."

  sources:
    - name: "World Population Review. State License Plate Laws"
      url: "https://worldpopulationreview.com/state-rankings/state-license-plate-laws"
      description: "50-state comparison of front and rear license plate requirements"
    - name: "News 5 Cleveland. Drivers will no longer be required to have a front license plate in Ohio"
      url: "https://www.news5cleveland.com/news/state/drivers-will-no-longer-be-required-to-have-a-front-license-plate-in-ohio"
      description: "Confirms Ohio's front plate requirement ended July 1, 2020, under House Bill 62"
    - name: "Alaska Division of Motor Vehicles. License Plates"
      url: "https://dmv.alaska.gov/vehicle-services/license-plates/"
      description: "Official Alaska DMV page confirming single rear-plate issuance since August 11, 2022"
    - name: "KSL.com. Why most Utahns won't be required to have a front license plate anymore"
      url: "https://www.ksl.com/article/news/utah/why-most-utahns-wont-be-required-to-have-a-front-license-plate-anymore/50952019"
      description: "Confirms Utah's SB45 ended the front plate requirement effective January 1, 2025"

