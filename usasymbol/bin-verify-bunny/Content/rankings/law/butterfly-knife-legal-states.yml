      - "8 jurisdictions ban butterfly knives outright in 2026: California, Delaware, Hawaii, New Jersey, New Mexico, New York, Washington, and Washington, DC. None of them list an exception for open or licensed carry in the source data."

  - id: "states-where-carrying-one-concealed-is-illegal"
    icon: "fa-solid fa-eye-slash"
    title: "States Where Concealed Butterfly Knives Are Illegal"
    paragraphs:
      - "10 states allow butterfly knife ownership but ban concealed carry specifically: Alaska, Arizona, Florida, Illinois, Iowa, Maryland, North Carolina, North Dakota, Oregon, and Virginia. Georgia goes further, banning carry both openly and concealed in public, while ownership itself remains legal."

faq:
  - question: "Which states ban butterfly knives?"
    answer: "8 jurisdictions ban butterfly knives outright in 2026: California, Delaware, Hawaii, New Jersey, New Mexico, New York, Washington, and Washington, DC."

  - question: "Are butterfly knives legal in California?"
    answer: "No. California is one of 8 jurisdictions that ban butterfly knives outright, alongside Delaware, Hawaii, New Jersey, New Mexico, New York, Washington, and Washington, DC."

  - question: "Can you carry a butterfly knife concealed?"
    answer: "It depends on the state. Ownership is legal in 43 states, but 10 of them, including Alaska, Arizona, Florida, and Virginia, ban carrying one concealed. Georgia bans carrying one in public at all, open or concealed."

  - question: "Is a butterfly knife legal in Colorado?"
    answer: "Colorado is a legal gray area. Butterfly knives aren't specifically banned by statute, but prosecutors can classify one as an illegal gravity knife, a class 1 misdemeanor."

  - question: "What is the butterfly knife law in Texas?"
    answer: "Butterfly knives are legal in Texas, but illegal to carry in certain locations, including schools, polling places, and courts."

  - question: "Can a felon own a butterfly knife in New Hampshire?"
    answer: "No. New Hampshire allows ownership of any type of knife unless the owner has been convicted of a felony against a person or property, or of a felony drug offense."

