seo:
  title: "Alcohol Sales Laws by State | Map & Grocery Rules"
  description: "Twenty states let grocery stores sell liquor. Eighteen allow beer and wine only, seven allow beer only, and five allow no grocery alcohol."

page:
  h1: "Alcohol Sales Laws by State"

  quick_answer:
    - "California is in the full grocery access group, one of 20 states where grocery stores may sell beer, wine, and distilled spirits."
    - "Utah is the strictest outlier. Grocery stores there may sell only 4.0% ABW beer, while Pennsylvania grocery stores may sell beer and wine to go but not spirits."
    - "Alaska, Delaware, Maryland, New Jersey, and Rhode Island form the no-grocery group. California, Louisiana, Nevada, Washington, and Wisconsin sit at the other end with all three grocery columns marked yes."

  methodology: "Grocery access categories are based on the beer, wine, and distilled spirits columns in the state table from the Wikipedia summary of U.S. alcohol laws, checked on June 22, 2026. Control-state notes use the NABCA control-state directory for state-run or state-contracted spirits systems."

  sources:
    - name: "Wikipedia. List of alcohol laws of the United States"
      url: "https://en.wikipedia.org/wiki/List_of_alcohol_laws_of_the_United_States"
      description: "State-by-state table showing grocery store beer, wine, and distilled spirits sales rules"
    - name: "NABCA. Control State Directory and Info"
      url: "https://www.nabca.org/control-state-directory-and-info"
      description: "Directory of control states and jurisdictions for distilled spirits sales"

