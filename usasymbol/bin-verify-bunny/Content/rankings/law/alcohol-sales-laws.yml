  image_alt: "Map of the United States color-coded by whether grocery stores sell liquor, beer and wine only, beer only, or no alcohol"
  caption: "Twenty states show yes for beer, wine, and distilled spirits in grocery stores. Utah stands out with 4.0% ABW beer only, and Alaska, Delaware, Maryland, New Jersey, and Rhode Island show no grocery alcohol sales."
