faq:
  - question: "Which states let grocery stores sell liquor?"
    answer: "Twenty states show yes for beer, wine, and distilled spirits in grocery stores. Arizona, California, Hawaii, Illinois, Indiana, Iowa, Louisiana, Maine, Massachusetts, Michigan, Missouri, Nebraska, Nevada, New Mexico, North Dakota, South Dakota, Washington, West Virginia, Wisconsin, and Wyoming are in that group."

  - question: "Can I buy liquor in grocery stores in Pennsylvania?"
    answer: "No. Pennsylvania grocery stores may sell beer and wine to go, but spirits are sold only in state-operated stores."

  - question: "What are the alcohol sales laws in Utah?"
    answer: "Utah grocery stores may sell only 4.0% ABW beer. Stronger beer, wine, and distilled spirits go through state-controlled stores."

  - question: "What are the alcohol sales laws in North Carolina?"
    answer: "North Carolina grocery stores may sell beer and wine. Off-premises liquor sales run from 9 a.m. to 9 p.m. Monday through Saturday in the table."

  - question: "Which state has the least grocery store alcohol access?"
    answer: "Alaska, Delaware, Maryland, New Jersey, and Rhode Island tie for the least grocery store alcohol access. All five show no grocery alcohol sales."

  - question: "Can I buy liquor in grocery stores in Texas?"
    answer: "No. Texas grocery stores may sell beer and non-hard liquor, but hard liquor is sold only in separate liquor stores."

