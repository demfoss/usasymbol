sections:
  - id: "alcohol-sales-laws-states-where-grocery-stores-sell-liquor"
    icon: "fa-solid fa-cart-shopping"
    title: "Alcohol Sales Laws in Grocery Stores"
    paragraphs:
      - "Twenty states show yes in all three grocery store columns. Arizona, California, Hawaii, Illinois, Indiana, Iowa, Louisiana, Maine, Massachusetts, Michigan, Missouri, Nebraska, Nevada, New Mexico, North Dakota, South Dakota, Washington, West Virginia, Wisconsin, and Wyoming make up that full-access group."
      - "Washington adds one extra store rule. Spirits may be sold in grocery stores over 10,000 square feet, while North Dakota requires alcohol to be separated from the rest of the store by a wall."

  - id: "alcohol-sales-laws-states-with-beer-and-wine-only"
    icon: "fa-solid fa-wine-bottle"
    title: "States With Beer and Wine Only Alcohol Sales"
    paragraphs:
      - "Eighteen states allow grocery stores to sell beer and wine but not distilled spirits. Alabama, Arkansas, Colorado, Florida, Georgia, Idaho, Montana, New Hampshire, North Carolina, Ohio, Oklahoma, Oregon, Pennsylvania, South Carolina, Tennessee, Texas, Vermont, and Virginia are in that middle group."
      - "Pennsylvania and North Carolina add separate liquor channels. Pennsylvania sells spirits only in state-operated stores, and North Carolina lists off-premises liquor hours of 9 a.m. to 9 p.m. Monday through Saturday."

  - id: "alcohol-sales-laws-states-with-beer-only-or-none"
    icon: "fa-solid fa-ban"
    title: "States With Beer Only Alcohol Sales"
    paragraphs:
      - "Seven states are stricter than the beer-and-wine group. Connecticut, Kansas, Kentucky, Minnesota, Mississippi, New York, and Utah all block grocery spirits sales and also block grocery wine sales."
      - "Five states go further and show no grocery alcohol sales at all. Alaska, Delaware, Maryland, New Jersey, and Rhode Island make up that smallest group, while Utah stands out separately with grocery sales limited to 4.0% ABW beer."

