faq:
  - question: "What is the purple paint law?"
    answer: "A purple paint law lets landowners mark property as off-limits to trespassers by painting a boundary marker instead of posting signs. 26 states have adopted a version of the law."

  - question: "Which states have a purple paint law?"
    answer: "26 states have a purple paint law, including Illinois, Indiana, Kansas, and Pennsylvania. Most require purple specifically, though a few permit an alternate color instead."

  - question: "What color is used instead of purple in some states?"
    answer: "Arizona, Idaho, Montana, and Nevada require orange in place of purple. A few other states, including Maryland, Nebraska, Utah, and Virginia, allow blue, red, yellow, or aluminum posting as alternatives."

  - question: "Does Texas have a purple paint law?"
    answer: "Yes. Texas requires purple paint to mark a no-trespassing boundary."

  - question: "Does California have a purple paint law?"
    answer: "No. California is one of 24 states with no purple paint law on record."

  - question: "Which states do not have a purple paint law?"
    answer: "24 states have no purple paint law on record, including California, New York, Ohio, Washington, Georgia, and Michigan."

