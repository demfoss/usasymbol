page:
  h1: "Purple Paint Laws by State"

  quick_answer:
    - "Twenty-six states have adopted a purple paint law, letting landowners mark property boundaries with paint instead of posted signs to warn against trespassing."
    - "Purple is the required color in 18 of the 26 states, including Alabama, Arkansas, Florida, Texas, and West Virginia."
    - "Four states, Arizona, Idaho, Montana, and Nevada, use orange instead of purple. Maryland uses blue, Nebraska allows blue or red, and Utah allows orange or yellow."

  methodology: "Purple paint law status and required paint colors come from World Population Review's 2026 state-by-state comparison of purple paint laws."

