page:
  h1: "Cousin Marriage Legality"

  quick_answer:
    - "Alabama is in the legal group, one of 16 states where first-cousin marriage is legal without age, infertility, or counseling conditions."
    - "Arizona, Illinois, Indiana, Maine, Minnesota, North Carolina, Utah, and Wisconsin allow first-cousin marriage only with conditions. Arizona requires both parties to be 65 or older, or one party to be infertile."
    - "Connecticut moved into the banned group on October 1, 2025. Arizona, Nevada, North Dakota, Oklahoma, South Dakota, Texas, Utah, and Wisconsin are the eight states with a yes in the criminal-offense column."

  methodology: "Legality categories use the supplied Wikipedia state table on first-cousin marriage law in the United States. Connecticut was updated from legal to banned based on Public Act 25-72, effective October 1, 2025."

