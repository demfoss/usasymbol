sections:
  - id: "states-where-cousin-marriage-is-legal"
    icon: "fa-solid fa-check"
    title: "States Where Cousin Marriage Is Legal"
    paragraphs:
      - "Sixteen states allow first-cousin marriage with no listed age, infertility, or counseling condition. California, New York, New Jersey, Massachusetts, and Alabama are all in that legal group."
      - "California, New York, Colorado, and Florida are all in the legal group. Connecticut is no longer in this group after October 1, 2025."

  - id: "states-where-cousin-marriage-is-legal-with-conditions"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States Where Cousin Marriage Is Allowed With Conditions"
    paragraphs:
      - "Eight states fall into the middle category. Arizona, Illinois, Indiana, Maine, Minnesota, North Carolina, Utah, and Wisconsin all allow first-cousin marriage only with special conditions."
      - "Arizona and Indiana use age rules of 65 or older, while Utah uses 65 or older, or 55 or older with infertility. Maine allows it with same-sex status or proof of genetic counseling."

  - id: "states-where-cousin-marriage-is-banned"
    icon: "fa-solid fa-ban"
    title: "States Where Cousin Marriage Is Banned"
    paragraphs:
      - "Twenty-six states ban first-cousin marriage. Texas, Pennsylvania, Kentucky, Michigan, and Connecticut are all in that banned group."
      - "Eight states have a yes in the criminal-offense column. Arizona, Nevada, North Dakota, Oklahoma, South Dakota, Texas, Utah, and Wisconsin make up that group."

visual_assets:
  - id: cousin-marriage-legal
    src: /images/rankings/law/cousin-marriage-legality/cousin-marriage-legal.jpg
    alt: Courthouse steps and building exterior
    caption: In the states where first-cousin marriage remains legal, the issue is treated as a standard matter of marriage licensing rather than as a criminal-law exception. That group includes states as different as California, New York, Alabama, and Colorado.
    section: states-where-cousin-marriage-is-legal
    layout: full-width-tall

  - id: cousin-marriage-conditions
    src: /images/rankings/law/cousin-marriage-legality/cousin-marriage-conditions.jpg
    alt: State capitol building with dome and formal grounds
    caption: Conditional states take a middle position, usually tying legality to age, infertility, counseling, or a narrowly defined exception. Arizona, Indiana, Maine, Utah, and Wisconsin all use some form of this restricted path.
    section: states-where-cousin-marriage-is-legal-with-conditions
    layout: full-width-tall

  - id: cousin-marriage-banned
    src: /images/rankings/law/cousin-marriage-legality/cousin-marriage-banned.jpg
    alt: Judge's gavel beside stacked law books
    caption: In the banned states, marriage itself is void or prohibited, and a smaller subset also criminalizes the relationship. That distinction is why the map separates marriage legality from the criminal-offense column.
    section: states-where-cousin-marriage-is-banned
    layout: full-width-tall

faq:
  - question: "Is it legal to marry your cousin in California?"
    answer: "Yes. California lists first-cousin marriage as legal, with no age or infertility condition in the table."

  - question: "Is it legal to marry your cousin in New York?"
    answer: "Yes. New York lists first-cousin marriage as legal, and the table also notes that New York generally allows avunculate marriage."

  - question: "Is it legal to marry your cousin in Texas?"
    answer: "No. Texas bans first-cousin marriage, and the criminal-offense column is also marked yes."

  - question: "Is it legal to marry your cousin in Alabama?"
    answer: "Yes. Alabama is in the legal group, and its criminal-offense column is marked no."

  - question: "Which states allow cousin marriage with conditions?"
    answer: "Arizona, Illinois, Indiana, Maine, Minnesota, North Carolina, Utah, and Wisconsin allow first-cousin marriage with conditions. Arizona uses a 65-or-older or infertility rule, while North Carolina blocks only rare double first cousins."

  - question: "Is it legal to marry your cousin in Connecticut?"
    answer: "No. Connecticut moved to banned status on October 1, 2025, under the table update used for this page."

