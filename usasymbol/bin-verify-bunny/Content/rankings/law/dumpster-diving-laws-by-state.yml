faq:
  - question: "Is dumpster diving illegal in all 50 states?"
    answer: "No statewide blanket ban was identified in any state on this map. The real split is between blue states where the legal baseline is easier to use and red states where posted private property and city waste rules make access much harder."

  - question: "Can you get arrested for dumpster diving?"
    answer: "Yes, if the dive turns into trespassing. North Carolina treats entry onto posted premises as second-degree trespass, a Class 3 misdemeanor, and Massachusetts allows arrest for trespass on enclosed or posted private property."

  - question: "What did California v. Greenwood decide?"
    answer: "California v. Greenwood, 486 U.S. 35, was decided on May 16, 1988. The Court held that garbage left for collection outside the curtilage of a home has no Fourth Amendment privacy protection."

  - question: "Is dumpster diving trespassing in Florida?"
    answer: "It can be. Florida Section 810.09 covers unauthorized entry onto posted or fenced property, which is why Florida is red on this map even though no statewide dumpster-diving ban was identified."

  - question: "Why does dumpster diving feel stricter in New York?"
    answer: "New York is red because city-level handling rules make practical access harder. New York City requires waste and recyclables to stay inside a building or at the rear until collection time, which cuts down on easy curbside access."

  - question: "Which states are the easiest for dumpster diving?"
    answer: "Texas, Arizona, Wyoming, Alaska, Idaho, and South Dakota are among the easiest names on this map. All are blue Legal Baseline states where no statewide blanket ban was identified and practical access is often simpler."

