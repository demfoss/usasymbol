page:
  h1: "Dumpster Diving Laws by State"

  quick_answer:
    - "Dumpster diving laws by state show no statewide blanket ban in all 50 states reviewed. North Carolina stands out because posted entry can trigger a Class 3 misdemeanor."
    - "Massachusetts allows fines up to $100 or up to 30 days for trespass on posted or enclosed property. Florida treats posted-property trespass as a first-degree misdemeanor."
    - "California and New York stay legal at the state level, but Los Angeles receptacle rules and New York City storage rules can still block easy access."

  methodology: "This page classifies each state by statewide legality, published trespassing penalties, and any cited city access rule that changes practical access. Yellow and red states are not under statewide bans; they are flagged for higher trespassing or sanitation risk."

  sources:
    - name: "Legal Information Institute. California v. Greenwood, 486 U.S. 35"
      url: "https://www.law.cornell.edu/supremecourt/text/486/35"
      description: "Supreme Court opinion holding that garbage left for collection outside the curtilage has no Fourth Amendment protection"
    - name: "North Carolina General Assembly. G.S. 14-159.13"
      url: "https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_14/GS_14-159.13.html"
      description: "North Carolina second-degree trespass statute for posted or forbidden premises"
    - name: "Massachusetts General Laws. Chapter 266 Section 120"
      url: "https://malegislature.gov/Laws/GeneralLaws/PartIV/TitleI/Chapter266/Section120"
      description: "Massachusetts trespass law for entering or remaining on enclosed or posted private property"
    - name: "Florida Legislature. Section 810.09"
      url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0800-0899%2F0810%2FSections%2F0810.09.html"
      description: "Florida trespass on property other than a structure or conveyance"
    - name: "City of Los Angeles Ordinance 171687"
      url: "https://cityclerk.lacity.org/onlinedocs/1994/94-0056_ORD_171687_08-19-1997.pdf"
      description: "Los Angeles rule requiring certain recycling receptacles to be secured against unauthorized entry to prevent scavenging"
    - name: "NYC Department of Sanitation. Waste Setout Rule Hearing Materials"
      url: "https://www.nyc.gov/assets/dsny/downloads/about/proposed-rules/dsny-proposed-rule-curb-placement-times-refuse-recyclable-pickup-public-comments-111822.pdf"
      description: "NYC rule materials stating solid waste and recyclables must be kept inside a building or at the rear until collection time"
    - name: "New York City Council hearing record on scavenging"
