sections:
  - id: "why-montana-has-no-texting-and-driving-ban"
    icon: "fa-solid fa-mobile-screen"
    title: "Why Montana Has No Texting and Driving Ban"
    paragraphs:
      - "Montana is the only state on this list with no statewide law against texting while driving. Lawmakers in the state have repeatedly rejected bills to create one, with opponents arguing that a statewide ban is ineffective and infringes on personal freedom."
      - "Two counties and nine cities within Montana have passed their own local ordinances banning texting behind the wheel, even without a statewide law in place."

  - id: "states-with-the-highest-texting-and-driving-fines"
    icon: "fa-solid fa-money-bill"
    title: "States With the Highest Texting and Driving Fines"
    paragraphs:
      - "Alaska and Indiana carry the highest first-offense fine on this list at $500, 25 times California's lowest first-offense fine of $20. Colorado is next at $300, followed by Oregon's presumptive fine of $265."

  - id: "states-where-texting-and-driving-is-a-secondary-offense"
    icon: "fa-solid fa-scale-balanced"
    title: "States Where Texting and Driving Is a Secondary Offense"
    paragraphs:
      - "Missouri, Nebraska, and Virginia are the only states on this list that enforce their texting ban as a secondary offense. An officer in these three states must stop a driver for a separate violation, such as speeding, before adding a texting citation."

