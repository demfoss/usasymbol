faq:
  - question: "Does Montana have a texting while driving law?"
    answer: "No. Montana is the only state on this list with no statewide texting-while-driving ban. Some Montana cities and counties enforce their own local ordinances instead."

  - question: "Which states enforce texting bans as a secondary offense?"
    answer: "Missouri, Nebraska, and Virginia. In these three states, an officer must stop a driver for another violation before adding a texting citation."

  - question: "What is the fine for texting while driving in California?"
    answer: "California's first-offense fine is $20, the lowest listed on this table."

  - question: "Which states have the highest texting while driving fines?"
    answer: "Alaska and Indiana carry the highest first-offense fine on this list at $500. Colorado follows at $300."

  - question: "What is the fine for texting while driving in Texas?"
    answer: "Texas sets a first-offense fine of $200 for texting while driving, enforced as a primary offense."

  - question: "Is texting while driving illegal in every U.S. state?"
    answer: "Almost. 49 of the 50 states ban texting while driving for all drivers. Montana is the only state without a statewide ban."

