faq:
  - question: "Which state has the most serial killers per capita?"
    answer: "Alaska has the highest serial killer rate at 0.867 per 100,000 residents. Louisiana ranks second at 0.744, and Kansas ranks third at 0.606."

  - question: "Which state has the most serial killers?"
    answer: "California has the highest raw count with 128 known serial killers. Texas is next with 90, and Florida follows with 76."

  - question: "What is the serial killer rate in California?"
    answer: "California is at 0.452 serial killers per 100,000 residents, which puts it 12th in this ranking. Its raw count is 128, the highest total in the table."

  - question: "What is the serial killer rate in Texas?"
    answer: "Texas is at 0.307 serial killers per 100,000 residents and ranks 29th by rate. Its raw count is 90, which is second only to California."

  - question: "What is the serial killer rate in Florida?"
    answer: "Florida posts 0.394 serial killers per 100,000 residents, ranking 18th. Its raw count is 76, the third-highest total in the table."

  - question: "Which state has the fewest serial killers per capita?"
    answer: "Hawaii is lowest at 0.091 serial killers per 100,000 residents. New Hampshire is next at 0.098, and South Dakota is at 0.106."

