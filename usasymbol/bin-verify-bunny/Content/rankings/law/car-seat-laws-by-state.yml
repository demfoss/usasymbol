sections:
  - id: "states-that-require-rear-facing-seats-until-age-2"
    icon: "fa-solid fa-baby"
    title: "States That Require Rear-Facing Seats Until Age 2"
    paragraphs:
      - "23 states require a rear-facing car seat until a child turns 24 months old, the highest minimum age on this list: California, Connecticut, Idaho, Illinois, Louisiana, Maine, Michigan, Mississippi, Montana, Nebraska, New Hampshire, New Jersey, North Dakota, Ohio, Oklahoma, Oregon, Pennsylvania, Rhode Island, South Carolina, South Dakota, Utah, Virginia, and Washington."
      - "California, Idaho, and Illinois also set the highest rear-facing weight threshold in the table at 40 pounds. Connecticut, New Jersey, and Rhode Island set theirs at 30 pounds, while most of the remaining 24-month states defer to the seat's own manufacturer rating instead of a fixed weight."

  - id: "states-with-no-minimum-age-for-rear-facing-seats"
    icon: "fa-solid fa-circle-question"
    title: "States With No Minimum Age for Rear-Facing Seats"
    paragraphs:
      - "Florida and West Virginia are the only two states on this list with no statutory minimum age for rear-facing car seats. Both still require a seat sized by the manufacturer's own weight rating rather than a state-set number of months or pounds."

faq:
  - question: "How long must a car seat be rear-facing by state?"
    answer: "23 states require a rear-facing seat until a child turns 24 months old, and 25 states require it until 12 months. Florida and West Virginia set no statutory minimum age."

  - question: "What is the rear-facing car seat law in California?"
    answer: "California requires a rear-facing car seat until a child is 24 months old or reaches the seat's 40-pound weight limit, whichever comes first."

  - question: "Does Florida have a minimum age for rear-facing car seats?"
    answer: "No. Florida is one of only two states on this list, along with West Virginia, with no statutory minimum age for rear-facing seats. The weight limit is set by the seat's own manufacturer rating."

  - question: "Which states have the highest rear-facing weight limit?"
    answer: "California, Idaho, and Illinois set the highest rear-facing weight threshold on this list at 40 pounds."

  - question: "What is the rear-facing car seat age in Texas?"
    answer: "Texas requires a rear-facing car seat until a child turns 12 months old, the most common threshold among the states on this list."

