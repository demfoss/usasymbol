page:
  h1: "Car Seat Laws by State"

  quick_answer:
    - "23 states require a rear-facing car seat until a child turns 24 months old, the highest minimum age on this list. California, Idaho, and Illinois also set the highest weight threshold at 40 pounds."
    - "25 states set the minimum rear-facing age at 12 months, the most common threshold on this list, a full year earlier than the 24-month group."
    - "Florida and West Virginia list no statutory minimum age for rear-facing seats, the only two states on this list without one. Both defer to the car seat's own weight rating instead of a state-set number."

  methodology: "Rear-facing car seat minimum age and maximum weight reflect state law on record for 2026. \"By seat\" means the state defers to the seat's own manufacturer rating. Informational only; not legal advice."

