sections:
  - id: "states-with-no-helmet-law"
    icon: "fa-solid fa-ban"
    title: "States With No Helmet Law"
    paragraphs:
      - "Illinois, Iowa, and New Hampshire are the only three states with no motorcycle helmet law of any kind, for riders of any age."
      - "New Hampshire has never had a helmet law, a point often tied to the state motto, Live Free or Die."

  - id: "states-with-universal-helmet-laws"
    icon: "fa-solid fa-helmet-safety"
    title: "States With Universal Helmet Laws"
    paragraphs:
      - "Seventeen states require every rider to wear a helmet regardless of age: Alabama, California, Georgia, Louisiana, Maryland, Massachusetts, Mississippi, Nevada, New Jersey, New York, North Carolina, Oregon, Tennessee, Vermont, Virginia, Washington, and West Virginia."
      - "New York was the first state to adopt a universal helmet law, effective January 1, 1967, and it remains in effect today."

  - id: "states-that-recently-changed-their-helmet-laws"
    icon: "fa-solid fa-clock-rotate-left"
    title: "States That Recently Changed Their Helmet Laws"
    paragraphs:
      - "Nebraska repealed its universal helmet law in 2024. Riders 21 and older may now ride without a helmet if they complete a certified motorcycle safety course."
      - "Missouri made a similar change earlier, repealing its universal law under Senate Bill 147, effective August 2020. Riders 26 and older may ride without a helmet if they carry qualifying medical coverage and meet safety-course and licensing requirements."

