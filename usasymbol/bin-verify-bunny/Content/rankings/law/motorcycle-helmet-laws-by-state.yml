faq:
  - question: "Does New Hampshire have a helmet law?"
    answer: "No. New Hampshire has never had a motorcycle helmet law, one of only three states without one, along with Illinois and Iowa."

  - question: "Which states have no motorcycle helmet law?"
    answer: "Illinois, Iowa, and New Hampshire have no helmet requirement for riders of any age."

  - question: "Which states require all motorcycle riders to wear a helmet?"
    answer: "Seventeen states have a universal helmet law, including California, New York, Vermont, Virginia, and Washington."

  - question: "Does Nebraska require a motorcycle helmet?"
    answer: "Only for riders under 21. Nebraska repealed its universal helmet law in 2024, and riders 21 and older may ride without a helmet if they complete a certified safety course."

  - question: "Does Missouri require a motorcycle helmet?"
    answer: "Only for riders 25 and younger. Missouri repealed its universal helmet law under Senate Bill 147, effective August 2020."

  - question: "What is the motorcycle helmet law in Texas?"
    answer: "Texas requires a helmet for riders 20 and younger. Riders 21 and older may ride without one if they complete a safety course or carry qualifying insurance."

