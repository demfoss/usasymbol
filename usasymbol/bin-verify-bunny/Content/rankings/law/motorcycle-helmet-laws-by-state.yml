      url: "https://www.wowt.com/2026/02/20/nebraska-motorcycle-helmet-law-repeal-what-data-shows-two-years-later/"
      description: "Confirms Nebraska's 2024 repeal of its universal helmet law and the safety-course exemption for riders 21 and older"
