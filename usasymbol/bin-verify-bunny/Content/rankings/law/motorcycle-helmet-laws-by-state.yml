page:
  h1: "Motorcycle Helmet Laws by State"

  quick_answer:
    - "Three states have no motorcycle helmet law at all: Illinois, Iowa, and New Hampshire."
    - "Seventeen states require every rider to wear a helmet regardless of age, including California, New York, Vermont, Virginia, and Washington."
    - "Nebraska repealed its universal helmet law in 2024. Riders 21 and older can now ride without a helmet if they complete a certified safety course."

  methodology: "This page classifies each state's motorcycle helmet law as Universal (all riders), Partial (age or experience-based), or None, based on the Insurance Institute for Highway Safety's helmet law table and confirmed recent changes in Nebraska and Missouri. This is general information, not legal advice, so confirm current rules with your state DMV before riding."

