page:
  h1: "Sunday Car Sales Laws by State"

  quick_answer:
    - "Sunday car sales laws by state put 12 states in the No column on this map. New Jersey, Indiana, and Colorado are in that group, while Texas and Michigan are Restricted."
    - "Texas is not a full Sunday-ban state here. Texas dealers must close either Saturday or Sunday, so most choose Sunday."
    - "Pennsylvania is still a No state for normal dealer sales, but off-premise shows may open on Sunday if no final sales contract is completed that day."

  methodology: "This page uses a current 50-state Sunday-sales list and rechecks New Jersey, Texas, Michigan, Maine, Iowa, Minnesota, Pennsylvania, and Wisconsin against official or industry legal sources accessed on June 25, 2026. States marked Yes are states where no statewide Sunday dealer-sales ban was identified in this review."

  sources:
