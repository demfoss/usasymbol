      description: "Current Michigan summary stating Sunday sales are prohibited in counties with population over 130,000"
    - name: "Maine Legislature. Title 17 Section 3203"
      url: "https://legislature.maine.gov/statutes/17/title17sec3203.html"
      description: "Maine law prohibiting motor-vehicle sales on Sunday"
    - name: "Iowa Code Section 322.3"
      url: "https://www.legis.iowa.gov/docs/code/322.3.pdf"
      description: "Iowa law prohibiting licensed dealers from buying or selling retail motor vehicles on Sunday"
