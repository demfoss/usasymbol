sections:
  - id: "states-where-you-cant-buy-a-car-on-sunday"
    icon: "fa-solid fa-ban"
    title: "States Where You Can't Buy a Car on Sunday"
    paragraphs:
      - "Colorado, Illinois, Indiana, Iowa, Louisiana, Maine, Minnesota, Mississippi, Missouri, New Jersey, Pennsylvania, and Wisconsin are the 12 No states on this map. In those states, the core dealer rule still blocks normal Sunday vehicle sales."
      - "Pennsylvania is the most qualified No state in this table. Its act still bars ordinary Sunday vehicle dealing, but off-premise shows may open on Sunday if no final sales contract is completed that day."

  - id: "texas-sunday-car-sales-law"
    icon: "fa-solid fa-calendar-xmark"
    title: "Texas Sunday Car Sales Law"
    paragraphs:
      - "Texas is yellow here, not red. Texas dealer guidance says a dealer may not sell or offer for sale motor vehicles on consecutive Saturday and Sunday."
      - "That means a Texas dealer must close one of the two weekend days. Most choose Sunday, even though the statewide rule is narrower than a full Sunday ban."

  - id: "michigan-sunday-car-sales-law"
    icon: "fa-solid fa-map"
    title: "Michigan Sunday Car Sales Law"
    paragraphs:
      - "Michigan is also yellow rather than red. The Michigan Automobile Dealers Association says Sunday sales are prohibited in counties with population over 130,000."
      - "That makes Michigan more location-dependent than Indiana or Wisconsin. The restriction is still real, but it is not a blanket statewide Sunday ban in every county."

