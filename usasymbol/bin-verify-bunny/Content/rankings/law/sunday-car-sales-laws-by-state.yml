faq:
  - question: "Which states ban Sunday car sales?"
    answer: "Colorado, Illinois, Indiana, Iowa, Louisiana, Maine, Minnesota, Mississippi, Missouri, New Jersey, Pennsylvania, and Wisconsin are the 12 No states on this page."

  - question: "Can you buy a car on Sunday in Texas?"
    answer: "Texas is marked Restricted, not No. Texas dealers may not sell on consecutive Saturday and Sunday, so they must close one of those two days."

  - question: "Is it illegal to buy a car on Sunday in New Jersey?"
    answer: "Yes. New Jersey is marked No for sunday_sales_legal, State Ban for rule_type, and Dealer sales banned for sunday_rule."

  - question: "Can you buy a car on Sunday in Michigan?"
    answer: "Michigan is marked Restricted on this map. The Michigan Automobile Dealers Association says Sunday sales are prohibited in counties with population over 130,000."

  - question: "Are car dealerships open on Sunday in Florida?"
    answer: "Florida is marked Yes on this page because no statewide Sunday dealer-sales ban was identified in this review. A local dealer may still choose to stay closed."

  - question: "Why are car dealers closed on Sunday in Pennsylvania?"
    answer: "Pennsylvania is a No state for normal dealer sales because its vehicle-dealer act still treats Sunday vehicle dealing as a violation. The same act still allows off-premise shows on Sunday if no final sales contract is completed that day."

