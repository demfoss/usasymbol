sections:
  - id: "states-where-switchblades-are-banned"
    icon: "fa-solid fa-ban"
    title: "States Where Switchblades Are Banned"
    paragraphs:
      - "Four states ban civilian possession of switchblades outright in 2026. They are Minnesota, New Mexico, New York, and Washington, each limiting exceptions mostly to law enforcement or specific occupations."
      - "Minnesota and New York classify possession as a misdemeanor, while New Mexico treats it as a petty misdemeanor punishable by up to 6 months and a $500 fine under § 30-7-8. Washington limits possession to law enforcement and military personnel under RCW 9.41.250."

  - id: "states-with-blade-length-limits-on-automatic-knives"
    icon: "fa-solid fa-ruler"
    title: "States With Blade-Length Limits on Automatic Knives"
    paragraphs:
      - "Connecticut sets the shortest allowed blade at 1.5 inches unless the owner holds a valid hunting or fishing license, the tightest limit in the table. California draws its own line at 2 inches under Penal Code § 21510, and anything longer is a misdemeanor to carry, open or concealed."
      - "Delaware allows blades up to 3.75 inches without restriction after its 2025 repeal, longer than Colorado's 3.5-inch concealed carry cap or Rhode Island's 3-inch concealed limit. North Dakota permits automatic knives up to 5 inches, the longest statewide blade limit among the restricted states."

  - id: "states-that-recently-legalized-switchblades"
    icon: "fa-solid fa-scale-balanced"
    title: "States That Recently Legalized Switchblades"
    paragraphs:
      - "Massachusetts, Vermont, Hawaii, and Delaware all changed their switchblade laws between 2024 and 2025. Massachusetts' ban fell first, when the Supreme Judicial Court ruled it unconstitutional in Commonwealth v. Canjura on August 27, 2024."
      - "Hawaii followed in 2024, legalizing open carry and possession while keeping concealed carry off-limits. Vermont's Act 64 removed its switchblade language entirely on July 2, 2025, and Delaware's Senate Bill 108 lifted its ban the same year, setting the 3.75-inch unrestricted threshold."

