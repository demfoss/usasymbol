  title: "Knife Laws by State | Switchblade Map & Length Limits"
  description: "Minnesota, New Mexico, New York, and Washington ban switchblades outright in 2026. Nine more states cap blade length or carry."

page:
  h1: "Knife Laws by State"

  quick_answer:
    - "Switchblades are banned in four states in 2026. Minnesota, New Mexico, New York, and Washington prohibit civilian possession statewide, each with only narrow occupational exceptions."
    - "Connecticut sets the strictest blade-length limit among restricted states at 1.5 inches, while North Dakota allows up to 5 inches. California draws its line at 2 inches under Penal Code § 21510, and Delaware allows 3.75 inches after its 2025 repeal."
    - "Massachusetts, Hawaii, Vermont, and Delaware all repealed switchblade restrictions between 2024 and 2025. New York's ban, unlike its 2019 gravity-knife repeal, remains in place under Penal Law § 265.01."

  methodology: "Switchblade status, blade-length limits, and concealed carry rules reflect state statutes and legislative changes current through 2026, cross-referenced against the Knife Rights and American Knife & Tool Institute databases. States with no statewide restriction identified in the current source set are shown as Legal, and local ordinances or location-specific rules can still be stricter."

  sources:
    - name: "Knife Rights. State Civilian Switchblade/Automatic Knife Legality"
      url: "https://kniferights.org/switchblade-legality/"
      description: "State-by-state tracker of automatic knife legal status and blade-length restrictions"
    - name: "American Knife & Tool Institute. State Laws Regarding Automatics"
      url: "https://www.akti.org/state-laws-regarding-automatics/"
      description: "Reference chart of state automatic knife laws, including recent legislative changes"
    - name: "Minnesota Statutes § 609.66"
      url: "https://www.revisor.mn.gov/statutes/cite/609.66"
      description: "Minnesota's dangerous weapons statute, including the switchblade possession ban"
    - name: "New Mexico Statutes § 30-7-8"
      url: "https://law.justia.com/codes/new-mexico/chapter-30/article-7/section-30-7-8/"
      description: "New Mexico's unlawful possession of switchblades statute"
    - name: "Washington RCW 9.41.250"
      url: "https://app.leg.wa.gov/rcw/default.aspx?cite=9.41.250"
      description: "Washington's dangerous weapons statute restricting spring-blade knife possession"
    - name: "New York Penal Law § 265.01"
      url: "https://www.nysenate.gov/legislation/laws/PEN/265.01"
      description: "New York's criminal possession of a weapon in the fourth degree statute, covering switchblades"
    - name: "New Jersey N.J.S.A. 2C:39-3"
      url: "https://law.justia.com/codes/new-jersey/title-2c/section-2c-39-3/"
      description: "New Jersey's prohibited weapons and devices statute, including the switchblade lawful-purpose rule"
    - name: "California Penal Code § 21510"
      url: "https://law.justia.com/codes/california/code-pen/part-6/title-3/division-5/chapter-5/section-21510/"
      description: "California's switchblade knife statute setting the 2-inch blade threshold"
    - name: "Commonwealth v. Canjura, Massachusetts SJC (2024)"
      url: "https://law.justia.com/cases/massachusetts/supreme-court/2024/sjc-13432.html"
      description: "Massachusetts Supreme Judicial Court ruling striking down the state's switchblade ban"
    - name: "Vermont Act 64 (2025)"
      url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT064/ACT064%20As%20Enacted.pdf"
      description: "Enacted Vermont legislation repealing the state's switchblade possession ban"
