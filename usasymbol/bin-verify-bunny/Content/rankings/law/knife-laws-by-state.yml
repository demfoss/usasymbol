faq:
  - question: "Which states ban switchblades?"
    answer: "Minnesota, New Mexico, New York, and Washington ban civilian possession of switchblades statewide in 2026. All four restrict ownership mainly to law enforcement or narrow occupational exceptions."

  - question: "Are switchblades legal in California?"
    answer: "Yes, if the blade is under 2 inches. California Penal Code § 21510 makes carrying a switchblade with a blade of 2 inches or longer, open or concealed, a misdemeanor punishable by up to 6 months in jail."

  - question: "What is the legal knife length in Texas?"
    answer: "Texas has no statewide blade-length limit for general carry since House Bill 1935 took effect in 2017. Blades longer than 5.5 inches are still banned in specific locations, including bars, schools, and correctional facilities."

  - question: "Are switchblades legal in New York?"
    answer: "No. New York repealed its gravity knife ban in 2019, but switchblade possession remains a class A misdemeanor statewide under Penal Law § 265.01."

  - question: "Which states recently legalized switchblades?"
    answer: "Massachusetts, Hawaii, Vermont, and Delaware all changed their laws between 2024 and 2025. Massachusetts acted first, when the Supreme Judicial Court struck down its ban in Commonwealth v. Canjura on August 27, 2024."

  - question: "Do you need a permit to carry a switchblade in Illinois?"
    answer: "Illinois requires a valid Firearm Owner's Identification card for possession and carry, a rule that took effect alongside the state's 2022 switchblade ban repeal."

