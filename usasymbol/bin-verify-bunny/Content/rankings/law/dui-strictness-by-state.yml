faq:
  - question: "What state has the strictest DUI laws?"
    answer: "Alaska requires 72 hours of mandatory jail for a first DUI — the longest mandatory minimum of any state. Arizona requires 10 days (minimum 1 day in jail with 9 days of home detention available). Utah is the strictest on BAC limits, at 0.05% versus the 0.08% standard everywhere else."

  - question: "What is the penalty for a first DUI in Texas?"
    answer: "Texas carries no mandatory minimum jail time for a standard first DUI. The maximum fine is $2,000, plus a $3,000 state surcharge applied on first convictions. License suspension runs 90 to 365 days, and up to 180 days in jail is possible at the judge's discretion."

  - question: "Which state has the lowest BAC limit for DUI?"
    answer: "Utah is the only state with a BAC limit below 0.08%. Utah lowered its limit to 0.05% effective December 30, 2018. A driver at 0.05% in Utah faces the same 48-hour mandatory jail minimum as one at the standard 0.08% threshold."

  - question: "What happens if you get a DUI in Wisconsin?"
    answer: "A first OWI in Wisconsin is a civil forfeiture, not a criminal offense. The maximum fine is $300. License is suspended 6 to 9 months, but no jail time is imposed. A second offense in Wisconsin is treated as a criminal misdemeanor."

  - question: "Which states require an ignition interlock for a first DUI?"
    answer: "Alaska, Arizona, Illinois, Louisiana, Nebraska, New Mexico, Oregon, Utah, and West Virginia require an ignition interlock device for all first-offense DUI convictions, regardless of BAC level. Most other states require interlock only for high-BAC or repeat offenses."

  - question: "What is the license suspension for a first DUI in California?"
    answer: "California suspends a first DUI offender's license for 180 days. No mandatory jail time applies for a standard first offense. The base fine is $390, though total costs including penalty assessments typically reach $1,500 to $2,000. A DUI school of 3 to 9 months is required."

