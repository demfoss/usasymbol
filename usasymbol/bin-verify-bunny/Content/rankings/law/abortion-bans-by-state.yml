sections:
  - id: "ban-states-with-no-exception-for-rape-or-incest"
    icon: "fa-solid fa-gavel"
    title: "Ban States With No Exception for Rape or Incest"
    paragraphs:
      - "Eight of the 13 states that ban abortion outright allow no exception for rape or incest: Alabama, Arkansas, Kentucky, Louisiana, Oklahoma, South Dakota, Tennessee, and Texas. Arkansas, Oklahoma, South Dakota, and Tennessee permit an abortion only to save the mother's life. Alabama adds an exception for fatal fetal anomaly; Kentucky, Louisiana, and Texas add one for the mother's physical health."
      - "The remaining five ban states permit an exception for rape or incest: Mississippi, Indiana, West Virginia, Idaho, and North Dakota. West Virginia limits that exception to the first eight weeks of pregnancy for adults and 14 weeks for those under 18. Indiana also allows an exception for religious reasons."

  - id: "states-where-abortion-requires-no-legal-reason"
    icon: "fa-solid fa-circle-check"
    title: "States Where Abortion Requires No Legal Reason"
    paragraphs:
      - "Ten Legal-status jurisdictions require no documented reason at all for an abortion: Alaska, Arizona, Colorado, Maryland, Minnesota, New Jersey, New Mexico, Oregon, Vermont, and Washington, DC. Nine of the ten, all but Arizona, also place no gestational limit on the procedure. Arizona's limit is viability, since a 2024 constitutional amendment ended enforcement of its earlier 15-week ban."

faq:
  - question: "How many states ban abortion in 2026?"
    answer: "13 states ban abortion outright in 2026: Alabama, Arkansas, Idaho, Indiana, Kentucky, Louisiana, Mississippi, North Dakota, Oklahoma, South Dakota, Tennessee, Texas, and West Virginia. Three more, Florida, Georgia, and South Carolina, enforce a functional ban at six weeks of pregnancy."

  - question: "Which states allow no exception for rape or incest?"
    answer: "Alabama, Arkansas, Kentucky, Louisiana, Oklahoma, South Dakota, Tennessee, and Texas ban abortion with no rape or incest exception. Arkansas, Oklahoma, South Dakota, and Tennessee permit the procedure only to save the mother's life."

  - question: "Is abortion legal in Texas?"
    answer: "No. Texas bans abortion in almost all circumstances, with an exception only for the mother's life and physical health. Private citizens can sue abortion providers and anyone who assists a patient seeking an abortion after about six weeks of pregnancy."

  - question: "What states have no gestational limit on abortion?"
    answer: "Nine jurisdictions place no gestational limit on abortion: Alaska, Colorado, Maryland, Minnesota, New Jersey, New Mexico, Oregon, Vermont, and Washington, DC. None of the nine require a documented reason, such as rape or a health risk, at any stage of pregnancy."

  - question: "Does Missouri ban abortion?"
    answer: "No. Missouri allows abortion up to viability after voters approved Amendment 3 in November 2024, reversing the near-total ban that had been in effect since the Dobbs ruling."

  - question: "What is a functional abortion ban?"
    answer: "A functional ban restricts abortion so early, typically six weeks, that most patients do not yet know they are pregnant. Florida, Georgia, South Carolina, and Iowa enforce six-week limits, alongside 12-, 13-, and 18-week limits in Nebraska, North Carolina, and Utah."

