  quick_answer:
    - "13 states ban abortion outright in 2026: Alabama, Arkansas, Idaho, Indiana, Kentucky, Louisiana, Mississippi, North Dakota, Oklahoma, South Dakota, Tennessee, Texas, and West Virginia."
    - "Eight of those 13 ban states allow no exception for rape or incest: Alabama, Arkansas, Kentucky, Louisiana, Oklahoma, South Dakota, Tennessee, and Texas. The remaining five, Mississippi, Indiana, West Virginia, Idaho, and North Dakota, permit one."
    - "Ten jurisdictions require no documented reason for an abortion at all: Alaska, Arizona, Colorado, Maryland, Minnesota, New Jersey, New Mexico, Oregon, Vermont, and Washington, DC. Nine of them also place no gestational limit; Arizona's limit is viability."

