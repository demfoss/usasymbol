sections:
  - id: "permitless-carry-states-2026"
    icon: "fa-solid fa-shield-check"
    title: "States with Permitless Carry in 2026"
    paragraphs:
      - "29 states allow concealed carry without a permit as of 2026. Louisiana was the most recent addition, with permitless carry taking effect July 4, 2024 under HB 1. Ten of the 29 states joined between 2021 and 2024 alone."
      - "Vermont has never required a carry permit, predating any state permit system since statehood in 1791. Alaska restored permitless carry in 2003, Wyoming in 2011, and Arizona in 2010. The pace accelerated after 2019, with 16 states enacting or expanding constitutional carry between 2019 and 2024."

  - id: "concealed-carry-reciprocity-by-state"
    icon: "fa-solid fa-route"
    title: "Concealed Carry Reciprocity by State"
    paragraphs:
      - "Arizona, Texas, and Utah permits are each honored in 38 states, the highest reciprocity count in the nation. A carrier with any of those three licenses can legally carry concealed in 38 states, covering nearly all of the continental United States."
      - "Michigan and North Carolina are the two shall-issue states with the highest reciprocity, at 36 states each. Their permits match the interstate reach of most permitless carry state licenses. Oregon's CHL, by contrast, is recognized in only 11 states."

  - id: "may-issue-states-gun-laws"
    icon: "fa-solid fa-lock"
    title: "May Issue States With the Strictest Carry Laws"
    paragraphs:
      - "Six states retain May Issue classification in 2026: California, Hawaii, Maryland, Massachusetts, New Jersey, and New York. All six were affected by the U.S. Supreme Court's June 2022 Bruen decision, which struck down the 'proper cause' requirement for permit issuance."
      - "Hawaii has the most restrictive system in practice. Its permit is recognized in only 4 states, the lowest of any issuing state. New York and California each honor zero other states' permits, and neither state's license is recognized in more than 10 states."

