faq:
  - question: "Which states allow concealed carry without a permit in 2026?"
    answer: "29 states allow permitless concealed carry in 2026: Alabama, Alaska, Arizona, Arkansas, Florida, Georgia, Idaho, Indiana, Iowa, Kansas, Kentucky, Louisiana, Maine, Mississippi, Missouri, Montana, Nebraska, New Hampshire, North Dakota, Ohio, Oklahoma, South Carolina, South Dakota, Tennessee, Texas, Utah, Vermont, West Virginia, and Wyoming. Louisiana was the most recent addition, effective July 4, 2024."

  - question: "What state has the most concealed carry reciprocity?"
    answer: "Arizona, Texas, and Utah each lead with permits honored in 38 states. All three are permitless carry states that still issue optional permits for interstate travel. A Utah CFP or Arizona CCW provides carry rights in more states than any other single permit."

  - question: "Does California honor concealed carry permits from other states?"
    answer: "No. California does not recognize any other state's permit. Carrying concealed in California requires a California-issued CCW. California's permit is recognized in approximately 10 states."

  - question: "What state has the strictest concealed carry laws?"
    answer: "Hawaii has the most restrictive system in practice. Its permit is recognized in only 4 states, the fewest of any issuing state in the country. Hawaii honors no out-of-state permits. New York and California each recognize zero other states' permits and have permits honored in 10 states or fewer."

  - question: "Can I carry in New York with a Texas License to Carry?"
    answer: "No. New York does not recognize Texas or any other state's carry license. A Texas LTC is honored in 38 states, but New York is not among them. Carrying concealed in New York without a New York pistol license is a felony."

  - question: "What is the difference between shall issue and may issue concealed carry?"
    answer: "Shall Issue requires the licensing authority to issue a permit to any applicant who meets objective criteria such as a background check and training. May Issue gives the issuing authority discretion to deny qualified applicants based on subjective judgment. The U.S. Supreme Court's 2022 Bruen decision ruled that states cannot require applicants to demonstrate a specific need, but May Issue states like New York and Massachusetts have since added significant training, location, and administrative requirements."

