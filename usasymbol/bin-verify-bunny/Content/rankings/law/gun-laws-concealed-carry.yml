  quick_answer:
    - "29 states allow concealed carry without a permit in 2026. Louisiana became the 29th on July 4, 2024. Vermont has never required a permit, predating all state systems since statehood in 1791."
    - "Arizona, Texas, and Utah permits are each honored in 38 states, the highest reciprocity of any state. Hawaii's permit is recognized in only 4 states, the lowest count in the country."
    - "Illinois is the only shall-issue state whose permit no other state recognizes. Vermont issues no permit at all, and residents obtain non-resident licenses from states like Utah or Florida for interstate carry."

  methodology: "Carry status and reciprocity counts reflect state law as of June 2026 via USCCA and NRA-ILA attorney general reciprocity lists; counts exclude the issuing state and Vermont (which issues no permit) is listed at 0. This page is for informational purposes only and does not constitute legal advice."

