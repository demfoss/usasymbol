seo:
  title: "Distilling Laws by State 2026 | Map & Legal Status"
  description: "Owning a still is fully legal in 32 states, but 27 of them still ban possessing the moonshine it produces. It's fully legal in only 4 states."

page:
  h1: "Distilling Laws by State"

  quick_answer:
    - "Distilling is fully legal, covering possession of a still, operating a still, and possessing moonshine, in only 4 states: Arizona, Massachusetts, Missouri, and North Dakota."
    - "27 states allow possessing and operating a still but still ban possessing the moonshine it produces, the most common pattern in the country. South Dakota is the only state where possessing a still is legal but operating one is not."
    - "16 states ban possession of a still, operation of a still, and possession of moonshine outright: Arkansas, Florida, Hawaii, Idaho, Illinois, Indiana, Kentucky, Maryland, Minnesota, Mississippi, New Jersey, Texas, Utah, Virginia, Washington, and Wyoming."

  methodology: "Legal status for possession of a still, operation of a still, and possession of moonshine reflects state law as of 2026. This page is for informational purposes only and does not constitute legal advice."

  sources:
    - name: "World Population Review — Distilling Laws by State"
      url: "https://worldpopulationreview.com/state-rankings/distilling-laws-by-state"
      description: "State-by-state legal status of still possession, still operation, and moonshine possession"

