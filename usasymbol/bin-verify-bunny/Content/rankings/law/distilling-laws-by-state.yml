  button_text: "Compare distilling laws"
  icon: "fa-solid fa-scale-balanced"
  default_state_a: missouri
  default_state_b: texas

sections:
  - id: "states-where-distilling-is-fully-legal"
    icon: "fa-solid fa-check"
    title: "States Where Distilling Is Fully Legal"
    paragraphs:
      - "Arizona, Massachusetts, Missouri, and North Dakota are the only 4 states where possessing a still, operating a still, and possessing moonshine are all legal. Every other state restricts at least one of the three."

  - id: "states-where-moonshine-stays-illegal"
    icon: "fa-solid fa-flask"
    title: "States Where Moonshine Possession Stays Illegal"
    paragraphs:
      - "27 states allow possessing and operating a still but still ban possessing the moonshine it produces, the most common legal pattern in the country. The list includes California, New York, Pennsylvania, Ohio, and Michigan, among others."
      - "South Dakota is the only state with a different split: possessing a still is legal, but operating one and possessing moonshine are both illegal."

  - id: "states-where-distilling-is-fully-illegal"
    icon: "fa-solid fa-ban"
    title: "States Where Distilling Is Fully Illegal"
    paragraphs:
      - "16 states ban possession of a still, operation of a still, and possession of moonshine outright: Arkansas, Florida, Hawaii, Idaho, Illinois, Indiana, Kentucky, Maryland, Minnesota, Mississippi, New Jersey, Texas, Utah, Virginia, Washington, and Wyoming."
      - "Alabama and Alaska don't fit either extreme. Both states leave still possession and operation up to individual counties, but Alabama bans moonshine possession statewide while Alaska leaves that to county rules too."

faq:
  - question: "Is it legal to own a still in the United States?"
    answer: "Possessing a still is legal in 32 states, including all 4 states where distilling is fully legal and 27 more where the still itself is legal but the moonshine it produces is not. It is illegal in 16 states, and it varies by county in Alabama and Alaska."

  - question: "Which states allow both distilling and moonshine possession?"
    answer: "Arizona, Massachusetts, Missouri, and North Dakota are the only 4 states where possessing a still, operating a still, and possessing moonshine are all legal."

  - question: "Which states ban moonshine even where owning a still is legal?"
    answer: "27 states allow possessing and operating a still but still ban possessing moonshine: California, Colorado, Connecticut, Delaware, Georgia, Iowa, Kansas, Louisiana, Maine, Michigan, Montana, Nebraska, Nevada, New Hampshire, New Mexico, New York, North Carolina, Ohio, Oklahoma, Oregon, Pennsylvania, Rhode Island, South Carolina, Tennessee, Vermont, West Virginia, and Wisconsin."

  - question: "Is distilling legal in Texas?"
    answer: "No. Texas is one of 16 states where possession of a still, operation of a still, and possession of moonshine are all illegal."

  - question: "What are the distilling laws in Washington, D.C.?"
    answer: "The District of Columbia requires a license to possess a still, operate a still, or possess moonshine, the only jurisdiction in the country with that exact requirement across all three activities."

  - question: "Is it legal to operate a still in South Dakota?"
    answer: "No. South Dakota is the only state where possessing a still is legal but operating one is illegal, along with possessing moonshine."

