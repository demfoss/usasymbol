faq:
  - question: "Are radar detectors legal in Virginia?"
    answer: "No. Virginia Code Section 46.2-1079 bans radar detectors in all vehicles, including passenger cars, and officers may confiscate the device."

  - question: "Are radar detectors legal in Washington, D.C.?"
    answer: "No. Washington, D.C. bans radar detectors for passenger vehicles, though it is not one of the 50 states ranked on this page."

  - question: "Are radar detectors legal in California?"
    answer: "Yes, but California does not allow them mounted on the windshield. Dashboard mounting is acceptable."

  - question: "Are radar detectors legal in commercial trucks?"
    answer: "No. Federal law under 49 CFR 392.71 bans radar detectors in commercial motor vehicles of 10,001 pounds or more, in every state."

  - question: "Are radar detectors legal in Texas?"
    answer: "Yes. Texas allows radar detectors in private passenger vehicles."

  - question: "Are radar detectors legal in Minnesota?"
    answer: "Yes, but Minnesota restricts windshield mounting, the same rule as California."

