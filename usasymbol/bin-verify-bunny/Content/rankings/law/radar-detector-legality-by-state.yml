sections:
  - id: "states-where-radar-detectors-are-illegal"
    icon: "fa-solid fa-ban"
    title: "States Where Radar Detectors Are Illegal"
    paragraphs:
      - "Virginia is the only state on this list where radar detectors are illegal in every vehicle. Virginia Code Section 46.2-1079 bars any device that detects or interferes with radar or laser, and officers may confiscate the unit."
      - "Washington, D.C. also bans radar detectors for passenger vehicles, though it is not one of the 50 states tracked in this table."

  - id: "states-that-restrict-radar-detector-mounting"
    icon: "fa-solid fa-mobile-screen"
    title: "States That Restrict Radar Detector Mounting"
    paragraphs:
      - "California and Minnesota allow radar detectors but do not allow them mounted on the windshield. Dashboard mounting remains acceptable in both states."

  - id: "commercial-vehicles-and-radar-detectors"
    icon: "fa-solid fa-truck"
    title: "Radar Detector Rules for Commercial Vehicles"
    paragraphs:
      - "Federal law bans radar detectors in commercial motor vehicles of 10,001 pounds or more under 49 CFR 392.71. That rule applies in every state, including the 49 where radar detectors are otherwise legal for private vehicles."

