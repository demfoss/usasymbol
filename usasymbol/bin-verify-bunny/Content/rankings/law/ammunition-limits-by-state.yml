sections:
  - id: "states-that-require-buyers-to-be-21-for-ammunition"
    icon: "fa-solid fa-id-card"
    title: "States That Require Buyers to Be 21 for Ammunition"
    paragraphs:
      - "12 states set the minimum ammunition purchase age at 21, three years above the 18-year-old threshold used in most of the country: California, Hawaii, Illinois, Iowa, Maryland, Massachusetts, Nevada, New Jersey, New York, Ohio, Rhode Island, and Virginia."

  - id: "states-with-the-lowest-ammunition-purchase-age"
    icon: "fa-solid fa-arrow-down"
    title: "States with the Lowest Ammunition Purchase Age"
    paragraphs:
      - "Idaho, Maine, New Hampshire, and Vermont set the minimum ammunition purchase age at 16, the lowest on this list and two years below the 18-year-old minimum used in 34 other states."

faq:
  - question: "What is the minimum age to buy ammunition in most states?"
    answer: "18 is the minimum age to purchase ammunition in 34 states, the most common threshold on this list."

  - question: "Which states require buyers to be 21 to purchase ammunition?"
    answer: "12 states set the minimum ammunition purchase age at 21: California, Hawaii, Illinois, Iowa, Maryland, Massachusetts, Nevada, New Jersey, New York, Ohio, Rhode Island, and Virginia."

  - question: "What states set the ammunition purchase age at 16?"
    answer: "Idaho, Maine, New Hampshire, and Vermont set the minimum ammunition purchase age at 16, the lowest minimum age on this list."

  - question: "What is the ammunition age limit in California?"
    answer: "California sets the minimum age to purchase ammunition at 21, one of 12 states at that threshold."

  - question: "What is the ammunition age limit in Texas?"
    answer: "Texas sets the minimum age to purchase ammunition at 18, matching the threshold used in 34 states."

