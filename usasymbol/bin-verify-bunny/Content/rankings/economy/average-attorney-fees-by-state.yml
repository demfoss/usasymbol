  - question: "Which state has the highest attorney fees?"
    answer: "Delaware has the highest average attorney fee of any state at $423 an hour. New York ranks second at $398, and California is third at $391."

  - question: "Which state has the lowest attorney fees?"
    answer: "West Virginia has the lowest average attorney fee at $195 an hour, the only state under $200."

  - question: "What is the average attorney fee in Texas?"
