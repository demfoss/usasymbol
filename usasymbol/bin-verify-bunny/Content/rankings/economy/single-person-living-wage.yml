sections:
  - id: "highest-income-needed-for-single-adults"
    icon: "fa-solid fa-money-bill-trend-up"
    title: "Highest Income Needed for Single Adults"
    paragraphs:
      - "Hawaii tops the list at $124,467, well above Massachusetts at $120,141 and California at $119,475. New York rounds out the top four at $114,691."
      - "Washington is fifth at $109,658, followed by New Jersey at $108,992 and Maryland at $108,867. Virginia is eighth at $106,704, the last state above $105,000."

  - id: "lowest-income-needed-for-single-adults"
    icon: "fa-solid fa-money-bill-trend-down"
    title: "Lowest Income Needed for Single Adults"
    paragraphs:
      - "West Virginia requires the least income at $80,829, just below Arkansas at $81,078. South Dakota is third-lowest at $82,160, with North Dakota close behind at $82,285."
      - "Kentucky is next at $83,574, and Oklahoma is at $84,282. Every state in this cluster requires less than $85,000, under a third of Hawaii's $124,467."

  - id: "states-with-the-fastest-rising-living-costs"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Fastest-Rising Living Costs"
    paragraphs:
      - "Montana posts the largest year-over-year increase at 9.57%, even though its $92,851 income requirement ranks only 27th overall. Hawaii is close behind at 9.48%, reinforcing its first-place ranking, and Idaho follows at 8.67%."
      - "Wyoming has the smallest increase of any state at 0.33%, despite needing $87,942 in income. Rhode Island is next lowest at 0.50%, and South Dakota is at 0.87%."

