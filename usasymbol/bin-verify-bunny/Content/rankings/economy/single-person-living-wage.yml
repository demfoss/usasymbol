page:
  h1: "Single Person Living Wage by State"

  quick_answer:
    - "Hawaii requires the highest income for a single adult to live in 2025, at $124,467, ahead of Massachusetts at $120,141 and California at $119,475."
    - "West Virginia needs the least at $80,829, just below Arkansas at $81,078 and South Dakota at $82,160."
    - "Montana posts the largest year-over-year increase at 9.57%, even though its $92,851 income requirement ranks only 27th. Hawaii is close behind at 9.48%, and Wyoming has the smallest increase of any state at 0.33%."

  methodology: "Figures show the annual income a single adult needs to cover basic living costs in each state for 2025, along with the percentage change from 2024, compiled by USA Symbol from state-level living wage estimates."

