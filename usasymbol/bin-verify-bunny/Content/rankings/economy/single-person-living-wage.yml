faq:
  - question: "How much income does a single adult need in Hawaii?"
    answer: "A single adult needs $124,467 in Hawaii, the highest figure in the country. That is up 9.48% from 2024, the second-largest increase of any state."

  - question: "Which state requires the lowest income for a single adult?"
    answer: "West Virginia requires the least at $80,829, just below Arkansas at $81,078."

  - question: "Which state had the biggest increase in living costs from 2024 to 2025?"
    answer: "Montana had the largest increase at 9.57%, even though its $92,851 income requirement ranks only 27th among the states."

  - question: "How much does a single adult need to live in California?"
    answer: "California requires $119,475, the third-highest figure in the country. That is up 5.12% from 2024."

  - question: "Which state had the smallest increase in living costs from 2024 to 2025?"
    answer: "Wyoming had the smallest increase at 0.33%. Rhode Island is next lowest at 0.50%, and South Dakota is at 0.87%."

  - question: "How much does a single adult need to live in Texas?"
    answer: "Texas requires $90,771, up 4.30% from 2024."

