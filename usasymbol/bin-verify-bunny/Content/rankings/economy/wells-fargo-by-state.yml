faq:
  - question: "Which state has the most Wells Fargo branches?"
    answer: "California has the most Wells Fargo branches of any state, with 823. Florida ranks second at 498, and Texas is third at 489."

  - question: "Which states have no Wells Fargo branches?"
    answer: "Fourteen states have no Wells Fargo branches: Hawaii, Indiana, Kentucky, Louisiana, Maine, Massachusetts, Michigan, Missouri, New Hampshire, Ohio, Oklahoma, Rhode Island, Vermont, and West Virginia."

  - question: "How many Wells Fargo branches are there in the United States?"
    answer: "The 50 states have 4,359 Wells Fargo branches combined, along with 11,365 ATMs."

  - question: "Which state has the most Wells Fargo ATMs?"
    answer: "California has the most Wells Fargo ATMs of any state at 3,100, more than Florida's 1,083 and Texas's 1,075 combined."

  - question: "Which state has the highest ratio of Wells Fargo ATMs to branches?"
    answer: "Minnesota has the highest ATM-to-branch ratio among the larger Wells Fargo state networks, about 4.2 ATMs per branch, ahead of California's 3.8."

  - question: "Does Wells Fargo have branches in Ohio?"
    answer: "No. Ohio is one of 14 states with no Wells Fargo branches, along with neighboring Michigan and Indiana."

