page:
  h1: "Wells Fargo Banks by State"

  quick_answer:
    - "California has the most Wells Fargo branches of any state at 823, along with 3,100 ATMs, the most of any state for both. Florida ranks second with 498 branches, and Texas is third at 489."
    - "Minnesota has the highest ATM-to-branch ratio among the top Wells Fargo states, 521 ATMs for 125 branches, about 4.2 ATMs per branch, ahead of California's 3.8 and Georgia's 3.3."
    - "Fourteen states have no Wells Fargo presence at all: Hawaii, Indiana, Kentucky, Louisiana, Maine, Massachusetts, Michigan, Missouri, New Hampshire, Ohio, Oklahoma, Rhode Island, Vermont, and West Virginia."

  methodology: "Wells Fargo branch and ATM counts by state are from World Population Review, covering the 50 states. Totals across the table are 4,359 branches and 11,365 ATMs."

  sources:
