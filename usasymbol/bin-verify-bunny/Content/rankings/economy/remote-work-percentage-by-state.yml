sections:
  - id: "states-with-the-most-remote-workers"
    icon: "fa-solid fa-laptop-house"
    title: "States With the Most Remote Workers"
    paragraphs:
      - "Colorado has the highest telework rate at 31.7%, 12 points above the 19.7% national average. Massachusetts is second at 29.4%, and Washington is third at 28.5%."
      - "Maryland (27.6%) and Virginia (27.3%) round out the top five. All five top states border or sit near a major tech or federal-government employment hub, Denver, Boston, Seattle, and the Washington D.C. metro area."

  - id: "states-with-the-fewest-remote-workers"
    icon: "fa-solid fa-industry"
    title: "States With the Fewest Remote Workers"
    paragraphs:
      - "Mississippi has the lowest telework rate at 4.7%, less than a sixth of Colorado's 31.7%. Alabama is second-lowest at 7.7%, and Arkansas is third-lowest at 9.0%."
      - "South Dakota and West Virginia tie for the next-lowest rate at 9.4% each. All five of the lowest-ranked states sit at least 10 points below the 19.7% national average."

