faq:
  - question: "Which state has the highest remote work rate?"
    answer: "Colorado has the highest telework rate at 31.7%. Massachusetts is second at 29.4%, and Washington is third at 28.5%."

  - question: "Which state has the lowest remote work rate?"
    answer: "Mississippi has the lowest telework rate at 4.7%. Alabama is second-lowest at 7.7%, and Arkansas is third-lowest at 9.0%."

  - question: "What is the national remote work rate?"
    answer: "The national telework rate is 19.7%. Twenty states fall below that figure."

  - question: "What is the remote work rate in California?"
    answer: "California's telework rate is 22.6%, ranking 12th-highest and above the 19.7% national average."

  - question: "What is the remote work rate in Texas?"
    answer: "Texas has a telework rate of 18.4%, ranking 24th, just below the 19.7% national average."

  - question: "Does Washington D.C. have the highest telework rate in the country?"
    answer: "Yes, at 56.5%, D.C. leads every state by a wide margin, but it is excluded from this ranking of the 50 states. Colorado's 31.7% is the highest among the states."

