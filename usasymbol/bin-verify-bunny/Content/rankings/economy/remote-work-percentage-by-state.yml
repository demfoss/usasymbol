page:
  h1: "Remote Work Percentage by State"

  quick_answer:
    - "Colorado has the highest telework rate of any state at 31.7%, followed by Massachusetts at 29.4% and Washington at 28.5%."
    - "Mississippi has the lowest telework rate at 4.7%, followed by Alabama at 7.7% and a tie between Arkansas and two other states near 9%."
    - "The national telework rate is 19.7%. Twenty states fall below that figure, from New York at 19.3% down to Mississippi at 4.7%."

  methodology: "Telework rate reflects the share of workers who worked from home some or all hours, using 2023 annual Bureau of Labor Statistics data. The District of Columbia leads all jurisdictions at 56.5% but is excluded here because this page ranks the 50 states only."

  sources:
    - name: "Patriot Software — Remote Work Map: The States With the Most People Working from Home"
      url: "https://www.patriotsoftware.com/blog/payroll/remote-workers-by-state-numbers/"
