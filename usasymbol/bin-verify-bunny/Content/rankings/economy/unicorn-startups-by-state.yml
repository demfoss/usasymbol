faq:
  - question: "Which state has the most unicorn startups?"
    answer: "California has the most by far, with 431 unicorn startups, more than every other state combined."

  - question: "How many unicorn startups are in New York?"
    answer: "New York has 135 unicorn startups, the second-most of any state, led by fintech company Ramp at $32 billion."

  - question: "What is the most valuable unicorn startup in the US?"
    answer: "OpenAI, headquartered in California, is valued at $500 billion, the most valuable unicorn startup in the country."

  - question: "How many unicorn startups does Texas have?"
    answer: "Texas has 33 unicorn startups, led by biotechnology company Colossal Biosciences at $10 billion."

  - question: "Does Massachusetts have a strong startup scene?"
    answer: "Yes. Massachusetts has 47 unicorn startups, the third-most of any state, led by healthcare company Devoted Health at $13 billion."

  - question: "How many unicorn startups are in Georgia?"
    answer: "Georgia has 7 unicorn startups, all headquartered in the Atlanta metro area, led by Flock Safety at $8 billion."

