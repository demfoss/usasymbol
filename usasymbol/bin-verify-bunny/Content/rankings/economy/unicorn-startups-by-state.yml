sections:
  - id: why-california-dominates-the-unicorn-map
    icon: "fa-solid fa-chart-line"
    title: "Why California Dominates the Unicorn Map"
    paragraphs:
      - "California's 431 unicorns are more than every other state's total combined. The state's single most valuable startup, OpenAI at $500 billion, is worth more than the entire unicorn population of New York, Massachusetts, and Texas put together."
      - "That concentration traces to the San Francisco Bay Area, home to the venture capital firms, technical talent, and prior-generation tech giants that keep funding cycling into the next startup. New York's 135, the closest rival, sits at less than a third of California's count."

  - id: states-with-a-single-unicorn-industry
    icon: "fa-solid fa-industry"
    title: "States Built Around One Startup Category"
    paragraphs:
      - "Colorado's top 2 unicorns, Quantinuum ($11B) and Crusoe Energy Systems ($10B), are both frontier computing companies, quantum computing and AI data centers. Georgia's entire unicorn class of 7 companies is headquartered in the Atlanta metro area, led by public-safety software maker Flock Safety at $8 billion."

