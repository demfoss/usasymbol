faq:
  - question: "Which state has the highest average rent?"
    answer: "Massachusetts has the highest average rent of any state at $2,841 a month. Hawaii ranks second at $2,668, and California is third at $2,619."

  - question: "Which state has the lowest average rent?"
    answer: "Oklahoma has the lowest average rent at $1,059 a month, the only state under $1,100."

  - question: "What is the average rent in California?"
    answer: "California's average rent is $2,619 a month, the third-highest figure of any state."

  - question: "What is the average rent in Texas?"
    answer: "Texas's average rent is $1,438 a month, ranking 32nd among the 50 states."

  - question: "Which state has the smallest apartments?"
    answer: "Alaska has the smallest average apartment size at 702 square feet. Its average rent is $1,482 a month, well below the national figure of $1,679 despite the smaller units."

  - question: "How much more is rent in Massachusetts than in Oklahoma?"
    answer: "Massachusetts's average rent of $2,841 is more than double Oklahoma's $1,059, a gap of $1,782 a month between the highest- and lowest-rent states."

