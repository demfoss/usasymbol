  title: "Average Rent by State 2026 | Map & Prices"
  description: "Massachusetts has the highest average rent at $2,841 a month. Oklahoma is lowest at $1,059, less than half as much."

page:
  h1: "Average Rent by State 2026"

  quick_answer:
    - "Massachusetts has the highest average rent in the U.S. at $2,841 a month, ahead of Hawaii ($2,668) and California ($2,619)."
    - "Oklahoma has the lowest average rent at $1,059 a month, less than two-fifths of Massachusetts's figure. Arkansas ($1,128) and North Dakota ($1,162) are the only other states under $1,200."
    - "Average rent across the 50 states works out to about $1,679 a month. Thirty-one states fall below that figure, from Nevada at $1,518 down to Oklahoma at $1,059."

  methodology: "Figures are average monthly rent by state for 2026, listed by state as an average across studio through four-bedroom units. Six states show the latest available figure from 2025 where a 2026 estimate was not yet listed."

  sources:
    - name: "World Population Review — Average Rent by State"
      url: "https://worldpopulationreview.com/state-rankings/average-rent-by-state"
      description: "State-by-state average monthly rent and average apartment size"

