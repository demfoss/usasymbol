faq:
  - question: "Which state has the most bowling alleys?"
    answer: "Ohio has the most bowling alleys of any state, 307, ahead of Wisconsin's 278 and Michigan's 277."

  - question: "Which state has the fewest bowling alleys?"
    answer: "Delaware has the fewest bowling alleys of any state, just 10. Alaska and Hawaii are tied for second-fewest with 14 each."

  - question: "Which state has the most bowling alleys per capita?"
    answer: "Wyoming has the most bowling alleys per capita, about 5.9 per 100,000 residents, even though its raw count of 35 ranks near the bottom of the list."

  - question: "How many bowling alleys are there in the United States?"
    answer: "There are 6,279 bowling alleys across the United States as of July 2026. Ohio, Wisconsin, and Michigan account for roughly 14% of the national total combined."

  - question: "Why does raw count differ so much from the per-capita ranking?"
    answer: "Ohio leads in raw count with 307 alleys but ranks well outside the top 10 per capita at 2.57 per 100,000 residents, because its large population spreads that total thin. Wyoming's 35 alleys look small nationally but serve a population of under 600,000, giving it the country's highest rate."

  - question: "Do California and Texas have a lot of bowling alleys?"
    answer: "California (153) and Texas (125) both rank in the top 15 for raw count, but their large populations push them to the bottom of the per-capita list at 0.39 alleys per 100,000 residents each, tied for the lowest rate in the country."

