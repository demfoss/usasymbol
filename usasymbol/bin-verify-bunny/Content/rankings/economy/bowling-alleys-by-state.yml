  - id: "why-the-midwest-leads-in-bowling-alleys"
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Midwest Leads in Bowling Alleys"
    paragraphs:
      - "Ohio, Wisconsin, and Michigan's combined 862 alleys trace back to German immigrants who settled the Great Lakes region in the late 1800s and brought bowling with them as a familiar social pastime. Milwaukee grew into the game's unofficial capital, and the American Bowling Congress concentrated its early organizing in Chicago, Detroit, Milwaukee, and Cleveland."
      - "Factory towns turned that immigrant pastime into a workplace institution. By 1942, Detroit alone had more than 70,000 bowlers organized into over 14,000 sanctioned league teams, often sponsored by the same manufacturing plants that employed them."

  - id: "states-with-the-most-bowling-alleys-per-capita"
    icon: "fa-solid fa-chart-column"
    title: "States With the Most Bowling Alleys Per Capita"
    paragraphs:
      - "Wyoming has about 5.9 bowling alleys per 100,000 residents, the highest rate of any state despite ranking 42nd in raw count with just 35. North Dakota (4.97) and South Dakota (4.88) follow, both plains states with small populations spread across relatively more lanes per person."
      - "Iowa and Wisconsin round out the top 5, each above 4.6 per 100,000. California and Texas, despite ranking in the top 15 for raw count, fall near the bottom per capita at 0.39 each."
    table:
      numbered: true
      columns:
        state: "State"
        per_100k: "Per 100k Residents"
      rows:
