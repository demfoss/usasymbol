sections:
  - id: "states-with-the-most-bowling-alleys"
    icon: "fa-solid fa-bowling-ball"
    title: "States With the Most Bowling Alleys"
    paragraphs:
      - "Ohio's 307 bowling alleys top every other state, edging out Wisconsin's 278 and Michigan's 277. All three sit in the Great Lakes region, joined by Minnesota (216) in fourth place to form a cluster that holds 4 of the top 5 spots."
      - "Florida breaks up the Midwest run at fifth with 194, ahead of New York (178) and Illinois (172). Delaware sits at the opposite end with just 10, the fewest of any state."
