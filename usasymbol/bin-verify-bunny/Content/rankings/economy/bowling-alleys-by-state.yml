page:
  h1: "Bowling Alleys by State"

  quick_answer:
    - "Ohio has 307 bowling alleys, the most of any state, out of 6,279 nationwide."
    - "Wisconsin (278) and Michigan (277) rank second and third, each within 30 alleys of Ohio's total and part of a Great Lakes cluster that dominates the top of the list."
    - "Wyoming has the most bowling alleys per capita, about 5.9 per 100,000 residents, despite ranking near the bottom in raw count with 35. Delaware has the fewest of any state outright, just 10."

  methodology: "Counts reflect bowling center listings compiled by a national business directory as of July 2026 and fluctuate as venues open and close. Per-capita figures are calculated using each state's population."

  sources:
