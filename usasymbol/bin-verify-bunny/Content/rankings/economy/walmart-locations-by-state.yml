sections:
  - id: "why-texas-leads-the-walmart-store-count"
    icon: "fa-solid fa-store"
    title: "Why Texas Leads the Walmart Store Count"
    paragraphs:
      - "Texas leads with 514 Walmart stores, 166 more than Florida and 242 more than California. Its large population and geographic size provide more distinct trade areas for a statewide retail network."
      - "The table counts locations, not sales or market share. It shows the size of Walmart's physical footprint in each state rather than how busy or profitable those stores are."

  - id: "how-to-read-the-lowest-walmart-counts"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "How to Read the Lowest Walmart Counts"
    paragraphs:
      - "Vermont has 5 Walmart stores. Alaska, Delaware, Hawaii, and Rhode Island each have 9, while Wyoming has 12."
      - "These totals are not adjusted for population, land area, or store format. Small states can rank low in total stores even when residents have comparatively strong access to nearby locations."

