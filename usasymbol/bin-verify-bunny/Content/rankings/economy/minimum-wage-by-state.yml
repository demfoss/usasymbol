faq:
  - question: "What is the federal minimum wage in 2026?"
    answer: "The federal minimum wage is $7.25 per hour in 2026. It has not changed since July 24, 2009 — the longest period without an increase since the Fair Labor Standards Act established a national minimum in 1938. States may set higher rates, and 30 states do."

  - question: "Which state has the highest minimum wage in 2026?"
    answer: "Washington has the highest minimum wage in 2026 at $16.66 per hour, effective January 1, 2026. California and New York follow at $16.50 each. Washington's rate is indexed to the Consumer Price Index and adjusts each January 1 under Initiative 1433 (2016)."

  - question: "Which states still use the $7.25 minimum wage?"
    answer: "Twenty states are effectively at the $7.25 federal minimum in 2026. Five states have no state minimum wage law: Alabama, Louisiana, Mississippi, South Carolina, and Tennessee. Thirteen others match $7.25 by state statute. Georgia and Wyoming have state rates of $5.15, below the federal floor, so $7.25 applies under federal law."

  - question: "What is the tipped minimum wage by state?"
    answer: "Eight states require the full minimum wage for tipped workers with no tip credit: Alaska, California, Hawaii, Minnesota, Montana, Nevada, Oregon, and Washington. The federal cash minimum for tipped workers is $2.13 per hour. State cash minimums elsewhere range from $2.13 to $10.98 (Florida) and $10.00 (New York food service workers)."

  - question: "Which states are raising their minimum wage in 2026?"
    answer: "Missouri, Nebraska, Virginia, and Hawaii all increased to $15.00 or higher on January 1, 2026. Alaska increases from $13.00 to $14.00 on July 1, 2026. Florida increases from $14.00 to $15.00 on September 30, 2026. Several CPI-indexed states also adjusted upward in January 2026."

  - question: "Can cities have a higher minimum wage than the state?"
    answer: "Yes, where state preemption law allows it. Seattle ($20.29/hr), San Francisco ($18.67/hr), and New York City ($17.00/hr) all exceed their state rates. Arkansas, Tennessee, and Wisconsin bar local minimum wage ordinances, so the state rate is the ceiling in those states."

