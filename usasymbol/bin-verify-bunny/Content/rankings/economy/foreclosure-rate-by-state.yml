page:
  h1: "Foreclosure Rate by State"

  quick_answer:
    - "Illinois has the highest foreclosure rate of any state, about 13.12 filings per 10,000 housing units, based on 7,100 properties with a foreclosure filing."
    - "California recorded 10,208 foreclosure filings, more than any other state, yet its rate of 7.12 per 10,000 housing units ranks only 14th nationally. Illinois needed just 7,100 filings to lead the rate ranking."
    - "South Dakota has the lowest foreclosure rate in the country at 0.64 per 10,000 housing units, based on only 25 filings statewide."

  methodology: "Rates convert ATTOM's 2023 housing-units-per-filing data into filings per 10,000 housing units. Counts are properties with a foreclosure filing in the same period."

