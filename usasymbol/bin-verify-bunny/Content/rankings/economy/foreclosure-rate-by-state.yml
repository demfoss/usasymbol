faq:
  - question: "Which state has the highest foreclosure rate?"
    answer: "Illinois has the highest foreclosure rate of any state, about 13.12 filings per 10,000 housing units, based on 7,100 properties with a filing."

  - question: "Which state has the lowest foreclosure rate?"
    answer: "South Dakota has the lowest foreclosure rate in the country at 0.64 per 10,000 housing units, on just 25 filings statewide."

  - question: "Which state has the most foreclosures?"
    answer: "California recorded 10,208 foreclosure filings, more than any other state. Florida follows at 8,233, and Texas at 7,221."

  - question: "Does a high foreclosure count mean a high foreclosure rate?"
    answer: "California leads in raw filings at 10,208 but ranks 14th by rate at 7.12 per 10,000 housing units. Illinois has fewer filings at 7,100 yet the highest rate."

  - question: "What is the foreclosure rate in California?"
    answer: "California's foreclosure rate is 7.12 filings per 10,000 housing units, based on 10,208 properties with a filing."

  - question: "Which states have the fewest foreclosure filings?"
    answer: "South Dakota recorded just 25 filings, the fewest of any state. Vermont had 43, and North Dakota had 47."

