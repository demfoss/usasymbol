map:
  title: "Average Childcare Cost by State Map"
  image: "/images/rankings/economy/average-childcare-costs/average-childcare-costs-map.webp"
  image_alt: "U.S. map color-coded by average annual infant care cost, from Mississippi at $6,868 to Massachusetts at $26,709"
  caption: "Massachusetts leads at $26,709, while Mississippi is lowest at $6,868. New Mexico stands out on the burden side, with infant care equal to 21.0% of median family income."
  metric_key: infant_care_annual_cost
  metric_label: "Infant care"
  color_scheme: red
  color_scale: linear
  tooltip_fields:
    - key: state
      label: "State"
    - key: infant_care_annual_cost
      label: "Infant care cost"
    - key: pct_of_median_income
      label: "% of median income"
    - key: in_state_public_college_tuition
      label: "In-state tuition"

compare:
  metric_slug: childcare-costs
  title: "Compare Childcare Costs Between States"
  description: "Choose two states and compare infant care cost, preschool cost, tuition, and family-income burden."
  button_text: "Compare childcare costs"
  icon: "fa-solid fa-baby"
  default_state_a: massachusetts
  default_state_b: mississippi

sections:
  - id: "average-childcare-cost-by-state-top-and-bottom"
    icon: "fa-solid fa-arrow-up-wide-short"
    title: "Average Childcare Cost by State Top and Bottom"
    paragraphs:
      - "Massachusetts ranks first at $26,709, followed by Minnesota at $22,569 and California at $21,945. Colorado at $21,840 and Hawaii at $21,167 complete the top five."
      - "Mississippi ranks last at $6,868, with Alabama at $7,871 and South Dakota at $8,680 just above it. Arkansas and Louisiana tie at $8,873."

  - id: "states-with-the-highest-childcare-cost-burden"
    icon: "fa-solid fa-sack-dollar"
    title: "States With the Highest Childcare Cost Burden"
    paragraphs:
      - "New Mexico has the highest income burden at 21.0% of median family income. Hawaii is next at 20.0%, and Alaska follows at 19.4%."
      - "Minnesota reaches 18.8%, while California is at 18.4% and Nevada is at 18.3%. South Dakota is the lowest by this measure at 9.4%."

  - id: "states-where-childcare-costs-more-than-college"
    icon: "fa-solid fa-school"
    title: "States Where Childcare Costs More Than College"
    paragraphs:
      - "Infant care costs more than in-state public college tuition in 38 states. California has the largest gap at $13,159, while Washington is $12,533 above tuition."
      - "Michigan is the clearest case in the other direction. Its $10,023 infant care cost is $4,949 below its $14,972 in-state tuition, and Alabama is $3,401 below."

visual_assets:
  - id: childcare-top-and-bottom
    src: /images/rankings/economy/average-childcare-costs/childcare-top-and-bottom.jpg
    alt: Daycare classroom with toddlers and play equipment
    caption: Childcare costs vary enormously by region, with Massachusetts, Minnesota, and California clustered at the top and much of the Deep South near the bottom. The spread between the most and least expensive states is nearly $20,000 a year.
    section: average-childcare-cost-by-state-top-and-bottom
    layout: full-width-tall

  - id: highest-childcare-burden
    src: /images/rankings/economy/average-childcare-costs/highest-childcare-burden.jpg
    alt: Parent arriving at daycare with a child
    caption: Cost burden depends not just on sticker price but on what families earn locally. New Mexico and Hawaii stand out because childcare absorbs an especially large share of median family income there.
    section: states-with-the-highest-childcare-cost-burden
    layout: full-width-tall

  - id: childcare-more-than-college
    src: /images/rankings/economy/average-childcare-costs/childcare-more-than-college.jpg
    alt: College campus walkway with students outdoors
    caption: In most states, infant care now costs more than in-state public college tuition. That comparison captures just how large the financial burden of early childcare has become for many families.
    section: states-where-childcare-costs-more-than-college
    layout: full-width-tall

faq:
  - question: "Which state has the highest average childcare cost?"
    answer: "Massachusetts ranks first at $26,709 a year. Minnesota is next at $22,569."

  - question: "Which state has the lowest average childcare cost?"
    answer: "Mississippi is lowest at $6,868. Alabama follows at $7,871."

  - question: "What is the average childcare cost in California?"
    answer: "California averages $21,945 a year for infant care and $13,020 for child care for a 4-year-old. Its infant care cost equals 18.4% of median family income."

  - question: "What is the average childcare cost in Texas?"
    answer: "Texas averages $10,706 a year for infant care and $9,664 for child care for a 4-year-old. That equals 11.6% of median family income."

  - question: "Which state has the highest childcare cost as a share of income?"
    answer: "New Mexico is highest at 21.0% of median family income. Hawaii is next at 20.0%."

  - question: "Which states have childcare costs higher than college tuition?"
    answer: "Thirty-eight states have infant care costs above in-state public college tuition. California is $13,159 above tuition, and Washington is $12,533 above."

