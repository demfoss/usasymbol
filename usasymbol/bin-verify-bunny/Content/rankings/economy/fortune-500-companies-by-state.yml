  description: Texas has 57 Fortune 500 headquarters in 2026, one more than California. Its companies report $2.77 trillion in combined revenue.
page:
  h1: Fortune 500 Companies by State
  quick_answer:
  - Fortune 500 companies by state place Texas first with 57 headquarters in 2026, one more than California's 56.
  - Texas companies report $2.769 trillion in combined revenue, compared with $2.702 trillion for California and $2.238 trillion for New York.
  - Rhode Island leads the states per capita with 4.49 Fortune 500 headquarters per million residents, ahead of Connecticut at 4.07.
  methodology: Headquarters counts, revenue, and largest companies come from the 2026 Fortune 500, which ranks companies by fiscal 2025 revenue. Per-capita figures use Census Bureau July 2025 population estimates.
