faq:
  - question: "Which state has the most expensive coffee?"
    answer: "Hawaii has the most expensive average coffee price at $4.98. California is second at $3.88, and Washington is third at $3.69."

  - question: "Which state has the cheapest coffee?"
    answer: "Nebraska has the cheapest average coffee price at $2.12. Montana is second-cheapest at $2.56, and Kansas follows at $2.59."

  - question: "What is the average coffee price in the United States?"
    answer: "The average across the 50 states in this table is $3.08, a figure matched exactly by both Maine and Virginia."

  - question: "Which state has the most expensive cappuccino specifically?"
    answer: "A separate study of cappuccino prices found Oklahoma highest at $6.42, despite Oklahoma ranking just 33rd for basic coffee at $2.90 in this table's main dataset."

  - question: "Which state has the cheapest cappuccino?"
    answer: "The same cappuccino-specific study found West Virginia cheapest at $2.50, close to its basic-coffee price of $2.65 in this table."

  - question: "What is the coffee price in California?"
    answer: "California is at $3.88, the second-highest average coffee price of any state, behind only Hawaii at $4.98."

