map:
  title: "Coffee Price Index by State Map"
  image_alt: "U.S. map shaded by average coffee price by state, from Hawaii's $4.98 to Nebraska's $2.12"
  caption: "Hawaii, California, and Washington have the priciest average coffee. Nebraska, Montana, and Kansas anchor the cheapest end of the map."
  metric_key: coffee_price
  metric_label: "Avg. coffee price"
  color_scheme: amber
  color_scale: linear

sections:
  - id: "states-with-the-most-expensive-coffee"
    icon: "fa-solid fa-mug-hot"
    title: "States With the Most Expensive Coffee"
    paragraphs:
      - "Hawaii has the most expensive average coffee price in the country at $4.98, more than a dollar above California's $3.88 in second place. Washington follows at $3.69, and Arizona is fourth at $3.51."
      - "Massachusetts rounds out the top five at $3.49. All five of the priciest states are on the Pacific Coast, in the Southwest, or in New England."

  - id: "states-with-the-cheapest-coffee"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Cheapest Coffee"
    paragraphs:
      - "Nebraska has the cheapest average coffee in the country at $2.12, well below Montana's $2.56 in second-to-last place. Kansas follows at $2.59, and North Dakota is at $2.64."
      - "West Virginia rounds out the bottom five at $2.65. Every one of the five cheapest states is in the Great Plains or Appalachia."

  - id: "how-cappuccino-prices-compare-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "How Cappuccino Prices Compare by State"
    paragraphs:
      - "A separate study of cappuccino prices specifically, rather than basic coffee, found Oklahoma highest at $6.42 and Hawaii second at $6.25. Hawaii's high rank matches its position in the basic-coffee table, but Oklahoma does not. Oklahoma ranks a middling 33rd for basic coffee at $2.90."
      - "West Virginia had the cheapest cappuccino in that same study at $2.50, close to its basic-coffee price of $2.65 and its rank of 46th in this table. The two datasets mostly agree at the bottom, but Oklahoma is the clearest exception at the top."

