  description: "Hawaii has the priciest average coffee at $4.98. Nebraska is cheapest at $2.12, well below the 50-state average of $3.08."

page:
  h1: "Coffee Price Index by State"

  quick_answer:
    - "Hawaii has the highest average price for a basic cup of coffee at $4.98, more than double Nebraska's $2.12, the lowest in the country."
    - "California is second at $3.88 and Washington third at $3.69. The average across all 50 states is $3.08, a figure matched exactly by both Maine and Virginia."
    - "A separate study of cappuccino prices specifically found Oklahoma highest at $6.42 and West Virginia lowest at $2.50, a different pattern from the basic-coffee data in this table."

  methodology: "Base prices reflect the average cost of a plain cup of hot coffee, compiled by Toast from restaurant point-of-sale data across the U.S. in July 2024. A separate Affordable Seating/Delish cappuccino study is cited by name only, since it published just five state prices rather than a full table."

  sources:
    - name: "Toast — Coffee and Tea Trends in All 50 States"
      url: "https://pos.toasttab.com/news/most-popular-coffee-and-tea-drinks-toast-restaurant-trends-report"
      description: "Restaurant point-of-sale pricing data for a basic cup of hot coffee by state, published July 2024"
    - name: "Affordable Seating / Delish — Cappuccino Price Study"
      url: "https://973thedawg.com/ixp/204/p/coffee-costs-united-states/"
      description: "Study of cappuccino prices at the largest coffee shops per state, reporting the five most expensive states and the single cheapest state"

