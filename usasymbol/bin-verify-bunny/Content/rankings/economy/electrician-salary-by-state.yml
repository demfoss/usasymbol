  - id: "states-where-median-pay-beats-average-pay"
    icon: "fa-solid fa-scale-balanced"
    title: "States Where Median Electrician Pay Beats Average Pay"
    paragraphs:
      - "In 13 states, the median electrician salary is higher than the average: Hawaii, Illinois, Oregon, North Dakota, Wisconsin, Connecticut, New Hampshire, Utah, Arizona, Louisiana, Mississippi, South Dakota, and Vermont. Illinois shows the widest gap, with a median annual salary of $95,090 against an average of $88,040."
      - "When the median exceeds the average, it typically means a small group of especially high earners is not the reason for a state's ranking. In Illinois, a typical working electrician earns more than the statewide average, rather than the average being inflated by a handful of top earners."

  - id: "states-with-the-lowest-electrician-salaries"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Electrician Salaries"
    paragraphs:
      - "Arkansas pays electricians the least of any state, an average of $49,800 a year ($23.94 an hour), the only state under $50,000. Florida is second-lowest at $52,380, and North Carolina follows at $53,610."
      - "Alabama, Idaho, and South Carolina round out the five lowest-paying states, all between $54,490 and $55,360 a year, roughly $33,000 less than top-ranked Washington."

faq:
  - question: "Which state pays electricians the most?"
    answer: "Washington pays electricians the most of any state, an average of $88,620 a year ($42.61 an hour). Hawaii ranks second at $88,280, and Illinois is third at $88,040."

  - question: "Which state pays electricians the least?"
    answer: "Arkansas pays electricians the least of any state, an average of $49,800 a year ($23.94 an hour), the only state under $50,000."

  - question: "What is the average electrician salary in Texas?"
    answer: "Texas electricians earn an average of $56,350 a year ($27.09 an hour), with a median of $55,890 a year ($26.87 an hour)."

  - question: "What is the average electrician salary in California?"
    answer: "California electricians earn an average of $84,330 a year ($40.54 an hour), the fifth-highest average of any state. The median is lower, at $77,470 a year."

  - question: "Which state has the highest median electrician salary?"
    answer: "Illinois has the highest median electrician salary at $95,090 a year ($45.72 an hour), higher than any state's average pay, including top-ranked Washington's $88,620 average."

  - question: "What is the average electrician salary in the District of Columbia?"
    answer: "The District of Columbia has the highest average electrician salary in the country at $88,860 a year ($42.72 an hour), just ahead of Washington state's $88,620. DC is not a state, so it is excluded from this table's rankings."

