    - "Illinois has the highest median electrician salary at $95,090 a year ($45.72 an hour), higher than every state's average pay, including top-ranked Washington's $88,620."

  methodology: "Wages reflect mean and median hourly and annual pay for electricians, current as of 2026, with annual figures based on a standard 2,080-hour work year. The District of Columbia is excluded from the table, since it is not a state."

