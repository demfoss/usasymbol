faq:
  - question: "Which state has the most gas stations?"
    answer: "Texas has the most gas stations of any state, 10,670 total, made up of 9,720 with a convenience store and 950 without. California ranks second at 8,116."

  - question: "Which state has the fewest gas stations?"
    answer: "Alaska has the fewest gas stations of any state, with 200 total."

  - question: "How many gas stations are there in the United States?"
    answer: "The 50 states in this table have 109,093 gas stations combined, including 95,931 with a convenience store and 13,162 without."

  - question: "Which state has the most gas stations without a convenience store?"
    answer: "New Jersey has the most gas stations without a convenience store, at 1,185. That is also more than its 1,037 stations that do have one, a pattern no other state shares."

  - question: "What percentage of US gas stations have a convenience store?"
    answer: "About 88% of the 109,093 gas stations across the 50 states have a convenience store attached. The remaining 12% do not."

  - question: "Which state has the highest share of gas stations without a convenience store?"
    answer: "New Jersey has the highest share at 53%. Alaska is next at 31%, followed by North Dakota and Oregon, both at 29%."

