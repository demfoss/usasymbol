  description: "Texas has the most gas stations of any state at 10,670, well ahead of California's 8,116. Alaska has the fewest of any state, with 200."

page:
  h1: "Gas Stations by State"

  quick_answer:
    - "Texas has the most gas stations of any state at 10,670 combined, including 9,720 with a convenience store and 950 without one, well ahead of California's 8,116."
    - "New Jersey is the only state where gas stations without a convenience store (1,185) outnumber those with one (1,037), a pattern found in no other state."
    - "Alaska has the fewest gas stations of any state at 200, though 31% of them lack a convenience store, the second-highest share of any state after New Jersey's 53%."

  methodology: "Gas station counts are from World Population Review, broken out by whether the location includes a convenience store. Each state's total in this table is the sum of both categories."

  sources:
    - name: "World Population Review — Number of Gas Stations by State"
      url: "https://worldpopulationreview.com/state-rankings/number-of-gas-stations-by-state"
      description: "State-by-state count of gas stations with and without an attached convenience store"

