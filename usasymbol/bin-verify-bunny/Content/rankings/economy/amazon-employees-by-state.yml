page:
  h1: "Amazon Employees by State"

  quick_answer:
    - "California has the most Amazon employees of any state at 154,000, followed by Washington at 92,000 and Texas at 86,500."
    - "Washington's 92,000 direct employees support 240,000 indirect jobs, more than any other state and over 2.5 times its own employee count."
    - "West Virginia and Wyoming report the fewest Amazon employees at 200 each. Maine and Alaska follow at 300 each."

  methodology: "Employee counts and indirect jobs supported reflect Amazon's own investment data as of May 2025, listed by World Population Review. Vermont is not listed."

  sources:
