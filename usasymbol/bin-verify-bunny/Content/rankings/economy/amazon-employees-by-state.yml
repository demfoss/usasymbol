faq:
  - question: "Which state has the most Amazon employees?"
    answer: "California has the most Amazon employees at 154,000, ahead of Washington at 92,000 and Texas at 86,500."

  - question: "Which state has the fewest Amazon employees?"
    answer: "West Virginia and Wyoming report the fewest Amazon employees, tied at 200 each. Alaska and Maine follow at 300 each."

  - question: "How many indirect jobs does Amazon support in Washington?"
    answer: "Amazon supports 240,000 indirect jobs in Washington, the highest total of any state. That figure is over 2.5 times Washington's own 92,000 direct employees."

  - question: "How many people does Amazon employ in Texas?"
    answer: "Amazon employs 86,500 people directly in Texas and supports another 65,000 indirect jobs in the state."

  - question: "Does Amazon report employee data for Vermont?"
    answer: "No. Vermont is not listed in this data. Every other state has at least 200 Amazon employees on record."

  - question: "Which states have more indirect jobs than direct Amazon employees?"
    answer: "Washington, Virginia, Kentucky, Ohio, Indiana, Oregon, Louisiana, Mississippi, Utah, Rhode Island, and Hawaii all report more indirect jobs than direct employees. Oregon's gap is the widest, at nearly 3 times its employee count."

