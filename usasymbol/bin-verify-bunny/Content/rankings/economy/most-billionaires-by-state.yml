faq:
  - question: "Which state has the most billionaires?"
    answer: "California leads all states with 124 billionaires and a combined net worth of $532.40 billion. New York trails as a distant second, with 93 billionaires worth $429.70 billion."

  - question: "Which state has the wealthiest billionaires on average?"
    answer: "Nebraska's 2 billionaires average $59.00 billion each, the highest ratio in the rankings, on a combined net worth of $118.00 billion."

  - question: "How many billionaires are in the United States?"
    answer: "The 42 states with billionaires on record have 515 combined, worth $2.56 trillion. Eight states report none."

  - question: "What industry do most California billionaires work in?"
    answer: "Technology is the leading industry among California's 124 billionaires, who are worth a combined $532.40 billion."

  - question: "Which states have no billionaires in the rankings?"
    answer: "Eight states have no billionaires in the rankings. They are Alabama, Alaska, Connecticut, Delaware, Mississippi, New Mexico, North Dakota, and Vermont."

  - question: "How many billionaires does Texas have?"
    answer: "Texas has 48 billionaires worth a combined $219.00 billion, led by its energy industry."

