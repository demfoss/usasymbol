faq:
  - question: "Which state has the most patents per capita?"
    answer: "California leads with 129 patents issued per 100,000 residents in fiscal year 2025, counted by inventor residence."

  - question: "Which state ranks second for patents per capita?"
    answer: "Massachusetts ranks second with 106 patents per 100,000 residents."

  - question: "Why is Delaware sometimes called the top patent state?"
    answer: "When patents are counted by the address of the owning company rather than the inventor's home, Delaware leads with about 169 patents per 100,000 residents, reflecting how many companies are incorporated there. By inventor residence, Delaware ranks closer to 12th."

  - question: "How many patents per capita does Washington state have?"
    answer: "Washington has 80 patents per 100,000 residents, the third-highest rate of any state."

  - question: "Does population size affect this ranking?"
    answer: "No. The ranking is normalized per 100,000 residents, so it measures patent activity relative to population rather than total patent counts."

  - question: "Which state has the lowest patent rate in this list?"
    answer: "Wyoming has the lowest rate among the states with available data, at 29 patents per 100,000 residents."

