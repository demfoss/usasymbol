sections:
  - id: states-with-the-most-patents-per-capita
    icon: "fa-solid fa-lightbulb"
    title: "States With the Most Patents Per Capita"
    paragraphs:
      - "California leads with 129 patents per 100,000 residents in fiscal year 2025, driven by the technology and biotech research clustered around the Bay Area. Massachusetts is second at 106, anchored by the university and biotech corridor around Boston and Cambridge."
      - "Washington (80) and Oregon (75) round out the top 4, both carrying a similar tech-manufacturing base to California's, just at a smaller population scale."

  - id: why-delaware-doesnt-top-this-list
    icon: "fa-solid fa-scale-balanced"
    title: "Why Delaware Doesn't Top This List"
    paragraphs:
      - "Delaware ranks 7th here with 63 patents per 100,000 residents, but a different, equally common method of counting patents puts Delaware in first place nationally, at about 169 utility patents per 100,000 residents. That version counts a patent by the address of the company that owns it, and Delaware is where more American companies are legally incorporated than any other state."
      - "This ranking counts patents by where the inventor actually lives and works, since that measures where the research happens rather than where the resulting paperwork is filed. Under that method, Delaware drops to roughly 12th place."

