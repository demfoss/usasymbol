page:
  h1: "Patents Per Capita by State"

  quick_answer:
    - "California leads the country with 129 patents issued per 100,000 residents in fiscal year 2025, counted by the inventor's home state."
    - "Massachusetts is second with 106 per 100,000, and Washington is third with 80."
    - "Delaware tops a different ranking entirely, about 169 utility patents per 100,000 residents, when patents are counted by the company that owns them rather than where the inventor actually lives."

  methodology: "Patents issued by the US Patent and Trademark Office to residents during fiscal year 2025, counted by inventor residence and normalized per 100,000 state population using US Census Bureau estimates. This method differs from rankings that count patents by the owning company's registered address, which favors states like Delaware where many companies incorporate. Only states included in the source's published ranking appear here; other states were not individually broken out."

