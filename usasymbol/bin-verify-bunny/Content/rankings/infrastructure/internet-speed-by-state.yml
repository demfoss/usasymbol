faq:
  - question: "Which state has the fastest internet speed?"
    answer: "Maryland has the fastest average internet speed at 506.70 Mbps. Virginia is second at 505.60, a gap of just 1.10 Mbps."

  - question: "Which state has the slowest internet speed?"
    answer: "California has the slowest average internet speed at 93.00 Mbps. Montana is next lowest at 110.50."

  - question: "What is the average internet speed in Texas?"
    answer: "Texas averages 425.90 Mbps, ranking eighth among the 50 states."

  - question: "What is the average internet speed in New York?"
    answer: "New York averages 397.70 Mbps, ranking 12th. That places it just behind Massachusetts at 401.20 and ahead of Arizona at 396.10."

  - question: "Is Alaska's internet speed the slowest in the country?"
    answer: "No. Alaska ranks 34th at 285.10 Mbps, well ahead of the two lowest states, California at 93.00 and Montana at 110.50."

  - question: "How much faster is Maryland's internet than California's?"
    answer: "Maryland's average speed of 506.70 Mbps is 413.70 Mbps faster than California's 93.00, more than five times the speed."

