faq:
  - question: "Which state has the highest renewable energy share?"
    answer: "Iowa gets the largest share of its electricity from renewable sources of any state, 59.7%, from 44,402 GWh of wind, solar, geothermal, and biomass generation."

  - question: "Which state has the lowest renewable energy share?"
    answer: "Tennessee has the lowest renewable energy share of any state at 2.4%, followed by Alaska at 2.7% and Pennsylvania at 2.8%."

  - question: "Which state produces the most renewable electricity?"
    answer: "Texas produced 196,997 GWh of renewable electricity, more than any other state by volume, though its 33.1% share ranks only 12th nationally."

  - question: "Does hydropower count as renewable energy in these rankings?"
    answer: "The main ranking excludes conventional hydropower. Including it raises Washington from 9.5% to 69.5% and Vermont from 46.2% to 99.8%, the highest share in the country."

  - question: "Which states tie for the same renewable energy share?"
    answer: "Delaware, Louisiana, and New Jersey all share a 4.3% renewable share. Alabama and Kentucky tie at 3.3%."

  - question: "Is a high renewable share the same as a large renewable energy producer?"
    answer: "California produces 87,632 GWh of renewable electricity, more than all but Texas, yet its 43.6% share ranks seventh. South Dakota produces 12,698 GWh but posts a higher share at 57.1%."

