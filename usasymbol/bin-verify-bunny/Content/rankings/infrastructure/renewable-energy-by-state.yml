page:
  h1: "Renewable Energy by State"

  quick_answer:
    - "Iowa has the highest renewable energy share of any state at 59.7%, from 44,402 GWh of wind, solar, geothermal, and biomass generation."
    - "Texas produced 196,997 GWh of renewable electricity, more than any other state by volume, yet its 33.1% share ranks only 12th nationally. South Dakota is a much smaller producer at 12,698 GWh but a higher share at 57.1%."
    - "Tennessee has the lowest renewable energy share of any state at 2.4%, followed by Alaska at 2.7% and Pennsylvania at 2.8%."

  methodology: "Fool.com's state dataset counts wind, solar, geothermal, and biomass generation. The main renewable share excludes conventional hydropower."

