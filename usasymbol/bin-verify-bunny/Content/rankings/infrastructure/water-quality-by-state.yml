faq:
  - question: "Which state has the best water quality?"
    answer: "Hawaii has the best water quality of any state, an A grade with a score of 99.9 out of 100, based on testing across 30 cities."

  - question: "Which state has the worst water quality?"
    answer: "Oklahoma has the lowest score in the ranking, a B grade at 72.6, more than 27 points below Hawaii's leading score."

  - question: "How many states get an A grade for water quality?"
    answer: "38 states earn an A grade. Connecticut's 80.1 score is the lowest A on record, just 0.3 points above New Jersey's 79.8, the highest B."

  - question: "Which state tested the most cities for water quality?"
    answer: "California tested 765 cities, more than any other state, though its score of 83.7 lands only 24th nationally."

  - question: "Does testing more cities mean better water quality?"
    answer: "Texas tested 647 cities but scored 78.1, while North Carolina tested 260 cities and scored 99.7. More cities tested did not correspond to a higher score for these two states."

  - question: "Which states tie for the same water quality score?"
    answer: "Kansas and Nevada tie at 76.1, and Iowa and Idaho tie at 81.7."

