page:
  h1: "EV Charging Stations by State"

  quick_answer:
    - "California has the most EV charging stations of any state, 20,339 station locations and 67,685 charging ports, according to AFDC data updated August 8, 2026."
    - "Texas holds fifth place nationally with 3,878 stations, yet its 31.7 million residents give it only 12.2 stations per 100,000 people, one of the lowest rates among large states."
    - "Vermont leads every state in stations per capita at 87.3 per 100,000 residents, despite ranking 31st in raw count with 563 stations. Alaska has the fewest stations of any state at 75."

  methodology: "Station and port counts come from the U.S. Department of Energy's Alternative Fuels Data Center, updated August 8, 2026. Per-capita figures use Census Bureau population estimates. DC is excluded from state ranks."

  sources:
    - name: "U.S. Department of Energy — Alternative Fuels Data Center"
      url: "https://afdc.energy.gov/stations/states"
      description: "Public electric vehicle charging station and port counts by state"
    - name: "U.S. Census Bureau — State Population Estimates"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "State population estimates used to calculate charging stations per capita"
