faq:
  - question: "Which state has the most EV charging stations?"
    answer: "California has the most EV charging stations of any state, 20,339 locations and 67,685 charging ports. New York ranks second with 5,702 stations."

  - question: "Which state has the fewest EV charging stations?"
    answer: "Alaska has the fewest EV charging stations of any state, 75 locations and 210 ports. North Dakota is next lowest at 107 stations."

  - question: "Which state has the most EV charging stations per capita?"
    answer: "Vermont has the highest rate of any state, 87.3 stations per 100,000 residents, even though its 563 total stations rank only 31st nationally."

  - question: "How many EV charging stations are in Texas?"
    answer: "Texas has 3,878 charging stations and 12,728 ports, the fifth-most of any state. Its population of 31.7 million gives it a lower per-capita rate, 12.2 stations per 100,000 residents."

  - question: "How many EV charging stations are in the United States?"
    answer: "The 50 states hold 83,089 EV charging station locations and 258,128 charging ports combined, based on AFDC data updated August 8, 2026."

  - question: "Does California lead in EV chargers per person too?"
    answer: "California ranks third per capita at 51.7 stations per 100,000 residents, behind Vermont at 87.3 and Massachusetts at 62.0, even though it leads every state in raw station count."

