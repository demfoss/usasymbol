faq:
  - question: "Which state has the highest public transit usage?"
    answer: "New York has the highest public transit usage at 28.0% of workers. New Jersey ranks second at 11.7%, and Massachusetts is third at 10.2%."

  - question: "Which state has the lowest public transit usage?"
    answer: "South Dakota has the lowest public transit usage at 0.2%. Alabama and Mississippi follow, each at 0.3%."

  - question: "What is public transit usage in California?"
    answer: "California's public transit share is 4.9%, ranking ninth among the states. Its drive solo share is 73.8%."

  - question: "What is public transit usage in Texas?"
    answer: "Texas has a public transit share of 1.3%, tied with Missouri. Its drive solo share is 80.7%, and its average commute is 26.6 minutes."

  - question: "Do states with longer commutes also have higher public transit usage?"
    answer: "Often, yes. New York has both the longest average commute, 33.5 minutes, and the highest transit share, 28.0%, while South Dakota has the shortest commute, 17.3 minutes, and the lowest transit share, 0.2%."

