sections:
  - id: "states-with-the-highest-public-transit-usage"
    icon: "fa-solid fa-train-subway"
    title: "States With the Highest Public Transit Usage"
    paragraphs:
      - "New York ranks first at 28.0%, more than double New Jersey's second-place figure of 11.7%. Massachusetts follows at 10.2%, and Illinois is fourth at 9.4%."
      - "Maryland rounds out the top five at 7.9%, with Washington close behind at 7.0%. Pennsylvania and Hawaii are next, at 5.8% and 5.7%."

  - id: "states-with-the-lowest-public-transit-usage"
    icon: "fa-solid fa-car"
    title: "States With the Lowest Public Transit Usage"
    paragraphs:
      - "South Dakota has the lowest public transit usage at 0.2%. Alabama and Mississippi are next, each at 0.3%, and Arkansas follows at 0.4%."
      - "Kansas and Oklahoma both sit at 0.5%, while South Carolina, Tennessee, Maine, and Nebraska all register 0.6%. Every one of these states also posts a drive solo share above 81%."

  - id: "public-transit-usage-and-commute-times-by-state"
    icon: "fa-solid fa-clock"
    title: "Public Transit Usage and Commute Times by State"
    paragraphs:
      - "New York pairs the highest public transit share, 28.0%, with the longest average commute, 33.5 minutes. South Dakota shows the opposite pattern, with the lowest transit share, 0.2%, and the shortest average commute, 17.3 minutes."
      - "Maryland fits the same trend, ranking fifth in transit use at 7.9% and second in commute time at 33.0 minutes. North Dakota and Wyoming, both under 18 minutes for commute time, also post transit shares of 1.2% or lower."

