    - "Utah has the largest average household size of any state, 2.97 people per household, well above the 2.54 national average."
    - "Hawaii ranks second at 2.85 people per household, and California is third at 2.84. All three states exceed the national average by at least 0.3 people."
    - "Maine has the smallest average household size of any state at 2.26 people, followed by Vermont and North Dakota, which tie at 2.28."

  methodology: "Figures are the average number of people per household by state, based on U.S. Census Bureau data as compiled by World Population Review, 2024. DC is excluded from state ranks."

