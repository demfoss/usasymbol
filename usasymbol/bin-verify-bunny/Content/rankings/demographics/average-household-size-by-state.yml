faq:
  - question: "Which state has the largest average household size?"
    answer: "Utah has the largest average household size of any state, 2.97 people per household, 0.43 above the 2.54 national average."

  - question: "Which state has the smallest average household size?"
    answer: "Maine has the smallest average household size of any state at 2.26 people. Vermont and North Dakota are next lowest, tied at 2.28."

  - question: "What is the average household size in the United States?"
    answer: "The national average is 2.54 people per household. Twenty states, led by Utah at 2.97, sit above that mark."

  - question: "Where does Texas rank for average household size?"
    answer: "Texas ranks fourth at 2.69 people per household, behind only Utah, Hawaii, and California."

  - question: "Where does California rank for average household size?"
    answer: "California ranks third at 2.84 people per household, 0.30 above the national average of 2.54."

  - question: "Which states tie for the same average household size?"
    answer: "Georgia, Nevada, and New Jersey all tie at 2.62. Montana, Ohio, and West Virginia tie at 2.37, and Vermont and North Dakota tie at 2.28."

