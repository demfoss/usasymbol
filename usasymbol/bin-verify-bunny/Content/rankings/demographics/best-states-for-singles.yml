    title: "Best States for Singles"
    paragraphs:
      - "Florida ranks first at 66.26, followed by New York at 64.55, Texas at 64.21, California at 63.69, and Illinois at 62.21. California ranks first in dating opportunities, while Florida pairs a top-three dating opportunities rank with a second-place romance and fun rank."
