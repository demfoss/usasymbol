  - id: "states-with-the-highest-single-men-to-women-ratio"
    icon: "fa-solid fa-venus-mars"
    title: "States with the Highest Single Men to Women Ratio"
    paragraphs:
      - "Alaska records 117.0 single men per 100 single women, the highest ratio in the table. North Dakota follows at 106.7, Wyoming at 106.1, South Dakota at 103.2, and Colorado at 101.9."
      - "Delaware records the lowest ratio at 82.0. Alabama stands at 82.4, Maryland at 82.9, South Carolina at 83.7, and New Jersey at 83.8."

  - id: "best-dating-economics-for-singles"
    icon: "fa-solid fa-champagne-glasses"
    title: "States With the Best Romance and Fun Rank"
