faq:
  - question: "Which state has the highest divorce rate in 2026?"
    answer: "Nevada ranks first with 3.8 annual divorces per 1,000 women age 15 or older in 2023. Idaho and Wyoming tie behind it at 3.4."
  - question: "Which state has the lowest divorce rate in 2026?"
    answer: "Louisiana ranks lowest among the published values at 0.9 per 1,000. Illinois records 1.2, the next-lowest figure."
  - question: "What is the divorce rate in Texas?"
    answer: "Texas has a divorce rate of 2.1 per 1,000 and ranks 38th with Wisconsin. Its divorced population is 2,373,979."
  - question: "What is the divorce rate in Florida?"
    answer: "Florida records 3.0 per 1,000, tied with Alabama and Arkansas at rank 7. Its divorced population totals 2,329,944."
  - question: "What is the divorce rate in California?"
    answer: "California has no divorce-rate value in the supplied 2023 rate table. Its divorced population is listed separately at 2,807,601, with 569,792 separated residents."
  - question: "How many states report a divorce rate?"
    answer: "Forty-five states have a published 2023 rate, and the District of Columbia adds a 46th jurisdiction. California, Hawaii, Indiana, Minnesota, and New Mexico have no rate shown."

