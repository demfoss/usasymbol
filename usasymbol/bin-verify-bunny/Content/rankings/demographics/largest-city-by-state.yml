faq:
  - question: "What is the largest city in New York State?"
    answer: "New York City is the largest city in New York State, with 8,346,955 residents. That total is roughly three times the size of Chicago, the third-largest city in the table at 2,765,636."

  - question: "Which state has the smallest largest city?"
    answer: "Vermont has the smallest largest city of any state. Burlington holds 44,275 residents, with Maine's Portland the only other state whose largest city is below 75,000, at 70,104."

  - question: "How many states have a largest city with over 1 million residents?"
    answer: "Seven states have a largest city exceeding 1 million residents. New York leads at 8,346,955, followed by California (3,869,891), Illinois (2,765,636), Texas (2,435,715), Arizona (1,703,449), Pennsylvania (1,560,480), and Florida (1,038,787)."

  - question: "What is the largest city in California?"
    answer: "Los Angeles is the largest city in California, with 3,869,891 residents, placing California second in the table behind only New York."

  - question: "What is the largest city in Texas?"
    answer: "Houston is the largest city in Texas with 2,435,715 residents, placing Texas fourth in the table behind New York, California, and Illinois."

  - question: "What is the largest city in Florida?"
    answer: "Jacksonville is the largest city in Florida with 1,038,787 residents. Florida ranks seventh in the table, and Jacksonville is the smallest of the seven state-leading cities above 1 million."

