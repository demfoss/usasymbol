faq:
  - question: "Which state has the highest marriage rate?"
    answer: "Nevada has the highest marriage rate of any state at 24.6 per 1,000 residents. Hawaii ranks second at 12.5, and Utah is third at 11.2."

  - question: "Which state has the lowest marriage rate?"
    answer: "Louisiana has the lowest marriage rate at 3.7 per 1,000 residents, the only state under 4."

  - question: "Why is Nevada's marriage rate so much higher than other states?"
    answer: "Nevada's rate counts marriages performed in the state, including destination weddings, not just marriages among Nevada residents. That pushes its rate to 24.6 per 1,000, more than four times the national rate of 6.1."

  - question: "What is the marriage rate in California?"
    answer: "California's marriage rate is 5.5 per 1,000 residents, tied with Mississippi for 33rd among the 50 states."

  - question: "What is the marriage rate in Texas?"
    answer: "Texas's marriage rate is 5.8 per 1,000 residents, tied for 26th with Oregon, Virginia, and West Virginia."

  - question: "What is the national marriage rate?"
    answer: "The national marriage rate is 6.1 per 1,000 residents in 2023. Eighteen states rank above that figure, led by Nevada at 24.6, while Kentucky sits exactly at the national rate."

