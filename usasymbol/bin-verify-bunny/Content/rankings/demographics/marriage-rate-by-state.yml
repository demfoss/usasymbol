sections:
  - id: "why-nevada-leads-every-state"
    icon: "fa-solid fa-champagne-glasses"
    title: "Why Nevada Has the Highest Marriage Rate"
    paragraphs:
      - "Nevada's marriage rate of 24.6 per 1,000 residents is nearly double Hawaii's second-place rate of 12.5 and more than six times the national rate of 6.1. CDC rates count marriages by the state where the ceremony happens, not where the couple lives, and Nevada and Hawaii are the country's two biggest destination-wedding states."
      - "Utah ranks third at 11.2, then Montana at 9.2, both well above the rest of the field. Every other state falls below 8 per 1,000, with Arkansas and Colorado tied for fifth at 7.8."

