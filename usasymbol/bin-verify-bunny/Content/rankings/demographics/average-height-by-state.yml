faq:
  - question: "Which state has the tallest average height for men?"
    answer: "Montana ranks first at 5'10.7\" per CDC BRFSS 2017. All 11 states in ranks 1 through 11 average 5'10.4\" or above. South Dakota is 0.012 inches behind Montana at 5'10.7\", and Utah is third at 5'10.6\"."

  - question: "Which state has the tallest average height for women?"
    answer: "Utah leads for women at 5'4.7\", 0.012 inches ahead of Montana and South Dakota. Nebraska (#4 overall) ranks fourth for women at 5'4.6\"."

  - question: "Which state has the shortest average height?"
    answer: "Hawaii ranks 50th. The 0.612-inch gap between California (#49 at 5'9.6\") and Hawaii (#50 at 5'9.0\") is the widest between any two consecutive ranks in the table. For women, Hawaii (5'3.5\") sits 1.2 inches below Utah (#1)."

  - question: "What is the average height in Texas?"
    answer: "Texas ranks 44th. Men average 5'9.8\" and women 5'3.9\"."

  - question: "What is the average height in California?"
    answer: "California ranks 49th with men at 5'9.6\" and women at 5'4.2\". It is the second-shortest state for men, above only Hawaii."

  - question: "How much does average height vary from state to state?"
    answer: "The range is 1.7 inches for men, from 5'9.0\" in Hawaii to 5'10.7\" in Montana. For women the spread is 1.2 inches, from 5'3.5\" in Hawaii to 5'4.7\" in Utah and Montana. Most states cluster within 0.5 inches of each other."

