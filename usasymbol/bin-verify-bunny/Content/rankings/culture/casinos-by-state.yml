faq:
- question: Which state has the most casinos?
  answer: Nevada has the most with 231. Oklahoma is second at 142, and California follows with 83.
- question: What states have no casinos?
  answer: Georgia, Hawaii, Kentucky, South Carolina, Tennessee, Utah, and Vermont. Only Utah and Hawaii ban all forms of casino gambling outright.
- question: What is the largest casino in the US?
  answer: WinStar World Casino and Resort in Thackerville, Oklahoma. The tribal property anchors a state with 142 casinos, the second most in the country.
- question: How many casinos are in the US?
  answer: Roughly 1,000 in total. There are 492 commercial casinos in 27 states plus 532 tribal gaming operations in 29 states.
- question: How much money do casinos make in the US?
  answer: Commercial casinos took in a record $78.72 billion in 2025 and paid $18.09 billion in gaming taxes. Tribal casinos earned $43.9 billion in fiscal 2024.
- question: Where is online casino gambling legal?
  answer: 'Eight states have legalized online casino play: New Jersey, Pennsylvania, Michigan, West Virginia, Connecticut, Delaware, Rhode Island, and Maine, where launch is expected in late 2026. Sports betting is broader, legal in 39 states plus Washington, D.C., with 32 states offering online wagers.'
