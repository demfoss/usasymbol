page:
  h1: Casinos by State
  quick_answer:
  - Casinos by state counts put Nevada first with 231, ahead of Oklahoma at 142 and California at 83. New York ranks fourth with 34.
  - Seven states have no casinos at all. Utah and Hawaii ban every form of casino gambling, and Georgia, Kentucky, South Carolina, Tennessee, and Vermont also have none.
  - Oklahoma's 142 casinos are almost entirely tribal, led by WinStar World Casino in Thackerville, the largest casino in the United States. Connecticut has just 2, Foxwoods and Mohegan Sun.
  methodology: Casino counts come from World Population Review's April 2026 compilation of American Gaming Association and state regulator data and include both commercial and tribal properties. Revenue figures cite the AGA's 2025 commercial results and the National Indian Gaming Commission's fiscal 2024 tribal report.
  sources:
  - name: World Population Review, Casinos by State
    url: https://worldpopulationreview.com/state-rankings/casinos-by-state
    description: Casino counts by state, commercial and tribal combined, April 2026
  - name: American Gaming Association
    url: https://www.americangaming.org/commercial-gaming-revenue-hits-78-7-billion-in-2025-driving-record-18-1-billion-in-gaming-taxes-nationwide/
    description: 2025 commercial gaming revenue and tax figures
  - name: National Indian Gaming Commission
    url: https://www.nigc.gov/commission/reports-and-publications/gross-gaming-revenue-reports/
    description: Tribal gross gaming revenue reports
