faq:
  - question: "What is the most famous movie filmed in each state?"
    answer: "Each state has its own pick, from Forrest Gump in Alabama to Close Encounters of the Third Kind in Wyoming. The 1990s is the most common release decade, covering 17 states."

  - question: "What is the most famous movie set in Texas?"
    answer: "The Texas Chain Saw Massacre, released in 1974, is Texas's pick, the oldest movie among the 1970s group on the list."

  - question: "What is the most famous movie set in California?"
    answer: "Clueless, released in 1995, is California's pick on this list."

  - question: "Which state's famous movie is the oldest?"
    answer: "Georgia's pick, Gone with the Wind, released in 1939. No other state on the list has a movie from before 1960."

  - question: "Which decade produced the most state-defining movies?"
    answer: "The 1990s, with 17 states including Arkansas's Sling Blade and Oklahoma's Twister. The 1980s is second with 11 states."

  - question: "Do any states share the same movie release year?"
    answer: "Yes. Alabama, Maine, Montana, and New Jersey all picked movies released in 1994: Forrest Gump, The Shawshank Redemption, Legends of the Fall, and Clerks."

