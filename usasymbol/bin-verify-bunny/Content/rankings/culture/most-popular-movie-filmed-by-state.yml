  description: "Forrest Gump represents Alabama, The Shining represents Colorado, and Fargo represents North Dakota among the most famous movies tied to each state."

page:
  h1: "Most Famous Movie Filmed in Each State"

  quick_answer:
    - "The 1990s produced the most state-defining movies, the release decade for 17 states, including Forrest Gump for Alabama and Fargo for North Dakota."
    - "Georgia's pick, Gone with the Wind, released in 1939, is the oldest movie on the list. Missouri's pick, Gone Girl, released in 2014, is the most recent."
    - "Four states share the same release year, 1994: Alabama's Forrest Gump, Maine's The Shawshank Redemption, Montana's Legends of the Fall, and New Jersey's Clerks."

  methodology: "Each state's movie comes from a Business Insider list identifying the most famous film tied to each U.S. state, weighing the state's prominence in the film, whether it was filmed there, box-office gross, and critical reception. Washington, D.C. is excluded."

  sources:
