faq:
  - question: "What is the most popular car in the United States by state count?"
    answer: "Toyota RAV4 and Ford F-150 are tied, each finishing first in 12 states. Tesla Model Y is next, leading 9 states."

  - question: "What is the most popular vehicle in California?"
    answer: "Tesla Model Y is the most popular vehicle in California, followed by Chevrolet Silverado 1500 and Toyota Tacoma."

  - question: "What is the most popular vehicle in Texas?"
    answer: "Ford F-150 is the most popular vehicle in Texas, followed by Chevrolet Silverado 1500 and Tesla Model Y."

  - question: "Which states have Tesla Model Y as the most popular vehicle?"
    answer: "Arizona, California, Colorado, Delaware, Nevada, New Jersey, Utah, Virginia, and Washington, 9 states in total."

  - question: "What is the most popular vehicle in Tennessee?"
    answer: "Nissan Rogue is the most popular vehicle in Tennessee, the only state where a Nissan model takes the top spot."

  - question: "What is the most popular vehicle in Nebraska?"
    answer: "Ford F-150 is the most popular vehicle in Nebraska, followed by Chevrolet Silverado 1500 and Toyota RAV4."

