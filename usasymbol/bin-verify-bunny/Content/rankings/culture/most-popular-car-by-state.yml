sections:
  - id: "toyota-rav4-and-ford-f-150-are-tied-for-most-popular"
    icon: "fa-solid fa-trophy"
    title: "Toyota RAV4 and Ford F-150 Are Tied for Most Popular"
    paragraphs:
      - "Toyota RAV4 is the top-selling vehicle in 12 states, including Florida, Georgia, and Massachusetts. Ford F-150 also tops 12 states, including Texas, Missouri, and Wyoming, giving the two models an exact tie."
      - "Counting every Toyota model, the brand leads 15 states once the Toyota Tacoma (Hawaii, West Virginia) and Toyota Camry (Alabama) are added in, ahead of Ford's 12."

  - id: "states-led-by-tesla-honda-or-chevrolet"
    icon: "fa-solid fa-car"
    title: "States Led by Tesla, Honda, or Chevrolet"
    paragraphs:
      - "Tesla Model Y is the most popular vehicle in 9 states, including Arizona, Colorado, and Delaware."
      - "Honda CR-V leads 7 states, including New York, Ohio, and Maryland. Chevrolet Silverado 1500 leads 4 states, and Chevrolet Equinox leads on its own in Michigan."

  - id: "one-off-state-winners"
    icon: "fa-solid fa-star"
    title: "States With a One-of-a-Kind Top Seller"
    paragraphs:
      - "Four states have a most-popular vehicle that no other state shares. Alabama's is the Toyota Camry, a sedan rather than the trucks and SUVs that dominate most of the list."
      - "Arkansas's top seller is the GMC Sierra 1500, Michigan's is the Chevrolet Equinox, and Tennessee's is the Nissan Rogue, the only state where Nissan takes the top spot."

