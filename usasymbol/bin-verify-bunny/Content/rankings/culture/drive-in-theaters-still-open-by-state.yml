faq:
  - question: "Which state has the most drive-in theaters?"
    answer: "New York has the most, with 28 active drive-in theaters, followed by Pennsylvania with 26 and Ohio with 23."

  - question: "How many drive-in theaters are left in the United States?"
    answer: "Roughly 293 drive-in theaters remain active across the country, down from a peak of about 4,000 in the late 1950s and early 1960s."

  - question: "Which states have no drive-in theaters left?"
    answer: "Delaware, Hawaii, Louisiana, and North Dakota have no active drive-in theater."

  - question: "Why did so many drive-in theaters close?"
    answer: "Rising land values, competition from indoor multiplexes, and the spread of cable TV and home video all cut into attendance starting in the 1970s. A drive-in needs 10 to 15 acres of open land, which grew far more valuable as suburban housing and shopping centers spread."

  - question: "How many drive-in theaters does Texas have?"
    answer: "Texas has 16 active drive-in theaters, the fifth-most of any state."

  - question: "Is the Ford Wyoming Drive-In in Michigan still open?"
    answer: "Yes. The Ford Wyoming Drive-In in Dearborn is one of the largest active drive-ins in the country and one of Michigan's nine remaining theaters."

