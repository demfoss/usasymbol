page:
  h1: "Drive-In Theaters Still Open by State"

  quick_answer:
    - "New York has more active drive-in theaters than any other state, 28, out of roughly 293 still operating nationwide."
    - "Pennsylvania is second with 26 and Ohio is third with 23. Together, New York, Pennsylvania, Ohio, and Indiana (17) account for nearly a third of every drive-in left in the country."
    - "Four states have no drive-in theater left at all: Delaware, Hawaii, Louisiana, and North Dakota."

  methodology: "Counts currently operating drive-in theaters by state, based on a national directory listing. Drive-in counts change seasonally as small, family-run venues open and close, so figures are a snapshot rather than a fixed total."

