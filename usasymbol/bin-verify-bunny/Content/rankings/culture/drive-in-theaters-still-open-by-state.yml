sections:
  - id: "why-the-rust-belt-and-northeast-have-the-most-drive-ins"
    icon: "fa-solid fa-clapperboard"
    title: "Why the Rust Belt and Northeast Have the Most Drive-Ins"
    paragraphs:
      - "New York (28), Pennsylvania (26), Ohio (23), and Indiana (17) alone account for 94 of the roughly 293 drive-ins left nationwide, close to a third of the country's total from just four neighboring states. At their national peak in the late 1950s and early 1960s, roughly 4,000 drive-ins operated across the US, about a quarter of every movie screen in the country."
      - "Drive-ins declined for the same reasons almost everywhere: a single theater needs 10 to 15 acres of open land, and that land became more valuable for suburban housing and shopping centers as multiplexes, cable TV, and home video pulled audiences away starting in the 1970s. The survivors cluster in the Rust Belt and Northeast largely because rural land there stayed cheap and available long after it was developed near faster-growing Sun Belt cities."

  - id: "states-with-no-drive-in-theaters-left"
    icon: "fa-solid fa-circle-xmark"
    title: "States With No Drive-In Theaters Left"
    paragraphs:
      - "Four states have no active drive-in theater: Delaware, Hawaii, Louisiana, and North Dakota. Delaware is the smallest state by land area, leaving little room for a use that needs 10 to 15 open acres, and Hawaii's isolation and high land costs work against it in the same way."

