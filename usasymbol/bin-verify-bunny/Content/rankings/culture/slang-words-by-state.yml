faq:
  - question: "What is the most popular slang word in California?"
    answer: "Hella is California's most recognized slang word, used as an intensifier meaning very or a lot. Oregon and Washington share it, making all three Pacific Coast states part of the same Hella zone."

  - question: "What does Ope mean and which states use it?"
    answer: "Ope is a reflexive Midwestern exclamation said automatically when bumping into someone or making a small mistake. Indiana, Ohio, Iowa, Missouri, Nebraska, Wisconsin, Michigan, Minnesota, and North Dakota all use it. No other slang word in this ranking covers more states."

  - question: "What does Jawn mean in Pennsylvania?"
    answer: "Jawn is an all-purpose Philadelphia noun that replaces any person, place, thing, or concept. Pennsylvania, New Jersey, Delaware, Maryland, and Virginia all use it through Philadelphia's cultural reach."

  - question: "What is the most popular slang word in Texas?"
    answer: "Y'all is the signature Texas slang word, used as the second-person plural in any context. Eight Southern states share it, but Texas uses it more frequently than any of them."

  - question: "What slang does Hawaii use?"
    answer: "Shoots is Hawaii's most recognized slang word, used as an affirmative meaning yes or sounds good. It comes from Hawaii Creole English and is used across all islands."

  - question: "What is New England slang?"
    answer: "Wicked is the defining New England intensifier, placed before adjectives to mean very. All six New England states use it. Connecticut, Massachusetts, Maine, New Hampshire, Rhode Island, and Vermont all say Wicked. Maine also uses Ayuh as its signature affirmative."

