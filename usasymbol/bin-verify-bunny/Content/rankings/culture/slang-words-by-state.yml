seo:
  title: "Most Popular Slang Word by State | Map & List"
  description: "Ope covers 9 Midwestern states. Y'all defines 8 Southern states. Wicked spans all 6 New England states. Jawn runs from Pennsylvania to Virginia."

page:
  h1: "Most Popular Slang Word by State"

  quick_answer:
    - "Ope covers 9 Midwestern states, more than any word in this ranking. Indiana, Ohio, Iowa, Missouri, Nebraska, Wisconsin, Michigan, Minnesota, and North Dakota all use it as a reflexive exclamation for small social collisions."
    - "Y'all defines 8 Southern states from Texas to South Carolina. Wicked claims all 6 New England states. Together the two words account for 14 states, the largest combined regional footprint in the list."
    - "Three words cover the Northeast and mid-Atlantic corridor. Wicked spans all of New England. Jawn reaches Pennsylvania, New Jersey, Delaware, Maryland, and Virginia through Philadelphia's influence. Deadass is New York's word alone."

  methodology: "Words reflect the most widely recognized regionally specific slang term per state, based on dialect geography research and social media usage patterns as of 2025. Where multiple words compete, the term most strongly associated with that state's speech community was selected."

  sources:
    - name: "Harvard Dialect Survey"
      url: "https://www4.uwm.edu/FLL/linguistics/dialect/maps.html"
      description: "Regional dialect research mapping lexical variation across U.S. states"

