  title: "Most Popular Emoji by State | Map, List & Meanings"
  description: "Nevada uses the eggplant emoji more than any other state. New York favors the Statue of Liberty, and Texas favors the grape, per SwiftKey's 2015 emoji study."

page:
  h1: "Most Popular Emoji by State"

  quick_answer:
    - "Nevada's standout emoji is the eggplant, used more than in any other state, based on SwiftKey's 2015 analysis of over one billion emoji sent across the U.S."
    - "New York favors the Statue of Liberty, Texas favors the grape, and California favors the taxi, three emoji tied to state landmarks or stereotypes rather than shared national favorites."
    - "Maine and Hawaii both stand out for the volcano emoji, an odd pairing since Hawaii has active volcanoes and Maine has none."

  methodology: "Each state's standout emoji comes from SwiftKey's 2015 'United States of Emoji' study, which analyzed more than one billion emoji sent from SwiftKey Cloud users and identified the emoji each state used disproportionately more than the national average. Washington, D.C. is excluded."

  sources:
    - name: "KQED — Making Sense of Each State's Most Popular Emoji"
      url: "https://www.kqed.org/pop/17686/map-making-sense-of-each-states-most-popular-emoji"
      description: "State-by-state breakdown of SwiftKey's 2015 emoji study results, covering 49 states"
    - name: "Adweek — SwiftKey Reveals the Most Popular Emoji in Each U.S. State"
      url: "https://www.adweek.com/performance-marketing/swiftkey-reveals-the-most-popular-emoji-in-each-u-s-state/"
      description: "Coverage of the SwiftKey study noting South Dakota's lead in the happy-face emoji"
    - name: "Refinery29 — Most Popular Emoji By State, SwiftKey Study"
      url: "https://www.refinery29.com/en-us/2015/08/92558/most-popular-emoji-by-state-swiftkey-data"
      description: "Additional coverage confirming individual state results including New York, California, Texas, Hawaii, and Maine"

