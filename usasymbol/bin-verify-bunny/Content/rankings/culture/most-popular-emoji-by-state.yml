faq:
  - question: "What is the most popular emoji by state?"
    answer: "There is no single most popular emoji nationwide in this dataset. SwiftKey's 2015 study identified the emoji each state used disproportionately more than the national average, so results range from Nevada's eggplant to New York's Statue of Liberty."

  - question: "What is the most used emoji in Texas?"
    answer: "The grape emoji stands out in Texas, according to SwiftKey's analysis of over one billion emoji."

  - question: "What is the most used emoji in California?"
    answer: "California's standout emoji is the taxi, the same category of urban-life emoji as New Jersey's speaker with sound waves."

  - question: "Why does Nevada use the eggplant emoji the most?"
    answer: "SwiftKey's study identified the eggplant as Nevada's standout emoji without stating a specific reason in the data. It is the only state on the list where that emoji leads."

  - question: "Do any two states share the same standout emoji?"
    answer: "Yes. Maine and Hawaii both stand out for the volcano emoji, the only repeat among the 50 results."

  - question: "What emoji stands out in New York?"
    answer: "New York's standout emoji is the Statue of Liberty. Ohio's is the ice cream cone, and Missouri's is the baseball."

