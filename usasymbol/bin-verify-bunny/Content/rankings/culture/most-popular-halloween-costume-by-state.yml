sections:
  - id: "barbie-is-the-most-popular-costume"
    icon: "fa-solid fa-ranking-star"
    title: "Barbie Is the Most Popular Halloween Costume by State"
    paragraphs:
      - "Barbie is the most-searched pop-culture Halloween costume in 18 states, counting both the classic \"Barbie\" search and the \"Weird Barbie\" variant that trended alongside the 2023 Barbie movie. That single character leads more states than any other search term in this data, spread across every region of the country from New York to Idaho."
      - "Wednesday Addams is the second-largest cluster at 12 states, concentrated in the Southeast and Northeast. Princess Peach from Super Mario Bros leads 9 states, mostly in the Midwest and South. Harley Quinn (4 states), Cruella de Vil (2 states), and Wonder Woman (2 states) round out the remaining pop-culture leaders."

  - id: "skeleton-leads-classic-costumes"
    icon: "fa-solid fa-skull"
    title: "Skeleton Is the Most Popular Classic Halloween Costume"
    paragraphs:
      - "Skeleton is the most-searched classic Halloween costume in 14 states, the single largest classic-costume cluster in the data. Ghost follows in 9 states, and Vampire and Zombie tie for third, each leading in 6 states."
      - "Witch, the costume most associated with Halloween in popular culture, leads in only 4 states: Hawaii, Kentucky, Michigan, and New Hampshire. Pirate leads 3 states, and Cat, Dog, Scarecrow, Clown, and Angel each top a smaller handful."

