sections:
  - id: why-virginia-and-ohio-lead-the-list
    icon: "fa-solid fa-landmark"
    title: "Why Virginia and Ohio Lead the List"
    paragraphs:
      - "Virginia and Ohio are both nicknamed the Mother of Presidents, and the numbers explain why. Virginia's 8 span the earliest era of the republic, from Washington through Wilson, while 4 of the first 5 presidents were Virginia-born."
      - "Ohio's 7 cluster in a single 54-year stretch, from Grant's birth year through Harding's, and all 7 reached office between 1869 and 1923. No state has produced a president since Obama in 1961 outpaced that run."

  - id: the-disputed-birthplace-of-andrew-jackson
    icon: "fa-solid fa-map-pin"
    title: "The Disputed Birthplace of Andrew Jackson"
    paragraphs:
      - "Andrew Jackson's birthplace sits within a few miles of the South Carolina-North Carolina line, and the exact state has been disputed for two centuries. Jackson himself claimed South Carolina, and it remains the traditionally recognized answer, though North Carolina has advanced its own competing claim since the 1800s."

