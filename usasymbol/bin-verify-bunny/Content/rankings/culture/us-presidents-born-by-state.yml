page:
  h1: "US Presidents Born by State"

  quick_answer:
    - "Virginia has produced more US presidents than any other state, 8, including Washington, Jefferson, and Madison."
    - "Ohio is second with 7 presidents, all elected between 1869 and 1923: Grant, Hayes, Garfield, B. Harrison, McKinley, Taft, and Harding."
    - "21 states have produced at least one of the 45 individuals who have served as president. 29 states have produced none."

  methodology: "Counts reflect each president's birth state, not the state they represented politically or lived in as an adult. Grover Cleveland, who served two non-consecutive terms, and Donald Trump, the 45th and 47th president, are each counted once."

