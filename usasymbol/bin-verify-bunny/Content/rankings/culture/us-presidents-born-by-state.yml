faq:
  - question: "Which state has produced the most US presidents?"
    answer: "Virginia has produced the most with 8, including Washington, Jefferson, and Madison."

  - question: "Which state is second for presidential birthplaces?"
    answer: "Ohio is second with 7 presidents, all elected between 1869 and 1923."

  - question: "Was Andrew Jackson born in North or South Carolina?"
    answer: "The exact location is disputed. Jackson claimed South Carolina, the traditionally recognized answer, but North Carolina has advanced a competing claim since the 1800s."

  - question: "How many states have produced a US president?"
    answer: "21 states have produced at least one of the 45 people who have served as president. 29 states have produced none."

  - question: "Which state produced the most recent first-time presidential birthplace?"
    answer: "Hawaii, with Barack Obama, born in 1961, two years after Hawaii became a state. No other state has produced its first president since."

  - question: "How many presidents were born in New York?"
    answer: "5 presidents were born in New York: Van Buren, Fillmore, Theodore Roosevelt, Franklin Roosevelt, and Trump."

