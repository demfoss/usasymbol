page:
  h1: "Most Popular Tattoo Design by State"

  quick_answer:
    - "Flowers are the most-searched tattoo design in 16 states, more than any other category, based on a year of Google Trends search data."
    - "Names rank second, the top search in 13 states including Texas, Colorado, and Tennessee. Hearts top 10 states, and Roses, tracked separately from general flower searches, top 7 more."
    - "Crosses are the least common top search, leading only 4 states: Idaho, Montana, North Dakota, and Ohio."

  methodology: "Each state's top tattoo search term comes from a 12-month Google Trends analysis across five categories, names, hearts, crosses, flowers, and roses, as compiled by Mental Floss. Roses are tracked apart from general flowers. Washington, D.C. is excluded."

  sources:
    - name: "Mental Floss — Map: The Most-Searched Tattoo Designs by State"
