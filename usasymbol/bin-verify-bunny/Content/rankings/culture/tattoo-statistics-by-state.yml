faq:
  - question: "What is the most popular tattoo design by state?"
    answer: "Flowers are the most-searched tattoo design in 16 states, more than any other category. Names are next, leading 13 states."

  - question: "Which states search for name tattoos the most?"
    answer: "Names are the top search in 13 states, including Texas, Colorado, Tennessee, Washington, and Oregon."

  - question: "How many Americans have tattoos?"
    answer: "32% of U.S. adults have a tattoo, and 22% have more than one, according to a 2023 Pew Research Center survey. That figure is national and not broken down by state."

  - question: "What is the most popular tattoo design in Texas?"
    answer: "Names are the most-searched tattoo design in Texas, the same top category as 12 other states."

  - question: "What is the most popular tattoo design in California?"
    answer: "Flowers are California's most-searched tattoo design, the same top category as 15 other states, including Florida and New York."

  - question: "Are rose tattoos different from flower tattoos in this ranking?"
    answer: "Yes. Roses were tracked as their own category apart from general flower searches. 7 states, including Illinois and Pennsylvania, searched for roses specifically, while a separate 16 states led with general flower searches."

