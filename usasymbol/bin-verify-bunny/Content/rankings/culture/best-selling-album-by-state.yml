page:
  h1: "Best-Selling Album by State"

  quick_answer:
    - "California leads the state ranking through the Eagles' Their Greatest Hits 1971-1975, the top RIAA-certified U.S. album at 40 million units."
    - "Indiana ranks second through Michael Jackson's Thriller (34 million units, 1982), and Oklahoma ranks third through Garth Brooks's Double Live (25 million units, 1998)."
    - "California-linked acts account for 6 of the RIAA's top 25 albums: two by the Eagles and one each by Green Day, Metallica, Guns N' Roses, and Journey."

  methodology: "The ranking takes the highest-certified album for each U.S. state represented in the RIAA top 25 as of June 2026, using certified units that include qualifying U.S. sales and streams. Solo artists are assigned by birthplace, bands by founding city, and acts without one U.S. home state to the international group."

  sources:
    - name: "RIAA Gold & Platinum - Top 100 Albums"
      url: "https://www.riaa.com/gold-platinum/?tab_active=top_tallies&ttt=T1A"
      description: "Current U.S. album certification totals used for the ranking"
    - name: "RIAA Gold & Platinum Program"
      url: "https://www.riaa.com/gold-platinum/about-awards/"
      description: "Certification thresholds and rules for counting album sales, track sales, and on-demand streams"

