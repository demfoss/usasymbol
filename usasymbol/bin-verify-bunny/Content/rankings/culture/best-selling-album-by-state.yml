sections:
  - id: "state-album-spotlights"
    icon: "fa-solid fa-record-vinyl"
    style: "law-cards"
    title: "States With a Top-25 RIAA Album"
    paragraphs:
      - "Only 7 states place an album in the RIAA's top 25 best-sellers. California leads by a wide margin, and the other six states each carry a distinct story."
    subsections:
      - subtitle: "California"
        text: |
          **Top Artist:** Eagles
          **Certified Units:** 40 million (1976)

          California is tied to six of the top 25 best-selling U.S. albums, more than any other state. The Eagles, formed in Los Angeles in 1971, hold two of them: Their Greatest Hits 1971-1975 (40 million units) and Hotel California (28 million units), both released in 1976. Green Day (Berkeley), Metallica (Los Angeles), Guns N' Roses (Los Angeles), and Journey (San Francisco) add four more.

          No other state comes close to that count. New Jersey and Oklahoma are the next closest with two albums apiece, and four of the seven states on this list place only one album in the top 25.
      - subtitle: "Indiana"
        text: |
          **Artist:** Michael Jackson
          **Certified Units:** 34 million (1982)

          Michael Jackson was born in Gary, Indiana, in 1958. Thriller, his 1982 studio album, is certified for 34 million units, the highest total of any non-compilation album in U.S. chart history.

          Indiana's total rests on one album, but that album outsells every other state's best entry except California's Eagles compilation.
      - subtitle: "Oklahoma"
        text: |
          **Artist:** Garth Brooks
          **Certified Units:** 25 million (1998)

          Garth Brooks, born in Tulsa, Oklahoma, released Double Live in 1998, certified for 25 million units. His 1990 album No Fences adds a second Oklahoma entry to the top 25, certified for 18 million units.

          Oklahoma is one of only two states to place two albums in the top 25, and both of its entries come from the same artist.
      - subtitle: "New York"
        text: |
          **Artist:** Billy Joel
          **Certified Units:** 23 million (1985)

          Billy Joel, born in the Bronx and raised on Long Island, released Greatest Hits Volume I & Volume II in 1985. The compilation is certified for 23 million units, tied for eighth place overall with Pink Floyd's The Wall.

          New York's single entry outranks every state's best album except California, Indiana, and Oklahoma, keeping it among the top four state-linked albums on the list.
      - subtitle: "South Carolina"
        text: |
          **Artist:** Hootie & the Blowfish
          **Certified Units:** 22 million (1994)

          Hootie & the Blowfish formed in 1986 at the University of South Carolina in Columbia. Cracked Rear View, the band's 1994 debut, is certified for 22 million units, the tenth-highest total in U.S. chart history.

          Cracked Rear View is the highest-certified debut among the seven state-leading albums. That distinction puts South Carolina fifth even though the state has no second entry in the RIAA top 25.
      - subtitle: "New Jersey"
        text: |
          **Top Artist:** Whitney Houston
          **Certified Units:** 19 million (1992)

          Whitney Houston, born in Newark, New Jersey, released The Bodyguard soundtrack in 1992, certified for 19 million units. Bruce Springsteen, born in Long Branch, New Jersey, adds Born in the U.S.A. (17 million units, 1984) as the state's second top-25 album.

          New Jersey is the only state on this list where a soundtrack, rather than a studio or live album, produces the higher-certified of its two entries.
      - subtitle: "Massachusetts"
        text: |
          **Artist:** Boston
          **Certified Units:** 17 million (1976)

          Boston formed in the city of the same name in 1976, and the band's self-titled debut album is certified for 17 million units, tied for the lowest total among this list's seven states.

          Massachusetts closes out the ranking, but a 17-million-unit debut is still enough to make the RIAA top 25, a list only seven states appear on at all.

  - id: "international-artists-on-the-best-selling-list"
    icon: "fa-solid fa-globe"
    title: "International Artists With Top-25 U.S. Albums"
    paragraphs:
      - "Eleven of the top 25 best-selling U.S. albums come from artists with no single U.S. state of origin. Seven trace to Britain: Led Zeppelin's Led Zeppelin IV (24 million units, 1971), two Beatles compilations (24 million units in 1968 and 17 million units in 1973), Pink Floyd's The Wall (23 million units), Fleetwood Mac's Rumours (21 million units), Adele's 21 (17 million units), and Elton John's Greatest Hits (17 million units)."
      - "The remaining four come from three other countries. AC/DC's Back in Black (27 million units, 1980) is Australian. Shania Twain's Come On Over (20 million units) and Alanis Morissette's Jagged Little Pill (17 million units) are both Canadian. Bob Marley & The Wailers' Legend (18 million units) traces to Jamaica."

