faq:
  - question: "Which state has the best-selling album in U.S. history?"
    answer: "California. The Eagles formed in Los Angeles, and Their Greatest Hits 1971-1975 is certified for 40 million units, the only album to reach that total in U.S. chart history."

  - question: "What is the best-selling non-compilation album in the U.S.?"
    answer: "Michael Jackson's Thriller, certified for 34 million units. Jackson was born in Gary, Indiana, in 1958, and Thriller remains the highest-certified studio album in U.S. chart history."

  - question: "Is Thriller the best-selling album of all time in the U.S.?"
    answer: "No. The Eagles' Their Greatest Hits 1971-1975 outranks it at 40 million certified units against Thriller's 34 million. Thriller is the best-selling non-compilation album."

  - question: "How many states have an album in the RIAA top 25?"
    answer: "Seven: California (40 million units), Indiana (34 million), Oklahoma (25 million), New York (23 million), South Carolina (22 million), New Jersey (19 million), and Massachusetts (17 million)."

  - question: "How many top-25 U.S. albums are by international artists?"
    answer: "Eleven of the RIAA's top 25 albums come from artists with no single U.S. home state. Seven albums are by British acts, two by Canadian artists, one by an Australian band, and one by a Jamaican group."

  - question: "Which states have more than one album in the RIAA top 25?"
    answer: "California has six: two by the Eagles and one apiece by Green Day, Metallica, Guns N' Roses, and Journey. Oklahoma and New Jersey each place two."

