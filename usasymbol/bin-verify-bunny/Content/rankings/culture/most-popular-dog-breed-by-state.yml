faq:
  - question: "What is the most popular dog breed by state?"
    answer: "Chihuahua is the most popular dog breed in 21 states, more than any other breed. Golden Retriever is next, leading 14 states."

  - question: "Which state has the most Chihuahuas as the top breed?"
    answer: "Chihuahua ranks first in 21 states, including Texas, Georgia, and Tennessee, concentrated across the South and Southwest."

  - question: "What is the most popular dog breed in California?"
    answer: "French Bulldog is California's most popular dog breed, one of only 3 states where it ranks first, alongside Florida and Hawaii."

  - question: "What is the most popular dog breed in Texas?"
    answer: "Chihuahua is the most popular dog breed in Texas, the same top breed as 20 other states."

  - question: "Which states have a most popular dog breed found nowhere else?"
    answer: "Maryland is the only state where Yorkshire Terrier ranks first. Idaho and Utah are the only two states where Goldendoodle leads."

  - question: "Is Golden Retriever the most popular dog breed nationally?"
    answer: "Chihuahua leads more states, 21 to Golden Retriever's 14, though Golden Retriever's states form a tighter regional cluster across New England and the Upper Midwest."

