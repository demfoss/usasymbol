page:
  h1: "Most Popular Dog Breed by State"

  quick_answer:
    - "Chihuahua is the most popular dog breed in 21 states, more than any other breed, according to a fall 2023 analysis of pet insurance data."
    - "Golden Retriever ranks second, leading 14 states concentrated in New England and the Upper Midwest. German Shepherd tops 5 states, and French Bulldog leads 3, including California and Florida."
    - "Maryland is the only state where Yorkshire Terrier ranks first. Idaho and Utah are the only two states where Goldendoodle leads."

  methodology: "Each state's top dog breed comes from a U.S. News & World Report analysis of more than 800,000 pet insurance data points, fall 2023. Washington, D.C. is excluded from state ranks."

  sources:
    - name: "U.S. News & World Report — Most Popular Dog Breeds by State"
