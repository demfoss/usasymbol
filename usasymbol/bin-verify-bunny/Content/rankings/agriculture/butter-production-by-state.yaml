page:
  h1: Butter Production by State
  quick_answer:
  - California produced 49,303,000 pounds of butter in 2025, 90.13% of the US total and the most of any
    state.
  - Pennsylvania is the only other state with reportable butter production, at 5,394,000 pounds, 9.86%
    of the US total.
  - Together California and Pennsylvania account for the entire national butter total of 54,700,000 pounds.
  methodology: Production figures are 2025 data on record with USDA NASS. Only California and Pennsylvania
    have reportable commercial butter production.
