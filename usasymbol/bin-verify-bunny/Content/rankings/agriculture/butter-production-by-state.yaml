faq:
- question: Which state produces the most butter?
  answer: California produces the most butter at 49,303,000 pounds in 2025, 90.13% of the US total.
- question: Which states make butter commercially?
  answer: 'USDA NASS reports commercial butter production for only two states: California and Pennsylvania.'
- question: How much butter does Pennsylvania produce?
  answer: Pennsylvania produced 5,394,000 pounds of butter in 2025, 9.86% of the US total and the only
    other state with reportable production.
- question: What is the total US butter production?
  answer: The United States produced 54,700,000 pounds of butter in 2025, all of it from California and
    Pennsylvania combined.
