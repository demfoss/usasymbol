faq:
- question: Which state produces the most ice cream?
  answer: California produces the most ice cream at 4,900,000 gallons, 33.6% of the seven-state reporting total.
- question: Which state produces the least ice cream?
  answer: Connecticut produces the least among reporting states at 614,000 gallons.
- question: How much ice cream does Pennsylvania produce?
  answer: Pennsylvania produces 3,802,000 gallons of ice cream, the second-highest total of any state.
- question: What is the total US ice cream production shown in this data?
  answer: The seven states with disclosed figures produce a combined 14,600,000 gallons, led by California and Pennsylvania.
- question: How much ice cream does Wisconsin produce?
  answer: Wisconsin produces 753,000 gallons of ice cream, ranking sixth among reporting states.
