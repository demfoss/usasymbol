sections:
- id: states-that-produce-the-most-ice-cream
  icon: fa-solid fa-ice-cream
  title: States With the Most Ice Cream Production
  paragraphs:
  - California leads ice cream production at 4,900,000 gallons, well ahead of Pennsylvania's 3,802,000 gallons. Ohio follows at 2,090,000 gallons, and New York rounds out the top four at 1,372,000 gallons.
  - Only seven states publicly disclose plant-level ice cream production. Utah (1,052,000 gallons) and Wisconsin (753,000 gallons) trail the top four, while Connecticut's 614,000 gallons is the smallest total in the table.
