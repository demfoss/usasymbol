page:
  h1: Ice Cream Production by State
  quick_answer:
  - California produces the most ice cream of any state at 4,900,000 gallons, out of a seven-state reporting total of 14,600,000 gallons.
  - Pennsylvania ranks second at 3,802,000 gallons, and Ohio ranks third at 2,090,000 gallons.
  - Connecticut produces the least among reporting states at 614,000 gallons, less than an eighth of California's output.
  methodology: Figures are 2025 ice cream production by state from USDA dairy processing data, limited to states where plant-level output is publicly disclosed. States without disclosed figures are not shown.
