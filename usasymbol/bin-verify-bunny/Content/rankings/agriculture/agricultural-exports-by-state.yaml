sections:
- id: why-california-iowa-and-illinois-export-different-crops
  icon: fa-solid fa-ship
  title: Why California, Iowa, and Illinois Export Different Crops
  paragraphs:
  - California's $26.35 billion in exports leans heavily on tree nuts, worth $9.15 billion in 2024, more
    than a third of the state's total export value.
  - Iowa's $13.67 billion total comes mostly from soybeans at $3.48 billion, pork at $2.85 billion, and
    corn at $2.39 billion. Illinois follows the same pattern, with $3.98 billion in soybean exports leading
    its $11.09 billion total.
