page:
  h1: Agricultural Exports by State
  quick_answer:
  - California exported $26.35 billion in agricultural products in 2024, more than any other state, led
    by $9.15 billion in tree nuts.
  - Iowa ranks second at $13.67 billion, driven by $3.48 billion in soybeans, $2.85 billion in pork, and
    $2.39 billion in corn.
  - Illinois follows at $11.09 billion, also led by soybeans at $3.98 billion, while Minnesota and Nebraska
    round out the top five at $8.34 billion and $8.19 billion.
  methodology: Figures are calendar-year 2024 state agricultural export estimates from USDA's Economic
    Research Service, derived from farm cash receipts rather than port-of-shipment records. This gives
    a production-based view of which state grew the exported goods.
