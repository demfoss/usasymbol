faq:
- question: Which state exports the most agricultural products?
  answer: California, at $26.35 billion in 2024, more than any other state. Iowa ranks second at $13.67
    billion.
- question: What does California mostly export in agriculture?
  answer: Tree nuts lead California's exports at $9.15 billion in 2024, more than a third of the state's
    $26.35 billion total.
- question: What does Iowa mostly export?
  answer: Soybeans lead Iowa's exports at $3.48 billion, followed by pork at $2.85 billion and corn at
    $2.39 billion.
- question: Which state has the lowest agricultural exports?
  answer: Alaska, at $22 million in 2024, the lowest among ranked states, followed by Rhode Island at $48
    million.
- question: How much does Texas export in agricultural products?
  answer: Texas exported $6.48 billion in 2024, ranking sixth nationally.
- question: How is state agricultural export value calculated?
  answer: USDA's Economic Research Service estimates state export value from farm cash receipts rather
    than port-of-shipment records, crediting the state where a commodity was produced rather than where
    it was shipped.
