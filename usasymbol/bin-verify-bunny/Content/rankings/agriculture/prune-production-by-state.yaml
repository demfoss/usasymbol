faq:
- question: Which state produces the most prunes?
  answer: California produces the most prunes in the country, and it is the only state with published
    commercial prune production, at 73,500 tons in 2025.
- question: Do any other states grow prunes commercially?
  answer: USDA NASS does not publish state-level prune production figures for any state other than California.
- question: How many tons of prunes does California produce?
  answer: California produced 73,500 tons of utilized prunes in 2025.
- question: Are prunes the same as plums?
  answer: Prunes are a variety of plum grown and dried specifically for the dried fruit market. USDA tracks
    California as the sole commercial producer of both prunes and plums.
