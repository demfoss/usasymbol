page:
  h1: Turkey Production by State
  quick_answer:
  - North Carolina produces the most turkey at 1,094,800,000 pounds a year, about 20% of the 13-state total.
  - Minnesota ranks second at 971,500,000 pounds, ahead of Indiana's 826,000,000 pounds in third.
  - California produces the least among the 13 tracked states at 82,990,000 pounds, just below South Dakota's 83,880,000 pounds.
  methodology: Production figures reflect 2025 USDA NASS poultry data reported by World Population Review, measured in pounds. Thirteen states are tracked for commercial turkey production.
