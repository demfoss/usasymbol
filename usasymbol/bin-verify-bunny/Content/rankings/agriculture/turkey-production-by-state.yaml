faq:
- question: Which state produces the most turkey?
  answer: North Carolina produces the most turkey at 1,094,800,000 pounds a year, about 20% of the 13-state total.
- question: Which state produces the least turkey?
  answer: California produces the least among the tracked states at 82,990,000 pounds, just below South Dakota's 83,880,000 pounds.
- question: Which state ranks second in turkey production?
  answer: Minnesota ranks second at 971,500,000 pounds, ahead of Indiana's 826,000,000 pounds.
- question: How many states are tracked for turkey production?
  answer: USDA NASS tracks 13 states for commercial turkey production, totaling 5,459,110,000 pounds a year.
- question: How much turkey does Iowa produce?
  answer: Iowa produces 471,960,000 pounds of turkey a year, ranking fourth among the 13 tracked states.
