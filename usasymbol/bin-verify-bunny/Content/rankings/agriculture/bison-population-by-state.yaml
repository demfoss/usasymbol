page:
  h1: Bison Population by State
  quick_answer:
  - South Dakota has 33,995 bison across 105 farms and ranches, more than any other state, according
    to the 2022 Census of Agriculture.
  - Nebraska ranks second with 32,206 bison on 74 farms, and Montana third with 20,466 bison on 69 farms.
  - The United States had 192,477 bison on 1,986 farms in 2022, up from 183,780 bison on 1,775 farms
    in 2017.
  methodology: Figures are from the USDA National Agricultural Statistics Service's 2022 Census of Agriculture,
    Table 23, bison inventory and farm counts by state, conducted every five years.
  sources:
