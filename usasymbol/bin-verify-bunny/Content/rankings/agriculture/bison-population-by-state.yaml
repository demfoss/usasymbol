faq:
- question: Which state has the most bison?
  answer: South Dakota has the most bison at 33,995 head across 105 farms and ranches, per the 2022 Census
    of Agriculture.
- question: How many bison are in the United States?
  answer: The US had 192,477 bison on 1,986 farms and ranches in 2022, up from 183,780 bison on 1,775
    farms in 2017.
- question: Which state has the most bison ranches?
  answer: Texas has the most bison farms and ranches at 298, though its total bison count of 8,187 ranks
    eighth nationally, well below South Dakota's 33,995.
- question: How many bison does Nebraska have?
  answer: Nebraska has 32,206 bison across 74 farms and ranches, the second-highest inventory of any
    state behind South Dakota.
- question: Does Montana have a large bison population?
  answer: Montana ranks third with 20,466 bison across 69 farms and ranches, behind South Dakota and
    Nebraska.
