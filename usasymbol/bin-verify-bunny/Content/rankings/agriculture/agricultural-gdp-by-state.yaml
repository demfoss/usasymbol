faq:
- question: Which state has the largest agricultural GDP?
  answer: California, at $49.88 billion in 2025, more than double second-ranked Texas's $18.79 billion.
- question: Which state's economy relies most on agriculture?
  answer: South Dakota, where agriculture makes up 8.08% of total state GDP, the highest share of any
    state.
- question: How much of California's economy is agriculture?
  answer: Agriculture accounts for just 1.17% of California's $4.25 trillion economy, even though its
    $49.88 billion agricultural GDP is the largest in the country.
- question: Which state has the smallest agricultural GDP?
  answer: Massachusetts, at $834 million in 2025, the smallest among states with reported data.
- question: How does Iowa's agricultural GDP compare to its overall economy?
  answer: Iowa's $15.45 billion agricultural sector equals 5.58% of the state's total GDP, the fourth-highest
    share nationally behind South Dakota, North Dakota, and Nebraska.
- question: Why are some states missing from this ranking?
  answer: Connecticut, Delaware, Hawaii, Rhode Island, Vermont, and Wyoming had their agricultural GDP
    figures suppressed by BEA to avoid disclosing individual company data.
