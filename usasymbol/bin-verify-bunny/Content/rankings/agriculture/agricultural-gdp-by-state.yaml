  icon: fa-solid fa-chart-pie
  title: Agriculture's Share of State Economic Output
  paragraphs:
  - South Dakota's $6.52 billion in agricultural GDP equals 8.08% of the state's total economic output,
    the highest share of any state. North Dakota follows at 5.85% and Nebraska at 5.80%, both far above
    the national pattern.
  - California's $49.88 billion agricultural sector is the largest in dollar terms, nearly eight times
    South Dakota's total, yet it makes up just 1.17% of California's much larger $4.25 trillion economy.
