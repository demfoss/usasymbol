page:
  h1: Agricultural GDP by State
  quick_answer:
  - California's agricultural sector generated $49.88 billion in value added in 2025, more than any other
    state and nearly eight times South Dakota's $6.52 billion.
  - South Dakota's agriculture accounts for 8.08% of its state economy, the highest share nationally, compared
    with just 1.17% in California despite California's far larger dollar total.
  - Texas ranks second in dollar terms at $18.79 billion, while Massachusetts has the smallest agricultural
    sector among ranked states at $834 million.
  methodology: Figures are nominal value added for the "Agriculture, forestry, fishing and hunting" industry
    from the U.S. Bureau of Economic Analysis's GDP by State data (SAGDP2N), 2025 preliminary annual estimates.
    Six states are excluded because BEA suppressed their figures to avoid disclosing individual company
    data.
  sources:
