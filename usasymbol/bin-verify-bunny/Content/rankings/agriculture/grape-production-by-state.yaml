    title: "Why California Leads Grape Production"
    paragraphs:
      - "California's 5 million tons comes from microclimates that range from cool coastal regions to warm inland valleys, conditions suited to many grape varieties at once. Washington's 280,000 tons comes largely from cooler growing areas such as the Columbia Valley, irrigated by the Columbia River."

