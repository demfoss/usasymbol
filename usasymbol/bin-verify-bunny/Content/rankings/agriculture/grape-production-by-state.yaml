faq:
  - question: "Which state produces the most grapes?"
    answer: "California produces the most grapes at 5 million tons a year."

  - question: "Which state ranks second in grape production?"
    answer: "Washington ranks second at 280,000 tons, far below California but ahead of New York's 220,000 tons."

  - question: "How many tons of grapes does New York produce?"
    answer: "New York produces 220,000 tons of grapes a year, ranking third nationally."

  - question: "Which state produces the fewest grapes among top producers?"
    answer: "Oregon produces the least among the four major grape states at 110,000 tons."

  - question: "Why does California produce so many more grapes than other states?"
    answer: "California's climate ranges from cool coastal areas to warm inland valleys, giving growers conditions for many grape varieties at once, unlike the narrower growing regions in Washington, New York, or Oregon."

