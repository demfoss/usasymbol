page:
  h1: "Asparagus Production by State"

  quick_answer:
    - "Michigan grows the most asparagus in the country, producing 273,000 cwt in 2025, more than double Washington's 136,000 cwt."
    - "Washington posts the highest asparagus yield per acre at 68.0 cwt, nearly double Michigan's 35.0 cwt and New Jersey's 34.0 cwt."
    - "New Jersey commands the highest price per cwt at $310.00, nearly triple Washington's $103.00 average."

  methodology: "Area, yield, production, and price figures are 2025 marketing-year data on record from USDA NASS's Vegetables 2025 Summary (February 2026), covering asparagus grown in the open for fresh market and processing. Only Michigan, New Jersey, and Washington had published state-level totals for 2025."

  sources:
    - name: "USDA NASS. Vegetables 2025 Summary"
      url: "https://esmis.nal.usda.gov/sites/default/release-files/795772/vegean26.pdf"
      description: "State-level asparagus area planted and harvested, yield, production, price, and value, 2023-2025"

