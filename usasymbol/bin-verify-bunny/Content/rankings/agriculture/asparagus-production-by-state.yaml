faq:
  - question: "Which state produces the most asparagus?"
    answer: "Michigan produces the most asparagus in the country, growing 273,000 cwt in 2025 on 7,800 harvested acres."

  - question: "How much asparagus does Washington produce?"
    answer: "Washington produced 136,000 cwt of asparagus in 2025. Its yield of 68.0 cwt per acre is the highest of any ranked state."

  - question: "Which state has the highest asparagus yield per acre?"
    answer: "Washington has the highest yield at 68.0 cwt per acre, nearly double Michigan's 35.0 cwt and New Jersey's 34.0 cwt."

  - question: "How much asparagus does New Jersey produce?"
    answer: "New Jersey produced 64,600 cwt in 2025. Growers there also received the highest price of the three states, $310.00 per cwt."

  - question: "Why doesn't California appear in asparagus production rankings?"
    answer: "California's 2023 asparagus figures were withheld to protect individual operations, and USDA discontinued separate state estimates for California starting in 2024."

  - question: "What is total US asparagus production?"
    answer: "US asparagus production totaled 473,600 cwt in 2025, up 3% from 461,800 cwt in 2024."

