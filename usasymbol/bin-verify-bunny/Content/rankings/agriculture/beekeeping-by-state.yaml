faq:
- question: Which state has the most honey bee colonies?
  answer: California had the most colonies on January 1, 2024, at 990,000, about 37% of the US total of 2,705,350.
- question: How many honey bee colonies are in Florida?
  answer: Florida had 310,000 colonies on January 1, 2024, the second-highest count of any state.
- question: Which state has the fewest honey bee colonies?
  answer: Maine had the fewest tracked colonies at 1,400, followed by Wyoming at 1,900.
- question: Why do some states have far more colonies in spring than in January?
  answer: Commercial beekeepers move hives across state lines for pollination contracts. Washington's count rises from 45,000 in January to 107,000 by spring, and Minnesota's more than triples from 25,000 to 85,000.
- question: How many honey bee colonies are in Texas?
  answer: Texas had 200,000 colonies on January 1, 2024, rising to a maximum of 290,000 in the first quarter.
- question: How many honey bee colonies are there in the United States?
  answer: The United States had 2,705,350 honey bee colonies on January 1, 2024, in operations with five or more colonies.
