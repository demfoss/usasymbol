page:
  h1: Beekeeping by State
  quick_answer:
  - California had 990,000 honey bee colonies on January 1, 2024, more than any other state and about 37% of the 2,705,350 US total.
  - Florida ranked second with 310,000 colonies, and Idaho ranked third with 195,000, well ahead of Texas's 200,000 colonies counted the same day.
  - Wyoming had the fewest tracked colonies at 1,900, and colony counts nationwide can rise sharply by spring as operations move hives across state lines for almond pollination.
  methodology: Colony counts cover operations with five or more colonies as of January 1, 2024, from USDA NASS's Honey Bee Colonies report. A separate "maximum colonies" figure reflects the highest count reported for each state in the January-March 2024 quarter, capturing migratory beekeeping operations.
