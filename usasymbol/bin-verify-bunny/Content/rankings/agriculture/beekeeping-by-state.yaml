sections:
- id: why-california-leads-beekeeping
  icon: fa-solid fa-bee
  title: Why California Leads in Honey Bee Colonies
  paragraphs:
  - California's 990,000 colonies on January 1, 2024, about 37% of the 2,705,350 US total, reflect the state's role as the winter and bloom-season base for the almond pollination industry. Bearing almond acreage in California exceeds 1.4 million acres, and most commercial hives in the country are trucked there each February to pollinate the bloom.
  - The gap between January and spring counts shows the same pattern nationally. Washington's colonies climb from 45,000 to 107,000, and Minnesota's more than triple from 25,000 to 85,000, as beekeepers move hives for spring pollination contracts before returning them home for summer honey production.
