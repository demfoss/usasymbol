faq:
- question: Which states produce avocados commercially?
  answer: 'USDA tracks commercial avocado production in only three states: California, Florida, and Hawaii.
    Together they produced 185,700 tons of utilized avocados in 2025.'
- question: Which state produces the most avocados?
  answer: California produces the most avocados at 171,000 tons of utilized production in 2025, 92.08%
    of the national total.
- question: How many avocados does Florida produce?
  answer: Florida produced 14,300 tons of utilized avocados in 2025, 7.70% of the national total.
- question: Does Hawaii grow avocados commercially?
  answer: Hawaii produced 440 tons of utilized avocados in 2025, the smallest of the three producing states
    and just 0.24% of the national total.
- question: Why do only California, Florida, and Hawaii grow avocados?
  answer: USDA NASS tracks commercial production in these three states because they have the climate,
    soil, and agricultural infrastructure suited to avocado cultivation.
- question: How much avocado does the US produce?
  answer: US avocado production totaled 185,700 tons in 2025. California produced 171,000 tons, Florida
    produced 14,300 tons, and Hawaii produced 440 tons.
