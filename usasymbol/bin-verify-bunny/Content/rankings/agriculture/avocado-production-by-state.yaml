page:
  h1: Avocado Production by State
  quick_answer:
  - California produces the most avocados in the US at 171,000 tons in 2025, 92.08% of the three-state
    national total of 185,700 tons.
  - Florida ranks second at 14,300 tons in 2025, well behind California's 171,000 tons but still 7.70%
    of the national total.
  - Hawaii produces the least at 440 tons in 2025, just 0.24% of the national total and 32.5 times smaller
    than Florida's output.
  methodology: Avocado production reflects 2025 crop year data from USDA NASS QuickStats, which tracks
    commercial production in California, Florida, and Hawaii only.
