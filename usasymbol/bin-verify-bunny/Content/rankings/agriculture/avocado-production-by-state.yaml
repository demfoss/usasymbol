sections:
- id: why-only-three-states-grow-avocados
  icon: fa-solid fa-tree
  title: Why Only Three States Grow Avocados
  paragraphs:
  - USDA NASS tracks commercial avocado production in California, Florida, and Hawaii only, the three
    states with the climate, soil, and agricultural infrastructure suited to avocado cultivation. California
    grows 171,000 tons a year, 92.08% of the national total, while Florida produces 14,300 tons and Hawaii
    adds 440 tons.
