page:
  h1: Average Age of Farmers by State
  quick_answer:
  - Hawaii's farm producers averaged 60.8 years old in 2022, the oldest of any state and above the US average
    of 58.1.
  - Pennsylvania's producers averaged 55.4 years old, the youngest of any state and 5.4 years below Hawaii.
  - California and Texas tied at 59.9 years old, both older than the national average and close behind Mississippi's
    59.6.
  methodology: Average age of principal producer figures are from USDA NASS's 2022 Census of Agriculture,
    conducted every five years and covering all farm operations with $1,000 or more in agricultural sales.
  sources:
