faq:
- question: Which state has the oldest farmers?
  answer: Hawaii has the oldest farmers, averaging 60.8 years old in the 2022 Census of Agriculture, above
    the national average of 58.1.
- question: Which state has the youngest farmers?
  answer: Pennsylvania has the youngest farmers, averaging 55.4 years old in 2022, 5.4 years below Hawaii's
    figure.
- question: What is the average age of farmers in California?
  answer: California's farmers averaged 59.9 years old in 2022, tied with Texas for the second-oldest figure
    among states with published data.
- question: Why are Hawaii's farmers older than average?
  answer: 44% of Hawaii's farmers were over 65 in 2022, and only 6% were under 35. That age distribution
    pushed the state's average to 60.8 years, the highest in the nation.
- question: What is the national average age of farmers?
  answer: The average age of all US farm producers was 58.1 years in 2022, up 0.6 years from 2017.
