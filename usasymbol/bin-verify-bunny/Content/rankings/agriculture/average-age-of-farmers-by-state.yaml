sections:
- id: why-hawaii-has-the-oldest-farmers
  icon: fa-solid fa-user-clock
  title: Why Hawaii Has the Oldest Farmers
  paragraphs:
  - Hawaii's farm producers averaged 60.8 years old in 2022, and 44% of them were over 65. Just 6% were
    under 35, a share far below what would be needed to bring the state's average closer to the national
    figure of 58.1.
  - Midwest states cluster at the younger end of the list. Iowa averaged 57.6, Nebraska 56.9, Wisconsin
    56.7, and Idaho 56.6, all below the national average and well under Hawaii's figure.
