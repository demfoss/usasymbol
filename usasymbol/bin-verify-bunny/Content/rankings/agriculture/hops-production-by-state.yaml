    paragraphs:
      - "Washington's 62,053,200 pounds comes mostly from the Yakima Valley, where fertile soils and established hop yards support large-scale cultivation. Idaho's 10,676,400 pounds and Oregon's 9,373,800 pounds both come from smaller Pacific Northwest growing regions with similar conditions."

