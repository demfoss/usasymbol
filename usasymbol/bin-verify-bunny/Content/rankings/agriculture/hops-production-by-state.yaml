faq:
  - question: "Which state produces the most hops?"
    answer: "Washington produces the most hops at 62,053,200 pounds a year, about 76% of the US total."

  - question: "Which state ranks second in hops production?"
    answer: "Idaho ranks second at 10,676,400 pounds, just ahead of Oregon's 9,373,800 pounds."

  - question: "How many states produce hops commercially?"
    answer: "Three states report commercial hops production to USDA: Washington, Idaho, and Oregon, totaling 82,103,400 pounds a year."

  - question: "Where in Washington are hops grown?"
    answer: "Washington's hop production is centered in the Yakima Valley, the state's main hop-growing region."

