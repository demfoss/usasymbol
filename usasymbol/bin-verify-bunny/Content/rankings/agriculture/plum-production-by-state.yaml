page:
  h1: Plum Production by State
  quick_answer:
  - California is the only state with published commercial plum production, growing 83,480 tons in 2025.
  - USDA NASS does not publish state-level plum figures for any other state, meaning California accounts
    for all recorded utilized plum production in the country.
  methodology: Production figures are from the USDA NASS Noncitrus Fruits and Nuts 2025 Summary, released
    May 2026. California is the only state with published state-level plum data for the 2025 crop year.
