faq:
- question: Which state produces the most plums?
  answer: California produces the most plums in the country, and it is the only state with published commercial
    plum production, at 83,480 tons in 2025.
- question: Do any other states grow plums commercially?
  answer: USDA NASS does not publish state-level plum production figures for any state other than California.
- question: How many tons of plums does California produce?
  answer: California produced 83,480 tons of utilized plums in 2025.
- question: What crop year does the plum production data reflect?
  answer: The figures reflect the 2025 crop year, published in the USDA NASS Noncitrus Fruits and Nuts
    2025 Summary.
