page:
  h1: "Orange Production by State"

  quick_answer:
    - "California produces the most oranges in the country at 45.5 million boxes, 77.91% of the U.S. total of 58.4 million boxes."
    - "Florida ranks second at 12 million boxes, 20.55% of the U.S. total, less than a third of California's output."
    - "Texas produces the least among the 3 listed states at 900,000 boxes, just 1.54% of the U.S. total."

  methodology: "Production figures reflect 2025 USDA data reported by World Population Review, in boxes, covering the 3 states with recorded commercial orange output."

  sources:
