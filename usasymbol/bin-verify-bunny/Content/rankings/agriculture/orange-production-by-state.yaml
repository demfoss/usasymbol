faq:
  - question: "Which state produces the most oranges?"
    answer: "California produces the most oranges in the country at 45.5 million boxes, 77.91% of the U.S. total."

  - question: "Which state produces the least oranges?"
    answer: "Texas produces the least among the 3 listed states at 900,000 boxes."

  - question: "How much does Florida produce compared to California?"
    answer: "Florida produces 12 million boxes, about 33.5 million boxes behind California's 45.5 million."

  - question: "How many states produce oranges commercially?"
    answer: "Only three states report commercial orange production: California, Florida, and Texas."

  - question: "What is the total U.S. orange production among listed states?"
    answer: "The three producing states combined for 58.4 million boxes of oranges."

