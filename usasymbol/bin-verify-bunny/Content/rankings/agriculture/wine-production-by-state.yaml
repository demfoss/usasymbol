faq:
- question: Which state produces the most wine?
  answer: California produces the most wine at 609,607,342 gallons a year, about 82% of the tracked total.
- question: Which state produces the least wine?
  answer: Nevada produces the least among the tracked states at 1,526 gallons, far below Mississippi's 17,577 gallons.
- question: Which state ranks second in wine production?
  answer: New York ranks second at 33,084,702 gallons, ahead of Washington's 32,373,972 gallons.
- question: How many states are tracked for wine production?
  answer: TTB reports wine production for 47 states, since some smaller totals are withheld to protect individual taxpayer data.
- question: How much wine does Texas produce?
  answer: Texas produces 3,281,365 gallons of wine a year, ranking ninth among the tracked states.
