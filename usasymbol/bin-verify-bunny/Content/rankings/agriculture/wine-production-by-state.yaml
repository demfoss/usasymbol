page:
  h1: Wine Production by State
  quick_answer:
  - California produces the most wine at 609,607,342 gallons a year, about 82% of the tracked 47-state total.
  - New York ranks second at 33,084,702 gallons, ahead of Washington's 32,373,972 gallons in third.
  - Nevada produces the least among the tracked states at 1,526 gallons, far below Mississippi's 17,577 gallons.
  methodology: Production figures reflect federal Report of Wine Premises Operations data compiled by the Alcohol and Tobacco Tax and Trade Bureau (TTB) and reported by World Population Review, measured in gallons. Some state totals are withheld by TTB when they could identify an individual taxpayer, so 47 states are shown.
  sources:
