faq:
- question: Which state produces the most catfish?
  answer: Mississippi produces the most catfish by far, with $213.73 million in sales in 2025 and 194.3
    million pounds sold. It supplies more than half of the nation's food-size catfish.
- question: How much catfish does Alabama produce?
  answer: Alabama sold 97.5 million pounds of catfish in 2025 for $99.45 million, ranking second nationally
    behind Mississippi.
- question: What is catfish production in Arkansas?
  answer: Arkansas sold 15.9 million pounds of catfish in 2025 worth $19.88 million, the third-highest sales
    value among the four reporting states.
- question: Why does Mississippi have the most catfish farms?
  answer: Mississippi's Delta has clay-rich soil that holds water well and a warm climate that suits pond
    aquaculture. Growers there began farming catfish commercially around 1965.
- question: Which state has the highest catfish prices?
  answer: Arkansas averaged $1.25 per pound in 2025, higher than Mississippi's $1.10 and Alabama's $1.02.
- question: Does Texas produce commercial catfish?
  answer: Texas reported $19.31 million in catfish sales in 2025 on 1,600 water surface acres, close behind
    Arkansas. USDA withholds its pounds sold and price per pound to protect individual operations.
