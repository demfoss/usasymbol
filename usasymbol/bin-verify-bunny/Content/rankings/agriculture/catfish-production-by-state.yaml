page:
  h1: Catfish Production by State
  quick_answer:
  - Mississippi led US catfish production in 2025 with $213.73 million in sales, more than double Alabama's
    $99.45 million, the second-highest state.
  - Alabama ranked second at $99.45 million, followed by Arkansas at $19.88 million and Texas at $19.31
    million, four states that account for nearly all US catfish sales.
  - Arkansas posted the highest average price at $1.25 per pound, above Mississippi's $1.10 and Alabama's
    $1.02 per pound.
  methodology: Sales, pounds, price, and water surface acreage figures are from USDA NASS's Catfish Production
    report (February 2026), covering the 2025 calendar year for the four states with statistically tracked
    commercial catfish sales.
  sources:
  - name: USDA NASS. Catfish Production
    url: https://esmis.nal.usda.gov/sites/default/release-files/795763/cfpd0226.pdf
    description: State-level water surface acres, foodsize fish sold, pounds sold, sales value, and average
      price per pound for Mississippi, Alabama, Arkansas, and Texas, 2025
