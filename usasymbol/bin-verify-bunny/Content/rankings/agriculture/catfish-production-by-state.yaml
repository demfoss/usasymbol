sections:
- id: why-mississippi-leads-catfish-production
  icon: fa-solid fa-water
  title: Why Mississippi Leads US Catfish Production
  paragraphs:
  - Mississippi's Delta region has clay-rich soils that hold water well, a trait that makes the flat land
    suited to the shallow ponds catfish farming requires. Warm temperatures extend the growing season across
    the region's 29,900 water surface acres, the most of any state on record.
  - Commercial catfish farming in Mississippi dates to around 1965, when growers turned to fish as an alternative
    crop for marginal farmland. That head start helped the state build the $213.73 million industry it
    reported in 2025, more than the other three producing states combined.
- id: catfish-price-per-pound-by-state
  icon: fa-solid fa-money-bill
  title: Catfish Price per Pound by State
  paragraphs:
  - Arkansas growers received the highest average price in 2025 at $1.25 per pound, despite ranking third
    in total sales value at $19.88 million. Mississippi's price averaged $1.10 per pound and Alabama's averaged
    $1.02, the lowest of the three states with published price data.
