faq:
- question: Which state produces the most cabbage?
  answer: California produces the most cabbage at 5,642,000 CWT, 25.65% of the US total.
- question: Which state produces the least cabbage?
  answer: North Carolina produces the least cabbage among the tracked states at 994,000 CWT.
- question: How many states grow cabbage commercially?
  answer: USDA NASS reports commercial cabbage production for nine states, led by California, New York,
    and Wisconsin.
- question: How much cabbage does New York produce?
  answer: New York produces 3,010,000 CWT of cabbage, 13.68% of the US total and the second-highest figure
    in the table.
- question: What is the cabbage production in Wisconsin?
  answer: Wisconsin produces 2,816,000 CWT of cabbage, ranking third nationally.
