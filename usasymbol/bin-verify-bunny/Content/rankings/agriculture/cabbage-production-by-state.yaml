page:
  h1: Cabbage Production by State
  quick_answer:
  - California produces the most cabbage in the country at 5,642,000 CWT, 25.65% of the US total.
  - Nine states report commercial cabbage production, led by California, New York at 3,010,000 CWT, and
    Wisconsin at 2,816,000 CWT.
  - North Carolina produces the least cabbage among the tracked states at 994,000 CWT, less than a fifth
    of California's total.
  methodology: Production figures are 2024 crop year data on record with USDA NASS, measured in CWT (hundredweight,
    100 pounds). Only states with reportable commercial cabbage acreage are included.
  sources:
  - name: USDA NASS. Vegetables 2024 Summary
    url: https://www.nass.usda.gov/Publications/Todays_Reports/reports/vegean25.pdf
    description: State-by-state cabbage production, 2024 crop year
