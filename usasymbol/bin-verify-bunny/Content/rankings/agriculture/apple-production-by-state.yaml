page:
  h1: Apple Production by State
  quick_answer:
  - Washington produced 7,163.0 million pounds of apples in 2025, the most of any state and 66.8% of the
    seven-state US total.
  - New York ranks second at 1,493.5 million pounds, ahead of Michigan's 1,064.0 million pounds, though
    Michigan apples sold for $0.303 per pound, the highest price in the table.
  - Virginia has the smallest apple crop among the seven states tracked, at 148.8 million pounds from
    9,600 bearing acres, just behind Oregon's 158.2 million pounds.
  methodology: Bearing acreage, production, price, and value are 2025 crop year figures from the USDA
    NASS Noncitrus Fruits and Nuts 2025 Summary, the only report with state-level data for the seven states
    USDA tracks for commercial apple production.
  sources:
  - name: USDA NASS. Noncitrus Fruits and Nuts 2025 Summary
