sections:
- id: why-washington-leads-apple-production
  icon: fa-solid fa-tree
  title: Why Washington Leads Apple Production
  paragraphs:
  - Washington has 171,000 bearing acres of apple trees, 57.6% of the seven states' combined 296,900 acres.
    That acreage, paired with the highest yield in the table at 44,100 pounds per acre, drives the state's
    7,163.0 million pounds of utilized production in 2025.
  - The other six states combined for 3,555.5 million pounds. New York is the closest competitor at 1,493.5
    million pounds, less than a quarter of Washington's total.
