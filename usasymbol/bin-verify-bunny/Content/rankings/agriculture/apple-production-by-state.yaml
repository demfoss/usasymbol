- id: apple-prices-by-state
  icon: fa-solid fa-tag
  title: Apple Prices by State
  paragraphs:
  - Michigan apples brought $0.303 per pound in 2025, the highest price among the seven states, ahead
    of Virginia's $0.299 and Oregon's $0.295. Washington, the top producer, sold for $0.263 per pound,
    close to the seven-state average.
  - New York had the lowest price at $0.236 per pound, despite ranking second in production at 1,493.5
    million pounds. Pennsylvania's price was $0.240 per pound.
