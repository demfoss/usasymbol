faq:
- question: Which state produces the most apples?
  answer: Washington produces the most apples at 7,163.0 million pounds of utilized production in 2025,
    66.8% of the seven-state total.
- question: Which state produces the fewest apples?
  answer: Virginia produced the fewest apples among the seven states tracked, at 148.8 million pounds
    in 2025, just behind Oregon's 158.2 million pounds.
- question: Why does Washington produce more apples than other states?
  answer: Washington has 171,000 bearing acres, more than the other six states combined, and the highest
    yield per acre at 44,100 pounds. Together those two factors drive its production lead.
- question: Which state has the highest apple prices?
  answer: Michigan had the highest average price at $0.303 per pound in 2025, ahead of Virginia at $0.299
    per pound and Oregon at $0.295 per pound.
- question: How many apples does Michigan produce?
  answer: Michigan produced 1,064.0 million pounds of apples in 2025, third most among the seven tracked
    states, from 37,000 bearing acres.
- question: What states grow apples commercially in the US?
  answer: 'USDA NASS tracks state-level commercial apple production for seven states: Washington, New
    York, Michigan, Pennsylvania, California, Oregon, and Virginia.'
