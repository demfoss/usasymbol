  title: States With the Most Yogurt Production
  paragraphs:
  - New York's 1,141,426,000 pounds is about five times California's 226,346,000 pounds. Together the two states produce 1,367,772,000 pounds a year, and no other state is tracked for yogurt production at this scale.
faq:
- question: Which state produces the most yogurt?
  answer: New York produces the most yogurt at 1,141,426,000 pounds a year, about 83% of the two-state total.
- question: How much yogurt does California produce?
  answer: California produces 226,346,000 pounds of yogurt a year, about a fifth of New York's total.
- question: How many states are tracked for yogurt production?
  answer: 'USDA NASS tracks two states for large-scale yogurt production: New York and California, totaling 1,367,772,000 pounds a year.'
- question: What is the combined yogurt total for New York and California?
  answer: New York and California together produce 1,367,772,000 pounds of yogurt a year, the only two states USDA tracks for large-scale production.
