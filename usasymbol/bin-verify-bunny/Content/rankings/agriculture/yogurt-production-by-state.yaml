page:
  h1: Yogurt Production by State
  quick_answer:
  - New York produces the most yogurt at 1,141,426,000 pounds a year, about five times California's 226,346,000 pounds.
  - New York accounts for about 83% of the two-state total of 1,367,772,000 pounds.
  - New York and California are the two states tracked for large-scale yogurt production by USDA.
  methodology: Production figures reflect 2025 USDA NASS dairy data reported by World Population Review, measured in pounds. New York and California are the two states tracked for yogurt production.
