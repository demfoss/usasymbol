faq:
- question: Which state produces the most walnuts?
  answer: California is the only state with commercial walnut production tracked by USDA, harvesting 809,000 tons a year.
- question: Do any other states grow walnuts commercially?
  answer: No other state reports commercial walnut acreage in USDA production data.
- question: How many walnuts does California produce?
  answer: California produces 809,000 tons of walnuts annually, over 99% of the tracked US total.
- question: What year is California's walnut production figure from?
  answer: California's 809,000-ton total reflects 2025 USDA NASS data, the year covering over 99% of US walnut production.
