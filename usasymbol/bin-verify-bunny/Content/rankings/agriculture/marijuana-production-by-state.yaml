page:
  h1: "Marijuana Production by State"

  quick_answer:
    - "Colorado produces the most legal cannabis in the country at 623 metric tons, narrowly ahead of Oregon's 614 metric tons."
    - "Oregon (614 metric tons) and California (577 metric tons) trail Colorado combined by less than 50 metric tons, while Washington ranks fourth at 317 metric tons."
    - "Vermont produces the least among the 15 states with recorded legal production at 3 metric tons, about 200 times less than Colorado's total."

  methodology: "Figures reflect legal, licensed cannabis cultivation only for 2022, the most recent year with comparable state-by-state figures. The data covers 15 states with legal adult-use or medical markets that publish production totals; it excludes unauthorized cultivation and is described by the original report as an estimate rather than an audited figure."

  sources:
    - name: "Leafly. Cannabis Harvest Report 2022"
      url: "https://www.leafly.com/news/industry/how-much-weed-grown-us-2022"
      description: "State-by-state legal cannabis production estimates, 2022, produced with Whitney Economics"

