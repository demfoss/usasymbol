page:
  h1: "Planting Zones by State"

  quick_answer:
    - "Alaska has the widest planting zone range of any state, spanning from zone 1a to zone 8b, a difference of 7.5 half-zone steps."
    - "Hawaii has the warmest coldest-zone floor in the country at 9a, with some areas reaching as warm as zone 13a."
    - "Delaware spans only a single zone, 7, the narrowest range of any state in the table."

  methodology: "Planting zones are based on the USDA Plant Hardiness Zone Map, which divides the country into 10-degree Fahrenheit average annual minimum temperature bands, split further into half-zone \"a\" and \"b\" increments."

  sources:
    - name: "USDA Agricultural Research Service. Plant Hardiness Zone Map"
      url: "https://planthardiness.ars.usda.gov/"
      description: "Official USDA planting zone map showing average annual minimum temperature bands by location"

