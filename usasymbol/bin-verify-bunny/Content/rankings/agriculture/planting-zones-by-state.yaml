    icon: "fa-solid fa-sun"
    title: "States With the Warmest Planting Zones"
    paragraphs:
      - "Hawaii has the warmest zone floor of any state at 9a, and its warmest areas reach zone 13a. Florida and Louisiana both start at zone 8a, with Florida reaching as warm as 11a."
    table:
      columns:
        state: "State"
        warmest_zone: "Warmest Zone"
