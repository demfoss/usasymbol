faq:
  - question: "What planting zone is my state in?"
    answer: "Zones vary within most states. Check the table above for each state's coldest and warmest USDA hardiness zone, from Alaska's 1a low to Hawaii's 13a high."

  - question: "Which state has the coldest planting zone?"
    answer: "Alaska has the coldest planting zone floor at 1a, colder than any other state in the table."

  - question: "Which state has the warmest planting zone?"
    answer: "Hawaii has the warmest planting zone, reaching 13a in some areas, the highest zone number of any state."

  - question: "Which state has the widest range of planting zones?"
    answer: "Alaska spans the widest range, from zone 1a to zone 8b. Arizona and Nevada follow, each spanning 6 full zones."

  - question: "Which state has the narrowest range of planting zones?"
    answer: "Delaware has the narrowest range, falling entirely within zone 7."

  - question: "What planting zone is Texas in?"
    answer: "Texas spans zone 6b in its coldest areas to zone 10a in its warmest, a range of 3.5 zones."

