    paragraphs:
      - "Alaska has the coldest zone floor in the country at 1a, with its warmest areas only reaching zone 8b. North Dakota is the coldest state outside Alaska, starting at zone 2b. Minnesota, Montana, and Wyoming all start at zone 3a."
