page:
  h1: Wool Production by State
  quick_answer:
  - California produced 2.4 million pounds of shorn wool in 2024, more than any other state, valued at
    $3.36 million.
  - Wyoming ranked second at 2.18 million pounds, and Utah third at 2.13 million pounds, both priced
    higher per pound than California at $2.20 and $1.70.
  - US shorn wool production totaled 22.48 million pounds in 2024, down 1% from 2023, as the average
    price fell from $1.56 to $1.43 per pound.
  methodology: Figures are from USDA NASS's Sheep and Goats report (January 31, 2025), wool production,
    price, and value by state for the 2024 calendar year. Production is shorn wool from sheep and lambs,
    including commercial feeding yards.
  sources:
