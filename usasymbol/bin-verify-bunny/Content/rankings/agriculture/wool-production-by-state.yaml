faq:
- question: Which state produces the most wool?
  answer: California produces the most wool at 2.4 million pounds in 2024, valued at $3.36 million.
- question: What is the total US wool production?
  answer: US shorn wool production totaled 22.48 million pounds in 2024, down 1% from 22.74 million pounds
    in 2023.
- question: Which state has the most valuable wool crop?
  answer: Wyoming's wool crop was worth $4.80 million in 2024, the highest of any state, even though
    its production of 2.18 million pounds ranks second behind California.
- question: What is the average price of wool by state?
  answer: Wyoming and Nevada paid the highest 2024 price at $2.20 per pound, while Iowa paid the lowest
    at just $0.18 per pound.
- question: How does wool production differ from sheep counts by state?
  answer: Wool production measures pounds of fleece shorn each year, while sheep inventory counts live
    animals. California ranks first in wool production at 2.4 million pounds despite not leading every
    state in total sheep numbers.
