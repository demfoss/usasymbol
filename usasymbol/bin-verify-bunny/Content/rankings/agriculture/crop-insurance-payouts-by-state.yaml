  title: States With the Lowest Crop Insurance Payouts
  paragraphs:
  - Rhode Island recorded just $1,153 in crop insurance indemnity payments for 2024, the lowest of any
    state with a payout on record. Alaska recorded zero. New Hampshire, Maine, and Connecticut also ranked
    among the lowest, each under $1.5 million.
