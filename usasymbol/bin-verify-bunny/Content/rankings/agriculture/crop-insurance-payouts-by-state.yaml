page:
  h1: Crop Insurance Payouts by State
  quick_answer:
  - Texas farmers collected $1.25 billion in federal crop insurance indemnity payments for the 2024 crop
    year, more than any other state.
  - Kansas ranked second at $652.1 million and Minnesota third at $609.5 million, together far behind
    Texas's total.
  - Total US crop insurance indemnity payments reached $8.56 billion for the 2024 crop year, with Texas
    alone accounting for 15% of the national total.
  methodology: Figures are from the USDA Risk Management Agency's county-level indemnity data for the
    2024 crop year, as reported December 16, 2024, summed to the state level. Totals reflect indemnities
    paid to date and are subject to revision as claims continue processing.
  sources:
