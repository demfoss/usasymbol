sections:
- id: why-california-grows-nearly-all-us-artichokes
  icon: fa-solid fa-seedling
  title: Why California Grows Nearly All US Artichokes
  paragraphs:
  - California grows all of the country's commercial artichokes, a dominance tied to the cool, moist coastal
    climate and well-drained clay loam soil of its Central Coast. The northern tip of that region holds
    84% of the state's artichoke acreage, and USDA NASS credits California with 100% of US commercial
    production.
  - Monterey County accounts for 80% of California's crop, and Castroville alone grows close to 70% of
    the state's total supply. The industry traces back to the perennial Green Globe variety, first grown
    commercially in San Mateo County before expanding south into Santa Cruz County and the Salinas Valley.
- id: artichoke-production-by-california-region
  icon: fa-solid fa-map-location-dot
  title: Artichoke Production by California Region
  paragraphs:
  - Monterey County grew 3,070 acres of annual artichokes during the 2022-2023 season, the largest total
    in the state. Santa Cruz County added another 150 acres of annual production in the same season.
  - Riverside and Imperial counties, in the desert growing region, planted about 1,035 acres, harvested
    as early as December. Santa Barbara and Ventura counties, along the South Coast, grew about 585 acres,
    harvested each spring from March through May.
  - Perennial artichoke acreage fell from 7,632 acres in 1988 to about 200 acres by 2023, as growers shifted
    to higher-yielding annual varieties across these same counties.
  table:
    columns:
      region: Region
      acres: Acreage (2022-2023)
    rows:
    - region: Monterey County
      acres: 3,070 acres
    - region: Riverside & Imperial Counties (Desert)
      acres: 1,035 acres
    - region: Santa Barbara & Ventura Counties (South Coast)
      acres: 585 acres
    - region: Santa Cruz County
      acres: 150 acres
- id: california-artichoke-price-and-value-trends
  icon: fa-solid fa-chart-line
  title: California Artichoke Price and Value Trends
  paragraphs:
  - California's artichoke crop was worth $86,583,000 in 2025, up 28% from $67,872,000 in 2024, even though
    production fell 3% to 651,000 hundredweight from 672,000 hundredweight. The price per hundredweight
    climbed to $133.00 in 2025 from $101.00 in 2024 and $83.00 in 2023.
  - Acreage held steady at 4,200 acres in both 2024 and 2025, down from 4,300 acres in 2023 and 4,900
    acres in 2022. Yield per acre fell to 155.0 hundredweight in 2025 from 160.0 hundredweight in 2024.
  table:
