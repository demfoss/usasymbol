page:
  h1: Artichoke Production by State
  quick_answer:
  - California grows nearly all commercial artichokes in the United States, producing 651,000 hundredweight
    in 2025 on 4,200 acres, according to USDA NASS.
  - California's artichoke crop was worth $86,583,000 in 2025, up 28% from $67,872,000 in 2024, even as
    production fell 3% from 672,000 to 651,000 hundredweight.
  - Monterey County produces 80% of California's artichoke crop, and Castroville, the self-proclaimed
    Artichoke Capital of the World, grows close to 70% of the state's total supply.
  methodology: Acreage, yield, price, and value figures reflect USDA NASS Vegetables Summary reports covering
    the 2022-2025 crop years. Regional acreage and county-level production share come from a 2025 crop
    profile for artichokes in California.
  sources:
  - name: USDA NASS. Vegetables 2025 Summary (February 2026)
    url: https://esmis.nal.usda.gov/sites/default/release-files/795772/vegean26.pdf
    description: California artichoke acreage, yield, production, price, and value, 2023-2025 crop years
