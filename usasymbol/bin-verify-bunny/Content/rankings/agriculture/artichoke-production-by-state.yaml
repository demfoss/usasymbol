faq:
- question: Which state grows the most artichokes?
  answer: California grows all of the country's commercial artichokes. USDA tracks no other state for
    commercial artichoke acreage.
- question: How many acres of artichokes does California have?
  answer: California had 4,200 acres of artichokes in production in 2025, unchanged from 2024 and down
    from 4,300 acres in 2023.
- question: What percent of US artichokes come from California?
  answer: California accounts for 100% of the country's commercial artichoke production, according to
    USDA NASS.
- question: Which California county grows the most artichokes?
  answer: Monterey County grows 80% of California's artichoke crop, including 3,070 acres of annual production
    in the 2022-2023 season. Castroville, within Monterey County, grows close to 70% of the state's total
    supply.
- question: What is the value of California's artichoke crop?
  answer: California's artichoke crop was worth $86,583,000 in 2025, a 28% increase from $67,872,000 in
    2024, on a harvest of 651,000 hundredweight sold at $133.00 per hundredweight.
- question: How has California's artichoke acreage changed over time?
  answer: California's artichoke acreage fell from 4,900 acres in 2022 to 4,200 acres in 2025. Perennial
    plantings alone dropped from 7,632 acres in 1988 to about 200 acres by 2023.
