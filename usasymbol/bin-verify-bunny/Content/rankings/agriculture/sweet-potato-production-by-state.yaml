page:
  h1: Sweet Potato Production by State
  quick_answer:
  - North Carolina produces the most sweet potatoes at 18,860,000 CWT a year, more than three times California's 5,996,500 CWT.
  - California ranks second at 5,996,500 CWT, narrowly ahead of Mississippi's 4,712,500 CWT in third.
  - 'Only three states report commercial sweet potato production to USDA: North Carolina, California, and Mississippi.'
  methodology: Production figures reflect 2025 USDA NASS sweet potato data reported by World Population Review, measured in hundredweight (CWT). Only three states report commercial sweet potato production to USDA.
