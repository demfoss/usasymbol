  title: States With the Most Sweet Potato Production
  paragraphs:
  - North Carolina's 18,860,000 CWT leads the country by a wide margin, well ahead of California's 5,996,500 CWT and Mississippi's 4,712,500 CWT. The three states combine for 29,569,000 CWT, and no other state reports commercial sweet potato acreage to USDA.
faq:
- question: Which state produces the most sweet potatoes?
  answer: North Carolina produces the most sweet potatoes at 18,860,000 CWT a year, about 64% of the three-state total.
- question: Which state ranks second in sweet potato production?
  answer: California ranks second at 5,996,500 CWT, ahead of Mississippi's 4,712,500 CWT.
- question: How many states grow sweet potatoes commercially?
  answer: 'Three states report commercial sweet potato production to USDA: North Carolina, California, and Mississippi, totaling 29,569,000 CWT a year.'
- question: How much does Mississippi produce in sweet potatoes?
  answer: Mississippi produces 4,712,500 CWT of sweet potatoes a year, the smallest total among the three producing states.
