faq:
  - question: "What is the best state to own a ranch?"
    answer: "New Mexico ranks first by cost, with pastureland averaging $630 per acre and an overall farm real estate value of $725 per acre, both the lowest of the ten states compared."

  - question: "Which state has the most expensive ranch land?"
    answer: "Idaho has the highest pasture value at $2,400 per acre and the highest farm real estate value at $4,580 per acre in the comparison."

  - question: "Which state has the most cattle?"
    answer: "Texas has the most cattle at 12,100,000 head, more than double Nebraska's 6,050,000, the second-highest total in the table."

  - question: "How much does pastureland cost in Texas?"
    answer: "Texas pastureland averages $2,300 per acre, ranking ninth of the ten states compared, well above New Mexico's $630."

  - question: "Is Wyoming a good state for ranching?"
    answer: "Wyoming has the second-cheapest pastureland at $755 per acre and a farm real estate value of $1,000 per acre. Its cattle inventory of 1,220,000 head is the lowest of the ten states in the table."

  - question: "Why does New Mexico have the cheapest ranch land?"
    answer: "New Mexico's pasture value of $630 per acre and farm real estate value of $725 per acre are both the lowest in the table, with Wyoming the only other state under $1,000 per acre overall."

