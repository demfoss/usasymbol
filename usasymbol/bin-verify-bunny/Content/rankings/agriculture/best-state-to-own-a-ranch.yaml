page:
  h1: "Best State to Own a Ranch"

  quick_answer:
    - "New Mexico is the best state to own a ranch by cost, with pastureland averaging $630 per acre, the lowest of ten major ranching states compared."
    - "Idaho has the priciest pastureland in the comparison at $2,400 per acre, nearly four times New Mexico's $630, and Wyoming is the next-cheapest state at $755 per acre."
    - "Texas carries the largest cattle inventory of the ten states at 12,100,000 head, exactly double Nebraska's 6,050,000, even though Texas pastureland costs $2,300 per acre."

  methodology: "Pasture and farm real estate values per acre are from the USDA NASS Land Values 2025 Summary, released August 2025. Cattle inventory figures are USDA NASS January 1, 2025 estimates. Ranking covers ten states with major ranching activity, sorted by pasture value per acre from lowest to highest."

  sources:
    - name: "USDA NASS. Land Values 2025 Summary"
      url: "https://www.nass.usda.gov/Publications/Todays_Reports/reports/land0825.pdf"
      description: "State-level farm real estate, cropland, and pasture values per acre, released August 2025"
    - name: "USDA NASS. Cattle (January 1, 2026 report, includes revised 2025 estimates)"
      url: "https://www.nass.usda.gov/Newsroom/2026/01-30-2026.php"
      description: "State-level all cattle and calves inventory, including revised January 1, 2025 figures"

