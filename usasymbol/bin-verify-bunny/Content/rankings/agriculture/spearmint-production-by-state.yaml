faq:
  - question: "Which state produces the most spearmint?"
    answer: "Washington produces the most spearmint in the country at 1,029,000 pounds, 65.3% of the four-state total."

  - question: "Which state produces the least spearmint?"
    answer: "Idaho produces the least among the four ranked states at an estimated 98,000 pounds."

  - question: "Why does Washington produce the most spearmint?"
    answer: "Washington's climate and growing conditions favor spearmint cultivation, a factor it shares with Oregon, the second-ranked state at an estimated 299,000 pounds."

  - question: "How many states grow spearmint commercially?"
    answer: "Four states report spearmint production: Washington, Oregon, Indiana, and Idaho."

  - question: "How much spearmint does Indiana produce?"
    answer: "Indiana produces 150,000 pounds of spearmint, the third-most of the four ranked states."

