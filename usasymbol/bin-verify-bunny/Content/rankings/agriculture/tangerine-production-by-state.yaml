sections:
- id: states-with-the-most-tangerine-production
  icon: fa-solid fa-seedling
  title: States With the Most Tangerine Production
  paragraphs:
  - California's 1,080,000 tons dwarfs Florida's 19,000 tons, a gap of 56 times. Together the two states produce 1,099,000 tons a year, and no other state reports commercial tangerine acreage to USDA.
faq:
- question: Which state produces the most tangerines?
  answer: California produces the most tangerines at 1,080,000 tons a year, about 98% of the two-state total.
- question: How many tangerines does Florida produce?
  answer: Florida produces 19,000 tons of tangerines a year, far behind California's 1,080,000 tons.
- question: How many states grow tangerines commercially?
  answer: 'Two states report commercial tangerine production to USDA: California and Florida, totaling 1,099,000 tons a year.'
- question: What is the combined US tangerine total?
  answer: California and Florida together produce 1,099,000 tons of tangerines a year, with California responsible for about 98% of that total.
