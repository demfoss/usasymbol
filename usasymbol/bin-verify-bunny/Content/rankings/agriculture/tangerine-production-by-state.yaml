page:
  h1: Tangerine Production by State
  quick_answer:
  - California produces the most tangerines at 1,080,000 tons a year, 56 times Florida's 19,000 tons.
  - California accounts for about 98% of the two-state total of 1,099,000 tons.
  - Only California and Florida report commercial tangerine and mandarin production to USDA.
  methodology: Production figures reflect 2025/26 USDA NASS citrus data reported by World Population Review, measured in tons. Only California and Florida report commercial tangerine and mandarin production to USDA.
