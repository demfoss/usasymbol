faq:
- question: Which state produces the most pumpkins?
  answer: Illinois produces the most pumpkins in the country at 5,328,000 cwt in 2024, 39.55% of the 11-state
    total.
- question: Which state produces the least pumpkins?
  answer: Among the 11 states USDA tracks for pumpkins, Wisconsin produces the least at 304,000 cwt.
- question: How many pumpkins does California produce?
  answer: California produced 1,617,000 cwt of pumpkins in 2024, the second-highest total in the table.
- question: Why does Illinois grow so many pumpkins?
  answer: Illinois is the top state for processed pumpkin production, and its 5,328,000 cwt total exceeds
    the combined output of California, Indiana, Michigan, and Pennsylvania, the next four highest states.
- question: How many states produce pumpkins commercially?
  answer: USDA NASS publishes state-level pumpkin production data for 11 states. Other states are not
    tracked individually.
