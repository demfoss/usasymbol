page:
  h1: Pumpkin Production by State
  quick_answer:
  - Illinois produced the most pumpkins in the country in 2024 at 5,328,000 cwt, 39.55% of the 13,474,500
    cwt total across the 11 states with published data.
  - Wisconsin produced the least among the 11 states in the table, at 304,000 cwt, well below New York's
    450,000 cwt and Washington's 420,000 cwt.
  - California ranks second at 1,617,000 cwt, followed closely by Indiana at 1,347,500 cwt and Michigan
    at 1,148,000 cwt.
  methodology: Production figures are 2024 crop-year estimates from the USDA NASS Vegetables 2024 Summary,
    released February 2025. The table lists the 11 states with published state-level pumpkin data.
