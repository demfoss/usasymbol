page:
  h1: "Cheese Production by State"

  quick_answer:
    - "Wisconsin produces the most cheese of any state at 307,830,000 pounds, nearly 50% more than second-place California's 205,392,000 pounds."
    - "Idaho ranks third at 91,794,000 pounds, less than half of California's total and more than double fourth-place New York's 77,952,000 pounds."
    - "New Jersey has the smallest output in the tracked data at 9,211,000 pounds, just behind Illinois at 9,786,000 pounds."

  methodology: "Cheese production figures cover the 12 states with published state-level totals on record with USDA NASS. States without separately reported figures are excluded rather than shown as zero."

