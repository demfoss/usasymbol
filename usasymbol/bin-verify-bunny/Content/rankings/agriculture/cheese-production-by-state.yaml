faq:
  - question: "Which state produces the most cheese?"
    answer: "Wisconsin produces the most cheese in the tracked data at 307,830,000 pounds, 32.11% of the total."

  - question: "Which state produces the least cheese?"
    answer: "New Jersey has the smallest output at 9,211,000 pounds, just behind Illinois at 9,786,000 pounds."

  - question: "How much cheese does California produce?"
    answer: "California produces 205,392,000 pounds of cheese, the second-highest total in the data at 21.43% of the tracked amount."

  - question: "How does Idaho's cheese production compare to New York's?"
    answer: "Idaho produces 91,794,000 pounds, about 13.8 million pounds more than New York's 77,952,000 pounds."

  - question: "Which Midwest states produce the most cheese?"
    answer: "Wisconsin (307,830,000 pounds), Minnesota (73,455,000 pounds), Iowa (33,460,000 pounds), Ohio (21,465,000 pounds), and Illinois (9,786,000 pounds) are the Midwest states in the data."

