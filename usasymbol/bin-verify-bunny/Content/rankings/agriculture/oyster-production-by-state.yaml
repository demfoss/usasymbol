page:
  h1: Oyster Production by State
  quick_answer:
  - Washington led US oyster aquaculture sales in 2023 at $118.3 million, more than Virginia, Massachusetts,
    and California combined.
  - Virginia ranked second at $35.2 million, followed closely by Massachusetts at $32.3 million and California
    at $31.7 million.
  - Total US oyster sales reached $327.0 million in 2023, spread across 900 farming operations in 21 states.
  methodology: Sales figures are from USDA NASS's 2023 Census of Aquaculture, which counted 900 oyster operations
    across 21 states. Only the top four states by sales value were separately published.
  sources:
  - name: USDA NASS. 2023 Census of Aquaculture
