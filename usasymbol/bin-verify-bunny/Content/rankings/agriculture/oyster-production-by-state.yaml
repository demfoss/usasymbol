faq:
- question: Which state produces the most oysters?
  answer: Washington produces the most oysters, with $118.3 million in sales in the 2023 Census of Aquaculture,
    more than triple Virginia's total.
- question: How much do Virginia's oysters sell for?
  answer: Virginia's oyster sales reached $35.2 million in 2023, ranking second nationally behind Washington.
- question: What is the total value of US oyster sales?
  answer: US oyster sales totaled $327.0 million in 2023, spread across 900 operations in 21 states.
- question: Why does Washington lead the country in oyster farming?
  answer: Puget Sound and Willapa Bay have nutrient-rich waters shaped by glaciation, and Washington is the
    only state where growers commonly own the tidelands they farm. Willapa Bay alone produces about a quarter
    of the nation's oyster harvest.
- question: How do Massachusetts and California oyster sales compare?
  answer: Massachusetts reported $32.3 million in oyster sales in 2023, just ahead of California's $31.7
    million, ranking third and fourth nationally.
