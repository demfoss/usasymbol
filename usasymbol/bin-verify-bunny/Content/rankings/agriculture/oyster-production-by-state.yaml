sections:
- id: why-washington-leads-oyster-production
  icon: fa-solid fa-water
  title: Why Washington Leads US Oyster Production
  paragraphs:
  - Puget Sound and Willapa Bay carry nutrient-rich waters left behind by glaciation, conditions that support
    the $118.3 million in oyster sales Washington reported in 2023. Willapa Bay alone produces roughly a
    quarter of the nation's oyster harvest by volume.
  - Washington is also the only state where private ownership of tidelands is standard, a legal structure
    that has let growers build oyster operations directly on the bays and inlets that make up its coastline.
