page:
  h1: Mushroom Production by State
  quick_answer:
  - Pennsylvania produces the most mushrooms in the country at 452,029,945 pounds, accounting for 69% of all U.S. Agaricus mushroom volume of sales.
  - California ranks second nationally with 11% of U.S. Agaricus mushroom volume of sales, though a comparable pound figure is not published for the state.
  - The remaining 20% of U.S. Agaricus mushroom volume of sales comes from all other producing states combined.
  methodology: Production figures reflect the 2024-2025 season USDA Mushrooms report. Pennsylvania is the only state with a published pound figure; California and other states are reported only as a share of national Agaricus mushroom volume of sales.
