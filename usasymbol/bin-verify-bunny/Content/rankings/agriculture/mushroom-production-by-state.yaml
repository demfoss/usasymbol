faq:
- question: Which state produces the most mushrooms?
  answer: Pennsylvania produces the most mushrooms in the country at 452,029,945 pounds, 69% of U.S. Agaricus mushroom volume of sales.
- question: Why does Pennsylvania produce the most mushrooms?
  answer: Pennsylvania's dominance is tied to the state's long-established production infrastructure and technical expertise in mushroom farming.
- question: What share of mushroom production comes from California?
  answer: California accounts for 11% of U.S. Agaricus mushroom volume of sales, the second-largest share after Pennsylvania.
- question: How much is total U.S. mushroom production worth?
  answer: Total U.S. mushroom sales reached $1.10 billion in the 2024-2025 season, up 1% from the previous season.
- question: Do other states besides Pennsylvania and California produce mushrooms commercially?
  answer: Yes. The remaining 20% of U.S. Agaricus mushroom volume of sales comes from all other producing states combined.
