faq:
  - question: "Which state produces the most peppermint?"
    answer: "Idaho produces the most peppermint oil at 1.1 million pounds, 44% of the three-state total."

  - question: "How does Oregon's peppermint production compare to Idaho's?"
    answer: "Oregon produces 714,000 pounds of peppermint oil, 386,000 pounds behind Idaho's 1.1 million pounds."

  - question: "Which state has the smallest peppermint crop?"
    answer: "Washington has the smallest of the three tracked peppermint crops at 659,000 pounds."

  - question: "How many states grow peppermint commercially?"
    answer: "Three states report measurable peppermint oil production: Idaho, Oregon, and Washington, all in the Pacific Northwest."

