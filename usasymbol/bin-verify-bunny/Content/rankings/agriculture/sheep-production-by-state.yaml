page:
  h1: Sheep Production by State
  quick_answer:
  - Texas has the most sheep of any state at 350,000 head, 12.08% of the 2,898,000 head total across the
    32 states with published data.
  - North Carolina has the fewest sheep among the 32 states in the table, at 19,000 head, just behind
    Arizona's 28,000 head.
  - Utah ranks second at 220,000 head, ahead of Wyoming's 205,000 head. California and Colorado tie for
    fourth at 170,000 head each.
  methodology: Sheep inventory figures are head counts from the USDA NASS Sheep and Goats report, released
    January 31, 2025. The table lists the 32 states with published state-level sheep data.
