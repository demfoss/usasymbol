faq:
- question: Which state has the most sheep?
  answer: Texas has the most sheep of any state at 350,000 head, 12.08% of the 32-state total.
- question: Which state has the fewest sheep?
  answer: Among the 32 states USDA tracks for sheep, North Carolina has the fewest at 19,000 head.
- question: How many sheep does Utah have?
  answer: Utah has 220,000 head of sheep, the second-highest inventory among the 32 states with published
    data.
- question: Do California and Colorado have the same number of sheep?
  answer: Yes. California and Colorado tie for fourth in the table, each with 170,000 head of sheep.
- question: How many states report sheep inventory data?
  answer: USDA NASS publishes state-level sheep inventory data for 32 states as of January 1, 2025.
