  quick_answer:
    - "North Dakota and Montana are tied for the most dry pea production in the country, each growing 9.2 million cwt."
    - "Washington ranks third at 1.3 million cwt, well below the two leading states but ahead of Nebraska's 534,000 cwt."
    - "Idaho has the smallest crop among the top producers at 363,000 cwt, about 4% of North Dakota's total."

  methodology: "Dry pea production figures are reported in hundredweight (cwt) and reflect USDA data for the five leading producing states. States without measurable commercial dry pea acreage are omitted rather than shown as zero."

