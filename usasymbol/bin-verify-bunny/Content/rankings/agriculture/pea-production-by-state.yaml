faq:
  - question: "Which state produces the most peas?"
    answer: "North Dakota and Montana are tied for the most dry pea production, each growing 9.2 million cwt."

  - question: "Which state has the least pea production among top producers?"
    answer: "Idaho has the smallest crop among the leading pea-producing states at 363,000 cwt."

  - question: "How much pea production does Washington have?"
    answer: "Washington produces 1.3 million cwt of dry peas, ranking third behind North Dakota and Montana."

  - question: "Why are North Dakota and Montana tied for pea production?"
    answer: "Both states report identical dry pea production of 9.2 million cwt in USDA data, making them co-leaders rather than a single top state."

  - question: "How many states grow dry peas commercially?"
    answer: "Five states report measurable dry pea production: North Dakota, Montana, Washington, Nebraska, and Idaho."

