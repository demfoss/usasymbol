page:
  h1: Tobacco Production by State
  quick_answer:
  - North Carolina produces the most tobacco at 264,000,000 pounds a year, about 70% of the four-state total.
  - Kentucky ranks second at 66,420,000 pounds, ahead of Virginia's 28,350,000 pounds and Tennessee's 18,060,000 pounds.
  - Four states report commercial tobacco production to USDA, totaling 376,830,000 pounds a year.
  methodology: Production figures reflect 2025 USDA NASS tobacco data reported by World Population Review, measured in pounds. Four states report commercial tobacco production to USDA.
