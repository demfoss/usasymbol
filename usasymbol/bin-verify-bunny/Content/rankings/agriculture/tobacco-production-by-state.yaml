sections:
- id: states-with-the-most-tobacco-production
  icon: fa-solid fa-seedling
  title: States With the Most Tobacco Production
  paragraphs:
  - North Carolina's 264,000,000 pounds outproduces Kentucky, Virginia, and Tennessee combined, whose totals of 66,420,000, 28,350,000, and 18,060,000 pounds add up to 112,830,000 pounds. The four states together produce 376,830,000 pounds a year, and no other state reports commercial tobacco acreage to USDA.
faq:
- question: Which state produces the most tobacco?
  answer: North Carolina produces the most tobacco at 264,000,000 pounds a year, about 70% of the four-state total.
- question: Which state ranks second in tobacco production?
  answer: Kentucky ranks second at 66,420,000 pounds, ahead of Virginia's 28,350,000 pounds.
- question: How many states grow tobacco commercially?
  answer: 'Four states report commercial tobacco production to USDA: North Carolina, Kentucky, Virginia, and Tennessee, totaling 376,830,000 pounds a year.'
- question: How much tobacco does Tennessee produce?
  answer: Tennessee produces 18,060,000 pounds of tobacco a year, the smallest total among the four producing states.
