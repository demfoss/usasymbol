  icon: fa-solid fa-tree
  title: Why California and Washington Grow Most US Raspberries
  paragraphs:
  - California produced 35,500 tons of raspberries in 2023, just 1,950 tons ahead of Washington's 33,550
    tons. Together the two states accounted for 69,000 tons, and USDA does not publish state-level raspberry
    figures for any other state.
