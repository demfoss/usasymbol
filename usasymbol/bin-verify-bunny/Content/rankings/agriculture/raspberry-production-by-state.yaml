faq:
- question: Which state produces the most raspberries?
  answer: California produces the most raspberries at 35,500 tons in 2023, narrowly ahead of Washington's
    33,550 tons.
- question: Do any other states grow raspberries commercially?
  answer: USDA does not publish state-level raspberry production figures for any state other than California
    and Washington.
- question: How many tons of raspberries does Washington produce?
  answer: Washington produced 33,550 tons of raspberries in 2023, 1,950 tons behind California.
- question: How much raspberry production comes from California and Washington combined?
  answer: The two states combined for 69,000 tons of raspberry production in 2023, the entire published
    national total.
