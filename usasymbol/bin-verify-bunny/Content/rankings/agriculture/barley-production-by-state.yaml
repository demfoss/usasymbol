faq:
- question: Which state produces the most barley?
  answer: Idaho produces the most barley in the country at 54,880,000 bushels in 2025, 38.96% of the national
    total.
- question: Which state produces the least barley?
  answer: Among the 23 states USDA tracks for barley, Wisconsin produces the least at 141,000 bushels
    from 3,000 harvested acres.
- question: Which state has the highest barley yield per acre?
  answer: Colorado has the highest barley yield at 126.0 bushels per acre, ahead of Idaho and Wyoming,
    which tie for second at 112.0 bushels per acre.
- question: How much barley does Montana produce?
  answer: Montana produced 31,590,000 bushels of barley in 2025 from 585,000 harvested acres, more acreage
    than any other state.
- question: How many acres of barley are harvested in North Dakota?
  answer: North Dakota harvested 360,000 acres of barley in 2025, producing 28,080,000 bushels at a yield
    of 78.0 bushels per acre.
- question: What is Idaho's barley crop worth?
  answer: Idaho's barley production is valued at $301,840,000, the highest of any state, well ahead of
    Montana at $172,166,000.
