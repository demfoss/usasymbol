page:
  h1: Barley Production by State
  quick_answer:
  - Idaho produced the most barley in the country in 2025 at 54,880,000 bushels, 38.96% of the national
    total and more than Montana and North Dakota combined.
  - Montana harvested more barley acres than any other state at 585,000, yet produced 31,590,000 bushels,
    well below Idaho's 54,880,000 from just 490,000 acres.
  - Colorado posts the highest barley yield in the country at 126.0 bushels per acre, ahead of Idaho and
    Wyoming, which tie for second at 112.0 bushels per acre.
  methodology: Harvested acreage, yield, and production are 2025 USDA NASS Small Grains Summary estimates.
    Value of production comes from USDA NASS QuickStats data for the same 23 states.
  sources:
  - name: USDA NASS. Small Grains 2025 Summary
    url: https://www.nass.usda.gov/Publications/Todays_Reports/reports/smgr0925.pdf
    description: State-level barley harvested acreage, yield, and production, 2023-2025
  - name: USDA NASS. QuickStats Ad-Hoc Query Tool
    url: https://quickstats.nass.usda.gov/
    description: State-level value of barley production, 2025
  - name: American Malting Barley Association. First Barley Production Report
    url: https://ambainc.org/news-details.php?id=6691335b0f243
    description: Notes that Idaho's higher barley yields compared with Montana and North Dakota reflect
      greater use of irrigated production
