sections:
- id: why-idaho-leads-barley-production
  icon: fa-solid fa-wheat-awn
  title: Why Idaho Leads Barley Production
  paragraphs:
  - Idaho produced 54,880,000 bushels of barley in 2025, more than Montana's 31,590,000 and North Dakota's
    28,080,000 combined. Idaho's yield of 112.0 bushels per acre ties Wyoming for the highest in the table,
    a gap tied to Idaho's heavier reliance on irrigated cropland compared with Montana and North Dakota's
    largely dryland fields.
  - Montana harvested more acres than any other state at 585,000, yet its yield of 54.0 bushels per acre
    trails Idaho's by more than half. That yield gap, not acreage, explains why Idaho's smaller harvested
    area of 490,000 acres still outproduces Montana.
  table:
    columns:
      state: State
      production_bu: Barley Production (Bushels)
    rows:
    - state: Idaho
      production_bu: 54,880,000
    - state: Montana
      production_bu: 31,590,000
    - state: North Dakota
      production_bu: 28,080,000
    - state: Wyoming
      production_bu: 4,928,000
    - state: Colorado
      production_bu: 4,788,000
- id: barley-yield-per-acre-by-state
  icon: fa-solid fa-chart-column
  title: Barley Yield per Acre by State
  paragraphs:
  - Colorado posts the highest barley yield in the table at 126.0 bushels per acre, ahead of Idaho and
    Wyoming, which tie for second at 112.0 bushels per acre. Arizona (107.0) and Maryland (96.0) round
    out the top five.
  - Oregon has the lowest yield in the table at 43.0 bushels per acre, even though its harvested acreage
    of 22,000 matches California's. Alaska and Wisconsin tie for the next-lowest yield at 47.0 bushels
    per acre.
  table:
    columns:
      state: State
      yield_bu_acre: Yield (Bu/Acre)
    rows:
    - state: Colorado
      yield_bu_acre: '126.0'
    - state: Idaho
      yield_bu_acre: '112.0'
    - state: Wyoming
      yield_bu_acre: '112.0'
    - state: Arizona
      yield_bu_acre: '107.0'
    - state: Maryland
      yield_bu_acre: '96.0'
- id: value-of-barley-production-by-state
  icon: fa-solid fa-sack-dollar
  title: Value of Barley Production by State
  paragraphs:
  - Idaho's barley crop is worth $301,840,000, the highest production value in the table, followed by
    Montana at $172,166,000 and North Dakota at $130,572,000.
  - Colorado's barley is valued at $28,728,000, edging out Wyoming's $28,336,000 even though Wyoming harvests
    more bushels, 4,928,000 versus Colorado's 4,788,000. Arizona's crop is worth $6,308,000, more than
    Delaware's $4,014,000 despite Arizona producing fewer bushels, 963,000 versus Delaware's 1,235,000.
  table:
    columns:
      state: State
