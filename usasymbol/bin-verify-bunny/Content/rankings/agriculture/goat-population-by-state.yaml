- id: states-with-the-most-meat-goats
  icon: fa-solid fa-cow
  title: States With the Most Meat Goats
  paragraphs:
  - Texas alone runs 720,000 meat and other goats, dwarfing every other state; Oklahoma is a distant second
    at 79,000 and Tennessee third at 73,000. Meat and other goats made up 1.98 million of the 2.51 million
    US goats on January 1, 2025.
