page:
  h1: Goat Population by State
  quick_answer:
  - Texas has 805,000 goats, more than any other state, made up of 720,000 meat and other goats, 63,000
    angora goats, and 22,000 milk goats as of January 1, 2025.
  - California ranks second with 112,000 goats, and Wisconsin third with 110,000, both far behind Texas's
    total.
  - The United States had 2.51 million goats and kids on January 1, 2025, up 1% from 2024, and Texas
    alone holds 32% of the national total.
  methodology: Figures are from USDA NASS's Sheep and Goats report (January 31, 2025), state-level inventory
    of meat and other goats, milk goats, and angora goats as of January 1, 2025. Totals combine all three
    categories where a state reports data.
  sources:
  - name: USDA NASS. Sheep and Goats (January 2025)
    url: https://esmis.nal.usda.gov/sites/default/release-files/000000018/zk51xc07n/9593wq66x/shep0125.pdf
    description: State-level inventory of milk goats, meat and other goats, and angora goats as of January
      1, 2024 and 2025
