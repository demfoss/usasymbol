faq:
  - question: "Which state produces the most corn?"
    answer: "Iowa produces the most corn at 2,847,000,000 bushels, ahead of Illinois at 2,409,000,000 bushels."

  - question: "Which state produces the least corn?"
    answer: "Washington has the smallest total in the table at 23,500,000 bushels."

  - question: "How much corn does Nebraska produce?"
    answer: "Nebraska produces 1,967,300,000 bushels of corn, the third-highest total in the data."

  - question: "Is Iowa the top corn-producing state?"
    answer: "Iowa is the top corn producer at 2,847,000,000 bushels, about 438,000,000 bushels ahead of second-place Illinois."

  - question: "How does Minnesota's corn production compare to Indiana's?"
    answer: "Minnesota produces 1,667,620,000 bushels, about 591,000,000 more than Indiana's 1,076,250,000 bushels."

