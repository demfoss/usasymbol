  quick_answer:
    - "Georgia produces the most chickens of any state at 1,317,300,000 head, about 11% ahead of second-place Alabama's 1,183,600,000 head."
    - "Arkansas ranks third at 1,052,700,000 head, and North Carolina is fourth at 984,700,000 head, together with Georgia and Alabama forming the top four."
    - "Oklahoma has the smallest total in the table at 181,300,000 head, about seven times fewer than top-ranked Georgia."

  methodology: "Chicken production figures are broiler head counts on record with USDA NASS, covering the 14 states with published state-level totals."

