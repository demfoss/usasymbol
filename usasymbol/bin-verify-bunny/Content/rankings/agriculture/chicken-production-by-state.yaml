faq:
  - question: "Which state produces the most chickens?"
    answer: "Georgia produces the most chickens at 1,317,300,000 head, about 11% ahead of Alabama's 1,183,600,000 head."

  - question: "Which state produces the fewest chickens?"
    answer: "Oklahoma has the smallest total in the table at 181,300,000 head."

  - question: "How many chickens does Alabama produce?"
    answer: "Alabama produces 1,183,600,000 head of chicken, the second-highest total in the data."

  - question: "Which states produce the most chickens in the South?"
    answer: "Georgia, Alabama, Arkansas, North Carolina, Texas, and Mississippi are the six Southern states leading chicken production, each above 700,000,000 head."

  - question: "How does Arkansas compare to North Carolina in chicken production?"
    answer: "Arkansas produces 1,052,700,000 head, about 68,000,000 more than North Carolina's 984,700,000 head."

