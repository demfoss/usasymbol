faq:
  - question: "Which state produces the most sunflowers?"
    answer: "North Dakota produces the most sunflowers in the country at 1,088,400,000 pounds, 46.87% of the eight-state total."

  - question: "Which state produces the least sunflowers?"
    answer: "California produces the least among the eight ranked states at 19,945,000 pounds."

  - question: "How much sunflower does South Dakota produce?"
    answer: "South Dakota produces 865,750,000 pounds of sunflowers, the second-most of any state."

  - question: "How many states grow sunflowers commercially?"
    answer: "Eight states report sunflower production: North Dakota, South Dakota, Minnesota, Texas, Colorado, Nebraska, Kansas, and California."

  - question: "What is total US sunflower production?"
    answer: "The eight ranked states produced roughly 2,321,852,000 pounds of sunflowers combined, close to the reported national total of 2.3 billion pounds."

