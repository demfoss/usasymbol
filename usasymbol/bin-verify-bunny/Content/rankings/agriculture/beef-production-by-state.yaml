page:
  h1: "Beef Production by State"

  quick_answer:
    - "Texas has the most cattle in the country at 12.2 million head as of January 2025, more than double second-place Nebraska's 6.05 million."
    - "Beef cow inventory is led by Texas at 4.075 million head, more than double Oklahoma's 1.95 million second-place total."
    - "Rhode Island has the fewest cattle at just 3,700 head, while New Jersey's inventory fell to 92% of its 2024 level, the steepest year-over-year decline in the table."

  methodology: "Figures are all cattle and calves, and beef cows that have calved, reported by USDA NASS as of January 1, 2025. Beef cow counts are unavailable for 19 states following 2022 Census of Agriculture program changes."

  sources:
