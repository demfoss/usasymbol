sections:
  - id: "states-with-the-most-cattle"
    icon: "fa-solid fa-cow"
    title: "States With the Most Cattle"
    paragraphs:
      - "Texas leads the nation with 12.2 million cattle and calves as of January 2025, more than double second-place Nebraska's 6.05 million. Kansas follows at 5.95 million, while California holds fourth with 5.05 million."
      - "Oklahoma reports 4.6 million cattle and Missouri follows with 3.95 million, completing the top six state cattle inventories in the country."
    table:
      columns:
        state: "State"
        cattle_head: "All Cattle and Calves"
      rows:
        - state: "Texas"
          cattle_head: "12,200,000"
        - state: "Nebraska"
          cattle_head: "6,050,000"
        - state: "Kansas"
          cattle_head: "5,950,000"
        - state: "California"
          cattle_head: "5,050,000"
        - state: "Oklahoma"
          cattle_head: "4,600,000"
        - state: "Missouri"
          cattle_head: "3,950,000"

  - id: "states-with-the-most-beef-cows"
    icon: "fa-solid fa-cow"
    title: "Beef Cow Inventory by State"
    paragraphs:
      - "Texas also leads in beef cows that have calved, reporting 4.075 million head, nearly triple Oklahoma's 1.95 million second-place total. Missouri holds 1.864 million beef cows, Nebraska 1.552 million, and South Dakota 1.455 million."
      - "The ten largest beef cow states hold about 57% of the national beef cow herd of 27.9 million head."
    table:
      columns:
        state: "State"
        beef_cows: "Beef Cows"
      rows:
