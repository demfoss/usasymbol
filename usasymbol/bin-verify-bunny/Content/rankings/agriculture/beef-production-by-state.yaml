faq:
  - question: "Which state has the most cattle?"
    answer: "Texas has the most cattle in the country at 12.2 million head, 14.08% of the US total."

  - question: "Which state has the most beef cows?"
    answer: "Texas has the most beef cows at 4.075 million head, well ahead of Oklahoma's 1.95 million."

  - question: "Which state has the fewest cattle?"
    answer: "Rhode Island has the fewest cattle at 3,700 head, the smallest total in the table."

  - question: "How many cattle are in Nebraska?"
    answer: "Nebraska has 6.05 million cattle and calves, the second-most of any state, including 1.552 million beef cows."

  - question: "How many beef cows does Oklahoma have?"
    answer: "Oklahoma has 1.95 million beef cows, the second-most in the country behind Texas."

  - question: "What share of US beef cows do the top 10 states have?"
    answer: "The ten largest beef cow states account for about 57% of the national beef cow herd of 27.9 million head, led by Texas, Oklahoma, and Missouri."

