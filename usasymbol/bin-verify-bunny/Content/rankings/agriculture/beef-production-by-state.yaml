        - state: "Nebraska"
          beef_cows: "1,552,000"
        - state: "South Dakota"
          beef_cows: "1,455,000"

  - id: "states-with-the-fewest-cattle"
    icon: "fa-solid fa-chart-column"
    title: "States With the Fewest Cattle"
    paragraphs:
      - "Rhode Island has the fewest cattle in the country at just 3,700 head, followed by Delaware's 10,500 and Alaska's 20,000. New Jersey (24,000) and New Hampshire (28,000) also rank among the smallest state cattle inventories."
    table:
      columns:
