page:
  h1: Rice Belt States
  quick_answer:
  - 'The Rice Belt is a four-state region of the South: Arkansas, Louisiana, Mississippi, and Texas.'
  - Arkansas produces the most rice of any Rice Belt state at 93,200,000 cwt, followed by Louisiana at 31,928,000 cwt, Mississippi at 12,000,000 cwt, and Texas at 10,640,000 cwt.
  - Missouri and California also grow rice commercially but sit outside the traditional Rice Belt region.
  methodology: Rice Belt membership reflects the traditional four-state region identified by USA Rice and general agricultural geography sources. Production figures are 2024 crop-year cwt (hundredweight) from USDA NASS.
