    answer: "Florida grows 3.2 million cwt of peppers, 1.1 million cwt behind California's 4.3 million cwt."

  - question: "Which state ranks third in pepper production?"
    answer: "Georgia ranks third at 1.3 million cwt, less than a third of California's total."

  - question: "Which state has the smallest pepper crop among top producers?"
    answer: "North Carolina has the smallest crop among the six leading pepper states at 410,000 cwt."

  - question: "How many states grow peppers commercially?"
    answer: "Six states report measurable pepper production: California, Florida, Georgia, New Jersey, Michigan, and North Carolina."

