faq:
  - question: "Which state produces the most sweet corn?"
    answer: "Washington produces the most sweet corn in the country at 16,376,000 CWT, 28.12% of the nine-state total."

  - question: "Which state produces the least sweet corn?"
    answer: "Illinois produces the least among the nine ranked states at 1,485,000 CWT."

  - question: "How much sweet corn does Minnesota produce?"
    answer: "Minnesota produces 12,168,000 CWT of sweet corn, the second-most of any state."

  - question: "How many states grow sweet corn commercially?"
    answer: "Nine states report sweet corn production: Washington, Minnesota, Wisconsin, Florida, California, Georgia, Oregon, New York, and Illinois."

  - question: "What is total US sweet corn production?"
    answer: "The nine ranked states produced roughly 58,241,500 CWT of sweet corn combined, close to the reported national total of 58,200,000 CWT."

