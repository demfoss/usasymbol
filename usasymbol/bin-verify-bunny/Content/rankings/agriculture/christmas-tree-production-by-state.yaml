faq:
  - question: "Which state produces the most Christmas trees?"
    answer: "Oregon cut the most Christmas trees in 2022 at 4,823,877, 33.16% of the national total."

  - question: "Which state produces the fewest Christmas trees?"
    answer: "Nevada cut the fewest at 6 trees in 2022, the lowest total with recorded production."

  - question: "Which state has the most Christmas tree farms?"
    answer: "Oregon has the most Christmas tree farms at 1,695, more than Pennsylvania's 1,301 and Michigan's 1,236."

  - question: "How many Christmas trees does North Carolina produce?"
    answer: "North Carolina cut 3,208,419 Christmas trees in 2022, the second-highest total, from 940 farms."

  - question: "Which state has the most acres in Christmas tree production?"
    answer: "Oregon has the most acres in production at 48,433, more than North Carolina's 33,126 and Michigan's 33,135 combined with any other state."

  - question: "Does Michigan or North Carolina have more Christmas tree farms?"
    answer: "Michigan has 1,236 Christmas tree farms, more than North Carolina's 940, even though North Carolina cuts nearly twice as many trees."

