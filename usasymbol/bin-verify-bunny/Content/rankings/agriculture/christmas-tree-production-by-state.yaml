page:
  h1: "Christmas Tree Production by State"

  quick_answer:
    - "Oregon cut the most Christmas trees of any state in 2022 at 4,823,877, 33.16% of the national total and more than the next four states combined."
    - "North Carolina ranks second at 3,208,419 trees cut, and Michigan is third at 1,799,391, despite Michigan having more Christmas tree farms (1,236) than North Carolina (940)."
    - "Oregon also leads in acres in production at 48,433, while Nevada cut just 6 trees in 2022, the fewest of any state with recorded production."

  methodology: "Trees cut, farm count, and acres in production reflect 2022 USDA figures from the Census of Agriculture and the Nursery and Christmas Tree Production survey. States without a reported acreage figure are shown without that value."

  sources:
    - name: "USDA NASS. 2022 Census of Agriculture, Christmas Trees"
      url: "https://www.nass.usda.gov/Publications/AgCensus/2022/index.php"
      description: "State-level Christmas trees cut, number of farms, and acres in production, 2022"

