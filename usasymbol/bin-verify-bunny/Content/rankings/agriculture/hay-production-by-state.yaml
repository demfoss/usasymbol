page:
  h1: "Hay Production by State"

  quick_answer:
    - "Texas produces the most hay in the country at 9,590,000 tons a year, ahead of second-place Oklahoma's 6,609,000 tons."
    - "Rhode Island produces the least hay at 10,000 tons, less than a third of Delaware's 29,000 tons."
    - "The 48 reporting states produce about 119,416,000 tons of hay combined, and Texas alone accounts for roughly 8% of that total."

  methodology: "Production figures reflect 2025 USDA NASS Crop Production data reported by World Population Review, measured in tons of all dry hay. Hawaii and Tennessee are not included in the source data."

  sources:
