faq:
  - question: "Which state produces the most hay?"
    answer: "Texas produces the most hay at 9,590,000 tons a year, about 8% of the 48-state total."

  - question: "Which state produces the least hay?"
    answer: "Rhode Island produces the least hay at 10,000 tons, the smallest total in the data."

  - question: "How much hay does California produce?"
    answer: "California produces 4,424,000 tons of hay a year, ranking ninth nationally."

  - question: "Which states produce the most hay after Texas?"
    answer: "Oklahoma ranks second at 6,609,000 tons, followed by Missouri at 6,070,000 tons and Kansas at 6,062,000 tons."

  - question: "How much hay do the Northeast states produce?"
    answer: "Northeast states rank among the smallest producers. New Hampshire produces 62,000 tons and Connecticut produces 86,000 tons, both well below the national leaders."

