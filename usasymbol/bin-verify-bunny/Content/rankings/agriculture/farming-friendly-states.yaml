faq:
  - question: "What is the most farming-friendly state?"
    answer: "Texas is the most farming-friendly state by total farm count at 231,000, more than double Iowa's 86,700."

  - question: "What is the least farming-friendly state?"
    answer: "Rhode Island is the least farming-friendly state by this measure, with just 1,000 farms."

  - question: "Is Iowa a farming-friendly state?"
    answer: "Yes. Iowa ranks second with 86,700 farms, the second-highest total in the country."

  - question: "How is farming-friendliness measured on this list?"
    answer: "This ranking uses total farm count as the primary indicator, based on the idea that land availability and favorable growing conditions produce more farms."

  - question: "How many more farms does Texas have than Ohio?"
    answer: "Texas has 157,000 more farms than Ohio, 231,000 compared to 74,000."

