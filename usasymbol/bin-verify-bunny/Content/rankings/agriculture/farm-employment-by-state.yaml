page:
  h1: Farm Employment by State
  quick_answer:
  - California employed 372,134 hired farm workers in 2022, more than any other state and over three
    times Texas's 120,468.
  - Washington's 176,252 hired workers rank second nationally, and its farms average 19.1 workers per
    operation with hired labor, the highest ratio among the major farm-employing states.
  - California's farm payroll totaled $9.58 billion in 2022, averaging about $25,730 per hired worker,
    well above Washington's average of roughly $15,665.
  methodology: Figures are from USDA NASS's 2022 Census of Agriculture, Table 7, Hired Farm Labor, Workers
    and Payroll. Counts cover farms and ranches that reported hiring labor during 2022 and the workers
    and payroll they reported for the year.
