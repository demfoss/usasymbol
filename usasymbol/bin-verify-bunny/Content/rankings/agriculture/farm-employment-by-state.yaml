sections:
- id: workers-per-farm-by-state
  icon: fa-solid fa-user-group
  title: Workers per Hired-Labor Farm by State
  paragraphs:
  - Washington's 9,229 farms with hired labor averaged 19.1 workers each in 2022, the highest ratio among
    the major farm-employing states. California follows at 14.3 workers per farm across its 26,053 hired-labor
    operations.
  - Texas spreads its 120,468 hired workers across 40,327 farms, an average of just 3.0 per farm, far
    below Washington's ratio despite Texas ranking third in total workers.
- id: farm-worker-pay-by-state
  icon: fa-solid fa-money-bill
  title: Farm Worker Pay by State
  paragraphs:
  - California's $9.58 billion farm payroll works out to about $25,730 per hired worker in 2022, the highest
    average among the top employing states. Florida follows at roughly $20,387 per worker.
  - Washington's $2.76 billion payroll averages about $15,665 per worker, and Texas averages about $16,116,
    both below California and Florida despite ranking among the top four states for total workers.
