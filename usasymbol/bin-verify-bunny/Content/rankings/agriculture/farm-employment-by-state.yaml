faq:
- question: Which state has the most farm workers?
  answer: California employs 372,134 hired farm workers, more than triple Texas's 120,468. Washington ranks
    second at 176,252.
- question: Which state pays farm workers the most on average?
  answer: California's hired farm workers earned an average of about $25,730 in 2022, the highest among
    the top employing states, followed by Florida at roughly $20,387.
- question: How many hired farm workers are there in the United States?
  answer: The 2022 Census of Agriculture counted 2,184,493 hired workers on 437,310 farms nationwide, with
    $41.8 billion in total farm payroll.
- question: Which state has the fewest hired farm workers?
  answer: Rhode Island reported 1,667 hired farm workers in 2022, fewer than any other state, followed
    by Alaska at 1,870.
- question: How many farms in Texas hire farm labor?
  answer: Texas had 40,327 farms with hired labor in 2022, more than any other state, employing 120,468
    workers combined.
- question: Which state has the most workers per farm?
  answer: Washington averages 19.1 hired workers per farm with hired labor, the highest ratio among the
    top employing states, ahead of California's 14.3.
