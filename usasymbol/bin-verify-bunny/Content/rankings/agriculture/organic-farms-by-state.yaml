faq:
- question: Which state has the most organic farms?
  answer: California has the most certified organic farms, with 3,061 recorded in the 2021 Organic Survey,
    more than double Wisconsin's 1,455.
- question: How many organic farms does New York have?
  answer: New York had 1,407 certified organic farms in 2021, ranking third nationally behind California
    and Wisconsin.
- question: What percentage of US organic sales come from California?
  answer: California accounted for 39% of the $11.2 billion in national organic product sales reported for
    2021.
- question: How many certified organic farms are there in the United States?
  answer: The United States had 17,445 certified organic farms in 2021. California, Wisconsin, New York,
    and Pennsylvania together made up about 40% of that total.
- question: Does Texas have a large organic farming industry?
  answer: Texas reported $572 million in organic sales in 2021, more than Oregon's $386 million, though
    Texas did not rank among the top four states by number of certified organic farms.
