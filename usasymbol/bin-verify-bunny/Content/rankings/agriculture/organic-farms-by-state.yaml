page:
  h1: Organic Farms by State
  quick_answer:
  - California had 3,061 certified organic farms in 2021, more than double Wisconsin's 1,455, the second-highest
    state.
  - New York followed with 1,407 certified organic farms, and Pennsylvania rounded out the top four with
    1,125.
  - The four leading states combined for 6,998 organic farms, about 40% of the 17,445 certified organic
    farms nationwide.
  methodology: Farm counts are from USDA NASS's 2021 Organic Survey, the most recent state-level count of
    certified organic operations. National sales figures are from the same survey.
