sections:
- id: california-leads-organic-farms-and-sales
  icon: fa-solid fa-leaf
  title: California Leads Organic Farms and Sales
  paragraphs:
  - California's 3,061 certified organic farms outnumber Wisconsin's 1,455 by more than two to one. The
    state also accounts for 39% of the $11.2 billion in national organic product sales reported in 2021.
  - Texas and Oregon post large organic sales totals without leading in farm count. Texas reported $572
    million in organic sales in 2021, and Oregon reported $386 million, both well behind California's share
    despite neither cracking the top four states by number of farms.
