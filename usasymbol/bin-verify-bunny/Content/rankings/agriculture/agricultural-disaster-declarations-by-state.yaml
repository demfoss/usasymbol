page:
  h1: Agricultural Disaster Declarations by State
  quick_answer:
  - Texas had 212 counties under USDA Secretarial disaster designation for drought in the 2024 crop year,
    more counties than any other state.
  - North Carolina followed with 100 designated counties and Tennessee with 92, both far below Texas's
    total.
  - Nationally, 1,096 counties were named primary disaster counties and another 582 as contiguous counties
    for the 2024 crop year, a combined 1,678 counties across the drought designation program.
  methodology: Figures are from USDA Farm Service Agency Secretarial Disaster Designations for the 2024
    crop year, "All Drought" county totals by state (updated November 6, 2024). Primary counties meet
    drought severity thresholds directly; contiguous counties border a primary county and also qualify
    for assistance.
  sources:
  - name: USDA Farm Service Agency. Secretarial Disaster Designations, 2024 Crop Year
    url: https://www.fsa.usda.gov/sites/default/files/2024-11/ALL_DROUGHT_CoList_CY2024_20241106.pdf
    description: All Drought - Total Counties by State, primary and contiguous county designation counts
      for the 2024 crop year
