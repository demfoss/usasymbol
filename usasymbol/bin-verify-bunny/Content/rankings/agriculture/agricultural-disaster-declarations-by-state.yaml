faq:
- question: Which state had the most agricultural disaster declarations?
  answer: Texas had the most, with 212 counties designated for USDA drought disaster assistance in the
    2024 crop year, 131 as primary counties and 81 as contiguous counties.
- question: How many counties were designated for drought disaster assistance nationally?
  answer: The USDA named 1,096 primary counties and 582 contiguous counties nationally for the 2024 crop
    year drought program, a combined 1,678 county designations.
- question: What is the difference between a primary and contiguous disaster county?
  answer: A primary county meets USDA drought severity thresholds directly. A contiguous county borders
    a primary county and automatically qualifies for the same disaster assistance.
- question: Which states had no drought disaster designations in 2024?
  answer: Nine states and territories had zero designated counties, including Alaska, Connecticut, Maine,
    Massachusetts, New York, and Puerto Rico.
- question: Why does Mississippi have no contiguous disaster counties?
  answer: Mississippi's 82 designated counties were all classified as primary counties with no contiguous
    counties added, the only top-15 state with that pattern.
