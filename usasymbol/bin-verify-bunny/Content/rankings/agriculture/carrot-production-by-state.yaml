faq:
- question: Which state produces the most carrots?
  answer: California produces the most carrots, with 19.6 million CWT in 2025, the only state-level figure
    published in the USDA Vegetables Summary.
- question: Do other states grow carrots commercially?
  answer: The USDA Vegetables Summary reviewed for this page does not publish a state-level carrot production
    figure for any state besides California.
- question: What is the total US carrot production?
  answer: The United States produced 19.6 million CWT of carrots in 2025 on record, all of it attributed
    to California.
- question: How much carrot production does California have compared to other vegetables?
  answer: California's 19.6 million CWT of carrots is one of several vegetable crops where the state is
    the only one with a published USDA production figure, alongside cantaloupe and celery.
