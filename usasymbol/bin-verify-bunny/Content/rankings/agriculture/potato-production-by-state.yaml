faq:
- question: Which state produces the most potatoes?
  answer: Idaho produces the most potatoes in the country at 138,380,000 cwt in 2024, 33.52% of the 13-state
    total.
- question: Which state produces the least potatoes?
  answer: Among the 13 states USDA tracks for potatoes, Florida produces the least at 4,620,000 cwt.
- question: How many potatoes does Washington produce?
  answer: Washington produced 87,188,000 cwt of potatoes in 2024, the second-highest total among the 13
    states with published data.
- question: How many states produce potatoes commercially?
  answer: USDA NASS publishes state-level potato production data for 13 states. Other states are not tracked
    individually.
- question: How many potatoes does Texas produce?
  answer: Texas produced 6,205,000 cwt of potatoes in 2024, ahead of only Florida among the 13 states
    with published data.
