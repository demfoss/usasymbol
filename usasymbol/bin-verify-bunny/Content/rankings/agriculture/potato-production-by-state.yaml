page:
  h1: Potato Production by State
  quick_answer:
  - Idaho produced the most potatoes in the country in 2024 at 138,380,000 cwt, more than Washington's
    87,188,000 cwt and Wisconsin's 28,810,000 cwt combined.
  - Florida produced the least among the 13 states with published data, at 4,620,000 cwt, well below Texas's
    6,205,000 cwt.
  - Idaho and Washington together account for 225,568,000 cwt, more than half of the 412,860,000 cwt total
    across all 13 states in the table.
  methodology: Production figures are 2024 crop-year estimates from USDA NASS, reported for the 13 states
    with published state-level potato data. Other states are not tracked individually.
