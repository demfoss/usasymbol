faq:
- question: Is Delta-10 THC legal in Texas?
  answer: Yes, Texas is one of 9 states where Delta-10 THC is legal with minimal restrictions as of November 2025.
- question: Which states ban Delta-10 THC?
  answer: 29 states ban Delta-10 THC outside licensed dispensaries, including California, Colorado, Michigan, and Ohio.
- question: Is Delta-10 THC legal in Indiana?
  answer: As of April 2026, Delta-10 is legal in Indiana. A 2026 bill that would have banned it passed the state Senate but died after missing a House deadline.
- question: What states have the strictest Delta-10 limits?
  answer: New York, Virginia, and Mississippi allow Delta-10 but at potency levels too low for most products. New York caps servings at 1 mg of THC.
- question: Will Delta-10 THC become illegal nationwide?
  answer: A federal rule takes effect November 12, 2026 that counts all THC forms toward the 0.3% hemp threshold, which is expected to change the legal status in several states.
