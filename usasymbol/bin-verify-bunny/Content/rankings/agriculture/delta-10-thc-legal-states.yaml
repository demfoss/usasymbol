- id: states-with-the-most-restrictive-delta-10-limits
  icon: fa-solid fa-scale-balanced
  title: States With the Most Restrictive Delta-10 Limits
  paragraphs:
  - New York, Virginia, and Mississippi allow Delta-10 products but cap potency so low that most typical products do not qualify. New York limits servings to 1 mg of THC and 10 mg per package, and Virginia caps packages at 2 milligrams, effectively eliminating standard Delta-8 and Delta-10 products from store shelves.
