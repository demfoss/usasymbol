sections:
- id: why-delta-10-legal-status-is-changing-in-2026
  icon: fa-solid fa-gavel
  title: Why Delta-10 Legal Status Is Changing in 2026
  paragraphs:
  - A federal rule takes effect November 12, 2026 that counts all THC forms, including Delta-10, toward the 0.3% limit that defines legal hemp. That change is expected to shift the status shown here in multiple states, since products currently sold as compliant hemp in Legal and Regulated states could fall outside the new federal threshold.
