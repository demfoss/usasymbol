page:
  h1: Delta-10 THC Legal States
  quick_answer:
  - Delta-10 THC is legal with minimal restrictions in 9 states, including Texas, Missouri, and Pennsylvania.
  - 29 states ban Delta-10 THC outside licensed dispensaries, the largest group of the four, including California, Colorado, and Michigan.
  - '3 states heavily restrict Delta-10 with very low potency caps: New York limits products to 1 mg of THC per serving, and Virginia caps packages at 2 milligrams.'
  methodology: Legal status reflects hemp-derived THC law as of November 2025, drawn from state statutes and administrative rules. A federal rule taking effect November 12, 2026 will count all THC forms toward the 0.3% hemp limit, which is expected to change several states' status. This page is for informational purposes only and does not constitute legal advice.
