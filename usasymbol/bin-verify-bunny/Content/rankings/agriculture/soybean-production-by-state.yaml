faq:
  - question: "Which state produces the most soybeans?"
    answer: "Illinois produces the most soybeans in the country at 663,000,000 bushels, 15.42% of the 29-state total."

  - question: "Which state produces the least soybeans?"
    answer: "Texas produces the least among the 29 ranked states at 2,295,000 bushels."

  - question: "How many bushels of soybeans does Iowa produce?"
    answer: "Iowa produces 609,700,000 bushels of soybeans, the second-most of any state, just behind Illinois."

  - question: "How many states grow soybeans commercially?"
    answer: "Twenty-nine states report soybean production, led by Illinois, Iowa, and Minnesota."

  - question: "How much soybean does Minnesota produce?"
    answer: "Minnesota produces 375,240,000 bushels of soybeans, ranking third nationally."

