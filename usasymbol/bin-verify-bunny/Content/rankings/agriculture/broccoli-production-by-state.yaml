page:
  h1: Broccoli Production by State
  quick_answer:
  - California produced 12.1 million CWT of broccoli in 2024, 89.63% of the US total and the most of any
    state by far.
  - Arizona is the only other state with reportable broccoli production, at 1.4 million CWT, 10.37% of
    the US total.
  - Together California and Arizona account for the entire national broccoli crop of 13.5 million CWT.
  methodology: Production figures are 2024 data on record with USDA NASS, measured in CWT (hundredweight,
    100 pounds). Only California and Arizona have reportable commercial broccoli acreage.
