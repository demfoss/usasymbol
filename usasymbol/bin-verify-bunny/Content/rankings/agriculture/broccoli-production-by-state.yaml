faq:
- question: Which state produces the most broccoli?
  answer: California produces the most broccoli at 12.1 million CWT in 2024, 89.63% of the US total.
- question: Which states grow broccoli commercially?
  answer: 'USDA NASS reports commercial broccoli production for only two states: California and Arizona.'
- question: How much broccoli does Arizona produce?
  answer: Arizona produced 1.4 million CWT of broccoli in 2024, 10.37% of the US total and the only other
    state with reportable production.
- question: What is the total US broccoli production?
  answer: The United States produced 13.5 million CWT of broccoli in 2024, all of it from California and
    Arizona combined.
