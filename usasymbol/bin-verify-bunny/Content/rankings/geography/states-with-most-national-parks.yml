seo:
  title: "States With National Parks | Map, States & Counts"
  description: "California has the most national parks of any U.S. state, with nine. Alaska has eight, and Utah has five."

page:
  h1: "States With the Most National Parks"

  quick_answer:
    - "California leads all 50 states with 9 national parks, Channel Islands, Death Valley, Joshua Tree, Kings Canyon, Lassen Volcanic, Pinnacles, Redwood, Sequoia, and Yosemite. Alaska ranks second with 8."
    - "Utah ranks 3rd with 5 national parks: Arches, Bryce Canyon, Canyonlands, Capitol Reef, and Zion. Colorado is 4th with 4. Arizona, Florida, and Washington each have 3."
    - "29 of 50 states have at least one national park. The remaining 21 states, including New York, Pennsylvania, Illinois, and Georgia, have none."

  methodology: "Counts include only NPS units officially designated as national parks. Source: National Park Service, 2024."

  sources:
    - name: "National Park Service — Find a Park"
      url: "https://www.nps.gov/findapark/index.htm"
      description: "Official NPS list of all national park designations by state."

