sections:
  - id: most-parks
    title: "California and Alaska Lead in National Parks"
    paragraphs:
      - "California has 9 national parks, the most of any state. Alaska has 8, the second-highest total. Together, those two states hold 17 of the 63 national parks in the United States."
      - "California's 9 parks span deserts (Death Valley, Joshua Tree), coast (Channel Islands), ancient forests (Redwood, Sequoia, Kings Canyon), and volcanic terrain (Lassen Volcanic, Pinnacles). Alaska's 8 include Wrangell-St. Elias, the largest national park in the country at 13.2 million acres."

  - id: multiple-parks
    title: "States With 3 to 5 National Parks"
    paragraphs:
      - "Utah ranks 3rd with 5 parks, Arches, Bryce Canyon, Canyonlands, Capitol Reef, and Zion, all within the Colorado Plateau region. Colorado ranks 4th with 4: Black Canyon of the Gunnison, Great Sand Dunes, Mesa Verde, and Rocky Mountain."
      - "Three states tie for 5th place with 3 parks each. Arizona has Grand Canyon, Petrified Forest, and Saguaro. Florida has Biscayne, Dry Tortugas, and Everglades. Washington has Mount Rainier, North Cascades, and Olympic."

  - id: no-parks
    title: "21 States Have No National Parks"
    paragraphs:
      - "21 of 50 states have no units officially designated as national parks by the NPS. They include populous states such as New York, Pennsylvania, Illinois, Georgia, Wisconsin, and Tennessee."
      - "18 states have exactly 1 national park each, including Maine (Acadia), Montana (Glacier), Oregon (Crater Lake), and Wyoming (Grand Teton)."

faq:
  - question: "Which state has the most national parks?"
    answer: "California has the most national parks of any state with 9: Channel Islands, Death Valley, Joshua Tree, Kings Canyon, Lassen Volcanic, Pinnacles, Redwood, Sequoia, and Yosemite."

  - question: "How many national parks does Alaska have?"
    answer: "Alaska has 8 national parks: Denali, Gates of the Arctic, Glacier Bay, Katmai, Kenai Fjords, Kobuk Valley, Lake Clark, and Wrangell-St. Elias. Alaska ranks 2nd among all 50 states."

  - question: "What national parks are in Utah?"
    answer: "Utah has 5 national parks: Arches, Bryce Canyon, Canyonlands, Capitol Reef, and Zion. Utah ranks 3rd among all 50 states, behind California (9) and Alaska (8)."

  - question: "What national parks are in Colorado?"
    answer: "Colorado has 4 national parks: Black Canyon of the Gunnison, Great Sand Dunes, Mesa Verde, and Rocky Mountain. Colorado ranks 4th with 4 parks."

  - question: "Which states have 3 national parks?"
    answer: "Three states each have 3 national parks: Arizona (Grand Canyon, Petrified Forest, Saguaro), Florida (Biscayne, Dry Tortugas, Everglades), and Washington (Mount Rainier, North Cascades, Olympic). All three share the rank of 5th."

  - question: "How many states have no national parks?"
    answer: "21 states have no national parks. They include New York, Pennsylvania, Illinois, Georgia, Tennessee, Wisconsin, Iowa, Kansas, Louisiana, Maryland, Massachusetts, Mississippi, Nebraska, New Hampshire, New Jersey, Oklahoma, Rhode Island, Vermont, Alabama, Connecticut, and Delaware."

