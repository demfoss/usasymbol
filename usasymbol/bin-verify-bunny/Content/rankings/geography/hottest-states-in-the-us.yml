faq:
  - question: "Which state is the hottest?"
    answer: "Florida and Georgia share the top spot in 2026, both averaging 72.6°F, with Louisiana next closest at 68.9°F."

  - question: "Which state is the coolest?"
    answer: "Alaska is the coolest state, averaging 26.6°F in 2026."

  - question: "How much hotter is Florida than Alaska?"
    answer: "Florida averages 72.6°F in 2026, 46 degrees higher than Alaska's 26.6°F, the widest gap between any two states in the table."

  - question: "Which state has warmed the most since 1900?"
    answer: "Vermont shows the largest increase, from a 1901-2000 average of 41.3°F to a 2026 average of 52.4°F, a gap of 11.1 degrees."

  - question: "What is the average temperature in Texas?"
    answer: "Texas averages 68.1°F in 2026, up from 64.6°F in the 1901-2000 average, and ranks fourth hottest overall."

  - question: "Is any state cooler in 2026 than its 1901-2000 average?"
    answer: "Ohio is the only state in the table where the 2026 figure (42.3°F) comes in below its 1901-2000 average (50.4°F)."

