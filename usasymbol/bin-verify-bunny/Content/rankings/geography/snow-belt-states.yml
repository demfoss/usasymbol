page:
  h1: "Snow Belt States"

  quick_answer:
    - "The Snow Belt spans the northern United States from Maine to Minnesota. Its geographic core is the lake-effect snow zone downwind of the Great Lakes, where Buffalo, New York averages 94 inches of snow per year."
    - "The Snow Belt and Frost Belt are the same region under two names. 'Snow Belt' emphasizes the meteorological reality: heavy snowfall, lake-effect storms, and long cold winters. 'Frost Belt' is used in economic and political contexts as the direct counterpart to the Sun Belt, describing northern states that lost population or grew slowly as residents migrated south."
    - "Illinois lost population between 2010 and 2020. Ohio grew 2.3 percent and Michigan 2.0 percent over the same decade, while Sun Belt states Texas and Nevada grew 15 to 16 percent. The population contrast between the Snow Belt and Sun Belt is the sharpest demographic shift in U.S. history since westward expansion."

  methodology: "Snow Belt states are classified in two tiers. Core Lake-Effect Snow Belt states are the seven U.S. states bordering the Great Lakes, where lake-effect snowfall amplifies winter totals, while the broader Frost Belt adds northern New England and northern Plains states with heavy annual snowfall and cold winters."

  sources:
    - name: "NOAA National Centers for Environmental Information — Average Annual Snowfall"
      url: "https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/statewide/mapping"
      description: "NOAA statewide climate data including average annual snowfall totals used for all snowfall figures on this page"
