faq:
  - question: "What states are in the Snow Belt?"
    answer: "The Snow Belt's core is the seven Great Lakes states: Illinois, Indiana, Michigan, New York, Ohio, Pennsylvania, and Wisconsin. The broader Frost Belt adds northern New England (Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, Vermont) and northern Plains states (Minnesota, North Dakota, South Dakota). No fixed federal boundary defines either region."

  - question: "What is the difference between the Snow Belt and the Frost Belt?"
    answer: "Snow Belt and Frost Belt refer to the same region under two names. 'Snow Belt' is used in meteorology and geography, describing states with heavy annual snowfall and lake-effect snow. 'Frost Belt' is used in economics and political science as the direct counterpart to the Sun Belt, describing northern states that lost residents or grew slowly as people migrated south."

  - question: "What is lake-effect snow?"
    answer: "Lake-effect snow forms when cold Arctic air flows over the warmer surface of the Great Lakes, picks up moisture, and drops it as heavy snow on downwind shores. Buffalo averages 94 inches per year from Lake Erie. The Tug Hill Plateau east of Lake Ontario averages over 200 inches — the highest total in the contiguous U.S. outside the Pacific Coast ranges."

  - question: "What is the snowiest city in the Snow Belt?"
    answer: "Among major cities, Buffalo, New York averages 94 inches of snow per year — almost entirely lake-effect from Lake Erie. Erie, Pennsylvania averages 98 inches. Syracuse, New York averages approximately 124 inches. The extreme totals come from the Tug Hill Plateau near Watertown, New York, which averages over 200 inches annually from Lake Ontario lake-effect."

  - question: "What states lost population in the Snow Belt?"
    answer: "Illinois (-0.1 percent) and Connecticut (-0.9 percent) lost population between 2010 and 2020 — the only Snow Belt states to shrink during the decade. Ohio (+2.3 percent), Michigan (+2.0 percent), Pennsylvania (+2.4 percent), and Rhode Island (+1.1 percent) all grew below 3 percent, far behind the national average of 7.4 percent and well below Sun Belt states like Texas (+15.9 percent) and Florida (+14.6 percent)."

