faq:
  - question: "Which state has the most national forests?"
    answer: "California has the most national forests with 18. Oregon and Colorado tie for second with 11 each, and Idaho follows with 10."

  - question: "Which state has the most national forest land?"
    answer: "Alaska has the most with about 21.9 million acres, held in just two forests. California ranks second at roughly 20.8 million acres and Idaho third at 20.4 million."

  - question: "What is the largest national forest in the United States?"
    answer: "The Tongass National Forest in southeast Alaska is the largest at 16.7 million acres. Humboldt-Toiyabe, spanning Nevada and eastern California, is the largest outside Alaska at 6.3 million acres."

  - question: "Which states have no national forests?"
    answer: "Ten states have no national forest. Connecticut, Delaware, Hawaii, Iowa, Kansas, Maryland, Massachusetts, New Jersey, North Dakota, and Rhode Island all lack one, though Kansas and North Dakota contain national grasslands managed by the same agency."

  - question: "What percentage of Idaho is national forest?"
    answer: "About 38 percent. National forests cover roughly 20.4 million of Idaho's 53.5 million acres, the highest share of any state. Oregon ranks second at about 26 percent."

  - question: "How much national forest land is designated wilderness?"
    answer: "About 36 million acres, roughly one-fifth of the National Forest System. The Frank Church-River of No Return Wilderness in Idaho is the largest national forest wilderness in the lower 48 at about 2.4 million acres, and Minnesota's Boundary Waters, at 1.1 million acres, is the most visited."

