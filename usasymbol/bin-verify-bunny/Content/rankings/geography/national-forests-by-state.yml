    paragraphs:
      - "The Tongass in southeast Alaska covers 16.7 million acres, larger than the entire state of West Virginia. Humboldt-Toiyabe, spread across Nevada and eastern California, ranks second at 6.3 million acres and is the largest national forest outside Alaska."
      - "Alaska's Chugach takes third at 5.4 million acres. Idaho's Salmon-Challis, at 4.3 million acres, is the largest forest contained within a single lower-48 state, edging out Washington's Okanogan-Wenatchee at about 4 million."

  - id: "national-forests-shared-between-states"
    icon: "fa-solid fa-arrows-left-right"
    title: "National Forests Shared Between States"
    paragraphs:
      - "Humboldt-Toiyabe spreads its 6.3 million acres across Nevada and eastern California, and the Black Hills National Forest splits about 1.25 million acres between South Dakota and Wyoming. Ouachita National Forest crosses from Arkansas into Oklahoma, where its 350,000 acres are that state's only national forest land."
      - "White Mountain National Forest gives Maine its only national forest acreage, about 49,000 acres spilling over from New Hampshire. George Washington and Jefferson National Forests stretch from Virginia into West Virginia and Kentucky, and Vermont's Green Mountain National Forest administers New York's 16,000-acre Finger Lakes National Forest."

