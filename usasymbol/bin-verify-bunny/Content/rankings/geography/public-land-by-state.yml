faq:
  - question: "Which state has the most public land?"
    answer: "Nevada by percentage, with 80.1% of the state under federal management. Alaska by area, with 222.7 million acres."

  - question: "Which state has the least public land?"
    answer: "Connecticut and Iowa by share, at 0.3% each. Rhode Island holds the fewest acres, about 4,500, less than a tenth of Delaware's 29,900."

  - question: "How much land does the federal government own?"
    answer: "About 640 million acres, roughly 28% of the 2.27 billion acres in the United States. Most of it concentrates in Alaska and 11 western states."

  - question: "Which state has the most BLM land?"
    answer: "Alaska, which holds about 29% of the BLM's 244.4 million acres. Nevada follows with 19%, and the 12 western states together contain 99.8% of all BLM land."

  - question: "What percent of Texas is public land?"
    answer: "Just 1.9%, about 3.2 million acres. Texas retained its public domain as a condition of statehood, so it ranks 38th despite being the second-largest state."

  - question: "Does public land include state parks?"
    answer: "Not in this table. The figures count federal land managed by the BLM, Forest Service, Fish and Wildlife Service, National Park Service, and Department of Defense. State parks, state forests, and local preserves add public acreage on top of these numbers."

