sections:
  - id: "most-public-land"
    icon: "fa-solid fa-arrow-up"
    title: "States with the Most Public Land"
    paragraphs:
      - "Nevada has the highest share, with federal agencies managing 80.1% of the state, some 56.3 million acres. Utah at 63.1%, Idaho at 61.9%, and Alaska at 60.9% follow."
      - "Alaska dwarfs every other state in raw acreage. Its 222.7 million acres of public land amount to nearly four times Nevada's total and more than the next four states combined."

  - id: "federal-land-by-agency"
    icon: "fa-solid fa-tree"
    title: "Federal Land by Agency"
    paragraphs:
      - "The federal government owns about 640 million acres, roughly 28% of all U.S. land. The Bureau of Land Management is the largest manager at 244.4 million acres, ahead of the Forest Service at 192.9 million, the Fish and Wildlife Service at 89.2 million, and the National Park Service at 79.9 million."
      - "BLM land sits almost entirely in the West, with 99.8% of its acreage in 12 western states. Nearly half of the total lies in just two, Alaska with 29% and Nevada with 19%."

  - id: "least-public-land"
    icon: "fa-solid fa-arrow-down"
    title: "States with the Least Public Land"
    paragraphs:
      - "Connecticut and Iowa share the smallest percentage at 0.3%, followed by Kansas at 0.5% and Rhode Island at 0.7%. Rhode Island's roughly 4,500 acres are the fewest of any state."
      - "Texas is the outlier among big states. Despite its size, only 1.9% of Texas is federal public land, about 3.2 million acres, because the state kept its public domain when it joined the Union."

  - id: "public-land-changes"
    icon: "fa-solid fa-chart-line"
    title: "Public Land Change by State"
    paragraphs:
      - "Alaska recorded the largest decline, losing about 23 million acres of federal land between 1990 and 2018, a 9.4% drop. Nevada shed 3.7 million acres over the same period, down 6.2%."
      - "Rhode Island moved the other way, growing its small federal footprint by 45.1% since 1990. California's holdings slipped just 1.5%."

