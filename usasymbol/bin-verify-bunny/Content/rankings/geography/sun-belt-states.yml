      notes: "New Orleans and Baton Rouge are the major metros. Louisiana's slow growth — 2.7 percent 2010–2020 — reflects economic stagnation and hurricane-related out-migration rather than Sun Belt dynamics. Standard Sun Belt definition (Britannica)."

