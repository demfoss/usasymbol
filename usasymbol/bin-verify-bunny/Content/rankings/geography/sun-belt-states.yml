page:
  h1: "Sun Belt States"

  quick_answer:
    - "Britannica defines 15 states as the Sun Belt: Alabama, Arizona, Arkansas, California, Florida, Georgia, Louisiana, Mississippi, Nevada, New Mexico, North Carolina, Oklahoma, South Carolina, Tennessee, and Texas. Texas gained the most residents of any state 2010–2020: nearly 4 million people."
    - "Texas (+15.9%), Nevada (+14.9%), Florida (+14.6%), and Arizona (+11.9%) are the fastest-growing Sun Belt states by percentage of population gain from 2010 to 2020. All four grew more than twice as fast as the U.S. national average of 7.4 percent over the same decade."
    - "Mississippi is the most contested Sun Belt state by growth data. It lost approximately 6,000 residents between 2010 and 2020, the only Sun Belt state to shrink, while Texas and Florida each gained more than 2.8 million. Britannica includes Mississippi based on climate and geography, not growth."

  methodology: "Sun Belt definition follows the Kinder Institute for Urban Research/Britannica 15-state list, the most cited authoritative definition, though narrower definitions of 11 to 12 states exclude Alabama, Arkansas, Mississippi, and Tennessee. Population growth data is from the U.S. Census Bureau's 2020 Decennial Census, comparing 2010 and 2020 state populations."

  sources:
    - name: "Encyclopaedia Britannica — Sun Belt"
      url: "https://www.britannica.com/place/Sun-Belt"
      description: "Britannica's definition of the Sun Belt as 15 states, from Alabama through Texas, aligned with the Kinder Institute geographic designation"
    - name: "U.S. Census Bureau — 2020 Census Apportionment Data"
      url: "https://www.census.gov/data/tables/2020/dec/2020-apportionment-data.html"
      description: "2020 Decennial Census state population totals and change from 2010, source for all growth percentage figures"

