faq:
  - question: "What states are in the Sun Belt?"
    answer: "Britannica's definition — the most cited — lists 15 states: Alabama, Arizona, Arkansas, California, Florida, Georgia, Louisiana, Mississippi, Nevada, New Mexico, North Carolina, Oklahoma, South Carolina, Tennessee, and Texas. Narrower definitions (11–12 states) typically exclude Alabama, Arkansas, Mississippi, and Tennessee. All definitions agree on Arizona, California, Florida, Georgia, Nevada, New Mexico, and Texas."

  - question: "How many states are in the Sun Belt?"
    answer: "15 states per Britannica's definition, or 11–12 states per narrower academic and economic definitions. The difference is primarily four states — Alabama, Arkansas, Mississippi, and Tennessee — which are included based on climate and geography but grew more slowly than typical Sun Belt states."

  - question: "What is the fastest-growing Sun Belt state?"
    answer: "Texas grew the most in absolute terms, adding nearly 4 million residents from 2010 to 2020. Nevada grew the fastest by percentage at 14.9 percent, followed closely by Florida (14.6 percent) and Arizona (11.9 percent). All four grew more than twice the U.S. national average of 7.4 percent for the decade."

  - question: "Is Mississippi in the Sun Belt?"
    answer: "Yes, per Britannica's definition, based on Mississippi's climate and Deep South geography. However, Mississippi is the only Sun Belt state that lost population between 2010 and 2020, declining by approximately 6,000 residents. Its inclusion illustrates the difference between a climate-based and a growth-based definition of the Sun Belt."

  - question: "What is the difference between the Sun Belt and the Snow Belt?"
    answer: "The Sun Belt is the southern and southwestern tier of states that has grown rapidly since World War II, driven by warm climate, retiree migration, and economic expansion. The Snow Belt is the Great Lakes and northeastern tier — Illinois, Michigan, Ohio, Pennsylvania, and others — that has lost population or grown slowly as residents migrate south. Illinois lost population 2010–2020; Texas gained nearly 4 million."

  - question: "Is Colorado in the Sun Belt?"
    answer: "Colorado is not in standard Sun Belt definitions, including Britannica's 15-state list. It grew 14.8 percent from 2010 to 2020 — faster than Florida — but its high elevation, cold winters, and mountain climate exclude it from the warm-climate definition of the Sun Belt. Colorado's growth is driven by different factors than the retiree and warm-weather migration that defines the Sun Belt."

