faq:
  - question: "Which state is the coldest?"
    answer: "Alaska is the coldest state, averaging 26.6°F a year. Ohio, North Dakota, and Maine are next coldest, all tied at 42.3°F."

  - question: "Which state is the warmest?"
    answer: "Florida and Georgia are tied as the warmest states, both averaging 72.6°F. Louisiana is third warmest at 68.9°F."

  - question: "What is the average temperature in Ohio?"
    answer: "Ohio averages 42.3°F, tied with North Dakota and Maine as the second-coldest states in the rankings."

  - question: "What is the average temperature in Texas?"
    answer: "Texas averages 68.1°F, the fourth-warmest figure in the rankings, behind Florida, Georgia, and Louisiana."

  - question: "Is Hawaii warmer than Florida?"
    answer: "No. Hawaii averages 67.0°F, cooler than Florida's 72.6°F. Hawaii ranks fifth warmest overall, behind Florida, Georgia, Louisiana, and Texas."

