page:
  h1: "Coldest States in the U.S."

  quick_answer:
    - "Alaska is the coldest state in the country, with an average annual temperature of 26.6°F, well below every other state in the rankings."
    - "Ohio and North Dakota are next coldest, both averaging 42.3°F, tied with Maine at the same figure."
    - "Florida and Georgia are the warmest states, both averaging 72.6°F, followed by Louisiana at 68.9°F."

  methodology: "Average annual temperature figures come from NOAA historical climate normals for 1901 to 2000, with Alaska data spanning 1925 to 2000. Figures are compiled by World Population Review and were last updated July 17, 2026."

