  description: "Maryland has no natural lakes. Neither do West Virginia and Oklahoma. Deep Creek Lake and Lake Eufaula are both man-made reservoirs."

page:
  h1: "States With No Natural Lakes"

  quick_answer:
    - "Maryland has no natural lakes. Its largest lake, Deep Creek Lake, is a hydroelectric reservoir created in 1925. West Virginia and Oklahoma are the only other states with no documented natural lakes."
    - "Oklahoma has no natural lakes despite more than 200 man-made lakes. Lake Eufaula (102,500 acres), created in 1964, is Oklahoma's largest lake and every acre of it is held behind a dam."
    - "Minnesota has 11,842 natural lakes by official state count, Wisconsin 15,081, and Michigan approximately 11,000. Alaska has over 3 million. Maryland, West Virginia, and Oklahoma together have zero."

  methodology: "A state is included if no natural lakes are recorded in USGS National Hydrography Dataset sources and state geographic surveys. Natural lake counts for contrast states are official state DNR figures and exclude man-made reservoirs."

  sources:
    - name: "USGS National Hydrography Dataset"
      url: "https://www.usgs.gov/national-hydrography/national-hydrography-dataset"
      description: "Federal database of all U.S. water bodies used to identify states with no documented natural lakes"
