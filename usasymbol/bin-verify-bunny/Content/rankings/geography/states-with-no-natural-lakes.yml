      url: "https://www.dnr.state.mn.us/faq/mnfacts/water.html"
      description: "Official Minnesota DNR figure of 11,842 natural lakes over 10 acres"
    - name: "Wisconsin Department of Natural Resources — Lake Count"
      url: "https://dnr.wisconsin.gov/topic/lakes/numbers"
      description: "Official Wisconsin DNR figure of 15,081 named lakes on record"

