          source: "Michigan DEQ estimate"
    paragraphs:
      - "Alaska leads all states with over 3 million natural lakes by USGS estimate. Wisconsin records 15,081 on the Wisconsin DNR, and Minnesota 11,842 at the Minnesota DNR for lakes over 10 acres. Michigan has approximately 11,000."
      - "Minnesota, Wisconsin, and Michigan all sit within the zone of glaciation that retreated roughly 10,000 years ago, leaving behind thousands of lake basins. Maryland, West Virginia, and Oklahoma lie outside this zone."

