faq:
  - question: "Does Maryland have natural lakes?"
    answer: "Maryland has no natural lakes. Deep Creek Lake, the state's largest and most visited lake at 3,900 acres, is a hydroelectric reservoir created in 1925 by damming Deep Creek. All other lakes in Maryland are also man-made reservoirs."

  - question: "Does West Virginia have natural lakes?"
    answer: "West Virginia has no documented natural lakes. Summersville Lake, the state's largest at 2,790 acres, is a U.S. Army Corps of Engineers reservoir created in 1966. Beech Fork Lake, Burnsville Lake, and other well-known West Virginia lakes are also man-made."

  - question: "Does Oklahoma have natural lakes?"
    answer: "Oklahoma has no natural lakes despite having more than 200 man-made lakes. Lake Eufaula (102,500 acres, 1964) is the largest. Oklahoma's Grand Lake O' the Cherokees (1940) and Lake Texoma (1944) are also Army Corps of Engineers reservoirs."

  - question: "Which states have no natural lakes?"
    answer: "Maryland, West Virginia, and Oklahoma are the three U.S. states with no documented natural lakes. Maryland's Deep Creek Lake (1925), West Virginia's Summersville Lake (1966), and Oklahoma's Lake Eufaula (1964) are all man-made."

  - question: "What is the largest lake in Maryland?"
    answer: "Deep Creek Lake is the largest lake in Maryland at 3,900 acres. Created in 1925 as a hydroelectric reservoir by the Youghiogheny Hydro-Electric Company, it is not a natural lake. No natural lakes exist in Maryland."

  - question: "What state has the most natural lakes?"
    answer: "Alaska has the most natural lakes of any U.S. state with over 3 million by USGS estimate. Among contiguous states, Wisconsin leads with 15,081 on record at the Wisconsin DNR, followed by Minnesota with 11,842 documented by the Minnesota DNR."

