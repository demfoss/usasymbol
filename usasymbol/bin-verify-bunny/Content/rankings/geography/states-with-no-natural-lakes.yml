sections:
  - id: "no-natural-lakes"
    icon: "fa-solid fa-water"
    style: "law-cards"
    title: "Which States Have No Natural Lakes?"
    paragraphs:
      - "Maryland, West Virginia, and Oklahoma have no documented natural lakes. Each state's best-known lake is a reservoir: Deep Creek Lake in Maryland (1925), Summersville Lake in West Virginia (1966), and Lake Eufaula in Oklahoma (1964)."
      - "Oklahoma's Lake Eufaula covers 102,500 acres, more than 26 times the size of Maryland's Deep Creek Lake (3,900 acres). Both are entirely man-made."
    subsections:
      - subtitle: "Oklahoma"
        text: |
          **Largest lake:** Lake Eufaula
          **Lake type:** Army Corps reservoir
          **Year created:** 1964
          **Size:** 102,500 acres

          Oklahoma has no natural lakes even though it has more than 200 man-made ones. Lake Eufaula is the biggest example and the biggest lake on this page by a huge margin.

          That makes Oklahoma the strongest surprise case. A state can look lake-rich on the map and still have zero natural lakes in the geologic sense used here.
      - subtitle: "Maryland"
        text: |
          **Largest lake:** Deep Creek Lake
          **Lake type:** Hydroelectric reservoir
          **Year created:** 1925
          **Size:** 3,900 acres

          Maryland's best-known lake is Deep Creek Lake, but it is entirely man-made. The reservoir was created in 1925 and remains the state's largest lake.

          That is why Maryland belongs on this list despite its wooded mountain setting in the west. The state has well-known lakes, just not natural ones.
      - subtitle: "West Virginia"
        text: |
          **Largest lake:** Summersville Lake
          **Lake type:** Army Corps reservoir
          **Year created:** 1966
          **Size:** 2,790 acres

          West Virginia also has no documented natural lakes, even though water and mountain scenery are central to the state's image. Summersville Lake, its largest, was created by dam construction in 1966.

          That contrast is what makes West Virginia memorable here. The state looks like it should have natural mountain lakes, but its major lakes are reservoirs.

