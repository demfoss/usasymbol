faq:
- question: Which state has the most national monuments?
  answer: California has the most with 20, one ahead of Arizona's 19. The two January 2025 designations, Chuckwalla and Sáttítla Highlands, moved California past Arizona.
- question: How many national monuments are there in the United States?
  answer: The United States has 138 national monuments spread across 33 states, the District of Columbia, and several territories. The National Park Service manages 89 of them.
- question: Which states have no national monuments?
  answer: Seventeen states have none. They are Arkansas, Connecticut, Delaware, Indiana, Kansas, Massachusetts, Michigan, New Hampshire, North Carolina, North Dakota, Oklahoma, Rhode Island, South Carolina, Tennessee, Vermont, West Virginia, and Wisconsin.
- question: What was the first national monument?
  answer: Devils Tower in Wyoming, proclaimed by Theodore Roosevelt on September 24, 1906. El Morro and Montezuma Castle followed on December 8 of the same year.
- question: What is the largest national monument?
  answer: Papahānaumokuākea Marine National Monument covers 372.8 million acres of the Pacific Ocean off Hawaii. On land, Misty Fjords in Alaska is the largest at 2,294,072 acres.
- question: Who manages national monuments?
  answer: The National Park Service manages 89 of the 138 monuments. The Bureau of Land Management oversees 31, the Forest Service 16, the Fish and Wildlife Service 9, and NOAA 5.
