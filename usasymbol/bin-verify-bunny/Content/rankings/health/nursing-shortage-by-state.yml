seo:
  title: "Nursing Shortage by State | Map, Stats & Salaries"
  description: "Utah has the fewest registered nurses per resident at 7.1 per 1,000. South Dakota has the most at 15.2. RN pay ranges from $67,000 to $137,000."

page:
  h1: "Nursing Shortage by State"

  quick_answer:
    - "Utah faces the tightest nursing supply of any state, with about 7.1 registered nurses per 1,000 residents. Idaho (7.3), Georgia (7.5), and Nevada (7.6) sit close behind."
    - "South Dakota has 15.2 nurses per 1,000 residents, the most in the country and more than double Utah's figure. North Dakota follows at 14.8, and no other state tops 12.1."
    - "About 100,000 registered nurses left the workforce during the pandemic, and roughly 800,000 more say they intend to leave by 2027. Federal projections expect about 194,500 RN openings every year through 2033."

  methodology: "Nurses per 1,000 residents combine Bureau of Labor Statistics registered nurse employment (May 2024) with Census population estimates; salaries are BLS mean annual RN wages, rounded. National shortage, turnover, and vacancy figures come from HRSA projections and the NCSBN nursing workforce survey."

  sources:
    - name: "U.S. Bureau of Labor Statistics — Occupational Employment and Wage Statistics, Registered Nurses"
      url: "https://www.bls.gov/oes/current/oes291141.htm"
      description: "RN employment counts and mean annual wages by state, May 2024"
    - name: "HRSA — Health Workforce Projections"
      url: "https://bhw.hrsa.gov/data-research/projecting-health-workforce-supply-demand"
      description: "Federal supply and demand projections for the nursing workforce through 2037"
    - name: "NCSBN — National Nursing Workforce Study"
      url: "https://www.ncsbn.org/research/recent-research/workforce.page"
      description: "Survey data on pandemic-era RN departures and nurses' intent to leave the profession"

