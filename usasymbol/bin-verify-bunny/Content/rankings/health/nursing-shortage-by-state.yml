faq:
  - question: "Which state has the worst nursing shortage?"
    answer: "Utah has the thinnest nursing coverage, with about 7.1 registered nurses per 1,000 residents and a workforce of roughly 24,300 RNs. Idaho ranks second at 7.3 per 1,000."

  - question: "Which states need nurses the most?"
    answer: "Utah, Idaho, Georgia, Nevada, Texas, and Oklahoma have the fewest nurses per resident, all below 7.8 per 1,000. Fast-growing Texas needs the largest raw numbers, since even 231,000 working RNs leave it near the bottom per capita."

  - question: "Which state has the most nurses per capita?"
    answer: "South Dakota, with 15.2 registered nurses per 1,000 residents. North Dakota follows at 14.8. Both states more than double the coverage of Utah, Idaho, and Georgia."

  - question: "How many nurses is the U.S. short?"
    answer: "About 100,000 RNs left the workforce during the pandemic, and roughly 800,000 more said in national surveys that they intend to leave by 2027. Federal projections expect about 194,500 RN openings per year through 2033, with demand outrunning supply in most western states through 2037."

  - question: "What state pays nurses the most?"
    answer: "California, with a mean RN salary of about $137,000 a year. Hawaii ranks second at roughly $120,000. Alabama pays the least at about $67,000, followed by South Dakota at $68,000."

  - question: "Does higher pay fix the nursing shortage?"
    answer: "Not by itself. Washington pays a mean of $111,000 yet ranks tenth worst at 8.2 nurses per 1,000 residents, while South Dakota pairs a $68,000 mean salary with the highest per-capita workforce in the country at 15.2."

