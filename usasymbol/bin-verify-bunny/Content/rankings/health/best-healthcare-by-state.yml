compare:
  metric_slug: best-healthcare
  title: "Compare Healthcare Between Two States"
  description: "Pick two states to see a full side-by-side breakdown of health, income, education, and quality of life."
  button_text: "Compare healthcare"
  icon: "fa-solid fa-heart-pulse"
  default_state_a: hawaii
  default_state_b: alaska

sections:
  - id: "best-healthcare-states"
    icon: "fa-solid fa-heart-pulse"
    title: "States with the Best Healthcare"
    paragraphs:
      - "Hawaii leads all 50 states with a Final Score of 87.6, the only entry above 85. New Hampshire ranks second at 82.1 and Massachusetts third at 79.9. Minnesota (76.7) and New Jersey (75.0) round out the top five."
      - "Massachusetts holds an Outcomes score of 99.2, second only to Hawaii at 100. New Jersey ranks 6th overall at 75.0 with an Outcomes score of 98.6, third best in the table. Washington state holds the highest Cost score at 100 and ranks 7th overall at 74.9."

  - id: "worst-healthcare-states"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States with the Worst Healthcare"
    paragraphs:
      - "Alaska ranks last at 27.8 with a Cost score of 6.9, second lowest in the table. West Virginia ranks 49th at 28.9 and holds the lowest Cost score of any entry at 0. Mississippi ranks 48th at 29.9 with an Outcomes score of 0, the lowest for health results."
      - "Oklahoma ranks 47th at 30.9 with an Outcomes score of 13.1, second lowest after Mississippi. Texas ranks 45th at 35.6 and holds the lowest Access score at 0. Arkansas (35.2) ranks 46th with an Outcomes score of 19.5."

  - id: "healthcare-cost-by-state"
    icon: "fa-solid fa-dollar-sign"
    title: "States with the Highest Healthcare Costs"
    paragraphs:
      - "West Virginia has the lowest Cost score in the table at 0, the worst cost performance of any entry. Alaska follows at 6.9 and Vermont at 12.6. Vermont's ACA benchmark Silver premium of $1,223 per month is the highest in the country."
      - "New York holds a Cost score of 15.4, pulling its Final Score to 57.4 despite an Outcomes score of 95.7, fourth best in the table. Wyoming's Cost score of 17.8 reflects a benchmark premium of $1,114 per month. Washington state, by contrast, holds the highest Cost score at 100."

visual_assets:
  - id: best-healthcare-states
    src: /images/rankings/health/best-healthcare-by-state/best-healthcare-states.jpg
    alt: Bright modern hospital corridor with clean clinical design
    caption: The highest-ranked healthcare systems combine strong outcomes, broad access, and manageable costs rather than excelling in only one category. Hawaii, New Hampshire, Massachusetts, and Minnesota all score well across multiple dimensions at once.
    section: best-healthcare-states
    layout: full-width-tall

  - id: worst-healthcare-states
    src: /images/rankings/health/best-healthcare-by-state/worst-healthcare-states.jpg
    alt: Small rural medical clinic building
    caption: Lower-ranked states tend to struggle with a mix of weak access, poorer outcomes, or very high costs. Alaska, West Virginia, Mississippi, Oklahoma, and Texas each land near the bottom for different combinations of those pressures.
    section: worst-healthcare-states
    layout: full-width-tall

  - id: healthcare-cost-by-state
    src: /images/rankings/health/best-healthcare-by-state/healthcare-cost-by-state.jpg
    alt: Medical bills, paperwork, and a calculator on a desk
    caption: Healthcare affordability can pull down an otherwise strong overall system. States like New York and Vermont post excellent outcomes in some areas but lose ground when premiums and other costs rise too high.
    section: healthcare-cost-by-state
    layout: full-width-tall

faq:
  - question: "What state has the best healthcare?"
    answer: "Hawaii has the highest Final Score at 87.6, more than 5 points ahead of second-ranked New Hampshire at 82.1. No other state scores above 80 in the table."

  - question: "What state has the worst healthcare?"
    answer: "Alaska ranks last at 27.8. West Virginia (28.9) and Mississippi (29.9) are the only other entries below 30. All three score below 7 on Cost performance or hold a Cost score of zero."

  - question: "Which state has the best healthcare outcomes?"
    answer: "Hawaii holds an Outcomes score of 100, the maximum in the table. Massachusetts follows at 99.2 and New Jersey at 98.6. Hawaii's combination of top Outcomes and a Cost score of 89.1 drives its first-place finish at 87.6."

  - question: "Which state has the best healthcare access?"
    answer: "North Dakota has the highest Access score at 78.2, the best healthcare access among states in this table. Vermont ranks second at 77.3 and Massachusetts third at 75.5. North Dakota ranks 9th overall with a Final Score of 72.0."

  - question: "Which state has the best cost performance for healthcare?"
    answer: "Washington state has the highest Cost score at 100, leading all entries on affordability and cost efficiency. Idaho follows at 99.2 and Maryland at 97.4. Washington ranks 7th overall with a Final Score of 74.9."

  - question: "How does California rank for healthcare?"
    answer: "California ranks 11th overall with a Final Score of 71.6. Its Outcomes score of 90.5 is fifth best in the table, ahead of several states ranked higher overall."

