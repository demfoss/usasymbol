faq:
  - question: "Which state has the highest drug overdose death rate?"
    answer: "West Virginia has the highest overdose death rate of any state, 48.9 deaths per 100,000 residents, based on 821 overdose deaths."

  - question: "Which state has the lowest drug overdose death rate?"
    answer: "Nebraska has the lowest rate in the country at 8.1 per 100,000 residents, based on 155 deaths statewide."

  - question: "Which state has the most overdose deaths?"
    answer: "California recorded 9,028 overdose deaths, more than any other state. Texas follows at 4,980, and Florida at 4,958."

  - question: "Does a high death count mean a high overdose rate?"
    answer: "California leads in raw deaths at 9,028 but ranks 27th by rate at 21.7 per 100,000. Texas has the second-most deaths at 4,980 yet a rate of 15.8."

  - question: "Which states tie for the same overdose death rate?"
    answer: "Maine and Tennessee tie at 35.2 per 100,000. Kentucky, Louisiana, and Oregon all share a rate of 33.5."

  - question: "How many drug overdose deaths were there in the U.S.?"
    answer: "The United States recorded 79,384 overdose deaths, a national rate of 23.1 per 100,000 residents."

