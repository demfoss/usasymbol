  description: "Alaska has the highest suicide rate at 29.7 per 100,000 residents. New Jersey has the lowest at 6.7, versus 14.1 nationally."

page:
  h1: "Suicide Rate by State"

  quick_answer:
    - "Alaska has the highest age-adjusted suicide rate of any state at 29.7 deaths per 100,000 residents in 2023, more than double the national rate of 14.1."
    - "New Jersey has the lowest rate at 6.7 per 100,000, less than a quarter of Alaska's rate. Wyoming (27.8) and Montana (26.8) rank second and third highest."
    - "Texas recorded the most suicide deaths of any state at 4,490, even though its rate of 14.2 per 100,000 sits near the national average. Nationally, the male suicide rate was 22.7 per 100,000 in 2023, nearly four times the female rate of 5.9."

  methodology: "Rates are age-adjusted deaths per 100,000 residents, CDC NCHS 2023 data. The national rate was essentially flat from 14.2 in 2018 to 14.1 in 2023, after a temporary dip to 13.5 in 2020. The District of Columbia is excluded."

  sources:
    - name: "CDC National Center for Health Statistics, Stats of the States: Suicide Mortality"
      url: "https://www.cdc.gov/nchs/state-stats/deaths/suicide.html"
      description: "Age-adjusted suicide death rate and total deaths by state, 2023 data"
    - name: "National Council for Suicide Prevention, state suicide rates by age group"
      url: "https://thencsp.org"
      description: "Crude suicide rates by state for adults 65 and older and adults 15 to 24, compiled by John L. McIntosh, Indiana University South Bend, from CDC WONDER data"

