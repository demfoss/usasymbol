faq:
  - question: "Which state has the highest suicide rate?"
    answer: "Alaska has the highest age-adjusted suicide rate at 29.7 per 100,000 residents. Wyoming ranks second at 27.8."
  - question: "Which state has the lowest suicide rate?"
    answer: "New Jersey has the lowest rate at 6.7 per 100,000. New York is second-lowest at 8.1, and Massachusetts is third at 8.3."
  - question: "What is the average suicide rate in the US?"
    answer: "The national age-adjusted rate was 14.1 per 100,000 in 2023. Men died by suicide at 22.7 per 100,000, nearly four times the female rate of 5.9."
  - question: "Which state has the most suicide deaths?"
    answer: "Texas recorded 4,490 suicide deaths, the most of any state, followed by California at 4,022. Both states rank in the lower half by rate."
  - question: "How does the suicide rate differ by age group?"
    answer: "Nevada has the highest rate among adults 65 and older at 34.9 per 100,000, against a national rate of 17.6 for that age group. Alaska has the highest rate among ages 15 to 24 at 43.9, compared with a national rate of 13.5."
  - question: "Where can I find help for suicidal thoughts?"
    answer: "The 988 Suicide and Crisis Lifeline offers free, confidential support 24 hours a day. Call or text 988 to reach a counselor."

