faq:
  - question: "Which state has the most sleep-deprived adults?"
    answer: "Hawaii has the highest share of any state, 45.6% of adults reporting less than 7 hours of sleep in a 24-hour period."

  - question: "Which state gets the most sleep?"
    answer: "Minnesota and Vermont tie for the lowest share of sleep-deprived adults, both at 29.6%. Colorado is close behind at 30.3%."

  - question: "What is the national rate of insufficient sleep?"
    answer: "The national rate is 35.5%. Twenty-three states sit above that mark, led by Hawaii at 45.6% and West Virginia at 41.3%."

  - question: "How is average sleep measured in this ranking?"
    answer: "This ranking uses the share of adults who reported sleeping less than 7 hours in a 24-hour period, not an average number of hours slept."

  - question: "Where does California rank for sleep deprivation?"
    answer: "California ties Arizona at 34.8%, below the national rate of 35.5% and outside the ten highest states."

  - question: "Where does New York rank for sleep deprivation?"
    answer: "New York ranks 10th at 38.4%, nearly 3 points above the national rate of 35.5%."

