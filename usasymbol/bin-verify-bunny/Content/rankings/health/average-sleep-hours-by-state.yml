  description: "Hawaii has the highest share of sleep-deprived adults at 45.6%, sleeping under 7 hours nightly. Minnesota and Vermont are lowest at 29.6%."

page:
  h1: "Sleep Deprivation by State"

  quick_answer:
    - "Hawaii has the highest share of sleep-deprived adults of any state, 45.6% reporting less than 7 hours of sleep in a 24-hour period, per 2022 CDC data."
    - "West Virginia ranks second at 41.3%, and Alabama is third at 40.5%. Minnesota and Vermont tie for the lowest share in the country, both at 29.6%, 15.6 points below Hawaii."
    - "The national rate is 35.5%. Colorado is the closest state to the national rate from below at 30.3%, while New York sits above it at 38.4%."

  methodology: "Figures are the share of adults reporting less than 7 hours of sleep in a 24-hour period, from the CDC Behavioral Risk Factor Surveillance System, 2022 data as compiled by America's Health Rankings. DC is excluded from state ranks."

  sources:
    - name: "America's Health Rankings — Insufficient Sleep"
      url: "https://www.americashealthrankings.org/explore/measures/sleep"
      description: "State-level share of adults reporting less than 7 hours of sleep, based on CDC BRFSS data, 2022"
    - name: "Hawaii News Now — Hawaii Is Most Sleep-Deprived State, You Can Blame the Cost of Living"
      url: "https://www.hawaiinewsnow.com/2023/11/07/hawaii-is-most-sleep-deprived-state-you-can-blame-cost-living-well-part/"
      description: "Reporting linking Hawaii's sleep deprivation rate to its cost of living and rate of multiple job-holding"

