page:
  h1: "Gyms per Capita by State"

  quick_answer:
    - "New Hampshire has the most gyms per capita of any state, about 19.5 per 100,000 residents, ahead of Montana (18.1) and Massachusetts (17.4)."
    - "Hawaii has the fewest gyms per capita at about 6.6 per 100,000 residents, followed by West Virginia (6.9) and Arkansas (7.9)."
    - "California has the most gyms of any state in raw numbers, 5,240, though its per-capita rate of 13.3 per 100,000 ranks only 13th nationally."

  methodology: "Gym counts are U.S. Census Bureau County Business Patterns 2022 totals for NAICS 713940, Fitness and Recreational Sports Centers, combined with 2026 state population estimates. Figures measure facility density, not membership headcounts."

