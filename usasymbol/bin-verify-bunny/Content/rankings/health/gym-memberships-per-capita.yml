faq:
  - question: "Which state has the most gyms per capita?"
    answer: "New Hampshire has the most gyms per capita of any state at 19.5 per 100,000 residents. Montana ranks second at 18.1, and Massachusetts is third at 17.4."

  - question: "Which state has the fewest gyms per capita?"
    answer: "Hawaii has the fewest gyms per capita at 6.6 per 100,000 residents, the only state under 7."

  - question: "Which state has the most gyms overall?"
    answer: "California has the most gyms of any state, 5,240, more than any other state in raw numbers. Its per-capita rate of 13.3 per 100,000 ranks only 13th nationally."

  - question: "How many gyms are in Texas?"
    answer: "Texas has 3,294 gyms, the second-most of any state, though its per-capita rate of 10.3 per 100,000 ranks 39th."

  - question: "Does a state with more gyms overall have a higher rate per capita?"
    answer: "Not necessarily. California and Texas rank first and second in total gym count but 13th and 39th per capita. New Hampshire has just 278 gyms yet leads every state in gyms per 100,000 residents."

  - question: "How many gyms are in New York?"
    answer: "New York has 2,515 gyms, the fourth-most of any state, with a per-capita rate of 12.6 per 100,000 residents."

