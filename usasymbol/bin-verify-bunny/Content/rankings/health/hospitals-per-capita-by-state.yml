faq:
  - question: "Which state has the most hospital beds per capita?"
    answer: "South Dakota has the most hospital beds per capita at 4.37 per 1,000 residents. North Dakota is second at 4.05, and West Virginia is third at 3.63."

  - question: "Which state has the fewest hospital beds per capita?"
    answer: "Washington has the fewest hospital beds per capita at 1.57 per 1,000 residents. Oregon is second-lowest at 1.64, and New Mexico is third-lowest at 1.67."

  - question: "What is the national average for hospital beds per capita?"
    answer: "The U.S. average is 2.28 hospital beds per 1,000 residents. More than half the states fall below that figure."

  - question: "How many hospital beds per capita does California have?"
    answer: "California has 1.81 hospital beds per 1,000 residents, ranking 43rd, below the 2.28 national average."

  - question: "How many hospital beds per capita does Texas have?"
    answer: "Texas has 2.13 hospital beds per 1,000 residents, ranking 30th, slightly below the 2.28 national average."

  - question: "Why do rural states have more hospital beds per capita?"
    answer: "South Dakota (4.37), North Dakota (4.05), Nebraska (3.34), and Montana (3.26) all rank in the top six. Each is a low-population Great Plains state, which raises the per-capita bed count relative to the smaller population base."

