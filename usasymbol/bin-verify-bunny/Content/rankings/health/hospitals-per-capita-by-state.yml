sections:
  - id: "states-with-the-most-hospital-beds-per-capita"
    icon: "fa-solid fa-bed-pulse"
    title: "States With the Most Hospital Beds Per Capita"
    paragraphs:
      - "South Dakota leads with 4.37 hospital beds per 1,000 residents, well above the 2.28 national average. North Dakota is second at 4.05, and West Virginia is third at 3.63."
      - "Mississippi (3.58) and Nebraska (3.34) round out the top five. Four of the top five states, South Dakota, North Dakota, Nebraska, and Montana at 3.26, are Great Plains states with small, spread-out populations relative to their hospital infrastructure."

  - id: "states-with-the-fewest-hospital-beds-per-capita"
    icon: "fa-solid fa-hospital"
    title: "States With the Fewest Hospital Beds Per Capita"
    paragraphs:
      - "Washington has the lowest hospital bed density at 1.57 per 1,000 residents, about a third of South Dakota's 4.37. Oregon is second-lowest at 1.64, and New Mexico is third-lowest at 1.67."
      - "Utah (1.68) and Maryland (1.71) complete the bottom five. All five lowest-density states fall at least 0.5 beds per 1,000 below the 2.28 national average."

