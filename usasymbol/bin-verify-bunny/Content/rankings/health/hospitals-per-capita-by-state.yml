page:
  h1: "Hospital Beds Per Capita by State"

  quick_answer:
    - "South Dakota has the highest hospital bed density at 4.37 beds per 1,000 residents, followed by North Dakota at 4.05 and West Virginia at 3.63."
    - "Washington has the lowest bed density at 1.57 per 1,000 residents, followed by Oregon at 1.64 and New Mexico at 1.67."
    - "The U.S. average is 2.28 beds per 1,000 residents. South Dakota's rate is nearly triple Washington's, the widest gap on the list."

  methodology: "Figures show total hospital beds per 1,000 residents, the standard capacity metric used by KFF, not a count of hospital facilities. Data reflects 2024 KFF State Health Facts figures. The District of Columbia's rate of 4.19 appears in the source but is excluded here because this page ranks the 50 states only."

  sources:
    - name: "KFF (Kaiser Family Foundation) — Hospital Beds per 1,000 Population by Ownership Type"
      url: "https://www.kff.org/state-health-policy-data/state-indicator/beds-by-ownership/"
      description: "State-by-state total hospital beds per 1,000 population, 2024"

