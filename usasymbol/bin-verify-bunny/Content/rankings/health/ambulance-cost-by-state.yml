faq:
  - question: "Which state has the most expensive ambulance in 2026?"
    answer: "Hawaii has the highest ambulance costs in the country, averaging $2,473 for basic life support and $2,426 for advanced life support. No other state exceeds $2,100 for either service type. California ranks second at $1,854 for BLS."

  - question: "Which state has the cheapest ambulance ride?"
    answer: "Alabama averages $1,266 for BLS and $1,412 for ALS, both the lowest in the data. The spread between Alabama's BLS rate and Hawaii's is $1,207."

  - question: "How much does an ambulance cost in California?"
    answer: "California averages $1,854 for basic life support and $2,040 for advanced life support, the only state besides Hawaii where ALS exceeds $2,000. At $1,854 for BLS, it ranks second in the country."

  - question: "What does an ambulance cost in Texas?"
    answer: "Texas averages $1,345 for basic life support and $1,498 for advanced life support, ranking 37th among the 50 states for BLS cost. ALS runs $153 above BLS in Texas."

  - question: "How much does an ambulance cost in New York?"
    answer: "New York averages $1,592 for BLS and $1,697 for ALS, ranking 9th highest nationally for basic service. The ALS rate is $105 above the BLS rate."

  - question: "Which states have the smallest gap between BLS and ALS ambulance costs?"
    answer: "Iowa has the smallest positive gap, with ALS averaging just $56 above BLS ($1,299 BLS, $1,355 ALS). Mississippi is next at $60. Hawaii is the only state where BLS exceeds ALS, by $47."

