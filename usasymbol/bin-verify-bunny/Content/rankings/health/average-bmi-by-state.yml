faq:
  - question: "Which state has the highest combined overweight and obesity rate?"
    answer: "West Virginia has the highest rate of any state, 74.4% of adults with a BMI of 25 or higher, combining its 41.0% obesity rate and 33.4% overweight rate."

  - question: "Which state has the lowest combined overweight and obesity rate?"
    answer: "Hawaii has the lowest rate of any state at 59.7%. Colorado is next lowest at 60.6%, and Vermont follows at 60.9%."

  - question: "How is this different from the obesity rate ranking?"
    answer: "This ranking adds the overweight category (BMI 25.0 to 29.9) to the obesity category (BMI 30 or higher), while a separate obesity ranking covers BMI 30 or higher alone."

  - question: "Where does Texas rank for combined overweight and obesity?"
    answer: "Texas ranks 18th at 70.2%, made up of 35.5% obese and 34.7% overweight but not obese."

  - question: "Which state has the widest gap between overweight and obese adults?"
    answer: "New Jersey has the widest gap favoring the lighter category, 36.7% overweight but not obese versus 29.1% obese, a 7.6-point spread."

  - question: "Where does California rank for combined overweight and obesity?"
    answer: "California ranks 46th at 62.8%, one of the ten lowest states, split between 28.1% obese and 34.7% overweight but not obese."

