page:
  h1: "Overweight and Obesity Rate by State"

  quick_answer:
    - "West Virginia has the highest combined share of adults with overweight or obesity of any state, 74.4% with a body mass index of 25 or higher, per 2022 CDC data."
    - "Oklahoma ranks second at 72.3%, and Mississippi and South Dakota tie for third at 72.2%. All four states exceed 72%, more than 14 points above Hawaii's rate."
    - "Hawaii has the lowest combined rate of any state at 59.7%, followed by Colorado at 60.6% and Vermont at 60.9%."

  methodology: "Figures combine 2022 CDC BRFSS shares of adults classified as overweight (BMI 25.0 to 29.9) and obese (BMI 30 or higher), a different measure than obesity rate alone. DC and territories are excluded."

  sources:
    - name: "CDC — Nutrition, Physical Activity, and Obesity (BRFSS)"
      url: "https://data.cdc.gov/Nutrition-Physical-Activity-and-Obesity/Nutrition-Physical-Activity-and-Obesity-Behaviora/hn4x-zwk7"
      description: "State-level share of adults classified as overweight and as obese, Behavioral Risk Factor Surveillance System, 2022"
