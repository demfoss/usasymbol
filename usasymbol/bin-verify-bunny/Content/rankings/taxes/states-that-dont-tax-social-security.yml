page:
  h1: "States That Don't Tax Social Security"

  quick_answer:
    - "Eight states tax Social Security benefits in 2026. Colorado, Connecticut, Minnesota, Montana, New Mexico, Rhode Island, Utah, and Vermont each set an income threshold before any tax applies."
    - "Minnesota sets the highest exemption ceiling, fully excluding benefits for joint filers with AGI up to $110,780 and partial relief up to $150,780. Montana's threshold is the lowest, ending full exemption at just $32,000 for joint filers."
    - "West Virginia taxed Social Security as recently as 2024, but the state fully exempts it starting with the 2026 tax year. That leaves 42 of the 50 states, including West Virginia, with no state tax on the benefit."

  methodology: "Tax status and thresholds reflect state tax code as of the 2026 tax year, sourced from Kiplinger's state-by-state review and AARP's Social Security tax guide. Thresholds shown are adjusted gross income (AGI) limits that determine full or partial exemption, and rates listed are each state's top marginal income tax rate on ordinary income."

  sources:
    - name: "Kiplinger. States That Tax Social Security Benefits in 2026"
      url: "https://www.kiplinger.com/taxes/states-that-tax-social-security-benefits"
      description: "State-by-state list of Social Security benefit taxation rules, income thresholds, and 2026 changes"
    - name: "AARP. Some States Tax Your Social Security Benefits"
      url: "https://www.aarp.org/social-security/faq/which-states-do-not-tax-benefits/"
      description: "Summary of state income thresholds and tax rates applied to Social Security benefits"

