sections:
  - id: "states-that-tax-social-security-benefits"
    icon: "fa-solid fa-piggy-bank"
    title: "States That Tax Social Security Benefits"
    paragraphs:
      - "Eight states still tax Social Security benefits in 2026. They are Colorado, Connecticut, Minnesota, Montana, New Mexico, Rhode Island, Utah, and Vermont, and each sets an income threshold before any tax applies."
      - "Minnesota's top rate reaches 9.85%, the highest among the eight states, while Utah taxes benefits at a flat 4.5%. Colorado exempts all Social Security income for residents 65 and older, regardless of how much they earn."

  - id: "states-with-the-highest-social-security-tax-thresholds"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest Social Security Tax Thresholds"
    paragraphs:
      - "Minnesota sets the highest exemption ceiling among the eight taxing states. Joint filers keep a full exemption up to $110,780 in AGI, with partial relief extending to $150,780. New Mexico is close behind, fully exempting joint filers earning up to $150,000."
      - "Montana sets the lowest threshold in the table. Joint filers there lose their full exemption at just $32,000 in AGI, and up to 85% of benefits become taxable above $44,000."

  - id: "west-virginias-social-security-tax-exemption"
    icon: "fa-solid fa-arrow-trend-down"
    title: "West Virginia's Social Security Tax Exemption"
    paragraphs:
      - "West Virginia taxed Social Security benefits as recently as 2024. Its multi-year phaseout is now complete, and the benefit is fully exempt starting with the 2026 tax year, joining 41 other states in the table with no state tax on Social Security."

