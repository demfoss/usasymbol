sections:
  - id: "highest-state-sales-tax-rates"
    icon: "fa-solid fa-percent"
    title: "States With the Highest Sales Tax Rate"
    paragraphs:
      - "California has the highest state-level sales tax rate in the country at 7.25%, which includes a mandatory 1.25% statewide local add-on baked into the state rate itself. Indiana, Mississippi, Rhode Island, and Tennessee tie for second at 7.00%, each without a mandatory local add-on. Once local taxes are averaged in, Tennessee's combined rate climbs to 9.61%, while Louisiana's 5.00% state rate reaches an even higher 10.11% combined."
      - "Minnesota (6.875%), New Jersey (6.625%), and Nevada (6.85%) round out the states above 6.6%. New Jersey's 6.625% rate is unusual because the state's average local rate is -0.02%, since Urban Enterprise Zones collect at half the state rate rather than adding to it."

  - id: "states-with-no-sales-tax"
    icon: "fa-solid fa-ban"
    title: "States With No Statewide Sales Tax"
    paragraphs:
      - "Five states charge no statewide sales tax: Alaska, Delaware, Montana, New Hampshire, and Oregon. Delaware, Montana, New Hampshire, and Oregon all show a 0.00% combined rate, meaning no sales tax applies at any level of government."
      - "Alaska is the exception. Its state rate is also 0.00%, but its average combined rate is 1.82% because many Alaska municipalities levy their own local sales taxes with no statewide law preempting them, unlike the other four zero-rate states where no local sales tax exists either."

  - id: "state-rate-vs-combined-rate"
    icon: "fa-solid fa-scale-balanced"
    title: "State Sales Tax Rate vs. Combined Rate by State"
    paragraphs:
      - "Colorado has the lowest nonzero state rate at 2.90%, but its 4.99% average local rate pushes its combined rate to 7.89%, higher than 20 other states with larger state rates. Louisiana's 5.00% state rate looks moderate on its own, yet its 5.11% average local rate produces the highest combined rate in the country at 10.11%."
      - "The state rate alone understates the real cost at checkout in states with high local add-ons. Missouri's 4.225% state rate nearly doubles to 8.44% combined, and Oklahoma's 4.50% state rate reaches 9.06% combined. A shopper comparing states by the headline state rate alone can be misled about the total sales tax charged at the register."

