faq:
  - question: "What is the sales tax rate by state?"
    answer: "State-level general sales tax rates range from 0.00% in five states to 7.25% in California. The table above lists the state rate, average local rate, and combined average rate for all 50 states as of the Tax Foundation's 2026 report."

  - question: "Which state has the highest sales tax rate?"
    answer: "California has the highest state-level sales tax rate at 7.25%. Indiana, Mississippi, Rhode Island, and Tennessee are next, each at 7.00%."

  - question: "Which states have no sales tax?"
    answer: "Alaska, Delaware, Montana, New Hampshire, and Oregon charge no statewide sales tax. Delaware, Montana, New Hampshire, and Oregon also have a 0.00% average combined rate, while Alaska's combined rate is 1.82% because of local sales taxes."

  - question: "Why does Alaska charge sales tax if it has no state sales tax?"
    answer: "Alaska sets no statewide sales tax, but the state does not prevent municipalities from levying their own local sales tax. That local-option system produces Alaska's 1.82% average combined rate, even though its state rate is 0.00%, the same as Delaware, Montana, New Hampshire, and Oregon."

  - question: "What state has the lowest sales tax rate that isn't zero?"
    answer: "Colorado has the lowest nonzero state rate at 2.90%. Its average local rate of 4.99% is high enough to bring its combined rate to 7.89%, which is above the combined rate of 20 states with a higher state rate."

  - question: "What is the difference between the state rate and the combined sales tax rate?"
    answer: "The state rate is the tax set by state law alone. The combined rate adds the population-weighted average local sales tax on top of it. Louisiana's state rate is 5.00%, but its 5.11% average local rate gives it the highest combined rate nationally at 10.11%."

