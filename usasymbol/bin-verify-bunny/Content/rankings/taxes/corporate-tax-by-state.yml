faq:
  - question: "Which state has the highest corporate tax rate?"
    answer: "New Jersey has the highest top corporate tax rate at 11.5%, applied to net income above $10 million. Minnesota (9.8%) and Illinois (9.5%) are the next highest."

  - question: "Which states have no corporate income tax?"
    answer: "South Dakota and Wyoming are the only states with no corporate income tax of any kind. Nevada, Ohio, Texas, and Washington also skip it, but each taxes gross receipts instead, including Ohio's Commercial Activity Tax and Texas's franchise (margin) tax."

  - question: "What is the corporate tax rate in North Carolina?"
    answer: "North Carolina's flat corporate tax rate is 2.0%, the lowest rate among states that levy one."

  - question: "Does Texas have a corporate income tax?"
    answer: "Texas has no corporate income tax. Texas uses a franchise tax on margin, while Ohio uses a Commercial Activity Tax on gross receipts."

  - question: "How many states levy a corporate income tax?"
    answer: "44 states levy a corporate income tax, with an average top marginal rate of 6.57% and a median rate of 6.50%."

  - question: "What is the corporate tax rate in California?"
    answer: "California's flat corporate tax rate is 8.84%, the sixth-highest rate on this list."

