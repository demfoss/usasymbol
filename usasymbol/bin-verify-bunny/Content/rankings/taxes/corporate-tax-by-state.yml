page:
  h1: "Corporate Tax by State"

  quick_answer:
    - "New Jersey has the highest top corporate tax rate in the country at 11.5%, reaching that rate on net income above $10 million."
    - "North Carolina has the lowest rate among states that still tax corporate income, a flat 2.0%, less than half the next-lowest rates of 4.0% in Missouri and Oklahoma."
    - "South Dakota and Wyoming levy no corporate income tax at all. Nevada, Ohio, Texas, and Washington also skip a corporate income tax but tax gross receipts instead."

  methodology: "Top rates reflect each state's highest marginal corporate income tax bracket, per the Tax Foundation's state corporate tax table current as of January 5, 2026. States marked Gross Receipts Only or No Corporate Tax do not levy a corporate income tax."

  sources:
