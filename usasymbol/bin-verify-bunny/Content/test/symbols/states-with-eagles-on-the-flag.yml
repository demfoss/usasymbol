  quick_answer:
    - "Eight US state flags feature a bald eagle: Illinois, New York, Pennsylvania, Utah, North Dakota, Iowa, Michigan, and Oregon."
    - "Oregon's eagle appears only on the obverse (front) side of its two-sided flag — the reverse displays the state beaver."
    - "Two US territories also feature eagles on their flags: American Samoa and the US Virgin Islands."
    - "North Dakota's flag most closely resembles the Great Seal of the United States, featuring a bald eagle with an olive branch and arrows."

