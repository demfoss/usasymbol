sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "Interactive Map: US States Featuring Eagles on Their Flags"
    paragraphs:
      - "The map below highlights the eight US states whose flags feature a bald eagle, distributed across the Midwest, Northeast, and Pacific Northwest. Use it to see how America's national bird spread through state vexillology from the 1780s onward."
      - "Eagle-flag states cluster notably in the Great Lakes and Mid-Atlantic regions, reflecting the strong influence of the original thirteen colonies' heraldic traditions on early state seal design."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "Quick Reference Table: States & Territories with Eagle Flags"
    paragraphs:
      - "The table below provides a fast comparison of all eight states — and two US territories — whose flags feature an eagle, including placement, symbolism, and the year the flag was adopted."
      - "Use it as a quick reference to distinguish the subtle differences between each state's eagle: from Iowa's flying eagle on a tricolor to Oregon's seal-bound eagle visible only on the obverse side."

  - id: illinois-eagle-flag
    icon: "fa-solid fa-feather"
    img: illinois-eagle-detail
    title: "Illinois: Eagle of State Sovereignty"
    paragraphs:
      - "Illinois's state flag features the **state seal** at the center of a white background, with a bald eagle as its dominant symbol. The eagle is perched on a rock, clutching a **shield** bearing the design of the US flag — thirteen stars and stripes — and a ribbon in its beak reading **'State Sovereignty, National Union.'** Below the rock runs a banner with the date '1818' (the year of Illinois statehood) and the state name."
      - "The seal design dates to 1868, when Secretary of State Sharon Tyndale redesigned it to more closely align with national symbolism. The state flag was first adopted in 1915, but for 55 years it carried no text. In 1970, after a campaign by Sharon Price — a schoolteacher whose son serving in Vietnam noted that fellow soldiers couldn't identify the Illinois flag among the many blue-field designs — the word **'ILLINOIS'** was added in blue lettering. It is one of the few flags whose name was added as a direct result of wartime advocacy."
    subsections:
      - subtitle: "History of the Illinois State Flag"
        text: "Illinois adopted its state flag in 1915, based on the 1868 state seal. The flag is white with the state seal — centered on the bald eagle — displayed prominently. The 1970 update added 'ILLINOIS' below the seal, making the flag instantly identifiable even at a distance. Illinois's white-background design stands out among the many blue-background seal flags of the era. See the [Illinois bald eagle flag history and meaning](/states/illinois/flag/illinois-state-flag) for the full story."

  - id: new-york-eagle-flag
    icon: "fa-solid fa-shield"
    title: "New York: The Eagle Atop the Globe"
    paragraphs:
      - "New York's state flag places the **state coat of arms** at the center of a deep blue background. The bald eagle serves as the **crest** — perched atop a globe at the very apex of the heraldic design, wings outstretched, gazing to its right. The globe beneath the eagle represents the Western Hemisphere, a nod to New York's historic role as a global center of commerce and diplomacy."
      - "The coat of arms dates to 1778 — just two years after independence — making New York's eagle one of the oldest in American state heraldry. Below the shield, two female figures representing **Liberty** (holding a pole and a Phrygian cap) and **Justice** (blindfolded, holding scales) flank the design. The ribbon at the bottom carries New York's motto: *Excelsior* ('Ever upward'). The flag was officially adopted in 1901 and updated in 2020 with 'E Pluribus Unum' added to the seal."
    subsections:
      - subtitle: "History of the New York State Flag"
        text: "New York's coat of arms was adopted in 1778, one of the earliest official state heraldic designs in American history. The state flag incorporating the coat of arms was officially adopted in 1901. A 2020 update added 'E Pluribus Unum' to the seal while preserving the 1901 coat-of-arms design intact. The eagle's globe perch distinguishes New York's design from the more literal Great-Seal-inspired eagles of North Dakota and Iowa."

  - id: pennsylvania-eagle-flag
    icon: "fa-solid fa-horse"
    title: "Pennsylvania: The Eagle as Crest"
    paragraphs:
      - "Pennsylvania's state flag is a deep blue field bearing the **state coat of arms**. The bald eagle appears at the very top as the **crest** of the heraldic achievement — positioned above the shield, wings fully spread. Two horses serve as shield-holders below, and the central shield depicts a ship, a plow, and three sheaves of wheat — symbols of Pennsylvania's maritime and agricultural heritage."
      - "Pennsylvania's coat of arms was first adopted in 1778 — four years before the Great Seal established the bald eagle as the national emblem — making Pennsylvania's eagle one of the oldest in continuous American state heraldry. The flag was officially adopted in 1907. The design has remained essentially unchanged for nearly 250 years."
    subsections:
      - subtitle: "History of the Pennsylvania State Flag"
        text: "Pennsylvania adopted its current state flag in 1907, with the coat of arms dating to 1778. The two draught horses flanking the shield represent Pennsylvania's working agricultural and commercial economy. The bald eagle crest crowning the design reflects the same national heraldic conventions that shaped the Great Seal adopted just four years later in 1782 — placing Pennsylvania's eagle among the oldest in continuous American vexillological use."

  - id: utah-eagle-flag
    icon: "fa-solid fa-mountain"
    title: "Utah: Eagle on the Pre-2024 Flag"
    paragraphs:
      - "Utah's flag from 1913 to 2024 featured the **state seal** on a blue background, with a bald eagle with outspread wings above the central beehive — a symbol of pioneer industry. Below the eagle, the beehive was flanked by sego lilies, '1847' (pioneer arrival), and '1896' (statehood). In **2024, Utah adopted a redesigned flag** that replaced the seal-on-blue design. The eagle no longer appears as a primary design element on Utah's current official flag. See the [Utah state flag](/states/utah/flag/utah-state-flag) for the current design and what replaced it."

  - id: north-dakota-eagle-flag
    icon: "fa-solid fa-star"
    img: north-dakota-eagle-detail
    title: "North Dakota: The Great Seal Eagle"
    paragraphs:
      - "North Dakota's state flag is among the most eagle-prominent of all 50 states. The **bald eagle** dominates the entire design — a direct inheritance from the regimental flag of the First North Dakota Infantry, which carried the design into battle during the Spanish-American War in 1898. The eagle holds an **olive branch** in its right talon and a **bundle of arrows** in its left — the same symbolic pairing found on the Great Seal of the United States, representing peace and military readiness."
      - "A **shield** bearing thirteen stripes covers the eagle's chest, and a red, white, and blue ribbon in its beak reads **'E Pluribus Unum'** ('Out of Many, One'). A fan of thirteen stars arcs above the eagle's head — one for each original colony. Below the eagle, a scroll reads 'North Dakota.' The flag was adopted in 1911 and standardized in 1943. Of all the eagle-flag states, North Dakota's is the most faithful reproduction of the **national emblem** — less a state seal eagle and more an open declaration of federal patriotism."
    subsections:
      - subtitle: "History of the North Dakota State Flag"
        text: "North Dakota's flag traces directly to the regimental colors of the First North Dakota Infantry during the Spanish-American War of 1898. When the state legislature adopted the flag in 1911, they based it on those battle colors — which themselves drew from the Great Seal of the United States. The flag was standardized in 1943. The result is a flag that wears its patriotism openly: every element — eagle, arrows, olive branch, shield, and stars — maps directly onto the founding document of American national identity."

  - id: iowa-eagle-flag
    icon: "fa-solid fa-ribbon"
    img: iowa-flag-eagle
    title: "Iowa: The Flying Eagle of the Tricolor"
    paragraphs:
      - "Iowa's flag is one of the most visually distinctive among eagle-flag states. Rather than placing the eagle within a **state seal**, Iowa's flag is a **vertical tricolor** of blue, white, and red stripes — a deliberate homage to France, in honor of Iowa's territory having once been part of French Louisiana. On the white center stripe, a **bald eagle** soars with wings spread, carrying in its beak a blue ribbon inscribed with the state motto: **'Our Liberties We Prize and Our Rights We Will Maintain.'**"
      - "Designed by Dixie Cornell Gebhardt of the Daughters of the American Revolution and officially adopted in 1921, Iowa's flag is the only eagle-flag state to separate the eagle entirely from a state seal. The eagle floats freely on the flag — no shield, no boulder, no coat of arms surrounding it. Just the bird and the motto it carries. This clean, heraldically confident design makes Iowa's eagle immediately recognizable among the seal-heavy eagle flags of its neighbors."
    subsections:
      - subtitle: "History of the Iowa State Flag"
        text: "Iowa's flag was designed by Dixie Cornell Gebhardt of the Iowa chapter of the Daughters of the American Revolution, who sought a flag that honored Iowa's French territorial heritage while centering an unmistakably American symbol. Adopted by the Iowa General Assembly in 1921, the flag's tricolor stripes recall the French Tricolore — but the bald eagle at the center leaves no doubt about Iowa's American identity. See the [Iowa tricolor eagle flag design and history](/states/iowa/flag/iowa-state-flag) for full details."

  - id: michigan-eagle-flag
    icon: "fa-solid fa-water"
    title: "Michigan: Eagle Above the Great Lakes Shield"
    paragraphs:
      - "Michigan's state flag carries the **state coat of arms** at the center of a dark blue background. The bald eagle serves as the **crest**, positioned above the shield with wings outspread, holding an **olive branch** in one talon and a **bundle of arrows** in the other — the same peace-and-strength pairing as the Great Seal. The central shield shows a man on a peninsula pointing toward the sun rising over a lake, with the motto *Tuebor* ('I Will Defend') beneath him."
      - "Two heraldic animals flank the shield as supporters: an **elk** on the left and a **moose** on the right. The coat of arms carries three mottos: *Si Quaeris Peninsulam Amoenam, Circumspice* ('If you seek a pleasant peninsula, look about you'), *E Pluribus Unum*, and *Tuebor*. Michigan's flag, adopted in 1911, packs three animals, three mottos, a peninsula reference, and a sunrise into a single heraldic composition. The bald eagle at the apex connects the design to the national emblem; the elk, moose, and peninsular motto lock it to Michigan specifically."
    subsections:
      - subtitle: "History of the Michigan State Flag"
        text: "Michigan's coat of arms was designed in 1835, the year before statehood. The state flag incorporating the coat of arms was officially adopted in 1911. Like many Great Lakes states, Michigan chose the seal-on-blue convention but invested the design with layers of local meaning — the elk, moose, and peninsula motto make Michigan's flag distinctive even within that category. Michigan's two heraldic animals as shield-holders are comparable to Missouri's two grizzly bears — see [US state flags with bears](/collections/flags/states-with-bears-on-the-flag) for a direct comparison of how animals function in American state heraldry."

  - id: oregon-eagle-flag
    icon: "fa-solid fa-arrows-rotate"
    img: oregon-flag-obverse
    title: "Oregon: The Eagle on the Obverse Side Only"
    paragraphs:
      - "Oregon's relationship with the eagle is the most unusual of any eagle-flag state. Oregon is the **only US state with a different design on each side of its flag**. The **obverse side** (front) features the state seal on a navy blue background — and at the top of that seal sits a bald eagle, wings spread, perched above a shield depicting the Pacific Ocean, mountains, a covered wagon, forests, and an elk. But turn the flag over, and the eagle is gone: the **reverse side** shows only a golden **beaver** — Oregon's state animal — on the same navy field."
      - "This means Oregon's eagle exists only on the **obverse side state seal** — never on the reverse, never as a standalone element. The flag was adopted in 1925 and is the most expensive US state flag to manufacture, precisely because both sides must be distinctly printed. Oregon's eagle is thus the most conditional of all state eagles: it depends entirely on which face of the flag you are viewing. See the [Oregon two-sided flag eagle and beaver design](/states/oregon/flag/oregon-state-flag) for the complete story."
    subsections:
      - subtitle: "History of the Oregon State Flag"
        text: "Oregon adopted its state flag in 1925 with 'State of Oregon' and '1859' (the year of statehood) in gold lettering on the obverse, below the state seal. The reverse beaver design was added to make the flag identifiable from both sides on parade floats and flagpoles. No other US state flag has two completely different designs. Oregon's bald eagle — positioned at the top of the obverse seal — is historically tied to the same Great Seal conventions that shaped Michigan's and Pennsylvania's eagle crests."

  - id: territories-eagle-flags
    icon: "fa-solid fa-globe-americas"
    title: "US Territories with Eagle Flags"
    paragraphs:
      - "Beyond the 50 states, two US territories prominently feature eagles on their official flags: American Samoa and the US Virgin Islands. Both use the eagle to signal their political relationship with the United States, but each adapts the national emblem to reflect local identity."
    subsections:
      - subtitle: "American Samoa"
        text: "American Samoa's flag features a **bald eagle** in flight with wings spread across a blue and red background, holding two traditional Samoan objects: a **war club** (*uatogi*) in one talon and a **fly whisk** (*fue*) in the other. The fly whisk represents the wisdom of traditional Samoan chiefs; the war club represents the power of the state. The eagle itself symbolizes the protection of the United States. Adopted in 1960, American Samoa's flag is one of the most culturally distinctive eagle flags in the American system — a true bicultural emblem that bridges Polynesian tradition and American sovereignty."
      - subtitle: "US Virgin Islands"
        text: "The US Virgin Islands flag features a simplified version of the **US coat of arms**: a golden bald eagle displayed on a white background, holding a laurel branch and three arrows — a reduced form of the thirteen arrows from the Great Seal. Flanking the eagle are the letters **'V'** and **'I'** in yellow, standing for 'Virgin Islands.' Adopted in 1921, the design is a direct declaration of the territory's American identity, introduced shortly after the United States purchased the islands from Denmark in 1917. The minimalist eagle design makes the VI flag one of the clearest expressions of the **national emblem** in any US territory flag."

  - id: why-eagles
    icon: "fa-solid fa-landmark"
    title: "Why Is the Bald Eagle on So Many State Flags?"
    paragraphs:
      - "The answer begins in 1782 with the adoption of the **Great Seal of the United States**. Congress placed the bald eagle at the center of the seal because it is native only to North America — a creature of this continent alone, carrying no Old World heraldic baggage. The eagle clutches an **olive branch** in its right talon (peace) and a **bundle of arrows** in its left (military readiness) — a pairing that expressed the new nation's dual commitment to diplomacy and defense."
      - "As states created their own seals and coats of arms in the late 18th and early 19th centuries, they naturally looked to the **national emblem** for inspiration. The bald eagle on a state seal was a declaration of loyalty to the republic — a heraldic statement that the state was part of something larger than itself. This tradition deepened through the era of **Indian Peace Medals**, on which the bald eagle was the central image gifted by the US government to Native American leaders as a symbol of American sovereignty and the promise of peace."
      - "When states began formally adopting flags in the late 19th and early 20th centuries, most placed their existing **state seal** on a blue field. Because the eagle was already in those seals, it migrated onto the flags without anyone making a deliberate new choice. Eight states effectively chose the bald eagle for their flags in the 1780s and 1790s — they just didn't have flags yet to put it on."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Eagle Flags"
    facts:
      - "8 of 50 US state flags feature a bald eagle — more than any other single animal on US state flags"
      - "North Dakota's eagle is the closest to the Great Seal design, complete with olive branch, arrows, and 'E Pluribus Unum' ribbon"
      - "Oregon's eagle appears only on the obverse (front) of its two-sided flag — the only state where the eagle is conditionally visible"
      - "Iowa's eagle is the only one not contained within a state seal — it flies freely across the center stripe of a tricolor"
      - "The bald eagle was officially designated the US national emblem in 1782 via the Great Seal"
      - "American Samoa's eagle holds Polynesian traditional objects — a unique cultural synthesis in US flag heraldry"
      - "The US Virgin Islands adopted their eagle flag in 1921, just four years after the US purchased the islands from Denmark"
      - "The eagle on the Great Seal faces right toward the olive branch (peace) — a detail reproduced on many state seal eagles"
      - "Benjamin Franklin famously preferred the turkey over the eagle as a national symbol, calling the eagle 'of bad moral character'"


faq:
  - question: "Which US state flags have an eagle on them?"
    answer: |
      Eight US state flags feature a bald eagle:
      - **Illinois** — eagle on state seal, perched on a rock holding a shield and motto ribbon
      - **New York** — eagle as crest atop a globe on the state coat of arms
      - **Pennsylvania** — eagle as crest above the state coat of arms
      - **Utah** — eagle above the state seal beehive on the pre-2024 flag (Utah redesigned its flag in 2024; verify current design)
      - **North Dakota** — eagle closely modeled on the Great Seal, with olive branch and arrows
      - **Iowa** — eagle in flight on the center stripe of a tricolor, carrying the state motto
      - **Michigan** — eagle as crest above the state coat of arms, holding olive branch and arrows
      - **Oregon** — eagle on the obverse (front) state seal only; the reverse shows a beaver

  - question: "Does the Oregon flag have an eagle?"
    answer: "Yes — but only on one side. Oregon's flag is the only US state flag with two completely different designs: the obverse (front) features the state seal, which includes a bald eagle at the top of the shield. The reverse shows only a golden beaver. Oregon's eagle is visible only when you are looking at the front of the flag — making it the most conditional eagle on any US state flag. Technically present, but only on the obverse side."

  - question: "Which US state flag most closely reproduces the Great Seal eagle?"
    answer: "North Dakota. Its flag is the closest reproduction of the Great Seal bald eagle among all 50 states — the eagle dominates the entire design with a shield bearing thirteen stripes, an olive branch and arrows, and an 'E Pluribus Unum' ribbon. The design traces directly to the regimental colors of the First North Dakota Infantry (Spanish-American War, 1898), which itself drew from the Great Seal."

  - question: "Which US territories have eagles on their flags?"
    answer: "Two US territories feature eagles on their flags: American Samoa and the US Virgin Islands. American Samoa's eagle holds traditional Samoan objects — a war club and fly whisk — blending national and indigenous symbolism. The US Virgin Islands flag shows a simplified US coat-of-arms eagle flanked by the letters 'V' and 'I.'"

  - question: "Why does the bald eagle appear on so many state flags?"
    answer: "The bald eagle became the national emblem of the United States in 1782 via the Great Seal. As states designed their seals and coats of arms in the late 18th and 19th centuries, they drew from the Great Seal for inspiration and patriotic alignment. When states began adopting official flags in the late 1800s and early 1900s, they typically placed their existing state seal on a blue background — and because those seals already featured eagles, the eagle migrated onto the flags by extension."

  - question: "What do the olive branch and arrows mean on eagle flags?"
    answer: "The olive branch (held in the eagle's right talon) represents peace and diplomacy. The bundle of arrows (held in the left talon) represents military strength and readiness to defend the nation. This pairing originated on the Great Seal of the United States (1782) and was reproduced on many state seal eagles, including North Dakota, Michigan, and Iowa. Together, they express the dual nature of American governance: the preference for peace with the capacity for war."

  - question: "Is the bald eagle on state flags the same as the Great Seal eagle?"
    answer: "Not always — but many are inspired by it. North Dakota's eagle is the closest reproduction of the Great Seal design, with the shield, olive branch, arrows, and 'E Pluribus Unum' ribbon all faithfully represented. Iowa's eagle also carries a motto ribbon, similar to the Great Seal. Other states (Illinois, New York, Pennsylvania, Michigan) have eagles that draw from the same heraldic tradition but with state-specific variations in posture, accessories, and context."

  - question: "How many US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals — as central symbols or within incorporated state seals. The bald eagle is the single most common, appearing on 8 flags. Beyond birds, notable examples include California and Missouri (grizzly bears), Wyoming (American bison), and Louisiana (brown pelican). For the complete breakdown of all 50 designs, see the dedicated guide to all US state flags with animals."
