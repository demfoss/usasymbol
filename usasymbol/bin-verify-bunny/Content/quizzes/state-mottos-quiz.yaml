title: "State Mottos Quiz"
slug: "state-mottos-quiz"
description: "Practice all 50 state mottos with a quiz that covers Latin,
  French, Spanish, Italian, Hawaiian, and English phrases."

difficulty: "Hard"
estimated_time: "10–15 min"

tags:
  [
    "state mottos quiz",
    "latin state mottos quiz",
    "us state motto trivia",
    "guess the state by motto"
  ]

seo:
  title: "U.S. State Mottos Quiz"
  description: "Match every U.S. state motto to the right state in a quiz with
    translations and short background notes."
  intro_paragraphs:
    - "Can you match 'Ad astra per aspera' to Kansas, 'Alis volat propriis' to
      Oregon, or 'Dirigo' to Maine? Each question shows a state motto and asks
      which state it belongs to."
    - "Some questions show the original Latin, French, Spanish, or Hawaiian
      text. Others give you the English translation and ask you to work
      backward. Both directions test different kinds of knowledge."
    - "State mottos are one of the most overlooked corners of American history —
      packed with philosophy, politics, and centuries-old ambition. A few rounds
      here go a long way."

content:
  sections:
    - id: "how-it-works"
      title: "How the State Mottos Quiz Works"
      paragraphs:
        - "Each question shows a state motto — either in its original language
          or in English translation — and asks you to identify the state it
          belongs to."
        - "Questions alternate between two formats: original text (Latin,
          French, Spanish, etc.) and English translation. Both directions
          require different knowledge."
        - "After each answer, you'll see the full translation, the original
          language, when it was adopted, and the history behind the phrase."

    - id: "languages"
      title: "Which Languages Appear on U.S. State Mottos?"
      paragraphs:
        - "U.S. state mottos come from more languages than most people expect."
      list:
        - "Latin — the most common, used by over 20 states, including Virginia
          ('Sic semper tyrannis'), Kansas ('Ad astra per aspera'), and Michigan
          ('Si quaeris peninsulam amoenam, circumspice')."
        - "English — used by about half the states, with mottos ranging from the
          simple ('Hope' — Rhode Island, 'Forward' — Wisconsin) to the elaborate
          ('Our Liberties We Prize and Our Rights We Will Maintain' — Iowa)."
        - "French — Minnesota's 'L'Étoile du Nord' (The Star of the North)
          reflects the state's French fur-trade heritage."
        - "Spanish — Montana's 'Oro y plata' (Gold and silver) nods to the
          state's mining history and Spanish influence in the West."
        - "Italian — Maryland's 'Fatti maschii, parole femine' (Manly deeds,
          womanly words) is the motto of the Calvert family, Maryland's founding
          proprietors."
        - "Hawaiian — Hawaii's motto is the longest of any state: 'Ua Mau ke Ea
          o ka Āina i ka Pono' (The Life of the Land Is Perpetuated in
          Righteousness)."
        - "Greek — California's 'Eureka' (I have found it) comes from Greek,
          referencing the Gold Rush discovery of 1848."
        - "Chinook Jargon — Washington's 'Al-ki' (By and by, or hope for the
          future) is the only state motto in a Native American trade language."

    - id: "famous-mottos"
      title: "The Most Famous and Most Obscure State Mottos"
      paragraphs:
        - "Some mottos are world-famous. Others are almost completely unknown —
          even to residents of the state."
      list:
        - "Most recognized: 'Live Free or Die' (New Hampshire) — from a
          Revolutionary War toast by General John Stark."
        - "Most dramatic: 'Sic semper tyrannis' (Virginia) — 'Thus Always to
          Tyrants.' John Wilkes Booth reportedly shouted it after shooting
          Lincoln."
        - "Most philosophical: 'Esse quam videri' (North Carolina) — 'To be
          rather than to seem,' from Cicero's essay on friendship."
        - "Most obscure: 'Crescit eundo' (New Mexico) — 'It grows as it goes,'
          from the Roman poet Lucretius."
        - "Most self-referential: 'Si quaeris peninsulam amoenam, circumspice'
          (Michigan) — 'If you seek a pleasant peninsula, look about you.'
          Michigan is literally surrounded by the Great Lakes."

    - id: "more-quizzes"
      title: "More U.S. State Symbol Quizzes"
      paragraphs:
        - "Once you've worked through all 50 state mottos, there's more to
          explore. Try the state seals quiz — mottos appear on most seals — or
          the license plate slogans quiz for the informal side of state
          identity."
        - "You can also test yourself on state flags, state capitals, state
          nicknames, and other official symbols."

faq:
  - question: "How many state mottos are in Latin?"
    answer: "Over 20 U.S. states have Latin mottos — more than any other language.
      They range from one word ('Dirigo' — Maine) to full philosophical
      sentences (Massachusetts's 15-word motto from a Roman epic poem)."

  - question: "Which state has the longest motto?"
    answer: "Hawaii's motto — 'Ua Mau ke Ea o ka Āina i ka Pono' — is the longest,
      with 10 words in Hawaiian. In English it translates to 'The Life of the
      Land Is Perpetuated in Righteousness.' It was spoken by King Kamehameha
      III in 1843."

  - question: "Which state has the shortest motto?"
    answer: "Rhode Island ('Hope') and Washington ('Al-ki') are tied for shortest,
      with a single word each. Wisconsin ('Forward') also has a one-word motto."

  - question: "Do state mottos appear on license plates?"
    answer: "Some do — Kansas plates reference 'Ad Astra per Aspera' with the short
      form 'To the Stars.' New York plates use 'Excelsior.' But most states use
      separate tourism slogans on their plates rather than the official motto."

  - question: "Which state motto is also the U.S. national motto?"
    answer: "Florida's official state motto is 'In God We Trust' — the same as the
      U.S. national motto, adopted federally in 1956. Florida officially
      designated it as the state motto in 2006."

  - question: "Are the questions different each time I play?"
    answer: "Yes. Both the question order and the position of the correct answer
      among the four choices shuffle every round, making replaying genuinely
      useful for learning."

  - question: "Do I need an account to play?"
    answer: "No. The quiz is completely free and starts immediately — no sign-up
      required."

sources:
  - name: "USA Symbol — State Mottos"
    url: "https://usasymbol.com/symbols/mottos"
    description: "Reference hub for U.S. state mottos on USA Symbol."

questions:
  - question: "Which state's official motto is the Latin phrase 'Audemus jura nostra
      defendere'?"
    state_abbreviation: "AL"
    image_url: "/images/seals/alabama/seal.webp"
    choices: [ "Alabama", "Georgia", "Mississippi", "Tennessee" ]
    correct_answer: "Alabama"
    explanation: "'Audemus jura nostra defendere' means 'We dare defend our rights'
      in Latin. It has been Alabama's motto since 1923 and appears on the state
      seal. The phrase was chosen to reflect the state's spirit of defending
      civil rights and constitutional principles."

  - question: "Which state's official motto is 'North to the Future'?"
    state_abbreviation: "AK"
    image_url: "/images/seals/alaska/seal.webp"
    choices: [ "Washington", "Alaska", "Montana", "Oregon" ]
    correct_answer: "Alaska"
    explanation: "'North to the Future' was adopted as Alaska's official motto in
      1967, during the state's centennial celebration of the U.S. purchase from
      Russia. The phrase reflects Alaska's identity as America's last great
      frontier — a place of expanding opportunity ahead."

  - question: "The Latin motto 'Ditat Deus' belongs to which state?"
    state_abbreviation: "AZ"
    image_url: "/images/seals/arizona/seal.webp"
    choices: [ "Nevada", "New Mexico", "Arizona", "Texas" ]
    correct_answer: "Arizona"
    explanation: "'Ditat Deus' means 'God enriches' in Latin. It is one of the
      shortest state mottos — just two words — and has been part of Arizona's
      seal since territorial days in 1863. The phrase reflects the extraordinary
      mineral wealth found in Arizona's copper and silver mines."

  - question: "Which state's motto is the Latin phrase 'Regnat Populus'?"
    state_abbreviation: "AR"
    image_url: "/images/seals/arkansas/seal.webp"
    choices: [ "Missouri", "Tennessee", "Oklahoma", "Arkansas" ]
    correct_answer: "Arkansas"
    explanation: "'Regnat Populus' — 'The people rule' — has been Arkansas's state
      motto since 1907. It is a direct statement of democratic sovereignty,
      reflecting the Jacksonian democracy tradition that shaped Arkansas's early
      political culture."

  - question: "Which state's motto translates from Greek as 'I Have Found It'?"
    state_abbreviation: "CA"
    image_url: "/images/seals/california/seal.webp"
    choices: [ "California", "Nevada", "Colorado", "Oregon" ]
    correct_answer: "California"
    explanation: "'Eureka' — from the ancient Greek εὕρηκα — means 'I have found
      it.' The word was supposedly shouted by Archimedes upon discovering a
      method to measure volume. California adopted it in 1850, referencing the
      1848 Gold Rush discovery at Sutter's Mill that triggered the largest mass
      migration in American history."

  - question: "Identify the state whose Latin motto is 'Nil sine numine':"
    state_abbreviation: "CO"
    image_url: "/images/seals/colorado/seal.webp"
    choices: [ "Utah", "Colorado", "Kansas", "Wyoming" ]
    correct_answer: "Colorado"
    explanation: "'Nil sine numine' translates as 'Nothing without Providence' or
      'Nothing without the Deity' in Latin. It was adopted in 1861 when Colorado
      was organized as a territory. The phrase emphasizes divine guidance as the
      foundation of the state's ambitions."

  - question: "Which state claims the Latin motto 'Qui transtulit sustinet'?"
    state_abbreviation: "CT"
    image_url: "/images/seals/connecticut/seal.webp"
    choices: [ "Massachusetts", "Rhode Island", "Connecticut", "New York" ]
    correct_answer: "Connecticut"
    explanation: "'Qui transtulit sustinet' translates as 'He who transplanted still
      sustains' — a reference to the Puritan settlers who transplanted their
      faith and community from England to Connecticut. It has been on the state
      seal since at least 1647, making it one of the oldest continuous state
      mottos."

  - question: "Which state's official motto is 'Liberty and Independence'?"
    state_abbreviation: "DE"
    image_url: "/images/seals/delaware/seal.webp"
    choices: [ "Maryland", "Pennsylvania", "New Jersey", "Delaware" ]
    correct_answer: "Delaware"
    explanation: "'Liberty and Independence' has been Delaware's motto since 1847.
      It is both a statement of founding principles and a reference to
      Delaware's key role in American independence — as the first state to
      ratify the Constitution on December 7, 1787."

  - question: "Which state shares its official motto with the national motto of the
      United States?"
    state_abbreviation: "FL"
    image_url: "/images/seals/florida/seal.webp"
    choices: [ "Florida", "Georgia", "Ohio", "Alabama" ]
    correct_answer: "Florida"
    explanation: "'In God We Trust' was designated as Florida's official state motto
      in 2006 — the same phrase that has been the U.S. national motto since
      1956. Florida was the only state without an official motto before 2006,
      and the selection of the national motto was deliberately unifying."

  - question: "Which state's motto is 'Wisdom, Justice, Moderation'?"
    state_abbreviation: "GA"
    image_url: "/images/seals/georgia/seal.webp"
    choices: [ "Virginia", "Georgia", "North Carolina", "Tennessee" ]
    correct_answer: "Georgia"
    explanation: "'Wisdom, Justice, Moderation' reflects the three classical virtues
      of governance and has been Georgia's motto since 1799. The three ideals
      correspond to the three pillars seen in Georgia's state seal, each
      representing a branch of government."

  - question: "The Hawaiian motto 'Ua Mau ke Ea o ka Āina i ka Pono' belongs to
      which state?"
    state_abbreviation: "HI"
    image_url: "/images/seals/hawaii/seal.webp"
    choices: [ "Alaska", "California", "Hawaii", "Oregon" ]
    correct_answer: "Hawaii"
    explanation: "Translating as 'The Life of the Land Is Perpetuated in
      Righteousness,' this is the longest state motto by word count. King
      Kamehameha III spoke these words on July 31, 1843, when Hawaiian
      sovereignty was restored after a brief British occupation. It became the
      official state motto when Hawaii joined the Union in 1959."

  - question: "Which state's official motto is the Latin phrase 'Esto perpetua'?"
    state_abbreviation: "ID"
    image_url: "/images/seals/idaho/seal.webp"
    choices: [ "Montana", "Wyoming", "Oregon", "Idaho" ]
    correct_answer: "Idaho"
    explanation: "'Esto perpetua' — 'Let it be perpetual' or 'May it endure forever'
      — is attributed to the Venetian cardinal Pietro Bembo, who reportedly
      spoke it about the Republic of Venice on his deathbed. Idaho adopted it in
      1890, applying the spirit of permanence to the new state's ideals."

  - question: "Which state's official motto is 'State Sovereignty, National Union'?"
    state_abbreviation: "IL"
    image_url: "/images/seals/illinois/seal.webp"
    choices: [ "Illinois", "Indiana", "Iowa", "Missouri" ]
    correct_answer: "Illinois"
    explanation: "'State Sovereignty, National Union' is Illinois's motto and
      reflects a carefully balanced tension: the state's rights versus the power
      of the federal government. Notably, the motto appears on a banner held by
      the eagle on the state seal — the placement of 'State Sovereignty' above
      'National Union' was a deliberate and contested political statement in the
      1860s."

  - question: "Which state's official motto is 'The Crossroads of America'?"
    state_abbreviation: "IN"
    image_url: "/images/seals/indiana/seal.webp"
    choices: [ "Ohio", "Indiana", "Illinois", "Michigan" ]
    correct_answer: "Indiana"
    explanation: "'The Crossroads of America' became Indiana's official state motto
      in 1937. More U.S. interstate highways converge in Indiana than in any
      other state — I-65, I-70, I-74, I-69, I-94, and I-80 all pass through. The
      motto captures Indiana's role as a literal hub of American transportation
      and commerce."

  - question: "Which state's motto is 'Our Liberties We Prize and Our Rights We Will
      Maintain'?"
    state_abbreviation: "IA"
    image_url: "/images/seals/iowa/seal.webp"
    choices: [ "Wisconsin", "Minnesota", "Iowa", "Nebraska" ]
    correct_answer: "Iowa"
    explanation: "Iowa's motto, adopted in 1847, is one of the longest of any state.
      It reflects the democratic ideals of the early settlers, who sought to
      establish civil liberties and self-governance on the western frontier. The
      motto appears on the state seal, where a soldier holds a flag and banner."

  - question: "Which state's Latin motto translates as 'To the Stars Through
      Difficulties'?"
    state_abbreviation: "KS"
    image_url: "/images/seals/kansas/seal.webp"
    choices: [ "Nebraska", "Oklahoma", "Missouri", "Kansas" ]
    correct_answer: "Kansas"
    explanation: "'Ad astra per aspera' — adopted in 1861 — reflects the hardships
      Kansas faced as one of the flashpoints of the Civil War, with violent
      conflict between pro- and anti-slavery factions years before the war
      began. The phrase, from a Roman poem, emphasizes that excellence is earned
      through struggle."

  - question: "Which state's motto is 'United We Stand, Divided We Fall'?"
    state_abbreviation: "KY"
    image_url: "/images/seals/kentucky/seal.webp"
    choices: [ "Kentucky", "Tennessee", "Virginia", "West Virginia" ]
    correct_answer: "Kentucky"
    explanation: "'United We Stand, Divided We Fall' is Kentucky's motto and appears
      on the state seal, where two men are shown embracing — a frontiersman and
      a statesman. The phrase draws from an ancient Aesop fable and was widely
      used in the American Revolution to emphasize unity among the colonies."

  - question: "Which state's official motto is 'Union, Justice, Confidence'?"
    state_abbreviation: "LA"
    image_url: "/images/seals/louisiana/seal.webp"
    choices: [ "Mississippi", "Louisiana", "Alabama", "Arkansas" ]
    correct_answer: "Louisiana"
    explanation: "'Union, Justice, Confidence' has been Louisiana's motto since
      1902. The three words represent the values Louisiana sought to rebuild
      upon after the Civil War and Reconstruction — reunification with the
      Union, fair governance, and public trust in institutions."

  - question: "Which state's Latin motto translates simply as 'I Lead' or 'I Direct'?"
    state_abbreviation: "ME"
    image_url: "/images/seals/maine/seal.webp"
    choices: [ "Vermont", "New Hampshire", "Maine", "Massachusetts" ]
    correct_answer: "Maine"
    explanation: "'Dirigo' — 'I lead' or 'I direct' — has been Maine's motto since
      1820, the year of statehood. The word also references the North Star,
      which navigators used to find direction. Maine appears in the night sky as
      the most northeastern star in the continental U.S., making the navigation
      metaphor apt."

  - question: "Which state has an Italian motto: 'Fatti maschii, parole femine'?"
    state_abbreviation: "MD"
    image_url: "/images/seals/maryland/seal.webp"
    choices: [ "Pennsylvania", "New York", "Virginia", "Maryland" ]
    correct_answer: "Maryland"
    explanation: "Maryland's motto — unique as the only U.S. state motto in Italian
      — translates as 'Manly deeds, womanly words' or more precisely 'Strong
      deeds, gentle words.' It was the motto of the Calvert family, Maryland's
      founding proprietors. The phrase is borrowed from a Renaissance-era
      principle that governance should pair action with diplomacy."

  - question: "Which state's Latin motto is 'Ense petit placidam sub libertate quietem'?"
    state_abbreviation: "MA"
    image_url: "/images/seals/massachusetts/seal.webp"
    choices: [ "Massachusetts", "Connecticut", "Rhode Island", "New York" ]
    correct_answer: "Massachusetts"
    explanation: "Massachusetts's 15-word motto translates as 'By the sword we seek
      peace, but peace only under liberty' — a line from the Roman poet Algernon
      Sidney. Adopted in 1775, it was chosen at the start of the Revolutionary
      War and reflects exactly the spirit of armed resistance to British rule
      that Massachusetts embodied."

  - question: "Which state claims the Latin motto 'Si quaeris peninsulam amoenam,
      circumspice'?"
    state_abbreviation: "MI"
    image_url: "/images/seals/michigan/seal.webp"
    choices: [ "Wisconsin", "Michigan", "Ohio", "Minnesota" ]
    correct_answer: "Michigan"
    explanation: "'Si quaeris peninsulam amoenam, circumspice' means 'If you seek a
      pleasant peninsula, look about you.' Michigan adopted it in 1835 — a
      playful adaptation of the epitaph for architect Christopher Wren in St.
      Paul's Cathedral ('If you seek his monument, look about you'). Michigan is
      literally surrounded by Great Lakes water on three sides."

  - question: "Which state's motto is the French phrase 'L'Étoile du Nord'?"
    state_abbreviation: "MN"
    image_url: "/images/seals/minnesota/seal.webp"
    choices: [ "Wisconsin", "North Dakota", "Minnesota", "Iowa" ]
    correct_answer: "Minnesota"
    explanation: "'L'Étoile du Nord' — 'The Star of the North' — has been
      Minnesota's motto since 1861. The French language reflects Minnesota's
      history as part of the French fur-trade empire before U.S. acquisition.
      The North Star (Polaris) holds special symbolic importance as a fixed
      navigational point, fitting for a state that aims to be a reliable guide."

  - question: "Which state's official motto is the Latin phrase 'Virtute et armis'?"
    state_abbreviation: "MS"
    image_url: "/images/seals/mississippi/seal.webp"
    choices: [ "Alabama", "Louisiana", "Arkansas", "Mississippi" ]
    correct_answer: "Mississippi"
    explanation: "'Virtute et armis' means 'By valor and arms' in Latin. It has been
      Mississippi's motto since 1894, emphasizing military courage and strength.
      The phrase appears on Mississippi's state seal alongside a bald eagle and
      an olive branch with arrows — representing both peace and the willingness
      to fight."

  - question: "Which state's Latin motto translates as 'The Welfare of the People
      Shall Be the Supreme Law'?"
    state_abbreviation: "MO"
    image_url: "/images/seals/missouri/seal.webp"
    choices: [ "Missouri", "Kansas", "Illinois", "Arkansas" ]
    correct_answer: "Missouri"
    explanation: "'Salus populi suprema lex esto' is from Cicero's 'De Legibus' (On
      the Laws) — one of the foundational texts of Western political philosophy.
      Missouri adopted it in 1822, establishing the primacy of public welfare
      over individual or governmental interests. It is one of the most
      philosophically ambitious of all state mottos."

  - question: "Which state's motto is the Spanish phrase 'Oro y plata'?"
    state_abbreviation: "MT"
    image_url: "/images/seals/montana/seal.webp"
    choices: [ "Wyoming", "Montana", "Idaho", "Colorado" ]
    correct_answer: "Montana"
    explanation: "'Oro y plata' — 'Gold and silver' — has been Montana's motto since
      1865 and reflects the two minerals that drove the state's early economy.
      Montana's first major industry was placer gold mining, followed by
      hard-rock silver and copper mining. The Spanish language nods to the
      region's Spanish colonial mapping history."

  - question: "Which state's official motto is 'Equality Before the Law'?"
    state_abbreviation: "NE"
    image_url: "/images/seals/nebraska/seal.webp"
    choices: [ "Iowa", "South Dakota", "Nebraska", "Kansas" ]
    correct_answer: "Nebraska"
    explanation: "'Equality Before the Law' became Nebraska's motto in 1867, shortly
      after the Civil War. The phrase reflects Reconstruction-era ideals of
      equal legal standing for all citizens regardless of race — a significant
      commitment for a prairie state that had significant debates over civil
      rights during this period."

  - question: "Which state's official motto is 'Battle Born'?"
    state_abbreviation: "NV"
    image_url: "/images/seals/nevada/seal.webp"
    choices: [ "Arizona", "Utah", "Colorado", "Nevada" ]
    correct_answer: "Nevada"
    explanation: "'Battle Born' refers to the fact that Nevada achieved statehood on
      October 31, 1864 — in the middle of the Civil War, just days before the
      presidential election. President Lincoln rushed Nevada's statehood to
      secure electoral votes. The phrase appears on the state flag's banner
      above the state seal."

  - question: "Which state's motto is 'Live Free or Die'?"
    state_abbreviation: "NH"
    image_url: "/images/seals/new-hampshire/seal.webp"
    choices: [ "New Hampshire", "Vermont", "Maine", "Massachusetts" ]
    correct_answer: "New Hampshire"
    explanation: "'Live Free or Die' comes from a 1809 toast by General John Stark,
      the hero of the Battle of Bennington: 'Live free or die: Death is not the
      worst of evils.' New Hampshire adopted it as the state motto in 1945 and
      placed it on license plates in 1971. It is consistently ranked the most
      recognized state motto in America."

  - question: "Which state's official motto is 'Liberty and Prosperity'?"
    state_abbreviation: "NJ"
    image_url: "/images/seals/new-jersey/seal.webp"
    choices: [ "Delaware", "New Jersey", "Pennsylvania", "Maryland" ]
    correct_answer: "New Jersey"
    explanation: "'Liberty and Prosperity' has been New Jersey's motto since 1777 —
      among the earliest official state mottos adopted during the Revolutionary
      era. The two ideals represent the dual promise of the new nation:
      political freedom and economic opportunity. Both words appear on New
      Jersey's state seal alongside Ceres and Liberty."

  - question: "Which state's motto is the Latin phrase 'Crescit eundo'?"
    state_abbreviation: "NM"
    image_url: "/images/seals/new-mexico/seal.webp"
    choices: [ "Arizona", "Colorado", "New Mexico", "Texas" ]
    correct_answer: "New Mexico"
    explanation: "'Crescit eundo' — 'It grows as it goes' — comes from Book VI of
      Lucretius's epic poem 'De Rerum Natura' (On the Nature of Things), where
      it originally described the gathering force of a thunderbolt. New Mexico
      adopted it in 1887 as a territorial motto, reflecting the state's
      expanding potential. It is one of the most poetic and least-known state
      mottos."

  - question: "Which state's Latin motto translates as 'Ever Upward'?"
    state_abbreviation: "NY"
    image_url: "/images/seals/new-york/seal.webp"
    choices: [ "Pennsylvania", "New Jersey", "Connecticut", "New York" ]
    correct_answer: "New York"
    explanation: "'Excelsior' — Latin for 'ever upward' or 'higher still' — has been
      New York's motto since 1778. It became internationally famous through
      Henry Wadsworth Longfellow's 1841 poem of the same name. The word appears
      on the state seal held aloft by the banner above the globe and eagle."

  - question: "Which state's motto is the Latin phrase 'Esse quam videri'?"
    state_abbreviation: "NC"
    image_url: "/images/seals/north-carolina/seal.webp"
    choices: [ "North Carolina", "Virginia", "South Carolina", "Tennessee" ]
    correct_answer: "North Carolina"
    explanation: "'Esse quam videri' — 'To be rather than to seem' — comes from
      Cicero's 'De Amicitia' (On Friendship), where he describes the character
      of a true friend. North Carolina adopted it in 1893. The phrase is a call
      to substance over appearance — to embody virtues genuinely rather than
      perform them."

  - question: "Which state's motto is 'Liberty and Union, Now and Forever, One and
      Inseparable'?"
    state_abbreviation: "ND"
    image_url: "/images/seals/north-dakota/seal.webp"
    choices: [ "Montana", "North Dakota", "South Dakota", "Minnesota" ]
    correct_answer: "North Dakota"
    explanation: "This famous phrase comes from Daniel Webster's Senate speech of
      January 26, 1830 — one of the most celebrated orations in American
      political history. North Dakota adopted it as a motto to emphasize
      national unity at a time when sectional tensions remained high. The full
      quote has 10 words, making it one of the longest state mottos."

  - question: "Which state's motto is 'With God, All Things Are Possible'?"
    state_abbreviation: "OH"
    image_url: "/images/seals/ohio/seal.webp"
    choices: [ "Indiana", "Pennsylvania", "Ohio", "Michigan" ]
    correct_answer: "Ohio"
    explanation: "Ohio's motto is a quotation from the Gospel of Matthew (19:26). It
      was adopted in 1959 after a contest in which a 12-year-old student, James
      Mastronardo, proposed the biblical phrase. Ohio is the only state with a
      motto from a New Testament scripture."

  - question: "Which state's Latin motto translates as 'Labor Conquers All Things'?"
    state_abbreviation: "OK"
    image_url: "/images/seals/oklahoma/seal.webp"
    choices: [ "Kansas", "Missouri", "Texas", "Oklahoma" ]
    correct_answer: "Oklahoma"
    explanation: "'Labor omnia vincit' — from Virgil's 'Georgics' — means 'Labor
      conquers all things' or 'Persistent labor overcomes all difficulties.'
      Oklahoma adopted it in 1907, the year of statehood, reflecting the values
      of the homesteaders and settlers who broke the land by hand. The phrase
      emphasizes hard work as the foundation of the state's character."

  - question: "Which state's official motto is the Latin phrase 'Alis volat propriis'?"
    state_abbreviation: "OR"
    image_url: "/images/seals/oregon/seal.webp"
    choices: [ "Oregon", "Washington", "Idaho", "California" ]
    correct_answer: "Oregon"
    explanation: "'Alis volat propriis' means 'She flies with her own wings' — a
      statement of fierce independence. Oregon adopted it in 1854 as a
      territorial motto, emphasizing self-sufficiency. The phrase later took on
      additional meaning during debates over women's suffrage, as Oregon was one
      of the early states to grant women the vote in 1912."

  - question: "Which state's official motto is 'Virtue, Liberty, and Independence'?"
    state_abbreviation: "PA"
    image_url: "/images/seals/pennsylvania/seal.webp"
    choices: [ "New York", "Pennsylvania", "New Jersey", "Ohio" ]
    correct_answer: "Pennsylvania"
    explanation: "'Virtue, Liberty, and Independence' has been Pennsylvania's motto
      since 1875. The three words appear on the state coat of arms beneath the
      shield, representing the personal, political, and national ideals that
      Pennsylvania — as the birthplace of the U.S. Constitution — helped to
      establish."

  - question: "Which state's entire official motto is the single word 'Hope'?"
    state_abbreviation: "RI"
    image_url: "/images/seals/rhode-island/seal.webp"
    choices: [ "Connecticut", "Massachusetts", "Rhode Island", "New York" ]
    correct_answer: "Rhode Island"
    explanation: "'Hope' has been Rhode Island's motto since the colonial era. The
      word appears above an anchor on the state seal — the anchor itself a
      symbol of hope in Christian tradition (from Hebrews 6:19: 'hope as an
      anchor for the soul'). Rhode Island, the smallest state, chose the most
      direct motto of any."

  - question: "Which state's Latin motto translates as 'While I Breathe, I Hope'?"
    state_abbreviation: "SC"
    image_url: "/images/seals/south-carolina/seal.webp"
    choices: [ "North Carolina", "Georgia", "Alabama", "South Carolina" ]
    correct_answer: "South Carolina"
    explanation: "South Carolina has two official mottos. 'Dum spiro spero' — 'While
      I breathe, I hope' — is from Cicero and appears on the obverse of the
      state seal. The second motto, 'Animis opibusque parati' (Prepared in mind
      and resources), appears on the reverse. Together, they reflect both
      resilience and readiness."

  - question: "Which state's motto is 'Under God the People Rule'?"
    state_abbreviation: "SD"
    image_url: "/images/seals/south-dakota/seal.webp"
    choices: [ "South Dakota", "Nebraska", "North Dakota", "Montana" ]
    correct_answer: "South Dakota"
    explanation: "'Under God the People Rule' has been South Dakota's motto since
      1885, when it was adopted before statehood. The phrase combines democratic
      sovereignty with religious foundation, reflecting the strong Protestant
      homesteader culture of the Great Plains. It differs from North Dakota's
      more constitutional motto despite the states' shared history."

  - question: "Which state's official motto is 'Agriculture and Commerce'?"
    state_abbreviation: "TN"
    image_url: "/images/seals/tennessee/seal.webp"
    choices: [ "Kentucky", "Tennessee", "Arkansas", "Georgia" ]
    correct_answer: "Tennessee"
    explanation: "'Agriculture and Commerce' has been on Tennessee's state seal
      since 1801 — one of the earliest official state mottos. The two words
      reflect the dual economy of early Tennessee: the fertile farmlands of the
      west and center, and the growing trade networks along the Cumberland and
      Tennessee rivers."

  - question: "Which state's official motto is the single word 'Friendship'?"
    state_abbreviation: "TX"
    image_url: "/images/seals/texas/seal.webp"
    choices: [ "Oklahoma", "New Mexico", "Texas", "Louisiana" ]
    correct_answer: "Texas"
    explanation: "'Friendship' became Texas's official motto in 1930 — chosen for
      its connection to the word 'Texas' itself, which comes from the Caddo word
      'teysha,' meaning friend or ally. The Caddo people used the word to greet
      European explorers, and it eventually became the name of the entire
      region."

  - question: "Which state's official motto is the single word 'Industry'?"
    state_abbreviation: "UT"
    image_url: "/images/seals/utah/seal.webp"
    choices: [ "Colorado", "Arizona", "Wyoming", "Utah" ]
    correct_answer: "Utah"
    explanation: "'Industry' became Utah's motto in 1896 and is represented on the
      state seal by a beehive — a symbol the early Mormon settlers used to
      represent cooperative labor and productivity. The beehive, called a
      'Deseret' (a word for honeybee in the Book of Mormon), remains central to
      Utah's official imagery."

  - question: "Which state's official motto is 'Freedom and Unity'?"
    state_abbreviation: "VT"
    image_url: "/images/seals/vermont/seal.webp"
    choices: [ "Vermont", "New Hampshire", "Maine", "Massachusetts" ]
    correct_answer: "Vermont"
    explanation: "'Freedom and Unity' has been Vermont's motto since 1788. The two
      words reflect a tension Vermont's founders felt keenly: the freedom of
      individuals and communities on one hand, and the need for collective unity
      on the other. Vermont was an independent republic for 14 years before
      joining the Union in 1791."

  - question: "Which state's Latin motto translates as 'Thus Always to Tyrants'?"
    state_abbreviation: "VA"
    image_url: "/images/seals/virginia/seal.webp"
    choices: [ "Maryland", "Virginia", "North Carolina", "West Virginia" ]
    correct_answer: "Virginia"
    explanation: "'Sic semper tyrannis' — 'Thus always to tyrants' — has been
      Virginia's motto since 1776, the year of independence. The phrase appears
      on the state seal, where Virtus (Virtue) stands triumphant over a fallen
      tyrant. John Wilkes Booth reportedly shouted the phrase after
      assassinating Abraham Lincoln in 1865."

  - question: "Which state's motto is the Chinook word 'Al-ki,' meaning 'By and By'?"
    state_abbreviation: "WA"
    image_url: "/images/seals/washington/seal.webp"
    choices: [ "Oregon", "Idaho", "Washington", "Montana" ]
    correct_answer: "Washington"
    explanation: "'Al-ki' (also spelled 'Alki') comes from Chinook Jargon — the
      trade language of the Pacific Northwest — and means 'by and by' or 'in the
      future.' It was on Washington's territorial seal from 1853, reflecting the
      settlers' hope for what the territory would eventually become. Washington
      is the only state with a motto in a Native American trade language."

  - question: "Which state's Latin motto translates as 'Mountaineers Are Always Free'?"
    state_abbreviation: "WV"
    image_url: "/images/seals/west-virginia/seal.webp"
    choices: [ "Virginia", "Kentucky", "Ohio", "West Virginia" ]
    correct_answer: "West Virginia"
    explanation: "'Montani semper liberi' — adopted in 1863 when West Virginia broke
      away from Virginia during the Civil War — captures the spirit of mountain
      independence. The Appalachian highlands provided natural defensibility and
      a tradition of self-reliance. The motto also marks the state's defiant
      break with the Confederacy."

  - question: "Which state's official motto is the single word 'Forward'?"
    state_abbreviation: "WI"
    image_url: "/images/seals/wisconsin/seal.webp"
    choices: [ "Wisconsin", "Michigan", "Minnesota", "Illinois" ]
    correct_answer: "Wisconsin"
    explanation: "'Forward' became Wisconsin's motto in 1851 and is one of the most
      direct in the country. It reflects the progressive political tradition
      Wisconsin developed in the late 19th and early 20th centuries — the state
      pioneered labor laws, unemployment insurance, and primary elections. The
      motto appears on the state flag above the state seal."

  - question: "Which state's official motto is 'Equal Rights'?"
    state_abbreviation: "WY"
    image_url: "/images/seals/wyoming/seal.webp"
    choices: [ "Montana", "Wyoming", "Colorado", "Idaho" ]
    correct_answer: "Wyoming"
    explanation: "'Equal Rights' reflects Wyoming's landmark history as the first
      U.S. territory to grant women the right to vote — in 1869, over 50 years
      before the 19th Amendment. Wyoming also had the first female governor and
      the first all-female jury in U.S. history. The motto is a genuine
      historical achievement, not just an aspiration."
