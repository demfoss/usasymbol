      with the Cardinal in 1929, becoming the first Cardinal state."

  - question: "Which of these Great Plains states does NOT have the Western
      Meadowlark as its state bird?"
    state_abbreviation: "SD"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Wyoming", "South Dakota", "Nebraska", "Montana" ]
    correct_answer: "South Dakota"
    explanation: "South Dakota's state bird is the Ring-necked Pheasant — introduced
