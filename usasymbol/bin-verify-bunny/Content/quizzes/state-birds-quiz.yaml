      more associated with its dense Appalachian woodlands."

  - question: "Which of these Midwestern states does NOT have the American Robin as
      its state bird?"
    state_abbreviation: "IL"
    image_url: "/images/birds/american-robin.webp"
    choices: [ "Illinois", "Michigan", "Wisconsin", "Connecticut" ]
    correct_answer: "Illinois"
    explanation: "Illinois's state bird is the Northern Cardinal — not the Robin.
      Michigan, Wisconsin, and Connecticut all chose the American Robin.
