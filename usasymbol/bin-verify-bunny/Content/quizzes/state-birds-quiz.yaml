title: "State Birds Quiz"
slug: "state-birds-quiz"
description: "Test all 50 state birds with a quiz that mixes image questions,
  state matches, and unusual bird picks."

difficulty: "Medium"
estimated_time: "8–10 min"

tags:
  [
    "state birds quiz",
    "us state birds quiz",
    "guess the state bird",
    "state bird trivia",
    "50 states birds quiz"
  ]

seo:
  title: "U.S. State Birds Quiz"
  description: "Name all 50 U.S. state birds in a quiz with image questions, state
    matches, and unusual bird picks."
  intro_paragraphs:
    - "Can you match the Scissor-tailed Flycatcher to Oklahoma, the Nene to
      Hawaii, or the Willow Ptarmigan to Alaska? Each question shows a bird and
      asks which state it belongs to — or which state is the odd one out."
    - "The twist: seven states share the Northern Cardinal, six share the
      Western Meadowlark, and five share the Northern Mockingbird. Some
      questions flip the format and ask which state does NOT share a bird —
      which requires a different kind of knowledge."
    - "A few questions skip the identification game entirely and tell you a
      story — then ask you to name the state."

content:
  sections:
    - id: "shared-birds"
      title: "The Most Shared State Birds"
      paragraphs:
        - "Some birds are so popular they were adopted by multiple states —
          often independently, within years of each other."
      list:
        - "Northern Cardinal — 7 states: Illinois, Indiana, Kentucky, North
          Carolina, Ohio, Virginia, West Virginia. More states claim the
          Cardinal than any other bird."
        - "Western Meadowlark — 6 states: Kansas, Montana, Nebraska, North
          Dakota, Oregon, Wyoming. All adopted it between 1927 and 1951."
        - "Northern Mockingbird — 5 states: Arkansas, Florida, Mississippi,
          Tennessee, Texas. All five are Southern states."
        - "American Robin — 3 states: Connecticut, Michigan, Wisconsin."
        - "American Goldfinch — 3 states: Iowa, New Jersey, Washington."

    - id: "unusual-choices"
      title: "The Most Unusual State Bird Choices"
      paragraphs:
        - "Not every state chose a wild songbird. Several made choices that are
          surprising, historically loaded, or genuinely funny."
      list:
        - "Delaware — the Delaware Blue Hen is a breed of chicken, chosen
          because Revolutionary War soldiers from Delaware were nicknamed 'Blue
          Hen's Chickens' for their ferocity in battle."
        - "Rhode Island — the Rhode Island Red is also a chicken breed, making
          Rhode Island and Delaware the only two states with domesticated fowl
          as official birds."
        - "Utah — the California Gull is the state bird of a landlocked state.
          Seagulls saved Mormon pioneer crops from a plague of crickets in 1848,
          and the state never forgot it."
        - "South Dakota — the Ring-necked Pheasant is not native to North
          America at all. It was introduced from China in the 19th century and
          became so associated with South Dakota hunting that the state adopted
          it in 1943."
        - "Alabama — the Yellowhammer (Northern Flicker) was named after the
          yellow trim on Confederate soldiers' uniforms, earning them the
          battlefield nickname 'yellowhammers.'"

    - id: "more-quizzes"
      title: "More U.S. State Symbol Quizzes"
      paragraphs:
        - "Once you've worked through all 50 state birds, try the state flags
          quiz, state seals quiz, or license plate slogans quiz for more ways to
          test your state knowledge."

faq:
  - question: "Which bird is the state bird of the most states?"
    answer: "The Northern Cardinal is the state bird of seven states — Illinois,
      Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia —
      more than any other bird. All seven adopted it between 1926 and 1950."

  - question: "Are any state birds actually chickens?"
    answer: "Yes — two. Delaware's state bird is the Delaware Blue Hen, a fighting
      chicken breed. Rhode Island's is the Rhode Island Red, a famous egg-laying
      breed. Both choices are rooted in the states' agricultural or military
      history."

  - question: "Which state has the rarest state bird?"
    answer: "Hawaii's state bird, the Nene (Hawaiian Goose), came closest to
      extinction — only about 30 birds survived in the wild in the 1950s.
      Conservation efforts brought the population back to over 3,000 today."

  - question: "Which state bird is not native to North America?"
    answer: "South Dakota's Ring-necked Pheasant was introduced from China in the
      19th century. It became so embedded in South Dakota's hunting culture that
      the state officially adopted it as its bird in 1943."

  - question: "Do the questions have more than one correct answer?"
    answer: "No — every question is designed to have exactly one correct answer. For
      birds shared by multiple states, the quiz uses 'odd one out' format (which
      state does NOT have this bird?) or asks about a specific state by name."

  - question: "Are the questions different each time I play?"
    answer: "Yes. Both the question order and the position of the correct answer
      among the choices shuffle every round."

sources:
  - name: "USA Symbol — State Birds"
    url: "https://usasymbol.com/symbols/birds"
    description: "Reference hub for U.S. state birds on USA Symbol."

questions:
  - question: "Which state named its official bird after a nickname given to its
      Civil War soldiers?"
    state_abbreviation: "AL"
    image_url: "/images/birds/yellowhammer.webp"
    choices: [ "Alabama", "Georgia", "Tennessee", "Mississippi" ]
    correct_answer: "Alabama"
    explanation: "Alabama's Yellowhammer — a regional name for the Northern Flicker
      — was adopted in 1927. Confederate soldiers from Alabama wore
      yellow-trimmed gray uniforms, earning them the battlefield nickname
      'yellowhammers' from other troops who compared them to the yellow-and-gray
      woodpecker."

  - question: "Which state's official bird is the Willow Ptarmigan?"
    state_abbreviation: "AK"
    image_url: "/images/birds/willow-ptarmigan.webp"
    choices: [ "Montana", "Alaska", "Wyoming", "Minnesota" ]
    correct_answer: "Alaska"
    explanation: "Alaska adopted the Willow Ptarmigan in 1955, four years before
      statehood. The bird grows white feathers in winter for camouflage in snow
      and its feathered feet act as natural snowshoes — adaptations perfectly
      suited to Arctic life."

  - question: "Which state's official bird is the Cactus Wren?"
    state_abbreviation: "AZ"
    image_url: "/images/birds/cactus-wren.webp"
    choices: [ "Nevada", "New Mexico", "Arizona", "Texas" ]
    correct_answer: "Arizona"
    explanation: "Arizona adopted the Cactus Wren in 1931. It's the largest wren in
      North America and builds its nest inside a cactus — often a cholla — using
      the spines as a security system. It never needs to drink water, getting
      all its moisture from the insects and fruit it eats."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "GA"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Illinois", "Indiana", "Georgia", "Kentucky" ]
    correct_answer: "Georgia"
    explanation: "Georgia's state bird is the Brown Thrasher, not the Cardinal. The
      Northern Cardinal is shared by seven states — more than any other bird:
      Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West
      Virginia all adopted it between 1926 and 1950."

  - question: "Which state's official bird is the California Quail?"
    state_abbreviation: "CA"
    image_url: "/images/birds/california-quail.webp"
    choices: [ "California", "Oregon", "Nevada", "Arizona" ]
    correct_answer: "California"
    explanation: "California adopted the California Quail in 1931. Its distinctive
      forward-curving head plume is actually a cluster of six overlapping
      feathers that just look like one. Quail live in family groups called
      coveys that can include up to 75 birds."

  - question: "Which state chose its bird through a vote by schoolchildren in 1931?"
    state_abbreviation: "CO"
    image_url: "/images/birds/lark-bunting.webp"
    choices: [ "Wyoming", "Colorado", "Kansas", "Nebraska" ]
    correct_answer: "Colorado"
    explanation: "Colorado's Lark Bunting was chosen by a statewide vote of
      schoolchildren in 1931 — one of the few state birds selected by popular
      youth vote. Only the male has the striking black-and-white plumage;
      females are streaked brown. The male's appearance changes dramatically
      between breeding and winter seasons."

  - question: "The American Robin is shared by Connecticut, Michigan, and Wisconsin.
      Which of these states does NOT have the Robin as its state bird?"
    state_abbreviation: "NH"
    image_url: "/images/birds/american-robin.webp"
    choices: [ "Connecticut", "Michigan", "New Hampshire", "Wisconsin" ]
    correct_answer: "New Hampshire"
    explanation: "New Hampshire's state bird is the Purple Finch, not the Robin.
      Connecticut, Michigan, and Wisconsin all adopted the American Robin — one
      of the most widespread birds in North America and a universal symbol of
      spring's arrival."

  - question: "Which state's official bird is a breed of chicken, chosen because the
      state's Revolutionary War soldiers were nicknamed after it?"
    state_abbreviation: "DE"
    image_url: "/images/birds/delaware-blue-hen.webp"
    choices: [ "Iowa", "South Dakota", "Pennsylvania", "Delaware" ]
    correct_answer: "Delaware"
    explanation: "Delaware's state bird is the Delaware Blue Hen — a fighting
      chicken breed. During the Revolutionary War, soldiers from Delaware
      brought Blue Hen fighting cocks to battle. The unit became so famous for
      its ferocity that the 'Blue Hen's Chickens' nickname stuck across the
      entire state."

  - question: "The Northern Mockingbird is shared by five states. Which of these
      states does NOT have it as its state bird?"
    state_abbreviation: "OK"
    image_url: "/images/birds/northern-mockingbird.webp"
    choices: [ "Oklahoma", "Florida", "Arkansas", "Texas" ]
    correct_answer: "Oklahoma"
    explanation: "Oklahoma's state bird is the Scissor-tailed Flycatcher, not the
      Mockingbird. The five Mockingbird states are Arkansas, Florida,
      Mississippi, Tennessee, and Texas — all Southern states that adopted it
      between 1927 and 1944. The Mockingbird can imitate over 200 different bird
      songs."

  - question: "Which state's official bird is the Brown Thrasher?"
    state_abbreviation: "GA"
    image_url: "/images/birds/brown-thrasher.webp"
    choices: [ "Alabama", "Georgia", "North Carolina", "South Carolina" ]
    correct_answer: "Georgia"
    explanation: "Georgia adopted the Brown Thrasher in 1970. With over 1,100
      distinct songs — more than any other North American bird — it surpasses
      even the Northern Mockingbird as a vocalist. Each song phrase is typically
      sung twice before moving to the next."

  - question: "Which state chose a bird that had fewer than 30 individuals left in
      the wild at the time of its adoption?"
    state_abbreviation: "HI"
    image_url: "/images/birds/nene.webp"
    choices: [ "Oregon", "California", "Hawaii", "Alaska" ]
    correct_answer: "Hawaii"
    explanation: "Hawaii's state bird, the Nene (Hawaiian Goose), was nearly extinct
      when it became the official state bird in 1957 — only about 30 birds
      remained in the wild. A captive breeding program restored the population
      to over 3,000 today. The Nene evolved in Hawaii without land predators, so
      it adapted to walking on rough lava fields instead of swimming."

  - question: "Which state's official bird is the Mountain Bluebird?"
    state_abbreviation: "ID"
    image_url: "/images/birds/mountain-bluebird.webp"
    choices: [ "Montana", "Wyoming", "Colorado", "Idaho" ]
    correct_answer: "Idaho"
    explanation: "Idaho adopted the Mountain Bluebird in 1931. Nevada also shares
      this bird — they are the only two states with the Mountain Bluebird.
      Idaho's bluebirds nest at elevations up to 12,500 feet, making them among
      the highest-altitude nesting songbirds in North America."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "MI"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Michigan", "Illinois", "Indiana", "Kentucky" ]
    correct_answer: "Michigan"
    explanation: "Michigan's state bird is the American Robin, not the Cardinal.
      Illinois, Indiana, and Kentucky are all among the seven Cardinal states.
      Michigan, sandwiched geographically among Cardinal states, chose the Robin
      instead — the most common bird at feeders across the state."

  - question: "Indiana's state bird is the Northern Cardinal. Which other Midwestern
      state also chose the Cardinal?"
    state_abbreviation: "IL"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Iowa", "Illinois", "Michigan", "Minnesota" ]
    correct_answer: "Illinois"
    explanation: "Illinois was actually the first state to adopt the Northern
      Cardinal, in 1929 — Indiana followed in 1933. Iowa's bird is the American
      Goldfinch, Michigan's is the American Robin, and Minnesota's is the Common
      Loon. The Cardinal's bold red color and year-round presence made it a
      natural favorite."

  - question: "Which state's official bird is the American Goldfinch?"
    state_abbreviation: "IA"
    image_url: "/images/birds/american-goldfinch.webp"
    choices: [ "Wisconsin", "Minnesota", "Iowa", "Nebraska" ]
    correct_answer: "Iowa"
    explanation: "Iowa adopted the American Goldfinch in 1933. New Jersey and
      Washington also share this bird. The male's bright yellow plumage fades to
      olive-brown in winter — so the same bird looks completely different
      depending on the season. Iowa's Goldfinch is sometimes called the Wild
      Canary for its cheerful song."

  - question: "The Western Meadowlark is shared by six states. Which of these does
      NOT have it as its state bird?"
    state_abbreviation: "ME"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Kansas", "Nebraska", "Montana", "Maine" ]
    correct_answer: "Maine"
    explanation: "Maine's state bird is the Black-capped Chickadee — not the
      Meadowlark, which is a Western and Great Plains bird. The six Meadowlark
      states are Kansas, Montana, Nebraska, North Dakota, Oregon, and Wyoming.
      The Meadowlark's song is so distinctive that ranchers historically used it
      to identify their open-range location."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "TN"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Kentucky", "Virginia", "West Virginia", "Tennessee" ]
    correct_answer: "Tennessee"
    explanation: "Tennessee's state bird is the Northern Mockingbird, not the
      Cardinal. Kentucky, Virginia, and West Virginia are all Cardinal states.
      Tennessee adopted the Mockingbird in 1933 — the same year that Arkansas
      and Texas did — part of a wave of Southern states claiming the same bird."

  - question: "Which state's official bird is the Brown Pelican, which also appears
      on the state's flag and seal?"
    state_abbreviation: "LA"
    image_url: "/images/birds/brown-pelican.webp"
    choices: [ "Alabama", "Louisiana", "Florida", "Georgia" ]
    correct_answer: "Louisiana"
    explanation: "Louisiana adopted the Brown Pelican in 1966 — making it one of the
      few states where the state bird also appears on the state flag and seal.
      The Brown Pelican was nearly wiped out by DDT pollution in the 1960s and
      was completely eliminated from Louisiana's coast. Conservation efforts
      brought it back; it was removed from the endangered species list in 2009."

  - question: "Which New England state shares the Black-capped Chickadee as its
      state bird with Maine?"
    state_abbreviation: "MA"
    image_url: "/images/birds/black-capped-chickadee.webp"
    choices: [ "Vermont", "New Hampshire", "Massachusetts", "Connecticut" ]
    correct_answer: "Massachusetts"
    explanation: "Both Maine (1927) and Massachusetts (1941) chose the Black-capped
      Chickadee. The Chickadee survives New England winters by entering
      controlled hypothermia at night, dropping its body temperature by up to
      12°C to conserve energy. It's also famous for remembering thousands of
      cache locations where it hides seeds."

  - question: "Which state's bird shares its name with the city's Major League
      Baseball team?"
    state_abbreviation: "MD"
    image_url: "/images/birds/baltimore-oriole.webp"
    choices: [ "Pennsylvania", "Virginia", "Delaware", "Maryland" ]
    correct_answer: "Maryland"
    explanation: "Maryland's state bird is the Baltimore Oriole, adopted in 1947 —
      and Baltimore's MLB team, the Orioles, takes its name from the same bird.
      The Oriole's vivid black-and-orange plumage mirrors Baltimore's city
      colors. The bird was named after Lord Baltimore, whose family coat of arms
      used the same colors."

  - question: "Massachusetts chose the Black-capped Chickadee in 1941. Which other
      New England state had already adopted the same bird 14 years earlier?"
    state_abbreviation: "ME"
    image_url: "/images/birds/black-capped-chickadee.webp"
    choices: [ "Maine", "Vermont", "Connecticut", "Rhode Island" ]
    correct_answer: "Maine"
    explanation: "Maine adopted the Black-capped Chickadee in 1927, making it the
      earlier of the two Chickadee states. Maine's Chickadees are known for
      their bold personalities — they will land on an outstretched hand to take
      seeds, even in the wild, showing little fear of humans."

  - question: "Michigan's state bird is the American Robin. Which other Great Lakes
      state also chose the Robin?"
    state_abbreviation: "WI"
    image_url: "/images/birds/american-robin.webp"
    choices: [ "Illinois", "Wisconsin", "Indiana", "Ohio" ]
    correct_answer: "Wisconsin"
    explanation: "Wisconsin and Michigan both have the American Robin as their state
      bird. Connecticut also shares the Robin — the third of the three Robin
      states. The Robin was a popular choice because its return each spring is
      one of the most widely noticed signs of the season changing across the
      northern U.S."

  - question: "Which state's official bird is the Common Loon, whose haunting calls
      echo across northern lakes?"
    state_abbreviation: "MN"
    image_url: "/images/birds/common-loon.webp"
    choices: [ "Wisconsin", "Michigan", "Minnesota", "Maine" ]
    correct_answer: "Minnesota"
    explanation: "Minnesota adopted the Common Loon in 1961. The Loon's four
      distinct calls — wail, tremolo, yodel, and hoot — are among the most
      recognized sounds in North American nature. Loons are remarkable divers:
      they can dive to depths of 200 feet and stay underwater for up to five
      minutes."

  - question: "The Northern Mockingbird is shared by five Southern states. Which of
      these does NOT have the Mockingbird as its state bird?"
    state_abbreviation: "AL"
    image_url: "/images/birds/northern-mockingbird.webp"
    choices: [ "Tennessee", "Texas", "Mississippi", "Alabama" ]
    correct_answer: "Alabama"
    explanation: "Alabama's state bird is the Yellowhammer (Northern Flicker), not
      the Mockingbird. Tennessee, Texas, and Mississippi are all Mockingbird
      states, along with Arkansas and Florida. Alabama and its neighbors adopted
      different birds — Georgia chose the Brown Thrasher, South Carolina the
      Carolina Wren."

  - question: "Which state's official bird is the Eastern Bluebird?"
    state_abbreviation: "MO"
    image_url: "/images/birds/eastern-bluebird.webp"
    choices: [ "Missouri", "Kansas", "Iowa", "Minnesota" ]
    correct_answer: "Missouri"
    explanation: "Missouri adopted the Eastern Bluebird in 1927. New York also
      shares this bird — they are the only two Eastern Bluebird states.
      Missouri's bluebird population declined sharply in the mid-20th century
      due to nest competition from introduced House Sparrows and European
      Starlings, but nest box programs have brought them back."

  - question: "Which state's official bird is the Western Meadowlark?"
    state_abbreviation: "MT"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Minnesota", "Montana", "Maine", "Michigan" ]
    correct_answer: "Montana"
    explanation: "Montana adopted the Western Meadowlark in 1931. Five other states
      share this bird: Kansas, Nebraska, North Dakota, Oregon, and Wyoming. The
      Meadowlark's rich, flute-like song can carry up to a mile across open
      grassland — an essential sound of the Great Plains and the American West."

  - question: "The Western Meadowlark is shared by six states. Which of these does
      NOT have it as its state bird?"
    state_abbreviation: "IA"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Nebraska", "North Dakota", "Iowa", "Oregon" ]
    correct_answer: "Iowa"
    explanation: "Iowa's state bird is the American Goldfinch, not the Meadowlark.
      The six Meadowlark states — Kansas, Montana, Nebraska, North Dakota,
      Oregon, and Wyoming — are all located in the West and Great Plains, where
      the Meadowlark is most abundant."

  - question: "Nevada shares the Mountain Bluebird with which other state?"
    state_abbreviation: "ID"
    image_url: "/images/birds/mountain-bluebird.webp"
    choices: [ "Utah", "Montana", "Wyoming", "Idaho" ]
    correct_answer: "Idaho"
    explanation: "Idaho and Nevada are the only two states with the Mountain
      Bluebird as their official bird. Both adopted it in 1931. The male's vivid
      sky-blue plumage — unlike the Robin's red breast or the Cardinal's bold
      red — is a softer, ethereal color that stands out against western mountain
      meadows."

  - question: "Which state's official bird is the Purple Finch?"
    state_abbreviation: "NH"
    image_url: "/images/birds/purple-finch.webp"
    choices: [ "New Hampshire", "Vermont", "Maine", "Massachusetts" ]
    correct_answer: "New Hampshire"
    explanation: "New Hampshire adopted the Purple Finch in 1957. Despite the name,
      the male Purple Finch is more raspberry-red than purple — Roger Tory
      Peterson famously described it as 'a sparrow dipped in raspberry juice.'
      New Hampshire is the only state with the Purple Finch as its official
      bird."

  - question: "New Jersey's state bird is the American Goldfinch. Which West Coast
      state also chose the Goldfinch?"
    state_abbreviation: "WA"
    image_url: "/images/birds/american-goldfinch.webp"
    choices: [ "Oregon", "Washington", "California", "Alaska" ]
    correct_answer: "Washington"
    explanation: "Washington adopted the Willow Goldfinch (American Goldfinch) in
      1951 after a vote by the Washington Federation of Women's Clubs. Iowa also
      shares the Goldfinch, making it a bird that spans the country from the
      Great Plains (Iowa) to the East Coast (New Jersey) to the Pacific
      Northwest (Washington)."

  - question: "Which state's official bird is the Greater Roadrunner?"
    state_abbreviation: "NM"
    image_url: "/images/birds/greater-roadrunner.webp"
    choices: [ "Arizona", "Colorado", "New Mexico", "Texas" ]
    correct_answer: "New Mexico"
    explanation: "New Mexico adopted the Greater Roadrunner in 1949. The bird is
      famous for preferring to run rather than fly — it can sprint at 20 mph.
      Roadrunners are also one of the few predators that regularly kill and eat
      rattlesnakes, pinning the snake's head down with one foot while beating it
      against a rock."

  - question: "New York's state bird is the Eastern Bluebird. Which other state
      shares this bird?"
    state_abbreviation: "MO"
    image_url: "/images/birds/eastern-bluebird.webp"
    choices: [ "Pennsylvania", "New Jersey", "Connecticut", "Missouri" ]
    correct_answer: "Missouri"
    explanation: "Missouri and New York are the only two states with the Eastern
      Bluebird as their official bird. Missouri adopted it in 1927 and New York
      in 1970. The Eastern Bluebird nests in tree cavities — and the widespread
      installation of nest boxes by volunteers across both states helped reverse
      a sharp population decline."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "WI"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Illinois", "Kentucky", "Wisconsin", "Ohio" ]
    correct_answer: "Wisconsin"
    explanation: "Wisconsin's state bird is the American Robin — not the Cardinal.
      Illinois, Kentucky, and Ohio are all Cardinal states. Wisconsin sits
      geographically surrounded by Cardinal states on multiple sides but chose
      differently. The Cardinal was never officially proposed for Wisconsin's
      legislature vote."

  - question: "North Dakota adopted the Western Meadowlark in 1947 — the last of the
      six Meadowlark states to do so. Which other Prairie state also has the
      Meadowlark?"
    state_abbreviation: "ND"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Kansas", "North Dakota", "Minnesota", "Iowa" ]
    correct_answer: "North Dakota"
    explanation: "North Dakota was the last of the six Meadowlark states, adopting
      it in 1947. Kansas had chosen the Meadowlark first in 1937. Both states
      share the rolling grasslands where the Meadowlark's song carries across
      the open horizon — a sound many residents associate with summer mornings
      on the prairie."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "MI"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Illinois", "Kentucky", "Michigan", "Ohio" ]
    correct_answer: "Michigan"
    explanation: "Michigan chose the American Robin, not the Cardinal. Illinois,
      Kentucky, and Ohio are Cardinal states. The Cardinal's bright red color is
      highly visible against winter snow, which is part of why it became so
      popular in cold-weather Northern and Midwestern states — but Michigan's
      legislature went with the Robin."

  - question: "Which state's official bird is the Scissor-tailed Flycatcher, whose
      tail feathers can exceed the length of its body?"
    state_abbreviation: "OK"
    image_url: "/images/birds/scissor-tailed-flycatcher.webp"
    choices: [ "Kansas", "Missouri", "Texas", "Oklahoma" ]
    correct_answer: "Oklahoma"
    explanation: "Oklahoma adopted the Scissor-tailed Flycatcher in 1951. The male's
      deeply forked tail — which can reach 9 inches, longer than the bird's body
      — is one of the most dramatic features of any North American bird. It uses
      the long tail for aerial agility when catching insects in mid-flight."

  - question: "Which state's official bird is the Western Meadowlark?"
    state_abbreviation: "OR"
    image_url: "/images/birds/western-meadowlark.webp"
    choices: [ "Oregon", "Minnesota", "Maine", "Michigan" ]
    correct_answer: "Oregon"
    explanation: "Oregon adopted the Western Meadowlark in 1927, making it one of
      the first of the six Meadowlark states. The bird's song was familiar to
      Oregon Trail settlers crossing the Great Plains — some historians
      speculate this contributed to its popularity as settlers reached the
      Pacific Northwest and chose a bird that reminded them of the journey."

  - question: "Which state's official bird is the Ruffed Grouse, known as the
      'drummer of the woods'?"
    state_abbreviation: "PA"
    image_url: "/images/birds/ruffed-grouse.webp"
    choices: [ "New York", "Pennsylvania", "Maine", "Vermont" ]
    correct_answer: "Pennsylvania"
    explanation: "Pennsylvania adopted the Ruffed Grouse in 1931. The 'drumming'
      sound — a low, rapid thumping — is made by the male beating its wings in
      place to attract mates, not by striking a tree. The sound travels far
      through dense forest and is one of the most distinctive sounds of
      Pennsylvania's woodlands."

  - question: "Which state's official bird is the Rhode Island Red — a famous
      chicken breed named after the state itself?"
    state_abbreviation: "RI"
    image_url: "/images/birds/rhode-island-red.webp"
    choices: [ "Connecticut", "Rhode Island", "Delaware", "Iowa" ]
    correct_answer: "Rhode Island"
    explanation: "Rhode Island chose the Rhode Island Red chicken in 1954, making it
      one of two states with a domesticated chicken as the official bird
      (Delaware is the other). The Rhode Island Red was developed in the 1840s
      and 1850s as a highly productive egg-laying breed, and it became one of
      the most important agricultural breeds in American history."

  - question: "Which state's official bird is the Carolina Wren — a bird named for
      the Carolinas but claimed by only one of them?"
    state_abbreviation: "SC"
    image_url: "/images/birds/carolina-wren.webp"
    choices: [ "North Carolina", "Georgia", "Virginia", "South Carolina" ]
    correct_answer: "South Carolina"
    explanation: "South Carolina adopted the Carolina Wren in 1948. Despite the
      bird's name referencing 'the Carolinas,' North Carolina chose the
      Cardinal. The Carolina Wren is one of the loudest birds relative to body
      size in North America — its call can be heard from 100 yards away, an
      impressive distance for a bird smaller than a tennis ball."

  - question: "Which state chose a bird introduced from China as its official bird,
      because the species had become central to the state's hunting culture?"
    state_abbreviation: "SD"
    image_url: "/images/birds/ring-necked-pheasant.webp"
    choices: [ "South Dakota", "North Dakota", "Iowa", "Minnesota" ]
    correct_answer: "South Dakota"
    explanation: "South Dakota's Ring-necked Pheasant was brought from China in the
      1880s. By 1943, when South Dakota officially adopted it, pheasant hunting
      had become one of the state's defining traditions, drawing hunters from
      across the country. South Dakota remains the top pheasant hunting
      destination in the United States."

  - question: "Tennessee's state bird is the Northern Mockingbird. Which neighboring
      state does NOT share this bird?"
    state_abbreviation: "KY"
    image_url: "/images/birds/northern-mockingbird.webp"
    choices: [ "Mississippi", "Kentucky", "Arkansas", "Texas" ]
    correct_answer: "Kentucky"
    explanation: "Kentucky's state bird is the Northern Cardinal, not the
      Mockingbird. Mississippi, Arkansas, and Texas all share the Mockingbird
      with Tennessee. Kentucky sits directly north of Tennessee but went with
      the Cardinal — making it a Mockingbird state bordered on its north by a
      Cardinal state."

  - question: "Which state's official bird is the Northern Mockingbird, chosen in
      1927 to honor a bird capable of imitating over 200 other species' songs?"
    state_abbreviation: "TX"
    image_url: "/images/birds/northern-mockingbird.webp"
    choices: [ "Georgia", "Louisiana", "Texas", "Virginia" ]
    correct_answer: "Texas"
    explanation: "Texas adopted the Northern Mockingbird in 1927, making it the
      first of five states to do so. The Texas Federation of Women's Clubs led
      the campaign, describing the Mockingbird as 'a fighter for the protection
      of his home, falling, if need be, in its defense, like any true Texan.'
      The Mockingbird can sing continuously for hours."

  - question: "Which landlocked state chose the California Gull as its bird —
      honoring the day seagulls saved pioneer crops from an insect plague?"
    state_abbreviation: "UT"
    image_url: "/images/birds/california-gull.webp"
    choices: [ "Nevada", "Colorado", "Idaho", "Utah" ]
    correct_answer: "Utah"
    explanation: "In 1848, thousands of seagulls descended on Mormon pioneer fields
      in what would become Utah, eating a plague of crickets that had been
      destroying the crops. The event — called the Miracle of the Gulls — is a
      foundational story in Utah's history. The California Gull was officially
      adopted in 1955. A monument to the seagulls stands on Temple Square in
      Salt Lake City."

  - question: "Which state's official bird is the Hermit Thrush, known for its
      complex, flute-like song?"
    state_abbreviation: "VT"
    image_url: "/images/birds/hermit-thrush.webp"
    choices: [ "Vermont", "New Hampshire", "Maine", "Massachusetts" ]
    correct_answer: "Vermont"
    explanation: "Vermont adopted the Hermit Thrush in 1941. The Hermit Thrush's
      song — a spiraling series of flute-like phrases, each at a different pitch
      — is widely considered the most beautiful birdsong in North America. Walt
      Whitman used the Hermit Thrush in 'When Lilacs Last in the Dooryard
      Bloom'd,' his elegy for Abraham Lincoln."

  - question: "Which of these states does NOT have the Northern Cardinal as its
      state bird?"
    state_abbreviation: "TN"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Virginia", "Tennessee", "Ohio", "West Virginia" ]
    correct_answer: "Tennessee"
    explanation: "Tennessee's state bird is the Northern Mockingbird — not the
      Cardinal, despite being surrounded by Cardinal states on three sides
      (Kentucky, Virginia, North Carolina). Virginia, Ohio, and West Virginia
      are all among the seven Cardinal states. Tennessee went with the
      Mockingbird in 1933."

  - question: "Washington's state bird is the American Goldfinch. Which East Coast
      state also chose the Goldfinch?"
    state_abbreviation: "NJ"
    image_url: "/images/birds/american-goldfinch.webp"
    choices: [ "Delaware", "Maryland", "New Jersey", "Pennsylvania" ]
    correct_answer: "New Jersey"
    explanation: "New Jersey adopted the American Goldfinch in 1935. Iowa also
      shares the bird, making the Goldfinch one of the few state birds claimed
      by states on both coasts and the Midwest. New Jersey's legislature chose
      the Goldfinch in part because it stays in the state year-round, unlike
      many migratory songbirds."

  - question: "West Virginia's state bird is the Northern Cardinal. Which
      neighboring state does NOT share this bird?"
    state_abbreviation: "PA"
    image_url: "/images/birds/northern-cardinal.webp"
    choices: [ "Virginia", "Kentucky", "Ohio", "Pennsylvania" ]
    correct_answer: "Pennsylvania"
    explanation: "Pennsylvania's state bird is the Ruffed Grouse, not the Cardinal.
      Virginia, Kentucky, and Ohio are Cardinal states — so West Virginia is
      almost entirely surrounded by states that chose the same bird.
