  getting_there: |
    By car, the park has two entrances off Interstate 40 in northeastern Arizona. The north entrance is at I-40 Exit 311, about 25 miles east of Holbrook. The south entrance is off U.S. Highway 180, about 18 miles southeast of Holbrook. The 28-mile park road connects the two entrances; vehicles must exit at one end and cannot turn around after passing through the I-40 overpass mid-park. Many visitors enter at one end and exit at the other. The nearest major airport is Flagstaff Pulliam (FLG), about 90 miles west via I-40; Phoenix Sky Harbor (PHX) is about 185 miles southwest. No public transit serves the park. Holbrook has gas, food, and lodging.

  geology: |
    The petrified wood formed during the Late Triassic period, roughly 225 million years ago, when the region was a tropical lowland crossed by large rivers. Tall conifer-like trees, primarily Araucarioxylon arizonicum, fell into the floodplain and were buried rapidly by sediment before they could decay. Over millions of years, silica-rich groundwater slowly replaced the organic wood fiber with quartz crystal, preserving the original cell structure in stone. Iron oxide minerals produced the red, orange, and yellow colors in the wood; manganese oxide created purple and black tones.

    The rock layers visible in the Painted Desert belong to the Chinle Formation, a Triassic-age sequence of mudstones, siltstones, and sandstones deposited on ancient river floodplains. Variations in the mineral content of each layer control the color banding. The blue and gray tones at Blue Mesa come from bentonite clay derived from volcanic ash; the reds and purples come from iron-bearing minerals oxidized under different moisture conditions.

    The Colorado Plateau uplift, beginning roughly 60 million years ago and continuing through the present, raised the entire region thousands of feet and allowed rivers and wind to erode the overlying rock and expose the Chinle Formation at the surface. The badlands topography is still actively eroding; the petrified logs visible today are being exhumed from the surrounding clay at a rate of millimeters per year.

  wildlife: |
    Pronghorn are the most visible large mammals and are common throughout the grassland sections of the park, especially in the early morning and late afternoon. The park holds one of the denser pronghorn populations in Arizona. Coyotes cross the grasslands and badlands at all hours, and their tracks are common along unpaved trail edges.

    Prairie dogs maintain colonies in the open grasslands, particularly near the south entrance. Their colonies attract burrowing owls, which nest in abandoned prairie dog burrows and are visible sitting at burrow entrances in spring and summer. Roadrunners are present year-round and are often seen near trailheads. Ravens patrol the park road daily.

    Reptiles are abundant from spring through early fall. Collared lizards are common on rocky outcrops near the petrified logs. Short-horned lizards rely on camouflage in the badlands and are easy to miss. Prairie rattlesnakes are present; watch rock edges and log piles. The park is dark-sky certified, and on clear nights with no moon, the Milky Way is visible to the naked eye above the Painted Desert.

  history: |
    Human presence in the Petrified Forest area extends back at least 13,000 years, based on projectile points found in the park. By 650 CE, Ancestral Puebloan communities were farming the valleys and building pit houses. Population grew through the 1100s, when communities moved into above-ground masonry structures like Puerco Pueblo. The petrified wood was a practical resource; Agate House, built around 1050 CE, used large pieces of petrified log as masonry blocks. The population dispersed from the area by about 1400 CE, likely due to drought and shifting agricultural conditions. Descendants of these communities include the modern Hopi, Zuni, and other Pueblo peoples who maintain cultural and spiritual ties to the site.

    Spanish explorers entered the region in 1540 during the Coronado Expedition but left no detailed record of the petrified wood. American naturalist Lorenzo Sitgreaves documented the fossils during an 1851 railroad survey, and subsequent reports by government geologists in the 1850s brought the site to national attention. By the 1890s, commercial collectors and souvenir hunters were shipping tons of petrified wood out of the region by rail. President Theodore Roosevelt used the Antiquities Act to designate Petrified Forest a national monument in 1906. Congress elevated it to national park status in 1962 and expanded the boundaries significantly in 2004 and 2011, adding large tracts of grassland and badlands to the original monument core.

