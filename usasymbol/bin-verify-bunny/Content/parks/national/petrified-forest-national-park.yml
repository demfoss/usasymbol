sections:
  overview: |
    Petrified Forest National Park straddles Interstate 40 in northeastern Arizona, with the Painted Desert Visitor Center at the north entrance and the Rainbow Forest Museum at the south entrance, 28 miles apart. A paved park road connects both ends and passes all major stops, including Blue Mesa, Newspaper Rock, and Puerco Pueblo. Ranked 35th among the 63 national parks by visitation, the park draws about 860,000 visitors per year. Most visitors drive through in two to three hours; a full day allows time for short hikes, photography, and a look at the petroglyphs. Pets are allowed on all trails.

  known_for: |
    - The world's largest concentration of petrified wood, with individual logs up to 6 feet in diameter, deposited roughly 225 million years ago
    - The Painted Desert, a band of multicolored badlands stretching across the park's northern section in shades of red, orange, lavender, and gray
    - Newspaper Rock, a sandstone outcrop covered with more than 650 Ancestral Puebloan petroglyphs
    - One of the few national parks in the contiguous United States certified as an International Dark Sky Park

  best_things_to_see: |
    Blue Mesa is the most visually striking short walk in the park, looping through badlands striped in blue, purple, and gray with petrified logs balanced on eroded clay pedestals. Crystal Forest puts visitors among the densest scattering of large petrified logs in the park, many still showing their original bark texture in quartz crystal. Newspaper Rock holds more than 650 petroglyphs on a single panel viewable from a roadside overlook. Puerco Pueblo is a 100-room ancestral pueblo occupied around 1100 to 1300 CE, with a short self-guided loop and additional petroglyphs etched into the surrounding boulders. The Painted Desert Inn, a National Historic Landmark on the north end of the park road, dates to the 1920s and houses exhibits on Route 66 and Civilian Conservation Corps history.

  best_things_to_see_items:
    - name: "Blue Mesa"
      description: "Blue Mesa is a short 1-mile loop trail that descends into a badlands basin of blue, purple, and gray Chinle Formation clay. Petrified logs balance on eroded clay columns called pedestals, created when the harder wood resists erosion while the softer clay beneath wears away. The trail involves a paved descent and is one of the most photographed locations in the park."
      image: "/images/parks/national/petrified-forest-national-park/05-highlight-04.jpg"
      alt: "Two visitors walk the Blue Mesa Trail between blue, purple, and grey badlands."
      credit: "NPS Photo"
    - name: "Crystal Forest"
      description: "Crystal Forest is a 0.75-mile loop in the southern section of the park where large petrified logs lie scattered across the ground in one of the highest concentrations in the park. Many logs still show preserved detail: bark texture, growth rings, and original wood grain, all replaced by quartz. The paved loop is fully accessible."
      image: "/images/parks/national/petrified-forest-national-park/02-crystal-forest.jpg"
      alt: "A log breaks along naturally caused fractures at Crystal Forest"
      credit: "NPS/Jacob Holgerson"
    - name: "Newspaper Rock"
      description: "Newspaper Rock is a large sandstone block covered with more than 650 petroglyphs carved by Ancestral Puebloan people over several centuries. It sits below a roadside overlook with telescopes for close viewing without approaching the rock face. The concentration of images on a single surface makes it one of the most significant petroglyph sites in the American Southwest."
      image: "/images/parks/national/petrified-forest-national-park/03-newspaper-rock.jpg"
      alt: "Close up of anthropomorph petroglyphs at Newspaper Rock"
      credit: "NPS"
    - name: "Puerco Pueblo"
      description: "Puerco Pueblo is the ruin of a 100-room pueblo occupied around 1100 to 1300 CE, when the Ancestral Puebloans used the site as a farming and gathering community. A 0.3-mile loop trail passes the stone foundations and a boulder field of petroglyphs. The site is positioned so that a doorway aligns with a solstice sunrise each June 21."
      image: "/images/parks/national/petrified-forest-national-park/04-highlight-03.jpg"
      alt: "Masonry wall foundations are all that are left of a hundred room pueblo"
      credit: "NPS Photo/Andrew V. Kearns"
    - name: "Painted Desert Inn"
      description: "The Painted Desert Inn is a National Historic Landmark on the north end of the park road, built in the 1920s and renovated by the Civilian Conservation Corps in the 1930s. It served as a Harvey House restaurant and hotel for Route 66 travelers and now houses exhibits on that era and on Hopi history. The building's patterned stucco and interior tile work are intact."
      image: "/images/parks/national/petrified-forest-national-park/02-highlight-01.jpg"
      alt: "Sunset lights up the Painted Desert Inn National Historic Landmark west side."
      credit: "NPS Photo"
    - name: "Agate House"
      description: "Agate House is a partially reconstructed 900-year-old pueblo built almost entirely from petrified wood. The structure is visible evidence that the Ancestral Puebloans used fossilized logs as a practical building material. The 2.7-mile round trip loop from the Rainbow Forest trailhead combines Agate House with the Long Logs area, the largest concentration of full-length petrified logs in the park."
      image: "/images/parks/national/petrified-forest-national-park/03-highlight-02.jpg"
      alt: "Sunlight highlights the colorful petrified wood of Agate House"
      credit: "NPS Photo"

  best_time_to_visit: |
    **Spring (March–May):** The most popular season. Daytime highs range from 55 to 75°F, wildflowers bloom in April across the grasslands, and afternoon thunderstorms are rare. Spring light hits the Painted Desert at a low angle that brings out the deepest color contrasts. Crowds are manageable except over spring break weekends.

    **Summer (June–August):** The park is open and fully staffed, but midday temperatures regularly exceed 95°F. Afternoon monsoon thunderstorms arrive most days from mid-July through September, bringing brief but intense rain, flash flooding risk in washes, and vivid post-storm light on the badlands. Hike before 10 a.m. and carry at least 2 liters of water per person.

    **Fall (September–October):** Temperatures return to the 65–80°F range after the monsoon season ends. This is the best window for photography: clear skies, low humidity, and no peak crowds. Pronghorn are more active in fall. The park closes at sunset year-round; arrive early to allow time for all stops.

    **Winter (November–February):** Cold nights (below freezing) and occasional snow give the Painted Desert an unusual appearance. Daytime highs stay in the 40s to 50s°F. All facilities remain open, crowds are minimal, and the low sun angle in winter produces some of the best color on the badlands. Ice on paved trails can occur after overnight freezes.

  hiking: |
    **Easy:** Crystal Forest Trail is a 0.75-mile paved loop through the park's densest scatter of large petrified logs; it is the quickest immersive walk in the park. Blue Mesa Trail is a 1-mile paved loop that descends into a badlands bowl of blue and purple clay. Puerco Pueblo Trail is a 0.3-mile loop at the pueblo ruins with access to the petroglyph boulders. The Painted Desert Rim Trail runs 1 mile between Tawa Point and Kachina Point along the rim above the Painted Desert. Pets on leash are permitted on all trails.

    **Moderate:** The Long Logs and Agate House Loop combines two southern-section trailheads into a 2.7-mile round trip that passes the largest full-length petrified logs in the park and a partially reconstructed pueblo built from petrified wood. The unpaved surface involves soft sand in sections. Start from the Rainbow Forest Museum trailhead.

    **Backcountry:** The park's two wilderness areas, the Painted Desert Wilderness to the north and the Rainbow Forest Wilderness to the south, have no marked trails. Route-finding skills and a compass or GPS are required. A free backcountry permit, issued same-day at either visitor center, is required for overnight stays. Carry all water; there are no sources in the backcountry. The terrain is exposed high desert with no shade; heat is a significant risk from May through September.

