faq:
  - question: "Where is Petrified Forest National Park?"
    answer: "The park is in northeastern Arizona along Interstate 40, about 25 miles east of Holbrook. It has two entrances: the north entrance off I-40 Exit 311 and the south entrance off U.S. Highway 180."
  - question: "Can you take petrified wood from the park?"
    answer: "No. Removing petrified wood, rocks, fossils, or any natural or cultural object from the park is a federal crime. Rangers actively enforce this rule and fines are substantial. The park's visitor centers display wood that was returned by guilty visitors — the 'Conscience Wood' collection."
  - question: "How much does it cost to enter Petrified Forest?"
    answer: "A 7-day vehicle pass costs $25 and covers all occupants. Motorcycles pay $20, and individuals on foot or bicycle pay $15. The America the Beautiful Annual Pass is valid here."
  - question: "How long does it take to drive through the park?"
    answer: "The 28-mile park road takes about 45 minutes to drive straight through. With stops at all pullouts and one or two short walks, budget 2.5 to 3 hours. A full day allows time for Blue Mesa, Crystal Forest, Newspaper Rock, Puerco Pueblo, and the Painted Desert Inn."
  - question: "When is the best time to visit Petrified Forest?"
    answer: "Spring (March through May) offers the best combination of mild temperatures and good light on the badlands. Fall (September and October) is nearly as good with thinner crowds. Summer works if you hike before 10 a.m. and carry extra water."
  - question: "Is there camping in Petrified Forest National Park?"
    answer: "There are no developed campgrounds in the park. Backcountry wilderness camping is available with a free same-day permit from either visitor center. You must carry all your water; there are no water sources in the backcountry. The nearest RV parks and campgrounds are in Holbrook, about 25 miles west."
  - question: "Are dogs allowed at Petrified Forest National Park?"
    answer: "Yes. Pets on leash are allowed on all trails and in all outdoor areas of the park. They are not permitted inside buildings. The park is one of the few national parks with a full pet policy on trails."

  - question: What state is Petrified Forest National Park in?
    answer: Petrified Forest National Park is in [Arizona](/states/arizona), near Holbrook, Arizona.

