  camping: |
    The park has no developed campground with drive-up sites or hookups. Overnight camping is limited to the backcountry wilderness areas. A free wilderness permit is required and is issued same-day at the Painted Desert Visitor Center (north entrance) or the Rainbow Forest Museum (south entrance). Camping is allowed only in the designated Painted Desert Wilderness and Rainbow Forest Wilderness zones. There are no water sources anywhere in the park; carry all drinking water. Fires are not permitted in the backcountry. The nearest developed campgrounds and RV parks are in Holbrook, about 25 miles west on I-40.

  campgrounds: []

  fees_reservations: |
    The 7-day vehicle pass costs $25 and covers all occupants of one private vehicle. Motorcycles pay $20 for the same 7-day window. Individuals arriving on foot or by bicycle pay $15 per person. The America the Beautiful Annual Pass is valid here for $80 and covers entrance to all national parks. No reservation is required for day use or for the wilderness camping permit. Backcountry permits are free and issued same-day only. Removing petrified wood or any rock or artifact from the park is a federal crime; rangers enforce it actively and fines are substantial. Confirm current fees and rules at the official park page: nps.gov/pefo.

