seo_title: "Petrified Forest National Park: Map, Hiking & Visitor Guide"
seo_description: "Visit Petrified Forest National Park in Arizona: ancient petrified wood, Painted Desert badlands, hiking, and a $25 entrance fee."
intro_text: "Petrified Forest National Park in Arizona protects the world's largest concentration of petrified wood, formed when Triassic-era trees were buried and mineralized roughly 225 million years ago. Established as a national monument in 1906 and a national park in 1962, its 221,390 acres include both the colorful Painted Desert and expansive high-desert grasslands."

