seo_title: "Virgin Islands National Park: Snorkeling, Hikes & Tips"
seo_description: "Visit Virgin Islands National Park on St. John, USVI: free entry, coral reefs, sea turtles, Trunk Bay, plantation ruins, and top hikes."
intro_text: "Virgin Islands National Park covers 14,689 acres on the island of St. John in the U.S. Virgin Islands — roughly two-thirds of the island's land area — and was established in 1956 after Laurance Rockefeller donated 5,000 acres to the federal government. Free to enter, the park protects coral reef, tropical dry forest, and the ruins of 18th-century sugar plantations along more than 20 miles of coastline."

