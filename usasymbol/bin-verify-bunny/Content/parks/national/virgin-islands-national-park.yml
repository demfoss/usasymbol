sections:
  overview: |
    Virgin Islands National Park covers 14,689 acres on the island of St. John — about two-thirds of its land — plus a submerged buffer of coral reef extending 0.25 miles offshore. St. John is the smallest of the three main U.S. Virgin Islands and has no commercial airport; visitors fly to St. Thomas and take a 20-minute ferry from Red Hook to Cruz Bay, where the park visitor center is located. The park protects coral reef, tropical dry forest, mangroves, and plantation ruins across a rugged, hilly landscape that reaches about 1,277 feet at Bordeaux Mountain. Entry is free, and the park ranks 50th in annual visitation among the 63 U.S. national parks, drawing roughly 374,000 visitors per year. Trunk Bay, Cinnamon Bay, and Maho Bay are the park's main beach areas, each accessible by car or taxi from Cruz Bay.

  known_for: |
    The park is best known for Trunk Bay, consistently listed among the top beaches in the Caribbean, where a 225-yard underwater snorkel trail runs along a coral reef with labeled features visible through the water. The Reef Bay Trail descends through tropical forest to the ruins of a 19th-century sugar estate and, along the way, passes a freshwater pool with Taino petroglyphs carved into the rocks — the most accessible Indigenous rock art site in the U.S. Virgin Islands. Cinnamon Bay holds the park's only campground, one of the most popular beach camping destinations in the National Park System. Sea turtles nest on several park beaches from May through October.

  best_things_to_see_items:
    - name: "Trunk Bay and Underwater Snorkel Trail"
      description: "A 225-yard underwater self-guided trail along a coral reef in Trunk Bay, marked with labeled signs identifying coral and fish species. Snorkel gear rental and lockers are available on the beach. A day-use fee applies at Trunk Bay; arrive before 10 a.m. to secure parking and a spot on the sand. Green sea turtles are regularly seen feeding on the reef."
      image: "/images/parks/national/virgin-islands-national-park/08-trunk-bay-trunk-cay.jpg"
      alt: "Trunk Bay Cay"
      credit: "William Archer"
    - name: "Reef Bay Trail and Taino Petroglyphs"
      description: "A 2.2-mile trail descending through five distinct vegetation zones from the north side road to Reef Bay on the south shore, passing a freshwater pool with pre-Columbian Taino petroglyphs and the ruins of the Reef Bay sugar estate. The NPS offers ranger-led boat trips from the bay back to Cruz Bay; book at the visitor center. The trailhead is on Centerline Road."
      image: "/images/parks/national/virgin-islands-national-park/09-reef-bay-petroglyphs.jpg"
      alt: "Petroglyphs at Reef Bay"
      credit: "NPS Photo"
    - name: "Annaberg Plantation Ruins"
      description: "One of the best-preserved sugar plantation complexes in the U.S. Virgin Islands, including a windmill tower, boiling room, and slave quarters on a hilltop above Leinster Bay. A self-guided trail with interpretive signs explains the plantation's history and the lives of the enslaved people who worked it. The ruins are free to visit and accessible from the North Shore Road."
      image: "/images/parks/national/virgin-islands-national-park/10-annaberg-plantation.jpg"
      alt: "Annaberg Plantation"
      credit: "NPS Photo"
    - name: "Cinnamon Bay"
      description: "The longest beach on St. John and the site of the park's only campground, with calm water, good snorkeling on the reef at the bay's eastern end, and a water sports center offering kayak and paddleboard rentals. An archaeological site near the campground preserves pre-Columbian Taino artifacts. The beach is 2.5 miles east of Cruz Bay on the North Shore Road."
      image: "/images/parks/national/virgin-islands-national-park/11-cinnamon-bay.jpg"
      alt: "View of Cinnamon Bay"
      credit: "Brian FitGerald"
    - name: "Francis Bay and Bird Watching"
      description: "A sheltered bay on the north coast with a brackish pond and mangrove border that draws the highest concentrations of shorebirds and waders on St. John. Black-necked stilts, white-cheeked pintails, great blue herons, and frigatebirds are regularly seen from the 0.5-mile trail. Kayaking in the bay at dusk can reveal bioluminescent plankton in calm conditions."
      image: "/images/parks/national/virgin-islands-national-park/12-francis-bay-bird-watching.jpg"
      alt: "Four Stilts in the Francis Bay Pond"
      credit: "Caroline Rogers"
    - name: "Coral Reef Snorkeling and Sea Turtles"
      description: "Beyond Trunk Bay, the park's fringing reefs at Waterlemon Cay (reached by a short swim from Leinster Bay beach), Maho Bay, and Honeymoon Beach offer snorkeling with less crowding. Green and hawksbill sea turtles are present throughout the park's waters year-round and are commonly encountered by snorkelers, particularly at Trunk Bay and Waterlemon Cay."
      image: "/images/parks/national/virgin-islands-national-park/13-coral-reef-sea-turtle.jpg"
      alt: "Green Turtle"
      credit: "Lunique Henley"

