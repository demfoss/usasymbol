sections:
  overview: |
    Guadalupe Mountains National Park sits in far west Texas along the New Mexico border, about 110 miles east of El Paso. The park covers 86,367 acres, anchored by the Guadalupe Mountains, an uplifted segment of the ancient Capitan Reef, rising sharply from the Chihuahuan Desert to Guadalupe Peak at 8,751 feet, the highest point in Texas. McKittrick Canyon cuts into the eastern flank of the range and holds a rare riparian forest of bigtooth maples, the source of the most vivid fall color in the state. Ranked 58th of 63 national parks by visitation, the park draws about 236,000 visitors a year, keeping crowds thin on nearly all trails.

  known_for: |
    **Guadalupe Peak**: at 8,751 feet it is the highest point in Texas, reachable by an 8.4-mile round-trip trail with 3,000 feet of gain. **Permian fossil reef**: the Guadalupe Mountains expose the world's most extensive and best-preserved cross-section of a Permian-age reef, built roughly 265 million years ago in a shallow inland sea. **McKittrick Canyon fall foliage**: bigtooth maple, velvet ash, and chinkapin oak turn red, orange, and gold in October, producing the most dramatic fall color display in Texas. **The Bowl**: a forested highland basin at about 8,000 feet holding relict stands of ponderosa pine, Douglas fir, and limber pine, a cool-climate ecosystem entirely surrounded by desert.

  best_time_to_visit: |
    **Spring (March-May)** Temperatures range from 45 to 75 degrees Fahrenheit at the Pine Springs trailhead. Wildflowers including claret cup cactus and desert marigold bloom across the lower slopes in March and April. Wind is frequent and can be strong, especially in March. Crowds are light.

    **Summer (June-August)** Highs reach 85 to 95 degrees at the lower elevations. The high-country trails in The Bowl and along the ridge stay 15 to 20 degrees cooler. Afternoon monsoon thunderstorms arrive in July and August, bringing brief but intense rain; start ridge hikes before 10 a.m. Visitor numbers remain modest even at peak season.

    **Fall (September-October)** The best overall season. McKittrick Canyon's bigtooth maples peak in mid- to late October, drawing the park's highest day-use crowds. Temperatures cool to 40 to 70 degrees. The canyon trail fills early on October weekends; arrive before 8 a.m. or visit midweek.

    **Winter (November-February)** Cold at the summit, with highs in the 30s and 40s, with occasional snow and ice on the upper trails. Guadalupe Peak summit hikes require layering and caution. The lower desert trails stay accessible and uncrowded. Pine Springs and Dog Canyon campgrounds remain open.

  hiking: |
    **Easy** Smith Spring Loop covers about 2.3 miles through the lower desert near Frijole Ranch, passing a spring-fed oasis where bigtooth maples grow and birds concentrate. The trail is shaded in sections and good for wildlife watching in the morning.

    **Moderate** Devil's Hall Trail runs 4.2 miles round trip up a dry streambed in Pine Springs Canyon, reaching a narrow natural staircase of layered limestone. The route requires some boulder scrambling near the hall itself and stays mostly in the canyon shade. McKittrick Canyon Trail follows a spring-fed stream 4.8 miles one way to Pratt Cabin, then climbs higher into the canyon through bigtooth maple forest; the 9.6-mile round trip is the standard full day hike. October visits for fall color require an early start; the small canyon parking lot fills by 9 a.m. on weekends.

    **Strenuous** Guadalupe Peak Trail is 8.4 miles round trip with 3,000 feet of gain from Pine Springs trailhead to the highest point in Texas at 8,751 feet. The upper ridge is exposed and wind-scoured; conditions can change rapidly. Start before 7 a.m. to allow time before afternoon storms. The Bowl Loop via Bush Mountain Trail covers about 12 miles with roughly 2,900 feet of combined gain, circling the high forested basin and passing the park's best views of the Chihuahuan Desert far below.

  camping: |
    The park has two developed campgrounds and a backcountry permit system. Pine Springs Campground near the visitor center has about 40 tent sites and 20 RV sites (no hookups) at 5,700 feet, open year-round on a first-come, first-served basis; sites cost $8 per night. Dog Canyon Campground on the remote north side of the park offers about 13 sites (tent and RV) at 6,300 feet, also year-round and first-come at $8 per night. Dog Canyon is 70 miles by road from Pine Springs and provides a quiet base for the north-side trails. Backcountry camping is free with a permit, available at the Pine Springs Visitor Center or the Dog Canyon Ranger Station; pack out all waste, as there are no backcountry water sources; carry at least one gallon per person per day.

  fees_reservations: |
    Entry costs $10 per vehicle or $5 per person on foot, bicycle, or horseback; passes cover seven consecutive days. The America the Beautiful annual pass ($80) covers entry. Pine Springs and Dog Canyon campgrounds charge $8 per night, no reservations accepted; both are first-come, first-served. Backcountry permits are free and self-issued at the visitor center or ranger station. No permits are required for day hiking. Confirm current fees and rules at the official park page at nps.gov/gumo.

  getting_there: |
    **By car** The Pine Springs Visitor Center and main trailheads sit on U.S. Highway 62/180, about 55 miles east of El Paso and 35 miles south of Carlsbad, New Mexico. McKittrick Canyon has its own entrance off U.S. 62/180, about 4 miles northeast of Pine Springs. Dog Canyon, on the park's north side, is reached by a 70-mile drive via NM-137 from Carlsbad. No shuttle operates between sections of the park.

    **By air** El Paso International Airport (ELP) is roughly 110 miles west on U.S. 62/180 and is the most practical option. Midland International Airport (MAF) is about 170 miles east. A rental car is required from either airport; no public transit reaches the park.

  geology: |
    About 265 million years ago, a warm shallow sea called the Delaware Basin covered west Texas and southeastern New Mexico. Around its margins, sponges, algae, and other marine organisms built a massive horseshoe-shaped reef, the Capitan Reef, over millions of years. As the sea evaporated, the reef was buried under thousands of feet of salt, gypsum, and other sediments.

    Tectonic forces beginning about 65 million years ago lifted the buried reef as a fault-block mountain range. Erosion stripped away the overlying sediments, exposing the ancient reef rock, now limestone and dolomite, at the surface. The Guadalupe Mountains are the exposed northeastern wall of that reef; El Capitan, the massive limestone escarpment visible for miles across the desert, is the reef's outer edge.

    The same reef continues underground to the northwest, where acidic groundwater dissolved passages through the limestone to form Carlsbad Caverns, about 35 miles away. Fossil sponges, brachiopods, and other Permian marine animals are visible in the rock throughout the park, making the Guadalupes one of the world's most accessible windows into a 265-million-year-old ocean.

    The high-country soils support forests that date to the last ice age, when cooler, wetter conditions extended across the region. As the climate dried and warmed after the ice age, these forests retreated to the highest elevations, surviving as isolated sky islands. The Bowl at 8,000 feet holds the largest such relict forest in the park.

  wildlife: |
    Mule deer are common throughout the park and are frequently visible near the Pine Springs Visitor Center and along the lower canyon trails in the early morning. Elk were introduced to the Guadalupes in the 20th century and range across the high country; they are most often seen near The Bowl and along the ridge trails.

    Mountain lions live in the park and occasionally appear on trail cameras near the canyons; sightings by hikers are rare. Black bears visit sporadically from adjacent ranges but are not resident. Collared peccaries (javelinas) forage in the lower desert scrub around Pine Springs and the Salt Basin area.

    Peregrine falcons nest on the limestone cliffs of El Capitan and the canyon walls. Mexican spotted owls inhabit the shaded canyon forests of McKittrick and Dog Canyons. Golden eagles soar over the escarpment. Over 300 bird species have been recorded in the park, with McKittrick Canyon's riparian corridor holding the highest diversity. Roadrunners, scaled quail, and several species of rattlesnake are common in the desert lowlands.

  history: |
    Mescalero Apache people used the Guadalupe Mountains for thousands of years, hunting mule deer and elk in the highlands, gathering sotol and agave on the slopes, and retreating to the canyons for water and shelter. The spring at Mescalero Spring near Pine Springs was a critical water source on an otherwise dry stretch of desert. Mescalero resistance to American expansion persisted into the 1870s.

    The Butterfield Overland Mail route, which carried mail and passengers between St. Louis and San Francisco from 1858 to 1861, passed directly through the park. The Pinery Station, one of the stage stops along this route, was built near Pine Springs in 1858. Its ruins remain visible near the current visitor center, one of the few surviving Butterfield stage structures anywhere along the 2,800-mile route.

    Wallace Pratt, a geologist who discovered major oil fields for Humble Oil, first visited McKittrick Canyon in the 1920s and fell so deeply attached to the land that he built a stone cabin there in 1934. He later donated his 5,632-acre McKittrick Canyon holding to the federal government to seed the park's creation. Congress established Guadalupe Mountains National Park on September 30, 1972. The Pratt Cabin still stands in the canyon and is open for day visitors.

  best_things_to_see_items:
    - name: "Guadalupe Peak"
      description: "The highest point in Texas at 8,751 feet, reached by an 8.4-mile round-trip trail from Pine Springs with 3,000 feet of gain. A stainless-steel monument at the summit marks the peak's importance as a landmark for the Butterfield Overland Mail. Clear days bring views into New Mexico, the Salt Basin below, and the full curve of the Capitan Reef escarpment."
      image: "/images/parks/national/guadalupe-mountains-national-park/06-guadalupe-peak.jpg"
      alt: "A hiker stands on a peak with lower mountains in the background at sunset"
      credit: "Laurence Parent"
    - name: "McKittrick Canyon"
      description: "A spring-fed canyon on the eastern flank of the range, holding the best fall foliage in Texas. Bigtooth maple, velvet ash, and chinkapin oak turn red and orange in mid- to late October. The 9.6-mile round-trip trail to Pratt Cabin follows a clear stream through narrowing limestone walls. The small parking lot fills by 9 a.m. on October weekends; arrive early or visit midweek."
      image: "/images/parks/national/guadalupe-mountains-national-park/07-mckittrick-canyon.jpg"
      alt: "A trail winds through Chihuahuan desert vegetation"
      credit: "NPS/E. Jackson"
    - name: "El Capitan"
      description: "A 1,000-foot limestone cliff forming the southern tip of the Guadalupe Mountains escarpment and the most recognizable landform in the park, visible from 50 miles across the Chihuahuan Desert. El Capitan marks the outer edge of the ancient Capitan Reef. The El Capitan Trail loops about 9.5 miles around its base through desert scrub, with close-up views of the massive wall above."
      image: "/images/parks/national/guadalupe-mountains-national-park/08-el-capitan.jpg"
      alt: "A tall peak is lit by the rising sun. "
      credit: "NPS Photo"
    - name: "The Bowl"
      description: "A forested highland basin at about 8,000 feet, holding ponderosa pine, Douglas fir, limber pine, and southwestern white pine, relict species left over from the last ice age, surrounded entirely by Chihuahuan Desert below. The Bowl Loop via Bush Mountain Trail covers about 12 miles with roughly 2,900 feet of gain and is the park's best full-day hike for forest scenery and high-country views."
      image: "/images/parks/national/guadalupe-mountains-national-park/09-the-bowl.jpg"
      alt: "wildflowers blossom along The Bowl trail"
      credit: "NPS Photo/Bieri"
    - name: "Devil's Hall"
      description: "A narrow limestone corridor in Pine Springs Canyon reached by a 4.2-mile round-trip trail that follows a dry streambed before climbing a natural staircase of eroded rock ledges. The walls of the hall rise steeply on both sides and are a textbook example of the park's Permian reef limestone. The route requires some boulder scrambling near the entrance to the hall."
      image: "/images/parks/national/guadalupe-mountains-national-park/10-devil-s-hall.jpg"
      alt: "Groups of people in the sunlight at the end of a narrow tall canyon."
      credit: "NPS Photo"
    - name: "Salt Basin Flats"
      description: "A vast white salt flat west of the park, visible from the upper trails as a bright expanse on the valley floor. After heavy monsoon rain in summer the flats flood temporarily, creating a shallow reflective lake that mirrors the Guadalupe escarpment. The flats are accessible by high-clearance vehicle via a dirt road off U.S. 62/180 and are used by birders during migratory seasons."
      image: "/images/parks/national/guadalupe-mountains-national-park/11-salt-basin-flats.jpg"
      alt: "the slat flats become flooded during monsoon months after large rain events."
      credit: "NPS/Yates"
    - name: "Pinery Butterfield Stage Station"
      description: "The stone ruins of an 1858 stage stop on the Butterfield Overland Mail route, one of the few surviving physical remnants of the 2,800-mile mail road between Missouri and San Francisco. The ruins are a short walk from the Pine Springs Visitor Center and include interpretive signs explaining the route and the Mescalero Apache history of the spring nearby."
      image: "/images/parks/national/guadalupe-mountains-national-park/12-pinery-butterfield-stage-station.jpg"
      alt: "A trail winds past the ruins of a rock wall in a desert landscape"
      credit: "Giraffeascope"

