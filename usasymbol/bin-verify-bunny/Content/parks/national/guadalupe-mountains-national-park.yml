faq:
  - question: "Where is Guadalupe Mountains National Park?"
    answer: "Guadalupe Mountains National Park is in far west Texas on the New Mexico border, along U.S. Highway 62/180. The Pine Springs Visitor Center is about 55 miles east of El Paso and 35 miles south of Carlsbad, New Mexico. The nearest major airport is El Paso International (ELP), roughly 110 miles west."
  - question: "What is the entrance fee for Guadalupe Mountains National Park?"
    answer: "Entry costs $10 per vehicle or $5 per person on foot, bicycle, or horseback; passes cover seven consecutive days. Camping at Pine Springs and Dog Canyon costs an additional $8 per site per night. The America the Beautiful annual pass covers entry."
  - question: "When is the best time to visit Guadalupe Mountains National Park?"
    answer: "Fall, specifically mid- to late October, is the most popular time for McKittrick Canyon's fall foliage, the most spectacular in Texas. Spring (March-May) is good for wildflowers and comfortable temperatures. Summer stays cool in the high country despite desert heat below. Winter is quiet, with possible ice on upper trails."
  - question: "How hard is the hike to Guadalupe Peak?"
    answer: "The Guadalupe Peak Trail is strenuous: 8.4 miles round trip with 3,000 feet of elevation gain to 8,751 feet. The upper ridge is exposed and often windy. Most hikers allow 6 to 8 hours. Start before 7 a.m. to finish before afternoon thunderstorms develop in summer."
  - question: "Is there water available on the trails?"
    answer: "No reliable water sources exist on most trails. McKittrick Canyon has a spring-fed stream, but water should be treated before drinking. Backcountry campers must carry all water, at least one gallon per person per day. Water is available at Pine Springs Visitor Center and Dog Canyon Ranger Station."
  - question: "Can you see Carlsbad Caverns from Guadalupe Mountains National Park?"
    answer: "The two parks are about 35 miles apart and are not visible from one another. Both protect the same ancient Permian reef system: the surface at Guadalupe Mountains and the underground dissolution features at Carlsbad Caverns. Many visitors combine both parks in a single trip. No road connects them directly; the drive takes about 45 minutes via U.S. 62/180."
  - question: "Do I need a reservation to camp at Guadalupe Mountains?"
    answer: "No. Both Pine Springs and Dog Canyon campgrounds are first-come, first-served with no reservations. They rarely fill except on October weekends during peak fall foliage season. Backcountry camping is free with a self-issued permit from the visitor center or ranger station."

  - question: What state is Guadalupe Mountains National Park in?
    answer: Guadalupe Mountains National Park is in [Texas](/states/texas), near Carlsbad, New Mexico.

