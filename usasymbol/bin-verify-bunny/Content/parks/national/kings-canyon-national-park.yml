sections:
  overview: |
    Kings Canyon National Park protects 461,901 acres of the southern Sierra Nevada in California, jointly managed with adjacent Sequoia National Park under a single entrance fee. The park's two distinct areas serve different audiences: Grant Grove, open year-round, holds the General Grant sequoia grove near the west entrance, while Cedar Grove descends into the canyon bottom at roughly 4,600 feet elevation and is accessible only from late May through October. The canyon carved by the South Fork Kings River reaches up to 8,200 feet deep at its maximum, ranking among the deepest canyons in North America. Fresno, the nearest city, sits about 55 miles west via Highway 180.

  known_for: |
    - **Canyon depth**: The Kings Canyon gorge measures up to 8,200 feet from canyon rim to river, deeper than the Grand Canyon at comparable points and among the greatest vertical drops in North America.
    - **General Grant Tree**: The second-largest tree by volume in the world, 267 feet tall with a base circumference of 107 feet, designated the Nation's Christmas Tree by Congress in 1926.
    - **Rae Lakes Loop**: A 41-mile backpacking circuit through high Sierra lakes, granite passes, and meadows, widely considered one of the finest multi-day routes in the Sierra Nevada.
    - **Mist Falls**: The most popular day hike destination in the park, an 8.4-mile round trip from Roads End to a powerful waterfall on the South Fork Kings River.


  best_things_to_see_items:
    - name: "Kings Canyon Overlook"
      description: "Highway 180 descends into the canyon from Grant Grove to Cedar Grove along the Kings Canyon Scenic Byway, one of the most dramatic road descents in California. Several pullouts and formal overlooks give wide views of the 8,200-foot canyon walls above the Kings River. The drive to Cedar Grove takes about 45 minutes from Grant Grove."
      image: "/images/parks/national/kings-canyon-national-park/04-kings-canyon-overlook.jpg"
      alt: "A guardrail encircles people along a narrow walkway with wide views of Kings Canyon"
      credit: "NPS/Paul Johnson"
    - name: "High Sierra Wilderness"
      description: "Most of Kings Canyon's 461,901 acres are designated wilderness with no roads. Backcountry permits open the park's granite peaks, cirque lakes, and high passes to hikers and equestrians willing to travel several days from the trailheads at Roads End. The John Muir Trail passes through the park's eastern backcountry."
      image: "/images/parks/national/kings-canyon-national-park/05-high-sierra-wilderness.jpg"
      alt: "A steep granite slope leads from forest to a bare alpine landscape"
      credit: "NPS/Rick Cain"
    - name: "General Grant Tree"
      description: "The General Grant Tree in Grant Grove is the second-largest living tree by volume on earth, 267 feet tall with a base circumference of 107 feet. The 0.6-mile Grant Tree Trail loops through the grove past several other large sequoias. Grant Grove is open year-round, unlike the rest of the park which closes in winter."
      image: "/images/parks/national/kings-canyon-national-park/06-general-grant-tree.jpg"
      alt: "A view of the General Grant tree"
      credit: "NPS Photo - Lora Haller"
    - name: "Zumwalt Meadow"
      description: "A flat glacial meadow on the canyon floor surrounded by nearly vertical granite walls rising thousands of feet above the Kings River. The 1.5-mile Zumwalt Meadow Loop is the park's most scenic easy walk, crossing the river on a footbridge and passing through black oak groves and open meadow. Deer and black bears are common here at dawn."
      image: "/images/parks/national/kings-canyon-national-park/07-zumwalt-meadow.jpg"
      alt: "A large meadow underneath towering granite walls."
    - name: "Mist Falls"
      description: "The 8.4-mile round-trip hike from Roads End climbs 600 feet along the South Fork Kings River to one of the largest waterfalls in the Sierra Nevada, at its most powerful in May and June when snowmelt is at peak flow. The trailhead is at the end of Highway 180 in Cedar Grove, with no further road access into the park."
      image: "/images/parks/national/kings-canyon-national-park/08-mist-falls.jpg"
      alt: "A cascading waterfall with massive granite mountains in the background."
    - name: "Roaring River Falls"
      description: "A short 0.4-mile round-trip walk from a parking area on the Cedar Grove road leads to a narrow granite chute where Roaring River drops into an emerald pool. The falls run strongest in spring but flow through summer. The accessible paved path is one of the few walks in the canyon bottom suitable for all ages."
      image: "/images/parks/national/kings-canyon-national-park/09-roaring-river-falls.jpg"
      alt: "A powerful chute of water flows into a dark blue pool. Surrounded by high rock walls"

  best_time_to_visit: |
    **Spring (May-June)** marks the opening of Cedar Grove, typically in late May, when snowmelt swells the Kings River to its highest and loudest. Mist Falls and Roaring River Falls peak in June. The Grant Grove sequoia area is accessible year-round but trails at higher elevations remain snow-covered through May.

    **Summer (July-August)** is peak season. All roads are open, Cedar Grove lodging and services operate fully, and the canyon floor temperature climbs to 85-95°F. Start canyon hikes before 9 a.m. to avoid midday heat. No timed-entry permit is required, but Cedar Grove lodging sells out months in advance.

    **Fall (September-October)** is the quietest productive season. Temperatures in the canyon cool to 60-75°F, the Kings River runs calm and clear for fishing, and black oak foliage turns gold in October. The Cedar Grove road closes for winter in mid-October; visit before the second week of October to access the canyon.

  hiking: |
    **Easy trails** concentrate in two areas. The General Grant Tree Trail is a 0.6-mile loop through Grant Grove's sequoia giants, paved and accessible. In Cedar Grove, the Roaring River Falls Trail covers 0.4 miles to a narrow granite gorge waterfall, and the Zumwalt Meadow Loop adds 1.5 miles of flat walking along the Kings River beneath canyon walls.

    **Moderate trails** gain elevation or distance. The Mist Falls Trail runs 8.4 miles round trip from Roads End with 600 feet of gain along the South Fork Kings River to one of the Sierra's largest waterfalls. The Hotel Creek Trail climbs 1,200 feet in 4 miles from Cedar Grove to a canyon-rim viewpoint, then loops back on the Lewis Creek Trail for a total of about 8 miles.

    **Strenuous backpacking** defines the park's interior. The Rae Lakes Loop covers 41 miles with roughly 6,000 feet of cumulative gain through three high lakes, Glen Pass at 11,978 feet, and the Sixty Lake Basin. A wilderness permit is required; quotas fill quickly in summer and permits must be reserved through recreation.gov. Carry a bear canister, mandatory in all Kings Canyon backcountry.

  camping: |
    Grant Grove has two main campgrounds. Sunset, with about 200 sites, is the largest and sits within easy walking distance of the General Grant Tree trailhead. Azalea is the only campground in the park open year-round, with roughly 110 sites near the Grant Grove visitor center.

    Cedar Grove has two reservable campgrounds: Sheep Creek (111 sites) and Sentinel (82 sites), both bookable at recreation.gov. All Cedar Grove campgrounds operate late May through October only. Sentinel is the closest to the Roads End trailheads for Mist Falls and Rae Lakes.

    Backcountry camping requires a wilderness permit and a bear canister. Permits for popular routes like the Rae Lakes Loop release six months in advance at recreation.gov and sell out within hours of opening. Walk-up permits for less popular entry points are sometimes available at the Cedar Grove Visitor Center the morning before departure.

  fees_reservations: |
    The 7-day vehicle pass costs $35 and covers both Kings Canyon and Sequoia national parks. Motorcycles pay $30, and individuals entering on foot or bicycle pay $20. The America the Beautiful annual pass ($80) covers entry to both parks.

    No timed-entry reservation is required for general park access. Cedar Grove lodging reservations are made through the park concessioner and sell out months ahead for summer. Campsite reservations for Sheep Creek, Sentinel, Sunset, and Azalea campgrounds open six months in advance at recreation.gov. Backcountry wilderness permits are separate and also booked through recreation.gov.

    Confirm current fees and rules at the official park page at nps.gov/kica.

  getting_there: |
    **By car from Fresno**: Take Highway 180 east from Fresno about 55 miles to the Big Stump entrance. Grant Grove is 3 miles past the entrance. Continue another 36 miles on Highway 180 to reach Cedar Grove (road open late May through mid-October only).

    **From Sequoia National Park**: The Generals Highway connects Sequoia's Lodgepole area to Grant Grove in Kings Canyon, about 30 miles. Note that there is no through road between Cedar Grove and Sequoia; reaching Cedar Grove always requires entering via Highway 180 from the west.

    **By air**: Fresno Yosemite International Airport (FAT) is about 55 miles from the park entrance. No public transit serves the park; a rental car is required.

  geology: |
    Kings Canyon was carved by glaciers and the South Fork Kings River cutting through the Sierra Nevada batholith, the massive granite intrusion that forms the spine of California. The granite formed underground from cooling magma roughly 80-100 million years ago, then lifted and tilted westward as the Sierra block rose along a fault. Glaciers during the Pleistocene deepened and widened the canyon, leaving the near-vertical walls visible today.

    The canyon's maximum depth of 8,200 feet is measured from the summit of Spanish Mountain on the rim to the Kings River below, a vertical relief comparable to the Grand Canyon's greatest measured depths. Unlike the Grand Canyon, which exposes horizontal sedimentary layers, Kings Canyon cuts through relatively uniform granite; its drama comes from sheer wall height rather than layered color.

    Roches moutonnées, polished and striated granite outcrops smoothed by glacier passage, appear throughout the canyon floor and are clearly visible near Zumwalt Meadow. Glacial erratics, boulders transported and deposited by ice, dot the meadows and valley floor. The Kings River continues to erode the canyon floor today, cutting downward at a rate geologists can measure.

  wildlife: |
    Black bears are the park's most commonly encountered large mammal, active throughout the canyon and sequoia groves from spring through fall. All food must be stored in bear boxes provided at campgrounds or in hard-sided bear canisters in the backcountry. Mule deer are visible year-round in Grant Grove and along the Zumwalt Meadow loop at dawn and dusk.

    Marmots and pikas inhabit the rocky talus slopes above treeline in the high Sierra backcountry; pikas are best detected by their sharp alarm calls from boulder fields around 10,000 feet. Mountain lions are present throughout the park but rarely seen. Steller's jays are the most vocal and visible birds at campgrounds and trailheads.

    Golden eagles hunt the canyon rim updrafts and are visible soaring above Cedar Grove most summer mornings. The Kings River supports a wild rainbow trout fishery; a California fishing license is required for all anglers 16 and older.

  history: |
    The Yokuts people occupied the San Joaquin Valley foothills west of the Sierra, and Paiute bands used the high Sierra valleys seasonally for hunting. Both groups had established trade networks and travel routes across the range long before European contact. Their use of the Kings River corridor is documented in bedrock mortars and hunting camps found throughout the lower canyon.

    Explorer Joseph Walker crossed the Sierra Nevada in 1833 and his party became the first non-Indigenous people to see the giant sequoias. The Kings River canyon was named by Spanish missionaries who called it El Río de los Santos Reyes (River of the Holy Kings). John Muir visited and wrote about the canyon in the 1870s and 1880s, arguing that it surpassed Yosemite Valley in grandeur.

    Congress established General Grant National Park in 1890 to protect the Grant Grove sequoias, making it one of the earliest national parks. Kings Canyon National Park was created on March 4, 1940, absorbing the older park and adding the canyon wilderness. Congress added additional acreage in 1965 to include the Cedar Grove and Tehipite Valley areas.

