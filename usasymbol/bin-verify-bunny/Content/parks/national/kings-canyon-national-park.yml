faq:
  - question: "Where is Kings Canyon National Park?"
    answer: "Kings Canyon National Park is in the southern Sierra Nevada in central California, about 55 miles east of Fresno via Highway 180. It shares a boundary with Sequoia National Park and is managed jointly under the same entrance fee."
  - question: "What is the best time to visit Kings Canyon?"
    answer: "July and August offer the best access with all roads open. Fall (September to mid-October) is excellent with cooler temperatures, fewer crowds, and fall color in the canyon. The Cedar Grove road closes in mid-October; Grant Grove is accessible year-round."
  - question: "How deep is Kings Canyon?"
    answer: "Kings Canyon reaches a maximum depth of about 8,200 feet from the canyon rim to the Kings River, measured from Spanish Mountain. That makes it one of the deepest canyons in North America, comparable in vertical relief to the Grand Canyon."
  - question: "Do Kings Canyon and Sequoia share an entrance fee?"
    answer: "Yes. A single $35 vehicle pass covers both Kings Canyon and Sequoia national parks for 7 days. The America the Beautiful annual pass ($80) also covers both."
  - question: "Is Cedar Grove accessible year-round?"
    answer: "No. The Cedar Grove section of the park is open only from late May through mid-October. The road closes for winter due to snow. Grant Grove near the west entrance is open year-round."
  - question: "Do you need a permit for Kings Canyon?"
    answer: "No timed-entry permit is required to enter the park. A wilderness permit is required for overnight backcountry camping; permits for popular routes like the Rae Lakes Loop release six months ahead at recreation.gov and sell out quickly. Bear canisters are required in all backcountry areas."
  - question: "What is the General Grant Tree?"
    answer: "The General Grant Tree is the second-largest living tree by volume on earth, standing 267 feet tall with a base circumference of 107 feet. Congress designated it the Nation's Christmas Tree in 1926. It stands in Grant Grove, accessible year-round on a short paved loop trail."

  - question: What state is Kings Canyon National Park in?
    answer: Kings Canyon National Park is in [California](/states/california), near Fresno, California.

