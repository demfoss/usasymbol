seo_title: "Kings Canyon National Park: Hikes, Map & Best Time"
seo_description: "Plan your Kings Canyon National Park trip: explore one of North America's deepest canyons, hike to Zumwalt Meadow, see giant sequoias, and learn about fees and reservations."
intro_text: "Kings Canyon National Park preserves one of the deepest canyons in North America and some of the most spectacular high Sierra wilderness in [California](/states/california). The park covers 461,901 acres of rugged terrain in the southern Sierra Nevada, from the canyon floor carved by the Kings River to alpine peaks above 14,000 feet."

