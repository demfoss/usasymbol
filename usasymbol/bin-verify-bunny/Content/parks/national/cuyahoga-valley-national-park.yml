sections:
  overview: |
    Cuyahoga Valley National Park occupies a narrow river corridor in northeastern Ohio, stretching roughly 22 miles between the city limits of Cleveland to the north and Akron to the south. The park protects 32,572 acres along the Cuyahoga River valley and includes the historic route of the Ohio and Erie Canal, one of the engineering projects that opened the American interior to commerce in the 1800s. With roughly 2.9 million visitors in 2023, Cuyahoga Valley ranks 13th among all 63 U.S. national parks by attendance, drawing visitors from the surrounding urban region year-round. Entrance is free and no reservation is required for most activities; the main visitor facilities are at Canal Visitor Center in Valley View and Boston Mill Visitor Center near Peninsula.

  known_for: |
    Brandywine Falls, a 65-foot waterfall that drops over layered ledges of Sharon Conglomerate and Berea Sandstone — the most photographed spot in the park and a 5-minute walk from the parking area.
    The Ohio and Erie Canal Towpath Trail, a flat, crushed-limestone path that follows the original canal towpath for roughly 20 miles through the park, open to hikers and cyclists.
    Cuyahoga Valley Scenic Railroad, one of the few heritage railroads operating within a U.S. national park, running excursion trains through the valley between Akron and the Rockside station near Independence.
    Beaver Marsh, a restored wetland along the Towpath Trail where beavers, great blue herons, and river otters are regularly seen from a viewing platform — the most reliable wildlife-watching stop in the park.

  best_things_to_see_items:
    - name: "Brandywine Falls"
      description: "Brandywine Falls drops 65 feet over a series of layered rock ledges in the northeastern corner of the park, making it the tallest and most-visited waterfall in Cuyahoga Valley. A short boardwalk from the parking area reaches an overlook platform directly above the falls in about 5 minutes. The Brandywine Gorge Trail descends into the ravine for a base-level view; the falls flow year-round and run strongest in spring after snowmelt."
      image: "/images/parks/national/cuyahoga-valley-national-park/06-brandywine-falls.jpg"
      alt: "Viewed from above, people stand on a platform near frothy white water falling over a rocky ledge."
      credit: "NPS Photo / D.J. Reiser"
    - name: "Ohio and Erie Canal Towpath Trail"
      description: "The Towpath Trail runs roughly 20 miles through the park along the original bed of the Ohio and Erie Canal, built between 1825 and 1832. The surface is flat and mostly crushed limestone, making it accessible for hikers, cyclists, and families with strollers. The trail passes historic lock sites, the Beaver Marsh wetland, and several canal-era structures between Canal Visitor Center in the north and Botzum Trailhead in the south."
      image: "/images/parks/national/cuyahoga-valley-national-park/07-ohio-and-erie-canal-towpath-trail.jpg"
      alt: "Three bikers ride down the towpath trail. The surrounding area is wooded and full of green foilage."
      credit: "NPS / DJR"
    - name: "Cuyahoga Valley Scenic Railroad"
      description: "The Cuyahoga Valley Scenic Railroad operates heritage diesel excursion trains through the park, with boarding stations at Akron Northside, Peninsula, Brecksville, and Independence. The railroad has served the valley since the 1880s. Tickets are purchased separately from park admission; the railroad runs themed excursions throughout the year, including fall foliage trips and a Bike Aboard program that lets cyclists load their bikes for a one-way train ride."
      image: "/images/parks/national/cuyahoga-valley-national-park/08-cuyahoga-valley-scenic-railroad.jpg"
      alt: "A yellow-and-red engine with number 6777 leads a passenger train along tracks through green trees."
      credit: "NPS Photo / Robert George"
    - name: "Ledges Area"
      description: "The Ledges area exposes a dramatic series of Sharon Conglomerate outcroppings that rise above the forest floor in blocks, overhangs, and crevices. The rock is roughly 320 million years old and studded with white quartz pebbles cemented in a dark sandstone matrix. The Ledges Trail loops about 2.2 miles through the formations and along the cliff-top, with views across the fall canopy that make this area the most popular destination in the park in October."
      image: "/images/parks/national/cuyahoga-valley-national-park/09-ledges-area.jpg"
      alt: "Two people stand at the edge of a gray rock cliff; in the distance, sunset and trees in fall colors."
      credit: "NPS Photo / Tim Fenner"
    - name: "Beaver Marsh"
      description: "Beaver Marsh is a restored wetland along the Towpath Trail near the Ira Trailhead, created when beavers colonized a former junkyard site after the NPS removed abandoned vehicles in the 1980s. Today the marsh supports great blue herons, great egrets, muskrats, river otters, and painted turtles visible from a viewing platform directly on the Towpath. Early morning visits in spring offer the best chance of seeing multiple species at once."
      image: "/images/parks/national/cuyahoga-valley-national-park/10-beaver-marsh.jpg"
      alt: "board walk in the beaver marsh"
      credit: "NPS / Sue Simenc"
    - name: "Blue Hen Falls"
      description: "Blue Hen Falls is a quieter waterfall in the southeastern section of the park, reached by a trail that descends into a hemlock-shaded gorge. The falls drop about 15 feet into a small plunge pool and draw far fewer visitors than Brandywine Falls. The surrounding gorge stays cool through summer under a dense hemlock canopy and is one of the best places in the park to find solitude on a busy weekend."
      image: "/images/parks/national/cuyahoga-valley-national-park/11-blue-hen-falls.jpg"
      alt: "Water falls from a rim of gray rock, trees in the background; orange leaves dot the rocky hollow."
      credit: "© Jeffrey Gibson"
    - name: "Canal Visitor Center and Lock"
      description: "The Canal Visitor Center at Valley View anchors the northern end of the park and interprets the Ohio and Erie Canal through exhibits and an operating replica lock. Rangers lead canal lock demonstrations during summer, showing how boats were raised and lowered between canal segments. The center is the northern trailhead for the Towpath Trail and the clearest entry point for understanding the industrial history that shaped the valley."
      image: "/images/parks/national/cuyahoga-valley-national-park/04-canal-visitor-center-lock.jpg"
      alt: "About ten people stand outside on either side of a canal lock lined with gray cement and filled with water."
      credit: "NPS / Ted Toth"

