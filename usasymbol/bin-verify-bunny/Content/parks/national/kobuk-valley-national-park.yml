sections:
  overview: |
    Kobuk Valley National Park covers 1,750,717 acres of the central Brooks Range foothills in northwest Alaska, lying entirely above the Arctic Circle at roughly 67 degrees north latitude. The valley floor holds the Great Kobuk Sand Dunes, the largest active sand dunes in the Arctic, rising up to 100 feet above the surrounding tundra. The Kobuk River, a National Wild and Scenic River, runs 61 miles through the park as the primary travel corridor for the roughly 16,000 visitors who reach the park each year. There are no roads into the park, no maintained trails, and no developed visitor facilities of any kind; the park is among the least visited in the national park system.

  known_for: |
    - **Great Kobuk Sand Dunes**: The largest active Arctic sand dune field in North America covers about 25 square miles of the valley floor, with dunes reaching 100 feet high. The dunes sit incongruously in boreal and tundra landscape just above the Arctic Circle.
    - **Western Arctic caribou herd**: One of the largest caribou herds in the world funnels through the Kobuk Valley during its spring and fall migrations, with hundreds of thousands of animals crossing the river over a period of days to weeks.
    - **Onion Portage**: An archaeological site on the Kobuk River bank where at least 12,500 years of continuous human habitation are documented in stratified layers, one of the most significant prehistoric sites in the Western Hemisphere.
    - **Complete roadless wilderness**: No road has ever reached Kobuk Valley. Every visitor arrives by floatplane or small aircraft, and travel inside the park is entirely by foot, packraft, or canoe on the river.


  best_things_to_see_items:
    - name: "Great Kobuk Sand Dunes"
      description: "The Great Kobuk Sand Dunes cover roughly 25 square miles of the valley floor and rise up to 100 feet. Summer temperatures on the dune surface can exceed 100°F while the surrounding tundra stays cool. Air taxis can land on a gravel bar near the dunes, making them the most accessible destination in the park."
      image: "/images/parks/national/kobuk-valley-national-park/06-great-kobuk-sand-dunes.jpg"
      alt: "Aerial image of sand dunes surrounded by evergreen trees"
      credit: "NPS/Rachel Post"
    - name: "Kobuk River Paddle"
      description: "The Kobuk River flows 61 miles through the park between put-in points at Ambler or Kobuk village and take-out at Kiana, offering a multi-day paddling route through wilderness that most people will never see. The river is Class I with a few Class II riffles and runs through open boreal forest framing the Baird and Waring mountain ranges. Canoes and packrafts are the standard craft."
      image: "/images/parks/national/kobuk-valley-national-park/07-kobuk-river-paddle.jpg"
      alt: "A green pack canoe sits on the bank of the Kobuk River. Clouds are mirrored on the water's surface."
      credit: "NPS Photo / Justine Schmidt"
    - name: "Jade Mountains"
      description: "The Jade Mountains rise above the south bank of the Kobuk River and are visible for miles up and down the valley. The range takes its name from the nephrite jade found in the area; the Kobuk region has produced jade used in trade for thousands of years. The mountains are most striking at low sun angles in late summer when the sky reflects in the river."
      image: "/images/parks/national/kobuk-valley-national-park/08-jade-mountains.jpg"
      alt: "The Jade Mountains reflected in the Kobuk River"
      credit: "NPS Photo / Annie Carlson"
    - name: "Baird Mountains"
      description: "The Baird Mountains form the northern wall of the Kobuk Valley, rising to over 5,000 feet from the valley floor. They are reachable only on foot across open tundra from river landing strips. The summits and ridgelines give panoramic views across the valley to the Waring Mountains to the south."
      image: "/images/parks/national/kobuk-valley-national-park/09-baird-mountains.jpg"
      alt: "aerial view of snow capped mountains"
      credit: "NPS Photo"
    - name: "Western Arctic Caribou Migration"
      description: "In late August and September, the Western Arctic caribou herd moves south through the Kobuk Valley toward winter range, sometimes in columns of thousands of animals crossing the river in a matter of hours. The timing varies each year; contact the NPS before travel for current migration status. River camps along the Kobuk River offer the best vantage points."
      image: "/images/parks/national/kobuk-valley-national-park/10-western-arctic-caribou-migration.jpg"
      alt: "caribou swim across river with green and yellow trees in the background"
      credit: "NPS Photo"
    - name: "Onion Portage"
      description: "A bend in the Kobuk River where Iñupiat hunters have intercepted caribou for at least 12,500 years. Archaeological excavations revealed 30 distinct cultural layers representing every major Arctic cultural tradition from the earliest known inhabitants to the present Iñupiat. The NPS has not developed the site for tourism; it is visited on river trips as a quiet stop on the bank."
      image: "/images/parks/national/kobuk-valley-national-park/06-onion-portage.jpg"
      alt: "Gidding's Cabin at Onion Portage"

  best_time_to_visit: |
    **June-July** brings continuous daylight above the Arctic Circle and the best conditions for the Kobuk River paddling season. Wildflowers bloom across the tundra in June. Mosquitoes and black flies peak from late June through mid-July and can be intense; a head net and bug jacket are essential, not optional.

    **Late August** is the optimal window for most visitors. Insect populations drop sharply, temperatures are comfortable at 45-65°F, tundra vegetation turns red and gold, and the fall caribou migration begins moving through the valley. This is the most popular travel period.

    **September** extends the fall migration and adds dramatic color to the landscape, but weather deteriorates quickly and early snowfall can close air taxi operations. River ice begins forming by late September. Plan with a full weather contingency day built into your schedule.

  hiking: |
    **There are no maintained trails anywhere in Kobuk Valley National Park.** All travel is cross-country on open tundra, river gravel bars, and sand dune surfaces. The Great Kobuk Sand Dunes are reached by walking from a gravel bar landing strip and navigating by sight across open sand; the roughly 1-mile approach from the nearest river bar is the park's most straightforward walk.

    **River bar travel** forms the main easy-to-moderate corridor. Gravel bars along the Kobuk River are flat, firm, and navigable for miles between the water's edge and the tundra, giving hikers a natural path without vegetation obstacles. Floating the river by canoe or packraft is the standard way to move between destinations.

    **Upland and mountain routes** toward the Baird Mountains are strenuous and trackless. Tundra walking requires high effort per mile due to tussocks, wet ground, and uneven terrain. No distance or elevation data exists for specific routes; travel speed is typically 1 to 2 miles per hour across open tundra. Brown bears are present throughout; carry bear spray and make noise.

  camping: |
    All camping in Kobuk Valley is dispersed and primitive. There are no developed campgrounds, no bear boxes, no water sources treated by the NPS, and no facilities of any kind. Visitors camp on river bars, tundra flats, and dune margins wherever conditions allow. Flat, dry ground above the flood line is the primary criterion for site selection.

    Bear canisters or hanging food from a cache pole are necessary at all campsites; grizzly bears are common throughout the valley. Water from the Kobuk River and its tributaries must be filtered or treated before drinking. All waste must be carried out; the NPS recommends WAG bags for human waste disposal. No permit is required for backcountry camping.

  fees_reservations: |
    Park entry is free. No permits are required for camping, hiking, or river travel within the park. The only costs are transportation: a commercial flight from Anchorage to Kotzebue (about 1.5 hours, roughly $200-$400 round trip) and a charter flight from Kotzebue to a river bar or landing strip within the park (roughly $300-$500 per person round trip depending on destination and group size).

    No reservations are accepted or required for any park activity. Charter flight operators book quickly for the late August window; contact several operators in Kotzebue well in advance. Confirm current information and operator contacts at the official park page at nps.gov/kova.

  getting_there: |
    **By air to Kotzebue**: Fly commercially from Anchorage Ted Stevens International Airport (ANC) to Ralph Wien Memorial Airport (OTZ) in Kotzebue, about 1.5 hours. Multiple airlines serve this route. Kotzebue is the jump-off point for all park visits.

    **By charter from Kotzebue**: NPS-permitted air taxi operators fly small wheeled or floatplane aircraft from Kotzebue to gravel bars, landing strips, and lake surfaces within and near the park. The flight into the Great Kobuk Sand Dunes area takes about 30-45 minutes. Reserve charter seats early for late August travel.

    **No other access exists.** There are no roads to or within the park, no public ferries, and no scheduled service into the park interior. Paddlers sometimes put in at the village of Ambler, reachable by small aircraft from Kotzebue, and float the Kobuk River west through the park.

  geology: |
    The Great Kobuk Sand Dunes formed from fine-grained glacial outwash sediments deposited in the valley during the Pleistocene and reworked by the Kobuk River over thousands of years. Prevailing northeasterly winds funnel between the Baird and Waring mountain ranges, picking up dried sand from exposed river bars and carrying it until the terrain breaks the wind speed, causing sand to drop and accumulate. The result is an active dune field 25 square miles in area, largest in the Arctic, sitting incongruously among boreal forest and tundra.

    Permafrost underlies the entire valley, typically within a few feet of the surface. It constrains plant rooting depth, impedes drainage, and causes the irregular tussock topography that makes cross-country walking difficult. Thaw lakes and thermokarst depressions dot the valley floor where surface warming has melted ice in the frozen substrate.

    The Kobuk Valley itself is a glacially scoured trough carved between the Brooks Range and the lower Waring Mountains. The valley floor sits at roughly 100-200 feet above sea level while the surrounding peaks exceed 5,000 feet, creating a dramatic elevation contrast. Nephrite jade occurs in the Jade Mountains south of the river, deposited by metamorphic processes in the ancient rock; this jade has been traded across Arctic North America for millennia.

  wildlife: |
    The Western Arctic caribou herd numbers roughly 200,000-300,000 animals and uses the Kobuk Valley as a migration corridor twice yearly. The fall migration through the valley typically occurs in late August and September; the spring migration moves north in May and June. Onion Portage is a pinch point where caribou have crossed the river for thousands of years, and Iñupiat hunters still subsistence hunt here under state and federal law.

    Grizzly bears are common throughout the valley and are the primary safety concern for campers and hikers. Wolves follow the caribou migration and are present but rarely seen at close range. Moose inhabit the riparian forest along the Kobuk River and its tributaries year-round. Dall's sheep use the upper slopes of the Baird Mountains.

    The Kobuk River supports healthy populations of chum and king salmon, Arctic char, and sheefish, a large predatory whitefish found only in Arctic and sub-Arctic rivers. Migratory birds use the valley's lakes and wetlands heavily in spring and early summer; shorebirds, waterfowl, and raptors all pass through. Snowy owls hunt the open tundra in good lemming years.

  history: |
    The Kobuk Valley has been continuously inhabited for at least 12,500 years, as documented at Onion Portage. Archaeological layers at the site record the Palaeoarctic tradition at the base, followed by Arctic Small Tool tradition, Norton, Ipiutak, and Thule cultural occupations, each layer representing a distinct people who used the valley's reliable caribou crossing. The site is considered one of the most complete records of Arctic prehistory anywhere in the world.

    The Iñupiat people, descendants of the Thule culture, have lived in the Kobuk Valley for the past thousand years and continue to today. Villages at Kobuk, Shungnak, and Ambler are within or adjacent to the park boundary, and their residents exercise subsistence rights to hunt, fish, and gather within the park under the Alaska National Interest Lands Conservation Act.

    Congress created Kobuk Valley National Park on December 2, 1980, under ANILCA. The designation was contested by Alaska's congressional delegation and many local residents who feared restrictions on subsistence activities. ANILCA specifically preserved subsistence rights for rural residents, and the Iñupiat continue to use the valley as they always have alongside park visitors.

