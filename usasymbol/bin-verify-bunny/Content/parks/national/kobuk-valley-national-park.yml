faq:
  - question: "Where is Kobuk Valley National Park?"
    answer: "Kobuk Valley National Park is in northwest Alaska above the Arctic Circle, about 75 miles east of Kotzebue, Alaska. There are no roads to the park; all visitors arrive by charter aircraft from Kotzebue."
  - question: "How do you get to Kobuk Valley National Park?"
    answer: "Fly commercially from Anchorage to Kotzebue (about 1.5 hours), then charter a small aircraft or floatplane from Kotzebue to a landing area within the park (about 30-45 minutes). No roads or public transit reach the park."
  - question: "What is the best time to visit Kobuk Valley?"
    answer: "Late August is the optimal window. Mosquitoes are gone, temperatures are comfortable at 45-65°F, tundra colors are at peak, and the fall caribou migration is typically underway. June and July are good for paddling but insects are severe."
  - question: "Are there trails at Kobuk Valley National Park?"
    answer: "No. There are no maintained trails anywhere in the park. Travel is entirely cross-country on tundra and river gravel bars, or by canoe and packraft on the Kobuk River. Navigation skills and wilderness experience are essential."
  - question: "Is Kobuk Valley National Park free?"
    answer: "Park entry is free with no permits required. The main costs are transportation: roughly $200-$400 round trip from Anchorage to Kotzebue by commercial flight, plus $300-$500 per person for a charter flight into the park."
  - question: "Can you see the Great Sand Dunes at Kobuk Valley?"
    answer: "Yes. The Great Kobuk Sand Dunes, the largest active Arctic sand dunes in North America, are one of the park's main destinations. Charter aircraft land on a gravel bar near the dunes, and from there visitors walk across open sand. The dunes rise up to 100 feet."
  - question: "Are there bears at Kobuk Valley?"
    answer: "Yes. Grizzly bears are common throughout the valley and are the primary safety concern. Carry bear spray, make noise while traveling, and store all food in a bear canister. There are no developed facilities or bear boxes anywhere in the park."

  - question: What state is Kobuk Valley National Park in?
    answer: Kobuk Valley National Park is in [Alaska](/states/alaska), near Kotzebue, Alaska.

