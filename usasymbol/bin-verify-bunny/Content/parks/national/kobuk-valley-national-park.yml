intro_text: "Kobuk Valley National Park protects 1.75 million acres of remote northwest Alaska above the Arctic Circle, where the Great Kobuk Sand Dunes rise 100 feet above the tundra. The Western Arctic caribou herd, one of the largest in the world, crosses the valley twice a year. No roads, no maintained trails, and no developed facilities exist within the park; every visitor arrives by charter aircraft."

