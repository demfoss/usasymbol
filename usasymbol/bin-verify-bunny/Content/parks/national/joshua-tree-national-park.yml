faq:
  - question: "Where is Joshua Tree National Park?"
    answer: "Joshua Tree National Park is in southern California, about 140 miles east of Los Angeles and 40 miles northeast of Palm Springs. The main gateway towns are Twentynine Palms and Joshua Tree on Highway 62."
  - question: "What is the best time to visit Joshua Tree?"
    answer: "Spring (March-May) is the most popular window for mild temperatures and desert wildflowers. Fall (October-November) is an excellent alternative with similar temperatures and fewer crowds. Avoid summer if possible; temperatures regularly exceed 105°F."
  - question: "How much does it cost to enter Joshua Tree?"
    answer: "$30 per vehicle for a 7-day pass. Motorcycles pay $25, and individuals on foot or bicycle pay $15. The America the Beautiful annual pass ($80) covers entry to all federal fee areas."
  - question: "Do you need a reservation to visit Joshua Tree?"
    answer: "Timed entry permits are required on peak spring and fall weekends, typically mid-March through May. Permits release 90 days ahead at recreation.gov. Most campgrounds are first-come first-served, but Black Rock requires reservations."
  - question: "Can you see Joshua trees at Joshua Tree National Park?"
    answer: "Yes, but only in the park's northwestern Mojave Desert section above roughly 3,000 feet. The southeastern Colorado Desert section has cholla cactus and ocotillo instead. Park Boulevard from the west entrance toward Keys View passes through the densest Joshua tree groves."
  - question: "Is Joshua Tree good for stargazing?"
    answer: "Yes. The park holds International Dark Sky Park designation. The Milky Way is visible overhead on most clear nights, and the spring and fall camping seasons offer the longest dark periods. Jumbo Rocks Campground is one of the most popular stargazing spots."
  - question: "Are pets allowed at Joshua Tree?"
    answer: "Pets are allowed in campgrounds and on paved roads but not on any trail, unpaved road, or in the backcountry. They must be on a 6-foot leash at all times. The restriction protects desert tortoises and other ground-nesting wildlife."

  - question: What state is Joshua Tree National Park in?
    answer: Joshua Tree National Park is in [California](/states/california), near Twentynine Palms, California.

