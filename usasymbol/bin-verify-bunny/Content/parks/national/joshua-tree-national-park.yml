sections:
  overview: |
    Joshua Tree National Park covers 795,156 acres in the southern California desert where San Bernardino and Riverside counties meet. The park sits at the junction of two desert ecosystems: the higher Mojave Desert in the northwest, where the namesake Joshua trees grow, and the lower Colorado Desert in the southeast, dominated by cholla cactus and ocotillo. With 3.1 million visitors in 2023, it ranks 10th among all national parks. Palm Springs International Airport is about 40 miles from the south entrance.

  known_for: |
    - **Joshua trees**: The Yucca brevifolia forests of the Mojave section, dense and photogenic, grow only above roughly 3,000 feet in the park's northwestern half.
    - **Rock climbing**: Over 400 granite formations and more than 8,000 climbing routes make Joshua Tree one of the top climbing destinations in North America.
    - **Dark skies**: The park holds International Dark Sky Park designation; light pollution from Los Angeles is visible on the horizon but the Milky Way is clear overhead most nights.
    - **Keys Ranch**: A preserved homestead and gold-mining operation where Bill Keys and his family lived for five decades, now a National Historic Landmark open for ranger-led tours.


  best_things_to_see_items:
    - name: "Rock Climbing at Intersection Rock"
      description: "Joshua Tree's monzogranite boulders offer over 8,000 climbing routes ranging from beginner slabs to hard cracks. Intersection Rock, near Hidden Valley Campground, is the classic first stop. Dozens of climbing guides and rental operations work out of Joshua Tree town just outside the north entrance."
      image: "/images/parks/national/joshua-tree-national-park/02-highlight-01.jpg"
      alt: "people climbing on boulders are silhouetted against a colorful sunset sky"
      credit: "NPS/Brad Sutton"
    - name: "Hidden Valley"
      description: "Hidden Valley is a flat, enclosed basin ringed by boulder walls, once used by cattle rustlers to hide stolen livestock. The 1-mile loop trail circles the valley floor through Joshua tree groves and past some of the park's most accessible climbing rock. The picnic area fills on weekends; arrive before 9 a.m."
      image: "/images/parks/national/joshua-tree-national-park/04-highlight-03.jpg"
      alt: "hiker looks over Hidden Valley"
      credit: "NPS/Hannah Schwalbe"
    - name: "Keys Ranch"
      description: "Bill Keys homesteaded 160 acres in this remote valley beginning in 1910, raising a family and operating a gold mill, store, and ranch. The NPS preserves 23 structures on the property, including the original house and equipment. Access is by ranger-led walking tour only; tours depart from the ranch gate and require advance reservations."
      image: "/images/parks/national/joshua-tree-national-park/05-highlight-04.jpg"
      alt: "an historic wood house seen through the missing windshield of an old, rusty vehicle"
      credit: "NPS/Kurt Moses"
    - name: "Keys View"
      description: "A paved, accessible overlook at 5,185 feet on the crest of the Little San Bernardino Mountains. On clear days the Salton Sea, the San Andreas Fault, and the Santa Rosa Mountains are visible to the south. Sunrise and sunset are the best times; the parking lot is small and fills on busy weekends."
      image: "/images/parks/national/joshua-tree-national-park/01-best-keys-view.jpg"
      alt: "View the Palm Springs, the San Andreas Fault, and the Salton Sea from Keys View."
      credit: "NPS Photo by Robb Hannawacker"
    - name: "Cholla Cactus Garden"
      description: "A 0.25-mile interpretive loop passes through one of the densest stands of teddy bear cholla in the park, on the transition zone between the two desert ecosystems. The chollas glow gold in low-angle morning or evening light. Do not touch the spine clusters; they detach on contact and are very difficult to remove from skin."
      image: "/images/parks/national/joshua-tree-national-park/02-best-cholla-cactus-garden.jpg"
      alt: "A path through cholla cactus."
      credit: "NPS / Hannah Schwalbe"
    - name: "Skull Rock"
      description: "A large granite boulder weathered into the shape of a skull, visible from the park road and the starting point of the 1.7-mile Skull Rock Nature Trail. Interpretive signs along the trail explain how water and weathering carved the rounded forms. The rock is a short walk from a roadside pullout on Park Boulevard."
      image: "/images/parks/national/joshua-tree-national-park/03-best-skull-rock.jpg"
      alt: "One of the most popular rock formations."
      credit: "NPS Photo by Robb Hannawacker"

  best_time_to_visit: |
    **Spring (March-May)** is peak season. Daytime temperatures run 60-85°F, desert wildflowers bloom after wet winters, and Joshua trees flower in March and April. Campgrounds and parking lots fill to capacity on spring weekends; reservable sites sell out months ahead.

    **Summer (June-September)** brings dangerous heat. Temperatures at lower elevations regularly exceed 105°F and can reach 115°F. The NPS issues heat advisories and recommends limiting hiking to before 10 a.m. or after sunset. The park stays open but most casual visitors avoid July and August.

    **Fall (October-November)** is the reliable second season. Temperatures return to 60-80°F, crowds are smaller than spring, and the slanted light of October is excellent for photography. Wildflowers do not bloom, but wildlife activity increases as the heat breaks.

    **Winter (December-February)** is quiet and cold. Night temperatures drop below freezing and snow occasionally falls on the higher Mojave section, but daytime highs of 55-65°F make for comfortable hiking. Campgrounds rarely fill, fees are unchanged, and clear air produces the best stargazing of the year.

  hiking: |
    **Easy trails** cover the park's most photographed spots. The Hidden Valley Trail is a 1-mile loop through a boulder-enclosed basin with dense Joshua tree groves. The Barker Dam Trail runs 1.3 miles to a historic cattle-ranching dam that forms a wildlife watering hole, often visited by bighorn sheep and migratory birds. The Cholla Cactus Garden Trail is a 0.25-mile interpretive loop through dense teddy bear cholla in the Colorado Desert section; the Skull Rock Nature Trail adds 1.7 miles from a roadside pullout past the famous weathered boulder.

    **Moderate trails** gain elevation and reward with panoramic views. The Ryan Mountain Trail climbs 1,050 feet in 1.5 miles to a summit with views across Queen Valley, Lost Horse Valley, and the park's full expanse of boulder fields; round trip is 3 miles. The Lost Horse Mine Trail runs 4 miles round trip to gold mine ruins dating to the 1890s, with interpretive signs along the route.

    **Strenuous routes** require a full day and water planning. The Boy Scout Trail covers 8 miles one way across both desert ecosystems and requires a car shuttle between the north and south trailheads. Carry at least 1 liter of water per hour in warm weather; there are no water sources on any trail in the park.

  camping: |
    Joshua Tree has nine campgrounds with a combined total of roughly 500 sites. Jumbo Rocks is the largest with 124 sites, centrally located among signature boulder formations. Hidden Valley has 44 tent-only sites within climbing distance of major rock formations. Indian Cove, with 101 sites, sits in the north section and is accessible from Highway 62 without a park entry fee.

    Black Rock Campground near Yucca Valley has 99 sites with water and flush toilets; it operates October through May and requires reservations through recreation.gov. Cottonwood Campground near the south entrance has 62 sites and opens onto the Colorado Desert section. Most campgrounds except Black Rock and Cottonwood are first-come first-served outside of timed entry periods.

    Backcountry camping is permitted at least 1 mile from any road and 500 feet from any trail, with registration at trailhead boards. No fires are allowed in the backcountry. Pets are not permitted on any park trail; they are allowed on paved roads and in campgrounds on a 6-foot leash.

  fees_reservations: |
    The 7-day vehicle pass costs $30. Motorcycles pay $25, and individuals entering on foot or bicycle pay $15 per person. The America the Beautiful annual pass ($80) covers entry.

    Timed entry permits are required for the busiest spring and fall weekends, typically mid-March through May and select weekends in October. Permits release 90 days in advance at recreation.gov and sell out quickly. Campsite reservations for Black Rock and Cottonwood campgrounds are also made through recreation.gov.

    Confirm current fees and rules at the official park page at nps.gov/jotr.

  getting_there: |
    **By car**: The park has three entrances. The West Entrance on Park Boulevard is reached via Highway 62 from Joshua Tree town. The North Entrance on Utah Trail enters near Twentynine Palms off Highway 62. The South Entrance at Cottonwood Spring is accessed directly from Interstate 10 about 25 miles east of Indio.

    **By air**: Palm Springs International Airport (PSP) is approximately 40 miles from the south entrance via Interstate 10. Los Angeles International Airport (LAX) is about 140 miles west on Interstate 10. No shuttle service runs to the park; a rental car is necessary.

  geology: |
    Joshua Tree's boulder formations are monzogranite, a coarse-grained igneous rock that cooled slowly underground from magma about 100 million years ago. As the overlying rock eroded away over tens of millions of years, the granite was exposed to water and air. Water seeped along natural rectangular joint sets in the rock, dissolving the corners and edges through a process called spheroidal weathering and leaving the rounded, stacked forms visible today.

    The same weathering process created the shallow basins on top of many boulders. Rainwater pools in these basins and accelerates erosion, eventually forming "tanks" that hold water for weeks after storms and serve as critical wildlife water sources in the dry desert.

    The park's two desert ecosystems are separated by elevation. The Mojave Desert occupies the northwest section above roughly 3,000 feet, where cooler temperatures and slightly higher precipitation allow Joshua trees to grow. The Colorado Desert in the southeast sits below 3,000 feet; its higher average temperatures favor drought-adapted plants like teddy bear cholla, ocotillo, and smoke tree.

    The transition zone between the two ecosystems, visible along Park Boulevard near the Cholla Cactus Garden, is one of the clearest ecological boundaries accessible by road in any national park.

  wildlife: |
    Desert tortoises live in both the Mojave and Colorado Desert sections of the park and are most active in spring and fall mornings. They are legally protected; if you find one on a road, leave it alone or move it in the direction it was already heading without turning it around. The tortoise population has declined significantly and Joshua Tree is one of its last strongholds in California.

    Bighorn sheep inhabit the park's rocky ridges and are most reliably seen near Barker Dam, where they come to drink, and along the Wonderland of Rocks. Coyotes are common throughout and often visible at dawn. Roadrunners cross open flats near Hidden Valley and Pinto Basin.

    The park records over 250 bird species. Golden eagles nest in the boulder fields. Cactus wrens, the California state bird, build nests inside cholla cactus clusters. At dusk, lesser nighthawks and common poorwills emerge to hunt insects over the open desert flats.

  history: |
    The Cahuilla and Serrano peoples lived in and around the area for thousands of years, following seasonal routes between desert floor and mountain. Bedrock mortars for grinding seeds are still visible at several sites in the park. Water sources such as Cottonwood Spring and Barker Dam were known and used long before European contact.

    Gold and cattle brought American settlers to the area in the late 1800s. The Lost Horse Mine produced roughly 10,000 troy ounces of gold between 1893 and 1931. Bill Keys arrived in 1910 and spent the next 60 years ranching, mining, and building the Desert Queen Ranch, now preserved as Keys Ranch, a National Historic Landmark.

    Minerva Hoyt, a Pasadena socialite and desert plant enthusiast, campaigned nationally through the 1920s and 1930s to protect the desert from commercial cactus collection and development. Her efforts convinced President Franklin Roosevelt to establish Joshua Tree National Monument in 1936. Congress redesignated it as a national park on October 31, 1994, under the California Desert Protection Act.

