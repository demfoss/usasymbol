intro_text: "Two desert ecosystems, the Mojave and the Colorado, meet in Joshua Tree National Park in southern California. The Mojave portion above 3,000 feet supports the park's iconic Joshua trees; the lower Colorado Desert holds forests of cholla and ocotillo. The park covers 795,156 acres, draws 3.1 million visitors a year, and ranks among the best dark-sky parks in the American Southwest."

