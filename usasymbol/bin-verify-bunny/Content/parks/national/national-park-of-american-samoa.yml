sections:
  overview: |
    National Park of American Samoa spans three separate island units across the South Pacific: Tutuila, Ofu, and Ta'u. Its 8,257 acres protect tropical rainforest, volcanic ridgelines, and coral reef in one of the most remote corners of the U.S. national park system. The Ofu unit holds one of the most intact coral reef systems managed by the NPS, with more than 250 coral species in its shallow lagoon. The park is free to enter and draws about 8,000 visitors per year, the vast majority arriving on Tutuila near the capital of Pago Pago.

  known_for: |
    - The only U.S. national park south of the equator, spread across three island units
    - The Ofu coral reef, regarded as one of the most pristine in the National Park System with 250+ coral species
    - Pacific flying foxes (Pteropus tonganus), large fruit bats that are the biggest native land animals on the islands
    - A unique land arrangement in which the NPS leases all park land from indigenous Samoan villages rather than owning it outright

  best_things_to_see: |
    Ofu Beach draws most visitors who make it to the outer islands: a white sand crescent backed by rainforest with an intact coral reef immediately offshore for snorkeling. Mt. Alava on Tutuila offers the park's highest accessible viewpoint, looking down over Pago Pago Harbor from 1,610 feet. The Ta'u unit preserves the most remote terrain in the park, with sea cliffs rising several hundred feet and old-growth rainforest reaching the interior ridges. Pacific flying foxes are visible at dusk from multiple points on all three islands, hanging in large colonies in the forest canopy.

  best_things_to_see_items:
    - name: "Ofu Beach and Coral Reef"
      description: "Ofu Beach is a curved stretch of white sand on Ofu island with one of the healthiest coral reefs in the National Park System directly offshore. Snorkelers can reach coral heads in less than 10 feet of water within minutes of the beach. The reef supports more than 250 coral species and hundreds of fish species."
      image: "/images/parks/national/national-park-of-american-samoa/01-ofu-beach.jpg"
      alt: "View of Ofu Beach & Sunu'itao Peak."
    - name: "Ta'u Wilderness"
      description: "The Ta'u unit is the most remote section of the park, with volcanic sea cliffs, old-growth rainforest, and the highest terrain in American Samoa. The interior ridges reach above 3,000 feet and have never been logged. Access is by inter-island flight or boat from Tutuila."
      image: "/images/parks/national/national-park-of-american-samoa/04-tau-wilderness.jpg"
      alt: "The steeps cliffs of Ta'u make for stunning, but challenging hiking."
      credit: "NPS Photo/NPSA"
    - name: "Mt. Alava (Tutuila)"
      description: "Mt. Alava is the high point of the Tutuila unit at 1,610 feet, reached by the Mt. Alava Adventure Trail. The summit overlooks Pago Pago Harbor, one of the deepest natural harbors in the South Pacific. A historic cable car terminal at the top dates to the 1960s."
      image: "/images/parks/national/national-park-of-american-samoa/05-mount-alava.jpg"
      alt: "A lush group of mountains surrounded by ocean with a lakeside town nested in the mountain valley."
      credit: "NPS Photo."
    - name: "Pacific Flying Foxes"
      description: "Pacific flying foxes, large fruit bats with wingspans up to 3 feet, roost in large colonies in the forest canopy across all three island units. They are most visible at dusk when colonies take flight to feed on fruit and flowers. The bats are important pollinators and seed dispersers in the rainforest."
      image: "/images/parks/national/national-park-of-american-samoa/02-tongan-fruitbat.jpg"
      alt: "Tongan fruitbat or flying fox, Pteropus tonganus, Samoan name pe'a fanua"
    - name: "World War II Heritage Trail"
      description: "The World War II Heritage Trail on Tutuila passes gun emplacements, bunkers, and military infrastructure dating to the early 1940s when American Samoa served as a major U.S. naval base in the Pacific. The trail is short and easy, connecting several intact WWII-era structures with informational panels."
      image: "/images/parks/national/national-park-of-american-samoa/05-world-war-ii-heritage-trail.jpg"
      alt: "Pillboxes"
      credit: "NPS"
    - name: "Tuafanua Trail"
      description: "The Tuafanua Trail on Tutuila climbs through tropical rainforest along a coastal ridge with views of the ocean and surrounding mountains. The trail passes through dense vegetation typical of the island's lower montane forest zone. It is one of the most photographed hikes in the park."
      image: "/images/parks/national/national-park-of-american-samoa/03-tuafanua-trail.jpg"
      alt: "Tuafanua Trail"
      credit: "NPS"

  best_time_to_visit: |
    **Dry Season (May–October):** The most reliable window for visiting. Rainfall is reduced, humidity is lower, and ocean visibility for snorkeling is at its best. Daytime temperatures stay near 85°F year-round, but this period brings more sun and fewer disruptions to inter-island transport. May through October overlaps with the Southern Hemisphere winter and local spring.

    **Wet Season (November–April):** Heavy rainfall and high humidity characterize this period. Tropical cyclones are possible from December through March and can disrupt flights, close inter-island routes, and cause trail washouts. The Ofu and Ta'u units are especially exposed. Budget travelers willing to accept weather risk will find the fewest other visitors in these months.

  hiking: |
    **Easy:** The World War II Heritage Trail on Tutuila is a short walk connecting a series of gun emplacements and bunkers from the 1940s military base. The terrain is mostly flat and the trail is well marked. It provides historical context for the island's role in the Pacific theater and takes about an hour to complete.

    **Moderate:** The Tuafanua Trail climbs a coastal ridge on Tutuila through dense tropical rainforest. The path involves some elevation gain but remains manageable for most visitors. Bring water, as the humidity is significant even in the dry season. Trail conditions can be muddy after rain.

    **Strenuous:** The Mt. Alava Adventure Trail gains 1,610 feet over approximately 5.5 miles round trip on Tutuila. The route passes through multiple forest zones before reaching the summit, where a historic cable car terminal overlooks Pago Pago Harbor. Start early to avoid peak heat and carry at least 2 liters of water; there are no water sources on the trail.

