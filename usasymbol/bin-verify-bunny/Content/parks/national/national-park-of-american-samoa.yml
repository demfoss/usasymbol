faq:
  - question: "Where is the National Park of American Samoa?"
    answer: "The park is in the U.S. territory of American Samoa in the South Pacific, about 2,600 miles southwest of Hawaii. It spans three island units: Tutuila, Ofu, and Ta'u."
  - question: "How do you get to National Park of American Samoa?"
    answer: "Fly to Pago Pago International Airport (PPG) via Honolulu on Hawaiian Airlines, or via Auckland or Fiji on Samoa Airways or Air New Zealand. The Tutuila unit is about 10 miles from the airport. Reaching Ofu or Ta'u requires an additional inter-island flight or boat from Tutuila."
  - question: "Is there an entrance fee?"
    answer: "No. The park is free to enter on all three island units. No permits or timed-entry tickets are required."
  - question: "Can you camp in the National Park of American Samoa?"
    answer: "There are no campgrounds in the park. The NPS runs a homestay program that places visitors with Samoan families in villages adjacent to the park. Contact the park visitor center in Pago Pago to book a homestay in advance."
  - question: "What is the best time to visit?"
    answer: "May through October is the dry season and the most reliable window for travel. Rainfall is lower, ocean visibility for snorkeling is better, and inter-island flights are less likely to be disrupted. The wet season from November through April carries a cyclone risk from December through March."
  - question: "What is the best thing to do at the park?"
    answer: "Snorkeling the coral reef at Ofu Beach is the signature activity. The reef sits directly offshore in shallow water and supports more than 250 coral species. Reaching Ofu requires an inter-island flight from Tutuila."
  - question: "Is National Park of American Samoa hard to visit?"
    answer: "Yes. It is one of the most difficult national parks to reach. Getting there requires a long transoceanic flight to Pago Pago, and visiting the outer island units (Ofu and Ta'u) requires additional inter-island flights with limited schedules. Infrastructure on the outer islands is minimal."

