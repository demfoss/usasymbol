  fees_reservations: |
    The 7-day vehicle pass costs $30 and covers all occupants. Motorcycles pay $25, and individuals on foot or bicycle pay $15. The America the Beautiful Annual Pass is valid for entry and costs $80. In addition to the entry fee, a free timed entry permit is required from late May through mid-October. Two permit types exist: one covers all park entrances for the full day, and a separate Bear Lake Road Corridor permit is required for vehicles using that specific road between 5 a.m. and 6 p.m. Both permit types release on recreation.gov starting in January for the full summer season; Bear Lake Corridor permits are the first to sell out. A smaller batch of next-day permits releases at 5 a.m. MST daily on recreation.gov. Backcountry camping requires a wilderness permit with a $35 processing fee per group. Confirm current timed entry dates and reservation windows at the official park page: nps.gov/romo.

