sections:
  overview: |
    The park sits in the Colorado Front Range, with the main east entrance near Estes Park and the west entrance near Grand Lake, 48 miles apart by road. Trail Ridge Road connects the two sides, crossing the Continental Divide at 12,183 feet — the highest paved through-road in the United States. A $30 vehicle pass is required. From late May through mid-October, a free timed entry permit from recreation.gov is also required; Bear Lake Road Corridor permits fill months in advance. Pets are allowed in campgrounds and on paved roads but not on most trails.

  known_for: |
    - Trail Ridge Road, the highest continuous paved highway in the United States at 12,183 feet, open late May through mid-October
    - One of the largest elk herds in the Rockies, with a September rut that draws thousands of visitors to Horseshoe Park and Moraine Valley
    - Longs Peak, the park's only 14er at 14,259 feet, one of the most attempted technical summits in Colorado
    - More than 150 lakes and 450 miles of streams set within three distinct life zones: montane, subalpine, and alpine tundra

  best_things_to_see: |
    Trail Ridge Road is the single most accessible feature in the park: 48 miles of paved road that climbs to 12,183 feet, crossing the tundra above treeline for about 11 miles. The Bear Lake corridor offers the park's most concentrated hiking, with four glacier-carved lakes — Bear, Nymph, Dream, and Emerald — connected by a single trail rising 605 feet. The September elk rut in Horseshoe Park and Moraine Park draws large crowds who come to hear bull elk bugle at dawn and dusk. Kawuneeche Valley on the west side of the Divide is moose habitat and the headwaters of the Colorado River, with far fewer visitors than the east side. Longs Peak's east face is visible from much of the park's eastern meadows and draws climbers from around the world to its 14,259-foot summit.

  best_things_to_see_items:
    - name: "Trail Ridge Road"
      description: "Trail Ridge Road crosses the Continental Divide at 12,183 feet and spends about 11 miles above treeline, offering a driving experience through alpine tundra without leaving your car. The Alpine Visitor Center at Fall River Pass (11,796 ft) is a mid-road stop with a gift shop and short tundra walk. The road is open late May through mid-October, weather permitting."
      image: "/images/parks/national/rocky-mountain-national-park/01-trail-ridge-road.jpg"
      alt: "Cars drive a small road dominated by treeless rocky mountains"
      credit: "NPS Photo"
    - name: "Bear Lake and the Lake Chain"
      description: "Bear Lake sits at 9,475 feet and is the starting point for the most popular trail corridor in the park. A 0.8-mile loop circles Bear Lake itself; the Emerald Lake Trail continues 1.75 miles further uphill to Nymph, Dream, and Emerald lakes, each framed by 12,000-foot peaks. The trailhead requires a timed entry permit for Bear Lake Road Corridor during peak season."
      image: "/images/parks/national/rocky-mountain-national-park/02-bear-lake.jpg"
      alt: "Bear Lake fallen tree reflected on bear lake"
      credit: "NPS Photo / Aubry Andreas"
    - name: "Elk Rut (September–October)"
      description: "Rocky Mountain National Park holds one of the largest elk herds in the Rocky Mountains, with about 3,000 elk in the park during summer. In September and October, bull elk bugle, spar, and herd cows in open meadows. Horseshoe Park, Moraine Park, and Upper Beaver Meadows are the primary viewing areas. Arrive before sunrise for the most active behavior."
      image: "/images/parks/national/rocky-mountain-national-park/03-bull-elk.jpg"
      alt: "Bull Elk"
      credit: "NPS Photo"
    - name: "Longs Peak"
      description: "Longs Peak is the only 14er in the park at 14,259 feet and one of the most attempted technical peaks in Colorado. The standard Keyhole Route is 14.5 miles round trip with 5,100 feet of gain; the final mile above the Keyhole requires hands-on scrambling on exposed ledges and is not a hiking trail. The trailhead is at 9,405 feet and a 3 a.m. start is typical to avoid afternoon lightning."
      image: "/images/parks/national/rocky-mountain-national-park/04-longs-peak.jpg"
      alt: "Longs Peak"
    - name: "Kawuneeche Valley"
      description: "The Kawuneeche Valley on the park's west side is the upper corridor of the Colorado River and the primary moose habitat in the park. Moose are seen regularly in the willows along the valley floor, especially early morning. The valley receives far fewer visitors than the east side and has its own campground, trailheads, and a visitor center near Grand Lake."
      image: "/images/parks/national/rocky-mountain-national-park/12-best-kawuneeche-valley.jpg"
      alt: "a photo of Kawuneeche Valley and Never Summer Mountains"
    - name: "Sky Pond"
      description: "Sky Pond is a granite-rimmed alpine lake at 10,900 feet reached by a 9-mile round trip trail from the Glacier Gorge Trailhead near Bear Lake. The route passes Alberta Falls, The Loch, and a short waterfall scramble at Timberline Falls before reaching the lake. It is the most demanding popular day hike in the Bear Lake corridor."
      image: "/images/parks/national/rocky-mountain-national-park/13-best-sky-pond.jpg"
      alt: "Sky Pond, an alpine lake in the Loch Vale Watershed."
      credit: "NPS Photo"

  best_time_to_visit: |
    **Spring (May–June):** Lower elevations are accessible by mid-May; Trail Ridge Road typically opens in late May. Wildflowers bloom in the montane zone in June, and waterfalls run at peak volume from snowmelt. Many high trails remain snow-covered through June; microspikes are useful above 10,000 feet. Timed entry permits are required from late May onward.

    **Summer (July–August):** All facilities and trails are open. This is the busiest period, with Bear Lake Road Corridor permits selling out months in advance. Afternoon thunderstorms build daily above treeline from mid-July; plan to be below 12,000 feet by early afternoon. Wildlife is active and wildflowers peak in alpine meadows in late July.

    **Fall (September–October):** The elk rut peaks in mid-September, drawing large crowds to the meadows at dawn and dusk. Trail Ridge Road stays open until the first major snowfall, usually in October. Timed entry permits are required through mid-October. After peak foliage in early October, crowds drop sharply and conditions on lower trails remain good into November. Winter snowshoeing and cross-country skiing are possible from late November onward, though Trail Ridge Road is closed.

  hiking: |
    **Easy:** Bear Lake Trail is a 0.8-mile paved loop at 9,475 feet with mountain reflections in the lake; it is fully accessible and the most visited point in the park. Alberta Falls Trail is 1.7 miles round trip from the Glacier Gorge Trailhead, gaining 160 feet to a tiered waterfall on Glacier Creek. Pets are not permitted on either trail.

    **Moderate:** Emerald Lake Trail starts at Bear Lake and passes Nymph Lake and Dream Lake before reaching Emerald Lake at 10,080 feet, 3.5 miles round trip with 605 feet of gain. All three lakes sit below the Continental Divide peaks. Snow covers the upper section through mid-June and can require microspikes.

    **Strenuous:** Sky Pond Trail is approximately 9 miles round trip from the Glacier Gorge Trailhead, gaining 1,780 feet. The route passes Alberta Falls, The Loch, and Lake of Glass before reaching Sky Pond at 10,900 feet. A short scramble up the face of Timberline Falls is required and involves some hand use. Start early to clear the upper basin before afternoon lightning.

    **Very Strenuous:** Longs Peak Keyhole Route is 14.5 miles round trip with 5,100 feet of gain to the 14,259-foot summit. The route above the Keyhole (13,100 ft) involves exposed scrambling on ledge systems and is not a maintained trail. A 3 a.m. start is standard to reach the summit before noon thunderstorms. This route is not recommended for inexperienced hikers or those without scrambling experience. Microspikes or crampons may be required as late as July.

