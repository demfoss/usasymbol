  camping: |
    The park has five campgrounds totaling about 571 sites. Moraine Park Campground on the east side is the largest with 244 sites and operates year-round, though some loops close seasonally. Glacier Basin Campground, also on the east side near the Bear Lake corridor, has 150 sites and is open late May through late September. Aspenglen Campground near the Fall River Entrance has 53 sites and runs spring through fall. Longs Peak Campground has 26 tent-only sites at 9,405 feet, open summer only, and is the trailhead for the Longs Peak route. Timber Creek Campground on the west side near Grand Lake has 98 sites and is open late May through late October. All campgrounds require advance reservations through recreation.gov; summer sites sell out within minutes of release in January. A handful of walk-up sites exist at Moraine Park in the shoulder season. Backcountry camping requires a separate wilderness permit with a $35 processing fee per group.

