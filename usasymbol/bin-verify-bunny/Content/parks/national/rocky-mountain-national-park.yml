  getting_there: |
    By car, the main east entrance is at Estes Park via U.S. Highway 36 or U.S. Highway 34, about 70 miles northwest of Denver on US-36 through Boulder. The west entrance at Grand Lake is reached via U.S. Highway 34 from Granby, about 100 miles from Denver. Denver International Airport (DEN) is the nearest major airport, about 70 miles from Estes Park. No scheduled public transit runs to the park, but the Estes Park Shuttle and various private services run from Denver during summer. Within the park, a free shuttle system operates on the Bear Lake Road Corridor from late May through mid-October, reducing traffic on the most congested section of road. Parking at Bear Lake fills by 8 a.m. on summer weekends; the shuttle from the Park and Ride on Bear Lake Road is the practical option.

  geology: |
    The park sits on the Front Range uplift, where Precambrian granite and gneiss as old as 1.7 billion years form the core of the mountains. These ancient rocks were buried, metamorphosed, and intruded by granitic magma repeatedly over hundreds of millions of years before being pushed upward as the Rocky Mountains rose between 70 and 40 million years ago. Erosion stripped the overlying sedimentary rock and exposed the hard crystalline basement now visible in the park's peaks and canyon walls.

    Glaciation shaped most of the scenery visitors see today. Multiple advances of ice during the past two million years carved the U-shaped valleys, cirques, and lake basins that define the Bear Lake corridor, Glacier Gorge, and the Kawuneeche Valley. The park still has about five named glaciers, including Andrews and Tyndall glaciers, though all are retreating rapidly; Andrews Glacier has lost more than half its area since the early twentieth century.

    Trail Ridge Road crosses the alpine tundra zone above 11,500 feet, where frost-shattered rocks, frost polygons, and wind-blasted krummholz trees mark the limit of tree growth. The tundra soil takes thousands of years to develop; a single footstep off the trail can damage vegetation that has grown for centuries. Interpretive signs along the road describe the periglacial processes still at work on the ridge.

  wildlife: |
    Elk are the park's most iconic animal, with a herd of about 3,000 within the park during summer. Bulls bugle and spar during the September rut, drawing large viewing crowds to Horseshoe Park, Moraine Park, and Upper Beaver Meadows. Cow elk with calves are common in lower meadows from late May through summer. Keep at least 75 feet from all elk; rut behavior makes bulls unpredictable.

    Moose appear primarily in the Kawuneeche Valley on the west side, where willow thickets along the upper Colorado River provide habitat. They are rarely seen on the east side. Bighorn sheep frequent the rocky slopes around Horseshoe Park and Specimen Mountain; the park maintains one of the larger bighorn populations in Colorado. Black bears are present throughout but rarely seen; food storage regulations apply at all campgrounds.

    Marmots and pikas are abundant above treeline along Trail Ridge Road and on rocky slopes in the high country. White-tailed ptarmigan change plumage seasonally and blend almost perfectly into their surroundings; look carefully on talus slopes above 11,000 feet. The park holds native populations of greenback cutthroat trout in several streams; catch-and-release fishing requires a Colorado fishing license.

  history: |
    The Ute and Arapaho peoples used the high mountain passes and valleys of what is now the park as seasonal hunting grounds for thousands of years. The Arapaho name for Trail Ridge translates as "the backbone of the world," reflecting its role as a travel route across the Divide. Both tribes were displaced from the region after the 1851 and 1861 Fort Laramie and Fort Wise treaties opened the area to American settlement.

    Joel Estes and his family homesteaded the valley that now bears his name in 1859 during the Colorado gold rush. Ranchers, hunters, and lodge operators followed over the next decades, and by the early 1900s overgrazing and hunting were visibly degrading the mountain ecosystem. Enos Mills, a naturalist and innkeeper who had lived near Longs Peak since 1884, began a decade-long public campaign for a national park. He wrote extensively, gave hundreds of lectures, and lobbied Congress directly. President Woodrow Wilson signed the Rocky Mountain National Park Act on January 26, 1915. The following year, Congress established the National Park Service, and Rocky Mountain became one of its original units.

    Trail Ridge Road was completed in 1932, replacing an older route and opening the high alpine zone to automobile travel. The park expanded its boundaries multiple times through the twentieth century. The timed entry permit system was introduced in 2020 to address overcrowding after the pandemic-era surge in visitation.

