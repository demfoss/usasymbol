intro_text: "Lassen Volcanic National Park protects 106,589 acres of northern California where all four types of volcanoes exist within a single park boundary and hydrothermal activity keeps the ground boiling today. The park's centerpiece is Lassen Peak, a 10,457-foot plug dome volcano that erupted in 1914 and produced a major explosive event on May 22, 1915, making it the most recently active volcano in the contiguous United States before Mount St. Helens erupted in 1980. Boiling mudpots, fumaroles, and steam vents cluster at Bumpass Hell and Sulphur Works, both accessible from the 29-mile park highway. The park draws about 516,000 visitors per year and sits roughly 50 miles east of Redding at the southern end of the Cascade Range."

