faq:
  - question: "Where is Lassen Volcanic National Park?"
    answer: "Lassen Volcanic is in northeastern California at the southern end of the Cascade Range, roughly 50 miles east of Redding and about 250 miles north of San Francisco. The northwest entrance is reached via Highway 44 from Redding; the southwest entrance is reached via Highway 36 from Interstate 5 at Red Bluff. The nearest major airport is Redding Municipal (RDD), about 50 miles from the northwest entrance."
  - question: "When is the best time to visit Lassen?"
    answer: "July through August is the best time: the full park highway is snow-free, all campgrounds and trails are open, and wildflowers peak in late June and early July. September through mid-October is quieter with fall color and comfortable temperatures for long hikes. The park highway typically closes for winter after the first major snowfall, often in mid-October to early November."
  - question: "How much does it cost to enter Lassen?"
    answer: "A vehicle 7-day pass costs $30 and covers all occupants. Motorcycles are $25; individuals arriving on foot or bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers entrance at all U.S. national parks for 12 months and pays for itself in three Lassen visits."
  - question: "What is Lassen most known for?"
    answer: "Lassen is best known for Lassen Peak, the world's largest plug dome volcano at 10,457 feet, and for Bumpass Hell, the park's largest hydrothermal basin with boiling mudpots, fumaroles, and acid pools at temperatures up to 322 degrees Fahrenheit. The park is also one of the few places where all four types of volcanoes exist within a single park boundary."
  - question: "Can you hike to the top of Lassen Peak?"
    answer: "Yes. The Lassen Peak Trail is 5 miles round trip with about 2,000 feet of elevation gain, starting from a parking area at 8,500 feet on the park highway. The summit is typically snow-covered until mid-July. Start early in the morning to avoid afternoon thunderstorms and to secure a parking space at the busy trailhead."
  - question: "Are there bears in Lassen?"
    answer: "Yes, black bears live throughout the park's forested zones. The park enforces strict food storage rules: all food and scented items must be stored in a bear box or hard-sided container when not actively in use, including in tents and vehicles. Bear boxes are provided at all campgrounds. Do not leave food unattended, including in your car at trailheads."
  - question: "Is the park road open year-round?"
    answer: "No. The 29-mile park highway typically closes for winter after heavy snowfall, often in October or November, and reopens in mid-to-late June after snowplows clear up to 30 feet of accumulated snow. The southwest entrance area remains accessible in winter for snowshoeing and cross-country skiing. Check the NPS website for current road conditions before visiting in spring or late fall."

  - question: What state is Lassen Volcanic National Park in?
    answer: Lassen Volcanic National Park is in [California](/states/california), near Redding, California.
