sections:
  overview: |
    Lassen Volcanic National Park covers 106,589 acres in northeastern California at the southern end of the Cascade Range, roughly 50 miles east of Redding and about 250 miles north of San Francisco. The park is one of the few places in the world where all four types of volcanoes, plug dome, shield, cinder cone, and composite stratovolcano, appear within a single park boundary. A 29-mile park highway crosses the park from the northwest entrance near Manzanita Lake to the southwest entrance near Mineral, giving road access to major hydrothermal features, trailheads, and lake viewpoints. The park draws about 516,000 visitors per year, ranking 46th among the 63 national parks, with visitation concentrated in summer when the highway is snow-free.

  known_for: |
    Lassen Peak, the world's largest plug dome volcano at 10,457 feet, which last erupted in a series of events from 1914 to 1921 and whose May 22, 1915 explosion sent an ash column 30,000 feet into the air and created the Devastated Area still visible along the park highway.
    Bumpass Hell, a 3-acre hydrothermal basin reached by a 3-mile round-trip trail, containing the highest concentration of boiling mudpots, fumaroles, and acid sulfate pools in the park, with water temperatures at some vents reaching 322 degrees Fahrenheit.
    The presence of all four volcano types: Lassen Peak is a plug dome, Prospect Peak and Raker Peak are shield volcanoes, Cinder Cone in the northeast corner is a classic cinder cone, and Brokeoff Mountain is a remnant of ancient Mount Tehama, a composite stratovolcano.
    The 29-mile park highway, open roughly mid-June through November depending on snowpack, which connects a chain of trailheads, hydrothermal overlooks, and mountain lakes including Manzanita, Summit, and Emerald.

  best_things_to_see_items:
    - name: "Lassen Peak Summit Trail"
      description: "The trail to the 10,457-foot summit of Lassen Peak is 5 miles round trip with about 2,000 feet of elevation gain, starting from a parking area at 8,500 feet on the park highway. The upper mile crosses volcanic rock and hardened lava fields above treeline, with views across the Cascade Range into Nevada and Oregon on clear days. The summit is the highest point in the park and one of the most accessible volcano summits in the western United States. Snowpack closes the trail until mid-July in most years; check conditions before visiting in June."
      image: "/images/parks/national/lassen-volcanic-national-park/06-lassen-peak-summit-trail.jpg"
      alt: "Two hikers sit on a mountain top with a view of multiple peaks, dotted with patches of snow"
      credit: "NPS Photo"
    - name: "Bumpass Hell"
      description: "Bumpass Hell is the largest hydrothermal area in the park, covering about 3 acres of boiling pools, fumaroles, and mudpots in a volcanic basin reached by a 3-mile round-trip trail. A wooden boardwalk protects visitors from the unstable crust; the feature is named for Kendall Vanhook Bumpass, who discovered it in the 1860s and severely burned his leg when he broke through the crust. Water temperatures in the hottest pools approach 322 degrees Fahrenheit. The basin is most visually striking in morning light before the steam disperses."
      image: "/images/parks/national/lassen-volcanic-national-park/07-bumpass-hell.jpg"
      alt: "A boardwalk passes through a colorful, steaming hydrothermal basin."
      credit: "NPS Photo"
    - name: "Manzanita Lake"
      description: "Manzanita Lake sits near the northwest park entrance at 5,890 feet, offering a flat 1.8-mile loop trail around the shoreline with a direct view of Lassen Peak reflected in calm water. The lake has a campground, a small store, a visitor center, and a boat launch; canoes and kayaks can be rented on site in summer. Beavers are active at Manzanita Lake and their dams and lodges are visible from the trail. The lake is one of the earliest areas to open in spring and among the last to close in fall."
      image: "/images/parks/national/lassen-volcanic-national-park/08-manzanita-lake.jpg"
      alt: "A volcanic peak rises above a tree-lined, deep blue lake."
      credit: "NPS Photo"
    - name: "Cinder Cone and the Painted Dunes"
      description: "Cinder Cone is a nearly perfect 700-foot-tall cone in the remote Butte Lake area of the park, built from successive eruptions that ended around 1666. A 4-mile round-trip trail climbs its steep loose-cinder flanks to a double summit crater and sweeping views of the Fantastic Lava Beds and the Painted Dunes, which get their vivid red and orange colors from oxidized ash. The Butte Lake entrance is accessed from Highway 44 via a 6-mile dirt road; it is separate from the main park highway. Allow extra time for the sandy, ankle-deep climb to the rim."
      image: "/images/parks/national/lassen-volcanic-national-park/09-cinder-cone-and-the-painted-dunes.jpg"
      alt: "aerial view of a cinder cone and volcanic landscape"
      credit: "NPS photo—Restrictions apply on use and/or reproduction."
    - name: "Brokeoff Mountain"
      description: "Brokeoff Mountain at 9,235 feet is the highest remaining summit of ancient Mount Tehama, a composite stratovolcano that stood roughly 11,500 feet and collapsed after exhausting its magma supply thousands of years ago. The 7.4-mile round-trip trail gains about 2,600 feet from the southwest entrance, passing through conifer forest and open subalpine slopes to a summit ridge with views into the volcanic caldron where Tehama once stood. The trail is quieter than Lassen Peak and passes close to active fumaroles near Mill Creek. Start early; afternoon thunderstorms are common in summer."
      image: "/images/parks/national/lassen-volcanic-national-park/10-brokeoff-mountain.jpg"
      alt: "view of brokeoff mountain from park road"
    - name: "Kings Creek Meadows and Falls"
      description: "Kings Creek drains a wide subalpine meadow in the center of the park before dropping over Kings Creek Falls, a 30-foot cascade accessible via a 3-mile round-trip trail with about 700 feet of descent and return. The upper meadow section of the trail crosses one of the most productive wildflower areas in the park, with peak bloom in late June and early July when snowmelt is still feeding the creek. The lower falls section is steeper and rockier; trail junction signs are well-marked. The meadow is one of the best spots in the park to see mule deer at dawn and dusk."
      image: "/images/parks/national/lassen-volcanic-national-park/11-kings-creek-meadows-and-falls.jpg"
      alt: "A fenced overlook above a 30-foot-high waterfall."

