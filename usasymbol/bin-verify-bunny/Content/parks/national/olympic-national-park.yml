sections:
  overview: |
    Olympic National Park covers 922,650 acres on Washington's Olympic Peninsula, west of Puget Sound. Three entirely different landscapes coexist within the park's boundaries: the glaciated Olympic Mountains, including 7,965-foot Mount Olympus; temperate rainforests on the western slopes that receive up to 14 feet of rain per year; and 73 miles of undeveloped Pacific coastline. The park ranks 6th in annual visitation among the 63 U.S. national parks, drawing roughly 4 million visitors per year. Port Angeles is the main gateway, 90 miles from Seattle-Tacoma International Airport. Congress established Olympic as a national park in 1938, and UNESCO designated it a World Heritage Site in 1981.

  known_for: |
    Olympic is best known for the Hoh Rain Forest, one of the largest temperate rainforests in North America, where big-leaf maples draped in thick moss create a green canopy over trails that receive up to 167 inches of rain annually. The alpine zone around Hurricane Ridge, accessible by a paved road to 5,242 feet, gives visitors mountain panoramas without technical climbing. The park's Pacific shoreline features sea stacks, tide pools, and sections of beach reachable only on foot. A single park encompasses more ecosystem variety — rainforest, glacier, and ocean — than almost any other unit in the national park system.

  best_things_to_see_items:
    - name: "Hoh Rain Forest — Hall of Mosses"
      description: "A 0.8-mile loop through old-growth big-leaf maples draped in club moss, one of the most photographed landscapes in the Pacific Northwest. The Hoh Rain Forest Visitor Center is the trailhead. The forest is lush year-round; moss hangs heaviest in winter after the rains."
      image: "/images/parks/national/olympic-national-park/01-hall-of-mosses.jpg"
      alt: "A tree branch heavy with moss"
      credit: "NPS/C. Bubar"
    - name: "Hurricane Ridge"
      description: "A paved road climbs to 5,242 feet, ending at a visitor center with panoramic views of the Olympic Mountains and, on clear days, Vancouver Island across the Strait of Juan de Fuca. Wildflowers cover the meadows in July and August. In winter the road opens on weekends for skiing and snowshoeing."
      image: "/images/parks/national/olympic-national-park/02-hurricane-ridge.jpg"
      alt: "A wooden building perched on a snowy hillside, with snowy mountains in the background"
      credit: "NPS"
    - name: "Sol Duc Valley and Sol Duc Falls"
      description: "The Sol Duc River flows through old-growth forest to a set of falls that split into three channels before dropping into a narrow gorge. The falls are 1.6 miles from the Sol Duc Trailhead. The same valley holds Sol Duc Hot Springs Resort, where outdoor soaking pools stay open spring through fall."
      image: "/images/parks/national/olympic-national-park/03-sol-duc-falls.jpg"
      alt: "Sol Duc Falls, Olympic NP"
      credit: "NPS photo"
    - name: "Pacific Coastline — Rialto Beach and Ruby Beach"
      description: "Two of the park's most accessible wild beach sections, both reached via US 101. Rialto Beach has sea stacks and driftwood and opens to a backcountry coastal route north to Cape Flattery. Ruby Beach, near the Kalaloch area, offers tide pools and wide sand at low tide."
      image: "/images/parks/national/olympic-national-park/04-best-pacific-coastline-rialto-beach.jpg"
      alt: "A view of the Pacific Ocean from Rialto Beach."
    - name: "Lake Crescent"
      description: "A deep glacially carved lake with strikingly blue water, 8.5 miles long, surrounded by forested ridges. Lake Crescent Lodge, open mid-April through late October, sits on the southern shore. Kayak and rowboat rentals operate from the lodge dock. US 101 runs along the southern edge."
      image: "/images/parks/national/olympic-national-park/04-lake-crescent.jpg"
      alt: "Clouds over Lake Crescent"
      credit: "Mary Campbell"
    - name: "Tide Pools — Kalaloch and Shi Shi Beach"
      description: "The park's rocky intertidal zones harbor sea stars, anemones, sea urchins, and hermit crabs. Kalaloch Beach 4 is the most accessible tide pool site. Shi Shi Beach in the northwest corner requires a 2-mile hike from the Makah Reservation trailhead and a Makah recreation permit."
      image: "/images/parks/national/olympic-national-park/06-best-tide-pools-ruby-beach.jpg"
      alt: "Purple orchre stars and green sea anemones in a tidepool."
      credit: "NPS photo by Danielle Archuleta"
    - name: "Mount Olympus and Blue Glacier"
      description: "At 7,965 feet, Mount Olympus holds the most glaciated terrain in the contiguous United States outside of the Cascades. The standard approach follows the Hoh River Trail 17 miles to Glacier Meadows base camp. The summit requires mountaineering skills and glacier travel gear; it is not a hiking objective."
      image: "/images/parks/national/olympic-national-park/05-mount-olympus-blue-glacier.jpg"
      alt: "Mount Olympus & Blue Glacier at Sunset"

