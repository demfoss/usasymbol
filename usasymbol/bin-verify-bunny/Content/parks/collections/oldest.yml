h1: "Oldest National Parks in the United States"
seo_title: "Oldest National Parks | Ranked by Year Established"
seo_description: "Yellowstone, established in 1872, is the world's first national park. See all 63 US national parks ranked from oldest to newest with founding dates and history."
intro: "Yellowstone was established on March 1, 1872 — more than 44 years before the National Park Service itself existed. The idea of setting aside land for public enjoyment rather than private exploitation was revolutionary. Today those early parks, each established by a separate act of Congress, form the oldest layer of the American conservation legacy."
quick_answer: "Yellowstone (1872) is the oldest national park in the United States and the world. Sequoia (1890) and Yosemite (1890) are next. The newest is New River Gorge, established in 2020."
