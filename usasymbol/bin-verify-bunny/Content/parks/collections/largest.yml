h1: "Largest National Parks in the U.S."
seo_title: "Largest National Parks by Size | All 63 Ranked by Acres"
seo_description: "Wrangell-St. Elias is the largest US national park at 13.2 million acres — bigger than Switzerland. See all 63 parks ranked by size from biggest to smallest."
intro: "Alaska dominates this list. Seven of the ten largest national parks in the United States are in Alaska — a consequence of the Alaska National Interest Lands Conservation Act of 1980, which added more than 47 million acres to the national park system in a single stroke. Wrangell-St. Elias alone is larger than Yellowstone, Yosemite, and the entire country of Switzerland combined."
quick_answer: "Wrangell-St. Elias in Alaska is the largest national park in the United States at 13,175,799 acres — more than six times the size of Yellowstone. Death Valley is the largest park in the contiguous 48 states at 3.4 million acres."
