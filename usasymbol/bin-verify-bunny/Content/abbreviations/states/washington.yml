state_slug: washington
traditional_abbreviation: Wash.
formation_summary: Washington uses the USPS abbreviation WA.
formation_detail: WA became Washington's standard postal abbreviation in 1963. The older
  form Wash. still appears in older writing, but WA is the form used in current addresses
  and forms.
search_intent_summary: Use WA for Washington in mailing addresses, shipping labels, government
  forms, and business records.
similar_codes_summary: WA is often compared with WV, WI, and WY because several W-state codes
  look similar at a glance.
