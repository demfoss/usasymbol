formation_summary: Kentucky's USPS abbreviation is KY.
formation_detail: USPS adopted KY for Kentucky in 1963. The older abbreviation Ky. still
  appears in older sources, but KY is the standard postal form today.
search_intent_summary: KY is used for Kentucky in mailing addresses, shipping labels, government
  forms, and most databases.
similar_codes_summary: KY is usually checked against KS because Kansas and Kentucky share
  the same first letter and short two-letter format.
