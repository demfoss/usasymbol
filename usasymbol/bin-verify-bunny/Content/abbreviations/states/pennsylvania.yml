formation_summary: Pennsylvania's USPS abbreviation is PA.
formation_detail: PA has been Pennsylvania's standard postal abbreviation since 1963. Older
  forms such as Pa. and Penn. still appear in older material, but PA is the standard postal
  form today.
search_intent_summary: Use PA for Pennsylvania in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: PA is more often checked against older written forms like Pa. and
  Penn. than against another state's postal code.
