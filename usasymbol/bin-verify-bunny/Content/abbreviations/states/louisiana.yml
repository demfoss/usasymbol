state_slug: louisiana
traditional_abbreviation: La.
formation_summary: Louisiana's USPS abbreviation is LA.
formation_detail: LA has been Louisiana's standard postal abbreviation since 1963. The older
  form La. still appears in older publications, but LA is the form used in current addresses
  and forms.
search_intent_summary: Use LA for Louisiana in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: LA is clear in an address, but outside that context many people read
  it as Los Angeles first.
