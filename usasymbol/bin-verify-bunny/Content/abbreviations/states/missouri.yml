state_slug: missouri
traditional_abbreviation: Mo.
formation_summary: Missouri's USPS abbreviation is MO.
formation_detail: MO became Missouri's standard postal abbreviation in 1963. The older form
  Mo. still appears in older writing, but MO is the form used in current addresses and forms.
search_intent_summary: Use MO for Missouri in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: MO is commonly checked against MI, MN, and MS because several M-state
  abbreviations can look similar in short lists.
