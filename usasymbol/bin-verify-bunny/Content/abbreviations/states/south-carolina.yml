state_slug: south-carolina
traditional_abbreviation: S.C.
formation_summary: South Carolina's USPS abbreviation is SC.
formation_detail: SC became South Carolina's standard postal abbreviation in 1963. The older
  form S.C. still appears in older writing, but SC is the form used in current addresses and
  forms.
search_intent_summary: Use SC for South Carolina in mailing addresses, shipping labels,
  official forms, and database entries.
similar_codes_summary: SC is often checked against NC and SD because directional state codes
  can be easy to mix up in forms and lists.
