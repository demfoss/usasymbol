state_slug: north-dakota
traditional_abbreviation: N.D.
formation_summary: North Dakota uses the USPS abbreviation ND.
formation_detail: USPS adopted ND for North Dakota in 1963. The older form N.D. still appears
  in older publications, but ND is the standard postal abbreviation today.
search_intent_summary: ND is used for North Dakota in mailing addresses, shipping labels,
  government forms, and business records.
similar_codes_summary: ND is often checked against NC and SD because the directional state
  codes are easy to confuse in forms and lists.
