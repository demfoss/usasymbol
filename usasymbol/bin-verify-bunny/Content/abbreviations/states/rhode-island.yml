state_slug: rhode-island
traditional_abbreviation: R.I.
formation_summary: Rhode Island uses the USPS abbreviation RI.
formation_detail: USPS adopted RI for Rhode Island in 1963. The older form R.I. still appears
  in older publications, but RI is the standard postal abbreviation now.
search_intent_summary: RI is used for Rhode Island in mailing addresses, shipping labels,
  government forms, and business records.
similar_codes_summary: RI is usually checked against the older form R.I. rather than confused
  with another state's code.
