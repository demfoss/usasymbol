state_slug: new-york
traditional_abbreviation: N.Y.
formation_summary: New York uses the USPS abbreviation NY.
formation_detail: NY became New York's standard postal abbreviation in 1963. The older form
  N.Y. still appears in older writing, but NY is the form used in current addresses and forms.
search_intent_summary: Use NY for New York in mailing addresses, shipping labels, government
  forms, and business records.
similar_codes_summary: NY is often compared with NH, NJ, and NM because New-state abbreviations
  can blur together in short lists and dropdowns.
