formation_summary: Oregon uses the USPS abbreviation OR.
formation_detail: OR became Oregon's standard postal abbreviation in 1963. The older form
  Oreg. still appears in older writing, but OR is the form used in current addresses and forms.
search_intent_summary: Use OR for Oregon in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: OR is clear in an address, but on its own it can blend into ordinary
  language and search syntax.
