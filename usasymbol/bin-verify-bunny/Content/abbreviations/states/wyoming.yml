state_slug: wyoming
traditional_abbreviation: Wyo.
formation_summary: Wyoming uses the USPS abbreviation WY.
formation_detail: USPS adopted WY for Wyoming in 1963. The older form Wyo. still appears
  in older writing, but WY is the standard postal abbreviation today.
search_intent_summary: Use WY for Wyoming in mailing addresses, shipping labels, government
  forms, and business records.
similar_codes_summary: WY is often checked against WA, WV, and WI because several W-state
  codes differ by only one letter.
