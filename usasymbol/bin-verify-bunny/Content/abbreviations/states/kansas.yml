state_slug: kansas
traditional_abbreviation: Kans.
formation_summary: Kansas uses the USPS abbreviation KS.
formation_detail: KS became Kansas's standard postal abbreviation in 1963. The older form
  Kans. still appears in older writing, but KS is the form used in current addresses and forms.
search_intent_summary: Use KS for Kansas in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: KS is most often checked against KY because the two K-state abbreviations
  are easy to confuse in short lists and forms.
