state_slug: new-mexico
traditional_abbreviation: N.M.
formation_summary: New Mexico's USPS abbreviation is NM.
formation_detail: USPS adopted NM for New Mexico in 1963. The older form N.M. still appears
  in older publications, but NM is the standard postal abbreviation today.
search_intent_summary: Use NM for New Mexico in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: NM is often checked against NH, NJ, and NY because several New-state
  abbreviations start the same way.
