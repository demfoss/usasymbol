state_slug: new-jersey
traditional_abbreviation: N.J.
formation_summary: New Jersey uses the USPS abbreviation NJ.
formation_detail: USPS adopted NJ for New Jersey in 1963. The older form N.J. still appears
  in older publications, but NJ is the standard postal abbreviation now.
search_intent_summary: NJ is the form used for New Jersey in mailing addresses, shipping
  labels, government forms, and most databases.
similar_codes_summary: NJ is often compared with NH, NM, and NY because the New-state abbreviations
  can look similar in short lists and dropdowns.
