state_slug: tennessee
traditional_abbreviation: Tenn.
formation_summary: Tennessee's USPS abbreviation is TN.
formation_detail: TN became Tennessee's standard postal abbreviation in 1963. The older
  form Tenn. still appears in older writing, but TN is the form used in current addresses
  and forms.
search_intent_summary: Use TN for Tennessee in mailing addresses, shipping labels, government
  forms, and business records.
similar_codes_summary: TN is usually checked against the older form Tenn. rather than confused
  with another state's code.
