formation_summary: Wisconsin's USPS abbreviation is WI.
formation_detail: WI has been Wisconsin's standard postal abbreviation since 1963. The older
  form Wis. still appears in older sources, but WI is the form used in current addresses and
  forms.
search_intent_summary: Use WI for Wisconsin in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: WI is commonly checked against WA, WV, and WY because the W-state
  abbreviations can look alike in short lists.
