traditional_abbreviation: Vt.
formation_summary: Vermont's USPS abbreviation is VT.
formation_detail: VT became Vermont's standard postal abbreviation in 1963. The older form
  Vt. still appears in older writing, but VT is the form used in current addresses and forms.
search_intent_summary: Use VT for Vermont in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: VT is often checked against VA because the two V-state abbreviations
  can look similar in short lists and forms.
