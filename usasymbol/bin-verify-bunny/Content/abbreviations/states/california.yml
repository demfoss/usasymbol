state_slug: california
traditional_abbreviation: Calif.
formation_summary: California's USPS abbreviation is CA.
formation_detail: USPS has used CA for California since 1963. The older abbreviation Calif.
  still appears in some older publications, but CA is the standard postal form today.
search_intent_summary: CA is used for California in mailing addresses, shipping labels,
  official forms, and most databases.
similar_codes_summary: CA is sometimes checked against Colorado (CO) and Connecticut (CT),
  especially in alphabetical lists of C-state abbreviations.
