state_slug: colorado
traditional_abbreviation: Colo.
formation_summary: Colorado's USPS abbreviation is CO.
formation_detail: USPS has used CO for Colorado since 1963. The older form Colo. still
  appears in some older publications, but CO is the standard for modern addresses and forms.
search_intent_summary: Use CO for Colorado in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: CO is sometimes checked against CA and CT, especially when several
  C-state abbreviations appear together.
