state_slug: connecticut
traditional_abbreviation: Conn.
formation_summary: Connecticut's USPS abbreviation is CT.
formation_detail: CT became Connecticut's standard postal abbreviation in 1963. Conn. still
  appears in older writing, but CT is the form used in current addresses, forms, and databases.
search_intent_summary: Use CT for Connecticut in mailing addresses, shipping labels, and
  official or business records.
similar_codes_summary: CT is usually just a quick confirmation, since the postal code is much
  shorter and cleaner than the full state name.
