faq:
  - question: What is Minnesota's state song?
    answer: "Minnesota's official state song is \"Hail! Minnesota,\" adopted in 1945."
  - question: Who wrote Minnesota's state song?
    answer: "Truman Rickard composed the melody in 1904, with lyrics later revised by Arthur Upson."
  - question: When did Minnesota adopt "Hail! Minnesota" as its state song?
    answer: "The Minnesota Legislature adopted the song as the official state song in 1945."
  - question: Is Minnesota's state song the same as the University of Minnesota's school song?
    answer: "Yes, with minor differences. \"Hail! Minnesota\" began as a University of Minnesota class song and still serves as the school's anthem today."

