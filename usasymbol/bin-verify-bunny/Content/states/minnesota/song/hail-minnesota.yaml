lyrics_verses:
  - |-
    Minnesota, Hail to Thee,
    Hail to Thee, our state so dear,
    Thy light shall ever be
    A beacon bright and clear.
    Thy sons and daughters true
    Will proclaim Thee near and far.
    They shall guard Thy fame and adore Thy name;
    Thou shalt be their Northern Star!
  - |-
    Like the stream that bends to sea,
    Like the pine that seeks the blue;
    Minnesota, still for Thee
    Thy sons are strong and true!
    From Thy woods and waters fair,
    From Thy prairies waving far.
    At Thy call they throng with a shout and song;
    Hailing Thee their Northern Star!
lyrics_note: "The song praises Minnesota's landscape and heritage, echoing the same sense of loyalty and pride it originally expressed toward the University of Minnesota's graduating classes."
lyrics_source_url: "https://en.wikipedia.org/wiki/Hail!_Minnesota"
