sections:
  - id: overview
    icon: fa-solid fa-music
    title: Minnesota State Song
    paragraphs:
      - "\"Hail! Minnesota\" is Minnesota's official state song, adopted by the Legislature in 1945. University of Minnesota student Truman Rickard composed the melody in 1904, and the song still doubles as the university's own school song today."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Hail! Minnesota\" Explained"
    paragraphs:
      - "The song is a stately anthem in a slow ballad style, praising Minnesota's people and heritage in formal, celebratory language. Its measured tempo made it well suited to graduation ceremonies and civic gatherings alike."
      - "Truman Rickard wrote the melody in 1904 while a student at the University of Minnesota, and it debuted that year at the school's Class Day ceremony. University president Cyrus Northrop was honored by name in an early verse, though he asked that the song instead celebrate the school and state rather than himself."
      - "Editor Arthur Upson of the campus newspaper wrote a replacement verse at Northrop's request, and that revised text became the version later adopted statewide."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Hail! Minnesota" Represents Minnesota
    paragraphs:
      - "By the 1940s, \"Hail! Minnesota\" had already spent four decades as a familiar, well-loved anthem across the state through its University of Minnesota roots. That built-in familiarity made it an easy, low-controversy choice for state lawmakers."
      - "Its origins as a school song written by and for young Minnesotans also gave it a grassroots quality state officials could point to, rather than a song commissioned from outside the state."
      - "The song's slow, ceremonial style suited formal state occasions in a way that faster fight songs or novelty tunes could not, reinforcing its fit as a dignified state anthem."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Hail! Minnesota\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Hail! Minnesota" Became Minnesota's State Song
    paragraphs:
      - "\"Hail! Minnesota\" spent more than 40 years as an unofficial University of Minnesota favorite before the state Legislature approved it as the official state song in 1945. Its long run as a beloved campus tradition, rather than any single campaign, built the public familiarity that made its later adoption uncontroversial."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Hail! Minnesota\" Facts"
    facts:
      - "Minnesota adopted \"Hail! Minnesota\" as its official state song in 1945."
      - "Truman Rickard, a University of Minnesota student, composed the melody in 1904."
      - "An early verse honoring university president Cyrus Northrop was later replaced at his own request."
      - "The University of Minnesota Marching Band still performs the song at the close of every practice and performance."

