seo:
  title: "Most Common Last Names in Minnesota"
  description: "Minnesota's most common last names are Johnson, Anderson, and Nelson, reflecting one of America's strongest Scandinavian surname profiles."

page:
  h1: "Most Common Last Names in Minnesota"
  intro: "Johnson appears 85,178 times in Minnesota, followed by Anderson, Nelson, Olson, and Peterson, a ranking shaped above all by the state's huge Norwegian and Swedish settlement after the 1850s. That Scandinavian layer is so strong that Olson, Larson, Carlson, Hanson, Erickson, Swanson, and Hansen all reach the top 20, while later refugee settlement pushed Hmong clan names like Vang and Xiong unusually high too."
  heritage_title: "A Scandinavian State With a Hmong Layer"
  heritage_body: "Minnesota's surname list sits on Dakota and Ojibwe homeland, but immigration remade the modern statewide ranking. Minnesota Historical Society sources note that by 1900 more than 60 percent of the state's foreign-born population came from Germany, Norway, and Sweden; more than 250,000 Norwegians lived in the state by 1905, and nearly 300,000 Swedes immigrated to Minnesota between 1850 and 1930. The list changed again when the first Hmong family arrived in Minnesota in November 1975, the largest resettlement wave followed the Refugee Act of 1980, and the 2010 census counted more than 66,000 Hmong Minnesotans, most in or near the Twin Cities."
  fun_fact: "Vang ranks 29th statewide in Minnesota, an extraordinary position for a Hmong clan name in the United States, because the Twin Cities grew into the country's largest urban Hmong community after the first arrivals in 1975."

surnames:
  - rank: 1
    name: Johnson
    count: 85178
    ratio: 73
    origin: scandinavian
    type: Patronymic
    meaning: "Johnson means 'son of John,' but in Minnesota much of its strength comes from Scandinavian forms such as Jonsson and Johansson being simplified in American records. Norwegian and Swedish settlement made it the state's clear number-one surname."

  - rank: 2
    name: Anderson
    count: 60035
    ratio: 104
    origin: scandinavian
    type: Patronymic
    meaning: "Anderson means 'son of Anders' or Andrew. It rose so high in Minnesota because Anders was a standard given name in both Norway and Sweden, and the anglicized spelling spread across farm country and the Twin Cities alike."

  - rank: 3
    name: Nelson
    count: 39578
    ratio: 158
    origin: scandinavian
    type: Patronymic
    meaning: "Nelson means 'son of Nels' or Nils, the Scandinavian equivalent of Nicholas. Minnesota's long Norwegian and Swedish migration made Nelson far more common here than in most states."

  - rank: 4
    name: Olson
    count: 37811
    ratio: 165
    origin: scandinavian
    type: Patronymic
    meaning: "Olson means 'son of Ole' or Olof. Few surnames signal Minnesota's Nordic settlement more clearly, especially in the southern prairie and western counties where Norwegian and Swedish farm communities took root in the late nineteenth century."

  - rank: 5
    name: Peterson
    count: 36574
    ratio: 171
    origin: scandinavian
    type: Patronymic
    meaning: "Peterson means 'son of Peter,' often anglicized from Petersen or Petersson. It stayed unusually common in Minnesota because both Norwegian and Swedish immigrants brought close variants of the name in large numbers."

  - rank: 6
    name: Larson
    count: 27134
    ratio: 230
    origin: scandinavian
    type: Patronymic
    meaning: "Larson means 'son of Lars.' Minnesota's rank reflects the same Scandinavian pattern that lifted Olson and Peterson, especially in rural Lutheran communities founded during the big settlement decades after the Civil War."

  - rank: 7
    name: Miller
    count: 25853
    ratio: 242
    origin: english
    type: Occupational
    meaning: "Miller is an occupational surname for a grain miller. In Minnesota it reflects both the common English form and German immigrants whose original surname was Muller or Mueller."

  - rank: 8
    name: Carlson
    count: 22477
    ratio: 278
    origin: scandinavian
    type: Patronymic
    meaning: "Carlson means 'son of Carl.' The name is especially characteristic of Swedish and Norwegian Minnesota, where Carl and Karl were common given names and the anglicized -son spelling became standard."

  - rank: 9
    name: Hanson
    count: 21469
    ratio: 291
    origin: scandinavian
    type: Patronymic
    meaning: "Hanson means 'son of Hans,' a Nordic and German form of John. It fits Minnesota's settlement map well because Hans was widely used in both Scandinavian and German immigrant families."

  - rank: 10
    name: Erickson
    count: 18927
    ratio: 330
    origin: scandinavian
    type: Patronymic
    meaning: "Erickson means 'son of Erik.' It remained highly visible in Minnesota because Erik and Eriksson were common among Swedish immigrants, many of whom arrived during the state's railroad and farm expansion years."

  - rank: 11
    name: Brown
    count: 16855
    ratio: 371
    origin: english
    type: Descriptive
    meaning: "Brown began as a nickname for someone with brown hair, complexion, or clothing. In Minnesota it represents the broad English-language surname layer that never disappeared even as Scandinavian names surged above national norms."

  - rank: 12
    name: Thompson
    count: 16547
    ratio: 378
    origin: english
    type: Patronymic
    meaning: "Thompson means 'son of Thomas.' It is common across the Upper Midwest, but in Minnesota it sits below a cluster of Scandinavian patronymics that pushed many other English names downward."

  - rank: 13
    name: Williams
    count: 14558
    ratio: 429
    origin: welsh
    type: Patronymic
    meaning: "Williams means 'son of William.' It remained a statewide staple through migration from other parts of the United States, especially into Minneapolis and Saint Paul, even though Minnesota's most distinctive surnames tend to be Nordic."

  - rank: 14
    name: Jones
    count: 13057
    ratio: 479
    origin: welsh
    type: Patronymic
    meaning: "Jones, the classic Welsh form meaning 'son of John,' is common almost everywhere in the United States. In Minnesota it is notable less for local ancestry than for how many Scandinavian names outrank it."

  - rank: 15
    name: Meyer
    count: 12977
    ratio: 482
    origin: german
    type: Occupational
    meaning: "Meyer comes from a German title for a steward or tenant manager. Its Minnesota prominence points to the strong German settlement of southern and central counties, including the Catholic German belt around Stearns County."

  - rank: 16
    name: Lee
    count: 12608
    ratio: 496
    origin: english
    type: Habitational
    meaning: "Lee originally referred to a clearing or meadow in Old English, but modern Minnesota's Lee families come from several unrelated traditions. The surname's rank reflects both older Anglo-American usage and later Asian American communities for whom Lee is a standard romanization."

  - rank: 17
    name: Schmidt
    count: 12376
    ratio: 505
    origin: german
    type: Occupational
    meaning: "Schmidt is the German equivalent of Smith, meaning a blacksmith. It stands out in Minnesota because German settlement remained strong enough that many families kept the original spelling rather than anglicizing it."

  - rank: 18
    name: Swanson
    count: 11778
    ratio: 531
    origin: scandinavian
    type: Patronymic
    meaning: "Swanson means 'son of Sven.' It is especially associated with Swedish immigration, which helps explain why it ranks much higher in Minnesota than in most states."

  - rank: 19
    name: Davis
    count: 11166
    ratio: 560
    origin: welsh
    type: Patronymic
    meaning: "Davis means 'son of David.' Like Williams and Jones, it reflects Minnesota's broader American migration streams rather than the state's most distinctive ethnic settlement pattern."

  - rank: 20
    name: Hansen
    count: 11100
    ratio: 563
    origin: scandinavian
    type: Patronymic
    meaning: "Hansen means 'son of Hans' and preserves the -sen spelling more common in Denmark and Norway. Its place in Minnesota's top 20 shows how thoroughly Scandinavian naming traditions entered the state's everyday population."

