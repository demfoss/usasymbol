sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Mississippi?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Mississippi's official state insect. The Mississippi Legislature designated it in 1980."
  - "Mississippi also has a separate state butterfly, the spicebush swallowtail, adopted later in 1991."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a fuzzy, golden-brown and black striped body built for collecting pollen and nectar from flowers."
  - "Honey bees live in colonies made up of one queen, thousands of worker bees, and a smaller number of drones. Workers are the bees most often seen visiting flowers."
  - "Not native to North America, honey bees were brought over by European colonists and have since become essential to pollinating crops across Mississippi."

- id: history
  icon: fa-solid fa-landmark
  title: How Mississippi Chose the European Honey Bee
  paragraphs:
  - "The Mississippi Legislature designated the European honey bee as the official state insect in 1980."
  - "The designation recognizes the value of honey bees to Mississippi agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and orchard crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1980, by the Mississippi Legislature."
  - "Scientific name: Apis mellifera."
  - "Colonies are made up of one queen, thousands of worker bees, and a smaller number of drones."
