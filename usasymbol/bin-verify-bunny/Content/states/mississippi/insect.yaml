faq:
- question: What is Mississippi's state insect?
  answer: "Mississippi's state insect is the European honey bee, adopted by the Mississippi Legislature in 1980."
- question: When did Mississippi adopt the European honey bee?
  answer: "Mississippi adopted the European honey bee as its official state insect in 1980."
- question: Why did Mississippi choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Mississippi agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee the same as Mississippi's state butterfly?
  answer: "No. Mississippi's state butterfly is the spicebush swallowtail, adopted in 1991. The European honey bee is a separate designation, the state insect, adopted in 1980."

