sections:
  - id: overview
    icon: fa-solid fa-music
    title: Mississippi State Dance
    paragraphs:
      - "Mississippi named square dance its official state folk dance in 1995. The designation recognized a dance that rural communities across the state had kept alive at fairs and community halls long before the legislature made it official."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the middle, and a caller names each figure moments before dancers perform it. Because the calls are spoken live, dancers respond to the moment rather than following memorized choreography."
      - "String band music built around fiddle, banjo, and guitar typically drives the dance, keeping all eight dancers moving to the same steady pulse. Figures send couples circling, weaving, and swinging past one another before the square resets to its starting positions."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand on the four sides of a square, partners together, facing the center."
      - title: "Circle Right, Then Left"
        description: "All eight dancers join hands and move around the square in one direction, then reverse on the caller's cue."
      - title: "Do-Si-Do with Your Partner"
        description: "Pass your partner right shoulder to right shoulder, walk a small circle back to back, and return to place."
      - title: "Allemande Left with Your Corner"
        description: "Take the hand of the dancer on your left, the corner, and turn around each other before releasing."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the square back home."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Mississippi
    paragraphs:
      - "Rural Mississippi communities kept square dance active at county fairs and grange-style community gatherings for generations, with local callers passing the tradition down informally. That everyday presence made square dance a natural fit for a folk dance designation rather than an unfamiliar import."
      - "Mississippi's 1995 designation also followed the national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance clubs urged states across the country to adopt square dance as an official folk dance. Mississippi's clubs and callers were part of that same push."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Mississippi's Dance
    paragraphs:
      - "Mississippi designated square dance its official state folk dance in 1995, joining the many states that acted during the national square-dance callers' campaign of that era."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Mississippi adopted square dance as its official state folk dance in 1995."
      - "Mississippi's rural fairs and community halls kept square dance active for generations before the designation."
      - "A caller announces each figure live, so no two square dances follow the exact same pattern."
      - "Square dance music is traditionally played by a string band of fiddle, banjo, and guitar."
      - "Dozens of U.S. states adopted square dance as an official folk dance between the 1970s and 1990s."

