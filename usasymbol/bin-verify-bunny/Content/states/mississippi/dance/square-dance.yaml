faq:
  - question: What is Mississippi's state dance?
    answer: "Mississippi's official state folk dance is square dance, adopted in 1995."
  - question: When did Mississippi adopt square dance as its state dance?
    answer: "Mississippi adopted square dance as its official state folk dance in 1995."
  - question: Why did Mississippi choose square dance?
    answer: "Square dance was already active in Mississippi's rural fairs and community halls, and national callers' associations were pressing states across the country to give it official status."
  - question: Is square dance the same in every state?
    answer: "The core figures such as circling, do-si-do, and promenade are shared nationwide, but individual callers and local clubs develop their own regional calling style."

