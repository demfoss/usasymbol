faq:
  - question: What is Nebraska's state dance?
    answer: "Nebraska's official state American folk dance is square dance, adopted in 1997."
  - question: When did Nebraska adopt square dance as its state dance?
    answer: "Nebraska adopted square dance as its official state American folk dance in 1997."
  - question: Why did Nebraska choose square dance?
    answer: "Square dance was already active in Nebraska's county fairs and rural community halls, and national callers' associations were pressing states to give it official status."
  - question: Is square dance the same in every state?
    answer: "The core figures such as circling, do-si-do, and promenade are shared nationwide, but local clubs and callers develop their own regional calling style."

