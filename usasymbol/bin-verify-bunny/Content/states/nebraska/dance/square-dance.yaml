sections:
  - id: overview
    icon: fa-solid fa-music
    title: Nebraska State Dance
    paragraphs:
      - "Nebraska named square dance its official state American folk dance in 1997. The designation matched a dance already active across the state's county fairs and rural community centers, where local clubs met on a regular schedule."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples in a square, each pair facing the center, and a caller names each figure just before dancers perform it. Because the calls come live, no fixed choreography repeats from one dance to the next."
      - "A string band built around fiddle, banjo, and guitar typically supplies the music, keeping eight dancers moving to one steady beat. Figures carry couples through circles, crossings, and turns before the square settles back into its starting spots."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples take their places on the four sides of a square, partners together, facing in."
      - title: "Circle Left, Then Right"
        description: "All eight dancers join hands and move around the square, then reverse direction on the caller's signal."
      - title: "Allemande Left with Your Corner"
        description: "Take the hand of the dancer on your left, the corner, and turn around each other before letting go."
      - title: "Do-Si-Do Your Partner"
        description: "Pass right shoulders with your partner, circle back to back without touching, and return to place."
      - title: "Promenade the Square"
        description: "Take your partner's hands and walk together around the outside of the square back home."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Nebraska
    paragraphs:
      - "Nebraska's county fairs and rural community halls kept square dance active for decades, with local callers teaching the figures to new dancers each season. That everyday presence gave lawmakers a dance already rooted in the state's community life rather than an outside symbol."
      - "Nebraska's 1997 designation also arrived near the end of the national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance clubs urged state legislatures to name square dance an official folk dance. Nebraska's clubs and callers took part in that same movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Nebraska's Dance
    paragraphs:
      - "Nebraska designated square dance its official state American folk dance in 1997, one of the later states to act during the national square-dance callers' campaign of that era."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Nebraska adopted square dance as its official state American folk dance in 1997."
      - "Nebraska's county fairs and rural community halls have long hosted local square dance clubs."
      - "A caller announces every figure live, so the same basic moves can be sequenced differently each dance."
      - "Square dance music is traditionally played by a string band of fiddle, banjo, and guitar."
      - "Nebraska was one of the later states to adopt square dance as an official folk dance, acting in 1997."

