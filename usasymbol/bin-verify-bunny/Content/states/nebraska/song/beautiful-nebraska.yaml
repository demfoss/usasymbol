    answer: "Nebraska's official state song is \"Beautiful Nebraska,\" adopted in 1967."
  - question: Who wrote Nebraska's state song?
    answer: "Jim Fras composed the melody around 1960 and later finished the lyrics with Guy Miller."
  - question: When did Nebraska adopt "Beautiful Nebraska" as its state song?
    answer: "The Nebraska Legislature adopted the song in 1967, and Governor Norbert Tiemann signed it into law on June 21 of that year."
  - question: Why was "Beautiful Nebraska" chosen as the state song?
    answer: "Lawmakers adopted it during Nebraska's centennial of statehood, and its gentle tribute to the state's land and sky fit the celebration."

