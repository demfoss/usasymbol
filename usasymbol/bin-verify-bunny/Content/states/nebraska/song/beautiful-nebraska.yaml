sections:
  - id: overview
    icon: fa-solid fa-music
    title: Nebraska State Song
    paragraphs:
      - "\"Beautiful Nebraska\" is Nebraska's official state song, adopted in 1967. Jim Fras composed the melody around 1960, and he later finished the lyrics with Guy Miller before the Nebraska Legislature designated it the state song during the centennial of statehood."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Beautiful Nebraska\" Explained"
    paragraphs:
      - "The song paints a picture of Nebraska's farmland, prairie skies, and rivers, presenting the state as a place of quiet beauty and welcome. It moves at a gentle, hymn-like pace, closer to a ballad than a march, with a melody built to be sung by a crowd rather than performed as a showpiece."
      - "Jim Fras immigrated to the United States from Russia in the early 1950s and eventually settled near Lincoln. He said the melody came to him while he lay in tall grass near a farmer's field outside the city, watching the sky, and he rushed home to work it out at the piano before the idea slipped away."
      - "Fras later worked with fellow Nebraskan Guy Miller to finish the words, shaping the song into a tribute from someone who had found freedom and opportunity in the state."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Beautiful Nebraska" Represents Nebraska
    paragraphs:
      - "Nebraska chose the song partly for its timing. State Senators Richard Marvel, Jerome Warner, Harold Simpson, and Eric Rasmussen proposed it in 1967, the year Nebraska marked one hundred years of statehood, and lawmakers wanted a song that reflected pride in the state at that milestone."
      - "The song's origin also matched Nebraska's self-image as a place people choose to call home. Fras wrote it as an outsider's tribute rather than a boosterish anthem, and that sense of gratitude toward the land resonated with legislators."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Beautiful Nebraska\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Beautiful Nebraska" Became Nebraska's State Song
    paragraphs:
      - "The Nebraska Legislature passed the bill designating \"Beautiful Nebraska\" the state song in 1967, and Governor Norbert Tiemann signed it into law on June 21 of that year. The adoption came during Nebraska's statehood centennial, giving the new song an immediate role in the year's celebrations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Beautiful Nebraska\" Facts"
    facts:
      - "Nebraska adopted \"Beautiful Nebraska\" as its official state song in 1967."
      - "Composer Jim Fras immigrated to the United States from Russia before settling near Lincoln."
      - "Fras said the melody came to him while resting in a field outside Lincoln and looking at the sky."
      - "Guy Miller helped finish the lyrics after Fras completed the tune."
      - "The song became official during Nebraska's centennial year of statehood."

