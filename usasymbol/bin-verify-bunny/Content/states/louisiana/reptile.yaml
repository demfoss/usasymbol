faq:
  - question: What is Louisiana's state reptile?
    answer: "Louisiana's state reptile is the American alligator, adopted by the Louisiana Legislature in 1983."
  - question: When did Louisiana adopt the American alligator?
    answer: "The Louisiana Legislature designated the American alligator the official state reptile in 1983."
  - question: Why did Louisiana choose the American alligator?
    answer: "The American alligator is a familiar and important animal in Louisiana's swamps and bayous, closely tied to the state's wetlands and culture."
  - question: Is the American alligator a turtle, snake, lizard, or alligator?
    answer: "The American alligator is an alligator, a large armored reptile related to crocodiles."

