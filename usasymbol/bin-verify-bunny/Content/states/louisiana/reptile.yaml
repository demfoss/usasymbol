seo_title: "Louisiana State Reptile | American Alligator"
seo_description: "Louisiana's state reptile is the American alligator, adopted in 1983. Learn what it looks like and why it became official."
hero_image: /images/reptiles/louisiana/louisiana-state-reptile-hero.webp
hero_image_alt: "An American alligator resting at the edge of a Louisiana swamp."
hero_image_caption: "The American alligator, Louisiana's state reptile, is a symbol of the state's swamps and wetlands."
intro_text: "Louisiana's state reptile is the American alligator, a large armored reptile found throughout the state's swamps and marshes, adopted in 1983. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Louisiana?
    paragraphs:
      - "The American alligator is Louisiana's official state reptile, designated by the Louisiana Legislature in 1983. Its scientific name is Alligator mississippiensis."
      - "It is a large reptile found in swamps, marshes, rivers, and lakes across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Alligator
    paragraphs:
      - "The American alligator has thick, armored, dark gray to black skin, a broad rounded snout, and powerful jaws lined with sharp teeth."
      - "Adults commonly grow to ten feet or longer, with some males growing considerably larger."
      - "It is a strong swimmer that spends much of its time in water, but it can also move quickly on land and often basks on banks in the sun."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Louisiana Legislature designated the American alligator the official state reptile in 1983, recognizing an animal deeply tied to the state's wetlands."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Louisiana Chose the American Alligator
    paragraphs:
      - "The American alligator is one of the most recognizable animals in Louisiana's swamps and bayous, and it has long been connected to the state's culture and wetland economy."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Alligator
    paragraphs:
      - "The American alligator lives throughout Louisiana's swamps, bayous, marshes, and rivers, with especially large populations in the state's coastal wetlands."
    sites:
