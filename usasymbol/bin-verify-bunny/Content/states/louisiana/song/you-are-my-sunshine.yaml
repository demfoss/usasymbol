faq:
  - question: What is Louisiana's state song?
    answer: "Louisiana's official state song is \"You Are My Sunshine,\" adopted in 1977."
  - question: Who wrote Louisiana's state song?
    answer: "Jimmie Davis and Charles Mitchell wrote and copyrighted the song in 1939."
  - question: When did Louisiana adopt "You Are My Sunshine" as its state song?
    answer: "Louisiana adopted \"You Are My Sunshine\" as its official state song in 1977."
  - question: Does Louisiana have more than one official song?
    answer: "Yes. Louisiana also recognizes a state march, a state environmental song, and a state cultural song alongside its primary state song."

