sections:
  - id: overview
    icon: fa-solid fa-music
    title: Louisiana State Song
    paragraphs:
      - "\"You Are My Sunshine\" is Louisiana's official state song, adopted in 1977. Jimmie Davis and Charles Mitchell copyrighted the song in 1939, and lawmakers honored it after Davis built a music and political career that carried him to the governor's mansion twice."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"You Are My Sunshine\" Explained"
    paragraphs:
      - "The song describes a partner whose presence feels like sunshine on a gray day, then shifts to the singer's fear of losing that happiness after a troubling dream. It moves at an easy, unhurried tempo, built on a simple melody that country and pop singers have adapted for eight decades."
      - "Jimmie Davis was a country singer and Shreveport-born entertainer who copyrighted the song with Charles Mitchell in 1939 and recorded it the following year. Some researchers argue an earlier, uncredited version circulated before Davis registered the copyright, a dispute that has followed the song for decades without ever being settled in court."
      - "Gene Autry and Bing Crosby both recorded versions in 1941, and the song has since been covered more than 300 times, including by Ray Charles, Aretha Franklin, and Johnny Cash."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "You Are My Sunshine" Represents Louisiana
    paragraphs:
      - "Louisiana adopted the song largely because of who wrote it. Jimmie Davis served as governor from 1944 to 1948 and again from 1960 to 1964, campaigning on horseback while singing his own hits and earning the nickname \"the singing governor.\""
      - "A 1968 attempt to name the song Louisiana's official anthem stalled because, as critics pointed out at the time, it never once mentions Louisiana. Lawmakers eventually set that objection aside, choosing to honor the songwriter's connection to the state rather than the lyrics' content."
      - "By the 1970s the song had also become a genuine piece of American popular culture, recorded across country, pop, and R&B, which gave Louisiana a state song with reach far beyond its own borders."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"You Are My Sunshine\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "You Are My Sunshine" Became Louisiana's State Song
    paragraphs:
      - "A 1968 bill to make the song Louisiana's official anthem was vetoed, in part because its lyrics say nothing about the state. The Legislature revisited the idea after Davis's political career, designating it a state song in 1977."
      - "In 2021, lawmakers removed \"Give Me Louisiana,\" a 1970 companion song whose lyrics referenced antebellum plantation life, from the official list, leaving \"You Are My Sunshine\" as Louisiana's sole primary state song. The same legislation added Allen Toussaint's \"Southern Nights\" as a separate state cultural song."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Louisiana

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"You Are My Sunshine\" Facts"
    facts:
      - "Louisiana adopted \"You Are My Sunshine\" as its official state song in 1977."
      - "Co-writer Jimmie Davis served two nonconsecutive terms as governor of Louisiana."
      - "Gene Autry and Bing Crosby both recorded the song in 1941, helping it spread nationally."
      - "Louisiana removed a second, older state song in 2021 and added \"Southern Nights\" as a separate state cultural song."
      - "The song has been covered more than 300 times across country, pop, and R&B."

