faq:
- question: What is Louisiana's state butterfly?
  answer: "Louisiana's state butterfly is the Gulf fritillary, adopted by the Louisiana Legislature in 2022."
- question: When did Louisiana adopt the Gulf fritillary?
  answer: "Louisiana adopted the Gulf fritillary as its official state butterfly in 2022."
- question: What does the Gulf fritillary look like?
  answer: "The Gulf fritillary is a large orange butterfly with large white spots bordered in black."
- question: Is the Gulf fritillary the same as Louisiana's state insect?
  answer: "No. Louisiana's state insect is the European honey bee, adopted in 1977. The Gulf fritillary is a separate designation, the official state butterfly, adopted in 2022."
- question: Where can you find the Gulf fritillary in Louisiana?
  answer: "It is commonly found in Louisiana gardens and open fields, often nectaring on small purple flowers."

