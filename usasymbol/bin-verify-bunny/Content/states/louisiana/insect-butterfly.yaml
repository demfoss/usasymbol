  title: What Is the State Butterfly of Louisiana?
  paragraphs:
  - "The Gulf fritillary, Dione vanillae, is Louisiana's official state butterfly. State lawmakers designated it in 2022."
  - "It is a common sight in Louisiana gardens and fields, often seen feeding on small purple flowers."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Gulf Fritillary
  paragraphs:
  - "The Gulf fritillary is a large orange butterfly marked with large white spots bordered in black."
  - "It is often seen nectaring on small purple flowers in gardens and open fields."

- id: history
  icon: fa-solid fa-landmark
  title: How Louisiana Chose the Gulf Fritillary
  paragraphs:
  - "The Louisiana Legislature named the Gulf fritillary the official state butterfly in 2022."
  - "Official sources confirm the designation and its year but do not give a detailed reason for the choice."

