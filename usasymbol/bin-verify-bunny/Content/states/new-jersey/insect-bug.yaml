sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Bug of New Jersey?
  paragraphs:
  - "The European honey bee, Apis mellifera, is New Jersey's official state bug. The New Jersey Legislature designated it in 1974."
  - "New Jersey calls this symbol a state bug, a separate category from its state butterfly, the black swallowtail, adopted decades later in 2014."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a fuzzy, golden-brown and black striped body built for collecting pollen and nectar from flowers."
  - "Honey bees live in colonies made up of one queen, thousands of worker bees, and a smaller number of drones. Workers are the bees most often seen visiting flowers."
  - "Not native to North America, honey bees were brought over by European colonists and have since become essential to pollinating crops across New Jersey."

- id: history
  icon: fa-solid fa-landmark
  title: How New Jersey Chose the European Honey Bee
  paragraphs:
  - "The New Jersey Legislature designated the European honey bee as the official state bug in 1974."
  - "The designation recognizes the value of honey bees to New Jersey agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and orchard crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1974, by the New Jersey Legislature."
  - "Scientific name: Apis mellifera."
  - "Colonies are made up of one queen, thousands of worker bees, and a smaller number of drones."
  - "Not native to North America, honey bees were introduced by European colonists."
  - "New Jersey also has a separate state butterfly, the black swallowtail, adopted in 2014."




