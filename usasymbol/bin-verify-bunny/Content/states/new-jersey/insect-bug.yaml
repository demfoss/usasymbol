faq:
- question: What is New Jersey's state bug?
  answer: "New Jersey's state bug is the European honey bee, adopted by the New Jersey Legislature in 1974."
- question: When did New Jersey adopt the European honey bee?
  answer: "New Jersey adopted the European honey bee as its official state bug in 1974."
- question: Why did New Jersey choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to New Jersey agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee the same as New Jersey's state butterfly?
  answer: "No. New Jersey's state butterfly is the black swallowtail, adopted in 2014. The European honey bee is a separate designation, the state bug, adopted in 1974."

