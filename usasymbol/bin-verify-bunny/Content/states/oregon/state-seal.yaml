hero_image_caption: The Great Seal of Oregon, adopted at statehood on February 14, 1859. The central shield shows the Pacific Ocean with a departing British man-of-war and an arriving American steamship above a covered wagon crossing the Oregon landscape.
intro_text: "Oregon's state seal shows a British man-of-war sailing away from the Pacific coast while an American steamship arrives, a deliberate image chosen in 1859 to mark the end of joint British and American occupation of the Oregon Territory and Oregon's entry into the Union as the 33rd state. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
