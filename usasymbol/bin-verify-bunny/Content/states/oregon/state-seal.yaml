seo_title: 'Oregon State Seal | Shield, Beaver & The Union'
seo_description: "Oregon's 1859 seal shows a British warship leaving and an American steamer arriving, a beaver, and 33 stars for the 33rd state."
hero_image: /images/seals/oregon/seal.webp
