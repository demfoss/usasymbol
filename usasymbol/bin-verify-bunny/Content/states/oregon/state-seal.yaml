name: Great Seal of Oregon
adopted_year: 1859
is_official: true
legislation: Oregon Revised Statutes § 186.030
meaning: "Oregon's state seal centers on a shield that records a specific sequence of events: British claims to the Pacific Northwest had ended, American settlers had crossed the continent by wagon, and the new state was entering the Union as its 33rd member. The beaver, eagle, wheat, plow, pickaxe, and 33 stars anchor the design to the geography, economy, and political moment of Oregon's founding in 1859."
