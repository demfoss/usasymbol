sections:
- id: history
  icon: fa-solid fa-landmark
  title: Oregon State Seal History and Origin
  paragraphs:
  - "Oregon's Constitutional Convention met in August 1857, more than a year before Congress admitted Oregon to the Union on February 14, 1859. The convention designed the seal alongside the state constitution. Its elements were codified in Oregon Revised Statutes § 186.030, which specifies each component and its placement."
  - "The 1846 Oregon Treaty had settled the contested boundary between the United States and Britain along the 49th parallel, ending nearly three decades of joint occupation of the Oregon Country. By the time the convention met, the British departure was recent enough to record deliberately on the seal."
  - "Oregon was admitted as the 33rd state on February 14, 1859. The 33 stars along the seal's border mark that exact count. The seal has remained in continuous official use since then under the same statutory description established at statehood."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Oregon State Seal Symbols Mean
  paragraphs:
  - "Oregon's seal carries more historical narrative than most state seals. Each element was selected at the 1857 Constitutional Convention to represent a specific fact about Oregon's geography, economy, or political standing in the Union."
  elements:
  - id: eagle
    name: American Eagle
    image: /images/state-seals/oregon/elements/eagle.webp
    paragraphs:
    - "A bald eagle perches at the top of the seal with wings spread. The eagle is the national symbol of the United States, and its position above the Oregon state shield signals the relationship between the new state and the federal government."
    - "Oregon's eagle follows the pattern of the Great Seal of the United States, a design choice common among mid-19th-century state seals that emphasized Union membership."
  - id: shield
    name: Shield
    image: /images/state-seals/oregon/elements/shield.webp
    paragraphs:
    - "The central shield is divided horizontally. The upper half shows the Pacific Ocean with a departing British man-of-war and an arriving American steamship. The lower half shows the Oregon landscape: mountains, forest, and a covered wagon."
    - "This two-part composition was intentional. The ocean scene records a diplomatic fact, the end of British claims to the Pacific Northwest; the land scene records a demographic fact, the mass migration of American settlers via the Oregon Trail."
  - id: british-man-of-war
    name: Departing British Man-of-War
    image: /images/state-seals/oregon/elements/british-ship.webp
    paragraphs:
    - "A British man-of-war sails away from the Oregon coast in the upper portion of the shield. This image commemorates the 1846 Oregon Treaty, which fixed the boundary between the United States and British Canada at the 49th parallel and ended the joint occupation of the Oregon Country that had persisted since 1818."
    - "The ship's departure is not symbolic in a general sense. It references a specific diplomatic event that directly cleared the way for Oregon's territorial and then state status."
  - id: american-steamship
    name: Arriving American Steamship
    image: /images/state-seals/oregon/elements/american-ship.webp
    paragraphs:
    - "An American steam-powered vessel enters the same Pacific scene. It represents the growing commercial connection between Oregon and the rest of the United States, enabled by sea routes around Cape Horn or through Panama."
    - "The steamship rather than a sailing vessel was a deliberate choice for 1859: steam power was the contemporary technology of commerce. Its arrival in the same frame as the departing British warship makes the historical transition legible in a single image."
  - id: covered-wagon
    name: Covered Wagon
    image: /images/state-seals/oregon/elements/covered-wagon.webp
    paragraphs:
    - "A covered wagon crosses the lower portion of the shield, with mountains and forest behind it. This is a direct reference to the Oregon Trail, the overland route that carried an estimated 400,000 settlers from the Missouri River to the Willamette Valley between 1843 and 1869."
    - "Oregon's large enough settler population to qualify for statehood was built on this migration. The wagon is the specific technology of that movement, not a general frontier image."
  - id: beaver
    name: Beaver
    image: /images/state-seals/oregon/elements/beaver.webp
    paragraphs:
    - "A beaver appears at the bottom of the seal. Oregon's connection to the beaver predates its formal designation as the state animal. The beaver pelt trade drove the first sustained European and American exploration and commercial activity in the Pacific Northwest from the 1790s onward."
    - "The Hudson's Bay Company operated Fort Vancouver on the Columbia River as the dominant commercial presence in the Oregon Country through the 1840s. Beaver pelts were the primary commodity. Oregon is nicknamed 'the Beaver State' for this history, and the beaver appears on both the state seal and the state flag."
  - id: sheaf-wheat-plow
    name: Sheaf of Wheat and Plow
    image: /images/state-seals/oregon/elements/agriculture.webp
    paragraphs:
    - "A sheaf of wheat and a plow flank the shield on the seal, representing agriculture, the economic base of the Willamette Valley settlements that formed Oregon's core population at statehood."
    - "The Willamette Valley's fertile soil was a primary draw for Oregon Trail emigrants. By 1859, farming was the dominant occupation of the Oregon settler population, and the valley was already supplying grain to California's gold mining camps."
  - id: pickaxe
    name: Pickaxe
    image: /images/state-seals/oregon/elements/pickaxe.webp
    paragraphs:
    - "A pickaxe appears on the seal alongside the agricultural symbols, representing mining. Oregon experienced its own gold rush beginning in 1852, when gold was discovered near Jacksonville in the Rogue River Valley."
    - "Mining was a significant part of Oregon's early economy alongside agriculture, and the pickaxe on the seal records both industries as foundations of the new state."
  - id: thirty-three-stars
    name: 33 Stars
    image: /images/state-seals/oregon/elements/stars.webp
    paragraphs:
    - "Thirty-three stars appear around the border of the seal, representing Oregon's rank as the 33rd state admitted to the Union. Congress admitted Oregon on February 14, 1859."
    - "Oregon followed Minnesota, which had been admitted in 1858 as the 32nd state. The 33 stars record ordinal position, not population, size, or any other ranking."
  - id: motto
    name: The Union (State Motto)
    image: /images/state-seals/oregon/elements/motto.webp
    paragraphs:
    - '"The Union" is Oregon''s state motto, appearing on the seal. It was chosen at the 1857 Constitutional Convention, four years before the Civil War began. Oregon''s delegates were meeting at a moment when the question of whether the United States would remain intact was a genuine political concern.'
    - 'Debates over slavery and territorial organization in Oregon intersected with the national question of Union survival. "The Union" was a political position as much as a civic statement for the men who designed the seal.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Oregon State Seal'
  paragraphs:
  - "Oregon's state seal has retained its core composition since adoption in 1859. The eagle, shield, beaver, stars, sheaf, plow, pickaxe, and motto have not changed. What shifted over time were engraving standards and the precise rendering of each element, as different printers and engravers applied their own interpretations to the statutory description."
  - "Before statehood, Oregon Territory used a different territorial seal. The state seal replaced it on February 14, 1859, and the state design has remained in force ever since."
  versions:
  - name: Territorial Seal
    years: 1848–1859
    image: /images/state-seals/oregon/versions/seal-of-the-oregon-territory.png
    description: The seal used by Oregon Territory before admission to the Union. It belongs to the territorial government created in 1848 and was replaced when Oregon adopted its state seal in 1859.
  - name: State Seal
    years: 1859–present
    image: /images/state-seals/oregon/versions/seal-of-oregon.svg
    description: Adopted at statehood on February 14, 1859. The composition was established by the 1857 Constitutional Convention and codified in statute. Exact rendering varied between applications, but the statutory description in ORS § 186.030 remains the authoritative reference.

- id: facts
  icon: fa-solid fa-lightbulb
  title: Oregon State Seal Facts
  facts:
  - 'Adopted: February 14, 1859, upon Oregon statehood as the 33rd state'
  - 'Motto: The Union, chosen at the 1857 Oregon Constitutional Convention'
  - 'Stars: 33, marking Oregon as the 33rd state admitted to the Union'
  - 'Departing ship: British man-of-war, commemorating the 1846 Oregon Treaty'
  - 'Arriving ship: American steamship, representing U.S. commerce on the Pacific'
  - 'Covered wagon: direct reference to the Oregon Trail migration (1843–1869)'
  - 'Beaver: references the fur trade history that drove early Pacific Northwest settlement'
  - 'Agriculture: sheaf of wheat and plow represent the Willamette Valley farming economy'
  - 'Mining: pickaxe references the Rogue River Valley gold rush beginning in 1852'
  - 'Legislation: Oregon Revised Statutes § 186.030'

timeline:
- year: '1818'
  description: The United States and Britain agree to joint occupation of the Oregon Country, leaving the region's political status unresolved for nearly three decades.
- year: '1843'
  description: The first large wagon train reaches the Willamette Valley via the Oregon Trail, beginning mass American settlement of the Oregon Country.
- year: '1846'
  description: The Oregon Treaty fixes the U.S.-British boundary at the 49th parallel. Britain cedes claims south of that line. The departing man-of-war on Oregon's seal commemorates this settlement.
- year: '1848'
  description: Congress establishes Oregon Territory, giving the region formal American governance for the first time.
- year: '1852'
  description: Gold discovered near Jacksonville in the Rogue River Valley. Oregon's mining economy begins, represented by the pickaxe on the state seal.
- year: '1857'
  description: Oregon's Constitutional Convention meets and drafts a constitution and state seal. The design establishes the eagle, shield, beaver, 33 stars, and "The Union" motto.
- year: '1859'
  description: Congress admits Oregon as the 33rd state on February 14. The seal designed in 1857 becomes the official emblem of the new state under ORS § 186.030.

faq:
- question: What does the Oregon state seal show?
  answer: Oregon's state seal features a central shield divided into an ocean scene above (with a departing British man-of-war and an arriving American steamship) and a land scene below (with a covered wagon, mountains, and forest). A sheaf of wheat, plow, and pickaxe flank the shield. A beaver appears at the bottom, and a bald eagle with spread wings sits at the top. Thirty-three stars ring the border.
- question: Why is a British warship on the Oregon state seal?
  answer: The departing British man-of-war commemorates the 1846 Oregon Treaty, which ended joint British-American occupation of the Oregon Country and fixed the border at the 49th parallel. The seal's designers, meeting in 1857, chose this image to record the specific diplomatic event that cleared the way for Oregon's path to statehood.
- question: What does "The Union" mean on the Oregon seal?
  answer: '"The Union" is Oregon''s state motto, adopted at the 1857 Constitutional Convention. It was chosen four years before the Civil War, when the question of national unity was an active political concern. The motto expressed Oregon''s commitment to the United States as a single country.'
- question: Why is there a beaver on the Oregon state seal?
  answer: The beaver represents the fur trade that drove the first sustained European and American commercial presence in the Pacific Northwest. Beaver pelts were the primary commodity of the Oregon Country from the 1790s through the 1840s, making the region economically significant before agricultural settlement began. Oregon is nicknamed "the Beaver State" for this history.
- question: When was the Oregon state seal adopted?
  answer: Oregon's state seal was designed at the Constitutional Convention in 1857 and formally adopted upon statehood on February 14, 1859, when Congress admitted Oregon as the 33rd state.
- question: What do the 33 stars on the Oregon seal represent?
  answer: The 33 stars represent Oregon's position as the 33rd state admitted to the Union. Oregon followed Minnesota, which had been admitted in 1858 as the 32nd state, and was itself admitted on February 14, 1859.

