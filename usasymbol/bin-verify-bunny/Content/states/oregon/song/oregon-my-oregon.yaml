sections:
  - id: overview
    icon: fa-solid fa-music
    title: Oregon State Song
    paragraphs:
      - "\"Oregon, My Oregon\" is Oregon's official state song, adopted in 1927. John Andrew Buchanan wrote the words and Henry Bernard Murtagh composed the music for a 1920 statewide contest, and the legislature updated the lyrics in 2021 to better reflect the state's full history."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Oregon, My Oregon\" Explained"
    paragraphs:
      - "The song is a stately march that praises Oregon's mountains, rivers, and forests as a land of opportunity and natural beauty. It moves at a steady, patriotic tempo suited to school assemblies and civic ceremonies, where it is still performed today."
      - "John A. Buchanan, a former Oregon state representative and municipal judge from Astoria, wrote the original lyrics in 1920. Henry B. Murtagh, an organist, set them to music for a competition run by the Society of Oregon Composers, and the pairing won the contest and later legislative approval."
      - "In 2021, the legislature adopted revised lyrics written by Amy Shapiro after officials determined the original text used exclusionary language that ignored Oregon's Indigenous peoples and its full settlement history."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Oregon, My Oregon" Represents Oregon
    paragraphs:
      - "The song won out because it emerged from an open statewide competition rather than a single composer's private submission, giving it broad support from the start. Its imagery of forested peaks and river valleys matched how Oregonians described their own landscape."
      - "By updating rather than replacing the song in 2021, lawmakers kept the familiar melody and title while addressing lyrics that no longer reflected the state's values. The revision let a century-old tradition continue without erasing its history."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Oregon, My Oregon\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Oregon, My Oregon" Became Oregon's State Song
    paragraphs:
      - "The Society of Oregon Composers ran a statewide contest in 1920 to find a new state song, and Buchanan and Murtagh's entry won. The Oregon Legislature made the song official in 1927, and in 2021 it passed a resolution rewriting the lyrics to remove outdated and exclusionary references while keeping the original melody."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Oregon, My Oregon\" Facts"
    facts:
      - "Oregon adopted \"Oregon, My Oregon\" as its state song in 1927."
      - "The song won a statewide songwriting competition organized by the Society of Oregon Composers in 1920."
      - "Lyricist John A. Buchanan was a former Oregon state representative and municipal judge from Astoria."
      - "The Oregon Legislature rewrote the song's lyrics in 2021 to remove outdated, exclusionary language."

