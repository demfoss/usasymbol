intro_text: "Oregon's state rock is the thunderegg, adopted in 1965 after the state's rockhounding clubs voted it their top choice, a round nodule that looks plain outside but often hides colorful agate within. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Oregon State Rock
    paragraphs:
      - "The thunderegg is Oregon's official state rock, adopted by the Oregon Legislature in 1965 after the state's rockhounding clubs voted it their top choice. It is a round, potato-sized nodule that looks like an ordinary stone outside but often hides a core of colorful agate, jasper, or crystal inside."
      - "Oregon has thunderegg beds scattered across the central part of the state, giving rockhounds a genuine claim to a rock rare almost everywhere else."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is a Thunderegg?"
    paragraphs:
      - "A thunderegg forms as a round to irregular nodule inside rhyolite lava, with a plain, knobby gray or brown crust that gives no hint of what lies inside. Cut in half and polished, many reveal bands or star-shaped patterns of agate, jasper, opal, or quartz crystal filling a cavity left by a gas bubble in the cooling lava."
      - "No two thundereggs look alike inside, and their patterns range from simple gray banding to bright, colorful star shapes prized by collectors. Their name comes from a Native American legend describing thunder spirits on Mount Hood and Mount Jefferson hurling the strange stones at each other."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Oregon Chose Thunderegg as Its State Rock"
    paragraphs:
      - "Central Oregon's volcanic history left behind some of the richest thunderegg beds in the country, concentrated in Crook, Jefferson, Malheur, Wasco, and Wheeler counties. Rockhounding clubs across the state pushed for a state rock in the early 1960s and voted the thunderegg their top pick over other Oregon stones."
      - "Lawmakers followed that recommendation in 1965, giving Oregon a rock that draws collectors from around the country to dig in its own backyard. Rock shops and rockhound gatherings built around thundereggs remain part of central Oregon's identity today."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Thunderegg Became Oregon's State Rock"
    paragraphs:
      - "The Oregon Legislature designated the thunderegg the official state rock on March 29, 1965, following a statewide vote among Oregon rockhounding clubs."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Thunderegg Is Found in Oregon"
    paragraphs:
      - "Thundereggs turn up chiefly in central Oregon, including Crook, Jefferson, Malheur, Wasco, and Wheeler counties. Richardson's Rock Ranch, northeast of Madras, sits on the well-known Priday Agate Beds, one of the most productive thunderegg sites in the state."
    sites:
      - name: Richardson's Rock Ranch
        city: Madras
        lat: 44.7563
        lng: -121.1054
        note: "Priday Agate Beds, major thunderegg source"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Thunderegg Facts"
    facts:
      - "Adopted as Oregon's state rock in 1965, after a vote by Oregon rockhounding clubs."
      - "Thundereggs form inside rhyolite lava, later filled with agate, jasper, or crystal."
      - "Crook, Jefferson, and Wheeler counties hold some of the state's richest thunderegg beds."
      - "Their name comes from a Native American legend about thunder spirits throwing the stones from Mount Hood and Mount Jefferson."

