faq:
  - question: What is Oregon's state rock?
    answer: "Oregon's state rock is the thunderegg, a round volcanic nodule that often hides colorful agate or jasper inside, adopted in 1965."
  - question: When did Oregon adopt thunderegg as its state rock?
    answer: "The Oregon Legislature designated the thunderegg the official state rock on March 29, 1965."
  - question: Why did Oregon choose thunderegg?
    answer: "Oregon rockhounding clubs voted the thunderegg their top choice in the early 1960s, and lawmakers followed that recommendation to honor the state's rich central Oregon deposits."
  - question: Where can you find thundereggs in Oregon?
    answer: "Thundereggs turn up mainly in central Oregon counties such as Crook, Jefferson, and Wheeler, including the well-known Priday Agate Beds near Madras."

