sections:
  - id: overview
    icon: fa-solid fa-music
    title: Oregon State Dance
    paragraphs:
      - "Oregon named square dance its official state dance in 1977, years before the broader national campaign that led most other states to adopt it in the 1980s and 1990s. The early timing sets Oregon apart from states that followed a later trend."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the center of the set. A caller leads the group through a sequence of figures, so the pattern of the dance changes from one round to the next."
      - "String-band music built around fiddle, guitar, and banjo sets the pace. Couples circle, cross, and swap places before returning to their original spot in the square."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Arrange four couples in a square, each pair facing the center with partners side by side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the music starts."
      - title: "Circle Left with the Set"
        description: "Join hands with the full square and step together in a circle to the left."
      - title: "Do-Si-Do Your Corner"
        description: "Walk forward and pass your corner back to back without turning, then return to place."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the set to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Oregon
    paragraphs:
      - "Square-dance callers' associations and dance organizations ran a national campaign through the 1970s and beyond urging states to name square dance an official folk dance. Oregon's 1977 adoption came near the start of that push, ahead of most states that later made the same choice."
      - "The early designation reflected an already active square-dance community in Oregon, where clubs and callers had built a regular dance circuit well before the state made it official."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Oregon's State Dance
    paragraphs:
      - "The Oregon Legislative Assembly designated square dance the state's official dance in 1977, making Oregon one of the first states to adopt the designation."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Oregon adopted square dance as its official state dance in 1977."
      - "Oregon's adoption came years before most other states named square dance their official folk dance."
      - "The dance is led by a caller and danced in sets of four couples to string-band music."
      - "Oregon's early designation reflected an established local square-dance club and caller circuit."

