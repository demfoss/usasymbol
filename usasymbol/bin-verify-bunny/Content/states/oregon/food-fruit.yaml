sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Oregon's State Fruit?"
    paragraphs:
      - "The pear is Oregon's official state fruit, designated by the Oregon Legislative Assembly in 2005. Oregon is one of the leading pear-producing states in the country, with major orchards in the Hood River and Rogue valleys."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pear"
    paragraphs:
      - "Pears are sweet tree fruits with a soft, grainy flesh that grow best in cool, well-drained valleys. Oregon grows several varieties, including Bartlett, Anjou, and Comice, harvested from late summer into fall."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pear Became Oregon's State Fruit"
    paragraphs:
      - "The Oregon Legislative Assembly designated the pear the official state fruit in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oregon Chose the Pear"
    paragraphs:
      - "The Hood River and Rogue River valleys have grown pears commercially since the late 1800s, and Oregon has ranked among the nation's top pear-producing states for generations."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Pear Comes From in Oregon"
    paragraphs:
      - "The Hood River Valley in northern Oregon and the Rogue River Valley in the south are the state's two major pear-growing regions."
    sites:
      - name: Hood River Valley
        city: Hood River
        lat: 45.71
        lng: -121.52
