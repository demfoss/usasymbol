sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Oregon?
  paragraphs:
  - "The Oregon swallowtail, Papilio oregonius, is Oregon's official state insect. The Oregon Legislative Assembly designated it in 1979."
  - "Oregon was among the early states to name an official state insect, choosing a butterfly closely tied to the state's high desert region."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Oregon Swallowtail
  paragraphs:
  - "The Oregon swallowtail has yellow wings crossed by black bands, with a short tail extending from each hindwing."
  - "Adults have a wingspan of about 2.5 to 3 inches."
  - "Caterpillars feed on sagebrush relatives such as tarragon and other wormwood plants found in Oregon's dry, high-desert areas."

- id: history
  icon: fa-solid fa-landmark
  title: How Oregon Chose the Oregon Swallowtail
  paragraphs:
  - "The Oregon Legislative Assembly designated the Oregon swallowtail as the official state insect in 1979."
  - "The butterfly was chosen partly because its range centers on Oregon's Columbia River Gorge and high-desert country, tying the symbol closely to the state's own landscape."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Oregon Swallowtail
  paragraphs:
  - "The Oregon swallowtail is found mainly in eastern and central Oregon, including the Columbia River Gorge and high-desert areas where its host plants grow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Oregon Swallowtail Facts
  facts:
