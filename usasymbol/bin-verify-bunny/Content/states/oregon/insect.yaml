faq:
- question: What is Oregon's state insect?
  answer: "Oregon's state insect is the Oregon swallowtail, adopted by the Oregon Legislative Assembly in 1979."
- question: When did Oregon adopt the Oregon swallowtail?
  answer: "Oregon adopted the Oregon swallowtail as its official state insect in 1979."
- question: Why did Oregon choose the Oregon swallowtail?
  answer: "The Oregon swallowtail's range centers on Oregon's Columbia River Gorge and high-desert country, tying the butterfly closely to the state's own landscape."
- question: What does the Oregon swallowtail look like?
  answer: "It has yellow wings crossed by black bands and a short tail on each hindwing, with a wingspan of about 2.5 to 3 inches."
- question: Where is the Oregon swallowtail found?
  answer: "It is found mainly in eastern and central Oregon, including the Columbia River Gorge and high-desert areas."
- question: Is the Oregon swallowtail Oregon's state insect or state butterfly?
  answer: "Oregon's official designation is state insect, adopted in 1979. Oregon does not have a separate state butterfly designation."

