sections:
  - id: overview
    icon: fa-solid fa-music
    title: Wisconsin State Dance
    paragraphs:
      - "Polka became Wisconsin's official state dance in 1993. Unlike most states, which named square dance their folk dance, Wisconsin chose a dance tied directly to the immigrant communities that settled the state."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Polka Explained"
    paragraphs:
      - "Polka is a fast couples dance in 2/4 time, danced with partners holding a closed position and turning progressively around the floor. The step carries a light, bouncing quality that gives the dance its energetic feel."
      - "The music is built around accordion, tuba, and clarinet, playing a quick, driving tempo that pushes couples around the room. Wisconsin's polka scene includes several regional styles brought over by German, Polish, and Czech settlers, each with slightly different phrasing and instrumentation."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Polka
    steps:
      - title: "Take a Closed Partner Position"
        description: "Face your partner and hold a standard closed dance position, one hand at the waist and the other clasped together."
      - title: "Learn the Basic Hop-Step-Close-Step"
        description: "Hop lightly on one foot, then step, close your feet together, and step again, keeping the motion quick and bouncy."
      - title: "Match the 2/4 Tempo"
        description: "Time each hop-step-close-step pattern to the driving accordion and tuba beat of the music."
      - title: "Turn Progressively Around the Floor"
        description: "Use the basic step to travel and rotate as a couple, circling the room rather than staying in one spot."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Polka Represents Wisconsin
    paragraphs:
      - "Wisconsin drew large numbers of German, Polish, and Czech immigrants in the nineteenth century, and those communities carried polka with them as part of everyday social life. The dance became a fixture at weddings, church festivals, and community halls across the state."
      - "Community polka clubs and festivals kept the dance active long after other states had shifted toward square dance as their folk symbol. That living tradition gave Wisconsin lawmakers a clear reason to name polka rather than follow the more common national choice."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Polka Became Wisconsin's State Dance
    paragraphs:
      - "Wisconsin designated polka its official state dance in 1993, choosing a dance tied to its immigrant heritage instead of the square dance most other states had adopted in prior decades."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Polka Facts
    facts:
      - "Wisconsin adopted polka as its official state dance in 1993."
      - "Wisconsin's polka tradition traces back to its German, Polish, and Czech immigrant communities."
      - "Wisconsin is one of the few states with a state dance other than square dance."
      - "Polka is danced in 2/4 time using a hop-step-close-step pattern."
      - "Community polka clubs and festivals remain active across Wisconsin today."

