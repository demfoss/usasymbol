    answer: "Wisconsin's official state song is \"On, Wisconsin!,\" adopted in 1959."
  - question: Who wrote Wisconsin's state song?
    answer: "William T. Purdy composed the melody, and Charles D. Rosa and J. S. Hubbard wrote the civic lyrics."
  - question: When did Wisconsin adopt "On, Wisconsin!" as its state song?
    answer: "Wisconsin adopted the song in 1959, fifty years after the melody was first written."
