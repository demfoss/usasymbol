sections:
  - id: overview
    icon: fa-solid fa-music
    title: Wisconsin State Song
    paragraphs:
      - "\"On, Wisconsin!\" is Wisconsin's official state song, adopted in 1959. William T. Purdy composed the tune in 1909 as a college football fight song, and Charles D. Rosa and J. S. Hubbard rewrote the lyrics in 1913 to turn it into a song fit for statewide civic use."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"On, Wisconsin!\" Explained"
    paragraphs:
      - "The state song version keeps Purdy's driving, march-like melody but swaps the football-focused lyrics for verses praising Wisconsin as the \"grand old Badger State\" and a champion of the right. It plays briskly, built for group singing at assemblies and ceremonies rather than for quiet listening."
      - "Purdy wrote the tune in 1909 hoping to enter it in a University of Minnesota fight song contest, but a former University of Wisconsin classmate persuaded him to give it to his own alma mater instead. Bandmaster John Philip Sousa later called it the finest college song he had ever heard, and its popularity carried the melody well beyond the football stadium."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "On, Wisconsin!" Represents Wisconsin
    paragraphs:
      - "By 1959 the tune was already one of the most recognized in the state, having been sung at University of Wisconsin football games for half a century. Adopting it as the state song let lawmakers choose a melody Wisconsinites already knew by heart."
      - "The 1913 civic lyrics also gave the song broader appeal than a sports anthem, naming Wisconsin directly and casting it as a source of shared pride rather than campus loyalty alone."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"On, Wisconsin!\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "On, Wisconsin!" Became Wisconsin's State Song
    paragraphs:
      - "The Wisconsin Legislature named \"On, Wisconsin!\" the official state song in 1959, half a century after Purdy first wrote the melody for a Camp Randall football game in 1909. The civic lyrics used for the state song had already circulated since 1913, so lawmakers were formalizing a song that had been part of Wisconsin life for decades."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Wisconsin

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"On, Wisconsin!\" Facts"
    facts:
      - "Wisconsin adopted \"On, Wisconsin!\" as its official state song in 1959."
      - "William T. Purdy composed the melody in 1909 as a University of Wisconsin football fight song."
      - "Charles D. Rosa and J. S. Hubbard rewrote the lyrics for civic use in 1913."
      - "John Philip Sousa once called it the best college song he had ever heard."
      - "Wisconsin also recognizes a separate state ballad and a state waltz, both adopted in 2001."

