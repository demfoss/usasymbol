    On, Wisconsin! On, Wisconsin!
    Grand old Badger State!
    We, thy loyal sons and daughters,
    Hail thee, good and great.
    On, Wisconsin! On, Wisconsin!
    Champion of the right,
    Forward, our motto
    God will give thee might!
