faq:
  - question: "What is Wisconsin's state grain?"
    answer: "Wisconsin's state grain is corn, Zea mays, adopted by the Wisconsin Legislature in 1989."
  - question: "When did Wisconsin adopt corn as its state grain?"
    answer: "The Wisconsin Legislature designated corn the official state grain in 1989."
  - question: "Why did Wisconsin choose corn?"
    answer: "Corn is widely grown across Wisconsin, much of it to feed the dairy cattle central to the state's identity as America's Dairyland."
  - question: "Is corn grown in Wisconsin today?"
    answer: "Yes. Corn remains one of the state's most widely planted crops, much of it used for dairy cattle feed."

