intro_text: "Wisconsin's state grain is corn, Zea mays, adopted in 1989 to recognize a crop grown across the state and closely tied to its dairy industry. This profile appears in the [list of U.S. state foods](/symbols/crops)."

sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Wisconsin's State Grain?"
    paragraphs:
      - "Corn, scientifically named Zea mays, is Wisconsin's official state grain, designated by the Wisconsin Legislature in 1989. Corn is grown on farms across the state, much of it used to feed the dairy cattle that give Wisconsin its nickname as America's Dairyland."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Corn"
    paragraphs:
      - "Corn is a tall grass that produces ears covered in kernels, planted across Wisconsin each spring and harvested in fall. Much of Wisconsin's corn crop is chopped and fermented into silage, a moist feed stored for dairy cattle through the winter, while other corn is harvested as dry grain. Wisconsin's mix of soil types and moderate growing season support both uses."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Corn Became Wisconsin's State Grain"
    paragraphs:
      - "The Wisconsin Legislature designated corn the official state grain in 1989, recognizing a crop tightly linked to the state's farm and dairy economy."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Wisconsin Chose Corn"
    paragraphs:
      - "Corn is one of Wisconsin's most widely planted crops, and much of it is grown specifically to feed the state's dairy herds, which underpin Wisconsin's identity as America's Dairyland. The close relationship between corn and dairy farming across the state made it a natural choice for the official state grain."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Corn Facts"
    facts:
      - "Adopted as Wisconsin's state grain in 1989."
      - "Its scientific name, Zea mays, appears alongside the common name in the state designation."
      - "Much of Wisconsin's corn crop is fermented into silage to feed dairy cattle."
      - "Corn is one of the most widely planted crops on Wisconsin farms."

