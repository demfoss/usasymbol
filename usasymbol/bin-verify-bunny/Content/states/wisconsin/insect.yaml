faq:
- question: What is Wisconsin's state insect?
  answer: "Wisconsin's state insect is the European honey bee, adopted by the Wisconsin Legislature in 1977."
- question: When did Wisconsin adopt the European honey bee?
  answer: "Wisconsin adopted the European honey bee as its official state insect in 1977."
- question: Why did Wisconsin choose the European honey bee?
  answer: "Wisconsin schoolchildren campaigned for an official state insect, and lawmakers responded in 1977 by naming the European honey bee, recognizing its role in pollinating crops."
- question: What does a European honey bee look like?
  answer: "It is a fuzzy, golden-brown and black striped insect that lives in large colonies and produces honey and beeswax."
- question: Is the honey bee found throughout Wisconsin?
  answer: "Yes. Honey bees are kept and found across Wisconsin, where they pollinate a wide range of fruit, vegetable, and crop plants."

