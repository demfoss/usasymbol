sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Wisconsin?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Wisconsin's official state insect. The Wisconsin Legislature designated it in 1977."
  - "Wisconsin schoolchildren helped bring the idea for a state insect to state lawmakers."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "The European honey bee is a fuzzy, golden-brown and black striped insect that lives in large colonies."
  - "Worker bees collect nectar and pollen from flowers and carry it back to the hive, where the colony produces honey and beeswax."
  - "Each hive has one queen, thousands of worker bees, and a small number of drones, and the bees work together to raise young and defend the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How Wisconsin Chose the European Honey Bee
  paragraphs:
  - "Wisconsin schoolchildren campaigned for an official state insect and brought the idea to state lawmakers."
  - "In 1977, the Wisconsin Legislature responded by naming the European honey bee the official state insect, recognizing the role honey bees play in pollinating Wisconsin crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 1977 by the Wisconsin Legislature."
  - "Scientific name: Apis mellifera."
  - "Golden-brown and black striped insect that lives in large hive colonies."
  - "Worker bees gather nectar and pollen and help produce honey and beeswax."
  - "Chosen after a campaign by Wisconsin schoolchildren for an official state insect."




