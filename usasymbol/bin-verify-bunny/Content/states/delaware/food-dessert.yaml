sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Delaware's State Dessert?"
    paragraphs:
      - "Peach pie is Delaware's official state dessert, designated by the Delaware General Assembly in 2009. It is a baked pie made from sliced peaches in a pastry crust."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Peach Pie"
    paragraphs:
      - "Peach pie is made by filling a pastry crust with sliced, sweetened peaches, then baking it until the crust is golden and the fruit softens. Delaware cooks have long used the state's peach crop for pies, preserves, and desserts."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Peach Pie Became Delaware's State Dessert"
    paragraphs:
      - "The Delaware General Assembly designated peach pie the official state dessert in 2009, adding it to the state's list of official symbols."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Delaware Chose Peach Pie"
    paragraphs:
      - "Delaware was once one of the largest peach-producing states in the country, especially in the 1800s, when Kent and Sussex counties held large peach orchards. Peach pie reflects that agricultural history even though the state's peach industry has shrunk since its peak."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Peach Pie Facts"
    facts:
      - "Adopted as Delaware's state dessert in 2009."
      - "Delaware was a major peach-growing state in the 19th century."
      - "Kent and Sussex counties historically held large peach orchards."

