faq:
- question: What is Delaware's state soil?
  answer: "Delaware's state soil is the Greenwich series, also called Greenwich loam. It is a well-drained loam found on the Coastal Plain uplands across all three Delaware counties. Governor Thomas R. Carper made it official on April 20, 2000."
- question: Why is it called Greenwich soil?
  answer: "The series is named for Greenwich, a historic town on the Cohansey River in Cumberland County, New Jersey, where soil scientists first mapped and described this type of soil. Despite the name, the soil is widespread in Delaware, not New Jersey."
- question: What color is Greenwich soil?
  answer: "The surface layer is brown. The clay-enriched subsoil below it is strong brown to yellowish brown. The deeper sandy layers are dark yellowish brown grading to yellowish brown coarse sand. Colors get brighter and more yellow as you go deeper."
- question: Where is Greenwich soil found in Delaware?
  answer: "Greenwich soil is found in all three Delaware counties — New Castle, Kent, and Sussex — on the flat to gently sloping uplands of the Coastal Plain and Delmarva Peninsula. It also appears in adjacent parts of Maryland and New Jersey."
- question: What crops grow in Greenwich soil?
  answer: "The main crops are grain corn, soybeans, and wheat. Farmers also grow vegetables for fresh market — a practice called truck farming — and timber trees including loblolly pine and mixed hardwoods where land is not cultivated."
- question: Who chose Greenwich as Delaware's state soil?
  answer: "Representative V. George Carey sponsored House Bill 436 in the Delaware General Assembly. Students from Fifer Middle School built soil monoliths and delivered them to legislators to support the bill. Governor Thomas R. Carper signed it into law on April 20, 2000."
- question: How deep is Greenwich soil?
  answer: "Greenwich soil is very deep — the profile extends to at least 72 inches without hitting bedrock. The clay-enriched subsoil runs from about 10 to 39 inches. Below that, coarse sandy parent material continues well past 60 inches."
- question: What makes Greenwich soil prime farmland?
  answer: "Prime farmland status comes from the combination of good drainage, workable loam texture, moderate water-holding capacity, and a climate suited to a wide range of crops. Greenwich soil hits all those marks: it drains well enough to be tilled early in spring but holds enough moisture to support crops through summer dry spells."

