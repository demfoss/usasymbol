sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Bug of Delaware?
  paragraphs:
  - "The ladybug, family Coccinellidae, is Delaware's official state bug. The Delaware General Assembly designated it in 1974."
  - "Delaware calls this symbol a state bug rather than a state insect, a separate category from the state's other insect symbols, the tiger swallowtail butterfly and the stonefly."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Ladybug
  paragraphs:
  - "A ladybug has a small, rounded, dome-shaped body, usually red or orange with black spots, though exact color and spot patterns vary by species."
  - "It has short antennae and six legs tucked beneath its domed shell, which covers a pair of flight wings."
  - "Ladybugs are considered helpful to gardeners and farmers because they eat aphids and other small, soft-bodied pests. A single ladybug can eat up to 60 aphids in a day."

- id: history
  icon: fa-solid fa-landmark
  title: How Delaware Chose the Ladybug
  paragraphs:
  - "The push for a state bug came from Mrs. Mollie Brown-Rust's second-grade class at Lulu M. Ross Elementary School in Milford, Delaware, after the students learned the state had no official bug."
  - "The class worked with members of the Delaware General Assembly for nearly a year, and students presented their case to lawmakers directly."
  - "The Delaware House of Representatives approved the bill, and the ladybug became the official state bug on April 25, 1974."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Ladybug Facts
  facts:
  - "Adopted: 1974, by the Delaware General Assembly, after a campaign by a Milford second-grade class."
  - "Family: Coccinellidae."
  - "Known for its rounded, spotted shell and its appetite for aphids, eating up to 60 a day."
  - "Delaware calls this designation a state bug, a separate category from its state butterfly and state macroinvertebrate."
  - "Several other states, including Massachusetts, New Hampshire, New York, Ohio, and Tennessee, also recognize a ladybug as an official insect symbol."




