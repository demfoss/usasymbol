faq:
- question: What is Delaware's state bug?
  answer: "Delaware's state bug is the ladybug, adopted by the Delaware General Assembly in 1974."
- question: When did Delaware adopt the ladybug?
  answer: "Delaware adopted the ladybug as its official state bug on April 25, 1974."
- question: Why did Delaware choose the ladybug?
  answer: "A second-grade class at Lulu M. Ross Elementary School in Milford, led by Mrs. Mollie Brown-Rust, campaigned for nearly a year to give Delaware an official state bug, and lawmakers chose the ladybug."
- question: What does Delaware's state bug look like?
  answer: "The ladybug has a small, rounded, domed shell, usually red or orange with black spots, and six legs beneath the shell."
- question: Is the ladybug the same as Delaware's state insect?
  answer: "Delaware does not have a separate state insect. The ladybug holds the state bug title, while Delaware also recognizes a state butterfly (eastern tiger swallowtail) and a state macroinvertebrate (stonefly)."

