title: "Delaware State Wildlife Animal | Gray Fox"
scientific_name: "Urocyon cinereoargenteus"
adopted_year: 2010

seo_title: "Delaware State Wildlife Animal | Gray Fox"
seo_description: "Delaware's state wildlife animal is the Gray Fox, adopted in 2010. Learn why this official Delaware symbol was chosen and what it represents."

intro_text: "The Gray Fox is the official Delaware state wildlife animal, designated in 2010. This page gives the direct answer for searches like 'delaware state wildlife animal', 'delaware state animal', and 'delaware state mammal' while explaining how the symbol fits the state's official animal designations. Only canine in North America that regularly climbs trees; chosen as state symbol by fourth graders in a persuasive writing assignment. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Gray Fox"
official_since: "2010"
status: "Stable (no state or federal conservation listing)"
habitat_in_state: "Deciduous woodland edges, brushy fields, and suburban backyards across all three counties"
known_for: "Only canine in North America that regularly climbs trees; chosen as state symbol by fourth graders in a persuasive writing assignment"

size: "31 to 44 inches in total length; 12 to 15 inches tall at the shoulder"
weight: "7 to 15 pounds; males slightly heavier than females"
coloration: "Gray and rusty-red upper coat with white underside; a black stripe runs down the length of the tail"
distinctive_traits: "Semi-retractable curved claws on front paws; rotating forelegs allow tree climbing; smaller and lighter than the red fox; black-tipped tail"

habitat: "Woodland edges, brushy fields, and forested areas with dense ground cover"
range_in_state: "Found statewide across New Castle, Kent, and Sussex counties. Prefers deciduous woodland edges but has adapted to suburban and agricultural landscapes throughout the state."
conservation_status: "Stable population statewide. No state or federal conservation listing. Gray foxes were once the most common fox in the eastern United States, but red foxes have become more widespread due to deforestation and suburban development. Gray foxes remain common in Delaware, especially near mature woodland."
where_to_find: "Blackbird State Forest and Redden State Forest offer good woodland habitat. Prime Hook and Bombay Hook National Wildlife Refuges have forested edges where foxes are active. Gray foxes are most often spotted at dawn and dusk. Some Delaware residents also report sightings in suburban backyards."
symbol_connections: "Delaware's Great Seal features a militiaman with a musket and a farmer with a hoe. The fourth graders who nominated the gray fox compared its year-round activity to soldiers at Dover Air Force Base—connecting the state wildlife animal directly to the militiaman on the seal. The fox's role controlling rodents on farmland mirrors the farmer's importance to the state."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Jack A. Markell signed House Bill No. 354 on June 10, 2010, making the gray fox Delaware's official state wildlife animal. Representative John Kowalko and Senator Ennis sponsored the bill in the 145th General Assembly."
      - "Before 2010, Delaware was one of only four states in the country without a designated state wildlife animal. The gray fox filled that gap."

    subsections:
      - subtitle: "A Writing Assignment Became Law"
        text: "Teacher Paul Sedacca at Joseph M. McVey Elementary School gave his fourth graders a persuasive writing assignment. The students researched native Delaware species and debated which animal best represented the state. They chose the gray fox, wrote letters to their legislators, and made their case. The letters reached the General Assembly, and lawmakers introduced House Bill 354 based on the students' work. A single classroom project turned into an act of state law."

      - subtitle: "What the Students Argued"
        text: "The fourth graders built their case around traits they found most compelling. The gray fox is indigenous to Delaware and has existed as a species for between 7 and 10 million years. It does not hibernate, staying active through every season. The students connected that trait to military readiness, writing that the fox is 'always ready like our soldiers at Dover Air Force Base.' The General Assembly found the argument strong enough to quote the students' own words in the official bill text."

  - id: "state-symbolism"
    title: "What the Gray Fox Represents"
    style: "highlight"
    paragraphs:
      - "The gray fox represents adaptability. Delaware packs farmland, forests, wetlands, suburbs, and coastline into less than 2,000 square miles. The gray fox moves comfortably through nearly all of these landscapes across [The First State](/states/delaware/nickname/the-first-state)."
      - "The designation also stands for civic participation. Delaware has built more of its official symbols through student campaigns than most states. The gray fox is the most visible example of that tradition."
      - "Year-round activity gives the fox a symbolic edge. While many animals retreat or become scarce during winter, the gray fox stays visible in every season—a trait the students deliberately highlighted."

    subsections:
      - subtitle: "The Only Tree-Climbing Fox"
        text: "No other canine in North America regularly climbs trees. Semi-retractable claws grip rough bark, and uniquely flexible forelegs rotate to let the fox move along branches. When threatened by coyotes or domestic dogs, a gray fox may escape upward instead of running across open ground. It also climbs to reach fruit, bird nests, and sheltered resting spots. This single ability set the gray fox apart from every other species the students considered."

      - subtitle: "Adaptability in a Small State"
        text: "Delaware ranks 49th in land area among the fifty states. Within that small territory, the landscape shifts quickly from sandy beaches to river marshes to rolling farmland to suburban neighborhoods. The gray fox thrives across nearly all of these habitats. It hunts in open fields at dawn, rests in wooded edges during the day, and forages near backyards at dusk. Few animals show the kind of flexibility that life in Delaware demands."

      - subtitle: "The Dover Air Force Base Connection"
        text: "Dover Air Force Base is Delaware's largest employer and one of the most important military installations on the East Coast. The McVey students drew a deliberate parallel between the fox and the troops stationed there. Both stay ready regardless of the season. Neither one retreats when conditions change. The General Assembly quoted the students' comparison directly in House Bill 354, giving the gray fox an informal connection to Delaware's military identity that no other state animal enjoys."

      - subtitle: "A Tradition of Student-Driven Symbols"
        text: "The gray fox was not the first Delaware symbol chosen by students. Second graders at Lulu M. Ross Elementary School in Milford campaigned for the ladybug, which became the state insect in 1974. Students at the Richardson Park Learning Center helped select the tiger swallowtail as state butterfly in 1999. The gray fox continued a pattern that makes Delaware unusual among states. Classroom projects have shaped more of Delaware's official symbols than almost anywhere else in the country."

      - subtitle: "Symbol, Not Trophy"
        text: "In 2015, a bill was introduced that would have opened a statewide gray fox hunting season and allowed commercial sale of pelts. Former McVey Elementary students were among those who raised objections. They had worked to make the fox a protected symbol of the state. Lawmakers ultimately did not authorize a general hunting season. The debate showed that a state wildlife animal carries real weight in policy discussions, even years after designation."

  - id: "identification"
    title: "How to Identify Gray Foxes"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Gray foxes are smaller than red foxes and look quite different up close. Their upper coat blends gray and rusty-red fur, with a distinctive black stripe running down the length of the tail. The underside is white or cream-colored. Pointed ears and a compact build give them a quick, alert appearance."
        list_items:
          - "**Size**: 31–44 inches total length; 12–15 inches tall at the shoulder"
          - "**Weight**: 7–15 pounds; males slightly heavier than females"
          - "**Color**: Gray and rusty-red upper coat; white underside; black stripe along the tail"
          - "**Distinguishing features**: Semi-retractable claws; smaller and lighter than a red fox; black-tipped tail"

      - subtitle: "Behavior and Diet"
        text: "Gray foxes are solitary hunters and opportunistic omnivores. Their diet shifts with the seasons—small mammals like mice and rabbits in cooler months, and berries, insects, corn, and fruit in warmer ones. Grasshoppers and crickets become a major food source in late summer and fall. Most activity happens at dawn and dusk, though foxes feeding kits may hunt during daylight hours as well."

  - id: "in-the-state"
    title: "Gray Foxes in Delaware"
    style: "default"

    paragraphs:
      - "Gray foxes live across all three of Delaware's counties. They are found in wooded edges, brushy fields, and even suburban backyards where cover is available. The species prefers deciduous woodland but has adapted well to the mixed landscapes of a small, heavily developed state."
      - "Gray foxes were once the dominant fox species throughout the eastern United States. Decades of deforestation and suburban growth shifted that balance toward the red fox, which thrives in more open habitats. In Delaware today, red foxes are spotted more often. Gray foxes remain common, especially in areas with mature woodland cover."

    facts:
      - "**New Castle County**: Wooded stretches along the Chesapeake and Delaware Canal corridor support gray fox populations near suburban edges"
      - "**Kent County**: Blackbird State Forest and surrounding farmland provide strong woodland habitat for gray foxes"
      - "**Sussex County**: Redden State Forest and the forested margins of national wildlife refuges offer prime habitat"
      - "**Statewide**: Population is stable; no hunting season exists for gray foxes in Delaware"

  - id: "where-to-see"
    title: "Where to See Delaware's State Wildlife Animal"
    style: "default"

    paragraphs:
      - "Gray foxes are most active at dawn and dusk. Quiet woodland edges with dense brush offer your best chance of spotting one. Trail cameras set up along forest borders frequently capture gray fox activity."

    list_items:
      - "**Blackbird State Forest**: Over 3,000 acres of mixed woodland in Kent County; gray foxes use forest edges and clearings for hunting and denning"
      - "**Redden State Forest**: A large tract of pine and hardwood forest in Sussex County with good fox habitat along trails and field margins"
      - "**Prime Hook National Wildlife Refuge**: Forested upland areas along the refuge border attract gray foxes; best viewed in early morning or evening"
      - "**Bombay Hook National Wildlife Refuge**: Wooded edges near impounded marshes provide cover and hunting grounds for foxes year-round"
      - "**Suburban backyards**: Gray foxes have adapted to neighborhoods with yards and tree lines; residents across Delaware report dawn and dusk sightings, especially in New Castle County"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "The gray fox is not threatened or endangered in Delaware. The species carries no state or federal conservation listing. Populations remain stable across all three counties."
      - "Delaware does not hold a hunting season for gray foxes statewide. Existing regulations allow landowners to remove foxes only when they pose a direct threat to livestock or poultry."

    subsections:
      - subtitle: "Challenges Gray Foxes Face"
        text: "While stable in Delaware, gray foxes face pressures across their broader range. Mange, a skin disease caused by parasitic mites, can spread through fox populations and trigger significant die-offs in some years. The arrival of eastern coyotes in Delaware—the state was among the last in the continental United States to see coyotes establish themselves—creates new competition for territory and prey. Continued suburban development reduces available woodland habitat over time, though gray foxes have shown some ability to adapt to fragmented landscapes."

      - subtitle: "Delaware's Role in Fox Management"
        text: "The Delaware Division of Fish and Wildlife monitors fox populations as part of broader statewide wildlife management. No active recovery program is needed for gray foxes. Their stable numbers reflect the continued presence of woodland habitat across Delaware's three counties. The state wildlife animal designation has raised public awareness about the species and its role in controlling small rodent populations on farmland."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Delaware's Great Seal, first adopted in 1777, features a farmer with a hoe and a militiaman with a musket on either side of a shield. A sailing ship crowns the design. The gray fox fits in as the living wildlife counterpart—the animal that keeps the farmland healthy by controlling rodents."
      - "The gray fox joined a state symbol roster already shaped by student campaigns. Delaware has made civic participation a defining feature of how it names its official symbols. The fox is the most prominent example of that tradition and aligns with the civic identity shown on the [state flag](/states/delaware/flag/delaware-state-flag)."

    subsections:
      - subtitle: "The Blue Hen Chicken: Two Symbols of Readiness"
        text: "Delaware's state bird, the blue hen chicken, traces its origins to the Revolutionary War. Soldiers from Kent County were nicknamed 'Blue Hen's Chicks' because of their fierce, relentless fighting spirit, compared to offspring of a blue hen gamecock. The gray fox carries a parallel thread. The students who nominated it compared the fox's year-round activity to military readiness at Dover Air Force Base. Both state animals represent a willingness to stay alert and keep going, in any season or condition."
        link:
          label: "See Delaware state bird"
          url: "/states/delaware/bird/delaware-blue-hen"

      - subtitle: "The American Holly: Year-Round Presence"
        text: "Delaware's state tree, the American holly (designated 1939), is an evergreen. Its dark, thorny leaves and red berries remain on the branches through every season, including the coldest winter months. The gray fox shares this quality of year-round visibility. In a state where many animals become scarce during winter, both the holly and the fox remain a constant presence along Delaware's woodland edges."
        link:
          label: "See Delaware state tree"
          url: "/states/delaware/tree/american-holly"


      - subtitle: "The State Motto and Independence"
        text: "Delaware's motto, 'Liberty and Independence,' was added to the Great Seal in 1847. It reflects the ideals that led Delaware to become the first state to ratify the Constitution in 1787. The gray fox embodies independence in its own way. It is a solitary hunter that relies on its own speed, senses, and adaptability to survive. The students who nominated it chose an animal that thrives on its own—fitting for a symbol in the nation's First State."
        link:
          label: "See Delaware state motto"
          url: "/states/delaware/motto/liberty-and-independence"

