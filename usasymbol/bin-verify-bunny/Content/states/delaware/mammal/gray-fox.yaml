faq:
  - question: "What is Delaware's state wildlife animal?"
    answer: "Delaware's state wildlife animal is the gray fox (Urocyon cinereoargenteus), designated on June 10, 2010, when Governor Jack A. Markell signed House Bill No. 354 into law."

  - question: "Why did Delaware choose the gray fox?"
    answer: "Fourth graders at Joseph M. McVey Elementary School nominated the gray fox as part of a persuasive writing assignment. The students argued that the fox is native to Delaware, stays active year-round unlike animals that hibernate, and is the only canine in North America that regularly climbs trees. Delaware was also one of only four states without a state wildlife animal, so the designation filled an important gap."

  - question: "Can you see gray foxes in Delaware?"
    answer: "Yes. Gray foxes live across all three of Delaware's counties. They are most active at dawn and dusk and prefer woodland edges and brushy areas. Blackbird State Forest, Redden State Forest, and the forested margins of Prime Hook and Bombay Hook National Wildlife Refuges are good places to look. Some Delaware residents also spot gray foxes in suburban backyards."

  - question: "What makes the gray fox unique among canines?"
    answer: "The gray fox is the only canine in North America that regularly climbs trees. Semi-retractable claws grip rough bark, and flexible, rotating forelegs allow the fox to scramble up trunks and move along branches. It climbs to escape predators like coyotes, to reach fruit and bird nests, and to find sheltered resting spots above the ground."

  - question: "Why did students compare the gray fox to soldiers?"
    answer: "The fourth graders who nominated the gray fox noted that it does not hibernate. While many animals retreat or become inactive during winter, the gray fox stays active year-round. The students connected this to the troops at Dover Air Force Base, writing that the fox is 'always ready like our soldiers.' The General Assembly included this comparison directly in the official bill text."

  - question: "Is the gray fox endangered in Delaware?"
    answer: "No. The gray fox carries no state or federal conservation listing and maintains a stable population across Delaware. The state does not hold a hunting season for gray foxes. Existing rules allow landowners to remove foxes only when they directly threaten livestock or poultry."

  - question: "How is the gray fox different from the red fox?"
    answer: "Gray foxes are smaller and lighter than red foxes, typically weighing 7 to 15 pounds. Their coloring differs as well: gray foxes have a gray and rusty-red coat with a black stripe down the tail, while red foxes have bright orange-red fur with black legs and a white-tipped tail. The gray fox can climb trees; the red fox cannot. Red foxes are now seen more often in Delaware than gray foxes."

  - question: "What other Delaware state symbols were chosen by students?"
    answer: "Delaware has a tradition of students shaping state symbols. Second graders at Lulu M. Ross Elementary in Milford campaigned for the ladybug, which became the state insect in 1974. Students at Richardson Park Learning Center helped select the tiger swallowtail as state butterfly in 1999. The gray fox, chosen by fourth graders in 2010, continued this pattern and became the most visible example of it."

