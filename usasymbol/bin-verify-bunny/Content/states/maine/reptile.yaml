sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Maine?
    paragraphs:
      - "The wood turtle is Maine's official state reptile, designated by the Maine Legislature in 2025. Its scientific name is Glyptemys insculpta."
      - "It is a medium-sized turtle found along rivers and streams and in nearby woodlands across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Wood Turtle
    paragraphs:
      - "The wood turtle has a rough, sculpted brown shell with a pattern of ridged, pyramid-shaped sections, and its skin often has an orange or yellow tint on the neck and legs."
      - "It usually grows to about six to eight inches long and has a slightly hooked upper jaw."
      - "Unlike many turtles, it spends time both in water and on land, wandering through streamside forests and fields to feed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Maine Legislature designated the wood turtle the official state reptile in 2025, recognizing a turtle closely tied to the state's rivers and forests."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Maine Chose the Wood Turtle
    paragraphs:
      - "The wood turtle is one of Maine's most distinctive native turtles, known for the sculpted texture of its shell and its habit of moving between rivers and nearby woodlands."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Wood Turtle
    paragraphs:
      - "The wood turtle lives along clean, slow-moving rivers and streams throughout much of Maine, spending warmer months in nearby forests and fields."
    sites:
