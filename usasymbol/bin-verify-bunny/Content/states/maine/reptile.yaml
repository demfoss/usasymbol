faq:
  - question: What is Maine's state reptile?
    answer: "Maine's state reptile is the wood turtle, adopted by the Maine Legislature in 2025."
  - question: When did Maine adopt the wood turtle?
    answer: "The Maine Legislature designated the wood turtle the official state reptile in 2025."
  - question: Why did Maine choose the wood turtle?
    answer: "The wood turtle is one of Maine's most distinctive native turtles, recognized for its sculpted shell and its ties to the state's rivers and forests."
  - question: Is the wood turtle endangered?
    answer: "The wood turtle is considered a species of conservation concern in Maine and much of its range due to habitat loss."

