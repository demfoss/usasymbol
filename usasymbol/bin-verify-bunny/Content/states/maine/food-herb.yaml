sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Maine's State Herb?"
    paragraphs:
      - "Wintergreen is Maine's official state herb, designated by the Maine Legislature in 1999. It grows as a low, creeping plant across the forest floors of Maine's woodlands."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Wintergreen"
    paragraphs:
      - "Wintergreen is a small evergreen plant with shiny, oval leaves and small white flowers that turn into bright red berries in fall. Both the leaves and berries carry the plant's signature minty flavor, which comes from a natural oil once used to flavor teas, candies, and medicines. The plant stays green through Maine's winters, which is how it earned its name."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Wintergreen Became Maine's State Herb"
    paragraphs:
      - "The Maine Legislature designated wintergreen the official state herb in 1999, recognizing a plant native to the state's forests."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Maine Chose Wintergreen"
    paragraphs:
      - "Wintergreen grows naturally throughout Maine's forests and has a long history of local use for its minty leaves and berries, which Native Americans and early settlers chewed or brewed into tea. State lawmakers did not record additional reasoning beyond the plant's native status in Maine."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Wintergreen Facts"
    facts:
      - "Adopted as Maine's state herb in 1999."
      - "Its leaves and berries share the same minty flavor used in wintergreen candy and gum."
      - "The plant stays green through the winter, which is how it got its name."
      - "Wintergreen grows wild across Maine's forest floors."

