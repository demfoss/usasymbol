sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Maine?
    paragraphs:
      - "The spring peeper is Maine's official state amphibian, designated by the Maine Legislature in 2025. Its scientific name is Pseudacris crucifer."
      - "It is a tiny frog found in wetlands and forests across the state, best known for its high-pitched spring call."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Spring Peeper
    paragraphs:
      - "The spring peeper is a small, tan or brown frog, usually less than an inch and a half long, with a dark X-shaped mark on its back."
      - "Despite its tiny size, it produces a loud, high-pitched peeping call that can be heard from a long distance on spring evenings."
      - "It has small toe pads that let it climb low vegetation, though it spends much of its time on the ground near water."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Maine Legislature designated the spring peeper the official state amphibian in 2025, recognizing a frog whose call is a familiar sign of spring across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Maine Chose the Spring Peeper
    paragraphs:
      - "The spring peeper's call is one of the most recognizable sounds of the season in Maine, heard in wetlands and woodlands as the frog emerges each spring."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Spring Peeper
    paragraphs:
      - "The spring peeper lives throughout Maine, in wet woodlands, marshes, and the shallow, temporary pools where it breeds in early spring."
