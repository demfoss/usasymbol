seo_title: "Maine State Colors | Blue Green"
seo_description: "Maine state colors are Blue and Green, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Maine are **Blue** and **Green**, based on the navy field of [the Maine state flag](/states/maine/flag/maine-state-flag) adopted in 1909 and the pine forests of the Pine Tree State. No separate state-colors law exists, but blue and green are embedded in state flag, state branding, and tourism identity across the state. For Maine, the values below cover HEX, RGB, CMYK, and Pantone matching against the wider [U.S. state colors guide](/symbols/colors)."

official_colors: "Blue and Green"
official_since: "Traditional / Natural (no formal legislative designation)"
primary_use: "State flag field color, state agency branding, Pine Tree State promotional materials, state tourism identity"
known_for: "Blue representing the Atlantic Ocean coastline and the Union Blue of the state flag; green representing the eastern white pine forests that cover nearly 90 percent of Maine's land area and earned the state its nickname, The Pine Tree State"

