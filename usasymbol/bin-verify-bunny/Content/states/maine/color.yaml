timeline:
  - year: "1820"
    description: "Maine separates from Massachusetts on March 15 and joins the Union as the 23rd state; the state coat of arms adopted in June 1820 features a green pine tree and moose on the central shield, establishing green as a foundational color of Maine's official identity"
  - year: "1820"
    description: "Eastern white pine already the dominant symbol of Maine's economy, supplying timber for shipbuilding along the Kennebec, Penobscot, and Androscoggin rivers; logging and sawmill industries centered on the pine forests define the state's early economic character"
  - year: "1845"
    description: "Eastern white pine (Pinus strobus) designated official state tree of Maine by the Legislature, formally recognizing the pine — and by extension its deep green color — as the botanical symbol of the Pine Tree State"
  - year: "1901"
    description: "Maine's first official state flag adopted on March 21 under Chapter 233 of the 70th Legislature, featuring a green pine tree on a buff background with a blue North Star; for the first time both blue and green appear together as Maine's public imagery on an official state emblem"
  - year: "1909"
    description: "Current Maine state flag adopted on February 23 under Maine Revised Statutes Title 1, § 206, specifying a blue field matching the blue of the United States flag; Union Blue chosen explicitly to honor Maine's Civil War veterans, cementing navy blue as the state's primary institutional color"
  - year: "1939"
    description: "Maine merchant and marine ensign adopted on March 16, featuring a white field with a green pine tree, reinforcing the pairing of blue (sea) and green (forest) in Maine's maritime and state identity"
  - year: "2024"
    description: "Maine voters reject a November ballot measure to re-adopt an updated version of the 1901 Pine Tree Flag, affirming the 1909 blue flag design while demonstrating continued public attachment to the green pine tree as a competing symbol of state identity"

expert_quote:
  text: "Maine's blue and green are not legislated colors but landscape colors — the navy of the Atlantic and the green of the pine forest are what Maine actually looks like, which is why they endure as the state's most recognizable palette without any law requiring it."
  source: "Maine State Archives, Office of the Secretary of State, State Symbols Documentation"

faq:
  - question: "What are the state colors of Maine?"
    answer: "The traditional state colors of Maine are Blue and Green, recognized by custom and natural symbolism rather than formal legislative designation. Blue reflects the navy blue field of the state flag adopted in 1909; green reflects the pine forests that define Maine as the Pine Tree State."
  - question: "Does Maine have an official state color law?"
    answer: "No. Maine has not enacted legislation designating official state colors by statute. Blue and green are recognized as traditional colors derived from the state flag's navy blue field and the green pine tree featured on the 1901 state flag and state coat of arms."
  - question: "What is the HEX code for Maine Blue?"
    answer: "The closest standard HEX code for Maine Blue is #003F87, corresponding to Pantone PMS 281, which approximates Old Glory Blue as specified by Maine Revised Statutes Title 1, § 206 for the state flag field. This is a traditional approximation, not a legislatively mandated value."
  - question: "What is the HEX code for Maine Green?"
    answer: "The closest standard HEX code for Maine Green is #2E5D35, corresponding to Pantone PMS 357, a deep forest green representing the eastern white pine foliage depicted on the 1901 Maine state flag and the state coat of arms. This is a traditional approximation based on vexillological convention."
  - question: "Why does Maine use blue and green?"
    answer: "Blue represents the Atlantic Ocean coastline and the Union Blue of the state flag, chosen in 1909 to honor Maine's Civil War veterans. Green represents the eastern white pine forests covering nearly 90 percent of Maine's land area and the state's enduring identity as the Pine Tree State."
  - question: "What was Maine's 1901 flag and what colors did it use?"
    answer: "The 1901 Maine state flag, adopted under Chapter 233 of the 70th Legislature, featured a green pine tree at the center of a buff-colored background with a blue North Star in the upper corner. It was replaced in 1909 by the current blue flag but its green pine tree imagery remains central to Maine's public imagery."

