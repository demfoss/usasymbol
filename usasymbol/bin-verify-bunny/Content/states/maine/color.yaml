sections:
  - id: "official-designation"
    title: "Traditional Colors and Historical Basis"
    style: "default"
    paragraphs:
      - "Maine has not designated official state colors by legislative statute, distinguishing it from states such as California, which codified its colors under Government Code § 424 in 1951. Maine's blue and green are instead recognized as traditional colors derived from two primary sources: the navy blue field of the state flag adopted in 1909 under Maine Revised Statutes Title 1, § 206, and the deep green of the eastern white pine that dominated Maine's first official state flag of 1901 and remains the central emblem of the state's identity as the Pine Tree State described on the [Maine nickname page](/states/maine/nickname/the-pine-tree-state)."
      - "The absence of formal codification does not diminish the strength of these color associations in Maine's public and institutional life. State government materials, tourism branding, and promotional identity consistently use navy blue and forest green as the visual language of Maine, reflecting the two most dominant elements of the state's physical environment: the ocean to the southeast and the forest covering the interior. Maine's unofficial color tradition is rooted in geography rather than politics, making it among the most visually coherent state palettes in New England."
    subsections:
      - subtitle: "Maine Revised Statutes Title 1, § 206 and the Blue Flag Field"
        text: "Maine Revised Statutes Title 1, § 206, adopted by the Legislature of 1909, specifies that the state flag shall be blue of the same color as the blue field in the flag of the United States. This legal language ties Maine's blue directly to Old Glory Blue, standardized in heraldic practice as approximately Pantone PMS 281 (HEX #003F87). The 1909 flag replaced the shorter-lived 1901 Pine Tree Flag, which featured a buff background with a blue North Star and green pine tree, and established Union Blue as Maine's dominant institutional color for all subsequent official state applications listed in broader [state flag references](/symbols/flags). The flag's navy blue field was explicitly chosen to honor the Union veterans of the American Civil War, as newspaper accounts from the period noted that the blue was intended to represent the Union Blue carried by Maine's regiments at Gettysburg and other major engagements."
      - subtitle: "The 1901 Pine Tree Flag and the Green Tradition"
        text: "Maine's first official state flag, adopted on March 21, 1901, during the state's 70th legislative session under Chapter 233, featured a green pine tree at its center on a buff-colored background, with a blue North Star in the upper canton. The green pine tree had no standardized shade specified in the legislation, which simply called for 'a pine tree proper,' but manufacturers and contemporary accounts consistently rendered it in a deep forest green representing the color of live eastern white pine foliage. The 1901 flag established green as an integral part of Maine's public imagery alongside blue, a pairing that persists in state tourism branding and environmental communications more than a century after the flag was replaced by the current 1909 design. Though the 1901 flag failed to be re-adopted in the November 2024 statewide ballot referendum, the movement to restore it demonstrated the enduring strength of green as a symbol of Maine's identity."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Maine's blue and green speak directly to the two defining physical realities of the state: water and forest. No state in the continental United States is more shaped by these two elements than Maine, where the Atlantic coastline extends for 3,478 miles when all bays, inlets, and islands are measured, and where forests cover approximately 89 percent of the total land area, the highest forest coverage percentage of any state in the nation. Blue and green are not symbolic choices imposed by legislators but organic reflections of what any traveler sees when arriving in Maine from the south: first the deep blue of the Atlantic and then the unbroken wall of dark green forest rising beyond the coast."
    subsections:
      - subtitle: "Blue in Maine History"
        text: "Blue's association with Maine runs through both its military history and its maritime identity. The state flag's navy blue field was chosen in 1909 specifically to honor the service of Maine's Civil War regiments, who carried blue battle flags into engagements including the Battle of Gettysburg, where the 20th Maine Volunteer Infantry under Colonel Joshua Lawrence Chamberlain held Little Round Top in one of the most celebrated defensive actions of the war. Beyond its military resonance, blue represents the Atlantic Ocean that defines Maine's entire southeastern boundary, the Gulf of Maine recognized as one of the fastest-warming ocean bodies in the world, and the thousands of lakes, ponds, and rivers — Maine has more than 6,000 lakes and ponds — that cover the state's interior."
      - subtitle: "Green in Maine History"
        text: "Green's connection to Maine begins before European settlement and runs unbroken through the present day. The eastern white pine (Pinus strobus), designated the official state tree by the Maine Legislature in 1945, was so valuable to the British Royal Navy as a source of ship masts that the Crown placed a Broad Arrow mark on the finest specimens across New England, reserving them for royal use. Colonists' resentment of this policy contributed to tensions that preceded the American Revolution. The Pine Tree Riot of 1772 in Weare, New Hampshire, in which colonists attacked royal officials enforcing the Mast Tree Policy, is considered an early act of American defiance. Maine's forests supplied timber for shipbuilding throughout the 19th century, and the state's lumber industry shaped its economy and culture for generations. Today, Maine's 17.7 million acres of forest remain the foundation of a multi-billion dollar forest products industry and the state's defining landscape."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Maine's traditional blue and green appear across the state's most prominent symbols even in the absence of formal color codification. The state flag presents navy blue as its dominant field color, surrounding the state coat of arms, which itself incorporates a green pine tree on the central shield above a moose resting in a forest scene. The state seal, adopted in June 1820 and refined over subsequent decades, features the same pine tree and moose composition that anchors the coat of arms, with green representing the natural landscape in the seal's visual narrative and values echoed in [Maine's state motto](/states/maine/motto/dirigo). Maine's merchant and marine ensign, adopted on March 16, 1939, features a white field with a green pine tree, directly echoing the 1901 flag and reinforcing green's persistent role in Maine's maritime and institutional identity. State tourism marketing, particularly materials produced by the Maine Office of Tourism under the longstanding 'Maine: The Way Life Should Be' campaign, consistently employs navy blue and forest green as primary brand colors, reflecting the ocean and forest environment that draws millions of visitors annually."

