type: State Coat of Arms
state: Maine
name: Maine State Coat of Arms
adopted_year: 1820
is_official: true
meaning: "The Maine coat of arms places the two economies that built the state side by side: a farmer resting on a scythe on one side and a sailor resting on an anchor on the other. The shield between them shows a pine tree, which Col. Isaac Reed described in 1820 as 'the staple of the commerce of Maine and the pride of her forests,' with a moose resting at its base. The North Star above and the motto Dirigo connect the design to Maine's position as the northernmost state in the Union at the time it was adopted."
meaning_title: Meaning of the Maine Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-20'
date_modified: '2026-05-20'
seo_title: 'Maine Coat of Arms: Meaning, Symbols and History'
seo_description: "The Maine coat of arms was adopted on June 9, 1820 and shows a pine tree and moose on a shield, flanked by a farmer and a sailor, with the motto Dirigo."
hero_image: /images/coats-of-arms/maine/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Maine, adopted June 9, 1820, showing a pine tree and moose on a shield supported by a farmer and a sailor, with the North Star above and the motto Dirigo
hero_image_caption: The Maine Coat of Arms, adopted June 9, 1820. A pine tree rises from a white shield with a moose at its base. A farmer stands left and a sailor stands right. The North Star crowns the design and the motto Dirigo appears on a ribbon below.
intro_text: "Maine adopted its coat of arms on June 9, 1820, just three months after becoming a state. The design shows a pine tree and a moose on a shield, a farmer on one side and a sailor on the other, the North Star as a crest, and the motto Dirigo, Latin for I lead. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Maine Coat of Arms?
  paragraphs:
  - "In heraldic terms, the shield at the center of the coat of arms is blazoned argent, meaning its background is silver or white. The two figures flanking the shield stand at roughly the same height as it, giving the design a symmetrical, balanced look. A blue background surrounds the full design wherever it appears on the state flag."
  - "The coat of arms is also Maine's state seal. It appears on official state documents, government buildings, and state agency materials across Maine. Before 1919, different engravers produced noticeably different versions of the design. The Legislature standardized it that year to end the variation."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Maine Coat of Arms
  paragraphs:
  - "Maine became the twenty-third state on March 15, 1820. The new Legislature needed a state seal quickly, and a committee headed by the first Senate President, William Moody, took up the task. On June 9, 1820, the Legislature formally adopted the coat of arms along with the state seal."
  - "Benjamin Vaughan of Hallowell proposed the emblems to the Legislature. Vaughan was an English-born statesman who had monitored the peace negotiations ending the American Revolution in Paris and later settled in Maine. He described what should appear on the seal: a farmer with a scythe, a sailor with an anchor, a pine tree, and a moose. Vaughan originally preferred a motto referencing the aurora borealis, but the Legislature chose Dirigo instead."
  - "Col. Isaac G. Reed of Waldoboro wrote the official description and explanation of the design. The original sketch is traditionally attributed to Bertha Smouse, Reed's step-daughter, though no surviving documentation confirms the authorship of the drawing with certainty."
  - "Throughout the 1800s, different engravers produced different versions of the seal. The moose appeared more like a deer in some; proportions and poses varied across versions. In 1919, the Legislature ordered that the design should no longer vary, and the standardized form used today was fixed at that point."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Maine Coat of Arms
  paragraphs:
  - "Every element on the Maine coat of arms was chosen in 1820 to represent the state's landscape, economy, and role in the new nation."
  elements:
  - id: shield
    name: The Pine Tree and Moose
    image: /images/coats-of-arms/maine/elements/shield.webp
    paragraphs:
    - "The center of the coat of arms is a white shield with a tall pine tree rising from a field. A moose rests at the base of the tree. The official 1820 description called the animal a 'moose deer,' using the common name of the time for what is now called simply a moose."
    - "Col. Isaac Reed described the pine tree as 'the staple of the commerce of Maine and the pride of her forests.' Maine's Eastern white pine supplied masts for British and American naval ships for generations, and the tree gave Maine its unofficial nickname: the Pine Tree State."
  - id: farmer
    name: The Husbandman
    image: /images/coats-of-arms/maine/elements/farmer.webp
    paragraphs:
    - "On the left side of the shield stands a farmer, called a husbandman in the heraldic description. He rests on a scythe, the tool used to harvest grain. The figure represents Maine's agricultural communities and the settlers who cleared and farmed the state's land."
  - id: sailor
    name: The Seaman
    image: /images/coats-of-arms/maine/elements/sailor.webp
    paragraphs:
    - "On the right side of the shield stands a sailor, resting on an anchor. He represents Maine's long coastline, its fishing industry, and its history of shipbuilding. Maine's harbors were among the most active on the Atlantic coast in the early nineteenth century."
  - id: star
    name: The North Star and Dirigo
    image: /images/coats-of-arms/maine/elements/star.webp
    paragraphs:
    - "Above the shield, a single star serves as the crest. The official 1820 resolution explained the choice: the North Star had long been the mariner's guide, and Maine, as the northernmost state at the time of adoption, was meant to play a similar guiding role within the Union."
    - "The motto Dirigo appears on a ribbon between the star and the shield. It is Latin for I lead or I direct. The resolution linked the motto to the same idea: that Maine would guide its citizens as the North Star guides sailors."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Maine Coat of Arms
  paragraphs:
  - "The coat of arms describes Maine through two kinds of work. The farmer on the left and the sailor on the right are not decorative additions: they were the two economic groups that built the state in 1820. Placing them as equals on either side of the shield gave both groups equal standing in Maine's official identity."
  - "The shield itself shows the natural resources that made those two economies possible. The pine tree supplied timber and ship masts. The moose and the landscape around it represent the forests and wildlife that covered most of Maine's land when the state was founded."
  - "The North Star and the motto Dirigo work together as a statement of purpose. Maine was the northernmost state in 1820. By choosing the North Star as the guiding image, the Legislature said that Maine intended to lead, not follow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Maine Coat of Arms Facts
  facts:
  - "Adopted: June 9, 1820, by the Maine Legislature, three months after Maine became a state on March 15, 1820."
  - "Benjamin Vaughan of Hallowell proposed the symbols to the Legislature. He was an English-born statesman who had participated in the peace negotiations ending the American Revolution and later settled in Maine."
  - "Vaughan originally wanted a motto referencing the aurora borealis. The Legislature chose Dirigo instead, meaning I lead in Latin."
  - "Col. Isaac G. Reed of Waldoboro wrote the official description of the design in 1820. He called the pine tree 'the staple of the commerce of Maine and the pride of her forests.'"
  - "The design varied considerably from one engraver to the next throughout the 1800s. In 1919, the Legislature standardized the coat of arms to stop further variation."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Maine Coat of Arms
  paragraphs:
  - "The Maine coat of arms kept its core elements from 1820 onward, but the visual execution changed many times. Different engravers interpreted the moose, the pine tree, and the two figures differently. In some versions, the moose resembled a deer. Proportions and clothing details on the farmer and sailor also varied."
  - "In 1919, the Legislature ruled that the design should no longer vary. The standardized version adopted that year is the one used on all official Maine documents and on the state flag today."
