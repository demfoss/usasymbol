seo:
  title: "Most Common Last Names in Maine"
  description: "Maine's most common last names include Smith, Brown, Johnson, Pelletier, Michaud, Libby, Ouellette, and Roy."

page:
  h1: "Most Common Last Names in Maine"
  intro: "Smith, Brown, and Johnson are the most common last names in Maine in the 2026 surname data, with Smith first at 10,822 bearers. Maine's top 20 departs from the national list when French-Canadian names such as Pelletier, Michaud, Ouellette, and Roy enter the ranking, joined by Libby, a colonial Scarborough surname that remains unusually concentrated in the state."
  heritage_title: "Yankee Coast, French Border, and Mill-Town Migration"
  heritage_body: "Maine was part of Massachusetts until statehood in 1820, so many older English surnames trace through coastal towns, shipbuilding ports, and inland farm settlements tied to southern New England. The Canadian boundary, fixed in 1842, gave northern Maine a lasting French and Acadian name layer in the St. John Valley and Madawaska country. Lewiston, Biddeford, Waterville, and other mill towns then drew French-Canadian families in large numbers from the 1870s into the early 1900s."
  fun_fact: "Libby ranks 14th in Maine but far lower nationally because the American Libby family traces its organized genealogy to John Libby, an English immigrant who came to New England around 1636 and whose descendants still hold reunions near his Scarborough homestead."

surnames:
  - rank: 1
    name: Smith
    count: 10822
    ratio: 126
    origin: english
    type: Occupational
    meaning: "From Old English 'smith' or 'smid', a metalworker. Smith leads both Maine and the United States, but in Maine it fits the older English coastal settlement pattern rather than the post-emancipation surname story seen across much of the South."

  - rank: 2
    name: Brown
    count: 7567
    ratio: 180
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', referring to brown hair, complexion, or clothing. Brown ranks second in Maine, higher than Johnson and Williams, which gives the state a more colonial New England surname profile than the national top five."

  - rank: 3
    name: Johnson
    count: 5146
    ratio: 264
    origin: english
    type: Patronymic
    meaning: "Son of John, from the Hebrew name Yohanan, meaning God is gracious. Johnson is common across Maine, but it ranks below Brown here, a clue that Maine's top tier is shaped more by English and northern European settlement than by the broader national order."

  - rank: 4
    name: Davis
    count: 5049
    ratio: 269
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', meaning beloved. Davis came into Maine through English and Welsh naming traditions already established in colonial New England before Maine separated from Massachusetts in 1820."

  - rank: 5
    name: Clark
    count: 4018
    ratio: 338
    origin: english
    type: Occupational
    meaning: "From Latin 'clericus', a clerk, scholar, or churchman. Clark's high rank suits a state whose early English towns kept dense town, church, probate, and maritime records from the colonial period onward."

  - rank: 6
    name: Martin
    count: 3922
    ratio: 347
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', meaning of Mars, and popular in both English and French naming traditions. In Maine, Martin works as a bridge surname: it appears among older English-speaking families and among French-Canadian families connected to Quebec and northern New England mill towns."

  - rank: 7
    name: White
    count: 3765
    ratio: 361
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually a nickname for fair hair or pale complexion. White belongs to Maine's older English surname layer, the same layer visible in coastal towns that were settled before Maine became a separate state."

  - rank: 8
    name: Williams
    count: 3670
    ratio: 370
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic Willahelm, often interpreted as will and helmet or protection. Williams ranks only eighth in Maine, far below its national rank, because Maine's French-Canadian and colonial New England names push several different surnames upward."

  - rank: 9
    name: Pelletier
    count: 3383
    ratio: 402
    origin: french
    type: Occupational
    meaning: "A French occupational name for a furrier or fur trader, from Old French 'pelletier'. Pelletier reaches Maine's top 10 because French-Canadian and Acadian families remained concentrated in the St. John Valley, Lewiston-Auburn, and other mill communities tied to Quebec migration."

  - rank: 10
    name: Allen
    count: 3356
    ratio: 405
    origin: english
    type: Patronymic
    meaning: "From the given name Alan, probably Celtic in origin and often glossed as little rock or handsome. Allen appears widely in Maine's English-speaking counties and reflects the same New England family networks that connected Maine to Massachusetts before statehood."

  - rank: 11
    name: Jones
    count: 3282
    ratio: 414
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John, from the given name Ioan. Jones is nationally a top-five surname, but in Maine it falls just outside the top 10 because Brown, Clark, Martin, Pelletier, and Allen all rank ahead of it."

  - rank: 12
    name: Michaud
    count: 3276
    ratio: 415
    origin: french
    type: Patronymic
    meaning: "A French surname from Michel, the French form of Michael, meaning who is like God. Michaud is one of Maine's clearest French-Canadian signatures, listed among the pioneer family names of the Madawaska Territory and still common in Aroostook County families."

  - rank: 13
    name: Anderson
    count: 3179
    ratio: 428
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew or Anders, from Greek 'Andreas', meaning manly. Anderson fits Maine's Scots-Irish and Scottish layer, especially in inland communities settled through New England, Nova Scotia, and Ulster migration routes."

  - rank: 14
    name: Libby
    count: 3119
    ratio: 436
    origin: english
    type: Patronymic
    meaning: "A likely English diminutive of Elizabeth or a related medieval personal name that became a family surname. In Maine, Libby is not generic: it is tied to descendants of John Libby, who came from England around 1636 and whose family identity remains anchored near Scarborough."

  - rank: 15
    name: Hall
    count: 3055
    ratio: 445
    origin: english
    type: Habitational
    meaning: "From Old English 'heall', describing someone who lived or worked at a hall or manor house. Hall is part of Maine's older English surname stock and remains common across the same broad New England corridor as Brown, Clark, and Allen."

  - rank: 16
    name: Thompson
    count: 3022
    ratio: 450
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas, with the inserted 'p' fixed by medieval spelling habits. Thompson appears in Lewiston's early civic records and in older English-speaking settlement zones before the French-Canadian mill-town surge."

  - rank: 17
    name: Young
    count: 2885
    ratio: 471
    origin: english
    type: Descriptive
    meaning: "From Old English 'geong', used to distinguish a younger bearer from an older relative with the same given name. Young fits Maine's rural and coastal English surname pattern, where repeated family names often needed age-based nicknames."

  - rank: 18
    name: Ouellette
    count: 2834
    ratio: 480
    origin: french
    type: Patronymic
    meaning: "An American and Canadian French form of Ouellet, with the final consonant sounded in local usage. Ouellette is one of the French names that makes Maine's top 20 look closer to Quebec and New Brunswick than to most of the United States."

  - rank: 19
    name: Stevens
    count: 2824
    ratio: 481
    origin: english
    type: Patronymic
    meaning: "Son of Stephen, from Greek 'Stephanos', meaning crown or wreath. Stevens is common in New England records, where biblical given names such as Stephen, John, and David generated many early family surnames."

  - rank: 20
    name: Roy
    count: 2777
    ratio: 489
    origin: french
    type: Descriptive
    meaning: "From Old French 'roy' or modern French 'roi', meaning king, often used as a nickname rather than a claim of royal descent. Roy's place in Maine's top 20 reflects the same French-Canadian migration that elevated Pelletier, Michaud, and Ouellette."

