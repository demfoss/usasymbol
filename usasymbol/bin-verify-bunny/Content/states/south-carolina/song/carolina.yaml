faq:
  - question: What is South Carolina's state song?
    answer: "South Carolina's official state song is \"Carolina,\" adopted in 1911."
  - question: Who wrote South Carolina's state song?
    answer: "Henry Timrod wrote the original words, and Anne Curtis Burgess composed the music decades later."
  - question: When did South Carolina adopt "Carolina" as its state song?
    answer: "The General Assembly adopted the song in 1911, five years after Burgess's musical setting was published."
  - question: Does South Carolina have more than one state song?
    answer: "Yes. South Carolina also recognizes \"South Carolina on My Mind\" as a second official state song, adopted in 1984."

