sections:
  - id: overview
    icon: fa-solid fa-music
    title: South Carolina State Song
    paragraphs:
      - "\"Carolina\" is South Carolina's oldest official state song, adopted in 1911. Its words come from a poem by Charleston writer Henry Timrod, and its melody was composed decades later by music teacher Anne Curtis Burgess."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Carolina\" Explained"
    paragraphs:
      - "The song calls on South Carolinians with urgent, patriotic language, urging the state to stand firm in the face of hardship. It carries the weight of a wartime poem rather than a lighthearted tribute, reflecting the circumstances under which Timrod originally wrote it."
      - "Henry Timrod, sometimes called the poet laureate of the Confederacy, wrote the original poem during the Civil War era. Anne Curtis Burgess, a graduate of Converse College who later taught music at Winthrop College, set Timrod's words to music, and her setting premiered publicly in 1905."
      - "The South Carolina Daughters of the American Revolution championed the song after Burgess's setting spread, leading to its formal adoption six years later."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Carolina" Represents South Carolina
    paragraphs:
      - "Lawmakers chose \"Carolina\" because Timrod was already regarded as one of the state's most important poets, and his words carried literary weight beyond a typical occasional verse. Pairing his poem with an original melody by a South Carolina composer kept the song entirely homegrown."
      - "Organized support from the Daughters of the American Revolution gave the adoption effort momentum in the state legislature. Their advocacy, combined with the song's growing popularity after its 1905 premiere, secured its place as the official state song in 1911."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Carolina\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Carolina" Became South Carolina's State Song
    paragraphs:
      - "Anne Curtis Burgess's musical setting of Timrod's poem debuted in 1905 and was published the following year. The South Carolina Daughters of the American Revolution petitioned the General Assembly to adopt it, and lawmakers made \"Carolina\" the official state song in 1911, decades after Timrod first wrote the words."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of South Carolina

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Carolina\" Facts"
    facts:
      - "South Carolina adopted \"Carolina\" as its official state song in 1911."
      - "The words come from a poem by Charleston writer Henry Timrod, sometimes called the poet laureate of the Confederacy."
      - "Composer Anne Curtis Burgess set the poem to music, with her setting first performed publicly in 1905."
      - "The South Carolina Daughters of the American Revolution petitioned the legislature to adopt the song."
      - "South Carolina later added a second official state song, \"South Carolina on My Mind,\" in 1984."

