faq:
  - question: What is South Carolina's state dance?
    answer: "South Carolina recognizes two official dances: the shag, adopted in 1984 as the state dance, and square dance, adopted in 1994 as the state American folk dance."
  - question: When did South Carolina adopt square dance as its state dance?
    answer: "South Carolina adopted square dance in 1994."
  - question: Why did South Carolina choose square dance?
    answer: "South Carolina's 1994 adoption followed a national campaign by square-dance callers' associations, and lawmakers created a separate folk-dance title rather than replacing the shag's earlier designation."
  - question: Why does South Carolina have two official state dances?
    answer: "South Carolina named the shag its state dance in 1984 and later added square dance as a separate state American folk dance in 1994, so the two titles cover different traditions."

