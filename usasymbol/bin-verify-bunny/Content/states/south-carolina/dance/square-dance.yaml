sections:
  - id: overview
    icon: fa-solid fa-music
    title: South Carolina State Dance
    paragraphs:
      - "South Carolina named square dance its official state American folk dance in 1994. The designation exists alongside the shag, which the state had already recognized as its official state dance in 1984, so South Carolina carries two separate official dance titles."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the center of the set. A caller directs the group through a changing sequence of figures, so dancers respond to spoken calls rather than a fixed routine."
      - "String-band music built around fiddle, guitar, and banjo drives the tempo. Couples circle, cross, and exchange places before returning to their original spot in the square."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Arrange four couples in a square, each pair facing the center with partners side by side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the music begins."
      - title: "Circle Left with the Set"
        description: "Join hands with the full square and step together in a circle to the left."
      - title: "Allemande Left with Your Corner"
        description: "Turn and take your corner's left hand, walking a full turn before releasing."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the set to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents South Carolina
    paragraphs:
      - "Square-dance callers' associations and dance organizations ran a national campaign through the 1970s and 1990s urging states to name square dance an official folk dance. South Carolina's 1994 adoption followed that same wave."
      - "Because the state had already claimed the shag as its official dance in 1984, lawmakers named square dance under a separate folk-dance designation rather than replacing the earlier choice. The two titles let South Carolina recognize both a homegrown beach tradition and a national folk dance."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became the State Dance
    paragraphs:
      - "The South Carolina General Assembly designated square dance the state's official American folk dance in 1994, a separate title from the shag, which lawmakers had already named the state's official dance in 1984."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "South Carolina adopted square dance as its official state American folk dance in 1994."
      - "South Carolina separately recognizes the shag as its official state dance, adopted in 1984."
      - "South Carolina's square-dance adoption followed a national campaign by callers' associations urging states to name it an official folk dance."
      - "The dance is led by a caller and danced in sets of four couples to string-band music."

