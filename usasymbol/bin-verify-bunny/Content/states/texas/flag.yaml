type: State Flag
state: Texas
name: Texas State Flag
adopted_year: 1839
standardized_year: 2001
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-02"
date_modified: "2026-05-01"

seo_title: "Texas State Flag | Lone Star History & Meaning"
seo_description: "Texas's Lone Star flag first flew for the Republic in 1839 and became one of the world's best-known subnational flags."

intro_text: "In 1839, Texas adopted a flag that features a single white star on a blue field. Two horizontal stripes complete the design. The flag first served the Republic of Texas before becoming the state flag in 1845, and it remains one of the best-known designs in the [U.S. state flags collection](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Texas State Flag Is Designed"
    paragraphs:
      - "The Texas state flag is the official flag of the state of Texas. A vertical blue stripe covers one-third of the flag on the left side. A white horizontal stripe fills the upper right section. A red horizontal stripe runs along the bottom."
      - "A single white star sits centered in the blue field. Texans call this design the Lone Star Flag. The flag flies at state offices, schools, and public venues and directly reflects [the Lone Star State nickname](/states/texas/nickname/the-lone-star-state)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Texas Flag Communicates"
    paragraphs:
      - "The Texas state flag meaning stems from the republic period when Texas governed itself as an independent nation. The design reflects Texas identity as a sovereign state before joining the United States."
      - "The lone star represents unity among Texans. It stands for independence and self-determination. The star appeared on earlier Texas revolutionary flags during the fight against Mexican rule."
      - "Blue symbolizes loyalty. White stands for purity. Red represents bravery. These meanings were assigned by the Texas Flag Code to explain the color choices on the banner and match [Texas state colors](/states/texas/color/texas-official-state-colors-blue-white-and-red)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Texas Flag History and Adoption"
    paragraphs:
      - "Texas adopted the Lone Star Flag on January 25, 1839. Senator William H. Wharton introduced the legislation in December 1838. The Congress of the Republic of Texas approved the design weeks later. Artist Peter Krag drew the official rendering for ten dollars."
      - "The flag served as the national banner of the Republic of Texas until 1845. Texas became the 28th U.S. state on December 29, 1845. The national flag transitioned to become the state flag at that moment."
      - "Texas seceded from the United States in 1861 and joined the Confederate States of America. The state remained part of the Confederacy until 1865. During this period, Confederate national flags flew alongside the Texas state flag. Texas rejoined the Union after the Civil War ended."
      - "From 1879 to 1933, no official state flag existed on paper. The legislature had repealed old statutes without renewing flag provisions. Texans continued flying the Lone Star Flag anyway. The state formalized the flag again in 1933. Color specifications were added in 2001 using Pantone numbers, reinforcing civic language later mirrored on [Texas's motto page](/states/texas/motto/friendship)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Texas Flag"
    versions:
      - name: "Republic of Fredonia Flag"
        years: "1826–1827"
        image: "versions/fredonia-1826.webp"
        description: "Red and white horizontal stripes flown during a brief independence movement near Nacogdoches."

      - name: "Burnet Flag"
        years: "1836–1839"
        image: "versions/burnet-1836.webp"
        description: "Blue background with a large golden star, adopted as the first official flag of the Republic of Texas."

      - name: "Lone Star Flag (Republic Period)"
        years: "1839–1845"
        image: "versions/republic-1839.webp"
        description: "Identical design to the modern flag but colors were not standardized and appeared lighter."

      - name: "Modern State Flag"
        years: "1865–present"
        image: "versions/modern-1865.webp"
        description: "Official state flag after rejoining the Union, with standardized Pantone colors added in 2001."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Texas Flag"
    symbols:
      - id: star
        name: "Texas State Flag Star"
        image: "symbols/star.svg"
        paragraphs:
          - "A single white star dominates the blue field on the Texas flag. Texans call this the lone star. The star measures three-fourths the width of the blue stripe."
          - "The lone star existed as a Texas symbol before the flag was created. It appeared on revolutionary banners during the Texas fight for independence from Mexico in 1836. The symbol represented Texan solidarity and the drive for self-rule."

      - id: blue-field
        name: "Texas State Flag Blue Field"
        image: "symbols/blue-field.svg"
        paragraphs:
          - "The vertical blue stripe covers exactly one-third of the flag's length. It runs from top to bottom on the left side. The star sits centered within this blue section."
          - "Blue was chosen to represent loyalty according to the Texas Flag Code. The shade was officially defined in 2001 as Pantone 281."

      - id: stripes
        name: "Texas State Flag Stripes"
        image: "symbols/stripes.svg"
        paragraphs:
          - "Two equal horizontal stripes fill the right two-thirds of the flag. The white stripe sits on top. The red stripe runs along the bottom edge."
          - "These stripes trace back to earlier Texas flags including the Republic of Fredonia design from 1826. Red and white together appeared on multiple revolutionary banners before being incorporated into the final flag design."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Texas State Flag Colors"
    paragraphs:
      - "The Texas state flag uses three colors. Red and blue match the colors used in the United States flag. White appears in both the star and the horizontal stripe, and the design is widely used in border-region identity across [States That Border Texas](/states/texas/borders)."
    colors:
      - name: "Red"
        hex: "#BF0A30"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Blue"
        hex: "#00205B"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Texas State Flag Facts"
    facts:
      - "Texas adopted its state flag on January 25, 1839"
      - "The flag originally served the Republic of Texas as a national banner"
      - "Artist Peter Krag was paid ten dollars for the official rendering"
      - "Colors were standardized in 2001 using Pantone 193 and 281"
      - "The flag designer's identity remains unknown"
      - "Texas had no official flag from 1879 to 1933 due to a legislative oversight"

faq:
  - question: "What is the official state flag of Texas?"
    answer: "The state flag of Texas is the official banner of Texas, featuring a blue vertical stripe with a white star, a white horizontal stripe, and a red horizontal stripe."

  - question: "What meaning is attached to Texas' flag?"
    answer: "The Texas state flag represents the state's history as an independent republic. The lone star symbolizes unity and independence."

  - question: "When was the present Texas flag approved in law?"
    answer: "The Texas state flag was adopted on January 25, 1839, as the national flag of the Republic of Texas. It became the state flag when Texas joined the United States in 1845."

  - question: "Does Texas' flag have an official name?"
    answer: "The Texas state flag has one white star, which is why it is called the Lone Star Flag."

  - question: "How do historians explain the symbolism of Texas' flag?"
    answer: "Blue represents loyalty, white stands for purity, and red symbolizes bravery according to the Texas Flag Code."

