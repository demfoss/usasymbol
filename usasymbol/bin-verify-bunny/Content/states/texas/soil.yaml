- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Houston Black Soil
  paragraphs:
  - "Cotton defined the Blackland Prairie for a century. From the 1870s through the 1950s, Houston Black soil counties produced more cotton per acre than nearly any other region in Texas, and central Texas was the economic engine of the state's agricultural economy. The deep, nearly neutral clay held moisture through dry spells, its calcium-rich chemistry suited cotton's needs, and the flat terrain enabled the mechanical harvesting that made large-scale production possible."
  - "Grain sorghum and corn are now the dominant row crops on Houston Black soil. Winter wheat and oats are also grown in rotation across the northern Blackland Prairie. Where irrigation water is available from rivers and reservoirs, cotton production continues in Bell, Falls, and McLennan counties."
  - "Improved pasture grasses — particularly coastal Bermudagrass and kleingrass — cover large sections of Houston Black farmland converted from row crops. The near-neutral pH and high clay content support dense grass growth without heavy nitrogen inputs. Beef cattle ranching on Blackland Prairie pastures is a major land use across the central corridor."
  - "Where Houston Black soil is left to revegetate, the native plant community is tallgrass prairie — big bluestem, little bluestem, indiangrass, and switchgrass — with scattered live oak mottes on the drier ridges. Less than one percent of the original Blackland Prairie tallgrass remains undisturbed today, making it one of the most converted native ecosystems in North America."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Houston Black Soil Facts
  facts:
  - "Houston Black is classified as a fine, smectitic, thermic Udic Haplusterts — a Vertisol dominated by smectite clay with a udic-ustic moisture regime. The smectite mineral is montmorillonite, which absorbs water molecules between its crystal layers, causing the dramatic shrink-swell behavior that defines Vertisols worldwide."
  - "The cracks that open in Houston Black during dry summers are not just surface features. Individual cracks can reach one inch wide and three feet deep, and the total crack volume across a field creates measurable storage capacity — rainfall disappears rapidly into open cracks at the start of a drought-breaking storm before the clay has time to swell and close them."
  - "Slickensides — the polished, grooved shear planes visible in Houston Black's subsoil — form where large clay masses slide against each other during repeated shrink-swell cycles. Running your hand along a slickenside face feels like polished stone. They are diagnostic of Vertisols and one of the most striking physical features in any soil profile."
  - "The Blackland Prairie covers roughly 12 million acres of Texas, making it one of the largest Vertisol regions in the United States. The corridor sits on Cretaceous marine formations — Taylor Marl, Austin Chalk, and Eagle Ford Shale — deposited when a shallow inland sea called the Western Interior Seaway covered central North America roughly 70 to 100 million years ago."
  - "Gilgai microrelief — a gently wavy surface of low mounds and shallow depressions spaced six to thirty feet apart — is a signature landscape feature of undisturbed Houston Black soil. The mounds and swales form because vertic churning is uneven across the surface. Gilgai is an Australian Aboriginal word adopted by soil scientists because Vertisols are especially prominent in Australia."

