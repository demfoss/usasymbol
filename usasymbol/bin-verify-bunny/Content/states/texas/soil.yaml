seo_title: "Texas State Soil | Houston Black Series"
seo_description: "The Texas state soil is the Houston Black series. It covers the Blackland Prairie, growing cotton, sorghum, and wheat on deep black cracking clay."
hero_image: /images/soils/texas/texas-state-soil-hero.webp
