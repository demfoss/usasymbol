    texture: clay
    note: slickensides intensify; peak shrink-swell activity zone
  - horizon: Bkss
    name: Calcic-slickenside
    depth_in: "62–76"
    color_hex: "#707868"
    color_name: olive gray
    texture: clay
    note: calcium carbonate nodules; lime from parent chalk
  - horizon: Ck
