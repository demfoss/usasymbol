faq:
- question: What is Texas's state soil?
  answer: "Texas's state soil is the Houston Black series, a deep, nearly black Vertisol that covers the Blackland Prairie of central Texas. It formed from Cretaceous chalk and marl and is defined by its high smectite clay content, which causes the soil to crack wide open in drought and swell shut in rain."
- question: Why is it called Houston Black soil?
  answer: "The Houston Black series is named after Houston, Texas, where USDA soil scientists first formally described the dark clay soils during early federal soil surveys. The word 'Black' describes the soil's characteristic near-black color, one of the darkest surface horizons of any soil in the United States."
- question: What color is Houston Black soil?
  answer: "The surface and upper subsoil are nearly black — one of the darkest soil colors measured on the Munsell color scale. The color fades to very dark gray and dark gray with depth as organic matter decreases. The deepest horizon, the Cretaceous chalk and marl parent material, is pale yellow to white — a dramatic contrast to the black soil above."
- question: Where is Houston Black soil found in Texas?
  answer: "Houston Black soil covers the Blackland Prairie, a 300-mile corridor from the Red River in north Texas to the San Antonio area. It is most extensive in Ellis, Hill, McLennan, Falls, Bell, and Williamson counties in the central Blackland Prairie, with major areas in the Dallas–Fort Worth counties to the north."
- question: What grows in Houston Black soil?
  answer: "Grain sorghum, corn, winter wheat, and cotton are the main crops. Coastal Bermudagrass and kleingrass cover large areas as beef cattle pasture. The native plant community is Blackland tallgrass prairie — big bluestem, indiangrass, and switchgrass — with live oak mottes on drier ridges."
- question: Why does Houston Black soil crack?
  answer: "Houston Black cracks because its dominant clay mineral — montmorillonite — absorbs water molecules between its crystal layers when wet, causing the clay to swell. When the soil dries, the water leaves and the clay shrinks, pulling apart into the wedge-shaped blocks and deep cracks visible across the Blackland Prairie in summer. This cycle repeats every year."
- question: What are slickensides in Houston Black soil?
  answer: "Slickensides are polished, striated shear planes that form in the subsoil where large masses of clay slide against each other during repeated shrink-swell cycles. They feel like polished stone when touched. Slickensides are a diagnostic feature of Vertisols and are clearly visible in any deep profile pit dug into Houston Black soil."

