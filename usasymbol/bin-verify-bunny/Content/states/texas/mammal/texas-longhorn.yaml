faq:
  - question: "What is Texas's state large mammal?"
    answer: "Texas's state large mammal is the Texas longhorn (Bos taurus), designated in 1995. The longhorn is a cattle breed that developed in Texas from Spanish colonial stock and became famous during the cattle drive era from 1866 to 1890."
  
  - question: "When was the Texas longhorn designated as the state mammal?"
    answer: "The Texas longhorn became Texas's official state large mammal in 1995 when the 74th Legislature passed House Concurrent Resolution No. 17, sponsored by Representative Betty Denton. The same legislative session designated the nine-banded armadillo as the official state small mammal, creating complementary symbols."
  
  - question: "Why did Texas choose the longhorn as a state symbol?"
    answer: "Texas chose the longhorn because the breed represents the state's ranching heritage, frontier independence, and the cattle drive era that rebuilt Texas's economy after the Civil War. The longhorn descended from Spanish cattle and survived centuries through natural selection in harsh Texas conditions, symbolizing self-reliance and toughness. The breed appears on the Texas state seal since 1845, and no other state has such deep historical, economic, and cultural connections to a specific cattle breed."
  
  - question: "Is the Texas longhorn on Texas's state seal?"
    answer: "Yes, the Texas longhorn appears on the Great Seal of Texas, adopted in its current form in 1845 when Texas joined the United States. The seal features a five-pointed Lone Star surrounded by oak and olive branches with a longhorn steer prominently displayed, recognizing the cattle industry's importance to Texas's economy from statehood onward."
  
  - question: "Were Texas longhorns almost extinct?"
    answer: "Yes, Texas longhorns nearly went extinct in the 1920s when ranchers replaced them with breeds that gained weight faster for modern markets. By 1927, perhaps fewer than 100 purebred longhorns survived. The federal government intervened by establishing a preservation herd at Wichita Mountains Wildlife Refuge in Oklahoma using remnant Texas cattle. Texas followed by creating its own state herd at Fort Griffin State Historic Site in 1976. Through preservation breeding programs, the population recovered to tens of thousands of registered longhorns today."
  
  - question: "How long are Texas longhorn horns?"
    answer: "Texas longhorn horns typically spread 5-7 feet from tip to tip, with exceptional individuals exceeding 10 feet of total horn measurement. The world record for horn spread is over 10 feet. Cows generally grow longer, thinner horns while bulls develop heavier, thicker horns. Horn size varies based on genetics, nutrition, and age, with horns continuing to grow throughout the animal's life."
  
  - question: "What role did longhorns play in Texas history?"
    answer: "Texas longhorns rebuilt Texas's economy after the Civil War through the great cattle drives from 1866 to 1890. Texas held an estimated 5 million longhorns worth little locally but valuable in northern markets. Cowboys drove approximately 10 million longhorns north along trails to Kansas, Nebraska, and Wyoming railheads where they could be shipped east. This generated wealth that transformed Texas from a defeated Confederate state into a prosperous ranching empire and created the cowboy culture that defines Texas identity."
  
  - question: "Where can I see Texas longhorns?"
    answer: "You can see Texas longhorns at several public locations. The official Texas State Longhorn Herd resides at Fort Griffin State Historic Site near Albany with approximately 40-50 head. A small herd grazes on the Texas State Capitol grounds in Austin, visible to visitors year-round. The Fort Worth Stockyards Historic District features daily longhorn cattle drives twice daily through historic streets. Wichita Mountains Wildlife Refuge in Oklahoma maintains a historically significant federal preservation herd."
  
  - question: "Are Texas longhorns good for meat production?"
    answer: "Texas longhorns produce lean beef with less fat than conventional cattle breeds, appealing to consumers seeking naturally raised, grass-fed meat. However, longhorns grow more slowly and produce less total beef per animal than modern commercial breeds like Angus or Hereford, making them less profitable for conventional feedlot operations. Their value lies in ability to thrive on poor forage without grain feeding, reducing production costs and environmental impacts for grass-based operations. Many ranchers keep longhorns for their historical significance, breeding stock value, or agritourism rather than purely for meat production."

