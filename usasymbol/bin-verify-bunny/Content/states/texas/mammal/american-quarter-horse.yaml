faq:
  - question: "What is Texas's state horse?"
    answer: "Texas's state horse is the American Quarter Horse, designated in 2009. The Quarter Horse is America's most popular horse breed with over 3 million registered horses. Texas ranches, particularly King Ranch, played crucial roles in developing the modern breed, and the American Quarter Horse Association maintains its headquarters in Amarillo."
  
  - question: "When was the American Quarter Horse designated as Texas's state horse?"
    answer: "The American Quarter Horse became Texas's official state horse in 2009 when the 81st Legislature passed House Concurrent Resolution No. 18, sponsored by Representative Jim Landtroop. The designation recognized the breed's fundamental importance to Texas ranching history and the state's position as center of Quarter Horse breeding, training, and competition."
  
  - question: "Why did Texas choose the American Quarter Horse as the state horse?"
    answer: "Texas chose the American Quarter Horse because the breed enabled the cattle industry that built Texas's economy and culture. Quarter Horses possessed the speed, agility, strength, and cow sense essential for working Texas longhorns on open range and during cattle drives. Texas ranches, particularly King Ranch, played pivotal roles in developing the modern breed. The American Quarter Horse Association's headquarters in Amarillo and Texas's leadership in Quarter Horse population demonstrate the state's continuing central role in the breed's story."
  
  - question: "What makes Quarter Horses good for ranch work?"
    answer: "American Quarter Horses excel at ranch work due to several key traits: explosive speed for catching running cattle, exceptional agility for maneuvering through rough terrain, heavily muscled hindquarters providing power for quick stops and turns, innate 'cow sense' allowing them to anticipate cattle movements, calm temperament for working safely near unpredictable livestock, and endurance for all-day work. These characteristics made Quarter Horses superior to other breeds for working semi-wild longhorns on Texas ranches."
  
  - question: "Why are they called Quarter Horses?"
    answer: "The breed is called Quarter Horse because these horses are fastest at sprint distances of a quarter-mile or less, capable of reaching speeds over 55 miles per hour. Colonial settlers in Virginia and the Carolinas raced horses over quarter-mile straightaways, breeding specifically for explosive speed. This sprint speed proved equally valuable for catching running cattle on ranches, making the breed ideal for both racing and ranch work."
  
  - question: "What is King Ranch's connection to Quarter Horses?"
    answer: "King Ranch in South Texas played a pivotal role in developing the modern American Quarter Horse through systematic breeding programs begun in the early 1900s under Robert Kleberg Jr. The ranch produced Wimpy, who became the first horse registered in the American Quarter Horse Association studbook in 1941 (registration number 1). King Ranch's Old Sorrel bloodline influenced thousands of Quarter Horses and remains prominent in modern pedigrees. The ranch treated horse breeding with the same scientific rigor as cattle breeding, selecting for traits essential to ranch work."
  
  - question: "Where is the American Quarter Horse Association headquartered?"
    answer: "The American Quarter Horse Association (AQHA) maintains its international headquarters in Amarillo, Texas, where it has been located since 1946. AQHA is the world's largest equine breed registry with over 6 million registered Quarter Horses. The headquarters campus includes the American Quarter Horse Hall of Fame and Museum, which features exhibits on breed history, famous horses, and Western heritage. The association's presence in Texas reflects the state's central role in Quarter Horse development and continued leadership in the breed."
  
  - question: "What is the difference between Quarter Horses and Thoroughbreds?"
    answer: "Quarter Horses and Thoroughbreds differ significantly in build, purpose, and abilities. Quarter Horses are compact, heavily muscled, and built for explosive sprint speed (fastest at quarter-mile), quick turns, and cattle work. Thoroughbreds are taller, leaner, and built for sustained speed over longer distances (excelling at mile+ races). Quarter Horses have calm temperaments ideal for ranch work and multiple disciplines. Thoroughbreds are more high-strung and specialized for racing. Quarter Horses excel at Western riding including cutting, reining, and ranch work. Thoroughbreds dominate flat racing and steeplechasing. Both breeds have racing traditions but serve different purposes."

