sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Texas's State Pie?"
    paragraphs:
      - "Pecan pie is Texas's official state pie, designated by the Texas Legislature in 2013. It is a custard pie made with pecans set in a sweet corn syrup or sugar filling."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Pecan Pie"
    paragraphs:
      - "Pecan pie is made by baking a filling of eggs, sugar or corn syrup, and butter with pecans arranged over or mixed into it, poured into a pastry crust. The nuts toast slightly during baking, adding a firm texture against the soft filling."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Pecan Pie Became Texas's State Pie"
    paragraphs:
      - "The Texas Legislature designated pecan pie the official state pie in 2013, pairing it with the pecan tree, which had already been named the state tree of Texas in 1919."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose Pecan Pie"
    paragraphs:
      - "Pecan trees grow throughout Texas, and the pecan holds three separate state honors: state tree, state health nut, and, through pecan pie, an ingredient tied to the state pie. Texas is also one of the leading pecan-producing states in the country, giving the pie a direct link to state agriculture."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pecan Pie Facts"
    facts:
      - "Adopted as Texas's state pie in 2013."
      - "Made with pecans, Texas's official state tree since 1919."
      - "Texas is one of the top pecan-producing states in the country."

