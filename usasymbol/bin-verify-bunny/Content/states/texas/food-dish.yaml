sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Texas's State Dish?"
    paragraphs:
      - "Chili is Texas's official state dish, designated by the Texas Legislature in 1977. Texas style chili, often called chili con carne, is a stew of chopped or ground beef and chili peppers, traditionally made without beans."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Chili"
    paragraphs:
      - "Traditional Texas chili combines beef with dried and fresh chili peppers, cumin, garlic, and other spices, simmered until thick. Unlike many chili recipes found elsewhere in the country, the Texas version is traditionally made without beans or tomatoes, letting the beef and chili peppers carry the flavor."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Chili Became Texas's State Dish"
    paragraphs:
      - "The Texas Legislature designated chili the official state dish in 1977."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose Chili"
    paragraphs:
      - "Chili's popular history in Texas traces back to San Antonio in the 1800s, where women known as chili queens sold bowls of the stew from outdoor stands in the city's plazas. That history, combined with chili's long association with Texas ranching and cattle culture, made it a natural choice for the state's official dish."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Chili Comes From in Texas"
    paragraphs:
      - "San Antonio's downtown plazas were the setting for the 19th century chili queens, whose outdoor food stands helped popularize Texas style chili."
    sites:
      - name: San Antonio Plazas
        city: San Antonio
