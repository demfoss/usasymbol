faq:
  - question: What is Nevada's state reptile?
    answer: "Nevada's state reptile is the desert tortoise, adopted by the Nevada Legislature in 1989."
  - question: When did Nevada adopt the desert tortoise?
    answer: "The Nevada Legislature designated the desert tortoise the official state reptile in 1989."
  - question: Why did Nevada choose the desert tortoise?
    answer: "The desert tortoise is one of the most recognizable animals of the Mojave Desert region in southern Nevada and has been a major focus of desert conservation efforts."
  - question: Is the desert tortoise endangered?
    answer: "The desert tortoise is federally listed as threatened due to habitat loss and other pressures across its Mojave Desert range."

