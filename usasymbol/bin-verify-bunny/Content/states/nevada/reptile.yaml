sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Nevada?
    paragraphs:
      - "The desert tortoise is Nevada's official state reptile, designated by the Nevada Legislature in 1989. Its scientific name is Gopherus agassizii, and it is one of the largest land reptiles native to the southwestern United States."
      - "It lives in the Mojave Desert region of southern Nevada, where it digs burrows to survive extreme heat and cold."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Desert Tortoise
    paragraphs:
      - "Desert tortoises have a brown to tan domed shell and stumpy, elephant-like hind legs built for walking across sand and rocky ground."
      - "Adults can grow to nearly 15 inches long and may live 50 years or more in the wild."
      - "They spend much of their life underground in burrows, which shield them from summer heat and winter cold in the desert."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Nevada Legislature designated the desert tortoise the official state reptile in 1989, recognizing an animal closely tied to the Mojave Desert ecosystem in the southern part of the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Nevada Chose the Desert Tortoise
    paragraphs:
      - "The desert tortoise is one of the most recognizable animals of the Mojave Desert region in southern Nevada, and it has long been a focus of conservation efforts to protect its shrinking desert habitat."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Desert Tortoise
    paragraphs:
      - "Desert tortoises live in the Mojave Desert of southern Nevada, including sandy valleys and rocky slopes around the Las Vegas area."
