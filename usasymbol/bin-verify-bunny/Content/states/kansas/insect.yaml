sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Kansas?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Kansas's official state insect. The Kansas Legislature designated it in 1976."
  - "Lawmakers described the honey bee as hardworking and protective of what it cherishes, qualities they said mirrored the character of Kansans."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce the honey the colony eats and stores."
  - "Honey bees also pollinate a wide range of Kansas crops and wildflowers as they move from bloom to bloom."

- id: history
  icon: fa-solid fa-landmark
  title: How Kansas Chose the European Honey Bee
  paragraphs:
  - "More than 2,000 Kansas schoolchildren signed a petition asking lawmakers to name an official state insect. The Kansas Legislature responded with a bill designating the honey bee in 1976."
  - "The bill's language praised the honey bee as proud, hardworking, and always helping others, comparing those qualities to the character of Kansans."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1976, by the Kansas Legislature."
  - "Scientific name: Apis mellifera."
  - "More than 2,000 Kansas schoolchildren signed a petition supporting the designation."
  - "The law compared the honey bee's hard work and loyalty to the character of Kansans."
  - "Honey bees pollinate a wide range of Kansas crops and wildflowers."




