sections:
  - id: overview
    icon: fa-solid fa-music
    title: Kansas State Song
    paragraphs:
      - "\"Home on the Range\" is Kansas's official state song, adopted in 1947. The words began as an 1870s poem by Smith County homesteader Brewster Higley, and the tune Daniel Kelley set it to eventually became one of the most recorded songs in American history."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Home on the Range\" Explained"
    paragraphs:
      - "The song describes an open plain where buffalo roam, deer and antelope play, and the sky stays clear day after day. It is a slow, simple ballad built around a repeating chorus, written in the voice of someone content with a quiet, unhurried life on the land."
      - "Brewster Higley, a doctor who homesteaded near Beaver Creek in Smith County, wrote the words as a poem titled \"My Western Home\" around 1872 or 1873. His neighbor Daniel Kelley set the poem to music soon after, and the song spread by word of mouth through cowboy camps long before it was ever adopted as anything official."
      - "By the twentieth century, \"Home on the Range\" had become a standard of American popular music, recorded by singing cowboy Gene Autry, Bing Crosby, and countless other performers, and reportedly a favorite of President Franklin D. Roosevelt."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Home on the Range" Represents Kansas
    paragraphs:
      - "Kansas adopted the song because it was written on Kansas ground about a Kansas landscape, not borrowed from anywhere else. Higley's cabin site near Athol in Smith County still stands as a landmark tied directly to the song's origin."
      - "The song's popularity nationwide by the 1930s and 1940s also made the choice an easy one. Few states could point to a song that was simultaneously a piece of local homestead history and one of the most widely known folk songs in the country."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Home on the Range\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Home on the Range" Became Kansas's State Song
    paragraphs:
      - "The Kansas Legislature designated \"Home on the Range\" the official state song in 1947, nearly 75 years after Higley first wrote the words. The delay reflects how the song spread informally for decades, through cowboy singing and radio recordings, before lawmakers made the connection to Kansas official."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Kansas

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Home on the Range\" Facts"
    facts:
      - "Kansas adopted \"Home on the Range\" as its official state song in 1947."
      - "Brewster Higley wrote the original words as a poem near Beaver Creek in Smith County around 1872 or 1873."
      - "Daniel Kelley, Higley's neighbor, composed the melody shortly after the poem was written."
      - "Gene Autry and Bing Crosby are among the many performers who later recorded the song."
      - "Kansas also recognizes two official state marches, adopted separately from the state song."

