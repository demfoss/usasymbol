faq:
  - question: What is Kansas's state song?
    answer: "Kansas's official state song is \"Home on the Range,\" adopted in 1947."
  - question: Who wrote Kansas's state song?
    answer: "Brewster M. Higley wrote the original words around 1872 or 1873, and his neighbor Daniel E. Kelley composed the melody."
  - question: When did Kansas adopt "Home on the Range" as its state song?
    answer: "Kansas adopted \"Home on the Range\" as its official state song in 1947."
  - question: Is "Home on the Range" really about Kansas?
    answer: "Yes. Brewster Higley wrote the original poem describing the plains around his homestead near Beaver Creek in Smith County, Kansas."

