faq:
  - question: "What is Kansas' state animal?"
    answer: "Kansas' state animal is the American bison (Bison bison), designated in 1955 through House Concurrent Resolution 3003. The bison was chosen to honor its historical importance to the Great Plains and its role in Kansas history."

  - question: "When was the American bison designated as Kansas' state animal?"
    answer: "The American bison became Kansas' official state animal in 1955, recognizing the species' fundamental importance to Great Plains ecosystems and cultures before commercial hunting nearly eliminated it in the 1870s."

  - question: "Why did Kansas choose the American bison as its state animal?"
    answer: "Kansas chose the American bison because it was the defining animal of the Great Plains, sustaining Native peoples for thousands of years and shaping prairie ecosystems. The designation honored this historical importance while acknowledging the species' near-extinction and survival through conservation efforts. The bison represents both Kansas' frontier heritage and successful wildlife conservation."

  - question: "Where can I see bison in Kansas?"
    answer: "You can see bison at several Kansas locations: Tallgrass Prairie National Preserve near Strong City (approximately 100 bison), Maxwell Wildlife Refuge near Canton (approximately 200 bison), and Konza Prairie Biological Station near Manhattan. Many private ranches throughout Kansas also maintain bison herds, though these are generally not open to public viewing."

  - question: "How many bison lived in Kansas historically?"
    answer: "Historical bison populations across the Great Plains numbered 30 to 60 million, with millions inhabiting Kansas. Early accounts describe herds so vast that they took days to pass a single point and trampled grass for miles. By 1880, commercial hunting had eliminated virtually all Kansas bison, reducing the statewide population to zero."

  - question: "Are American bison endangered?"
    answer: "American bison are not currently endangered—approximately 500,000 exist in North America. However, most live on private ranches as commercial livestock rather than as wild populations. Only about 30,000 bison exist in conservation herds. The IUCN classifies bison as near-threatened because truly wild, free-roaming populations essentially no longer exist."

  - question: "What's the difference between bison and buffalo?"
    answer: "American bison are commonly called buffalo in the United States, though true buffalo (water buffalo and African buffalo) are different species native to Asia and Africa. 'Buffalo' became the colloquial American name for bison, used by Plains Indians, settlers, and hunters. Both terms refer to the same animal (Bison bison), with 'bison' being scientifically correct and 'buffalo' being the traditional American common name."

  - question: "Why did bison almost go extinct?"
    answer: "Bison nearly went extinct due to systematic commercial hunting between 1870 and 1890. After railroads made hide transport profitable, professional hunters killed millions of bison, shipping hides east for leather production. The U.S. military encouraged this slaughter to eliminate the food source sustaining Plains Indian tribes, forcing them onto reservations. By 1890, fewer than 1,000 bison survived, down from 30-60 million."

