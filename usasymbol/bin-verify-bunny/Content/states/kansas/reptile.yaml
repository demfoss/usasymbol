intro_text: "Kansas's state reptile is the ornate box turtle, a small land turtle with a domed, patterned shell, adopted in 1986. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Kansas?
    paragraphs:
      - "The ornate box turtle is Kansas's official state reptile, designated by the Kansas Legislature in 1986. Its scientific name is Terrapene ornata."
      - "It is a small land turtle common across the prairies and grasslands of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Ornate Box Turtle
    paragraphs:
      - "The ornate box turtle has a dark, domed shell marked with yellow radiating lines, and it usually grows to about four to five inches long."
      - "Like other box turtles, it can pull its head, legs, and tail completely inside its shell and close the hinged bottom for protection."
      - "It is a land turtle, not an aquatic one, and spends most of its time walking slowly through grass hunting for insects and other small food."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "Kansas schoolchildren campaigned for a state reptile, and the Kansas Legislature designated the ornate box turtle as the official choice in 1986."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Kansas Chose the Ornate Box Turtle
    paragraphs:
      - "The ornate box turtle is a common and easily recognized sight on Kansas prairies, making it a natural symbol of the state's grassland wildlife."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Ornate Box Turtle
    paragraphs:
      - "The ornate box turtle is found throughout Kansas, especially in native prairie, pastures, and sandy grassland areas across the state."
    sites:
      - name: Flint Hills prairie
        city: Manhattan
        lat: 39.18
        lng: -96.57
        note: "Native tallgrass prairie habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Ornate Box Turtle Facts
    facts:
      - "Adopted in 1986 by the Kansas Legislature."
      - "Scientific name is Terrapene ornata."
      - "Shell grows to about four to five inches long."
      - "Can close its shell completely using a hinged bottom."
      - "Lives on land in prairies and grasslands, not in water."

