faq:
  - question: What is Kansas's state reptile?
    answer: "Kansas's state reptile is the ornate box turtle, adopted by the Kansas Legislature in 1986."
  - question: When did Kansas adopt the ornate box turtle?
    answer: "The Kansas Legislature designated the ornate box turtle the official state reptile in 1986."
  - question: Why did Kansas choose the ornate box turtle?
    answer: "The ornate box turtle is a common, easily recognized turtle on Kansas prairies, making it a fitting symbol of the state's grassland wildlife."
  - question: Is the ornate box turtle a turtle, snake, lizard, or alligator?
    answer: "The ornate box turtle is a small land turtle, not a snake, lizard, or alligator."

