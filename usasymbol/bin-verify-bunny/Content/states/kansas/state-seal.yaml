type: State Seal
state: Kansas
name: Great Seal of Kansas
adopted_year: 1861
is_official: true
legislation: Kansas Statutes Annotated § 75-202
meaning: 'The Great Seal of Kansas compresses the entire story of 1861 Kansas into a single landscape: a farmer breaking prairie sod, a steamboat on the Kansas River, a wagon train rolling west, and a bison hunt in the far distance, all under a rising sun and 34 stars that counted Kansas as the newest member of the Union. Every image anchors the seal to the specific moment of Kansas statehood, January 29, 1861, and to the motto the Constitutional Convention chose: Ad Astra per Aspera, To the Stars Through Difficulties.'
