timeline:
- year: '1854'
  description: Congress passes the Kansas-Nebraska Act, opening Kansas Territory to settlement under popular sovereignty and igniting the Bleeding Kansas conflict over whether the territory would be free or slave.
- year: '1859'
  description: The Wyandotte Constitutional Convention meets in July and drafts the Kansas constitution, including the state seal and the motto Ad Astra per Aspera, proposed by John J. Ingalls.
- year: '1861'
  description: President James Buchanan signs the statehood bill on January 29, making Kansas the 34th state. The Great Seal, designed in 1859, becomes the official emblem of the new state.
- year: '1861'
  description: The Civil War begins in April, four months after Kansas statehood. Kansas, admitted as a free state, sends a higher proportion of its male population to Union service than any other state.
- year: '1903'
  description: Kansas adopts the wild native sunflower as the official state flower, strengthening the association between the flower and the state even though it is not part of the official state seal.
- year: '1927'
  description: Kansas adopts its state flag, a blue field bearing the state seal with a sunflower crest above it. The word "Kansas" is added below the seal in a later revision.

faq:
- question: What does the Kansas state seal mean?
  answer: The Kansas state seal depicts the state at the moment of its 1861 founding, with a farmer plowing in the foreground, a steamboat on the Kansas River, a wagon train heading west, and a bison hunt in the distance, all under a rising sun and 34 stars. Together the images represent agriculture, commerce, westward movement, and the natural world of the Great Plains. The motto Ad Astra per Aspera, "To the Stars Through Difficulties," acknowledges the violent territorial period that preceded statehood.
- question: What is on the Kansas state seal?
  answer: The Kansas state seal shows a landscape panorama with a rising sun on the eastern horizon, a farmer plowing with two horses and a log cabin behind him, a steamboat on the Kansas River, a wagon train moving westward, and a herd of bison being chased by two Native Americans on horseback. Above the scene are 34 stars and the motto Ad Astra per Aspera, while the words "Great Seal of the State of Kansas" and the date 1861 appear on the border.
- question: When was the Kansas state seal adopted?
  answer: The design of the Kansas state seal was approved at the Wyandotte Constitutional Convention in 1859. It became the official state seal when Kansas achieved statehood on January 29, 1861.
- question: Is the sunflower part of the Kansas state seal?
  answer: No. The sunflower is strongly associated with Kansas and became the official state flower in 1903, but it belongs to the state's flag and banner traditions rather than to the official design of the Great Seal itself.
- question: What does Ad Astra per Aspera mean?
  answer: Ad Astra per Aspera is Latin for "To the Stars Through Difficulties." It is Kansas's official state motto, proposed by John J. Ingalls at the 1859 Wyandotte Constitutional Convention. The phrase referenced the decade of violent conflict over slavery in Kansas Territory, known as Bleeding Kansas, that preceded statehood.
- question: Does the Kansas state seal appear on the flag?
  answer: Yes. The Kansas state flag is a blue field bearing the state seal in full color at its center, with a sunflower bar above the seal and the word "Kansas" below it. The flag was adopted in 1927.

