hero_image_caption: The Great Seal of Kansas, adopted at statehood on January 29, 1861. The landscape scene captures frontier Kansas in a single image, from the plowing farmer in the foreground to the bison hunt on the horizon.
intro_text: 'Kansas adopted its state seal in 1861, the same year it entered the Union as the 34th state on January 29. The seal depicts a panoramic Kansas landscape: a farmer at the plow, a steamboat on the Kansas River, a westward wagon train, and a bison chase on the plains, all beneath 34 stars and the motto Ad Astra per Aspera. This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
