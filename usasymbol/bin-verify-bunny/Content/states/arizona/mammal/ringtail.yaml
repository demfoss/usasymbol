title: "Arizona State Mammal | Ringtail"
scientific_name: "Bassariscus astutus"
adopted_year: 1986

seo_title: "Arizona State Mammal | Ringtail"
seo_description: "Arizona's state mammal is the Ringtail, adopted in 1986. Learn why this official Arizona symbol was chosen and what it represents."

intro_text: "The Ringtail is the official Arizona state mammal, designated in 1986. This page gives the direct answer for searches like 'arizona state mammal', 'arizona state animal', and 'arizona state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing Arizona's desert landscape, mining heritage, and the quiet adaptability required to thrive in harsh environments. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Ringtail"
official_since: "1986"
status: "Least Concern (stable populations statewide; not threatened or endangered)"
habitat_in_state: "Rocky canyons, riparian corridors, pinyon-juniper woodlands, and chaparral slopes across most of Arizona"
known_for: "Symbolizing Arizona's desert landscape, mining heritage, and the quiet adaptability required to thrive in harsh environments"

size: "24 to 32 inches from nose to tail tip; body alone is 12 to 17 inches"
weight: "2 to 3 pounds"
coloration: "Grayish-brown to dark brown on the back; pale cream or white underside; white patches around the eyes"
distinctive_traits: "Long bushy tail with 14 to 16 alternating black and white rings ending in a black tip; pointed fox-like muzzle; large dark eyes; sharp semi-retractable claws; ankles that rotate over 180 degrees"

habitat: "Rocky desert canyons, riparian corridors, chaparral slopes, pinyon-juniper and oak woodlands"
range_in_state: "Found across most of Arizona except flat open desert and the highest mountain elevations; common in Grand Canyon, Saguaro National Park, and southern mountain ranges"
conservation_status: "Listed as Least Concern by the IUCN Red List; not threatened or endangered at state or federal level; habitat fragmentation and vehicle traffic are long-term concerns"
where_to_find: "Grand Canyon National Park (especially near Phantom Ranch and campgrounds at night); Saguaro National Park; Madera Canyon near Santa Rita Lodge; Arizona-Sonora Desert Museum during Cool Summer Nights events"
symbol_connections: "The ringtail connects directly to Arizona's state seal, which depicts a miner with a pick and shovel alongside a quartz mill—the same mining industry that gave the ringtail its nickname. The state motto, Ditat Deus (God Enriches), originally referenced mineral wealth. The ringtail was designated the same year as three other Arizona-specific wildlife symbols, all chosen to represent species unique to the state's landscape."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Arizona legislature designated the ringtail as the official state mammal on August 13, 1986, under Arizona Revised Statutes Section 41-859. The same law named three other state animals at once: the Arizona ridgenose rattlesnake as state reptile, the Apache trout as state fish, and the Arizona tree frog as state amphibian."
      - "All four symbols were chosen through the same process. The Arizona Game and Fish Commission ran a program called Arizona Wildlife Awareness in 1985, and thousands of schoolchildren across the state participated, in the same period that identity assets like [the Arizona state flag](/states/arizona/flag/arizona-state-flag) were widely promoted in schools."
      - "Arizona's official symbols reflect the full sweep of its frontier identity — from the desert-adapted Ringtail to the Saguaro Cactus Blossom. In the same spirit, Arizona's legislature designated the [Arizona state gun](/states/arizona/firearm/colt-single-action-army-revolver) as the Colt Single Action Army revolver in 2011 — the 'Peacemaker' that defined the sheriff, the cowboy, and the outlaw of the American West, and which has been in continuous production since 1873."

    subsections:
      - subtitle: "A Statewide Student Vote"
        text: "As part of the Wildlife Awareness program, students studied roughly 800 species found in Arizona. Four finalists were selected in each category—mammal, reptile, fish, and amphibian. Students then voted on their top choice. The ringtail won the mammal category. The winners from all four categories were sent to the Arizona legislature for official approval in 1986."

      - subtitle: "Why the Ringtail Was Chosen"
        text: "Lawmakers selected the ringtail because it represented Arizona's landscape and history rather than broad national fame. By 1986, the ringtail was already used in schools and museums to represent Southwestern desert ecosystems. It was closely tied to Arizona's rocky canyons, desert terrain, and the mining communities that shaped the state's early development. A coyote or bobcat might have been more recognizable, but the ringtail told a more distinctly Arizona story."

  - id: "state-symbolism"
    title: "What the Ringtail Represents"
    style: "highlight"
    paragraphs:
      - "The ringtail represents quiet survival in a demanding environment. This small, agile creature thrives in Arizona's harshest canyons without ever drawing attention to itself. That ability to adapt and persist—without fanfare—reflects something essential about life in the desert Southwest and aligns with [the Grand Canyon State nickname](/states/arizona/nickname/the-grand-canyon-state)."
      - "Most Arizonans have never seen a ringtail in the wild. It moves only after dark, stays hidden in rock crevices during the day, and leaves almost no trace. Choosing such an elusive animal as the state mammal was a deliberate statement: Arizona's most interesting wildlife does not always make itself easy to find."
      - "The ringtail also carries a piece of Arizona's frontier history. Before the state existed, ringtails were already living alongside the miners and settlers who would shape it."

    subsections:
      - subtitle: "The Miner's Cat"
        text: "During the mining boom of the 1800s and early 1900s, Arizona was dotted with copper, gold, and silver mines. Rats and mice followed the miners, carrying disease and destroying food supplies. Ringtails, naturally drawn to the rocky terrain around mine shafts, began showing up in camps and cabins. Miners found that ringtails were remarkably effective at hunting down rodents. Some kept them intentionally, letting them roam freely through cabins at night. The nickname miner's cat stuck, even though ringtails are not cats at all—they belong to the raccoon family."

      - subtitle: "A Symbol of the Mining Era on the State Seal"
        text: "Arizona's state seal depicts a miner holding a pick and shovel, standing beside a quartz mill. Behind him, mountains rise under a sunrise. This image honors the mining industry that drove Arizona's early economy and eventually led to statehood in 1912. The ringtail lived in those same mines and camps. By choosing it as the state mammal, Arizona linked its official animal directly to the human story shown on its seal."

      - subtitle: "Survival Without Water"
        text: "The ringtail is one of the best-adapted desert mammals in North America. It can survive for long periods without drinking water directly, pulling moisture from the food it eats. Its kidneys produce urine more concentrated than those of any other mammal studied—a way of conserving every drop of water. In a state where water scarcity has defined human settlement for centuries, the ringtail's ability to thrive on minimal water makes it a fitting symbol of desert resilience."

      - subtitle: "A Species That Lives With Us"
        text: "Unlike many state animals that are rarely encountered, ringtails sometimes den in attics, sheds, and abandoned buildings near human homes. Wildlife officials generally recommend leaving them alone rather than removing them. Ringtails eat rodents and insects, which makes them helpful neighbors. The ringtail's ability to coexist quietly alongside people—without conflict—reflects Arizona's broader challenge of balancing growth with conservation in the desert."

  - id: "identification"
    title: "How to Identify Ringtails"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "A ringtail looks like a small fox wearing a raccoon's tail. The body is slim and cat-sized, with a pointed muzzle, large dark eyes, and upright ears. The coat is grayish-brown on the back and pale underneath. The tail is the most recognizable feature—long, bushy, and ringed with black and white bands."
        list_items:
          - "**Size**: 24-32 inches nose to tail tip; body alone is 12-17 inches"
          - "**Weight**: 2-3 pounds (roughly the size of a slim house cat)"
          - "**Tail**: 12-17 inches long with 14-16 black and white rings; ends in a black tip"
          - "**Eyes**: Large and dark, adapted for low-light hunting"
          - "**Claws**: Short, sharp, and semi-retractable; ankles rotate over 180 degrees"

      - subtitle: "An Acrobat Built for Canyons"
        text: "The ringtail is one of the most agile climbing mammals in North America. Its long tail provides balance on narrow ledges, and it can perform a full cartwheel to reverse direction in mid-climb. Ringtails ascend vertical walls by pressing their feet against opposite sides of a crack—a technique called stemming. They can also ricochet between the walls of wider openings. These skills make Arizona's rocky canyons a perfect home."

  - id: "in-the-state"
    title: "Ringtails in Arizona"
    style: "default"

    paragraphs:
      - "Ringtails live across most of Arizona, from the Sonoran Desert canyons of the south to the oak woodlands of the southern mountains. They avoid only the flattest open desert and the highest alpine elevations. Near water sources, populations can be relatively dense—up to 50 ringtails per square mile in favorable habitat, especially in regions discussed in [States That Border Arizona](/states/arizona/borders)."
      - "Despite their widespread presence, ringtails are rarely seen. They are strictly nocturnal, emerging after sunset and returning to their dens before sunrise. A single ringtail may use several dens within its home range, switching locations every few nights to avoid disturbance."

    facts:
      - "**Grand Canyon**: Ringtails are common along the canyon rim and in campgrounds, especially near Phantom Ranch"
      - "**Saguaro National Park**: One of the best-studied ringtail habitats in Arizona; trail cameras regularly capture them"
      - "**Southern Mountains**: Present in the Santa Rita, Huachuca, and Chiricahua ranges in riparian canyons"
      - "**Urban areas**: Occasionally den in attics, sheds, and abandoned structures near towns"

  - id: "where-to-see"
    title: "Where to See Arizona's State Mammal"
    style: "default"

    paragraphs:
      - "Spotting a ringtail requires patience and darkness. These animals are active only at night, and they move quietly through shadows. Your best chances are at parks where ringtails have grown accustomed to human presence."

    list_items:
      - "**Grand Canyon National Park**: Ringtails are frequently spotted near campgrounds and at Phantom Ranch after dark; they are drawn to food scraps and water sources along the canyon"
      - "**Saguaro National Park (Tucson Mountain District)**: Rocky desert habitat with active ringtail populations; evening and night hikes offer the best viewing"
      - "**Madera Canyon, Santa Rita Mountains**: Wildlife lodges in this birding hotspot sometimes attract ringtails to feeding areas at night"
      - "**Arizona-Sonora Desert Museum**: Hosts Cool Summer Nights events where wild ringtails have been spotted on museum grounds after dark"
      - "**Trail cameras**: If you hike in rocky canyon areas at night and see a small animal with a distinctive ringed tail, that is Arizona's state mammal"

  - id: "current-status"
    title: "Current Status"
    style: "default"
    paragraphs:
      - "Ringtails are listed as Least Concern on the IUCN Red List and are not threatened or endangered at the state or federal level in Arizona. Their populations remain stable across the state."
      - "The biggest long-term threats are habitat fragmentation as cities expand into desert and riparian corridors, and vehicle traffic on roads near ringtail habitat. Conservation efforts focus on protecting movement corridors and den sites."

    subsections:
      - subtitle: "Management in Arizona"
        text: "The Arizona Game and Fish Department monitors ringtail populations as part of broader wildlife management. Ringtails are technically classified as furbearers in Arizona, but they are not harvested in significant numbers because their fur has little commercial value. Education programs encourage residents to tolerate ringtails near homes rather than removing them. Protecting riparian habitat—the stream corridors where ringtails are most common—benefits both ringtails and dozens of other desert species."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The ringtail connects most directly to Arizona's state seal. The seal shows a miner with a pick and shovel, a quartz mill, and mountains under a sunrise. This image honors the copper and silver mining that built Arizona. The ringtail earned its nickname—miner's cat—in those very mines and camps, making it the only Arizona state animal with a direct link to the imagery on the seal."
      - "Arizona's state motto, Ditat Deus, is Latin for God Enriches. The phrase originally referred to the mineral wealth that drew settlers westward. The ringtail lived alongside those settlers from the earliest days of Arizona's mining frontier; see [Arizona's motto page](/states/arizona/motto/ditat-deus) for the legislative context."
      - "From a modern planning view, ringtail habitat pressure is often compared against growth datasets such as [U.S. states by population](/rankings/demographics/states-by-population)."

    subsections:
      - subtitle: "Four Symbols, One Program"
        text: "The ringtail was not chosen alone. In 1986, Arizona designated four state animals at once—all through the same student vote. The Arizona ridgenose rattlesnake (state reptile), Apache trout (state fish), and Arizona tree frog (state amphibian) were named alongside it. Each species exists only in or is most closely associated with Arizona. Together, the four symbols cover the state's major wildlife groups and represent species found nowhere else in quite the same way."

      - subtitle: "The Copper Star and the Canyon Creature"
        text: "The copper star on Arizona's state flag identifies the state as the largest copper producer in the United States. Copper mining transformed Arizona from a sparsely settled territory into an industrializing state. The ringtail was already living in the canyons and mine shafts where that copper was found. The state mammal and the state flag both point back to the same era—the mining boom that made Arizona what it is."
        link:
          label: "See Arizona state motto"
          url: "/states/arizona/motto/ditat-deus"

