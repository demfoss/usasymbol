faq:
  - question: "What is Arizona's state mammal?"
    answer: "Arizona's state mammal is the ringtail (Bassariscus astutus), designated in 1986 under Arizona Revised Statutes Section 41-859."

  - question: "Why did Arizona choose the ringtail?"
    answer: "Arizona chose the ringtail because it represents the state's desert landscape and frontier mining history. During the 1800s mining boom, ringtails lived in mine shafts and camps, where they controlled rats and earned the nickname miner's cat. The ringtail was selected through a statewide student vote as part of the Arizona Game and Fish Commission's Wildlife Awareness program in 1985."

  - question: "Is a ringtail a cat?"
    answer: "No. Despite the nicknames ringtail cat and miner's cat, ringtails are not related to cats at all. They belong to the raccoon family (Procyonidae) and are closely related to raccoons and coatis. The cat nicknames come from their size—roughly that of a house cat—and their habit of hunting rodents."

  - question: "Where can I see ringtails in Arizona?"
    answer: "Grand Canyon National Park is one of the best spots, especially near campgrounds and Phantom Ranch after dark. Saguaro National Park and Madera Canyon in the Santa Rita Mountains are also good locations. Ringtails are strictly nocturnal, so you need to be out after sunset to have any chance of seeing one."

  - question: "What does the ringtail's scientific name mean?"
    answer: "Bassariscus astutus translates roughly to clever little fox. The name comes from ancient Greek roots: bassariscus refers to a fox, and astutus means cunning or clever. The name reflects the ringtail's fox-like pointed muzzle and its reputation as a sharp-witted hunter."

  - question: "What other state animals did Arizona name in 1986?"
    answer: "Arizona named four state animals at once in 1986: the ringtail as state mammal, the Arizona ridgenose rattlesnake as state reptile, the Apache trout as state fish, and the Arizona tree frog as state amphibian. All four were chosen through the same student vote in the Wildlife Awareness program."

  - question: "Is the ringtail on Arizona's flag or seal?"
    answer: "No, the ringtail does not appear on Arizona's flag or state seal. The seal features a miner with a pick and shovel, which connects to the ringtail indirectly—the mining camps where ringtails earned their miner's cat nickname are the same industry the seal honors."

  - question: "How did ringtails get the name miner's cat?"
    answer: "During Arizona's mining boom in the 1800s and early 1900s, ringtails naturally settled near mine shafts and rocky camps. Miners found them exceptionally good at hunting rats and mice, which carried disease and destroyed food supplies. Some miners kept ringtails intentionally as free-roaming pest controllers. The nickname miner's cat spread throughout the mining communities of the American West."

