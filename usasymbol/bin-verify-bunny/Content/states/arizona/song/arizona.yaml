faq:
  - question: What is Arizona's state song?
    answer: "Arizona has two official songs: the 1919 \"Arizona March Song\" and the 1981 alternate anthem \"Arizona.\""
  - question: Who wrote Arizona's alternate state anthem?
    answer: "Rex Allen Jr. wrote \"Arizona\" in 1981 with his father, singer and actor Rex Allen."
  - question: When did Arizona adopt "Arizona" as its state anthem?
    answer: "The Arizona Legislature designated \"Arizona\" the alternate state anthem in 1981."
  - question: Does Arizona have more than one official song?
    answer: "Yes. \"Arizona March Song\" from 1919 remains the original state anthem, while \"Arizona\" serves as the alternate anthem."

