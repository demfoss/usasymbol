sections:
  - id: overview
    icon: fa-solid fa-music
    title: Arizona State Song
    paragraphs:
      - "\"Arizona\" is Arizona's alternate state anthem, adopted by the legislature in 1981 after singer Rex Allen Jr. wrote it with his father, western film star Rex Allen. It joined \"The Arizona March Song,\" the state's original 1919 anthem, rather than replacing it."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Arizona\" Explained"
    paragraphs:
      - "The song is a country ballad addressed directly to the state, naming its mountains, deserts, and streams the way a love song names a person. Its tempo and instrumentation sit closer to 1980s country radio than to a formal march or anthem."
      - "Rex Allen Jr., son of singing cowboy actor Rex Allen, wrote the song in about 30 minutes after his father challenged him to write something of his own for an album project. Rex Allen Sr. had grown up in Willcox, Arizona, and both men had strong personal ties to the state before the song existed."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Arizona" Represents Arizona
    paragraphs:
      - "Lawmakers adopted the song in 1981 after its release built genuine public enthusiasm across the state. Representative Joe Lane of Cochise County introduced the bill, and it passed the House and Senate with wide support during a single legislative session."
      - "The song gave Arizona a modern, radio-friendly anthem to sit alongside its older, more formal 1919 march. Rather than choosing one over the other, the legislature kept both, letting Arizonans use whichever song fit the occasion."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Arizona\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Arizona" Became Arizona's Alternate State Anthem
    paragraphs:
      - "Rex Allen Jr. released \"Arizona\" in 1981, and Representative Joe Lane introduced legislation the same year to designate it an alternate state anthem. The bill passed the House unanimously and cleared the Senate by voice vote, making it official in 1981 without displacing the state's original 1919 anthem."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Arizona

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Arizona\" Facts"
    facts:
      - "The Arizona Legislature adopted \"Arizona\" as the state's alternate anthem in 1981."
      - "Rex Allen Jr. wrote the song with his father, actor and singer Rex Allen, in about 30 minutes in 1981."
      - "Rex Allen Sr. grew up in Willcox, Arizona, giving the song a direct family tie to the state."
      - "Arizona also keeps its original 1919 anthem, \"Arizona March Song,\" as a separate official song."

