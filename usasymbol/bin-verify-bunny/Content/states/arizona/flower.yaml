type: State Flower
state: Arizona
name: Saguaro Cactus Blossom
scientific_name: Carnegiea gigantea
adopted_year: 1931
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-16"
seo_title: "Arizona State Flower | Saguaro Cactus Blossom"
seo_description: "Arizona's state flower is the saguaro cactus blossom, adopted in 1931. It fits the Sonoran Desert better than almost any other symbol."

intro_text: "Arizona's official state flower is the Saguaro Cactus Blossom, recognized by the state legislature in 1931, and featured in the [list of U.S. state flowers](/symbols/flowers). These waxy white flowers bloom at the tips of the massive saguaro cactus arms during late spring. The blossoms open at night and close by mid-afternoon the following day."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Arizona"
    paragraphs:
      - "Since 1931, the Saguaro Cactus Blossom has represented Arizona officially. The flowers appear on the iconic saguaro cactus, which can live for over 200 years. Individual blossoms measure about 3 inches in diameter. They feature creamy white petals surrounding a dense center of bright yellow stamens."
      - "Each flower opens at night, typically after 8 PM. The bloom remains open through the next morning. By noon or early afternoon, the flower begins to close. A single saguaro can produce dozens of blooms during peak season. The flowering period runs from late April through early June, with May being the most active month."
      - "The saguaro grows exclusively in the Sonoran Desert. This limited range covers southern Arizona and small portions of California and Mexico. Plants take 35 years or more to produce their first flowers. The massive cacti can reach heights of 40 feet and weigh several tons."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Saguaro Cactus Blossom"
    paragraphs:
      - "Arizona's state flower goes by the common name Saguaro Cactus Blossom, scientifically classified as Carnegiea gigantea. The plant belongs to the Cactaceae family. This family includes over 1,750 species of cacti found throughout the Americas."
      - "The genus name Carnegiea honors Andrew Carnegie, the industrialist and philanthropist. The species name gigantea refers to the plant's enormous size. Native peoples called the plant ha:sañ in the O'odham language. Spanish colonists adopted variations of this indigenous name, eventually becoming 'saguaro' in English."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of Arizona's State Flower Selection"
    paragraphs:
      - "The Arizona Legislature recognized the Saguaro Cactus Blossom as the state flower in 1931. This came 19 years after Arizona achieved statehood in 1912. Lawmakers wanted a symbol that represented the state's unique desert environment and distinct character, alongside what became [Arizona's state bird](/states/arizona/bird/cactus-wren)."
      - "The saguaro cactus already served as Arizona's most recognizable natural feature. Postcards, advertisements, and tourism materials featured the towering cacti. Selecting its blossom as the state flower reinforced Arizona's identity as a desert state unlike anywhere else in the nation."
      - "Some residents initially questioned whether a cactus flower should represent the state. Critics noted that other southwestern states had chosen more traditional flowers. Supporters argued that Arizona's desert landscape deserved recognition through its most iconic plant. The legislature ultimately sided with those advocating for the saguaro blossom. The choice reflected pride in Arizona's distinctive ecology rather than conforming to eastern standards of beauty."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Arizona State Flower Facts"
    facts:
      - "The Tohono O'odham people traditionally harvested saguaro fruit in June, marking the beginning of their new year"
      - "Each blossom produces about 2,000 seeds, though only a tiny fraction will survive to become mature plants"
      - "When does Arizona's state flower bloom? Peak blooming occurs in May, typically between May 15 and June 5"
      - "White-winged doves, bats, and bees pollinate the flowers during their brief 24-hour opening period"
      - "Arizona officially adopted the Saguaro Cactus Blossom on March 16, 1931"
      - "The flowers have a subtle, sweet fragrance that intensifies during evening hours to attract nocturnal pollinators"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Arizona's Flower and Bird Symbols"
    paragraphs:
      - "The Cactus Wren serves as Arizona's state bird. Both symbols represent Arizona officially; see [the official Arizona bird page](/states/arizona/bird/cactus-wren) for the shared adoption date. The state adopted these symbols in the same year, 1931, reflecting a coordinated effort to celebrate Arizona's unique desert ecology."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Saguaro Cactus Blossom traditionally symbolizes desert resilience and adaptation to harsh conditions. Among indigenous communities, the flower has been linked to seasonal cycles and the connection between water, life, and survival. The blossom is considered to reflect Arizona's independent spirit and ability to flourish where others might struggle, an idea echoed in [Arizona's state motto](/states/arizona/motto/ditat-deus)."
      - "In landform context, saguaro habitat is often discussed with regional patterns from [States That Border Arizona](/states/arizona/borders) and broader comparisons like [U.S. states by land area](/rankings/geography/states-by-land-area)."

faq:
  - question: "What is Arizona's state flower?"
    answer: "Arizona's state flower is the Saguaro Cactus Blossom (Carnegiea gigantea), the white flower that blooms on the saguaro cactus."
  
  - question: "When was the Saguaro Cactus Blossom adopted?"
    answer: "Arizona adopted the Saguaro Cactus Blossom on March 16, 1931. The state chose both its flower and bird in the same year."
  
  - question: "Why did Arizona choose the Saguaro Cactus Blossom?"
    answer: "Arizona chose the Saguaro Cactus Blossom because the saguaro cactus was already the state's most recognizable natural feature. The choice reflected pride in Arizona's unique desert environment rather than selecting a more traditional garden flower."
  
  - question: "Where do Saguaro Cactus Blossoms grow?"
    answer: "Saguaro Cactus Blossoms grow exclusively in the Sonoran Desert, which covers southern Arizona and small portions of southeastern California and northwestern Mexico. The plants require specific desert conditions to survive."
  
  - question: "How long do Saguaro Cactus Blossoms last?"
    answer: "Each individual blossom lasts only about 24 hours. The flowers open at night and close by early afternoon the next day. The overall blooming season runs from late April through early June."

