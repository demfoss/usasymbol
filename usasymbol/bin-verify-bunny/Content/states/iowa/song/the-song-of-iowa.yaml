lyrics_verses:
  - |-
    You asked what land I love the best,
    Tis Iowa, O Iowa,
    The fairest State of all the west,
    It's Iowa, O! Iowa,
  - |-
    From yonder Mississippi's stream
    To where Missouri's waters gleam
    O! fair it is as poet's dream,
    O! Iowa, In Iowa.
  - |-
    Go read the story of thy past.
    O! Iowa, O! Iowa,
    What glorious deeds, what fame thou hast!
    O! Iowa, O! Iowa,
  - |-
    So long as time's great cycle runs,
    Or nations weep their fallen ones
    Thou'lt not forget thy patriot sons,
    O! Iowa, O! Iowa.
lyrics_note: "The lyrics praise Iowa's fertile fields and prairies and declare loyalty to the state and the Union, written by a former prisoner of war who wanted a patriotic answer to a Confederate song set to the same tune."
