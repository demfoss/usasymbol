sections:
  - id: overview
    icon: fa-solid fa-music
    title: Iowa State Song
    paragraphs:
      - "\"The Song of Iowa\" is Iowa's official state song, adopted in 1911. Samuel H. M. Byers wrote the words, setting them to a German melody he first heard played by Confederate bands while he was held as a prisoner of war."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"The Song of Iowa\" Explained"
    paragraphs:
      - "The song praises Iowa's fertile fields and prairies and expresses loyalty to the state, set to a steady, formal melody suited to group singing. It uses the tune known as \"Lauriger Horatius,\" an old German folk melody also familiar today as the basis for the Christmas carol \"O Tannenbaum.\""
      - "Byers, a Civil War veteran from Oskaloosa, was captured after the Battle of Missionary Ridge and held at Libby Prison in Richmond. He later described hearing Confederate bands play \"Maryland, My Maryland,\" a secessionist anthem set to the same German melody, and vowed to write loyal Union words of his own to that tune once he was free."
      - "Byers wrote the Iowa lyrics decades later, and the song spread through Iowa schools before the state made it official."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "The Song of Iowa" Represents Iowa
    paragraphs:
      - "Iowa adopted the song because it was written by a native son whose loyalty to the Union, forged during his imprisonment, gave the lyrics genuine weight. Few state songs carry that kind of personal wartime story behind them."
      - "The song's praise of Iowa's fields and prairies also matched the state's agricultural identity directly, giving lawmakers a song that described Iowa rather than a generic patriotic scene."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"The Song of Iowa\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "The Song of Iowa" Became Iowa's State Song
    paragraphs:
      - "The Iowa Legislature adopted \"The Song of Iowa\" as the official state song on March 20, 1911. Byers had written the words years earlier, inspired by his time as a Confederate prisoner during the Civil War, and the song had already become familiar in Iowa schools by the time it was formally designated."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Iowa

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"The Song of Iowa\" Facts"
    facts:
      - "Iowa adopted \"The Song of Iowa\" as its official state song on March 20, 1911."
      - "S. H. M. Byers wrote the lyrics after being held as a prisoner of war during the Civil War."
      - "The melody, \"Lauriger Horatius,\" is the same German tune used for the Confederate-era song \"Maryland, My Maryland.\""
      - "Iowa also recognizes \"Make Me a World in Iowa\" as an official companion state song, adopted in 2002."

