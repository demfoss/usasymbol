faq:
  - question: What is Iowa's state song?
    answer: "Iowa's official state song is \"The Song of Iowa,\" adopted in 1911."
  - question: Who wrote Iowa's state song?
    answer: "S. H. M. Byers wrote the lyrics, set to the traditional German melody \"Lauriger Horatius.\""
  - question: When did Iowa adopt "The Song of Iowa" as its state song?
    answer: "The Iowa Legislature adopted it on March 20, 1911."
  - question: Does Iowa have more than one official state song?
    answer: "Yes. Iowa also recognizes \"Make Me a World in Iowa\" as an official companion state song, adopted in 2002."

