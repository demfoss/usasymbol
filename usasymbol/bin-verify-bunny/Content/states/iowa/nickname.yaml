seo_title: "Iowa State Nickname | The Hawkeye State"
seo_description: "Iowa is known as The Hawkeye State, its official state nickname. Learn why the name fits and what other nicknames the state has used."

intro_text: "Iowa’s nickname is <i>the Hawkeye State</i>. The name is linked to Black Hawk, a Sauk leader who lived in the region during the early 1800s. In 1838, newspaper editor James Edwards promoted the nickname as a way to honor Native American history in the Iowa Territory. The name quickly gained popularity and became closely associated with the state. Today, Hawkeye remains Iowa’s most recognized informal name and is widely used in tourism, University of Iowa athletics, and cultural references."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Hawkeye State'"
    paragraphs:
      - "Why is Iowa nickname the Hawkeye State? Black Hawk provides the answer. He led the Sauk people during a difficult period. Black Hawk resisted American settlement of tribal lands in the 1830s. The Black Hawk War happened in 1832, unfolding across the same tallgrass frontier that would later give Illinois its own state identity — the [Prairie State origins](/states/illinois/nickname/the-prairie-state) of Illinois are inseparable from this era of displacement and frontier expansion. Black Hawk and his followers tried returning to their homeland in Illinois and Iowa. American forces pushed them back across the Mississippi River. Newspapers throughout the young nation reported on the conflict, which made Black Hawk famous far beyond the region."
      - "James Edwards worked as editor of the Burlington Patriot newspaper in Iowa Territory. Edwards proposed calling Iowa the Hawkeye State in 1838 to honor Black Hawk's memory and leadership. Some sources suggest Edwards also drew inspiration from a character named Hawkeye in James Fenimore Cooper's novel 'The Last of the Mohicans.' Both explanations might work together since Edwards probably knew Cooper's popular book while also wanting to recognize the area's Native American past."
      - "People in Iowa Territory liked the name immediately. It sounded strong. The nickname spread through communities quickly because it was easy to remember and had historical weight. By the time Iowa became a state in 1846, residents already used Hawkeye regularly when describing themselves. Towns picked up the name. Businesses used it. The University of Iowa's sports teams still call themselves the Hawkeyes. While never formally enshrined in Iowa Code like other state symbols, the nickname appears throughout tourism promotions and has become deeply embedded in Iowa's cultural identity — among the most distinctive on the [complete guide to state nicknames](/symbols/nicknames) for having no definitive etymology, and closely tied to language on [Iowa's official motto page](/states/iowa/motto/our-liberties-we-prize-and-our-rights-we-will-maintain)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Corn State"
        text: "Iowa grows more corn than almost any other state in America. Farmers plant corn across millions of acres each year, making the Corn State nickname accurate and easy to understand. People started using this name during the late 1800s when Iowa's agriculture industry expanded rapidly. Railroads helped farmers ship corn to markets across the country. Iowa typically ranks first or second nationally in corn production depending on weather conditions each year. The nickname appears less in official uses than Hawkeye State, but visitors often associate Iowa with endless cornfields stretching to the horizon, along with visual identity shown on the [Iowa state flag](/states/iowa/flag/iowa-state-flag)."
      - subtitle: "Land Where the Tall Corn Grows"
        text: "This longer nickname came from Iowa's agricultural success and a popular song. George Hamilton wrote 'The Song of Iowa' in 1897, which included lyrics about tall corn growing in Iowa fields. The state adopted this song as an official state song much later. Corn plants in Iowa often grow over six feet tall during good growing seasons, which impressed people visiting from other regions. The phrase captures Iowa's farming identity in poetic language. Tourism materials sometimes used this nickname during the mid-1900s. People rarely say the full phrase today, though it remains part of Iowa's cultural memory through the state song."
      - subtitle: "The Food Capital of the World"
        text: "Iowa earned this bold nickname because the state produces enormous amounts of food beyond just corn. Iowa leads the nation in pork production, raising more hogs than any other state by a significant margin. Farmers also grow soybeans, oats, and hay across Iowa's fertile land. Egg production ranks high nationally as well. The nickname appeared in the 1900s when Iowa wanted to emphasize agricultural diversity rather than focusing only on corn. Some promotional materials still use Food Capital today, though it never achieved the same recognition as the Hawkeye State. The name accurately describes Iowa's role feeding Americans and people worldwide, with regional context in [States Neighboring States](/rankings/geography/states-neighboring-states)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "James Edwards, editor of the Burlington Patriot, proposed the Hawkeye State nickname in 1838."
      - "Black Hawk was a Sauk leader who fought to keep tribal lands in Illinois and Iowa during the 1830s."
      - "The University of Iowa adopted Hawkeyes as the nickname for all athletic teams in the 19th century."
      - "Iowa became the 29th state on December 28, 1846, eight years after the Hawkeye nickname appeared."
      - "The state motto is Our Liberties We Prize and Our Rights We Will Maintain, adopted in 1847."
      - "Iowa produces more corn and raises more hogs than almost any other state in America."
      - "Unlike other state symbols listed in Iowa Code, the Hawkeye State nickname has never been formally adopted by legislation."

faq:
  - question: "What is Iowa’s nickname?"
    answer: "Iowa’s nickname is the Hawkeye State. The name has been used since the territorial period and remains widely recognized today."

  - question: "Why is Iowa called the Hawkeye State?"
    answer: "Iowa is called the Hawkeye State to honor Black Hawk, a Sauk leader who resisted American settlement in the 1830s. The nickname was proposed by newspaper editor James Edwards in 1838 and quickly gained popularity."

  - question: "Is the Hawkeye State an official nickname?"
    answer: "Yes, the Hawkeye State is Iowa’s official and widely recognized nickname. Although it was not adopted through a specific statute, the name has long been used by the state and is treated as official in government, education, and culture."

  - question: "What is the origin of Iowa’s nickname?"
    answer: "The origin of Iowa’s nickname dates to 1838 when James Edwards promoted the term Hawkeye in his newspaper. The name honored Black Hawk and may also reference a character from the novel The Last of the Mohicans."

  - question: "What does the Hawkeye State nickname mean?"
    answer: "The Hawkeye State nickname refers to Black Hawk, a respected Sauk leader associated with the region. Over time, the name became a symbol of Iowa’s identity."

  - question: "When did Iowa start using the Hawkeye State nickname?"
    answer: "Iowa began using the Hawkeye State nickname during the territorial period in the late 1830s, several years before becoming a state in 1846."

