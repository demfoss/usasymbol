faq:
  - question: What is California's state reptile?
    answer: "California's state reptile is the desert tortoise, adopted by the California Legislature in 1972."
  - question: When did California adopt the desert tortoise?
    answer: "The California Legislature designated the desert tortoise the official state reptile in 1972."
  - question: Why did California choose the desert tortoise?
    answer: "Official sources do not give a detailed reason, but the tortoise's close ties to the Mojave Desert made it a fitting symbol for the state."
  - question: Is the desert tortoise endangered?
    answer: "The desert tortoise is federally listed as threatened due to habitat loss and other pressures across its desert range."

