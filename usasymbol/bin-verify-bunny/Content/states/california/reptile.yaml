sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of California?
    paragraphs:
      - "The desert tortoise is California's official state reptile, designated by the California Legislature in 1972. Its scientific name is Gopherus agassizii."
      - "It is a land tortoise built for life in dry, harsh desert country, found across the Mojave and Colorado deserts in the southeastern part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Desert Tortoise
    paragraphs:
      - "The desert tortoise has a high, domed brown shell and thick, stumpy legs built for digging rather than speed."
      - "Adults can grow to over a foot long and are known for their long lifespans, often living several decades in the wild."
      - "It spends much of its time in burrows it digs underground, which shelter it from extreme desert heat and cold."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The California Legislature designated the desert tortoise the official state reptile in 1972, recognizing a species long associated with the state's desert regions."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why California Chose the Desert Tortoise
    paragraphs:
      - "Official sources name the desert tortoise as the state reptile but do not give a detailed reason for the choice. Its close ties to the Mojave Desert, a landscape unique to a large part of California, made it a natural fit as a state symbol."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Desert Tortoise
    paragraphs:
      - "The desert tortoise lives across California's Mojave and Colorado deserts, including areas within Joshua Tree National Park and the wider desert region near Barstow."
    sites:
      - name: Mojave Desert
        city: Barstow
        lat: 34.90
        lng: -117.02
        note: "Core desert tortoise habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Desert Tortoise Facts
    facts:
      - "Adopted in 1972 by the California Legislature."
      - "Scientific name is Gopherus agassizii."
      - "Can grow to over a foot in shell length."
      - "Digs underground burrows to escape desert heat and cold."
      - "Can live for several decades in the wild."

