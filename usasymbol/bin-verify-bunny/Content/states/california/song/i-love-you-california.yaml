faq:
  - question: What is California's state song?
    answer: "California's official state song is \"I Love You, California,\" adopted in 1951."
  - question: Who wrote California's state song?
    answer: "F. B. Silverwood wrote the words and Abraham F. Frankenstein composed the music, both in 1913."
  - question: When did California adopt "I Love You, California" as its state song?
    answer: "The legislature adopted it in 1951 and reconfirmed the designation in 1987."
  - question: Was California's state song popular before it became official?
    answer: "Yes. Opera star Mary Garden helped make it widely known starting in 1913, decades before its 1951 adoption."

