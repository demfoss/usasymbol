sections:
  - id: overview
    icon: fa-solid fa-music
    title: California State Song
    paragraphs:
      - "\"I Love You, California\" is California's official state song, adopted by the legislature in 1951. Los Angeles clothier F. B. Silverwood wrote the words in 1913, and conductor Abraham F. Frankenstein set them to music the same year."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"I Love You, California\" Explained"
    paragraphs:
      - "The song moves through California's landscape region by region, praising its coastline, mountains, valleys, and orchards. It is built as a sweeping, sentimental ballad in the style of early-twentieth-century popular song rather than a formal march."
      - "F. B. Silverwood wrote the lyrics in 1913, and Abraham F. Frankenstein, a conductor active in California music circles, composed the melody. Opera star Mary Garden, then performing with the Chicago Grand Opera, introduced the song to wide audiences that same year, and publishers used her name to promote the sheet music."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "I Love You, California" Represents California
    paragraphs:
      - "The song's region-by-region tour of the state gave it broad appeal across a large and geographically varied state. Naming the coast, mountains, and valleys let residents from different parts of California hear their own scenery reflected in the lyrics."
      - "Its popularity had already been established for decades by the time lawmakers acted. Mary Garden's early performances had turned it into an unofficial anthem long before the 1951 legislature made the designation formal, and a 1987 resolution later reconfirmed it."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"I Love You, California\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "I Love You, California" Became California's State Song
    paragraphs:
      - "Silverwood and Frankenstein published the song in 1913, and Mary Garden's performances helped it spread statewide well before any official designation. The California Legislature did not formally adopt it as the state song until 1951, nearly four decades after it was written, and reaffirmed the designation in 1987."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"I Love You, California\" Facts"
    facts:
      - "California adopted \"I Love You, California\" as its official state song in 1951."
      - "F. B. Silverwood, a Los Angeles clothier, wrote the lyrics in 1913."
      - "Opera star Mary Garden helped popularize the song decades before its official adoption."
      - "The legislature reconfirmed the song's official status in 1987."

