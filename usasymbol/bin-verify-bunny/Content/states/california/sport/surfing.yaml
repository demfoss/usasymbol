faq:
  - question: What is California's state sport?
    answer: "California's official state sport is surfing, adopted in 2018."
  - question: When did California adopt surfing as its state sport?
    answer: "California adopted surfing on August 20, 2018, when Governor Jerry Brown signed the bill into law."
  - question: Why did California choose surfing?
    answer: "Surfing already defined life along California's coastline before the law existed. The designation traces to Hawaiian waterman George Freeth's 1907 demonstrations at Redondo Beach."
  - question: Is Huntington Beach really "Surf City USA"?
    answer: "Yes. Huntington Beach won the legal right to the trademarked nickname 'Surf City USA' and now uses it as an official city brand."

