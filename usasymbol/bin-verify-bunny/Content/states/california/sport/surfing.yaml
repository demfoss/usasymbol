sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: California State Sport
    paragraphs:
      - "California named surfing its official state sport in 2018, putting a legislative stamp on something that had already shaped beach life along the state's 1,100-mile coastline for more than a century. The choice set California apart from states built around football, baseball, or rodeo, pointing instead to the Pacific as the center of its identity. The law, signed by Governor Jerry Brown, also credited coastal tribes such as the Chumash and Tongva with a historic connection to the surf breaks the sport now uses."

  - id: what-is
    icon: fa-solid fa-water
    title: "Surfing in California"
    paragraphs:
      - "A surfer paddles out past the breaking waves, turns toward shore, and stands up on a board to ride the wave's face before it collapses. In California the sport ranges from small, forgiving breaks near San Diego to the heavy winter swells at Mavericks near Half Moon Bay, where waves can top 40 feet. Longboards, shortboards, and bodyboards all show up in the water, often on the same afternoon at the same beach."
      - "Huntington Beach hosts the U.S. Open of Surfing every summer, drawing professional competitors and pulling hundreds of thousands of spectators onto the sand. The city has held the trademarked nickname 'Surf City USA' since winning a legal dispute over the title, and it is also home to the International Surfing Museum and the Surfers' Hall of Fame. Farther north, the Mavericks Big Wave Contest tests riders against some of the most dangerous surf in the world."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Surfing Represents California
    paragraphs:
      - "California's 1,100 miles of Pacific coastline gave surfing a natural home the moment it arrived. George Freeth, a Hawaiian waterman recruited by railroad builder Henry Huntington, rode a board off the Redondo Beach pier in 1907 to draw crowds to a new rail line. The demonstration worked, and surfing spread up and down the coast from San Diego to Santa Cruz within a few decades."
      - "Surfing in California is closer to a participation sport than a spectator one. Public high schools in coastal counties field surf teams, and thousands of residents paddle out before work or school on any given morning. That everyday presence, more than any single competition, is what the 2018 legislation pointed to in describing surfing as part of the state's identity."
      - "California also shaped the sport's equipment and science. The world's first neoprene wetsuit was developed in the San Francisco Bay Area, and the Scripps Institution of Oceanography in La Jolla pioneered surf forecasting methods that surfers now use worldwide."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Surfing Became California's State Sport
    paragraphs:
      - "California made surfing its official state sport in 2018, when Governor Jerry Brown signed the designation into law that August. The legislation formally credited Hawaii and Polynesian tradition as the sport's origin and acknowledged the coastal tribes connected to the surf breaks it now uses. It also cited California-born contributions to surfing, including the neoprene wetsuit and modern surf forecasting, as reasons the sport belonged to the state's identity as much as to any single beach."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Surfing Facts
    facts:
      - "California designated surfing its official state sport in 2018, under a bill signed by Governor Jerry Brown."
      - "George Freeth introduced surfing to the California mainland at Redondo Beach in 1907."
      - "Huntington Beach holds the trademarked nickname 'Surf City USA' and hosts the U.S. Open of Surfing every summer."
      - "The world's first neoprene wetsuit was developed in California's San Francisco Bay Area."
      - "Mavericks, near Half Moon Bay, produces some of the largest ridable waves in the world during winter swells."

