seo:
  title: "Common Last Names in California — Garcia Tops Smith"
  description: "Hispanic surnames like Garcia now lead California's most common last names — the only state in the U.S. where a Spanish surname tops the list."

page:
  h1: "Most Common Last Names in California"
  intro: "Garcia tops the most common last names in California — the only U.S. state where a Hispanic surname outranks Smith. Spanish colonial roots, the 1848 Gold Rush, and Pacific Rim immigration each left a distinct layer across the state's name map."
  heritage_title: "Spanish Colonial, Dust Bowl, and Pacific Rim Roots"
  heritage_body: "Spanish surnames dominate California's top ten, rooted in Mexican settlement predating statehood and reinforced by 20th-century labor migration to the Central Valley and East Los Angeles. Anglo-American names arrived during the 1848 Gold Rush and the 1930s Dust Bowl exodus from Oklahoma and Texas. Post-1975 Vietnamese resettlement centered in Orange County's Little Saigon added Nguyen to California's most frequent names within a generation."
  fun_fact: "California is the only U.S. state where Garcia outranks Smith as the most common surname."

