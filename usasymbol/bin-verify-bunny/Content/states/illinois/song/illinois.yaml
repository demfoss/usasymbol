sections:
  - id: overview
    icon: fa-solid fa-music
    title: Illinois State Song
    paragraphs:
      - "\"Illinois\" is the state's official song, adopted in 1925. Civil War veteran Charles H. Chamberlain wrote the words around 1893, setting them to a melody Archibald Johnston had composed for an earlier song called \"Baby Mine.\""

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Illinois\" Explained"
    paragraphs:
      - "The song opens with an image of rivers flowing gently and prairies growing green across the state, then moves through Illinois's pioneer history and its soldiers' service in the Civil War. Its tone is formal and patriotic, built for group singing at schools and civic events."
      - "Chamberlain, a Union Army veteran from Illinois, wrote the words around 1893, reportedly to help make the case for holding the World's Columbian Exposition in Chicago rather than a rival city. He set his verses to a tune Archibald Johnston had already composed for a separate popular song, \"Baby Mine,\" written in 1876."
      - "The song later became a staple of Illinois school programs and remains best known by its opening line, \"By thy rivers gently flowing, Illinois, Illinois.\""

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Illinois" Represents Illinois
    paragraphs:
      - "State senator Florence Fifer Bohrer of Bloomington, the first woman elected to the Illinois Senate, introduced the bill that made \"Illinois\" the official state song in 1925. By then, generations of Illinois schoolchildren had already sung it at patriotic exercises, giving lawmakers a song with a built-in constituency."
      - "Its lyrics also cover ground specific to the state, from its rivers and prairies to its Civil War soldiers, rather than describing scenery that could belong to any state."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Illinois\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Illinois" Became Illinois's State Song
    paragraphs:
      - "The Illinois General Assembly adopted \"Illinois\" as the official state song on June 30, 1925, more than three decades after Chamberlain first wrote the words. Senator Florence Fifer Bohrer sponsored the bill during her first term in the legislature."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Illinois\" Facts"
    facts:
      - "Illinois adopted \"Illinois\" as its official state song on June 30, 1925."
      - "Charles H. Chamberlain, a Civil War veteran, wrote the lyrics around 1893."
      - "The melody was originally composed by Archibald Johnston for a separate 1876 song, \"Baby Mine.\""
      - "State senator Florence Fifer Bohrer, Illinois's first woman state senator, sponsored the bill that made it official."
      - "The song is commonly known by its opening line, \"By thy rivers gently flowing.\""

