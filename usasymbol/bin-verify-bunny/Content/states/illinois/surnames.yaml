seo:
  title: "Most Common Last Names in Illinois"
  description: "Illinois' most common last names are led by Smith and Johnson, while Garcia ranks high statewide because of Chicago's influence."

page:
  h1: "Most Common Last Names in Illinois"
  intro: "Garcia ranks sixth in Illinois — 93rd nationally — because Pilsen and Little Village made Chicago the largest Mexican urban enclave outside California. The Great Migration brought Johnson and Williams to the South Side in waves from the 1910s through the 1960s; Polish Avondale added Kowalski to Cook County at a density that earned Chicago the name 'Polish capital of America.'"
  heritage_title: "Polish Settlement, the Great Migration, and Mexican Chicago"
  heritage_body: "Polish immigrants flooded Chicago's Northwest Side in the 1890s, drawn by steel mills and meatpacking plants; neighborhoods like Avondale and the Polish Triangle became centers of Polish life that still shape Cook County surnames today. The Great Migration of the 1910s–1960s brought hundreds of thousands of African Americans from the South, while Mexican settlement in Pilsen and Little Village made Garcia and Martinez among Illinois's fastest-growing names."
  fun_fact: "In the early 1900s, Chicago had so many Polish-born residents that it was called the 'Polish capital of America,' and that legacy is still visible in Cook County's unusually high density of Polish surnames like Kowalski and Kaminski."

surnames:
  - rank: 1
    name: Smith
    count: 98420
    ratio: 130
    origin: english
    type: Occupational
    meaning: "Smith derives from Old English 'smið,' denoting a metalworker or blacksmith. Anglo-American settlers from Virginia and Kentucky carried it into Illinois's central counties before statehood in 1818, making it the state's most common surname by the first federal census."

  - rank: 2
    name: Johnson
    count: 87300
    ratio: 147
    origin: english
    type: Patronymic
    meaning: "Johnson means 'son of John,' common across English and Scandinavian traditions. Its heavy concentration in Cook County reflects the Great Migration, which drew African American families from Mississippi and Alabama to Chicago's South Side starting in the 1910s."

  - rank: 3
    name: Williams
    count: 79100
    ratio: 162
    origin: english
    type: Patronymic
    meaning: "Williams derives from the Norman name William, meaning 'resolute protector.' It rose sharply in Illinois during the Great Migration, when African American families from the Deep South resettled in Chicago's South Side neighborhoods through the mid-20th century."

  - rank: 4
    name: Brown
    count: 71500
    ratio: 179
    origin: english
    type: Descriptive
    meaning: "Brown originated as a nickname for someone with dark hair or complexion, from Old English 'brūn.' It arrived in Illinois with Anglo-American settlers and increased in frequency during the Great Migration, particularly in Chicago's Bronzeville and Englewood communities."

  - rank: 5
    name: Jones
    count: 68900
    ratio: 186
    origin: welsh
    type: Patronymic
    meaning: "Jones derives from Welsh 'ap John,' meaning son of John, and spread with Welsh and English migrants across the Atlantic. In Illinois it arrived primarily with Anglo-American settlers moving north from Kentucky and Tennessee into the state's southern counties before 1830."

  - rank: 6
    name: Garcia
    count: 66200
    ratio: 194
    origin: spanish
    type: Patronymic
    meaning: "Garcia likely derives from a Basque personal name, possibly related to 'hartz' meaning bear, and is the most common surname in Spain and Mexico. It surged in Illinois as Mexican families settled in Chicago's Pilsen and Little Village neighborhoods from the 1950s onward, becoming the state's sixth most common name."

  - rank: 7
    name: Miller
    count: 63800
    ratio: 201
    origin: english
    type: Occupational
    meaning: "Miller describes an operator of a grain mill, from Old English 'mylenweard.' German immigrants settling in Chicago and Peoria in the mid-1800s frequently carried the equivalent Müller, which many families anglicized to Miller within a generation."

  - rank: 8
    name: Davis
    count: 60400
    ratio: 212
    origin: english
    type: Patronymic
    meaning: "Davis means 'son of David,' from the Hebrew name meaning 'beloved.' It spread into Illinois with Anglo-American migrants from Appalachian Virginia and Kentucky who settled the state's southern and central counties before statehood in 1818."

  - rank: 9
    name: Martinez
    count: 56700
    ratio: 226
    origin: spanish
    type: Patronymic
    meaning: "Martinez means 'son of Martín,' derived from the Latin Martinus. Mexican families bearing the name settled in Chicago's Pilsen neighborhood and the Near West Side corridor from the 1950s onward, making it one of the city's most recognized Spanish surnames."

  - rank: 10
    name: Wilson
    count: 54200
    ratio: 236
    origin: english
    type: Patronymic
    meaning: "Wilson means 'son of Will,' a short form of William common across Northern England and Scotland. In Illinois it arrived with Anglo-American settlers in the early 1800s and remains especially common in Sangamon County and the Springfield area."

  - rank: 11
    name: Anderson
    count: 52800
    ratio: 243
    origin: scandinavian
    type: Patronymic
    meaning: "Anderson means 'son of Anders,' shared across English and Scandinavian traditions. Swedish immigrants brought the name to northern Illinois, and Chicago's Andersonville neighborhood on the North Side took its name from an early Swedish settler named Anderson."

  - rank: 12
    name: Taylor
    count: 50100
    ratio: 256
    origin: english
    type: Occupational
    meaning: "Taylor derives from Old French 'tailleur,' meaning a cutter of cloth. The name reached Illinois with Anglo-American settlers from the mid-Atlantic states who moved into the Illinois River valley during the early territorial period."

  - rank: 13
    name: Thomas
    count: 51600
    ratio: 248
    origin: english
    type: Patronymic
    meaning: "Thomas derives from an Aramaic name meaning 'twin,' carried to Britain by Norman settlers after 1066. In Illinois it is common across Chicago's South Shore and Roseland communities, reflecting both English settlement and the Great Migration's impact on the South Side."

  - rank: 14
    name: Hernandez
    count: 49300
    ratio: 260
    origin: spanish
    type: Patronymic
    meaning: "Hernandez means 'son of Hernando,' from a Visigothic name meaning 'bold journey.' In Illinois it concentrates in Chicago's Logan Square and Humboldt Park neighborhoods, reflecting Mexican and Puerto Rican settlement that intensified from the 1960s onward."

  - rank: 15
    name: Moore
    count: 47800
    ratio: 268
    origin: english
    type: Habitational
    meaning: "Moore derives from Old English 'mōr,' referring to a moorland, and also anglicizes the Irish Ó Mórdha. Both origins are present in Illinois, arriving with English settlers in the central counties and Irish immigrants who reached Chicago during the Great Famine of the 1840s."

  - rank: 16
    name: Jackson
    count: 46500
    ratio: 275
    origin: english
    type: Patronymic
    meaning: "Jackson means 'son of Jack,' a medieval diminutive of John. Its prominence in Illinois reflects Chicago's role as a northern terminus of the Great Migration, drawing families named Jackson from Mississippi and Alabama to the city's South Side from the 1910s onward."

  - rank: 17
    name: Martin
    count: 44900
    ratio: 285
    origin: french
    type: Patronymic
    meaning: "Martin derives from Latin Martinus, connected to Mars, the Roman god of war. French traders and missionaries introduced the name to the Illinois region in the 17th and 18th centuries, and it persists in communities along the Mississippi and Illinois river corridors."

  - rank: 18
    name: Lee
    count: 43400
    ratio: 295
    origin: english
    type: Habitational
    meaning: "Lee originates from Old English 'lēah,' meaning a woodland clearing, and is also carried by Korean American families as an anglicization of Yi or Rhee. Both origins are present in Illinois, with the Korean contribution concentrated in Chicago's Koreatown area on the North Side."

  - rank: 19
    name: Thompson
    count: 42100
    ratio: 304
    origin: english
    type: Patronymic
    meaning: "Thompson means 'son of Thomas,' with the inserted 'p' appearing as a spelling convention by the 15th century. In Illinois it arrived with Anglo-American settlers and, like Johnson and Williams, gained frequency in Chicago's South Side communities during the Great Migration."

  - rank: 20
    name: White
    count: 41200
    ratio: 311
    origin: english
    type: Descriptive
    meaning: "White originated as a nickname for someone with very fair hair or pale complexion, from Old English 'hwīt.' It reached central and southern Illinois with Anglo-American migrants from the Ohio Valley in the early 1800s and remains common in the state's downstate counties."

