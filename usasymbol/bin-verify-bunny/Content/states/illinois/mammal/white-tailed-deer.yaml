faq:
  - question: "What is Illinois' state animal?"
    answer: "Illinois' state animal is the white-tailed deer (Odocoileus virginianus), designated in 1982 through Senate Joint Resolution 26."

  - question: "When was the white-tailed deer designated as Illinois' state animal?"
    answer: "The white-tailed deer became Illinois' official state animal on September 1, 1982, following a campaign by Illinois schoolchildren who petitioned the legislature to recognize the species."

  - question: "Why did Illinois choose the white-tailed deer as its state animal?"
    answer: "Illinois chose the white-tailed deer to celebrate one of the state's greatest conservation successes. The deer population had dropped to fewer than 1,000 by 1900 due to overhunting and habitat loss but recovered to hundreds of thousands through restoration programs. The designation honored this recovery and recognized the deer's importance to Illinois hunting tradition and outdoor heritage."

  - question: "How many white-tailed deer live in Illinois?"
    answer: "Illinois' white-tailed deer population is estimated at approximately 750,000 animals, distributed across all 102 counties. This represents a remarkable recovery from the estimated 1,000 or fewer deer present in Illinois in 1900."

  - question: "Where can I see white-tailed deer in Illinois?"
    answer: "White-tailed deer are found throughout Illinois in every county. Good viewing locations include Shawnee National Forest in southern Illinois, forest preserves around Chicago, Mississippi River bluffs, and state parks statewide. Deer are most visible at dawn and dusk when they feed in open areas. Agricultural regions with adjacent woodlots reliably support deer populations."

  - question: "Are white-tailed deer endangered in Illinois?"
    answer: "No, white-tailed deer are abundant in Illinois with a population of approximately 750,000. However, they were nearly extirpated from the state by 1900. Complete hunting closure from 1907 to 1957 and systematic restoration programs allowed populations to recover dramatically. Illinois now manages deer as both valued wildlife and potential agricultural pest."

  - question: "Why are there so many deer in Illinois now?"
    answer: "White-tailed deer populations increased dramatically due to several factors: complete hunting closure from 1907-1957 allowed populations to recover, systematic restoration programs released deer across the state, loss of predators eliminated natural population controls, and agricultural landscapes provide abundant high-energy food (corn and soybeans) plus adequate cover in remaining woodlots. Modern Illinois provides ideal deer habitat in many areas."

  - question: "What problems do white-tailed deer cause in Illinois?"
    answer: "Abundant white-tailed deer cause several problems in Illinois: over 15,000 vehicle collisions annually resulting in injuries and property damage, agricultural crop losses exceeding $50 million per year, landscape damage in suburban areas, increased tick-borne disease risks including Lyme disease, and chronic wasting disease spread. Illinois manages deer through regulated hunting to balance these concerns with maintaining healthy populations."

