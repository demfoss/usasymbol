sections:
  - id: overview
    icon: fa-solid fa-music
    title: Michigan State Song
    paragraphs:
      - "\"My Michigan\" is Michigan's official state song, adopted by the Legislature in 1937. H. O'Reilly Clint composed the music and Giles Kavanaugh wrote the lyrics, publishing the song in 1933, four years before it received official status."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"My Michigan\" Explained"
    paragraphs:
      - "The song is a warm, sentimental tribute to Michigan, written in the style of a formal state anthem rather than a folk tune. It praises the state directly, in the voice of a resident expressing pride in their home."
      - "Giles Kavanaugh wrote the lyrics and H. O'Reilly Clint set them to music in the early 1930s, publishing the piece in 1933. The Legislature adopted it four years later, describing it as capturing the hopes and pride of Michigan's people."
      - "Unusually for an official state song, \"My Michigan\" has almost no history of live performance at state functions, largely because the state never purchased the rights and the original authors would not release the copyright for free public use."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "My Michigan" Represents Michigan
    paragraphs:
      - "Lawmakers in 1937 adopted the song because its lyrics directly praised Michigan and its people, fitting the tone legislators wanted for an official anthem. The concurrent resolution that made it official cited the song's expression of hope, ambition, and pride."
      - "The song's ongoing copyright restriction is itself a notable part of its story. It remains Michigan's legally designated state song even though the state has avoided performing it publicly to sidestep royalty obligations."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"My Michigan\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "My Michigan" Became Michigan's State Song
    paragraphs:
      - "The Michigan Legislature adopted \"My Michigan\" as the official state song through a concurrent resolution in 1937, four years after Clint and Kavanaugh published it. The state never acquired the copyright outright, which has limited the song's use at official ceremonies ever since."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"My Michigan\" Facts"
    facts:
      - "Michigan adopted \"My Michigan\" as its official state song in 1937."
      - "H. O'Reilly Clint composed the music and Giles Kavanaugh wrote the lyrics in 1933."
      - "The song is rarely performed at official state events due to unresolved copyright ownership."
      - "Michigan has only one officially designated state song, unlike many neighboring states."

