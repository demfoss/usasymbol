- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Cecil Soil
  paragraphs:
  - "Tobacco and cotton are the historic crops of Cecil soil. North Carolina was the top tobacco-producing state in the country for most of the twentieth century, and the Piedmont counties — sitting on Cecil and related red clay Ultisols — were the center of that production. Burley and flue-cured tobacco both grew on Cecil land."
  - "Cotton was the other defining crop. Before the boll weevil arrived in the early 1900s, Cecil soil Piedmont counties were major cotton producers. After the boll weevil collapse, farmers shifted to corn, small grains, and eventually soybeans, which are now the most widely grown row crop on Cecil farmland."
  - "Loblolly pine is the dominant timber species on Cecil soil. Where Piedmont farmland went out of production in the twentieth century, loblolly pine took over — planted in rows for pulpwood and saw timber. Shortleaf pine and Virginia pine also grow on Cecil uplands. Where hardwoods persist, the mix is white oak, red oak, hickory, and sourwood."
  - "Peaches grow on the well-drained Cecil slopes of the southern Piedmont. North Carolina ranks among the leading peach-producing states in the South, with the orchards concentrated in the red clay counties south and east of Charlotte."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Cecil Soil Facts
  facts:
  - "The Cecil series was named by USDA soil scientist Milton Whitney in 1899 after Cecil County, Maryland, making it one of the oldest formally described soil series in the United States. Cecil was part of the first systematic soil survey effort to map and classify American farmland."
  - "Cecil is classified as a fine, kaolinitic, thermic Typic Kanhapludult — an Ultisol with a kandic argillic horizon dominated by low-activity kaolinite clay and iron oxides. The 'thermic' designation means the soil averages between 15°C and 22°C annually."
  - "The deep red color comes from hematite (Fe₂O₃), an iron oxide that formed as iron released from weathering minerals oxidized in the well-drained, aerated conditions of the Piedmont uplands. The same mineral gives brick its red color — and Cecil clay was historically used to make fired bricks across the Piedmont."
  - "Cecil soil has been forming in place since the granite and gneiss bedrock of the Piedmont began weathering, a process that started tens of millions of years ago. The saprolite layer at the base — soft, colorful, crumbly rock — can extend thirty feet or more below the soil, representing rock that has been chemically dissolved but not yet eroded."
  - "The Piedmont, named for its location at the foot of the Appalachian Mountains, is one of the most densely populated agricultural regions in the eastern United States. Cities including Charlotte, Greensboro, Durham, and Winston-Salem are built on or near Cecil soil — their red clay construction cuts are a visible signature of the series across the region."

