faq:
- question: What is North Carolina's state soil?
  answer: "North Carolina's state soil is the Cecil series, a deep red clay Ultisol that covers the Piedmont plateau between the Blue Ridge Mountains and the Coastal Plain. It formed from granite and gneiss bedrock weathered over millions of years and is recognizable by its brick-red argillic subsoil."
- question: Why is it called Cecil soil?
  answer: "The Cecil series was named by USDA soil scientist Milton Whitney in 1899 after Cecil County, Maryland, where he first formally described the series. The same red clay soil was then mapped south through Virginia, the Carolinas, Georgia, and Alabama as federal soil surveys expanded."
- question: What color is Cecil soil?
  answer: "The surface is dark yellowish brown sandy loam. Within about twelve inches, the soil turns reddish brown, then deep red or brick crimson in the argillic horizon. The red color comes from hematite, an iron oxide that formed during millions of years of intense weathering. The deepest layer — the saprolite — is a mix of red, gray, and cream from the original granite and gneiss minerals."
- question: Where is Cecil soil found in North Carolina?
  answer: "Cecil soil covers the Piedmont plateau of North Carolina, concentrated in the central and southern counties from the Virginia border to the South Carolina line. It is most extensive in Mecklenburg, Cabarrus, Union, Rowan, Guilford, Alamance, and surrounding Piedmont counties."
- question: What grows in Cecil soil?
  answer: "Historically, tobacco and cotton were the main crops. Today, soybeans, corn, and winter wheat are most common. Loblolly pine covers much of the former farmland. Peaches grow on well-drained Cecil slopes in the southern Piedmont. White oak, red oak, and hickory are the natural hardwood species."
- question: Why is Cecil soil so red?
  answer: "The red color comes from hematite (Fe₂O₃), the same iron oxide mineral that gives brick its color. As granite and gneiss bedrock broke down over millions of years, iron released from minerals oxidized in the well-drained upland conditions and crystallized as hematite in the subsoil."
- question: How deep is Cecil soil?
  answer: "Cecil soil is very deep. The true soil — the Ap, BA, and Bt horizons — typically extends four to five feet. Below the soil is saprolite, soft weathered rock that can go thirty feet or more down. The entire weathered zone represents some of the deepest bedrock weathering in the eastern United States."

