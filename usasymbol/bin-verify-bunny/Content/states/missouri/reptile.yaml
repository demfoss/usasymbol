sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Missouri?
    paragraphs:
      - "The three-toed box turtle is Missouri's official state reptile, designated by the Missouri Legislature in 2007. Its scientific name is Terrapene carolina triunguis, and it is a subspecies of the common box turtle."
      - "It is a small, land-dwelling turtle found in woodlands and grasslands throughout Missouri."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Three-toed Box Turtle
    paragraphs:
      - "Three-toed box turtles have a high, domed brown shell, often with faint yellow or olive markings, and most adults have three toes on each hind foot, which gives the subspecies its name."
      - "They can close their hinged lower shell almost completely, tucking their head, legs, and tail inside for protection."
      - "Adults typically grow to about 4 to 6 inches long and can live for several decades in the wild."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Missouri Legislature designated the three-toed box turtle the official state reptile in 2007, recognizing a turtle familiar to Missourians from backyards, woodlands, and prairies across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Missouri Chose the Three-toed Box Turtle
    paragraphs:
      - "The three-toed box turtle is one of the most commonly seen reptiles in Missouri, living in woodlands, fields, and even suburban yards across nearly the entire state, making it a familiar and fitting choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Three-toed Box Turtle
    paragraphs:
      - "Three-toed box turtles are found throughout Missouri, especially in the Ozark woodlands of the southern part of the state, as well as prairies and open fields elsewhere."
    sites:
      - name: Ozark woodlands
        city: Rolla
        lat: 37.95
        lng: -91.77
        note: "Common woodland habitat statewide"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Three-toed Box Turtle Facts
    facts:
      - "Adopted in 2007 by the Missouri Legislature."
      - "Named for the three toes usually found on each hind foot."
      - "Has a hinged lower shell that closes almost completely for protection."
      - "Adults typically grow to about 4 to 6 inches long."
      - "Found in woodlands, prairies, and even suburban yards across Missouri."

