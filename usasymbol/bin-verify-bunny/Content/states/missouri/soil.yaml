- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Menfro Soil
  paragraphs:
  - "Menfro silt loam is prime Midwest farmland. The thick argillic subsoil holds moisture through dry stretches and releases nutrients steadily to crop roots. On slopes under 6 percent, it is classified as prime farmland — the USDA's highest productivity rating. The main crops are soybeans, corn, small grains, and hay."
  - "Steeper slopes stay in timber. The natural vegetation of Menfro soil is deciduous hardwood forest — bur oak, white oak, chinkapin oak, black walnut, white ash, shagbark hickory, and in the bottomlands along the rivers, pecan. Where these forests were cleared and the slope was gentle enough to plow, they became some of Missouri's most productive fields."
  - "Managing Menfro on slopes requires care. The same fine, silty texture that makes the soil fertile also makes it erodible when groundcover is removed. Farmers and conservationists have worked for generations to keep contour farming, cover crops, and buffer strips in place on the steeper Menfro ground."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Menfro Silt Loam Facts
  facts:
  - "Designated official: 2004, through Missouri House Concurrent Resolution 10. Named for the town of Menfro in Perry County, east-central Missouri."
  - "Coverage: more than 780,000 acres in 40 Missouri counties along the Missouri and Mississippi River corridors."
  - "The state capitol in Jefferson City, the first Missouri state capitol in St. Charles, and the governor's mansion all stand on Menfro silt loam."
  - "Menfro was chosen as the first state soil displayed when USDA, the Soil Science Society of America, and the Smithsonian Institution launched their traveling exhibit of state soil monoliths."
  - "The argillic horizon in Menfro runs nearly six feet deep — one of the thickest clay-enriched subsoils of any state soil in the country. Most soils develop clay layers 20 to 40 inches deep."
  - "Menfro formed in loess deposits 6 to 20 feet thick. The loess was blown from glacial Mississippi River sandbars during the Ice Age, the same source that built the Natchez Bluffs further south."
  - "Classified as a Typic Hapludalf, Menfro is an Alfisol: a productive, forest-derived soil with a clay-enriched subsoil and moderate to high natural fertility."

