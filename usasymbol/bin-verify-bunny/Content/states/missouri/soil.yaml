seo_title: "Missouri State Soil | Menfro Silt Loam Series"
seo_description: "The Missouri state soil is the Menfro silt loam series, designated in 2004. It covers 780,000+ acres along the Missouri River and grows corn and soybeans."
hero_image: /images/soils/missouri/missouri-state-soil-hero.webp
