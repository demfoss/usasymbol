faq:
- question: What is Missouri's state soil?
  answer: "Missouri's state soil is the Menfro silt loam, a deep loess soil covering more than 780,000 acres in 40 counties along the Missouri and Mississippi River corridors. The Legislature designated it the official state soil in 2004 through House Concurrent Resolution 10."
- question: Why is it called Menfro soil?
  answer: "The series is named after the small town of Menfro in Perry County, east-central Missouri, near the Mississippi River. Soil scientists first established and described the series in that area."
- question: What color is Menfro silt loam?
  answer: "The thin surface layer is dark brown. Below it, the eluvial zone is a lighter brown. The thick subsoil — which runs nearly six feet deep — is dark yellowish brown from the clay and iron that accumulated there over thousands of years. The deep parent loess below is yellowish brown."
- question: Where is Menfro soil found in Missouri?
  answer: "Menfro silt loam covers 40 Missouri counties along the Missouri and Mississippi Rivers and their major tributaries. It sits on the upland ridgetops above the river floodplains, running from the northeast corner of the state through the central Missouri River corridor."
- question: What grows in Menfro soil?
  answer: "The main crops are soybeans, corn, small grains, and hay. On steeper slopes, Menfro supports hardwood forest — bur oak, white oak, black walnut, white ash, hickory, and pecan. It is classified as prime farmland on slopes under 6 percent."
- question: Who chose Menfro as Missouri's state soil?
  answer: "The Missouri Legislature designated Menfro through House Concurrent Resolution 10 in 2004. Menfro was selected because it is the most extensive loess soil in the state, covers 40 counties, underlies Missouri's most important historic buildings, and was recognized by the Smithsonian Institution as the first state soil displayed in their national soil monolith exhibit."
- question: How deep is Menfro soil?
  answer: "The profile extends at least 80 inches deep, with the argillic clay horizon running nearly six feet. The underlying loess parent material continues below that, reaching 6 to 20 feet total depth in the bluffs. It is one of the deepest and most developed soils in Missouri."

