sections:
  - id: overview
    icon: fa-solid fa-music
    title: Maryland State Dance
    paragraphs:
      - "Maryland named square dance its official state folk dance in 1994. The choice recognized a dance already woven into the state's fairground and community-hall calendar, where callers had directed local dancers for decades."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each pair facing the center, ready to follow a caller's spoken instructions. The caller names each figure moments before dancers perform it, so the pattern unfolds live rather than from memorized choreography."
      - "Music comes from a string band built around fiddle, banjo, and guitar, often with a driving, steady tempo that keeps eight dancers moving in time. Figures send couples circling, crossing, and swinging past one another until the square re-forms in its original spots."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand facing the center, each pair on one side of the square, with partners side by side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner, then to the dancer on your other side, the corner, before the figures begin."
      - title: "Circle Left, Then Right"
        description: "All eight dancers join hands and move around the square in one direction, then reverse and circle back."
      - title: "Do-Si-Do with Your Partner"
        description: "Pass right shoulders with your partner, walk a small circle back to back, then return to place."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the square back to your home position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Maryland
    paragraphs:
      - "By the time Maryland made its choice, square dance had already spread through the state's county fairs, church halls, and 4-H events, where local clubs met on a regular schedule. That everyday presence gave lawmakers a dance already tied to community life rather than a symbolic import."
      - "Maryland's designation also fit a broader national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance clubs urged state legislatures to adopt the dance as an official folk dance. Maryland's callers and clubs took part in that same push."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Square Dance Became Maryland's Dance"
    paragraphs:
      - "Maryland designated square dance its official state folk dance in 1994, joining a long list of states that acted during the national campaign led by square-dance callers' organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Maryland adopted square dance as its official state folk dance in 1994."
      - "Maryland's square dance clubs have long met at county fairs and community halls across the state."
      - "A caller directs every figure out loud, so no two square dances unfold exactly the same way."
      - "Square dance music is traditionally played by a string band of fiddle, banjo, and guitar."
      - "Dozens of U.S. states adopted square dance as an official folk dance between the 1970s and 1990s."

