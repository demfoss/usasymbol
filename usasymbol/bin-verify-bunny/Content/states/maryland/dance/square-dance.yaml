faq:
  - question: What is Maryland's state dance?
    answer: "Maryland's official state folk dance is square dance, adopted in 1994."
  - question: When did Maryland adopt square dance as its state dance?
    answer: "Maryland adopted square dance as its official state folk dance in 1994."
  - question: Why did Maryland choose square dance?
    answer: "Square dance was already active at Maryland's county fairs and community halls, and callers' associations across the country were pressing states to give it official status."
  - question: Is square dance the same in every state?
    answer: "The basic figures such as circling, do-si-do, and promenade are shared nationwide, but local clubs and callers develop their own regional style and calling patterns."

