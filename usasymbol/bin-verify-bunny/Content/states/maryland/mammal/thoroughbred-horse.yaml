faq:
  - question: "What is Maryland's state horse?"
    answer: "Maryland's state horse is the Thoroughbred (Equus caballus), designated in 1989. Maryland was the first state to designate the Thoroughbred as its official state horse, preceding Kentucky's similar designation by seven years."

  - question: "When was the Thoroughbred designated as Maryland's state horse?"
    answer: "The Thoroughbred became Maryland's official state horse on May 10, 1989, through House Bill 912, recognizing the breed's importance to Maryland's racing heritage and the state's hosting of the Preakness Stakes."

  - question: "Why did Maryland choose the Thoroughbred as its state horse?"
    answer: "Maryland chose the Thoroughbred to honor the state's centuries-old racing heritage and celebrate the Preakness Stakes, the second jewel of racing's Triple Crown, which has been run at Baltimore's Pimlico Race Course since 1873. Maryland's Thoroughbred racing tradition dates to colonial times, and the industry generates hundreds of millions of dollars annually for the state economy."

  - question: "What is the Preakness Stakes?"
    answer: "The Preakness Stakes is America's second-oldest Thoroughbred race and the second leg of racing's Triple Crown. Run annually on the third Saturday in May at Pimlico Race Course in Baltimore since 1873 (with brief exception), the race attracts 100,000+ spectators and is Maryland's most famous sporting event. Winning horses are draped in blankets of black-eyed Susans (Maryland's state flower)."

  - question: "Where is Pimlico Race Course?"
    answer: "Pimlico Race Course is located in northwest Baltimore, Maryland. Opened in 1870, it's the second-oldest continuously operating racetrack in the United States. Pimlico's distinctive cupola with weather vane has become an iconic Maryland symbol, and the track hosts the Preakness Stakes each May."

  - question: "Does Maryland have Thoroughbred breeding farms?"
    answer: "Yes, Maryland maintains significant Thoroughbred breeding operations, particularly in central Maryland counties including Baltimore, Howard, Anne Arundel, Carroll, and Montgomery. Notable farms include Sagamore Farm and Country Life Farm. While smaller than Kentucky's breeding industry, Maryland produces quality Thoroughbreds that compete successfully at major race meets nationwide."

  - question: "What is Maryland Million Day?"
    answer: "Maryland Million Day is an annual race day featuring restricted races exclusively for Maryland-bred or Maryland-sired Thoroughbreds. Established in 1986, the event offers substantial purses to encourage quality breeding within Maryland and rewards breeders who maintain operations in the state. It demonstrates Maryland's commitment to supporting its Thoroughbred breeding industry."

  - question: "Did Maryland or Kentucky designate the Thoroughbred first?"
    answer: "Maryland designated the Thoroughbred as its official state horse in 1989, seven years before Kentucky adopted the same breed in 1996. Maryland was the first state to officially recognize the Thoroughbred, though Kentucky's larger breeding industry and Kentucky Derby make it more commonly associated with the breed."

