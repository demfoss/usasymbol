title: "Maryland State Horse | Thoroughbred Horse"
scientific_name: "Equus caballus"
adopted_year: 1989

seo_title: "Maryland State Horse | Thoroughbred Horse"
seo_description: "Maryland's state horse is the Thoroughbred Horse, adopted in 1989. Learn why this official Maryland symbol was chosen and what it represents."

intro_text: "The Thoroughbred Horse is the official Maryland state horse, designated in 1989. This page gives the direct answer for searches like 'maryland state horse', 'maryland state animal', and 'maryland state mammal' while explaining how the symbol fits the state's official animal designations. Preakness Stakes at Pimlico, Maryland's racing heritage dating to colonial era, breeding operations throughout central Maryland. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Thoroughbred"
official_since: "1989"
status: "Domesticated breed; Maryland maintains significant Thoroughbred breeding and racing industry"
habitat_in_state: "Breeding farms in central Maryland counties, training facilities at Laurel Park and Pimlico, private estates statewide"
known_for: "Preakness Stakes at Pimlico, Maryland's racing heritage dating to colonial era, breeding operations throughout central Maryland"

size: "15 to 17 hands high (60-68 inches at shoulder)"
weight: "1,000 to 1,200 pounds"
coloration: "Bay (brown with black mane and tail) most common; also chestnut, black, gray, roan; white facial markings and leg markings frequent"
distinctive_traits: "Athletic build with deep chest, long legs, refined head, thin skin, high-strung temperament, bred specifically for speed and stamina"

habitat: "Breeding farms, training facilities, racetracks throughout Maryland"
range_in_state: "Concentrated in central Maryland counties including Baltimore, Howard, Anne Arundel, Carroll, and Montgomery; also training operations in Prince George's County"
conservation_status: "Breed well-maintained through strict studbook requirements; Maryland Thoroughbred population stable"
where_to_find: "Pimlico Race Course in Baltimore, Laurel Park in Laurel, Thoroughbred breeding farms in central Maryland counties, Maryland Horse Breeders Association events"
symbol_connections: "Represents Maryland's colonial racing heritage; embodies Preakness Stakes tradition since 1873; symbolizes economic importance of racing and breeding industries; connects to Maryland's gentleman-farmer culture; reflects state's role in American Thoroughbred history"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Maryland General Assembly designated the Thoroughbred horse as the official state horse on May 10, 1989, through House Bill 912. The designation recognized Maryland's deep historical connections to Thoroughbred racing, dating to colonial times, and celebrated the Preakness Stakes—one of American sports' most prestigious events—which has been run at Baltimore's Pimlico Race Course since 1873, in line with language on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine)."
      - "Maryland was the first state to designate the Thoroughbred as its official state horse, preceding Kentucky's similar designation by seven years. This priority reflected Maryland's determination to claim its place in American Thoroughbred history despite Kentucky's larger breeding industry. The designation honored Maryland's unique contributions to American racing, including hosting the nation's first organized race meets and maintaining one of America's oldest continuously operating racetracks."

    subsections:
      - subtitle: "Why Maryland Chose the Thoroughbred"
        text: "Maryland selected the Thoroughbred to celebrate the state's centuries-old racing heritage and the Preakness Stakes' role in Maryland's national identity. The Preakness, first run in 1873 at Pimlico Race Course in Baltimore, is the second jewel of racing's Triple Crown and Maryland's most famous sporting event. Each May, the Preakness attracts 100,000+ spectators and generates millions in economic impact while broadcasting images of Baltimore and Maryland to worldwide audiences. The Thoroughbred designation ensured this economic and cultural importance received official recognition as a state symbol."

      - subtitle: "Colonial Racing Heritage"
        text: "Maryland's Thoroughbred history extends to the 1740s when colonial gentleman-farmers imported English Thoroughbreds and established race courses throughout the colony. Maryland racing culture developed among the colony's elite families who viewed horse racing as aristocratic sport demonstrating wealth and breeding sophistication. These colonial race meets often occurred on public roads or fields, attracting large crowds and significant wagering. Maryland's early embrace of organized Thoroughbred racing made it a center of American racing culture that persists through Pimlico and the Preakness."

  - id: "state-symbolism"
    title: "What the Thoroughbred Represents"
    style: "highlight"
    paragraphs:
      - "The Thoroughbred represents Maryland's colonial aristocratic heritage and the gentleman-farmer culture that shaped the state's identity. Unlike states where Thoroughbred racing developed in the 19th or 20th centuries, Maryland's racing tradition traces continuously to the 1700s when wealthy planters imported English Thoroughbreds and competed at private race courses. This early adoption of elite racing culture created a Maryland tradition of horse breeding and racing that predates American independence and continues through modern operations at Pimlico and Laurel Park."
      - "The designation celebrates the Preakness Stakes' role in Maryland's national identity. For two minutes in May, the Preakness places Maryland—and specifically Baltimore—at the center of American sports consciousness. The race's traditions including painting the weather vane atop Pimlico's cupola in winning jockey's colors, draping winners in Maryland's state flower (black-eyed Susan), and the ceremonial playing of 'Maryland, My Maryland' create powerful associations between the state and America's premier horse race while reinforcing heraldry on the [Maryland state flag page](/states/maryland/flag/maryland-state-flag). The Thoroughbred designation extends this symbolic importance beyond the single Preakness weekend to year-round recognition."
      - "The designation acknowledges the economic importance of Maryland's Thoroughbred industry, which generates hundreds of millions of dollars annually through breeding, training, racing, and ancillary services. Maryland maintains significant breeding operations particularly in central counties where farms produce quality Thoroughbreds sold at major yearling sales. Training facilities at Laurel Park and Pimlico employ thousands. Ancillary industries including veterinary services, feed production, and specialized equipment manufacturing create additional economic activity. The state designation recognizes this economic contribution while celebrating Maryland's racing heritage."

    subsections:
      - subtitle: "Pimlico and Old Hilltop"
        text: "Pimlico Race Course, nicknamed 'Old Hilltop,' opened in 1870 and is the second-oldest racetrack in continuous operation in the United States (after Saratoga). The track's founder, Maryland governor Oden Bowie, established Pimlico to bring quality racing to Baltimore and created the Preakness Stakes in 1873. The race was named for Preakness, a horse that won the Dinner Party Stakes (Pimlico's first major race) in 1870. Pimlico has hosted the Preakness continuously except for 1890-1908 when the race ran at Gravesend and Morris Park in New York. The track's distinctive cupola with weather vane has become an iconic Maryland image."

      - subtitle: "The Preakness Stakes Tradition"
        text: "The Preakness Stakes, run on the third Saturday in May at Pimlico, serves as the second leg of racing's Triple Crown. The race covers 1 3/16 miles for three-year-old Thoroughbreds, positioned between the Kentucky Derby (May) and Belmont Stakes (June). Thirteen horses have won the Triple Crown, all passing through Maryland's Preakness. The race's traditions including the painting of the cupola weather vane in winning silks, the draping of black-eyed Susan flowers (Maryland's state flower), and massive crowds creating Baltimore's largest single-day sporting event make the Preakness central to Maryland identity."

      - subtitle: "Maryland Breeding Heritage"
        text: "Maryland has produced numerous important Thoroughbreds throughout history, though its breeding industry is smaller than Kentucky's. Country Life Farm in Bel Air has operated continuously since 1933, maintaining Maryland's breeding traditions. Sagamore Farm in Baltimore County, established by Alfred Vanderbilt and later owned by Kevin Plank (Under Armour founder), has produced stakes winners and maintains Maryland's tradition of elite breeding operations. Central Maryland counties including Baltimore, Howard, and Carroll maintain numerous breeding farms, creating a landscape of white-fenced paddocks and horse barns characteristic of Thoroughbred country."

      - subtitle: "Economic Impact"
        text: "Maryland's Thoroughbred industry contributes an estimated $500+ million annually to the state economy, supporting over 10,000 jobs. Pimlico and Laurel Park conduct live racing much of the year, employing trainers, jockeys, grooms, exercise riders, and track personnel. Breeding farms employ farm managers, veterinarians, breeding technicians, and agricultural workers. Ancillary industries including feed suppliers, veterinary practices, farriers, and specialized equipment providers depend on the Thoroughbred industry. The Preakness alone generates an estimated $100+ million economic impact through tourism, hospitality, and related spending across a region summarized in [states neighboring states](/rankings/geography/states-neighboring-states)."

      - subtitle: "Maryland Million Day"
        text: "Maryland's Thoroughbred industry created Maryland Million Day, an annual race day featuring restricted races for Maryland-bred or Maryland-sired horses. Established in 1986, Maryland Million rewards Maryland breeders and encourages quality breeding within the state by offering substantial purses for horses with Maryland connections. The event attracts Maryland breeding operations' best horses and demonstrates state commitment to supporting its Thoroughbred industry. Maryland Million Day embodies the state's desire to maintain viable breeding operations despite competition from Kentucky and other racing states."

  - id: "identification"
    title: "How to Identify Thoroughbreds"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Thoroughbreds are hot-blooded horses bred exclusively for racing performance, displaying physical characteristics that reflect centuries of selective breeding for speed, stamina, and competitive spirit. Maryland Thoroughbreds show the same characteristics as those bred elsewhere, though Maryland breeding operations often emphasize certain bloodlines and racing styles."
        list_items:
          - "**Size**: 15-17 hands high (60-68 inches at shoulder); average 16 hands"
          - "**Weight**: 1,000-1,200 pounds; racing weight typically 1,000-1,100 pounds"
          - "**Build**: Deep chest, long legs, refined head, sloped shoulders, powerful hindquarters"
          - "**Color**: Bay most common (50%), chestnut (30%), dark bay/brown (10%), black, gray, roan less common"

      - subtitle: "Thoroughbred Type and Variation"
        text: "While all Thoroughbreds share basic characteristics, breeders produce horses suited for different racing distances and surfaces. 'Sprinters' are more muscular with powerful hindquarters for explosive speed over short distances (5-7 furlongs). 'Classic distance' horses show more refined builds with longer, leaner frames suited for stamina over 9-12 furlongs. 'Turf' horses often have slightly different builds than dirt specialists. Maryland breeding operations have historically emphasized horses suited to middle distances (7-9 furlongs) and versatility across dirt and turf surfaces."

      - subtitle: "Quality Assessment"
        text: "Thoroughbred quality assessment involves conformation analysis—evaluating how physical structure predicts athletic ability. Desired traits include straight, correct legs, balanced proportions, good bone substance, clean joints, and proper angles throughout the body. Maryland yearling sales at Timonium attract buyers seeking quality prospects, with professional bloodstock agents evaluating horses based on conformation, pedigree, and physical presence. Subtle conformation differences can mean hundreds of thousands of dollars in valuation at sales."

  - id: "history"
    title: "Thoroughbreds in Maryland History"
    style: "default"
    paragraphs:
      - "Maryland's Thoroughbred history begins in the colonial era when wealthy planters imported English Thoroughbreds in the 1740s-1760s to improve local horse stock and establish racing culture modeled on English traditions. Samuel Ogle, colonial governor of Maryland from 1747-1752, imported the stallion Spark from England in 1747, establishing one of Maryland's first documented Thoroughbred bloodlines. Other colonial families including the Carrolls, Ridgelys, and Lloyds imported breeding stock, creating Maryland's foundation as an American racing center."
      - "Colonial Maryland racing occurred primarily on straight quarter-mile 'race paths' cut through fields or along public roads, though some estates maintained longer oval courses. These early races attracted substantial wagering and social gatherings, establishing horse racing as elite entertainment in colonial Maryland. After American independence, Maryland racing continued expanding with establishment of Maryland Jockey Club in 1743 (one of America's first racing organizations) and construction of dedicated racetracks including Pimlico in 1870."

    subsections:
      - subtitle: "Colonial Racing Culture"
        text: "Colonial Maryland developed racing culture among its elite planter class who viewed horse racing as aristocratic sport demonstrating breeding, wealth, and gentlemanly values. Racing often occurred during court sessions when planters gathered in county seats, creating social occasions around competition. Races featured significant wagering—some matches involved hundreds of pounds sterling (enormous sums in colonial currency). This colonial racing culture established Maryland traditions that continue through modern Pimlico racing and the Preakness Stakes."

      - subtitle: "The Creation of Pimlico"
        text: "Maryland governor Oden Bowie established Pimlico Race Course in 1870 after attending the English Derby. Impressed by English racing's elegance and organization, Bowie determined that Baltimore needed a first-class racetrack. He organized the Maryland Jockey Club, purchased land northwest of Baltimore, and constructed Pimlico including its distinctive cupola. The track opened October 25, 1870, with the Dinner Party Stakes won by a colt named Preakness. This horse's victory inspired Bowie to create the Preakness Stakes in 1873, establishing the race that would define Maryland Thoroughbred racing."

      - subtitle: "Preakness Stakes History"
        text: "The first Preakness Stakes ran May 27, 1873, at Pimlico with seven three-year-olds competing for a $1,000 purse. Survivor won the inaugural running. The race continued at Pimlico until 1889, then moved to New York tracks (Gravesend and Morris Park) from 1890-1908 due to anti-gambling sentiment in Maryland. The Preakness returned to Pimlico in 1909 where it has run continuously since. The race became the second leg of the Triple Crown (established as concept in 1930) and grew into one of American sports' most prestigious events."

      - subtitle: "Maryland-Bred Champions"
        text: "Maryland has produced numerous champions including Native Dancer, the gray colt who became one of racing's most famous horses in the 1950s. Foaled at Dan W. Scott's Sagamore Farm near Baltimore in 1950, Native Dancer won 21 of 22 career starts including the Preakness and Belmont Stakes (he finished second in the Kentucky Derby). His televised races introduced millions to Thoroughbred racing and demonstrated Maryland breeding quality. Other Maryland-bred champions include Cigar (1990s Horse of the Year), Strike the Gold (1991 Kentucky Derby winner), and Point Given (2001 Preakness and Belmont winner)."

      - subtitle: "Modern Maryland Racing"
        text: "Maryland maintains two major racetracks—Pimlico in Baltimore and Laurel Park in Laurel—conducting live racing much of the year. However, Maryland racing faces challenges including declining attendance, competition from casino gambling, and infrastructure needs at aging Pimlico. The track's future has been debated, with proposals ranging from major renovation to relocation of the Preakness. Despite challenges, the 1989 Thoroughbred designation and Maryland's commitment to maintaining the Preakness at Pimlico demonstrate state determination to preserve its racing heritage."

  - id: "behavior"
    title: "Thoroughbred Temperament and Abilities"
    style: "default"

    subsections:
      - subtitle: "Racing Ability and Athletic Performance"
        text: "Thoroughbreds are bred exclusively for racing, developing physical and mental characteristics that enable sustained high-speed running while carrying a jockey. Elite Thoroughbreds maintain speeds exceeding 40 mph for over a minute, demonstrating extraordinary athletic capacity. This ability reflects both physical adaptations (enlarged heart and lungs, efficient oxygen transport, powerful muscles) and mental traits including competitive drive and willingness to run through fatigue. The best racehorses demonstrate courage and determination that separate champions from mere fast horses."

      - subtitle: "Hot-Blooded Temperament"
        text: "Thoroughbreds exhibit sensitive, high-strung temperaments reflecting their hot-blooded heritage from Arabian and Barb ancestors. They react strongly to stimuli, require careful handling, and can be difficult for novice horsemen. This nervous energy, while challenging, often translates to competitive spirit on the racetrack. Maryland training operations employ specialized personnel who understand Thoroughbred psychology, using patient methods and consistent routines to manage these sensitive athletes while preparing them for racing competition."

      - subtitle: "Post-Racing Careers"
        text: "Most Thoroughbreds do not succeed at elite racing levels and transition to second careers. Maryland maintains active Thoroughbred aftercare programs helping horses transition from racing to new careers including show jumping, eventing, polo, dressage, and pleasure riding. The Maryland Thoroughbred Retirement Program, established in the 1990s, coordinates placement of retired racehorses. However, many Thoroughbreds struggle adapting from racing to other disciplines due to physical wear from training and racing-specific conditioning. Aftercare remains an important industry concern."

  - id: "conservation"
    title: "Maryland's Thoroughbred Industry Today"
    style: "default"
    paragraphs:
      - "Maryland maintains a significant Thoroughbred industry centered on Pimlico Race Course, Laurel Park, and breeding farms throughout central Maryland counties. The industry faces challenges including declining racing interest, competition from casino gambling, and infrastructure needs at aging facilities. However, Maryland's commitment to maintaining the Preakness at Pimlico and supporting breeding through Maryland Million Day demonstrates determination to preserve the state's racing heritage."

    subsections:
      - subtitle: "Current Challenges"
        text: "Maryland racing confronts multiple challenges threatening long-term viability. Pimlico Race Course requires major renovation or replacement—the 150+ year old facility suffers from aging infrastructure and deferred maintenance. Declining racing attendance and handle (wagering amounts) reduce revenue, squeezing profit margins. Competition from casino gambling diverts entertainment spending. High-profile racing injuries generate negative publicity. These challenges require solutions balancing heritage preservation with economic reality."

      - subtitle: "Pimlico's Future"
        text: "Pimlico's deteriorating infrastructure has sparked debate about the track's future and the Preakness Stakes' location. Proposals have included major renovation at the current site, relocating the Preakness to Laurel Park (a newer, better-maintained facility), or building an entirely new facility. Maryland's 1989 Thoroughbred designation and the Preakness's cultural importance create pressure to maintain the race at historic Pimlico. Recent commitments from Maryland government and racing industry stakeholders aim to renovate Pimlico while preserving its historic character and continuing the Preakness tradition."

      - subtitle: "Breeding Industry Support"
        text: "Maryland supports its breeding industry through programs including Maryland Million Day, breeding fund subsidies, and tax incentives for maintaining agricultural land in horse farming. Central Maryland counties maintain breeding operations producing quality Thoroughbreds sold at regional and national sales. While Maryland cannot compete with Kentucky's scale, the state maintains niche breeding operations emphasizing quality over quantity. Maryland-bred horses regularly win major stakes races, validating the state's breeding programs."

      - subtitle: "Economic Importance"
        text: "Despite challenges, Maryland's Thoroughbred industry remains economically significant. The Preakness generates an estimated $100+ million impact through tourism and hospitality spending. Year-round racing at Pimlico and Laurel employs thousands directly and indirectly. Breeding farms support agricultural employment and preserve rural landscapes in counties facing development pressure. The industry's economic contribution justifies state support through racing subsidies, breeding programs, and infrastructure investment."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Thoroughbred horse connects to Maryland's state motto, 'Fatti maschii, parole femine' (Manly deeds, womanly words), through racing's combination of athletic prowess and refined grace. Thoroughbreds demonstrate 'manly deeds' through courage and competitive spirit, running at full speed while carrying jockeys. Yet they exhibit the refined elegance suggested by 'womanly words,' with their graceful movement and aristocratic breeding. The motto's balance between strength and refinement reflects Thoroughbred characteristics—powerful yet elegant, competitive yet noble."
      - "Maryland designated the black-eyed Susan as state flower in 1918, 71 years before adopting the Thoroughbred. The flowers are intimately connected through the Preakness Stakes tradition of draping winning horses in blankets of black-eyed Susans (or actually Viking poms, which bloom in May unlike black-eyed Susans that bloom later). This floral tradition creates visual connection between state flower and state horse, with the iconic image of Preakness winners covered in yellow flowers representing Maryland's racing heritage."

    subsections:
      - subtitle: "Black-Eyed Susan and Preakness Tradition"
        text: "The Preakness Stakes winner receives a blanket of black-eyed Susans, Maryland's state flower. However, since black-eyed Susans don't bloom until summer (the race runs in May), florists create blankets from Viking poms (also called black-eyed Susans in the floral industry) that resemble the state flower and bloom appropriately. This tradition connects Maryland's state flower and state horse through the Preakness ceremony, creating one of racing's most recognizable images—the winning horse draped in thousands of yellow flowers with dark centers echoing the state flower."
        link:
          label: "See Maryland state flower"
          url: "/states/maryland/flower/black-eyed-susan"

      - subtitle: "Baltimore Oriole and State Colors"
        text: "Maryland's state bird, the Baltimore Oriole, displays orange and black coloring matching Lord Baltimore's heraldic colors. While Thoroughbreds don't share these specific colors, Maryland racing incorporates the state colors through jockey silks, Pimlico decorations during Preakness week, and promotional materials. Both symbols—the oriole through plumage, the Thoroughbred through racing tradition—celebrate Maryland heritage and create recognizable state images broadcast nationally during Baltimore Orioles baseball games and Preakness Stakes racing."
        link:
          label: "See Maryland state bird"
          url: "/states/maryland/bird/baltimore-oriole"

      - subtitle: "State Motto and Racing Spirit"
        text: "Maryland's motto 'Fatti maschii, parole femine' (Manly deeds, womanly words) captures Thoroughbred racing's essence—brave, powerful athletic performance combined with graceful elegance. Racehorses demonstrate courage running at top speed in competition, showing the 'manly deeds' the motto celebrates. Yet Thoroughbred breeding emphasizes refinement and grace, qualities suggested by 'womanly words.' The designation acknowledges that Maryland racing traditions embody the motto's balance between strength and sophistication."
        link:
          label: "See Maryland state motto"
          url: "/states/maryland/motto/fatti-maschii-parole-femine"

