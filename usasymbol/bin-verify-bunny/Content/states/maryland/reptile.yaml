sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Maryland?
    paragraphs:
      - "The diamondback terrapin is Maryland's official state reptile, designated by the Maryland General Assembly in 1994. Its scientific name is Malaclemys terrapin."
      - "It is a turtle adapted to life in the brackish waters of the Chesapeake Bay and other coastal marshes."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Diamondback Terrapin
    paragraphs:
      - "The diamondback terrapin has a shell with raised, diamond-shaped ridges, and its skin is gray or pale with dark spots or markings."
      - "It usually grows to about five to nine inches long, with females typically larger than males."
      - "It is the only North American turtle that lives in brackish water, the mix of salt and fresh water found in coastal marshes and estuaries."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Maryland General Assembly designated the diamondback terrapin the official state reptile in 1994, recognizing a turtle closely tied to the Chesapeake Bay."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Maryland Chose the Diamondback Terrapin
    paragraphs:
      - "The diamondback terrapin is closely associated with the Chesapeake Bay and has long served as a mascot for the University of Maryland, making it a natural symbol for the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Diamondback Terrapin
    paragraphs:
      - "The diamondback terrapin lives in the brackish marshes, tidal creeks, and shallow waters of the Chesapeake Bay and Maryland's coastal areas."
