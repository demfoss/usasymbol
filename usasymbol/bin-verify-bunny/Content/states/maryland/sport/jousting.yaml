sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Maryland State Sport
    paragraphs:
      - "Maryland named jousting its official state sport in 1962, choosing a sport already rooted in the colony rather than a modern import. Ring tournaments had run in Maryland since the colony's earliest English governors, giving lawmakers a genuine local tradition to formalize. The choice also reflected county fair culture more than any professional league, since Maryland jousting has always been organized around local clubs and tournaments rather than spectators."

  - id: what-is
    icon: fa-solid fa-horse
    title: "Jousting Explained"
    paragraphs:
      - "A jouster rides a horse at a gallop down an 80-yard course, aiming a lance at small metal rings suspended from three arches spaced along the track. Riders have only a few seconds to pass under all three arches and thread the lance tip through each ring without slowing down. Maryland's version, called ring jousting, replaced the medieval sport of knights charging each other with a test of speed and precision against a fixed course."
      - "Competitors are graded across skill divisions, from Leadline and Novice riders using rings nearly two inches wide to Professional riders threading rings a fraction of that size within seconds. Divisions are not separated by age or gender, so a teenager and a longtime rider can compete in the same class if their skill matches. More than twenty tournaments run across Maryland each year, organized by clubs rather than a single professional circuit."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Jousting Represents Maryland
    paragraphs:
      - "Jousting tournaments have run in Maryland since the colony's earliest years, introduced under the Calvert family's colonial rule and continuing largely unbroken since. The sport grew especially popular after the Civil War, when county fairs across Maryland adopted ring tournaments as a centerpiece event. That continuity gave Maryland a claim no other state could match: a documented, centuries-old sporting tradition specific to its own soil."
      - "Jousting also fits Maryland's preference for small, local competition over big spectator events. Clubs and county fairs, not a national league, run the tournament calendar, and riders often compete for trophies and community recognition rather than prize money. The Maryland Jousting Tournament Association, founded in 1950, still sets the rules that every sanctioned tournament in the state follows."
      - "Being first mattered too. When Maryland lawmakers looked for a sport to formalize in 1962, jousting was the one already organized, already popular at county fairs, and already unmatched by any other state's claim to the sport. That combination made Maryland's choice both easy and, as it turned out, historic."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Jousting Became Maryland's State Sport
    paragraphs:
      - "Maryland's push for an official state sport came from inside the sport itself. State Delegate Henry J. Fowler, who also served as president of the Maryland Jousting Tournament Association, introduced the legislation in early 1962. The bill passed that spring, making jousting the first sport any U.S. state had ever formally adopted."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Jousting Facts
    facts:
      - "Maryland designated jousting its official state sport in 1962, the first such designation by any U.S. state."
      - "The bill was introduced by State Delegate Henry J. Fowler, who also led the Maryland Jousting Tournament Association."
      - "Maryland's ring jousting traces back to tournaments held during the Calvert family's colonial rule."
      - "Riders gallop an 80-yard course, spearing rings suspended from three arches with a lance."
      - "The Maryland Jousting Tournament Association, founded in 1950, still sets the rules for sanctioned tournaments."

