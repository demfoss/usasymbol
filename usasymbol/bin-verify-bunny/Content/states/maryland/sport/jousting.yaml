faq:
  - question: What is Maryland's state sport?
    answer: "Maryland's official state sport is jousting, adopted in 1962."
  - question: When did Maryland adopt jousting as its state sport?
    answer: "Maryland adopted jousting as its state sport in 1962, becoming the first U.S. state to name an official sport."
  - question: Why did Maryland choose jousting?
    answer: "Jousting tournaments had run in Maryland since the colonial era and remained popular at county fairs into the 20th century. No other state had a comparable claim to the sport."
  - question: Is Maryland jousting the same as medieval combat jousting?
    answer: "No. Maryland's ring jousting has riders spear small suspended rings with a lance while galloping a set course, rather than charging at an opponent."

