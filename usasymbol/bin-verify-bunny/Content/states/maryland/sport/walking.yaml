sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Maryland State Sport
    paragraphs:
      - "Maryland named walking its official state exercise in 2008, choosing a health measure rather than a competitive sport. Lawmakers cited a national obesity epidemic and the U.S. Surgeon General's recommendation of at least 30 minutes of daily activity as reasons to recognize the simplest form of exercise. The designation joined jousting and lacrosse to give Maryland three separate official physical activities, more than any other state."

  - id: what-is
    icon: fa-solid fa-person-walking
    title: "Walking Explained"
    paragraphs:
      - "Walking, as Maryland's law describes it, is simply moving on foot at a natural pace, with no equipment, team, or venue required. The designation does not create a competitive circuit; instead, it recognizes an activity nearly every resident can already do, at any age and any fitness level. The U.S. Surgeon General recommends at least 30 minutes of walking, five days a week, as the baseline the designation points to."
      - "Maryland gives the activity organized form through groups like the Maryland Volkssport Association, which runs noncompetitive, family-friendly walking events across the state. For three decades, the best-known of these was the Chesapeake Bay Bridge Walk, held from 1975 to 2006, when pedestrians could cross a span normally open only to cars. Its successor, the Chesapeake Bay Bridge Run/Walk, launched in 2014 and now ranks among the largest 10K events in the country."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Walking Represents Maryland
    paragraphs:
      - "Maryland framed the designation around public health rather than heritage or spectacle. Lawmakers pointed to rising obesity rates and linked walking to lower blood pressure, better cholesterol, and reduced risk of diabetes and certain cancers. Unlike jousting or lacrosse, walking needed no arena, uniform, or membership to qualify as exercise."
      - "The choice also fit Maryland's landscape. The Chesapeake Bay Bridge Walk let residents experience one of the state's defining structures on foot instead of behind a windshield, drawing tens of thousands of walkers in its best years. That event, more than any stadium or tournament, showed how walking could double as both exercise and a shared Maryland experience."
      - "Being practical mattered as much as being popular. A sport needs athletes, but an exercise only needs willing feet, so Maryland's designation cost nothing to take part in and excluded no one. Thomas Jefferson once called walking 'the best possible exercise,' a line commentators pointed back to when Maryland made its case for recognizing the lowest-cost exercise there is."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Walking Became Maryland's State Exercise
    paragraphs:
      - "Maryland's legislature designated walking the state's official exercise in 2008, and Governor Martin O'Malley signed the bill into law that May. The move made Maryland the first state in the country to name an official exercise, following the same pattern that had already made it the first state to name an official sport back in 1962. Lawmakers framed the designation around Maryland's obesity rates, arguing that an activity requiring no cost, equipment, or membership deserved formal recognition."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Walking Facts
    facts:
      - "Maryland designated walking its official state exercise in 2008, the first such designation by any U.S. state."
      - "Governor Martin O'Malley signed the bill into law on May 14, 2008."
      - "The Chesapeake Bay Bridge Walk let pedestrians cross the bridge on foot from 1975 to 2006."
      - "Its successor, the Chesapeake Bay Bridge Run/Walk, began in 2014 and is now one of the largest 10K events in the country."
      - "Maryland also recognizes jousting as its state sport, adopted in 1962, and lacrosse as its state team sport, adopted in 2004."

