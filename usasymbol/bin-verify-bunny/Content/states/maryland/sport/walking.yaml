faq:
  - question: What is Maryland's state exercise?
    answer: "Maryland's official state exercise is walking, adopted in 2008."
  - question: When did Maryland adopt walking as its state exercise?
    answer: "Maryland adopted walking as its state exercise in 2008, when Governor Martin O'Malley signed the bill into law that May."
  - question: Why did Maryland choose walking?
    answer: "Lawmakers cited rising obesity rates and the U.S. Surgeon General's recommendation of 30 minutes of daily activity. Walking required no equipment, team, or cost to take part in."
  - question: Is walking Maryland's only official physical activity designation?
    answer: "No. Maryland also recognizes jousting as its official state sport, adopted in 1962, and lacrosse as its official state team sport, adopted in 2004."

