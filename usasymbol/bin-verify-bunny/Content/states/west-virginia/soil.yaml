faq:
- question: What is West Virginia's state soil?
  answer: "West Virginia's state soil is the Monongalia series, a deep, well-drained Ultisol on the upland ridges of northern and central West Virginia. It formed in residuum from Pennsylvanian sandstone and siltstone and is named after Monongalia County."
- question: Why is it called Monongalia soil?
  answer: "The series is named after Monongalia County in north-central West Virginia. The county is named for the Monongahela River, from a Lenape word referring to the river's eroding, collapsing banks. USDA soil scientists assigned the name when mapping the county during early federal soil surveys."
- question: What color is Monongalia soil?
  answer: "The surface is dark brown loam. Below it is a light yellowish brown leached zone where clay and iron have moved downward. The argillic subsoil is yellowish brown to strong brown clay loam. At the base, pale brown weathered sandstone and siltstone fragments mark the parent rock."
- question: Where is Monongalia soil found in West Virginia?
  answer: "Monongalia soil is found on upland ridges and sideslopes in northern and north-central West Virginia. It is most extensive in Monongalia, Preston, Tucker, Barbour, Taylor, Marion, and Harrison counties, at elevations between 1,000 and 2,500 feet on the Appalachian Plateau."
- question: What grows in Monongalia soil?
  answer: "Corn, hay, oats, and winter wheat are the main crops. Beef cattle pasture covers steeper sideslopes. The natural forest is oak-hickory — white oak, red oak, chestnut oak, shagbark hickory, and red maple on the ridges, with tulip poplar and black cherry on the upper sideslopes."
- question: How deep is Monongalia soil?
  answer: "Monongalia soil is typically 48 to 60 inches deep to weathered parent rock. The surface loam is about 5 inches deep, the argillic clay subsoil begins around 12 inches and extends to about 38–50 inches, and weathered sandstone fragments appear below that."
- question: What rock does Monongalia soil come from?
  answer: "Monongalia soil formed in residuum from Pennsylvanian-age sandstone, siltstone, and some shale — the same bedrock that contains West Virginia's bituminous coal seams. Weathering broke down the rock surface in place over thousands of years without glacial disturbance."

