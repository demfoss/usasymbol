- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Monongalia Soil
  paragraphs:
  - "Corn and hay are the main crops on Monongalia soil in northern West Virginia. The well-drained loamy surface tills easily in spring, warms quickly, and holds enough summer moisture for corn to reach maturity without irrigation. Hay — primarily orchardgrass and alfalfa — covers large areas of gently sloping Monongalia soil ridges across Monongalia, Barbour, and Taylor counties."
  - "Oats and winter wheat are grown in rotation on flatter ridgetop areas. Pasture for beef cattle covers much of the landscape where Monongalia soil grades onto steeper sideslopes not suited for row crops. Small vegetable operations and hay production for local dairies account for most remaining farmland in the northern counties."
  - "Oak-hickory forest is the natural vegetation on Monongalia soil. White oak, red oak, chestnut oak, shagbark hickory, and red maple dominate the upland ridges. Tulip poplar and black cherry grow on the upper sideslopes where moisture is slightly higher. Where farmland reverts to forest, black locust and sassafras pioneer before oaks reclaim the canopy."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monongalia Soil Facts
  facts:
  - "Monongalia soil is classified as a fine-loamy, mixed, active, mesic Typic Hapludult — an Ultisol formed in residuum from sandstone and siltstone, with an argillic clay subsoil and base saturation below 35 percent. The mesic temperature classification means the mean annual soil temperature falls between 8°C and 15°C, placing it in the cooler half of the Appalachian uplands."
  - "The series name traces back through Monongalia County to the Monongahela River. Lenape people used the river name for its distinctive eroding banks — an apt description of the stream-cut landscape where Monongalia soil hillslopes grade into steep valley walls above the river below."
  - "Monongalia soil formed entirely in residuum — rock that weathered in place from Pennsylvanian-age sandstone and siltstone. No glaciers reached northern West Virginia to disturb or bury the profile, so the soil reflects uninterrupted chemical weathering over thousands of years in a humid Appalachian climate."
  - "The same Pennsylvanian rock formations that weather into Monongalia soil contain the Pittsburgh and Sewickley coal seams — the most productive bituminous coal beds in Appalachian history. Mining those seams built the economic core of northern West Virginia for more than a century while Monongalia soil covered the surface above."
  - "Monongalia soil is moderately permeable — water infiltrates the loamy surface at a moderate rate and moves into the argillic subsoil rather than running off. This permeability makes the soil resistant to short drought stress but limits water-holding capacity compared to heavier clay soils found in other parts of the state."

