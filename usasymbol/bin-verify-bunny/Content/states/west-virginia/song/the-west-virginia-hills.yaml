sections:
  - id: overview
    icon: fa-solid fa-music
    title: West Virginia State Song
    paragraphs:
      - "\"The West Virginia Hills\" is one of West Virginia's four official state songs. Ellen Ruddell King wrote the words as a poem in 1885, and Henry Everett Engle of Gilmer County set them to music soon after, decades before the Legislature gave the song official status alongside three others."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"The West Virginia Hills\" Explained"
    paragraphs:
      - "The song is a nostalgic ode to the rounded, forested hills of West Virginia, written in the voice of someone longing for home. Its melody is slow and hymn-like, closer to a parlor song than a march, reflecting its origin as a nineteenth-century poem set to music."
      - "Ellen Ruddell King wrote the original verses in Gilmer County, and Henry Everett Engle, a local composer, added the music and chorus, copyrighting the song in 1886. It later appeared in \"The West Virginia Singer,\" a 1913 songbook that helped spread it across the state's schools."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "The West Virginia Hills" Represents West Virginia
    paragraphs:
      - "The song's central image, rolling hills a person longs to return to, matches how West Virginians often describe their own state, nicknamed the Mountain State. Its age also gave it a claim as the most established of the state's several song candidates."
      - "By the time lawmakers took up the question of an official state song, \"The West Virginia Hills\" had already been sung in schools for decades, giving it a familiarity that newer entries could not match."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"The West Virginia Hills\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "The West Virginia Hills" Became West Virginia's State Song
    paragraphs:
      - "West Virginia's Legislature first designated \"The West Virginia Hills\" an official state song in 1961, nearly eighty years after it was written. In 1963, the year of the state's centennial, lawmakers added \"This Is My West Virginia\" and declared it equal in status alongside \"The West Virginia Hills\" and the earlier \"West Virginia, My Home Sweet Home,\" a rare case of a state naming multiple equally official songs rather than choosing one."
      - "West Virginia added a fourth official song decades later, when \"Take Me Home, Country Roads\" by John Denver, Bill Danoff, and Taffy Nivert joined the list in 2014. That addition brought a nationally famous song into the same official status as the three older, lesser-known hymns to the hills."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of West Virginia

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"The West Virginia Hills\" Facts"
    facts:
      - "West Virginia recognizes \"The West Virginia Hills\" as one of its four official state songs, all equally official."
      - "Ellen Ruddell King wrote the lyrics as a poem in 1885."
      - "Henry Everett Engle of Gilmer County composed the music and added the chorus."
      - "The Legislature declared it an official state song in 1961 and reaffirmed it alongside three other songs by 1963."
      - "\"Take Me Home, Country Roads\" by John Denver became the state's fourth official song in 2014."

