faq:
  - question: What is West Virginia's state song?
    answer: "\"The West Virginia Hills\" is one of West Virginia's four official state songs, alongside \"This Is My West Virginia,\" \"West Virginia, My Home Sweet Home,\" and \"Take Me Home, Country Roads.\""
  - question: Who wrote West Virginia's state song?
    answer: "Ellen Ruddell King wrote the lyrics in 1885, and Henry Everett Engle composed the music."
  - question: When did West Virginia adopt "The West Virginia Hills" as its state song?
    answer: "The Legislature designated it an official state song in 1961 and grouped it with three other equally official songs by 1963."
  - question: Why does West Virginia have four official state songs?
    answer: "Lawmakers added songs over time rather than replacing earlier ones, most recently adding \"Take Me Home, Country Roads\" in 2014, so all four now share equal official status."

