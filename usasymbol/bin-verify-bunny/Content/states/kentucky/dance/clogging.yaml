faq:
  - question: What is Kentucky's state dance?
    answer: "Kentucky's state symbol dance is clogging, adopted in 2006."
  - question: When did Kentucky adopt clogging as its state dance?
    answer: "Kentucky adopted clogging as a state symbol in 2006."
  - question: Why did Kentucky choose clogging?
    answer: "Clogging grew directly out of Kentucky's Appalachian mountain communities alongside bluegrass string-band music, giving the state a percussive dance tradition distinct from square dance."
  - question: What is the difference between clogging and square dance?
    answer: "Clogging is percussive footwork danced solo or in synchronized teams, while square dance is a partnered formation dance led by a caller. Kentucky is one of only two states, along with North Carolina, to name clogging instead of square dance."

