sections:
  - id: overview
    icon: fa-solid fa-music
    title: Kentucky State Dance
    paragraphs:
      - "Kentucky designated clogging a state symbol in 2006, naming a percussive step dance that had already shaped the state's mountain music scene for generations. The choice set Kentucky apart from most states, which instead adopted square dance."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Clogging Explained"
    paragraphs:
      - "Clogging is a percussive step dance in which the feet strike the floor in rhythm with the music, keeping the upper body relatively still while the footwork carries the beat. Dancers stay low and close to the ground, producing a sound closer to tap dance than to a partnered formation dance."
      - "Kentucky's clogging tradition ties closely to Appalachian bluegrass, danced to string-band music built around fiddle, banjo, and guitar. Dancers may perform in precision teams that repeat synchronized step patterns or dance solo in a freer, improvised style."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Clogging
    steps:
      - title: "Find the Beat in the String Band"
        description: "Stand with knees slightly bent and listen for the steady pulse carried by the fiddle and banjo before starting any footwork."
      - title: "Learn the Basic Shuffle Step"
        description: "Brush the ball of one foot forward and back against the floor, then step down, keeping the motion low and close to the ground."
      - title: "Add the Double Toe"
        description: "Tap the toe of the working foot twice in quick succession before stepping, layering in the percussive sound clogging is known for."
      - title: "Dance in a Precision Team"
        description: "Line up with other dancers in rows and repeat the same step pattern together, staying locked to the same beat."
      - title: "Try Freestyle Footwork"
        description: "Improvise steps over the tune instead of following a set team pattern, a style rooted in solo mountain dance traditions."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Clogging Represents Kentucky
    paragraphs:
      - "Clogging grew out of Kentucky's Appalachian mountain communities, where it developed alongside bluegrass string-band music built around fiddle, banjo, and guitar. That pairing of footwork and music became a signature of the state's eastern mountain counties."
      - "Kentucky is one of only two states, along with North Carolina, to name clogging as its dance rather than square dance, setting it apart from the wave of states that chose square dance in the 1970s through 1990s."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Clogging Became Kentucky's State Dance
    paragraphs:
      - "The Kentucky General Assembly designated clogging a state symbol in 2006."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Clogging Facts
    facts:
      - "Kentucky adopted clogging as a state symbol in 2006."
      - "Kentucky is one of only two states, along with North Carolina, to name clogging over square dance."
      - "Kentucky's clogging tradition developed alongside Appalachian bluegrass string-band music."
      - "Clogging can be danced in precision teams with synchronized steps or performed solo in a freestyle style."

