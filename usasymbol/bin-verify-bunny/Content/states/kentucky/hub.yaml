name_meaning:
  heading: What Does Kentucky Mean?
  paragraphs:
  - Kentucky is the 15th U.S. state, admitted to the Union on June 1, 1792. The name comes from an Indigenous place name, though the exact source language and meaning are not settled in the existing nickname material.
  - The Bluegrass State nickname is more concrete than the state-name etymology. It points to Kentucky bluegrass, the limestone-rich Bluegrass Region, and the horse farms that made central Kentucky famous.
  - Kentucky's postal abbreviation is KY, and residents are Kentuckians. The Commonwealth also has two official mottos, with United We Stand, Divided We Fall rooted in Revolutionary-era political language.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From an Indigenous place name; older explanations vary and should be treated carefully.
    - label: Statehood
      text: Kentucky became the 15th state on June 1, 1792.
    - label: Nickname
      text: The Bluegrass State comes from Kentucky bluegrass and the central Bluegrass Region.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Kentucky, a Commonwealth known for bluegrass country, horse breeding, bourbon culture, and Appalachian as well as Ohio River history.
    - label: People
      text: People from Kentucky are called Kentuckians.
    - label: Commonwealth
      text: Kentucky formally styles itself as a Commonwealth.
  - heading: Nicknames and Short Forms
    items:
    - label: Bluegrass State
      text: Widely used nickname tied to central Kentucky's grasslands and horse farms.
    - label: Dark and Bloody Ground
      text: Older frontier nickname discussed as disputed on the Kentucky nickname page.
    - label: Tobacco State
      text: Agricultural nickname tied to a crop that shaped Kentucky for generations.
    - label: Abbreviation
      text: KY; older short form Ky.
editorial:
  heading: What Kentucky's Symbols Say About the State
  paragraphs:
  - Kentucky's [northern cardinal](/states/kentucky/bird) has more official work than most state birds. Kentucky adopted the cardinal before the other cardinal states, then wrote the bird into the flagstaff display law as the emblem above the Commonwealth flag.
  - The [Thoroughbred horse](/states/kentucky/mammal/thoroughbred-horse) is the symbol that most directly matches how outsiders picture Kentucky. It turns the Bluegrass Region, racing, and Lexington-area horse farms into an official emblem rather than just tourism language.
  - The beverage symbols are deliberately not bourbon. [Milk](/states/kentucky/beverage/milk) honors dairy farming, while [Ale-8-One](/states/kentucky/beverage/ale-8-one) gives one Winchester-made soft drink its own narrow official lane.
faq:
- question: Does Kentucky have a national park?
  answer: Yes. [Mammoth Cave National Park](/parks/national/mammoth-cave-national-park) is Kentucky's national park, managed by the National Park Service.
- question: What is the Kentucky state abbreviation?
  answer: The Kentucky postal abbreviation is [KY](/states/kentucky/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: What is Kentucky's most famous state symbol?
  answer: The [Thoroughbred horse](/states/kentucky/mammal/thoroughbred-horse) is one of Kentucky's most famous symbols because it matches the state's Bluegrass horse country and Kentucky Derby identity.
- question: What is Kentucky's state bird?
  answer: Kentucky's state bird is the [northern cardinal](/states/kentucky/bird), adopted in 1926 before any other state adopted the cardinal.
- question: What is Kentucky's state flower?
  answer: Kentucky's state flower is [goldenrod](/states/kentucky/flower), adopted in 1926.
- question: Why is Kentucky called the Bluegrass State?
  answer: Kentucky is called the Bluegrass State because Kentucky bluegrass grows thickly in the central Bluegrass Region, whose limestone soils helped support famous horse farms. The [Kentucky nickname](/states/kentucky/nickname) page explains the name.
- question: How many official state symbols does Kentucky have?
  answer: Kentucky's state symbols list here includes the flag, cardinal, goldenrod, tulip tree, motto, colors, firearm, beverages, and mammal symbols.
