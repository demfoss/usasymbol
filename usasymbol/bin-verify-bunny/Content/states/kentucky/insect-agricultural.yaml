faq:
- question: What is Kentucky's state agricultural insect?
  answer: "Kentucky's state agricultural insect is the European honey bee, adopted by the Kentucky General Assembly in 2010."
- question: When did Kentucky adopt the European honey bee?
  answer: "Kentucky adopted the European honey bee as its official state agricultural insect in 2010."
- question: Why did Kentucky choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Kentucky agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee the same as Kentucky's state butterfly?
  answer: "No. Kentucky's state butterfly is the viceroy, adopted in 1990. The European honey bee is a separate designation, the state agricultural insect, adopted in 2010."

