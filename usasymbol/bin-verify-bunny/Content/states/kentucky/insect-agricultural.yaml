sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is Kentucky's State Agricultural Insect?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Kentucky's official state agricultural insect. The Kentucky General Assembly designated it in 2010."
  - "The designation recognizes honey bees for their role in pollinating Kentucky crops, separate from Kentucky's state butterfly, the viceroy."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a fuzzy, golden-brown and black striped body built for collecting pollen and nectar from flowers."
  - "Honey bees live in colonies made up of one queen, thousands of worker bees, and a smaller number of drones. Workers are the bees most often seen visiting flowers."
  - "Not native to North America, honey bees were brought over by European colonists and have since become essential to pollinating crops across Kentucky."

- id: history
  icon: fa-solid fa-landmark
  title: How Kentucky Chose the European Honey Bee
  paragraphs:
  - "The Kentucky General Assembly designated the European honey bee as the official state agricultural insect in 2010."
  - "The designation recognizes the value of honey bees to Kentucky agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and orchard crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 2010, by the Kentucky General Assembly."
  - "Scientific name: Apis mellifera."
  - "Colonies are made up of one queen, thousands of worker bees, and a smaller number of drones."
  - "Not native to North America, honey bees were introduced by European colonists."
  - "Kentucky also has a separate state butterfly, the viceroy, adopted in 1990."




