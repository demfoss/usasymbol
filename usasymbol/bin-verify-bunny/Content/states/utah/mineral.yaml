seo_title: "Utah State Mineral | Copper"
seo_description: "Utah's state mineral is copper, adopted in 1994. The Bingham Canyon Mine near Salt Lake City is the largest human-made excavation on Earth."
hero_image: /images/minerals/utah/utah-state-mineral-hero.webp
hero_image_alt: "A cluster of reddish-orange native copper against a dark background."
hero_image_caption: "Copper, Utah's official state mineral, has been mined at Bingham Canyon since 1903."
intro_text: "Utah's state mineral is copper, adopted in 1994 to recognize the Bingham Canyon Mine southwest of Salt Lake City, one of the largest copper mines and human-made excavations on Earth. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Utah State Mineral
    paragraphs:
      - "Copper is Utah's official state mineral, designated by the state legislature in 1994. Few minerals are as closely tied to a single Utah location. The Bingham Canyon Mine in the Oquirrh Mountains has produced more copper than any other mine in history."
      - "Utah was a clear choice for this symbol not because copper is unique to the state, but because mining it built one of the largest industrial operations in Utah's history."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Copper?"
    paragraphs:
      - "Copper is a reddish-orange metal that is soft, dense, and highly malleable, and one of the best natural conductors of electricity. It is also one of the few metals people have used in a nearly pure state throughout history, though most of the world's supply, including Utah's, comes from ore rather than pure nuggets."
      - "Utah's copper occurs in a porphyry deposit, disseminated in low concentrations through a large volume of rock rather than concentrated in rich veins. That geology is why extracting it requires massive open-pit mining rather than traditional shaft mining."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Utah Chose Copper as Its State Mineral"
    paragraphs:
      - "Copper mining in the Oquirrh Mountains southwest of Salt Lake City began in 1903 under the Utah Copper Company. What grew from that start, the Bingham Canyon Mine, later operated by Kennecott, became the world's first large-scale open-pit copper mine and today is recognized as the largest human-made excavation on Earth."
      - "More copper has come out of Bingham Canyon than any other mine in history, and the operation has employed generations of Utahns. Naming copper the state mineral in 1994 recognized an industry that shaped the Salt Lake Valley's economy for nearly a century."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Copper Became Utah's State Mineral"
    paragraphs:
      - "The Utah Legislature designated copper the official state mineral in 1994, formally recognizing a metal already central to the state's mining identity for nine decades."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Copper Is Found in Utah"
    paragraphs:
      - "The Bingham Canyon Mine, in the Oquirrh Mountains southwest of Salt Lake City, is Utah's defining copper site. Mining there began in 1903 and continues today, and the pit is recognized as the deepest open-pit mine and largest human-made excavation on Earth."
    sites:
