faq:
  - question: What is Utah's state mineral?
    answer: "Utah's state mineral is copper, a reddish-orange metal adopted by the state legislature in 1994."
  - question: When did Utah adopt copper as its state mineral?
    answer: "The Utah Legislature designated copper the official state mineral in 1994."
  - question: Why did Utah choose copper?
    answer: "The Bingham Canyon Mine, the largest human-made excavation and most productive copper mine in history, has shaped the Salt Lake Valley's economy since 1903."
  - question: Where is copper mined in Utah?
    answer: "Copper is mined at the Bingham Canyon Mine in the Oquirrh Mountains southwest of Salt Lake City, an operation running continuously since 1903."

