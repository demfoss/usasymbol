faq:
  - question: What is Utah's state rock?
    answer: "Utah's state rock is coal, a sedimentary rock adopted by the state legislature in 1991."
  - question: When did Utah adopt coal as its state rock?
    answer: "The Utah Legislature designated coal the official state rock in 1991."
  - question: Why did Utah choose coal?
    answer: "Coal mining built the towns and economy of Carbon County, which is named directly for its coal deposits, making it one of Utah's most defining industries."
  - question: Where is coal mined in Utah?
    answer: "Carbon and Emery counties in east-central Utah, around Price and Helper, form the state's historic coal mining region."

