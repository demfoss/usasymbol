intro_text: "Utah's state rock is coal, adopted in 1991 to recognize the fuel that built the mining towns of Carbon County in east-central Utah. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Utah State Rock
    paragraphs:
      - "Coal is Utah's official state rock, designated by the state legislature in 1991. It is a sedimentary rock mined heavily in east-central Utah, most of all in Carbon County, a county literally named for the deposits beneath it."
      - "Utah chose coal to mark an industry that shaped an entire region's towns, railroads, and immigrant workforce rather than a rock notable only for its geology."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Coal?"
    paragraphs:
      - "Coal is a combustible, black to brownish-black sedimentary rock formed when ancient plant material, typically from swamps, was buried, compressed, and slowly transformed by heat and pressure over millions of years. Utah's coal is mostly bituminous, a mid-grade type dense enough for efficient burning."
      - "Unlike most rocks, coal is made almost entirely of organic carbon rather than mineral crystals, which is why it burns rather than simply melts or breaks down under heat."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Utah Chose Coal as Its State Rock"
    paragraphs:
      - "Carbon County, in east-central Utah, takes its name directly from the coal deposits discovered there in the 1880s. Towns including Price and Helper grew up around the coal industry, drawing immigrant workers to mine the seams that powered Utah's railroads and early electricity generation."
      - "Coal mining remained one of the state's most significant industries for over a century, and naming it the state rock in 1991 recognized both its economic weight and its role in shaping an entire region's identity."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Coal Became Utah's State Rock"
    paragraphs:
      - "The Utah Legislature designated coal the official state rock in 1991, recognizing an industry that had defined Carbon County's economy since the 1880s."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Coal Is Found in Utah"
    paragraphs:
      - "Price, the seat of Carbon County, sits at the center of Utah's historic coal mining region. Mines throughout Carbon and neighboring Emery County have produced coal since the late 19th century."
    sites:
      - name: Price
        city: Price
        lat: 39.5994
        lng: -110.8107
        note: "Heart of Utah's historic coal mining region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Coal Facts"
    facts:
      - "Adopted as Utah's state rock in 1991."
      - "Carbon County, Utah's historic coal mining hub, is named directly for its coal deposits."
      - "Utah's coal is mostly bituminous, formed from swamp vegetation compressed over tens of millions of years."
      - "Mining towns including Price and Helper grew directly around Utah's early coal industry."

