seo_title: "Utah State Reptile | Gila Monster"
seo_description: "Utah's state reptile is the Gila monster, adopted in 2019. Learn what this venomous lizard looks like and why it became official."
hero_image: /images/reptiles/utah/utah-state-reptile-hero.webp
hero_image_alt: "A black and orange beaded Gila monster lizard on desert rock."
hero_image_caption: "The Gila monster, Utah's state reptile, is one of the few venomous lizards in the world."
intro_text: "Utah's state reptile is the Gila monster, a thick-bodied venomous lizard found in the state's southern desert country, adopted in 2019. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Utah?
    paragraphs:
      - "The Gila monster is Utah's official state reptile, designated by the Utah Legislature in 2019. Its scientific name is Heloderma suspectum, and it lives in the arid canyon country of southwestern Utah."
      - "It is one of only a small number of venomous lizard species found anywhere in the world."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Gila Monster
    paragraphs:
      - "The Gila monster has a thick, heavy body covered in bead-like scales, patterned in bold black and orange or pink blotches that warn predators to stay away."
      - "It can grow up to about 2 feet long and moves slowly across the ground, unlike faster desert lizards."
      - "It delivers a venomous bite from grooved teeth in its lower jaw, a rare trait among lizards, though it is not aggressive and bites are uncommon."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Utah Legislature designated the Gila monster the official state reptile in 2019, recognizing a distinctive desert species found in the state's southern corner."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Utah Chose the Gila Monster
    paragraphs:
      - "Official sources name the Gila monster as Utah's state reptile because it is one of the state's most recognizable native desert animals, but they do not give a detailed reason for the choice beyond that."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Gila Monster
    paragraphs:
      - "In Utah, Gila monsters live in the rocky desert and canyon terrain of the state's southwestern corner, including areas near St. George and Washington County."
    sites:
      - name: St. George desert region
        city: St. George
