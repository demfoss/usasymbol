        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Gila Monster Facts
    facts:
      - "Adopted in 2019 by the Utah Legislature."
      - "One of the few venomous lizard species in the world."
      - "Grows up to about 2 feet long with bold black and orange or pink markings."
      - "Found in Utah only in the state's southwestern desert country."
      - "Moves slowly and is not aggressive toward people."

