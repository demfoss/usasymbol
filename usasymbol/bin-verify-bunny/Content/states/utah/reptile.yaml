faq:
  - question: What is Utah's state reptile?
    answer: "Utah's state reptile is the Gila monster, adopted by the Utah Legislature in 2019."
  - question: When did Utah adopt the Gila Monster?
    answer: "The Utah Legislature designated the Gila monster the official state reptile in 2019."
  - question: Why did Utah choose the Gila Monster?
    answer: "Official sources name the Gila monster as one of Utah's most distinctive native desert animals but do not give a more detailed reason for the choice."
  - question: Is the Gila Monster a turtle, snake, lizard, or alligator?
    answer: "The Gila monster is a lizard, and one of the few lizard species in the world that is venomous."

