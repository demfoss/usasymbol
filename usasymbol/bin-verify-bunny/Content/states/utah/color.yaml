seo_title: "Utah State Colors | Black Gold"
seo_description: "Utah state colors are Black and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Utah are **Black** and **Gold**, closely associated with the state's historic beehive symbol and prominently featured on [the Utah state flag](/states/utah/flag/utah-state-flag) redesigned in 2024. Although black and gold have not been formally designated as official state colors by the Utah Legislature, they function as Utah's most recognized color pairing through the state flag, state seal imagery, and the branding of the state's most prominent institutions. The specifications below list HEX, RGB, CMYK, and Pantone values for Utah color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Black and Gold"
official_since: "Semi-official (no formal legislative designation; associated with state flag design and traditional beehive symbolism)"
primary_use: "State flag design (adopted 2024), state seal imagery, University of Utah athletics, Utah Jazz branding, state government informal applications"
known_for: "Black and gold tied to the beehive — the central symbol of Utah's identity as the Beehive State — and prominently displayed on the modernized 2024 state flag, which brought these colors into the state's official imagery more explicitly than any previous flag design"

