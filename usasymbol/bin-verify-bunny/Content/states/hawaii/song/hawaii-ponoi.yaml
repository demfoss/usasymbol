faq:
  - question: What is Hawaii's state song?
    answer: "Hawaii's official state anthem is \"Hawaiʻi Ponoʻī,\" adopted in 1967."
  - question: Who wrote Hawaii's state song?
    answer: "King David Kalākaua wrote the lyrics in 1874, and royal bandmaster Henri Berger composed the music."
  - question: When did Hawaii adopt "Hawaiʻi Ponoʻī" as its state song?
    answer: "The Hawaii Legislature formally adopted it in 1967, though it had served as the kingdom's anthem since the 1870s."
  - question: Was "Hawaiʻi Ponoʻī" written before Hawaii became a US state?
    answer: "Yes. Kalākaua wrote it in 1874, 85 years before Hawaii achieved statehood in 1959."

