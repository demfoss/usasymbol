sections:
  - id: overview
    icon: fa-solid fa-music
    title: Hawaii State Song
    paragraphs:
      - "\"Hawaiʻi Ponoʻī\" is Hawaii's official state anthem, adopted by the state legislature in 1967. King David Kalākaua wrote the words in 1874 and royal bandmaster Henri Berger composed the music, originally as the anthem of the independent Hawaiian Kingdom."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Hawaiʻi Ponoʻī\" Explained"
    paragraphs:
      - "The title translates roughly to \"Hawaii's own\" and the song honors the Hawaiian people and their sovereigns, calling on listeners to be loyal to their king and their flag. It moves at a stately, march-like pace, reflecting its origin as a royal anthem meant for formal occasions."
      - "Kalākaua, who became king in 1874, wrote the lyrics himself, and Berger, a German-born bandmaster serving the Hawaiian monarchy, set them to music that echoes European royal anthems of the period. The song replaced an earlier anthem and served as the Hawaiian Kingdom's national anthem until the monarchy's overthrow in 1893."
      - "It later served the Republic of Hawaii and the Territory of Hawaii before Congress made Hawaii a state in 1959, and it remains widely sung at official state functions and schools today."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Hawaiʻi Ponoʻī" Represents Hawaii
    paragraphs:
      - "Hawaii kept the anthem because it predates statehood by 85 years and carries the islands' history as an independent nation before annexation. No other state song has this direct a link to a monarch who once ruled the territory it now represents."
      - "The song had already survived the fall of the monarchy, a republic, and a US territorial government by the time Hawaii became a state, so lawmakers formalized what residents had sung for generations rather than commissioning something new."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Hawaiʻi Ponoʻī\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Hawaiʻi Ponoʻī" Became Hawaii's State Song
    paragraphs:
      - "The Hawaii Legislature designated \"Hawaiʻi Ponoʻī\" the official state anthem in 1967, formally continuing a role the song had already held informally since King Kalākaua's reign in the 1870s. Its status carried through the kingdom, the republic, and the territorial period without interruption."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Hawaiʻi Ponoʻī\" Facts"
    facts:
      - "Hawaii adopted \"Hawaiʻi Ponoʻī\" as its official state anthem in 1967."
      - "King David Kalākaua wrote the lyrics in 1874 while reigning as monarch."
      - "Henri Berger, the king's royal bandmaster, composed the music."
      - "The song served as the national anthem of the Hawaiian Kingdom before the 1893 overthrow of the monarchy."
      - "Its title translates to roughly \"Hawaii's own.\""

