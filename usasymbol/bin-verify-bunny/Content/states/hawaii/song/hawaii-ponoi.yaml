lyrics_verses:
  - |-
    Hawaiian - Verse 1
    Hawaiʻi ponoʻī,
    Nānā i kou mōʻī,
    Ka lani aliʻi,
    Ke aliʻi.
  - |-
    Hawaiian - Chorus (Hui)
    Makua lani ē,
    Kamehameha ē,
    Na kāua e pale
    Me ka ihe.
  - |-
    Hawaiian - Verse 2
    Hawaiʻi ponoʻī,
    Nānā i nā aliʻi,
    Nā pua muli kou,
    Nā pōkiʻi.
  - |-
    Hawaiian - Verse 3
    Hawaiʻi ponoʻī,
    E ka lāhui ē,
    ʻO kāu hana nui
    E uʻi ē.
  - |-
    English - Verse 1
    Hawaiʻi's own true sons,
    Be loyal to your king,
    Your country's liege and lord,
    The chief.
  - |-
    English - Chorus (Hui)
    Royal father, Kamehameha,
    We shall defend,
    With the spear.
  - |-
    English - Verse 2
    Hawaiʻi's own true sons,
    Honor give to your chiefs,
    The children of your land,
    The young.
  - |-
    English - Verse 3
    Hawaiʻi's own true sons,
    People of this our land,
    Duty calls your loyalty,
    Guide in the right.
lyrics_note: "The anthem praises Hawaii's own people and its royal line, honoring the kings who protected the islands, and closes each verse with a call for the nation to defend its sovereign and its flag."
