sections:
  - id: overview
    icon: fa-solid fa-music
    title: Hawaii State Dance
    paragraphs:
      - "Hawaii named hula its official state dance in 1999, formally recognizing a movement tradition that predates statehood and carries the islands' oral history in its gestures. The designation put an official name on a practice that had already shaped Hawaiian cultural identity for generations."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Hula Explained"
    paragraphs:
      - "Hula pairs rhythmic footwork and hip movement with hand gestures that convey the meaning of an accompanying chant or song. Dancers use their hands to tell the story of the words, while the feet and hips carry the beat underneath."
      - "Two broad traditional categories shape the art form. Hula kahiko is the ancient style, often performed to chant and traditional instruments, while hula 'auana is the modern style, usually set to melodic instrumentation such as ukulele and guitar."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Hula
    steps:
      - title: "Find the Kaholo Basic Step"
        description: "Step to the side, bring the other foot together, then repeat in the opposite direction, keeping the motion smooth and low."
      - title: "Add the Ka'o Hip Sway"
        description: "Shift weight from one bent knee to the other in a steady rhythm, letting the hips sway in time with the music."
      - title: "Practice the Hela Foot Flick"
        description: "Extend one foot forward with a light tap or flick, then return it, adding accent to the underlying step pattern."
      - title: "Let the Hands Tell the Story"
        description: "Move the hands and arms in gestures that follow the meaning of the chant or song, keeping the motion smooth rather than sharp."
      - title: "Coordinate Feet and Hands Together"
        description: "Layer the hand gestures over the kaholo step so the lower body keeps the beat while the upper body carries the narrative."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Hula Represents Hawaii
    paragraphs:
      - "Hula developed in Hawaii as a way to preserve oral history, genealogy, and religious tradition before written language recorded them. Its gestures encode meaning specific to the islands, so no other state's folk dance carries a comparable role in cultural memory."
      - "The Merrie Monarch Festival, held annually in Hilo, remains the best-known showcase and competition for hula, drawing dancers who perform both hula kahiko and hula 'auana. The festival keeps the tradition visible and actively practiced across generations."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Hula Became Hawaii's State Dance
    paragraphs:
      - "The Hawaii State Legislature designated hula the state's official dance in 1999, formally naming a tradition that had already been central to Hawaiian identity for centuries."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Hula Facts
    facts:
      - "Hawaii adopted hula as its official state dance in 1999."
      - "Hula predates Hawaiian statehood by centuries and was historically used to pass down oral history and genealogy."
      - "Hula kahiko is the ancient, chant-based style, while hula 'auana is the modern style set to melodic instruments like ukulele and guitar."
      - "The Merrie Monarch Festival in Hilo is the best-known annual hula competition and showcase."

