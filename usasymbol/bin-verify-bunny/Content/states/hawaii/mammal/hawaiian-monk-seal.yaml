faq:
  - question: "What is Hawaii's state mammal?"
    answer: "Hawaii's state mammal is the Hawaiian monk seal (Neomonachus schauinslandi), designated in 2008 through House Concurrent Resolution 28."

  - question: "When was the Hawaiian monk seal designated as Hawaii's state mammal?"
    answer: "The Hawaiian monk seal became Hawaii's official state mammal on April 22, 2008, when the State Legislature adopted House Concurrent Resolution 28."

  - question: "Why did Hawaii choose the Hawaiian monk seal as its state mammal?"
    answer: "Hawaii chose the Hawaiian monk seal because it is endemic to Hawaii—found nowhere else on Earth—and critically endangered. The designation highlighted the urgent need for conservation and represented Hawaii's commitment to protecting unique native species. With only about 1,400 seals remaining, the choice emphasized both the seal's irreplaceable value and the responsibility Hawaiians bear for its survival."

  - question: "Where can I see Hawaiian monk seals in Hawaii?"
    answer: "Your best chance to see Hawaiian monk seals on the main islands is on Kauai's north shore beaches, Molokai's remote beaches, or occasionally at Waikiki and North Shore beaches on Oahu. However, most monk seals live in the remote Northwestern Hawaiian Islands (Papahanaumokuakea Marine National Monument), which are closed to public access. The Waikiki Aquarium and other marine centers sometimes have educational exhibits about monk seals."

  - question: "Does Hawaii have other official marine mammals?"
    answer: "Yes, Hawaii also designated the humpback whale as the official state marine mammal in 1979, nearly three decades before the monk seal. Hawaii is unique in having two state marine mammals—one migratory (humpback whale) and one endemic (Hawaiian monk seal)."

  - question: "Are Hawaiian monk seals dangerous?"
    answer: "Hawaiian monk seals are generally not aggressive toward humans, but they are wild animals and can bite if threatened or provoked. State law requires people to stay at least 50 feet away from resting seals. Mother seals with pups can be particularly protective. Give seals space, never feed them, and never allow dogs to approach them."

  - question: "How many Hawaiian monk seals are left?"
    answer: "Approximately 1,400 Hawaiian monk seals remain in the wild, with about 1,000 in the Northwestern Hawaiian Islands and 400 in the main Hawaiian Islands. The population has been slowly increasing due to intensive conservation efforts, but the species remains critically endangered."

  - question: "What is the biggest threat to Hawaiian monk seals?"
    answer: "Food limitation is the primary threat to Hawaiian monk seals, particularly for juveniles that struggle to find enough prey in Hawaiian waters. Other major threats include shark predation, entanglement in marine debris, disease, male aggression, and habitat loss from climate change and sea level rise. Conservation efforts address multiple threats simultaneously."

