sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Alabama's State Cake?"
    paragraphs:
      - "The Lane cake is Alabama's official state cake, designated by the Alabama Legislature in 2016. It is a layered white cake with a rich, boiled filling, invented in Clayton, Alabama."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Lane Cake"
    paragraphs:
      - "The Lane cake is made of several layers of white cake filled with a cooked mixture of egg yolks, sugar, butter, and often bourbon, raisins, and pecans, then covered in frosting."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Lane Cake Became Alabama's State Cake"
    paragraphs:
      - "The recipe was created by Emma Rylander Lane, who published it in her 1898 cookbook. The Alabama Legislature designated the Lane cake the official state cake in 2016."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Lane Cake"
    paragraphs:
      - "The Lane cake was invented in Clayton, Alabama, giving it a direct and well-documented origin within the state, unlike many Southern desserts with disputed or unclear beginnings."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Lane Cake Comes From in Alabama"
    paragraphs:
      - "The Lane cake was created in Clayton, Alabama, the small Barbour County town where Emma Rylander Lane first developed the recipe."
