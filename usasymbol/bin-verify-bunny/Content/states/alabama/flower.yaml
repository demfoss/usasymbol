faq:
- question: What is Alabama's state flower?
  answer: Alabama's official state flower is the camellia (Camellia japonica). It was adopted on August 26, 1959, replacing goldenrod.
- question: What does the Alabama state flower look like?
  answer: The camellia is an evergreen shrub with dark, glossy leaves that stay on the plant through winter. Blooms range from single-petaled forms to dense, layered doubles that resemble peonies. Colors include deep red, white, pink, and mixed varieties. Flowers typically measure 3 to 5 inches across. In Alabama, the plant blooms from November through March, with the fullest flowering in January and February — the middle of winter.
- question: When did Alabama adopt the camellia as its state flower?
  answer: August 26, 1959. The species was further clarified as Camellia japonica in 1999, but the camellia has been the official state flower since 1959.
- question: What flower did the camellia replace?
  answer: Goldenrod. Alabama's previous state flower was goldenrod, a native wildflower. Supporters of the change, including organized women's groups in Butler County, argued that the camellia better represented Alabama's garden culture and identity.
- question: Is the camellia native to Alabama?
  answer: No. The camellia originated in eastern and southern Asia — primarily China, Japan, and Korea. It was introduced to American gardens in the early nineteenth century and became deeply associated with Alabama, especially the Mobile area, but it is not native to North America.
- question: When does the camellia bloom in Alabama?
  answer: The camellia blooms from November through March, with peak bloom typically in January and February — the heart of winter, when most of Alabama's native landscape is dormant.
- question: What colors does the camellia bloom in?
  answer: Camellia flowers appear in shades of red, white, pink, and mixed forms. No particular variety or color was specified when Alabama designated the camellia as its state flower.
- question: Why is the camellia so associated with Alabama?
  answer: The Mobile area in particular developed a strong camellia tradition due to its mild winters and humid climate, which are ideal for the plant. Alabama garden culture built around the camellia over generations, making it a symbol of civic horticulture and local pride well before the 1959 official designation.
