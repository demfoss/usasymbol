seo_title: 'Alabama State Flower | The Camellia'
seo_description: "Alabama adopted the camellia as state flower in 1959, replacing goldenrod. The switch is unusual because camellias are not native to Alabama."
intro_text: Alabama's official state flower is the **camellia** (*Camellia japonica*), adopted on **August 26, 1959**. It replaced goldenrod — and unlike nearly every other state floral symbol in the country, the camellia is not native to North America at all. It came from Asia, took root in Alabama gardens, and eventually became more culturally embedded in the state than the wildflower it displaced. See how it compares to other state flowers on the [list of U.S. state flowers](/symbols/flowers), or explore Alabama's full symbol set on the [Alabama state hub](/states/alabama).
