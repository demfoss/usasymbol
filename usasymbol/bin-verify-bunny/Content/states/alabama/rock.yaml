intro_text: "Marble, Alabama's state rock since 1969, is a fine-grained white stone quarried around Sylacauga that has supplied building and monument marble across the country. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Alabama State Rock
    paragraphs:
      - "Marble is Alabama's official state rock, designated by the Alabama Legislature in 1969. It is a metamorphic rock formed from limestone, and Alabama's deposits are concentrated around Sylacauga in Talladega County, an area long nicknamed the Marble City."
      - "Alabama was chosen for this designation because of the scale and quality of its marble industry, one of the most productive marble-producing regions in the country."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Marble?"
    paragraphs:
      - "Marble is a metamorphic rock that forms when limestone is subjected to intense heat and pressure deep underground, recrystallizing its calcite grains into the dense, interlocking texture that gives marble its strength and polish."
      - "Alabama marble is prized for its fine, even grain and pale color, ranging from white to light gray. It cuts and polishes cleanly, making it a favored material for buildings, monuments, and sculpture."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Alabama Chose Marble as Its State Rock"
    paragraphs:
      - "Alabama's marble industry centers on Sylacauga, where large, high-quality deposits have been quarried commercially since the 1800s. The town's marble was prized enough to earn Sylacauga the nickname Marble City."
      - "Alabama marble has been used well beyond the state, supplying stone for government buildings, memorials, and monuments around the country. That reach, combined with the size and quality of the Sylacauga deposits, made marble a natural choice to represent Alabama."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Marble Became Alabama's State Rock"
    paragraphs:
      - "State lawmakers designated marble the official state rock in 1969, recognizing the industry built around the Sylacauga deposits."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Marble Is Found in Alabama"
    paragraphs:
      - "Alabama's commercial marble deposits are centered on Sylacauga in Talladega County, where quarries have operated since the 19th century."
    sites:
      - name: Sylacauga
        city: Sylacauga
        lat: 33.1717
        lng: -86.2500
        note: "Marble City, Alabama's marble quarrying center"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Marble Facts"
    facts:
      - "Adopted as Alabama's state rock in 1969."
      - "Sylacauga, Alabama has been nicknamed the Marble City for its long-running marble quarrying industry."
      - "Marble forms when heat and pressure recrystallize limestone underground."
      - "Alabama marble has been shipped out of state for use in buildings and monuments across the country."

