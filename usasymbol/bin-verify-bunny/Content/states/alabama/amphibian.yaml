intro_text: "Alabama's state amphibian is the Red Hills salamander, a burrowing salamander found nowhere else on Earth outside a narrow band of ravines in south-central Alabama, adopted in 1975. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Alabama?
    paragraphs:
      - "The Red Hills salamander is Alabama's official state amphibian, designated by the Alabama Legislature in 1975. Its scientific name is Phaeognathus hubrichti, and it is found only in Alabama, nowhere else in the world."
      - "It is a lungless salamander that spends most of its life underground in burrows dug into steep, wooded ravine slopes."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Red Hills Salamander
    paragraphs:
      - "The Red Hills salamander is dark brown to gray with no bright markings, and it can grow up to about 10 inches long, making it one of the largest lungless salamanders in North America."
      - "It has no lungs and breathes entirely through its skin, which is why it stays in damp burrows rather than open, dry ground."
      - "Most of its life is spent hidden in a vertical burrow it digs into a shaded ravine slope, only coming to the burrow entrance at night to feed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Alabama Legislature designated the Red Hills salamander the official state amphibian in 1975, not long after the species was first described by scientists."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Alabama Chose the Red Hills Salamander
    paragraphs:
      - "The Red Hills salamander lives nowhere else on Earth outside a narrow strip of Alabama's Red Hills region, making it one of the state's most distinctive native animals."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Red Hills Salamander
    paragraphs:
      - "The Red Hills salamander's entire known range is a narrow band of wooded ravines in the Red Hills region of south-central Alabama, between the Alabama and Conecuh rivers."
    sites:
      - name: Red Hills region
        city: Greenville
        lat: 31.63
        lng: -86.74
        note: "Only known range of this species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Red Hills Salamander Facts
    facts:
      - "Adopted in 1975 by the Alabama Legislature."
      - "Found only in a narrow strip of south-central Alabama and nowhere else in the world."
      - "Has no lungs and breathes through its skin."
      - "Can grow up to about 10 inches long, unusually large for a lungless salamander."
      - "Spends most of its life underground in burrows dug into steep ravine slopes."

