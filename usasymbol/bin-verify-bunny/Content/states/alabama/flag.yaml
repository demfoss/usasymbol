sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "History of the Alabama State Flag"
    paragraphs:
      - "Montgomery women built Alabama's first flag for the January 11, 1861 secession vote. The silk banner showed the Goddess of Liberty, sword raised, with Independent Now and Forever across the top. On the reverse, a cotton plant and rattlesnake flanked the Latin warning Noli Me Tangere. A storm destroyed it within one month. It was retired to the governor's office, never flown again."
      - "For three decades after, Alabama flew no official state banner, using the Confederate National Flag through the Civil War and the U.S. flag after. On February 16, 1895, the legislature passed Act 383, adopting the crimson diagonal cross on white that still flies today."
      - "Little is recorded of the legislative debate beyond the final bill text. John W. A. Sanford Jr., a legislator from Montgomery County who introduced the bill, offered no floor explanation. The law named one color, set one minimum measurement, and stopped there. Mississippi adopted a Confederate-canton flag the same year."

  - id: symbols
    icon: fa-solid fa-shapes
    title: "Alabama Flag Meaning and Symbolism"
    symbols:
      - id: crimson-cross
        name: "Saint Andrew's Cross"
        image: symbols/cross.svg
        clip_region: 'polygon(0% 0%, 10% 0%, 50% 40%, 90% 0%, 100% 0%, 100% 10%, 60% 50%, 100% 90%, 100% 100%, 90% 100%, 50% 60%, 10% 100%, 0% 100%, 0% 90%, 40% 50%, 0% 10%)'
        paragraphs:
          - "Running corner to corner on white, the crimson saltire is Alabama's only flag element. Alabama law calls it a Cross of St. Andrew. The bars must be at least six inches wide. No seal, motto, or state name appears on the flag."
      - id: white-field
        name: "White Field"
        image: symbols/white-field.png
        clip_region: 'inset(0 0 0 0)'
        paragraphs:
          - "Four triangular areas of white surround the cross arms. The 1895 law named only crimson and white. Nothing else was specified, making Alabama's one of the two-color designs among all fifty state flags."

  - id: colors
    icon: fa-solid fa-palette
    title: "Official Colors and Dimensions"
    paragraphs:
      - "Alabama's flag uses crimson and white. No official shade of crimson has been defined in law, so reproductions range from deep rose to near-scarlet."
    colors:
      - name: "Crimson"
        hex: "#9B1B30"
      - name: "White"
        hex: "#FFFFFF"

  - id: confederate-origins
    icon: fa-solid fa-circle-exclamation
    title: "Confederate Flag or Spanish Cross?"
    paragraphs:
      - "Two theories explain the cross, and the historical record supports both. The first holds that Sanford designed it to mirror the Confederate Battle Flag through its square shape and diagonal cross. In 1905, the legislature considered adding stars to make the resemblance more direct. The proposal failed."
      - "The second points to the Spanish Cross of Burgundy, a red diagonal cross on white that Spanish soldiers carried through the Southeast in the 1500s. Alabama's territory passed through Spanish, French, British, and Confederate control before statehood. In 1939, Alabama adopted a state coat of arms that incorporated the Confederate Battle Flag alongside the flags of France, Spain, and Britain."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    facts:
      - "Scotland's national flag, the Saltire, runs white on blue. Alabama's crimson on white uses the same cross shape with the colors reversed."
      - "Square and rectangular versions both exist. State law never specified proportions, so manufacturers followed two different traditions."
      - "Montgomery served as the first capital of the Confederate States of America in 1861, four years before Alabama adopted its current flag."
      - "Alabama has not amended its 1895 flag law once in over 130 years. The only unresolved question is whether the bars must extend to all four corners."

  - id: previous-versions
    icon: fa-solid fa-flag
    title: "Historical Versions of the Flag"
    versions:
      - name: "Alabama Secession Flag"
        years: "1861"
        image: versions/secession-1861.webp
        description: "An elaborate silk banner made by Montgomery women for the January 11, 1861 secession vote. It carried symbolic imagery on two sides and served as Alabama's only official state flag until the 1895 law."
      - name: "Current State Flag"
        years: "1895 to present"
        image: versions/modern-1895.webp
        description: "Crimson saltire on white, adopted by Act 383 in 1895. The only flag Alabama has officially flown since."

faq:
  - question: "What does the Alabama state flag look like?"
    answer: "Alabama's flag shows a crimson diagonal cross running from corner to corner on a white field. No seal, motto, or state name appears alongside it. The 1895 law set one color and one minimum measurement."
  - question: "What does the cross on the Alabama flag mean?"
    answer: "State law gave no explanation of the cross's meaning in 1895. The bill passed without recorded floor debate. Most historians link the timing to the decade's wave of Confederate monument projects spreading across the South."
  - question: "Was the Alabama flag inspired by the Confederate flag?"
    answer: "Most historians say yes. The diagonal cross and square proportions match the Confederate Battle Flag pattern. A competing theory links it to the Spanish Cross of Burgundy, which predates the Confederacy by centuries and traveled through the Southeast under Spanish rule."
  - question: "What happened to Alabama's first flag?"
    answer: "Alabama's first flag was raised for the January 11, 1861 secession vote. Made by Montgomery women, it showed the Goddess of Liberty on one side and a cotton plant with a rattlesnake on the other. It was retired within weeks and never replaced until the 1895 law."
  - question: "Is the Alabama flag square or rectangular?"
    answer: "State law never specified. Act 383 of 1895 described only the cross design, not the flag's proportions. Both square and rectangular versions are in common use today. The square version follows the Confederate Battle Flag tradition."

