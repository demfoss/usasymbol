seo_title: "Flag of Alabama | History, Meaning & Colors"
seo_description: "Alabama's crimson cross on white was adopted in 1895, likely modeled after the Confederate Battle Flag. The state's first flag was destroyed by a storm one month after raising."
meaning: "Alabama's 1895 flag is one of the most legally sparse in the country. The law named one color, set one measurement, and gave no symbolism. What the cross was meant to say was left unwritten."

intro_text: "Alabama's state flag shows a **crimson diagonal cross** on **white**, adopted February 16, 1895 when Representative John W. A. Sanford Jr. introduced a one-sentence bill. The cross runs from corner to corner. The law set one measurement and left everything else, including the shade of crimson and the symbolism, unexplained."

