sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Alabama's State Nut?"
    paragraphs:
      - "The pecan is Alabama's official state nut, designated by the Alabama Legislature in 1982. Pecan trees grow across much of the state, especially in the river valleys and coastal plain of south Alabama."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pecan"
    paragraphs:
      - "Pecans grow inside a hard, smooth shell that splits open when the nut ripens in autumn. Alabama pecan orchards produce nuts used in baking, snacking, and the state's well-known pecan pies and candies."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pecan Became Alabama's State Nut"
    paragraphs:
      - "The Alabama Legislature designated the pecan the official state nut in 1982, recognizing an established Alabama farming crop."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Pecan"
    paragraphs:
      - "Pecan trees have long been grown commercially across Alabama, and the nut is closely tied to the state's home cooking and baking traditions, making it a natural choice for the designation."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pecan Facts"
    facts:
      - "Adopted as Alabama's state nut in 1982."
      - "Pecan trees grow across Alabama's river valleys and coastal plain."
      - "Pecans are a native North American nut tree."

