seo:
  title: "Most Common Last Names in Alabama"
  description: "Alabama's most common last names are Smith, Williams, and Johnson, shaped by Black Belt history and Emancipation-era naming."

page:
  h1: "Most Common Last Names in Alabama"
  intro: "Smith, Williams, and Johnson lead Alabama — but Williams nearly ties Smith because post-emancipation naming lifted English patronymics statewide. Scots-Irish settlers from Tennessee, freed Black Alabamians choosing surnames in 1865, and French colonial Mobile each left distinct fingerprints in the top 20."
  heritage_title: "Scots-Irish Settlers, Freed Slaves, and a French Port"
  heritage_body: "Alabama's population exploded from 9,000 to 300,000 between 1810 and 1830 as Scots-Irish families followed Jackson's military road into the Tennessee Valley. When emancipation came in 1865, freedmen across Dallas, Hale, and Greene counties chose legal surnames for the first time — pushing Williams and Johnson far above their national rankings. German settlers in Mobile Bay's Baldwin County added a third stream, leaving names like Enfinger nearly exclusive to coastal Alabama."
  fun_fact: "Enfinger — brought to Baldwin and Mobile counties by German Baptist settlers from Baden-Württemberg between 1845 and 1870 — exists in statistically significant numbers in only two Alabama counties, making it the most geographically concentrated surname in the American South."

surnames:
  - rank: 1
    name: Smith
    count: 39600
    ratio: 121
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Alabama land records from 1808 show Smith among the first documented surnames in the territory — it arrived with Scots-Irish settlers from the Carolinas and spread further after 1865 when Black Belt freedmen adopted it as a new legal name."

  - rank: 2
    name: Williams
    count: 38200
    ratio: 125
    origin: english
    type: Patronymic
    meaning: "Son of William — Norman 'Willahelm', will plus helm. Williams nearly ties Smith in Alabama because freedmen in Dallas, Wilcox, and Perry counties — where enslaved people had outnumbered white settlers for decades — adopted it en masse after emancipation in 1865."

  - rank: 3
    name: Johnson
    count: 31000
    ratio: 154
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' (God is gracious). Johnson was among the most common choices for Black Belt freedmen after 1865 — ethnically neutral, widely recognized, and already present in both white and Black communities across the state."

  - rank: 4
    name: Brown
    count: 26800
    ratio: 178
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', brown hair or complexion. Brown concentrations peak in Greene, Sumter, and Hale counties — the antebellum plantation heartland — where it spread through Carolinas-origin settler families and post-1865 adoption by freedmen."

  - rank: 5
    name: Jones
    count: 25400
    ratio: 188
    origin: english
    type: Patronymic
    meaning: "The defining Welsh surname — son of John via 'Ioan'. Welsh-origin families who settled the hill country east of Birmingham (Walker, Blount, St. Clair counties) in the 1810s–1840s made Jones the most characteristically Appalachian surname in Alabama's top 10."

  - rank: 6
    name: Davis
    count: 22600
    ratio: 212
    origin: english
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ' (beloved). Davis already ranked among Alabama's most common surnames before the Civil War; Jefferson Davis's presidency of the Confederacy — with Montgomery as its first capital — gave the name unmistakable symbolic weight that persisted through Reconstruction."

  - rank: 7
    name: Wilson
    count: 18900
    ratio: 253
    origin: english
    type: Patronymic
    meaning: "Son of Will, a contraction of William. Wilson appears in Madison County deed books from 1812, carried by Scots-Irish families who followed the Tennessee River corridor into Limestone, Lawrence, and Colbert counties via the Huntsville land lottery of 1809."

  - rank: 8
    name: Moore
    count: 18400
    ratio: 260
    origin: english
    type: Habitational
    meaning: "From Old English 'mōr', someone near open uncultivated moorland. Moore concentrates in Lauderdale and Morgan counties — carried by Scots-Irish families from the Cumberland Plateau — and occasionally by Irish families anglicizing 'Ó Mórdha' (great chief) who came through the Tennessee Valley in the 1810s."

  - rank: 9
    name: Taylor
    count: 17800
    ratio: 268
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Taylor families appear in Alabama's earliest land grants in the Tombigbee River valley (Sumter and Choctaw counties) before statehood in 1819, and spread further across the Black Belt through post-emancipation adoption."

  - rank: 10
    name: Anderson
    count: 17100
    ratio: 279
    origin: scottish
    type: Patronymic
    meaning: "Son of Anders (Andrew), from Greek 'Andreas' (manly). Anderson followed the Scots-Irish route from Scotland to Ulster to the Appalachian corridor, settling Lauderdale, Colbert, and Franklin counties along the Tennessee Valley in the 1810s–1830s."

  - rank: 11
    name: Thomas
    count: 16600
    ratio: 288
    origin: english
    type: Patronymic
    meaning: "From Aramaic 'Tʼōmā', meaning twin. Welsh-origin families from the Carolinas brought Thomas into Perry, Hale, and Marion counties — where they founded the earliest Baptist congregations — and freedmen in the same Black Belt counties adopted it widely after 1865."

  - rank: 12
    name: Jackson
    count: 16200
    ratio: 295
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval diminutive of John. Andrew Jackson's defeat of the Creek Nation at the Battle of Horseshoe Bend (Tallapoosa County, 1814) opened Alabama to settlement — many families who followed his military road carried or adopted the name, and Jackson County in northeast Alabama commemorates the same event."

  - rank: 13
    name: White
    count: 15700
    ratio: 304
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', white hair. White concentrations peak in Bibb and Shelby counties — the coalfield region south of Birmingham — where Virginia-origin settler families arrived in the 1820s before coal and iron transformed the area after the Civil War."

  - rank: 14
    name: Harris
    count: 15100
    ratio: 317
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry (Germanic 'Heimirich', home ruler). Harris appears in Alabama's first General Assembly records in 1819, carried by early settlers of the Cahaba River valley in Bibb and Dallas counties — the fertile center of Alabama's first cotton economy."

  - rank: 15
    name: Martin
    count: 14600
    ratio: 327
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', of Mars. Martin in Alabama has two roots: French Huguenot families from South Carolina settled Mobile Bay in the early 1800s, and Irish Catholic families in Mobile — which retained its French (1702) and Spanish (1780–1813) Catholic traditions — concentrated the name in Mobile County above all others."

  - rank: 16
    name: Thompson
    count: 13800
    ratio: 346
    origin: english
    type: Patronymic
    meaning: "Son of Thom, with the 'p' inserted as a 15th-century spelling convention. Thompson concentrations peak in the Wiregrass (Dale, Coffee, Geneva counties), settled by English families from Georgia and South Carolina after the Creek removal of the 1820s — nearly absent from Mobile County, where coastal settlement followed entirely different migration routes."

  - rank: 17
    name: Young
    count: 13300
    ratio: 359
    origin: english
    type: Descriptive
    meaning: "From Old English 'geong', a nickname distinguishing a son from his father. Scots-Irish families from East Tennessee brought Young to Sand Mountain (DeKalb and Marshall counties) in the 1820s–1840s after the Cherokee removal opened north Alabama's hill country, and the name remains disproportionately concentrated there today."

  - rank: 18
    name: Allen
    count: 12900
    ratio: 371
    origin: english
    type: Patronymic
    meaning: "Possibly from Celtic 'Ailín' (little rock), or a habitational name from Brittany carried to England at the Norman Conquest. Allen families entered Alabama through the Coosa River valley (Talladega and Coosa counties) in the 1820s, following the corridor cleared by the Creek War of 1813–14."

  - rank: 19
    name: King
    count: 12500
    ratio: 382
    origin: english
    type: Descriptive
    meaning: "From Old English 'cyning' (king), originally a nickname for someone in a royal household. After 1865, King became a deliberate choice among Black Belt freedmen in Hale, Greene, and Sumter counties — where it carried a connotation of dignity and status for communities rebuilding their identities under Reconstruction."

  - rank: 20
    name: Wright
    count: 12100
    ratio: 395
    origin: english
    type: Occupational
    meaning: "From Old English 'wyrhta', a craftsman who works with wood. Wright families are among the earliest documented surnames in the Tombigbee River valley (Sumter and Choctaw counties) — former Choctaw territory until the 1830 Treaty of Dancing Rabbit Creek — appearing in county land surveys within a year of the treaty."

