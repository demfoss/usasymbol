faq:
  - question: What is Alabama's state dance?
    answer: "Alabama's official American folk dance is square dance, adopted in 1981."
  - question: When did Alabama adopt square dance as its state dance?
    answer: "Alabama adopted square dance as its official American folk dance in 1981."
  - question: Why did Alabama choose square dance?
    answer: "Square dance already had a strong presence at community halls and gatherings statewide, and Alabama's designation followed a broader national campaign by square-dance organizations during the 1970s and 1980s."
  - question: Is square dance the same in every state?
    answer: "The core figures, such as circling left and promenading, stay consistent nationwide, but calling style and local music traditions vary by region and caller."

