sections:
  - id: overview
    icon: fa-solid fa-music
    title: Alabama State Dance
    paragraphs:
      - "Square dance became Alabama's official American folk dance in 1981. The designation recognized a set dance already familiar from community halls, county fairs, and school gatherings throughout the state."
      - "Alabama's version of the dance follows the same national pattern found across the country: four couples, a caller, and a shared set of moves passed down through generations."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each couple facing the center from one of the four sides. A caller directs the group through a sequence of moves, timed to lively string-band or fiddle music."
      - "Dancers respond to the caller in real time rather than following a fixed routine, so no two dances play out exactly alike. The music typically features fiddle, banjo, and guitar, driving a quick, even tempo that keeps all eight dancers moving together."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand on the four sides of an imaginary square, each dancer facing the center."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod first to your partner, then to your corner, as the caller signals the dance is beginning."
      - title: "Circle Left with the Whole Set"
        description: "All eight dancers join hands and move together to the left in a full circle, keeping time with the caller's count."
      - title: "Do-Si-Do Your Partner"
        description: "Pass around your partner back to back without turning to face them, then return to your starting spot."
      - title: "Promenade Back to Place"
        description: "Take your partner's near hand and walk together around the square to your home position, closing the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Alabama
    paragraphs:
      - "Square dance spread across Alabama through generations of community gatherings, where a caller and a few musicians could turn a barn, school gym, or church hall into a dance floor. That accessibility made it a shared social activity in both rural and small-town settings statewide."
      - "Alabama's choice also reflects a national campaign. Starting in the 1970s, square-dance callers' associations and dance organizations pushed state legislatures across the country to name square dance an official folk dance, and Alabama's 1981 designation followed that broader movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Alabama's State Dance
    paragraphs:
      - "Alabama named square dance its official American folk dance in 1981, part of a wave of state designations that followed a national push by square-dance organizations during that period."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Alabama adopted square dance as its official American folk dance in 1981."
      - "The dance sets four couples into a square, directed by a caller through each figure."
      - "Alabama's designation followed a national campaign by square-dance callers' groups active from the 1970s onward."
      - "Square dance is typically danced to fiddle, banjo, and guitar music at a quick, even tempo."

