seo:
  title: "Most Common Last Names in Idaho"
  description: "Idaho's most common last names are Smith, Johnson, and Anderson, with LDS, Scandinavian, and Basque roots visible."

page:
  h1: "Most Common Last Names in Idaho"
  intro: "Anderson ranks in Idaho's top five — a number that traces almost entirely to LDS converts from Scandinavia who homesteaded the Snake River Plain from the 1870s onward. Basque sheepherders built a separate enclave in Boise from the 1890s, preserving surnames like Eiguren found in almost no other U.S. state."
  heritage_title: "Pioneer, Basque, and Hispanic Roots"
  heritage_body: "LDS converts from Scandinavia homesteaded southern Idaho's Snake River Plain from the 1870s onward, planting surnames like Anderson across Bonneville and Madison counties. Basque immigrants arrived from the 1890s as sheepherders in the Owyhee high desert, building a lasting enclave in Boise. From the 1960s, Hispanic farmworkers drawn by potato and dairy operations anchored surnames like Martinez and Garcia across Jerome and Minidoka counties."
  fun_fact: "Boise hosts one of the highest concentrations of Basque Americans per capita of any U.S. city, preserving surnames found almost nowhere else in the country."

surnames:
  - rank: 1
    name: Smith
    count: 13800
    ratio: 114
    origin: english
    type: Occupational
    meaning: "Derived from the Old English smið, meaning a metalworker or blacksmith. Idaho's mining camps and railroad towns of the late 1800s drew many Smith families to settlements like Kellogg and Pocatello."

  - rank: 2
    name: Johnson
    count: 11000
    ratio: 143
    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' rooted in the Hebrew Yohanan. LDS converts from Scandinavia and the Midwest carried the name into southern Idaho during the homestead era of the 1870s–1890s."

  - rank: 3
    name: Williams
    count: 10000
    ratio: 157
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of William,' from the Germanic Willahelm. Welsh and English settlers brought the name into northern Idaho's Clearwater timber country in the late nineteenth century."

  - rank: 4
    name: Brown
    count: 8400
    ratio: 187
    origin: english
    type: Descriptive
    meaning: "An Old English nickname for someone with brown hair or a swarthy complexion. Brown families appear among the earliest American settlers in Ada County and the Boise Basin gold rush of the 1860s."

  - rank: 5
    name: Jones
    count: 7800
    ratio: 201
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning 'son of John,' one of the most carried names from the British Isles. Jones families settled across Latah County's Palouse wheat farms in the late 1880s."

  - rank: 6
    name: Anderson
    count: 7500
    ratio: 209
    origin: english
    type: Patronymic
    meaning: "Means 'son of Andrew,' brought by Scandinavian LDS converts who anglicized forms like the Danish Andersen. Bonneville and Madison counties in eastern Idaho show particularly dense Anderson concentrations from organized LDS colonization."

  - rank: 7
    name: Miller
    count: 7200
    ratio: 218
    origin: english
    type: Occupational
    meaning: "Derived from the occupation of operating a grain mill. German and English Miller families settled Idaho's Snake River valley towns, where flour milling served farming communities through the early twentieth century."

  - rank: 8
    name: Davis
    count: 7000
    ratio: 224
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning 'son of David.' Davis families were among the early Mormon colonizers of the upper Snake River Plain, with concentrations recorded in Jefferson County."

  - rank: 9
    name: Wilson
    count: 6300
    ratio: 249
    origin: english
    type: Patronymic
    meaning: "Means 'son of Will,' common across English-speaking pioneer communities. Wilson families appear in Nez Perce County records connected to the early Lewiston grain and lumber trades."

  - rank: 10
    name: Taylor
    count: 5700
    ratio: 275
    origin: english
    type: Occupational
    meaning: "From the Old French tailleur, meaning a tailor or cutter of cloth. Taylor families settled throughout the Boise Valley in the territorial period, with concentrations recorded in Canyon County."

  - rank: 11
    name: Thompson
    count: 5600
    ratio: 280
    origin: english
    type: Patronymic
    meaning: "Means 'son of Thomas,' with roots in both northern English and Scandinavian naming traditions. Northern Idaho's Kootenai County drew Thompson families during the mining and railroad booms of the late 1800s."

  - rank: 12
    name: Martinez
    count: 5500
    ratio: 285
    origin: spanish
    type: Patronymic
    meaning: "A Spanish patronymic meaning 'son of Martín,' itself from the Latin Martinus. Martinez families grew rapidly in Jerome and Twin Falls counties from the 1960s onward as Hispanic labor became central to the dairy and potato industries."

  - rank: 13
    name: Garcia
    count: 5300
    ratio: 296
    origin: spanish
    type: Habitational
    meaning: "Of uncertain origin, possibly from a place name or a Basque root meaning 'young.' Garcia ranks among the most common surnames in Idaho's Magic Valley, reflecting decades of agricultural migration from Mexico."

  - rank: 14
    name: Thomas
    count: 4700
    ratio: 334
    origin: english
    type: Patronymic
    meaning: "From the Aramaic meaning 'twin,' carried into English through Greek and Latin. Thomas families are well represented in Gem and Payette counties, settled by Midwestern farmers along the Weiser River in the early 1900s."

  - rank: 15
    name: Moore
    count: 4700
    ratio: 334
    origin: english
    type: Habitational
    meaning: "An English habitational name for someone living near a moor or open heath. Moore families appear in early Boise Valley land records and among ranchers in the Owyhee high desert from the 1870s onward."

  - rank: 16
    name: Jackson
    count: 4400
    ratio: 356
    origin: english
    type: Patronymic
    meaning: "Means 'son of Jack,' a medieval diminutive of John. Jackson families settled Fremont County in eastern Idaho during the late homestead era, drawn by the region's timber and agricultural land."

  - rank: 17
    name: White
    count: 4400
    ratio: 356
    origin: english
    type: Descriptive
    meaning: "An Old English nickname for a person with fair hair or a pale complexion. White families were among the early Anglo-American settlers of Boise and the Treasure Valley following the 1860s gold rush."

  - rank: 18
    name: Harris
    count: 4200
    ratio: 373
    origin: english
    type: Patronymic
    meaning: "A patronymic from Harry, the medieval English form of Henry. Harris families established farms in Gooding and Lincoln counties on the Snake River Plain during the early irrigation era."

  - rank: 19
    name: Martin
    count: 4100
    ratio: 382
    origin: english
    type: Patronymic
    meaning: "From the Latin Martinus, a name rooted in Mars, the Roman god of war. Martin is shared by both Anglo-American pioneer families in northern Idaho and Hispanic farmworker families in the Magic Valley."

  - rank: 20
    name: Lewis
    count: 3900
    ratio: 402
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form of Louis, derived from the Germanic Hlodwig. Lewis County in north-central Idaho bears the explorer's surname, and Lewis families settled the Camas Prairie wheat farms in the 1890s."

