sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Wyoming State Sport
    paragraphs:
      - "Wyoming named rodeo its official state sport in 2003, joining South Dakota in the same year, six years after Texas became the first state to make the designation. The bill passed during Dave Freudenthal's first year as governor, and the law took effect that July 1. The statute added a single sentence to Wyoming law: rodeo is the official state sport."

  - id: what-is
    icon: fa-solid fa-hat-cowboy
    title: "Rodeo in Wyoming"
    paragraphs:
      - "A bareback rider nods for the gate, then holds one hand locked into a leather rigging as the horse underneath them lunges and twists for eight seconds straight. Saddle bronc riders face the same clock with a looser style built around control, while bull riders take on far heavier, less predictable stock. Timed events change the pace: barrel racers cut tight turns around three barrels at a gallop, and ropers chase a stopwatch instead of an animal's temper."
      - "Cheyenne Frontier Days runs each July as the centerpiece of Wyoming's rodeo calendar, drawing nearly 200,000 visitors over ten days and billing itself as the world's largest outdoor rodeo. Smaller rodeos fill nearly every county fair through the summer, from Sheridan to Jackson Hole, keeping the sport a fixture of small-town life across the state."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Rodeo Represents Wyoming
    paragraphs:
      - "Rodeo grew out of the everyday work of Wyoming's cattle ranches, where cowboys broke horses and roped stock long before anyone scored the results. Cheyenne Frontier Days began in 1897 after a railroad agent suggested a festival modeled on a Colorado harvest celebration, and organizers built it around bronco busting and steer roping instead. Four thousand people came to that first event, and its billing as the first paid professional rodeo earned it the nickname the Daddy of 'em All."
      - "Wyoming built the bucking horse into its identity long before the state sport law existed. Wyoming National Guard troops wore a bucking horse and rider insignia in World War I, and the state adopted a version of the same image for its license plates in 1936, making it the longest-running license plate design in the world. Many Wyomingites associate the emblem with Steamboat, a bronc from a ranch near Chugwater billed as the horse that couldn't be ridden and later inducted into three rodeo and cowboy halls of fame, though the state's own records describe the plate's rider and horse as generic rather than modeled on any single animal."
      - "Rodeo had represented Wyoming visually for generations before the 2003 law made the connection official. Lawmakers were putting a name to an identity the bucking horse had already built, not introducing rodeo to the state."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Rodeo Became Wyoming's State Sport
    paragraphs:
      - "Representatives Morgan, Diercks, Prosser, and Slater and Senator Cathcart introduced the bill in the 2003 general session, writing a single new line into Wyoming's statutes to designate rodeo as the state sport. The law took effect on July 1, 2003, the same year South Dakota made the identical designation."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Rodeo Facts
    facts:
      - "Wyoming designated rodeo its official state sport in 2003, the same year as South Dakota and six years after Texas became the first state to do so."
      - "The 2003 law, sponsored by Representatives Morgan, Diercks, Prosser, and Slater and Senator Cathcart, added a single sentence to Wyoming's statutes."
      - "Cheyenne Frontier Days began in 1897 and calls itself the world's largest outdoor rodeo, drawing nearly 200,000 visitors each July."
      - "Wyoming's Bucking Horse and Rider symbol has appeared on license plates since 1936, making it the longest-running license plate design in the world."
      - "Steamboat, a bronc from a ranch near Chugwater, is popularly linked to Wyoming's license plate emblem and was inducted into three cowboy and rodeo halls of fame, though the state describes the plate's horse and rider as generic figures."

