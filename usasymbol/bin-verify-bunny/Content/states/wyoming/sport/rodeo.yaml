faq:
  - question: What is Wyoming's state sport?
    answer: "Wyoming's official state sport is rodeo, adopted in 2003."
  - question: When did Wyoming adopt rodeo as its state sport?
    answer: "Wyoming adopted rodeo as its state sport in 2003, the same year as South Dakota."
  - question: Why did Wyoming choose rodeo?
    answer: "Rodeo grew out of Wyoming's ranching culture, and Cheyenne Frontier Days has run since 1897 as one of the sport's oldest and largest events. The state's bucking horse and rider symbol, used since 1936, already tied rodeo to Wyoming's identity."
  - question: What is the Daddy of 'em All?
    answer: "The Daddy of 'em All is the nickname for Cheyenne Frontier Days, which began in 1897 as the first paid professional rodeo. It now bills itself as the world's largest outdoor rodeo."

