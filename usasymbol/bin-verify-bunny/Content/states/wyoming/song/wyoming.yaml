sections:
  - id: overview
    icon: fa-solid fa-music
    title: Wyoming State Song
    paragraphs:
      - "\"Wyoming\" is Wyoming's official state song, adopted by the Legislature in 1955. Judge Charles E. Winter wrote the words in 1903, and George E. Knapp composed the melody in 1920, meaning the song existed for decades before lawmakers gave it official status."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Wyoming\" Explained"
    paragraphs:
      - "The song moves through Wyoming's mountains, wildflowers, and open plains before closing each verse on the state's name as a refrain. It is written as a march, with a steady, marching-band tempo suited to parades and civic ceremonies."
      - "Charles E. Winter, a Wyoming judge, wrote the lyrics in the summer of 1903. George E. Knapp, a University of Wyoming voice professor and choral conductor, composed the melody used today in 1920, replacing an earlier, less popular tune written soon after Winter's original poem."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Wyoming" Represents Wyoming
    paragraphs:
      - "The song names the state directly and repeatedly, built around imagery of the Rocky Mountains, wildflowers, and open range that Wyomingites already associated with home. Its refrain of the state's own name gave it an obvious claim to becoming the official song."
      - "By 1955 the song had already been performed publicly for decades, including an early announcement of it as Wyoming's unofficial anthem at a 1903 industrial convention in Sheridan, giving lawmakers a long track record to point to before making it official."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Wyoming\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Wyoming" Became Wyoming's State Song
    paragraphs:
      - "The Wyoming Legislature formally adopted \"Wyoming\" as the official state song on February 15, 1955, more than fifty years after Charles E. Winter wrote the original words in 1903. The gap reflects how long the song circulated informally, through public performances and George E. Knapp's 1920 melody, before it was written into law."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Wyoming

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Wyoming\" Facts"
    facts:
      - "Wyoming adopted \"Wyoming\" as its official state song on February 15, 1955."
      - "Charles E. Winter wrote the lyrics in the summer of 1903."
      - "George E. Knapp composed the melody used today in 1920."
      - "The song was performed publicly for decades before its official adoption."
      - "Wyoming named a second, co-official state song, \"Wyoming Where I Belong,\" in 2018."

