faq:
  - question: What is Wyoming's state song?
    answer: "Wyoming's official state song is titled simply \"Wyoming,\" adopted in 1955."
  - question: Who wrote Wyoming's state song?
    answer: "Charles E. Winter wrote the lyrics in 1903, and George E. Knapp composed the melody in 1920."
  - question: When did Wyoming adopt "Wyoming" as its state song?
    answer: "The Legislature adopted the song on February 15, 1955."
  - question: Does Wyoming have more than one official state song?
    answer: "Yes. Wyoming also recognizes \"Wyoming Where I Belong,\" adopted as a co-official state song in 2018."

