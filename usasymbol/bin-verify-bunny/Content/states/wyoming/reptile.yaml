faq:
  - question: What is Wyoming's state reptile?
    answer: "Wyoming's state reptile is the horned lizard, adopted by the Wyoming Legislature in 1993."
  - question: When did Wyoming adopt the Horned Lizard?
    answer: "The Wyoming Legislature designated the horned lizard the official state reptile in 1993."
  - question: Why did Wyoming choose the Horned Lizard?
    answer: "Official sources name the horned lizard as Wyoming's state reptile for its unusual, spiky appearance and its presence across the state's grasslands, but they do not give a more detailed reason for the choice."
  - question: Is the Horned Lizard a turtle, snake, lizard, or alligator?
    answer: "The horned lizard is a lizard, easily recognized by the spikes covering its body and head."

