seo_title: "Wyoming State Reptile | Horned Lizard"
seo_description: "Wyoming's state reptile is the horned lizard, adopted in 1993. Learn what it looks like and why it became official."
hero_image: /images/reptiles/wyoming/wyoming-state-reptile-hero.webp
hero_image_alt: "A spiky, flat-bodied horned lizard resting on dry, sandy ground."
hero_image_caption: "The horned lizard, Wyoming's state reptile, is known for its spiky, armored appearance."
intro_text: "Wyoming's state reptile is the horned lizard, a spiky, flat-bodied lizard found in the state's dry grasslands and prairies, adopted in 1993. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Wyoming?
    paragraphs:
      - "The horned lizard is Wyoming's official state reptile, designated by the Wyoming Legislature in 1993. It represents the genus Phrynosoma rather than a single species."
      - "It is a small, spiky lizard found in dry grasslands and sagebrush country across much of Wyoming."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Horned Lizard
    paragraphs:
      - "The horned lizard has a flat, round body covered in spines, with a crown of larger horn-like spikes on the back of its head, giving it a distinctive, armored look."
      - "It is usually gray, brown, or reddish, blending in closely with the dry, sandy soil where it lives."
      - "It moves slowly and relies on its camouflage and spiky body to avoid predators, rather than speed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Wyoming Legislature designated the horned lizard the official state reptile in 1993, recognizing a distinctive lizard found across the state's dry, open country."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Wyoming Chose the Horned Lizard
    paragraphs:
      - "Official sources name the horned lizard as Wyoming's state reptile because of its unusual, spiky appearance and its presence across the state's grasslands, but they do not give a more detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Horned Lizard
    paragraphs:
      - "Horned lizards live in dry grasslands, sagebrush flats, and sandy or rocky soil across much of eastern and central Wyoming."
    sites:
      - name: Eastern Wyoming grasslands
        city: Cheyenne
        lat: 41.14
        lng: -104.82
        note: "Dry grassland habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Horned Lizard Facts
    facts:
      - "Adopted in 1993 by the Wyoming Legislature."
      - "Represents the genus Phrynosoma rather than one single species."
      - "Has a flat, spiky body with horn-like spikes on its head."
      - "Relies on camouflage and its armored look to avoid predators."
      - "Found in dry grasslands and sagebrush country across Wyoming."

