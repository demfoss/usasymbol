faq:
- question: What is Wyoming's state fossil?
  answer: "Wyoming's state fossil is Knightia (Knightia spp.), an extinct genus of herring-like fish from the Eocene epoch, adopted in 1987. It is the most commonly found vertebrate fossil in the world."
- question: When did Wyoming adopt its state fossil?
  answer: "Wyoming designated Knightia as its official state fossil in 1987."
- question: What did the Knightia look like?
  answer: "Knightia was a small, slender fish similar to a modern herring, typically 5 to 10 inches long with a forked tail and rows of scales along the belly. The larger species Knightia alta could reach about 12 inches."
- question: Where are Knightia fossils found in Wyoming?
  answer: "Knightia fossils come from the Green River Formation in southwestern Wyoming. Fossil Butte National Monument near Kemmerer is the premier site. Private quarries in Lincoln County allow visitors to collect specimens."
- question: When did the Knightia live?
  answer: "Knightia lived during the Eocene epoch, roughly 56 to 34 million years ago. The Green River Formation fish-bearing layers that preserve most Wyoming specimens were deposited about 50 million years ago."
- question: Why are there so many Knightia fossils?
  answer: "The ancient Green River lakes periodically experienced mass mortality events that killed entire schools of Knightia at once. The fish sank into fine lake sediment before they could decay, preserving them in remarkable detail. Thousands of specimens have been recovered from Wyoming quarries over more than a century of collecting."

