intro_text: "Wyoming's state fossil is Knightia (Knightia spp.), an extinct genus of herring-like fish preserved in extraordinary numbers in the Eocene Green River Formation, officially adopted in 1987. Knightia is the most commonly found vertebrate fossil in the world. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Wyoming State Fossil
  paragraphs:
  - "Wyoming designated Knightia as its state fossil in 1987. The choice reflected the state's extraordinary Eocene fossil record: the Green River Formation, which stretches across southwestern Wyoming and into Colorado and Utah, has yielded more Knightia specimens than any other vertebrate fossil species on Earth. Thousands of specimens are collected from Wyoming quarries each year and sold in rock shops and museum gift stores worldwide, making Knightia among the most widely distributed fossil species in private and public collections."

- id: about
  icon: fa-solid fa-paw
  title: What the Knightia Looked Like
  paragraphs:
  - "Knightia was a small schooling fish closely related to modern herring and shad. Most specimens of the common species Knightia eocaena run 5 to 10 inches long; the larger species Knightia alta can reach about 12 inches. The body was slender with a forked tail and rows of distinctive scales along the belly. Like modern herring, Knightia likely fed near the surface of the ancient lakes on plankton and small invertebrates, traveling in large schools."
  - "The Green River lakes periodically experienced mass mortality events that killed entire schools at once, burying thousands of fish in fine lake sediment before they could decompose. The exact cause remains debated. Proposed triggers include algal blooms, the sudden mixing of oxygen-depleted deep water with the surface layer, and volcanic ash falls. Whatever the mechanism, the result was some of the best-preserved fish fossils known anywhere on Earth."

- id: history
  icon: fa-solid fa-landmark
  title: How Knightia Became Wyoming's State Fossil
  paragraphs:
  - "The Green River Formation had drawn scientific attention since the 19th century, when naturalists and government surveyors first documented the fish-bearing layers around Kemmerer in Lincoln County. Commercial quarrying of the deposits began in earnest in the early 20th century. By the time Wyoming designated Knightia as its state fossil in 1987, specimens were already familiar in rock shops, school collections, and natural history museums across the country."
  - "The designation names the genus rather than a single species (Knightia spp.), acknowledging that multiple species occur in the formation. Knightia eocaena is the most abundant; Knightia alta is larger and rarer. Both are found in the same fish-bearing layers of the Green River Formation in southwestern Wyoming."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Knightia Fossils Are Found in Wyoming
  paragraphs:
  - "Fossil Butte National Monument near Kemmerer in Lincoln County is the premier Knightia site in Wyoming. The monument preserves some of the most productive fish-bearing layers of the Green River Formation and operates a visitor center where fossils can be seen in the rock as they were found. The National Park Service manages the site; commercial collection is not permitted inside the monument boundary."
  - "Private quarries in Lincoln County, including operations near Kemmerer and the town of Fossil, allow visitors to dig for their own specimens. Knightia fossils recovered from these commercial quarries reach rock shops and museum stores around the world. The Green River Formation outcrops broadly across southwestern Wyoming, and Knightia is found throughout the fish-bearing layers wherever the formation is exposed."
