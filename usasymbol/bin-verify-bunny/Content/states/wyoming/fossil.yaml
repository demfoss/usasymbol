- id: facts
  icon: fa-solid fa-lightbulb
  title: Knightia Facts
  facts:
  - "Wyoming designated Knightia as its state fossil in 1987; the designation covers the entire genus (Knightia spp.) rather than one species."
  - "Knightia is the most commonly found vertebrate fossil in the world — thousands of specimens are collected from Wyoming quarries every year."
  - "The two main species are Knightia eocaena (small, abundant) and Knightia alta (larger, rarer), both found in the Green River Formation."
  - "Fossil Butte National Monument near Kemmerer preserves the richest fish-bearing layers of the Green River Formation in Wyoming."
  - "Mass mortality events in the Green River lakes buried entire schools of Knightia in fine sediment, creating the exceptional preservation that makes specimens complete and detailed."

