sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Tennessee?
  paragraphs:
  - "The ladybug, family Coccinellidae, is one of Tennessee's two official state insects. State lawmakers designated it in 1975."
  - "Ladybug is a common name covering many small beetle species in the same family, rather than one single species. Tennessee shares the title with the common eastern firefly, adopted the same year."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Ladybug
  paragraphs:
  - "A ladybug is a small, round beetle with a domed shell, usually red or orange marked with black spots."
  - "Ladybugs have short legs and antennae and can fly using a pair of wings hidden under their hard outer shell."
  - "They are commonly found on plants and gardens across Tennessee, where they feed on small insects like aphids."

- id: history
  icon: fa-solid fa-landmark
  title: How Tennessee Chose the Ladybug
  paragraphs:
  - "The Tennessee General Assembly named the ladybug an official state insect in 1975. Lawmakers named the common eastern firefly a state insect at the same time."
  - "Official sources confirm both insects share the title but do not give a detailed account of why lawmakers chose to recognize two species instead of one."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Ladybug Facts
  facts:
  - "Adopted in 1975 by the Tennessee General Assembly."
  - "Ladybug refers to beetles in the family Coccinellidae, not one single species."
  - "Small, round, domed beetle, usually red or orange with black spots."
  - "Ladybugs feed on small insects like aphids in gardens and on plants."
  - "Tennessee also names the common eastern firefly a state insect, making it one of the few states with two official state insects."




