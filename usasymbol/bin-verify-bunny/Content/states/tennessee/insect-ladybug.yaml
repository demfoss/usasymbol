faq:
- question: What is Tennessee's state insect?
  answer: "Tennessee has two state insects, the ladybug and the common eastern firefly, both adopted by the Tennessee General Assembly in 1975."
- question: When did Tennessee adopt the ladybug?
  answer: "Tennessee adopted the ladybug as a state insect in 1975."
- question: What does Tennessee's ladybug look like?
  answer: "The ladybug is a small, round, domed beetle, usually red or orange with black spots."
- question: Is the ladybug Tennessee's only state insect?
  answer: "No. Tennessee also names the common eastern firefly a state insect, adopted the same year in 1975."
- question: Is the ladybug one specific species?
  answer: "No. Ladybug is a common name for many small beetle species in the family Coccinellidae, not one single species."

