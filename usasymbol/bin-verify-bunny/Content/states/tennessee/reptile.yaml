    answer: "Tennessee's state reptile is the eastern box turtle, adopted by the Tennessee General Assembly in 1995."
  - question: When did Tennessee adopt the eastern box turtle?
    answer: "The Tennessee General Assembly designated the eastern box turtle the official state reptile in 1995."
  - question: Why did Tennessee choose the eastern box turtle?
    answer: "Official sources name the eastern box turtle as the state reptile but do not give a detailed reason for the choice."
  - question: Is the eastern box turtle a turtle, snake, lizard, or alligator?
