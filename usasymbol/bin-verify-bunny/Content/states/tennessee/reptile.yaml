intro_text: "Tennessee's state reptile is the eastern box turtle, a land turtle known for its high, domed shell, adopted in 1995. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Tennessee?
    paragraphs:
      - "The eastern box turtle is Tennessee's official state reptile, designated by the Tennessee General Assembly in 1995. Its scientific name is Terrapene carolina carolina."
      - "It is a land-dwelling turtle found in forests and fields throughout the state, unlike most turtles that spend their lives mainly in water."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Eastern Box Turtle
    paragraphs:
      - "The eastern box turtle has a high, domed shell that is usually dark brown with yellow or orange markings, and no two turtles have exactly the same pattern."
      - "It can pull its head, legs, and tail completely inside its shell and close the bottom shell like a hinged box, which gives the species its name."
      - "Adults typically grow to about 4 to 6 inches long and can live for many decades in the wild."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Tennessee General Assembly designated the eastern box turtle the official state reptile in 1995, recognizing a turtle familiar to people across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Tennessee Chose the Eastern Box Turtle
    paragraphs:
      - "Official sources name the eastern box turtle as the state reptile but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Eastern Box Turtle
    paragraphs:
      - "The eastern box turtle lives in forests, fields, and wetland edges across Tennessee, from the Appalachian foothills to the western lowlands."
    sites:
      - name: Great Smoky Mountains National Park
        city: Gatlinburg
        lat: 35.68
        lng: -83.53
        note: "Common woodland habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Eastern Box Turtle Facts
    facts:
      - "Adopted in 1995 by the Tennessee General Assembly."
      - "Can close its shell completely using a hinged bottom shell."
      - "Grows to about 4 to 6 inches in shell length."
      - "Lives on land instead of mainly in water like most turtles."
      - "Can live for several decades, with some individuals reaching over 50 years old."

