seo_title: "Tennessee State Soil | Maury Series"
seo_description: "The Tennessee state soil is the Maury series. It covers the Nashville Basin, growing burley tobacco, corn, and soybeans on phosphatic limestone."
hero_image: /images/soils/tennessee/tennessee-state-soil-hero.webp
