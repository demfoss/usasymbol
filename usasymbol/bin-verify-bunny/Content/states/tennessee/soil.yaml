faq:
- question: What is Tennessee's state soil?
  answer: "Tennessee's state soil is the Maury series, a deep red Alfisol that covers the Nashville Basin of middle Tennessee. It formed from phosphatic Ordovician limestone and is one of the most naturally fertile soils in the southeastern United States."
- question: Why is it called Maury soil?
  answer: "The Maury series is named after Maury County, Tennessee, in the heart of the Nashville Basin. USDA soil scientists formally described and named the series in Maury County during early-twentieth-century federal soil surveys, following the convention of naming series after nearby geographic features."
- question: What color is Maury soil?
  answer: "The surface is brown silt loam. Within ten inches the soil turns yellowish red as the argillic clay horizon begins. By two feet it is deep brick red — dense, iron-rich clay. The subsoil deepens to dark red before transitioning through reddish brown clay loam toward the reddish yellow limestone residuum at the base."
- question: Where is Maury soil found in Tennessee?
  answer: "Maury soil covers the Nashville Basin, an oval lowland of roughly 5,500 square miles in middle Tennessee. It is most extensive in Maury, Davidson, Williamson, Rutherford, Wilson, Sumner, Robertson, and Cheatham counties, with additional coverage in Bedford, Marshall, Smith, Cannon, and Trousdale counties on the basin margins."
- question: What grows in Maury soil?
  answer: "Burley tobacco, corn, soybeans, and winter wheat are the main crops. Tall fescue and orchard grass cover large areas of Maury soil pastureland for livestock and Tennessee Walking Horses. Where forested, eastern red cedar, white oak, chinquapin oak, and blue ash dominate."
- question: Why is Maury soil so fertile?
  answer: "Maury soil formed from phosphatic Ordovician limestone deposited in a tropical sea 450 million years ago. As the limestone dissolved, it left behind residue rich in phosphate, calcium, and iron. The phosphate provides natural crop nutrition, and the calcium from the limestone keeps the pH near neutral — both conditions that make Maury unusually productive without heavy fertilizer inputs."
- question: What is the connection between Maury soil and Tennessee Walking Horses?
  answer: "Tennessee Walking Horses were developed on Maury soil pastureland in the Nashville Basin, where the phosphate-rich limestone bedrock produces calcium and phosphorus-rich grasses. The same geological connection exists in Kentucky's Bluegrass region. Strong bones in horses require calcium and phosphorus, and both come naturally from the Ordovician limestone soils on which the horses are raised."

