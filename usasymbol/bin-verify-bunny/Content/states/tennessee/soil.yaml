- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Maury Soil
  paragraphs:
  - "Burley tobacco was the defining cash crop of Maury soil for most of Tennessee's history. Middle Tennessee's Nashville Basin counties — anchored on Maury soil — were among the top burley tobacco producers in the country through the twentieth century. The deep, fertile, nearly neutral soil suited tobacco's demand for phosphate and calcium in ways that the thinner, more acidic soils of the surrounding Highland Rim could not match."
  - "Corn and soybeans now dominate the row-crop acres on Maury soil. Tennessee consistently ranks in the top tier of southeastern states for soybean production, with the Nashville Basin counties contributing disproportionately to that output. Winter wheat and grain sorghum are also grown in rotation across the basin."
  - "Tall fescue and orchard grass pastures cover a large share of Maury soil farmland. The near-neutral pH and high natural phosphate make Maury land exceptionally productive for cool-season grasses without heavy fertilization. This is Tennessee Walking Horse country — the Maury County seat of Columbia is the home of the Tennessee Walking Horse National Celebration held annually in nearby Shelbyville, and the same phosphate-rich pastures that built thoroughbred racing in Kentucky's Bluegrass extend into the Nashville Basin."
  - "Where Maury soil is forested, the canopy is eastern red cedar, white oak, chinquapin oak, and blue ash — species adapted to the near-neutral, calcium-rich conditions of a limestone-derived soil. Eastern red cedar colonizes abandoned Maury soil fields aggressively, making it the first woody species to reclaim cleared land across the Nashville Basin."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Maury Soil Facts
  facts:
  - "Maury soil is classified as a fine, mixed, active, thermic Typic Paleudalf — an Alfisol with a thick, ancient argillic horizon (pale = old, deeply developed clay subsoil) formed in residuum weathered from phosphatic Ordovician limestone. The thermic classification means the soil averages between 15°C and 22°C annually."
  - "The phosphatic limestone that formed Maury's parent material was deposited during the Ordovician period, roughly 450 million years ago, when a shallow tropical sea covered middle Tennessee. The phosphate in those ancient marine sediments is the source of Maury's natural fertility — the same phosphate that makes it productive for tobacco, pasture, and grain without heavy fertilizer inputs."
  - "Maury County, for which the soil is named, was settled heavily in the early 1800s by planters from Virginia and the Carolinas who had learned to identify fertile limestone soils in the Valley and Ridge. They chose the Nashville Basin deliberately over cheaper Highland Rim land because the red clay indicated limestone beneath — a reliable sign of high natural fertility."
  - "The Nashville Basin's phosphatic limestone soils, including Maury, are geologically similar to the Inner Bluegrass of Kentucky, where the same Ordovician limestone produces the phosphate-rich pastures associated with thoroughbred horse breeding. Middle Tennessee's Tennessee Walking Horse industry developed on Maury soil for the same reason — calcium and phosphate from the limestone bedrock build strong bones."
  - "Maury soil supports one of the densest concentrations of working farms per square mile in the southeastern United States. Nashville Basin counties have resisted farmland conversion more successfully than other peri-urban regions partly because Maury soil farmland has high enough productivity to remain economically viable even under suburban development pressure."

