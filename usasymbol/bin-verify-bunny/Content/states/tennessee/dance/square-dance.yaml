sections:
  - id: overview
    icon: fa-solid fa-music
    title: Tennessee State Dance
    paragraphs:
      - "Tennessee named square dance its official state folk dance in 1980. The designation fit a state already known nationally for its country and bluegrass music, genres long paired with square dance calling and string-band accompaniment."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the center of the set. A caller directs the group through a changing sequence of figures, so the dance unfolds differently every time."
      - "String-band music built around fiddle, banjo, and guitar drives the tempo, the same instrumentation at the heart of Tennessee's country and bluegrass tradition. Couples circle, cross, and exchange places before returning to their original spot in the square."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Arrange four couples in a square, each pair facing the center with partners side by side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the music begins."
      - title: "Circle Left with the Set"
        description: "Join hands with the full square and step together in a circle to the left."
      - title: "Do-Si-Do Your Corner"
        description: "Walk forward and pass your corner back to back without turning, then return to place."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the set to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Tennessee
    paragraphs:
      - "Square-dance callers' associations and dance organizations ran a national campaign through the 1970s and 1980s urging states to name square dance an official folk dance. Tennessee's 1980 adoption followed that same wave."
      - "The state's identity as a home of country and bluegrass music gave square dance an especially natural fit, since both traditions share the same fiddle-and-string-band foundation. The designation linked an already well-known musical identity to a matching dance form."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Tennessee's Dance
    paragraphs:
      - "The Tennessee General Assembly designated square dance the state's official folk dance in 1980."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Tennessee adopted square dance as its official state folk dance in 1980."
      - "Tennessee's square dance tradition is paired with the same string-band instrumentation found in the state's country and bluegrass music."
      - "Tennessee's adoption followed a national campaign by square-dance callers' associations urging states to name it an official folk dance."
      - "The dance is led by a caller and danced in sets of four couples."

