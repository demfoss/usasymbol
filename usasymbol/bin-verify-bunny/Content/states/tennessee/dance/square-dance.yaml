faq:
  - question: What is Tennessee's state dance?
    answer: "Tennessee's official state dance is square dance, adopted in 1980 as the state folk dance."
  - question: When did Tennessee adopt square dance as its state dance?
    answer: "Tennessee adopted square dance in 1980."
  - question: Why did Tennessee choose square dance?
    answer: "Square dance shares its fiddle-and-string-band roots with Tennessee's country and bluegrass music identity, and the 1980 adoption followed a national campaign by callers' associations."
  - question: Is square dance the same in every state?
    answer: "The basic formation and calls are shared nationally, though Tennessee and many other states each adopted the dance separately as their own official folk dance."

