faq:
  - question: What is Colorado's state dance?
    answer: "Colorado's official state dance is square dance, adopted in 1992."
  - question: When did Colorado adopt square dance as its state dance?
    answer: "Colorado adopted square dance as its official state dance in 1992."
  - question: Why did Colorado choose square dance?
    answer: "Square dance already had a strong presence in Colorado's mining towns and mountain communities, and the state's designation followed a broader national campaign by square-dance organizations."
  - question: What does a caller do in square dance?
    answer: "A caller directs dancers through each figure in real time, calling out moves such as circle left or promenade as the music plays. Colorado dancers, like square dancers nationwide, rely on the caller to keep the set moving together."

