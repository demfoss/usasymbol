sections:
  - id: overview
    icon: fa-solid fa-music
    title: Colorado State Dance
    paragraphs:
      - "Square dance became Colorado's official state dance in 1992. The designation formalized a dance already familiar from community halls in the state's mountain towns and agricultural communities."
      - "Colorado's version of the dance follows the same national pattern found across the country: four couples, a caller, and a shared set of figures."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each pair facing the center from one of the four sides. A caller directs the group through a sequence of moves, timed to lively string-band or fiddle music."
      - "Dancers respond to the caller in real time instead of following a fixed routine, which keeps the pace quick and the outcome a little different every time. Fiddle, banjo, and guitar typically drive the tempo."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand on the four sides of an imaginary square, each dancer facing the center."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the caller signals the dance is starting."
      - title: "Circle Left with the Whole Set"
        description: "All eight dancers join hands and move together to the left, following the caller's steady count."
      - title: "Allemande Left with Your Corner"
        description: "Take your corner's left hand and turn once around them before releasing back to the set."
      - title: "Promenade Back to Place"
        description: "Take your partner's near hand and walk together around the square to your home position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Colorado
    paragraphs:
      - "Square dance took hold in Colorado's mining towns and mountain communities, where a caller and a few musicians could turn a boarding house parlor or town hall into a dance floor. That practical, portable format suited a state where communities were often small and spread across rugged terrain."
      - "Colorado's 1992 designation also reflects a national trend. Square-dance callers' associations and dance organizations campaigned for decades, beginning in the 1970s, to have states adopt square dance as an official dance, and Colorado's action followed that broader movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Colorado Adopted the Square Dance
    paragraphs:
      - "Colorado named square dance its official state dance in 1992, joining a long list of states that made similar designations amid the decades-long national campaign by square-dance organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Colorado adopted square dance as its official state dance in 1992."
      - "The dance found a lasting home in Colorado's mining towns and mountain communities."
      - "Square dance places four couples into a square, directed by a caller through each figure."
      - "Colorado's designation followed a national campaign by square-dance callers' groups that began in the 1970s."

