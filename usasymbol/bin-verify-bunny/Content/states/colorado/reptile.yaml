faq:
  - question: What is Colorado's state reptile?
    answer: "Colorado's state reptile is the western painted turtle, adopted by the Colorado Legislature in 2008."
  - question: When did Colorado adopt the western painted turtle?
    answer: "The Colorado Legislature designated the western painted turtle the official state reptile in 2008."
  - question: Why did Colorado choose the western painted turtle?
    answer: "It is the most common and widespread native turtle in Colorado, making it a familiar species for the state to recognize."
  - question: Is the western painted turtle a turtle, snake, lizard, or alligator?
