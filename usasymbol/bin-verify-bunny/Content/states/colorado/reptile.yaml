sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Colorado?
    paragraphs:
      - "The western painted turtle is Colorado's official state reptile, designated by the Colorado Legislature in 2008. Its scientific name is Chrysemys picta bellii."
      - "It is the most widespread native turtle in Colorado, found in ponds, lakes, and slow-moving rivers across much of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Western Painted Turtle
    paragraphs:
      - "The western painted turtle has a smooth, dark olive to black shell with red and yellow markings along its edges and a patterned yellow underside."
      - "Adults typically grow to less than 10 inches long, and they are often seen basking in groups on logs and rocks near water."
      - "It is a strong swimmer and spends much of its time in slow-moving or still freshwater habitat."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Colorado Legislature designated the western painted turtle the official state reptile in 2008, following a campaign led by Colorado students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Colorado Chose the Western Painted Turtle
    paragraphs:
      - "The western painted turtle is the most common and widespread native turtle in Colorado, making it a familiar and recognizable species for the state to represent."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Western Painted Turtle
    paragraphs:
      - "The western painted turtle is found in ponds, lakes, and slow rivers across much of Colorado, including the South Platte River basin near Denver."
