sections:
  - id: official-designation
    title: "How Colorado Made Blue and White Official"
    style: default
    paragraphs:
      - "Colorado's General Assembly designated blue and white as official state colors in 1911, the same session that adopted the state flag. The flag was designed by Andrew Carlisle Johnson of Denver, who built the design around the two colors. Blue runs across the top and bottom stripes, white fills the center."
      - "The 1911 act left one thing unresolved: the exact proportions of the letter C on the flag were never specified. In 1929, the legislature returned to the flag and standardized the dimensions. The colors themselves have remained unchanged since the original act."

  - id: what-colors-mean
    title: "What Colorado Colors Mean"
    style: color-meaning-cards
    intro: "When Colorado adopted blue and white in 1911, the blue columbine had already been the official state flower for twelve years. The colors formalized a connection the landscape already made obvious. No official Pantone or HEX was specified in the original act."
    color_cards:
      - color_name: "Blue"
        hex: "#002868"
        heading: "What Colorado Blue Means"
        meaning: "Blue fills the two horizontal stripes of the Colorado state flag and the distinctive letter C. When the legislature chose it in 1911, they linked it to the Colorado sky and the blue columbine, the state flower since 1899."
      - color_name: "White"
        hex: "#FFFFFF"
        heading: "Meaning of Colorado White"
        meaning: "Snowpack on Colorado's peaks stays year-round above 11,000 feet. That enduring presence is what the 1911 act captured in the center stripe: a band of white between two blue bars."

  - id: where-colors-appear
    title: "Where Colorado Colors Appear"
    style: color-appear-cards
    intro: "Blue and white appear on the Colorado state flag, the state seal, and in the state's official columbine, the flower that inspired the blue."
    appear_cards:
      - image: "/images/flags/colorado/flag.webp"
        alt: "Colorado state flag — blue and white horizontal stripes with red letter C and golden disk"
        heading: "State Flag"
        description: "Three stripes run the full width of the flag, blue on top, white in the center, blue on the bottom, with a red letter C on the left containing a golden disk representing Colorado sunshine."
      - image: "/images/seals/colorado/seal.webp"
        alt: "Colorado state seal with Rocky Mountains and the motto Nil Sine Numine"
        heading: "State Seal"
        description: "The Great Seal of Colorado places the Rocky Mountains at center, an eye of God above them, and the motto Nil Sine Numine in blue lettering around the border."
      - image: null
        alt: "Colorado blue columbine flower, blue outer petals and white inner petals"
        heading: "Blue Columbine"
        description: "Colorado's official state flower since 1899 has blue outer petals and white inner ones, the two official colors appearing together in nature twelve years before the legislature made them official."

faq:
  - question: "What are Colorado's state colors?"
    answer: "Blue and white are the official state colors of Colorado, adopted by law in 1911."
  - question: "What do Colorado's state colors mean?"
    answer: "Blue was chosen for the Colorado sky and the blue columbine, the state flower since 1899. White represents the Rocky Mountain snowpack. Both appeared on the state flag the same year the colors were adopted."
  - question: "When did Colorado adopt its state colors?"
    answer: "In 1911, in the same legislative session that also adopted the state flag."
  - question: "What colors are on the Colorado flag?"
    answer: "Two blue horizontal stripes with a white stripe between them, plus a red letter C on the left side containing a golden disk."

