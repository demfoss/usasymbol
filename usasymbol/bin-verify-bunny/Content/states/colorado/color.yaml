seo_title: "Colorado State Colors | Blue and White"
seo_description: "Official Colorado state colors are Blue and White, adopted in 1911. Blue reflects the sky and the columbine, white the Rocky Mountain snow."

intro_text: "The official state colors of Colorado are **Blue** and **White**, designated by the state legislature in 1911. Blue was chosen for the sky and the blue columbine, Colorado's state flower since 1899. White represents the Rocky Mountain snowpack."

official_colors: "Blue, White"
official_since: "Official 1911"
primary_use: "State Flag, State Seal, State Branding"
known_for: "Three horizontal stripes on a 1911 flag, blue above and below, white at center, with a red letter C holding a golden disk for the Colorado sun."

