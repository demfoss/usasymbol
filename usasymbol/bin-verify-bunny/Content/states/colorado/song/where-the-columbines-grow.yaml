faq:
  - question: What is Colorado's state song?
    answer: "Colorado's original state song is \"Where the Columbines Grow,\" adopted in 1915."
  - question: Who wrote Colorado's state song?
    answer: "A. J. Fynn, a schoolteacher, wrote both the words and music in 1911."
  - question: When did Colorado adopt "Where the Columbines Grow" as its state song?
    answer: "The Colorado Legislature adopted it as the state song on May 8, 1915."
  - question: Does Colorado have more than one official song?
    answer: "Yes. Colorado also recognizes \"Rocky Mountain High\" by John Denver as a co-official state song, added in 2007."

