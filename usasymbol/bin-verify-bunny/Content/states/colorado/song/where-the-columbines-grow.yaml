sections:
  - id: overview
    icon: fa-solid fa-music
    title: Colorado State Song
    paragraphs:
      - "\"Where the Columbines Grow\" is Colorado's original state song, adopted by the legislature in 1915. Educator A. J. Fynn wrote both the words and music in 1911 after encountering a mountain meadow filled with the state flower."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Where the Columbines Grow\" Explained"
    paragraphs:
      - "The song describes the high Rocky Mountain country where columbine wildflowers bloom, treating the meadow as a stand-in for Colorado's beauty and open freedom. It is written as a simple, hymn-like melody suited to group and school singing."
      - "A. J. Fynn was a schoolteacher and archaeologist who moved to Colorado in 1889 to teach in Central City. While hiking near Schinzel Flats, he and his group came across a meadow covered in columbines, an experience that led directly to the song's words and music in 1911."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Where the Columbines Grow" Represents Colorado
    paragraphs:
      - "Colorado had already named the columbine its official state flower in 1899, so a song built around that same flower gave the state two connected symbols instead of two unrelated ones. Fynn's firsthand account of finding the flowers on a mountain hike gave the song a genuine Colorado origin story."
      - "As a teacher, Fynn also had a built-in audience of schoolchildren who learned and sang the piece, helping it spread across the state well before its formal adoption. Its plain, singable melody made it easy to teach in classrooms statewide."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Where the Columbines Grow\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Where the Columbines Grow" Became Colorado's State Song
    paragraphs:
      - "Fynn wrote the song in 1911 and dedicated the published sheet music to Colorado's pioneers. The Colorado Legislature adopted it as the official state song on May 8, 1915, the same year the sheet music reached wider publication."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Colorado

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Where the Columbines Grow\" Facts"
    facts:
      - "Colorado adopted \"Where the Columbines Grow\" as its state song on May 8, 1915."
      - "A. J. Fynn wrote both the words and music after a hike near Schinzel Flats in 1911."
      - "Fynn was a schoolteacher and archaeologist, not primarily a musician."
      - "Colorado later added \"Rocky Mountain High\" by John Denver as a co-official state song in 2007."

