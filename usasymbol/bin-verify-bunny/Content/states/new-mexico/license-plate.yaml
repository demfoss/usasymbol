intro_text: '**"Land of Enchantment"** is New Mexico''s defining license plate slogan. It appeared in 1941 as **"The Land of Enchantment"** and shortened in 1952. Today the yellow and turquoise standard plates carry it, while the chile plate adds **"Chile Capital of the World"** and keeps "Land of Enchantment" below. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: 'New Mexico''s main plate slogan is "Land of Enchantment." It began in 1941 as "The Land of Enchantment" and changed to the shorter form in 1952. Current standard options include the yellow yucca plate, the turquoise Land of Enchantment plate, and the chile plate reading "Chile Capital of the World."'
