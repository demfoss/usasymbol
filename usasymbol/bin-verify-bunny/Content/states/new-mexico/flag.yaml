seo_title: "New Mexico State Flag: The Zia Sun Symbol Explained"
seo_description: "New Mexico's flag uses the Zia sun symbol rather than a state seal, making it one of the cleanest U.S. flag designs."

intro_text: "The official state flag of New Mexico dates to 1925 and includes a red Zia sun symbol on a yellow field. Four groups of rays extend from a central circle. The colors and symbol reflect New Mexico's Spanish colonial heritage and Native American culture. This profile appears in the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the New Mexico State Flag Is Designed"
    paragraphs:
      - "The New Mexico state flag is the official flag of New Mexico. A golden yellow field covers the background. A red Zia sun symbol sits in the center."
      - "The symbol shows a circle with four groups of rays extending outward. Each group contains four rays. The design comes from Zia Pueblo pottery. State buildings, schools, and public venues across New Mexico display this flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the New Mexico Flag Communicates"
    paragraphs:
      - "The flag represents New Mexico's cultural heritage through the Zia sun symbol. The Zia people consider the number four sacred. Four appears throughout the symbol's design."
      - "The four groups of rays represent four directions, four seasons, four times of day, and four stages of life. The circle binds these elements together. It symbolizes the circle of life and unity."
      - "Red and yellow honor Spain's historical connection to New Mexico. Spanish explorers arrived in the 1500s. These colors appeared on Spanish flags. The combination acknowledges New Mexico's Spanish colonial past."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "New Mexico Flag History and Adoption"
    paragraphs:
      - "New Mexico approved its state flag in 1925. The state held a design competition sponsored by the Daughters of the American Revolution. Dr. Harry Mera won with his Zia sun design. He was an archaeologist and physician who studied Southwestern culture."
      - "Before the current flag, New Mexico used a different design from 1915. Ralph Emerson Twitchell created that flag. It showed a small American flag in the canton and the number 47 in the fly. The number marked New Mexico as the 47th state. That design proved unpopular and difficult to identify."
      - "The 1925 competition aimed to create a distinctive design. Mera drew inspiration from a water jar at Zia Pueblo. The flag gained immediate popularity. Its simple design set it apart from seal-on-blue flags. New Mexico kept the design unchanged since adoption."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the New Mexico Flag"
    versions:
      - name: "Twitchell Flag"
        years: "1915–1925"
        image: "versions/twitchell-1915.webp"
        description: "Designed by Ralph Emerson Twitchell, this flag featured a small American flag in the canton and the number 47 on a blue field."

      - name: "Current State Flag"
        years: "1925–present"
        image: "versions/current-1925.webp"
        description: "The Zia sun symbol designed by Dr. Harry Mera on a golden yellow field with red symbol."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the New Mexico Flag"
    symbols:
      - id: zia-symbol
        name: "Zia Sun Symbol"
        image: "symbols/zia-symbol.svg"
        paragraphs:
          - "The Zia sun symbol dominates the flag's center. A red circle forms the sun's core. Four groups of rays extend from the circle in cardinal directions. Each group contains four rays."
          - "The symbol comes from Zia Pueblo pottery designs. The Zia people are Indigenous to New Mexico. They used this sun symbol in their traditional art for centuries before it appeared on the flag."
          - "The number four holds sacred meaning in Zia philosophy. Four directions guide travelers. Four seasons mark the year. Four times of day structure each day: sunrise, noon, evening, night. Four stages define life: childhood, youth, adulthood, old age. The circle represents these cycles working together."

      - id: field
        name: "Yellow Field"
        image: "symbols/field.svg"
        paragraphs:
          - "Golden yellow covers the entire background. This color comes from Spanish flags flown in New Mexico during colonial times. Yellow represents the sun and New Mexico's bright desert landscape."
          - "The shade was specifically chosen to match Spanish royal standards. It connects New Mexico to its Spanish heritage that began in the 1500s with early exploration."

      - id: red
        name: "Red Color"
        image: "symbols/red.svg"
        paragraphs:
          - "Red appears in the Zia sun symbol. This color also derives from Spanish colonial flags. The specific red matches Spanish heraldic traditions."
          - "Together, red and yellow create strong visual contrast. The combination makes the flag easy to identify from a distance. These colors separate New Mexico's flag from typical blue state flags."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "New Mexico State Flag Colors"
    paragraphs:
      - "The flag uses golden yellow and red. Golden yellow forms the field and represents Spanish colonial heritage and desert sun. Red depicts the Zia sun symbol and matches Spanish royal colors."
    colors:
      - name: "Golden Yellow"
        hex: "#FFD700"
      - name: "Red"
        hex: "#BF0A30"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Mexico State Flag Facts"
    facts:
      - "New Mexico adopted its current flag in 1925"
      - "Dr. Harry Mera designed the flag after studying Zia Pueblo pottery"
      - "The Zia sun symbol features four groups of four rays each"
      - "Ralph Emerson Twitchell designed the 1915-1925 flag"
      - "The number four is sacred in Zia culture"
      - "Red and yellow honor Spanish colonial heritage"

faq:
  - question: "What is the official state flag of New Mexico?"
    answer: "The New Mexico state flag is the official banner of New Mexico. It features a red Zia sun symbol on a golden yellow field."

  - question: "How would you describe the design of the New Mexico state flag?"
    answer: "The flag shows a red Zia sun symbol centered on a golden yellow background. The symbol consists of a circle with four groups of four rays extending outward in the cardinal directions."

  - question: "How do historians explain the symbolism of New Mexico's flag?"
    answer: "The flag represents New Mexico's cultural heritage. The Zia sun symbol comes from Zia Pueblo pottery. Red and yellow honor Spanish colonial history. The design acknowledges both Native American and Spanish influences."

  - question: "What does the New Mexico state flag represent?"
    answer: "The flag means unity through cultural diversity. The Zia symbol represents four sacred concepts: directions, seasons, times of day, and life stages. The circle binds these together symbolizing life's continuity."

  - question: "How are the colors of the New Mexico state flag described?"
    answer: "The Zia sun symbol appears on the flag. It shows a red circle with four groups of four rays extending in the four cardinal directions."

  - question: "What are the main visual elements on New Mexico's flag?"
    answer: "The Zia symbol is a sacred sun design from Zia Pueblo culture. It features a circle with four groups of four rays. The number four represents directions, seasons, times of day, and life stages in Zia philosophy."

  - question: "What colors are used on New Mexico's flag?"
    answer: "The New Mexico state flag uses golden yellow and red. These colors come from Spanish colonial flags and honor Spain's historical connection to New Mexico."

  - question: "In what year did New Mexico's current flag become official?"
    answer: "New Mexico adopted its current state flag in 1925 after a design competition. The previous Twitchell flag was used from 1915 to 1925."

