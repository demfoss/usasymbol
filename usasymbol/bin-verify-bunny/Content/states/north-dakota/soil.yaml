faq:
- question: What is North Dakota's state soil?
  answer: "North Dakota's state soil is the Barnes series, a very dark, organic-rich Mollisol that covers the glaciated plains of central and eastern North Dakota. It is one of the most productive dryland farming soils in the United States and is recognized by the USDA Natural Resources Conservation Service as North Dakota's representative state soil."
- question: Why is it called Barnes soil?
  answer: "The series is named after Barnes County in southeastern North Dakota, where soil scientists first formally described and mapped the soil. Barnes County sits in the heart of the glaciated plains — the landscape that defines the soil's distribution across the state."
- question: What color is Barnes soil?
  answer: "The surface is nearly black — one of the darkest soils in North America. That color comes from humus, the organic matter produced by thousands of years of prairie grass roots decomposing in the ground. The subsoil transitions to dark brown, then pale brown in the calcium-rich layer above the glacial till."
- question: Where is Barnes soil found in North Dakota?
  answer: "Barnes soil covers the glaciated plains of central and eastern North Dakota, in counties including Barnes, Stutsman, Cass, Richland, Ransom, and LaMoure. It sits on upland summits and side slopes left by the retreating Laurentide Ice Sheet at elevations of 1,200 to 2,000 feet."
- question: What crops grow in Barnes soil?
  answer: "The main crops are spring wheat, durum wheat, sunflowers, canola, flaxseed, and barley. Soybeans and corn have become more common in recent decades. North Dakota leads the nation in durum wheat and sunflower production, and both crops grow mainly in Barnes soil."
- question: Who chose Barnes as North Dakota's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Barnes series to represent North Dakota. It was chosen because it is the most widespread and economically important soil in the state, covering more land than any other named soil series."
- question: How deep is the black layer in Barnes soil?
  answer: "The mollic epipedon — the dark, organic-rich surface layer that defines Barnes soil as a Mollisol — is typically 12 to 15 inches deep. This thick black layer is what makes Barnes soil exceptionally fertile. Below it, the soil transitions through brown subsoil to pale glacial till."

