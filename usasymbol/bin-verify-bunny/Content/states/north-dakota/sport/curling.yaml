faq:
  - question: What is North Dakota's state sport?
    answer: "North Dakota's official state sport is curling, adopted in 2023."
  - question: When did North Dakota adopt curling as its state sport?
    answer: "North Dakota adopted curling as its state sport in March 2023, when Governor Doug Burgum signed the bill in Bismarck."
  - question: Why did North Dakota choose curling?
    answer: "North Dakota has 11 curling clubs, more than any other state, a legacy of Scottish and Canadian immigrants who brought the game to the Red River Valley in the 1800s. The sport fits the state's long winters better than almost any other."
  - question: Who came up with the idea to make curling North Dakota's state sport?
    answer: "Eleven-year-old Bismarck curler Alaina Schmit brought the idea to state lawmakers after noticing North Dakota had no official sport. She and fellow curler Etta Knapp testified for the bill themselves."

