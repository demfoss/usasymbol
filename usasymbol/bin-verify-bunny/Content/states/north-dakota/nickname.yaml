title: "The Peace Garden State"
state: "North Dakota"
type: "State Nickname"
is_official: true
adopted_year: 1957
other_nicknames:
  - "Flickertail State"
  - "Roughrider State"
  - "Sioux State"

author: "USA Symbol Team"
date_published: "2025-12-14"
date_modified: "2026-03-24"
seo_title: "North Dakota State Nickname | The Peace Garden State"
seo_description: "North Dakota is known as The Peace Garden State, its official state nickname. Learn why the name fits and what other nicknames the state has used."

intro_text: "North Dakota's official state nickname is <i>The Peace Garden State</i>, adopted by the legislature in 1957 and featured in the [list of U.S. state nicknames](/symbols/nicknames). The name comes from the International Peace Garden, a park located on the border between North Dakota and Manitoba, Canada. State officials first placed this nickname on license plates in 1956, and its popularity with residents led lawmakers to make it official the following year."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Peace Garden State'"
    paragraphs:
      - "The International Peace Garden opened on July 14, 1932, as a symbol of friendship between the United States and Canada. More than 50,000 people attended the dedication ceremony. Planners intentionally chose a site that straddles the international boundary so the garden would belong equally to both nations. Visitors can move between the two countries within the park without passing through customs checkpoints."
      - "Each year, workers plant more than 150,000 flowers throughout the garden. The site covers approximately 2,339 acres and includes walking trails, a floral clock, and several monuments dedicated to peace. For decades, a Peace Tower with twin 120-foot concrete pillars stood on the grounds until severe weather damage led to its demolition in 2017. Plans remain in place to construct a replacement structure, and cross-border geography is detailed on [the North Dakota borders page](/states/north-dakota/borders)."
      - "In 1956, North Dakota’s Motor Vehicle Department added Peace Garden State to license plates without formal legislative approval. The phrase quickly gained public support. In 1957, the legislature passed a law officially adopting the name as the state nickname. Today, the International Peace Garden continues to attract more than 150,000 visitors annually. The Peace Garden State stands out as one of the few official nicknames rooted in international diplomacy rather than geography or natural resources, and that tone also appears on [North Dakota's state flag page](/states/north-dakota/flag/north-dakota-state-flag)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Flickertail State"
        text: "This nickname comes from Richardson ground squirrels, commonly called flickertails because their tails twitch rapidly as they run or before they enter their burrows. These animals inhabit much of North Dakota’s grassland regions and live in large colonies. The species was identified by Scottish naturalist Sir John Richardson, which later influenced the nickname. In 1953, lawmakers considered adopting the flickertail as an official state emblem, but the proposal failed. North Dakota does have an official march titled the <i>Flickertail March</i>, composed in 1975. The nickname remains widely recognized but unofficial."
      - subtitle: "Roughrider State"
        text: "Tourism officials promoted this nickname during the 1960s and 1970s. It honors Theodore Roosevelt’s First U.S. Volunteer Cavalry, known as the Rough Riders, which fought during the Spanish-American War in 1898. Several cowboys from North Dakota joined the regiment and fought on foot in Cuba when horses could not be transported. Legislators introduced bills in 1971 and 1973 to replace Peace Garden State with Roughrider Country on license plates and as the official nickname, but both efforts failed. Roosevelt’s time ranching in the North Dakota Badlands later inspired the creation of Theodore Roosevelt National Park and overlaps with [North Dakota's Nokota horse heritage](/states/north-dakota/mammal/nokota-horse)."
      - subtitle: "Sioux State"
        text: "The word Dakota comes from the Sioux language and translates to friend or ally. Dakota and Lakota tribes lived in the region for thousands of years before European settlement. When Congress organized the Dakota Territory in 1861, the name acknowledged the Indigenous peoples of the area. The territory later divided, and North Dakota and South Dakota entered the Union on November 2, 1889. Although used less often, this nickname reflects the Native American origins of the state’s name. South Dakota developed its own identity from the same roots — the [meaning of the Mount Rushmore State](/states/south-dakota/nickname/the-mount-rushmore-state) shows how the southern half of the original Dakota Territory built a nickname around one of the most recognizable monuments in America, while North Dakota's constitutional identity appears on [the state motto page](/states/north-dakota/motto/liberty-and-union-now-and-forever-one-and-inseparable)."


  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "More than 50,000 people attended the International Peace Garden dedication on July 14, 1932."
      - "North Dakota became the 39th state on November 2, 1889, the same day as South Dakota."
      - "The state motto Liberty and Union Now and Forever, One and Inseparable comes from Daniel Webster’s 1830 Senate speech."
      - "Peace Garden State appeared on license plates for one year before being formally adopted in 1957."
      - "The garden’s floral clock uses an 18-foot flower display to show the correct time."
      - "Adult Richardson ground squirrels may begin hibernating as early as July."
      - "Legislative efforts to replace the official nickname with Roughrider State failed in both 1971 and 1973."

faq:
  - question: "What is North Dakota nickname?"
    answer: "North Dakota’s official nickname is The Peace Garden State, adopted by the legislature in 1957."

  - question: "Why is North Dakota called the Peace Garden State?"
    answer: "The nickname comes from the International Peace Garden on the border between North Dakota and Canada, which symbolizes lasting peace between the two countries."

  - question: "What are North Dakota’s other nicknames?"
    answer: "Other nicknames include Flickertail State, Roughrider State, and Sioux State. Only Peace Garden State is official."

  - question: "What is the North Dakota nickname and motto?"
    answer: "The official nickname is The Peace Garden State, and the state motto is Liberty and Union Now and Forever, One and Inseparable."

  - question: "When did North Dakota get its nickname?"
    answer: "Peace Garden State first appeared on license plates in 1956 and was officially adopted by law in 1957."

  - question: "What does Flickertail State mean?"
    answer: "Flickertail State refers to Richardson ground squirrels, whose constantly twitching tails inspired the nickname."

  - question: "What does Roughrider State mean?"
    answer: "Roughrider State honors Theodore Roosevelt’s cavalry unit from the Spanish-American War, which included volunteers from North Dakota."

