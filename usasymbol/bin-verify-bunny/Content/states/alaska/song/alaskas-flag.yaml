faq:
  - question: What is Alaska's state song?
    answer: "Alaska's official state song is \"Alaska's Flag,\" adopted in 1955."
  - question: Who wrote Alaska's state song?
    answer: "Marie Drake wrote the words in 1935, and Elinor Dusenbury composed the music in 1938."
  - question: When did Alaska adopt "Alaska's Flag" as its state song?
    answer: "The territorial legislature adopted \"Alaska's Flag\" as the official state song in 1955."
  - question: Is "Alaska's Flag" really about the Alaska flag?
    answer: "Yes. Each verse describes a specific part of the flag's design, including its blue field, gold stars, and the Big Dipper."

