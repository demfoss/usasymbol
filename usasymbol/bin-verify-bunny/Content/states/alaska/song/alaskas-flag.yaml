lyrics_verses:
  - |-
    Eight stars of gold on a field of blue,
    Alaska's flag, may it mean to you,
    The blue of the sea, the evening sky,
    The mountain lakes and the flowers nearby,
    The gold of the early sourdough's dreams,
    The precious gold of the hills and streams,
    The brilliant stars in the northern sky,
    The "Bear," the "Dipper," and shining high,
    The great North Star with its steady light,
    O'er land and sea a beacon bright,
    Alaska's flag to Alaskans dear,
    The simple flag of a last frontier.
lyrics_note: "The lyrics walk through the state flag's design element by element: the blue field standing for Alaska's sky and forget-me-not flower, the gold stars for its mineral wealth, and the Big Dipper and North Star for strength and the territory's northern location."
