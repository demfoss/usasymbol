sections:
  - id: overview
    icon: fa-solid fa-music
    title: Alaska State Song
    paragraphs:
      - "\"Alaska's Flag\" is Alaska's official state song, adopted by the territorial legislature in 1955, four years before statehood. Marie Drake wrote the words as a poem in 1935, and Elinor Dusenbury set them to music three years later."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Alaska's Flag\" Explained"
    paragraphs:
      - "The song is unusual among state songs because its subject is a flag, not a landscape. Verse by verse, it explains what each part of Alaska's flag represents: the blue field for the sky and the state's forget-me-not flower, the gold stars for mineral wealth, and the Big Dipper and North Star for strength and Alaska's northern position."
      - "Marie Drake, a longtime employee of Alaska's Department of Education, wrote the words as a poem that appeared on the cover of the department's School Bulletin in October 1935. Elinor Dusenbury, an Army officer's wife stationed in Alaska, composed the music in 1938 and played it for Drake in person at Juneau's Baranof Hotel that summer."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Alaska's Flag" Represents Alaska
    paragraphs:
      - "The song was chosen because it explains a symbol Alaskans already knew by heart. The flag design came from Benny Benson, a 13-year-old Alaska Native student, whose winning entry in a 1927 territorial contest gave the state a flag years before it had a song about it."
      - "Pairing a song with that flag let schoolchildren learn the meaning behind the stars and colors, not just the image. By the 1950s the song had already been taught in territorial schools for years, making its formal adoption a confirmation of established practice rather than a new choice."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Alaska's Flag\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Alaska's Flag" Became Alaska's State Song
    paragraphs:
      - "Marie Drake wrote the poem in 1935 for the Department of Education's School Bulletin, and Elinor Dusenbury composed the music in 1938, meeting Drake in Juneau that summer to play it for her. The territorial legislature designated the song official in 1955, years after it had already become familiar in Alaska's schools."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Alaska's Flag\" Facts"
    facts:
      - "Alaska adopted \"Alaska's Flag\" as its official state song in 1955, four years before statehood."
      - "The lyrics describe the design of the Alaska state flag rather than the state's landscape."
      - "Marie Drake wrote the words as a 1935 poem for the Department of Education's School Bulletin."
      - "Elinor Dusenbury composed the music in 1938 and first played it for Drake in Juneau."

