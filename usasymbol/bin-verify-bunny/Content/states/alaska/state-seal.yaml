type: State Seal
state: Alaska
name: Great Seal of Alaska
adopted_year: 1910
revised_year: 1959
is_official: true
legislation: Alaska Statutes § 44.09.010
meaning: 'The Great Seal of Alaska is one of the few state seals in the United States built entirely around industry rather than classical allegory. Designed in 1910 when Alaska was still a federal territory, it shows the aurora borealis above the mountains, forests, a smelter, a railroad, ships, and fish — every major resource and economic activity that defined Alaska at the time. When Alaska became the 49th state in 1959, the territorial seal was adopted unchanged as the official state seal.'
author: USA Symbol Team
date_published: '2026-04-29'
date_modified: '2026-04-29'
seo_title: 'Alaska State Seal | Aurora, Smelter & What It Means'
seo_description: "Alaska's 1910 seal shows aurora borealis, a smelter, ships, and salmon. Every image is a real Alaskan industry; no mythological figures appear."
hero_image: /images/seals/alaska/seal.webp
hero_image_alt: Great Seal of the State of Alaska — official emblem adopted in 1910 as a territorial seal
hero_image_caption: The Great Seal of Alaska, originally designed in 1910 for the Alaska Territory. The northern lights arc over the mountains; below, the seal catalogs every major Alaskan industry in a single image.
intro_text: 'The Great Seal of Alaska catalogs the territory''s industries — aurora borealis, mining smelter, railroad, ships, fishing — with no mythology and no allegorical figures, just a working inventory of what Alaska was in 1910. When Alaska became the 49th state in 1959, the territorial seal passed directly into use unchanged. This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
