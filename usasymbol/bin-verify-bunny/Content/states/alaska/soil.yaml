seo_title: "Alaska State Soil | Tanana Series"
seo_description: "The Alaska state soil is the Tanana series. It covers an estimated 3 to 5 million acres and supports white spruce, black spruce, and paper birch forests."
hero_image: /images/soils/alaska/alaska-state-soil-hero.webp
hero_image_alt: "Open Alaskan plain with low grasses, distant buildings, and a wide cloudy sky."
hero_image_caption: "Broad lowland ground and open sky capture the scale of interior Alaska."
intro_text: "Alaska's state soil is the Tanana series — a permafrost-bearing soil found on the river flats and low terraces of interior Alaska, first described in the Yukon-Tanana Region in 1914 and named after the Tanana River, whose Athabaskan name means 'mountain river.' This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Alaska State Soil
  paragraphs:
  - "The Tanana soil series is Alaska's recognized state soil. It sits on the flat alluvial terraces and floodplains of interior Alaska's major river systems — gently sloping land built from layers of silty loess and river sediment."
  - "What sets Tanana soil apart from every other state soil in the country is permafrost. Beneath the surface layers lies frozen ground that stays frozen year-round. That layer controls drainage, limits root depth, and defines the character of interior Alaska."

- id: history
  icon: fa-solid fa-landmark
  title: Why Alaska Chose the Tanana Soil
  paragraphs:
  - "Soil scientists at the USDA Natural Resources Conservation Service selected the Tanana series to represent Alaska because it captures the state's most distinctive feature: permafrost. Alaska is the only U.S. state with a permafrost soil as its recognized state soil."
  - "The Tanana series was first established in the Yukon-Tanana Region of Alaska in 1914 — one of the earliest soil series described in the state. It has been studied and mapped across the interior lowlands for over a century."
  - "Unlike most states, Alaska's Legislature has not passed a formal law designating an official state soil. The Tanana series is recognized by the USDA as Alaska's representative state soil, chosen by Alaska soil scientists to represent the interior lowlands that define so much of the state's geography."

- id: profile
  icon: fa-solid fa-layer-group
  title: Tanana Soil Profile and Horizons
  paragraphs:
  - "If you dug into Tanana soil, the first thing you would see is a dark, spongy mat of moss and plant litter — sometimes several inches thick. Below that, the soil turns to brownish-gray silt. Dig to about two feet down, and the ground is permanently frozen solid."
  layers:
  - horizon: Oi
    name: Organic surface
    depth_in: "0–3"
    color_hex: "#5C3118"
    color_name: dark brown
    texture: slightly decomposed moss and plant material
    note: insulates permafrost; removing it causes the frozen ground to thaw
  - horizon: OA
    name: Decomposed organic layer
    depth_in: "3–5"
    color_hex: "#1C1410"
    color_name: black
    texture: mucky silt loam
    note: highly decomposed organic matter; most nutrients concentrated here
  - horizon: Bjjg
    name: Silty loess layer
    depth_in: "5–17"
    color_hex: "#7B6A42"
    color_name: olive brown
    texture: silt loam stratified with very fine sandy loam
    note: frost churning mixes this layer each cycle; poorly drained
  - horizon: Cjjg
    name: River alluvium
    depth_in: "17–25"
    color_hex: "#9A9585"
    color_name: gray
    texture: very fine sandy loam stratified with fine sandy loam
    note: saturated river sediment; roots cannot penetrate much below this
  - horizon: Cjjgf
    name: Permafrost
    depth_in: "25–72+"
    color_hex: "#8192A3"
    color_name: gray (frozen)
    texture: frozen silt loam and sandy loam
    note: permanently frozen; f suffix means frozen — unique to Gelisols

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Tanana Soil Grows in Alaska
  paragraphs:
  - "Tanana soil is found in the interior lowlands of Alaska, on flat floodplains and low terraces alongside major river systems. It is most common in the Greater Fairbanks area and the surrounding interior lowlands."
  - "The soil is estimated to cover 3 to 5 million acres across interior Alaska, though much of that range has not yet been fully mapped. Slopes are gentle — typically 0 to 12 percent — because Tanana soil forms on level to gently sloping river terraces."
  counties:
  - Fairbanks North Star Borough
  - Denali Borough
  - Yukon-Koyukuk Census Area
  - Southeast Fairbanks Census Area

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Tanana Soil
  paragraphs:
  - "In its natural state, Tanana soil supports a boreal forest of aspen, paper birch, white spruce, and black spruce — the same tree species that cover interior Alaska's lowland valleys."
  - "When Tanana soil is cleared and the organic surface layer is removed, the permafrost below begins to thaw over time. As it thaws, the soil can become usable farmland. Cleared Tanana soils support hay and pasture, small grains, and vegetables."
  - "Farming Tanana soil requires careful management. Removing the moss layer that insulates the frozen ground causes the permafrost to thaw and the surface to sink and become waterlogged — a process called thermokarst. Drainage work is essential for any sustained agricultural use."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tanana Soil Facts
  facts:
  - "The Tanana series was established in the Yukon-Tanana Region, Alaska in 1914 — making it one of the oldest described soil series in the state."
  - "Permafrost begins at roughly 25 inches below the surface and extends to 72 inches or deeper."
  - "Tanana soil is classified as a Gelisol — a soil order defined entirely by the presence of permafrost. Alaska is the only U.S. state with a Gelisol as its state soil."
  - "The name Tanana comes from an Athabaskan word meaning 'mountain river' — the same name as the Tanana River that runs through the heart of interior Alaska."
  - "The Tanana series is found only in Alaska. No other state has this series."
  - "Alaska's Legislature has not passed a formal law designating a state soil. The Tanana series is recognized by the USDA Natural Resources Conservation Service as Alaska's representative state soil."

