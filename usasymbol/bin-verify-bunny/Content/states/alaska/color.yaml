seo_description: "Alaska state colors are Blue and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Alaska are **Blue** and **Gold**, derived from the Alaska state flag adopted in 1927. No separate state-colors law exists, but these colors appear on [the Alaska state flag](/states/alaska/flag/alaska-state-flag) and throughout state branding and official insignia. The color cards below list HEX, RGB, CMYK, and Pantone references for reproducing Alaska blue and gold. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Blue and Gold"
official_since: "Traditional (based on 1927 state flag)"
primary_use: "State Flag, state branding, University of Alaska system colors"
known_for: "Blue representing the Alaskan sky and forget-me-not flower; gold representing the North Star, the midnight sun, and the state's mineral wealth"

