seo_title: "Alaska State Gem | Jade"
seo_description: "Alaska's state gem is jade, adopted in 1968. Nephrite from the Kobuk River valley has been carved by Native Alaskans for centuries."
hero_image: /images/gemstones/alaska/alaska-state-gem-hero.webp
hero_image_alt: "A rounded green nephrite jade boulder."
hero_image_caption: "Nephrite jade, Alaska's official state gem, comes mainly from the Kobuk River valley in the state's northwest."
intro_text: "Alaska's state gem is jade, specifically nephrite jade, adopted by the Alaska Legislature in 1968 to recognize deposits along the Kobuk River that Alaska Native carvers have worked for centuries. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Alaska State Gem
    paragraphs:
      - "Jade, specifically the nephrite variety, is Alaska's official state gem, designated by the Alaska Legislature in 1968. Alaska's nephrite comes mainly from the Kobuk River valley in the state's remote northwest, near Jade Mountain."
      - "Alaska was a fitting choice for this symbol because Alaska Native people in the region carved tools and ornaments from local nephrite long before statehood, giving the stone a documented history that predates its official designation by centuries."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Jade?"
    paragraphs:
      - "Jade is a general name for two different minerals, jadeite and nephrite; Alaska's jade is nephrite, a tough, fine-grained stone made of tightly interlocked fibrous crystals. It typically appears green to white or cream, sometimes mottled, with a smooth, waxy look when polished."
      - "Nephrite forms through metamorphism, when certain rock types are altered by heat and pressure deep underground. Its interlocking fiber structure makes it extremely tough, historically prized for tools as much as ornament, since it resists cracking better than many harder minerals."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Alaska Chose Jade as Its State Gem"
    paragraphs:
      - "Nephrite deposits near the Kobuk River, in the northwestern Alaska interior, have supplied Inupiat carvers with material for tools, weapons, and ornaments for centuries before statehood. Archaeological finds of Kobuk River nephrite have turned up at sites along the Bering Sea and Arctic coasts, showing the stone was traded well beyond where it was quarried."
      - "By the 20th century, Alaska had become a major source of commercial jade in the United States, with boulders taken from the Kobuk region cut and sold nationally. That combination of a long Native carving tradition and a real commercial industry made jade a natural choice for state gem in 1968."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Jade Became Alaska's State Gem"
    paragraphs:
      - "The Alaska Legislature designated jade the official state gem on June 24, 1968, recognizing a material Alaska Native carvers had worked long before the territory became a state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Jade Is Found in Alaska"
    paragraphs:
      - "The main source of Alaska nephrite is the Kobuk River valley in the state's northwest, near Jade Mountain and the village of Shungnak, where boulders of nephrite have been collected for generations."
    sites:
      - name: Shungnak
        city: Shungnak
        lat: 66.8888
        lng: -157.1487
        note: "Near Jade Mountain, a major nephrite source"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Jade Facts"
    facts:
      - "Adopted as Alaska's state gem on June 24, 1968."
      - "Alaska's jade is nephrite, not jadeite, the other mineral commonly called jade."
      - "Nephrite tools made from Kobuk River jade, found at archaeological sites across the Bering Sea and Arctic coasts, show the stone was traded far from where it was quarried."
      - "Jade Mountain, near the Kobuk River, is one of the best-known nephrite sources in Alaska."

