faq:
  - question: What is Alaska's state gem?
    answer: "Alaska's state gem is jade, specifically nephrite jade, a tough green to white stone adopted by the Alaska Legislature in 1968."
  - question: When did Alaska adopt jade as its state gem?
    answer: "The Alaska Legislature designated jade the official state gem on June 24, 1968."
  - question: Why did Alaska choose jade?
    answer: "Alaska Native carvers in the Kobuk River region worked local nephrite for tools and ornaments for centuries, and the stone later became a commercial gem industry."
  - question: Where can you find jade in Alaska?
    answer: "The Kobuk River valley in northwest Alaska, near Jade Mountain and the village of Shungnak, is the state's main source of nephrite."

