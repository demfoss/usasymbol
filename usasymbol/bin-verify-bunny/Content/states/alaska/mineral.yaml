faq:
  - question: What is Alaska's state mineral?
    answer: "Alaska's state mineral is gold, a soft, bright yellow metal adopted by the Alaska Legislature in 1968."
  - question: When did Alaska adopt gold as its state mineral?
    answer: "The Alaska Legislature designated gold the official state mineral in 1968."
  - question: Why did Alaska choose gold?
    answer: "Gold rushes, especially the 1899 rush at Nome, drew large numbers of settlers to Alaska and shaped the state's early towns and economy."
  - question: Where can you find gold in Alaska?
    answer: "Nome, on the Seward Peninsula, was the site of Alaska's largest gold rush and remains associated with gold mining today, including modern offshore dredging."

