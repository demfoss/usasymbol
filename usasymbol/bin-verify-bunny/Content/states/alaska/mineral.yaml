seo_title: "Alaska State Mineral | Gold"
seo_description: "Alaska's state mineral is gold, adopted in 1968. The 1899 discovery of gold in the sand at Nome set off one of the state's biggest rushes."
hero_image: /images/minerals/alaska/alaska-state-mineral-hero.webp
hero_image_alt: "Raw gold nuggets and flakes on a dark background."
hero_image_caption: "Gold, Alaska's official state mineral, drew tens of thousands of prospectors north in the gold rush era."
intro_text: "Alaska's state mineral is gold, adopted by the Alaska Legislature in 1968 to recognize the metal whose turn-of-the-century rushes brought the first large waves of settlers north. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Alaska State Mineral
    paragraphs:
      - "Gold is Alaska's official state mineral, designated by the Alaska Legislature in 1968. Few materials are tied to Alaska's modern history as directly. Gold rushes at the turn of the 20th century drew tens of thousands of prospectors north and helped establish many of the state's early towns."
      - "Alaska was a natural choice for this symbol, not because gold is unique to the state, but because mining it built the territory's early economy and population."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Gold?"
    paragraphs:
      - "Gold is a soft, dense metal with a bright yellow color and a metallic shine that does not tarnish or corrode. It is one of the few metals that occurs in nature in a nearly pure state, as flakes, grains, and nuggets, rather than locked into ore that needs heavy processing."
      - "In Alaska, gold formed in hydrothermal veins deep underground and was later freed by erosion, washing into stream gravels as placer deposits. Prospectors panned and sluiced these stream deposits, which is how most of Alaska's early gold was recovered."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Alaska Chose Gold as Its State Mineral"
    paragraphs:
      - "Gold shaped Alaska more directly than almost any other resource. The Klondike stampede of 1897–1898 funneled through Alaska's ports, and when beach gold was found at Nome in 1899, tens of thousands of miners rushed to the Bering Sea coast, some panning gold directly out of the sand."
      - "Gold mining opened up the Alaska interior, built towns like Nome and Fairbanks, and remained a major state industry into the 20th century. Naming gold the state mineral in 1968 recognized that history rather than any unique geological rarity."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Gold Became Alaska's State Mineral"
    paragraphs:
      - "The Alaska Legislature designated gold the state mineral in 1968, a decade after statehood, formally recognizing a metal already deeply tied to the state's identity and economy."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Gold Is Found in Alaska"
    paragraphs:
      - "Nome, on the Seward Peninsula, was the site of Alaska's largest gold rush after gold was discovered in the beach sands there in 1899. The Nome area remains associated with Alaska gold mining today, including modern offshore dredging operations."
    sites:
      - name: Nome
        city: Nome
        lat: 64.5011
        lng: -165.4064
        note: "Site of the 1899 Nome gold rush"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Gold Facts"
    facts:
      - "Adopted as Alaska's state mineral in 1968."
      - "Gold discovered in the beach sands at Nome in 1899 triggered one of Alaska's largest gold rushes."
      - "Because gold is chemically inert, it does not tarnish, which is why prospectors could find bright, untarnished flakes and nuggets in stream gravel."
      - "Total gold production from the Nome district is estimated at more than 100 metric tons."

