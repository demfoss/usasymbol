intro_text: "Arkansas's state rock is bauxite, adopted by the Arkansas Legislature in 1967 to recognize the aluminum ore mined around the town of Bauxite in Saline County. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Arkansas State Rock
    paragraphs:
      - "Bauxite is Arkansas's official state rock, designated by the Arkansas Legislature in 1967. It is the world's main source of aluminum, and Arkansas holds the largest high-quality bauxite deposits in the United States, concentrated in Saline County."
      - "The designation recognized an industry that had already shaped the region for decades. Commercial bauxite mining began in Saline County in the 1890s and gave rise to a town simply named Bauxite."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Bauxite?"
    paragraphs:
      - "Bauxite is not a single mineral but a rock made mostly of aluminum hydroxide minerals, along with iron oxides and clay, which is why it usually appears reddish-brown, sometimes with small round pea-sized nodules called pisolites. It forms in tropical and subtropical climates, where intense rainfall and heat wash away other elements and leave aluminum-rich residue behind."
      - "Arkansas's bauxite formed tens of millions of years ago under a much warmer climate than the state has today. Once mined, the ore is refined into alumina and then smelted into metallic aluminum."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Arkansas Chose Bauxite as Its State Rock"
    paragraphs:
      - "Saline County's bauxite deposits, discovered in the 1880s, made Arkansas the leading source of domestic aluminum ore in the United States for much of the 20th century. Mining and processing companies built the town of Bauxite around the industry, and it grew into a community centered entirely on the mineral."
      - "Bauxite mining had slowed considerably by the time the legislature acted in 1967, but lawmakers recognized the ore's economic legacy rather than its current output. Arkansas remains associated with bauxite mining history even though large-scale operations have since ended."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Bauxite Became Arkansas's State Rock"
    paragraphs:
      - "Governor Winthrop Rockefeller signed the bill naming bauxite the state rock on February 22, 1967, the same measure that designated quartz crystal the state mineral and diamond the state gem."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Bauxite Is Found in Arkansas"
    paragraphs:
      - "Saline County, just southwest of Little Rock, holds Arkansas's major bauxite deposits and gave its name to the town of Bauxite, built around the mining industry starting in the 1890s."
