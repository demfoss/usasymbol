faq:
  - question: What is Arkansas's state rock?
    answer: "Arkansas's state rock is bauxite, a reddish-brown ore rock made mostly of aluminum hydroxide minerals."
  - question: When did Arkansas adopt bauxite as its state rock?
    answer: "The Arkansas Legislature designated bauxite the official state rock on February 22, 1967."
  - question: Why did Arkansas choose bauxite?
    answer: "Saline County's bauxite deposits made Arkansas the country's leading source of aluminum ore for much of the 20th century, and the town of Bauxite grew up entirely around the industry."
  - question: Where can you find bauxite in Arkansas?
    answer: "Saline County, southwest of Little Rock, holds Arkansas's major bauxite deposits, including the historic mining town of Bauxite."

