sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Arkansas's State Nut?"
    paragraphs:
      - "The pecan is Arkansas's official state nut, designated by the Arkansas Legislature in 2009. Pecan trees grow in orchards and along river bottoms throughout the state, especially in southern and eastern Arkansas."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pecan"
    paragraphs:
      - "Pecans grow inside a smooth, hard shell that splits open when the nut ripens in the fall. Arkansas pecan trees can grow quite large and often line old farmsteads and riverbanks, in addition to being grown in commercial orchards."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pecan Became Arkansas's State Nut"
    paragraphs:
      - "The Arkansas Legislature designated the pecan the official state nut in 2009, recognizing a nut tree long grown across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Arkansas Chose the Pecan"
    paragraphs:
      - "Pecan trees are native to Arkansas's river bottoms and have been grown commercially and around homesteads for generations, making the pecan a natural fit for the state nut designation."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pecan Facts"
    facts:
      - "Adopted as Arkansas's state nut in 2009."
      - "Pecan trees are native to river bottoms in southern and eastern Arkansas."
      - "Pecans are one of the few tree nuts native to North America."

