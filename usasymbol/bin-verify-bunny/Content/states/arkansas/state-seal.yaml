revised_year: 1907
is_official: true
legislation: Arkansas Code § 1-4-107
meaning: 'The Great Seal of Arkansas has carried the motto Regnat Populus — The People Rule — since the territorial era of 1819, making popular sovereignty the defining idea of the state from its earliest days. The Goddess of Liberty stands at the center, flanked by the Sword of Justice and the Angel of Mercy. Together they assert that government must be both capable of enforcement and restrained by compassion — in service of a people who hold the ultimate authority.'
