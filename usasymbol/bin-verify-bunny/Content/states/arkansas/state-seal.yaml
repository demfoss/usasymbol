intro_text: 'Arkansas has used the motto <em>Regnat Populus</em> — "The People Rule" — since its territorial seal of 1819, but printed it in incorrect Latin for 88 years before the legislature corrected it in 1907. Arkansas is the only U.S. state with this exact motto. This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
