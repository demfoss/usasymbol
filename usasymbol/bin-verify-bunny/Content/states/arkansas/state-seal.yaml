sections:
- id: history
  icon: fa-solid fa-landmark
  title: Arkansas State Seal History and Origin
  paragraphs:
  - "Arkansas Territory was formed on July 4, 1819, when Congress split it from Missouri Territory. The first territorial assembly met almost immediately and needed a seal. Samuel Calhoun Roane, recording clerk of that assembly, is credited with the design — a composition built around the Goddess of Liberty, the Sword of Justice, the Angel of Mercy, an eagle, and a central shield representing the territory's agricultural and commercial economy."
  - 'When Arkansas was admitted to the Union on June 15, 1836, as the 25th state, the state constitution (Article 5, Section 12) directed that Arkansas would continue using the territorial seal until the legislature replaced it. No replacement came. The same design that served a frontier territory became the official seal of a state, carrying the territorial motto without change.'
  - 'During the Civil War, Arkansas seceded in 1861. A Union-aligned government reestablished control in 1864 and the General Assembly confirmed the seal and its motto. The most significant revision in the seal''s history came in 1907, when Acting Governor Xenophon O. Pindall signed a bill correcting the motto''s Latin grammar — changing <em>Regnant Populi</em> to <em>Regnat Populus</em>, shifting from plural forms to singular and making the motto legally mean "the people rule" as one unified body.'

- id: elements
  icon: fa-solid fa-shapes
  title: What the Arkansas State Seal Symbols Mean
  paragraphs:
  - The seal's core message is popular sovereignty — the idea that political authority belongs to the people, not to a king, an aristocracy, or a church. That was a deliberate political statement for a territory founded in 1819 during the era of Jacksonian democracy, when frontier communities were pushing back against elite control and asserting their right to self-governance.
  - 'The figures surrounding the shield reinforce the same theme from different angles. The Goddess of Liberty stands for political freedom; the Sword of Justice and the Angel of Mercy represent the two instruments of government: force and mercy. The eagle roots the design in American national identity, connecting a frontier territory with no colonial-era British heritage to the republic it had just joined.'
  - The Great Seal of Arkansas organizes its imagery around the central claim of popular sovereignty. Each figure was chosen to support that theme from a different direction — liberty, justice, mercy, commerce, agriculture, and national belonging.
  elements:
  - id: goddess-of-liberty
    name: Goddess of Liberty
    image: /images/state-seals/arkansas/elements/goddess-of-liberty.svg
    paragraphs:
    - 'The Goddess of Liberty is the dominant figure of the Arkansas seal. She holds a liberty pole topped with a Phrygian cap — the classical symbol of freed status in the ancient world, widely adopted by the American and French revolutions as a marker of political liberty and the rejection of monarchy.'
    - "Liberty figures appeared on many state seals designed during the early American period. Arkansas's use of the Goddess of Liberty at the territorial stage in 1820 reflects the democratic mood of the Jacksonian era and the self-governing ambitions of settlers who had crossed the Mississippi to build a new political community on the frontier."
  - id: sword-of-justice
    name: Sword of Justice
    image: /images/state-seals/arkansas/elements/sword-of-justice.svg
    paragraphs:
    - 'The Sword of Justice represents the coercive arm of legitimate government — the capacity to uphold law through force when necessary. In combination with the Angel of Mercy on the opposite side of the seal, it creates a balance at the center of the design: just governance requires both the power to enforce and the wisdom to show restraint.'
    - 'The pairing of a sword and a mercy figure on official seals drew on classical and biblical traditions of balanced justice. A government that cannot enforce its laws is not a government; a government that shows no mercy is a tyranny. The Arkansas seal places both on equal footing around the shield.'
  - id: angel-of-mercy
    name: Angel of Mercy
    image: /images/state-seals/arkansas/elements/angel-of-mercy.svg
    paragraphs:
    - 'The Angel of Mercy balances the Sword of Justice on the opposite side of the seal. Where the sword represents coercive authority, mercy represents the obligation of government to recognize human limitation and act with compassion rather than pure legalism.'
    - 'The angel figure also connects the seal to the Protestant moral framework that shaped early American civic imagery — the idea that good government is not merely procedural but ethical, answerable to a moral order beyond ordinary statute.'
  - id: eagle
    name: Bald Eagle
    image: /images/state-seals/arkansas/elements/eagle.svg
    paragraphs:
    - 'The bald eagle appears at the base of the Arkansas seal. The eagle is the national symbol of the United States, and its presence on the seal locates Arkansas within the American republic. State seals of the early 19th century routinely included the national eagle to assert membership in the Union and to distinguish American sovereignty from European colonial precedents.'
    - 'Arkansas was carved from the Louisiana Purchase territory acquired from France in 1803. It had no history as a British colonial province or an established colonial institution. Its use of the national eagle rather than a distinctly regional emblem reflects its identity as a newly organized American territory rather than a transformed colonial entity.'
  - id: shield
    name: Shield
    image: /images/state-seals/arkansas/elements/shield.svg
    paragraphs:
    - 'The shield at the center of the seal carries scenes representing the economic life of Arkansas: commerce, industry, and agriculture. River commerce was the defining economic reality for Arkansas in 1819 — the Arkansas and Mississippi rivers were the primary routes for goods and people entering and leaving the territory, and the Mississippi River system connected Arkansas to markets in New Orleans and beyond.'
    - "The agricultural imagery on the shield reflects the plantation and subsistence farming economy that defined early Arkansas settlement. The shield's scenes anchor the seal in the material conditions of the territory's founding, placing practical economic life alongside the political abstractions of liberty, justice, and sovereignty."
  - id: olive-branch
    name: Olive Branch
    image: /images/state-seals/arkansas/elements/olive-branch.svg
    paragraphs:
    - 'The olive branch on the seal is a symbol of peace, drawn from classical antiquity and biblical imagery. On state and national seals, the olive branch conventionally pairs with a symbol of force — a sword, arrows, or a fasces — to represent the two available instruments of statecraft: peaceful governance and the capacity to defend or enforce when peace fails.'
    - 'The pairing of olive branch and sword on the Arkansas seal presents government as preferring peace but capable of force — a standard formulation of legitimate republican authority in the early American period.'
  - id: regnat-populus-motto
    name: Regnat Populus — The Motto
    image: /images/state-seals/arkansas/elements/motto-ribbon.svg
    paragraphs:
    - '<em>Regnat Populus</em> is Latin for "The People Rule." The phrase appears on a ribbon in the seal''s design and is also Arkansas''s official state motto — the only state with this exact phrase. The concept is popular sovereignty: legitimate political authority flows from the consent of the governed, not from hereditary privilege, religious authority, or military force.'
    - 'The motto has appeared on the seal since the territorial period around 1820 but used incorrect Latin — <em>Regnant Populi</em> — for 88 years. The error used plural forms of both verb and noun, producing a meaning closer to "some peoples rule" than "the people rule." Acting Governor Xenophon O. Pindall signed the correction on May 24, 1907, making the Arkansas motto grammatically and legally accurate for the first time.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Arkansas State Seal'
  paragraphs:
  - "The Great Seal of Arkansas has kept its core composition since the territorial period — the Goddess of Liberty, the Angel of Mercy, the Sword of Justice, the shield, the eagle, and the motto have remained constant across more than two centuries. The most significant legal change was the 1907 correction to the motto's Latin grammar, which altered the stated meaning without altering the design."
