timeline:
- year: '1819'
  description: Congress forms Arkansas Territory on July 4, separating it from Missouri Territory. The first territorial assembly meets and immediately needs an official seal.
- year: '~1820'
  description: Samuel Calhoun Roane, recording clerk of the territorial assembly, designs the seal. The motto "Regnant Populi" — incorrect Latin — appears on the design from this point.
- year: '1836'
  description: Arkansas is admitted to the Union on June 15 as the 25th state. The state constitution (Article 5, Section 12) directs Arkansas to continue using the territorial seal. No redesign is made.
- year: '1861'
  description: Arkansas secedes from the Union. Confederate state government continues using the seal during the Civil War years.
- year: '1864'
  description: A Union-aligned state government reestablishes control. The General Assembly confirms the seal and motto, maintaining design continuity through the conflict and into Reconstruction.
- year: '1907'
  description: Acting Governor Xenophon O. Pindall signs the bill correcting the motto's Latin grammar on May 24. "Regnant Populi" becomes "Regnat Populus." The motto has been grammatically and legally correct ever since.

faq:
- question: What does the Arkansas state seal show?
  answer: The Arkansas state seal features the Goddess of Liberty as the central figure, flanked by the Sword of Justice and the Angel of Mercy. An eagle appears at the base. A shield in the center shows scenes representing commerce and agriculture. The motto "Regnat Populus" — The People Rule — appears on a ribbon.
- question: What does "Regnat Populus" mean on the Arkansas seal?
  answer: '"Regnat Populus" is Latin for "The People Rule." It expresses popular sovereignty — the principle that political authority belongs to the people, not to a monarch or aristocracy. Arkansas is the only U.S. state with this exact motto. The phrase has appeared on the seal since the territorial period around 1820.'
- question: When was the Arkansas state seal adopted?
  answer: The seal design dates to around 1820, when Samuel Calhoun Roane designed it for the first Arkansas territorial assembly. The state constitution in 1836 directed Arkansas to continue using the territorial seal at statehood. The current legally accurate version dates to 1907, when the motto's incorrect Latin was corrected.
- question: Why did Arkansas's seal have wrong Latin for 88 years?
  answer: The original territorial seal used "Regnant Populi" — plural forms of both verb and noun — instead of the correct singular "Regnat Populus." The error entered the design when Samuel Calhoun Roane drafted the first territorial seal around 1820 and was not corrected until the legislature acted on May 24, 1907.
- question: Who designed the Arkansas state seal?
  answer: Samuel Calhoun Roane, recording clerk of the first Arkansas territorial assembly, is credited with designing the original seal around 1820. The design was carried forward to statehood in 1836 and has remained the basis of the official seal ever since.
- question: What is the Goddess of Liberty on the Arkansas seal?
  answer: The Goddess of Liberty is the central figure of the Arkansas seal. She holds a liberty pole topped with a Phrygian cap — the classical symbol of freed status adopted by the American and French revolutions as a marker of political liberty. Her presence asserts Arkansas's identity as a self-governing republic rooted in the freedom of its citizens.
- question: Did the Arkansas state seal change after 1907?
  answer: The 1907 correction to the motto was the most significant legal revision in the seal's history. The core composition — Goddess of Liberty, Angel of Mercy, Sword of Justice, shield, eagle, and motto — has remained the same since the territorial period around 1820.

