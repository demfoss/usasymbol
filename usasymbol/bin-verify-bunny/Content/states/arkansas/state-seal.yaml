    description: Designed by Samuel Calhoun Roane, recording clerk of the first Arkansas territorial assembly. The motto read "Regnant Populi" — incorrect Latin that remained on the seal from this point.
  - name: State Seal at Statehood (1836)
    years: '1836–1907'
    image: /images/state-seals/arkansas/versions/1836-state-seal.png
    description: When Arkansas was admitted to the Union on June 15, 1836, the state constitution directed Arkansas to continue using the territorial seal unchanged. The design carried forward without revision through statehood, the Civil War, and Reconstruction.
  - name: Corrected Seal (1907–present)
    years: '1907–present'
    image: /images/state-seals/arkansas/versions/1907-corrected.svg
    description: Acting Governor Xenophon O. Pindall signed the bill correcting the motto's Latin grammar on May 24, 1907. "Regnant Populi" became "Regnat Populus." Arkansas Code § 1-4-107 contains the current legal description of the seal and motto.

