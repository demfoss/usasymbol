sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Arkansas's State Grain?"
    paragraphs:
      - "Rice is Arkansas's official state grain, designated by the Arkansas General Assembly in 2007. Arkansas grows more rice than any other state, mostly across the flat, water-rich farmland of the Grand Prairie and the Mississippi River Delta."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Rice"
    paragraphs:
      - "Rice is a grain grown in flooded fields called paddies, which hold water around the plants as they grow through the hot Arkansas summer. Farmers drain the fields and harvest the rice in late summer and early fall using large combines. Most Arkansas rice is long-grain white or brown rice, though some farmers also grow specialty varieties."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Rice Became Arkansas's State Grain"
    paragraphs:
      - "The Arkansas General Assembly designated rice the official state grain in 2007, formally recognizing a crop that had already anchored the state's agricultural economy for a century."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Arkansas Chose Rice"
    paragraphs:
      - "Rice farming began in Arkansas in the early 1900s after farmers found the flat land and clay soil of the Grand Prairie held water well for flooded fields. Arkansas now grows roughly half of all rice produced in the United States, with Stuttgart known as the Rice and Duck Capital of the World."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Rice Comes From in Arkansas"
    paragraphs:
      - "The Grand Prairie region around Stuttgart and the Mississippi River Delta in eastern Arkansas produce most of the state's rice."
    sites:
