title: "Arkansas State Mammal | White-tailed Deer"
scientific_name: "Odocoileus virginianus"
adopted_year: 1993

seo_title: "Arkansas State Mammal | White-tailed Deer"
seo_description: "Arkansas's state mammal is the White-tailed Deer, adopted in 1993. Learn why this official Arkansas symbol was chosen and what it represents."

intro_text: "The White-tailed Deer is the official Arkansas state mammal, designated in 1993. This page gives the direct answer for searches like 'arkansas state mammal', 'arkansas state animal', and 'arkansas state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing Arkansas's wildlife conservation success and the state's identity as The Natural State. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "White-tailed Deer"
official_since: "1993"
status: "Stable (population estimated at approximately 900,000 to 1,000,000 statewide)"
habitat_in_state: "Forests, agricultural fields, river bottomlands, and the Ozark highlands; found in all 75 counties"
known_for: "Symbolizing Arkansas's wildlife conservation success and the state's identity as The Natural State"

size: "5 to 6.5 feet in length; 2.5 to 3.5 feet tall at the shoulder"
weight: "Males: 150-300 pounds; Females: 100-200 pounds"
coloration: "Reddish-brown in summer; gray-brown in winter; white patches around the eyes, throat, and inner legs; distinctive white underside on the tail"
distinctive_traits: "Males grow and shed antlers annually; fawns born with white spots for camouflage; the white tail flashes as a warning signal when the deer senses danger"

habitat: "Mixed forests, agricultural edge habitat, river bottomlands, Ozark highlands"
range_in_state: "Found in all 75 Arkansas counties; highest densities in the Ozarks and the fertile bottomlands of the Arkansas River valley and Mississippi Delta"
conservation_status: "Stable; managed through annual hunting seasons; Chronic Wasting Disease first detected in 2016 and monitored statewide"
where_to_find: "Crowley's Ridge State Park; Devil's Den State Park; Buffalo National River corridor; Ouachita National Forest; nearly any rural road at dawn or dusk statewide"
symbol_connections: "The white-tailed deer connects to the agricultural heritage shown on Arkansas's state seal, which features a plow and sheaf of wheat. Deer thrive in the same farmland and forest edges where Arkansas agriculture developed. The state nickname The Natural State captures the same values the deer represents—a landscape defined by its wildlife and wilderness."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Arkansas General Assembly designated the white-tailed deer as the official state mammal on April 5, 1993, when Governor Jim Guy Tucker signed Act 892 into law. Representative Arthur F. Carter introduced the bill, House Bill 2110, during the Seventy-ninth General Assembly."
      - "Before 1993, Arkansas had no official state mammal at all. The northern mockingbird, named state bird in 1929, was the only animal representing the state. Arkansas joined the Union in 1836 as the 25th state, but it took 157 years to add an official mammal to its list of symbols."

    subsections:
      - subtitle: "Why It Took So Long"
        text: "By the early 1990s, dozens of other states had already named official mammals. Arkansas had not, partly because the state's symbol list grew slowly and partly because no single animal had been pushed forward before. When Representative Carter introduced the bill, the choice was straightforward. The white-tailed deer lived in every county, shaped the state's history, and had just completed one of the most dramatic wildlife recoveries in American history."

      - subtitle: "Why the White-tailed Deer"
        text: "Arkansas lawmakers selected the white-tailed deer because it represented the state's natural heritage more completely than any other mammal. The deer had fed Native Americans and settlers for centuries. It nearly disappeared from Arkansas entirely. Then, through decades of careful management, it came back in enormous numbers. Choosing this animal as the state mammal was a way of recognizing that comeback and the conservation work behind it."

  - id: "state-symbolism"
    title: "What the White-tailed Deer Represents"
    style: "highlight"
    paragraphs:
      - "The white-tailed deer represents Arkansas's connection to the natural world. In a state nicknamed The Natural State for its forests, rivers, and wilderness, the deer is the animal most Arkansans see regularly. Drive any rural road at dawn or dusk, and chances are good you will spot one, reinforcing [The Natural State nickname](/states/arkansas/nickname/the-natural-state)."
      - "The deer also represents resilience. Arkansas came within a few hundred animals of losing its deer population entirely. The fact that nearly one million deer roam the state today is a direct result of conservation decisions made over many decades."
      - "For Native Americans and early settlers alike, the white-tailed deer was not just wildlife—it was a foundation of daily life. Food, clothing, and tools all came from the deer."

    subsections:
      - subtitle: "A Native American Legacy"
        text: "White-tailed deer were abundant across what is now Arkansas long before European contact. When Hernando de Soto's expedition passed through the region in the 1540s, Spanish accounts noted that Native American communities wore clothing made from deerskins. The Caddo people, who lived in western Arkansas for centuries, depended heavily on deer for food, hides, and trade goods. By choosing the white-tailed deer as its state mammal, Arkansas honored this deep Native American connection to the land."

      - subtitle: "The Great Comeback"
        text: "The white-tailed deer's recovery is the Arkansas Game and Fish Commission's most celebrated success story. Unregulated hunting and habitat loss reduced the statewide population to roughly 500 animals by the mid-1930s. Hunting was closed entirely in some counties. The AGFC then began purchasing deer from neighboring states and relocating them to protected refuges. Female deer were off-limits to hunters for decades so the herds could grow. By 1960, the population had reached 200,000. By 1985, it hit 500,000. Today, nearly one million deer live in Arkansas."

      - subtitle: "Feeding Arkansas Families"
        text: "The white-tailed deer remains a practical source of food for many Arkansas families. Each year, roughly 350,000 hunters participate in deer season, and the annual harvest typically exceeds 100,000 animals. A nonprofit called Arkansas Hunters Feeding the Hungry, founded in 2000, turns donated venison into meals for families in need. Since its founding, the program has delivered more than six million meals across the state. The deer's role as both a symbol and a food source gives it a meaning in Arkansas that goes beyond wildlife and links to [Arkansas's state motto](/states/arkansas/motto/regnat-populus)."

      - subtitle: "The Natural State's Most Visible Animal"
        text: "Arkansas earned the nickname The Natural State because of its diverse landscapes—the Ozark Mountains, the Ouachita Mountains, the Arkansas River valley, and the forests and wetlands of the Delta. The white-tailed deer lives across all of these regions. It is the mammal Arkansans are most likely to encounter in the wild. In that way, the deer does not just represent the Natural State—it embodies it."

  - id: "identification"
    title: "How to Identify White-tailed Deer"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "White-tailed deer are medium-sized, with slender legs and a compact body. Their coat changes with the seasons—reddish-brown in summer, grayer and heavier in winter. The most recognizable feature is the tail: white on the underside, it flashes like a flag when the deer runs, warning others of danger."
        list_items:
          - "**Size**: 5-6.5 feet long; 2.5-3.5 feet tall at the shoulder"
          - "**Weight**: Males 150-300 pounds; females 100-200 pounds"
          - "**Coat**: Reddish-brown in summer, gray-brown in winter"
          - "**Tail**: White underside flashes as a warning when fleeing"
          - "**Antlers**: Males grow and shed antlers each year; largest in late summer"
          - "**Fawns**: Born with white spots that fade by late summer"

      - subtitle: "Speed and Agility"
        text: "White-tailed deer are fast and athletic. They can run up to 30 miles per hour through dense forest, jump fences over nine feet high, and swim at speeds of 13 miles per hour. These abilities help them escape predators like coyotes and bobcats, which are common across Arkansas."

  - id: "in-the-state"
    title: "White-tailed Deer in Arkansas"
    style: "default"

    paragraphs:
      - "Arkansas is home to an estimated 900,000 to one million white-tailed deer. They live in all 75 counties, from the forested hills of the Ozarks to the flat agricultural lands of the Delta. Deer thrive wherever forests meet open fields—a landscape pattern found across most of the state and tied to regions shown in [States That Border Arkansas](/states/arkansas/borders)."
      - "The population has not always been this healthy. In the 1930s, fewer than 500 deer remained in Arkansas. Decades of restocking, refuge protection, and carefully managed hunting seasons brought the population back. By 1972, deer had spread to nearly every part of the state."

    facts:
      - "**Ozark Highlands**: Dense forests and rugged terrain support large deer populations; prime viewing in Devil's Den and Buffalo River areas"
      - "**Arkansas River Valley**: Agricultural edges and bottomland forests create ideal deer habitat across central Arkansas"
      - "**Mississippi Delta**: Rich farmland and wooded bayous provide year-round food and cover"
      - "**Statewide**: Nearly one million deer; found in all 75 counties"

  - id: "where-to-see"
    title: "Where to See Arkansas's State Mammal"
    style: "default"

    paragraphs:
      - "White-tailed deer are one of the easiest state mammals to spot in the wild. Dawn and dusk are the best times, when deer move between feeding areas and bedding sites. Almost any forested or agricultural area in Arkansas offers a chance to see them."

    list_items:
      - "**Devil's Den State Park**: Located in the Ozark Mountains near West Fork; deer are commonly seen along trails and meadows at dawn and dusk"
      - "**Buffalo National River corridor**: One of Arkansas's premier wildlife viewing areas; deer are abundant along the river's bottomland forests"
      - "**Crowley's Ridge State Park (Jonesboro)**: Accessible from a major city; deer graze in open areas along the ridge at dawn"
      - "**Ouachita National Forest**: Large forested landscape in southwestern Arkansas with healthy deer populations throughout"
      - "**Rural highways statewide**: Drive any country road at dawn or dusk and deer are frequently spotted along field edges and tree lines"

  - id: "current-status"
    title: "Current Status"
    style: "default"
    paragraphs:
      - "White-tailed deer are stable and abundant across Arkansas. The population is estimated at 900,000 to one million animals. They are not threatened or endangered at the state or federal level."
      - "Chronic Wasting Disease, a fatal neurological illness, was first detected in Arkansas in 2016. The Arkansas Game and Fish Commission monitors the disease through mandatory testing of harvested deer and has implemented management zones in affected areas."

    subsections:
      - subtitle: "Management in Arkansas"
        text: "The Arkansas Game and Fish Commission manages deer through annual hunting seasons, which serve as both a recreational opportunity and a population control tool. Harvest quotas and regulations—including zone-specific limits and antler-point rules introduced in 1998—keep the population balanced with available habitat. The AGFC also operates roughly 90 Wildlife Management Areas across the state, many of which provide critical deer habitat. Hunters Feeding the Hungry partners with the AGFC to turn surplus deer into donated venison for food banks statewide."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The white-tailed deer connects to Arkansas's agricultural identity, which is central to the state seal. The seal features a plow and a sheaf of wheat on the eagle's shield—symbols of the farming economy that built Arkansas. Deer live in the same landscape of fields and forest edges where Arkansas agriculture took root."
      - "Arkansas's state motto, Regnat Populus, means The People Rule. The deer's designation as state mammal was itself an act of the people's elected representatives, reflecting that principle. The white-tailed deer is also shared by ten other states as a state mammal, making it the most popular choice nationwide and relevant to trends in [U.S. states by population](/rankings/demographics/states-by-population)."

    subsections:
      - subtitle: "The Natural State and Its Symbol"
        text: "Arkansas has been called The Natural State since the earliest days of statehood, a nickname rooted in its forests, rivers, hot springs, and caves. The white-tailed deer is the mammal that most completely represents that natural identity. It lives across every type of Arkansas landscape and is seen by more residents than any other large mammal in the state."
        link:
          label: "See Arkansas state motto"
          url: "/states/arkansas/motto/regnat-populus"

      - subtitle: "A Symbol Shared by Eleven States"
        text: "The white-tailed deer is the state mammal of eleven states: Arkansas, Illinois, Michigan, Mississippi, Nebraska, New Hampshire, Ohio, Oklahoma, Pennsylvania, South Carolina, and Wisconsin. Each state chose the deer for different reasons tied to its own history. For Arkansas, the deer represents a dramatic conservation comeback and the enduring relationship between the state's people and its wildlife."
        link:
          label: "See Arkansas state bird"
          url: "/states/arkansas/bird/northern-mockingbird"

