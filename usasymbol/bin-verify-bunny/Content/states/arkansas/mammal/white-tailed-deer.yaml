faq:
  - question: "What is Arkansas's state mammal?"
    answer: "Arkansas's state mammal is the white-tailed deer (Odocoileus virginianus), designated in 1993 when Governor Jim Guy Tucker signed Act 892 into law."

  - question: "When was the white-tailed deer designated as Arkansas's state mammal?"
    answer: "The white-tailed deer became Arkansas's official state mammal on April 5, 1993. Representative Arthur F. Carter introduced House Bill 2110, and Governor Jim Guy Tucker signed it into law as Act 892."

  - question: "Why did Arkansas choose the white-tailed deer?"
    answer: "Arkansas chose the white-tailed deer because of its deep connection to the state's history and its remarkable conservation comeback. The deer fed Native Americans and settlers for centuries, nearly went extinct in the 1930s with only about 500 remaining, and recovered to nearly one million through the efforts of the Arkansas Game and Fish Commission. The deer also embodies Arkansas's identity as The Natural State."

  - question: "How many white-tailed deer live in Arkansas?"
    answer: "Arkansas is home to an estimated 900,000 to one million white-tailed deer. They are found in all 75 counties. In the 1930s, fewer than 500 remained in the state before a decades-long conservation effort brought the population back."

  - question: "Where can I see white-tailed deer in Arkansas?"
    answer: "White-tailed deer are easy to spot across Arkansas, especially at dawn and dusk. Devil's Den State Park, the Buffalo National River corridor, Crowley's Ridge State Park, and Ouachita National Forest are all good locations. Even driving along rural highways will often give you a chance to see them grazing along field edges."

  - question: "Is the white-tailed deer on Arkansas's flag or seal?"
    answer: "No, the white-tailed deer does not appear on the Arkansas flag or state seal. The seal features a plow and sheaf of wheat representing agriculture—the same farmland landscapes where deer are commonly found today."

  - question: "What other states have the white-tailed deer as their state mammal?"
    answer: "Eleven states have chosen the white-tailed deer as their state mammal: Arkansas, Illinois, Michigan, Mississippi, Nebraska, New Hampshire, Ohio, Oklahoma, Pennsylvania, South Carolina, and Wisconsin. It is the most popular state mammal choice in the United States."

  - question: "Was the white-tailed deer ever in danger of going extinct in Arkansas?"
    answer: "Yes. By the mid-1930s, unregulated hunting and habitat loss had reduced Arkansas's deer population to roughly 500 animals. Hunting was closed in several counties. The Arkansas Game and Fish Commission then purchased deer from other states, created protected refuges, and banned hunting of female deer for decades. The population grew steadily back to nearly one million."

