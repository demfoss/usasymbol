faq:
  - question: What is Arkansas's state dance?
    answer: "Arkansas's state American folk dance is square dance, adopted in 1991."
  - question: When did Arkansas adopt square dance as its state dance?
    answer: "Arkansas adopted square dance as its state American folk dance in 1991."
  - question: Why did Arkansas choose square dance?
    answer: "Square dance already thrived in Arkansas's Ozark Mountain communities alongside old-time fiddle music, and the state's designation followed a broader national campaign by square-dance organizations."
  - question: What is an allemande in square dance?
    answer: "An allemande is a figure where a dancer joins hands with their corner and turns once around them before returning to the set. It is one of the standard calls used in Arkansas square dancing and nationwide."

