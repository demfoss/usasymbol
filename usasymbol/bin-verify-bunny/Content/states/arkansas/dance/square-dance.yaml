sections:
  - id: overview
    icon: fa-solid fa-music
    title: Arkansas State Dance
    paragraphs:
      - "Arkansas named square dance its state American folk dance in 1991. The designation formalized a dance that had circulated through Ozark Mountain communities and rural gathering halls for decades."
      - "Like most square-dance states, Arkansas follows the national pattern: four couples, a caller, and figures built around circles, turns, and partner changes."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square formation, each pair facing the center from one of the four sides. A caller leads the group through a sequence of figures, timed to the beat of live or recorded string-band music."
      - "The dance depends on close listening. Dancers respond to the caller's instructions as they are given, rather than memorizing one fixed routine, which keeps every session a little different."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples take positions on the four sides of a square, each facing toward the center."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the caller opens the dance."
      - title: "Circle Left as a Full Set"
        description: "All eight dancers join hands and travel together to the left, matching the caller's steady count."
      - title: "Allemande Left with Your Corner"
        description: "Take your corner's left hand and turn once around them before releasing back to the set."
      - title: "Promenade to Close the Figure"
        description: "Join hands with your partner and walk together around the square back to your starting spot."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Arkansas
    paragraphs:
      - "Square dance took hold in Arkansas through the Ozark Mountain region, where old-time fiddle music and community gatherings gave the dance a lasting home in rural school gyms, granges, and church halls. That grounding made it a natural fit for a folk dance designation."
      - "Arkansas's 1991 designation also reflects a wider trend. A national campaign led by square-dance callers' associations and dance organizations, active from the 1970s onward, encouraged states to adopt square dance as an official folk dance, and Arkansas followed that pattern."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Arkansas's Dance
    paragraphs:
      - "Arkansas designated square dance its state American folk dance in 1991, joining a long list of states that made similar designations during the decades-long national campaign by square-dance organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Arkansas adopted square dance as its state American folk dance in 1991."
      - "The dance grew a lasting following in Arkansas's Ozark Mountain communities through old-time fiddle music."
      - "Square dance places four couples into a square, directed by a caller through each figure."
      - "Arkansas's designation followed a national push by square-dance callers' groups that began in the 1970s."

