hero_image_caption: Rhode Island's current Ocean passenger plate keeps the Ocean State slogan and replaced the older Wave plate beginning in 2023.
intro_text: '**"Ocean State"** is Rhode Island''s license plate slogan and has appeared on standard passenger plates since 1972. The phrase survived the reflective base, anchor base, 1996 Wave plate, and current 2023 Ocean plate. The newest change is visual: Wave plates are no longer issued and are replaced during renewals. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: 'Rhode Island''s current license plate slogan is "Ocean State." It first appeared on standard passenger plates in 1972 and continues on the current Ocean plate introduced in 2023. The previous Wave plate ran from 1996 to 2023 and is no longer issued. Rhode Island''s only other sustained standard slogan was "Discover" on the 1967-1971 base; a 1936 plate carried "300TH YEAR" for the 300th anniversary of settlement.'
