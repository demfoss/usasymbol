faq:
- question: What is Rhode Island's license plate slogan?
  answer: Rhode Island's license plate slogan is "Ocean State," used continuously on standard passenger plates since 1972.
- question: What is Rhode Island's current license plate?
  answer: Rhode Island's current standard state plate is the Ocean plate, introduced in 2023. It replaced the older Wave plate during renewal cycles.
- question: Are Rhode Island Wave plates still issued?
  answer: No. Rhode Island DMV says Wave plates are no longer issued and are replaced during the next renewal cycle beginning January 2023.
- question: What did Rhode Island plates say before Ocean State?
  answer: The 1967-1971 base said "Discover." A 1936 commemorative plate carried "300TH YEAR."
- question: When did Ocean State first appear on Rhode Island plates?
  answer: '"Ocean State" first appeared on Rhode Island passenger plates in 1972.'
- question: Did the 2023 plate change Rhode Island's slogan?
  answer: No. The 2023 Ocean plate changed the design but kept the "Ocean State" slogan.

