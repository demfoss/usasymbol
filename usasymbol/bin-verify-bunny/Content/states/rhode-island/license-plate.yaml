sections:
- id: current-ocean-plate
  icon: fa-solid fa-wave-square
  title: Current Ocean Plate
  paragraphs:
  - Rhode Island DMV lists "Ocean" as the official Rhode Island state plate. It is available in passenger and several other registration classes.
  - The current Ocean plate began in 2023. It uses a light blue background, multiple wave lines, a navy anchor, and "Ocean State" in script at the bottom.
  - The older Wave plate is no longer issued. DMV says Wave plates are replaced during the next renewal cycle beginning January 2023.

- id: ocean-state
  icon: fa-solid fa-water
  title: What "Ocean State" Means
  paragraphs:
  - '"Ocean State" points to Rhode Island''s defining geography: the Atlantic coast, Narragansett Bay, islands, harbors, and hundreds of miles of shoreline inside the smallest U.S. state by land area.'
  - The phrase reached Rhode Island plates in 1972 and has never left the standard passenger plate. That gives it one of the longest continuous runs of any U.S. license plate slogan.
  - Unlike tourism slogans that age out, "Ocean State" is both nickname and geography. A new plate design can modernize the look without changing the words.

- id: before-ocean-state
  icon: fa-solid fa-compass
  title: Before Ocean State
  paragraphs:
  - Rhode Island's first major standard slogan was "DISCOVER" on the 1967-1971 base. It was revalidated for years and then replaced by the 1972 Ocean State base.
  - Earlier, the 1936 plate carried "300TH YEAR" to commemorate 300 years since the settlement of Rhode Island. That was a one-year commemorative, not a long-term tourism slogan.
  - 'The 1972 base made the decisive shift: from a generic invitation to discover the state to the more specific identity phrase "Ocean State."'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Rhode Island License Plate Slogans by Era
  paragraphs:
  - Rhode Island's slogan history is short, but its design history is not. The same Ocean State phrase has moved across several standard bases.
  versions:
  - name: 300TH YEAR
    years: '1936'
    image: /images/license-plates/rhode-island/1936-300th-year.jpg
    description: Commemorative plate for the 300th anniversary of the settlement of Rhode Island, with "300TH YEAR" centered at the bottom.
  - name: Discover
    years: 1967-1971
    image: /images/license-plates/rhode-island/1967-discover.jpg
    description: White plate with "DISCOVER" centered at the top. This was Rhode Island's only standard passenger slogan before Ocean State.
  - name: Ocean State
    years: 1972-1979
    image: /images/license-plates/rhode-island/1972-ocean-state.png
    description: Reflective version of the previous format, now with "OCEAN STATE" centered at the top.
  - name: Ocean State
    years: 1980-1996
    image: /images/license-plates/rhode-island/1987-anchor-ocean-state.png
    description: Anchor-era plates kept "OCEAN STATE" at the top, with several embossed/screened variations across the 1980s and early 1990s.
  - name: Ocean State Wave
    years: 1996-2023
    image: /images/license-plates/rhode-island/1996-wave-passenger.gif
    description: The long-running Wave plate used a gray wave graphic and "Ocean State" at the bottom. It is no longer issued.
  - name: Ocean State Ocean Plate
    years: 2023-present
    image: /images/license-plates/rhode-island/2023-ocean-passenger.jpg
    description: Current Ocean plate with five-wave background and "Ocean State" in script at the bottom.

- id: why-it-lasted
  icon: fa-solid fa-anchor
  title: Why It Lasted
  paragraphs:
  - Rhode Island has little reason to replace "Ocean State." The phrase is short, accurate, and already functions as the state's best-known nickname.
  - 'The 2023 redesign shows how durable the slogan is: the plate changed from Wave to Ocean, but the words stayed.'
  - That continuity also matches Rhode Island's broader symbols, especially the anchor-and-Hope flag and the state's maritime identity.

