type: State Flower
state: Georgia
name: Cherokee Rose
scientific_name: Rosa laevigata
adopted_year: 1916
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-16"
seo_title: "Georgia State Flower | Cherokee Rose"
seo_description: "The Cherokee Rose became Georgia's state flower in 1916. This white climbing rose with golden center grows wild across Georgia's landscape."

intro_text: "Georgia's official state flower is the Cherokee Rose, recognized by the state legislature in 1916. This white flowering vine climbs fences and trees throughout Georgia. Large white petals surround a distinctive golden center that makes the Cherokee Rose easy to identify and ties closely to [the Peach State identity](/states/georgia/nickname/the-peach-state)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Georgia"
    paragraphs:
      - "Since 1916, the Cherokee Rose has represented Georgia officially. Each flower displays five large white petals arranged around a prominent cluster of golden yellow stamens. The blooms measure 2 to 4 inches across. Flowers appear singly rather than in clusters. A sweet fragrance attracts pollinators during blooming season."
      - "The Cherokee Rose blooms from April through June across Georgia. Peak flowering occurs in May when the vines produce their most abundant displays. This climbing rose can grow 15 to 20 feet tall. The plant uses thorny stems to climb supports. Glossy dark green leaves with three leaflets cover the vine year-round in Georgia's mild climate."
      - "Cherokee Rose vines grow wild throughout Georgia's forests and along roadsides. The plant thrives in full sun to partial shade. Well-drained soil suits this rose best. The vine tolerates poor soil conditions that would challenge many garden roses, especially in regions shown in [States Neighboring States](/rankings/geography/states-neighboring-states). Birds and small mammals eat the red rose hips that form after flowers fade."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Cherokee Rose"
    paragraphs:
      - "Known as Cherokee Rose, this flower's scientific designation is Rosa laevigata. The species belongs to the Rosaceae family. This massive plant family includes roses, apples, strawberries, and thousands of other flowering species worldwide."
      - "The genus name Rosa covers all rose species. The species name laevigata means smooth, referring to the leaves. Despite its common name, the Cherokee Rose is not native to North America. The plant originated in China and reached America by the early 1800s. It naturalized so successfully in the Southeast that many people assumed it was native."
      - "Legend connects the flower to the Trail of Tears when Cherokee people were forced from Georgia. The story claims white roses grew where Cherokee mothers' tears fell during their removal. This tale gave the plant its common name. No historical evidence supports this origin story, but it remains deeply embedded in Georgia folklore."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Georgia Chose the Cherokee Rose"
    paragraphs:
      - "Georgia made the Cherokee Rose its official state flower in 1916. The Georgia Federation of Women's Clubs campaigned for this designation. They presented a resolution to the state legislature. Lawmakers passed the measure without opposition, and this history is often compared with entries in the [state flowers hub](/symbols/flowers)."
      - "Women's clubs argued the Cherokee Rose represented Georgia's character better than cultivated garden flowers. The vine's hardiness and widespread growth throughout the state influenced the choice. Its white blooms symbolized purity. The golden center represented Georgia's gold mining history in north Georgia mountains and complemented [Georgia's state motto values](/states/georgia/motto/wisdom-justice-and-moderation)."
      - "No competing flowers received serious consideration during the selection process. The Cherokee Rose had already become strongly associated with Georgia in popular culture. Garden clubs promoted planting the vine at homes and public buildings. The legislature formalized what many Georgians already considered their state flower."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Georgia State Flower Facts"
    facts:
      - "The Cherokee Rose is not actually native to Georgia or North America but originated in southern China and Taiwan"
      - "Georgia adopted the Cherokee Rose on August 18, 1916, following advocacy by the Georgia Federation of Women's Clubs"
      - "Cherokee Rose vines produce bright red rose hips in fall that persist through winter, providing food for wildlife"
      - "The plant's thorny stems can grow up to 20 feet long and form dense thickets that provide nesting sites for birds"
      - "Each Cherokee Rose flower blooms for only a few days before petals fall, but the vine produces flowers continuously for several weeks"
      - "The Cherokee Rose appears on Georgia's state quarter released in 1999 as part of the 50 State Quarters Program"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Georgia State Flower and Bird"
    paragraphs:
      - "The Brown Thrasher serves as Georgia's state bird, a large songbird with rusty brown plumage and spotted breast. Both symbols represent Georgia officially. Georgia adopted the Cherokee Rose in 1916 and designated the Brown Thrasher as state bird in 1935; see [Georgia's state bird page](/states/georgia/bird/brown-thrasher) for the timeline."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Cherokee Rose Symbolizes"
    paragraphs:
      - "The Cherokee Rose is commonly seen as representing resilience and beauty emerging from hardship. The flower traditionally symbolizes the tears shed during the Trail of Tears, though this connection developed after the plant's arrival in America. Its white petals frequently represent purity while the golden center has been linked to Georgia's gold rush heritage and landscapes dominated by [southern live oak](/states/georgia/tree/southern-live-oak)."

faq:
  - question: "What is Georgia's state flower?"
    answer: "Georgia's state flower is the Cherokee Rose, a white climbing rose with distinctive golden center that grows wild throughout the state."
  
  - question: "When did Georgia adopt the Cherokee Rose as its state flower?"
    answer: "Georgia adopted the Cherokee Rose on August 18, 1916. The Georgia Federation of Women's Clubs campaigned for this designation and presented a resolution to the state legislature."
  
  - question: "Why did Georgia choose the Cherokee Rose?"
    answer: "Georgia chose the Cherokee Rose because the vine grew abundantly throughout the state and represented Georgia's character. Its hardiness, white blooms symbolizing purity, and golden center representing Georgia's gold mining history made it an appropriate choice. Women's clubs advocated for this flower over cultivated garden varieties."
  
  - question: "Is the Cherokee Rose native to Georgia?"
    answer: "No, the Cherokee Rose is not native to Georgia or North America. The plant originated in southern China and Taiwan. It naturalized so successfully in the Southeast after arriving in the early 1800s that many people assumed it was native."
  
  - question: "When does the Cherokee Rose bloom in Georgia?"
    answer: "The Cherokee Rose blooms from April through June in Georgia, with peak flowering occurring in May. Each individual flower blooms for only a few days, but the vine produces flowers continuously throughout the blooming season."

