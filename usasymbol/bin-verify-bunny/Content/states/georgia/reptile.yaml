faq:
  - question: What is Georgia's state reptile?
    answer: "Georgia's state reptile is the gopher tortoise, adopted by the Georgia Legislature in 1989."
  - question: When did Georgia adopt the gopher tortoise?
    answer: "The Georgia Legislature designated the gopher tortoise the official state reptile in 1989."
  - question: Why did Georgia choose the gopher tortoise?
    answer: "Its burrows shelter many other animal species, making it a keystone part of Georgia's sandy upland habitats and a fitting state symbol."
  - question: Is the gopher tortoise endangered?
    answer: "The gopher tortoise is listed as threatened in parts of its range due to habitat loss, and it is protected under Georgia law."

