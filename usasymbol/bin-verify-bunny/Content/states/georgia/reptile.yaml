hero_image_caption: "The gopher tortoise, Georgia's state reptile, digs deep burrows that shelter many other animals."
intro_text: "Georgia's state reptile is the gopher tortoise, a burrowing tortoise found across the state's sandy uplands, adopted in 1989. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Georgia?
    paragraphs:
      - "The gopher tortoise is Georgia's official state reptile, designated by the Georgia Legislature in 1989. Its scientific name is Gopherus polyphemus."
      - "It is a land tortoise known for digging long, deep burrows in the sandy soils of Georgia's coastal plain."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Gopher Tortoise
    paragraphs:
      - "The gopher tortoise has a domed brown to gray shell and strong, shovel-like front legs built for digging."
      - "Adults typically grow to around 10 inches long and can live for many decades in the wild."
      - "It digs burrows that can stretch many feet underground, and these burrows also shelter dozens of other species, from snakes to insects."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Georgia Legislature designated the gopher tortoise the official state reptile in 1989, recognizing a species closely tied to the state's sandy upland habitats."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Georgia Chose the Gopher Tortoise
    paragraphs:
      - "The gopher tortoise is considered a keystone species in Georgia because its burrows provide shelter for many other animals, making it an important and recognizable part of the state's natural landscape."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Gopher Tortoise
    paragraphs:
      - "The gopher tortoise lives in sandy, well-drained habitats across Georgia's coastal plain, including longleaf pine forests and scrub areas in the southern part of the state."
