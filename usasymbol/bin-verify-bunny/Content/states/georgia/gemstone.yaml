seo_title: "Georgia State Gem | Quartz"
seo_description: "Georgia's state gem is quartz, adopted in 1976. The resolution named amethyst and clear quartz specifically, recognizing the mineral's abundance across the state."
hero_image: /images/gemstones/georgia/georgia-state-gemstone-hero.webp
hero_image_alt: "A cluster of purple amethyst quartz crystals beside a clear quartz point."
hero_image_caption: "Quartz, Georgia's official state gem, spans many colors in the state, from clear crystal to purple amethyst."
intro_text: "Georgia's state gem is quartz, adopted in 1976 to recognize a mineral so common across the state that lawmakers wrote its wide range of colors, including amethyst and clear crystal, directly into the designation. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Georgia State Gem
    paragraphs:
      - "Quartz is Georgia's official state gem, designated by the Georgia General Assembly in 1976. Rather than naming a single rare stone, lawmakers chose the mineral broadly, citing quartz's abundance and its many colorful varieties found throughout Georgia."
      - "The same 1976 resolution named staurolite the state mineral and shark tooth the state fossil, giving Georgia a small cluster of geology symbols adopted together."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Quartz?"
    paragraphs:
      - "Quartz is a silicon dioxide mineral and one of the most common minerals on Earth's crust, second in abundance only to feldspar. It forms six-sided crystals that can be perfectly clear, and trace elements or natural radiation can tint it into varieties like purple amethyst, gray to black smoky quartz, or milky white quartz."
      - "Clear quartz crystals, when cut, can resemble diamonds closely enough that they were once sold under the name Georgia diamonds. Because quartz occurs almost everywhere in the state's rock, it is one of the easiest minerals for a beginning rockhound to find."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Georgia Chose Quartz as Its State Gem"
    paragraphs:
      - "The legislative resolution establishing quartz as Georgia's state gem stated plainly that quartz is the second most abundant mineral on Earth and that Georgia has a great deal of it in a wide variety of colors. Rather than picking one rare variety, lawmakers named the mineral broadly, specifically calling out amethyst and clear quartz within the designation."
      - "The choice reflects how widespread quartz collecting already was in Georgia, from clear crystal points to purple amethyst clusters found across the state's Piedmont and mountain regions. It gave rockhounds and jewelry makers across Georgia a state gem they could realistically find close to home."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Quartz Became Georgia's State Gem"
    paragraphs:
      - "The Georgia General Assembly designated quartz the official state gem on March 18, 1976, in the same resolution that named staurolite the state mineral and shark tooth the state fossil."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Quartz Facts"
    facts:
      - "Adopted as Georgia's state gem in 1976."
      - "The designating resolution specifically named amethyst and clear quartz as part of the state gem."
      - "Quartz is the second most abundant mineral in Earth's crust, after feldspar."
      - "Clear Georgia quartz crystals were historically sold under the nickname Georgia diamonds."

