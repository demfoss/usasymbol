faq:
  - question: What is Georgia's state gem?
    answer: "Georgia's state gem is quartz, named broadly to include its many varieties, especially clear quartz and purple amethyst."
  - question: When did Georgia adopt quartz as its state gem?
    answer: "The Georgia General Assembly designated quartz the official state gem on March 18, 1976."
  - question: Why did Georgia choose quartz?
    answer: "Lawmakers cited quartz as the second most abundant mineral on Earth and noted Georgia's own deposits come in a wide variety of colors, from clear crystal to amethyst."
  - question: What color is Georgia's state gem?
    answer: "Georgia's designation covers quartz broadly, including clear crystal and purple amethyst, rather than a single color."

