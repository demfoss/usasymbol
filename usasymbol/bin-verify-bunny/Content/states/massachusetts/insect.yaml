faq:
- question: What is Massachusetts's state insect?
  answer: "Massachusetts's state insect is the ladybug, adopted by the Massachusetts General Court in 1974."
- question: When did Massachusetts adopt the ladybug?
  answer: "Massachusetts adopted the ladybug as its official state insect in 1974."
- question: Why did Massachusetts choose the ladybug?
  answer: "The ladybug became Massachusetts's state insect after a campaign by the state's schoolchildren."
- question: What does Massachusetts's state insect look like?
  answer: "The ladybug is a small, round, domed beetle, usually red or orange with black spots."
- question: Is the ladybug one specific species?
  answer: "No. Ladybug is a common name for many small beetle species in the family Coccinellidae, not one single species."

