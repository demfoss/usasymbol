faq:
  - question: What is Massachusetts's state song?
    answer: "Massachusetts's official state song is \"All Hail to Massachusetts,\" codified by statute in 1981."
  - question: Who wrote Massachusetts's state song?
    answer: "Arthur J. Marsh, a Wellesley music teacher, wrote both the words and music in 1954."
  - question: When did Massachusetts adopt "All Hail to Massachusetts" as its state song?
    answer: "A Boston Pops-led committee selected it in 1966, and the Legislature codified it by law in 1981."
  - question: Does Massachusetts have more than one official song?
    answer: "Yes. Massachusetts recognizes seven official songs, including a folk song, a polka, and a ceremonial march, alongside its main state song."

