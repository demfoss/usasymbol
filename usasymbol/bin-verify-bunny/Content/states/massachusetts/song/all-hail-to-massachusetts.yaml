sections:
  - id: overview
    icon: fa-solid fa-music
    title: Massachusetts State Song
    paragraphs:
      - "\"All Hail to Massachusetts\" is the state's official anthem, written by Wellesley teacher Arthur J. Marsh and first performed in 1954. A Boston Pops selection committee picked it as the state song in 1966, and the Legislature codified that status into law in 1981."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"All Hail to Massachusetts\" Explained"
    paragraphs:
      - "The song is a formal, march-like anthem that praises Massachusetts as a cradle of American independence and calls on listeners to honor its history. Its structure suits ceremonial performance by choirs, bands, and orchestras rather than casual singing."
      - "Arthur J. Marsh, a music teacher in Wellesley, wrote both the words and melody in the spring of 1954. The song debuted that August at the bandstand of Paragon Park on Nantasket Beach in Hull, a modest seaside launch for a piece that later became statewide law."
      - "The Boston Pops connection gave the song unusual musical credibility: Arthur Fiedler chaired the committee that selected it, joined by fellow conductor Erich Leinsdorf and Boston Pops musicians Harry Ellis Dickson and Leo Litwin."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "All Hail to Massachusetts" Represents Massachusetts
    paragraphs:
      - "Massachusetts had rejected state song proposals three times, in 1958, 1961, and 1964, before Marsh's song succeeded in 1966. Its selection by a committee of respected professional musicians, rather than a legislative vote alone, gave it credibility the earlier attempts lacked."
      - "The anthem's focus on Massachusetts as a birthplace of American liberty fits a state that hosted the opening battles of the Revolutionary War. That theme made it a natural fit for graduations, civic ceremonies, and official state functions."
      - "Massachusetts later embraced an unusually large roster of official songs covering different styles, from folk to polka, which suggests lawmakers saw \"All Hail to Massachusetts\" as the formal anthem rather than the only song worth honoring."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"All Hail to Massachusetts\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "All Hail to Massachusetts" Became Massachusetts's State Song
    paragraphs:
      - "A commission chaired by Boston Pops conductor Arthur Fiedler selected \"All Hail to Massachusetts\" as the state song in June 1966, and it was made official that September. The Legislature codified the designation by statute in 1981, giving it full legal standing decades after Marsh first wrote it."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Massachusetts

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"All Hail to Massachusetts\" Facts"
    facts:
      - "Massachusetts codified \"All Hail to Massachusetts\" as its official state song by statute in 1981."
      - "A Boston Pops committee chaired by Arthur Fiedler selected the song in 1966."
      - "Arthur J. Marsh wrote and first performed the song in 1954 at Nantasket Beach in Hull."
      - "Massachusetts recognizes seven official songs in total, including a folk song by Arlo Guthrie and a state polka."
      - "The song was made the official state song in September 1966, fifteen years before formal statutory codification."

