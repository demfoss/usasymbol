intro_text: "Massachusetts's official state song is \"All Hail to Massachusetts,\" written by Wellesley music teacher Arthur J. Marsh and formally codified in 1981 after a Boston Pops panel led by conductor Arthur Fiedler selected it in 1966. Massachusetts also maintains six other officially designated songs, more than almost any other state."

