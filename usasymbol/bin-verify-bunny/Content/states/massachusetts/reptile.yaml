intro_text: "Massachusetts's state reptile is the garter snake, one of the most common and widespread snakes in the state, adopted in 2006. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Massachusetts?
    paragraphs:
      - "The garter snake is Massachusetts's official state reptile, designated by the Massachusetts General Court in 2006. It represents the genus Thamnophis, rather than a single species."
      - "It is a common, harmless snake found in yards, fields, and wetlands throughout the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Garter Snake
    paragraphs:
      - "The garter snake usually has a dark body with three light stripes running head to tail, though colors and patterns can vary between individuals."
      - "Most adults grow to about two to three feet long, with a slender body and a small head."
      - "It is not venomous and is often found near gardens, stone walls, ponds, and wet meadows, where it hunts small prey like worms and insects."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "Massachusetts schoolchildren campaigned for a state reptile, and the Massachusetts General Court designated the garter snake as the official choice in 2006."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Massachusetts Chose the Garter Snake
    paragraphs:
      - "The garter snake is one of the most familiar reptiles in Massachusetts, commonly seen by residents in backyards, parks, and fields across the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Garter Snake
    paragraphs:
      - "The garter snake is found throughout Massachusetts, in gardens, fields, woodlands, and near ponds and streams in nearly every part of the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Garter Snake Facts
    facts:
      - "Adopted in 2006 by the Massachusetts General Court."
      - "Represents the genus Thamnophis rather than a single species."
      - "Usually grows to about two to three feet long."
      - "Not venomous and harmless to people."
      - "One of the most commonly seen snakes in Massachusetts yards and fields."

