seo_title: "Massachusetts State Reptile | Garter Snake"
seo_description: "Massachusetts's state reptile is the garter snake, adopted in 2006. Learn what it looks like and why it became official."
hero_image: /images/reptiles/massachusetts/massachusetts-state-reptile-hero.webp
hero_image_alt: "A garter snake with dark scales and yellow stripes moving through grass."
