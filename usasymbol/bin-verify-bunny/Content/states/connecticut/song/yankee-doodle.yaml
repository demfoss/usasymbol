faq:
  - question: What is Connecticut's state song?
    answer: "Connecticut's official state song is \"Yankee Doodle,\" adopted in 1978."
  - question: Who wrote Connecticut's state song?
    answer: "No single author is credited. \"Yankee Doodle\" is a traditional tune dating to the mid-1700s."
  - question: When did Connecticut adopt "Yankee Doodle" as its state song?
    answer: "The General Assembly adopted it in March 1978 after a statewide performance contest."
  - question: Is "Yankee Doodle" really about Connecticut?
    answer: "Not specifically. It is a shared New England and Revolutionary War-era song, chosen for its historical ties to the region rather than Connecticut alone."

