sections:
  - id: overview
    icon: fa-solid fa-music
    title: Connecticut State Song
    paragraphs:
      - "\"Yankee Doodle\" is Connecticut's official state song, adopted by the General Assembly in 1978. The tune is far older than the state's designation, with roots in fife and drum music from the mid-1700s, long before it became a symbol of the American Revolution."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Yankee Doodle\" Explained"
    paragraphs:
      - "The song follows a young man riding into town on a pony, sticking a feather in his cap and calling it \"macaroni,\" a term that mocked fashionable young men of the era. Its bright, quick march tempo made it a natural fit for fife and drum corps."
      - "British troops reportedly used the tune to mock colonial soldiers during the French and Indian War, only for American forces to reclaim it as their own rallying song during the Revolutionary War. No single composer is credited; it survives as a traditional folk tune passed down through performance rather than written by one identifiable author."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Yankee Doodle" Represents Connecticut
    paragraphs:
      - "Connecticut governors had grown tired of hearing college fight songs played at official events and pushed for a real state song throughout the 1970s. The state held a public contest in 1977, gathering twenty musical groups, from a fife and drum corps to school choirs, to perform candidate songs at the capitol."
      - "\"Yankee Doodle\" won out for its deep ties to New England's Revolutionary War history and its instant familiarity to anyone who grew up singing it. Lawmakers updated one word in the chorus, replacing \"girls\" with \"folks,\" before making it official in 1978."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Yankee Doodle\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Yankee Doodle" Became Connecticut's State Song
    paragraphs:
      - "Governor Thomas Meskill first pushed for an official state song in the early 1970s, and Governor Ella Grasso's administration carried the search forward. After a November 1977 performance contest at the state capitol, the House passed \"Yankee Doodle\" on March 9, 1978, and the Senate followed on March 16, 1978."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Connecticut

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Yankee Doodle\" Facts"
    facts:
      - "Connecticut adopted \"Yankee Doodle\" as its official state song in 1978."
      - "The tune dates to the mid-1700s, predating the Revolutionary War by roughly two decades."
      - "Twenty musical groups performed candidate songs at the state capitol before lawmakers chose it."
      - "Connecticut also recognizes a state waltz, a state cantata, and a state polka as separate official songs."

