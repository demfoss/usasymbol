intro_text: "Connecticut's state food is pizza, recognized by the state House of Representatives in 2021 to honor the coal-fired apizza tradition that began in New Haven. This profile appears in the [list of U.S. state foods](/symbols/dishes)."

sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Connecticut's State Food?"
    paragraphs:
      - "Pizza is listed as Connecticut's state food following a 2021 vote by the state House of Representatives. The recognition points specifically to the state's long history with New Haven style apizza."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Pizza"
    paragraphs:
      - "Connecticut's signature style, often spelled apizza, is a thin, oblong pie baked in a coal or wood-fired brick oven until the crust is charred and blistered. Classic versions include plain tomato pies and white clam pies topped with fresh littleneck clams, garlic, and olive oil instead of tomato sauce."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Pizza Became Connecticut's State Food"
    paragraphs:
      - "The Connecticut House of Representatives voted in 2021 to recognize pizza as the state food. The proposal celebrated New Haven's pizzerias and their role in American pizza making."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Connecticut Chose Pizza"
    paragraphs:
      - "New Haven's Wooster Square neighborhood is home to some of the oldest pizzerias in the country, including Frank Pepe's Pizzeria Napoletana, opened in 1925 by an Italian immigrant. Generations of Italian immigrant families built the coal-fired apizza style there, giving Connecticut a strong claim to an early chapter of American pizza history."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Pizza Comes From in Connecticut"
    paragraphs:
      - "New Haven's Wooster Square neighborhood is the heart of Connecticut apizza, home to Frank Pepe's Pizzeria Napoletana and Sally's Apizza, two of the state's oldest and best known coal-fired pizzerias."
    sites:
      - name: Wooster Square
        city: New Haven
        lat: 41.3057
        lng: -72.9273
        note: "Birthplace of New Haven style coal-fired apizza"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pizza Facts"
    facts:
      - "Recognized as Connecticut's state food by the state House in 2021."
      - "New Haven style apizza is baked in coal or wood-fired brick ovens."
      - "Frank Pepe's Pizzeria Napoletana opened in New Haven in 1925."
      - "White clam pizza, topped with clams instead of tomato sauce, is a New Haven specialty."

