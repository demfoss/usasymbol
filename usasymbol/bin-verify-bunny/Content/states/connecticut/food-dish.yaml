faq:
  - question: "What is Connecticut's state food?"
    answer: "Connecticut lists pizza as its state food following a 2021 vote by the state House of Representatives."
  - question: "When did Connecticut recognize pizza as its state food?"
    answer: "The Connecticut House of Representatives voted to recognize pizza as the state food in 2021."
  - question: "Why did Connecticut choose pizza?"
    answer: "New Haven's coal-fired apizza tradition, started by Italian immigrant families in the early 1900s, gave Connecticut a distinct American pizza style."
  - question: "Where does pizza come from in Connecticut?"
    answer: "New Haven's Wooster Square neighborhood is considered the birthplace of Connecticut's coal-fired apizza style."

