name_meaning:
  heading: What Does South Dakota Mean?
  paragraphs:
  - South Dakota and North Dakota both joined the Union on November 2, 1889. Dakota comes from the Dakota people and is commonly translated as friend or ally.
  - The South in the name records the division of Dakota Territory, but the symbols tell a more complicated story. The prairie pheasant and pasqueflower sit beside Black Hills spruce and a Mount Rushmore nickname that comes from the state's western granite country.
  - South Dakota's postal abbreviation is SD, and residents are South Dakotans. Mount Rushmore State supplies the guide's best-known nickname.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Dakota refers to the Dakota people and is commonly translated as friend or ally.
    - label: Statehood
      text: South Dakota became a state in 1889.
    - label: Motto
      text: Under God the People Rule is South Dakota's state motto.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to South Dakota, a Great Plains state with the Black Hills in the west.
    - label: Black Hills
      text: The Black Hills shape the tree, flag imagery, and Mount Rushmore nickname.
    - label: People
      text: People from South Dakota are called South Dakotans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Mount Rushmore State
      text: South Dakota's monument-based shorthand, drawn from the presidential carving in the Black Hills.
    - label: Sunshine State
      text: Older state identity reflected in flag history.
    - label: Abbreviation
      text: SD; older short form S.D.
editorial:
  heading: What South Dakota's Symbols Say About the State
  paragraphs:
  - The [Mount Rushmore State nickname](/states/south-dakota/nickname) can dominate South Dakota's image, but the hub is not only monument-driven. The [ring-necked pheasant](/states/south-dakota/bird) keeps the guide rooted in grassland and hunting culture.
  - The [Black Hills spruce](/states/south-dakota/tree) is the counterweight to the prairie symbols. It points to the forested hills, Lakota sacred geography, mining history, and tourism landscape in the western part of the state.
  - The [coyote](/states/south-dakota/mammal/coyote) adds a plains animal with more edge than a tame emblem would have, while the [American pasqueflower](/states/south-dakota/flower) keeps spring prairie in the picture.
faq:
- question: What national parks are in South Dakota?
  answer: "South Dakota has 2 national parks: [Badlands National Park](/parks/national/badlands-national-park), [Wind Cave National Park](/parks/national/wind-cave-national-park)."
- question: What is the South Dakota state abbreviation?
  answer: The South Dakota postal abbreviation is [SD](/states/south-dakota/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: What is South Dakota's most famous state symbol?
  answer: The [Mount Rushmore State nickname](/states/south-dakota/nickname) is South Dakota's most widely recognized shorthand because it ties the state to its best-known monument.
- question: What is South Dakota's state bird?
  answer: The [ring-necked pheasant](/states/south-dakota/bird) became South Dakota's bird symbol in 1943.
- question: What is South Dakota's state flower?
  answer: The [American pasqueflower](/states/south-dakota/flower) became South Dakota's flower emblem in 1903.
- question: Why is Black Hills spruce important?
  answer: The [Black Hills spruce](/states/south-dakota/tree) represents the forested Black Hills, a landscape that gives South Dakota a western mountain identity as well as a prairie one.
- question: How many official state symbols does South Dakota have?
  answer: South Dakota's pages here include the flag, pheasant, pasqueflower, Black Hills spruce, motto, nickname, colors, milk, and coyote.
