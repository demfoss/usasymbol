seo_description: "South Dakota symbols include the ring-necked pheasant, pasqueflower, Black Hills spruce, and Mount Rushmore State nickname."
snippet_answer: The Mount Rushmore State nickname is South Dakota's most widely recognized official state symbol, tied to the presidential carving in the Black Hills. The ring-necked pheasant, American pasqueflower, Black Hills spruce, Under God the People Rule motto, and coyote connect grassland and mountain identity across a state that spans two very different landscapes.
