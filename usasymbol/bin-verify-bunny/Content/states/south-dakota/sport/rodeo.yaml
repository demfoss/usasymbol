faq:
  - question: What is South Dakota's state sport?
    answer: "South Dakota's official state sport is rodeo, adopted in 2003."
  - question: When did South Dakota adopt rodeo as its state sport?
    answer: "South Dakota adopted rodeo as its state sport in 2003, a few years after Texas became the first state to do so in 1997."
  - question: Why did South Dakota choose rodeo?
    answer: "Rodeo grew directly out of ranch work on South Dakota's cattle operations, and the state still runs some of the country's oldest outdoor rodeos. The Black Hills Roundup has drawn crowds to Belle Fourche since 1918."
  - question: Who sponsored South Dakota's rodeo bill?
    answer: "State Representative Larry Rhoden sponsored the bill in 2003. He later became South Dakota's governor in 2025."

