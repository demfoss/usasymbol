faq:
- question: What is South Dakota's state soil?
  answer: "South Dakota's state soil is the Houdek series, a dark brown Mollisol with a clay-rich argillic horizon found on the glaciated coteau of eastern South Dakota. It is recognized by the USDA Natural Resources Conservation Service as South Dakota's representative state soil and supports spring wheat, corn, and sunflower farming across the east-central part of the state."
- question: Why is it called Houdek soil?
  answer: "The series is named after the Houdek family, South Dakota farmers whose land in Beadle County served as the type location where USDA soil scientists first formally described and classified the series."
- question: What color is Houdek soil?
  answer: "The surface is very dark brown to nearly black, from the organic matter built by thousands of years of mixed-grass prairie roots decomposing in the ground. The argillic subsoil is dark brown to brown — slightly lighter but still rich in color. The calcic layer below is pale brown, streaked with white calcium carbonate."
- question: Where is Houdek soil found in South Dakota?
  answer: "Houdek soil covers the Coteau des Prairies in eastern South Dakota — the glaciated upland plateau between the Big Sioux and James river valleys. It is most concentrated in Beadle, Jerauld, Sanborn, Miner, Kingsbury, and Hamlin counties at elevations of 1,500 to 2,000 feet."
- question: What crops grow in Houdek soil?
  answer: "Spring wheat is the main crop, followed by corn, sunflowers, soybeans, flaxseed, and oats. The argillic clay layer stores spring snowmelt moisture that carries wheat through dry summer weeks. Before farming, Houdek soil supported northern mixed-grass prairie — western wheatgrass, green needlegrass, blue grama, and buffalograss."
- question: Who chose Houdek as South Dakota's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Houdek series to represent South Dakota. It was chosen because it is the dominant soil of the glaciated coteau — the rolling upland that defines the eastern third of the state and its wheat and corn farming tradition."
- question: How does Houdek soil differ from North Dakota's Barnes soil?
  answer: "Both are dark Mollisols formed in glacial till on the northern Great Plains, but Houdek has an argillic (clay-rich) subsoil horizon that Barnes lacks, and forms in a drier semi-arid climate. Barnes is classified as a Hapludoll in a more humid setting; Houdek is an Argiustoll in a drier, more variable one."

