faq:
  - question: What is South Dakota's state song?
    answer: "South Dakota's official state song is \"Hail, South Dakota!,\" adopted in 1943."
  - question: Who wrote South Dakota's state song?
    answer: "DeeCort Hammitt wrote both the words and the music."
  - question: When did South Dakota adopt "Hail, South Dakota!" as its state song?
    answer: "The South Dakota Legislature adopted the song in 1943, the same year it was written."
  - question: Did one person write all of South Dakota's state song?
    answer: "Yes. DeeCort Hammitt composed the music and wrote the lyrics himself, unlike many state songs that pair separate writers."

