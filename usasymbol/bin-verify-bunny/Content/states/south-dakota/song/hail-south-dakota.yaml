sections:
  - id: overview
    icon: fa-solid fa-music
    title: South Dakota State Song
    paragraphs:
      - "\"Hail, South Dakota!\" is South Dakota's official state song, adopted in 1943. DeeCort Hammitt wrote both the words and the music, giving the state a song built entirely by a single South Dakota composer rather than a lyricist-composer pair."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Hail, South Dakota!\" Explained"
    paragraphs:
      - "The song is a brisk, upbeat march, the kind of tune suited to marching bands, parades, and civic ceremonies. Its tone is celebratory and direct, praising the state without dwelling on any single landmark or region."
      - "DeeCort Hammitt composed and wrote the song in 1943, and it was adopted the same year, a rare instance of a state song reaching official status almost immediately after it was written."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Hail, South Dakota!" Represents South Dakota
    paragraphs:
      - "The song's march-like structure made it practical for schools, bands, and public events across the state, which likely helped it gain quick acceptance. Its straightforward, celebratory lyrics avoided ties to any one region, making it broadly usable statewide."
      - "Because Hammitt wrote both the words and music himself, the song carried a unified voice rather than combining separately submitted lyrics and melody, a structure that suited its fast path to adoption."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Hail, South Dakota!\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Hail, South Dakota!" Became South Dakota's State Song
    paragraphs:
      - "The South Dakota Legislature adopted \"Hail, South Dakota!\" in 1943, the same year DeeCort Hammitt wrote it."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Hail, South Dakota!\" Facts"
    facts:
      - "South Dakota adopted \"Hail, South Dakota!\" as its state song in 1943."
      - "DeeCort Hammitt wrote both the words and the music, a rare combination among state songs."
      - "The song was adopted the same year it was written."
      - "Its march-like style makes it a common choice for school and civic band performances."

