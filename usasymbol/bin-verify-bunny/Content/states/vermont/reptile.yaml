    answer: "Vermont's state reptile is the painted turtle, adopted by the Vermont Legislature in 1994."
  - question: When did Vermont adopt the Painted Turtle?
    answer: "The Vermont Legislature designated the painted turtle the official state reptile in 1994."
  - question: Why did Vermont choose the Painted Turtle?
    answer: "Official sources name the painted turtle as Vermont's most common and widely recognized turtle, but they do not give a more detailed reason for the choice."
  - question: Is the Painted Turtle a turtle, snake, lizard, or alligator?
    answer: "The painted turtle is a freshwater turtle, one of the most common turtles found across Vermont and much of North America."

