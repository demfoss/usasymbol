sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Vermont?
    paragraphs:
      - "The painted turtle is Vermont's official state reptile, designated by the Vermont Legislature in 1994. Its scientific name is Chrysemys picta."
      - "It is a common freshwater turtle found in ponds, lakes, and slow streams throughout the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Painted Turtle
    paragraphs:
      - "The painted turtle has a smooth, dark olive to black shell with red markings along its edges and yellow stripes on its head, neck, and legs."
      - "It grows to about 4 to 10 inches in shell length and is known for basking in groups on logs and rocks in the sun."
      - "Its flat, smooth shell and bright colors make it one of the easiest turtles to recognize in Vermont's wetlands."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Vermont Legislature designated the painted turtle the official state reptile in 1994, recognizing a turtle familiar to students and residents statewide."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Vermont Chose the Painted Turtle
    paragraphs:
      - "Official sources name the painted turtle as Vermont's state reptile because it is the state's most common and widely recognized turtle, but they do not give a more detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Painted Turtle
    paragraphs:
      - "Painted turtles live in ponds, lakes, marshes, and slow-moving rivers throughout Vermont, including the wetlands along Lake Champlain."
    sites:
      - name: Lake Champlain wetlands
        city: Burlington
        lat: 44.48
        lng: -73.21
        note: "Common basking habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Painted Turtle Facts
    facts:
      - "Adopted in 1994 by the Vermont Legislature."
      - "Has a dark shell with red edge markings and yellow stripes on the head and legs."
      - "Grows to about 4 to 10 inches in shell length."
      - "Often seen basking in groups on logs and rocks."
      - "Found in ponds, lakes, and slow streams across Vermont."

