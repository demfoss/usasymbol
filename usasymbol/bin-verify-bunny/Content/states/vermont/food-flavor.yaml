sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Vermont's State Flavor?"
    paragraphs:
      - "Maple is Vermont's official state flavor, designated by the Vermont General Assembly in 1993. Vermont produces more maple syrup than any other state, tapped each spring from its sugar maple forests."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Maple"
    paragraphs:
      - "Maple flavor comes from the sap of sugar maple trees, which producers collect in late winter and early spring during freeze-thaw cycles. The clear sap is boiled down in evaporators until it thickens into syrup, and it takes roughly 40 gallons of sap to make one gallon of syrup. Vermont's cold winters and maple-rich forests make it especially well suited to sugaring."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Maple Became Vermont's State Flavor"
    paragraphs:
      - "The Vermont General Assembly designated maple the official state flavor in 1993, formally recognizing an industry that had already defined the state's identity for generations."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Vermont Chose Maple"
    paragraphs:
      - "Vermont has led the nation in maple syrup production for many years, with thousands of sugarhouses across the state tapping trees each spring. Maple sugaring is also a long-standing seasonal tradition in Vermont, passed down through generations of family sugaring operations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Maple Facts"
    facts:
      - "Adopted as Vermont's state flavor in 1993."
      - "Vermont produces more maple syrup than any other U.S. state."
      - "It takes about 40 gallons of maple sap to make one gallon of syrup."
      - "Sap is collected during freeze-thaw cycles in late winter and early spring."

