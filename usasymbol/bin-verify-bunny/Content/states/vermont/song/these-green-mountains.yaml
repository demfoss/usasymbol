sections:
  - id: overview
    icon: fa-solid fa-music
    title: Vermont State Song
    paragraphs:
      - "\"These Green Mountains\" is Vermont's official state song, adopted in 1999. Diane Martin wrote both the words and music, and the Vermont Legislature chose her song after a statewide search specifically aimed at finding a replacement for the decades-old \"Hail, Vermont!\""

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"These Green Mountains\" Explained"
    paragraphs:
      - "The song centers on the Green Mountains, the range that runs the length of Vermont and gave the state its name. It carries a warm, folk-inspired melody arranged by Rita Buglass Gluck, written to be singable by school choirs and community groups alike."
      - "Diane Martin composed the piece for the 1998 Vermont Arts Council search for a new state song, writing both the lyrics and the tune herself. Since its adoption, the song has been performed by school choruses and the Vermont State House Singers at official events."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "These Green Mountains" Represents Vermont
    paragraphs:
      - "Lawmakers wanted a song tied directly to Vermont's landscape, and the Green Mountains are the state's defining geographic feature, giving Vermont its name centuries before statehood. Martin's lyrics ground the song in that specific place rather than in generic patriotic language."
      - "The song also won on merit through open competition. The Vermont Arts Council reviewed more than 100 submissions and narrowed the field to eight finalists before choosing Martin's entry, giving the selection broad public credibility."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"These Green Mountains\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "These Green Mountains" Became Vermont's State Song
    paragraphs:
      - "In 1998 the Vermont Legislature directed the Vermont Arts Council to organize a search for a new state song to replace \"Hail, Vermont!,\" which had held the title since 1938. The council reviewed more than 100 entries, selected Diane Martin's \"These Green Mountains,\" and the Legislature adopted it in 1999."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"These Green Mountains\" Facts"
    facts:
      - "Vermont adopted \"These Green Mountains\" as its official state song in 1999."
      - "Diane Martin wrote both the lyrics and the music."
      - "Rita Buglass Gluck arranged the song for performance."
      - "It replaced \"Hail, Vermont!,\" the state song since 1938."
      - "The Vermont Arts Council reviewed more than 100 submissions before recommending the song."

