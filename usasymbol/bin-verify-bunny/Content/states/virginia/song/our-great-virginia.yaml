sections:
  - id: overview
    icon: fa-solid fa-music
    title: Virginia State Song
    paragraphs:
      - "\"Our Great Virginia\" is Virginia's official traditional state song, adopted in 2015. Mike Greenly wrote new lyrics set to the well-known melody of \"Oh Shenandoah,\" arranged by Jim Papoulis, giving the state a song rooted in a familiar tune but built around fresh, Virginia-specific words."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Our Great Virginia\" Explained"
    paragraphs:
      - "The song describes Virginia's rivers, mountains, and coastline, carrying the slow, flowing rhythm that \"Oh Shenandoah\" is known for. It reads as a tribute to the state's geography rather than a march or anthem, closer in mood to a folk hymn."
      - "Mike Greenly wrote the lyrics specifically for Virginia's search for a new state song, and Jim Papoulis arranged the music around the traditional tune. School and community choirs, including the Fairfax Choral Society and the Appomattox Youth Chorale, have performed it at official state functions since its adoption."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Our Great Virginia" Represents Virginia
    paragraphs:
      - "Virginia chose a song built on \"Oh Shenandoah\" because the melody is already tied to the Shenandoah Valley and widely recognized as an American folk standard. Pairing it with new, explicitly Virginia-focused lyrics let the state keep a familiar sound while starting fresh."
      - "The choice also let Virginia adopt two songs at once, a traditional one and a popular one, so the state could recognize both a classic folk sound and a modern contemporary style without forcing either to stand alone."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Our Great Virginia\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Our Great Virginia" Became Virginia's State Song
    paragraphs:
      - "Virginia's previous state song, \"Carry Me Back to Old Virginny,\" was set aside as state song emeritus in 1997 because its lyrics romanticized plantation life in ways widely seen as racist. The General Assembly adopted \"Our Great Virginia\" as the new official traditional state song in 2015, alongside \"Sweet Virginia Breeze\" as the official popular song, and it fully repealed the old song's emeritus status in 2026."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Virginia

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Our Great Virginia\" Facts"
    facts:
      - "Virginia adopted \"Our Great Virginia\" as its official traditional state song in 2015."
      - "The melody is the traditional folk tune \"Oh Shenandoah.\""
      - "Mike Greenly wrote the lyrics, and Jim Papoulis arranged the music."
      - "Virginia adopted \"Sweet Virginia Breeze\" the same year as its official popular song."
      - "The song replaced \"Carry Me Back to Old Virginny,\" retired as state song emeritus in 1997 and fully repealed in 2026."

