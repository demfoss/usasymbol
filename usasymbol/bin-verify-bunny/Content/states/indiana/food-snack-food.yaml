sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Indiana's State Snack Food?"
    paragraphs:
      - "Popcorn is Indiana's official state snack food, designated by the Indiana General Assembly in 2021. Indiana is one of the largest popcorn producing states in the country."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Popcorn"
    paragraphs:
      - "Popcorn is a variety of corn with kernels that burst open into a fluffy snack when heated. Indiana farmers grow popcorn alongside the state's much larger field corn crop, and several major popcorn companies process and package it in the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Popcorn Became Indiana's State Snack Food"
    paragraphs:
      - "The Indiana General Assembly designated popcorn the official state snack food in 2021."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Indiana Chose Popcorn"
    paragraphs:
      - "Indiana consistently ranks among the top popcorn producing states in the country. Orville Redenbacher, whose name became synonymous with popcorn, developed his hybrid popcorn variety while working in Indiana, and Weaver Popcorn Company, one of the country's largest popcorn processors, is headquartered in Indianapolis."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Popcorn Comes From in Indiana"
    paragraphs:
      - "Indianapolis is home to Weaver Popcorn Company, one of the country's largest popcorn producers, reflecting the popcorn industry's deep roots in Indiana."
    sites:
      - name: Weaver Popcorn Company
        city: Indianapolis
        lat: 39.7684
        lng: -86.1581
        note: "Headquarters of a major U.S. popcorn producer"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Popcorn Facts"
    facts:
