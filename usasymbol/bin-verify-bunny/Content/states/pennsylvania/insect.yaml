sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Pennsylvania?
  paragraphs:
  - "The Pennsylvania firefly, Photuris pensylvanica, is Pennsylvania's official state insect. State lawmakers designated it in 1974."
  - "Despite its name, the firefly is not a fly. It is a beetle known for the glowing light it produces at night."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Pennsylvania Firefly
  paragraphs:
  - "The Pennsylvania firefly is a black beetle about 0.4 to 0.6 inches long, with two bright red spots near its head and yellow edging along its wing covers."
  - "Like other fireflies, it produces a greenish-yellow glow from the tip of its abdomen."
  - "Flying males flash a short pulse followed by a longer flash lasting up to three seconds to attract females after dark."

- id: history
  icon: fa-solid fa-landmark
  title: How Pennsylvania Chose the Firefly
  paragraphs:
  - "Elementary school students in Upper Darby learned that Maryland had just named a state insect and pushed for Pennsylvania to do the same."
  - "Governor Milton Shapp signed the bill making the firefly Pennsylvania's official state insect in 1974. Lawmakers updated the law in 1988 to specify the firefly's exact scientific name."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Pennsylvania Firefly
  paragraphs:
  - "Pennsylvania fireflies are common across the state in meadows and along the edges of open woods."
  - "They are most active from June through August, flashing after dusk until around midnight."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Pennsylvania Firefly Facts
  facts:
  - "Adopted in 1974 by the Pennsylvania General Assembly, after a push from Upper Darby elementary school students."
  - "Scientific name: Photuris pensylvanica."
  - "Black body about 0.4 to 0.6 inches long, with two red spots and yellow edging on its wing covers."
  - "Produces a greenish-yellow glow, flashing a short pulse followed by a longer flash to attract mates."
  - "Most active from June through August, flying and flashing after dusk."




