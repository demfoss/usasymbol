faq:
- question: What is Pennsylvania's state insect?
  answer: "Pennsylvania's state insect is the Pennsylvania firefly, adopted by the Pennsylvania General Assembly in 1974."
- question: When did Pennsylvania adopt the firefly?
  answer: "Pennsylvania adopted the firefly as its official state insect in 1974."
- question: Why did Pennsylvania choose the firefly?
  answer: "Elementary school students in Upper Darby learned that Maryland had just named a state insect and pushed lawmakers to give Pennsylvania one too."
- question: What does the Pennsylvania firefly look like?
  answer: "It is a black beetle about 0.4 to 0.6 inches long, with two red spots near its head and yellow edging on its wing covers. It glows greenish-yellow at night."
- question: Where is the Pennsylvania firefly found?
  answer: "It is common across Pennsylvania in meadows and at the edges of open woods, most active from June through August."
- question: Is the Pennsylvania firefly a butterfly, bee, beetle, or dragonfly?
  answer: "It is a beetle. Despite its name, a firefly is not a true fly."

