    answer: "Pennsylvania's state amphibian is the eastern hellbender, adopted by the Pennsylvania General Assembly in 2019."
  - question: When did Pennsylvania adopt the eastern hellbender?
    answer: "The Pennsylvania General Assembly designated the eastern hellbender the official state amphibian in 2019."
  - question: Why did Pennsylvania choose the eastern hellbender?
    answer: "Supporters highlighted that the hellbender can only live in clean, well-oxygenated water, making it a symbol of the state's waterway health."
  - question: Is the eastern hellbender endangered?
    answer: "The eastern hellbender is considered a species of conservation concern in Pennsylvania because it needs clean, unpolluted streams to survive."

