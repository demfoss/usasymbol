sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Pennsylvania?
    paragraphs:
      - "The eastern hellbender is Pennsylvania's official state amphibian, designated by the Pennsylvania General Assembly in 2019. Its scientific name is Cryptobranchus alleganiensis."
      - "It is one of the largest salamanders in North America and lives entirely in cold, fast-moving rivers and streams."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Eastern Hellbender
    paragraphs:
      - "The eastern hellbender has a flat, wrinkled body with loose folds of skin along its sides that help it absorb oxygen from the water."
      - "It is brown, gray, or olive in color, which helps it blend in with the rocks on a riverbed, and it can grow to more than 2 feet long."
      - "It stays hidden under large, flat rocks during the day and hunts mainly at night for crayfish and small fish."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Pennsylvania General Assembly designated the eastern hellbender the official state amphibian in 2019, following a campaign that included students and conservation groups pushing for the recognition."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Pennsylvania Chose the Eastern Hellbender
    paragraphs:
      - "Supporters pointed to the hellbender's role as an indicator of clean water, since the species can only survive in cold, well-oxygenated, unpolluted streams, making it a symbol of Pennsylvania's waterway health."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Eastern Hellbender
    paragraphs:
      - "The eastern hellbender lives in clean, fast-flowing rivers and streams across Pennsylvania, especially in the state's mountainous regions with rocky riverbeds."
    sites:
      - name: Loyalsock Creek
        city: Williamsport
        lat: 41.24
        lng: -76.99
        note: "Clean, fast-flowing hellbender habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Eastern Hellbender Facts
    facts:
      - "Adopted in 2019 by the Pennsylvania General Assembly."
      - "One of the largest salamanders in North America, growing to more than 2 feet long."
      - "Breathes largely through folds of skin along its sides."
      - "Can only survive in cold, clean, fast-flowing water."
      - "Hides under large flat rocks during the day and hunts mostly at night."

