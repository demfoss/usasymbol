sections:
  - id: overview
    icon: fa-solid fa-music
    title: Pennsylvania State Song
    paragraphs:
      - "\"Pennsylvania,\" written by Eddie Khoury and Ronnie Bonner, became Pennsylvania's official state song in 1990. The song had been written decades earlier, in the late 1950s and early 1960s, but only reached the governor's desk when lawmakers chose it over the state's previous official song."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Pennsylvania\" Explained"
    paragraphs:
      - "The song is a warm, ceremonial tribute to the state, written in a style suited to school choirs, civic events, and public gatherings. Its tone is celebratory rather than narrative, praising Pennsylvania as a place worth calling home."
      - "Eddie Khoury, a former prison administrator, wrote the words with Ronnie Bonner and composed the music in the early 1960s. The song circulated for years before the General Assembly formally adopted it, a common path for state songs written well ahead of their official recognition."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Pennsylvania" Represents Pennsylvania
    paragraphs:
      - "Lawmakers chose the Khoury and Bonner song because it offered a more contemporary, singable alternative to the state's earlier official song, which had grown outdated by 1990. The new version fit well with school music programs and civic ceremonies already using it informally."
      - "State Representative Frank L. Oliver introduced the measure, and Governor Robert P. Casey signed it into law that November, giving the song formal status decades after it was written."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Pennsylvania\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Pennsylvania" Became Pennsylvania's State Song
    paragraphs:
      - "Pennsylvania's first official state song, also titled \"Pennsylvania,\" was written by Gertrude Rohrer and adopted in 1960. Three decades later, the General Assembly replaced Rohrer's version with the Khoury and Bonner song of the same title, signing it into law in November 1990 as the current official state song. The two songs share a name but not a melody, and only the 1990 version holds official status today."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Pennsylvania\" Facts"
    facts:
      - "Pennsylvania adopted the current \"Pennsylvania\" as its state song in 1990."
      - "Eddie Khoury and Ronnie Bonner wrote the song around 1961, nearly three decades before its adoption."
      - "The song replaced an earlier state song from 1960 that was also titled \"Pennsylvania,\" written by Gertrude Rohrer."
      - "Governor Robert P. Casey signed the song into law in November 1990."

