faq:
  - question: What is Pennsylvania's state song?
    answer: "Pennsylvania's official state song is \"Pennsylvania,\" by Eddie Khoury and Ronnie Bonner, adopted in 1990."
  - question: Who wrote Pennsylvania's state song?
    answer: "Eddie Khoury and Ronnie Bonner wrote the words and music around 1961."
  - question: When did Pennsylvania adopt "Pennsylvania" as its state song?
    answer: "The General Assembly adopted the song in 1990, and Governor Robert P. Casey signed it into law that November."
  - question: Has Pennsylvania had more than one state song called "Pennsylvania"?
    answer: "Yes. An earlier song also titled \"Pennsylvania,\" written by Gertrude Rohrer, was the official state song from 1960 until the 1990 Khoury and Bonner version replaced it."

