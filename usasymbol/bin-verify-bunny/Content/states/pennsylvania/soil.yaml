faq:
- question: What is Pennsylvania's state soil?
  answer: "Pennsylvania's state soil is the Chester series, a deep, well-drained Alfisol that covers the Piedmont of southeastern Pennsylvania. It formed from weathered schist, phyllite, and gneiss and supports the corn, hay, soybeans, and mushrooms grown in Lancaster and Chester counties."
- question: Why is it called Chester soil?
  answer: "The Chester series is named after Chester County, Pennsylvania, where USDA soil scientists first formally described and mapped the series during early twentieth century federal soil surveys. Chester County was one of the first counties in the country to receive a systematic soil survey."
- question: What color is Chester soil?
  answer: "The surface is brown to dark brown silt loam from organic matter. The argillic subsoil transitions from yellowish brown in the upper Bt horizon to strong brown in the middle Bt — the iron-rich clay accumulation zone. The deepest layers are pale yellow to gray saprolite where mica flakes from the original schist are still visible."
- question: Where is Chester soil found in Pennsylvania?
  answer: "Chester soil is found on the gently rolling uplands of the Pennsylvania Piedmont, primarily in Chester, Lancaster, York, Adams, Delaware, and Montgomery counties in the southeastern corner of the state. It occupies the well-drained ridges and slopes where metamorphic bedrock has weathered deeply."
- question: What grows in Chester soil?
  answer: "Corn, hay, soybeans, and winter wheat are the main field crops. Chester County grows roughly half of all commercial mushrooms in the United States on Chester soil farmland. Tobacco was a major crop in Lancaster County through the twentieth century. Where land stays forested, tulip poplar, red oak, white oak, and hickory are the dominant trees."
- question: Who chose Chester as Pennsylvania's state soil?
  answer: "The Soil Science Society of America recognizes the Chester series as Pennsylvania's state soil, representing the Piedmont Alfisol that underlies the state's most productive and continuously farmed agricultural region."
- question: How deep is Chester soil?
  answer: "Chester soil is deep — the true soil profile, from the surface through the argillic Bt horizons, typically extends four to five feet before transitioning into saprolite. The saprolite layer of soft, partially weathered schist and gneiss can extend many feet further, providing good rooting depth for deep-rooted crops and trees."

