faq:
- question: What is Ohio's state soil?
  answer: "Ohio's state soil is the Miamian series, a brown, clay-rich Alfisol found on the glaciated till plains of southwestern Ohio. It is recognized by the USDA Natural Resources Conservation Service as Ohio's representative state soil and is the foundation of the state's corn, soybean, and wheat farming."
- question: Why is it called Miamian soil?
  answer: "The series is named after Miami County in southwestern Ohio, where USDA soil scientists first formally described and mapped the soil. Miami County is in the heart of Ohio's agricultural till plain, between Dayton and the Indiana border."
- question: What color is Miamian soil?
  answer: "The surface is brown to dark brown — enriched by centuries of forest leaf litter and organic matter. The argillic subsoil is dark yellowish brown to yellowish brown, with thin clay films visible on the soil peds. The glacial till below the argillic layer is pale brown, lighter in color and high in calcium carbonates."
- question: Where is Miamian soil found in Ohio?
  answer: "Miamian soil is found on the flat to gently rolling till plains of southwestern Ohio. It is most concentrated in Miami, Montgomery, Preble, Darke, Clark, and Greene counties. The soil sits at elevations of 700 to 1,100 feet and receives 38 to 42 inches of precipitation per year."
- question: What crops grow in Miamian soil?
  answer: "The main crops are corn, soybeans, and winter wheat — the standard Corn Belt rotation. Hay, alfalfa, and clover are also grown in rotation. Some producers grow processing tomatoes and vegetables. White oak, red oak, shagbark hickory, and sugar maple grow on steeper slopes where row cropping is impractical."
- question: Who chose Miamian as Ohio's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Miamian series to represent Ohio. It was chosen because it is the defining soil of southwestern Ohio's glaciated till plain — the state's most productive agricultural region."
- question: How deep is the clay layer in Miamian soil?
  answer: "The argillic horizon — the clay-rich subsoil that defines Miamian soil as an Alfisol — runs from about 9 to 30 inches below the surface. Below that, a transition layer grades into the calcareous glacial till parent material at around 42 inches. The full profile is well over 5 feet deep in most locations."

