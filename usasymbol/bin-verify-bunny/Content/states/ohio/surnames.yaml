    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker or blacksmith. Smith leads Ohio because it belonged to the state's earliest Anglo-American settlers and stayed common in every later setting, from farm counties in the interior to factory cities such as Cleveland, Akron, and Youngstown."

  - rank: 2
    name: Miller
    count: 79977
    ratio: 148
    origin: english
    type: Occupational
    meaning: "From Middle English 'miller', the operator of a grain mill. In Ohio the name also absorbed many German Müller families, which helps explain why Miller ranks second statewide rather than drifting lower as it does in many neighboring states."

