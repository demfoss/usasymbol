unique_surnames:
  - name: Snyder
    state_rank: 41
    national_rank: 144
    origin: german
    why: "Snyder is the anglicized form of German 'Schneider', meaning tailor. It is more common in Ohio than nationally because Pennsylvania German settlement crossed into eastern and central Ohio, then overlapped with Amish and Mennonite communities in Holmes, Wayne, and Tuscarawas counties."

  - name: Myers
    state_rank: 32
    national_rank: 84
    origin: german
    why: "Myers often reflects German 'Meier' or 'Meyer', originally a steward or tenant farmer. Its strong Ohio showing likely comes from the same German and Pennsylvania Dutch settlement belt that shaped Fairfield County, the canal corridor, and east-central Ohio farm country."

  - name: Wagner
    state_rank: 57
    national_rank: 139
    origin: german
    why: "Wagner means wagon maker in German. Ohio's high Wagner rank tracks the state's large German population, especially in Cincinnati and other nineteenth-century manufacturing centers where German-language institutions stayed strong for generations."

  - name: Weaver
    state_rank: 68
    national_rank: 195
    origin: german
    why: "Although Weaver can be English, in Ohio its high rank likely reflects the anglicized German surname 'Weber' as well as older English usage. The name fits a state where German-speaking religious communities and small-town craft traditions remained unusually durable."

  - name: Adkins
    state_rank: 70
    national_rank: 448
    origin: english
    why: "Adkins is a patronymic derived from Adam with a medieval diminutive ending. It stands out in Ohio because southeastern Ohio is part of Appalachia, and later migration from Appalachian communities into Cincinnati, Dayton, and other work-centered cities helped carry family names that are rarer in the nation as a whole."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Ohio's top 20 contains a thick block of occupational surnames, including Smith, Miller, Taylor, Clark, and Baker. That pattern fits a state shaped first by farm and market towns, then by workshops, mills, and factories; Miller also carries an extra Ohio layer because many German Müllers likely anglicized the spelling."
    examples:
      - Smith (metalworker)
      - Miller (grain mill operator)
      - Taylor (tailor)
      - Baker (bread maker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate much of Ohio's upper ranking: Johnson, Williams, Jones, Davis, Wilson, Thomas, Thompson, Jackson, Anderson, and Harris all descend from personal names. They arrived through British settlement, then stayed common because later migration into Ohio's industrial cities reinforced the same broad surname pool."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Thompson (son of Thomas)
      - Anderson (son of Andrew or Anders)

  - type: German-American and Amish Names
    icon: fa-solid fa-map-location-dot
    description: "Ohio's most distinctive surname layer sits just below the top 20, where German and Pennsylvania Dutch names rank much higher than national averages would predict. Cincinnati's nineteenth-century German immigration and east-central Ohio's Amish and Mennonite settlements help explain why Miller, Snyder, Myers, Wagner, and Weaver feel especially at home in Ohio."
    examples:
      - Snyder (tailor)
      - Myers (steward or tenant farmer)
      - Wagner (wagon maker)
      - Weaver (weaver; also anglicized Weber)

faq:
  - question: "What are the most common last names in Ohio?"
    answer: "The most common last names in Ohio are Smith, Miller, Johnson, Brown, and Williams. Ohio stands out because Miller ranks second statewide, higher than in many other large states."

  - question: "Why is Miller such a common last name in Ohio?"
    answer: "Miller is unusually common in Ohio because the state had a very large German population, especially in Cincinnati and the east-central farming belt, and many families named Müller used the English spelling Miller. Amish settlement in Holmes County and nearby counties also helped keep German-derived surnames prominent."

  - question: "Why are Snyder and Myers more common in Ohio than nationally?"
    answer: "Both surnames reflect Ohio's strong German and Pennsylvania Dutch settlement history. Snyder comes from Schneider and Myers often reflects Meier or Meyer, and both stayed dense in the same eastern and central Ohio regions where German-speaking farming and Anabaptist communities endured."

