seo:
  title: "Most Common Last Names in Ohio"
  description: "Ohio's most common last names are Smith, Miller, and Johnson, shaped by German settlement, Amish country, and Cleveland's growth."

page:
  h1: "Most Common Last Names in Ohio"
  intro: "Miller ranks second among Ohio's most common surnames, ahead of Johnson and Williams, a rare pattern in a large state and a clear marker of German Ohio. German immigrants made up half of Cincinnati's population by 1910, Amish settlements took root in Holmes County in the early 1800s, and Cleveland's industrial boom drew Black families north during the Great Migration."
  heritage_title: "German Ohio, Amish Country, and Industrial Cities"
  heritage_body: "Ohio's surname map was built in layers. German immigrants settled heavily along the Ohio River and in cities such as Cincinnati, Columbus, Cleveland, and Toledo; Ohio History Connection notes that by 1910 they made up half of Cincinnati's population. East-central Ohio added another German-speaking layer through Amish and Mennonite settlement in Holmes, Wayne, Tuscarawas, and Stark counties, while Cleveland's 1910-1930 industrial growth and later migration from rural Appalachia reinforced names such as Williams, Jackson, Hall, and Adkins in the state's cities."
  fun_fact: "Ohio is one of the few large states where Miller outranks both Johnson and Williams, showing how German and Amish settlement pushed an occupational surname into second place statewide."

