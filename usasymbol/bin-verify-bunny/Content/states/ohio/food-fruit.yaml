faq:
  - question: "What is Ohio's state fruit?"
    answer: "Ohio's state fruit is the tomato, adopted by the Ohio General Assembly in 2009."
  - question: "When did Ohio adopt the tomato as its state fruit?"
    answer: "The Ohio General Assembly designated the tomato the official state fruit in 2009."
  - question: "Why did Ohio choose the tomato?"
    answer: "Ohio has long been a leading producer of processing tomatoes, an important part of the state's farm economy."
  - question: "Is the tomato really a fruit?"
    answer: "Yes, botanically the tomato is a fruit because it develops from a flower and contains seeds, even though it is usually cooked and eaten like a vegetable."

