intro_text: "Ohio's state fruit is the tomato, adopted in 2009 to recognize a crop grown widely across the state and central to Ohio's processed food industry. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Ohio's State Fruit?"
    paragraphs:
      - "The tomato is Ohio's official state fruit, designated by the Ohio General Assembly in 2009. Ohio is one of the leading states for growing tomatoes used in ketchup, sauce, and other processed foods."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Tomato"
    paragraphs:
      - "Tomatoes are round, juicy fruits that are botanically a fruit but commonly treated as a vegetable in cooking. Ohio grows both fresh-market tomatoes and processing tomatoes, which are used to make sauces, ketchup, and canned products."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Tomato Became Ohio's State Fruit"
    paragraphs:
      - "The Ohio General Assembly designated the tomato the official state fruit in 2009."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Ohio Chose the Tomato"
    paragraphs:
      - "Ohio has long been one of the nation's top producers of processing tomatoes, supplying major food companies, and the crop has been an important part of the state's farm economy for generations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Tomato Facts"
    facts:
      - "Adopted as Ohio's state fruit in 2009."
      - "Ohio is a leading producer of tomatoes used for processed foods."
      - "Tomatoes are botanically a fruit, though most people treat them as a vegetable."

