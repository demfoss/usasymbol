faq:
  - question: "What is Ohio's state motto?"
    answer: "Ohio's state motto is \"With God, All Things Are Possible.\" It is a direct quotation from Matthew 19:26 in the King James Bible and became official on October 1, 1959."

  - question: "What does Ohio's state motto mean?"
    answer: "The phrase comes from a passage where Jesus says that what is impossible for people alone becomes possible with God. As a state motto, it reflects the idea that difficult or impossible-seeming goals can still be achieved."

  - question: "Who came up with Ohio's state motto?"
    answer: "James Mastronardo, a ten-year-old from Cincinnati, proposed it in March 1958 after noticing Ohio had no motto. He suggested his mother's favorite phrase, not knowing it came from the Bible. He collected nearly 20,000 signatures and testified before the state legislature."

  - question: "When did Ohio adopt its state motto?"
    answer: "The legislature adopted it in 1959. Governor Michael DiSalle signed the bill, and it took effect on October 1, 1959. Ohio had been without an official motto since 1868."

  - question: "Is Ohio's state motto constitutional?"
    answer: "Yes. The ACLU challenged it in 1997. A 6th Circuit panel ruled it unconstitutional in 2000, but the full Sixth Circuit reversed that decision in 2001, ruling 9-4 that the motto qualifies as \"ceremonial deism\" and does not violate the First Amendment."

