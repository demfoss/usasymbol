seo_description: "Ohio's state motto is \"With God, All Things Are Possible,\" from Matthew 19:26. A ten-year-old boy proposed it in 1958; it became official in 1959."

intro_text: "Ohio's state motto is <strong>With God, All Things Are Possible</strong>, a direct quotation from Matthew 19:26 in the King James Bible. It became official on October 1, 1959, after a ten-year-old boy from Cincinnati proposed it to the state legislature. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

