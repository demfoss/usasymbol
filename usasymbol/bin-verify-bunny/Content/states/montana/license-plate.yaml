intro_text: "**\"Treasure State\"** is the slogan on Montana's current standard license plate base, introduced in 2010. **\"Big Sky Country\"** is also strongly tied to Montana plates, first appearing in 1967 and returning in 2006, but it is not the single current standard slogan. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "Montana's current 2010-present standard plate uses \"Treasure State.\" \"Big Sky Country\" first appeared on Montana plates in 1967, was shortened to \"Big Sky\" on the 1976 base, and returned on the 2006 base. Montana now offers several standard designs, including older Big Sky-style bases."
