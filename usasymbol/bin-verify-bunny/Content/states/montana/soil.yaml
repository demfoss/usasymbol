- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Scobey Soil
  paragraphs:
  - "Spring wheat is the defining crop of Scobey soil. Montana ranks among the top spring wheat-producing states in the country, and the Hi-Line counties where Scobey soil dominates produce a large share of that crop. Hard red spring wheat from this region goes into bread and pasta flour."
  - "Winter wheat, barley, and pulse crops — lentils and dry peas — also grow on Scobey soil. Dryland farming is standard practice here because rainfall is limited on the northern plains. Crops depend on winter snowpack and spring rains rather than irrigation."
  - "Where farmland gives way to rangeland, Scobey soil supports native grasses: blue grama, western wheatgrass, and needle-and-thread — the same plant community that built the soil's dark surface layer over thousands of years."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Scobey Soil Facts
  facts:
  - "The Scobey series is named for Scobey, Montana, a farming town in Daniels County — one of the Hi-Line communities whose grain economy the soil has supported for over a century."
  - "Scobey soil is classified as a fine, smectitic, frigid Typic Argiustolls — a mollisol with a clay-rich subsoil formed under a cold northern climate."
  - "The dark color of Scobey's surface layer comes from centuries of decomposed native grass roots, which moved organic matter into the soil long before the first settlers arrived."
  - "Calcium carbonate accumulates in the Bk horizon because the climate is dry enough that water evaporates before leaching lime out of the soil — a signature of the northern Great Plains."
  - "The glacial till that forms Scobey soil's parent material was deposited by continental ice sheets that covered north-central Montana roughly 10,000 to 15,000 years ago."

