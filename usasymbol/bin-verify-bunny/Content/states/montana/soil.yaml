faq:
- question: What is Montana's state soil?
  answer: "Montana's state soil is the Scobey series, a deep, dark mollisol found on the glaciated plains of north-central Montana. It covers the Hi-Line region and supports spring wheat, barley, and native rangeland grasses."
- question: Why is it called Scobey soil?
  answer: "The Scobey series is named for Scobey, Montana, a farming town in Daniels County. USDA soil scientists name soil series after nearby geographic features — towns, lakes, creeks — near where the soil was first studied and described."
- question: What color is Scobey soil?
  answer: "The surface layer is very dark grayish brown, almost black, because of organic matter built up by centuries of native grass growth. Below it, the argillic horizon is brown, and the deeper layers are pale brown from calcium carbonate accumulation."
- question: Where is Scobey soil found in Montana?
  answer: "Scobey soil is found across north-central and northeastern Montana, from the Rocky Mountain front east toward the North Dakota border. It is the dominant soil in Hi-Line counties including Daniels, Valley, Phillips, Blaine, and Hill."
- question: What grows in Scobey soil?
  answer: "The main crop is spring wheat, which Montana grows in large quantities for bread and pasta flour. Winter wheat, barley, lentils, and dry peas also grow here. On rangeland, native grasses including western wheatgrass and blue grama cover the surface."
- question: Who chose the Scobey soil as Montana's state soil?
  answer: "Montana's state soil was selected through coordination between the USDA Natural Resources Conservation Service and Montana State University Extension. The Scobey series was chosen to represent Montana's dominant agricultural landscape: the glaciated Hi-Line plains."
- question: How deep is Scobey soil?
  answer: "Scobey soil typically extends 40 to 60 inches before reaching the glacial till parent material. The dark surface layer is about 7 inches deep. The clay-enriched argillic horizon runs from about 7 to 22 inches, and calcium carbonate begins accumulating below that."

