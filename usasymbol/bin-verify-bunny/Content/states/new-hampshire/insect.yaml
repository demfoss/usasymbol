sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of New Hampshire?
  paragraphs:
  - "The ladybug, family Coccinellidae, is New Hampshire's official state insect. State lawmakers designated it in 1977."
  - "Ladybug is a common name covering many small beetle species in the same family, rather than one single species."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Ladybug
  paragraphs:
  - "A ladybug is a small, round beetle with a domed shell, usually red or orange marked with black spots."
  - "Ladybugs have short legs and antennae and can fly using a pair of wings hidden under their hard outer shell."
  - "They are commonly found on plants and gardens, where they feed on small insects like aphids."

- id: history
  icon: fa-solid fa-landmark
  title: How New Hampshire Chose the Ladybug
  paragraphs:
  - "The New Hampshire General Court named the ladybug the official state insect in 1977."
  - "Official sources confirm the designation and its year but do not give a detailed reason for the choice."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Ladybug Facts
  facts:
  - "Adopted in 1977 by the New Hampshire General Court."
  - "Ladybug refers to beetles in the family Coccinellidae, not one single species."
  - "Small, round, domed beetle, usually red or orange with black spots."
  - "Ladybugs feed on small insects like aphids in gardens and on plants."
  - "New Hampshire also has a separate state butterfly, the Karner blue, adopted in 1992."




