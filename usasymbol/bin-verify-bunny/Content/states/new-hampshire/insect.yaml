faq:
- question: What is New Hampshire's state insect?
  answer: "New Hampshire's state insect is the ladybug, adopted by the New Hampshire General Court in 1977."
- question: When did New Hampshire adopt the ladybug?
  answer: "New Hampshire adopted the ladybug as its official state insect in 1977."
- question: What does New Hampshire's state insect look like?
  answer: "The ladybug is a small, round, domed beetle, usually red or orange with black spots."
- question: Is the ladybug one specific species?
  answer: "No. Ladybug is a common name for many small beetle species in the family Coccinellidae, not one single species."
- question: Does New Hampshire have a separate state butterfly?
  answer: "Yes. New Hampshire named the Karner blue its official state butterfly in 1992, separate from the ladybug's designation as state insect."

