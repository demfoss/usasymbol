sections:
  - id: overview
    icon: fa-solid fa-music
    title: New Hampshire State Song
    paragraphs:
      - "\"Old New Hampshire\" is New Hampshire's official state song, adopted in 1949. Manchester organist Maurice Hoffman composed the music and Dr. John F. Holmes wrote the words in the mid-1920s, decades before the legislature finally made it official."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Old New Hampshire\" Explained"
    paragraphs:
      - "The song describes New Hampshire's granite hills, forests, and lakes in the warm, nostalgic tone of someone recalling a beloved home. It moves at a stately, hymn-like pace suited to group singing at civic occasions rather than solo performance."
      - "Dr. John F. Holmes of Manchester wrote the lyrics, and Maurice Hoffman Jr., organist at Manchester's Franklin Street Congregational Church, set them to music around 1926. The two men worked in Manchester's church and civic music circles, and the song circulated locally for years before it reached the state legislature."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Old New Hampshire" Represents New Hampshire
    paragraphs:
      - "New Hampshire chose the song for its plain, direct portrait of the state's granite landscape, the same imagery behind the state's nickname, the Granite State. Its hymn-like structure also made it practical for schools and civic groups to sing together."
      - "The song's path to adoption reflects how particular lawmakers were about the choice. The General Court voted down the song in 1941 and again rejected a proposal in 1943 to hold a public contest for a state song, before finally approving \"Old New Hampshire\" in 1949."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Old New Hampshire\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Old New Hampshire" Became New Hampshire's State Song
    paragraphs:
      - "New Hampshire's General Court finally designated \"Old New Hampshire\" the official state song in 1949, roughly 23 years after Hoffman and Holmes wrote it. New Hampshire has since added a large number of additional official and honorary songs alongside it, including a separate official state song, \"Live Free or Die,\" adopted in 2007, giving the state nine officially recognized songs in total."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of New Hampshire

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Old New Hampshire\" Facts"
    facts:
      - "New Hampshire adopted \"Old New Hampshire\" as its official state song in 1949."
      - "Dr. John F. Holmes wrote the lyrics and Maurice Hoffman composed the music around 1926."
      - "The New Hampshire General Court rejected the song in 1941 before finally adopting it eight years later."
      - "New Hampshire recognizes nine official and honorary state songs, more than most states."
      - "\"Live Free or Die,\" written by Barry Palmer in 2007, is New Hampshire's other official state song."

