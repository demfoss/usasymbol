faq:
  - question: What is New Hampshire's state song?
    answer: "New Hampshire's official state song is \"Old New Hampshire,\" adopted in 1949."
  - question: Who wrote New Hampshire's state song?
    answer: "Dr. John F. Holmes wrote the lyrics and Maurice Hoffman composed the music, around 1926."
  - question: When did New Hampshire adopt "Old New Hampshire" as its state song?
    answer: "The New Hampshire General Court adopted the song in 1949, after rejecting it in 1941."
  - question: Does New Hampshire have more than one official song?
    answer: "Yes. New Hampshire recognizes nine official and honorary songs, including a separate official state song called \"Live Free or Die.\""

