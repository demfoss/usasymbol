seo:
  title: "Most Common Last Names in Oklahoma"
  description: "The most common last names in Oklahoma are Johnson, Jones, and Williams, shaped by Indian Territory records, Freedmen communities, and land runs."

page:
  h1: "Most Common Last Names in Oklahoma"
  intro: "Johnson, Jones, and Williams are the most common last names in Oklahoma, a ranking shaped by Five Tribes enrollment, Freedmen communities, and the land-run settlement that followed in 1889 and 1893. Oklahoma combines inherited Indian Territory surnames with later Southern and Midwestern arrivals, which is why patronymics dominate the top 20."
  heritage_title: "Indian Territory Names and the Land Runs"
  heritage_body: "During the 1830s and 1840s, the Cherokee, Chickasaw, Choctaw, Muscogee, and Seminole nations were forced into present-day Oklahoma, bringing many already established family names into Indian Territory. Dawes-era enrollment and allotment records preserved surnames such as Johnson, Jones, Williams, Brown, and Davis across eastern Oklahoma, while Freedmen communities and later all-Black towns strengthened many of the same names after the Civil War. Then the 1889 opening of the Unassigned Lands and the 1893 Cherokee Outlet run pulled in Southern cotton farmers, Midwestern wheat growers, and railroad towns, layering Miller, Taylor, Baker, and Hill onto an already mixed surname map."
  fun_fact: "Johnson appears repeatedly in the Oklahoma Historical Society's Dawes Rolls database from 1898 to 1914, showing how a surname common in the South also became deeply rooted in Indian Territory before Oklahoma reached statehood in 1907."

surnames:
  - rank: 1
    name: Johnson
    count: 31797
    ratio: 131
    origin: english
    type: Patronymic
    meaning: "From medieval English, meaning son of John, from Hebrew 'Yohanan', God is gracious. In Oklahoma, Johnson appears throughout Dawes Rolls records for citizens and Freedmen of the Five Tribes between 1898 and 1914, which helps explain why it ranks first statewide."

  - rank: 2
    name: Jones
    count: 28605
    ratio: 146
    origin: welsh
    type: Patronymic
    meaning: "A Welsh and English patronymic meaning son of John, built from the Welsh form 'Ioan'. In Oklahoma it was carried west by families in Indian Territory and reinforced again when settlers from Arkansas, Texas, and Kansas entered the new towns opened after 1889."

  - rank: 3
    name: Williams
    count: 28577
    ratio: 146
    origin: english
    type: Patronymic
    meaning: "From William, ultimately the Germanic 'Willahelm', will plus helmet. Williams spread through both tribal and nontribal communities in Oklahoma, and it was strengthened further by Freedmen families and the all-Black towns founded after the Civil War."

  - rank: 4
    name: Brown
    count: 28277
    ratio: 147
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', describing brown hair, clothing, or complexion. Brown appears on both Indian Territory and Oklahoma Territory records, which gave the name a broad east-west spread before and after statehood."

  - rank: 5
    name: Davis
    count: 24452
    ratio: 170
    origin: welsh
    type: Patronymic
    meaning: "A patronymic from David, from Hebrew 'Dawid', beloved. In Oklahoma the name fits both older Indian Territory communities and the southern settlement stream that made the southeast, or Little Dixie, one of the state's most distinct cultural regions."

  - rank: 6
    name: Miller
    count: 19379
    ratio: 215
    origin: english
    type: Occupational
    meaning: "An occupational surname for a grain miller, from Middle English 'miller'. It rose strongly in Oklahoma's farm belt as wheat counties in the north and west filled after the Cherokee Outlet opening of September 16, 1893."

  - rank: 7
    name: Wilson
    count: 18555
    ratio: 225
    origin: english
    type: Patronymic
    meaning: "Meaning son of Will, a short form of William. Wilson belongs to the same broad surname layer that appears in Dawes records in the east and in land-run and railroad communities across central Oklahoma."

  - rank: 8
    name: Taylor
    count: 15481
    ratio: 269
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cloth cutter or tailor. In Oklahoma the name spread with merchants, railroad workers, and settlers who moved into county-seat towns after the 1889 and 1893 openings."

  - rank: 9
    name: Thompson
    count: 15198
    ratio: 274
    origin: english
    type: Patronymic
    meaning: "Meaning son of Thom, a short form of Thomas. Thompson followed the southern and Ozark migration routes into eastern Oklahoma and later settled into the mixed farming towns that linked the Arkansas line to Muskogee and Tulsa."

  - rank: 10
    name: Martin
    count: 14423
    ratio: 289
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', of Mars, carried widely through French and English naming traditions. Oklahoma's long French trading history around Three Forks gave Martin an early foothold before later American settlement spread it statewide."

  - rank: 11
    name: Jackson
    count: 14057
    ratio: 296
    origin: english
    type: Patronymic
    meaning: "Meaning son of Jack, a medieval form of John. Jackson became deeply rooted in Oklahoma through both southern migration and African American communities that grew in Indian Territory and in the land openings era."

  - rank: 12
    name: Anderson
    count: 13391
    ratio: 311
    origin: scottish
    type: Patronymic
    meaning: "Meaning son of Andrew or Anders, from Greek 'Andreas'. In Oklahoma it reflects the northern British naming stream that arrived with Midwestern settlers while also appearing in long-settled eastern communities before 1907."

  - rank: 13
    name: White
    count: 13106
    ratio: 318
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', often describing light hair or a fair complexion. White was already common in both Indian Territory and Oklahoma Territory records, which helps explain its durable statewide rank."

  - rank: 14
    name: Thomas
    count: 12688
    ratio: 328
    origin: welsh
    type: Patronymic
    meaning: "From Aramaic 'Toma', meaning twin. Thomas moved into Oklahoma through Welsh and English family lines and remained durable because it fit both tribal-era records in the east and later settlement in the center of the state."

  - rank: 15
    name: Harris
    count: 12638
    ratio: 330
    origin: english
    type: Patronymic
    meaning: "Meaning son of Harry, a medieval form of Henry. In Oklahoma it traveled with southern families into the Red River counties and then spread north as Oklahoma City and other rail-linked towns expanded."

  - rank: 16
    name: Walker
    count: 11668
    ratio: 357
    origin: english
    type: Occupational
    meaning: "Originally an occupational name for a cloth fuller, from Middle English 'walkere'. Walker appears in both tribal enrollment-era records and the later stream of Anglo settlers who filled central and western Oklahoma after the land runs."

  - rank: 17
    name: Clark
    count: 11278
    ratio: 370
    origin: english
    type: Occupational
    meaning: "From Old English 'clerc', a clerk or literate official. The name fit frontier forts, agencies, county-seat towns, and railroad offices, so it spread easily during Oklahoma's territorial years."

  - rank: 18
    name: Hill
    count: 10981
    ratio: 380
    origin: english
    type: Topographic
    meaning: "A topographic surname for someone who lived on or near a hill. It settled into Oklahoma's eastern uplands and southern farm country, where many residents came from the same hill-country South and border-state migration routes."

  - rank: 19
    name: Allen
    count: 10510
    ratio: 397
    origin: english
    type: Patronymic
    meaning: "Usually derived from the personal name Alan or Allen, which entered English from Breton and Norman use. In Oklahoma the name crosses many communities, appearing in older Indian Territory family lines as well as in statehood-era towns."

  - rank: 20
    name: Baker
    count: 10435
    ratio: 399
    origin: english
    type: Occupational
    meaning: "An occupational surname for a baker, from Old English 'baecere'. Baker spread with courthouse towns, wheat settlements, and commercial main streets that grew quickly after the Cherokee Outlet opening and before statehood."

unique_surnames:
  - name: Harjo
    state_rank: 0
    national_rank: 0
    origin: muscogee
    why: "Harjo is a Muscogee surname that Oklahoma readers recognize through Chitto Harjo, the Creek leader known as Crazy Snake, and poet Joy Harjo of Tulsa. Its visibility is tied to the Muscogee Nation's removal to Indian Territory and to later concentration in the Tulsa and Okmulgee orbit."

  - name: Chouteau
    state_rank: 0
    national_rank: 0
    origin: french
    why: "Chouteau marks the French fur-trading family whose posts at Salina and the Three Forks area linked present-day Oklahoma to St. Louis commerce before statehood. The name survives as a town in Mayes County and as one of the state's most recognizable pre-territorial family names."

  - name: Colbert
    state_rank: 0
    national_rank: 0
    origin: scottish
    why: "In Oklahoma, Colbert usually points to the Chickasaw Colbert family, descendants of a Scottish line that intermarried into the Chickasaw Nation. Their Red River ferry and the town of Colbert in Bryan County keep the surname visible in southern Oklahoma history."

  - name: Mankiller
    state_rank: 0
    national_rank: 0
    origin: cherokee
    why: "Mankiller is strongly associated with Cherokee Oklahoma because Wilma Mankiller, the Cherokee Nation's first elected woman chief, lived in Adair County and made the surname nationally recognizable. Unlike a broad Anglo surname, it still points readers directly to Cherokee Nation history."

  - name: Fivekiller
    state_rank: 0
    national_rank: 0
    origin: cherokee
    why: "Fivekiller is a Cherokee surname still visible in Dawes Rolls entries from Indian Territory and in northeastern Oklahoma family lines. It stands out because it signals Cherokee roots around the Tahlequah and Adair County region rather than the generic surname pool of the wider South."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Five of Oklahoma's top 20, Miller, Taylor, Walker, Clark, and Baker, come from jobs. They rose with farm towns, rail depots, mills, and county seats created during the territorial era and the land openings in north and west Oklahoma."
    examples:
      - Miller (grain miller)
      - Taylor (tailor)
      - Baker (baker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "At least ten of Oklahoma's top 20 are patronymics, including Johnson, Jones, Williams, Davis, Wilson, Thompson, Jackson, Anderson, Thomas, and Harris. That dominance reflects both Indian Territory records for the Five Tribes and Freedmen and the later flood of Southern settlers whose surnames were built from fathers' given names."
    examples:
      - Johnson (son of John)
      - Jones (son of John)
      - Williams (son of William)
      - Jackson (son of Jack)

  - type: Descriptive or Place-Based Names
    icon: fa-solid fa-map-location-dot
    description: "Brown, White, and Hill show how simple English descriptors remained durable in a state built from many migrations. Because Oklahoma combined tribal nations, land runs, cattle country, coal camps, and all-Black towns, these flexible names spread easily across communities that did not share one single ancestry."
    examples:
      - Brown (brown hair or complexion)
      - White (fair hair or complexion)
      - Hill (someone living near a hill)

faq:
  - question: "What are the most common last names in Oklahoma?"
    answer: "The most common last names in Oklahoma are Johnson, Jones, Williams, Brown, and Davis. In this statewide list, Johnson ranks first, with Jones and Williams close behind."

  - question: "Why are Johnson and Jones so common in Oklahoma?"
    answer: "Johnson and Jones are so common in Oklahoma because the state combined eastern tribal nations, Freedmen communities, and later land-run settlers who already carried those surnames. The Dawes Rolls from 1898 to 1914 and the settlement boom after 1889 reinforced the same small set of Anglo patronymics."

