faq:
  - question: "What is Oklahoma's state meal?"
    answer: "Oklahoma's state meal, adopted in 1988, includes chicken-fried steak, barbecued pork, biscuits with sausage gravy, cornbread, grits, corn, squash, fried okra, black-eyed peas, strawberries, and pecan pie."
  - question: "When did Oklahoma adopt its state meal?"
    answer: "The Oklahoma Legislature designated the official state meal in 1988."
  - question: "Why did Oklahoma choose these dishes for its state meal?"
    answer: "The dishes reflect food traditions common across Oklahoma, including cattle ranching, pork and dairy production, and crops such as corn, squash, and okra."
  - question: "Is the Oklahoma state meal still eaten today?"
    answer: "Yes, the individual dishes that make up the state meal remain common in Oklahoma home cooking and restaurants."

