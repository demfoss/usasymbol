intro_text: "Oklahoma's state meal, adopted by the state legislature in 1988, is a full traditional spread that includes chicken-fried steak, barbecued pork, biscuits and sausage gravy, cornbread, grits, black-eyed peas, squash, fried okra, corn, strawberries, and pecan pie. This profile appears in the [list of U.S. state foods](/symbols/dishes)."

sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Oklahoma's State Meal?"
    paragraphs:
      - "Oklahoma's official state meal, designated by the Oklahoma Legislature in 1988, is not a single dish but a full menu of foods: chicken-fried steak, barbecued pork, biscuits with sausage gravy, cornbread, grits, corn, squash, fried okra, black-eyed peas, strawberries, and pecan pie."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Oklahoma State Meal"
    paragraphs:
      - "The meal combines dishes rooted in Oklahoma's ranching and farming traditions. Chicken-fried steak is a breaded, pan-fried beef cutlet served with gravy, while barbecued pork and biscuits with sausage gravy reflect the state's meat and dairy farming. Cornbread, grits, corn, squash, and fried okra draw on crops grown across the state, and black-eyed peas, strawberries, and pecan pie round out the spread."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Oklahoma State Meal Was Chosen"
    paragraphs:
      - "The Oklahoma Legislature designated the state meal in 1988, naming a full list of dishes rather than a single food. Oklahoma students are commonly credited with proposing the idea of an official state meal, an effort that led lawmakers to formally adopt it."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oklahoma Chose These Dishes"
    paragraphs:
      - "Each dish in the state meal reflects food traditions common across Oklahoma, from cattle ranching and pork production to corn, squash, and okra farming. Rather than picking one dish to represent the state, lawmakers chose a full traditional plate that could stand in for Oklahoma home cooking as a whole."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Oklahoma State Meal Facts"
    facts:
      - "Adopted as Oklahoma's state meal in 1988."
      - "The meal includes eleven separate foods, from chicken-fried steak to pecan pie."
      - "Oklahoma is one of only a few states to designate a full state meal rather than a single dish."
      - "The meal reflects Oklahoma's ranching, dairy, and vegetable farming traditions."

