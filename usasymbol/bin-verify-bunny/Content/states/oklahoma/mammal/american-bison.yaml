faq:
  - question: "What is Oklahoma's state animal?"
    answer: "Oklahoma's state animal is the American bison (Bison bison), designated in 1972. The bison represents Oklahoma's Great Plains heritage, Native American cultural connections, and one of conservation's most dramatic recovery stories. The species crashed from an estimated 60 million animals to fewer than 1,000 by the 1890s but recovered through dedicated protection efforts."
  
  - question: "When was the American bison designated as Oklahoma's state animal?"
    answer: "The American bison became Oklahoma's official state animal in 1972. The designation recognized the species' cultural significance to Native American peoples and its near-extinction story. Oklahoma's identity as former Indian Territory made the bison especially meaningful as symbol of indigenous heritage and survival."
  
  - question: "Why did Oklahoma choose the American bison as its state animal?"
    answer: "Oklahoma chose the American bison because it embodies the state's identity as former Indian Territory where Plains tribes maintained bison-centered cultures. The bison sustained Native American peoples for thousands of years before systematic slaughter nearly eliminated both the species and indigenous ways of life. Oklahoma's conservation herds at Wichita Mountains Wildlife Refuge and Tallgrass Prairie Preserve represent efforts to restore both ecological and cultural relationships with bison."
  
  - question: "Where can I see wild bison in Oklahoma?"
    answer: "You can see wild bison at two primary Oklahoma locations: the Tallgrass Prairie Preserve near Pawhuska (approximately 2,500 bison on 39,650 acres) and Wichita Mountains Wildlife Refuge near Lawton (approximately 650 bison on 59,020 acres). Both locations offer driving routes through bison range. Woolaroc Museum and Wildlife Preserve near Bartlesville also maintains viewable bison herds. Always maintain safe distances—bison are dangerous wild animals that can charge without warning."
  
  - question: "How many bison almost went extinct?"
    answer: "American bison crashed from an estimated 60 million animals in the early 1800s to fewer than 1,000 by the 1890s—a 99.998% population decline in approximately 60 years. This catastrophic decline resulted from systematic slaughter promoted by federal policy to destroy the economic base of Plains Indian cultures. Today, approximately 500,000 bison exist in North America, though most live in commercial operations rather than conservation herds."
  
  - question: "What is the Tallgrass Prairie Preserve?"
    answer: "The Tallgrass Prairie Preserve in Osage County is the largest protected remnant of tallgrass prairie ecosystem, covering 39,650 acres. The Nature Conservancy established the preserve in the 1990s and introduced approximately 2,500 free-ranging bison to restore prairie ecology. The bison roam across unfenced prairie, fulfilling their historic role as keystone species shaping vegetation through grazing and movement. It represents one of North America's most significant prairie restoration projects."
  
  - question: "How did the Wichita Mountains Wildlife Refuge save bison?"
    answer: "The Wichita Mountains Wildlife Refuge, established in 1905 as one of America's first wildlife refuges, received 15 bison from the New York Zoological Society in 1907. These animals descended from the last wild bison captured in Montana in the 1880s. The refuge protected these bison and allowed the herd to grow, eventually providing foundation stock for restoration efforts throughout North America. Today, the refuge maintains approximately 650 bison on 59,020 acres."
  
  - question: "Why were bison almost eliminated?"
    answer: "American bison nearly went extinct between 1830 and 1890 through deliberate federal policy and commercial hunting. Military leaders explicitly promoted bison slaughter as strategy for conquering Plains tribes by destroying their food source and economic base. Commercial hunters killed millions for hides, leaving carcasses to rot. Railroads promoted hunting from trains as entertainment. By eliminating bison, the United States forced indigenous peoples onto reservations and ended resistance to westward expansion."
  
  - question: "Is Oklahoma's state name connected to Native Americans?"
    answer: "Yes, Oklahoma comes from Choctaw words 'okla' (people) and 'humma' (red), meaning 'red people.' The name reflects Oklahoma's history as Indian Territory where the federal government relocated tribes from eastern states during the 1800s. This connection makes the bison designation especially meaningful, as the species sustained many indigenous cultures before systematic destruction of both bison populations and Native American ways of life."

