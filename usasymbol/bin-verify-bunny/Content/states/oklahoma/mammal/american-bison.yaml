title: "Oklahoma State Animal | American Bison"
scientific_name: "Bison bison"
adopted_year: 1972

seo_title: "Oklahoma State Animal | American Bison"
seo_description: "Oklahoma's state animal is the American Bison, adopted in 1972. Learn why this official Oklahoma symbol was chosen and what it represents."

intro_text: "The American Bison is the official Oklahoma state animal, designated in 1972. This page gives the direct answer for searches like 'oklahoma state animal', 'oklahoma state animal', and 'oklahoma state mammal' while explaining how the symbol fits the state's official animal designations. Surviving near-extinction from 60 million to fewer than 1,000; central to Plains Indian cultures; symbol of conservation success and prairie restoration. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "American Bison"
official_since: "1972"
status: "Recovered from near-extinction; Oklahoma herds include approximately 2,500 at Tallgrass Prairie Preserve and 650 at Wichita Mountains Wildlife Refuge"
habitat_in_state: "Tallgrass prairie preserves, mixed-grass prairie, wildlife refuges; historically ranged throughout western and central Oklahoma"
known_for: "Surviving near-extinction from 60 million to fewer than 1,000; central to Plains Indian cultures; symbol of conservation success and prairie restoration"

size: "7 to 11.5 feet long; 5 to 6.5 feet tall at shoulder"
weight: "Males: 1,000-2,000 pounds; Females: 800-1,000 pounds; largest land mammals in North America"
coloration: "Dark brown to black woolly coat on head, neck, and forequarters; lighter brown on hindquarters; calves born orange-red, darkening by three months"
distinctive_traits: "Massive head with curved horns in both sexes; large shoulder hump; shaggy mane on head and shoulders; short tail with tuft; exceptional endurance and speed up to 40 mph"

habitat: "Tallgrass and mixed-grass prairie; can utilize diverse grasslands, woodlands, and riparian areas"
range_in_state: "Historically throughout much of Oklahoma; now confined to Tallgrass Prairie Preserve (Osage County), Wichita Mountains Wildlife Refuge (Comanche County), and smaller conservation herds"
conservation_status: "Recovered from near-extinction; approximately 500,000 bison in North America with most in commercial operations; wild conservation herds number approximately 20,000"
where_to_find: "Tallgrass Prairie Preserve near Pawhuska; Wichita Mountains Wildlife Refuge near Lawton; viewable from roads and designated overlooks"
symbol_connections: "Oklahoma means 'red people' in Choctaw; state's history as Indian Territory creates direct connection to Plains Indian bison culture; represents both indigenous heritage and conservation achievement"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Oklahoma Legislature designated the American bison as the official state animal in 1972, recognizing the species' cultural significance to Native American peoples and its near-extinction story. The designation honored Oklahoma's unique identity as former Indian Territory where Plains tribes maintained deep connections to bison and to [the Sooner State identity](/states/oklahoma/nickname/the-sooner-state)."
      - "The legislation came during a period when environmental consciousness and Native American rights movements brought renewed attention to indigenous cultures and wildlife conservation. Oklahoma's bison designation predated similar recognitions in other Great Plains states."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The campaign for bison designation emerged from Oklahoma's conservation community and educators who wanted to honor the state's prairie heritage and Native American connections. Advocates emphasized that Oklahoma means 'red people' in Choctaw language, reflecting the state's establishment as Indian Territory where the federal government relocated tribes from eastern states. Many of these tribes including Kiowa, Comanche, and Cheyenne had adopted Plains bison-hunting cultures after removal to Oklahoma lands. The Wichita Mountains Wildlife Refuge, established in 1905, had pioneered bison conservation by protecting one of the last wild herds. The Tallgrass Prairie Preserve, though not yet established in 1972, would later become the largest protected tallgrass prairie supporting free-ranging bison. Legislators from both parties supported the designation as symbol transcending political divisions."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the American bison because it embodied Oklahoma's complex identity connecting indigenous heritage, prairie ecosystems, near-catastrophic loss, and conservation redemption. No animal better represented the Great Plains before European-American settlement transformed the landscape. Bison sustained Plains cultures for thousands of years, providing food, shelter, tools, and spiritual meaning. The species' near-extinction through systematic slaughter paralleled the destruction of Native American cultures and ways of life. Oklahoma's position as Indian Territory—where the federal government confined tribes after forcing their removal from ancestral lands—made the bison especially meaningful. The designation acknowledged dark histories of genocide and environmental destruction while celebrating that both bison and indigenous peoples survived attempted elimination."

  - id: "state-symbolism"
    icon: "fa-mountain"
    title: "What the American Bison Represents"
    style: "highlight"
    paragraphs:
      - "The American bison symbolizes the Great Plains ecosystem and the Native American cultures that depended on it for millennia. Bison shaped prairie landscapes through grazing patterns and created conditions supporting hundreds of other species."
      - "The species embodies one of history's most dramatic conservation stories—from an estimated 60 million animals in the early 1800s to fewer than 1,000 by the 1890s, then recovery to approximately 500,000 today through dedicated protection."
      - "The designation in 1972 recognized Oklahoma's unique position as former Indian Territory where indigenous peoples maintained bison-centered cultures until forced sedentarization. The bison represents both cultural genocide and cultural survival, a context reinforced on [Oklahoma's state motto page](/states/oklahoma/motto/labor-omnia-vincit)."
    
    subsections:
      - subtitle: "Bison and Plains Indian Cultures"
        text: "For thousands of years before European contact, bison formed the foundation of Plains Indian cultures including tribes that would later be removed to Oklahoma. Native peoples including Kiowa, Comanche, Cheyenne, Arapaho, and others developed sophisticated hunting techniques, seasonal migration patterns, and spiritual relationships with bison. Hunters used every part of the animal—meat for food, hides for clothing and shelter, bones for tools and weapons, sinew for cordage, dried dung for fuel. The animals provided not just material resources but spiritual meaning and cultural identity. Tribes developed specific protocols for hunting, butchering, and distribution ensuring sustainability and honoring the animals' sacrifice. When the federal government forcibly removed eastern tribes to Indian Territory (Oklahoma), many including Osage, Cherokee, and others adopted bison hunting practices from existing Plains cultures. This adaptation demonstrated resilience and cultural exchange under colonial pressure."
      
      - subtitle: "The Systematic Destruction of the Bison"
        text: "The near-extinction of American bison between 1830 and 1890 represents one of history's most rapid wildlife destructions. An estimated 60 million bison ranged across North America in the early 1800s. By 1890, fewer than 1,000 remained. This catastrophic decline resulted from deliberate federal policy designed to destroy the economic base of Plains Indian cultures, forcing tribes onto reservations and ending resistance to westward expansion. Military leaders including General Philip Sheridan explicitly promoted bison slaughter as strategy for conquering Plains tribes. Commercial hunters killed millions for hides, leaving carcasses to rot on prairies. Railroads promoted hunting from train windows as tourist entertainment. The slaughter reached such intensity that bone collectors later gathered skeletal remains from prairies, shipping millions of tons to factories for fertilizer and industrial uses. By eliminating bison, the United States destroyed indigenous food sources, cultural practices, and economic independence."
      
      - subtitle: "Oklahoma as Indian Territory"
        text: "Oklahoma's identity as former Indian Territory creates unique context for the bison designation. The federal government established Indian Territory in the 1830s as destination for tribes forcibly removed from eastern states through policies including the Indian Removal Act of 1830. The Trail of Tears and similar forced relocations brought Cherokee, Choctaw, Chickasaw, Creek, and Seminole peoples (the Five Civilized Tribes) to Oklahoma, along with dozens of other tribes relocated from across the United States. Many removed tribes had not historically been Plains peoples but adapted to prairie environments and adopted bison hunting. The Osage, who controlled much of what became Oklahoma before removal policies, maintained strong bison-hunting traditions. When the federal government opened Indian Territory to white settlement in land runs beginning 1889, Oklahoma transformed from indigenous refuge to settler state. The bison designation acknowledges this contested history and the indigenous peoples who survived despite policies designed to eliminate them."
      
      - subtitle: "The Wichita Mountains Conservation Pioneers"
        text: "The Wichita Mountains Wildlife Refuge in southwestern Oklahoma played crucial role in preventing bison extinction. Established in 1905 as one of America's first wildlife refuges, the Wichita Mountains provided sanctuary for 15 bison transferred from the New York Zoological Society. These animals descended from the last wild bison in the United States, captured in Montana in the 1880s. The refuge's bison herd became foundation stock for numerous restoration efforts throughout North America. President Theodore Roosevelt, who had witnessed bison slaughter during his Dakota ranching years, strongly supported the refuge establishment. The arrival of the first bison at the Wichita Mountains by train in October 1907 marked symbolic moment in American conservation—the federal government that had promoted bison destruction now protected them. Today, the refuge maintains approximately 650 bison roaming 59,020 acres of mixed-grass prairie and mountains."
      
      - subtitle: "The Tallgrass Prairie Preserve Restoration"
        text: "The Tallgrass Prairie Preserve in Osage County represents one of North America's most significant prairie restoration projects. The Nature Conservancy acquired 39,650 acres of former ranchland in the Osage Hills during the 1990s, establishing the largest protected remnant of tallgrass prairie ecosystem that once covered 170 million acres from Canada to Texas. The preserve supports approximately 2,500 free-ranging bison—the largest conservation herd in the tallgrass prairie region. These bison fulfill their historic ecological role as keystone species shaping prairie vegetation through grazing, wallowing, and movement patterns. The herd roams across unfenced prairie, migrating seasonally and interacting with the landscape much as bison did before near-extinction. The preserve demonstrates that prairie restoration requires bison—the ecosystem evolved with large grazers and cannot maintain full diversity without them. Visitors can drive the preserve roads and observe bison displaying natural behaviors in one of the few places where the relationship between bison and prairie functions relatively intact."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify American Bison"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "American bison display massive builds designed for survival on open prairies. They rank as North America's largest land mammals, combining size with surprising speed and agility."
        list_items:
          - "**Size**: Body length 7-11.5 feet; shoulder height 5-6.5 feet; bulls significantly larger than cows"
          - "**Weight**: Males 1,000-2,000 pounds with exceptional individuals exceeding 2,000; females 800-1,000 pounds; calves born at 30-70 pounds"
          - "**Appearance**: Dark brown to black woolly coat on massive head, neck, and forequarters; lighter brown hair on hindquarters; large shoulder hump composed of muscle and vertebral spines; both sexes grow permanent curved horns"
          - "**Features**: Massive head appears disproportionately large; shaggy mane and beard on head and throat; short tail with dark tuft at end; cloven hooves; excellent senses of smell and hearing but relatively poor eyesight"
      
      - subtitle: "Seasonal Changes and Adaptations"
        text: "Bison undergo seasonal coat changes adapting to prairie temperature extremes. Summer coats appear shorter and lighter brown, shedding the heavy winter insulation. Winter coats grow thick and dark, providing protection against blizzards and subzero temperatures. Bison shed their winter coats in large patches during spring, often rubbing against trees, rocks, or fence posts to accelerate the process. The massive shoulder hump serves multiple functions—muscle attachment supporting the large head used for plowing through snow, fat storage for winter survival, and display feature during breeding competition. Bison possess remarkable cold tolerance, using their heads like snowplows to reach buried vegetation during winter. Their thick skulls and muscular necks enable them to sweep aside snow depths that would defeat other large mammals."
      
      - subtitle: "Behavior and Social Structure"
        text: "American bison form complex social structures changing seasonally. Females and young live in maternal herds led by dominant cows, while mature bulls remain solitary or form small bachelor groups outside breeding season. During the July-September rut, bulls join cow herds to compete for breeding access. Competition involves bellowing, pawing earth, wallowing, and head-to-head clashes that can inflict serious injuries. Despite their massive size, bison display surprising agility and speed, reaching 40 mph for short distances. They can jump obstacles over six feet high and swim rivers effectively. Bison show highly developed social bonds, with cows protecting calves cooperatively and herds closing ranks when threatened. Their apparently docile grazing behavior can shift instantly to aggression if humans approach too closely—bison injure more people in national parks than any other wildlife species."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "American Bison in Oklahoma"
    style: "default"
    paragraphs:
      - "American bison historically ranged throughout most of Oklahoma, particularly western and central regions where prairies dominated. The species disappeared from Oklahoma by the late 1800s during the continental near-extinction but returned through conservation programs in the early 1900s."
      - "Today, Oklahoma supports approximately 3,500 bison in conservation herds and private ranches. The two major conservation populations at Tallgrass Prairie Preserve and Wichita Mountains Wildlife Refuge provide opportunities for Oklahomans to observe bison in semi-natural conditions."
    
    facts:
      - "**Historic Range**: Throughout western and central Oklahoma prairies; less common in eastern forested regions; seasonal migrations followed grass growth patterns"
      - "**Current Conservation Herds**: Tallgrass Prairie Preserve (~2,500 bison on 39,650 acres); Wichita Mountains Wildlife Refuge (~650 bison on 59,020 acres)"
      - "**Private Operations**: Numerous Oklahoma ranches raise bison for meat production, education, and conservation; exact numbers difficult to determine"
      - "**Population Status**: Oklahoma's conservation herds represent some of the most significant wild bison populations in the Great Plains region"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See American Bison"
    style: "default"
    paragraphs:
      - "Viewing American bison in Oklahoma requires visits to specific conservation properties or wildlife refuges. Both major locations offer accessible viewing from vehicles, though observation success varies with herd movements across large landscapes."
    
    list_items:
      - "**Tallgrass Prairie Preserve (Near Pawhuska)**: Drive through 39,650 acres of restored prairie; bison roam freely across preserve; viewing success highest during cooler morning and evening hours; visitor center provides information about prairie ecology and bison restoration; preserve roads open dawn to dusk"
      - "**Wichita Mountains Wildlife Refuge (Near Lawton)**: Auto tour route passes through bison range; approximately 650 bison visible from roads though they roam across 59,020 acres; refuge also supports elk, longhorn cattle, and prairie dogs; visitor center offers exhibits on conservation history"
      - "**Oklahoma City Zoo**: Maintains bison exhibit providing guaranteed viewing and educational programs about Great Plains ecology; particularly valuable for those unable to visit remote prairies"
      - "**Woolaroc Museum and Wildlife Preserve (Near Bartlesville)**: Historic ranch with bison herd viewable along driving route; museum features extensive Native American and Western art collections"
      - "**Safety Considerations**: Bison are wild, unpredictable animals that injure or kill people who approach too closely; maintain minimum distance of 75-100 feet; never leave vehicles in posted areas; bison may charge with little warning"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Conservation"
    style: "default"
    paragraphs:
      - "American bison populations recovered dramatically from near-extinction but face ongoing conservation challenges. Approximately 500,000 bison exist in North America, yet most live in commercial meat production operations rather than functioning as wild populations."
      - "True conservation herds—those managed for ecological and genetic goals rather than commercial production—number only approximately 20,000 animals in scattered locations. Oklahoma's conservation herds at Tallgrass Prairie Preserve and Wichita Mountains represent significant portions of this conservation population."
    
    subsections:
      - subtitle: "Genetic Conservation Challenges"
        text: "Modern bison face complex genetic issues resulting from population bottlenecks and historical management practices. When bison populations crashed to fewer than 1,000 individuals in the 1890s, surviving animals included only a handful of genetic lineages. Early conservationists crossbred some bison with cattle in attempts to save the species, introducing domestic cattle genes into certain lineages. Today, genetic testing reveals that many bison herds contain cattle gene introgression, though debate continues about whether this matters for conservation goals. The Yellowstone bison herd represents the only continuously wild population never crossbred with cattle, making it genetically valuable. Oklahoma's conservation herds maintain relatively pure bison genetics with minimal cattle ancestry. Ongoing genetic management focuses on maintaining diversity, preventing inbreeding, and preserving distinct lineages representing different historical populations."
      
      - subtitle: "Ecological Restoration and Prairie Management"
        text: "Bison restoration connects directly to prairie ecosystem conservation. Tallgrass and mixed-grass prairies evolved with bison as dominant herbivores, and the ecosystems cannot function fully without large grazers. Bison grazing creates habitat heterogeneity—areas of close-cropped grass interspersed with taller vegetation—supporting diverse bird, insect, and plant communities. Their selective grazing favors native forbs over invasive species in some contexts. Wallowing behavior creates temporary ponds used by amphibians and insects. Bison movement distributes seeds and nutrients across landscapes. The Tallgrass Prairie Preserve uses bison grazing as management tool replacing fire and mechanical treatments. Research there demonstrates that bison restore ecological processes rather than simply existing as charismatic attraction. Oklahoma's conservation herds provide living laboratories for understanding prairie ecology and testing restoration techniques applicable to smaller preserves across the Great Plains."
      
      - subtitle: "Cultural Restoration and Tribal Connections"
        text: "Bison restoration has cultural dimensions beyond ecology, particularly in Oklahoma with 39 federally recognized tribes. Several Oklahoma tribes including Cheyenne and Arapaho Tribes and Comanche Nation have established their own bison herds on tribal lands, reconnecting with cultural practices interrupted by forced removal and bison extirpation. These tribal herds serve multiple purposes—cultural education for youth, food sovereignty through meat distribution to tribal members, spiritual renewal, and economic development through breeding stock sales. The InterTribal Buffalo Council, though headquartered in South Dakota, includes Oklahoma tribes working to restore bison to indigenous lands. Some tribal members advocate for much larger bison restorations creating space for indigenous peoples to resume traditional relationships with the animals. These restoration efforts acknowledge that saving bison ecology requires honoring indigenous knowledge and practices developed over millennia."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The American bison connects to other Oklahoma symbols through shared themes of prairie heritage, Native American culture, and the tension between preservation and development. The bison represents wildness and ecological integrity in a state known for oil production and agriculture, including habitats tied to [the redbud state tree](/states/oklahoma/tree/redbud)."
      - "The designation in 1972 joined other symbols celebrating Oklahoma's natural and cultural diversity. The state's history as Indian Territory makes the bison especially meaningful as symbol of indigenous heritage and survival, with aerial prairie parallels in [the Scissor-tailed Flycatcher profile](/states/oklahoma/bird/scissor-tailed-flycatcher)."
    
    subsections:
      
      - subtitle: "Scissor-Tailed Flycatcher"
        text: "Oklahoma's state bird, the scissor-tailed flycatcher (designated 1951), shares open habitats with bison on prairies and grasslands. This distinctive bird with extremely long tail feathers migrates to Oklahoma each spring, nesting in open country with scattered trees. Bison-grazed prairies provide ideal foraging habitat for flycatchers, which hawk insects from exposed perches. The flycatcher's graceful aerial displays and the bison's powerful presence represent different aspects of prairie life—delicate beauty and massive strength. Both symbols face challenges from habitat conversion as prairies continue disappearing under agricultural expansion and development."
        link:
          label: "See Oklahoma state bird"
          url: "/states/oklahoma/bird/scissor-tailed-flycatcher"
      
      - subtitle: "Redbud Tree and Prairie-Forest Transition"
        text: "Oklahoma's state tree, the redbud (designated 1937), grows in woodland edges and transition zones between prairie and forest. The eastern redbud produces brilliant pink-purple flowers in early spring before leaves emerge. Historically, bison influenced the prairie-forest boundary through grazing and fire interactions. Bison preferentially grazed grasslands, while their movement and fire regime limited tree expansion into prairies. The redbud thrives in edge conditions between these ecosystems. Together, the state tree and state animal represent the ecological transition characteristic of Oklahoma—neither fully prairie nor fully forest but a dynamic mixture influenced by climate, fire, grazing, and human management."
        link:
          label: "See Oklahoma state tree"
          url: "/states/oklahoma/tree/redbud"

