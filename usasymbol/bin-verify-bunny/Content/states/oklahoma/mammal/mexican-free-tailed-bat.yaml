faq:
  - question: "What is Oklahoma's state flying mammal?"
    answer: "Oklahoma's state flying mammal is the Mexican free-tailed bat (Tadarida brasiliensis), designated in 2006. This species migrates through Oklahoma annually with over 3 million bats summering at Selman Cave in Woodward County. The bats provide essential pest control services to Oklahoma agriculture by consuming tons of insects nightly."
  
  - question: "When was the Mexican free-tailed bat designated as Oklahoma's state flying mammal?"
    answer: "The Mexican free-tailed bat became Oklahoma's official state flying mammal on May 24, 2006. The designation recognized the millions of bats migrating through Oklahoma and the pest control services they provide to agriculture. The Selman Bat Cave, hosting over 3 million bats, provided focal point for the designation campaign."
  
  - question: "Why did Oklahoma choose the Mexican free-tailed bat?"
    answer: "Oklahoma chose the Mexican free-tailed bat because it provides measurable economic benefits to agriculture through pest control. Bats consume millions of pounds of agricultural pest insects including corn earworm moths and cotton bollworm moths, reducing crop damage and decreasing pesticide needs. The designation also acknowledged Oklahoma's position on major bat migration routes and the importance of protecting critical roost sites like Selman Cave."
  
  - question: "Where is Selman Bat Cave and can I visit?"
    answer: "Selman Bat Cave is located near Freedom in Woodward County in northwestern Oklahoma. The cave hosts over 3 million Mexican free-tailed bats during summer (May-September). Visitors can observe spectacular evening emergence flights from designated viewing areas maintained by the Selman Living Lab. The cave itself remains closed to entry to protect the maternity colony. Peak viewing occurs June through August."
  
  - question: "How do Mexican free-tailed bats help farmers?"
    answer: "Mexican free-tailed bats consume vast quantities of agricultural pest insects including moths, beetles, and other species that damage crops. Research indicates bats provide pest control services worth billions of dollars annually across the southern United States by eating insects before they can lay eggs on crops. This natural pest control reduces the need for pesticide applications, lowering costs for farmers while decreasing environmental contamination."
  
  - question: "What makes Mexican free-tailed bats special?"
    answer: "Mexican free-tailed bats are the fastest flying bats, reaching speeds up to 60 miles per hour. They undertake migrations of up to 1,000 miles between winter roosts in Mexico and summer breeding colonies in the United States. Individual bats can consume their body weight in insects nightly. They form some of the largest mammal aggregations on Earth, with colonies containing millions of individuals in single caves."
  
  - question: "Are Mexican free-tailed bats affected by White-Nose Syndrome?"
    answer: "No, Mexican free-tailed bats have shown no susceptibility to White-Nose Syndrome (WNS), a fungal disease that killed millions of other North American bat species. They avoid WNS through migratory behavior—wintering in warm Mexican caves rather than hibernating in cold caves where the fungus thrives. Their warmer body temperatures during rest also prevent fungal growth. This immunity makes them increasingly important for pest control as other bat populations decline."
  
  - question: "How many Mexican free-tailed bats live in Oklahoma?"
    answer: "Oklahoma's Mexican free-tailed bat population fluctuates seasonally. During summer maternity season (April-September), over 3 million bats occupy Selman Cave in Woodward County, making it Oklahoma's largest colony and one of the largest in North America. Additional smaller colonies exist in buildings, bridges, and other structures throughout the state. Bats migrate to Mexico for winter, so no permanent year-round population exists."
  
  - question: "Can I see bats emerging from Selman Cave?"
    answer: "Yes, the Selman Living Lab near Freedom provides designated viewing areas for observing evening bat emergence flights during summer months (May-September). Peak viewing occurs June through August when the maternity colony reaches maximum size. Millions of bats spiral from cave entrances in dense columns creating spectacular wildlife viewing. Visitors must observe from designated areas to avoid disturbing the colony."

