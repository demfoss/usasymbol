title: "Oklahoma State Flying Mammal | Mexican Free-tailed Bat"
scientific_name: "Tadarida brasiliensis"
adopted_year: 2006

seo_title: "Oklahoma State Flying Mammal | Mexican Free-tailed Bat"
seo_description: "Oklahoma's state flying mammal is the Mexican Free-tailed Bat, adopted in 2006. Learn why this official Oklahoma symbol was chosen and what it represents."

intro_text: "The Mexican Free-tailed Bat is the official Oklahoma state flying mammal, designated in 2006. This page gives the direct answer for searches like 'oklahoma state flying mammal', 'oklahoma state animal', and 'oklahoma state mammal' while explaining how the symbol fits the state's official animal designations. Consuming tons of insects nightly; spectacular evening emergence flights from caves; fastest horizontal flight speed of any bat species reaching 60 mph. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Mexican Free-tailed Bat"
official_since: "2006"
status: "Locally abundant during migration; Oklahoma's largest bat colonies include Selman Bat Cave with over 3 million bats seasonally"
habitat_in_state: "Caves and abandoned structures during summer breeding season; migrates through Oklahoma during spring and fall; roosts in Selman Cave, buildings, bridges"
known_for: "Consuming tons of insects nightly; spectacular evening emergence flights from caves; fastest horizontal flight speed of any bat species reaching 60 mph"

size: "3.5 to 4.5 inches body length; 11 to 13 inches wingspan"
weight: "0.4 to 0.5 ounces (11 to 14 grams); among smallest Oklahoma mammals"
coloration: "Dark brown to grayish-brown fur; lighter underside; wrinkled lips and short, velvety fur"
distinctive_traits: "Tail extends beyond tail membrane (free-tailed); narrow wings for fast flight; distinctive musky odor; high-pitched echolocation calls audible to some humans"

habitat: "Caves during summer maternity season; also uses buildings, bridges, and other structures; requires high ceilings and warm temperatures for colonies"
range_in_state: "Northwestern Oklahoma during summer breeding season; migration corridors throughout state during spring northward movement and fall southward movement"
conservation_status: "Stable but vulnerable to roost disturbance; White-Nose Syndrome has not affected this species; relies on large cave systems including Selman Cave in Woodward County"
where_to_find: "Selman Bat Cave near Freedom (evening emergence flights May-September); Lake Hefner bat colony in Oklahoma City; various bridges and buildings throughout state"
symbol_connections: "Agricultural pest control worth millions annually; represents cave ecosystem conservation; Selman Cave designated Natural Area protecting largest bat colony between Carlsbad Caverns and Mammoth Cave"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Oklahoma Legislature designated the Mexican free-tailed bat as the official state flying mammal on May 24, 2006. The designation recognized the millions of bats migrating through Oklahoma annually and the pest control services they provide to agriculture within [the Sooner State context](/states/oklahoma/nickname/the-sooner-state)."
      - "The legislation came after years of advocacy by conservation groups, educators, and bat researchers who wanted to increase public appreciation for bats and protect critical roosting sites. The Selman Bat Cave in Woodward County, hosting over 3 million bats, provided focal point for the designation campaign."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The campaign for Mexican free-tailed bat designation emerged from Oklahoma's conservation community and the Selman Living Lab, a research and education facility near the bat cave. Educators emphasized that bats consumed millions of pounds of insects annually, providing free pest control services to farmers worth substantial economic value. Wildlife biologists documented that Oklahoma's bat colonies represented crucial stopover points along migration routes connecting winter roosts in Mexico to summer breeding grounds across the southern United States. Representative Danny Hilliard from Woodward County championed the legislation, emphasizing local pride in hosting one of North America's largest bat colonies. Conservation groups including the Nature Conservancy supported designation as opportunity to educate Oklahomans about bat ecology and combat negative perceptions from folklore and disease fears."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the Mexican free-tailed bat because it provided measurable economic benefits to Oklahoma agriculture while requiring conservation attention. Bats consume vast quantities of agricultural pest insects including corn earworm moths, cotton bollworm moths, and other species causing millions in crop damage. Research indicated that bat predation reduced pest populations significantly, decreasing pesticide needs and increasing yields. The species also demonstrated Oklahoma's position on major ecological migration routes connecting Mexican wintering grounds to breeding territories throughout the southern Great Plains. The designation acknowledged that valuable wildlife often goes unappreciated—bats work nightly providing services people take for granted. By honoring the Mexican free-tailed bat, Oklahoma recognized that ecosystem services matter as much as aesthetic appeal in conservation priorities."

  - id: "state-symbolism"
    icon: "fa-moon"
    title: "What the Mexican Free-Tailed Bat Represents"
    style: "highlight"
    paragraphs:
      - "The Mexican free-tailed bat symbolizes the hidden ecological services nature provides to human economies. These bats consume tons of insects nightly throughout Oklahoma's agricultural regions, reducing crop damage without pesticides or human intervention."
      - "The species embodies the phenomenon of migration connecting ecosystems across international boundaries. Oklahoma's summer bat populations winter in Mexican caves, demonstrating that wildlife conservation requires cooperation transcending political borders."
      - "The designation in 2006 recognized that conservation involves protecting species people might fear or misunderstand. Bats face cultural prejudices from folklore, yet they provide measurable benefits deserving protection and appreciation, reflecting themes on [Oklahoma's state motto page](/states/oklahoma/motto/labor-omnia-vincit)."
    
    subsections:
      - subtitle: "Agricultural Pest Control Services"
        text: "Mexican free-tailed bats provide extraordinary pest control services to Oklahoma agriculture. Individual bats consume their body weight in insects nightly—approximately half an ounce of moths, beetles, and other agricultural pests. A colony of 3 million bats at Selman Cave consumes roughly 25 tons of insects nightly during peak season. Research in Texas calculated that Mexican free-tailed bats provide pest control services worth over $1 billion annually to that state's cotton industry alone by consuming cotton bollworm moths before they lay eggs damaging crops. Similar benefits occur in Oklahoma where bats prey on corn earworm moths, armyworm moths, stink bugs, and other pests affecting wheat, corn, soybeans, and cotton. This natural pest control reduces pesticide applications, lowering costs for farmers while decreasing environmental contamination from chemical applications."
      
      - subtitle: "Selman Cave: Oklahoma's Bat Capital"
        text: "Selman Bat Cave in Woodward County hosts one of North America's largest bat colonies with over 3 million Mexican free-tailed bats during summer maternity season. The cave extends over 18 miles through gypsum formations, providing ideal roosting conditions including stable temperatures, high humidity, and extensive ceiling surface area where bats cluster densely. Female bats arrive in spring, give birth to single pups in June, and nurse young through summer before migrating south in fall. Males either remain in Mexico year-round or migrate separately from maternity colonies. The Nature Conservancy and Oklahoma Department of Wildlife Conservation protect the cave through land acquisition and access restrictions. The Selman Living Lab near the cave provides education about bat ecology, cave systems, and conservation. Evening emergence flights during summer attract visitors who watch millions of bats spiraling from cave entrances in dense columns extending skyward before dispersing across the landscape to forage."
      
      - subtitle: "The Great Continental Migration"
        text: "Mexican free-tailed bats undertake one of North America's longest mammal migrations, traveling up to 1,000 miles between winter roosts in Mexico and summer breeding colonies throughout the southern United States. Oklahoma sits along major migration corridors, with bats passing through the state during spring northward movement (March-May) and fall southward return (September-October). Migration occurs at high altitudes often exceeding 10,000 feet where bats ride tailwinds to conserve energy during long-distance flights. Researchers using radio telemetry and banding studies documented that individual bats show remarkable site fidelity, returning to the same summer caves and winter roosts year after year despite traveling hundreds of miles. This migration pattern creates conservation challenges because protecting bats requires international cooperation—caves in Oklahoma, Texas, and New Mexico provide summer maternity roosts, while caves in Mexico provide winter hibernacula. Threats to roosts in any part of the range affect entire populations."
      
      - subtitle: "Cave Ecosystems and Guano Mountains"
        text: "Mexican free-tailed bat colonies transform cave ecosystems through guano (bat droppings) accumulation. At Selman Cave, centuries of occupation created guano deposits several feet deep in some chambers. This guano supports unique cave ecosystems where specialized invertebrates including beetles, mites, and crickets feed on guano and fungi growing in the nutrient-rich substrate. Guano microbes break down insect parts, recycling nutrients through cave food webs. Historically, humans mined bat guano from caves for fertilizer and gunpowder production—guano contains high nitrogen concentrations valuable for agriculture and saltpeter needed for explosives. Some Oklahoma caves show evidence of commercial guano mining operations during the late 1800s and early 1900s. Modern conservation recognizes that guano mining disturbs bat colonies and removes nutrients essential to cave ecosystems, so such extraction no longer occurs in protected caves."
      
      - subtitle: "Speed Champions of the Bat World"
        text: "Mexican free-tailed bats achieve the fastest horizontal flight speeds documented for any bat species, reaching approximately 60 miles per hour during migration. Their narrow, pointed wings and streamlined bodies create efficient aerodynamics for rapid flight. High-speed flight allows bats to cover large foraging territories nightly—individuals may travel 50 miles or more from roosts to feeding areas, returning before dawn. This flight capability also enables the extraordinary migration distances these bats accomplish. The bats' speed requires exceptional navigational abilities and echolocation systems operating at high frequencies. They emit ultrasonic calls typically ranging from 25-50 kHz, though calls vary based on flight context. Researchers discovered that Mexican free-tailed bats flying in dense swarms during cave emergence modify their echolocation calls to reduce acoustic interference from thousands of other bats vocalizing simultaneously."

  - id: "identification"
    icon: "fa-wind"
    title: "How to Identify Mexican Free-Tailed Bats"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Mexican free-tailed bats display compact bodies with narrow wings adapted for fast, efficient flight. The distinctive free tail extending beyond the tail membrane creates their common name."
        list_items:
          - "**Size**: Body length 3.5-4.5 inches; wingspan 11-13 inches; among Oklahoma's smaller bat species but larger than some insectivorous bats"
          - "**Weight**: 0.4-0.5 ounces (11-14 grams); approximately the weight of four pennies"
          - "**Appearance**: Dark brown to grayish-brown fur with short, velvety texture; lighter grayish underside; wrinkled lips creating distinctive facial appearance; large ears meeting at midline"
          - "**Features**: Tail extends approximately half its length beyond tail membrane (uropatagium); narrow, pointed wings for rapid flight; small eyes; prominent nostrils; distinctive musky scent noticeable near large colonies"
      
      - subtitle: "Flight Adaptations"
        text: "The Mexican free-tailed bat's morphology reflects specialization for fast, long-distance flight. Their wings show high aspect ratio—long and narrow—creating aerodynamic efficiency for rapid travel and extended migration. This wing shape contrasts with broad-winged forest bats that maneuver slowly through dense vegetation. The free tail extending beyond the tail membrane may assist with flight control and stability during high-speed aerial maneuvers. Their small body size relative to wing area allows efficient flight at high speeds while maintaining maneuverability for capturing insects. Large pectoral muscles power the wings during sustained flight. The bats' heart rate during flight can exceed 1,000 beats per minute, supporting the metabolic demands of rapid movement and frequent echolocation calls."
      
      - subtitle: "Behavior and Roosting Ecology"
        text: "Mexican free-tailed bats exhibit highly social behavior, forming dense colonies that may contain millions of individuals. Within maternity colonies, females cluster together with densities reaching 300 bats per square foot of ceiling surface. This crowding generates warmth helping maintain stable temperatures for developing pups. Mothers give birth to single pups in June after approximately 77-day gestation periods. Remarkably, mothers returning from nightly foraging locate their own pups among millions by memory of roost location and recognition of pup vocalizations and scent. Pups begin flying at about five weeks old, joining adults on foraging flights by late summer. Emergence from caves occurs around dusk in spectacular displays—bats exit in dense streams visible on weather radar, spiraling upward before dispersing. This coordinated emergence may confuse predators including hawks and owls that hunt bats during emergence."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Mexican Free-Tailed Bats in Oklahoma"
    style: "default"
    paragraphs:
      - "Mexican free-tailed bats occupy Oklahoma primarily during summer maternity season from April through September. The species concentrates in northwestern Oklahoma where gypsum caves provide ideal maternity roost conditions."
      - "Oklahoma's bat population contributes to broader regional populations spanning from Mexico through Texas, Oklahoma, Kansas, and other southern states. The state's position along migration routes makes Oklahoma important stopover location for bats traveling between winter and summer ranges."
    
    facts:
      - "**Primary Colony**: Selman Bat Cave in Woodward County hosts over 3 million bats seasonally—Oklahoma's largest colony and one of the largest in North America"
      - "**Migration Pattern**: Present April-September for summer breeding; absent during winter months when populations migrate to Mexico"
      - "**Other Roosts**: Urban bat colonies use buildings and bridges in Oklahoma City, Tulsa, and other municipalities; abandoned structures throughout northwestern Oklahoma"
      - "**Foraging Range**: Individual bats may travel 50+ miles nightly from roosts to feeding areas across agricultural regions"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Mexican Free-Tailed Bats"
    style: "default"
    paragraphs:
      - "Observing Mexican free-tailed bats requires visiting active roosts during evening emergence flights. The spectacular emergence from large caves creates unforgettable wildlife viewing experiences."
    
    list_items:
      - "**Selman Bat Cave (Near Freedom)**: Oklahoma's premier bat viewing location; evening emergence flights May-September feature millions of bats spiraling from cave; Selman Living Lab provides interpretation; viewing area maintains safe distance protecting bats; peak viewing occurs June-August during maternity season"
      - "**Lake Hefner (Oklahoma City)**: Urban bat colony roosts in structures near lake; visible during evening flights over water; accessible viewing from public areas"
      - "**Bridge Colonies**: Various highway bridges throughout Oklahoma host smaller colonies; evening observation shows bats emerging to forage over nearby water and fields"
      - "**Safety and Ethics**: Never enter caves during bat season (April-September); human disturbance causes colony abandonment and pup mortality; observe from designated viewing areas; avoid using flash photography; respect closure periods protecting maternity colonies"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Conservation"
    style: "default"
    paragraphs:
      - "Mexican free-tailed bats maintain stable populations in Oklahoma though they face conservation challenges including roost disturbance, pesticide exposure, and climate change impacts. The species has not been affected by White-Nose Syndrome, a fungal disease devastating other bat species."
      - "Conservation focuses on protecting critical roosts including caves, bridges, and buildings supporting large colonies. The Nature Conservancy's acquisition of Selman Cave secured Oklahoma's most important bat habitat."
    
    subsections:
      - subtitle: "White-Nose Syndrome Immunity"
        text: "Mexican free-tailed bats have shown no susceptibility to White-Nose Syndrome (WNS), a fungal disease that killed millions of North American bats since first detection in 2006. WNS affects hibernating bats in cold caves, causing fungal growth on faces and wings, disrupting hibernation, and leading to death from starvation and dehydration. Mexican free-tailed bats likely avoid WNS through their migratory behavior—they winter in warm Mexican caves rather than hibernating in cold caves where the fungus thrives. Additionally, their body temperature during rest periods remains warmer than temperatures supporting fungal growth. While WNS devastated populations of little brown bats, Indiana bats, and other species, Mexican free-tailed bats continued thriving. This immunity makes the species increasingly important to agricultural pest control as other insectivorous bat populations decline."
      
      - subtitle: "Conservation Threats and Challenges"
        text: "Despite avoiding White-Nose Syndrome, Mexican free-tailed bats face other conservation challenges. Cave disturbance during maternity season causes colony abandonment and pup mortality—disturbed mothers drop pups from ceilings where they die. Commercial cave tours, spelunking, and vandalism threaten roost sites. Pesticide exposure affects bats directly through contaminated insects and indirectly by reducing prey abundance. Some agricultural pesticides cause sublethal effects including disorientation and weakened immune systems. Wind energy development creates collision hazards during migration, though impacts remain poorly quantified. Climate change may alter migration timing, affect prey availability, and shift suitable habitat ranges. Urban colonies face building modifications eliminating roost access. Conservation requires protecting both summer caves in Oklahoma and winter caves in Mexico through international cooperation."
      
      - subtitle: "The Economic Value of Ecosystem Services"
        text: "Research quantifying the economic value of bat pest control services strengthens conservation arguments by demonstrating bats' practical benefits. Studies in Texas estimated Mexican free-tailed bats save cotton farmers over $1 billion annually by consuming bollworm moths. Similar research across the southwestern United States calculated total agricultural pest control services from all bat species at $22 billion annually. Oklahoma's agricultural economy receives substantial benefits from the millions of bats consuming crop pests nightly. These ecosystem services occur without cost to farmers and without environmental impacts from pesticide applications. Conservation biologists argue that protecting bat colonies represents sound economic investment—the cost of protecting caves and roosting sites proves far less than losses farmers would experience without natural pest control. This economic framing helps gain support from agricultural interests who might otherwise oppose wildlife conservation measures affecting land use."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Mexican free-tailed bat connects to other Oklahoma symbols through themes of agricultural economy, international connections, and utilitarian relationships with wildlife. The bat provides measurable economic services supporting the same agricultural industries that shape Oklahoma's landscape and economy, including zones tied to [the redbud state tree](/states/oklahoma/tree/redbud)."
      - "The designation as state flying mammal rather than simply state bat acknowledges the bat's remarkable flight capabilities. These bats represent nature's engineering marvels adapted for speed, efficiency, and endurance."
    
    subsections:
      - subtitle: "Agricultural Economy and Pest Control"
        text: "The Mexican free-tailed bat's pest control services directly support Oklahoma's agricultural economy. Oklahoma farms produce wheat, cotton, corn, soybeans, and other crops vulnerable to insect pest damage. Bats consuming moths, beetles, and other agricultural pests reduce the need for pesticide applications, lowering production costs while decreasing environmental contamination. This relationship demonstrates that wildlife conservation and agricultural productivity complement rather than conflict with each other. The bat designation acknowledges that protecting natural predators of agricultural pests represents sound economic policy. This pragmatic approach to conservation reflects Oklahoma's agricultural heritage and frontier mentality valuing practical solutions over purely aesthetic considerations."
        
      
      - subtitle: "Scissor-Tailed Flycatcher: Aerial Insectivores"
        text: "Oklahoma's state bird, the scissor-tailed flycatcher (designated 1951), shares ecological role with Mexican free-tailed bats as aerial insectivore controlling pest populations. Flycatchers hunt during daylight hours, capturing insects in flight with remarkable agility. Bats hunt nocturnally using echolocation rather than vision. Together, these species provide 24-hour pest control—flycatchers during day, bats during night. Both require abundant flying insects to sustain populations, indicating that Oklahoma's ecosystems support robust insect communities despite agricultural intensification. The state bird and state flying mammal together symbolize Oklahoma's biological diversity and the ecological services that flying insectivores provide throughout the state."
        link:
          label: "See Oklahoma state bird"
          url: "/states/oklahoma/bird/scissor-tailed-flycatcher"

