  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Flag Facts"
    facts:
      - "Oklahoma approved the Osage shield design that still anchors the flag on April 2, 1925"
      - "Louise Funk Fluke designed the flag after winning a 1924 contest"
      - "The flag features an Osage war shield with six crosses"
      - "The word Oklahoma was added to the flag in 1941"
      - "Colors and shapes were standardized by law on November 1, 2006"
      - "The blue field was chosen to match the Choctaw battle flag"

faq:
  - question: "What design is recognized as the state flag of Oklahoma?"
    answer: "The state flag of Oklahoma is the official banner of Oklahoma, featuring an Osage war shield with a peace pipe and olive branch on a sky blue field."

  - question: "What does Oklahoma's flag look like?"
    answer: "The flag shows a tan Osage war shield with six crosses and seven eagle feathers on a blue field. A peace pipe and olive branch cross on top of the shield. The word Oklahoma appears below in white letters."

  - question: "What meaning is attached to Oklahoma's flag?"
    answer: "The flag represents peace and unity between Native Americans and European settlers in Oklahoma. The Osage shield shows protection while the pipe and olive branch symbolize peace."

  - question: "How do historians explain the symbolism of Oklahoma's flag?"
    answer: "The flag means peace through unity. It combines Native American symbols with European symbols to show different cultures united in Oklahoma."

  - question: "When was the present Oklahoma flag approved in law?"
    answer: "The flag displays an Osage war shield, six crosses, seven eagle feathers, a peace pipe, an olive branch, and the word Oklahoma."

  - question: "How is Oklahoma's flag usually described?"
    answer: "The Osage Nation's war shield appears on the Oklahoma flag."

  - question: "How would you describe the design of the Oklahoma state flag?"
    answer: "Oklahoma adopted its current flag design on April 2, 1925."

