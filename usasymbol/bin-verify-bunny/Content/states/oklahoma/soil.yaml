- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Port Soil
  paragraphs:
  - "Winter wheat is the signature crop of Port soil. Oklahoma is one of the top winter wheat-producing states in the country, and the deep, moisture-retaining Port floodplain soils produce higher and more reliable yields than the surrounding red clay uplands. The Washita and Canadian river valleys have grown wheat continuously since the late 1800s."
  - "Cotton was the other historic crop. Before mechanization, Port soil bottomlands along the Red River tributaries were planted heavily in cotton by tenant farmers and sharecroppers through the first half of the twentieth century. Today cotton still grows in the irrigated bottomlands of Jackson and Tillman counties."
  - "Grain sorghum and alfalfa are important modern crops. Alfalfa performs especially well on Port soil — the deep, fine-textured profile holds enough moisture between cuttings to support three or four harvests per season without irrigation in normal rainfall years."
  - "Where Port soil floodplains remain unfarmed, the native vegetation is cottonwood-willow bottomland forest — Plains cottonwood, sandbar willow, pecan, and green ash along the river channels, with tallgrass prairie bluestem and switchgrass on the terrace margins."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Port Soil Facts
  facts:
  - "Port soil is classified as a fine-silty, mixed, superactive, thermic Cumulic Haplustoll — a Mollisol with a cumulic (extra-thick) mollic epipedon built by repeated alluvial deposition. The 'thermic' designation means the soil averages between 15°C and 22°C annually, placing it in the warm semi-arid zone of the southern Great Plains."
  - "The mollic epipedon in Port soil is typically more than twenty-four inches thick — far exceeding the sixteen-inch minimum required to qualify as mollic. The thickness reflects thousands of years of flood-deposited organic silt that added dark material faster than decomposition could remove it."
  - "Port soil sits on the same river systems that sustained Indigenous peoples for thousands of years. The Wichita and Affiliated Tribes farmed corn, beans, and squash on the Washita and Canadian River bottomlands centuries before European contact. The rich alluvial soils made these valleys the agricultural heartland of the southern plains."
  - "The Land Runs that opened Oklahoma Territory beginning in 1889 were partly driven by the known fertility of the river valley soils. Settlers who staked claims on Port soil floodplains had significant agricultural advantages over those who drew upland red clay plots — a fact widely understood before the starting gun."
  - "The Dust Bowl of the 1930s devastated the red clay upland farms of western Oklahoma, but Port soil floodplains suffered less because the heavier silt-clay texture resisted wind erosion better than the sandy upland soils. River valley farms on Port soil were among the first to recover."

