faq:
- question: What is Oklahoma's state soil?
  answer: "Oklahoma's state soil is the Port series, a deep, dark Mollisol found on the floodplains and river terraces of western Oklahoma. It formed from silty alluvium deposited by rivers over thousands of years and has a thick, nearly black surface horizon rich in organic matter."
- question: Why is it called Port soil?
  answer: "The Port series is named after Port, Oklahoma, a community in Blaine County in western Oklahoma. USDA soil scientists name soil series after nearby towns, streams, or geographic features located near where the series was first described and mapped."
- question: What color is Port soil?
  answer: "The surface and upper subsoil are very dark grayish brown to nearly black from organic matter — one of the darkest surface colors of any Oklahoma soil. The color gradually lightens with depth to dark yellowish brown, then yellowish brown in the alluvial layers below. The deepest layers are light yellowish brown stratified river sediments."
- question: Where is Port soil found in Oklahoma?
  answer: "Port soil is found on the floodplains and stream terraces of rivers in western and southwestern Oklahoma. It is most extensive along the Washita River, Canadian River, and North Fork of the Red River, primarily in Blaine, Caddo, Washita, Greer, Kiowa, Jackson, and Tillman counties."
- question: What grows in Port soil?
  answer: "Winter wheat is the primary crop, followed by grain sorghum, alfalfa, and cotton. Where bottomlands stay unfarmed, Plains cottonwood, pecan, sandbar willow, and green ash form the native forest. Tallgrass prairie species including big bluestem and switchgrass grow on the terrace margins."
- question: What makes Port soil so dark?
  answer: "Port soil is dark because it is a Mollisol — a soil order defined by a thick, organic-rich surface horizon called the mollic epipedon. In Port soil, the mollic epipedon is typically more than two feet thick, built by thousands of years of flood-deposited organic silt that accumulated faster than decomposition removed it."
- question: How deep is Port soil?
  answer: "Port soil is very deep — the USDA classification describes it as having no limiting layer within 60 inches. The dark mollic surface alone runs 24 inches or deeper. Below it, stratified river alluvium continues for many more feet, providing excellent rooting depth for deep-rooted crops like alfalfa and winter wheat."

