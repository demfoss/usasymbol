sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Oklahoma's State Steak?"
    paragraphs:
      - "The ribeye is Oklahoma's official state steak, designated by the Oklahoma Legislature in 2019. It is cut from the rib section of the cow and is known for heavy marbling."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Ribeye"
    paragraphs:
      - "A ribeye steak comes from the rib primal of the cow, the same muscle used in a standing rib roast. It carries more internal fat, or marbling, than many other cuts, which keeps it juicy and flavorful when grilled or pan-seared."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Ribeye Became Oklahoma's State Steak"
    paragraphs:
      - "The Oklahoma Legislature designated the ribeye the official state steak in 2019."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oklahoma Chose the Ribeye"
    paragraphs:
      - "Cattle ranching has been central to Oklahoma's economy and identity since the era of cattle drives across the state in the 1800s, and Oklahoma remains a major beef producing state today. The ribeye designation reflects that ranching heritage rather than one restaurant or recipe."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Ribeye Facts"
    facts:
      - "Adopted as Oklahoma's state steak in 2019."
      - "The ribeye is cut from the rib section of the cow."
      - "Oklahoma has a long history of cattle ranching dating back to the 1800s."
      - "Oklahoma remains one of the country's major cattle producing states."

