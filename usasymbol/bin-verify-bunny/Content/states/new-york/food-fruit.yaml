date_modified: '2026-07-30'
seo_title: "New York State Fruit | Apple"
seo_description: "New York's state fruit is the apple, adopted in 1976, grown across the state's orchards in the Hudson Valley and beyond."
hero_image: /images/foods/new-york/new-york-state-fruit-hero.webp
hero_image_alt: "Red apples on a tree branch in an orchard."
hero_image_caption: "The apple, New York's official state fruit."
intro_text: "New York's state fruit is the apple, adopted in 1976 to recognize one of the state's oldest and largest fruit crops. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is New York's State Fruit?"
    paragraphs:
      - "The apple is New York's official state fruit, designated by the New York State Legislature in 1976. New York is one of the top apple-producing states in the country, with orchards found from the Hudson Valley to the shores of Lake Ontario."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Apple"
    paragraphs:
      - "Apples are round tree fruits that grow in a wide range of colors and flavors, from tart to sweet. New York's cool climate and lake-effect regions are well suited to growing many varieties, including McIntosh and Empire, a variety developed in the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Apple Became New York's State Fruit"
    paragraphs:
      - "The New York State Legislature designated the apple the official state fruit in 1976."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New York Chose the Apple"
    paragraphs:
      - "Apple growing has been part of New York's agriculture since colonial times, and the state remains one of the country's leading apple producers, with major orchard regions in the Hudson Valley, the Lake Ontario shore, and western New York."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Apple Comes From in New York"
    paragraphs:
      - "The Hudson Valley and the region along Lake Ontario near Wolcott and Sodus are among New York's most productive apple-growing areas."
    sites:
      - name: Lake Ontario apple region
        city: Sodus
        lat: 43.24
        lng: -76.98
        note: "Major New York apple-growing region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Apple Facts"
    facts:
      - "Adopted as New York's state fruit in 1976."
      - "New York is one of the top apple-producing states in the country."
      - "The Empire apple variety was developed in New York."

