sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is New York's State Snack?"
    paragraphs:
      - "Yogurt is New York's official state snack, designated by the New York State Legislature in 2014. New York produces more yogurt than any other state in the country."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Yogurt"
    paragraphs:
      - "Yogurt is made by fermenting milk with live bacterial cultures, which thickens the milk and gives it a tangy flavor. Greek yogurt, a thicker style strained to remove extra liquid, has become especially popular and is produced at large scale by New York dairy processors."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Yogurt Became New York's State Snack"
    paragraphs:
      - "The New York State Legislature designated yogurt the official state snack in 2014."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New York Chose Yogurt"
    paragraphs:
      - "New York has led the nation in yogurt production, driven largely by the growth of Greek yogurt makers in the state, including Chobani, founded in New Berlin, New York, in 2005. The state's dairy farms supply the milk that supports this large yogurt processing industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Yogurt Comes From in New York"
    paragraphs:
      - "New Berlin, in central New York, is home to Chobani, one of the country's largest Greek yogurt producers, founded there in 2005."
    sites:
      - name: Chobani
        city: New Berlin
        lat: 42.6112
        lng: -75.3357
        note: "Founding location of Chobani Greek yogurt"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Yogurt Facts"
    facts:
      - "Adopted as New York's state snack in 2014."
