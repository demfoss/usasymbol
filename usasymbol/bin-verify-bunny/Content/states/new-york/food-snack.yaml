faq:
  - question: "What is New York's state snack?"
    answer: "New York's state snack is yogurt, adopted by the New York State Legislature in 2014."
  - question: "When did New York adopt yogurt as its state snack?"
    answer: "The New York State Legislature designated yogurt the official state snack in 2014."
  - question: "Why did New York choose yogurt?"
    answer: "New York produces more yogurt than any other state, driven by a large Greek yogurt industry built on the state's dairy farms."
  - question: "Is yogurt still produced in New York today?"
    answer: "Yes, New York remains the nation's top yogurt producing state, with major processors including Chobani based there."

