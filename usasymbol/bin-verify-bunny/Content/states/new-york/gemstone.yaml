sections:
  - id: overview
    icon: fa-solid fa-gem
    title: New York State Gem
    paragraphs:
      - "Garnet is New York's official state gem, designated by the state legislature in 1969. The deep wine-red variety mined at Gore Mountain in the Adirondacks is considered the hardest garnet in the world, and the mine there ranks among the largest garnet deposits anywhere."
      - "Lawmakers picked garnet because of that single deposit's scale and quality, not because the mineral is unique to New York. Few other states can point to a mining operation as large or as long-running."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Garnet?"
    paragraphs:
      - "Garnet is a group of silicate minerals sharing the same cubic crystal structure but varying in color depending on their exact chemistry. New York's Gore Mountain garnet is almandine, a deep wine-red variety, and it forms as large, well-formed crystals embedded in dark host rock."
      - "Because garnet is hard and does not cleave easily, crushed garnet has long served as an industrial abrasive for sandpaper and polishing compounds. Gem-quality crystals, cut and faceted, are prized separately for jewelry."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New York Chose Garnet as Its State Gem"
    paragraphs:
      - "Gore Mountain's garnet deposit set New York apart almost as soon as it was discovered. Henry Hudson Barton began mining almandine there in 1878 for use as an abrasive, and the operation grew into what became known as the world's largest garnet mine."
      - "The crystals found at Gore Mountain are unusually large and hard, prized both by industry and by collectors for their deep color. That combination of scale, quality, and a mining history stretching back more than a century made garnet a fitting choice for the state gem."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Garnet Became New York's State Gem"
    paragraphs:
      - "Governor Nelson Rockefeller signed the legislation naming garnet New York's official state gem in 1969, formally recognizing a mineral already tied to nearly a century of Adirondack mining."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Garnet Is Found in New York"
    paragraphs:
      - "Gore Mountain, near North Creek in Warren County, has been mined for garnet since 1878. Barton Mines shifted operations to nearby Ruby Mountain in the early 1980s, and the original Gore Mountain site now hosts public mine tours."
    sites:
      - name: Gore Mountain Garnet Mine
        city: North Creek
        lat: 43.6765
        lng: -74.0351
        note: "One of the world's largest garnet mines"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Garnet Facts"
    facts:
      - "Adopted as New York's state gem in 1969."
      - "Henry Hudson Barton began mining garnet at Gore Mountain in 1878."
      - "Gore Mountain almandine garnet is considered the hardest variety of garnet found anywhere."
      - "Barton Mines moved its operation from Gore Mountain to nearby Ruby Mountain in the early 1980s, after more than a century at the original site."

