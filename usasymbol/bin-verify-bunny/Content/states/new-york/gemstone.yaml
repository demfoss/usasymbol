faq:
  - question: What is New York's state gem?
    answer: "New York's state gem is garnet, a deep wine-red mineral adopted by the state legislature in 1969."
  - question: When did New York adopt garnet as its state gem?
    answer: "Governor Nelson Rockefeller signed legislation designating garnet the official state gem in 1969."
  - question: Why did New York choose garnet?
    answer: "The Gore Mountain deposit in the Adirondacks has produced unusually large, hard, deep-red garnet since 1878, growing into one of the largest garnet mines in the world."
  - question: Where can you find garnet in New York?
    answer: "Gore Mountain, near North Creek in Warren County, is New York's best-known garnet site and still offers public mine tours today."

