faq:
- question: What is New York's state soil?
  answer: "New York's state soil is the Honeoye series, a deep, well-drained Alfisol formed in limestone-rich glacial till. It covers the rolling uplands of the Finger Lakes region and Genesee Valley in western and central New York, where it grows corn, hay, apples, and grapes."
- question: Why is it called Honeoye soil?
  answer: "The Honeoye series is named after Honeoye Lake in Ontario County, New York. USDA soil scientists name soil series after nearby towns, lakes, streams, or geographic features located near where the soil was first described and mapped."
- question: What color is Honeoye soil?
  answer: "The surface layer is dark brown from organic matter in the loam. Below it is a pale brown eluvial layer where nutrients have washed out. The argillic subsoil is yellowish brown to light yellowish brown from accumulated clay and iron. The deepest layer is olive gray calcareous glacial till."
- question: Where is Honeoye soil found in New York?
  answer: "Honeoye soil is found on the gently rolling uplands of western and central New York, primarily in the Finger Lakes region and Genesee Valley. It is most extensive in Ontario, Wayne, Livingston, Monroe, Yates, Seneca, Cayuga, and Tompkins counties."
- question: What grows in Honeoye soil?
  answer: "Corn, hay, soybeans, and winter wheat are the main field crops. Apples and grapes are the signature tree and vine crops, particularly on Finger Lakes hillsides where the lakes moderate frost dates. Where Honeoye land stays forested, sugar maple, American beech, and yellow birch are the dominant trees."
- question: Who chose Honeoye as New York's state soil?
  answer: "The Soil Science Society of America recognizes the Honeoye series as New York's state soil, based on its widespread distribution across the state's most productive agricultural land and its representation of the glacial Alfisol soils that define New York's farming regions."
- question: What makes Honeoye soil distinctive?
  answer: "Honeoye soil is built on calcareous glacial till — till so rich in limestone that the deepest layer fizzes when acid is applied. The limestone came from bedrock ground up by glaciers moving south from Canada. This calcium-rich parent material gives Honeoye its near-neutral pH and its high base saturation, both of which make it more fertile than most glacial soils in the northeastern United States."

