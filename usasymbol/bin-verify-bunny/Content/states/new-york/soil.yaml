- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Honeoye Soil
  paragraphs:
  - "Corn and hay are the dominant crops on Honeoye soil. The deep, well-drained loam holds moisture long enough for corn to reach maturity in a region where the growing season is shorter than in the Midwest. Alfalfa and mixed hay perform especially well on the neutral-to-slightly-acidic Honeoye profile."
  - "Apples are the signature tree crop. New York is one of the top apple-producing states in the country, and the Finger Lakes counties — sitting on Honeoye and related Alfisols — account for much of that output. The well-drained, calcareous subsoil gives apple roots the depth and drainage they require."
  - "Grapes grow on Honeoye and nearby soils along the slopes above the Finger Lakes, where lake effect moderation extends the growing season. Riesling, Chardonnay, and Concord are the main varieties. Soybeans and winter wheat are also grown in rotation with corn across the Genesee Valley."
  - "Where Honeoye soil is not farmed, the natural vegetation is northern hardwood forest — sugar maple, American beech, yellow birch, and basswood — the same mix that painted the hills of the Finger Lakes orange and yellow before European settlement."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Honeoye Soil Facts
  facts:
  - "The Honeoye series is named after Honeoye Lake in Ontario County, New York — one of the smaller of the eleven Finger Lakes, whose Seneca name is sometimes translated as 'finger lying.' USDA soil scientists follow the convention of naming series after nearby geographic landmarks."
  - "Honeoye is classified as a fine-loamy, mixed, active, mesic Glossic Hapludalf — an Alfisol with an argillic clay-enriched subsoil formed in glacial till in a cool, humid climate zone (mesic means the soil averages 8–15°C annually)."
  - "The calcareous glacial till that forms Honeoye's parent material contains fragments of Silurian and Devonian limestone from bedrock formations in Ontario and central New York. When a vinegar or dilute acid is applied to the deep C horizon, it fizzes visibly from the carbonate reaction."
  - "The same glaciation that created Honeoye soil also carved the Finger Lakes by deepening north-south river valleys. The lakes now moderate climate temperatures on adjacent slopes, extending the frost-free season and making Finger Lakes hillsides among the northernmost viable grape-growing regions in the eastern United States."
  - "Honeoye soil is recognized by the Soil Science Society of America as the official state soil of New York, representing the Alfisol soil order that dominates New York's agricultural regions and the glacial till parent material that underlies most of the state west of the Hudson Valley."

