author: USA Symbol Team
date_published: '2026-07-30'
date_modified: '2026-07-30'
seo_title: "Washington State Amphibian | Pacific Tree Frog"
seo_description: "Washington's state amphibian is the Pacific tree frog, adopted in 2007. Learn what it looks like and why it became official."
hero_image: /images/amphibians/washington/washington-state-amphibian-hero.webp
hero_image_alt: "A small green Pacific tree frog with a dark eye stripe clinging to a leaf."
hero_image_caption: "The Pacific tree frog, Washington's state amphibian, is known for its loud, familiar call."
intro_text: "Washington's state amphibian is the Pacific tree frog, a small frog known for its loud call and found across the state, adopted in 2007. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Washington?
    paragraphs:
      - "The Pacific tree frog is Washington's official state amphibian, designated by the Washington Legislature in 2007. Its scientific name is Pseudacris regilla."
      - "It is a small, common frog found in wetlands, forests, and even backyards throughout the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Pacific Tree Frog
    paragraphs:
      - "The Pacific tree frog is small, usually under 2 inches long, and can be green, brown, or reddish, often changing shade depending on its surroundings."
      - "It has a dark stripe running through each eye and sticky toe pads that help it climb plants and leaves."
      - "Its loud, distinctive call is one of the most familiar frog sounds in Washington, often heard in movies and television even when the scene is set elsewhere."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Washington Legislature designated the Pacific tree frog the official state amphibian in 2007, following an effort led by students to give Washington an official state amphibian."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Washington Chose the Pacific Tree Frog
    paragraphs:
      - "The Pacific tree frog was chosen because it is one of the most common and recognizable frogs in Washington, found in nearly every county across the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Pacific Tree Frog
    paragraphs:
      - "Pacific tree frogs live throughout Washington, from coastal wetlands and forests west of the Cascades to ponds and streams east of the mountains."
    sites:
      - name: Puget Sound wetlands
        city: Olympia
        lat: 47.04
        lng: -122.90
        note: "Common statewide habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Pacific Tree Frog Facts
    facts:
      - "Adopted in 2007 by the Washington Legislature."
      - "Chosen after an effort led by students to name a state amphibian."
      - "Can change color between green, brown, and reddish shades."
      - "Grows to less than 2 inches long."
      - "Has one of the most recognizable frog calls in the state."

