sections:
  - id: overview
    icon: fa-solid fa-music
    title: Washington State Song
    paragraphs:
      - "\"Washington, My Home\" is Washington's official state song, adopted in 1959. Helen Gordon Davis wrote the lyrics and Stuart Churchill set them to music, and lawmakers chose the song after it won the state's 1953 territorial centennial song competition."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Washington, My Home\" Explained"
    paragraphs:
      - "The song is a warm, patriotic tribute to Washington's forests, fields, and mountains, opening with the line that gives it its title. It carries a steady, hymn-like tempo suited to group singing at civic and school events."
      - "Helen Davis originally wrote an earlier version of the song in 1951 under a different title, then rewrote the lyrics and renamed it \"Washington, My Home\" to enter the 1953 centennial competition marking a century since Washington Territory split from Oregon Territory. Stuart Churchill arranged the music for the version that became official."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Washington, My Home" Represents Washington
    paragraphs:
      - "The song's imagery of forests, fields, and mountains reflects the landscape most associated with Washington, from its evergreen coastline to the Cascades. Its warmth and simplicity made it an easy fit for a state song meant to be sung by students and civic groups."
      - "The song also carried the credibility of a statewide competition behind it, having already won recognition during Washington's 1953 centennial before lawmakers made it official six years later. Governor Albert Rosellini signed the bill with Davis present, a detail that tied the song's adoption directly to its author."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Washington, My Home\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Washington, My Home" Became Washington's State Song
    paragraphs:
      - "The Washington Legislature adopted \"Washington, My Home\" as the official state song in 1959, nearly six years after the song won the state's 1953 centennial competition. The House approved it 89 to 5 and the Senate approved it unanimously, and Governor Albert Rosellini signed the bill with Helen Davis in attendance."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Washington

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Washington, My Home\" Facts"
    facts:
      - "Washington adopted \"Washington, My Home\" as its official state song in 1959."
      - "Helen Gordon Davis wrote the lyrics, and Stuart Churchill arranged the music."
      - "The song won Washington's 1953 territorial centennial song competition."
      - "The state House approved the song 89 to 5, with a unanimous Senate vote."
      - "Washington also recognizes \"Roll On, Columbia, Roll On\" by Woody Guthrie as its official state folk song."

