sections:
  - id: overview
    icon: fa-solid fa-music
    title: Washington State Dance
    paragraphs:
      - "Washington named square dance its official state dance in 1979, ahead of the wider wave of states that followed with similar designations over the next two decades. The choice reflected the dance's long presence in the state's rural grange halls."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance places four couples in a square, each pair facing the center. A caller announces each figure just ahead of time, letting dancers respond without memorizing a routine."
      - "A string band carries the music, typically fiddle, guitar, and banjo, keeping a brisk, steady tempo. Dancers briefly exchange partners during certain figures before returning to their own partner to finish the set."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Stand with your partner facing the center of the square, joined by three other couples on the remaining sides."
      - title: "Honor Your Partner"
        description: "Bow or nod to your partner as the caller signals the start of the figure."
      - title: "Circle Right with the Group"
        description: "Join hands with everyone in the square and move together in the direction the caller calls."
      - title: "Allemande Left with Your Corner"
        description: "Take the hand of the dancer on your left, walk a full turn, then release."
      - title: "Promenade Back to Place"
        description: "Take your partner's hands and walk together around the set until you return to your starting position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Washington
    paragraphs:
      - "A national campaign by square dance callers' associations pushed states throughout the 1970s and beyond to adopt the dance as an official symbol. Washington acted early, naming square dance its official state dance in 1979, well ahead of most other states that later followed."
      - "Washington's rural communities built grange halls that hosted square dance nights for decades, giving the dance a practical foothold long before the legislature made it official. That grange hall culture connected the designation to an activity Washingtonians already gathered for."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Washington's Dance
    paragraphs:
      - "Washington designated square dance its official state dance in 1979, making it one of the earliest states to grant square dance that specific title before many other states followed in later years."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Washington adopted square dance as its official state dance in 1979."
      - "Washington was among the earliest states to name square dance its official state dance."
      - "Washington's rural grange halls hosted square dance nights for decades before the designation."
      - "A caller announces each figure aloud, so dancers respond without memorizing a set routine."
      - "The dance is performed in a set of four couples arranged in a square."

