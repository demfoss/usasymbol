faq:
  - question: What is Florida's state gem?
    answer: "Florida's state gem is moonstone, a translucent feldspar gem known for its soft, glowing blue-white sheen."
  - question: When did Florida adopt moonstone as its state gem?
    answer: "The Florida Legislature designated moonstone the official state gem in 1970."
  - question: Why did Florida choose moonstone?
    answer: "Lawmakers chose moonstone to commemorate the 1969 Apollo 11 moon landing, which launched from the Kennedy Space Center on Florida's east coast."
  - question: Is moonstone found in Florida?
    answer: "No. Moonstone does not occur naturally in Florida; the legislature chose it for its name rather than for any local deposit."

