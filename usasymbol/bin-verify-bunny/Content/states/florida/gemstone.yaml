seo_title: "Florida State Gem | Moonstone"
seo_description: "Florida's state gem is moonstone, adopted in 1970 to honor the Apollo 11 moon landing launched from Kennedy Space Center. The stone is not found in Florida."
hero_image: /images/gemstones/florida/florida-state-gemstone-hero.webp
