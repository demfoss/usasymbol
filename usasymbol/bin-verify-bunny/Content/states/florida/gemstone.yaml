hero_image_caption: "Moonstone, Florida's official state gem, was chosen to honor the Apollo 11 moon landing rather than for any Florida deposit."
intro_text: "Florida's state gem is moonstone, adopted in 1970 to commemorate the Apollo 11 moon landing, launched the year before from the Kennedy Space Center on Florida's Space Coast. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Florida State Gem
    paragraphs:
      - "Moonstone is Florida's official state gem, designated by the Florida Legislature in 1970. Unlike most state gemstones, it was not chosen for any deposit found within the state. Lawmakers picked it purely for its name, one year after Apollo 11 astronauts walked on the moon."
      - "Florida's claim to the moon landing came through geography rather than geology. Every Apollo mission launched from the Kennedy Space Center on Florida's east coast, and the state wanted a symbol that pointed back to that achievement."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Moonstone?"
    paragraphs:
      - "Moonstone is a variety of feldspar, most often orthoclase or a closely related plagioclase, known for a soft, glowing sheen called adularescence. The effect comes from thin, alternating internal layers of two feldspar minerals that scatter light as the stone is turned, producing a floating blue-white glow rather than a sparkle."
      - "Gem-quality moonstone is usually cut as a smooth, rounded cabochon rather than faceted, since cutting flat facets would interrupt the sheen. The best specimens are nearly colorless and transparent, letting the internal glow show clearly."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Florida Chose Moonstone as Its State Gem"
    paragraphs:
      - "In 1970, less than a year after Neil Armstrong and Buzz Aldrin became the first people to walk on the moon, Florida lawmakers wanted a lasting symbol tied to that achievement. Every Apollo mission, including Apollo 11, launched from the Kennedy Space Center in Brevard County, giving Florida a direct connection to the event."
      - "Moonstone's name made it the obvious symbolic choice, even though the gem has no geological link to Florida or the moon itself. The designation is one of the more openly symbolic state gemstone choices in the country, chosen for what the name evokes rather than for a local deposit."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Moonstone Became Florida's State Gem"
    paragraphs:
      - "The Florida Legislature passed the bill naming moonstone the state gem in May 1970, timed to honor the Apollo 11 landing of July 1969 and the Kennedy Space Center's role in launching it."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Moonstone Facts"
    facts:
      - "Adopted as Florida's state gem in 1970."
      - "Every Apollo moon mission, including Apollo 11, launched from the Kennedy Space Center in Brevard County, Florida."
      - "Moonstone does not occur naturally in Florida; it was chosen entirely for its name."
      - "Moonstone's glow, called adularescence, comes from light scattering off internal layers within the feldspar crystal."

