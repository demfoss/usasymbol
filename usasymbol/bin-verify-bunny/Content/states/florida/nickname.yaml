seo_title: "Florida State Nickname | The Sunshine State"
seo_description: "Florida is known as The Sunshine State, its official state nickname. Learn why the name fits and what other nicknames the state has used."
intro_text: "Florida's official nickname is the Sunshine State. The Florida Legislature made it official in 1970, cementing a label that had already been showing up on license plates for years — the Legislature simply made permanent what the state had already decided for itself. The nickname fits: Florida leads the continental United States in average annual sunshine, and the image of warmth, beaches, and outdoor escape has defined how the rest of the country - and much of the world - pictures the state.


  But the Sunshine State is more than a weather report. It became Florida's dominant public identity because it captures something broader: the promise of a different kind of life. Sun, water, tourism, retirement, theme parks, and year-round outdoor living all fold into two words. No other nickname Florida has ever carried came close to doing that.
 This profile appears in the [list of U.S. state nicknames](/symbols/nicknames).
  "
