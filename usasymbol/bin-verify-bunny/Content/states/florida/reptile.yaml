hero_image_caption: "The American alligator, Florida's state reptile, is one of the most recognized animals in the state."
intro_text: "Florida's state reptile is the American alligator, a large predator found throughout the state's wetlands, adopted in 1987. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Florida?
    paragraphs:
      - "The American alligator is Florida's official state reptile, designated by the Florida Legislature in 1987. Its scientific name is Alligator mississippiensis."
      - "It is one of the largest reptiles in North America and is found throughout Florida's rivers, lakes, swamps, and marshes."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Alligator
    paragraphs:
      - "The American alligator has thick, armored dark gray to black skin, a broad rounded snout, and powerful jaws lined with sharp teeth."
      - "Adult males can grow to well over 10 feet long, making the alligator one of the largest animals found in Florida's wetlands."
      - "It spends much of its time floating low in the water with only its eyes and nostrils visible, and it can move quickly on land over short distances."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Florida Legislature designated the American alligator the official state reptile in 1987, formally recognizing an animal long associated with the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Florida Chose the American Alligator
    paragraphs:
      - "The American alligator is found throughout Florida's wetlands and is one of the state's most recognized native animals, making it a natural choice as the official state reptile."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Alligator
    paragraphs:
      - "The American alligator lives throughout Florida's freshwater and brackish wetlands, with especially large populations in the Everglades in the southern part of the state."
    sites:
      - name: Everglades National Park
        city: Homestead
        lat: 25.29
        lng: -80.90
        note: "Major alligator habitat in south Florida"
        type: primary

  - id: facts
