faq:
  - question: What is Florida's state reptile?
    answer: "Florida's state reptile is the American alligator, adopted by the Florida Legislature in 1987."
  - question: When did Florida adopt the American alligator?
    answer: "The Florida Legislature designated the American alligator the official state reptile in 1987."
  - question: Why did Florida choose the American alligator?
    answer: "It is found throughout Florida's wetlands and is one of the state's most recognized native animals, making it a fitting state symbol."
  - question: Is the American alligator a turtle, snake, lizard, or alligator?
    answer: "It is an alligator, a large reptile related to crocodiles that lives in Florida's freshwater wetlands."

