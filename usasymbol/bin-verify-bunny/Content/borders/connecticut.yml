sections:
  - id: states-border
    icon: "fa-solid fa-map"
    title: "Which States Border Connecticut?"
    paragraphs:
      - "Connecticut shares its borders with three U.S. states: [Massachusetts](https://usasymbol.com/states/massachusetts) to the north, Rhode Island to the east, and New York to the west. Despite being one of the smallest states, Connecticut's location makes it a key connector in the New England region."
    subsections:
      - id: "border-massachusetts"
        subtitle: "North: Massachusetts"
        paragraphs:
          - "Massachusetts and Connecticut are separated by a border located on Connecticut's northern edge. The state line runs roughly east-west across the top of Connecticut, from [Rhode Island](https://usasymbol.com/states/rhode-island) in the east to New York in the west."
          - "The Connecticut-Massachusetts border extends for about 90 miles. Connecticut counties along this border include Litchfield, Hartford, Tolland, and Windham. On the Massachusetts side, border counties include Berkshire, Hampden, Hampshire, Franklin, and Worcester. Major cities near this border include Springfield, Massachusetts and Hartford, Connecticut."
        bullets:
          - "About 90 miles east-west"
          - "Connecticut counties: Litchfield, Hartford, Tolland, Windham"
          - "Near major cities: Springfield (MA), Hartford (CT)"
      
      - id: "border-rhode-island"
        subtitle: "East: Rhode Island"
        paragraphs:
          - "Rhode Island and [Connecticut](https://usasymbol.com/states/connecticut) are separated by a border located on Connecticut's eastern edge. This boundary runs roughly north-south from Massachusetts in the north to Long Island Sound in the south."
          - "The Connecticut-Rhode Island border extends for about 45 miles, making it Connecticut's shortest state border. Only two Connecticut counties touch this border: Windham in the north and New London in the south. On the Rhode Island side, Washington and Kent counties sit along the border. The Pawcatuck River forms part of this boundary."
        bullets:
          - "About 45 miles north-south (shortest border)"
          - "Connecticut counties: Windham, New London"
          - "Pawcatuck River forms part of border"
      
      - id: "border-new-york"
        subtitle: "West: New York"
        paragraphs:
          - "[New York](https://usasymbol.com/states/new-york) and Connecticut are separated by a border located on Connecticut's western edge. The boundary runs roughly north-south from Massachusetts in the north to Long Island Sound in the south."
          - "The Connecticut-New York border extends for about 90 miles. Connecticut counties along this border include Litchfield, Fairfield, and New Haven. On the New York side, Dutchess, Putnam, and Westchester counties sit along the border. Major cities near this border include Stamford, Greenwich, and Danbury in Connecticut, and White Plains and Yonkers in New York."
        bullets:
          - "About 90 miles north-south"
          - "Connecticut counties: Litchfield, Fairfield, New Haven"
          - "Near major cities: Stamford, Greenwich, Danbury (CT)"

  - id: long-island-sound
    icon: "fa-solid fa-water"
    title: "Long Island Sound: Connecticut's Southern Border"
    paragraphs:
      - "Long Island Sound forms Connecticut's entire southern boundary, providing about 96 miles of coastline. This body of water separates Connecticut from New York's Long Island and connects to the Atlantic Ocean. The Sound serves as a major shipping route and recreational area, with important ports in New Haven, Bridgeport, and Norwalk. Connecticut's coastline along the Sound includes numerous harbors, beaches, and estuaries."

  - id: smallest-borders
    icon: "fa-solid fa-ruler"
    title: "Small State, Strategic Location"
    paragraphs:
      - "Connecticut is the third-smallest state by area in the U.S., which means its borders are relatively short compared to most states. The entire state measures only about 90 miles from north to south and 110 miles from east to west. Despite its small size, Connecticut's position between Boston and New York City has made it historically important for trade and transportation."

  - id: key-facts
    icon: "fa-solid fa-table"
    title: "Key Facts & Statistics"
    paragraphs:
      - "This table shows every border Connecticut shares, organized by direction and type."
    table:
      columns:
        - "Neighbor"
        - "Direction"
        - "Type"
        - "Key Features"
      rows:
        - neighbor: "Massachusetts"
          direction: "North"
          type: "Land"
          key_features: "About 90 miles east-west"
        - neighbor: "Rhode Island"
          direction: "East"
          type: "Land"
          key_features: "About 45 miles (shortest), Pawcatuck River"
        - neighbor: "New York"
          direction: "West"
          type: "Land"
          key_features: "About 90 miles north-south"
        - neighbor: "Long Island Sound"
          direction: "South"
          type: "Water"
          key_features: "About 96 miles of coastline"
    facts:
      - "Connecticut borders exactly three U.S. states"
      - "The Rhode Island border is Connecticut's shortest at about 45 miles"
      - "Long Island Sound provides about 96 miles of coastline"
      - "Connecticut is the third-smallest state by area"
      - "The state measures about 90 miles north-south and 110 miles east-west"
      - "Connecticut is not landlocked because it borders Long Island Sound"

faq:
  - question: "What borders Connecticut?"
    answer: "Connecticut borders three states and Long Island Sound. Massachusetts borders to the north, Rhode Island to the east, New York to the west, and Long Island Sound to the south."
  - question: "What state borders Connecticut?"
    answer: "Three states border Connecticut: Massachusetts (north), Rhode Island (east), and New York (west)."
  - question: "What state borders Connecticut on the north?"
    answer: "Massachusetts borders Connecticut on the north. The border runs east-west for about 90 miles from Rhode Island to New York."
  - question: "What state borders Connecticut on the east?"
    answer: "Rhode Island borders Connecticut on the east. This is Connecticut's shortest border at about 45 miles, and the Pawcatuck River forms part of the boundary."
  - question: "What state borders Connecticut on the west?"
    answer: "New York borders Connecticut on the west. The border runs north-south for about 90 miles from Massachusetts to Long Island Sound."
  - question: "What ocean borders Connecticut?"
    answer: "Long Island Sound borders Connecticut to the south. The Sound is part of the Atlantic Ocean and provides about 96 miles of coastline for Connecticut."
  - question: "Is Connecticut landlocked?"
    answer: "No, Connecticut is not landlocked. It has about 96 miles of coastline along Long Island Sound, which connects to the Atlantic Ocean."

