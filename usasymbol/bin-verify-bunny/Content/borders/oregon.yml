seo_description: "Oregon borders Washington, Idaho, Nevada, and California, with the Pacific Ocean to the south."
intro_text: "Oregon borders four states: Washington to the north, Idaho to the east, Nevada to the southeast, and California to the south. The Pacific Ocean forms Oregon's entire western boundary. The Columbia River creates most of the northern border with Washington, while the Snake River marks part of the eastern boundary with Idaho."

