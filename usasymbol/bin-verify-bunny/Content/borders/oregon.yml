faq:
  - question: "What states border Oregon?"
    answer: "Four states border Oregon: Washington (north), Idaho (east), Nevada (southeast), and California (south)."
  
  - question: "What borders Oregon?"
    answer: "Oregon borders four states and the Pacific Ocean. Washington borders to the north (mostly across the Columbia River), Idaho to the east, Nevada to the southeast, California to the south, and the Pacific Ocean to the west."
  
  - question: "What ocean borders Oregon?"
    answer: "The Pacific Ocean borders Oregon along its entire western coast, providing about 363 miles of scenic coastline."
  
  - question: "What state borders Oregon to the south?"
    answer: "California borders Oregon to the south. The boundary follows the 42nd parallel north latitude for about 365 miles from the Pacific Ocean to Nevada."
  
  - question: "What river borders Washington and Oregon?"
    answer: "The Columbia River borders Washington and Oregon. This major river forms about 300 miles of the northern boundary between the states, flowing from the inland region to the Pacific Ocean."
  
  - question: "Which northwestern state borders Idaho and Oregon?"
    answer: "Washington is the northwestern state that borders both Idaho and Oregon. Washington sits north of Oregon and west of Idaho in the Pacific Northwest."
  
  - question: "What city borders Oregon and California?"
    answer: "No major city sits directly on the Oregon-California border, but several cities are near it. Brookings, Oregon is the southernmost coastal city in Oregon, located just a few miles from California. Medford and Klamath Falls are larger Oregon cities within 20-60 miles of the California border."
  
  - question: "Which river borders both Oregon and Washington?"
    answer: "The Columbia River borders both Oregon and Washington, forming the boundary between the states for about 300 miles. The river is the largest in the Pacific Northwest."

