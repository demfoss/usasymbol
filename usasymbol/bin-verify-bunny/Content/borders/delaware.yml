faq:
  - question: "What borders Delaware?"
    answer: "Delaware borders two states and two major water bodies. Pennsylvania borders to the north, Maryland to the west and south, the Atlantic Ocean to the east, and Delaware Bay to the northeast."
  - question: "What state borders Delaware?"
    answer: "Two states border Delaware: Pennsylvania (north) and Maryland (west and south)."
  - question: "How many states border Delaware?"
    answer: "Two states border Delaware, making it one of only three states with exactly two neighbors."
  - question: "What state borders Delaware on the north?"
    answer: "Pennsylvania borders Delaware on the north. The border features the unique Twelve-Mile Circle, the only circular state border in the United States."
  - question: "What state borders Delaware on the west?"
    answer: "Maryland borders Delaware on the west and also wraps around to border Delaware on the south."
  - question: "What major body of water borders Delaware?"
    answer: "Two major water bodies border Delaware: the Atlantic Ocean along the eastern coast (about 28 miles) and Delaware Bay along the northeastern coast (about 50 miles)."
  - question: "Does Delaware border New Jersey?"
    answer: "No, Delaware does not share a land border with New Jersey. However, New Jersey sits across Delaware Bay from Delaware, separated by water."
  - question: "What is the Twelve-Mile Circle?"
    answer: "The Twelve-Mile Circle is Delaware's unique northern border with Pennsylvania. It's a perfect circular arc with a 12-mile radius centered on the New Castle Court House, making it the only circular state border in the United States."

