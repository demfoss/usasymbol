intro_text: "Delaware borders two states: Pennsylvania to the north and Maryland to the west and south. The state also meets the Atlantic Ocean along its eastern coast and Delaware Bay to the northeast. Delaware's northern border with Pennsylvania includes the unique Twelve-Mile Circle, a rare circular border arc."

