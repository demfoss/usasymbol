faq:
  - question: "What states border Pennsylvania?"
    answer: "Six states border Pennsylvania: New York (north), New Jersey (east), Delaware (southeast), Maryland (south), West Virginia (southwest), and Ohio (west)."
  
  - question: "What borders Pennsylvania?"
    answer: "Pennsylvania borders six states and Lake Erie. New York borders to the north, New Jersey to the east, Delaware to the southeast, Maryland to the south, West Virginia to the southwest, Ohio to the west, and Lake Erie to the northwest."
  
  - question: "What great lake borders Pennsylvania?"
    answer: "Lake Erie is the only Great Lake that borders Pennsylvania. The lake provides about 51 miles of shoreline in Pennsylvania's northwestern corner, making it the shortest Great Lakes coastline of any bordering state."
  
  - question: "Which state borders Pennsylvania to the north?"
    answer: "New York borders Pennsylvania to the north. This boundary runs about 300 miles from Lake Erie in the west to the Delaware River in the east."
  
  - question: "What state borders Pennsylvania to the southwest?"
    answer: "West Virginia borders Pennsylvania to the southwest. This boundary extends about 160 miles and includes portions of the Ohio River."
  
  - question: "What river borders New Jersey and Pennsylvania?"
    answer: "The Delaware River borders New Jersey and Pennsylvania. This river forms the entire 130-mile eastern boundary between the two states, flowing from New York to Delaware."
  
  - question: "What part of Pennsylvania borders New York?"
    answer: "The northern part of Pennsylvania borders New York along a roughly 300-mile east-west line. This includes Pennsylvania's entire northern tier of counties from Lake Erie in the west to the Delaware River in the east."
  
  - question: "How did Pennsylvania get its borders?"
    answer: "Pennsylvania's borders came from colonial charters, surveys, and negotiations. The Mason-Dixon Line (southern border with Maryland) was surveyed 1763-1767 to settle disputes. The Delaware River forms a natural eastern border. Other borders were established through colonial land grants and later state agreements in the 1700s and 1800s."

