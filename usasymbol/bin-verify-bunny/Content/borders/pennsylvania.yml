seo_title: "Pennsylvania Borders | Map, States & Facts"
seo_description: "Pennsylvania borders New York, New Jersey, Delaware, Maryland, West Virginia, and Ohio. Pennsylvania also borders Lake Erie."
intro_text: "Pennsylvania borders six states: New York to the north, New Jersey to the east, Delaware to the southeast, Maryland to the south, West Virginia to the southwest, and Ohio to the west. Lake Erie provides Pennsylvania with Great Lakes access in the northwest corner. The Delaware River forms the entire eastern border with New Jersey, while the Mason-Dixon Line marks the southern boundary with Maryland."

