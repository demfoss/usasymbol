faq:
  - question: "What borders New Hampshire?"
    answer: "New Hampshire borders three states, one Canadian province, and the Atlantic Ocean. Maine borders to the east, Massachusetts to the south, Vermont to the west (across the Connecticut River), Quebec (Canada) to the north, and the Atlantic Ocean to the southeast."
  - question: "What state borders New Hampshire?"
    answer: "Three states border New Hampshire: Maine (east), Massachusetts (south), and Vermont (west)."
  - question: "What river borders Vermont and New Hampshire?"
    answer: "The Connecticut River forms the entire border between Vermont and New Hampshire, running about 275 miles from Quebec to Massachusetts. The entire river belongs to New Hampshire up to the low-water mark on the Vermont shore."
  - question: "What ocean borders New Hampshire?"
    answer: "The Atlantic Ocean borders New Hampshire along its southeastern coast for about 18 miles, making it the shortest ocean coastline of any U.S. coastal state."
  - question: "How long is New Hampshire's coastline?"
    answer: "New Hampshire has approximately 18 miles of Atlantic Ocean coastline, the shortest of any coastal state in the U.S."
  - question: "What country borders New Hampshire?"
    answer: "Canada borders New Hampshire through the province of Quebec along the 45th parallel north for about 58 miles."
  - question: "Is New Hampshire landlocked?"
    answer: "No, New Hampshire is not landlocked. It has about 18 miles of Atlantic Ocean coastline, though this is the shortest ocean coastline of any U.S. coastal state."

