sections:
  - id: states-border
    icon: "fa-solid fa-map"
    title: "Which States Border New Hampshire?"
    paragraphs:
      - "New Hampshire shares its borders with three U.S. states: [Maine](https://usasymbol.com/states/maine) to the east, Massachusetts to the south, and Vermont to the west. The Connecticut River forms New Hampshire's entire western boundary with Vermont."
    subsections:
      - id: "border-maine"
        subtitle: "East: Maine"
        paragraphs:
          - "Maine and [New Hampshire](https://usasymbol.com/states/new-hampshire) are separated by a border located on New Hampshire's eastern edge. The boundary runs roughly north-south from Quebec in the north to the Atlantic Ocean in the south."
          - "The New Hampshire-Maine border extends for about 180 miles. The border includes both the Salmon Falls River and Piscataqua River in the south, then continues as a land boundary through forests and mountains in the north. New Hampshire counties along this border include Rockingham, Strafford, Carroll, and Coos. Portsmouth, New Hampshire and Kittery, Maine sit across from each other at the southern end where the border meets the ocean."
        bullets:
          - "About 180 miles north-south"
          - "Rivers in south, land border in north"
          - "New Hampshire counties: Rockingham, Strafford, Carroll, Coos"
      
      - id: "border-massachusetts"
        subtitle: "South: Massachusetts"
        paragraphs:
          - "[Massachusetts](https://usasymbol.com/states/massachusetts) and New Hampshire are separated by a border located on New Hampshire's southern edge. The state line runs roughly east-west from Vermont in the west to Maine in the east."
          - "The New Hampshire-Massachusetts border extends for about 90 miles. The border follows a relatively straight line across southern New Hampshire. New Hampshire counties along this border include Cheshire, Hillsborough, and Rockingham. On the Massachusetts side, border counties include Berkshire, Franklin, Worcester, Middlesex, and Essex. The border region includes portions of the Merrimack River valley."
        bullets:
          - "About 90 miles east-west"
          - "Relatively straight line"
          - "New Hampshire counties: Cheshire, Hillsborough, Rockingham"
      
      - id: "border-vermont"
        subtitle: "West: Vermont (Connecticut River Border)"
        paragraphs:
          - "[Vermont](https://usasymbol.com/states/vermont) and New Hampshire are separated entirely by the Connecticut River along New Hampshire's western edge. The river creates a natural boundary running roughly north-south."
          - "The New Hampshire-Vermont border extends for about 275 miles along the Connecticut River from Quebec in the north to Massachusetts in the south. Uniquely, the entire Connecticut River belongs to New Hampshire rather than being divided down the middle—New Hampshire's border is defined as the low-water mark on the Vermont shore. New Hampshire counties along this border include Coos, Grafton, Sullivan, and Cheshire."
        bullets:
          - "About 275 miles along Connecticut River"
          - "Entire border formed by river"
          - "New Hampshire owns entire river to Vermont shore"

  - id: canada-border
    icon: "fa-solid fa-globe"
    title: "International Border with Quebec, Canada"
    paragraphs:
      - "New Hampshire shares an international border with Quebec, Canada along its northern edge. This border runs for about 58 miles along the 45th parallel north latitude."
    subsections:
      - id: "border-quebec"
        subtitle: "North: Quebec, Canada"
        paragraphs:
          - "Quebec and New Hampshire are separated by a border located on New Hampshire's northern edge. The state line follows the 45th parallel north latitude, creating a straight east-west boundary."
          - "The New Hampshire-Quebec border extends for about 58 miles from Vermont in the west to Maine in the east. Only Coos County in New Hampshire touches this international border. The border region is characterized by forested mountains and low population density. This is New Hampshire's shortest border."
        bullets:
          - "About 58 miles along 45th parallel (shortest border)"
          - "Only Coos County touches border"
          - "Remote forested region"

  - id: atlantic-coast
    icon: "fa-solid fa-water"
    title: "Atlantic Ocean: Shortest Ocean Coastline"
    paragraphs:
      - "The Atlantic Ocean borders New Hampshire's southeastern coast for about 18 miles, giving New Hampshire the shortest ocean coastline of any U.S. coastal state. Despite its brevity, this coastline includes important features and communities."
    subsections:
      - id: "border-atlantic"
        subtitle: "South-East: Atlantic Ocean"
        paragraphs:
          - "The Atlantic Ocean forms New Hampshire's southeastern boundary at the point where the Piscataqua River meets the ocean. The coastline stretches from Maine in the north to Massachusetts in the south."
          - "New Hampshire's Atlantic coastline is only about 18 miles long—the shortest ocean coastline of any coastal state. Only Rockingham County has ocean coastline. Major coastal communities include Portsmouth (a historic seaport), Hampton Beach (a popular beach resort), and Rye. Despite its short length, New Hampshire's coast includes sandy beaches, rocky headlands, and important harbors. The Isles of Shoals, a group of small islands, sit offshore and are divided between New Hampshire and Maine."
        bullets:
          - "About 18 miles (shortest U.S. ocean coastline)"
          - "Only Rockingham County"
          - "Major cities: Portsmouth, Hampton Beach, Rye"

  - id: connecticut-river
    icon: "fa-solid fa-water"
    title: "Connecticut River: New Hampshire's Entire Western Border"
    paragraphs:
      - "The Connecticut River forms New Hampshire's entire western border with Vermont, running for about 275 miles from Canada to Massachusetts. This is one of the longest single-river state boundaries in New England. Uniquely, the entire river belongs to New Hampshire—the state's border with Vermont is defined as the low-water mark on the Vermont shore, not the middle of the river. This unusual boundary resulted from a colonial land grant and has been confirmed by multiple court decisions. The Connecticut River is New England's longest river and has been historically important for transportation, hydroelectric power, and recreation."

  - id: white-mountains
    icon: "fa-solid fa-mountain"
    title: "The White Mountains"
    paragraphs:
      - "New Hampshire is dominated by the White Mountains, a mountain range that covers much of the northern part of the state and extends into western Maine. The White Mountains include Mount Washington (6,288 feet), the highest peak in the northeastern United States and famous for extreme weather conditions. The Presidential Range, part of the White Mountains, features peaks named after U.S. presidents. These mountains influence New Hampshire's borders—the terrain made precise surveying difficult in colonial times, and the mountains create a natural geographic division. The White Mountain National Forest covers much of the region and attracts millions of visitors for hiking, skiing, and scenic drives."

