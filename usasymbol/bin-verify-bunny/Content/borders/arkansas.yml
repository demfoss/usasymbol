    facts:
      - "Arkansas borders exactly six U.S. states—tied for second most in the nation"
      - "The Mississippi River forms Arkansas's entire 350-mile eastern border"
      - "Arkansas is landlocked with no ocean or Great Lakes coastline"
      - "The Missouri border is Arkansas's longest at about 310 miles"
      - "The Texas border is Arkansas's shortest at about 115 miles"
      - "Tennessee and Mississippi are separated from Arkansas only by water"

faq:
  - question: "What states border Arkansas?"
    answer: "Six states border Arkansas: Missouri (north), Tennessee and Mississippi (east across the Mississippi River), Louisiana (south), Texas (southwest), and Oklahoma (west)."
  - question: "How many states border Arkansas?"
    answer: "Six states border Arkansas, making it tied with Kentucky and Nebraska for the second-most state borders in the U.S."
  - question: "What state borders Arkansas to the north?"
    answer: "Missouri borders Arkansas to the north along the entire northern state line, extending for about 310 miles."
  - question: "What state borders Arkansas to the east?"
    answer: "Two states border Arkansas to the east: Tennessee in the northern section and Mississippi in the southern section. Both are separated from Arkansas by the Mississippi River."
  - question: "What state borders Arkansas to the west?"
    answer: "Oklahoma borders Arkansas to the west, forming most of the western boundary. Texas also touches Arkansas in the southwest corner."
  - question: "What river forms the Arkansas border?"
    answer: "The Mississippi River forms Arkansas's entire eastern border, separating it from Tennessee and Mississippi for about 350 miles total."
  - question: "Is Arkansas landlocked?"
    answer: "Yes, Arkansas is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by other states."
  - question: "Does Arkansas border Texas?"
    answer: "Yes, Arkansas borders Texas in the southwest corner of the state for about 115 miles, making it Arkansas's shortest border with any neighboring state."

