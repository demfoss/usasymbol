  title: "Official State Flowers | Pictures, Names & Facts"
  description: "All 50 official state flowers are listed alphabetically with pictures, scientific names, adoption years, and flower facts."

page:
  h1: "List of State Flowers"
  
  quick_answer:
    - "All 50 U.S. states have an officially designated flower. The table below lists each one with pictures, scientific names, and adoption years."
    - "The Violet (Viola sororia) is the most shared state flower, representing Illinois, New Jersey, Rhode Island, and Wisconsin."
    - "The Magnolia is the state flower of both Louisiana and Mississippi, while the Apple Blossom represents Arkansas and Michigan."
    - "Texas adopted the Bluebonnet in 1901, and spring bluebonnet fields remain one of the state's most photographed sights."
    - "Unlike some state symbols that exist only by tradition, every state flower was formally adopted by its legislature — all 50 states have legislation on record."

  intro_paragraphs:
    - "Every U.S. state has an official flower, designated by its legislature — most chosen between the 1890s and 1920s through campaigns organized by garden clubs, schoolchildren, and women's civic groups. That grassroots origin makes state flowers among the more democratically selected categories of official state symbol."
    - "State flowers range from showy wildflowers like the California Poppy and Texas Bluebonnet to tree blossoms like the Dogwood and Apple Blossom. A few choices are surprising — Nevada picked Sagebrush (technically a shrub), and Maine's state flower is the White Pine Cone and Tassel (not a flower in the traditional sense). The alphabetical list of state flowers below includes photos, scientific names, and adoption years for all 50 states. Use the column headers to sort the list or print it for quick reference."    

  insights:
    - "Delaware was first to adopt a state flower (Peach Blossom, 1895), though several states informally recognized flowers earlier. Oklahoma was last among the lower 48, changing to the Oklahoma Rose in 2004."
    - "Ohio's Scarlet Carnation was chosen to honor President William McKinley, who was assassinated in 1901. McKinley always wore a red carnation as a good luck charm."
    - "Hawaii's Yellow Hibiscus (Hibiscus brackenridgei) is endangered — it's one of the rarest state flowers, with fewer than 1,000 plants remaining in the wild."
    - "Nevada's Sagebrush is the only state flower that most people wouldn't consider a flower at all. It was chosen because it dominates the Nevada landscape and symbolizes the state's rugged, arid terrain."
    - "Several state flowers are actually tree blossoms: Arkansas and Michigan (Apple Blossom), Delaware (Peach Blossom), Florida (Orange Blossom), and North Carolina and Virginia (Dogwood)."
 
  methodology: "This page lists official state flowers designated by law or resolution. Scientific names follow current botanical taxonomy."
  
  sources:
    - name: "USDA Plants Database"
      url: "https://plants.usda.gov/"
      description: "Plant taxonomy, distribution, and classification data"
    - name: "Lady Bird Johnson Wildflower Center"
      url: "https://www.wildflower.org/"
      description: "Native plant information and wildflower identification"

