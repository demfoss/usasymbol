page:
  h1: "List of State Minerals"

  quick_answer:
    - "A state mineral is an official mineral designated by a state legislature to represent the state's geology or mining history. Not every state has designated one."
    - "Alabama's state mineral is hematite, an iron oxide adopted in 1967 that fueled Birmingham's rise as an iron and steel manufacturing center."
    - "State minerals are usually chosen for their historical or economic importance to the state, not for rarity or beauty, that role tends to go to state gemstones instead."

  intro_paragraphs:
    - "State minerals are one of the lesser-known official state symbols. Unlike a state bird or flower, a state mineral is usually chosen for its economic history, the ore that built an industry, rather than for its appearance."
    - "Each state mineral designation reflects a real mining or industrial story: a deposit that supported factories, a mining district that built a city, or a resource woven into the state's economy for generations."

  sections:
    - id: minerals-overview
      icon: fa-solid fa-cube
      title: Official State Minerals of U.S. States
      paragraphs:
        - "The table below lists official state minerals with their adoption year and a short note on why each one matters to its state. Thirty states have designated an official state mineral. The rest have not."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed state mineral are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state minerals, rocks, stones and gemstones"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_minerals,_rocks,_stones_and_gemstones"
      description: "State mineral designations with adoption years."

