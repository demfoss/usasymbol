seo:
  title: "State Gemstones | Official List, Map & Facts"
  description: "Official state gemstones are listed by state, with adoption years and facts about where each one is found or mined."

page:
  h1: "List of State Gemstones"

  quick_answer:
    - "A state gemstone is an official precious or semi-precious stone designated by a state legislature, usually tied to a real deposit or a local gem-cutting tradition."
    - "Not every state has designated an official gemstone, fewer states have one than have a state mineral or state rock."

  intro_paragraphs:
    - "State gemstones are typically chosen because a specific deposit produced gem-quality material found nowhere else in comparable quality, or because a state has a working gem-cutting or jewelry tradition built around a local stone."
    - "Thirty-six states have designated an official state gemstone; this list covers each one, verified against official state sources."

  sections:
    - id: gemstones-overview
      icon: fa-solid fa-gem
      title: Official State Gemstones of U.S. States
      paragraphs:
        - "The table below lists official state gemstones with their adoption year and a short note on where each one is found. Thirty-six states have designated an official state gemstone. The rest have not."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed state gemstone are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state minerals, rocks, stones and gemstones"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_minerals,_rocks,_stones_and_gemstones"
      description: "State gemstone designations with adoption years."

