seo:
  title: "State Dishes & Snacks | Official List, Map & Facts"
  description: "Official state meals, cuisines, and signature dishes are listed by state, with adoption years and facts about each one."

page:
  h1: "List of State Dishes & Snacks"

  quick_answer:
    - "A state dish, meal, or cuisine is an official food designation covering a full recipe, snack, or style of cooking rather than a single crop."
    - "Examples include Oklahoma's official state meal and Louisiana's official state cuisine, gumbo."

  intro_paragraphs:
    - "State dishes and snacks are usually chosen because a recipe or style of cooking is closely tied to the state's identity, sometimes officially defined down to the exact ingredients."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: dishes-overview
      icon: fa-solid fa-bowl-food
      title: Official State Dishes & Snacks of U.S. States
      paragraphs:
        - "The table below lists official state meals, cuisines, and signature dishes with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State dish, meal, and cuisine designations with adoption years."

