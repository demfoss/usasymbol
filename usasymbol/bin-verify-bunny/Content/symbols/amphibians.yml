seo:
  title: "State Amphibians | Official List, Map & Facts"
  description: "Official state amphibians are listed by state, with adoption years and facts about where each species is found."

page:
  h1: "List of State Amphibians"

  quick_answer:
    - "A state amphibian is an official frog, toad, or salamander designated by a state legislature to represent the state's wildlife."
    - "Alabama's state amphibian is the Red Hills salamander, adopted in 1975. It lives nowhere else on Earth outside a narrow strip of south-central Alabama."

  intro_paragraphs:
    - "State amphibians are usually chosen because a species is endemic to the state, found nowhere else, or because a conservation campaign highlighted a species worth protecting."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: amphibians-overview
      icon: fa-solid fa-frog
      title: Official State Amphibians of U.S. States
      paragraphs:
        - "The table below lists official state amphibians with their adoption year and a short note on where each one is found. Not every state has designated one; this list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed state amphibian are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state amphibians"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_amphibians"
      description: "State amphibian designations with adoption years."

