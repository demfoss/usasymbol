seo:
  title: "State Crops & Ingredients | Official List, Map & Facts"
  description: "Official state grains, beans, legumes, and other crops are listed by state, with adoption years and facts about each one."

page:
  h1: "List of State Crops & Ingredients"

  quick_answer:
    - "A state crop or ingredient designation covers grains, beans, legumes, mushrooms, honey, and similar raw agricultural products that a state legislature has officially recognized."
    - "Alabama's state legume is the peanut, adopted in 2022, centered on Dothan, long known as the Peanut Capital of the World."

  intro_paragraphs:
    - "State crops and ingredients are usually chosen because a state is a leading grower or producer, often tying the designation to a specific farming region."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: crops-overview
      icon: fa-solid fa-wheat-awn
      title: Official State Crops & Ingredients of U.S. States
      paragraphs:
        - "The table below lists official state grains, beans, legumes, and other crops with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State grain, bean, legume, and other crop designations with adoption years."

