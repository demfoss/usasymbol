seo:
  title: "State Reptiles | Official List, Map & Facts"
  description: "Official state reptiles are listed by state, with adoption years and facts about where each species is found."

page:
  h1: "List of State Reptiles"

  quick_answer:
    - "A state reptile is an official turtle, snake, lizard, or alligator designated by a state legislature to represent the state's wildlife."
    - "Alabama's state reptile is the Alabama red-bellied turtle, adopted in 1990. It is found almost nowhere else outside the Mobile-Tensaw Delta."

  intro_paragraphs:
    - "State reptiles are usually chosen because a species is endemic to the state, found nowhere else, or because a conservation campaign highlighted a species worth protecting."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: reptiles-overview
      icon: fa-solid fa-turtle
      title: Official State Reptiles of U.S. States
      paragraphs:
        - "The table below lists official state reptiles with their adoption year and a short note on where each one is found. Not every state has designated one; this list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed state reptile are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state reptiles"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_reptiles"
      description: "State reptile designations with adoption years."

