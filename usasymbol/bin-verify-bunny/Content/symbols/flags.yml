page:
  h1: "All 50 U.S. State Flags"
  quick_answer_title: "State flags at a glance"
  quick_answer:
    - "Every U.S. state has an official flag. The gallery below shows all 50 current designs and links each image to its complete history, colors, and symbolism."
    - "Minnesota has the newest current state flag. Its North Star design became official on May 11, 2024, after Utah's new beehive flag took effect on March 9, 2024."
    - "Texas has the oldest lineage among current state flag designs. The Republic of Texas adopted the Lone Star flag in 1839; although state law did not specify an official flag from 1879 to 1933, lawmakers restored the same basic design."
    - "Ohio is the only state with a nonrectangular flag, while Oregon is the only state whose official front and reverse have different designs."
  methodology: "Years refer to adoption of the basic current design, not every later technical revision. Meanings use official state explanations where available; visual descriptions are used when state law assigns no symbolism."
  sources:
    - name: "Minnesota Secretary of State — State Flag"
      url: "https://www.sos.mn.gov/about-minnesota/state-symbols/state-flag/"
      description: "Official description, symbolism, designer, and May 11, 2024 adoption date."
    - name: "Utah's Online Public Library — State Flag"
      url: "https://onlinelibrary.utah.gov/state-symbol/flag/"
      description: "Official history and March 9, 2024 effective date of Utah's beehive flag."
    - name: "Mississippi Department of Archives and History"
      url: "https://www.mdah.ms.gov/taxonomy/term/134"
      description: "Official record of the New Magnolia flag selection and 2021 enactment."
    - name: "Florida Department of State — State Flag"
      url: "https://dos.fl.gov/florida-facts/florida-state-symbols/state-flag/"
      description: "Official history confirming voter adoption of Florida's current design in 1900."
    - name: "Texas House of Representatives — State Flag History"
      url: "https://house.texas.gov/index.php/about"
      description: "Official account of the 1839 Lone Star design and its later statutory specification."
    - name: "North American Vexillological Association"
      url: "https://nava.org/"
      description: "Educational reference for flag terminology, history, and design."

