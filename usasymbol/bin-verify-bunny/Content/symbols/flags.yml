sections:
  - id: "state-flags-overview"
    icon: "fa-solid fa-flag-usa"
    title: "A Visual Guide to Every State Flag"
    paragraphs:
      - "The 50 state flags range from New Mexico's spare red Zia symbol to densely illustrated state seals. Each entry identifies the current flag, the year its basic design became official, what appears on it, and what its principal symbols mean. Switch from Table to Cards to browse a visual gallery, or search for a state, symbol, color, or motto."
      - "A flag design may predate statehood, while a later law may standardize colors, proportions, lettering, or seal details. The year in the table is the adoption year of the basic current design; important later revisions are explained on each state's flag page."
      - "More than a dozen flags place a detailed state seal or coat of arms on blue, making several designs difficult to distinguish at a distance. The latest redesign wave replaced three seal-heavy or controversial flags: Mississippi in 2021, then Utah and Minnesota in 2024."

  - id: "how-to-read"
    icon: "fa-solid fa-magnifying-glass"
    title: "How to Read a State Flag"
    paragraphs:
      - "Begin with the large shapes, because those remain visible when a flag is moving or far away. Texas's star, Tennessee's three-star disk, Colorado's C, and New Mexico's Zia sun work at that scale. Small seals and lettering add history but disappear first at a distance."
      - "A star can indicate admission order, a nickname, unity, or membership among the original states. Compare [state flags with stars](/collections/flags/states-with-stars-on-the-flag) and [words and text on state flags](/collections/flags/state-flags-with-words-and-text)."
      - "After browsing the designs, try the [U.S. state flags quiz](/quizzes/state-flags-quiz), which draws questions from all 50 current flags."
  - id: "design-families"
    icon: "fa-solid fa-layer-group"
    title: "The Main State Flag Design Families"
    paragraphs:
      - "A large group follows the [seal-on-blue pattern](/collections/flags/state-flags-that-are-just-a-seal-on-blue). These flags preserve extensive history, but their small imagery is difficult to identify while flying."
      - "Other flags use one dominant emblem, bold geometry, or heraldry: Alaska's constellation, California's bear, South Carolina's palmetto, Maryland's family arms, Arizona's rays, and Ohio's burgee. Compare [state flags that look like country flags](/collections/flags/state-flags-that-look-like-country-flags)."
      - "Design comparisons reveal both resemblance and disagreement. Browse [state flags that look alike](/collections/flags/state-flags-that-look-alike) for commonly confused pairs, then compare the criteria behind the [best and worst state flags](/collections/flags/best-and-worst-state-flags)."
  - id: "newest-flags"
    icon: "fa-solid fa-clock-rotate-left"
    title: "The Newest State Flags"
    paragraphs:
      - "Minnesota's current flag became official on May 11, 2024. Its dark-blue hoist abstracts the state's outline, its bright-blue field represents water, and its eight-pointed star points north. The commission adapted Andrew Prekker's submitted concept."
      - "Utah's beehive flag took effect on March 9, 2024. Mississippi enacted the New Magnolia flag in January 2021 after voters approved it in November 2020. Follow the sequence in [recent state flag redesigns](/collections/flags/state-flag-redesigns) and [the oldest and newest state flags](/collections/flags/oldest-and-newest-state-flags)."
      - "Earlier designs provide the missing context for those changes. The [former U.S. state flags](/collections/flags/former-us-state-flags) gallery documents selected replacements, while [state flags with Confederate history](/collections/flags/state-flags-with-confederate-history) separates direct historical links from disputed claims."
  - id: "one-of-a-kind"
    icon: "fa-solid fa-shapes"
    title: "State Flags with One-of-a-Kind Features"
    paragraphs:
      - "Ohio's burgee is the only nonrectangular state flag. Oregon alone has different statutory front and reverse designs. Hawaii alone includes the Union Jack, and Washington alone uses a green field with a U.S. president's portrait."
      - "New Mexico uses the culturally specific Zia sun, while Maryland fills the cloth with Calvert and Crossland heraldry. See more [unique state flag facts](/collections/flags/unique-us-state-flag-facts)."
  - id: "symbols-and-meanings"
    icon: "fa-solid fa-icons"
    title: "What State Flag Symbols Mean"
    paragraphs:
      - "Natural emblems make geography memorable: California uses a grizzly, Louisiana a pelican, South Carolina a palmetto, and Mississippi a magnolia. Browse [animals](/collections/flags/states-with-animals-on-the-flag), [birds](/collections/flags/states-with-birds-on-the-flag), and [plants](/collections/flags/states-with-plants-trees-on-the-flag) on state flags."
      - "Mottos add another layer. Virginia condemns tyranny, Kansas describes reaching the stars through difficulty, and Rhode Island says simply 'Hope.' Compare [state flags with Latin mottos](/collections/flags/states-with-latin-mottos-on-the-flag)."

faq:
  - question: "How many U.S. state flags are there?"
    answer: "There are 50 official state flags, one for each U.S. state. Washington, D.C., and U.S. territories also have flags but are not part of the 50-state count."
  - question: "Which state has the newest flag?"
    answer: "Minnesota has the newest current state flag. Its North Star design became official on May 11, 2024. Utah's current flag became official on March 9, 2024, and Mississippi's in January 2021."
  - question: "Which state has the oldest current flag?"
    answer: "Texas has the oldest design lineage among current state flags. The Republic of Texas adopted the Lone Star flag in 1839. State law did not specify an official flag from 1879 to 1933, when lawmakers restored the same basic design."
  - question: "What is the only nonrectangular state flag?"
    answer: "Ohio has the only nonrectangular state flag. Its red, white, and blue swallowtail shape is called a burgee and has been official since 1902."
  - question: "Which state flag has a different design on the back?"
    answer: "Oregon is the only state with different official front and reverse designs. The front displays the state arms; the reverse shows a gold beaver on navy blue."
  - question: "Why do so many state flags have a seal on blue?"
    answer: "Many states adapted military banners or placed an existing government seal on blue around the turn of the 20th century. This produced visually similar flags whose details can be difficult to see from a distance."
