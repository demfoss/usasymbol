page:
  h1: "License Plate Slogans"

  quick_answer:
    - "Each of the 50 states has a slogan on its standard license plate — a short phrase that travels on millions of vehicles across every highway in the country. Does your state's plate say something proud, poetic, or surprisingly literal?"
    - "New Hampshire's 'Live Free or Die' is the most famous state license plate slogan in the U.S. — the only one drawn from an 18th-century historical quote, and the only one ever taken to the Supreme Court."
    - "Virginia's 'Virginia Is For Lovers' (1969) started as an ad agency concept and became one of the most recognized tourism slogans in American history — still on plates more than 50 years later."
    - "Idaho's 'Famous Potatoes' dates to 1928, making it the oldest surviving plate slogan in the country and one of the most refreshingly direct: no mountains, no scenery, just potatoes."
    - "Some states swap slogans every few years. Others, like Maine with 'Vacationland' and Wisconsin with 'America's Dairyland,' have kept the same phrase since before World War II."

  intro_paragraphs:
    - "Each of the 50 U.S. states puts a slogan on its standard license plate — a short phrase that rides on millions of bumpers across every state line in the country. That makes the plate slogan one of the most widely seen official state symbols of all: more visible than the state bird, the state flower, or even the [state motto](/symbols/mottos). For many Americans, it's the first piece of state identity they notice, glimpsed in a parking lot or passing on the highway."
    - "The phrases cover the full range of what states want to say about themselves: geography ('Grand Canyon State,' 'The Ocean State'), history ('Land of Lincoln,' 'The Constitution State'), tourism ('Vacationland,' 'Big Sky Country'), agriculture ('Famous Potatoes,' 'America's Dairyland'), and something harder to categorize ('Virginia Is For Lovers,' 'Live Free or Die'). Some slogans have been on plates for nearly a century. A few changed last year. All of them answer the same question — what does this state want the rest of the country to know about it?"

  insights:
    - "Tourism slogans dominate. More than half of all state plate phrases either describe geography, a landmark, or frame the state as a destination."
    - "The oldest surviving slogan still in widespread use may be Maine's 'Vacationland,' which dates to the 1930s."
    - "Virginia's 'Virginia Is For Lovers' started as an advertising campaign, not a government initiative, before becoming the official plate slogan — an unusual origin story."
    - "New Hampshire is legally distinctive: 'Live Free or Die' is protected by state law, and residents who object to displaying it on their plates have fought court cases over it."
    - "Several states have cycled through multiple slogans, using different phrases on specialty plates while keeping one on the standard plate."

  methodology: "This page lists the main slogan on each state's standard plate as of 2026. Years use the best documented adoption date."

