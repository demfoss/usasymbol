    - state: "Tennessee"
      state_slug: "tennessee"
      slogan: "The Volunteer State"
      slogan_slug: "the-volunteer-state"
      year_introduced: 1954
      notes: "Tennessee earned the name from the unusually large number of volunteer soldiers who responded to calls during the War of 1812 and later the Mexican–American War."

    - state: "Texas"
      state_slug: "texas"
      slogan: "The Lone Star State"
      slogan_slug: "the-lone-star-state"
      year_introduced: 1951
      notes: "The lone star refers to the single star on the Texas flag and to the Republic of Texas period (1836–1845) when Texas was an independent nation."

    - state: "Utah"
      state_slug: "utah"
      slogan: "Life Elevated"
      slogan_slug: "life-elevated"
      year_introduced: 2006
      notes: "Replaced 'The Greatest Snow on Earth'; works on two levels — Utah's high elevation and the idea of an elevated quality of life."

    - state: "Vermont"
      state_slug: "vermont"
      slogan: "Green Mountain State"
      slogan_slug: "green-mountain-state"
      year_introduced: 1937
      notes: "'Vermont' itself comes from the French vert mont, meaning green mountain — the plate slogan is a direct translation of the state's own name."

    - state: "Virginia"
      state_slug: "virginia"
      slogan: "Virginia Is For Lovers"
      slogan_slug: "virginia-is-for-lovers"
      year_introduced: 1969
      notes: "Originally created as an advertising tagline by the Virginia State Travel Service; it became one of the most successful and durable state tourism phrases ever produced."

    - state: "Washington"
      state_slug: "washington"
      slogan: "The Evergreen State"
      slogan_slug: "the-evergreen-state"
      year_introduced: 1923
      notes: "One of the oldest plate phrases in the country; Washington's Douglas fir forests were already defining the state's image before the automobile era."

    - state: "West Virginia"
      state_slug: "west-virginia"
      slogan: "Wild, Wonderful"
      slogan_slug: "wild-wonderful"
      year_introduced: 1969
      notes: "Previously 'The Mountain State'; 'Wild, Wonderful' was introduced as part of a broader effort to reframe West Virginia's image around outdoor recreation."

    - state: "Wisconsin"
      state_slug: "wisconsin"
      slogan: "America's Dairyland"
      slogan_slug: "americas-dairyland"
      year_introduced: 1940
      notes: "Wisconsin adopted the phrase when it was producing more milk than any other state; it has remained on the plate ever since, regardless of changes in dairy rankings."

    - state: "Wyoming"
      state_slug: "wyoming"
      slogan: "The Equality State"
      slogan_slug: "the-equality-state"
      year_introduced: 1966
      notes: "Wyoming was the first U.S. territory to grant women the right to vote, in 1869 — 51 years before the 19th Amendment."

sections:
  - id: "why-plate-slogans-matter"
    icon: "fa-solid fa-car"
    title: "Why License Plate Slogans Are More Than Branding"
    paragraphs:
      - "Every licensed vehicle in a state carries the plate slogan across state lines. That makes the phrase visible to more people than the state bird, state flower, or [state motto](/symbols/mottos) combined. For most Americans, the plate slogan is the first piece of state identity they absorb — before reading a welcome sign, visiting a landmark, or meeting a resident."
      - "The durability of these slogans is striking. Maine's 'Vacationland' has been on plates since the 1930s. Idaho's 'Famous Potatoes' dates to 1928. Wisconsin's 'America's Dairyland' goes back to 1940. These phrases predate the modern tourism industry and have outlasted dozens of marketing campaigns that came after them. When a plate slogan sticks, it tends to stick for generations."

  - id: "types-of-slogans"
    icon: "fa-solid fa-layer-group"
    title: "Types of State Plate Slogans"
    paragraphs:
      - "Tourism slogans frame the state as a destination: Florida's 'The Sunshine State,' Maine's 'Vacationland,' New Mexico's 'Land of Enchantment,' and Montana's 'Big Sky Country' all work the same way — they compress a reason to visit into a few words. Many of those phrases overlap directly with the [state nicknames](/symbols/nicknames) people already know."
      - "Geographic identity slogans name a feature: Michigan's 'Great Lakes State,' Arizona's 'Grand Canyon State,' Rhode Island's 'The Ocean State,' and Minnesota's '10,000 Lakes' are all accurate and directly tied to what makes the state physically distinctive."
      - "Historical and civic slogans draw on founding identity: Connecticut's 'The Constitution State,' Delaware's 'The First State,' New Hampshire's 'Live Free or Die,' and Illinois's 'Land of Lincoln' reference specific historical claims. New Hampshire's phrase is also the most famous entry in the [state mottos list](/symbols/mottos)."
      - "Agricultural slogans lean into produce: Idaho's 'Famous Potatoes,' Wisconsin's 'America's Dairyland,' Kansas's 'The Sunflower State,' and Georgia's 'Peach State' use the state's farm identity directly."

  - id: "most-notable-slogans"
    icon: "fa-solid fa-star"
    title: "Most Notable Plate Slogans"
    paragraphs:
      - "New Hampshire's 'Live Free or Die' is the most legally and philosophically distinct plate slogan in the country. It was challenged all the way to the U.S. Supreme Court in Wooley v. Maynard (1977) when a Jehovah's Witness couple covered the phrase on religious grounds. The Court ruled that a state cannot compel citizens to display a political message — but New Hampshire kept the slogan."
      - "Virginia's 'Virginia Is For Lovers' began not as government policy but as an advertising concept developed by the Martin Agency for the Virginia State Travel Service in 1969. It survived internal debate (early versions included 'Virginia Is For History Lovers' and 'Virginia Is For Beach Lovers') and became one of the most enduring tourism phrases ever created."
      - "Idaho's 'Famous Potatoes' from 1928 deserves recognition for sheer longevity and directness. While most states trend toward scenic or aspirational phrases, Idaho has maintained an agricultural identity statement for nearly a century."

faq:
  - question: "What is a license plate slogan?"
    answer: "A license plate slogan is a short phrase printed on a state's standard license plates to identify and represent the state. These slogans typically reference geography, history, agriculture, or tourism, and are among the most widely seen state symbols because they travel on vehicles across state lines."

  - question: "Which state has the most famous license plate slogan?"
    answer: "New Hampshire's 'Live Free or Die' is the most widely cited in American culture and legal history. Virginia's 'Virginia Is For Lovers' is the most successful from a tourism branding perspective. Idaho's 'Famous Potatoes' is often cited as the most memorable for its directness."

  - question: "Which state has the oldest license plate slogan still in use?"
    answer: "Idaho's 'Famous Potatoes' dates to 1928, making it the oldest known surviving plate slogan in continuous use. Maine's 'Vacationland' from the mid-1930s is the second oldest still on plates."

  - question: "Can a state force residents to display its license plate slogan?"
    answer: "In practice, yes — states require license plates on vehicles, and the slogan appears on standard plates. However, Wooley v. Maynard (1977) established that a state cannot punish a resident for covering the slogan on First Amendment grounds, at least in the case of ideological objection."

  - question: "Do all states have a license plate slogan?"
    answer: "All 50 states use some form of slogan or tagline on their standard plates, though a small number use only geographic or nickname-based phrases rather than an explicitly promotional statement."

