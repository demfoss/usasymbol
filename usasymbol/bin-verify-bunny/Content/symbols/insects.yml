seo:
  title: "State Insects | Official List, Map & Facts"
  description: "Official state insects are listed by state, with adoption years, appearance details, and where each insect is found."

page:
  h1: "List of State Insects"

  quick_answer:
    - "This list covers 72 official insect-related symbols across 48 states, including state insects, butterflies, bees, bugs, dragonflies, and agricultural insects."
    - "Butterflies and European honey bees are the most common choices, while several states recognize ladybugs, fireflies, dragonflies, mantids, beetles, or wasps."
    - "Iowa and Michigan are the only states without an official insect-related symbol in this collection."

  intro_paragraphs:
    - "State insects are a smaller, lesser-known category of official state symbols compared to state birds or flowers. Many were adopted after student-led campaigns rather than legislative initiative."
    - "Several states recognize more than one insect symbol at once, splitting the category into designations such as state insect, state butterfly, state bee, state bug, state pollinator, and state agricultural insect."

  sections:
    - id: insects-overview
      icon: fa-solid fa-bug
      title: Official State Insects
      paragraphs:
        - "The table below lists all 72 insect-related symbols found in the published state insect files, with each symbol's scientific name, official designation, and adoption year."
        - "States with multiple designations appear more than once. Alabama, Delaware, Tennessee, and several others separately recognize butterflies, bees, bugs, pollinators, or agricultural insects."

    - id: common-state-insects
      icon: fa-solid fa-leaf
      title: Most Common State Insects
      paragraphs:
        - "European honey bees lead the list with 19 entries, including state insect, state bug, state pollinator, and agricultural insect designations. Lawmakers often choose them because honey bees support crop pollination and connect directly with farming."
        - "Ladybugs follow among non-butterfly picks, while fireflies, dragonflies, mantids, beetles, a wasp, and a damselfly add variety. Search the state insect table by species, designation, or state to compare all 72 official symbols."

    - id: state-butterflies
      icon: fa-solid fa-seedling
      title: State Butterflies by State
      paragraphs:
        - "Butterflies account for 32 entries across 31 states because Alabama recognizes two butterfly species under separate titles. Monarch butterflies and eastern tiger swallowtails appear most often, followed by black swallowtails and several regional species."
        - "State butterfly choices often match local habitat, migration routes, or student campaigns. Arizona chose the two-tailed swallowtail, New Mexico picked the Sandia hairstreak, and Maine selected the pink-edged sulphur in 2023."

  methodology: "Rows are compiled from the published state insect detail files. Adoption years reflect the year of official legislative designation recorded for each symbol."

  sources:
    - name: "USA Symbol State Insect Profiles"
      url: "/symbols/insects"
      description: "Individual state insect profiles provide the official-source citations used for each row."

