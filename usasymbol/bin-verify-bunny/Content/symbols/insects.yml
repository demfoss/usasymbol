faq:
  - question: "How many states have an official insect-related symbol?"
    answer: "Forty-eight states have at least one official insect-related symbol in this list. Iowa and Michigan are the two states without one."

  - question: "Why do some states appear more than once?"
    answer: "Some states recognize separate state insects, butterflies, bees, bugs, pollinators, dragonflies, or agricultural insects, so each official designation receives its own row."

  - question: "What is the oldest state insect designation in this list?"
    answer: "California named the California dogface butterfly its state insect in 1972, the earliest adoption year in this collection."

  - question: "What is the newest insect designation in this list?"
    answer: "Delaware named the blue dasher its state dragonfly in 2025, the newest adoption in this collection."

