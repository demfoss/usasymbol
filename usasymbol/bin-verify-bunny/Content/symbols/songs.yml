faq:
  - question: "Which states have no official state song?"
    answer: "Maryland and New Jersey are the only two states without an official state song. Maryland repealed its former state song in 2021 and has not replaced it."

  - question: "What is the oldest official state song?"
    answer: "Indiana's \"On the Banks of the Wabash, Far Away,\" written by Paul Dresser and adopted in 1913, is among the oldest formally adopted state songs still in use."

  - question: "Which state has adopted the most official songs?"
    answer: "Tennessee has adopted close to twenty official state songs since 1925, spanning genres from ballads to a bicentennial rap and songs written into the 2020s."

  - question: "Did any state song become a national hit?"
    answer: "Yes. Georgia's \"Georgia on My Mind\" became a hit recording for Ray Charles years before Georgia adopted it as the official state song in 1979."

