seo:
  title: "Official State Songs | List, Composers & Facts"
  description: "Official state songs are listed by state with composer, lyricist, and adoption year, from Kansas's \"Home on the Range\" to Georgia's \"Georgia on My Mind\"."

page:
  h1: "List of State Songs by State"

  quick_answer:
    - "Forty-eight U.S. states have adopted an official state song, state anthem, or equivalent primary designation. Maryland and New Jersey are the only two states with no official state song."
    - "Many states also recognize additional songs beyond the primary one, including state waltzes, marches, ballads, and honorary songs. Tennessee alone has adopted close to twenty official songs over the decades."
    - "Some state songs became famous well beyond their home state, including Georgia's \"Georgia on My Mind\" (recorded by Ray Charles) and Louisiana's \"You Are My Sunshine.\""
    - "Adoption years often trail far behind the year a song was actually written. Kansas adopted \"Home on the Range\" in 1947, roughly 75 years after the words were first written on the Smith County plains in the 1870s."

  intro_paragraphs:
    - "State songs capture something most other state symbols do not: an actual piece of music tied to a place, written by a named composer and lyricist rather than chosen from nature or history."
    - "Most states settled on one primary state song decades ago, often a ballad or hymn describing the state's landscape. A handful of states, including Tennessee, New Hampshire, and Massachusetts, kept adding new official songs across the decades rather than replacing the original."
    - "Two states, Maryland and New Jersey, have never adopted an official state song at all."

  insights:
    - "Stephen Foster, one of America's best-known 19th-century songwriters, wrote both Kentucky's state song, \"My Old Kentucky Home,\" and Florida's official song, \"Old Folks at Home.\""
    - "Georgia's \"Georgia on My Mind,\" written by Hoagy Carmichael and Stuart Gorrell, became a hit recording for Ray Charles decades before Georgia adopted it as the state song in 1979."
    - "Colorado is one of the few states with two full state songs adopted decades apart: \"Where the Columbines Grow\" from 1915 and John Denver's \"Rocky Mountain High\" from 2007."
    - "Tennessee has adopted more official state songs than any other state, spanning genres from a 1925 parlor ballad to a 2024 holiday song and songs written well into the 2020s."

  sections:
    - id: songs-overview
      icon: fa-solid fa-music
      title: Official State Songs Across the U.S.
      paragraphs:
        - "The table below lists each state's primary official state song along with its composer, lyricist, and the year of adoption. States that have adopted additional official songs, anthems, waltzes, or marches recognize those separately from the primary state song listed here."
        - "Adoption years mark when a state legislature made a song official, which is often long after the song was actually written. Several of the oldest state songs, including Iowa's and Indiana's, were written in the early 1900s or before and only formally adopted decades later."

    - id: songs-no-song-states
      icon: fa-solid fa-circle-question
      title: States With No Official State Song
      paragraphs:
        - "Maryland and New Jersey are the only two states that have never adopted an official state song. Maryland's former state song, tied to Confederate-era lyrics, was formally repealed in 2021 and has not been replaced."
        - "New Jersey has considered proposals for a state song in the past, but none has been enacted into law."

  methodology: "This page lists each state's primary official state song, along with composer, lyricist, and adoption year, as presented in state-symbol reference compilations and current public summaries. States with multiple official songs are represented here by their primary designation only."

  sources:
    - name: "Wikipedia - List of U.S. state songs"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_songs"
      description: "Overview list of official state songs, composers, lyricists, and adoption years."

