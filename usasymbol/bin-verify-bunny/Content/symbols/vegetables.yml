seo:
  title: "State Vegetables | Official List, Map & Facts"
  description: "Official state vegetables are listed by state, with adoption years and facts about each crop."

page:
  h1: "List of State Vegetables"

  quick_answer:
    - "A state vegetable is an official vegetable designated by a state legislature, usually a crop with deep roots in the state's farming or food culture."
    - "Alabama's state vegetable is the sweet potato, adopted in 2021, a longtime staple of Southern cooking."

  intro_paragraphs:
    - "State vegetables are usually chosen because a crop has long been grown in the state and is closely tied to its home cooking traditions."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: vegetables-overview
      icon: fa-solid fa-carrot
      title: Official State Vegetables of U.S. States
      paragraphs:
        - "The table below lists official state vegetables with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State vegetable designations with adoption years."

