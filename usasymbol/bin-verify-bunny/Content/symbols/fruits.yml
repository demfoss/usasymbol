seo:
  title: "State Fruits | Official List, Map & Facts"
  description: "Official state fruits, berries, and tree fruits are listed by state, with adoption years and facts about each one."

page:
  h1: "List of State Fruits"

  quick_answer:
    - "A state fruit is an official fruit, berry, or tree fruit designated by a state legislature, usually a crop the state grows commercially."
    - "Alabama has designated two: the blackberry as state fruit (2004) and the peach as state tree fruit (2006, grown mainly in Chilton County)."

  intro_paragraphs:
    - "State fruits are usually chosen because a state grows the crop commercially, not simply because a fruit is popular or well known nationally."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: fruits-overview
      icon: fa-solid fa-apple-whole
      title: Official State Fruits of U.S. States
      paragraphs:
        - "The table below lists official state fruits, berries, and tree fruits with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State fruit and tree fruit designations with adoption years."

