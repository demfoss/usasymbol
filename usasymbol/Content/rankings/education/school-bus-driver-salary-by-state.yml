  - id: why-school-bus-driver-pay-varies
    icon: "fa-solid fa-scale-balanced"
    title: "Why School Bus Driver Pay Varies"
    paragraphs:
      - "Washington's $62,940 average sits alongside negotiated district wage structures. Bellevue increases driver pay after probation and provides regular drivers with paid holidays under its collective bargaining agreement. A negotiated pay ladder offers a concrete mechanism for sustaining wages above entry pay."
      - "Alabama's $19,190 average is easier to understand through its school-term route contracts. Pike County's schedule budgets drivers for short daily assignments over the school year, with separate compensation for midday routes and bus trips. The base job covers morning and afternoon transport rather than a continuous working day."
  - id: states-with-the-most-school-bus-driver-jobs
    icon: "fa-solid fa-school"
    title: "States With the Most School Bus Driver Jobs"
    paragraphs:
      - "New York employs 38,320 school bus drivers. Non-city districts' transportation duties include eligible pupils attending private and religious schools, and similar pupils must receive equal service. That extends route planning across public and nonpublic campuses, making transport part of [school spending](/rankings/education/school-spending-by-state) beyond classroom instruction."
