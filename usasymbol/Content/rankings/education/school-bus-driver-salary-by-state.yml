faq:
  - question: "How much does a school bus driver make in Washington?"
    answer: "Washington's median annual wage is $63,370. In Bellevue, regular drivers' health coverage and retirement arrangements accompany their pay, while substitute drivers have a different benefits arrangement."
  - question: "How much does a school bus driver make in Texas?"
    answer: "Texas school bus drivers average $43,540 annually. Supervising children's conduct is part of the work alongside driving the route."
  - question: "How much does a school bus driver make in California?"
    answer: "California school bus drivers average $60,520 annually. Checking tires, lights and oil belongs to the driver's routine before transporting students."
  - question: "How much does a school bus driver make in New York?"
    answer: "New York school bus drivers average $57,140 annually. School routes serve pupils, whereas transit and intercity drivers operate a separate passenger transport occupation."
  - question: "How much does a school bus driver make in Alabama?"
    answer: "Alabama school bus drivers average $19,190 annually. Reporting disciplinary problems to the district and parents is part of managing safety on the route."
  - question: "What is the median school bus driver salary in Massachusetts?"
    answer: "Massachusetts has a $65,170 median annual wage. Helping children with disabilities board and leave the bus forms part of school transportation work."
