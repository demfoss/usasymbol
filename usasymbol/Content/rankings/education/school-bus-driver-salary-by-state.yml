page:
  h1: "School Bus Driver Salary by State"
  quick_answer:
    - "School bus driver salary by state is highest in Washington at $62,940 annually. Bellevue's negotiated pay structure raises driver pay after probation and provides paid holidays for regular drivers."
    - "Alabama has the lowest average at $19,190. Pike County structures driver pay around a school-term contract, with additional payments for midday routes and trips."
    - "New York employs 38,320 school bus drivers. Non-city districts must transport eligible private-school pupils as well as public-school children, extending the work beyond a district's own campuses."
  methodology: "BLS OEWS May 2025, SOC 53-3051, all 50 states ranked by mean annual wage, with annual and hourly conversions using 2,080 hours. DC, self-employment, transit and intercity drivers are excluded."
