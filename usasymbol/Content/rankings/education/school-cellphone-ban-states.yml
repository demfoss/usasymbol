  description: "Florida passed the first statewide school phone restriction in 2023. Twenty states now require bell-to-bell limits, and 15 others limit use less."
page:
  h1: "School Cell Phone Ban by State"
  quick_answer:
    - "Florida passed the first statewide school cell phone restriction in 2023, and 35 states now have a statewide law, order or board policy. Twenty of them require a bell-to-bell limit."
    - "Twenty-two states acted in 2025 alone, the biggest single year, after Florida, Louisiana and Indiana led the way. Seven more followed in 2026, including New Jersey in January and Illinois in July."
    - "Seven states limit phones only during instructional time, including Arizona, Iowa and Michigan, so students there can still use them at lunch or between classes."
  methodology: "Statewide laws, executive orders and state board policies restricting student cell phone use in K-12 public schools, as of October 31, 2026. Year enacted is the earliest statewide mandate found, and scope shows the current rule. Local district policies, nonbinding guidance and D.C. are excluded, as are states where sources disagreed on scope or timing (Georgia, Maryland, Ohio, Pennsylvania, Tennessee, Virginia, West Virginia, Wisconsin). Compiled from news reports and secondary trackers cross-checked against each other."
