sections:
  - id: first-state-to-ban-phones-in-schools
    icon: "fa-solid fa-mobile-screen"
    title: "First State to Ban Phones in Schools"
    paragraphs:
      - "Florida moved first. HB 379 became law in 2023 and barred students from using phones during instructional time in every grade, making it the first statewide school phone law in the country. Lawmakers tightened it in 2025 with HB 1105, which extends the ban to the whole school day in elementary and middle schools while high schools keep the class-time rule."
      - "California, Indiana, Louisiana, Minnesota and South Carolina followed in 2024. Louisiana went furthest with a bell-to-bell rule from 2024-25. Indiana began with a class-time limit and widened it to the full day with SEA 78 for 2026-27, a two-step path much like Florida's. Phones are one of several school-day rules that states set on their own, along with [school start times](/rankings/education/school-start-time-by-state)."
    table:
      columns:
        rank: "Rank"
        state: "State"
        scope: "Restriction"
        year_enacted: "Year enacted"
      rows:
        - { rank: 1, state: "Florida", scope: "Mixed by grade", year_enacted: "2023" }
        - { rank: 2, state: "California", scope: "District policy required", year_enacted: "2024" }
        - { rank: 2, state: "Indiana", scope: "Bell-to-bell", year_enacted: "2024" }
        - { rank: 2, state: "Louisiana", scope: "Bell-to-bell", year_enacted: "2024" }
        - { rank: 2, state: "Minnesota", scope: "District policy required", year_enacted: "2024" }
        - { rank: 2, state: "South Carolina", scope: "Bell-to-bell", year_enacted: "2024" }
  - id: school-phone-laws-passed-in-2025
    icon: "fa-solid fa-gavel"
    title: "School Phone Laws Passed in 2025"
    paragraphs:
      - "Twenty-two states, the most of any year, set their first statewide rules in 2025, from Alabama and Texas to New York and Vermont. The wave came soon after Jonathan Haidt's 2024 book The Anxious Generation argued that smartphones harm teen mental health, and it reached both red and blue states. Public schools are also where other fights play out, such as [banned books by state](/rankings/education/banned-books-by-state)."
      - "Not every rule came from a legislature. Oregon's is an executive order from Governor Tina Kotek, and Hawaii's 2026 rule is a Board of Education policy. Kansas, in 2026, goes further than most by requiring phones to be stored in a pouch, a locker or a vehicle."
  - id: bell-to-bell-vs-instructional-time-phone-bans
    icon: "fa-solid fa-bell"
    title: "Bell-to-Bell vs Class-Time Phone Bans"
    paragraphs:
      - "Bell-to-bell laws, which cover the day from first bell to last, are the most common form with 20 states. Seven states, listed below, limit phones only during instructional time, so students there can still use them at lunch or between classes. Michigan and Delaware joined that group in 2026."
      - "Two states split the rule by grade. Florida and Hawaii bar phones all day in elementary and middle schools but only during instruction in high school. Six more, including California and Colorado, leave the details to districts, which must write their own policy. Test results in these states appear in [public school rankings by state](/rankings/education/public-school-rankings-by-state)."
    table:
