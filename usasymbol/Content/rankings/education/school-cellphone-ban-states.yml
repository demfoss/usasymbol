faq:
  - question: "Which state banned phones in schools first?"
    answer: "Florida, with HB 379 in 2023. The law applied during class time in every grade, and a 2025 update added all-day limits for grades K-8."
  - question: "How many states ban cell phones in schools?"
    answer: "The table lists 35 states with a statewide law, order or board policy. Another 15 limit phones only in class, split the rule by grade, or make districts write their own policy, so they are not counted among the 20 with bell-to-bell rules."
  - question: "Which states have bell-to-bell phone bans?"
    answer: "Twenty states, including Louisiana, Texas, New York, Kansas and New Jersey. Louisiana's took effect first, in 2024-25, and Illinois starts last, in 2027-28."
  - question: "Is there a school cell phone ban in California?"
    answer: "California's 2024 law, AB 3216, requires every district to adopt a policy limiting or banning phones, with policies due by July 1, 2026. Each district decides how strict to be."
  - question: "Which states have no statewide school phone law?"
    answer: "Massachusetts, Mississippi, Montana and South Dakota had no statewide mandate as of October 31, 2026, so local districts decide. For other school-wide policy differences, see [states by K-12 education](/rankings/education/states-by-k12-education)."
  - question: "Is Oregon's school phone ban a law?"
    answer: "No, Oregon's rule comes from an executive order by Governor Tina Kotek in 2025. Districts had to adopt a ban and enforce it in full by early 2026."
