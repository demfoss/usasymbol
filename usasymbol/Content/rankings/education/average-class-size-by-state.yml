  - id: "pupil-teacher-ratio-vs-class-size"
    icon: "fa-solid fa-circle-question"
    title: "Is Pupil-Teacher Ratio the Same as Class Size?"
    paragraphs:
      - "No. Pupil-teacher ratio divides a state's total enrollment by every full-time-equivalent teacher on staff, including reading specialists, special education teachers, and other staff who don't lead a single classroom of students all day. Actual class sizes — the number of students a teacher instructs at one time — are typically higher than the ratio suggests, since not every teacher counted in the ratio is standing in front of a full class."
      - "NCES and most states publish pupil-teacher ratio rather than a true average class size because ratio data is collected consistently through staffing and enrollment counts, while class-size counts vary by grade, subject, and how each district reports co-taught or split classes. Some states, including Florida, set legal class-size caps by grade band, but those caps apply per classroom and aren't directly comparable to the statewide ratios in this table."

