page:
  h1: "Average Class Size by State"

  quick_answer:
    - "NCES does not publish a literal 'average class size' figure for every state. The closest official measure is the pupil-teacher ratio, which divides total student enrollment by the full-time-equivalent number of teachers on staff, including specialists who don't lead a full classroom. Actual classroom class sizes typically run higher than the ratio suggests."
    - "Arizona has the highest public school pupil-teacher ratio in the country at 22.8 students per teacher, followed by Utah (22.2), California (21.9), and Nevada (21.0)."
    - "Vermont has the lowest pupil-teacher ratio at 10.5 students per teacher. Maine (11.4), New Hampshire (11.5), New York (11.7), and Connecticut (11.7) round out the lowest five. The national average is 15.4 students per teacher."

  methodology: "Figures are 2022-23 school year data from the National Center for Education Statistics' Common Core of Data, the most recent year with complete state-level totals. The pupil-teacher ratio divides total public school student membership by the full-time-equivalent count of classroom teachers reported by each state; it is not the same as average class size, since it includes specialist and support teachers who don't oversee a single classroom of students. The District of Columbia is excluded to keep the ranking limited to the 50 states."

  sources:
    - name: "NCES Common Core of Data — 2022-23 State Summary"
      url: "https://nces.ed.gov/ccd/tables/202223_summary_2.asp"
      description: "Number of public schools, districts, student membership, teachers (FTE), and pupil/teacher ratio by state, school year 2022-23"
    - name: "NCES Digest of Education Statistics, Table 208.40"
      url: "https://nces.ed.gov/programs/digest/d22/tables/dt22_208.40.asp"
      description: "Historical public elementary and secondary pupil/teacher ratios by state"

