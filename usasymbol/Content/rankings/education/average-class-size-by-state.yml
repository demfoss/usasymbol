faq:
  - question: "Which state has the largest class sizes?"
    answer: "Based on pupil-teacher ratio, the closest available measure, Arizona has the highest ratio at 22.8 students per teacher. Utah (22.2) and California (21.9) rank second and third."

  - question: "Which state has the smallest class sizes?"
    answer: "Vermont has the lowest pupil-teacher ratio at 10.5 students per teacher, the only state below 11. Maine (11.4) and New Hampshire (11.5) rank second and third lowest."

  - question: "What is the average pupil-teacher ratio in the US?"
    answer: "The national public school pupil-teacher ratio was 15.4 students per teacher in the 2022-23 school year, according to NCES Common Core of Data totals of about 49.5 million students and 3.22 million FTE teachers."

  - question: "Is pupil-teacher ratio the same as average class size?"
    answer: "No. Pupil-teacher ratio divides total enrollment by every FTE teacher on staff, including specialists who don't run a single classroom. Actual average class sizes are typically higher than the statewide ratio because not every counted teacher is leading a full class at one time."

  - question: "What is the student-teacher ratio in California?"
    answer: "California's public school pupil-teacher ratio is 21.9 students per teacher, third highest in the country, across roughly 5.85 million students and 267,659 FTE teachers."

  - question: "What is the student-teacher ratio in Texas?"
    answer: "Texas has a pupil-teacher ratio of 14.8 students per teacher, close to the national average of 15.4, across about 5.52 million students and 373,332 FTE teachers, the largest teaching workforce of any state."

