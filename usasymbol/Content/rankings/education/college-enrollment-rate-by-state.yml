faq:
  - question: "Which state has the highest college enrollment rate?"
    answer: "Massachusetts, where 47.7% of 20 to 24 year olds are enrolled in school. Rhode Island is second at 46.2% and Utah third at 45.2%."
  - question: "Which state has the lowest college enrollment rate?"
    answer: "Alaska, at 18.2%. Montana is next lowest at 27.5%, so Alaska sits in a class of its own."
  - question: "What is the college enrollment rate in California?"
    answer: "California is at 44.4%, tied with Connecticut for 4th. Its enormous public system of community colleges, Cal State and University of California campuses reaches students in every region."
  - question: "What is the college enrollment rate in Texas and Florida?"
    answer: "Texas is at 34.9% and ranks 33rd. Florida is at 39.7% and ties Nebraska for 15th."
  - question: "Why is Utah's college enrollment rate so high?"
    answer: "Utah's 45.2% reflects a timing effect. Many young Latter-day Saints leave for missions at 18 or 19 and enroll after they return, which stacks students into the 20 to 24 age group. Compare it with the [college graduation rate by state](/rankings/education/college-graduation-rate-by-state)."
  - question: "Why is Alabama ranked so high for college enrollment?"
    answer: "Alabama is 8th at 42.0%, well above where it lands for adult bachelor's degrees. Large campuses in Tuscaloosa, Auburn and Birmingham keep many young people enrolled, though many graduates later move away."
  - question: "Is Washington D.C. included in this ranking?"
    answer: "No. The District of Columbia is not a state. The same survey puts it at 43.8%, which would place it between New Jersey and New York."
  - question: "Which states are tied for the same college enrollment rate?"
    answer: "Connecticut and California tie at 44.4% for 4th. North Dakota and Maryland share 40.9% at 12th, and West Virginia, Oklahoma and Mississippi tie at 32.4% for 39th."
