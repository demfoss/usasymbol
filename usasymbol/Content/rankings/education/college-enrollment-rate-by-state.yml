  title: "College Enrollment Rate by State 2026 | Map & Rankings"
  description: "Massachusetts has the highest college enrollment rate at 47.7% of 20 to 24 year olds. Rhode Island is second at 46.2% and Alaska is last at 18.2%."
page:
  h1: "College Enrollment Rate by State 2026"
  quick_answer:
    - "College enrollment is highest in Massachusetts, where 47.7% of 20 to 24 year olds are in school, thanks to the dense cluster of universities in Greater Boston."
    - "Alaska has the lowest rate at 18.2%, far below any other state. Few campuses, long distances and well-paid jobs that skip a degree send many young Alaskans elsewhere or straight to work."
    - "Utah ranks third at 45.2%, ahead of California and Connecticut. Many young Latter-day Saints serve missions first and then enroll in large numbers."
  methodology: "Share of residents 20 to 24 enrolled in school, nearly all in college or graduate school, from 2024 American Community Survey 1-year estimates (Census Bureau table B14003). The 50 states are ranked. The District of Columbia is excluded."
  sources:
