    icon: "fa-solid fa-person-hiking"
    title: "States With the Lowest College Enrollment"
    paragraphs:
      - "Alaska is last at 18.2%, more than nine points under Montana at 27.5%. The University of Alaska system is small and spread across a state with few roads, and many graduating seniors leave for colleges in the Lower 48. Oil, fishing and military posts such as Fort Wainwright pay young adults well without a degree."
      - "Nevada at 28.7% has a similar pull, since Las Vegas casinos and resorts hire thousands of young workers with no degree requirement. Washington at 31.5% ranks 44th even though it is high in [bachelor's degree attainment by state](/rankings/education/bachelors-degree-attainment-by-state). Seattle-area employers recruit graduates who studied elsewhere."
