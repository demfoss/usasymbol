sections:
  - id: why-massachusetts-has-the-highest-enrollment
    icon: "fa-solid fa-graduation-cap"
    title: "Why Massachusetts Has the Highest Enrollment"
    paragraphs:
      - "Massachusetts leads at 47.7% because it packs an unusual number of campuses into a small state. Harvard, MIT, Boston University, Northeastern and dozens of smaller colleges fill Greater Boston, and students in dorms are counted where they live, so arrivals from other states lift the figure too."
      - "Rhode Island follows at 46.2% with Brown, Providence College and the University of Rhode Island. Utah reaches 45.2% partly because many young Latter-day Saints serve missions of up to two years first, then enroll at Brigham Young University and the University of Utah. The [most educated states](/rankings/education/most-educated-us-states) ranking shows how the same Northeast campuses pay off later."
