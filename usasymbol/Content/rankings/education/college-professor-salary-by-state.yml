faq:
  - question: "How much does a college professor make in California?"
    answer: "California's other postsecondary teachers average $111,940 a year, with a $100,690 median. The state employs 37,770 in this category, the largest total reported."
  - question: "How much does a college professor make in Texas?"
    answer: "Texas averages $79,600 annually for other postsecondary teachers, with a $64,110 median. Postsecondary faculty may divide their time among teaching, advising, research, and committee work."
  - question: "What state pays college professors the most?"
    answer: "Massachusetts has the highest mean annual wage at $116,540 for this occupation. State and community college faculty are covered by collective bargaining structures negotiated through the state's higher education system."
  - question: "What state pays college professors the least?"
    answer: "Alabama has the lowest published mean at $52,760. The category is limited to postsecondary teachers not classified under one of the many subject-specific teaching occupations."
  - question: "Why are some college professors not included here?"
    answer: "College teaching is divided among many subject occupations, including law, economics, nursing, engineering, and history. This page uses the residual all-other category, so it should not be read as a combined wage for every professor."
  - question: "Does a college professor's subject affect pay?"
    answer: "Subject matters because many disciplines have their own occupational code and labor market. Student costs form a separate question covered in [college tuition by state](/rankings/education/college-tuition-by-state), while [teacher salary by state](/rankings/education/teacher-salary-by-state) covers classroom teachers outside higher education."
