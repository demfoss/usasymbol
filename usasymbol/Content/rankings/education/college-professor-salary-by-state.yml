page:
  h1: "College Professor Salary by State 2026"
  quick_answer:
    - "College professor salary by state is highest in Massachusetts at $116,540 for postsecondary teachers not assigned to another subject-specific occupation. Public faculty work under statewide collective bargaining agreements."
    - "Alabama has the lowest published average at $52,760. The category covers a residual group of college teachers, so each state's mix of subjects and institutions matters."
    - "California employs 37,770 postsecondary teachers in this category, far more than any other state. Large universities may combine classroom teaching with research, publishing, grants, and graduate supervision."
  methodology: "BLS OEWS May 2025, SOC 25-1099, ranks 47 states with published mean annual wages. Alaska, Mississippi and South Dakota have no published rows. Hourly wages are unavailable."
