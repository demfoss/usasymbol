faq:
  - question: "Is Harvard the oldest college in the United States?"
    answer: "Harvard University, established in 1636, is the oldest institution of higher education in the United States. It predates the next oldest school, William and Mary, by nearly 60 years."

  - question: "What are the 10 oldest colleges in the United States?"
    answer: "The 10 oldest include the Colonial Nine (Harvard, William and Mary, Yale, Princeton, Columbia, Penn, Brown, Rutgers, and Dartmouth) followed by the University of Delaware, tracing its origins to 1743."

  - question: "Which colleges are older than the United States?"
    answer: "There are nine colleges older than the United States, known as the Colonial Colleges. These institutions were chartered before the Declaration of Independence in 1776 and operated under British royal or colonial authority."

  - question: "What is the second oldest college in the United States?"
    answer: "The College of William and Mary is the second oldest, founded in 1693. It holds several firsts, including the first law school and the first collegiate honor society (Phi Beta Kappa)."

  - question: "What is the oldest state college in the United States?"
    answer: "The University of Georgia was the first to be chartered as a state university in 1785, though the University of North Carolina at Chapel Hill was the first public university to open its doors to students in 1795."

