  description: "Hawaii has the highest private school enrollment rate at 19.7% of K-12 students. Wyoming has the lowest at 2.7%, followed by Utah at 3.2%."

page:
  h1: "Private School Enrollment Rate by State"

  quick_answer:
    - "Hawaii has the highest private school enrollment rate of any state, 19.7% of its K-12 students, about 40,959 of 207,761 total students. New Hampshire (16.4%) and Louisiana (15.5%) follow."
    - "Wyoming has the lowest rate at 2.7%, just 2,533 of its 92,468 K-12 students. Utah ranks second lowest at 3.2%, less than a sixth of Hawaii's share."
    - "Across the 50 states, the average private school enrollment rate is about 10.4%. Northeastern and mid-Atlantic states cluster at the top, while Utah and Wyoming sit well below every other state."

  methodology: "Figures are calculated from private and total K-12 enrollment counts compiled from the National Center for Education Statistics Private School Universe Survey and Common Core of Data, State Nonfiscal Survey. Rates are private enrollment divided by combined public and private K-12 enrollment, rounded to one decimal place."

  sources:
    - name: "National Center for Education Statistics (NCES) — Private School Universe Survey (PSS)"
      url: "https://nces.ed.gov/surveys/pss/"
      description: "Biennial survey of private elementary and secondary school enrollment by state"
    - name: "National Center for Education Statistics (NCES) — Common Core of Data (CCD)"
      url: "https://nces.ed.gov/ccd/"
      description: "State Nonfiscal Survey of public elementary/secondary school enrollment by state"
    - name: "NCES — Condition of Education, Private School Enrollment indicator"
      url: "https://nces.ed.gov/programs/coe/indicator/cgc/private-school-enrollment"
      description: "National summary indicator confirming the state range for private school enrollment share"

