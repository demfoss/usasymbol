faq:
  - question: "What state has the highest private school enrollment rate?"
    answer: "Hawaii, at 19.7% of its K-12 students, about 40,959 of 207,761 total students. New Hampshire ranks second at 16.4%."

  - question: "What state has the lowest private school enrollment rate?"
    answer: "Wyoming has the lowest rate at 2.7%, just 2,533 private school students out of 92,468 total. Utah is the only other state under 5%, at 3.2%."

  - question: "What percentage of K-12 students attend private school in the United States?"
    answer: "Across the 50 states, the average private school enrollment rate is about 10.4%, based on 5.67 million private school students out of roughly 54.6 million total K-12 students."

  - question: "Which states have the most private school students?"
    answer: "Florida leads with 480,040 private school students, followed by California at 660,172... actually California has more students than Florida. California has the most private school students at 660,172, followed by Florida at 480,040 and New York at 424,309, even though none of the three ranks in the top five by rate."

  - question: "Is private school enrollment higher in the Northeast?"
    answer: "Several Northeastern and mid-Atlantic states rank near the top. New Hampshire (16.4%), Vermont (15.0%), Rhode Island (14.6%), New York (14.5%), and Pennsylvania (14.1%) all place in the top nine, alongside Louisiana (15.5%) and Wisconsin (15.5%) from outside the region."

