faq:
  - question: "How much does a substitute teacher make in Alaska?"
    answer: "Alaska's median annual wage is $66,920, and the mean hourly wage is $35.13. Anchorage hires substitutes for both full-day and half-day coverage, so an assignment can fill only part of a school day."
  - question: "How much does a substitute teacher make in California?"
    answer: "California substitutes average $62,910 annually, with a $60,300 median. Classroom management is central to the work because the substitute takes charge of a class whose usual teacher is away."
  - question: "How much does a substitute teacher make in Texas?"
    answer: "Texas substitutes average $32,760 annually. Following the absent teacher's prepared lesson keeps students working on their existing course rather than starting a separate curriculum."
  - question: "How much does a substitute teacher make in New York?"
    answer: "New York substitutes average $47,760 annually or $22.96 an hour. Leaving notes about completed work and classroom issues helps the returning teacher resume the lesson sequence."
  - question: "How much does a substitute teacher make in Oregon?"
    answer: "Oregon substitutes average $61,100 annually. State law ties a minimum daily rate to beginning teacher pay, and requires payment for mandatory assignment training. Substitute teachers covered by a district bargaining unit follow a separate agreement."
  - question: "What is the median substitute teacher salary in Hawaii?"
    answer: "Hawaii's median annual wage is $58,530. Its public schools use daily pay classes based on education and teaching background, and substitutes may contribute to a tax-sheltered retirement plan."
