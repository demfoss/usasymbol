    title: "States With the Most Substitute Teacher Jobs"
    paragraphs:
      - "California employs 115,660 short-term substitutes. The job is broader than presenting a lesson, covering classroom rules, student questions and support for children with special educational needs. A substitute may also supervise school activities, which connects classroom coverage to the wider [school day and year](/rankings/education/number-of-days-in-school-year-by-state)."
