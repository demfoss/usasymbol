  - id: why-substitute-teacher-pay-varies
    icon: "fa-solid fa-scale-balanced"
    title: "Why Substitute Teacher Pay Varies"
    paragraphs:
      - "Alaska's $73,070 average has a concrete counterpart in Anchorage's pay structure. The district pays more to substitutes with professional teaching credentials or prior service as its teachers, and adds a supplement for assignments in Title I schools. Those premiums offer one route to higher pay within temporary classroom work."
      - "Mississippi's $25,610 average sits alongside flat daily substitute pay funded through local [school operating budgets](/rankings/education/school-spending-by-state). Lowndes County's personnel policy pays short-term substitutes wholly from district funds, and Jackson lists separate rates for full-day and half-day classroom coverage."
  - id: states-with-the-most-substitute-teacher-jobs
