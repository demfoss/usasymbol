page:
  h1: "Substitute Teacher Salary by State"
  quick_answer:
    - "Substitute teacher salary by state is highest in Alaska at $73,070 annually. Anchorage offers extra pay for certain school assignments and recognizes professional teaching experience through a higher daily rate."
    - "Mississippi has the lowest average at $25,610. Short-term substitute pay comes from local district funds, placing classroom coverage directly on each district's operating budget."
    - "California employs 115,660 short-term substitutes. Their work keeps classes moving with the absent teacher's lesson plans, rather than taking permanent responsibility for a class."
  methodology: "BLS OEWS May 2025, SOC 25-3031, annualized at 2,080 hours, excluding DC, self-employment and long-term classroom teachers. Colorado has no estimate, employment is suppressed in Delaware and Maine."
