faq:
  - question: "How much does a school principal make in California?"
    answer: "California school principals and other K-12 education administrators average $152,480 a year, with a $159,950 median. Principals normally reach the role after teaching and completing graduate study in education leadership."
  - question: "How much does a school principal make in Texas?"
    answer: "Texas school principals average $96,510 annually, with a $93,910 median. Texas also has 37,140 jobs in the occupation, more than any other state."
  - question: "What state pays school principals the most?"
    answer: "Washington pays the highest mean annual wage at $160,570. Its school personnel system collects district-reported salary and contract information for certificated principals."
  - question: "What state pays school principals the least?"
    answer: "West Virginia has the lowest mean annual wage at $81,700. Principals in smaller districts may handle duties that larger systems assign to curriculum, human resources, or operations specialists."
  - question: "Do school principals work during summer?"
    answer: "Principals typically work year round. Summer responsibilities include hiring, ordering supplies, and arranging building maintenance before students return, which differs from many classroom schedules described in [teacher salary by state](/rankings/education/teacher-salary-by-state)."
  - question: "What does a school principal do?"
    answer: "Principals manage school staff, schedules, budgets, curriculum standards, student discipline, and safety procedures. Their resource decisions connect directly to the wider patterns in [school spending by state](/rankings/education/school-spending-by-state)."
