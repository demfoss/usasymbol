page:
  h1: "School Principal Salary by State 2026"
  quick_answer:
    - "School principal salary by state is highest in Washington at $160,570 a year. The state's school personnel reports separately track certificated principals and their contracted workdays."
    - "West Virginia has the lowest published average at $81,700. Smaller districts can give principals broader duties because large districts are more likely to employ specialized administrative staff."
    - "Texas employs 37,140 school administrators, the largest state total. The occupation covers principals and other kindergarten through secondary education administrators."
  methodology: "BLS OEWS May 2025, SOC 11-9032, ranks the 50 states by mean annual wage. BLS publishes annual wages only for this occupation, so hourly fields are unavailable."
