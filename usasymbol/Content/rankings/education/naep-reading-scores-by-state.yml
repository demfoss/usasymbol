page:
  h1: "Reading Scores by State 2026"
  quick_answer:
    - "Massachusetts has the highest reading scores in the country, 268 in eighth grade and 225 in fourth grade, a lead built on school funding and testing reforms that began in 1993."
    - "New Mexico has the lowest reading scores, 245 in eighth grade and 201 in fourth grade. A state court ruled in 2018 that its schools were failing Native American, English learner and low-income students."
    - "Mississippi's fourth graders score 219, level with Connecticut and Utah. Its eighth graders score 253, level with Florida and Nevada."
