sections:
  - id: why-massachusetts-leads-in-reading-scores
    icon: "fa-solid fa-book-open"
    title: "Why Massachusetts Leads in Reading Scores"
    paragraphs:
      - "Massachusetts is first in both grades, at 268 in eighth grade and 225 in fourth. The groundwork was the 1993 Education Reform Act, which raised school funding through a foundation formula, a pattern also visible in [school spending by state](/rankings/education/school-spending-by-state). The law paired the money with statewide learning standards and the MCAS exams."
      - "New Mexico sits at the other end with 245 in eighth grade and 201 in fourth. In 2018 a state court ruled in the Yazzie/Martinez case that New Mexico was failing to give Native American students, English learners and low-income students an adequate education, and ordered the state to fix it."
  - id: highest-4th-grade-reading-scores-by-state
    icon: "fa-solid fa-child-reaching"
    title: "Highest 4th Grade Reading Scores by State"
    paragraphs:
      - "Wyoming shares second place in fourth grade with New Jersey at 222, yet its eighth graders score 260, tied with Minnesota, Ohio, South Dakota and Wisconsin. Strong early reading did not carry the same lead into middle school."
      - "Mississippi's fourth graders score 219, ahead of Texas at 212 and level with Connecticut and Utah. In 2013 the state passed the Literacy-Based Promotion Act, which required early reading screening, coaching for teachers and a reading gate for third graders. Its eighth graders score 253."
