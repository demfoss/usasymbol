faq:
  - question: "Which state has the highest NAEP reading score?"
    answer: "Massachusetts leads both grades. New Jersey is next in eighth grade at 266, and in fourth grade New Jersey and Wyoming share second at 222."
  - question: "Which state has the lowest reading score?"
    answer: "New Mexico ranks last in both grades. Alaska is one point ahead in eighth grade at 246, and West Virginia follows at 247."
  - question: "What is the average reading score in Texas?"
    answer: "Texas eighth graders average 252, which ranks 44th, and fourth graders average 212. Both fall below the national public school averages of 257 and 214."
  - question: "What is the average reading score in California?"
    answer: "California eighth graders average 254, tied with Arizona and South Carolina at 38th, and fourth graders average 212."
  - question: "What does the NAEP reading test measure?"
    answer: "The National Assessment of Educational Progress, known as the Nation's Report Card, tests a sample of fourth and eighth graders on a 0 to 500 reading scale. Individual students get no score, so the results describe states and not children. High school students show up in [SAT scores by state](/rankings/education/sat-scores-by-state), which only count students who choose to test."
  - question: "How many states score above the national average in eighth grade reading?"
    answer: "Twenty-three states score above 257, led by Massachusetts. Hawaii, Louisiana, New York, North Dakota and Vermont match it exactly."
