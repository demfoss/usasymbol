faq:
  - question: "Which state has the highest IQ?"
    answer: "Massachusetts, at 104.3. Vermont and North Dakota tie for third overall at 103.8 each."

  - question: "Which state has the lowest IQ?"
    answer: "Mississippi, at 94.2. Louisiana and California follow closely at 95.3 and 95.5."

  - question: "What is the average IQ in the United States?"
    answer: "100.3, the national average. Massachusetts and New Hampshire are the only two states above 104."

  - question: "Is New Hampshire or Massachusetts the smartest state?"
    answer: "Massachusetts has the higher average IQ, 104.3 versus New Hampshire's 104.2, a gap of just 0.1 points. New Hampshire's composite intelligence index of 56.82 is the highest of any state, ahead of Massachusetts's own 51.83 on that same measure."

  - question: "Which state has the highest smartest-states composite score?"
    answer: "Massachusetts, at 93.9, more than 20 points above Connecticut, the second-highest state at 73.8."

  - question: "Which state has the lowest smartest-states composite score?"
    answer: "West Virginia, at 12.6, the lowest of any state."

