page:
  h1: "Smartest States"

  quick_answer:
    - "Smartest states ranked by listed average IQ put Massachusetts first at 104.3. Harvard, MIT, and research employers form a concentration of advanced education around Cambridge and Boston."
    - "Mississippi has the lowest listed average IQ at 94.2. Access to schooling and household resources shape educational outcomes, making opportunity part of the context for a statewide comparison."
    - "New Hampshire leads the separate intelligence index at 56.82. That index combines educational and economic measures with IQ, so changing the yardstick changes the winner."

  methodology: "World Population Review compiles undated average IQ values, Guru99's 2024 intelligence index, and Penn Stakes' 2022 index. Guru99 omits 20 middle-ranked states. The indices use different inputs and scales."

