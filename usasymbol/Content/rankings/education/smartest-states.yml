faq:
  - question: "Which state has the highest IQ?"
    answer: "Massachusetts has the highest listed average IQ at 104.3. Cambridge's universities and the Boston area's research employers bring advanced education and technical work into the same local economy."

  - question: "Which state has the lowest IQ?"
    answer: "Mississippi has the lowest listed average IQ at 94.2. The compilation leaves the reference year unspecified, while its separate composite rankings use dated educational and economic indicators."

  - question: "What is the average IQ in California?"
    answer: "California's listed average IQ is 95.5, placing it 48th in this table. A statewide average combines different communities and educational backgrounds within a large population."

  - question: "Is New Hampshire or Massachusetts the smartest state?"
    answer: "Massachusetts leads on average IQ at 104.3, while New Hampshire leads the intelligence index at 56.82. IQ and a combined education-and-economy index measure different things, so the answer depends on the chosen metric."

  - question: "Which state has the highest smartest-states composite score?"
    answer: "Massachusetts leads the smartest-states composite at 93.9. The score includes educational credentials and admission tests, rather than measuring intelligence through a single test administered to all adults."

  - question: "Which state has the lowest smartest-states composite score?"
    answer: "West Virginia has the lowest smartest-states composite at 12.6. Mississippi is last on average IQ instead, illustrating how an index's inputs can change the bottom of the list as well as the top."

