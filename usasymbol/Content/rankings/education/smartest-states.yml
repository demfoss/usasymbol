sections:
  - id: "states-with-the-highest-average-iq"
    icon: "fa-solid fa-arrow-up"
    title: "Why Massachusetts Leads Average IQ"
    paragraphs:
      - "Massachusetts leads at 104.3 and is home to Harvard and MIT in Cambridge. Universities and research employers attract highly educated workers, giving its population a concentration of advanced study and technical employment. Schooling and the population represented in a measure influence aggregate educational comparisons."
      - "Mississippi's 94.2 puts it last under the same measure. Access to schooling and household resources affect educational opportunity, giving state averages a social and educational context. [Educational attainment](/rankings/education/most-educated-us-states) adds the share of adults who have completed credentials, another way to examine that opportunity."
    table:
      columns:
        rank: "Rank"
        state: "State"
        avg_iq: "Average IQ"
      rows:
        - {rank: 1, state: "Massachusetts", state_slug: "massachusetts", avg_iq: 104.3}
        - {rank: 2, state: "New Hampshire", state_slug: "new-hampshire", avg_iq: 104.2}
        - {rank: 3, state: "Vermont", state_slug: "vermont", avg_iq: 103.8}
        - {rank: 4, state: "North Dakota", state_slug: "north-dakota", avg_iq: 103.8}
        - {rank: 5, state: "Minnesota", state_slug: "minnesota", avg_iq: 103.7}
        - {rank: 6, state: "Montana", state_slug: "montana", avg_iq: 103.4}
        - {rank: 7, state: "Maine", state_slug: "maine", avg_iq: 103.4}
        - {rank: 8, state: "Iowa", state_slug: "iowa", avg_iq: 103.2}
        - {rank: 9, state: "Connecticut", state_slug: "connecticut", avg_iq: 103.1}
        - {rank: 10, state: "Wisconsin", state_slug: "wisconsin", avg_iq: 102.9}

  - id: "states-with-the-lowest-average-iq"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Highest Intelligence Index"
    paragraphs:
      - "New Hampshire leads the intelligence index at 56.82, although Massachusetts has the higher average IQ. The combined measure also uses graduation, literacy, test scores, diploma attainment, and economic output per person. A lead in one ingredient does not guarantee the highest combined score."
      - "Connecticut has an average IQ of 103.1 but no reported intelligence-index value. Only the highest and lowest groups were included in this index's published compilation, so a blank is an exclusion rather than a score of zero."
    table:
      columns:
        state: "State"
        intelligence_index: "Intelligence Index"
      rows:
        - {state: "New Hampshire", state_slug: "new-hampshire", intelligence_index: 56.82}
        - {state: "Minnesota", state_slug: "minnesota", intelligence_index: 55.82}
        - {state: "Wyoming", state_slug: "wyoming", intelligence_index: 54.98}
        - {state: "Vermont", state_slug: "vermont", intelligence_index: 54.91}
        - {state: "Montana", state_slug: "montana", intelligence_index: 54.64}
        - {state: "North Dakota", state_slug: "north-dakota", intelligence_index: 54.38}
        - {state: "Maine", state_slug: "maine", intelligence_index: 53.83}
        - {state: "South Dakota", state_slug: "south-dakota", intelligence_index: 52.61}
        - {state: "Wisconsin", state_slug: "wisconsin", intelligence_index: 52.45}
        - {state: "Iowa", state_slug: "iowa", intelligence_index: 52.04}

  - id: "which-state-is-actually-the-smartest"
    icon: "fa-solid fa-brain"
    title: "Smartest States by Composite Score"
    paragraphs:
      - "Massachusetts leads the other composite at 93.9, with Connecticut next at 73.8. That measure combines IQ with diploma and degree attainment and college-admission test scores. Its scale differs from the intelligence index, so 93.9 and 56.82 are not directly comparable."
      - "Maryland's composite score of 72.8 sits near the top despite its average IQ of 99.7. Adult credentials and school test results describe different populations, which is also why a [public school ranking](/rankings/education/public-school-rankings-by-state) need not follow this ordering."
    table:
      columns:
        state: "State"
        smartest_index: "Composite Score"
      rows:
