page:
  h1: "Smartest States in the U.S."

  quick_answer:
    - "Massachusetts is the smartest state in the country by average IQ, 104.3, narrowly ahead of New Hampshire's 104.2."
    - "Mississippi has the lowest average IQ of any state at 94.2, a full 10.1 points behind Massachusetts."
    - "New Hampshire leads a separate composite intelligence index at 56.82, the highest of any state, even though Massachusetts posts the higher raw IQ score. Massachusetts also posts a smartest-states composite score of 93.9, more than 20 points above second-ranked Connecticut's 73.8."

  methodology: "Average IQ, the Guru99 Most & Least Intelligent States Index (2024), and the Penn Stakes Smartest/Dumbest States Index (2022) come from the same compilation, though Guru99 figures are on record for only 30 of the 50 states."

  sources:
