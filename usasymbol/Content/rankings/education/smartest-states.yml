sections:
  - id: "states-with-the-highest-average-iq"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest Average IQ"
    paragraphs:
      - "Massachusetts posts the highest average IQ of any state at 104.3, just ahead of New Hampshire at 104.2. Vermont and North Dakota tie for third at 103.8 each."

  - id: "states-with-the-lowest-average-iq"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest Average IQ"
    paragraphs:
      - "Mississippi has the lowest average IQ of any state at 94.2, followed by Louisiana at 95.3 and California at 95.5. All three sit at least 8.8 points below Massachusetts, the top-ranked state."

  - id: "which-state-is-actually-the-smartest"
    icon: "fa-solid fa-brain"
    title: "Which State Is Actually the Smartest?"
    paragraphs:
      - "New Hampshire leads a separate composite intelligence index at 56.82, the highest of any state, ahead of Massachusetts's 51.83, even though Massachusetts posts the higher average IQ. On a third measure, Massachusetts leads by a wide margin, posting a composite score of 93.9 versus Connecticut's 73.8, the next closest state."

