sections:
  - id: why-oregon-has-highest-absenteeism
    icon: "fa-solid fa-school"
    title: "Why Oregon Has the Highest Absenteeism"
    paragraphs:
      - "Oregon leads at 43.8%. Housing instability, student mental health needs, transportation barriers, and illness have all figured in the state's attendance response, which funds regional teams to reconnect students with school."
      - "New Mexico follows at 43.1%, and Alaska reaches 42.5%. Attendance problems can compound learning gaps measured in [NAEP reading scores by state](/rankings/education/naep-reading-scores-by-state)."
  - id: states-with-lowest-chronic-absenteeism
    icon: "fa-solid fa-user-check"
    title: "States With the Lowest Chronic Absenteeism"
    paragraphs:
      - "New Jersey has the lowest rate at 16.7%, followed by Idaho at 16.9%. New Jersey requires districts to investigate repeated unexcused absences and build action plans, giving schools a formal trigger for contacting families before missed days accumulate."
      - "Virginia follows at 19.1%, while Connecticut is at 19.3%. Virginia also combines compulsory attendance enforcement with school-level teams that review barriers such as transportation, health, and housing instability."
  - id: chronic-absenteeism-and-graduation
    icon: "fa-solid fa-school"
    title: "Chronic Absenteeism and Graduation"
    paragraphs:
      - "Oregon's 43.8% means more than two in five students crossed the chronic-absence threshold. Missing one day every two weeks can be enough to reach 10% of a school year, which reduces time for sequential subjects such as algebra and reading instruction."
      - "The [high school graduation rates by state](/rankings/education/high-school-graduation-rates-by-state) ranking tracks a later milestone affected when students lose sustained contact with teachers and coursework."

