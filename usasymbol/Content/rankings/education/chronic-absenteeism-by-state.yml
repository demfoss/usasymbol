faq:
  - question: "Which state has the highest chronic absenteeism rate?"
    answer: "Oregon has the highest rate at 43.8%. State attendance initiatives focus on barriers including housing instability, student mental health needs, transportation, and illness."
  - question: "Which state has the lowest chronic absenteeism rate?"
    answer: "New Jersey has the lowest rate at 16.7%. Idaho follows at 16.9%, and Virginia is next at 19.1%."
  - question: "What counts as chronic absenteeism?"
    answer: "A student is chronically absent after missing at least 10% of the school days for which the student was enrolled. Both excused and unexcused missed days can count."
  - question: "What is the chronic absenteeism rate in California?"
    answer: "California's rate is 27.7%, placing it 23rd among the states."
  - question: "What is the chronic absenteeism rate in Texas?"
    answer: "Texas reports 23.0% and ranks 38th among the states."
  - question: "How many absences make a student chronically absent?"
    answer: "Ten percent of enrolled school days is the threshold. In a 180-day year, that equals 18 missed days, or roughly two days per month."

