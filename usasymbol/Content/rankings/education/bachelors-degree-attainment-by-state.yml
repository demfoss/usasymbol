page:
  h1: "Bachelor's Degree Attainment by State 2026"
  quick_answer:
    - "Bachelor's degree attainment is highest in Massachusetts, where 48.3% of adults 25 and older hold at least a bachelor's degree, thanks to Boston's colleges, hospitals and biotech labs."
    - "West Virginia has the lowest rate at 24.4%. Coal and timber paid steady wages without a diploma for generations, and steep terrain left many towns far from any campus."
    - "Colorado ranks second at 47.8%, ahead of older college states such as Vermont and Maryland. Aerospace, tech and mountain living keep drawing graduates from other states."
  methodology: "Share of residents 25 and older with a bachelor's degree or higher, 2024 American Community Survey 1-year estimates from the Census Bureau (table S1501), rounded to one decimal. The 50 states are ranked. The District of Columbia is excluded."
