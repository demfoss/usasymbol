  - id: why-west-virginia-has-the-lowest-rate
    title: "Why West Virginia Has the Lowest Rate"
    paragraphs:
      - "West Virginia trails at 24.4%, with Mississippi at 27.0% and Arkansas at 27.1% just above the bottom. Coal mining, timber and heavy industry paid good wages to workers without degrees for generations, so a diploma was never the only road to a stable income."
      - "Steep Appalachian terrain also left many communities a long drive from any campus, and graduates often leave for jobs in other states. Mississippi and Arkansas share large rural stretches where the same pattern holds. Compare the [least educated states](/rankings/education/least-educated-states) list for more on the bottom of the table."
