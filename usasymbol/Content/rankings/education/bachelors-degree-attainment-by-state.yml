faq:
  - question: "Which state has the highest percentage of bachelor's degrees?"
    answer: "Massachusetts, where 48.3% of adults 25 and older hold a bachelor's degree or higher. Colorado is close behind at 47.8%, and Vermont is third at 45.1%."
  - question: "Which state has the lowest percentage of college graduates?"
    answer: "West Virginia, at 24.4%. Mississippi is next lowest at 27.0%."
  - question: "What percent of adults in California have a bachelor's degree?"
    answer: "California is at 38.1%, which ranks 15th among the states. Large tech, entertainment and university employers pull its rate above the national middle."
  - question: "Why is Colorado ranked so high for education?"
    answer: "Colorado's 47.8% owes a lot to migration. Employers in Denver, Boulder and Colorado Springs recruit graduates from across the country, and many of them stay for the mountains."
  - question: "Is Washington D.C. included in this ranking?"
    answer: "No. The District of Columbia is not a state, and the same 2024 survey puts it at 65.5%, well above Massachusetts. Federal agencies, law firms and think tanks fill it with degree holders."
  - question: "What is the bachelor's degree rate in Texas and Florida?"
    answer: "Texas is at 35.2% and ranks 27th. Florida is at 35.8% and ranks 25th, just ahead."
  - question: "Which states are tied for the same bachelor's degree rate?"
    answer: "Oregon and Hawaii tie at 37.8% for 16th. Maine and North Carolina tie at 37.1% for 18th, and Ohio and Tennessee share 32.4% at 37th."
