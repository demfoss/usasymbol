sections:
  - id: why-massachusetts-has-the-highest-rate
    title: "Why Massachusetts Has the Highest Rate"
    paragraphs:
      - "Massachusetts leads at 48.3% because it began building colleges earlier than any other state. Harvard opened in 1636, and a 1647 colonial law ordered larger towns to run schools. Four centuries later, Greater Boston packs Harvard, MIT and dozens of other campuses beside teaching hospitals and the biotech labs of Kendall Square."
      - "Graduates stay because degree-level jobs sit next to campus. Maryland and Virginia reach the top six for a different reason, since federal agencies and contractors around Washington hire heavily from colleges. For graduate-level credentials, see the [most educated states](/rankings/education/most-educated-us-states) ranking."
