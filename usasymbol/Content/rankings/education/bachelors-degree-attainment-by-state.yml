  - id: colorado-and-nevada-outliers
    title: "Colorado and Nevada, Two Western Outliers"
    paragraphs:
      - "Colorado sits at 47.8%, second only to Massachusetts, while neighboring states such as Wyoming at 32.3% and New Mexico at 31.8% sit far lower. Boulder's university and research labs, the Air Force Academy, Denver's tech and aerospace employers and the ski and hiking lifestyle draw young graduates who were educated elsewhere."
      - "Nevada at 28.5% shows the opposite pull. Casino resorts and hospitality in Las Vegas employ huge numbers of workers in jobs that rarely ask for a degree. Compare these figures with the [college graduation rate by state](/rankings/education/college-graduation-rate-by-state)."
