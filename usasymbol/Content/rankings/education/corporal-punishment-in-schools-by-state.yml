  title: "Corporal Punishment in Schools by State | Map & Laws"
  description: "Thirty-three states ban corporal punishment in public schools by law. New Jersey acted first in 1867, and Colorado and Idaho joined in 2023."
page:
  h1: "Corporal Punishment in Schools by State"
  quick_answer:
    - "Corporal punishment in public schools is banned by law in 33 states, starting with New Jersey in 1867. Massachusetts followed in 1971, and Colorado and Idaho became the newest in 2023."
    - "Seven states still allow school paddling with no state limit, Alabama, Arkansas, Georgia, Indiana, Missouri, South Carolina and Texas. Arizona, Kansas and Wyoming have no ban either, though no use is reported."
    - "The Supreme Court ruled in Ingraham v. Wright in 1977 that school paddling does not violate the Eighth Amendment. That left each state to decide, and 1989 was the busiest year, with eight states banning it."
  methodology: "Status of corporal punishment in public K-12 schools as retrieved in November 2026 from Wikipedia's article on school corporal punishment in the United States. Year banned is shown only for states with a full statewide ban. D.C. (1977) is excluded."
