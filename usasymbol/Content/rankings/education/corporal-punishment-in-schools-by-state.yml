sections:
  - id: first-state-to-ban-corporal-punishment-in-schools
    icon: "fa-solid fa-gavel"
    title: "First State to Ban Corporal Punishment"
    paragraphs:
      - "New Jersey outlawed corporal punishment in schools in 1867, more than a century before any other state. Massachusetts came next in 1971, then Hawaii in 1973 and Maine in 1975. Rhode Island followed in 1977 and New Hampshire in 1983, so most of the early movement ran through New England."
      - "The 1980s and 1990s brought the big wave. In 1989 alone, Alaska, Connecticut, Iowa, Michigan, Minnesota, North Dakota, Oregon and Virginia all passed bans. Colorado and Idaho are the newest in 2023, while Pennsylvania, Ohio and New Mexico acted between 2005 and 2011."
