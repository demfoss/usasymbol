faq:
  - question: "Which states still allow corporal punishment in schools?"
    answer: "Twelve states have no ban of any kind. They are Alabama, Arkansas, Georgia, Indiana, Missouri, South Carolina, Texas, Arizona, Kansas, Wyoming, Florida and Louisiana, the last two requiring parental consent. Mississippi, Oklahoma and Tennessee ban it only for students with disabilities."
  - question: "Is corporal punishment legal in Texas schools?"
    answer: "Yes, Texas has no statewide ban, so each school district decides whether to allow paddling. Texas is also among the five states that accounted for about 70 percent of paddled students in 2011-12."
  - question: "Did the Supreme Court ban corporal punishment in schools?"
    answer: "No, the Court did the opposite. Ingraham v. Wright, decided in 1977, held that the Eighth Amendment's ban on cruel and unusual punishment does not cover school discipline."
  - question: "Is corporal punishment legal in private schools?"
    answer: "In most states, yes. New Jersey, Iowa, Illinois, Maryland and New York ban it in private schools too, with the last three acting in 2023 or 2024."
  - question: "Which states banned corporal punishment most recently?"
    answer: "Colorado and Idaho, both in 2023. Kentucky's districts finished dropping the practice by November 2023, though the state has no law."
