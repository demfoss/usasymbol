    icon: "fa-solid fa-school-lock"
    title: "States That Still Allow Corporal Punishment"
    paragraphs:
      - "Alabama, Arkansas, Georgia, Indiana, Missouri, South Carolina and Texas have no state ban. Paddling is concentrated in a few of them, and in 2011-12 about 70 percent of the students who were paddled attended schools in Alabama, Arkansas, Georgia, Mississippi or Texas. School boards make the call, and many districts have dropped the practice on their own."
      - "The Supreme Court left the door open. In Ingraham v. Wright in 1977, it ruled 5-4 that paddling does not violate the Eighth Amendment, after a Florida junior high student was struck so hard he needed medical treatment. With no federal rule, each state decides for itself."
