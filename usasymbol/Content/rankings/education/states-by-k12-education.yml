faq:
  - question: "Which state has the best K-12 education"
    answer: "Massachusetts ranks first for K-12 education according to US News & World Report. The state consistently scores highest on NAEP reading and math assessments, has a graduation rate above 90%, and invests heavily in teacher training and certification. Massachusetts also reformed its education funding formula in the 1990s to reduce inequity between wealthy and poor districts."
  - question: "Which states have the worst K-12 education"
    answer: "New Mexico, Nevada, and West Virginia consistently rank near the bottom of K-12 education rankings. These states have lower per-pupil spending, higher rates of child poverty (a strong predictor of educational outcomes), larger shares of English-language learners, and below-average graduation rates."
  - question: "What factors determine K-12 education rankings"
    answer: "US News weights four main factors: pre-K enrollment (10%), NAEP test scores in 4th and 8th grade reading and math (40%), high school graduation rates (40%), and college readiness (10%). NAEP is often called the 'Nation's Report Card' and is administered every two years to a nationally representative sample of students."
  - question: "Does education spending predict state ranking"
    answer: "Spending correlates with rankings but does not determine them. New York and Wyoming spend among the most per pupil but rank outside the top five. Massachusetts spends above average and pairs it with strong accountability standards. Outcomes depend on how money is spent, not just how much."

