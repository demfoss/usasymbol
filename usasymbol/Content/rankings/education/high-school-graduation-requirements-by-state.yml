faq:
  - question: "How many credits do you need to graduate high school?"
    answer: "It varies by state, from 11 in Maine up to 24 in 13 states, including Alabama, Florida, and Hawaii."

  - question: "Which states require the most credits to graduate high school?"
    answer: "13 states tie at 24 credits: Alabama, Delaware, D.C., Florida, Hawaii, Mississippi, Missouri, New Jersey, New Mexico, Oregon, South Carolina, Utah, and West Virginia."

  - question: "Which state requires the fewest credits to graduate high school?"
    answer: "Maine, at 11 total credits, the lowest in this data."

  - question: "Do Colorado, Massachusetts, and Pennsylvania have a statewide graduation credit requirement?"
    answer: "No. All three set no statewide minimum and leave credit requirements to local school districts."

  - question: "Does New York offer more than one high school diploma?"
    answer: "Yes. New York offers a Regents Diploma, an Advanced Regents Diploma, and a Local diploma."

  - question: "How many diploma types does Ohio offer?"
    answer: "Seven, the most of any state: the Ohio Diploma plus six honors diploma pathways in areas including STEM, career tech, and the arts."

