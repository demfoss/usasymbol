page:
  h1: "High School Graduation Requirements by State"

  quick_answer:
    - "13 states require 24 total credits to graduate high school, the highest total in this data: Alabama, Delaware, D.C., Florida, Hawaii, Mississippi, Missouri, New Jersey, New Mexico, Oregon, South Carolina, Utah, and West Virginia."
    - "Maine requires the fewest total credits at 11, followed by California and Wyoming, tied at 13, then Iowa at 14."
    - "Colorado, Massachusetts, and Pennsylvania set no statewide credit minimum at all. Local school districts set their own graduation requirements in these three states."

  methodology: "Total, English, math, and science credits reflect each state's minimum graduation requirements on record for 2026. Colorado, Massachusetts, and Pennsylvania report Local Discretion (LD) instead of a statewide figure."

  sources:
