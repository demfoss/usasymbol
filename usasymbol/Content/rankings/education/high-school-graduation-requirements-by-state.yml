sections:
  - id: "states-that-require-the-most-credits"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States That Require the Most High School Credits"
    paragraphs:
      - "13 states tie for the highest total credit requirement at 24: Alabama, Delaware, D.C., Florida, Hawaii, Mississippi, Missouri, New Jersey, New Mexico, Oregon, South Carolina, Utah, and West Virginia."
      - "Wisconsin follows closely at 23.5, and Georgia, Idaho, Louisiana, and Oklahoma tie at 23. All of these states require at least 4 English credits."

  - id: "states-that-require-the-fewest-credits"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States That Require the Fewest High School Credits"
    paragraphs:
      - "Maine requires the fewest total credits at 11, the lowest figure in this data. California and Wyoming tie for second fewest at 13, followed by Iowa at 14 and Illinois at 16.75."

  - id: "states-with-no-statewide-credit-minimum"
    icon: "fa-solid fa-building-columns"
    title: "States With No Statewide Credit Minimum"
    paragraphs:
      - "Colorado, Massachusetts, and Pennsylvania set no statewide credit minimum at all. Local school districts in these three states set their own graduation credit requirements rather than following a single state figure."

  - id: "states-with-multiple-diploma-types"
    icon: "fa-solid fa-award"
    title: "States With Multiple Diploma Types"
    paragraphs:
      - "30 states offer just one standard diploma. Ohio offers seven distinct diploma types, the most of any state, including honors diplomas in STEM, career tech, and the arts."
      - "11 more states offer two or three named diploma types, led by Indiana, Nevada, and New York at three each. Eight other states, including Colorado, Florida, and Washington, keep a single standard diploma but offer multiple pathways to earn it."
