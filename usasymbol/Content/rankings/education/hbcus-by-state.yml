faq:
  - question: "Which state has the most HBCUs?"
    answer: "Alabama, with 14. The state has public universities, private colleges and community colleges that are all classed as historically Black."
  - question: "How many HBCUs are in North Carolina?"
    answer: "North Carolina has 11, second most in the country. They include North Carolina A&T, which is among the largest HBCUs, and Shaw University, founded in 1865."
  - question: "How many HBCUs are in Georgia?"
    answer: "Georgia has 10, third most of any state. Spelman College in Atlanta is the oldest private college for Black women in the country."
  - question: "What is the oldest HBCU in the United States?"
    answer: "Cheyney University of Pennsylvania, founded in 1837 as the Institute for Colored Youth. Lincoln University in Pennsylvania followed in 1854."
  - question: "Which states have no HBCUs?"
    answer: "Thirty-one states have none, including California, New York and Illinois. HBCUs cluster in the former slave states, where Black students were barred from white colleges."
  - question: "What is the difference between an HBCU and a predominantly Black college?"
    answer: "An HBCU was established before 1964 with the mission of educating Black Americans. A college that is simply majority Black today does not carry that designation."
