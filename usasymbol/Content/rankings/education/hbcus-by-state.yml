  - id: hbcus-outside-the-south
    icon: "fa-solid fa-landmark"
    title: "HBCUs Outside the South"
    paragraphs:
      - "Pennsylvania has two, and both are historic. Cheyney University began in 1837 as the Institute for Colored Youth and is the oldest HBCU, though it still trails the colonial schools in the [oldest college by state](/rankings/education/oldest-college-by-state) list. Lincoln University, founded in 1854, was the first to grant degrees. Ohio's Wilberforce University dates from 1856."
      - "Delaware and Oklahoma each have one, Delaware State University and Langston University. Both were created as public colleges for Black students under the Second Morrill Act of 1890, which tied federal land-grant money to equal access."
