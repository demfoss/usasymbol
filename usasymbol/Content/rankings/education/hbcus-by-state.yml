page:
  h1: "HBCUs by State"
  quick_answer:
    - "Alabama has the most historically Black colleges and universities at 14, a group that includes Tuskegee University, founded in 1881 by Booker T. Washington."
    - "North Carolina has 11 and Georgia 10, and the South holds nearly every HBCU. Pennsylvania and Ohio hold the oldest outside the South, Cheyney University from 1837 and Wilberforce University from 1856."
  methodology: "Historically Black colleges and universities by state, from the Wikipedia list drawn from the U.S. Department of Education's HBCU designation, which covers institutions established before 1964 to educate Black Americans. Two-year colleges count. Only states with at least one are ranked. The District of Columbia has 2 and the U.S. Virgin Islands 1 and are not in the table. List totals vary by year."
