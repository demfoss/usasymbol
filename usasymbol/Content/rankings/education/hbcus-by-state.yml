sections:
  - id: why-alabama-has-the-most-hbcus
    icon: "fa-solid fa-graduation-cap"
    title: "Why Alabama Has the Most HBCUs"
    paragraphs:
      - "Alabama leads with 14 because its HBCUs include a mix of private colleges founded after the Civil War, public universities such as Alabama State and Alabama A&M, and community colleges. Tuskegee began in 1881 as a normal school, and Booker T. Washington built it into one of the best known Black colleges in the country."
      - "North Carolina and Georgia follow with 11 and 10. Atlanta alone is home to Morehouse, Spelman and Clark Atlanta University. Graduate-level degree holders are tracked in the [most educated states](/rankings/education/most-educated-us-states) ranking."
