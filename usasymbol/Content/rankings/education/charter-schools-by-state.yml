page:
  h1: "Charter Schools by State 2026"
  quick_answer:
    - "California has the most charter schools at 1,280, a result of a charter law passed in 1992 and the largest public school enrollment in the country."
    - "Arizona has the biggest share of charters, with 571 schools making up 23.5% of all its public schools. Florida follows at 17.3% and Colorado at 13.7%."
    - "Iowa and West Virginia have the fewest at five each. Montana, Nebraska, North Dakota, South Dakota and Vermont have no charter law at all, and Kentucky has a law but no school open."
  methodology: "Operating public charter schools in school year 2023–24 from the National Center for Education Statistics, Common Core of Data. Montana, Nebraska, North Dakota, South Dakota and Vermont have no charter law and Kentucky had no charter school open, so those six are omitted. The District of Columbia (125) is excluded."
