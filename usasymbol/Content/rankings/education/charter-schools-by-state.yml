sections:
  - id: why-california-has-the-most-charter-schools
    icon: "fa-solid fa-school"
    title: "Why California Has the Most Charter Schools"
    paragraphs:
      - "California runs 1,280 charter schools, the most of any state. The legislature passed its Charter Schools Act in 1992, only a year after Minnesota enacted the first charter law in the country, and the state's enormous enrollment gave the idea room to grow. Los Angeles became one of the largest charter cities in the nation."
      - "Texas at 1,045 and Florida at 733 follow, and all three are large states that wrote charter laws in the 1990s. The IDEA network in Texas grew from a single campus in the Rio Grande Valley, and KIPP began in Houston."
