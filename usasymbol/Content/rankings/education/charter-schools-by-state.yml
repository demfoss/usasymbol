faq:
  - question: "Which state has the most charter schools?"
    answer: "California, with 1,280. Texas has 1,045 and Florida has 733."
  - question: "Which state has the fewest charter schools?"
    answer: "Iowa and West Virginia, with five each. Virginia and Wyoming come next with seven each."
  - question: "Which state opened the first charter school?"
    answer: "Minnesota. It passed the first charter law in 1991, and City Academy opened in Saint Paul in 1992. Minnesota now has 308 charter schools, eighth among the states."
  - question: "Which states do not have charter schools?"
    answer: "Montana, Nebraska, North Dakota, South Dakota and Vermont have no charter law. Kentucky has a law but had no charter school open in 2023–24."
  - question: "How many charter schools are in Texas?"
    answer: "Texas has 1,045, which is 11.3% of its public schools. Many belong to networks such as KIPP and IDEA that run dozens of campuses."
  - question: "What percent of schools in Arizona are charter schools?"
    answer: "Arizona's 571 charter schools are 23.5% of its public schools, nearly one in four and the highest share among states."
  - question: "How many charter schools are in New York?"
    answer: "New York has 343, ranking sixth, and most of them operate in New York City. The state passed its charter law in 1998."
