  - id: states-with-the-fewest-charter-schools
    icon: "fa-solid fa-ban"
    title: "States With the Fewest Charter Schools"
    paragraphs:
      - "Iowa and West Virginia have five charter schools each. Iowa allows charters but requires a local school district and the state board to approve each one, a process that has produced very few. West Virginia passed its law in 2019, decades after the first states, so it has had little time to grow."
      - "Montana, Nebraska, North Dakota, South Dakota and Vermont have no charter law, so they are absent from the table. Kentucky approved charters in 2017 but did not fund them until 2022, and none were open in 2023–24. Washington has 18 because voters rejected charter measures three times before approving one in 2012, and the state supreme court struck the law down in 2015 before lawmakers rewrote it in 2016."
