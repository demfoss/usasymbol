    icon: "fa-solid fa-percent"
    title: "States With the Highest Share of Charter Schools"
    paragraphs:
      - "Arizona has 571 charter schools, and they make up 23.5% of its public schools, the highest share of any state. Its 1994 law was one of the most open in the country, and students there can enroll in any district or charter school regardless of address, so new schools can draw families from across a metro area."
      - "Florida follows at 17.3%, then Colorado at 13.7% and Nevada at 13.6%. Rhode Island at 13.1% is the surprise, since 41 schools are enough to reach that share in a state with only 312 public schools. Arizona also ranks first in the [school choice and homeschool freedom](/rankings/education/school-choice-homeschool-freedom) list."
