page:
  h1: "PA Schools by State"

  quick_answer:
    - "New York has the most physician assistant (PA) schools in the country with 38 programs, followed by Pennsylvania at 37 and California at 29."
    - "North Carolina (26) and Texas (25) round out the top five. Five states, Delaware, Hawaii, Maine, North Dakota, and South Dakota, have just one PA school each, the fewest on record."
    - "438 PA schools are listed across 47 states and the District of Columbia. Alaska, Vermont, and Wyoming are not included in the source data."

  methodology: "PA school counts reflect the number of physician assistant programs listed for each state on record for 2026. Alaska, Vermont, and Wyoming are not included in the source data."

