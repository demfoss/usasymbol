faq:
  - question: "Which state has the most PA schools?"
    answer: "New York, with 38 physician assistant programs, just ahead of Pennsylvania at 37."

  - question: "How many PA schools are in California?"
    answer: "29, the third most of any state after New York (38) and Pennsylvania (37)."

  - question: "Which states have the fewest PA schools?"
    answer: "Delaware, Hawaii, Maine, North Dakota, and South Dakota each have just one PA school."

  - question: "How many PA schools are there in the United States?"
    answer: "438 PA schools are listed across 47 states and the District of Columbia."

  - question: "Does Vermont have a PA school?"
    answer: "Vermont is not included in the source data, along with Alaska and Wyoming."

