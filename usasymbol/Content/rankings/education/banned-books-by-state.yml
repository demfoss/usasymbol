      url: "https://pen.org/banned-in-the-usa/"
      description: "PEN America's annual reports tracking book bans in U.S. public schools, the primary data source"
    - name: "American Library Association – Banned & Challenged Books"
      url: "https://www.ala.org/advocacy/bbooks"
      description: "ALA tracks challenged and banned titles in public libraries and schools nationwide"

