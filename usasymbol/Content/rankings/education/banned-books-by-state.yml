sections:
  - id: "states-with-most-book-bans"
    icon: "fa-solid fa-book-open-cover"
    title: "States with the Most Book Bans in Schools"
    paragraphs:
      - "Florida's 8,837 bans are more than double Iowa's 3,798 and account for roughly 40 percent of all documented school book bans in the United States. Florida's count surged after HB 1467 (2022) required school districts to remove any book not yet reviewed and approved by a certified media specialist, triggering mass removals while review backlogs accumulated across the state's 67 districts."
      - "Iowa's 3,798 bans rank second — ahead of Texas (3,745) — despite Iowa having less than one-quarter of Texas's population. Iowa's totals surged after HF 847 (2023) directed schools to remove titles with sexual content, with removal lists spanning hundreds of titles across multiple districts in a single school year. Tennessee (2,016) ranks fourth; its total reflects a combination of state legislation and locally driven removal campaigns."

  - id: "book-bans-by-state-top-10"
    icon: "fa-solid fa-ranking-star"
    title: "Top 10 States by School Book Bans"
    paragraphs:
      - "The top 10 states — Florida, Iowa, Texas, Tennessee, Pennsylvania, Wisconsin, Missouri, Utah, Virginia, and Idaho — account for the overwhelming majority of all documented school book bans. Pennsylvania (737) and Wisconsin (482) rank fifth and sixth without high-profile statewide legislation, reflecting concentrated district-level removal campaigns. Utah (351) ranks eighth; its banned list includes the entire A Court of Thorns and Roses series by Sarah J. Maas, challenged across multiple districts for sexual content."
      - "South Carolina (197, rank 11) has 22 documented titles on the state's banned list including The Perks of Being a Wallflower, All Boys Aren't Blue, and Flamer. Virginia (312, rank 9) and Idaho (213, rank 10) both surpass the totals of many larger states, reflecting unusually active district-level removal campaigns relative to their populations."

  - id: "which-states-have-no-book-bans"
    icon: "fa-solid fa-book"
    title: "Which States Have No School Book Bans"
    paragraphs:
      - "Six states have no recorded school book bans: Alabama, Connecticut, Delaware, Hawaii, Nevada, and New Mexico. Many additional states have very few documented bans: California (3), Massachusetts (2), Washington (5), and Arkansas (5) are among the lowest. Louisiana, Rhode Island, and Vermont each have exactly 1 recorded ban."

faq:
  - question: "Which state has the most banned books?"
    answer: "Florida leads all states with 8,837 documented school book bans, according to World Population Review citing PEN America data. Iowa ranks second with 3,798, and Texas ranks third with 3,745."

  - question: "Why does Iowa have so many book bans?"
    answer: "Iowa's 3,798 school book bans — second in the nation — were driven primarily by HF 847 (2023), a state law directing schools to remove titles containing sexual content. The law triggered mass removals across Iowa school districts, pushing Iowa's total above Texas despite Iowa having less than one-quarter of Texas's population."

  - question: "How many books were banned in schools in the United States?"
    answer: "World Population Review documents approximately 22,000 cumulative school book ban incidents across the 44 states with recorded bans. Six states — Alabama, Connecticut, Delaware, Hawaii, Nevada, and New Mexico — have no recorded school book bans."

  - question: "What are the most banned books in schools?"
    answer: "Gender Queer by Maia Kobabe appears on banned lists in more states than any other title. All Boys Aren't Blue, The Absolutely True Diary of a Part-Time Indian, Flamer, The Bluest Eye, and the A Court of Thorns and Roses series by Sarah J. Maas are also among the most frequently banned books in school districts."

  - question: "How many books are banned in Florida schools?"
    answer: "Florida has 8,837 documented school book bans — the highest of any state. The surge followed HB 1467 (2022), which required removal of unreviewed books while districts worked through approval backlogs across Florida's 67 school districts."

  - question: "Which states have the fewest school book bans?"
    answer: "Six states have no recorded school book bans: Alabama, Connecticut, Delaware, Hawaii, Nevada, and New Mexico. The next lowest are Louisiana, Rhode Island, and Vermont (1 ban each), followed by Arizona, Massachusetts, New Hampshire, and West Virginia (2 each)."

