page:
  h1: "Financial Literacy Requirement by State"

  quick_answer:
    - "Financial literacy requirement by state began in Utah, where the Class of 2008 was the first to need a half-credit course. Thirty states now guarantee a standalone personal finance course."
    - "Twenty states have no guaranteed standalone course. Alaska, Maine, Maryland, Massachusetts, Oklahoma, Vermont, Washington, and Wyoming only have personal finance standards, and no course is required."
    - "California has the latest start, with the Class of 2031. Nineteen of the 30 states with a standalone requirement have not yet seen their first required class graduate, so most of the national total is still being phased in."

  methodology: "Status and first graduating class come from the Next Gen Personal Finance State of Financial Education report (April 2026), checked against state statutes where named. The Council for Economic Education counts 39 states because it also counts integrated requirements. The 20 states without a standalone course have no year and are not shaded."

