sections:
  - id: "first-state-to-require-personal-finance"
    title: "First State to Require Personal Finance"
    paragraphs:
      - "Utah requires a half-credit General Financial Literacy course, and its Class of 2008 was the first in the country to need it. A 2003 law put financial education into the schools and the State Board set the course requirement in 2004, which gave districts several years to prepare. Missouri followed with the Class of 2010."
      - "Alabama and Tennessee start with the Class of 2013, and Virginia with 2015. Mississippi and Alabama tuck the semester into a broader career course, and Virginia teaches it inside Economics and Personal Finance, so a student there may not see a class labeled personal finance."
    table:
      columns:
        state: "State"
        first_class: "First Class"
        course: "Requirement"
      rows:
        - state: "Utah"
          first_class: "2008"
          course: "One-semester General Financial Literacy course"
        - state: "Missouri"
          first_class: "2010"
          course: "One-semester course"
        - state: "Alabama"
          first_class: "2013"
          course: "Career Preparedness course with one semester of personal finance"
        - state: "Tennessee"
