          course: "One-semester course"
        - state: "Virginia"
          first_class: "2015"
          course: "Economics and Personal Finance course"
        - state: "Mississippi"
          first_class: "2022"
          course: "One-year course with one semester of personal finance"
        - state: "Iowa"
          first_class: "2023"
          course: "One-semester requirement, later loosened"
        - state: "Nebraska"
          first_class: "2024"
          course: "Half-credit personal finance course"
        - state: "North Carolina"
