          course: "Financial literacy proficiency"

  - id: "states-without-a-personal-finance-requirement"
    title: "States Without a Personal Finance Requirement"
    paragraphs:
      - "Twenty states do not guarantee a standalone course. Seven of them, Arizona, Arkansas, Idaho, Nevada, New Mexico, North Dakota, and New Jersey, require the material inside another course, usually Economics. Montana and South Dakota let students pick personal finance or Economics, so a student can graduate without taking the finance option."
      - "New York adopted a requirement in March 2026 that schools can meet with a standalone course, embedded lessons, or a career and technical course, so no first class is set yet. For how personal finance fits with the rest of the diploma, see [high school graduation requirements by state](/rankings/education/high-school-graduation-requirements-by-state)."
    table:
      columns:
        status: "Status"
        states: "States"
      rows:
        - status: "Required within another course"
          states: "Arizona, Arkansas, Idaho, Nevada, New Jersey, New Mexico, North Dakota"
        - status: "Choice or partial requirement"
          states: "Hawaii, Illinois, Montana, New York, South Dakota"
        - status: "Standards only, no course"
          states: "Alaska, Maine, Maryland, Massachusetts, Oklahoma, Vermont, Washington, Wyoming"

  - id: "newest-personal-finance-graduation-requirements"
    title: "Newest Personal Finance Graduation Requirements"
    paragraphs:
      - "California adopted its requirement in June 2024, and its first required class is the Class of 2031, the latest start in the table. Kentucky (March 2025), Texas (June 2025), Colorado (May 2025), and Delaware (October 2025) each adopted a course in 2025 and begin with the Class of 2030, joined by Pennsylvania, which adopted in December 2023."
      - "Ohio's Class of 2026 is the most recent to graduate under a requirement, so 11 of the 30 states have already put a required class through. The other 19 start between 2027 and 2031, which is why the share of students covered keeps climbing even without new laws."
    table:
      columns:
        year: "First Class"
        states: "States"
      rows:
        - year: "2027"
          states: "Connecticut, Florida, Kansas, New Hampshire, Oregon, South Carolina"
        - year: "2028"
