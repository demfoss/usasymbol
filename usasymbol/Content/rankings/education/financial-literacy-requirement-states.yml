faq:
  - question: "How many states require a personal finance course to graduate high school?"
    answer: "Thirty states guarantee a standalone personal finance course. Seven more, including Arizona and Nevada, require the content inside another course such as Economics."

  - question: "Which state was first to require financial literacy to graduate?"
    answer: "Utah, with its Class of 2008. Missouri followed two years later with the Class of 2010, and Alabama and Tennessee came in with the Class of 2013."

  - question: "Is financial literacy required in Texas?"
    answer: "Yes. Texas adopted a one-semester Personal Financial Literacy course in June 2025, and the Class of 2030 is the first that must take it."

  - question: "Is financial literacy required in California?"
    answer: "Yes, though students have to wait. California adopted a one-semester course in June 2024, and the Class of 2031 is the first required to complete it."

  - question: "Is financial literacy required in New York?"
    answer: "New York adopted a requirement in March 2026, but it is not a standalone course by default. Schools can meet it with a standalone course, embedded lessons, or a career and technical course, and no first class is listed."

  - question: "Do students in Florida have to take a personal finance class?"
    answer: "Yes. Florida adopted a one-semester personal finance course in March 2022, and the Class of 2027 is the first required to take it."

