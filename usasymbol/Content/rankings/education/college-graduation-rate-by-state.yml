faq:
  - question: "Which state has the highest college graduation rate?"
    answer: "Rhode Island ranks first with a four-year graduation rate of 73.30%. Massachusetts is second at 66.67%, and Vermont is third at 63.60%."

  - question: "Which state has the lowest college graduation rate?"
    answer: "New Mexico ranks last at 37.08%. Oklahoma is second-lowest at 38.30%, and Arizona follows at 40.11%."

  - question: "What state has the highest community college graduation rate?"
    answer: "Washington's community colleges graduate 73.88% of students, the highest rate among all states. Connecticut is second at 71.40%, and South Dakota is third at 65.50%."

  - question: "How does Vermont's community college graduation rate compare to its four-year rate?"
    answer: "Vermont's four-year colleges graduate 63.60% of students, third-highest in the country. Its community colleges graduate only 20.00%, the lowest rate of any state."

  - question: "What is the four-year college retention rate in Arizona?"
    answer: "Arizona's four-year retention rate is 60.81%, the lowest in the country. Its four-year graduation rate of 40.11% ranks 48th."

  - question: "Where does Texas rank for college graduation rates?"
    answer: "Texas ranks 40th with a four-year graduation rate of 45.31%. Its community college graduation rate is higher, at 51.80%."

