  metric_slug: college-graduation-rate
  title: "Compare College Graduation Rates Between Two States"
  description: "Pick any two states to see a side-by-side comparison of education, income, and quality-of-life data."
  button_text: "Compare states"
  icon: "fa-solid fa-graduation-cap"
  default_state_a: rhode-island
  default_state_b: new-mexico

