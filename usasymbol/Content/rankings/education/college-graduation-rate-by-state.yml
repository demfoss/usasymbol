    paragraphs:
      - "Rhode Island's four-year colleges graduate 73.30% of students, the highest rate in the country and more than six points above Massachusetts at 66.67%. Vermont ranks third at 63.60%, just ahead of Connecticut's 63.59%."
      - "Iowa ranks fifth at 63.12%, followed by California at 60.17% and Minnesota at 59.84%. All six states have four-year retention rates above 73%, led by Rhode Island's 82.50%."
