  quick_answer:
    - "Teacher assistant salary by state is highest in Washington at $50,650 a year. State school funding rules allow added allocations to support paraeducator staffing and salary increases."
    - "Mississippi has the lowest average at $25,830. Teacher assistants often follow school calendars, and many do not work during summer."
    - "California employs 177,140 teacher assistants, the largest state total. These workers reinforce lessons and give students individual or small-group support under a licensed teacher."
