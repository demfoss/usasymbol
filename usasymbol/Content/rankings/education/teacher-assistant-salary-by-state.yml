faq:
  - question: "How much does a teacher assistant make in California?"
    answer: "California teacher assistants average $47,300 a year, with a $46,490 median. The state employs 177,140 assistants, more than any other state."
  - question: "How much does a teacher assistant make in Texas?"
    answer: "Texas teacher assistants average $31,390 annually, with a $29,850 median. More than 108,000 work in the occupation across the state."
  - question: "What state pays teacher assistants the most?"
    answer: "Washington pays the highest mean annual wage at $50,650. State school funding rules have allowed added paraeducator allocations to support staffing and salary increases."
  - question: "What state pays teacher assistants the least?"
    answer: "Mississippi has the lowest mean annual wage at $25,830. Many assistants work school-year schedules rather than year-round calendars."
  - question: "Do teacher assistants work during summer?"
    answer: "Many teacher assistants do not work during summer because their jobs follow the school calendar. Short-term classroom coverage is a different occupation covered in [substitute teacher salary by state](/rankings/education/substitute-teacher-salary-by-state)."
  - question: "What education does a teacher assistant need?"
    answer: "Teacher assistants typically need at least two years of college coursework. Public schools receiving Title I funds require two years of college, a two-year degree, or passage of a state or local assessment."
