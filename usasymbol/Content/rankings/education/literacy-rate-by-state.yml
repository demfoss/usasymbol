page:
  h1: "Literacy Rate by State"
  quick_answer:
    - "Literacy rate by state is highest in Minnesota and New Hampshire, which tie with an estimated adult English literacy score of 279 on a 0–500 scale."
    - "Louisiana, Mississippi, and New Mexico share the lowest estimated score at 252."
    - "Alaska and Vermont tie for third at 277, followed by North Dakota at 276 and Washington at 275."
  methodology: "NCES PIAAC Skills Map model-based estimates combine 2012, 2014, and 2017 assessments of adults ages 16–74 with 2013–2017 ACS data. Scores measure English literacy on a 0–500 scale."
