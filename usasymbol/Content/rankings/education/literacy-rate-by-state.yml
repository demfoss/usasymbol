faq:
  - question: "Which state has the highest literacy rate?"
    answer: "Minnesota and New Hampshire tie for the highest estimated adult English literacy score at 279. The figure is a scale score, not a percentage of residents who can read."
  - question: "Which state has the lowest literacy rate?"
    answer: "Louisiana, Mississippi, and New Mexico tie for the lowest estimated score at 252. Texas is next at 254."
  - question: "What is the literacy rate in California?"
    answer: "California has an estimated adult English literacy score of 257 and ranks 45th."
  - question: "What is the literacy rate in Texas?"
    answer: "Texas scores 254 and ranks 47th, ahead of the three states tied at 252."
  - question: "How is adult literacy measured by state?"
    answer: "Adults complete tasks that involve finding, understanding, and evaluating written information. Their results are placed on a 0–500 scale and combined with local demographic data to estimate each state's score."
  - question: "Is a literacy score the same as a literacy percentage?"
    answer: "No. Minnesota's score of 279 describes average proficiency on a 0–500 scale. It does not mean that 279% or 27.9% of residents are literate."

