sections:
  - id: why-minnesota-new-hampshire-lead-literacy
    icon: "fa-solid fa-book-open-reader"
    title: "Why Minnesota and New Hampshire Lead"
    paragraphs:
      - "Minnesota and New Hampshire tie at 279. Both have highly educated adult populations, and years of schooling strongly shape performance on tasks that ask adults to compare texts, identify evidence, and draw inferences."
      - "Alaska and Vermont follow at 277. The [bachelor's degree attainment by state](/rankings/education/bachelors-degree-attainment-by-state) ranking provides another view of the education adults carry into the workplace and community."
  - id: states-with-lowest-literacy-scores
    icon: "fa-solid fa-book"
    title: "States With the Lowest Literacy Scores"
    paragraphs:
      - "Louisiana, Mississippi, and New Mexico share the lowest score at 252. Louisiana and Mississippi have lower levels of adult educational attainment, while New Mexico includes many adults who use Spanish or Indigenous languages at home. An English assessment records those population differences."
      - "Texas follows at 254 and Nevada at 255. California ranks 45th at 257 even though its large university system produces millions of graduates, because the score represents all adults ages 16–74 rather than only degree holders."
  - id: what-literacy-score-means
    icon: "fa-solid fa-spell-check"
    title: "What a State Literacy Score Means"
    paragraphs:
      - "A score near 279 places the average performance around the boundary between Level 2 and Level 3. Adults at Level 3 can work through denser texts, evaluate information, and identify meaning that is not stated directly."
      - "The [NAEP reading scores by state](/rankings/education/naep-reading-scores-by-state) page measures schoolchildren instead. Minnesota's adult score of 279 and the three-state low of 252 come from a separate assessment designed around everyday adult tasks."

