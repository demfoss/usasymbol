  - id: "cheapest-community-college-by-state"
    title: "Cheapest Community College by State"
    paragraphs:
      - "California averages $1,440 a year, the lowest of any state. Its community colleges charge a flat $46 per unit, set by the legislature, so a full-time student pays far less than anywhere else. New Mexico is next at $2,350, where state scholarships can cover tuition for eligible residents."
      - "North Carolina ($2,580) sets one statewide rate for all of its community colleges. Arizona ($2,950), Florida ($3,240) and Texas ($3,300) complete the cheapest six. The [free community college states](/rankings/education/free-community-college-states) list shows where programs can bring the price to zero."

