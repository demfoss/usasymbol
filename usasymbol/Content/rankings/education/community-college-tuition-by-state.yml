  - id: "is-community-college-tuition-going-up"
    title: "Is Community College Tuition Going Up?"
    paragraphs:
      - "After inflation, community college prices fell over the past five years in 42 of 49 states, and the U.S. average dropped 9.7%. Florida (18.5%), Hawaii (18.4%) and California (17.7%) fell the most, mostly because sticker prices stayed nearly flat while inflation rose."
      - "Seven states went the other way. Arkansas rose 5.9%, Nevada 4.1%, Louisiana and West Virginia 3.6% each, and New Jersey 2.9%. Rising prices in those states add to the [student loan debt by state](/rankings/education/student-loan-debt-by-state) picture for families who borrow."

