page:
  h1: "Community College Tuition by State 2026"

  quick_answer:
    - "Community college tuition is highest in Vermont, where in-district students pay $8,950 a year in tuition and fees. The state ranks near the bottom nationally in public funding per student."
    - "California charges the least at $1,440, because the legislature sets a very low per-unit fee for its community colleges. New Mexico follows at $2,350 and North Carolina at $2,580."
    - "Prices fell after inflation in 42 of 49 states with data over five years, led by Florida (down 18.5%) and Hawaii (down 18.4%). Arkansas rose the most, up 5.9%."

  methodology: "Average 2026-27 in-district tuition and fees at public two-year colleges, enrollment-weighted, from the College Board Trends in College Pricing 2026 state table. Rank is by price. Alaska is not in the source, so its value is approximate, rounded from 30 credits at the University of Alaska 2026-27 resident community campus rate of $251 per credit plus about $47 per credit in mandatory fees. It has no five-year change. The District of Columbia is not in the table."

  sources:
    - name: "College Board. Trends in College Pricing and Student Aid 2026"
      url: "https://research.collegeboard.org/trends/college-pricing/highlights"
      description: "Figure CP-5 with 2026-27 in-district tuition and fees at public two-year institutions by state"

