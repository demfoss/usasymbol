sections:
  - id: "why-vermont-has-the-highest-community-college-tuition"
    title: "Highest Community College Tuition by State"
    paragraphs:
      - "Vermont charges $8,950 a year, more than twice the U.S. average of $4,210. Alaska comes next at an approximate $8,900, since its community campuses charge one statewide per-credit rate in a high-cost, low-population state. New Hampshire follows at $7,890, Massachusetts at $7,780 and South Dakota at $7,710. Vermont and New Hampshire rank near the bottom nationally in state funding per student, so tuition covers a larger share of the bill."
      - "Prices climb where the state pays less and students pay more, a pattern that also shows up in [college tuition by state](/rankings/education/college-tuition-by-state) at four-year schools across northern New England. South Dakota is the surprise, a low-population state with a community college price that rivals the Northeast."

