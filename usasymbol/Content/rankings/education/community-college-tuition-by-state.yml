faq:
  - question: "Which state has the most expensive community college?"
    answer: "Vermont, at $8,950 a year in tuition and fees. Alaska is next at an approximate $8,900, and New Hampshire ranks third at $7,890."

  - question: "Which state has the cheapest community college?"
    answer: "California, at $1,440 a year. New Mexico ranks second cheapest at $2,350 and North Carolina third cheapest at $2,580."

  - question: "What is the average cost of community college in the US?"
    answer: "In-district students at public two-year colleges pay an average of $4,210 a year in tuition and fees for 2026-27. Many students start there to save money before moving to a four-year school."

  - question: "How much is community college in Texas?"
    answer: "Texas averages $3,300 a year, ranking 45th of 50 states. Many Texas community colleges draw on local property taxes from their taxing districts, which holds tuition down for residents."

  - question: "How much is community college in New York?"
    answer: "New York averages $6,250 a year, ranking 13th. That is $2,040 above the U.S. average of $4,210."

  - question: "Is community college free in any state?"
    answer: "Several states run programs that cover tuition for eligible students. New Mexico's average of $2,350 is the second lowest in the country partly for that reason, and the full list is on the free community college states page."

