faq:
  - question: "Which state has the highest percentage of college graduates?"
    answer: "Massachusetts, where 50.62% of residents 25 and older hold a bachelor's degree or higher. Maryland follows at 48.55%. Washington D.C. is higher at 63.05% but is not a state."

  - question: "Which state has the lowest percentage of college graduates?"
    answer: "West Virginia, at 24.12%. Mississippi is next lowest at 24.78%."

  - question: "What percentage of Massachusetts residents have a bachelor's degree?"
    answer: "50.62%, so more than half of adults 25 and older. Another 28.27% of adults hold an advanced degree, the second-highest rate in the table."

  - question: "Is Washington D.C. the most educated place in the U.S.?"
    answer: "Yes, at 63.05%, though it is a district and not a state. Federal agencies, law firms, universities, and policy groups employ a workforce where a degree is often the entry requirement."

  - question: "What is the bachelor's degree rate in California?"
    answer: "36.19%, which ranks 18th in the table. California's high school completion rate of 84.45% is the lowest among the states."

  - question: "Which state has the highest high school graduation rate?"
    answer: "Massachusetts, at 96.10% of adults 25 and older holding a high school diploma or higher. Pennsylvania is second at 95.89%."

  - question: "Why do Maryland and Virginia rank so high?"
    answer: "Maryland (48.55%) and Virginia (41.81%) both border Washington D.C. and supply workers to federal agencies, contractors, and research institutes. Those employers hire heavily from colleges and graduate programs."

