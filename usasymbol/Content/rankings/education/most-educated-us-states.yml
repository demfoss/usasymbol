  - id: "high-school-completion-rates-by-state"
    icon: "fa-solid fa-school"
    title: "High School Completion Rates by State"
    paragraphs:
      - "Massachusetts also leads in high school completion at 96.10%, with Pennsylvania close behind at 95.89%. Northern states from Maine to Wisconsin fill most of the top ten."
      - "California has the lowest rate at 84.45% even though 36.19% of its adults hold a bachelor's degree. A large immigrant population explains much of the gap, because many adults finished school in another country. Texas, at 85.39%, shows the same pattern. Local results are covered in [public school rankings by state](/rankings/education/public-school-rankings-by-state)."
