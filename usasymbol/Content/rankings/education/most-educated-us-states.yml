sections:
  - id: "why-massachusetts-most-educated"
    icon: "fa-solid fa-building-columns"
    title: "Why Massachusetts Is the Most Educated State"
    paragraphs:
      - "Massachusetts has a bachelor's degree rate of 50.62%, the highest of any state. Harvard opened in 1636, and a colonial law in 1647 ordered towns to keep schools, so the state was investing in education centuries before most states existed."
      - "Greater Boston still packs Harvard, MIT, Boston University, and dozens of other colleges beside teaching hospitals and biotech labs. Graduates find degree-level jobs close to campus, and many never leave."

  - id: "why-west-virginia-lowest-degree-rate"
    icon: "fa-solid fa-mountain"
    title: "Why West Virginia Has the Lowest Rate"
    paragraphs:
      - "West Virginia sits last among the states at 24.12%. Coal mining, timber, and manufacturing paid steady wages to workers without college degrees for generations, and steep terrain left many communities far from any campus."
      - "Mississippi at 24.78% and Arkansas at 25.27% follow just above. Both include stretches of the Mississippi Delta, one of the poorest regions in the country. See the full [least educated states](/rankings/education/least-educated-states) list for the bottom of the table."

  - id: "states-with-the-highest-advanced-degree-rates"
    icon: "fa-solid fa-graduation-cap"
    title: "States With the Highest Advanced Degree Rates"
    paragraphs:
      - "Washington D.C. has the highest advanced degree rate at 37.82%, far ahead of Massachusetts at 28.27%. Lawyers, economists, policy researchers, and federal agency staff fill the capital, and many of those jobs expect a master's or professional degree."
      - "Maryland ranks third at 24.16%. The National Institutes of Health in Bethesda, the National Security Agency at Fort Meade, and Johns Hopkins University in Baltimore all employ large numbers of scientists and analysts. Compare these rates with [college graduation rate by state](/rankings/education/college-graduation-rate-by-state)."
