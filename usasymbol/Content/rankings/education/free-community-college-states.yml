page:
  h1: "Free Community College States"
  quick_answer:
    - "Free community college states include 20 with clearly funded statewide programs for recent graduates, adults or students in high-demand fields. New Mexico and Massachusetts offer two of the broadest programs."
    - "Tennessee serves both recent high school graduates and returning adults through separate Promise and Reconnect programs. Michigan follows a similar two-track design."
    - "Arkansas, Indiana, Kentucky, Virginia and West Virginia target approved workforce programs, tying free tuition to credentials needed by state employers."
  methodology: "Programs were reviewed on official state pages in November 2026. A state qualifies when a funded statewide program can cover full community college tuition for an eligible group. Local-only awards are excluded."
