faq:
  - question: "Which states have free community college?"
    answer: "Twenty states in this table fund a statewide program that can cover full tuition for an eligible group. Rules often depend on age, income, graduation date or field of study."
  - question: "Is community college free in New Mexico?"
    answer: "Eligible New Mexico residents can use the Opportunity Scholarship for tuition and required fees at public colleges. Its reach includes recent graduates and adults."
  - question: "Is community college free in Massachusetts?"
    answer: "MassEducate and MassReconnect can cover tuition and fees at Massachusetts community colleges for eligible residents who do not already have a bachelor's degree."
  - question: "Is community college free in Tennessee?"
    answer: "Tennessee Promise covers eligible recent graduates, while Tennessee Reconnect serves eligible adults. Both apply grant aid first and then cover the remaining tuition and mandatory fees."
  - question: "Can adults get free community college?"
    answer: "Yes. Massachusetts, Michigan, Tennessee and Delaware have adult routes, while New York targets adults ages 25 to 55 in selected high-demand associate programs."
  - question: "Does free community college cover housing and books?"
    answer: "Most programs focus on tuition and mandatory fees. Housing, transportation and meals usually remain separate, though some programs provide limited book or cost allowances."
