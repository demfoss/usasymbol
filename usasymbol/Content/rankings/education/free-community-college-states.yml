sections:
  - id: broad-free-community-college-states
    title: "Broad Free Community College States"
    paragraphs:
      - "New Mexico's Opportunity Scholarship reaches residents pursuing certificates and degrees at public colleges without an income cap. Massachusetts combines MassEducate for students without a bachelor's degree with MassReconnect for adults, and it can add allowances for books and other education costs."
      - "Tennessee and Michigan use paired programs. Each has one route for recent high school graduates and another for adults returning to college, allowing the promise to follow people at different stages of life."
    table:
      columns:
        state: "State"
        program: "Program"
        status: "Coverage"
      rows:
        - { state: "New Mexico", program: "Opportunity Scholarship", status: "Broad eligibility" }
        - { state: "Massachusetts", program: "MassEducate and MassReconnect", status: "Graduates and adults" }
        - { state: "Tennessee", program: "Tennessee Promise and Reconnect", status: "Graduates and adults" }
        - { state: "Michigan", program: "Community College Guarantee and Reconnect", status: "Graduates and adults" }
        - { state: "Delaware", program: "SEED and SEED+", status: "Graduates and adults" }
  - id: workforce-free-community-college-programs
    title: "Workforce Free Community College Programs"
    paragraphs:
      - "Arkansas, Indiana, Kentucky, Virginia and West Virginia reserve tuition support for approved credentials in fields with worker shortages. Nursing, information technology and advanced manufacturing commonly fit that workforce purpose, while each state publishes its own eligible program list."
      - "Missouri's A+ Scholarship takes another route by tying eligibility to graduation from a designated high school and student requirements completed before college. Students comparing the remaining price can also use [college tuition by state](/rankings/education/college-tuition-by-state)."
