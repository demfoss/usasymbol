faq:
  - question: "Which state has the highest share of STEM degrees?"
    answer: "Maryland, where 11,230 of 35,613 bachelor's degrees were in STEM fields. Montana (27.59%) and Washington (27.07%) follow."

  - question: "Which state awards the most STEM degrees?"
    answer: "California awarded 51,233, ahead of Texas at 31,866 and New York at 30,093. Large populations and big university systems push their totals up while their shares stay near the middle."

  - question: "What percent of degrees are STEM in Texas?"
    answer: "Texas awarded 31,866 STEM degrees out of 144,662, a share of 22.03% that ranks 18th."

  - question: "How many STEM degrees does New York award?"
    answer: "New York awarded 30,093, or 21.38% of its bachelor's degrees. Its 8,647 computing degrees are second only to California."

  - question: "Which states award the fewest STEM degrees?"
    answer: "Alaska awarded 325 and Wyoming 484, the two smallest totals. Wyoming still ranks 14th by share at 22.70%, with the University of Wyoming as its only public four-year university."

  - question: "How does Massachusetts rank for STEM degrees?"
    answer: "Massachusetts ranks 5th at 26.62% with 16,097 STEM degrees. It is also among the [most educated states](/rankings/education/most-educated-us-states), second only to the District of Columbia."

