          stem_degrees: "10,819"
    paragraphs:
      - "Maryland leads at 31.53%, followed by Montana at 27.59%, Washington at 27.07%, Colorado at 26.70%, and Massachusetts at 26.62%. Montana is the surprise. Its 1,506 STEM degrees are a small pile, but they make up a bigger slice of its graduates than in Massachusetts, home to MIT. Montana Tech in Butte began in 1893 as a school of mines, and engineering is the state's biggest STEM field at 710 degrees."
      - "Michigan's 26.48% rests on engineering, with 6,119 degrees in a state built around the auto industry in Detroit and Flint. Pennsylvania ranks 7th at 24.67% and awarded 21,187 STEM degrees, the fifth most in the country."

  - id: "why-maryland-has-the-highest-stem-share"
    title: "Why Maryland Has the Highest STEM Share"
    paragraphs:
      - "Maryland's 31.53% is built on computing. The state awarded 6,093 computer and information sciences degrees, more than Georgia (3,763) or Virginia (3,577), even though both awarded far more bachelor's degrees overall. University of Maryland Global Campus, an online university that grew out of programs for U.S. military personnel, runs large cybersecurity and IT programs. The NSA at Fort Meade and the National Institutes of Health in Bethesda sit in the same state."
      - "Utah shows the same effect from the other side. Western Governors University, an online school based in Salt Lake City, helps give Utah 5,468 computing degrees, yet the state's 19.12% share ranks 39th because Utah also awarded 51,129 degrees in total."

  - id: "states-with-the-lowest-stem-degree-share"
    title: "States With the Lowest STEM Degree Share"
    paragraphs:
      - "New Hampshire is last at 12.68%. The state awarded 25,667 bachelor's degrees, a huge number for a small state, because Southern New Hampshire University enrolls students online across the country, mostly in business and other non-STEM fields. Only 3,254 of those degrees were in STEM."
      - "Arizona is next to last at 15.21% on 67,868 degrees, another state where large online programs lift the total. Kentucky and Hawaii both round to 15.92%. Online-heavy campuses also shape the [largest university in each state](/rankings/education/largest-university-by-state)."

