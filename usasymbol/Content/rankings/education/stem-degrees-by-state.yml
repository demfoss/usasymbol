seo:
  title: "STEM Degrees by State | Map & Rankings"
  description: "Maryland has the highest share of bachelor's degrees in STEM fields at 31.53%. New Hampshire has the lowest at 12.68%."

page:
  h1: "STEM Degrees by State"

  quick_answer:
    - "STEM degrees make up the largest share of bachelor's degrees in Maryland at 31.53%, lifted by cybersecurity and IT programs near Washington, D.C."
    - "New Hampshire has the lowest share at 12.68%. Southern New Hampshire University awards a large number of online degrees, and few of them are in STEM fields."
    - "California awarded the most STEM degrees at 51,233, yet its share of 22.66% ranks only 15th. Montana is second in share at 27.59% with just 1,506 degrees."

  methodology: "Bachelor's degrees conferred in academic year 2021-22 by institutions in each state, from NCES IPEDS completions. STEM counts natural sciences and mathematics (biological and physical sciences, math, statistics), computer and information sciences, and engineering with engineering technologies. Health, psychology, social sciences, and agriculture are not counted. The District of Columbia is not ranked."

  sources:
    - name: "NCES Digest of Education Statistics, Table 319.30"
      url: "https://nces.ed.gov/programs/digest/d23/tables/dt23_319.30.asp"
      description: "Bachelor's degrees conferred by field of study and state, 2021-22, from IPEDS Completions"
    - name: "NCES IPEDS Data Center"
      url: "https://nces.ed.gov/ipeds/"
      description: "Federal postsecondary survey that is the underlying source of the completions counts"

