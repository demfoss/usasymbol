sections:
  - id: states-with-the-most-required-recess
    title: "States With the Most Required Recess"
    paragraphs:
      - "Arkansas and Oklahoma require 40 minutes, the longest statewide minimums. Oklahoma permits schools to divide that time into two 20-minute periods, giving younger children a break in both halves of the day."
      - "California, Illinois and Washington set 30 minutes. Washington applies the rule on days longer than five hours and extends it to sixth graders when they attend an elementary school."
    table:
      columns:
        rank: "Rank"
        state: "State"
        daily_minutes: "Daily Minutes"
      rows:
        - { rank: "1", state: "Arkansas", daily_minutes: "40" }
        - { rank: "1", state: "Oklahoma", daily_minutes: "40" }
        - { rank: "3", state: "California", daily_minutes: "30" }
        - { rank: "3", state: "Illinois", daily_minutes: "30" }
        - { rank: "3", state: "Washington", daily_minutes: "30" }
