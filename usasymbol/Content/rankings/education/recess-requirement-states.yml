        - { rank: "6", state: "Florida", daily_minutes: "20" }
        - { rank: "6", state: "Missouri", daily_minutes: "20" }
        - { rank: "6", state: "New Jersey", daily_minutes: "20" }
        - { rank: "6", state: "Rhode Island", daily_minutes: "20" }
  - id: states-with-untimed-recess-laws
    title: "States With Untimed Recess Laws"
    paragraphs:
      - "Arizona requires two recess periods for pupils in kindergarten through fifth grade but leaves their length to schools. Georgia requires a daily recess period for the same grades, while Virginia directs elementary schools to provide daily recess at a locally appropriate length."
      - "Louisiana takes the opposite approach by naming a precise 15-minute minimum. Local districts can schedule more than the floor, just as districts can exceed statewide rules for [average class size by state](/rankings/education/average-class-size-by-state)."
