page:
  h1: "Recess Requirement States"
  quick_answer:
    - "Recess requirement states with the longest minimum are Arkansas and Oklahoma at 40 minutes per elementary school day. Oklahoma allows two 20-minute periods."
    - "California, Illinois and Washington require 30 minutes on a full school day. Florida, Missouri, New Jersey and Rhode Island set a 20-minute minimum."
    - "Arizona, Georgia and Virginia require elementary recess without setting a statewide number of minutes. Local schedules decide the length."
  methodology: "State recess statutes in force in November 2026 were reviewed with ECS and state legislative sources. Minutes show the daily elementary minimum on a full school day. Untimed mandates omit the value."
