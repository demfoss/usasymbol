faq:
  - question: "Which state requires the most recess?"
    answer: "Arkansas and Oklahoma tie at 40 minutes per elementary school day. No active statewide minimum in the table is longer."
  - question: "How much recess is required in California?"
    answer: "California requires 30 minutes on regular school days for kindergarten through sixth grade. Early-release days require 15 minutes."
  - question: "How much recess is required in Florida?"
    answer: "Florida requires 20 consecutive minutes of free-play recess each day for public school students in kindergarten through fifth grade."
  - question: "Does Washington require daily recess?"
    answer: "Yes. Washington requires at least 30 minutes on school days longer than five hours for grades K-5 and sixth graders housed in elementary schools."
  - question: "Does Arizona require two recess periods?"
    answer: "Yes. Arizona requires two recess periods for kindergarten through fifth grade, but state law does not assign a number of minutes to either period."
  - question: "Do all states require elementary school recess?"
    answer: "No. Fourteen states in this table have a direct recess mandate, and many others leave recess schedules to districts or schools."
