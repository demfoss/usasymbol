sections:
  - id: "highest-teacher-salaries"
    icon: "fa-solid fa-arrow-up"
    title: "Highest Paying States for Teachers"
    paragraphs:
      - "California is the only state where the average teacher salary tops $100,000, at $103,552. New York and Washington follow, and all three are home to expensive metro areas where school districts compete with tech, finance, and government employers for college graduates."
      - "Every state in the top ten touches an ocean, from Massachusetts at $93,554 down to Alaska at $81,450. Alaska pays extra to fill classrooms in remote villages reachable only by plane or boat, where food and fuel cost far more than in Anchorage."
