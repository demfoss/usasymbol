page:
  h1: "Teacher Salary by State 2026"

  quick_answer:
    - "Teacher salary by state is highest in California, where the average reached $103,552 in 2024-25. A voter-approved school funding guarantee and union contracts in costly cities push pay above every other state."
    - "Mississippi pays teachers the least, an average of $54,975. Pay there follows a salary schedule written by the legislature, and districts in the state with the lowest income per person have little money to add on top."
    - "Arkansas ranks 44th for average pay at $59,193 yet 15th for starting pay at $50,076. The 2023 LEARNS Act raised the minimum salary for every Arkansas teacher to $50,000."

  methodology: "Average and starting public school teacher salaries for 2024-25, from NEA's Rankings and Estimates and Teacher Salary Benchmark reports. Values are nominal dollars, not adjusted for cost of living."

  sources:
    - name: "NEA, Educator Pay Data (Rankings and Estimates)"
      url: "https://www.nea.org/resource-library/educator-pay-and-student-spending-how-does-your-state-rank"
