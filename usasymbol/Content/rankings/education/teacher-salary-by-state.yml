  - id: "starting-teacher-salary"
    icon: "fa-solid fa-seedling"
    title: "Starting Teacher Salary by State"
    paragraphs:
      - "Washington pays new teachers the most at $60,658, ahead of California at $59,424 and New Jersey at $58,727. Much of that pay traces to the McCleary case, in which the state Supreme Court ruled in 2012 that schools were underfunded and ordered lawmakers to pay more of the bill."
      - "New Mexico ranks sixth for starting pay at $54,372 even though its average sits 23rd. Lawmakers raised the legal minimum for beginning teachers in 2022, which lifted new hires faster than veterans."
      - "Montana pays beginners the least at $36,682, the only state below $39,000. Its schools are split among hundreds of small districts, many of them rural, and each one sets its own salary schedule."
    table:
      columns:
