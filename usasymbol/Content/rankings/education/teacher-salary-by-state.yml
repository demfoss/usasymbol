  - id: "why-california-pays-teachers-the-most"
    icon: "fa-solid fa-scale-balanced"
    title: "Why California Pays Teachers the Most"
    paragraphs:
      - "California averages $103,552 because two state rules steer money toward teacher paychecks. Proposition 98, approved by voters in 1988, guarantees schools and community colleges a minimum share of the state budget, a rule that shapes [school spending by state](/rankings/education/school-spending-by-state). A 1975 law also gave teachers the right to bargain contracts with their districts."
      - "Mississippi sits at the other end at $54,975. Lawmakers there write a statewide salary schedule, and in the state with the lowest income per person, few districts can add much on top of it. A 2022 law gave Mississippi teachers the largest raise in state history, yet the state still ranks 50th."

  - id: "lowest-teacher-salaries"
    icon: "fa-solid fa-arrow-down"
    title: "Lowest Paying States for Teachers"
    paragraphs:
      - "Mississippi, Florida, and Louisiana pay the lowest averages, all under $57,000. Florida is the odd case, since its $49,435 starting salary ranks 18th. A 2020 state law spent heavily on lifting beginner pay, while veteran teachers received much smaller raises and the average stayed near the bottom."
      - "Missouri at $57,366 and West Virginia at $58,099 round out the bottom five. West Virginia teachers walked out in every county in 2018 over pay and health insurance, and the strike inspired similar walkouts in Oklahoma and Arizona that spring, a moment that renewed interest in [union membership by state](/rankings/economy/union-membership-rate-by-state)."
    table:
      columns:
        state: "State"
        salary: "Average Salary"
        starting: "Starting Salary"
