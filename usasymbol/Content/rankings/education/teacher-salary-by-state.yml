faq:
  - question: "What state pays teachers the most?"
    answer: "California, with an average teacher salary of $103,552 a year. New teachers do well there too, starting at $59,424, second only to Washington."

  - question: "Which state pays teachers the least?"
    answer: "Mississippi, at $54,975 a year on average. Starting pay there is $43,814, which ranks 42nd, so Mississippi teachers fall further behind other states as they gain experience."

  - question: "How much does a teacher make in Texas?"
    answer: "Texas teachers earn an average of $63,749, which ranks 32nd. Starting pay looks better at $49,465, 17th in the country, as fast-growing districts around Houston, Dallas, and Austin compete for new hires."

  - question: "How much does a teacher make in New York?"
    answer: "$98,655 a year on average, second only to California. New York City runs the largest school district in the nation, and its union contract pulls the statewide average up. Starting pay is $51,612, which ranks 12th."

  - question: "What is the average teacher salary in the US?"
    answer: "Public school teachers averaged $74,495 nationally in 2024-25. Sixteen states pay more than that, from California down to Nevada at $74,812."

  - question: "What is the starting teacher salary in Washington?"
    answer: "$60,658, the highest of any state. Washington also ranks third for average pay at $96,589, so its teachers start high and stay near the top."

  - question: "Where do teachers make the most after cost of living?"
    answer: "The salaries in this table are not adjusted for living costs, so no adjusted ranking appears here. California, New York, and Massachusetts lead in raw pay but also rank among the priciest places to live, as the [cost of living by state](/rankings/economy/states-by-cost-of-living) ranking shows."

