  description: "Arizona has the highest student-teacher ratio at 22.7 students per teacher. Vermont has the lowest at 10.4, followed by Maine at 11.3."
page:
  h1: "Student-Teacher Ratio by State"
  quick_answer:
    - "Student-teacher ratio is highest in Arizona at 22.7 students per teacher, a result of years of tight school budgets and a persistent teacher shortage. California follows at 21.8 and Nevada at 21.3."
    - "Vermont has the lowest ratio at 10.4. Its small towns keep many small schools open even as enrollment shrinks, so each teacher serves far fewer students than in the West."
    - "Utah, at 20.6, is the fourth state above 20. Seven states sit below 12, all in New England or the Mid-Atlantic."
  methodology: "Public school students per full-time-equivalent teacher in school year 2023-24, from the NCES Common Core of Data state summary. The U.S. figure is 15.2. D.C., U.S. territories and Defense Department schools are excluded."
