  - id: states-with-the-lowest-student-teacher-ratio
    icon: "fa-solid fa-user-group"
    title: "States With the Lowest Student-Teacher Ratio"
    paragraphs:
      - "Vermont has the lowest ratio, 10.4 students per teacher, and the fewest public school students of any state. Many of its schools sit in small towns that serve only a few hundred children, yet each still needs a full staff. Maine, New Hampshire and Wyoming show the same pull of rural schools in thinly populated states."
      - "New York has the biggest teacher workforce of the low-ratio states, with 217,522 full-time teachers. Its wealthy suburban districts and big-city systems hire heavily and pay well, a pattern visible in [teacher salary by state](/rankings/education/teacher-salary-by-state)."
