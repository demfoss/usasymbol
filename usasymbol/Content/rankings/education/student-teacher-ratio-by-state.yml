  - id: student-teacher-ratio-vs-class-size
    icon: "fa-solid fa-people-line"
    title: "Student-Teacher Ratio vs Class Size"
    paragraphs:
      - "A ratio of 14.7, as in Texas and Minnesota, does not mean 14 or 15 children sit in each room. The ratio divides all students by all teachers, including special education teachers, art and music teachers, and others who do not run a homeroom, so the average class is larger. For counts of students in a single classroom, see [average class size by state](/rankings/education/average-class-size-by-state)."
faq:
  - question: "Which state has the highest student-teacher ratio?"
    answer: "Arizona, with 22.7 students per teacher. California follows at 21.8, and Nevada and Utah also top 20."
  - question: "Which state has the lowest student-teacher ratio?"
    answer: "Vermont, at 10.4. Its public schools enroll fewer students than any other state's, spread across small rural towns."
  - question: "What is the student-teacher ratio in California?"
    answer: "California has 21.8 students per teacher, second highest in the country. With more than 5.8 million public school students, it is also the largest system in the table."
  - question: "What is the student-teacher ratio in Texas?"
    answer: "Texas has 14.7 students per teacher, tied with Minnesota at 19th. That is below the national figure of 15.2, even though Texas has the second-largest public school enrollment after California."
  - question: "Which states have a student-teacher ratio below 12?"
    answer: "Seven states, Vermont, Maine, New Hampshire, New York, Massachusetts, New Jersey and Connecticut. All are in New England or the Mid-Atlantic."
  - question: "What is the national student-teacher ratio?"
    answer: "Public schools averaged 15.2 students per full-time teacher in 2023-24. Seventeen states sit above that figure and 33 sit below it."
