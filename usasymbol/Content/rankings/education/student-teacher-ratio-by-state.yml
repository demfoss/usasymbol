sections:
  - id: why-arizona-has-the-highest-student-teacher-ratio
    icon: "fa-solid fa-chalkboard-user"
    title: "Why Arizona Has the Highest Ratio"
    paragraphs:
      - "Arizona fits about 22.7 students to every teacher. The state has long spent less on each pupil than most of the country, and schools struggle to fill classroom jobs, so many districts run larger classes and leave positions open. Teachers walked out in 2018 in the #RedForEd protests over pay and school funding."
      - "The other three states above 20 are California, Nevada and Utah, all in the West. Utah has an unusually young population and many large families, so its schools take in a lot of students per adult on staff. Spending in all four is covered in [school spending by state](/rankings/education/school-spending-by-state)."
