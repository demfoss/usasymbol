sections:
  - id: "why-texas-has-the-most-school-districts"
    icon: "fa-solid fa-school"
    title: "Why Texas Has the Most School Districts"
    paragraphs:
      - "Texas has 1,024 regular districts, called independent school districts, and each one has its own elected board and tax rate, separate from city and county government. Rural communities across a state this large each built their own, so many districts serve only a handful of small-town schools."
      - "California is close behind at 991, with hundreds of small elementary districts that never merged with their neighbors. Illinois (857) has a similar patchwork of township and elementary districts. For what these systems spend per student, see [school spending by state](/rankings/education/school-spending-by-state)."
    table:
      columns:
        state: "State"
        regular: "Regular Districts"
        total: "Total Agencies"
      rows:
        - state: "Texas"
          regular: "1,024"
          total: "1,232"
        - state: "California"
