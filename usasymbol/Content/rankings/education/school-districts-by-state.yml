seo:
  title: "School Districts by State | Map & Rankings"
  description: "Texas has the most regular public school districts at 1,024, then California at 991. Hawaii runs all its public schools as one statewide district."

page:
  h1: "School Districts by State"

  quick_answer:
    - "School districts by state are most numerous in Texas, with 1,024 regular public districts. Texas lets local communities form their own independent districts, and many of them are small-town systems."
    - "Hawaii has exactly one, a single statewide district that runs every public school from the capital. Nevada (18), Delaware (19) and Maryland (24) also have very few, and in Nevada and Maryland the districts follow county lines."
    - "California ranks second with 991 regular districts, but adds 999 independent charter districts for 2,116 agencies in all. That is the largest total of any state."

  methodology: "Regular public school districts in school year 2021-22 from the NCES Digest of Education Statistics, Table 214.30. Regular districts exclude service agencies, state and federal agencies, and independent charter districts. Counts cover the 50 states."

  sources:
    - name: "NCES, Digest of Education Statistics, Table 214.30"
      url: "https://nces.ed.gov/programs/digest/d22/tables/dt22_214.30.asp"
      description: "Number of public elementary and secondary education agencies by type and state"

