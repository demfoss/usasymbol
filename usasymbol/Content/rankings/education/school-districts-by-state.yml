  - id: "states-with-the-fewest-school-districts"
    icon: "fa-solid fa-building-columns"
    title: "States With the Fewest School Districts"
    paragraphs:
      - "Hawaii operates all of its public schools as a single statewide system, so the whole state has one district. Maryland (24), Nevada (18) and Florida (67) build districts around counties, which keeps the number close to the number of counties. Compare with [counties by state](/rankings/geography/counties-by-state)."
      - "Louisiana has 75, drawn mostly around its parishes. Utah has only 41 regular districts, yet it also lists 114 independent charter districts."

  - id: "states-with-the-most-charter-districts"
    icon: "fa-solid fa-chalkboard-user"
    title: "States With Many Charter Districts"
    paragraphs:
      - "California counts 999 independent charter districts, a legal status that lets a charter school act as its own district, so its total reaches 2,116. Arizona has only 222 regular districts but 431 charter districts, giving a total of 690."
      - "North Carolina (204), New York (330), Ohio (324) and Michigan (291) also add hundreds. Classroom numbers for these states appear in [average class size by state](/rankings/education/average-class-size-by-state)."

