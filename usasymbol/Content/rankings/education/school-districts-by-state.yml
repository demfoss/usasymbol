faq:
  - question: "Which state has the most school districts?"
    answer: "Texas, with 1,024 regular public districts. California has more agencies in total, 2,116, but most of the gap is independent charter districts."

  - question: "Which state has only one school district?"
    answer: "Hawaii. The Hawaii Department of Education runs every public school in the state, so the state itself is the district."

  - question: "How many school districts are in Texas?"
    answer: "1,024 regular districts and 185 charter districts, for 1,232 education agencies in all."

  - question: "How many school districts are in California?"
    answer: "991 regular districts and 999 independent charter districts, for 2,116 agencies in all."

  - question: "Why does Maryland have so few school districts?"
    answer: "Maryland has 24 regular districts, one for each of its 23 counties plus Baltimore City. County boundaries rather than towns decide where districts begin and end."

  - question: "What is a regular school district?"
    answer: "A regular district is a traditional public school system that covers a set geographic area, such as a county, city or town. It is separate from charter districts, which are independent operators, and from service agencies that support several districts."

