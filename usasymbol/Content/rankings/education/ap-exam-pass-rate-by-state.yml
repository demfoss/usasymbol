sections:
  - id: why-massachusetts-leads-ap-pass-rates
    title: "Why Massachusetts Leads AP Pass Rates"
    paragraphs:
      - "Massachusetts leads at 32.8%. Its public schools combine broad access to college-level courses with consistently strong preparation, and programs such as the state's AP STEM and English initiative help schools open demanding classes to more students."
      - "New Jersey and New York tie at 30.7%, while Connecticut reaches 29.5%. All four leaders also sit near the top of [public school rankings by state](/rankings/education/public-school-rankings-by-state)."
  - id: states-with-lowest-ap-pass-rates
    title: "States With the Lowest AP Pass Rates"
    paragraphs:
      - "Mississippi is last at 8.5%, followed by Oklahoma at 10.0% and Louisiana at 10.1%. Mississippi has expanded access since 2014, but earning the benchmark still depends on students having both an AP course available and enough preparation to score 3 or higher."
      - "Kansas and West Virginia tie at 10.7%. The [SAT scores by state](/rankings/education/sat-scores-by-state) page shows a similar reason to read state testing results alongside participation patterns."
  - id: biggest-ap-pass-rate-gains
    title: "Biggest AP Pass Rate Gains"
    paragraphs:
      - "New Jersey posted the largest gain, moving from 23.5% in 2014 to 30.7% in 2024. Rhode Island added 7.1 percentage points, Illinois added 6.7, and Hawaii added 6.4."

