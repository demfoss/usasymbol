faq:
  - question: "Which state has the highest AP exam pass rate?"
    answer: "Massachusetts ranks first at 32.8% of 2024 public high school graduates. The measure counts graduates who earned at least one score of 3 or higher during high school."
  - question: "Which state has the lowest AP exam pass rate?"
    answer: "Mississippi ranks last at 8.5%. Its rate was 4.7% for the class of 2014, so the 2024 class finished 3.8 percentage points higher."
  - question: "What is the AP exam pass rate in California?"
    answer: "California ranks sixth at 28.2%. Its 2024 rate is 3.2 percentage points above its 2014 rate of 25.0%."
  - question: "What is the AP exam pass rate in Texas?"
    answer: "Texas ranks 17th at 21.5%. The state moved up from 18.4% in 2014."
  - question: "Does an AP score of 3 count as passing?"
    answer: "A score of 3 is the benchmark used here. Many colleges award credit or advanced placement for a 3, though each institution sets its own policy."
  - question: "Which state improved the most on AP exams?"
    answer: "New Jersey gained the most, rising 7.2 percentage points from 23.5% in 2014 to 30.7% in 2024. Rhode Island was close behind with a 7.1-point gain."

