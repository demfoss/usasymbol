sections:
  - id: why-utah-has-the-largest-university
    icon: "fa-solid fa-laptop"
    title: "Why Utah Has the Largest University"
    paragraphs:
      - "Utah leads because Western Governors University enrolls 185,015 students through online programs available across the country. Governors from 19 western states created the nonprofit university in 1997, and its competency-based model lets students advance by demonstrating what they know."
      - "New Hampshire's leader follows the same broad pattern. Southern New Hampshire University has 184,099 students, with online enrollment extending far beyond its Manchester campus. Utah's broader college participation appears in the [college enrollment rate by state](/rankings/education/college-enrollment-rate-by-state) ranking."
    table:
      columns:
        rank: "Rank"
        state: "State"
        institution: "Largest University"
        enrollment: "Enrollment"
      rows:
        - { rank: "1", state: "Utah", institution: "Western Governors University", enrollment: "185,015" }
        - { rank: "2", state: "New Hampshire", institution: "Southern New Hampshire University", enrollment: "184,099" }
        - { rank: "3", state: "Arizona", institution: "Grand Canyon University", enrollment: "107,563" }
        - { rank: "4", state: "Virginia", institution: "Liberty University", enrollment: "103,068" }
        - { rank: "5", state: "Texas", institution: "Texas A&M University", enrollment: "76,633" }
        - { rank: "6", state: "Florida", institution: "University of Central Florida", enrollment: "69,233" }
        - { rank: "7", state: "Maryland", institution: "University of Maryland Global Campus", enrollment: "60,084" }
        - { rank: "8", state: "Ohio", institution: "Ohio State University", enrollment: "60,046" }
        - { rank: "9", state: "New York", institution: "New York University", enrollment: "57,335" }
