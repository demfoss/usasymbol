faq:
  - question: "What is the largest university in the United States by enrollment?"
    answer: "Among the state leaders here, Western Governors University is largest at 185,015 students. Its online programs enroll students nationwide while the institution is based in Utah."
  - question: "What is the largest university in Texas?"
    answer: "Texas A&M University at College Station is Texas's largest four-year institution, with 76,633 students in fall 2023."
  - question: "What is the largest university in California?"
    answer: "The University of Southern California is California's largest four-year institution at 47,147 students. It ranks 20th among the 50 state leaders."
  - question: "What is the largest university in Florida?"
    answer: "The University of Central Florida is Florida's largest at 69,233 students. Its main campus is in Orlando."
  - question: "Which state has the smallest largest university?"
    answer: "Alaska. University of Alaska Anchorage leads the state with 10,796 students, followed nationally by the University of Wyoming at 10,913."
  - question: "Are online students included in university enrollment?"
    answer: "Yes. Students enrolled exclusively online are included in each institution's total, which is why Utah, New Hampshire, Arizona and Virginia have unusually large state leaders."
