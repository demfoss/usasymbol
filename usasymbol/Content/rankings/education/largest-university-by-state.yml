page:
  h1: "Largest University by State"
  quick_answer:
    - "Largest university by state enrollment is Western Governors University in Utah, with 185,015 students. Its online model reaches students nationwide from a Utah headquarters."
    - "Southern New Hampshire University is close behind at 184,099. Grand Canyon University in Arizona ranks third with 107,563, and both also enroll large online populations."
    - "University of Alaska Anchorage is Alaska's largest four-year university at 10,796 students, the smallest state-leading enrollment in the country."
  methodology: "NCES IPEDS fall 2023 enrollment for four-year degree-granting institutions. Each school is assigned to its IPEDS state, including online students enrolled at institutions headquartered there."
