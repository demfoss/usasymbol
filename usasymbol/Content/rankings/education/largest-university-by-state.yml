  - id: smallest-state-leading-universities
    icon: "fa-solid fa-building-columns"
    title: "Smallest State-Leading Universities"
    paragraphs:
      - "Alaska's University of Alaska Anchorage is the smallest state leader at 10,796 students. Alaska's limited road network and widely scattered population divide public higher education among Anchorage, Fairbanks, Southeast and community campuses instead of concentrating it in one enormous university."
      - "Wyoming follows at 10,913 because the University of Wyoming is the state's only public four-year university. Maine and the Dakotas also have smaller leaders, while their [college tuition by state](/rankings/education/college-tuition-by-state) reflects a different question about the price students pay."
