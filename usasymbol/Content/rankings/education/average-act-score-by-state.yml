faq:
  - question: "Which state has the highest average ACT score?"
    answer: "The District of Columbia, at 27.60, though only 10% of its graduates took the test."

  - question: "Which state has the lowest average ACT score?"
    answer: "Nevada, at 17.20, one of nine states with 100% ACT participation."

  - question: "Which states have 100% ACT participation?"
    answer: "Alabama, Kentucky, Louisiana, Mississippi, Nebraska, Nevada, Oklahoma, Tennessee, and Wyoming."

  - question: "Is there a pattern between ACT participation and average score?"
    answer: "Yes. All nine states with 100% participation score below 19.5, while every state with a composite of 24 or higher tested 10% or fewer of its graduates."

  - question: "What is the average ACT score in Texas?"
    answer: "19.30, with 22% of graduates tested."

  - question: "What is the average ACT score in California?"
    answer: "26.40, tied with Massachusetts for third highest, with only 4% of graduates tested."

