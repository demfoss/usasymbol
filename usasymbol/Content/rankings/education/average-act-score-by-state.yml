sections:
  - id: "states-with-the-highest-act-scores"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest Average ACT Scores"
    paragraphs:
      - "The District of Columbia leads at 27.60, just ahead of Connecticut at 27.10. Massachusetts and California tie for third at 26.40, and New York and New Hampshire tie for fifth at 25.90."

  - id: "states-with-the-lowest-act-scores"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Average ACT Scores"
    paragraphs:
      - "Nevada has the lowest average composite score at 17.20. Oklahoma and Hawaii tie for the second lowest at 17.50, and Mississippi and Arizona tie at 17.70."

  - id: "act-participation-and-scores"
    icon: "fa-solid fa-chart-line"
    title: "States With 100% ACT Participation Score Lowest"
    paragraphs:
      - "Nine states test 100% of graduates: Alabama, Kentucky, Louisiana, Mississippi, Nebraska, Nevada, Oklahoma, Tennessee, and Wyoming. All nine score below 19.5, and none rank above 36th."
      - "Every state with a composite score of 24 or higher tested 10% or fewer of its graduates. Alaska (19.70) and New Mexico (20.60) are exceptions on the other end: both test 9% or fewer graduates yet still score well below the top tier."

