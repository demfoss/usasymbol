faq:
  - question: "How much does a librarian make in California?"
    answer: "California librarians average $92,300 a year or $44.38 an hour. Public librarians organize children's story times and book clubs."
  - question: "How much does a librarian make in Texas?"
    answer: "Texas librarians average $72,400 annually, with a $71,860 median. School specialists teach research skills and find classroom materials, supporting the work covered in [teacher salary by state](/rankings/education/teacher-salary-by-state)."
  - question: "How much does a librarian make in New York?"
    answer: "New York librarians average $84,890 a year. Academic librarians guide students and faculty through specialized research resources."
  - question: "How much does a librarian make in Florida?"
    answer: "Florida librarians average $68,540 a year or $32.95 an hour. Evening and weekend openings can put library work outside school-day hours."
  - question: "How much does a librarian make in Maryland?"
    answer: "Maryland's median librarian wage is $88,570 a year. Special librarians manage collections for hospitals, law firms, museums, and government agencies."
  - question: "How much does a librarian make in Illinois?"
    answer: "Illinois librarians and library media specialists average $69,420 annually. School specialists help develop lessons, alongside other educational support roles covered in [school counselor salary by state](/rankings/education/school-counselor-salary-by-state)."
