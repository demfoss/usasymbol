page:
  h1: "Librarian Salary by State"
  quick_answer:
    - "Librarian salary by state is highest in Washington at $98,530 annually. Seattle's negotiated library pay includes cost-of-living adjustments, linking professional wages to the local economy."
    - "West Virginia averages $46,340, the lowest state wage. Its unusually low housing rents help explain a lower-pay local labor market."
    - "New York employs 11,870 librarians and library media specialists. The profession spans public libraries, school media centers, universities, and specialized research collections."
  methodology: "BLS OEWS May 2025 cross-industry employee estimates for librarians and library media specialists, SOC 25-4022, in all 50 states, ordered by mean annual wage. DC, territories, self-employed workers, and library assistants are excluded."
  sources:
