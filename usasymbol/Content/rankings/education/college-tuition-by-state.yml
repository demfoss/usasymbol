    title: "Out-of-State Tuition by State"
    paragraphs:
      - "Michigan charges nonresidents $45,690, the highest in the country and $28,990 above its in-state price of $16,700. Vermont comes next at $44,180, then California at $42,100. California's gap of $30,150 between residents and outsiders is the widest of any state."
      - "South Dakota and North Dakota charge nonresidents just $3,660 and $4,370 more than residents, which makes their out-of-state prices of $13,050 and $15,450 the lowest in the table. Both states run discount programs to attract students from neighboring states, including North Dakota's reciprocity agreement with Minnesota."
