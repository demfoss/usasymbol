  title: "College Tuition by State 2026 | Map & Rankings"
  description: "Vermont has the highest in-state tuition at public four-year colleges at $18,090. Florida is lowest at $6,360. Michigan tops out-of-state prices."
page:
  h1: "College Tuition by State 2026"
  quick_answer:
    - "College tuition by state is highest in Vermont, where public four-year colleges charge in-state students an average of $18,090 a year. New Hampshire follows at $18,000 and New Jersey at $17,960."
    - "Florida has the lowest in-state tuition at $6,360, followed by Wyoming at $7,430. Florida has held tuition at its state universities flat since 2013, which keeps it far below the national average of $11,950."
    - "Out-of-state students pay the most in Michigan at $45,690 and Vermont at $44,180. California adds the biggest premium over its in-state price at $30,150, while the Dakotas add only $3,660 to $4,370."
  methodology: "Average published tuition and fees for full-time students at public four-year institutions in 2025-26, enrollment-weighted, from the College Board Trends in College Pricing 2025 state table. Rank is by in-state price. The District of Columbia is not ranked. Private college tuition is not included."
