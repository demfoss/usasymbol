    title: "Cheapest States for College Tuition"
    paragraphs:
      - "Florida is the cheapest at $6,360. The legislature has kept undergraduate tuition at the state universities flat since 2013, and the Bright Futures scholarship helps pay tuition for Florida students who meet its grade and test requirements."
      - "Wyoming follows at $7,430. It has only one public four-year university, the University of Wyoming in Laramie, and the Hathaway Scholarship, funded from the state's mineral revenue, helps residents pay for it. North Carolina at $7,540 has a constitution that calls for public university education to be as free of expense as practicable."
