sections:
  - id: why-vermont-has-the-highest-tuition
    icon: "fa-solid fa-sack-dollar"
    title: "Why Vermont Has the Highest Tuition"
    paragraphs:
      - "Vermont charges in-state students $18,090 on average, and New Hampshire sits just $90 behind at $18,000. Both are small states that have long been among those spending the least public money per college student, so tuition at the University of Vermont and the University of New Hampshire covers more of the bill than it does in most states."
      - "New Jersey at $17,960, Connecticut at $17,360 and Pennsylvania at $16,950 complete the top five. Pennsylvania's big universities, Penn State, Pitt and Temple, are state-related rather than fully state-run, and their prices sit far above neighboring Ohio at $13,840."
