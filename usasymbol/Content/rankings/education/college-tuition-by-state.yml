faq:
  - question: "Which state has the highest college tuition?"
    answer: "Vermont, followed by New Hampshire and New Jersey. A student from outside Vermont pays $44,180 at its public colleges, which is $26,090 more than a resident."
  - question: "Which state has the cheapest college tuition?"
    answer: "Florida, at $6,360 for in-state students at public four-year colleges. Its out-of-state price of $23,400 is only the third lowest in the country, behind South Dakota and North Dakota."
  - question: "What is the average college tuition in California?"
    answer: "California public four-year colleges average $11,950 for in-state students, exactly the national average. Out-of-state students pay $42,100."
  - question: "How much is out-of-state tuition in Texas?"
    answer: "Texas public four-year colleges charge nonresidents $30,110, compared with $11,260 for residents."
  - question: "Why is out-of-state tuition higher?"
    answer: "State taxes help pay for public colleges, and nonresident families have not paid them. Out-of-state students therefore pay a price much closer to the full cost of instruction."
  - question: "Does high tuition mean high student debt?"
    answer: "Not always. Maryland ranks 25th for in-state tuition at $11,480, yet its borrowers carry the highest average balance in the [student loan debt by state](/rankings/education/student-loan-debt-by-state) ranking."
