sections:
  - id: why-massachusetts-leads-math-scores
    icon: "fa-solid fa-trophy"
    title: "Why Massachusetts Leads Math Scores"
    paragraphs:
      - "Massachusetts scores 283 in eighth grade, tied with Wisconsin, and 246 in fourth grade, three points clear of any other state. The lead traces back to the Education Reform Act of 1993, which guaranteed a minimum level of spending per student in every district, wrote statewide curriculum standards, and created the MCAS tests. The 10th grade exams became a graduation requirement for the class of 2003."
      - "Wisconsin's 283 fits a pattern across the northern Plains and Upper Midwest. Minnesota, Utah, and New Jersey follow at 282, and South Dakota, Nebraska, and North Dakota all rank seventh or better. Funding differences are tracked in [school spending by state](/rankings/education/school-spending-by-state)."
    table:
      columns:
        rank: "Rank"
        state: "State"
        grade8: "Grade 8"
        grade4: "Grade 4"
      rows:
        - { rank: 1, state: "Massachusetts", grade8: "283", grade4: "246" }
