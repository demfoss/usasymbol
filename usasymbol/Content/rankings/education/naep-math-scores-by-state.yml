  - id: why-new-mexico-has-the-lowest-math-scores
    icon: "fa-solid fa-arrow-trend-down"
    title: "Why New Mexico Has the Lowest Math Scores"
    paragraphs:
      - "New Mexico scores 256 in eighth grade and 224 in fourth grade, the lowest in both. In 2018 a state district judge ruled in the Yazzie and Martinez cases that New Mexico was not giving low-income, Native American, English learner, and disabled students the adequate education its constitution requires."
      - "West Virginia (261) and Alabama (262) are the next lowest in eighth grade. Alaska's fourth grade score of 226 is second lowest in the country, ahead of only New Mexico, and the gap between New Mexico and Massachusetts in eighth grade is 27 points."
