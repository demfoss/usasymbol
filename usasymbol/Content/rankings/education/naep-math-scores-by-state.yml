faq:
  - question: "Which state has the highest NAEP math score?"
    answer: "Massachusetts has the highest fourth grade score at 246, and its eighth grade score of 283 ties Wisconsin. Minnesota, Utah, and New Jersey follow in eighth grade at 282."

  - question: "Which state has the lowest NAEP math score?"
    answer: "New Mexico, at 256 in eighth grade and 224 in fourth grade. West Virginia is next lowest in eighth grade at 261."

  - question: "What is the average NAEP math score in Texas?"
    answer: "Texas averages 269 in eighth grade, which ranks 34th, and 241 in fourth grade, which is tied for sixth highest."

  - question: "What is the average NAEP math score in California?"
    answer: "California averages 269 in eighth grade, tied with Texas, Mississippi, and Georgia at 34th. Its fourth grade average is 233."

  - question: "What is the national average NAEP math score?"
    answer: "The national public school average is 272 in eighth grade and 237 in fourth grade. In eighth grade, 26 states score above the national average."

  - question: "Which states have the best fourth grade math scores?"
    answer: "Massachusetts leads at 246, followed by Florida and Wyoming at 243 and New Hampshire and Utah at 242."

  - question: "Where can I see other state test scores?"
    answer: "Reading results from the same assessment are on the [NAEP reading scores by state](/rankings/education/naep-reading-scores-by-state) page. College-bound math and verbal results are in [SAT scores by state](/rankings/education/sat-scores-by-state)."

