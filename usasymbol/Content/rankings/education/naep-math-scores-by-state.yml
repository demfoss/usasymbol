page:
  h1: "NAEP Math Scores by State 2026"

  quick_answer:
    - "Massachusetts and Wisconsin lead NAEP math scores by state with an eighth grade average of 283, and Massachusetts also tops fourth grade at 246."
    - "New Mexico has the lowest scores in both grades, 256 in eighth grade and 224 in fourth grade, and a 2018 court ruling found the state was failing its at-risk students."
    - "Florida and Wyoming tie for second in fourth grade at 243, but Florida falls to 267 in eighth grade, 41st place, while Wyoming holds 278."

  methodology: "NAEP 2024 average scale scores (0-500) for public school students in grades 4 and 8, released January 2025. States are ranked by the grade 8 score and tie when equal after rounding. The District of Columbia and DoDEA schools are not included. The national public average is 272 in grade 8 and 237 in grade 4."

