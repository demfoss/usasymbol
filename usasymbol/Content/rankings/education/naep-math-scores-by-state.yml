  - id: fourth-grade-vs-eighth-grade-math-scores
    icon: "fa-solid fa-ruler-combined"
    title: "Fourth Grade vs Eighth Grade Math Scores"
    paragraphs:
      - "Florida and Wyoming tie for second in fourth grade at 243, yet their eighth grade results split. Wyoming holds 278 and ranks 12th, while Florida drops to 267 and ranks 41st."
      - "Texas shows the same drop on a smaller scale. Its fourth grade score of 241 is tied for sixth, but its eighth grade score of 269 ranks 34th. Wisconsin goes the other way, with a fourth grade score of 239 and an eighth grade score that ties for first."
