faq:
  - question: "What is the most popular book genre by state?"
    answer: "Fantasy is the most popular book genre in the most states, ranking first in 11 states. Thriller is close behind, ranking first in 10 states."

  - question: "Which states have fantasy as their most popular book genre?"
    answer: "Fantasy tops 11 states: Alaska, Arizona, Arkansas, Connecticut, Hawaii, Massachusetts, Nebraska, New Hampshire, North Carolina, Utah, and West Virginia."

  - question: "What is the most popular book genre in Texas?"
    answer: "Thriller is the most popular book genre in Texas, the same top genre as 9 other states."

  - question: "What is the most popular book genre in California?"
    answer: "Horror is California's most popular book genre, tied with 8 other states for the third-highest total on this list."

  - question: "Which states have a most popular book genre found nowhere else?"
    answer: "4 states have a unique top genre. Kansas leads in Parenting, Mississippi in Children's, South Dakota in Mystery, and Vermont in Science fiction."

  - question: "Is thriller the most popular book genre in more than one state?"
    answer: "Thriller ranks first in 10 states, including Delaware, Georgia, Ohio, Tennessee, Texas, and Wyoming, the second-highest total of any genre on this list."

