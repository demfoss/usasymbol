sections:
  - id: "states-with-the-most-bigfoot-sightings"
    icon: "fa-solid fa-paw"
    title: "States With the Most Bigfoot Sightings"
    paragraphs:
      - "Washington's 676 reports lead every other state by a wide margin, more than California's second-place total of 445. Florida (328), Ohio (302), and Illinois (296) round out the top five, none of them typically associated with Pacific Northwest wilderness."
      - "Oregon (254, 6th) and Texas (246, 7th) are close behind. Michigan (220) and Missouri (154) hold the 8th and 9th spots, both states with large forested or wooded regions."
    table:
      numbered: true
      columns:
        state: "State"
        total_sightings: "Total Sightings"
      rows:
        - state: "Washington"
