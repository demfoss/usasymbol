faq:
  - question: "Which state has the most Bigfoot sightings?"
    answer: "Washington has the most Bigfoot sightings of any state, 676 reports in the BFRO database. California ranks second with 445, and Florida third with 328."

  - question: "Which state has the most Bigfoot sightings per capita?"
    answer: "Washington leads per capita as well, at 8.9 sightings per 100,000 residents. Oregon ranks second at 6.0, and West Virginia third at 5.8."

  - question: "Why does Washington have so many Bigfoot sightings?"
    answer: "The word 'Sasquatch' originates from the Halkomelem language of the Coast Salish peoples native to the Pacific Northwest. Washington's dense, old-growth forests also cover more remote terrain than most other states on the list."

  - question: "What state has the fewest Bigfoot sightings?"
    answer: "North Dakota has the fewest reports of any state, just 6. Delaware and Rhode Island are tied for second-fewest at 5 each."

  - question: "How many Bigfoot sightings has California had?"
    answer: "California has 445 Bigfoot sightings on record, second only to Washington. Its per-capita rate of 1.1 per 100,000 is far below Washington's 8.9, since California's much larger population spreads the same kind of report count much thinner."

  - question: "Is Ohio a hotspot for Bigfoot sightings?"
    answer: "Yes. Ohio ranks 4th nationally with 302 reports, more than traditionally forested Western states like Idaho (93) or Montana (52), though its per-capita rate of 2.6 per 100,000 is far below Washington's 8.9."

