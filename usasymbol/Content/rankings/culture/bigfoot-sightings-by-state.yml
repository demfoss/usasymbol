page:
  h1: "Bigfoot Sightings by State"

  quick_answer:
    - "Washington has 676 Bigfoot sighting reports on file with the BFRO, more than any other state. California ranks second with 445, and Florida third with 328."
    - "Washington also leads per capita at 8.9 sightings per 100,000 residents. Oregon ranks second at 6.0, and West Virginia third at 5.8, all well ahead of the national spread."
    - "North Dakota has the fewest reports of any state with just 6, while Delaware and Rhode Island are tied for second-fewest at 5 each."

  methodology: "Sighting counts come from the BFRO (Bigfoot Field Researchers Organization) geographical database, its central catalog of investigated and submitted reports; totals reflect a database snapshot compiled in 2020. Per-capita rates use 2019 U.S. Census population figures. All reports are unverified eyewitness submissions, not confirmed sightings."

  sources:
    - name: "BFRO. Geographical Database of Bigfoot Sightings & Reports"
      url: "https://www.bfro.net/gdb/"
      description: "Primary data source: BFRO's catalog of Bigfoot sighting reports by state"
    - name: "U.S. Census Bureau. 2019 National and State Population Estimates"
      url: "https://www.census.gov/programs-surveys/popest.html"
      description: "State population figures used for per-capita calculations"

