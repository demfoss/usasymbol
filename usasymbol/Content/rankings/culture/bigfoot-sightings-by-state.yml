        - state: "Georgia"
          total_sightings: 132

  - id: "why-washington-has-the-most-bigfoot-sightings"
    icon: "fa-solid fa-tree"
    title: "Why Washington Has the Most Bigfoot Sightings"
    paragraphs:
      - "Washington's lead traces back to where the legend itself began. The word 'Sasquatch' comes from the Halkomelem language of Coast Salish peoples native to the Pacific Northwest, and Washington's dense, old-growth forests cover far more remote ground per report than the flatter, more developed states lower on the list."
      - "The most famous piece of Bigfoot evidence, the 1967 Patterson-Gimlin film, was shot just south of the Washington border in Bluff Creek, California, the same Pacific Coast forest corridor that produces Washington's 676 reports and Oregon's 254, ranked 1st and 6th."

  - id: "states-with-the-highest-bigfoot-sighting-rate"
    icon: "fa-solid fa-chart-bar"
    title: "States With the Highest Bigfoot Sighting Rate per Capita"
    paragraphs:
      - "Washington leads per capita as well as by raw count, at 8.9 sightings per 100,000 residents. Oregon (6.0) and West Virginia (5.8) rank second and third, both states dominated by mountainous, heavily forested terrain."
      - "Idaho (5.2), Montana (4.9), and Wyoming (4.8) fill out the rest of the top six, each with fewer than 100 total reports but small enough populations to post rates that outpace California's 1.1 per 100,000."
    table:
      numbered: true
      columns:
        state: "State"
        per_100k: "Per 100K"
      rows:
