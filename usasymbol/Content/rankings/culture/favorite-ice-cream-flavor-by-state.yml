page:
  h1: "Favorite Ice Cream Flavor by State"

  quick_answer:
    - "Strawberry is the most popular ice cream flavor in the U.S., ranking first in 15 states, from California and Texas to Ohio and Virginia."
    - "Birthday Cake ranks first in 5 states, including Alabama, Delaware, Iowa, Louisiana, and North Carolina. Cookie Dough leads 4 states, and Chocolate Chip leads 4 more."
    - "Several states stand apart with unique top flavors: Florida's is Boba, Oregon's is Lavender, Kansas's is Matcha, and South Carolina's is Peach."

  methodology: "Rankings reflect Innerbody Research's analysis of Google Trends search data for ice cream flavors and brands across all 50 states, published in 2026."

  sources:
