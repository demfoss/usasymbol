sections:
  - id: "strawberry-leads-the-country"
    icon: "fa-solid fa-ice-cream"
    title: "Strawberry Is the Most Popular Flavor Nationwide"
    paragraphs:
      - "Strawberry ranks first in 15 states, more than any other flavor, spanning the South (Arkansas, Kentucky, Mississippi, Tennessee, Texas, Virginia), the Midwest (Michigan, Minnesota, Nebraska, Ohio), and the Northeast (Connecticut, Maryland, Rhode Island). California and Nevada round out the list."
      - "Birthday Cake is the second-most common top flavor, leading in Alabama, Delaware, Iowa, Louisiana, and North Carolina. Cookie Dough and Chocolate Chip each lead 4 states apart."

  - id: "unique-state-flavors"
    icon: "fa-solid fa-star"
    title: "States With a One-of-a-Kind Top Flavor"
    paragraphs:
      - "Five states stand apart with a flavor that ranks first nowhere else: Florida's Boba, Oregon's Lavender, Kansas's Matcha, South Carolina's Peach, and Maine's Blueberry."
      - "Hawaii's top flavor is Coconut and Georgia's is Butter Pecan, both unique in the table as well. New Mexico and New York share Pistachio as their top flavor, the only two states where it ranks first."

