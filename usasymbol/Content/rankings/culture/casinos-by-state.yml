faq:
- question: Which state has the most casinos?
  answer: Nevada leads the property count at 231. A casino count measures locations, so a small venue and a destination resort each contribute one property.
- question: What states have no casinos?
  answer: Georgia, Hawaii, Kentucky, South Carolina, Tennessee, Utah, and Vermont each have 0 listed properties. Casino availability is separate from permission to run a lottery, place a sports wager, or hold a charitable gaming event.
- question: What is the largest casino in the US?
  answer: WinStar World Casino and Resort in Thackerville, Oklahoma, describes itself as the world's biggest casino. Oklahoma has 142 listed properties, but this ranking counts locations rather than comparing their floor areas.
- question: How many casinos are in New Jersey?
  answer: New Jersey has 9 listed casinos. Atlantic City's casino hotels make it a recognizable gambling destination despite a much smaller property count than Nevada.
- question: How many casinos are in California?
  answer: California has 83 listed casinos, placing it third. Pechanga Resort Casino is a tribal property, illustrating why this table includes tribal gaming rather than only commercial casinos.
- question: How many casinos are in New Hampshire?
  answer: New Hampshire has 1 listed property, The Brook. Charitable gaming venues form a separate part of the state's gambling system, outside this compilation's casino-property count.
