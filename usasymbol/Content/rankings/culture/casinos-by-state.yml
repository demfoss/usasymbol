sections:
- id: most-casinos
  icon: fa-solid fa-dice
  title: Why Nevada Has the Most Casinos
  paragraphs:
  - Nevada's 231 casinos reflect a statewide licensing system established after gambling was legalized in 1931. Las Vegas and Reno could build tourism around casino hotels, while operators elsewhere often faced restrictions on location or tribal land. Casinos are only one part of state gambling policy, alongside rules such as [lottery winner anonymity](/rankings/law/lottery-winner-anonymity).
  - Colorado lists 33 casinos, but that total does not imply casinos are permitted in every town. Black Hawk, Central City, and Cripple Creek are historic mining communities where voters authorized commercial casino gambling.
