page:
  h1: Casinos by State
  quick_answer:
  - Casinos by state counts put Nevada first with 231. Statewide gambling legalization in 1931 gave casino operators a legal base long before destination resorts became common elsewhere.
  - Vermont shares last place with 0 listed casinos. Limited nonprofit casino events are allowed there, but a charity event is different from a permanent casino property.
  - Oklahoma has 142 casinos, including Chickasaw-owned WinStar World Casino in Thackerville. Its location near the Texas border puts a tribal gaming destination within reach of visitors from a neighboring state with few casinos.
  methodology: World Population Review's April 2026 compilation counts commercial and tribal casino properties using gaming industry and regulator data. Zero means no listed properties, not a ban on every kind of gambling.
  sources:
  - name: World Population Review, Casinos by State
    url: https://worldpopulationreview.com/state-rankings/casinos-by-state
    description: Casino counts by state, commercial and tribal combined, April 2026
