- id: commercial-and-tribal
  icon: fa-solid fa-coins
  title: Commercial and Tribal Casinos by State
  paragraphs:
  - Oklahoma's 142 casinos include WinStar World Casino, owned and operated by the Chickasaw Nation. Tribal gaming income supports services for tribal citizens, including health care and education, giving these properties a different ownership model from shareholder-owned casino companies.
  - Connecticut has 2 listed casinos, Foxwoods and Mohegan Sun. Both are resort destinations combining gaming with hotels, restaurants, and entertainment, concentrating several visitor activities on a single property.
- id: states-without-casinos
  icon: fa-solid fa-ban
  title: States Without Casinos
  paragraphs:
  - Vermont has 0 listed casino properties and shares the bottom group with Georgia, Hawaii, Kentucky, South Carolina, Tennessee, and Utah. Vermont permits limited nonprofit casino events and regulated sports wagering, so its zero reflects the absence of permanent casino properties rather than the absence of legal betting.
  - Texas has 4 listed casinos, including Kickapoo Lucky Eagle. A populous state can have few casino properties because gambling access depends on legal authorization and tribal jurisdiction rather than [population size](/rankings/demographics/states-by-population) alone.
