    url: https://www.leg.state.nv.us/Division/Research/Publications/InterimReports/1967/Bulletin068.pdf
    description: Legalization of gambling in 1931
  - name: WinStar World Casino and Resort
    url: https://www.winstar.com/footer/about/
    description: Chickasaw ownership and services funded by gaming income
  - name: Vermont Legislature, Gambling and Lotteries
    url: https://legislature.vermont.gov/statutes/section/13/051/02143
    description: Limited nonprofit casino events
  - name: Vermont Legislature, Sports Wagering
    url: https://legislature.vermont.gov/statutes/fullchapter/31/025
    description: Legal sports wagering is separate from casino properties
