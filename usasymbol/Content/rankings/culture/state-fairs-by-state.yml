  paragraphs:
  - Minnesota ranks second with 1,940,869 visitors, and no fair packs in more people per day. Falcon Heights sits between Minneapolis and St. Paul, so most Minnesotans live within an easy drive of the gates.
  - Massachusetts ranks third at 1,538,463 because the Big E is really a fair for all six New England states. Each one keeps a replica of its statehouse along the Avenue of States in West Springfield, and four of them have no official state fair of their own.
- id: oldest-state-fairs
  icon: fa-solid fa-landmark
  title: Oldest State Fairs in America
  table:
    columns:
      fair: Fair
      state: State
      first_held: First Held
    rows:
    - fair: Great New York State Fair
      state: New York
      state_slug: new-york
