    - fair: Indiana State Fair
      state: Indiana
      state_slug: indiana
      first_held: 1852
    - fair: Illinois State Fair
      state: Illinois
      state_slug: illinois
      first_held: 1853
    - fair: North Carolina State Fair
      state: North Carolina
      state_slug: north-carolina
      first_held: 1853
    - fair: Iowa State Fair
      state: Iowa
      state_slug: iowa
      first_held: 1854
  paragraphs:
  - New York held the first state fair in Syracuse in 1841, five years ahead of Vermont. State farm societies organized these early fairs so farmers could compare livestock, seed, and new plows in one place. Iowa, still the leader in [corn production by state](/rankings/agriculture/corn-production-by-state), started its own fair in 1854.
  - Michigan launched its fair in 1849, but state funding ended in 2009 and private organizers revived it in Novi in 2013. Maine's Fryeburg Fair, first held in 1851, is older than every state fair west of the Mississippi.
