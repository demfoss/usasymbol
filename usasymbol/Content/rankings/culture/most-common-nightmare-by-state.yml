faq:
  - question: "What is the most common nightmare in the United States?"
    answer: "Being chased is the most common nightmare nationally, reported at 13.45%. Falling is second at 11.23%, and missing important events is third at 7.83%."

  - question: "Which state has the highest percentage of one nightmare type?"
    answer: "Montana has the highest single-nightmare share of any state. Exactly 50% of respondents there named getting trapped somewhere as their most common nightmare, well above Nebraska's 44.44% for being chased."

  - question: "Why do Iowans dream about tornadoes?"
    answer: "Iowa is the only state where tornadoes rank as the top nightmare, reported by 14.29% of respondents. Iowa logged 69 tornadoes in 2018, the second-highest total of any state that year."

  - question: "What is the most common nightmare in Texas?"
    answer: "Falling, reported by 14.43% of respondents. Texas is one of 10 states where falling ranks as the most common nightmare."

  - question: "What is the most common nightmare in Hawaii?"
    answer: "A loved one dying, reported by 42.86% of respondents. That is the highest share among the three states, Hawaii, Maine, and Nevada, where that nightmare ranks first."

  - question: "Which nightmare type is most common across US states?"
    answer: "Being chased ranks first in 17 states, more than any other type. Falling ranks first in 10 states, and missing important events and being dumped each rank first in 4 states."


