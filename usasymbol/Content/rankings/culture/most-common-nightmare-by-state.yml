sections:
  - id: "most-common-nightmare-type"
    icon: "fa-solid fa-person-falling"
    title: "Most Common Nightmare Type Across US States"
    paragraphs:
      - "Being chased ranks as the top nightmare in 17 states, more states than any other nightmare type. Nationally it accounts for 13.45% of nightmares, ahead of falling at 11.23%. Falling ranks first in 10 states, including Texas at 14.43%, California at 11.59%, and Maryland at 23.33%."

  - id: "why-iowa-tornadoes"
    icon: "fa-solid fa-tornado"
    title: "Why Iowa Dreams About Tornadoes"
    paragraphs:
      - "Iowa is the only state where tornadoes rank as the most common nightmare, reported by 14.29% of respondents. Iowa recorded 69 tornadoes in 2018, the second-highest total of any state, a frequency the source ties directly to the state's tornado nightmares."

  - id: "standout-nightmare-percentages"
    icon: "fa-solid fa-chart-simple"
    title: "States With the Highest Single-Nightmare Share"
    paragraphs:
      - "Montana posts the highest single-nightmare share of any state: 50% of respondents there named getting trapped somewhere as their top nightmare. Nebraska follows at 44.44% for being chased, and New Hampshire sits close behind at 40% for the same nightmare type. Hawaii's 42.86% for a loved one dying is the highest share among the three states where that nightmare ranks first."


