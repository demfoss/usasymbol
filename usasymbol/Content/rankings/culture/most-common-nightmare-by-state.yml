  quick_answer:
    - "Being chased is the most common nightmare nationally at 13.45%, and it ranks as the top nightmare in 17 states, more than any other nightmare type."
    - "Montana shows the strongest single-nightmare consensus of any state: 50% of respondents there named getting trapped somewhere as their most common nightmare."
    - "Falling ranks first in 10 states, including Texas at 14.43% and California at 11.59%, making it the second most common nightmare type nationwide."

  methodology: "Sleep Advisor polled over 1,500 Americans representing all 50 states on which nightmare they experience most often. The article was published on February 12, 2024, and does not disclose a survey platform or age range."

