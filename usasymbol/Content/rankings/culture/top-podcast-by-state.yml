faq:
  - question: "What is the most popular podcast by state?"
    answer: "The Bobby Bones Show, the top-listened show in 23 of the 50 states. No other program comes close to that total."

  - question: "What is the top podcast in New York?"
    answer: "Elvis Duran and the Morning Show ON DEMAND. The same show also tops Connecticut, Montana, New Jersey, Washington, and West Virginia, 6 states in total."

  - question: "Which states share the same top podcast?"
    answer: "Delaware and Rhode Island both lead with The Joe Budden Podcast, and Wisconsin and Wyoming both lead with The Mark Belling Show. Maine, New Hampshire, and Vermont all lead with Greg & The Morning Buzz On Demand."

  - question: "What is the top podcast in California?"
    answer: "The Woody Show, one of 14 shows on this list that leads only a single state."

  - question: "What is the top podcast in Alaska?"
    answer: "Dateline NBC, the only true-crime news program to lead any state. Michigan is the only other state with a non-talk format at the top, Relaxing White Noise."

  - question: "How many different podcasts top at least one state?"
    answer: "19 shows lead at least one state. Five of them, The Bobby Bones Show, Elvis Duran and the Morning Show ON DEMAND, Greg & The Morning Buzz On Demand, The Joe Budden Podcast, and The Mark Belling Show, lead more than one state, and 14 lead exactly one."

