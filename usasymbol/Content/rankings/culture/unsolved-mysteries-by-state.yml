  - question: "What is the most famous unsolved mystery in the United States?"
    answer: "New Mexico's 1947 Roswell Incident and Washington's 1971 D.B. Cooper hijacking are the two most searched cases on this list. Roswell's military explanation shifted from a flying disc to a weather balloon within a day, and Cooper remains the only unidentified hijacker in U.S. aviation history."

  - question: "What is the unsolved mystery in West Virginia?"
    answer: "The Sodder children disappearance. Five of the nine Sodder children were never found after a Christmas Eve 1945 fire destroyed the family's Fayetteville home, and their parents believed for the rest of their lives that the children had survived."

  - question: "Which state has the oldest unsolved mystery?"
    answer: "North Carolina, with the 1587 Roanoke Colony disappearance. More than 100 colonists vanished from Roanoke Island, and the only clue left behind was the word CROATOAN carved into a post."

  - question: "What is the unsolved mystery in New Mexico?"
    answer: "The 1947 Roswell Incident. Debris recovered from a ranch near Roswell was first announced by the military as a flying disc, then described a day later as a weather balloon, a reversal that has never been fully resolved."

  - question: "How many states have an unsolved disappearance as their top mystery?"
    answer: "Sixteen. Washington's D.B. Cooper, West Virginia's Sodder children, and Vermont's five Bennington Triangle disappearances between 1945 and 1950 are among the cases where the person involved was never found."

  - question: "What is the unsolved mystery in Ohio?"
    answer: "The Circleville Letters. Anonymous letters detailing residents' private lives were mailed across Circleville from 1976 to 1994, and continued arriving even after Paul Freshour was imprisoned in 1983 for a related crime."


