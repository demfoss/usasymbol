sections:
  - id: "never-found"
    icon: "fa-solid fa-magnifying-glass"
    title: "Unsolved Mysteries Where No Body Was Ever Found"
    paragraphs:
      - "Sixteen of the 50 cases on this list are open disappearances with no remains ever recovered. West Virginia's five Sodder children vanished from a 1945 house fire, Washington's D.B. Cooper parachuted with $200,000 in 1971, and Alabama's Dan Brasher, Billy Howard and Robert Dye disappeared in a 1947 Ford in 1956."
      - "California's Alcatraz Escape sits in the same category by outcome, not by intent. John Anglin, Clarence Anglin and Frank Morris broke out of the island prison in 1962; the FBI closed the case in 1979 without ever confirming whether they lived or died."

  - id: "wrong-person-punished"
    icon: "fa-solid fa-scale-balanced"
    title: "Unsolved Cases With a Disputed Suspect"
    paragraphs:
      - "Two states convicted someone connected to their mystery without resolving it. Ohio's Circleville Letters continued arriving after Paul Freshour was imprisoned in 1983 for a related attempted-murder charge, even though he was never charged with writing them."
      - "Mississippi's Phantom Barber of Pascagoula case ended with a 1942 conviction, but the man convicted later passed a polygraph test, leaving his guilt disputed rather than settled."

  - id: "oldest-cases"
    icon: "fa-solid fa-clock-rotate-left"
    title: "The Oldest Unsolved Mysteries by State"
    paragraphs:
      - "North Carolina's Roanoke Colony dates to 1587, the oldest case on this list by nearly three centuries. New York's Leatherman walked a fixed loop through the state in the 1800s, and Kentucky's 1876 meat shower over a Bath County farm has never been conclusively explained."
      - "Maine's 1898 murder of Sarah Ware is the oldest still-open homicide on the list. The weapon used against her disappeared before trial, and the only suspect charged in the case was acquitted."


