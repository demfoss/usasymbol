sections:
  - id: "most-common-phobia"
    icon: "fa-solid fa-magnifying-glass"
    title: "Most Common Phobia by State"
    paragraphs:
      - "Trypophobia, the fear of holes, tops the list in 11 states nationwide, more than any other phobia in the study. Georgia, Mississippi, North Carolina, and Virginia are named among them."
      - "Atychiphobia, the fear of failure, is the second most repeated top phobia, listed first in seven states including Illinois, Massachusetts, and Ohio. Hemophobia, the fear of blood, follows in six states."

  - id: "least-common-phobia"
    icon: "fa-solid fa-list-ol"
    title: "Least Common Top Phobias by State"
    paragraphs:
      - "Four phobias tie for the smallest footprint in the study, each topping just two states. Autophobia, fear of being alone, leads in Maine and Nevada. Nyctophobia, fear of the dark, leads in Alaska and Michigan."
      - "Emetophobia, fear of vomiting, tops Arizona and South Carolina. Hippopotomonstrosesquippedaliophobia, fear of long words, tops Arkansas and Kentucky, the longest phobia name to lead any state's list."

  - id: "fear-of-blood-spread"
    icon: "fa-solid fa-map"
    title: "States Where Fear of Blood Ranks Highest"
    paragraphs:
      - "Hemophobia tops the search results in six states: Florida, Minnesota, New Mexico, Oklahoma, Tennessee, and Washington. The six states border no single region, stretching from the Southeast to the Pacific Northwest."


