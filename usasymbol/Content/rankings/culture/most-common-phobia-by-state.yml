faq:
  - question: "What is the most common phobia by state?"
    answer: "Trypophobia, the fear of holes, is the most-searched top phobia nationwide, listed first in 11 states, more than any other phobia in the study. Georgia, Mississippi, North Carolina, and Virginia are among the states where it ranks first."

  - question: "What is the most searched phobia in California?"
    answer: "Anthropophobia, the fear of people, is listed as the top-searched phobia in California. It also tops the list in New York, New Jersey, and North Dakota, four states in total."

  - question: "Which states search fear of long words the most?"
    answer: "Arkansas and Kentucky both list hippopotomonstrosesquippedaliophobia, the fear of long words, as their top-searched phobia. It is tied with three other phobias as the least repeated top phobia in the study, each limited to two states."

  - question: "What is the least common top phobia by state?"
    answer: "Four phobias tie for least repeated, each topping exactly two states. Autophobia tops Maine and Nevada, nyctophobia tops Alaska and Michigan, emetophobia tops Arizona and South Carolina, and hippopotomonstrosesquippedaliophobia tops Arkansas and Kentucky."

  - question: "Why isn't my state listed on this page?"
    answer: "The source study named a top phobia for 33 states in its published coverage. States without a phobia listed in that coverage are left off this page rather than assigned a guess."


