  description: "Grand Theft Auto V is the most-searched video game in 15 states, more than any other title, according to 2022 state-by-state search data."

page:
  h1: "Video Game Preference by State"

  quick_answer:
    - "Grand Theft Auto V is the most-searched video game in 15 states, the most of any title, with its lead concentrated across the South and Midwest."
    - "Teenage Mutant Ninja Turtles: Shredder's Revenge, God of War, and Horizon Zero Dawn each top the search in 4 states, tied for second place behind Grand Theft Auto V."
    - "Seven states have a one-of-a-kind top search no other state shares, including West Virginia's Red Dead Redemption 2 and Wyoming's Cyberpunk 2077."

  methodology: "Rankings reflect Google Trends search volume for the top 25 most-searched video games, per HowLongToBeat, compiled by Minesweeper-challenge for the first half of 2022 and reported by K2 Radio in August 2022."

  sources:
    - name: "K2 Radio - The Most Popular Video Game in Each State"
      url: "https://k2radio.com/youll-never-guess-the-list-leader-of-most-popular-video-games-in-each-state/"
      description: "Full state-by-state breakdown of the 2022 Minesweeper-challenge Google Trends study"
