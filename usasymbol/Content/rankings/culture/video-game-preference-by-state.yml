sections:
  - id: "grand-theft-auto-v-leads-most-state-searches"
    icon: "fa-solid fa-gamepad"
    title: "Grand Theft Auto V Leads Most State Searches"
    paragraphs:
      - "Grand Theft Auto V topped the search in 15 states, more than any other title in the 2022 ranking. Its lead concentrates in the South and Midwest, including Alabama, Georgia, Mississippi, and Tennessee in the South, and Illinois, Michigan, Ohio, and Wisconsin in the Midwest."
      - "New York, Pennsylvania, and Arizona also rank Grand Theft Auto V first, extending its reach beyond those two regions to 15 states in total."

  - id: "new-2022-releases-compete-with-older-titles"
    icon: "fa-solid fa-clock-rotate-left"
    title: "New 2022 Releases Compete With Older Titles"
    paragraphs:
      - "Elden Ring, released in February 2022, topped the search in Colorado and Oregon the same year it launched. Teenage Mutant Ninja Turtles: Shredder's Revenge, released in June 2022, led four states: Connecticut, Delaware, New Hampshire, and New Jersey."
      - "Both games entered the top spot within months of release, competing directly against Grand Theft Auto V, a title first released in 2013."

  - id: "states-with-a-one-of-a-kind-top-search"
    icon: "fa-solid fa-star"
    title: "States With a One-of-a-Kind Top Search"
    paragraphs:
      - "Seven states have a top search no other state shares. Kentucky's is Resident Evil 2, Montana's is The Witcher 3: Wild Hunt, and New Mexico's is BioShock."
      - "South Dakota's unique pick is Final Fantasy VII, Utah's is The Legend of Zelda: Breath of the Wild, West Virginia's is Red Dead Redemption 2, and Wyoming's is Cyberpunk 2077."

