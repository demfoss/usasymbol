faq:
  - question: "What is the most popular video game in the United States by state count?"
    answer: "Grand Theft Auto V, the top search in 15 states. Teenage Mutant Ninja Turtles: Shredder's Revenge, God of War, and Horizon Zero Dawn tie for second, each leading 4 states."

  - question: "What is the most popular video game in Texas?"
    answer: "Grand Theft Auto V is the top search in Texas, one of 15 states where the 2013 title leads."

  - question: "What is the most popular video game in California?"
    answer: "God of War is the top search in California, one of 4 states along with Alaska, Louisiana, and Nebraska."

  - question: "Which states have Elden Ring as the most popular video game?"
    answer: "Colorado and Oregon are the only two states where Elden Ring, released in February 2022, topped the search."

  - question: "What is the most popular video game in West Virginia?"
    answer: "Red Dead Redemption 2 is the top search in West Virginia, the only state where it ranks first."

  - question: "What is the most popular video game in New York?"
    answer: "Grand Theft Auto V is the top search in New York, part of its 15-state lead that also includes Illinois, Ohio, and Texas."

