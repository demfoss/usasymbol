sections:
  - id: states-that-have-produced-the-most-astronauts
    icon: "fa-solid fa-rocket"
    title: "States That Have Produced the Most Astronauts"
    paragraphs:
      - "California has produced 45 astronauts, narrowly ahead of New York's 44. Texas follows with 35, and Illinois rounds out the top four with 30."
      - "Ohio and Pennsylvania are tied for fifth with 27 each, and Massachusetts is next at 21."

  - id: ohios-astronaut-legacy-armstrong-and-glenn
    icon: "fa-solid fa-moon"
    title: "Ohio's Astronaut Legacy: Armstrong and Glenn"
    paragraphs:
      - "Ohio's 27 astronauts include two of the country's most consequential space milestones. Neil Armstrong, born in Wapakoneta, became the first person to walk on the Moon in 1969. John Glenn, born in Cambridge, became the first American to orbit Earth in 1962, then returned to space in 1998 at age 77."

