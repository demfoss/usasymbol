faq:
  - question: "Which state has produced the most astronauts?"
    answer: "California has produced the most with 45, narrowly ahead of New York's 44."

  - question: "How many astronauts were born in Texas?"
    answer: "35 astronauts were born in Texas, the third-highest total of any state."

  - question: "Were Neil Armstrong and John Glenn both born in Ohio?"
    answer: "Yes. Neil Armstrong was born in Wapakoneta, Ohio, and John Glenn was born in Cambridge, Ohio, part of the state's total of 27 astronauts."

  - question: "Which states have produced the fewest astronauts?"
    answer: "Rhode Island, Vermont, Wyoming, Delaware, and Nevada each have 1 astronaut, the fewest of any state in this count."

  - question: "Have all 50 states produced an astronaut?"
    answer: "Yes, based on this count, all 50 states have produced at least 1 astronaut."

  - question: "Which state ranks second for astronaut births?"
    answer: "New York ranks second with 44 astronauts, just 1 behind California's 45."

