page:
  h1: "Astronauts Born by State"

  quick_answer:
    - "California has produced more American astronauts than any other state, 45, narrowly ahead of New York's 44."
    - "Texas is third with 35, followed by Illinois with 30. Ohio and Pennsylvania are tied for fifth with 27 each."
    - "Ohio's astronaut list includes both Neil Armstrong, the first person to walk on the Moon, and John Glenn, the first American to orbit Earth."

  methodology: "Counts reflect each astronaut's birth state, using a broad definition that includes NASA astronauts alongside other trained spaceflight participants who have flown in space, including recent commercial missions. Figures reflect data compiled through 2025."

