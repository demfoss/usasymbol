faq:
  - question: "Which state has the most UFO sightings?"
    answer: "California has the most UFO sightings of any U.S. state with 16,263 reports in the NUFORC database. Florida ranks second at 9,152, and Washington third at 7,930."

  - question: "Which state has the most UFO sightings per capita?"
    answer: "Alaska leads all states with 113.8 UFO sightings per 100,000 residents. Wyoming ranks second at 108.7, and Montana third at 107.2. All three have fewer than 1,200 total reports."

  - question: "Why does Washington state have so many UFO sightings?"
    answer: "Washington ranks 3rd in total reports (7,930) and 4th per capita (102.9 per 100,000). NUFORC, the primary national UFO reporting database, is headquartered in Davenport, WA. That proximity may elevate Washington's counts above what its population and geography would otherwise produce."

  - question: "What state has the fewest UFO sightings?"
    answer: "Vermont has the fewest total reports at 431, ranking 50th. North Dakota (482, #49) and Delaware (498, #48) follow. Vermont's per-capita rate of 67.0 per 100,000 ranks 11th among all 50 states."

  - question: "How many UFO sightings has California had?"
    answer: "California has 16,263 UFO sightings on record with NUFORC, the most of any state. Its per-capita rate of 41.1 per 100,000 is well below Arizona (64.0) and Colorado (73.3), both of which rank lower in total sightings."

  - question: "Which states have the highest UFO sighting rate per person?"
    answer: "Alaska (113.8 per 100K), Wyoming (108.7), Montana (107.2), and Washington (102.9) have the four highest per-capita sighting rates. Oregon (87.9) and New Hampshire (86.9) rank 5th and 6th."

