page:
  h1: "UFO Sightings by State"

  quick_answer:
    - "California has 16,263 UFO sightings on record with NUFORC, the most of any U.S. state. Florida ranks second with 9,152, and Washington third with 7,930."
    - "Alaska leads all states per capita with 113.8 sightings per 100,000 residents. Wyoming ranks second at 108.7 and Montana third at 107.2."
    - "Texas ranks 4th in total reports (7,476) but has just 25.6 sightings per 100,000 residents, the lowest per-capita rate among the top five states by total reports."

  methodology: "Sighting counts come from the NUFORC database of self-reported public submissions, 1974–2023; per-capita rates use 2020 U.S. Census figures. All reports are unverified; Washington state counts may be elevated because NUFORC is headquartered in Davenport, WA."

  sources:
    - name: "National UFO Reporting Center (NUFORC)"
      url: "https://nuforc.org"
      description: "Primary data source: NUFORC database of UFO sighting reports by state, 1974–2023"
    - name: "U.S. Census Bureau — 2020 Decennial Census"
      url: "https://www.census.gov/programs-surveys/decennial-census/decade/2020/2020-census-main.html"
      description: "State population figures used for per-capita calculations"

