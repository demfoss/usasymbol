sections:
  - id: "states-that-produce-the-most-real-christmas-trees"
    icon: "fa-solid fa-tree"
    title: "States That Produce the Most Christmas Trees"
    paragraphs:
      - "Oregon leads the nation with 4,823,877 trees cut in 2022, more than the next three states combined. North Carolina follows at 3,208,419, and Michigan ranks third at 1,799,391."
      - "Washington cut 936,904 trees using 756 farms, while Pennsylvania cut 721,480 trees across 1,301 farms. Wisconsin rounds out the top six at 601,199 trees."

  - id: "why-oregon-leads-christmas-tree-production"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Oregon Leads Christmas Tree Production"
    paragraphs:
      - "Oregon and North Carolina dominate national output because their growing regions have climates and soil suited to multiple tree species. Oregon's 48,433 acres in production tops the country, ahead of Michigan's 33,135 acres and North Carolina's 33,126 acres."

  - id: "states-with-the-most-christmas-tree-farms"
    icon: "fa-solid fa-warehouse"
    title: "States With the Most Christmas Tree Farms"
    paragraphs:
      - "Oregon also has the most Christmas tree farms at 1,695, followed by Pennsylvania at 1,301 and Michigan at 1,236. New York counts 1,226 farms, more than Washington's 756, yet Washington cut nearly three times as many trees, 936,904 versus New York's 318,745."
      - "Wisconsin operates 941 farms and North Carolina 940, a near tie. North Carolina still produced more than five times as many trees, 3,208,419 compared with Wisconsin's 601,199."
