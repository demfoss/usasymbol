faq:
  - question: "Which state produces the most real Christmas trees?"
    answer: "Oregon produces the most, with 4,823,877 trees cut in 2022. North Carolina is next at 3,208,419."

  - question: "Which state has the most Christmas tree farms?"
    answer: "Oregon has the most farms at 1,695. Pennsylvania is second at 1,301, and Michigan is third at 1,236."

  - question: "How many Christmas trees does North Carolina produce?"
    answer: "North Carolina cut 3,208,419 trees in 2022 across 940 farms covering 33,126 acres, ranking second nationally."

  - question: "Which state produces the fewest real Christmas trees?"
    answer: "Alaska produces the fewest, with just 3 trees cut in 2022. Arizona is next lowest at 4, and Nevada follows at 6."

  - question: "Do most Americans use real or artificial Christmas trees?"
    answer: "Most use artificial trees nationally. A recent survey found 81% of Americans who put up a tree planned on an artificial one, versus 20% real."

  - question: "How many acres are used for Christmas tree farming in Oregon?"
    answer: "Oregon has 48,433 acres in production, the most of any state. Michigan is next at 33,135 acres, just ahead of North Carolina's 33,126."
