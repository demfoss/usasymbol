page:
  h1: "Christmas Tree Production by State"

  quick_answer:
    - "Oregon produced the most real Christmas trees of any state in 2022, with 4,823,877 trees cut, more than the next three states combined."
    - "North Carolina ranked second at 3,208,419 trees using just 940 farms, far fewer than Pennsylvania's 1,301 farms despite Pennsylvania cutting only 721,480 trees, fifth overall."
    - "Alaska cut just 3 trees in the same count, the lowest total nationwide. Arizona was second lowest at 4, and Nevada followed at 6."

  methodology: "Trees cut, farm count, and acres in production for 2022 use the World Population Review state table, sourced from federal Nursery and Christmas Tree Production survey data. No public survey publishes full state-by-state real-versus-artificial preference percentages, so production figures serve as the proxy metric here."

  sources:
    - name: "World Population Review. Christmas Tree Production by State 2026"
      url: "https://worldpopulationreview.com/state-rankings/christmas-tree-production-by-state"
      description: "State table with 2022 trees cut, farm count, and acres in production"
    - name: "USDA National Agricultural Statistics Service. Nursery and Christmas Tree Production"
      url: "https://www.nass.usda.gov/Surveys/Guide_to_NASS_Surveys/Nursery_and_Christmas_Tree_Production/index.php"
      description: "Federal survey program covering Christmas tree acreage and production"
    - name: "YouGov. Most Americans will have a Christmas tree"
      url: "https://today.yougov.com/society/articles/26802-christmas-tree-poll-survey-artificial-real-survey"
      description: "National survey on real versus artificial Christmas tree plans"

