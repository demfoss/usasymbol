  - id: "regional-and-state-level-search-patterns"
    icon: "fa-solid fa-map"
    title: "Regional and State-Level Cat Breed Search Patterns"
    paragraphs:
      - "Zoomed out to the state level, the South leans toward Maine Coon in search interest, the Midwest and West both lean toward Norwegian Forest Cat, and the Northeast leans toward Abyssinian, broader regional trends that sit above the sharper, breed-specific results the city data shows."
      - "Georgia posts the highest cat-breed search volume of any state per capita, followed by Washington and Virginia. Oregon, Colorado, Massachusetts, Utah, California, New York, and Minnesota round out the top 10, a spread that touches every region of the country rather than clustering in one."
