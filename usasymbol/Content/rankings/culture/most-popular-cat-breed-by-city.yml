sections:
  - id: "cat-breeds-that-win-the-most-cities"
    icon: "fa-solid fa-cat"
    title: "Cat Breeds That Are Most Popular in the Most Cities"
    paragraphs:
      - "Burmese tops 9 of the 50 cities, more than any other breed, and forms an unbroken West Coast cluster of Oakland, Sacramento, San Francisco, and San Jose, plus Portland just up the coast. Savannah ranks second with 6 cities, all of them Southern: Atlanta, Charlotte, Jacksonville, Miami, Raleigh, and Tampa."
      - "Maine Coon, Abyssinian, Egyptian Mau, and Cornish Rex are tied for third, each leading 4 cities. Cornish Rex forms its own tight Southwest cluster across Mesa, Phoenix, and Tucson, all suburbs or neighbors of the Phoenix metro."
    table:
      numbered: true
      columns:
        breed: "Cat Breed"
        cities_count: "Cities Led"
      rows:
        - breed: "Burmese"
