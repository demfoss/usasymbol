page:
  h1: "Most Popular Cat Breed in America's Biggest Cities"

  quick_answer:
    - "Burmese is the most-searched cat breed in 9 of America's 50 largest cities, more than any other breed, according to a MetLife Pet Insurance analysis of Google search data."
    - "Savannah ranks second, leading 6 cities concentrated in the South, including Atlanta, Miami, and Tampa. Maine Coon, Abyssinian, Egyptian Mau, and Cornish Rex are tied for third, each leading 4 cities."
    - "Georgia has the highest cat-breed search volume of any state per capita, followed by Washington and Virginia. Nationally, Maine Coon is the single most-searched breed overall, followed by Sphynx and Chartreux."

  methodology: "Breed leaders reflect Google Trends search volume for cat breed names in each of America's 50 most populous cities, analyzed by MetLife Pet Insurance for the period November 2024 to November 2025. Search interest measures what people look up, not confirmed ownership counts."

  sources:
    - name: "MetLife Pet Insurance. America's Favorite Pet Breeds"
      url: "https://www.metlifepetinsurance.com/americas-favorite-pet-breeds/"
      description: "Google Trends analysis of the most-searched dog and cat breeds in all 50 states and the 50 most populous U.S. cities, November 2024 to November 2025"

