faq:
  - question: "What is the most popular cat breed by city?"
    answer: "Burmese is the most-searched cat breed in 9 of America's 50 biggest cities, more than any other breed, including Oakland, San Francisco, and San Jose."

  - question: "What is the most popular cat breed in New York City?"
    answer: "Bengal is the most-searched cat breed in New York City, tied with Detroit as the only 2 of the 50 largest cities where Bengal ranks first."

  - question: "What is the most popular cat breed in Los Angeles?"
    answer: "Persian is the most-searched cat breed in Los Angeles, the only city among the 50 largest where it ranks first."

  - question: "Which state has the most search interest in cat breeds?"
    answer: "Georgia has the highest per-capita search volume for cat breeds of any state, ahead of Washington and Virginia."

  - question: "What is the single most-searched cat breed nationally?"
    answer: "Maine Coon is the most-searched cat breed nationwide by overall volume, ahead of Sphynx and Chartreux. City by city, Burmese leads more individual cities than Maine Coon does."

  - question: "Why do so many West Coast cities favor the Burmese cat?"
    answer: "Burmese ranks first in Oakland, Portland, Sacramento, San Francisco, and San Jose, an unbroken run up the West Coast. No other breed forms as tight a regional cluster among the 50 cities tracked."

