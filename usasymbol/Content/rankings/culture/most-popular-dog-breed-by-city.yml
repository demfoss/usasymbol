sections:
  - id: "dog-breeds-that-win-the-most-cities"
    icon: "fa-solid fa-dog"
    title: "Dog Breeds That Are Most Popular in the Most Cities"
    paragraphs:
      - "Greyhound tops 9 of the 50 cities, more than any other breed, including Baltimore, Detroit, Indianapolis, Jacksonville, and Philadelphia. Samoyed ranks second with 4 cities, all along the coasts: New York City, San Francisco, San Jose, and Seattle."
      - "Saint Bernard, Portuguese Water Dog, Maltipoo, Chihuahua, and Bullmastiff are tied for third, each leading 3 cities. Saint Bernard's 3 cities, Austin, Dallas, and Houston, are all in Texas, and Maltipoo's 3, Long Beach, Los Angeles, and Oakland, are all in California."
    table:
      numbered: true
      columns:
        breed: "Dog Breed"
        cities_count: "Cities Led"
      rows:
        - breed: "Greyhound"
