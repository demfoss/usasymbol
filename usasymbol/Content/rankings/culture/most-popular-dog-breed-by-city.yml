          search_rank: "7"
        - state: "Washington"
          search_rank: "8"
        - state: "North Carolina"
          search_rank: "9"
        - state: "Virginia"
          search_rank: "10"

  - id: "texas-giant-breeds-vs-california-designer-dogs"
    icon: "fa-solid fa-scale-balanced"
    title: "Texas Giant Breeds vs. California Designer Dogs"
    paragraphs:
      - "Texas cities lean toward giant breeds: Saint Bernard leads Austin, Dallas, and Houston, while Oklahoma City and Tulsa just north prefer the similarly massive Bullmastiff. California's biggest cities pull the opposite direction, toward small designer crossbreeds, with Maltipoo topping searches in Los Angeles, Long Beach, and Oakland."
      - "Portland stands apart from both clusters entirely. Its top breed, Basenji, is the single most unusual pick among all 50 cities, an African breed known for its yodel-like vocalization rather than actual barking."

