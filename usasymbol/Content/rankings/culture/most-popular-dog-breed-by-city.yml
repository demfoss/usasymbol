page:
  h1: "Most Popular Dog Breed in America's Biggest Cities"

  quick_answer:
    - "Greyhound is the most-searched dog breed in 9 of America's 50 largest cities, more than any other breed, according to a MetLife Pet Insurance analysis of Google search data."
    - "Samoyed ranks second, leading 4 coastal cities: New York City, San Francisco, San Jose, and Seattle. Saint Bernard, Portuguese Water Dog, Maltipoo, Chihuahua, and Bullmastiff are tied for third, each leading 3 cities."
    - "Texas has the highest dog-breed search volume of any state per capita, followed by Nevada and California. Nationally, Cane Corso is the single most-searched breed overall, followed by Greyhound and Golden Retriever."

  methodology: "Breed leaders reflect Google Trends search volume for dog breed names in each of America's 50 most populous cities, analyzed by MetLife Pet Insurance for the period November 2024 to November 2025. Search interest measures what people look up, not confirmed ownership counts, which is why results differ from the separate state-level dog breed page on this site, based on pet insurance policy data instead."

  sources:
    - name: "MetLife Pet Insurance. America's Favorite Pet Breeds"
      url: "https://www.metlifepetinsurance.com/americas-favorite-pet-breeds/"
      description: "Google Trends analysis of the most-searched dog and cat breeds in all 50 states and the 50 most populous U.S. cities, November 2024 to November 2025"

