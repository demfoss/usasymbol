faq:
  - question: "What is the most popular dog breed by city?"
    answer: "Greyhound is the most-searched dog breed in 9 of America's 50 biggest cities, more than any other breed, including Baltimore, Detroit, and Philadelphia."

  - question: "What is the most popular dog breed in New York City?"
    answer: "Samoyed is the most-searched dog breed in New York City, one of 4 coastal cities where it ranks first, alongside San Francisco, San Jose, and Seattle."

  - question: "What is the most popular dog breed in Los Angeles?"
    answer: "Maltipoo is the most-searched dog breed in Los Angeles, one of 3 California cities where it ranks first, alongside Long Beach and Oakland."

  - question: "Which state has the most search interest in dog breeds?"
    answer: "Texas has the highest per-capita search volume for dog breeds of any state, ahead of Nevada and California."

  - question: "What is the single most-searched dog breed nationally?"
    answer: "Cane Corso is the most-searched dog breed nationwide by overall volume, ahead of Greyhound and Golden Retriever. City by city, Greyhound leads more individual cities than Cane Corso does."

  - question: "Why does this page disagree with the other most popular dog breed by state ranking on this site?"
    answer: "This page tracks Google search volume across America's 50 biggest cities from November 2024 to November 2025. The separate state-level page uses pet insurance policy data from fall 2023, a different data source measuring actual pet ownership rather than search interest."

