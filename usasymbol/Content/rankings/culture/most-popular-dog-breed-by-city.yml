  - id: "regional-and-state-level-search-patterns"
    icon: "fa-solid fa-map"
    title: "Regional and State-Level Dog Breed Search Patterns"
    paragraphs:
      - "Zoomed out to the region level, Cane Corso leads more Southern states than any other breed, and Cavalier King Charles Spaniel tops the Midwest. Rhodesian Ridgeback leads both the Northeast and the West, a wider regional footprint than any other single breed manages."
      - "Texas has the highest dog-breed search volume of any state per capita, followed by Nevada and California. Colorado, Arizona, Utah, Georgia, Washington, North Carolina, and Virginia round out the top 10, a list dominated by the Southwest and West far more than the equivalent cat-breed ranking."
    table:
      numbered: true
      columns:
        state: "State"
        search_rank: "Search Volume Rank"
      rows:
        - state: "Texas"
          search_rank: "1"
        - state: "Nevada"
