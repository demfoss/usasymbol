faq:
  - question: "What is the most common last name by state?"
    answer: "Smith is the most common last name in 30 states. Johnson is next, leading 10 states, mostly across the Upper Midwest and Mountain West."

  - question: "Which state has the most people named Smith?"
    answer: "Smith is the top surname in 30 states, including Texas, Florida, and Ohio. Mississippi has the highest concentration among Smith-led states, one Smith per 63 residents."

  - question: "What is the most common last name in California?"
    answer: "Garcia is California's most common last name, one per 200 residents. Arizona is the only other state where Garcia ranks first."

  - question: "What is the most common last name in Texas?"
    answer: "Smith is the most common last name in Texas, one per 121 residents, the same ratio as Alabama and Florida."

  - question: "Which states have a most common last name found nowhere else?"
    answer: "Four states have a unique top surname: Lee in Hawaii, Sullivan in Massachusetts, Patel in New Jersey, and Martinez in New Mexico."

  - question: "Why is Johnson the top last name in so many Upper Midwest states?"
    answer: "Johnson leads 10 states, and in Minnesota, Montana, North Dakota, South Dakota, Washington, and Wisconsin its origin is listed as Scandinavian rather than English, reflecting the surname's Norwegian and Swedish roots in those states."

