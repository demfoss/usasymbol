  - id: "last-names-that-win-the-most-states"
    icon: "fa-solid fa-users"
    title: "Last Names That Are Most Common in the Most States"
    paragraphs:
      - "Smith is the most common last name in 30 states, three times Johnson's 10-state total. Garcia, Williams, and Brown each top two states, and four surnames, Lee, Sullivan, Patel, and Martinez, each top exactly one."
