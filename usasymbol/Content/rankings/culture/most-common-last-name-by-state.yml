    icon: "fa-solid fa-globe"
    title: "Surname Origins Behind Each State's Most Common Last Name"
    paragraphs:
      - "English-origin surnames top 36 states, led by Smith. Scandinavian roots appear in 6 states, all through Johnson, in Minnesota, Montana, North Dakota, South Dakota, Washington, and Wisconsin, while Johnson traces to English roots in Kentucky, Nebraska, Nevada, and Oklahoma."
      - "Spanish origin covers 3 states through Garcia and Martinez, and Welsh origin covers 2 through Williams. Korean, Irish, and Indian origins each appear once, through Lee in Hawaii, Sullivan in Massachusetts, and Patel in New Jersey."
