  - id: "states-where-smith-isnt-the-top-last-name"
    icon: "fa-solid fa-map-pin"
    title: "States Where Smith Isn't the Most Common Last Name"
    paragraphs:
      - "Twenty states have a most common last name other than Smith. Johnson leads 10 of them, and Hawaii, Massachusetts, New Jersey, and New Mexico each have a top surname, Lee, Sullivan, Patel, and Martinez, that appears nowhere else on this list."
      - "Lee tops Hawaii from Korean plantation labor recruited starting in 1903, and Sullivan leads Massachusetts because Boston absorbed one of the country's largest Irish inflows during the Great Famine. Patel leads New Jersey, home to the largest Indian American population share of any state."
      - "Martinez leads New Mexico from Spanish colonial settlement along El Camino Real after 1598. Garcia's lead in Arizona and California traces to the same Spanish colonial roots, later reinforced by 20th-century Mexican labor migration."
