sections:
  - id: why-california-has-the-most-roller-coasters
    title: "Why California Has the Most Roller Coasters"
    paragraphs:
      - "California has 91 operating roller coasters. Disneyland debuted the Matterhorn Bobsleds in 1959, the first tubular steel coaster, and Knott's Berry Farm and Six Flags Magic Mountain add to the count. Mild weather keeps parks open nearly year-round, so every new ride earns money across many more days."
      - "Texas (67) and Florida (53) share the same advantages, with warm climates and huge crowds. Orlando alone is home to several of the largest theme parks in the world. Both rank among the most populous states in the [states by population](/rankings/demographics/states-by-population) list."
    table:
      columns:
        rank: "Rank"
