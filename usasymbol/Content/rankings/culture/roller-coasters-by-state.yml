faq:
  - question: "Which state has the most roller coasters?"
    answer: "California, with 91 operating roller coasters. Texas has 67 and Pennsylvania 54."
  - question: "Which state has the most wooden roller coasters?"
    answer: "Pennsylvania, with 14. Ohio has 8 and Missouri 7."
  - question: "How many roller coasters are in Ohio?"
    answer: "Ohio has 44 operating roller coasters, which ranks 7th. Cedar Point in Sandusky opened as a beach resort in 1870 and is the best known park."
  - question: "How many roller coasters are in New Jersey?"
    answer: "New Jersey has 48, which ranks 6th despite the state's small size. Six Flags Great Adventure and the boardwalk piers supply most of them."
  - question: "Which states have no roller coasters?"
    answer: "Delaware, Hawaii, and Rhode Island have none in operation. Alaska, Montana, and Wyoming have one each."
  - question: "How many roller coasters are there in the United States?"
    answer: "The census counts 854 operating roller coasters across 47 states, 752 steel and 102 wooden."
