  description: "California has 91 operating roller coasters, the most of any state. Texas has 67 and Pennsylvania 54. Alaska, Montana, and Wyoming have one each."
page:
  h1: "Roller Coasters by State"
  quick_answer:
    - "California has the most roller coasters of any state, 91 in operation. Disneyland opened the first tubular steel coaster there in 1959, and mild weather lets parks run nearly all year."
    - "Alaska, Montana, and Wyoming have one each, and Delaware, Hawaii, and Rhode Island have none in operation. Few people and a short warm season leave little room for a coaster park."
    - "Pennsylvania ranks third with 54 and has 14 wooden coasters, more than any other state. Many grew out of trolley parks built at the end of streetcar lines."
  methodology: "Operating roller coasters (steel and wooden) per the Roller Coaster DataBase census of the United States, checked on November 5, 2026. Alpine, mountain, and powered coasters are not counted. Delaware, Hawaii, and Rhode Island have none listed and are omitted."
