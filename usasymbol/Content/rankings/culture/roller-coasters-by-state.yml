  - id: states-with-the-most-wooden-roller-coasters
    title: "States With the Most Wooden Roller Coasters"
    paragraphs:
      - "Pennsylvania has 14 wooden coasters, more than any other state and almost twice as many as second-place Ohio (8). Many began as trolley parks, picnic grounds that streetcar companies built at the end of their lines to fill weekend cars. Leap-the-Dips in Altoona, from 1902, is the oldest operating roller coaster in the world."
      - "Ohio is better known for Cedar Point in Sandusky, which calls itself the roller coaster capital of the world, and Kings Island near Cincinnati. Wisconsin stands out for its mix, with 6 of its 13 coasters built of wood."
    table:
      columns:
