  - id: states-with-the-fewest-roller-coasters
    title: "States With the Fewest Roller Coasters"
    paragraphs:
      - "Alaska, Montana, and Wyoming have one operating coaster each, and Delaware, Hawaii, and Rhode Island have none. The three single-coaster states are among the least populated in the country, so a coaster park has few customers nearby. See the [population density ranking](/rankings/demographics/states-by-population-density) for how far apart people live."
      - "New Jersey is the opposite surprise. It ranks 6th with 48 coasters in one of the smallest states, thanks to Six Flags Great Adventure and the amusement piers along the Jersey Shore. At Seaside Heights, Superstorm Sandy knocked the Jet Star coaster into the ocean in 2012."
