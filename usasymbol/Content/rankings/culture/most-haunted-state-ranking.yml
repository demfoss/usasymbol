      url: "https://www.movebuddha.com/blog/most-haunted-states/"
      description: "Composite ranking of all 50 states and DC using Spook, Creep, and Boo scores built from cemetery, haunted-location, ghost-town, unsolved-homicide, and UFO-sighting data"

