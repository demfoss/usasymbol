sections:
  - id: "why-new-mexico-is-the-most-haunted-state"
    icon: "fa-solid fa-moon"
    title: "Why New Mexico Is the Most Haunted State"
    paragraphs:
      - "New Mexico's oldest city is 418 years old, older than Plymouth Rock, and the state's Acoma Pueblo cemetery dates to 1629. The state also logs more than 1,700 UFO sightings in the underlying data, a combination that carries it to the top overall spot despite ranking only 4th on Spook Rank."

  - id: "the-most-haunted-states-in-america"
    icon: "fa-solid fa-ghost"
    title: "The Most Haunted States in America"
    paragraphs:
      - "New Mexico tops the ranking with a haunted index of 50, followed by West Virginia at 49 and New Hampshire at 48. Pennsylvania ranks fourth at 47, and Michigan rounds out the top five at 46."
      - "Massachusetts ranks sixth overall at an index of 45, and Missouri is seventh at 44. Maine sits eighth at 43, Alaska is ninth at 42, and Florida rounds out the top ten at 41."

  - id: "the-least-haunted-states-in-america"
    icon: "fa-solid fa-house"
    title: "The Least Haunted States in America"
    paragraphs:
      - "Hawaii ranks last overall with a haunted index of 1, the lowest score in the study. Idaho is 49th at an index of 2, and Delaware follows at 48th with an index of 3."
      - "Nebraska ranks 47th with a haunted index of 4, and Minnesota is 46th at an index of 5. Utah is 45th at an index of 6, and Nevada is 44th at an index of 7."

