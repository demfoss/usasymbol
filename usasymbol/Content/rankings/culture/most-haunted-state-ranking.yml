faq:
  - question: "Which state is the most haunted?"
    answer: "New Mexico ranks first overall with a haunted index of 50 out of 50, the top score in the study. West Virginia is second at an index of 49."

  - question: "Which state is the least haunted?"
    answer: "Hawaii ranks last overall with a haunted index of 1. Idaho is 49th at an index of 2, and Delaware is 48th at an index of 3."

  - question: "How does Texas rank on the most haunted states list?"
    answer: "Texas ranks 19th overall, with a haunted index of 32. It ranks 3rd on Boo Rank for ghost sightings and ghost towns, but 22nd on Creep Rank."

  - question: "How does California rank on the most haunted states list?"
    answer: "California ranks 21st overall with a haunted index of 30. It ranks 1st on Creep Rank, the highest of any state, but only 49th on Spook Rank."

  - question: "Which state ranks second most haunted?"
    answer: "West Virginia ranks second overall with a haunted index of 49. New Hampshire follows in third place at an index of 48."

  - question: "Which states rank in the bottom five for haunted rankings?"
    answer: "Hawaii ranks 50th, Idaho 49th, Delaware 48th, Nebraska 47th, and Minnesota 46th. All five post a haunted index of 5 or lower."

