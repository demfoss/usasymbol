page:
  h1: "Most Haunted States"

  quick_answer:
    - "New Mexico ranks as the most haunted state in America, with a haunted index of 50 out of 50. West Virginia is second at 49, and New Hampshire is third at 48."
    - "New Mexico ranks 4th on Spook Rank and 2nd on Creep Rank yet still claims the top overall spot. California ranks 1st on Creep Rank but only 21st overall, at an index of 30."
    - "Hawaii ranks last overall at an index of 1. Idaho is 49th at an index of 2, and Delaware is 48th at an index of 3."

  methodology: "Overall rank and the Spook, Creep, and Boo category ranks are drawn from MoveBuddha's 2026 Most Haunted States study, built from cemetery density and age, haunted-location and ghost-town density, unsolved-homicide density, abandoned-place density, and UFO-sighting density. Haunted Index inverts the published rank, 51 minus rank, for map shading. DC is excluded."

  sources:
