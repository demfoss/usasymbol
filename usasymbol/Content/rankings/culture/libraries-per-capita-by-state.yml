  - id: states-with-the-most-public-libraries
    title: "States With the Most Public Libraries"
    paragraphs:
      - "California has the most library outlets at 1,164, yet only 3.0 per 100,000 residents because it is the most populous state. Its 221 library systems are mostly city, county or district based, so many outlets are branches of big systems."
      - "Iowa is the surprise among the biggest totals. It places eighth with 570 outlets, more than Florida with 538 or Massachusetts with 455, despite far fewer people. See the [states by population](/rankings/demographics/states-by-population) ranking for the size gap."
