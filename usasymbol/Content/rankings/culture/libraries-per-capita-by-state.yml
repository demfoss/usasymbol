sections:
  - id: why-vermont-has-the-most-libraries-per-capita
    title: "Why Vermont Has the Most Libraries"
    paragraphs:
      - "Vermont reports 186 library outlets run by 183 separate library systems, so nearly every building is a standalone town or village library and not a branch of a larger network. Maine (261 outlets, 256 systems), Iowa and New Hampshire follow the same pattern."
      - "Each small community funds and staffs its own door, even when only a few hundred people live nearby. Sparsely settled states like these appear again in the [population density ranking](/rankings/demographics/states-by-population-density), where wide, thinly peopled land keeps towns small but separate."
