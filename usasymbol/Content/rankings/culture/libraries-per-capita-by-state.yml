  description: "Vermont has 28.7 public libraries per 100,000 residents, the most of any state. Maine is second at 18.6 and Florida last at 2.3."
page:
  h1: "Libraries per Capita by State"
  quick_answer:
    - "Libraries per capita are highest in Vermont at 28.7 public library outlets per 100,000 residents, because small towns there keep a library of their own instead of sharing one."
    - "Florida has the lowest figure at 2.3. Its 79 library systems are mostly built around counties or cities, and each branch serves a large suburban crowd instead of one small town."
    - "Wyoming ranks 7th at 12.6 with only 23 library systems. Each system covers a whole county and runs branches in far-apart small towns, so the count of buildings stays high."
  methodology: "Public library outlets (central libraries plus branches) and library systems from the IMLS Public Libraries Survey, fiscal year 2024, excluding bookmobiles and temporarily closed locations. Rate uses Census resident population estimates for July 1, 2024. The District of Columbia is excluded."
  sources:
    - name: "Institute of Museum and Library Services. Public Libraries Survey, Fiscal Year 2024 data files (outlet and administrative entity files)"
      url: "https://www.imls.gov/research-evaluation/surveys/public-libraries-survey-pls"
      description: "Records for every public library system and outlet by state"
    - name: "U.S. Census Bureau. Annual Estimates of the Resident Population for the United States and States, April 1, 2020 to July 1, 2024 (NST-EST2024-POP)"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "State resident population as of July 1, 2024"
