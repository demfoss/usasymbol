  - id: states-with-the-fewest-libraries-per-person
    title: "States With the Fewest Libraries per Person"
    paragraphs:
      - "Florida trails at 2.3 outlets per 100,000 residents. Its 538 outlets belong to just 79 systems, so a typical system runs several branches, each serving a big suburban population. Nevada at 2.5 has 21 systems for 81 outlets, and Maryland at 3.1 has 26 systems for 192."
      - "Hawaii is the extreme case of consolidation, since one statewide system operates all 51 of its outlets. Compare this centralized model with the many small local governments in the [school districts by state](/rankings/education/school-districts-by-state) ranking, where the same local-control habit shows up."
    table:
      columns:
