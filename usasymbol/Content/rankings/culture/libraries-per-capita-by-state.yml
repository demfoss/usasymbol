faq:
  - question: "Which state has the most libraries per capita?"
    answer: "Vermont, with 28.7 public library outlets per 100,000 residents. Its 186 outlets serve a population of only about 648,000."
  - question: "Which state has the fewest libraries per person?"
    answer: "Florida, at 2.3 outlets per 100,000 residents. Nevada at 2.5 and Texas at 2.8 are next lowest."
  - question: "Which state has the most public libraries in total?"
    answer: "California, with 1,164 library outlets, ahead of New York with 1,055 and Texas with 871."
  - question: "How many public libraries are in Texas?"
    answer: "Texas has 871 public library outlets run by 544 library systems. That works out to 2.8 per 100,000 residents, which ranks 48th."
  - question: "Why does Hawaii have so few libraries per person?"
    answer: "Hawaii has 3.5 outlets per 100,000 residents, tied for 41st. A single statewide system runs all 51 of them, so the islands never developed the patchwork of independent town libraries seen in New England."
  - question: "How many public libraries are in the United States?"
    answer: "The 50 states have 16,674 public library outlets run by 9,199 library systems. Many systems consist of a single building, which is why the two numbers are not far apart."
