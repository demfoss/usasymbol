faq:
  - question: "Which state is most obsessed with true crime?"
    answer: "Massachusetts ranks first among states at 4,157.52 true crime searches per 100,000 residents. New York is second at 4,001.63."

  - question: "Which state has the least interest in true crime?"
    answer: "Georgia ranks last at 2,155.64 searches per 100,000 residents. That is less than half the rate recorded in Massachusetts."

  - question: "What is the true crime search interest in Texas?"
    answer: "Texas scores 3,727.54 per 100,000 residents, ranking 10th among states. That places it just above Arizona at 3,727.19."

  - question: "What is the true crime search interest in California?"
    answer: "California scores 3,720.65 per 100,000 residents, ranking 12th. It sits just below Arizona at 3,727.19 and just above Rhode Island at 3,695.17."

  - question: "Why does Massachusetts have the highest true crime interest?"
    answer: "PrivacyJournal's study ties Massachusetts and the wider Northeast to the region's own history, pointing to events like the Salem Witch Trials and the area's dark-themed literary tradition. New York at 4,001.63 and Connecticut at 3,863.90 both follow the same regional pattern."

  - question: "What is the national average for true crime search interest?"
    answer: "The national average is 3,428.98 searches per 100,000 residents. Massachusetts is well above that figure, while Georgia at 2,155.64 sits well below it."

