sections:
  - id: "states-with-the-highest-true-crime-interest"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest True Crime Interest"
    paragraphs:
      - "Massachusetts ranks first at 4,157.52 true crime searches per 100,000 residents. New York is second at 4,001.63, and Nevada is third at 3,983.75."
      - "Colorado follows closely at 3,982.88, then Illinois at 3,946.85. Connecticut rounds out the top seven at 3,863.90, all of them above the national average of 3,428.98."

  - id: "why-massachusetts-ranks-highest-for-true-crime"
    icon: "fa-solid fa-magnifying-glass"
    title: "Why Massachusetts Leads in True Crime Interest"
    paragraphs:
      - "Massachusetts posts the top score among states at 4,157.52 per 100,000 residents, and much of the Northeast clusters near it: New York at 4,001.63, Connecticut at 3,863.90, and New Hampshire at 3,757.45. PrivacyJournal ties this regional pattern to New England's own history, citing the Salem Witch Trials and dark-themed literary figures tied to the region as likely drivers of search volume."

  - id: "states-with-the-lowest-true-crime-interest"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest True Crime Interest"
    paragraphs:
      - "Georgia ranks last at 2,155.64 searches per 100,000 residents. Mississippi is second-lowest at 2,355.40, and Alaska follows at 2,432.54."
      - "Hawaii sits at 2,553.48 and Arkansas at 2,715.24. Five of the eight lowest-ranking states are in the South, including Georgia, Mississippi, Arkansas, Louisiana at 2,781.81, and West Virginia at 2,828.21."

