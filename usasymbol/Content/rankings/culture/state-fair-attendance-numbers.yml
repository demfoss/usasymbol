sections:
  - id: "highest-daily-state-fair-attendance"
    icon: "fa-solid fa-chart-column"
    title: "State Fair With the Highest Daily Attendance"
    table:
      columns:
        state: "State"
        fair: "Fair"
        attendance: "2025 Attendance"
        days: "Days"
        avg_daily: "Average Daily Attendance"
      rows:
        - state: "Minnesota"
          state_slug: "minnesota"
          fair: "Minnesota State Fair"
          attendance: 1940869
          days: 12
          avg_daily: 161700
        - state: "Iowa"
          state_slug: "iowa"
          fair: "Iowa State Fair"
          attendance: 1160121
          days: 11
          avg_daily: 105500
        - state: "Massachusetts"
          state_slug: "massachusetts"
          fair: "The Big E"
          attendance: 1538463
          days: 17
          avg_daily: 90500
        - state: "Texas"
          state_slug: "texas"
          fair: "State Fair of Texas"
          attendance: 2020064
          days: 24
          avg_daily: 84200
    paragraphs:
      - "Minnesota averages roughly 161,700 visitors a day across its 12-day run in 2025, the highest daily rate on this list. Texas draws more total visitors at 2,020,064, but its fair runs 24 days, twice as long as Minnesota's."
      - "Iowa averages about 105,500 visitors a day over 11 days, ahead of both Massachusetts and Texas on a daily basis. Massachusetts spreads 1,538,463 visitors across 17 days for a daily average near 90,500."

  - id: "state-fairs-with-lower-2025-attendance"
    icon: "fa-solid fa-arrow-trend-down"
    title: "State Fairs With Lower Attendance in 2025"
    paragraphs:
      - "Texas fell 15.3% in 2025, from 2,385,855 visitors in 2024 to 2,020,064, its lowest total since 2018. Wisconsin dropped from a record 1,136,805 in 2024 to 892,968 after flooding forced an early closure on the final day."
      - "Colorado's attendance fell roughly 13% to about 430,000 amid repeated storms during the run. North Carolina and Ohio posted smaller declines too, drawing 946,811 and 969,082 visitors, down from 998,926 and a 2023 record of 1,006,228."

  - id: "state-fairs-with-2025-attendance-records"
    icon: "fa-solid fa-trophy"
    title: "State Fairs With Attendance Records in 2025"
    paragraphs:
      - "Georgia's National Fair set an all-time attendance record in 2025, drawing 612,706 visitors to Perry over 11 days. New York's fair grew 7% to 925,989, and Indiana edged past its 2024 mark with 854,977 visitors."
      - "California's fair grew more than 8% to over 700,000 visitors, and Oklahoma rose nearly 4% to about 825,000."

