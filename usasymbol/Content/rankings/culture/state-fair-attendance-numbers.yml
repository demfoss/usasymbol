page:
  h1: "State Fair Attendance by State"

  quick_answer:
    - "Texas ranks first in 2025 state fair attendance, with the State Fair of Texas drawing 2,020,064 visitors over its 24-day run in Dallas."
    - "Minnesota ranks second at 1,940,869 visitors despite a run of just 12 days, half the length of the Texas fair."
    - "Georgia's National Fair set an attendance record at 612,706 visitors in 2025, while the State Fair of Texas fell 15.3% from 2024 to its lowest total since 2018."

  methodology: "Attendance totals are the final 2025 figures reported by each fair's organizers, state agriculture department, or local news coverage after that year's event closed, current as of December 2026."

