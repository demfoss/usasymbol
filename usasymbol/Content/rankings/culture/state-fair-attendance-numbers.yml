faq:
  - question: "Which state fair has the highest attendance in the country?"
    answer: "The State Fair of Texas, with 2,020,064 visitors in 2025. That total is down from 2,385,855 in 2024, but still the largest of any U.S. state fair."

  - question: "How many people attend the Minnesota State Fair each year?"
    answer: "The Minnesota State Fair drew 1,940,869 visitors in 2025, its fifth-highest total on record. That ranks second nationally despite a run of only 12 days."

  - question: "Did State Fair of Texas attendance drop in 2025?"
    answer: "Yes. Attendance fell 15.3%, or 365,791 fewer visitors, from 2,385,855 in 2024 to 2,020,064 in 2025, the fair's lowest total since 2018."

  - question: "Which state fair set an attendance record in 2025?"
    answer: "The Georgia National Fair in Perry drew 612,706 visitors, its highest total in over a decade."

  - question: "Which state fair on this list has the lowest attendance?"
    answer: "The Colorado State Fair, at about 430,000 in 2025. Attendance there fell roughly 13% from 2024 after repeated storms during the run."

  - question: "How does Wisconsin State Fair attendance compare to its 2024 record?"
    answer: "The 2025 Wisconsin State Fair drew 892,968 visitors, down from a record 1,136,805 in 2024. Flooding forced organizers to cancel the final day of the 2025 run."

