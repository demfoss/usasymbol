sections:
  - id: why-new-york-leads-nobel-birthplaces
    icon: "fa-solid fa-award"
    title: "Why New York Leads Nobel Birthplaces"
    paragraphs:
      - "New York's total, at least 74, is anchored by the country's first-ever Nobel laureate. Theodore Roosevelt, born in New York City in 1858, won the Nobel Peace Prize in 1906 for mediating the end of the Russo-Japanese War, becoming both the first American and the first sitting statesman to win a Nobel Prize."
      - "That head start reflects New York City's long run as the country's largest population center and a hub for its research universities and medical institutions, the same density that put Massachusetts, home to Harvard and MIT, in second place with 22."

  - id: connecticuts-nobel-connection-to-modern-vaccines
    icon: "fa-solid fa-syringe"
    title: "Connecticut's Nobel Connection to Modern Vaccines"
    paragraphs:
      - "Connecticut's laureates include John Franklin Enders, born in West Hartford, who won the 1954 Nobel Prize in Physiology or Medicine for growing the polio virus in tissue culture. That breakthrough made the modern polio vaccine possible and earned Enders the nickname the Father of Modern Vaccines."

