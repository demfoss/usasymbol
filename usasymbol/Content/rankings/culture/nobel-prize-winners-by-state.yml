faq:
  - question: "Which state has produced the most Nobel Prize winners?"
    answer: "New York has produced the most by birthplace, at least 74, nearly triple Massachusetts's 22."

  - question: "How many Nobel laureates were born in Massachusetts?"
    answer: "At least 22 Nobel laureates were born in Massachusetts, including chemist Walter Gilbert."

  - question: "Was Theodore Roosevelt the first American Nobel Prize winner?"
    answer: "Yes. Roosevelt, born in New York City, won the 1906 Nobel Peace Prize, becoming the first American laureate in any category."

  - question: "How many Nobel laureates were born in California?"
    answer: "At least 17 Nobel laureates were born in California, including physicist Luis Alvarez, who won in 1968."

  - question: "Does Connecticut have Nobel Prize winners?"
    answer: "Yes. At least 9 Nobel laureates were born in Connecticut, including John Franklin Enders and geneticist Barbara McClintock."

  - question: "Who is called the Father of Modern Vaccines?"
    answer: "John Franklin Enders, born in West Hartford, Connecticut, earned the nickname after his 1954 Nobel Prize-winning polio research made the modern vaccine possible."

