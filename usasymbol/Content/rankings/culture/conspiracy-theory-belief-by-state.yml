page:
  h1: "Conspiracy Theory Belief by State"

  quick_answer:
    - "Nevada ranks first for conspiracy theory searches at 3,711 per 100,000 residents, the highest of the 20 states this study tracked."
    - "Wyoming ranks second at 2,840 per 100,000 and Washington is third at 2,769. Idaho sits last among the ranked states at 2,163, still well above half of Nevada's rate."
    - "California ranks 9th overall at 2,443 per 100,000, but leads the nation for Bohemian Grove searches specifically, at 1,429 per 100,000."

  methodology: "Rankings use Yardbarker's November 2024 analysis of Keywordtool.io search volume for eight conspiracy theories (Area 51, Bohemian Grove, Bigfoot, Flat Earth, Illuminati, Chemtrails, Moon Landing, JFK assassination) over 12 months, divided by state population and scaled per 100,000 residents. Yardbarker published results for its top 20 states."

