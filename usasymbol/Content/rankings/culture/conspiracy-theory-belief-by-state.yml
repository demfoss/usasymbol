  - id: "why-nevada-searches-conspiracy-theories-most"
    icon: "fa-solid fa-magnifying-glass"
    title: "Why Nevada Ranks First for Conspiracy Searches"
    paragraphs:
      - "Nevada's top result comes largely from Area 51, the theory it ranks 1st in the country for. Area 51 sits inside Nevada's borders, which the study ties directly to the state's overall search volume of 3,711 per 100,000."
      - "Bohemian Grove ranked second among Nevada's own searches. Moon landing searches ranked third, ahead of Illuminati in fourth and Flat Earth in fifth."

