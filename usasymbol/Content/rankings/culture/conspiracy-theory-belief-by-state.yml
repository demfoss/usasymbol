faq:
  - question: "Which state searches the most for conspiracy theories?"
    answer: "Nevada searches conspiracy theories most, at 3,711 per 100,000 residents. Wyoming ranks second at 2,840, and Washington ranks third at 2,769."

  - question: "Why does Nevada rank first for conspiracy theory searches?"
    answer: "Nevada ranks 1st in the country for Area 51 searches specifically, and Area 51 is located inside the state. Bohemian Grove and moon landing searches rank second and third among Nevada's own results."

  - question: "What is the conspiracy theory search rate in California?"
    answer: "California posts 2,443 searches per 100,000 residents, ranking 9th overall. It leads the country for Bohemian Grove searches alone, at 1,429 per 100,000."

  - question: "Which state searches the least for conspiracy theories?"
    answer: "Idaho ranks lowest among the 20 states this study measured, at 2,163 searches per 100,000 residents. New Hampshire is just above it at 2,220."

  - question: "What is the conspiracy theory search rate in Utah?"
    answer: "Utah ranks 10th at 2,432 searches per 100,000 residents, behind California's 2,443 and ahead of Hawaii's 2,376."

  - question: "Which conspiracy theory does Nevada search most?"
    answer: "Area 51 ranks 1st among Nevada's searches. Bohemian Grove ranks 2nd, and the moon landing ranks 3rd."

