page:
  h1: "Cat vs. Dog Ownership by State"

  quick_answer:
    - "Idaho has the highest dog ownership rate of any state at 58.3% of households. Montana (51.9%) and Arkansas (51.6%) rank second and third."
    - "Vermont is the most cat-leaning state: 44.6% of households own a cat versus 28.3% that own a dog, the widest cat-over-dog gap on record."
    - "New Hampshire has the lowest dog ownership rate at 23.7%, yet its cat ownership rate of 36.4% is among the highest in the country."

  methodology: "Dog and cat ownership rates by state come from Statista's 2024 U.S. household pet ownership survey data. A matching cat ownership figure is available for the 10 states with the highest reported cat-owning household share; other states show dog ownership only. Alaska and Hawaii are excluded for lack of comparable state-level data."

  sources:
    - name: "Statista"
      url: "https://www.statista.com/topics/1258/pets/"
      description: "U.S. household pet ownership survey data by state, 2024"
    - name: "AVMA — American Veterinary Medical Association"
      url: "https://www.avma.org/resources-tools/reports-statistics/us-pet-ownership-statistics"
      description: "U.S. Pet Ownership and Demographics Sourcebook, national dog and cat ownership rates"

