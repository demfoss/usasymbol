faq:
  - question: "Which state has the highest dog ownership rate?"
    answer: "Idaho, at 58.3% of households. Montana (51.9%) and Arkansas (51.6%) rank second and third."

  - question: "Which state has the highest cat ownership rate?"
    answer: "Vermont, at 44.6% of households. Maine follows at 43.6%, and both rank among the states where cat ownership exceeds dog ownership."

  - question: "Which states have more cat owners than dog owners?"
    answer: "Vermont, Maine, and New Hampshire. Vermont has the widest gap, with cat ownership 16.3 points above dog ownership; New Hampshire's gap is 12.7 points."

  - question: "Which state has the lowest dog ownership rate?"
    answer: "New Hampshire, at 23.7% of households, the only state under 24%. Its cat ownership rate of 36.4% is far higher."

  - question: "What percentage of U.S. households own a dog?"
    answer: "About 45.5% of U.S. households owned a dog as of the AVMA's most recent national figures. Idaho, at 58.3%, sits well above that average."

  - question: "What percentage of U.S. households own a cat?"
    answer: "About 32.1% of U.S. households owned a cat nationally. Vermont (44.6%), Maine (43.6%), and New Hampshire (36.4%) all rank above that figure."

