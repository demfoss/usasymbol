          cat_pct: "43.6%"
          dog_pct: "35.9%"
        - rank: 3
          state: "New Hampshire"
          state_slug: "new-hampshire"
          cat_pct: "36.4%"
          dog_pct: "23.7%"
    paragraphs:
      - "Vermont, Maine, and New Hampshire are the only states in the data where cat ownership exceeds dog ownership. Vermont has the widest gap: 44.6% of households own a cat against just 28.3% that own a dog, a 16.3-point spread."
      - "New Hampshire pairs the nation's lowest dog ownership rate, 23.7%, with a cat ownership rate of 36.4%, one of the highest recorded. Maine sits closer to even, with cat ownership at 43.6% against dog ownership at 35.9%."

