faq:
- question: Which state has the most zoos?
  answer: California has the most accredited zoos and aquariums at 25, and Florida is one behind at 24. Both states have warm weather and heavy tourism that keep large animal attractions busy.
- question: Which states have no zoo?
  answer: Maine, New Hampshire, Vermont, and Wyoming have no accredited zoo. Wyoming has no zoo of any kind, which makes it unusual even among the four.
- question: Why does Wyoming have no zoo?
  answer: Wyoming has not seen a sustained push to build one, and a Game and Fish spokesperson has said as much. The state allows some exotic animals to be exhibited with approval but bars private ownership of big cats such as tigers.
- question: What is the oldest zoo in the United States?
  answer: The Philadelphia Zoo opened in 1874 and was the first zoo established in the country. Pennsylvania now has 8 accredited facilities.
- question: What is the largest zoo in New York?
  answer: The Bronx Zoo is the largest metropolitan zoo in the United States. New York has 12 accredited zoos and aquariums in all.
- question: Why do Alaska and Nevada have only one accredited facility?
  answer: Both are aquariums rather than traditional zoos. Alaska SeaLife Center in Seward and Shark Reef Aquarium inside Mandalay Bay in Las Vegas are the only accredited facilities in their states.
