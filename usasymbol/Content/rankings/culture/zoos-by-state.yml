    paragraphs:
    - California has 25 accredited zoos and aquariums, and the San Diego Zoo, which opened in 1916, grew into one of the best-known zoos in the world. A mild climate lets animals and visitors stay outdoors most of the year, and several large metro areas supply the crowds that keep big zoos funded.
    - Florida follows at 24, with Zoo Miami and Busch Gardens Tampa Bay among them, because year-round tourism supports zoos, aquariums, and theme parks alike. Texas ranks third with 17, led by the Houston Zoo, and its huge [population](/rankings/demographics/states-by-population) supports several big-city zoos.
- id: states-with-no-aza-accredited-zoo
  icon: fa-solid fa-map-marker-alt
  title: States With No Accredited Zoo
  table:
    columns:
      state: State
      region: Region
      notes: Notes
    rows:
    - state: Maine
      state_slug: maine
      region: New England
    - state: New Hampshire
      state_slug: new-hampshire
      region: New England
    - state: Vermont
      state_slug: vermont
      region: New England
    - state: Wyoming
      state_slug: wyoming
      region: Mountain West
      notes: Also the only state with no zoo of any kind
  paragraphs:
  - Maine, New Hampshire, Vermont, and Wyoming trail with zero, and the three New England states are small and thinly populated. Wildlife parks such as the Maine Wildlife Park in Gray and the Squam Lakes Natural Science Center in Holderness show native animals, but they sit outside the accredited list.
  - Wyoming has no zoo at all, and the reason is a lack of demand rather than a ban. Officials may approve exotic animals for exhibition case by case, while private ownership of tigers and other big cats remains barred.
