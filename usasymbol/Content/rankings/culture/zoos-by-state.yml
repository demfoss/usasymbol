page:
  h1: Zoos by State
  quick_answer:
  - Zoos by state start with California at 25 accredited zoos and aquariums, led by the San Diego Zoo and helped by mild weather that suits outdoor animal exhibits all year.
  - Maine, New Hampshire, Vermont, and Wyoming have none. Wyoming is the only state with no zoo of any kind, and a Game and Fish spokesperson has pointed to a lack of any real push to build one.
  - Florida is one facility behind California at 24, powered by tourism and theme parks. Nevada and Alaska each have just one, and both are aquariums rather than traditional zoos.
  methodology: Counts reflect zoos, aquariums, and related facilities accredited by the Association of Zoos and Aquariums (AZA) as of March 2026. Unaccredited zoos, sanctuaries, and roadside animal parks are not counted.
