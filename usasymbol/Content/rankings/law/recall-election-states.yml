faq:
  - question: "How many states allow recall of state officials?"
    answer: "Nineteen states allow it. Twelve require no particular reason, and seven require specified grounds such as misconduct or incompetence."
  - question: "Which governors have been recalled?"
    answer: "Two. North Dakota's Lynn Frazier was removed in 1921 and California's Gray Davis in 2003. Scott Walker in 2012 and Gavin Newsom in 2021 both survived."
  - question: "Can you recall a governor in Texas?"
    answer: "No. Texas has no recall of state officials, and neither do 30 other states. Texas voters can remove a governor only through impeachment by the legislature."
  - question: "How many signatures does it take to recall a governor in California?"
    answer: "Petitioners need signatures equal to 12 percent of the last governor vote, including signatures from five counties. That is lower than the 25 percent used in states such as Arizona and Colorado."
  - question: "Why did North Dakota recall Governor Frazier?"
    answer: "Opponents of the Nonpartisan League turned on Frazier during a 1921 fight over state-owned industries such as the Bank of North Dakota. He was the first governor ever recalled, and he went on to win a U.S. Senate seat in 1922."
  - question: "Which state was first to adopt recall?"
    answer: "Oregon and Michigan were the first to adopt it for state officials, both in 1908. Oregon's measure was an initiated constitutional amendment, approved by voters in June 1908."
  - question: "Is recall different from impeachment?"
    answer: "Yes. Voters trigger a recall by petition and decide it at the ballot box, while the legislature handles impeachment. Arizona's Evan Mecham shows how they can overlap, since he was impeached before his recall vote."
