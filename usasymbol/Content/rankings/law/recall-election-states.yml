  description: "Nineteen states let voters recall state officials. Governors were removed in North Dakota in 1921 and California in 2003, but not Wisconsin in 2012."
page:
  h1: "Recall Election States"
  quick_answer:
    - "Recall election states let voters remove state officials before their terms end, and 19 states allow it. Twelve of them, including California, Arizona, Oregon and Michigan, require no specific grounds. Oregon and Michigan adopted recall in 1908."
    - "North Dakota recalled Governor Lynn Frazier in 1921 during a fight over state-owned industries, and California recalled Gray Davis in 2003. Wisconsin's Scott Walker survived a 2012 recall."
    - "Seven states, Alaska, Georgia, Kansas, Minnesota, Montana, Rhode Island and Washington, require specified grounds such as misconduct. Kansas sets the highest signature bar at 40 percent of the vote for the office."
  methodology: "Checked October 2026 using the Rutgers Eagleton Center, the Center for Public Policy and Social Change and Wikipedia. Code 2 is recall for any reason and code 1 requires specified grounds. Recall of local officials and judges is excluded."
  sources:
    - name: "Rutgers Eagleton Center on the American Governor. Recalling Governors"
      url: "https://governors.rutgers.edu/recalling-governors-an-overview/"
      description: "The 19 states with gubernatorial recall and the Frazier, Davis and Walker recalls"
    - name: "Center for Public Policy and Social Change. Which States Allow Recall Elections"
