sections:
  - id: history-of-state-recall-elections
    icon: "fa-solid fa-landmark"
    title: "History of State Recall Elections"
    paragraphs:
      - "Recall grew out of the Progressive Era, when reformers wanted a way to remove officials without waiting for the next election. Los Angeles adopted the first modern city recall in 1903, and Oregon and Michigan followed for state officials in 1908, riding the same wave as the [ballot initiative](/rankings/law/ballot-initiative-states). California added it in 1911 under Governor Hiram Johnson, and most western states joined within a few years."
      - "Illinois is the recent exception. Voters approved a recall amendment for the governor in November 2010, the year after the legislature removed Governor Rod Blagojevich from office. Minnesota, New Jersey and Rhode Island also wrote their recall rules in the 1990s."
  - id: governors-removed-by-recall
    icon: "fa-solid fa-user-slash"
    title: "Governor Recall Elections in History"
    paragraphs:
      - "Only two governors have ever lost a recall vote. North Dakota removed Lynn Frazier in 1921 after a dispute over the state-owned bank and mill that his Nonpartisan League backed. California removed Gray Davis in 2003 amid an electricity crisis and a budget shortfall, and actor Arnold Schwarzenegger won the replacement ballot."
      - "Scott Walker of Wisconsin survived his 2012 recall, which grew out of a 2011 law limiting collective bargaining for public employees. Gavin Newsom of California survived a 2021 recall. In Arizona, a recall election against Evan Mecham was approved in 1988, but the legislature impeached and removed him before it took place."
    table:
      columns:
        governor: "Governor"
        state: "State"
        year: "Year"
        result: "Result"
      rows:
        - { governor: "Lynn Frazier", state: "North Dakota", year: "1921", result: "Recalled" }
        - { governor: "Gray Davis", state: "California", year: "2003", result: "Recalled" }
        - { governor: "Scott Walker", state: "Wisconsin", year: "2012", result: "Survived" }
        - { governor: "Gavin Newsom", state: "California", year: "2021", result: "Survived" }
  - id: recall-petition-signature-requirements
    icon: "fa-solid fa-file-signature"
    title: "Recall Petition Signature Requirements"
    paragraphs:
      - "California sets one of the lowest thresholds at 12 percent of the last governor vote, but it also demands signatures spread across five counties. Kansas sits at the other extreme at 40 percent of the vote for the office, and it also requires grounds."
      - "Wisconsin and most other states with no grounds requirement use 25 percent of the last vote for the office. Illinois asks for 15 percent plus a notice from 20 representatives and 10 senators, which gives legislators a gatekeeping role."
    table:
      columns:
        state: "State"
        threshold: "Signatures Needed"
      rows:
        - { state: "California", threshold: "12%" }
        - { state: "Illinois", threshold: "15%" }
        - { state: "Oregon", threshold: "15%" }
        - { state: "Idaho", threshold: "20%" }
        - { state: "Wisconsin", threshold: "25%" }
        - { state: "Kansas", threshold: "40%" }
  - id: states-that-require-grounds-for-recall
    icon: "fa-solid fa-gavel"
    title: "States That Require Grounds for Recall"
    paragraphs:
      - "Alaska, Georgia, Kansas, Minnesota, Montana, Rhode Island and Washington let voters recall only for specified wrongdoing. Alaska lists lack of fitness, incompetence, neglect of duties and corruption. Montana adds conviction of certain felonies, and Minnesota requires serious malfeasance or a serious crime. Voters cannot use recall in these states simply because they disagree with a vote or policy."
