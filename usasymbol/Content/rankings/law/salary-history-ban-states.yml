faq:
  - question: "Can an employer ask salary history in California?"
    answer: "California prohibits employers from seeking an applicant's salary history. Employers may ask about salary expectations for the new job, which asks what the applicant wants rather than what another workplace paid."
  - question: "Does the New York salary history ban cover remote interviews?"
    answer: "Yes, if the position will be based primarily in New York. An employer cannot avoid the rule by interviewing the applicant by telephone, online or in another state."
  - question: "Can a New York application make salary history optional?"
    answer: "No. An optional question still seeks salary history, even if the applicant can leave it blank. A voluntary disclosure must come without the employer asking for it."
  - question: "Does Washington's salary history ban apply to small businesses?"
    answer: "Yes. Washington's salary history restriction applies regardless of employer size, even though some of its separate job posting requirements use an employee threshold."
  - question: "Can Massachusetts confirm salary after a job offer?"
    answer: "Yes, after an offer that includes compensation has been negotiated and made. Massachusetts also allows confirmation of salary information an applicant voluntarily discloses."
  - question: "Can Oregon use previous salary to set new pay?"
    answer: "Oregon prohibits setting a new employee's compensation from current or past pay. Its hiring rule also bars screening applicants by pay history, with internal transfers treated separately."
