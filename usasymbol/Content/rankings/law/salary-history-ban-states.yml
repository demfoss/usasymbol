        - { state: "Maine", enacted_year: 2019 }
  - id: voluntary-salary-disclosure
    icon: "fa-solid fa-comments"
    title: "Voluntary Salary History Disclosure"
    paragraphs:
      - "Illinois's 2019 ban prevents an employer from using an applicant's old pay even when the applicant volunteers it. Minnesota, which adopted its law in 2023, allows genuinely unprompted disclosure to support a wage higher than the employer initially offered."
      - "Maryland's 2020 rule also allows voluntarily disclosed history to support a higher offer, provided it creates no unlawful pay disparity. California's 2017 law permits voluntary disclosure and consideration of that information, but prior salary cannot justify an unlawful difference in pay for substantially similar work."
  - id: salary-history-after-job-offer
    icon: "fa-solid fa-file-signature"
    title: "Salary History After a Job Offer"
    paragraphs:
      - "Maine's 2019 law permits inquiries after the employer has negotiated and made an offer containing all compensation terms. Before that point, an unprompted disclosure can permit confirmation. Seeking the information prematurely is evidence of unlawful discrimination, rather than a harmless extra box on an application."
      - "Delaware's 2017 restriction permits confirmation only after the compensation offer has been negotiated, made and accepted. New Jersey's 2019 law permits written authorization to confirm salary history after an offer with an explanation of the overall compensation package. Those rules put the pay proposal ahead of the old paycheck."
