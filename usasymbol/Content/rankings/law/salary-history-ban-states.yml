  title: "Salary History Ban States | Map & Hiring Rules"
  description: "Massachusetts adopted its salary history ban in 2016. Virginia adopted its private-employer ban in 2026. Eighteen states have statewide laws."
page:
  h1: "Salary History Ban States"
  quick_answer:
    - "Salary history ban states began with Massachusetts in 2016. Its equal pay law removed previous earnings from the employer's initial hiring questions, addressing the way an old wage gap can follow a worker into a new job."
    - "Virginia is the latest state to adopt a private-employer salary history ban, in 2026. Its law also requires wage ranges in public and internal job postings, including promotions and transfers."
    - "Illinois adopted its ban in 2019 and bars employers from using even voluntarily disclosed past pay to decide an offer. Minnesota's 2023 law instead permits volunteered history to support a higher offer."
  methodology: "State statutes and labor agencies checked October 8, 2026. Eighteen statewide private-employer inquiry restrictions are ordered by original enactment year, excluding public-only rules, local ordinances, DC and refusal-only protections."
