sections:
  - id: first-salary-history-ban
    icon: "fa-solid fa-scale-balanced"
    title: "Why Massachusetts Banned Salary History"
    paragraphs:
      - "Massachusetts leads with a 2016 law because lawmakers expanded equal pay protections into the hiring process. Basing a new offer on an applicant's previous earnings can carry an existing pay disparity from one workplace to the next. The law also defined comparable work by skill, effort and responsibility, rather than matching job titles alone."
      - "Virginia's 2026 law is the most recent statewide private-employer restriction. It links the ban to required [salary ranges in job postings](/rankings/law/pay-transparency-laws-by-state), including internal promotions and transfers. Employers must establish those ranges in good faith and cannot punish applicants for withholding their pay history."
    table:
      columns:
        state: "State"
        enacted_year: "Year Enacted"
      rows:
        - { state: "Massachusetts", enacted_year: 2016 }
