        - { state: "Kansas", age: 25, rule: "Candidate filing statute" }
        - { state: "South Dakota", age: 21, rule: "Governor qualification" }
        - { state: "California", age: 18, rule: "Voter eligibility" }
        - { state: "Massachusetts", age: 18, rule: "Voter ballot qualification" }
  - id: kansas-and-vermont-governor-age
    icon: "fa-solid fa-file-signature"
    title: "Kansas and Vermont Governor Qualifications"
    paragraphs:
      - "Kansas sets 25 in statute and requires that age by the candidate filing deadline. Its constitution leaves executive officers' qualifications to legislation, so the decisive age rule sits in the election code rather than the constitutional governor clause."
      - "Vermont's governor clause requires four years of residence and gives no express age. Massachusetts takes a different route through registered-voter ballot qualification, requiring age 18 by the nomination-paper filing deadline."
  - id: governor-age-at-inauguration
    icon: "fa-solid fa-calendar-days"
    title: "Governor Age at Filing or Inauguration"
    paragraphs:
      - "Maine specifies age 30 at the commencement of the governor's term, while Kansas requires 25 by filing. A birthday between those two milestones can have different consequences depending on the state."
