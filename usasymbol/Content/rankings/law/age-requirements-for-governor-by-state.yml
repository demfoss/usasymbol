seo:
  title: "Governor Age Requirements by State | Map & Rules"
  description: "Oklahoma requires governors to be at least 31. Six states have an eighteen-year threshold through voter eligibility. Vermont sets no express age."
page:
  h1: "Governor Age Requirements by State"
  quick_answer:
    - "Governor age requirements reach their highest state threshold in Oklahoma at 31. Its constitution applies that age to several statewide executive offices, rather than creating a separate rule for the governor."
    - "California, Massachusetts, Ohio, Rhode Island, Washington, and Wisconsin have an eighteen-year threshold through voter eligibility. Becoming old enough to vote opens the age gate, but residency and other qualifications still apply."
    - "Vermont sets no express gubernatorial age requirement. Its constitution instead requires four years of residence immediately before Election Day."
  methodology: "CSG Book of the States 2022, with Kansas, Massachusetts, Oklahoma and Vermont official rules checked October 7, 2026. All 50 states, including voter-based ages, with Vermont's numeric age omitted and territories excluded."
  sources:
    - name: "Council of State Governments. Governors' Qualifications for Office"
      url: "https://bookofthestates.org/tables/2022-4-2/"
      description: "State qualification table, used with current official corrections for Kansas, Massachusetts and Vermont"
    - name: "Oklahoma State Election Board. Governor Filing Packet 2026"
      url: "https://oklahoma.gov/content/dam/ok/en/elections/candidate-filing-archives/candidate-filing-packets/2026-candidate-filing-packets/2026-governor-state-officers-filing-packet.pdf"
      description: "Article VI section 3 sets age 31 and ten years as a qualified Oklahoma elector"
    - name: "Kansas Legislature. K.S.A. 25-101a"
      url: "https://www.ksrevisor.gov/statutes/chapters/ch25/025_001_0001a.html"
      description: "Governor and lieutenant governor candidates must be qualified electors aged 25 by the filing deadline"
    - name: "Massachusetts Secretary of the Commonwealth. Candidates Guide 2026"
      url: "https://www.sec.state.ma.us/divisions/elections/download/getting-on-the-ballot/Candidates-Guide-2026.pdf"
      description: "Registered-voter ballot qualification at age 18 and the seven-year governor residency requirement"
    - name: "Vermont General Assembly. State Constitution"
      url: "https://legislature.vermont.gov/statutes/constitution-of-the-state-of-vermont"
      description: "Chapter II section 23 specifies four years of residence without an express governor age"
    - name: "Vermont Secretary of State. Getting on the Ballot"
      url: "https://outside.vermont.gov/dept/sos/Elections%20Division/election%20info%20and%20resources/town%20meeting%20and%20local%20elections/local%20petitions/getting-on-the-ballot.pdf"
      description: "Official governor qualification is residence in the state for at least four years"
    - name: "South Dakota Legislature. Constitution Article IV section 2"
      url: "https://sdlegislature.gov/Constitution/4-2"
      description: "Age 21, United States citizenship and two years of residence before election"
    - name: "Maine Legislature. State Constitution"
      url: "https://www.maine.gov/legis/const/"
      description: "Governor must be 30 at commencement of the term, with citizenship and residency requirements"
    - name: "California Secretary of State. Governor Qualifications"
      url: "https://www.sos.ca.gov/elections/prior-elections/statewide-election-results/statewide-direct-primary-june-5-2018/qualifications-running-office/gov-ltgov"
