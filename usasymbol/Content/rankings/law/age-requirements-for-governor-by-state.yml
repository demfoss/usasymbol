sections:
  - id: highest-and-lowest-governor-age
    icon: "fa-solid fa-landmark"
    title: "Highest and Lowest Governor Age Limits"
    paragraphs:
      - "Oklahoma leads at 31 because its constitution groups the governor with other executive officers under a common age qualification. The same provision requires ten years immediately before election or appointment as a qualified Oklahoma elector. Turning the right age therefore clears only one part of a demanding eligibility rule."
      - "California and Massachusetts reach the lowest numeric threshold at 18 through voter qualifications rather than an added governor age clause. Massachusetts still requires seven years of residence before Election Day. California also requires candidates to be registered voters, making [voter registration](/rankings/government/voter-registration-rate-by-state) a ballot qualification."
    table:
      columns:
        state: "State"
        age: "Minimum Age"
        rule: "Basis"
      rows:
