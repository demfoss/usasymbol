faq:
  - question: "What is the minimum age to be governor of Oklahoma?"
    answer: "Oklahoma requires age 31. The requirement also covers lieutenant governor and several other statewide officers under the same constitutional section."
  - question: "How old do you have to be to run for governor in Kansas?"
    answer: "Kansas candidates must be at least 25 by the filing deadline and must be qualified electors. A candidate who turns 25 after filing does not meet the statute's timing requirement."
  - question: "Can an eighteen-year-old run for governor in Massachusetts?"
    answer: "Age 18 satisfies Massachusetts's registered-voter ballot qualification. A governor must also have lived in the Commonwealth for seven years before Election Day."
  - question: "Is there a minimum age for governor in Vermont?"
    answer: "Vermont's governor qualification clause states a four-year residence requirement without an express age. Residence must cover the four years immediately before Election Day."
  - question: "What is the minimum age for governor in South Dakota?"
    answer: "South Dakota requires age 21. Its constitution applies the same age, citizenship and two-year residence requirements to the lieutenant governor."
  - question: "Do you need to be 30 to become governor in Maine?"
    answer: "Maine requires age 30 when the term begins. The governor must also meet citizenship and residence conditions, including residence in Maine at election and throughout the term."
