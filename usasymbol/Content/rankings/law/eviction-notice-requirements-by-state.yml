page:
  h1: "Eviction Notice Requirements by State"

  quick_answer:
    - "Eviction notice requirements for unpaid rent peak at 14 days in seven states, Massachusetts, Minnesota, New York, Tennessee, Vermont, Virginia, and Washington."
    - "Seventeen states set a 3-day notice, including California, Texas, and Florida, and Missouri, New Jersey, and West Virginia require none. Another eight states, among them Arizona and Illinois, allow 5 days."
    - "Alabama, Georgia, and Utah count business days, and Nevada counts judicial days, so a 7-day or 3-day notice there runs longer on the calendar than the number suggests."

  methodology: "Days are the written notice a landlord must give a residential tenant for unpaid rent before filing for eviction, per state law in 2026. Missouri, New Jersey, and West Virginia require no notice before filing and are shown as 0 days."

  sources:
