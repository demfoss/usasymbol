sections:
  - id: "states-with-the-longest-eviction-notice-periods"
    icon: "fa-solid fa-calendar-days"
    title: "States with the Longest Eviction Notice Periods"
    paragraphs:
      - "Massachusetts, Minnesota, New York, Tennessee, Vermont, Virginia, and Washington require the longest notice at 14 days for unpaid rent. Seven more states, including Colorado, Hawaii, and Pennsylvania, require 10 days."
      - "Hawaii moved to a 10-day notice in 2026, and a scheduled mediation pushes its earliest filing date to day 20. Oregon's standard is also 10 days, though a landlord who serves notice after rent is 5 days late must allow 13 days."

  - id: "states-with-the-shortest-eviction-notice-periods"
    icon: "fa-solid fa-hourglass-end"
    title: "States with the Shortest Eviction Notice Periods"
    paragraphs:
      - "Missouri, New Jersey, and West Virginia require no notice before filing. Seventeen states set the shortest fixed notice at 3 days, including Arkansas, California, Florida, Ohio, and Texas. Another eight states allow 5 days, among them Arizona, Illinois, and South Carolina."
      - "Arkansas, North Dakota, Ohio, and Wyoming pair their 3-day periods with an unconditional quit notice, and Louisiana does the same at 5 days. Idaho, Iowa, Montana, and New Mexico give tenants 3 days to pay and stay."

  - id: "states-that-count-business-days-for-eviction-notices"
    icon: "fa-solid fa-business-time"
    title: "States That Count Business Days for Eviction Notices"
    paragraphs:
      - "Alabama requires 7 business days, and Georgia and Utah require 3 business days each. Nevada counts 7 judicial days, which skip weekends and court holidays."
      - "California and Florida list 3 days but exclude Saturdays, Sundays, and holidays, so the count skips the weekend."

