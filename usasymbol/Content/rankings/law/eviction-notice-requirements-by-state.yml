faq:
  - question: "How many days notice does a landlord have to give for unpaid rent?"
    answer: "Notice runs from none in three states and 3 days in 17 states to 14 days in seven states. Colorado, Maryland, Pennsylvania, and four other states set 10 days."

  - question: "How many days notice is required for eviction in Texas?"
    answer: "Texas requires 3 days of notice, tied with California, Florida, Ohio, and 13 other states for the shortest fixed period on record."

  - question: "What is the eviction notice period in California?"
    answer: "California requires 3 days, and Saturdays, Sundays, and judicial holidays do not count toward that period."

  - question: "Which state gives tenants the longest time to pay rent before eviction?"
    answer: "Massachusetts, Minnesota, New York, Tennessee, Vermont, Virginia, and Washington tie at 14 days. That is more than four times the 3-day notice in Ohio."

  - question: "Do weekends count in an eviction notice period?"
    answer: "In some states they do not. Alabama, Georgia, and Utah count business days, Nevada counts judicial days, and California and Florida exclude weekends and holidays."

  - question: "Which states have no set eviction notice for unpaid rent?"
    answer: "Missouri, New Jersey, and West Virginia require no notice before filing, so they show 0 days in the table. New Jersey requires 30 days if the landlord habitually accepted late rent."

