faq:
  - question: "Can felons vote in prison in Maine and Vermont?"
    answer: "Yes. Maine and Vermont are the only states that never remove the vote, so incarcerated residents vote by absentee ballot from their home address."
  - question: "Can felons vote in Florida?"
    answer: "Yes, once the whole sentence is finished. Florida requires fines, fees and restitution to be paid as well, and people convicted of murder or felony sex offenses need clemency."
  - question: "Can felons vote in Virginia now?"
    answer: "Most can. Under guidance issued after a January 2026 federal ruling, people with felony convictions can vote once released from prison, except those convicted of murder or manslaughter. A constitutional amendment on the November 3, 2026 ballot would make restoration automatic."
  - question: "Which states restore voting rights on release from prison?"
    answer: "Twenty-three states, including California, Colorado, Illinois, Michigan, New York and Pennsylvania. Probation and parole do not bar voting in these states."
  - question: "Can felons on probation or parole vote in Texas?"
    answer: "No. Texas restores the vote only after parole and probation end. Georgia, Wisconsin and 12 other states follow the same rule."
  - question: "Which states permanently ban some felons from voting?"
    answer: "Ten states keep a lasting ban for some convictions. They are Alabama, Arizona, Delaware, Florida, Iowa, Kentucky, Mississippi, Tennessee, Virginia and Wyoming."
  - question: "Why do Iowa and Kentucky rely on the governor?"
    answer: "Both constitutions bar people with felony convictions from voting until the governor restores the right. Governors in each state have used executive orders, in 2020 for Iowa and 2019 for Kentucky, to restore many people who finished their sentences."
