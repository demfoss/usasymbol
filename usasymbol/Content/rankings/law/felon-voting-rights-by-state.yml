  - id: states-that-restore-voting-rights-on-release
    icon: "fa-solid fa-door-open"
    title: "States That Restore Voting Rights on Release"
    paragraphs:
      - "Twenty-three states bring the vote back the day a person leaves prison, and several moved there recently. Nevada changed in 2019, Connecticut and New York in 2021, Washington in 2022, and Minnesota and New Mexico in 2023. People on probation or parole in these states can vote even though they remain under supervision."
      - "Fifteen states, among them Georgia, Texas and Wisconsin, still wait until parole and probation end, which can be years after release. How many people that affects depends on [incarceration rates](/rankings/law/incarceration-rate-by-state) and the size of each state's [prison system](/rankings/crime/prisons-by-state)."
