page:
  h1: "Felon Voting Rights by State"
  quick_answer:
    - "Felon voting rights are never taken away in Maine and Vermont, where people can vote by absentee ballot even while serving a prison sentence. Both sit at level 1, the least restrictive in the comparison."
    - "Ten states keep a lasting ban for some convictions, including Florida, Kentucky, Mississippi and Virginia. Virginia once barred every felony conviction for life unless the governor stepped in, until a 2026 federal ruling and new guidance restored most people on release."
    - "Twenty-three states restore the vote the day a person leaves prison, while 15 make people wait until parole and probation end."
  methodology: "State law checked October 2026 against Sentencing Project classifications, state election guidance and news coverage of 2026 changes. Level 1 never loses the vote, 2 restores on release, 3 after parole and probation, 4 keeps a lasting ban for some convictions. D.C. excluded."
