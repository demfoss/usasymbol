sections:
  - id: states-where-prisoners-can-vote
    icon: "fa-solid fa-person-booth"
    title: "States Where Prisoners Can Vote"
    paragraphs:
      - "Maine and Vermont let people vote while serving a prison sentence. Incarcerated residents request an absentee ballot, which is counted in the town where they lived before prison. Neither state ties the vote to criminal record, so there is nothing to restore later."
      - "Every other state removes the vote at least while a person is in prison. Washington, D.C. also allows voting from prison, but it is not a state and is left out of the table."
  - id: virginia-felon-voting-rights
    icon: "fa-solid fa-gavel"
    title: "Virginia Felon Voting Rights"
    paragraphs:
      - "Virginia is the biggest mover in 2026. Its constitution permanently barred every person with a felony conviction unless the governor restored rights one by one. A January 2026 federal ruling held that only crimes that were felonies at common law in 1870 can cost a person the vote."
      - "State guidance now restores most people on release from prison. Those convicted of murder, voluntary manslaughter or involuntary manslaughter still apply to the governor, and Governor Spanberger restored 66,085 people in July 2026. Voters decide on November 3, 2026 whether to write automatic restoration on release into the constitution."
  - id: lifetime-voting-bans-for-felons
    icon: "fa-solid fa-ban"
    title: "Lifetime Voting Bans for Felons"
    paragraphs:
      - "Florida voters approved Amendment 4 in 2018 to restore the vote after a sentence, with murder and felony sex offenses excluded. A 2019 law then defined the sentence to include fines, fees and restitution. Tennessee, by contrast, passed a 2026 law dropping the court-cost requirement, though a court order is still required."
      - "Mississippi's list of disqualifying crimes dates to its 1890 constitution, and restoration still takes a legislative vote or a pardon. Alabama's 1901 constitution set a similar list of offenses, and today a certificate from its pardons board is the usual route back."
