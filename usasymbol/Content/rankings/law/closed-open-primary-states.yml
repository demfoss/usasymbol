page:
  h1: "Closed and Open Primary States"
  quick_answer:
    - "Closed and open primary states range from Alaska, California and Washington, where every candidate shares one ballot, to nine states that limit primaries to registered party members. Eighteen states let any voter pick a party ballot."
    - "Louisiana changed in 2026, adding closed party primaries for U.S. Senate and two statewide boards. No-party voters pick one party's ballot, and U.S. House races moved to an open primary on November 3."
    - "New Mexico held its first semi-open primary on June 2, 2026, letting unaffiliated voters choose either major party's ballot without registering with it first."
  methodology: "Primary rules checked October 2026 against state election guidance and comparisons from MultiState, Independent Voter Project, Congress Countdown and Wikipedia, which classify some states differently. Level 1 closed, 2 semi-closed, 3 open, 4 single combined ballot. D.C. excluded."
