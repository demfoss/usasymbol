sections:
  - id: top-two-and-top-four-primary-states
    icon: "fa-solid fa-layer-group"
    title: "Top-Two and Top-Four Primary States"
    paragraphs:
      - "Washington has used a top-two primary since 2008 and California since 2012. Both states adopted it after courts struck down older blanket primaries that let any voter choose across parties. Washington's version, backed by a 2004 voter initiative, was upheld by the U.S. Supreme Court in 2008, and California voters approved theirs as Proposition 14 in 2010."
      - "Alaska took the idea one step further in 2020, advancing four candidates instead of two and then holding a ranked general election. Its first use came in 2022. Voters in Nevada rejected a similar top-five plan in 2024, and Idaho voters turned down a top-four proposal the same year, so the single-ballot model has stayed in three states."
    table:
      columns:
        state: "State"
        system: "Primary System"
        advancing: "Candidates Advancing"
      rows:
        - { state: "Alaska", system: "Top-four", advancing: "Four" }
        - { state: "California", system: "Top-two", advancing: "Two" }
        - { state: "Washington", system: "Top-two", advancing: "Two" }
  - id: states-with-closed-primaries
    icon: "fa-solid fa-lock"
    title: "States With Closed Primaries"
    paragraphs:
      - "Nine states limit party primaries to voters registered with that party. They are Connecticut, Delaware, Florida, Kentucky, Nevada, New York, Oregon, Pennsylvania and Wyoming. A voter who wants to cast a ballot must usually switch registration weeks before the election, which is why [voter registration](/rankings/government/voter-registration-rate-by-state) deadlines matter more here."
      - "Wyoming adopted its closed system in 2023, with a window before the primary that bars party switching. Florida has a quirk, since its closed primaries become open to everyone when only one party fields candidates for an office and no write-in challenger enters."
    table:
      columns:
        state: "State"
        rule: "Who Can Vote"
      rows:
        - { state: "Connecticut", rule: "Registered party members only" }
        - { state: "Delaware", rule: "Registered party members only" }
        - { state: "Florida", rule: "Registered party members only" }
        - { state: "Kentucky", rule: "Registered party members only" }
        - { state: "Nevada", rule: "Registered party members only" }
        - { state: "New York", rule: "Registered party members only" }
        - { state: "Oregon", rule: "Registered party members only" }
        - { state: "Pennsylvania", rule: "Registered party members only" }
        - { state: "Wyoming", rule: "Registered party members only" }
  - id: louisiana-closed-party-primaries
    icon: "fa-solid fa-landmark"
    title: "Louisiana Closed Party Primaries"
    paragraphs:
      - "Louisiana spent decades with a jungle primary in which all candidates ran on one ballot in November and a runoff followed if nobody won a majority. A 2024 law began replacing that in 2026 with closed party primaries for U.S. Senate, the Public Service Commission and the state education board. Registered Democrats and Republicans vote in their own party's primary, and no-party voters choose one."
      - "The change did not reach everything. Governor and legislature races keep the combined ballot, and a federal court ruling on the state's congressional map led Louisiana to move U.S. House races to an open primary on November 3, 2026, with a December 12 runoff if needed."
  - id: open-and-semi-closed-primary-states
    icon: "fa-solid fa-door-open"
    title: "Open and Semi-Closed Primary States"
    paragraphs:
      - "Eighteen states let any voter take any party's ballot, from Alabama and Texas to Wisconsin. Twenty states admit unaffiliated voters but keep party members in their own primary, with Arizona and Colorado as typical examples. Idaho shows how party rules can split a state, since Republicans exclude non-Republicans while Democrats admit everyone."
      - "Maine and New Mexico recently joined the semi-closed group. Unenrolled Maine voters can now choose a party ballot, and New Mexico's 2025 law let unaffiliated voters take a major party ballot in June 2026 without registering first. Combined with [same-day voter registration](/rankings/law/same-day-voter-registration-states), these rules shape how many people take part in [voter turnout](/rankings/government/voter-turnout-by-state) before November."
