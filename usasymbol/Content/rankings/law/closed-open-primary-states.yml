faq:
  - question: "What is the difference between an open and a closed primary?"
    answer: "In an open primary any voter can take a party's ballot. A closed primary limits each party's contest to voters registered with that party, and semi-closed states also admit unaffiliated voters."
  - question: "Which states have closed primaries?"
    answer: "Nine states. They are Connecticut, Delaware, Florida, Kentucky, Nevada, New York, Oregon, Pennsylvania and Wyoming."
  - question: "Does California have a closed primary?"
    answer: "No. California uses a top-two primary where all voters see every candidate on one ballot. The two highest finishers advance, even if they belong to the same party."
  - question: "What is a top-four primary?"
    answer: "Alaska's system. All candidates run on one ballot, the four with the most votes advance, and the general election uses ranked choice voting."
  - question: "Is Louisiana's primary closed now?"
    answer: "For U.S. Senate, the Public Service Commission and the state education board, yes, beginning in 2026. U.S. House races use an open primary on November 3, 2026, and governor and legislature races keep the combined ballot."
  - question: "Can independents vote in primaries in New Mexico?"
    answer: "Yes. Since the June 2026 primary, unaffiliated voters can choose a Democratic or Republican ballot without registering with either party first."
  - question: "Which states have open primaries?"
    answer: "Eighteen states, including Alabama, Georgia, Michigan, Minnesota, Texas, Virginia and Wisconsin. Voters in these states pick a party ballot at the polls."
