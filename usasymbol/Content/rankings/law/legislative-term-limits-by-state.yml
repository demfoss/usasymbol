sections:
  - id: longest-legislative-term-limits
    icon: "fa-solid fa-landmark"
    title: "Longest Legislative Term Limits"
    paragraphs:
      - "Louisiana allows 12 years in each chamber through a limit of three consecutive four-year terms. Nevada's constitution instead sets a twelve-year lifetime ceiling for each chamber. Both rules let a legislator move to the other body and begin a separate allowance there."
      - "North Dakota's eight-year limit is a lifetime ceiling for each chamber, while Nebraska's eight-year rule bars another consecutive term in its single chamber. Nebraska's structure also makes its [state legislature size](/rankings/government/state-legislature-size-by-state) unusually easy to understand, with one body passing legislation rather than two."
