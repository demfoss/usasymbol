      url: "https://www.sos.arkansas.gov/uploads/elections/Arkansas_Election_Laws_and_Constitution_2025_Edition.pdf"
      description: "Amendment 73 sets the new-entrant twelve-year consecutive limit and four-year break"
    - name: "Michigan Legislature. State Constitution"
      url: "https://www.legislature.mi.gov/documents/mcl/pdf/mcl-Constitution.pdf"
      description: "Article IV section 54 establishes the shared twelve-year limit and the 2022 Senate exception"
    - name: "Louisiana Senate. Constitution Article III"
      url: "https://senate.legis.la.gov/Documents/Constitution/Article3.htm"
      description: "Section 4 provides the three-consecutive-term limit in each chamber"
    - name: "Nevada Legislature. State Constitution"
