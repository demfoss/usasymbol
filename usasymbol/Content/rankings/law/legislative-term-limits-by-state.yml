  - id: lifetime-and-consecutive-term-limits
    icon: "fa-solid fa-calendar-days"
    title: "Lifetime and Consecutive Term Limits"
    paragraphs:
      - "Michigan's 12-year allowance follows a legislator across both chambers. Moving from the House to the Senate does not start a fresh clock, so a person who spends the entire allowance in one body has no remaining ordinary service in the other."
      - "Arkansas also shares 12 years across its chambers, but a new entrant can return after a four-year break. Montana takes another approach at eight years, counting service within a rolling sixteen-year window rather than erasing the record whenever a legislator takes a short break."
