faq:
  - question: "What are the legislative term limits in California?"
    answer: "California allows a new entrant 12 years of lifetime service across the Assembly and Senate combined. A legislator can use the whole allowance in either chamber or divide it between them."
  - question: "What are the legislative term limits in Michigan?"
    answer: "Michigan sets a shared 12-year lifetime limit. Senators elected in 2022 retain a specific exception tied to the elections allowed when they became candidates."
  - question: "Can Arkansas legislators return after a term limit?"
    answer: "Arkansas legislators covered by the new-entrant rule can return after a four-year break following their 12 consecutive years. The rule applies to legislators first elected on or after January 1, 2021."
  - question: "What are the legislative term limits in Nevada?"
    answer: "Nevada sets a 12-year lifetime ceiling in the Assembly and another in the Senate. Changing chambers therefore preserves a second allowance."
  - question: "How many states have legislative term limits?"
    answer: "Sixteen states have legislative term limits. Nebraska applies its rule to a single chamber, while the other states have separate House and Senate bodies."
  - question: "Do North Dakota term limits count earlier service?"
    answer: "North Dakota's eight-year limits operate prospectively. Legislative service before the constitutional amendment took effect does not count toward either chamber's allowance."
