page:
  h1: "Legislative Term Limits by State"
  quick_answer:
    - "Legislative term limits allow 12 years in one chamber in Arkansas, California, Louisiana, Michigan, Nevada, and Oklahoma. Some apply a shared limit across both chambers, while others allow a separate allowance in each."
    - "North Dakota caps service at eight years in each chamber. Its limit counts service prospectively, so time served before the amendment took effect does not use up a legislator's allowance."
    - "Nebraska's eight-year limit applies to its single legislative chamber. Every Nebraska legislator is a senator, even though the body has no separate House of Representatives."
  methodology: "NCSL and state constitutions, checked October 7, 2026. Years show the ordinary one-chamber ceiling for a new entrant in 16 term-limited states. Shared caps, reset rules and grandfather clauses appear in notes."
  sources:
    - name: "National Conference of State Legislatures. The Term-Limited States"
      url: "https://www.ncsl.org/about-state-legislatures/the-term-limited-states"
      description: "State coverage, chamber limits and consecutive versus lifetime rules, including the Arkansas amendment footnote"
