page:
  h1: "Security Deposit Return Deadlines by State"

  quick_answer:
    - "Security deposit return deadlines are longest in Alabama, Arkansas, and West Virginia at 60 days, the maximum among the 50 states in this table."
    - "Twenty-seven states share the most common deadline of 30 days, including Texas, Michigan, Ohio, and Washington. Illinois, Indiana, Maryland, Mississippi, Oklahoma, and Virginia allow 45 days, and Oregon allows 31."
    - "Arizona, Hawaii, Nebraska, New York, South Dakota, and Vermont have the shortest deadline at 14 days, less than a quarter of Alabama's 60 days."

  methodology: "Days show each state's statutory deadline to return a residential security deposit or send an itemized deduction statement after the tenancy ends, checked against state statutes and legal references in September 2026. Where a state sets a shorter deadline that applies only to full refunds, the longer general deadline is shown and the shorter one appears in the notes."

  sources:
    - name: "Arizona Legislature. A.R.S. 33-1321, Security Deposits"
      url: "https://www.azleg.gov/ars/33/01321.htm"
      description: "Arizona statute setting a 14-day deadline that excludes weekends and legal holidays"
    - name: "Virginia Law. Code of Virginia 55.1-1226, Security Deposits"
      url: "https://law.lis.virginia.gov/vacode/title55.1/chapter12/section55.1-1226/"
      description: "Virginia statute setting a 45-day deadline for the itemized statement and refund"
    - name: "Wisconsin Legislature. ATCP 134.06, Security Deposits"
      url: "https://docs.legis.wisconsin.gov/code/admin_code/atcp/090/134/06?view=section"
      description: "Wisconsin rule setting a 21-day deadline for returning a security deposit"
    - name: "Florida Senate. Florida Statutes 83.49, Deposit Money or Advance Rent"
      url: "https://www.flsenate.gov/laws/statutes/2023/83.49"
      description: "Florida statute setting 15-day and 30-day deadlines for returning a deposit or noticing a claim"
    - name: "Deposit Deadline. Security Deposit Laws by State"
      url: "https://www.depositdeadline.com/security-deposit-laws-by-state"
      description: "State-by-state return and itemization deadlines with statute citations"

