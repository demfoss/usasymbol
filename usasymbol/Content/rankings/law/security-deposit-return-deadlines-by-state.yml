faq:
  - question: "What state has the longest security deposit return deadline?"
    answer: "Alabama, Arkansas, and West Virginia share the longest deadline at 60 days. West Virginia's period drops to 45 days if a new tenant moves in first."

  - question: "What state has the shortest security deposit return deadline?"
    answer: "Arizona, Hawaii, Nebraska, New York, South Dakota, and Vermont share the shortest deadline at 14 days. Arizona excludes weekends and legal holidays from its count."

  - question: "How many days does a landlord have to return a security deposit in Texas?"
    answer: "Texas landlords have 30 days after the tenant surrenders the premises. The tenant must provide a written forwarding address, and the same 30-day deadline applies in 26 other states in the table."

  - question: "How long does a landlord have to return a security deposit in California?"
    answer: "California gives landlords 21 days. Connecticut, Idaho, Minnesota, and Wisconsin use the same deadline."

  - question: "What is the security deposit return deadline in Florida?"
    answer: "Florida gives landlords 30 days to send notice of a claim against the deposit, and 15 days to return the full deposit when no claim is made."

  - question: "How many days does a landlord have to return a security deposit in Colorado?"
    answer: "Colorado requires return within 30 days, though a lease may extend that period to a maximum of 60 days."

