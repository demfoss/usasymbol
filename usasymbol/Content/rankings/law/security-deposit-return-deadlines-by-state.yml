sections:
  - id: "states-with-the-longest-security-deposit-return-deadlines"
    icon: "fa-solid fa-hourglass-end"
    title: "States With the Longest Security Deposit Return Deadlines"
    paragraphs:
      - "Alabama, Arkansas, and West Virginia give landlords 60 days, the longest deadline in the table and more than four times the 14-day minimum. Illinois, Indiana, Maryland, Mississippi, Oklahoma, and Virginia follow at 45 days, and Oregon allows 31."
      - "Colorado defaults to 30 days, but a lease there may extend the period to as long as 60 days. West Virginia's 60 days shrinks to 45 if a new tenant occupies the unit before the period ends."

  - id: "states-with-the-shortest-security-deposit-return-deadlines"
    icon: "fa-solid fa-bolt"
    title: "States With the Shortest Security Deposit Return Deadlines"
    paragraphs:
      - "Arizona, Hawaii, Nebraska, New York, South Dakota, and Vermont require landlords to act within 14 days, the shortest deadline in the table. Arizona counts business days only, so its 14 days stretch longer on the calendar than the same figure elsewhere."
      - "Delaware and Rhode Island set 20 days, and California, Connecticut, Idaho, Minnesota, and Wisconsin set 21. Twenty-seven states use 30 days, the largest group, while deposit amounts and interest rules appear in [security deposit laws by state](/rankings/law/security-deposit-laws-by-state)."

