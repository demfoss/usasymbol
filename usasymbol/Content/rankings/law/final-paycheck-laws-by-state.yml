faq:
  - question: "What is the California final paycheck law?"
    answer: "California requires final wages immediately after discharge. Resignation uses a different rule based on advance notice, and certain industries have statutory exceptions."
  - question: "When is a final paycheck due in Texas?"
    answer: "Texas requires payment within 6 calendar days after an involuntary separation and on the next regular payday after a resignation. Employers must identify how the employment actually ended before selecting a deadline."
  - question: "When is a final paycheck due in New York?"
    answer: "New York requires the final wages no later than the regular payday for the pay period in which employment ended. A worker may request mailing rather than returning to collect the check."
  - question: "When is a final paycheck due in Florida?"
    answer: "Florida has no separate state final-pay deadline in this comparison. Earned wages remain payable under ordinary wage obligations, and federal law does not require an immediate separation check."
  - question: "Does giving two weeks notice change final pay?"
    answer: "Hawaii ties payment at quitting to at least one full pay period of notice, while California uses 72 hours. A two-week notice policy therefore should not be treated as a universal final-wage rule."
  - question: "Can an employer withhold a final paycheck for equipment?"
    answer: "Washington prohibits withholding the entire final check because equipment has not been returned. South Dakota expressly addresses property return, so state rules and federal wage protections must be considered together."
  - question: "Does Minnesota require a demand for final wages?"
    answer: "Minnesota generally requires a discharged employee's wages to be paid within 24 hours of a demand. Resignations use a payday rule with a separate exception and maximum delay."
  - question: "Is Nevada final pay due immediately or in three days?"
    answer: "Nevada makes wages due immediately on discharge. The three-day language concerns an additional penalty trigger, which is a separate issue from the due date."
