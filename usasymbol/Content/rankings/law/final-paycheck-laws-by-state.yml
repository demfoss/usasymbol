seo:
  title: "Final Paycheck Laws by State | Map & Deadlines"
  description: "California requires immediate final pay after discharge. Texas allows 6 calendar days. State deadlines differ for workers who quit or are fired."
page:
  h1: "Final Paycheck Laws by State"
  quick_answer:
    - "Final paycheck laws by state require immediate discharge pay in California, Massachusetts, Missouri, and Nevada. The deadline starts with the employer's decision to end the job, instead of letting ordinary payroll determine the payment date."
    - "Texas gives employers 6 calendar days after an involuntary separation, but a worker who resigns is paid on the next regular payday. The same payroll office can therefore face different deadlines for two workers leaving on the same day."
    - "Minnesota links a discharged worker's payment deadline to a demand, with payment generally required within 24 hours of that demand. A calendar date alone cannot summarize every state's rule."
  methodology: "State statutes and labor-agency guidance checked October 2, 2026 support ordinary employee discharge and resignation rules, excluding DC. Map categories group discharge rules, with industry, public-sector and closure exceptions noted where material."
  sources:
