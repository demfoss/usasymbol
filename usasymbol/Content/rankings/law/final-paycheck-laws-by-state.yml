sections:
  - id: "immediate-final-paycheck-states"
    icon: "fa-solid fa-clock"
    title: "States Requiring Immediate Final Pay"
    paragraphs:
      - "California's immediate discharge deadline comes from a law that treats earned wages as due when the employer ends the job. Massachusetts, Missouri, and Nevada also separate that event from ordinary payroll. The fastest group exists because these states attach payment to separation, not because their payroll systems process checks faster."
      - "Colorado also starts with immediate payment, but its accounting-unit exceptions recognize that a payroll office may be closed or offsite. Montana allows a written personnel policy to extend its immediate default. Florida and the other states without a separate state deadline rely on ordinary wage obligations because federal law does not require an immediate separation check."
    table:
      columns: {state: "State", deadline: "Discharge Deadline"}
      rows:
        - {state: "California", deadline: "Immediately"}
        - {state: "Colorado", deadline: "Immediately, accounting exceptions"}
        - {state: "Massachusetts", deadline: "Day of discharge"}
        - {state: "Missouri", deadline: "Day of discharge"}
        - {state: "Montana", deadline: "Immediately, written-policy exception"}
        - {state: "Nevada", deadline: "Immediately"}
  - id: "final-paycheck-after-quitting"
    icon: "fa-solid fa-person-walking-arrow-right"
    title: "Final Paycheck After Quitting a Job"
    paragraphs:
      - "California makes resignation notice part of the deadline. A worker who gives at least 72 hours notice receives final wages when quitting, while someone leaving without that notice can wait up to 72 hours. Oregon also distinguishes noticed resignations from sudden departures, but uses its own notice and business-day rules."
      - "Hawaii uses a full pay period of notice for payment at quitting. Texas instead uses the next regular payday for a voluntary separation. A salary range disclosed under [pay transparency laws](/rankings/law/pay-transparency-laws-by-state) does not decide either deadline, since advertised compensation and earned-wage payment are different duties."
    table:
      columns: {state: "State", notice: "Effect of Resignation Notice"}
      rows:
        - {state: "California", notice: "At quitting with at least 72 hours notice"}
        - {state: "Oregon", notice: "At quitting with 48 hours notice, subject to nonbusiness-day rule"}
        - {state: "Hawaii", notice: "At quitting with one pay period notice"}
        - {state: "New Hampshire", notice: "Within 72 hours with one pay period notice"}
  - id: "final-paycheck-days-or-payday"
    icon: "fa-solid fa-calendar-days"
    title: "Final Paycheck Days or Next Payday"
    paragraphs:
      - "Louisiana requires the earlier of the next payday or 15 days after separation, while Kentucky uses the later of the next normal pay period or 14 days. Tennessee also uses a later-of rule, with 21 days. Reversing one word in the legal formula changes whether a payday accelerates or extends payment."
      - "Delaware uses the later of the regular pay-cycle date or 3 business days after the last day worked. Minnesota's discharge rule instead starts from a demand. A [minimum wage](/rankings/economy/minimum-wage-by-state) determines the pay floor, while these deadlines determine when wages already earned must reach the worker."
    table:
      columns: {state: "State", formula: "Payment Formula"}
      rows:
        - {state: "Louisiana", formula: "Payday or 15 days, earlier"}
        - {state: "Nebraska", formula: "Payday or 2 weeks, earlier"}
        - {state: "Kentucky", formula: "Next normal pay period or 14 days, later"}
        - {state: "Tennessee", formula: "Payday or 21 days, later"}
        - {state: "Delaware", formula: "Regular pay-cycle date or 3 business days, later"}
  - id: "final-paycheck-withholding-rules"
    icon: "fa-solid fa-money-check-dollar"
    title: "Final Paycheck Withholding Rules"
    paragraphs:
      - "Washington requires the final check by the next regularly scheduled payday and prohibits holding the whole check until keys, uniforms, or tools come back. South Dakota's statute expressly addresses return of employer property, showing why a withholding rule from one state cannot be assumed to apply nationwide. Federal pay protections still constrain deductions."
      - "Nevada makes discharge wages due immediately even though its additional wage penalty has a separate three-day trigger. A penalty clock is not permission to ignore the original due date. Final wages also include earned compensation required by applicable [overtime laws](/rankings/law/overtime-laws-by-state), while vacation, severance, and commission terms need separate review."
