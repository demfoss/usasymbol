faq:
  - question: "What is the minimum age to get an esthetician license?"
    answer: "The minimum age ranges from 16 to 23 depending on the state. Arizona requires the highest minimum age at 23. Sixteen states set the minimum at 16, the most common threshold on the list."

  - question: "Which state has the highest minimum age for an esthetician license?"
    answer: "Arizona has the highest minimum age at 23, five years above the next tier of eight states set at 18: Indiana, Montana, Nevada, Rhode Island, South Dakota, Vermont, West Virginia, and Wisconsin."

  - question: "Do any states have no minimum age for an esthetician license?"
    answer: "Yes. Seven states, Connecticut, Iowa, Kentucky, Minnesota, New Hampshire, North Dakota, and Virginia, list no minimum age requirement. Education requirements still apply in six of the seven, and only Virginia lists neither age nor education."

  - question: "What is the education requirement for an esthetician license in Illinois?"
    answer: "Illinois requires only an 8th grade education, tied with Oregon and Connecticut for the lowest bar on the list. Illinois sets the minimum age at 16."

  - question: "What is the minimum age for an esthetician license in Texas?"
    answer: "Texas sets the minimum age at 17 and requires a high school diploma."

  - question: "Which states require a high school diploma for an esthetician license?"
    answer: "Twelve states require a full high school diploma: Montana, Rhode Island, South Dakota, Vermont, West Virginia, Wisconsin, Florida, Nebraska, New Jersey, Texas, Iowa, and North Dakota."

