  h1: "Esthetician License Requirements by State"

  quick_answer:
    - "Arizona sets the highest minimum age for an esthetician license at 23, five years above every other state on the list."
    - "Eighteen is the minimum age in eight states: Indiana, Montana, Nevada, Rhode Island, South Dakota, Vermont, West Virginia, and Wisconsin. Idaho sets the age at 16.5, the only state using a half-year threshold."
    - "Seven states, Connecticut, Iowa, Kentucky, Minnesota, New Hampshire, North Dakota, and Virginia, list no minimum age requirement for an esthetician license."

  methodology: "Minimum age and education requirements reflect state licensing boards as of 2026. North Carolina is not listed by the source, and this page is not legal advice."

