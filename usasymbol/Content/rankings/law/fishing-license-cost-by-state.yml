map:
  title: "Fishing License Cost by State Map"
  caption: "California tops the map at $174.14 for nonresidents, with Oregon at $138 and Colorado at $124.01. Delaware at $20 and Hawaii at $25 have the lowest nonresident prices."
  metric_key: nonresident_annual_fee
  metric_label: "Nonresident Annual ($)"
  tooltip_label: state
  color_scheme: orange
  color_scale: linear

sections:
  - id: "most-expensive-fishing-license-states"
    title: "Most Expensive Fishing License States"
    paragraphs:
      - "California charges nonresidents $174.14 for a 365-day sport fishing license, and its own residents pay $64.54, the highest resident price in the country. State law adjusts the fees for inflation every year, so the price keeps creeping up."
      - "Oregon is second at $138, Colorado third at $124.01 and Utah fourth at $120. Utah's nonresident price rose from $94 after a 2025 law let its wildlife division raise nonresident fees to fund land purchases. For where the fishing itself is best, see the [best states for fishing](/rankings/sports/best-states-for-fishing)."
    table:
      title: "Ten Most Expensive Nonresident Fishing Licenses"
      columns:
        rank: "Rank"
        state: "State"
        nonresident_annual_fee: "Nonresident Annual"
        resident_annual_fee: "Resident Annual"
      rows:
        - rank: 1
          state: "California"
          nonresident_annual_fee: "$174.14"
          resident_annual_fee: "$64.54"
        - rank: 2
          state: "Oregon"
          nonresident_annual_fee: "$138.00"
          resident_annual_fee: "$50.00"
        - rank: 3
          state: "Colorado"
          nonresident_annual_fee: "$124.01"
          resident_annual_fee: "$44.87"
        - rank: 4
          state: "Utah"
          nonresident_annual_fee: "$120.00"
          resident_annual_fee: "$40.00"
