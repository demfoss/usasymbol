faq:
  - question: "Which state has the most expensive fishing license?"
    answer: "California, at $174.14 a year for nonresidents. Oregon charges $138 and Colorado $124.01, so a visiting angler pays the most on the West Coast and in the Rockies."

  - question: "Which state has the cheapest fishing license for out-of-state anglers?"
    answer: "Delaware sells an annual nonresident license for $20. Hawaii is next at $25 and Illinois at $31.50."

  - question: "How much is a fishing license in Texas?"
    answer: "A Texas freshwater fishing package costs $30 for residents and $58 for nonresidents, which ranks Texas 30th. The package includes the freshwater endorsement and runs through Aug. 31."

  - question: "How much is a fishing license in Alaska?"
    answer: "Alaska charges $20 for residents and $100 for nonresidents. That ties Montana at the same nonresident price, and Alaska is listed ninth because its resident price is lower."

  - question: "How much is a fishing license in Florida?"
    answer: "Florida's freshwater license costs $17 for residents and $47 for nonresidents, ranking 43rd. Saltwater fishing needs a separate license."

  - question: "Do nonresidents always pay more for a fishing license?"
    answer: "Yes, in all 50 states ranked here. Massachusetts has the smallest gap at $10, while Maryland sets its nonresident price at $55 or whatever the angler's home state charges Maryland residents, whichever is greater."

