seo:
  title: "Fishing License Cost by State 2026 | Map & Rankings"
  description: "California charges nonresidents $174.14 a year to fish, the most of any state. Delaware is cheapest at $20, and Hawaii's resident license is $5."

page:
  h1: "Fishing License Cost by State 2026"

  quick_answer:
    - "California has the most expensive annual fishing license for nonresidents at $174.14, and its $64.54 resident license is the highest too, because the state adjusts its fees for inflation every year."
    - "Delaware charges out-of-state anglers just $20 a year, the lowest of any state. Hawaii has the cheapest resident license at $5, and it covers only freshwater game fish."
    - "Oregon follows California at $138 and Colorado is third at $124.01. Western states fill the top nine spots, and Tennessee at $98 is the first non-Western state, ahead of Nebraska at $95.50."

  methodology: "Annual adult resident and nonresident freshwater or inland fishing license fees from each state wildlife agency's 2026 fee schedule, before agent fees and trout, habitat or conservation stamps. Mississippi and Tennessee are approximate because neither sells a resident fishing-only annual license on its fee table. Tennessee uses its $33 resident Combo Hunt/Fish license and Mississippi uses the $10 resident small game hunting and freshwater fishing license, while both nonresident prices are annual fishing licenses. Rank 1 is the highest nonresident price, with ties ordered by resident price."

