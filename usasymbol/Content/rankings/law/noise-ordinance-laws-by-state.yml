faq:
  - question: "Which states have a statewide noise ordinance?"
    answer: "Eight states on this list set a specific statewide dBA limit: Colorado, Connecticut, Hawaii, Maryland, Minnesota, New Jersey, Oregon, and Washington. California, Delaware, Illinois, and Massachusetts have a statewide statute but measure violations against ambient sound or frequency bands instead of one flat number."

  - question: "Which states have no statewide noise law?"
    answer: "Florida, Georgia, Missouri, Texas, and Virginia have no statewide noise statute. Noise regulation in those five states is left entirely to city and county ordinances."

  - question: "What is the noise ordinance law in Texas?"
    answer: "Texas has no statewide noise ordinance. Its only statewide noise provision is a disorderly conduct statute that presumes a sound unreasonable above 85 dBA once a peace officer has issued a warning."

  - question: "Which state has the strictest statewide nighttime noise limit?"
    answer: "Connecticut, Hawaii, and Washington tie for the strictest statewide nighttime limit at 45 dBA. Maryland is the loosest of the states with a set number at 55 dBA."

  - question: "What is the noise limit in New Jersey?"
    answer: "New Jersey caps industrial, commercial, and community facility noise at 65 dBA during the day and 50 dBA at night, measured at a residential property line. Its daytime figure ties Maryland for the highest on this list."

  - question: "Does California have a statewide noise law?"
    answer: "California's Noise Control Act of 1973 sets statewide policy, but it does not set a specific decibel number. Local governments in California set their own limits under that statewide framework."

