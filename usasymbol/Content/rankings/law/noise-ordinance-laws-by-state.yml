sections:
  - id: "states-with-the-strictest-statewide-nighttime-noise-limits"
    icon: "fa-solid fa-volume-off"
    title: "States With the Strictest Statewide Nighttime Noise Limits"
    paragraphs:
      - "Connecticut, Hawaii, and Washington cap statewide residential nighttime noise at 45 dBA, the lowest figure among the states with a numeric standard. Colorado, Minnesota, and Oregon set their nighttime limit one step looser at 50 dBA."
      - "New Jersey also allows 50 dBA at night, but its 65 dBA daytime limit is the highest on this list, tied with Maryland. Maryland's nighttime limit of 55 dBA is the loosest of any state with a set number."

  - id: "states-with-no-statewide-noise-law"
    icon: "fa-solid fa-circle-question"
    title: "States With No Statewide Noise Law"
    paragraphs:
      - "Florida, Georgia, Missouri, Texas, and Virginia have no statewide noise statute at all, the only five states on this list that leave noise regulation entirely to city and county ordinances."
      - "Texas comes closest to a statewide number through its disorderly conduct statute, which presumes noise unreasonable above 85 dBA once a police officer has issued a warning. Virginia's state code goes no further than authorizing localities to cap civil fines at $250 for a first offense."

