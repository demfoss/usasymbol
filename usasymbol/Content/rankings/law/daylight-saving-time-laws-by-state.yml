faq:
  - question: "Does Arizona observe daylight saving time?"
    answer: "No. Arizona stays on standard time year-round, except for the Navajo Nation, which does observe daylight saving time."

  - question: "Do all US states observe daylight saving time?"
    answer: "No. Arizona and Hawaii do not observe daylight saving time. All other states currently follow the twice-yearly clock change."

  - question: "Which states have passed permanent daylight saving time laws?"
    answer: "Nineteen states have enacted laws for permanent daylight saving time: Alabama, Colorado, Delaware, Florida, Georgia, Idaho, Louisiana, Maine, Minnesota, Mississippi, Montana, Oklahoma, Oregon, South Carolina, Tennessee, Texas, Utah, Washington, and Wyoming. Florida's 2018 law was first; Texas's 2025 law is the most recent."

  - question: "Is permanent daylight saving time in effect anywhere in the US?"
    answer: "No. Federal law requires congressional authorization before any state can switch to permanent daylight saving time. The 19 states with enacted laws are waiting on that authorization before their laws take effect."

  - question: "Did California vote for permanent daylight saving time?"
    answer: "Yes. California voters approved Proposition 7 in 2018, but the state legislature has not passed the follow-up law needed to put it into effect."

  - question: "What is the most recent state to pass a permanent daylight saving time law?"
    answer: "Texas, in 2025. Oklahoma passed SB 1200 in 2024, and Colorado passed HB 1297 in 2022."

