page:
  h1: "Daylight Saving Time Laws by State"

  quick_answer:
    - "Nineteen states have enacted laws to adopt permanent daylight saving time, pending federal authorization: Alabama, Colorado, Delaware, Florida, Georgia, Idaho, Louisiana, Maine, Minnesota, Mississippi, Montana, Oklahoma, Oregon, South Carolina, Tennessee, Texas, Utah, Washington, and Wyoming."
    - "Arizona and Hawaii are the only two states that do not observe daylight saving time, staying on standard time year-round. Arizona's exemption excludes the Navajo Nation, which does observe daylight saving time."
    - "California voters approved Proposition 7 in 2018, authorizing the legislature to set permanent daylight saving time, but no follow-up law has passed since, unlike the 19 states with laws already on the books."

  methodology: "State status reflects laws and ballot measures on record with the National Conference of State Legislatures' Daylight Saving Time State Legislation tracker, checked in 2026. None of the permanent DST laws are currently in effect; federal law requires congressional authorization first."

  sources:
