sections:
  - id: "states-with-permanent-daylight-saving-time-laws"
    icon: "fa-solid fa-sun"
    title: "States With Permanent Daylight Saving Time Laws"
    paragraphs:
      - "Nineteen states have enacted laws to adopt daylight saving time year-round: Alabama, Colorado, Delaware, Florida, Georgia, Idaho, Louisiana, Maine, Minnesota, Mississippi, Montana, Oklahoma, Oregon, South Carolina, Tennessee, Texas, Utah, Washington, and Wyoming. None of these laws are in effect yet; each is written to take effect only if Congress authorizes states to observe permanent DST."
      - "Florida was first, enacting its law in 2018. Texas is the most recent, enacting its law in 2025. Oklahoma followed in 2024 with SB 1200, and Colorado enacted HB 1297 in 2022. Idaho's 2020 law and Oregon's 2019 law each apply only to the Pacific time zone portion of the state."

  - id: "states-that-dont-observe-daylight-saving-time"
    icon: "fa-solid fa-clock"
    title: "States That Don't Observe Daylight Saving Time"
    paragraphs:
      - "Arizona and Hawaii are the only two states that do not observe daylight saving time. Both stay on standard time all year. Arizona's exemption has one carve-out: the Navajo Nation, which spans parts of Arizona, does observe daylight saving time."
      - "Hawaii's exemption applies statewide, with no equivalent carve-out. Neither state has enacted a law seeking permanent DST, since both are already on permanent standard time."

  - id: "californias-ballot-measure-without-a-follow-up-law"
    icon: "fa-solid fa-landmark"
    title: "California's Ballot Measure Without a Follow-Up Law"
    paragraphs:
      - "California voters approved Proposition 7 in 2018, giving the state legislature authority to set permanent daylight saving time. The legislature has not passed the follow-up bill needed to activate that authority, leaving California in a different category from both the 19 enacted-law states and the states that have taken no action at all."

