faq:
  - question: "Which states allow assisted suicide?"
    answer: "Medical aid in dying is legal in 11 states and Washington, D.C.: California, Colorado, Delaware, Hawaii, Maine, Montana, New Jersey, New Mexico, Oregon, Vermont, and Washington."

  - question: "Is assisted suicide legal in Montana?"
    answer: "Yes, but Montana has no death with dignity statute. Medical aid in dying is legal there through a state Supreme Court ruling, so no minimum age or request procedure is set in law."

  - question: "What is the waiting period for assisted suicide in Oregon?"
    answer: "Oregon requires two oral requests at least 15 days apart and one written request witnessed by at least 2 individuals. The wait can be waived entirely if the patient is unlikely to survive it."

  - question: "What state has the shortest waiting period for medical aid in dying?"
    answer: "California and New Mexico have the shortest wait on record, 48 hours. Hawaii follows at 5 days."

  - question: "What state has the longest waiting period for medical aid in dying?"
    answer: "Maine has the longest wait on record at 17 days between the two oral requests, though up to 10 of those days can be waived if needed."

  - question: "Do assisted suicide laws require a witness?"
    answer: "Most jurisdictions with a set process require the written request to be witnessed by at least 2 individuals. New Jersey requires only 1 witness."

