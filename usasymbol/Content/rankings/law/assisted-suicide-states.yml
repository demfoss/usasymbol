page:
  h1: "Assisted Suicide States"

  quick_answer:
    - "Assisted suicide, also called medical aid in dying, is legal in 11 states and Washington, D.C. in 2026. All 12 jurisdictions require a terminal illness diagnosis, and every one requires the patient to self-administer the medication."
    - "Maine requires the longest waiting period among jurisdictions with a set process: 17 days between the two oral requests, though up to 10 of those days can be waived. California and New Mexico require the shortest wait, 48 hours."
    - "Montana is the only jurisdiction with no legal protocol at all. Medical aid in dying is legal there through a state Supreme Court ruling rather than a statute."

  methodology: "Legal status, minimum age, and waiting periods reflect each jurisdiction's medical aid in dying law on record as of 2026. This page is informational only and does not constitute legal or medical advice."

  sources:
    - name: "World Population Review. Assisted Suicide States"
      url: "https://worldpopulationreview.com/state-rankings/assisted-suicide-states"
      description: "State-by-state legal status, eligibility, request requirements, and administration method for medical aid in dying"

