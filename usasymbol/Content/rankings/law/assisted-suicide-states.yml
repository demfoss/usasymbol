sections:
  - id: "states-where-assisted-suicide-is-legal"
    icon: "fa-solid fa-scale-balanced"
    title: "States Where Assisted Suicide Is Legal"
    paragraphs:
      - "Medical aid in dying is legal in 11 states and Washington, D.C.: California, Colorado, Delaware, Hawaii, Maine, Montana, New Jersey, New Mexico, Oregon, Vermont, and Washington. Every jurisdiction requires a terminal illness diagnosis, a minimum age of 18 where a statute sets one, and self-administration of the prescribed medication."
      - "Montana stands apart from the other 11 jurisdictions. It has no death with dignity statute at all. Medical aid in dying is legal there only because of a state Supreme Court ruling, which is why it sets no minimum age or request procedure in law."

  - id: "waiting-period-before-a-prescription-can-be-written"
    icon: "fa-solid fa-hourglass-half"
    title: "Waiting Period Before a Prescription Can Be Written"
    table:
      columns:
        state: "State"
        wait: "Waiting Period"
      rows:
        - state: "California"
          wait: "48 hours"
        - state: "New Mexico"
          wait: "48 hours"
        - state: "Hawaii"
          wait: "5 days"
        - state: "Colorado"
          wait: "7 days"
        - state: "Washington"
          wait: "7 days"
        - state: "Delaware"
          wait: "15 days"
        - state: "District of Columbia"
          wait: "15 days"
        - state: "New Jersey"
          wait: "15 days"
        - state: "Oregon"
          wait: "15 days"
        - state: "Vermont"
          wait: "15 days"
        - state: "Maine"
          wait: "17 days"
    paragraphs:
      - "Maine requires the longest waiting period on record, 17 days between the two oral requests, though up to 10 of those days can be waived if needed. California and New Mexico require the shortest wait, 48 hours, before a prescription can be filled."
      - "Five jurisdictions, Delaware, Washington D.C., New Jersey, Oregon, and Vermont, share the most common waiting period on record at 15 days. Colorado, Hawaii, Oregon, and Vermont all allow the wait to be waived entirely if the patient is unlikely to survive it."

