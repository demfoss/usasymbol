faq:
  - question: "Which state has the most weird laws per capita?"
    answer: "South Dakota ranks first at 6.36 documented weird laws per million residents, based on 6 listed laws and a population under a million. Alaska is second at 5.42 per million."

  - question: "Which state has the most weird laws?"
    answer: "South Dakota has the highest raw count in this ranking at 6 documented laws. Massachusetts is next with 5, and sixteen states are tied at 4."

  - question: "What is the weird law count in California?"
    answer: "California has 4 documented weird laws, tied with 15 other states for raw count. Its rate is the lowest in the table at 0.10 per million, a result of its 39.3 million population."

  - question: "Which state has the fewest weird laws per capita?"
    answer: "California ranks last at 0.10 per million residents. Texas is 49th at 0.12, and Florida is 48th at 0.13."

  - question: "Which state has the fewest documented weird laws?"
    answer: "New Mexico has just 1 documented weird law, the fewest in this ranking. Its rate is 0.47 per million, which ranks 34th, higher than many states with more laws on the books."

  - question: "Why does South Dakota rank first in weird laws per capita?"
    answer: "South Dakota's 6 documented laws divide across a population of under a million, producing the highest rate in the table at 6.36 per million. States with similar or higher raw counts, like California's 4, rank near the bottom because their populations are tens of millions larger."

