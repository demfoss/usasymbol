sections:
  - id: "states-with-the-most-weird-laws-per-capita"
    icon: "fa-solid fa-chart-line"
    title: "States With the Most Weird Laws per Capita"
    paragraphs:
      - "South Dakota leads at 6.36 documented weird laws per million residents, built on 6 listed laws and a population near 943,000. Alaska is second at 5.42 with 4 laws, and Wyoming is third at 5.08, also with 4."
      - "Vermont ranks fourth at 4.67 per million with 3 laws, and North Dakota is fifth at 3.73 with 3. All five top-ranked states have populations under 1.2 million."

  - id: "states-with-the-most-documented-weird-laws"
    icon: "fa-solid fa-gavel"
    title: "States With the Most Documented Weird Laws"
    paragraphs:
      - "South Dakota also has the highest raw count in this ranking at 6 documented laws. Massachusetts follows with 5, including its ban on exploding golf balls."
      - "Sixteen states are tied for the next-highest raw count at 4 laws each, among them Alabama, Alaska, California, Georgia, and Texas. Only New Mexico has fewer, with a single documented law."

  - id: "why-big-states-rank-low-per-capita"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Why Big States Rank Low per Capita"
    paragraphs:
      - "California has 4 documented weird laws, tied with 15 other states, but its population of 39.3 million produces the lowest rate in the table at 0.10 per million. Texas ranks 49th at 0.12 despite the same raw count of 4."
      - "Pennsylvania and New York both post 0.15 per million with only 2 and 3 laws on record. Population size, not the law count itself, drives the rate down this far in the ranking."

