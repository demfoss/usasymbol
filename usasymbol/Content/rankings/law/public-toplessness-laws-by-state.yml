page:
  h1: "Public Toplessness Laws by State"

  quick_answer:
    - "Public toplessness laws by state are green in 34 states on this map. New York, Utah, Wyoming, Colorado, Kansas, and New Mexico are in that group."
    - "Indiana and Tennessee are the clearest red states. Both state-law sources treat exposure of the female breast as public nudity or indecent exposure."
    - "14 states stay yellow because state law, federal precedent, or city ordinances still collide. Arizona, Florida, Maryland, Oklahoma, Virginia, and Washington are in that group."

  methodology: "This page starts with the provided 2026 state list, then checks the major outliers against primary court decisions and statutes. Utah is treated as green because the Tenth Circuit's 2019 Free the Nipple decision created the strongest federal precedent in that circuit, even though the provided list notes conflicting state-law language."

  sources:
    - name: "Tenth Circuit. Free the Nipple v. City of Fort Collins, No. 17-1103"
      url: "https://www.ca10.uscourts.gov/opinion/17-1103"
      description: "Official 2019 Tenth Circuit opinion on equal-protection limits for female-toplessness bans"
    - name: "GovInfo. USCOURTS-ca10-17-01103"
      url: "https://www.govinfo.gov/app/details/USCOURTS-ca10-17-01103/USCOURTS-ca10-17-01103-0"
      description: "Federal docket record for the Fort Collins opinion"
    - name: "People v. Santorelli, New York Court of Appeals"
      url: "https://law.justia.com/cases/new-york/court-of-appeals/2000/95-n-y-2d-412-0.html"
      description: "New York topfree precedent under equal-protection analysis"
    - name: "Indiana Code § 35-45-4-1"
      url: "https://law.justia.com/codes/indiana/title-35/article-45/chapter-4/section-35-45-4-1/"
      description: "Indiana public indecency statute defining nudity to include the female breast"
    - name: "Tennessee Code § 39-13-511"
      url: "https://law.justia.com/codes/tennessee/title-39/chapter-13/part-5/section-39-13-511/"
      description: "Tennessee indecent-exposure statute that expressly includes female breasts"
    - name: "The People &c. v. Ramona Santorelli and Others"
      url: "https://www.law.cornell.edu/nyctap/I92_0160.htm"
      description: "Cornell transcription of the New York toplessness case discussing the statute's gender-based classification"
    - name: "Bowling Green v. Bourne, Ohio Sixth District Court of Appeals"
      url: "https://law.justia.com/cases/ohio/sixth-district-court-of-appeals/2007/2007-ohio-5748.html"
      description: "Ohio toplessness precedent used in the current source set"

