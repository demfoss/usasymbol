  description: "Thirteen states treat Election Day as a holiday in 2026. Hawaii, Illinois, Maryland, New York and West Virginia also require paid voting leave."
page:
  h1: "Election Day Holiday States"
  quick_answer:
    - "Election day holiday states include Hawaii, Illinois, Maryland, New York and West Virginia, which pair the public holiday with a legal right to paid time off to vote. Eight more states have the holiday without that right."
    - "Virginia made Election Day a state holiday in 2020 and dropped Lee-Jackson Day from the calendar to keep the number of state holidays unchanged."
    - "Kentucky treats only presidential election years as a holiday, so November 3, 2026 is an ordinary workday for state employees. Connecticut and Ohio do not treat Election Day as a holiday at all."
  methodology: "Checked October 2026 using the Movement Advancement Project, official Maryland, Indiana and Kentucky state holiday calendars and Wikipedia. Code 3 is a holiday plus required paid voting leave, 2 a holiday only, and 1 a holiday in presidential years only. The other 36 states are not listed."
