  - id: election-day-holiday-and-paid-time-off-to-vote
    icon: "fa-solid fa-clock"
    title: "Election Day Holiday and Paid Time Off to Vote"
    paragraphs:
      - "Hawaii, Illinois, Maryland, New York and West Virginia rank first because a worker in those states has both the holiday and a legal claim to paid time to vote. The details are in the [time off to vote laws](/rankings/law/time-off-to-vote-laws-by-state), where Maryland and New York protect up to 2 paid hours and West Virginia up to 3."
      - "The other eight holiday states, including Montana and Rhode Island, close offices but do not require private employers to pay for voting time. Turnout is the reason reformers push the idea, and the [voter turnout](/rankings/government/voter-turnout-by-state) page shows how widely it varies."
  - id: states-considering-an-election-day-holiday
    icon: "fa-solid fa-scroll"
    title: "States Considering an Election Day Holiday"
    paragraphs:
      - "Kentucky's holiday applies only to presidential elections, so state employees there have no extra day off on November 3, 2026. Utah has tried twice, and its House rejected a 2026 bill that would have made Election Day a state holiday by a vote of 33 to 39."
      - "Ohio lawmakers proposed a holiday bill in January 2026, and a Massachusetts bill to give state and municipal employees the day off has not advanced. No federal law makes Election Day a national holiday."
