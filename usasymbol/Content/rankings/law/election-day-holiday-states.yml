sections:
  - id: states-where-election-day-is-a-holiday
    icon: "fa-solid fa-calendar-day"
    title: "States Where Election Day Is a Holiday"
    paragraphs:
      - "Virginia added its holiday in 2020, when Governor Ralph Northam signed a law that also removed Lee-Jackson Day from the calendar so the total number of state holidays did not change. Indiana, Maryland and Michigan list Tuesday, November 3, 2026 on their state employee calendars, and New Jersey, New York and Virginia close state offices."
      - "In most of these states the holiday applies to government offices, and private employers are not required to close. A holiday does not guarantee a paid hour at the polls for a private worker, which is why paid voting leave matters separately."
