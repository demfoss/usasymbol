faq:
  - question: "Which states have Election Day as a holiday?"
    answer: "Delaware, Hawaii, Illinois, Indiana, Louisiana, Maryland, Michigan, Montana, New Jersey, New York, Rhode Island, Virginia and West Virginia treat the November general election as a public holiday. Kentucky does so only in presidential election years."
  - question: "Is Election Day a holiday in Virginia?"
    answer: "Yes. Governor Northam signed the law in April 2020, and Virginia dropped Lee-Jackson Day so the number of state holidays stayed the same."
  - question: "Is Election Day a holiday in Connecticut?"
    answer: "No. Connecticut does not treat Election Day as a public holiday, and neither does Ohio, where lawmakers proposed a holiday bill in 2026."
  - question: "Is Election Day a federal holiday?"
    answer: "No. Congress has seen bills to create one, including the Election Day Holiday Act of 2024, but none has become law. Federal offices stay open."
  - question: "Do employers have to close on Election Day in a holiday state?"
    answer: "No. The state holiday covers government offices, not private businesses. Hawaii, Illinois, Maryland, New York and West Virginia go further and require paid time off to vote."
  - question: "Is Election Day 2026 a state holiday in Kentucky?"
    answer: "No. Kentucky's Personnel Cabinet lists no Election Day holiday in 2026 and adds extra holiday time only in presidential election years."
  - question: "Why is Election Day on a Tuesday?"
    answer: "Congress set it in 1845 as the Tuesday after the first Monday in November. Farmers needed a day to travel to the county seat after Sunday, and they wanted to avoid Wednesday market day."
