seo:
  title: "Pets in Hot Cars Laws by State | Map & Rescue Rules"
  description: "Thirty-two states have laws on pets left in hot cars. In 14, including California, Florida, and Tennessee, any person may break in to save the animal."

page:
  h1: "Pets in Hot Cars Laws by State"

  quick_answer:
    - "Pets in hot cars laws exist in 32 states. Fourteen of them, including California, Florida, Ohio, and Tennessee, protect any person who breaks a window to rescue a suffering animal."
    - "Seventeen states, among them New York, Pennsylvania, and Virginia, let only police, firefighters, or animal control officers break in. A bystander there should call 911 and wait."
    - "Eighteen states, Texas and Michigan among them, have no hot car law for animals. Leaving a pet to suffer can still be charged under general animal cruelty laws."

  methodology: "Status reflects state statutes on animals confined in parked vehicles, as compiled by the Animal Legal & Historical Center (2025). Local ordinances can add rules. Informational only, not legal advice."

  sources:
    - name: "Animal Legal & Historical Center, Table of State Laws That Protect Animals Left in Parked Vehicles"
      url: "https://www.animallaw.info/topic/table-state-laws-protect-animals-left-parked-vehicles"
      description: "State-by-state statutes on animals left in vehicles and who may rescue them"
    - name: "California Civil Code § 43.100"
      url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=43.100"
      description: "California's civil immunity for people who rescue an animal from a vehicle"

