sections:
  - id: "where-you-can-break-a-car-window-for-a-dog"
    icon: "fa-solid fa-dog"
    title: "Where You Can Break a Car Window for a Dog"
    paragraphs:
      - "Arizona, California, Colorado, Connecticut, Florida, Indiana, Kansas, Louisiana, Massachusetts, Ohio, Oregon, Tennessee, Vermont, and Wisconsin protect a bystander who breaks into a car to save an animal. Tennessee led the way in 2015, a year after it passed a similar law for children."
      - "The protection comes with conditions. In most of these states the rescuer must believe the animal is in danger, check that the doors are locked, call 911 or the police first, use no more force than needed, and stay with the animal until help arrives."

  - id: "why-a-parked-car-gets-so-hot"
    icon: "fa-solid fa-temperature-high"
    title: "Why a Parked Car Gets So Hot"
    paragraphs:
      - "Sunlight passes through the windows and heats the dashboard and seats, which then warm the trapped air. The glass keeps that heat inside, so a closed car turns into a greenhouse within minutes, even on a mild spring day."
      - "Dogs suffer faster than people because they cool off mainly by panting, not sweating. Cracking a window barely helps. Short-nosed breeds such as bulldogs and pugs struggle most, which is why many of the [most popular dog breeds](/rankings/culture/most-popular-dog-breed-by-state) need extra care in summer."

  - id: "states-with-no-hot-car-law-for-pets"
    icon: "fa-solid fa-scale-balanced"
    title: "States With No Hot Car Law for Pets"
    paragraphs:
      - "Alabama, Texas, Michigan, and fifteen other states have no law aimed at animals left in vehicles. Several of them, including Texas, Hawaii, Mississippi, and Alabama, rank among the [hottest states in the U.S.](/rankings/geography/hottest-states-in-the-us)"
      - "A missing hot car law does not make the act legal. Every state has an animal cruelty law, and prosecutors can use it against an owner whose pet suffers or dies in a hot car."

