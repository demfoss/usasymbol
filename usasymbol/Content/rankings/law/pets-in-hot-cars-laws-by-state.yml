faq:
  - question: "Can you break a car window to save a dog in California?"
    answer: "Yes. California protects a rescuer who calls 911 first, believes the animal is in danger, uses no more force than needed, and stays with the animal until officers arrive."

  - question: "Is it illegal to leave a dog in a hot car in Texas?"
    answer: "Texas has no law aimed at pets in hot cars. An owner can still face charges under the state's animal cruelty law if the animal suffers."

  - question: "Which states let anyone rescue a pet from a hot car?"
    answer: "Arizona, California, Colorado, Connecticut, Florida, Indiana, Kansas, Louisiana, Massachusetts, Ohio, Oregon, Tennessee, Vermont, and Wisconsin."

  - question: "Can you break a car window to save a dog in New York?"
    answer: "No. New York allows only police and peace officers to break into a car to save an animal. A bystander should call 911."

  - question: "Is it legal to break a car window to save a dog in Florida?"
    answer: "Yes. Florida protects a person who checks that the car is locked, calls law enforcement first, and uses no more force than needed."

  - question: "What should you do if you see a dog in a hot car?"
    answer: "Call 911 or local animal control and note the car's plate and location. Break in only if your state allows it and the animal is in clear danger, and the same caution applies to a child left alone, a topic covered in [home alone age laws](/rankings/law/age-a-child-can-be-left-home-alone-by-state)."

