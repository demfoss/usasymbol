sections:
  - id: states-with-the-longest-early-voting
    icon: "fa-solid fa-calendar-plus"
    title: "States With the Longest Early Voting"
    paragraphs:
      - "Minnesota and South Dakota open 46 days before Election Day, and Vermont and Virginia follow at 45. The number is no accident. The federal MOVE Act requires states to send ballots to military and overseas voters 45 days ahead, so ballots exist that early and several states let any voter cast one at a county office."
      - "Minnesota adopted no-excuse absentee voting in 2014, which made its in-person absentee window a de facto early voting season. Illinois sits at 40 days and Maine, Montana and Nebraska at 30."
