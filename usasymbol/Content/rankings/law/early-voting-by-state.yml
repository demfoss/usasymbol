  title: "Early Voting by State | Map & Start Dates"
  description: "Minnesota and South Dakota open early voting 46 days before Election Day. Kentucky opens 5 days out, and five states have no in-person early voting."
page:
  h1: "Early Voting by State"
  quick_answer:
    - "Early voting opens earliest in Minnesota and South Dakota, 46 days before Election Day. That is one day ahead of the federal deadline for mailing ballots to military and overseas voters."
    - "Kentucky opens just 5 days before Election Day, a Thursday-to-Saturday window that dates only to 2022. Alabama, Mississippi, New Hampshire, Oregon and Pennsylvania have no dedicated in-person early voting."
    - "Oregon needs no early polling places because every voter receives a mailed ballot weeks in advance. Pennsylvania lets voters request and cast a mail ballot at a county office, but it has no separate early voting period."
  methodology: "Earliest opening day allowed by state law for the November 3, 2026 general election, counted in days before Election Day, checked October 2026 against a national early voting calendar and state election calendars. Counties may open later or add days. Five states are unranked."
