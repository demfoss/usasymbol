  - id: states-with-the-shortest-early-voting
    icon: "fa-solid fa-hourglass-end"
    title: "States With the Shortest Early Voting"
    paragraphs:
      - "Kentucky opens 5 days before Election Day and Oklahoma 6. Kentucky voters had no early in-person option at all until a 2022 law created three days of voting from Thursday to Saturday before the election."
      - "Delaware, Michigan, New Jersey and New York each open 10 days out. Delaware held its first early voting in 2022, and Michigan voters approved a 2022 constitutional amendment that guaranteed at least nine days."
    table:
      columns:
        state: "State"
