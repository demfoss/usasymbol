        - { state: "Louisiana", days: 14 }
  - id: states-with-no-in-person-early-voting
    icon: "fa-solid fa-ban"
    title: "States With No In-Person Early Voting"
    paragraphs:
      - "Alabama, Mississippi and New Hampshire require an excuse to vote ahead of Election Day, and Mississippi limits its in-person absentee voting to voters who qualify. Oregon has no early polling places because every registered voter is mailed a ballot, a system explained in [mail-in voting by state](/rankings/law/mail-in-voting-by-state)."
      - "Pennsylvania took a different path. A 2019 law let any voter request a mail ballot, and many counties let applicants fill it out on the spot at the election office. That works like early voting, but the state has no separate early voting period."
  - id: recent-early-voting-changes
    icon: "fa-solid fa-landmark"
    title: "Recent Early Voting Changes"
    paragraphs:
      - "Connecticut was among the last states to start. Voters approved an amendment in 2022, and the state used early voting in a general election for the first time in 2024, opening 15 days before this year's election."
      - "California changed its rules in 2025. Counties can now open 29 days before an election, and statewide elections must include at least six hours on one Saturday. Before then, state law set no start date for early voting."
