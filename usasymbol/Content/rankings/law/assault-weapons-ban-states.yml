faq:
  - question: Which state first banned assault weapons?
    answer: "California enacted the first comprehensive state assault-weapons law in 1989. Later amendments expanded the original named-firearm approach through additional statutory definitions."
  - question: Does Washington's assault weapons ban prohibit existing ownership?
    answer: "Washington's 2023 ban does not generally prohibit possession of an existing assault weapon. It restricts specified transactions, including sales, manufacture, and import, subject to statutory exceptions."
  - question: When did Rhode Island's assault weapons ban take effect?
    answer: "Rhode Island's statute specifies July 1, 2026 as its effective date. Its 2025 enactment preserves lawful existing possession and provides limited transfer exceptions."
  - question: Is Virginia's assault weapons ban fully enforceable?
    answer: "Virginia's 2026 law has faced an injunction against State Police implementation and enforcement. The official August 21 update confirms stayed litigation, so the statute's July 1 effective date alone does not establish unrestricted enforcement."
  - question: Was New Jersey's assault weapons ban overturned?
    answer: "A July 17, 2026 appellate opinion held New Jersey's semiautomatic-rifle prohibition unconstitutional. Other covered firearm categories were remanded for further proceedings. That decision does not by itself resolve later stays or every remaining gun restriction."
  - question: Does Delaware require an assault weapon possession certificate?
    answer: "Delaware's certificate is voluntary evidence of qualifying ownership or a completed purchase before June 30, 2022. A qualifying owner does not have to obtain the certificate solely to rely on that ownership exception."
