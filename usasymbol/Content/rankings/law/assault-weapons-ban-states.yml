  description: California enacted its assault-weapons law in 1989. Rhode Island followed in 2025 and Virginia in 2026. Court rulings affect New Jersey and Virginia.
page:
  h1: Assault Weapons Ban States
  quick_answer:
    - "Assault weapons ban states include California, whose 1989 law is the earliest comprehensive state ban. Mass shootings, including an attack at a California school, prompted legislation naming prohibited firearms and restricting civilian acquisition."
    - "Virginia has the latest enactment in 2026. Its law targets future transactions while preserving specified preexisting ownership, but enforcement has faced injunctions and the court cases were stayed in August 2026."
    - "New Jersey enacted its ban in 1990, but a July 2026 appellate ruling held the semiautomatic-rifle prohibition unconstitutional. Rhode Island's 2025 law reached its statutory effective date on July 1, 2026."
  methodology: "State laws and court records checked October 8, 2026. Rank and map use first comprehensive-ban enactment year, including challenged laws and excluding Hawaii's pistol-only ban, Colorado's training-based purchase rules, local bans, and DC."
