sections:
  - id: first-state-assault-weapons-ban
    icon: fa-solid fa-calendar
    title: First State Assault Weapons Ban
    paragraphs:
      - "California ranks earliest because its 1989 law followed mass shootings, including an attack on a school. The original legislation named prohibited firearms, while later measures extended the law through definitions based on firearm features. That history explains why California's ban is older than the feature tests commonly discussed today."
      - "Virginia ranks latest because its 2026 legislation focuses on stopping future transactions while preserving specified preexisting ownership. The statute includes exceptions for activities such as gunsmith repairs and qualifying inheritance. Those exceptions describe how the new law was designed, while injunctions address whether officials may enforce it during the litigation."
  - id: assault-weapons-ban-ownership-exceptions
    icon: fa-solid fa-file-signature
    title: Assault Weapons Ban Ownership Exceptions
    paragraphs:
      - "Washington's 2023 law prohibits new sales, manufacture, and import while leaving existing possession outside its general ban. Rhode Island's 2025 law similarly preserves lawful existing ownership and permits specified transfers to dealers or lawful out-of-state recipients. A sales prohibition therefore does not automatically order every existing owner to surrender the firearm."
      - "Delaware offers a voluntary possession certificate as evidence that a firearm qualifies for its pre-June 2022 ownership exception. Illinois instead required qualifying prior owners to submit an endorsement affidavit after its January 2023 law. The same practical question, proving an existing firearm qualifies, has different paperwork in the two states."
    table:
      columns:
        state: State
        ownership: Existing Ownership Provision
      rows:
        - state: Washington
          ownership: General ban does not prohibit existing possession
        - state: Rhode Island
          ownership: Lawful prior possession retained
        - state: Delaware
          ownership: Voluntary certificate can establish qualifying prior ownership
        - state: Illinois
          ownership: Qualifying prior owners submit an endorsement affidavit
  - id: assault-weapons-ban-court-challenges
    icon: fa-solid fa-gavel
    title: Assault Weapons Ban Court Challenges
    paragraphs:
      - "New Jersey's 1990 law received a major adverse ruling in July 2026. The appellate opinion held its semiautomatic-rifle prohibition unconstitutional and returned questions about other firearm categories to the lower court. The ruling addresses particular statutory provisions, rather than erasing every New Jersey firearms requirement."
      - "Virginia's 2026 statute reached a different procedural position. A June injunction paused implementation and enforcement by State Police, and an August statement confirmed that multiple challenges were stayed while related Supreme Court cases proceed. A stay of a case pauses litigation, so it must not be confused with a final decision approving or invalidating the statute."
