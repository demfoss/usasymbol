  description: "Twenty-one states have meal break laws for adult workers, and six require a paid 10-minute rest break every 4 hours. Federal law requires neither."

page:
  h1: "Meal and Rest Break Laws by State"

  quick_answer:
    - "Meal and rest break laws by state start earliest in Maryland, where large retail stores owe a 15-minute break after 4 hours. California, Colorado, New Hampshire, North Dakota, and Washington require 30 minutes after 5 hours."
    - "Twenty-nine states, including Texas, Florida, and Pennsylvania, have no general meal break law for adults. Federal law requires no breaks either, so a boss there can schedule an 8-hour shift with no lunch."
    - "Paid rest breaks are rarer still. California, Colorado, Kentucky, Nevada, Oregon, and Washington require a paid 10-minute break for every 4 hours worked."

  methodology: "Meal and rest break rules for adult private-sector workers from the U.S. Department of Labor state tables dated January 1, 2023. Meal Break After is the shift length that first triggers a meal break. DC and territories are excluded."

