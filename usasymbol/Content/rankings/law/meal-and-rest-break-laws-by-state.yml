faq:
  - question: "Are breaks required by federal law?"
    answer: "No. Federal law requires no meal or rest breaks for adult workers, so the rule depends on the state. Short breaks of 5 to 20 minutes that an employer does give must be paid."

  - question: "Is a lunch break required by law in Texas?"
    answer: "No. Texas has no meal or rest break law for adults, so a lunch break is up to the employer."

  - question: "What are the meal and rest break laws in California?"
    answer: "California requires a 30-minute meal break once a shift passes 5 hours, a second one after 10 hours, and a paid 10-minute rest break for every 4 hours. A missed break costs the employer an extra hour of the worker's pay."

  - question: "How long can you work without a break in New York?"
    answer: "Six hours. New York requires a 30-minute meal break for shifts longer than 6 hours that run over the noon hour, and factory workers get a full hour."

  - question: "Which states require paid rest breaks?"
    answer: "California, Colorado, Kentucky, Nevada, Oregon, and Washington require a paid 10-minute rest break every 4 hours. Minnesota requires paid restroom time in each 4 hours, while Illinois limits its paid breaks to hotel room attendants."

  - question: "How many hours can you work without a break in Washington?"
    answer: "Washington workers get a 30-minute meal break for shifts over 5 hours and may not go more than 3 hours without a paid rest break. Farm workers have a separate rule with the same 10-minute rest break."

  - question: "Do you get paid for a lunch break?"
    answer: "Usually not. A meal break of 30 minutes or more is unpaid under federal rules if the worker is fully relieved of duty. States such as California and Colorado count it as paid work time when the job keeps the worker on duty."

  - question: "Do states with meal break laws also have more unions?"
    answer: "Several do. California, Washington, New York, and Oregon require meal breaks and also rank high in [union membership by state](/rankings/economy/union-membership-rate-by-state), while most states with no break law are [right-to-work states](/rankings/law/right-to-work-states)."

