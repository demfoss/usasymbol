sections:
  - id: "why-maryland-requires-the-earliest-meal-break"
    icon: "fa-solid fa-utensils"
    title: "Why Maryland Requires the Earliest Meal Break"
    paragraphs:
      - "Maryland is the only state that owes a meal break after just 4 hours. Its law uses a sliding scale written for store clerks on long shifts, with 15 minutes after 4 hours, 30 minutes after 6, and another 15 for every 4 hours past 8."
      - "The catch is coverage. Only retail stores with at least 50 retail employees must follow it, and restaurants and wholesalers are left out. A cashier at a big chain gets the break, while a cook down the street does not."
      - "Minnesota, Nebraska, and Nevada wait the longest, until 8 hours. Nebraska's rule reads like an old factory law. It covers only assembly plants, workshops, and mechanical establishments, and it still says the half-hour lunch is taken off the premises."

  - id: "states-that-require-paid-rest-breaks"
    icon: "fa-solid fa-mug-hot"
    title: "States That Require Paid Rest Breaks"
    paragraphs:
      - "California, Colorado, Kentucky, Nevada, Oregon, and Washington require a paid 10-minute rest break for every 4 hours worked. Minnesota pays for a restroom break in each 4 hours, and Illinois guarantees two paid 15-minute breaks only to hotel room attendants in Cook County."
      - "California enforces its rule hardest. An employer that skips a required meal or rest break owes the worker an extra hour of pay for that day, and workers also get paid cool-down breaks to prevent heat illness."
    table:
      columns:
        state: "State"
        rest: "Paid Rest Break"
        meal: "Meal Break"
      rows:
        - state: "California"
          rest: "10 min per 4 hours"
