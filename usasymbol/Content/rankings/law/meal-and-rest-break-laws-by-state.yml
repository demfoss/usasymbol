          meal: "Time to eat after 8 hours"

  - id: "states-with-no-meal-break-law"
    icon: "fa-solid fa-map"
    title: "States With No Meal Break Law"
    paragraphs:
      - "Twenty-nine states, including Texas, Florida, Georgia, Ohio, and Pennsylvania, have no general meal break law for adults. Federal law fills no gap here. It requires no breaks at all, though short breaks an employer chooses to give must be paid, and a lunch of 30 minutes or more usually is not."
      - "Many of these states still protect teenagers. Florida, for example, requires a 30-minute break for workers under 18 after 4 hours. Pay rules differ just as much, as the [minimum wage by state](/rankings/economy/minimum-wage-by-state) shows."

  - id: "shortest-meal-break-length-by-state"
    icon: "fa-solid fa-clock"
    title: "Shortest Meal Break Length by State"
    paragraphs:
      - "Maryland's first break is the shortest at 15 minutes. Illinois, Rhode Island, and West Virginia set 20 minutes, and most other states with a law settle on a half hour."
      - "New York goes the other way. Factory workers there get a full hour at midday, double the usual half hour. Workers who start before 11 a.m. and stay past 7 p.m. also get 20 more minutes between 5 and 7 p.m."
