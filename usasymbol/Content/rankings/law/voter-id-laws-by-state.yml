sections:
  - id: why-some-states-require-strict-photo-id
    icon: "fa-solid fa-id-card"
    title: "Why Some States Require Strict Photo ID"
    paragraphs:
      - "Indiana set the template for strict photo ID. Its 2005 law was upheld by the U.S. Supreme Court in 2008 in Crawford v. Marion County Election Board, which gave other legislatures a tested model. Georgia, Kansas, Mississippi and Tennessee passed photo laws by 2011."
      - "Wisconsin and North Carolina wrote the rule into their constitutions. North Carolina voters approved it in 2018, and courts held up enforcement until the state Supreme Court reinstated the law in 2023. Wisconsin voters confirmed its rule in April 2025."
  - id: strict-non-photo-id-states
    icon: "fa-solid fa-file-lines"
    title: "Strict Non-Photo ID States"
    paragraphs:
      - "Arizona, North Dakota and Wyoming require identification but accept documents without a photo. Arizona voters approved the rule in 2004, and a voter there can show one photo ID or two documents such as a utility bill and a bank statement."
      - "North Dakota is the only state with no voter registration, so the ID is its main check and must show a current street address. That rule led to a long lawsuit by Native American voters whose tribal IDs listed only a P.O. box. Wyoming also accepts concealed carry permits."
  - id: voter-id-law-changes-since-2022
    icon: "fa-solid fa-clock-rotate-left"
    title: "Voter ID Law Changes Since 2022"
    paragraphs:
      - "West Virginia is the newest photo ID state. A law signed in 2025 replaced one that let voters use non-photo documents, and it first applied statewide in the May 2026 primary. Ohio made the same jump from non-photo to photo after the 2022 midterms."
      - "Several states trimmed their accepted lists instead. Indiana stopped accepting school IDs in 2025, New Hampshire dropped student IDs in 2026, and Louisiana will remove its affidavit option in 2027."
    table:
      columns:
        state: "State"
        change: "Change"
        year: "Year"
      rows:
