faq:
  - question: "What is the difference between strict and non-strict voter ID?"
    answer: "In a strict state, a voter without ID casts a provisional ballot that counts only after the voter brings ID to election officials. Wisconsin gives voters until 4 p.m. on the Friday after the election. In a non-strict state, an affidavit or a poll worker's confirmation lets the vote count with no return trip."
  - question: "Do you need a photo ID to vote in Texas?"
    answer: "Texas asks for photo ID, but it is a non-strict state. A voter with a reasonable impediment can sign a declaration and present a supporting document such as a utility bill or bank statement."
  - question: "Do you need ID to vote in California?"
    answer: "No, California does not request ID from returning voters. A 2024 law also bars cities and counties from creating their own voter ID rules."
  - question: "Is voter ID required in North Dakota?"
    answer: "Yes. North Dakota requires ID showing name, date of birth and a current residential street address, and a voter without it casts a provisional ballot. Because the state has no voter registration, the ID is the main way officials confirm who may vote."
  - question: "Can you use a digital ID to vote?"
    answer: "It depends on the state. Colorado has accepted state-sanctioned digital IDs since 2023, while Tennessee prohibits them and Georgia requires a physical ID. Alabama's ban on digital IDs takes effect on October 1, 2026."
  - question: "Can a student ID be used to vote?"
    answer: "Rules vary widely. West Virginia accepts a student ID with a photo, and Montana allows certain photo IDs from its university system. Idaho removed student IDs in 2023, and Indiana and New Hampshire followed in 2025 and 2026."
