seo:
  title: "Voter ID Laws by State | Map & Requirements"
  description: "Nine states require strict photo ID at the polls. Fourteen states ask for no ID from returning voters, and West Virginia added a photo rule in 2025."
page:
  h1: "Voter ID Laws by State"
  quick_answer:
    - "Voter ID laws are strictest in nine states, Arkansas, Georgia, Indiana, Kansas, Mississippi, North Carolina, Ohio, Tennessee and Wisconsin. They sit at level 5, where a voter without photo ID casts a provisional ballot and must return with ID."
    - "California, Hawaii, Illinois and eleven other states sit at level 1 and ask for no ID from returning voters at the polls. Oregon needs none at all because every ballot goes out by mail."
    - "West Virginia moved up in 2025, when a photo ID rule replaced a law that accepted non-photo documents. A voter without ID can still vote if a poll worker knows them or another registered voter signs an affidavit."
  methodology: "Categories follow the National Conference of State Legislatures classification as republished by GovFacts and Wikipedia, checked October 2026 against state announcements and news coverage of 2025 and 2026 changes. All 50 states are included."
