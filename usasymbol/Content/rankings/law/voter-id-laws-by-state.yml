  - id: states-without-a-voter-id-requirement
    icon: "fa-solid fa-user-check"
    title: "States Without a Voter ID Requirement"
    paragraphs:
      - "Fourteen states, including California, Hawaii, Illinois and New York, do not ask returning voters for ID. Poll workers match the voter against the registration list, and a first-time voter who registered by mail may still need identification under federal law."
      - "Oregon needs no ID at a counter because every registered voter receives a ballot at home, a system covered in [mail-in voting by state](/rankings/law/mail-in-voting-by-state). Pennsylvania asks only first-time voters at a polling place for ID, and a utility bill is enough."
