faq:
  - question: "Which states have paid family leave?"
    answer: "California, Colorado, Connecticut, Delaware, Maine, Massachusetts, Minnesota, New Jersey, New York, Oregon, Rhode Island, and Washington have mandatory programs paying benefits. Maryland and Virginia have enacted future programs, while New Hampshire and Vermont offer voluntary insurance."
  - question: "How long is paid family leave in New York?"
    answer: "New York provides up to 12 weeks of paid family leave for eligible workers. Bonding leave can cover a new child's arrival, and separate eligibility rules determine whether a particular employee qualifies."
  - question: "Does Texas have paid family leave?"
    answer: "Texas has no mandatory statewide family leave insurance program. Paid parental leave may still come from an employer, and eligible workers may have unpaid job protection under federal law."
  - question: "Does Florida require paid maternity leave?"
    answer: "Florida has no mandatory statewide family leave insurance program. Employer policies can provide paid maternity or parental leave even without a statewide entitlement."
  - question: "Is paid family leave the same as maternity leave?"
    answer: "California's family benefit and New York's bonding leave can cover eligible parents rather than mothers alone. Medical recovery from childbirth is a different qualifying reason and may fall under a separate disability or medical benefit."
  - question: "When does paid family leave start in Maryland?"
    answer: "Maryland schedules benefits to begin in January 2028. Payroll contributions begin earlier, so deductions do not mean a worker can already claim benefits."
  - question: "When does paid family leave start in Virginia?"
    answer: "Virginia schedules benefit payments for December 2028. The state is implementing the program, so its enacted status should not be read as coverage for an immediate leave request."
  - question: "Does New Hampshire have paid family leave?"
    answer: "New Hampshire offers voluntary paid family and medical leave insurance. Enrollment or employer coverage matters because the program does not impose the same mandatory participation model used in New York."
