  title: "Paid Family Leave States | Map, Weeks & Rules"
  description: "Ten states offer up to 12 paid bonding weeks. California and Rhode Island offer 8. Maryland and Virginia have future programs."
page:
  h1: "Paid Family Leave States"
  quick_answer:
    - "Paid family leave states with the longest standard bonding benefit include Colorado, Connecticut, and New York, tied at 12 weeks. Ten states offer that limit through mandatory programs already paying benefits."
    - "California and Rhode Island allow 8 paid bonding weeks, the shortest limits among operating mandatory programs. Their family benefits sit alongside separate disability insurance, so bonding weeks do not measure a birth parent's entire medical recovery leave."
    - "Maryland and Virginia have enacted mandatory programs but are not yet paying benefits. New Hampshire and Vermont offer voluntary insurance instead, so living there does not automatically give every worker paid family leave."
  methodology: "State program guidance checked October 2, 2026 supports ranks for standard continuous bonding weeks in operating mandatory programs. Future and voluntary programs are unranked, with no numeric value, while DC and employer-only benefits are excluded."
