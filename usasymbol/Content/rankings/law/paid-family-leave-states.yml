sections:
  - id: "states-with-longest-paid-family-leave"
    icon: "fa-solid fa-calendar-days"
    title: "States With Longest Paid Family Leave"
    paragraphs:
      - "Colorado and the other nine leaders tie at 12 bonding weeks because their programs set that entitlement directly in law. Colorado pools payroll contributions so an individual employer does not have to fund a worker's entire benefit when a child arrives. Approved private plans can replace the public plan, but must meet its benefit standards."
      - "California and Rhode Island share the shortest operating limit at 8 weeks. Both pair family benefits with separate disability insurance, so the shorter bonding period does not mean a recovering birth parent has only eight paid weeks available across every kind of leave."
    table:
      columns: {state: "State", weeks: "Bonding Weeks"}
      rows:
        - {state: "Colorado", weeks: 12}
        - {state: "Connecticut", weeks: 12}
        - {state: "Delaware", weeks: 12}
        - {state: "Maine", weeks: 12}
        - {state: "Massachusetts", weeks: 12}
        - {state: "Minnesota", weeks: 12}
        - {state: "New Jersey", weeks: 12}
        - {state: "New York", weeks: 12}
        - {state: "Oregon", weeks: 12}
        - {state: "Washington", weeks: 12}
  - id: "new-paid-family-leave-programs"
    icon: "fa-solid fa-baby"
    title: "New Paid Family Leave State Programs"
    paragraphs:
      - "Delaware and Minnesota began paying benefits in January 2026, and Maine followed in May. Delaware distinguishes employer size, with parental coverage generally starting at ten employees and broader family and medical coverage at twenty-five. A worker's state alone therefore cannot settle eligibility."
      - "Maryland and Virginia belong in the enacted group, not the operating group. Maryland schedules benefits for January 2028, while Virginia schedules them for December 2028. A law on the books and a benefit available for today's birth are different facts."
    table:
      columns: {state: "State", launch: "Benefit Start", status: "Status"}
      rows:
        - {state: "Delaware", launch: "January 2026", status: "Paying benefits"}
        - {state: "Minnesota", launch: "January 2026", status: "Paying benefits"}
        - {state: "Maine", launch: "May 2026", status: "Paying benefits"}
        - {state: "Maryland", launch: "January 2028", status: "Future benefits"}
        - {state: "Virginia", launch: "December 2028", status: "Future benefits"}
  - id: "paid-family-leave-without-mandate"
    icon: "fa-solid fa-building"
    title: "States Without Mandatory Family Leave"
    paragraphs:
      - "New Hampshire and Vermont use voluntary insurance for private employers and individuals rather than requiring universal participation. A covered worker can receive benefits, while a neighbor at an employer without coverage may receive nothing from that program. Optional insurance is not equivalent to a mandatory state entitlement."
      - "Texas and Florida have no mandatory statewide family insurance program. Employer benefits and unpaid federal leave can still apply, but [paid sick leave laws](/rankings/law/paid-sick-leave-by-state) answer a separate question about shorter absences. An absence for a new child should not be confused with ordinary sick-day accrual."
  - id: "paid-family-leave-job-protection"
    icon: "fa-solid fa-shield"
    title: "Paid Family Leave and Job Protection"
    paragraphs:
      - "California's 8-week family benefit replaces wages without independently guaranteeing reinstatement. Oregon includes job protection for qualifying workers after the required period with an employer. A benefit approval and a right to return to the same job can come from different laws."
      - "New Jersey's 12-week maximum applies to continuous family claims, while intermittent leave uses a separate day limit. Leave insurance also differs from [overtime pay](/rankings/law/overtime-laws-by-state), which compensates work already performed, and from a [minimum wage](/rankings/economy/minimum-wage-by-state), which sets the pay floor for working time."
