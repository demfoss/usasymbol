    title: "States With No Campaign Contribution Limits"
    paragraphs:
      - "Twelve states place no cap on what an individual can give a candidate for governor. Pennsylvania and Texas still bar corporations and unions from giving to candidates, so unlimited means unlimited for individuals only. Alaska had limits until a federal appeals court held them unconstitutional in 2021."
      - "Oregon is changing. Governor Kotek signed House Bill 4024 in 2024, and its per election limits begin in January 2027, with the primary and general election counted separately. Until then Oregon remains in the unlimited group."
