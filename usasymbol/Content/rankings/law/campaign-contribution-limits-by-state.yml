    icon: "fa-solid fa-arrow-down-wide-short"
    title: "Lowest Governor Contribution Limits by State"
    paragraphs:
      - "Colorado's $725 per election cap comes from Amendment 27, which voters approved in 2002 through the state's [ballot initiative](/rankings/law/ballot-initiative-states) process. The amount is adjusted for inflation and rounded down to the nearest $25."
      - "Massachusetts counts $1,000 per calendar year, so a donor can give again each January. Montana's $1,129 covers a governor and running mate together, and Maryland's $6,000 spreads across a full four-year cycle."
