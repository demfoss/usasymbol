  - id: federal-campaign-contribution-limits
    icon: "fa-solid fa-flag-usa"
    title: "Federal Campaign Contribution Limits"
    paragraphs:
      - "An individual may give a federal candidate committee $3,500 per election in the 2025-2026 cycle, with the primary and general election counted separately. Twenty-two states let an individual give a governor candidate more than that, four match it, and 12 sit below it."
      - "The Supreme Court upheld contribution limits in Buckley v. Valeo in 1976 as a guard against corruption, while striking down caps on independent spending. States use that opening to draw their own lines, which explains the wide spread on the table."
