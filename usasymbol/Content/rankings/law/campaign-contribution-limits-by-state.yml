sections:
  - id: why-california-has-the-highest-contribution-limit
    icon: "fa-solid fa-landmark-dome"
    title: "Why California Has the Highest Contribution Limit"
    paragraphs:
      - "California allows $39,200 per election to a candidate for governor, and the primary, general and any special election each carry their own limit. Voters approved Proposition 34 in 2000 to set limits for state candidates, and the state raises them regularly for inflation, which is why the figure keeps climbing rather than staying fixed."
      - "Wisconsin's $20,000 per election cycle and Ohio's $16,616 per election are the next highest. Each sits far above the $3,500 per election that a federal candidate can accept from one individual."
