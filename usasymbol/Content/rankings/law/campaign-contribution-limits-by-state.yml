faq:
  - question: "How much can you donate to a governor candidate in California?"
    answer: "An individual can give $39,200 per election. Because the primary and general election count separately, a donor can give that amount in each."
  - question: "Which states have no campaign contribution limits?"
    answer: "Alabama, Alaska, Indiana, Iowa, Mississippi, Nebraska, North Dakota, Oregon, Pennsylvania, Texas, Utah and Virginia set no limit on individual gifts to a governor candidate. Oregon's first limits begin in January 2027."
  - question: "What is the federal limit for donating to a candidate?"
    answer: "An individual can give a federal candidate $3,500 per election in the 2025-2026 cycle. Gifts to a political action committee are capped at $5,000 per year."
  - question: "Is there a campaign contribution limit in Texas?"
    answer: "Not for individuals. Texas lets a person give any amount to a candidate for governor, but corporations and unions are barred from giving to candidates."
  - question: "How much can you give a governor candidate in Colorado?"
    answer: "The cap is $725 per election, the lowest in the country. It doubles for a candidate who accepts voluntary spending limits when an opponent who raised more than 10 percent of the limit has not."
  - question: "How much can you give to a candidate for governor in Florida?"
    answer: "Florida allows $3,000 per election to a statewide candidate. Legislative candidates are limited to $1,000."
  - question: "What state has the lowest campaign contribution limit?"
    answer: "Colorado, where voters set the limit in a 2002 constitutional amendment. Massachusetts follows at $1,000 per calendar year."
