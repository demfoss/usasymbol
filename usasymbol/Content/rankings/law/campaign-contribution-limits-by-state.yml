page:
  h1: "Campaign Contribution Limits by State"
  quick_answer:
    - "Campaign contribution limits for governor top out in California at $39,200 per election, adjusted regularly for inflation. Wisconsin is next at $20,000 per election cycle."
    - "Colorado sets the lowest cap at $725 per election, a result of a voter-approved constitutional amendment from 2002. Twelve states, including Texas, Pennsylvania and Virginia, place no limit on what an individual can give."
    - "Oregon has no cap today, but a law signed in 2024 sets limits beginning in 2027. Federal candidates are limited to $3,500 per election in the 2025-2026 cycle."
  methodology: "Individual-to-candidate limits for the 2025-2026 cycle checked October 2026 against the NCSL compilation, with California, Minnesota and federal figures confirmed on their agency pages. The 12 states with no limit are listed without a rank. Periods differ by state."
  sources:
    - name: "NCSL. State Limits on Contributions to Candidates, 2025-2026 Election Cycle"
      url: "https://documents.ncsl.org/wwwncsl/Elections/State-Limits-on-Contributions-to-Candidates-2025-2026.pdf"
      description: "Governor limits, limit periods and unlimited states in all 50 states"
    - name: "California Fair Political Practices Commission. State Contribution Limits"
      url: "https://www.fppc.ca.gov/learn/campaign-rules/state-contribution-limits.html"
      description: "$39,200 per election for governor in 2025-2026"
    - name: "Minnesota Campaign Finance Board. 2025-2026 Contribution Limits"
      url: "https://register.cfb.mn.gov/pdf/camfin/contrib_limits_2026.pdf"
      description: "$4,000 two-year limit for governor and lieutenant governor"
    - name: "Federal Election Commission. Contribution Limits"
      url: "https://www.fec.gov/help-candidates-and-committees/candidate-taking-receipts/contribution-limits/"
      description: "2025-2026 federal limits for individuals, PACs and parties"
