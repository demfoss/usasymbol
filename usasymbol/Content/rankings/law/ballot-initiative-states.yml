page:
  h1: "Ballot Initiative States"
  quick_answer:
    - "Ballot initiative states began with South Dakota, which let citizens put laws on the ballot in 1898 after borrowing the idea from Swiss practice. Twenty-four states now have a citizen initiative on the books."
    - "Mississippi adopted the newest process in 1992, but a 2021 state Supreme Court ruling that voided a voter-approved measure left it effectively unusable. Petition rules assume five congressional districts, and Mississippi now has four."
    - "Florida, Illinois and Mississippi allow only constitutional amendments, while Alaska, Idaho, Maine, Utah, Washington and Wyoming allow only laws. The other 26 states offer no citizen initiative, and Texas voters rejected one in 1914."
  methodology: "Checked October 2026 using Ballotpedia, the Initiative and Referendum Institute and Wikipedia. Rank and map use the year each state adopted its initiative, with Alaska counted at its 1956 constitution. Veto referendums are not counted as initiatives."
