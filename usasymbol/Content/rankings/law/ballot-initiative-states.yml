faq:
  - question: "Which state was first to allow ballot initiatives?"
    answer: "South Dakota. Voters approved the statewide initiative and referendum in 1898, years before any other state, and the idea spread across the West in the following decade."
  - question: "How many states allow citizens to put laws on the ballot?"
    answer: "Twenty-four states have a citizen initiative, though Mississippi's is unusable. Twenty-one allow citizens to propose ordinary laws and eighteen allow constitutional amendments."
  - question: "What is the difference between a direct and an indirect initiative?"
    answer: "A direct initiative goes to voters once enough signatures are collected. An indirect initiative first goes to the legislature, which can pass it, and it reaches the ballot only if lawmakers do not."
  - question: "Can citizens in Texas put a law on the ballot?"
    answer: "No. Texas has no citizen initiative or veto referendum, and voters rejected a proposal to create one in 1914. Only the legislature can send constitutional amendments to the ballot."
  - question: "What is the difference between an initiative and a referendum?"
    answer: "An initiative lets citizens propose a new law or amendment. A veto referendum lets them ask voters to repeal a law the legislature already passed, as with Missouri's Proposition A in November 2026."
  - question: "Which states allow only constitutional amendment initiatives?"
    answer: "Florida, Illinois and Mississippi. Illinois restricts its amendments to legislative structure, and Mississippi's process has not worked since the 2021 court ruling."
  - question: "Which states allow only statute initiatives?"
    answer: "Alaska, Idaho, Maine, Utah, Washington and Wyoming. Citizens there can propose laws, but changing the state constitution must start in the legislature."
