  - id: direct-and-indirect-initiative-states
    icon: "fa-solid fa-route"
    title: "Direct and Indirect Initiative States"
    paragraphs:
      - "In a direct initiative, a successful petition goes straight to the ballot, as in California and Colorado. In an indirect initiative, the legislature gets the first chance to pass the proposal, and voters decide only if lawmakers refuse. Maine, Alaska and Wyoming use the indirect route for laws, while Utah and Washington allow both."
      - "Initiatives often change the rules lawmakers write for themselves. Voters in Arizona, California, Colorado and Michigan used them to create [redistricting commissions](/rankings/law/redistricting-commission-states), and many states adopted [legislative term limits](/rankings/law/legislative-term-limits-by-state) the same way."
      - "Massachusetts is the strictest indirect state, since an amendment must win approval from at least one quarter of legislators in two successive sessions. A related tool is the veto referendum, where voters can repeal a law lawmakers already passed. Missouri's Proposition A on the November 2026 ballot is one, and it asks voters about the state's 2025 congressional map."
  - id: states-with-limited-ballot-initiatives
    icon: "fa-solid fa-file-signature"
    title: "States With Limited Ballot Initiatives"
    paragraphs:
      - "Florida, Illinois and Mississippi let citizens propose constitutional amendments but not ordinary laws. Florida amendments need 60 percent of the vote, and Illinois only allows changes to how the legislature is structured. Mississippi's process, restored in 1992, is the cautionary tale, because the state lost a congressional seat after the 2000 census and petition rules require signatures from five districts."
      - "In 2021 the Mississippi Supreme Court voided a voter-approved medical marijuana initiative on that basis. Alaska, Idaho, Maine, Utah, Washington and Wyoming sit on the other side of the divide and allow citizens to propose laws but not amendments."
  - id: states-without-citizen-ballot-initiatives
    icon: "fa-solid fa-ban"
    title: "States Without Citizen Ballot Initiatives"
    paragraphs:
      - "Twenty-six states, including Texas, New York and Pennsylvania, give citizens no way to put a new law or amendment on the ballot. Texas voters rejected the idea in 1914, mainly over a signature requirement of 20 percent. Maryland and New Mexico allow only a veto referendum."
