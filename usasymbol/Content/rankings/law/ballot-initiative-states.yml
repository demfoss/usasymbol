sections:
  - id: why-south-dakota-has-the-oldest-ballot-initiative
    icon: "fa-solid fa-seedling"
    title: "Why South Dakota Has the Oldest Ballot Initiative"
    paragraphs:
      - "South Dakota voters approved the first statewide initiative and referendum on November 5, 1898. Farmers and Populist reformers wanted a way around legislatures they saw as dominated by railroads and banks, and they copied the model from the 1848 Swiss constitution. Utah followed in 1900 and Oregon in 1902, and Oregon's heavy use of the tool gave the whole approach its nickname, the Oregon System."
    table:
      columns:
        state: "State"
        year: "Year Adopted"
      rows:
        - { state: "South Dakota", year: "1898" }
        - { state: "Utah", year: "1900" }
