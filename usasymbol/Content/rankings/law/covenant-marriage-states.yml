faq:
  - question: Which states have covenant marriage?
    answer: "Louisiana, Arizona, and Arkansas offer the option. A couple must deliberately select it and complete the additional paperwork. A church wedding by itself does not establish covenant status."
  - question: What is a covenant marriage in Louisiana?
    answer: "Louisiana couples sign a declaration of lifelong commitment and document premarital counseling. Both parties' signatures are witnessed by a notary, and the counselor supplies an attestation."
  - question: Can you divorce in an Arizona covenant marriage?
    answer: "Yes. Arizona lists specific grounds for dissolution, including domestic violence and emotional abuse. Qualifying separation and the agreement of both spouses are also statutory grounds."
  - question: Is covenant marriage required in Arkansas?
    answer: "No. Arkansas couples can choose an ordinary marriage instead. Couples selecting covenant marriage file an additional declaration with the official issuing the license."
  - question: Can an existing Arkansas marriage become a covenant marriage?
    answer: "Yes. Arkansas allows already married couples to redesignate their marriage. Both spouses must complete the declaration and supporting requirements."
  - question: Do Arizona couples need premarital counseling to convert an existing marriage?
    answer: "No. Arizona exempts couples converting an existing valid marriage from premarital counseling. They still file the required sworn statement and declaration."
