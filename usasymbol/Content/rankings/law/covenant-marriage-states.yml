page:
  h1: Covenant Marriage States
  quick_answer:
    - "Covenant marriage states began with Louisiana in 1997. Its law created an optional marriage contract that combines counseling, a declaration of lifelong commitment, and limited grounds for divorce."
    - "Arkansas adopted covenant marriage in 2001, the latest of the three states. Its law makes the choice visible on the marriage certificate and requires an additional declaration of intent."
    - "Arizona adopted the option in 1998. Unlike Louisiana, it expressly allows a covenant divorce when both spouses agree to dissolve the marriage."
