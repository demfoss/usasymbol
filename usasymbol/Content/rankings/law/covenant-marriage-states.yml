sections:
  - id: covenant-marriage-law-history
    icon: fa-solid fa-landmark
    title: Covenant Marriage Law History
    paragraphs:
      - "Louisiana comes first because its 1997 act created the optional legal form before Arizona or Arkansas adopted it. Couples agree to seek counseling if marital problems arise, and a divorce must satisfy one of the law's specified grounds. Ordinary marriage remains available alongside the covenant option."
      - "Arkansas appears last because it enacted its own Covenant Marriage Act in 2001. The law requires a signed declaration and counseling documentation, and the certificate identifies the marriage as a covenant marriage. Choosing the option creates obligations beyond the state's ordinary [marriage age rules](/rankings/law/marriage-age-by-state)."
  - id: covenant-marriage-divorce-rules
    icon: fa-solid fa-scale-balanced
    title: Covenant Marriage Divorce Rules
    paragraphs:
      - "Arizona's 1998 covenant law permits divorce by mutual agreement, a meaningful difference from Louisiana's rule against ending the covenant agreement by mutual consent alone. Arizona also recognizes specified grounds involving abuse, abandonment, serious criminal convictions, substance abuse, or qualifying separation."
      - "Arkansas recognizes a divorce ground based on two continuous years of separation without reconciliation, alongside grounds involving adultery, serious crimes, and abuse. The covenant designation comes from the couple's filed declaration. A [common-law marriage](/rankings/law/common-law-marriage-states) instead concerns formation through an agreement and conduct in a state that recognizes that route."
