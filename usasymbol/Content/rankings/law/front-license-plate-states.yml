sections:
- id: states-that-require-a-front-license-plate
  icon: fa-solid fa-car-side
  title: States That Require a Front License Plate
  paragraphs:
  - California is one of 28 states classified as requiring a front plate. Standard passenger vehicles receive two plates, and the display rule assigns one to the front and one to the rear, making the registration readable from either direction.
- id: states-without-front-license-plates
  icon: fa-solid fa-car-rear
  title: States Without Front License Plates
  paragraphs:
  - Utah joins Florida, Georgia, and Pennsylvania in the 22-state rear-only group. Its issuance system now supplies one plate for most vehicles, so a missing front plate on a Utah passenger car can be the intended registration arrangement.
  - Alaska also uses a single rear plate for ordinary passenger vehicles. Its plate-issuance change took effect in August 2022, replacing the former front-and-rear arrangement with a rear-only system.
- id: recent-changes-to-front-plate-laws
  icon: fa-solid fa-clock-rotate-left
  title: Front License Plate Rules Across State Lines
  paragraphs:
  - California and Arizona sit on opposite sides of the front-plate divide. Plate requirements generally follow the vehicle registration, so crossing from a rear-only state does not by itself require obtaining a second plate.
  - Utah and California also illustrate why vehicle type matters. Standard passenger registrations fit the table, while commercial and specialty registrations can have different issuance or display provisions.
