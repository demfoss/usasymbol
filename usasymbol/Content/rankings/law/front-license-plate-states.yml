    url: https://www.news5cleveland.com/news/state/drivers-will-no-longer-be-required-to-have-a-front-license-plate-in-ohio
    description: Confirms Ohio's front plate requirement ended July 1, 2020, under House Bill 62
  - name: Alaska Division of Motor Vehicles. License Plates
    url: https://dmv.alaska.gov/vehicle-services/license-plates/
    description: Official Alaska DMV page confirming single rear-plate issuance since August 11, 2022
  - name: KSL.com. Why most Utahns won't be required to have a front license plate anymore
    url: https://www.ksl.com/article/news/utah/why-most-utahns-wont-be-required-to-have-a-front-license-plate-anymore/50952019
    description: Confirms Utah's SB45 ended the front plate requirement effective January 1, 2025
  - name: California DMV. License Plates
    url: https://qr.dmv.ca.gov/portal/handbook/vehicle-industry-registration-procedures-manual-2/general-registration-information/license-plates/
    description: Plate issuance by vehicle registration type
