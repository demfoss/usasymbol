sections:
  - id: "are-these-real"
    icon: "fa-solid fa-scale-balanced"
    title: "Are These Weird Laws Real?"
    paragraphs:
      - "Most websites that publish weird law lists do not distinguish between verified statutes and invented claims. The same entries circulate from site to site without a source: ice cream cones in back pockets, ducks on heads, mustaches and kissing. These have no known statute behind them. They are not laws. They are internet folklore repeated often enough to feel real."
      - "The table above marks each entry with a status. Verified means a real statute or ordinance was found. City-specific means the law is real but limited to one town or county. Outdated means the law was real but is effectively dead. Exaggerated means the popular framing is built on something real but the actual rule is more mundane. Unverified means the claim is widely repeated but no source has been found."
      - "The real weird laws tend to have specific origin stories. Nevada's camel law dates to actual camel mail routes. Oregon's highway urine law targets a specific modern problem. West Virginia's roadkill law was a practical policy decision. The invented ones tend to be absurd for absurdity's sake with no story behind them."

  - id: "why-they-stay"
    icon: "fa-solid fa-book-open"
    title: "Why Do Weird Laws Stay on the Books?"
    paragraphs:
      - "Repealing a law requires legislative action: a sponsor, a hearing, a vote. Doing nothing costs nothing. When a law is obscure, unenforced, or simply unknown to current legislators, it persists indefinitely. Rhode Island still technically criminalizes dueling. Virginia still has a public profanity misdemeanor. North Carolina still limits bingo to five hours. None of these are priorities for repeal."
      - "Some laws stay because they were tied to industries that have not pushed for removal. Wisconsin's margarine law was written to protect dairy farmers. The industry has little reason to seek repeal. The law may never be enforced against a server who brought margarine without being asked, but removing it signals nothing useful."
      - "Others stay because the conditions that created them no longer exist but the law itself is harmless to leave in place. Nevada's camel law addressed real traffic. Alaska's same-day hunting ban addressed real problems with hunters flying to remote areas. West Virginia's roadkill law was a practical response to waste. The laws that seem strangest today often made the most sense when they were written."


