faq:
  - question: "How much beer can you brew at home in Connecticut?"
    answer: "Connecticut permits 50 gallons per calendar year with one adult of legal drinking age in the household, or 100 gallons with two. Homemade beer can travel in sealed containers to exhibitions, contests and competitions, but cannot be sold."
  - question: "Can you brew beer at home in Mississippi?"
    answer: "Yes, if the brewer is at least 21 and lives in a wet county or municipality. The household allowance is 100 gallons a year with one qualifying adult or 200 gallons with two or more."
  - question: "Does Florida combine the homebrew beer and wine limits?"
    answer: "Florida gives beer and wine separate allowances. Each is limited to 100 gallons per year in a one-adult household or 200 gallons in a household with two or more qualifying adults."
  - question: "Can you keep a large stock of homebrew in Alabama?"
    answer: "Alabama limits the residence to 15 gallons of beer, mead, cider and table wine made under its homebrew exemption at any one time. The separate production limit is also 15 gallons, but applies to each calendar quarter."
  - question: "Can a single adult brew 200 gallons in Delaware?"
    answer: "Delaware's state exemption permits 200 gallons of beer, but the federal tax-free personal-use allowance for a household with only one adult is 100 gallons. The single-adult quantity in the table uses that lower federal limit."
