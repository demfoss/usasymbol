sections:
  - id: why-homebrewing-limits-differ
    icon: "fa-solid fa-scale-balanced"
    title: "Why Homebrewing Limits Differ"
    paragraphs:
      - "California's 200-gallon two-adult allowance follows the familiar household structure of the federal homebrewing exemption. Colorado reaches the same ceiling by directly tying its exemption to the federal tax-free quantity rather than creating a separate state beer allowance."
      - "Alabama has the lowest listed annual equivalent because its 2013 law chose a quarterly allowance and a separate possession ceiling. A brewer cannot save unused quarters for one large batch, and making wine or cider uses the same limited allowance as beer. Alabama and Mississippi were the last states to legalize homebrewing, both in 2013."
    table:
      columns:
        state: "State"
        gallons: "Annual Gallons With Two Adults"
      rows:
        - { state: "California", gallons: 200 }
        - { state: "Colorado", gallons: 200 }
        - { state: "Delaware", gallons: 200 }
        - { state: "Florida", gallons: 200 }
        - { state: "Kentucky", gallons: 200 }
        - { state: "Mississippi", gallons: 200 }
        - { state: "Ohio", gallons: 200 }
        - { state: "Wisconsin", gallons: 200 }
  - id: homebrewing-in-dry-counties
    icon: "fa-solid fa-map-location-dot"
    title: "Homebrewing in Dry Counties"
    paragraphs:
      - "Mississippi's 200-gallon two-adult beer allowance applies only when the brewer lives in a wet county or municipality. A statewide homebrewing exemption therefore does not automatically permit production in every neighborhood. Local alcohol rules also explain why a [dry state](/rankings/law/dry-states) can contain places where alcohol sales are allowed."
      - "Alabama also prohibits homebrewing in dry municipalities and in dry counties outside their wet municipalities. Its residence-based rule makes the property's location part of eligibility before the brewer counts a single gallon."
  - id: selling-homemade-beer
    icon: "fa-solid fa-beer-mug-empty"
    title: "Selling Homemade Beer"
    paragraphs:
      - "California's 200-gallon household exemption allows club meetings and competitions on certain licensed premises, but ordinary bar patrons cannot drink the club's homebrew there. A separate nonprofit fundraising provision can permit donated homemade drinks to be sold under a licensed event, without turning the homebrewer into an ordinary commercial seller."
      - "Ohio's 200-gallon two-adult exemption permits private tastings and competitions, with event samples limited to two ounces. A qualifying licensed venue must keep homemade drinks separate from its sale inventory. Every event still needs to respect the [drinking age](/rankings/law/drinking-age-by-state)."
