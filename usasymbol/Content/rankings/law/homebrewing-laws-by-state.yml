  title: "Homebrewing Laws by State | Map & Limits"
  description: "California allows 200 gallons a year for a household with two adults. Alabama limits homebrew to 15 gallons each quarter and 15 on hand."
page:
  h1: "Homebrewing Laws by State"
  quick_answer:
    - "Homebrewing laws in California allow 200 gallons per calendar year for a household with two adults, sharing the highest beer allowance in this comparison. A household with one adult has a 100-gallon allowance."
    - "Alabama allows 15 gallons per quarter, equivalent to 60 gallons across four quarters. Beer, mead, cider and table wine share the limit, and a household may keep only 15 gallons of that homebrew on hand."
    - "Connecticut permits 100 gallons of beer annually in a household with two adults of legal drinking age, or 50 gallons with one. Its beer exemption does not authorize a university club to operate as a household brewer."
  methodology: "State laws and agencies checked October 7, 2026, with all 50 states shown as permitting homebrewing with restrictions. Ten verified two-adult beer caps are quantified, with Alabama annualized from its quarterly limit and wine and local bans excluded."
