page:
  h1: "Notice to Vacate Requirements by State"

  quick_answer:
    - "Notice to vacate requirements are longest in Delaware, Georgia, and Maryland at 60 days for ending a month-to-month tenancy without cause."
    - "Thirty-eight states set the most common period on record at 30 days, including Florida, Texas, and Ohio. Hawaii requires 45 days, and Wisconsin requires 28 days."
    - "Connecticut requires only 3 days and North Carolina requires 7 days, the shortest periods on record. Louisiana follows at 10 days, and Pennsylvania and Utah sit at 15 days."

  methodology: "Days are the written notice a landlord must give to end a month-to-month residential tenancy without cause, based on state statutes as of 2026, with one-month periods counted as 30 days. Where a state requires just cause or has no statute, the period that applies in practice is shown and flagged in the notes."

  sources:
    - name: "Nolo. State Rules on Notice Required to Change or Terminate a Month-to-Month Tenancy"
      url: "https://www.nolo.com/legal-encyclopedia/state-rules-on-notice-required-to-change-or-terminate-a-month-to-month-tenancy.html"
      description: "State-by-state notice periods and statute citations for ending month-to-month tenancies"
    - name: "Delaware Code Title 25, Chapter 51. Rental Agreements"
      url: "https://delcode.delaware.gov/title25/c051/sc01/index.html"
      description: "Section 5106 on 60-day written notice to end a month-to-month tenancy"
    - name: "Wisconsin Statutes 704.19. Termination of Periodic Tenancies"
      url: "https://docs.legis.wisconsin.gov/document/statutes/704.19"
      description: "Length of notice for periodic tenancies, at least 28 days"
    - name: "North Carolina General Statutes 42-14. Notice to Quit in Certain Tenancies"
      url: "https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_42/GS_42-14.html"
      description: "Seven-day notice to end a month-to-month tenancy"
    - name: "South Dakota Legislature. Codified Law 43-32-13"
      url: "https://sdlegislature.gov/Statutes/43-32-13"
      description: "South Dakota statute allowing a landlord to end a month-to-month tenancy on 30 days of written notice"
    - name: "Minnesota Revisor of Statutes. Section 504B.135, Terminating tenancy at will"
      url: "https://www.revisor.mn.gov/statutes/cite/504B.135"
      description: "Minnesota rule setting notice equal to the rental period, up to 3 months"

