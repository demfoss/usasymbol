sections:
  - id: "states-with-the-longest-notice-to-vacate-periods"
    icon: "fa-solid fa-calendar-days"
    title: "States With the Longest Notice to Vacate Periods"
    paragraphs:
      - "Delaware, Georgia, and Maryland require 60 days of written notice, the longest notice to vacate period on record and twice the 30-day norm. Delaware starts the count on the first day of the month after notice is given, so the wait always exceeds 60 days from the notice date."
      - "Hawaii stands alone in the middle at 45 days. Colorado's period climbs to 91 days after a year of tenancy and New York's climbs to 90 days after two years, though both rank lower in the table at 21 and 30 days."

  - id: "states-with-the-shortest-notice-to-vacate-periods"
    icon: "fa-solid fa-clock"
    title: "States With the Shortest Notice to Vacate Periods"
    paragraphs:
      - "Connecticut requires just 3 days through a notice to quit, and North Carolina requires 7 days, the shortest periods on record. Louisiana follows at 10 days, Pennsylvania and Utah at 15 days, Washington at 20 days, Colorado at 21 days, and Wisconsin at 28 days."
      - "Wisconsin's 28 days sits just under the 30-day norm. Colorado's 21 days applies only to tenancies of one to six months, and it lengthens to 28 days and then 91 days as the tenancy grows."

  - id: "standard-notice-to-vacate-period-by-state"
    icon: "fa-solid fa-house"
    title: "Standard Notice to Vacate Period by State"
    paragraphs:
      - "Thirty-eight states set the standard period at 30 days, including Alabama, Florida, Illinois, Ohio, and Texas. That group is far larger than the three states at 60 days or the single state at 45 days."
      - "Four of those states change the rules as a tenancy lengthens. California and Oregon require just cause after the first year, while New York and Vermont extend the period to 60 or 90 days."

