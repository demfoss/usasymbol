faq:
  - question: "Which state has the longest notice to vacate requirement?"
    answer: "Delaware, Georgia, and Maryland tie for the longest at 60 days. Hawaii follows at 45 days."

  - question: "Which state has the shortest notice to vacate requirement?"
    answer: "Connecticut has the shortest at 3 days, served as a notice to quit. North Carolina is next at 7 days, followed by Louisiana at 10 days."

  - question: "How many days notice does a landlord have to give in Florida?"
    answer: "Florida requires 30 days of written notice to end a month-to-month tenancy, the same period as 37 other states in the table."

  - question: "What is the notice to vacate requirement in California?"
    answer: "California requires 30 days for tenancies under 12 months. After 12 months, the table notes that just cause is generally required."

  - question: "How much notice does a landlord give in New York to end a tenancy?"
    answer: "New York starts at 30 days for tenancies under one year. The period rises to 60 days for one to two years and reaches 90 days beyond two years."

  - question: "What is the most common notice to vacate period?"
    answer: "Thirty days is the most common, set by 38 of the 50 states listed. Eight states require less and four require more."

