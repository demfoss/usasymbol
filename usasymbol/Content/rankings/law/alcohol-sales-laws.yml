faq:
- question: Can grocery stores sell liquor in California?
  answer: Yes. California is classified as full access, but the store must hold a license that authorizes spirits. Permission for a licensed retailer does not mean every supermarket chooses to stock liquor.
- question: Can I buy liquor in grocery stores in Pennsylvania?
  answer: No. Pennsylvania grocery access covers beer and wine, while its spirits stores operate through a separate state-controlled retail system.
- question: What are the alcohol sales laws in Utah?
  answer: Utah is in the beer-only grocery category. Wine and spirits require a different retail channel, and [legal drinking ages](/rankings/law/drinking-age-by-state) concern who may buy rather than which store may sell.
- question: Can grocery stores sell wine in New York?
  answer: New York is classified as beer only for ordinary grocery sales. Some grocery licenses also cover wine products, a distinct legal category that should not be confused with a conventional wine-store license.
- question: Which states have the least grocery alcohol access?
  answer: Alaska, Delaware, Maryland, New Jersey, and Rhode Island share the liquor-stores-only category. Maryland has grandfathered exceptions, and Alaska stores may use a separate licensed alcohol area.
- question: Can I buy liquor in grocery stores in Texas?
  answer: Texas is listed as beer and wine only. A spirits shop beside a supermarket is a separate retail operation rather than evidence that spirits belong in the grocery category.
