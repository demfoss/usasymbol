  title: Alcohol Sales Laws by State | Map & Grocery Rules
  description: Twenty states let grocery stores sell liquor. Eighteen allow beer and wine only, seven allow beer only, and five allow no grocery alcohol.
page:
  h1: Alcohol Sales Laws by State
  quick_answer:
  - Alcohol sales laws by state permit full grocery access in 20 states, including California, where an off-sale general license covers beer, wine, and spirits.
  - Alaska, Delaware, Maryland, New Jersey, and Rhode Island occupy the least-access category. Maryland has grandfathered exceptions, so a statewide grocery label cannot describe every individual store.
  - Iowa permits grocery spirits sales while retaining state control of spirits distribution. A control-state label describes the supply system, not necessarily a ban on supermarket sales.
  methodology: Wikipedia grocery-sales categories and NABCA control-state classifications, recorded June 22, 2026. Categories summarize ordinary retail access and omit individual licenses, grandfathered exceptions, and local dry-area rules.
  sources:
  - name: Wikipedia. List of alcohol laws of the United States
    url: https://en.wikipedia.org/wiki/List_of_alcohol_laws_of_the_United_States
    description: State-by-state table showing grocery store beer, wine, and distilled spirits sales rules
  - name: NABCA. Control State Directory and Info
    url: https://www.nabca.org/control-state-directory-and-info
    description: Directory of control states and jurisdictions for distilled spirits sales
  - name: California Alcoholic Beverage Control. License Types
    url: https://www.abc.ca.gov/licensing/license-types/
    description: Off-sale general and beer-and-wine license privileges
  - name: New York State Liquor Authority. Grocery Store License Quick Reference
    url: https://sla.ny.gov/grocery-storedrug-store-license-quick-reference
    description: Distinguishes grocery beer and wine-product licenses
