- id: alcohol-sales-laws-states-with-beer-only-or-none
  icon: fa-solid fa-ban
  title: States With Restricted Grocery Alcohol Sales
  paragraphs:
  - New York belongs to the seven-state beer-only group because grocery licenses and wine-and-liquor store licenses grant different privileges. Wine products covered by certain grocery licenses are not the same legal category as ordinary table wine.
  - Maryland and New Jersey join Alaska, Delaware, and Rhode Island in the five-state least-access group. Maryland retains grandfathered grocery exceptions, while New Jersey limits chain liquor licensing, so the category describes typical access rather than a claim that no supermarket can ever sell alcohol.
