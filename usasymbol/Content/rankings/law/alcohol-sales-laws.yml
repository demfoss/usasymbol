- id: alcohol-sales-laws-states-where-grocery-stores-sell-liquor
  icon: fa-solid fa-cart-shopping
  title: States Where Grocery Stores Sell Liquor
  paragraphs:
  - California belongs to the 20-state full-access group because its off-sale general license permits packaged beer, wine, and spirits at the same retail premises. A licensed supermarket can stock all three without sending shoppers to a separate spirits retailer.
  - Iowa and Michigan also permit grocery spirits sales despite retaining state control of part of the spirits supply chain. Retail access and government distribution are separate questions, just as [beer consumption by state](/rankings/food/beer-consumption-by-state) measures a different subject from shopping rules.
