- id: alcohol-sales-laws-states-with-beer-and-wine-only
  icon: fa-solid fa-wine-bottle
  title: States With Beer and Wine Grocery Sales
  paragraphs:
  - Pennsylvania sits in the 18-state beer-and-wine group because grocery licensing does not replace its separate state-operated spirits stores. A supermarket wine aisle therefore does not mean the same store can sell whiskey or vodka.
  - Texas also separates grocery beer-and-wine sales from spirits retailing. Local permissions remain another layer, which is why [dry states and counties](/rankings/law/dry-states) can explain restrictions that a statewide grocery category leaves out.
