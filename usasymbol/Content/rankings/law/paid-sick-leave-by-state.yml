seo:
  title: "Paid Sick Leave Laws by State | Map, Hours & Rules"
  description: "Michigan guarantees up to 72 hours of paid sick leave a year, the most of any state. Twenty-nine states have no paid sick leave law at all."

page:
  h1: "Paid Sick Leave Laws by State"

  quick_answer:
    - "Paid sick leave laws by state are most generous in Michigan, where workers at businesses with 11 or more employees can earn up to 72 hours a year, or nine full workdays."
    - "Twenty-nine states have no paid sick leave law, and no federal rule fills the gap for private employers. Missouri voters approved a law in 2024, but lawmakers repealed it less than four months after it took effect."
    - "Connecticut passed the first statewide paid sick leave law in 2011. Virginia is the newest, signed in 2026, though its rules do not begin until July 2027."

  methodology: "Statewide paid sick leave laws as of October 2026, from state labor departments and statutes. Annual Cap is the most leave a worker at the largest employers can earn or use per year. City laws are excluded, and DC is not ranked."

