faq:
  - question: "Is paid sick leave required by federal law?"
    answer: "No. No federal law requires private employers to offer paid sick leave. The Family and Medical Leave Act protects up to 12 weeks off, but that time is unpaid."

  - question: "Which state gives the most paid sick leave?"
    answer: "Michigan, with a yearly cap of 72 hours at larger businesses. New Mexico is next at 64 hours for workers at any private employer."

  - question: "Which state was the first to require paid sick leave?"
    answer: "Connecticut, in 2011. The first version was narrow. It covered only hourly service workers at employers with 50 or more people."

  - question: "What is the paid sick leave law in California?"
    answer: "California workers earn 1 hour for every 30 hours worked, and employers may limit use to 40 hours or 5 days a year. The law dates to 2014."

  - question: "How much paid sick leave do you get in New York?"
    answer: "Up to 56 hours a year at employers with 100 or more workers and 40 hours at those with 5 to 99. Leave builds at 1 hour per 30 hours worked."

  - question: "Does Texas require paid sick leave?"
    answer: "No. Texas has no statewide paid sick leave law, and the paid sick leave rules passed by Austin, Dallas, and San Antonio were blocked in court."

  - question: "Does Missouri have paid sick leave?"
    answer: "Not anymore. Missouri voters approved paid sick leave in 2024, and the legislature repealed the requirement as of August 28, 2025. Employers may still offer it voluntarily."

  - question: "Do right-to-work states have paid sick leave?"
    answer: "Some do. Arizona, Nebraska, and Nevada are [right-to-work states](/rankings/law/right-to-work-states) that require paid sick leave, while most others, including Texas and Florida, have no sick leave law."

