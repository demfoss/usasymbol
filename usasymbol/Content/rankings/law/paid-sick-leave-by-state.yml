sections:
  - id: "why-michigan-has-the-most-paid-sick-leave"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Michigan Has the Most Paid Sick Leave"
    paragraphs:
      - "Michigan's 72-hour cap comes from a 2018 citizen petition. Lawmakers adopted the measure that year to keep it off the ballot, then cut it back months later. In 2024 the Michigan Supreme Court ruled that maneuver unconstitutional and revived the original law, which took effect on February 21, 2025."
      - "Legislators amended it again before it started, keeping 72 hours for businesses with 11 or more workers. New Mexico ranks second at 64 hours, enough for eight full workdays, and its 2021 law covers every private employer no matter how small."
    table:
      columns:
        state: "State"
        cap: "Annual Cap"
        year: "Year Enacted"
      rows:
        - state: "Michigan"
          cap: "72 hours"
          year: "2018"
        - state: "New Mexico"
          cap: "64 hours"
          year: "2021"
        - state: "Alaska"
          cap: "56 hours"
          year: "2024"
        - state: "Nebraska"
          cap: "56 hours"
          year: "2024"
        - state: "New York"
          cap: "56 hours"
          year: "2020"
        - state: "Colorado"
          cap: "48 hours"
          year: "2020"
        - state: "Minnesota"
          cap: "48 hours"
          year: "2023"

  - id: "states-without-paid-sick-leave"
    icon: "fa-solid fa-map"
    title: "States Without Paid Sick Leave Laws"
    paragraphs:
      - "Twenty-nine states have no paid sick leave law. Every state on the Gulf of Mexico, from Texas to Florida, is on the list, along with Idaho, Montana, Utah, and Wyoming in the West. Federal law offers no backstop, since the Family and Medical Leave Act guarantees only unpaid time off."
      - "Cities sometimes step in. Philadelphia and Pittsburgh require paid sick leave even though Pennsylvania does not. Austin, Dallas, and San Antonio passed their own rules, but courts blocked them, and Florida has barred local governments from requiring such benefits since 2013. Many of these states also pay the federal floor listed in [minimum wage by state](/rankings/economy/minimum-wage-by-state)."

  - id: "new-paid-sick-leave-laws-since-2024"
    icon: "fa-solid fa-clock-rotate-left"
    title: "New Paid Sick Leave Laws Since 2024"
    paragraphs:
      - "Alaska, Missouri, and Nebraska voters all approved paid sick leave in November 2024, each by ballot measure. Alaska's law took effect July 1, 2025, and Nebraska's on October 1, 2025, after lawmakers exempted businesses with fewer than 11 workers."
      - "Missouri went the other way. Its law began May 1, 2025, and the legislature repealed it effective August 28, 2025, though the minimum wage increase from the same measure stayed. Virginia joined the list on May 20, 2026, when Governor Abigail Spanberger signed its law."
      - "Connecticut, the first state with a law, is still widening it. Its 2011 version covered only service workers at large employers, and a 2024 expansion reaches every employer in 2027."
    table:
      columns:
        state: "State"
        change: "Change"
        status: "Status"
      rows:
        - state: "Alaska"
          change: "Approved by voters, 2024"
          status: "In effect July 1, 2025"
        - state: "Missouri"
          change: "Approved by voters, 2024"
          status: "Repealed August 28, 2025"
        - state: "Nebraska"
          change: "Approved by voters, 2024"
          status: "In effect October 1, 2025"
        - state: "Michigan"
          change: "2018 law restored by court"
          status: "In effect February 21, 2025"
        - state: "Connecticut"
          change: "Expanded in 2024"
          status: "All employers from 2027"
        - state: "Virginia"
          change: "Signed May 20, 2026"
          status: "Starts July 1, 2027"

  - id: "paid-sick-leave-accrual-rates-by-state"
    icon: "fa-solid fa-hourglass-half"
    title: "Paid Sick Leave Accrual Rates by State"
    paragraphs:
      - "One hour of leave for every 30 hours worked is the standard in 15 states. Vermont is the slowest at 1 hour per 52, and Nevada's rate works out to nearly the same. Rhode Island sits in between at 1 hour per 35."
      - "Washington, Illinois, and Maine use 1 hour per 40, but Washington sets no yearly cap, so workers there keep earning leave all year. Illinois, Maine, and Nevada go further in another way. Their laws let workers use the time for any reason, not only illness."

