page:
  h1: "Human Composting Legal States"
  quick_answer:
    - "Human composting legal states begin with Washington, which enacted authorization in 2019. Its law added natural organic reduction to the funeral licensing system, creating a regulated route for turning human remains into soil."
    - "California enacted authorization in 2022, but the reduction provisions become operative in 2027. Approval of the equipment is part of the new system."
    - "New Jersey and Georgia enacted their authorizations in 2025, the latest year in the table. New Jersey's law took effect in July 2026, with implementing regulations still pending."
  methodology: "State authorizing laws checked October 8, 2026. All 14 enacted natural organic reduction authorizations are ordered by enactment year, with California's future operation and New Jersey's pending regulations shown separately."
