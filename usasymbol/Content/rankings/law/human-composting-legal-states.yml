faq:
  - question: "Which state first legalized human composting?"
    answer: "Washington enacted the first authorization in 2019. The law took effect May 1, 2020, allowing licensed facilities to offer natural organic reduction."
  - question: "Is human composting legal in California?"
    answer: "California enacted AB351 in 2022, with the reduction program operative January 1, 2027. Equipment approval applications start on that date, so the program is not yet operative in October 2026."
  - question: "When did New Jersey legalize human composting?"
    answer: "New Jersey enacted its law September 11, 2025. The authorization took effect July 1, 2026, with implementing regulations still pending."
  - question: "Is human composting legal in Maine?"
    answer: "Maine authorized natural organic reduction in 2024. The law became effective August 9, 2024, adding the method to the state's permitted forms of disposition."
  - question: "Can a family choose human composting in Delaware?"
    answer: "Delaware's 2024 law allows natural organic reduction and includes it in the written disposition declaration. The person making the declaration can direct how the remains should be handled afterward."
  - question: "Does Minnesota require a licensed human composting facility?"
    answer: "Minnesota requires a facility licensed for natural organic reduction. Its 2024 law established facility and processing safeguards effective July 1, 2025."
