sections:
  - id: first-latest-human-composting-laws
    icon: "fa-solid fa-seedling"
    title: "First Human Composting Legal States"
    paragraphs:
      - "Washington leads with its 2019 enactment because advocates brought a specific legal barrier to lawmakers. The proposal became a law that licensed and inspected reduction facilities alongside other funeral services. Permission to use natural organic reduction took effect in May 2020."
      - "Georgia and New Jersey share the latest enactment year at 2025. New Jersey created a registration and supervision framework for facilities and required inspection before opening. Its later start reflects the passage of a new funeral-services authorization, with implementation extending into 2026."
    table:
      columns:
        state: "State"
        enacted: "Enacted"
        provision: "Legal Provision"
      rows:
        - { state: "Washington", enacted: 2019, provision: "Licensed reduction facilities" }
        - { state: "Colorado", enacted: 2021, provision: "Natural reduction authorization" }
        - { state: "Oregon", enacted: 2021, provision: "Alternative disposition authorization" }
        - { state: "California", enacted: 2022, provision: "Reduction program operative in 2027" }
        - { state: "New York", enacted: 2022, provision: "Cemetery corporation facilities" }
        - { state: "Vermont", enacted: 2022, provision: "Natural organic reduction authorization" }
        - { state: "Nevada", enacted: 2023, provision: "Funeral service authorization" }
  - id: california-human-composting-law
    icon: "fa-solid fa-calendar-days"
    title: "California Human Composting Law"
    paragraphs:
      - "California's 2022 enactment establishes a reduction chamber approval system beginning January 1, 2027. Equipment makers must enter that approval process before their chambers can be used in the state. California therefore belongs among states with enacted authorization, while its local reduction program remains a future option in October 2026."
      - "Minnesota's 2024 enactment also separated passage from implementation. Its facility rules became effective July 1, 2025, requiring a licensed facility, an approved system, refrigeration for bodies awaiting reduction, and safeguards for identification and release of the remains."
  - id: disposition-human-composting-remains
    icon: "fa-solid fa-file-signature"
    title: "Human Composting and Family Instructions"
    paragraphs:
      - "Delaware's 2024 law added natural organic reduction to the written declaration people use to specify disposition of their remains. A person can name the method and direct what should happen to the resulting material. The same form allows designation of someone else to make the decision."
      - "New Jersey's 2025 law requires a funeral director to inform customers in writing about participating cemeteries as an option for placing reduced remains. Families can choose a conventional memorial location after a different form of disposition."
