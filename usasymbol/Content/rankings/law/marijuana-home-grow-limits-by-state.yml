sections:
  - id: why-marijuana-home-grow-limits-differ
    icon: fa-solid fa-leaf
    title: Why Marijuana Home Grow Limits Differ
    paragraphs:
      - "Michigan leads because its 2018 adult-use initiative allows twelve plants at a residence without a separate flowering cap. A gardener can therefore keep all twelve in flower. New York instead divides an individual's allowance into three mature and three immature plants, requiring fewer plants to flower at the same time."
      - "Vermont ties for the smallest mature allowance because its personal-cultivation statute limits an entire dwelling to two mature plants and four immature plants. Maryland also ties at two mature plants, but counts immature plants inside the same two-plant total. Vermont's separate allowance lets a grower maintain young replacement plants alongside a flowering crop."
  - id: marijuana-home-grow-household-limits
    icon: fa-solid fa-house
    title: Marijuana Home Grow Household Limits
    paragraphs:
      - "California permits six plants at a residence regardless of how many adults share the home. Arizona permits six per adult but caps a residence with multiple adults at twelve. Two roommates can therefore have different combined allowances on opposite sides of the state line, even though one adult has the same six-plant maximum in each state."
      - "Rhode Island's three-mature and three-immature allowance belongs to the dwelling, while Connecticut gives that allowance to each adult within a twelve-plant household ceiling. The distinction matters before adding another grower, because an individual allowance does not always create another household allowance."
    table:
      columns:
        state: State
        one_adult: One Adult
        residence: Residence Rule
      rows:
        - state: California
          one_adult: 6 total plants
          residence: 6 total regardless of adults
        - state: Arizona
          one_adult: 6 total plants
          residence: 12 total with multiple adults
        - state: Connecticut
          one_adult: 3 mature and 3 immature
          residence: 12 total plants
        - state: Rhode Island
          one_adult: 3 mature and 3 immature
          residence: 3 mature and 3 immature total
  - id: restricted-marijuana-home-growing
    icon: fa-solid fa-id-card
    title: States with Restricted Marijuana Home Growing
    paragraphs:
      - "Missouri allows six flowering plants only after an adult obtains a consumer cultivation card. The allowance also includes separate groups of larger and smaller nonflowering plants, and two approved cardholders can share a residence within doubled category limits. Consumer cultivation is therefore legal without becoming an unrestricted gardening right for every adult."
      - "Nevada's six-plant allowance is tied to distance from a licensed adult-use store. The adult-use statute generally prohibits cultivation within twenty-five miles of one, while separate medical rules provide different exceptions. Legal access to a store and legal permission to grow at home can therefore depend on different parts of Nevada law."
