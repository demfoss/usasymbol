  title: Marijuana Home Grow Limits | State Laws & Map
  description: Michigan permits up to 12 homegrown cannabis plants per residence. Maryland, Montana, and Vermont allow one adult at most 2 mature plants.
page:
  h1: Marijuana Home Grow Limits by State
  quick_answer:
    - "Marijuana home grow limits by state reach 12 mature plants for one adult in Michigan. Its adult-use law sets a twelve-plant limit per residence without reserving part of that allowance for immature plants."
    - "Maryland, Montana, and Vermont tie at 2 mature plants for one adult. Maryland's two-plant household ceiling counts every plant, while Montana and Vermont also provide separate allowances for seedlings or immature plants."
    - "Maine allows one adult 6 mature plants, 12 immature plants, and unlimited seedlings. Nevada also allows 6 mature plants, but adult-use cultivation is generally prohibited within 25 miles of a licensed adult-use store."
  methodology: "State laws and agency guidance checked October 8, 2026. Rank and map use the mature-plant upper bound for one adult in 20 listed states, including undivided all-plant caps, subject to household ceilings and excluding medical-only rights and DC."
