faq:
  - question: How many marijuana plants can two adults grow in Michigan?
    answer: "Two adults sharing a Michigan residence remain subject to twelve total adult-use plants at that residence. A second adult does not double the allowance to twenty-four."
  - question: How many cannabis plants can you grow in New York?
    answer: "A New York adult can grow three mature and three immature plants. Multiple adults in one residence are limited to six mature and six immature plants altogether."
  - question: Do seedlings count toward Maine's home grow limit?
    answer: "Maine separately allows unlimited seedlings in addition to six mature and twelve immature plants per adult. Plants must meet the legal definition for their stage, so a larger immature plant cannot simply be called a seedling."
  - question: How many marijuana plants can you grow in Ohio?
    answer: "Ohio permits six plants per adult and twelve per residence. The home-grow statute effective March 20, 2026 requires cultivation at the adult's primary residence in a secured enclosed area."
  - question: Can you grow marijuana outdoors in Connecticut?
    answer: "Connecticut's home-grow permission requires indoor cultivation in a secured area. An adult's three-mature and three-immature allowance does not authorize an outdoor garden."
  - question: How many marijuana plants can you grow in Virginia?
    answer: "Virginia permits four plants per household, with no separate flowering cap inside that total. Each plant must carry the required personal-use identification tag, and additional adults do not increase the household allowance."
