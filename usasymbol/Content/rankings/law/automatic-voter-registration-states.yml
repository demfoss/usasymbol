  - id: states-without-automatic-voter-registration
    icon: "fa-solid fa-ban"
    title: "States Without Automatic Voter Registration"
    paragraphs:
      - "Twenty-six states have no automatic registration. They are Alabama, Arizona, Arkansas, Florida, Idaho, Indiana, Iowa, Kansas, Kentucky, Louisiana, Mississippi, Missouri, Montana, Nebraska, New Hampshire, North Carolina, North Dakota, Ohio, Oklahoma, South Carolina, South Dakota, Tennessee, Texas, Utah, Wisconsin and Wyoming."
      - "North Dakota is the only state with no voter registration at all, so residents show an ID at the polls and there is no list to automate. Voters in the other 25 still [register to vote](/rankings/government/voter-registration-rate-by-state) through forms, online portals or, in some states, [same-day registration](/rankings/law/same-day-voter-registration-states)."
  - id: how-automatic-voter-registration-works
    icon: "fa-solid fa-envelope-open-text"
    title: "How Automatic Voter Registration Works"
    paragraphs:
      - "Every state on the list uses an opt-out model. An agency sends a person's citizenship and address data to election officials, and the person is registered unless they decline. In 13 states the customer can decline during the agency visit, while in 10 states and D.C. a mailer sent afterward gives the chance to opt out."
      - "Most states passed a law, but 3 acted through the executive branch and 3 through voters. Georgia, Colorado and Pennsylvania used administrative action. Alaska, Michigan and Nevada approved ballot measures, and Alaska built its system around the application for the Permanent Fund Dividend, the yearly payment to residents."
