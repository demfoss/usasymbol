faq:
  - question: "Which state was first to have automatic voter registration?"
    answer: "Oregon. Its law passed in March 2015 and took effect in 2016, which made it the first state to put automatic registration into practice. California enacted a law the same year."
  - question: "How many states have automatic voter registration?"
    answer: "Twenty-four states have enacted it, including Hawaii, whose system starts in 2027. The other 26 states have none, though many let residents register online."
  - question: "Does Georgia have automatic voter registration?"
    answer: "Yes. Georgia began registering people through driver's license transactions in 2016 under administrative action, not a new statute. Colorado did the same in 2017, and Pennsylvania in 2023."
  - question: "Which states adopted automatic voter registration by ballot measure?"
    answer: "Alaska in 2016, then Michigan and Nevada in 2018. In all three, voters approved it directly rather than waiting for a legislature."
  - question: "What does opt-out voter registration mean?"
    answer: "An eligible person who does business with a covered agency is registered unless they decline. Declining can happen at the counter or by returning a mailer, depending on the state. Registration is never compulsory."
  - question: "Does Texas have automatic voter registration?"
    answer: "No. Texas is one of 26 states without it, so a resident must submit a registration application on their own."
  - question: "Which state was the latest to pass automatic voter registration?"
    answer: "Hawaii, in 2026. Residents who apply for or renew a license or state ID will be registered unless they opt out, beginning in 2027."
