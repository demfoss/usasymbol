page:
  h1: "Automatic Voter Registration States"
  quick_answer:
    - "Automatic voter registration states began with Oregon and California, which both enacted it in 2015. Oregon was the first to put it into practice, in 2016, and DMV registrations there quadrupled in the first year."
    - "Hawaii is the newest, with a 2026 law that starts registering license and ID applicants in 2027. Georgia, Colorado and Pennsylvania got there without a statute, through administrative action."
    - "Twenty-six states have no automatic registration. North Dakota is the unusual case, because it has no voter registration at all."
  methodology: "Year each state enacted its automatic voter registration law, ballot measure or administrative policy, checked October 2026 against Brennan Center histories, MIT Election Lab and FindLaw state lists. Opt-in systems and Washington, D.C. are excluded."
  sources:
