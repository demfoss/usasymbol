sections:
  - id: first-state-with-automatic-voter-registration
    icon: "fa-solid fa-id-card"
    title: "First State With Automatic Voter Registration"
    paragraphs:
      - "Oregon passed the first automatic registration law in March 2015 and began using it in 2016. Before then, a person renewing a license at the DMV had to ask for a voter form. Afterward, eligible people were registered unless they declined, and registrations at Oregon DMV offices quadrupled in the first year."
      - "Oregon already voted almost entirely by mail, so a clean, current voter list was the one missing piece. California enacted its own law the same year. Vermont began on January 1, 2017, and its registration rate was up 62 percent compared with the first six months of 2016."
