sections:
  - id: why-bottle-deposits-differ
    icon: fa-solid fa-coins
    title: Why Bottle Deposits Differ by State
    paragraphs:
      - "Connecticut ties for the highest beer-container deposit at $0.10 because its 2021 bottle-bill legislation set that refund for sales beginning January 2024. Michigan's ten-cent system originated with a voter-approved law in 1976, while Oregon's law contains a refund trigger tied to the return of eligible containers."
      - "Vermont ties for the lowest beer-container deposit at $0.05 because its program separates ordinary covered beverages from most spirits bottles, which carry $0.15. Maine also distinguishes beer from wine and spirits. A beer can and a liquor bottle can therefore have different refund labels even on the same store shelf."
  - id: california-bottle-deposit-amounts
    icon: fa-solid fa-bottle-water
    title: California Bottle Deposit Amounts
    paragraphs:
      - "California's $0.05 beer-container deposit applies below 24 ounces. Containers of 24 ounces or more carry $0.10, and certain wine and spirits boxes, bladders, and pouches carry $0.25. The package controls the refund amount, so a wine pouch can have a different redemption value from a glass bottle."
    table:
      columns:
        package: Eligible Package
        refund: Refund
      rows:
        - package: Bottle or can below 24 ounces
          refund: "$0.05"
        - package: Bottle or can of 24 ounces or more
          refund: "$0.10"
        - package: Wine or spirits box, bladder, or pouch
          refund: "$0.25"
  - id: bottle-deposit-refunds
    icon: fa-solid fa-recycle
    title: Bottle Deposit Refunds by State
    paragraphs:
      - "Hawaii refunds the $0.05 deposit through certified redemption centers. Buyers also pay a separate container fee that supports the program and is not refunded, so the full charge at checkout is larger than the money returned for an empty can."
      - "New York also refunds $0.05, but the container must carry a New York deposit label and be returned within the state. Stores accept the types and brands they sell, while registered redemption centers provide another return point."
