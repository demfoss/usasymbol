page:
  h1: Bottle Deposit States
  quick_answer:
    - "Bottle deposit states with the highest standard beer-container refund are Connecticut, Michigan, and Oregon at $0.10 each. Connecticut's law requires that amount for covered containers sold from January 2024."
    - "California, Hawaii, Iowa, Maine, Massachusetts, New York, and Vermont tie at $0.05 for a standard beer bottle or can. Vermont treats spirits separately, with a larger refund for most liquor bottles."
    - "California charges different redemption amounts for different packages. A small beer can carries $0.05, while certain wine and spirits boxes, bladders, and pouches carry $0.25."
  methodology: "State agency rules checked October 7, 2026. Rank and map compare refundable deposits in USD for a nonrefillable 12-ounce beer bottle or can in the ten deposit states. Other states and Guam are excluded."
