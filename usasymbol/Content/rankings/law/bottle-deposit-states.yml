faq:
  - question: Which states have bottle deposits?
    answer: "California, Connecticut, Hawaii, Iowa, Maine, Massachusetts, Michigan, New York, Oregon, and Vermont have statewide beverage-container deposit programs. Deposits apply to eligible containers, which include cans as well as bottles."
  - question: How much is the bottle deposit in Michigan?
    answer: "An eligible standard beer bottle or can carries a $0.10 deposit in Michigan. The deposit is refundable when the empty container is properly returned."
  - question: Does Maine have a bottle deposit on wine?
    answer: "Yes. Maine requires at least $0.15 on wine and spirits containers over 50 milliliters. Beer containers carry $0.05."
  - question: Are milk containers covered by Maine's bottle bill?
    answer: "No. Maine excludes milk and dairy-derived products, along with Maine-produced apple cider and blueberry juice. Its beer-container refund is $0.05."
  - question: Can you return bottles bought in another state to New York?
    answer: "New York's $0.05 refund is for eligible containers purchased in New York and returned there. A deposit marking for another state does not establish eligibility for a New York refund."
