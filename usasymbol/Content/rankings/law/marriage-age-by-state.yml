page:
  h1: "Marriage Age by State"

  quick_answer:
    - "Marriage age without parental consent is 18 in every U.S. state except Nebraska, where the age of majority is 19. As of 2025, at least 18 states have enacted absolute bans on marriage under 18 with no exceptions."
    - "Delaware was the first state to ban child marriage in 2018. California has no statutory minimum marriage age; a superior court must approve any marriage involving a minor, but no age floor is set in state law."

  methodology: "Minimum ages and consent requirements reflect state statutes reviewed as of January 2026. Laws in this area have changed frequently since 2018 and continue to change. Marriage laws change by state and may be updated by new legislation. This page is for general informational purposes only and is not legal advice. Always check the official state statute or county clerk before applying for a marriage license."

