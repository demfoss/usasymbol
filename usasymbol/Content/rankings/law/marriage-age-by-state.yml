faq:
  - question: "What is the legal age to get married in the United States?"
    answer: "The minimum age to marry without parental consent is 18 in every state except Nebraska, where it is 19. In states that have not banned child marriage, minors as young as 16 may marry with parental consent and court approval. California has no statutory minimum age but requires a court order for anyone under 18."

  - question: "Can you get married at 16 in the U.S.?"
    answer: "Yes, in more than 20 states, a 16-year-old may marry with parental consent and, in most cases, court approval. States where this is permitted include Alabama, Alaska, Arizona, Colorado, Idaho, Iowa, Kansas, Louisiana, Missouri, Nevada, New Hampshire, New Mexico, North Carolina, North Dakota, Oklahoma, South Carolina, South Dakota, Texas, Utah, West Virginia, Wisconsin, and Wyoming."

  - question: "What states ban marriage under 18?"
    answer: "As of 2025, at least 18 states have enacted absolute bans on marriage under 18 with no exceptions: Connecticut, Delaware, Florida, Hawaii, Illinois, Maine, Maryland, Massachusetts, Michigan, Minnesota, Montana, New Jersey, New York, Ohio, Pennsylvania, Rhode Island, Vermont, and Virginia. Delaware was the first to act, in 2018."

  - question: "What states allow minors to marry?"
    answer: "States that still allow marriage under 18 with parental consent and court approval include Alabama, Alaska, Arizona, Arkansas, California, Colorado, Georgia, Idaho, Indiana, Iowa, Kansas, Kentucky, Louisiana, Mississippi, Missouri, Nebraska, Nevada, New Hampshire, New Mexico, North Carolina, North Dakota, Oklahoma, Oregon, South Carolina, South Dakota, Tennessee, Texas, Utah, Washington, West Virginia, Wisconsin, and Wyoming."

  - question: "Can you get married without parental consent before 18?"
    answer: "In most states, no. The standard age to marry without any parental consent is 18. Nebraska requires 19. Emancipated minors in some states may be treated as adults for marriage purposes, bypassing the parental consent requirement, but emancipation itself requires a court order."

  - question: "What is the minimum marriage age in California?"
    answer: "California has no statutory minimum marriage age. Under California Family Code Section 302, any marriage involving a person under 18 requires a superior court order. The judge must determine the marriage is in the minor's best interest. No age floor appears in state law, which makes California an outlier among all 50 states."

