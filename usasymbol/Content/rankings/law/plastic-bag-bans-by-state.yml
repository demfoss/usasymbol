page:
  h1: Plastic Bag Bans by State
  quick_answer:
    - "Plastic bag bans by state began with California's 2014 enactment. Voters upheld the law after a referendum suspended implementation, and the statewide checkout rule took effect in 2016."
    - "Rhode Island has the latest original enactment, in 2022. Its statewide rule took effect in 2024 after communities had already adopted local restrictions."
    - "New Jersey enacted its ban in 2020 and implemented it in 2022. Large grocery stores also cannot supply single-use paper carryout bags, making reusable bags especially useful for a grocery trip."
  methodology: "State laws checked October 8, 2026. All 11 statewide checkout-bag bans are ordered by original enactment year, excluding local bans such as Hawaii's county rules, fee-only laws, and territories."
