sections:
  - id: plastic-bag-ban-history
    icon: fa-solid fa-landmark
    title: Plastic Bag Ban History by State
    paragraphs:
      - "California leads with its 2014 enactment because lawmakers extended plastic bag restrictions beyond individual city ordinances. A referendum suspended the new law before its planned implementation. Voters upheld it in 2016, allowing the statewide rule to take effect."
      - "Rhode Island comes last with its 2022 enactment. Local restrictions and a plastics task force preceded the statewide law, which established a common checkout rule across municipalities in 2024. The task force connected bag restrictions with reducing litter and expanding access to reusable alternatives."
  - id: plastic-bag-ban-exceptions
    icon: fa-solid fa-bag-shopping
    title: Plastic Bag Ban Exceptions by State
    paragraphs:
      - "Colorado's 2021 law exempts restaurants and qualifying small stores operating only within Colorado. A shopper can therefore encounter lawful plastic bags at one business and a prohibition at a nearby larger retailer. The statewide plastic checkout ban began in 2024 after an earlier fee phase."
      - "Vermont's 2019 law prohibits thick and compostable plastic checkout bags, but permits bags used for loose produce, meat, prescription medicines, and dry cleaning. Delaware's 2019 law, expanded for broader retail coverage, likewise prevents stores from avoiding the checkout restriction simply by switching to thicker plastic film."
  - id: plastic-bag-laws-in-california
    icon: fa-solid fa-recycle
    title: California Plastic Bag Law Changes
    paragraphs:
      - "California's 2014 ban initially allowed qualifying thicker plastic bags to be sold as reusable bags. The 2026 rule closes that route at covered stores, so a thicker film bag is no longer an automatic substitute for the prohibited thin bag. Customers can bring their own reusable bags."
      - "Oregon's 2019 checkout ban still permits compliant reusable plastic bags in 2026, but an enacted expansion closes that route in 2027. Its [bottle deposit law](/rankings/law/bottle-deposit-states) uses a different waste-reduction mechanism by refunding a container deposit when the container is returned."
