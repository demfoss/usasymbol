faq:
  - question: Which states have statewide plastic bag bans?
    answer: "California, Colorado, Connecticut, Delaware, Maine, New Jersey, New York, Oregon, Rhode Island, Vermont, and Washington have statewide checkout restrictions. Product packaging bags and some businesses qualify for exceptions under individual laws."
  - question: Are plastic grocery bags banned in California?
    answer: "Yes, at the stores covered by the statewide law. Since 2026, the former exemption for qualifying thick plastic film checkout bags no longer allows those stores to provide them."
  - question: Can New Jersey grocery stores give out paper bags?
    answer: "A grocery store occupying at least 2,500 square feet cannot provide or sell single-use paper carryout bags. Other retail and food service businesses can supply paper bags if they meet the applicable requirements."
  - question: Why can stores still sell plastic bags in Washington?
    answer: "Washington permits reusable plastic film bags meeting its specifications. In 2026, the minimum pass-through charge is $0.12 for these bags and $0.08 for qualifying paper bags, with exemptions for customers on specified food assistance programs."
  - question: Are compostable plastic bags allowed in Vermont?
    answer: "No, as checkout carryout bags. Vermont includes compostable plastic in its prohibition, while allowing bags for specific uses such as loose produce or protecting meat."
  - question: Do New York stores have to charge for paper bags?
    answer: "New York allows counties and cities to adopt a paper carryout bag fee. The statewide plastic bag prohibition does not make that local fee universal."
