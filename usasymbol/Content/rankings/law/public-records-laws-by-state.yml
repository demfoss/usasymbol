sections:
  - id: longest-and-shortest-records-deadlines
    icon: "fa-solid fa-calendar-days"
    title: "Longest and Shortest Records Deadlines"
    paragraphs:
      - "Delaware's 15-business-day window follows a law that permits three kinds of first reply, access, denial or a notice explaining why more time is needed. Archived files, a large request or legal advice can trigger the delay route. A requester must still receive a good-faith estimate rather than an indefinite promise."
      - "Vermont's three-business-day rule defines prompt action tightly, making a missed deadline a deemed denial. Kansas and Missouri also require action within three business days, but their laws explicitly require explanations when production takes longer. The short window gives a requester an answer while the agency locates records."
    table:
      columns:
