faq:
  - question: "How long does Delaware have to answer a public records request?"
    answer: "Delaware must respond as soon as possible and within 15 business days. A permitted delay requires a reason and a good-faith estimate of the additional time needed."
  - question: "Does Washington have to provide public records within five days?"
    answer: "Washington requires an initial reply within five business days. The agency may acknowledge receipt and give a reasonable time estimate, so that response can precede delivery of the records."
  - question: "What is the public records response deadline in Pennsylvania?"
    answer: "Pennsylvania allows five business days after the open-records officer receives a written request. Silence beyond that deadline counts as a denial unless the agency has issued an applicable response."
  - question: "How quickly must Massachusetts respond to a records request?"
    answer: "Massachusetts requires records or a detailed written response within 10 business days. The letter must identify proposed withholding and explain any need for additional production time."
  - question: "What happens if a Vermont public records request gets no response?"
    answer: "Vermont treats failure to meet the applicable deadline as a denial. The ordinary rule is three business days, with specified exceptions for records in active use or storage and unusual circumstances."
  - question: "What must Nebraska include in a delayed records response?"
    answer: "Nebraska's four-business-day reply must explain the delay, estimate costs and give the earliest practicable fulfillment date. The agency must also offer an opportunity to modify or prioritize the requested items."
