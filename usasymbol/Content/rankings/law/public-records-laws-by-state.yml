  - id: public-records-acknowledgement
    icon: "fa-solid fa-envelope-open-text"
    title: "Public Records Acknowledgement Deadlines"
    paragraphs:
      - "Oregon requires acknowledgement or completion within five business days. An acknowledgement identifies whether the body holds the requested records or is uncertain about custody. A separate provision then governs the next response stage, so the first letter and the release of documents are distinct steps."
      - "New York permits an acknowledgement within five business days, but the letter must state an approximate date for granting or denying the request. Public employee salary information receives specific protection against a privacy-based withholding claim, making records requests one route to documents behind [governor salaries](/rankings/government/governor-salary-by-state)."
