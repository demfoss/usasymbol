  description: "Delaware allows 15 business days for an initial records response. Georgia, Kansas, Missouri, and Vermont use three. Some replies acknowledge receipt."
page:
  h1: "Public Records Laws by State"
  quick_answer:
    - "Public records laws give Delaware 15 business days to provide records, deny access, or explain a permitted delay. A request for archived documents can therefore receive a time estimate instead of the documents themselves."
    - "Georgia, Kansas, Missouri, and Vermont require action within three business days. Missouri requires a detailed explanation when access is delayed, including the earliest time and place the records will be available."
    - "Maine's five-working-day rule requires an acknowledgement. Washington also allows an acknowledgement within five business days, but it must include a reasonable estimate of the time needed to respond."
  methodology: "Official state codes and open-records offices, checked October 7, 2026, for initial business or working day deadlines in 20 listed states. All unlisted states, special requests and extended deadlines are excluded, with eligible ordinary requests assumed."
