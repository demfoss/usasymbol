faq:
  - question: "Which states have banned abortion in 2026"
    answer: "13 states ban abortion at fertilization in 2026: Alabama, Arkansas, Idaho, Indiana, Kentucky, Louisiana, Mississippi, North Dakota, Oklahoma, South Dakota, Tennessee, Texas, and West Virginia. All activated their bans after the Supreme Court's Dobbs v. Jackson decision in June 2022."

  - question: "Is abortion legal in Texas in 2026"
    answer: "No. Texas bans abortion at fertilization under the Human Life Protection Act, which activated after Dobbs in June 2022. Texas also passed SB 8 (2021), which allows private civil lawsuits against providers. 100% of Texas counties have no in-state abortion provider."

  - question: "What states have no gestational limit on abortion"
    answer: "8 states place no gestational limit on abortion in 2026: Alaska, Colorado, Maryland, Minnesota, New Jersey, New Mexico, Oregon, and Vermont. Maryland and Vermont have added state constitutional abortion protections since Dobbs."

  - question: "How many weeks is abortion legal in Florida"
    answer: "Florida restricts abortion at 6 weeks under SB 300 (2023), which took effect May 1, 2024. The 6-week limit is measured from detection of cardiac activity. A prior 15-week restriction (HB 5, 2022) had been in effect from July 2022 through April 2024."

  - question: "What is the abortion limit in New York"
    answer: "New York allows abortion up to 24 weeks under the Reproductive Health Act (2019). After 24 weeks, abortion is permitted when the fetus is not viable or to protect the patient's life or health. No mandatory waiting period applies."

  - question: "What does legal to viability mean for abortion limits"
    answer: "Viability is the point at which a fetus can survive outside the womb with medical support, typically between 22 and 24 weeks of pregnancy. 15 states use viability as their on-demand gestational limit: Arizona, California, Connecticut, Delaware, Hawaii, Illinois, Maine, Michigan, Missouri, Montana, New Hampshire, Ohio, Rhode Island, Washington, and Wyoming."

