seo:
  title: "Abortion Laws by State 2026 | Gestational Limit Map"
  description: "13 states have total abortion bans after Dobbs. Gestational limits, waiting periods, and provider access for all 50 states."

page:
  h1: "Abortion Laws by State"

  quick_answer:
    - "13 states ban abortion at fertilization in 2026: Alabama, Arkansas, Idaho, Indiana, Kentucky, Louisiana, Mississippi, North Dakota, Oklahoma, South Dakota, Tennessee, Texas, and West Virginia. All activated their bans after the Supreme Court's Dobbs v. Jackson ruling in June 2022."
    - "8 states place no gestational limit on abortion: Alaska, Colorado, Maryland, Minnesota, New Jersey, New Mexico, Oregon, and Vermont. Several added state constitutional protections after Dobbs, including Maryland and Vermont."
    - "15 states allow abortion up to viability, typically 22 to 24 weeks. Missouri and Ohio moved from bans or near-total restrictions to viability access after ballot measures passed in 2024 and 2023 respectively."

  methodology: "Gestational limits reflect state law as of June 2026 via Guttmacher Institute and KFF; provider data (counties without a provider) is from 2017 Guttmacher data and predates post-Dobbs clinic changes. Laws in several states remain subject to active litigation, and this page is for informational purposes only and does not constitute legal advice."

  sources:
    - name: "Guttmacher Institute — State Abortion Policy"
      url: "https://www.guttmacher.org/state-policy/explore/overview-abortion-laws"
      description: "State-by-state abortion law tracker including gestational limits, waiting periods, and provider counts"
    - name: "KFF — Abortion in the United States"
      url: "https://www.kff.org/womens-health-policy/issue-brief/abortion-in-the-united-states/"
      description: "State abortion policy tracker and law summaries"
    - name: "Center for Reproductive Rights — After Roe Fell"
      url: "https://reproductiverights.org/maps/abortion-laws-by-state/"
      description: "State-by-state abortion legal status map with legislative and court updates"

