page:
  h1: "Security Deposit Laws by State"

  quick_answer:
    - "Nevada sets the highest security deposit limit in the country at 3 months of rent, and no other state allows more than 2 months."
    - "Fourteen states cap the deposit at 1 month of rent, the lowest and most common limit, including California, Maryland, New York, and Massachusetts. Eleven states allow up to 2 months, including Colorado, Georgia, and Virginia."
    - "Arizona, Michigan, and New Jersey sit in the middle at 1.5 months. Twenty-one other states set no statutory limit and are marked No limit in the table."

  methodology: "Limits show the maximum security deposit a landlord may charge under state law on a standard residential lease, in months of rent, checked against state statutes and legal references in September 2026. States with no statutory limit are marked No limit, and exceptions appear in the notes."

