faq:
  - question: "What is the maximum security deposit a landlord can charge?"
    answer: "Among the 29 states with a cap, the limit runs from 1 month of rent to 3 months of rent. Nevada allows the most, while 14 states stop at 1 month."

  - question: "Which state has the highest security deposit limit?"
    answer: "Nevada has the highest limit at 3 months of rent. The next highest limit is 2 months, shared by 11 states."

  - question: "What is the security deposit limit in California?"
    answer: "California caps deposits at 1 month of rent for most landlords. Small owner-landlords with no more than two properties and four rental units may charge 2 months, but never to active service members."

  - question: "Is there a security deposit limit in Texas?"
    answer: "Texas sets no statutory limit, so it does not appear in the table. Florida, Ohio, Oregon, and Washington also have no cap."

  - question: "What is the security deposit limit in Georgia?"
    answer: "Georgia caps deposits at 2 months of rent on leases entered into or renewed on or after July 1, 2024. Colorado and Virginia use the same 2-month limit."

  - question: "What is the security deposit limit in New York?"
    answer: "New York limits deposits to 1 month of rent, the same cap used in Massachusetts and Rhode Island."

