sections:
  - id: "states-with-the-highest-security-deposit-limits"
    icon: "fa-solid fa-sack-dollar"
    title: "States With the Highest Security Deposit Limits"
    paragraphs:
      - "Nevada allows landlords to collect up to 3 months of rent, triple the limit in the 14 states that stop at 1 month. Eleven states set the next highest cap at 2 months, including Alaska, Arkansas, Colorado, Georgia, Iowa, Maine, Missouri, and Virginia."
      - "Several 2-month caps carry exceptions. Alaska sets no limit when rent exceeds $2,000 a month, and Pennsylvania drops to 1 month from the second year of a tenancy. Connecticut also lowers its cap to 1 month for tenants age 62 and older."

  - id: "states-with-the-lowest-security-deposit-limits"
    icon: "fa-solid fa-house-lock"
    title: "States With the Lowest Security Deposit Limits"
    paragraphs:
      - "Fourteen states cap deposits at 1 month of rent, the lowest limit on record and the most common one. Alabama, California, Delaware, Hawaii, Kansas, Maryland, Massachusetts, Nebraska, New Hampshire, New Mexico, New York, North Dakota, Rhode Island, and South Dakota make up the group."
      - "Some of these limits shift for specific leases. Kansas allows 1.5 months on furnished units, Nebraska allows 1.25 months when the tenant has a pet, and New Mexico sets no limit on leases of 1 year or longer."

  - id: "states-with-no-security-deposit-limit"
    icon: "fa-solid fa-unlock"
    title: "States With No Security Deposit Limit"
    paragraphs:
      - "Twenty-one states set no statutory cap, including Florida, Texas, Ohio, Oregon, and Washington. Those states are marked No limit in the table and left uncolored on the map."
      - "Refund rules apply even where no cap exists, and [security deposit return deadlines by state](/rankings/law/security-deposit-return-deadlines-by-state) covers how long landlords have to return the money."

