  - id: florida-gun-waiting-period-exceptions
    icon: "fa-solid fa-scale-balanced"
    title: "Florida Gun Waiting Period Exceptions"
    paragraphs:
      - "Florida's three-day wait has an exemption for a concealed weapons or concealed firearms license holder. A person who carries under the state's permitless-carry rules does not automatically hold that license, so permission to carry and permission to skip the purchase wait can produce different answers. The license distinction also appears in [concealed carry laws](/rankings/law/gun-laws-concealed-carry)."
      - "New Mexico's seven-day wait also exempts concealed-handgun license holders. A court order entered in August 2026 barred enforcement against two named plaintiffs, while the general waiting-period requirement continued for other covered buyers."
