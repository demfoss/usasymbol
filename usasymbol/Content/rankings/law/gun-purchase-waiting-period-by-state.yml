  title: "Gun Purchase Waiting Period by State | Map & Laws"
  description: "California requires 10 calendar days before firearm delivery. Washington requires 10 business days. Several states impose a three-day wait."
page:
  h1: "Gun Purchase Waiting Period by State"
  quick_answer:
    - "Gun purchase waiting periods reach 10 days in California and Washington. California counts calendar days, while Washington counts business days and also requires approval of the background check before delivery."
    - "Illinois requires a three-day wait, expressed as 72 hours in its law. The clock begins with the application to purchase, so a firearm passing an immediate background check still cannot be handed over early."
    - "Maryland requires seven days for regulated firearms, including handguns. Ordinary rifles and shotguns do not automatically fall into that same legal category."
  methodology: "State laws and agency guidance checked October 7, 2026 cover ten states with fixed delivery waits. Days retain statutory day types, excluding permit-issuance waits, local rules and states without fixed waits."
