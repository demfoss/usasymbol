sections:
  - id: longest-gun-purchase-waiting-periods
    icon: "fa-solid fa-calendar-days"
    title: "Longest Gun Purchase Waiting Periods"
    paragraphs:
      - "Washington's 10-day wait takes longer to run than California's 10-day wait because Washington skips nonbusiness days. Its law makes time and approval separate requirements, so a dealer needs both the completed wait and confirmation that the buyer may possess the firearm."
      - "Illinois sits in the three-day group because its delivery rule specifies 72 hours from the purchase application. A quick background-check approval cannot shorten those hours, which keeps the waiting period separate from the identity and criminal-record check."
    table:
