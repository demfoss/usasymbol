faq:
  - question: "What is the gun purchase waiting period in California?"
    answer: "California requires 10 calendar days before delivery. The dealer record of sale starts the clock, and an unresolved eligibility review can extend the delay."
  - question: "What is the gun purchase waiting period in Washington?"
    answer: "Washington requires 10 business days after the dealer requests the background check. Delivery must also wait for confirmation that the purchaser is eligible."
  - question: "Does Florida have a three-day gun waiting period?"
    answer: "Florida requires three days excluding weekends and legal holidays, or completion of the required records checks, whichever is later. Trade-ins and some qualifying rifle and shotgun purchases are exempt."
  - question: "What is the gun purchase waiting period in Maryland?"
    answer: "Maryland requires seven days for regulated firearms. Handguns fall within that category, while many ordinary rifles and shotguns do not."
  - question: "Does Maine have a gun waiting period?"
    answer: "Maine's covered sales have a 72-hour wait, equal to three days. The agreement must identify the specific firearm, so a general conversation about buying a gun does not begin the clock."
  - question: "What is the gun purchase waiting period in Vermont?"
    answer: "Vermont generally requires 72 hours, equal to three days, after the dealer receives the federal transaction identifier. Its law also provides a seven-business-day alternative measured from the dealer's initial contact with the background-check system."
