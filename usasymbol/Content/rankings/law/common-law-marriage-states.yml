page:
  h1: "Common-Law Marriage States"

  quick_answer:
    - "Common-law marriage states are Colorado, Iowa, Kansas, Montana, Oklahoma, Rhode Island, and Texas. A couple there can marry without a license by agreeing to be married and presenting themselves as spouses."
    - "Living together is not enough anywhere. No state turns a couple into spouses after a set number of years, and New Hampshire's three-year rule applies only to inheritance after a partner dies."
    - "South Carolina was the most recent state to end new common-law marriages, in 2019, and Alabama ended them in 2017."

  methodology: "Status reflects whether a state lets couples form a new common-law marriage as of 2026. Year Abolished is the year new common-law marriages ended. Informational only, not legal advice."

  sources:
    - name: "Texas Family Code, Chapter 2, Subchapter E (Informal Marriage)"
