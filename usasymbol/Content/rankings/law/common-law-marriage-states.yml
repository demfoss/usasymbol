sections:
  - id: "states-that-recognize-common-law-marriage"
    icon: "fa-solid fa-ring"
    title: "States That Recognize Common-Law Marriage"
    paragraphs:
      - "Colorado, Iowa, Kansas, Montana, Oklahoma, Rhode Island, and Texas still let couples marry without a license or ceremony. The couple must agree to be married, live together, and present themselves to others as husband and wife or spouses, for example by sharing a last name or filing joint tax returns."
      - "Texas calls it informal marriage and lets couples file a declaration with the county clerk, which turns a private agreement into a public record. Once formed, a common-law marriage is a full marriage, so ending it takes a regular divorce. That divorce shows up in the [divorce rate by state](/rankings/demographics/highest-divorce-rates) like any other."

  - id: "why-states-abolished-common-law-marriage"
    icon: "fa-solid fa-landmark"
    title: "Why States Abolished Common-Law Marriage"
    paragraphs:
      - "Common-law marriage made sense on the frontier, where a couple might live weeks away from a minister or a judge. As courthouses spread and marriage licenses became routine, the old rule caused more trouble than it solved."
      - "Disputes over inheritance, pensions, and benefits often came down to whether a dead partner had really agreed to marry. States answered by setting a cutoff date. Pennsylvania ended new common-law marriages in 2005, Alabama in 2017, and South Carolina in 2019. Massachusetts moved first, banning them as a colony in 1646."

  - id: "does-living-together-make-you-common-law-married"
    icon: "fa-solid fa-house"
    title: "Does Living Together Make You Married"
    paragraphs:
      - "No. The popular idea that seven years under one roof creates a marriage is a myth in every state. In Texas or Colorado a couple can become married in far less time, but only if both partners intend to be married and act that way in public."
      - "New Hampshire is the closest thing to a time rule. A partner who lived with the other as a spouse for three years until death can inherit as a widow or widower, but the couple was never married in any other sense."

