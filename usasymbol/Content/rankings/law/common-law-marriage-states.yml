faq:
  - question: "Is Texas a common-law marriage state?"
    answer: "Yes. Texas calls it informal marriage. A couple who agrees to be married, lives together in Texas, and presents themselves as married is legally married."

  - question: "How long do you have to live together to be common-law married?"
    answer: "No state sets a number of years. A common-law marriage depends on an agreement to be married and acting as a married couple, not on time spent together."

  - question: "Is Florida a common-law marriage state?"
    answer: "No. Florida abolished common-law marriage in 1968, although it still honors one formed before then or in a state that allows it."

  - question: "Is California a common-law marriage state?"
    answer: "No. California ended common-law marriage in 1895, one of the earliest states to do so."

  - question: "Do you need a divorce to end a common-law marriage?"
    answer: "Yes. A valid common-law marriage is a full legal marriage, so it ends only by divorce or death, the same as a licensed marriage."

  - question: "Does a common-law marriage count in other states?"
    answer: "Usually yes. A common-law marriage formed in a state that allows it is honored almost everywhere, the same way states honor each other's licensed marriages and [marriage age](/rankings/law/marriage-age-by-state) rules."

