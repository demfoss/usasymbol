sections:
  - id: "states-with-the-highest-rental-application-fee-caps"
    icon: "fa-solid fa-file-invoice-dollar"
    title: "States With the Highest Rental Application Fee Caps"
    paragraphs:
      - "California's $65.86 cap is the highest on record, built from a $30 statutory base that grows with the Consumer Price Index each year. Virginia, New Jersey, and Delaware follow at $50 each."
      - "Delaware's $50 is a floor rather than a ceiling, since the statute allows the greater of $50 or 10% of monthly rent. Virginia's $50 leaves out actual third-party screening costs, while New Jersey's $50 took effect on May 1, 2026."

  - id: "states-that-ban-rental-application-fees"
    icon: "fa-solid fa-ban"
    title: "States That Ban Rental Application Fees"
    paragraphs:
      - "Massachusetts and Vermont set a $0 cap on landlord application fees. Vermont's statute bars the charge outright, and Massachusetts lets landlords collect only first month, last month, a security deposit, and lock and key costs."
      - "New York ($20) and Wisconsin ($25) hold the lowest positive caps on record. New York's limit applies to background and credit checks, and Wisconsin's applies to a credit report at actual cost."

