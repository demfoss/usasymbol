page:
  h1: "Rental Application Fee Laws by State"

  quick_answer:
    - "Rental application fee laws by state set the highest cap in California at $65.86 per applicant for 2026, a figure that adjusts each year with inflation from a $30 statutory base."
    - "Virginia, New Jersey, and Delaware cap the fee at $50, while Wisconsin allows up to $25 for a credit report and New York allows $20. Delaware's $50 applies unless 10% of monthly rent is higher."
    - "Massachusetts and Vermont ban rental application fees entirely, a $0 cap. Only 8 states have a statutory dollar cap or ban on record, so the other 42 states are marked No cap."

  methodology: "The maximum fee is the highest dollar amount a landlord may charge per applicant under state statute or attorney general guidance as of September 2026, with 0 meaning a ban. States with no dollar cap, or only an actual-cost rule, are marked No cap."

  sources:
    - name: "FindLaw. California Civil Code Section 1950.6"
      url: "https://codes.findlaw.com/ca/civil-code/civ-sect-1950-6/"
      description: "The $30 application screening fee cap and its annual Consumer Price Index adjustment"
    - name: "New York State Senate. Real Property Law Section 238-A"
      url: "https://www.nysenate.gov/legislation/laws/RPP/238-A"
      description: "New York limit on background and credit check fees of $20 or the actual cost, whichever is less"
    - name: "Virginia Law. Code of Virginia Section 55.1-1203"
      url: "https://law.lis.virginia.gov/vacode/title55.1/chapter12/section55.1-1203/"
      description: "Virginia application fee limit of $50 exclusive of actual third-party screening costs"
    - name: "New Jersey Office of the Attorney General. Guidance for Housing Providers on Rental Application Fees"
      url: "https://www.njoag.gov/wp-content/uploads/2026/04/2026-0413_Formatted-Guidance-for-Housing-Providers-on-Rental-Application-Fees.pdf"
      description: "New Jersey $50 rental application fee cap effective May 1, 2026"

