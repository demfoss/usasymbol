faq:
  - question: "What is the maximum rental application fee in California?"
    answer: "California caps the fee at $65.86 for 2026, adjusted each year from a $30 statutory base using the Consumer Price Index. A landlord may charge only up to the actual screening cost, so the fee can be lower."

  - question: "Which state has the highest rental application fee cap?"
    answer: "California, at $65.86. That is $15.86 above the $50 caps in Virginia, New Jersey, and Delaware."

  - question: "What is the rental application fee limit in New York?"
    answer: "New York limits the fee to the actual cost of the background and credit checks or $20, whichever is less."

  - question: "Which states ban rental application fees?"
    answer: "Massachusetts and Vermont, both at a $0 cap. Vermont bars the fee by statute, and Massachusetts limits what landlords may collect before a tenancy to first month, last month, a security deposit, and lock and key costs."

  - question: "What is the maximum application fee in Virginia?"
    answer: "Virginia caps the fee at $50 per applicant, not counting actual out-of-pocket costs paid to a third party for background or credit checks. Housing regulated by HUD is capped lower, at $32."

  - question: "Do all states cap rental application fees?"
    answer: "No. Only 8 states have a statutory dollar cap or ban on record, and the other 42 states are marked No cap because they set no dollar limit."

