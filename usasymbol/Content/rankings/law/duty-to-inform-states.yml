faq:
  - question: "Which states require you to tell police you are carrying a concealed gun?"
    answer: "Ten states and Washington, D.C. require proactive disclosure: Alaska, Arkansas, District of Columbia, Hawaii, Louisiana, Michigan, Nebraska, New Jersey, North Carolina, and Texas."

  - question: "Do you have to tell police you have a gun in Texas?"
    answer: "Yes. Texas requires a concealed carrier to proactively inform a law enforcement officer during a stop."

  - question: "Which states only require disclosure if an officer asks?"
    answer: "Seventeen states require disclosure only if asked, including Florida, New York, Pennsylvania, Virginia, and Washington."

  - question: "Does California have a duty to inform law?"
    answer: "No statewide law exists in California, but some localities are known to have their own duty to inform requirements."

  - question: "What is the duty to inform rule in Maine?"
    answer: "Maine's duty to inform applies only when carrying without a permit. Carrying with a permit removes the requirement."

  - question: "How many states have no duty to inform law?"
    answer: "21 states have no duty to inform law at all, more than any single other category."

