sections:
  - id: "states-that-require-proactive-disclosure"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States That Require Proactive Disclosure"
    paragraphs:
      - "Ten states and Washington, D.C. require a concealed carrier to proactively inform a law enforcement officer during a stop: Alaska, Arkansas, District of Columbia, Hawaii, Louisiana, Michigan, Nebraska, New Jersey, North Carolina, and Texas."
      - "Seventeen states require disclosure only if an officer asks, including Florida, New York, Pennsylvania, Virginia, and Washington. This is the largest single category, one more state than the 21 states with no duty to inform law at all."

  - id: "permit-dependent-and-other-states"
    icon: "fa-solid fa-file-shield"
    title: "States Where Duty to Inform Depends on the Permit"
    paragraphs:
      - "Maine and North Dakota are permit dependent. In Maine, duty to inform applies only when carrying without a permit. Carrying with a permit removes the requirement, and North Dakota's rule works the same way for residents constitutionally carrying without one."
      - "California is the only state marked Other: there is no duty to inform law at the state level, but some localities are known to have their own duty to inform requirements."

