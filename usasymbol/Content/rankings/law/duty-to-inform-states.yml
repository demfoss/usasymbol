  description: "Ten states require concealed carriers to inform police proactively. Seventeen require it only if asked, and 21 states have no duty to inform."

page:
  h1: "Duty to Inform States"

  quick_answer:
    - "Ten states plus the District of Columbia have a proactive duty to inform law: Alaska, Arkansas, D.C., Hawaii, Louisiana, Michigan, Nebraska, New Jersey, North Carolina, and Texas."
    - "Seventeen states require disclosure only if a law enforcement officer asks, including Florida, New York, Pennsylvania, and Washington. 21 states have no duty to inform law at all."
    - "Maine and North Dakota are permit dependent: duty to inform applies only when carrying without a permit, not when carrying with one. California has no statewide law, though some localities have their own duty to inform requirements."

  methodology: "Duty to inform status reflects whether state law requires a concealed carrier to disclose that fact to a law enforcement officer during a stop, on record as of 2026. This page is informational only and does not constitute legal advice."

  sources:
    - name: "World Population Review. Duty to Inform States"
      url: "https://worldpopulationreview.com/state-rankings/duty-to-inform-states"
      description: "State-by-state duty to inform status for concealed carry during law enforcement encounters"

