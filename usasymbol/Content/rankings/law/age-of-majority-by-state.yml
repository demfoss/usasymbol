seo:
  title: "Age of Majority by State | Map & Legal Ages"
  description: "Mississippi sets the age of majority at 21. Alabama and Nebraska set it at 19. The other 47 states set legal adulthood at 18."
page:
  h1: "Age of Majority by State"
  quick_answer:
    - "Age of majority by state is highest in Mississippi at 21, because its code still defines a minor as anyone under 21. A chancery court can lift that status earlier."
    - "Alabama and Nebraska set legal adulthood at 19. Nebraska's statute ends minority early for anyone who marries, and 18-year-olds there can already sign contracts and leases."
    - "The other 47 states use 18, the age most of them chose in the early 1970s after the 26th Amendment gave 18-year-olds the vote."
  methodology: "General age at which a person is no longer a minor under each state's code, checked against statute text where available and legal references in October 2026. Specific rights granted at other ages, such as drinking or driving, are not counted."
  sources:
    - name: "Cornell Legal Information Institute. Age of Majority"
      url: "https://www.law.cornell.edu/wex/age_of_majority"
      description: "Overview naming Alabama, Nebraska and Mississippi as the states above 18"
    - name: "Nebraska Legislature. Section 43-2101"
      url: "https://nebraskalegislature.gov/laws/statutes.php?statute=43-2101"
      description: "Persons under nineteen are minors, minority ends on marriage, 18-year-old rights"
    - name: "Justia. Code of Alabama Section 26-1-1"
      url: "https://law.justia.com/codes/alabama/title-26/chapter-1/section-26-1-1"
      description: "Age of majority designated as 19 years"
    - name: "LegiScan. Mississippi HB 277 (2026)"
      url: "https://legiscan.com/MS/text/HB277/2026"
      description: "Bill to lower the age of majority from 21 to 18, which died in committee"
