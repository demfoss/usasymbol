faq:
  - question: "What is the age of majority in Alabama?"
    answer: "Nineteen. Alabama Code Section 26-1-1 sets adulthood at 19, though some rules, including certain contracts, apply at 18."
  - question: "What is the age of majority in Nebraska?"
    answer: "Nineteen, but marriage under 19 ends minority at once. An 18-year-old in Nebraska can already sign a lease or contract."
  - question: "Which state has an age of majority of 21?"
    answer: "Mississippi is the only state that still defines a minor as anyone under 21. Bills to lower it to 18 have been introduced in recent years without passing."
  - question: "What is the age of majority in most states?"
    answer: "Eighteen. Forty-seven states use it, and it is the age at which a person can vote in every state."
  - question: "Is the age of majority the same as the drinking age?"
    answer: "No. The age of majority sets when a person is a legal adult for contracts and parental authority, while the drinking age is 21 almost everywhere. See [minimum driving age by state](/rankings/law/minimum-driving-age-by-state) for another age that differs from adulthood."
