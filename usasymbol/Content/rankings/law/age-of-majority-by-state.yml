sections:
  - id: why-mississippi-has-the-highest-age-of-majority
    icon: "fa-solid fa-gavel"
    title: "Why Mississippi's Age of Majority Is 21"
    paragraphs:
      - "Mississippi never rewrote its general definition of a minor, so its code still reaches age 21. Most states lowered the age to 18 in the early 1970s, right after the 26th Amendment lowered the voting age. Mississippi lawmakers have since filed bills to follow suit, and the latest, House Bill 277 in 2026, died in committee."
      - "A court can end minority sooner. A Mississippi chancery court can remove the disabilities of minority for a young person, which frees them to make legal and financial decisions before 21."
    table:
      columns:
        state: "State"
        age_of_majority: "Age of Majority"
      rows:
        - { state: "Mississippi", age_of_majority: "21" }
        - { state: "Alabama", age_of_majority: "19" }
        - { state: "Nebraska", age_of_majority: "19" }
  - id: states-where-the-age-of-majority-is-19
    icon: "fa-solid fa-scale-balanced"
    title: "States Where the Age of Majority Is 19"
    paragraphs:
      - "Alabama and Nebraska stopped at 19 rather than 18. Alabama's statute declares adulthood at 19 and bars discrimination against 19 and 20-year-olds solely on age. Nebraska's statute adds that a person who marries under 19 stops being a minor, a point that ties into [marriage age by state](/rankings/law/marriage-age-by-state)."
      - "Nebraska also carves out several rights for 18-year-olds who are not wards of the state. They can sign binding contracts and leases and buy or sell real property, and they can consent to their own mental health care. Many other age limits, such as the [drinking age](/rankings/law/drinking-age-by-state), are set separately from the age of majority."
