page:
  h1: "Bicycle Helmet Laws by State"

  quick_answer:
    - "Bicycle helmet laws by state are strictest in California, Delaware, Hawaii, and New Mexico, where every rider under 18 must wear a helmet."
    - "No state requires adult cyclists to wear a helmet. Twenty-nine states have no statewide bike helmet law at all, so the rule there depends on the city or county."
    - "Louisiana and Pennsylvania set the youngest cutoff on the list. Only riders under 12 must wear a helmet in those two states."

  methodology: "Statewide bicycle helmet laws as listed by the Bicycle Helmet Safety Institute (updated August 2026). Year Enacted is the first year of the rider law. Local ordinances are not included."

