faq:
  - question: "Do adults have to wear a bike helmet in any state?"
    answer: "No. No state requires adult cyclists to wear a helmet. The strictest statewide laws stop at age 18."

  - question: "Is it illegal to ride a bike without a helmet in California?"
    answer: "Only for riders under 18. California has required helmets for young riders since 1994, but adults may ride without one."

  - question: "Does Texas have a bicycle helmet law?"
    answer: "No statewide law. Some Texas cities set their own, and Dallas still requires helmets for riders under 18."

  - question: "What is the bike helmet law in Florida?"
    answer: "Florida requires helmets for riders under 16, a rule in place since 1997. Adults may ride without a helmet."

  - question: "What age do you have to wear a bike helmet in New York?"
    answer: "Under 14. New York's rider law dates to 1994, and children under 5 riding as passengers must also wear one."

  - question: "How many states have a bicycle helmet law?"
    answer: "Twenty-one states have a statewide helmet law for young riders. The other 29 leave the decision to cities and counties."

  - question: "Which states are best for biking without a car?"
    answer: "Helmet laws are only one piece. [Bike-friendliness by state](/rankings/infrastructure/bike-friendliness-by-state) tracks bike lanes, commuting, and safety across all fifty states."

