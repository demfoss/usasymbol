sections:
  - id: "why-bike-helmet-laws-cover-only-kids"
    icon: "fa-solid fa-child"
    title: "Why Bike Helmet Laws Cover Only Kids"
    paragraphs:
      - "Every one of the 21 statewide laws stops at the 18th birthday or earlier. Most passed in the 1990s, when doctors pushed states to protect children, who are less likely to judge traffic well and more likely to fall."
      - "Adult rules never caught on. Lawmakers have treated a grown cyclist's helmet as a personal choice, and cities building bike lanes and bike-share systems feared a mandate would scare riders off. Dallas dropped its adult rule in 2014, and King County in Washington, home to Seattle, repealed its all-ages rule in 2022."

  - id: "states-that-require-bike-helmets-for-riders-under-18"
    icon: "fa-solid fa-person-biking"
    title: "States With the Strictest Bike Helmet Laws"
    paragraphs:
      - "California, Delaware, Hawaii, and New Mexico cover every rider under 18. Massachusetts and New Jersey follow at under 17, and eleven states, from Alabama to Tennessee, use under 16."
      - "California got there in two steps. A 1987 law required helmets for small children riding as passengers, and a 1994 law added riders under 18. New Jersey's 1992 rider law is the oldest on the list."
    table:
      columns:
        state: "State"
        age: "Helmet Required Under"
        year: "Year Enacted"
      rows:
        - state: "California"
          age: "18"
          year: "1994"
        - state: "Delaware"
          age: "18"
          year: "1996"
        - state: "Hawaii"
          age: "18"
          year: "2001"
        - state: "New Mexico"
          age: "18"
          year: "2007"
        - state: "Massachusetts"
          age: "17"
          year: "1994"
        - state: "New Jersey"
          age: "17"
          year: "1992"

  - id: "states-with-no-bicycle-helmet-law"
    icon: "fa-solid fa-map"
    title: "States With No Bicycle Helmet Law"
    paragraphs:
      - "Twenty-nine states, including Texas, Illinois, Ohio, Michigan, Colorado, and Washington, have no statewide bike helmet law. Riders there follow whatever their city or county decides."
      - "Many of these states sit in the West and Midwest, where state lawmakers often leave such rules to local governments. A child biking across a county line can move from a place that requires a helmet to one that does not."

  - id: "youngest-bike-helmet-age-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "Lowest Bike Helmet Age by State"
    paragraphs:
      - "Louisiana and Pennsylvania require helmets only for riders under 12, the lowest cutoff of any state. New York is next at under 14, and West Virginia covers riders under 15."
      - "New York added its rider rule in 1994, five years after it began requiring helmets for child passengers under 5. Like [motorcycle helmet laws](/rankings/law/motorcycle-helmet-laws-by-state), these rules shift sharply from one state to the next."

