sections:
  - id: "highest-speed-limit-states"
    icon: "fa-solid fa-gauge-high"
    title: "States with the Highest Speed Limits"
    paragraphs:
      - "Texas has the highest posted speed limit in the United States at 85 mph on State Highway 130, a toll road between Austin and San Antonio opened in 2012. Standard rural interstates in Texas run 75 to 80 mph. Eight states allow 80 mph on rural corridors: Idaho, Montana, Nevada, North Dakota, Oklahoma, South Dakota, Utah, and Wyoming."
      - "Montana, Nevada, North Dakota, and South Dakota post a flat 80 mph on all rural interstates. Idaho, Oklahoma, Utah, and Wyoming apply 80 mph only on specified high-capacity segments while keeping other rural interstates at 75 mph. Montana historically had no numeric daytime limit from 1995 to 1999 before the Montana Supreme Court struck down the standard."

  - id: "lowest-speed-limit-states"
    icon: "fa-solid fa-gauge-simple-low"
    title: "States with the Lowest Speed Limits"
    paragraphs:
      - "Hawaii has the lowest maximum highway speed of any state at 60 mph. Hawaii has no true interstate highways. The H-1, H-2, and H-3 expressways are federally funded routes capped at 60 mph on all sections. Eight states top out at 65 mph on rural interstates: Alaska, Connecticut, Delaware, Massachusetts, New Jersey, New York, Rhode Island, and Vermont."
      - "All eight of the 65 mph states are in the Northeast, plus Alaska. Connecticut, Delaware, New Jersey, and Rhode Island have no rural interstate stretches in the traditional sense, as their entire networks pass through dense suburban corridors. Alaska has limited interstate mileage, and its long-distance highway routes are capped at 65 mph."

faq:
  - question: "What state has the highest speed limit?"
    answer: "Texas has the highest posted speed limit in the United States at 85 mph on State Highway 130, a toll road between Austin and San Antonio. Standard rural interstates in Texas are 75 to 80 mph. No other state posts a limit above 80 mph."

  - question: "What state has the lowest speed limit?"
    answer: "Hawaii has the lowest maximum highway speed of any state at 60 mph. Alaska, Connecticut, Delaware, Massachusetts, New Jersey, New York, Rhode Island, and Vermont all top out at 65 mph on rural interstates, ranking 42nd through 49th."

  - question: "How fast can you drive in Montana?"
    answer: "Montana allows 80 mph on rural interstates and 70 mph for trucks. Montana famously had no numeric daytime speed limit from 1995 to 1999, using a 'reasonable and prudent' standard instead, before the Montana Supreme Court struck it down and the legislature set a 75 mph limit, later raised to 80 mph in 2015."

  - question: "Why does Texas have an 85 mph speed limit?"
    answer: "Texas's 85 mph limit applies only to State Highway 130, a private toll road opened in 2012 to relieve congestion on I-35 between Austin and San Antonio. The road runs through flat, open terrain with low traffic volume. The Texas Transportation Commission approved the 85 mph designation for that corridor only."

  - question: "What is the speed limit in New York?"
    answer: "New York has a rural interstate speed limit of 65 mph, ranking 47th in the country. The posted limit drops to 65 mph in urban areas as well, and New York City enforces a 25 mph speed limit on most city streets."

  - question: "What is the most common speed limit on US highways?"
    answer: "The most common rural interstate speed limit is 70 mph, shared by 22 states including California, Florida, Illinois, and Ohio. Ten states allow 75 mph, eight allow 80 mph, and Texas allows 85 mph on one specific toll road."

