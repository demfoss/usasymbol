page:
  h1: "Speed Limits by State"

  quick_answer:
    - "Texas has the highest posted speed limit of any state at 85 mph on State Highway 130 between Austin and San Antonio. Eight states allow 80 mph on rural interstates, including Idaho, Montana, and Wyoming."
    - "Hawaii has the lowest maximum highway speed of any state at 60 mph. Eight states cap rural interstate speeds at 65 mph: Alaska, Connecticut, Delaware, Massachusetts, New Jersey, New York, Rhode Island, and Vermont."
    - "The most common rural interstate speed limit is 70 mph, shared by 22 states including California, Florida, and Illinois. Ten states allow 75 mph, and nine allow 80 mph or higher."

  methodology: "Rankings use the maximum posted speed limit on rural interstate highways in each state as of June 2026, per the IIHS, using the highest posted limit where segments vary (for example, 75 mph standard with 80 mph on specified corridors). Urban interstate limits, typically 10 to 15 mph lower, are not used for ranking."

  sources:
    - name: "IIHS — Speed Laws by State (June 2026)"
      url: "https://www.iihs.org/topics/speed/speed-limit-laws"
      description: "Official state-by-state speed limit data by road type compiled by the Insurance Institute for Highway Safety"
