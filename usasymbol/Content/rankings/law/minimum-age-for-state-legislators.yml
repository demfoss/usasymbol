faq:
  - question: "Which states require state senators to be 30?"
    answer: "Kentucky, Missouri, New Hampshire, New Jersey, and Tennessee require 30. Their lower chambers admit younger members, with thresholds of 18, 21, or 24."
  - question: "How old must you be to become a Kentucky legislator?"
    answer: "Kentucky requires 24 for the House and 30 for the Senate at election. The constitution also requires one year of residence in the constituency and a longer period in Kentucky."
  - question: "Can an eighteen-year-old serve in Louisiana's legislature?"
    answer: "Louisiana's constitutional age requirement is 18 for either chamber. Candidates must meet the age, elector, and residence qualifications when they qualify as candidates."
  - question: "What is the minimum age for an Arizona state representative?"
    answer: "Arizona requires 25 for a representative, the same as for a senator. Its constitutional clause covers the legislature as a whole."
  - question: "How old must a Nebraska state senator be?"
    answer: "Nebraska requires 21. Its senators serve in the state's only legislative chamber, so there is no separate House qualification."
  - question: "What is the minimum age for the New Hampshire House?"
    answer: "New Hampshire sets 18 for the House and 30 for the Senate. The House route becomes available twelve years earlier under the age rules."
