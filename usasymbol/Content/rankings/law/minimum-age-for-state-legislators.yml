sections:
  - id: highest-lowest-legislator-ages
    icon: "fa-solid fa-landmark"
    title: "Highest and Lowest Legislator Ages"
    paragraphs:
      - "Kentucky's Senate threshold of 30 comes from a constitutional clause that also demands six years of state residence. Representatives need to be 24 and have two years of state residence. Kentucky therefore separates the two chambers by both age and length of residence, rather than applying one rule to every legislator."
      - "Louisiana reaches the lowest listed Senate age of 18 through a shared constitutional qualification for both chambers. Candidates must already be electors with two years of state residence and one year domiciled in their legislative district when they qualify as candidates. An adult can meet the age rule while still having to wait long enough after moving."
    table:
      columns:
        state: "State"
        senate: "Senate Age"
        house: "House Age"
      rows:
        - { state: "Kentucky", senate: 30, house: 24 }
        - { state: "Missouri", senate: 30, house: 24 }
        - { state: "New Hampshire", senate: 30, house: 18 }
        - { state: "New Jersey", senate: 30, house: 21 }
        - { state: "Tennessee", senate: 30, house: 21 }
        - { state: "Delaware", senate: 27, house: 24 }
        - { state: "Texas", senate: 26, house: 21 }
        - { state: "Arizona", senate: 25, house: 25 }
        - { state: "Louisiana", senate: 18, house: 18 }
  - id: house-senate-age-gap
    icon: "fa-solid fa-users"
    title: "House and Senate Age Requirements"
    paragraphs:
      - "New Hampshire permits House members at 18 but requires senators to be 30. The twelve-year age gap is the widest between chambers in the table. West Virginia also separates the chambers, setting 18 for the House and 25 for the Senate."
      - "Arizona uses 25 for both chambers because its constitution addresses every member of the legislature in a single age clause. Colorado and Utah also use 25 for both. Meeting an age threshold does not determine how long a member may serve, which is governed separately by [legislative term limits](/rankings/law/legislative-term-limits-by-state)."
  - id: nebraska-legislator-age
    icon: "fa-solid fa-building-columns"
    title: "Nebraska Legislator Age Requirements"
    paragraphs:
      - "Nebraska requires its legislators to be 21 and registered voters, with one year of district residence before election. Its members are called senators, but they form the entire legislature. Voters approved the one-house system in 1934, and it began meeting in 1937."
      - "Nebraska's single chamber makes its entry in [state legislature size](/rankings/government/state-legislature-size-by-state) different from states with a House and Senate. A qualifying candidate runs for the whole legislative body rather than choosing between chambers with different age rules."
