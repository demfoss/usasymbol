seo:
  title: "Minimum Age for State Legislators | Map & Rules"
  description: "Five states require senators to be 30. Louisiana permits both chambers at 18, while Arizona requires 25 for both."
page:
  h1: "Minimum Age for State Legislators"
  quick_answer:
    - "Minimum age for state legislators reaches 30 for senators in Kentucky, Missouri, New Hampshire, New Jersey, and Tennessee. These states give the upper chamber a higher age requirement than the lower chamber."
    - "Louisiana permits legislators in either chamber at 18. Its constitution uses a single qualification clause for both houses, with residence requirements alongside the age rule."
    - "Arizona, Colorado, and Utah require 25 in both chambers. Nebraska requires 21 for its single legislative chamber, so it has no separate House threshold."
  methodology: "NCSL eligibility table, May 2023, with selected constitutional clauses checked October 8, 2026. Senate ages determine rank. Kansas and Vermont have no express age in that table and are unranked. Nebraska has one chamber."
  sources:
    - name: "National Conference of State Legislatures. Legislative eligibility requirements"
      url: "https://www.ncsl.org/elections-and-campaigns/eligibility-requirements-to-run-for-the-state-legislature"
      description: "Chamber age table updated May 5, 2023, including statutory citations and unspecified ages"
    - name: "Kentucky Legislature. Constitution section 32"
      url: "https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=36"
      description: "Senators must be 30 and representatives 24 at election, with different state residence periods"
    - name: "Arizona Legislature. State Constitution"
      url: "https://www.azleg.gov/const/arizona_constitution.pdf"
      description: "Article IV part 2 section 2 applies age 25 to all members of the legislature"
    - name: "Louisiana Legislature. Constitution Article III section 4"
      url: "https://www.legis.la.gov/legis/Law.aspx?d=206419"
      description: "Article III section 4 sets age 18 and two years of state residence for legislators"
    - name: "Vermont General Assembly. State Constitution"
      url: "https://legislature.vt.gov/statutes/constitution-of-the-state-of-vermont/"
      description: "Legislative qualification clauses specify residence without an express chamber age"
    - name: "Nebraska Legislature. Constitution Article III section 8"
      url: "https://www.nebraskalegislature.gov/laws/articles.php?article=III-8&print=true"
      description: "A member of the single chamber must be 21 and meet residence qualifications"
    - name: "Nebraska State Historical Society. Unicameral Gavel"
      url: "https://history.nebraska.gov/unicameral-gavel/"
      description: "One-house legislature approved in 1934 and first convened in 1937"
