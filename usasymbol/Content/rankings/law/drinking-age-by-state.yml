sections:
  - id: "why-the-drinking-age-is-21-in-every-state"
    icon: "fa-solid fa-landmark"
    title: "Why the Drinking Age Is 21 in Every State"
    paragraphs:
      - "All 50 states list 21 as the purchase age, yet Congress never passed a national drinking age. The National Minimum Drinking Age Act of 1984 instead threatened to hold back federal highway funds from any state with a lower limit, and the Supreme Court upheld that tactic in South Dakota v. Dole in 1987."
      - "Many states had dropped their age to 18 after the 26th Amendment lowered the voting age in 1971. Studies then tied those lower ages to more fatal crashes among drivers aged 18 to 20, and Mothers Against Drunk Driving pressed for one national standard. Wyoming became the last state to raise its age to 21, in 1988."
      - "Purchase age is only half the story. The 1984 act targets buying and public possession, so states kept room to allow drinking in private, which is why the exception column on this map varies so widely."

  - id: "states-that-allow-underage-drinking-with-parents"
    icon: "fa-solid fa-user-group"
    title: "Underage Drinking With Parents by State"
    paragraphs:
      - "Twenty-seven states let a parent or guardian give alcohol to their own child in some setting. Sixteen of them pair that family rule with a private-property exception, the broadest mix on the map."
      - "Alaska, California, Colorado, Delaware, Georgia, Idaho, Iowa, Louisiana, Maine, Maryland, Mississippi, Nevada, New Mexico, Oregon, Virginia, and Wyoming make up that combined group. Louisiana, home of the drive-through daiquiri shop, belongs here, and so does Wyoming, the final holdout against the 21 purchase age."
      - "Eleven states allow the family exception alone. Connecticut, Hawaii, Illinois, Massachusetts, Montana, New York, Ohio, Rhode Island, Texas, Washington, and Wisconsin fall in this group. Texas reaches further than most, since its law covers a minor who drinks in the visible presence of a parent, not only at home."

  - id: "states-that-allow-underage-drinking-on-private-property"
    icon: "fa-solid fa-house"
    title: "Underage Drinking on Private Property"
    paragraphs:
      - "Minnesota, Nebraska, New Jersey, Oklahoma, and South Carolina have a location exception only. Their rules turn on the setting, usually a private home, and the exact terms differ from statute to statute."
      - "None of these exceptions covers a party where adults serve other people's children. Drinking in a car or on the street falls under separate [open container laws](/rankings/law/open-container-laws-by-state), and those apply to everyone regardless of age."

  - id: "states-with-no-underage-drinking-exceptions"
    icon: "fa-solid fa-ban"
    title: "States With No Underage Drinking Exceptions"
    paragraphs:
      - "Eighteen states have no family or private-property exception. Alabama, Arizona, Arkansas, Florida, Indiana, Kansas, Kentucky, Michigan, Missouri, New Hampshire, North Carolina, North Dakota, Pennsylvania, South Dakota, Tennessee, Utah, Vermont, and West Virginia make up the list."
      - "Utah fits a wider pattern of strict alcohol rules shaped by its large Latter-day Saint population, whose faith asks members to avoid alcohol. Pennsylvania still sells liquor through state-run stores, a system it set up after Prohibition ended in 1933. Kentucky and Arkansas go further still, with [dry counties](/rankings/law/dry-states) where alcohol sales are banned outright."
      - "No exception in this table does not make communion wine a crime. Religious and medical uses are handled separately and are not counted here."

