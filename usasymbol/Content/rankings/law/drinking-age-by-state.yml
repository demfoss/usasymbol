seo:
  title: "Drinking Age by State | 32 States Allow Exceptions"
  description: "All 50 states set the minimum alcohol purchase age at 21. Thirty-two allow limited underage consumption under family or location exceptions. NIAAA/APIS data."

page:
  h1: "Legal Drinking Age by State 2026"

  quick_answer:
    - "All 50 states set the minimum alcohol purchase age at 21 under the National Minimum Drinking Age Act of 1984. Thirty-two states allow limited underage consumption under specific circumstances; 18 states have no exceptions."
    - "The most common exception is family supervision: a parent or guardian of legal drinking age may provide alcohol to their minor child in a private setting. Sixteen states combine family and location exceptions, allowing consumption either with a parent or on private property. Five states allow only location-based exceptions, with no requirement that a parent be present."

  methodology: "Exception types reflect state statutes as tracked by the Alcohol Policy Information System (APIS), maintained by NIAAA. The purchase age of 21 applies in every state under the National Minimum Drinking Age Act of 1984. State exceptions cover consumption and possession by persons under 21; the specific rules (who must be present, what location is required) vary by statute. This page is for general informational purposes only and is not legal advice."

