faq:
  - question: "What is the legal drinking age in the United States?"
    answer: "Twenty-one, in all 50 states. No state has gone lower since Wyoming raised its age in 1988, because a lower limit would cost it federal highway money."

  - question: "Can you drink at 18 in any state?"
    answer: "No. Every state sets the purchase age at 21, and none lets an 18-year-old buy alcohol."

  - question: "Can you drink under 21 with your parents?"
    answer: "In 27 states, yes, within limits. Sixteen states allow it alongside a private-property exception, and 11 allow the family exception alone. Buying alcohol under 21 stays illegal everywhere."

  - question: "What is the drinking age in Texas?"
    answer: "Texas sets the purchase age at 21 and has a family exception. A minor may drink in the visible presence of a parent, guardian, or adult spouse, though a restaurant can still refuse to serve them."

  - question: "Can you drink under 21 at home in California?"
    answer: "California is in the family and location group, so state law leaves room for a minor to drink at home with a parent. Drinking in public and buying alcohol under 21 remain illegal."

  - question: "Which states have no underage drinking exceptions?"
    answer: "Eighteen states have none, including Alabama, Florida, Michigan, Pennsylvania, Tennessee, and Utah. A parent in those states has no family exception to fall back on."

  - question: "What is the difference between purchase age and drinking age?"
    answer: "Purchase age is the age to buy alcohol, 21 in every state. Drinking age covers who may legally consume it, and 32 states allow some drinking under 21 even though none allow the purchase."

  - question: "Why is the drinking age higher in the U.S. than in Europe?"
    answer: "Most European countries set the age at 18, and some allow beer and wine at 16. The U.S. limit grew out of a fight against drunk driving in a country where many teenagers get a license at 16, and [DUI laws by state](/rankings/law/dui-strictness-by-state) still treat drivers under 21 more harshly."

