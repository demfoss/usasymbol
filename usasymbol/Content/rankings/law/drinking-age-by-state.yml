sections:
  - id: "states-with-underage-drinking-exceptions"
    icon: "fa-solid fa-scale-balanced"
    title: "States With Underage Drinking Exceptions"
    paragraphs:
      - "Thirty-two states allow some form of underage alcohol consumption or possession under specific circumstances. The largest group, 16 states, combines family and location exceptions: a minor may consume alcohol either with a parent or guardian present, or on private property not open to the public. These states include Alaska, California, Colorado, Delaware, Georgia, Idaho, Iowa, Louisiana, Maine, Maryland, Mississippi, Nevada, New Mexico, Oregon, Virginia, and Wyoming."
      - "Eleven states allow family exceptions only, meaning a parent or guardian of legal drinking age may provide alcohol to their minor child, but the private-location component is narrower or absent. These states are Connecticut, Hawaii, Illinois, Massachusetts, Montana, New York, Ohio, Rhode Island, Texas, Washington, and Wisconsin."
      - "Five states allow location exceptions only: on private property, a parent is not required to be present or to have provided the alcohol. Minnesota, Nebraska, New Jersey, Oklahoma, and South Carolina fall into this category. The exact wording matters: some of these statutes cover any private property, while others specify family-owned premises. The APIS database tracks these distinctions at the statute level."
      - "Religious use exceptions (consuming wine during communion or a religious ceremony) are tracked by APIS separately and are not counted in this table. Medical exceptions, such as a doctor prescribing alcohol, are also tracked by APIS but are distinct from the family and location rules shown here."

  - id: "states-without-underage-drinking-exceptions"
    icon: "fa-solid fa-ban"
    title: "States Without Underage Drinking Exceptions"
    paragraphs:
      - "Eighteen states have no broad statutory exception for underage consumption or possession: Alabama, Arizona, Arkansas, Florida, Indiana, Kansas, Kentucky, Michigan, Missouri, New Hampshire, North Carolina, North Dakota, Pennsylvania, South Dakota, Tennessee, Utah, Vermont, and West Virginia."
      - "In these states, no state law explicitly carves out a family supervision or private-location exception. That does not mean religious use is always prohibited; some states handle communion wine through separate provisions or prosecutorial discretion, but the APIS categories show no general exception."
      - "Several of these states are often assumed to have permissive rules. Vermont, associated with personal-freedom policies, has no family exception. New Hampshire, which holds the country's highest beer consumption per capita, also has no underage exception. Pennsylvania, which is second-lowest in average dinner time, has no family or location carve-out either. Florida and Pennsylvania are the two most populous states in this group."

  - id: "what-is-the-drinking-age-in-the-united-states"
    icon: "fa-solid fa-landmark"
    title: "What Is the Drinking Age in the United States?"
    paragraphs:
      - "The legal age to buy alcohol is 21 in every U.S. state. This comes from the National Minimum Drinking Age Act of 1984. The law does not directly set a drinking age; it requires states to set the minimum purchase age at 21 or lose 10% of their federal highway funding. Every state complied by 1988."
      - "Before 1984, many states had lowered their purchase age to 18 after the 26th Amendment lowered the voting age in 1971. By the early 1980s, research linked lower purchase ages to higher rates of alcohol-related traffic deaths among drivers aged 18 to 20. The law passed with support from Mothers Against Drunk Driving (MADD) and was signed by President Reagan. Studies after passage documented significant reductions in youth traffic fatalities in states that raised the age."
      - "The United States is one of a small number of countries with a legal purchase age of 21. Most of Europe, Canada, and Australia set the age at 18. The U.S. standard is sometimes called the highest in the world among wealthy nations, though a handful of countries including Kuwait, Saudi Arabia, and India (partially) have higher or total-prohibition policies."

faq:
  - question: "What is the legal drinking age in the United States?"
    answer: "The legal age to buy alcohol is 21 in every U.S. state, required by the National Minimum Drinking Age Act of 1984. No state has a purchase age below 21."

  - question: "Can you drink under 21 with your parents in the U.S.?"
    answer: "It depends on the state. Twenty-seven states allow a parent or guardian to provide alcohol to their minor child in limited settings. These are the 16 states with family and location exceptions plus the 11 with family exceptions only. Eighteen states have no such exception."

  - question: "Which states have no underage drinking exceptions?"
    answer: "Eighteen states have no broad statutory exception for underage consumption or possession: Alabama, Arizona, Arkansas, Florida, Indiana, Kansas, Kentucky, Michigan, Missouri, New Hampshire, North Carolina, North Dakota, Pennsylvania, South Dakota, Tennessee, Utah, Vermont, and West Virginia."

  - question: "Is the drinking age 18 in any U.S. state?"
    answer: "No. The legal age to buy alcohol is 21 in every U.S. state. No state has a general purchase or consumption age below 21. Some states allow limited underage consumption under specific conditions, but no state permits a person under 21 to buy alcohol."

  - question: "What is the difference between purchase age and drinking age?"
    answer: "Purchase age is the minimum age to buy alcohol, 21 in every U.S. state. Drinking age, or consumption age, refers to whether a person may legally consume alcohol. These can differ: 32 states allow limited consumption by people under 21 in specific circumstances, even though none allow the purchase."

