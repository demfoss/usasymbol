seo:
  title: "Legal Drinking Age by State | Map & Exceptions"
  description: "The drinking age is 21 in all 50 states. Thirty-two states allow underage drinking in limited cases, such as with a parent or on private property."

page:
  h1: "Legal Drinking Age by State"

  quick_answer:
    - "Legal drinking age is 21 in every state. Congress pushed all 50 to that number with the National Minimum Drinking Age Act of 1984, which tied federal highway money to it."
    - "Thirty-two states still let people under 21 drink in limited cases. A parent or guardian serving their own child is the most common exception, allowed in some form by 27 states."
    - "Eighteen states, including Florida, Michigan, and Pennsylvania, have no family or private-property exception at all. State law there makes no allowance for a teenager drinking at home with a parent."

  methodology: "Underage exception types follow state statutes as tracked by the Alcohol Policy Information System (APIS) of NIAAA. Religious and medical exceptions are not counted. Not legal advice."

  sources:
    - name: "Alcohol Policy Information System (APIS), NIAAA"
      url: "https://alcoholpolicy.niaaa.nih.gov/"
      description: "State alcohol policies, including underage possession and consumption exceptions"

