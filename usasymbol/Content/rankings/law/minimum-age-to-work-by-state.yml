faq:
  - question: "What is the minimum age to work in the U.S.?"
    answer: "Fourteen for most non-farm jobs, in every state. Federal law sets the floor, so a state can add rules but cannot let covered employers hire younger teens."

  - question: "Do you need a work permit in Texas?"
    answer: "No. Texas has no work permit requirement, though federal hour limits still apply to 14- and 15-year-olds."

  - question: "Do you need a work permit in California?"
    answer: "Yes, if you are under 18 and enrolled in school. Schools issue the permit, and a student with poor grades or attendance can lose it."

  - question: "At what age do you no longer need a work permit in New York?"
    answer: "At 18. New York requires working papers for all minors, and schools issue them."

  - question: "Does Florida require work permits for minors?"
    answer: "No. Florida has no work permit, but teens still face state limits on school-night hours. Breaks are a separate question, covered in [meal and rest break laws by state](/rankings/law/meal-and-rest-break-laws-by-state)."

  - question: "How many hours can a 14-year-old work?"
    answer: "Under federal law, up to 3 hours on a school day and 18 hours in a school week, and only between 7 a.m. and 7 p.m. The evening limit stretches to 9 p.m. from June 1 through Labor Day. Some states go higher for teens outside federal coverage, such as Iowa, which allows 28 hours in a school week."

  - question: "Why did Arkansas get rid of work permits?"
    answer: "Supporters of the 2023 Youth Hiring Act called the permit needless paperwork for parents, who had to sign off with the state before a teen under 16 could work. Federal age and hour limits still apply."

  - question: "Can a 13-year-old get a job?"
    answer: "Only in exempt jobs like babysitting, delivering newspapers, acting, or working for a parent's business. Most other jobs require the worker to be 14, and the [minimum wage](/rankings/economy/minimum-wage-by-state) usually applies once they start."

