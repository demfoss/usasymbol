  title: "Minimum Age to Work by State | Map, Permits & Rules"
  description: "Teens can start most jobs at 14 in every state. Fifteen states require a work permit for teens under 18, and 14 states require no permit at all."

page:
  h1: "Minimum Age to Work by State"

  quick_answer:
    - "The minimum age to work is 14 for most jobs in every state, because federal law sets that floor. Fifteen states, including California and New York, go further and require a work permit for teens under 18."
    - "Fourteen states require no work permit at all, from Texas and Florida to Arkansas, which dropped its permit for teens under 16 in 2023. West Virginia followed in 2025."
    - "Alaska is the only state that draws its permit line at 17, so a 17-year-old there can take a job with no permit."

  methodology: "Employment certificate rules from the U.S. Department of Labor state table (January 1, 2024), updated for later state laws in Alabama, West Virginia, and Louisiana. Federal minimum age from FLSA Fact Sheet 43. DC is excluded."

