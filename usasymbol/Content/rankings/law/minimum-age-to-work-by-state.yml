sections:
  - id: "why-14-is-the-minimum-age-to-work"
    icon: "fa-solid fa-scale-balanced"
    title: "Why 14 Is the Minimum Age to Work"
    paragraphs:
      - "Fourteen is the minimum age to work in every state because the Fair Labor Standards Act of 1938 set it for most non-farm jobs. Congress had tried before. A 1916 child labor law was struck down by the Supreme Court in Hammer v. Dagenhart two years later, and the 1938 act finally made the limit stick."
      - "States can be stricter than the federal rule but never looser for employers it covers. That is why no state lets a 12-year-old work a fast food register, even in the 14 states with no permit. Federal law also bars 14- and 15-year-olds from working during school hours and keeps hazardous work like driving a forklift for workers 18 and older."

  - id: "jobs-you-can-do-under-14"
    icon: "fa-solid fa-newspaper"
    title: "Jobs You Can Do Under 14"
    paragraphs:
      - "Kids under 14 can still earn money in a few jobs the federal law exempts. Delivering newspapers, babysitting, acting in movies or on stage, and working for a parent's business all count, as long as the family business is not mining, manufacturing, or a hazardous trade."
      - "Nevada writes the younger cases into its permit rule. A child under 14 there can take a job only with a judge's permission, while teens 14 and older need no permit at all."

  - id: "states-that-require-work-permits-under-18"
    icon: "fa-solid fa-id-card"
    title: "States That Require Work Permits Under 18"
    paragraphs:
      - "Fifteen states require a work permit or employment certificate for every teen under 18, clustered in the Northeast and along the West Coast. New York, Massachusetts, and Pennsylvania still have schools issue them, a system that dates from the era when states used permits to keep children in class."
      - "Alaska stands alone at 17. Michigan may be next to change, since its House voted in July 2026 to scrap the permit system, sending the bill to a Senate that had backed the permit law."
    table:
      columns:
        state: "State"
        under: "Permit Required Under"
        issuer: "Issued By"
      rows:
        - state: "California"
          under: "18"
          issuer: "School"
