  - id: "states-that-dont-require-work-permits"
    icon: "fa-solid fa-map"
    title: "States That Don't Require Work Permits"
    paragraphs:
      - "Fourteen states require no work permit, including Texas, Florida, and Tennessee, where employers simply keep proof of a teen's age. Arkansas joined the list in 2023 with its Youth Hiring Act, and Indiana swapped permits for employer registration in 2021."
      - "West Virginia ended permits for 14- and 15-year-olds in 2025, though employers there still need a parent's written consent. Not every state followed. Wisconsin's governor vetoed a bill to drop permits for 14- and 15-year-olds, after federal investigators found more than 100 children cleaning meatpacking plants overnight in a 2023 case that put teen work rules back in the news."

