page:
  h1: "Time Off to Vote Laws by State"
  quick_answer:
    - "Time off to vote laws in Arizona provide up to 3 paid hours to complete a voting window, sharing the largest fixed paid allowance in this comparison. Employees must request leave before election day."
    - "Wyoming provides 1 paid hour, the shortest fixed paid allowance listed. The hour cannot replace a meal break, and employees with three consecutive free hours while polls are open do not qualify."
    - "Kentucky protects a reasonable voting absence of at least four hours after advance application, but does not require pay. Minnesota instead pays for the time needed to vote without setting a fixed number of hours."
  methodology: "State statutes and election agencies checked October 7, 2026, covering 15 selected states and 12 fixed paid allowances. Minnesota and Texas have no fixed cap, Kentucky does not require pay, and Oklahoma travel extensions are excluded."
