sections:
  - id: why-voting-leave-hours-differ
    icon: "fa-solid fa-scale-balanced"
    title: "Why Voting Leave Hours Differ"
    paragraphs:
      - "Arizona and Missouri share the largest fixed paid allowance listed at 3 hours because their laws protect a three-hour opportunity to vote. Arizona adds only the work absence needed to complete that window, while Missouri grants a three-hour absence to a qualifying employee and lets the employer choose its timing."
      - "Wyoming's 1 paid hour is shorter because its statute combines a narrow work absence with a separate eligibility test. A worker who already has three consecutive free hours while polls are open receives no additional entitlement, and a qualifying worker's one-hour absence must be outside the meal period."
