  - id: voting-leave-notice-requirements
    icon: "fa-solid fa-calendar-check"
    title: "Voting Leave Notice Requirements"
    paragraphs:
      - "New York pays up to 2 hours after an employee requests leave within its two-to-ten-working-day notice window. Four consecutive free hours before or after the shift make the employee ineligible. Eligible workers cannot be told to spend vacation or another earned leave balance to cast a ballot."
      - "Oklahoma's ordinary 2-hour allowance also covers early voting. Employees must request the absence at least three days beforehand, and the employer can choose the voting day and hours. A worker who needs extra travel time can qualify for more than the ordinary allowance."
  - id: paid-and-unpaid-voting-leave
    icon: "fa-solid fa-person-to-slot"
    title: "Paid and Unpaid Voting Leave"
    paragraphs:
      - "Kentucky's protected absence lasts a reasonable time of at least four hours, but its law does not require wages for those hours. Advance applications can cover an election-day visit or a trip to the county clerk to request or execute an absentee ballot. Voting leave is distinct from medical absence covered by [paid sick leave laws](/rankings/law/paid-sick-leave-by-state)."
      - "Minnesota pays for the time needed to vote during scheduled work and lets employees choose when to vote. An employer can ask workers to coordinate absences, but cannot require them to use vacation or personal leave. Eligible voters first need to satisfy the state's registration rules, the broader subject of [voter registration](/rankings/government/voter-registration-rate-by-state)."
