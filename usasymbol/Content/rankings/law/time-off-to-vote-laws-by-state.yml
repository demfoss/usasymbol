faq:
  - question: "Does California pay employees for time off to vote?"
    answer: "Yes, up to 2 hours if the employee lacks sufficient voting time outside work. A longer absence may be allowed, with only the first two hours required to be paid. Leave normally falls at the beginning or end of the shift."
  - question: "How much paid time off to vote is required in Texas?"
    answer: "Texas requires necessary paid voting time for eligible employees without specifying a fixed hourly cap. Having two consecutive hours to vote outside working time removes that entitlement."
  - question: "Can an employer use my lunch break for voting leave in Kansas?"
    answer: "Kansas prohibits an employer from including the regular lunch period in the voting absence it schedules. Paid leave supplies the time needed to complete a two-hour voting window."
  - question: "Do you need proof of voting for paid leave in Maryland?"
    answer: "Maryland voters can obtain a Certificate of Participation from an election judge and give it to an employer who requires proof. Qualifying employees without two continuous free poll hours receive up to 2 paid hours."
  - question: "Can you take voting leave at the end of a shift in Utah?"
    answer: "Yes, an eligible worker who requests the beginning or end of the shift must be allowed that timing. Utah permits up to 2 paid hours, with an advance request, if the worker has fewer than three free hours while polls are open."
  - question: "Can Nebraska voting leave be requested on election day?"
    answer: "Yes. Nebraska protects pay when a registered voter applies before or on election day. The absence supplies enough time to bring the worker's continuous voting opportunity to two hours."
