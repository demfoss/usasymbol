page:
  h1: "Radar Detector Legality by State"

  quick_answer:
    - "Radar detector legality by state is Yes for Alabama and the other 48 states that allow private passenger-car use. Virginia is the exception because its highway equipment law covers devices that detect police speed measurements."
    - "Virginia lists No, but a detector without a power source and beyond occupants' ready reach qualifies for a transport exception. Switching off an accessible dashboard unit does not meet both conditions."
    - "California and Minnesota list Yes but restrict windshield mounting. A legal detector can still violate an equipment rule if its placement blocks the driver's view."

  methodology: "July 2026 passenger-car statuses are retained, with Virginia Code 46.2-1079, California Code 26708, Minnesota Statutes 169.71, and 49 CFR 392.71 checked October 2, 2026. D.C. and commercial vehicles are excluded from the table."

  sources:
    - name: "Code of Virginia. Section 46.2-1079, Radar Detectors"
      url: "https://law.lis.virginia.gov/vacode/title46.2/chapter10/section46.2-1079/"
      description: "Highway detector prohibition, transport exception, and temporary evidentiary seizure rules"
    - name: "Electronic Code of Federal Regulations. 49 CFR 392.71, Radar Detectors"
      url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-392/subpart-G/section-392.71"
      description: "Federal prohibition on radar detector use and possession in covered commercial motor vehicles"
    - name: "World Population Review. Radar Detector Legal States"
      url: "https://worldpopulationreview.com/state-rankings/radar-detector-legal-states"
      description: "50-state comparison of radar detector legality, including windshield-mounting restrictions in California and Minnesota"
    - name: "California Legislature. Vehicle Code 26708"
      url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=26708."
      description: "Windshield attachment and visibility restrictions"
    - name: "Minnesota Legislature. Statutes 169.71"
      url: "https://www.revisor.mn.gov/statutes/cite/169.71"
      description: "Windshield obstruction and device mounting rules"

