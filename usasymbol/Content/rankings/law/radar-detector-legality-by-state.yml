sections:
  - id: "states-where-radar-detectors-are-illegal"
    icon: "fa-solid fa-ban"
    title: "States Where Radar Detectors Are Illegal"
    paragraphs:
      - "Virginia is the only No in the passenger-car table because its highway equipment law bans devices that detect or interfere with police speed measurements, including radar and laser. The restriction concerns the device in the vehicle, so an officer need not prove that the driver was actively using it."
      - "Virginia treats temporary seizure as evidence differently from permanent forfeiture. A detector taken for a case must be returned once it is no longer needed, subject to the statute's conditions for unclaimed devices. Equipment rules also differ across [front license plate states](/rankings/law/front-license-plate-states)."
    table:
      columns:
        state: "State"
        status: "Passenger-Car Use"
      rows:
        - state: "Virginia"
          status: "Illegal"

  - id: "states-that-restrict-radar-detector-mounting"
    icon: "fa-solid fa-mobile-screen"
    title: "Radar Detector Mounting Restrictions"
    paragraphs:
      - "California and Minnesota both list Yes, yet their windshield rules can make the mounting arrangement unlawful. California regulates objects attached to the glass and objects that obstruct a clear view, while Minnesota lists specific permitted devices rather than allowing every windshield accessory."
      - "California's permitted windshield placements for certain other devices do not automatically extend to a radar detector. A dashboard installation still needs to preserve visibility, and permission to carry a detector never changes [maximum speed limits](/rankings/law/maximum-speed-limits)."
    table:
      columns:
        state: "State"
        status: "Detector Use"
        restriction: "Mounting Restriction"
      rows:
        - state: "California"
          status: "Legal"
          restriction: "Windshield mounting restricted"
        - state: "Minnesota"
          status: "Legal"
          restriction: "Windshield mounting restricted"

  - id: "commercial-vehicles-and-radar-detectors"
    icon: "fa-solid fa-truck"
    title: "Radar Detector Rules for Commercial Vehicles"
    paragraphs:
      - "Texas lists Yes for private passenger cars, but that label does not authorize a detector in a truck subject to federal commercial-motor-vehicle rules. The federal prohibition covers both use and possession, so the vehicle's regulatory category matters before the state permission does."

