faq:
  - question: "What is the age of consent in California"
    answer: "The age of consent in California is 18. California has no close-in-age exemption, meaning any sexual activity with a person under 18 can constitute statutory rape regardless of the age difference."

  - question: "What is the age of consent in Texas"
    answer: "The age of consent in Texas is 17. Texas also has a Romeo and Juliet law — a 3-year close-in-age exemption for consensual activity between teens aged 14 to 17. Texas enacted the first explicitly named Romeo and Juliet law in the country in 2007."

  - question: "What is the age of consent in New York"
    answer: "The age of consent in New York is 17, raised from 16 in 2019 under the Rape Is Rape Act. New York has no statutory close-in-age exemption."

  - question: "How many states have an age of consent of 16"
    answer: "32 states set the age of consent at 16, making it the most common threshold in the United States. 7 states require 17, and 11 states require 18."

  - question: "What is a Romeo and Juliet law"
    answer: "A Romeo and Juliet law is a statutory close-in-age exemption that reduces or eliminates criminal penalties when both parties are close in age, typically within 2 to 5 years of each other. 38 states have some form of this exemption. 12 states have none: Arizona, California, Hawaii, Idaho, Kentucky, Massachusetts, Michigan, Mississippi, Montana, New York, Ohio, and Virginia."

  - question: "What is the age of consent in Florida"
    answer: "The age of consent in Florida is 18. Florida has a Romeo and Juliet law providing a 4-year close-in-age exemption for teens aged 14 and older. Florida's law also allows qualifying individuals to petition for removal from the sex offender registry."

