sections:
  - id: "lowest-age-of-consent-states"
    icon: "fa-solid fa-scale-balanced"
    title: "States With the Lowest Age of Consent"
    paragraphs:
      - "Alabama and Alaska share the lowest listed threshold of 16. Alabama reaches that position because its age-based criminal provisions distinguish people below that threshold from older teenagers, rather than using adulthood as the general dividing line."
      - "California and Wisconsin sit at the opposite end with 18. California's intercourse statute defines a minor as someone below that age, and a small age gap changes the charge without creating a blanket exemption. Like [abortion laws by state](/rankings/law/abortion-laws-by-state), consent rules depend on the exact state provision."
  - id: "states-where-age-of-consent-is-18"
    icon: "fa-solid fa-gavel"
    title: "States With a Higher Age of Consent"
    paragraphs:
      - "Arizona, California, Delaware, Florida, Idaho, North Dakota, Oregon, Tennessee, Utah, Virginia, and Wisconsin list 18. Arizona illustrates why the headline age needs a qualification, since its law also recognizes a conditional close-in-age defense for specified offenses."
      - "New York and Texas occupy the middle group at 17. New York expressly treats someone below its threshold as incapable of consent, while Texas separately defines a close-in-age affirmative defense. Neither threshold overrides laws against force or coercion."

  - id: "romeo-and-juliet-laws-by-state"
    icon: "fa-solid fa-heart"
    title: "Romeo and Juliet Laws by State"
    paragraphs:
      - "Texas lists a close-in-age defense, but an affirmative defense is a legal condition to establish rather than automatic permission for every teenage relationship. The relevant sexual-assault provision also considers the defendant's record and whether the parties are prohibited relatives."
      - "California lists no blanket close-in-age exemption, even though proximity in age affects the charge. A Yes or No cell cannot replace an offense-specific reading, just as permission under [concealed carry laws](/rankings/law/gun-laws-concealed-carry) depends on conditions beyond a general label."

