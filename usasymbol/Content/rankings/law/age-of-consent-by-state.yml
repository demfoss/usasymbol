page:
  h1: "Age of Consent by State"

  quick_answer:
    - "Age of consent by state starts at 16 in Alabama, tied with the other states in the lowest group. Alabama's criminal law uses that threshold for age-based sexual offenses, with separate rules for younger children."
    - "Wisconsin joins California and the other highest-threshold states at 18. California treats intercourse with a minor as unlawful even when the age gap is small, although that gap affects the charge."
    - "Texas and New York both list 17, but Texas also lists a close-in-age defense. A shared age threshold does not mean the same legal outcome for teenagers."

  methodology: "June 2026 thresholds are retained, with Alabama, California, Arizona, New York, and Texas statutes checked October 2, 2026. Close-in-age labels summarize defenses and exclude offense-specific and position-of-authority conditions."

