faq:
  - question: "What is the age of consent in California?"
    answer: "California lists 18. The rule discussed here concerns sexual intercourse, and other sexual offenses have their own definitions and conditions."

  - question: "What is the age of consent in Texas?"
    answer: "Texas lists 17 as its general threshold. A close-in-age defense applies only if the statutory eligibility conditions are satisfied, so the age of the younger person alone does not settle the issue."

  - question: "What is the age of consent in New York?"
    answer: "New York's general age of consent is 17. Consent can also be legally invalid because of incapacity or a custodial relationship, even after the age threshold is met."

  - question: "How many states have an age of consent of 16?"
    answer: "The table places 32 states in the 16-year group, including Alabama and Washington. A general threshold does not remove separate protections involving coercion or authority over a teenager."

  - question: "What is a Romeo and Juliet law?"
    answer: "A Romeo and Juliet law usually means a close-in-age exception or defense, such as the provision listed for Arizona. The name is informal, and the allowed ages, conduct, and other conditions come from the statute."

  - question: "What is the age of consent in Florida?"
    answer: "Florida lists a general threshold of 18 and a close-in-age provision. Registry relief and a defense to a criminal charge are different legal questions, so the Yes cell does not promise immunity from prosecution."

