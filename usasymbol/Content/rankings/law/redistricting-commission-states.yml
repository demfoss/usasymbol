  - id: why-states-use-redistricting-commissions
    icon: "fa-solid fa-scale-balanced"
    title: "Why States Use Redistricting Commissions"
    paragraphs:
      - "Voters, not legislators, created most independent commissions. Arizona approved its panel by ballot measure in 2000, California voters moved legislative maps to a citizens commission in 2008 and added congressional maps in 2010, and Colorado and Michigan followed in 2018. Lawmakers rarely give up map-drawing power voluntarily, so states with a [ballot initiative](/rankings/law/ballot-initiative-states) process dominate the top of the table."
      - "Legislatures still draw the maps in 23 states, including Florida, Georgia and North Carolina. Several of them keep a backup commission, such as Texas and Oklahoma for legislative maps, that acts only if lawmakers miss a deadline or a court strikes a plan down."
  - id: mid-decade-redistricting-in-2025-and-2026
    icon: "fa-solid fa-map-location-dot"
    title: "Mid-Decade Redistricting in 2025 and 2026"
    paragraphs:
      - "Congressional maps are normally redrawn once after each census, but in 2025 several states reopened them. Texas passed a new map in August 2025, and California voters answered with Proposition 50 in November. A federal panel in Texas first found the map to be a racial gerrymander, but the U.S. Supreme Court allowed it to be used. California's map also survived a challenge, and the Supreme Court declined to block it in February 2026."
      - "Missouri passed a map in September 2025, but opponents gathered signatures for a referendum. In September 2026 the Missouri Supreme Court held the new map never took effect, and the U.S. Supreme Court ruled the 2022 map must be used in November. Voters will decide the 2025 map as Proposition A."
      - "Virginia's April 2026 amendment was struck down by the state Supreme Court, and Indiana's Senate rejected a new map in December 2025. After the Supreme Court decided Louisiana v. Callais in April 2026, Tennessee redrew its Memphis district and Alabama won permission to use a new map. Louisiana adopted a new map in May, and a federal challenge to it is pending."
    table:
      columns:
        state: "State"
        action: "What Happened"
        status: "Map for November 2026"
      rows:
