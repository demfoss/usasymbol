faq:
  - question: "Which states use independent redistricting commissions?"
    answer: "Arizona, California, Colorado, Idaho, Michigan, Montana and Washington use them for both congressional and legislative maps. Alaska uses one for state legislative districts and has a single congressional seat."
  - question: "Who draws congressional maps in Texas?"
    answer: "The Texas Legislature draws them. Texas has a backup commission only for state legislative maps, and none for Congress. A new 2025 congressional map is in use for November 2026 after the U.S. Supreme Court allowed it."
  - question: "What is California Proposition 50?"
    answer: "Proposition 50 is the November 2025 measure that lets the state use a congressional map drawn by the legislature for 2026, 2028 and 2030. California's citizens commission still draws maps after the next census."
  - question: "Which congressional map does Missouri use in 2026?"
    answer: "Missouri uses its 2022 map. A referendum petition suspended the 2025 map, and the U.S. Supreme Court ruled on September 25, 2026 that the older map controls. Voters will decide on the 2025 map as Proposition A."
  - question: "Did Virginia change its congressional map in 2026?"
    answer: "No. Voters approved a redistricting amendment in April 2026, but the Virginia Supreme Court voided it on May 8 because early voting had begun before the legislature's required intervening election. The court-drawn 2021 map remains."
  - question: "Which states have only one congressional district?"
    answer: "Alaska, Delaware, North Dakota, South Dakota, Vermont and Wyoming. Montana was in this group until the 2020 census gave it a second seat."
  - question: "Who draws Utah's congressional map?"
    answer: "The legislature does, with an independent commission that only advises. In 2025 a state judge found the legislature's map violated Proposition 4, a 2018 voter initiative, and chose a different map that is in use in 2026."
  - question: "Why do legislatures still draw most maps?"
    answer: "State constitutions give lawmakers that job, and only 15 states give a commission primary power over at least one set of maps. Changing the system usually takes a constitutional amendment, and legislators seldom refer one to voters themselves."
