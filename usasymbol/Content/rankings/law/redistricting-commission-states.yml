sections:
  - id: states-with-independent-redistricting-commissions
    icon: "fa-solid fa-people-group"
    title: "States With Independent Redistricting Commissions"
    paragraphs:
      - "Arizona, California, Colorado, Idaho, Michigan, Montana and Washington hand both congressional and legislative maps to commissions that elected officials cannot control. Alaska does the same for state legislative districts, but it elects only one House member, so it has no congressional map to draw. Montana's panel drew a second congressional district after the 2020 census."
