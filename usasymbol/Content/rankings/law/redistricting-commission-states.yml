  - id: states-with-one-congressional-district
    icon: "fa-solid fa-flag-usa"
    title: "States With One Congressional District"
    paragraphs:
      - "Alaska, Delaware, North Dakota, South Dakota, Vermont and Wyoming each elect a single House member, so no one draws a congressional map there at all. Montana left that group after the 2020 census gave it a second seat, which its independent commission drew. These six states still draw state legislative districts, and only Alaska uses an independent commission for them."
