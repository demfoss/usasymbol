page:
  h1: "Redistricting Commission States"
  quick_answer:
    - "Redistricting commission states with full independent control are Arizona, California, Colorado, Idaho, Michigan, Montana and Washington, plus Alaska for legislative maps. Voters created most of these panels at the ballot box."
    - "Texas, California, North Carolina, Ohio, Utah and Florida use redrawn congressional maps in November 2026. Missouri's 2025 map is on hold until voters decide Proposition A, so its 2022 map applies."
    - "Virginia voters approved a new redistricting amendment in April 2026, but the state Supreme Court voided it in May. The court-drawn 2021 congressional map stays in place."
  methodology: "Checked October 2026 using Loyola Law School's All About Redistricting, Voting Rights Lab, Missouri Independent and Wikipedia. Code 4 is an independent commission, 3 politician, 2 advisory or backup, 1 legislature only, using the strongest role in either map type."
