  description: "California and Minnesota allow motorcycle lane splitting. Utah, Montana, Arizona, and Colorado allow lane filtering in stopped traffic."

page:
  h1: "Lane Splitting Laws by State"

  quick_answer:
    - "Lane splitting is legal in California and Minnesota. California never banned riding between lanes and wrote the practice into law in 2016."
    - "Utah, Montana, Arizona, and Colorado allow only lane filtering, which means riding between cars that are stopped or barely moving, usually at 15 mph or less."
    - "Minnesota is the newest state on the list. Its 2025 law allows splitting up to 25 mph and makes it a misdemeanor for a driver to block a rider on purpose."

  methodology: "Status reflects each state's vehicle code on record for 2026. Lane splitting means riding between lanes of moving traffic, lane filtering means riding between stopped vehicles. Informational only, not legal advice."

  sources:
    - name: "California Vehicle Code § 21658.1"
      url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=21658.1"
      description: "California's definition of lane splitting, added in 2016"
