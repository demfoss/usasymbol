sections:
  - id: "why-lane-splitting-is-legal-in-california"
    icon: "fa-solid fa-motorcycle"
    title: "Why Lane Splitting Is Legal in California"
    paragraphs:
      - "California is the only state where riders have split lanes for generations. Its vehicle code simply never banned it, while most other states copied model traffic rules that say a motorcycle may not ride between lanes. In 2016 lawmakers defined lane splitting in the code and let the Highway Patrol publish safety tips."
      - "Year-round riding weather and some of the worst freeway traffic in the country kept the habit alive. A rider stuck in Los Angeles traffic in July also faces an engine that overheats at a standstill, a problem filtering solves."

  - id: "states-where-lane-filtering-is-legal"
    icon: "fa-solid fa-traffic-light"
    title: "States Where Lane Filtering Is Legal"
    paragraphs:
      - "Utah opened the door in 2019, followed by Montana in 2021, Arizona in 2022, and Colorado in 2024. All four allow riders to move between cars only when traffic is stopped or crawling, and Montana's limit of 20 mph is the highest of the group."
      - "Supporters point to rear-end crashes. A motorcycle waiting at a red light has little protection if a distracted driver rolls into it from behind, so moving to the front of the line can be safer than waiting in it. Like [motorcycle helmet laws](/rankings/law/motorcycle-helmet-laws-by-state), the rules shift from state to state."

