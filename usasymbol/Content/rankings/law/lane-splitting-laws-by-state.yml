faq:
  - question: "Is lane splitting legal in Texas?"
    answer: "No. Riding between lanes is not legal in Texas. Bills to allow lane filtering have been introduced, but none has become law."

  - question: "Is lane splitting legal in Florida?"
    answer: "No. Florida law expressly bans riding a motorcycle between lanes of traffic or between rows of vehicles."

  - question: "What is the difference between lane splitting and lane filtering?"
    answer: "Lane splitting means riding between lanes of moving traffic. Lane filtering means moving between stopped or very slow cars, usually to reach the front at a red light."

  - question: "Which states allow lane filtering?"
    answer: "Utah, Montana, Arizona, and Colorado allow filtering in stopped or slow traffic. California and Minnesota allow full lane splitting, which covers filtering too."

  - question: "Is lane splitting legal in Minnesota?"
    answer: "Yes, since July 1, 2025. Riders may split lanes at up to 25 mph and no more than 15 mph faster than traffic, but not in school zones, roundabouts, or on freeway on-ramps."

  - question: "Can you get a ticket for lane splitting?"
    answer: "Yes, in the 44 states where it is not legal. Even in California a rider can be cited for unsafe riding, and [traffic congestion](/rankings/infrastructure/traffic-congestion-by-state) is no excuse in the eyes of an officer."

