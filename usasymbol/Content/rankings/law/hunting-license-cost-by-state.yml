  - id: "resident-vs-nonresident-hunting-license-cost"
    title: "Resident vs Nonresident Hunting License Cost"
    paragraphs:
      - "Michigan residents pay $11 for the base license that every hunter must buy first, while nonresidents pay $151, a gap of 13.7 times. Hawaii and Mississippi charge residents $10, and Arkansas charges $10.50, so nonresidents there pay $95, $95, and $110 for the same kind of license."
      - "California has the costliest resident license at $64.54, followed by Washington at $55.13 and Alaska at $45. Wyoming sells the most licenses per resident, and the [hunting license sales by state](/rankings/sports/hunting-license-sales-by-state) ranking shows how many each state sells."
