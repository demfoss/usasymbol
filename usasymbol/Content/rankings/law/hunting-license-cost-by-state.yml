seo:
  title: "Hunting License Cost by State 2026 | Map & Rankings"
  description: "Texas charges nonresidents $315 for its general hunting license, the most of any state. Montana is cheapest at $50, and Michigan residents pay just $11."

page:
  h1: "Hunting License Cost by State 2026"

  quick_answer:
    - "Hunting license cost by state is highest for nonresidents in Texas, at $315 for the general license. It is the only Texas license that lets an out-of-state hunter take deer."
    - "Montana charges nonresidents the least at $50. That is only the base license fee, and species tags cost extra. New Hampshire is next at $53 for a small-game license that leaves out deer."
    - "Michigan has the widest gap, with residents paying $11 and nonresidents $151, or 13.7 times as much. Hawaii, Mississippi, and Montana charge residents just $10, the lowest of any state."

  methodology: "State wildlife agency fee schedules for the current license year. Nonresident is the standard small-game or base hunting license, resident the matching basic license, before stamps, agent fees, and tags. Multiples divide nonresident by resident price."

