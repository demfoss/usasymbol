sections:
  - id: "most-expensive-hunting-license-by-state"
    title: "Most Expensive Hunting License by State"
    paragraphs:
      - "Texas charges nonresidents $315, which is 12.6 times the $25 residents pay. The general license is the only one that lets a visitor hunt white-tailed or mule deer, so deer hunters have no cheaper option. Most of Texas is private land, with far less [public land](/rankings/geography/public-land-by-state) than the western states, so a visitor's license is usually just the first bill before a lease or a guided hunt."
      - "Washington follows at $252.47, and California charges $225.46, both states where residents also pay a lot, at $55.13 and $64.54. Oklahoma ranks fourth at $209, and Louisiana's $200 is ten times its $20 resident price."
