  - id: "cheapest-hunting-license-by-state"
    title: "Cheapest Hunting License by State"
    paragraphs:
      - "Montana charges nonresidents $50, the lowest price in the table, and New Hampshire follows at $53. The $50 is only the base hunting license, so a $10 conservation license and species licenses for deer or elk come on top. New Hampshire's $53 covers small game only, while its full nonresident hunting license costs $113."
      - "Alaska's $60 nonresident small-game license is just 1.3 times the $45 residents pay, the smallest gap in the table. The state puts its real prices on big-game tags instead, and a nonresident deer tag costs $300. Illinois ($57.75) also lands near the bottom, well below its neighbors Iowa ($131) and Indiana ($90)."
