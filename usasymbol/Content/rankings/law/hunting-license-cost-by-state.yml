faq:
  - question: "Which state has the most expensive hunting license?"
    answer: "Texas, at $315 for a nonresident general hunting license. Washington ($252.47) and California ($225.46) come next."

  - question: "How much is a hunting license in Texas?"
    answer: "A Texas resident pays $25 for the general hunting license, while a nonresident pays $315. Nonresidents who only want small game can choose a five-day license for $48 instead."

  - question: "What is the cheapest state to buy a nonresident hunting license?"
    answer: "Montana, at $50 for the base license. Deer, elk, and other species require separate licenses on top of it. New Hampshire ($53) and Illinois ($57.75) are the next cheapest."

  - question: "How much is a hunting license in Michigan?"
    answer: "Michigan charges residents $11 and nonresidents $151 for the base license. That is the widest gap of any state, 13.7 times."

  - question: "Why do nonresidents pay more for a hunting license?"
    answer: "State wildlife agencies live largely on license sales and federal excise taxes on guns and ammunition, and every state in the table prices out-of-state hunters above its own residents. The premium runs from 1.3 times in Alaska to 13.7 times in Michigan."

  - question: "How much is a hunting license in California?"
    answer: "California residents pay $64.54, the highest resident price in the table, and nonresidents pay $225.46. Deer tags are a separate purchase, and a nonresident first deer tag adds $377.35."

