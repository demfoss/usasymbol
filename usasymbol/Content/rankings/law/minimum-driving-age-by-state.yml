page:
  h1: "Driving Age by State"

  quick_answer:
    - "Driving age by state is lowest in Alaska, Arkansas, Iowa, Kansas, North Dakota, and South Dakota, where teens can get a learner's permit at 14. Farm work and long rural distances explain the early start."
    - "South Dakota lets teens drive without a parent youngest, with a restricted permit at 14 years 6 months. New Jersey makes them wait longest, until 17 for a probationary license."
    - "Seven states, including New York, Massachusetts, and Pennsylvania, make teens wait until 16 for even a learner's permit."

  methodology: "Graduated driver licensing ages and supervised-hour rules from the Insurance Institute for Highway Safety, table updated October 2026. Ages are in years, so 15.5 means 15 years 6 months."

  sources:
