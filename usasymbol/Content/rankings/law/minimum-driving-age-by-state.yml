sections:
  - id: "why-south-dakota-has-the-youngest-driving-age"
    icon: "fa-solid fa-tractor"
    title: "Why South Dakota Has the Youngest Driving Age"
    paragraphs:
      - "South Dakota lets a 14-year-old hold a learner's permit and drive without a parent at 14 years 6 months, the youngest of any state. Farms and ranches there sit miles from the nearest school or town, and families have counted on teenagers to drive to class and help with field work for generations."
      - "Its neighbors made the same choice. North Dakota, Iowa, and Kansas also issue permits at 14, and Iowa adds a school license that lets some rural teens drive themselves to school before they turn 15."

  - id: "states-with-the-oldest-driving-age"
    icon: "fa-solid fa-city"
    title: "States With the Oldest Driving Age"
    paragraphs:
      - "New Jersey makes teens wait until 17 to drive alone, the latest of any state. Its probationary drivers must also display a red decal on their plates under Kyleigh's Law, which took effect in 2010 and is named for a teen killed as a passenger in a 2006 crash."
      - "Connecticut, Delaware, Massachusetts, New York, Pennsylvania, and Rhode Island hold back even the learner's permit until 16. Dense towns, short distances, and buses and trains make it easier for teens in the Northeast to get around without a car."
    table:
      columns:
        state: "State"
        age: "Provisional License Age"
      rows:
        - state: "New Jersey"
          age: "17"
        - state: "Delaware"
          age: "16 years 6 months"
        - state: "Maryland"
          age: "16 years 6 months"
        - state: "Massachusetts"
          age: "16 years 6 months"
        - state: "New York"
          age: "16 years 6 months"
        - state: "Pennsylvania"
          age: "16 years 6 months"
        - state: "Rhode Island"
          age: "16 years 6 months"
        - state: "Connecticut"
          age: "16 years 4 months"
        - state: "Virginia"
          age: "16 years 3 months"

  - id: "supervised-driving-hours-by-state"
    icon: "fa-solid fa-clock"
    title: "Supervised Driving Hours by State"
    paragraphs:
      - "Maine asks for the most practice, 70 hours with a licensed adult before a teen can drive alone. Pennsylvania follows at 65, and Kentucky, Maryland, and North Carolina require 60."
      - "Fifty hours is the most common rule, used by 29 states. Iowa asks for only 20, while Arkansas and Mississippi set no minimum at all, leaving the amount of practice to parents."

  - id: "graduated-driver-licensing-explained"
    icon: "fa-solid fa-road"
    title: "Graduated Driver Licensing Explained"
    paragraphs:
      - "Every state now licenses teens in three steps, a learner's permit, a provisional license, and a full license. Florida built the first complete system in 1996, and every state has since adopted its own version."
      - "The middle stage carries the limits. Provisional drivers usually cannot drive late at night or carry several teen passengers, the two situations most tied to teen crashes. [Texting while driving laws](/rankings/law/texting-while-driving-laws-by-state) add another layer for new drivers."

