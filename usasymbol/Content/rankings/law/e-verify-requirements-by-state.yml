  description: "Alabama, Arizona, Mississippi and South Carolina require E-Verify for every private employer. Florida, Georgia and Utah apply headcount thresholds."
page:
  h1: "E-Verify Requirements by State"
  quick_answer:
    - "E-Verify requirements are broadest in Alabama, Arizona, Mississippi and South Carolina, where every private employer must check new hires through the federal system. Florida, Georgia, North Carolina, Tennessee and Utah set headcount thresholds."
    - "Eleven states, from Texas to Pennsylvania, apply the rule only to government hiring or public contractors. Arkansas began on January 1, 2026, and Iowa followed on July 1, 2026."
    - "Ohio's mandate is the newest and narrowest, covering only nonresidential construction employers since March 19, 2026. Montana, Colorado and Minnesota offer a choice or a certification duty instead of a flat mandate."
  methodology: "State statutes, agency pages and legislative records checked October 2026, including 2026 session outcomes. Code 3 is a private employer mandate, 2 public employers and contractors, 1 a limited or alternative duty, and 0 no state mandate. Michigan and West Virginia are coded 0 because no enacted requirement could be verified."
