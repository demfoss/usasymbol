  - id: e-verify-for-public-employers-and-contractors
    icon: "fa-solid fa-building-columns"
    title: "E-Verify for Public Employers and Contractors"
    paragraphs:
      - "Eleven states limit the rule to government hiring or work done under public contracts. Virginia covers contractors with more than 50 employees on state contracts above $50,000 and can bar violators from state contracting for up to one year. Pennsylvania's Act 141 has applied to public works projects above $25,000 since July 22, 2023."
      - "The newest additions came in 2026. Arkansas began on January 1, 2026, and Iowa's Senate File 2218 added state agencies and the legislature on July 1, 2026. Idaho has relied on a 2009 executive order, and a 2026 bill to put it in statute stalled when the Senate did not concur in House amendments."
    table:
      columns:
        state: "State"
        who: "Who Must Use E-Verify"
      rows:
        - { state: "Arkansas", who: "State and local government employers" }
        - { state: "Idaho", who: "State agencies and state contractors" }
        - { state: "Indiana", who: "State agencies, local governments and public contractors" }
        - { state: "Iowa", who: "State agencies and the legislature" }
        - { state: "Louisiana", who: "Public contract bidders and contractors" }
        - { state: "Missouri", who: "Public employers and state contracts above $5,000" }
        - { state: "Nebraska", who: "Public employers and public contractors" }
        - { state: "Oklahoma", who: "Public contractors and subcontractors" }
        - { state: "Pennsylvania", who: "Public works contractors on projects above $25,000" }
        - { state: "Texas", who: "State agencies and state contractors" }
        - { state: "Virginia", who: "Contractors with more than 50 employees on contracts above $50,000" }
  - id: what-is-e-verify-and-how-does-it-work
    icon: "fa-solid fa-id-card"
    title: "What Is E-Verify and How Does It Work"
    paragraphs:
      - "E-Verify is a free online system run by the Department of Homeland Security. An employer types in details from a new hire's Form I-9, and the system compares them with Department of Homeland Security and Social Security Administration records, usually within seconds. Congress created it in 1996 as the Basic Pilot program, and for most employers it is still voluntary under federal law."
      - "A mismatch does not end the job. The employee can contest the result with the relevant agency while continuing to work. Federal contractors with covered contracts must use the system everywhere, and Montana, Louisiana and Indiana let employers choose E-Verify or another documented method. Ohio since March 19, 2026 requires it only for nonresidential construction."
