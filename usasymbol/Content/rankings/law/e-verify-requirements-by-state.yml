sections:
  - id: why-some-states-require-e-verify
    icon: "fa-solid fa-scale-balanced"
    title: "Why Some States Require E-Verify"
    paragraphs:
      - "Arizona and Alabama share first place with seven other states because each wrote the mandate into its business licensing rules. Federal law left E-Verify voluntary for most employers when Congress created it in 1996, but it allows states to act through licensing. Arizona's mandate took effect on January 1, 2008, and the U.S. Supreme Court upheld it in 2011. Alabama's followed on April 1, 2012."
      - "At the other end, 26 states leave the system voluntary. California bars cities and counties from requiring private employers to use it, and Illinois limits how enrolled employers may use it. Most of the rest have simply never passed a statute."
  - id: states-that-require-e-verify-for-private-employers
    icon: "fa-solid fa-briefcase"
    title: "States That Require E-Verify for Private Employers"
    paragraphs:
      - "Only Alabama, Arizona, Mississippi and South Carolina cover every private employer. Florida's 25-employee threshold began on July 1, 2023, and a 2026 bill to remove it passed the House but died in the Senate Rules Committee on March 13, 2026. Tennessee's threshold of 35 full-time equivalent employees began on January 1, 2023."
      - "South Carolina ties compliance to the employer's state license, so a repeat failure to verify within three years can bring a suspension of 10 to 30 days. Florida gives a noncompliant employer 30 days to cure, and three findings within 24 months trigger fines of $1,000 per day until the problem is fixed. Utah's threshold of 150 employees is the highest. All nine states are also [right-to-work states](/rankings/law/right-to-work-states)."
    table:
      columns:
        state: "State"
        requirement: "Private Employers Covered"
      rows:
