faq:
  - question: "Which states require E-Verify for all employers?"
    answer: "Alabama, Arizona, Mississippi and South Carolina require every private employer to use E-Verify for new hires. Florida, Georgia, North Carolina, Tennessee and Utah apply the rule only above a headcount threshold."
  - question: "Does Texas require E-Verify?"
    answer: "Texas requires it for state agencies and state contractors but not for private employers. A 2025 bill to cover all employers passed the Senate and died in the House."
  - question: "Is E-Verify required in Florida?"
    answer: "Yes for private employers with 25 or more employees, since July 1, 2023, and for public agencies and their contractors. Smaller employers can use it voluntarily."
  - question: "Is E-Verify mandatory in California?"
    answer: "No. California does not require it, and cities and counties may not make private employers use it. Employers that do enroll face state limits on misuse."
  - question: "What happens if an employer in South Carolina skips E-Verify?"
    answer: "The first failure puts the employer on probation for one year with quarterly reports. A repeat within three years can bring a license suspension of 10 to 30 days."
  - question: "Does Ohio require E-Verify?"
    answer: "Only for nonresidential construction. Contractors, subcontractors and labor brokers in that field have had to use it since March 19, 2026, with civil fines of $250 to $5,000 per violation."
  - question: "Does Indiana require employers to use E-Verify?"
    answer: "Not for private employers. The FAIRNESS Act, in force since July 1, 2026, bars knowingly employing workers without authorization and counts E-Verify use as one way to show reasonable diligence."
