faq:
  - question: "Which states require overtime after 8 hours a day?"
    answer: "California, Alaska, and Nevada use an 8-hour daily line, though Nevada's applies only to workers paid less than 1.5 times the state minimum wage. Colorado counts daily hours too, starting after 12."

  - question: "Does California pay double time?"
    answer: "Yes. California pays double time after 12 hours in a workday and after 8 hours on the seventh straight day of work. No other state has a broad double-time rule."

  - question: "Does Texas have an overtime law?"
    answer: "No state law. Texas workers rely on the federal Fair Labor Standards Act, which requires time and a half after 40 hours a week for most hourly jobs."

  - question: "What is the overtime law in Florida?"
    answer: "Florida has no overtime law of its own. Federal law sets the rule, so most hourly workers earn time and a half after 40 hours in a workweek, with no daily overtime."

  - question: "Is overtime after 40 hours in every state?"
    answer: "For most workers, yes, because federal law reaches nearly every employer. Minnesota's own law starts at 48 hours and Kansas's at 46, but those rules apply mainly to small businesses the federal law does not cover."

  - question: "What is the overtime law in New York?"
    answer: "New York requires overtime after 40 hours a week, with no daily overtime. Residential employees who live where they work, such as live-in domestic workers, qualify after 44 hours."

  - question: "Does Kentucky have seventh-day overtime?"
    answer: "Yes. Kentucky pays premium pay for work on a seventh straight day in a workweek, on top of its 40-hour weekly rule."

  - question: "Can a union contract give more overtime than state law?"
    answer: "Yes. A contract can add daily overtime or double time, but it cannot pay less than state or federal law requires. [Union membership by state](/rankings/economy/union-membership-rate-by-state) shows where those contracts are most common."

