sections:
  - id: "why-california-has-the-strictest-overtime-law"
    icon: "fa-solid fa-clock"
    title: "Why California Has the Strictest Overtime Law"
    paragraphs:
      - "California pays time and a half after 8 hours in a workday and double time after 12. A seventh straight day of work earns a premium too, time and a half for the first 8 hours and double time after that. No other state stacks this many triggers."
      - "The 8-hour day was nearly lost in the 1990s. Starting in 1998, a state wage commission rule ended daily overtime for most industries, and workers suddenly needed 40 hours in a week to earn extra pay. Labor unions fought back, and the legislature restored the daily rule with a 1999 law that took effect in 2000."

  - id: "states-with-daily-overtime-laws"
    icon: "fa-solid fa-calendar-day"
    title: "States With Daily Overtime Laws"
    paragraphs:
      - "Alaska comes closest to California, with overtime after 8 hours a day at employers with four or more workers. Colorado draws its daily line at 12 hours and also counts 12 consecutive hours, so a long shift that runs past midnight still qualifies."
      - "Nevada attaches an income test to its daily rule. Workers paid less than 1.5 times the state minimum wage get overtime after 8 hours a day, while higher earners qualify only after 40 hours a week. Employers and workers may also agree on four 10-hour days without daily overtime."
      - "Oregon has a narrower daily rule. Manufacturing workers there earn overtime after 10 hours in a day, and the state has capped factory hours for a long time. The U.S. Supreme Court upheld its 10-hour workday limit for women in Muller v. Oregon in 1908."
    table:
      columns:
        state: "State"
        daily: "Daily Overtime After"
        weekly: "Weekly Overtime After"
        rule: "Key Detail"
      rows:
        - state: "California"
          daily: "8 hours"
          weekly: "40 hours"
          rule: "Double time after 12 hours"
        - state: "Alaska"
          daily: "8 hours"
          weekly: "40 hours"
          rule: "Employers with 4 or more workers"
        - state: "Nevada"
          daily: "8 hours"
          weekly: "40 hours"
          rule: "Workers under 1.5 times the minimum wage"
        - state: "Colorado"
          daily: "12 hours"
          weekly: "40 hours"
          rule: "Also after 12 consecutive hours"

  - id: "states-with-no-overtime-law"
    icon: "fa-solid fa-map"
    title: "States With No State Overtime Law"
    paragraphs:
      - "Eighteen states have no overtime law of their own, mostly in the South and the Mountain West, from Texas and Florida to Utah and Wyoming. Every one of them except Delaware is also among the [right-to-work states](/rankings/law/right-to-work-states)."
      - "Arizona, Delaware, Florida, and Nebraska show that pay floors and overtime are separate fights. Each sets a [minimum wage](/rankings/economy/minimum-wage-by-state) well above the federal floor, yet none adds an overtime rule. Virginia passed its own overtime law in 2021, then rewrote it in 2022 to simply follow the federal standard."

  - id: "highest-overtime-threshold-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "Highest Overtime Threshold by State"
    paragraphs:
      - "Minnesota sets the highest state threshold, with overtime after 48 hours a week, and Kansas follows at 46. Neither number reaches most workers. Anyone covered by the federal Fair Labor Standards Act still earns overtime after 40, so the state line matters mainly at small local businesses outside federal reach."
      - "Congress set the 40-hour line. The Fair Labor Standards Act of 1938 started at 44 hours and stepped down to 40 by 1940. The 26 states in the weekly 40-hour group, from Maine to Hawaii, use that same number in their own laws."

