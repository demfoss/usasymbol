  description: "California, Alaska, Colorado, and Nevada require daily overtime. Eighteen states have no overtime law of their own and follow the federal rule."

page:
  h1: "Overtime Laws by State"

  quick_answer:
    - "Overtime laws by state are strictest in California, which pays time and a half after 8 hours in a day and double time after 12. Alaska, Colorado, and Nevada also count daily hours."
    - "Eighteen states, including Texas, Florida, and Georgia, have no overtime law of their own. Workers there still earn time and a half after 40 hours a week under the federal Fair Labor Standards Act of 1938."
    - "Minnesota sets the highest state threshold at 48 hours a week, and Kansas sets 46. Few workers feel it, because the federal 40-hour rule covers most jobs in both states."

  methodology: "Thresholds from the U.S. Department of Labor State Minimum Wage Laws page (updated July 1, 2026), checked against state law. Kansas, not listed there, comes from K.S.A. 44-1204. DC and territories are excluded."

