        - { state: "Rhode Island", minimum_age: 18 }
        - { state: "Texas", minimum_age: 18 }
        - { state: "Washington", minimum_age: 18 }
  - id: tanning-with-parental-permission
    icon: "fa-solid fa-users"
    title: "Tanning With Parental Permission"
    paragraphs:
      - "Pennsylvania and New Jersey both start at 17, but they ask parents to do different things. Pennsylvania requires written authorization for a 17-year-old, while New Jersey requires the parent or guardian to attend the initial consultation. New Jersey also separates spray tanning from UV tanning, with a younger age floor for the spray service."
      - "Connecticut prohibits device use below 17 even if a parent agrees. A salon offering both UV beds and cosmetic services must keep the tanning age rule separate from the training and practice rules for [esthetician licenses](/rankings/law/esthetician-license-requirements-by-state)."
  - id: medical-exceptions-to-tanning-age-laws
    icon: "fa-solid fa-file-medical"
    title: "Medical Exceptions to Tanning Age Laws"
    paragraphs:
      - "Oregon's general minimum is 18, but a minor can receive treatment with a physician's written recommendation on the state form. Washington also uses 18 as its general floor and permits younger users with a physician's written prescription for ultraviolet radiation treatment. A parent's signature alone is insufficient in either state."
      - "Massachusetts prohibits customers and device operators below 18. Phototherapy equipment used under a trained licensed health care provider falls outside its commercial tanning regulations, keeping medical treatment distinct from a cosmetic salon visit."
