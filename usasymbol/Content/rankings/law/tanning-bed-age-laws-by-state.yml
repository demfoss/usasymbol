sections:
  - id: why-tanning-age-limits-differ
    icon: "fa-solid fa-scale-balanced"
    title: "Why Tanning Age Limits Differ"
    paragraphs:
      - "California and Illinois use an adult-only rule, making 18 the highest general floor in this comparison. Illinois expressly rejects parental permission as a way around the prohibition, so a signed form cannot turn a minor into an eligible customer."
      - "North Dakota has the lowest listed floor at 14 because its law uses two different safeguards. Children below that age need a physician's order and a parent at every visit, while older minors can use a facility with written parental consent. Permission expires after twelve months rather than lasting through the child's entire adolescence."
    table:
      columns:
        state: "State"
        minimum_age: "General Minimum Age"
      rows:
        - { state: "California", minimum_age: 18 }
        - { state: "Illinois", minimum_age: 18 }
        - { state: "Massachusetts", minimum_age: 18 }
        - { state: "Minnesota", minimum_age: 18 }
