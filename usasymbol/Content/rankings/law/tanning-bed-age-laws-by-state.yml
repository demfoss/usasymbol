  description: "California bans commercial UV tanning under 18. New Jersey allows it at 17 with a parent present for the initial consultation."
page:
  h1: "Tanning Bed Age Laws by State"
  quick_answer:
    - "Tanning bed age laws in California set the commercial UV tanning minimum at 18. Parental permission cannot authorize a younger customer to use a tanning bed."
    - "North Dakota sets a general age floor of 14, with parental consent required until 18. A younger child needs a physician's written order and a parent or guardian present at every visit."
    - "New Jersey allows a 17-year-old to use a UV tanning device if a parent or guardian attends the initial consultation. Its separate spray-tanning rule bars customers under 14."
  methodology: "State statutes and health agencies checked October 7, 2026, ordering 15 selected states by their general commercial UV tanning age floor. Other states, medical exceptions, private devices and spray tanning are excluded."
