faq:
  - question: "Can you use a tanning bed under 18 in Texas?"
    answer: "Texas tanning facilities cannot allow anyone younger than 18 to use a tanning device. A parent cannot authorize an exception to that facility age rule."
  - question: "What is the tanning bed age limit in New York?"
    answer: "New York requires a customer to be at least 18 and provide qualifying photo identification. The rule applies to UV beds, booths and sunlamps."
  - question: "Can a 17-year-old tan in Pennsylvania?"
    answer: "Yes, with written authorization from a parent or legal guardian. Pennsylvania prohibits anyone 16 or younger from using a tanning facility."
  - question: "What is the tanning bed age limit in Wisconsin?"
    answer: "Wisconsin's floor is 16. Salon operators must enforce that age rule even when a younger child's parent is willing to give permission."
  - question: "Can a parent give tanning permission in Illinois?"
    answer: "Parental permission cannot authorize commercial UV tanning below 18 in Illinois. The rule expressly covers use with another person present as well as use alone."
