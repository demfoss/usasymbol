  - id: early-voting-and-presidential-only-registration
    icon: "fa-solid fa-calendar-day"
    title: "Registering During Early Voting Only"
    paragraphs:
      - "North Carolina lets a voter register and vote at the same early voting site, but only until early voting ends on Saturday, October 31. The voter signs up at the site and proves residence, which is why the effective deadline is 3 days before Election Day. The early voting season itself is covered in [early voting by state](/rankings/law/early-voting-by-state)."
      - "Alaska and Rhode Island let people who miss the deadline vote, but only for president and vice president. No presidential race is on the ballot this November, so the 30-day cutoff is the practical deadline in both states."
  - id: voter-registration-deadlines-by-state
    icon: "fa-solid fa-clock"
    title: "Voter Registration Deadlines by State"
    paragraphs:
      - "Alaska, Louisiana and Rhode Island close registration 30 days before the election, and most of the other deadline states cluster at 29. Federal law caps the registration cutoff for presidential elections at 30 days, a limit written into the Voting Rights Act amendments of 1970."
      - "Massachusetts and New York have the shortest fixed deadline at 10 days. North Dakota avoids a deadline altogether because it has no voter registration, so voters need only ID with a current street address, a rule covered in [voter ID laws by state](/rankings/law/voter-id-laws-by-state)."
