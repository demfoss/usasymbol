sections:
  - id: states-with-election-day-voter-registration
    icon: "fa-solid fa-user-plus"
    title: "States With Election Day Voter Registration"
    paragraphs:
      - "Maine started it in 1973, and Minnesota followed in 1974. Minnesota led the country in turnout in 2024, and its voters can register at the polls with proof of residence or have a registered voter vouch for them. Wisconsin joined in 1976."
      - "Idaho and Wyoming adopted same-day registration in 1994, while Iowa waited until 2007. Most of the other states on the list passed their laws after 2012."
