faq:
  - question: "Can you register to vote on Election Day in Wisconsin?"
    answer: "Yes. Wisconsin voters can register at their polling place on Election Day with proof of residence, such as a driver's license or utility bill. The state has allowed it since 1976."
  - question: "What is the voter registration deadline in Texas?"
    answer: "Texas closes registration 29 days before the election, which is October 5 for the November 3, 2026 election. The date moves to Monday because the 30th day falls on a Sunday."
  - question: "Which state was first to allow same-day voter registration?"
    answer: "Maine, in 1973. Minnesota and Wisconsin followed within three years, and both still allow voters to register at the polls."
  - question: "Can you register and vote on the same day in North Carolina?"
    answer: "Yes, but only during early voting, which runs October 15 through October 31 this year. A voter cannot register on Election Day itself, and the standard deadline of 25 days before was October 9."
  - question: "Do you need to register to vote in North Dakota?"
    answer: "No. North Dakota is the only state without voter registration, and a resident votes by showing acceptable ID with a current street address."
  - question: "What is the voter registration deadline in Pennsylvania?"
    answer: "Pennsylvania closes registration 15 days before the election, which is October 19, 2026. It does not offer same-day registration, and the deadline applies to online, mail and in-person applications."
