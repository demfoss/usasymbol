page:
  h1: "Same-Day Voter Registration States"
  quick_answer:
    - "Same-day voter registration lets voters sign up and cast a ballot on Election Day in 21 states, from California to Wyoming. Maine adopted it first, in 1973."
    - "Louisiana, Rhode Island and Alaska close registration 30 days before the election, the longest cutoff on the list. Alaska and Rhode Island allow same-day sign-up only for presidential races, so it does not apply in this year's midterm."
    - "North Carolina lets voters register only during early voting, which ends 3 days before Election Day. North Dakota is the lone state with no voter registration at all."
  methodology: "Last day to register in person for the November 3, 2026 general election, counted in days before Election Day, with 0 meaning Election Day itself. Checked October 2026 against a national deadline calendar and NCSL-based coverage. North Dakota has no registration and is unranked."
