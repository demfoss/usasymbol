page:
  h1: "Landlord Entry Notice Requirements by State"

  quick_answer:
    - "Landlord entry notice requirements are longest in Virginia at 72 hours, a period that applies to routine maintenance the tenant did not request."
    - "Eight states require 48 hours, including Alabama, Arizona, Hawaii, and Washington. Seventeen states, the largest group on record, require 24 hours, among them California, Florida, and Oregon."
    - "Wisconsin has the shortest requirement at 12 hours, half the 24-hour standard and one-sixth of Virginia's 72 hours. Twenty-three states set no fixed number and are shown at 0 hours."

  methodology: "Hours are the advance notice a landlord must give before a non-emergency entry under each state's landlord-tenant statute or rule as of September 2026, with days converted to hours. States whose law requires only reasonable notice with no number are shown as 0 hours."

  sources:
    - name: "Code of Virginia. Section 55.1-1229, Access to dwelling unit"
      url: "https://law.lis.virginia.gov/vacode/title55.1/chapter12/section55.1-1229/"
      description: "Virginia's 72-hour notice rule for routine maintenance the tenant did not request"
    - name: "Wisconsin Administrative Code. ATCP 134.09, Landlord entry"
      url: "https://docs.legis.wisconsin.gov/code/admin_code/atcp/090/134/09"
      description: "Wisconsin's definition of advance notice as at least 12 hours"
    - name: "Revised Code of Washington. RCW 59.18.150, Landlord's entry"
      url: "https://app.leg.wa.gov/rcw/default.aspx?cite=59.18.150"
      description: "Washington's requirement of two days of written notice before entry"
    - name: "New Jersey Department of Community Affairs. Right of Entry"
      url: "https://www.nj.gov/dca/codes/publications/pdf_lti/right_of_entry.pdf"
      description: "New Jersey's one-day reasonable notification standard for multiple dwellings"
    - name: "South Carolina Code of Laws. Section 27-40-530, Access"
      url: "https://www.scstatehouse.gov/code/t27c040.php"
      description: "South Carolina statute requiring at least 24 hours of notice before entry"
    - name: "South Dakota Codified Laws. Chapter 43-32, Landlord and Tenant"
      url: "https://sdlegislature.gov/Statutes/43-32"
      description: "South Dakota statute treating 24 hours of written notice as reasonable notice of entry"

