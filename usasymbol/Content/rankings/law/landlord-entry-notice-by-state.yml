sections:
  - id: "states-with-the-longest-landlord-entry-notice-requirements"
    icon: "fa-solid fa-hourglass-half"
    title: "States With the Longest Landlord Entry Notice Requirements"
    paragraphs:
      - "Virginia sets the longest notice on record at 72 hours, and that figure applies to routine maintenance the tenant did not request. Other non-emergency entry in the state falls under a reasonable notice standard."
      - "Eight states require 48 hours, including Alabama, Arizona, Delaware, Hawaii, Rhode Island, Vermont, and Washington. Kentucky is the eighth, and its 48 hours applies only in cities and counties that have adopted the uniform residential landlord and tenant act."

  - id: "states-with-the-shortest-landlord-entry-notice-requirements"
    icon: "fa-solid fa-clock"
    title: "States With the Shortest Landlord Entry Notice Requirements"
    paragraphs:
      - "Wisconsin requires only 12 hours of notice, the shortest fixed period on record and half the 24-hour standard. A tenant there may consent to an even shorter time. Twenty-three states set no fixed number and appear at 0 hours."
      - "Seventeen states require 24 hours, the most common period, including Alaska, California, Florida, Iowa, Maine, Minnesota, Montana, Nebraska, Nevada, New Jersey, New Mexico, Ohio, Oklahoma, Oregon, South Carolina, South Dakota, and Utah. California, Maine, Ohio, and South Dakota treat 24 hours as the presumed reasonable period rather than a fixed minimum."

