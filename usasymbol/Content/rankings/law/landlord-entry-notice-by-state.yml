faq:
  - question: "Which state has the longest landlord entry notice requirement?"
    answer: "Virginia, at 72 hours. That is 24 hours longer than the 48-hour requirement in eight other states."

  - question: "How much notice must a landlord give before entering in Washington?"
    answer: "Washington requires 48 hours, stated in its statute as two days of written notice. Arizona, Alabama, and Vermont share the same period."

  - question: "How much notice does a landlord need to give in California?"
    answer: "California treats 24 hours as presumed reasonable notice. Florida, Oregon, Nevada, and 13 other states also sit at 24 hours."

  - question: "Which state has the shortest landlord entry notice period?"
    answer: "Wisconsin has the shortest at 12 hours, and a tenant there can agree to a shorter time. Every other state with a fixed number requires at least 24 hours."

  - question: "How many states require 24 hours notice before a landlord enters?"
    answer: "Seventeen states require 24 hours, making it the most common period on record. Alaska, Iowa, Minnesota, Montana, Nebraska, New Mexico, Oklahoma, and Utah are among them."

  - question: "What is the landlord entry notice requirement in Kentucky?"
    answer: "Kentucky requires 48 hours, but only in cities and counties that have adopted the uniform residential landlord and tenant act. That matches the requirement in Alabama, Hawaii, and Rhode Island."

