  title: Fireworks Laws by State | Map, Aerial & Roman Candles
  description: 29 states permit most consumer fireworks. Hawaii, Nevada, and Wyoming rely on local rules, while Massachusetts bans all consumer fireworks.
page:
  h1: Fireworks Laws by State
  quick_answer:
  - Fireworks laws by state place 29 states, including Pennsylvania, in the broad-permission group. Pennsylvania permits consumer products such as Roman candles while reserving professional display fireworks for a separate legal framework.
  - Massachusetts is the only full-ban state in the table. Its prohibition covers consumer possession as well as use, so an out-of-state purchase does not create permission at home.
  - California belongs to the 17-state restricted group, where aerial and explosive consumer fireworks are banned. Hawaii, Nevada, and Wyoming instead have local-rule classifications.
  methodology: World Population Review classification recorded June 25, 2026, checked against Massachusetts and Pennsylvania guidance. Categories summarize consumer fireworks, excluding professional displays and stricter local or seasonal restrictions.
  sources:
  - name: World Population Review. Fireworks Laws by State 2026
    url: https://worldpopulationreview.com/state-rankings/fireworks-laws-by-state
    description: 50-state fireworks legality summary used for the main classification
  - name: Mass.gov. Leave Fireworks to the Professionals
    url: https://www.mass.gov/info-details/leave-fireworks-to-the-professionals
    description: Massachusetts ban on possession, use, and sale of fireworks by private citizens
  - name: Pennsylvania State Police. Fireworks FAQ
    url: https://www.pa.gov/agencies/psp/resources/safety-resources/fireworks-faq
    description: Pennsylvania rules for consumer fireworks purchases and use
  - name: Hawaii Police Department. New Year's Fireworks Rules
    url: https://www.hawaiipolice.gov/police-remind-residents-of-new-years-fireworks-rules-2/
    description: Example of Hawaii county permit rules and common fireworks limits
  - name: American Pyrotechnics Association. State Law Directory
    url: https://www.americanpyro.com/state-law-directory
    description: Industry directory of current state fireworks laws and local-rule notes
  - name: California Office of the State Fire Marshal. Fireworks
    url: https://osfm.fire.ca.gov/what-we-do/fire-engineering-and-investigations/fireworks
    description: Approved safe-and-sane products and fireworks regulation
