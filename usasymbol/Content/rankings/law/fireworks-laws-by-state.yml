page:
  h1: "Fireworks Laws by State"

  quick_answer:
    - "Fireworks laws by state are most permissive in 29 states. Missouri and Pennsylvania are in the group where most consumer fireworks are permitted."
    - "Hawaii, Nevada, and Wyoming are the local-rule outliers. Their rows list Aerial/Explosive as Local and leave the final rule to counties or municipalities."
    - "Massachusetts is the only full-ban state. Arizona, California, Colorado, New York, and 13 other states allow only non-aerial and non-explosive consumer fireworks."

  methodology: "This page uses the four-way classification provided in the source list. Most consumer fireworks permitted means aerial and explosive consumer fireworks are generally legal at the state level, non-aerial and non-explosive means only ground-based consumer items are permitted, and local-rule states are separated because counties or cities can decide the final rule."

  sources:
    - name: "World Population Review. Fireworks Laws by State 2026"
      url: "https://worldpopulationreview.com/state-rankings/fireworks-laws-by-state"
      description: "50-state fireworks legality summary used for the main classification"
    - name: "Mass.gov. Leave Fireworks to the Professionals"
      url: "https://www.mass.gov/info-details/leave-fireworks-to-the-professionals"
      description: "Massachusetts ban on possession, use, and sale of fireworks by private citizens"
    - name: "Pennsylvania State Police. Fireworks FAQ"
      url: "https://www.pa.gov/agencies/psp/resources/safety-resources/fireworks-faq"
      description: "Pennsylvania rules for consumer fireworks purchases and use"
    - name: "Hawaii Police Department. New Year's Fireworks Rules"
      url: "https://www.hawaiipolice.gov/police-remind-residents-of-new-years-fireworks-rules-2/"
      description: "Example of Hawaii county permit rules and common fireworks limits"
    - name: "American Pyrotechnics Association. State Law Directory"
      url: "https://www.americanpyro.com/state-law-directory"
      description: "Industry directory of current state fireworks laws and local-rule notes"

