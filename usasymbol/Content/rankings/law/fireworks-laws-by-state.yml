- id: states-where-fireworks-are-banned
  icon: fa-solid fa-ban
  title: States Where Fireworks Are Banned
  paragraphs:
  - Massachusetts stands alone in the full-ban category because its law reaches private possession, sale, and use rather than merely banning aerial products. The ban includes sparklers, an example of [unusual state laws](/rankings/law/weird-laws-by-state) that visitors can overlook. Professional displays require licensing and permits instead of ordinary consumer permission.
  - Hawaii, Nevada, and Wyoming occupy the local-rule group rather than the full-ban group. Their statewide rows leave a county or municipality central to the answer, so a shopper must identify the relevant local rule before choosing a consumer product.
