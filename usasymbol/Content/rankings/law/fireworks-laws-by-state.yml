sections:
- id: states-where-aerial-fireworks-are-legal
  icon: fa-solid fa-burst
  title: States Where Aerial Fireworks Are Legal
  paragraphs:
  - Pennsylvania belongs to the 29-state broad-permission group because its consumer-fireworks rules allow products such as firecrackers, Roman candles, and bottle rockets. Professional display fireworks remain a separate class, so the broad label does not authorize every explosive product.
  - Texas and Missouri share that broad category, but statewide permission does not settle every neighborhood rule. Fireworks restrictions and [alcohol sales laws](/rankings/law/alcohol-sales-laws) both require separating a statewide category from the conditions attached to a particular place.
