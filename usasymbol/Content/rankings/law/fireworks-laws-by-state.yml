- id: states-with-safe-and-sane-fireworks-only
  icon: fa-solid fa-wand-sparkles
  title: States With Safe and Sane Fireworks Only
  paragraphs:
  - California is one of 17 states in the non-aerial, non-explosive category. Its safe-and-sane system distinguishes approved ground-based products from items that fly or explode, so a legal fountain does not make a bottle rocket legal.
  - New York, New Jersey, and Virginia share the restricted category, but the label is a summary rather than a universal shopping list. Product definitions and local restrictions still determine which ground-based items qualify.
