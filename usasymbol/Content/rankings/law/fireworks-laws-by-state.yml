faq:
  - question: "Where are aerial fireworks legal?"
    answer: "Aerial fireworks are generally legal in 29 states on this map. Missouri, Pennsylvania, Texas, Florida, and Ohio are all in that full-freedom group."

  - question: "What are the fireworks laws in Pennsylvania?"
    answer: "Pennsylvania is in the full-freedom category. Pennsylvania State Police say adults 18 and older can purchase, possess, and use consumer fireworks."

  - question: "What are the fireworks laws in California?"
    answer: "California is in the safe-and-sane category on this page. Its row lists Aerial/Explosive as Banned and limits consumers to non-aerial and non-explosive fireworks."

  - question: "Which states ban all consumer fireworks?"
    answer: "Massachusetts is the only full-ban state on this map. Mass.gov says private citizens cannot possess, use, or sell fireworks without professional licensing."

  - question: "Can I cross state lines with fireworks?"
    answer: "Massachusetts is the clearest warning sign in the table because it is Full Ban. Hawaii, Nevada, and Wyoming are also not simple yes states because their rows are marked Local."

  - question: "Which states allow Roman candles?"
    answer: "The full-freedom states are the broadest legal group for Roman candles on this page. Pennsylvania's law materials specifically include Roman candles in the consumer-fireworks framework, while the safe-and-sane states ban aerial and explosive items."

