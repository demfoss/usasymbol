faq:
- question: What are the fireworks laws in Pennsylvania?
  answer: Pennsylvania permits most consumer fireworks, including Roman candles. Permission for consumer products does not extend automatically to professional display fireworks or override restrictions on where a product may be used.
- question: What are the fireworks laws in California?
  answer: California is classified as safe and sane only. Approved ground-based products fit that category, while aerial and explosive consumer products do not.
- question: Are sparklers legal in Massachusetts?
  answer: No, for ordinary consumer possession or use. Massachusetts treats sparklers as fireworks rather than as an exception to its consumer ban.
- question: Can I bring fireworks from New Hampshire into Massachusetts?
  answer: A legal purchase in New Hampshire does not make private possession legal in Massachusetts. The destination state remains a full-ban state even when the seller operates lawfully across the border.
- question: What are the fireworks laws in Nevada?
  answer: Nevada has a local-rule classification. The relevant county or municipality determines the practical consumer rule, so a statewide yes-or-no answer misses the legal distinction shown in its row.
- question: Which states allow Roman candles?
  answer: Pennsylvania is an example in the broad-permission group and expressly includes Roman candles within its consumer-fireworks framework. California is in the restricted group and bans aerial consumer products.
