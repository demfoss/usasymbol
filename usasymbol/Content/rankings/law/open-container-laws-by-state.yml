faq:
  - question: "Which state has no open container law?"
    answer: "Mississippi. It has no statewide open container law for drivers or passengers, although drunk-driving laws still apply."

  - question: "Can passengers drink in a car in Texas?"
    answer: "No. Texas bans open containers for everyone in the passenger area. A bottle can ride in the trunk or a locked glove compartment."

  - question: "Are drive-through daiquiris legal in Louisiana?"
    answer: "Yes. Louisiana treats a frozen drink with a sealed lid and no straw inserted as a closed container, so drive-through daiquiri shops are legal across much of the state."

  - question: "Can you drink in a limo?"
    answer: "In most states, yes, if you are a passenger. Limousines and chartered buses are the most common exception to open container laws, but the driver can never drink."

  - question: "Can passengers drink in a car in Missouri?"
    answer: "Missouri state law bans only the driver from drinking while the car is moving. Some Missouri cities have stricter local rules, so check before you ride."

  - question: "Where should you keep an opened bottle in the car?"
    answer: "In the trunk. In a car without a trunk, most states accept the area behind the last upright seat. The [drinking age](/rankings/law/drinking-age-by-state) still applies to whoever carries it."

