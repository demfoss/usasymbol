seo:
  title: "Open Container Laws by State | Map, Passengers & Rules"
  description: "Mississippi is the only state with no statewide open container law. Most states ban open alcohol for everyone in a car, but seven ban only the driver."

page:
  h1: "Open Container Laws by State"

  quick_answer:
    - "Open container laws by state ban open alcohol for the driver and passengers in 42 states. Mississippi is the only state with no statewide open container law at all."
    - "Seven states, including Connecticut, Missouri, Tennessee, and Virginia, aim their law at the driver only. A passenger drinking a beer breaks no state law there, though local rules can be stricter."
    - "Louisiana bans open containers for everyone but still sells daiquiris at drive-through windows. A cup with a sealed lid and no straw does not count as open."

  methodology: "Coverage reflects each state's open container statute on record for 2026. Driver only means the law does not reach passengers. Local ordinances may be stricter. Informational only, not legal advice."

  sources:
