sections:
  - id: "why-mississippi-has-no-open-container-law"
    icon: "fa-solid fa-wine-bottle"
    title: "Why Mississippi Has No Open Container Law"
    paragraphs:
      - "Mississippi is the only state with no statewide open container law. A driver there can sip a beer behind the wheel and break no state law, as long as the driver stays under the legal blood alcohol limit for [DUI](/rankings/law/dui-strictness-by-state)."
      - "Mississippi's alcohol rules have always run on local choice. It was the last state to end statewide Prohibition, in 1966, and counties and cities still decide much of what is allowed. The federal government pushes states with highway money, but a state without a qualifying law only has part of those funds shifted to safety programs, so Mississippi has kept its approach."

  - id: "states-where-passengers-can-drink-in-a-car"
    icon: "fa-solid fa-car-side"
    title: "States Where Passengers Can Drink in a Car"
    paragraphs:
      - "Connecticut, Delaware, Missouri, and Virginia ban only the driver's own drinking. None of the four has a separate offense for a passenger holding an open beer, so a passenger can legally drink there under state law."
      - "Alaska, Rhode Island, and Tennessee also aim their law at the driver. Tennessee lets cities and counties add passenger bans of their own, so a ride that is legal on a county road can be illegal inside city limits."

  - id: "open-container-exceptions-for-limos"
    icon: "fa-solid fa-bus"
    title: "Open Container Exceptions for Limos"
    paragraphs:
      - "Even the strictest states make room for a party bus. Most exempt passengers in limousines, chartered buses, and taxis, and many exempt the living quarters of a motor home. The driver never gets the exemption."
      - "The trunk is the safe spot almost everywhere. Texas and Michigan also accept a locked glove compartment, and Georgia lets a resealed bottle of wine from a restaurant ride home in the car."

