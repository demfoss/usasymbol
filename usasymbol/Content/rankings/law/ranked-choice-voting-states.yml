faq:
  - question: "Which states use ranked choice voting?"
    answer: "Maine and Alaska use it in federal general elections. Hawaii uses it for special elections, and Georgia and South Carolina give overseas and military voters ranked ballots for runoffs."
  - question: "Does Maine use ranked choice voting for governor?"
    answer: "Only in primaries. Maine's constitution requires a plurality to win the general election for governor and the legislature, so ranked choice voting applies to those races only in the primary."
  - question: "Which states have banned ranked choice voting?"
    answer: "Nineteen states. They are Alabama, Arkansas, Florida, Idaho, Indiana, Iowa, Kansas, Kentucky, Louisiana, Mississippi, Missouri, Montana, North Dakota, Ohio, Oklahoma, South Dakota, Tennessee, West Virginia and Wyoming."
  - question: "Is ranked choice voting banned in Florida?"
    answer: "Yes. Florida banned it in 2022, about two months after Tennessee became the first state to do so."
  - question: "Is Alaska repealing ranked choice voting?"
    answer: "Voters decide on November 3, 2026. A repeal measure would also end the top-four primary, and the 2024 version missed by fewer than 750 votes."
  - question: "Can the military use ranked choice voting in states that ban it?"
    answer: "In Alabama, Arkansas, Louisiana and Mississippi, overseas and military voters still receive ranked ballots for federal runoffs. The ranking lets their ballot count in a runoff without a second mailing."
  - question: "Which state was first to ban ranked choice voting?"
    answer: "Tennessee, in February 2022, followed by Florida later that spring."
