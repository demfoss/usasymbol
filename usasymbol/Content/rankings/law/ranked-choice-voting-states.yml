sections:
  - id: why-maine-and-alaska-use-ranked-choice-voting
    icon: "fa-solid fa-ranking-star"
    title: "Why Maine and Alaska Use Ranked Choice Voting"
    paragraphs:
      - "Maine adopted ranked choice voting after a run of governor races won with well under a majority. Paul LePage took the 2010 election with under 40 percent of the vote, and voters approved Question 5 in 2016. In 2018, Jared Golden won the 2nd District House seat after ballots were tallied in rounds, the first federal race in the country decided that way."
      - "Alaska voters approved Ballot Measure 2 in 2020, which replaced party primaries with a top-four [primary](/rankings/law/closed-open-primary-states) open to every voter and added ranked choice voting to general elections. Mary Peltola won the 2022 special election for the state's House seat under the new system. Maine's constitution keeps general elections for governor and the legislature at plurality, so ranked ballots cover only primaries there."
  - id: states-that-banned-ranked-choice-voting
    icon: "fa-solid fa-ban"
    title: "States That Banned Ranked Choice Voting"
    paragraphs:
      - "Tennessee passed the first ban in February 2022, and Florida followed that spring. Six states acted in 2024 and six in 2025, and Indiana and Ohio signed bans in early 2026. Kansas and Kentucky enacted theirs under divided government, while the other bans came from Republican-controlled states."
      - "Missouri took a different path. Its voters approved Amendment 7 in November 2024, which wrote the ban into the state constitution instead of leaving it to a statute that a later legislature could repeal."
    table:
      columns:
