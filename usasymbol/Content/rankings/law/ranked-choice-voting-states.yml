page:
  h1: "Ranked Choice Voting States"
  quick_answer:
    - "Ranked choice voting states are Maine and Alaska, which use it in federal general elections. Maine first used it statewide in 2018, and Alaska pairs it with a top-four primary that debuted in 2022."
    - "Nineteen states have banned ranked choice voting, beginning with Tennessee and Florida in 2022. Indiana and Ohio joined in 2026, and Missouri voters approved a constitutional ban in 2024."
    - "Alaska voters face another repeal measure on November 3, 2026. The 2024 attempt failed by fewer than 750 votes."
  methodology: "Statewide use, bans and 2024 to 2026 ballot measures checked October 2026 against Ballotpedia and Wikipedia state tallies. Code 3 uses it in federal general elections, 2 in limited statewide cases, 1 has no statewide use or ban, 0 is banned. D.C. excluded."
