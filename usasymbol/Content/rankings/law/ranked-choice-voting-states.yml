  - id: ranked-choice-voting-for-military-and-overseas-voters
    icon: "fa-solid fa-plane-departure"
    title: "Ranked Choice Voting for Military and Overseas Voters"
    paragraphs:
      - "Georgia and South Carolina sit at code 2 because overseas and military voters there mark ranked ballots that serve as a backup for federal runoffs. A runoff held a month after the general election leaves too little time to mail a second ballot overseas, so a ranked ballot answers both rounds at once."
      - "Alabama, Arkansas, Louisiana and Mississippi use the same device even though they ban ranked choice voting for ordinary voters. Hawaii also sits at code 2, because its 2022 law applies ranked ballots to special federal and special county elections."
  - id: ranked-choice-voting-ballot-measures
    icon: "fa-solid fa-square-poll-vertical"
    title: "Ranked Choice Voting Ballot Measures"
    paragraphs:
      - "Voters have seldom approved ranked choice voting at the statewide level since 2020. In 2024 they rejected [ballot initiatives](/rankings/law/ballot-initiative-states) that included it in Arizona, Colorado, Idaho, Montana, Nevada and Oregon, and Idaho's no vote came close to 70 percent. Alaska went the other way by a hair, when a repeal attempt missed by fewer than 750 votes."
      - "The next test arrives November 3, 2026, when Alaskans vote on a measure that would repeal ranked choice voting and the top-four primary and bring back partisan primaries. Cities in states without a ban keep adopting it, among them San Francisco, Minneapolis, Boulder and Burlington. New York City used it in primaries starting in 2021."
