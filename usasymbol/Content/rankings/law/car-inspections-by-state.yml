faq:
  - question: "Which states have no car inspections?"
    answer: "20 states have no routine passenger vehicle inspections for either safety or emissions. That group includes Florida, Idaho, Kentucky, Michigan, South Carolina, Tennessee, Washington, and Wyoming."

  - question: "Which states require emissions testing?"
    answer: "28 states require emissions testing in some form. Massachusetts, New York, and New Jersey apply it statewide, while Arizona, Texas, Virginia, and Wisconsin limit it to specific counties or metro areas."

  - question: "What is the smog check requirement in California?"
    answer: "California lists Safety Inspection No and Emissions Test Yes. Smog Check certification is required in core program areas, on initial California registration, and in many change-of-ownership cases."

  - question: "Does Texas require vehicle inspection in 2026?"
    answer: "Texas no longer requires routine non-commercial safety inspections after January 1, 2025. Emissions testing still applies in 17 counties on June 25, 2026, and Bexar County is scheduled to join in November 2026."

  - question: "Does Pennsylvania require car inspection?"
    answer: "Pennsylvania requires Safety Inspection Yes statewide. Emissions Test is County specific, so drivers in metropolitan counties face both tests while other counties require only the safety inspection."

  - question: "Which states require both safety and emissions inspections?"
    answer: "Six states on this map require both statewide for passenger vehicles in some form. Delaware, Massachusetts, New Hampshire, New York, Rhode Island, and Vermont make up that group."

