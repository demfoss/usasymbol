faq:
  - question: "What state has the longest rent increase notice period?"
    answer: "Oregon and Washington require 90 days of written notice, the longest on record. Oregon applies the requirement after the first year of tenancy."

  - question: "How many days notice does a landlord need to raise rent in California?"
    answer: "California requires 30 days of written notice for an increase of 10 percent or less and 90 days for an increase above 10 percent."

  - question: "What is the shortest notice for a rent increase?"
    answer: "Seventeen states set no statutory notice period. Among states with one, Utah is the shortest at 15 days, and 21 states set 30 days, including Alaska, Arizona, and Idaho."

  - question: "How much notice is required for a rent increase in Maine?"
    answer: "Maine requires 45 days of written notice. The period rises to 75 days when increases over 12 months total 10 percent or more."

  - question: "How much notice does New York require for a rent increase?"
    answer: "New York requires 30 days for tenancies under one year, 60 days for one to two years, and 90 days beyond two years. The table shows the 30-day minimum."

  - question: "Which states require 60 days notice for a rent increase?"
    answer: "Colorado, Delaware, Georgia, Maryland, Nevada, Rhode Island, and Vermont require 60 days. Rhode Island raises the period to 120 days for month-to-month tenants over age 62."

