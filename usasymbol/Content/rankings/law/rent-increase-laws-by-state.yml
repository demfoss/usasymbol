page:
  h1: "Rent Increase Laws by State"

  quick_answer:
    - "Oregon and Washington have the longest rent increase notice period at 90 days, the written notice a landlord must give a month-to-month tenant before a rent increase takes effect."
    - "Colorado, Delaware, Georgia, Maryland, Nevada, Rhode Island, and Vermont require 60 days, and Hawaii and Maine require 45 days. Twenty-one states, including Alaska, Arizona, and Idaho, require 30 days."
    - "Seventeen states, including Texas, Ohio, and Florida, set no statutory period, and Utah's 15 days is the shortest fixed one. California and Maine lengthen notice for large increases, to 90 and 75 days."

  methodology: "Notice days are the written notice a landlord must give before raising rent on a month-to-month tenancy, taken from state statutes and landlord-tenant guides as of 2026. States without a specific statutory rent increase notice period are shown as 0 days."

  sources:
