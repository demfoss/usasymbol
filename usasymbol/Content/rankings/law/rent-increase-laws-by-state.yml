sections:
  - id: "states-with-the-longest-rent-increase-notice-periods"
    icon: "fa-solid fa-calendar-days"
    title: "States With the Longest Rent Increase Notice Periods"
    paragraphs:
      - "Oregon and Washington require 90 days of written notice before a rent increase, the longest period on record and three times the 30-day minimum. Both also cap yearly increases at 7 percent plus inflation, with a 10 percent maximum."
      - "Colorado, Delaware, Georgia, Maryland, Nevada, Rhode Island, and Vermont require 60 days. Maine requires 45 days, rising to 75 days when increases over 12 months total 10 percent or more, and California moves from 30 days to 90 days once an increase passes 10 percent."

  - id: "states-with-the-shortest-rent-increase-notice-periods"
    icon: "fa-solid fa-box-open"
    title: "States With the Shortest Rent Increase Notice Periods"
    paragraphs:
      - "Seventeen states, including Alabama, Florida, Texas, and Ohio, set no statutory notice period and are shown at 0 days. Utah has the shortest fixed period at 15 days, and that figure applies when the lease sets no notice period. Twenty-one states set 30 days, the most common period, including Alaska, Arizona, Arkansas, California, Idaho, Indiana, Iowa, Kansas, Massachusetts, Mississippi, Montana, Nebraska, New Hampshire, New Jersey, New Mexico, New York, North Dakota, South Dakota, and Virginia. Connecticut and Minnesota tie notice to the length of the rental period."
      - "New York starts at 30 days for tenancies under one year and reaches 90 days beyond two years. Hawaii and Maine sit at 45 days, halfway between the 30-day group and the 60-day group."

