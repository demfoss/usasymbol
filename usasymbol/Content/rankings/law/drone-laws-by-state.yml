sections:
  - id: "states-with-drone-preemption-laws"
    icon: "fa-solid fa-gavel"
    title: "States With Drone Preemption Laws"
    paragraphs:
      - "11 states bar cities and counties from writing their own drone ordinances: Arizona, Arkansas, Florida, Georgia, Indiana, Kentucky, Louisiana, Michigan, North Carolina, South Carolina, and Tennessee. In each, only the state and the FAA can regulate where and how drones fly."
      - "Several of these states pair preemption with critical-infrastructure rules. Georgia bars drones over prisons and water treatment plants, and Tennessee makes flying within 250 feet of critical infrastructure a felony under Tenn. Code § 39-13-903."

  - id: "states-where-cities-can-add-their-own-drone-rules"
    icon: "fa-solid fa-city"
    title: "States Without Drone Preemption Laws"
    paragraphs:
      - "33 states have no preemption law, so cities and counties can layer local ordinances on top of state and FAA rules. Denver and Boulder both enforce their own drone rules in Colorado, Chicago does the same under Illinois's Home Rule doctrine, and Baltimore, Seattle, Kansas City, and St. Louis all have local drone rules of their own."
      - "New York and New Jersey both sit under the JFK and NYC Special Flight Rules Areas, adding federal airspace restrictions on top of state and local rules. Massachusetts adds Boston Logan's Class B airspace, and Pennsylvania layers Philadelphia's Class B restrictions with Pittsburgh's separate local rules."

  - id: "states-with-no-drone-specific-law"
    icon: "fa-solid fa-circle-question"
    title: "States With No Drone-Specific Law"
    paragraphs:
      - "Alabama and Mississippi are the only states with no drone-specific statute at all. FAA rules still apply in both, and Alabama notes that some local ordinances may exist even without a state law on the books."

faq:
  - question: "Which states have drone preemption laws?"
    answer: "11 states have preemption laws that bar cities and counties from regulating drones beyond FAA rules: Arizona, Arkansas, Florida, Georgia, Indiana, Kentucky, Louisiana, Michigan, North Carolina, South Carolina, and Tennessee."

  - question: "Can cities pass their own drone laws?"
    answer: "Yes, in the 33 states without a preemption law. Denver, Boulder, Chicago, Baltimore, Seattle, Kansas City, and St. Louis all enforce local drone ordinances on top of state and FAA rules."

  - question: "Is there a state with no drone law at all?"
    answer: "Alabama and Mississippi have no drone-specific state law. FAA rules apply in both, and Alabama notes that local ordinances may still exist."

  - question: "What is Georgia's drone law?"
    answer: "Georgia has a strong preemption law under § 16-11-62 covering eavesdropping and surveillance, and it bars drones over critical infrastructure such as prisons and water treatment plants."

  - question: "Are drones banned in national parks?"
    answer: "Several national parks are flagged as no-fly zones in state guides, including Glacier and Yellowstone in Montana, Rocky Mountain in Colorado, Crater Lake in Oregon, Arches, Zion, and Bryce Canyon in Utah, Mount Rainier and Olympic in Washington, and Yellowstone and Grand Teton in Wyoming."

  - question: "Do FAA rules apply even where there is no state drone law?"
    answer: "Yes. FAA rules apply nationwide regardless of state law, including in Alabama and Mississippi, which have no drone-specific statute of their own."

