page:
  h1: "Drone Laws by State"

  quick_answer:
    - "11 states have preemption laws that bar cities and counties from regulating drones beyond FAA rules: Arizona, Arkansas, Florida, Georgia, Indiana, Kentucky, Louisiana, Michigan, North Carolina, South Carolina, and Tennessee."
    - "33 states have no state preemption law, leaving cities like Denver, Chicago, Seattle, and Baltimore free to add their own local drone ordinances on top of state and FAA rules."
    - "Alabama and Mississippi have no drone-specific state law at all, so FAA rules apply on their own in both states."

  methodology: "Legal status reflects state drone statutes and preemption rules as of 2026, drawn from The Drone U and Fly USI. This page is for informational purposes only and does not constitute legal advice."

