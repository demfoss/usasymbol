seo:
  title: "Child Support Age Limit by State | Map & Exceptions"
  description: "New York and Mississippi generally require child support until 21. Five states use 19, while school and disability rules can extend support."
page:
  h1: "Child Support Age Limit by State"
  quick_answer:
    - "Child support age limits in New York and Mississippi generally reach 21, the highest ordinary age among states. New York's support obligation continues into legal adulthood, while Mississippi ties the duty to its later age of majority."
    - "California generally uses 18, but an unmarried child still attending high school full time can receive support until graduation or 19, whichever comes first. Finishing school can therefore matter as much as the birthday."
    - "Massachusetts starts with 18 but allows support for dependent young adults living with a parent. Educational support can continue until 23, excluding expenses for education beyond an undergraduate degree."
  methodology: "NCSL's 2020 survey, state codes and agencies checked October 8, 2026. Ages cover ordinary support before school, dependency or disability extensions and early emancipation, excluding DC, territories and arrears."
