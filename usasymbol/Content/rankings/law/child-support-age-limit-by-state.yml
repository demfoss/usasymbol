faq:
  - question: "Does child support stop at 18 in Florida?"
    answer: "Florida ordinarily uses 18. Support can continue for a dependent high school student between 18 and 19 who is working toward a reasonably expected graduation before 19."
  - question: "Does child support automatically end at 19 in New Jersey?"
    answer: "New Jersey ordinarily terminates the obligation at 19, but qualifying education or disability can justify continuation. Parents receive advance termination notices and can submit a continuation request with supporting documents."
  - question: "Can child support continue after 21 in New York?"
    answer: "Yes. A separate adult dependent order can require support until 26 for a person with a qualifying developmental disability who lives with and principally depends on the person seeking support."
  - question: "What is the child support age limit in Minnesota?"
    answer: "Minnesota ordinarily uses 18, but its definition also includes a secondary school student under 20. A person incapable of self-support because of a physical or mental condition can remain eligible beyond those birthdays."
  - question: "Does Hawaii child support cover college students?"
    answer: "Hawaii's ordinary age is 18, but orders may continue for a full-time postsecondary student under 23. The custodial parent or adult child must regularly verify continued enrollment, and a break in full-time study can stop support."
  - question: "Does California wage withholding stop when a child turns 18?"
    answer: "California's ordinary age is 18, but a birthday alone does not cancel private-case wage withholding. The employer needs a terminated income withholding order signed and stamped by a judge before it can stop withholding."
