sections:
  - id: highest-child-support-age
    icon: "fa-solid fa-scale-balanced"
    title: "Why Child Support Can Last Until Adulthood"
    paragraphs:
      - "New York and Mississippi share the highest ordinary support age at 21 for different legal reasons. New York requires parents to support an unemancipated child through young adulthood. Mississippi keeps its general age of majority at 21, so leaving high school does not by itself mark the end of the ordinary parental duty."
      - "California and Texas share the lowest ordinary age of 18 because their general duty starts with supporting a minor child. Both preserve support while an eligible student finishes high school. California ends that school extension at graduation or 19, while Texas follows qualifying attendance through graduation rather than applying the same birthday cap."
    table:
      columns:
        state: "State"
        ordinary_age: "Ordinary Age"
      rows:
        - { state: "Mississippi", ordinary_age: 21 }
        - { state: "New York", ordinary_age: 21 }
        - { state: "Alabama", ordinary_age: 19 }
        - { state: "Colorado", ordinary_age: 19 }
        - { state: "Indiana", ordinary_age: 19 }
        - { state: "Nebraska", ordinary_age: 19 }
        - { state: "New Jersey", ordinary_age: 19 }
  - id: child-support-college
    icon: "fa-solid fa-graduation-cap"
    title: "Child Support During College"
    paragraphs:
      - "Massachusetts's ordinary starting point is 18, but a court can continue support for a young adult under 21 who lives with and principally depends on a parent. From 21 until 23, that dependency must arise from an educational program. A graduate degree does not qualify under the provision excluding education beyond an undergraduate degree."
      - "Missouri also begins at 18 and allows qualifying college or vocational support until 21. The student generally must enroll by the October after finishing secondary school, meet credit and grade conditions, and supply parents with transcripts. Those duties make ongoing educational progress part of the continued obligation."
  - id: ending-child-support-early
    icon: "fa-solid fa-file-signature"
    title: "Ending Child Support Before the Age Limit"
    paragraphs:
      - "Mississippi's age of 21 does not prevent earlier emancipation through marriage or full-time military service. An older teenager who leaves full-time education or becomes independently self-supporting may also be emancipated through a court petition. The [legal marriage age](/rankings/law/marriage-age-by-state) therefore affects more than the ability to marry."
      - "Indiana generally ends support at 19 but requires judicial action to end it earlier. A child marrying, entering active military duty or leaving parental care can support an emancipation finding. If one child leaves a shared support order, the payment for remaining children does not automatically shrink, so the parties must seek modification."
