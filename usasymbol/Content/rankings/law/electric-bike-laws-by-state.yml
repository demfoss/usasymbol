faq:
  - question: "Do you need a license to ride an e-bike?"
    answer: "In 48 states no. New Jersey requires an e-bike or driver's license plus registration. Hawaii charges a one-time $30 registration but asks for no license."

  - question: "What is the Class 3 e-bike age in California?"
    answer: "California requires Class 3 riders to be at least 16, and every Class 3 rider and passenger must wear a helmet. On Class 1 and 2 bikes the helmet rule covers riders under 18."

  - question: "Do you have to wear a helmet on an e-bike in Texas?"
    answer: "No. Texas has no statewide e-bike helmet rule. Class 3 riders must be at least 15."

  - question: "How many states use the three-class e-bike system?"
    answer: "Forty-two. Alaska, Kentucky, Massachusetts, Montana, New Jersey, North Carolina, Pennsylvania, and South Carolina do not, though North Carolina adds three classes on December 1, 2026."

  - question: "What are the e-bike laws in New York?"
    answer: "Riders must be 16 on every e-bike, and Class 3 is legal only in New York City. A helmet is required at any age on Class 3 and under 14 on other classes."

  - question: "Which state has the lowest e-bike age?"
    answer: "Louisiana, at 12 for Class 3. Michigan and Virginia follow at 14."

