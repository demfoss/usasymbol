sections:
  - id: "states-with-three-class-e-bike-system"
    title: "States With the Three-Class E-Bike System"
    paragraphs:
      - "Forty-two states sort e-bikes into Class 1, Class 2, and Class 3. Classes 1 and 2 cut motor help at 20 mph, and Class 3 cuts it at 28 mph. California wrote the system into law first, in 2015, and other states copied its wording."
      - "Alaska and Kentucky have no e-bike statute. Montana, Pennsylvania, and South Carolina use a single 20 mph definition, and North Carolina does too until three classes take effect there on December 1, 2026. Massachusetts recognizes only Classes 1 and 2, so a faster machine is treated as a moped."
      - "New Jersey went furthest. It replaced classes with three licensing categories, and riders need a license and registration. Throttle bikes and those between 21 and 28 mph also need insurance."

  - id: "e-bike-helmet-laws-by-state"
    title: "E-Bike Helmet Laws by State"
    paragraphs:
      - "Twenty states have no statewide e-bike helmet rule, including Texas, Washington, Wisconsin, and Arizona. Connecticut sits at the other extreme and requires a helmet on every rider of every class."
      - "Nine states, from California and New York to Georgia and Tennessee, require a Class 3 helmet at any age. Rhode Island and Utah cover everyone under 21, the oldest cutoff for e-bikes. Rules for pedal bikes still apply where e-bike law is silent, so check [bicycle helmet laws by state](/rankings/law/bicycle-helmet-laws-by-state) as well."

  - id: "minimum-age-to-ride-an-e-bike-by-state"
    title: "Minimum Age to Ride an E-Bike by State"
    paragraphs:
      - "Louisiana lets riders as young as 12 use a Class 3 e-bike. Michigan and Virginia set 14, and Georgia, Indiana, Minnesota, New Jersey, and Texas set 15. Virginia adds that riders under 16 on Class 3 need an adult."
      - "Fifteen states, including Florida, Montana, and Idaho, set no age in e-bike law. New York, Pennsylvania, Rhode Island, and Minnesota apply one age to every e-bike. Compare that with the [minimum driving age by state](/rankings/law/minimum-driving-age-by-state) for cars."
