seo:
  title: "E-Bike Laws by State | Map, Ages & Helmet Rules"
  description: "Forty-two states use the three-class e-bike system. Class 3 riders must be 16 in 27 states, and only New Jersey and Hawaii require registration."

page:
  h1: "E-Bike Laws by State"

  quick_answer:
    - "E-bike laws by state most often set the minimum age at 16, the Class 3 rule in 27 states. Most states copied a model bill that treats the 28 mph Class 3 as the one machine needing an age floor."
    - "Louisiana sets the lowest Class 3 minimum age at 12 and still requires a helmet on every Class 3 rider. Michigan and Virginia come next at 14."
    - "New Jersey has the strictest rules. E-bikes there fall into three licensing categories, riders need a license and registration, and throttle bikes need insurance. Hawaii is the only other state that charges registration."

  methodology: "Statewide e-bike statutes as summarized in secondary guides and checked against the NCSL e-bike primer, as of October 2026. Age is the Class 3 minimum, or the minimum for any e-bike where one age covers all. States whose e-bike law sets no age have no value."

  sources:
    - name: "NCSL, State Electric Bicycle Laws, A Legislative Primer"
      url: "https://www.ncsl.org/transportation/state-electric-bicycle-laws-a-legislative-primer"
      description: "Three-class classification, helmet, age, and licensing provisions in state law"
    - name: "PeopleForBikes, Model Electric Bicycle Laws"
