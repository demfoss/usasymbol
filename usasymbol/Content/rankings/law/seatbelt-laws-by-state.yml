faq:
  - question: "Which states have primary seatbelt enforcement?"
    answer: "34 states use primary enforcement, including California, Texas, New York, and Florida. Police in these states can stop and ticket a driver for an unbuckled seatbelt with no other violation needed."

  - question: "Which states have secondary seatbelt enforcement?"
    answer: "15 states use secondary enforcement: Arizona, Colorado, Idaho, Massachusetts, Missouri, Montana, Nebraska, Nevada, North Dakota, Ohio, Pennsylvania, South Dakota, Vermont, Virginia, and Wyoming."

  - question: "Does New Hampshire have a seatbelt law?"
    answer: "Not for adults. New Hampshire is the only state on this list with no seatbelt requirement for drivers and passengers 18 and older. A separate primary law still requires anyone under 18 to buckle up in any seat."

  - question: "What is the seatbelt law in Texas?"
    answer: "Texas uses primary enforcement covering all seating positions, and the first-offense fine is $200, the highest on this list."

  - question: "Which states have the highest seatbelt fine?"
    answer: "Texas has the highest first-offense fine at $200. Washington follows at $124, and Oregon is next at $115."

  - question: "Do all states require seatbelts in the back seat?"
    answer: "No. Coverage is listed as Front seat only in states such as Arkansas, Iowa, Michigan, Oklahoma, Tennessee, Colorado, Nebraska, and South Dakota. Other states list Mixed by age, where adults are covered only in front but minors must buckle up anywhere in the vehicle."

