sections:
  - id: "states-with-primary-seatbelt-enforcement"
    icon: "fa-solid fa-shield-halved"
    title: "States With Primary Seatbelt Enforcement"
    paragraphs:
      - "34 states use primary enforcement, the largest group on this list: Alabama, Alaska, Arkansas, California, Connecticut, Delaware, Florida, Georgia, Hawaii, Illinois, Indiana, Iowa, Kansas, Kentucky, Louisiana, Maine, Maryland, Michigan, Minnesota, Mississippi, New Jersey, New Mexico, New York, North Carolina, Oklahoma, Oregon, Rhode Island, South Carolina, Tennessee, Texas, Utah, Washington, West Virginia, and Wisconsin."
      - "Texas sets the highest first-offense fine among these states at $200. North Carolina follows at $179, and Wisconsin sets the lowest at $10 despite also requiring primary enforcement across all seats."

  - id: "states-with-secondary-seatbelt-enforcement"
    icon: "fa-solid fa-car-side"
    title: "States With Secondary Seatbelt Enforcement"
    paragraphs:
      - "15 states use secondary enforcement: Arizona, Colorado, Idaho, Massachusetts, Missouri, Montana, Nebraska, Nevada, North Dakota, Ohio, Pennsylvania, South Dakota, Vermont, Virginia, and Wyoming. An officer can only issue a seatbelt citation in these states after stopping the vehicle for another violation."
      - "Colorado sets the highest first-offense fine in this group at $71. Arizona, Idaho, Missouri, and Pennsylvania are the lowest at $10 each."

  - id: "new-hampshires-seatbelt-law-for-adults"
    icon: "fa-solid fa-circle-question"
    title: "New Hampshire's Seatbelt Law for Adults"
    paragraphs:
      - "New Hampshire is the only state on this list with no seatbelt law covering adults 18 and older, in either front or back seats. Drivers and passengers under 18 are still covered by a separate primary law requiring a seatbelt in any seat."

