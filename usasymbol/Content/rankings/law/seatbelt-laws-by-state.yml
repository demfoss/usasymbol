page:
  h1: "Seatbelt Laws by State"

  quick_answer:
    - "34 states use primary enforcement for seatbelt laws, the largest group on this list. Police in those states can stop and ticket a driver for an unbuckled seatbelt alone, with no other traffic violation needed."
    - "15 states use secondary enforcement, where an officer can only cite a seatbelt violation after stopping the vehicle for another reason, such as speeding."
    - "New Hampshire is the only state on this list with no seatbelt law for adults 18 and older. Drivers and passengers under 18 there still must buckle up under a separate primary law."

  methodology: "Enforcement type, seating coverage, and first-offense fine reflect state law on record for 2026, per World Population Review and the Governors Highway Safety Association. Informational only; not legal advice."

  sources:
    - name: "World Population Review — Seat Belt Laws by State"
