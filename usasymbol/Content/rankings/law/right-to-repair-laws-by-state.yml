  description: New York enacted its electronics repair law in 2022. Nine states have broad consumer electronics laws, including Kansas with coverage from 2027.
page:
  h1: Right-to-Repair Laws by State
  quick_answer:
    - "Right-to-repair laws by state began for broad consumer electronics coverage with New York in 2022. Its law opens repair materials supplied to authorized shops to independent repairers and device owners."
    - "Kansas enacted its law in 2026, the latest year. Coverage applies to equipment first offered for sale in Kansas from 2027, giving manufacturers time to prepare for the new requirements."
    - "Oregon's 2024 law tackles parts pairing. A manufacturer cannot use software checks to disable a functional replacement part in a qualifying device merely because an independent repairer installed it."
  methodology: "State laws checked October 8, 2026. All 9 broad consumer electronics repair enactments are ordered by year, including Kansas's future coverage and excluding automotive-only, farm-only, wheelchair-only laws and pending bills."
