sections:
  - id: right-to-repair-law-history
    icon: fa-solid fa-landmark
    title: Right-to-Repair Law History
    paragraphs:
      - "New York leads with its 2022 law because lawmakers required electronics manufacturers to share repair materials beyond their authorized networks. An independent shop needs the same practical inputs as a branded service center, including diagnostic instructions, parts, and specialized tools. The law opens access where a manufacturer supplies those materials to its authorized repairers."
      - "Kansas appears last with its 2026 enactment. Lawmakers set a future first-sale cutoff in 2027 and added specific exclusions for products such as major home appliances, game consoles, and critical infrastructure equipment. A signed law therefore precedes the arrival of the products that qualify under its new coverage."
  - id: right-to-repair-parts-pairing
    icon: fa-solid fa-microchip
    title: Right-to-Repair Parts Pairing Rules
    paragraphs:
      - "Oregon's 2024 law reaches software restrictions as well as access to physical parts. Parts pairing identifies a component through a software identifier, which can cause a working replacement to lose functions or display misleading warnings. Oregon prohibits those uses for qualifying newer devices while preserving specific security and battery safety exceptions."
      - "Washington's 2025 law also restricts pairing that blocks a functional replacement in qualifying products. Owners and independent shops can obtain the materials necessary to restore a device rather than discard it."
  - id: right-to-repair-product-coverage
    icon: fa-solid fa-screwdriver-wrench
    title: Right-to-Repair Product Coverage
    paragraphs:
      - "Connecticut's 2025 law covers qualifying electronic and appliance products, while Texas's law from the same year excludes major appliances with embedded electronics. A refrigerator and a smartphone can therefore fall on opposite sides of a repair law even though both contain digital components. Connecticut also limits coverage to qualifying newly introduced products from 2026."
      - "Colorado's 2024 law extends a framework that previously covered wheelchairs and agricultural equipment to general digital electronics. Those earlier sector-specific protections have their own exceptions and obligations. The extension gives independent shops access to materials needed for products beyond a tractor or powered wheelchair."
