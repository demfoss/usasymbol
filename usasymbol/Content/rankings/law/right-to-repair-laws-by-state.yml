faq:
  - question: Which states have consumer electronics right-to-repair laws?
    answer: "New York, California, Minnesota, Colorado, Oregon, Connecticut, Texas, Washington, and Kansas have enacted broad consumer electronics laws. Kansas's coverage starts with qualifying products first made available for sale from 2027."
  - question: Does New York's right-to-repair law cover old phones?
    answer: "New York's law applies to qualifying equipment first manufactured and first sold or used in the state on or after July 1, 2023. A phone model introduced before that cutoff does not become eligible simply because someone buys a used example later."
  - question: Are game consoles covered by California's right-to-repair law?
    answer: "No. California specifically excludes video game consoles from this law. Electronic and appliance products satisfying the other statutory conditions can qualify."
  - question: Can manufacturers block replacement parts in Oregon?
    answer: "Oregon prohibits specified parts pairing practices for qualifying newer devices, including disabling otherwise functional replacement components. The law preserves exceptions for owner-controlled security measures and battery safety during a thermal event."
  - question: Does Connecticut's right-to-repair law cover appliances?
    answer: "Yes, qualifying major home appliances can fall within its electronic or appliance product definition. Coverage requires the product to be first manufactured and first sold or used in Connecticut on or after July 1, 2026, along with the other statutory conditions."
  - question: Can Texas manufacturers replace a device instead of supplying repair materials?
    answer: "Yes. Texas gives qualifying original purchasers statutory alternatives involving reimbursement or an equivalent replacement. The replacement route must satisfy the law's price conditions and remain at the consumer's discretion."
