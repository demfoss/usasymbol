faq:
  - question: "What is the small claims court limit in Texas?"
    answer: "Texas allows $20,000 in Justice Court. Attorney fees count toward that amount, while statutory interest and court costs do not."
  - question: "What is the small claims court limit in New York?"
    answer: "New York City's ceiling is $10,000. Other city and district courts generally allow $5,000, while town and village courts allow $3,000, so the proper local court changes the amount available."
  - question: "What is the small claims court limit in North Carolina?"
    answer: "North Carolina allows up to $10,000, but the county's local rule may set a lower limit down to $5,000. Magistrates decide these cases within the District Court division."
  - question: "What is the small claims court limit in Florida?"
    answer: "Florida's limit is $8,000 in county court. Interest, court costs and attorney fees are excluded from that ceiling."
  - question: "What is the small claims court limit in Idaho?"
    answer: "Idaho permits $15,000 in the small claims department of its Magistrate Division. The procedure excludes punitive damages and damages for pain and suffering."
  - question: "What is the small claims court limit in Vermont?"
    answer: "Vermont allows an ordinary money claim of $10,000. Consumer-credit and medical-debt claims have a lower $5,000 ceiling, and a plaintiff cannot split a single claim into multiple cases to avoid the limit."
