seo:
  title: "Small Claims Court Limits by State | Map & Amounts"
  description: "Delaware and Tennessee allow ordinary small claims up to $25,000. Kentucky's limit is $2,500, with a separate docket for larger civil cases."
page:
  h1: "Small Claims Court Limits by State"
  quick_answer:
    - "Small claims court limits reach $25,000 in Delaware and Tennessee. Both handle these disputes in broader local civil courts, the Justice of the Peace Court in Delaware and General Sessions Court in Tennessee."
    - "Kentucky has the lowest ordinary limit at $2,500. Its Small Claims Division offers informal hearings without a jury, while larger civil cases use another docket."
    - "California allows individuals to sue for $12,500, but most business entities have a lower ceiling. Lawyers cannot appear for either side at the ordinary small claims hearing."
  methodology: "State courts and statutes checked October 7, 2026 cover ordinary individual money claims in small claims or equivalent local courts in all 50 states. Local maxima are used where limits vary, excluding special claims."
