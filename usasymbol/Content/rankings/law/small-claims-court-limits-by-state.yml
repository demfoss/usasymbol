        - { state: "Texas", amount: "$20,000" }
        - { state: "Utah", amount: "$20,000" }
        - { state: "West Virginia", amount: "$20,000" }
        - { state: "Georgia", amount: "$15,000" }
        - { state: "Idaho", amount: "$15,000" }
        - { state: "North Dakota", amount: "$15,000" }
        - { state: "California", amount: "$12,500" }
  - id: california-small-claims-court-limit
    icon: "fa-solid fa-user"
    title: "California Small Claims Court Limit"
    paragraphs:
      - "California's $12,500 ceiling applies to an individual bringing an ordinary claim. Most corporations and other business entities have a $6,250 ceiling, and the hearing requires parties to speak for themselves rather than have lawyers present the case. California also restricts how often a plaintiff can bring claims above $2,500 during a calendar year."
      - "Washington also distinguishes a person from a business at its $10,000 ceiling. A natural person can use the full amount, while a company or other nonindividual plaintiff is limited to $5,000. An individual's claim against a business still uses the individual's allowance."
  - id: security-deposit-small-claims-limits
    icon: "fa-solid fa-house"
    title: "Security Deposit Small Claims Limits"
    paragraphs:
      - "Hawaii's ordinary $5,000 ceiling does not cap a tenant's claim to recover a residential security deposit. A tenant can therefore bring that particular dispute in the small claims division even when the deposit exceeds the usual allowance. [Security deposit laws](/rankings/law/security-deposit-laws-by-state) determine the underlying right to recover the money."
      - "Connecticut also starts with $5,000 for ordinary claims, but a deposit award can include statutory double damages beyond that general amount. The date a landlord had to return the money is a separate part of the dispute, covered by [security deposit return deadlines](/rankings/law/security-deposit-return-deadlines-by-state)."
