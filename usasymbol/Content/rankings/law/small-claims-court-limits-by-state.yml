sections:
  - id: highest-small-claims-court-limits
    icon: "fa-solid fa-scale-balanced"
    title: "Highest Small Claims Court Limits"
    paragraphs:
      - "Delaware and Tennessee reach $25,000 because their local civil courts handle a wider range of ordinary money disputes under one jurisdictional ceiling. Delaware uses Justice of the Peace Court, while Tennessee uses General Sessions Court, so neither separates these disputes into a lower-dollar court called Small Claims Court."
      - "Kentucky keeps its $2,500 procedure inside a dedicated Small Claims Division. The informal hearing lets the parties present their dispute directly to a judge, while a claim above the ceiling must use the regular civil process or give up the excess."
    table:
      columns:
        state: "State"
        amount: "Individual Claim Limit"
      rows:
        - { state: "Delaware", amount: "$25,000" }
        - { state: "Tennessee", amount: "$25,000" }
