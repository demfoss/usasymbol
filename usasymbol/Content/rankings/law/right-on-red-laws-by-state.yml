sections:
  - id: "why-right-on-red-is-legal-in-every-state"
    icon: "fa-solid fa-gas-pump"
    title: "Why Right on Red Is Legal in Every State"
    paragraphs:
      - "Right on red spread nationwide because of an energy crisis. After the 1973 oil embargo, Congress passed the Energy Policy and Conservation Act of 1975, and states had to allow right turns on red to receive federal money for their fuel-saving programs. Fewer cars idling at red lights meant less gasoline burned."
      - "Some western states, California among them, had allowed the turn long before the federal push. Massachusetts held out longest and gave in on January 1, 1980, but many of its intersections were quickly fitted with No Turn on Red signs."

  - id: "right-on-red-in-new-york-city"
    icon: "fa-solid fa-city"
    title: "Right on Red in New York City"
    paragraphs:
      - "New York is the only state on the map where a whole city is off limits. State law bans turns on red in any city with one million or more people, and New York City is the only city in the state that big. A right turn on red there is legal only where a sign allows it."
      - "Crowded crosswalks are the reason. A driver watching for a gap in traffic to the left can easily miss a pedestrian stepping off the curb on the right, and Manhattan sidewalks rarely empty out."

  - id: "states-where-left-on-red-is-not-allowed"
    icon: "fa-solid fa-ban"
    title: "States Where Left on Red Is Not Allowed"
    paragraphs:
      - "Connecticut, Maine, Missouri, New Hampshire, New Jersey, North Carolina, Rhode Island, and South Dakota do not allow a left turn on red, even from one one-way street onto another. In these states the only legal turn on red is a right turn."
      - "Alaska, Idaho, Michigan, Oregon, and Washington sit at the other end. A driver there may turn left on red from a two-way street onto a one-way street, which most often means turning onto a one-way highway on-ramp. Like other [driving laws by state](/rankings/law/texting-while-driving-laws-by-state), the rule changes the moment you cross a border."

