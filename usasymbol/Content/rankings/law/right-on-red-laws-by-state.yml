  description: "Right on red after a full stop is legal in every state unless a sign forbids it. New York City is the big exception. Left on red rules vary more."

page:
  h1: "Right on Red Laws by State"

  quick_answer:
    - "Right on red is legal in all 50 states after a full stop, unless a sign says No Turn on Red. New York City is the one place where it is banned citywide."
    - "Left on red is the turn that changes at the state line. Eight states, including New Jersey and North Carolina, never allow it, while most others allow it only from a one-way street onto another one-way street."
    - "Alaska, Idaho, Michigan, Oregon, and Washington go further and allow a left on red from a two-way street onto a one-way street."

  methodology: "Turn-on-red rules reflect each state's vehicle code on record for 2026. Local signs override the general rule everywhere. Informational only, not legal advice."

  sources:
