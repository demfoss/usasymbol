      url: "https://www.congress.gov/bill/94th-congress/senate-bill/622"
      description: "Federal law that tied state energy-conservation funding to allowing right turns on red"
    - name: "New York Vehicle and Traffic Law § 1111"
      url: "https://www.nysenate.gov/legislation/laws/VAT/1111"
      description: "New York rule on turns at red signals, including the ban in cities of one million or more people"
