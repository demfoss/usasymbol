faq:
  - question: "Is right on red legal in all 50 states?"
    answer: "Yes. Every state allows a right turn on red after a full stop unless a sign forbids it. Massachusetts was the last state to adopt the rule, in 1980."

  - question: "Can you turn right on red in New York City?"
    answer: "No, not unless a sign allows it. New York law bans turns on red in cities with one million or more people, and New York City is the only one."

  - question: "Which states allow left on red from a two-way street?"
    answer: "Alaska, Idaho, Michigan, Oregon, and Washington. Drivers may turn left on red from a two-way street onto a one-way street after a full stop."

  - question: "Is left on red legal in New Jersey?"
    answer: "No. New Jersey is one of eight states where a left turn on red is never allowed, even between one-way streets."

  - question: "Is left on red legal in Texas?"
    answer: "Yes, but only from a one-way street onto another one-way street, after a full stop. Texas drivers face other records too, since the state's [maximum speed limit](/rankings/law/maximum-speed-limits) of 85 mph on one toll road is the highest in the country."

  - question: "Do you have to stop before turning right on red?"
    answer: "Yes. Every state requires a complete stop and a yield to pedestrians and cross traffic. A rolling right on red is treated the same as running the red light."

