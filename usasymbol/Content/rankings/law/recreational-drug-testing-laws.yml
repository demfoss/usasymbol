sections:
  - id: "states-that-ban-weed-testing-for-some-workers"
    icon: "fa-solid fa-cannabis"
    title: "States That Ban Weed Testing for Some Workers"
    paragraphs:
      - "California, Connecticut, Minnesota, Montana, Nevada, New Jersey, New York, Rhode Island, and Washington are in the yes group. New York and California are the two biggest names there."
      - "Nevada and Washington are narrower than New York. Nevada focuses heavily on pre-employment testing, while Washington's law centers on job applicants."

  - id: "states-with-medical-only-weed-protections"
    icon: "fa-solid fa-id-card"
    title: "States With Medical Only Weed Protections"
    paragraphs:
      - "Eighteen states are medical only. Arizona, Arkansas, Delaware, Illinois, Louisiana, Maine, Maryland, Massachusetts, Missouri, New Hampshire, New Mexico, Oklahoma, Pennsylvania, South Dakota, Utah, Vermont, Virginia, and West Virginia make up that group."
      - "Pennsylvania is medical only even though neighboring New York is yes. Vermont and Virginia are medical only too."

  - id: "states-where-employers-can-still-test-for-weed"
    icon: "fa-solid fa-vial-circle-check"
    title: "States Where Employers Can Still Test for Weed"
    paragraphs:
      - "Twenty-three states fall in the no-protection group. Texas, Florida, Georgia, Michigan, Ohio, and Wisconsin are all there."
      - "Colorado and Oregon are in that same no group. Recreational legality in a state does not put it in the yes group by itself."

visual_assets:
  - id: ban-weed-testing
    src: /images/rankings/law/recreational-drug-testing-laws/ban-weed-testing.jpg
    alt: Hiring interview paperwork and office desk setup
    caption: The strongest protection states are focused on employment decisions rather than criminal law. California, New York, New Jersey, Minnesota, and a handful of others now limit how much employers can rely on cannabis testing for applicants or workers.
