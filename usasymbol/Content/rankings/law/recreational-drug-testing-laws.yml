seo:
  title: "Weed Drug Testing Laws | Map, States & Facts"
  description: "Nine states protect off-duty adult-use cannabis in some form, 18 are medical only, and 23 offer no statewide protection."

page:
  h1: "Weed Drug Testing Laws"

  quick_answer:
    - "Weed drug testing laws protect off-duty adult-use cannabis in nine states. California, Connecticut, Minnesota, Montana, Nevada, New Jersey, New York, Rhode Island, and Washington are in that group."
    - "Medical-only protections reach 18 states. Arizona, Pennsylvania, Utah, Virginia, and West Virginia are in that middle group."
    - "Texas, Florida, Georgia, Ohio, and Michigan are in the no-protection group. New York protects off-duty adult use, while Pennsylvania protects only medical patients."

  methodology: "Categories use the 2025 NCSL summary on cannabis and employment plus MPP's 2026 employment-protections summary, checked on June 22, 2026. Yes means the state has some adult-use employment protection for off-duty cannabis use or cannabis testing, Medical Only means protections are limited to medical patients or cardholders."

  sources:
    - name: "National Conference of State Legislatures. Cannabis and Employment. Medical and Recreational Policies in the States"
      url: "https://www.ncsl.org/health/cannabis-and-employment-medical-and-recreational-policies-in-the-states"
      description: "State-by-state summary of medical and recreational cannabis employment protections"
    - name: "Marijuana Policy Project. Cannabis Legalization and Employment Protections"
      url: "https://www.mpp.org/issues/legalization/cannabis-legalization-and-employment-protections/"
      description: "Adult-use employment protections, drug-testing limits, and major state exceptions"

