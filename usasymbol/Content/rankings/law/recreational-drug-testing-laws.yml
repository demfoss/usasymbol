    caption: "Medical-only states draw a narrower line, where protections attach to registered patients rather than to adult-use consumers generally. Pennsylvania, Utah, West Virginia, and Arizona all fit that middle category."
    section: states-with-medical-only-weed-protections
    layout: full-width-tall

  - id: employers-can-still-test
    src: /images/rankings/law/recreational-drug-testing-laws/employers-can-still-test.jpg
    alt: Laboratory-style drug testing sample in a workplace context
    caption: In the no-protection states, employers generally keep broad discretion to test for cannabis and act on the results. That remains true even in some states where recreational marijuana itself is legal under criminal law.
    section: states-where-employers-can-still-test-for-weed
    layout: full-width-tall

faq:
  - question: "Can my employer drug test for weed in New York?"
    answer: "New York is in the yes group. State law protects legal off-duty cannabis use outside work hours and off the employer's premises."

  - question: "Can my employer drug test for weed in California?"
    answer: "California is in the yes group. Most employers may not penalize workers for off-duty cannabis use or for nonpsychoactive metabolite test results."

  - question: "Can my employer drug test for weed in Texas?"
    answer: "Texas is in the no-protection group. Texas does not have a statewide law protecting off-duty cannabis use."

  - question: "Can my employer drug test for weed in Pennsylvania?"
    answer: "Pennsylvania is medical only. State protections apply to medical cannabis patients, not to adult-use workers generally."

  - question: "Which states ban pre-employment weed testing?"
    answer: "Nevada and Washington are the clearest statewide examples in this table. Minnesota and New Jersey also limit cannabis testing or adverse action for many applicants."

  - question: "Which states protect off-duty weed use?"
    answer: "California, Connecticut, Minnesota, Montana, Nevada, New Jersey, New York, Rhode Island, and Washington are in the yes group. Those nine states have some adult-use employment protection tied to cannabis use or cannabis testing."

