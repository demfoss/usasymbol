page:
  h1: Menthol Cigarette Bans
  quick_answer:
    - "Menthol cigarette bans began at the state level with Massachusetts's 2019 law. Ordinary retail sales ended June 1, 2020, although licensed smoking bars retain a narrow exception for on-site consumption."
    - "California enacted its flavored-tobacco sales ban in 2020. A referendum delayed implementation until December 21, 2022, after voters upheld the law. Menthol cigarettes fall within the restriction."
    - "Massachusetts and California regulate sales rather than making individual smokers criminals for possessing menthol cigarettes. California also prohibits retailers from stocking these products with the intent to sell them."
  methodology: "State laws and health-agency guidance checked October 8, 2026. Rank and map use enactment year for these two statewide menthol-cigarette sales laws, excluding local ordinances, DC, proposals, and vaping-only bans."
