sections:
  - id: first-state-menthol-cigarette-ban
    icon: fa-solid fa-calendar
    title: First State Menthol Cigarette Ban
    paragraphs:
      - "Massachusetts ranks earliest because its 2019 tobacco-control law addressed menthol cigarettes together with other flavored tobacco products. The law gave combustible products a later implementation date than flavored vaping products, so a shop could not treat a menthol cigarette as an exception to the flavored-tobacco restriction."
      - "California ranks later because its 2020 legislation went through a voter referendum before enforcement began. Voters upheld the ban in November 2022, clearing the way for the December 21 sales cutoff. The gap between passage and enforcement explains why both 2020 and 2022 appear in accounts of California's menthol ban."
  - id: california-menthol-cigarette-ban
    icon: fa-solid fa-store
    title: California Menthol Cigarette Ban
    paragraphs:
      - "California's law reaches menthol cigarettes sold in stores and through online retail transactions. A product does not escape the restriction merely because its seller calls it unflavored. Current enforcement rules also address cooling sensations and flavor enhancers, including products designed to add flavor to otherwise unflavored tobacco."
  - id: massachusetts-menthol-cigarette-exception
    icon: fa-solid fa-smoking
    title: Massachusetts Menthol Cigarette Exception
    paragraphs:
      - "Massachusetts allows a narrow exception in licensed smoking bars, where flavored tobacco must be consumed on the premises. An ordinary convenience store or smoke shop cannot use that exception to sell a pack for take-home use. California's menthol-cigarette restriction does not create the same smoking-bar exemption for cigarettes."
