faq:
  - question: Are menthol cigarettes banned in California?
    answer: "California prohibits retail sales of menthol cigarettes under its flavored-tobacco law. The restriction covers selling, offering for sale, and possession by retailers with the intent to sell."
  - question: Is it illegal to possess menthol cigarettes in California?
    answer: "California's flavored-tobacco sales law does not make a person's possession or use of menthol cigarettes illegal. Possession with intent to sell at retail is covered by the restriction."
  - question: Can you buy menthol cigarettes online in California?
    answer: "California's current flavored-tobacco guidance covers online retail sales as well as purchases inside a store. Ordering from a website does not create an exemption for a California retail transaction."
  - question: Can smoke shops sell menthol cigarettes in Massachusetts?
    answer: "Ordinary Massachusetts smoke shops cannot sell menthol cigarettes for take-home use. The exception applies to licensed smoking bars and requires consumption on the premises."
  - question: Does California's hookah exception allow menthol cigarettes?
    answer: "No. California's limited exception for qualifying shisha tobacco does not exempt menthol cigarettes. The permitted tobacco product matters, rather than the shop's description of itself."
