sections:
  - id: states-that-vote-entirely-by-mail
    icon: "fa-solid fa-envelope-open-text"
    title: "States That Vote Entirely by Mail"
    paragraphs:
      - "Oregon began the movement. Its voters approved mail elections in 1998, and Washington followed by moving every county to mail ballots by 2011. Colorado adopted the model in 2013, and the other five states in the top group joined between 2019 and 2022."
      - "The 2020 pandemic pushed California, Nevada and Vermont from temporary mailings to permanent law. A voter in any of these states can still vote in person at a vote center or election office, so a mailed ballot adds an option rather than removing one."
  - id: no-excuse-mail-voting-states
    icon: "fa-solid fa-envelope"
    title: "No-Excuse Mail Voting States"
    paragraphs:
      - "Twenty-nine states send a mail ballot to any voter who asks, and several made the change only recently. Pennsylvania did so with a 2019 law, Virginia and Massachusetts in 2022, New York in 2023 and Connecticut in May 2026."
      - "Arizona shows how close the two groups can get. Its permanent early voting list sends a ballot automatically to every voter who signs up once, yet the state sits in the request group because it does not mail ballots to everyone."
  - id: states-that-require-an-excuse-to-vote-by-mail
    icon: "fa-solid fa-clipboard-list"
    title: "States That Require an Excuse to Vote by Mail"
    paragraphs:
      - "Thirteen states, including Texas, Alabama and West Virginia, require a reason for a mail ballot. Age is the simplest reason in six of them, set at 65 in Indiana, Louisiana, Mississippi, South Carolina and Texas and at 60 in Tennessee."
      - "Delaware tried to change that. A 2022 law created broader mail voting, but the state supreme court ruled it conflicted with the constitution. Kentucky and Missouri offer another route through in-person voting without an excuse, as described in [early voting by state](/rankings/law/early-voting-by-state)."
    table:
      columns:
        state: "State"
        age: "Age That Qualifies"
      rows:
