faq:
  - question: "Do you need an excuse to vote by mail in Texas?"
    answer: "Yes. A Texas voter must be 65 or older, disabled, out of the county during the voting period, or in jail but eligible. Texas is one of thirteen states that keep the excuse rule."
  - question: "Can anyone vote by mail in Pennsylvania?"
    answer: "Yes. Pennsylvania has allowed any voter to request a mail ballot since a 2019 law, with no reason required."
  - question: "Is mail-in voting allowed in Connecticut?"
    answer: "Yes. A law signed May 19, 2026 lets every eligible voter use an absentee ballot, and applications go to the town clerk or through the state's online portal. Connecticut voters approved the underlying constitutional change in November 2024."
  - question: "Which state started voting by mail first?"
    answer: "Oregon, where voters approved all-mail elections in 1998. Its experience was the model that Washington, Colorado and later states copied."
  - question: "Do you need an excuse to vote absentee in Missouri?"
    answer: "A Missouri voter needs a reason to receive a ballot by mail. Any voter can cast an in-person absentee ballot at a local election office starting 14 days before the election, with photo ID."
  - question: "Can you still vote in person in states that mail every voter a ballot?"
    answer: "Yes. Colorado and Washington open in-person vote centers, and Hawaii runs voter service centers. In Colorado the centers open 15 days before the election, and in Washington they open 18 days before."
