  description: "Eight states mail a ballot to every voter and another 29 let any voter request one. Thirteen states still require an excuse to vote by mail."
page:
  h1: "Mail-In Voting by State"
  quick_answer:
    - "Mail-in voting is automatic in eight states, California, Colorado, Hawaii, Nevada, Oregon, Utah, Vermont and Washington, where every registered voter is mailed a ballot. Oregon voters approved the model in 1998."
    - "Thirteen states, from Alabama to West Virginia, still require an excuse to vote by mail. Texas, Indiana, Louisiana, Mississippi and South Carolina accept age 65 as a reason, and Tennessee sets the age at 60."
    - "Connecticut joined the no-excuse group in May 2026, when a law carrying out a 2024 constitutional amendment took effect. Delaware remains an excuse state because its supreme court struck down a mail voting law in 2022."
  methodology: "Status code defined for this ranking, 3 for all-mail elections, 2 for mail ballots on request with no excuse and 1 for excuse required. Checked October 2026 against Movement Advancement Project and Ballotpedia counts and the Connecticut governor's office. All 50 states are included."
