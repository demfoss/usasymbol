sections:
  - id: "pay-transparency-small-businesses"
    icon: "fa-solid fa-building"
    title: "Pay Transparency for Small Businesses"
    paragraphs:
      - "Colorado, Connecticut, Maryland, and Virginia tie at a 1-employee posting threshold because their laws do not reserve the core disclosure duty for medium or large employers. Colorado applies the requirement to covered job opportunities through its equal-pay framework, making the expected wage visible before negotiation begins."
      - "Hawaii sits at the other end with a 50-employee threshold because its statute expressly excludes smaller employers from the posting duty. Massachusetts uses 25 employees whose primary place of work is within the state. Similar threshold numbers can therefore describe different headcount tests."
    table:
      columns: {state: "State", threshold: "Minimum Employees"}
      rows:
        - {state: "Colorado", threshold: 1}
        - {state: "Connecticut", threshold: 1}
        - {state: "Maryland", threshold: 1}
        - {state: "Virginia", threshold: 1}
        - {state: "New York", threshold: 4}
        - {state: "Vermont", threshold: 5}
        - {state: "Maine", threshold: 10}
        - {state: "New Jersey", threshold: 10}
        - {state: "California", threshold: 15}
        - {state: "Illinois", threshold: 15}
  - id: "salary-ranges-in-job-postings"
    icon: "fa-solid fa-file-lines"
    title: "Salary Ranges in Job Postings"
    paragraphs:
      - "California's 15-employee rule requires the good-faith salary or hourly range expected upon hire. A salary range describes the position, not every employee's actual paycheck. The range can sit above a [state minimum wage](/rankings/economy/minimum-wage-by-state), which remains a separate legal floor."
      - "Washington and Illinois also start at 15 employees and require benefits information alongside pay. A posted annual salary does not establish whether a worker is exempt from [overtime laws](/rankings/law/overtime-laws-by-state). Job duties and the applicable exemption rules determine that question."
  - id: "pay-transparency-after-interview"
    icon: "fa-solid fa-comments"
    title: "Pay Transparency After an Interview"
    paragraphs:
      - "Nevada requires the wage or salary range or rate after an applicant completes an interview. Rhode Island requires a range on an applicant's request and at specified employment milestones. Both protect access to pay information without using the same job-ad trigger as New York."
      - "Delaware's posting requirement begins in September 2027, leaving it outside today's threshold ranking. A ban on requesting past salary addresses a different practice. Employers can avoid asking what someone earned previously while still having no current statewide duty to publish the new job's range."
    table:
      columns: {state: "State", rule: "Disclosure Trigger"}
      rows:
        - {state: "Nevada", rule: "After a completed interview"}
        - {state: "Rhode Island", rule: "Request and specified employment milestones"}
        - {state: "Delaware", rule: "Posting rule begins September 2027"}
  - id: "pay-transparency-remote-jobs"
    icon: "fa-solid fa-laptop"
    title: "Pay Transparency for Remote Jobs"
    paragraphs:
      - "Illinois can cover an out-of-state role that reports to an Illinois supervisor, office, or work site. California interprets its rule to cover postings for positions that may be filled in California remotely. A company's headquarters is therefore not always the location that decides disclosure."
      - "Maine's 10-employee posting rule began in July 2026, while Connecticut's broader posting rule began in October. Applicants comparing benefits should also distinguish a salary range from [paid family leave](/rankings/law/paid-family-leave-states), since a disclosed benefit package and a statewide leave entitlement are separate facts."
