faq:
  - question: "Which states require salary ranges in job postings?"
    answer: "California, Colorado, Connecticut, Hawaii, Illinois, Maine, Maryland, Massachusetts, Minnesota, New Jersey, New York, Vermont, Virginia, and Washington require pay disclosure in covered postings. Employer size, job location and exceptions determine whether a particular advertisement is covered."
  - question: "What is the California pay transparency law?"
    answer: "California requires employers with 15 or more employees to include a pay scale in covered job postings. Applicants and employees also have request-based rights that are distinct from the posting threshold."
  - question: "Does New York require salary ranges?"
    answer: "New York's statewide posting law applies at 4 employees. Covered advertised jobs, promotions and transfer opportunities must disclose their pay range."
  - question: "Does Texas have a pay transparency law?"
    answer: "Texas has no general statewide applicant salary-range disclosure requirement in this comparison. An employer may still publish ranges voluntarily or face requirements tied to a job covered by another state's law."
  - question: "Does Nevada require salary ranges in job ads?"
    answer: "Nevada requires disclosure after a completed interview rather than a general range in every job ad. An applicant can therefore have a legal disclosure right even when the advertisement contains no salary."
  - question: "What is the Massachusetts pay transparency threshold?"
    answer: "Massachusetts uses 25 employees for its posting rule. The count focuses on employees whose primary place of work is Massachusetts, rather than treating every national employee identically."
  - question: "Does Connecticut require salary ranges in job postings?"
    answer: "Connecticut's posting rule is active from October 2026 and reaches covered employers starting at 1 employee. The law expands earlier wage-range rights to public and internal advertisements."
  - question: "Does pay transparency reveal every employee's salary?"
    answer: "California requires the position's pay scale, not a named coworker's paycheck. Range-disclosure laws differ from equal-pay rules and protections for workers who discuss their own wages."
