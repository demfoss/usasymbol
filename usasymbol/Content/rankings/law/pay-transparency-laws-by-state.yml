seo:
  title: "Pay Transparency Laws by State | Map & Rules"
  description: "Fourteen states require pay in covered job ads. Nevada and Rhode Island require disclosure later. Delaware's posting rule starts in 2027."
page:
  h1: "Pay Transparency Laws by State"
  quick_answer:
    - "Pay transparency laws by state reach covered employers with 1 employee in Colorado, Connecticut, Maryland, and Virginia, tied for the lowest posting threshold. Their laws require pay information before applicants work through an interview process."
    - "Hawaii has the highest posting threshold at 50 employees. Smaller employers fall outside that statewide job-ad rule, unlike employers meeting the lower thresholds in California or New York."
    - "Nevada and Rhode Island require salary information at later hiring stages rather than in every covered job ad. Delaware has enacted a posting requirement for September 2027, so a salary history ban alone should not be mistaken for a current posting law."
  methodology: "State statutes and agency guidance checked October 2, 2026 support employee thresholds for active statewide job-ad pay disclosure, with differing headcount rules. Other disclosure, future laws and local rules are unranked, and DC is excluded."
