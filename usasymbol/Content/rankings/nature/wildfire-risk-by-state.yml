      url: "https://www.nifc.gov/fire-information/statistics/wildfires"
      description: "National annual wildfire and acreage statistics compiled by federal, state, and local fire agencies"
    - name: "Wikipedia. 2024 Oregon Wildfires"
      url: "https://en.wikipedia.org/wiki/2024_Oregon_wildfires"
      description: "Background on the 2024 Oregon fire season, including fuel buildup from long-term fire suppression and reduced snowpack from climate change"

