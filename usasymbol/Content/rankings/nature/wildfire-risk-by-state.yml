sections:
  - id: "states-with-the-most-wildfire-acreage-burned"
    icon: "fa-solid fa-fire"
    title: "States With the Most Wildfire Acreage Burned"
    paragraphs:
      - "Oregon burned 1.8 million acres in 2024, the highest total of any state. Texas follows at 1.3 million and California at 1.1 million. Idaho ranks fourth at 1 million acres."
      - "Alaska burned 667,100 acres despite recording only 377 individual fires, and Wyoming burned 620,100 acres. Oklahoma is next at 383,600, then Montana at 352,500."

  - id: "states-with-the-most-wildfire-incidents"
    icon: "fa-solid fa-fire-flame-curved"
    title: "States With the Most Wildfires"
    paragraphs:
      - "California recorded 8,316 individual wildfires in 2024, more than any other state, even though it ranks third for acreage burned. Texas is second at 4,967 fires, and North Carolina is third at 4,668."
      - "Oklahoma logged 3,041 fires and Missouri logged 2,804, yet both states rank well below the acreage leaders. Missouri burned only 95,100 acres despite its high fire count, and North Carolina burned just 18,200."

  - id: "why-alaska-burns-so-many-acres-per-fire"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Alaska Burns So Many Acres per Fire"
    paragraphs:
      - "Alaska burned 667,100 acres from just 377 fires in 2024, the highest acres-per-fire ratio among the top acreage states. Remoteness, difficult terrain, and low firefighter availability in the state make individual wildfires harder to contain once they start."
      - "Oregon's 2024 season, the largest by acreage at 1.8 million, followed more than a century of fire suppression that left an abundance of unburned fuel. Climate change has also reduced snowpack and produced earlier snowmelt, raising wildfire risk across the state."

