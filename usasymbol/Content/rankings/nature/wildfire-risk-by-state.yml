page:
  h1: "Wildfire Risk by State"

  quick_answer:
    - "Oregon burned the most wildfire acreage in 2024 at 1.8 million acres, the highest total of any state."
    - "Texas follows at 1.3 million acres and California at 1.1 million, though California recorded far more individual fires at 8,316, the most of any state."
    - "Rhode Island burned the fewest acres at 75. Alaska logged just 377 fires but 667,100 acres burned, giving it one of the highest acres-per-fire totals among high-acreage states."

  methodology: "Wildfires and acres burned use 2024 state-level data listed by World Population Review, citing Policygenius and the Insurance Information Institute. States are ranked here by acres burned; the District of Columbia is excluded because this page ranks the 50 states only."

  sources:
    - name: "World Population Review. Wildfires by State 2026"
      url: "https://worldpopulationreview.com/state-rankings/wildfires-by-state"
      description: "State table listing 2024 wildfire counts and acres burned for all 50 states"
