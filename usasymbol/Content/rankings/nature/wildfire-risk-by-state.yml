faq:
  - question: "Which state burned the most wildfire acreage?"
    answer: "Oregon burned the most wildfire acreage in 2024 at 1.8 million acres. Texas ranks second at 1.3 million, and California is third at 1.1 million."

  - question: "Which state has the most individual wildfires?"
    answer: "California recorded 8,316 wildfires in 2024, the most of any state. Texas is second at 4,967, and North Carolina is third at 4,668."

  - question: "How many acres burned in wildfires in Texas?"
    answer: "Texas burned 1.3 million acres in 2024 across 4,967 individual fires."

  - question: "Which state burned the fewest wildfire acres?"
    answer: "Rhode Island burned the fewest acres at 75. New Hampshire is next lowest at 127, and Delaware follows at 137."

  - question: "Why did Alaska burn so many acres with so few fires?"
    answer: "Alaska burned 667,100 acres from only 377 fires in 2024. Remoteness, difficult terrain, and low firefighter availability make individual Alaska wildfires harder to contain, so each fire tends to spread across more acreage than in states with easier access."

  - question: "How many wildfire acres burned in California?"
    answer: "California burned 1.1 million acres in 2024, ranking third behind Oregon and Texas. It had the most individual fires of any state at 8,316."

