faq:
  - question: "Which state has the most earthquakes?"
    answer: "Alaska has the most earthquakes of any state, with 59,545 recorded from 2015 to 2025. Hawaii ranks second at 16,612, and California is third at 14,563."

  - question: "Which state has the fewest earthquakes?"
    answer: "North Dakota and Rhode Island recorded zero earthquakes from 2015 to 2025, the fewest of any state. Delaware and Iowa are next lowest, with 1 each."

  - question: "Why does Alaska have so many earthquakes?"
    answer: "Alaska sits on an active tectonic plate boundary where the Pacific plate subducts beneath the North American plate along the Alaska-Aleutian Megathrust. The state averages six magnitude 6 to 7 earthquakes a year and one magnitude 8 or larger roughly every 13 years."

  - question: "Does California have more earthquakes than Alaska?"
    answer: "No. California recorded 14,563 earthquakes from 2015 to 2025, well below Alaska's 59,545 and Hawaii's 16,612. California does have more damaging earthquakes than any other state."

  - question: "Why do Missouri, Arkansas, and Tennessee have earthquakes if they are far from a plate boundary?"
    answer: "All three sit within the New Madrid Seismic Zone, along with parts of Kentucky and Illinois. Missouri recorded 219 earthquakes and Tennessee recorded 260 from 2015 to 2025, both well above nearby states like Ohio at 40."

  - question: "How many earthquakes does Texas have?"
    answer: "Texas recorded 8,484 earthquakes from 2015 to 2025, the fourth most of any state. Nevada is close behind at 8,302."

