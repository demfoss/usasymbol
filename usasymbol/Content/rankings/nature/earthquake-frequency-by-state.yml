sections:
  - id: "why-alaska-has-the-most-earthquakes"
    icon: "fa-solid fa-mountain"
    title: "Why Alaska Has the Most Earthquakes"
    paragraphs:
      - "Alaska's southern edge sits on an active tectonic plate boundary, where the Pacific plate subducts beneath the North American plate along the Alaska-Aleutian Megathrust. That subduction zone is part of the Pacific Ring of Fire and drives Alaska's 59,545 recorded earthquakes, far more than any other state."
      - "The state averages six magnitude 6 to 7 earthquakes a year, one magnitude 7 to 8 earthquake every two years, and one magnitude 8 or larger roughly every 13 years. Hawaii, the second-ranked state at 16,612, and California, third at 14,563, also sit on active plate-related fault systems."

  - id: "states-with-the-fewest-earthquakes"
    icon: "fa-solid fa-house"
    title: "States With the Fewest Earthquakes"
    paragraphs:
      - "North Dakota and Rhode Island recorded zero earthquakes from 2015 to 2025. Delaware and Iowa each recorded only 1, and Connecticut, Florida, and New Hampshire each recorded 2."
      - "Florida and North Dakota are named by the U.S. Geological Survey as the states with the smallest number of earthquakes of any state in the country, consistent with their positions at the bottom of this table."

  - id: "new-madrid-zone-earthquakes-in-the-central-us"
    icon: "fa-solid fa-layer-group"
    title: "Why Central States Like Missouri and Tennessee Still Shake"
    paragraphs:
      - "Missouri recorded 219 earthquakes and Tennessee recorded 260, both far above neighboring interior states such as Nebraska at 48 and Ohio at 40. Arkansas recorded 96, also elevated for a state with no plate boundary nearby."
      - "All three states sit within the New Madrid Seismic Zone, which spans southeastern Missouri, northeastern Arkansas, western Tennessee, western Kentucky, and southern Illinois. Hundreds of small earthquakes occur there every year, most too small to be felt."

