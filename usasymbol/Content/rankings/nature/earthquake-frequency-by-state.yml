page:
  h1: "Earthquake Frequency by State"

  quick_answer:
    - "Alaska recorded the most earthquakes of any state from 2015 to 2025, with 59,545 total events on record, well ahead of every other state."
    - "Hawaii is second at 16,612 and California is third at 14,563. Texas follows at 8,484 and Nevada at 8,302, both driven in part by oil and gas activity in Texas and geothermal and mining activity in Nevada."
    - "North Dakota and Rhode Island recorded zero earthquakes in the same period. Delaware and Iowa each recorded just 1."

  methodology: "Total recorded earthquakes by state from 2015 to 2025, listed on World Population Review's state earthquake table. Figures reflect events captured in seismic monitoring networks and are not limited to a single magnitude threshold."

  sources:
    - name: "World Population Review. Earthquakes by State 2026"
      url: "https://worldpopulationreview.com/state-rankings/earthquakes-by-state"
      description: "State table with total recorded earthquakes from 2015 to 2025"
    - name: "U.S. Geological Survey. Which state has the most earthquakes that cause damage? Which state has the most earthquakes (not human-induced)?"
      url: "https://www.usgs.gov/faqs/which-state-has-most-earthquakes-cause-damage-which-state-has-most-earthquakes-not-human"
      description: "USGS FAQ confirming Alaska and California have the most naturally occurring earthquakes, and California has the most damaging earthquakes"
    - name: "U.S. Geological Survey. Which states have the smallest number of earthquakes?"
      url: "https://www.usgs.gov/faqs/which-states-and-other-places-world-have-smallest-number-earthquakes"
      description: "USGS FAQ naming Florida and North Dakota as the states with the fewest earthquakes"
    - name: "Alaska Division of Geological & Geophysical Surveys. Earthquakes"
      url: "https://dggs.alaska.gov/hazards/earthquakes.html"
      description: "Explains the Alaska-Aleutian Megathrust subduction zone and Alaska earthquake frequency statistics"
    - name: "Missouri Department of Natural Resources. Facts About the New Madrid Seismic Zone"
      url: "https://dnr.mo.gov/land-geology/hazards/earthquakes/science/facts-new-madrid-seismic-zone"
      description: "Describes the New Madrid Seismic Zone spanning Missouri, Arkansas, Tennessee, Kentucky, and Illinois"

