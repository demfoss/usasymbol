  - id: states-with-the-fewest-endangered-species
    title: "States With the Fewest Endangered Species"
    paragraphs:
      - "Vermont lists just 5 species, followed by North Dakota with 7. Alaska and Rhode Island each list 8. Alaska has the most land of any state, yet much of it remains wild, and its listed species include the polar bear on the Arctic coast."
      - "Small and northern states have fewer species with tiny ranges, which is what usually triggers a listing. Alabama and Tennessee run the other way. Their rivers are among the richest freshwater habitats in North America, packed with mussels, snails and fish that live in a single stream or shoal."
