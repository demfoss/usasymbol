sections:
  - id: why-hawaii-has-the-most-endangered-species
    title: "Why Hawaii Has the Most Endangered Species"
    paragraphs:
      - "Hawaii lists 489 species, and 472 of them are endangered. The islands are the most isolated on Earth, so the few plants, insects and birds that arrived over millions of years evolved into hundreds of new species found nowhere else. Most of the list is plants."
      - "Small ranges make those species easy to lose. Rats, pigs, mosquitoes carrying avian malaria and invasive plants arrived with people and hit animals that had never faced such threats. Hawaiian honeycreepers and the Hawaiian monk seal are among the best known. California, second with 286, owes its total to a mix of deserts, coasts, mountains and wetlands, plus a large and growing population."
