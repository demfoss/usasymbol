faq:
  - question: "Which state has the most endangered species?"
    answer: "Hawaii, with 489 listed species, ahead of California at 286 and Florida at 139. Hawaii's total is larger than California and Florida combined."
  - question: "How many endangered species are there in California?"
    answer: "California lists 286 species, including 205 endangered and 82 threatened. Many are plants and small animals found only in a few valleys, dunes or vernal pools."
  - question: "Which state has the fewest endangered species?"
    answer: "Vermont, with 5 listed species. North Dakota follows with 7, and Alaska and Rhode Island each list 8."
  - question: "Why does Alabama have so many endangered species?"
    answer: "Alabama lists 135, fourth in the country, mostly aquatic animals. Its river systems hold hundreds of freshwater mussel, snail and fish species, and many live in only one river."
  - question: "What is the difference between endangered and threatened?"
    answer: "Endangered species are in danger of going extinct across all or much of their range. Threatened species are likely to become endangered in the foreseeable future. Hawaii has 472 endangered and only 17 threatened."
  - question: "How many endangered species are in Texas and Florida?"
    answer: "Florida lists 139 species and Texas 118. Florida's subtropical coasts and wetlands and Texas's mix of Gulf shores, desert and hill country keep both near the top."
