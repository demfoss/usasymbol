  description: "Hawaii has 489 federally listed species, more than any other state. California has 286, Florida 139 and Alabama 135. Vermont has 5."
page:
  h1: "Endangered Species by State"
  quick_answer:
    - "Hawaii has the most endangered and threatened species of any state, 489, nearly all of them endangered. Its islands sit in the middle of the Pacific, so many plants and birds exist nowhere else on Earth."
    - "California is second with 286 and Florida third with 139. Alabama, with 135, beats Texas and Tennessee because its rivers shelter an exceptional number of freshwater mussels, snails and fish."
    - "Vermont has the fewest at 5. Alaska, the largest state, lists only 8, since most of its land remains wild and its species have not been squeezed out."
  methodology: "Species listed under the Endangered Species Act whose current range is believed to or known to include the state, from the U.S. Fish & Wildlife Service ECOS database, November 2026. A species ranging across several states counts in each. The total also includes experimental populations and similarity-of-appearance listings, so endangered and threatened do not always sum to it. Territories and D.C. are excluded."
  sources:
