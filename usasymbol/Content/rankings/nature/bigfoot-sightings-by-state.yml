faq:
  - question: "Which state has the most bigfoot sightings?"
    answer: "Washington has the most reported bigfoot sightings of any state, with 676 in the BFRO database. California is second with 445, and Florida is third with 328."

  - question: "Which state has the highest bigfoot sighting rate per capita?"
    answer: "Washington also leads the per-capita rankings at 8.9 sightings per 100,000 residents. Oregon is second at 6.0, well ahead of California's rate of 1.1."

  - question: "How many bigfoot sightings does California have?"
    answer: "California has 445 reported sightings, the second-highest raw count in the country. Its per-capita rate is only 1.1 per 100,000 residents, far below the top states."

  - question: "Which state has the fewest bigfoot sightings?"
    answer: "Hawaii has zero reported sightings on record, the only state with none. Rhode Island and Delaware are next lowest, each with 5."

  - question: "What is the bigfoot sighting rate in Texas?"
    answer: "Texas has 246 sightings, ranking 7th in raw count, but its rate of 0.8 per 100,000 residents is well below the national leaders. Large population totals pull its per-capita rate down."

  - question: "How many bigfoot sightings does Oregon have?"
    answer: "Oregon has 254 reported sightings. Its rate of 6.0 per 100,000 residents is the second highest in the country, behind only Washington."

