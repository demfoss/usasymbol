sections:
  - id: "states-with-the-most-bigfoot-sightings"
    icon: "fa-solid fa-magnifying-glass"
    title: "States With the Most Bigfoot Sightings"
    paragraphs:
      - "Washington tops the list with 676 reported sightings. California is second at 445, and Florida is third at 328."
      - "Ohio follows at 302 and Illinois at 296. Oregon rounds out the top six with 254 sightings, ahead of Texas at 246 and Michigan at 220."

  - id: "why-washington-has-the-most-bigfoot-sightings"
    icon: "fa-solid fa-tree"
    title: "Why Washington Has the Most Bigfoot Sightings"
    paragraphs:
      - "Washington's 676 sightings and its rate of 8.9 per 100,000 residents both lead the country. The BFRO database ties higher report counts to dense forest cover, mountainous terrain, and nearby freshwater sources, conditions found throughout Washington's Cascade Range and coastal forests."
      - "Reports also concentrate away from high-density population centers. Washington's largest cities sit apart from the forested, mountainous terrain where most of its 676 sightings were logged."

  - id: "states-with-the-highest-bigfoot-sighting-rate"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest Bigfoot Sighting Rate"
    paragraphs:
      - "Washington's rate of 8.9 per 100,000 residents is the highest in the country. Oregon is second at 6.0, and West Virginia is third at 5.8."
      - "Idaho follows at 5.2 per 100,000, and Montana is at 4.9. Wyoming is close behind at 4.8, despite ranking 37th in raw sightings with 28."

