page:
  h1: "Bigfoot Sightings by State"

  quick_answer:
    - "Washington logs the most bigfoot sightings of any state, with 676 reports and a rate of 8.9 per 100,000 residents."
    - "California ranks second with 445 sightings, but its rate is only 1.1 per 100,000. Oregon posts fewer raw sightings at 254, yet its rate of 6.0 is the second highest in the country."
    - "Hawaii records zero sightings in the database, the only state with none. Rhode Island and Delaware each report just 5."

  methodology: "Sighting counts are listed by the Bigfoot Field Researchers Organization (BFRO) geographical database. Per-100,000 rates cross-reference those counts against 2019 US Census Bureau state population estimates."

  sources:
    - name: "Bigfoot Field Researchers Organization (BFRO). Geographical Database of Reports"
      url: "http://www.bfro.net/"
      description: "State-by-state database of reported bigfoot sightings"
    - name: "SatelliteInternet.com. Top 9 States With the Most Bigfoot Sightings"
      url: "https://www.satelliteinternet.com/resources/states-with-the-most-bigfoot-sightings/"
      description: "BFRO sighting counts by state cross-referenced with Census population to compute sightings per 100,000 residents"
    - name: "US Census Bureau. 2019 National and State Population Estimates"
      url: "https://www.census.gov/newsroom/press-kits/2019/national-state-population-estimates.html"
      description: "State population figures used to calculate the per-100,000 rate"

