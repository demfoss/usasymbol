  - id: "why-wyoming-has-the-most-national-park-visits-per-resident"
    icon: "fa-solid fa-mountain"
    title: "Why Wyoming Has the Most National Park Visits Per Resident"
    paragraphs:
      - "Wyoming's rate of 13.84 recreation visits per resident is the highest in the country, produced by a population of just 586,722 alongside two of the National Park System's most visited units. Grand Teton National Park recorded 3,628,222 visits in 2024, and the Wyoming portion of Yellowstone National Park added 2,324,734 more."
      - "Those two parks alone drew more visits than Wyoming has residents. Montana posts the second-highest rate at 5.214 per resident, helped by its own Glacier National Park total of 3,208,755 plus a share of Yellowstone's Montana entrances."

  - id: "states-with-the-fewest-national-park-visits-per-resident"
    icon: "fa-solid fa-city"
    title: "States With the Fewest National Park Visits Per Resident"
    paragraphs:
      - "Connecticut has the lowest rate in the country at 0.009 visits per resident, just 34,246 total visits in 2024. Illinois is next lowest at 0.015 per resident on 188,237 visits, followed by New Hampshire at 0.019."
      - "Kansas and Rhode Island round out the bottom five, at 0.037 and 0.039 per resident. Illinois still ranks among the ten most populous states, which pulls its per-resident figure down despite hosting several NPS units."

