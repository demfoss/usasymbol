seo:
  title: "National Park Visits Per Capita | Map, Rank & Totals"
  description: "Wyoming had 13.84 national park visits per resident in 2024, the highest rate in the US. California had the most total visits at 39,405,196."

page:
  h1: "National Park Visits Per Capita by State"

  quick_answer:
    - "Wyoming has the highest national park visitation rate in the country, 13.84 recreation visits for every resident in 2024, a total of 8,120,301 visits against a population of 586,722."
    - "California receives more National Park Service recreation visits than any other state, 39,405,196 in 2024, yet its rate of 1.00 visit per resident ranks only 21st nationally."
    - "Connecticut has the lowest rate at just 0.01 visits per resident, 34,246 total visits in 2024, far below Wyoming's 13.84."

  methodology: "State totals come from the National Park Service Statistical Abstract 2024 (Table 2), calendar-year recreation visits summed by state, including units that cross state lines. Per-resident figures use July 1, 2024 Census Bureau population estimates; Washington, D.C. and U.S. territories are excluded."

  sources:
    - name: "National Park Service. Statistical Abstract 2024"
      url: "https://irma.nps.gov/DataStore/DownloadFile/722329"
      description: "Federal annual report with recreation visits by state and by park unit for 2024 and 2023 (Tables 2 and 6)"
    - name: "U.S. Census Bureau. Vintage 2025 Population Estimates (NST-EST2025-POP)"
      url: "https://www2.census.gov/programs-surveys/popest/tables/2020-2025/state/totals/NST-EST2025-POP.xlsx"
      description: "July 1, 2024 resident population estimates by state, used to calculate national park visits per resident"

