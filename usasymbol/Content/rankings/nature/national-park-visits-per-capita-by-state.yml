faq:
  - question: "Which state has the most national park visits per capita?"
    answer: "Wyoming leads with 13.84 recreation visits per resident, a total of 8,120,301 visits in 2024 against a population of 586,722. Montana is second at 5.214 per resident."

  - question: "Which state has the most national park visits overall?"
    answer: "California recorded more visits than any other state, 39,405,196 in 2024. Its rate of 1.00 visit per resident ranks only 21st nationally."

  - question: "Which state has the fewest national park visits per capita?"
    answer: "Connecticut has the lowest rate at 0.009 visits per resident. Illinois is next lowest at 0.015 per resident."

  - question: "Why does Wyoming have the most national park visits per resident?"
    answer: "Grand Teton National Park drew 3,628,222 visits in 2024 and the Wyoming portion of Yellowstone National Park added 2,324,734 more, against a state population of just 586,722. Those two parks alone outnumber Wyoming's residents."

  - question: "How many national park visits did the 50 states record in 2024?"
    answer: "The 50 states in this table recorded a combined 287,572,319 recreation visits in 2024. California accounts for the largest share at 39,405,196."

  - question: "How many national park visits does Utah have?"
    answer: "Utah recorded 15,821,579 visits in 2024, the fourth-highest total among all states. Zion National Park alone accounted for 4,946,592 of that figure."

