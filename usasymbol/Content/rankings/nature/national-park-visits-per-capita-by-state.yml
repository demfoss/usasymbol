sections:
  - id: "states-with-the-most-national-park-visits-overall"
    icon: "fa-solid fa-ranking-star"
    title: "States With the Most National Park Visits Overall"
    paragraphs:
      - "California receives more national park visits than any other state, 39,405,196 in 2024. Virginia follows at 21,362,318 and North Carolina is third at 18,796,184."
      - "New York ranks fourth at 18,741,053 and Utah fifth at 15,821,579. California's total is nearly double New York's, though its rate of 1.00 visit per resident ranks only 21st nationally."
