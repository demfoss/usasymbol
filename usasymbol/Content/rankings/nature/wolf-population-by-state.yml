  - id: states-with-the-fewest-wolves
    icon: "fa-solid fa-tree"
    title: "States With the Fewest Wolves"
    paragraphs:
      - "Colorado has 32 wolves, the fewest on the list. Voters narrowly approved bringing wolves back in 2020, and the state began releasing animals captured elsewhere in December 2023."
      - "California has about 55. Its first wild wolf in nearly a century was OR-7, a collared male that crossed from Oregon in December 2011. Packs later settled in the northern part of the state."
