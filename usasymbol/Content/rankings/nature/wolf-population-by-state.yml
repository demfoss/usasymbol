sections:
  - id: why-alaska-has-the-most-wolves
    icon: "fa-solid fa-paw"
    title: "Why Alaska Has the Most Wolves"
    paragraphs:
      - "Alaska has about 9,450 wolves and is the only state where they were never wiped out. Millions of acres of forest, tundra and mountains hold moose and caribou, the prey wolves depend on, and few roads cut through that country."
      - "Minnesota at 2,919 is the lower 48 leader because a remnant pack survived in the northeastern forests when hunters, trappers and bounty programs cleared wolves from almost every other state. From there wolves spread east, which is how Wisconsin and Michigan regained their own packs. Bears share much of that northern forest, as the [black bear population by state](/rankings/nature/bear-population-by-state) shows."
    table:
      columns:
        rank: "Rank"
        state: "State"
        estimated_wolves: "Estimated Wolves"
        estimate_year: "Year of Estimate"
      rows:
