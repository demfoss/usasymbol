  description: "Alaska has the most gray wolves of any state at about 9,450. Minnesota follows at 2,919, and Colorado has the fewest at 32."
page:
  h1: "Wolf Population by State"
  quick_answer:
    - "Alaska has the most gray wolves of any state at about 9,450, the midpoint of a 7,700 to 11,200 range. Wolves never disappeared there, and the state still has vast roadless forest and tundra."
    - "Colorado has the fewest at 32, all descended from animals released since December 2023 after voters approved a return in 2020. California follows at about 55, a population that began when the wolf OR-7 wandered in from Oregon in 2011."
    - "Minnesota holds 2,919 wolves, the most in the lower 48 states. It is the only one where wolves survived the extermination campaigns of the 1900s."
  methodology: "Latest wolf estimate reported by each state wildlife agency, compiled by the Wolf Conservation Center from state and federal data. Counts come from different years and survey methods, shown in the year column. Alaska is ranked by the midpoint of its 7,700 to 11,200 range. States with no resident wolves and states without a published estimate, such as Utah, are omitted."
  sources:
