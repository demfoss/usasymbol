  - id: wolves-in-the-northern-rockies
    icon: "fa-solid fa-mountain"
    title: "Wolves in the Northern Rockies"
    paragraphs:
      - "Idaho at 1,129, Montana at 725 and Wyoming at 253 owe their wolves to a federal program. Wolves from Canada were released in Yellowstone National Park and central Idaho in 1995 and 1996, and their descendants spread across the region."
      - "Wolves did not stop at state lines. Packs from Idaho moved west into Oregon and Washington, which now hold 230 and 270. Hunters and ranchers in the Rockies still debate wolves and elk herds, a theme that also appears in [hunting license sales by state](/rankings/sports/hunting-license-sales-by-state)."
