faq:
  - question: "Which state has the most wolves?"
    answer: "Alaska, with about 9,450 gray wolves at the midpoint of its reported range. Minnesota is second at 2,919."
  - question: "How many wolves are in Minnesota?"
    answer: "Minnesota has an estimated 2,919 wolves from the winter 2022-23 survey. Wolves in the northeastern forests were never fully eliminated, so the state kept a breeding population while neighbors lost theirs."
  - question: "How many wolves are in Colorado?"
    answer: "Colorado has at least 32 wolves as of March 2026. Reintroduction began in December 2023 under a 2020 ballot measure."
  - question: "Are there wolves in California?"
    answer: "Yes, about 55. The state has had wild wolves again since OR-7 crossed from Oregon in 2011."
  - question: "Why did wolves disappear from most states?"
    answer: "Bounties, poison and trapping, driven by fear of livestock losses, removed wolves from nearly all of the lower 48 by the mid-1900s. Alaska and northern Minnesota were the main exceptions."
  - question: "Are there wolves in Yellowstone National Park?"
    answer: "Yes. Yellowstone is in Wyoming, which has an estimated 253 wolves, and wolves were reintroduced there in 1995 and 1996 after about seven decades without them."
