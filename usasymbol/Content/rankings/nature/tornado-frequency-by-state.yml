sections:
  - id: "states-with-the-most-tornadoes"
    icon: "fa-solid fa-tornado"
    title: "States With the Most Tornadoes"
    paragraphs:
      - "Texas reported 169 tornadoes in 2024, the highest total of any state. Iowa and Nebraska tied for second at 131 each, and Illinois followed close behind at 126."
      - "Missouri recorded 105 tornadoes and Florida logged 103, rounding out the top five. Louisiana reached 92, and Oklahoma tallied 91."

  - id: "states-with-the-fewest-tornadoes"
    icon: "fa-solid fa-cloud"
    title: "States With the Fewest Tornadoes"
    paragraphs:
      - "Alaska, Hawaii, Maine, Nevada, and Vermont reported zero tornadoes in 2024. Connecticut, Delaware, Idaho, Massachusetts, New Jersey, Rhode Island, and Washington each recorded just one."
      - "New Hampshire logged two tornadoes, while Utah and Oregon each had three. Montana reported four, and Wyoming reached five."

  - id: "states-with-the-most-tornado-fatalities"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States With the Most Tornado Fatalities"
    paragraphs:
      - "Texas recorded nine tornado deaths in 2024, the most of any state. Florida and Oklahoma each reported eight fatalities, tying for second even though Oklahoma logged only 91 tornadoes against Florida's 103."
      - "Iowa's 131 tornadoes caused six deaths, and Arkansas reported five fatalities from just 44 tornadoes. Louisiana recorded three deaths from 92 tornadoes, fewer than several states with lower tornado totals."

