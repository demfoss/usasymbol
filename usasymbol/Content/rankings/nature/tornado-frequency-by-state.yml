faq:
  - question: "Which state had the most tornadoes in 2024?"
    answer: "Texas had the most tornadoes in 2024 at 169. Iowa and Nebraska tied for second with 131 each, and Illinois followed at 126."

  - question: "Which states had the fewest tornadoes in 2024?"
    answer: "Alaska, Hawaii, Maine, Nevada, and Vermont each reported zero tornadoes in 2024. Connecticut, Delaware, Idaho, Massachusetts, New Jersey, Rhode Island, and Washington each had one."

  - question: "How many tornadoes did Oklahoma have in 2024?"
    answer: "Oklahoma reported 91 tornadoes in 2024, ranking eighth among all states. It also recorded eight tornado fatalities that year, tied with Florida for second most."

  - question: "Which state had the most tornado deaths in 2024?"
    answer: "Texas recorded nine tornado deaths in 2024, the most of any state. Florida and Oklahoma followed with eight fatalities each."

  - question: "How many tornadoes did Florida have in 2024?"
    answer: "Florida reported 103 tornadoes in 2024, the sixth highest total among all states. It also recorded eight fatalities, tied with Oklahoma for second most."

  - question: "Is Kansas part of Tornado Alley?"
    answer: "Kansas is traditionally considered part of Tornado Alley and recorded 89 tornadoes in 2024, ranking ninth among all states. It reported one tornado fatality that year."

