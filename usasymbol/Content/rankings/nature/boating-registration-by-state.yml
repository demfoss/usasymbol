faq:
  - question: "Which state has the most registered boats per capita?"
    answer: "Minnesota leads with 149.4 registered boats per 1,000 residents, a total of 865,379 boats in 2024. Wisconsin is second at 101.1 per 1,000."

  - question: "Which state has the most registered boats overall?"
    answer: "Florida registers more boats than any other state, 1,171,432 in 2024. Its rate of 50.1 per 1,000 residents ranks only 14th nationally."

  - question: "Which state has the fewest registered boats per capita?"
    answer: "Hawaii has the lowest rate at 9.6 registered boats per 1,000 residents. Colorado is next lowest at 12.0 per 1,000."

  - question: "How many boats are registered in the United States?"
    answer: "The 50 states in this table registered a combined 11,630,688 recreational vessels in 2024. Florida accounts for the largest share at 1,171,432."

  - question: "Why does Minnesota register so many boats per resident?"
    answer: "Minnesota's registration system covers nearly all watercraft, including canoes and kayaks, with only narrow exceptions. That broader scope, combined with 865,379 total registered boats, produces the nation's highest per-resident rate."

  - question: "How many boats are registered in California?"
    answer: "California registers 596,703 boats, the sixth-highest total in the country. Its rate of 15.1 per 1,000 residents ranks 45th nationally."

