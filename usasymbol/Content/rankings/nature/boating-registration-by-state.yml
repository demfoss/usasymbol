sections:
  - id: "states-with-the-most-registered-boats"
    icon: "fa-solid fa-ranking-star"
    title: "States With the Most Registered Boats"
    paragraphs:
      - "Florida registers more recreational boats than any other state, 1,171,432 in 2024. Minnesota follows at 865,379 and Michigan is third at 795,494."
      - "Ohio ranks fourth with 630,288 registered boats and Wisconsin fifth at 602,849. Florida's total is nearly double Wisconsin's, though its rate of 50.1 per 1,000 residents ranks only 14th nationally."
    table:
      numbered: true
      columns:
        state: "State"
        registered_vessels: "Registered Vessels"
      rows:
        - state: "Florida"
          registered_vessels: "1,171,432"
        - state: "Minnesota"
          registered_vessels: "865,379"
        - state: "Michigan"
          registered_vessels: "795,494"
        - state: "Ohio"
          registered_vessels: "630,288"
