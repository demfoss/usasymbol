  description: "Minnesota registers 149.4 boats per 1,000 residents, the highest rate in the US. Florida registers the most boats overall at 1,171,432."

page:
  h1: "Boating Registration by State"

  quick_answer:
    - "Minnesota has the highest boat registration rate in the country at 149.4 registered vessels per 1,000 residents, a total of 865,379 registered boats in 2024."
    - "Florida registers more boats than any other state overall, 1,171,432 in 2024, yet its rate of 50.1 per 1,000 residents ranks just 14th nationally."
    - "Hawaii has the lowest boat registration rate at 9.6 per 1,000 residents, far below Minnesota's 149.4, despite requiring registration for all watercraft types."

  methodology: "State registered-vessel totals come from the U.S. Coast Guard's Recreational Boating Statistics 2024 report (Table 38). Per-1,000-resident rates use July 1, 2024 Census Bureau population estimates. Washington, D.C. and U.S. territories are excluded."

  sources:
    - name: "U.S. Coast Guard. Recreational Boating Statistics 2024 (COMDTPUB P16754.38)"
      url: "https://www.uscgboating.org/library/accident-statistics/Recreational-Boating-Statistics-2024.pdf"
      description: "Federal annual report with state-by-state recreational vessel registration data for 2024 and 2023 (Table 38)"
    - name: "U.S. Census Bureau. Vintage 2024 Population Estimates (NST-EST2024-POP)"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "July 1, 2024 resident population estimates by state, used to calculate boats per 1,000 residents"

