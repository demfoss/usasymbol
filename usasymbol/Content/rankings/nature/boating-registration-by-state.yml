          registered_vessels: "602,849"
        - state: "California"
          registered_vessels: "596,703"
        - state: "Texas"
          registered_vessels: "552,138"
        - state: "New York"
          registered_vessels: "428,445"
        - state: "South Carolina"
          registered_vessels: "353,906"
        - state: "North Carolina"
          registered_vessels: "345,699"

  - id: "why-minnesota-registers-the-most-boats-per-resident"
    icon: "fa-solid fa-water"
    title: "Why Minnesota Registers the Most Boats Per Resident"
    paragraphs:
      - "Minnesota's rate of 149.4 registered boats per 1,000 residents is the highest in the country, well above Wisconsin's second-place figure of 101.1. Minnesota's registration system covers nearly all watercraft, including canoes and kayaks, with narrow exceptions such as non-motorized boats 10 feet or shorter and seaplanes."
      - "That broad scope contrasts with states such as Alabama, which registers only motorized vessels and sailboats, or Massachusetts, which registers motorized vessels alone. A wider definition of what counts as a registered vessel raises Minnesota's total relative to states with narrower registration rules."

  - id: "states-with-the-fewest-registered-boats-per-resident"
    icon: "fa-solid fa-city"
    title: "States With the Fewest Registered Boats Per Resident"
    paragraphs:
      - "Hawaii has the lowest rate in the country at 9.6 registered boats per 1,000 residents, despite requiring registration for all watercraft types. Colorado is next lowest at 12.0 per 1,000, followed by Nevada at 12.9."
      - "New Mexico and Illinois also rank near the bottom, at 13.1 and 13.9 per 1,000 residents. California registers 596,703 boats overall, the sixth-highest total nationally, yet its rate of 15.1 per 1,000 residents ranks 45th."

