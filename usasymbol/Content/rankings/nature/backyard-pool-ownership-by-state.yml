faq:
  - question: "Which state has the most residential swimming pools?"
    answer: "Florida has an estimated 1,590,000 residential pools, the most of any state. California is second at 1,343,000."

  - question: "Which state has the most pools per capita?"
    answer: "Arizona has the highest pool density in the country at 769.2 pools per 10,000 residents. Florida is second at 714.3 per 10,000."

  - question: "Which state has the fewest residential pools?"
    answer: "Wyoming has the fewest, an estimated 3,000 pools, and also the lowest density at 51.5 pools per 10,000 residents."

  - question: "How many residential pools are there in the United States?"
    answer: "The 50 states in this table have a combined estimated 9,202,000 residential pools. Florida accounts for the largest share at 1,590,000."

  - question: "How many pools does Texas have?"
    answer: "Texas has an estimated 801,000 residential pools, the third-highest total of any state. Its density of 277.8 pools per 10,000 residents ranks 11th."

  - question: "Which states are tied for the fewest total pools?"
    answer: "Alaska, North Dakota, and South Dakota are tied at an estimated 6,000 residential pools each, just above Wyoming's last-place total of 3,000."

