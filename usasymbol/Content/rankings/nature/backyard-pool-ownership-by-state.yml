  description: "Florida has an estimated 1,590,000 residential pools, more than any other state. Arizona has the highest number of pools per capita."

page:
  h1: "Backyard Pool Ownership by State"

  quick_answer:
    - "Arizona has the highest concentration of backyard pools in the country at roughly 769.2 pools per 10,000 residents, the equivalent of one pool for every 13 people."
    - "Florida has more residential pools in total than any other state, an estimated 1,590,000, even though its density of 714.3 pools per 10,000 residents ranks second behind Arizona."
    - "Wyoming has the fewest residential pools of any state at an estimated 3,000, and also the lowest density at 51.5 pools per 10,000 residents."

  methodology: "Estimated residential pool counts by state are compiled from private data collectors, including aerial-imagery analysis firm CAPE Analytics and industry group DataMasters, as published by Pool Research in January 2025. Pools per 10,000 residents is calculated from the source's people-per-pool figures and rounded to one decimal. Washington, D.C. is excluded."

  sources:
    - name: "Pool Research. How Many Swimming Pools Are in the U.S.?"
      url: "https://poolresearch.com/us-pool-data/"
      description: "State-by-state estimated residential pool counts and people-per-pool figures compiled from private data collectors, published January 2025"

