  description: "Montana and Wyoming average their first snow around October 2, the earliest in the Lower 48. See the average first-snow date for every state, from Alaska to Florida."

page:
  h1: "Average First Snow Date by State"

  quick_answer:
    - "Great Falls, Montana, and Cheyenne, Wyoming, average their first measurable snow around October 2, the earliest date among the Lower 48 states. Anchorage, Alaska, averages October 16."
    - "Along the East Coast, first snow arrives far later: Richmond, Virginia, averages January 5 and Charlotte, North Carolina, averages January 16, the latest confirmed date of any state."
    - "Florida, Hawaii, and California's major cities have no reliable average first-snow date at all. Measurable snow there is rare enough that climate offices don't publish a typical date."

  methodology: "Dates reflect the average date of first measurable snowfall (0.1 inch or more) at each state's largest city or, where that city rarely or never sees snow, a representative in-state location, drawn from National Weather Service forecast-office climatology and NOAA climate normals (1981-2010 and 1991-2020 periods, as published by each source). States without a published average date are noted as irregular or snow-free rather than assigned an invented date."

  sources:
