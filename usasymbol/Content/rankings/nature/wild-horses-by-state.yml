sections:
  - id: "why-nevada-has-the-most-wild-horses"
    icon: "fa-solid fa-horse"
    title: "Why Nevada Has the Most Wild Horses"
    paragraphs:
      - "Nevada has 37,426 wild horses and 5,146 burros, far more than any other state. Federal agencies manage most of Nevada's land, and the Great Basin offers the open sagebrush range the herds live on."
      - "The animals descend from horses that Spanish explorers, ranchers, cavalry units and Native American nations brought west. Congress protected them in 1971 with the Wild Free-Roaming Horses and Burros Act, after public outrage over roundups."

  - id: "states-with-the-most-wild-burros"
    icon: "fa-solid fa-paw"
    title: "States With the Most Wild Burros"
    paragraphs:
      - "Arizona has 13,546 burros, more than any other state and almost the whole of its herd. Nevada (5,146) and California (4,933) also hold sizeable herds, mostly in hot, dry desert country."
      - "Burros are descended from donkeys that prospectors used as pack animals during the gold and silver rushes. Many were turned loose when mines closed, and the desert suited them well."
    table:
      columns:
        state: "State"
        burros: "Burros"
      rows:
        - state: "Arizona"
          burros: "13,546"
        - state: "Nevada"
          burros: "5,146"
        - state: "California"
