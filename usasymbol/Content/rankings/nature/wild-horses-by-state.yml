  description: "Nevada has 42,572 wild horses and burros on public land, about half of the national total. Arizona has the most burros of any state at 13,546."

page:
  h1: "Wild Horses by State"

  quick_answer:
    - "Wild horses by state peak in Nevada, which has an estimated 42,572 wild horses and burros, including 37,426 horses. Most of Nevada is federal land, and the open Great Basin range gives the herds room to roam."
    - "Arizona has 13,814 animals, and nearly all of them, 13,546, are burros. They descend from donkeys that miners and prospectors left behind in the 1800s."
    - "New Mexico has the smallest herd, only 97 wild horses and no burros. Just ten states manage herds on federal land, and all of them are in the West."

  methodology: "Bureau of Land Management estimates of wild horses and burros on Herd Management Areas as of March 1, 2026, before foal crops and gathers. Forty states with no federal herds are omitted."

