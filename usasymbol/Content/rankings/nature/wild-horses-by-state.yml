  - id: "wild-horse-states-with-the-smallest-herds"
    icon: "fa-solid fa-mountain"
    title: "Wild Horse States With Smallest Herds"
    paragraphs:
      - "New Mexico has just 97 horses, Montana 195 and Idaho 564. Montana's best known herd roams the Pryor Mountains on the Wyoming border."
      - "Wyoming has 7,165 horses and no burros, the largest horse-only herd. See how much land each state keeps in federal hands in [public land by state](/rankings/geography/public-land-by-state)."

