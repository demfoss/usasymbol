faq:
  - question: "Which state has the most wild horses?"
    answer: "Nevada, with 37,426 wild horses on Herd Management Areas. Wyoming is second among horse herds with 7,165, and Oregon third with 5,994."

  - question: "How many wild horses are there in Nevada?"
    answer: "Nevada has an estimated 37,426 wild horses and 5,146 wild burros, a total of 42,572 animals. That is well above the rangeland's carrying level, which is why the federal government gathers animals each year."

  - question: "Which state has the most wild burros?"
    answer: "Arizona has the most, with 13,546. Almost no wild horses live there, only 268."

  - question: "How many states have wild horses?"
    answer: "Ten states have federally managed wild herds. Arizona, California, Colorado, Idaho, Montana, Nevada, New Mexico, Oregon, Utah and Wyoming are all in the West."

  - question: "Are there wild horses in the Eastern United States?"
    answer: "Yes, but they are not part of the federal program. Famous herds roam Assateague Island in Maryland and Virginia and the Outer Banks of North Carolina, and they run on park or state land."

  - question: "Are wild horses native to North America?"
    answer: "Horses evolved in North America but died out around 10,000 years ago. The wild herds today descend from animals brought by Spanish colonists beginning in the 1500s."

