seo:
  title: "Deadliest Animal in Each State | Map & Facts"
  description: "Venomous snakes are the deadliest animals in 36 states, while Texas has 400–500 rattlesnake incidents per year."

page:
  h1: "Deadliest Animals by State"

  quick_answer:
    - "Venomous snakes are the top threat in 36 of 50 states. Texas leads all states with 400–500 western diamondback rattlesnake bite incidents per year, the highest count of any state."
    - "Alaska, Montana, and Wyoming are the only three states where the grizzly bear ranks as the primary threat, at 4–8 attacks per year in Alaska and 3–7 in Montana and Wyoming. Mountain lions lead in California (5–10) and Colorado (4–8)."
    - "Florida leads all states for alligator attacks with 25–35 incidents per year, more than double Louisiana's 10–15. Hawaii is the only state where a marine animal ranks first, with tiger shark attacks averaging 5–8 per year."

  methodology: "Each state shows the wild animal species with the most annual reported incidents (bites, attacks, stings) requiring medical attention, based on CDC WISQARS injury records and state wildlife agency data; all figures are approximate annual averages."

  sources:
    - name: "CDC WISQARS — Animal-Related Injury Data"
      url: "https://wisqars.cdc.gov"
      description: "CDC injury surveillance data used to estimate annual animal-related incidents by state"
    - name: "American Association of Poison Control Centers"
      url: "https://aapcc.org"
      description: "National snakebite and venomous animal incident data by state, published annually"
    - name: "USGS — Nonindigenous Aquatic Species and Wildlife Tracking"
      url: "https://www.usgs.gov"
      description: "Supporting data on wildlife distribution and incident reporting by region"

