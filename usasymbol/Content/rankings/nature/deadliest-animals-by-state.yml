faq:
  - question: "What is the deadliest animal in Texas?"
    answer: "The western diamondback rattlesnake, with 400–500 reported bite incidents per year — the highest incident count of any state-animal combination in the U.S. Texas accounts for more venomous snakebite incidents than any other state."

  - question: "What is the most dangerous animal in Florida?"
    answer: "The American alligator, with 25–35 unprovoked attack incidents per year. Florida ranks 10th overall by incident count but first among all states for alligator encounters. Louisiana (10–15) and Alabama (5–10) are the next two alligator-dominant states."

  - question: "What is the deadliest animal in Alaska?"
    answer: "The brown bear (grizzly bear), with 4–8 attack incidents per year. Alaska, Montana (3–6), and Wyoming (4–7) are the only three states where the grizzly bear ranks as the primary wildlife threat."

  - question: "What is the most dangerous animal in Hawaii?"
    answer: "The tiger shark, with 5–8 attack incidents per year. Hawaii is the only state where a marine animal ranks as the primary wildlife threat. The state has no large land predators, making ocean-going species the dominant risk."

  - question: "Which states have the most venomous snakebite incidents per year?"
    answer: "Texas leads with 400–500 western diamondback incidents per year. Arizona ranks second at 150–200. New Mexico (50–75), Arkansas (40–60), North Carolina (40–50), Tennessee (40–50), and Oklahoma (35–50) follow in the next tier."

  - question: "What is the deadliest animal in California?"
    answer: "The mountain lion, with 5–10 reported attack incidents per year. California and Colorado (4–8) are the top two mountain lion states in the contiguous U.S. Both rate High on the danger scale."

