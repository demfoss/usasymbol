sections:
  - id: "high-lethality-outliers"
    icon: "fa-solid fa-skull"
    title: "Bears, Mountain Lions, Alligators, and Sharks: High-Lethality States"
    highlights:
      - name: "Florida — American Alligator"
        image: "/images/nature/animals/american-alligator.jpg"
        description: "25–35 incidents per year · Danger: High. Florida leads all states for alligator encounters with statewide presence in lakes, rivers, canals, and retention ponds."
      - name: "Louisiana — American Alligator"
        image: "/images/nature/animals/american-alligator.jpg"
        description: "10–15 incidents per year · Danger: High. Louisiana ranks second for alligator incidents, with large populations in the Atchafalaya Basin, coastal marshes, and bayous."
      - name: "Alabama — American Alligator"
        image: "/images/nature/animals/american-alligator.jpg"
        description: "5–10 incidents per year · Danger: High. Alabama's Mobile-Tensaw Delta and coastal waterways support a growing alligator population that regularly intersects with people."
      - name: "California — Mountain Lion"
        image: "/images/nature/animals/mountain-lion.jpg"
        description: "5–10 incidents per year · Danger: High. California has the largest mountain lion population in the contiguous U.S., with encounters concentrated in foothill communities near wildland edges."
      - name: "Colorado — Mountain Lion"
        image: "/images/nature/animals/mountain-lion.jpg"
        description: "4–8 incidents per year · Danger: High. Colorado ranks second for mountain lion incidents, with Front Range suburban-wildland interfaces seeing the most human encounters."
      - name: "Alaska — Brown Bear (Grizzly)"
        image: "/images/nature/animals/brown-bear.jpg"
        description: "4–8 incidents per year · Danger: High. Alaska has the highest grizzly bear density of any U.S. state, with encounters common on salmon streams and in remote backcountry."
      - name: "Wyoming — Grizzly Bear"
        image: "/images/nature/animals/grizzly-bear.jpg"
        description: "4–7 incidents per year · Danger: High. The Yellowstone ecosystem supports more than 700 grizzly bears, with most incidents near backcountry trails and campgrounds."
      - name: "Montana — Grizzly Bear"
        image: "/images/nature/animals/grizzly-bear.jpg"
        description: "3–6 incidents per year · Danger: High. Glacier National Park and the Bob Marshall Wilderness account for the majority of grizzly encounters in Montana."
      - name: "Hawaii — Tiger Shark"
        image: "/images/nature/animals/tiger-shark.jpg"
        description: "5–8 incidents per year · Danger: High. Hawaii is the only state where a marine animal ranks first. Tiger sharks frequent nearshore waters around Maui and Oahu year-round."
      - name: "Maine — Moose"
        image: "/images/nature/animals/moose.jpg"
        description: "5–8 incidents per year · Danger: High. Maine's moose incidents are almost entirely vehicle collisions on rural highways at night. At 1,000+ lbs, a moose strike is often fatal."
    paragraphs:
      - "Florida leads all states for alligator incidents at 25–35 per year — more than double Louisiana's 10–15 and three to five times Alabama's 5–10. All three alligator states are rated High danger level despite lower incident counts than the top snake states."
      - "Alaska (4–8), Wyoming (4–7), and Montana (3–6) are the only states where a grizzly bear ranks first. California (5–10) and Colorado (4–8) lead for mountain lion incidents. Hawaii's tiger shark (5–8) and Maine's moose (5–8) are the only marine and ungulate entries on the list."

  - id: "snake-dominance"
    icon: "fa-solid fa-snake"
    title: "Venomous Snakes: The Top Threat in 36 States"
    paragraphs:
      - "Venomous snakes rank as the primary wildlife threat in 36 of 50 states. Copperheads account for 14 of those states, concentrated in the East and South. The western diamondback rattlesnake leads in Texas (#1, 400–500), Arizona (#2, 150–200), and New Mexico (#3, 50–75). Timber rattlesnakes are the top threat in 10 states across the Northeast, Midwest, and Appalachians."
      - "Prairie rattlesnakes lead in Kansas, Nebraska, South Dakota, and North Dakota across the Great Plains. The cottonmouth ranks first in Mississippi (15–20 incidents) and the Mojave rattlesnake in Nevada (20–30). The great basin rattlesnake tops Utah (15–25) and the eastern diamondback leads Georgia (20–30) and South Carolina (15–20)."

