page:
  h1: "Camping Popularity by State"

  quick_answer:
    - "California leads camping popularity nationwide with an overall score of 67.47 out of 100, ranking first in the country for camping access."
    - "Texas ranks second at 59.70, holding the top Quality rank in the nation, while Florida is third at 58.54."
    - "Rhode Island posts the lowest camping score of any state at 20.97, less than a third of California's 67.47."

  methodology: "State scores come from a weighted index covering camping access (47%), quality (18%), affordability (12%), safety (13%), and supplies (10%), built from Hipcamp, AllTrails, National Park Service, and Recreation.gov data, published December 2025."

  sources:
