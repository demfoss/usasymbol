faq:
  - question: "Which state ranks first for camping popularity?"
    answer: "California ranks first with an overall camping score of 67.47 out of 100, built on the nation's top rank for camping access."

  - question: "Which state has the best camping access?"
    answer: "California holds the top Access rank in the country. Colorado ranks second for access, ahead of Washington at fourth."

  - question: "Which state ranks last for camping?"
    answer: "Rhode Island ranks last with a score of 20.97, the only state below 21 points."

  - question: "Why does California rank first for camping despite ranking last in safety?"
    answer: "Safety counts for only 13% of the overall score. California's first-place Access rank and first-place Supplies rank outweigh its last-place, 50th, safety rank, which is tied to 317 national park deaths recorded from 2014 to 2024."

  - question: "Which state has the safest camping conditions?"
    answer: "Colorado ranks first in the country for camping safety, even though its overall score of 51.89 places it fifth nationally."

  - question: "What is the camping score for Texas?"
    answer: "Texas scores 59.70 overall, ranking second nationally. It holds the top Quality rank in the country."

