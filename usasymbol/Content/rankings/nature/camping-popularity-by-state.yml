sections:
  - id: "states-with-the-best-camping-access"
    icon: "fa-solid fa-campground"
    title: "States With the Best Camping Access"
    paragraphs:
      - "California holds the top Access rank in the country, built on the largest count of camping trails, Hipcamp listings, and park acreage of any state. Colorado ranks second for access, and Washington is fourth."
      - "New York ranks fifth for access despite an eighth-place overall score, and Oregon is sixth. Minnesota's access rank of 19 is the weakest among the top ten states by overall score, yet its total of 42.81 still places it tenth nationally."
