  - id: "why-california-ranks-first-despite-the-most-park-deaths"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Why California Ranks First Despite the Most Park Deaths"
    paragraphs:
      - "California ranks last in the country for safety, tied to 317 national park deaths recorded between 2014 and 2024, more than any other state. Safety counts for only 13% of the overall score, so that last-place rank does not offset California's first-place rank in Access and Supplies."
      - "Quality adds further weight to California's total, ranking second nationally behind Texas. The combined strength across three of the five categories carries California's overall score to 67.47, the highest in the country despite its 50th-place safety rank."

  - id: "states-with-the-lowest-camping-scores"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest Camping Scores"
    paragraphs:
      - "Rhode Island posts the lowest overall camping score in the country at 20.97, the only state below 21. Hawaii ranks second to last at 23.26, and Connecticut follows at 26.47."
      - "Nevada scores 27.09 and New Jersey scores 27.44, placing both in the bottom five nationally. Maryland is next lowest at 28.59, just ahead of Delaware's 29.33."
    table:
      numbered: true
      columns:
        state: "State"
