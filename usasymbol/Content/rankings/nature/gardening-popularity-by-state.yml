faq:
  - question: "Which state has the highest gardening score?"
    answer: "Kentucky, with a Green Thumb Score of 87.3 out of 100. It led the survey in plant care enjoyment, confidence, and comfort caring for many plant types."

  - question: "Which state has the lowest gardening score?"
    answer: "Rhode Island, at 13.6 out of 100, the lowest of any state in the survey."

  - question: "Why does Kentucky have the highest gardening score?"
    answer: "Kentucky respondents reported the most enjoyment of caring for plants and the highest confidence in keeping them alive. The state also scored well in troubleshooting plant problems and long-term plant survival."

  - question: "What is Rhode Island's gardening score?"
    answer: "Rhode Island scored 13.6 out of 100, the lowest in the survey. Its weakest areas were comfort caring for different plant types, frequency of active plant care, and self-rated gardening ability."

  - question: "How much higher is Kentucky's score than Missouri's?"
    answer: "Kentucky scores 87.3 against Missouri's 70.2, a gap of 17.1 points between first and second place."

  - question: "How many states were included in the gardening survey?"
    answer: "The survey covered 48 states with more than 2,400 total responses, collected over a two-week period in March 2026."

