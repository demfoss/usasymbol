sections:
  - id: "states-with-the-highest-gardening-scores"
    icon: "fa-solid fa-seedling"
    title: "States With the Highest Gardening Scores"
    paragraphs:
      - "Kentucky posts the highest Green Thumb Score in the survey at 87.3 out of 100. Missouri ranks second at 70.2, and New Mexico is third at 66.3."
      - "Arizona ranks fourth at 64.5, and Vermont rounds out the top five at 62.9. All five top states scored above 60 on the 100-point scale."

  - id: "why-kentucky-has-the-highest-gardening-score"
    icon: "fa-solid fa-award"
    title: "Why Kentucky Has the Highest Gardening Score"
    paragraphs:
      - "Kentucky's score of 87.3 leads the country because respondents there reported the highest enjoyment of caring for plants, the highest confidence in keeping them alive, and the most comfort caring for many plant types. The state also scored well in troubleshooting plant problems and long-term plant survival."
      - "Rhode Island's last-place score of 13.6 follows the opposite pattern. Its lowest marks came in comfort caring for different plant types, frequency of active plant care, and self-rated gardening ability."

  - id: "states-with-the-lowest-gardening-scores"
    icon: "fa-solid fa-seedling"
    title: "States With the Lowest Gardening Scores"
    paragraphs:
      - "Rhode Island records the lowest Green Thumb Score of any state at 13.6. Nebraska is second-lowest at 14.5, and Connecticut follows at 19.4."
      - "Oklahoma ranks 45th at 19.7, and Kansas rounds out the bottom five at 22.7, still less than a third of Kentucky's leading 87.3."

