sections:
  - id: "why-nevada-leads-mineral-production"
    title: "Why Nevada Leads Mineral Production"
    paragraphs:
      - "Nevada leads at $12,600 million, and gold is the main reason. The state mines about 64% of all U.S. gold, along belts such as the Carlin Trend that have been worked since the 1960s. Copper, silver, and diatomite fill out its list of leading commodities."
      - "Mining built Nevada from the start. The Comstock Lode silver strike of 1859 near Virginia City drew thousands of miners, and Nevada became a state in 1864. Alaska (fourth, $6,410 million) follows a similar pattern, with about 22% of U.S. gold plus lead, silver, and zinc."
    table:
      columns:
        state: "State"
        value: "Value in Millions"
      rows:
