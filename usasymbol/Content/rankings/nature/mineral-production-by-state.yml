faq:
  - question: "Which state produces the most minerals?"
    answer: "Nevada, with $12,600 million in nonfuel minerals. Gold dominates, with Alaska second in gold at about 22% of U.S. output."

  - question: "How much are minerals produced in the United States worth?"
    answer: "U.S. mines and quarries produced about $112,000 million of nonfuel minerals in 2025. Crushed stone is the most valuable single commodity at about $27 billion, followed by gold, construction sand and gravel, portland cement, and copper."

  - question: "Which state produces the most gold?"
    answer: "Nevada, at about 64% of U.S. gold. Alaska is second with about 22%, mostly from placer mines that sift gold from stream gravel."

  - question: "What is the value of mineral production in Texas?"
    answer: "Texas produces $10,200 million, third in the country. Cement, lime, sand and gravel, and crushed stone lead the list."

  - question: "What is the value of mineral production in Wyoming?"
    answer: "Wyoming reports $579 million, 36th, as a partial total. Coal, oil, and natural gas are fuels and do not count, while soda ash, bentonite clay, and helium do."

  - question: "Which state produces the least minerals?"
    answer: "Delaware, at $19 million. Connecticut, Hawaii, and New Hampshire also report under $260 million, since they quarry mostly sand, gravel, and crushed stone."

