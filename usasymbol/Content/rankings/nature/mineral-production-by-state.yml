  - id: "mineral-production-in-arizona-and-texas"
    title: "Mineral Production in Arizona and Texas"
    paragraphs:
      - "Arizona ranks second at $10,400 million because it mines about 70% of the copper produced in the United States. Molybdenum, a metal often recovered alongside copper, appears in its list of leading commodities, along with cement and crushed stone."
      - "Texas is third at $10,200 million, and none of its leading commodities is a metal. Cement, lime, crushed stone, and sand and gravel go into highways, foundations, and the concrete for fast-growing cities. Oil and gas are fuels, so they are left out of the total."

  - id: "states-with-the-least-mineral-production"
    title: "States With the Least Mineral Production"
    paragraphs:
      - "Delaware reports $19 million, the smallest total of any state. It is a small, low-lying state, and its listed output is limited to magnesium compounds, construction sand and gravel, and crushed stone. North Dakota ($90 million) and Rhode Island ($100 million) come next."
      - "North Dakota and West Virginia ($260 million) look small because their biggest resources are fuels. North Dakota's oil and West Virginia's coal do not count as nonfuel minerals. Wyoming, at $579 million, has the same gap, though its soda ash and helium add value that is partly withheld."
