seo:
  title: "Mineral Production by State | Map & Rankings"
  description: "Nevada leads nonfuel mineral production at $12,600 million, ahead of Arizona at $10,400 million. Delaware is lowest at $19 million."

page:
  h1: "Mineral Production by State"

  quick_answer:
    - "Nevada produces the most minerals by value at $12,600 million, mostly from gold. Its mines supply about 64% of all U.S. gold, and copper, silver, and diatomite add more."
    - "Delaware has the lowest total at $19 million. It is a small, low-lying state whose output is limited to magnesium compounds, sand and gravel, and crushed stone."
    - "Arizona ranks second at $10,400 million because it mines about 70% of U.S. copper. Texas is third at $10,200 million, built on cement, lime, and crushed stone rather than metals."

  methodology: "USGS Mineral Commodity Summaries 2026, Table 3, preliminary 2025 value of nonfuel minerals in millions of dollars, with coal, oil, and gas excluded. States marked partial exclude values withheld to protect company data, which USGS counts as Undistributed. Share of U.S. is calculated from the state value and the U.S. total, and ranks follow the listed state values."

  sources:
    - name: "USGS, Mineral Commodity Summaries 2026"
      url: "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026.pdf"
      description: "Table 3, value of nonfuel mineral production by state in 2025 and principal commodities"
    - name: "USGS, Minerals Information, Mineral Commodity Summaries"
      url: "https://www.usgs.gov/centers/national-minerals-information-center/mineral-commodity-summaries"
      description: "Annual report on U.S. mineral production, consumption, and trade"

