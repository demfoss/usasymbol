    title: "States With the Fewest Disaster Deaths"
    paragraphs:
      - "New Hampshire has the lowest toll at 13, from the 1938 hurricane. The storm raced north so fast that it caught New England without warning, but its surge struck the coasts of Rhode Island (268), Massachusetts (133), and Connecticut (81). New Hampshire, with only a short stretch of coast, felt wind and flooding rather than the surge."
      - "Wyoming's 15 deaths all came from one fire in 1937, when the Blackwater Fire trapped firefighters near Cody. Maine's 16 came from the October 1947 fires that swept Mount Desert Island and southern Maine."
      - "Arizona's 23 deaths came in 1970, when the remnants of Tropical Storm Norma set off flash floods. Montana's 28 died in 1959, when an earthquake near Hebgen Lake brought down a mountainside onto a campground."
