sections:
  - id: "why-texas-has-the-deadliest-natural-disaster"
    title: "Why Texas Has the Deadliest Natural Disaster"
    paragraphs:
      - "Texas leads because of one night. On September 8, 1900, a hurricane drove a storm surge over Galveston Island, a sandy strip whose highest ground stood less than nine feet above the Gulf, and about 8,000 people died. The city had no seawall, and the storm arrived with almost no warning."
      - "Galveston answered by building a seawall and raising the grade of the whole city, by as much as 17 feet in places. Hurricanes still hit the Texas coast often, as the ranking of [hurricane frequency by state](/rankings/nature/hurricane-frequency-by-state) shows, but none since has come close to that toll."

  - id: "states-with-the-deadliest-natural-disasters"
    title: "States With the Deadliest Natural Disasters"
    paragraphs:
      - "California's 3,000 deaths date to 1906, when an earthquake ruptured San Francisco's water mains and left fires to burn for days. The San Andreas fault that slipped is still active, and the [earthquake frequency by state](/rankings/nature/earthquake-frequency-by-state) ranking shows how often California and Alaska shake."
      - "Florida's 2,500 died in 1928 when Lake Okeechobee spilled over its low earthen dike and drowned the farm towns around it. Pennsylvania's 2,209 died in 1889 when a dam above Johnstown failed after days of heavy rain."
      - "Wisconsin's Peshtigo fire began on October 8, 1871, the same night as the Great Chicago Fire. Louisiana (2,000) and South Carolina (1,000) both lost people to hurricanes in 1893 that drowned coastal communities, and in South Carolina most of the dead were Black residents of the low Sea Islands."
