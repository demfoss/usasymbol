page:
  h1: "Deadliest Natural Disaster by State"

  quick_answer:
    - "Texas has the deadliest natural disaster of any state, the 1900 Galveston hurricane, with about 8,000 deaths. A storm surge swamped an island that stood less than nine feet above the Gulf."
    - "New Hampshire has the lowest toll at 13, from the 1938 hurricane that hit the Rhode Island and Connecticut coasts far harder. Wyoming (15) and Maine (16) follow, both from wildfires."
    - "Illinois (739) and Washington (100) both have a heat wave at the top of the list. The 2021 heat dome edged out the 1910 Wellington avalanche, which killed 96 when a snowslide swept two trains off the tracks."

  methodology: "Deadliest single event in each state from NOAA and National Weather Service storm histories, USGS, state agencies, and historical compilations. Deaths are counted inside the state where documented, and estimates use the commonly cited figure. Season-long totals and D.C. are excluded."

