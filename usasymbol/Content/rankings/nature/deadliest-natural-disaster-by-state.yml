  - id: "deadliest-natural-disasters-by-type"
    title: "Deadliest Natural Disasters by Type"
    paragraphs:
      - "Hurricanes and tornadoes each hold the top spot in 12 states, and floods in 8. The tornado states are mostly in the South and Plains, but their tolls are far smaller than the hurricane tolls. Mississippi's 317 came in 1840, when a tornado struck Natchez and sank boats on the Mississippi River. The [tornado frequency by state](/rankings/nature/tornado-frequency-by-state) ranking shows where the next one is most likely."
      - "Heat is the record holder in four states. Chicago's July 1995 heat wave killed 739 people in Illinois and Missouri's 1980 heat wave killed 389. No state's worst disaster is a volcanic eruption or a landslide, and Utah's avalanche record (40) is smaller than the 96 killed by Washington's Wellington avalanche."
