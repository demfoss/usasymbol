faq:
  - question: "What is the deadliest natural disaster in U.S. history?"
    answer: "The 1900 Galveston hurricane in Texas. Estimates run from 6,000 to 12,000 deaths because many records washed away with the town, and 8,000 is the figure used here."

  - question: "What is the deadliest natural disaster in California?"
    answer: "The 1906 San Francisco earthquake and fire, with 3,000 deaths. The 1862 Great Flood is sometimes estimated higher, but its toll was spread across several western states and was never counted by state."

  - question: "What is the deadliest hurricane to hit Florida?"
    answer: "The 1928 Okeechobee hurricane, which killed at least 2,500 people in Florida. Lake Okeechobee overflowed and drowned the farm towns around it, many of the victims migrant farm workers. The toll was long listed as 1,836 before it was revised upward."

  - question: "What is the deadliest hurricane in Louisiana?"
    answer: "The 1893 Cheniere Caminada hurricane, with about 2,000 deaths, beats even Hurricane Katrina, which killed more than 1,500 people in Louisiana in 2005. The surge wiped out the fishing village of Cheniere Caminada, where about 779 people died."

  - question: "What is the deadliest tornado in Mississippi?"
    answer: "The Great Natchez Tornado of May 1840 killed 317 people. It ranks second among U.S. tornadoes by deaths, behind the 1925 Tri-State tornado, and most of its victims were aboard boats on the river."

  - question: "What is the deadliest natural disaster in Hawaii?"
    answer: "The 1946 tsunami, which killed 159 people in Hawaii. An earthquake in the Aleutian Islands sent the waves, and they struck Hilo early in the morning with no warning system in place. The disaster led to the Pacific tsunami warning system."

  - question: "What is the deadliest natural disaster in Alaska?"
    answer: "The 1964 Good Friday earthquake, with 115 deaths in Alaska. Roughly nine in ten of the deaths came from tsunamis rather than shaking, including waves set off by underwater landslides."

  - question: "Why was the 1995 Chicago heat wave so deadly?"
    answer: "The July 1995 heat wave killed 739 people in Illinois. Many victims were elderly residents living alone in homes without air conditioning, and the heat lasted about five days."

