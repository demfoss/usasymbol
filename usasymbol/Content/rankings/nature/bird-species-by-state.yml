page:
  h1: "Bird Species by State"

  quick_answer:
    - "Bird species by state peak in California at 889 recorded species, thanks to a long Pacific coast, offshore waters, deserts, and mountains in one very large state."
    - "Hawaii has the fewest at 336, because it sits about 2,400 miles from the mainland and few land birds ever reached it. West Virginia is next lowest at 383."
    - "Arizona ranks fourth with 619 species, ahead of far larger states, since Mexican birds cross the border into its mountain canyons. New York (593) leads the Northeast."

  methodology: "Total species ever reported in each state on eBird (Cornell Lab of Ornithology), as tallied by Michael Fogleman's eBird County Maps, retrieved November 2026. Counts include rarities and established introduced species. D.C. is excluded. Tied states are ordered alphabetically."

