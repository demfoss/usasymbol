faq:
  - question: "Which state has the most bird species?"
    answer: "California, with 889 recorded species. Texas is second at 780 and Florida third at 724."

  - question: "How many bird species are in Texas?"
    answer: "Texas has 780 recorded species, second only to California. A spot between the eastern and western flyways, plus a long Gulf coast, brings in birds from both halves of the continent."

  - question: "Which state has the fewest bird species?"
    answer: "Hawaii, with 336. West Virginia is the lowest on the mainland at 383."

  - question: "Why does Arizona have so many birds?"
    answer: "Arizona records 619 species, more than much larger states like Colorado (546). Forested mountain ranges in the southeast attract Mexican birds found almost nowhere else in the country, and birders travel to canyons like Madera Canyon to see them."

  - question: "Which Northeastern state has the most bird species?"
    answer: "New York, with 593 species, tops the Northeast, ahead of Massachusetts at 572. Its Atlantic coast, Great Lakes shores, and Adirondack forests each draw different birds, and Central Park and Jamaica Bay are famous migration stops."

