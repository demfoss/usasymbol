sections:
  - id: "why-california-has-the-most-bird-species"
    title: "Why California Has the Most Bird Species"
    paragraphs:
      - "California has recorded 889 bird species. One state holds an ocean coastline, a huge Central Valley, Mojave and Sonoran desert, redwood forest, and the high Sierra Nevada, and each habitat draws its own birds. Seabirds that live far offshore, such as albatrosses and shearwaters, show up off the Farallon Islands and the Monterey coast."
      - "The Pacific Flyway, a migration route that carries millions of waterfowl and shorebirds south each autumn, runs straight through the state. Rare strays from Asia and Mexico turn up too, and more birders watch for them here than anywhere else."
  - id: "states-with-the-most-bird-species"
    title: "States With the Most Bird Species"
    paragraphs:
      - "Texas records 780 species and Florida 724. Texas covers two major flyways and the Rio Grande Valley, where Mexican birds such as the green jay reach their only U.S. foothold. Florida's peninsula pushes toward the Caribbean and catches storm-blown strays all along its [coastline](/rankings/geography/states-by-coastline-length)."
      - "Arizona ranks fourth at 619 despite its desert reputation. Mountains in its southeast, called sky islands, rise out of the desert and host Mexican species that nest almost nowhere else in the country, including a dozen or more hummingbirds."
    table:
      title: "Ten States With the Most Bird Species"
      columns:
        rank: "Rank"
