  - id: "states-with-the-fewest-bird-species"
    title: "States With the Fewest Bird Species"
    paragraphs:
      - "Hawaii has recorded 336 species, the fewest of any state. The islands lie about 2,400 miles from the mainland, so few land birds ever arrived, and those that did evolved into forms found nowhere else, such as the Hawaiian honeycreepers. Many of the islands' [endangered species](/rankings/nature/endangered-species-by-state) are birds."
      - "West Virginia (383) and Vermont (402) are landlocked, small, and mostly forested, with no coast to attract seabirds or shorebirds. Kentucky (418) and North Dakota (421) round out the bottom five."
