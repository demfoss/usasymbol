  description: "Hawaii has 40.55 state-government FTEs per 1,000 residents, the most of any state. Florida has the fewest at 7.93."
page:
  h1: "State Government Employees Per Capita"
  quick_answer:
    - "State government employees per capita are highest in Hawaii at 40.55 full-time-equivalent workers per 1,000 residents. Hawaii's statewide government performs functions often handled locally elsewhere."
    - "Florida has the fewest at 7.93 per 1,000 residents. Its unusually large population spreads the state workforce across a much bigger denominator."
    - "Alaska ranks second at 34.48 per 1,000. A small, widely dispersed population requires state services across enormous distances and many remote communities."
  methodology: "Census 2025 ASPEP state-government FTE employment for March is divided by Census July 1, 2025 resident population estimates. Local and federal employees are excluded."
