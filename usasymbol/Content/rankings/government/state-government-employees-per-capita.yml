faq:
  - { question: "Which state has the most state employees per capita?", answer: "Hawaii has 40.55 state-government FTEs per 1,000 residents. Its government centralizes functions that are local responsibilities in many other states." }
  - { question: "Which state has the fewest state employees per capita?", answer: "Florida has 7.93 state-government FTEs per 1,000 residents. The rate uses its population of 23,462,518 as the denominator." }
  - { question: "How many state employees per capita does Alaska have?", answer: "Alaska has 34.48 FTEs per 1,000 residents and ranks second. State agencies must reach scattered communities across the country's largest land area." }
  - { question: "Are local government workers included?", answer: "No. Hawaii's 58,108 FTE count covers state government only. County, municipal, federal, and private workers are excluded." }
  - { question: "What does full-time-equivalent employment mean?", answer: "FTE employment converts full-time and part-time work into a comparable staffing measure. Delaware has 26,863 FTEs even though its separate headcount includes both full-time and part-time employees." }
