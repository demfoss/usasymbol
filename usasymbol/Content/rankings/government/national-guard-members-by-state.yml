sections:
- id: states-with-most-guard-members
  title: States With Most Guard Members
  paragraphs:
  - Texas leads with 21,698 members, including 18,561 in the Army Guard. The state's large force includes units built for aviation, logistics, engineering, and disaster response across more territory than any other contiguous state.
  - California follows at 17,963 and New York has 17,813. Those totals sit beside large active-duty and reserve communities covered in [military bases by state](/rankings/government/military-bases-by-state).
