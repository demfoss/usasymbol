faq:
- question: Which state has the most National Guard members?
  answer: Texas has the most with 21,698 members. Its Army Guard alone has 18,561 soldiers, larger than the combined Guard total of every other state.
- question: How many National Guard members are in California?
  answer: California has 17,963 National Guard members. That total includes 13,289 Army Guard soldiers and 4,674 Air Guard airmen.
- question: How many National Guard members are in New York?
  answer: New York has 17,813 members, ranking third. Its 5,871 Air Guard members form the largest state Air Guard component in the table.
- question: Which state has the fewest National Guard members?
  answer: Delaware has the fewest at 2,472. Its force includes 1,401 Army Guard members and 1,071 Air Guard members.
- question: What is the difference between the Army Guard and Air Guard?
  answer: The Army National Guard is the reserve component tied to the Army, while the Air National Guard is tied to the Air Force. Both can serve under a governor for state missions or under federal authority.
