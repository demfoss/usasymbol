page:
  h1: National Guard Members by State 2026
  quick_answer:
  - National Guard members by state totals put Texas first with 21,698 soldiers and airmen. Its force includes large Army formations and Air Guard wings spread across a vast state.
  - Delaware has the fewest National Guard members at 2,472. Its compact force still includes both Army and Air components.
  - New York ranks third overall with 17,813 members and has the largest Air National Guard component at 5,871.
  methodology: Defense Manpower Data Center duty-location counts as of August 31, 2026. National Guard totals combine Army National Guard and Air National Guard personnel in the 50 states.
