- id: why-texas-has-most-guard-members
  title: Why Texas Has Most Guard Members
  paragraphs:
  - Texas supports 18,561 Army Guard members and 3,137 Air Guard members. Its population, immense training space, Gulf Coast disaster mission, and long international border create demand for many kinds of units under one state command.
  - Delaware's 2,472 members form the smallest state total. Delaware is the second-smallest state by land area, so its Guard organization has fewer separate units and facilities than the sprawling Texas system.
