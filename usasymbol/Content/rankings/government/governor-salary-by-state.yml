faq:
  - question: "Which governor is paid the most?"
    answer: "The governor of New York, at $250,000 a year. Pennsylvania and California follow at $245,760 and $242,295."

  - question: "Which governor is paid the least?"
    answer: "The governor of Maine, at $70,000 a year, unchanged since 1987. Arizona is next lowest at $95,000."

  - question: "How much does the governor of Texas make?"
    answer: "$153,750 a year, close to the middle of the list. The Texas governor also lives in the Governor's Mansion in Austin, built in 1856."

  - question: "How much does the governor of California make?"
    answer: "$242,295 a year, third highest. A state citizens commission sets the pay of California's elected officials."

  - question: "How much does the governor of Florida make?"
    answer: "$141,400 a year, below the national average of $167,128."

  - question: "What is the average governor salary?"
    answer: "$167,128 a year across all 50 states. Eleven governors earn $200,000 or more, and seven earn less than $111,000."

  - question: "Do governors get paid more than members of their legislature?"
    answer: "Almost always. In New Hampshire, the gap is extreme, since House members earn $100 a year, as the [state legislature size by state](/rankings/government/state-legislature-size-by-state) page explains."

