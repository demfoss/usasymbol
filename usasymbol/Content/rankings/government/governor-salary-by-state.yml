page:
  h1: "Governor Salary by State"

  quick_answer:
    - "Governor salary by state is highest in New York at $250,000 a year, set by a state pay commission. Pennsylvania ($245,760) and California ($242,295) follow."
    - "Maine pays its governor the least, $70,000, a figure lawmakers set in 1987 and never raised. The governor also gets the Blaine House, the official residence in Augusta."
    - "Indiana made the biggest jump in recent years. Its governor now earns $220,418 because the salary was tied to a state Supreme Court justice's pay in 2025."

  methodology: "Annual salaries set by law for each governor in 2025, as reported by Business Insider (November 2025), with Indiana and Vermont checked against state sources. Some governors decline all or part of the salary."

  sources:
