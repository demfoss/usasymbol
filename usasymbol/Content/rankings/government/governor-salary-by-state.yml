sections:
  - id: "highest-paid-governors"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Paid Governors"
    paragraphs:
      - "New York pays its governor $250,000, the most of any state. A state compensation commission raised the salary to that level in 2021, putting it well above most other statewide officials."
      - "Pennsylvania ranks second at $245,760, and its pay rises automatically with the cost of living, reaching $253,870 in January 2026. Eleven states now pay their governor $200,000 or more, though all fall far short of the $400,000 paid to the president."
    table:
      columns:
        state: "State"
        salary: "Annual Salary"
      rows:
        - state: "New York"
          salary: "$250,000"
        - state: "Pennsylvania"
          salary: "$245,760"
        - state: "California"
          salary: "$242,295"
        - state: "Vermont"
          salary: "$234,379"
        - state: "Connecticut"
          salary: "$226,711"
        - state: "Massachusetts"
          salary: "$222,185"
        - state: "Indiana"
          salary: "$220,418"
        - state: "Washington"
          salary: "$218,744"
        - state: "Illinois"
          salary: "$205,700"
        - state: "Tennessee"
          salary: "$204,336"

  - id: "why-maine-has-the-lowest-governor-salary"
    icon: "fa-solid fa-house"
    title: "Why Maine Pays Its Governor the Least"
    paragraphs:
      - "Maine pays its governor $70,000, the lowest of any state. The salary is written into state law, and lawmakers last raised it in 1987, so inflation has steadily shrunk its value."
      - "Arizona ($95,000), Oregon ($98,600), Nebraska ($105,000), and South Carolina ($106,078) complete the bottom five."
    table:
      columns:
        state: "State"
        salary: "Annual Salary"
      rows:
        - state: "Maine"
          salary: "$70,000"
        - state: "Arizona"
          salary: "$95,000"
        - state: "Oregon"
          salary: "$98,600"
        - state: "Nebraska"
          salary: "$105,000"
        - state: "South Carolina"
          salary: "$106,078"

  - id: "governors-who-decline-their-salary"
    icon: "fa-solid fa-hand-holding-dollar"
    title: "Governors Who Decline Their Salary"
    paragraphs:
      - "Connecticut's Ned Lamont and Illinois's JB Pritzker, both wealthy before taking office, do not accept their salaries of $226,711 and $205,700."
      - "Minnesota's Tim Walz takes $127,629, well below the $174,775 set for the office."

  - id: "indiana-governor-salary-increase"
    icon: "fa-solid fa-scale-balanced"
    title: "Indiana Governor Salary Increase"
    paragraphs:
      - "Indiana now pays its governor $220,418, seventh in the country. A law passed in 2023 tied the salary to a state Supreme Court justice's pay starting January 1, 2025, a jump of roughly two thirds."
      - "Mike Braun, who took office in January 2025, was the first governor paid under the new rule. Pay for statewide officials is one more number that changes at the state line, like [electoral votes by state](/rankings/government/electoral-votes-by-state)."

