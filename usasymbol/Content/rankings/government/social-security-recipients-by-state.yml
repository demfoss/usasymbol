page:
  h1: "Social Security Recipients by State"
  quick_answer:
    - "Social Security recipients make up 27.1% of West Virginia's population, the highest share of any state. An older population and a long industrial disability legacy help explain the result."
    - "Utah has the lowest recipient share at 13.5%. Its comparatively young population leaves a smaller portion of residents at retirement age."
    - "Maine ranks second at 26.7% and Vermont ranks third at 25.4%. Each has one of the country's oldest age profiles."
  methodology: "Rates use SSA December 2024 OASDI beneficiary counts as a share of each state's population. Washington, D.C. and U.S. territories are excluded."
