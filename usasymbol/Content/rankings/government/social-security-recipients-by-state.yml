faq:
  - question: "Which state has the most Social Security recipients?"
    answer: "West Virginia has the highest recipient share at 27.1%. Its older population and industrial disability history both contribute to the large share."
  - question: "Which state has the fewest Social Security recipients?"
    answer: "Utah has the lowest share at 13.5%. A comparatively young population means fewer residents are old enough for retirement benefits."
  - question: "What percentage of Maine receives Social Security?"
    answer: "Maine's recipient rate is 26.7%, second only to West Virginia. Maine's large older population puts it near the top of many age-related measures."
  - question: "What percentage of Texas receives Social Security?"
    answer: "Texas has a recipient rate of 15.3%, the second-lowest share among the states. A relatively young and fast-growing population keeps the percentage low."
  - question: "Does Social Security include disability benefits?"
    answer: "Yes. These figures include retired workers, disabled workers, survivors, spouses, and eligible children receiving OASDI benefits."

