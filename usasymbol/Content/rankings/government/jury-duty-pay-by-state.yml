faq:
  - question: "Which state pays the most for jury duty?"
    answer: "New York pays $72 a day, the highest jury duty rate in the country. Arkansas, Colorado, Connecticut, Massachusetts, and North Dakota tie for second at $50 a day."

  - question: "Which state pays the least for jury duty?"
    answer: "New Jersey pays $5 a day for the first three days of service. Its rate rises to $40 a day starting on day four, so the low figure applies only to short trials."

  - question: "How much does jury duty pay in Texas?"
    answer: "Texas pays $6 for the first day of service and $40 a day for every day after that, under Texas Government Code Section 61.001."

  - question: "How much does jury duty pay in California?"
    answer: "California does not pay for the first day of jury service. Starting on day two, jurors are paid $15 a day."

  - question: "What is the average jury duty pay by state?"
    answer: "Daily rates on this list range from $5 in New Jersey to $72 in New York. Ten states, the largest cluster, pay a flat $10 a day, including Alabama, Idaho, Kansas, Ohio, and Washington."

  - question: "Do jury duty rates increase for longer trials?"
    answer: "Several states raise the rate after the first few days. Texas rises from $6 to $40 after day one, New Jersey rises from $5 to $40 after day three, and Illinois rises from $25 to $50 after day one."

