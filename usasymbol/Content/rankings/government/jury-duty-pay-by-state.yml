page:
  h1: "Jury Duty Pay by State"

  quick_answer:
    - "New York pays jurors $72 a day, the highest rate of any state. Arkansas, Colorado, Connecticut, Massachusetts, and North Dakota follow at $50 a day."
    - "New Jersey pays the least to start, $5 a day for the first three days, though that rate rises to $40 a day after day three. Missouri and Texas both pay $6 a day."
    - "Ten states, including Idaho, Kansas, Ohio, and Washington, pay a flat $10 a day. Pennsylvania pays $9, the second-lowest flat rate in the country."

  methodology: "Daily rates are the base statutory juror fee listed by state, drawn from published state jury-pay guides and cross-checked against state statutes (Texas Gov't Code 61.001, Cal. Civ. Proc. Code 215, N.J.S.A. 22A:1-1.1). Rates reflect the standard court-paid fee before any tiered increase for longer trials."

  sources:
    - name: "JuryDutyPayGuide.Com"
      url: "https://www.jurydutypayguide.com/"
      description: "Compiled state-by-state juror pay rates and statutory citations"
    - name: "Texas Government Code Section 61.001"
      url: "https://statutes.capitol.texas.gov/Docs/GV/htm/GV.61.htm"
      description: "Texas juror pay statute setting the two-tier daily fee"
    - name: "California Code of Civil Procedure Section 215"
      url: "https://leginfo.legislature.ca.gov/"
      description: "California juror fee statute"
    - name: "Mississippi Code Section 25-7-61"
      url: "https://law.justia.com/codes/mississippi/title-25/chapter-7/section-25-7-61/"
      description: "Mississippi juror fee statute and county pay range"

