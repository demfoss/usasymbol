sections:
  - id: why-california-has-the-most-federal-employees
    icon: "fa-solid fa-landmark-flag"
    title: "Why California Has the Most Federal Employees"
    paragraphs:
      - "California leads with 150,679 federal civilian employees. It has the largest population of any state, so the federal government needs more staff there to run Social Security offices, veterans hospitals and tax centers. The Navy in San Diego, the Marine Corps at Camp Pendleton and a large share of the nation's national parks and forests add thousands more."
      - "Texas ranks fourth at 130,686 and Florida fifth at 95,167. Both pair big [populations](/rankings/demographics/states-by-population) with heavy military activity, and the Johnson Space Center near Houston makes NASA a major employer in Texas. Many of the sites behind these numbers appear in the [military bases by state](/rankings/government/military-bases-by-state) ranking."
