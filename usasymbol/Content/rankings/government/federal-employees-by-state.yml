  description: "California has the most federal civilian employees at 150,679, ahead of Virginia and Maryland. Vermont has the fewest at 3,368."
page:
  h1: "Federal Employees by State"
  quick_answer:
    - "California has the most federal civilian employees at 150,679, a reflection of the largest population of any state, major Navy and Marine Corps bases and vast federal lands."
    - "Virginia and Maryland rank second and third at 147,358 and 144,497, because both wrap around Washington, D.C., where agencies spread their offices across the suburbs."
    - "Vermont has the fewest at 3,368, followed by Delaware at 3,998. Small states without a large military base or an agency headquarters carry little federal payroll."
  methodology: "On-board federal civilian employees by duty station at the end of September 2024, from Office of Personnel Management FedScope data as published by the Congressional Research Service. The U.S. Postal Service, most legislative and judicial staff and employees with withheld locations are not counted. The District of Columbia (162,489) is not a state and is excluded."
  sources:
