  - id: maryland-and-virginia-federal-workers
    icon: "fa-solid fa-building-columns"
    title: "Maryland and Virginia Federal Workers"
    paragraphs:
      - "Virginia has 147,358 federal civilian employees, far more than its population would suggest. The Pentagon sits in Arlington, Naval Station Norfolk is the largest naval base in the world, and the Patent and Trademark Office is in Alexandria."
      - "Maryland reaches 144,497 because so many agencies are headquartered just outside the capital. The National Institutes of Health is in Bethesda, the Food and Drug Administration in Silver Spring, the Social Security Administration in Woodlawn and the Census Bureau in Suitland."
  - id: federal-jobs-in-military-and-space-states
    icon: "fa-solid fa-jet-fighter"
    title: "Federal Jobs in Military and Space States"
    paragraphs:
      - "Oklahoma has 42,212 federal civilian employees, more than Michigan at 29,822 despite having far fewer residents. Tinker Air Force Base near Oklahoma City is one of the biggest aircraft maintenance depots in the country, and Fort Sill trains the Army's artillery."
      - "Alabama at 41,319 owes much of its total to Redstone Arsenal and NASA's Marshall Space Flight Center in Huntsville. Colorado at 41,167 has the Air Force Academy and Fort Carson. Hawaii ranks 23rd at 24,804, a large number for an island state, because Pearl Harbor anchors the Navy's Pacific operations."
  - id: states-with-the-fewest-federal-employees
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "States With the Fewest Federal Employees"
    paragraphs:
      - "Vermont has 3,368 federal civilian employees and Delaware has 3,998. Both are small states without a large base or agency headquarters, and Dover Air Force Base is Delaware's main federal workplace."
      - "New Hampshire at 5,208 shows how a state line can hide a big employer. Portsmouth Naval Shipyard, known by the city's name, actually sits on an island in Kittery, Maine, so its jobs count toward Maine's 12,717. North Dakota at 5,736 relies on two Air Force bases, in Minot and Grand Forks."
    table:
