faq:
  - question: "Which state has the most federal employees?"
    answer: "California, with 150,679 federal civilian employees. Virginia has 147,358 and Maryland has 144,497."
  - question: "Which state has the fewest federal employees?"
    answer: "Vermont, with 3,368. Delaware has 3,998 and New Hampshire has 5,208."
  - question: "How many federal employees work in Texas?"
    answer: "Texas has 130,686, the fourth-highest total. Military bases such as Fort Hood, the Johnson Space Center and many veterans hospitals account for much of it."
  - question: "How many federal employees work in Florida?"
    answer: "Florida has 95,167, ranking fifth. Naval stations in Jacksonville and Pensacola, MacDill Air Force Base in Tampa and Kennedy Space Center are among the big federal workplaces."
  - question: "How many federal employees work in Alaska?"
    answer: "Alaska has 11,658, ranking 38th. The federal government manages most of the land in the state, so park, forest and land agencies share the payroll with bases such as Fort Wainwright."
  - question: "Why does Ohio have so many federal employees?"
    answer: "Ohio has 56,068, ninth among the states. Wright-Patterson Air Force Base near Dayton is the largest single-site employer in the state, with Air Force research labs and logistics offices."
  - question: "How many federal employees work in New York?"
    answer: "New York has 54,092, ranking 10th even though it is the fourth most populous state. Its federal jobs are spread across courts, tax offices and military sites like West Point rather than clustered around a few giant campuses."
