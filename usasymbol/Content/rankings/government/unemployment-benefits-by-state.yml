faq:
  - question: "Which state has the highest unemployment benefit?"
    answer: "Massachusetts tops the country at $1,033 a week. Washington ($999) and Rhode Island ($867) rank second and third."
  - question: "Which state has the lowest unemployment benefit?"
    answer: "Mississippi's $235 maximum is the lowest in the country, less than a quarter of Massachusetts's rate. Alabama, Florida, Louisiana, and Tennessee tie for the next lowest at $275."
  - question: "How long do unemployment benefits last?"
    answer: "Most states pay benefits for 26 weeks. Montana offers the longest duration at 28 weeks, while Florida and North Carolina cap benefits at just 12 weeks, the shortest in the country."
  - question: "Is unemployment compensation taxable?"
    answer: "The federal government taxes unemployment benefits as ordinary income in every state. Fifteen states exempt benefits from state income tax, including nine with no state income tax at all and six, Alabama, California, Montana, New Jersey, Pennsylvania, and Virginia, that tax income generally but carve out an exemption for unemployment."
  - question: "Which states pay a dependent allowance for unemployment?"
    answer: "Thirteen states pay an extra weekly amount per dependent: Alaska, Connecticut, Illinois, Iowa, Maine, Maryland, Massachusetts, Michigan, New Jersey, New Mexico, Ohio, Pennsylvania, and Rhode Island. Massachusetts pays $25 per child, and Maine pays $10 per child, capped at half the weekly benefit."
  - question: "What is the maximum unemployment benefit in California?"
    answer: "California's maximum weekly unemployment benefit is $450, ranking 31st in the country. California has no waiting week before benefits start and exempts unemployment compensation from state income tax."

