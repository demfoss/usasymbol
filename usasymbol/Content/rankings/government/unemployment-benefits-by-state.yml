  quick_answer:
    - "Massachusetts has the highest maximum weekly unemployment benefit at $1,033, nearly double the national average of $532."
    - "Mississippi has the lowest maximum weekly benefit at $235. Four states, Alabama, Florida, Louisiana, and Tennessee, share the next lowest amount at $275."
    - "Duration ranges from 12 weeks in Florida and North Carolina to 28 weeks in Montana, against a national average of 24 weeks. Fifteen states exempt unemployment benefits from state income tax entirely, including California, New Jersey, and Pennsylvania."

  methodology: "Maximum weekly benefit, duration, and waiting week figures are IndeedFlex's 2026 state comparison data, current as of April 2026. Tax exemption and dependent allowance status are compiled from Kiplinger and the National Employment Law Project."

