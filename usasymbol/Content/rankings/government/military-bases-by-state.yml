- id: why-california-has-most-bases
  icon: fa-solid fa-map-location-dot
  title: Why California Has So Many Military Bases
  paragraphs:
  - California’s 40 installations combine Pacific fleet facilities with inland training grounds. Naval Base San Diego supports surface ships, while desert facilities such as Twentynine Palms provide room for ground and air exercises. Those different missions require separate sites, which helps explain California’s lead.
  - Minnesota and Vermont tie at zero because this catalog excludes National Guard and reserve sites. Minnesota’s Camp Ripley remains a military training facility, and Vermont’s Camp Ethan Allen hosts mountain warfare training. Their last-place totals describe the catalog’s boundary rather than an absence of military activity.
- id: bases-by-branch
  icon: fa-solid fa-anchor
  title: Navy Bases by State
  paragraphs:
  - California’s 16 Navy installations lead the branch count. Florida’s 11 include naval aviation facilities around Pensacola, so Navy bases need not be places where ships dock. Branch totals identify the service associated with an installation, rather than everyone working there.
  - Virginia lists 10 Navy installations, including Naval Station Norfolk. Norfolk occupies land once used for the Jamestown Exposition and now supports joint missions involving other services. A Navy designation differs from civilian policing measured in [police officers per capita](/rankings/government/police-officers-per-capita).
