sections:
- id: most-military-bases
  icon: fa-solid fa-flag-usa
  title: States With the Most Military Bases
  paragraphs:
  - Virginia lists 27 major installations, second to California’s 40. Hampton Roads provides Atlantic fleet ports, while inland and northern Virginia installations support training and the Washington area. The count concerns sites rather than residents, a different measure from [states by population](/rankings/demographics/states-by-population).
