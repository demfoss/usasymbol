page:
  h1: "Military Bases by State"

  quick_answer:
    - "Military bases by state range from 40 in California down to zero in Minnesota and Vermont. Virginia hosts 27 major installations, Florida 21, and Texas 19."
    - "California's 16 Navy bases are the largest single-branch count in any state. Virginia counts installations from all five branches, including 7 Coast Guard bases, the most in the country."
    - "Fort Bragg in North Carolina is the largest U.S. base by population, supporting about 260,000 people. White Sands Missile Range in New Mexico is the largest by area at roughly 3,200 square miles."

  methodology: "Base counts are major active-duty installations cataloged by MilBases.com, excluding National Guard and reserve sites. Personnel and spending figures come from DoD data for 2024 and fiscal year 2023."

  sources:
