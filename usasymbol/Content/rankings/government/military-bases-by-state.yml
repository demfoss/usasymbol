page:
  h1: Military Bases by State
  quick_answer:
  - Military bases by state counts put California first with 40 listed major installations. Pacific naval facilities and extensive inland training areas give the military space for ships, aircraft, and ground exercises.
  - Minnesota and Vermont each have zero bases in the major-installation count. National Guard facilities, including Camp Ripley and Camp Ethan Allen, fall outside its scope.
  - Virginia lists 27 military bases, including 10 Navy installations. Naval Station Norfolk anchors a coastal military presence around Hampton Roads.
  methodology: MilBases.com lists major active-duty installations by state and branch. Counts exclude National Guard and reserve sites. Zero means no installation in this catalog, not no military presence.
