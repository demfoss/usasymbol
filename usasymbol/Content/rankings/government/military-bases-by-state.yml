sections:
  - id: "most-military-bases"
    icon: "fa-solid fa-flag-usa"
    title: "States with the Most Military Bases"
    paragraphs:
      - "California hosts 40 major military installations, more than any other state. Virginia follows with 27, Florida has 21, and Texas rounds out the leaders with 19."
      - "Hawaii places fifth with 13 bases and counts installations from all five branches. Georgia's 12 include seven Army posts, trailing only Texas and California, which have nine each."

  - id: "bases-by-branch"
    icon: "fa-solid fa-anchor"
    title: "Military Bases by Branch"
    paragraphs:
      - "Navy bases concentrate on the coasts. California has 16, the largest single-branch count in any state, followed by Florida with 11 and Virginia with 10."
      - "Marine Corps installations appear in only ten states, led by California with 6 and North Carolina with 3. Virginia's 7 Coast Guard bases are the most in the country."

  - id: "largest-military-base"
    icon: "fa-solid fa-ranking-star"
    title: "Largest Military Base in the US"
    paragraphs:
      - "Fort Bragg in North Carolina is the largest U.S. military installation by population, supporting about 260,000 people, including some 54,000 troops. The post accounts for more than half of the state's active-duty personnel."
      - "White Sands Missile Range in New Mexico is the largest base by area, covering roughly 3,200 square miles. That footprint is about the size of Rhode Island and Delaware combined."

  - id: "personnel-by-state"
    icon: "fa-solid fa-users"
    title: "Active-Duty Military Personnel by State"
    paragraphs:
      - "California stations 162,362 active-duty troops, the most in the country. Virginia follows at 130,857, anchored by Naval Station Norfolk, the world's largest naval base, and Texas hosts 118,691."
      - "North Carolina's 100,673 troops rank fourth, with more than half stationed at Fort Bragg. Georgia completes the top five."

  - id: "defense-spending"
    icon: "fa-solid fa-sack-dollar"
    title: "Defense Spending by State"
    paragraphs:
      - "Defense contracts, payroll, and grants delivered $609.2 billion to the states in fiscal 2023, about 2.2% of U.S. GDP. Texas received the most at $71.6 billion, ahead of Virginia's $68.5 billion and California's $60.8 billion."
      - "Virginia, Hawaii, and Connecticut rank highest when spending is measured against state GDP. Florida at $32.3 billion and Maryland at $27.8 billion complete the top five for total dollars."

