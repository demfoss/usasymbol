faq:
  - question: "Which state has the most military bases?"
    answer: "California, with 40 major installations. The total breaks down to 16 Navy, 9 Army, 7 Air Force, 6 Marine Corps, and 2 Coast Guard bases."

  - question: "How many military bases are in the US?"
    answer: "MilBases.com catalogs 304 major active-duty installations across the 50 states. The count excludes National Guard, reserve, and overseas facilities, so broader Pentagon tallies run higher."

  - question: "Which states have no military bases?"
    answer: "Minnesota and Vermont. Neither state hosts a major active-duty installation from any branch, though the count does not include National Guard facilities."

  - question: "What is the largest military base in the US?"
    answer: "Fort Bragg in North Carolina is the largest by population, home to about 260,000 people. White Sands Missile Range in New Mexico covers the most area at roughly 3,200 square miles, comparable to Rhode Island and Delaware combined."

  - question: "Which state has the most Army bases?"
    answer: "Texas and California share the lead with nine Army installations each. Virginia has 8 and Georgia has 7."

  - question: "Which state has the most active-duty military personnel?"
    answer: "California, with 162,362 active-duty troops stationed in the state as of 2024. Virginia is second at 130,857, and Texas third at 118,691."

