  - id: incumbents-who-lost-primaries-and-appointed-senators
    icon: "fa-solid fa-user-clock"
    title: "Incumbents Who Lost Primaries and Appointed Senators"
    paragraphs:
      - "Louisiana's Bill Cassidy finished third in the May 16 Republican primary with about a quarter of the vote and missed the runoff. He was the first incumbent senator to lose a regularly scheduled primary since Richard Lugar of Indiana in 2012. John Cornyn lost the Texas Republican runoff to Ken Paxton and keeps his seat until January 2027."
      - "Four of the 35 seats are held by appointees. Husted and Moody were appointed in 2025, Armstrong in March 2026, and Darline Graham in July 2026 after her brother Lindsey Graham died. She went on to win the Republican runoff in August and is the first woman to represent South Carolina in the Senate."
  - id: states-without-a-senate-race-in-2026
    icon: "fa-solid fa-ban"
    title: "States Without a Senate Race in 2026"
    paragraphs:
      - "Fifteen states have no Senate race in November. They are Arizona, California, Connecticut, Hawaii, Indiana, Maryland, Missouri, Nevada, New York, North Dakota, Pennsylvania, Utah, Vermont, Washington and Wisconsin."
      - "Each state has two seats in different classes, and none of these 15 has a Class 2 seat. Their seats come up in 2028 and 2030 instead. Governors follow a separate calendar, and the [governor races of 2026](/rankings/government/governor-races-2026-by-state) cover 36 states."
