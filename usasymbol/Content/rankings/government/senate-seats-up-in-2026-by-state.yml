sections:
  - id: why-35-senate-seats-are-up-in-2026
    icon: "fa-solid fa-landmark-dome"
    title: "Why 35 Senate Seats Are Up in 2026"
    paragraphs:
      - "Senators serve six-year terms, and the Constitution splits the 100 seats into three classes so that about one third of the chamber faces voters every two years. The 2026 ballot holds the 33 Class 2 seats, most of which were last contested in 2020."
      - "Ohio and Florida are the other two. JD Vance gave up his Ohio seat to become Vice President and Marco Rubio gave up his Florida seat to become Secretary of State, and the governors appointed Jon Husted and Ashley Moody. Each appointee now has to win a special election to serve out a term that ends in January 2029. No state elects two senators this year."
  - id: senate-seats-with-no-incumbent-running
    icon: "fa-solid fa-door-open"
    title: "Senate Seats With No Incumbent Running"
    paragraphs:
      - "Eleven seats are open because the senator is not running. Ten are retiring, and Tommy Tuberville of Alabama is running for governor instead. Alan Armstrong of Oklahoma was appointed in March 2026 after Markwayne Mullin was confirmed as Homeland Security Secretary, and he is not a candidate."
      - "Four of the retirements are Democrats and seven are Republicans, counting Armstrong and Tuberville. Mitch McConnell, the longest serving Senate party leader in history, is leaving the seat he first won in 1984, and Dick Durbin is leaving after three decades in the chamber."
