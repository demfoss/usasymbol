page:
  h1: "Senate Seats Up in 2026 by State"
  quick_answer:
    - "Senate seats up in 2026 number 35, one in each of 35 states. Thirty-three are regular six-year seats and two are special elections in Ohio and Florida for the seats JD Vance and Marco Rubio left."
    - "Eleven senators are not seeking another term, seven Republicans and four Democrats. They include Mitch McConnell of Kentucky, in the Senate since 1985, and Dick Durbin of Illinois, there since 1997."
    - "Two incumbents lost renomination. Bill Cassidy of Louisiana finished third in a May primary, and John Cornyn of Texas lost a runoff to state Attorney General Ken Paxton."
  methodology: "Checked October 2026 using Wikipedia, Ballotpedia and news reports on appointments and primaries. Code 1 is an incumbent on the ballot, 2 an open seat with no incumbent running, 3 an incumbent who lost renomination. Nominees and race ratings are not listed."
