faq:
  - question: "How many Senate seats are up for election in 2026?"
    answer: "Thirty-five. Thirty-three are regular Class 2 seats and two are special elections, in Ohio and Florida. Each of the 35 states has exactly one seat on the ballot."
  - question: "Which states do not have a Senate race in 2026?"
    answer: "Arizona, California, Connecticut, Hawaii, Indiana, Maryland, Missouri, Nevada, New York, North Dakota, Pennsylvania, Utah, Vermont, Washington and Wisconsin. Their two seats belong to the other two classes and come up in 2028 and 2030."
  - question: "Why are there special elections in Ohio and Florida?"
    answer: "JD Vance resigned his Ohio seat to become Vice President, and Marco Rubio resigned his Florida seat to become Secretary of State. Governors appointed Jon Husted and Ashley Moody, and voters now choose who finishes terms ending in January 2029."
  - question: "Which senators are retiring in 2026?"
    answer: "Dick Durbin, Gary Peters, Tina Smith and Jeanne Shaheen on the Democratic side, and Joni Ernst, Mitch McConnell, Steve Daines, Thom Tillis and Cynthia Lummis on the Republican side. Tommy Tuberville is running for governor of Alabama instead, and appointed Senator Alan Armstrong of Oklahoma is not a candidate."
  - question: "Is Mitch McConnell running for reelection in 2026?"
    answer: "No. McConnell is retiring at the end of his term, which closes a Senate career in Kentucky that began in January 1985."
  - question: "Is John Cornyn still a senator?"
    answer: "Yes, until January 2027. Cornyn lost the Republican runoff for his Texas seat in May 2026 and will not be on the November ballot as a nominee, but his term does not end early."
  - question: "Is Lindsey Graham's seat up in 2026?"
    answer: "Yes. Graham won his June primary and died in July 2026, and Governor Henry McMaster appointed his sister Darline Graham to fill the seat. She won the Republican nomination in an August runoff."
