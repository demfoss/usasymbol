page:
  h1: Military Spending by State
  quick_answer:
  - Military spending by state puts Texas first at $71.6 billion. Its defense economy combines major installations, aircraft production, technology work, and a large military payroll.
  - Vermont received the least at $576.6 million. Its smaller installation footprint and defense contracting base keep the total below every other state.
  - Virginia ranks second at $68.5 billion, with Pentagon-area contracting and the Hampton Roads naval complex concentrating defense work in one state.
  methodology: Office of Local Defense Community Cooperation fiscal year 2023 totals combine DoD contract obligations, personnel payroll, and grants by state. Washington, D.C. is excluded.
