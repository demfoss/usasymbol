sections:
- id: states-with-most-military-spending
  icon: fa-solid fa-chart-column
  title: States With Most Military Spending
  paragraphs:
  - Texas received $71.6 billion, Virginia received $68.5 billion, and California received $60.8 billion. Together they combine large military payrolls with aerospace, shipbuilding, electronics, and other contract work around major installations.
  - Connecticut ranks sixth at $25.3 billion despite its smaller population. Submarine construction and aerospace manufacturing give defense contracts an unusually large place in the state's economy.
