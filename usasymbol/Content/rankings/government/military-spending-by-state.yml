faq:
- question: Which state receives the most military spending?
  answer: Texas ranks first with $71.6 billion. Its total joins contract work with payroll from a large network of installations and commands.
- question: How much military spending does Virginia receive?
  answer: Virginia receives $68.5 billion, ranking second. Hampton Roads naval facilities and federal contracting around Northern Virginia place two major defense centers in the same state.
- question: How much military spending does California receive?
  answer: California receives $60.8 billion, ranking third. Pacific bases and a wide aerospace and technology sector both contribute to that total.
- question: Which state receives the least military spending?
  answer: Vermont receives the least at $576.6 million. Wyoming is next at $599.1 million.
- question: What counts as military spending by state?
  answer: The total combines defense contract obligations performed in a state, payroll for defense personnel, and defense grants. It covers more than the operating budgets of local bases.
