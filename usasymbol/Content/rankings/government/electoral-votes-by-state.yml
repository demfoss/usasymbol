faq:
  - question: "How many electoral votes does California have?"
    answer: "California has 54 electoral votes, the most of any state. That total equals 10% of all 538 electoral votes and is 18 times larger than the 3-vote minimum held by Wyoming, Alaska, Vermont, North Dakota, South Dakota, and Delaware."

  - question: "How many electoral votes does Texas have in 2024?"
    answer: "Texas has 40 electoral votes in 2024, ranking second among all states. Texas gained 2 electoral votes after the 2020 Census reapportionment, moving from 38 votes in the 2016 and 2020 elections to 40 for 2024 and 2028."

  - question: "Which state has the fewest electoral votes?"
    answer: "Six states share the minimum of 3 electoral votes: Wyoming, Alaska, Vermont, North Dakota, South Dakota, and Delaware. Every state is guaranteed at least 3 votes regardless of population."

  - question: "How many electoral votes are needed to win the presidency?"
    answer: "270 electoral votes are required to win the presidency, a majority of the 538 total. California (54), Texas (40), and Florida (30) together hold 124 votes, 46% of the 270-vote threshold but still 146 votes short of a majority on their own."

  - question: "How many electoral votes does Florida have?"
    answer: "Florida has 30 electoral votes, third-most in the country behind California (54) and Texas (40). Florida gained 1 electoral vote after the 2020 Census, up from 29 in the 2016 and 2020 elections."

  - question: "How many electoral votes does Pennsylvania have?"
    answer: "Pennsylvania has 19 electoral votes, tied with Illinois for 5th. Pennsylvania lost 1 electoral vote after the 2020 Census, dropping from 20 in the 2016 and 2020 cycles to 19 for 2024 and 2028."

  - question: "What is the total number of electoral votes in the United States?"
    answer: "538 electoral votes exist in the Electoral College. The 50 states control 535 of those votes; the remaining 3 belong to Washington, D.C., under the 23rd Amendment. A majority of 270 is required to elect a president."

