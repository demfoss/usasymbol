page:
  h1: "State Capitals by Population"
  quick_answer:
    - "State capitals by population begin with Phoenix at 1,608,139 residents. Arizona moved its territorial capital there in 1889, and Phoenix later became the nation's fifth-largest city."
    - "Montpelier is the smallest state capital with 8,074 residents. Vermont chose the centrally located town in 1805 after years of moving legislative sessions among communities."
    - "Nine capitals had more than 500,000 residents in 2020. Phoenix, Austin, Columbus and Indianapolis each exceeded 800,000 within their city boundaries."
  methodology: "City-proper populations are from the U.S. Census Bureau 2020 Decennial Census, counted April 1, 2020. Consolidated-city and Census-designated place boundaries are used where applicable."
  sources:
    - name: "U.S. Census Bureau. 2020 Decennial Census Redistricting Data"
      url: "https://www.census.gov/programs-surveys/decennial-census/about/rdo/summary-files.html"
