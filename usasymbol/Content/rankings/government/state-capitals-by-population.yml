sections:
  - id: largest-state-capitals-by-population
    icon: "fa-solid fa-city"
    title: "Largest State Capitals by Population"
    paragraphs:
      - "Phoenix ranks first with 1,608,139 residents. Arizona's government moved there from Prescott in 1889, when the railroad and irrigated Salt River Valley were helping the settlement become the territory's economic center."
      - "Austin ranks second at 961,855, followed by Columbus at 905,748 and Indianapolis at 887,642. Columbus and Indianapolis were deliberately selected as centrally placed capitals during the nineteenth century, then grew into their states' largest cities."
