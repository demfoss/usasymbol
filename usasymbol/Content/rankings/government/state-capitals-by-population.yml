    icon: "fa-solid fa-building-columns"
    title: "Smallest State Capitals by Population"
    paragraphs:
      - "Montpelier ranks last with 8,074 residents. Vermont lawmakers selected it in 1805 partly for its central location, and the compact city remains smaller than many American college campuses."
      - "Pierre has 14,091 residents and Augusta has 18,899. Small capitals often reflect compromise rather than commercial dominance. Pierre defeated larger South Dakota contenders after statehood, while Augusta replaced coastal Portland as Maine's permanent seat of government."
