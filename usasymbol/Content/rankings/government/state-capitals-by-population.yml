faq:
  - question: "What is the largest state capital by population?"
    answer: "Phoenix, Arizona, with 1,608,139 residents in the 2020 Census. It is the only state capital above 1 million people."
  - question: "What is the smallest state capital by population?"
    answer: "Montpelier, Vermont, with 8,074 residents. It is the only state capital below 10,000 people."
  - question: "What is the population of Austin, Texas?"
    answer: "Austin had 961,855 residents in the 2020 Census, making it the second-largest state capital after Phoenix."
  - question: "Where does Sacramento rank among state capitals?"
    answer: "Sacramento ranks ninth with 524,943 residents. It is one of nine state capitals above 500,000."
  - question: "Why is Montpelier the smallest state capital?"
    answer: "Vermont chose Montpelier for its central location rather than its size. The city never developed into the state's main commercial center, a role held by Burlington."
  - question: "How many state capitals have more than 500,000 people?"
    answer: "Nine. They are Phoenix, Austin, Columbus, Indianapolis, Denver, Nashville, Oklahoma City, Boston and Sacramento."

