sections:
  - id: republican-and-democratic-trifecta-states
    icon: "fa-solid fa-landmark"
    title: "Republican and Democratic Trifecta States"
    paragraphs:
      - "Republicans hold the governorship and both chambers in 23 states, a group that runs from Texas, Florida and Ohio to Wyoming and the Dakotas. Democrats hold 16, mostly along the Pacific Coast and the Northeast, with Colorado, New Mexico, Illinois and Virginia as the inland exceptions."
      - "Virginia moved most recently. Democrats already held the House of Delegates and the Senate, and Virginia voters elected a Democratic governor in November 2025, so the party gained full control in January 2026. The state had a Democratic trifecta before, from 2020 to 2022. For the red and blue picture at the presidential level, see [red and blue states](/rankings/government/red-and-blue-states)."
  - id: why-utah-has-the-longest-trifecta
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Utah Has the Longest Trifecta"
    paragraphs:
      - "Utah has been a Republican trifecta since 1985, when Norman Bangerter took office as governor. Every governor since has been a Republican, and the party has kept large majorities in both chambers of the Legislature, so the governor's office and both chambers have stayed with one party for four decades."
      - "Idaho, North Dakota and South Dakota have held theirs since 1995, and Nebraska since 1999. Delaware has the longest Democratic trifecta, which began in 2009."
    table:
      columns:
        state: "State"
        party: "Party"
        since: "Trifecta Since"
      rows:
        - { state: "Utah", party: "Republican", since: "1985" }
        - { state: "Idaho", party: "Republican", since: "1995" }
        - { state: "North Dakota", party: "Republican", since: "1995" }
