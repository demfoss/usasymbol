  - id: states-with-divided-government
    icon: "fa-solid fa-code-compare"
    title: "States With Divided Government"
    paragraphs:
      - "Eleven states split control, and the splits often run against the state's presidential lean. Kansas and Kentucky, both Republican by large margins in the last presidential race, have Democratic governors facing Republican legislatures, while Vermont, which leans heavily Democratic, has a Republican governor facing Democratic chambers. A governor is chosen by one statewide vote, and legislators are chosen district by district, so the two can point in different directions."
      - "Three states divide inside the legislature itself. Michigan has a Republican House and a Democratic Senate, Pennsylvania the reverse, and Minnesota's House has stood tied at 67 to 67 since the 2024 election. Alaska counts as divided because bipartisan coalitions, not a single party, run its chambers."
  - id: trifecta-counts-over-time
    icon: "fa-solid fa-chart-line"
    title: "Trifecta Counts Over Time"
    paragraphs:
      - "Single party control has become far more common. The 39 trifectas of 2023 were roughly double the 19 of 1992, the first year in the record. Democrats peaked at 18 in 1993, and Republicans peaked at 26 in 2018."
      - "Democrats lost the Michigan and Minnesota trifectas in the 2024 elections, which left them with 15 heading into 2025. Virginia brought the count back to 16. Single party rule also shapes policy on [ballot initiatives](/rankings/law/ballot-initiative-states) and [redistricting commissions](/rankings/law/redistricting-commission-states), since a trifecta can change those rules without the other party."
    table:
