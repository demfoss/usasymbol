  title: "Trifecta States by Party Control | Map & State List"
  description: "Republicans hold full control in 23 states and Democrats in 16. Eleven states split power between parties, and Utah has held a trifecta longest."
page:
  h1: "Trifecta States by Party Control"
  quick_answer:
    - "Trifecta states are those where one party holds the governorship and both legislative chambers. Republicans hold 23 of them, with Texas, Florida and Ohio the largest, and Democrats hold 16, led by California and New York."
    - "Utah has the longest running trifecta. Republicans have held its governor's office and both chambers since 1985, and Delaware has the longest Democratic one, dating to 2009."
    - "Virginia is the newest Democratic trifecta. Voters elected a Democratic governor in November 2025, and the party already held both chambers of the General Assembly, so full control began in January 2026."
  methodology: "Checked October 2026 using Ballotpedia and Wikipedia's party strength table. Code 3 is a Republican trifecta, 2 divided government, 1 a Democratic trifecta. Nebraska's nonpartisan legislature is counted as Republican, as Ballotpedia does, and Alaska's coalition chambers as divided."
