faq:
  - question: "How many states have a Republican trifecta?"
    answer: "Twenty-three states have a Republican trifecta in October 2026. They are Alabama, Arkansas, Florida, Georgia, Idaho, Indiana, Iowa, Louisiana, Mississippi, Missouri, Montana, Nebraska, New Hampshire, North Dakota, Ohio, Oklahoma, South Carolina, South Dakota, Tennessee, Texas, Utah, West Virginia and Wyoming."
  - question: "Which states have a Democratic trifecta?"
    answer: "Sixteen states do. They are California, Colorado, Connecticut, Delaware, Hawaii, Illinois, Maine, Maryland, Massachusetts, New Jersey, New Mexico, New York, Oregon, Rhode Island, Virginia and Washington."
  - question: "What is a state government trifecta?"
    answer: "A trifecta exists when one party holds the governor's office and a majority in both chambers of the state legislature. The party can then pass a bill or a budget without a single vote from the other side."
  - question: "Which state has had a trifecta the longest?"
    answer: "Utah. Republicans have held its governorship and both legislative chambers since 1985. Delaware has the longest Democratic trifecta, which started in 2009."
  - question: "Is Nebraska a Republican trifecta?"
    answer: "Nebraska is counted as one. Its single chamber Legislature is officially nonpartisan, but the governor is a Republican and Republicans hold the large majority of the seats."
  - question: "Which states have divided government?"
    answer: "Alaska, Arizona, Kansas, Kentucky, Michigan, Minnesota, Nevada, North Carolina, Pennsylvania, Vermont and Wisconsin. Seven of them pair a governor from one party with a legislature controlled by the other. Michigan, Pennsylvania and Minnesota have chambers that disagree or are tied, and Alaska is run by bipartisan coalitions."
  - question: "Is Virginia a Democratic trifecta in 2026?"
    answer: "Yes. A Democratic governor took office in January 2026 after the November 2025 election, and Democrats already controlled the House of Delegates and the Senate. Virginia last had a Democratic trifecta from 2020 to 2022."
  - question: "Why does Vermont have a Republican governor?"
    answer: "Vermont elects its governor every two years in a statewide vote that is separate from the legislative races. Phil Scott, a Republican, has held the office since 2017 while Democrats keep large majorities in the Legislature."
