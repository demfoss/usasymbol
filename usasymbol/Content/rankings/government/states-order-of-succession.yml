sections:
  - id: "first-state"
    icon: "fa-solid fa-flag-usa"
    title: "Delaware: The First State"
    paragraphs:
      - "Delaware earned its famous nickname 'The First State' by being the first to ratify the U.S. Constitution on December 7, 1787. The vote was unanimous - all 30 delegates at the Delaware Convention voted in favor of ratification. This swift action came just five days after the Constitution was officially opened for ratification by the states. Delaware's delegates recognized that joining a stronger federal union would benefit their small state economically and provide better protection."
      - "The ratification happened at the Golden Fleece Tavern in Dover, Delaware's capital. Delaware's quick action was strategic - as a small state, it wanted to ensure equal representation in the Senate regardless of population size. The Constitution guaranteed each state two senators, which protected Delaware's voice in the new government. Pennsylvania followed just five days later on December 12, 1787, and New Jersey ratified on December 18, making these three states the founding core of the new nation."
      - "Delaware still carries the title on its license plates. For the smallest state by land area, the number 1 has proven remarkably durable — 237 years of civic identity built on a single vote that took five days to cast."

  - id: "original-thirteen"
    icon: "fa-solid fa-scroll"
    title: "Original 13 States in Order of Ratification"
    paragraphs:
      - "The first 13 states were not admitted — they were already there. After winning independence, these former colonies faced a harder problem: how to govern themselves as a single nation. The Articles of Confederation failed within a decade. The federal government couldn't tax, couldn't raise an army, couldn't regulate trade between states. In 1787, delegates from 12 states (Rhode Island refused to attend) met in Philadelphia and drafted an entirely new Constitution. Nine states had to ratify it for it to take effect."
      - "Between December 1787 and June 1788, nine states ratified the Constitution, officially establishing the new government. Virginia and New York - two of the largest and most important states - ratified in June 1788, ensuring the Constitution's success. However, North Carolina didn't ratify until November 1789, and Rhode Island held out until May 29, 1790, becoming the last of the original 13 states to join the Union. Rhode Island's reluctance earned it the nickname 'Rogue Island' among supporters of the Constitution."

  - id: "westward-expansion"
    icon: "fa-solid fa-mountain"
    title: "From 13 to 50 States: 168 Years of Territorial Expansion"
    paragraphs:
      - "Vermont became the 14th state in 1791, marking the beginning of American territorial expansion. Vermont had declared itself an independent republic in 1777 and operated as a sovereign nation for 14 years before joining the Union. Kentucky followed in 1792, carved from Virginia's western territory. Tennessee joined in 1796 from North Carolina's western lands. This pattern of creating new states from existing state territories and federal lands continued throughout the 19th century."
      - "The Louisiana Purchase of 1803 doubled America's size and eventually created 15 new states from the acquired territory. The Mexican-American War (1846-1848) added the Southwest, leading to California, Nevada, Utah, Arizona, and New Mexico joining the Union. The Oregon Treaty with Britain in 1846 secured the Pacific Northwest, resulting in Oregon, Washington, and Idaho becoming states. Each territorial acquisition sparked debates about slavery, states' rights, and the balance of power between free and slave states."
      - "The 1889-1890 period saw the fastest run of statehood in U.S. history — six states joined in just 14 months: North Dakota, South Dakota, Montana, Washington, Idaho, and Wyoming (numbers 39 through 44 in the order of statehood). This 'Omnibus States' era reflected political maneuvering by Republicans to add western states that would support their party. Oklahoma joined in 1907 as #46, created from Indian Territory. The final continental states, New Mexico and Arizona, entered in 1912 as numbers 47 and 48. A 47-year gap followed before Alaska (#49) and Hawaii (#50) became states in 1959, completing the full list of 50 states in order."

  - id: "admission-requirements"
    icon: "fa-solid fa-gavel"
    title: "How Territories Became States: The Admission Process Explained"
    paragraphs:
      - "The U.S. Constitution grants Congress the power to admit new states to the Union under Article IV, Section 3. However, the Constitution doesn't specify exact requirements for statehood. Over time, Congress established informal criteria that territories typically must meet: a sufficient population (usually 60,000 residents), a republican form of government, a state constitution approved by residents, and support from Congress and the President."
      - "The admission process usually begins when a territory's residents petition Congress for statehood. The territory drafts a state constitution and submits it to Congress. Both the House of Representatives and Senate must pass an enabling act or joint resolution admitting the territory as a state. The President then signs the legislation, and the territory officially becomes a state. This process has varied considerably throughout history - some states were admitted quickly while others waited decades."
      - "Several current U.S. territories could potentially become states in the future, including Puerto Rico, which has held multiple referendums on statehood. Washington, D.C. also seeks statehood, though this faces unique constitutional challenges. The last successful state admission was Hawaii in 1959, over 65 years ago. Any new state would become #51 and require a new flag design with 51 stars, continuing the tradition of updating the flag whenever states are added."

  - id: "civil-war-impact"
    icon: "fa-solid fa-landmark"
    title: "The Civil War's Impact on State Admission"
    paragraphs:
      - "The issue of slavery dominated state admissions from 1820 to 1865. The Missouri Compromise of 1820 attempted to maintain balance by admitting states in pairs - one free state and one slave state. Maine entered as a free state while Missouri entered as a slave state in 1820-1821. This delicate balance shaped admission politics for 40 years. Every new territory sparked fierce debates about whether slavery would be permitted."
      - "West Virginia became the only state created by seceding from an existing state during wartime. When Virginia seceded from the Union in 1861, the western counties refused to leave and formed their own government. Congress admitted West Virginia as the 35th state on June 20, 1863, during the height of the Civil War. This controversial admission was approved because the western counties supported the Union and opposed slavery, though Lincoln initially had reservations about the constitutionality of splitting Virginia."
      - "After the Civil War, Congress refused to restore the former Confederate states' representation until they ratified the 13th Amendment and met Reconstruction requirements — military rule, new state constitutions, guaranteed civil rights. The process took years. Once the slavery question was finally settled as a legislative matter, the statehood debate shifted west, where the remaining territories waited for Congress to stop fighting the last war and start admitting the next ones."

faq:
  - question: "What was the first state in the United States?"
    answer: "Delaware was the first state to join the United States by ratifying the U.S. Constitution on December 7, 1787. All 30 delegates at Delaware's convention voted unanimously in favor of ratification, earning Delaware its nickname 'The First State.'"
  
  - question: "What was the last state to join the United States?"
    answer: "Hawaii was the last state admitted to the Union on August 21, 1959, becoming the 50th state. Alaska had joined earlier that same year on January 3, 1959, as the 49th state. These were the first new states admitted in 47 years."
  
  - question: "What are the original 13 states in order?"
    answer: "The original 13 states in order of ratification are: Delaware, Pennsylvania, New Jersey, Georgia, Connecticut, Massachusetts, Maryland, South Carolina, New Hampshire, Virginia, New York, North Carolina, and Rhode Island. Delaware ratified first on December 7, 1787, while Rhode Island ratified last on May 29, 1790."
  
  - question: "How many states were there in 1800?"
    answer: "There were 16 states in 1800. The original 13 colonies had all ratified the Constitution by 1790, and three additional states had been admitted: Vermont (1791), Kentucky (1792), and Tennessee (1796). Ohio would become the 17th state in 1803."
  
  - question: "Which state was admitted to the Union first after the original 13?"
    answer: "Vermont was the first state admitted to the Union after the original 13 colonies, joining on March 4, 1791, as the 14th state. Vermont had operated as an independent republic called the Vermont Republic from 1777 to 1791 before joining the United States."
  
  - question: "How long did it take for all 50 states to join the Union?"
    answer: "It took 172 years for all 50 states to join the Union, from Delaware's ratification on December 7, 1787, to Hawaii's admission on August 21, 1959. The longest gap between state admissions was 47 years, between Arizona in 1912 and Alaska in 1959."
  
  - question: "Why did some states join later than others?"
    answer: "States joined at different times based on several factors: westward expansion and territorial acquisition (Louisiana Purchase, Mexican Cession), population growth in territories reaching required levels, political considerations including the slavery debate before the Civil War, and geographic challenges like Alaska and Hawaii's distance from the mainland. Each territory needed sufficient population and congressional approval before achieving statehood."
  
  - question: "What is the difference between ratifying the Constitution and being admitted to the Union?"
    answer: "The first 13 states ratified the U.S. Constitution to create the new federal government - they were already existing colonies becoming states. The remaining 37 states were admitted to the Union, meaning Congress formally accepted them as new states through enabling acts. Ratification was about approving the Constitution itself, while admission was about joining an already-established Union."

  - question: "What was the second state in the United States?"
    answer: "Pennsylvania was the second state, ratifying the U.S. Constitution on December 12, 1787 — just five days after Delaware. Despite being one of the most populous and influential colonies, Pennsylvania lost the race to be first by just five days. It went on to host the Constitutional Convention in Philadelphia and later served as the nation's capital."

  - question: "What is the 6th state of the USA?"
    answer: "Massachusetts was the 6th state to join the United States, ratifying the Constitution on February 6, 1788. Massachusetts was one of the most important early states — it was a center of the American Revolution, home to the Boston Tea Party, and birthplace of Founding Fathers like John Adams and Samuel Adams. Its ratification was considered crucial because of its size and influence."

  - question: "Is there a printable list of states in order of statehood?"
    answer: "Yes — the complete table on this page lists all 50 states in order of statehood with their exact admission dates and entry type (ratification or congressional admission). You can use your browser's print function (Ctrl+P or Cmd+P) to print the full chronological list. The table includes state number, state name, and date of admission for all 50 states from Delaware (1787) to Hawaii (1959)."

  - question: "What is the chronological order of statehood for all 50 states?"
    answer: "The full chronological list runs from Delaware (#1, December 7, 1787) through Hawaii (#50, August 21, 1959). The complete table at the top of this page shows all 50 states in order with exact admission dates — sortable by number or year."

