page:
  h1: "All 50 States by Statehood Date"
  
  quick_answer:
    - "Delaware was the first state to ratify the U.S. Constitution on December 7, 1787, earning its nickname 'The First State.' Hawaii became the 50th and final state on August 21, 1959."
    - "The original 13 colonies ratified the Constitution between 1787-1790, while the remaining 37 states were admitted to the Union by Congress between 1791-1959, spanning 168 years of American expansion."

  methodology: "Admission dates are based on official records from the U.S. Congress and National Archives. The first 13 states are listed by their ratification dates of the U.S. Constitution. States 14-50 are listed by their official admission date to the Union as determined by Congressional acts."
  
  sources:
