page:
  h1: "Governor Races 2026 by State"
  quick_answer:
    - "Governor races in 2026 cover 36 states, 18 held by a Republican governor and 18 by a Democrat. Seventeen incumbents are seeking another term, so 19 of the contests have no incumbent on the November ballot."
    - "Fifteen governors are term-limited, from Gavin Newsom in California to Ron DeSantis in Florida. Kim Reynolds of Iowa, Tim Walz of Minnesota and Tony Evers of Wisconsin could run again but chose not to."
    - "Rhode Island's Dan McKee lost the Democratic primary in September to Helena Foulkes, the first governor in any state to lose a primary since 2018."
  methodology: "Checked October 2026 using Wikipedia, Ballotpedia and news reports on primaries. Code 4 is an incumbent seeking another term, 3 a term-limited governor, 2 an eligible governor not running, 1 an incumbent who lost renomination. Nominees are not listed."
