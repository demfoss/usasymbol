sections:
  - id: term-limited-governors-in-2026
    icon: "fa-solid fa-hourglass-end"
    title: "Term-Limited Governors in 2026"
    paragraphs:
      - "Fifteen governors cannot run again because of term limits. Most states cap a governor at two terms. All fifteen first won a governor's election in 2018, when a large class of states chose governors at once, so their eight years end together."
      - "Gavin Newsom in California and Ron DeSantis in Florida lead the group by state size. Mark Gordon of Wyoming is limited by that state's eight-in-sixteen-years rule. Eligibility rules differ widely, as the [age requirements for governor](/rankings/law/age-requirements-for-governor-by-state) show."
  - id: why-so-many-governors-are-leaving
    icon: "fa-solid fa-door-open"
    title: "Why So Many Governors Are Leaving"
    paragraphs:
      - "Nineteen of the 36 races have no incumbent on the November ballot. Fifteen come from term limits, three come from governors who chose to step aside, and one comes from a primary defeat. Reynolds in Iowa announced in April 2025 that she would not run, Evers in Wisconsin followed in July 2025, and Walz in Minnesota stepped aside in January 2026."
      - "Evers's decision created Wisconsin's first open race for governor in 16 years, because Evers won in 2018 and again in 2022. Iowa, Minnesota and Wisconsin have no term limit at all, so these three governors are leaving by choice."
  - id: governors-seeking-another-term
    icon: "fa-solid fa-rotate"
    title: "Governors Seeking Another Term"
    paragraphs:
      - "Seventeen incumbents are on the ballot. Greg Abbott of Texas is seeking a fourth term, while Ned Lamont of Connecticut and JB Pritzker of Illinois are seeking third terms, since neither state limits governors. Phil Scott of Vermont first won in 2016 and faces voters again after serving two-year terms."
      - "Larry Rhoden of South Dakota is the odd case. He became governor in January 2025 when Kristi Noem left to join the federal cabinet, and this is his first race for a full term."
    table:
      columns:
        party: "Party of Governor"
        count: "Races"
        incumbents: "Incumbents Seeking Another Term"
      rows:
        - { party: "Democratic", count: "18", incumbents: "9" }
        - { party: "Republican", count: "18", incumbents: "8" }
  - id: states-without-a-governor-race-in-2026
    icon: "fa-solid fa-ban"
    title: "States Without a Governor Race in 2026"
    paragraphs:
      - "Fourteen states have no governor's race this year. They are Delaware, Indiana, Kentucky, Louisiana, Mississippi, Missouri, Montana, New Jersey, North Carolina, North Dakota, Utah, Virginia, Washington and West Virginia."
      - "Kentucky, Louisiana and Mississippi elect governors in odd years, and New Jersey and Virginia did so in November 2025. Nine more states chose their governors in 2024. The [state trifecta map](/rankings/government/trifecta-states-by-party-control) shows how those results combine with legislative control."
