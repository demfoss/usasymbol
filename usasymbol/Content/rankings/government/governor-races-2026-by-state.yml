faq:
  - question: "How many governor races are there in 2026?"
    answer: "Thirty-six states elect a governor on November 3, 2026. New Hampshire and Vermont choose governors every two years, and the other 34 states use four-year terms."
  - question: "Which governors are term-limited in 2026?"
    answer: "Kay Ivey of Alabama, Mike Dunleavy of Alaska, Gavin Newsom of California, Jared Polis of Colorado, Ron DeSantis of Florida, Brian Kemp of Georgia, Laura Kelly of Kansas, Janet Mills of Maine, Gretchen Whitmer of Michigan, Michelle Lujan Grisham of New Mexico, Mike DeWine of Ohio, Kevin Stitt of Oklahoma, Henry McMaster of South Carolina, Bill Lee of Tennessee and Mark Gordon of Wyoming."
  - question: "Which states do not have a governor election in 2026?"
    answer: "Delaware, Indiana, Kentucky, Louisiana, Mississippi, Missouri, Montana, New Jersey, North Carolina, North Dakota, Utah, Virginia, Washington and West Virginia."
  - question: "Is Tim Walz running for governor again?"
    answer: "No. Walz announced in January 2026 that he would not seek another term as Minnesota governor, so the seat is open."
  - question: "Did a sitting governor lose a primary in 2026?"
    answer: "Yes. Dan McKee of Rhode Island lost the Democratic primary in September to Helena Foulkes. No governor in any state had lost a primary since Kansas Governor Jeff Colyer in 2018."
  - question: "Which governors are not running for reelection in 2026 but could?"
    answer: "Kim Reynolds of Iowa, Tim Walz of Minnesota and Tony Evers of Wisconsin. None of those states limits how many terms a governor can serve."
  - question: "Which governor is running for a fourth term in 2026?"
    answer: "Greg Abbott of Texas. Texas has no term limit for governors, and Abbott first took office in 2015."
  - question: "Why does Rhode Island have a new governor regardless of the result?"
    answer: "Governor Dan McKee lost the Democratic primary in September and is not on the November ballot, so someone else takes office in January 2027. Helena Foulkes won the Democratic nomination."
