faq:
  - question: "Which state has the largest legislature?"
    answer: "New Hampshire, with 424 seats. Its House of Representatives alone has 400 members."

  - question: "Which state has the smallest legislature?"
    answer: "Nebraska, with 49 senators in a single chamber. Among two-house legislatures, Alaska is smallest with 60 seats."

  - question: "How many state legislators are there in the United States?"
    answer: "There are 7,386 state legislative seats across the 50 states, counting both chambers. Seats in Congress, and with them [electoral votes by state](/rankings/government/electoral-votes-by-state), follow population instead."

  - question: "How many members are in the Texas Legislature?"
    answer: "The Texas Legislature has 181 members, 150 in the House and 31 in the Senate. It meets in regular session only every other year."

  - question: "How many members are in the California Legislature?"
    answer: "California has 120 legislators, 80 in the Assembly and 40 in the Senate, the fewest per resident of any state."

  - question: "Which state has the largest state senate?"
    answer: "Minnesota, with 67 senators. Delaware and Nevada have the smallest state senates, with 21 members each."

  - question: "Is Nebraska's legislature nonpartisan?"
    answer: "Yes. Nebraska's 49 senators are elected without party labels on the ballot, and the chamber has no official majority or minority party. Nebraska joined the Union in 1867, as the [order of statehood](/rankings/government/states-order-of-succession) shows, and switched to one house 67 years later."

