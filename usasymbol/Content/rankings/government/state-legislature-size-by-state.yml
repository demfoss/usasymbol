page:
  h1: "State Legislature Size by State"

  quick_answer:
    - "State legislature size by state peaks in New Hampshire, with 424 seats. Its 400-member House is the largest lower chamber in the country, with one member for about every 3,555 residents."
    - "Nebraska has the smallest legislature, a single chamber of 49 senators. Voters replaced the two-house system in 1934, and the new body first met in 1937."
    - "California packs about 491,823 residents into each of its 80 Assembly districts, more than twice as many as Texas, the next highest."

  methodology: "Seat counts for each state's lower and upper chamber as of 2026. Residents per seat divide 2025 Census Bureau population estimates by lower-house seats. Nebraska has no lower house."

