  - id: "why-nebraska-has-a-one-house-legislature"
    icon: "fa-solid fa-building-columns"
    title: "Why Nebraska Has a One-House Legislature"
    paragraphs:
      - "Nebraska is the only state with a single legislative chamber. During the Great Depression, U.S. Senator George Norris argued that two houses wasted money and let deals hide in conference committees, and voters agreed in 1934."
      - "The Unicameral first met in 1937 with 43 members and has 49 today. Its senators run without party labels on the ballot, another feature no other state shares."

  - id: "largest-and-smallest-state-senates"
    icon: "fa-solid fa-users"
    title: "Largest and Smallest State Senates"
    paragraphs:
      - "Minnesota has the largest state senate, with 67 members. Delaware and Nevada have the smallest, 21 each, and Alaska has the smallest two-house legislature overall at 60 seats."
      - "Big states can have surprisingly small senates. Texas has only 31 senators, so each one represents about 1,035,518 residents, more than a member of the U.S. House. California's 40 senators each represent about 983,646."

  - id: "residents-per-state-legislator"
    icon: "fa-solid fa-people-group"
    title: "Residents per State Legislator"
    paragraphs:
      - "California has the most residents per lower-house seat, about 491,823 for each Assembly member. Texas follows at about 214,007 per House member, and Florida at about 197,160."
      - "New Hampshire sits at the other extreme with about 3,555 residents per House seat, and Vermont is next at about 4,285. A legislator there can know a large share of the voters in the district by name."

