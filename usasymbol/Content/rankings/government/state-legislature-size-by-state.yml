sections:
  - id: "why-new-hampshire-has-the-largest-legislature"
    icon: "fa-solid fa-landmark"
    title: "Why New Hampshire Has the Largest Legislature"
    paragraphs:
      - "New Hampshire's 424 seats trace back to its 1784 constitution, which gave towns their own representatives. As towns grew, so did the House, until an amendment in 1942 capped it at no more than 400 members."
      - "Those 400 members make the New Hampshire House one of the largest legislative bodies in the English-speaking world. Lawmakers earn $100 a year, a salary set in 1889, so many members are retirees or people with flexible jobs."
