faq:
  - question: "What state has the highest voter turnout in 2024?"
    answer: "Minnesota has the highest voter turnout in 2024 at 77.4% of the voting-eligible population. Wisconsin (74.2%) and Colorado (73.8%) rank second and third. Minnesota has ranked first or second in VEP turnout in every presidential election since 2000."

  - question: "What state has the lowest voter turnout in 2024?"
    answer: "Hawaii has the lowest voter turnout at 47.5%, the only state below 50% in 2024. West Virginia is next at 52.2%, a gap of 4.7 points. Hawaii's low participation has persisted across multiple recent presidential elections."

  - question: "What is the national voter turnout in 2024?"
    answer: "National VEP turnout in 2024 is approximately 63.7%. Twenty-six of the 50 states fall below that figure. The 2024 rate is somewhat lower than the 2020 record of 66.9%."

  - question: "What was voter turnout in the 2022 midterm elections by state?"
    answer: "Oregon had the highest 2022 midterm turnout at 62.6% of eligible voters, ahead of Maine (60.6%) and Wisconsin (60.1%). Mississippi had the lowest at 32.5%, with Tennessee at 33.3%. National midterm turnout was 45.9%."

  - question: "Why is voter turnout lower in midterm elections?"
    answer: "No presidential race tops the ballot in a midterm, so fewer occasional voters take part. Every state in the table had lower turnout in 2022 than in 2024, and the national rate fell from 63.7% to 45.9%."

  - question: "What is VEP voter turnout and how does it differ from registered-voter turnout?"
    answer: "VEP (Voting Eligible Population) turnout divides total votes cast by all U.S. citizens aged 18 or older who are legally eligible to vote, excluding non-citizens and people disqualified by felony conviction. Registered-voter turnout uses a smaller denominator, making it appear higher. VEP is the standard measure used by researchers because registration rates vary widely by state."

  - question: "What is the voter turnout in California?"
    answer: "California ranked 45th in voter turnout in 2024 at 56.7% of the voting-eligible population, 7 points below the national average of 63.7%. Despite being the most populous state with 54 electoral votes, California ranks near the bottom alongside New York (57.1%, rank 44) and Texas (56.0%, rank 46)."

  - question: "Which states have the lowest voter turnout?"
    answer: "The five lowest states by 2024 VEP turnout are Hawaii (47.5%), West Virginia (52.2%), Arkansas (55.0%), New Mexico (55.5%), and Texas (56.0%). California (56.7%) and New York (57.1%) are 6th and 7th lowest despite being the two largest states in the country."

