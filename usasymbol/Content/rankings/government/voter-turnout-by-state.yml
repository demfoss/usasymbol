  - id: "lowest-midterm-voter-turnout-states"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States with the Lowest Midterm Turnout"
    paragraphs:
      - "Mississippi had the lowest midterm turnout in 2022 at 32.5%, followed by Tennessee (33.3%) and West Virginia (35.4%). Mississippi and West Virginia had neither a U.S. Senate race nor a governor's race that year, and Tennessee reelected its governor by a wide margin, so none of the three had a close contest at the top of the ballot."
      - "Texas (41.5%) and Arkansas (41.5%) both sit in the bottom 10 even though each elected a governor in 2022. New Jersey (41.1%) is the only state in the bottom 10 that ranks in the top 20 in 2024, a 22.7 point drop that is one of the steepest in the table."
