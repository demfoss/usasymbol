  - id: "midterm-turnout-drop-off"
    icon: "fa-solid fa-chart-line"
    title: "Midterm vs Presidential Election Turnout"
    paragraphs:
      - "National turnout fell from 63.7% in 2024 to 45.9% in the 2022 midterms, a drop of 17.8 points, and every state in the table sits lower in 2022. Minnesota fell 17.9 points, from 77.4% to 59.5%, and Wisconsin fell 14.1 points. Mississippi lost the most, 25.2 points, with Tennessee close behind at 25.0."
      - "Oregon's turnout fell only 6.3 points, from 68.9% to 62.6%, the smallest drop of any state, and Hawaii followed at 7.3 points. Oregon mails every voter a ballot and was the first state to register eligible residents automatically. Many states now also give voters days or weeks to cast a ballot ahead of time, as [early voting by state](/rankings/law/early-voting-by-state) shows. A few states also treat Election Day as a public holiday, listed in [Election Day holiday states](/rankings/law/election-day-holiday-states)."

