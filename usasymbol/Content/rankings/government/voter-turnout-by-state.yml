seo:
  title: "Voter Turnout by State 2024 | Map & VEP Rates"
  description: "Minnesota had the highest voter turnout in 2024 at 77.4% of eligible voters, while Hawaii had the lowest at 47.5%."

page:
  h1: "Voter Turnout by State"

  quick_answer:
    - "Minnesota has the highest voter turnout of any state at 77.4% of the voting-eligible population in 2024, ahead of Wisconsin (74.2%) and Colorado (73.8%). Five states top 70%: Minnesota, Wisconsin, Colorado, Maine, and New Hampshire."
    - "Hawaii ranks last at 47.5% VEP turnout, the only state below 50% and 4.7 points below West Virginia (52.2%), the second-lowest state. The gap between Minnesota and Hawaii is 29.9 points."
    - "The national VEP turnout in 2024 is approximately 63.7%. Twenty-six states fall below that threshold, including California (56.7%), New York (57.1%), and Texas (56.0%)."
    - "Oregon had the highest midterm turnout in 2022 at 62.6% of eligible voters, helped by all-mail voting, while Mississippi trailed at 32.5%. National midterm turnout was 45.9%, about 17.8 points below the 2024 presidential rate."

  methodology: "Turnout figures measure the voting-eligible population (VEP) rate, total votes cast divided by all U.S. citizens aged 18 or older who are not disqualified by felony status and excluding non-citizens, a more accurate measure than registered-voter turnout. Figures are from the United States Elections Project (Dr. Michael McDonald, University of Florida), 2024 presidential election data. The 2022 midterm column uses the same VEP definition (total ballots counted for the November 2022 general election) from the University of Florida Election Lab. The District of Columbia is not ranked."

  sources:
    - name: "United States Elections Project — 2024 Turnout Data"
      url: "https://electproject.github.io/Early-Vote-2024G/index.html"
      description: "VEP turnout estimates by state for the 2024 general election, compiled by Dr. Michael McDonald"
    - name: "University of Florida Election Lab — 2022 General Election Turnout"
      url: "https://election.lab.ufl.edu/voter-turnout/2022-general-election-turnout/"
      description: "VEP turnout rates by state for the November 2022 midterm general election"
    - name: "Federal Election Commission — 2024 Federal Elections"
      url: "https://www.fec.gov/introduction-campaign-finance/election-results-and-voting-information/"
      description: "Official certified vote totals by state"

