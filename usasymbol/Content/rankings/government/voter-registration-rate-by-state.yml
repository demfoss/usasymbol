    icon: "fa-solid fa-clipboard-check"
    title: "Why Minnesota Has the Highest Voter Registration Rate"
    paragraphs:
      - "Minnesota's 83.6% rate coincides with same-day voter registration, which lets residents register at the polling place with proof of residency, and with automatic voter registration the state adopted in 2023 for people who interact with state government agencies. Oregon, the second-highest state at 83.0%, also runs an automatic registration system."
      - "Arkansas's last-place 64.7% rate coincides with its status as one of the few states without online voter registration, a gap not shared by any state in the top ten, all of which offer it."

