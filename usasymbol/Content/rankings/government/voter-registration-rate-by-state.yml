faq:
  - question: "Which state has the highest voter registration rate?"
    answer: "Minnesota has the highest voter registration rate at 83.6% of the citizen voting-age population. Oregon ranks second at 83.0%, and New Jersey third at 81.9%."

  - question: "Which state has the lowest voter registration rate?"
    answer: "Arkansas has the lowest voter registration rate at 64.7%, the only state below 65%. Louisiana (66.0%) and New York (66.2%) rank second- and third-lowest."

  - question: "What is the national voter registration rate?"
    answer: "The national voter registration rate is 73.6% of the citizen voting-age population. Eighteen states fall below that figure, including Texas (69.1%), Florida (67.0%), and California (72.9%)."

  - question: "How is voter registration rate different from voter turnout?"
    answer: "Registration rate measures the share of the citizen voting-age population registered to vote. Turnout measures the share of the eligible population that actually cast a ballot. A state can rank differently on each measure; this ranking covers registration only."

  - question: "What percentage of California residents are registered to vote?"
    answer: "California's voter registration rate is 72.9%, ranking 35th among the 50 states and just below the national rate of 73.6%."

  - question: "Which states have voter registration rates above 80%?"
    answer: "Eight states: Minnesota (83.6%), Oregon (83.0%), New Jersey (81.9%), Mississippi (81.0%), Michigan (80.8%), Iowa (80.6%), Kentucky (80.5%), and Maryland (80.4%)."

