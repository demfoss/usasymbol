page:
  h1: "Voter Registration Rate by State"

  quick_answer:
    - "Minnesota has the highest voter registration rate of any state, 83.6% of the citizen voting-age population registered for the 2024 election. Oregon follows at 83.0%, and New Jersey ranks third at 81.9%."
    - "Arkansas ranks last at 64.7% registered, the only state below 65% and 18.9 points behind Minnesota. Louisiana (66.0%) and New York (66.2%) are the next-lowest states."
    - "The national voter registration rate is 73.6%. Eighteen states fall below that figure, including Texas (69.1%), Florida (67.0%), and California (72.9%)."

  methodology: "Registration rates measure the share of the citizen voting-age population registered to vote, as reported in the Current Population Survey Voting and Registration Supplement for November 2024. Figures are self-reported survey estimates, not administrative voter-roll counts, and are distinct from this site's separate ranking of voter turnout, which measures ballots actually cast."

  sources:
    - name: "U.S. Census Bureau — Current Population Survey, Voting and Registration Supplement, November 2024"
      url: "https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-590.html"
      description: "Survey-based registration rate estimates for the citizen voting-age population, by state"
    - name: "KFF State Health Facts — Number of Voters and Voter Registration as a Share of the Voter Population"
      url: "https://www.kff.org/state-health-policy-data/state-indicator/number-of-voters-and-voter-registration-in-thousands-as-a-share-of-the-voter-population/"
      description: "State-by-state compilation of Census CPS registration-rate data"
    - name: "National Conference of State Legislatures — Same Day Voter Registration"
      url: "https://www.ncsl.org/elections-and-campaigns/same-day-voter-registration"
      description: "State-by-state listing of same-day and automatic voter registration laws"
    - name: "National Conference of State Legislatures — Online Voter Registration"
      url: "https://www.ncsl.org/elections-and-campaigns/online-voter-registration-in-the-states"
      description: "State-by-state listing of online voter registration availability"

