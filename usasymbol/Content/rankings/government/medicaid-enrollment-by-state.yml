faq:
  - question: "Which state has the most Medicaid enrollment?"
    answer: "California has the most Medicaid enrollment with 10,479,477 people in June 2026. Medi-Cal serves the country's largest state population through a broad statewide health program."
  - question: "Which state has the least Medicaid enrollment?"
    answer: "Wyoming has the least Medicaid enrollment at 53,573. Its small total reflects the state's position as the least populous in the country."
  - question: "What is Medicaid enrollment in Texas?"
    answer: "Texas has 3,620,632 Medicaid enrollees and ranks third. Combined Medicaid and CHIP enrollment reaches 3,948,961."
  - question: "What is Medicaid enrollment in New York?"
    answer: "New York has 5,755,514 Medicaid enrollees, the second-highest total after California. Its combined Medicaid and CHIP enrollment is 6,410,729."
  - question: "What is Medicaid enrollment in Florida?"
    answer: "Florida has 3,396,650 Medicaid enrollees and ranks fourth. Its combined Medicaid and CHIP total is 3,565,369."

