page:
  h1: "Women Mayors by State 2026"

  quick_answer:
    - "California has 85 women mayors in places with more than 30,000 residents, the most of any state. Its large network of populous municipalities creates far more qualifying offices than most states have."
    - "Illinois ranks second with 38 women mayors. Its total includes leaders of cities, villages, and townships whose chief officials perform mayoral functions."
    - "Alabama, Delaware, Hawaii, Mississippi, North Dakota, and Rhode Island have no women in the covered mayoral offices as of September 2026."

  methodology: "CAWP officeholder data from September 2026 cover mayors and officials performing mayoral functions in U.S. places above 30,000 residents. State totals exclude one woman in Washington, D.C."

