faq:
  - question: "Which state has the most women mayors?"
    answer: "California has the most, with 85 women serving as mayors or performing mayoral functions in places above 30,000 residents. California's many populous municipalities give it the largest pool of covered offices."

  - question: "How many women mayors are there in the United States?"
    answer: "The covered U.S. total is 452 as of September 2026. That equals 26.8% of 1,684 mayoral offices in cities, towns, and minor civil divisions above 30,000 residents."

  - question: "How many women mayors does Illinois have?"
    answer: "Illinois has 38 women mayors, the second-highest state total. The coverage includes officials performing mayoral functions in qualifying cities, villages, and townships."

  - question: "How many women mayors does Texas have?"
    answer: "Texas has 18 women mayors in covered communities, tying New York for sixth by count. Gina Ortiz Jones leads San Antonio, one of the largest cities represented in the national list."

  - question: "Which states have no women mayors?"
    answer: "Alabama, Delaware, Hawaii, Mississippi, North Dakota, and Rhode Island have zero women in covered mayoral offices. Women leading places under 30,000 residents are outside this ranking."

  - question: "Does Washington, D.C. count as a state in this ranking?"
    answer: "No. Washington, D.C., has one woman in a covered mayoral office and contributes to the U.S. total of 452, but the table ranks only the 50 states."

