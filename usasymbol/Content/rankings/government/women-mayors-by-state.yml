    paragraphs:
      - "California leads with 85 women mayors, while Illinois has 38. Florida and Indiana each have 26, followed by Ohio with 20. The list counts communities above the same population threshold, from major cities to townships where an official performs mayoral duties."
      - "Several leaders govern places featured in [largest cities by state](/rankings/demographics/largest-city-by-state). Karen Bass leads Los Angeles, Cherelle Parker leads Philadelphia, and Gina Ortiz Jones leads San Antonio."

  - id: "why-california-has-the-most-women-mayors"
    title: "Why California Has the Most Women Mayors"
    paragraphs:
      - "California's 85 women mayors reflect the state's exceptional number of populous municipalities. The covered offices range from Los Angeles, the nation's second-largest city, to many communities just above 30,000 residents, so California has a much wider pool of qualifying mayoralties than smaller states."
      - "California also has more residents than any other state, as shown in [states by population](/rankings/demographics/states-by-population). Karen Bass became the first woman elected mayor of Los Angeles in 2022, placing a woman at the head of the largest city represented in California's total."

  - id: "states-with-no-women-mayors"
    title: "States With No Women Mayors"
    paragraphs:
      - "Alabama, Delaware, Hawaii, Mississippi, North Dakota, and Rhode Island each record zero women in the covered offices. Smaller states have fewer communities above 30,000 residents, which leaves fewer qualifying mayoralties in which any officeholder can appear."
      - "A zero does not mean that no woman leads a smaller town. The threshold excludes places below 30,000 residents, while the related [women in state legislatures](/rankings/government/women-in-state-legislatures-by-state) page measures a different level of elected office."

