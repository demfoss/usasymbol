sections:
  - id: largest-congressional-districts-by-population
    icon: "fa-solid fa-users"
    title: "Largest Congressional Districts by Population"
    paragraphs:
      - "Delaware has the biggest House district at 990,837 people, and the reason is arithmetic. Every state gets at least one seat, and Delaware's population is not quite enough to earn a second. The same rounding effect puts Idaho (920,689 per seat across two) and West Virginia (897,523 across two) just behind."
      - "South Dakota (887,770) completes the pattern, a one-seat state that just misses a second seat. Utah (818,813) has the largest districts among states with four or more seats, and Arizona (795,436) and Ohio (787,257) are also well above the national average of 761,169."
