    title: "Smallest Congressional Districts by Population"
    paragraphs:
      - "Montana has the smallest districts at 542,704 people each. Its 1,085,407 residents earned a second seat in 2020 for the first time since the 1990 count, and splitting them in two leaves each district lighter than any in the country. Rhode Island (549,082) lands next to it for the same reason."
      - "Wyoming (577,719) has the smallest population of any state and keeps one seat covering the whole state. Vermont (643,503) and Nebraska (654,444) also sit well under the average. Voters in these states carry more weight in the House than voters in Delaware or Idaho."
