page:
  h1: "Congressional Districts by State"

  quick_answer:
    - "Congressional districts are largest in Delaware, where its single House seat covers 990,837 people. A state cannot hold a fraction of a seat, so the smallest states round up or down in a big way."
    - "Montana has the smallest districts at 542,704 people per seat. It regained a second seat after the 2020 count, and its 1,085,407 residents now split across two districts, while Wyoming (577,719) holds one."
    - "Published projections for the 2030 count point to Texas gaining four seats and California losing four. They are estimates built on recent population trends, not decisions."

  methodology: "2020 apportionment population from the Census Bureau (state residents plus overseas federal personnel), divided by each state's 435-seat House allocation and rounded to a whole person. Projected 2030 change is a Brennan Center projection from January 2026 using Vintage 2025 Census estimates, read from its published map, and other analysts differ. D.C. has no voting seat and is not ranked. Checked October 2026."

