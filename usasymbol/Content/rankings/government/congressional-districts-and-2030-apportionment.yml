  - id: why-the-house-has-435-seats
    icon: "fa-solid fa-landmark"
    title: "Why the House Has 435 Seats"
    paragraphs:
      - "The House once grew with the country. The Constitution allowed no more than one member for every 30,000 people, and Congress added seats after nearly every census until 1911, when it settled on 435 once Arizona and New Mexico joined the Union. The 1920 census then showed most Americans lived in cities, and rural members refused to give up seats, so Congress did not reapportion at all that decade."
      - "The Permanent Apportionment Act of 1929 ended the standoff by making the process automatic and keeping the House at 435. A 1941 law set the method of equal proportions for dividing seats. The House briefly had 437 members from 1959 to 1963 after Alaska and Hawaii became states. Each state's share is now settled by the count, and it also decides its votes in the Electoral College, as shown in [electoral votes by state](/rankings/government/electoral-votes-by-state)."

  - id: states-projected-to-gain-or-lose-house-seats
    icon: "fa-solid fa-arrows-up-down"
    title: "States Projected to Gain or Lose House Seats"
    paragraphs:
      - "Texas leads the published gains with four more seats, followed by Florida with three, while California is projected to lose four. These projections extend population trends since 2020, and they change if immigration or migration shifts. Florida's gain, for example, drops to two in one alternative scenario."
      - "Arizona, Georgia, Idaho, North Carolina, and Utah are each projected to gain a seat, and New York would lose two. Illinois, Minnesota, Oregon, Pennsylvania, Rhode Island, and Wisconsin would each lose one. Whoever draws the new districts matters too, and [redistricting commission states](/rankings/law/redistricting-commission-states) shows which states hand that job to a panel."
