faq:
  - question: "Which state has the largest congressional district by population?"
    answer: "Delaware has the largest, with one House seat for 990,837 people. Idaho is next at 920,689 per seat, and West Virginia follows at 897,523."
  - question: "Which state has the smallest congressional districts?"
    answer: "Montana, at 542,704 people per seat. It has two seats for 1,085,407 residents. Rhode Island is next at 549,082, and Wyoming's single statewide seat covers 577,719."
  - question: "How many people does one member of the House represent?"
    answer: "Across the country the average is about 761,169 people per seat. The 435 seats divide an apportionment population of 331,108,434, so a district in Ohio (787,257) is a little larger and one in Minnesota (713,719) a little smaller."
  - question: "Why is the House limited to 435 members?"
    answer: "Congress capped it at 435 in 1911 and made the cap permanent in the Permanent Apportionment Act of 1929. Adding seats would need a new law, and none has passed since, apart from a temporary rise to 437 for Alaska and Hawaii."
  - question: "Which states have only one congressional district?"
    answer: "Alaska, Delaware, North Dakota, South Dakota, Vermont, and Wyoming each send one representative to the House. Their single seats cover very different populations, from Wyoming's 577,719 to Delaware's 990,837."
  - question: "How many House seats does California have?"
    answer: "California has 52, the most of any state. It lost one seat after the 2020 count, the first time in its history. Each of its districts averages 761,091 people, which is close to the national average."
  - question: "Which states could lose House seats after the 2030 census?"
    answer: "Published projections show California losing four seats and New York two, with Illinois, Minnesota, Oregon, Pennsylvania, Rhode Island, and Wisconsin each losing one. Projections like these assume current population trends continue, and the official numbers come only from the 2030 count."
  - question: "When will House seats be reapportioned next?"
    answer: "After the 2030 census. The Census Bureau reports state populations by the end of 2030, and the new seat totals first apply to the 2032 elections."

