faq:
  - question: "Which state has the oldest state lottery?"
    answer: "New Hampshire has the oldest modern state lottery. Ticket sales began on March 12, 1964, for a sweepstakes linked to horse racing."
  - question: "Which state started a lottery most recently?"
    answer: "Mississippi is the newest lottery state. Its first scratch-off tickets went on sale in 2019."
  - question: "Which states do not have a lottery?"
    answer: "Alabama, Alaska, Hawaii, Nevada, and Utah do not have state lotteries. Nevada relies heavily on regulated casino gambling but still prohibits a state lottery."
  - question: "When did the California Lottery start?"
    answer: "California's lottery began in 1985 after voters approved the California State Lottery Act in 1984."
  - question: "When did the Texas Lottery start?"
    answer: "Texas lottery ticket sales began in 1992. The first game was a scratch ticket called Lone Star Millions."

