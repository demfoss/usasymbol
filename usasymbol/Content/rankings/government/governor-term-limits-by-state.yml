    title: "Can a Governor Run Again After a Break"
    paragraphs:
      - "Twenty-three states cap governors at two terms in a row, and a former governor there may run again after four years out of office. Virginia goes further and allows only one term at a time. Every Virginia governor has to leave after four years, then sit out at least one full term before running again."
