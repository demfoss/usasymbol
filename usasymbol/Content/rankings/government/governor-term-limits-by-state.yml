sections:
  - id: states-with-governor-term-limits-for-life
    icon: "fa-solid fa-gavel"
    title: "States With Lifetime Governor Term Limits"
    paragraphs:
      - "Nine states let a person win the governorship twice and never again. California's cap dates from Proposition 140 in 1990. Jerry Brown served from 1975 to 1983, before the cap, and returned for another eight years from 2011 to 2019."
      - "Four states count years instead of terms. Indiana and Oregon allow eight years in any 12, while Montana and Wyoming allow eight years in any 16, so a governor can come back after a long enough gap. Pay for the job is compared in [governor salary by state](/rankings/government/governor-salary-by-state)."
