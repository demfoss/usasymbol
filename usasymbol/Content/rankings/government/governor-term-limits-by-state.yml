    icon: "fa-solid fa-infinity"
    title: "States With No Governor Term Limits"
    paragraphs:
      - "Thirteen states let a governor run as many times as voters allow. Texas is the best-known case, because Rick Perry served from December 2000 to January 2015, longer than any other governor in the state's history. Utah once capped governors at three terms before its legislature repealed the limit."
      - "New Hampshire and Vermont have no limit and the shortest terms, only two years each. A governor there faces voters twice as often as one in a four-year state, which makes a cap less necessary. Races in those states are listed in [governor races in 2026](/rankings/government/governor-races-2026-by-state)."
