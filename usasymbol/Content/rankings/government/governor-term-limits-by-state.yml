  title: "Governor Term Limits by State | Map & Rules"
  description: "Nine states cap governors at two terms for life, and 13 states set no limit at all. Virginia is the only state that bars back-to-back terms."
page:
  h1: "Governor Term Limits by State"
  quick_answer:
    - "Governor term limits are strictest in nine states, including Arkansas, California and Oklahoma, where a person can serve two terms in a lifetime. Four more states count years in office inside a rolling window."
    - "Thirteen states set no limit on governors. Texas shows what that allows, since Rick Perry held the office from December 2000 to January 2015."
    - "Virginia is the only state that forbids a governor from serving consecutive terms. A former governor may run again after sitting out four years."
