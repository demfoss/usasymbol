faq:
  - question: "Which states have no term limits for governors?"
    answer: "Thirteen states do. They are Connecticut, Idaho, Illinois, Iowa, Massachusetts, Minnesota, New Hampshire, New York, Texas, Utah, Vermont, Washington and Wisconsin."
  - question: "Which state does not allow consecutive terms for governor?"
    answer: "Virginia. A governor serves a single four-year term and must wait before running again, but there is no cap on how many nonconsecutive terms a person can serve."
  - question: "How many terms can a governor serve in California?"
    answer: "Two terms in a lifetime, each lasting four years. Voters set the cap in 1990 with Proposition 140."
  - question: "How long is a governor's term?"
    answer: "Four years in 48 states. New Hampshire and Vermont are the exceptions, with governors elected every two years."
  - question: "How many states limit their governors?"
    answer: "Thirty-seven of the 50 states set some kind of limit. Twenty-three of them allow two terms in a row and then a return after a four-year break."
  - question: "Can a governor serve more than two terms in Montana or Wyoming?"
    answer: "Not at once, because both states allow eight years in any 16. A governor who has served eight years must stay out of the office long enough for the total to fall back under the cap."
