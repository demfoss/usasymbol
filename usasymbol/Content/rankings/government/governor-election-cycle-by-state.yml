faq:
  - question: "Which states elect governors in 2027?"
    answer: "Kentucky, Louisiana and Mississippi. Their four-year gubernatorial cycles fall in the odd year after a presidential election."
  - question: "Which states elect governors in 2029?"
    answer: "New Jersey and Virginia. Both hold governor elections in the odd year following a federal midterm."
  - question: "Which states elect governors every two years?"
    answer: "New Hampshire and Vermont. The other 48 states use four-year terms."
  - question: "How many states elect governors in midterm years?"
    answer: "Thirty-six states normally do, including New Hampshire and Vermont. After the 2026 contests, those two vote again in 2028 while the 34 four-year states wait until 2030."
  - question: "When is the next California governor election?"
    answer: "California's next regular governor election is in 2030. The office follows a four-year midterm cycle."
  - question: "When is the next Virginia governor election?"
    answer: "Virginia's next regular governor election is in 2029. Its odd-year schedule places the contest one year after the presidential election."

