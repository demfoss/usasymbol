sections:
  - id: states-with-odd-year-governor-elections
    icon: "fa-solid fa-calendar-check"
    title: "States With Odd-Year Governor Elections"
    paragraphs:
      - "Kentucky, Louisiana and Mississippi hold their next governor elections in 2027, one year after the federal midterms. New Jersey and Virginia follow in 2029, the year after the presidential election."
      - "Odd-year scheduling gives those five races a ballot without a presidential or congressional general election at the top. Kentucky, Louisiana and Mississippi share one odd-year cycle, while New Jersey and Virginia use the other."
  - id: states-with-two-year-governor-terms
    icon: "fa-solid fa-rotate"
    title: "States With Two-Year Governor Terms"
    paragraphs:
      - "New Hampshire and Vermont elect governors every two years, twice as often as the other 48 states. Both voted in 2026 and return in 2028 alongside the nine four-year states on the presidential-year cycle."
      - "Every other governor serves a regular four-year term. That concentrates 34 contests in midterm years, including California, Florida, New York and Texas, while nine four-year states vote in presidential years."

