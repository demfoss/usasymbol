  description: "Kentucky, Louisiana and Mississippi elect governors in 2027. Eleven states vote in 2028, two in 2029 and 34 in 2030."

page:
  h1: "Governor Election Cycle by State"
  quick_answer:
    - "Governor election cycles reach their next contest first in Kentucky, Louisiana and Mississippi in 2027. Each uses an odd-year schedule separate from federal elections."
    - "Eleven states next elect governors in 2028, including New Hampshire and Vermont, whose two-year terms put the office on every even-year ballot."
    - "New Jersey and Virginia vote next in 2029. The remaining 34 states completed regular governor elections in 2026 and return to the ballot in 2030."
  methodology: "Regular election years and term lengths come from the National Governors Association election calendar and state election offices, checked November 2026. Special elections are excluded."
  sources:
    - name: "National Governors Association. Gubernatorial Elections"
      url: "https://www.nga.org/governors/elections/"
      description: "Election calendars and regular term lengths for governors"
    - name: "National Conference of State Legislatures. Elections and Campaigns"
      url: "https://www.ncsl.org/elections-and-campaigns"
      description: "State election administration resources and calendars"

