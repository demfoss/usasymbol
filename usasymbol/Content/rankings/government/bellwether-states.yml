sections:
  - id: best-bellwether-states-in-presidential-elections
    icon: "fa-solid fa-trophy"
    title: "Best Bellwether States in Presidential Elections"
    paragraphs:
      - "Five states picked the national winner in at least 14 of the 17 elections from 1960 to 2024. Nevada and Ohio lead with 15, and Florida, Missouri and Pennsylvania follow with 14."
      - "Florida missed in 1960, 1992 and 2020, and Missouri sat out Barack Obama's wins in 2008 and 2012 before missing again in 2020. Pennsylvania missed in 1968, 2000 and 2004 but has voted with the winner in each of the last five elections."
