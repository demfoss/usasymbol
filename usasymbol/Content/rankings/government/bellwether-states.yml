        - { state: "Missouri", record: "14 of 17 (82.4%)", missed: "2008, 2012, 2020" }
        - { state: "Pennsylvania", record: "14 of 17 (82.4%)", missed: "1968, 2000, 2004" }
  - id: why-ohio-and-nevada-lead-as-bellwethers
    icon: "fa-solid fa-scale-balanced"
    title: "Why Ohio and Nevada Lead as Bellwethers"
    paragraphs:
      - "Ohio mixes the pieces of the national electorate in roughly national proportions. Cleveland, Columbus and Cincinnati sit beside old manufacturing towns, Appalachian hills and corn and soybean farmland, so a swing among suburban or working class voters nationally tends to show up there. In 2020 Trump won Ohio by about eight points and lost the country, which ended a run that began in 1964."
      - "Nevada earned its record through growth and turnover. Most of its voters live in the Las Vegas area, and the state attracts new residents from across the country, so its electorate keeps changing with the nation. It sided with the loser in 1976, when Gerald Ford carried it, and in 2016, when Hillary Clinton did, and it voted for the winner in 2020 and 2024."
  - id: longest-streaks-of-picking-the-winner
    icon: "fa-solid fa-ranking-star"
    title: "Longest Streaks of Picking the Winner"
    paragraphs:
      - "Ohio holds the longest streak at 14 elections, from 1964 through 2016. Missouri backed the winner in 12 straight elections from 1960 through 2004, and Kentucky and Tennessee each matched the winner 11 times in a row from 1964 to 2004."
      - "Delaware followed with 10 straight from 1960 to 1996. Its run ended in 2000 when it voted for Al Gore, and Missouri, Kentucky and Tennessee all broke theirs in 2008 by voting for John McCain. For how those states line up politically, see [red and blue states](/rankings/government/red-and-blue-states)."
    table:
      columns:
        state: "State"
        streak: "Longest Streak"
        years: "Elections Covered"
      rows:
        - { state: "Ohio", streak: "14", years: "1964 to 2016" }
        - { state: "Missouri", streak: "12", years: "1960 to 2004" }
        - { state: "Kentucky", streak: "11", years: "1964 to 2004" }
        - { state: "Tennessee", streak: "11", years: "1964 to 2004" }
        - { state: "Delaware", streak: "10", years: "1960 to 1996" }
  - id: bellwether-states-since-2008
    icon: "fa-solid fa-flag-usa"
    title: "Bellwether States Since 2008"
    paragraphs:
      - "Michigan, Pennsylvania and Wisconsin have voted with the national winner in all five elections since 2008, the longest current streak of any state. They backed Obama in 2008 and 2012, Trump in 2016, Joe Biden in 2020 and Trump in 2024. Arizona and Georgia have matched the winner in 2016, 2020 and 2024."
      - "Nevada has a current streak of two after its 2016 miss, and Ohio has one. The [electoral votes by state](/rankings/government/electoral-votes-by-state) page shows how much weight each of these states carries in the Electoral College."
    table:
