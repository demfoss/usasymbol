page:
  h1: "Bellwether States"
  quick_answer:
    - "Bellwether states are those that vote for the national winner, and Nevada and Ohio lead with 15 of 17 presidential elections from 1960 to 2024, or 88.2 percent. Both missed twice."
    - "Ohio backed the winner in every election from 1964 to 2016, a run of 14, before Donald Trump carried it in 2020 and lost nationally. Nevada missed in 1976 and 2016, and picked the winner in all nine elections from 1980 to 2012."
    - "Michigan, Pennsylvania and Wisconsin hold the longest current streak, five straight winners since 2008. Alabama, Minnesota, Mississippi and Washington trail with 9 of 17, or 52.9 percent."
  methodology: "Checked October 2026 using Wikipedia's state-by-state presidential results for 1960 to 2024, the 17 elections open to all 50 states. A state counts when its electors went to the national winner. Maine and Nebraska use the statewide result. D.C. is excluded."
