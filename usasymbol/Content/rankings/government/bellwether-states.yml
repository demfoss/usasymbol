faq:
  - question: "Which state is the best bellwether in presidential elections?"
    answer: "Nevada and Ohio tie, each voting for the national winner in 15 of the 17 elections from 1960 to 2024. Ohio's misses were 1960 and 2020, and Nevada's were 1976 and 2016."
  - question: "Is Ohio still a bellwether state?"
    answer: "Ohio's overall record is tied for the best, but its streak of 14 correct picks from 1964 to 2016 ended in 2020 when it backed the losing candidate. It matched the winner again in 2024, and it voted Republican by about eight points in 2020 and 11 in 2024."
  - question: "Is Nevada a bellwether state?"
    answer: "Nevada has picked the winner in 15 of 17 elections since 1960. It missed only in 1976 and 2016 and matched the national result in each of the last two elections."
  - question: "Is Florida a bellwether state?"
    answer: "Florida backed the winner in 14 of 17 elections, with misses in 1960, 1992 and 2020. Its longest streak is seven, from 1964 to 1988."
  - question: "Which states voted for the winner in every election since 2008?"
    answer: "Michigan, Pennsylvania and Wisconsin. All three backed the winner in 2008, 2012, 2016, 2020 and 2024."
  - question: "Which state is the least reliable bellwether?"
    answer: "Alabama, Minnesota, Mississippi and Washington share the lowest record at 9 of 17 elections. Minnesota has voted Democratic in every election since 1976, so it only matches the national result when a Democrat wins."
  - question: "How many states voted for the winner in 2024?"
    answer: "Thirty-one states voted for Donald Trump, who won the election. The other 19 states backed Kamala Harris."
  - question: "What is a bellwether state?"
    answer: "A bellwether state is one whose presidential vote matches the national winner. The word comes from the lead sheep of a flock, which wore a bell so the shepherd could tell where the rest were headed."
