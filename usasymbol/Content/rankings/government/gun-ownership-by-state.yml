faq:
  - question: "What state has the highest gun ownership rate?"
    answer: "Wyoming has the highest gun ownership rate at 66.3% of adults. Montana (65.7%) ranks second and Alaska (63.5%) third. These are the only three states above 60%."

  - question: "What state has the lowest gun ownership rate?"
    answer: "Hawaii has the lowest gun ownership rate at 9.7%, the only state below 10%. New Jersey (12.0%) and Massachusetts (12.6%) are next. The bottom five states are all in the Northeast or Pacific."

  - question: "What is the gun ownership rate in Texas?"
    answer: "Texas has a gun ownership rate of 44.9%, ranking 16th in the country. That places Texas above the midpoint of the table but well below the top Mountain West states."

  - question: "What is the gun ownership rate in California?"
    answer: "California has a gun ownership rate of 20.7%, ranking 43rd out of 50 states. Despite having the largest population in the country, California falls in the lower quarter of the table alongside other large coastal states."

  - question: "What is the gun ownership rate in Florida?"
    answer: "Florida has a gun ownership rate of 30.8%, ranking 40th. Florida sits just above the sharp drop-off point in the table. Illinois (25.5%) at rank 41 is the next state below, a 5.3-point gap."

  - question: "How is gun ownership measured by state?"
    answer: "Most states have no gun registration requirement, so direct counts are unavailable. Ownership rates come from surveys, primarily the CDC's Behavioral Risk Factor Surveillance System (BRFSS) and research by the RAND Corporation, which models ownership using validated proxy measures. All state-level figures carry a margin of error."

