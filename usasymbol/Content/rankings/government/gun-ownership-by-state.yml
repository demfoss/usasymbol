seo:
  title: "Gun Ownership by State 2026 | Map & Rates"
  description: "Wyoming has the highest adult gun ownership rate at 66.3%, while Hawaii has the lowest at 9.7%."

page:
  h1: "Gun Ownership Rate by State"

  quick_answer:
    - "Wyoming has the highest gun ownership rate at 66.3% of adults, the only state above 65%. Montana (65.7%) and Alaska (63.5%) follow. No other state exceeds 60%."
    - "Hawaii ranks last at 9.7%, the only state below 10%. New Jersey (12.0%), Massachusetts (12.6%), and Rhode Island (13.8%) are next lowest. Wyoming's rate is nearly 7 times Hawaii's."
    - "The five states with the highest ownership (Wyoming, Montana, Alaska, West Virginia, and Arkansas) all exceed 57% and are in the Mountain West, Pacific Northwest, or South. The five lowest states are all in the Northeast or Pacific."

  methodology: "Ownership rates represent the percentage of adults who personally own at least one firearm, based on survey data compiled and modeled by the RAND Corporation's Science of Gun Policy research program using CDC Behavioral Risk Factor Surveillance System (BRFSS) data. Because most states have no gun registration requirement, direct counts do not exist; all figures are survey-derived estimates and carry a margin of error."

  sources:
    - name: "RAND Corporation — State Firearm Laws Database"
      url: "https://www.rand.org/pubs/tools/TLA243-2-v2.html"
      description: "Survey-based gun ownership estimates by state, Science of Gun Policy research program"
    - name: "CDC — Behavioral Risk Factor Surveillance System"
      url: "https://www.cdc.gov/brfss/"
      description: "Annual state-level health and behavior survey used as a baseline for ownership estimates"

