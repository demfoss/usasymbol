sections:
  - id: "why-alabama-has-the-longest-constitution"
    icon: "fa-solid fa-scroll"
    title: "Why Alabama Has the Longest Constitution"
    paragraphs:
      - "Alabama's constitution runs about 402,852 words, more than four times as long as any other state's. The 1901 document gave counties almost no power of their own, so a new tax, a road district, or a change to a local office often needed a constitutional amendment approved by voters."
      - "Nearly 1,000 amendments piled up, most of them about a single county. In 2022 voters ratified a recompiled version that grouped the local amendments by county and removed racist language left over from 1901."
    table:
      columns:
        state: "State"
        words: "Length (Words)"
      rows:
        - state: "Alabama"
          words: "402,852"
        - state: "Texas"
          words: "92,025"
        - state: "Oklahoma"
          words: "84,956"
        - state: "Missouri"
          words: "84,924"
        - state: "Colorado"
          words: "84,239"
        - state: "California"
          words: "76,930"
        - state: "Louisiana"
          words: "76,730"
        - state: "Ohio"
          words: "63,140"
        - state: "Arkansas"
          words: "59,120"
        - state: "Oregon"
          words: "49,430"

  - id: "shortest-state-constitutions"
    icon: "fa-solid fa-feather"
    title: "Shortest State Constitutions"
    paragraphs:
      - "Vermont's constitution is the shortest, about 8,565 words, close to the length of the U.S. Constitution with all its amendments. Vermont allows proposals to amend it only once every four years, which keeps additions rare."
      - "Iowa (11,089), Rhode Island (11,407), and Indiana (11,610) come next. Short constitutions tend to set out the framework of government and leave the details to ordinary laws, the approach the U.S. Constitution itself takes."

  - id: "states-with-the-most-constitutions"
    icon: "fa-solid fa-layer-group"
    title: "States With the Most Constitutions"
    paragraphs:
      - "Louisiana has written 11 constitutions, more than any other state, and Georgia has had 10. Both rewrote theirs after secession, again during Reconstruction, and again as later generations remade state government."
      - "Twenty states still use their first constitution. Wisconsin's has lasted since 1848. Kansas's dates to January 1861, months before the Civil War began, and Nevada's to 1864, when it became a state in the middle of the war."

  - id: "oldest-state-constitution"
    icon: "fa-solid fa-landmark"
    title: "Oldest State Constitution"
    paragraphs:
      - "Massachusetts adopted its constitution in 1780, and it is still in force. John Adams wrote most of it, and it became a model for the U.S. Constitution drafted seven years later."
      - "New Hampshire (1784) and Vermont (1793) follow. Vermont wrote its first constitution in 1777, when it was an independent republic, and joined the Union in 1791, as the [order of statehood](/rankings/government/states-order-of-succession) shows."

