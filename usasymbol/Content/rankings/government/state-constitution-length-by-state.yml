page:
  h1: "State Constitution Length by State"

  quick_answer:
    - "State constitution length by state peaks in Alabama, at about 402,852 words. Its 1901 constitution kept power in Montgomery, so even local county matters needed a constitutional amendment."
    - "Vermont has the shortest state constitution, about 8,565 words, and changes it rarely because amendments can start only once every four years."
    - "Louisiana has had more constitutions than any other state, 11 in all. Massachusetts still runs on its first, adopted in 1780, before the U.S. Constitution existed."

  methodology: "Estimated word counts, constitution numbers, and effective dates from the Book of the States as compiled on Wikipedia. Connecticut and Illinois share an identical listed count, so their lengths are left blank."

  sources:
