faq:
  - question: "Which state has the longest constitution?"
    answer: "Alabama, at about 402,852 words. Texas is a distant second at about 92,025 words."

  - question: "Which state has the shortest constitution?"
    answer: "Vermont, at about 8,565 words. Its constitution dates to 1793 and is still in effect."

  - question: "Why is the Alabama constitution so long?"
    answer: "Most of its length comes from local amendments. Counties lacked home rule, so voters statewide had to approve changes as small as a single county's local tax or office."

  - question: "How long is the Texas constitution?"
    answer: "About 92,025 words, the second longest. Texans have amended their 1876 constitution more than 500 times."

  - question: "Which state has had the most constitutions?"
    answer: "Louisiana, with 11. Georgia is second with 10, and Alabama and Virginia have each had 7."

  - question: "What is the oldest state constitution still in use?"
    answer: "The Massachusetts Constitution of 1780. It is also the oldest written constitution still in force anywhere in the world."

  - question: "How long is the U.S. Constitution compared with state constitutions?"
    answer: "The original U.S. Constitution runs about 4,543 words, shorter than any state's. The size of each state's legislature, shown in [state legislature size by state](/rankings/government/state-legislature-size-by-state), is also set in its constitution."

