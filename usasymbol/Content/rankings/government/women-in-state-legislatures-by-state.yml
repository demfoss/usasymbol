      - "West Virginia ranks last with 16 women among 134 legislators, 11.9%. Its Senate has only four women among 34 members. South Carolina (24 of 170) and Mississippi (27 of 174) follow, and Tennessee (17.4%) and Alabama (18.6%) complete the bottom five."
      - "Wyoming (25.8%) shows how history and today can diverge. It gave women the vote as a territory in 1869, long before the rest of the country, yet 24 of its 93 seats are held by women today, and it ranks 41st."
