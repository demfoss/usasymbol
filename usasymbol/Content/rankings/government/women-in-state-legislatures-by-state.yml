    title: "States With the Most Women Legislators"
    paragraphs:
      - "New Hampshire has 150 women legislators, far more than any other state, because its House has 400 members and is the largest in the country. Its share still stands at 35.4% of 424 seats. Pennsylvania (85) comes next, then Illinois and Vermont with 78 each."
      - "Across all 50 states, women hold 2,480 of 7,386 seats, or 33.6%. Larger states can have many women yet middling shares. Pennsylvania ranks 27th at 33.6% and Georgia 31st at 32.6%, while Nevada reaches first place with only 39 women. Chamber sizes differ widely, as [state legislature size](/rankings/government/state-legislature-size-by-state) shows."
