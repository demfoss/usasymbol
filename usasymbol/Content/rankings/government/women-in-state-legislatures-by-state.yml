  description: "Women hold 61.9% of Nevada's legislative seats, the most of any state. West Virginia has the fewest at 11.9%, with 16 of 134 seats."

page:
  h1: "Women in State Legislatures by State"

  quick_answer:
    - "Women in state legislatures hold the largest share in Nevada, 61.9% of seats. Nevada became the first state with a women-majority legislature in 2019 and has stayed above half since."
    - "West Virginia has the smallest share at 11.9%, only 16 women among 134 legislators. South Carolina (14.1%) and Mississippi (15.5%) are the next lowest, and all three have large chambers with few women."
    - "Women hold a majority in three legislatures. New Mexico (52.7%) and Colorado (52.0%) join Nevada, while Arizona (48.9%) and California (48.3%) sit just under half."

  methodology: "Women legislators and total seats per state from the Center for American Women and Politics at Rutgers, 2026 state legislature tables, checked October 2026. Percent is women divided by total seats in both chambers. D.C. is excluded."

  sources:
    - name: "Center for American Women and Politics. Women in State Legislatures"
      url: "https://cawp.rutgers.edu/data/levels-office/state-legislature"
      description: "State-by-state counts of women legislators, total seats and percent women"
