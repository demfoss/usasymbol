sections:
  - id: women-majority-state-legislatures
    icon: "fa-solid fa-venus"
    title: "Women-Majority State Legislatures"
    paragraphs:
      - "Nevada made history in 2019 as the first state where women held most legislative seats, and it now stands at 39 of 63, or 61.9%. Its part-time legislature has just 63 members and meets for 120 days every other year."
      - "New Mexico (52.7%) and Colorado (52.0%) are the other two states with a majority. Colorado also has a long record, since it elected the first women to any state legislature in the country in 1894. Arizona (48.9%) and California (48.3%) are the closest to joining them, and Arizona elects two House members from each of its legislative districts."
