faq:
  - question: "What state has the most women in its legislature?"
    answer: "Nevada, where women hold 39 of 63 seats, or 61.9%. New Mexico (52.7%) and Colorado (52.0%) are the only other states with a majority."
  - question: "Which state has the fewest women in its legislature?"
    answer: "West Virginia, with 16 women among 134 legislators, or 11.9%. South Carolina (14.1%) and Mississippi (15.5%) are next."
  - question: "When did Nevada get a women-majority legislature?"
    answer: "In 2019, the first time any state legislature had more women than men. The share has grown since, and women now hold 61.9% of Nevada's seats, with 39 of 63."
  - question: "What percent of state legislators are women?"
    answer: "Women hold 2,480 of 7,386 state legislative seats across the 50 states, which is 33.6%. The share ranges from 11.9% in West Virginia to 61.9% in Nevada."
  - question: "Why does New Hampshire have so many women legislators?"
    answer: "Its House has 400 members, the largest in the country, and its salary is a token $200 for a two-year term. That adds up to 150 women in total, the most of any state, though the share is 35.4%."
  - question: "Where does California rank for women in the legislature?"
    answer: "California ranks fifth. Women hold 58 of its 120 seats, or 48.3%, a little behind Arizona (48.9%)."
  - question: "Which states are closest to a women-majority legislature?"
    answer: "Arizona is the closest at 48.9%, with 44 women among 90 legislators. California follows at 48.3%, and Oregon is at 45.6%."

