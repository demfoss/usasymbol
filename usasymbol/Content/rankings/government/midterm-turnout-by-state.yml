  - id: midterm-vs-presidential-turnout-by-state
    icon: "fa-solid fa-chart-line"
    title: "Midterm vs Presidential Turnout by State"
    paragraphs:
      - "Every state drops when no presidential race tops the ballot. Mississippi fell 25.2 points from 2024 to 2022, the most of any state, and Tennessee fell 25.0. Mississippi had no Senate or governor's race in 2022, and Tennessee's governor won reelection by a wide margin, so nothing at the top of either ballot felt close."
      - "Oregon dropped only 6.3 points and Hawaii 7.3. Both mail ballots to all voters, so the effort of voting barely changes between years. New Jersey (22.7) and Idaho (22.4) also fell hard. New Jersey had no statewide race in 2022. [Early voting by state](/rankings/law/early-voting-by-state) shows how many states now give voters weeks to cast a ballot."
    table:
      columns:
