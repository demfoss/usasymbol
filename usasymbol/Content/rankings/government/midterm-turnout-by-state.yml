seo:
  title: "Midterm Voter Turnout by State | Map & Comparisons"
  description: "Oregon had the highest 2022 midterm turnout at 62.6% of eligible voters. Mississippi was lowest at 32.5%. Hawaii gained the most since 2018."

page:
  h1: "Midterm Voter Turnout by State"

  quick_answer:
    - "Midterm turnout was highest in Oregon in 2022, at 62.6% of eligible voters and up 3.3 points from 2018. Oregon mails a ballot to every registered voter, which keeps turnout high without a presidential race."
    - "Mississippi had the lowest midterm turnout at 32.5%, with no Senate or governor's race on its ballot. It fell 10.8 points from 2018, when the state held two Senate contests."
    - "North Dakota had the biggest fall since 2018, 15.9 points, after a closely watched Senate race that year. Hawaii gained 9.3 points, helped by its switch to all-mail elections in 2020."

  methodology: "Voting-eligible population (VEP) turnout, total ballots counted divided by eligible citizens, from the University of Florida Election Lab for the 2018 and 2022 general elections. The 2024 presidential rate behind the drop-off column is the same measure from the United States Elections Project. D.C. is excluded. Checked October 2026."

  sources:
    - name: "University of Florida Election Lab. 2022 General Election Turnout"
      url: "https://election.lab.ufl.edu/voter-turnout/2022-general-election-turnout/"
      description: "VEP turnout rates by state for the November 2022 midterm"
    - name: "University of Florida Election Lab. 2018 General Election Turnout"
      url: "https://election.lab.ufl.edu/voter-turnout/2018-general-election-turnout/"
      description: "VEP turnout rates by state for the November 2018 midterm"
    - name: "United States Elections Project. 2024 Turnout Data"
      url: "https://electproject.github.io/Early-Vote-2024G/index.html"
      description: "VEP turnout estimates by state for the 2024 presidential election"

