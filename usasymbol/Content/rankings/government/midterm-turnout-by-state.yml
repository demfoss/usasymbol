faq:
  - question: "What state had the highest midterm turnout in 2022?"
    answer: "Oregon, at 62.6% of eligible voters. Maine (60.6%) and Wisconsin (60.1%) were next. Oregon mailed ballots to every registered voter."
  - question: "What state had the lowest midterm turnout in 2022?"
    answer: "Mississippi, at 32.5%, followed by Tennessee (33.3%) and West Virginia (35.4%). Mississippi and West Virginia had neither a Senate nor a governor's race on the ballot."
  - question: "What was national midterm turnout in 2018 and 2022?"
    answer: "Turnout of eligible voters was 50.9% in 2018 and 45.9% in 2022. That 2022 figure is 17.8 points below the 63.7% of the 2024 presidential election."
  - question: "Why is midterm turnout lower than in presidential years?"
    answer: "A presidential race pulls in occasional voters who skip elections without one at the top of the ballot. Oregon and Hawaii, which mail every voter a ballot, saw the smallest drops between 2024 and 2022, both under 8 points."
  - question: "Which state's midterm turnout rose the most from 2018 to 2022?"
    answer: "Hawaii, up 9.3 points from 30.9% to 40.2%. The state ran its first all-mail elections in 2020. Pennsylvania (+3.4) and Oregon (+3.3) followed."
  - question: "Which states had higher turnout in 2022 than in 2018?"
    answer: "Twelve states. They are Hawaii, Pennsylvania, Oregon, New Hampshire, Michigan, Arizona, Maine, Nevada, Vermont, Arkansas, New Mexico, and South Dakota. The other 38 states fell."
  - question: "What was midterm voter turnout in Texas in 2022?"
    answer: "Texas turnout was 41.5%, ranking 41st and tied with Arkansas. It was down 3.6 points from 45.1% in 2018 and 14.5 points below the 2024 presidential rate."

