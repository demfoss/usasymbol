sections:
  - id: highest-midterm-voter-turnout-states
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Midterm Voter Turnout by State"
    paragraphs:
      - "Oregon led the 2022 midterms at 62.6%. It sends every registered voter a ballot weeks ahead, so voting happens at the kitchen table, and 2022 also had a three-way governor's race. Voters in Washington (54.8%) and Colorado (58.2%) get the same mailed ballot, as the page on [mail-in voting by state](/rankings/law/mail-in-voting-by-state) explains."
      - "Michigan (59.0%) rose 2.4 points since 2018. Its voters approved no-excuse absentee voting and Election Day registration that year, both were in force by 2022, and an abortion rights amendment drew voters to the ballot. Minnesota still had the top rate in 2018 at 63.1% before slipping to 59.5%."
    table:
      columns:
