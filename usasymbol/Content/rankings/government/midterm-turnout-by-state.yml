  - id: midterm-turnout-2018-vs-2022
    icon: "fa-solid fa-arrows-left-right"
    title: "2018 vs 2022 Midterm Turnout by State"
    paragraphs:
      - "National turnout slipped from 50.9% in 2018 to 45.9% in 2022, and only 12 states rose. Hawaii gained the most, 9.3 points, after it began mailing a ballot to every voter in 2020. In 2018 it had the lowest turnout in the country at 30.9%."
      - "North Dakota lost 15.9 points. In 2018 it hosted one of the nation's most-watched Senate races, and in 2022 its Senate seat was not close. Montana (-7.6) and Indiana (-8.9) also had tight Senate races in 2018 that were not repeated, while Mississippi held two Senate contests in 2018 and none in 2022. For same-day signup rules, see [same-day voter registration states](/rankings/law/same-day-voter-registration-states)."
    table:
