faq:
  - question: "What are the three Senate classes?"
    answer: "Classes I, II and III divide the 100 seats into three staggered groups. Each group normally faces voters once every six years."
  - question: "Which Senate class is up in 2026?"
    answer: "Class II. Its regular terms end on January 3, 2027, after the November 2026 election."
  - question: "Can both senators from one state be in the same class?"
    answer: "No. Each state's two seats belong to different classes, a design used since the first class assignments in 1789."
  - question: "What Senate classes does Texas have?"
    answer: "Texas has Class I and Class II seats. Their regular election years in the current cycle are 2030 and 2026."
  - question: "What Senate classes does California have?"
    answer: "California has Class I and Class III seats. Their regular elections fall in 2030 and 2028 in the current cycle."
  - question: "Does a special election change a Senate seat's class?"
    answer: "No. A special-election winner completes the term attached to that seat, and the seat stays in its permanent class."

