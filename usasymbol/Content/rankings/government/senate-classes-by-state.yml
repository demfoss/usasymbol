sections:
  - id: how-senate-classes-work
    icon: "fa-solid fa-landmark"
    title: "How Senate Classes Work"
    paragraphs:
      - "Every state has two senators, but the Constitution separates their seats into different classes. The first Senate assigned classes by lot in 1789 so roughly one-third of the chamber would face election every two years instead of all 100 seats turning over together."
      - "Class numbers belong to seats, not people. A replacement senator inherits the seat's class and expiration date, which preserves the staggered schedule even after a resignation or special election."
  - id: senate-election-years-by-class
    icon: "fa-solid fa-calendar-days"
    title: "Senate Election Years by Class"
    paragraphs:
      - "Class II seats reach their regular election in 2026, followed by Class III in 2028 and Class I in 2030. Texas therefore votes on its Class II seat in 2026 and its Class I seat in 2030, while Alabama votes on Class II in 2026 and Class III in 2028."
      - "No state has two seats in one class. That rule prevents a state's two regular Senate elections from landing on the same ballot, although an unexpected vacancy can create a special election beside a regular contest."

