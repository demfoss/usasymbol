  description: "Every state has senators in two of the three classes. Class II seats face voters in 2026, Class III in 2028 and Class I in 2030."

page:
  h1: "Senate Classes by State"
  quick_answer:
    - "Senate classes by state place each state's two seats in different classes, so no state elects both senators in the same regular election."
    - "Eighteen states pair Classes II and III, the most common combination. Fifteen pair Classes I and II, while 17 pair Classes I and III."
    - "Class II seats are elected in 2026, Class III seats in 2028 and Class I seats in 2030. Each winner normally serves six years."
  methodology: "Class assignments and term expiration years come from the U.S. Senate roster, checked November 2026. Election years reflect the regular six-year cycle and exclude special elections."
