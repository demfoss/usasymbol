faq:
  - question: "What were the 13 original colonies?"
    answer: "The 13 original colonies were Virginia, Massachusetts, New Hampshire, Maryland, Connecticut, Rhode Island, Delaware, North Carolina, South Carolina, New York, New Jersey, Pennsylvania, and Georgia. They were founded between 1607 (Virginia) and 1732 (Georgia) and declared independence from Britain on July 4, 1776. All 13 became states by May 29, 1790."

  - question: "Which of the 13 colonies was founded first?"
    answer: "Virginia was the first colony, established in 1607 with the founding of Jamestown — the first permanent English settlement in America. Virginia had 169 years of colonial history before the Declaration of Independence in 1776, the longest of any colony. It ratified the Constitution as the 10th state on June 25, 1788."

  - question: "Which of the 13 colonies was founded last?"
    answer: "Georgia was the last colony founded, in 1732, making it the only colony established after 1700. Georgia had just 44 years of colonial history before the Declaration of Independence in 1776, the shortest of any colony. Despite being the newest colony, Georgia ratified the Constitution 4th on January 2, 1788."

  - question: "What are the 3 regions of the 13 colonies?"
    answer: "The 13 colonies formed three regions: the 4 New England colonies (Massachusetts, New Hampshire, Connecticut, Rhode Island), the 4 Middle colonies (Delaware, Pennsylvania, New Jersey, New York), and the 5 Southern colonies (Virginia, Maryland, North Carolina, South Carolina, Georgia). The regions are defined by geography, economy, and settlement patterns from the colonial era."

  - question: "Which colony ratified the Constitution first?"
    answer: "Delaware ratified the U.S. Constitution first, on December 7, 1787, earning its nickname 'The First State.' All 30 delegates at Delaware's convention voted unanimously in favor. Pennsylvania ratified 5 days later on December 12, and New Jersey 6 days after that on December 18. The three states ratified within 11 days of each other."

  - question: "Which colony was last to ratify the Constitution?"
    answer: "Rhode Island was the last of the 13 original colonies to ratify the Constitution, on May 29, 1790, becoming the 13th state. Rhode Island initially refused to attend the Constitutional Convention in 1787 and did not ratify until more than two years after Delaware. North Carolina was the second-to-last, ratifying 12th on November 21, 1789."

