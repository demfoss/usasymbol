page:
  h1: "SNAP Recipients by State 2026"
  quick_answer:
    - "SNAP recipients by state are most numerous in California, where 5,161,672 people participated in February 2026. The country's largest state population drives much of that total."
    - "Wyoming has the fewest participants at 24,262. Its small population keeps the raw count below every other state."
    - "Texas ranks second with 3,112,380 participants, followed by New York with 2,790,322 and Florida with 2,546,175."
  methodology: "Counts are USDA FNS initial February 2026 participation figures published May 8, 2026. Washington, D.C. and U.S. territories are excluded."
