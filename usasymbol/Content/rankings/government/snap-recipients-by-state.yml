faq:
  - question: "Which state has the most SNAP recipients?"
    answer: "California has the most, with 5,161,672 participants in February 2026. California's very large population helps push the raw total to first place."
  - question: "Which state has the fewest SNAP recipients?"
    answer: "Wyoming has the fewest, with 24,262 participants. Wyoming also has the smallest state population in the country."
  - question: "How many SNAP recipients are in Texas?"
    answer: "Texas has 3,112,380 SNAP participants, the second-highest total after California."
  - question: "How many SNAP recipients are in New York?"
    answer: "New York has 2,790,322 participants and ranks third among the states."
  - question: "What does SNAP stand for?"
    answer: "SNAP stands for Supplemental Nutrition Assistance Program. Benefits are loaded onto electronic cards that eligible households can use for approved food purchases."

