    paragraphs:
      - "New Jersey's 79.9% is the only rate in the country near four in five citizens; its closest competitor, California, sits nearly 8 points behind at 71.8%. New York and Massachusetts round out a top four clustered in the low-to-mid 70s."
      - "Every state in the top ten either borders an ocean or sits within easy reach of a major international airport, and most combine higher household incomes with dense immigrant and naturalized-citizen populations, both of which correlate with more frequent international travel."

