          state_slug: "indiana"
          ownership_rate: 35.5
        - rank: 41
          state: "Ohio"
          state_slug: "ohio"
          ownership_rate: 37.0
    paragraphs:
      - "West Virginia's 20.7% and Mississippi's 22.1% are the only rates in the country below one in four citizens. Both states are landlocked or Gulf-adjacent without a major international gateway airport, and both rank among the lowest in the country for median household income."
      - "The bottom ten skews heavily toward the South and lower Midwest, running from West Virginia and Mississippi through Alabama, Arkansas, Kentucky, Louisiana, Oklahoma, Tennessee, Indiana, and Ohio, states farther from a coastline or the Canadian border and with fewer nonstop international flight options."

  - id: "how-many-americans-have-a-passport"
    icon: "fa-solid fa-globe"
    title: "How Many Americans Have a Passport"
    paragraphs:
      - "About 53.1% of U.S. citizens, roughly 165 million people, held a valid passport as of FY2024, leaving an estimated 146 million citizens without one. That is a dramatic shift from the early 1990s, when only about 5% of Americans held a passport, driven largely by tightened post-9/11 rules that made a passport mandatory for most air travel to Canada, Mexico, and the Caribbean."
      - "The 55-plus point gap between top-ranked New Jersey and bottom-ranked West Virginia is wider than the national rate itself, underscoring how unevenly passport ownership is distributed. Coastal, higher-income, and immigrant-heavy states cluster well above the 53.1% national average, while interior Southern and Midwestern states cluster well below it."

