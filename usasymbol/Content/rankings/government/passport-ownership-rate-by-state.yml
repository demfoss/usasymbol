page:
  h1: "Passport Ownership Rate by State"

  quick_answer:
    - "New Jersey has the highest estimated passport ownership rate of any state, about 79.9% of citizens. California (71.8%), Massachusetts (71.2%), and New York (71.1%) round out the top four."
    - "West Virginia has the lowest rate at about 20.7%, followed by Mississippi (22.1%), Alabama (27.7%), Arkansas (28.4%), and Kentucky (29.0%)."
    - "About 53.1% of U.S. citizens hold a valid passport nationwide, up sharply from roughly 5% in the early 1990s, though the gap between the top and bottom states still exceeds 55 percentage points."

  methodology: "Figures are the Center for American Progress's estimated share of each state's citizen population holding a valid U.S. passport as of FY2024, built from U.S. State Department passport-issuance data (reported for FY2020-2024, estimated proportionally for FY2015-2019) against Census Bureau citizen-population totals, on the assumption that adult passports remain valid for their standard 10-year term. These are modeled estimates, not a direct survey of who currently holds a passport, and do not separately track passport cards or renewals."

  sources:
    - name: "Center for American Progress"
      url: "https://www.americanprogress.org/article/the-save-act-would-disenfranchise-millions-of-citizens/"
      description: "Estimated passport possession rate by state, built from State Department and Census Bureau data (published January 2025, based on FY2024 issuance)"
    - name: "U.S. Department of State — Bureau of Consular Affairs"
      url: "https://travel.state.gov/content/travel/en/about-us/reports-and-statistics.html"
      description: "Passport issuance by state or territory by fiscal year, the underlying source data"
    - name: "U.S. Census Bureau"
      url: "https://www.census.gov"
      description: "Citizen population estimates used to normalize issuance figures into a per-state ownership rate"

