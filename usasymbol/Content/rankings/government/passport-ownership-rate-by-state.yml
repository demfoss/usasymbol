faq:
  - question: "Which state has the highest passport ownership rate?"
    answer: "New Jersey, at an estimated 79.9% of citizens. California (71.8%), Massachusetts (71.2%), and New York (71.1%) are the only other states above 70%."

  - question: "Which state has the lowest passport ownership rate?"
    answer: "West Virginia, at an estimated 20.7% of citizens. Mississippi (22.1%) is the only other state below 25%."

  - question: "What percentage of Americans have a passport?"
    answer: "About 53.1% of U.S. citizens hold a valid passport nationwide, roughly 165 million people, though the rate ranges from 20.7% in West Virginia to 79.9% in New Jersey."

  - question: "Why do some states have much higher passport ownership than others?"
    answer: "Coastal states with major international airports, higher household incomes, and larger naturalized-citizen populations, like New Jersey, California, and New York, travel abroad far more often. Interior Southern and Midwestern states farther from a coastline or international gateway, like West Virginia and Mississippi, rank lowest."

  - question: "Has passport ownership increased over time?"
    answer: "Yes, sharply. Only about 5% of Americans held a passport in the early 1990s. That share climbed to roughly 53.1% by FY2024, driven mainly by post-9/11 rules requiring a passport for most air travel to Canada, Mexico, and the Caribbean."

