faq:
  - question: "Which state has the largest rainy day fund?"
    answer: "Wyoming has the largest rainy day fund relative to annual spending at 72.5%. Its reliance on volatile mineral revenue makes a large fiscal cushion especially useful."
  - question: "Why does Wyoming have the largest rainy day fund?"
    answer: "Wyoming saves heavily because severance tax collections can rise or fall with energy production and commodity prices. Its $1.626 billion fund equals 72.5% of annual general fund spending."
  - question: "Which state has the smallest rainy day fund?"
    answer: "New Jersey reports no rainy day fund balance for fiscal 2025. Washington is next at 3.5% of general fund spending."
  - question: "How large is the Texas rainy day fund?"
    answer: "Texas holds $24.841 billion in its rainy day fund, equal to 32.6% of annual general fund spending. That is the fourth-highest share among states."
  - question: "How large is the California rainy day fund?"
    answer: "California holds $50.225 billion, the largest dollar balance in the table. That amount equals 21.9% of the state's annual general fund spending."

