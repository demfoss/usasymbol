  description: "24 states voted solidly Republican and 13 solidly Democratic in 2024. Pennsylvania, Michigan, and Wisconsin are the closest swing states."

page:
  h1: "Red States, Blue States, and Swing States"

  quick_answer:
    - "The 2024 presidential map produced 24 red states voting Republican (219 electoral votes) and 13 blue states voting Democratic (173 electoral votes), with 3 swing states decided by under 2 points."
    - "Pennsylvania (R+2), Michigan (R+1), and Wisconsin (R+1) are the three swing states of 2024, each decided by under 2 points. All three flipped from the Democratic column in 2020."
    - "Wyoming is the most Republican state at R+44 in 2024. Maryland and Vermont are the most Democratic at D+30 each. The spread between the two extremes is 74 points."

  methodology: "Classifications use 2024 presidential margins and patterns across 2016, 2020, and 2024: solid (same direction all three cycles by 10+ points), lean (same direction two of three), or swing (switched parties between 2020 and 2024 by under 3 points). Maine and Nebraska are classified by statewide result. Source: Associated Press 2024 presidential election results."

  sources:
    - name: "Associated Press — 2024 Presidential Election Results"
      url: "https://apnews.com/projects/election-results-2024/presidential/"
      description: "Official 2024 presidential election certified results by state"
    - name: "Federal Election Commission — Election Results"
      url: "https://www.fec.gov/introduction-campaign-finance/election-results-and-voting-information/"
      description: "FEC certified federal election results"

