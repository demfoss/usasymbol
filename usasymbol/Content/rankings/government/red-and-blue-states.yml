compare:
  metric_slug: government
  title: "Compare Political Lean Between Two States"
  description: "Pick any two states to see a side-by-side breakdown of 2024 election results, electoral votes, and related civic data."
  button_text: "Compare states"
  icon: "fa-solid fa-scale-balanced"
  default_state_a: wyoming
  default_state_b: maryland

sections:
  - id: "swing-states-2024"
    icon: "fa-solid fa-arrows-left-right"
    title: "Swing States 2024"
    paragraphs:
      - "Pennsylvania (R+2), Michigan (R+1), and Wisconsin (R+1) are the three closest states in the 2024 election. All three were decided by under 2 percentage points. Together they hold 44 electoral votes, a bloc that shifted from the Democratic column in 2020 to the Republican column in 2024."
      - "The three states sit within 1 point of each other on the margin column, the tightest cluster in the table. Pennsylvania's 19 electoral votes make it the single most valuable swing state; Wisconsin's 10 make it the smallest of the three."

  - id: "most-republican-states"
    icon: "fa-solid fa-circle"
    title: "Most Republican States in 2024"
    paragraphs:
      - "Wyoming leads the table at R+44, followed by North Dakota at R+34 and Idaho at R+33. These three states have the largest Republican margins in the 2024 election and together hold just 10 electoral votes, the floor figure for three states that each hold the minimum 3-vote allocation."
      - "Oklahoma and West Virginia are tied at R+32, with Arkansas close behind at R+31. The top six most-Republican states all sit above R+30, and all six are in the Plains, Mountain West, or Appalachian regions of the table."

  - id: "most-democratic-states"
    icon: "fa-solid fa-circle"
    title: "Most Democratic States in 2024"
    paragraphs:
      - "Maryland and Vermont share the widest Democratic margins in the table at D+30 each. Massachusetts and Hawaii follow at D+28, making four states that voted Democratic by 28 points or more. Combined, those four states hold 28 electoral votes."
      - "California's D+21 ranks fifth on the Democratic side, but its 54 electoral votes make it the single largest contributor to the Democratic electoral total. The 13 solid-blue states combined hold 173 electoral votes, 56 fewer than the 229 held by the 24 solid-red states and 4 lean-red states together."

