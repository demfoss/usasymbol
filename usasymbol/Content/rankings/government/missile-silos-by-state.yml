faq:
- question: Which state has the most missile silos?
  answer: Montana and North Dakota tie with 150 Minuteman launch facilities each. Both states contain a complete missile field.
- question: How many missile silos are in Wyoming?
  answer: Wyoming has 50 Minuteman launch facilities. They belong to the F.E. Warren complex, which extends into Colorado and Nebraska.
- question: How many missile silos are in Montana?
  answer: Montana has 150 Minuteman launch facilities connected to the 341st Missile Wing at Malmstrom Air Force Base.
- question: How many missile silos are in North Dakota?
  answer: North Dakota has 150 Minuteman launch facilities connected to the 91st Missile Wing at Minot Air Force Base.
- question: Why are missile silos spread far apart?
  answer: Wide spacing makes the force harder to destroy in one strike. Each silo is unmanned and hardened, while crews monitor groups of facilities from separate underground control centers.
