    - { rank: 3, state: Wyoming, missile_silos: 50 }
- id: why-montana-north-dakota-lead
  title: Why Montana and North Dakota Lead
  paragraphs:
  - Montana and North Dakota each lead with a complete 150-silo missile field under one state. The northern Great Plains offered open land, low population density, road access, and shorter polar routes toward Cold War targets when Minuteman sites were selected.
  - Colorado, Nebraska, and Wyoming tie at 50 because state lines divide the F.E. Warren field. Each state contains one squadron-sized block of five alert facilities and 50 remote silos.
