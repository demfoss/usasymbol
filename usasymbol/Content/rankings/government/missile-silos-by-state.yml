sections:
- id: states-with-active-missile-silos
  title: States With Missile Silos
  paragraphs:
  - Montana and North Dakota each hold 150 launch facilities. Their missile fields spread silos miles apart across open plains, a design intended to keep a single attack from disabling the entire force.
  - Colorado, Nebraska, and Wyoming each contain 50 facilities. Those three blocks form one 150-silo complex managed from F.E. Warren Air Force Base near Cheyenne.
