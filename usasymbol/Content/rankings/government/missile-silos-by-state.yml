page:
  h1: Missile Silos by State
  quick_answer:
  - Missile silos by state are concentrated in Montana and North Dakota, which each have 150 active Minuteman launch facilities across broad Great Plains missile fields.
  - Colorado, Nebraska, and Wyoming each have 50 launch facilities tied to the F.E. Warren missile complex.
  - The 450 launch facilities support a force of 400 Minuteman III missiles. Fifty silos are maintained without a deployed missile under the force structure.
  methodology: Air Force records identify 450 Minuteman launch facilities across five states. Counts assign each 50-silo F.E. Warren squadron area to Colorado, Nebraska, or Wyoming.
