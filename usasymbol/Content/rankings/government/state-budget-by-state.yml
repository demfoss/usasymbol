faq:
  - question: "Which state has the largest budget?"
    answer: "California has the largest state budget at $510.283 billion in estimated fiscal 2025 spending. Its total exceeds every other state because it funds services for the country's largest state population."
  - question: "Which state has the smallest budget?"
    answer: "Wyoming has the smallest state budget at $5.588 billion. Wyoming is also the least populous state, so its agencies and statewide programs serve fewer residents."
  - question: "What is the state budget in Texas?"
    answer: "Texas has an estimated fiscal 2025 state budget of $146.620 billion, ranking fourth behind California, New York, and Illinois."
  - question: "What is the state budget in New York?"
    answer: "New York records $241.471 billion in estimated fiscal 2025 spending. That places it second nationally."
  - question: "What does a state budget pay for?"
    answer: "State budgets fund programs such as Medicaid, public schools, higher education, corrections, transportation, and other government services. California's $510.283 billion total combines money from state funds, federal funds, and bonds."

