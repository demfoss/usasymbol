sections:
  - id: "why-oklahoma-has-the-worst-pollen-allergies"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Why Oklahoma Has the Worst Pollen Allergies"
    paragraphs:
      - "Oklahoma's outdoor pollen severity score of 9.18, the highest of any state, blends three allergen scores that are each severe on their own. Tree pollen scores 9.80, the highest of any allergen category recorded for the state. Grass pollen matches the overall average at 9.18, and ragweed follows close behind at 8.57."
      - "Texas sits third overall at 7.96, driven by its own extremes rather than an even spread. The state posts perfect 10 scores for both tree and grass pollen, the highest of any state on either measure, while its ragweed score is comparatively low. Oklahoma and Texas anchor a stretch of the country where a warming climate has extended pollen seasons, part of what researchers call the Southern pollen belt."

  - id: "southern-and-southwestern-states-dominate-worst-allergies"
    icon: "fa-solid fa-map"
    title: "States With the Worst Allergies by Region"
    paragraphs:
      - "Eight of the ten worst states for outdoor pollen are in the South or Southwest: Oklahoma (9.18), Arkansas (8.23), Texas (7.96), New Mexico (7.76), Florida (7.69), Arizona (7.28), South Carolina (7.07), and Kansas (6.87). Only Louisiana (6.73) and Mississippi (6.60) round out the top ten, both also Southern states."
      - "Arkansas ranks second overall at 8.23 and also carries the third-highest indoor allergen score at 7.24, one of only two states in the outdoor top ten with a similarly high indoor score. Mississippi shows the opposite pattern: its outdoor score of 6.60 ranks 10th, but its indoor allergen score of 7.51 is the highest of any state with outdoor pollen data."

  - id: "states-with-the-mildest-allergy-seasons"
    icon: "fa-solid fa-leaf"
    title: "States With the Mildest Allergy Seasons"
    paragraphs:
      - "Maine has the mildest outdoor pollen season of any state at 1.90, more than 7 points below Oklahoma. Vermont follows at 2.04, and Minnesota is third-lowest at 2.31. All three sit in the Northeast or Upper Midwest, far from the Southern pollen belt."
      - "Nevada posts the lowest indoor allergen score of any state at 1.89, even though its outdoor pollen score of 6.02 lands it in the top 15. Utah shows a similar split, ranking 29th outdoors at 4.42 but second-lowest indoors at 1.97."

