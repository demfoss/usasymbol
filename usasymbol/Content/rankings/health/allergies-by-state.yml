faq:
  - question: "Which state has the worst allergies?"
    answer: "Oklahoma has the worst outdoor pollen severity score of any state at 9.18 out of 10. Its tree pollen score of 9.80 is the highest recorded for any state."

  - question: "Which state has the mildest allergy season?"
    answer: "Maine has the mildest outdoor pollen season at 1.90, followed by Vermont at 2.04. Both are more than 7 points below Oklahoma's top score."

  - question: "Why does Oklahoma have such bad allergies?"
    answer: "Oklahoma's overall pollen severity score of 9.18 comes from consistently high scores across all three allergen types tracked: tree pollen at 9.80, grass at 9.18, and ragweed at 8.57. No other state posts a tree pollen score that high."

  - question: "What is the allergy severity score in Texas?"
    answer: "Texas has an outdoor pollen severity score of 7.96, ranking third among all states. It posts perfect 10 scores for both tree and grass pollen, tied for the highest of any state, while its ragweed score is comparatively low."

  - question: "Are allergies worse in the South?"
    answer: "Eight of the ten worst states for outdoor pollen are in the South or Southwest, including Oklahoma, Arkansas, Texas, New Mexico, and Florida. A warming climate has extended pollen seasons across this stretch of the country, sometimes called the Southern pollen belt."

  - question: "What is the allergy severity score in California?"
    answer: "California has an outdoor pollen severity score of 6.29, ranking 12th among all states. Its indoor allergen score of 4.65 is lower, ranking closer to the middle of the pack."

