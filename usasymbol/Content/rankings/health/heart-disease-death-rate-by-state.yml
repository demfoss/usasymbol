faq:
  - question: "Which state has the highest heart disease death rate?"
    answer: "Oklahoma, with a rate of 254.3 per 100,000 and 12,432 deaths in 2024. Mississippi at 236.5 and Alabama at 223.9 come next."
  - question: "Which state has the lowest heart disease death rate?"
    answer: "Alaska, at 116.3 per 100,000. Colorado at 118.8 and Massachusetts at 121.5 are close behind."
  - question: "What is the heart disease death rate in Texas?"
    answer: "Texas is at 163.1, ranking 18th. Its 50,723 deaths are the second most of any state, which reflects the second-largest population in the country."
  - question: "What is the heart disease death rate in Florida?"
    answer: "Florida is at 134.5, ranking 41st, even though it had 50,008 deaths. A large retiree population produces many deaths, and the age adjustment removes that effect from the rate."
  - question: "Why does Mississippi have such a high heart disease death rate?"
    answer: "Mississippi is at 236.5, second highest. High blood pressure, obesity and little exercise combine with poverty and a shortage of doctors in rural counties, which delays treatment."
  - question: "What is the heart disease death rate in California?"
    answer: "California is at 130.4, ranking 45th. It had the most deaths of any state at 62,439, but spread across the nation's largest population."
