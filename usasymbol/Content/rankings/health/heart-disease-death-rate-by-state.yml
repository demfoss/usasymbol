page:
  h1: "Heart Disease Death Rate by State"
  quick_answer:
    - "Oklahoma has the highest heart disease death rate at 254.3 per 100,000 people, driven by high smoking and obesity and long drives to hospitals in rural counties."
    - "Alaska has the lowest rate at 116.3, less than half of Oklahoma's. Colorado follows at 118.8, in a state where adults are the least likely in the country to skip exercise."
    - "Massachusetts at 121.5 and Minnesota at 121.9 also rank among the lowest, and they are home to Mass General and the Mayo Clinic, two of the best-known heart care centers."
  methodology: "Age-adjusted death rate from diseases of the heart per 100,000 population, 2024 final data, from the CDC National Center for Health Statistics (National Vital Statistics System via CDC WONDER). Rank 1 is the highest rate. The District of Columbia (154.6) is excluded."
