    icon: "fa-solid fa-heart"
    title: "States With the Lowest Heart Disease Death Rate"
    paragraphs:
      - "Alaska records 116.3, the lowest rate of any state. Colorado is next at 118.8, and it has the lowest share of inactive adults in the nation, with trails and ski slopes close to every city."
      - "Massachusetts at 121.5 and Minnesota at 121.9 follow. Boston hospitals such as Massachusetts General and Brigham and Women's treat heart patients from around the world, and Minnesota is where Medtronic built one of the first wearable pacemakers in 1957 and where the Mayo Clinic sits in Rochester."
