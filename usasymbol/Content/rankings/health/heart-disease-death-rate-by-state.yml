sections:
  - id: why-oklahoma-has-the-highest-heart-disease-death-rate
    icon: "fa-solid fa-heart-pulse"
    title: "Why Oklahoma Has the Highest Death Rate"
    paragraphs:
      - "Oklahoma's rate of 254.3 is the highest in the country. Smoking and obesity run above the national average, and in rural counties a heart attack patient may be a long drive from a hospital that can open a blocked artery."
      - "Mississippi at 236.5, Alabama at 223.9 and Louisiana at 220.0 follow, which makes the Deep South the heaviest burden. Mississippi also has the largest share of inactive adults, as the [physical inactivity by state](/rankings/health/physical-inactivity-by-state) ranking shows, and [smoking rates](/rankings/health/smoking-rate-by-state) are high across much of the group."
