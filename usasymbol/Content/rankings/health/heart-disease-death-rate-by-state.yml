  - id: states-with-the-most-heart-disease-deaths
    icon: "fa-solid fa-chart-column"
    title: "States With the Most Heart Disease Deaths"
    paragraphs:
      - "California recorded 62,439 heart disease deaths in 2024, more than any other state, yet its rate of 130.4 ranks 45th. The count is high because California has the largest population of any state."
      - "Florida had 50,008 deaths, third most, but a rate of only 134.5. The rate is adjusted for age, so a retiree-heavy state is compared fairly with a young one. Texas at 50,723 deaths and Michigan at 26,240 show the opposite pattern, with large counts and rates of 163.1 and 194.7."
