  quick_answer:
    - "Alaska has the highest average cash price for a doctor visit at $142.00, the midpoint of a $112 to $172 market range."
    - "Iowa has the lowest average cash price at $100.00, the only state at or below $103.50 in the data."
    - "New Jersey ($138.00) and Minnesota ($134.00) are the only other states above $130.00, both well ahead of third-place California at $130.50."

  methodology: "Figures are the midpoint of Sidecar Health's published market cash-price range for a returning-patient doctor office visit, by state, drawn from a national claims dataset covering July 2017 to July 2019."

