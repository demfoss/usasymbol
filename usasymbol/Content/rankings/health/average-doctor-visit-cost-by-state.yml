faq:
  - question: "Which state has the most expensive doctor visit?"
    answer: "Alaska has the highest average cash price for a doctor visit at $142.00, drawn from a market range of $112 to $172. No other state exceeds $138.00."

  - question: "Which state has the cheapest doctor visit?"
    answer: "Iowa averages $100.00, the lowest in the data. Kansas and South Dakota are next, both at $103.50."

  - question: "What is the average cost of a doctor visit in the US?"
    answer: "State averages in the data range from $100.00 in Iowa to $142.00 in Alaska. Most states fall between $104.00 and $125.00."

  - question: "How much does a doctor visit cost in California?"
    answer: "California averages $130.50, the fourth highest in the country. That figure sits within a market range of $103 to $158."

  - question: "How much does a doctor visit cost in Texas?"
    answer: "Texas averages $112.50, tied with Virginia and West Virginia for 28th among the 50 states."

  - question: "How much does a doctor visit cost in New York?"
    answer: "New York averages $130.00, tied with Rhode Island for fifth highest. That is $12.00 above Texas."

