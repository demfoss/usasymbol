  description: "Alaska has the highest employer family health insurance premium at $30,132 a year. Mississippi has the lowest at $21,932."

page:
  h1: "Health Insurance Premiums by State"

  quick_answer:
    - "Health insurance premiums are highest in Alaska at $30,132 a year for employer family coverage, a result of remote communities and few hospitals competing on price."
    - "Mississippi has the lowest family premium at $21,932 and the lowest single premium at $7,612, in the state with the lowest median household income in the country."
    - "New York has the highest single premium at $10,913, ahead of Alaska at $10,630. Five of the seven most expensive family premiums belong to Northeastern states."

  methodology: "Average total annual premium per enrolled employee at private-sector establishments that offer health insurance, 2025, from the AHRQ Medical Expenditure Panel Survey Insurance Component as published by KFF. The District of Columbia is not ranked."

  sources:
    - name: "KFF, Average Annual Family Premium per Enrolled Employee For Employer-Based Health Insurance"
      url: "https://www.kff.org/private-insurance/state-indicator/family-coverage/"
      description: "State family premiums, employee and employer contributions, 2025, from the AHRQ MEPS Insurance Component"
    - name: "KFF, Average Annual Single Premium per Enrolled Employee For Employer-Based Health Insurance"
      url: "https://www.kff.org/private-insurance/state-indicator/single-coverage/"
      description: "State single-coverage premiums and contributions, 2025, from the AHRQ MEPS Insurance Component"
