faq:
  - question: "What is the average health insurance premium in the United States?"
    answer: "Employer-sponsored coverage averages $26,281 a year for a family and $9,025 for a single worker."

  - question: "Which state has the highest health insurance premiums?"
    answer: "Alaska has the highest family premium, $3,851 above the U.S. average. New York leads for single coverage instead, with Alaska second."

  - question: "Which state has the cheapest health insurance premiums?"
    answer: "Mississippi is cheapest for both family and single coverage. Montana sits only $57 above it for family coverage."

  - question: "How much is health insurance in California?"
    answer: "California employers pay an average of $27,057 for family coverage, which ranks 14th, and $9,162 for single coverage. Both are above the U.S. averages of $26,281 and $9,025."

  - question: "What is the average health insurance premium in Texas?"
    answer: "Texas averages $25,053 a year for family coverage and $8,543 for single coverage, both below the national figures."

  - question: "How much of the family premium do employees pay?"
    answer: "Employees pay $7,314 on average. Oregon workers pay the most at $9,374, while Montana ($4,967) and Connecticut ($4,979) pay the least, even though Connecticut's total premium is the fifth highest at $28,700."

