    paragraphs:
      - "Alaska leads at $30,132 a year, followed by New York at $29,752, New Jersey at $29,666, and Massachusetts at $29,619. Five of the top seven are Northeastern states, a region packed with academic medical centers and large hospital systems that command high prices."
      - "Single coverage reshuffles the order. New York's $10,913 beats Alaska's $10,630, and Vermont ranks fourth at $10,004 even though its family premium of $25,450 is only 28th."

  - id: "why-alaska-has-the-highest-premiums"
    title: "Why Alaska Has the Highest Premiums"
    paragraphs:
      - "Alaska employers pay more for family coverage than any others in the country because care there is expensive to deliver. Most communities are off the road network, so patients often fly to Anchorage or Seattle for specialty treatment, and a small population leaves few hospitals competing on price."
      - "Alaska also posts the highest [average doctor visit cost](/rankings/health/average-doctor-visit-cost-by-state) of any state, which points to high prices rather than rich benefits."

  - id: "lowest-health-insurance-premiums-by-state"
    title: "Lowest Health Insurance Premiums by State"
    paragraphs:
      - "Mississippi's family premium of $21,932 is $8,200 below Alaska's. The state has the [lowest median household income](/rankings/economy/states-by-median-income) of any state, and lower wages go along with cheaper plans. Montana is the odd one out, 49th for family coverage at $21,989 but 25th for single coverage at $8,899."
      - "Hawaii has required employers to cover workers who log 20 hours a week since its 1974 Prepaid Health Care Act, the first law of its kind. Even so, its family premium of $23,603 ranks 43rd, well below every Northeastern state."

