page:
  h1: "Rural Hospital Closures by State"

  quick_answer:
    - "Rural hospital closures are most common in Texas, with 25 closures and conversions since 2005, 20 of them complete. Texas is the largest state in the lower 48 and has never expanded Medicaid."
    - "Tennessee follows with 14 and North Carolina with 12. North Carolina expanded Medicaid only in December 2023, after the last of its closures."
    - "Colorado, Montana, and Wyoming have no closure on the list, and eight states have exactly one. New York has five, all conversions that kept some services."

  methodology: "Cecil G. Sheps Center for Health Services Research, University of North Carolina, Rural Hospital Closures list, closures and conversions since January 2005, as of 2026. A complete closure ended all health services, and a converted closure ended inpatient care but kept some services. Only the 37 states with a listed closure appear, and the other 13 have none on the list. Rank 1 is the most closures, and tied states share a rank. Share of U.S. is a state total divided by 198."

  sources:
    - name: "Cecil G. Sheps Center for Health Services Research, Rural Hospital Closures"
      url: "https://www.shepscenter.unc.edu/programs-projects/rural-health/rural-hospital-closures/"
