  - id: "states-with-no-rural-hospital-closures"
    title: "States With No Rural Hospital Closures"
    paragraphs:
      - "Colorado, Connecticut, Delaware, Hawaii, Idaho, Massachusetts, Montana, New Hampshire, Oregon, Rhode Island, Utah, Vermont, and Wyoming have none on the list. Connecticut, Delaware, Massachusetts, and Rhode Island are small and mostly urban, so few of their hospitals count as rural."
      - "Montana and Wyoming are among the most thinly settled states, yet their small hospitals have stayed open. Many hold the Critical Access Hospital designation, created in 1997, which pays them cost-based Medicare rates so that a hospital with few patients can survive."

