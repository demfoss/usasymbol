  - id: "complete-rural-hospital-closures-by-state"
    title: "Complete Rural Hospital Closures by State"
    paragraphs:
      - "A complete closure means the building stopped offering any health services, so a town lost its emergency room and its clinic together. Texas has 20 of these, far more than Tennessee, North Carolina, and Missouri at 8 each."
      - "New York shows the opposite pattern. Its five rural losses are all conversions, including Amsterdam Memorial and Moses-Ludington, which stopped inpatient care but kept services open. South Dakota (3), Nebraska (2), and Wisconsin (1) also have only conversions."
