faq:
  - question: "Which state has the most rural hospital closures?"
    answer: "Texas, with 25 closures and conversions since 2005. Twenty of them were complete closures, the most of any state by a wide margin."

  - question: "How many rural hospitals have closed since 2005?"
    answer: "198 rural hospitals have closed or converted since January 2005, 110 as complete closures and 88 as conversions. Texas and Tennessee together account for 39 of them."

  - question: "What is a converted rural hospital closure?"
    answer: "A converted closure is a hospital that stopped inpatient care but still offers some health services, such as a clinic or emergency care. New York is the clearest case, with all five of its rural closures counted as conversions."

  - question: "How many rural hospitals have closed in Tennessee?"
    answer: "Tennessee has 14, which ranks second, with 8 complete closures and 6 conversions. Its conversions are the most of any state, ahead of Texas, California, Oklahoma, and New York at 5 each."

  - question: "How many rural hospitals have closed in North Carolina?"
    answer: "North Carolina has 12, third in the country, with 8 complete closures and 4 conversions. The state expanded Medicaid in December 2023, and its most recent closure on the list came earlier that year."

  - question: "Which states have no rural hospital closures?"
    answer: "Thirteen states have none on the list, including Colorado, Montana, Utah, and Wyoming. They range from small eastern states such as Rhode Island and Vermont to western states such as Idaho and Oregon."

