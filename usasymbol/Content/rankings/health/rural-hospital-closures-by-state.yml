sections:
  - id: "why-texas-has-the-most-rural-hospital-closures"
    title: "Why Texas Has the Most Rural Hospital Closures"
    paragraphs:
      - "Texas leads with 25, and 20 of them were complete closures that left no health services behind. Small hospitals in sparse counties depend on a thin mix of paying patients, and Texas has never expanded Medicaid, so many of its working adults go without coverage. The [uninsured rate by state](/rankings/health/states-by-uninsured-rate) shows how far the gap runs."
      - "Tennessee (14) is the other large non-expansion state near the top. Texas lost two hospitals in a single year in 2018 when Little River Healthcare shut its Cameron and Rockdale hospitals. See the [Medicaid expansion states](/rankings/health/medicaid-expansion-states) for where coverage was widened."
