faq:
  - question: "Which state has the most plastic surgeons per capita?"
    answer: "Florida has the most plastic surgeons per capita at 2.20 per 100,000 residents, followed by New York (2.17) and Connecticut (2.09)."

  - question: "Which state has the fewest plastic surgeons per capita?"
    answer: "Wyoming has the fewest plastic surgeons per capita at 0.51 per 100,000 residents, backed by just 3 active surgeons statewide. Arkansas (0.71) and Vermont (0.80) rank second- and third-fewest."

  - question: "Does any agency track plastic surgery procedure rates by state?"
    answer: "No. Cosmetic procedures are elective and typically self-pay, so they are not billed through insurance or Medicare and never enter standard state health-claims datasets. The closest sourced proxy is active plastic surgeon counts per capita, compiled from American Society of Plastic Surgeons membership data."

  - question: "How many plastic surgeons does California have?"
    answer: "California has the most plastic surgeons in raw count, 755, but ranks 7th per capita at 1.95 per 100,000 residents because of its large population."

  - question: "What is the national average for plastic surgeons per capita?"
    answer: "The 50-state average is about 1.43 plastic surgeons per 100,000 residents. States above that line skew coastal and high-income; states below it skew rural and low-population."

  - question: "Why do rural states have fewer plastic surgeons per capita?"
    answer: "Wyoming, Arkansas, Vermont, Oklahoma, and New Mexico fill out the bottom five, all low-population states with limited specialist infrastructure generally. The same shortage pattern shows up across most surgical specialties in these regions, not just plastic surgery."

