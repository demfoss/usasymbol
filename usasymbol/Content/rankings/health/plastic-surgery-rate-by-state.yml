page:
  h1: "Plastic Surgery Rate by State"

  quick_answer:
    - "No government agency publishes how many cosmetic procedures each state performs, since these are elective and not billed through insurance. The best available per-state proxy is plastic surgeon density: Florida has the most active plastic surgeons per capita at 2.20 per 100,000 residents, followed by New York (2.17) and Connecticut (2.09)."
    - "Wyoming has the fewest plastic surgeons per capita at 0.51 per 100,000 residents, followed by Arkansas (0.71) and Vermont (0.80), all more than four times below Florida's rate."
    - "The 50-state average is about 1.43 plastic surgeons per 100,000 residents. Coastal, higher-income states cluster at the top, while sparsely populated Great Plains and Mountain West states cluster at the bottom."

  methodology: "No federal or state agency tracks cosmetic procedure volume by state, because elective cosmetic surgery is typically self-pay and not billed through insurance or Medicare, so it never enters standard health-claims datasets. In the absence of that data, this page uses the closest sourced state-level proxy: active board-certified plastic surgeon counts from the American Society of Plastic Surgeons (ASPS), compiled against U.S. Census Bureau population estimates in a peer-reviewed 2020 study published in Plastic and Reconstructive Surgery – Global Open. The underlying surgeon counts and populations reflect the 2014 Census year, the most recent full state-by-state breakdown publicly available; ASPS does not publish an updated state-level roster. Surgeon density is a proxy for access and supply, not a direct measure of how many procedures residents actually receive. The District of Columbia is excluded because this page ranks the 50 states only."

  sources:
    - name: "Patient demand for plastic surgeons for every US state based on Google searches — Plastic and Reconstructive Surgery – Global Open (2020)"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7451795/"
      description: "Peer-reviewed study compiling active ASPS plastic surgeon counts by state against Census Bureau population, plus a Google-search-based demand index"
    - name: "American Society of Plastic Surgeons (ASPS)"
      url: "https://www.plasticsurgery.org"
      description: "Source of active board-certified plastic surgeon membership counts by state"
    - name: "U.S. Census Bureau"
      url: "https://www.census.gov"
      description: "State population estimates used to calculate surgeons per capita"

