  - id: "demand-for-plastic-surgery-vs-surgeon-supply"
    icon: "fa-solid fa-chart-line"
    title: "Where Demand for Plastic Surgery Outpaces Local Supply"
    paragraphs:
      - "The same peer-reviewed study that supplies the surgeon-density figures above also built a search-demand index, comparing each state's Google search volume for plastic surgery terms against its surgeon supply. On that measure, Wyoming, Oklahoma, and Arkansas showed the largest gap between interest and access, meaning residents in those states searched for plastic surgery information at rates far exceeding their local surgeon density, consistent with their bottom-five ranking here."
      - "California generated the single highest search volume of any state in the underlying data, but its high population and comparatively modest 1.95 surgeons per 100,000 residents place it only 7th in per-capita supply, well behind Florida, New York, and Connecticut. States with the biggest raw surgeon counts and the states with the highest per-capita concentration are not always the same states."

