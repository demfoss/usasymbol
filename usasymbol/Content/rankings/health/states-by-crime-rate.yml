page:
  h1: "Violent Crime Rate by State 2025"
  quick_answer:
    - "New Mexico and Alaska have the highest violent crime rates in the U.S., each exceeding 800 incidents per 100,000 residents. Both states face specific challenges: New Mexico struggles with persistent poverty and drug trafficking along the southern border, while Alaska's geography isolates communities and limits law enforcement response."
    - "Maine, New Hampshire, and Connecticut have the lowest violent crime rates, all below 200 per 100,000. These states combine low poverty, high educational attainment, cohesive communities, and well-funded local law enforcement."
    - "Violent crime includes murder and non-negligent manslaughter, rape, robbery, and aggravated assault, as defined by the FBI Uniform Crime Reporting program. The national rate is approximately 380 incidents per 100,000 residents."
  methodology: "Violent crime rates are per 100,000 residents using FBI Unified Crime Reporting (UCR) 2022 data, the most recent year with complete state-level coverage. Violent crime includes murder and non-negligent manslaughter, rape (revised definition), robbery, and aggravated assault. Not all agencies report to the UCR; states with lower coverage rates may have estimates adjusted by the FBI."
  sources:
    - name: "FBI Crime Data Explorer — Uniform Crime Reporting 2022"
      url: "https://cde.ucr.cjis.gov"
      description: "State-level violent crime counts and rates per 100,000 residents"

