faq:
  - question: "Which state has the highest violent crime rate"
    answer: "Alaska has the highest violent crime rate among U.S. states, at 837.8 per 100,000 residents. Geographic isolation, high alcohol consumption, and limited law enforcement reach in remote communities are the primary drivers. New Mexico (779.0) ranks second."
  - question: "Which states are the safest from violent crime"
    answer: "Maine, New Hampshire, and Vermont consistently have the lowest violent crime rates in the U.S., all well below 200 per 100,000. These states share low poverty rates, high social trust, predominantly rural or small-city populations, and low rates of drug trafficking."
  - question: "What counts as violent crime in FBI data"
    answer: "The FBI defines violent crime as offenses that involve force or the threat of force: murder and non-negligent manslaughter, rape, robbery, and aggravated assault. Property crimes (burglary, theft, arson) are tracked separately. Only incidents reported to law enforcement and submitted to the FBI are included."
  - question: "Does a low violent crime rate mean a state is truly safe"
    answer: "Not entirely — violent crime rates capture reported offenses but miss unreported crimes, property crime, fraud, cybercrime, and traffic fatalities. States with high violent crime can have low property crime, and vice versa. The FBI and BJS publish separate measures for property crime, drug offenses, and other categories."

