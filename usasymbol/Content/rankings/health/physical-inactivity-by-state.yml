sections:
  - id: why-mississippi-has-the-most-inactive-adults
    icon: "fa-solid fa-couch"
    title: "Why Mississippi Has the Most Inactive Adults"
    paragraphs:
      - "Mississippi tops the list at 30.6%, almost one adult in three. Summers are long, hot and humid, which pushes exercise indoors, and in much of the rural state there are no sidewalks, parks or gyms within walking distance. It is also one of the poorest states, so paid gym access is out of reach for many families."
      - "West Virginia at 28.7%, Arkansas at 28.5% and Kentucky at 28.0% follow, all states where towns are scattered across hills and river valleys and daily errands mean driving. The same states sit near the top of the [obesity rate by state](/rankings/health/states-by-obesity-rate) list."
