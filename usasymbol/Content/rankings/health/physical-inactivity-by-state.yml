faq:
  - question: "Which state has the most physical inactivity?"
    answer: "Mississippi, where 30.6% of adults reported no leisure-time activity. West Virginia at 28.7% and Arkansas at 28.5% are next."
  - question: "Which state is the most physically active?"
    answer: "Colorado, where fewer than one adult in six reports no leisure-time activity. Utah at 16.8% and Washington at 17.4% also sit near the bottom of the list."
  - question: "What does no leisure-time physical activity mean?"
    answer: "It means an adult said no when asked whether, apart from their regular job, they had done any exercise or physical activity in the past 30 days, such as running, walking, golf or gardening. A nurse or farmer who is on their feet all day can still count as inactive."
  - question: "What is the physical inactivity rate in Texas?"
    answer: "Texas is at 25.1%, ranking 9th. Sprawling cities built around cars and summer heat that tops 100 degrees in many places keep a lot of daily activity indoors."
  - question: "What is the physical inactivity rate in California?"
    answer: "California is at 20.7%, tied for 36th with Idaho. Mild weather, beaches and the Sierra Nevada make year-round outdoor exercise easy for much of the state."
  - question: "Why is West Virginia so inactive?"
    answer: "West Virginia is at 28.7%, second highest. Steep terrain and winding mountain roads leave few walkable town centers, and the state has high rates of disability and chronic illness that limit exercise."
  - question: "Does physical inactivity affect heart disease?"
    answer: "Yes, a sedentary life is a recognized risk factor. Mississippi, first here, also ranks second on the [heart disease death rate by state](/rankings/health/heart-disease-death-rate-by-state) list, behind only Oklahoma."
