seo:
  title: "Physical Inactivity by State | Map & Rankings"
  description: "Mississippi has the most adults with no leisure-time physical activity at 30.6%. Colorado has the fewest at 15.6%, and Vermont is next at 16.0%."
page:
  h1: "Physical Inactivity by State"
  quick_answer:
    - "Physical inactivity is highest in Mississippi, where 30.6% of adults did no exercise outside their job, in a state of long humid summers and rural roads with few sidewalks or parks."
    - "Colorado has the lowest rate at 15.6%, helped by trails, ski slopes and bike paths that begin at the edge of its cities. Vermont follows at 16.0%, home to the Long Trail through the Green Mountains."
    - "West Virginia at 28.7% and Arkansas at 28.5% come right after Mississippi, two states where towns are far apart and many roads have no place to walk."
  methodology: "Share of adults who reported no leisure-time physical activity in the past 30 days, 2024, from the CDC Behavioral Risk Factor Surveillance System. Rank 1 is the highest inactivity. Tennessee has no 2024 value because its sample was too small. The District of Columbia (13.9%) and the territories are excluded. The national figure is 22.5%."
  sources:
