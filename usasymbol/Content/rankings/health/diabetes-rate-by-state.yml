  - id: diabetes-in-southern-states
    icon: "fa-solid fa-map-location-dot"
    title: "Diabetes in Southern States"
    paragraphs:
      - "Kentucky at 16.2%, Louisiana at 15.4%, Arkansas at 15.3%, Mississippi at 15.2% and Alabama at 15.1% hold ranks two through six. Traditional Southern cooking built on fried foods and sweet drinks plays a part, and so does a high share of rural residents who live far from a specialist. Heavy [soda consumption](/rankings/health/soda-consumption-by-state) in the region adds sugar to the daily diet."
      - "Texas is lower at 13.5% in 11th place, helped by a young population that dilutes the rates of its older rural counties. Indiana at 14.3% in seventh and Michigan at 13.6% in ninth show the Midwest is not far behind, a reminder that the pattern follows weight and income as much as geography. These states also tend to sit near the bottom of the [life expectancy](/rankings/health/states-by-life-expectancy) ranking."
