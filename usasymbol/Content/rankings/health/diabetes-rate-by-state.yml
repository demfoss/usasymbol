sections:
  - id: why-west-virginia-has-the-highest-diabetes-rate
    icon: "fa-solid fa-syringe"
    title: "Why West Virginia Has the Highest Diabetes Rate"
    paragraphs:
      - "West Virginia leads at 18.4%, more than two points above any other state. Type 2 diabetes follows age, body weight and inactivity, and West Virginia has one of the oldest populations in the country, the highest adult [obesity rate](/rankings/health/states-by-obesity-rate) and a long record of high poverty."
      - "Many of its towns sit in narrow hollows far from big hospitals, and fresh produce is often a long drive away. Mining jobs, which kept people moving all day, have also shrunk for decades, so fewer workers now spend their shifts on their feet."
