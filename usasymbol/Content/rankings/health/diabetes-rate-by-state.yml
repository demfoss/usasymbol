  description: "West Virginia has the highest diabetes rate at 18.4% of adults. Colorado has the lowest at 8.4%, and Kentucky is next highest at 16.2%."
page:
  h1: "Diabetes Rate by State 2026"
  quick_answer:
    - "West Virginia has the highest diabetes rate at 18.4% of adults, a result of an older population, the highest obesity rate in the country and widespread poverty."
    - "Colorado has the lowest rate at 8.4%, in a state with the lowest obesity rate in the country and a population that spends a lot of time outdoors. Montana and Utah follow at 8.7%."
    - "Kentucky ranks second at 16.2%, and Louisiana, Arkansas, Mississippi and Alabama fill the next four places, so the six highest rates all belong to Southern states."
  methodology: "Share of adults who reported ever being told by a health professional that they have diabetes, 2024 survey year, from the CDC Behavioral Risk Factor Surveillance System as compiled by America's Health Rankings. Rank 1 is the highest rate. Tennessee has no 2024 value and is omitted, and the District of Columbia (8.4%) is excluded. The U.S. value is 12.0%."
