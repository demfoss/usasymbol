faq:
  - question: "Which state has the highest diabetes rate?"
    answer: "West Virginia, where 18.4% of adults have been diagnosed. Kentucky at 16.2% and Louisiana at 15.4% come next."
  - question: "Which state has the lowest diabetes rate?"
    answer: "Colorado, at 8.4%. Montana and Utah follow at 8.7%, and Vermont is next at 8.9%."
  - question: "What is the diabetes rate in Texas?"
    answer: "Texas is at 13.5%, ranking 11th. Its large Hispanic population matters here, since Type 2 diabetes is more common among Hispanic adults, and the border counties of the Rio Grande Valley have some of the heaviest burdens in the state."
  - question: "What is the diabetes rate in California?"
    answer: "California is at 12.6%, ranking 20th and a little above the U.S. value of 12.0%. The Central Valley farm counties generally run higher than the coastal cities."
  - question: "Why is diabetes so common in Kentucky?"
    answer: "Kentucky's 16.2% reflects the Appalachian pattern in the eastern part of the state, where poverty, older residents and few nearby clinics combine. Kentucky also has the second highest smoking rate, which raises the risk of Type 2 diabetes and its complications."
  - question: "Is diabetes more common in the South?"
    answer: "Yes. The six highest rates all belong to Southern states, and Kentucky, Louisiana, Arkansas, Mississippi and Alabama each exceed 15%. The lowest rates, under 9%, appear in Colorado, Montana, Utah and Vermont."
  - question: "What is the diabetes rate in Florida?"
    answer: "Florida is at 11.9%, tied with Wisconsin in 26th place. A retiree-heavy population pushes the figure up, yet the state still lands below the national value of 12.0%."
