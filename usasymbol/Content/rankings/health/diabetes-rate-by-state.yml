  - id: states-with-the-lowest-diabetes-rate
    icon: "fa-solid fa-person-hiking"
    title: "States With the Lowest Diabetes Rate"
    paragraphs:
      - "Colorado has the lowest rate at 8.4%, and it also has the lowest obesity rate in the country. Residents of the Front Range and the mountain towns bike, ski and hike year round, and the state draws young adults who move there for that lifestyle."
      - "Montana and Utah share second lowest at 8.7%. Utah's median age is the youngest of any state, which matters because the risk of Type 2 diabetes climbs with every decade of adult life. Vermont at 8.9% shows the same low-risk mix in the Northeast, with small farms, small towns and plenty of walking."
