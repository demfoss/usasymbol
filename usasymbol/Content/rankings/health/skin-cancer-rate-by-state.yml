faq:
  - question: "Which state has the highest skin cancer rate?"
    answer: "Utah, with 43.8 new melanoma cases per 100,000 people and about 1,317 cases a year. Minnesota follows at 40.5 and Vermont is third at 35.1."
  - question: "Which state has the lowest skin cancer rate?"
    answer: "Texas, at 15.9. Alaska at 16.4 and Massachusetts at 16.8 are next lowest."
  - question: "What is the skin cancer rate in Florida?"
    answer: "Florida is at 26.8, which ranks 19th. Its roughly 8,470 cases a year are second only to California's 10,766, mostly because so many people live there."
  - question: "Why is melanoma so common in Minnesota?"
    answer: "Minnesota's 40.5 comes mostly from ancestry. Many residents descend from Scandinavian and German settlers, a fair-skinned group that burns easily, and summers spent outdoors on the state's lakes add exposure."
  - question: "What is the melanoma rate in Arizona?"
    answer: "Arizona is at 33.6, fifth in the country, with about 3,146 new cases a year. Clear desert skies and year-round sun, plus many retirees, push the number up."
  - question: "What is the skin cancer rate in Hawaii?"
    answer: "Hawaii is at 25.7, ranking 24th, near the middle despite constant sun. Much of the population has darker skin, which lowers its melanoma rate."
