  - id: sunny-states-with-middle-rankings
    title: "Sunny States With Middle Rankings"
    paragraphs:
      - "Hawaii ranks 24th at 25.7, Florida 19th at 26.8 and California 29th at 23.8. Large Asian, Pacific Islander, Black and Hispanic populations in these states lower the average, even though visitors and fair-skinned residents get plenty of sun."
      - "Arizona is the sunny exception at fifth with 33.6, backed by a large retiree population and strong desert sun. For more on the warm southern tier, see the [Sun Belt states](/rankings/geography/sun-belt-states). Indoor tanning adds risk everywhere, and many states restrict it, as the [tanning bed age laws by state](/rankings/law/tanning-bed-age-laws-by-state) page shows."
