  - id: why-texas-has-the-lowest-skin-cancer-rate
    title: "Why Texas Has the Lowest Skin Cancer Rate"
    paragraphs:
      - "Texas records 15.9 cases per 100,000 despite long, hot summers. About four in ten Texans are Hispanic, and melanoma is far less common in people with darker skin, which has more natural protection from ultraviolet light."
      - "Alaska at 16.4 and Massachusetts at 16.8 sit just above Texas. Alaska's far northern latitude means weak sun for much of the year, while Massachusetts shows that a cold northeastern state does not automatically rank low, since neighboring Vermont is third."
    table:
