sections:
  - id: why-utah-has-the-highest-skin-cancer-rate
    title: "Why Utah Has the Highest Skin Cancer Rate"
    paragraphs:
      - "Utah leads at 43.8 new melanoma cases per 100,000 people, and altitude is a documented part of the story. Thinner air at high elevation filters less ultraviolet light, and the state sits at an average of about 6,100 feet in the [average elevation by state](/rankings/geography/average-elevation-by-state) ranking."
      - "Skiing, hiking, climbing and boating put Utahns outside in strong sun nearly year-round. Most residents also descend from northern European settlers, whose fair skin burns easily. Minnesota is second at 40.5 and shares the fair-skinned ancestry without the altitude."
