page:
  h1: "Skin Cancer Rate by State 2026"
  quick_answer:
    - "Utah has the highest skin cancer rate at 43.8 new melanoma cases per 100,000 people, a result tied to its high elevation, strong sun and love of the outdoors."
    - "Texas has the lowest rate at 15.9, even though it is one of the sunniest big states. Roughly four in ten Texans are Hispanic, and darker skin carries a much lower melanoma risk."
    - "Minnesota ranks second at 40.5 and Vermont third at 35.1. Neither is known for sun, but both have fair-skinned populations with northern European roots."
  methodology: "Age-adjusted rate of new melanoma of the skin per 100,000 residents, all stages, all races, both sexes and all ages, for 2019–2023, from State Cancer Profiles (SEER and NPCR registries). The 50 states are ranked and the District of Columbia (11.3) is excluded. Annual cases are yearly averages."
