faq:
  - question: "Which state has the highest organ donor registration rate?"
    answer: "Colorado, where about 77% of the population is registered as an organ donor. Montana (74%) and Alaska (71%) rank second and third."

  - question: "Which state has the lowest organ donor registration rate?"
    answer: "New York and Mississippi are tied for the lowest rate at 28%. New Jersey is next lowest at 31%."

  - question: "What percentage of Americans are registered organ donors?"
    answer: "About 46% of the U.S. population is registered as an organ donor, based on state registry counts matched against Census population figures. State rates range from 28% to 77%."

  - question: "Why is California's organ donor registration rate so low?"
    answer: "California registers about 38% of its population, well below the 46% national average. It's one of three of the four most populous states, alongside New York (28%) and Texas (39%), with registration rates below average; only Florida (49%) is close to the national figure among the largest states."

  - question: "How do you register as an organ donor?"
    answer: "Most people register when getting or renewing a driver's license or state ID at their local DMV. Every state also offers online registration through its own donor registry or the National Donate Life Registry at registerme.org."

