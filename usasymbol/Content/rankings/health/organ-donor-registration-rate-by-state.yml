  description: "Colorado has the highest organ donor registration rate at 77% of its population. New York and Mississippi are lowest at 28%. See rates for all 50 states."

page:
  h1: "Organ Donor Registration Rate by State"

  quick_answer:
    - "Colorado has the highest organ donor registration rate of any state, with about 77% of its population registered. Montana (74%) and Alaska (71%) follow closely behind."
    - "New York and Mississippi have the lowest organ donor registration rates, both at 28%. New Jersey is close behind at 31%."
    - "The national average is 46% of the population registered as an organ donor. Colorado's rate is 49 percentage points higher than the lowest states, nearly triple New York's rate."

  methodology: "Figures show the share of each state's total population enrolled in a state organ donor registry, based on Donate Life America registration counts matched against U.S. Census Bureau population estimates for 2018, as compiled and published by Cardon, Holbrook, and Showalter (2020) in PLOS ONE. This full 50-state data set remains the most recent complete state-by-state comparison; Donate Life America's more recent annual 'report card' updates cover only a partial set of states each year, since a number of state DMVs do not consistently report designation data."

  sources:
    - name: "Cardon, Holbrook & Showalter (2020), PLOS ONE"
      url: "https://doi.org/10.1371/journal.pone.0241672"
      description: "Peer-reviewed study 'Estimating the effect of focused donor registration efforts on the number of organ donors,' with full state-by-state donor registration rates compiled from Donate Life America and Census data"
    - name: "Donate Life America"
      url: "https://donatelife.net"
      description: "National nonprofit managing state and the National Donate Life Registry; original source of state donor registration counts"
    - name: "U.S. Census Bureau"
      url: "https://www.census.gov"
      description: "State population estimates used to calculate registration rates as a share of total population"

