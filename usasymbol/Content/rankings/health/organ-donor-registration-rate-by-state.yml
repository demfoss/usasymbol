    paragraphs:
      - "Three of the four most populous states rank among the lowest for organ donor registration: New York (28%), California (38%), and Texas (39%) all trail the 46% national average. Florida is the exception, sitting close to average at 49%."
      - "Large, dense states tend to have more crowded DMV offices, higher population turnover, and more varied outreach infrastructure across counties, all of which can dilute a uniform registration push compared to smaller states like Colorado or Montana, where a single agency runs a more consistent statewide campaign."

