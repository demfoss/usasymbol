faq:
  - question: "Which state has the most doctors per capita?"
    answer: "Massachusetts, at 475.7 physicians per 100,000 residents, which works out to roughly one doctor for every 210 people. New York at 428.3 is second."
  - question: "Which state has the fewest doctors per capita?"
    answer: "Idaho, at 209.9 per 100,000, or about one doctor for every 476 residents. Nevada at 216.8 and Mississippi at 232.1 are the next lowest."
  - question: "Why does Texas have so few doctors per capita?"
    answer: "Texas is 46th at 236.7 even though it has the third-most doctors in total. It is the second-largest state by area with 254 counties, many of them rural, and its population keeps growing quickly."
  - question: "How many doctors are there in California?"
    answer: "California has 121,216 professionally active physicians, the most of any state. Per 100,000 residents that is 308.0, which ranks 22nd."
  - question: "How many doctors are in Florida?"
    answer: "Florida has 67,496, the fourth-most in the country, and ranks 30th per person at 287.7, tied with Louisiana. Its many retirees keep demand for doctors high."
  - question: "What state has the fewest doctors in total?"
    answer: "Wyoming has 1,504, the smallest count of any state, because it also has the smallest population at 588,753. Per person it ranks 42nd at 255.5."
  - question: "How many doctors per 100,000 people are there in New York?"
    answer: "New York has 428.3 per 100,000, second in the country, with 85,662 physicians. New York City alone hosts many large academic medical centers that draw doctors from across the nation."
