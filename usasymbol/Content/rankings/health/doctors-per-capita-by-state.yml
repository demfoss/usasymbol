    title: "States With the Most Physicians in Total"
    paragraphs:
      - "California has 121,216 active physicians, far more than any other state, but ranks only 22nd per person at 308.0 because it has 39.4 million residents. New York is second in total at 85,662 and also second per person."
      - "Texas has 75,042 doctors and Florida 67,496, yet they rank 46th at 236.7 and 30th at 287.7. Both are huge, fast-growing states where sheer population size hides how thinly doctors are spread. Pennsylvania, with 49,413 physicians, ranks fifth in total and 7th per person."
