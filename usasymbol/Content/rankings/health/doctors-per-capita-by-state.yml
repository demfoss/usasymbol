sections:
  - id: why-massachusetts-has-the-most-doctors-per-capita
    icon: "fa-solid fa-hospital"
    title: "Why Massachusetts Has the Most Doctors"
    paragraphs:
      - "Massachusetts has 475.7 physicians per 100,000 residents, more than any other state. Boston packs Harvard Medical School, founded in 1782, and Massachusetts General Hospital, opened in 1811, into a few miles of city, and the teaching hospitals around them train residents who often stay."
      - "New York at 428.3, Connecticut at 418.7 and Rhode Island at 415.6 complete the top four, all in the Northeast corridor where cities, medical schools and hospitals sit close together. Vermont at 393.4 is the surprise, a small rural state with its own medical college. Higher doctor counts also show up in the [best healthcare by state](/rankings/health/best-healthcare-by-state) ranking."
