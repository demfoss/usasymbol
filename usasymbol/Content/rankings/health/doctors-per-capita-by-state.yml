  - id: states-with-the-fewest-doctors-per-capita
    icon: "fa-solid fa-map-location-dot"
    title: "States With the Fewest Doctors per Capita"
    paragraphs:
      - "Idaho has 209.9 physicians per 100,000 residents, the lowest of any state. Nevada at 216.8, Utah at 236.6 and Wyoming at 255.5 also sit in the bottom ten, so the Mountain West is thin on doctors. Long distances between towns and fast population growth stretch physicians thin, and the medical school at UNLV in Las Vegas only enrolled its first students in 2017."
      - "Mississippi at 232.1, Alabama at 240.6, Oklahoma at 243.3 and Arkansas at 248.0 anchor the South. Many of their counties are rural and far from a major hospital, a gap that also appears in the [nursing shortage by state](/rankings/health/nursing-shortage-by-state) ranking and in [states by population density](/rankings/demographics/states-by-population-density)."
