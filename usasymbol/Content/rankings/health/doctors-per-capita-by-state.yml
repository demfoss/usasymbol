  title: "Doctors per Capita by State 2026 | Map & Rankings"
  description: "Massachusetts has the most doctors per capita at 475.7 physicians per 100,000 residents. Idaho has the fewest at 209.9, and Nevada is next at 216.8."
page:
  h1: "Doctors per Capita by State 2026"
  quick_answer:
    - "Massachusetts has the most doctors per capita at 475.7 physicians per 100,000 residents, driven by Harvard-affiliated hospitals and one of the densest clusters of teaching hospitals in the country."
    - "Idaho has the fewest at 209.9 per 100,000, a big rural state where many towns sit far from any hospital. Nevada follows at 216.8 and Mississippi at 232.1."
    - "Texas has the third-most doctors in total at 75,042, yet it ranks 46th per person at 236.7 because its 31.7 million residents are spread across 254 counties."
  methodology: "Physicians per 100,000 residents, calculated from the count of professionally active MDs and DOs by state (Redi-Data via KFF, September 2026) divided by Census Bureau resident population estimates for July 1, 2025 (Vintage 2025), rounded to one decimal. Rank 1 is the most doctors per person. The 50 states are ranked and the District of Columbia is excluded."
