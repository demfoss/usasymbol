faq:
  - question: "Which state has the highest life expectancy"
    answer: "Hawaii has the highest life expectancy in the U.S. at 81.6 years. The state consistently tops national health rankings due to low smoking rates, an active outdoor lifestyle, a diet rich in fish and vegetables, and a diverse multicultural population that includes large Asian-American communities with above-average health outcomes."
  - question: "Which state has the lowest life expectancy"
    answer: "Mississippi has the lowest life expectancy at approximately 71.9 years. The state has one of the highest poverty rates (18.0%), the second-highest obesity rate (40.4%), and high rates of tobacco use and cardiovascular disease. Limited access to preventive health care in rural areas compounds these factors."
  - question: "Why did U.S. life expectancy drop in 2020–2021"
    answer: "U.S. life expectancy fell by 2.7 years between 2019 and 2021, the largest two-year decline since World War II. COVID-19 was the primary cause, accounting for roughly half the decrease. Drug overdoses, heart disease, and other factors contributed to the remainder. The gap between states widened significantly during the pandemic."
  - question: "What factors most influence life expectancy at the state level"
    answer: "The strongest predictors of state-level life expectancy are smoking rates, obesity rates, poverty, educational attainment, and access to health insurance. States with high rates of preventive care access and low tobacco use tend to cluster at the top of life expectancy rankings."

