page:
  h1: "Life Expectancy by State 2025"
  quick_answer:
    - "Hawaii has the highest life expectancy of any U.S. state at approximately 80.7 years at birth, followed by California, Minnesota, and Connecticut. Hawaii's advantage is attributed to lower smoking rates, a physically active lifestyle, a diet with more fish and vegetables, and strong social cohesion in its communities."
    - "Mississippi has the lowest life expectancy at roughly 71.9 years — nearly a nine-year gap from Hawaii. West Virginia, Louisiana, Alabama, and Kentucky also rank near the bottom, reflecting higher rates of chronic disease, obesity, smoking, and limited access to health care."
    - "The national average life expectancy at birth is approximately 76.4 years (CDC 2021), which is below many peer nations. The COVID-19 pandemic caused a two-year decline in U.S. life expectancy between 2019 and 2021."
  methodology: "Life expectancy figures are from the CDC National Center for Health Statistics (NCHS), 2021 state-level estimates. Life expectancy at birth represents the average number of years a person born in that state could expect to live under current age-specific mortality rates. 2021 data reflects the first full year of COVID-19 mortality impact."
  sources:
    - name: "CDC National Center for Health Statistics — State Life Expectancy 2021"
      url: "https://www.cdc.gov/nchs/data-analysis-tools/state-health-statistics.htm"
      description: "State-level life expectancy at birth estimates"

