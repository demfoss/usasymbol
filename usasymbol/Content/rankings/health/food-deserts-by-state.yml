faq:
  - question: "What is a food desert?"
    answer: "A food desert is a low-income area where residents live far from a grocery store, more than 1 mile away in cities or more than 10 miles away in rural areas. Families who cannot afford enough food are tracked separately in [food insecurity by state](/rankings/health/food-insecurity-by-state)."

  - question: "Which state has the most food deserts?"
    answer: "Connecticut has the largest share, with 508,164 low-income residents living far from a store. By headcount Florida is higher at 2,120,952."

  - question: "Which state has the fewest food deserts?"
    answer: "West Virginia, where 52,771 residents, or 2.94%, are low income and far from a store. Iowa and New York are the only other states below 4%."

  - question: "What share of Americans live in food deserts?"
    answer: "Across the 50 states, 23,321,337 residents, about 7.05% of the population, are low income and live beyond the distance limits."

  - question: "Are there food deserts in Texas?"
    answer: "Texas has 1,551,760 residents in food deserts, or 5.32% of its population, which ranks 39th. Only Florida and California have more people in that situation."

  - question: "Why does Alaska have so many food deserts?"
    answer: "Alaska ranks second with 102,324 affected residents. Many of its communities are off the road system, so groceries arrive by plane or barge and the nearest store can be far away."

