  description: "Connecticut has the highest share of residents in food deserts at 14.09%. Alaska is next at 13.95%, and West Virginia has the lowest at 2.94%."

page:
  h1: "Food Deserts by State"

  quick_answer:
    - "Food deserts touch the largest share of residents in Connecticut at 14.09%, because most of its people live in urban tracts where a store must sit within one mile."
    - "Alaska follows at 13.95% and Wyoming at 13.47%, states where a low-income family can live more than 10 miles from the nearest store that accepts food benefits."
    - "West Virginia has the smallest share at 2.94%, with Iowa at 3.95% and New York at 3.97% next, since a store of any size, even a dollar store, counts as access."

  methodology: "Share of residents who are low income and live more than 1 mile (urban tracts) or 10 miles (rural tracts) from a SNAP-authorized food retailer, measured in a straight line, USDA ERS Food Access Research Atlas, 2025 store data released July 2026. Tract counts are summed by state and divided by the 2020 census population. The District of Columbia (0.46%) is not ranked."

  sources:
