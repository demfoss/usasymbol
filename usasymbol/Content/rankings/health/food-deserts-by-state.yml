    paragraphs:
      - "Connecticut leads at 14.09%, with Alaska at 13.95% and Wyoming at 13.47% close behind. Alaska and Wyoming are the rural cases, where a low-income household can sit more than 10 miles from the nearest store that accepts food benefits and still be counted as cut off."
      - "Florida has the most people in this situation at 2,120,952, followed by California at 1,978,483 and Texas at 1,551,760. Huge populations produce huge headcounts, yet California's share is only 5.00% and Texas's is 5.32%."

  - id: "why-connecticut-has-the-most-food-deserts"
    title: "Why Connecticut Has the Most Food Deserts"
    paragraphs:
      - "Connecticut's high share starts with geography. Most of its residents live in urban tracts, where the test is a store within one mile instead of ten, so a suburban neighborhood that feels well served by car can still fail when the nearest store is a mile and a half away."
      - "Low income is also measured against local standards. A tract qualifies when its median family income is 80 percent or less of the state or metro median, so poorer Connecticut cities such as Hartford and Bridgeport are compared with some of the highest incomes in the country. The [poverty rate by state](/rankings/economy/states-by-poverty-rate) shows a different order."

  - id: "states-with-the-fewest-food-deserts"
    title: "States With the Fewest Food Deserts"
    paragraphs:
      - "West Virginia has the smallest share at 2.94%, even though much of the state is mountainous and rural. Any store that accepts food benefits counts as access, including dollar and convenience stores, so a single crossroads store is enough to take a rural neighborhood off the map."
      - "Iowa (3.95%) and New York (3.97%) round out the bottom three. New York packs most of its people into cities where a store sits within a few blocks, and Iowa's population is spread across many small cities and farm towns, so even rural residents are rarely more than 10 miles from a store."

