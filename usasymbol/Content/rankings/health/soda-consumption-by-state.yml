sections:
  - id: "what-counts-as-soda-consumption"
    icon: "fa-solid fa-bottle-water"
    title: "What Counts as Soda Consumption?"
    paragraphs:
      - "The CDC metric used on this page is broader than soda alone. It measures sugar-sweetened beverages (SSBs), which include regular soda, fruit drinks, sports drinks, energy drinks, sweetened iced tea, and sweetened coffee. A person who never drinks soda but has a glass of sweet tea every day still counts as a daily SSB consumer."
      - "This is why Hawaii ranks first despite being known for an outdoor and active culture. The high rate reflects all sugary drinks common in Hawaiian food culture, including fruit-based beverages, juice blends, and sweetened drinks that are not carbonated soda. The CDC data captures the full picture of sugar-sweetened intake, not just cola."
      - "Southern states rank high partly because sweet tea is a daily staple across the region. A large glass of sweet tea contains roughly the same sugar as a can of soda. States with high sweet tea, fruit punch, and sports drink consumption can rank well above average even if residents drink less carbonated soda than the national average."

