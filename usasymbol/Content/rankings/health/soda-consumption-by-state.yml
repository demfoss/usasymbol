faq:
  - question: "Which state drinks the most soda?"
    answer: "Hawaii has the highest daily sugary drink intake at 76.4% of adults, followed by Arkansas (74.2%) and Wyoming (73.2%), according to CDC NHIS data. Note that the CDC measure includes all sugar-sweetened beverages, not only carbonated soda."

  - question: "Which states drink the least soda?"
    answer: "Alaska has the lowest daily sugary drink intake at 44.5% of adults. Massachusetts (45.6%), Rhode Island (46.0%), Connecticut (46.4%), and Vermont (46.8%) also rank among the lowest. New England states consistently show the lowest sugary beverage consumption rates."

  - question: "What is soda consumption by state?"
    answer: "Soda consumption by state typically refers to the share of adults in each state who drink a sugary beverage at least once per day. The most commonly cited source is CDC NHIS data, which covers all sugar-sweetened beverages including soda, fruit drinks, sports drinks, energy drinks, and sweetened tea."

  - question: "Is soda consumption the same as sugary drink consumption?"
    answer: "No. Soda is one type of sugar-sweetened beverage, but the CDC and most state-level data sources measure all SSBs together. This includes fruit drinks, sports drinks, energy drinks, sweetened iced tea, and sweetened coffee. A state can rank high for sugary drink consumption even if residents drink relatively little carbonated soda."

  - question: "Do youth soda rankings differ from adult rankings?"
    answer: "Yes. Youth soda consumption data comes from different surveys and uses different measures, such as the share of high school students who drink soda two or more times per day. West Virginia and Kentucky rank near the top for youth consumption, while Massachusetts ranks lowest. These youth rankings do not match the adult rankings on this page, which use CDC NHIS data."

  - question: "Why does Hawaii rank high for sugary drink consumption?"
    answer: "Hawaii's high ranking reflects consumption of all sugar-sweetened beverages, not only soda. Fruit-based drinks, juice blends, and sweetened beverages are common in Hawaiian food culture. The CDC metric captures every sugary drink consumed daily, and Hawaii's rate of 76.4% is the highest of any state in the NHIS dataset."

