page:
  h1: "Soda Consumption by State"

  quick_answer:
    - "Hawaii has the highest daily sugary drink intake of any U.S. state, with 76.4% of adults reporting they drink a sugar-sweetened beverage at least once a day. Arkansas (74.2%) and Wyoming (73.2%) follow. Alaska has the lowest rate at 44.5%."
    - "This page uses CDC data on sugar-sweetened beverages (SSBs), which is broader than soda alone. SSBs include regular soda, fruit drinks, sports drinks, energy drinks, and sweetened coffee or tea. The metric is the share of adults who consume at least one SSB per day."

  methodology: "Data reflects CDC National Health Interview Survey (NHIS) estimates of adults who reported consuming sugar-sweetened beverages at least once daily. State-level figures combine the 2010 and 2015 NHIS Cancer Control Supplement. The metric covers all sugar-sweetened beverages, not soda alone."

  sources:
