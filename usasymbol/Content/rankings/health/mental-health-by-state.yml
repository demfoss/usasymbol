page:
  h1: "Mental Health by State"

  quick_answer:
    - "West Virginia has the highest diagnosed mental disorders rate of any state at 19,337 per 100,000 residents, ahead of Arkansas (19,126) and Pennsylvania (18,998)."
    - "Hawaii has the lowest mental disorders rate at 16,411 per 100,000, followed by Minnesota (16,599) and North Dakota (16,601)."
    - "The average mental disorders rate across the 50 states is about 17,906 per 100,000. Twenty-four states fall below that figure, from New Jersey at 17,887 down to Hawaii at 16,411."

  methodology: "Rates measure the number of people diagnosed with a mental disorder per 100,000 residents in 2023, listed by state. Depression rate uses the same per-100,000 basis for the same year."

  sources:
    - name: "World Population Review — Mental Health Statistics by State"
      url: "https://worldpopulationreview.com/state-rankings/mental-health-statistics-by-state"
      description: "State-by-state mental disorders, depression, and anxiety rates per 100,000 residents, 2023 data"

