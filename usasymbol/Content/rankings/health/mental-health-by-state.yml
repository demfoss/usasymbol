faq:
  - question: "Which state has the highest mental disorder rate?"
    answer: "West Virginia has the highest diagnosed mental disorders rate of any state at 19,337 per 100,000 residents. Arkansas ranks second at 19,126, and Pennsylvania is third at 18,998."

  - question: "Which state has the lowest mental disorder rate?"
    answer: "Hawaii has the lowest mental disorders rate at 16,411 per 100,000, the only state under 16,500."

  - question: "What is the mental disorders rate in California?"
    answer: "California's mental disorders rate is 18,296 per 100,000, the 17th-highest figure of any state."

  - question: "What is the mental disorders rate in Texas?"
    answer: "Texas's mental disorders rate is 17,095 per 100,000, ranking 43rd among the 50 states."

  - question: "Which state has the highest depression rate?"
    answer: "West Virginia has the highest depression rate of any state at 6,299 per 100,000 residents, the same state that tops the overall mental disorders rate ranking."

  - question: "Which state has the lowest depression rate?"
    answer: "North Dakota has the lowest depression rate at 3,583 per 100,000, even though its overall mental disorders rate of 16,601 ranks 48th, not lowest."

