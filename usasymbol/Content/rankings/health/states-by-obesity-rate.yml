page:
  h1: "Obesity Rate by State 2025"
  quick_answer:
    - "Mississippi and West Virginia have the highest adult obesity rates in the U.S., both exceeding 40% of the adult population. The Deep South and Appalachian states dominate the top of this ranking, reflecting patterns of food access, physical activity, poverty, and health care that have persisted for decades."
    - "Colorado has the lowest adult obesity rate at around 23%, followed closely by Hawaii and Massachusetts. These states combine active outdoor lifestyles, lower poverty rates, higher educational attainment, and better access to fresh food."
    - "The national adult obesity rate is approximately 36.2% (CDC Behavioral Risk Factor Surveillance System). Obesity is defined as a body mass index (BMI) of 30 or higher."
  methodology: "Adult obesity prevalence figures are from the CDC Behavioral Risk Factor Surveillance System (BRFSS), self-reported annual surveys. Obesity is defined as BMI ≥ 30, where BMI is calculated from self-reported height and weight. Self-reported measures may underestimate true prevalence due to systematic underreporting of weight."
