faq:
  - question: "Which state has the highest obesity rate"
    answer: "West Virginia has the highest adult obesity rate in the U.S. at 41.4%. The state's high poverty rate, rural food access gaps, and legacy of extractive industries that left limited physical activity infrastructure all contribute. Mississippi (40.4%) follows closely."
  - question: "Which state has the lowest obesity rate"
    answer: "Colorado has the lowest adult obesity rate in the U.S. at 25.0%. The state's active outdoor recreation culture — skiing, hiking, cycling — paired with a younger, highly educated population and strong public health infrastructure contribute to lower obesity rates."
  - question: "Why do Southern states have higher obesity rates"
    answer: "Obesity rates in Southern states reflect a combination of higher poverty, lower educational attainment, greater food insecurity, fewer recreational facilities, a hotter climate that limits outdoor activity, and weaker public health investment. These are structural and systemic factors, not individual choices alone."
  - question: "What health risks are associated with obesity"
    answer: "Obesity is a major risk factor for type 2 diabetes, heart disease, high blood pressure, stroke, certain cancers, sleep apnea, and osteoarthritis. States with higher obesity rates also tend to have higher rates of all these conditions, which directly affects state-level health care costs and workforce productivity."

