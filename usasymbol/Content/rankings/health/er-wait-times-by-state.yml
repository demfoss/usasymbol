sections:
  - id: "longest-er-wait-times-by-state"
    title: "States With the Longest ER Wait Times"
    table:
      columns:
        rank: "Rank"
        state: "State"
        median_minutes: "Median Minutes in ER"
        psych_minutes: "Psychiatric Patients"
      rows:
        - { rank: 1, state: "Maryland", state_slug: "maryland", median_minutes: "246", psych_minutes: "415" }
        - { rank: 2, state: "Rhode Island", state_slug: "rhode-island", median_minutes: "223", psych_minutes: "316" }
        - { rank: 3, state: "Delaware", state_slug: "delaware", median_minutes: "217", psych_minutes: "368" }
        - { rank: 4, state: "Massachusetts", state_slug: "massachusetts", median_minutes: "214", psych_minutes: "338" }
        - { rank: 5, state: "New York", state_slug: "new-york", median_minutes: "194", psych_minutes: "294" }
        - { rank: 6, state: "Connecticut", state_slug: "connecticut", median_minutes: "192", psych_minutes: "247" }
        - { rank: 7, state: "North Carolina", state_slug: "north-carolina", median_minutes: "187", psych_minutes: "300" }
        - { rank: 8, state: "Pennsylvania", state_slug: "pennsylvania", median_minutes: "186", psych_minutes: "297" }
        - { rank: 9, state: "New Jersey", state_slug: "new-jersey", median_minutes: "186", psych_minutes: "292" }
        - { rank: 10, state: "Vermont", state_slug: "vermont", median_minutes: "178", psych_minutes: "402" }
    paragraphs:
      - "Maryland leads at 246 minutes, followed by Rhode Island at 223, Delaware at 217, and Massachusetts at 214. Nine of the ten longest stays are in the Northeast and Mid-Atlantic, the most [densely populated](/rankings/demographics/states-by-population-density) part of the country, where busy urban emergency rooms share patients."
      - "Delaware also has the highest share of patients who give up and leave before a doctor sees them, 5%. Massachusetts and Rhode Island follow at 4%, while most states sit at 1% to 3%."

  - id: "why-maryland-has-the-longest-er-stays"
    title: "Why Maryland Has the Longest ER Stays"
    paragraphs:
      - "Maryland keeps psychiatric patients in the emergency room for a median 415 minutes, the longest of any state. Many of them wait there for an inpatient psychiatric bed to open, and each one occupies a treatment space that other patients need."
      - "Hospitals short of nurses, a problem tracked in the [nursing shortage by state](/rankings/health/nursing-shortage-by-state) ranking, cannot staff every room, which slows the handoff of patients out of the ER. Vermont shows the same pattern, with a psychiatric stay of 402 minutes that dwarfs its ordinary 178."

  - id: "shortest-er-wait-times-by-state"
    title: "States With the Shortest ER Wait Times"
    paragraphs:
      - "North Dakota patients leave in 110 minutes, followed by Nebraska at 113, Hawaii at 114, and South Dakota at 115. Great Plains hospitals are mostly small and serve scattered towns, so a waiting room rarely backs up the way a big city's does. South Dakota's psychiatric stay of 147 minutes is the shortest in the country."
      - "Speed does not follow wealth. Louisiana and Mississippi both post 129 minutes, quicker than affluent Connecticut at 192. For a wider look at care quality, see [best healthcare by state](/rankings/health/best-healthcare-by-state)."

