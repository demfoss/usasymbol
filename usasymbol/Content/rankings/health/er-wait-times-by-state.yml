seo:
  title: "Time Spent in the ER by State | Map & Rankings"
  description: "Maryland has the longest ER time at 246 minutes before a patient goes home. North Dakota has the shortest at 110 minutes."

page:
  h1: "Time Spent in the ER by State"

  quick_answer:
    - "Maryland has the longest ER stays of any state, with a typical discharged patient spending 246 minutes in the emergency department, more than four hours."
    - "North Dakota has the shortest stays at 110 minutes, less than half of Maryland's time, in a state of small hospitals and few crowded city emergency rooms."
    - "Vermont ranks only tenth at 178 minutes, yet its psychiatric patients stay a median 402 minutes, second only to Maryland's 415, because they often wait in the ER for an inpatient bed."

  methodology: "Median minutes from ER arrival to departure for discharged patients, excluding transfers and psychiatric patients (CMS measure OP-18b), October 2024 to September 2025. Left-before-seen is calendar 2024. Ties are ordered by psychiatric time. The District of Columbia is not ranked."

  sources:
    - name: "CMS Provider Data Catalog, Timely and Effective Care - State"
      url: "https://data.cms.gov/provider-data/dataset/apyc-v239"
      description: "State averages for OP-18b, OP-18c and OP-22, as shown on Medicare.gov Care Compare"
    - name: "CMS Provider Data Catalog, Timely and Effective Care - National"
      url: "https://data.cms.gov/provider-data/dataset/isrn-hqyy"
      description: "National median for the same measures and period"

