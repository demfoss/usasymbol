faq:
  - question: "What is the average ER wait time in the United States?"
    answer: "The national median is 162 minutes, or 2 hours 42 minutes, for a discharged patient. The clock runs from arrival to departure, so it covers triage, tests, and treatment, not only the waiting room."

  - question: "Which state has the longest ER wait times?"
    answer: "Maryland, where the median stay is 246 minutes, 84 minutes above the national figure. Rhode Island is second at 223 minutes."

  - question: "Which state has the shortest ER wait times?"
    answer: "North Dakota at 110 minutes, 52 below the national median. Nebraska is next at 113 minutes."

  - question: "What is the ER wait time in California?"
    answer: "California patients spend a median 174 minutes in the emergency department, which ranks 12th and sits 12 minutes above the national figure."

  - question: "How long is the ER stay in Texas?"
    answer: "Texas posts 145 minutes, 17 below the national median. It ties Nevada and Indiana and ranks 30th."

  - question: "How long do psychiatric patients stay in the ER?"
    answer: "The national median is 257 minutes, far longer than for other patients. Maryland (415), Vermont (402), and Delaware (368) are the longest, while South Dakota (147) is the shortest."

