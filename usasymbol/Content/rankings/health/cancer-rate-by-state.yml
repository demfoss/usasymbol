sections:
- id: states-with-highest-cancer-rates
  icon: fa-solid fa-chart-line
  title: States With Highest Cancer Rates
  paragraphs:
  - Kentucky records 530.5 new cases per 100,000 people, with West Virginia at 517.8 and Louisiana at 514.2. Tobacco-related cancers contribute heavily to the burden in Kentucky and West Virginia.
  - Iowa and Minnesota complete the top five. Cancer incidence counts diagnoses, so screening and access to diagnostic care also affect when cases enter a registry.
  table:
    columns: { rank: Rank, state: State, incidence_rate: New Cases per 100,000 }
    rows:
    - { rank: 1, state: Kentucky, incidence_rate: '530.5' }
    - { rank: 2, state: West Virginia, incidence_rate: '517.8' }
    - { rank: 3, state: Louisiana, incidence_rate: '514.2' }
    - { rank: 4, state: Iowa, incidence_rate: '511.9' }
    - { rank: 5, state: Minnesota, incidence_rate: '507.5' }
    - { rank: 6, state: New Jersey, incidence_rate: '497.1' }
    - { rank: 7, state: Wisconsin, incidence_rate: '494.5' }
    - { rank: 8, state: Maine, incidence_rate: '491.3' }
    - { rank: 9, state: South Dakota, incidence_rate: '490.2' }
    - { rank: 10, state: New Hampshire, incidence_rate: '484.9' }
- id: why-kentucky-has-highest-rate
  icon: fa-solid fa-microscope
  title: Why Kentucky Has Highest Cancer Rate
  paragraphs:
  - Kentucky's rate of 530.5 reflects a heavy burden from lung and other tobacco-related cancers. Decades of high cigarette use and radon exposure in homes are established contributors to lung cancer risk in the state.
  - Arizona's rate is 375.4, the lowest in the table. Lower incidence of several common cancers, including tobacco-related disease, helps keep its age-adjusted total below the national leaders.
