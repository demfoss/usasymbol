page:
  h1: Cancer Rate by State 2023
  quick_answer:
  - Cancer rate by state data put Kentucky first at 530.5 new cases per 100,000 people. Lung cancer is an important part of the state's cancer burden.
  - West Virginia ranks second at 517.8, followed by Louisiana at 514.2.
  - Arizona has the lowest age-adjusted incidence rate at 375.4 per 100,000, below New Mexico at 378.8.
  methodology: U.S. Cancer Statistics 2023 incidence rates cover all invasive cancer sites and all 50 states. Rates are age-adjusted to the 2000 U.S. standard population.
