faq:
- question: Which state has the highest cancer rate?
  answer: Kentucky has the highest age-adjusted incidence rate at 530.5 new cases per 100,000 people.
- question: What is the cancer rate in West Virginia?
  answer: West Virginia's rate is 517.8 new cases per 100,000, ranking second. Tobacco-related cancers contribute to the state's burden.
- question: Which state has the lowest cancer rate?
  answer: Arizona has the lowest rate at 375.4 per 100,000. New Mexico is next at 378.8.
- question: How many new cancer cases were recorded in California?
  answer: California recorded 196,553 new cases, the largest count in the table, while its age-adjusted rate ranked 43rd at 420.6.
- question: What does age-adjusted cancer rate mean?
  answer: Age adjustment applies the same standard age distribution to every state. That makes states more comparable even when their populations have different age profiles.
