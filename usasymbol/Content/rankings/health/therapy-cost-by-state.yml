page:
  h1: "Average Cost of Therapy by State"

  quick_answer:
    - "North Dakota has the highest average therapy session cost among states with published rates, $227, well above the $139 national average."
    - "Missouri has the lowest average cost at $122, a $105 gap behind North Dakota. Louisiana and South Carolina tie for second lowest at $123."
    - "The national average reached $139 per session in 2024, up $16 from the prior year. Only six states, Oklahoma, Tennessee, Vermont, South Carolina, Louisiana, and Missouri, average under $130."

  methodology: "Session fees are from SimplePractice's analysis of 104.7 million self-pay and insurance session fees billed in 2023-2024 by nearly 204,000 U.S. behavioral health therapists, covering CPT codes 90832-90838. Rates were published for 21 states; the remaining states are not shown."

  sources:
    - name: "SimplePractice"
      url: "https://www.simplepractice.com/blog/average-therapy-session-rate-by-state/"
      description: "EHR platform analysis of 104.7 million therapy session fees billed in 2023-2024 across nearly 204,000 U.S. behavioral health therapists"
