faq:
  - question: "What is the average cost of therapy in the United States?"
    answer: "The national average reached $139 per session in 2024, up $16 from the prior year, based on 104.7 million session fees billed by nearly 204,000 therapists."

  - question: "Which state has the highest therapy costs?"
    answer: "North Dakota, at an average of $227 per session among states with published rates. Alaska is second at $212, and South Dakota is third at $192."

  - question: "Which state has the lowest therapy costs?"
    answer: "Missouri, at $122 per session. Louisiana and South Carolina tie for second lowest at $123, followed by a tie between Tennessee and Vermont at $126."

  - question: "How much does therapy cost in New York?"
    answer: "New York's average session rate is $176, tied with Minnesota, $37 above the $139 national average."

  - question: "Which states have therapy costs under $130 per session?"
    answer: "Six states: Missouri ($122), Louisiana ($123), South Carolina ($123), Vermont ($126), Tennessee ($126), and Oklahoma ($129)."

