sections:
- id: states-with-highest-csection-rates
  icon: fa-solid fa-baby
  title: States With Highest C-Section Rates
  paragraphs:
  - Mississippi leads at 37.9%, followed by Florida at 36.3% and Louisiana at 36.1%. Prior cesarean deliveries, maternal health conditions, hospital practice patterns, and access to maternity care all influence state totals.
  - Connecticut ranks fourth at 35.8%, showing that high rates are not confined to one region. Maryland follows at 35.6%.
