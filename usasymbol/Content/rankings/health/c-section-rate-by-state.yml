page:
  h1: C-Section Rate by State
  quick_answer:
  - C-section rate by state data put Mississippi first at 37.9% of live births. Maternal health risks and repeat cesarean deliveries contribute to the state's total.
  - Florida ranks second at 36.3%, followed by Louisiana at 36.1%.
  - Alaska has the lowest cesarean delivery rate at 23.2%, followed by Idaho at 24.5%.
