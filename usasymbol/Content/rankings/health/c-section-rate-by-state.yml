faq:
- question: Which state has the highest C-section rate?
  answer: Mississippi has the highest rate at 37.9% of live births. Florida ranks second at 36.3%.
- question: Which state has the lowest C-section rate?
  answer: Alaska has the lowest rate at 23.2%. Idaho follows at 24.5%.
- question: What is the C-section rate in Texas?
  answer: Texas has a 34.5% cesarean delivery rate, tied with Kentucky for ninth.
- question: What is the C-section rate in California?
  answer: California's rate is 31.8%, tied with Tennessee for 23rd.
- question: What does the C-section rate measure?
  answer: The rate is the percentage of all live births delivered by cesarean to residents of each state.
