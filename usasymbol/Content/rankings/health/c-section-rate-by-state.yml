    - { rank: 9, state: Texas, c_section_rate: '34.5%' }
- id: why-mississippi-has-highest-rate
  icon: fa-solid fa-hospital
  title: Why Mississippi Has Highest Rate
  paragraphs:
  - Mississippi's 37.9% rate reflects a maternal population with substantial burdens from hypertension, diabetes, and obesity, conditions that can make surgical delivery more likely. Repeat cesareans also raise the statewide share because a previous cesarean often shapes later deliveries.
  - Alaska's 23.2% is the lowest rate. Different patient histories, hospital practices, and maternity care patterns leave surgical delivery less common there than in Mississippi.
