      url: "https://www.kff.org/medicaid/how-many-uninsured-are-in-the-coverage-gap-and-how-many-could-be-eligible-if-all-states-adopted-the-medicaid-expansion/"
      description: "Coverage gap definition and estimate for non-expansion states, July 2026"
