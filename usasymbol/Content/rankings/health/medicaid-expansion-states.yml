faq:
  - question: "How many states have expanded Medicaid?"
    answer: "Forty states and D.C. have adopted the expansion, and ten states have not. Twenty-six states began in 2014."
  - question: "Which states have not expanded Medicaid?"
    answer: "Alabama, Florida, Georgia, Kansas, Mississippi, South Carolina, Tennessee, Texas, Wisconsin, and Wyoming. Georgia and Wisconsin run waiver programs that cover some low-income adults."
  - question: "Which state expanded Medicaid most recently?"
    answer: "North Carolina, on December 1, 2023. South Dakota expanded earlier that year on July 1, 2023, after voters approved a constitutional amendment in 2022."
  - question: "Which states expanded Medicaid by ballot initiative?"
    answer: "Maine, Idaho, Nebraska, Utah, Oklahoma, Missouri, and South Dakota. Maine's vote came in 2017 and South Dakota's in 2022."
  - question: "What is the Medicaid coverage gap?"
    answer: "The gap covers adults who earn too much for their state's Medicaid but too little for Marketplace subsidies. About 1.2 million adults fall in it, all in states that have not expanded."
  - question: "Does Georgia have Medicaid expansion?"
    answer: "Not full expansion. Georgia's Pathways program offers coverage to some adults up to the poverty line, and requires 80 hours of qualifying activity a month."
  - question: "When do Medicaid work requirements start?"
    answer: "States must start by January 1, 2027, and Nebraska began in May 2026. The rules apply to expansion adults aged 19 to 64, with extensions available through the end of 2028."
  - question: "What states have Medicaid expansion trigger laws?"
    answer: "Thirteen states, including Arizona, Idaho, Illinois, Montana, North Carolina, and Virginia. A trigger law would end expansion or require cost offsets if federal funding fell."

