sections:
  - id: medicaid-expansion-timeline-by-year
    icon: "fa-solid fa-calendar-days"
    title: "Medicaid Expansion Timeline by Year"
    paragraphs:
      - "Most of the 26 states in the first 2014 wave moved the day the Affordable Care Act's coverage began. The law set a single income line for adults, 138% of the poverty level, and the federal government pays 90% of the cost for the added group. The Supreme Court made expansion optional in 2012, which is why other states joined one by one over the next decade."
      - "Michigan began in April 2014 and New Hampshire in August. North Carolina completed the most recent wave on December 1, 2023, and no state has ended its expansion since. Coverage differences show up in the [uninsured rate by state](/rankings/health/states-by-uninsured-rate)."
    table:
      columns:
        year: "Year"
        count: "States"
        states: "States That Began"
      rows:
        - { year: "2014", count: "26", states: "Arizona, Arkansas, California, Colorado, Connecticut, Delaware, Hawaii, Illinois, Iowa, Kentucky, Maryland, Massachusetts, Michigan, Minnesota, Nevada, New Hampshire, New Jersey, New Mexico, New York, North Dakota, Ohio, Oregon, Rhode Island, Vermont, Washington, West Virginia" }
        - { year: "2015", count: "3", states: "Alaska, Indiana, Pennsylvania" }
        - { year: "2016", count: "2", states: "Louisiana, Montana" }
        - { year: "2019", count: "2", states: "Maine, Virginia" }
        - { year: "2020", count: "3", states: "Idaho, Nebraska, Utah" }
        - { year: "2021", count: "2", states: "Missouri, Oklahoma" }
        - { year: "2023", count: "2", states: "North Carolina, South Dakota" }

  - id: states-that-expanded-medicaid-by-ballot
    icon: "fa-solid fa-check-to-slot"
    title: "States That Expanded Medicaid by Ballot Measure"
    paragraphs:
      - "Seven states expanded because voters approved it directly. Maine went first in 2017, and Idaho, Nebraska, and Utah followed in 2018, with Oklahoma and Missouri in 2020 and South Dakota in 2022. In these states the legislature had not passed expansion, so voters acted directly, a route open only where [ballot initiative states](/rankings/law/ballot-initiative-states) allow citizen-written measures."
      - "Idaho and Utah also have trigger laws, which would end or scale back coverage if the federal share of costs fell. Maine's vote in 2017 came first, but a court order was needed before coverage began in January 2019."
    table:
      columns:
        state: "State"
        vote: "Voters Approved"
        began: "Coverage Began"
      rows:
        - { state: "Maine", vote: "2017", began: "Jan 10, 2019" }
        - { state: "Idaho", vote: "2018", began: "Jan 1, 2020" }
        - { state: "Nebraska", vote: "2018", began: "Oct 1, 2020" }
        - { state: "Utah", vote: "2018", began: "Jan 1, 2020" }
        - { state: "Oklahoma", vote: "2020", began: "Jul 1, 2021" }
        - { state: "Missouri", vote: "2020", began: "Oct 1, 2021" }
        - { state: "South Dakota", vote: "2022", began: "Jul 1, 2023" }

  - id: states-that-have-not-expanded-medicaid
    icon: "fa-solid fa-house-medical"
    title: "States That Have Not Expanded Medicaid"
    paragraphs:
      - "Alabama, Florida, Georgia, Kansas, Mississippi, South Carolina, Tennessee, Texas, Wisconsin, and Wyoming have not expanded. Wisconsin and Georgia cover some low-income adults through waivers, and Georgia's Pathways program requires 80 hours of work or study each month. In the other eight, adults earning less than the poverty line often qualify for neither Medicaid nor Marketplace subsidies, which begin at 100% of that line."
      - "That gap is the coverage gap. About 1.2 million adults are in it, and the 2025 federal law ended the extra payment once offered to newly expanding states. Lawmakers in several non-expansion states considered proposals in 2026, and none had become law as of October 2026."
    table:
      columns:
        state: "State"
        note: "Coverage for Low-Income Adults"
      rows:
        - { state: "Alabama", note: "No expansion" }
        - { state: "Florida", note: "No expansion" }
        - { state: "Georgia", note: "Pathways waiver with work requirement" }
        - { state: "Kansas", note: "No expansion" }
        - { state: "Mississippi", note: "No expansion" }
        - { state: "South Carolina", note: "No expansion" }
        - { state: "Tennessee", note: "No expansion" }
        - { state: "Texas", note: "No expansion" }
        - { state: "Wisconsin", note: "Waiver covers adults up to 100% of poverty level" }
        - { state: "Wyoming", note: "No expansion" }

  - id: medicaid-work-requirements-and-trigger-laws
    icon: "fa-solid fa-briefcase-medical"
    title: "Medicaid Work Requirements and Trigger Laws"
    paragraphs:
      - "The 2025 federal law requires adults aged 19 to 64 in the expansion group to show 80 hours a month of work, study, or community service. States must begin by January 1, 2027, and can ask for extensions as late as December 31, 2028. Nebraska started in May 2026, ahead of the deadline."
      - "Thirteen expansion states have trigger laws, which would end expansion coverage or require steps to offset costs if federal funding drops. They are Arizona, Arkansas, Idaho, Illinois, Indiana, Iowa, Montana, New Hampshire, New Mexico, North Carolina, Ohio, Utah, and Virginia. None has been triggered."

