  description: "Forty states and D.C. have expanded Medicaid, 26 of them in 2014. Ten states have not, including Texas, Florida, and Georgia."

page:
  h1: "Medicaid Expansion by State"

  quick_answer:
    - "Medicaid expansion states number 40, plus D.C., and 26 of them started in 2014, the first year the Affordable Care Act offered it. North Carolina and South Dakota are the newest, both in 2023."
    - "Ten states have not expanded Medicaid. They are Alabama, Florida, Georgia, Kansas, Mississippi, South Carolina, Tennessee, Texas, Wisconsin, and Wyoming. About 1.2 million adults in them fall into a coverage gap."
    - "Seven states expanded by ballot measure, from Maine in 2017 to South Dakota in 2022. Federal work requirements for expansion adults must start by January 1, 2027."

  methodology: "Expansion status, implementation dates and trigger-law flags from KFF's state tracker, October 2026. Expansion year is the year coverage began. The ten states that have not expanded have no year. D.C. expanded in 2014 and is not in the 50-state table."

  sources:
