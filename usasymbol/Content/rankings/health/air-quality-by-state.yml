sections:
  - id: why-wyoming-has-the-cleanest-air
    icon: "fa-solid fa-wind"
    title: "Why Wyoming Has the Cleanest Air"
    paragraphs:
      - "Wyoming records 4.1 micrograms of fine particles per cubic meter, the lowest of any state. It is the least populous state, so few cars, furnaces and factories release particles, and steady wind across its high plains carries away what they do."
      - "Hawaii at 4.7 gets a different kind of help. Trade winds blow in from the Pacific over thousands of miles of open water, and the islands have little heavy industry. New Hampshire at 5.0 and Maine at 5.9 show the same pattern in the East, with forests, low [population density](/rankings/demographics/states-by-population-density) and winds off the Atlantic."
    table:
      columns:
        rank: "Rank"
