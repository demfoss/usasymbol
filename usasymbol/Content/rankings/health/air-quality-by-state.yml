  - id: why-california-has-the-worst-air-quality
    icon: "fa-solid fa-smog"
    title: "Why California Has the Worst Air Quality"
    paragraphs:
      - "California tops the pollution list at 11.7. The Central Valley, its farming heartland, is a long basin walled in by the Sierra Nevada and the Coast Ranges, so exhaust from trucks and farm equipment settles there instead of blowing away. Large wildfires add heavy smoke in bad seasons."
      - "Pennsylvania at 11.0 and Michigan at 10.4 follow, so the dirtiest air is not only a western problem. Both have dense industrial regions, and Pennsylvania's steel towns are the reason Pittsburgh is remembered for its smoky skies. Heavy wildfire states also appear in the [wildfire risk by state](/rankings/nature/wildfire-risk-by-state) ranking."
    table:
      columns:
        rank: "Rank"
        state: "State"
        pm25: "PM2.5 (µg/m³)"
      rows:
