faq:
  - question: "Which state has the best air quality?"
    answer: "Wyoming, at 4.1 micrograms of fine particles per cubic meter. Hawaii at 4.7 and New Hampshire at 5.0 come next."
  - question: "Which state has the worst air quality?"
    answer: "California, at 11.7. Pennsylvania at 11.0 and Michigan at 10.4 are the next dirtiest."
  - question: "What is the air quality in Texas?"
    answer: "Texas is at 9.4, ranking 43rd. Refineries and chemical plants along the Gulf Coast near Houston, plus heavy traffic in Dallas and other big metro areas, put more particles in the air than in most western states."
  - question: "Why is the air in Pennsylvania so polluted?"
    answer: "Pennsylvania's 11.0 reflects a long industrial past that still shapes the western part of the state. In 1948 a smog trapped in the river valley at Donora killed 20 people and became a turning point for U.S. clean air policy."
  - question: "What is the air quality in Florida?"
    answer: "Florida is at 7.6, tied for 16th with Idaho and Missouri. A peninsula surrounded by water gets steady ocean breezes that keep particles from building up."
  - question: "Is the air clean in Alaska?"
    answer: "Alaska is at 5.9, tied for fifth with Maine and New Mexico, since most of the state has almost no people or industry. Local trouble spots exist though, and Fairbanks gets winter pollution when cold air traps wood smoke near the ground."
