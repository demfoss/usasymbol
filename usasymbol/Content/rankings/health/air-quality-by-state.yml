  description: "Wyoming has the cleanest air at 4.1 micrograms of fine particles per cubic meter. California has the dirtiest at 11.7, and Hawaii is next at 4.7."
page:
  h1: "Air Quality by State"
  quick_answer:
    - "Wyoming has the best air quality at 4.1 micrograms of fine particles per cubic meter, helped by the smallest population of any state and steady wind across open plains."
    - "California has the worst air at 11.7, mostly because the Central Valley is a basin that holds pollution and wildfire smoke in place. Pennsylvania follows at 11.0 and Michigan at 10.4."
    - "Hawaii is second cleanest at 4.7, thanks to ocean winds that sweep the islands clean. New Hampshire ranks third at 5.0, the cleanest air in the eastern half of the country."
  methodology: "Average exposure of the general public to fine particulate matter (PM2.5) in micrograms per cubic meter, 2022–2024, from the EPA as compiled by America's Health Rankings. Rank 1 is the cleanest air. The 50 states are ranked and the District of Columbia (9.4) is excluded. The U.S. average is 8.8."
