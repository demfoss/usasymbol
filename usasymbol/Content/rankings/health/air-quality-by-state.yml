  - id: air-quality-in-the-great-lakes-states
    icon: "fa-solid fa-industry"
    title: "Air Quality in the Great Lakes States"
    paragraphs:
      - "Illinois at 10.3, Michigan at 10.4, Ohio at 9.8 and Indiana at 9.5 all rank among the ten worst. The region packs steel mills, power plants, major highways and big cities like Chicago and Detroit into one air basin."
      - "The 2022–2024 window also includes June 2023, when smoke from Canadian wildfires drifted over the Midwest and Northeast and turned skies orange in several cities. Fine particles in smoke are small enough to reach deep into the lungs, which links air quality to health measures like [life expectancy](/rankings/health/states-by-life-expectancy)."
