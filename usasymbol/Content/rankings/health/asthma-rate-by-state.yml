faq:
- question: Which state has the highest asthma rate?
  answer: West Virginia has the highest published adult current asthma prevalence at 13.9%.
- question: What is the adult asthma rate in Maine?
  answer: Maine's adult current asthma rate is 12.9%, ranking second among states with published estimates.
- question: Which state has the lowest asthma rate?
  answer: Mississippi has the lowest published rate at 7.1%.
- question: How many adults in California have current asthma?
  answer: California's weighted estimate is 2,688,439 adults, the largest count, while its prevalence rate is 8.8%.
- question: What does current asthma mean in this ranking?
  answer: Adults had to report that a health professional had diagnosed asthma and that they still had the condition at the time of the survey.
