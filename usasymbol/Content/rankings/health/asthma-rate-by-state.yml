page:
  h1: Asthma Rate by State 2023
  quick_answer:
  - Asthma rate by state estimates put West Virginia first at 13.9% of adults. The Appalachian state also faces high smoking exposure and occupational respiratory hazards.
  - Maine ranks second at 12.9%, followed by Rhode Island at 12.2%.
  - Mississippi has the lowest published adult current asthma prevalence at 7.1%.
  methodology: CDC BRFSS 2023 estimates adults who reported a health professional diagnosed asthma and they still had it. Kentucky and Pennsylvania reported no data and are excluded.
