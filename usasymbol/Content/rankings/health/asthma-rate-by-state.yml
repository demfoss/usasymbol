sections:
- id: states-with-highest-asthma-rates
  icon: fa-solid fa-lungs
  title: States With Highest Asthma Rates
  paragraphs:
  - West Virginia leads at 13.9%, followed by Maine at 12.9% and Rhode Island at 12.2%. Smoking exposure, housing conditions, air quality, and workplace irritants can all shape adult asthma patterns.
  - Massachusetts ranks fourth at 11.9%. New Hampshire and Oregon tie next at 11.8%, placing states from opposite coasts near the top.
  table:
    columns: { rank: Rank, state: State, asthma_rate: Adult Asthma Rate }
    rows:
    - { rank: 1, state: West Virginia, asthma_rate: '13.9%' }
    - { rank: 2, state: Maine, asthma_rate: '12.9%' }
    - { rank: 3, state: Rhode Island, asthma_rate: '12.2%' }
    - { rank: 4, state: Massachusetts, asthma_rate: '11.9%' }
    - { rank: 5, state: New Hampshire, asthma_rate: '11.8%' }
    - { rank: 5, state: Oregon, asthma_rate: '11.8%' }
    - { rank: 7, state: Montana, asthma_rate: '11.7%' }
    - { rank: 8, state: Indiana, asthma_rate: '11.5%' }
    - { rank: 9, state: Colorado, asthma_rate: '11.3%' }
    - { rank: 9, state: Oklahoma, asthma_rate: '11.3%' }
- id: why-west-virginia-ranks-highest
  icon: fa-solid fa-wind
  title: Why West Virginia Ranks Highest
  paragraphs:
  - West Virginia's 13.9% estimate sits amid high adult smoking exposure and a legacy of jobs involving dust and respiratory irritants. Those factors can worsen the respiratory burden carried by communities across the state.
  - Mississippi's 7.1% estimate is the lowest published result. The survey measure requires adults to report both a professional diagnosis and that they still have asthma, so diagnosis and response patterns directly shape the state percentage.
