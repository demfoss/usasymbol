  - Lyme disease cases by state put New York first with 22,173 reports in 2023. Its forests and suburban woodlands overlap the range of blacklegged ticks.
  - Pennsylvania ranks second with 16,671 cases, while Massachusetts ranks third with 9,715.
  - Alaska and Wyoming each reported 2 cases, the smallest published state totals. Cases are assigned by residence rather than the place of exposure.
