sections:
- id: states-with-most-lyme-cases
  title: States With Most Lyme Disease Cases
  paragraphs:
  - New York leads with 22,173 reports, followed by Pennsylvania at 16,671. Both states contain extensive wooded habitat where blacklegged ticks and their animal hosts can live close to homes and recreation areas.
  - Wisconsin ranks fifth with 6,283 cases, showing the other major U.S. concentration in the upper Midwest. Minnesota also appears in the top 10 with 2,938.
  table:
    columns: { rank: Rank, state: State, cases: Reported Cases }
    rows:
    - { rank: 1, state: New York, cases: 22173 }
    - { rank: 2, state: Pennsylvania, cases: 16671 }
    - { rank: 3, state: Massachusetts, cases: 9715 }
    - { rank: 4, state: New Jersey, cases: 7224 }
    - { rank: 5, state: Wisconsin, cases: 6283 }
    - { rank: 6, state: West Virginia, cases: 3242 }
    - { rank: 7, state: Connecticut, cases: 3239 }
    - { rank: 8, state: Maine, cases: 2942 }
    - { rank: 9, state: Minnesota, cases: 2938 }
    - { rank: 10, state: Rhode Island, cases: 2852 }
- id: why-new-york-has-most-cases
  title: Why New York Has Most Cases
  paragraphs:
  - New York's 22,173 reports reflect a large population living within the established range of blacklegged ticks. Wooded suburbs, parks, and second-growth forests provide the leaf litter and host animals that support the tick life cycle.
  - Alaska and Wyoming each reported 2 cases. Blacklegged tick populations associated with most U.S. transmission are centered far from those states, and a report follows the patient's residence even when exposure occurred elsewhere.
