faq:
- question: Which state has the most Lyme disease cases?
  answer: New York reported the most with 22,173 cases in 2023. Pennsylvania followed with 16,671.
- question: How many Lyme disease cases were reported in Pennsylvania?
  answer: Pennsylvania reported 16,671 cases, ranking second. Its wooded landscape lies within a well-established blacklegged tick region.
- question: How many Lyme disease cases were reported in Wisconsin?
  answer: Wisconsin reported 6,283 cases, ranking fifth. The upper Midwest is one of the country's two principal Lyme disease regions.
- question: Which states reported the fewest Lyme disease cases?
  answer: Alaska and Wyoming each reported 2 cases, the smallest published totals.
- question: Are Lyme disease cases assigned where exposure happened?
  answer: Cases are assigned to the person's reporting jurisdiction, usually the state of residence. A person may have encountered the infected tick while traveling elsewhere.
