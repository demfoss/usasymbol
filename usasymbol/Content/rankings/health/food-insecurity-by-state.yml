  - id: states-with-the-lowest-food-insecurity
    title: "States With the Lowest Food Insecurity"
    paragraphs:
      - "North Dakota has the lowest rate at 9.0%. Its [unemployment rate](/rankings/economy/states-by-unemployment) has stayed among the lowest in the country, and the oil boom in the Bakken formation lifted pay for truck drivers, welders and service workers."
      - "New Hampshire at 9.1% pairs high household incomes with the lowest poverty rate in the nation. South Dakota at 9.5% has the smallest share of very low food security at 3.4%. New Jersey at 9.8% sits among the states with the highest [median income](/rankings/economy/states-by-median-income)."
