  - id: states-with-the-most-very-low-food-security
    title: "States With Very Low Food Security"
    paragraphs:
      - "Kentucky has the highest rate of very low food security at 9.0%, meaning households where adults cut meal sizes or skipped meals because they could not afford food. Eastern Kentucky's coalfield counties have lost thousands of mining jobs, and few have replaced them with work at similar pay."
      - "West Virginia shows how the two measures can differ. Its overall rate of 14.1% ranks 13th, yet its very low rate of 4.3% is under the national figure. Mississippi is the reverse, ranking fifth overall and third at 6.9% for very low food security."
