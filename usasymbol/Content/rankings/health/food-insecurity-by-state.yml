sections:
  - id: why-arkansas-has-the-highest-food-insecurity
    title: "Why Arkansas Has the Highest Food Insecurity"
    paragraphs:
      - "Arkansas leads at 19.4%, close to one household in five. The eastern half of the state lies in the Mississippi Delta, a flat farming region where machines replaced field labor decades ago and many counties never found new employers. Household incomes trail most of the country, and the Delta counties are among the poorest by [poverty rate](/rankings/economy/states-by-poverty-rate)."
      - "The same river valley runs through Louisiana at 17.7% and Mississippi at 17.3%, so three of the five highest rates belong to Delta states. Texas at 17.6% has its own pocket along the Rio Grande border, where some of the poorest counties in the nation are found."
