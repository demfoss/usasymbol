faq:
  - question: "Which state has the highest food insecurity?"
    answer: "Arkansas, where 19.4% of households were food insecure. Kentucky at 18.8% and Louisiana at 17.7% rank next."
  - question: "Which state has the lowest food insecurity?"
    answer: "North Dakota, at 9.0%. New Hampshire at 9.1% and Vermont at 9.4% are close behind."
  - question: "What does food insecurity mean?"
    answer: "A household is food insecure when, at some point during the year, it could not afford enough food for everyone to live an active, healthy life. Very low food security is the more severe stage, when eating patterns were cut back."
  - question: "What is the food insecurity rate in Texas?"
    answer: "Texas is at 17.6%, ranking fourth, with 6.6% of households at the very low level. The Rio Grande Valley and the colonias near the border hold some of the state's hardest-pressed families."
  - question: "What is the food insecurity rate in California?"
    answer: "California is at 12.5%, tied with Kansas and Oregon for 26th and below the U.S. rate of 13.3%. Housing costs are the squeeze there, since rent leaves less room for groceries in a state with high wages."
  - question: "Which states are above the national food insecurity rate?"
    answer: "Six states stand clearly above the U.S. rate of 13.3% once margins of error are counted. They are Arkansas, Kentucky, Louisiana, Mississippi, Oklahoma and Texas."
