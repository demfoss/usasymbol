  description: "Arkansas has the highest household food insecurity at 19.4%. North Dakota has the lowest at 9.0%, and Kentucky is next highest at 18.8%."
page:
  h1: "Food Insecurity by State 2026"
  quick_answer:
    - "Arkansas has the highest household food insecurity at 19.4%, tied to deep rural poverty in the Mississippi Delta and low wages across much of the state."
    - "North Dakota has the lowest at 9.0%, helped by unemployment that is among the lowest in the country and the high wages of the western oil fields. New Hampshire follows at 9.1%."
    - "Kentucky ranks second at 18.8% and also leads the country in very low food security at 9.0%, the point where family members skip meals because the money runs out."
  methodology: "Share of households with low or very low food security (food insecure), three-year average for 2022–2024, from the USDA Economic Research Service using the Current Population Survey Food Security Supplement. Rank 1 is the highest rate. The District of Columbia (10.3%) is excluded. The U.S. rate is 13.3%. State margins of error run from about 1 to 3 points."
