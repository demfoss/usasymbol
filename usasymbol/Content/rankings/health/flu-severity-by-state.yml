sections:
  - id: "states_with_highest_flu_vaccination"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest Flu Vaccination Rates"
    paragraphs:
      - "Massachusetts has the highest adult flu vaccination rate in the country at 53.7%, the only state above 53%. Vermont follows at 52.4%, and Maine, New Hampshire, and Rhode Island round out the top five, each between 50.4% and 50.6%."
      - "All five of the top states sit in New England. Maryland is the highest-ranked state outside that region at 49.9%, followed by Connecticut at 47.3% and Washington at 46.1%."

  - id: "states_with_lowest_flu_vaccination"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Flu Vaccination Rates"
    paragraphs:
      - "Mississippi has the lowest adult flu vaccination rate at 33.0%, just behind Nevada at 33.1%. Florida (33.5%), Louisiana (33.7%), and Wyoming (33.9%) round out the bottom five, all under 34%."
      - "The gap between the top and bottom of the list spans more than 20 percentage points, from Massachusetts's 53.7% down to Mississippi's 33.0%. The national adult rate that year was 41.3%, roughly midway between the two."

faq:
  - question: "Which state has the highest adult flu vaccination rate?"
    answer: "Massachusetts has the highest adult flu vaccination rate at 53.7%. Vermont ranks second at 52.4%, and Maine ranks third at 50.6%."

  - question: "Which state has the lowest adult flu vaccination rate?"
    answer: "Mississippi has the lowest adult flu vaccination rate at 33.0%. Nevada is close behind at 33.1%, and Florida follows at 33.5%."

  - question: "What is the national average flu vaccination rate?"
    answer: "The national adult flu vaccination rate was 41.3% in the CDC's Behavioral Risk Factor Surveillance System data used here. Twenty-two of the 49 ranked states sat above that figure."

  - question: "How many states have flu vaccination rates above 50%?"
    answer: "Five states report adult flu vaccination rates above 50%: Massachusetts, Vermont, Maine, New Hampshire, and Rhode Island. All five are in New England."

  - question: "Is Tennessee included in this flu vaccination ranking?"
    answer: "No. Tennessee's adult flu vaccination rate was unavailable in the CDC Behavioral Risk Factor Surveillance System data for 2024 used in this ranking, so it is left out of the table."

