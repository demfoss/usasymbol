page:
  h1: "Flu Vaccination Rate by State"

  quick_answer:
    - "Massachusetts has the highest adult flu vaccination rate in the country at 53.7%, more than 20 points above Mississippi's last-place rate of 33.0%."
    - "The five highest-vaccination states, Massachusetts, Vermont, Maine, New Hampshire, and Rhode Island, are all in New England, and each reports a rate above 50%."
    - "Five states, Mississippi, Nevada, Florida, Louisiana, and Wyoming, all report adult flu vaccination rates below 34%, each more than 19 points behind Massachusetts."

  methodology: "Rates are the share of adults reporting a seasonal flu vaccine in the past 12 months, from the CDC's Behavioral Risk Factor Surveillance System, 2024, as compiled by America's Health Rankings. Tennessee data was unavailable that year."

