faq:
  - question: "Which state has the most people without health insurance"
    answer: "Texas has the highest uninsured rate in the U.S. at approximately 16–17%. The state has not expanded Medicaid under the Affordable Care Act, which leaves roughly 1–2 million low-income adults in a coverage gap. Texas also has a large undocumented immigrant population ineligible for most public coverage programs."
  - question: "Which states have near-universal health coverage"
    answer: "Massachusetts and Hawaii have the lowest uninsured rates, both under 3%. Massachusetts enacted the Health Connector reform in 2006 with an individual mandate, employer requirement, and Medicaid expansion — the template for the ACA. Hawaii has required employers to provide insurance to employees working more than 20 hours per week since 1974."
  - question: "How does Medicaid expansion affect uninsured rates"
    answer: "States that expanded Medicaid under the ACA (38 states plus D.C. as of 2025) cover adults earning up to 138% of the federal poverty level. Non-expansion states leave a gap for adults above traditional Medicaid eligibility but below income thresholds for marketplace subsidies. Non-expansion states consistently have higher uninsured rates."
  - question: "Why does having health insurance matter for state comparisons"
    answer: "Uninsured individuals delay or forgo preventive care, leading to worse health outcomes and higher emergency department use. States with higher uninsured rates tend to have lower life expectancy, higher rates of undetected chronic disease, and higher uncompensated care costs shifted to hospitals and insured patients."

