page:
  h1: "Uninsured Rate by State 2025"
  quick_answer:
    - "Texas has the highest share of residents without health insurance at approximately 16–17%, a position it has held for many years. Texas is the largest state that did not expand Medicaid under the Affordable Care Act, which leaves a significant coverage gap for low-income adults who earn too much for traditional Medicaid but too little for ACA marketplace subsidies."
    - "Massachusetts and Hawaii have the lowest uninsured rates, both below 3%. Massachusetts has had near-universal coverage since enacting its own health reform law in 2006 — the model for the ACA. Hawaii has a long-standing employer mandate that predates the ACA."
    - "The national uninsured rate is approximately 8% as of 2023, down significantly from 16% in 2010. States that expanded Medicaid have consistently lower uninsured rates than non-expansion states."
  methodology: "Uninsured rates represent the percentage of the civilian noninstitutionalized population with no health insurance coverage. Figures are 2023 one-year estimates from the U.S. Census Bureau American Community Survey (ACS), Table B27010."
  sources:
    - name: "U.S. Census Bureau — American Community Survey 2023"
