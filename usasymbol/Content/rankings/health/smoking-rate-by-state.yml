  description: "West Virginia has the highest adult smoking rate at 20.8%. Utah has the lowest at 5.7%. The national adult smoking rate is 11.6%."
page:
  h1: "Smoking Rate by State"
  quick_answer:
    - "The adult smoking rate is highest in West Virginia at 20.8%, nearly double the national rate of 11.6%. Appalachian tobacco country fills the top of the list."
    - "Utah has the lowest rate at 5.7%. Most Utahns belong to The Church of Jesus Christ of Latter-day Saints, whose Word of Wisdom health code forbids tobacco."
    - "Kentucky ranks second at 17.2% and Tennessee third at 17.0%. Burley tobacco has been a major Kentucky cash crop for generations."
  methodology: "Share of adults who have smoked at least 100 cigarettes and now smoke daily or some days, from the 2024 CDC Behavioral Risk Factor Surveillance System as compiled by America's Health Rankings. Tennessee's figure is its 2023 estimate because no 2024 value was published. The District of Columbia is not a state."
