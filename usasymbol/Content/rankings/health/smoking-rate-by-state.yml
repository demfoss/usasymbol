faq:
  - question: "Which state has the highest smoking rate?"
    answer: "West Virginia, where 20.8% of adults smoke cigarettes. Kentucky is next at 17.2%."
  - question: "Which state has the lowest smoking rate?"
    answer: "Utah, at 5.7%. California is second lowest at 7.6%, and Maryland third lowest at 7.8%."
  - question: "What is the smoking rate in Kentucky?"
    answer: "Kentucky's adult smoking rate is 17.2%, second highest in the country. Kentucky farmers still grow burley tobacco, a variety used in cigarettes."
  - question: "What is the smoking rate in California?"
    answer: "California's rate is 7.6%, which is 49th. Proposition 99 in 1988 raised the cigarette tax by 25 cents a pack and funded early anti-smoking advertising."
  - question: "Which states smoke more than the national average?"
    answer: "Twenty-six of the 50 states do. The national adult rate is 11.6%, and the states from West Virginia down to Pennsylvania at 11.7% sit above it. North Carolina at 11.5% is the first state below it."
  - question: "Does the smoking rate include vaping?"
    answer: "No, the rate counts cigarette smokers only. Oklahoma, tied eighth for smoking, tops the nation in e-cigarette use, as the [vaping rate by state](/rankings/health/vaping-rate-by-state) ranking shows."
