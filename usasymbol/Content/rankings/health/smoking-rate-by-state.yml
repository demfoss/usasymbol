sections:
  - id: why-west-virginia-has-the-highest-smoking-rate
    icon: "fa-solid fa-smoking"
    title: "Why West Virginia Smokes the Most"
    paragraphs:
      - "West Virginia leads the country at 20.8%, and Kentucky follows at 17.2%. Smoking falls as income and schooling rise, and West Virginia sits near the bottom of the states for household income and for the share of adults with college degrees, a pattern also visible in the [most educated states](/rankings/education/most-educated-us-states) list."
      - "Kentucky is one of the biggest burley tobacco growers, so the crop has been part of local life for generations, as the [tobacco production by state](/rankings/agriculture/tobacco-production-by-state) ranking shows."
