page:
  h1: "Vaping Rate by State"

  quick_answer:
    - "Oklahoma has the highest adult e-cigarette use rate of any state at 10.8%. Wyoming, Kentucky, and Arkansas follow closely, each at 10.7%."
    - "Maryland has the lowest adult vaping rate at 5.1%. Massachusetts and Connecticut are next lowest, both at 5.6%."
    - "The national adult vaping rate is 8.0%. Oklahoma's rate is more than double Maryland's, a 5.7-point gap between the top and bottom states."

  methodology: "Figures are America's Health Rankings' analysis of CDC Behavioral Risk Factor Surveillance System (BRFSS) data on adults who currently use e-cigarettes or vaping products daily or some days. Tennessee's figure is drawn from the state's most recent available BRFSS year."

