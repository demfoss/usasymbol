faq:
  - question: "What state has the highest vaping rate?"
    answer: "Oklahoma, at 10.8% of adults. Wyoming, Kentucky, and Arkansas are next, each at 10.7%."

  - question: "What state has the lowest vaping rate?"
    answer: "Maryland, at 5.1% of adults. Massachusetts and Connecticut follow, both at 5.6%."

  - question: "What percentage of U.S. adults vape?"
    answer: "About 8.0% of U.S. adults currently use e-cigarettes, according to BRFSS-based estimates. State rates range from Maryland's 5.1% to Oklahoma's 10.8%."

  - question: "Why does Oklahoma have such a high vaping rate?"
    answer: "Oklahoma's 10.8% adult vaping rate lines up with its 14.1% cigarette smoking rate, both well above the national averages of 8.0% and 11.6%. Maryland shows the reverse pattern, with a low 5.1% vaping rate and a low 7.8% smoking rate."

  - question: "What is the vaping rate among U.S. teenagers?"
    answer: "Nationally, 10% of U.S. high school students reported current e-cigarette use in 2023, down from 14.1% in 2022. Middle school current use was 4.6% in the same survey. State-level rates for teens are not published as consistently as the adult BRFSS figures used in this ranking."

  - question: "Is vaping more common in Southern states?"
    answer: "Seven of the top 10 states for adult vaping (Oklahoma, Kentucky, Arkansas, West Virginia, Tennessee, Alabama, and Louisiana) are in the South or Appalachia. The lowest rates cluster in the Northeast, led by Maryland, Massachusetts, and Connecticut."

