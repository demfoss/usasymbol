faq:
  - question: "Which state has the highest rate of Alzheimer's?"
    answer: "Maryland, where an estimated 127,200 residents 65 and older live with Alzheimer's. New York is next at 12.7%."

  - question: "Which state has the lowest Alzheimer's rate?"
    answer: "Alaska has the lowest at 8.8%. Idaho and Montana follow at 9.8%, and Idaho ranks ahead because it has more people with the disease."

  - question: "How many people in Florida have Alzheimer's?"
    answer: "About 579,900 Floridians 65 and older, or 12.5% of that age group. Only California has more people living with Alzheimer's."

  - question: "What is the Alzheimer's rate in Texas?"
    answer: "Texas has 11.9% of residents 65 and older with Alzheimer's, about 459,300 people. That ranks 10th by share and third by number of people."

  - question: "Why does California have the most Alzheimer's cases if Maryland ranks first?"
    answer: "California has 719,700 people with Alzheimer's against Maryland's 127,200 because its older population is far larger. Its share of 12.0% ranks seventh."

  - question: "Why does the ranking count only people 65 and older?"
    answer: "Risk rises sharply with age, and most people with Alzheimer's are in this group. Counting the whole population would mostly reward states with younger residents rather than show how common the disease is among older adults."

