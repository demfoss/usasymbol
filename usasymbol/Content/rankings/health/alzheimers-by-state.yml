page:
  h1: "Alzheimer's by State"

  quick_answer:
    - "Alzheimer's is most common in Maryland, where 12.9% of residents 65 and older live with it. Older Black Americans have higher rates, and Maryland has one of the largest Black populations of any state."
    - "Alaska has the lowest share at 8.8%, or 8,400 people. Its population is among the youngest in the country, and Alzheimer's risk climbs steeply with age."
    - "California has the most people living with Alzheimer's at 719,700, yet its share of 12.0% ranks seventh. Florida (579,900) and Texas (459,300) follow in raw numbers."

  methodology: "Estimated share and number of residents 65 and older living with Alzheimer's dementia in 2020, as printed on the Alzheimer's Association 2026 Facts and Figures state sheets. States with the same share are ordered by number of people. The District of Columbia is not ranked."

  sources:
    - name: "Alzheimer's Association, 2026 Alzheimer's Disease Facts and Figures"
      url: "https://www.alz.org/alzheimers-dementia/facts-figures"
      description: "National report with a state-by-state prevalence table for adults 65 and older"
