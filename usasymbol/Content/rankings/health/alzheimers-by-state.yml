      - "Alaska sits a full point below every other state at 8.8%. Alzheimer's risk rises steeply with age, and Alaska has one of the lowest [median ages](/rankings/demographics/median-age-by-state) in the country, so its 8,400 older residents with the disease are a small group."
      - "Idaho and Montana tie at 9.8%, with Wyoming and Vermont just behind at 9.9%. Each is a mountain or rural state whose older residents are largely White, the group with the lowest estimated rates in the Association's data."

