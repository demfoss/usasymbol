    paragraphs:
      - "Maryland leads at 12.9%, followed by New York at 12.7%, Florida and Mississippi at 12.5%, and Louisiana at 12.4%. The list pairs Florida, the classic retirement destination, with Mississippi and Louisiana, which are far younger overall."
      - "Florida's 579,900 people with Alzheimer's is more than any state except California. Families facing memory care can compare what long-term care costs in [assisted living cost by state](/rankings/health/assisted-living-cost-by-state)."

  - id: "why-maryland-has-the-highest-alzheimers-rate"
    title: "Why Maryland Has the Highest Alzheimer's Rate"
    paragraphs:
      - "Maryland's 12.9% reflects who lives there. The Alzheimer's Association reports that older Black Americans are about twice as likely as older White Americans to have Alzheimer's or another dementia, and older Hispanic Americans about one and a half times as likely. Maryland has one of the largest Black populations of any state."
      - "The same pattern helps lift Mississippi (12.5%) and Louisiana (12.4%), and it fits New York and New Jersey, where large Black and Hispanic communities live among an aging population."

