    paragraphs:
      - "Louisiana, Mississippi, and Alaska lead at 792.4, 700.9, and 697.7 cases per 100,000. Six of the top seven are Southern states, running from Alabama at 651.1 and Georgia at 646.4 down to North Carolina at 607.9."
      - "Gonorrhea follows a similar pattern, but Alaska leads it at 310.9, ahead of Louisiana at 288.4 and Georgia at 274.8. Both infections are curable with antibiotics, and because chlamydia often causes no symptoms, most cases are found through screening."

  - id: "why-louisiana-has-the-highest-chlamydia-rate"
    title: "Why Louisiana Has the Highest Chlamydia Rate"
    paragraphs:
      - "Louisiana reports 792.4 chlamydia cases per 100,000 residents, about four times New Hampshire's 196.6. An infection with no symptoms enters the statistics only when someone is tested, and CDC identifies adolescents and young adults as the group with the highest rates."
      - "Louisiana has sat at or near the top of CDC's state tables for years, alongside Mississippi and Alaska. CDC notes that reported rates reflect how much testing a state does and how fully clinics and labs report, so a high number can partly signal an active screening program."

  - id: "lowest-chlamydia-rates-by-state"
    title: "Lowest Chlamydia Rates by State"
    paragraphs:
      - "New Hampshire reports 196.6 cases per 100,000, with Vermont at 201.9 and Maine at 217.4. All three rank among the oldest states by median age, while CDC data show chlamydia is most common among people aged 15 to 24."
      - "West Virginia is the lowest state outside New England at 249.0, ahead of Idaho at 294.9 and Wyoming at 313.2. The District of Columbia is not ranked because it is not a state, but its 1,228.0 cases per 100,000 in an entirely urban jurisdiction would top every state."

