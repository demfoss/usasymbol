faq:
  - question: "What is the chlamydia rate in the United States?"
    answer: "CDC reported 492.2 chlamydia cases per 100,000 people for 2023. The national gonorrhea rate was 179.5 and the primary and secondary syphilis rate was 15.8."

  - question: "Which state has the highest STD rate?"
    answer: "It depends on the infection. Louisiana leads for chlamydia at 792.4, Alaska for gonorrhea at 310.9, and South Dakota for primary and secondary syphilis at 73.4."

  - question: "Which state has the lowest chlamydia rate?"
    answer: "New Hampshire has the lowest rate at 196.6. Vermont is lowest for gonorrhea at 34.0 and for primary and secondary syphilis at 0.5, a rate built on only 3 reported cases."

  - question: "Which state has the highest syphilis rate?"
    answer: "South Dakota reports 73.4 primary and secondary syphilis cases per 100,000, from 675 cases. New Mexico is next at 36.6 and Mississippi third at 30.1."

  - question: "What is the chlamydia rate in Texas?"
    answer: "Texas reports 491.9 chlamydia cases per 100,000, which ranks 20th and sits just under the U.S. rate of 492.2. Its gonorrhea rate is 176.4 and its primary and secondary syphilis rate is 15.0."

  - question: "Why does Alaska have such high STD rates?"
    answer: "Alaska ranks third for chlamydia at 697.7 and first for gonorrhea at 310.9. It has a young population and large Army and Air Force bases, and remote communities depend on a small network of clinics for testing."

