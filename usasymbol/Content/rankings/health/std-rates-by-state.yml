  description: "Louisiana has the highest reported chlamydia rate at 792.4 cases per 100,000 people. New Hampshire has the lowest at 196.6."

page:
  h1: "Chlamydia and STD Rates by State"

  quick_answer:
    - "Chlamydia rates are highest in Louisiana at 792.4 reported cases per 100,000 people, about four times New Hampshire's rate. Most infections cause no symptoms, so reported rates follow how much testing a state does."
    - "New Hampshire has the lowest rate at 196.6, followed by Vermont at 201.9 and Maine at 217.4. All three are among the oldest states by median age, and chlamydia is most common among people under 25."
    - "Alaska ranks third for chlamydia at 697.7 but first for gonorrhea at 310.9. South Dakota leads for primary and secondary syphilis at 73.4, about twice the 36.6 of runner-up New Mexico."

  methodology: "Reported chlamydia cases per 100,000 population in 2023, the latest year with state tables in CDC Sexually Transmitted Infections Surveillance. Gonorrhea and primary and secondary syphilis rates come from the same report. The District of Columbia is not ranked."

