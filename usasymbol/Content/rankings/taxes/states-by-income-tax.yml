sections:
  - id: "why_california_highest"
    icon: "fa-solid fa-percent"
    title: "Why California Has the Highest State Income Tax Rate"
    paragraphs:
      - "California's top marginal rate of 13.3% applies to income above $1 million and was established through a series of ballot measures, Proposition 30 (2012), Proposition 55 (2016), and Proposition 63 (2018). California uses a progressive income tax with 10 brackets, reaching 9.3% at $66,295 for single filers. The top rate is roughly double the rate in most other high-tax states."
      - "Hawaii (11.0%), New York (10.9%), and New Jersey (10.75%) follow. Oregon (9.9%) rounds out the top five. All five states use progressive structures with multiple brackets. High rates reflect decisions to fund education, healthcare, and infrastructure primarily through income tax rather than through sales or property taxes."

  - id: "nine_states_no_income_tax"
    icon: "fa-solid fa-ban"
    title: "Nine States Collect No State Income Tax on Wages"
    paragraphs:
      - "Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming do not tax wage income at the state level. These nine states represent about 30% of the U.S. population. They fund government through a combination of sales taxes, property taxes, severance taxes on natural resources, and, in Alaska's case, sovereign wealth fund distributions."
      - "The no-income-tax group is economically diverse. Texas and Florida are large, high-growth states that substitute a sales tax burden. New Hampshire has neither income nor sales tax and instead relies on among the highest property tax rates in the country. Tennessee long taxed investment income but eliminated that levy in 2021. Washington state has no income tax but funds government partly through a 6.5% sales tax and business and occupation taxes."

  - id: "no_tax_not_low_burden"
    icon: "fa-solid fa-scale-balanced"
    title: "No Income Tax Does Not Mean No Tax Burden"
    paragraphs:
      - "New Hampshire has no income tax and no sales tax, which sounds like a low-tax state. But its property tax rate of 1.66% is the fourth-highest in the country. Local governments in New Hampshire fund public schools almost entirely through property taxes, because no broad-based state revenues replace the income and sales tax streams that most states rely on."
      - "A household owning a $400,000 home in New Hampshire pays roughly $6,600 per year in property taxes. The same household in Tennessee, which also has no income tax but a lower property tax rate of 0.48%, pays around $1,920. The absence of one tax type frequently shifts burden toward another. Total state and local tax burden gives a more accurate picture than any single rate. See [states by property tax](/rankings/taxes/states-by-property-tax) for the full comparison."

  - id: "flat_vs_progressive"
    icon: "fa-solid fa-chart-bar"
    title: "Flat Rate vs. Progressive: Two Different Structures"
    paragraphs:
      - "Twelve states use a flat income tax, a single rate applied to all taxable income regardless of amount. Illinois (4.95%), Indiana (3.15%), and Michigan (4.05%) are examples. Flat-tax states are simpler to administer but apply the same percentage to a minimum-wage worker and a millionaire."
      - "Progressive systems, used by most states, apply higher rates only to income above specific thresholds. California's 9.3% rate kicks in above $66,295 for single filers; income below that level is taxed at lower rates starting from 1%. Most residents in high-rate states pay effective rates far below the headline top marginal rate. The top marginal rate is relevant primarily for high earners and for comparing state policy choices."

