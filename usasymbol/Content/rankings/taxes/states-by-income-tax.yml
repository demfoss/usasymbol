page:
  h1: "State Income Tax Rates 2025"
  quick_answer:
    - "California has the highest top marginal state income tax rate at 13.3%, which applies to income above $1 million. Hawaii (11%), New Jersey (10.75%), Oregon (9.9%), and Minnesota (9.85%) round out the top five."
    - "Nine states have no state income tax on wages: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming. New Hampshire taxes interest and dividends but not earned wages."
    - "Most states use a graduated bracket structure where higher incomes face higher rates. A handful of states — including Colorado, Illinois, Indiana, and Pennsylvania — use a flat rate that applies equally to all income levels."
  methodology: "Rates reflect the top marginal state income tax rate on ordinary income (wages, salaries) as of January 2025. States with graduated brackets are shown at the highest bracket rate. States with flat rates show that single rate. 0.0% indicates no state income tax. Local income taxes are not included."
