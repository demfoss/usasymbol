faq:
  - question: "Which states have no income tax"
    answer: "Nine states have no state income tax on wages: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming. New Hampshire taxes interest and dividend income at 3% but not earned wages. Washington state has no personal income tax but does impose a capital gains tax on high earners."
  - question: "Which state has the highest income tax rate"
    answer: "California has the highest top marginal state income tax rate at 13.3%, which applies to taxable income over $1 million. At more moderate income levels — say $100,000 — the applicable California rate is 9.3%. Hawaii, New Jersey, and Oregon round out the states with the highest top rates."
  - question: "Does a lower income tax mean lower overall taxes"
    answer: "Not necessarily. States without an income tax often compensate with higher property taxes, higher sales taxes, or other levies. Texas and Florida have no income tax but impose some of the highest property taxes in the country. New Hampshire has no income tax or sales tax but has among the highest property tax rates."
  - question: "What is the difference between a flat tax and a graduated tax"
    answer: "A flat income tax applies one single rate to all income levels. Colorado (4.4%), Illinois (4.95%), Indiana (3.15%), and Pennsylvania (3.07%) use flat rates. A graduated tax applies higher rates to higher income brackets. Most states and the federal government use graduated structures."

