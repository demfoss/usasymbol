page:
  h1: "Property Tax Rate by State 2026"
  quick_answer:
    - "New Jersey has the highest effective property tax rate in the U.S. at 2.11% of assessed value. A homeowner with a $400,000 house pays roughly $8,400 per year. Illinois (2.01%), Connecticut (1.81%), and New Hampshire (1.66%) follow."
    - "Hawaii has the lowest effective property tax rate at just 0.27%. Alabama, Colorado, and Louisiana also rank among the lowest. Low rates in Hawaii are partly offset by very high home values — the dollar tax bill can still be substantial."
    - "Effective property tax rate measures actual taxes paid as a percentage of assessed home value, which is more useful for comparison than statutory rates, which vary by local assessment practices."
  methodology: "Effective property tax rates are from WalletHub's 2026 Property Tax by State report using 2024 data. The effective rate is calculated as median annual property taxes paid divided by the median home value, expressing taxes as a percentage of the home's value. This controls for differences in assessment ratios across states."
  sources:
