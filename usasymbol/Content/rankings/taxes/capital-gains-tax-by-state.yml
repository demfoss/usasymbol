faq:
  - question: "What state has the highest capital gains tax?"
    answer: "California has the highest rate at 13.3%, which includes a 1% surcharge on taxable income over $1 million. New York follows at 10.9%."

  - question: "Which states have no capital gains tax?"
    answer: "Eight states levy no capital gains tax: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, and Wyoming."

  - question: "What is the capital gains tax rate in Washington state?"
    answer: "Washington taxes capital gains at 7%, but real estate, retirement savings accounts, livestock, and timber are exempt from the tax."

  - question: "What state has the lowest capital gains tax among states that tax it?"
    answer: "Arizona has the lowest rate on record at 2.5%, followed by North Dakota at 2.9% and Pennsylvania at 3.07%."

  - question: "Do states tax capital gains at the same rate as income?"
    answer: "Most states tax capital gains as ordinary income at the same top rate shown here. A few states, marked with possible special treatment, give capital gains income preferential treatment or allow a deduction for federal taxes paid."

  - question: "What is the capital gains tax rate in Massachusetts?"
    answer: "Massachusetts has a 9% top rate, but short-term capital gains are taxed separately at 12%, and taxable income over $1 million pays an additional 4%."

