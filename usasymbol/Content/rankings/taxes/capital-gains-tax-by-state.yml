page:
  h1: "Capital Gains Tax by State"

  quick_answer:
    - "California has the highest state capital gains tax rate in the country at 13.3%, which includes a 1% surcharge on taxable income over $1 million."
    - "New York (10.9%), District of Columbia and New Jersey (10.75% each), and Oregon (9.9%) round out the top five highest rates."
    - "Eight states levy no capital gains tax at all: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, and Wyoming. Arizona has the lowest rate among states that do tax capital gains, at 2.5%."

  methodology: "Rates reflect each state's top capital gains tax rate on record for 2026. Most states tax capital gains as ordinary income; a few give preferential treatment, a federal deduction, or include local taxes."

  sources:
