sections:
  - id: "states-with-the-highest-capital-gains-tax-rates"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest Capital Gains Tax Rates"
    paragraphs:
      - "California has the highest capital gains tax rate in the country at 13.3%, which includes a 1% surcharge on taxable income over $1 million. New York follows at 10.9%, and District of Columbia and New Jersey are tied at 10.75%."
      - "Massachusetts stands out for its structure rather than its 9% top rate: short-term capital gains are taxed separately at 12%, and taxable income over $1 million pays an additional 4%. Oregon (9.9%) and Minnesota (9.85%) round out the top six."

  - id: "states-with-no-capital-gains-tax"
    icon: "fa-solid fa-ban"
    title: "States With No Capital Gains Tax"
    paragraphs:
      - "Eight states levy no capital gains tax at all: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, and Wyoming. Among states that do tax capital gains, Arizona has the lowest rate on record at 2.5%, followed by North Dakota at 2.9%."
      - "Washington taxes capital gains at 7% but exempts real estate, retirement savings accounts, livestock, and timber from the tax, a narrower base than most states that levy a capital gains tax."

