faq:
  - question: "What is the grocery tax by state?"
    answer: "The grocery tax by state refers to the state and sometimes local sales tax applied to ordinary grocery food -- items like produce, meat, dairy, and packaged goods sold for home preparation. Most states either exempt groceries from sales tax entirely or have no statewide sales tax at all; a smaller group taxes groceries at the full general rate or at a reduced rate. The 50-state table above shows the specific grocery tax status, state rate, and local tax situation for every state as of 2026."

  - question: "Which states tax groceries in 2026?"
    answer: "In 2026, ten states tax grocery food at the state level. Four apply the full general rate: Hawaii (4% general excise tax), Idaho (6%), Mississippi (7%), and South Dakota (4.5%). Six apply a reduced rate: Alabama (3%), Arkansas (0.125%), Missouri (1.225%), Tennessee (4%), Utah (3%), and Virginia (2.5%). Local taxes may raise the effective combined total in most of these states."

  - question: "Which states have no grocery tax?"
    answer: "In 2026, five states have no statewide sales tax at all (Alaska, Delaware, Montana, New Hampshire, and Oregon) so no state grocery tax applies by default. An additional 35 states explicitly exempt grocery food from sales tax, including California, Texas, New York, Florida, Illinois (as of January 1, 2026), and Kansas (as of January 1, 2025). Note that local grocery taxes may still apply in Alaska, Louisiana, and some jurisdictions in Colorado, Arizona, Oklahoma, Kansas, and Illinois."

  - question: "How many states have no sales tax on groceries?"
    answer: "Based on the 50-state table, 40 states apply no state sales tax to ordinary grocery food: 5 states with no statewide sales tax and 35 states with explicit grocery exemptions. The remaining 10 states tax groceries, either at the full general rate (4 states) or at a reduced grocery-specific rate (6 states)."

  - question: "Are groceries taxed the same as restaurant meals?"
    answer: "No. In states that exempt grocery food, restaurant meals and prepared food are almost always taxed separately, sometimes at rates higher than the general sales tax. New Hampshire charges no sales tax at all but applies an 8.5% meals and rooms tax to restaurant purchases. Vermont exempts groceries but taxes restaurant meals at 9%. The distinction generally turns on whether food is sold hot, ready to eat, or with utensils provided by the seller."

  - question: "Can local governments tax groceries even when the state does not?"
    answer: "Yes, in some states. Louisiana parishes set their own grocery tax rates independently of the state exemption, and many do tax groceries. Alaska has no state law to preempt local grocery taxes, so local jurisdictions can impose them. Colorado and Arizona allow home-rule cities to define their own tax bases, which can include groceries. States that recently eliminated their state grocery tax (Kansas, Oklahoma, and Illinois) did not require local governments to follow suit, so local grocery taxes may persist in some of those communities."

