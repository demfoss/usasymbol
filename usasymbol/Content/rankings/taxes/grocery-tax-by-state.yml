seo:
  title: "Grocery Tax by State 2026: Which States Tax Food?"
  description: "See the grocery tax by state in 2026, including which states tax groceries, which states exempt food, and where local taxes may apply."

page:
  h1: "Grocery Tax by State in 2026: Is There Sales Tax on Food?"

  quick_answer:
    - "Ten states tax grocery food in 2026 (Alabama, Arkansas, Hawaii, Idaho, Mississippi, Missouri, South Dakota, Tennessee, Utah, and Virginia) with rates from 0.125% in Arkansas to 7% in Mississippi. The other 40 states either exempt groceries entirely or have no statewide sales tax."
    - "Two major changes took effect recently: Illinois eliminated its 1% state grocery tax on January 1, 2026, and Kansas reached 0% on January 1, 2025 after a three-year phasedown from 6.5%. Even in states with no state grocery tax, local governments in Louisiana, Alaska, Colorado, and Arizona may still tax groceries independently."

  methodology: "State rates reflect the applicable state sales tax on ordinary grocery food, defined as food sold for home preparation and consumption, as of January 1, 2026. Local tax entries indicate whether local jurisdictions in that state may separately tax groceries. Prepared food, restaurant meals, candy, and soft drinks are noted in the table where they differ from the grocery rule but are not the primary focus of this page. Hawaii's general excise tax is treated as functionally equivalent to a sales tax for comparison purposes. Data is drawn from state revenue department publications, Tax Foundation surveys, and Streamlined Sales Tax Governing Board guidance current through early 2026."

  sources:
    - name: "Tax Foundation: State Sales Tax Rates and Food Exemptions"
      url: "https://taxfoundation.org/data/all/state/sales-taxes-on-food/"
      description: "Annual survey of state sales tax treatment of grocery food, updated for 2025 and 2026"
    - name: "USDA Economic Research Service: Food Expenditure Series"
      url: "https://www.ers.usda.gov/data-products/food-expenditure-series/"
      description: "Federal data on household food expenditures and state tax policy effects on food purchases"
    - name: "Illinois Department of Revenue"
      url: "https://tax.illinois.gov/"
      description: "Official guidance on the elimination of Illinois' 1% state grocery tax effective January 1, 2026"
    - name: "Kansas Department of Revenue: Food Sales Tax"
      url: "https://www.ksrevenue.gov/"
      description: "Official guidance on the three-year phasedown and final elimination of Kansas state grocery tax as of January 2025"
    - name: "Federation of Tax Administrators"
      url: "https://taxadmin.org/"
      description: "State-by-state tax administration data including sales tax base and food exemption status"
    - name: "Streamlined Sales Tax Governing Board"
      url: "https://www.streamlinedsalestax.org/"
      description: "Uniform definitions for food and food ingredients used by member states to administer grocery exemptions"

