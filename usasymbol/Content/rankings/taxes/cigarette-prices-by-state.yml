page:
  h1: "Cigarette Prices by State 2026"

  quick_answer:
    - "Cigarette prices by state peak in New York at $14.83 a pack on average. New York also charges the highest state excise tax, $5.35 a pack, and New York City adds its own tax on top."
    - "Missouri has the cheapest cigarettes at $8.01 a pack. Its $0.17 state tax is the lowest in the country and has not changed since 1993, because Missouri voters have turned down every proposed increase at the ballot box."
    - "Alaska ranks seventh at $12.99 a pack even though its state tax is only $2.00. Almost everything sold there, cigarettes included, has to travel long distances by barge, plane, or truck before it reaches a store shelf."

  methodology: "Average retail prices and state excise taxes per pack from World Population Review's 2026 table, current as of January 6, 2026. Prices include federal and state taxes. Local city or county cigarette taxes are not broken out."

  sources:
