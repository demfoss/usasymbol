  - id: "highest-cigarette-taxes-by-state"
    icon: "fa-solid fa-file-invoice-dollar"
    title: "States With the Highest Cigarette Taxes"
    paragraphs:
      - "Maryland charges the second highest cigarette tax at $5.00, yet its $13.47 average price ranks fourth, behind Rhode Island and Connecticut. Cigarette taxes work like the [gas tax by state](/rankings/economy/gas-tax-by-state), a flat amount per unit, so wholesale costs and store markups still shape much of the final price."
      - "Oregon's $3.33 tax comes from Measure 108, which voters approved in 2020 to help pay for the Oregon Health Plan. Even so, Oregon ranks only 16th for price at $11.41, below Illinois and Washington, which both tax a pack less."
    table:
      numbered: true
      columns:
        state: "State"
        excise_tax: "Excise Tax"
      rows:
        - state: "New York"
          excise_tax: "$5.35"
        - state: "Maryland"
          excise_tax: "$5.00"
        - state: "Rhode Island"
