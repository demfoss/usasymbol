  - id: "lowest-cigarette-taxes-by-state"
    icon: "fa-solid fa-leaf"
    title: "States With the Lowest Cigarette Taxes"
    paragraphs:
      - "Georgia ($0.37), North Carolina ($0.45), and Virginia ($0.60) all sit near the bottom for cigarette taxes, and tobacco farming explains why. North Carolina grows more tobacco than any other state, as [tobacco production by state](/rankings/agriculture/tobacco-production-by-state) shows. Virginia built its colonial economy on the crop after John Rolfe planted it at Jamestown in 1612."
      - "Virginia also shows how a low state tax can mislead. Its $0.60 rate is among the ten lowest, but a pack still averages $9.63 because many Virginia counties and cities collect their own cigarette taxes."
    table:
