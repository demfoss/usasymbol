  - id: "cheapest-states-for-cigarettes"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Why Missouri Has the Cheapest Cigarettes"
    paragraphs:
      - "Missouri sells the cheapest cigarettes at $8.01 a pack, and its $0.17 state tax is the reason. The rate dates to 1993. Since then, Missouri voters have rejected higher cigarette taxes at the ballot in 2002, 2006, 2012, and twice in 2016."
      - "Alabama ($8.34), South Carolina ($8.43), Mississippi ($8.58), and North Dakota ($8.71) round out the bottom five. North Dakota is the only northern state in that group, and its voters also turned down a large increase to the $0.44 tax in 2016."
    table:
      numbered: true
      columns:
        state: "State"
        price_per_pack: "Price per Pack"
      rows:
        - state: "Missouri"
          price_per_pack: "$8.01"
        - state: "Alabama"
