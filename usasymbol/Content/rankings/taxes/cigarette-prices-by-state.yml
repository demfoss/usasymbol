sections:
  - id: "most-expensive-states-for-cigarettes"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Why Cigarettes Cost the Most in New York"
    paragraphs:
      - "New York charges a $5.35 state excise tax on every pack, the highest in the country, and that tax explains much of its $14.83 average price. Lawmakers in Albany have raised the rate again and again to discourage smoking, most recently from $4.35 to $5.35 in 2023."
      - "New York City adds a local cigarette tax and a minimum legal price per pack, so a pack in Manhattan costs more than the statewide average suggests. Connecticut, third at $13.63, is a surprise in this group, since farms in its Connecticut River Valley still grow shade tobacco used to wrap premium cigars."
    table:
      numbered: true
      columns:
        state: "State"
        price_per_pack: "Price per Pack"
      rows:
        - state: "New York"
          price_per_pack: "$14.83"
        - state: "Rhode Island"
          price_per_pack: "$13.72"
        - state: "Connecticut"
          price_per_pack: "$13.63"
        - state: "Maryland"
