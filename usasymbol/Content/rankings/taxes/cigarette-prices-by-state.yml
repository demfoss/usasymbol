faq:
  - question: "Which state has the most expensive cigarettes?"
    answer: "New York, where a pack averages $14.83. That is $4.68 above the $10.15 national average, the widest gap of any state."

  - question: "Which state has the cheapest cigarettes?"
    answer: "Missouri, at $8.01 a pack. Neighboring Illinois averages $12.37, a $4.36 jump that is the widest price gap across any state line in the table."

  - question: "What is the average price of a pack of cigarettes in 2026?"
    answer: "$10.15 a pack nationally. Utah ($10.25) and Texas ($10.04) come closest to that figure, with 24 states above it and 26 below."

  - question: "Which state has the highest cigarette tax?"
    answer: "New York, at $5.35 a pack. Maryland is the only other state charging $5.00 or more, and Rhode Island follows at $4.50."

  - question: "Which state has the lowest cigarette tax?"
    answer: "Missouri, at $0.17 a pack. Georgia is next at $0.37, a rate it has kept since 2003."

  - question: "How much do cigarettes cost in California?"
    answer: "An average of $11.78 a pack, 14th in the country. California's $2.87 state tax jumped after voters passed Proposition 56 in 2016, with the money going largely to health care and tobacco prevention."

  - question: "How much do cigarettes cost in Texas?"
    answer: "$10.04 a pack on average, just under the national figure. Texas lawmakers set the current $1.41 tax in 2006 as part of a plan to cut local school property taxes."

  - question: "Why are cigarettes cheaper in New Hampshire than in Massachusetts?"
    answer: "A pack averages $9.42 in New Hampshire and $13.28 in Massachusetts. New Hampshire's $1.78 tax is about half the Massachusetts rate of $3.51, and the state has no general [sales tax](/rankings/taxes/sales-tax-by-state) either, which draws shoppers north across the border."

