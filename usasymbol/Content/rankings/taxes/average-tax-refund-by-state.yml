    paragraphs:
      - "Maine has the smallest average federal refund at $2,463, about $1,127 below Texas and $710 below the national average. Vermont ($2,514) and Wisconsin ($2,597) round out the bottom three."
      - "The bottom of the list skews toward New England and the Upper Midwest, Maine, Vermont, Wisconsin, Minnesota, and Rhode Island all appear in the bottom six. Every one of these states levies its own state income tax, which withholds a separate share of pay throughout the year and can reduce the size of the federal over-withholding that drives bigger refunds."

  - id: "average-refund-vs-state-income-tax"
    icon: "fa-solid fa-scale-balanced"
    title: "Average Tax Refund and State Income Tax Status"
    paragraphs:
      - "Texas, Florida, Nevada, and Wyoming, four of the nine states with no broad state income tax, all rank in the top seven for average federal refund. Washington and Alaska, two more no-income-tax states, land in the top 20 at $3,056 and $3,042. Tennessee, South Dakota, and New Hampshire, the remaining no-income-tax states, fall closer to the middle and lower half of the list, so the pattern is a lean rather than a rule."
      - "New Jersey ($3,161) and New York ($3,100) show that high-tax, high-income-tax states can still post above-average refunds, largely a function of income levels and withholding patterns rather than any single tax rule. A bigger refund reflects money withheld and not owed during the year, not extra income from the IRS."

