page:
  h1: "Average Tax Refund by State"

  quick_answer:
    - "Texas has the biggest average federal tax refund of any state at $3,590, followed by Louisiana ($3,413), Mississippi ($3,399), Florida ($3,376), and Wyoming ($3,320)."
    - "Maine has the smallest average refund at $2,463. Vermont ($2,514), Wisconsin ($2,597), Oregon ($2,611), and Minnesota ($2,673) round out the bottom five."
    - "The nationwide average individual income tax refund was $3,173 in fiscal year 2025, according to the IRS. Four of the five states with the biggest average refunds, Texas, Florida, Wyoming, and Nevada, collect no state income tax."

  methodology: "Average refund amounts divide the total dollar amount of individual income tax refunds issued in each state by the number of individual income tax refunds issued in that state, using IRS Statistics of Income Data Book Tables 1-7 and 1-8 for fiscal year 2025 (October 2024 through September 2025). Figures are classified by the filer's address of record and reflect the same divide-total-by-count method the IRS uses to calculate its published national average."

  sources:
    - name: "IRS SOI Tax Stats — Number of Refunds Issued, by State (Data Book Table 1-7), FY 2025"
      url: "https://www.irs.gov/statistics/soi-tax-stats-number-of-refunds-issued-by-state-and-fiscal-year-irs-data-book-table-7"
      description: "Count of individual income tax refunds issued by state"
