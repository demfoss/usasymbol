faq:
  - question: "Which state has the biggest average tax refund?"
    answer: "Texas has the biggest average federal tax refund at $3,590, based on IRS fiscal year 2025 data. Louisiana ($3,413) and Mississippi ($3,399) rank second and third."

  - question: "Which state has the smallest average tax refund?"
    answer: "Maine has the smallest average federal tax refund at $2,463. Vermont ($2,514) and Wisconsin ($2,597) rank second- and third-smallest."

  - question: "What is the average tax refund in the United States?"
    answer: "The nationwide average individual income tax refund was $3,173 in fiscal year 2025, according to the IRS Statistics of Income Data Book."

  - question: "Why do average tax refunds vary so much by state?"
    answer: "Refund size mainly reflects how much was withheld from paychecks during the year compared with the tax actually owed, which is shaped by income levels, the mix of wage versus self-employment income, and whether a state has its own income tax. States without a state income tax, like Texas, Florida, Wyoming, and Nevada, cluster toward the top of the list, though the pattern isn't universal."

  - question: "Does a bigger tax refund mean a state has higher incomes?"
    answer: "Not directly. A refund is money the filer already overpaid during the year and is simply getting back, not a bonus tied to income level. Louisiana and Mississippi, both lower-income states, rank second and third for average refund size, while several higher-income states fall in the middle of the list."

  - question: "Where does this average tax refund data come from?"
    answer: "The IRS Statistics of Income Data Book publishes the total dollar amount and total number of individual income tax refunds issued by state each fiscal year. Dividing the total amount by the total count for each state produces the average refund figures shown here, for fiscal year 2025 (October 2024 through September 2025)."

