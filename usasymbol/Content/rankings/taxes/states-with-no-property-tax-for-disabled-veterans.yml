seo:
  title: "Property Tax Exemptions for Disabled Veterans | All 50 States"
  description: "Which US states offer property tax exemptions for disabled veterans in 2026. Covers full and partial exemptions, 100% disabled veteran rules, surviving spouse eligibility, and how to apply."

page:
  h1: "States With No Property Tax for Disabled Veterans"

  quick_answer:
    - "More than 20 states offer a full property tax exemption for 100% permanently and totally disabled veterans on a qualifying primary residence, while most states provide only partial relief, a capped reduction, or a credit. Texas, Virginia, Florida, Pennsylvania, and South Carolina are among the states where a veteran rated 100% service-connected P&T disabled may pay zero property tax on a homestead, but the eligibility conditions, residency requirements, and application rules differ in every state."
    - "The phrase 'states with no property tax for disabled veterans' refers to states where qualifying disabled veterans owe nothing on a principal residence, not to states that have abolished property tax entirely. In states such as Texas and Virginia, a 100% permanently and totally disabled veteran with a service-connected rating pays no ad valorem property tax on a residence homestead, while a non-qualifying neighbor in the same county pays the full local rate."

  methodology: "Exemption types listed below reflect each state's primary statewide program for disabled veterans as of early 2026, based on official state revenue departments, tax commissions, and state veterans affairs offices. 'Full' means a qualifying 100% disabled veteran owes zero property tax on a principal residence under that program. 'Partial' means a capped dollar reduction, assessed-value exclusion, percentage reduction, or tax credit applies. 'Local Option' means no uniform statewide mandate exists and benefits vary by county or municipality. States marked 'NEEDS VERIFICATION' had unclear or conflicting official information at publication; readers should confirm current rules with their county assessor or state veterans affairs office. This table is a reference guide, not legal or tax advice."

  sources:
    - name: "Texas Comptroller – Disabled Veteran Homestead Exemption"
      url: "https://comptroller.texas.gov/taxes/property-tax/exemptions/disabledvet.php"
      description: "Official Texas guidance on the full property tax exemption for 100% disabled veterans on a residence homestead, including surviving spouse portability rules"
    - name: "Virginia Department of Taxation – Disabled Veterans Exemption"
      url: "https://www.tax.virginia.gov/disabled-veterans-exemption"
      description: "Official Virginia guidance on the full property tax exemption for 100% permanently and totally disabled veterans and surviving spouse continuation"
    - name: "Florida Department of Revenue – Property Tax Exemptions"
      url: "https://floridarevenue.com/property/Pages/Taxpayers_Exemptions.aspx"
      description: "Official Florida guidance including the full exemption for 100% service-connected permanently and totally disabled veterans and the combat disability exemption"
    - name: "Pennsylvania DMVA – Real Estate Tax Exemption"
      url: "https://www.dmva.pa.gov/veterans/BenefitsandAssistance/Pages/Real-Estate-Tax-Exemption.aspx"
      description: "Official Pennsylvania program page for full property tax exemption for 100% disabled veterans, administered through county directors of veterans affairs"
    - name: "U.S. Department of Veterans Affairs – State Property Tax Exemptions"
      url: "https://www.benefits.va.gov/homeloans/realestate.asp"
      description: "VA general overview of state property tax exemption programs available to veterans and their surviving spouses"

