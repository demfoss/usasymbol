faq:
  - question: "Which states have no property tax for disabled veterans?"
    answer: "As of 2026, states that appear to offer full property tax exemptions for qualifying 100% permanently and totally disabled veterans include Alabama, Arkansas, Florida, Georgia, Kansas, Louisiana, Maryland, Michigan, Mississippi, New Hampshire, New Jersey, New Mexico, North Dakota, Oklahoma, Oregon, Pennsylvania, South Carolina, Tennessee, Texas, Virginia, and West Virginia. In all cases the exemption applies only to a primary residence, requires a service-connected disability rating, and must be applied for through a local office. It is never automatic."

  - question: "Do 100% disabled veterans pay property tax?"
    answer: "In roughly 20 states, a 100% permanently and totally disabled veteran with a service-connected rating may pay zero property tax on a qualifying primary residence. In the remaining states, veterans still owe some property tax, though partial exemptions, assessed-value exclusions, or credits typically reduce the bill. The exact outcome depends on the state, the county, the home's assessed value, and whether the veteran filed a formal exemption application on time."

  - question: "Do all states offer disabled veteran property tax exemptions?"
    answer: "Nearly all states offer some form of property tax benefit for disabled veterans, but the benefits vary enormously in size and structure. Missouri's statewide disabled veteran property tax program is unconfirmed at this publication date. Rhode Island delegates all decisions to individual municipalities. Nevada and Wyoming offer reductions so small they amount to modest savings on most homes. No state has a fully uniform program comparable to the comprehensive full exemptions found in Texas, Virginia, or Florida."

  - question: "Can surviving spouses get a disabled veteran property tax exemption?"
    answer: "In many states, yes. Most states that offer full or partial exemptions for disabled veterans also allow an unremarried surviving spouse to continue the exemption on the same property after the veteran's death. A smaller number of states, including Texas and Virginia, allow the surviving spouse to carry the exemption to a new, different property. Specific rules around remarriage, property transfer, and residency requirements vary by state and should be confirmed with the local assessor."

  - question: "Are veteran property tax exemptions automatic?"
    answer: "No. In every state, the veteran must actively apply for the exemption. The VA disability rating alone does not trigger any local tax adjustment. The veteran must submit an application with supporting documentation, typically a VA disability rating letter and a DD-214, to the county assessor or equivalent local office by an annual deadline. Missing the deadline can mean losing the benefit for the entire tax year."

  - question: "Do veteran property tax exemptions apply to second homes?"
    answer: "No. All state property tax exemption programs for disabled veterans are restricted to the veteran's primary residence or homestead. A vacation home, rental property, or secondary dwelling is not covered, even if the veteran qualifies for a full exemption on their principal home."

  - question: "What documents do disabled veterans need for a property tax exemption?"
    answer: "Most states require a current VA disability rating letter confirming the service-connected disability percentage, and a DD-214 to verify honorable discharge and qualifying service. Some states additionally require proof of primary residence, such as a utility bill, voter registration, or state-issued ID, along with proof of property ownership. Veterans should contact their county assessor's office directly to confirm current documentation requirements and the applicable filing deadline."

