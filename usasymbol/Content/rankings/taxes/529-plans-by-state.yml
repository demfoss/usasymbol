sections:
  - id: "states-with-a-529-tax-deduction"
    icon: "fa-solid fa-circle-check"
    title: "States With a 529 Tax Deduction"
    paragraphs:
      - "40 states and the District of Columbia offer a state income tax deduction for contributions to their 529 plan, including Alabama's CollegeCounts 529 Plan, New York's 529 College Savings Program, and Utah's my529 Educational Savings Plan."
      - "Pennsylvania is the only state on the list that pairs its 529 program with an ABLE account under one name, PA 529 and PA ABLE. Nebraska's plan carries the longest name on record, the Nebraska Education Savings Trust - Direct College Savings Plan."

  - id: "states-with-no-529-tax-deduction"
    icon: "fa-solid fa-circle-xmark"
    title: "States With No 529 Tax Deduction"
    paragraphs:
      - "Ten states offer no state income tax deduction for 529 contributions: California, Florida, Nevada, New Hampshire, North Carolina, South Dakota, Tennessee, Texas, Washington, and Wyoming."
      - "Each of these ten still runs a named 529 program apart from Wyoming, including California's ScholarShare College Savings Plan, Texas's Texas College Savings Plan, and Washington's DreamAhead College Investment Plan."

  - id: "state-with-no-529-savings-plan"
    icon: "fa-solid fa-ban"
    title: "State With No 529 Savings Plan"
    paragraphs:
      - "Wyoming is the only state on this list with no state-sponsored 529 plan of its own, and it also offers no state tax deduction. Every other state and the District of Columbia, all 50 of them, has a named 529 program on record."

