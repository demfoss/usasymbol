  quick_answer:
    - "40 states and the District of Columbia offer a state income tax deduction for 529 plan contributions, while ten states offer no deduction at all."
    - "Wyoming is the only state on this list with no state-sponsored 529 plan of its own. Every other state and D.C. has a named 529 program, even the ten that offer no tax deduction, such as California's ScholarShare College Savings Plan."
    - "The ten states with no 529 tax deduction are California, Florida, Nevada, New Hampshire, North Carolina, South Dakota, Tennessee, Texas, Washington, and Wyoming."

  methodology: "Tax deduction status and 529 plan names reflect each state's college savings program on record for 2026."

