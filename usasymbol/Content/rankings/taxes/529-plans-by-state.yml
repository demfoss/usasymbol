faq:
  - question: "Which states offer a 529 tax deduction?"
    answer: "40 states and the District of Columbia offer a state income tax deduction for 529 plan contributions, including Alabama, New York, and Utah."

  - question: "Which states have no 529 tax deduction?"
    answer: "Ten states offer no 529 tax deduction: California, Florida, Nevada, New Hampshire, North Carolina, South Dakota, Tennessee, Texas, Washington, and Wyoming."

  - question: "Does California offer a 529 tax deduction?"
    answer: "No. California runs the ScholarShare College Savings Plan but offers no state income tax deduction for contributions to it."

  - question: "What is the 529 plan called in Texas?"
    answer: "Texas College Savings Plan. Texas offers no state income tax deduction for contributions."

  - question: "Which state has no 529 savings plan?"
    answer: "Wyoming is the only state with no state-sponsored 529 plan on record."

  - question: "What is the 529 plan called in New York?"
    answer: "New York's 529 College Savings Program. New York is one of the 40 states that offers a state tax deduction for contributions."

