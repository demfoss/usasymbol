faq:
  - question: "Which states have vehicle property tax?"
    answer: "Twenty-one states tax cars every year, among them Virginia, Missouri, Connecticut, North Carolina, Kansas, and Mississippi. Georgia, Iowa, and Minnesota use special value-based taxes instead."

  - question: "Does Texas have a car property tax?"
    answer: "No. Texas drivers pay sales tax when they buy a car and a registration fee each year, but no tax based on the car's value."

  - question: "Does Georgia have a car tax?"
    answer: "Georgia charges a one-time Title Ad Valorem Tax when a car is titled. That tax replaced the annual one in 2013, which many Georgians called the birthday tax because it came due on the owner's birthday."

  - question: "Does Tennessee have a vehicle property tax?"
    answer: "Not a value-based one. Many Tennessee counties add a flat wheel tax at registration, so the cost depends on where the car is registered."

  - question: "Does Montana have a vehicle property tax?"
    answer: "Yes. Montana charges an annual tax on a scale tied to the vehicle's age, so older cars cost less. With no general sales tax, Montana has also drawn out-of-state owners who register expensive RVs and sports cars through Montana companies."

  - question: "Does New Hampshire tax cars every year?"
    answer: "Yes. New Hampshire is one of the [states with no income tax](/rankings/taxes/states-with-no-income-tax) and has no general sales tax, yet towns collect a yearly charge on each car based on its list price and age."

  - question: "Is car property tax deductible?"
    answer: "Often, yes. A tax based on the car's value and charged every year can count as a personal property tax deduction on a federal return for people who itemize. Flat registration fees and weight-based fees do not qualify."

