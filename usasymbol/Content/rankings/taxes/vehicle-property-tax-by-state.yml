  caption: "States with annual vehicle property tax cluster along the South Atlantic coast, in New England, and across parts of the Midwest and Plains, reflecting historical personal property tax traditions that predate the automobile. Green states collect vehicle revenue through registration fees, title taxes, or sales tax at purchase but do not separately assess cars as personal property each year. No vehicle property tax does not mean no vehicle costs — registration fees, title fees, sales tax, and local charges apply in every state."
