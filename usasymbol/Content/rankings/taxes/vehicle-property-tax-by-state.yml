      url: "https://www.dmv.virginia.gov/vehicles/#pp_tax.asp"
      description: "Virginia Department of Motor Vehicles explanation of local vehicle personal property tax requirements and how the tax interacts with registration renewal"
    - name: "Missouri Department of Revenue – Personal Property"
      url: "https://dor.mo.gov/personal-property/"
      description: "Missouri DOR guidance on the annual personal property tax declaration process, including vehicles, watercraft, and aircraft"
    - name: "Connecticut Department of Revenue Services – Motor Vehicles"
      url: "https://portal.ct.gov/DRS/Individuals/Individual-Tax-Page/Property-Tax/Motor-Vehicle-Assessment"
      description: "Connecticut DRS explanation of how municipalities assess motor vehicles at 70 percent of fair market value for annual property tax purposes"
    - name: "Georgia DOR – Title Ad Valorem Tax"
      url: "https://motor.georgia.gov/title-ad-valorem-tax-calculator"
      description: "Georgia Department of Revenue TAVT calculator and explanation of the one-time title tax that replaced Georgia's annual vehicle property tax in 2013"
    - name: "North Carolina DMV – Vehicle Property Tax"
      url: "https://www.ncdot.gov/dmv/title-registration/Pages/vehicle-property-tax.aspx"
