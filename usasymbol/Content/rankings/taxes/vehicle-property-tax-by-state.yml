seo:
  title: "Vehicle Property Tax by State: Which States Tax Cars Annually? (2026)"
  description: "Find out which states charge vehicle property tax on cars, which states do not, and how annual car property taxes differ from registration fees, title taxes, and sales tax. Complete 50-state table and map."

page:
  h1: "Vehicle Property Tax by State: Which States Tax Cars?"

  quick_answer:
    - "Twenty-one states levy an annual vehicle property tax on privately owned cars, treating them as taxable personal property subject to value-based reassessment each year; the other 29 states collect vehicle revenue through registration fees, title taxes, or sales tax at purchase without a separate recurring property assessment. Virginia is among the most prominent examples, billing residents each year on the assessed value of every registered vehicle through locally set rates that vary by county and independent city."
    - "Georgia abolished its annual vehicle property tax in 2013 and replaced it with a one-time Title Ad Valorem Tax (TAVT) paid at the time of title transfer — classifying it here as 'Special' because the tax is real but not annual. Ohio eliminated vehicle personal property tax entirely in 2005. Missouri applies a county-level personal property tax on vehicles that residents pay every January, based on the value assessed the prior year — a system so routine that Missouri drivers often describe it simply as 'the car tax.'"

  methodology: "Status categories reflect each state's general framework as of 2026. 'Yes' means a state or local government levies an annual value-based or assessment-based tax on privately owned vehicles as personal property. 'No' means no such separate annual tax exists at the state or prevalent local level, though registration fees, title fees, sales tax, or other vehicle charges may still apply. 'Local' means the tax exists in some but not all jurisdictions within the state and a single statewide answer would be misleading. 'Special' means a different vehicle-specific tax structure — such as Georgia's one-time TAVT, Iowa's annual value-depreciation-based registration excise, or Minnesota's annual registration tax — that functions similarly to a property tax but is administered as something else. Specific rates, county rules, and exemptions vary widely; consult your state's Department of Motor Vehicles or Department of Revenue for current figures before making financial decisions."

  sources:
    - name: "Tax Foundation – Personal Property Tax Primer"
      url: "https://taxfoundation.org/taxedu/educational-resources/primer-personal-property-taxes/"
      description: "Overview of personal property tax structures across U.S. states, including which states tax vehicles as personal property and how rates are set"
