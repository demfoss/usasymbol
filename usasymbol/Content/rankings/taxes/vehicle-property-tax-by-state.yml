sections:
  - id: "states-with-vehicle-property-tax"
    icon: "fa-solid fa-receipt"
    title: "States With Vehicle Property Tax"
    paragraphs:
      - "Twenty-one states tax cars every year as personal property, and most sit in the South, New England, and the Plains. Counties, cities, or towns usually set the rate, so two neighbors on either side of a county line can owe different bills for the same car. Louisiana collects through its parishes, the state's version of counties."
      - "Missouri asks owners to list every vehicle they hold on January 1, and the county mails a bill due by the end of the year. Drivers there cannot renew their plates without a paid tax receipt. Connecticut goes further and puts cars on the same municipal grand list as houses, assessed at 70 percent of market value."
      - "Massachusetts and Maine call their version an excise. Both base it on the original sticker price and the model year, not on what the owner paid, so a buyer who landed a bargain still owes tax on the full list price."

  - id: "why-virginia-taxes-cars-every-year"
    icon: "fa-solid fa-landmark"
    title: "Why Virginia Still Taxes Cars Every Year"
    paragraphs:
      - "Virginia keeps its annual car tax because counties and independent cities depend on it for schools, police, and roads. Local governments there cannot levy their own income tax, so [property tax](/rankings/taxes/states-by-property-tax) on homes and cars carries most local budgets. Owners get the car bill from their locality, separate from the DMV renewal."
      - "Jim Gilmore won the 1997 governor's race on the promise 'No Car Tax.' A 1998 law had the state pay back localities for much of each bill, but the cost grew faster than planned, and lawmakers froze the state's share in 2004. Virginians still pay the tax today, with partial relief that covers less of the bill as car values climb."

  - id: "states-with-no-vehicle-property-tax"
    icon: "fa-solid fa-circle-check"
    title: "States With No Vehicle Property Tax"
    paragraphs:
      - "Twenty-four states, including Texas, Florida, New York, and Illinois, have no annual vehicle property tax. Car owners there pay sales tax once at purchase, then registration and title fees each cycle. That one-time bill at the dealer follows [sales tax by state](/rankings/taxes/sales-tax-by-state), so a pricey car can still cost plenty in a state with no yearly car tax."
      - "Ohio eliminated its vehicle property tax in 2005. Washington abolished its value-based motor vehicle excise in 2000, a year after voters approved an initiative to cut car tab costs. California never adopted a yearly property tax on cars, but its Vehicle License Fee rises with a car's value, so a new car still costs more to renew."

  - id: "car-property-tax-and-registration-renewal"
    icon: "fa-solid fa-right-left"
    title: "Car Property Tax and Registration Renewal"
    paragraphs:
      - "North Carolina mails one notice that covers both the county property tax and the state registration fee, a system called Tag and Tax Together that began in 2013. Owners once renewed their plates first and got the county tax bill months later. Kentucky and Alabama also collect the county tax at renewal time."
      - "Registration fees and property taxes still go to different treasuries. A flat fee keeps a car legal on the road and funds the state motor vehicle agency, while the value-based tax pays for county services. Older cars owe less tax each year as they lose value, yet a flat fee stays the same."

