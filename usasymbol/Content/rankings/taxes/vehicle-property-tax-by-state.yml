page:
  h1: "Vehicle Property Tax by State"

  quick_answer:
    - "Vehicle property tax by state is charged every year in 21 states, from Virginia and Missouri to Connecticut, where a car is taxed much like a house."
    - "Twenty-four states have no annual vehicle property tax, including Texas, Florida, and California. Drivers there still pay registration and title fees, and California folds a value-based license fee into each renewal."
    - "Georgia is the odd case. Lawmakers dropped its yearly car tax in 2013 for a one-time title tax, so Georgia drivers pay the whole bill when a car changes hands."

  methodology: "Vehicle tax rules published by state revenue and motor vehicle agencies, as of 2026. Status shows whether a state or its localities charge an annual value-based tax on cars. Rates and exemptions vary by locality."

