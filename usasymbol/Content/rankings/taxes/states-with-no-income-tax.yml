page:
  h1: "States With No Income Tax"

  quick_answer:
    - "Nine states charge no state income tax: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming."
    - "New Hampshire is the most recent state to reach zero income tax, fully repealing its tax on interest and dividends on January 1, 2025."
    - "Washington has no tax on wages, but it taxes capital gains above roughly $270,000 at 7% to 9.9%, and a new 9.9% tax on income over $1 million takes effect in 2028."

  methodology: "This page tracks whether each state levies a broad state income tax on wages and salaries, based on a 50-state legal-status review current as of 2026. A state is marked No if it does not tax wages, even if it taxes a narrower category of income such as capital gains."

  sources:
    - name: "New Hampshire Department of Revenue Administration. Repeal of NH Interest and Dividends Tax Now in Effect"
      url: "https://www.revenue.nh.gov/news-and-media/repeal-nh-interest-and-dividends-tax-now-effect"
      description: "Confirms New Hampshire's Interest and Dividends Tax ended for tax periods beginning January 1, 2025"
    - name: "Tennessee Department of Revenue. Hall Income Tax (Repealed for Tax Years Beginning January 1, 2021)"
      url: "https://revenue.support.tn.gov/hc/en-us/sections/200489699-Hall-Income-Tax-Repealed-for-Tax-Years-Beginning-January-1-2021"
      description: "Confirms the phase-out schedule and full repeal of Tennessee's Hall Tax on interest and dividends"
    - name: "Ballotpedia. Texas Proposition 4, Prohibit State Income Tax on Individuals Amendment (2019)"
      url: "https://ballotpedia.org/Texas_Proposition_4,_Prohibit_State_Income_Tax_on_Individuals_Amendment_(2019)"
      description: "Confirms Texas voters approved a constitutional ban on a state income tax without voter approval, 74.4% to 25.6%"
    - name: "Office of Governor Bob Ferguson. Governor Ferguson Signs Millionaires' Tax Into Law"
      url: "https://governor.wa.gov/news/2026/governor-ferguson-signs-millionaires-tax-law"
      description: "Confirms Washington's 9.9% tax on income over $1 million, signed March 30, 2026, effective January 1, 2028"

