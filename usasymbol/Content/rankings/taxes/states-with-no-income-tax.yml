faq:
  - question: "Which states have no income tax?"
    answer: "Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming make up the full list of nine, unchanged since New Hampshire joined the group in 2025."

  - question: "Does Washington have an income tax?"
    answer: "Washington has no tax on wages, but it taxes capital gains above roughly $270,000 at 7% to 9.9%. A new 9.9% tax on income over $1 million takes effect January 1, 2028."

  - question: "Does New Hampshire have an income tax?"
    answer: "No. New Hampshire fully repealed its tax on interest and dividends on January 1, 2025, becoming the ninth state with no income tax."

  - question: "Does Texas have an income tax?"
    answer: "No. Texas voters approved a constitutional amendment in 2019, 74.4% to 25.6%, requiring another vote before the state could create one."

  - question: "Is Tennessee a no-income-tax state?"
    answer: "Yes. Tennessee finished phasing out its Hall Tax on interest and dividends on January 1, 2021."

  - question: "How many states have no income tax?"
    answer: "Nine states have no state income tax on wages."

