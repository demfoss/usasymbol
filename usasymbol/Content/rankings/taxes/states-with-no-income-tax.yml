sections:
  - id: "states-with-no-income-tax"
    icon: "fa-solid fa-money-bill-wave"
    title: "States With No Income Tax"
    paragraphs:
      - "Nine states charge no state income tax on wages: Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, and Wyoming."
      - "Texas is the only one of the nine with a constitutional barrier against adding one. Voters approved Proposition 4 in 2019, 74.4% to 25.6%, requiring another constitutional amendment before the legislature could create a state income tax."

  - id: "recent-changes-to-no-income-tax-states"
    icon: "fa-solid fa-clock-rotate-left"
    title: "Recent Changes to No-Income-Tax States"
    paragraphs:
      - "New Hampshire is the newest of the nine, fully repealing its tax on interest and dividends on January 1, 2025. Tennessee reached the same point earlier, finishing its phase-out of the Hall Tax on interest and dividends on January 1, 2021."
      - "Washington still has no tax on wages, but it has taxed capital gains above roughly $270,000 since 2022, at 7% to 9.9%. Governor Bob Ferguson signed a further 9.9% tax on income over $1 million on March 30, 2026, set to take effect January 1, 2028."

