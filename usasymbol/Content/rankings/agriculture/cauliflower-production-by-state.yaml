page:
  h1: Cauliflower Production by State
  quick_answer:
  - California produced 7,359,500 CWT of cauliflower in 2024, 86.33% of the US total and the most of any
    state by far.
  - Arizona is the only other state with reportable cauliflower production, at 1,165,500 CWT, 13.67% of
    the US total.
  - Together California and Arizona account for the entire national cauliflower crop of 8,525,000 CWT.
  methodology: Production figures are 2024 data on record with USDA NASS, measured in CWT (hundredweight,
    100 pounds). Only California and Arizona have reportable commercial cauliflower acreage.
  sources:
  - name: USDA NASS. Vegetables 2024 Summary
