faq:
  - question: "Which state produces the most millet?"
    answer: "Colorado produces the most millet in the country at 9,800,000 bushels, 68.82% of the U.S. total."

  - question: "Which state produces the least millet?"
    answer: "South Dakota reports the smallest total among producing states at 924,000 bushels."

  - question: "How much millet does Nebraska produce?"
    answer: "Nebraska produces 3,515,000 bushels of millet, ranking second behind Colorado."

  - question: "How many states produce millet commercially?"
    answer: "Only three states report commercial millet production: Colorado, Nebraska, and South Dakota."

  - question: "What is the total U.S. millet production?"
    answer: "The three producing states combined for 14,239,000 bushels of millet."

