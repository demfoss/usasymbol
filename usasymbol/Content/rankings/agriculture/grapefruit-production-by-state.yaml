faq:
  - question: "Which state produces the most grapefruit?"
    answer: "California produces the most grapefruit at 172,000 tons a year."

  - question: "Which state ranks second in grapefruit production?"
    answer: "Texas ranks second at 88,000 tons, ahead of Florida's 51,000 tons."

  - question: "How much grapefruit does Florida produce?"
    answer: "Florida produces 51,000 tons of grapefruit a year, the smallest total among the three producing states."

  - question: "How many states produce grapefruit commercially?"
    answer: "Three states report commercial grapefruit production to USDA: California, Texas, and Florida, totaling 311,000 tons a year."

