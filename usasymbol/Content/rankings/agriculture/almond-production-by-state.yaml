faq:
- question: Which state produces the most almonds?
  answer: California produces virtually all US almonds, with 2.644 billion pounds of utilized production
    in 2025. No other state has tracked commercial almond acreage or production.
- question: Do any other states grow almonds commercially?
  answer: No other state appears in the national almond production data. Some states grow token amounts,
    but USDA does not track them as statistically significant, so California's bearing acreage, production,
    and value figures are identical to the US totals in every year on record.
- question: How many acres of almonds does California have?
  answer: California had 1,400,000 bearing acres of almonds in 2025, up from 1,390,000 in 2024 and 1,380,000
    in 2023.
- question: How much is California's almond crop worth?
  answer: California's 2025 almond crop was valued at $6.874 billion, up 11% from $6.175 billion in 2024.
- question: What percentage of the world's almonds come from California?
  answer: California grows about 80% of the world's almonds and 100% of the US commercial supply.
- question: Why does California grow almost all of the country's almonds?
  answer: California's Central Valley has one of the few Mediterranean climates suited to almonds, with
    about 280 days of sunshine a year and the 250 to 350 winter chill hours the trees need to break dormancy.
