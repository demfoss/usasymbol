- id: california-almond-crop-value-and-exports
  icon: fa-solid fa-money-bill-trend-up
  title: California Almond Crop Value and Exports
  paragraphs:
  - California's 2025 almond crop was worth $6.874 billion, up from $6.175 billion in 2024 and $4.045
    billion in 2023. The average price per pound climbed alongside it, from $1.72 in 2023 to $2.34 in
    2024 and $2.60 in 2025.
  - Almonds were California's top valued agricultural export in 2024 at $4.95 billion, up 13.5% from the
    prior year.
  table:
