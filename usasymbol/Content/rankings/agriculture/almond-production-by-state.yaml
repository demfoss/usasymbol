page:
  h1: Almond Production by State
  quick_answer:
  - California produced 2.644 billion pounds of almonds in 2025, the entire figure counted as the US total.
  - No other state appears in the national almond production data. California's 1,400,000 bearing acres
    and 2.644 billion pounds match the US totals exactly.
  - The 2025 crop was worth $6.874 billion, up from $6.175 billion in 2024 and $4.045 billion in 2023,
    as the average price climbed to $2.60 per pound.
  methodology: Bearing acreage, yield, production, price, and value figures are from USDA NASS's Noncitrus
    Fruits and Nuts 2025 Summary (May 2026), the only state-level source for almonds. California is the
    sole state listed; its figures equal the US totals for every year on record.
  sources:
  - name: USDA NASS. Noncitrus Fruits and Nuts 2025 Summary
    url: https://esmis.nal.usda.gov/sites/default/release-files/795891/ncit0526.pdf
    description: Bearing acreage, yield, in-shell and shelled production, price, and value of utilized
      almond production for California, 2023-2025; California is the only state listed
  - name: USDA NASS. Quick Stats
    url: https://quickstats.nass.usda.gov/
    description: USDA's statistical database confirming California is the only state with tracked commercial
      almond production; other states' output is not statistically significant
  - name: Almond Board of California. California Advantage
    url: https://www.almonds.org/why-almonds/ca-advantage
    description: California accounts for 100% of the US commercial almond supply and about 80% of world
      production
  - name: Almond Board of California. California's Mediterranean Climate
    url: https://www.almonds.org/why-almonds/almond-living-magazine/californias-mediterranean-climate
    description: Central Valley climate and winter chill-hour requirements that make California suited
      to growing almonds
  - name: California Department of Food and Agriculture. 2024-2025 California Agricultural Exports
    url: https://www.cdfa.ca.gov/Statistics/PDFs/2024-2025_california_agricultural_exports.pdf
    description: Almonds as California's top valued agricultural export commodity, $4.95 billion in 2024
