sections:
- id: why-california-grows-nearly-all-us-almonds
  icon: fa-solid fa-sun
  title: Why California Grows Nearly All US Almonds
  paragraphs:
  - California's Central Valley holds one of the few Mediterranean climates suited to almond trees, with
    about 280 days of sunshine a year and under an inch of rain from May through September. Winters supply
    the 250 to 350 chill hours almonds need to break dormancy before warm spring weather carries the trees
    through bloom.
  - That climate has made California responsible for 100% of the country's commercial almond supply and
    about 80% of world production. Other states grow token amounts, but USDA does not track them as statistically
    significant, so no other state appears in the national data.
- id: california-almond-production-by-year
  icon: fa-solid fa-chart-line
  title: California Almond Production by Year
  paragraphs:
  - California's utilized almond production reached 2.644 billion pounds in 2025, up from 2.639 billion
    pounds in 2024 and well above 2.352 billion pounds in 2023. Bearing acreage grew each year too, from
    1,380,000 acres in 2023 to 1,400,000 acres in 2025.
  table:
    columns:
      year: Year
      utilized_production: Utilized Production (billion lbs)
      bearing_acres: Bearing Acres
    rows:
    - year: '2023'
      utilized_production: '2.352'
      bearing_acres: 1,380,000
    - year: '2024'
