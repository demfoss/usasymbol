sections:
- id: why-maine-catches-the-most-lobster
  icon: fa-solid fa-fish
  title: Why Maine Catches the Most Lobster
  paragraphs:
  - Maine lands 110,230,440 pounds of lobster worth $739.96 million, more than six times Massachusetts's 16,826,704 pounds. Both states catch American lobster, the species tied to the cold Gulf of Maine waters that support the bulk of the US fishery.
  - Florida's 4,702,267 pounds comes from Caribbean spiny lobster, a different species than the American lobster caught along the Northeast coast. California's 668,882 pounds of California spiny lobster carries the highest dockside value per pound in the table at roughly $22.63.
faq:
- question: Which state catches the most lobster?
  answer: Maine catches the most lobster at 110,230,440 pounds, worth $739.96 million.
- question: Which state catches the least lobster?
  answer: South Carolina catches the least at 248 pounds, worth $2,283.
- question: How much lobster does Massachusetts catch?
  answer: Massachusetts catches 16,826,704 pounds of lobster, worth $125.46 million, the second-highest total of any state.
- question: Why does Maine catch so much more lobster than other states?
  answer: Maine's 110,230,440 pounds comes from the cold Gulf of Maine waters that support most of the American lobster fishery, more than six times Massachusetts's 16,826,704 pounds.
- question: Do all states catch the same species of lobster?
  answer: No. Most Northeast states catch American lobster, Florida, North Carolina, and South Carolina catch Caribbean spiny lobster, and California catches California spiny lobster.
- question: How much is Maine's lobster catch worth?
  answer: Maine's 110,230,440-pound lobster catch is worth $739.96 million, the highest total value of any state.
