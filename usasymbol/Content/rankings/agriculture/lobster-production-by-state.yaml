page:
  h1: Lobster Production by State
  quick_answer:
  - Maine lands the most lobster of any state at 110,230,440 pounds, worth $739.96 million, more than six times Massachusetts's total.
  - Massachusetts ranks second at 16,826,704 pounds, and New Hampshire ranks third at 5,708,942 pounds.
  - South Carolina lands the least at 248 pounds, worth just $2,283, the smallest catch in the table.
  methodology: Figures are annual commercial lobster landings by state in pounds, metric tons, and dockside value, from NOAA Fisheries catch data. States catch either American lobster or a regional spiny lobster species.
