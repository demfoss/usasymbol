faq:
- question: Which state produces the most watermelons?
  answer: Florida produces the most watermelons at 9,096,100 CWT a year, about 25% of the 10-state total.
- question: Which state produces the least watermelons?
  answer: Delaware produces the least among the tracked states at 796,500 CWT, below Maryland's 1,029,500 CWT.
- question: Which state ranks second in watermelon production?
  answer: Georgia ranks second at 6,650,000 CWT, ahead of California's 5,440,000 CWT.
- question: How many states are tracked for watermelon production?
  answer: USDA NASS tracks 10 states for commercial watermelon production, totaling 36,907,100 CWT a year.
- question: How many watermelons does Texas produce?
  answer: Texas produces 4,515,000 CWT of watermelons a year, ranking fourth among the 10 tracked states.
