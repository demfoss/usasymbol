page:
  h1: Watermelon Production by State
  quick_answer:
  - Florida produces the most watermelons at 9,096,100 CWT a year, about 25% of the 10-state total.
  - Georgia ranks second at 6,650,000 CWT, ahead of California's 5,440,000 CWT in third.
  - Delaware produces the least among the 10 tracked states at 796,500 CWT, below Maryland's 1,029,500 CWT.
  methodology: Production figures reflect 2024 USDA NASS vegetable data reported by World Population Review, measured in hundredweight (CWT). Ten states are tracked for commercial watermelon production.
