page:
  h1: Vineyards by State
  quick_answer:
  - California has 6,399 federally bonded wineries, more than four times as many as second-place Washington's 1,422.
  - Texas ranks third at 1,009 wineries, narrowly ahead of Oregon's 995, while New York rounds out the top five at 843.
  - Colorado has the fewest wineries among the states tracked here, 274, less than a twentieth of California's total.
  methodology: Winery counts are federally bonded winery permit holders as of April 2025, from the Alcohol and Tobacco Tax and Trade Bureau's List of Permittees. A bonded winery permit allows a business to produce or blend wine under federal bond; the count does not measure grape acreage or wine volume.
  sources:
  - name: Alcohol and Tobacco Tax and Trade Bureau. List of Permittees, April 2025
    url: https://www.ttb.gov/regulated-commodities/beverage-alcohol/wine/wine-statistics
