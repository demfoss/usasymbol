sections:
- id: why-california-has-so-many-wineries
  icon: fa-solid fa-wine-bottle
  title: Why California Has So Many Wineries
  paragraphs:
  - California's 6,399 bonded wineries outnumber the next four states, Washington (1,422), Texas (1,009), Oregon (995), and New York (843), combined. The total spans well-known regions like Napa and Sonoma alongside hundreds of smaller operations across the Central Coast and Central Valley.
  - Texas and Oregon are separated by only 14 wineries, 1,009 to 995, despite growing wine in very different climates. Texas wineries stretch from the Hill Country to the High Plains, while Oregon's cluster around the Willamette Valley.
