faq:
- question: Which state has the most wineries?
  answer: California has the most bonded wineries at 6,399, more than four times as many as second-place Washington.
- question: How many wineries does Washington have?
  answer: Washington has 1,422 bonded wineries, the second-most of any state.
- question: Which has more wineries, Texas or Oregon?
  answer: Texas has slightly more, 1,009 wineries to Oregon's 995, a gap of just 14.
- question: How many wineries are in New York?
  answer: New York has 843 bonded wineries, ranking fifth among the states tracked.
- question: Does every US state have a winery?
  answer: Yes. Every state has at least one bonded winery, though most states outside this table have fewer than 200.
