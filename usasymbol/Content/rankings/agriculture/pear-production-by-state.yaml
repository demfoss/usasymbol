faq:
  - question: "Which state produces the most pears?"
    answer: "Washington produces the most pears at 280,000 tons, 44.80% of the three-state total."

  - question: "How does Oregon's pear production compare to Washington's?"
    answer: "Oregon grows 210,000 tons of pears, 70,000 tons behind Washington's 280,000 tons."

  - question: "Which state has the smallest pear crop among top producers?"
    answer: "California has the smallest of the three tracked pear crops at 135,000 tons."

  - question: "How many states have significant commercial pear production?"
    answer: "Three states report measurable pear production: Washington, Oregon, and California, all on the Pacific Coast."

