page:
  h1: "Hog Inventory by State 2025"
  quick_answer:
    - "Iowa has the largest published hog inventory at 25,300,000 head, supported by abundant corn and soybean feed and a dense pork-processing network."
    - "Minnesota ranks second with 9,400,000 hogs and pigs, while North Carolina is third with 7,900,000."
    - "Kentucky has the smallest published state inventory at 470,000 head; smaller state totals are combined rather than reported separately."
  methodology: "USDA NASS Quarterly Hogs and Pigs reports inventory on December 1, 2025. Sixteen states are published separately; all remaining states are combined and excluded from the ranking."
