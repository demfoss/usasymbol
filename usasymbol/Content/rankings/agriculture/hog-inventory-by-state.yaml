faq:
  - question: "Which state has the most hogs?"
    answer: "Iowa has the largest published inventory, with 25,300,000 hogs and pigs on December 1, 2025."
  - question: "How many hogs are in Minnesota?"
    answer: "Minnesota had 9,400,000 hogs and pigs, the second-largest published state inventory."
  - question: "Does North Carolina or Illinois have more hogs?"
    answer: "North Carolina has more, with 7,900,000 head compared with Illinois at 5,450,000."
  - question: "Why does Iowa have so many pigs?"
    answer: "Iowa combines abundant corn and soybean feed with a long-established network of hog farms, finishing barns, processors, and transport links."
  - question: "What is the difference between hog inventory and hog production?"
    answer: "Inventory is the number of live hogs on farms on a specific date. Production measures output over a period, commonly in pounds."
  - question: "Which ranked state has the fewest hogs?"
    answer: "Kentucky has the smallest separately published state inventory at 470,000 head. Smaller state totals are grouped together rather than listed individually."

