sections:
  - id: "why-iowa-has-the-most-hogs"
    icon: "fa-solid fa-piggy-bank"
    title: "Why Iowa Has the Most Hogs"
    paragraphs:
      - "Iowa's 25,300,000 hogs and pigs reflect an unusually complete production chain. Corn and soybeans grown nearby become feed, while breeding farms, finishing barns, packing plants, and transport routes are concentrated in the same state."
      - "Kentucky's 470,000 head is the smallest separately published total. Its farm economy is better known for cattle, poultry, and horses, while the largest commercial hog systems cluster in the Corn Belt and North Carolina."

  - id: "states-with-the-largest-hog-inventories"
    icon: "fa-solid fa-chart-column"
    title: "Largest Hog Inventories by State"
    paragraphs:
      - "Minnesota's 9,400,000 head and North Carolina's 7,900,000 place them behind Iowa. North Carolina stands apart geographically: its large hog operations are concentrated in the eastern Coastal Plain rather than the Midwestern grain belt."
    table:
      columns:
        state: "State"
        hog_inventory: "Hogs and Pigs (head)"
      rows:
        - { state: "Iowa", hog_inventory: "25,300,000" }
        - { state: "Minnesota", hog_inventory: "9,400,000" }
        - { state: "North Carolina", hog_inventory: "7,900,000" }
        - { state: "Illinois", hog_inventory: "5,450,000" }
        - { state: "Indiana", hog_inventory: "4,450,000" }

  - id: "hog-inventory-versus-hog-production"
    icon: "fa-solid fa-scale-balanced"
    title: "Hog Inventory Versus Production"
    paragraphs:
      - "Inventory counts live hogs present on one date, so it is different from annual [hog production by state](/rankings/agriculture/hog-production-by-state), which measures pounds produced over a year. Iowa leads both measures, but the numbers answer different questions."

