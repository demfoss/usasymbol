faq:
  - question: "Which state produces the most chickens?"
    answer: "Georgia produces the most chickens at 1,317,300,000 head. Alabama is next at 1,183,600,000 head."

  - question: "Which state produces the fewest chickens?"
    answer: "Oklahoma has the lowest total of the 14 producing states at 181,300,000 head."

  - question: "How many chickens does Alabama produce?"
    answer: "Alabama produces 1,183,600,000 head, second in the country. Its chicken houses are concentrated in the northern part of the state, where Cullman and Marshall counties are major centers."

  - question: "Which state is known as the chicken capital of the world?"
    answer: "Georgia's Gainesville claims the title Poultry Capital of the World. Arkansas also has a strong claim as the birthplace of Tyson Foods, and ranks third at 1,052,700,000 head."

  - question: "Does Arkansas or North Carolina produce more chickens?"
    answer: "Arkansas produces more, with 1,052,700,000 head against North Carolina's 984,700,000. The gap is about 68,000,000 head."

  - question: "How many chickens does Texas produce?"
    answer: "Texas produces 731,800,000 head, fifth overall. Most of its chicken farms are in the humid eastern part of the state around Nacogdoches and Tyler."

