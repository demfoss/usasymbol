sections:
  - id: "why-georgia-produces-the-most-chickens"
    icon: "fa-solid fa-egg"
    title: "Why Georgia Produces the Most Chickens"
    paragraphs:
      - "Georgia raises 1,317,300,000 head because poultry replaced cotton. The boll weevil wrecked Southern cotton in the early 1900s, and north Georgia farmers turned to broilers. Gainesville in Hall County grew into the hub, and feed mills, hatcheries, and processing plants now sit close together."
      - "Oklahoma ranks last at 181,300,000 head. Its broiler industry sits mostly in the eastern counties next to Arkansas, while the western two thirds of the state is wheat and cattle country with little poultry."

  - id: "southern-states-dominate-chicken-production"
    icon: "fa-solid fa-drumstick-bite"
    title: "States That Produce the Most Chickens"
    paragraphs:
      - "Alabama, Arkansas, North Carolina, Texas, and Mississippi join Georgia in the top six, each above 700,000,000 head. Arkansas is where Tyson Foods began, and its chicken houses run through the Ozark foothills. Mild winters let the South raise birds nearly year round."
    table:
      columns:
        state: "State"
        head_produced: "Chicken Production (head)"
      rows:
        - state: "Georgia"
          head_produced: "1,317,300,000"
        - state: "Alabama"
          head_produced: "1,183,600,000"
        - state: "Arkansas"
          head_produced: "1,052,700,000"
        - state: "North Carolina"
          head_produced: "984,700,000"
        - state: "Texas"
