        - state: "Mississippi"
          head_produced: "701,100,000"

  - id: "delmarva-broiler-states"
    icon: "fa-solid fa-warehouse"
    title: "Delmarva Chicken Production"
    paragraphs:
      - "Maryland produces 322,000,000 head and Delaware 263,000,000, the strongest results outside the South. Commercial broiler farming began on the Delmarva Peninsula in 1923, when Cecile Steele of Ocean View, Delaware, raised a flock of 500 chicks for meat. Virginia's 248,400,000 head comes from the same peninsula and the Shenandoah Valley."


