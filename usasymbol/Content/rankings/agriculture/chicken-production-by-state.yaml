page:
  h1: "Chicken Production by State"

  quick_answer:
    - "Chicken production by state is led by Georgia at 1,317,300,000 head. Poultry took over its farms when cotton collapsed, and Gainesville still calls itself the Poultry Capital of the World."
    - "Alabama is second at 1,183,600,000 head, about 11% behind Georgia. Arkansas follows at 1,052,700,000 head, home to the headquarters of Tyson Foods in Springdale."
    - "Oklahoma is last of the 14 producing states at 181,300,000 head. Its poultry farms cluster in the east along the Arkansas line, so most of the state raises few broilers."

  methodology: "USDA NASS Poultry - Production and Value reports broiler head produced for 14 states. States without a published state-level total are not listed."

  sources:
    - name: "USDA NASS. Poultry - Production and Value"
      url: "https://www.nass.usda.gov/Publications/Todays_Reports/reports/plva0426.pdf"
      description: "State-level broiler chicken production totals, head produced"

