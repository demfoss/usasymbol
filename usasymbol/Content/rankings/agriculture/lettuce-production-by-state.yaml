faq:
- question: Which state produces the most lettuce?
  answer: California produces the most lettuce, leading Arizona in head, leaf, and romaine varieties, with 27,900,000 hundredweight of head lettuce alone.
- question: Which state produces the second-most lettuce?
  answer: Arizona ranks second in every lettuce category, with 10,400,000 hundredweight of head lettuce.
- question: How much romaine lettuce does California produce?
  answer: California produces 38,100,000 hundredweight of romaine lettuce, its largest lettuce category by volume.
- question: Do any states besides California and Arizona grow lettuce commercially?
  answer: No other state reports commercial lettuce production in USDA vegetable crop data.
- question: How much leaf lettuce does Arizona produce?
  answer: Arizona produces 2,100,000 hundredweight of leaf lettuce, its smallest lettuce category.
