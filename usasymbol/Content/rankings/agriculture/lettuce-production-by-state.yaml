sections:
- id: california-vs-arizona-lettuce-production
  icon: fa-solid fa-leaf
  title: California and Arizona Lettuce Production Compared
  paragraphs:
  - California outproduces Arizona in every lettuce category tracked by USDA. Its head lettuce total of 27,900,000 hundredweight is more than double Arizona's 10,400,000 hundredweight, and its romaine total of 38,100,000 hundredweight is more than four times Arizona's 8,500,000 hundredweight.
  - Leaf lettuce shows the widest gap. California grows 14,000,000 hundredweight against Arizona's 2,100,000 hundredweight, a difference tied to California's larger and more diversified coastal growing regions.
