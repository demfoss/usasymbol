  h1: Lentil Production by State
  quick_answer:
  - Montana produces the most lentils of any state at 7,700,000 hundredweight, about 69% of the three-state total of 11,100,000 hundredweight.
  - North Dakota ranks second at 2,852,000 hundredweight, more than five times Washington's third-place total of 536,000 hundredweight.
