sections:
- id: why-montana-grows-the-most-lentils
  icon: fa-solid fa-seedling
  title: Why Montana Grows the Most Lentils
  paragraphs:
  - Montana produces 7,700,000 hundredweight of lentils, about 69% of the three-state total, grown on dryland acreage across the state's northern plains where the crop rotates well with wheat. North Dakota follows at 2,852,000 hundredweight, and Washington trails at 536,000 hundredweight.
  - Idaho, once a lentil-producing state, was dropped from USDA estimates starting in 2024, leaving Montana, North Dakota, and Washington as the only states currently tracked.
faq:
- question: Which state produces the most lentils?
  answer: Montana produces the most lentils at 7,700,000 hundredweight, about 69% of the three-state total.
- question: Which state produces the least lentils?
  answer: Washington produces the least among reporting states at 536,000 hundredweight.
- question: How many lentils does North Dakota produce?
  answer: North Dakota produces 2,852,000 hundredweight of lentils, the second-highest total of any state.
- question: Does Idaho still produce lentils?
  answer: Idaho lentil estimates were discontinued by USDA starting in 2024, so the state no longer appears in official production figures.
- question: Why does Montana produce so many lentils?
  answer: Montana's dryland farming regions in the northern plains support large-scale lentil rotations with wheat, giving the state 7,700,000 hundredweight of production, far ahead of North Dakota's 2,852,000.
