page:
  h1: Cattle Ranching by State
  quick_answer:
  - Texas has the most cattle of any state at 12,200,000 head as of January 1, 2025, 14.08% of the US
    total and nearly double second-place Nebraska.
  - Nebraska ranks second at 6,050,000 head, followed by Kansas at 5,950,000 head and California at 5,050,000
    head.
  - Rhode Island has the fewest cattle of any state at 3,700 head, far below Delaware's 10,500, the next-lowest
    total.
  methodology: Inventory figures are USDA NASS's all cattle and calves estimate as of January 1, 2025,
    reported in the agency's annual Cattle report.
  sources:
  - name: USDA NASS. Cattle (January 2025)
    url: https://esmis.nal.usda.gov/usda-esmis/files/h702q636h/sf26b275x/h989sz55j/catl0125.pdf
    description: State-by-state all cattle and calves inventory, January 1, 2025
