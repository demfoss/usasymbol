sections:
- id: states-with-the-most-cattle
  icon: fa-solid fa-cow
  title: States With the Most Cattle
  paragraphs:
  - Texas leads all states with 12,200,000 head, nearly double Nebraska's 6,050,000. Kansas follows at
    5,950,000 head and California at 5,050,000 head, while Oklahoma rounds out the top five at 4,600,000
    head.
  - Seven of the top ten states, Texas, Nebraska, Kansas, Oklahoma, Missouri, South Dakota, and Iowa,
    sit in the Great Plains, where large grazing ranges and feedlot operations concentrate the nation's
    cattle inventory.
