page:
  h1: Tomato Production by State
  quick_answer:
  - California produces the most tomatoes at 239,674,500 CWT a year, about 28 times Florida's 8,642,000 CWT.
  - California accounts for about 97% of the two-state total of 248,316,500 CWT.
  - Only California and Florida report tomato production at this scale to USDA.
  methodology: Production figures reflect 2025 USDA NASS vegetable data reported by World Population Review, measured in hundredweight (CWT). California and Florida are the two states tracked for tomato production.
