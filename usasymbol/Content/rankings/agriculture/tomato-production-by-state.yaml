sections:
- id: states-with-the-most-tomato-production
  icon: fa-solid fa-seedling
  title: States With the Most Tomato Production
  paragraphs:
  - California's 239,674,500 CWT is about 28 times Florida's 8,642,000 CWT. Together the two states produce 248,316,500 CWT a year, a total dominated almost entirely by California's processing and fresh-market crop.
faq:
- question: Which state produces the most tomatoes?
  answer: California produces the most tomatoes at 239,674,500 CWT a year, about 97% of the two-state total.
- question: How many tomatoes does Florida produce?
  answer: Florida produces 8,642,000 CWT of tomatoes a year, far behind California's 239,674,500 CWT.
- question: How much bigger is California's tomato crop than Florida's?
  answer: California's tomato crop is about 28 times the size of Florida's, 239,674,500 CWT compared to 8,642,000 CWT.
- question: What is the combined US tomato total tracked by USDA?
  answer: California and Florida together produce 248,316,500 CWT of tomatoes a year, the only two states USDA tracks at this scale.
