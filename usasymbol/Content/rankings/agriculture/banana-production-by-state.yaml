faq:
  - question: "Which state produces the most bananas?"
    answer: "Hawaii produces the most bananas of any US state, harvesting 4.72 million pounds in 2024. It is the only state with official commercial banana production statistics."

  - question: "Does Florida grow bananas commercially?"
    answer: "Florida grows bananas on about 500 acres worth roughly $2 million, mainly Thai and cooking (Bluggoe-type) varieties rather than the Cavendish grown in Hawaii."

  - question: "Why does Hawaii grow almost all US bananas?"
    answer: "Bananas require warm, humid, frost-free conditions year-round. Hawaii's islands provide that climate, while most of the mainland US does not, which is why commercial production is concentrated there."

  - question: "How much is Hawaii's banana industry worth?"
    answer: "Hawaii's banana production was worth a record $6.69 million in 2024, up 6% from $6.29 million in 2023."

  - question: "Which Hawaiian island produces the most bananas?"
    answer: "Hawaii County, home to the Big Island, produced 3.25 million pounds in 2024, about 69% of the state's total. Honolulu was next at 941,000 pounds."

  - question: "Why did Hawaii's banana yield drop in 2024?"
    answer: "Yield per acre fell 7%, from 15.0 thousand pounds to 13.9 thousand pounds, because of the Banana Bunchy Top Virus reported by several major producers. Planted acreage still grew to 339 acres, the most since at least 2019."

