  quick_answer:
    - "Hawaii is the only US state with official commercial banana production, harvesting 4.72 million pounds worth $6.69 million in 2024."
    - "Florida grows bananas commercially on about 500 acres worth roughly $2 million, focused on Thai and cooking varieties rather than the Cavendish and apple bananas grown in Hawaii."
    - "Hawaii's banana production has fallen sharply from 29 million pounds in 2000 to 4.72 million pounds in 2024, even as the crop's value hit a record $6.69 million that year."

  methodology: "Hawaii figures come from the Hawaii Department of Agriculture and Biosecurity's 2024 banana statistics report, compiled with USDA NASS. Florida figures are published acreage and value estimates. No other state reports commercial banana production to USDA."

