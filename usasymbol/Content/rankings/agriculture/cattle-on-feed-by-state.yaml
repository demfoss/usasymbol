sections:
  - id: "why-nebraska-leads-cattle-on-feed"
    title: "Why Nebraska Leads Cattle on Feed"
    paragraphs:
      - "Nebraska leads with 2,620,000 cattle on feed because it combines Great Plains cattle country with a huge corn crop and large meatpacking plants. Keeping feed grain, cattle, and processors close together lowers the cost of moving bulky inputs and finished animals."
      - "Arizona is last among the 11 separately published states at 210,000. Its smaller cattle base and dependence on irrigated feed crops limit the scale seen across the central Plains."
  - id: "plains-states-dominate-feedlots"
    title: "Plains States Dominate Feedlots"
    paragraphs:
      - "Nebraska, Texas, and Kansas together hold 7,540,000 cattle on feed in large lots. The same region links ranches to feed grains and slaughter plants, a production chain also visible in [beef production by state](/rankings/agriculture/beef-production-by-state)."
      - "Texas fell from 2,780,000 cattle on January 1, 2025, to 2,530,000 one year later, while Nebraska rose from 2,580,000 to 2,620,000 and moved into first place."
