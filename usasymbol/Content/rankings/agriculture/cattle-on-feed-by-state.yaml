faq:
  - question: "Which state has the most cattle on feed?"
    answer: "Nebraska has the most cattle on feed in large feedlots at 2,620,000 on January 1, 2026."
  - question: "How many cattle are on feed in Texas?"
    answer: "Texas has 2,530,000 cattle on feed in feedlots with capacity of 1,000 or more head, second behind Nebraska."
  - question: "What does cattle on feed mean?"
    answer: "Cattle on feed are steers and heifers being fed grain, silage, hay, or protein supplements for the slaughter market and expected to produce a carcass grading Select or better."
  - question: "Are small feedlots included?"
    answer: "This state ranking covers feedlots with capacity of 1,000 or more head. Smaller lots are outside the state table used here."
  - question: "Which published state has the fewest cattle on feed?"
    answer: "Arizona has the smallest total among the 11 states published separately, with 210,000 cattle on feed."
