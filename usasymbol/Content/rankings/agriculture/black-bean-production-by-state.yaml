faq:
- question: Which state produces the most black beans?
  answer: Michigan produces the most black beans at 3,522,000 cwt in 2025, 49.30% of the national total
    of 7,146,000 cwt.
- question: How many acres of black beans does North Dakota harvest?
  answer: North Dakota harvested 66,800 acres of black beans in 2025, the third-most among the five states
    with reported data, and produced 1,069,000 cwt.
- question: Which state has the highest black bean yield per acre?
  answer: Idaho has the highest yield at 3,030 pounds per acre, though it harvested only 3,700 acres,
    the smallest total in the table.
- question: How many black beans does Minnesota produce?
  answer: Minnesota produced 2,151,000 cwt of black beans in 2025 from 102,900 harvested acres, an average
    yield of 2,090 pounds per acre.
- question: What share of US black bean production comes from Michigan, Minnesota, and North Dakota?
  answer: Michigan, Minnesota, and North Dakota combined for 6,742,000 cwt in 2025, 94.35% of the 7,146,000
    cwt national total.
- question: Does Washington grow black beans?
  answer: Washington harvested 6,700 acres of black beans in 2025, producing 178,000 cwt at a yield of
    2,650 pounds per acre.
