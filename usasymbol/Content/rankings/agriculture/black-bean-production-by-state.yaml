page:
  h1: Black Bean Production by State
  quick_answer:
  - Michigan leads black bean production with 3,522,000 hundredweight (cwt) harvested in 2025, 63.7% more
    than second-place Minnesota's 2,151,000 cwt.
  - Idaho posts the highest yield at 3,030 pounds per acre, though it harvested just 3,700 acres, the
    smallest footprint among the five states with reported black bean data.
  - Michigan, Minnesota, and North Dakota together produced 6,742,000 cwt of black beans in 2025, 94.35%
    of the 7,146,000 cwt national total.
  methodology: Harvested acreage, yield, and production are 2025 crop year figures from the USDA NASS
    Crop Production 2025 Summary (January 2026), the only report that breaks out black beans by state,
    listed for five states.
  sources:
