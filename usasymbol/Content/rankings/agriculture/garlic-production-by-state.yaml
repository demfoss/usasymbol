    title: "Why California Grows Almost All US Garlic"
    paragraphs:
      - "California's 3,500,000 CWT is the only state figure USDA NASS reports annually for garlic. Production data for every other state is not collected by NASS on a regular basis; the figures for Nevada, Oregon, Washington, New York, Arizona, and Alabama are compiled from older, one-off estimates dating as far back as 1997."

