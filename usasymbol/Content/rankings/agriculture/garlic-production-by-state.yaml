faq:
  - question: "Which state produces the most garlic?"
    answer: "California produces the most garlic at 3,500,000 hundredweight (CWT) a year, about 350 million pounds."

  - question: "Does any other state grow garlic besides California?"
    answer: "Small amounts are estimated in Nevada (1,800 CWT), Oregon (500 CWT), Washington (414 CWT), New York (306 CWT), Arizona (194 CWT), and Alabama (7 CWT), though none are tracked annually by USDA NASS."

  - question: "How much garlic does California produce?"
    answer: "California produced 3,500,000 CWT of garlic in 2022, the only state total counted in the official US figure."

  - question: "Why isn't garlic production reported for most states?"
    answer: "USDA NASS tracks garlic annually only in California. Figures for other states come from older, irregular estimates, some dating back to 1997."

