faq:
  - question: "Which state produces the most coffee?"
    answer: "Hawaii produces the most coffee, and it is the only state with a published state-level total, at 9,100 tons."

  - question: "Does California grow coffee?"
    answer: "California grows coffee commercially, but it does not have a separately published state-level production total in USDA NASS data."

  - question: "Is Hawaii the only US state that grows coffee?"
    answer: "Hawaii is the only state with a published production total. Coffee is also grown in California and in the US territory of Puerto Rico."

  - question: "How much coffee does Hawaii produce?"
    answer: "Hawaii produces 9,100 tons of coffee a year, the figure on record with USDA NASS."

