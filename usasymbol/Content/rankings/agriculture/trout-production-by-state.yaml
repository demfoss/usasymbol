page:
  h1: Trout Production by State
  quick_answer:
  - Idaho sold 22.2 million pounds of trout in 2025 worth $43.07 million, more than every other reporting
    state combined.
  - Pennsylvania ranked second in sales value at $7.17 million despite selling less than a tenth of Idaho's
    volume, while North Carolina followed close behind at $7.07 million.
  - Total US trout sales reached $95.2 million in 2025 across 25.26 million fish sold nationwide.
  methodology: Fish sold, live weight, and sales value figures are from USDA NASS's Trout Production report
    (February 2026), covering trout 12 inches and longer sold during 2025. States with data withheld to
    protect individual operations are grouped as "Other States."
