faq:
- question: Which state produces the most trout?
  answer: Idaho produces the most trout, selling 22.2 million pounds worth $43.07 million in 2025, more
    than every other reporting state combined.
- question: How much trout does Pennsylvania produce?
  answer: Pennsylvania sold 1.42 million pounds of trout in 2025 for $7.171 million, ranking second nationally
    in sales value.
- question: What is the total value of US trout sales?
  answer: US trout sales totaled $95.2 million in 2025 from 25.26 million fish sold across all reporting
    states.
- question: Why does Idaho lead the country in trout farming?
  answer: Idaho's Magic Valley draws cold, oxygen-rich spring water from the Eastern Snake River Plain Aquifer
    at Thousand Springs. About 98% of the state's aquaculture production is concentrated around Hagerman,
    Buhl, and Twin Falls.
- question: How does North Carolina's trout production compare to Idaho's?
  answer: North Carolina sold 2.6 million pounds of trout in 2025 for $7.072 million, far behind Idaho's
    22.2 million pounds but close to Pennsylvania's sales value.
