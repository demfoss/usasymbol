sections:
- id: why-idaho-dominates-trout-production
  icon: fa-solid fa-water
  title: Why Idaho Dominates US Trout Production
  paragraphs:
  - Idaho's Magic Valley draws on the Eastern Snake River Plain Aquifer, which surfaces as cold, oxygen-rich
    spring water at Thousand Springs. That water source underpins the 22.2 million pounds of trout Idaho
    sold in 2025, worth $43.07 million.
  - Farms cluster around Hagerman, Buhl, and Twin Falls, where about 98% of Idaho's aquaculture production
    takes place. Idaho's live weight total is nearly nine times North Carolina's 2.6 million pounds, the
    next-largest state.
- id: trout-sales-value-per-pound-by-state
  icon: fa-solid fa-money-bill
  title: Trout Sales Value per Pound by State
  paragraphs:
  - Pennsylvania recorded $7.171 million in sales from 1.42 million pounds in 2025, a higher value per pound
    than Idaho's $43.068 million from 22.2 million pounds. North Carolina sold slightly less weight than
    Pennsylvania but earned a comparable $7.072 million.
