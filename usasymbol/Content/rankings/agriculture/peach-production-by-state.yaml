faq:
  - question: "Which state produces the most peaches?"
    answer: "California produces the most peaches at 520,000 tons, well ahead of South Carolina's 85,000 tons."

  - question: "Is Georgia the top peach-producing state?"
    answer: "No. Georgia ranks third at 30,000 tons, behind California and South Carolina despite its reputation as the Peach State."

  - question: "How much peach production does South Carolina have?"
    answer: "South Carolina produces 85,000 tons of peaches, the second-most of any state."

  - question: "Which state has the smallest peach crop among top producers?"
    answer: "Michigan has the smallest crop among the seven leading peach states at 8,500 tons."

  - question: "How many states have significant commercial peach production?"
    answer: "Seven states report measurable peach production: California, South Carolina, Georgia, Pennsylvania, Colorado, New Jersey, and Michigan."

