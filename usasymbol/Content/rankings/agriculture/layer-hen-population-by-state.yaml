faq:
  - question: "Which state has the most laying hens?"
    answer: "Iowa has the largest published layer population at 46,597,000 birds on December 1, 2025."
  - question: "How many layer hens are in Ohio?"
    answer: "Ohio has 38,830,000 layer hens, the second-largest published state total."
  - question: "Does Ohio or Indiana have more laying hens?"
    answer: "Ohio has more, with 38,830,000 layers compared with Indiana's 37,289,000."
  - question: "Why does Iowa have so many laying hens?"
    answer: "Iowa grows enormous quantities of corn and soybeans, the core ingredients in chicken feed, and has a mature network of large egg farms."
  - question: "Is a layer hen the same as a broiler chicken?"
    answer: "No. Layer hens are kept for egg production, while broilers are chickens raised for meat."
  - question: "Which ranked state has the fewest layer hens?"
    answer: "Massachusetts has the smallest separately published total at 148,000 layers. Some other states are included only in a combined total."

