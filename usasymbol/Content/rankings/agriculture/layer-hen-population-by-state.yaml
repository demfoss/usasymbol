sections:
  - id: "why-iowa-has-the-most-layer-hens"
    title: "Why Iowa Has the Most Layers"
    paragraphs:
      - "Iowa's 46,597,000 layers benefit from the same grain economy that supports its hog industry. Corn and soybeans are the main ingredients in poultry feed, and large egg farms can source both close to home."
      - "Massachusetts has 148,000 layers, the smallest published total. Its compact, densely settled landscape has far less room for the large poultry complexes common in Iowa, Ohio, and Indiana."

  - id: "states-with-the-most-layer-hens"
    title: "States With the Most Layer Hens"
    paragraphs:
      - "Ohio's 38,830,000 layers edge Indiana's 37,289,000 for second place. Pennsylvania ranks fourth with 26,329,000, putting four Midwestern or Great Lakes states at the top before Texas appears in fifth."
