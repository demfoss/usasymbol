sections:
- id: why-iowa-produces-the-most-ethanol
  icon: fa-solid fa-industry
  title: Iowa's Lead in Ethanol Production Capacity
  paragraphs:
  - Iowa's 5.04 billion gallons per year of capacity comes from 42 separate plants, more than double
    the plant count of any other state. Nebraska runs 24 plants and Illinois 14, but neither approaches
    Iowa's total.
  - Iowa, Nebraska, and Illinois combined hold 51% of the nation's 18.48 billion gallons per year of
    ethanol capacity. All three states sit in the Midwest, where nearly every large ethanol plant on
    the January 2025 list is located.
- id: states-with-the-most-ethanol-plants
  icon: fa-solid fa-gas-pump
  title: States With the Most Ethanol Plants
  paragraphs:
  - Iowa's 42 plants lead every state by a wide margin. Nebraska follows with 24 plants and Minnesota
    with 18, while Illinois runs only 14 plants despite ranking third in total capacity, reflecting larger
    average plant sizes.
