faq:
- question: Which state produces the most ethanol?
  answer: Iowa produces the most ethanol, with 5.04 billion gallons per year of production capacity across
    42 plants as of January 1, 2025.
- question: How many ethanol plants does Nebraska have?
  answer: Nebraska has 24 ethanol plants with a combined capacity of 2.40 billion gallons per year, the
    second-highest total of any state.
- question: What is the total US ethanol production capacity?
  answer: Total US fuel ethanol production capacity was 18.48 billion gallons per year as of January
    1, 2025.
- question: Why does Iowa produce the most ethanol?
  answer: Iowa runs 42 ethanol plants, more than double Nebraska's 24, and its plants add up to 5.04
    billion gallons per year, more than a quarter of total US capacity.
- question: Which states have little or no ethanol production?
  answer: States outside the Midwest and South Plains report little commercial ethanol capacity; the
    15 states listed here account for the large majority of the nation's 18.48 billion gallons per year
    of capacity.
