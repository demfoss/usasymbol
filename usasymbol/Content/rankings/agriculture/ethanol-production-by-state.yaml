page:
  h1: Ethanol Production by State
  quick_answer:
  - Iowa has 5.04 billion gallons per year of fuel ethanol production capacity, more than any other state,
    spread across 42 plants as of January 1, 2025.
  - Nebraska ranks second at 2.40 billion gallons per year from 24 plants, and Illinois third at 1.92
    billion gallons per year from 14 plants.
  - Iowa, Nebraska, and Illinois together hold 51% of the nation's 18.48 billion gallons per year of total
    US fuel ethanol capacity.
  methodology: Figures are from the US Energy Information Administration's Fuel Ethanol Plant Production
    Capacity report, listing every US plant's annual capacity as of January 1, 2025. State totals sum
    all listed plants; some states with minimal or unlisted capacity are omitted.
  sources:
  - name: US Energy Information Administration. U.S. Fuel Ethanol Plant Production Capacity
    url: https://www.eia.gov/petroleum/ethanolcapacity/
    description: Plant-level fuel ethanol production capacity by state, city, and company as of January
      1, 2025, Form 819 Monthly Biofuels report
