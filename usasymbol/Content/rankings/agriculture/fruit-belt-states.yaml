faq:
  - question: "Which states are in the Fruit Belt?"
    answer: "Five states make up the Fruit Belt: Michigan, New York, Ohio, Pennsylvania, and Wisconsin, all bordering the Great Lakes."

  - question: "What is Michigan's Fruit Ridge known for?"
    answer: "Michigan's Fruit Ridge, covering about 158 square miles near Lake Michigan, is known primarily for apple production."

  - question: "What is the Lake Erie Fruit Belt?"
    answer: "The Lake Erie Fruit Belt is a grape-growing region mainly in Pennsylvania that also covers New York, with Ohio part of the broader region."

  - question: "Why do the Great Lakes create good fruit-growing conditions?"
    answer: "The lakes moderate nearby temperatures, delaying spring blossoming until after the last frost and pushing back the first killing frost in the fall."

  - question: "Is Wisconsin part of the Fruit Belt?"
    answer: "Yes. Wisconsin's Fruit Belt runs along the Lake Michigan shore, in the same lake-effect band as Michigan's Fruit Ridge."

