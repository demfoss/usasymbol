sections:
  - id: "why-california-leads-farm-cash-receipts"
    title: "Why California Has the Highest Farm Receipts"
    paragraphs:
      - "California recorded $61.217 billion in farm marketings, led by $44.652 billion from crops. Its long growing seasons, irrigated valleys, and Mediterranean climate support high-value fruit, nut, vegetable, and nursery crops that cannot be grown at the same scale across most of the country."
      - "Animal-product receipts added $16.565 billion, giving California a second major income stream alongside its crop sector. The state's breadth is visible in its lead in [apple production](/rankings/agriculture/apple-production-by-state) and many other specialty crops."
    table:
      columns:
        state: "State"
        cash_receipts_million: "Farm Cash Receipts ($M)"
      rows:
        - { state: "California", cash_receipts_million: "61,217.0" }
        - { state: "Iowa", cash_receipts_million: "37,586.3" }
        - { state: "Nebraska", cash_receipts_million: "31,970.2" }
        - { state: "Texas", cash_receipts_million: "30,283.1" }
        - { state: "Kansas", cash_receipts_million: "23,868.2" }

  - id: "crop-and-livestock-receipts"
    title: "Crop vs Livestock Farm Receipts"
    paragraphs:
      - "Texas led animal-product receipts at $23.368 billion, reflecting its enormous cattle sector. Nebraska followed at $20.041 billion, while Iowa reached $19.458 billion through hogs, cattle, dairy, poultry, and other livestock products."
      - "California led crop receipts at $44.652 billion. Illinois ranked second at $18.489 billion and Iowa third at $18.128 billion, totals closely tied to the two states' leading positions in [corn production](/rankings/agriculture/corn-production-by-state) and soybeans."

  - id: "states-with-lowest-farm-receipts"
    title: "States With the Lowest Farm Receipts"
    paragraphs:
      - "Alaska recorded $52.6 million in marketings, less than half Rhode Island's $110.2 million. Cold temperatures, permafrost, short seasons, and long distances between farms and markets constrain the range and scale of Alaska agriculture."
      - "New Hampshire was third-lowest at $262.4 million. These small totals belong to states with limited agricultural acreage, while nearby urban markets can still support dairies, nurseries, orchards, vegetables, and direct-to-consumer farms."

