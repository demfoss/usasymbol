faq:
  - question: "Which state has the highest farm cash receipts?"
    answer: "California ranks first with $61.217 billion in 2024 farm cash receipts, including $44.652 billion from crops and $16.565 billion from livestock, dairy, and poultry."
  - question: "Which state has the lowest farm cash receipts?"
    answer: "Alaska has the lowest total at $52.6 million, followed by Rhode Island at $110.2 million."
  - question: "How much are Iowa's farm cash receipts?"
    answer: "Iowa recorded $37.586 billion in 2024 farm cash receipts, the second-highest total in the country."
  - question: "Does Texas or California earn more from livestock?"
    answer: "Texas earns more from livestock, dairy, and poultry marketings, with $23.368 billion compared with California's $16.565 billion."
  - question: "What are farm cash receipts?"
    answer: "Farm cash receipts are the gross dollars farms receive from selling crops, livestock, dairy products, poultry, and related agricultural commodities. They exclude government payments and other farm-related income."
  - question: "Which state earns the most from crops?"
    answer: "California has the highest crop receipts at $44.652 billion, more than twice Illinois's second-place $18.489 billion."

