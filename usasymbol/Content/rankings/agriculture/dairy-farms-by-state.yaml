faq:
  - question: "Which state has the most dairy farms?"
    answer: "Wisconsin has the most licensed dairy herds at 5,375 in 2025, followed by Pennsylvania with 4,360 and New York with 2,760."
  - question: "How many licensed dairy farms are in the United States?"
    answer: "The United States had 23,609 licensed dairy herds in 2025, down from 24,645 in 2024."
  - question: "What counts as a licensed dairy herd?"
    answer: "It is a dairy farm licensed by a state or other regulatory agency to sell milk. The count is an annual average rather than a tally of every farm that owns a dairy cow."
  - question: "Does California or Wisconsin have more dairy farms?"
    answer: "Wisconsin has 5,375 licensed dairy herds, compared with California's 960. California nevertheless has more milk cows because its herds are much larger on average."
  - question: "Which published state has the fewest dairy farms?"
    answer: "Alabama has 10 licensed dairy herds, the fewest among states listed separately. Four additional states are combined into an Other States total of nine herds."
