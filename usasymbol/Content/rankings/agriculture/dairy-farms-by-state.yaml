sections:
  - id: "why-wisconsin-has-the-most-dairy-farms"
    title: "Why Wisconsin Has the Most Dairy Farms"
    paragraphs:
      - "Wisconsin leads with 5,375 licensed herds because its dairy economy developed around many local cheese plants and farmer cooperatives. Those nearby buyers gave farms a market for milk that could be preserved as cheese rather than shipped fresh over long distances."
      - "Alabama has 10 licensed herds, the smallest separately published count. Hot, humid summers raise heat stress for dairy cows, while the state's farm economy is more heavily oriented toward poultry, cattle, and row crops."
  - id: "dairy-farms-and-herd-size"
    title: "Dairy Farms and Herd Size"
    paragraphs:
      - "California ranks sixth in licensed herds with 960 even though it has the nation's largest published milk-cow population. The contrast with Wisconsin shows how western milk production is concentrated in fewer, much larger operations."
      - "Pennsylvania's 4,360 herds and New York's 2,760 keep the Northeast prominent. Both states combine productive forage country with access to major East Coast milk markets and long-established processing industries, including [cheese production](/rankings/agriculture/cheese-production-by-state)."
