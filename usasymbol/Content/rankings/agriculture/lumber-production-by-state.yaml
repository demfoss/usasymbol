page:
  h1: Lumber Production by State
  quick_answer:
  - Oregon produces the most softwood lumber of any state at roughly 5.1 billion board feet a year, about 14% of national output.
  - Washington ranks second at roughly 3.7 billion board feet, and Alabama ranks third at roughly 2.96 billion board feet.
  - Georgia and Mississippi round out the top five at roughly 2.75 billion and 2.44 billion board feet, both concentrated in the Southern Yellow Pine belt.
  methodology: Figures are annual softwood lumber production estimates by state in board feet, compiled from industry production data reported by state forestry associations. Figures cover softwood lumber only, not hardwood.
