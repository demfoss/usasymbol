sections:
- id: why-oregon-produces-the-most-lumber
  icon: fa-solid fa-tree
  title: Why Oregon Produces the Most Softwood Lumber
  paragraphs:
  - Oregon produces roughly 5.1 billion board feet of softwood lumber, about 14% of national output, a lead built on the state's large inventory of Douglas fir and an industrial mill network sized for high volume. Washington follows at roughly 3.7 billion board feet.
  - Alabama (2.96 billion), Georgia (2.75 billion), and Mississippi (2.44 billion) form a separate cluster in the Southern Yellow Pine belt, where privately owned pine plantations supply regional mills across the Southeast.
faq:
- question: Which state produces the most lumber?
  answer: Oregon produces the most softwood lumber at roughly 5.1 billion board feet a year, about 14% of national output.
- question: Which state produces the most lumber in the South?
  answer: Alabama produces the most softwood lumber in the Southeast among the top five states, at roughly 2.96 billion board feet, just ahead of Georgia's 2.75 billion.
- question: How much lumber does Washington produce?
  answer: Washington produces roughly 3.7 billion board feet of softwood lumber, the second-highest total of any state.
- question: Why does Oregon produce so much lumber?
  answer: Oregon's large Douglas fir inventory and established mill network support roughly 5.1 billion board feet of softwood lumber a year, well ahead of Washington's 3.7 billion.
- question: How much lumber does Georgia produce?
  answer: Georgia produces roughly 2.75 billion board feet of softwood lumber, drawn largely from Southern Yellow Pine plantations.
