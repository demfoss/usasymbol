sections:
- id: why-nevada-has-the-most-wild-horses
  icon: fa-solid fa-horse
  title: Why Nevada Has the Most Wild Horses
  paragraphs:
  - Nevada holds 35,140 wild horses and burros, tied to the size of the state's Bureau of Land Management Herd Management Areas, the designated public rangelands where these populations are counted. Arizona (10,680) and Wyoming (8,488) hold the next-largest shares, but neither approaches Nevada's total.
  - Only ten states have BLM-managed herds at all. California (7,147) and Oregon (4,991) round out the states with populations above 4,000, while New Mexico's 85 and Montana's 200 show how small some Herd Management Areas can be.
faq:
- question: Which state has the most wild horses?
  answer: Nevada has the most wild horses and burros at 35,140, nearly half the national on-range total of 73,130.
- question: Which state has the fewest wild horses?
  answer: New Mexico has the fewest among ranked states at 85, well behind Montana's 200.
- question: How many wild horses are in Arizona?
  answer: Arizona has 10,680 wild horses and burros, the second-highest total of any state.
- question: Why does Nevada have so many wild horses?
  answer: Nevada's count reflects the size of its Bureau of Land Management Herd Management Areas, the public rangelands where wild horse and burro populations are tracked. The state accounts for roughly 48% of the national on-range total.
- question: Does this ranking include all horses in each state, including domesticated ones?
  answer: No. These figures cover only wild horses and burros managed by the Bureau of Land Management on public rangeland, not privately owned or domesticated horses.
- question: How many states have BLM-managed wild horse populations?
  answer: 'Ten states have Bureau of Land Management Herd Management Areas: Nevada, Arizona, Wyoming, California, Oregon, Utah, Colorado, Idaho, Montana, and New Mexico.'
