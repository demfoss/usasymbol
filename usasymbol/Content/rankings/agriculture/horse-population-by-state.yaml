page:
  h1: Wild Horse Population by State
  quick_answer:
  - Nevada has the most wild horses and burros of any state at 35,140, nearly half the national on-range total of 73,130.
  - Arizona ranks second at 10,680, and Wyoming ranks third at 8,488, together with Nevada accounting for most of the national total.
  - New Mexico has the fewest among ranked states at 85, and Montana ranks second-fewest at 200, more than 400 times smaller than Nevada's count.
  methodology: Figures are 2025 on-range population estimates for wild horses and burros managed by the Bureau of Land Management, not total domesticated horse counts. Only states with BLM Herd Management Areas are included.
