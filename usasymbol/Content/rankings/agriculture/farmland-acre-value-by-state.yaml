page:
  h1: "Farmland Value per Acre by State"

  quick_answer:
    - "Rhode Island has the highest farm real estate value in the country at $23,600 per acre, ahead of New Jersey at $17,000 and Massachusetts at $15,200."
    - "New Mexico has the lowest farmland value at $735 per acre, while California ranks fifth overall at $14,100 per acre despite leading the nation in cropland value at $18,430 per acre."
    - "Rhode Island also leads the country in cropland ($34,300 per acre) and pasture ($17,500 per acre) values, while Wyoming's pasture land averages just $770 per acre."

  methodology: "Farm real estate, cropland, and pasture values per acre are 2026 figures from the USDA NASS Land Values 2026 Summary, released July 31, 2026, which excludes Alaska and Hawaii."

  sources:
    - name: "USDA NASS. Land Values 2026 Summary"
      url: "https://www.nass.usda.gov/Publications/Todays_Reports/reports/land0726.pdf"
      description: "State-by-state farm real estate, cropland, and pasture values per acre, 2022-2026"

