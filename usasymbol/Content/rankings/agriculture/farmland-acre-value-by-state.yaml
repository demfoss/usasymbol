faq:
  - question: "Which state has the highest farmland value per acre?"
    answer: "Rhode Island has the highest farm real estate value in the country at $23,600 per acre, more than $6,000 ahead of second-place New Jersey at $17,000."

  - question: "Which state has the lowest farmland value per acre?"
    answer: "New Mexico has the lowest farm real estate value at $735 per acre, the smallest figure in the table."

  - question: "What is the average farmland value per acre in the United States?"
    answer: "The national average farm real estate value is $4,500 per acre for 2026, covering the 48 states in the USDA report."

  - question: "Which state has the most valuable cropland?"
    answer: "Rhode Island has the most valuable cropland at $34,300 per acre. Massachusetts is second at $26,600 per acre."

  - question: "Which state has the most valuable pasture land?"
    answer: "Rhode Island's pasture land is worth the most at $17,500 per acre, ahead of New Jersey at $15,600 per acre."

  - question: "What is the farmland value per acre in California?"
    answer: "California's farm real estate value is $14,100 per acre, ranking fifth in the table. Its cropland value of $18,430 per acre is the highest among Pacific states."

