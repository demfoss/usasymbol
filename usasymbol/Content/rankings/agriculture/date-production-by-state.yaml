  - question: "How many dates does Arizona produce?"
    answer: "Arizona produced 13,670 tons of dates in 2023, the second-highest total in the country."

  - question: "How many total tons of dates does the U.S. produce?"
    answer: "California and Arizona combined produced 63,900 tons of dates in 2023."

