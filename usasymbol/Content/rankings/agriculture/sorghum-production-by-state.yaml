faq:
  - question: "Which state produces the most sorghum?"
    answer: "Kansas produces the most sorghum in the country at 228,250,000 bushels, 56.75% of the six-state total."

  - question: "Which state produces the least sorghum?"
    answer: "South Dakota produces the least sorghum among the six ranked states at 12,240,000 bushels."

  - question: "How much sorghum does Texas produce?"
    answer: "Texas produces 103,800,000 bushels of sorghum, the second-most of any state."

  - question: "How many states grow sorghum commercially?"
    answer: "Six states report sorghum production: Kansas, Texas, Colorado, Nebraska, Oklahoma, and South Dakota."

  - question: "What is total US sorghum production?"
    answer: "The six ranked states produced 402,200,000 bushels of sorghum combined in the most recent growing season."

