faq:
- question: Which state produces the most celery?
  answer: California produces the most celery, with 15 million CWT in 2025, the only state-level figure
    published in the USDA Vegetables Summary.
- question: Do other states grow celery commercially?
  answer: The USDA Vegetables Summary reviewed for this page does not publish a state-level celery production
    figure for any state besides California.
- question: What is the total US celery production?
  answer: The United States produced 15 million CWT of celery in 2025 on record, all of it attributed
    to California.
- question: Why is California the only state with tracked celery production?
  answer: USDA's published Vegetables Summary reports a state-level figure only for California, making
    it the sole tracked source of commercial celery production in the data on record.
