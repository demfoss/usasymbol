faq:
  - question: "Which state produces the most olives?"
    answer: "California produces the most olives in the country at 144,000 metric tons, the only state with a published production figure."

  - question: "Why does California produce nearly all U.S. olives?"
    answer: "California's Mediterranean-like climate supports commercial olive cultivation in a way most other states cannot match."

  - question: "Do other states grow olives commercially?"
    answer: "No other state reports a comparable commercial olive production figure in USDA data."

