  - question: "How much do eggs cost in California?"
    answer: "Eggs average $6.05 per dozen in California, the fifth-highest price in the table."

  - question: "How much more expensive are eggs in Hawaii than the national low?"
    answer: "Hawaii's $9.73 per dozen is $5.49 higher than Missouri's $4.24, more than double the price."

