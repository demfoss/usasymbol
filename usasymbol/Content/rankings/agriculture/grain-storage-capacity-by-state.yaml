page:
  h1: Grain Storage Capacity by State
  quick_answer:
  - Iowa holds 3.58 billion bushels of combined grain storage capacity, 2.05 billion on farms and 1.53
    billion off farms, more than any other state as of December 1, 2024.
  - Illinois ranks second at 3.15 billion bushels, built mostly on 1.65 billion bushels of off-farm elevator
    and terminal capacity, the largest off-farm total in the country.
  - Six states, Iowa, Minnesota, Illinois, Nebraska, North Dakota, and Indiana, hold 59% of the nation's
    13.63 billion bushels of on-farm storage capacity.
  methodology: Figures are from USDA NASS's Grain Stocks report (January 10, 2025), on-farm and off-farm
    storage capacity as of December 1, 2024. Off-farm capacity covers elevators, warehouses, terminals,
    and oilseed crushers; Alaska and Hawaii are excluded.
  sources:
  - name: USDA NASS. Grain Stocks (January 2025)
    url: https://esmis.nal.usda.gov/sites/default/release-files/xg94hp534/5d86qt759/xp68nc84m/grst0125.pdf
    description: On-farm and off-farm grain storage capacity by state, December 1, 2023 and 2024, and
      off-farm storage facility counts by state
