  title: Off-Farm Storage Facility Counts by State
  paragraphs:
  - Iowa had the most off-farm storage facilities of any state at 820, just ahead of Illinois at 800.
    Kansas followed with 690 facilities, then Minnesota with 485 and Nebraska with 480. The United States
    had 7,922 off-farm facilities total as of December 1, 2024, down 1% from a year earlier.
