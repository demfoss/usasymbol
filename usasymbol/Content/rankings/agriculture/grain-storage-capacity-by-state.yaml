sections:
- id: on-farm-vs-off-farm-grain-storage-by-state
  icon: fa-solid fa-warehouse
  title: On-Farm vs Off-Farm Grain Storage by State
  paragraphs:
  - Iowa leads on-farm storage at 2.05 billion bushels, followed by Minnesota at 1.55 billion and Illinois
    at 1.50 billion. Nebraska, North Dakota, and Indiana round out the top six, together holding 59% of
    the nation's 13.63 billion bushels of on-farm capacity.
  - Illinois and Iowa lead off-farm capacity instead, at 1.65 billion and 1.53 billion bushels. Kansas
    ranks third off-farm at 1.22 billion bushels, followed by Nebraska and Minnesota; those five states
    hold 52% of the country's 11.85 billion bushels of off-farm capacity.
