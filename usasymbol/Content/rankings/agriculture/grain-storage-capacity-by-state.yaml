faq:
- question: Which state has the most grain storage capacity?
  answer: Iowa has the most combined grain storage capacity at 3.58 billion bushels, made up of 2.05 billion
    bushels on farms and 1.53 billion bushels off farms as of December 1, 2024.
- question: What is the total grain storage capacity in the United States?
  answer: The US had 25.48 billion bushels of total grain storage capacity as of December 1, 2024, split
    between 13.63 billion bushels on farms and 11.85 billion bushels off farms.
- question: Which state has the most off-farm grain storage?
  answer: Illinois has the most off-farm storage capacity at 1.65 billion bushels, just ahead of Iowa
    at 1.53 billion bushels. Kansas ranks third at 1.22 billion bushels.
- question: How much on-farm grain storage does Iowa have?
  answer: Iowa has 2.05 billion bushels of on-farm storage capacity, the most of any state and well ahead
    of second-place Minnesota at 1.55 billion bushels.
- question: Which states have the most off-farm storage facilities?
  answer: Iowa has 820 off-farm storage facilities and Illinois has 800, the two highest counts nationally.
    Kansas ranks third with 690 facilities.
