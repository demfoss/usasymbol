faq:
  - question: "Which state produces the most cranberries?"
    answer: "Wisconsin produces the most cranberries at 4.9 million barrels in 2024, 61% of the entire U.S. crop."

  - question: "Which states grow cranberries commercially?"
    answer: "Four states report commercial cranberry production: Wisconsin, Massachusetts, New Jersey, and Oregon."

  - question: "How many cranberries does Massachusetts produce?"
    answer: "Massachusetts produced 2.2 million barrels of cranberries in 2024, the second-highest total in the country."

  - question: "Which state produces the fewest cranberries?"
    answer: "Oregon produces the fewest cranberries among the four producing states at 560,000 barrels, just below New Jersey's 580,000."

  - question: "How long has Wisconsin led the country in cranberry production?"
    answer: "Wisconsin has led the country in cranberry production for 31 consecutive years as of 2024."

