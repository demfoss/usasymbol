faq:
- question: Which state produces the most crawfish?
  answer: Louisiana produces the most crawfish, with 728 of the nation's 751 certified crawfish farms in
    the 2023 Census of Aquaculture and 100 to 120 million pounds harvested annually.
- question: Do any other states farm crawfish commercially?
  answer: Texas and South Carolina are the next largest crawfish states, though far behind Louisiana. Texas
    had 12 crawfish farms and South Carolina had 5 in the 2018 Census of Aquaculture.
- question: How many pounds of crawfish does Louisiana produce a year?
  answer: Louisiana farmers produce 100 to 120 million pounds of crawfish in a typical year, according to
    the LSU AgCenter.
- question: Why is Louisiana known for crawfish?
  answer: Louisiana rotates about 70% of its crawfish ponds with rice fields, since the flooding and draining
    cycle of rice farming matches what crawfish need to grow. The state's farming also mimics the natural
    flood cycle of the Atchafalaya Basin.
- question: What percentage of US crawfish farms are in Louisiana?
  answer: Louisiana held 97% of the nation's 751 certified crawfish farms in the 2023 Census of Aquaculture.
