sections:
- id: why-louisiana-grows-nearly-all-us-crawfish
  icon: fa-solid fa-water
  title: Why Louisiana Grows Nearly All US Crawfish
  paragraphs:
  - About 70% of Louisiana's crawfish farming is rotated with rice production, since flooding and draining
    rice fields lines up with the crawfish growing cycle. That rotation lets Louisiana run 728 of the nation's
    751 certified crawfish farms.
  - Farming practices mimic the natural flood cycle of the Atchafalaya Basin, a swamp long recognized as
    one of the most productive crawfish habitats in the world. The result is 100 to 120 million pounds of
    crawfish harvested in Louisiana each year, a volume no other state approaches.
