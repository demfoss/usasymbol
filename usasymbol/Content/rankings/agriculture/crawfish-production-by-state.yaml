page:
  h1: Crawfish Production by State
  quick_answer:
  - Louisiana holds 97% of the nation's 751 certified crawfish farms and produces 100 to 120 million pounds
    of crawfish a year, the most of any state.
  - Texas ranks a distant second with 12 crawfish farms in the 2018 Census of Aquaculture, compared with
    449 in Louisiana that same year.
  - South Carolina had 5 crawfish farms in 2018, the only other state with more than a handful of operations
    on record.
  methodology: Farm counts are from USDA NASS's 2023 and 2018 Census of Aquaculture. Louisiana production
    volume and economic figures are from the LSU AgCenter, the primary tracker of the state's crawfish industry.
