page:
  h1: Canola Production by State
  quick_answer:
  - North Dakota produces the most canola in the country at 3,816,000,000 pounds, 81.19% of the US total.
  - Minnesota ranks second at 261,030,000 pounds, followed by Washington at 224,910,000 pounds, both far
    behind North Dakota's lead.
  - Oklahoma produces the least canola among the tracked states at 11,550,000 pounds, a fraction of North
    Dakota's output.
  methodology: Production figures are 2025 crop year data on record with USDA NASS. Only states with reportable
    commercial canola acreage are included.
