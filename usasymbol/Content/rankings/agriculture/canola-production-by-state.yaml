faq:
- question: Which state produces the most canola?
  answer: North Dakota produces the most canola at 3,816,000,000 pounds, 81.19% of the US total.
- question: Which state produces the least canola?
  answer: Oklahoma produces the least canola among the tracked states at 11,550,000 pounds.
- question: How many states grow canola commercially?
  answer: USDA NASS reports commercial canola production for seven states, led by North Dakota, Minnesota,
    and Washington.
- question: How much canola does Minnesota produce?
  answer: Minnesota produces 261,030,000 pounds of canola, 5.55% of the US total and the second-highest
    figure in the table.
- question: What is the canola production in Montana?
  answer: Montana produces 179,340,000 pounds of canola, ranking fourth nationally, just behind Washington's
    224,910,000 pounds.
