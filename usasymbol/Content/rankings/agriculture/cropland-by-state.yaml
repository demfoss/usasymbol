sections:
  - id: "why-kansas-has-most-cropland"
    icon: "fa-solid fa-wheat-awn"
    title: "Why Kansas Has Most Cropland"
    paragraphs:
      - "Kansas reported 28,340,827 acres of cropland, the country's largest total. Level to gently rolling Great Plains terrain supports enormous expanses of wheat, corn, sorghum, and soybeans across the state."
      - "Texas came close with 27,903,626 acres, but its land base also includes 95.8 million acres of pasture. Kansas devotes a much larger share of its agricultural landscape to crop fields."
  - id: "states-with-least-cropland"
    icon: "fa-solid fa-leaf"
    title: "States With the Least Cropland"
    paragraphs:
      - "Rhode Island had 16,665 cropland acres, followed by Alaska at 72,708 and New Hampshire at 105,297. Rhode Island's tiny footprint and Alaska's climate and terrain limit the continuous field acreage common across the Plains."
      - "Connecticut reported 139,558 acres and Hawaii had 158,053. Small totals do not prevent intensive production, especially where specialty crops can occupy compact parcels."
  - id: "great-plains-cropland-leaders"
    icon: "fa-solid fa-map"
    title: "Great Plains Cropland Leaders"
    paragraphs:
      - "North Dakota ranked third with 26,260,012 acres, while Nebraska ranked sixth with 21,217,519. Water availability changes how those acres are farmed, which is why [irrigated farmland by state](/rankings/agriculture/irrigated-farmland-by-state) produces a different order."
      - "Iowa placed fourth at 25,881,597 acres and Illinois fifth at 22,913,841. Their deep prairie soils underpin the corn and soybean economy that contributes to [agricultural GDP by state](/rankings/agriculture/agricultural-gdp-by-state)."
