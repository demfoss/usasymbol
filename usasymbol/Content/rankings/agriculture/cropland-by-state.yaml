page:
  h1: "Cropland by State"
  quick_answer:
    - "Kansas had the most cropland in 2022 at 28,340,827 acres, reflecting its vast Great Plains grain and oilseed landscape."
    - "Rhode Island had the least cropland at 16,665 acres, a result tied to its very small land area."
    - "Texas ranked second with 27,903,626 acres, narrowly ahead of North Dakota at 26,260,012."
  methodology: "Total cropland acres come from the land-use section of the 2022 USDA NASS Census of Agriculture. The measure includes harvested cropland and other cropland, including idle land, summer fallow, and land with crop failure."
