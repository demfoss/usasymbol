faq:
  - question: "Which state has the most cropland?"
    answer: "Kansas has the most cropland at 28,340,827 acres. Its broad Great Plains landscape supports large, connected areas of field crops."
  - question: "Which state has the least cropland?"
    answer: "Rhode Island has the least cropland at 16,665 acres. Its entire land base is small and heavily settled compared with major farm states."
  - question: "How much cropland does Texas have?"
    answer: "Texas had 27,903,626 acres of cropland in 2022, ranking second. The state also has far more pastureland than cropland because ranching occupies vast parts of Texas."
  - question: "How much cropland does North Dakota have?"
    answer: "North Dakota had 26,260,012 cropland acres, ranking third. Its spring wheat, corn, soybean, and other field-crop regions cover much of the state's eastern and central plains."
  - question: "What counts as cropland?"
    answer: "Cropland includes harvested fields plus other crop ground such as idle acres, summer fallow, cover-crop land, and fields where crops failed. Pastureland and woodland are counted separately."
