page:
  h1: Rye Production by State
  quick_answer:
  - North Dakota produced the most rye in the country in 2024 at 2,160,000 bushels, 30.32% of the 7,124,000 bushel total across the six states with published data.
  - Wisconsin produced the least among the six rye-producing states, at 588,000 bushels, behind Pennsylvania's 700,000 bushels.
  - Oklahoma ranks second at 1,400,000 bushels, ahead of Minnesota's 1,176,000 bushels and South Dakota's 1,100,000 bushels.
  methodology: Production figures are 2024 crop-year bushels from the USDA NASS Small Grains 2024 Summary, released September 2024. The table lists the six states with published state-level rye data. National rye production totaled 14.7 million bushels in 2024, the highest since 1987, though USDA publishes individual state figures for only these six states.
