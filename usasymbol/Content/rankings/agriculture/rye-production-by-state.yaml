faq:
- question: Which state produces the most rye?
  answer: North Dakota produces the most rye in the country at 2,160,000 bushels in 2024, 30.32% of the six-state total.
- question: Which state produces the least rye?
  answer: Among the six states USDA tracks for rye, Wisconsin produces the least at 588,000 bushels.
- question: How much rye does Oklahoma produce?
  answer: Oklahoma produced 1,400,000 bushels of rye in 2024, the second-highest total among the six states with published data.
- question: How many states grow rye commercially?
  answer: 'USDA NASS publishes state-level rye production data for six states: North Dakota, Oklahoma, Minnesota, South Dakota, Pennsylvania, and Wisconsin.'
- question: How much rye is grown in the United States?
  answer: National rye production totaled 14.7 million bushels in 2024, the highest since 1987, though USDA breaks out individual figures for only six states.
