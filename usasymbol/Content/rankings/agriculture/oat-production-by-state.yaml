faq:
  - question: "Which state produces the most oats?"
    answer: "Minnesota produces the most oats in the country at 12,854,000 bushels, 41.75% of the U.S. total."

  - question: "Which state produces the least oats?"
    answer: "Maryland produces the least among the 15 listed states at 8,000 bushels."

  - question: "How much does South Dakota produce compared to Minnesota?"
    answer: "South Dakota produces 9,195,000 bushels, about 3,659,000 bushels behind Minnesota's 12,854,000."

  - question: "Which states tie for oat production?"
    answer: "Alabama and California tie at 27,000 bushels each, the only tie in the table."

  - question: "What is the total U.S. oat production among listed states?"
    answer: "The 15 listed states combined for 30,785,000 bushels of oats."

