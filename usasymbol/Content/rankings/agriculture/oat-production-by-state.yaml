page:
  h1: "Oat Production by State"

  quick_answer:
    - "Minnesota produces the most oats in the country at 12,854,000 bushels, more than South Dakota and Wisconsin combined."
    - "South Dakota ranks second at 9,195,000 bushels, and Wisconsin follows at 5,583,000 bushels, together with Minnesota making up nearly 90% of the U.S. total."
    - "Maryland produces the least among the 15 listed states at 8,000 bushels, a fraction of a percent of the national total."

  methodology: "Production figures reflect 2025 USDA data reported by World Population Review, covering the 15 states with recorded commercial oat output. States without recorded production are omitted."

  sources:
    - name: "USDA NASS. Small Grains Summary"
      url: "https://www.nass.usda.gov/Publications/Todays_Reports/reports/smgr0925.pdf"
      description: "State-level oat production data, 2025"

