faq:
  - question: "Which state produces the most pecans?"
    answer: "Georgia produces the most pecans at 111.5 million pounds, 39.22% of the five-state total."

  - question: "How close are Texas and Arizona in pecan production?"
    answer: "Very close. Texas grows 41.6 million pounds and Arizona grows 40.8 million pounds, a difference of just 800,000 pounds."

  - question: "Which state ranks second in pecan production?"
    answer: "New Mexico ranks second at 76 million pounds, 35.5 million pounds behind Georgia."

  - question: "Which state has the smallest pecan crop among top producers?"
    answer: "Oklahoma has the smallest crop among the five leading pecan states at 14.4 million pounds."

  - question: "How many states grow pecans commercially?"
    answer: "Five states report measurable pecan production: Georgia, New Mexico, Texas, Arizona, and Oklahoma."

