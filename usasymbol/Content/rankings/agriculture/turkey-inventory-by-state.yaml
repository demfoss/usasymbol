faq:
  - question: "Which state raises the most turkeys?"
    answer: "Minnesota raised 33,500,000 turkeys in 2025, the largest separately published state total."
  - question: "How many turkeys does North Carolina raise?"
    answer: "North Carolina raised 28,000,000 turkeys in 2025, ranking second by head."
  - question: "Does Minnesota or North Carolina raise more turkeys?"
    answer: "Minnesota raises more birds, 33,500,000 to North Carolina's 28,000,000. North Carolina produces more total pounds because its average market bird is heavier."
  - question: "Why does Minnesota raise so many turkeys?"
    answer: "Minnesota has a long-established cluster of turkey growers, hatcheries, feed suppliers, veterinarians, and processors, plus abundant corn and soybean feed."
  - question: "Which states tie in turkey population?"
    answer: "California and Michigan tie at 4,300,000 turkeys raised in 2025."
  - question: "Which ranked state raises the fewest turkeys?"
    answer: "South Dakota raised 1,800,000 turkeys, the smallest total among states published separately."

