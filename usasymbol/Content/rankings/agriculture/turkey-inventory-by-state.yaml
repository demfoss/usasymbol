sections:
  - id: "why-minnesota-raises-the-most-turkeys"
    title: "Why Minnesota Raises the Most Turkeys"
    paragraphs:
      - "Minnesota's 33,500,000 turkeys come from a mature industry that links growers with hatcheries, feed mills, veterinarians, and processors. The state's corn and soybean crops also supply the main ingredients in turkey feed."
      - "South Dakota's 1,800,000 birds form the smallest separately published total. Its livestock economy is centered more heavily on cattle and hogs, while commercial turkey processing is concentrated in Minnesota and other established poultry states."

  - id: "states-that-raise-the-most-turkeys"
    title: "States That Raise the Most Turkeys"
    paragraphs:
      - "North Carolina raised 28,000,000 turkeys, second by head, but its 1,094,800,000 pounds led [turkey production by state](/rankings/agriculture/turkey-production-by-state). Minnesota raised more birds but produced 971,500,000 pounds, showing how market weights can reverse the order."
    table:
      columns:
        state: "State"
        turkeys_raised: "Turkeys Raised (head)"
      rows:
        - { state: "Minnesota", turkeys_raised: "33,500,000" }
        - { state: "North Carolina", turkeys_raised: "28,000,000" }
        - { state: "Arkansas", turkeys_raised: "21,500,000" }
        - { state: "Indiana", turkeys_raised: "20,000,000" }
        - { state: "Virginia", turkeys_raised: "15,300,000" }

  - id: "turkey-head-count-versus-weight"
    title: "Turkey Head Count Versus Weight"
    paragraphs:
      - "California and Michigan tie at 4,300,000 turkeys, yet Michigan produced 184,040,000 pounds compared with California's 82,990,000. The same bird count can yield very different poundage when states raise different market classes and finished weights."

