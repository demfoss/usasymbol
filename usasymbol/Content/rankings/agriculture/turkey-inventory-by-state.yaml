page:
  h1: "Turkey Population by State 2025"
  quick_answer:
    - "Minnesota raised the most turkeys in 2025 at 33,500,000 birds, reflecting its long-established network of growers, hatcheries, feed suppliers, and processors."
    - "North Carolina ranks second with 28,000,000 turkeys and produces more pounds than Minnesota because its average market bird is heavier."
    - "South Dakota raised the fewest among the separately published states at 1,800,000 turkeys."
  methodology: "USDA NASS Poultry - Production and Value reports turkeys raised during 2025, based on placements from September 1, 2024, through August 31, 2025. Unpublished states are excluded."
