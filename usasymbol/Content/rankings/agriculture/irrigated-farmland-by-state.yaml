faq:
- question: Which state has the most irrigated cropland?
  answer: California had the most irrigated cropland in 2022 at 8.2 million acres, about 14.9% of the US total.
- question: How does Nebraska's irrigated acreage compare to California's?
  answer: Nebraska had 8 million irrigated acres in 2022, about 14.5% of the US total, within 3% of California's 8.2 million.
- question: Which state has the third-most irrigated cropland?
  answer: Arkansas has ranked third since 2012, when it overtook Texas, driven largely by growth in irrigated rice and soybean acreage.
- question: How much irrigated cropland does the US have?
  answer: The US had just under 55 million acres of irrigated cropland in 2022, about 18% of all US cropland, a 30-year low.
