page:
  h1: Irrigated Farmland by State
  quick_answer:
  - California had 8.2 million acres of irrigated cropland in 2022, about 14.9% of the US total, the most of any state.
  - Nebraska ranked second at 8 million acres, about 14.5% of the US total, less than 3% behind California.
  - Arkansas has held the third-most irrigated acres since 2012, overtaking Texas, whose irrigated cropland fell by nearly 2 million acres between 1997 and 2022 while Arkansas gained more than 1 million.
  methodology: Irrigated cropland figures are from the 2022 Census of Agriculture, conducted every five years by USDA NASS. US total irrigated cropland was just under 55 million acres in 2022, about 18% of all US cropland. Exact acreage for states outside the top two was not published in the source material used, so only California and Nebraska appear with figures; Arkansas and Texas are discussed by rank only.
  sources:
