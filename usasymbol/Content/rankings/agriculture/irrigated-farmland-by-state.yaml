sections:
- id: how-arkansas-overtook-texas
  icon: fa-solid fa-water
  title: How Arkansas Overtook Texas in Irrigated Acreage
  paragraphs:
  - Arkansas has ranked third in irrigated cropland since 2012, a position it took from Texas. Between 1997 and 2022, Arkansas added more than 1 million irrigated acres, driven largely by rice and soybean production, while Texas's irrigated cropland fell by nearly 2 million acres over the same period.
  - California and Nebraska remain far ahead of both states, together holding about 29% of the nation's 55 million irrigated acres in 2022, even as total US irrigated cropland reached a 30-year low.
