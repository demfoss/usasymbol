faq:
- question: Which state produces the most wheat?
  answer: Kansas produces the most wheat at 346,800,000 bushels a year, about 17% of the 36-state total.
- question: Which state produces the least wheat?
  answer: Wyoming produces the least among the tracked states at 2,670,000 bushels, just below Mississippi's 2,700,000 bushels.
- question: Which state ranks second in wheat production?
  answer: North Dakota ranks second at 334,055,000 bushels, close behind Kansas at 346,800,000 bushels.
- question: How many states are tracked for wheat production?
  answer: USDA NASS tracks 36 states for commercial wheat production, totaling 1,984,537,000 bushels a year.
- question: How much wheat does Texas produce?
  answer: Texas produces 85,100,000 bushels of wheat a year, ranking seventh among the 36 tracked states.
