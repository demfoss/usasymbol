faq:
  - question: "Which state produces the most peanuts?"
    answer: "Georgia produces the most peanuts at 3.66 billion pounds, 49.46% of the total across the leading producing states."

  - question: "Which state ranks second in peanut production?"
    answer: "Texas ranks second at 822.4 million pounds, well below Georgia but ahead of Florida's 634.6 million pounds."

  - question: "Are Florida and Alabama peanut production close?"
    answer: "Yes. Florida grows 634.6 million pounds and Alabama grows 633.6 million pounds, a difference of just 1 million pounds."

  - question: "Which state has the smallest peanut crop among top producers?"
    answer: "Mississippi has the smallest crop among the eleven leading peanut states at 80 million pounds."

  - question: "How many states grow peanuts commercially?"
    answer: "Eleven states report measurable peanut production, led by Georgia, Texas, Florida, Alabama, and North Carolina."

