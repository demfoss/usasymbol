sections:
- id: why-california-ranks-second-in-rice-production
  icon: fa-solid fa-water
  title: Why California Ranks Second in Rice Production
  paragraphs:
  - California produced 44,785,000 cwt of rice in 2024, well ahead of Louisiana's 31,928,000 cwt, even though California sits outside the traditional Rice Belt of Arkansas, Louisiana, Mississippi, and Texas. California's rice industry is centered in the Sacramento Valley, a separate growing region from the Mississippi Delta and Gulf Coast states that make up the belt.
