page:
  h1: Rice Production by State
  quick_answer:
  - Arkansas produced the most rice in the country in 2024 at 93,200,000 cwt, 44.64% of the 208,800,000 cwt national total.
  - Texas produced the least among the six rice-producing states, at 10,640,000 cwt, just behind Mississippi's 12,000,000 cwt.
  - California ranks second at 44,785,000 cwt, 21.45% of the national total, ahead of Louisiana's 31,928,000 cwt.
  methodology: 'Production figures are 2024 crop-year cwt (hundredweight) from USDA NASS. Six states publish state-level rice production data: Arkansas, California, Louisiana, Mississippi, Missouri, and Texas.'
