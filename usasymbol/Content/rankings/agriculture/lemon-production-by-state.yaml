sections:
- id: why-california-grows-nearly-all-us-lemons
  icon: fa-solid fa-lemon
  title: Why California Grows Nearly All US Lemons
  paragraphs:
  - California produces 1,000,000 tons of lemons, about 93% of the three-state total of 1,078,000 tons, a share tied to the state's Mediterranean-climate citrus belt along the coast and interior valleys. Arizona (46,000 tons) and Florida (32,000 tons) make up the rest of US commercial production.
faq:
- question: Which state produces the most lemons?
  answer: California produces the most lemons at 1,000,000 tons, about 93% of the three-state total.
- question: Which state produces the least lemons?
  answer: Florida produces the least among reporting states at 32,000 tons.
- question: How many lemons does Arizona produce?
  answer: Arizona produces 46,000 tons of lemons, the second-highest total of any state.
- question: Do any states besides California, Arizona, and Florida grow lemons commercially?
  answer: No other state reports commercial lemon production in USDA citrus crop data. These three states make up the entire tracked domestic crop.
- question: Why does California produce nearly all US lemons?
  answer: California's citrus-growing regions supply about 93% of the three-state total of 1,078,000 tons, far more than Arizona's 46,000 tons or Florida's 32,000 tons.
