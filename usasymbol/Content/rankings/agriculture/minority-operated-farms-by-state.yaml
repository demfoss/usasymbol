page:
  h1: Minority-Operated Farms by State
  quick_answer:
  - Texas leads with 57,058 combined Black, Hispanic, and American Indian or Alaska Native producers in
    2022, more than double Oklahoma's 22,677.
  - Hispanic producers are the largest group nationally at 112,379, and Texas alone counts 39,907 of them,
    plus 11,511 Black producers and 5,640 American Indian or Alaska Native producers.
  - Oklahoma counts 18,211 American Indian or Alaska Native producers, the most of any state, while Mississippi's
    6,380 Black producers rank second nationally behind Texas.
  methodology: Figures combine the top-state producer counts published in USDA NASS's 2022 Census of Agriculture
    Highlights for Black, Hispanic or Latino, and American Indian/Alaska Native producers (June 2024).
    States are included only where they appear among the top states for at least one group, so totals
    reflect the highest-representation states, not a full count for all 50 states. Categories can overlap
    since Hispanic origin is tracked separately from race.
  sources:
  - name: USDA NASS. 2022 Census of Agriculture Highlights, Black Producers (ACH22-10)
    url: https://www.nass.usda.gov/Publications/Highlights/2024/Census22_HL_BlackProducers.pdf
    description: Number of Black producers nationally and top 12 states by count, plus state shares of
      total producers
  - name: USDA NASS. 2022 Census of Agriculture Highlights, Hispanic Producers (ACH22-11)
    url: https://www.nass.usda.gov/Publications/Highlights/2024/Census22_HL_HispanicProducers.pdf
    description: Number of Hispanic, Latino, or Spanish origin producers nationally and top 12 states by
      count, plus state shares of total producers
  - name: USDA NASS. 2022 Census of Agriculture Highlights, American Indian/Alaska Native Producers (ACH22-8)
    url: https://www.nass.usda.gov/Publications/Highlights/2024/Census22_HL_AmericanIndianANProducers.pdf
    description: Number of American Indian or Alaska Native producers nationally and top states by count,
      plus state shares of total producers
