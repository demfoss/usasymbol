sections:
- id: why-texas-and-oklahoma-lead-in-minority-farm-producers
  icon: fa-solid fa-users
  title: Why Texas and Oklahoma Lead in Minority Farm Producers
  paragraphs:
  - Texas's 57,058 combined producers reflect two overlapping patterns. Hispanic producers concentrate
    along the border and across the state, and Black producers in the 2022 census were concentrated primarily
    in east Texas and the Southeastern states.
  - Oklahoma's 18,211 American Indian or Alaska Native producers are the most of any state. Arizona ranks
    second at 17,087, and American Indian or Alaska Native producers there make up 59% of the state's
    total producers, the highest share nationally.
- id: states-where-minority-producers-are-the-largest-share-of-farmers
  icon: fa-solid fa-percent
  title: States Where Minority Producers Are the Largest Share of Farmers
  paragraphs:
  - New Mexico has the highest concentration of Hispanic producers relative to its farm population. They
    made up 31% of all producers there, compared with 12% in California and 10% in Texas.
  - Mississippi's Black producers accounted for 12% of the state's total producers, the highest share among
    states with large Black producer counts.
