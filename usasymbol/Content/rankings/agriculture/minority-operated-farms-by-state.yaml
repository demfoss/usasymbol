faq:
- question: Which state has the most minority farm producers?
  answer: Texas leads with 57,058 combined Black, Hispanic, and American Indian or Alaska Native producers
    in the 2022 Census of Agriculture.
- question: Which state has the most Hispanic farm producers?
  answer: Texas has 39,907 Hispanic producers, more than double California's 14,791. New Mexico ranks
    third at 11,468.
- question: Which state has the most Black farm producers?
  answer: Texas leads with 11,511 Black producers, followed by Mississippi at 6,380 and Alabama at 3,717.
- question: Which state has the most American Indian or Alaska Native producers?
  answer: Oklahoma counts 18,211, the most nationally. Arizona follows at 17,087, where they represent
    59% of the state's total producers.
- question: What percentage of farmers in New Mexico are Hispanic?
  answer: 31% of New Mexico's producers identified as Hispanic in 2022, the highest share of any state.
- question: How many minority producers were counted nationally in the 2022 Census?
  answer: USDA counted 46,738 Black producers, 112,379 Hispanic producers, and 78,316 American Indian
    or Alaska Native producers nationwide in 2022.
