faq:
  - question: "Which state has the largest average farm size?"
    answer: "Wyoming has the largest average farm size at 2,729 acres. Broad ranches and grazing operations spread across the state's open range help produce that average."
  - question: "Which state has the smallest average farm size?"
    answer: "Rhode Island has the smallest average at 56 acres per farm. It is the nation's smallest state by total area, leaving far less room for large land-based operations."
  - question: "What is the average farm size in Texas?"
    answer: "Texas averaged 544 acres per farm in 2022, ranking 12th. Its enormous farm and ranch footprint is divided among many more operations than in Wyoming."
  - question: "What is the average farm size in California?"
    answer: "California averaged 383 acres per farm, ranking 19th. Its farms range from compact high-value fruit and vegetable operations to much larger ranches and field-crop farms."
  - question: "What is the average farm size in the United States?"
    answer: "The national average was 463 acres per farm in 2022. Twenty-two states exceeded that figure, led by Wyoming, Montana, and Nevada."
