page:
  h1: "Average Farm Size by State"
  quick_answer:
    - "Wyoming had the largest average farm size at 2,729 acres in 2022, shaped by extensive ranches spread across its open rangeland."
    - "Rhode Island had the smallest average at 56 acres, fitting a state with little total land and many compact operations."
    - "Montana ranked second at 2,374 acres, while Nevada ranked third at 1,889 acres."
  methodology: "Average farm size is land in farms divided by the number of farms in the 2022 USDA NASS Census of Agriculture. The census counts operations that produced or normally would have sold at least $1,000 in agricultural products."
