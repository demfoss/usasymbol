sections:
  - id: "why-wyoming-farms-are-largest"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Wyoming Farms Are Largest"
    paragraphs:
      - "Wyoming averaged 2,729 acres per farm, the highest figure in the country. Its 26.4 million acres of pastureland show how cattle and sheep operations use broad stretches of dry western range rather than compact fields."
      - "Montana followed at 2,374 acres and New Mexico reached 1,865. Large western operations also face very different land markets from the figures in [farmland acre value by state](/rankings/agriculture/farmland-acre-value-by-state)."
  - id: "smallest-average-farm-size-states"
    icon: "fa-solid fa-seedling"
    title: "Smallest Average Farm Size States"
    paragraphs:
      - "Rhode Island averaged 56 acres per farm. Massachusetts followed at 66 acres, New Jersey at 71, and Connecticut at 74, a compact group in the densely settled Northeast."
      - "New Jersey combines small average holdings with 449,717 acres of cropland, showing that a state can support intensive agriculture without western-scale ranch acreage."
  - id: "average-farm-size-in-the-west"
    icon: "fa-solid fa-tractor"
    title: "Average Farm Size in the West"
    paragraphs:
      - "Nevada averaged 1,889 acres per farm even though it reported only 653,891 acres of cropland. The contrast points to grazing land, and the related [cattle ranching by state](/rankings/agriculture/cattle-ranching-by-state) page shows the livestock side of that landscape."
