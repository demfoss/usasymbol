sections:
- id: states-where-raw-milk-retail-sales-are-legal
  icon: fa-solid fa-check
  title: States Where Raw Milk Retail Sales Are Legal
  paragraphs:
  - '11 states allow retail raw milk sales without added licensing conditions: California, Connecticut, Maine, Nevada, New Hampshire, New Mexico, Pennsylvania, South Carolina, Utah, West Virginia, and Wyoming. 5 more, Alaska, Arizona, Idaho, Oregon, and Washington, allow it only under restrictions such as registration, licensing, or limits to goat and sheep milk.'
- id: states-where-on-farm-raw-milk-sales-are-legal
  icon: fa-solid fa-tractor
  title: States Where On-Farm Raw Milk Sales Are Legal
  paragraphs:
  - On-farm sales are legal in more states than retail sales. Iowa, Missouri, Montana, North Dakota, Oklahoma, and Texas all ban retail raw milk sales but allow producers to sell directly to consumers at the farm.
faq:
- question: Which states allow raw milk retail sales?
  answer: '11 states allow retail raw milk sales without special restrictions: California, Connecticut, Maine, Nevada, New Hampshire, New Mexico, Pennsylvania, South Carolina, Utah, West Virginia, and Wyoming.'
- question: Is raw milk illegal in most states?
  answer: Retail raw milk sales are illegal in 34 states. Many of those states still allow on-farm sales directly from the producer.
- question: Can you buy raw milk on a farm in Texas?
  answer: Yes. Texas bans retail raw milk sales, but on-farm sales directly from the producer are legal.
- question: Is raw milk legal in California?
  answer: Yes. California is one of 11 states where both retail and on-farm raw milk sales are legal without added restrictions.
- question: Which states restrict raw milk sales to certain conditions?
  answer: '5 states allow retail raw milk sales only under added conditions: Alaska and Idaho require licensing or registration, Arizona and Washington require regulatory compliance, and Oregon limits retail sales to goat and sheep milk.'
- question: Is raw milk legal in New York?
  answer: Retail raw milk sales are illegal in New York, but on-farm sales are legal for producers who hold a state license.
