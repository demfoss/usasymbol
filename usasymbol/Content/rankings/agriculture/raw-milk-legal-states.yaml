  description: Retail raw milk sales are legal in 11 states, restricted in 5 more, and illegal in 34 states. On-farm sales are legal in more states than retail.
page:
  h1: Raw Milk Legal States
  quick_answer:
  - 'Retail raw milk sales are legal without special licensing in 11 states: California, Connecticut, Maine, Nevada, New Hampshire, New Mexico, Pennsylvania, South Carolina, Utah, West Virginia, and Wyoming.'
  - '5 states allow retail raw milk sales only under added restrictions, such as licensing, registration, or species limits: Alaska, Arizona, Idaho, Oregon, and Washington.'
  - 34 states ban retail raw milk sales outright, though many of those, including Iowa, Missouri, and Texas, still allow on-farm sales directly from the producer.
  methodology: Legal status reflects state statutes on record as compiled by the Farm-to-Consumer Legal Defense Fund. Raw milk law changes frequently; confirm current rules with state agencies before relying on this page. This page is for informational purposes only and does not constitute legal advice.
