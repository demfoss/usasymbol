  icon: fa-solid fa-seedling
  title: Why California Grows Nearly All US Lima Beans
  paragraphs:
  - California produces 106,000 hundredweight of dry lima beans, and USDA's QuickStats database shows no other state with tracked commercial lima bean acreage. The crop is grown mainly in the state's central coastal valleys, where the cool, foggy summers suit lima bean pod development.
faq:
- question: Which state produces the most lima beans?
  answer: California is the only state with commercial dry lima bean production, at 106,000 hundredweight.
- question: Do any other states grow lima beans commercially?
  answer: No other state reports commercial dry lima bean acreage in USDA production data.
- question: How many lima beans does California produce?
  answer: California produces 106,000 hundredweight of dry lima beans.
- question: What year is California's lima bean production figure from?
  answer: California's 106,000 CWT total reflects 2023 USDA QuickStats data, the most recent year with published dry lima bean acreage.
