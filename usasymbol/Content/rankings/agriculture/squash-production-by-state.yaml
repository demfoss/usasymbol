faq:
  - question: "Which state produces the most squash?"
    answer: "California produces the most squash at 1,527,500 CWT, narrowly ahead of Michigan's 1,512,000 CWT."

  - question: "Which state produces the least squash?"
    answer: "North Carolina produces the least among the eight ranked states at 270,000 CWT."

  - question: "How much squash does Michigan produce?"
    answer: "Michigan produces 1,512,000 CWT of squash, just 15,500 CWT behind top-ranked California."

  - question: "How many states grow squash commercially?"
    answer: "Eight states report individual squash production figures: California, Michigan, Florida, Georgia, New York, Oregon, New Jersey, and North Carolina."

  - question: "What is total US squash production?"
    answer: "The eight ranked states produced roughly 6,388,000 CWT of squash combined, close to the reported national total of 6,400,000 CWT."

