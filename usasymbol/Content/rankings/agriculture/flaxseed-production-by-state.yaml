faq:
  - question: "Which state produces the most flaxseed?"
    answer: "North Dakota produces the most flaxseed at 2,070,000 bushels in 2024, 85.5% of the U.S. crop."

  - question: "Which states grow flaxseed commercially?"
    answer: "Only North Dakota and Montana report commercial flaxseed production in the United States."

  - question: "How much flaxseed does Montana produce?"
    answer: "Montana produced 350,000 bushels of flaxseed in 2024, down from 798,000 bushels in 2023."

  - question: "How many total bushels of flaxseed does the U.S. produce?"
    answer: "North Dakota and Montana combined produced 2,420,000 bushels of flaxseed in 2024."

