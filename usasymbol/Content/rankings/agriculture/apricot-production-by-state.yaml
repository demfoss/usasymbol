faq:
- question: Which states produce apricots commercially?
  answer: USDA tracks commercial apricot production in only two states, California and Washington. Together
    they produced 37,880 tons of utilized apricots in 2025.
- question: Which state produces the most apricots?
  answer: California produces the most apricots at 33,630 tons of utilized production in 2025, 88.8% of
    the national total.
- question: How many apricots does Washington produce?
  answer: Washington produced 4,250 tons of utilized apricots in 2025, up sharply from 1,000 tons in 2024.
- question: Which state has the higher apricot yield per acre?
  answer: Washington edges out California on yield, 6.85 tons per acre versus 6.80 tons per acre, despite
    having far fewer bearing acres.
- question: What is the price of apricots per ton?
  answer: Washington apricots sold for $1,750 per ton in 2025. California apricots sold for $1,380 per
    ton, and the national average was $1,420 per ton.
- question: How much is the US apricot crop worth?
  answer: The national apricot crop was worth $53.8 million in 2025. California's share was $46.3 million,
    and Washington's was $7.4 million.
