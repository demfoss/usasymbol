sections:
- id: why-california-grows-the-most-apricots
  icon: fa-solid fa-tree
  title: Why California Grows the Most Apricots
  paragraphs:
  - California has 5,000 bearing acres of apricot trees, more than eight times Washington's 620 acres.
    That acreage gap is the main driver behind California's 33,630 tons of utilized production in 2025,
    compared with Washington's 4,250 tons.
  - The two states combined for 37,880 tons of utilized apricot production nationally in 2025, up 19%
    from 31,870 tons in 2024. California alone accounted for 33,630 of those tons.
- id: apricot-prices-by-state
  icon: fa-solid fa-tag
  title: Apricot Prices by State
  paragraphs:
  - Washington apricots brought $1,750 per ton in 2025, ahead of California's $1,380 per ton and the national
    average of $1,420. Washington's smaller crop also edged out California on yield, at 6.85 tons per
    acre versus 6.80.
  - California's much larger volume still produced the bigger payday. The state's crop was worth $46.3
    million in 2025, compared with $7.4 million for Washington.
