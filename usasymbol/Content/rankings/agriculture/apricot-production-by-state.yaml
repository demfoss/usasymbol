page:
  h1: Apricot Production by State
  quick_answer:
  - California produces the most apricots in the country, with 33,630 tons of utilized production in 2025,
    more than eight times Washington's 4,250 tons.
  - Washington's apricot trees yield 6.85 tons per acre, slightly ahead of California's 6.80 tons per
    acre, despite California having 5,000 bearing acres to Washington's 620.
  - Washington apricots sold for $1,750 per ton in 2025, well above California's $1,380 per ton, though
    California's total crop value of $46.3 million dwarfs Washington's $7.4 million.
  methodology: Bearing acreage, yield, production, and price figures are from the USDA NASS Noncitrus
    Fruits and Nuts 2025 Summary (May 2026), the only two states with published apricot data. Figures
    reflect the 2025 crop year.
