  title: Why Hawaii Grows the Entire US Macadamia Crop
  paragraphs:
  - Hawaii harvests about 37 million pounds of macadamia nuts a year, and no other state reports commercial macadamia acreage in USDA statistics. The tree requires a tropical climate free of frost, conditions found in the United States only on Hawaii's volcanic soil.
faq:
- question: Which state produces the most macadamia nuts?
  answer: Hawaii is the only state with commercial macadamia nut production, harvesting about 37 million pounds a year.
- question: Do any other states grow macadamia nuts commercially?
  answer: No other state reports commercial macadamia acreage in USDA production data.
- question: How many macadamia nuts does Hawaii produce?
  answer: Hawaii produces about 37 million pounds of macadamia nuts annually.
- question: What year is Hawaii's macadamia nut production figure from?
  answer: Hawaii's 37-million-pound total reflects 2023 data from USDA and the Hawaii Department of Agriculture.
