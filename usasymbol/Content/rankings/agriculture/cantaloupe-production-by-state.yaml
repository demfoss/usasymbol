faq:
- question: Which state produces the most cantaloupe?
  answer: California produces the most cantaloupe, and it is the only state with reportable commercial
    production at 7.1 million CWT in 2025.
- question: Do other states grow cantaloupe commercially?
  answer: USDA NASS does not report commercial cantaloupe production for any state besides California.
- question: What is the total US cantaloupe production?
  answer: The United States produced 7.1 million CWT of cantaloupe in 2025, all of it from California.
- question: How much cantaloupe acreage does California have?
  answer: USDA NASS tracks California as the sole commercial cantaloupe-producing state, with production
    of 7.1 million CWT in 2025.
