sections:
  - id: "why-california-has-the-most-milk-cows"
    icon: "fa-solid fa-cow"
    title: "Why California Has the Most Milk Cows"
    paragraphs:
      - "California leads with 1,712,000 milk cows because large Central Valley dairies sit close to alfalfa, corn silage, processing plants, and major consumer markets. A mild climate also avoids the long winters that once constrained year-round dairying farther north."
      - "Tennessee has 22,000 milk cows, the smallest separately published herd. The state's dairy sector has contracted while beef cattle and poultry occupy much more of its livestock economy."
  - id: "states-with-large-dairy-herds"
    icon: "fa-solid fa-chart-column"
    title: "States With Large Dairy Herds"
    paragraphs:
      - "Wisconsin's 1,273,000 cows make it the only state besides California above one million. Its large herd supplies a processing network centered on cheese, while [butter production](/rankings/agriculture/butter-production-by-state) uses another major stream of milkfat."
      - "Idaho and Texas follow with 714,000 and 696,000 cows. Both have relatively few licensed dairies compared with Wisconsin, evidence that their production is organized around larger herds."
