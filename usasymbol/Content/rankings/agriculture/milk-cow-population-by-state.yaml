faq:
  - question: "Which state has the most milk cows?"
    answer: "California has the largest published milk-cow population at 1,712,000 in 2025. Wisconsin ranks second with 1,273,000."
  - question: "How many milk cows are in Wisconsin?"
    answer: "Wisconsin averaged 1,273,000 milk cows during 2025, the second-largest state herd."
  - question: "Does Idaho or Texas have more dairy cows?"
    answer: "Idaho has slightly more, with 714,000 milk cows compared with Texas at 696,000."
  - question: "Which published state has the fewest milk cows?"
    answer: "Tennessee has the smallest separately published 2025 total at 22,000 milk cows."
  - question: "Are heifers included in the milk cow count?"
    answer: "The count includes cows in the milk herd, including dry cows, but excludes heifers that have not yet calved."
