faq:
  - question: "Which state produces the most cherries?"
    answer: "Washington produces the most cherries at 260,000 tons, 67.89% of the four-state total."

  - question: "Which state produces the least cherries?"
    answer: "Michigan has the smallest total tonnage at 14,000 tons, though it leads the country in tart cherry production at about 110 million pounds."

  - question: "How many cherries does California produce?"
    answer: "California produces 61,000 tons of cherries, the second-highest total, 15.93% of the tracked amount."

  - question: "Why does Michigan lead in tart cherries but rank last in total cherry production?"
    answer: "Michigan's 14,000 tons is mostly tart cherries, a smaller category by volume than sweet cherries. Washington, California, and Oregon grow mostly sweet cherries, which pushes their total tonnage higher."

  - question: "What is cherry production in Oregon?"
    answer: "Oregon produces 48,000 tons of cherries, ranking third, just behind California's 61,000 tons."

