faq:
- question: Which state produces the most hazelnuts?
  answer: Oregon produces the most hazelnuts, and is the only state with a commercial total tracked by
    USDA NASS, at 121,500 tons a year.
- question: Do any other states grow hazelnuts commercially?
  answer: No other state reports a commercial hazelnut crop to USDA NASS. Oregon's 121,500 tons is the
    entire national total.
- question: Where in Oregon are hazelnuts grown?
  answer: Oregon's hazelnut orchards are concentrated in the Willamette Valley, where the climate suits
    the crop.
- question: What year is Oregon's hazelnut production figure from?
  answer: Oregon's 121,500-ton total reflects 2025 USDA NASS noncitrus fruit and nut data, measured as
    utilized production.
