sections:
- id: why-california-grows-all-the-us-kiwi-crop
  icon: fa-solid fa-seedling
  title: Why California Grows Nearly All US Kiwi
  paragraphs:
  - California produces roughly 40,600 tons of kiwifruit a year, and no other state reports commercial kiwifruit acreage in USDA production statistics. The crop requires a long frost-free growing season and well-drained soil, conditions concentrated in California's Central Valley growing regions.
faq:
- question: Which state produces the most kiwi?
  answer: California is the only state with commercial kiwifruit production, at roughly 40,600 tons a year.
- question: Do any other states grow kiwifruit commercially?
  answer: No other state reports commercial kiwifruit acreage in USDA production data. California accounts for the entire tracked domestic crop.
- question: How much kiwifruit does California produce?
  answer: California produces approximately 40,600 tons of kiwifruit annually.
- question: How is California's kiwifruit production measured?
  answer: The 40,600-ton figure is annual utilized kiwifruit production, the measure USDA uses in its noncitrus fruit statistics.
