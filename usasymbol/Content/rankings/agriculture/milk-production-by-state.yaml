faq:
  - question: "Which state produces the most milk?"
    answer: "California produces the most milk in the country at 3,458,000,000 pounds, 18.41% of the total in the table."

  - question: "Which state produces the least milk?"
    answer: "Virginia produces the least among the 24 major dairy states at 117,000,000 pounds."

  - question: "How much milk does Wisconsin produce?"
    answer: "Wisconsin produces 2,737,000,000 pounds of milk, ranking second behind California."

  - question: "Which states tie for milk production?"
    answer: "South Dakota and Washington tie at 470,000,000 pounds each, the only tie in the table."

  - question: "How does Texas compare to Idaho in milk production?"
    answer: "Texas produces 1,555,000,000 pounds, just 25,000,000 pounds ahead of Idaho's 1,530,000,000 pounds."

