faq:
  - question: "Which state produces the most cotton?"
    answer: "Texas produces the most cotton at 5,230,000 bales, 39.62% of the national total."

  - question: "Which state produces the least cotton?"
    answer: "New Mexico has the smallest total in the table at 50,000 bales."

  - question: "How much cotton does Georgia produce?"
    answer: "Georgia produces 1,550,000 bales of cotton, the second-highest total, 11.74% of the national total."

  - question: "Is Texas the top cotton-producing state?"
    answer: "Texas is the top cotton producer at 5,230,000 bales, more than three times Georgia's 1,550,000 bales."

  - question: "How does Arkansas's cotton production compare to Mississippi's?"
    answer: "Arkansas produces 1,350,000 bales, 600,000 more than Mississippi's 750,000 bales."

