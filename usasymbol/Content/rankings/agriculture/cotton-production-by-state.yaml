page:
  h1: "Cotton Production by State"

  quick_answer:
    - "Texas produces the most cotton of any state at 5,230,000 bales, 39.62% of the national total and more than three times second-place Georgia's 1,550,000 bales."
    - "Arkansas ranks third at 1,350,000 bales, ahead of Missouri's 995,000 and Mississippi's 750,000."
    - "New Mexico has the smallest total in the table at 50,000 bales, about 105 times fewer than top-ranked Texas."

  methodology: "Cotton production figures are 480-pound bales on record with USDA, measured annually as of May 1, covering the 17 states with published state-level totals."

