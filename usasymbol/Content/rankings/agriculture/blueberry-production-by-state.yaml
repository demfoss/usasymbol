page:
  h1: Blueberry Production by State
  quick_answer:
  - Washington produces the most blueberries in the country at 68,750 tons, just ahead of Oregon's 64,500
    tons.
  - Only eight states report commercial blueberry production, and together they account for the entire
    US total of 324,000 tons.
  - Florida grows the fewest blueberries among the tracked states at 11,150 tons, less than a sixth of
    Washington's output.
  methodology: Production figures are 2023 data on record with USDA NASS. Only states with reportable
    commercial blueberry acreage are included; the eight states in the table make up the full US total.
  sources:
