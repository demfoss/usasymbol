faq:
- question: Which state produces the most blueberries?
  answer: Washington produces the most blueberries at 68,750 tons, 21.22% of the US total.
- question: Which state produces the fewest blueberries?
  answer: Florida produces the fewest blueberries among the tracked states at 11,150 tons.
- question: How many states grow blueberries commercially?
  answer: USDA NASS reports commercial blueberry production for eight states, which together account for
    the full US total of 324,000 tons.
- question: How much blueberry production does Georgia have?
  answer: Georgia produces 50,750 tons of blueberries, 15.66% of the US total and the third-highest figure
    in the table.
- question: What is the blueberry production in Michigan?
  answer: Michigan produces 43,750 tons of blueberries, ranking fourth nationally.
