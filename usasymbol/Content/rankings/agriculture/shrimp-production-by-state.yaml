faq:
  - question: "Which state produces the most shrimp?"
    answer: "Texas landed the most shrimp of any state in 2020 at 32,246,000 pounds, 31.68% of the eight-state total."

  - question: "Which state produces the least shrimp?"
    answer: "South Carolina landed the least among the eight ranked states at 1,775,000 pounds."

  - question: "How much shrimp does Louisiana produce?"
    answer: "Louisiana landed 21,940,000 pounds of shrimp in 2020, the second-most of any state."

  - question: "How many states have a commercial shrimp fishery?"
    answer: "Eight states report commercial shrimp landings: Texas, Louisiana, Florida, Alabama, North Carolina, Mississippi, Georgia, and South Carolina."

  - question: "What is the total shrimp production in the United States?"
    answer: "The eight ranked states landed 101,781,000 pounds of shrimp in 2020 combined."

