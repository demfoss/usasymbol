    paragraphs:
      - "Texas, Louisiana, and Florida account for the top three spots, with Texas landing 32,246,000 pounds, Louisiana 21,940,000 pounds, and Florida 18,899,000 pounds. Together the three states make up 71.81% of the eight-state total."
