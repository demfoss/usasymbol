  quick_answer:
    - "Texas landed the most shrimp in the country at 32,246,000 pounds in 2020, ahead of Louisiana's 21,940,000 pounds."
    - "Eight states report commercial shrimp landings, and Florida ranks third at 18,899,000 pounds, more than triple fourth-place Alabama's 10,471,000 pounds."
    - "South Carolina landed the least among ranked states at 1,775,000 pounds, well below Georgia's 3,313,000 pounds."

  methodology: "Figures are 2020 commercial shrimp landings by state, reported in pounds. Only states with recorded commercial shrimp landings are listed; states without a commercial shrimp fishery are omitted."

