faq:
  - question: "Which state produces the most pistachios?"
    answer: "California produces the most pistachios in the country at 3.9 billion pounds, the entire national total tracked in USDA data."

  - question: "Do any other states grow pistachios commercially?"
    answer: "No other state has pistachio production large enough to appear separately in national USDA statistics. California accounts for the full 3.9 billion pound total."

  - question: "How much does California produce in pistachios?"
    answer: "California's pistachio production totals 3.9 billion pounds of utilized crop."

  - question: "Is pistachio production more concentrated than other nut crops?"
    answer: "Yes. Pistachios are grown almost entirely in California, compared with pecans, which are commercially grown across five states including Georgia, New Mexico, and Texas."

