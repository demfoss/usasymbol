faq:
  - question: "Which state produces the most hemp?"
    answer: "Kentucky produces the most hemp at 11,368,000 pounds a year, about 64% of the US total."

  - question: "Which state produces the least hemp?"
    answer: "Florida reports the smallest hemp total at 4,000 pounds among the 13 states with USDA data."

  - question: "How much hemp does California produce?"
    answer: "California produces 3,552,000 pounds of hemp a year, ranking second nationally."

  - question: "How many states report commercial hemp production?"
    answer: "USDA reports commercial hemp totals for 13 states, led by Kentucky at 11,368,000 pounds and Florida last at 4,000 pounds."

