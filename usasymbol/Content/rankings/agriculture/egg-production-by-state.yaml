faq:
  - question: "Which state produces the most eggs?"
    answer: "Iowa produces the most eggs at 1,218,400,000 dozen a year, ahead of Ohio's 997,100,000."

  - question: "Which state produces the fewest eggs?"
    answer: "Oregon produces the fewest eggs among the 25 states tracked, 39,700,000 dozen a year."

  - question: "How many eggs does Texas produce?"
    answer: "Texas produces 537,400,000 dozen eggs a year, the fifth-highest total in the country."

  - question: "What are the top five egg-producing states?"
    answer: "Iowa, Ohio, Indiana, Pennsylvania, and Texas are the five leading egg-producing states."

  - question: "How much more does Iowa produce than Ohio?"
    answer: "Iowa's 1,218,400,000 dozen eggs is 221,300,000 dozen more than Ohio's 997,100,000."

