page:
  h1: "Egg Production by State"

  quick_answer:
    - "Iowa produces the most eggs in the country at 1,218,400,000 dozen a year, ahead of Ohio's 997,100,000 and Indiana's 924,500,000."
    - "Iowa, Ohio, Indiana, Pennsylvania, and Texas are the five leading egg-producing states, together accounting for the largest share of the U.S. total."
    - "Oregon produces the least among the 25 states tracked at 39,700,000 dozen, less than 4% of Iowa's total."

  methodology: "Figures reflect annual table egg production in dozens by state, as reported by the USDA National Agricultural Statistics Service. Only states with tracked commercial egg production are included."

