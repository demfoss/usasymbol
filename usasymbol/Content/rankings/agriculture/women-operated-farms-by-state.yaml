faq:
- question: Which state has the highest percentage of female farmers?
  answer: Arizona has the highest share of female farm producers at 47.9%, ahead of Alaska's 47.6% and New
    Hampshire's 44.8%.
- question: Which state has the most female farmers by number?
  answer: Texas has the most female producers by count, with over 143,000, even though its 39.0% share ranks
    below several smaller states.
- question: What percentage of US farmers are women?
  answer: Women made up 36.3% of the 3.4 million total US farm producers in 2022, or 1,224,726 female producers.
- question: How does Washington rank for female farmers?
  answer: Washington ranked 10th nationally with 42.1% of its producers being women, above the 36.3% national
    average.
- question: Has the share of female farmers changed since 2017?
  answer: Nationally, the number of female producers declined slightly from 1,227,461 in 2017 to 1,224,726
    in 2022, and the share fell from 38% to 36.3%.
