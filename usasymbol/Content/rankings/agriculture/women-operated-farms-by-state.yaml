page:
  h1: Women-Operated Farms by State
  quick_answer:
  - Arizona had the highest share of female farm producers of any state in 2022 at 47.9%, well above the
    national rate of 36.3%.
  - Alaska followed closely at 47.6%, and New Hampshire ranked third at 44.8%, both far above the national
    average.
  - Texas had the most female producers by raw count at over 143,000, though that share represented a decline
    from more than 156,000 five years earlier.
  methodology: Figures are from USDA NASS's 2022 Census of Agriculture. Percentages measure female producers
    as a share of all producers in each state; Texas's count reflects total female producers regardless
    of percentage share.
  sources:
  - name: USDA NASS. 2022 Census of Agriculture, Top States Female Producers
    url: https://www.nass.usda.gov/Publications/Highlights/2024/Census22_HL_FemaleProducers.pdf
