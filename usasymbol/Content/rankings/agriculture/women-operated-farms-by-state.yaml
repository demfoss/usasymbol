sections:
- id: percent-vs-count-of-female-farmers-by-state
  icon: fa-solid fa-chart-bar
  title: Percent vs Count of Female Farmers by State
  paragraphs:
  - Arizona's 47.9% female producer share outpaces every state, yet Texas has far more female producers
    in raw numbers, over 143,000, because Texas has a much larger farm population overall. Texas's female
    producer share of 39.0% still ranks well above the 36.3% national average.
  - Western and Northeastern states dominate the percentage rankings. Alaska, New Hampshire, Oregon, Maine,
    Rhode Island, Nevada, and Washington all posted shares above 42%, well ahead of the national figure.
