page:
  h1: "Pastureland by State"
  quick_answer:
    - "Texas had the most pastureland in 2022 at 95,834,659 acres, supported by its huge ranching regions and year-round livestock industry."
    - "Rhode Island had the least pastureland at 7,393 acres, reflecting its small size and limited open agricultural land."
    - "Montana ranked second with 40,562,589 acres, followed by New Mexico with 36,475,978."
  methodology: "Pastureland acres are the all-types pasture measure in the 2022 USDA NASS Census of Agriculture. It combines permanent pasture and rangeland with woodland and cropland used for grazing."
