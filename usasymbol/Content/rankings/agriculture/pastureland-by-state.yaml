faq:
  - question: "Which state has the most pastureland?"
    answer: "Texas has the most pastureland at 95,834,659 acres. Its size and long ranching tradition support grazing across several large ecological regions."
  - question: "Which state has the least pastureland?"
    answer: "Rhode Island has the least pastureland at 7,393 acres. The state has little total land and limited space for large grazing operations."
  - question: "How much pastureland does Montana have?"
    answer: "Montana had 40,562,589 pastureland acres in 2022, ranking second. Open range and large cattle and sheep operations shape much of its agricultural land use."
  - question: "How much pastureland does Wyoming have?"
    answer: "Wyoming had 26,446,357 pastureland acres, ranking fourth. That large grazing base helps support the country's biggest average farm size."
  - question: "What counts as pastureland?"
    answer: "Pastureland includes permanent pasture and rangeland, woodland used for grazing, and cropland pastured by livestock. The combined measure captures more than planted grass fields alone."
