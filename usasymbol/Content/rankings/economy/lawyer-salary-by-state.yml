seo:
  title: "Lawyer Salary by State | Map & Pay"
  description: "Employed lawyers average $230,040 in California and $108,930 in Mississippi. California also leads after household prices."
page:
  h1: "Lawyer Salary by State"
  quick_answer:
    - "Lawyer salary by state is highest in California at $230,040 annually. Higher household costs help explain a wage premium, but California remains first after prices, so expensive living does not erase its advantage."
    - "Mississippi averages $108,930, the lowest lawyer wage. Lower household prices lift its comparable buying power and improve its position slightly, yet the gap with leading states remains substantial."
    - "New Jersey moves from ninth in gross pay to 21st after prices, the largest change in position. These wages cover employed attorneys, not income from owning a firm or a self-employed practice."
  methodology: "BLS OEWS May 2025 lawyer wages and employment, SOC 23-1011, in all 50 states, excluding DC, self-employed attorneys, and owners of unincorporated firms. Adjusted pay is mean annual wage divided by BEA 2024 all-items RPP times 100."
