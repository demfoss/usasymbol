map:
  caption: "California employed lawyers average $230,040 annually, compared with $108,930 in Mississippi. New York averages $220,180 and leads in occupational concentration."
  metric_key: mean_annual
  metric_label: "Average annual employee lawyer salary"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-lawyer-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Paying States for Lawyers"
    paragraphs:
      - "California leads at $230,040, with median pay of $195,080. Higher housing and household costs give employers a reason to offer higher salaries when recruiting attorneys, but California still leads after price adjustment. The gap between its mean and median also matters, since higher-paid employee positions lift the average above the wage of the middle attorney."
      - "New York follows at $220,180, with median pay of $207,860. Legal employment combines law-firm attorneys, corporate counsel, prosecutors, public defenders, and other government lawyers whose pay markets differ. [Paralegal salaries](/rankings/economy/paralegal-salary-by-state) add the compensation of staff who support attorneys with research and case preparation."
    table:
      columns:
        rank: "Rank"
        state: "State"
        mean_annual: "Avg. Annual Salary"
        median_annual: "Median Annual Salary"
      rows:
