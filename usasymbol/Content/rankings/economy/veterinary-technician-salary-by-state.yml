map:
  title: "Veterinary Technician Pay Across the States"
  image_alt: "United States map of mean annual veterinary technician wages"
  caption: "Alaska averages $63,720 and Louisiana $35,980. California follows Alaska at $61,400, although its median is higher than Alaska's."
  metric_key: mean_annual
  metric_label: "Mean annual salary"
  name_key: state
  summary_key: mean_annual
  color_scheme: green
