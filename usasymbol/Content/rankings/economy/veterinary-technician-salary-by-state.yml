sections:
  - id: highest-vet-tech-salaries
    icon: "fa-solid fa-stethoscope"
    title: "Why Alaska Leads Veterinary Technician Pay"
    paragraphs:
      - "Alaska ranks first on mean pay at $63,720, but California's $60,630 median exceeds Alaska's $46,480. Ranking the average gives more weight to high earners than ranking the middle worker, which explains why Alaska's lead does not mean a typical technician receives the largest paycheck."
      - "Alaska's 380 jobs cover veterinary technicians and technologists. Clinic technicians assist with testing and treatment, while technologists may have research duties, bringing different responsibilities and employer settings into a small employee pool."
    table:
      columns:
        rank: "Rank"
