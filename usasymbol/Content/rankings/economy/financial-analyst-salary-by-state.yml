seo:
  title: Financial Analyst Salary by State | Map & Pay
  description: "Financial and investment analysts average $195,710 in Wyoming and $76,830 in West Virginia. New York has the most reported jobs."
page:
  h1: Financial Analyst Salary by State
  quick_answer:
    - "Financial analyst salary by state is highest in Wyoming at $195,710 annually. Its $187,090 median also leads, so the surprising result is not simply a mean inflated far above the middle wage."
    - "West Virginia averages $76,830, the lowest financial and investment analyst wage. Lower household prices soften the gap, but its $85,846 price-adjusted salary still places last."
    - "Washington moves from tenth in gross pay to 25th after living costs, the largest ranking shift. Connecticut and Nebraska have wage estimates but suppressed employment counts."
  methodology: "BLS OEWS May 2025 financial and investment analyst wages, SOC 13-2051, exclude DC and self-employed workers, with Connecticut and Nebraska employment suppressed. Adjusted pay uses BEA 2024 all-items RPP, wage divided by RPP times 100."
