sections:
  - id: highest-financial-analyst-salaries
    icon: fa-solid fa-arrow-trend-up
    title: Highest Paying States for Financial Analysts
    paragraphs:
      - "Wyoming leads at $195,710, with a median of $187,090 and only 190 financial and investment analyst jobs. A small employee pool makes the mix of employers and seniority especially influential in an average. Its high median places the middle employee's pay near the mean, showing that the leading average accompanies high pay through the center of the distribution."
      - "New York follows at $146,620 and has a far larger analyst workforce. Wall Street's investment businesses provide a concrete setting for research on securities, company finances, and investment opportunities. [Data scientist salaries](/rankings/economy/data-scientist-salary-by-state) offer an adjacent analytical career comparison, while financial analysis focuses on business and investment decisions rather than every kind of data modeling."
