seo:
  title: "Paralegal Salary by State | Map & Pay"
  description: "Paralegals average $83,740 annually in Washington and $49,500 in Mississippi. Colorado leads after living costs at $78,368."
page:
  h1: "Paralegal Salary by State"
  quick_answer:
    - "Paralegal salary by state is highest in Washington at $83,740 annually. Higher household prices help explain a wage premium, but Colorado leads in buying power after prices, showing why the largest paycheck is not always the strongest budget."
    - "Mississippi averages $49,500, the lowest paralegal wage. Its cheaper household purchases improve buying power slightly in the ranking, but do not eliminate the gap with higher-paying states."
    - "Hawaii moves from 24th in gross pay to 45th after living costs, the largest change in position. California employs the most paralegals, while Delaware has the greatest concentration within local employment."
  methodology: "BLS OEWS May 2025 wages and employment for paralegals and legal assistants, SOC 23-2011, in all 50 states, excluding DC and self-employed workers. Adjusted pay is mean annual wage divided by BEA 2024 all-items RPP times 100."
  sources:
