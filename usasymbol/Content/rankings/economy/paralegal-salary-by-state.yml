  - id: lowest-paralegal-salaries
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Paying States for Paralegals"
    paragraphs:
      - "Mississippi trails at $49,500, with median pay of $46,180. Lower household prices help explain part of its lower gross wage by reducing the expenses a paycheck must cover. Comparable buying power reaches $56,927, but the state's position improves only to 49th, so prices do not resolve the remaining gap."
      - "Mississippi employs 2,270 paralegals and legal assistants, with workplaces including law offices and government agencies. A small practice may assign work across an entire case, while a larger firm may specialize staff by task, giving the same occupation different daily responsibilities."
