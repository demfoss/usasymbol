sections:
  - id: highest-paralegal-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Paying States for Paralegals"
    paragraphs:
      - "Washington leads at $83,740, with median pay of $79,400. Higher housing and other household costs put pressure on employers to offer more when recruiting legal staff. Its move to second after price adjustment illustrates that part of the gross wage advantage compensates for expenses rather than providing equally large extra purchasing power."
      - "California follows at $81,320, with a median of $77,390. Paralegals organize documents, research legal issues, and help attorneys prepare proceedings, with work differing by practice and firm size. [Lawyer salaries](/rankings/economy/lawyer-salary-by-state) add the pay of the attorneys they support."
