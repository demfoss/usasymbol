faq:
  - question: "What state has the best purchasing power for $100?"
    answer: "Mississippi has the highest purchasing power in the United States. According to BEA 2022 Regional Price Parity data, $100 in national purchasing power is worth $116.01 in Mississippi, reflecting a price level about 14 percent below the national average. Alabama ($114.62), Oklahoma ($113.65), Arkansas ($113.40), and Kansas ($113.09) round out the top five."

  - question: "What is the value of 100 dollars by state?"
    answer: "The real value of 100 dollars ranges from $116.01 in Mississippi to $88.13 in Hawaii. The figure is calculated from the Bureau of Economic Analysis Regional Price Parity index, which compares each state's price level to the national average. A state with an RPP of 90 has prices 10 percent below average, so $100 in national purchasing power buys $111.11 there."

  - question: "Why does $100 go so far in Southern states?"
    answer: "Southern states consistently rank at the top of the purchasing power list because housing, food, and services cost significantly less than the national average. Lower population density reduces land costs, which drives down rents and home prices — the single largest component of any consumer price measure. Labor markets in these states also feature lower nominal wages, which feeds through into lower prices for locally produced goods and services."

  - question: "Why is Hawaii the most expensive state for purchasing power?"
    answer: "Hawaii's price level is the highest in the nation (RPP: 113.5) because nearly all goods must be shipped across 2,400 miles of Pacific Ocean from the mainland. The Jones Act requires that mainland-to-Hawaii cargo travel on American-flagged ships, which limits competition and raises shipping costs for fuel, food, building materials, and consumer goods. Scarce land and high tourism demand compound the effect on housing, pushing the state's overall price level well above any mainland state."

  - question: "What does Regional Price Parity (RPP) mean?"
    answer: "Regional Price Parity (RPP) is a measure published annually by the Bureau of Economic Analysis comparing each state's price level to the national average, indexed at 100. A state with an RPP of 86 has prices 14 percent below the U.S. average; an RPP of 113 means prices are 13 percent above average. The purchasing power of $100 in any state equals 10,000 divided by that state's RPP."

  - question: "Does higher purchasing power mean a better quality of life?"
    answer: "Not necessarily. States with the highest purchasing power often have the lowest nominal incomes, so the real advantage may be smaller than the index suggests. Mississippi leads on purchasing power but ranks near the bottom on median household income, educational attainment, and health outcomes. Purchasing power is one lens — it tells you how far your dollars stretch, not how many dollars you are likely to earn."

  - question: "Why is New York so low in purchasing power despite high salaries?"
    answer: "New York's RPP of 113.2 is the second-highest in the nation, driven primarily by New York City's housing costs, which inflate the statewide average. Even with above-average wages, New Yorkers spend a much higher share of income on rent and basic goods. In purchasing power terms, $100,000 in New York has the same real value as roughly $76,000 in Mississippi — the direct ratio of their RPP values (88.30 ÷ 116.01)."

  - question: "How does purchasing power by state affect remote workers?"
    answer: "Remote workers who earn a coastal salary while living in a high-purchasing-power state capture the full spread. A software engineer earning a Bay Area wage and spending in Kansas gets $113.09 worth of local purchasing power for every $100 of national average spending — Kansas's RPP is 88.4, meaning prices are nearly 12 percent below the national average. This dynamic drove significant internal migration after 2020 into low-RPP states across the South and Mountain West, until rising housing demand in those destinations began compressing the advantage."

