faq:
  - question: "Which state has the most breweries?"
    answer: "California has the most total breweries of any U.S. state. In 2023, California had 1,571 total brewing establishments by some counts. When counting only craft breweries as defined by the Brewers Association, California had 987 in 2023, well ahead of New York (539) and Pennsylvania (530)."

  - question: "Which state has the most craft breweries?"
    answer: "California has the most craft breweries with 987 in 2023, according to the Brewers Association. New York (539), Pennsylvania (530), Colorado (447), and Washington (428) round out the top five."

  - question: "What state produces the most craft beer?"
    answer: "California and Colorado are the top two craft beer producing states by volume. California leads in brewery count, while Colorado has several very large craft breweries that produce millions of barrels annually. Oregon also produces more beer per brewery than most states."

  - question: "Does California have the most breweries?"
    answer: "Yes. California has the most craft breweries of any U.S. state, with 987 in 2023 per the Brewers Association. California's large population and widespread craft beer culture across cities like San Diego, Los Angeles, and San Francisco drive this number."

  - question: "Which state has the most breweries per capita?"
    answer: "Vermont ranks first for craft breweries per capita, with 15.4 breweries per 100,000 drinking-age adults in 2024, according to the Brewers Association. Maine is second at 14.4 per 100,000. Montana (12.8), Wyoming (11.8), and Colorado (10.3) round out the top five."

  - question: "What is the difference between breweries and craft breweries?"
    answer: "A craft brewery, as defined by the Brewers Association, is small (fewer than 6 million barrels per year), independent (less than 25% owned by a non-craft beverage company), and traditional (most of its volume uses traditional brewing ingredients). Large operations like Anheuser-Busch and Coors are not craft breweries. This page counts only craft breweries."

