page:
  h1: "States With the Most Breweries"

  quick_answer:
    - "California has the most craft breweries of any U.S. state, with 987 in 2023. New York (539), Pennsylvania (530), Colorado (447), and Washington (428) round out the top five."
    - "Most breweries by total count and most breweries per capita tell different stories. California leads in total craft breweries, but Vermont and Maine rank first and second per capita. Smaller states with active craft beer cultures can rank far higher when adjusted for population."

  methodology: "Craft brewery counts and production figures are from the Brewers Association State Craft Beer Stats. State-by-state counts reflect 2023 data, the most recent year with a full state-level breakdown. Craft breweries only — large non-craft operations are not included."

