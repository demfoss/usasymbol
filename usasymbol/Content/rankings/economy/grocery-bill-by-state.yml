  quick_answer:
    - "Hawaii has the highest average weekly grocery bill per person at $157, followed by Alaska at $152 and California at $127."
    - "Oklahoma, Iowa, and Arkansas share the lowest average weekly bill at $111 per person, $46 less than Hawaii's figure."
    - "California ($127) and Washington ($126) are the only mainland states above $125 a week. Every state from Kentucky down to Oklahoma falls within a tight $5 band, between $116 and $111."

