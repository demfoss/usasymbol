faq:
  - question: "Which state has the highest average grocery bill?"
    answer: "Hawaii has the highest average weekly grocery bill per person at $157. Alaska is second at $152, and California is third at $127."

  - question: "Which state has the lowest average grocery bill?"
    answer: "Oklahoma, Iowa, and Arkansas share the lowest average weekly grocery bill at $111 per person, the cheapest figure on the list."

  - question: "Why are groceries so expensive in Hawaii and Alaska?"
    answer: "Both states top the list at $157 and $152 a week, well above every other state. The data does not break out a specific cause, but both states are geographically isolated from the mainland supply chain that serves the other 48 states."

  - question: "What is the average grocery bill in Texas?"
    answer: "Texas averages $112 a week per person, tied with Kansas and Mississippi for the fourth-lowest figure in the table."

  - question: "What is the average grocery bill in California?"
    answer: "California averages $127 a week per person, the highest figure among the 48 contiguous states, though still $30 below Hawaii's $157."

  - question: "How much do groceries cost per week in New York?"
    answer: "New York averages $121 a week per person, the 11th-highest figure and $6 above the $115 mark shared by several Midwest and Northeast states."

