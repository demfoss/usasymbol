sections:
  - id: "states-with-the-highest-grocery-bills"
    icon: "fa-solid fa-cart-shopping"
    title: "States With the Highest Grocery Bills"
    paragraphs:
      - "Hawaii's average weekly grocery bill of $157 per person is the highest in the country, $5 more than Alaska's $152. Both states sit well apart from the rest of the field. California is a distant third at $127, $25 below Hawaii."
      - "Washington ($126) and Vermont ($124) round out the top five. Outside of Hawaii and Alaska, no state tops $127 a week, showing the gap between the two outliers and the mainland is far wider than the spread among the other 48 states."

  - id: "states-with-the-lowest-grocery-bills"
    icon: "fa-solid fa-basket-shopping"
    title: "States With the Lowest Grocery Bills"
    paragraphs:
      - "Oklahoma, Iowa, and Arkansas share the lowest average weekly grocery bill at $111 per person. Kansas, Mississippi, and Texas are next at $112, and six more states, Louisiana, Missouri, North Dakota, Pennsylvania, Tennessee, and West Virginia, sit at $113."
      - "Every state below $116 a week is in the South, Midwest, or Great Plains. The lowest-cost tier runs $46 below Hawaii's $157 and $16 below the $127 mark set by California, the highest mainland state."

