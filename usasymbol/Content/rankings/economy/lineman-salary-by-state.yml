faq:
  - question: "What state pays linemen the most?"
    answer: "California pays the highest average hourly wage at $60.23. Electrical linemen work with high-voltage equipment, using insulated tools and fall protection when repairing poles and towers."
  - question: "How much does a lineman make in Texas?"
    answer: "Texas electrical linemen average $78,670 a year or $37.82 an hour. Some crews service transmission towers over long routes, while local utility workers maintain distribution equipment near customers."
  - question: "How much does a lineman make in Florida?"
    answer: "Florida linemen average $84,900 a year. After major storms, restoration crews may travel to damaged areas and work long days while repairing the network."
  - question: "How much does a lineman make in Washington?"
    answer: "Washington linemen average $122,100 a year, with a $133,060 median. A median above the mean places the middle worker above the average, rather than suggesting that a few especially high wages pull the average upward."
  - question: "How much does a lineman make in Georgia?"
    answer: "Georgia linemen average $81,890 a year or $39.37 an hour. Apprentices learn the trade through technical instruction and paid work alongside experienced crews before qualifying for independent journey-level work."
  - question: "What is the median lineman salary in Hawaii?"
    answer: "Hawaii's median electrical lineman salary is $134,340, the highest among the states. Half of the state's employed workers in this occupation earn at least that amount."
