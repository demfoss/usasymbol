page:
  h1: "Lineman Salary by State"
  quick_answer:
    - "Lineman salary by state peaks in California at $125,270 a year. High local prices and utility projects that replace poles, protect wires, and bury lines support an expensive market for skilled power-line crews."
    - "Mississippi has the lowest average at $71,580. Its low housing and everyday costs put local wage pressure well below California's, even though crews face the same high-voltage hazards."
    - "Texas employs 17,280 electrical linemen, the largest workforce. Power-line crews maintain both neighborhood distribution equipment and the transmission lines connecting distant generating plants and customers."
  methodology: "BLS OEWS May 2025 employee wages and employment for electrical power-line installers and repairers, SOC 49-9051, in all 50 states. DC, telecommunications line workers, and self-employment are excluded. Price context uses BEA 2024 RPP."
