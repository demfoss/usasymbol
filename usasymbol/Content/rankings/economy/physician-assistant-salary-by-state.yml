seo:
  title: "Physician Assistant Salary by State | Map & Pay"
  description: "Physician assistants average $169,110 in California and $106,820 in Mississippi. Iowa leads in pay adjusted for living costs."
page:
  h1: "Physician Assistant Salary by State"
  quick_answer:
    - "Physician assistant salary by state is highest in California at $169,110 a year. Expensive housing and other purchases help explain a wage premium, although local prices reduce its buying power to sixth place."
    - "Mississippi averages $106,820, the lowest physician assistant pay. Lower household prices narrow the gap, but its adjusted wage remains near the bottom rather than turning a low paycheck into a leading one."
    - "Hawaii moves from 11th in gross salary to 40th after living costs, the largest change in position. Iowa leads in purchasing power, showing why an offer's location matters alongside its advertised amount."
  methodology: "BLS OEWS May 2025 wages and employment for physician assistants, SOC 29-1071, in all 50 states, excluding DC and self-employed workers. Adjusted pay divides mean annual wages by BEA 2024 all-items RPP and multiplies by 100."
