sections:
  - id: highest-physician-assistant-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Physician Assistant Salaries"
    paragraphs:
      - "California leads at $169,110, with median pay of $165,650. Employers recruiting in expensive housing markets face workers' higher household bills, a concrete reason gross wages can run higher. California's move to sixth after price adjustment shows that part of its pay advantage compensates for costs rather than providing equally large extra purchasing power."
      - "Washington follows at $164,430, with its $164,360 median close to the mean. Physician assistants work in primary care, emergency medicine, psychiatry, and surgical teams, so an average combines different clinical jobs. Comparing [nurse practitioner pay](/rankings/economy/nurse-practitioner-salary-by-state) gives another view of advanced clinical employment, though training and job responsibilities differ."
