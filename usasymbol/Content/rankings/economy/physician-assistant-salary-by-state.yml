  - id: lowest-physician-assistant-salaries
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Physician Assistant Salaries"
    paragraphs:
      - "Mississippi trails at $106,820, with median pay of $105,920. Lower household prices help explain part of the lower wage level, lifting comparable buying power to $122,848. Even after that adjustment it ranks 49th, so living costs alone do not account for the gap with higher-paying states."
      - "Mississippi reports only 320 employed physician assistants, a relatively small workforce. A hospital surgical position and a physician's office job can offer different pay and schedules, bringing distinct employer settings into the same statewide average."
    table:
