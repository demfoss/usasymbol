faq:
  - question: "What is the largest employer in California?"
    answer: "The University of California system is California's largest employer, with 198,300 employees, the most of any state's top employer."

  - question: "Which company is the largest employer in the most states?"
    answer: "Walmart leads in 21 states, more than the 16 states where a health care system tops the list."

  - question: "What is the largest employer in New York?"
    answer: "The State University of New York system is New York's largest employer, with 90,033 employees."

  - question: "What is the largest employer in Texas?"
    answer: "Walmart is Texas's largest employer, with 168,403 employees, the biggest Walmart workforce of any state."

  - question: "What industry is most common among states' largest employers?"
    answer: "Retail, mostly through Walmart, leads 21 states. Health care systems lead 16 states, and public university systems lead 9."

  - question: "Which state has the smallest top employer?"
    answer: "Alaska's largest employer, Providence Health & Services, has 4,500 employees, the smallest of any state's top employer."

