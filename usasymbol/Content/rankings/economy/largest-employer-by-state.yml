page:
  h1: "Largest Employer by State"

  quick_answer:
    - "California has the largest state employer in the country, the University of California system, with 198,300 employees."
    - "Walmart is the largest employer in 21 states, more than any other company, including Texas (168,403 employees), Florida (107,460), and Georgia (60,002)."
    - "Health care systems lead in 16 states and public university systems lead in 9, including New York's SUNY system at 90,033 employees."

  methodology: "Largest employer and employee counts for each state come from World Population Review's 2026 ranking, which identifies each state's largest employer by in-state headcount rather than by companies merely headquartered there."

  sources:
