sections:
  - id: "states-where-walmart-is-the-top-employer"
    icon: "fa-solid fa-store"
    title: "States Where Walmart Is the Top Employer"
    paragraphs:
      - "Walmart is the largest employer in 21 states, more than any other company. Texas has the biggest Walmart workforce among them at 168,403 employees, followed by Florida at 107,460 and Georgia at 60,002."
      - "Eighteen more states list Walmart as their top employer with smaller totals, ranging from Illinois's 53,687 down to Wyoming's 4,648, the smallest Walmart workforce to lead a state."
    table:
      numbered: true
      columns:
        state: "State"
        employees: "Walmart Employees"
      rows:
        - state: "Texas"
          employees: "168,403"
        - state: "Florida"
          employees: "107,460"
        - state: "Georgia"
          employees: "60,002"
        - state: "Illinois"
          employees: "53,687"
        - state: "Arkansas"
          employees: "52,367"

  - id: "states-led-by-a-public-university-or-hospital-system"
    icon: "fa-solid fa-hospital"
    title: "States Led by a Public University or Hospital System"
    paragraphs:
      - "Public university systems are the largest employer in 9 states, led by California's University of California system at 198,300 employees, the biggest state employer overall. New York's SUNY system is next at 90,033."
      - "Health care systems lead in 16 states. Massachusetts's Partners Healthcare tops that group at 68,000 employees, while Alaska's Providence Health & Services, at 4,500, is the smallest state-leading employer of any kind."

