faq:
  - question: "Which state has the highest GDP?"
    answer: "California has the highest GDP at $4.30 trillion in 2025. Its scale comes from both its large population and a broad mix of high-value industries."
  - question: "Which state has the lowest GDP?"
    answer: "Vermont has the lowest GDP at $49.7 billion. The state has a small population and no large metropolitan market."
  - question: "What is the GDP of Texas?"
    answer: "Texas produced $2.93 trillion in current-dollar GDP in 2025, ranking second behind California. Energy is prominent, but manufacturing, technology and cross-border trade also contribute heavily."
  - question: "What is the GDP of New York?"
    answer: "New York's GDP is $2.47 trillion, third among the states. Finance and professional services centered in New York City are major parts of that output."
  - question: "How many states have a trillion-dollar economy?"
    answer: "Six states exceed $1 trillion in 2025. They are California, Texas, New York, Florida, Illinois and Pennsylvania."
  - question: "Is state GDP the same as state income?"
    answer: "No. GDP measures the value produced within a state, while income measures money received by people and businesses. Production can cross ownership and residence boundaries."

