sections:
  - id: states-with-the-highest-gdp
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest GDP"
    paragraphs:
      - "California produces $4.30 trillion, more than any other state. Nearly 40 million residents supply a huge labor and consumer base, while Silicon Valley technology, Hollywood entertainment, Pacific trade, agriculture and professional services spread production across many industries."
      - "Texas follows at $2.93 trillion with energy, manufacturing, technology and trade tied to Mexico. New York reaches $2.47 trillion, supported by finance, media, professional services and the country's largest metropolitan economy."
    table:
      columns: { rank: "Rank", state: "State", gdp: "GDP" }
      rows:
        - { rank: "1", state: "California", gdp: "$4,297.4 billion" }
        - { rank: "2", state: "Texas", gdp: "$2,932.3 billion" }
        - { rank: "3", state: "New York", gdp: "$2,465.7 billion" }
        - { rank: "4", state: "Florida", gdp: "$1,805.6 billion" }
        - { rank: "5", state: "Illinois", gdp: "$1,241.0 billion" }
  - id: states-with-the-lowest-gdp
    icon: "fa-solid fa-chart-simple"
    title: "States With the Lowest GDP"
    paragraphs:
      - "Vermont ranks 50th at $49.7 billion. Its small population and rural settlement pattern leave it with a much smaller workforce and market than the leading states, even though manufacturing, tourism, education and health care remain important locally."
      - "Wyoming ranks 49th at $52.5 billion and Alaska ranks 48th at $73.6 billion. Both have small populations and resource-heavy economies, so oil, gas and mineral production can move their totals more sharply than a diversified service sector would."
    table:
