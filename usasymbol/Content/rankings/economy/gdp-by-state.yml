page:
  h1: "GDP by State 2025"
  quick_answer:
    - "GDP by state is highest in California at $4.30 trillion in 2025, powered by its enormous population and major technology, entertainment, trade and agricultural industries."
    - "Texas ranks second at $2.93 trillion, followed by New York at $2.47 trillion. Those three states together produce a vast share of national economic output."
    - "Vermont has the smallest state GDP at $49.7 billion. Its population is the nation's second smallest, limiting the workforce and consumer market behind total output."
  methodology: "Current-dollar GDP for calendar year 2025 comes from the September 2026 annual update of BEA table SAGDP1. Values are converted from millions to billions and rounded to one decimal."
