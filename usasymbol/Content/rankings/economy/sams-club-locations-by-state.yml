sections:
  - id: states-with-most-sams-club
    title: States With the Most Sam's Club Locations
    paragraphs:
      - California's 30 clubs place it behind Texas and Florida, even though it leads the separate [Costco state ranking](/rankings/economy/costco-by-state). Warehouse retail is a format shared by competing chains, so a familiar shopping model does not imply an identical store map.
