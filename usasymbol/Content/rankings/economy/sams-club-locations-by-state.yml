faq:
  - question: How many Sam's Club locations are in Texas?
    answer: Texas has 82 clubs. Dallas-Fort Worth and Houston anchor separate metropolitan shopping areas, giving warehouse operators several large suburban markets within the same state.
  - question: How many Sam's Club locations are in Florida?
    answer: Florida lists 46 and ranks second. Orlando and the coastal cities around Tampa and South Florida form separate shopping markets along the peninsula.
  - question: Which states have no listed Sam's Club locations?
    answer: Alaska, Massachusetts, Oregon, Rhode Island, Vermont, and Washington have no listed clubs. The gaps include the Pacific Northwest, a region associated with the competing Costco chain's Washington origins.
  - question: Does Hawaii have Sam's Club?
    answer: Hawaii lists two clubs. A warehouse network on islands serves geographically separate communities, giving those clubs a different setting from mainland suburban shopping areas.
  - question: Are these live Sam's Club counts?
    answer: California's 30 clubs are reported for January 19, 2026, and the state pages were retrieved October 3. Each state's retail-unit date is the count's reference point, which can precede the retrieval date.
