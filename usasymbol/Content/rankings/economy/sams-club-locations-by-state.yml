page:
  h1: Sam's Club Locations by State
  quick_answer:
    - Sam's Club locations by state are led by Texas with 82 clubs. Multiple large metropolitan markets give the membership warehouse format room for separate regional networks.
    - Connecticut, Delaware, and Idaho each have one listed club. Compact northeastern states and a sparsely settled western state share the smallest warehouse networks.
    - California has 30 clubs and ranks third. Costco leads with California instead, giving the two membership warehouse chains different geographic centers.
  methodology: Sam's Club units use Walmart's state location facts retrieved October 3, 2026, with retail dates that can be earlier, including California's January 19, 2026 date. Territories and six unlisted states are excluded.
  sources:
    - name: Walmart US Location Facts
      url: https://corporate.walmart.com/about/location-facts/united-states
      description: Official state footprint dataset distinguishing Sam's Club units from Walmart formats.
    - name: Walmart State Location Dataset
      url: https://corporate.walmart.com/content/dam/corporate/documents/about/location-facts/locations.js
      description: State-level samsClub values from the location-facts site's public dataset, retrieved October 3, 2026.
    - name: Walmart California Location Facts
      url: https://corporate.walmart.com/about/location-facts/united-states/california
      description: State page's retail-unit date is January 19, 2026. State totals are not assumed to be a live October census.
