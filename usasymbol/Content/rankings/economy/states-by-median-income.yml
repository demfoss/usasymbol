  h1: "Median Household Income by State 2025"
  quick_answer:
    - "Maryland has the highest median household income of any U.S. state at around $98,000, driven by proximity to federal government jobs in the Washington, D.C., metro area. New Jersey, Massachusetts, and Hawaii round out the top five."
    - "Mississippi has the lowest median household income at roughly $50,000. West Virginia, Arkansas, and New Mexico cluster near the bottom. The gap between the top and bottom state is approximately $48,000 per year."
    - "The national median household income is approximately $77,540 (U.S. Census Bureau, 2023 American Community Survey). Twenty-one states fall below that threshold."
  methodology: "Figures are 2023 one-year estimates from the U.S. Census Bureau American Community Survey (ACS). Median household income represents the midpoint income for all households in the state, including wages, salaries, self-employment income, and transfer payments. All values are in nominal dollars and are not adjusted for cost of living."
