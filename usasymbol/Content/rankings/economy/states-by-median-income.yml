faq:
  - question: "Which state has the highest median household income"
    answer: "Maryland has the highest median household income in the U.S. at approximately $98,000, according to the 2023 American Community Survey. The state benefits from a large share of high-paying federal government and defense contractor jobs in the Washington, D.C., metropolitan area."
  - question: "Which state has the lowest median household income"
    answer: "Mississippi has the lowest median household income of any U.S. state at around $50,000. The state has historically ranked last or near last on this measure due to a lower cost of living paired with a lower-wage economy dominated by agriculture, manufacturing, and service industries."
  - question: "How does median household income differ from average income"
    answer: "Median household income is the midpoint value — half of households earn more and half earn less. Average (mean) income is pulled upward by very high earners at the top. The median is a better measure of what a typical household actually earns, which is why economists and policymakers prefer it."
  - question: "Does high median income mean a state is more affordable"
    answer: "Not necessarily. States like Hawaii and Massachusetts have high incomes but also very high costs of living, which erodes purchasing power. Comparing median income alongside cost-of-living indexes gives a more accurate picture of real living standards. See our states-by-cost-of-living and purchasing-power rankings."

