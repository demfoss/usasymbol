faq:
  - question: "What state pays athletic trainers the most?"
    answer: "California pays the highest mean at $80,780 a year. Its annual median is $78,490."
  - question: "How much does an athletic trainer make in California?"
    answer: "California athletic trainers average $80,780 annually, with a $78,490 median. The state employs 1,760."
  - question: "How much does an athletic trainer make in Texas?"
    answer: "Texas athletic trainers average $71,800 a year and earn a $64,150 median. Its workforce of 3,130 is the nation's largest."
  - question: "How much does an athletic trainer make in Florida?"
    answer: "Florida athletic trainers average $64,040 annually, with a $61,350 median. The state has 1,430 jobs in the occupation."
  - question: "What is the lowest athletic trainer salary by state?"
    answer: "Alabama has the lowest reported mean at $50,760 a year. Its annual median is $46,940."
  - question: "Are athletic trainers the same as personal trainers?"
    answer: "No. Athletic trainers are healthcare professionals who prevent, evaluate, and treat injuries, while fitness trainers primarily lead exercise and conditioning programs."
