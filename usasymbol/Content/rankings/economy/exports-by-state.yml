faq:
  - question: "Which state exports the most goods?"
    answer: "Texas ranks first with $450.3 billion in 2025. Energy products, chemicals, manufacturing and its connections to Mexico and Gulf shipping lanes drive the lead."
  - question: "Which state exports the fewest goods?"
    answer: "Hawaii ranks last with $395.4 million. Much of its economy produces services, and trade with the mainland does not count as international exports."
  - question: "How much does California export?"
    answer: "California exported $188.4 billion in goods in 2025, ranking second. Manufactured goods contributed $115.1 billion and re-exports another $48.9 billion."
  - question: "How much does New York export?"
    answer: "New York exported $153.1 billion, ranking third. Its $69.4 billion in re-exports nearly matched its $71.6 billion in manufactured exports."
  - question: "What are re-exports?"
    answer: "Re-exports are foreign goods sent out of the United States without substantial transformation here. Texas recorded $81.4 billion of them in 2025, the largest state amount."
  - question: "Why does Louisiana rank so high in exports?"
    answer: "Louisiana ranks fourth at $93.4 billion because lower Mississippi River and Gulf ports connect energy, chemicals, agricultural commodities and other bulk goods to overseas markets."

