page:
  h1: "Exports by State"
  quick_answer:
    - "Exports by state are highest in Texas at $450.3 billion in 2025. Energy, chemicals, manufacturing, Gulf ports and the border with Mexico make it the nation's export hub."
    - "California ranks second at $188.4 billion, followed by New York at $153.1 billion. Re-exports account for a substantial part of both totals."
    - "Hawaii ranks last with $395.4 million in goods exports. Its remote island economy depends heavily on services, while shipments to the mainland are domestic trade rather than exports."
  methodology: "Census Trade Exhibit 2 reports 2025 goods exports by origin of movement. Values include manufactured goods, nonmanufactured goods and re-exports, shown here in millions of dollars."
