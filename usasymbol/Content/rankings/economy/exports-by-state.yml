sections:
  - id: states-with-the-most-exports
    title: "States With the Most Exports"
    paragraphs:
      - "Texas exports $450.3 billion in goods, far more than any other state. Gulf Coast refineries and chemical plants, major ports, oil and gas production, extensive manufacturing and direct rail and truck routes to Mexico all feed the total."
      - "California ranks second at $188.4 billion and New York third at $153.1 billion. Both are major gateways for goods made elsewhere, which helps explain their combined $118.3 billion in re-exports."
    table:
      columns: { rank: "Rank", state: "State", exports: "2025 Exports" }
      rows:
        - { rank: "1", state: "Texas", exports: "$450.3 billion" }
        - { rank: "2", state: "California", exports: "$188.4 billion" }
        - { rank: "3", state: "New York", exports: "$153.1 billion" }
        - { rank: "4", state: "Louisiana", exports: "$93.4 billion" }
        - { rank: "5", state: "Illinois", exports: "$80.0 billion" }
  - id: states-with-the-fewest-exports
    title: "States With the Fewest Exports"
    paragraphs:
      - "Hawaii exports $395.4 million in goods, the lowest state total. Tourism and other services dominate its economy, and merchandise sent to California or another state remains domestic commerce rather than an international export."
      - "South Dakota ranks 49th at $1.85 billion, followed by Wyoming at $2.00 billion and Vermont at $2.06 billion. Their small populations limit manufacturing scale, although agricultural products, machinery and specialized manufactured goods still reach foreign buyers."
    table:
      columns: { rank: "Rank", state: "State", exports: "2025 Exports" }
      rows:
        - { rank: "50", state: "Hawaii", exports: "$395.4 million" }
