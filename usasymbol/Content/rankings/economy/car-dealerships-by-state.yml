faq:
  - question: "Which state has the most car dealerships?"
    answer: "Texas has the most, with 4,269 automobile dealer establishments. Several large metropolitan areas and many smaller regional trade centers support separate dealership markets across the state."
  - question: "Which state has the fewest car dealerships?"
    answer: "Alaska has the fewest at 73. Most of its communities are small, and many are not connected to the continental road network."
  - question: "How many car dealerships are in California?"
    answer: "California has 3,625 automobile dealer establishments and ranks second. Los Angeles, the San Francisco Bay Area, San Diego, and the Central Valley form several large vehicle markets rather than one dominant center."
  - question: "How many car dealerships are in Florida?"
    answer: "Florida has 3,427 automobile dealer establishments, the third-highest total. Its long peninsula separates major markets around Miami, Tampa Bay, Orlando, and Jacksonville."
  - question: "Are used car dealerships included?"
    answer: "Yes. The automobile dealer category covers both new and used automobile dealers, while automotive parts stores and repair businesses fall into other industry categories."
  - question: "Why are Texas car dealerships closed on Sunday?"
    answer: "Texas dealers may not sell motor vehicles on both Saturday and Sunday. A dealer chooses one of those days to close, which is why many Texas lots close on Sunday even though the state has 4,269 establishments."

