sections:
  - id: "states-with-most-car-dealerships"
    title: "States With the Most Car Dealerships"
    paragraphs:
      - "Texas leads with 4,269 establishments, while California has 3,625 and Florida has 3,427. All three contain multiple large metropolitan areas and far-reaching suburbs. Their extensive road networks also create distinct local markets for sales and service. [Gas station counts](/rankings/economy/gas-stations-by-state) show another part of the vehicle economy."
