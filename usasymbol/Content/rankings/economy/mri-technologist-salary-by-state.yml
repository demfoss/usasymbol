faq:
  - question: "What state pays MRI technologists the most?"
    answer: "California pays the highest mean at $120,560 a year and $57.96 an hour. Its $124,000 median also leads the 50-state table."
  - question: "How much does an MRI technologist make in California?"
    answer: "California MRI technologists average $120,560 annually, with a $124,000 median. The state employs 3,570, the largest workforce in the occupation."
  - question: "How much does an MRI technologist make in Texas?"
    answer: "Texas MRI technologists average $94,610 a year and $45.49 an hour. Its 2,930 jobs rank third by employment."
  - question: "How much does an MRI technologist make in Florida?"
    answer: "Florida MRI technologists average $86,110 annually and earn a median of $84,330. The state employs 2,860 workers in the occupation."
  - question: "What is the lowest MRI technologist salary by state?"
    answer: "Mississippi has the lowest mean at $71,340 a year and $34.30 an hour. Its annual median is $71,710."
  - question: "What is the difference between an MRI technologist and a radiologic technologist?"
    answer: "MRI technologists operate scanners that use magnetic fields and radio waves. Radiologic technologists commonly perform x-rays and other examinations that use ionizing radiation, so the occupations require different equipment and safety procedures."
