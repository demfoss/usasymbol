seo:
  title: "Radiologic Technologist Salary by State | Map & Pay"
  description: "Radiologic technologists average $117,950 annually in California and $59,090 in Mississippi. California also leads after living costs."
page:
  h1: "Radiologic Technologist Salary by State"
  quick_answer:
    - "Radiologic technologist salary by state is highest in California at $117,950 annually. Higher household prices help explain a wage premium, but California still leads after living costs, so expenses do not erase its advantage."
    - "Mississippi averages $59,090, the lowest radiologic technologist pay. Its cheaper household purchases lift equivalent buying power to $67,956, yet leave it last, showing that local prices explain only part of the pay gap."
    - "Florida moves from 32nd in gross pay to 48th after living costs, the largest change in position. Its substantial imaging workforce does not translate into leading wages or purchasing power."
  methodology: "BLS OEWS May 2025 wages and employment for radiologic technologists and technicians, SOC 29-2034, in all 50 states, excluding DC, self-employed workers, and MRI technologists. Adjusted pay is mean annual wage divided by BEA 2024 all-items RPP times 100."
