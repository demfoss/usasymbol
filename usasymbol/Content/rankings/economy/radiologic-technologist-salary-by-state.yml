sections:
  - id: highest-radiologic-technologist-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Radiologic Technologist Salaries"
    paragraphs:
      - "California leads at $117,950, with median pay of $121,260. Higher housing and other household costs create pressure for higher wages when employers recruit staff, but California's lead survives price adjustment. Its premium therefore exceeds what the statewide price comparison alone can explain, rather than simply reimbursing workers for an expensive address."
      - "California's $56.71 mean hourly wage combines imaging positions in hospitals, physicians' offices, diagnostic laboratories, and outpatient centers. Employer types can pay differently, and work may involve x-rays, computed tomography, or mammography. Comparing [registered nurse pay](/rankings/economy/nurse-salary-by-state) offers another healthcare benchmark without treating imaging staff and nurses as the same occupation."
