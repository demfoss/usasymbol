faq:
  - question: "What state pays radiologic technologists the most?"
    answer: "California has the highest mean hourly pay at $56.71 and median annual pay of $121,260. The median exceeds the mean, so the state's position is not simply a story about a few unusually high salaries."
  - question: "Where do radiologic technologists earn the most after cost of living?"
    answer: "California leads at $106,530 in price-adjusted annual pay. That comparison includes household prices but does not account for an individual's taxes, family size, or housing choice."
  - question: "How much does a radiologic technologist make in Texas?"
    answer: "Texas averages $78,060 a year and $37.53 an hour, ranking 27th. Median annual pay is $78,630, another useful benchmark when comparing a hospital or clinic offer."
  - question: "How much does a radiologic technologist make in Florida?"
    answer: "Florida averages $74,760 annually and $35.94 hourly. Its median of $76,750 is higher than the mean, illustrating why the average and the middle worker's wage are different measures."
  - question: "How much does a radiologic technologist make in New York?"
    answer: "New York averages $99,000 annually and $47.60 hourly, ranking fifth. Higher household prices reduce equivalent buying power to $91,734, placing it seventh after adjustment."
  - question: "Which state pays radiologic technologists the least?"
    answer: "Mississippi has the lowest mean hourly wage at $28.41. The figure includes radiologic technologists and technicians, but should not be applied to MRI technologists or radiologists, which are separate occupations."
  - question: "Is California radiologic technologist salary the same as MRI salary?"
    answer: "No. California's $117,950 average covers radiologic technologists and technicians, not MRI technologists. The broader [physical therapist salary comparison](/rankings/economy/physical-therapist-salary-by-state) likewise covers a distinct clinical occupation, so matching the job title matters before comparing pay."
