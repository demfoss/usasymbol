  - id: "states-with-the-lowest-share-of-women-owned-businesses"
    title: "Lowest Share of Women-Owned Businesses"
    paragraphs:
      - "South Dakota has the lowest share at 15.9%, with 3,586 of 22,507 employer firms. Ranches, grain farms, and construction companies shape its economy, and employer firms in those fields are mostly led by men. The state's [women-operated farms](/rankings/agriculture/women-operated-farms-by-state) are a separate count."
      - "New Hampshire (16.8%) and Delaware (17.8%) come next. Utah is the surprise at 47th with 17.9%, because its 13,705 women-owned firms are more than three times Alaska's total of 4,406 but spread across a much larger pool of 76,759 employer firms."
