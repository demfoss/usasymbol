faq:
  - question: "Which state has the highest percentage of women-owned businesses?"
    answer: "Alaska, where women own 4,406 of 16,222 employer businesses. Virginia (25.3%) and Colorado (25.2%) are next."

  - question: "Which state has the most women-owned businesses?"
    answer: "California, with 189,543 women-owned employer businesses. Florida (120,751) and Texas (107,124) rank second and third, in line with their large populations."

  - question: "What percent of businesses are women-owned in Texas?"
    answer: "Women own 22.8% of Texas employer businesses, 107,124 of 470,732. That ranks 17th, just under the U.S. figure of 22.9%."

  - question: "How many women-owned businesses are in Florida?"
    answer: "Florida has 120,751 women-owned employer businesses, the second most of any state. Its 24.1% share ties North Carolina for 5th."

  - question: "What state has the lowest share of women-owned businesses?"
    answer: "South Dakota, with women owning 3,586 of 22,507 employer firms. New Hampshire is next at 16.8%, followed by Delaware at 17.8%."

  - question: "What makes a business women-owned?"
    answer: "Women must hold a majority of the ownership, meaning more than half. The figures here cover employer firms, which have at least one paid employee besides the owner, so solo businesses are left out. Anyone planning a launch can compare the [best states to start a business](/rankings/economy/best-states-to-start-a-business)."

