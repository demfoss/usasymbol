seo:
  title: "Women-Owned Businesses by State | Map & Rankings"
  description: "Alaska has the highest share of women-owned businesses at 27.2%. South Dakota has the lowest at 15.9%. California has the most with 189,543."

page:
  h1: "Women-Owned Businesses by State"

  quick_answer:
    - "Women-owned businesses by state are most common in Alaska, where women own 27.2% of employer firms. Fishing outfits, lodges, and local services make up its small business base."
    - "South Dakota has the lowest share at 15.9%. Farms, ranches, and construction crews anchor much of its economy, fields where most employer owners are men."
    - "California counts the most, with 189,543 women-owned employer firms, yet ranks only 9th at 23.9%. Virginia is second at 25.3%, helped by federal contracting near Washington."

  methodology: "Census Bureau Annual Business Survey, 2023 reference year. Share is women-owned employer firms divided by all employer firms, with majority female ownership counted as women-owned. Kentucky's women-owned count is withheld by the Census Bureau, so its row is an approximation. It applies Kentucky's 2022 male-owned (37,305) and equally owned (7,328) shares of 61,481 employer firms to the 2023 total of 62,546, and assumes about 96% of firms are classifiable by owner sex, as in the U.S. overall. Kentucky's share and count are therefore estimates and its rank is approximate. D.C. is excluded."

  sources:
    - name: "U.S. Census Bureau, Annual Business Survey (ABS), Statistics for Employer Firms by Industry, Sex, Ethnicity, Race, and Veteran Status: 2023"
      url: "https://data.census.gov/table/ABSCS2023.AB2300CSA01"
      description: "Employer firms by sex of owners for the U.S. and each state, 2023 reference year"
    - name: "U.S. Census Bureau, Annual Business Survey program page"
      url: "https://www.census.gov/programs-surveys/abs.html"
      description: "Definitions of employer firms and sex of owners"

