sections:
  - id: "why-alaska-leads-in-women-owned-businesses"
    title: "Why Alaska Leads in Women-Owned Businesses"
    paragraphs:
      - "Women own 27.2% of Alaska's employer firms, 4,406 of 16,222. Fishing boats, lodges, clinics, and village stores dominate a small business base that sits far from big corporate payrolls, so each shop a woman opens moves the percentage."
      - "Virginia (25.3%) and Colorado (25.2%) follow. Virginia sits beside Washington, where federal law sets a goal of awarding 5% of contract dollars to women-owned small businesses, and consulting and technology firms near the capital chase that work. Colorado's Front Range adds a busy startup and outdoor-industry scene."

  - id: "states-with-the-most-women-owned-businesses"
    title: "States With the Most Women-Owned Businesses"
    paragraphs:
      - "California has 189,543 women-owned employer firms, the most of any state, followed by Florida with 120,751 and Texas with 107,124. A huge [population](/rankings/demographics/states-by-population) drives these totals, and Texas lands only 17th by share at 22.8%."
      - "Georgia (46,374) and Virginia (37,471) are the only states in the top ten by count that also rank in the top four by share. Pennsylvania (43,278) has the eighth most firms but sits 31st by share at 20.3%."
