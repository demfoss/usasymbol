page:
  h1: "Wage Growth by State 2026"
  quick_answer:
    - "Wage growth by state was fastest in New York, where the average weekly wage rose 6.5% in a year to $2,363. Wall Street bonuses are paid in the first quarter and lift the figure."
    - "Hawaii had the slowest growth at 1.7%, with Nevada next at 2.1%. Both economies lean heavily on tourism and hospitality jobs."
    - "Idaho grew 38.6% over five years, the most of any state, and Florida followed at 37.6%. Both gained large numbers of new residents. Maryland rose only 21.3%, against 28.4% nationwide."
  methodology: "BLS QCEW first quarter 2026 average weekly wage, all ownerships and industries, with the one-year change from first quarter 2025 as published. Five-year change compares first quarter 2021 and 2026 wages, calculated here. D.C. is not ranked."
