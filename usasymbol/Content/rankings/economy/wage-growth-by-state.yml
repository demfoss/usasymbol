sections:
  - id: fastest-wage-growth
    title: "States With the Fastest Wage Growth"
    paragraphs:
      - "New York leads at 6.5%, lifting its average weekly wage to $2,363, the highest of any state. Securities and banking firms pay most of their annual bonuses in the first quarter, so a strong year on Wall Street shows up directly in this measure."
      - "Idaho is second at 6.2% and Wyoming third at 5.8%, both starting from weekly wages near $1,250. Idaho has absorbed years of in-migration and a chip plant buildout in Boise, and employers there have had to bid up pay. Colorado at 5.4% and Connecticut at 5.2% complete the top five. Set these gains beside the [average salary by state](/rankings/economy/average-salary-by-state) to see which fast growers still pay below the national level."
    table:
      columns: { rank: "Rank", state: "State", growth: "1-Year Growth", wage: "Avg. Weekly Wage" }
      rows: [{ rank: 1, state: "New York", growth: "6.5%", wage: "$2,363" }, { rank: 2, state: "Idaho", growth: "6.2%", wage: "$1,254" }, { rank: 3, state: "Wyoming", growth: "5.8%", wage: "$1,287" }, { rank: 4, state: "Colorado", growth: "5.4%", wage: "$1,774" }, { rank: 5, state: "Connecticut", growth: "5.2%", wage: "$2,080" }]
  - id: wage-growth-five-years
    title: "Wage Growth Over Five Years by State"
    paragraphs:
      - "Idaho's average weekly wage rose from $905 to $1,254 since the first quarter of 2021, a 38.6% gain and the biggest in the country. Florida is next at 37.6%, South Carolina third at 35.7%, and Alaska fourth at 35.3%. Nationwide, wages rose 28.4% over the same stretch."
      - "Maryland grew the least at 21.3%, followed by California at 22.1% and New Jersey at 22.4%. All three already paid high wages in 2021, and Maryland's economy leans on federal government work, where raises follow a national schedule. For household earnings rather than job pay, see [median income by state](/rankings/economy/states-by-median-income)."
    table:
      columns: { rank: "Rank", state: "State", growth: "5-Year Growth", wage: "Avg. Weekly Wage" }
      rows: [{ rank: 1, state: "Idaho", growth: "38.6%", wage: "$1,254" }, { rank: 2, state: "Florida", growth: "37.6%", wage: "$1,518" }, { rank: 3, state: "South Carolina", growth: "35.7%", wage: "$1,296" }, { rank: 4, state: "Alaska", growth: "35.3%", wage: "$1,519" }, { rank: 5, state: "Wyoming", growth: "35.2%", wage: "$1,287" }]
  - id: slowest-wage-growth
    title: "States With the Slowest Wage Growth"
    paragraphs:
      - "Hawaii's average weekly wage rose just 1.7% to $1,387, the smallest gain of any state. Hotels, restaurants, and visitor services employ a large share of its workers, and Nevada at 2.1% has the same dependence on casinos and resorts. Raises in those jobs often follow changes in the [minimum wage by state](/rankings/economy/minimum-wage-by-state)."
    table:
      columns: { rank: "Rank", state: "State", growth: "1-Year Growth", wage: "Avg. Weekly Wage" }
      rows: [{ rank: 50, state: "Hawaii", growth: "1.7%", wage: "$1,387" }, { rank: 49, state: "Nevada", growth: "2.1%", wage: "$1,391" }, { rank: 48, state: "North Dakota", growth: "2.4%", wage: "$1,333" }, { rank: 47, state: "Maryland", growth: "2.7%", wage: "$1,676" }, { rank: 46, state: "Washington", growth: "2.7%", wage: "$1,998" }]
