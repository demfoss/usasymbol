faq:
  - { question: "Which state has the fastest wage growth?", answer: "New York, where the average weekly wage rose 6.5% to $2,363. Idaho follows at 6.2% and Wyoming at 5.8%." }
  - { question: "Which state has the slowest wage growth?", answer: "Hawaii, at 1.7% to a weekly wage of $1,387. Nevada at 2.1% and North Dakota at 2.4% are next." }
  - { question: "How fast are wages growing in Idaho?", answer: "Idaho's average weekly wage grew 6.2% in a year to $1,254, second fastest in the country. That is still well below the U.S. average of $1,654." }
  - { question: "What is the average weekly wage in California?", answer: "California averages $1,986 a week, up 2.7% in a year and ranked 44th for growth. Its five-year gain of 22.1% is the second smallest of any state." }
  - { question: "How much did wages grow nationwide?", answer: "The U.S. average weekly wage reached $1,654, up 3.9% from a year earlier. Twenty states grew faster than that, and over five years the national wage rose 28.4% from $1,288." }
  - { question: "Which state has the highest average weekly wage?", answer: "New York at $2,363, ahead of Massachusetts at $2,201 and Connecticut at $2,080." }
