faq:
  - question: What state pays speech-language pathologists the most?
    answer: "California leads in mean hourly pay at $57.02, with median annual pay of $118,970. The median is the middle employee's wage rather than the average across every salary."
  - question: Where do speech therapists earn the most after cost of living?
    answer: "Colorado leads at $113,496 in price-adjusted annual pay. Its household-price penalty is smaller than California's, moving it above the dollar-wage leader in purchasing power."
  - question: How much does a speech-language pathologist make in Texas?
    answer: "Texas averages $99,460 a year and $47.82 an hour, ranking 16th. Median annual pay is $99,910, an additional benchmark when assessing a school or medical employer's offer."
  - question: How much does a speech therapist make in Florida?
    answer: "Florida averages $96,710 annually, with median earnings of $99,990. A median above the mean shows why the statewide average need not match the middle worker's salary."
  - question: How much does a speech-language pathologist make in New York?
    answer: "New York averages $107,700 a year and $51.78 hourly, ranking fourth. Higher local expenses reduce its comparable purchasing power to $99,795."
  - question: Which state pays speech-language pathologists the least?
    answer: "South Dakota has the lowest mean hourly wage at $35.24. The occupation includes medical swallowing treatment as well as speech therapy, so the estimate is not restricted to school-based services."
  - question: How much does a speech-language pathologist make in California?
    answer: "California averages $118,600 annually and has a median wage of $118,970. Employed clinicians are included, while self-employed practice owners' business income is outside the wage estimate."
