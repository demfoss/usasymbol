sections:
  - id: highest-speech-therapist-salaries
    icon: fa-solid fa-arrow-trend-up
    title: Highest Speech Therapist Salaries
    paragraphs:
      - "California averages $118,600, with median earnings of $118,970. High local prices help explain why nominal wages can be higher, because employers recruit people facing those expenses. School districts, hospitals, and therapy offices also pay differently, so neither prices nor a single employer type fully explains the state average."
      - "Colorado follows at $116,960 but leads after living costs. Speech-language pathologists treat swallowing disorders as well as speech and communication difficulties, including problems following a stroke. The related [physical therapist salary ranking](/rankings/economy/physical-therapist-salary-by-state) covers another rehabilitation profession that can work alongside them in medical settings."
