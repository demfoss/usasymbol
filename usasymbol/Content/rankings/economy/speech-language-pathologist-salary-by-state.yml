  title: Speech-Language Pathologist Salary by State | Map & Pay
  description: "Speech-language pathologists average $118,600 in California and $73,310 in South Dakota. Colorado leads after living costs."
page:
  h1: Speech-Language Pathologist Salary by State
  quick_answer:
    - "Speech-language pathologist salary by state is highest in California at $118,600 annually. Higher household prices help explain the nominal premium, but Colorado leads after adjusting for living costs."
    - "South Dakota averages $73,310, the lowest state wage. Lower local prices narrow the gap, yet its adjusted pay still places last. Employer type also matters because school and medical jobs have different pay structures."
    - "Hawaii drops from 24th to 49th after living costs, the largest ranking shift. Its $91,660 average translates to $83,364 in comparable purchasing power."
  methodology: "BLS OEWS May 2025 speech-language pathologist estimates, SOC 29-1127, cover all 50 states and exclude DC and self-employed workers. Adjusted pay divides wages by BEA 2024 all-items RPP and multiplies by 100."
