  - id: lowest-speech-therapist-salaries
    icon: fa-solid fa-arrow-trend-down
    title: Lowest Speech Therapist Salaries
    paragraphs:
      - "South Dakota's $73,310 mean and $65,680 median put it last in annual pay. Lower household prices partly explain the smaller nominal wage, but its $82,756 adjusted salary remains last. School and medical employers also use different compensation structures and work calendars."
      - "South Dakota lists 410 speech-language pathologist jobs, covering classroom language support and medical swallowing therapy. School-based clinicians can follow an academic calendar, while hospitals operate throughout the year. [Teacher salaries](/rankings/education/teacher-salary-by-state) add the pay of another profession whose work follows the school year."
