    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Registered Nurse Salaries"
    paragraphs:
      - "South Dakota pays registered nurses the least of any state, an average of $64,500 a year ($31.01 an hour), the only state under $65,000. Arkansas is second-lowest at $66,530, and Alabama follows at $66,910."
      - "Mississippi and Iowa complete the five lowest-paying states, at $67,930 and $69,370. All five sit at least $63,000 below top-ranked California's $133,340."

