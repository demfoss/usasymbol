faq:
  - question: "Which state pays registered nurses the most?"
    answer: "California pays registered nurses the most of any state, an average of $133,340 a year ($64.10 an hour). Hawaii ranks second at $113,220, and Oregon is third at $106,610."

  - question: "Which state pays registered nurses the least?"
    answer: "South Dakota pays registered nurses the least of any state, an average of $64,500 a year ($31.01 an hour), the only state under $65,000."

  - question: "What is the average registered nurse salary in Texas?"
    answer: "Texas registered nurses earn an average of $84,320 a year ($40.54 an hour), ranking 19th among all states."

  - question: "What is the average registered nurse salary in Florida?"
    answer: "Florida registered nurses earn an average of $79,910 a year ($38.42 an hour), ranking 28th among all states, just below the roughly $83,564 average across all 50 states."

  - question: "Which states have the highest registered nurse salaries?"
    answer: "Seven states average over $100,000 a year for registered nurses: California ($133,340), Hawaii ($113,220), Oregon ($106,610), Massachusetts ($104,150), Alaska ($103,310), Washington ($101,670), and New York ($100,130)."

  - question: "What is the average registered nurse salary in the District of Columbia?"
    answer: "The District of Columbia averages $98,230 a year ($47.23 an hour) for registered nurses, which would rank 8th if it were a state. DC is not a state, so it is excluded from this table's rankings."

