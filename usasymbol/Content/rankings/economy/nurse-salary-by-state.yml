  description: "California pays registered nurses the most at $133,340 a year. South Dakota is lowest at $64,500, the only state under $65,000."

page:
  h1: "Registered Nurse Salary by State"

  quick_answer:
    - "California has the highest average registered nurse salary of any state at $133,340 a year ($64.10 an hour), well ahead of second-ranked Hawaii at $113,220."
    - "South Dakota has the lowest average registered nurse salary at $64,500 a year ($31.01 an hour), the only state under $65,000 and $68,840 less than California."
    - "Seven states average over $100,000 a year for registered nurses: California, Hawaii, Oregon, Massachusetts, Alaska, Washington, and New York, all well above the roughly $83,564 average across all 50 states."

  methodology: "Wages reflect mean annual and hourly pay for registered nurses (SOC 29-1141), current as of 2026. The District of Columbia is excluded from the table, since it is not a state."

  sources:
    - name: "World Population Review. Registered Nurse Salary by State"
      url: "https://worldpopulationreview.com/state-rankings/nurse-salary-by-state"
      description: "State-by-state average registered nurse annual salary and hourly wage, current as of 2026"

