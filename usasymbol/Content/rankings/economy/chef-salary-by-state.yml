    icon: fa-solid fa-hotel
    title: Why Chef Salaries Vary by State
    paragraphs:
      - "Rhode Island leads at $84,860 in a hospitality market that includes luxury lodging and fine dining. Upscale hotels and resort restaurants are typically among the better-paying workplaces for chefs, making Newport's kitchens a relevant part of its high wage setting."
      - "South Dakota's $47,900 average comes with housing rents and overall prices below the national level. Those lower costs help explain why its local wage market differs from expensive coastal destinations. Comparing [living costs](/rankings/economy/states-by-cost-of-living) adds the household side of that difference."
  - id: states-with-the-most-chef-jobs
    icon: fa-solid fa-kitchen-set
    title: States With the Most Chef Jobs
    paragraphs:
      - "California has 31,670 chefs and head cooks, the largest workforce. Their responsibilities include food costs, suppliers, and staff scheduling, so a chef can spend part of the day managing the kitchen before dinner service begins."
      - "Florida employs 19,670 chefs at an average of $61,720 a year. Kitchens operate through evenings, weekends, and holidays, following the hours customers choose for [restaurant meals](/rankings/food/home-cooking-vs-takeout-frequency-by-state)."
