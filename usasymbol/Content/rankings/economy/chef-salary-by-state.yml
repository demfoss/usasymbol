faq:
  - question: What state pays chefs the most?
    answer: "Rhode Island ranks first by mean annual pay. Its $79,930 median is also the highest state median, placing it first by both measures."
  - question: How much does a chef make in Hawaii?
    answer: "Hawaii's mean is $80,720 annually and $38.81 hourly. Hotel and resort kitchens provide work in a setting where chef pay is typically higher than in ordinary food-service establishments."
  - question: What is the chef salary in California?
    answer: "California's average is $69,130 a year and its median is $64,500. Chefs and head cooks manage preparation and staff, a different role from the restaurant cooks they supervise."
  - question: How much does a chef make in New York?
    answer: "New York averages $74,840 a year, with a median of $70,670. Head chefs also plan menus and coordinate the cooks who prepare them."
  - question: Which state has the lowest chef salary?
    answer: "South Dakota ranks last at $47,900 a year. Its lower housing costs also reduce the household spending that a local salary must cover."
  - question: How much does a chef make in Texas?
    answer: "Texas averages $59,350 a year and $28.53 an hour. Experienced cooks can reach a head-chef role through kitchen work, apprenticeships, or culinary training."
