  description: Chefs average $84,860 a year in Rhode Island and $47,900 in South Dakota. California employs the most chefs and head cooks.
page:
  h1: Chef Salary by State
  quick_answer:
    - "Chef salary by state is highest in Rhode Island at $84,860 a year. Its Newport resort hotels and fine dining restaurants provide the kinds of kitchens where chef pay tends to be highest."
    - "South Dakota averages $47,900, the lowest state wage. Its lower housing and household costs create a less expensive local wage environment than coastal resort markets."
    - "California employs 31,670 chefs and head cooks. Running those kitchens means planning menus, ordering ingredients, and supervising cooks as well as preparing food."
  methodology: "BLS OEWS May 2025 chefs and head cooks estimates, SOC 35-1011, ranked by mean annual wage across 50 states, excluding DC, self-employment and separately classified restaurant cooks. Price context uses BEA RPP 2024."
