    title: States With the Most PNC Bank Branches
    paragraphs:
      - Pennsylvania's 241 branches place it behind Texas, despite PNC's association with Pittsburgh. A familiar corporate home and a bank's largest branch market can diverge after acquisitions, so [U.S. Bank locations](/rankings/economy/us-bank-locations-by-state) offer a useful parallel.
