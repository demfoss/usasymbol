seo:
  title: PNC Bank Locations by State | Map & Branch Counts
  description: Texas has 310 full-service PNC Bank branches and Pennsylvania has 241. Kansas and West Virginia have one each in the October 2026 inventory.
page:
  h1: PNC Bank Locations by State
  quick_answer:
    - PNC Bank locations by state are led by Texas with 310 full-service branches. The BBVA USA acquisition brought an established Texas network into PNC's footprint.
    - Kansas and West Virginia each have one qualifying branch. Both sit outside the Texas-centered southwestern network inherited through BBVA USA.
    - Pennsylvania has 241 branches and ranks second. The bank's large southwestern network shows how acquisitions can reshape the map of a business associated with Pittsburgh.
  methodology: FDIC's October 2, 2026 location index for PNC Bank National Association, CERT 6384, retrieved October 3, includes service types 11 and 12 only. ATMs, other office types, DC, and states without qualifying records are excluded.
  sources:
    - name: FDIC PNC Bank Location Records
      url: https://banks.data.fdic.gov/api/locations?filters=CERT%3A6384&limit=10000&fields=NAME,STNAME,SERVTYPE,OFFNAME,UNINUM,ADDRESS,CITY&format=json
      description: Complete certificate 6384 location response from the October 2, 2026 index, deduplicated by UNINUM and filtered to service types 11 and 12.
    - name: FDIC Summary of Deposits Instructions
      url: https://fdic.gov/bank-financial-reports/2025-sod-instructions.pdf
      description: Definitions of full-service standalone and retail offices used for the count.
    - name: PNC 2021 Annual Report
      url: https://www.sec.gov/Archives/edgar/data/713676/000071367622000019/pnc-20211231.htm
      description: Documents the June 1, 2021 acquisition of BBVA USA and the regional bank network incorporated into PNC.
