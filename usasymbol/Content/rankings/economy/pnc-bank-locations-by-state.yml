faq:
  - question: How many PNC Bank branches are in Texas?
    answer: Texas has 310 full-service branches. Of those, 308 are standalone offices and two operate inside retail premises.
  - question: How many PNC Bank branches are in Pennsylvania?
    answer: Pennsylvania has 241 qualifying branches and ranks second. Pittsburgh is PNC's corporate home, while the BBVA USA acquisition gave it an extensive network far to the southwest.
  - question: How many PNC Bank branches are in Florida?
    answer: Florida has 197 and ranks fourth. All qualifying Florida records in this inventory are classified as standalone full-service offices.
  - question: Which states have the fewest PNC branches?
    answer: Kansas and West Virginia each have one qualifying branch, tying for the smallest listed footprint. Kansas lies on the Great Plains and West Virginia in Appalachia, showing how the bank's network crosses regions unevenly.
  - question: Are PNC ATMs counted as branches?
    answer: No. Texas's 310 qualifying locations are full-service offices, including retail-premises branches. ATMs, administrative offices, and loan-only offices are outside the ranked metric.
  - question: Which states have no qualifying PNC Bank branches?
    answer: Alaska, Arkansas, Connecticut, Hawaii, Idaho, Iowa, Louisiana, Maine, Minnesota, Mississippi, Montana, Nebraska, Nevada, New Hampshire, North Dakota, Oklahoma, Oregon, Rhode Island, South Dakota, Utah, Vermont, Washington, and Wyoming have no qualifying full-service branch. The Pacific Northwest is entirely in this group, unlike the Texas-centered southwestern network.
