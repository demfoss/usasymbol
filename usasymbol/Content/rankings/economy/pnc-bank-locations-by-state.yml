  - id: why-texas-leads-pnc
    title: Why Texas Leads PNC Bank Branches
    paragraphs:
      - Texas's 310 branches connect to PNC's acquisition of BBVA USA in 2021. BBVA's existing network included Texas and other southern and southwestern states, allowing the buyer to inherit customer-facing offices rather than start a new regional network from scratch.
      - Kansas and West Virginia each have one qualifying branch, outside the Texas-centered network inherited from BBVA USA. A bank assembled through regional acquisitions brings together existing local networks, leaving a patchwork of dense markets and thinly covered states. [Chase branch locations](/rankings/economy/chase-bank-by-state) offer a comparison with another bank built through mergers.
