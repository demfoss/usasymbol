faq:
  - question: "Which state has the highest gas prices"
    answer: "California consistently has the highest gas prices in the U.S. The state imposes the highest state gasoline excise tax in the country, requires a unique summer-blend formulation that can only be produced by a limited number of refineries, and charges an additional cap-and-trade carbon fee. These factors often push California prices 80–120 cents above the national average."
  - question: "Which state has the cheapest gas"
    answer: "Mississippi, Texas, and Oklahoma regularly record the lowest gas prices in the U.S. These states benefit from low state fuel taxes, proximity to Gulf Coast refining infrastructure, and no special blend requirements that would raise production costs."
  - question: "What drives the difference in gas prices between states"
    answer: "Four main factors explain state-level gas price differences: (1) state and local fuel taxes, which vary from under 30 cents to over 70 cents per gallon; (2) distance from refineries, which affects transportation costs; (3) special blend requirements that limit the number of refineries that can supply a state; and (4) local market competition."
  - question: "How much of the gas price is state taxes"
    answer: "State gasoline taxes range from around 14 cents per gallon in Alaska to over 70 cents per gallon in California (including all state-level fees). The federal excise tax adds 18.4 cents per gallon on top of state taxes. See our gas-tax-by-state ranking for the full breakdown."

