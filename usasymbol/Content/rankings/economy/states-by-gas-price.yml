page:
  h1: "Gas Prices by State 2025"
  quick_answer:
    - "California consistently has the highest gas prices of any U.S. state, often exceeding $4.50 per gallon for regular unleaded. High state gas taxes, unique blend requirements that limit refinery options, and limited competition among fuel distributors all contribute to California's premium."
    - "Mississippi, Texas, and Oklahoma typically have the cheapest gas in the country, often below $3.00 per gallon. These states have lower fuel taxes, proximity to Gulf Coast refineries, and no special blend requirements."
    - "The national average for regular unleaded gasoline fluctuates with crude oil prices, refinery capacity, and seasonal demand. State-level differences are largely driven by taxes, local regulations, and proximity to refineries."
  methodology: "Average retail gas prices for regular unleaded gasoline are sourced from the U.S. Energy Information Administration (EIA) and GasBuddy price tracking. Figures reflect annual averages or most recent available monthly average prices in dollars per gallon."
