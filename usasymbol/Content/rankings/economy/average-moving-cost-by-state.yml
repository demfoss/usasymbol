  description: "Vermont has the highest average moving cost at $3,917. New Mexico is lowest at $1,511, less than half as much."

page:
  h1: "Average Cost to Move by State"

  quick_answer:
    - "Vermont has the highest average cost to move a three-bedroom home in the U.S. at $3,917, ahead of Iowa ($3,816) and New Hampshire ($3,466)."
    - "New Mexico has the lowest average moving cost at $1,511, less than half of Vermont's figure. Arizona ($1,570) and Arkansas ($1,656) are the only other states under $1,700."
    - "Vermont also charges the highest hourly labor rate at $200 per mover, while New Mexico's $80 rate is the lowest of any state, a $120 gap between the two extremes."

  methodology: "Figures reflect the average cost to move a three-bedroom home locally within each state, listed for 2026 alongside average hourly labor rates per mover. Alaska and Hawaii are not listed."

  sources:
