faq:
  - question: "Which state has the highest average cost to move?"
    answer: "Vermont has the highest average cost to move a three-bedroom home at $3,917. Iowa ranks second at $3,816, and New Hampshire is third at $3,466."

  - question: "Which state has the lowest average cost to move?"
    answer: "New Mexico has the lowest average moving cost at $1,511, the only state under $1,550."

  - question: "What is the average cost to move in California?"
    answer: "California's average moving cost is $2,305, ranking 25th among the 48 states with data. Its hourly labor rate runs $122 per mover."

  - question: "What is the average cost to move in Texas?"
    answer: "Texas averages $1,987 to move a three-bedroom home, ranking 38th nationally. The hourly rate for Texas movers is $103."

  - question: "Which state has the highest hourly moving rate?"
    answer: "Vermont has the highest hourly moving rate at $200 per mover. Iowa is close behind at $199, and Illinois follows at $192."

  - question: "How much more does it cost to move in Vermont than in New Mexico?"
    answer: "Vermont's average moving cost of $3,917 is $2,406 higher than New Mexico's $1,511, more than two and a half times as much."

