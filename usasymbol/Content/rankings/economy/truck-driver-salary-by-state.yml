  description: "Truck drivers earn the most in Alaska at $69,520 a year and the least in Louisiana at $51,930. Texas has more truck driving jobs than any state."

page:
  h1: "Truck Driver Salary by State 2026"

  quick_answer:
    - "Truck driver salary by state is highest in Alaska, where heavy and tractor-trailer drivers average $69,520 a year. Long hauls up the gravel Dalton Highway to the Arctic oil fields help push pay up."
    - "Louisiana pays truck drivers the least at $51,930 a year, or $24.96 an hour. Prices there run well below the national average, so its drivers climb to 37th once living costs are counted."
    - "North Dakota leads after cost of living. Its $63,330 average is worth $71,157 at national prices, a premium shaped by the trucks that haul crude, water, and sand across the Bakken oil field."

  methodology: "Mean and median wages and employment for heavy and tractor-trailer truck drivers (SOC 53-3032), BLS OEWS May 2025 estimates. Adjusted pay divides the mean wage by the BEA 2024 all-items RPP. DC is excluded."

