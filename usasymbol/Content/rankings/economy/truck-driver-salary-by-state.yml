      - "Texas employs 209,680 truck drivers, more than any other state. Its highway network has more lane miles than any other state's, and Laredo's World Trade Bridge is the busiest truck crossing on the Mexican border. California is a close second at 205,090, with the ports of Los Angeles and Long Beach unloading more shipping containers than any other U.S. port complex."
      - "Pennsylvania, Illinois, and Ohio fill out the next spots. All three sit on the main freight corridors between the East Coast and the Midwest, and Chicago is the busiest rail freight hub in the country, where containers come off trains and onto trucks."

