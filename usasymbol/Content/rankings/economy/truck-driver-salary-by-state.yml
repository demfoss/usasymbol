sections:
  - id: "why-alaska-pays-truck-drivers-the-most"
    icon: "fa-solid fa-truck"
    title: "Why Alaska Pays Truck Drivers the Most"
    paragraphs:
      - "Alaska pays truck drivers $69,520 a year on average, and its median of $70,100 is the highest of any state too. Much of that work runs on the Dalton Highway, a 414-mile road built in 1974 to supply the Trans-Alaska Pipeline. Most of it is gravel, and it ends at the Prudhoe Bay oil fields on the Arctic Ocean."
      - "Alaska also has the fewest truck drivers of any state, just 3,420. Few roads connect its towns, and a small pool of drivers willing to haul fuel and equipment through winter darkness and ice can command higher pay. Washington follows at $68,230, with the ports of Seattle and Tacoma feeding steady freight inland."

