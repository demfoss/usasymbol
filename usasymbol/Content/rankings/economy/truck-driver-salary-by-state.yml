faq:
  - question: "How much does a truck driver make in Texas?"
    answer: "Truck drivers in Texas average $57,990 a year, or $27.88 an hour, which ranks 34th. The median is $56,290. Pay is middling, but no state has more truck driving jobs."

  - question: "How much does a truck driver make in California?"
    answer: "California truck drivers average $62,020 a year, 13th among the states. After adjusting for California's high prices, that pay is worth $56,025, which drops the state to 48th."

  - question: "What state pays truck drivers the most?"
    answer: "Alaska pays truck drivers the most at $69,520 a year. Washington is second at $68,230 and New Jersey third at $66,770, where drivers serve the Port of New York and New Jersey."

  - question: "Where do truck drivers make the most after cost of living?"
    answer: "North Dakota comes out on top, followed by Iowa at $68,417 and Wyoming at $68,155. All three pair solid wages with prices below the national average."

  - question: "What state pays truck drivers the least?"
    answer: "Louisiana pays the least at $51,930 a year. West Virginia ($52,440) and New Mexico ($53,100) are next, and all three also have below-average prices."

  - question: "How much does a truck driver make an hour?"
    answer: "Average hourly pay ranges from $33.42 in Alaska to $24.96 in Louisiana. In the largest trucking state, Texas, drivers average $27.88 an hour."

  - question: "How much does a truck driver make in Florida?"
    answer: "Florida truck drivers average $54,850 a year, 47th among the states, with a median of $50,640. Florida also has the third most truck drivers, 112,920."

