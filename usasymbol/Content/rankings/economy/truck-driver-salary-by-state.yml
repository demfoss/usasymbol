          mean_annual: "$56,370"
          mean_hourly: "$27.10"
    paragraphs:
      - "Louisiana pays truck drivers the least, $51,930 a year, and its median of $49,320 is the lowest of any state. Wages across the Deep South run below the national level, and few drivers there work under union contracts. Louisiana has been one of the [right-to-work states](/rankings/law/right-to-work-states) since 1976."
      - "Florida is the surprise on this list. Its 112,920 truck drivers rank third in the country, yet pay sits 47th at $54,850. Florida takes in far more freight than it ships out, so many trucks leave the state empty or with cheap return loads, which keeps rates down."

