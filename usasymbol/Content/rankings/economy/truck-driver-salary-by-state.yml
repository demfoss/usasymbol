    paragraphs:
      - "Arkansas makes the biggest jump once prices are counted, from 38th to 9th. Its price level is the lowest of any state, so a $57,390 average stretches to $66,041. Trucking runs deep there. J.B. Hunt is based in Lowell, and Walmart runs one of the largest private truck fleets in the country out of Bentonville."
      - "California falls the furthest, from 13th to 48th, because its prices are the highest in the nation. Florida ends up last after adjustment at $53,046. The [cost of living by state](/rankings/economy/states-by-cost-of-living) explains why the same paycheck goes so much further in the Plains."

