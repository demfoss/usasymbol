    title: "Why Diesel Mechanic Salaries Vary"
    paragraphs:
      - "Washington leads at $78,790 in a market with high living costs and public fleet maintenance work. Seattle's transit system trains mechanics to repair diesel, hybrid, and electric buses, bringing several technologies into one shop. Local government is a higher-paying employer group for diesel mechanics nationally, so this type of fleet work offers a route into better-paid jobs."
      - "West Virginia's $52,690 average sits alongside the nation's lowest housing rent price level. Cheaper housing reduces what workers need to cover each month and eases local wage pressure, a useful part of the explanation for its low cash pay. The same geography matters when comparing [purchasing power by state](/rankings/economy/purchasing-power-by-state)."
