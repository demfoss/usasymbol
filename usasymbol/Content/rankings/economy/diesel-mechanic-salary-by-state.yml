faq:
  - question: "What state pays diesel mechanics the most?"
    answer: "Washington pays the highest average hourly wage at $37.88. Mechanics there can work on bus and truck electrical systems, brakes, and transmissions as well as engines."
  - question: "How much does a diesel mechanic make in Texas?"
    answer: "Texas diesel mechanics average $60,530 a year, with a $58,810 median. Fleet repair involves preventive servicing as well as breakdowns, including checking fluid levels and inspecting safety systems before vehicles return to the road."
  - question: "How much does a diesel mechanic make in California?"
    answer: "California diesel mechanics average $72,690 a year or $34.95 an hour. Emissions diagnosis and repair form part of the job alongside traditional engine maintenance."
  - question: "How much does a diesel mechanic make in Florida?"
    answer: "Florida diesel mechanics average $62,750 a year. Some truck and bus shops extend service into evenings and weekends to keep commercial fleets operating."
  - question: "How much does a diesel mechanic make in Ohio?"
    answer: "Ohio diesel mechanics average $61,190 a year or $29.42 an hour. Technical training includes interpreting repair manuals and electronic diagnostic results, skills used before dismantling or replacing expensive vehicle components."
  - question: "What is the median diesel mechanic salary in Hawaii?"
    answer: "Hawaii has an $80,080 median, the highest of any state. Half of its employed bus and truck mechanics and diesel engine specialists earn at least that amount."
