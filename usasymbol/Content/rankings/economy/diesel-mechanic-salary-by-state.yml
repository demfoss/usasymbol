page:
  h1: "Diesel Mechanic Salary by State"
  quick_answer:
    - "Diesel mechanic salary by state is highest in Washington at $78,790 a year. Expensive local living and fleet employers such as Seattle's public transit system support a market for highly trained bus and truck mechanics."
    - "West Virginia has the lowest average at $52,690. The country's lowest housing rents ease local living costs and the wage pressure facing employers."
    - "Texas employs 29,870 diesel mechanics. Keeping commercial vehicles moving means servicing brakes, transmissions, electronics, and emissions systems as well as diesel engines."
