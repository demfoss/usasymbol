    title: "Highest Paying States for Machinists"
    paragraphs:
      - "Hawaii leads at $81,610 with only 260 machinists. Pearl Harbor provides a concrete example of its specialized work, refurbishing ship components with lathes, milling machines, and computer-controlled equipment. Valves, pumps, and hydraulic systems need skilled repair, while high local living costs put upward pressure on wages."
      - "Hawaii's machining tradition reaches back to the shipyard's first apprentices in 1920. Repairing a particular ship component requires different work from repeating one part on a production line. The [welder salary by state](/rankings/economy/welder-salary-by-state) comparison covers another metalworking trade used in ship repair, with a different method of shaping and joining material."
