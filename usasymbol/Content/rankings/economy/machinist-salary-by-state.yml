faq:
  - question: "What state pays machinists the most?"
    answer: "Hawaii pays the highest average hourly wage at $39.24. Machinists cut material to precise dimensions, using tools such as lathes and milling machines."
  - question: "How much does a machinist make in Hawaii?"
    answer: "Hawaii's median machinist salary is $84,410 annually. Pearl Harbor machinists refurbish components such as shafting, compressors, and hydraulic equipment."
  - question: "How much does a machinist make in Texas?"
    answer: "Texas machinists average $60,270 annually and $28.98 hourly. Machinists check finished parts against engineering drawings."
  - question: "How much does a machinist make in California?"
    answer: "California's median machinist pay is $57,190 a year. Shop-floor training often accompanies instruction in blueprint reading and computer-controlled equipment."
  - question: "How much does a machinist make in Ohio?"
    answer: "Ohio machinists average $56,670 a year, with median pay of $57,940. Precision machining can produce small batches or individual replacement parts, alongside larger production runs."
  - question: "How much does a machinist make in West Virginia?"
    answer: "West Virginia machinists average $24.61 hourly and have median annual pay of $47,350. Apprentices gain skills through paid workplace training."
