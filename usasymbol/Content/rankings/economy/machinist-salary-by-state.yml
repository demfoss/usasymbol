page:
  h1: "Machinist Salary by State"
  quick_answer:
    - "Machinist salary by state is highest in Hawaii at $81,610 a year. Pearl Harbor's ship-repair work and high local living costs give its small machining workforce a distinctive labor market."
    - "West Virginia averages $51,190, the lowest state wage. Its low housing costs help explain why the local dollar-pay market differs from expensive Hawaii."
    - "Texas has the most machinists at 21,700. The trade makes precision parts for machinery and transportation equipment, connecting it to much more than automobile production."
