page:
  h1: "Cost of Living by State 2025"
  quick_answer:
    - "Hawaii is the most expensive state in the U.S. with a composite cost of living index of 187 — meaning everyday expenses run 87% above the national average. Housing, groceries, and utilities all run significantly higher due to the state's remote island location and reliance on imports."
    - "Mississippi is the cheapest state with an index of 83, followed by Oklahoma and Kansas. In these states, the same dollar buys significantly more than it would in a high-cost state like Hawaii or California."
    - "The national average is set at 100 by the MERIC/C2ER index. States above 100 are more expensive than average; states below 100 are cheaper. Thirty states fall below the national average."
  methodology: "Cost of living index values are composite MERIC/C2ER (Missouri Economic Research and Information Center / Council for Community and Economic Research) scores using data from the most recent quarterly Cost of Living Index report. The index covers grocery items, housing, utilities, transportation, health care, and miscellaneous goods and services. 100 = national average."
