faq:
  - question: "Which state has the highest cost of living"
    answer: "Hawaii has the highest cost of living in the U.S. with a composite index of around 187, meaning expenses run 87% above the national average. The state's remote location in the Pacific Ocean means most goods must be shipped or flown in, which drives up prices for groceries, fuel, and building materials."
  - question: "Which state has the lowest cost of living"
    answer: "Mississippi consistently ranks as the least expensive state in the U.S. with a cost of living index around 83. Housing costs in particular are very low — the median home value is among the lowest of any state — and everyday expenses like groceries and utilities are below the national average."
  - question: "What does a cost of living index of 100 mean"
    answer: "An index of 100 represents the national average. A state with an index of 120 costs 20% more than average to live in; a state with an index of 85 costs 15% less. The C2ER index covers six categories: groceries, housing, utilities, transportation, health care, and miscellaneous goods and services."
  - question: "Does a high cost of living mean a lower standard of living"
    answer: "Not necessarily. High-cost states often have higher wages that partially offset expenses. Purchasing power — income adjusted for cost of living — is a better measure of real living standards. Some low-income, low-cost states offer less purchasing power than high-income, high-cost states."

