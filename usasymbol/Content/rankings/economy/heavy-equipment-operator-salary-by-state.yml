  - id: why-hawaii-equipment-operators-earn-more
    icon: "fa-solid fa-road"
    title: "Why Hawaii Equipment Operators Earn More"
    paragraphs:
      - "Hawaii's $49.05 average hourly pay comes alongside a public works system that sets separate rates for equipment operator groups. Covered contractors must meet the applicable wage schedule for the work performed. A road or drainage project therefore carries a prescribed labor cost, providing one mechanism behind Hawaii's high equipment operator pay."
      - "Arkansas averages $22.06 an hour and removed its state prevailing wage system in 2017. Local public construction no longer has that state-mandated wage floor, a legal difference that helps explain why similar machinery can command different pay across state lines."
  - id: states-with-most-equipment-operator-jobs
    icon: "fa-solid fa-briefcase"
    title: "States With the Most Equipment Operator Jobs"
    paragraphs:
      - "Texas has 55,540 equipment operator jobs at a $53,740 average salary. The occupation serves heavy civil contractors, specialty contractors, local governments, and mining employers. Road construction and water or sewer work all need operators to excavate and grade ground."
      - "Wyoming employs 3,800 operators, with the highest concentration at 13.521 per 1,000 jobs. Mining gives earthmoving equipment a role beyond building construction. Operators may work at remote sites, and the machinery needs regular maintenance as well as an experienced person at the controls."
