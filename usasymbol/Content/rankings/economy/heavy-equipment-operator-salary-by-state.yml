faq:
  - question: "What state pays heavy equipment operators the most?"
    answer: "Hawaii has the highest mean and median annual pay, with a median of $115,860. New operators may start on light equipment before progressing to bulldozers or machines with computerized controls."
  - question: "How much does a heavy equipment operator make in Texas?"
    answer: "Texas operators average $25.84 an hour and have median annual pay of $50,460. The state's average annual salary places it 42nd."
  - question: "How much does a heavy equipment operator make in California?"
    answer: "California operators average $45.19 an hour, with median annual pay of $87,160. Equipment maintenance and reading plans are part of the job alongside operating excavators and graders."
  - question: "How much does a heavy equipment operator make in Florida?"
    answer: "Florida averages $52,590 annually and $25.28 hourly. Workers may enter through on-the-job training, vocational instruction, or an apprenticeship."
  - question: "How much does a heavy equipment operator make in New York?"
    answer: "New York averages $90,690 annually and $43.60 hourly, placing fourth. Median annual pay is $80,980."
  - question: "Which state has the lowest heavy equipment operator salary?"
    answer: "Arkansas has the lowest average salary, with median annual pay of $44,520. Apprentices generally earn less than fully trained operators as they develop skills with heavier and more complex machines."
