sections:
  - id: highest-equipment-operator-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Heavy Equipment Operator Salaries"
    paragraphs:
      - "Hawaii averages $102,020 for a trade that prepares the ground before structures rise. Excavators dig foundations, bulldozers move earth, and graders shape roadbeds. Operators also maintain pumps, compressors, and other equipment that keeps a construction site working."
      - "California ranks second at $94,000 and employs 36,020 operators. Learning the controls is only part of the trade, since operators also read grading plans and increasingly use GPS to guide machines. The framework crews in [carpenter salaries by state](/rankings/economy/carpenter-salary-by-state) work on a later stage of many of the same projects."
