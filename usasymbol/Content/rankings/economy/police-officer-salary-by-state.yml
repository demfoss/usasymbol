  description: "California pays police officers the most at $115,400 a year. Mississippi is lowest at $45,610, one of two states under $50,000."

page:
  h1: "Police Officer Salary by State"

  quick_answer:
    - "California has the highest average police officer salary of any state at $115,400 a year ($55.48 an hour), well ahead of second-ranked Washington at $102,640."
    - "Mississippi has the lowest average police officer salary at $45,610 a year ($21.93 an hour), one of only two states under $50,000 alongside Arkansas at $48,090."
    - "Four states average over $100,000 a year for police officers: California, Washington, Illinois, and Alaska, all well above the roughly $72,775 average across the 49 states with published data."

  methodology: "Wages reflect mean annual and hourly pay for police and sheriff's patrol officers (SOC 33-3051), current as of 2026. Colorado and the District of Columbia are excluded: state-level police officer pay was not published for Colorado, and DC is not a state."

  sources:
    - name: "World Population Review. Police Officer Salary by State"
      url: "https://worldpopulationreview.com/state-rankings/police-officer-salary-by-state"
      description: "State-by-state average police officer annual salary and hourly wage, current as of 2026"

