faq:
  - question: "Which state pays police officers the most?"
    answer: "California pays police officers the most of any state, an average of $115,400 a year ($55.48 an hour). Washington ranks second at $102,640, and Illinois is third at $101,530."

  - question: "Which state pays police officers the least?"
    answer: "Mississippi pays police officers the least of any state, an average of $45,610 a year ($21.93 an hour). Arkansas is the only other state under $50,000, at $48,090."

  - question: "What is the average police officer salary in Texas?"
    answer: "Texas police officers earn an average of $76,350 a year ($36.71 an hour), ranking 21st among the states with published data."

  - question: "What is the average police officer salary in Florida?"
    answer: "Florida police officers earn an average of $76,190 a year ($36.63 an hour), just above the roughly $72,775 average across the 49 states with published data."

  - question: "Which states have the highest police officer salaries?"
    answer: "Four states average over $100,000 a year for police officers: California ($115,400), Washington ($102,640), Illinois ($101,530), and Alaska ($100,300)."

  - question: "Why isn't Colorado listed for police officer salary?"
    answer: "State-level police officer wage data was not published for Colorado in this data set, so it is excluded from the table rather than shown with an estimated figure."

