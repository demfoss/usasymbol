  - id: lowest-dentist-salaries
    icon: "fa-solid fa-house-medical"
    title: "Lowest Paying States for Dentists"
    paragraphs:
      - "Idaho's $139,320 mean belongs to a lower-price labor market, where equivalent purchasing power requires fewer dollars. Geography therefore helps explain part of its lower nominal pay. Its last-place adjusted wage shows that prices do not explain the whole difference, and employee-only estimates also leave out the income of self-employed practice owners."
      - "Idaho's $124,190 median is below its mean, so higher wages pull the average above the middle employee's pay. General dentists perform preventive and restorative care, with experience and practice setting affecting the compensation of those employee jobs."
