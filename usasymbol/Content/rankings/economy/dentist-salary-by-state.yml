  title: "Dentist Salary by State | Map & Pay"
  description: "General dentist employees average $241,580 in Missouri and $139,320 in Idaho. California has the most reported jobs at 16,770."
page:
  h1: "Dentist Salary by State"
  quick_answer:
    - "Dentist salary by state is highest in Missouri at $241,580 for general dentist employees. The average exceeds its $204,960 median, showing how higher-paid positions influence the leading figure."
    - "Idaho has the lowest reported general dentist average at $139,320. Lower local prices soften the difference, but Idaho also ranks last after purchasing power is counted."
    - "California has the most reported employee jobs at 16,770, despite ranking 38th for average pay. Self-employed owners and dental specialists are excluded, so the table describes a narrower market than every dentist working in the state."
  methodology: "BLS OEWS May 2025 general dentists, SOC 29-1021, exclude DC and self-employment, with wages missing for Alabama, Delaware, Kansas and jobs for Alabama, Kansas. Adjusted wages use BEA 2024 all-items RPP relative to national prices."
