map:
  title: "Dentist Salary by State Map"
  image_alt: "General dentist employee wages by state, highest in Missouri and lowest in Idaho among reported estimates"
  caption: "Missouri averages $241,580 for general dentist employees. Idaho has the lowest reported average at $139,320, while Alabama, Delaware, and Kansas lack wage estimates."
  metric_key: mean_annual
  metric_label: "Average annual general dentist employee pay"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-dentist-salaries
    icon: "fa-solid fa-tooth"
    title: "Highest Paying States for Dentists"
    paragraphs:
      - "Missouri's $241,580 mean is higher than its $204,960 median because high wages pull the arithmetic average upward. The difference makes the ranking sensitive to the distribution of pay across employees, whose experience and employment arrangements vary."
      - "Missouri employs 2,440 general dentist employees in this estimate. Associates in established practices diagnose and treat problems with teeth and gums, working alongside staff who provide preventive care. The [dental hygienist salary table](/rankings/economy/dental-hygienist-salary-by-state) adds the pay of another member of that clinical team."
    table:
      columns:
