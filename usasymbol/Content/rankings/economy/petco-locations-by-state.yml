sections:
  - id: "why-california-has-the-most-petco-stores"
    icon: "fa-solid fa-paw"
    title: "Most Petco Stores by State"
    paragraphs:
      - "California leads with 186 Petco locations. Petco traces its retail roots to a 1965 outlet in La Mesa, and the San Diego-area company built a dense home-state network before expanding nationwide."
      - "Texas has 139 stores and Florida has 74. Large household bases create many markets for pet food, grooming, and veterinary services, while California also leads the site's [animal shelter ranking](/rankings/economy/animal-shelters-by-state)."
  - id: "states-with-the-fewest-petco-stores"
    icon: "fa-solid fa-store"
    title: "Fewest Petco Stores by State"
    paragraphs:
      - "South Dakota has two Petco locations, fewer than any other state. Its small, widely dispersed population leaves fewer large retail catchment areas for a national specialty chain."
      - "North Dakota and Vermont have four stores each, while Maine and Wyoming have five each. Pet-related household costs vary too, as shown in [pet ownership spending by state](/rankings/economy/pet-ownership-spending-by-state)."

