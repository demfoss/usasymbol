    title: Why California 911 Dispatcher Pay Leads
    paragraphs:
      - "California's $81,520 average covers dispatchers who collect locations, select the proper response, and monitor police, fire, and ambulance units. The state's large local-government labor market and high operating costs place emergency communications in an expensive recruitment environment."
      - "Mississippi averages $36,530. Its lower statewide wage level reaches the same core job of entering incident details accurately while guiding callers before responders arrive."
