faq:
  - question: "Which state has the highest average car loan balance?"
    answer: "Texas has the highest average auto loan balance at $29,760. New Mexico is second at $29,098, and Wyoming is third at $27,972."

  - question: "Which state has the lowest average car loan balance?"
    answer: "Michigan has the lowest average auto loan balance at $19,503. Rhode Island follows at $19,597, and Massachusetts is third-lowest at $19,808."

  - question: "What is the national average car payment?"
    answer: "The national average monthly car payment was $662 in Q3 2024, up 5.1% from the year before. That figure is not available broken out by state, which is why this page ranks average loan balance instead."

  - question: "What is the average car loan balance in California?"
    answer: "California's average auto loan balance is $25,196, ranking 18th-highest and above the $24,297 national average."

  - question: "Which state's auto loan balance grew the fastest?"
    answer: "New York's balance grew 4.9% year over year, the largest increase of any state. New Jersey (4.0%) and West Virginia (3.9%) had the next-largest increases."

  - question: "What is the national average auto loan balance?"
    answer: "The national average auto loan balance was $24,297 in Q3 2024, a 2.1% increase from $23,792 the year before."

