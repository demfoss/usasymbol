sections:
  - id: "states-with-the-highest-auto-loan-balances"
    icon: "fa-solid fa-car"
    title: "States With the Highest Auto Loan Balances"
    paragraphs:
      - "Texas carries the highest average auto loan balance at $29,760, ahead of New Mexico at $29,098 and Wyoming at $27,972. Louisiana ($27,828) and Alaska ($27,246) round out the top five, all more than $2,900 above the $24,297 national average."
      - "Six of the ten highest-balance states, Texas, New Mexico, Oklahoma, Arkansas, Arizona, and Nevada, sit in the South Central or Southwest regions, where longer average commute distances push buyers toward larger, costlier trucks and SUVs."

  - id: "states-with-the-lowest-auto-loan-balances"
    icon: "fa-solid fa-car-side"
    title: "States With the Lowest Auto Loan Balances"
    paragraphs:
      - "Michigan has the lowest average balance at $19,503, just below Rhode Island at $19,597 and Massachusetts at $19,808. Connecticut ($20,096) and Wisconsin ($21,092) are the next lowest, all in the Northeast or Great Lakes region."
      - "Every one of the five lowest-balance states sits more than $4,000 below the national average of $24,297, and four of the five, Michigan, Rhode Island, Massachusetts, and Connecticut, border the Atlantic or the Great Lakes, where public transit access is higher and commute distances are shorter."

  - id: "states-where-balances-grew-fastest"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States Where Auto Loan Balances Grew Fastest"
    paragraphs:
      - "New York posted the largest year-over-year increase at 4.9%, followed by New Jersey at 4.0% and West Virginia at 3.9%. Rhode Island and Vermont tied for the next-largest increase at 3.7% each."
      - "None of the five fastest-growing states rank in the top 10 for balance size. New York's balance of $21,466 still sits below the $24,297 national average even after its 4.9% jump, showing the increase is closing a gap rather than widening a lead."

