page:
  h1: "Average Car Loan Balance by State"

  quick_answer:
    - "Texas carries the highest average auto loan balance of any state at $29,760, followed by New Mexico at $29,098 and Wyoming at $27,972."
    - "Michigan has the lowest average balance at $19,503, followed by Rhode Island at $19,597 and Massachusetts at $19,808, all under $20,000."
    - "The national average auto loan balance was $24,297 in Q3 2024, up 2.1% year over year. New York posted the largest single-state increase at 4.9%, followed by New Jersey at 4.0%."

  methodology: "No state publishes a direct \"average car payment\" figure, so this ranking uses average auto loan balance per borrower, the closest available proxy, reported by Experian for Q3 2024. The national average monthly car payment was $662 in the same period, but that figure is not broken out by state."

  sources:
    - name: "Experian — Average Auto Loan Debt Grew 2.1% to $24,297 in 2024"
      url: "https://www.experian.com/blogs/ask-experian/research/auto-loan-debt-study/"
      description: "State-by-state average auto loan balance and year-over-year change, Q3 2024"

