faq:
  - question: "What state has the highest gas tax in 2026?"
    answer: "Pennsylvania has the highest state gasoline excise tax in the United States at 57.6 cents per gallon. The rate combines a traditional excise with an oil company franchise tax tied to wholesale prices, a structure unique to Pennsylvania. California (54.0¢) and Washington (49.4¢) are the only other states above 49 cents."

  - question: "What state has the lowest gas tax in 2026?"
    answer: "Alaska has the lowest state gas tax in the country at 8.95 cents per gallon, unchanged since 1970. Among the continental states, Vermont (12.1¢) has the lowest excise rate, followed by New Mexico (17¢), Arizona (18¢), and Mississippi (18.79¢), which has held at that rate since 1987."

  - question: "What is the federal gas tax rate in 2026?"
    answer: "The federal gasoline excise tax is 18.4 cents per gallon, set by Congress in 1993 and never adjusted for inflation since. It applies in all 50 states and funds the Federal Highway Trust Fund, which finances interstate construction and bridge maintenance through the Federal Highway Administration. Adding the average state excise (~32¢) to the federal 18.4¢ puts the average combined tax burden near 50 cents per gallon before any local taxes."

  - question: "Why hasn't Texas raised its gas tax since 1991?"
    answer: "Texas has kept its gas tax at 20 cents per gallon since 1991 due to sustained legislative resistance to any fuel tax increase. The state compensates through Proposition 1 (2014) and Proposition 7 (2015), constitutional amendments that redirect portions of oil and gas severance tax revenue to the State Highway Fund. The approach works when energy prices are high but creates funding gaps during oil price downturns, as Texas experienced in 2015-2016 and 2020."

  - question: "Why does Hawaii have expensive gas if its state excise tax is only 16 cents?"
    answer: "Hawaii's 16¢ state excise is well below average, but each of the state's four counties adds 8.8 to 18 cents in local fuel taxes, and the state sales tax of 4.712 percent applies to fuel purchases. On top of that, almost all petroleum must be shipped 2,400 miles across the Pacific. The combined state, county, and federal tax burden per gallon in Hawaii is among the highest in the country despite the low excise rate."

  - question: "Which states index their gas tax to inflation?"
    answer: "As of 2026, states with CPI-indexed or formula-driven gas tax rates include California, Illinois, Maryland, Utah, Indiana, West Virginia, Virginia, and North Carolina, among others. Indexed states avoid holding a legislative vote each time the rate rises, but critics argue the mechanism removes accountability. Illinois adopted indexing in 2020 alongside its historic overnight doubling of the rate from 19¢ to 38¢."

  - question: "Why is New Jersey's gas tax so high if it was once the lowest?"
    answer: "New Jersey held the lowest state gas tax in the country for decades, 14.5 cents per gallon through 2016, until the Transportation Trust Fund faced insolvency after years of underfunding. The 2016 increase raised the rate to 37.5 cents immediately, and it has since risen further to 42.4 cents. The long freeze left New Jersey with a compounding backlog of road and bridge maintenance; the catch-up increase was far larger than it would have been with smaller, regular adjustments."

  - question: "Which states have the highest fuel tax rate?"
    answer: "The five states with the highest fuel tax rate are Pennsylvania (57.6¢/gal), California (54.0¢), Washington (49.4¢), Illinois (47.0¢), and Maryland (46.6¢). All five use some form of indexed or formula-driven rate; Pennsylvania is the only one with a two-part excise-plus-franchise-tax structure. New Jersey (42.4¢) and North Carolina (40.5¢) round out the top seven."

  - question: "What is Pennsylvania's fuel tax rate compared to other states?"
    answer: "Pennsylvania's fuel tax rate of 57.6 cents per gallon is the highest state excise in the country, roughly 25 cents above the national average of around 32 cents. The nearest competitor is California at 54.0¢; the gap between Pennsylvania and the third-ranked state, Washington at 49.4¢, is more than 8 cents per gallon. At the other extreme, Alaska's 8.95¢ rate is less than one-sixth of Pennsylvania's."

  - question: "What do state gas taxes actually fund?"
    answer: "Most state gas tax revenue is restricted by law or constitution to transportation: highway construction and maintenance, bridge repair, and in some states, mass transit. Texas is the only state that splits its fuel tax between roads and public education. New Jersey and Maryland dedicate substantial shares to transit agencies. No state may legally redirect gas tax revenue to its general fund under most state constitutional provisions, which is why gas tax debates center on transportation funding needs rather than broader budget politics."

