map:
  metric_key: mean_annual
  metric_label: Mean Annual Veterinarian Wage
  color_scheme: green
  color_scale: linear
  caption: "Arizona leads at $187,410, while South Dakota has the lowest reported mean at $93,990. Alaska and Delaware have suppressed wages."
sections:
  - id: highest-veterinarian-salaries
    icon: fa-solid fa-arrow-trend-up
    title: Highest Paying States for Veterinarians
    paragraphs:
      - "Arizona leads at $187,410, but its median is $152,020. Higher-paid employees pull the mean above the middle wage, explaining part of the unusually large average without implying that every veterinarian receives it. Local prices alone are insufficient to explain the lead, because Arizona stays first after adjustment."
      - "Arizona's 2,080 veterinarian jobs cover a range of practice roles rather than a single standard clinic position. Specialty referral services in Glendale include surgery, internal medicine, and cardiology, illustrating how animal care extends beyond routine vaccinations. Employer and specialty mix can affect wages, although this table does not identify which practices account for the state's lead."
