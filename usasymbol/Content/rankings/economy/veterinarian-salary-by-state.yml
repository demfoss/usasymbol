seo:
  title: Veterinarian Salary by State | Map & Pay
  description: "Veterinarians average $187,410 in Arizona and $93,990 in South Dakota. Arizona also leads after living costs."
page:
  h1: Veterinarian Salary by State
  quick_answer:
    - "Veterinarian salary by state is highest in Arizona at $187,410 annually. Its mean exceeds its $152,020 median, indicating that higher-paid employees pull the average above the middle veterinarian's wage."
    - "South Dakota averages $93,990, the lowest reported salary. Lower household prices soften that result, but its price-adjusted pay remains last among states with available wages."
    - "Hawaii moves from 27th to 46th after living costs, tying Louisiana's climb from 34th to 15th for the largest ranking shift. Alaska and Delaware retain employment estimates but have no published wage values."
  methodology: "BLS OEWS May 2025 veterinarian estimates, SOC 29-1131, exclude DC and self-employed workers, with Alaska and Delaware wages suppressed. Adjusted pay divides wages by BEA 2024 all-items RPP and multiplies by 100."
  sources:
    - name: BLS OEWS May 2025 state estimates
      url: https://downloadt.bls.gov/pub/time.series/oe/
      description: Veterinarian employee wages, employment, and occupational concentration
    - name: BEA Regional Price Parities
      url: https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area
      description: All-items state price indexes for 2024
    - name: BLS Occupational Outlook Handbook
      url: https://www.bls.gov/ooh/healthcare/veterinarians.htm
      description: Veterinary practice settings, responsibilities, and work schedules
    - name: Midwestern University veterinary referrals
      url: https://clinics.midwestern.edu/animal-health-institute/companion-animal-clinic/veterinary-referrals
      description: Specialty surgery, internal medicine, and cardiology services in Glendale, Arizona
    - name: BLS geographic wage comparisons
      url: https://www.bls.gov/oes/earnings.htm
      description: Geographic prices and industry composition as influences on wages
