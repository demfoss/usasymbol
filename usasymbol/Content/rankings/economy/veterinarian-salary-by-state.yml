  - id: lowest-veterinarian-salaries
    icon: fa-solid fa-arrow-trend-down
    title: Lowest Paying States for Veterinarians
    paragraphs:
      - "South Dakota averages $93,990, with a median of $88,650. Lower local prices partly explain the smaller nominal salary, but adjusted pay remains last, so household expenses do not fully account for the gap. Veterinary wages also depend on the mix of clinic, farm, government, and teaching positions included in an employee estimate."
      - "South Dakota lists 280 employed veterinarians, a much smaller employer pool than Arizona's. Livestock visits and companion-animal hospital work involve different clients and working conditions, while self-employed practice owners are excluded entirely. The [median income ranking](/rankings/economy/states-by-median-income) supplies broader household context without equating wages with business profits."
