    paragraphs:
      - "West Virginia's 74.9% homeownership rate is the highest of any state, about 9.7 points above the national average of 65.2%. Maine (74.3%) and a tied Michigan and Vermont (73.2%) round out the top four, and all of the top ten states have below-average home values, per [median home value by state](/rankings/economy/states-by-home-value)."
      - "The leaders cluster in two regions: Appalachia and northern New England (West Virginia, Maine, New Hampshire, Vermont) and the Upper Midwest (Michigan, Minnesota, Iowa, South Dakota). Both regions combine modest home prices with older, more settled populations who have had decades to pay down a mortgage or own outright."

  - id: "states-with-lowest-homeownership-rate"
    icon: "fa-solid fa-building"
    title: "States with the Lowest Homeownership Rates"
    table:
