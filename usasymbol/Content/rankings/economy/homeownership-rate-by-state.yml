page:
  h1: "Homeownership Rate by State"

  quick_answer:
    - "West Virginia has the highest homeownership rate of any state at 74.9%, followed by Maine (74.3%) and a tie between Michigan and Vermont (73.2%)."
    - "New York has the lowest homeownership rate among the states at 54.4%, followed by California (55.9%) and Nevada (60.0%). The District of Columbia is lower still at 41.5% but is not ranked among states."
    - "The national homeownership rate is about 65.2%. Roughly two-thirds of occupied U.S. housing units are owner-occupied rather than rented, and the top and bottom states differ by more than 20 percentage points."

  methodology: "Homeownership rate is the share of occupied housing units that are owner-occupied, from the U.S. Census Bureau's American Community Survey (ACS) 2019-2023 5-Year Estimates. Five-year estimates blend multiple survey years to produce statistically reliable figures for every state, including smaller ones."

  sources:
