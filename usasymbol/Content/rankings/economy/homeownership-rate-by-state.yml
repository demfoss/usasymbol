          homeownership_rate: 63.3
        - rank: 42
          state: "Rhode Island"
          state_slug: "rhode-island"
          homeownership_rate: 63.6
        - rank: 41
          state: "Washington"
          state_slug: "washington"
          homeownership_rate: 63.8
    paragraphs:
      - "New York has the lowest homeownership rate among the states at 54.4%, dragged down by New York City, where dense high-rise housing and rent-stabilized apartments make renting the default for most residents. California (55.9%) faces a similar dynamic statewide: home prices far outpace local wages, so millions of households who could afford to buy elsewhere continue renting."
      - "Nevada (60.0%), Massachusetts (62.5%), and Hawaii (63.0%) round out the bottom tier for different reasons: fast population growth and heavy in-migration in Nevada, dense coastal metros in Massachusetts, and extremely limited buildable land in Hawaii. Every state below 60% also ranks among the most expensive for [median home value](/rankings/economy/states-by-home-value)."

  - id: "homeownership-vs-home-prices"
    icon: "fa-solid fa-scale-balanced"
    title: "How Home Prices Affect Homeownership Rates by State"
    paragraphs:
      - "Homeownership rate and home price move in largely opposite directions across states. West Virginia pairs the nation's highest ownership rate with one of its lowest median home values, while New York and California pair the lowest ownership rates with two of the highest. When homes cost more relative to local income, fewer households can afford to buy, so more remain renters even if they would prefer to own."
      - "The relationship isn't perfect. Texas (62.6%) has moderate home values but a below-average ownership rate, reflecting rapid population growth and a large share of newer arrivals who haven't yet bought. North Dakota (62.8%) sits low despite cheap housing, partly because its oil-industry workforce is younger and more transient than the farm-belt states around it."

  - id: "renters-vs-homeowners-by-state"
    icon: "fa-solid fa-key"
    title: "Renters vs. Homeowners by State"
    paragraphs:
      - "Nationally, about 65.2% of occupied housing units are owner-occupied and 34.8% are renter-occupied. In West Virginia, owners outnumber renters roughly three to one; in New York, owners and renters are close to an even split, with renters actually forming the majority in New York City itself."
      - "The gap between the top and bottom states is wide: West Virginia's 74.9% ownership rate is more than 20 percentage points above New York's 54.4%. Compare any two states directly, including income and cost of living alongside housing, on the [state comparison tool](/compare-states)."

