faq:
  - question: "Which state has the highest homeownership rate?"
    answer: "West Virginia, at 74.9%. Maine (74.3%) and a tie between Michigan and Vermont (73.2%) follow. All of the top states combine below-average home values with older, longer-settled populations."

  - question: "Which state has the lowest homeownership rate?"
    answer: "New York, at 54.4%, followed by California (55.9%) and Nevada (60.0%). The District of Columbia is lower still at 41.5% but is a federal district, not a state, so it isn't ranked here."

  - question: "What is the national homeownership rate?"
    answer: "About 65.2% of occupied U.S. housing units are owner-occupied, per the Census Bureau's ACS 2019-2023 5-Year Estimates. The remaining 34.8% are renter-occupied."

  - question: "Does homeownership rate track home prices?"
    answer: "Generally yes, in the opposite direction. States with low median home values, like West Virginia and Maine, tend to have high homeownership rates, while expensive states like New York and California have some of the lowest. See [median home value by state](/rankings/economy/states-by-home-value) for the price side of that relationship."

  - question: "How is the homeownership rate calculated?"
    answer: "It's the share of occupied housing units that are owner-occupied rather than renter-occupied, calculated by the Census Bureau from American Community Survey responses. This ranking uses the 2019-2023 5-Year Estimates, which combine five years of survey data for reliable state-level figures."

