    url: https://www.bls.gov/oes/2025/may/oessrcst.htm
    description: State wage and employment estimates for SOC 15-2051 Data Scientists
  - name: BLS OEWS official text data
    url: https://downloadt.bls.gov/pub/time.series/oe/oe.data.0.Current
    description: May 2025 state employment, hourly mean, annual mean, annual median, and employment per thousand
      jobs
  - name: BEA Regional Price Parities, 2024
    url: https://apps.bea.gov/regional/zip/SARPP.zip
    description: All-items state price indices, using the full published precision
  - name: BLS Occupational Outlook Handbook, Data Scientists
    url: https://www.bls.gov/ooh/math/data-scientists.htm
    description: Occupational duties, employer industries, and work setting
  - name: BLS, Using Wage Data During Salary Negotiations
    url: https://www.bls.gov/oes/earnings.htm
    description: Industry mix and geographic factors behind wage differences
  - name: City of Redmond, Largest Employers
    url: https://www.redmond.gov/943/Largest-Employers
    description: Local software employer context without importing employer counts into the ranking
