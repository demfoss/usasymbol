sections:
- id: highest-data-scientist-salaries
  icon: fa-solid fa-chart-line
  title: Why Washington Leads Data Scientist Pay
  paragraphs:
  - Washington's $158,040 mean places it above every other state with published wages. Software and cloud-computing
    employers around Seattle and Redmond recruit from the same labor market, while the work itself ranges from machine-learning
    systems to business analysis. Employer industry and local prices influence the wage attached to that mix of
    jobs.
  - Washington's median of $163,350 exceeds its mean, so the average should not be treated as an entry-level offer.
    Different wage distributions can produce different mean and median orderings, even within technology occupations
    such as [software development](/rankings/economy/software-developer-salary-by-state).
