seo:
  title: Data Scientist Salary by State | Map & Pay
  description: Data scientists average $158,040 a year in Washington and $79,290 in Mississippi. California has
    the most jobs, with 39,310.
page:
  h1: Data Scientist Salary by State
  quick_answer:
  - Data scientist salary by state is highest in Washington at $158,040 a year. Seattle and Redmond place software
    and cloud-computing employers in the same labor market, where industry mix helps shape pay.
  - Mississippi has the lowest reported mean at $79,290. Its lower prices narrow the purchasing-power gap, although
    they do not eliminate it. The figure measures employee wages rather than freelance consulting income.
  - Arkansas ranks 19th in cash pay at $116,320 but fourth after adjusting for local prices, at $133,798 in national-price
    purchasing power. A smaller paycheck can stretch farther without the employer actually paying more.
  methodology: BLS OEWS May 2025, SOC 15-2051 employee wages. BEA 2024 all-items RPP adjusts mean pay, rounded to
    dollars. D.C. and self-employment are excluded. Delaware wages and all Wyoming estimates are suppressed.
  sources:
