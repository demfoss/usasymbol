- id: lowest-data-scientist-salaries
  icon: fa-solid fa-arrow-down
  title: Lowest Data Scientist Salaries
  paragraphs:
  - Mississippi's $79,290 mean comes from a smaller occupational market, with 440 data scientist jobs recorded.
    Lower local prices can support lower nominal wage levels, and the mix of employers also matters. The state figures
    average existing positions across industries rather than comparing the same job offer from the same company.
  - Delaware reports 770 jobs but no wage estimate, while Wyoming's occupation-level estimates are unpublished.
    A missing wage should not place either state below Mississippi, and missing employment should not be read as
    evidence that no one works in data science.
- id: data-scientist-pay-and-living-costs
  icon: fa-solid fa-house
  title: Data Scientist Pay and Living Costs
  paragraphs:
  - Hawaii has the largest rank shift after the price adjustment, from 16th in cash pay to 38th in purchasing power.
    Its $118,940 mean becomes $108,175 at national prices because a typical basket of goods and services costs more
    there. The adjustment uses statewide [cost of living](/rankings/economy/states-by-cost-of-living), so it is
    not a specific Honolulu housing budget.
  - Arkansas goes from 19th to fourth, with an adjusted value of $133,798. That is a comparison unit rather than
    a new paycheck, and it does not subtract taxes or predict an individual's spending. Washington still leads the
    adjusted table at $147,683.
