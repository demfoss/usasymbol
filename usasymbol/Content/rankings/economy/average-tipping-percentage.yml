faq:
  - question: "Which state tips the most?"
    answer: "Delaware has the highest average tip of any state at 21.5%, followed by West Virginia at 20.5% and Indiana and New Hampshire both at 20.4%. Delaware's average is 2.1 percentage points above the national average of 19.4%."

  - question: "Which state tips the least?"
    answer: "California has the lowest average tip at 17.3%, the only state below 18.0%. Washington ranks 49th at 17.8% and Nevada ranks 48th at 18.1%. California's average is 2.1 percentage points below the national average of 19.4%."

  - question: "What is the average tip in America?"
    answer: "The national average tip percentage is 19.4% across all 50 states. The most common tip range at U.S. restaurants is 15 to 20% of the pre-tax bill. For exceptional service, 20 to 25% is considered generous."

  - question: "What percentage should you tip at a restaurant?"
    answer: "At a full-service restaurant, 15 to 20% of the pre-tax bill is standard. The national average across all states is 19.4%. For exceptional service, 20% or more is considered generous. At bars, $1 to $2 per drink or 15 to 20% of a tab is customary."

  - question: "Why does California tip less than other states?"
    answer: "California ranks last at 17.3%, which researchers link to two factors. First, California requires employers to pay tipped workers the full state minimum wage before tips, so patrons may feel less pressure to supplement low base wages. Second, many California restaurants add automatic service charges, which the OysterLink data treats separately from voluntary tips. About 72% of Americans oppose automatic service charges."

  - question: "Do you have to tip in America?"
    answer: "Tipping is not legally required in the United States. However, it is a strong cultural expectation at full-service restaurants, bars, and hotels. The national average tip is 19.4%. About 72% of Americans oppose mandatory automatic service charges added to bills, preferring to control the tip amount themselves."

