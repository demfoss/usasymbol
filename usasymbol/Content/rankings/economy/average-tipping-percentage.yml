page:
  h1: "Average Tip by State"

  quick_answer:
    - "Delaware has the highest average tip percentage at 21.5%, followed by West Virginia at 20.5%. Indiana and New Hampshire both average 20.4% at ranks 3 and 4. Kentucky, Ohio, and Wyoming all average 20.3%."
    - "California has the lowest average tip at 17.3%, the only state below 18.0%. Washington ranks 49th at 17.8% and Nevada ranks 48th at 18.1%. Florida and Louisiana round out the bottom five at 18.2% and 18.4%."
    - "The national average tip is 19.4%. About 72% of Americans oppose automatic service charges added to bills. Delaware's average is 4.2 percentage points higher than California's."

  methodology: "Average tip percentages are derived from transaction-level data reported by OysterLink (2024), compiled from service industry payment records across restaurants, bars, and hospitality businesses. The data represents actual gratuities left by customers as a percentage of the pre-tax bill, not self-reported survey estimates. The national average across all 50 states is approximately 19.4%."

  sources:
    - name: "OysterLink — Average Tip Percentages by State"
      url: "https://oysterlink.com/blog/average-tip-percentage/"
      description: "Transaction-level tipping data across the U.S. service industry, compiled from restaurant and hospitality payment records"

