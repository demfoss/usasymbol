faq:
  - question: "What state pays audiologists the most?"
    answer: "Oregon pays the highest mean at $128,950 a year and $61.99 an hour. Its annual median is $109,560."
  - question: "How much does an audiologist make in Oregon?"
    answer: "Oregon audiologists average $128,950 annually, with a $109,560 median. The state has 140 employee positions."
  - question: "How much does an audiologist make in California?"
    answer: "California audiologists average $112,680 a year and $54.17 an hour. The state employs 1,740, more than any other state."
  - question: "How much does an audiologist make in Texas?"
    answer: "Texas audiologists average $98,780 annually and earn a $93,570 median. Its workforce of 1,020 ranks third by employment."
  - question: "What is the lowest audiologist salary by state?"
    answer: "Mississippi has the lowest reported mean at $78,510 a year and $37.74 an hour. Its annual median is $80,740."
  - question: "Why are Rhode Island and Wyoming missing from the audiologist ranking?"
    answer: "No publishable mean annual wage is available for Rhode Island or Wyoming, so neither can be placed in the salary order."
