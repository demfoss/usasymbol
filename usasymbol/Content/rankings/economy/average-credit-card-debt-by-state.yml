sections:
  - id: "states-with-the-most-credit-card-debt"
    icon: "fa-solid fa-credit-card"
    title: "States With the Most Credit Card Debt"
    paragraphs:
      - "Alaska carries the highest average credit card debt at $7,863 per consumer, $1,283 above the $6,580 national average. Florida is second at $7,548, and New Mexico is third at $7,401."
      - "Connecticut ($7,381) and Massachusetts ($7,282) round out the top five. All five states above $7,200 sit at least $700 above the national average, and none of the five neighbor one another geographically."

  - id: "states-with-the-least-credit-card-debt"
    icon: "fa-solid fa-wallet"
    title: "States With the Least Credit Card Debt"
    paragraphs:
      - "Kansas has the lowest average credit card debt at $5,227, just below Wisconsin at $5,242 and Louisiana at $5,304. West Virginia ($5,348) and Missouri ($5,415) are the next-lowest."
      - "All five lowest-debt states sit more than $1,100 below the national average of $6,580. Kansas and Wisconsin are both Midwest states, while Louisiana and West Virginia are in the South, showing the low-debt tier spans more than one region."

