faq:
  - question: "Which state has the highest average credit card debt?"
    answer: "Alaska has the highest average credit card debt at $7,863 per consumer. Florida is second at $7,548, and New Mexico is third at $7,401."

  - question: "Which state has the lowest average credit card debt?"
    answer: "Kansas has the lowest average credit card debt at $5,227 per consumer. Wisconsin is second-lowest at $5,242, and Louisiana is third-lowest at $5,304."

  - question: "What is the national average credit card debt?"
    answer: "The national average credit card debt is $6,580 per consumer. Twenty-six states fall below that figure."

  - question: "What is the average credit card debt in California?"
    answer: "California's average credit card debt is $6,736 per consumer, ranking 14th-highest and above the $6,580 national average."

  - question: "What is the average credit card debt in Texas?"
    answer: "Texas averages $5,993 in credit card debt per consumer, ranking 28th and just below the national average of $6,580."

  - question: "What is the average credit card debt in New York?"
    answer: "New York's average is $5,833 per consumer, ranking 37th, more than $2,000 below Alaska's $7,863 at the top of the table."

