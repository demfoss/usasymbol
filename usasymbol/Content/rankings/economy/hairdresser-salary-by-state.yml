  - id: why-hairdresser-salaries-vary-by-state
    icon: fa-solid fa-coins
    title: Why Hairdresser Salaries Vary by State
    paragraphs:
      - "Washington's $63,800 average sits in a market with expensive housing and a state wage floor that rises with consumer prices. Tips must sit above an employee's minimum hourly pay, supporting earnings in a service occupation where gratuities are common. The [tipped minimum wage](/rankings/economy/tipped-minimum-wage-by-state) rules determine how that base is paid."
      - "Louisiana's $27,600 average accompanies housing rents and household prices below the national level. A haircut is a local service, so the prices clients pay and the wages salons offer operate within that local economy. Lower [living costs](/rankings/economy/states-by-cost-of-living) also reduce the rent and everyday expenses a paycheck must cover."
  - id: states-with-the-most-hairdresser-jobs
    icon: fa-solid fa-shop
    title: States With the Most Hairdresser Jobs
    paragraphs:
      - "California has 27,080 employee jobs in this occupation, more than any other state. A salon visit can involve shampooing, color application, and styling, while sanitizing tools and stations fills the intervals between clients."
      - "Florida employs 23,530 hairdressers, ahead of Texas at 22,440. Salon schedules commonly include evenings and weekends, matching the times clients can come in after work or before an event."
