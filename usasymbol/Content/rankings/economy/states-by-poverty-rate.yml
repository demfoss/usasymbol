  h1: "Poverty Rate by State 2025"
  quick_answer:
    - "Mississippi has the highest poverty rate of any U.S. state at over 15%. Louisiana, New Mexico, and West Virginia also rank near the top. These states share lower median incomes, higher rates of rural poverty, and limited access to high-wage employment."
    - "New Hampshire and Maryland consistently have the lowest poverty rates, both below 8%. These states combine high median incomes with strong labor markets and above-average access to education and public services."
    - "The national poverty rate is approximately 12.9% (U.S. Census Bureau, 2023 ACS). The federal poverty line for a family of four in 2023 was $30,000."
  methodology: "Poverty rates are 2023 one-year estimates from the U.S. Census Bureau American Community Survey (ACS). The official poverty measure compares pre-tax cash income to federal poverty thresholds, which vary by family size and composition but not by geographic location or cost of living."
