faq:
  - question: "Which state has the highest poverty rate"
    answer: "Mississippi has the highest poverty rate in the U.S. at over 15%. The state has ranked last or near last on this measure for decades due to a combination of low median wages, limited economic diversification, and high rates of rural poverty."
  - question: "Which state has the lowest poverty rate"
    answer: "New Hampshire consistently records the lowest poverty rate of any U.S. state, typically below 7–8%. The state has a highly educated workforce, low unemployment, no state income tax on wages, and a strong technology and manufacturing economy."
  - question: "What is the federal poverty level"
    answer: "The federal poverty level (FPL) is a set of income thresholds published annually by the Department of Health and Human Services. In 2023, the poverty line was $14,580 for one person and $30,000 for a family of four. It does not vary by geographic location, which critics argue understates poverty in high-cost states."
  - question: "Does the poverty rate capture all forms of economic hardship"
    answer: "No. The official poverty measure counts only pre-tax cash income and does not include non-cash benefits like SNAP, Medicaid, or housing assistance. The Supplemental Poverty Measure (SPM), which does account for these factors, produces somewhat different state rankings and generally shows a lower poverty rate nationwide."

