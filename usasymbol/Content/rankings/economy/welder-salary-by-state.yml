sections:
  - id: "highest-paying-states-for-welders"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Paying States for Welders"
    paragraphs:
      - "Alaska leads at $80,100, with median pay of $80,840. North Slope oil pipelines illustrate the demanding side of the trade, where welds must meet engineering standards for transporting oil through harsh conditions. Specialized industry work and local recruiting costs help explain the wage premium, although this statewide table cannot assign a share of the lead to either factor."
      - "Hawaii ranks second at $77,430 with just 520 employees. Pearl Harbor's shipyard gives welding an industrial role that a tourism-centered picture of Hawaii misses. Its welders join and cut marine metals during ship and submarine repair, work that differs from assembling products on a factory line."
