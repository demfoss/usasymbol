      - "Alaska remains first at $78,254 after adjustment, while Wyoming moves into second at $73,351. Wyoming's lower prices strengthen the value of its $67,990 gross wage. The broader [cost of living by state](/rankings/economy/states-by-cost-of-living) is useful context, but a statewide index cannot reproduce one worker's rent, travel expenses, or employer-provided lodging."
