      url: "https://dog.dnr.alaska.gov/Documents/SPCS/EasternNorthSlope/AttachmentC-OilDesign.pdf"
      description: "Pipeline engineering context and welding standards on Alaska's North Slope"
    - name: "Naval Sea Systems Command, Pearl Harbor apprentice trades"
