    paragraphs:
      - "Texas employs 52,000 welders, ahead of California's 26,060 and Ohio's 20,330. Those totals combine metal fabrication, repair, and contractor work rather than counting a single kind of welding assignment. A worker choosing between states still needs to compare the employer's process, materials, and shift schedule, since factory production can run through evenings and weekends."
