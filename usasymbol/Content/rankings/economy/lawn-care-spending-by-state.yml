faq:
  - question: "What is the average cost of lawn care by state?"
    answer: "The average price of a single professional lawn mow ranges from $78.15 in Vermont down to $45.08 in Arizona. The national average is about $53.59 per mow."

  - question: "Which state has the most expensive lawn care?"
    answer: "Vermont has the highest average mow price at $78.15. Maine is second at $76.27, and Connecticut is third at $64.62."

  - question: "Which state has the cheapest lawn care?"
    answer: "Arizona has the lowest average mow price at $45.08. New Mexico ($45.30) and California ($45.73) are next lowest."

  - question: "Why is lawn care so expensive in Vermont and other short-season states?"
    answer: "Vermont, New Hampshire, and North Dakota all have mowing seasons of about six months, among the shortest in the country. Lawn care pros there have far fewer paid visits a year than crews in Florida or Texas, so they charge more per mow to earn a comparable annual income."

  - question: "Which state's lawn care prices rose the fastest?"
    answer: "New Jersey, up 10.5% from 2024 to 2025. Oregon (+9.5%) and New York (+9.3%) had the next-fastest increases, all well above the 6.6% national average price increase."

  - question: "Is lawn care cheaper in the South than the North?"
    answer: "Generally, yes, by region. The South averages $52.93 per mow and the West averages $50.90, compared with $58.17 in the Northeast and $55.45 in the Midwest, largely because longer growing seasons in the South and West spread mowing crews' income across more visits a year."

