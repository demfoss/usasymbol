page:
  h1: "Lawn Care Spending by State"

  quick_answer:
    - "Vermont has the highest average price for a professional lawn mow at $78.15, followed by Maine ($76.27) and Connecticut ($64.62). Short mowing seasons push per-visit prices up in all three."
    - "Arizona has the lowest average mow price at $45.08, just below New Mexico ($45.30) and California ($45.73), states where mild or year-round climates spread mowing crews' income across far more visits a year."
    - "New Jersey saw the fastest price growth of any state from 2024 to 2025, up 10.5%, followed by Oregon (+9.5%) and New York (+9.3%)."

  methodology: "Figures are the average price of a single professional lawn mowing visit by state in 2025, drawn from more than 2 million completed mowing jobs across 2,000-plus U.S. cities and weighted by mow volume. These are per-visit prices, not total annual lawn care spending, since states with longer mowing seasons rack up more visits a year even where the per-mow price is lower. Montana and the District of Columbia are excluded for insufficient job-volume data."

  sources:
    - name: "LawnStarter. How Location Impacts Lawn Care Costs in 2026"
      url: "https://www.lawnstarter.com/blog/studies/lawn-care-costs/"
      description: "Analysis of more than 2 million completed mowing jobs across 2,000-plus U.S. cities in 2025, with state-level average mow price and year-over-year price change"

