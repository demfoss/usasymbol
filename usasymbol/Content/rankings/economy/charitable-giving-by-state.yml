faq:
  - question: "Which state is the most charitable in the country?"
    answer: "Wyoming ranks first with a score of 69.49 out of 100. It places 2nd nationally for volunteering and service and 6th for charitable giving."

  - question: "Which state has the highest volunteering and service rank?"
    answer: "Utah ranks 1st for volunteering and service, contributing to its overall score of 68.59, the second-highest in the country."

  - question: "Which state has the highest charitable giving rank?"
    answer: "Virginia ranks 1st for charitable giving. Its overall score of 63.42 places it 5th nationally, held back by a 28th-place volunteering rank."

  - question: "Which state is the least charitable?"
    answer: "New Mexico ranks last among the 50 states with a score of 38.83, placing 50th in both volunteering and service and charitable giving."

  - question: "How does California rank for charitable giving?"
    answer: "California ranks 5th for charitable giving, one of the strongest giving ranks in the country. Its volunteering and service rank is far lower at 45th, giving it an overall score of 53.09."

  - question: "Which state has the biggest gap between volunteering and giving ranks?"
    answer: "Idaho has the widest gap of any state, ranking 3rd for volunteering and service but 47th for charitable giving."

