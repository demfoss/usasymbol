page:
  h1: "Charitable Giving by State"

  quick_answer:
    - "Wyoming ranks as the most charitable state in the country with a score of 69.49 out of 100, placing 2nd nationally for volunteering and service and 6th for charitable giving."
    - "Utah scores second overall at 68.59 and ranks 1st in volunteering and service, yet its charitable giving rank sits at 19th, well behind its volunteering position."
    - "New Mexico ranks last among the 50 states with a score of 38.83, placing 50th in both volunteering and service and charitable giving."

  methodology: "Rankings come from WalletHub's Most Charitable States report, published November 10, 2025. Each state is scored on a 100-point scale across 17 metrics split evenly between Volunteering & Service and Charitable Giving. Washington, D.C. is excluded."

  sources:
