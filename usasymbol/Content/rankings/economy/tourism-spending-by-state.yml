sections:
  - id: "states-with-biggest-tourism-economy"
    title: "States With the Biggest Tourism Economy"
    paragraphs:
      - "Nevada and Hawaii form their own tier, at 12.18% and 9.58%. Vermont comes next at 6.00%, a gap that shows how unusual the first two are. Vermont's ski resorts and fall foliage draw crowds to a state with fewer than 650,000 residents, so a modest number of inns and restaurants weighs heavily on its economy. See [hotels by state](/rankings/economy/hotels-by-state) for how lodging is spread nationwide."
      - "Maine (4.87%) and Montana (4.59%) follow the same pattern, with lobster shacks on the coast and lodges near Glacier National Park. Florida (4.37%) is the only large state in the top ten, thanks to Orlando's theme parks and a long beach coastline."
