  title: "Tourism Economy by State | Map, Share & Rankings"
  description: "Nevada's hotels and restaurants make up 12.18% of its economy, the most of any state. Hawaii follows at 9.58% and Delaware has the least at 1.99%."

page:
  h1: "Tourism Economy by State"
  quick_answer:
    - "Nevada has the biggest tourism economy of any state. Hotels, resorts, bars, and restaurants generate 12.18% of its output, or $34,276 million, built around the Las Vegas Strip."
    - "Hawaii ranks second at 9.58%. Every visitor arrives by plane or ship, so lodging and food service make up a huge share of a small island economy."
    - "Delaware has the smallest share at 1.99%. Corporate law and banking inflate its economy far beyond what hotels and restaurants produce. California leads in raw dollars at $126,929 million."
  methodology: "Value added by accommodation and food services (NAICS 72) in 2025, in millions of current dollars, divided by total state GDP for the same year. The share is calculated from those two published figures. Includes the District of Columbia."
  sources:
    - name: "U.S. Bureau of Economic Analysis, GDP by State, Table SAGDP2"
      url: "https://www.bea.gov/data/gdp/gdp-state"
      description: "Gross domestic product by state and industry, current dollars, 2025 annual estimates."
