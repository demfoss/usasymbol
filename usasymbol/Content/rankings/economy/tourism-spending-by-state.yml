  - id: "why-nevada-has-biggest-tourism-economy"
    title: "Why Nevada Has the Biggest Tourism Economy"
    paragraphs:
      - "Nevada legalized casino gambling statewide in 1931, the same year work began on Hoover Dam, and Las Vegas grew into a city built on entertainment, as the [casinos by state](/rankings/culture/casinos-by-state) list also shows. Its mega resorts combine hotel rooms, restaurants, shows, and convention space under one roof, so a visitor's spending lands heavily in the lodging and food categories."
      - "The state has no personal income tax, which leaves its economy leaning on visitor-driven businesses. At $34,276 million, Nevada's hotel and food sector is larger than that of Pennsylvania, a state with about four times as many people."

  - id: "tourism-dollars-by-state"
    title: "Tourism Dollars by State"
    paragraphs:
      - "California produces the most in raw dollars at $126,929 million, followed by Florida at $78,818 million and Texas at $77,220 million. These totals track the [GDP by state](/rankings/economy/gdp-by-state) order closely. Big populations and big cities such as Los Angeles, Houston, and New York City fill these totals with restaurants as much as hotels."
      - "Delaware's 1.99% share is the smallest of any state. Its economy leans on banking and corporate law, since a majority of Fortune 500 companies are legally incorporated there, which makes its overall GDP large next to its modest hospitality sector."
