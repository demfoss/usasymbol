faq:
  - question: "Which state has the biggest tourism economy?"
    answer: "Nevada, where hotels, restaurants, and related businesses produce 12.18% of state GDP. Las Vegas resorts handle lodging, dining, and entertainment together."
  - question: "Which state depends the least on tourism?"
    answer: "Delaware, at 1.99% of state GDP. Nebraska (2.22%) and Iowa (2.24%) are next, both inland farm states without major destination attractions."
  - question: "How much does Hawaii make from tourism?"
    answer: "Hawaii's accommodation and food services produce $11,799 million, or 9.58% of its economy. Waikiki alone holds a dense cluster of beachfront hotels."
  - question: "Which state earns the most dollars from visitors?"
    answer: "California, with $126,929 million of accommodation and food services output. Florida follows with $78,818 million and Texas with $77,220 million."
  - question: "How important is tourism to Florida's economy?"
    answer: "Florida's accommodation and food services produce 4.37% of its GDP, or $78,818 million. Walt Disney World, which opened near Orlando in 1971, anchors a cluster of theme parks that draws visitors from around the world."
  - question: "Does this include spending by local residents?"
    answer: "Yes. Restaurants and bars count in full whether the customer is a tourist or a neighbor, which is why even low-ranking states show a sizable total. States where visitors dominate, such as Nevada and Hawaii, still stand out clearly."

