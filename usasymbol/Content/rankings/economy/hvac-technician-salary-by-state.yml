    paragraphs:
      - "Alaska leads at $80,150, with a workforce of just 610 employees. HVAC work includes cold-weather heating and commercial refrigeration, giving technicians important assignments even in a state associated with long winters. Local prices above the national average also raise the pay needed to recruit technicians."
      - "Illinois averages $77,570 and has a median of $77,410, putting the middle worker close to the state average. That makes its high pay less dependent on a small upper end than a mean alone might suggest. Related [plumber salaries](/rankings/economy/plumber-salary-by-state) compare another trade that works on many of the same building projects."
