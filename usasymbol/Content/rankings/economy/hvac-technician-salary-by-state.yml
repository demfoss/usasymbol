seo:
  title: "HVAC Technician Salary by State | Map & Rankings"
  description: "HVAC technicians average $80,150 a year in Alaska and $51,150 in Arkansas. North Dakota leads after living costs, and Florida has the most jobs."
page:
  h1: "HVAC Technician Salary by State"
  quick_answer:
    - "HVAC technician salary by state peaks in Alaska at $80,150 a year. Heating and refrigeration belong to this occupation too, so the coldest state can lead an industry often associated with air conditioning."
    - "Arkansas has the lowest average HVAC technician pay at $51,150. Lower local prices soften that gap, but its adjusted salary of $58,836 still sits near the bottom."
    - "Florida employs 39,160 HVAC technicians, the largest workforce, yet pays $57,310 on average. Year-round cooling work creates a large service market without guaranteeing the highest wages."
  methodology: "BLS OEWS May 2025 mean and median wages and employment, SOC 49-9021, all 50 states. Adjusted pay is mean annual wage divided by BEA 2024 all-items RPP and multiplied by 100. DC and self-employed workers are excluded."
  sources:
    - name: "BLS OEWS May 2025 state time-series estimates"
      url: "https://downloadt.bls.gov/pub/time.series/oe/"
      description: "SOC 49-9021 employment, mean annual and hourly wages, annual median, and employment per 1,000 jobs"
    - name: "BEA Regional Price Parities by State"
      url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area"
      description: "2024 all-items state price indexes used to calculate adjusted wages"
    - name: "BLS Occupational Outlook Handbook, HVAC technicians"
      url: "https://www.bls.gov/ooh/installation-maintenance-and-repair/heating-air-conditioning-and-refrigeration-mechanics-and-installers.htm"
      description: "Occupation scope, workplaces, contractor employment, and work schedules"
    - name: "BLS wage comparisons and geographic pay differences"
      url: "https://www.bls.gov/oes/earnings.htm"
      description: "How geographic costs, industries, and working conditions affect wages"
    - name: "BLS OEWS concepts"
      url: "https://www.bls.gov/opub/hom/oews/concepts.htm"
      description: "Wage definitions and exclusions, including overtime premiums and self-employment"
