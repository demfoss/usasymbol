page:
  h1: "Average Pet Spending by State 2026"

  quick_answer:
    - "New Jersey has the highest average pet spending in the U.S. among pet-owning households at $4,327 a year, ahead of New Hampshire ($4,276) and Vermont ($3,952)."
    - "Mississippi has the lowest average pet spending at $615 a year, less than one-seventh of New Jersey's figure. Alabama ($641) and Arkansas ($735) are the only other states under $800."
    - "Average pet spending across the 48 states with published data works out to about $2,067 a year. Twenty-seven states fall below that figure, from Florida at $1,944 down to Mississippi at $615."

  methodology: "Figures are average annual pet-related spending per pet-owning household by state, listed for 2025. Alaska and Hawaii are excluded because a per-household average is not listed for those two states."

