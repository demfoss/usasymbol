faq:
  - question: "Which state has the highest pet spending?"
    answer: "New Jersey has the highest average pet spending of any state at $4,327 a year among pet-owning households. New Hampshire ranks second at $4,276, and Vermont is third at $3,952."

  - question: "Which state has the lowest pet spending?"
    answer: "Mississippi has the lowest average pet spending at $615 a year, the only state under $650."

  - question: "What is the average pet spending in California?"
    answer: "California's average pet spending is $3,664 a year, the seventh-highest figure of any state."

  - question: "What is the average pet spending in Texas?"
    answer: "Texas's average pet spending is $1,304 a year, ranking 33rd among the 48 states with published data."

  - question: "How much more do New Jersey pet owners spend than Mississippi pet owners?"
    answer: "New Jersey's average of $4,327 a year is more than seven times Mississippi's $615, a gap of $3,712 between the highest- and lowest-spending states."

  - question: "Why aren't Alaska and Hawaii included in this ranking?"
    answer: "A per-household average pet spending figure is not listed for Alaska or Hawaii in the source data, so both states are left out of this ranking of the other 48 states."

