page:
  h1: "Car Washes by State 2023"
  quick_answer:
    - "California has the most car washes of any state at 2,231, thanks to the largest population in the country and a car-dependent way of life."
    - "Vermont has the fewest car washes at 25, in a state with fewer than 650,000 residents. Alaska is next lowest at 46, with far fewer road-connected communities than its size suggests."
    - "Wyoming has the most car washes for its size at 10.3 per 100,000 residents. Dusty ranch roads and long winters of salted pavement keep trucks coming in for a rinse."
  methodology: "U.S. Census Bureau 2023 County Business Patterns, NAICS 811192 Car Washes, establishments with paid employees. Rate uses Census July 1, 2023 population estimates. Share of U.S. divides each state's count by the U.S. total of 19,807."
