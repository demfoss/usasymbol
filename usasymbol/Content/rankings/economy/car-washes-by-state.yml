faq:
  - question: "Which state has the most car washes?"
    answer: "California has the most car washes, 2,231 in all. Texas is second with 1,858 and Florida third with 1,668."

  - question: "Which state has the fewest car washes?"
    answer: "Vermont has the fewest at 25, followed by Alaska at 46 and Delaware at 55."

  - question: "Which state has the most car washes per capita?"
    answer: "Wyoming leads with 10.3 car washes per 100,000 residents. Iowa follows at 9.4 and Montana at 9.4. Large rural states with dusty roads and winters of road salt do well here."

  - question: "How many car washes are in the United States?"
    answer: "The United States has 19,807 car washes with paid employees, including 9 in the District of Columbia. The 50 states hold the other 19,798."

  - question: "How many car washes are in Texas?"
    answer: "Texas has 1,858 car washes, second only to California. That works out to 6.1 per 100,000 residents, which ranks 23rd. The state has far more [gas stations](/rankings/economy/gas-stations-by-state) than car washes."

  - question: "Does the state with the most car dealerships also have the most car washes?"
    answer: "No. Texas leads for [car dealerships](/rankings/economy/car-dealerships-by-state) at 4,269, but California has more car washes, 2,231 against Texas's 1,858."

