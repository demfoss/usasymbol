sections:
  - id: "why-california-has-the-most-car-washes"
    title: "Why California Has the Most Car Washes"
    paragraphs:
      - "California has 2,231 car washes, about 11% of the national total. Its cities were built around the automobile, with long commutes and few days of rain, so dirty cars are a daily sight and a wash is an easy errand to fit in."
      - "Texas follows with 1,858 and Florida with 1,668. Florida has far fewer residents than California, yet it ranks seventh for car washes per 100,000 residents, helped by constant sun, salt air near the coast, and a steady stream of tourists in rental cars. The biggest states also top the [population](/rankings/demographics/states-by-population) rankings."

  - id: "states-with-the-most-car-washes-per-capita"
    title: "States With the Most Car Washes per Capita"
    paragraphs:
      - "Wyoming has 10.3 car washes per 100,000 residents, ahead of Iowa at 9.4 and Montana at 9.4. These are big rural states where daily driving means gravel, mud, and dust, and winter crews spread salt and other de-icers on the highways. Pickup owners there wash often."
      - "Nebraska (8.4) and Utah (8.2) also top the list, while New York has 964 car washes but only 4.9 per 100,000 residents. Many New Yorkers never own a car, so the big total shrinks once it is spread across the whole state."
