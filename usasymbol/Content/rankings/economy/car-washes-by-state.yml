  - id: "states-with-the-fewest-car-washes"
    title: "States With the Fewest Car Washes"
    paragraphs:
      - "Vermont has only 25 car washes and Alaska 46, simply because so few people live there. Delaware has 55 in one of the smallest states by area."
      - "Relative to population, Mississippi is lowest at 3.5 per 100,000 residents, with Vermont at 3.9 and Minnesota at 4.0. Minnesota is the surprise. Its winters are harsh and its roads are heavily salted, yet it has far fewer car washes per resident than neighboring Iowa at 9.4."
