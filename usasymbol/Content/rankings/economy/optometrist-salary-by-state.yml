faq:
  - question: "What state pays optometrists the most?"
    answer: "Alaska pays the highest mean at $165,120 a year and $79.38 an hour. Its $170,310 median is also the highest state median."
  - question: "How much does an optometrist make in California?"
    answer: "California optometrists average $147,420 annually, with a $136,300 median. The state employs 6,890, more than any other state."
  - question: "How much does an optometrist make in Texas?"
    answer: "Texas optometrists average $124,760 a year and $59.98 an hour. Its workforce of 4,110 ranks second by employment."
  - question: "How much does an optometrist make in Florida?"
    answer: "Florida optometrists average $143,020 annually and earn a $151,670 median. The state has 2,350 employee positions in the occupation."
  - question: "What is the lowest optometrist salary by state?"
    answer: "Montana has the lowest mean at $106,200 a year and $51.06 an hour. Its annual median is $104,280."
  - question: "Does optometrist employment include practice owners?"
    answer: "Owners, partners, and other self-employed optometrists are excluded from these employee estimates. That distinction matters because independent practice is common in the profession."
