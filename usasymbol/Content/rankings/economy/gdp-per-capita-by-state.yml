sections:
  - id: states-with-highest-gdp-per-capita
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With Highest GDP per Capita"
    paragraphs:
      - "New York leads at $123,273 per resident. Wall Street finance, corporate headquarters, media and professional services concentrate high-value production in New York City, lifting output per person beyond the state's already large total GDP."
      - "Delaware reaches $115,043 with only about 1.1 million residents. Its finance and corporate-services footprint is unusually large for its population, while Massachusetts combines biotechnology, higher education, health care and technology to rank third at $113,724."
    table:
      columns: { rank: "Rank", state: "State", value: "GDP per Capita" }
