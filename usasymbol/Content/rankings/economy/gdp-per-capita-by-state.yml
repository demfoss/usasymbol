  - id: states-with-lowest-gdp-per-capita
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With Lowest GDP per Capita"
    paragraphs:
      - "Mississippi ranks 50th at $55,117 per resident. Manufacturing and agriculture matter to its economy, but the state has a smaller concentration of high-output finance, information and corporate-management activity than New York or Delaware."
      - "Arkansas ranks 49th at $62,922 and West Virginia ranks 48th at $63,020. Arkansas has large logistics and food-processing businesses, while West Virginia remains tied to energy and resource industries, yet neither produces the same output per resident as the finance and technology leaders."
