page:
  h1: "GDP per Capita by State 2025"
  quick_answer:
    - "GDP per capita by state is highest in New York at $123,273 in 2025. Finance, information and professional services generate high output in its large metropolitan economy."
    - "Delaware ranks second at $115,043, followed by Massachusetts at $113,724. Corporate and financial activity lifts Delaware despite its small population."
    - "Mississippi ranks last at $55,117 per resident. Its industry mix contains fewer high-output finance, technology and corporate-management activities than the leading states."
  methodology: "GDP per capita divides 2025 current-dollar GDP from BEA table SAGDP1 by Census Vintage 2025 resident population. Results are rounded to the nearest dollar."
