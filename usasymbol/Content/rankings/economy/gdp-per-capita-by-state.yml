faq:
  - question: "Which state has the highest GDP per capita?"
    answer: "New York ranks first at $123,273 per resident in 2025. High-value finance and professional services are concentrated in its largest city."
  - question: "Which state has the lowest GDP per capita?"
    answer: "Mississippi ranks last at $55,117. Its output per resident is less than half New York's figure."
  - question: "What is California GDP per capita?"
    answer: "California produces $109,196 per resident, ranking fifth. Its technology, entertainment and professional-services industries add high-value output to the nation's largest state economy."
  - question: "Why is Delaware GDP per capita so high?"
    answer: "Delaware pairs a small resident population with a large finance and corporate-services sector. That combination places it second at $115,043 per resident."
  - question: "Is GDP per capita the same as average income?"
    answer: "No. GDP per capita divides all production by population, including business profits and government output. It is not the amount received by an average household or worker."
  - question: "What is Texas GDP per capita?"
    answer: "Texas ranks 13th at $92,474 per resident. Its $2.93 trillion economy is enormous, but the total is divided among more than 31.7 million residents."

