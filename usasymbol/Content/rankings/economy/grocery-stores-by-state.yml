page:
  h1: "Grocery Stores by State 2023"
  quick_answer:
    - "Grocery stores by state are led by New York with 8,320 supermarket and grocery establishments. Dense city neighborhoods support many small, walkable food stores."
    - "Wyoming has the fewest grocery establishments at 93. Its small population is spread among widely separated communities, leaving fewer local shopping markets."
    - "California follows New York with 8,044 establishments. Florida ranks third at 3,850, while Texas ranks fourth at 3,739."
