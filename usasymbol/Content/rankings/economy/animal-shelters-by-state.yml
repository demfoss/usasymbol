sections:
  - id: "states-with-the-most-animal-shelters"
    icon: "fa-solid fa-paw"
    title: "States With the Most Animal Shelters"
    paragraphs:
      - "Florida's 146 animal shelters top every other state, ahead of California's 141 and Texas's 122. All 3 also rank among the nation's most populous states, so their raw-count lead reflects sheer scale as much as anything else."
      - "Michigan and Ohio tie for 4th with 114 each, and Tennessee (94) rounds out the top 5. Wyoming sits at the opposite end with just 12, the fewest of any state reported."
    table:
      numbered: true
      columns:
        state: "State"
        shelters: "Animal Shelters"
      rows:
        - state: "Florida"
          shelters: 146
        - state: "California"
          shelters: 141
        - state: "Texas"
          shelters: 122
        - state: "Michigan"
          shelters: 114
        - state: "Ohio"
          shelters: 114
        - state: "Tennessee"
          shelters: 94
        - state: "Georgia"
          shelters: 93
        - state: "Kentucky"
          shelters: 92
        - state: "Virginia"
          shelters: 89
        - state: "North Carolina"
          shelters: 88

  - id: "why-rural-states-have-more-shelters-per-capita"
    icon: "fa-solid fa-house-chimney"
    title: "Why Rural States Have More Shelters Per Capita"
    paragraphs:
      - "Maine's 2.81 shelters per 100,000 residents lead every state, nearly 10 times New Jersey's rate of 0.28, even though Maine has just 40 total shelters against New Jersey's 27. Research from Best Friends Animal Society found that the most rural counties see 25.0 shelter intakes per 1,000 residents, more than double the 10.7 rate in the most urban counties."
      - "That gap traces to access, not neglect. Rural areas have higher pet ownership rates but far less access to spay and neuter services, veterinary care, and public animal control, conditions researchers describe as 'shelter deserts' that leave small local shelters covering wide, sparsely populated territory."

