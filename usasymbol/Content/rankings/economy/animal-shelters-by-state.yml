    - "Maine has the most animal shelters per capita, about 2.8 per 100,000 residents, nearly 10 times New Jersey's rate of 0.3, the lowest of any state."

  methodology: "Counts reflect animal shelter listings compiled by a national business directory as of July 2026 and fluctuate as organizations open, close, or merge. Delaware is not separately broken out in the source data and is excluded from the table. Per-capita figures are calculated using each state's population."

