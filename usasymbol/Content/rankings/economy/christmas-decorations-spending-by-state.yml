faq:
  - question: "Which state spends the most on Christmas decorations?"
    answer: "Maryland spends the most among states with a published figure, an average of $264 a year. New Mexico is second at $240, and Oklahoma is third at $220."

  - question: "Which state spends the least on Christmas decorations?"
    answer: "Delaware spends the least at $95 a year. Maine is next lowest at $99, followed by Nebraska at $107."

  - question: "What is the average Christmas decoration budget in Texas?"
    answer: "Texas households average $207 a year on Christmas decorations, the sixth-highest figure among states with published data."

  - question: "How much do people spend on Christmas decorations in Pennsylvania?"
    answer: "Pennsylvania households average $109 a year, the fourth-lowest figure recorded in the survey."

  - question: "Do Southern states spend more on Christmas decorations?"
    answer: "Seven of the ten highest-spending states, including Maryland ($264), Kentucky ($212), and Texas ($207), are in the South. North Carolina ($129) is the only Southern state that falls into the bottom ten instead."

  - question: "Is Christmas decoration spending the same in every state?"
    answer: "No. Spending ranges from $264 a year in Maryland down to $95 in Delaware, a gap of $169 between the highest and lowest states recorded."

