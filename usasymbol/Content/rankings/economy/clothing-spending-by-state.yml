        - { rank: 10, state: "Connecticut", per_capita: "$1,726" }

  - id: "states-with-lowest-clothing-spending"
    title: "States With Lowest Clothing Spending"
    paragraphs:
      - "Vermont records $1,172 per resident, followed by West Virginia at $1,181 and New Mexico at $1,204. Vermont exempts qualifying clothing and footwear from sales tax, so the checkout price lacks a charge that is part of clothing outlays in many other states."
      - "Vermont's statewide total is $755.3 million, the smallest clothing and footwear market in the table. Alaska is next at $947.4 million, although its $1,285 per-person figure places it eight spots above Vermont."

  - id: "largest-clothing-markets-by-state"
    title: "Largest Clothing Markets by State"
    paragraphs:
      - "California's total reaches $83.13 billion, nearly two-thirds larger than Texas at $51.05 billion. New York follows at $38.95 billion and Florida at $32.51 billion. Population turns the total-dollar list into a different picture from the per-person ranking."
      - "Wyoming shows the reversal most clearly. It ranks second per person but only $1.19 billion statewide, while Texas ranks fifteenth per person and second in total dollars."
