sections:
  - id: "why-california-spends-most-on-clothing"
    title: "Why California Spends Most on Clothing"
    paragraphs:
      - "California reaches $2,112 per resident. Its current-dollar figure carries the effect of local prices, and California had the highest overall state price level in 2024. The [cost of living by state](/rankings/economy/states-by-cost-of-living) comparison shows how far prices vary across the country."
      - "California also applies sales tax to most clothing purchases, adding to the purchaser price recorded in spending. The [sales tax by state](/rankings/taxes/sales-tax-by-state) table explains the broader state-rate differences."
