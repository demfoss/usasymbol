faq:
  - question: "Which state spends the most on clothing?"
    answer: "California spends the most at $2,112 per resident in 2025. The figure is measured in current dollars, so California's high price level and tax on most clothing purchases raise the amount recorded at checkout."
  - question: "Which state spends the least on clothing?"
    answer: "Vermont spends the least at $1,172 per resident. Qualifying clothing and footwear are exempt from Vermont sales tax, unlike many other tangible goods sold in the state."
  - question: "How much does California spend on clothing?"
    answer: "California records $83.13 billion in clothing and footwear purchases, equal to $2,112 per resident. It ranks first by both measures."
  - question: "How much does Texas spend on clothing?"
    answer: "Texas records $51.05 billion in clothing and footwear spending, or $1,610 per resident. Its large population puts it second in total dollars but fifteenth per person."
  - question: "Does clothing spending include shoes?"
    answer: "Yes. The category combines clothing and footwear, including women's and girls' clothing, men's and boys' clothing, children's and infants' clothing, other clothing materials, and shoes."
  - question: "Does back-to-school clothing count?"
    answer: "Yes. School clothes and shoes fall within the clothing and footwear category. Separate survey-based [back-to-school spending by state](/rankings/economy/back-to-school-spending-by-state) also includes supplies and electronics, so its scope is wider."

