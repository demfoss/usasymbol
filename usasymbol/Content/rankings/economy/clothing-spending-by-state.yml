page:
  h1: "Clothing Spending by State"
  quick_answer:
    - "Clothing spending by state is highest in California at $2,112 per resident in 2025. High prices and sales tax on most clothing raise current-dollar outlays."
    - "Wyoming ranks second at $2,026 per person, even though its $1.19 billion statewide market is among the smallest because few people live there."
    - "Vermont has the lowest spending at $1,172 per resident. Clothing and footwear are exempt from Vermont sales tax, unlike most tangible goods sold there."
  methodology: "BEA SAPCE3 2025 current-dollar clothing and footwear PCE divided by BEA SAINC1 midyear population. Totals are millions of dollars and exclude clothing services."
  sources:
    - { name: "U.S. Bureau of Economic Analysis, SAPCE3", url: "https://apps.bea.gov/regional/downloadzip.htm", description: "State personal consumption expenditures by type of product for 2025." }
    - { name: "U.S. Bureau of Economic Analysis, SAINC1", url: "https://apps.bea.gov/regional/downloadzip.htm", description: "State midyear population estimates used for the per-person calculation." }
    - { name: "BEA Regional Price Parities", url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area", description: "Official comparison of state price levels, including California's highest state price level in 2024." }
