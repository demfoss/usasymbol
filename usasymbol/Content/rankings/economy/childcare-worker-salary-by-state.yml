  - id: why-childcare-pay-varies-by-state
    icon: fa-solid fa-scale-balanced
    title: Why Childcare Pay Varies by State
    paragraphs:
      - "California's $20.57 average hourly wage sits in a labor market with a state minimum above the federal floor. A higher [minimum wage](/rankings/economy/minimum-wage-by-state) lifts the legal starting point for covered entry-level work, including childcare."
      - "Mississippi's $11.69 hourly average belongs to a state with no separate minimum wage law and some of the lowest household prices. The federal floor applies to covered employers there. Lower local living costs also reduce the wage pressure that expensive housing creates in California."
  - id: states-with-the-most-childcare-jobs
    icon: fa-solid fa-building
    title: States With the Most Childcare Jobs
    paragraphs:
      - "California employs 52,780 childcare workers, the largest state workforce. Childcare follows families' working hours, with early arrivals and late pickups extending a center's day beyond an ordinary school schedule. Staffing those hours connects labor costs directly to [childcare fees](/rankings/economy/average-childcare-costs)."
      - "Texas employs 34,160 workers at an average of $29,050 a year. School-age care adds another setting for the occupation, as workers supervise homework and activities while parents finish their workday."
