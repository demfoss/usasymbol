  title: Childcare Worker Salary by State | Map & Pay
  description: Childcare workers average $42,790 a year in California and $24,310 in Mississippi. California also has the largest workforce.
page:
  h1: Childcare Worker Salary by State
  quick_answer:
    - "Childcare worker salary by state is highest in California at $42,790 a year. High housing costs and a statewide wage floor above the federal minimum help shape its pay market."
    - "Mississippi averages $24,310, the lowest state wage. Low local prices and the absence of a state minimum wage create a different wage environment from California."
    - "New York employs 44,020 childcare workers. The occupation includes staff who care for children before and after school as well as those working with infants and toddlers."
  methodology: "BLS OEWS May 2025 childcare worker estimates, SOC 39-9011, ranked by mean annual wage across 50 states, excluding DC and self-employment, with Vermont employment suppressed. Price context uses BEA RPP 2024."
