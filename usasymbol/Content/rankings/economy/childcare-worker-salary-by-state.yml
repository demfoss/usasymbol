faq:
  - question: What state pays childcare workers the most?
    answer: "California has the highest annual mean at $42,790. Washington has the highest median at $41,680, so the state with the highest average differs from the state with the highest midpoint wage."
  - question: How much does a childcare worker make in Massachusetts?
    answer: "Massachusetts averages $42,580 a year, or $20.47 an hour. Childcare work includes helping young children learn routines and get along with others."
  - question: How much does a childcare worker make in Texas?
    answer: "Texas workers average $29,050 annually and $13.96 an hour. Childcare work can combine meals, hygiene, play, and supervision rather than classroom instruction alone."
  - question: What is the childcare worker salary in New York?
    answer: "New York's annual mean is $39,690. Caregivers also monitor children's development and discuss signs of difficulties with parents."
  - question: Which state has the lowest childcare worker salary?
    answer: "Mississippi is last at $24,310 annually. Caring for younger children includes preparing meals and snacks as well as supervising play."
  - question: How much does a childcare worker make in Washington?
    answer: "Washington's mean annual wage is $42,400 and its median is $41,680. Caring for infants can involve feeding and changing diapers, while older children need supervised play and activities."
