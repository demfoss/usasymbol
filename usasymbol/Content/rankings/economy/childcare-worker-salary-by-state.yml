    icon: fa-solid fa-children
    title: Highest Paying States for Childcare Workers
    paragraphs:
      - "California leads at $42,790 in a state with the country's highest housing-rent price level. A center competes for staff in the same local labor market as shops, schools, and other employers. High rent gives that competition a concrete cost for workers to cover."
