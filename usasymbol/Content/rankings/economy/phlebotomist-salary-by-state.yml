faq:
  - question: "What state pays phlebotomists the most?"
    answer: "California pays the highest mean at $56,600 a year and $27.21 an hour. Its $56,040 median also leads the 50-state table."
  - question: "How much does a phlebotomist make in California?"
    answer: "California phlebotomists average $56,600 annually, with a $56,040 median. The state employs 13,520, more than any other state."
  - question: "How much does a phlebotomist make in Texas?"
    answer: "Texas phlebotomists average $42,630 a year and $20.50 an hour. Its workforce of 12,820 is second only to California."
  - question: "How much does a phlebotomist make in Florida?"
    answer: "Florida phlebotomists average $41,990 annually and earn a median of $40,230. The state has 10,220 jobs in the occupation."
  - question: "What is the lowest phlebotomist salary by state?"
    answer: "Mississippi has the lowest mean at $36,710 a year and $17.65 an hour. Its annual median is $36,290."
  - question: "Where do phlebotomists work?"
    answer: "Phlebotomists work in hospitals, medical and diagnostic laboratories, blood donor centers, and physician offices. Their central task is collecting blood safely and keeping each specimen correctly identified."
