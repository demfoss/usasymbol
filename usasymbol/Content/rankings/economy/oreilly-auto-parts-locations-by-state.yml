faq:
  - question: "Which state has the most O'Reilly Auto Parts locations?"
    answer: "Texas has the most O'Reilly Auto Parts locations with 878. The state's many metro areas and long road network create numerous markets for neighborhood parts stores."

  - question: "How many O'Reilly Auto Parts stores are in Texas?"
    answer: "Texas has 878 O'Reilly Auto Parts stores and ranks first. California follows with 614."

  - question: "How many O'Reilly Auto Parts stores are in California?"
    answer: "California has 614 O'Reilly Auto Parts locations, the second-highest state total. The chain gained much of its western reach through expansion and acquisitions."

  - question: "Which states have no O'Reilly Auto Parts stores?"
    answer: "Delaware and New Jersey have no listed O'Reilly Auto Parts stores. Maryland has the smallest nonzero footprint with 11."

  - question: "How many O'Reilly Auto Parts stores are in Florida?"
    answer: "Florida has 318 O'Reilly Auto Parts stores and ranks third. Its long peninsula contains several large metro areas separated by major driving corridors."

  - question: "Where was O'Reilly Auto Parts founded?"
    answer: "O'Reilly Auto Parts was founded in Springfield, Missouri, in 1957. Missouri now has 217 stores and ranks eighth."

