  description: "Plumbers earn the most in Oregon at $98,450 a year on average and the least in Arkansas at $50,640. Illinois has the highest median pay, $99,950."

page:
  h1: "Plumber Salary by State 2026"

  quick_answer:
    - "Plumber salary by state is highest in Oregon, where plumbers, pipefitters, and steamfitters average $98,450 a year ($47.33 an hour). Industrial projects such as chip plants keep pipefitting pay high there."
    - "Arkansas pays plumbers the least at $50,640 a year, the only state under $55,000. Prices run well below the national level, and Arkansas has had a right-to-work law since 1944, one of the first in the country."
    - "California employs more plumbers than any other state, 47,660, yet ranks only 21st once prices are counted. Living costs 10.7% above the national level shrink its $82,320 average to $74,363 in buying power."

  methodology: "Mean and median wages and employment for plumbers, pipefitters, and steamfitters (SOC 47-2152), BLS OEWS May 2025 estimates. Adjusted wage divides the mean annual wage by BEA 2024 all-items Regional Price Parities. DC is excluded."

  sources:
