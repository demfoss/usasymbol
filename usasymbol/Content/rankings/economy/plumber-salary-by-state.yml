  - id: "lowest-paying-states-for-plumbers"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Paying States for Plumbers"
    paragraphs:
      - "Arkansas pays plumbers the least, $50,640 a year or $24.35 an hour. Prices there run well below the national level, which lets employers hire for less. Arkansas also put a right-to-work rule in its constitution in 1944, the same year as Florida, and the South still has some of the lowest [union membership rates](/rankings/economy/union-membership-rate-by-state) in the country."
      - "South Dakota ($55,530), South Carolina ($55,890), Florida ($56,030), and Mississippi ($56,690) complete the bottom five. Florida stands out, since with 29,260 jobs it has the third largest plumbing workforce of any state and a booming home building market, yet it pays less than all but three states."
