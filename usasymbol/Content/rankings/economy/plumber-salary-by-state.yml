  - id: "states-with-the-most-plumber-jobs"
    icon: "fa-solid fa-wrench"
    title: "States With the Most Plumber Jobs"
    paragraphs:
      - "California has the most plumber jobs, 47,660, followed by Texas with 44,090 and Florida with 29,260. Big populations and steady home building explain those totals. Measured against the size of each state's workforce, though, none of the three leads."
      - "Louisiana has the highest concentration, 4.32 plumbers per 1,000 jobs. Refineries and petrochemical plants along the Mississippi River between Baton Rouge and New Orleans need pipefitters to build and maintain their pipe networks. Maine ranks second at 4.23, and Bath Iron Works, the shipyard that builds Navy destroyers, hires pipefitters among its trades."
