  - id: "plumber-salary-adjusted-for-cost-of-living"
    icon: "fa-solid fa-scale-balanced"
    title: "Plumber Salary Adjusted for Cost of Living"
    paragraphs:
      - "Missouri makes the biggest jump into the top ten once prices are counted, rising from 18th to 10th. Its plumbers average $75,010, but living costs about 9% below the national level stretch that to $82,610 in buying power. Wisconsin climbs from 8th to 3rd for the same reason."
      - "New Hampshire falls the furthest, from 30th to 41st, because its prices run 4.2% above average. Florida slides to last place after adjustment, since its prices sit above the national level while its wages sit near the bottom. Our [cost of living by state](/rankings/economy/states-by-cost-of-living) ranking shows where everyday prices run highest."
