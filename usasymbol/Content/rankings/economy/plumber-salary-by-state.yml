sections:
  - id: "why-oregon-pays-plumbers-the-most"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Why Oregon Pays Plumbers the Most"
    paragraphs:
      - "Oregon pays plumbers more than any other state, an average of $98,450 a year. The job category includes pipefitters and steamfitters, and Oregon gives them plenty of industrial work. Intel's chip plants in Hillsboro depend on precise piping for ultrapure water and process gases, a far cry from fixing a kitchen sink."
      - "Illinois ranks second at $93,400 and has the highest median of any state, $99,950. Chicago's Plumbers Local 130 is famous well beyond the trade, since its members have dyed the Chicago River green for St. Patrick's Day since 1962. New Jersey, Alaska, and Massachusetts round out the top five, each above $90,000."
