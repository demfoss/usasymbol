  - question: "What state pays plumbers the most?"
    answer: "Oregon, at $98,450 a year on average. Illinois ($93,400) and New Jersey ($92,590) follow, and all three pay well above the $50,640 average in last-place Arkansas."

  - question: "Where do plumbers make the most after cost of living?"
    answer: "Oregon still leads at $95,213 in buying power. Illinois stays second at $93,400 because its prices match the national level almost exactly. Wisconsin is the big climber, jumping to 3rd at $90,032."

  - question: "How much does a plumber make in Texas?"
    answer: "Texas plumbers average $60,780 a year, or $29.22 an hour, which ranks 37th. Only California has more plumber jobs than the 44,090 in Texas."

