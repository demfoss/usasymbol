sections:
  - id: highest-correctional-officer-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Correctional Officer Salaries"
    paragraphs:
      - "California leads at $92,410, while median pay is $96,370. High housing and other household costs put pressure on employers to offer more when recruiting workers, a concrete mechanism behind geographic wage differences. California still leads after price adjustment, however, so its premium is larger than the state's higher household prices alone can explain."
      - "California's $44.43 hourly average combines officers working for different correctional employers, rather than one statewide starting-pay schedule. State prisons, local jails, and federal facilities have distinct employers and compensation systems. Comparing [police officer salaries](/rankings/economy/police-officer-salary-by-state) offers another public-safety benchmark, but patrol officers and correctional staff perform different work."
