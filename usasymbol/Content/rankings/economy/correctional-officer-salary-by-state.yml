  - id: lowest-correctional-officer-salaries
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Correctional Officer Salaries"
    paragraphs:
      - "Mississippi trails at $40,550, with median pay of $38,720. Lower household prices help explain part of its lower wage level by reducing what a paycheck must cover. Its adjusted buying power reaches $46,634 but remains last, leaving a difference that prices alone do not resolve."
      - "Mississippi employs 4,040 correctional officers and jailers, with 3.473 per 1,000 jobs. State prisons and local jails use different employers and pay schedules, while both need staff to maintain order, search facilities, and escort people in custody."
