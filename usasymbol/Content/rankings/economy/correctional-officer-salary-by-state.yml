map:
  caption: "California correctional officers average $92,410 annually, compared with $40,550 in Mississippi. Rhode Island's suppressed wages remain unshaded."
  metric_key: mean_annual
  metric_label: "Average annual correctional officer salary"
  name_key: state
  color_scheme: green
  color_scale: linear
