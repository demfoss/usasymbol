seo:
  title: "Correctional Officer Salary by State | Map & Pay"
  description: "Correctional officers average $92,410 in California and $40,550 in Mississippi. Texas has the largest reported workforce at 44,700."
page:
  h1: "Correctional Officer Salary by State"
  quick_answer:
    - "Correctional officer salary by state is highest in California at $92,410 annually. Higher household costs help explain a wage premium, but California remains first after prices, so expenses do not erase its pay advantage."
    - "Mississippi averages $40,550, lowest among states with reported wages. Cheaper household purchases raise its comparable buying power, yet leave it last, showing that living costs explain only part of the gap."
    - "Virginia and Alabama tie for the largest change after prices, each moving ten places in opposite directions. Local household prices can strengthen one state's wage and weaken another's purchasing power."
  methodology: "BLS OEWS May 2025 correctional officer and jailer estimates, SOC 33-3012, with Rhode Island suppressed. Adjusted pay is mean wage divided by BEA 2024 all-items RPP times 100, excluding DC, bailiffs, and self-employed workers."
