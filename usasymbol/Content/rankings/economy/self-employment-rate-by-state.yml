    paragraphs:
      - "California has 2,222,859 self-employed workers, the most of any state, followed by Texas with 1,588,506 and Florida with 1,423,413. Film and music freelancers, farm operators, and independent consultants all count in California's total."
      - "Florida's 12.7% is the highest rate among the three. Real estate agents, building contractors, and boat captains mostly work for themselves there. Workers who can run a business from a laptop add to the total in every state, and the [remote work percentage by state](/rankings/economy/remote-work-percentage-by-state) shows where that is most common."
