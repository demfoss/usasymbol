sections:
  - id: "why-montana-leads-in-self-employment"
    title: "Why Montana Leads in Self-Employment"
    paragraphs:
      - "Montana counts 84,975 self-employed workers among 571,950 employed residents. Ranching and farming are the classic owner-operated jobs, and Montana adds hunting and fishing outfitters, guides, builders, and trades workers who serve small towns where no large employer is within driving distance."
      - "Vermont follows at 13.6%, with small dairy farms, maple producers, and craft food makers. Wyoming (12.6%) and Maine (12.5%) show the same rural pattern, since sparse states with few big companies leave more people to work for themselves."

  - id: "states-with-the-lowest-self-employment-rate"
    title: "States With the Lowest Self-Employment Rate"
    paragraphs:
      - "West Virginia sits last at 6.7%, with 51,208 self-employed workers among 766,794. Coal companies, hospitals, schools, and government agencies supply a large share of the jobs there."
      - "Indiana (7.8%) and Ohio (8.0%) come next. Auto parts plants and steel mills hired generations of workers in both states, a tradition of steady paychecks from large employers."
