seo:
  title: "Self-Employment Rate by State 2026 | Map & Rankings"
  description: "Montana has the highest self-employment rate at 14.9% of workers. West Virginia has the lowest at 6.7%. Rates for all 50 states on one map."

page:
  h1: "Self-Employment Rate by State 2026"

  quick_answer:
    - "Self-employment rate by state is highest in Montana at 14.9% of workers, a result of ranches, outfitters, and small-town trades where owner-operators fill the gaps big employers leave."
    - "West Virginia has the lowest rate at 6.7%. Coal companies, hospitals, schools, and government agencies supply most of the jobs there, which leaves fewer residents running a business of their own."
    - "Florida ranks third at 12.7%, the highest rate among the largest states. Real estate agents, building contractors, and boat captains make up much of its 1,423,413 self-employed workers."

  methodology: "American Community Survey 2024 1-year estimates, table B24080. Self-employed means owners of incorporated or unincorporated businesses among civilian employed residents 16 and older, excluding unpaid family workers. DC and Puerto Rico are excluded."

  sources:
    - name: "U.S. Census Bureau, American Community Survey 2024 1-Year Estimates, Table B24080"
      url: "https://data.census.gov/table/ACSDT1Y2024.B24080"
      description: "Sex by class of worker for the civilian employed population 16 years and over"

