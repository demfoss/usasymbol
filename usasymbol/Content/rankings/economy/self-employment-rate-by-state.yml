faq:
  - question: "Which state has the highest self-employment rate?"
    answer: "Montana, where 84,975 of 571,950 employed residents run their own business. Vermont and Florida follow."

  - question: "What is the self-employment rate in Florida?"
    answer: "Florida's rate is 12.7%, third highest in the country, covering 1,423,413 workers. Real estate sales, construction trades, and boat and fishing guides keep many Floridians working on their own."

  - question: "What is the self-employment rate in California?"
    answer: "California's rate is 11.6%, eighth highest. Its 2,222,859 self-employed workers are the most of any state."

  - question: "Which state has the lowest self-employment rate?"
    answer: "West Virginia at 6.7%, followed by Indiana at 7.8%. Large employers such as hospitals, factories, and government agencies supply much of the work in both states."

  - question: "What is the self-employment rate in Texas?"
    answer: "Texas has a 10.4% rate, tied with Nevada at 15th. Its 1,588,506 self-employed workers are the second most in the country. Anyone weighing a launch there can compare the [best states to start a business](/rankings/economy/best-states-to-start-a-business)."

  - question: "How many people are self-employed in New York?"
    answer: "New York has 964,856 self-employed workers, or 9.9% of its employed residents. That ties Arizona and Connecticut at 22nd."

