map:
  title: "Licensed Practical Nurse Salary Map"
  image_alt: "State map of LPN and LVN salaries, highest in Washington and lowest in Mississippi"
  caption: "Washington averages $83,900 a year for LPNs and LVNs. California follows at $82,340, while Mississippi averages $51,450."
  metric_key: mean_annual
  metric_label: "Average annual LPN and LVN salary"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-lpn-salaries
    icon: "fa-solid fa-stethoscope"
    title: "Highest Paying States for LPNs"
    paragraphs:
      - "Washington leads at $83,900 in a labor market where prices exceed the national level. Nurses must cover the same housing and everyday expenses as other local workers, creating pressure for higher wages. Its $78,402 price-adjusted salary remains second, so expensive living explains only part of the dollar premium."
      - "California's $82,340 average includes licensed vocational nurses, while Washington uses the licensed practical nurse title. Responsibilities are closely related, with basic bedside care, monitoring, and reporting to nurses and doctors. Comparing this table with [registered nurse salaries](/rankings/economy/nurse-salary-by-state) keeps two different levels of nursing work separate."
    table:
      columns:
        rank: "Rank"
        state: "State"
        mean_annual: "Avg. Annual Salary"
        mean_hourly: "Avg. Hourly Wage"
      rows:
        - rank: 1
