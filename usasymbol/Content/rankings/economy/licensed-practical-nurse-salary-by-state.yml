      description: "Titles, duties, employment settings, and schedules"
    - name: "BLS Geographic and Industry Wage Differences"
      url: "https://www.bls.gov/oes/earnings.htm"
      description: "Geographic prices, employer setting, and experience as influences on occupational pay"
