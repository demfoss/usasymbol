      - "Mississippi's $51,450 average belongs to a lower-price labor market, where employers recruit against less expensive housing and everyday purchases. That helps explain lower nominal wages, but its last-place adjusted salary shows the gap extends beyond living costs. The table does not isolate how much employer mix or experience contributes."
      - "Mississippi has 9,850 LPN jobs and 8.473 per 1,000 jobs. Low pay therefore does not mean the occupation is uncommon. Practical nurses work across nursing facilities, hospitals, offices, and patients' homes, and the mix of those workplaces can affect an average without changing the occupation's name."
