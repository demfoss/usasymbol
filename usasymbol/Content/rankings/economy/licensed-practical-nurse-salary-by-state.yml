seo:
  title: "Licensed Practical Nurse Salary by State | Map & Pay"
  description: "Licensed practical nurses average $83,900 a year in Washington and $51,450 in Mississippi. California has the most LPN and LVN jobs."
page:
  h1: "Licensed Practical Nurse Salary by State"
  quick_answer:
    - "Licensed practical nurse salary by state is highest in Washington at $83,900 a year. Higher local prices help explain the wage premium, though Oregon takes first place after purchasing power is counted."
    - "Mississippi averages $51,450, the lowest LPN salary. Its lower prices lift that wage to $59,170 at national prices, but do not close the gap with any other state."
    - "California has 82,850 LPN and LVN jobs, the largest employment total. Both titles belong to the same occupation, so California's vocational nurses are included rather than treated as a different nursing career."
  methodology: "BLS OEWS May 2025 employee wages for LPNs and LVNs, SOC 29-2061, cover all 50 states and exclude DC and self-employment. Adjusted annual pay divides mean wages by BEA 2024 all-items RPP relative to national prices."
  sources:
    - name: "BLS OEWS May 2025 occupational series"
      url: "https://downloadt.bls.gov/pub/time.series/oe/"
      description: "State wages, employment, and jobs per 1,000 for SOC 29-2061"
    - name: "BEA Regional Price Parities"
      url: "https://apps.bea.gov/regional/zip/SARPP.zip"
      description: "2024 all-items state price levels"
