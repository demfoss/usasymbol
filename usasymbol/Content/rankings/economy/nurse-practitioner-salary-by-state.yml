  - id: "lowest-nurse-practitioner-salaries"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Nurse Practitioner Salaries"
    paragraphs:
      - "Alabama averages $110,970, and its median is lower at $105,750. Prices below the national level help explain why employers can recruit with smaller dollar salaries than in California. Adjustment narrows the difference but leaves Alabama last, so local prices account for only part of the wage gap."
      - "Tennessee ranks next to last at $115,510 despite having 12,150 nurse practitioner jobs. Its concentration of 3.706 per 1,000 jobs is the second highest, showing that a profession can be widespread without commanding top pay. Those positions represent employed workers, not open vacancies."
