faq:
  - question: "What state pays nurse practitioners the most?"
    answer: "California has the highest mean pay at $84.98 an hour and the highest annual average. Its $168,520 median is below the mean, so the average should not be read as the wage every practitioner receives."
  - question: "How much does a nurse practitioner make in Texas?"
    answer: "Texas nurse practitioners average $131,420 a year, or $63.18 an hour. The median is $131,670, placing the middle worker very close to the statewide average."
  - question: "How much does a nurse practitioner make in Florida?"
    answer: "Florida averages $130,410 a year and $62.70 an hour, with a $129,510 median. Its prices exceed the national level, which reduces the average to $126,105 in adjusted purchasing power."
  - question: "How much does a nurse practitioner make in New York?"
    answer: "New York nurse practitioners average $153,900 a year and $73.99 an hour. Higher statewide prices pull its wage ranking from fourth to 17th after adjustment, and the statewide figure combines expensive cities with smaller local markets."
  - question: "Where do nurse practitioners earn the most after cost of living?"
    answer: "California remains first at $159,646 in adjusted annual pay. Iowa follows at $156,036, where lower prices lift a salary that ranks 17th in dollars to second in purchasing power."
  - question: "Which state has the lowest nurse practitioner salary?"
    answer: "Alabama has the lowest mean hourly pay at $53.35 and the lowest median annual pay at $105,750. The median describes the midpoint of employees' wages rather than a starting salary."
  - question: "Is nurse practitioner salary the same as registered nurse salary?"
    answer: "California's $176,760 nurse practitioner average covers a separate advanced practice occupation. Registered nurses, nurse anesthetists, and nurse midwives are excluded, so their wages should be compared in their own occupational tables."
