seo:
  title: "Nurse Practitioner Salary by State | Map & Pay"
  description: "Nurse practitioners average $176,760 a year in California and $110,970 in Alabama. State wages include annual, median, and hourly pay."
page:
  h1: "Nurse Practitioner Salary by State"
  quick_answer:
    - "Nurse practitioner salary by state is highest in California at $176,760 a year. Employers recruit into the country's most expensive state, although California still leads after its higher prices are counted."
    - "Alabama has the lowest average nurse practitioner salary, $110,970. Lower local prices soften the gap, but its adjusted wage of $124,934 remains the lowest among the states."
    - "Mississippi rises from 44th to 10th after prices are counted. Its $125,340 average buys the equivalent of $144,147 at national prices, and nurse practitioners make up a larger share of its workforce than in any other state."
  methodology: "BLS OEWS May 2025 employee wages and employment for nurse practitioners, SOC 29-1171. Adjusted wages divide mean annual pay by BEA 2024 all-items Regional Price Parities. Self-employed workers and DC are excluded."
  sources:
    - name: "BLS OEWS May 2025 state occupational wage and employment series"
      url: "https://download.bls.gov/pub/time.series/oe/"
      description: "Annual mean and median wages, hourly mean wages, employment, and jobs per 1,000 for SOC 29-1171"
    - name: "BEA Regional Price Parities by State"
      url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area"
      description: "2024 all-items state price levels used to calculate adjusted salaries"
    - name: "BLS Occupational Outlook Handbook, Nurse Practitioners"
      url: "https://www.bls.gov/ooh/healthcare/nurse-anesthetists-nurse-midwives-and-nurse-practitioners.htm"
      description: "Occupation definitions, primary and specialty care, workplace settings, and schedules"
