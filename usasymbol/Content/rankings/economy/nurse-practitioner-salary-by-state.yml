sections:
  - id: "highest-nurse-practitioner-salaries"
    icon: "fa-solid fa-stethoscope"
    title: "Highest Nurse Practitioner Salaries"
    paragraphs:
      - "California leads at $176,760, with a median of $168,520. Its high prices give employers a costly recruitment market, a concrete reason to expect higher dollar wages. Nurse practitioners provide primary and specialty care, so the statewide average combines clinic, office, and hospital jobs rather than one standardized position."
      - "Oregon's $155,780 average sits almost exactly beside its $155,680 median. New Jersey's median of $159,310 exceeds its $155,750 average, a reminder that the state with the highest mean need not have the highest median. The [registered nurse salary](/rankings/economy/nurse-salary-by-state) ranking covers a different occupation."
