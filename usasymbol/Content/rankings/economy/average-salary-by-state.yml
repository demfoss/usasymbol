page:
  h1: "Average Salary by State 2026"
  quick_answer:
    - "Average salary by state is highest in Massachusetts at $85,610 a year. Its concentration of universities, hospitals, technology firms, and professional services supports many highly paid occupations."
    - "Mississippi has the lowest statewide average at $50,810. A larger share of employment in lower-paying service and production work pulls the all-occupation mean downward."
    - "Alaska ranks ninth by mean pay at $74,720, but its $61,000 median ranks third. The smaller gap shows how the mean can be lifted by a state's highest earners."
  methodology: "BLS OEWS May 2025 all-occupation estimates cover wage and salary workers in the 50 states. The mean is total wages divided by employment, while the median marks the midpoint."
