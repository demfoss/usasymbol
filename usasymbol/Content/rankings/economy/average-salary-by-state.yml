faq:
  - { question: "Which state has the highest average salary?", answer: "Massachusetts ranks first with an average annual wage of $85,610. Its dense concentration of specialized health, education, technology, and financial work lifts the statewide mean." }
  - { question: "Which state has the lowest average salary?", answer: "Mississippi ranks last at $50,810 a year. Lower-paid service and production occupations make up more of its employment mix." }
  - { question: "What is the average salary in California?", answer: "California's average salary is $80,690 a year, fourth among the states. Its $58,240 median is lower because the mean is pulled upward by very high earners." }
  - { question: "What is the average salary in Texas?", answer: "Texas averages $65,750 a year and ranks 23rd. Its large economy spans high-paying energy and technology work alongside millions of service jobs." }
  - { question: "Is average salary the same as median salary?", answer: "No. Massachusetts has an $85,610 mean and a $63,590 median. The mean includes every wage in the calculation, while the median is the midpoint worker." }
