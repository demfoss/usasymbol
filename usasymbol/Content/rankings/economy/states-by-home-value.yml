page:
  h1: "Median Home Value by State 2025"
  quick_answer:
    - "Hawaii has the highest median home value in the U.S. at over $800,000, followed by California and Massachusetts. Limited land, restricted zoning, and high demand in coastal metros drive prices far above the national median."
    - "West Virginia has the lowest median home value at around $125,000 — roughly one-sixth of Hawaii's figure. Mississippi and Oklahoma also rank among the most affordable states for homebuyers."
    - "The national median home value is approximately $308,000 (U.S. Census Bureau, 2023 ACS). Twenty-six states fall below that national median."
  methodology: "Figures are 2023 one-year estimates from the U.S. Census Bureau American Community Survey (ACS), Table B25077 (Median Value of Owner-Occupied Housing Units). Values reflect owner-occupied units only and are in nominal dollars."
  sources:
    - name: "U.S. Census Bureau — American Community Survey 2023"
      url: "https://data.census.gov"
      description: "1-year ACS estimates, Table B25077"

