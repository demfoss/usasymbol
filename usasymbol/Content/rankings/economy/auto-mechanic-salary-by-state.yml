      - "Alaska leads at $65,620 in a labor market shaped by geographic isolation. Air and sea freight supply communities beyond the limited highway system, making everyday purchases expensive. Higher living costs can push up the wages needed to recruit skilled employees, providing a concrete explanation for part of Alaska's pay premium."
