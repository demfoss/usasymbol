sections:
  - id: why-california-leads-ikea
    title: Why California Leads IKEA Locations
    paragraphs:
      - California's 18 locations combine eight full-size stores, three small stores, and seven plan-and-order points. The Bay Area and Southern California each support a mix of formats, putting planning services in more places than the warehouse stores alone. That combination of separate urban markets and smaller locations helps California lead the total.
      - Kentucky's one location is a plan-and-order point in Florence, and Alabama's one is a small store in Huntsville. Their bottom-tier counts reflect networks built around a single smaller-format site in each state, while California combines warehouses with satellite planning locations. [Home Depot locations](/rankings/economy/home-depot-locations-by-state) offer another view of home-project retail.
