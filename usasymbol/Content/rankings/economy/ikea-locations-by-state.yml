  - id: full-size-ikea-stores-by-state
    title: Full-Size IKEA Stores by State
    paragraphs:
      - Texas has five full-size stores within its 15-location network. Full-size IKEA stores combine furniture displays with a self-service warehouse, while planning points focus on designing and ordering a purchase, making the warehouse count the relevant measure for that shopping experience.
      - Pennsylvania has four total locations, including three full-size stores, and was the first US market when IKEA opened in Plymouth Meeting in 1985. A chain's founding market and present footprint can differ, as the [Costco state map](/rankings/economy/costco-by-state) also illustrates.
