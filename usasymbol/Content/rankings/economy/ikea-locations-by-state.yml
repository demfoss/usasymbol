page:
  h1: IKEA Locations by State
  quick_answer:
    - IKEA locations by state are led by California with 18 sales and planning locations. The total combines full-size stores, small stores, and plan-and-order points.
    - Texas lists 15 locations, with five each of full-size stores, small stores, and plan-and-order points. The network combines warehouse shopping with smaller places to plan a purchase.
    - Kentucky has one plan-and-order point, while Alabama has one small store. Equal counts can represent very different shopping experiences.
  methodology: IKEA's official US directory combines Store, Small store, and Plan & order point entries as retrieved October 3, 2026. Pickup-only points and 22 unlisted states are excluded, with equal totals sharing ranks.
  sources:
