faq:
  - question: Which state has the most IKEA locations?
    answer: California has the highest combined total at 18. Full-size stores in Burbank and East Palo Alto sit alongside smaller planning locations serving surrounding communities.
  - question: How many IKEA stores are in Texas?
    answer: Texas lists five full-size stores and 15 total sales and planning locations. The remaining entries are five small stores and five plan-and-order points.
  - question: How many IKEA locations are in Florida?
    answer: Florida has 10 listed sales and planning locations. Five are full-size stores and five are plan-and-order points.
  - question: Does Kentucky have an IKEA store?
    answer: Kentucky has a plan-and-order point in Florence. Customers use that format to plan and order home furnishings, with a smaller site than a traditional IKEA warehouse store.
  - question: Are IKEA pickup points included?
    answer: Pickup-only locations are excluded. California's 18 entries count places listed as stores or planning locations, while an address that only handles order pickup belongs to a different service network.
  - question: Which states have no listed IKEA sales locations?
    answer: Alaska, Arkansas, Delaware, Hawaii, Idaho, Iowa, Louisiana, Maine, Mississippi, Montana, Nebraska, New Hampshire, New Mexico, North Dakota, Oklahoma, Rhode Island, South Carolina, South Dakota, Tennessee, Vermont, West Virginia, and Wyoming have no listed store or planning location. Pickup-only services are outside this definition.
