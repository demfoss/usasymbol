faq:
  - question: How much does a surgical technologist make in Massachusetts?
    answer: "Massachusetts averages $83,820 a year and $40.30 an hour. Surgical technologists prepare the room and handle sterile supplies, while surgical first assistants can perform tasks such as closing an incision."
  - question: What is the surgical tech salary in California?
    answer: "California's mean is $82,810 a year and its median is $81,310. Hospital work can include being on call at night, on weekends, or during holidays when urgent operations need a team."
  - question: How much does a surgical technologist make in Texas?
    answer: "Texas averages $66,640 annually and $32.04 hourly. Handling tissue specimens for laboratory analysis is another responsibility beyond passing instruments to the surgeon."
  - question: What is the surgical technologist salary in Florida?
    answer: "Florida averages $64,360 a year, with a median of $62,440. Surgical technologists work beside surgeons and nurses, and [medical assistants](/rankings/economy/medical-assistant-salary-by-state) have a different mix of clinical and administrative duties in medical offices."
  - question: How much does a surgical tech make in New York?
    answer: "New York averages $81,990 a year and $39.42 an hour. Positioning a patient and placing sterile drapes help prepare the surgical field before the operation begins."
