    paragraphs:
      - "Massachusetts leads at $83,820 in a hospital labor market with documented demand for trained operating-room staff. Middlesex Community College developed an apprenticeship proposal with Lowell General and Lahey to address that staffing need. Housing rents above the national level add another reason employers face pressure to offer higher wages."
