  title: Surgical Technologist Salary by State | Map & Pay
  description: Surgical technologists average $83,820 a year in Massachusetts and $50,680 in Alabama. California has the largest surgical technologist workforce.
page:
  h1: Surgical Technologist Salary by State
  quick_answer:
    - "Surgical technologist salary by state is highest in Massachusetts at $83,820 a year. Hospitals need trained staff to keep operating rooms running, and its high housing costs add pressure to pay in that labor market."
    - "Alabama averages $50,680, the lowest state wage. Lower housing rents and household prices contribute to a less expensive local wage environment."
    - "California employs 11,920 surgical technologists. The scrub team counts instruments, needles, and sponges before and after an operation to help prevent supplies from being left inside a patient."
  methodology: "BLS OEWS May 2025 surgical technologists, SOC 29-2055, ranked by mean annual wage across 50 states, excluding DC, territories and surgical first assistants. Annual pay is a full-time equivalent, with price context from BEA RPP 2024."
