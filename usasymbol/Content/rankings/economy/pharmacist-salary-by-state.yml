  - id: "lowest-paying-states-for-pharmacists"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Paying States for Pharmacists"
    paragraphs:
      - "Rhode Island averages $123,300 and has a median of $128,180. The mean mixes employees in different pharmacy settings and shifts, which offers a methodological explanation for why a state average can trail even with prices above the national level. The state series does not isolate the employer mix, so it cannot prove a single cause of Rhode Island's last place."
      - "Florida ranks next to last at $130,190 despite having 21,540 pharmacist jobs. A large workforce is not a measure of bargaining power or vacant positions. Florida's price level also exceeds the national average, reducing its wage to $125,892 in adjusted purchasing power."
