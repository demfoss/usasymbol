    icon: "fa-solid fa-prescription-bottle-medical"
    title: "Highest Paying States for Pharmacists"
    paragraphs:
      - "California leads at $162,340, with a $164,610 median. Its high local prices give pharmacies and hospitals an expensive recruitment market, providing context for a larger dollar wage. The state average includes both community dispensing and clinical medication work, so a specific employer's role and schedule still matter."
      - "Alaska ranks second at $161,220 and has a median of $167,310, above California's. Its workforce is only 560 jobs, compared with California's 34,030. A high statewide wage in Alaska therefore describes a much smaller market of occupied positions."
