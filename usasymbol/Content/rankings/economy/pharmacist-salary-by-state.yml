faq:
  - question: "What state pays pharmacists the most?"
    answer: "California has the highest mean pharmacist wage at $78.05 an hour. Alaska's median annual salary is higher, however, showing why the average and the middle employee's wage answer different questions."
  - question: "How much does a pharmacist make in Texas?"
    answer: "Texas pharmacists average $137,510 a year, or $66.11 an hour. Its $138,260 median is close to the mean, and the estimate combines jobs at different types of pharmacy employers."
  - question: "How much does a pharmacist make in Florida?"
    answer: "Florida averages $130,190 a year and $62.59 an hour. Its $135,970 median exceeds the mean, so a typical employee's wage is higher than the headline average suggests."
  - question: "How much does a pharmacist make in New York?"
    answer: "New York pharmacists average $140,260 a year, or $67.43 an hour. Higher local prices reduce that wage to $129,965 in adjusted purchasing power, moving New York from 18th to 47th."
  - question: "Where do pharmacists earn the most after cost of living?"
    answer: "South Dakota leads at $160,669 in adjusted annual pay. Its prices below the national level allow a salary outside the dollar top ten to support the largest statewide purchasing-power estimate."
  - question: "Which state pays pharmacists the least?"
    answer: "Rhode Island has the lowest mean hourly wage at $59.28. Its $128,180 annual median is above its $123,300 average, so the bottom mean does not imply that every employee receives that amount."
  - question: "Do pharmacist salaries include pharmacy owner income?"
    answer: "California's $162,340 average covers employee wages, not the business income of self-employed pharmacy owners. Pharmacy technicians are also a separate occupation and are not included in these pharmacist estimates."
