  title: "Pharmacist Salary by State | Map & Pay"
  description: "Pharmacists average $162,340 a year in California and $123,300 in Rhode Island. South Dakota has the highest pay after living costs are counted."
page:
  h1: "Pharmacist Salary by State"
  quick_answer:
    - "Pharmacist salary by state is highest in California at $162,340 a year. Its expensive recruitment market helps put dollar wages first, but higher prices reduce its purchasing-power rank to 23rd."
    - "Rhode Island has the lowest average, $123,300. Its prices exceed the national level, so a lower cost of living does not explain the result. The figure combines employee jobs across pharmacy settings rather than one identical role."
    - "South Dakota leads after price adjustment at $160,669. Its $142,330 dollar wage ranks 12th, but lower local prices stretch that paycheck past California's in statewide buying power."
  methodology: "BLS OEWS May 2025 employee wages and employment for pharmacists, SOC 29-1051. Adjusted wages divide mean annual pay by BEA 2024 all-items Regional Price Parities. Self-employed workers and DC are excluded."
