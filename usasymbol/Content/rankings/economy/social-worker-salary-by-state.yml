    icon: "fa-solid fa-people-roof"
    title: "Highest Paying States for Social Workers"
    paragraphs:
      - "Connecticut leads at $80,180, with a $78,970 median close to the mean. Its public child welfare jobs use formal employment classifications and salary ranges, giving this work structured pay schedules. School and other family-service employers also contribute positions to the same occupation."
      - "Connecticut's 5,230 jobs cover work that may involve finding family services, arranging foster placements, or helping students with attendance and social problems. Healthcare and mental health social work belong to different occupational categories. Comparing this page with [psychologist salaries](/rankings/economy/psychologist-salary-by-state) therefore requires attention to the work each table includes."
