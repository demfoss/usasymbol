faq:
  - question: "What state pays social workers the most?"
    answer: "Connecticut has the highest average hourly pay at $38.55 for child, family, and school employees. Its $78,970 median is close to the mean, so the midpoint also indicates relatively high wages."
  - question: "How much does a social worker make in California?"
    answer: "California child, family, and school social workers average $71,940 a year and $34.59 an hour. Its $65,200 median is lower than the mean, giving an additional benchmark for reviewing an offer."
  - question: "How much does a social worker make in Texas?"
    answer: "Texas averages $55,700 annually and $26.78 an hour in this occupation. Child welfare, family services, and school support give employees roles across agencies, homes, and classrooms."
  - question: "How much does a social worker make in Florida?"
    answer: "Florida averages $57,970 a year, with a $56,550 median. Higher-than-national prices reduce the average to $56,056 in adjusted purchasing power, placing the state 45th after adjustment."
  - question: "How much does a social worker make in New York?"
    answer: "New York child, family, and school employees average $72,150 a year and $34.69 an hour. Its $65,100 median is appreciably lower, so the average alone does not describe the middle employee's wage."
  - question: "Where do social workers earn the most after cost of living?"
    answer: "Connecticut leads at $77,386 in adjusted pay for child, family, and school employees. North Dakota follows at $73,787, where lower prices strengthen a smaller dollar wage."
  - question: "Does social worker salary include all social work jobs?"
    answer: "California's $71,940 average covers child, family, and school social workers. Family visits, child welfare services, and work with school staff fall in this group, while healthcare and mental health social workers have separate estimates."
