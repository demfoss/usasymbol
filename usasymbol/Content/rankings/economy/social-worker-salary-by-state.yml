seo:
  title: "Social Worker Salary by State | Map & Pay"
  description: "Child, family, and school social workers average $80,180 in Connecticut and $46,390 in Arkansas. California has the most jobs at 60,310."
page:
  h1: "Social Worker Salary by State"
  quick_answer:
    - "Social worker salary by state is highest in Connecticut at $80,180 for child, family, and school employees. State child welfare jobs use structured salary grades, a concrete part of how pay is set in this field."
    - "Arkansas has the lowest average at $46,390. Its inexpensive price basket helps explain lower dollar pay, but adjustment lifts the state only to 48th in purchasing power."
    - "North Dakota moves from 20th in dollars to second after prices are counted, the largest rank shift. Its $65,640 average becomes $73,787 at national prices without changing the cash wage employers pay."
  methodology: "BLS OEWS May 2025 child, family, and school social worker employees, SOC 21-1021, cover all 50 states and exclude DC and self-employment. Adjusted annual pay divides mean wages by BEA 2024 all-items RPP relative to national prices."
  sources:
    - name: "BLS OEWS May 2025 occupational series"
      url: "https://downloadt.bls.gov/pub/time.series/oe/"
      description: "Child, family, and school social worker employee wages and employment, SOC 21-1021"
    - name: "BEA Regional Price Parities"
      url: "https://apps.bea.gov/regional/zip/SARPP.zip"
      description: "2024 all-items state prices"
    - name: "BLS Occupational Outlook Handbook, Social Workers"
