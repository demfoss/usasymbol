faq:
  - question: "Which state spends the most on the lottery per capita?"
    answer: "Massachusetts spends the most per resident at $914.52 in 2023. Rhode Island is second at $573.33, more than $300 lower."

  - question: "Which state spends the least on the lottery per capita?"
    answer: "North Dakota spends the least among lottery states, $50.16 per resident. Wyoming is next lowest at $74.69."

  - question: "What is the average lottery spending per person in the US?"
    answer: "The national average across the 45 states with a lottery is $320.44 per resident in 2023. Nineteen states spend above that average, led by Massachusetts at $914.52."

  - question: "Why does Massachusetts have the highest lottery spending per capita?"
    answer: "Massachusetts's population is concentrated in a single metro area around Boston, and researchers cited in national reporting also point to the state's long tradition of parish bingo, which predated the lottery and helped normalize legalized gambling."

  - question: "Which states have no state lottery?"
    answer: "Alabama, Alaska, Hawaii, Nevada, and Utah have no state lottery and are excluded from per-capita spending figures."

  - question: "How much does the average Virginia resident spend on the lottery?"
    answer: "Virginia residents spend $532.12 per capita, the third-highest figure in the country. That is $211.68 above the national average of $320.44."

