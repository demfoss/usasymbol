  - id: "why-massachusetts-spends-the-most-on-the-lottery-per-capita"
    icon: "fa-solid fa-circle-question"
    title: "Why Massachusetts Leads Lottery Spending Per Capita"
    paragraphs:
      - "Massachusetts's $914.52 per-resident figure is nearly 60 percent higher than Rhode Island's second-place total. Researchers tie the gap partly to Massachusetts's population being concentrated in a single metro area, since urban ticket buyers tend to spend more than rural ones."
      - "Analysts also point to the state's long history of parish bingo, which predated the Massachusetts Lottery's creation and, according to researchers cited in national reporting, helped normalize legalized gambling before the lottery itself existed."

