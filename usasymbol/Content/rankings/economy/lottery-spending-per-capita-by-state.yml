seo:
  title: "Lottery Spending Per Capita by State | Map, Rank & Facts"
  description: "Massachusetts residents spend $914.52 per capita on the lottery, the highest in the US. North Dakota spends the least at $50.16 per capita."

page:
  h1: "Lottery Spending Per Capita by State"

  quick_answer:
    - "Massachusetts residents spend more on the lottery per capita than any other state, an estimated $914.52 per person in 2023, well above Rhode Island's second-place figure of $573.33."
    - "Rhode Island ranks second at $573.33 per capita, and Virginia follows at $532.12. Georgia is fourth at $519.52, the last state above the $500 mark."
    - "North Dakota has the lowest lottery spending per capita among the 45 states with a lottery, just $50.16 in 2023, less than 6% of Massachusetts's per-resident figure."

  methodology: "Per-capita figures come from a LendingTree analysis of the U.S. Census Bureau's 2023 Annual Survey of State Government Finances lottery data and 2023 American Community Survey population estimates. Alabama, Alaska, Hawaii, Nevada, and Utah have no state lottery and are excluded."

  sources:
    - name: "LendingTree. Lottery Spending Statistics by State (2023 data)"
      url: "https://www.lendingtree.com/debt-consolidation/lottery-study/"
      description: "Per-capita lottery spending by state, calculated from state lottery ticket sales plus estimated retailer commissions divided by state population"
    - name: "U.S. Census Bureau. Annual Survey of State Government Finances (ASFIN)"
      url: "https://www.census.gov/programs-surveys/state.html"
      description: "Federal survey providing the underlying state-by-state lottery fund revenue data used in the per-capita calculation"

