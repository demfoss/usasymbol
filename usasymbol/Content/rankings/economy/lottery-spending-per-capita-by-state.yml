    icon: "fa-solid fa-city"
    title: "States With the Lowest Lottery Spending Per Capita"
    paragraphs:
      - "North Dakota has the lowest per-resident spending among lottery states at $50.16. Wyoming is next lowest at $74.69, followed by Montana at $76.04."
      - "New Mexico and Oklahoma also rank near the bottom at $83.79 and $92.35. All five lowest states sit in the Mountain West or Great Plains, each more than $200 below the $320.44 national average."
