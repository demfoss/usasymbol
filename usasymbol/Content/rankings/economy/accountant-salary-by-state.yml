    icon: fa-solid fa-arrow-trend-up
    title: Highest Paying States for Accountants
    paragraphs:
      - "New York leads at $114,070, with median pay of $102,640. Wall Street's securities businesses create work involving financial statements, investment transactions, and audits, while higher local prices contribute to nominal wage differences."
      - "New Jersey follows at $110,590, with median earnings of $100,830. Accountants work inside companies, for audit firms, and in government, bringing financial reporting and compliance work into several employer settings. Financial records also supply material for analytical careers covered by [data scientist salaries](/rankings/economy/data-scientist-salary-by-state)."
