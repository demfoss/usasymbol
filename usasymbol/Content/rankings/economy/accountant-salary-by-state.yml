seo:
  title: Accountant Salary by State | Map & Pay
  description: "Accountants and auditors average $114,070 in New York and $76,980 in Arkansas. New York also leads after living costs."
page:
  h1: Accountant Salary by State
  quick_answer:
    - "Accountant salary by state is highest in New York at $114,070 annually. Its financial services cluster supports complex reporting and audit work, while high local prices also help explain the nominal premium."
    - "Arkansas averages $76,980, the lowest accountant and auditor wage. Lower household prices narrow the gap, lifting comparable purchasing power to $88,547 without putting the state near the leaders."
    - "Florida moves from 24th in gross pay to 48th after living costs, the largest ranking shift. Its $88,210 salary buys the equivalent of $85,298 at national prices."
  methodology: "BLS OEWS May 2025 accountants and auditors estimates, SOC 13-2011, cover all 50 states and exclude DC and self-employed workers. Adjusted pay divides wages by BEA 2024 all-items RPP and multiplies by 100."
  sources:
