  description: "Cybersecurity analysts average $156,080 in Washington and $92,790 in Mississippi. New Mexico leads after living costs."
page:
  h1: Cybersecurity Analyst Salary by State
  quick_answer:
    - "Cybersecurity analyst salary by state is highest in Washington at $156,080 annually. Its technology sector provides a concrete employment setting for protecting computer systems, while high local prices also contribute to nominal pay differences."
    - "Mississippi averages $92,790, the lowest available salary. Lower household prices narrow the gap, but its adjusted wage remains near the bottom rather than matching the leading states."
    - "Hawaii moves from 21st to 44th after living costs, the largest ranking shift. Household prices above the national benchmark reduce the buying power of its dollar wage."
  methodology: "BLS OEWS May 2025 information security analyst estimates, SOC 15-1212, exclude DC and self-employed workers, with Idaho, Oregon, and West Virginia wages and West Virginia jobs suppressed. Adjusted pay uses BEA 2024 RPP, wage/RPP × 100."
