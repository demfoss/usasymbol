    paragraphs:
      - "Mississippi averages $92,790, with median earnings of $87,690. Lower household prices help explain why a smaller nominal wage can cover comparable expenses, but its adjusted pay still places 46th. Security roles across technology firms, consultancies, and financial businesses have different pay structures, so employer mix also matters."
      - "Mississippi lists 480 information security analyst jobs, a much smaller employee pool than Washington's. The occupation protects systems inside many kinds of organizations rather than counting every worker with cybersecurity in a title. The [cybercrime ranking](/rankings/crime/cybercrime-by-state) measures reported crime, a different question from the size or salary of this employee group."
