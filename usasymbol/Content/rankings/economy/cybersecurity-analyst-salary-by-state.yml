sections:
  - id: highest-cybersecurity-analyst-salaries
    icon: fa-solid fa-arrow-trend-up
    title: Highest Cybersecurity Analyst Salaries
    paragraphs:
      - "Washington leads at $156,080, with median earnings of $154,940. Its information and communications technology sector creates work protecting computer networks and systems, while higher household prices help explain nominal wage premiums."
      - "Massachusetts follows at $151,000, with median pay of $136,550. Information security analysts monitor breaches, assess vulnerabilities, and help organizations recover after attacks rather than simply writing software. [Software developer salaries](/rankings/economy/software-developer-salary-by-state) provide an adjacent technology career comparison while keeping the occupational roles separate."
