map:
  metric_key: mean_annual
  metric_label: Mean Annual Occupational Therapist Wage
  color_scheme: green
  color_scale: linear
  caption: "California leads at $121,920 a year. North Dakota has the lowest mean at $87,670."
sections:
  - id: highest-occupational-therapist-salaries
    icon: fa-solid fa-arrow-trend-up
    title: Highest Occupational Therapist Salaries
    paragraphs:
      - "California leads at $121,920, with median pay of $124,510. Higher local prices are part of the mechanism behind nominal wage differences, because employers recruit workers who must pay those prices. The median exceeds the mean here, so a handful of very large salaries cannot by itself explain the state's lead."
      - "Nevada follows at $112,290, but its price-adjusted pay exceeds California's. Occupational therapists work across hospitals, schools, home care, and rehabilitation offices, with different pay structures. Comparing [physical therapist salaries](/rankings/economy/physical-therapist-salary-by-state) helps distinguish two rehabilitation professions that may share a workplace while treating different daily needs."
