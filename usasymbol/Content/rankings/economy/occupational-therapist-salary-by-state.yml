seo:
  title: Occupational Therapist Salary by State | Map & Pay
  description: "Occupational therapists average $121,920 in California and $87,670 in North Dakota. Arkansas leads after living costs."
page:
  h1: Occupational Therapist Salary by State
  quick_answer:
    - "Occupational therapist salary by state reaches $121,920 in California, the highest mean annual wage. Expensive local goods and services help explain the pay premium, although employer mix also affects the average."
    - "North Dakota averages $87,670, the lowest wage. Its lower prices lift comparable purchasing power to $98,551, narrowing the salary gap without putting it near the leaders."
    - "Hawaii falls from 18th in gross pay to 47th after living costs, the largest change in position. Its $100,280 wage buys less than the headline salary suggests."
  methodology: "BLS OEWS May 2025 occupational therapist estimates, SOC 29-1122, cover all 50 states and exclude DC and self-employed workers. Adjusted pay divides annual wages by BEA 2024 all-items RPP and multiplies by 100."
