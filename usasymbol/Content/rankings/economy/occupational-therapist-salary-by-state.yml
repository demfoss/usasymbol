  - id: lowest-occupational-therapist-salaries
    icon: fa-solid fa-arrow-trend-down
    title: Lowest Occupational Therapist Salaries
    paragraphs:
      - "North Dakota's $87,670 mean and $83,200 median sit at the bottom of the salary table. Lower local prices soften that result and help explain why employers can offer lower nominal pay, although prices alone do not account for every wage difference. School systems and medical providers also use different compensation structures."
      - "North Dakota lists 570 occupational therapist jobs, so the estimate combines a much smaller employer pool than California's. Occupational therapy can mean helping a stroke survivor dress independently or adapting classroom tasks for a child. A state's average blends those settings rather than describing one standard outpatient job."
