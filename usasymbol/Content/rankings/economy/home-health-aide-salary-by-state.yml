faq:
  - question: "How much does a home health aide make in California?"
    answer: "California home health and personal care aides average $36,420 a year or $17.51 an hour. The state employs 970,150 aides, the largest total in the country."
  - question: "How much does a home health aide make in Texas?"
    answer: "Texas home health and personal care aides average $26,070 annually or $12.54 an hour. Their work often includes personal care, meal preparation, housekeeping, and transportation support."
  - question: "What state pays home health aides the most?"
    answer: "Washington pays the highest average at $48,210 a year or $23.18 an hour. Its 2025 minimum wage was $16.66, with higher local wage floors in several cities."
  - question: "What state pays home health aides the least?"
    answer: "Louisiana has the lowest mean wage at $24,430 a year or $11.75 an hour. Louisiana has no state minimum wage law, so covered workers rely on the federal floor."
  - question: "What does a home health aide do?"
    answer: "Home health and personal care aides help people with bathing, dressing, meals, housekeeping, appointments, and other daily activities. Home health aides may also perform basic health tasks under a nurse or other healthcare practitioner's direction."
  - question: "Is a home health aide the same as a nursing assistant?"
    answer: "No. Home health aides usually support clients in homes or community settings, while nursing assistants commonly provide basic care in nursing and hospital facilities. Related clinical support roles appear in [medical assistant salary by state](/rankings/economy/medical-assistant-salary-by-state) and [licensed practical nurse salary by state](/rankings/economy/licensed-practical-nurse-salary-by-state)."
