    - "Home health aide salary by state is highest in Washington at $48,210 a year. Its 2025 statewide minimum wage of $16.66 created a comparatively high pay floor."
    - "Louisiana has the lowest average at $24,430. The state has no separate minimum wage, leaving covered workers with the federal $7.25 floor."
    - "California employs 970,150 home health and personal care aides, the largest state workforce. Aides help clients with daily activities in homes and community settings."
