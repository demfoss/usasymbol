sections:
  - id: "states-with-the-worst-pest-problems"
    icon: "fa-solid fa-bug"
    title: "States With the Worst Pest Problems"
    paragraphs:
      - "Florida posts the highest pest vulnerability score in the country at 67.54, more than 11 points above second-ranked California at 55.87. Texas follows closely at 54.69, then New York at 52.38 and Georgia at 51.53."
      - "Illinois rounds out the top six at 49.45. Louisiana, Alabama, Pennsylvania, and Missouri fill out the rest of the top ten, each scoring between 45.77 and 48.58, and every one of these ten states sits above the 50-state average of 39.89."

  - id: "states-with-the-fewest-pest-problems"
    icon: "fa-solid fa-shield-halved"
    title: "States With the Fewest Pest Problems"
    paragraphs:
      - "Alaska has the lowest pest vulnerability score of any state at 17.58, less than half the national average. Wyoming is second-lowest at 23.01, and Idaho follows at 23.11."
      - "North Dakota scores 25.53 and Montana 26.03, placing four of the five lowest-scoring states in the northern Great Plains or Mountain West. Hawaii rounds out the bottom five at 27.46, the only warm-climate state to score this low."

  - id: "why-florida-ranks-worst-for-indoor-pests"
    icon: "fa-solid fa-temperature-high"
    title: "Why Florida Ranks Worst for Indoor Pests"
    paragraphs:
      - "Florida's year-round warmth and humidity, paired with dense development, sustain pest activity through more of the year than colder states allow. Terminix reached the same conclusion independently, naming Florida the most termite-active state in its own 2025 ranking of pest management service data."
      - "California and Texas, Home Gnome's second and third-ranked states for overall pest vulnerability, also land in Terminix's top three termite states. The overlap points to climate and development density as shared drivers behind both rankings."

