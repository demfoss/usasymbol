faq:
  - question: "Which state has the worst pest problems?"
    answer: "Florida ranks first with a pest vulnerability score of 67.54 out of 100, according to Home Gnome's 2025 state ranking. California is second at 55.87, and Texas is third at 54.69."

  - question: "What is the least pest-prone state?"
    answer: "Alaska scores lowest at 17.58, less than half the 50-state average of 39.89."

  - question: "Why does Florida have so many pest problems?"
    answer: "Florida's warm, humid climate and dense development sustain pest activity year-round. Terminix separately ranked Florida first for termite activity, based on its own service data, matching Home Gnome's overall pest vulnerability ranking."

  - question: "How does California rank for pest control issues?"
    answer: "California ranks second among the 50 states with a score of 55.87, more than 16 points above the national average."

  - question: "What is the average pest vulnerability score across US states?"
    answer: "The 50-state average is 39.89. Ten states score above 45, led by Florida at 67.54."

  - question: "Which states have the fewest pest problems?"
    answer: "Alaska (17.58), Wyoming (23.01), Idaho (23.11), North Dakota (25.53), and Montana (26.03) are the five lowest-scoring states."

