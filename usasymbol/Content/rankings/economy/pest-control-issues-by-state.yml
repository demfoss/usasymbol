page:
  h1: "Pest Control Issues by State"

  quick_answer:
    - "Florida has the highest pest vulnerability score of any state at 67.54 out of 100, the top rank in a 2025 Home Gnome study covering pest species prevalence, infestation potential, and environmental factors in all 50 states."
    - "California ranks second at 55.87 and Texas third at 54.69, both more than 10 points behind Florida but still well above the 50-state average of 39.89."
    - "Alaska has the lowest score at 17.58, less than half the national average, followed by Wyoming (23.01), Idaho (23.11), North Dakota (25.53), and Montana (26.03)."

  methodology: "Scores come from Home Gnome's 2025 ranking of the 50 states, which combines 21 metrics across pest species prevalence, infestation potential, and environmental factors into a single 0-100 vulnerability score. A higher score means greater exposure to indoor pests such as rodents, mosquitoes, spiders, and termites."

  sources:
    - name: "Home Gnome. 2025's Most Vulnerable States for Indoor Pests"
      url: "https://homegnome.com/blog/studies/most-vulnerable-states-indoor-pests/"
      description: "State-by-state pest vulnerability scores for all 50 states, built from 21 weighted metrics on pest species, infestation potential, and environmental factors"
    - name: "Terminix. The Silent Destroyers: Terminix Reveals the Top Termite-Infested U.S. States"
      url: "https://news.terminix.com/press-releases/press-release-details/2026/The-Silent-Destroyers-Terminix-Reveals-the-Top-Termite-Infested-U-S--States/default.aspx"
      description: "Terminix's own 2025 ranking of the most termite-active states, based on proprietary pest management service data"

