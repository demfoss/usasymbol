faq:
  - question: "What is the tipped minimum wage in Texas?"
    answer: "Texas employers may pay tipped workers $2.13 an hour in cash, the federal minimum, as long as tips bring the total to at least $7.25."

  - question: "What is the tipped minimum wage in California?"
    answer: "California pays tipped workers the full minimum wage of $16.90 an hour. The state does not allow employers to count tips toward wages."

  - question: "What is the tipped minimum wage in Florida?"
    answer: "Florida's tipped cash wage is $11.98 an hour, up from $10.98 on September 30, 2026, when the full minimum wage reached $15.00."

  - question: "Which states require the full minimum wage for tipped workers?"
    answer: "Alaska, California, Minnesota, Montana, Nevada, Oregon, and Washington. Tipped workers there earn the regular minimum wage before tips."

  - question: "Why is the federal tipped minimum wage $2.13?"
    answer: "Congress set $2.13 in 1991 and froze it in 1996 by separating it from the regular minimum wage. The regular federal minimum has stayed at $7.25 since 2009, as the [minimum wage by state](/rankings/economy/minimum-wage-by-state) page shows."

  - question: "What happens if tips do not reach the minimum wage?"
    answer: "The employer must pay the difference. Federal law requires that cash wages plus tips equal at least the full minimum wage for every hour worked."

  - question: "What is the tipped minimum wage in New York?"
    answer: "Tipped food service workers earn $11.35 an hour in New York City, Long Island, and Westchester, and $10.70 in the rest of the state."

