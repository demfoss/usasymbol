  - id: "states-with-the-lowest-tipped-minimum-wage"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Tipped Minimum Wage"
    paragraphs:
      - "Sixteen states, most of them in the South and the Plains, let employers pay tipped workers just $2.13 an hour. Alabama, Louisiana, Mississippi, South Carolina, and Tennessee have no state minimum wage law, so federal rates apply by default."
      - "The federal $2.13 was set in 1991, and a 1996 law separated it from the regular minimum wage, which is why it never rose again. Delaware ($2.23) and Wisconsin ($2.33) sit just above it."

  - id: "how-the-tip-credit-works"
    icon: "fa-solid fa-calculator"
    title: "How the Tip Credit Works"
    paragraphs:
      - "A tip credit lets an employer count part of a worker's tips toward the minimum wage. In Nebraska, a server earns $2.13 from the restaurant, and tips must cover the other $12.87 to reach the state's $15.00 minimum."
      - "If tips fall short in a slow week, the employer has to make up the difference. Tipping habits matter here, and the [average tip by state](/rankings/economy/average-tipping-percentage) shows how much customers actually leave."

