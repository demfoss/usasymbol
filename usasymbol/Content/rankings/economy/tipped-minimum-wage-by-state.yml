sections:
  - id: "why-washington-has-the-highest-tipped-minimum-wage"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Washington Pays Tipped Workers the Most"
    paragraphs:
      - "Washington pays tipped workers $17.13 an hour because it does not allow a tip credit at all. Servers get the full minimum wage first, and tips come on top."
      - "The number keeps rising because a 1998 voter initiative ties Washington's minimum wage to inflation, so it goes up every January. Alaska, California, Minnesota, Montana, Nevada, and Oregon also ban the tip credit, which makes the Pacific Coast the best-paid stretch of the country for restaurant workers."

  - id: "states-with-the-highest-tipped-minimum-wage"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest Tipped Minimum Wage"
    paragraphs:
      - "Hawaii, Arizona, Colorado, and Florida land in the top ten even though they allow a small tip credit. Each lets tips cover only about $3 or less of the minimum, so the cash wage stays high."
      - "Florida moved up most recently. Voters approved a 2020 amendment that raised the minimum wage step by step each September, and on September 30, 2026 the tipped cash wage reached $11.98."
    table:
      columns:
        state: "State"
        cash: "Tipped Cash Wage"
        full: "Full Minimum Wage"
      rows:
        - state: "Washington"
          cash: "$17.13"
          full: "$17.13"
        - state: "California"
