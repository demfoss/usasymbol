page:
  h1: "Tipped Minimum Wage by State 2026"

  quick_answer:
    - "Tipped minimum wage by state is highest in Washington at $17.13 an hour. Washington bans the tip credit, so servers earn the full minimum wage before a single tip."
    - "Sixteen states, including Texas, Georgia, and Virginia, still allow a cash wage of $2.13 an hour, a federal floor that has not moved since 1991."
    - "Nebraska has the widest gap. Its minimum wage reached $15.00, yet restaurants may still pay $2.13 in cash and count $12.87 of tips toward the rest."

