  - id: "states-with-the-fewest-small-businesses"
    title: "States With the Fewest Small Businesses"
    paragraphs:
      - "West Virginia has 66.5 small businesses per 1,000 residents, well below New Mexico at 81.4 in 49th place. Coal, healthcare, and government supply many jobs there, and the state also has the lowest [self-employment rate](/rankings/economy/self-employment-rate-by-state) in the country."
      - "Wisconsin (84.4), Indiana (86.6), and Kentucky (87.3) also sit near the bottom, with manufacturing plants that kept generations on big payrolls. Washington (89.4) is the surprise, since Boeing, Microsoft, and Amazon employ so many residents."
