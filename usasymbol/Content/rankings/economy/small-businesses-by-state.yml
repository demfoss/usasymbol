sections:
  - id: "why-florida-has-the-most-small-businesses"
    title: "Why Florida Has the Most Small Businesses"
    paragraphs:
      - "Florida has 156.7 small businesses per 1,000 residents, 3,485,976 in all. Most small businesses have no employees, and Florida is full of the kind that run on one person with a license and a truck, from real estate agents and contractors to charter boat captains. The state also levies no personal income tax, which lets solo operators keep more of what they earn."
      - "Wyoming follows at 140.9 and Vermont at 126.6, both with small populations. No personal or corporate income tax applies in Wyoming, and ranchers, guides, and oil field contractors fill its 81,924 small businesses. Vermont's total is 81,949, almost identical, built on dairy farms, sugar makers, and craft shops."

  - id: "states-with-the-most-small-businesses"
    title: "States With the Most Small Businesses"
    paragraphs:
      - "California counts 4,340,784 small businesses, the most of any state, followed by Texas with 3,517,343 and Florida with 3,485,976. A large [population](/rankings/demographics/states-by-population) drives the top of the list, and California's 111.2 per 1,000 residents lands only 14th."
      - "Pennsylvania (1,169,008) and Ohio (1,081,292) both make the top ten by count but rank 44th and 41st per 1,000 residents. Both grew around steel mills and large factories, and their economies still lean on big employers."
