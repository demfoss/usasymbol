seo:
  title: "Small Businesses by State | Map & Rankings"
  description: "Florida has the most small businesses per 1,000 residents at 156.7. West Virginia has the fewest at 66.5. California has the most in total at 4,340,784."

page:
  h1: "Small Businesses by State"

  quick_answer:
    - "Small businesses by state are most common per resident in Florida, at 156.7 per 1,000 residents. Real estate, construction, and tourism work there is often done by owners with no staff."
    - "West Virginia has the fewest at 66.5 per 1,000 residents. Coal companies, hospitals, and government agencies supply many of its jobs, which leaves fewer residents running a business of their own."
    - "California counts the most small businesses in total at 4,340,784, yet ranks only 14th per 1,000 residents at 111.2. Wyoming ranks second at 140.9 with just 81,924 businesses."

  methodology: "SBA Office of Advocacy 2025 state profiles, 2022 data. Small businesses are firms with fewer than 500 employees, including owners with no staff. Per 1,000 residents uses Census Bureau July 1, 2022 population estimates. D.C. is excluded."

  sources:
    - name: "SBA Office of Advocacy, State Small Business Statistics 2025"
      url: "https://data.sba.gov/dataset/state-small-business-statistics-2025"
      description: "Number of small businesses by state from the 2025 Small Business Profiles for the States, Territories, and Nation"
