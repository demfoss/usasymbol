faq:
  - question: "Which state has the most small businesses?"
    answer: "California has the most at 4,340,784, ahead of Texas at 3,517,343 and Florida at 3,485,976. Their large populations explain most of that."

  - question: "Which state has the most small businesses per capita?"
    answer: "Florida, with 156.7 per 1,000 residents. Wyoming (140.9) and Vermont (126.6) follow, and Georgia (126.0) takes fourth. Anyone weighing a launch can compare the [best states to start a business](/rankings/economy/best-states-to-start-a-business)."

  - question: "How many small businesses are in Texas?"
    answer: "Texas has 3,517,343 small businesses, second only to California. That works out to 117.1 per 1,000 residents, eighth in the country."

  - question: "How many small businesses are in New York?"
    answer: "New York has 2,378,996, the fourth most of any state. Dense city neighborhoods packed with shops, restaurants, and freelancers put it seventh per capita at 120.9."

  - question: "What counts as a small business?"
    answer: "A small business is a firm with fewer than 500 employees, and that includes the many owners who work alone. Freelancers, consultants, and sole proprietors all count."

  - question: "What state has the fewest small businesses?"
    answer: "Alaska has the fewest in total at 77,814, in a state of only 733,583 people. Per 1,000 residents, West Virginia is lowest at 66.5."

