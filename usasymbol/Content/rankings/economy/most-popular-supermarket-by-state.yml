page:
  h1: "Most Popular Supermarket by State 2026"
  quick_answer:
    - "Hannaford is the most popular supermarket in Maine with 72.3% of grocery store visits, the biggest share any chain holds in a state. Hy-Vee follows in Iowa at 61.4% and Publix in Florida at 60.3%."
    - "California has the most divided grocery market, with leader Safeway at only 10.4% of visits. Ralphs sits at 7.6%, and New York is the next most fragmented at 13.2% for Wegmans."
    - "Kroger leads six states, more than any other chain, from Kentucky at 55.9% to Indiana at 31.7%. Albertsons, Food Lion, and Safeway each lead four."
  methodology: "Share of grocery store visits held by the most-visited chain in each state as of May 2026, compiled by Capital One Shopping from publicly available data, with the second-most-visited chain as runner-up. Walmart Neighborhood Market is the Walmart grocery format. Ties share a rank."
  sources:
    - name: "Capital One Shopping, Grocery Shopping Statistics (2026)"
      url: "https://capitaloneshopping.com/research/grocery-shopping-statistics/"
      description: "State-by-state share of grocery store visits for the most-visited and second-most-visited chains, as of May 2026."

