sections:
  - id: "most-dominant-supermarket-by-state"
    title: "Most Dominant Supermarket by State"
    paragraphs:
      - "Hannaford takes 72.3% of grocery store visits in Maine, the most lopsided result in the table. Maine has few large towns, and a chain that grew up in the state faced little competition from national banners, with Shaw's a distant second at 14.9%."
      - "Hy-Vee leads Iowa at 61.4% because it is an Iowa company, an employee-owned chain based in West Des Moines that also leads Nebraska and South Dakota. Publix owns Florida at 60.3% for the same home-state reason, since George Jenkins opened the first store in Winter Haven in 1930. H-E-B, born in Texas, holds 42.4% there."
  - id: "supermarket-chains-that-lead-the-most-states"
    title: "Supermarket Chains That Lead the Most States"
    table:
      columns: { chain: "Chain", states_led: "States Led", states: "States" }
      rows:
        - { chain: "Kroger", states_led: "6", states: "Kentucky, West Virginia, Mississippi, Ohio, Tennessee, Indiana" }
        - { chain: "Albertsons", states_led: "4", states: "Montana, Wyoming, New Mexico, Idaho" }
        - { chain: "Food Lion", states_led: "4", states: "North Carolina, Virginia, South Carolina, Delaware" }
        - { chain: "Safeway", states_led: "4", states: "Hawaii, Washington, Oregon, California" }
        - { chain: "Hy-Vee", states_led: "3", states: "Iowa, South Dakota, Nebraska" }
        - { chain: "Publix", states_led: "3", states: "Florida, Alabama, Georgia" }
        - { chain: "Stop & Shop", states_led: "3", states: "Rhode Island, Connecticut, Massachusetts" }
        - { chain: "Hannaford", states_led: "2", states: "Maine, Vermont" }
        - { chain: "Smith's", states_led: "2", states: "Utah, Nevada" }
        - { chain: "Walmart Neighborhood Market", states_led: "2", states: "Arkansas, Oklahoma" }
    paragraphs:
      - "Kroger leads six states, mostly across the Ohio Valley and the Deep South, with its biggest share in Kentucky at 55.9%. Its full footprint is in [Kroger locations by state](/rankings/food/kroger-locations-by-state)."
      - "Publix leads three states, and its Alabama and Georgia wins at 39.5% and 32.4% come from pushing north from Florida. [Publix locations by state](/rankings/food/publix-locations-by-state) shows how far it has spread. Walmart's grocery format leads only Arkansas at 33.9% and Oklahoma at 31.7%, and Walmart is headquartered in Bentonville, Arkansas."
  - id: "closest-supermarket-races-by-state"
    title: "Closest Supermarket Races by State"
    table:
      columns: { rank: "Rank", state: "State", leader: "Most Popular Chain", runner_up: "Runner-Up", gap: "Gap" }
      rows:
        - { rank: 1, state: "Massachusetts", state_slug: "massachusetts", leader: "Stop & Shop 24.1%", runner_up: "Market Basket 22.2%", gap: "1.9 points" }
        - { rank: 2, state: "New York", state_slug: "new-york", leader: "Wegmans 13.2%", runner_up: "Stop & Shop 10.7%", gap: "2.5 points" }
        - { rank: 3, state: "Oregon", state_slug: "oregon", leader: "Safeway 28.6%", runner_up: "Fred Meyer 26.0%", gap: "2.6 points" }
        - { rank: 4, state: "California", state_slug: "california", leader: "Safeway 10.4%", runner_up: "Ralphs 7.6%", gap: "2.8 points" }
        - { rank: 5, state: "Georgia", state_slug: "georgia", leader: "Publix 32.4%", runner_up: "Kroger 29.1%", gap: "3.3 points" }
        - { rank: 6, state: "New Mexico", state_slug: "new-mexico", leader: "Albertsons 30.0%", runner_up: "Smith's 26.6%", gap: "3.4 points" }
        - { rank: 7, state: "Delaware", state_slug: "delaware", leader: "Food Lion 24.4%", runner_up: "ACME Markets 19.4%", gap: "5.0 points" }
    paragraphs:
      - "Massachusetts is the tightest race, with Stop & Shop at 24.1% and the family-run Market Basket at 22.2%. Market Basket's low prices and fierce shopper loyalty, which showed in a famous 2014 customer boycott in support of its ousted chief executive, keep it close."
      - "California looks split because its 10.4% leader is a Safeway, and Ralphs at 7.6% is owned by Kroger. Georgia is a rare Publix and Kroger duel at 32.4% and 29.1%, while [grocery bill by state](/rankings/economy/grocery-bill-by-state) shows what households in each state spend at these checkouts."
faq:
  - { question: "What is the most popular supermarket in each state?", answer: "Kroger leads six states, Albertsons, Food Lion, and Safeway lead four each, and Hy-Vee, Publix, and Stop & Shop lead three each. Regional chains such as H-E-B in Texas and Wegmans in New York lead the rest of the map." }
  - { question: "What is the most popular grocery store in Texas?", answer: "H-E-B is the most popular grocery chain in Texas with 42.4% of grocery store visits. Kroger is second at 13.3%." }
  - { question: "Which supermarket has the biggest share in any state?", answer: "Hannaford has the biggest share, at 72.3% of grocery store visits in Maine. Hy-Vee in Iowa at 61.4% and Publix in Florida at 60.3% come next." }
  - { question: "What is the most popular grocery store in California?", answer: "Safeway leads California with 10.4% of grocery store visits, the lowest top share of any state. Ralphs is second at 7.6%." }
  - { question: "Is Walmart the most popular supermarket in any state?", answer: "Walmart's grocery format leads only Arkansas at 33.9% and Oklahoma at 31.7% in this visit data. Elsewhere regional chains such as Kroger, Publix, and H-E-B draw more grocery trips. See [Walmart locations by state](/rankings/economy/walmart-locations-by-state) for its store counts." }
  - { question: "Which state has the most competitive grocery market?", answer: "Massachusetts has the closest race, with Stop & Shop at 24.1% and Market Basket at 22.2%. New York and Oregon are next, each separated by under three points." }
