sections:
  - id: "why-california-has-the-most-petsmart-stores"
    icon: "fa-solid fa-paw"
    title: "Most PetSmart Stores by State"
    paragraphs:
      - "California leads with 164 PetSmart locations. A vast population spread across several major metropolitan regions gives the chain many separate markets for stores offering supplies, grooming, training, and veterinary care."
      - "Texas follows with 149 locations and Florida has 100. California's large pet-care network also includes the highest count in the [animal shelters by state](/rankings/economy/animal-shelters-by-state) table."
  - id: "states-with-the-fewest-petsmart-stores"
    icon: "fa-solid fa-store"
    title: "Fewest PetSmart Stores by State"
    paragraphs:
      - "Vermont and Wyoming have one PetSmart store each. Both states have small populations and few large metropolitan shopping corridors, leaving room for only a narrow big-box pet retail footprint."
      - "Alaska has two locations, while Hawaii, North Dakota, and South Dakota have three each. Geography raises different challenges for pet households, alongside the costs tracked in [pet ownership spending by state](/rankings/economy/pet-ownership-spending-by-state)."

