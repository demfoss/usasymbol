faq:
  - question: "Which state has the most PetSmart locations?"
    answer: "California has the most PetSmart locations with 164. Its multiple large metropolitan areas support the chain's largest state network."
  - question: "How many PetSmart locations are in Texas?"
    answer: "Texas has 149 PetSmart locations and ranks second behind California."
  - question: "How many PetSmart stores are in Florida?"
    answer: "Florida has 100 PetSmart stores, the third-highest total in the country."
  - question: "Which states have the fewest PetSmart stores?"
    answer: "Vermont and Wyoming have one PetSmart store each. Alaska follows with two."
  - question: "How many PetSmart locations are in New York?"
    answer: "New York has 60 PetSmart locations. It shares fifth place with Illinois and Pennsylvania."
  - question: "Are PetSmart stores in every state?"
    answer: "PetSmart has at least one store in every state. Vermont and Wyoming each have a single location."

