faq:
  - question: "Which state spends the most on back-to-school shopping?"
    answer: "Hawaii, at an average of $957 per family. New York ($920) and New Jersey ($919) rank second and third."

  - question: "Which state spends the least on back-to-school shopping?"
    answer: "Arkansas, at an average of $803 per family, just below Louisiana ($804), Ohio ($804), and Iowa ($804)."

  - question: "Which state has the biggest back-to-school shopping burden?"
    answer: "Mississippi. Families there spend 16.8% of their monthly income on back-to-school shopping, the highest share in the country, followed by West Virginia (16.3%) and Louisiana (15.8%)."

  - question: "Which state has the smallest back-to-school shopping burden?"
    answer: "Massachusetts, at 9.7% of monthly income, the only state under 10%. New Hampshire (10.2%) and Maryland and Utah (10.3% each) follow."

  - question: "How much do families spend on back-to-school shopping on average?"
    answer: "Across the 50 states, families spend an average of about $842 on back-to-school shopping, with state-adjusted figures ranging from $803 in Arkansas to $957 in Hawaii."

