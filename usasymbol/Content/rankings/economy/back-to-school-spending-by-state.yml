page:
  h1: "Back-to-School Spending by State"

  quick_answer:
    - "Hawaii families spend the most on back-to-school shopping at $957, followed by New York ($920) and New Jersey ($919). Arkansas spends the least at $803."
    - "Mississippi families face the heaviest back-to-school financial burden, committing 16.8% of their monthly income, followed by West Virginia (16.3%) and Louisiana (15.8%). Massachusetts has the lightest burden at just 9.7%."
    - "Across all 50 states, families spend an average of about $842 on back-to-school shopping, ranging from $803 in Arkansas to $957 in Hawaii after adjusting for regional prices."

  methodology: "Figures come from a LendingTree analysis that applied National Retail Federation 2025 K-12 back-to-school spending estimates and Bureau of Labor Statistics consumer price index data to build a national spending basket, then adjusted the basket's cost in each state using Bureau of Economic Analysis regional price parities. The financial burden percentage divides that state-adjusted spending figure by state median monthly household income. Data covers all 50 states; Washington, D.C. is excluded."

  sources:
    - name: "LendingTree"
      url: "https://www.lendingtree.com/debt-consolidation/back-to-school-study/"
      description: "State-by-state back-to-school spending estimates and financial burden analysis, published July 2026"

