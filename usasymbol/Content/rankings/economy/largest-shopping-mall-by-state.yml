faq:
  - question: "What is the largest mall in the United States?"
    answer: "Mall of America in Bloomington, Minnesota. Its 5,689,000 square feet is almost double American Dream in New Jersey at 3,000,000."

  - question: "What is the largest mall in Texas?"
    answer: "The Galleria in Houston, which opened in 1970 and holds 3,000,000 square feet. It ties American Dream for second place nationally."

  - question: "What is the largest mall in California?"
    answer: "South Coast Plaza in Costa Mesa, opened in 1967 at 2,623,385 square feet. Del Amo Fashion Center in Torrance is close behind at 2,517,765."

  - question: "What is the largest mall in Florida?"
    answer: "Aventura Mall in Aventura, which opened in 1983 and covers 2,700,000 square feet. Sawgrass Mills in Sunrise comes next at 2,370,610."

  - question: "What is the largest mall in New York?"
    answer: "Destiny USA in Syracuse, at 2,400,000 square feet. It began in 1990 as Carousel Center, and Roosevelt Field in Garden City (2,372,053), open since 1956, is the nearest rival."

  - question: "What is the largest mall in Illinois?"
    answer: "Woodfield Mall in Schaumburg, a northwest Chicago suburb, at 2,154,014 square feet. It opened in 1971."

