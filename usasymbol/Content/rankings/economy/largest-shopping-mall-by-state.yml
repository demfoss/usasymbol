  - id: "states-with-the-smallest-malls"
    title: "States With the Smallest Malls"
    paragraphs:
      - "Alaska's Dimond Center in Anchorage, opened in 1977, holds 728,000 square feet. The open-air Tikahtnu Commons in Anchorage is larger, but only enclosed malls count here. Mississippi's Edgewater Mall in Biloxi has 867,000, and the state's former giant, Metrocenter in Jackson, has closed."
      - "Arkansas lands at 860,156 square feet with Central Mall in Fort Smith, which opened in 1961. The larger Pinnacle Hills Promenade in Rogers is an open-air lifestyle center, so it does not count."
