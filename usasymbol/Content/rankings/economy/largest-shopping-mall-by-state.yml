sections:
  - id: "why-minnesota-has-the-largest-shopping-mall"
    title: "Why Minnesota Has the Largest Shopping Mall"
    paragraphs:
      - "Mall of America in Bloomington covers 5,689,000 square feet, nearly twice the next mall on the list. It opened in 1992 on the former site of Metropolitan Stadium, and its developers bet that a seven-acre indoor amusement park would pull in visitors through long Minnesota winters, a bet that made the mall a major stop for [tourism spending](/rankings/economy/tourism-spending-by-state)."
      - "Wyoming sits at the other end. Eastridge Mall in Casper opened in 1982 as a single-level enclosed mall of 575,248 square feet, and it serves the [least populous state](/rankings/demographics/states-by-population) in the country. Vermont's University Mall in South Burlington follows at 610,693."

  - id: "largest-malls-in-the-united-states"
    title: "Largest Malls in the United States"
    paragraphs:
      - "American Dream in East Rutherford opened in 2019 on the Meadowlands site of the unfinished Xanadu project, and it shares second place with The Galleria in Houston at 3,000,000 square feet. The Galleria opened in 1970."
      - "Pennsylvania's King of Prussia Mall (2,793,200) opened in 1963 and is older than most of the giants around it, while Florida's Aventura Mall (2,700,000) opened in 1983. Hawaii's Ala Moana Center, open since 1959, ties New York and Virginia at 2,400,000."
