seo:
  title: "Largest Shopping Mall by State | Map & Rankings"
  description: "Minnesota's Mall of America is the largest at 5,689,000 square feet. Wyoming's largest mall, Eastridge Mall in Casper, has 575,248 square feet."

page:
  h1: "Largest Shopping Mall by State"

  quick_answer:
    - "Largest shopping mall by state starts with Minnesota, where Mall of America in Bloomington covers 5,689,000 square feet. An indoor amusement park at its center helped it outgrow every rival."
    - "Wyoming's largest mall is Eastridge Mall in Casper at 575,248 square feet. A single-level enclosed mall serves the least populous state in the country."
    - "New Jersey and Texas tie for second at 3,000,000 square feet, with American Dream in East Rutherford, opened in 2019, and The Galleria in Houston. Pennsylvania's King of Prussia Mall follows at 2,793,200."

  methodology: "Largest enclosed mall by gross leasable area in square feet, from Wikipedia mall lists, owner and broker listings, and local news. Open-air centers are not counted. Figures marked approximate vary by source. Year is first opening."

  sources:
    - name: "Wikipedia, List of largest shopping malls in the United States"
      url: "https://en.wikipedia.org/wiki/List_of_largest_shopping_malls_in_the_United_States"
      description: "Gross leasable area and opening year for malls above 2,000,000 square feet"
    - name: "Wikipedia, List of shopping malls in the United States and state mall lists"
      url: "https://en.wikipedia.org/wiki/List_of_shopping_malls_in_the_United_States"
      description: "Mall names, cities, opening years and per-mall size figures for each state"
    - name: "Simon, Macerich, Brookfield Properties and Taubman property pages"
      url: "https://www.simon.com/mall"
      description: "Owner figures and opening dates for individual malls"
    - name: "ICSC, International Council of Shopping Centers"
      url: "https://www.icsc.com/"
      description: "Shopping center definitions and award entries listing retail space"

