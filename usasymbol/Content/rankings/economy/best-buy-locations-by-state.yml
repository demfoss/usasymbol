faq:
  - question: How many Best Buy locations are in California?
    answer: California has 146 listed locations. The network includes Pacific Sales, whose kitchen and bath focus adds a different shopping format to the familiar electronics superstore.
  - question: How many Best Buy stores are in Texas?
    answer: Texas has 109 listed locations and ranks second. Houston and Dallas-Fort Worth anchor separate metropolitan retail markets, with suburbs surrounding each.
  - question: Which states have the fewest Best Buy locations?
    answer: Rhode Island, Vermont, and Wyoming tie with one each. A compact coastal state and two states with mountain or plains communities can share the same small total despite very different distances between towns.
  - question: Does Best Buy have locations in every state?
    answer: Best Buy lists locations in all 50 states. Alaska and South Dakota each have two, reaching remote northern and Great Plains markets as well as the large coastal states.
  - question: Are Pacific Sales stores counted as Best Buy locations?
    answer: Yes. Pacific Sales locations contribute to California's 146-location total, bringing kitchen and bath retail into the same listed network as electronics stores and outlets.
