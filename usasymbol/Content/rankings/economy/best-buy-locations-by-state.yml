sections:
  - id: states-with-most-best-buy
    title: States With the Most Best Buy Locations
    paragraphs:
      - Texas's 109 locations and Florida's 66 place both states behind California. Dallas-Fort Worth and Houston form separate Texas retail markets, while Florida's peninsula separates inland Orlando from Gulf and Atlantic coastal cities. [Home Depot's store map](/rankings/economy/home-depot-locations-by-state) offers a comparison with another chain selling household equipment.
