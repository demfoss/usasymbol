      description: California city entries include Pacific Sales locations, so the count is broader than standard Best Buy stores.
    - name: Pacific Sales Valencia Store
      url: https://stores.bestbuy.com/ca/valencia/29011-the-old-rd-1721-pacific-sales.html
      description: An official Pacific Sales store entry illustrating an included subsidiary format.
