faq:
  - question: "Which state is the easiest to save money in?"
    answer: "Tennessee ranks 1st overall. It places 3rd for tax burden, 10th for local economy, and 14th for interest rates on savings accounts."

  - question: "Which state is the hardest to save money in?"
    answer: "Hawaii ranks last among the 50 states. It places 50th for interest rates, 50th for local economy, and 48th for tax burden."

  - question: "Which state has the best tax rank for savers?"
    answer: "Alaska ranks 1st for tax burden nationally, though its interest rate rank is much lower at 49th, giving it an overall rank of 35th."

  - question: "Which state has the best interest rates on savings accounts?"
    answer: "Illinois ranks 1st for interest rates. Its tax rank of 44th still holds it to 17th overall."

  - question: "Which state has the best local economy rank?"
    answer: "South Dakota ranks 1st for local economy. Combined with a 4th-place tax rank, it reaches 7th overall despite a 41st-place interest rate rank."

  - question: "How does California rank for saving money?"
    answer: "California ranks 47th overall. Its interest rate rank is a strong 3rd, but a 46th-place tax rank and a 49th-place local economy rank pull the overall rank down."

