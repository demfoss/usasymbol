page:
  h1: "Easiest and Hardest States to Save Money"

  quick_answer:
    - "Tennessee ranks as the easiest state to save money in the country, placing 3rd for tax burden, 10th for local economy, and 14th for interest rates on savings accounts."
    - "Hawaii ranks last among the 50 states, placing 50th for interest rates, 50th for local economy, and 48th for tax burden."
    - "California posts the 3rd-best interest rate rank in the country but falls to 47th overall, dragged down by a 46th-place tax rank and a 49th-place local economy rank."

  methodology: "Rankings come from Bankrate's Easiest and Hardest States to Save Money study by Marcos Cabello, published April 14, 2025. States are scored on economic conditions (50%), tax burden (25%), and interest rates on CDs and money market accounts as of February 19, 2025 (25%). Washington, D.C. is excluded."

  sources:
    - name: "Bankrate. Easiest and Hardest States to Save Money in 2025 (Marcos Cabello, April 14, 2025)"
      url: "https://www.bankrate.com/banking/savings/best-state-to-save-money-study"
      description: "Study ranking all 50 states on their ability to help residents save money, based on cost of living, income growth, employment growth, debt-to-income ratio, state and local tax burden, and average CD and money market account rates."

