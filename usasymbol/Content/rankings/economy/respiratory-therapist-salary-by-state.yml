faq:
  - question: "What state pays respiratory therapists the most?"
    answer: "New York has the highest mean hourly pay at $52.98 and median annual pay of $107,810. Those measures offer different benchmarks, since the average and the middle worker's wage need not match."
  - question: "Where do respiratory therapists earn the most after cost of living?"
    answer: "New York leads at $102,112 in price-adjusted annual pay. The amount represents purchasing power at national prices and is not an employer's advertised salary or a calculation of take-home pay."
  - question: "How much does a respiratory therapist make in Texas?"
    answer: "Texas averages $81,010 annually and $38.95 hourly, ranking 26th. Median pay is $79,540, an additional benchmark for comparing an offer with the middle of the state's wage distribution."
  - question: "How much does a respiratory therapist make in Florida?"
    answer: "Florida averages $82,400 a year and $39.61 an hour. Its median of $81,160 sits below the mean, so an individual offer should be compared with both measures rather than just the average."
  - question: "How much does a respiratory therapist make in California?"
    answer: "California averages $109,440 annually and $52.62 hourly, ranking second. Its median is $104,820, and the figures exclude self-employed workers rather than describing every possible source of clinical income."
  - question: "Which state pays respiratory therapists the least?"
    answer: "Mississippi has the lowest mean hourly pay at $32.75. A statewide benchmark combines different positions and does not predict a particular hospital's shift schedule, benefits, or offer."
  - question: "Is respiratory therapist pay the same as physical therapist pay?"
    answer: "No. New York respiratory therapists average $110,200 annually, but [physical therapist salaries](/rankings/economy/physical-therapist-salary-by-state) cover a different occupation. Respiratory therapy focuses on breathing and cardiopulmonary care rather than rehabilitation of movement."
