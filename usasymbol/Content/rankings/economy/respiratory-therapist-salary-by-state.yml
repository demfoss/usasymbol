sections:
  - id: highest-respiratory-therapist-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Respiratory Therapist Salaries"
    paragraphs:
      - "New York leads at $110,200, with median pay of $107,810. Higher housing and other household expenses create pressure for employers to offer higher wages when recruiting staff. New York still leads after prices, however, so this mechanism accounts for part of its gross wage advantage rather than explaining away the entire premium."
      - "California follows at $109,440, with median pay of $104,820. Respiratory therapists work in emergency rooms, critical care units, and neonatal intensive care, supporting patients who cannot breathe adequately on their own. A comparison with [registered nurse salaries](/rankings/economy/nurse-salary-by-state) places the wage within healthcare employment while preserving the distinction between clinical roles."
