seo:
  title: "Respiratory Therapist Salary by State | Map & Pay"
  description: "Respiratory therapists average $110,200 annually in New York and $68,120 in Mississippi. New York also leads after living costs."
page:
  h1: "Respiratory Therapist Salary by State"
  quick_answer:
    - "Respiratory therapist salary by state is highest in New York at $110,200 a year. Higher household prices help explain a wage premium, but New York remains first in purchasing power after those costs are considered."
    - "Mississippi averages $68,120, the lowest respiratory therapist pay. Lower prices improve its position slightly after adjustment, but do not eliminate the wage gap with leading states."
    - "Florida moves from 23rd in gross salary to 46th in purchasing power, the largest change in position. California has the most employee jobs even though New York leads in pay."
  methodology: "BLS OEWS May 2025 wages and employment for respiratory therapists, SOC 29-1126, in all 50 states, excluding DC and self-employed workers. Adjusted pay divides mean annual wages by BEA 2024 all-items RPP and multiplies by 100."
