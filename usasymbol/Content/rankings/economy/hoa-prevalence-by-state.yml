sections:
  - id: "hoa-prevalence-by-state-top-and-bottom"
    icon: "fa-solid fa-house-circle-check"
    title: "HOA Prevalence by State Top and Bottom"
    paragraphs:
      - "Nevada ranks first at 51.3%, followed by Arizona at 44.7%, Florida at 44.3%, Colorado at 42.4%, and Hawaii at 42.0%. Delaware is close behind at 40.5%."
      - "North Dakota ranks last at 7.7%. Maine is next at 8.0%, Rhode Island is at 9.9%, and South Dakota is at 10.0%."

  - id: "states-with-the-highest-hoa-fees"
    icon: "fa-solid fa-money-check-dollar"
    title: "States With the Highest HOA Fees"
    paragraphs:
      - "New York has the highest median monthly HOA fee at $739, even though only 14.3% of owned homes pay one. Hawaii is next at $470, and Massachusetts is at $376."
      - "Connecticut reaches $351, New Hampshire is at $316, and Rhode Island is at $314. New Jersey also stands out at $300."

  - id: "states-with-the-lowest-hoa-prevalence"
    icon: "fa-solid fa-house"
    title: "States With the Lowest HOA Prevalence"
    paragraphs:
      - "North Dakota, Maine, Rhode Island, South Dakota, and Wisconsin make up the bottom five for HOA prevalence. Their shares range from 7.7% to 10.5%."
      - "Arkansas is also low at 12.1%, and Mississippi is at 13.0%. California is much higher than those states at 23.7%, but still far below Nevada at 51.3%."

visual_assets:
  - id: hoa-top-and-bottom
    src: /images/rankings/economy/hoa-prevalence-by-state/hoa-top-and-bottom.jpg
    alt: Aerial view of a master-planned residential neighborhood
    caption: HOA prevalence is highest in fast-growing Sun Belt states where large master-planned subdivisions and condo communities are common. Nevada sits clearly at the top, with more than half of owner-occupied homes paying some form of HOA or condo fee.
    section: hoa-prevalence-by-state-top-and-bottom
    layout: full-width-tall

  - id: highest-hoa-fees
    src: /images/rankings/economy/hoa-prevalence-by-state/highest-hoa-fees.jpg
    alt: Exterior of a condo or apartment-style residential building in an urban area
    caption: High HOA fees are often associated with denser condo buildings, building maintenance, and more expensive urban real estate markets. New York leads by a wide margin on monthly cost even though relatively few owned homes there pay HOA fees at all.
    section: states-with-the-highest-hoa-fees
    layout: full-width-tall

  - id: lowest-hoa-prevalence
    src: /images/rankings/economy/hoa-prevalence-by-state/lowest-hoa-prevalence.jpg
    alt: Small-town residential neighborhood with detached homes and wide spacing
    caption: The lowest-HOA states are concentrated in places where owner-occupied housing is more often made up of detached homes outside planned associations. North Dakota, Maine, and South Dakota all sit near the bottom of the table.
    section: states-with-the-lowest-hoa-prevalence
    layout: full-width-tall

faq:
  - question: "Which state has the highest HOA prevalence?"
    answer: "Nevada has the highest HOA prevalence at 51.3% of owned homes paying a condo or HOA fee. Arizona is next at 44.7%."

  - question: "Which state has the lowest HOA prevalence?"
    answer: "North Dakota is lowest at 7.7%. Maine follows at 8.0%."

  - question: "What is HOA prevalence in Florida?"
    answer: "Florida is at 44.3%, the third-highest share in the country. Its median monthly HOA fee is $230."

  - question: "What is HOA prevalence in California?"
    answer: "California is at 23.7% of owned homes paying a condo or HOA fee. Its median monthly HOA fee is $278."

  - question: "What is HOA prevalence in Texas?"
    answer: "Texas is at 34.3%, just behind South Carolina at 34.4% and ahead of Virginia at 34.0%. The median monthly HOA fee in Texas is $76."

  - question: "Which state has the highest median HOA fee?"
    answer: "New York has the highest median monthly HOA fee at $739. Hawaii is next at $470, even though Hawaii also has a much higher prevalence at 42.0%."

