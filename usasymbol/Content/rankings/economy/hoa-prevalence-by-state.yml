seo:
  title: "HOA Prevalence by State | Map, Fees & Facts"
  description: "Nevada leads at 51.3% of owned homes paying condo or HOA fees. North Dakota is lowest at 7.7%, and New York has the highest median fee at $739."

page:
  h1: "HOA Prevalence by State"

  quick_answer:
    - "HOA prevalence by state is highest in Nevada, where 51.3% of owned homes paid a condo or HOA fee in 2024."
    - "North Dakota is lowest at 7.7%. Maine is next at 8.0%, and Rhode Island is at 9.9%."
    - "New York is only 14.3% by prevalence, but its median monthly fee is the highest at $739. Hawaii is next at $470."

  methodology: "HOA prevalence is the share of owner-occupied homes with a required condo or homeowners association fee, using U.S. Census Bureau ACS 2024 table B25142. Median monthly HOA fee uses ACS 2024 table B25143."

  sources:
    - name: "U.S. Census Bureau. Nearly a Quarter of Homeowners Paid Condo or HOA Fees in 2024"
      url: "https://www.census.gov/library/stories/2025/09/condo-hoa-fees.html"
      description: "America Counts story summarizing 2024 ACS data on households paying condo or HOA fees"
    - name: "U.S. Census Bureau. Table 1. Share of U.S. Owned Households That Paid Condo/Homeowners Association Fee. 2024"
      url: "https://www.census.gov/content/dam/Census/library/stories/2025/09/condo-hoa-fees/table-1-condo-hoa-fees.jpg"
      description: "State-by-state table with percent of households paying condo or HOA fees and median monthly fee"

