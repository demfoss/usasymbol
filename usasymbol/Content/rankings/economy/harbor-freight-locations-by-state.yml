faq:
  - question: "Which state has the most Harbor Freight locations?"
    answer: "California has the most Harbor Freight locations with 150. The company started in North Hollywood before developing its national retail network."
  - question: "How many Harbor Freight locations are in Texas?"
    answer: "Texas has 136 Harbor Freight stores and ranks second. Only California has more."
  - question: "How many Harbor Freight stores are in Florida?"
    answer: "Florida has 93 Harbor Freight stores, the third-highest total in the country."
  - question: "Which states have no Harbor Freight stores?"
    answer: "Alaska and Hawaii have no listed Harbor Freight stores. Every state in the contiguous United States has at least one."
  - question: "How many Harbor Freight stores are in Rhode Island?"
    answer: "Rhode Island has one Harbor Freight store, the lowest nonzero state total."
  - question: "Where was the first Harbor Freight store?"
    answer: "Harbor Freight opened its first retail store in Lexington, Kentucky, in 1980. Kentucky now has 32 locations."

