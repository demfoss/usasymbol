sections:
  - id: "why-california-has-the-most-harbor-freight-stores"
    icon: "fa-solid fa-screwdriver-wrench"
    title: "Most Harbor Freight Stores by State"
    paragraphs:
      - "California has 150 Harbor Freight locations. The company began in North Hollywood in 1977 as a mail-order tool business, giving its home state an early base as the chain moved into storefront retail."
      - "Texas follows with 136 stores and Florida has 93. Their large populations and extensive suburban markets also support many [Home Depot locations](/rankings/economy/home-depot-locations-by-state) and [Lowe's locations](/rankings/economy/lowes-locations-by-state)."
  - id: "states-with-the-fewest-harbor-freight-stores"
    icon: "fa-solid fa-location-dot"
    title: "Fewest Harbor Freight Stores by State"
    paragraphs:
      - "Alaska and Hawaii have no listed Harbor Freight locations. Both sit outside the contiguous freight network, a practical obstacle for a retailer built around heavy tools, shop equipment, and frequent truck deliveries."
      - "Rhode Island has one store, the smallest nonzero total. Its compact land area limits the number of separate retail markets compared with large states, even though nearby New England states add more locations."

