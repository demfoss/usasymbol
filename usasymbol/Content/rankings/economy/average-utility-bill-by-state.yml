faq:
  - question: "Which state has the highest average utility bill?"
    answer: "West Virginia, at about $715 a month. Alaska ($647) and Missouri ($631) rank second and third."

  - question: "Which state has the lowest average utility bill?"
    answer: "New Mexico, at about $384 a month, the only state under $400. Wisconsin ($418) and South Dakota ($428) rank second and third lowest."

  - question: "What is included in the average utility bill by state?"
    answer: "The total combines electricity, natural gas, water, and sewer bills with average trash, streaming, internet, and phone costs. Electricity, gas, and water alone add up to a national subtotal of about $279 a month."

  - question: "Which state has the highest water bill?"
    answer: "West Virginia, at about $123 a month, nearly triple the U.S. average of $48. Oregon ($94) and Alaska ($93) rank second and third."

  - question: "What is the average utility bill in the United States?"
    answer: "About $594 a month for the full bundle of home utilities and services, or roughly $279 a month for electricity, natural gas, and water alone ($141 electricity, $90 natural gas, $48 water)."

