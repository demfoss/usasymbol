    paragraphs:
      - "West Virginia's $715 average tops the list by $68 over second-place Alaska. No single utility explains it: West Virginia pays a mid-pack $164 for electricity but the nation's highest water and sewer bill at $123, on top of a $110 natural gas bill that's also among the highest."
      - "Alaska ($647) and Missouri ($631) round out the top three for different reasons. Alaska's remote pipelines push its natural gas bill to $141, on par with what most states pay for electricity, while Missouri combines an above-average $141 electric bill with a $124 gas bill, the third-highest in the country."

