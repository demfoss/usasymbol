    paragraphs:
      - "West Virginia's $123 water and sewer bill is nearly three times the U.S. average of about $48, largely due to aging rural infrastructure that raises treatment and pipe-maintenance costs per customer. Oregon ($94) and Alaska ($93), both states with widely dispersed populations, follow."
      - "Natural gas tells a similar story on its own axis: Alaska ($141) and Ohio ($140) pay nearly as much for gas as most states pay for electricity, while Massachusetts ($126), Missouri ($124), and Wyoming ($124) round out the priciest gas markets."

