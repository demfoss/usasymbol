page:
  h1: "Average Utility Bill by State"

  quick_answer:
    - "West Virginia has the highest average total monthly utility bill at $715, followed by Alaska ($647) and Missouri ($631)."
    - "New Mexico has the lowest average utility bill at $384 a month, followed by Wisconsin ($418) and South Dakota ($428), all less than 60% of West Virginia's total."
    - "Electricity is the single biggest utility cost nationally at about $141 a month, but the extremes come from other categories: West Virginia's $123 water and sewer bill is the highest in the country, and Alaska's $141 natural gas bill rivals what most states pay for power."

  methodology: "Total monthly utility bill figures, along with the electricity, natural gas, and water components, are 2026 estimates compiled by Move.org from EIA, FRED, EPA, and utility survey data. The total additionally reflects average sewer, trash, streaming, internet, and phone costs, so it runs well above the electricity-gas-water subtotal alone. The District of Columbia is excluded because this page ranks the 50 states only."

  sources:
    - name: "Move.org — Utility Bills 101"
      url: "https://www.move.org/utility-bills-101/"
      description: "State-by-state average monthly utility costs, including electricity, natural gas, water, sewer, trash, and other home services, compiled from EIA, FRED, and EPA data, updated 2026"
    - name: "U.S. Energy Information Administration (EIA)"
      url: "https://www.eia.gov"
      description: "Underlying data on residential electricity and natural gas prices and consumption by state"

