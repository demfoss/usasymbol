seo:
  title: "Medical Assistant Salary by State | Map & Pay"
  description: "Medical assistants average $58,590 a year in Washington and $36,180 in Louisiana. Alaska leads after adjustment for living costs."
page:
  h1: "Medical Assistant Salary by State"
  quick_answer:
    - "Medical assistant salary by state is highest in Washington at $58,590 a year. Higher local prices help explain the wage premium for workers who support clinical appointments and keep medical offices running."
    - "Louisiana has the lowest medical assistant average at $36,180. Its lower prices soften the dollar gap, although its adjusted wage remains last at $41,017."
    - "Alaska leads after adjustment at $55,325 in annual purchasing power. Washington pays more dollars, but Alaska's lower statewide price level reverses their order."
  methodology: "BLS OEWS May 2025 medical assistant wages, SOC 31-9092, cover all 50 states and exclude DC and self-employment. Adjusted annual pay divides mean wages by BEA 2024 all-items RPP relative to national prices."
