  - id: lowest-medical-assistant-pay
    icon: "fa-solid fa-house-medical"
    title: "Lowest Paying States for Medical Assistants"
    paragraphs:
      - "Louisiana averages $36,180 in a state where the price basket is below the national level. Less expensive living helps explain lower nominal wages because an equivalent purchasing-power budget requires fewer dollars. Its $41,017 adjusted average still ranks last, so local prices account for only part of the difference."
      - "Texas averages $41,240 despite having the second-largest medical assistant workforce at 75,340 jobs. These workers are often based in physicians' offices, where appointment flow connects reception, examination rooms, and clinical support. A large employment market can offer many workplaces without commanding the highest statewide pay."
    table:
      columns:
        rank: "Pay Rank"
