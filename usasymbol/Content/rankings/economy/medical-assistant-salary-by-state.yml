map:
  title: "Medical Assistant Salary by State Map"
  image_alt: "State map of medical assistant salaries, highest in Washington and lowest in Louisiana"
  caption: "Washington averages $58,590 a year for medical assistants. Alaska follows at $56,630, while Louisiana averages $36,180."
  metric_key: mean_annual
  metric_label: "Average annual medical assistant salary"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-medical-assistant-pay
    icon: "fa-solid fa-stethoscope"
    title: "Highest Paying States for Medical Assistants"
    paragraphs:
      - "Washington's $58,590 average comes from a higher-price labor market, where local employers recruit workers who face expensive everyday bills. Geographic living costs are one influence on pay, alongside experience and the kind of practice. Its $54,750 adjusted wage remains second, showing that the leading dollar figure is not simply erased by prices."
      - "Washington's $59,290 median exceeds its mean, a useful warning against assuming the average always sits above the middle worker. Medical assistants may record vital signs, prepare patients, schedule appointments, and handle office administration. Duties vary by practice, so similar job titles can cover different combinations of clinical and desk work."
    table:
      columns:
        rank: "Rank"
        state: "State"
        mean_annual: "Avg. Annual Salary"
        mean_hourly: "Avg. Hourly Wage"
