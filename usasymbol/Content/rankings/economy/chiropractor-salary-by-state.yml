faq:
  - question: "What state pays chiropractors the most?"
    answer: "New Jersey pays the highest mean at $126,020 a year and $60.59 an hour. Its annual median is $134,990."
  - question: "How much does a chiropractor make in New Jersey?"
    answer: "New Jersey chiropractors average $126,020 annually, with a $134,990 median. The state has 1,370 employee positions in the occupation."
  - question: "How much does a chiropractor make in California?"
    answer: "California chiropractors average $101,190 a year and $48.65 an hour. Its 2,760 employee jobs rank third by employment."
  - question: "How much does a chiropractor make in Texas?"
    answer: "Texas chiropractors average $96,420 annually, with an $87,520 median. The state employs 2,840, second only to Florida."
  - question: "What is the lowest chiropractor salary by state?"
    answer: "Utah has the lowest reported mean at $62,900 a year and $30.24 an hour. Its median is $53,900."
  - question: "Why are Delaware and Vermont missing from the chiropractor ranking?"
    answer: "No publishable mean annual wage is available for Delaware or Vermont, so neither can be placed in a salary ranking."
