faq:
  - question: "What state pays carpenters the most?"
    answer: "Hawaii has the highest average carpenter pay. Its $85,280 median also means that half of employed carpenters earn at least that amount, placing the middle of its wage distribution well above mainland low-pay markets."
  - question: "How much does a carpenter make in California?"
    answer: "California carpenters average $78,810 a year or $37.89 an hour. Carpentry includes concrete formwork and scaffolding on large projects as well as residential framing and finish work."
  - question: "How much does a carpenter make in Texas?"
    answer: "Texas carpenters average $50,990 a year, with a $48,900 median. Apprentices usually start below fully trained carpenters and earn more as they acquire framing, blueprint, and layout skills."
  - question: "How much does a carpenter make in New York?"
    answer: "New York carpenters average $75,970 a year, and the median is $72,330. Commercial carpenters can build shoring, scaffold systems, and concrete forms rather than finished wooden interiors."
  - question: "How much does a carpenter make in Florida?"
    answer: "Florida carpenters average $52,560 a year or $25.27 an hour. Exterior carpentry follows the construction schedule, and severe weather can interrupt work even in a warm climate."
  - question: "Do carpenter apprentices earn the full salary in Illinois?"
    answer: "Illinois's $80,320 average covers the employed trade across experience levels. Apprentices begin with simpler measuring and cutting tasks at lower pay, then progress to reading plans and building structures as their wages increase."
