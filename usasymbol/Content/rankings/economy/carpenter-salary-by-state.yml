  - id: why-carpenter-salaries-vary-by-state
    icon: "fa-solid fa-scale-balanced"
    title: "Why Carpenter Salaries Vary by State"
    paragraphs:
      - "Hawaii leads at $87,480 in a market where island housing and everyday purchases cost much more than the national norm. State and county construction also carries prevailing wage requirements, giving carpenters on covered public projects a wage floor tied to the local trade. Those are concrete supports for its high pay."
      - "Mississippi's $49,280 average belongs to a different local economy. Its housing rents and overall prices sit among the lowest in the country, reducing the living costs that workers must cover and the upward wage pressure found in expensive construction markets. Local prices also help explain differences in [plumber salary by state](/rankings/economy/plumber-salary-by-state)."
  - id: states-with-the-most-carpenter-jobs
    icon: "fa-solid fa-hammer"
    title: "States With the Most Carpenter Jobs"
    paragraphs:
      - "California has 100,750 carpenter jobs, connecting the trade to everything from home renovation to commercial building frames. Carpenters install doors, cabinets, and molding as well as structural supports, and their work often precedes the wiring and equipment covered in [electrician salary by state](/rankings/economy/electrician-salary-by-state) and [HVAC technician salary by state](/rankings/economy/hvac-technician-salary-by-state)."
