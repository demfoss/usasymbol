page:
  h1: "Carpenter Salary by State"
  quick_answer:
    - "Carpenter salary by state is highest in Hawaii at $87,480 a year. Expensive island living and prevailing wage requirements on public construction help support a high wage market."
    - "Mississippi pays carpenters the least at $49,280 a year. Housing and other living costs are also among the country's lowest, giving employers a much lower local wage environment than Hawaii."
    - "California employs 100,750 carpenters. Their work extends beyond wooden houses to the concrete forms, scaffolding, and temporary supports used on large buildings and bridges."
  methodology: "BLS OEWS May 2025 employee wages and employment for carpenters, SOC 47-2031, in all 50 states. Rankings use mean annual wages. DC and self-employed workers are excluded. Price context uses BEA 2024 Regional Price Parities."
