    title: "How to Read the Fewest Target Location Counts"
    paragraphs:
      - "Vermont has the fewest Target locations at 1. Alaska and Wyoming share a count of 3, while North Dakota and Rhode Island each have 4."
      - "These are absolute state totals from the July 2026 locator snapshot. A low count does not by itself indicate weak sales, low demand, or the size of the stores in that state."

