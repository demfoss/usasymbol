sections:
  - id: "why-texas-has-the-most-dollar-general-locations"
    icon: "fa-solid fa-store"
    title: "Why Texas Has the Most Dollar General Locations"
    paragraphs:
      - "Texas leads with 1,892 Dollar General locations, 780 more than Georgia's 1,112. North Carolina follows with 1,105, and much of the top of the ranking is concentrated in the South."
      - "Texas's large population and geographic area are consistent with a broad retail footprint, but this dataset counts stores only. It does not measure sales, store size, market share, or locations per resident."

  - id: "why-alaska-and-hawaii-show-zero-dollar-general-locations"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "Why Alaska and Hawaii Show Zero Dollar General Locations"
    paragraphs:
      - "Alaska and Hawaii are the only states with no Dollar General locations listed in the July 2026 source. Both therefore share rank 49, while Idaho has the lowest nonzero count at 9."
      - "A zero means the public locator returned no stores for that state in this snapshot. It should not be read as a forecast or a permanent statement about the chain's expansion plans."

