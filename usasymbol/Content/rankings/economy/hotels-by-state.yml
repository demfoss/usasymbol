  - id: "why-california-has-most-hotels"
    icon: "fa-solid fa-umbrella-beach"
    title: "Why California Has the Most Hotels"
    paragraphs:
      - "California's 6,020 establishments serve a chain of distinct destinations rather than one tourism center. Los Angeles, San Diego, and San Francisco draw urban visitors, while the Pacific coast, Sierra Nevada resorts, wine country, and desert parks create lodging markets across the state's length. [States with the most national parks](/rankings/geography/states-with-most-national-parks) highlights one part of that destination mix."
      - "Rhode Island has 158 establishments within the nation's smallest state by area. Providence and Newport anchor its lodging market, but short driving distances also let visitors stay elsewhere in southern New England and cross the state quickly."

