page:
  h1: "Hotels by State 2023"
  quick_answer:
    - "Hotels by state are led by California with 6,020 hotel and motel establishments. Its major cities, coastline, mountain resorts, and national parks create many distinct lodging markets."
    - "Rhode Island has the fewest hotel and motel establishments at 158. Its small land area and position within the wider New England travel market limit the number of separate destinations."
    - "Texas ranks second with 5,643 establishments, followed by Florida with 3,546. Texas serves many dispersed business markets, while Florida combines beach tourism with major theme-park destinations."
  methodology: "U.S. Census Bureau 2023 County Business Patterns establishments for NAICS 721110, Hotels except Casino Hotels and Motels. Casino hotels, RV parks, rooming houses, and vacation rentals are excluded."
  sources:
