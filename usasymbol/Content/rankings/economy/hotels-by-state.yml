faq:
  - question: "Which state has the most hotels?"
    answer: "California has the most, with 6,020 hotel and motel establishments. Its lodging markets stretch from major coastal cities to mountain, wine-country, and desert destinations."
  - question: "Which state has the fewest hotels?"
    answer: "Rhode Island has the fewest at 158. The state is geographically compact, with Providence and Newport accounting for much of its destination travel."
  - question: "How many hotels are in Texas?"
    answer: "Texas has 5,643 hotel and motel establishments and ranks second. Its enormous area creates separate lodging markets around major metros, energy centers, highway corridors, and smaller regional cities."
  - question: "How many hotels are in Florida?"
    answer: "Florida has 3,546 hotel and motel establishments, the third-highest total. Beach communities, cruise ports, Orlando theme parks, and Miami support several major visitor markets."
  - question: "Are casino hotels included?"
    answer: "No. Casino hotels fall into a separate industry category, so Nevada's 424 establishments here cover hotels and motels without casino hotels."
  - question: "How many hotels are in California?"
    answer: "California has 6,020 hotel and motel establishments. The total spans urban business hotels, roadside motels, coastal lodging, ski destinations, and properties near major parks."

