faq:
  - question: "Which state has the highest unemployment rate"
    answer: "Nevada and California consistently rank among the states with the highest unemployment rates. Nevada's economy depends heavily on tourism and hospitality — industries that are especially sensitive to recessions and travel slowdowns. California's large size and diverse economy produces both high-wage tech jobs and high unemployment in lower-wage service sectors."
  - question: "Which state has the lowest unemployment rate"
    answer: "Hawaii and South Dakota record the lowest unemployment rates at 2.2%, followed by North Dakota and Vermont at 2.6%. These states have small, tight labor markets and economies anchored by agriculture, tourism, and energy that offer stable year-round employment."
  - question: "What counts as unemployed in the BLS data"
    answer: "The BLS counts someone as unemployed only if they are without a job, available to work, and have actively looked for work in the past four weeks. People who have stopped looking (discouraged workers) are not counted in the official unemployment rate, which is why some economists also track U-6, a broader measure."
  - question: "Does a low unemployment rate mean the economy is strong"
    answer: "A low unemployment rate is a positive indicator, but context matters. A state can have low unemployment because it has a thriving economy or because people have left the labor force entirely. The employment-to-population ratio captures a fuller picture of how many working-age residents are actually employed."

