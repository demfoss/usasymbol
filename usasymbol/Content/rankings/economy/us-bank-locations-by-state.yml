sections:
  - id: states-with-most-us-bank
    title: States With the Most U.S. Bank Branches
    paragraphs:
      - Minnesota has 103 full-service branches, while California's 561 place a much larger network on the West Coast. A bank's identity and corporate home need not predict its biggest branch market, particularly when mergers combine previously separate networks. [Chase branches by state](/rankings/economy/chase-bank-by-state) provide a separate comparison.
