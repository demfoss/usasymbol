  - id: why-california-leads-us-bank
    title: Why California Leads U.S. Bank Branches
    paragraphs:
      - California's 561 branches partly reflect U.S. Bank's acquisition of Union Bank at the end of 2022. Buying an established bank transfers an existing branch network, creating a different geographic footprint from one assembled only through individually opened offices.
      - Georgia's single qualifying branch sits outside the bank's traditional retail branch territory. Its move into Atlanta business banking used bankers serving companies, a different way to enter a market from acquiring an established consumer branch network such as Union Bank. The broader [banks by state ranking](/rankings/economy/banks-by-state) puts individual branch networks in an institutional context.
  - id: us-bank-in-store-branches
    title: U.S. Bank In-Store Branches by State
    paragraphs:
      - California has 81 full-service branches inside retail premises, compared with 480 standalone branches. These retail offices accept deposits and provide full-service banking, so removing them would change what the ranking measures rather than merely clean up duplicate addresses.
