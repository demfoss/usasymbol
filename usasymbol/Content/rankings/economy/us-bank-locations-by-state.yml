faq:
  - question: How many U.S. Bank branches are in California?
    answer: California has 561 full-service branches in the October 2026 inventory. The count combines 480 standalone branches with 81 offices inside retail premises.
  - question: How many U.S. Bank branches are in Ohio?
    answer: Ohio has 158 and ranks second. Its total includes full-service retail offices as well as standalone branches.
  - question: How many U.S. Bank branches are in Minnesota?
    answer: Minnesota has 103 qualifying branches. Minneapolis is the bank's corporate home, placing its headquarters in a state whose network is smaller than California's acquired branch base.
  - question: Does U.S. Bank have branches in Texas?
    answer: Texas has two qualifying full-service branches. The bank also built business-banking teams in Houston and Dallas, entering those markets through company relationships outside its traditional retail branch territory.
  - question: Are U.S. Bank ATMs included in branch counts?
    answer: No. California's 561 counts full-service banking offices, including offices inside retail premises. Standalone ATMs and offices classified only for administration or lending are excluded.
  - question: Which states have no qualifying U.S. Bank branches?
    answer: Alabama, Alaska, Connecticut, Delaware, Hawaii, Louisiana, Maine, Maryland, Massachusetts, Michigan, Mississippi, New Hampshire, New Jersey, New York, Oklahoma, Pennsylvania, Rhode Island, South Carolina, Vermont, Virginia, and West Virginia have no qualifying full-service branch. New England is entirely in this group, contrasting with the bank's much denser western network.
