  title: U.S. Bank Locations by State | Map & Branch Counts
  description: California has 561 full-service U.S. Bank branches, followed by Ohio with 158. Georgia has one in the October 2026 branch inventory.
page:
  h1: U.S. Bank Locations by State
  quick_answer:
    - U.S. Bank locations by state are led by California with 561 full-service branches. The Union Bank acquisition brought a substantial existing California branch network into the bank.
    - Georgia has one full-service branch, the smallest listed state total. The bank's Atlanta business-banking presence developed outside its traditional retail branch territory.
    - California's total includes 81 branches inside retail premises. Counting only standalone branches would overlook part of the bank's customer-facing network.
  methodology: FDIC's October 2, 2026 location index for U.S. Bank National Association, CERT 6548, retrieved October 3, includes service types 11 and 12 only. ATMs, other office types, DC, and states without qualifying records are excluded.
  sources:
    - name: FDIC U.S. Bank Location Records
      url: https://banks.data.fdic.gov/api/locations?filters=CERT%3A6548&limit=10000&fields=NAME,STNAME,SERVTYPE,OFFNAME,UNINUM,ADDRESS,CITY&format=json
      description: Complete location response for certificate 6548 from the October 2, 2026 index. Records deduplicated by UNINUM and filtered to full-service codes 11 and 12.
    - name: FDIC Summary of Deposits Instructions
      url: https://fdic.gov/bank-financial-reports/2025-sod-instructions.pdf
      description: Definitions of full-service brick-and-mortar and retail offices. Administrative, loan-only, drive-through-only, and home-banking offices are excluded.
    - name: U.S. Bank California Presence
      url: https://www.usbank.com/about-us-bank/news-and-stories/article-library/us-bank-expands-california-presence-with-new-compton-location.html
      description: Official account of the Union Bank acquisition and its contribution to California's branch network.
    - name: U.S. Bank Business Banking Expansion
      url: https://www.usbank.com/about-us-bank/news-and-stories/article-library/us-bank-expands-business-banking-in-florida-georgia-texas-and-arizona.html
      description: Business banking in Atlanta and Texas outside the bank's traditional retail branch territory.
