faq:
  - question: "Which state has the highest average electric bill?"
    answer: "Hawaii has the highest average electric bill at $162.66 a month. Connecticut is second at $161.55, and Alabama is third at $143.95."

  - question: "Which state has the lowest average electric bill?"
    answer: "Utah has the lowest average electric bill at $80.24 a month. New Mexico follows at $86.66, and Colorado is third-lowest at $87.88."

  - question: "Why is electricity so expensive in Hawaii?"
    answer: "Hawaii's rate of 30.28 cents per kWh is the highest of any state, more than double the rate in most of the country. Its usage of 537 kWh a month is actually below average, so the high bill comes from the rate, not consumption."

  - question: "What is the average electric bill in Texas?"
    answer: "Texas averages $132.59 a month, ranking sixth-highest, with usage of 1,132 kWh and a rate of 11.71 cents per kWh."

  - question: "Which state uses the most electricity per month?"
    answer: "Louisiana uses the most electricity at 1,201 kWh a month. Its bill still lands in the middle of the table, at $116.07, because its 9.67 cent rate is the third-lowest of any state."

  - question: "What is the average electric bill in California?"
    answer: "California averages $116.94 a month, 22nd-highest. Its rate of 20.45 cents per kWh is well above average, but usage of 572 kWh keeps the bill from ranking near the top."

