sections:
  - id: "states-with-the-highest-electric-bills"
    icon: "fa-solid fa-bolt"
    title: "States With the Highest Electric Bills"
    paragraphs:
      - "Hawaii posts the highest average electric bill at $162.66 a month, followed by Connecticut at $161.55 and Alabama at $143.95. South Carolina ($138.16) and Arizona ($136.70) round out the top five."
      - "Hawaii's bill comes from rate, not consumption. Its 30.28 cent per kWh rate is the highest in the country, more than double most states, while its usage of 537 kWh a month is the fourth-lowest on the list. Connecticut follows the same pattern at 22.71 cents per kWh against 711 kWh of usage."

  - id: "states-with-the-lowest-electric-bills"
    icon: "fa-solid fa-plug"
    title: "States With the Lowest Electric Bills"
    paragraphs:
      - "Utah has the lowest average electric bill at $80.24 a month, despite above-average usage of 769 kWh. Its 10.44 cent rate, tied for the lowest in the table with North Dakota, keeps the bill down. New Mexico ($86.66) and Colorado ($87.88) are the next lowest."
      - "Idaho and Washington round out the bottom five at $95.04 and $95.72. Both combine sub-10-cent rates (9.95 and 9.87 cents per kWh) with usage above 950 kWh, showing that a low rate can offset high consumption."

  - id: "highest-usage-states"
    icon: "fa-solid fa-house"
    title: "States That Use the Most Electricity Per Month"
    paragraphs:
      - "Louisiana uses the most electricity of any state at 1,201 kWh a month, yet its bill lands at $116.07, 24th overall, because its 9.67 cent rate is the third-lowest in the table. Tennessee (1,168 kWh), Alabama (1,145 kWh), and Mississippi (1,146 kWh) also post usage above 1,100 kWh."
      - "North Dakota (1,085 kWh) and Oklahoma (1,078 kWh) show the same pattern outside the South: high monthly usage paired with rates near or below 10.5 cents per kWh keeps their bills in the middle of the table rather than the top."

