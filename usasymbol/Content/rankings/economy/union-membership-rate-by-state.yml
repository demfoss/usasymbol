page:
  h1: "Union Membership Rate by State"

  quick_answer:
    - "Hawaii has the highest union membership rate of any state at 26.5%, followed by New York at 20.6% and Alaska at 17.7%."
    - "North Carolina has the lowest union membership rate at 2.4%, followed by South Dakota at 2.7% and South Carolina at 2.8%."
    - "The national union membership rate is 9.9%. Twenty states plus Washington, D.C. are above that figure, while thirty states fall below it."

  methodology: "Union membership rate is the share of employed wage and salary workers who were members of a labor union, from the Bureau of Labor Statistics' 2024 annual Union Members report, based on Current Population Survey data. Washington, D.C. is included in the national BLS release but excluded from this ranking of the 50 states."

  sources:
    - name: "U.S. Bureau of Labor Statistics — Union Members Summary (2024)"
      url: "https://www.bls.gov/news.release/union2.nr0.htm"
      description: "Annual national and state-level union membership and representation rates from the Current Population Survey"
    - name: "U.S. Bureau of Labor Statistics — Union Membership Rates Highest in Hawaii and New York, Lowest in North Carolina in 2024"
