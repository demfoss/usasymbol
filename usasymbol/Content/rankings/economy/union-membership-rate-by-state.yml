faq:
  - question: "Which state has the highest union membership rate?"
    answer: "Hawaii has the highest union membership rate at 26.5%. New York is second at 20.6%, and Alaska is third at 17.7%."

  - question: "Which state has the lowest union membership rate?"
    answer: "North Carolina has the lowest union membership rate at 2.4%. South Dakota is second-lowest at 2.7%, and South Carolina is third-lowest at 2.8%."

  - question: "What is the national union membership rate?"
    answer: "The national union membership rate is 9.9%, based on 2024 Bureau of Labor Statistics data. Thirty states fall below that figure."

  - question: "What is the union membership rate in California?"
    answer: "California's union membership rate is 14.5%, tied for 9th-highest with Rhode Island and above the 9.9% national average. California also has more union members in raw numbers, about 2.4 million, than any other state."

  - question: "What is the union membership rate in Texas?"
    answer: "Texas has a union membership rate of 4.5%, ranking 42nd, well below the 9.9% national average."

  - question: "Does Washington D.C. have the highest union membership rate in the country?"
    answer: "No. Washington, D.C.'s union membership rate is 10.6%, just above the national average but well below Hawaii's 26.5%. D.C. is excluded from this ranking of the 50 states."

