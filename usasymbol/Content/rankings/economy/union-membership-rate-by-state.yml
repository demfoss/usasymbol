sections:
  - id: "states-with-the-highest-union-membership"
    icon: "fa-solid fa-people-group"
    title: "States With the Highest Union Membership"
    table:
      columns:
        rank: "Rank"
        state: "State"
        union_pct: "Union Membership Rate (%)"
      rows:
        - rank: 1
          state: "Hawaii"
          state_slug: "hawaii"
          union_pct: 26.5
        - rank: 2
          state: "New York"
          state_slug: "new-york"
          union_pct: 20.6
        - rank: 3
          state: "Alaska"
          state_slug: "alaska"
          union_pct: 17.7
        - rank: 4
          state: "Connecticut"
          state_slug: "connecticut"
          union_pct: 16.5
        - rank: 5
          state: "New Jersey"
          state_slug: "new-jersey"
          union_pct: 16.2
    paragraphs:
      - "Hawaii has the highest union membership rate at 26.5%, more than two and a half times the 9.9% national average. New York is second at 20.6%, and Alaska is third at 17.7%."
      - "Connecticut (16.5%) and New Jersey (16.2%) round out the top five. Hawaii and New York alone account for roughly 29% of the country's 14.3 million union members, despite holding only about 17% of all wage and salary jobs."

  - id: "states-with-the-lowest-union-membership"
    icon: "fa-solid fa-building"
    title: "States With the Lowest Union Membership"
    table:
      columns:
        rank: "Rank"
        state: "State"
        union_pct: "Union Membership Rate (%)"
      rows:
        - rank: 50
          state: "North Carolina"
          state_slug: "north-carolina"
          union_pct: 2.4
        - rank: 49
          state: "South Dakota"
          state_slug: "south-dakota"
          union_pct: 2.7
        - rank: 48
          state: "South Carolina"
          state_slug: "south-carolina"
          union_pct: 2.8
        - rank: 47
          state: "Arkansas"
          state_slug: "arkansas"
          union_pct: 3.5
        - rank: 45
          state: "Arizona"
          state_slug: "arizona"
          union_pct: 3.7
    paragraphs:
      - "North Carolina has the lowest union membership rate at 2.4%, more than 11 times below Hawaii's 26.5%. South Dakota is second-lowest at 2.7%, and South Carolina is third-lowest at 2.8%."
      - "Arkansas (3.5%) and a tie between Arizona and Utah (3.7% each) round out the lowest tier. Every state in the East South Central and West South Central Census divisions, which include North Carolina's Southern neighbors, falls below the 9.9% national average."

  - id: "why-union-membership-varies-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Union Membership Varies So Much by State"
    paragraphs:
      - "Union membership tracks closely with a state's mix of public-sector jobs, its manufacturing and transportation history, and whether it has a right-to-work law, which lets workers opt out of paying union dues even in a unionized workplace. Nationally, public-sector workers were union members at a 32.2% rate in 2024, more than five times the 5.9% private-sector rate, so states with large government workforces, like Hawaii and New York, tend to rank higher."
      - "Twenty-six states, including North Carolina, South Carolina, Arizona, and Texas, have right-to-work laws, and nine of the ten lowest-ranked states on this list are right-to-work states. Every state in the Middle Atlantic (New York, New Jersey, Pennsylvania) and Pacific (California, Oregon, Washington, Alaska, Hawaii) Census divisions sits above the national average."

