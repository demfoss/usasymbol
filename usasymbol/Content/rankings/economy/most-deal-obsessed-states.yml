faq:
  - question: "Which state is the most deal-obsessed?"
    answer: "New Jersey, with 128.6 deal-related searches per 100,000 residents and 119,480 total monthly searches. Delaware is a close second at 127.4."

  - question: "Which state has the most total deal-related searches?"
    answer: "California, with 438,870 monthly searches, the highest raw total of any state. Its per-capita rank still lands at 16th because of its large population."

  - question: "Why does California rank lower despite leading in total searches?"
    answer: "California's large population dilutes its raw search count once the figures are adjusted per 100,000 residents. Texas shows the same pattern, ranking seventh at 117.1 despite the second-highest total volume, 341,340 searches."

  - question: "Which state has the lowest deal-search score?"
    answer: "Mississippi, at 76.0, the lowest disclosed score of any state in the study."

  - question: "How does Nevada rank for deal-related searches?"
    answer: "Nevada ranks 19th nationally at 105.9 searches per 100,000 residents, a total of 32,880 monthly searches."

  - question: "Which state has the fewest total deal-related searches?"
    answer: "Alaska, with 6,650 monthly searches, the lowest raw total of any state. That placed it 41st overall."

