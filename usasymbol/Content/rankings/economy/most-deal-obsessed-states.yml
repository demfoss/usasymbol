sections:
  - id: "states-with-the-highest-deal-search-interest"
    icon: "fa-solid fa-tags"
    title: "States With the Highest Deal-Search Interest"
    paragraphs:
      - "New Jersey leads the country at 128.6 deal-related searches per 100,000 residents, a total of 119,480 monthly searches. Delaware follows closely at 127.4, and New York is third at 127.3 despite generating the largest total volume of the top three, 257,220 searches."
      - "Rhode Island ranks fourth at 119.5 and Connecticut fifth at 119.0. Virginia and Massachusetts tie for ninth and tenth at 114.4 each, rounding out a top 10 that stretches from New Jersey's 128.6 down to just 114.4."
