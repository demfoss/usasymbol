  quick_answer:
    - "New Jersey ranks as the most deal-obsessed state at 128.6 deal-related searches per 100,000 residents, a total of 119,480 monthly searches."
    - "California generates the most total deal-related searches of any state at 438,870, yet ranks just 16th once adjusted for its large population."
    - "Mississippi posts the lowest disclosed score in the study at 76.0, the least deal-obsessed state on record."

  methodology: "VegasInsider analyzed Google Keyword Planner search volume for 442 deal-related keywords covering Black Friday, Cyber Monday, coupons, vouchers, and discounts across all 50 states, adjusted per 100,000 residents, with data current as of November 2024. Only the states and figures the study explicitly disclosed are listed here."

