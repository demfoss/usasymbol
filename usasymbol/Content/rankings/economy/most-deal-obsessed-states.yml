  - id: "why-california-ranks-lower-despite-leading-searches"
    icon: "fa-solid fa-chart-line"
    title: "Why California Ranks Lower Despite Leading Searches"
    paragraphs:
      - "California generates more total deal-related searches than any other state, 438,870 a month. Its per-capita rank still falls to 16th, a result of the state's large population diluting the raw search count once the study adjusted the figures per 100,000 residents."
      - "Texas shows the same effect on a smaller scale. Its 341,340 total searches are the second-highest in the study, yet its adjusted rate of 117.1 per 100,000 lands it at seventh, behind smaller states like Delaware and Rhode Island."

  - id: "states-with-the-lowest-deal-search-interest"
    icon: "fa-solid fa-tag"
    title: "States With the Lowest Deal-Search Interest"
    paragraphs:
      - "Mississippi posts the lowest disclosed score in the study at 76.0, the least deal-obsessed state on record. Alaska recorded the fewest raw searches of any state, 6,650, which placed it 41st overall."
      - "Nevada sits well above both at 105.9 searches per 100,000 residents, a total of 32,880, ranking 19th nationally and putting it inside the top 20 most deal-obsessed states."

