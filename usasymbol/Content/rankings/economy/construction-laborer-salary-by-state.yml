page:
  h1: "Construction Laborer Salary by State"
  quick_answer:
    - "Construction laborer salary by state is highest in Hawaii at $71,520 annually. Public construction schedules set different wage floors for general labor, drilling, and specialized site tasks."
    - "Alabama averages $37,910, the lowest state salary. Unlike Hawaii, it has no state prevailing wage law for public construction."
    - "Texas has 123,250 construction laborer jobs, the largest workforce. Laborers handle excavation, site preparation, scaffolding, and materials throughout a project."
  methodology: "BLS OEWS May 2025 wages and employment for construction laborers, SOC 47-2061, all 50 states, excluding trade-specific helpers, DC and self-employed workers. Annual wages use a full-time year."
