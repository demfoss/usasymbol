sections:
  - id: highest-construction-laborer-salaries
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Construction Laborer Salaries"
    paragraphs:
      - "Hawaii's $71,520 average covers a broader set of tasks than carrying materials. Laborers prepare sites, compact soil, erect temporary structures, and use pavement breakers. Specialized workers may handle tunnel boring equipment or use lasers to position pipes."
      - "Massachusetts ranks second at $70,830, with a $63,390 median. Construction craft labor offers routes into more specialized work through experience and training. The crews covered in [carpenter salaries by state](/rankings/economy/carpenter-salary-by-state) build frameworks, while laborers support site operations throughout construction."
