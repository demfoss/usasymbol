  - id: why-hawaii-construction-laborers-earn-more
    icon: "fa-solid fa-helmet-safety"
    title: "Why Hawaii Construction Laborers Earn More"
    paragraphs:
      - "Hawaii's $34.39 average hourly wage comes in a market where covered public construction requires prevailing pay. The schedule distinguishes general laborers from drillers, blasters, and workers in shafts or tunnels. Prescribed pay for those assignments provides a concrete wage floor, helping explain why site labor can pay more than its entry-level image suggests."
      - "Alabama, lowest at $18.23 an hour, has no state prevailing wage law for public construction. Contractors on state or local projects therefore lack Hawaii's statewide wage schedule, while federally covered construction still carries federal prevailing wage requirements."
  - id: states-with-most-construction-laborer-jobs
    icon: "fa-solid fa-briefcase"
    title: "States With the Most Construction Laborers"
    paragraphs:
      - "Texas has 123,250 construction laborer jobs at a $42,910 average salary. Site preparation, demolition, trenching, and cleanup put laborers to work before and after the skilled trades arrive. Power tools and heavy materials make stamina and coordination practical requirements of the job."
      - "New Mexico has the highest concentration at 14.321 laborers per 1,000 jobs, despite ranking 47th in annual pay. Its 12,470 workers belong to a trade that can involve highway traffic control, underground work, or pipe installation, as well as ordinary building sites."
    table:
      columns: {jobs_rank: "Employment Rank", state: "State", employment: "Employment", employment_per_1000: "Per 1,000 Jobs"}
