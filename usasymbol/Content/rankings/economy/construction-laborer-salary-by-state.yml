faq:
  - question: "What state pays construction laborers the most?"
    answer: "Hawaii leads in mean annual pay and also has the highest median at $77,110. Underground labor classifications recognize demanding work in raises, shafts, and tunnels."
  - question: "How much does a construction laborer make in Texas?"
    answer: "Texas laborers average $20.63 an hour, with median annual pay of $40,620. Construction craft laborers can develop specialized skills in tunneling, pipe placement, or operating demolition tools."
  - question: "How much does a construction laborer make in California?"
    answer: "California averages $64,870 annually and $31.19 hourly. Median annual pay is $60,270, and the state ranks fifth by average salary."
  - question: "How much does a construction laborer make in Florida?"
    answer: "Florida averages $44,550 annually and $21.42 hourly. A laborer may prepare a job site, unload materials, or erect temporary bracing as the project moves between stages."
  - question: "How much does a construction laborer make in New York?"
    answer: "New York averages $62,180 a year, or $29.89 an hour, placing seventh. Median annual pay is $55,930."
  - question: "Which state has the lowest construction laborer salary?"
    answer: "Alabama has the lowest mean salary and a $36,900 median. Construction labor is commonly learned on the job, with specialized duties requiring additional training."
