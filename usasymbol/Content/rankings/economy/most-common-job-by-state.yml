faq:
  - question: "What is the most common job in the United States overall?"
    answer: "Fast food and counter workers make up the largest single occupational group nationally, with over 3.9 million workers according to BLS OEWS data. They are also the most common occupation in 15 individual states — more than any other job category. Home health and personal care aides are a close second nationally, with roughly 3.7 million workers."

  - question: "Which state has the most home health aides?"
    answer: "California has approximately 875,000 home health and personal care aides — more than any other state. New York and Pennsylvania follow with workforces in the hundreds of thousands. Home health aides are the most common occupation in 10 states, driven by an aging Baby Boomer population and the sustained preference for in-home care over nursing facilities."

  - question: "What was the most common job in each state in 1998?"
    answer: "In 1998, retail salespersons were the most common occupation in 39 of the 50 states. By 2024, that number had dropped to just 10. Three forces drove the shift: brick-and-mortar retail shed jobs as e-commerce grew; fast food chains expanded into every corridor where a mall used to anchor; and an aging population created millions of home health positions that didn't exist at scale in 1998."

  - question: "Why are operations managers the top job in Texas and other large states?"
    answer: "General and operations managers is one of the broadest titles in the U.S. classification system — it covers everyone from a franchise operator to a regional warehouse director. Texas has an enormous volume of mid-size and large businesses that all require management layers. Massachusetts and Connecticut have dense concentrations of corporate and professional services. In both cases, the category rises to the top not because managers are unusually well-paid there, but because there are simply more of them than any other type of worker."

  - question: "Is the most common job the same as the best-paying job in each state?"
    answer: "No. The most common job is determined by raw employment numbers, not wages or desirability. Home health aides, for example, earn a median wage of around $16–$18 per hour nationally despite being the most common job in 10 states. The highest-paying occupations in most states — surgeons, chief executives, software engineers — employ far fewer people and rarely appear at the top of employment counts."

  - question: "Why are registered nurses the most common job in West Virginia and South Dakota?"
    answer: "West Virginia has one of the country's oldest and most chronically ill populations, with high rates of conditions linked to economic decline and opioid exposure, which means healthcare employment is unusually high relative to total workforce size. South Dakota has a lean labor market dominated by medical systems in Sioux Falls, with limited competition from fast food chains or large logistics hubs that lead in other states."

  - question: "How does the BLS determine the most common job in each state?"
    answer: "The Bureau of Labor Statistics Occupational Employment and Wage Statistics (OEWS) survey collects employment and wage data from employers across all industries. It publishes estimates for approximately 830 occupations at the national, state, and metro-area level. The most common job is simply the occupation with the highest total employment count in each state. The survey covers nonfarm wage and salary workers and does not include the self-employed or agricultural workers."


