page:
  h1: "The Most Common Job in Every U.S. State (2026 Data)"

  quick_answer:
    - "Fast food and counter workers are the most common job in 15 states — more than any other occupation. No single region dominates: Arkansas, Virginia, and Louisiana share the category with Oregon, Montana, and Washington."
    - "Home health and personal care aides rank first in 10 states including California (875,000+ aides), New York, Pennsylvania, and Minnesota, driven by an aging population and the shift toward in-home elder care."
    - "General and operations managers lead in 10 states — including Texas, Massachusetts, and Connecticut — reflecting the growth of logistics, supply chains, and multi-unit business management. Retail salespersons, once the most common job in 39 states (1998), now top the list in just 10 states."

  methodology: "Most common occupation is defined as the occupation with the highest total employment in each state, based on Bureau of Labor Statistics (BLS) Occupational Employment and Wage Statistics (OEWS) survey data for May 2024. The OEWS survey covers wage and salary workers in nonfarm industries and does not include the self-employed or agricultural workers. Where 2024 state-level data is unavailable, the most recent published estimate is used. Occupational titles follow the Standard Occupational Classification (SOC) system."

  sources:
    - name: "Bureau of Labor Statistics — OEWS State Data"
      url: "https://www.bls.gov/oes/tables.htm"
      description: "Occupational Employment and Wage Statistics by state, May 2024"
