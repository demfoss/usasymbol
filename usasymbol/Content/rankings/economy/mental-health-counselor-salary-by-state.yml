faq:
  - question: "What state pays mental health counselors the most?"
    answer: "Alaska pays the highest mean at $86,500 a year and $41.59 an hour. Its annual median is $80,770."
  - question: "How much does a mental health counselor make in Alaska?"
    answer: "Alaska counselors in this occupation average $86,500 annually, with an $80,770 median. The state employs 1,290."
  - question: "How much does a mental health counselor make in California?"
    answer: "California counselors average $69,080 a year and $33.21 an hour. Its workforce of 75,610 is the nation's largest."
  - question: "How much does a mental health counselor make in Texas?"
    answer: "Texas counselors average $65,180 annually and earn a $62,630 median. The state employs 21,400."
  - question: "What is the lowest mental health counselor salary by state?"
    answer: "Louisiana has the lowest mean at $45,030 a year and $21.65 an hour. Its annual median is $37,910."
  - question: "Which counselors are included in this salary ranking?"
    answer: "The occupation combines substance abuse, behavioral disorder, and mental health counselors under SOC 21-1018, so each state figure covers all three specialties."
