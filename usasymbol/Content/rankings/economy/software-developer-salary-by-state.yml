faq:
  - question: "How much does a software developer make in California?"
    answer: "California software developers earn an average of $186,770 a year, or $89.80 an hour. The median is $174,410, also the highest of any state."

  - question: "What state pays software developers the most?"
    answer: "California, followed by Washington at $171,040 and New York at $163,820. All three are home to the headquarters of some of the largest tech and finance companies in the world."

  - question: "Where do software developers make the most after cost of living?"
    answer: "California still comes out on top at $168,687 after adjusting for prices, with Washington second at $159,831. South Carolina and North Carolina move into the top ten once living costs are counted."

  - question: "How much does a software developer make in Texas?"
    answer: "Texas software developers earn an average of $136,450 a year, 17th among the states. Texas has 163,880 developer jobs, second only to California."

  - question: "How much does a software developer make in New York?"
    answer: "New York pays an average of $163,820 a year, third highest. Its median of $166,180 is actually higher than the average, so typical developers there earn more than the mean suggests."

  - question: "What state pays software developers the least?"
    answer: "Mississippi, at $99,840 a year. South Dakota is next at $104,790."

  - question: "How much does a software developer make in Florida?"
    answer: "Florida software developers average $137,010 a year, 14th among the states, across 87,890 jobs. Florida also has no state income tax on wages."

  - question: "What is the software developer salary in Alaska?"
    answer: "No wage figure was published for Alaska, so the state is left out of the ranking. About 530 software developers work there."

