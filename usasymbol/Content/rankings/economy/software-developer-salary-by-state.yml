  - id: "lowest-paying-states-for-software-developers"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Lowest Paying States for Software Developers"
    paragraphs:
      - "Mississippi pays software developers the least, an average of $99,840 a year ($48.00 an hour). Only 1,880 developers work in the state, and without a big tech employer competing for them, salaries stay lower. Rent and groceries there also cost less than almost anywhere else in the country."
      - "South Dakota ($104,790) and North Dakota ($107,000) come next. Both states have small software workforces of 2,380 and 1,450 jobs. Alaska has about 530 developers, but no wage figures were published for the state."
