  description: "Software developers earn the most in California at $186,770 a year and the least in Mississippi at $99,840. Washington ranks second at $171,040."

page:
  h1: "Software Developer Salary by State 2026"

  quick_answer:
    - "Software developer salary by state is highest in California at $186,770 a year on average, a result of the Silicon Valley tech giants that compete for the same engineers."
    - "Mississippi pays software developers the least at $99,840 a year. Only 1,880 developers work there, and no large tech employer pushes wages up."
    - "Texas has the second most software developer jobs at 163,880, yet its $136,450 average ranks only 17th. Austin and Dallas hire in huge numbers but pay less than the coastal hubs."

  methodology: "BLS Occupational Employment and Wage Statistics, May 2025 estimates, for Software Developers (SOC 15-1252). Adjusted wage is the mean divided by BEA 2024 Regional Price Parities. Alaska wages were not published. DC is excluded."

  sources:
