  - id: "states-with-the-most-software-developer-jobs"
    icon: "fa-solid fa-laptop-code"
    title: "States With the Most Software Developer Jobs"
    paragraphs:
      - "California employs 284,390 software developers, more than Texas (163,880) and New York (113,510) combined. Texas holds second place thanks to Austin's tech corridor, known as Silicon Hills, along with large corporate offices in Dallas and Houston."
      - "Virginia ranks fifth with 88,280 jobs, and most of them sit in Northern Virginia. Defense contractors, federal agencies, and Amazon's second headquarters in Arlington all hire developers just across the river from Washington, D.C."
