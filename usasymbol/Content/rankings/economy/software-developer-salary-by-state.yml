  - id: "software-developer-salary-adjusted-for-cost-of-living"
    icon: "fa-solid fa-scale-balanced"
    title: "Software Developer Salary Adjusted for Cost of Living"
    paragraphs:
      - "South Carolina makes the biggest jump once prices are counted. Its $136,240 average ranks 18th, but adjusted for living costs it reaches $145,324, sixth in the country. Charleston, nicknamed Silicon Harbor for its tech startups, sits in a state where housing costs far less than on either coast."
      - "North Carolina climbs from 15th to 7th at $145,177, helped by the Research Triangle around Raleigh, Durham, and Chapel Hill. California keeps first place even after its high [cost of living](/rankings/economy/states-by-cost-of-living) is factored in, at $168,687."
