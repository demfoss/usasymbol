faq:
  - question: "What state pays dental hygienists the most?"
    answer: "Washington has the highest average at $63.24 an hour. Its $131,160 annual median is close to the mean, so the middle employee's pay is not far below the headline average."
  - question: "How much does a dental hygienist make in California?"
    answer: "California dental hygienists average $128,110 a year and $61.59 an hour, with a $124,930 median. California also has the largest employed workforce, giving its high wage a much larger job market than Alaska's."
  - question: "How much does a dental hygienist make in Texas?"
    answer: "Texas averages $96,240 a year, or $46.27 an hour. The $99,240 median exceeds the average, showing why both measures are useful when evaluating a specific job offer."
  - question: "How much does a dental hygienist make in Florida?"
    answer: "Florida dental hygienists average $88,320 a year and $42.46 an hour. Prices above the national level lower that annual rate to $85,404 in adjusted purchasing power."
  - question: "Where do dental hygienists earn the most after cost of living?"
    answer: "Washington remains first at $122,910 in adjusted annual pay. Oregon overtakes California after adjustment because its lower price level stretches each dollar further."
  - question: "Why is Kansas missing from dental hygienist salary rankings?"
    answer: "Kansas has no published wage or employment estimate in the reference-period state series. Its cells are left empty rather than filled with zero, and it receives no wage rank."
  - question: "Is dental hygienist annual salary based on full-time work?"
    answer: "Washington's $131,530 figure is an annual wage rate, not a promise of actual yearly earnings for every employee. Many hygienists work part time or split their schedules between dentists, so the hourly rate and available hours belong together in a job comparison."
