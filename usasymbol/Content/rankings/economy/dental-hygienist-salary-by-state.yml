seo:
  title: "Dental Hygienist Salary by State | Map & Pay"
  description: "Dental hygienists average $131,530 a year in Washington and $60,850 in Alabama. Annual and hourly wages are available for every state except Kansas."
page:
  h1: "Dental Hygienist Salary by State"
  quick_answer:
    - "Dental hygienist salary by state is highest in Washington at $131,530 a year, or $63.24 an hour. Its wages compensate for higher local prices and still lead after adjustment."
    - "Alabama averages $60,850, the lowest published state wage. Lower prices soften the difference, but its adjusted salary of $68,507 remains last. Kansas has no published estimate and receives no wage rank."
    - "Alaska's $132,690 median exceeds Washington's $131,160 even though Alaska ranks third for average pay. The median follows the middle employee, while the mean responds to workers at both ends of the wage range."
  methodology: "BLS OEWS May 2025 employee wages and employment for dental hygienists, SOC 29-1292. Adjusted pay uses BEA 2024 all-items Regional Price Parities. Kansas estimates are unpublished. Self-employed workers and DC are excluded."
  sources:
    - name: "BLS OEWS May 2025 state occupational wage and employment series"
      url: "https://download.bls.gov/pub/time.series/oe/"
      description: "Mean and median annual pay, mean hourly pay, employment, and jobs per 1,000 for SOC 29-1292"
    - name: "BEA Regional Price Parities by State"
      url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area"
      description: "2024 all-items state price levels for the purchasing-power adjustment"
