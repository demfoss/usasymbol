      - "Mississippi's $68,630 average becomes $78,928 after adjustment, still near the bottom. Dental hygienists commonly work part time in dental offices, making hours as important as the wage rate. A high annualized salary does not promise a full schedule, and a part-time worker's actual annual income can be substantially lower."
