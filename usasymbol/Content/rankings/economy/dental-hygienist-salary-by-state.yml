    icon: "fa-solid fa-tooth"
    title: "Highest Dental Hygienist Salaries"
    paragraphs:
      - "Washington leads at $131,530, with a median of $131,160. Higher local prices provide part of the explanation for higher dollar wages, since dental practices must recruit staff who can afford to live nearby. Washington's lead survives the price adjustment, so purchasing power remains high rather than merely matching expensive living costs."
      - "Alaska ranks third for average pay at $122,560 but has a median of $132,690. California's average is higher at $128,110, while its median is lower at $124,930. A reader seeking the wage of a typical employee should therefore inspect the median alongside the average."
