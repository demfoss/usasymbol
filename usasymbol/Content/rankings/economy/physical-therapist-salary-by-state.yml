    title: "Physical Therapist Pay After Living Costs"
    paragraphs:
      - "Mississippi makes the largest move, from 42nd in gross salary to seventh in buying power. Its $96,850 average becomes $111,382 at national prices because the adjustment accounts for housing and other household purchases. A lower advertised paycheck can therefore support a stronger budget than the salary ranking suggests."
      - "Nevada leads after prices at $120,725, followed by New Mexico at $119,355. Nevada's price level is almost equal to the national benchmark, preserving nearly all of its gross wage, while New Mexico gains buying power from lower prices. A broader [cost-of-living comparison](/rankings/economy/states-by-cost-of-living) adds context, though a statewide index does not predict one household's expenses."
