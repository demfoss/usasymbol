      - "North Dakota trails at $92,480, with median pay of $85,330. Lower household prices help explain part of its lower gross wage, lifting comparable buying power to $103,958. The remaining difference cannot be diagnosed from state averages, since physical therapists in home healthcare, residential care, hospitals, and outpatient offices face different pay markets."
      - "South Dakota averages $93,200, close to North Dakota, but has a median of $92,660. Its mean and median describe a more similar central pay level, whereas North Dakota's larger gap suggests that the average is a less representative guide to the middle job. A state average is therefore a starting point for comparing an offer, not a promised salary for every specialty."
