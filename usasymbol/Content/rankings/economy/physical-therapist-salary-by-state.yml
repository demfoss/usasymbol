seo:
  title: "Physical Therapist Salary by State | Map & Rankings"
  description: "Physical therapists average $122,580 a year in California and $92,480 in North Dakota. Nevada leads after living costs."
page:
  h1: "Physical Therapist Salary by State"
  quick_answer:
    - "Physical therapist salary by state is highest in California at $122,580 a year. Higher local prices help explain its wage premium, but reduce that salary to $110,712 in comparable purchasing power."
    - "North Dakota averages $92,480, the lowest physical therapist wage. Lower household prices soften the gap, although its price-adjusted pay of $103,958 remains below many states."
    - "Mississippi moves from 42nd in gross pay to seventh after living costs. Its $96,850 salary buys the equivalent of $111,382 at national prices, the largest change in position."
  methodology: "BLS OEWS May 2025 physical therapist wages and employment, SOC 29-1123, all 50 states. Adjusted pay divides mean annual wage by BEA 2024 all-items RPP and multiplies by 100. DC, self-employed workers, assistants, and aides are excluded."
  sources:
    - name: "BLS OEWS May 2025 state time-series estimates"
      url: "https://downloadt.bls.gov/pub/time.series/oe/"
      description: "Physical therapist wages, employment, and employment per 1,000 jobs"
    - name: "BEA Regional Price Parities by State"
      url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area"
      description: "2024 all-items state price indexes used to calculate adjusted annual wages"
    - name: "BLS Occupational Outlook Handbook, physical therapists"
      url: "https://www.bls.gov/ooh/healthcare/physical-therapists.htm"
      description: "Workplaces, patient care, and wage differences between employer types"
    - name: "BLS geographic wage comparisons"
      url: "https://www.bls.gov/oes/earnings.htm"
      description: "How local prices, industry mix, and working conditions affect wages"
    - name: "BLS OEWS concepts"
      url: "https://www.bls.gov/opub/hom/oews/concepts.htm"
      description: "Employee wage definitions and exclusions"
