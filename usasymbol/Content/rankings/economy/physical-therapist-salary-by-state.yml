faq:
  - question: "What state pays physical therapists the most?"
    answer: "California has the highest mean hourly wage at $58.93 and median annual pay of $124,190. Median pay exceeds the mean, so a few unusually high salaries alone do not explain its position."
  - question: "Where do physical therapists make the most after cost of living?"
    answer: "Nevada leads at $120,725 in price-adjusted annual pay. That amount expresses purchasing power at national prices and is not an employer's advertised salary or an estimate of take-home pay."
  - question: "How much does a physical therapist make in Texas?"
    answer: "Texas physical therapists average $109,270 a year, or $52.53 an hour, ranking seventh. Median pay is $105,810, a useful additional benchmark when comparing a particular clinic or hospital offer."
  - question: "How much does a physical therapist make in California?"
    answer: "California's mean is $122,580 a year, while its median is $124,190. The figures describe employed physical therapists and exclude self-employed practice owners, whose earnings depend on both revenue and expenses."
  - question: "How much does a physical therapist make in Florida?"
    answer: "Florida physical therapists average $98,510 a year and $47.36 an hour, placing 33rd. Median pay is higher at $101,040, illustrating why the average and the middle worker's wage are different measures."
  - question: "How much does a physical therapist make in New York?"
    answer: "New York averages $102,740 annually and $49.39 hourly, ranking 18th. Higher local prices reduce that wage to $95,199 in comparable buying power, so housing expenses deserve attention alongside the offer."
  - question: "Which state pays physical therapists the least?"
    answer: "North Dakota has the lowest mean hourly pay at $44.46. Physical therapist assistants and aides are separate occupations, so the listed wage should not be applied to those supporting roles."
