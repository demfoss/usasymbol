sections:
  - id: "highest-physical-therapist-salaries"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Physical Therapist Salaries"
    paragraphs:
      - "California leads at $122,580, with median pay of $124,190. High local prices help explain why employers must offer higher wages to recruit in expensive markets, a mechanism visible in the drop to tenth after price adjustment. Employer mix matters too, but these totals cannot establish how much of California's lead comes from hospitals, home care, or outpatient clinics."
      - "Nevada ranks second at $120,700, while its median of $111,250 is farther below the average than California's. A smaller group of higher-paid positions can lift a mean without producing the same pay for the middle worker. Comparing [registered nurse salaries](/rankings/economy/nurse-salary-by-state) provides another view of healthcare pay, but the occupations have different roles and employer mixes."
