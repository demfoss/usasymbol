sections:
  - id: "highest-minimum-wage"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Why Washington Has the Highest Minimum Wage"
    paragraphs:
      - "Washington pays $17.13 an hour because its minimum wage rises with inflation every January. Voters wrote that rule into law in 1998, and a 2016 ballot measure pushed the base higher before indexing took over again."
      - "Connecticut ($16.94) and California ($16.90) follow, both adjusted each year by formula. Washington also bans the tip credit, so servers there earn the full $17.13 before tips, the highest [tipped minimum wage](/rankings/economy/tipped-minimum-wage-by-state) in the country."
    table:
      columns:
        state: "State"
        wage: "Minimum Wage"
      rows:
        - state: "Washington"
          wage: "$17.13"
        - state: "Connecticut"
          wage: "$16.94"
        - state: "California"
          wage: "$16.90"
        - state: "Hawaii"
          wage: "$16.00"
        - state: "New York"
          wage: "$16.00"
        - state: "Rhode Island"
          wage: "$16.00"
        - state: "New Jersey"
          wage: "$15.92"
        - state: "Oregon"
          wage: "$15.55"
        - state: "Colorado"
          wage: "$15.16"
        - state: "Arizona"
          wage: "$15.15"

  - id: "states-still-at-the-federal-minimum-wage"
    icon: "fa-solid fa-landmark"
    title: "States Still at the Federal Minimum Wage"
    paragraphs:
      - "Twenty states pay $7.25, the federal floor. Alabama, Louisiana, Mississippi, South Carolina, and Tennessee have no minimum wage law of their own, and Georgia and Wyoming set a state rate of $5.15 that the federal law overrides for most jobs."
      - "Texas and Pennsylvania are the most populous states still at $7.25. Most of these states sit in the South and the Plains, where living costs run lower and lawmakers have left wages to the federal standard."

  - id: "recent-minimum-wage-increases-by-state"
    icon: "fa-solid fa-calendar-check"
    title: "Recent Minimum Wage Increases by State"
    paragraphs:
      - "Missouri and Nebraska reached $15.00 on January 1, 2026, completing raises voters approved at the ballot box. Hawaii moved to $16.00 the same day, on a path to $18.00 in 2028."
      - "Michigan rose to $13.73 in February, Alaska to $14.00 and Oregon to $15.55 in July, and Florida to $15.00 on September 30. Virginia stayed at $12.77 after lawmakers' plans to reach $15.00 were vetoed in 2024 and 2025."

  - id: "federal-vs-state"
    icon: "fa-solid fa-scale-balanced"
    title: "Federal vs State Minimum Wage"
    paragraphs:
      - "When state and federal rates differ, employers must pay the higher one. The federal $7.25 has not changed since July 24, 2009, the longest stretch without a raise since the national minimum began in 1938."
      - "Cities can go further where state law allows it. Seattle, Denver, and San Francisco all set minimums above their state rates, while Texas and Tennessee bar cities from doing so. Rent decides how far a paycheck goes, which a [living wage by state](/rankings/economy/single-person-living-wage) comparison shows."

