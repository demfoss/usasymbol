  description: "Washington has the highest minimum wage at $17.13 an hour. Twenty states still pay the federal $7.25, unchanged since 2009."

page:
  h1: "Minimum Wage by State 2026"

  quick_answer:
    - "Minimum wage by state is highest in Washington at $17.13 an hour. Washington adjusts its minimum for inflation every January, a rule voters adopted in 1998."
    - "Twenty states still pay the federal $7.25, the same rate since July 24, 2009. Five of them, including Alabama and Mississippi, have no state minimum wage law at all."
    - "Florida became the 18th state at $15.00 or more on September 30, 2026, finishing a schedule voters approved in 2020."

  methodology: "Statewide rates from the U.S. Department of Labor as of July 1, 2026, updated for Florida's September 30, 2026 increase. Tipped Cash Wage is the least paid before tips. City and county rates can be higher."

