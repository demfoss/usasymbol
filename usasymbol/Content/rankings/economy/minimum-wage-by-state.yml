faq:
  - question: "What is the federal minimum wage in 2026?"
    answer: "$7.25 an hour, the same since July 24, 2009. Thirty states set a higher rate, and employers must pay whichever is higher."

  - question: "Which state has the highest minimum wage in 2026?"
    answer: "Washington, at $17.13 an hour. Connecticut is second at $16.94 and California third at $16.90."

  - question: "Which states still use the $7.25 minimum wage?"
    answer: "Twenty states, including Texas, Pennsylvania, Georgia, and North Carolina. Alabama, Louisiana, Mississippi, South Carolina, and Tennessee have no state minimum wage law."

  - question: "What is the minimum wage in Florida?"
    answer: "$15.00 an hour since September 30, 2026. Tipped workers in Florida earn at least $11.98 in cash before tips."

  - question: "What is the minimum wage in New York?"
    answer: "$16.00 an hour in most of the state and $17.00 in New York City, Long Island, and Westchester."

  - question: "What is the minimum wage in Virginia?"
    answer: "$12.77 an hour in 2026. Virginia adjusts the rate for inflation each January, and tipped workers can be paid $2.13 in cash."

  - question: "Can a city have a higher minimum wage than its state?"
    answer: "Yes, where state law allows it. Seattle, Denver, and San Francisco set higher local minimums, while states such as Texas and Tennessee forbid it. [Right-to-work states](/rankings/law/right-to-work-states) are another place where state law shapes pay."

