page:
  h1: "Millionaires Per Capita by State"

  quick_answer:
    - "Connecticut has the highest share of million-dollar earners of any state, 0.90% of its tax returns reporting $1 million or more in adjusted gross income for tax year 2022."
    - "Wyoming ranks seventh at 0.63%, on just 1,760 returns of $1 million or more. California files the most such returns of any state, 128,900, yet its 0.70% share ranks only fifth."
    - "West Virginia has the lowest share of any state at 0.16%, less than a fifth of Connecticut's rate. Mississippi and New Mexico tie for second-lowest at 0.21%."

  methodology: "Figures use the IRS Statistics of Income Historic Table 2 for tax year 2022, the share of individual returns reporting adjusted gross income of $1 million or more. DC and Puerto Rico are excluded from state ranks."

