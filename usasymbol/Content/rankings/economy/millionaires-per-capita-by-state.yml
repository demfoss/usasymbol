faq:
  - question: "Which state has the highest share of millionaires per capita?"
    answer: "Connecticut has the highest share of any state, 0.90% of its tax returns reporting $1 million or more in adjusted gross income for tax year 2022."

  - question: "Which state has the lowest share of millionaires per capita?"
    answer: "West Virginia has the lowest share of any state at 0.16%. Mississippi and New Mexico are next lowest, tied at 0.21%."

  - question: "Which state has the most million-dollar earners overall?"
    answer: "California files the most returns of $1 million or more, 128,900, more than any other state. Its 0.70% share still ranks only fifth, behind smaller states like Connecticut and Wyoming."

  - question: "Does Wyoming have a lot of millionaires?"
    answer: "Wyoming's 0.63% share ranks seventh-highest in the country, even though its 1,760 returns of $1 million or more are among the smallest totals of any state."

  - question: "How is millionaires per capita measured here?"
    answer: "This ranking uses the share of individual tax returns reporting $1 million or more in adjusted gross income for tax year 2022, not household net worth."

  - question: "Where does Texas rank for millionaires per capita?"
    answer: "Texas ties with Nevada and Colorado at 0.54%, tenth-highest in the country, despite filing 73,930 returns of $1 million or more, the third-most of any state."

