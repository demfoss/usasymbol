faq:
  - question: How much does a pharmacy technician make in Washington?
    answer: "Washington's average is $61,140 a year and $29.39 an hour. Technicians also maintain proper storage and security conditions for the medicines kept in stock."
  - question: What is the pharmacy technician salary in California?
    answer: "California averages $58,330 a year, with a median of $55,110. Prescription labels must be checked carefully for the correct patient and directions before the medicine reaches the counter."
  - question: How much does a pharmacy technician make in Texas?
    answer: "Texas averages $45,670 annually and $21.96 hourly. Pharmacies can operate outside ordinary business hours, so a technician's schedule may include nights or weekends."
  - question: What is the pharmacy technician salary in New York?
    answer: "New York's mean is $46,800 a year and its median is $43,930. Maintaining computerized patient and prescription records is part of the work, alongside filling orders."
  - question: How much does a pharmacy technician make in Oregon?
    answer: "Oregon averages $55,180 annually and $26.53 hourly. Technicians also collect the patient information needed to fill prescriptions and route questions about medicines to the pharmacist."
