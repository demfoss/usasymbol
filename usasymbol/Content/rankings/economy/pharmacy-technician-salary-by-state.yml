    title: Why Pharmacy Technician Pay Varies
    paragraphs:
      - "Washington's $61,140 average comes with housing rents and overall consumer prices above the national level. Employers compete in that more expensive local labor market, where a worker must cover a larger housing bill."
      - "West Virginia's $40,250 average sits at the other end of the table, in the state with the lowest housing-rent price level. Lower rents reduce a major cost that local wages need to cover. [Cost of living](/rankings/economy/states-by-cost-of-living) gives the household context for its smaller paycheck."
