  title: Pharmacy Technician Salary by State | Map & Pay
  description: Pharmacy technicians average $61,140 a year in Washington and $40,250 in West Virginia. Texas has the largest pharmacy technician workforce.
page:
  h1: Pharmacy Technician Salary by State
  quick_answer:
    - "Pharmacy technician salary by state is highest in Washington at $61,140 a year. Above-average housing costs contribute to the higher wage environment for workers behind its pharmacy counters."
    - "West Virginia averages $40,250, the lowest state wage. Its housing rents are also the lowest among states, reducing a major household expense in the local labor market."
    - "Texas employs 41,740 pharmacy technicians. Their workplaces include drugstores and hospitals, where technicians can prepare intravenous medications as well as ordinary prescriptions."
  methodology: "BLS OEWS May 2025 pharmacy technicians, SOC 29-2052, ranked by mean annual wage for 50 states excluding DC and territories. Annual wages are full-time equivalents, with price context from BEA RPP 2024."
