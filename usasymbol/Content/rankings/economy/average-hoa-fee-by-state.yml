faq:
  - question: "What is the average HOA fee by state?"
    answer: "Average HOA fees range from $739 a month in New York down to $47 a month in Arkansas. The national median is $135 a month, according to Census Bureau data."

  - question: "Which state has the highest HOA fee?"
    answer: "New York has the highest average HOA fee at $739 a month, or about $8,868 a year. Hawaii is second at $470 a month."

  - question: "Which state has the lowest HOA fee?"
    answer: "Arkansas has the lowest average HOA fee at $47 a month. West Virginia and Oklahoma are next, both at $48."

  - question: "What is the average HOA fee in Florida?"
    answer: "Florida's average HOA fee is $230 a month, or about $2,760 a year. Florida also has the third-highest share of homes in an HOA at 44.3%."

  - question: "What is the average HOA fee in California?"
    answer: "California's average HOA fee is $278 a month, or about $3,336 a year, the eighth-highest average in the country."

  - question: "Why is New York's average HOA fee so much higher than other states?"
    answer: "New York's fee is driven largely by older, densely built condo and co-op buildings in and around New York City, where building maintenance, staffing, and insurance costs are far higher than in typical suburban HOAs elsewhere. Only 14.3% of owned homes in the state pay an HOA fee at all, so the high average reflects a smaller, mostly urban pool of payers."

  - question: "Is a high HOA fee the same as a high HOA prevalence?"
    answer: "No. New York has the highest average fee but one of the lowest shares of homes in an HOA, 14.3%. Nevada has the highest prevalence, 51.3% of homes, but only a $95 average fee. The two measures track different things: how many homes pay an HOA fee, and how much that fee costs."

