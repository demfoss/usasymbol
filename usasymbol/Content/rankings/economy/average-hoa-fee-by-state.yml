seo:
  title: "Average HOA Fee by State | Map, Costs & Facts"
  description: "New York has the highest average HOA fee at $739 a month, or $8,868 a year. Arkansas is lowest at $47 a month. See the full state-by-state breakdown."

page:
  h1: "Average HOA Fee by State"

  quick_answer:
    - "New York has the highest average HOA fee of any state at $739 a month, or about $8,868 a year, more than 15 times Arkansas's rate."
    - "Arkansas has the lowest average HOA fee at $47 a month. West Virginia and Oklahoma are next, both at $48."
    - "Only 14.3% of owned homes in New York pay an HOA fee at all, the lowest prevalence of any top-10 state by cost. Nevada, by contrast, has the highest share of homes in an HOA, 51.3%, but a modest average fee of $95."

  methodology: "Figures are the median monthly condo or homeowners association fee paid by owner-occupied households, using U.S. Census Bureau American Community Survey 2024 table B25143. The Census Bureau reports this figure as a median rather than a mean because a small share of very high fees, common in dense condo buildings, would otherwise skew a straight average; median is the standard way this statistic is reported by the Census Bureau and most industry outlets. Annual figures are the monthly median multiplied by 12. All 50 states are shown; the District of Columbia is excluded."

  sources:
    - name: "U.S. Census Bureau. Nearly a Quarter of Homeowners Paid Condo or HOA Fees in 2024"
      url: "https://www.census.gov/library/stories/2025/09/condo-hoa-fees.html"
      description: "America Counts story summarizing 2024 ACS data on households paying condo or HOA fees, including state median fee figures"
    - name: "U.S. Census Bureau. Table 1. Share of U.S. Owned Households That Paid Condo/Homeowners Association Fee. 2024"
      url: "https://www.census.gov/content/dam/Census/library/stories/2025/09/condo-hoa-fees/table-1-condo-hoa-fees.jpg"
      description: "State-by-state table with percent of households paying condo or HOA fees and median monthly fee"

