  quick_answer:
    - "Medical lab technician salary by state is highest in New York at $93,610 a year. Its 16,460 jobs form the second-largest state laboratory workforce."
    - "Alabama has the lowest mean at $53,500 and a $49,440 median. Laboratory workers there test blood, tissue, and other specimens used in diagnosis and treatment."
