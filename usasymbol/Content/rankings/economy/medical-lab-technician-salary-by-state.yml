faq:
  - question: "What state pays medical lab technicians the most?"
    answer: "New York pays the highest mean at $93,610 a year and $45.00 an hour. Its annual median is even higher at $97,280."
  - question: "How much does a medical lab technician make in California?"
    answer: "California medical laboratory technologists and technicians average $78,840 annually, with a $76,010 median. The state employs 29,210."
  - question: "How much does a medical lab technician make in Texas?"
    answer: "Texas laboratory technologists and technicians average $61,730 a year and $29.68 an hour. Its 29,530 jobs are the most of any state."
  - question: "How much does a medical lab technician make in Florida?"
    answer: "Florida medical lab workers average $63,650 annually and earn a median of $60,510. The state employs 25,790, third nationally."
  - question: "What is the lowest medical lab technician salary by state?"
    answer: "Alabama has the lowest mean at $53,500 a year. Its $49,440 median marks the midpoint for 7,250 workers in the combined occupation."
  - question: "Are medical lab technicians and technologists combined?"
    answer: "Yes. The federal occupation used here combines clinical laboratory technologists and technicians under SOC 29-2010, so every state figure covers both titles."
