faq:
  - question: "What state pays nursing assistants the most?"
    answer: "Washington has the highest mean hourly wage at $25.11. Its $49,180 median annual wage falls below the mean, so a worker comparing offers should consider the midpoint as well as the average."
  - question: "How much does a nursing assistant make in California?"
    answer: "California averages $50,190 a year and $24.13 an hour. Its $47,630 median is lower than the mean, and high state prices reduce the average to $45,331 in adjusted purchasing power."
  - question: "How much does a nursing assistant make in Texas?"
    answer: "Texas nursing assistants average $38,780 a year and $18.65 an hour. Their daily work includes helping patients eat, bathe, and move, keeping the occupation closely tied to bedside care."
  - question: "How much does a nursing assistant make in Florida?"
    answer: "Florida averages $39,160 annually and $18.83 an hour. Its 96,960 positions form the second-largest employment market, with hospitals and nursing facilities requiring staff for daily personal care."
  - question: "How much does a nursing assistant make in New York?"
    answer: "New York averages $48,800 a year, with a $48,590 median. Those figures are close, while higher prices pull the state from sixth in dollars to 17th in purchasing power."
  - question: "Where do nursing assistants earn the most after cost of living?"
    answer: "Oregon is first at $50,464 in adjusted pay. Maine follows at $48,954, where lower prices give a smaller dollar wage more purchasing power than Washington's larger paycheck."
  - question: "Does CNA salary include registered nurses or orderlies?"
    answer: "California's $50,190 nursing assistant average excludes registered nurses and orderlies. Nursing assistants provide daily personal care, while orderlies mainly transport patients and clean treatment areas."
