  - id: lowest-nursing-assistant-pay
    icon: "fa-solid fa-house-medical"
    title: "Lowest Paying States for Nursing Assistants"
    paragraphs:
      - "Louisiana averages $32,250 in a lower-price labor market, where local purchasing costs reduce the dollar wage needed to match a given standard of living. That provides one explanation for low nominal pay. Its last-place adjusted wage also shows that inexpensive living cannot explain the entire gap."
      - "Louisiana employs 20,690 nursing assistants, with 10.691 positions per 1,000 jobs. Hospitals and nursing facilities need hands-on help with eating, bathing, and moving patients, putting this work at the center of daily bedside care."
