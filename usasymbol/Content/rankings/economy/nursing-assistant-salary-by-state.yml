seo:
  title: "Nursing Assistant Salary by State | Map & Pay"
  description: "Nursing assistants average $52,230 a year in Washington and $32,250 in Louisiana. Oregon leads after adjustment for state prices."
page:
  h1: "Nursing Assistant Salary by State"
  quick_answer:
    - "Nursing assistant salary by state is highest in Washington at $52,230 a year. Its higher-price labor market helps explain the dollar premium, but Oregon leads after living costs are counted."
    - "Louisiana has the lowest nursing assistant average at $32,250. Lower state prices increase its purchasing-power equivalent to $36,562, although that remains last among all 50 states."
    - "California has the most nursing assistant jobs at 110,060. Rhode Island has the highest concentration, showing how a much smaller employment market can devote a larger share of its workforce to bedside care."
  methodology: "BLS OEWS May 2025 nursing assistant wages, SOC 31-1131, cover all 50 states and exclude orderlies, DC, and self-employment. Adjusted annual pay divides mean wages by BEA 2024 all-items RPP relative to national prices."
