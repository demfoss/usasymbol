map:
  title: "Nursing Assistant Salary by State Map"
  image_alt: "United States map of nursing assistant pay, highest in Washington and lowest in Louisiana"
  caption: "Washington averages $52,230 for nursing assistants, followed by Oregon at $52,160. Louisiana has the lowest average at $32,250."
  metric_key: mean_annual
  metric_label: "Average annual nursing assistant salary"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-nursing-assistant-pay
    icon: "fa-solid fa-bed-pulse"
    title: "Highest Paying States for Nursing Assistants"
    paragraphs:
      - "Washington leads at $52,230 in a state where everyday prices exceed the national level. Employers compete for workers who must pay those local bills, helping explain higher nominal pay. Its adjusted wage ranks third, so a high dollar average does not automatically produce the strongest purchasing power."
      - "Oregon follows at $52,160, with a $49,830 median that exceeds Washington's $49,180 midpoint. Mean and median answer different questions, and the state with the highest average need not pay the middle worker most. Nursing assistants provide hands-on help with bathing, eating, and moving patients, distinct from the work covered by [registered nurse salaries](/rankings/economy/nurse-salary-by-state)."
    table:
      columns:
        rank: "Rank"
        state: "State"
        mean_annual: "Avg. Annual Salary"
        mean_hourly: "Avg. Hourly Wage"
      rows:
