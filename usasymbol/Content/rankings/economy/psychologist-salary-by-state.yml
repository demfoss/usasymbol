faq:
  - question: "What state pays clinical psychologists the most?"
    answer: "Washington has the highest reported average hourly pay at $66.12 for clinical and counseling employees. Psychologists in this occupation assess mental and behavioral problems and provide counseling or treatment."
  - question: "How much does a psychologist make in California?"
    answer: "California clinical and counseling employees average $123,570 a year and $59.41 an hour. The $116,000 median supplies a lower midpoint, which can be useful when comparing a particular offer."
  - question: "How much does a psychologist make in Texas?"
    answer: "Texas averages $92,130 annually and $44.29 an hour for clinical and counseling employees. Higher-paid positions pull the arithmetic average above the $83,660 midpoint of the wage distribution."
  - question: "How much does a psychologist make in Florida?"
    answer: "Florida averages $118,480 a year, with an $85,610 median. The sizable separation shows why the average alone is a poor description of the middle employee's pay."
  - question: "How much does a psychologist make in New York?"
    answer: "New York clinical and counseling employees average $124,380 a year and $59.80 an hour. Higher prices reduce that wage to $115,251 in adjusted purchasing power, putting New York 14th after adjustment."
  - question: "Where do psychologists earn the most after cost of living?"
    answer: "New Mexico leads at $132,662 in adjusted clinical and counseling employee pay, followed by Wisconsin at $129,061. Below-average household prices lift New Mexico from eighth in dollar wages to first in purchasing power."
  - question: "Does psychologist salary include school psychologists?"
    answer: "California's $123,570 average covers clinical and counseling psychologists, with school psychologists in a separate occupation. Clinical and counseling work centers on assessment and treatment, while school psychologists address learning and behavioral needs in educational settings."
