map:
  title: "Psychologist Salary by State Map"
  image_alt: "Clinical and counseling psychologist employee salary map with Washington highest and Louisiana lowest among reported states"
  caption: "Washington averages $137,530 for clinical and counseling psychologist employees. Louisiana averages $79,510, while Connecticut, Maine, and Maryland lack wage estimates."
  metric_key: mean_annual
  metric_label: "Average annual clinical and counseling psychologist pay"
  name_key: state
  color_scheme: green
  color_scale: linear
  detail_keys: [median_annual, mean_hourly]
sections:
  - id: highest-psychologist-salaries
    icon: "fa-solid fa-brain"
    title: "Highest Paying States for Psychologists"
    paragraphs:
      - "Washington leads at $137,530 in a higher-price labor market, where workers face expensive housing and everyday purchases. Those expenses influence the wages employers need to offer, although prices do not explain every difference. Washington remains third after adjustment, indicating that the dollar premium survives much of the price correction."
      - "Washington's $115,240 median is below its mean, so the middle employee earns less than the leading average suggests. Clinical and counseling psychologists assess disorders, conduct interviews and tests, and provide psychotherapy. School psychology is a separate occupation, and mixing its wages into this table would change the question being answered."
    table:
      columns:
        rank: "Rank"
        state: "State"
        mean_annual: "Avg. Annual Salary"
        mean_hourly: "Avg. Hourly Wage"
