      description: "Clinical and counseling psychologist employee wages and employment, SOC 19-3033"
    - name: "BEA Regional Price Parities"
      url: "https://apps.bea.gov/regional/zip/SARPP.zip"
      description: "2024 all-items state prices used for purchasing-power adjustment"
