    icon: "fa-solid fa-house-medical"
    title: "Lowest Paying States for Psychologists"
    paragraphs:
      - "Louisiana's $79,510 average belongs to a lower-price labor market, which helps explain why equivalent purchasing power requires fewer salary dollars. Its last-place adjusted wage shows that local prices explain only part of the gap. Clinical and counseling psychologists work across healthcare and counseling settings whose compensation structures also differ."
      - "Louisiana reports 320 employee positions and a $71,330 median wage. Clinical and counseling psychologists assess mental and behavioral problems and provide psychological treatment, while [social worker salaries](/rankings/economy/social-worker-salary-by-state) add the pay of a profession working with families and support services."
