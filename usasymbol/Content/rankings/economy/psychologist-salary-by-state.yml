seo:
  title: "Psychologist Salary by State | Map & Pay"
  description: "Clinical and counseling psychologist employees average $137,530 in Washington and $79,510 in Louisiana. New Mexico leads in adjusted pay."
page:
  h1: "Psychologist Salary by State"
  quick_answer:
    - "Psychologist salary by state is highest in Washington at $137,530 for clinical and counseling employees. Its expensive labor market helps explain higher dollar pay, while self-employed practitioners and school psychologists are outside the comparison."
    - "Louisiana averages $79,510, the lowest reported employee wage. Lower state prices increase that figure to $90,140 in adjusted purchasing power, but Louisiana remains last among states with available estimates."
    - "New Mexico leads in adjusted pay at $132,662 despite ranking eighth in dollars. Its wage estimate is available even though employment is suppressed, showing why missing fields must be handled separately."
  methodology: "BLS OEWS May 2025 clinical/counseling employees, SOC 19-3033, exclude DC and self-employment. BEA 2024 RPP adjusts pay, with wages missing in Connecticut, Maine, Maryland and jobs missing in Maine, New Mexico, South Carolina."
  sources:
