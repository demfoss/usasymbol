      url: "https://www.bls.gov/ooh/life-physical-and-social-science/psychologists.htm"
      description: "Clinical and counseling roles and separate psychological specialties"
    - name: "BLS Geographic and Industry Wage Differences"
      url: "https://www.bls.gov/oes/earnings.htm"
      description: "Geographic prices, experience, and employer setting as influences on pay"
