faq:
  - question: "What state pays crane operators the most?"
    answer: "Hawaii leads in both mean annual pay and median annual pay. Its $124,260 median means the midpoint of the wage distribution is above the $119,300 average."
  - question: "How much does a crane operator make in Texas?"
    answer: "Texas crane operators average $33.49 an hour and have median annual pay of $73,280."
  - question: "How much does a crane operator make in California?"
    answer: "California averages $87,030 annually, or $41.84 an hour. Median annual pay is $79,570, and the state ranks tenth by average salary."
  - question: "How much does a crane operator make in Florida?"
    answer: "Florida averages $71,460 annually and $34.36 hourly. Its $71,560 median is close to the average, unlike the wider gap between those measures in New York."
  - question: "How much does a crane operator make in New York?"
    answer: "New York crane operators average $55.48 an hour, placing second in annual salary."
  - question: "Which state has the lowest crane operator salary?"
    answer: "Arkansas has the lowest average annual wage, with median annual pay of $41,600. Crane operation typically follows experience as a rigger, signaler, or construction equipment operator."
