  - id: why-hawaii-crane-operators-earn-more
    icon: "fa-solid fa-building"
    title: "Why Hawaii Crane Operators Earn More"
    paragraphs:
      - "Hawaii leads with a $57.36 mean hourly wage in a construction market where covered state and county projects must pay prevailing wages. The public works schedule separates equipment operators into groups by the machinery they operate. That creates a concrete pay floor for covered crane assignments and helps explain the state's premium."
      - "Arkansas, last at $21.71 an hour, repealed its state prevailing wage law through Act 1068 in 2017. Public construction therefore lacks that statewide wage-setting mechanism, although federally covered projects still follow federal rules."
  - id: states-with-most-crane-operator-jobs
    icon: "fa-solid fa-briefcase"
    title: "States With the Most Crane Operator Jobs"
    paragraphs:
      - "Texas employs 6,010 crane operators at an average of $69,650. Construction sites, ports, and steel mills use cranes for different tasks, from raising building materials to loading cargo. Those work settings connect crane operation to the wider freight network described in [truck driver salaries](/rankings/economy/truck-driver-salary-by-state)."
      - "Louisiana has the highest crane operator concentration at 0.996 per 1,000 jobs, with 1,930 employees. Port work provides one recognizable setting for this occupation, where moving cargo may continue through overnight shifts."
