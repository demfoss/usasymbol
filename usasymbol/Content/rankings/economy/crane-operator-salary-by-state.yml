sections:
  - id: highest-paying-states-for-crane-operators
    icon: "fa-solid fa-arrow-trend-up"
    title: "Highest Paying States for Crane Operators"
    paragraphs:
      - "Hawaii's $119,300 average covers operators who lift heavy loads by cable and tower equipment. A crane operator works with ground crews giving hand signals or radio instructions, making communication part of the skill alongside precise control of the boom and hook."
      - "New York averages $115,400, with a median of $85,850. High-rise construction gives crane operators a distinctive assignment, raising materials to crews far above the street. An operator may remain on the same building site throughout the construction project."
