  quick_answer:
    - "Crane operator salary by state is highest in Hawaii at $119,300 a year. Public construction pay schedules place crane work in equipment groups with prescribed wage floors."
    - "Arkansas averages $45,160, the lowest state salary. Its public construction labor market operates without the state prevailing wage law repealed in 2017."
    - "Texas employs 6,010 crane operators, the largest workforce. Crane work spans construction lifts, port cargo handling, and industrial facilities."
