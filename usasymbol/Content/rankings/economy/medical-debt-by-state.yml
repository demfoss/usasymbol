faq:
  - question: "Which state has the most medical debt?"
    answer: "Oklahoma, where 10.1% of residents with a credit record have medical debt in collections. Medicaid expansion reached the state only in 2021, years after most of the country."

  - question: "What percent of Americans have medical debt in collections?"
    answer: "5.0% of people with a credit record had medical debt in collections in 2023. Twenty-six states are above that figure and 24 are below it."

  - question: "Which state has the least medical debt?"
    answer: "Colorado, at 0.0%. Minnesota (0.7%) is the next lowest, followed by Vermont and Hawaii at 1.2% each."

  - question: "What is the medical debt rate in Texas?"
    answer: "Texas has 8.9% of residents with medical debt in collections, fourth highest in the country. Texas also has one of the highest shares of residents without health coverage, as the [uninsured rate by state](/rankings/health/states-by-uninsured-rate) shows."

  - question: "What is the medical debt rate in California?"
    answer: "California is at 2.8%, which ranks 36th. Its state Medicaid program, Medi-Cal, covers a large share of low-income residents."

  - question: "Which states ban medical debt from credit reports?"
    answer: "Colorado and New York were the first two to do so, in 2023. Their shares of 0.0% and 1.7% sit near the bottom of the table, well below the 5.0% U.S. share."

