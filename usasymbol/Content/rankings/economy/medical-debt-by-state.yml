sections:
  - id: "why-oklahoma-has-the-most-medical-debt"
    title: "Why Oklahoma Has the Most Medical Debt"
    paragraphs:
      - "Oklahoma leads at 10.1%, with Wyoming just behind at 10.0%. Oklahoma voters approved Medicaid expansion only in 2020, and coverage began in July 2021, so many low-income adults went years without it. Wyoming has never expanded Medicaid at all."
      - "An unpaid bill can sit on a credit file for up to seven years, so older gaps in coverage still show up in the figures. Texas (8.9%), Georgia (7.9%), and Tennessee (7.4%) also had not expanded Medicaid in 2023, and all three rank in the top eight."
