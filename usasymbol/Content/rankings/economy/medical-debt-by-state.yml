          share: "1.4%"
        - state: "South Dakota"
          share: "1.4%"
        - state: "Washington"
          share: "1.4%"

  - id: "medical-debt-on-credit-reports"
    title: "Medical Debt on Credit Reports"
    paragraphs:
      - "The U.S. share of 5.0% is far lower than it was a few years earlier because the three national credit bureaus changed their rules. Paid medical collections were removed, the grace period before unpaid bills appear was extended to one year, and collections under $500 were dropped in 2023."
      - "The rule changes lifted the floor for every state, but the gap between them stayed wide. Arizona (5.4%) sits close to the national figure while Ohio (6.3%) runs above it, and a better [average credit score](/rankings/economy/average-credit-score-by-state) does not protect a state from a hospital bill that goes to collections."

