  - id: "states-with-the-least-medical-debt"
    title: "States With the Least Medical Debt"
    paragraphs:
      - "Colorado reports 0.0%, the result of a law that took effect in 2023 and bars credit bureaus from listing medical debt. Bills there can still go unpaid, but they no longer appear in this kind of credit file. New York passed a similar ban the same year and sits at 1.7%."
      - "Hawaii (1.2%) has required employers to offer health insurance since its Prepaid Health Care Act of 1974, the first law of its kind in the country. Massachusetts (1.4%) has had near-universal coverage since its 2006 reform, which later served as a model for the national Affordable Care Act."
    table:
      columns:
        state: "State"
        share: "Share With Medical Debt"
      rows:
