  quick_answer:
    - "Medical debt in collections is most common in Oklahoma, where 10.1% of residents with a credit record have it. Wyoming follows at 10.0%, and both states sit at about twice the U.S. share of 5.0%."
    - "Colorado reports 0.0%, the lowest of any state, after a 2023 law barred credit bureaus from listing medical debt. Minnesota is next lowest at 0.7%."
    - "South Carolina ranks third at 9.1% and Texas fourth at 8.9%. Both lie in the South, where several states have not expanded Medicaid and many workers lack employer coverage."

  methodology: "Urban Institute Debt in America, 2023 data from the Credit Bureau Panel. Share of people with a credit record who have medical debt in collections. D.C. is excluded. Rank 1 is the highest share, and tied states share a rank."

