faq:
  - question: "What state pays ultrasound technicians the most?"
    answer: "California pays the highest mean wage at $126,610 a year and $60.87 an hour. The state also has the largest sonographer workforce, with 10,110 jobs across its extensive healthcare system."
  - question: "How much does an ultrasound technician make in California?"
    answer: "California ultrasound technicians average $126,610 annually, with a $128,530 median. The higher median places the middle worker above the statewide average."
  - question: "How much does an ultrasound technician make in Texas?"
    answer: "Texas sonographers average $88,940 a year and $42.76 an hour. Its 6,960 jobs form the second-largest state workforce for the occupation."
  - question: "How much does an ultrasound technician make in Florida?"
    answer: "Florida ultrasound technicians average $85,990 annually and earn a median of $82,940. The state employs 6,670 sonographers, third among the 50 states."
  - question: "What is the lowest ultrasound technician salary by state?"
    answer: "Alabama has the lowest state mean at $69,160 a year. Its $68,180 median is the wage midpoint for the state's 1,510 diagnostic medical sonographers."
  - question: "Is an ultrasound technician a diagnostic medical sonographer?"
    answer: "Diagnostic medical sonographer is the occupation counted here. Ultrasound technician is a common name for workers who operate sonographic equipment and create images that physicians use in diagnosis."
