  title: Massage Therapist Salary by State | Map & Pay
  description: Massage therapists average $122,580 a year in Hawaii and $38,140 in Louisiana. California has the largest employee workforce.
page:
  h1: Massage Therapist Salary by State
  quick_answer:
    - "Massage therapist salary by state is highest in Hawaii at $122,580 a year. Resort spas sell massage as part of an island wellness experience, drawing on traditions such as lomilomi alongside other treatments."
    - "Louisiana averages $38,140, the lowest published state wage. Lower housing rents and household prices place its local service work in a cheaper wage environment than Hawaii's resort economy."
    - "California employs 14,600 massage therapists. Work ranges from relaxation in spas to soft-tissue treatment in health-practitioner offices, with sessions planned around each client's needs."
  methodology: "BLS OEWS May 2025, SOC 31-9011 employee mean wages, annualized at 2,080 hours, excluding DC and self-employment, with no Vermont estimate. Price context uses BEA RPP 2024."
