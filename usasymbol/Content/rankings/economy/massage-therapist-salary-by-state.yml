faq:
  - question: What state pays massage therapists the most?
    answer: "Hawaii has the highest mean hourly pay at $58.93. Its spas offer lomilomi, a Native Hawaiian healing practice that uses techniques such as kneading and pressing with hands and forearms."
  - question: How much does a massage therapist make in California?
    answer: "California averages $55,630 annually and $26.75 hourly. Appointment-based work commonly includes part-time schedules, and therapists space sessions to manage the physical demands of repeated treatments."
  - question: What is the massage therapist salary in Washington?
    answer: "Washington averages $87,460 a year, with a median of $87,360. Therapists also document a client's condition and response to treatment for subsequent visits."
  - question: How much does a massage therapist make in New York?
    answer: "New York averages $67,860 annually and $32.63 hourly. A therapist may also explain stretching, posture, or relaxation techniques that clients can use between appointments."
  - question: What is the massage therapist salary in Florida?
    answer: "Florida's mean is $53,730 a year and its median is $49,680. Massage applies pressure to soft tissues, while [physical therapy](/rankings/economy/physical-therapist-salary-by-state) includes a broader rehabilitation plan with movement and exercise."
  - question: How much does a massage therapist make in Colorado?
    answer: "Colorado averages $68,380 annually and $32.88 hourly. Client assessment helps a therapist select techniques and adjust pressure rather than give everyone the same treatment."
