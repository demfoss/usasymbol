    paragraphs:
      - "Hawaii's $122,580 average sits in a service economy with resort spas and above-average housing costs. Hotels package massage with oceanfront rooms, couples' treatments, and other wellness services, creating a visitor market alongside local clients. Employer industry and local prices help shape the pay offered in that setting."
