faq:
  - question: "What state pays dietitians the most?"
    answer: "California pays the highest mean at $98,780 a year and $47.49 an hour. Its $98,850 median also exceeds every other state median."
  - question: "How much does a dietitian make in California?"
    answer: "California dietitians and nutritionists average $98,780 annually, with a $98,850 median. The state employs 8,720, more than any other state."
  - question: "How much does a dietitian make in Texas?"
    answer: "Texas dietitians and nutritionists average $72,670 a year and $34.94 an hour. Its workforce of 5,320 ranks third by employment."
  - question: "How much does a dietitian make in Florida?"
    answer: "Florida dietitians and nutritionists average $73,270 annually and earn a $76,050 median. The state has 4,370 jobs in the occupation."
  - question: "What is the lowest dietitian salary by state?"
    answer: "Arizona has the lowest mean at $64,960 a year and $31.23 an hour. Its annual median is $64,410."
  - question: "Are dietitians and nutritionists combined in this ranking?"
    answer: "Yes. The occupation used here combines dietitians and nutritionists under SOC 29-1031, so each state figure includes both professional titles."
