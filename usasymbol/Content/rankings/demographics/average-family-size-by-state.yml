page:
  h1: "Average Family Size by State"

  quick_answer:
    - "Utah has the largest average family size of any state, 3.47 people per family, well above the 3.14 national average."
    - "California ranks second at 3.41 people per family, and Hawaii is third at 3.40. All three top states exceed the national average by at least 0.26 people."
    - "Maine has the smallest average family size of any state at 2.81 people, followed by Vermont at 2.85, a gap of 0.66 from Utah's 3.47."

  methodology: "Figures are the average number of people per family household by state, based on U.S. Census Bureau American Community Survey data as compiled by World Population Review, 2024. Family size counts only households with two or more related people, a different measure than total household size. DC is excluded from state ranks."

  sources:
    - name: "World Population Review — Average Family Size by State"
      url: "https://worldpopulationreview.com/state-rankings/average-family-size-by-state"
      description: "State-level average family size, based on U.S. Census Bureau data, 2024"
