faq:
  - question: "Which state has the largest average family size?"
    answer: "Utah has the largest average family size of any state, 3.47 people per family, 0.33 above the 3.14 national average."

  - question: "Which state has the smallest average family size?"
    answer: "Maine has the smallest average family size of any state at 2.81 people. Vermont is next lowest at 2.85."

  - question: "What is the average family size in the United States?"
    answer: "The national average is 3.14 people per family. Fourteen states, led by Utah at 3.47, sit above that mark."

  - question: "Why does Utah have the largest average family size?"
    answer: "Utah's 55% Latter-day Saint adult population is tied to larger family sizes, and the state leads all others at 3.47 people per family."

  - question: "Where does Texas rank for average family size?"
    answer: "Texas ranks fourth at 3.30 people per family, behind only Utah, California, and Hawaii."

  - question: "Which states tie for the same average family size?"
    answer: "Alaska and Nevada tie at 3.23. Maryland and New Jersey tie at 3.19, and New Hampshire, Oregon, and West Virginia tie at 2.97."

