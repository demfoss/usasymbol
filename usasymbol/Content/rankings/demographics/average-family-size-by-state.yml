sections:
  - id: "why-utah-has-the-largest-average-family-size"
    icon: "fa-solid fa-people-group"
    title: "Why Utah Has the Largest Average Family Size"
    paragraphs:
      - "Utah's 3.47 people per family, the highest figure of any state, tracks with the state's large Church of Jesus Christ of Latter-day Saints population, which makes up 55% of Utah adults. Pronatalist teachings within that faith correlate with larger families nationally, a pattern that also puts Utah first in average household size."
      - "California is next closest at 3.41, and Hawaii follows at 3.40. Neither state approaches Utah's 3.47, which sits 0.06 above California and 0.07 above Hawaii."

