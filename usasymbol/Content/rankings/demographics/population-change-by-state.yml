faq:
  - question: "Which states are losing population?"
    answer: "California, New Mexico, West Virginia, Hawaii and Vermont lost population from July 2024 to July 2025. The other 45 states gained residents."
  - question: "Which state is losing population the fastest?"
    answer: "Vermont had the largest percentage decrease at 0.287%. Its population fell from 646,521 to 644,663."
  - question: "Which state lost the most residents?"
    answer: "California lost 9,465 residents, more than any other state in raw numbers. A large domestic migration loss outweighed its gains from births and international migration."
  - question: "Which state has the fastest population growth?"
    answer: "South Carolina grew fastest at 1.456%. Moves from other states accounted for most of its 79,958-person increase."
  - question: "How much did the Texas population grow?"
    answer: "Texas added 391,243 residents, rising 1.249% to 31,709,821. It had the largest numeric gain and the fourth-highest percentage growth."
  - question: "Did New York lose population in 2025?"
    answer: "New York gained 1,008 residents from July 2024 to July 2025, an increase of 0.005%. Its population remained just above 20 million."

