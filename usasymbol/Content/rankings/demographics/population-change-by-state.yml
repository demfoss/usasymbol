sections:
  - id: why-south-carolina-is-growing
    title: "Why South Carolina Is Growing"
    paragraphs:
      - "South Carolina grew 1.456%, adding 79,958 residents. Net domestic migration supplied 66,622 of that increase, which means moves from other states drove most of the gain."
      - "Idaho followed at 1.442%, while North Carolina grew 1.320%. The leading states combine strong in-migration with smaller starting populations than Texas, so each new resident produces a larger percentage change."

  - id: states-losing-population
    title: "States Losing Population"
    paragraphs:
      - "Vermont declined 0.287%, the largest percentage decrease. The state recorded 1,769 more deaths than births, and its small migration loss widened the drop instead of offsetting it."
      - "California lost 9,465 residents, the largest numeric decline. Its 229,077-person domestic migration loss exceeded gains from international migration and natural change. Hawaii, New Mexico and West Virginia were the other states that shrank."
    table:
      columns:
        rank: "Rank"
        state: "State"
        change: "Numeric Change"
        percent: "Percent Change"
      rows:
        - { rank: "46", state: "California", change: "-9,465", percent: "-0.024%" }
        - { rank: "47", state: "New Mexico", change: "-1,276", percent: "-0.060%" }
        - { rank: "48", state: "West Virginia", change: "-1,255", percent: "-0.071%" }
        - { rank: "49", state: "Hawaii", change: "-2,132", percent: "-0.149%" }
        - { rank: "50", state: "Vermont", change: "-1,858", percent: "-0.287%" }

  - id: states-adding-most-residents
    title: "States Adding the Most Residents"
    paragraphs:
      - "Texas added 391,243 residents, the largest numeric gain, but ranked fourth by percentage at 1.249%. Its increase came from both births exceeding deaths and migration, while [domestic migration by state](/rankings/demographics/domestic-migration-by-state) shows where moves within the country had the greatest effect."
      - "Florida added 196,680 residents and North Carolina added 145,907. Population size changes the picture, so the [largest states by population](/rankings/demographics/states-by-population) are not always the fastest-growing states."
