page:
  h1: "Population Change by State"

  quick_answer:
    - "Population change was highest in South Carolina at 1.456%, powered largely by people moving there from other states."
    - "Vermont had the largest percentage decline at 0.287%. Deaths exceeded births there, and migration was not large enough to close the gap."
    - "California lost the most residents in raw numbers, down 9,465, even though its percentage decrease was only 0.024%."

  methodology: "U.S. Census Bureau Vintage 2025 estimates compare resident populations on July 1, 2024 and July 1, 2025. Percent change and numeric change are published in the same release."

