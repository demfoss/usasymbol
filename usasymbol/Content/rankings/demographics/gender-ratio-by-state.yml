faq:
  - question: "Which state has the most women?"
    answer: "Delaware has the highest percentage of women. Maryland is next at 51.9%, then Mississippi, Alabama, and South Carolina at 51.8%."

  - question: "Which state has the most men?"
    answer: "Alaska, where men make up 52.1% of residents. North Dakota follows with 51.2% men, then Wyoming with 50.7%."

  - question: "What percent of the U.S. population is female?"
    answer: "Women make up 50.9% of U.S. residents, or 103.8 women per 100 men. Women are the majority because they live longer, and boys, who outnumber girls at birth by roughly 105 to 100, lose that edge with age."

  - question: "How many states have more men than women?"
    answer: "Eight, all with women below 50%. They are Idaho (49.9%), Montana (49.8%), Colorado (49.8%), Utah (49.6%), South Dakota (49.6%), Wyoming (49.3%), North Dakota (48.8%), and Alaska (47.9%). Nevada is nearly even at 50.0%."

  - question: "What is the gender ratio in California?"
    answer: "California is 50.7% women and 49.3% men, or 102.7 women per 100 men. That ranks 27th and sits just under the U.S. share, even though California has more people than any other state in [states by population](/rankings/demographics/states-by-population)."

  - question: "Why does Mississippi have more women than men?"
    answer: "Women make up 51.8% of Mississippi residents. Black Mississippians, who are a larger share of the state than in nearly any other, show a wider gap between women and men in Census counts."

