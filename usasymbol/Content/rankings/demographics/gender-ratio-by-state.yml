  description: "Delaware has the highest share of women at 52.0%. Alaska has the lowest at 47.9%, with 92.0 women for every 100 men."

page:
  h1: "Gender Ratio by State"

  quick_answer:
    - "Delaware has the highest share of women at 52.0%, or 108.4 women per 100 men. Retirees in its beach counties and women's longer lives both tilt the balance."
    - "Alaska has the lowest share of women at 47.9%, or 92.0 women per 100 men. Oil and gas work, fishing, mining, and large military bases draw a mostly male workforce."
    - "North Dakota has 48.8% women and Wyoming 49.3%. Eight states in all have more men than women, and every one is in the Mountain West, the northern Plains, or Alaska."

  methodology: "Resident population by sex on July 1, 2025, from the Census Bureau Vintage 2025 state estimates by age, sex, race, and Hispanic origin. Women per 100 men is women divided by men, times 100. The District of Columbia (53.3% women) is not ranked, and the U.S. figure covers the 50 states and D.C."

  sources:
    - name: "U.S. Census Bureau, State Population by Characteristics, 2020-2025"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-detail.html"
      description: "Annual state population estimates by age, sex, race, and Hispanic origin"
