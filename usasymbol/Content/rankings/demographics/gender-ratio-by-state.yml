      - "Delaware leads at 52.0% women, followed by Maryland at 51.9% and Mississippi, Alabama, and South Carolina at 51.8%. The top ten is a Southern and Mid-Atlantic list, joined by New York and Massachusetts."
      - "Women live several years longer than men nationwide, a gap visible in [life expectancy by state](/rankings/health/states-by-life-expectancy). Past age 80 women far outnumber men, so a state with many older residents tilts female."

  - id: "why-delaware-has-the-most-women"
    title: "Why Delaware Has the Most Women"
    paragraphs:
      - "Delaware combines two documented influences. Its southern beach counties attract retirees, and women outnumber men at older ages. Black residents also make up a larger share of Delaware than of most states, and Census counts show fewer men than women in that population."
      - "Maryland (51.9%), Mississippi (51.8%), Alabama (51.8%), and South Carolina (51.8%) share the second pattern, since each has a large Black population. Age matters too, and [median age by state](/rankings/demographics/median-age-by-state) shows where older residents cluster."

