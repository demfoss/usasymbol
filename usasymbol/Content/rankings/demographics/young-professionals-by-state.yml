faq:
  - question: "Which state has the highest share of young adults with a bachelor's degree?"
    answer: "Massachusetts, where 569,518 of the residents aged 25 to 34 hold a bachelor's degree or higher. New Jersey (52.23%) and New York (52.14%) follow."

  - question: "Which state has the most young adults with a bachelor's degree?"
    answer: "California has 2,438,217, ahead of Texas at 1,679,903 and New York at 1,460,295. Big populations lift the counts, so California ranks 15th by share at 42.71% and Texas ranks 28th at 37.21%."

  - question: "What percent of young adults have a bachelor's degree in the U.S.?"
    answer: "Nationally, 40.9% of adults aged 25 to 34 hold a bachelor's degree or higher. Fifteen states beat that figure, and Wisconsin misses it narrowly at 40.81%."

  - question: "Why does Nevada have so few college-educated young adults?"
    answer: "Nevada ranks 48th at 28.26% even though 14.42% of its residents are aged 25 to 34. Las Vegas runs on casinos, resorts, and hospitality, which hire many young workers into jobs that rarely require a degree."

  - question: "Which state has the highest share of residents aged 25 to 34?"
    answer: "Colorado, at 15.84% of its population. Washington (15.20%) and Utah (15.08%) also rank high, helped by the tech employers around Seattle and the Salt Lake City area."

  - question: "How does Illinois rank for young adults with a bachelor's degree?"
    answer: "Illinois ranks 8th at 46.57%, with 808,921 degree holders aged 25 to 34. Chicago's universities and its mix of finance, logistics, and health care employers help keep them."

