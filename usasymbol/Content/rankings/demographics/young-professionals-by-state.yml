          bachelors_count: "530,647"
    paragraphs:
      - "New Jersey (52.23%) and New York (52.14%) are almost level behind Massachusetts. New York holds 1,460,295 young degree holders, more than any state except California (2,438,217) and Texas (1,679,903), and New Jersey sits across the Hudson from the same Manhattan job market in finance, media, and law."
      - "Colorado's 49.93% stands out because it is not a coastal state. Denver and Boulder pull in graduates for aerospace, software, and outdoor-minded tech work, and the state is a frequent destination in [domestic migration](/rankings/demographics/domestic-migration-by-state). Vermont ranks 5th at 48.67%, but its small sample makes that figure less precise."

  - id: "why-massachusetts-has-the-most-young-graduates"
    title: "Why Massachusetts Has the Most Young Graduates"
    paragraphs:
      - "Massachusetts packs Harvard, MIT, Boston University, Northeastern, and dozens of other colleges into one metro area, so many 25 to 34 year-olds arrive as students and simply stay. Kendall Square in Cambridge is a hub for biotech and software, and Boston's hospitals and financial firms hire graduates by the thousands."
      - "That pipeline also shows in the [STEM degrees by state](/rankings/education/stem-degrees-by-state) table, where Massachusetts ranks 5th for the share of degrees in STEM fields."

  - id: "states-with-the-lowest-share-of-young-college-graduates"
    title: "States With the Lowest Share of Young College Graduates"
    paragraphs:
      - "West Virginia (28.16%) has been losing residents for years, and young graduates who cannot find a job in their field often leave for neighboring Virginia, Pennsylvania, or Ohio. Economists call this brain drain. New Mexico, Nevada, Oklahoma, and Alaska fill out the bottom five at 27.98% to 29.09%."
      - "Alaska is a special case. Its 15.31% of residents aged 25 to 34 is the second largest slice in the country, partly because of the military bases near Anchorage and Fairbanks, where many young enlisted service members live without a bachelor's degree."

