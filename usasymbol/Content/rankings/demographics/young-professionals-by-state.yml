  description: "Massachusetts has the highest share of 25 to 34 year-olds with a bachelor's degree at 57.14%. New Mexico has the lowest at 27.98%."

page:
  h1: "Young Professionals by State"

  quick_answer:
    - "Young professionals with a bachelor's degree are most concentrated in Massachusetts, where 57.14% of residents aged 25 to 34 hold one. Greater Boston's universities and biotech employers give graduates a reason to stay."
    - "New Mexico has the lowest share at 27.98%, even though the Los Alamos and Sandia national laboratories sit in the state. West Virginia (28.16%) and Nevada (28.26%) are just above it."
    - "Colorado ranks 4th at 49.93% and has the largest share of its population aged 25 to 34 at 15.84%. Alaska is second on that measure at 15.31% yet ranks 46th for degrees."

  methodology: "American Community Survey 2024 1-year estimates, tables S1501 and B01003. Share is residents aged 25 to 34 with a bachelor's degree or higher divided by all residents aged 25 to 34, calculated from the published counts. The District of Columbia is not ranked."

  sources:
    - name: "Census Bureau ACS 1-year, Table S1501"
