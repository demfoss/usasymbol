page:
  h1: "Population Density in the United States by State (2026)"

  quick_answer:
    - "New Jersey is the most densely populated U.S. state with 1,304 people per square mile. Rhode Island (1,082/sq mi), Massachusetts (919/sq mi), and Connecticut (765/sq mi) round out the top four."
    - "Alaska is the least densely populated state with just 1.3 people per square mile — nearly 1,000 times less dense than New Jersey. Wyoming (6.1/sq mi), Montana (7.9/sq mi), and North Dakota (12/sq mi) are also among the least dense."
    - "Washington D.C., while not a state, has the highest population density in the U.S. at 11,410 people per square mile — nearly 9 times denser than New Jersey."

  methodology: "Population density is calculated by dividing the total population by the total land area in square miles. Water area is excluded. This 2026 ranking uses the latest U.S. Census Bureau state population estimates available in 2026, from the Vintage 2025 series. Land area comes from the U.S. Census Bureau's geographic data. Washington D.C. is included for comparison but listed separately as it is not a state."

  sources:
    - name: "U.S. Census Bureau Population Estimates"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "Official 2025 population estimates"
    - name: "U.S. Census Bureau Geographic Data"
      url: "https://www.census.gov/geographies/reference-files/time-series/geo/gazetteer-files.2020.html"
      description: "Official state land area measurements"
    - name: "World Population Review"
      url: "https://worldpopulationreview.com/state-rankings/state-densities"
      description: "Population density analysis and rankings"

