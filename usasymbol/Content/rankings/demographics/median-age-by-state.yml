    icon: "fa-solid fa-arrow-up"
    title: "States With the Oldest Median Age"
    paragraphs:
      - "Maine has the oldest population in the country, with a median age of 44.8 years. New Hampshire follows at 43.3, and Vermont ranks third at 43.1."
      - "West Virginia ranks fourth at 42.7, and Florida is fifth at 42.6. Each of these five states also reports a female median age above 43.9, led by Maine's 46.0."
