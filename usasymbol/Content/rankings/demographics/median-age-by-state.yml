page:
  h1: "Median Age by State"

  quick_answer:
    - "Maine has the highest median age in the nation at 44.8 years, more than a decade above Utah at 32.0, the youngest state."
    - "New Hampshire ranks second at 43.3 years, and Vermont is third at 43.1. Texas ranks 49th at 35.6, while Alaska ranks 48th at 35.8."
    - "Maine also has the largest share of residents 65 and older at 21.84%, compared with just 11.25% in Utah, the lowest share of any state."

  methodology: "Median age and age-group shares are 2024 estimates from World Population Review, based on U.S. Census Bureau data. Figures cover total population by state, with separate shares for residents 65 and older and 85 and older."

  sources:
    - name: "World Population Review, Median Age by State"
      url: "https://worldpopulationreview.com/state-rankings/median-age-by-state"
      description: "2024 median age estimates by state, with male/female splits and 65+, 75+, and 85+ population shares"

