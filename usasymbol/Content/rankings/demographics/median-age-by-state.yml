    answer: "Yes. Maine's median age is 43.5 for men and 46.0 for women, a 2.5-year gap. Alaska's figures are 35.4 for men and 36.3 for women, a difference of 0.9 years."

  - question: "Where does California rank for median age?"
    answer: "California's median age is 37.9 years, ranking 40th nationally. Its share of residents 65 and older is 15.65%."

