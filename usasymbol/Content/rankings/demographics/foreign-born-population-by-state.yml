seo:
  title: "Foreign-Born Population by State 2026 | Map & Rankings"
  description: "California has the largest foreign-born share at 27.6%, ahead of New Jersey at 25.0% and New York at 23.3%. Montana and West Virginia trail at 2.1%."
page:
  h1: "Foreign-Born Population by State 2026"
  quick_answer:
    - "Foreign-born residents make up the largest share of California, at 27.6%, a result of its Mexican border, Pacific ports and decades of hiring in tech, farming and entertainment."
    - "Montana and West Virginia tie for the lowest share at 2.1%. Neither has a seaport or a large metro area, the places where newcomers usually settle first."
    - "Texas has the second-largest foreign-born population at 5,762,477 people but ranks only eighth by share at 18.4%, because its total population is so large."
  methodology: "Foreign-born residents as a share of each state's total population, plus the number of foreign-born residents, from the 2024 American Community Survey 1-year estimates (Census Bureau), percent rounded to one decimal. The 50 states are ranked. The District of Columbia and Puerto Rico are excluded."
  sources:
    - name: "U.S. Census Bureau. American Community Survey 1-Year Estimates, Selected Social Characteristics (DP02), 2024"
      url: "https://data.census.gov/table/ACSDP1Y2024.DP02"
      description: "Foreign-born population by state"
