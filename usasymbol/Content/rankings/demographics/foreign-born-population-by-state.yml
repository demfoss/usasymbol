  - id: states-with-the-most-foreign-born-residents
    icon: "fa-solid fa-users"
    title: "States With the Most Foreign-Born Residents"
    paragraphs:
      - "Texas has 5,762,477 foreign-born residents, second only to California, yet ranks eighth by share at 18.4%. Houston and Dallas draw workers from across Latin America and Asia, and the sheer size of the state dilutes the percentage. Florida holds 5,392,412 people, many tied to Cuban arrivals after the 1959 revolution and the growth of Miami."
      - "Large airports act as front doors, so the [largest airport in each state](/rankings/infrastructure/largest-airport-by-state) often sits in a state with a high count. Languages follow the same map, as shown in the [most spoken language after English by state](/rankings/demographics/most-spoken-language-after-english-by-state)."
