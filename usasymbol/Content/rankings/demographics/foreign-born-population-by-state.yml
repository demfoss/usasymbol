sections:
  - id: why-california-has-the-highest-share
    icon: "fa-solid fa-earth-americas"
    title: "Why California Has the Highest Share"
    paragraphs:
      - "California leads at 27.6%, with 10,902,022 foreign-born residents, more than any other state. It borders Mexico, faces Asia across the Pacific, and its harbors and airports in Los Angeles and San Francisco have received arrivals for generations. Angel Island in San Francisco Bay processed immigrants from Asia from 1910 to 1940."
      - "New Jersey at 25.0% and New York at 23.3% sit around the old Ellis Island gateway, which handled more than 12 million arrivals between 1892 and 1954. Relatives followed relatives, so immigrant neighborhoods kept growing. For the newest arrivals, see [net international migration by state](/rankings/demographics/net-international-migration-by-state)."
