faq:
  - question: "Which state has the highest percentage of foreign-born residents?"
    answer: "California, at 27.6%. New Jersey is second at 25.0% and New York third at 23.3%."
  - question: "Which state has the lowest percentage of immigrants?"
    answer: "Montana and West Virginia tie at 2.1%. Mississippi is next at 2.7%."
  - question: "What percent of Texas is foreign-born?"
    answer: "Texas is at 18.4%, which ranks 8th. Its 5,762,477 foreign-born residents are the second-largest number in the country, behind only California."
  - question: "What percent of Florida's population was born in another country?"
    answer: "Florida is at 23.1%, ranking 4th with 5,392,412 people. Miami grew into a gateway for Cubans and later for newcomers from across Latin America and the Caribbean."
  - question: "Who counts as foreign-born?"
    answer: "Anyone who was not a U.S. citizen at birth. That includes naturalized citizens, green card holders, refugees, students and temporary workers, so a large share of the foreign-born are now citizens."
  - question: "Is Washington D.C. included in this ranking?"
    answer: "No. The District of Columbia is not a state. Its 15.5% would fall between Rhode Island at 15.7% and Illinois at 15.4%."
