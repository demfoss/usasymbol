  - id: why-montana-and-west-virginia-rank-lowest
    icon: "fa-solid fa-mountain"
    title: "Why Montana and West Virginia Rank Lowest"
    paragraphs:
      - "Montana and West Virginia tie at 2.1%, with only 24,386 and 37,253 foreign-born residents. Neither has a seaport or a big metro area, and newcomers tend to settle where earlier arrivals, family and jobs already wait. Mountain terrain and thin populations offered little of that."
      - "Mississippi at 2.7% and Wyoming at 3.5% follow, both far from the Mexican border and from the big gateway cities. Hawaii shows the opposite pattern at 18.6%, since plantation owners recruited workers from Japan and the Philippines there in the 1800s and early 1900s."
