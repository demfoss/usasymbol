faq:
  - question: "Which state has the highest stay-at-home parent rate?"
    answer: "Idaho has the highest stay-at-home parent rate of any state at 49.07%, just 0.01 points ahead of Utah at 49.06%."

  - question: "Which state has the lowest stay-at-home parent rate?"
    answer: "Massachusetts has the lowest rate at 26.29%. South Dakota is close behind at 26.31%, a gap of only 0.02 points."

  - question: "Why does Massachusetts have the lowest stay-at-home parent rate?"
    answer: "Massachusetts two-earner households bring in a median $164,931 a year, the highest of any state, a factor the data ties to its 26.29% stay-at-home parent rate."

  - question: "What is the stay-at-home parent rate in California?"
    answer: "California's rate is 38.60%, ranking 18th among the 50 states."

  - question: "What is the stay-at-home parent rate in Texas?"
    answer: "Texas ranks seventh at 42.96%, more than 6 points above the 50-state average of 36.22%."

  - question: "Do any states tie for the same stay-at-home parent rate?"
    answer: "South Carolina and Alabama tie at 39.62% each, the only exact tie among the 50 states."

