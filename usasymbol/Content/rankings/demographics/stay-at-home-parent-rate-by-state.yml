page:
  h1: "Stay-at-Home Parent Rate by State"

  quick_answer:
    - "Idaho has the highest stay-at-home parent rate of any state, 49.07% of two-parent households with young children, narrowly ahead of Utah at 49.06%."
    - "Alaska ranks third at 45.36%, more than 4 points below Utah but still 19 points above Massachusetts, the lowest-ranked state at 26.29%."
    - "South Carolina and Alabama tie for 13th at 39.62% each, while South Dakota and Massachusetts sit within 0.02 points of each other at the bottom, 26.31% and 26.29%."

  methodology: "Figures show the share of children age five and under living in two-parent households with a stay-at-home parent, from 2024 U.S. Census Bureau American Community Survey data compiled by Playground, 2026. DC is not included."

  sources:
