faq:
  - question: "Which state has the lowest population density?"
    answer: "Alaska has the lowest population density at 1.3 people per square mile. Wyoming is second at 6.1, and Montana is third at 7.9."

  - question: "Are people in low-density states more introverted?"
    answer: "Not according to peer-reviewed personality research. Wyoming, Montana, North Dakota, and South Dakota are four of the five least dense states, yet all four fall into the higher-extraversion Friendly and Conventional cluster."

  - question: "Which region has the lowest extraversion scores, according to personality research?"
    answer: "The Northeast falls into the Temperamental and Uninhibited cluster, and the West falls into the Relaxed and Creative cluster. Both are associated with below-average extraversion."

  - question: "Is Texas grouped with the more extraverted Southern states?"
    answer: "No. The study places Texas in the lower-extraversion cluster typically associated with the Northeast, despite its Southern location. Every other Southern state in this table falls into the higher-extraversion group."

  - question: "What is the population density of Montana and Wyoming?"
    answer: "Montana is at 7.9 people per square mile and Wyoming at 6.1, the third and second least dense states in the country. Both are grouped in the higher-extraversion Friendly and Conventional cluster."

  - question: "Which states does personality research classify as most extraverted?"
    answer: "The Great Plains, Midwest, and most of the South make up the Friendly and Conventional cluster, the group associated with higher extraversion. Nebraska, Kansas, Iowa, Minnesota, and Missouri all fall into this group."

