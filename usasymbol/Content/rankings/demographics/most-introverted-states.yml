  description: "Alaska has the lowest population density at 1.3 people per square mile. Research finds the Great Plains more extraverted, not less."

page:
  h1: "Most Introverted States"

  quick_answer:
    - "Alaska has the lowest population density in the country at 1.3 people per square mile, the emptiest state by that measure and the closest available proxy for a solitary lifestyle."
    - "Wyoming, Montana, North Dakota, and South Dakota are four of the five least dense states, yet peer-reviewed personality research groups all four in the higher-extraversion Friendly and Conventional cluster, not the reverse."
    - "The same research finds lower extraversion concentrated in the Northeast and West, plus Texas, which the study places in the lower-extraversion cluster despite its Southern location."

  methodology: "Population density figures use the same 2025 Census Bureau estimates as this site's population density ranking. Extraversion trend applies the regional pattern from Rentfrow, Gosling, and Potter's peer-reviewed study by region rather than by exact state, except Texas, which the study specifically places in the lower-extraversion cluster despite its Southern location."

  sources:
    - name: "Rentfrow, Gosling & Potter — Divided We Stand: Three Psychological Regions of the United States"
      url: "https://pubmed.ncbi.nlm.nih.gov/24128185/"
      description: "Peer-reviewed study in the Journal of Personality and Social Psychology mapping Big Five personality traits, including extraversion, across U.S. states and regions"
    - name: "U.S. Census Bureau Population Estimates"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "Official 2025 population estimates used to calculate population density by state"

