sections:
  - id: "states-with-the-lowest-population-density"
    icon: "fa-solid fa-mountain"
    title: "States With the Lowest Population Density"
    paragraphs:
      - "Alaska has the lowest population density in the country at 1.3 people per square mile, well below Wyoming's 6.1 and Montana's 7.9. North Dakota and South Dakota are tied at 12 people per square mile, rounding out the five emptiest states."
      - "These figures measure space, not personality. Density is simply the clearest number available at the state level for how likely a person is to live far from a neighbor."

  - id: "why-sparse-states-are-not-necessarily-introverted"
    icon: "fa-solid fa-arrows-up-down"
    title: "Why Sparse States Are Not Necessarily Introverted"
    paragraphs:
      - "Wyoming, Montana, North Dakota, and South Dakota rank among the five least dense states in the country, yet peer-reviewed personality research groups all four in the Friendly and Conventional cluster, tied to moderately high extraversion. Nebraska and Kansas, also among the least dense states, fall into the same higher-extraversion group."
      - "Low population density and low extraversion are not the same measurement. A state can be sparsely settled and still score above average on sociability in survey-based personality research."

  - id: "where-personality-research-finds-lower-extraversion"
    icon: "fa-solid fa-chart-line"
    title: "Where Personality Research Finds Lower Extraversion"
    paragraphs:
      - "The Northeast, from Maine to New Jersey, falls into the Temperamental and Uninhibited cluster, marked by below-average extraversion, despite several of those states ranking among the most densely populated in the country. The West, including Nevada, Utah, and California, falls into the Relaxed and Creative cluster, also below average on extraversion."
      - "Texas is the one state the same study places in the lower-extraversion group despite its Southern location. Every other Southern state in this table falls into the higher-extraversion Friendly and Conventional cluster."

