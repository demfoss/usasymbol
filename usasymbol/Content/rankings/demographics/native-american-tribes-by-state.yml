  - id: oklahoma-tribes
    icon: "fa-solid fa-feather"
    title: "Tribes in Oklahoma"
    paragraphs:
      - "Oklahoma has 38 tribes, though few of them began there. Under the Indian Removal Act of 1830, the Cherokee, Choctaw, Chickasaw, Muscogee (Creek) and Seminole were forced west on the Trail of Tears to what was then Indian Territory, and later the government placed dozens of other nations on land in the same region."
      - "Washington has 29 and New Mexico 24. New Mexico's total includes 19 pueblos, communities that have lived in the same river valleys for centuries."
  - id: states-with-no-federally-recognized-tribes
    icon: "fa-solid fa-map"
    title: "States With No Federally Recognized Tribes"
    paragraphs:
      - "Thirteen states have none, among them Georgia, Ohio, Pennsylvania and Kentucky. Most lie in the East and Midwest, where the Cherokee, Shawnee, Lenape and other nations were pushed out in the 1700s and 1800s."
      - "Some of those states still have tribes recognized only by the state, such as the Nanticoke in Delaware. Hawaii has none because Native Hawaiians have no federally recognized tribal government."
