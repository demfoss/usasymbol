page:
  h1: "Native American Tribes by State"
  quick_answer:
    - "Alaska has the most federally recognized tribes of any state at 227, because the federal government lists each Alaska Native village as its own tribal government."
    - "California is second with 109, mostly small rancherias, and Oklahoma third with 38, home to nations moved there in the 1800s. Thirteen states, including Georgia and Ohio, have none."
  methodology: "Federally recognized tribes located in each state, from the Bureau of Indian Affairs list of 575 tribes (December 2025) as organized in Wikipedia's list by state, with Alaska at the BIA figure of 227. A tribe with land in several states is counted in each of them, so state totals add up to more than 575. Component bands under a parent tribe count once. Thirteen states have no federally recognized tribe and are omitted (Arkansas, Delaware, Georgia, Hawaii, Kentucky, Maryland, Missouri, New Hampshire, New Jersey, Ohio, Pennsylvania, Vermont, West Virginia). The District of Columbia has none. State-recognized tribes are not counted."
  sources:
