faq:
  - question: "Which state has the most Native American tribes?"
    answer: "Alaska, with 227 federally recognized tribes. Each Alaska Native village is listed as a tribe of its own, so the count is far above California's 109."
  - question: "How many federally recognized tribes are there in the United States?"
    answer: "There are 575 as of December 2025, when the Lumbee Tribe of North Carolina gained recognition. Of the earlier total of 574, 227 were in Alaska and 347 in the other states."
  - question: "How many Native American tribes are in Oklahoma?"
    answer: "Oklahoma has 38 federally recognized tribes, third most of any state. Many are nations that were relocated there from the Southeast and the Great Lakes region in the 1800s."
  - question: "How many tribes are in California?"
    answer: "California has 109, the second most of any state. Most are small rancherias, and several tribes such as the Quechan and Fort Mojave are shared with Arizona."
  - question: "Which states have no federally recognized tribes?"
    answer: "Arkansas, Delaware, Georgia, Hawaii, Kentucky, Maryland, Missouri, New Hampshire, New Jersey, Ohio, Pennsylvania, Vermont and West Virginia."
  - question: "Can a tribe be counted in more than one state?"
    answer: "Yes. The Navajo Nation has land in Arizona, New Mexico and Utah, so it appears in all three. Because of that, state counts add up to more than 575."
