sections:
  - id: why-alaska-has-the-most-tribes
    icon: "fa-solid fa-mountain"
    title: "Why Alaska Has the Most Tribes"
    paragraphs:
      - "Alaska has 227 federally recognized tribes because the federal government lists each Alaska Native village as a tribal government of its own. The 1971 Alaska Native Claims Settlement Act turned that land into regional and village corporations, and the villages kept their separate standing as tribes."
      - "California is second with 109 because its tribes are small. Many were left with rancherias, tiny parcels bought for landless California Indians in the early 1900s, and a rancheria can be one tribe of only a few dozen members. Tribal casinos are common in both states, as the [casinos by state](/rankings/culture/casinos-by-state) ranking shows."
