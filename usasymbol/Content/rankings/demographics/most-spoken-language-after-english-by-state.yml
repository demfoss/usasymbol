faq:
  - question: "What is the most spoken language in Illinois after English and Spanish?"
    answer: "Polish is the most spoken language in Illinois after English and Spanish, with an estimated 185,000 home speakers concentrated in Chicago. Chicago's Polish-American community, established by migration waves from the 1880s through the 1980s, is the largest outside Warsaw."

  - question: "What language is most spoken in Minnesota after English and Spanish?"
    answer: "Somali is the most spoken language in Minnesota after English and Spanish, with an estimated 130,000 home speakers in the Minneapolis-Saint Paul metro area. Minnesota received more Somali refugees per capita than any other state following the Somali civil war of the 1990s. Hmong is a close second, also the result of post-Vietnam War refugee resettlement."

  - question: "How many people in the United States speak Navajo?"
    answer: "Approximately 170,000 people speak Navajo at home in the United States, making it the most widely spoken indigenous language in the country. It is the third most spoken language in Arizona and New Mexico after English and Spanish, and UNESCO classifies it as 'vulnerable' rather than 'endangered' because intergenerational transmission still occurs on the Navajo Nation."

  - question: "Why does Florida have so many Haitian Creole speakers?"
    answer: "Florida's estimated 600,000 Haitian Creole speakers reflect Miami-Dade County's large Haitian diaspora, which grew significantly after political crises in 1991 and 2004 and again after the 2010 earthquake. Miami's Little Haiti neighborhood and Haitian communities in Broward County make Florida home to more Haitian Creole speakers than any country outside Haiti itself."

  - question: "What language is most spoken in Michigan after English and Spanish?"
    answer: "Arabic is Michigan's most spoken language after English and Spanish, with an estimated 310,000 home speakers. Dearborn holds the largest Arab-American community in the United States, a settlement anchored by Lebanese, Yemeni, and Iraqi immigration that began with Ford Motor Company's early-20th-century labor recruitment."

  - question: "Why does Arkansas have Marshallese speakers?"
    answer: "Springdale, Arkansas hosts the largest Marshallese community outside the Marshall Islands because of the Compact of Free Association, which allows Marshallese citizens to live and work in the US without a visa. Most Marshallese came to Springdale initially for poultry-processing jobs and have since built a community of roughly 40,000 people, the largest Pacific Islander enclave in the interior United States."

  - question: "Why is German still widely spoken in states like Pennsylvania, Indiana, and Ohio?"
    answer: "German in Pennsylvania, Indiana, and Ohio is primarily Pennsylvania Dutch, a High German dialect spoken daily by Old Order Amish and Mennonite communities. These communities transmit the language to every generation as a first language, so the speaker count is not shrinking. German is the most common non-English non-Spanish home language in roughly 20 states; Hutterites in Montana and the Dakotas speak a related dialect called Hutterisch."

