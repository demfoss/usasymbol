faq:
  - question: "Which state has the highest share of Gen Z residents?"
    answer: "Utah has the highest Gen Z share at 26.76% of its population. North Dakota is second at 22.90%, and Texas is third at 22.72%."

  - question: "Which state has the highest share of Baby Boomers?"
    answer: "Maine has the highest Baby Boomer share at 25.08%. Vermont follows at 24.59%, and New Hampshire is third at 24.29%."

  - question: "Which state has the highest share of Millennials?"
    answer: "Colorado has the highest Millennial share at 24.32%, ahead of Washington at 23.69% and Alaska at 23.20%."

  - question: "Which state has the highest share of Gen X residents?"
    answer: "New Jersey has the highest Gen X share at 19.93%. West Virginia is close behind at 19.92%, and Nevada is third at 19.54%."

  - question: "What is the generation breakdown in Texas?"
    answer: "Texas is 22.72% Gen Z, 22.48% Millennial, 18.54% Gen X, and 15.98% Boomer, giving it the third-highest Gen Z share of any state."

  - question: "Why does Utah have so few Baby Boomers?"
    answer: "Utah's Boomer share is 13.66%, the lowest of any state and well under half of Maine's 25.08%. Utah also has the nation's highest Gen Z share at 26.76%, giving it the youngest overall generation mix in the country."

