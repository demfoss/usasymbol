sections:
  - id: "states-with-the-highest-gen-z-share"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest Gen Z Share"
    paragraphs:
      - "Utah has the largest Gen Z population share of any state, at 26.76% of residents. North Dakota ranks second at 22.90%, and Texas is third at 22.72%."
      - "Idaho follows at 22.57%, and Kansas rounds out the top five at 22.25%. All five top states also post Boomer shares below the 19.54% national figure, except Kansas and Idaho, which sit just above it."
