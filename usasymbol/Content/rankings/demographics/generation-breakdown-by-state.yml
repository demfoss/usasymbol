  description: "Utah has the largest Gen Z share of any state at 26.76%. Maine has the largest Baby Boomer share at 25.08%, nearly double Utah's boomer share."

page:
  h1: "Generation Breakdown by State"

  quick_answer:
    - "Utah has the highest share of Gen Z residents of any state at 26.76% of its population, more than 3.8 points above North Dakota, the next-highest state at 22.90%."
    - "Maine has the largest Baby Boomer share at 25.08%, while Utah's Boomer share is the lowest in the country at 13.66%, an 11.4-point gap between the two states."
    - "Colorado has the largest Millennial share at 24.32%, and New Jersey has the largest Gen X share at 19.93%. Nationally, Millennials make up 21.32% of the population, just ahead of Gen Z at 21.01%."

  methodology: "Generation shares are calculated from the U.S. Census Bureau's Vintage 2025 Population Estimates by single year of age, as of July 1, 2025. Ages are sorted into birth-year cohorts: Gen Z (1997-2012), Millennial (1981-1996), Gen X (1965-1980), and Baby Boomer (1946-1964)."

  sources:
    - name: "U.S. Census Bureau, Vintage 2025 Population Estimates by Age and Sex"
      url: "https://www.census.gov/data/datasets/time-series/demo/popest/2020s-state-detail.html"
      description: "Annual state population estimates by single year of age as of July 1, 2025, used to calculate each state's share of population in each generational birth-year cohort"

