  - id: "states-with-the-highest-boomer-share"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Highest Baby Boomer Share"
    paragraphs:
      - "Maine has the largest Baby Boomer share in the country at 25.08%, followed by Vermont at 24.59% and New Hampshire at 24.29%."
      - "Delaware ranks fourth at 23.78%, and West Virginia is fifth at 23.02%. Each of these five states also posts one of the lowest Gen Z shares nationally, with Maine and Hawaii the two lowest overall at 18.14% and 18.08%."
