      - "Utah has the lowest average marriage age in the country at 26.0 years, with men marrying at 26.8 and women at 25.2. Idaho follows at 27.0, the only other state under 27.1."
      - "Four states tie for the next-lowest spot at 27.1, Arkansas, Kentucky, South Dakota, and West Virginia. Oklahoma follows at 27.2, and Kansas closes out the bottom ten at 27.6."
