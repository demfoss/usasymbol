sections:
  - id: "states-with-the-highest-marriage-age"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest Marriage Age"
    paragraphs:
      - "New York posts the highest combined marriage age in the country, an average of 31.4 years across men and women. Men there marry at 32.2 and women at 30.5, both among the oldest figures nationwide."
      - "Massachusetts ranks second at 31.3, and California follows closely at 31.2. Connecticut rounds out the top four at 31.1, with men marrying at 31.8 and women at 30.3."
