page:
  h1: "Average Age at First Marriage by State"

  quick_answer:
    - "New York has the oldest average age at first marriage among the states, 31.4 years, with men marrying at 32.2 and women at 30.5."
    - "Utah is the youngest-marrying state at an average of 26.0, more than five years below New York, with men marrying at 26.8 and women at 25.2."
    - "Hawaii has the widest gap between sexes at 5.4 years, since men there marry at 32.5, the oldest male figure of any state, while women marry at 27.1."

  methodology: "Ages are 2023 American Community Survey 1-year estimates, Table B12007, for the population ages 15 to 54, on record with the Census Bureau. The average and gap columns are calculated from the published male and female medians."

