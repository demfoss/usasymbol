faq:
  - question: "Which state has the oldest average age at first marriage?"
    answer: "New York has the oldest average age at first marriage at 31.4 years. Men there marry at 32.2 and women at 30.5, both among the highest figures in the country."

  - question: "Which state has the youngest average age at first marriage?"
    answer: "Utah has the youngest average age at first marriage at 26.0 years, more than five years below New York."

  - question: "What is the national average age at first marriage?"
    answer: "The national median age at first marriage in 2023 was 30.6 years for men and 28.7 years for women, according to the Census Bureau's American Community Survey."

  - question: "What is the average age at first marriage in California?"
    answer: "California's average age at first marriage is 31.2 years, third-highest among the states. Men marry at 32.1 and women at 30.2."

  - question: "Which state has the biggest gap between men's and women's marriage age?"
    answer: "Hawaii has the biggest gap at 5.4 years. Men there marry at 32.5, the oldest male figure of any state, while women marry at 27.1."

  - question: "Which state has a higher marriage age for women than men?"
    answer: "Mississippi is the only state where women marry later than men. The female median is 28.2 years, compared with 27.6 for men, a reversed gap of 0.6 years."

