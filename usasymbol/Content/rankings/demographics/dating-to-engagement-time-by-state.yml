faq:
  - question: "How long do couples date before getting engaged by state?"
    answer: "Dating-to-engagement times range from 15 months in Utah to 36 months in Massachusetts. The national average is approximately 25 months, or just over 2 years. Southern and Mountain West states are consistently faster; Northeast and Pacific Coast states are consistently slower."

  - question: "Which state has the shortest dating time before engagement?"
    answer: "Utah has the shortest average dating time before engagement at 15 months, driven primarily by LDS cultural norms that emphasize early marriage. Mississippi (17 months) and Arkansas (18 months) rank second and third fastest."

  - question: "Which state has the longest dating time before engagement?"
    answer: "Massachusetts has the longest average dating time before engagement at 36 months (3 years). New York (35 months) and California (34 months) rank second and third slowest. All three states have large urban populations, high education levels, and secular cultures where long-term cohabitation before engagement is common."

  - question: "How long should you date before getting engaged?"
    answer: "The national average is approximately 25 months, or just over 2 years. However, averages range from 15 months (Utah) to 36 months (Massachusetts) depending on the state. Surveys consistently find that couples who date 1-3 years before engagement report higher relationship satisfaction than those who date for a very short or very long time."

  - question: "Why do Southern states get engaged faster?"
    answer: "Southern states have shorter dating-to-engagement timelines primarily because of stronger religious affiliation — the Bible Belt states (Alabama, Mississippi, Arkansas, Tennessee) have the highest church attendance rates in the country, and evangelical Protestant culture emphasizes traditional marriage and early family formation. Lower cost of living in rural Southern communities also reduces financial barriers to early engagement."

  - question: "Do more religious states propose faster?"
    answer: "Yes, the correlation is strong. Every state in the top 10 fastest for engagement has a higher-than-average religious attendance rate. Utah (LDS), Mississippi, Arkansas, Oklahoma, and Alabama — all top-10 fastest states — rank among the top 10 most religious states in Gallup and Pew Research surveys. Every state in the bottom 10 slowest — Massachusetts, New York, Oregon, Vermont, Maine — ranks among the least religious states."

