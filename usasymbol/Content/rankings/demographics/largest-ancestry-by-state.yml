faq:
  - question: "What is the largest ancestry in the United States by state?"
    answer: "German is the largest ancestry in 28 states, English in 13, Irish in 4 and Italian in 3. Louisiana is led by French and Alabama by \"American.\""
  - question: "Which state has the most people of German ancestry?"
    answer: "Pennsylvania, with 2,809,843 residents. California follows at 2,671,714 and Ohio at 2,628,648."
  - question: "What is the most common ancestry in Texas?"
    answer: "German, at 2,498,429 residents, ranking 4th. German immigrants settled the Hill Country in the 1840s, and towns such as New Braunfels and Fredericksburg still carry that heritage."
  - question: "Why is Alabama's largest ancestry American?"
    answer: "Alabama has 653,721 residents who list \"American\" and nothing else. Many belong to families that have lived in the South for so many generations that they no longer name a country of origin."
  - question: "Which state is mostly of French ancestry?"
    answer: "Louisiana is the only state where French is the largest ancestry, at 440,472 residents. Maine has a large French-speaking community as well, but English leads there at 302,917."
  - question: "Which state has the most Italian Americans?"
    answer: "New York, with 2,163,906 residents reporting Italian ancestry. New Jersey follows at 1,279,010."
