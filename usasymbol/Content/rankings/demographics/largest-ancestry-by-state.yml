sections:
  - id: why-pennsylvania-has-the-largest-german-ancestry
    icon: "fa-solid fa-people-group"
    title: "Why Pennsylvania Has the Most German Ancestry"
    paragraphs:
      - "Pennsylvania leads with 2,809,843 residents reporting German ancestry. William Penn recruited German-speaking settlers to his colony, and Germantown near Philadelphia was founded by German families in 1683. Their descendants became the Pennsylvania Dutch, a name that comes from the word Deutsch."
      - "German ancestry is the top answer in 28 states, and Ohio at 2,628,648 and Wisconsin at 2,115,941 show how the migration moved west. Wisconsin drew many Germans after the failed revolutions of 1848, and Milwaukee grew famous for its breweries. For a related surname view, see the [most common last name by state](/rankings/culture/most-common-last-name-by-state)."
