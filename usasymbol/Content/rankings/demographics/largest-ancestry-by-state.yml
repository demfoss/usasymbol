  title: "Largest Ancestry by State | Map, Groups & Rankings"
  description: "German is the largest ancestry in most states, led by Pennsylvania at 2,809,843 people. English, Irish, Italian, French and American top the rest."
page:
  h1: "Largest Ancestry by State"
  quick_answer:
    - "Largest ancestry by state is led by Pennsylvania, where 2,809,843 residents report German roots, a legacy of the Germans who began arriving under William Penn in the 1680s."
    - "Hawaii has the smallest top group, with 83,954 residents reporting German ancestry. Louisiana is the only state led by French, tied to the Acadians who resettled there in the 1700s."
    - "Alabama is the only state where \"American\" is the largest answer, at 653,721 people, a sign of families settled so long ago that they name no country of origin."
  methodology: "Number of residents reporting the state's largest ancestry, from the 2020-2024 American Community Survey 5-year estimates, table B04006 (Census Bureau). Respondents could list up to two ancestries, and German is counted separately from other groups. Hispanic origin is a separate question and is not ranked here. The 50 states are ranked by count, and the District of Columbia is excluded. Percent shares are not shown."
  sources:
    - name: "U.S. Census Bureau. American Community Survey 5-Year Estimates, People Reporting Ancestry (B04006), 2020-2024"
