    title: "States Where English Is the Largest Ancestry"
    paragraphs:
      - "English ancestry tops 13 states, led by North Carolina at 1,367,875 and Georgia at 1,133,105. Most sit in the South and Appalachia, where English colonists settled early and later waves of immigrants rarely arrived in large numbers."
      - "Utah, at 958,812, is the western exception. Thousands of English converts to the Church of Jesus Christ of Latter-day Saints emigrated to the Salt Lake Valley in the 1800s. Maine at 302,917 and Vermont at 123,783 are the New England entries, while the broader mix of newcomers is shown in the [foreign-born population by state](/rankings/demographics/foreign-born-population-by-state)."
