  - id: states-led-by-irish-italian-french-or-american
    icon: "fa-solid fa-ship"
    title: "States Led by Irish, Italian, or French Ancestry"
    paragraphs:
      - "New York at 2,163,906, New Jersey at 1,279,010 and Connecticut at 554,301 report Italian as their largest ancestry. Ellis Island received millions of Italians, mostly from southern Italy, between the 1880s and the 1920s, and many stayed in the cities around it."
      - "Massachusetts at 1,310,139, New Hampshire, Rhode Island and Delaware lead with Irish ancestry, and Boston absorbed a huge wave of Irish fleeing the famine of the 1840s. Louisiana at 440,472 is the only French-led state, shaped by Acadians who arrived in the 1700s after being expelled from Canada. Alabama at 653,721 is the only state that answers \"American.\""
