seo:
  title: "Population 65 and Older by State | Map & Rankings"
  description: "Maine has the highest share of residents 65 and older at 24.6%. Utah has the lowest at 13.0%. Florida is home to 5,346,788 residents 65 and older."

page:
  h1: "Population 65 and Older by State"

  quick_answer:
    - "Population 65 and older by state peaks in Maine, where 24.6% of residents are seniors. Young adults have long left for jobs elsewhere, and few babies are born to replace them."
    - "Utah has the smallest share at 13.0%. Utah families are large by U.S. standards, which keeps the average resident young."
    - "Florida ranks fourth at 22.8% but has 5,346,788 residents 65 and older, second only to California at 6,901,168. Most of Florida's seniors moved there after their working years."

  methodology: "U.S. Census Bureau Vintage 2025 population estimates by age for July 1, 2025. Share is residents 65 and older divided by total residents. The U.S. share of 18.9% is 64,617,088 of 341,784,857 residents, including D.C., which is not ranked (13.6%, 94,423 residents 65 and older)."

  sources:
    - name: "U.S. Census Bureau, State Population by Characteristics 2020-2025"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-detail.html"
      description: "Annual estimates of the resident population by single year of age, with the state file sc-est2025-alldata6"
    - name: "U.S. Census Bureau, National Population by Characteristics 2020-2025"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-national-detail.html"
      description: "Resident population by single year of age for the United States, file nc-est2025-agesex-res"

