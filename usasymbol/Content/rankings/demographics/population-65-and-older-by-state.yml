    paragraphs:
      - "Maine leads at 24.6%, followed by Vermont at 24.1% and New Hampshire at 23.0%. Northern New England has long had the oldest population in the country, because young adults leave for bigger job markets and birth rates are low. Hawaii (22.6%) and West Virginia (22.5%) also reach the top seven."
      - "Hawaii's seniors benefit from the longest [life expectancy by state](/rankings/health/states-by-life-expectancy) in the country, so more of its residents reach 65 and stay. Families worried about memory loss in later life can also look at [Alzheimer's by state](/rankings/health/alzheimers-by-state)."

  - id: "why-florida-has-so-many-retirees"
    title: "Why Florida Has So Many Retirees"
    paragraphs:
      - "Florida's 5,346,788 residents 65 and older trail only California, which has 6,901,168 seniors among far more people. Retirees arrive after their working years, drawn by warm winters and a state constitution that bans a personal income tax. Its 22.8% share ranks fourth."
      - "Arizona follows the same script at 20.6%, ranked 16th, with 1,571,773 seniors. Developer Del Webb opened Sun City near Phoenix in 1960 as a community built for retirees, and the model was copied across the Sun Belt. Florida's total also shows up in [states by population](/rankings/demographics/states-by-population)."

