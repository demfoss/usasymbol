    paragraphs:
      - "Utah has the smallest share at 13.0%, well below Texas at 14.9% and Alaska at 15.8%. Utah has some of the largest families in the country, so children and young adults make up a bigger slice of its residents than anywhere else."
      - "Alaska draws working-age people to oil, fishing, and military jobs, and many longtime Alaskans retire to warmer states. Texas still has 4,711,381 seniors, the third most of any state, but newcomers and young families dilute the share. Compare these results with [median age by state](/rankings/demographics/median-age-by-state)."

