faq:
  - question: "Which state has the highest percentage of seniors?"
    answer: "Maine, where 24.6% of residents are 65 or older. Vermont follows at 24.1% and New Hampshire at 23.0%."

  - question: "Which state has the lowest percentage of residents 65 and older?"
    answer: "Utah, at 13.0%. Texas ranks second lowest at 14.9%, and Alaska is third lowest at 15.8%."

  - question: "What percent of Florida is 65 and older?"
    answer: "22.8%, or 5,346,788 people, which ranks fourth by share. Delaware is right behind at 22.8% as well."

  - question: "Which state has the most people 65 and older?"
    answer: "California, with 6,901,168. Florida (5,346,788) and Texas (4,711,381) follow, and the three states are among the biggest by total population."

  - question: "What percent of the U.S. population is 65 and older?"
    answer: "18.9% of U.S. residents were 65 or older on July 1, 2025. Twenty-nine states are above that level, led by Maine at 24.6%."

  - question: "Is Arizona a state with many retirees?"
    answer: "Arizona ranks 16th at 20.6%, with 1,571,773 residents 65 and older. Its retirement communities around Phoenix helped make the state a destination for older Americans."

