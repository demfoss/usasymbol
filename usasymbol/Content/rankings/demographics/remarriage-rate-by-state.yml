faq:
  - question: "Which state has the highest remarriage rate?"
    answer: "Idaho has the highest remarriage rate among men at 46.6 per 1,000 previously married men. Its women's rate of 30.1 also ranks among the five highest states."

  - question: "Which state has the lowest remarriage rate?"
    answer: "Rhode Island has the lowest remarriage rate among men at 13.2 per 1,000. Delaware has the lowest rate among women at 8.8 per 1,000."

  - question: "What is the national remarriage rate?"
    answer: "The national remarriage rate in 2019 was 35.1 per 1,000 previously married men and 19.4 per 1,000 previously married women, both higher than any state's lowest published figure."

  - question: "Do the same states rank highest for both men and women?"
    answer: "Idaho and Mississippi are the only states published among the five highest for both genders. Idaho leads men at 46.6 and ranks second among women at 30.1; Mississippi posts 45.6 for men and 27.1 for women."

  - question: "Why doesn't this page cover all 50 states?"
    answer: "The National Center for Family & Marriage Research publishes exact 2019 remarriage rates only for the five highest and five lowest states in each gender category. The other states appear only on an unlabeled quartile map without specific numbers."

