page:
  h1: "Remarriage Rate by State"

  quick_answer:
    - "Idaho has the highest remarriage rate among men in the U.S. at 46.6 per 1,000 previously married men in 2019, and also ranks among the five highest for women at 30.1 per 1,000."
    - "Rhode Island has the lowest remarriage rate among men at 13.2 per 1,000, and also ranks among the five lowest for women at 12.8 per 1,000."
    - "The national remarriage rate in 2019 was 35.1 per 1,000 previously married men and 19.4 per 1,000 previously married women, both well above every state's lowest published figures."

  methodology: "National Center for Family & Marriage Research 2019 rates, per 1,000 previously married adults, listed only for the five highest and five lowest states per gender, from American Community Survey data. The other 35 states are excluded here."

