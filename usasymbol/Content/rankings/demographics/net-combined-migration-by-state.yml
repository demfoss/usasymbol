page:
  h1: "Net Combined Migration by State"

  quick_answer:
    - "Florida gained the most net combined migrants of any state from 2020 to 2024, 1,931,865, combining both domestic and international arrivals."
    - "California lost the most residents on a combined basis, 530,886, the largest net outflow of any state."
    - "Florida also posts the highest combined migration rate at 89.69 per 1,000 residents, well ahead of Idaho's 77.42 and South Carolina's 73.39."

  methodology: "Net combined migration adds domestic and international migration for each state from April 1, 2020 to July 1, 2024, on record for 2026. Washington D.C. is included as a jurisdiction alongside the 50 states."

  sources:
    - name: "Wikipedia. U.S. States by Net Combined Migration"
      description: "State-by-state total net combined domestic and international migration, 2020 to 2024, and the rate per 1,000 residents"

