sections:
  - id: "states-with-the-most-net-combined-migration"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Most Net Combined Migration"
    paragraphs:
      - "Florida gained 1,931,865 net combined migrants from 2020 to 2024, more than any other state. Texas follows at 1,568,491, and North Carolina is third at 573,272."

  - id: "states-with-the-biggest-net-combined-migration-losses"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Biggest Net Combined Migration Losses"
    paragraphs:
      - "California lost 530,886 residents on a combined basis, the largest net outflow of any state. New York follows at 446,814, and Illinois is third at 139,399."

  - id: "which-state-is-losing-residents-fastest"
    icon: "fa-solid fa-gauge-high"
    title: "Which State Is Losing Residents Fastest?"
    paragraphs:
      - "New York posts the steepest combined migration rate of any state at negative 22.12 per 1,000 residents, worse than California's negative 13.42 despite California's larger raw loss of 530,886 versus New York's 446,814."

