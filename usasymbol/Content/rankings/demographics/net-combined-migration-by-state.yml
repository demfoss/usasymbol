faq:
  - question: "Which state has the most net combined migration?"
    answer: "Florida, with 1,931,865 net combined migrants from 2020 to 2024. Texas ranks second at 1,568,491, and North Carolina is third at 573,272."

  - question: "Which state has the biggest net combined migration loss?"
    answer: "California, with a net loss of 530,886 from 2020 to 2024, the largest of any state."

  - question: "What is the net combined migration rate in Florida?"
    answer: "89.69 per 1,000 residents, the highest rate among all 50 states."

  - question: "Is California or New York losing residents faster?"
    answer: "New York, at negative 22.12 per 1,000 residents, a steeper rate than California's negative 13.42, even though California's raw loss of 530,886 is larger than New York's 446,814."

  - question: "What is the net combined migration for Texas?"
    answer: "1,568,491 from 2020 to 2024, the second-most of any state after Florida."

  - question: "Does Washington D.C. gain or lose residents overall?"
    answer: "D.C. posts a net combined gain of 5,309, though it is not ranked as a state. International arrivals offset a larger domestic outflow to produce that positive total."

