sections:
  - id: "tallest-states-men"
    icon: "fa-solid fa-arrow-up"
    title: "Tallest States in the U.S."
    paragraphs:
      - "Montana and South Dakota lead with men averaging 5'10.7\", and nine of the ten tallest states sit in the Plains, the Upper Midwest, or the Mountain West. Alabama, in 7th place, is the only Southern state in the top ten."
      - "The differences are small. Only 1.7 inches separate the tallest state for men from the shortest, and 41 states fall within half an inch of 5'10\"."
