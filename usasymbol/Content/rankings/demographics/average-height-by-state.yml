faq:
  - question: "Which state has the tallest people?"
    answer: "Montana has the tallest men, averaging 5'10.7\", with South Dakota a hair behind. Most of the tallest states sit on the Northern Plains, where many families trace their roots to Germany and Scandinavia."

  - question: "Which state has the tallest women?"
    answer: "Utah, where women average 5'4.7\". Montana and South Dakota round out the top three at the same rounded height."

  - question: "Which state has the shortest people?"
    answer: "Hawaii is shortest for both sexes, with men at 5'9.0\" and women at 5'3.5\". California is the next shortest state for men, and New Mexico for women."

  - question: "What is the average height in Texas?"
    answer: "Texas men average 5'9.8\" and women 5'3.9\". The state ranks 44th for men and 47th for women, below every neighbor except New Mexico."

  - question: "What is the average height in California?"
    answer: "California men average 5'9.6\", 49th of 50 states, and women average 5'4.2\". Only Hawaii has shorter men."

  - question: "What is the average height in Florida?"
    answer: "Florida men average 5'10.0\" and women 5'4.2\", which puts the state 41st for men."

  - question: "What is the average height in New York?"
    answer: "New York men average 5'9.7\" and women 5'4.1\". The state ranks 46th for men, one of several Northeast states near the bottom of the list."

  - question: "How accurate is average height by state data?"
    answer: "Every figure is self-reported in a phone survey, and people tend to round their height up. The true averages are probably a little lower everywhere, but the order of the states holds because the bias runs the same way in each one. For body size, see [average BMI by state](/rankings/health/average-bmi-by-state)."

