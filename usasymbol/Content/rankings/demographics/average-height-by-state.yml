  quick_answer:
    - "Average height by state peaks in Montana, where men average 5'10.7\". The Northern Plains and Mountain West fill most of the top ten, a pattern tied to the Northern European families who settled them."
    - "Hawaii is the shortest state, with men at 5'9.0\" and women at 5'3.5\". Its gap below California, the next shortest state for men, is the biggest jump anywhere in the table."
    - "Utah has the tallest women at 5'4.7\" and ranks third for men. Texas sits near the bottom for both, 44th for men and 47th for women."

  methodology: "Average self-reported adult height by state and sex from the CDC Behavioral Risk Factor Surveillance System (BRFSS) 2017. States are ranked by average male height."

