  - id: "why-montana-is-tallest"
    icon: "fa-solid fa-circle-question"
    title: "Why Montana Has the Tallest Average Height"
    paragraphs:
      - "Montana, the Dakotas, Nebraska, Iowa, and Minnesota were settled in the late 1800s largely by German, Scandinavian, and Dutch farm families. Northern Europeans are among the tallest people in the world, and that ancestry still shows at the top of the table."
      - "Utah followed a similar path. Thousands of its pioneers were converts from Britain and Scandinavia who crossed the plains to join the early Mormon settlements, and Utah now has the tallest women of any state."

  - id: "average-height-women"
    icon: "fa-solid fa-person-dress"
    title: "Average Height for Women by State"
    paragraphs:
      - "Utah women average 5'4.7\", the tallest of any state, just ahead of Montana and South Dakota. Illinois is the surprise on the women's list. It ranks 23rd for men but 5th for women at 5'4.6\"."
      - "Hawaii, New Mexico, and Rhode Island have the shortest women. Texas falls to 47th at 5'3.9\", three places lower than its rank for men."
    table:
      numbered: true
      columns:
        state: "State"
        women: "Women"
      rows:
        - state: "Utah"
          women: "5'4.7\""
        - state: "Montana"
