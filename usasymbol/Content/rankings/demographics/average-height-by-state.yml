  - id: "hawaii-outlier"
    icon: "fa-solid fa-arrow-down"
    title: "Shortest States in the U.S."
    paragraphs:
      - "Hawaii has the shortest average height for both men and women. It also has the largest share of Asian American and Pacific Islander residents of any state, and adults of East and Southeast Asian ancestry tend to be shorter than those of Northern European ancestry."
      - "New Mexico, California, and Texas have large Hispanic populations, and all three rank in the bottom seven for men. Many adults there grew up in Mexico or Central America, where childhood nutrition kept average heights lower for generations. Their U.S.-born children tend to grow taller."
    table:
      numbered: false
      columns:
