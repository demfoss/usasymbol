faq:
  - question: "Which state has the highest divorce rate?"
    answer: "Nevada has the highest divorce rate at 3.8 per 1,000 population in 2023. Idaho and Wyoming are tied for second at 3.4, and Oklahoma is fourth at 3.3."

  - question: "Which state has the lowest divorce rate?"
    answer: "Louisiana has the lowest divorce rate at 0.9 per 1,000 population in 2023. Illinois is next at 1.2, and Kansas follows at 1.7."

  - question: "What is the divorce rate in California?"
    answer: "California has not filed divorce counts with the National Center for Health Statistics since federal funding for detailed marriage and divorce data collection ended in 1996, so no per-state figure is published for 2019 through 2023. Hawaii, Indiana, Minnesota, and New Mexico are the other four non-reporting states."

  - question: "Has the divorce rate gone up or down since 2019?"
    answer: "Most reporting states declined between 2019 and 2023. Louisiana fell the most, from 2.4 to 0.9. Massachusetts, Mississippi, and North Dakota were the only states where the rate rose, by 0.3, 0.3, and 0.1 points."

  - question: "What is the divorce rate in Texas?"
    answer: "Texas is at 2.1 per 1,000 population in 2023, unchanged from 2.1 in 2019. That places it 38th, tied with Wisconsin."

  - question: "What is the divorce rate in Florida?"
    answer: "Florida is at 3.0 per 1,000 population in 2023, down from 3.5 in 2019. It ranks 9th, tied with Alabama and Arkansas."

