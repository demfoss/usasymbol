page:
  h1: "Divorce Rate by State"

  quick_answer:
    - "Nevada has the highest divorce rate in 2023 at 3.8 per 1,000 population, the highest of any state that reports data to the National Center for Health Statistics."
    - "Louisiana has the lowest divorce rate at 0.9 per 1,000 population in 2023, down from 2.4 in 2019, the largest five-year drop of any state."
    - "California, Hawaii, Indiana, Minnesota, and New Mexico do not report divorce rate data to the NCHS, so no per-state figure is available for these five states."

  methodology: "Divorce rates per 1,000 population, 2019 through 2023, are from the National Center for Health Statistics (NCHS) state-stats tables. California, Hawaii, Indiana, Minnesota, New Mexico, and the District of Columbia are excluded for not reporting or not being a state."

  sources:
