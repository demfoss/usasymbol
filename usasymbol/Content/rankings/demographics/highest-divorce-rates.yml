map:
  title: "Divorce Rate by State Map"
  image_alt: "U.S. map shaded by 2023 divorce rate per 1,000 population, from Nevada's 3.8 to Louisiana's 0.9"
  caption: "Nevada leads at 3.8 divorces per 1,000 population, followed by Idaho and Wyoming at 3.4. Louisiana is lowest at 0.9. California, Hawaii, Indiana, Minnesota, and New Mexico are unshaded, since none report data to the NCHS."
  metric_key: divorce_rate_2023
  metric_label: "Divorce rate per 1,000 population"
  detail_keys:
    - divorce_rate_2019
    - rate_change_2019_2023
  color_scheme: red
  color_scale: linear

sections:
  - id: "states-with-the-highest-divorce-rates"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest Divorce Rates"
    paragraphs:
      - "Nevada has the highest divorce rate in 2023 at 3.8 per 1,000 population, ahead of Idaho and Wyoming, which are tied for second at 3.4. Oklahoma follows at 3.3, and Alaska and Utah are tied at 3.1."
      - "Alabama, Arkansas, and Florida are tied at 3.0, rounding out the top nine. Every state in this group posted a lower rate in 2023 than in 2019, led by Oklahoma's drop from 3.9 to 3.3."

  - id: "states-with-the-lowest-divorce-rates"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Divorce Rates"
    paragraphs:
      - "Louisiana has the lowest divorce rate in 2023 at 0.9 per 1,000 population, less than a quarter of Nevada's rate. Illinois is next at 1.2, and Kansas follows at 1.7."
      - "Massachusetts sits at 1.8 and Iowa at 1.9, rounding out the five lowest rates in the table. Louisiana's 0.9 and Nevada's 3.8 mark the full spread of the 2023 data."

  - id: "states-where-divorce-rates-changed-most-since-2019"
    icon: "fa-solid fa-arrows-up-down"
    title: "States Where Divorce Rates Changed Most Since 2019"
    paragraphs:
      - "Louisiana posted the largest drop of any state, falling 1.5 points from 2.4 in 2019 to 0.9 in 2023, now the lowest rate in the country. Arkansas fell the second most, down 1.0 point from 4.0 to 3.0, and Arizona dropped 0.9 points, from 2.9 to 2.0."
      - "Only three states had a higher divorce rate in 2023 than in 2019. Massachusetts and Mississippi both rose by 0.3 points, and North Dakota rose by 0.1 point. Every other reporting state declined over the same five years."

