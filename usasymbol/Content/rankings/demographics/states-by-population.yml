sections:
  - id: "biggest-states"
    icon: "fa-solid fa-users"
    title: "Most Populous States: California, Texas, Florida, and New York"
    paragraphs:
      - "Four states have populations exceeding 20 million: California (39.3M), Texas (32.1M), Florida (23.7M), and New York (20.0M). Together, these four states hold 115 million people — one-third of all Americans — and all four rank in the top 10 for [tallest buildings by state](/rankings/geography/tallest-building-by-state)."
      - "California's population exceeds that of Canada and approaches Spain (47 million). If California were an independent country, it would have the world's 5th largest economy, with a GDP approaching $4 trillion that surpasses Germany, Japan, and the United Kingdom. California sends 52 representatives to Congress — more than the bottom 22 states combined."
      - "Texas has added nearly 3 million residents since 2020 — the largest raw gain of any state — driven by domestic migration from California, Illinois, and other high-cost states, plus a booming tech and energy sector. Texas is projected to surpass 40 million by 2040 and could eventually challenge California's top spot. Florida passed New York in 2014 and now leads by nearly 4 million."

  - id: "smallest-states"
    icon: "fa-solid fa-user"
    title: "Least Populous States: Six States Under 1 Million People"
    paragraphs:
      - "Six states have fewer than 1 million residents: Wyoming (591K), Vermont (643K), Alaska (738K), North Dakota (805K), South Dakota (943K), and Delaware (1.07M). These states combined — 4.8 million people — have fewer residents than the Phoenix metro area."
      - "Wyoming has fewer residents than Denver, Colorado. Yet Wyoming has two U.S. Senators — the same as California with 67 times more people. This disparity reflects the Constitution's design to balance large and small states, though critics argue it creates extreme inequity in representation."
      - "Vermont receives about $2.50 in federal spending for every $1 it pays in federal taxes — that's what thin tax bases require. These states' outsized Senate representation (equal to California, New York, or Texas) gives them political leverage that far exceeds their headcount."

  - id: "fastest-growing"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Fastest Growing States Since 2020"
    paragraphs:
      - "Idaho leads all states with nearly 12% population growth since the 2020 Census — the fastest of any state, more than doubling its previous decade's pace. South Carolina (+10.4%), Texas (+10.1%), Florida (+9.8%), and Utah (+9.3%) round out the top five. The Sun Belt and Mountain West are in the middle of a sustained boom."
      - "In raw numbers, Texas added nearly 3 million residents since 2020 — more than any other state. Florida added 2.1 million. These aren't just retirees: the Texas tech scene and Florida's emergence as a financial hub are drawing working-age migrants. North Carolina (+900K), Georgia (+690K), and Arizona (+540K) also posted major gains."
      - "The growth pattern shows clear regional trends: Southern and Mountain West states gaining, Northeast and Midwest stagnating or losing. Remote work accelerated these trends by decoupling jobs from geography. Tennessee, South Carolina, and Nevada have become primary migration destinations for people leaving high-cost coastal cities."

  - id: "declining-states"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Which States Are Losing Population"
    paragraphs:
      - "Seven states have lost population since the 2020 Census: Hawaii (-1.7%), West Virginia (-1.6%), New York (-1.0%), Louisiana (-0.8%), Illinois (-0.6%), California (-0.5%), and Mississippi (-0.1%). These losses vary sharply in character — Hawaii and West Virginia face structural demographic decline, while New York and California experienced pandemic-era departures that have since partially reversed."
      - "New York's net loss from the 2020 Census is about 200,000 residents; California's is around 190,000 — smaller than the headlines suggested. Both states saw COVID-era departures to Texas, Florida, and Arizona, followed by a partial rebound as housing costs in Austin and Miami began catching up with New York and San Francisco."
      - "West Virginia's decline is structural, not cyclical. The state has lost population almost every decade since 1950 as coal mining jobs disappeared, and no replacement industry has taken hold at scale. Illinois has shed roughly 77,000 residents since 2020, with Chicago-area households departing for Indiana, Wisconsin, and Sun Belt states."

  - id: "congressional-impact"
    icon: "fa-solid fa-landmark-dome"
    title: "How Population Determines Congressional Seats"
    paragraphs:
      - "Population directly determines representation in the House of Representatives. After each census, 435 House seats are reapportioned among states based on population. The 2020 Census shifted 7 seats: Texas gained 2; Colorado, Florida, Montana, North Carolina, and Oregon each gained 1; California, Illinois, Michigan, New York, Ohio, Pennsylvania, and West Virginia each lost 1."
      - "California's 52 representatives give it enormous power in the House, but its 2 Senators equal Wyoming's 2. This means a Wyoming resident has roughly 67 times more Senate representation per capita than a Californian. The Electoral College reflects this imbalance — small states have proportionally more electoral votes per resident."
      - "Based on 2025 estimates, Texas could gain another 3-5 seats after the 2030 Census. South Carolina, with over 10% growth since 2020, may earn an additional representative. Meanwhile, New York, Illinois, and California are at risk of further losses. The South and West continue gaining political power at the expense of the Northeast and Midwest."

  - id: "population-vs-land"
    icon: "fa-solid fa-scale-balanced"
    title: "Population vs. Land Area: Why Big States Aren't the Most Populated"
    paragraphs:
      - "Population and land area have almost no correlation among U.S. states. Alaska, the largest state (665,384 sq mi total area), ranks 48th in population. Rhode Island, the smallest state (1,034 sq mi land area), ranks 44th in population. Texas is both the 2nd largest by area AND 2nd largest by population — a rare alignment."
      - "California demonstrates this disparity starkly. With 39 million people across 155,779 square miles, California averages 253 people per square mile. Alaska, more than four times larger by total area, has less than 2% of California's population. New Jersey's 9.6 million people — packed into 7,354 square miles — outnumber the combined populations of Wyoming, Vermont, Alaska, North Dakota, South Dakota, and Delaware: 4.8 million people spread across 1.4 million square miles."
      - "This disparity creates governance challenges. Sparse states must provide services across vast distances with limited tax bases. Dense states struggle with congestion, housing costs, and infrastructure strain."

faq:
  - question: "What is the most populous state in the United States?"
    answer: "California is the most populous U.S. state with approximately 39.3 million residents as of 2025. California has more people than Canada and would rank as the 5th largest economy in the world if it were an independent country. Texas (32.1 million) is second, followed by Florida (23.7 million)."

  - question: "What is the least populous state in the United States?"
    answer: "Wyoming is the least populous U.S. state with approximately 591,000 residents as of 2025. Wyoming has fewer people than Denver, Colorado. Vermont (643,000) is the second least populous state."

  - question: "What percentage of the U.S. population lives in California?"
    answer: "Approximately 11.5% of the U.S. population lives in California. The state's 39.3 million residents represent more than 1 in 9 Americans. The top 3 states (California, Texas, Florida) contain about 28% of the U.S. population, and the top 10 states contain 54%."

  - question: "Which states are growing the fastest?"
    answer: "Idaho is the fastest-growing state by percentage, with nearly 12% growth since 2020. South Carolina (+10.4%), Texas (+10.1%), Florida (+9.8%), and Utah (+9.3%) follow. In raw numbers, Texas has added nearly 3 million people since 2020 — more than any other state."

  - question: "Which states are losing population?"
    answer: "Seven states have lost population since the 2020 Census: Hawaii (-1.7%), West Virginia (-1.6%), New York (-1.0%), Louisiana (-0.8%), Illinois (-0.6%), California (-0.5%), and Mississippi (-0.1%). West Virginia's decline is long-term and structural; New York and California saw pandemic-era departures that have partially reversed."

  - question: "How many people live in the United States?"
    answer: "The United States has an estimated population of approximately 343 million people as of 2025. This makes the U.S. the 3rd most populous country in the world, behind China (1.4 billion) and India (1.4 billion). The U.S. population grows by roughly 1-2 million per year through births and immigration."

  - question: "How does population affect congressional representation?"
    answer: "Population determines the number of seats each state has in the U.S. House of Representatives. The 435 House seats are reapportioned after each census based on population. California has 52 representatives (most), while Wyoming, Vermont, Alaska, and several other small states have just 1 each. Every state has exactly 2 Senators regardless of population."

  - question: "When did Florida pass New York in population?"
    answer: "Florida surpassed New York in population in 2014, becoming the 3rd most populous state. Since then, Florida has continued growing while New York has slightly declined, widening the gap to nearly 4 million people. Florida's growth is driven by domestic migration from high-tax states and international immigration."

