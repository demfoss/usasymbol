compare:
  metric_slug: population
  title: "Compare Population Between States"
  description: "Choose two states and jump into a side-by-side population comparison with density, land area, and related context."
  button_text: "Compare population"
  icon: "fa-solid fa-people-group"
  default_state_a: california
  default_state_b: wyoming

sections:
  - id: "biggest-states"
    icon: "fa-solid fa-users"
    title: "Most Populous States: California, Texas, Florida, and New York"
    paragraphs:
      - "Four states have populations exceeding 20 million: California (39.3M), Texas (32.1M), Florida (23.7M), and New York (20.0M). Together, these four states hold about 115 million people, or roughly one-third of the U.S. population."
      - "The gap between the top two states is still large: California has about 7.2 million more residents than Texas. Texas, however, has grown by +10.1% since 2020 while California is down -0.5% in the same column."
      - "Florida ranks third at 23.7 million and New York ranks fourth at 20.0 million, a difference of about 3.7 million people. Georgia and North Carolina sit just outside the top eight and are separated by fewer than 60,000 residents."

  - id: "smallest-states"
    icon: "fa-solid fa-user"
    title: "Least Populous States: Five States Under 1 Million People"
    paragraphs:
      - "Five states have fewer than 1 million residents: Wyoming (590,784), Vermont (642,805), Alaska (738,003), North Dakota (805,329), and South Dakota (943,078). Delaware is next at 1.07 million."
      - "The smallest states are tightly clustered at the bottom. Wyoming and Vermont are separated by only about 52,000 residents, while Alaska and North Dakota are separated by about 67,000."
      - "A small population does not always mean population loss. Wyoming is up +2.4% since 2020, North Dakota is up +3.4%, and South Dakota is up +6.4%."

  - id: "fastest-growing"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Fastest Growing States Since 2020"
    paragraphs:
      - "Idaho leads all states with +11.9% growth since the 2020 Census. South Carolina (+10.4%), Texas (+10.1%), Florida (+9.8%), and Utah (+9.3%) round out the top five."
      - "Large states can post large percentage gains too. Texas ranks second by population and third for growth rate, while Florida ranks third by population and fourth for growth rate."
      - "Several mid-sized states also grew quickly: North Carolina is up +8.7%, Delaware is up +8.1%, Arizona is up +7.5%, and Tennessee is up +6.8%."

  - id: "declining-states"
    icon: "fa-solid fa-arrow-trend-down"
    title: "Which States Are Losing Population"
    paragraphs:
      - "Seven states have lost population since the 2020 Census: Hawaii (-1.7%), West Virginia (-1.6%), New York (-1.0%), Louisiana (-0.8%), Illinois (-0.6%), California (-0.5%), and Mississippi (-0.1%)."
      - "The declines include both very large and much smaller states. California and New York remain the two largest states in the country, while Hawaii and West Virginia rank 40th and 39th by population."
      - "Mississippi is close to flat at -0.1%. Vermont is listed at 0.0%, the lowest-ranked state that is neither growing nor declining in the table."

  - id: "congressional-impact"
    icon: "fa-solid fa-landmark-dome"
    title: "How Population Determines Congressional Seats"
    paragraphs:
      - "Population is the basis for each state's seats in the U.S. House of Representatives after every decennial census. The table shows why the largest states matter in that process: California, Texas, Florida, and New York together hold about one-third of the U.S. population."
      - "The same ranking also shows why small states remain distinct in national politics. Wyoming has 590,784 residents, while California has 39.3 million — about 67 times as many people."
      - "Growth since 2020 points to where future reapportionment pressure may build. Texas, Florida, South Carolina, Utah, North Carolina, Delaware, and Arizona all show gains above +7%."

  - id: "population-vs-land"
    icon: "fa-solid fa-scale-balanced"
    title: "Population vs. Land Area: Why Big States Aren't the Most Populated"
    paragraphs:
      - "Population rank is different from land-area rank. Alaska is near the bottom by population at #48, while Texas is one of the few states that ranks near the top by both population and land area. For the same data divided by square miles, see the [U.S. states by population density](/rankings/demographics/states-by-population-density) ranking."
      - "New Jersey shows the opposite pattern: it ranks #11 by population with 9.6 million residents, even though it is far smaller than western states such as Alaska, Montana, and Wyoming."
      - "California's 39.3 million residents give it the largest population total, but density tells a different story. On the density ranking, California sits below smaller northeastern states such as New Jersey, Rhode Island, Massachusetts, and Connecticut."

faq:
  - question: "What is the most populous state in the United States?"
    answer: "California is the most populous U.S. state with approximately 39.3 million residents as of 2025. Texas (32.1 million) is second, followed by Florida (23.7 million) and New York (20.0 million)."

  - question: "What is the least populous state in the United States?"
    answer: "Wyoming is the least populous U.S. state with 590,784 residents as of 2025. Vermont (642,805) is second smallest, followed by Alaska (738,003)."

  - question: "What percentage of the U.S. population lives in California?"
    answer: "Approximately 11.5% of the U.S. population lives in California. The state's 39.3 million residents represent more than 1 in 9 Americans. The top 3 states (California, Texas, Florida) contain about 28% of the U.S. population, and the top 10 states contain 54%."

  - question: "Which states are growing the fastest?"
    answer: "Idaho is the fastest-growing state by percentage, with +11.9% growth since 2020. South Carolina (+10.4%), Texas (+10.1%), Florida (+9.8%), and Utah (+9.3%) follow."

  - question: "Which states are losing population?"
    answer: "Seven states have lost population since the 2020 Census: Hawaii (-1.7%), West Virginia (-1.6%), New York (-1.0%), Louisiana (-0.8%), Illinois (-0.6%), California (-0.5%), and Mississippi (-0.1%). Hawaii and West Virginia show the largest percentage declines in the table."

  - question: "How many people live in the United States?"
    answer: "The table totals to roughly 343 million people across the 50 states. California, Texas, and Florida together account for about 28% of that total."

  - question: "How does population affect congressional representation?"
    answer: "Population determines the number of seats each state has in the U.S. House of Representatives after each census. The ranking shows the scale difference behind that process: California has about 39.3 million residents, while Wyoming has 590,784."

  - question: "When did Florida pass New York in population?"
    answer: "Florida is currently ahead of New York in this ranking. Florida has 23.7 million residents, while New York has 20.0 million, a gap of about 3.7 million people."

