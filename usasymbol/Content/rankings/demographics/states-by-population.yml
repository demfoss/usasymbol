page:
  h1: "U.S. States by Population"

  quick_answer:
    - "California is the most populous U.S. state with 39.3 million residents. Texas (32.1 million), Florida (23.7 million), and New York (20.0 million) round out the top 4."
    - "Wyoming is the least populous state with just 591,000 residents — smaller than Denver, Colorado. Vermont (643,000), Alaska (738,000), and North Dakota (805,000) are also among the smallest."
    - "The top 10 states by population contain 54% of all Americans. California, Texas, and Florida alone account for about 28% of the U.S. population."

  methodology: "Population figures are based on U.S. Census Bureau estimates for 2025. These estimates use the 2020 Census as a base and incorporate birth, death, and migration data. Change since 2020 is calculated against the April 2020 decennial Census count. Rankings may shift as official 2030 Census data becomes available. Washington D.C. is included for comparison but listed separately as it is not a state."

  sources:
