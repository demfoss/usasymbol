page:
  h1: Bank Robberies by State
  quick_answer:
  - California recorded the most bank robberies of any state in 2023, with 192 incidents against federally insured banks, the highest total on record.
  - Illinois ranks second at 116, and Colorado follows at 104. Both trail California by a wide margin, with North Carolina fourth at 66.
  - Six states reported zero bank robberies in 2023, North Dakota, South Dakota, Vermont, West Virginia, Wyoming, and Hawaii.
  methodology: Figures count bank robberies, burglaries, and larcenies against federally insured financial institutions reported to the FBI for 2023, the most recent annual edition of its Bank Crime Statistics report.
  sources:
  - name: FBI Bank Crime Statistics 2023
    url: https://www.fbi.gov/file-repository/reports-and-publications/bank-crime-statistics-2023-091724.pdf
    description: Annual FBI tally of robberies, burglaries, and larcenies against federally insured banks, credit unions, and other institutions, by state, for 2023
