sections:
- id: states-with-the-most-bank-robberies
  icon: fa-solid fa-building-columns
  title: States With the Most Bank Robberies
  paragraphs:
  - California recorded 192 bank robberies in 2023, far ahead of Illinois at 116 and Colorado at 104. North Carolina ranks fourth at 66, and Florida rounds out the top five at 63.
  - California also logs the most bank burglaries, at 12, followed by Colorado at 11 and North Carolina at 10. Combined, its 204 total incidents lead every other state.
- id: states-with-the-fewest-bank-robberies
  icon: fa-solid fa-arrow-trend-down
  title: States With the Fewest Bank Robberies
  paragraphs:
  - Six states reported zero bank robberies in 2023, North Dakota, South Dakota, Vermont, West Virginia, Wyoming, and Hawaii. West Virginia and Wyoming each logged one bank burglary instead.
  - New Hampshire, Arkansas, Montana, and Kentucky each reported exactly one bank robbery, the lowest nonzero total among the states.
faq:
- question: Which state has the most bank robberies?
  answer: California has the most bank robberies at 192 in 2023, more than Illinois and Colorado combined.
- question: Which states had zero bank robberies?
  answer: North Dakota, South Dakota, Vermont, West Virginia, Wyoming, and Hawaii each reported zero bank robberies in 2023.
- question: Which state has the most bank burglaries?
  answer: California has the most bank burglaries at 12, ahead of Colorado at 11 and North Carolina at 10.
- question: How many bank robberies happened in Texas?
  answer: Texas recorded 60 bank robberies in 2023, ranking seventh nationally, just behind New York's 61.
- question: What state has the most total bank crime incidents?
  answer: California has the most combined bank robberies, burglaries, and larcenies at 204, well ahead of Illinois at 120.
