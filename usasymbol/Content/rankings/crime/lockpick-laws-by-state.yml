page:
  h1: Lockpick Laws by State
  quick_answer:
  - Lockpick laws by state are legal to own in all 50 states as long as the tools are not possessed with intent to commit burglary, larceny, or another crime, under each state's general burglary-tools statute.
  - 'Virginia, Ohio, Nevada, and Mississippi go further: possession of lock picks by anyone outside a licensed trade is treated as prima facie evidence of criminal intent, shifting the burden to the possessor to prove a lawful purpose.'
  - Tennessee required a locksmith license to possess lock-picking tools under Tenn. Code Ann. Section 62-11-104(g), until the state repealed its locksmith licensing requirement effective May 27, 2021.
  methodology: Classification is based on the structure of each state's burglary-tools or possessing-criminal-tools statute as of 2026. States are grouped by whether possession alone creates a legal presumption of intent, per the statute's own text, current as of 2026.
