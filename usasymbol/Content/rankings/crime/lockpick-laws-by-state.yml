sections:
- id: states-where-possession-alone-creates-a-presumption-of-intent
  icon: fa-solid fa-scale-balanced
  title: States Where Possession Alone Creates a Presumption of Intent
  paragraphs:
  - Virginia, Ohio, Nevada, and Mississippi each write a prima facie evidence clause into their burglary-tools statute. Under Virginia Code Section 18.2-94 and Nevada Revised Statutes Section 205.080, possession of lock picks by anyone outside a licensed trade is treated as evidence of intent to commit burglary, robbery, or larceny.
  - Mississippi's version, Code Section 97-17-35, applies the presumption only when the tools are carried concealed on the person or in baggage. Ohio's statute, Section 2923.24, requires circumstances indicating criminal purpose for a dual-purpose tool like a lock pick.
- id: how-most-states-treat-lock-pick-possession
  icon: fa-solid fa-key
  title: How Most States Treat Lock Pick Possession
  paragraphs:
  - '46 states apply the standard rule: owning lock picks is legal, and prosecutors must prove separately that the possessor intended to use them for a crime such as burglary or larceny. North Dakota has no statute addressing lock picks or locksmithing tools at all.'
  - Tennessee once required a locksmith license to possess lock-picking tools under Tenn. Code Ann. Section 62-11-104(g), the only state with a licensing-based restriction. Tennessee repealed its locksmith licensing requirement effective May 27, 2021.
faq:
- question: Is it legal to own lock picking tools?
  answer: Yes, in every state, as long as the tools are not possessed with intent to commit burglary, larceny, or another crime. 46 states apply this standard intent-based rule.
- question: Which states treat lock pick possession as evidence of intent?
  answer: Virginia, Ohio, Nevada, and Mississippi each have a prima facie evidence clause in their burglary-tools statute. Possession by anyone outside a licensed trade shifts the burden to the possessor to prove a lawful purpose.
- question: Are lock picks legal in Virginia?
  answer: Owning lock picks is not banned outright in Virginia, but Code Section 18.2-94 treats possession by anyone other than a licensed dealer as prima facie evidence of intent to commit burglary, robbery, or larceny.
- question: Do you need a license to own lock picks in Tennessee?
  answer: No longer. Tenn. Code Ann. Section 62-11-104(g) once required a locksmith license to possess lock-picking tools, but Tennessee repealed its locksmith licensing requirement effective May 27, 2021.
- question: Is it illegal to carry lock picks in Mississippi?
  answer: Carrying lock picks concealed on the person or in baggage is prima facie evidence of intent to burglarize under Mississippi Code Section 97-17-35. Openly possessed tools are not covered by that presumption.
