page:
  h1: Fatal Car Accidents by State
  quick_answer:
  - Texas recorded the most traffic fatalities of any state in 2024, with 4,160 deaths, according to NHTSA's Fatality Analysis Reporting System.
  - California ranks second at 3,876 deaths, followed by Florida at 3,138. North Carolina is the only other state above 1,600, at 1,619.
  - Rhode Island recorded the fewest traffic deaths at 52, just below Vermont's 59. Both are far below the national total of 39,254.
  methodology: Totals reflect motor vehicle crash deaths reported to NHTSA's Fatality Analysis Reporting System (FARS) for 2024, as compiled by the Insurance Institute for Highway Safety. Raw totals are driven heavily by state population and miles driven.
