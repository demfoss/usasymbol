sections:
- id: states-with-the-most-romance-scam-victims
  icon: fa-solid fa-heart-crack
  title: States With the Most Romance Scam Victims
  paragraphs:
  - California reported 1,013 romance scam victims among adults 60 and older in 2024, ahead of Florida at 806 and Texas at 692. Arizona ranks fourth at 648, followed by New York at 397.
  - Texas victims lost more per person than Florida's despite fewer victims. Its $36.5 million spread across 692 people works out to $52,722 each, compared with Florida's $45,313 average across 806 victims.
- id: states-with-the-highest-average-loss-per-romance-scam-victim
  icon: fa-solid fa-sack-dollar
  title: States With the Highest Average Loss per Romance Scam Victim
  paragraphs:
  - Iowa victims lost an average of $65,733 each in 2024, the highest average of any state, well above North Carolina's $55,109 and Colorado's $54,380.
  - Alaska sits at the opposite end, with 35 victims and $302,660 in total losses, an average near $8,647 per victim.
  table:
    columns:
      rank: Rank
      state: State
      avg_loss_per_victim: Average Loss per Victim
    rows:
