faq:
- question: Which state has the most romance scam victims?
  answer: California has the most romance scam victims among adults 60 and older, with 1,013 reported in 2024 and $50.7 million in losses.
- question: Which state has the fewest romance scam victims?
  answer: North Dakota has the fewest, with 16 victims and $541,036 in reported losses in 2024.
- question: Which state has the highest average loss per romance scam victim?
  answer: Iowa has the highest average loss per victim at $65,733, based on 79 victims and $5.2 million in total losses. North Carolina follows at $55,109 per victim.
- question: How much did Texas lose to romance scams?
  answer: Texas reported $36.5 million in romance scam losses among 692 victims age 60 and over in 2024, ranking third nationally with an average loss of $52,722 per victim.
- question: How many romance scam victims were reported in Florida?
  answer: Florida reported 806 romance scam victims in 2024, the second-highest count of any state, with $36.5 million in total losses.
- question: What is the romance scam victim total in Arizona?
  answer: Arizona reported 648 romance scam victims in 2024, the fourth-highest count, with $30.9 million in reported losses.
