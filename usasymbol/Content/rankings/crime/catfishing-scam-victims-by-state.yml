page:
  h1: Catfishing and Romance Scam Victims by State
  quick_answer:
  - California reported the most romance scam victims among adults 60 and older in 2024, at 1,013, with $50.7 million in losses, the highest count on record.
  - Florida ranks second at 806 victims, and Texas follows at 692. Texas victims average $52,722 in losses each, higher than Florida's $45,313 average despite Florida's larger victim count.
  - North Dakota reported the fewest romance scam victims at 16, with $541,036 in losses, the lowest total among the states.
  methodology: Figures reflect Confidence/Romance fraud reports filed by individuals age 60 and over in each state's 2024 IC3 Elder Fraud Report, published by the FBI's Internet Crime Complaint Center.
