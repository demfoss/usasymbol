  - name: FBI Internet Crime Complaint Center — 2024 State Elder Fraud Reports
    url: https://www.ic3.gov/AnnualReport/Reports/2024EFState/
    description: State-by-state Confidence/Romance fraud victim counts and dollar losses among individuals age 60 and over, published in IC3's 2024 Elder Fraud state reports
