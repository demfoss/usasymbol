sections:
  - id: "states-with-most-death-sentences"
    title: "States With Most Death Sentences"
    paragraphs:
      - "California and Florida share first place with 5 new death sentences each. California's total is concentrated in three Riverside County cases, plus one case each in Sacramento and Stanislaus counties. Florida reached the same total across five different counties."
      - "Florida allowed 8 to 4 jury recommendations for death during 2025, and 3 of its 5 sentences followed non-unanimous decisions. Alabama's 4 sentences all followed non-unanimous decisions. The [executions by state](/rankings/crime/executions-by-state) page tracks a later stage of capital cases."
  - id: "states-with-no-death-sentences"
    title: "States With No Death Sentences"
    paragraphs:
      - "Forty-two states imposed no new death sentences in 2025. Twenty-three had abolished capital punishment, while 19 retained it in law but recorded zero new sentences. The [death penalty by state](/rankings/law/death-penalty-by-state) page separates those two legal groups."
      - "Georgia, Oklahoma, South Carolina, and Tennessee were among the states with zero new sentences even though each carried out at least one execution during 2025. A state can therefore have no new entries into death row while completing sentences imposed years earlier."

