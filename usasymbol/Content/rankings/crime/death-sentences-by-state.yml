faq:
  - question: "Which state had the most new death sentences in 2025?"
    answer: "California and Florida tied for the most with 5 each. Three of California's sentences came from Riverside County, while Florida's five came from Highlands, Charlotte, Hamilton, St. Lucie, and Seminole counties."
  - question: "How many new death sentences did California impose in 2025?"
    answer: "California imposed 5. Riverside County accounted for 3, and Sacramento and Stanislaus counties accounted for one each."
  - question: "How many new death sentences did Florida impose in 2025?"
    answer: "Florida imposed 5 across five counties. Three followed non-unanimous jury decisions under the state's 8 to 4 threshold in effect during the year."
  - question: "How many new death sentences did Alabama impose in 2025?"
    answer: "Alabama imposed 4, the third-highest state total. All four followed non-unanimous jury decisions."
  - question: "How many new death sentences did Texas impose in 2025?"
    answer: "Texas imposed 3. Two cases came from Harris County and one came from Tarrant County."
  - question: "How many states imposed no new death sentences in 2025?"
    answer: "Forty-two states imposed none. That total includes 23 states without the death penalty and 19 states where capital punishment remained legally available."

