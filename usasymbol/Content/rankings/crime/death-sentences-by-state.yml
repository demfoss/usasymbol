page:
  h1: "Death Sentences by State"
  quick_answer:
    - "New death sentences in 2025 were highest in California and Florida, with 5 each. Riverside County produced 3 of California's sentences, while Florida's came from five separate counties."
    - "Alabama imposed 4 new death sentences. Every one followed a non-unanimous jury decision, a procedure Alabama permits in capital cases."
    - "Forty-two states imposed no new death sentences. That group included all 23 states without capital punishment and 19 states that retained it but imposed none during the year."
  methodology: "Death Penalty Information Center figures cover sentences formally imposed in 2025. They count new sentences only and exclude a new sentencing proceeding for someone whose earlier death sentence was overturned."
  sources:
    - name: "Death Penalty Information Center. 2025 Death Sentences by Name, Race, and County"
