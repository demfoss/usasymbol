faq:
  - question: "Which car model is stolen most often, by state?"
    answer: "The Hyundai Elantra is the most stolen car model in 16 states, more than any other single model, including New Mexico, Colorado, and Nevada."

  - question: "What is the most stolen car in California?"
    answer: "The Honda Accord. California also has the highest overall motor vehicle theft rate in this table, 463 per 100,000 residents."

  - question: "What is the most stolen car in Texas?"
    answer: "The Chevrolet Silverado 1500, in a state with a theft rate of 316 per 100,000 residents, eighth highest in this table."

  - question: "Why is the Hyundai Elantra stolen so often?"
    answer: "A social media trend that went viral on TikTok exposed a security flaw in Hyundai's ignition system, showing how to start the car without a key. The Elantra led the nation with 21,732 thefts in 2025."

  - question: "What is the most stolen car in New York?"
    answer: "The Honda CR-V. New York's theft rate is 143 per 100,000 residents, below the midpoint of this table."

  - question: "What is the most stolen car in the entire country?"
    answer: "The Hyundai Elantra, with 21,732 thefts in 2025. The Honda Accord ranked second at 17,797, and the Hyundai Sonata ranked third at 17,687."

