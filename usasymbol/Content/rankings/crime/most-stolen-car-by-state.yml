page:
  h1: "Most Stolen Car by State"

  quick_answer:
    - "The Hyundai Elantra is the most stolen car model in 16 states, more than any other model, and led the nation with 21,732 thefts in 2025."
    - "The Honda Accord tops California, the state with the highest overall theft rate in this table at 463 per 100,000 residents, plus six others: Delaware, Louisiana, New Jersey, Pennsylvania, Rhode Island, and South Carolina."
    - "Pickup trucks lead in 15 states. The Chevrolet Silverado or Silverado 1500 tops 12 of them, tied with the Ford F-150 in Arkansas, while the F-150 leads outright in Idaho, Montana, and South Dakota."

  methodology: "Most-stolen model per state and the national top-10 list come from FinanceBuzz's April 2026 compilation of National Insurance Crime Bureau 2025 theft data. Rows are ordered by each state's 2024 motor vehicle theft rate per 100,000 residents, from the NICB Hot Spots report, since per-model theft counts are not published by state."

