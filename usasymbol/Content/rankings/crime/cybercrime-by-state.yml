page:
  h1: "Cybercrime by State"

  quick_answer:
    - "Internet crime complaints were highest in California in 2024, with 96,265 complaints reported to the FBI's Internet Crime Complaint Center, more than any other state."
    - "Texas ranks second at 62,347 complaints, and Florida third at 52,191. All three states also lead the country in reported dollar losses."
    - "North Dakota had the fewest complaints at 885, and Vermont the second fewest at 937, both far below the national leaders."

  methodology: "Figures come from the FBI's Internet Crime Complaint Center (IC3) 2024 Annual Report, covering complaints filed by state residents in 2024. Complaint counts do not necessarily match victim counts, and territories are excluded here."

  sources:
