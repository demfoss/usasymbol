sections:
  - id: "states-with-the-most-internet-crime-complaints"
    icon: "fa-solid fa-chart-line"
    title: "States With the Most Internet Crime Complaints"
    paragraphs:
      - "California logged 96,265 internet crime complaints in 2024, well above second-place Texas at 62,347. Florida is third at 52,191, and New York fourth at 36,468."
      - "Pennsylvania rounds out the top five with 27,838 complaints. All five states also rank among the top for total reported dollar losses."

  - id: "states-with-the-highest-cybercrime-losses"
    icon: "fa-solid fa-sack-dollar"
    title: "States With the Highest Cybercrime Losses"
    paragraphs:
      - "California reported $2.54 billion in cybercrime losses in 2024, the most of any state, followed by Texas at $1.35 billion and Florida at $1.07 billion. New Jersey ranks sixth in losses at $434.9 million despite ranking 15th in complaint volume."
      - "Nevada shows a similar gap: 10,716 complaints, ranking 20th, but $268.8 million in losses, ranking 16th, a sign of higher average losses per complaint."

  - id: "states-with-the-fewest-internet-crime-complaints"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Fewest Internet Crime Complaints"
    paragraphs:
      - "North Dakota logged the fewest complaints in 2024 at 885, followed by Vermont at 937 and South Dakota at 1,298. Wyoming and Rhode Island round out the bottom five, at 1,377 and 1,642."
      - "Every state in the bottom five reported losses under $45 million, a fraction of California's single-state total of $2.54 billion."

faq:
  - question: "Which state has the most cybercrime complaints?"
    answer: "California has the most internet crime complaints, at 96,265 in 2024, with $2.54 billion in reported losses. Texas ranks second at 62,347 complaints."

  - question: "Which state has the highest cybercrime losses?"
    answer: "California reported the highest losses at $2.54 billion in 2024, followed by Texas at $1.35 billion and Florida at $1.07 billion."

  - question: "Which state has the fewest cybercrime complaints?"
    answer: "North Dakota has the fewest internet crime complaints, at 885 in 2024. Vermont follows at 937."

  - question: "How much did cybercrime cost the United States in 2024?"
    answer: "The FBI's Internet Crime Complaint Center reported more than $16 billion in total losses across 859,532 complaints nationwide in 2024, a 33% increase in losses from 2023."

  - question: "What is the cybercrime complaint total in Texas?"
    answer: "Texas logged 62,347 internet crime complaints in 2024, ranking second nationally, with $1.35 billion in reported losses."

