sections:
- id: states-that-still-apply-a-different-standard-to-spousal-rape
  icon: fa-solid fa-scale-unbalanced
  title: States That Still Apply a Different Standard to Spousal Rape
  paragraphs:
  - South Carolina requires aggravated force or a weapon for a spousal sexual battery charge, plus a report to law enforcement within 30 days, neither required in non-spousal cases. Idaho requires the victim to have resisted and been overcome by force.
  - Nevada and Mississippi both require proof of force in spousal cases that non-spousal rape charges do not. Virginia allows a spouse to avoid prosecution by completing court-ordered counseling, and Connecticut charges spousal assault as a lesser Class B felony.
- id: states-that-recently-closed-their-spousal-rape-exemption
  icon: fa-solid fa-gavel
  title: States That Recently Closed Their Spousal Rape Exemption
  paragraphs:
  - Ohio and Oklahoma both closed their exemptions in 2024. Gov. Mike DeWine signed Ohio's repeal in May 2024, and an Oklahoma law removing the separate spousal definition took effect June 14, 2024.
  - Maryland removed its spousal defense in October 2023, and Rhode Island closed its remaining exemptions in July 2021. Minnesota was earlier still, repealing its exemption in May 2019.
faq:
- question: Is marital rape a crime in all 50 states?
  answer: Yes. Marital rape has been a crime in every state since North Carolina closed the last full exemption in 1993. 8 states still apply a narrower legal standard to spousal cases than to non-spousal rape.
- question: Which states still have a spousal rape exemption or loophole?
  answer: California, Connecticut, Idaho, Michigan, Mississippi, Nevada, South Carolina, and Virginia each apply a different force, consent, or reporting standard to spousal rape than to non-spousal rape.
- question: What is the marital rape loophole in South Carolina?
  answer: South Carolina requires aggravated force or a weapon for a spousal sexual battery charge, along with a report to law enforcement within 30 days. Neither requirement applies to non-spousal rape charges.
- question: When did Ohio close its marital rape loophole?
  answer: Gov. Mike DeWine signed a repeal of Ohio's spousal rape exemption in May 2024, closing a loophole that had let a spouse avoid charges for drugging or assaulting an unconscious partner.
- question: Does Virginia still have a marital rape exemption?
  answer: Virginia allows a spouse charged with sexual assault to avoid prosecution by completing court-ordered counseling or therapy, an option not available to a non-spousal defendant.
