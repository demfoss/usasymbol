page:
  h1: Marital Rape Laws by State
  quick_answer:
  - Marital rape laws by state show the crime has been illegal nationwide since North Carolina closed the last full exemption in 1993, but 8 states still apply a narrower legal standard to spousal rape than to non-spousal rape.
  - South Carolina requires aggravated force or a weapon for a spousal charge and a 30-day reporting window, while Nevada and Mississippi require proof of force that ordinary rape charges do not. Virginia allows a spouse to avoid prosecution by completing counseling.
  - Ohio and Oklahoma both closed their spousal exemptions in 2024, and Maryland did so in 2023, leaving 42 states with full legal parity between spousal and non-spousal rape charges.
  methodology: Status reflects current state penal code and case law defining rape and spousal sexual assault as of 2026, cross-checked against recent state legislative repeals through 2024. A state is marked as retaining a distinction only where its statute currently applies a different force, consent, or reporting standard to spouses.
