sections:
- id: states-with-the-largest-prison-populations
  icon: fa-solid fa-building-shield
  title: States With the Largest Prison Populations
  paragraphs:
  - Texas holds 149,264 people under state prison jurisdiction, the most of any state and well above California's 95,962 in second place. Florida ranks third at 87,207.
  - Georgia is fourth at 50,425, and Ohio is fifth at 46,530. Texas alone accounts for more than 13% of the entire U.S. state prison population.
- id: states-with-the-fastest-growing-prison-populations
  icon: fa-solid fa-arrow-trend-up
  title: States With the Fastest-Growing Prison Populations
  paragraphs:
  - New Mexico posted the largest percentage increase of any state, up 12.4% from 2022 to 2023, followed by Maine at 11.8%. Idaho grew 7.9%, and Wisconsin grew 7.4%.
  - New Jersey saw the sharpest decline at negative 7.8%, followed by Alaska at negative 6.3% and Hawaii at negative 5%. Texas still added the most people in raw terms, up 9,633 from 2022 to 2023.
