page:
  h1: Prisons by State
  quick_answer:
  - Texas has the largest state prison population of any state at 149,264 people under jurisdiction at yearend 2023, according to the Bureau of Justice Statistics.
  - California ranks second at 95,962, followed by Florida at 87,207 and Georgia at 50,425. All three trail Texas by wide margins.
  - Vermont has the smallest state prison population at 1,334, followed by Maine at 1,873 and North Dakota at 1,899. New Mexico posted the largest year-over-year increase, up 12.4% from 2022 to 2023.
  methodology: Counts are total persons under the jurisdiction of state correctional authorities at yearend 2023, regardless of where held, from BJS's 'Prisoners in 2023' statistical tables. Federal Bureau of Prisons and D.C. figures are excluded.
  sources:
  - name: Bureau of Justice Statistics, Prisoners in 2023 – Statistical Tables
    url: https://bjs.ojp.gov/library/publications/prisoners-2023-statistical-tables
    description: Table 2, Prisoners under the jurisdiction of state or federal correctional authorities, by sex and jurisdiction, 2022 and 2023
