faq:
- question: Which state has the most prisoners?
  answer: Texas has the largest state prison population at 149,264 people under jurisdiction at yearend 2023. California ranks second at 95,962.
- question: Which state has the fewest prisoners?
  answer: Vermont has the smallest state prison population at 1,334, followed by Maine at 1,873 and North Dakota at 1,899.
- question: How many people are in Texas state prisons?
  answer: Texas held 149,264 people under state prison jurisdiction at yearend 2023, an increase of 9,633 from 2022, the largest raw increase of any state.
- question: Which state's prison population grew the fastest?
  answer: New Mexico grew the fastest, up 12.4% from 2022 to 2023. Maine followed at 11.8%, and South Dakota grew 9.3%.
- question: Which state's prison population shrank the most?
  answer: New Jersey's prison population fell 7.8% from 2022 to 2023, the largest percentage decline of any state. Alaska fell 6.3%, and Hawaii fell 5%.
