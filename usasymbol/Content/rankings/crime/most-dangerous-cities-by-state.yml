page:
  h1: Most Dangerous City in Each State
  quick_answer:
  - Memphis, Tennessee has the highest violent crime rate of any state's most dangerous city at 2,508.0 per 100,000 residents, among cities with at least 25,000 people.
  - Saginaw, Michigan ranks second at 2,210.8, followed by Oakland, California at 1,925.3 and Little Rock, Arkansas at 1,672.5.
  - Portland, Maine has the lowest rate among the 49 states with reporting data, at 266.9 per 100,000. Hawaii is excluded because its cities have not transitioned to FBI incident-based reporting.
  methodology: For each state, the city with at least 25,000 residents and the highest FBI-reported violent crime rate per 100,000 was selected, using the most recent 12-month data submitted to the FBI Crime Data Explorer. Hawaii is excluded for lack of reporting.
  sources:
  - name: FBI Crime Data Explorer
    url: https://cde.ucr.cjis.gov/LATEST/webapp/#/pages/explorer/crime/crime-trend
    description: Agency-level violent crime counts and population data, aggregated by CrimeByCity from FBI submissions
  - name: CrimeByCity, Most Dangerous Cities by State
    url: https://crimebycity.com/most-dangerous-cities
    description: State-by-state city violent crime rate tables compiled from FBI Uniform Crime Reporting data
