sections:
- id: states-with-the-most-dangerous-city-leaders
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest-Crime City Leaders
  paragraphs:
  - Memphis posts 2,508.0 violent crimes per 100,000 residents, the highest rate of any state's most dangerous city. Saginaw, Michigan follows at 2,210.8, despite a population of just 42,880.
  - Oakland ranks third at 1,925.3, and Little Rock is fourth at 1,672.5. Baltimore rounds out the top five at 1,606.2.
- id: states-with-the-lowest-crime-city-leaders
  icon: fa-solid fa-arrow-trend-down
  title: States Where the Most Dangerous City Still Ranks Low
  paragraphs:
  - Portland, Maine has the lowest rate among all state leaders at 266.9 per 100,000, even though it tops its own state's list. Pawtucket, Rhode Island is second-lowest at 307.6.
  - Southaven, Mississippi follows at 314.6, and Cheyenne, Wyoming is fifth-lowest at 328.5. Each still ranks first within its own state.
