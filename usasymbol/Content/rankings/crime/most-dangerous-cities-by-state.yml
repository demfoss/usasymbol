faq:
- question: What is the most dangerous city in the United States?
  answer: Memphis, Tennessee has the highest violent crime rate among cities with 25,000 or more residents, at 2,508.0 per 100,000, the highest of any state's leading city.
- question: What is the most dangerous city in Texas?
  answer: Beaumont has the highest violent crime rate among Texas cities with 25,000 or more residents, at 1,137.3 per 100,000, ranking 16th nationally among state leaders.
- question: What is the most dangerous city in California?
  answer: Oakland has the highest violent crime rate in California at 1,925.3 per 100,000, the third-highest rate among all state leaders.
- question: Why isn't there a most dangerous city listed for Hawaii?
  answer: Hawaii's law enforcement agencies have not transitioned to the FBI's incident-based reporting system, so no comparable violent crime rate is available for its cities.
- question: Which state's most dangerous city has the lowest crime rate?
  answer: Portland, Maine has the lowest violent crime rate among all 49 state leaders at 266.9 per 100,000, well below Memphis's 2,508.0.
