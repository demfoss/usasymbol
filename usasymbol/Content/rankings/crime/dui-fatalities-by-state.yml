sections:
  - id: "states-with-the-most-dui-fatalities"
    icon: "fa-solid fa-chart-line"
    title: "States With the Most DUI Fatalities"
    paragraphs:
      - "Texas recorded 1,676 alcohol-impaired driving deaths in 2024, more than any other state, and 40% of its total traffic fatalities. California follows at 1,311 deaths, or 34% of its total."
      - "Florida is third at 769 alcohol-impaired deaths, though that is only 24% of its total fatalities. North Carolina and Ohio round out the top five, at 449 and 424 deaths."

  - id: "states-with-the-highest-share-of-alcohol-related-deaths"
    icon: "fa-solid fa-percent"
    title: "States Where DUI Makes Up the Largest Share of Traffic Deaths"
    paragraphs:
      - "Vermont has the highest share of any state, with alcohol impairment linked to 41% of its traffic deaths. Texas and South Carolina tie for second at 40% each, despite Texas recording nearly four times as many raw deaths."
      - "Ohio and Montana both post a 37% share. Rhode Island and Alaska share the lowest rate at 19%, less than half the national share of 30%."

faq:
  - question: "Which state has the most DUI fatalities?"
    answer: "Texas has the most alcohol-impaired driving deaths, at 1,676 in 2024. California follows at 1,311, and Florida at 769."

  - question: "Which state has the fewest DUI fatalities?"
    answer: "Alaska has the fewest alcohol-impaired driving deaths, at 13 in 2024. Vermont is second-fewest at 24, and Rhode Island third at 19 deaths but the lowest share of total fatalities."

  - question: "What percent of traffic deaths in Texas involve alcohol?"
    answer: "40% of Texas traffic fatalities in 2024 involved an alcohol-impaired driver, tied with South Carolina for the highest share of any state."

  - question: "How is DUI fatality data different from total traffic fatality data?"
    answer: "DUI fatalities count only the subset of crash deaths involving a driver with a blood alcohol concentration of .08 or higher. Nationally, alcohol-impaired crashes accounted for 30% of all 39,254 traffic deaths in 2024."

  - question: "Which state has the lowest share of alcohol-related traffic deaths?"
    answer: "Rhode Island and Alaska share the lowest rate, with alcohol impairment linked to 19% of traffic deaths in each state, compared with the national share of 30%."

