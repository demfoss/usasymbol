page:
  h1: "DUI Fatalities by State"

  quick_answer:
    - "Alcohol-impaired driving fatalities were highest in Texas in 2024, with 1,676 deaths, the most of any state, according to NHTSA's FARS estimates."
    - "California recorded the second-most alcohol-impaired deaths at 1,311, followed by Florida at 769. Texas and South Carolina share the highest share of total fatalities tied to alcohol, both at 40%."
    - "Alaska recorded the fewest alcohol-impaired deaths at 13. Rhode Island recorded the lowest share of total fatalities linked to alcohol, at 19%."

  methodology: "Figures reflect NHTSA's State Alcohol-Impaired-Driving Estimates for 2024, which count fatalities in crashes involving a driver with a blood alcohol concentration of .08 or higher. This is a subset of each state's total traffic fatalities, not the full crash total."

