sections:
- id: states-with-the-highest-burglary-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Burglary Rate
  paragraphs:
  - New Mexico leads the table at 536.5 burglaries per 100,000 residents, well above Louisiana's 414.0 in second place. Oklahoma follows closely at 407.8, and Washington rounds out the top four at 390.6.
  - Nevada and Arkansas sit fifth and sixth at 363.3 and 345.8. Colorado is the last state above 340, closing out a group of seven states that all top 300 burglaries per 100,000.
- id: states-with-the-lowest-burglary-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Burglary Rate
  paragraphs:
  - New Hampshire has the lowest burglary rate in the table at 48.7 per 100,000, less than half of Rhode Island's second-lowest 95.6. Maine follows at 99.3, the only other state under 100.
  - Virginia and Idaho sit near 110, at 108.6 and 113.2. Connecticut is close behind at 113.5, all three well below the national pattern set by the top-ranked states.
faq:
- question: What state has the highest burglary rate?
  answer: New Mexico has the highest burglary rate at 536.5 per 100,000 residents in 2024, well ahead of Louisiana at 414.0.
- question: What state has the lowest burglary rate?
  answer: New Hampshire has the lowest burglary rate at 48.7 per 100,000. Rhode Island follows at 95.6, and Maine is third-lowest at 99.3.
- question: What is the burglary rate in Texas?
  answer: Texas has a burglary rate of 270.4 per 100,000, ranking 14th in the table.
- question: Which state has the highest burglary rate per capita?
  answer: New Mexico ranks first per capita at 536.5 burglaries per 100,000 residents, ahead of Louisiana at 414.0 and Oklahoma at 407.8.
- question: What is the burglary rate in California?
  answer: California has a burglary rate of 297.8 per 100,000, ranking 10th among the states with reported 2024 data.
