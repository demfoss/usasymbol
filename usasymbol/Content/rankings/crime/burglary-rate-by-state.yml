page:
  h1: Burglary Rate by State
  quick_answer:
  - New Mexico has the highest burglary rate in the nation at 536.5 per 100,000 residents in 2024, according to Bureau of Justice Statistics data.
  - Louisiana ranks second at 414.0, followed closely by Oklahoma at 407.8 and Washington at 390.6. All three sit above 380 per 100,000.
  - New Hampshire has the lowest burglary rate at 48.7 per 100,000, less than a tenth of New Mexico's rate. Rhode Island is second-lowest at 95.6.
  methodology: Rates reflect burglary offenses per 100,000 residents reported to the FBI's NIBRS Estimation Program, as published in BJS Crime Known to Law Enforcement, 2024. Alaska, Arizona, Hawaii, Mississippi, and Pennsylvania are excluded due to incomplete 2024 reporting.
  sources:
  - name: Bureau of Justice Statistics — Crime Known to Law Enforcement, 2024
    url: https://bjs.ojp.gov/library/publications/crime-known-law-enforcement-2024
    description: State-level burglary offense rate per 100,000 population, based on FBI NIBRS Estimation Program data for 2024
