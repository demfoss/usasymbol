sections:
- id: safest-states-by-violent-crime-rate
  icon: fa-solid fa-shield-halved
  title: Why Maine Is the Safest State
  paragraphs:
  - Maine records 100.1 violent crimes per 100,000 residents, the lowest rate in the country. Violent crime clusters in big cities, and Maine has none, since its largest city, Portland, has fewer than 70,000 residents. Most of the state is forest, farmland, and small towns.
  - Alaska sits at the other end with 724.1, and its problem is not big cities. Many villages are reachable only by air or boat and have little or no local police presence, and Alaska reports some of the nation's highest rates of sexual assault. New Mexico is next at 717.1, as the full list of the [most dangerous states](/rankings/crime/most-dangerous-states) shows.
