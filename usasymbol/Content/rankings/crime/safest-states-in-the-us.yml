page:
  h1: Safest States in the US
  quick_answer:
  - Maine is the safest state in the US, with a violent crime rate of 100.1 per 100,000 residents. Its largest city, Portland, has fewer than 70,000 people, so the state has no big urban core.
  - Alaska has the highest rate at 724.1, followed by New Mexico at 717.1. Many Alaska villages are far from any road and have little local policing, and the state reports some of the nation's highest rates of sexual assault.
  - Connecticut and Rhode Island are among the most crowded states in the country, yet they rank third and fourth. Massachusetts, their New England neighbor, lands 25th at 314.7.
  methodology: FBI Uniform Crime Reporting Program estimates for 2024, counting murder, rape, robbery, and aggravated assault per 100,000 residents. States are ranked from the lowest rate to the highest.
  sources:
  - name: FBI Crime Data Explorer — Estimated Crimes in the United States
    url: https://cde.ucr.cjis.gov/
    description: State-level violent crime rate per 100,000 population for 2024
