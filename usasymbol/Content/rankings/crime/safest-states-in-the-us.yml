- id: safest-states-in-new-england
  icon: fa-solid fa-tree
  title: Safest New England States
  paragraphs:
  - Maine, New Hampshire, Connecticut, and Rhode Island take the top four places, with rates from 100.1 to 153.6. Connecticut and Rhode Island are among the most densely populated states, so crowding alone does not push a rate up.
  - Vermont, one of the most rural states, ranks only 11th at 219.1. Massachusetts, home to Boston, is 25th at 314.7, which puts the region's safest and busiest states more than 200 points apart.
- id: states-with-a-violent-crime-rate-below-the-national-average
  icon: fa-solid fa-chart-line
  title: States Below the National Violent Crime Rate
  paragraphs:
  - Twenty-nine states fall below the national rate of 359.1 per 100,000, and Oregon at 331.0 is the last of them. Wyoming, the least populous state in the country, ranks fifth at 203.4.
  - Hawaii and New Jersey tie for eighth at 217.7. A chain of Pacific islands and the most densely populated state in the nation end up with the same rate. Murder is only one part of the total, and the [murder rate by state](/rankings/crime/murder-rate-by-state) follows a different order.
faq:
- question: What is the safest state in the US?
  answer: Maine is the safest state. New Hampshire is second at 110.1, and those two are the only states under 120 violent crimes per 100,000 residents.
- question: Which state has the highest violent crime rate?
  answer: Alaska, at 724.1 per 100,000 residents. New Mexico follows at 717.1 and Tennessee at 592.3.
- question: Is Vermont a safe state?
  answer: Vermont ranks 11th at 219.1, well below the national rate of 359.1. Maine and New Hampshire both have lower rates.
- question: What is the violent crime rate in New York?
  answer: New York has a rate of 380.2 per 100,000, which ranks 33rd and sits just above the national rate of 359.1.
- question: What is the national violent crime rate?
  answer: 359.1 per 100,000 residents in 2024. Twenty-nine states fall below it.
- question: What is the violent crime rate in California?
  answer: California has a rate of 486.0 per 100,000, ranking 45th. Texas is 34th at 389.4 and Florida 20th at 267.1.
