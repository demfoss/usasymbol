          total_registered: "28,164"
          offenders_per_100k: "268"
        - state: "Wisconsin"
          total_registered: "27,272"
          offenders_per_100k: "463"
    paragraphs:
      - "Texas has the most registered sex offenders of any state at 76,210, though its rate of 261 per 100,000 ranks 25th. California holds the second-most at 61,015, with a comparatively low rate of 155 per 100,000, reflecting its large population."
      - "Michigan is the only state in the top 6 for raw count that also ranks in the top 10 for rate, with 40,691 registrants and 405 per 100,000."

