faq:
  - question: "Which state has the highest rate of registered sex offenders?"
    answer: "Oregon has the highest rate at 795 registered offenders per 100,000 residents. State police attribute this to 26 registerable offenses under Oregon law and a lifetime registration requirement that is hard to have lifted."

  - question: "Which state has the lowest rate of registered sex offenders?"
    answer: "New Jersey has the lowest rate at 51 per 100,000. Massachusetts is second-lowest at 80, and Maryland is third-lowest at 118."

  - question: "Which state has the most registered sex offenders overall?"
    answer: "Texas has the most in raw numbers, with 76,210 registered offenders. Its per-capita rate of 261 per 100,000 ranks 25th, well below Oregon's 795."

  - question: "Why does Oregon have so many registered sex offenders?"
    answer: "Oregon State Police cite 26 registerable offenses, more than most states track, along with a lifetime registration requirement that offenders rarely succeed in lifting. That keeps Oregon's registry rate two and a half times the national figure."

  - question: "How many registered sex offenders are in California?"
    answer: "California has 61,015 registered sex offenders, the second-most of any state, but its rate of 155 per 100,000 ranks 43rd due to the state's large population."

