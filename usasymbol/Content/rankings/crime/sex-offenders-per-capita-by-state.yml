page:
  h1: "Sex Offenders Per Capita by State"

  quick_answer:
    - "Registered sex offenders per 100,000 residents are highest in Oregon, at 795, the highest rate of any state."
    - "Arkansas ranks second at 645 per 100,000, followed by Alaska at 478 and South Dakota at 475. Wisconsin rounds out the top five at 463."
    - "New Jersey has the lowest rate at 51 per 100,000, well below Massachusetts's second-lowest 80. Texas has the most registered offenders in raw terms, at 76,210."

  methodology: "Figures show registered sex offenders per 100,000 residents as of August 2024, compiled directly from official state sex offender registries. NCMEC discontinued its national biannual state-by-state survey, so this ranking relies on individual state registry counts."

  sources:
    - name: "State Sex Offender Registries, compiled by SafeHome.org"
      url: "https://www.safehome.org/data/registered-sex-offender-stats/"
      description: "State-by-state registered sex offender counts and population-adjusted rates, compiled directly from each state's official public sex offender registry as of August 2024."
