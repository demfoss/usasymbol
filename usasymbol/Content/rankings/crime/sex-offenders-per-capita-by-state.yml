sections:
  - id: "why-oregon-has-the-highest-sex-offender-registry-rate"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Oregon Has the Highest Sex Offender Registry Rate"
    paragraphs:
      - "Oregon's rate of 795 registered offenders per 100,000 residents traces to state policy, not just crime volume. Oregon State Police point to 26 registerable offenses under state law, more than most states track, combined with lifetime registration that is difficult to have lifted."
      - "That combination keeps offenders on Oregon's registry for decades after conviction, unlike states that remove lower-tier offenders after a set number of years. Arkansas, the second-highest state at 645 per 100,000, is still 150 points below Oregon."

  - id: "states-with-the-most-registered-sex-offenders"
    icon: "fa-solid fa-list-ol"
    title: "States With the Most Registered Sex Offenders"
    table:
      columns:
        state: "State"
