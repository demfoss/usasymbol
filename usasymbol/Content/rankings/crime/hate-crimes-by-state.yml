page:
  h1: Hate Crimes by State
  quick_answer:
  - Hate crime incidents reported to the FBI in 2024 were highest in California, with 2,365 incidents, the most of any state.
  - New Jersey ranks second at 1,325 incidents, and New York third at 1,048. No other state topped 600.
  - Montana reported the fewest hate crime incidents at 13, just below Arkansas's 16 and Delaware's 20.
  methodology: Counts are total hate crime incidents reported by participating law enforcement agencies to the FBI's Uniform Crime Reporting Program for 2024, covering 95.1% of the U.S. population. Mississippi did not report usable state-level data and is omitted.
