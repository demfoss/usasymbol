sections:
- id: states-with-the-most-hate-crime-incidents
  icon: fa-solid fa-chart-line
  title: States With the Most Hate Crime Incidents
  paragraphs:
  - California reported 2,365 hate crime incidents in 2024, nearly double second-place New Jersey's 1,325. New York follows at 1,048, the only other state above 600.
  - Washington and Michigan round out the top five, at 578 and 563 incidents. Massachusetts is sixth at 539, and Texas seventh at 515.
- id: why-california-leads-in-hate-crime-reports
  icon: fa-solid fa-circle-question
  title: Why California Leads in Hate Crime Reports
  paragraphs:
  - California is the most populous U.S. state, and its total of 2,365 incidents in 2024 reflects a large base of reporting law enforcement agencies. New Jersey, far smaller in population, still logged 1,325 incidents, the second-highest total.
- id: states-with-the-fewest-hate-crime-incidents
  icon: fa-solid fa-arrow-trend-down
  title: States With the Fewest Hate Crime Incidents
  paragraphs:
  - Montana reported the fewest hate crime incidents at 13, just below Arkansas's 16 and Delaware's 20. North Dakota logged 23, and Rhode Island 24.
  - Every state in the bottom five reported fewer than 25 incidents for all of 2024, a fraction of California's single-state total of 2,365.
faq:
- question: Which state has the most hate crime incidents?
  answer: California reported the most hate crime incidents in 2024, at 2,365. New Jersey ranked second at 1,325, and New York third at 1,048.
- question: Which state has the fewest hate crime incidents?
  answer: Montana reported the fewest hate crime incidents in 2024, at 13. Arkansas followed at 16, and Delaware at 20.
- question: How many hate crime incidents did Texas report in 2024?
  answer: Texas reported 515 hate crime incidents in 2024, ranking seventh nationally.
- question: How many hate crimes were reported nationwide in 2024?
  answer: The FBI's Uniform Crime Reporting Program logged 11,679 hate crime incidents nationwide in 2024, the second-highest total since the FBI began collecting hate crime data in 1991.
- question: Why does Mississippi not appear in hate crime state data?
  answer: Mississippi did not report usable state-level hate crime data for 2024, so it is omitted from this ranking rather than shown with a placeholder value.
