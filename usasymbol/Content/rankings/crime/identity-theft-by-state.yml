sections:
- id: states-with-the-highest-identity-theft-rates
  icon: fa-solid fa-chart-line
  title: States With the Highest Identity Theft Rates
  paragraphs:
  - Florida logs 457 identity theft reports per 100,000 residents, the highest rate in the country. Georgia follows at 438, and Nevada is third at 404.
  - Texas rounds out the top four at 384 reports per 100,000, ahead of Delaware at 359 and Massachusetts at 351. California, the most populous state, ranks seventh at 350.
- id: states-with-the-lowest-identity-theft-rates
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Identity Theft Rates
  paragraphs:
  - South Dakota has the lowest rate at 94 reports per 100,000, just below Vermont's 97. Alaska is third-lowest at 106, followed by West Virginia at 110.
  - North Dakota rounds out the bottom five at 114 reports per 100,000. Every one of these five states sits below a quarter of Florida's top rate of 457.
faq:
- question: Which state has the highest identity theft rate?
  answer: Florida has the highest rate, at 457 identity theft reports per 100,000 residents in 2024. Georgia is second at 438, and Nevada is third at 404.
- question: Which state has the lowest identity theft rate?
  answer: South Dakota has the lowest rate, at 94 reports per 100,000 residents. Vermont is second-lowest at 97.
- question: What is the identity theft rate in Georgia?
  answer: Georgia logs 438 identity theft reports per 100,000 residents, the second-highest rate of any state, behind only Florida.
- question: What is the identity theft rate in Texas?
  answer: Texas logs 384 identity theft reports per 100,000 residents, ranking fourth nationally, behind Florida, Georgia, and Nevada.
- question: How does California compare to other states for identity theft?
  answer: California logs 350 identity theft reports per 100,000 residents, ranking seventh nationally despite being the most populous state.
