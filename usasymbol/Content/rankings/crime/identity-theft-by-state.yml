page:
  h1: Identity Theft by State
  quick_answer:
  - Identity theft reports per 100,000 residents are highest in Florida, at 457 in 2024, according to the FTC's Consumer Sentinel Network.
  - Georgia ranks second at 438 reports per 100,000, followed by Nevada at 404 and Texas at 384. All four states sit well above the mid-table range near 200.
  - South Dakota has the lowest rate at 94 reports per 100,000, just below Vermont's 97. Both are roughly one-fifth of Florida's rate.
  methodology: Rates reflect identity theft reports per 100,000 residents submitted to the FTC's Consumer Sentinel Network in 2024, using 2023 Census population estimates as the denominator.
  sources:
  - name: Federal Trade Commission — Consumer Sentinel Network Data Book 2024
    url: https://www.ftc.gov/reports/consumer-sentinel-network-data-book-2024
    description: Official FTC annual report tallying fraud and identity theft reports submitted to the Consumer Sentinel Network and IdentityTheft.gov in 2024.
  - name: WalletHub — Identity Theft Statistics
    url: https://wallethub.com/edu/identity-theft-statistics/131472
    description: State-by-state compilation of the FTC Consumer Sentinel Network Data Book 2024 identity theft reports per 100,000 residents; used here because the FTC's own PDF appendix does not publish a clean per-state table.
