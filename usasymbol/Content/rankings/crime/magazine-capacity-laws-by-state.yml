page:
  h1: "Magazine Capacity Laws by State"

  quick_answer:
    - "13 states cap ammunition magazine capacity in 2026, with limits ranging from 10 to 17 rounds. Colorado allows 15 rounds and Delaware allows 17, the highest cap of any state with a limit."
    - "Eight states set the cap at 10 rounds: California, Connecticut, Maryland, Massachusetts, New Jersey, New York, Rhode Island, and Washington. Hawaii's 10-round limit applies to handguns only."
    - "Oregon and Virginia both passed magazine caps that remain blocked by court injunctions as of August 2026. Illinois and Vermont set separate limits for long guns and handguns, 10 rounds and 15 rounds respectively."

  methodology: "Status reflects state statutes and active court injunctions on record as of August 2026, based on Giffords Law Center and state legislative records. This page is for informational purposes only and does not constitute legal advice."

  sources:
    - name: "Giffords Law Center — Large-Capacity Magazines"
      url: "https://giffords.org/lawcenter/gun-laws/policy-areas/hardware-ammunition/large-capacity-magazines/"
      description: "State-by-state large-capacity magazine restrictions, round limits, and grandfather clauses"
    - name: "Colorado House Bill 13-1224"
      url: "https://cbi.colorado.gov/sites/cbi/files/HB%2013-1224-Signed.pdf"
      description: "Colorado's 15-round magazine cap, effective July 1, 2013"

