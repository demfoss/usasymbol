faq:
  - question: "Which states have magazine capacity limits?"
    answer: "13 states cap magazine capacity: California, Colorado, Connecticut, Delaware, Hawaii, Illinois, Maryland, Massachusetts, New Jersey, New York, Rhode Island, Vermont, and Washington. Oregon and Virginia passed caps that remain blocked by court injunctions."

  - question: "What is the maximum magazine capacity allowed in California?"
    answer: "California caps magazine capacity at 10 rounds for all firearms. The ban on sale and manufacture of larger magazines remains in effect after the Ninth Circuit's March 2025 ruling in Duncan v. Bonta."

  - question: "Which state allows the highest magazine capacity among states with a cap?"
    answer: "Delaware allows the highest limit at 17 rounds. Colorado is next at 15 rounds, followed by Illinois and Vermont, which allow 15 rounds for handguns but cap long guns at 10."

  - question: "Is Oregon's magazine capacity law in effect?"
    answer: "No. Oregon's 10-round cap, approved as Measure 114 in 2022, has been blocked by a state court injunction since 2022 and remains unenforced as of 2026."

  - question: "Does Virginia have a magazine capacity limit?"
    answer: "Virginia passed a 15-round cap set to take effect July 1, 2026, but a preliminary injunction issued June 25, 2026 blocks enforcement through at least December 31, 2026."

  - question: "How many states have no magazine capacity limit?"
    answer: "35 states set no magazine capacity limit, more than double the 13 states with an active cap."

