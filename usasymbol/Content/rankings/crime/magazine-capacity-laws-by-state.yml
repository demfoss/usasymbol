sections:
  - id: "states-with-magazine-capacity-limits"
    icon: "fa-solid fa-shield-halved"
    title: "States With Magazine Capacity Limits"
    paragraphs:
      - "13 states cap magazine capacity, with limits ranging from 10 to 17 rounds. Delaware allows the highest limit at 17 rounds. Colorado's cap sits at 15 rounds, while eight states, California, Connecticut, Maryland, Massachusetts, New Jersey, New York, Rhode Island, and Washington, set the limit at 10."
      - "Illinois and Vermont split their limits by firearm type: 10 rounds for long guns and 15 rounds for handguns. Hawaii's 10-round cap applies only to handguns, leaving long-gun magazines uncapped."

  - id: "why-oregon-and-virginia-caps-are-not-enforced"
    icon: "fa-solid fa-gavel"
    title: "Why Oregon and Virginia Magazine Caps Are Not Enforced"
    paragraphs:
      - "Oregon voters approved a 10-round cap under Measure 114 in 2022, but a state court injunction has blocked enforcement since that year, with litigation still active in state and federal court as of 2026."
      - "Virginia's 15-round cap was set to take effect July 1, 2026. A preliminary injunction issued June 25, 2026 blocks enforcement through at least December 31, 2026, leaving both states' caps on the books but not enforced."

