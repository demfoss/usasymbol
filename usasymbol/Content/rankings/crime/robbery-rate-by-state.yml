sections:
- id: states-with-the-highest-robbery-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Robbery Rate
  paragraphs:
  - Maryland posts the highest robbery rate in the table at 123.2 per 100,000 residents, ahead of California at 119.1. New York ranks third at 96.1, and Illinois follows at 90.2.
  - Alaska rounds out the top five at 82.0. Each of these five states sits at least 14 points above sixth-place Washington, which logs 67.5 robberies per 100,000.
- id: states-with-the-lowest-robbery-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Robbery Rate
  paragraphs:
  - Idaho has the lowest robbery rate in the table at 7.0 per 100,000, just under Wyoming's 7.1. West Virginia ranks third-lowest at 9.7.
  - Maine and New Hampshire round out the bottom five, at 11.0 and 12.6. All five states sit below one-tenth of Maryland's top rate of 123.2.
faq:
- question: Which state has the highest robbery rate?
  answer: Maryland has the highest robbery rate at 123.2 per 100,000 residents in 2024, ahead of California at 119.1.
- question: Which state has the lowest robbery rate?
  answer: Idaho has the lowest robbery rate at 7.0 per 100,000, just below Wyoming's 7.1.
- question: What is the robbery rate in Texas?
  answer: Texas has a robbery rate of 63.5 per 100,000, ranking ninth among the states.
- question: What is the robbery rate in California?
  answer: California has a robbery rate of 119.1 per 100,000, the second highest in the country behind Maryland.
- question: Which states have the same robbery rate?
  answer: Louisiana and Wisconsin tie at 39.4 per 100,000. Oklahoma and Florida tie at 38.2, and South Carolina and Kentucky tie at 35.1.
