page:
  h1: Robbery Rate by State
  quick_answer:
  - Maryland has the highest robbery rate in the nation at 123.2 per 100,000 residents in 2024, the highest of any state on record.
  - California ranks second at 119.1, and New York follows at 96.1. All three sit well above the national robbery rate of 60.6 per 100,000.
  - Idaho has the lowest robbery rate at 7.0 per 100,000, just below Wyoming's 7.1. Both are a fraction of Maryland's top figure.
  methodology: Rates reflect FBI Uniform Crime Reporting robbery offenses per 100,000 residents for 2024, as published through the FBI Crime Data Explorer.
