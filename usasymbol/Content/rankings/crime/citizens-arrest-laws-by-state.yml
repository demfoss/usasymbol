sections:
  - id: "why-georgia-narrowed-its-citizens-arrest-law"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Georgia Narrowed Its Citizen's Arrest Law"
    paragraphs:
      - "Georgia repealed O.C.G.A. 17-4-60 in 2021, ending a citizen's arrest statute that had stood since Reconstruction. The repeal followed the killing of Ahmaud Arbery, whose case cited the old law as a defense."
      - "House Bill 479 replaced the general statute with a narrow exception limited to merchants, restaurant staff, and similar employees detaining a suspected thief. Georgia was the first state to remove a citizen's arrest statute from its books entirely."

  - id: "states-that-have-repealed-or-banned-citizens-arrest"
    icon: "fa-solid fa-ban"
    title: "States That Have Repealed or Banned Citizen's Arrest"
    paragraphs:
      - "Delaware banned citizen's arrest outright on July 14, 2025, when Gov. Matt Meyer signed House Bill 153. The law prohibits arrest or detention by anyone without explicit statutory authority, making Delaware the only state with a full statutory ban."
      - "North Carolina never adopted a citizen's arrest statute. Under G.S. 15A-404, a private person may detain someone for an offense committed in their presence but must surrender that person to a law enforcement officer immediately."

  - id: "states-with-the-broadest-citizens-arrest-laws"
    icon: "fa-solid fa-hand"
    title: "States With the Broadest Citizen's Arrest Laws"
    paragraphs:
      - "Hawaii, Illinois, and Montana authorize arrest for any public offense, not just felonies or breaches of the peace. Illinois law, 725 ILCS 5/107-3, permits an arrest on reasonable grounds without requiring the offense to occur in the arresting person's presence."
      - "Most states, including California and Colorado, follow a two-tier rule: a misdemeanor arrest requires the offense to happen in the citizen's presence, while a felony arrest only requires reasonable cause that it occurred."

