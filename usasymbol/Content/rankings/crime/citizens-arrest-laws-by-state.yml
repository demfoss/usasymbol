faq:
  - question: "Is citizen's arrest legal in Georgia?"
    answer: "Not in the broad sense. Georgia repealed its general citizen's arrest statute in 2021. Only a narrow exception remains for merchants and employees detaining a suspected thief."

  - question: "Which states have banned citizen's arrest?"
    answer: "Delaware is the only state with a full statutory ban, enacted through House Bill 153 on July 14, 2025. Georgia repealed its general statute in 2021 but kept a merchant exception."

  - question: "Does North Carolina allow citizen's arrest?"
    answer: "No. North Carolina has no citizen's arrest statute. Under G.S. 15A-404, private citizens may only detain a person and must immediately surrender them to a law enforcement officer."

  - question: "Which states allow the broadest citizen's arrest powers?"
    answer: "Hawaii, Illinois, and Montana authorize arrest for any public offense, not just felonies. Illinois law does not even require the offense to occur in the arresting person's presence."

  - question: "Why did Georgia change its citizen's arrest law?"
    answer: "The 2021 repeal followed the killing of Ahmaud Arbery, whose case cited the old statute, O.C.G.A. 17-4-60, as a defense. Lawmakers replaced it with House Bill 479's narrow merchant exception."

  - question: "What is the citizen's arrest law in Texas?"
    answer: "Texas allows arrest for a breach of the peace or a felony committed in the arresting person's view, under Code of Criminal Procedure article 14.01."

