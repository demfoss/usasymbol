      description: "Full repeal of Georgia's former citizen's arrest statute, O.C.G.A. 17-4-60, and creation of a narrow merchant-detention exception"
    - name: "Delaware General Assembly — HB 153 (2025)"
      url: "https://legis.delaware.gov/BillDetail?LegislationId=142166"
      description: "Delaware law banning arrest or detention by any person without explicit statutory authority, signed July 14, 2025"
