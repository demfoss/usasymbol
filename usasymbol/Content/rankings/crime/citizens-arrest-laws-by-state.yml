page:
  h1: "Citizen's Arrest Laws by State"

  quick_answer:
    - "Georgia repealed its citizen's arrest statute entirely in 2021, replacing it with a narrow exception for merchants and employees detaining suspected shoplifters. The repeal followed the killing of Ahmaud Arbery, whose case cited the old law."
    - "Delaware banned citizen's arrest outright on July 14, 2025, when Gov. Matt Meyer signed House Bill 153. Delaware is the only state with a full statutory ban on the practice."
    - "North Carolina has no citizen's arrest statute. Private citizens there may only detain a person under G.S. 15A-404 and must immediately surrender them to a law enforcement officer."

  methodology: "Status reflects each state's current arrest statute as of August 2026, sourced from state legislative records and codified law. Categories group states by the scope of offense a private citizen may act on."

  sources:
    - name: "Georgia General Assembly — HB 479 (2021)"
