faq:
  - question: "Which state has the most exonerations?"
    answer: "Texas had the most exonerations in 2024, with 26. 17 of those cases trace to the misconduct of a single former Houston narcotics officer, Gerald Goines."

  - question: "How many exonerations happened in 2024?"
    answer: "147 exonerations occurred nationwide in 2024: 141 across 28 states and 6 in federal courts. Texas led all states at 26."

  - question: "Which states had no exonerations in 2024?"
    answer: "22 states recorded no exonerations in 2024, including Alabama, Georgia, Kentucky, and Washington."

  - question: "Why did Illinois lose the top spot for exonerations?"
    answer: "Illinois recorded 20 exonerations in 2024, ending a six-year run at the top of the list. Texas's 26 exonerations, driven by a cluster of cases tied to one former narcotics officer, pushed Illinois into second place."

  - question: "How many exonerations happened in New York and Pennsylvania?"
    answer: "New York and Pennsylvania each recorded 15 exonerations in 2024, tied for third place nationally."

