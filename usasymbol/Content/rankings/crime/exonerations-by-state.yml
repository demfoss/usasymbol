sections:
  - id: "why-texas-has-the-most-exonerations"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Texas Has the Most Exonerations"
    paragraphs:
      - "17 of Texas's 26 exonerations in 2024 trace to Gerald Goines, a former Houston Police Department narcotics officer whose misconduct produced a cluster of wrongful drug convictions in Harris County. That single cluster pushed Texas past Illinois for the top spot."
      - "Illinois had led the country for six straight years before 2024, driven by drug cases tied to a different disgraced police sergeant in Chicago's Cook County. 17 of Illinois's 20 exonerations in 2024 came from Cook County."

