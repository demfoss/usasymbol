page:
  h1: "Exonerations by State"

  quick_answer:
    - "Texas recorded the most exonerations of any state in 2024, with 26, according to the National Registry of Exonerations."
    - "Illinois ranks second at 20, followed by New York and Pennsylvania, tied at 15 each. California is fifth at 11."
    - "141 exonerations occurred across 28 states in 2024, plus 6 more in federal courts, for a national total of 147. 22 states recorded none."

  methodology: "Figures count exonerations recorded by the National Registry of Exonerations that occurred in 2024, as published in its 2024 Annual Report. Federal-court exonerations are tracked separately and excluded from the state ranking."

  sources:
    - name: "National Registry of Exonerations — 2024 Annual Report"
      url: "https://exonerationregistry.org/sites/exonerationregistry.org/files/documents/2024_Annual_Report.pdf"
      description: "Joint project of the University of California Irvine Newkirk Center, University of Michigan Law School, and Michigan State University College of Law, tracking exonerations by state, crime, and cause since 1989."

