faq:
- question: Which state has the most public corruption convictions?
  answer: Texas has the most federal public corruption convictions at 697 from 2013 to 2022. California ranks second at 576.
- question: Which state has the fewest public corruption convictions?
  answer: Wyoming has the fewest convictions at just 3 over the decade, followed by Vermont at 4 and New Hampshire at 5.
- question: How many public corruption convictions did Louisiana have?
  answer: Louisiana recorded 320 federal public corruption convictions from 2013 to 2022, the eighth-highest total of any state despite its comparatively small population.
- question: How is public corruption tracked by the federal government?
  answer: The DOJ Public Integrity Section compiles annual conviction counts from every U.S. Attorney's office and reports the totals to Congress each year, covering federal, state, and local officials.
- question: How many public corruption convictions were there nationwide from 2013 to 2022?
  answer: U.S. Attorneys' offices reported 7,312 federal public corruption convictions nationwide from 2013 to 2022, spanning federal, state, and local officials.
