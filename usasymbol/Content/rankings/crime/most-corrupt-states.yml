page:
  h1: Most Corrupt States
  quick_answer:
  - Texas has the most federal public corruption convictions of any state at 697 from 2013 to 2022, according to the Department of Justice's Public Integrity Section.
  - California ranks second at 576 convictions, followed by Florida at 528 and New York at 392.
  - Wyoming has the fewest convictions at 3 over the decade, followed by Vermont at 4 and New Hampshire at 5.
  methodology: Counts are federal public corruption convictions of federal, state, and local officials from 2013 to 2022, tallied by U.S. Attorneys' office district and combined by state, from the DOJ Public Integrity Section's Report to Congress. District of Columbia, Puerto Rico, Guam, and the Virgin Islands are excluded.
