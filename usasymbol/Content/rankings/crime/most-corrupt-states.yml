sections:
- id: states-with-the-most-corruption-convictions
  icon: fa-solid fa-gavel
  title: States With the Most Corruption Convictions
  paragraphs:
  - Texas recorded 697 federal public corruption convictions from 2013 to 2022, the most of any state. California follows at 576, and Florida is third at 528.
  - New York logged 392 convictions, and Pennsylvania is fifth at 340. Louisiana's total of 320 is notable given its comparatively small population.
- id: states-with-the-fewest-corruption-convictions
  icon: fa-solid fa-arrow-trend-down
  title: States With the Fewest Corruption Convictions
  paragraphs:
  - Wyoming recorded just 3 federal public corruption convictions over the decade, the fewest of any state. Vermont follows at 4, and New Hampshire is third-lowest at 5.
  - Delaware logged 11 convictions, and North Dakota recorded 13. Each of these states also ranks among the least populous in the country.
