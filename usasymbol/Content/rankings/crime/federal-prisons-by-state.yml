page:
  h1: Federal Prisons by State
  quick_answer:
  - Texas hosts the most Federal Bureau of Prisons facilities of any state at 14, including penitentiaries, correctional institutions, and camps around Beaumont, Bastrop, and Fort Worth.
  - Pennsylvania ranks second with 9 facilities, followed by California, Florida, and West Virginia, each with 7.
  - 35 states host at least one BOP facility. Fifteen states, along with the District of Columbia, host none.
  methodology: Counts reflect BOP-designated institutions listed by state, including penitentiaries, correctional institutions, camps, and medical or detention centers, compiled from BOP's own facility designations as documented on Wikipedia's List of United States Federal Prisons.
  sources:
  - name: Federal Bureau of Prisons, BOP Locations
    url: https://www.bop.gov/locations/list.jsp
    description: Official directory of Federal Bureau of Prisons institutions
