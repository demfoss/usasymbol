faq:
- question: Which state has the most federal prisons?
  answer: Texas hosts the most Federal Bureau of Prisons facilities at 14, more than any other state. Pennsylvania ranks second with 9.
- question: How many federal prisons are in Texas?
  answer: Texas hosts 14 BOP facilities, including penitentiaries, correctional institutions, and camps clustered around Beaumont, Bastrop, and Fort Worth.
- question: How many federal prisons are in Pennsylvania?
  answer: Pennsylvania hosts 9 BOP facilities, the second-highest total of any state, including the Allenwood and Lewisburg complexes.
- question: Which states have no federal prisons?
  answer: Fifteen states host no BOP facility, including Alaska, Nevada, and Utah. Federal defendants from those states are typically transferred to facilities in other states.
- question: How many states have a federal prison?
  answer: 35 states host at least one BOP facility. Texas leads with 14, and 12 states tie for the fewest at 1 facility each.
