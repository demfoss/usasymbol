sections:
- id: states-with-the-most-federal-prisons
  icon: fa-solid fa-building-shield
  title: States With the Most Federal Prisons
  paragraphs:
  - Texas hosts 14 BOP facilities, the most of any state, spanning penitentiaries and camps around Beaumont, Bastrop, and Fort Worth. Pennsylvania is second with 9 facilities.
  - California, Florida, and West Virginia tie for third with 7 facilities each. Illinois and Kentucky follow with 5 apiece.
- id: states-with-no-federal-prisons
  icon: fa-solid fa-circle-minus
  title: States With No Federal Prisons
  paragraphs:
  - Fifteen states host no BOP facility at all, including Alaska, Nevada, and Utah. Those states' federal defendants are typically housed in facilities in neighboring states.
