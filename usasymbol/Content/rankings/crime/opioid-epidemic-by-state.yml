page:
  h1: Opioid Epidemic by State
  quick_answer:
  - West Virginia has the highest opioid overdose death rate in the nation at 38.6 per 100,000 residents in 2024, according to CDC data.
  - Alaska ranks second at 37.0, followed by Washington at 30.2 and Vermont at 29.0. Delaware rounds out the top five at 28.9.
  - Nebraska has the lowest rate at 3.3 per 100,000, roughly a twelfth of West Virginia's rate. South Dakota is second-lowest at 5.4.
  methodology: Rates are age-adjusted opioid overdose deaths per 100,000 residents for 2024, from the CDC National Center for Health Statistics National Vital Statistics System, as compiled by KFF State Health Facts.
