sections:
- id: states-with-the-highest-opioid-overdose-death-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Opioid Overdose Death Rate
  paragraphs:
  - West Virginia has the highest rate in the table at 38.6 opioid deaths per 100,000 residents, ahead of Alaska's 37.0 in second place. Washington follows at 30.2.
  - Vermont ranks fourth at 29.0, just above Delaware's 28.9. Maine rounds out the top six at 28.6, the last state above 26.
- id: states-with-the-lowest-opioid-overdose-death-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Opioid Overdose Death Rate
  paragraphs:
  - Nebraska has the lowest rate in the table at 3.3 per 100,000, less than half of South Dakota's second-lowest 5.4. Iowa follows at 5.8.
  - Arkansas sits at 6.2 and Texas at 7.8, both well below the national rate of 16.0. All five of the lowest states trail West Virginia by at least 30 points.
faq:
- question: What state has the highest opioid death rate?
  answer: West Virginia has the highest opioid overdose death rate at 38.6 per 100,000 residents in 2024, ahead of Alaska at 37.0.
- question: What state has the lowest opioid death rate?
  answer: Nebraska has the lowest rate at 3.3 per 100,000. South Dakota follows at 5.4, and Iowa is third-lowest at 5.8.
- question: What is the opioid overdose death rate in Texas?
  answer: Texas has an opioid overdose death rate of 7.8 per 100,000, ranking 46th, among the lowest in the table.
- question: Which state has the highest opioid overdose rate per capita?
  answer: West Virginia ranks first per capita at 38.6 opioid deaths per 100,000 residents, ahead of Alaska at 37.0 and Washington at 30.2.
- question: What is the opioid overdose death rate in California?
  answer: California has an opioid overdose death rate of 13.5 per 100,000, tied with Michigan and Virginia, ranking 34th among the states.
