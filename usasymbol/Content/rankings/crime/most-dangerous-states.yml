page:
  h1: Most Dangerous States
  quick_answer:
  - Most dangerous states start with Alaska, which has 724.1 violent crimes per 100,000 residents. Reports of assault and sexual violence run unusually high in its remote communities.
  - Maine is the safest state at 100.1, a rural place with no large city. New Hampshire at 110.1 and Connecticut at 136.0 also sit far below the national rate of 359.1.
  - New Mexico is only 7 points behind Alaska at 717.1. Tennessee is third at 592.3, with Memphis among the most violent big cities in the country.
  methodology: Violent crime combines murder, rape, robbery, and aggravated assault per 100,000 residents for 2024, as reported to the FBI Uniform Crime Reporting Program. The national rate was 359.1.
