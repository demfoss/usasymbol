sections:
- id: most-dangerous-states-by-violent-crime-rate
  icon: fa-solid fa-triangle-exclamation
  title: Why Alaska Has the Highest Violent Crime Rate
  paragraphs:
  - Alaska leads at 724.1 violent crimes per 100,000 residents. The state has long reported one of the highest rape rates in the country, and domestic violence and assault are persistent problems in its small communities.
  - Distance makes them harder to fight. Many Alaska Native villages sit off the road system and can be reached only by plane, boat, or snowmobile, so police help may be far away. A small population also means a few hundred extra cases can move the rate noticeably.
- id: why-maine-has-the-lowest-violent-crime-rate
  icon: fa-solid fa-shield-halved
  title: Why Maine Has the Lowest Violent Crime Rate
  paragraphs:
  - Maine records 100.1 violent crimes per 100,000 residents, with New Hampshire next at 110.1. Portland, the biggest city in Maine, has fewer than 70,000 residents, and most of the state is forest, farmland, and small coastal towns.
  - Violent crime clusters in cities, and Maine has none of the size that produces it. It is the least densely populated state east of the Mississippi River, as the [population density by state](/rankings/demographics/states-by-population-density) table shows. Connecticut at 136.0 and Rhode Island at 153.6 round out the [safest states in the US](/rankings/crime/safest-states-in-the-us).
- id: most-dangerous-states-after-alaska
  icon: fa-solid fa-chart-line
  title: Most Dangerous States After Alaska
  paragraphs:
  - New Mexico trails Alaska by just 7 points at 717.1. Albuquerque, home to roughly a quarter of New Mexicans, has long reported some of the highest violent crime of any large American city, and the [most dangerous cities by state](/rankings/crime/most-dangerous-cities-by-state) ranking shows how city rates can lift a whole state.
  - Tennessee is third at 592.3, and Memphis is a major reason. Arkansas follows at 579.4 and Louisiana at 519.8, which gives the South three of the top five places.
faq:
- question: What is the most dangerous state in America?
  answer: Alaska, at 724.1 violent crimes per 100,000 residents. New Mexico comes within 7 points at 717.1, so the top two are nearly tied.
- question: Which state has the lowest violent crime rate?
  answer: Maine has the lowest rate at 100.1 per 100,000. New Hampshire is next at 110.1.
- question: What is the violent crime rate in Texas?
  answer: Texas has a rate of 389.4 per 100,000, which ranks 17th. That is about 30 points above the national rate of 359.1.
- question: What is the violent crime rate in California?
  answer: California has a rate of 486.0 per 100,000 and ranks sixth. It is the most populous state in the top ten, with Colorado close behind at 476.3.
- question: What is the violent crime rate in New York?
  answer: New York has a rate of 380.2 per 100,000, ranking 18th and slightly above the national rate.
- question: How many states are above the national violent crime rate?
  answer: Twenty-two states top the national rate of 359.1, from Alaska down to Alabama at 359.9. Oregon at 331.0 is the first state below it.
