sections:
- id: states-with-the-highest-rape-rate
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Rape Rate
  paragraphs:
  - Alaska leads the table by a wide margin at 122.1 rapes per 100,000 residents, more than 52 points above Arkansas in second place at 69.9. Oklahoma follows at 59.7, and Montana is fourth at 59.2.
  - Utah and Wyoming tie for sixth at 58.0. Colorado sits just above that pair at 58.3, the only state between 59.2 and 58.0.
- id: states-with-the-lowest-rape-rate
  icon: fa-solid fa-arrow-trend-down
  title: States With the Lowest Rape Rate
  paragraphs:
  - Delaware has the lowest reported rate in the table at 15.7 per 100,000, just below New Jersey's 17.3. Connecticut is third-lowest at 17.9, the only three states under 18.
  - New York follows at 21.7, the only other state under 25. Alabama is next at 25.8, more than four times lower than top-ranked Alaska.
faq:
- question: What state has the highest rape rate?
  answer: Alaska has the highest reported rape rate at 122.1 per 100,000 residents in 2024, far ahead of Arkansas at 69.9.
- question: What state has the lowest rape rate?
  answer: Delaware has the lowest reported rate at 15.7 per 100,000. New Jersey follows at 17.3, and Connecticut is third-lowest at 17.9.
- question: What is the rape rate in Texas?
  answer: Texas has a reported rape rate of 50.0 per 100,000, ranking 12th in the table.
- question: Which state has the highest rate of reported rape per capita?
  answer: Alaska ranks first per capita at 122.1 rapes per 100,000 residents, ahead of Arkansas at 69.9 and Oklahoma at 59.7.
- question: What is the rape rate in California?
  answer: California has a reported rape rate of 36.6 per 100,000, ranking 28th among the states.
