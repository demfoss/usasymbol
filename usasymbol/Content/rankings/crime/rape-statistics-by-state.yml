page:
  h1: Rape Statistics by State
  quick_answer:
  - Alaska has the highest reported rape rate in the nation at 122.1 per 100,000 residents in 2024, according to FBI Uniform Crime Reporting data.
  - Arkansas ranks second at 69.9 per 100,000, more than 52 points behind Alaska. Oklahoma is third at 59.7, followed closely by Montana at 59.2.
  - Delaware has the lowest reported rate at 15.7 per 100,000, less than a seventh of Alaska's rate. New Jersey is second-lowest at 17.3.
  methodology: Rates reflect rape offenses per 100,000 residents reported to the FBI Uniform Crime Reporting Program for 2024, using the FBI's 2013 revised definition of rape. Reporting practices for sex offenses vary between agencies, which can affect state comparisons.
  sources:
  - name: FBI Crime Data Explorer — Estimated Crimes in the United States
    url: https://cde.ucr.cjis.gov/
    description: State-level rape offense counts and population data for 2024, based on the FBI's revised Uniform Crime Reporting definition of rape
