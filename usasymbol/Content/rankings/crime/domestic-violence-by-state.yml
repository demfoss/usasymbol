sections:
- id: states-with-the-highest-domestic-violence-rates
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Domestic Violence Rates
  paragraphs:
  - Arkansas leads the table at 48.1% lifetime prevalence among women, ahead of Missouri at 47.3% and Alaska at 47.1%. Oregon and West Virginia round out the top five at 44.2% and 44.1%.
  - Maryland follows at 43.3%, and Washington is seventh at 42.2%. Each of the top seven states tops 42%, more than double New Jersey's 21% at the bottom of the table.
- id: states-with-the-lowest-domestic-violence-rates
  icon: fa-solid fa-shield-heart
  title: States With the Lowest Domestic Violence Rates
  paragraphs:
  - New Jersey has the lowest lifetime prevalence at 21%, more than 27 points below Arkansas. Florida is second-lowest at 24.6%, and Connecticut follows at 26.2%.
  - North Dakota ranks fourth-lowest at 27.1%, and Iowa is fifth-lowest at 28.3%. All five of the lowest-ranked states sit below the 30% mark.
faq:
- question: Which state has the highest rate of domestic violence?
  answer: Arkansas has the highest lifetime intimate partner violence prevalence among women at 48.1%. Missouri ranks second at 47.3%, and Alaska is third at 47.1%.
- question: Which state has the lowest rate of domestic violence?
  answer: New Jersey has the lowest prevalence at 21%. Florida is second-lowest at 24.6%, roughly 3.6 points higher.
- question: What is the domestic violence rate in California?
  answer: California has a lifetime intimate partner violence prevalence of 30% among women, ranking 45th out of the 50 states in this table.
- question: How is domestic violence prevalence measured by state?
  answer: The CDC's NISVS 2016/2017 State Report measures lifetime prevalence of contact sexual violence, physical violence, and/or stalking by an intimate partner, based on a state-level telephone survey of women.
- question: What is the domestic violence rate in Texas?
  answer: Texas has a lifetime intimate partner violence prevalence of 30.4% among women, close to California's 30% and ranking 43rd in the table.
