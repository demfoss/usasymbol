page:
  h1: Domestic Violence by State
  quick_answer:
  - Arkansas has the highest lifetime intimate partner violence prevalence among women of any state, at 48.1%, based on CDC survey data.
  - Missouri ranks second at 47.3%, and Alaska is third at 47.1%. New Jersey has the lowest prevalence in the table at 21%.
  - Florida is second-lowest at 24.6%, and Connecticut follows at 26.2%. The gap between Arkansas and New Jersey spans more than 27 percentage points.
  methodology: Figures show the lifetime prevalence of contact sexual violence, physical violence, and/or stalking by an intimate partner among women, from the CDC's National Intimate Partner and Sexual Violence Survey (NISVS) 2016/2017 State Report.
