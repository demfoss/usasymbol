sections:
- id: states-with-the-highest-rate-of-police-killings
  icon: fa-solid fa-triangle-exclamation
  title: States With the Highest Rate of Police Killings
  paragraphs:
  - Alaska has the highest rate at 13.6 deaths per million residents in 2025, despite a total of just 10 deaths. New Mexico follows at 12.8 per million with 27 deaths.
  - Wyoming ranks third at 8.7 per million, and Arizona is fourth at 8.0 per million with 57 deaths, the fourth-highest raw total of any state.
- id: states-with-the-most-total-police-killings
  icon: fa-solid fa-list-ol
  title: States With the Most Total Police Killings
  paragraphs:
  - Texas recorded the most deaths in raw terms at 114 in 2025, yet its rate of 3.9 per million ranks 25th. California follows with 143 deaths at a rate of 3.6 per million.
  - Florida logged 109 deaths at a rate of 5.1 per million, the 16th-highest rate nationally. Arizona's 57 deaths correspond to the fourth-highest rate at 8.0 per million.
