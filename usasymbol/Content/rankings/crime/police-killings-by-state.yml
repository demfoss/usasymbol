page:
  h1: Police Killings by State
  quick_answer:
  - Alaska has the highest rate of deaths from police use of force of any state at 13.6 per million residents in 2025, with 10 deaths recorded.
  - New Mexico ranks second at 12.8 per million with 27 deaths, followed by Wyoming at 8.7 per million and Arizona at 8.0 per million.
  - Rhode Island recorded zero deaths from police use of force in 2025. Massachusetts had the lowest rate among states with at least one death, at 0.6 per million.
  methodology: Figures reflect deaths from police use of force in 2025, tracked in Mapping Police Violence's independent database, which cross-references media reports, obituaries, and police and government records. CDC WONDER's legal intervention death codes undercount these events due to inconsistent death certificate coding, which is why researchers use independently verified databases instead.
