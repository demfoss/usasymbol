faq:
- question: Which state has the highest rate of police killings?
  answer: Alaska has the highest rate at 13.6 deaths per million residents in 2025. New Mexico ranks second at 12.8 per million.
- question: Which state has the most police killings in raw numbers?
  answer: California recorded the most deaths in 2025 at 143, followed by Texas at 114 and Florida at 109. Their rates per million rank lower because of their large populations.
- question: Which state has the lowest rate of police killings?
  answer: Rhode Island recorded zero deaths from police use of force in 2025. Massachusetts had the lowest rate among states with at least one death, at 0.6 per million.
- question: How many people did police kill in Texas in 2025?
  answer: Texas recorded 114 deaths from police use of force in 2025, the highest raw total of any state, corresponding to a rate of 3.9 per million residents.
- question: Why does CDC data undercount police killings?
  answer: Death certificates using the legal intervention code are inconsistently completed by medical examiners and coroners, so researchers rely on independently verified databases like Mapping Police Violence instead.
