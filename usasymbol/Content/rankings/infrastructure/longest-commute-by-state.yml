faq:
  - question: "Which state has the longest average commute time?"
    answer: "New York has the longest average commute time at 33.5 minutes. Maryland ranks second at 33.0, and New Jersey is third at 32.0."

  - question: "Which state has the shortest average commute time?"
    answer: "South Dakota has the shortest average commute time at 17.3 minutes. North Dakota follows at 17.6, and Wyoming is at 17.9."

  - question: "What is the average commute time in California?"
    answer: "California averages 29.8 minutes one way. That puts it fifth overall, just behind Massachusetts at 30.0."

  - question: "What is the average commute time in Texas?"
    answer: "Texas averages 26.6 minutes one way. Its drive solo share is 80.7%, while public transit use is 1.3%."

  - question: "Which state uses public transit the most for commuting?"
    answer: "New York has the highest public transit share at 28.0%. New Jersey is next at 11.7%, and Massachusetts is at 10.2%."

  - question: "Which state has the highest drive solo share?"
    answer: "Alabama has the highest drive solo share at 86.3%. Mississippi is close behind at 85.5%, and West Virginia is at 83.3%."

