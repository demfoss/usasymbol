faq:
  - question: "Which state produces the most oil?"
    answer: "Texas, with 2,102,613 thousand barrels of crude oil in 2025. Spindletop in 1901 started the boom, and the Permian Basin keeps it going."
  - question: "What is the second largest oil producing state?"
    answer: "New Mexico, at 804,950 thousand barrels. It passed North Dakota, now third, as Permian Basin drilling spread across the state line."
  - question: "How much oil does North Dakota produce?"
    answer: "North Dakota produced 427,561 thousand barrels in 2025, down from 438,594 the year before. Nearly all of it comes from the Bakken formation in the western part of the state."
  - question: "How much oil does Alaska produce?"
    answer: "Alaska produced 154,033 thousand barrels in 2025, fifth among states. North Slope fields supply almost all of it, and the Trans-Alaska Pipeline moves it 800 miles to the port of Valdez."
  - question: "Does California still produce oil?"
    answer: "Yes, California ranks eighth with 105,172 thousand barrels, down from 112,997 in 2024. Most of it comes from Kern County near Bakersfield."
  - question: "Which states produce no oil?"
    answer: "Eighteen states report none, among them Connecticut, Delaware, Georgia, Hawaii, Iowa, Maine, Massachusetts, Minnesota, New Hampshire, New Jersey, North Carolina, Oregon, Rhode Island, South Carolina, Vermont, Washington and Wisconsin, plus Maryland. The ranking covers only the 32 states that pumped oil."
