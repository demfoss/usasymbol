  - id: states-with-growing-oil-production
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With Growing Oil Production"
    paragraphs:
      - "New Mexico added 60,330 thousand barrels between 2024 and 2025, the largest gain of any state, as drillers kept pushing into the Delaware Basin portion of the Permian. Ohio grew 35.1% to 50,118 thousand barrels, driven by wells in the Utica shale."
      - "California moved the other way, slipping from 112,997 to 105,172 thousand barrels. Its fields around Bakersfield are among the oldest in the country, and new drilling permits have been scarce."
    table:
      columns:
        state: "State"
