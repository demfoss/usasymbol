  - id: states-with-the-least-oil-production
    icon: "fa-solid fa-droplet"
    title: "States With the Least Oil Production"
    paragraphs:
      - "Arizona produces just 3 thousand barrels a year and Virginia 8. Neither sits on the thick sedimentary basins that hold the big fields, so oil there is a curiosity rather than an industry."
      - "Alaska ranks fifth at 154,033 thousand barrels almost entirely from the North Slope, where Prudhoe Bay was discovered in 1968 and the Trans-Alaska Pipeline has carried crude south to Valdez since 1977. Fuel costs at the pump appear in [gas prices by state](/rankings/economy/states-by-gas-price)."
