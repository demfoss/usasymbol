sections:
  - id: why-texas-produces-the-most-oil
    icon: "fa-solid fa-oil-well"
    title: "Why Texas Produces the Most Oil"
    paragraphs:
      - "Texas out-pumps New Mexico by more than 2.6 times. Oil gushed from Spindletop near Beaumont in 1901 and launched the Texas industry, but the modern lead comes from the Permian Basin in West Texas and the Eagle Ford shale in the south, where horizontal drilling and hydraulic fracturing unlocked rock that older wells could not drain."
      - "The Permian spills across the state line, which is why New Mexico ranks second. Natural gas comes out of the same wells, as the [natural gas production by state](/rankings/infrastructure/natural-gas-production-by-state) ranking shows."
    table:
      columns:
