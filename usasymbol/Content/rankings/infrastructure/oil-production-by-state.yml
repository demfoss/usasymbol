page:
  h1: "Oil Production by State 2026"
  quick_answer:
    - "Oil production by state is led by Texas at 2,102,613 thousand barrels in 2025, pumped mostly from the Permian Basin and the Eagle Ford shale."
    - "New Mexico is second at 804,950 thousand barrels, up from 744,620 in 2024, and shares the Permian Basin with Texas. North Dakota ranks third at 427,561 thousand barrels from the Bakken shale."
    - "Arizona is last among the 32 producing states at 3 thousand barrels. Ohio posted the biggest percentage jump among the top 15 producers, from 37,106 to 50,118 thousand barrels."
  methodology: "Crude oil field production in thousand barrels for 2025 and 2024 from the U.S. Energy Information Administration. State totals exclude federal offshore waters. States with no reported production (18 states plus the District of Columbia) are omitted."
  sources:
    - name: "U.S. Energy Information Administration. Crude Oil Production"
      url: "https://www.eia.gov/dnav/pet/pet_crd_crpdn_adc_mbbl_a.htm"
