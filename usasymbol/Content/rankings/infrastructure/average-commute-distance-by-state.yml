faq:
  - question: "Which state has the longest average commute distance?"
    answer: "New York has the longest average one-way commute distance at about 18 miles. Maryland and New Jersey are next at about 17 miles each."

  - question: "Which state has the shortest average commute distance?"
    answer: "South Dakota, North Dakota, Nebraska, and Wyoming are tied for the shortest average one-way commute distance at about 10 miles. South Dakota also has the lowest average commute time of any state."

  - question: "What is the average commute distance in California?"
    answer: "California averages about 16 miles one way, tied with Massachusetts for fourth longest, and about 8,000 miles a year round trip."

  - question: "What is the average commute distance in Texas?"
    answer: "Texas averages about 15 miles one way, part of a large cluster of states between Georgia and Mississippi that all land in the same range."

  - question: "How many miles do commuters drive to work per year on average?"
    answer: "The average American driver covers about 14.4 miles one way, or roughly 7,200 miles a year round trip over 250 workdays. New York commuters cover closer to 9,000 miles a year, the most of any state."

  - question: "Which state has the highest annual commute fuel cost?"
    answer: "New York has the highest estimated annual commute fuel cost at about $1,584, followed by Maryland at $1,560 and New Jersey at $1,539. North Dakota has the lowest at $876."

