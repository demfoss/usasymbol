    paragraphs:
      - "New York has the longest average one-way commute distance at about 18 miles, ahead of Maryland and New Jersey at about 17 miles each. Massachusetts and California follow at about 16 miles."
      - "Georgia, Florida, Illinois, West Virginia, and Virginia round out the top ten, each averaging about 15 miles one way. That group covers a mix of dense Northeast corridors and sprawling Southern metro areas, states where jobs and housing sit far enough apart that commuters cover more ground even when traffic is light."

