    paragraphs:
      - "South Dakota has the shortest average commute distance in the country at about 10 miles one way, tied with North Dakota, Nebraska, and Wyoming. All four are large, sparsely populated states, but their workers still cluster near a handful of small cities rather than spreading into long-distance exurbs."
      - "Alaska, Kansas, Iowa, and Montana follow at about 11 miles, and Idaho and Wisconsin sit at about 12. Every state in this group stays several miles below the roughly 14-mile national average for drivers."

  - id: "commute-fuel-cost-by-state"
    icon: "fa-solid fa-gas-pump"
    title: "Which States Spend the Most on Commute Fuel"
    paragraphs:
      - "New York's commuters spend the most on gas getting to work, about $1,584 a year, the product of the longest average distance in the country and one of the higher state fuel taxes. Maryland ($1,560) and New Jersey ($1,539) rank second and third for the same reason: long commutes layered on top of above-average pump prices."
      - "Distance and fuel tax do not always move together. West Virginia's commute runs about 15 miles, tied with several shorter-tax states, but its higher fuel tax still pushes its annual cost to $1,355, ahead of similar-distance states like Texas ($1,303) and Virginia ($1,330). At the other end, North Dakota's short 10-mile commute and low fuel tax combine for the lowest annual commute fuel cost in the country at $876."

