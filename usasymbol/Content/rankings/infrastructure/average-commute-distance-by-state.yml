seo:
  title: "Average Commute Distance by State | Map, Miles & Facts"
  description: "New York has the longest average one-way commute at about 18 miles. South Dakota, North Dakota, Nebraska, and Wyoming are shortest at about 10 miles."

page:
  h1: "Average Commute Distance by State"

  quick_answer:
    - "New York has the longest average one-way commute distance of any state at about 18 miles, followed by Maryland and New Jersey at about 17 miles each."
    - "South Dakota, North Dakota, Nebraska, and Wyoming are shortest at about 10 miles one way. New York commuters travel roughly 8 more miles each way than commuters in those four states."
    - "The average American commuter who drives covers about 14.4 miles one way, or roughly 7,200 miles a year round trip. New York commuters cover closer to 9,000 miles a year, the most of any state."

  methodology: "Average one-way commute distance is estimated from U.S. Census Bureau ACS commute-time data using the national average commute speed derived from that same data, then rounded to the nearest mile; annual commute miles and commute fuel cost are calculated from that distance assuming 250 workdays a year, each state's motor fuel tax, and the on-road fleet average fuel economy of 23.7 MPG. The District of Columbia appears in some source tables but is excluded here because this page ranks the 50 states only."

  sources:
    - name: "U.S. Census Bureau. American Community Survey (ACS) 1-Year Estimates, Table S0801"
      url: "https://www.census.gov/programs-surveys/acs"
      description: "Underlying state average one-way commute time used to estimate commute distance"
    - name: "Federal Highway Administration. 2022 National Household Travel Survey (NHTS)"
      url: "https://nhts.ornl.gov"
      description: "National mean and median one-way commute distance for automobile commuters, used to benchmark the state estimates"
    - name: "True Driving Cost. Average Commute Distance by State"
      url: "https://truedrivingcost.com/articles/average-commute-distance-by-state"
      description: "State-level commute distance, annual commute mileage, and annual commute fuel cost estimates derived from ACS commute-time data"

