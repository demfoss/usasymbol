faq:
  - question: "Which state has the worst EV charging access?"
    answer: "Hawaii has the worst ratio of any state, 24.3 registered EVs for every public charging port. Its 25,565 EVs share just 1,053 ports."

  - question: "Which state has the best EV charging access?"
    answer: "Wyoming has the best ratio nationally at 3.4 EVs per charging port. North Dakota is next at 3.5, and both states have fewer than 1,500 registered EVs."

  - question: "What is the average number of EVs per charging port nationally?"
    answer: "The 50 states average 13.7 registered EVs per public charging port, based on 3,547,379 registered EVs and 258,128 charging ports."

  - question: "Is California an EV charging desert despite having the most chargers?"
    answer: "California operates 67,685 charging ports, more than any other state, but its 1,256,646 registered EVs give it 18.6 EVs per port, tied with Arizona for third worst nationally."

  - question: "How does New Jersey rank for EV charging access?"
    answer: "New Jersey ranks second worst in the country at 21.3 EVs per port. Its 134,753 registered EVs share only 6,336 ports."

  - question: "How is EVs per charging port calculated?"
    answer: "It divides a state's registered EV count, reported by AFDC using Experian data as of December 31, 2023, by its AFDC public charging port count, updated August 8, 2026. A higher number means more EVs compete for each port."

