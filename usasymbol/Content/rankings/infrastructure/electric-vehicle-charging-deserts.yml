page:
  h1: "EV Charging Deserts by State"

  quick_answer:
    - "Hawaii has the worst EV charging access of any state, 24.3 registered EVs for every public charging port, well above the national average of 13.7 EVs per port."
    - "New Jersey ranks second worst at 21.3 EVs per port, with 134,753 registered EVs sharing just 6,336 ports. California and Arizona follow near 18.6, even though California operates 67,685 ports, more than any other state."
    - "Wyoming has the best charging access nationally at 3.4 EVs per port, followed closely by North Dakota at 3.5, though both states have fewer than 1,500 registered EVs total."

  methodology: "EVs per port divides AFDC-Experian EV registration counts, dated December 31, 2023, by AFDC public charging port counts by state, updated August 8, 2026. A higher ratio means more registered EVs compete for each port, and DC is excluded from state ranks."

