sections:
  - id: "states-with-the-most-traffic-congestion"
    icon: "fa-solid fa-car-burst"
    title: "States With the Most Traffic Congestion"
    paragraphs:
      - "California ranks first, with Los Angeles posting a 59.8% average congestion level and an average rush-hour speed of 24.05 mph. Honolulu puts Hawaii next at 50.5%, followed by New York City at 48.8%."
      - "Miami gives Florida a 46.8% congestion level, and Chicago puts Illinois at 46.1%. Seattle follows for Washington at 44.9%, and Atlanta puts Georgia at 44.3%."

  - id: "states-with-the-least-traffic-congestion"
    icon: "fa-solid fa-road"
    title: "States With the Least Traffic Congestion"
    paragraphs:
      - "Wichita keeps Kansas lowest among states with available city data, at 13.6% average congestion and a 41.32 mph average speed. Omaha puts Nebraska next at 14.0%, and Little Rock keeps Arkansas at 16.5%."
      - "Des Moines gives Iowa a 17.9% congestion level, and Oklahoma City puts Oklahoma at 18.2%. Salt Lake City follows for Utah at 21.8%."

  - id: "states-where-drivers-lose-the-most-time-to-traffic"
    icon: "fa-solid fa-clock"
    title: "States Where Drivers Lose the Most Time to Traffic"
    paragraphs:
      - "New York City drivers lose the most time to congestion at 125 hours a year, more than double the 49 hour U.S. average reported nationally for 2025. New York's 48.8% congestion level still trails Los Angeles and Honolulu."
      - "Honolulu drivers lose 88 hours for Hawaii, and Los Angeles drivers lose 83 hours for California. Chicago drivers lose 79 hours for Illinois, and Philadelphia and Miami drivers each lose 72 hours, for Pennsylvania and Florida."

