faq:
  - question: "Which state has the most traffic congestion?"
    answer: "California has the most traffic congestion among states with available city data, at a 59.8% average congestion level in Los Angeles. Hawaii is next at 50.5% in Honolulu."

  - question: "Which state has the least traffic congestion?"
    answer: "Kansas has the least traffic congestion among states with available city data, at 13.6% in Wichita. Nebraska is close behind at 14.0% in Omaha."

  - question: "How much traffic congestion is there in New York?"
    answer: "New York's measured city, New York City, sits at 48.8% average congestion. Drivers there lose 125 hours a year, the most of any city in this data."

  - question: "How much traffic congestion is there in Texas?"
    answer: "Houston, the Texas city measured, sits at 40.8% average congestion with drivers losing 56 hours a year. That places Texas eighth among the 38 states with available data."

  - question: "Which state has the fastest average speed despite traffic congestion?"
    answer: "Kansas has the fastest average speed in this data, 41.32 mph in Wichita, even though Wichita still shows measurable congestion at 13.6%."

  - question: "How much does traffic congestion cost drivers nationally?"
    answer: "The 2025 Global Traffic Scorecard put the U.S. total cost of congestion at $85.8 billion, with the average driver losing 49 hours. Chicago drivers alone lost $2,063 each in that year."

