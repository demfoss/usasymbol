page:
  h1: "Traffic Congestion by State"

  quick_answer:
    - "Traffic congestion by state is highest in California, where Los Angeles posts a 59.8% average congestion level, the top figure among all cities measured."
    - "Kansas ranks lowest among states with available city data, at 13.6% average congestion in Wichita, 46.2 points below California's 59.8%."
    - "New York drivers lose the most time to congestion, 125 hours a year in New York City, more than double the 49 hour U.S. average reported nationally for 2025."

  methodology: "Ranking uses World Population Review's city traffic table (average congestion percent, average speed, annual rush hour time lost). Each state is represented by its highest-congestion city among the 87 U.S. cities in that dataset. Only 38 states have a listed city; the other 12 are omitted, not assigned a zero."

  sources:
    - name: "World Population Review. Cities with the Worst Traffic 2026"
      url: "https://worldpopulationreview.com/us-city-rankings/cities-with-worst-traffic"
      description: "City-level table with average congestion percentage, average speed, and annual rush-hour time lost"
