page:
  h1: "Bike-Friendliness by State"

  quick_answer:
    - "Bike-friendliness by state is highest in Washington, ranked first among all 50 states, with Massachusetts second, Oregon third, California fourth, and Minnesota fifth."
    - "Mississippi ranks last at 50th, with Missouri 49th, Nebraska 48th, South Carolina 47th, and Alabama 46th rounding out the bottom five."
    - "Oregon holds third place even though it scored 80% or higher in five of seven ranking categories. One of the 10 largest increases nationally in bicyclist deaths per bike commuter held its safety score to just 63%."

  methodology: "Rankings use the League of American Bicyclists' 2024 Bicycle Friendly State report, which scores states across seven categories: infrastructure, safety, funding, planning, laws, capacity and support, and #EveryRideCounts data programs."

  sources:
