faq:
  - question: "Which state is the most bike-friendly?"
    answer: "Washington ranks first among all 50 states in the League of American Bicyclists' 2024 Bicycle Friendly State ranking. Massachusetts follows in second, and Oregon in third."

  - question: "Which state is the least bike-friendly?"
    answer: "Mississippi ranks last at 50th. Missouri sits just above at 49th, and Nebraska is 48th."

  - question: "How does the League of American Bicyclists rank states?"
    answer: "States are scored across seven categories: infrastructure, safety, funding, planning, laws, capacity and support, and #EveryRideCounts data programs. The report draws on more than 100 data points from state transportation departments and bicycling advocates."

  - question: "Why does Oregon rank third instead of first despite strong scores?"
    answer: "Oregon scored 80% or higher in five of seven categories, but its safety score was held to 63% after one of the 10 largest increases nationally in bicyclist deaths per bike commuter."

  - question: "How many bicyclists were killed in the United States in 2023?"
    answer: "Preliminary estimates count 1,149 bicyclist deaths in 2023, the highest number ever recorded."

  - question: "How many states track bicycle ridership data?"
    answer: "Only 22 states operate or fund programs to count bicycle ridership, part of the League's #EveryRideCounts category."

