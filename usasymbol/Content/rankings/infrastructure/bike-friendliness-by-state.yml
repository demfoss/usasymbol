sections:
  - id: "most-bike-friendly-states"
    icon: "fa-solid fa-bicycle"
    title: "Most Bike-Friendly States"
    paragraphs:
      - "Washington ranks first among all 50 states, followed by Massachusetts in second, the state that held the No. 1 rank in 2022. Oregon takes third, California fourth, and Minnesota fifth."
      - "Florida ranks eighth and Maryland ninth, the two highest-ranked states outside the top five. Michigan rounds out the top ten at 10th."

  - id: "least-bike-friendly-states"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Least Bike-Friendly States"
    paragraphs:
      - "Mississippi ranks last among all 50 states at 50th. Missouri sits just above at 49th, followed by Nebraska at 48th."
      - "South Carolina ranks 47th and Alabama 46th, completing the bottom five. All five states rank in the bottom fifth of the 2024 list."

  - id: "why-oregon-ranks-third"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Why Oregon Ranks Third Despite Strong Scores"
    paragraphs:
      - "Oregon scored 80% or higher in five of the seven ranking categories, including third place nationally in per capita federal biking and walking funding at $8.56, and the nation's best bike-commute rate at 1.4%. Its safety category score fell to just 63%, held down by one of the 10 largest increases nationally in bicyclist deaths per bike commuter."
      - "Nationally, preliminary estimates put bicyclist deaths at 1,149 in 2023, the highest number ever recorded. Only 22 states operate or fund programs that count bicycle ridership, the category the League calls #EveryRideCounts."

