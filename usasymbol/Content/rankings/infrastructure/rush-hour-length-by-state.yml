faq:
  - question: "Which state has the longest rush hour?"
    answer: "Illinois has the longest rush hour of any state. Chicago drivers lose 112 hours a year to peak-period congestion, 63 hours above the 49-hour national average."

  - question: "Which state has the shortest rush hour?"
    answer: "Oregon has the shortest rush hour among the measured states, 41 hours a year in Portland. Arizona is next at 42 hours in Phoenix."

  - question: "How much time do rush-hour delays cost drivers nationally?"
    answer: "The average U.S. driver lost 49 hours to congestion in 2025, up from 43 hours the year before. INRIX put the average cost at $894 per driver and $85.8 billion nationwide."

  - question: "How long is rush hour in New York?"
    answer: "New York City drivers lose 102 hours a year to congestion, second most of any metro measured. That figure held flat in 2025, a change INRIX links to the city's congestion pricing policy."

  - question: "Which state has the highest cost per driver from rush-hour congestion?"
    answer: "Illinois has the highest cost per driver, $2,063 a year in Chicago. New York is next at $1,879, and Pennsylvania is third at $1,860."

  - question: "How many states are included in this rush-hour ranking?"
    answer: "Seventeen states have a city in INRIX's top-tier 2025 congestion ranking. The other 33 states have no metro area in that list and are left out rather than scored as zero."

