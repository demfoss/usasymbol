page:
  h1: "Rush Hour Length by State"

  quick_answer:
    - "Illinois has the longest rush hour of any state. Chicago drivers lose 112 hours a year to peak-period congestion, the most of any metro area in the INRIX 2025 ranking."
    - "New York follows at 102 hours in New York City, and Pennsylvania is third at 101 hours in Philadelphia, a tight cluster within 11 hours of Illinois's total."
    - "Oregon has the shortest rush hour among the measured states, 41 hours in Portland, 71 hours below Illinois and well under the 49-hour national average."

  methodology: "Ranking uses the INRIX 2025 Global Traffic Scorecard's U.S. impact ranking of the most congested metro areas, measured in hours lost per driver to congestion during peak commute periods. Each state is represented by its highest-ranked city in that top-tier list; states with no city in INRIX's top rankings are omitted, not assigned a zero."

  sources:
