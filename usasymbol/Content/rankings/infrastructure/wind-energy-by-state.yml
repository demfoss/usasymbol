sections:
  - id: why-texas-generates-the-most-wind-energy
    icon: "fa-solid fa-wind"
    title: "Why Texas Generates the Most Wind Energy"
    paragraphs:
      - "Texas produced 130,136 GWh, about three times second-place Iowa. The state is huge, its western plains catch steady wind, and it runs its own power grid, ERCOT, which lets wind farms sell power across the state without crossing into federal oversight of interstate markets."
      - "Around 2013 Texas finished long new transmission lines that carry West Texas wind to Dallas, Austin and Houston, which opened the door to the wind farms behind its lead. The tall, flat Panhandle and Great Plains also show up in the [windiest states in the US](/rankings/geography/windiest-states-in-the-us)."
