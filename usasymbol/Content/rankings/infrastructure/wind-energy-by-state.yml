    icon: "fa-solid fa-bolt"
    title: "States With the Highest Wind Share of Electricity"
    paragraphs:
      - "Iowa gets 58.5% of its electricity from wind, and South Dakota 58.2%, even though South Dakota ranks only 11th for total output. Iowa's flat farmland, steady winds and a big utility, MidAmerican Energy, that built turbines across its fields made wind a main power source."
      - "Texas leads in volume but wind is only 21.7% of what its much larger grid generates. Kansas at 47.1% and Oklahoma at 41.5% rank higher on share. Wind is one piece of the wider mix in [renewable energy by state](/rankings/infrastructure/renewable-energy-by-state)."
