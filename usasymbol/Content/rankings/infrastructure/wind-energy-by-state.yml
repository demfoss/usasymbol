seo:
  title: "Wind Energy by State 2026 | Map & Rankings"
  description: "Texas generated 130,136 GWh of wind power in 2025, more than any other state. Iowa is second and gets 58.5% of its electricity from wind."
page:
  h1: "Wind Energy by State 2026"
  quick_answer:
    - "Wind energy by state is led by Texas at 130,136 gigawatthours in 2025, about three times Iowa's total. West Texas and the Panhandle hold the largest wind farms in the country."
    - "Iowa ranks second at 43,573 gigawatthours, and wind supplies 58.5% of its electricity, the highest share of any state. South Dakota is a close second on share at 58.2%."
    - "Delaware is last among the 43 states with wind power at 5 gigawatthours. Wyoming grew the most among the big producers, up 41.4% from 9,002 to 12,725 as new wind farms entered service."
  methodology: "Utility-scale net generation from wind in thousand megawatthours (gigawatthours) for 2025 and 2024 from the U.S. Energy Information Administration Electric Power Annual, Table 3.18. Share is wind divided by each state's total utility-scale generation in Table 3.7. States with no wind generation in 2025 are omitted, including Alabama, Florida, Georgia, Kentucky, Louisiana, South Carolina, Tennessee and the District of Columbia."
