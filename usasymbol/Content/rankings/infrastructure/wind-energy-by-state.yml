    icon: "fa-solid fa-chart-line"
    title: "Fastest Growing Wind Energy States"
    paragraphs:
      - "Wyoming jumped 41.4% in a year, from 9,002 to 12,725 GWh, the biggest gain among states with major wind output. The same state mines more coal than any other, as [coal production by state](/rankings/infrastructure/coal-production-by-state) shows."
      - "North Carolina rose 76.6% to 936 GWh and Mississippi 44.1% to 500, both from small bases. Washington fell 8.8% and Oregon 5.8%, the steepest drops among the large Pacific producers."
