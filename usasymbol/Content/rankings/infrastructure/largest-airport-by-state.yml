seo:
  title: "Largest Airport in Each U.S. State: Biggest and Busiest Airports"
  description: "This list shows the biggest airport in each U.S. state by passenger traffic and land area. Atlanta is the busiest, while Denver is the largest by size."

page:
  h1: "Largest Airport in Each U.S. State"

  quick_answer:
    - "Hartsfield-Jackson Atlanta International (ATL) in Georgia is the busiest airport in any U.S. state — and the world — with over 104 million passengers a year. It has held the global top position without interruption for more than 25 years."
    - "Denver International (DEN) is the largest U.S. airport by land at 53 square miles (34,000 acres) — bigger than the city of San Francisco. No other American airport is close: Dallas/Fort Worth is second at 27 square miles."
    - "Delaware, Wyoming, West Virginia, and Vermont have the smallest primary airports in the country, each handling fewer than 1 million passengers annually."

  methodology: "Passenger figures are annual enplanements (boarded passengers only) as reported to the FAA, 2023 data. Physical area covers total airport property including runways, taxiways, terminals, and buffer land within the airport boundary. Each state is represented by its single busiest commercial airport by passenger count. Airports are credited to the state where the airport facility is physically located — Cincinnati/Northern Kentucky (CVG) sits in Hebron, Kentucky; Newark Liberty (EWR) is in New Jersey. Washington D.C. is excluded as a non-state jurisdiction."

  sources:
    - name: "FAA Air Traffic Activity System (ATAS)"
      url: "https://aspm.faa.gov/"
      description: "Official FAA airport passenger and operations statistics"
    - name: "Airports Council International – North America"
      url: "https://www.airports.org/"
      description: "Annual traffic rankings for North American airports"
    - name: "FAA Airport Master Records"
      url: "https://www.faa.gov/airports"
      description: "Airport facility information including land area and boundary data"

