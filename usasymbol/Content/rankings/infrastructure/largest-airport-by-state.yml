  title: "Largest Airport by State | Map, Codes & Passengers"
  description: "Atlanta's Hartsfield-Jackson is the busiest airport in any state, with 51.5 million boardings in 2025. Delaware's Wilmington Airport is the smallest."

page:
  h1: "Largest Airport in Each State"

  quick_answer:
    - "Largest airport by state data puts Georgia first. Hartsfield-Jackson Atlanta International boarded 51.5 million passengers in 2025, more than any other airport in the country, because it is the main hub of Atlanta-based Delta Air Lines."
    - "Kentucky's busiest airport serves another state's city. Cincinnati/Northern Kentucky International sits in Hebron, Kentucky, across the Ohio River from Cincinnati."
    - "Delaware ranks last, with 169,382 boardings at Wilmington Airport. Most Delaware travelers drive to Philadelphia or Baltimore instead, both within about an hour."

  methodology: "Busiest commercial service airport in each state by revenue passenger enplanements (boardings), FAA calendar year 2025 preliminary data, with change from 2024. Total passenger counts that include arrivals run roughly twice as high."

  sources:
