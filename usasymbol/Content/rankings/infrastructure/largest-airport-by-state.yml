sections:
- id: busiest-airports-by-state
  icon: fa-solid fa-plane-departure
  title: Why Atlanta Has the Busiest Airport
  paragraphs:
  - Georgia leads with 51,459,786 boardings at [Hartsfield-Jackson Atlanta International](https://goairports.org/airports/north-america/united-states/atl/). Atlanta houses Delta’s headquarters and largest hub, where connecting travelers board another flight without visiting the city. Airline hubs explain why [the largest U.S. airlines](/collections/travel/largest-us-airlines) can concentrate passengers at a single airport.
  - Delaware has the smallest state-leading total, 169,382 at Wilmington. Its airport lies in the Greater Philadelphia region, where travelers can also use Philadelphia International across the state line. Airport catchment areas cross borders, unlike the state boundaries used for this table.
