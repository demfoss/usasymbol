faq:
  - question: "What is the busiest airport in the United States"
    answer: "Hartsfield-Jackson Atlanta International (ATL) in Georgia is the busiest airport in the United States with over 104 million annual passengers. It is also the busiest airport in the world and has held that position continuously since 1998."

  - question: "What is the largest airport in the US by land area"
    answer: "Denver International Airport (DEN) is the largest airport in the United States by land area, covering approximately 53 square miles (about 34,000 acres). Dallas/Fort Worth International is a distant second at 27 square miles (17,207 acres)."

  - question: "What is the largest airport in Texas"
    answer: "Dallas/Fort Worth International Airport (DFW) is the largest airport in Texas by both passenger traffic (81 million annually) and land area (17,207 acres). It is the second-busiest airport in the United States."

  - question: "What is the largest airport in California"
    answer: "Los Angeles International (LAX) is California's largest airport by passenger traffic with approximately 75 million annual passengers. San Francisco International (SFO) is California's second-busiest airport. By land area, LAX covers about 3,500 acres."

  - question: "What is the largest airport in Florida"
    answer: "By passenger traffic, Miami International (MIA) is Florida's busiest with approximately 52 million annual passengers. By land area, Orlando International (MCO) is the larger facility at roughly 11,000 acres — more than three times Miami's footprint."

  - question: "Why is Cincinnati's airport in Kentucky"
    answer: "Cincinnati/Northern Kentucky International (CVG) is physically located in Hebron, Boone County, Kentucky, across the Ohio River from Cincinnati. The airport was developed on Kentucky land for geographic and regulatory reasons. It is credited as Kentucky's primary commercial airport but primarily serves the Greater Cincinnati metropolitan area in Ohio."

  - question: "What is the only commercial airport inside a national park"
    answer: "Jackson Hole Airport (JAC) in Wyoming is the only commercial service airport located within a U.S. national park — Grand Teton National Park. Its operating permit requires periodic Congressional reauthorization since the National Park Service retains land authority over the site."

  - question: "What states have the smallest airports"
    answer: "Delaware, West Virginia, Vermont, and Wyoming have the least-trafficked primary commercial airports in the country. Wilmington Airport (ILG) in Delaware handles under 400,000 passengers annually — most Delaware residents fly out of Philadelphia or Baltimore instead. Wyoming's Jackson Hole (JAC) and Vermont's Burlington (BTV) each handle under 700,000 per year."

  - question: "Why is Anchorage such a major cargo airport"
    answer: "Ted Stevens Anchorage International (ANC) sits on great-circle polar routes between North America and Asia, making it a natural refueling and transfer point for transpacific cargo flights. FedEx, UPS, and major Asian freight carriers use ANC as a mid-route hub. It consistently ranks among the world's top five cargo airports despite handling only about 5 million passengers annually."

