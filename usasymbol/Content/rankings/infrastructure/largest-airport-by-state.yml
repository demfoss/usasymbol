faq:
  - question: "What is the busiest airport in the United States?"
    answer: "Hartsfield-Jackson Atlanta International in Georgia, with 51.5 million boardings in 2025. Its lead over Dallas/Fort Worth is more than ten million boardings."

  - question: "What is the largest airport in Texas?"
    answer: "Dallas/Fort Worth International is Texas's busiest airport, with 41.3 million boardings in 2025. Houston's George Bush Intercontinental ranks behind it."

  - question: "What is the largest airport in California?"
    answer: "Los Angeles International (LAX), with 36.5 million boardings in 2025, -3.4% from 2024."

  - question: "What is the largest airport in Florida?"
    answer: "Orlando International, with 28.0 million boardings in 2025. Theme park visitors keep it ahead of Miami, Fort Lauderdale, and Tampa."

  - question: "What is the largest airport in Colorado?"
    answer: "Denver International, with 40.0 million boardings in 2025. Denver also covers more land than any other airport in the country."

  - question: "Which state has the smallest main airport?"
    answer: "Delaware. Wilmington Airport boarded 169,382 passengers in 2025, and West Virginia's Yeager Airport in Charleston is next at 220,015."

  - question: "What do airport codes like ATL and DFW mean?"
    answer: "They are three-letter IATA codes, the ones printed on boarding passes and bag tags. Each airport also has a four-letter ICAO code used by pilots and air traffic control, such as KATL for Atlanta. The full list of [U.S. airport codes](https://goairports.org/airports/north-america/united-states/) and a guide to [IATA and ICAO codes](https://goairports.org/guides/iata-vs-icao) explain how the two systems differ, and the [GoAirports airport directory](https://goairports.org/) covers airports worldwide."

