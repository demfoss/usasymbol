- id: when-the-airport-doesnt-match-the-city
  icon: fa-solid fa-map-location-dot
  title: Airports That Serve a Neighboring State
  paragraphs:
  - Kentucky records 4,366,865 boardings at Cincinnati/Northern Kentucky International in Hebron, south of the Ohio River. Cincinnati itself sits in Ohio, but passengers boarding its airport count toward Kentucky. Airport location and the city printed on a ticket need not match.
  - Virginia’s Washington Dulles International has 13,859,569 boardings and serves Washington from outside the District of Columbia. New Jersey’s Newark Liberty similarly serves the New York metropolitan area. Travel across state lines also shapes [traffic congestion by state](/rankings/infrastructure/traffic-congestion-by-state), especially around shared metropolitan areas.
- id: fastest-growing-state-airports
  icon: fa-solid fa-chart-line
  title: Fastest Growing Airports by State
  paragraphs:
  - Delaware’s Wilmington Airport reports a 35.4% boarding increase from 2024, the largest among the state leaders. Its 169,382 boardings still put Delaware last because percentage gains measure change from an airport’s own starting point, rather than its size.
  - Wyoming’s Jackson Hole Airport reports a 10.3% increase and sits inside Grand Teton National Park. Arkansas’s Northwest Arkansas National reports 10.0% and serves the Bentonville area, home to Walmart’s headquarters. Vacation gateways and corporate travel centers appear together in this top ten, without implying that either explains the entire yearly change.
