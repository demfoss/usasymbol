  - id: "why-atlanta-has-the-busiest-airport"
    icon: "fa-solid fa-circle-question"
    title: "Why Atlanta Has the Busiest Airport"
    paragraphs:
      - "Hartsfield-Jackson is the home hub of Delta Air Lines, which is headquartered in Atlanta and runs its largest operation there. A large share of its passengers never leave the airport. They land, walk to another gate, and fly on to somewhere else in the Southeast or overseas."
      - "Atlanta's location helps too. The city sits within a short flight of most of the eastern United States, so routing connections through one Atlanta hub is cheaper for an airline than flying point to point between smaller cities."

  - id: "when-the-airport-doesnt-match-the-city"
    icon: "fa-solid fa-map-location-dot"
    title: "Airports That Serve a Neighboring State"
    paragraphs:
      - "Kentucky's busiest airport is the one Cincinnati travelers use. Cincinnati/Northern Kentucky International sits in Hebron, Kentucky, south of the Ohio River, and boarded 4.4 million passengers in 2025, more than Louisville's airport."
      - "Virginia's leader is Washington Dulles International, which serves the nation's capital from Loudoun County. New Jersey's Newark Liberty works the same way for New York City, and it ranks 12th nationally among state leaders at 23.5 million boardings."

  - id: "fastest-growing-state-airports"
    icon: "fa-solid fa-chart-line"
    title: "Fastest Growing Airports by State"
    paragraphs:
      - "Wilmington Airport in Delaware grew +35.4% in 2025, the fastest of any state leader, though from a very small base. Jackson Hole Airport in Wyoming (+10.3%) and Bozeman Yellowstone International in Montana (+6.4%) both rose as gateways to Grand Teton and Yellowstone national parks."
      - "Northwest Arkansas National grew +10.0%. It sits near Bentonville, home of Walmart's headquarters, which draws a steady stream of business travelers. At the other end, Charlotte Douglas boarded -9.3% fewer passengers than in 2024, the biggest drop among state leaders."
    table:
