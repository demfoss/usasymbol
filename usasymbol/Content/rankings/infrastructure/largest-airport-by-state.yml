sections:
  - id: "busiest-airports-by-state"
    icon: "fa-solid fa-plane-departure"
    title: "Busiest Airports by State"
    paragraphs:
      - "Georgia leads with [Hartsfield-Jackson Atlanta International](https://goairports.org/airports/north-america/united-states/atl/), which boarded 51.5 million passengers in 2025. [Dallas/Fort Worth International](https://goairports.org/airports/north-america/united-states/dfw/) in Texas is second at 41.3 million, and Chicago's O'Hare is third at 40.7 million."
      - "O'Hare grew +5.5% in 2025 while Denver held flat, which moved Chicago ahead of [Denver International](https://goairports.org/airports/north-america/united-states/den/) into third place. Most airports in the top ten are major airline hubs, where many travelers change planes rather than start or end their trip."
    table:
      numbered: true
