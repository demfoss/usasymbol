page:
  h1: Largest Airport by State
  quick_answer:
  - Largest airport by state comparisons put Georgia first with 51,459,786 boardings at Hartsfield-Jackson Atlanta International in 2025. Delta uses Atlanta as its largest connecting hub.
  - Delaware finishes last with 169,382 boardings at Wilmington Airport. Its airport shares the Greater Philadelphia travel market with a much larger airport across the state line.
  - Kentucky records 4,366,865 boardings at Cincinnati/Northern Kentucky International. The airport serving Cincinnati sits in Hebron, Kentucky, rather than Ohio.
  methodology: FAA calendar-year 2025 preliminary revenue passenger enplanements identify each state’s busiest commercial airport. Enplanements count boardings, not arrivals or airport land area. Changes compare 2024.
