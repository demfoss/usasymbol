page:
  h1: "Nuclear Power Plants by State"

  quick_answer:
    - "Nuclear power plants by state lead in Illinois, which has 11 operating reactors at six plants. Dresden, near Chicago, opened in 1960 as the first privately financed commercial nuclear plant in the country."
    - "Kansas, Missouri, Mississippi, Nebraska, New Hampshire and Washington have one reactor each. Twenty-two states have none, including every state in the Mountain West except Arizona."
    - "Georgia has six reactors, and two of them are the newest in the country. Vogtle Units 3 and 4 were the first new reactors built from scratch in the U.S. in more than three decades."

  methodology: "Operating commercial power reactor units by state from the NRC list of operating reactors, 2026 (95 units in 28 states, Palisades included, Crane excluded). States with no reactors are omitted."

  sources:
    - name: "NRC, Operating Nuclear Power Reactors"
