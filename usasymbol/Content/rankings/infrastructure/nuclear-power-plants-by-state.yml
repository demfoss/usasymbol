faq:
  - question: "Which state has the most nuclear power plants?"
    answer: "Illinois has the most reactors with 11, spread across six plants. Pennsylvania is next with eight reactors and North Carolina has seven."

  - question: "How many states have nuclear power plants?"
    answer: "Twenty-eight states have at least one operating reactor. The table lists all of them, from Alabama to Wisconsin."

  - question: "Are there nuclear power plants in Georgia?"
    answer: "Yes, Georgia has six reactors at two plants. Hatch has two older units and Vogtle has four, including the two newest reactors in the U.S."

  - question: "Does California have nuclear power plants?"
    answer: "California has one, Diablo Canyon, with two reactors on the coast of San Luis Obispo County. State lawmakers voted to keep it running past its planned closure."

  - question: "Which state has only one nuclear reactor?"
    answer: "Six states do. Kansas has Wolf Creek, Mississippi has Grand Gulf, Missouri has Callaway, Nebraska has Cooper, New Hampshire has Seabrook and Washington has Columbia Generating Station."

  - question: "Does Texas have nuclear power plants?"
    answer: "Texas has four reactors at two plants. Comanche Peak is southwest of Fort Worth and the South Texas Project sits near the Gulf Coast. Rising demand from [data centers](/rankings/infrastructure/data-centers-by-state) has revived interest in building more reactors."

