sections:
  - id: "why-illinois-has-the-most-nuclear-reactors"
    icon: "fa-solid fa-atom"
    title: "Why Illinois Has the Most Nuclear Reactors"
    paragraphs:
      - "Illinois built nuclear power early and in volume. Commonwealth Edison, the utility serving Chicago, opened Dresden Unit 1 in 1960 and kept adding reactors through the 1980s, until six plants dotted the state."
      - "Cheap cooling water and flat farmland helped. Plants sit on the Illinois, Rock and Mississippi rivers, and the Clinton reactor draws from a lake built for it."

  - id: "newest-nuclear-reactors-in-the-us"
    icon: "fa-solid fa-bolt"
    title: "Newest Nuclear Reactors in the US"
    paragraphs:
      - "Georgia's Vogtle Units 3 and 4 entered commercial service in 2023 and 2024. They were years late and billions of dollars over budget, but they were the first new reactors finished in the country in decades."
      - "Michigan's Palisades is a different kind of comeback. It closed in 2022, then received approval to return to service, which is why it still appears in the count of four."

  - id: "states-with-no-nuclear-power-plants"
    icon: "fa-solid fa-ban"
    title: "States With No Nuclear Power Plants"
    paragraphs:
      - "Twenty-two states have no operating reactor. Most of the Mountain West relies on coal, gas, hydro and wind, and Arizona's Palo Verde, with three reactors, is the region's only nuclear station."
      - "Palo Verde is unusual for another reason. It is the only large U.S. nuclear plant not on a river, lake or ocean, and it cools its reactors with treated wastewater from the Phoenix area. Compare with [renewable energy by state](/rankings/infrastructure/renewable-energy-by-state) to see which states fill the gap in other ways."

