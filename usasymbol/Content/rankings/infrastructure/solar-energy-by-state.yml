  description: "California generated 87,433 GWh of solar power in 2025, more than any other state. Texas is second and Florida third."
page:
  h1: "Solar Energy by State 2026"
  quick_answer:
    - "Solar energy by state is led by California at 87,433 gigawatthours in 2025. Abundant sun and a rule requiring panels on most new homes since 2020 have made it the clear leader."
    - "Texas ranks second at 71,470 gigawatthours after a 57.0% jump from 45,515, the largest gain in volume of any state. Florida is third at 30,130."
    - "North Dakota is last at 3 gigawatthours, a far northern state that has put its effort into wind. Kentucky grew fastest, up 312.1% from 438 to 1,805."
  methodology: "Net generation from solar photovoltaic in thousand megawatthours (gigawatthours) for 2025 and 2024 from the U.S. Energy Information Administration Electric Power Annual, Table 3.21. It combines utility-scale plants and estimated small-scale rooftop systems, and excludes solar thermal."
