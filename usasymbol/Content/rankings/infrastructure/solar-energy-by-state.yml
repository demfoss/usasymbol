sections:
  - id: why-california-generates-the-most-solar-energy
    icon: "fa-solid fa-sun"
    title: "Why California Generates the Most Solar Energy"
    paragraphs:
      - "California produced 87,433 GWh, about 16,000 GWh more than Texas. It has the largest rooftop solar market in the country, and since 2020 its building code has required solar panels on most new homes, adding to the huge desert solar farms in the Mojave."
      - "Texas has moved up fast, adding 25,955 GWh in a year on its sunny, open land and a grid that welcomes new plants. Florida comes third, and the sunniest places on the list show up again in the [Sun Belt states](/rankings/geography/sun-belt-states)."
