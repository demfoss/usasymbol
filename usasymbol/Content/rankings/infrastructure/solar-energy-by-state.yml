faq:
  - question: "Which state produces the most solar energy?"
    answer: "California, with 87,433 GWh in 2025. That is 16,000 GWh more than Texas generated."
  - question: "How much solar energy does Texas produce?"
    answer: "Texas generated 71,470 GWh in 2025, second in the country and up 57.0% from 45,515 in 2024."
  - question: "Which state produces the least solar energy?"
    answer: "North Dakota, at 3 GWh. Alaska is next lowest at 29."
  - question: "How much solar energy does Florida produce?"
    answer: "Florida generated 30,130 GWh, third in the country and up 29.5% from 2024. The Sunshine State has more sun than most, though California and Texas each generate more than twice as much."
  - question: "Does Arizona produce more solar energy than Nevada?"
    answer: "Yes, Arizona makes 20,455 GWh and Nevada 16,037. Both are desert states with some of the clearest skies in the country."
  - question: "Which states grew solar energy the most?"
    answer: "Kentucky grew fastest at 312.1%, followed by Missouri at 150.1% and Kansas at 119.1%. Only Vermont, down 0.6%, produced less solar than the year before."
