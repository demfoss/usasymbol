faq:
  - question: "Which state produces the most natural gas?"
    answer: "Texas, with 12,019,704 million cubic feet in 2024. Its wells in the Permian Basin, Eagle Ford and Haynesville shale all produce gas."
  - question: "What is the second largest natural gas producing state?"
    answer: "Pennsylvania, at 7,422,303 million cubic feet. The Marcellus shale beneath the state supplies nearly all of it."
  - question: "How much natural gas does Louisiana produce?"
    answer: "Louisiana produced 3,614,212 million cubic feet in 2024, third in the country. That was down from 4,352,670 in 2023."
  - question: "How much natural gas does West Virginia produce?"
    answer: "West Virginia produced 3,417,995 million cubic feet in 2024, fifth among states and up from 3,140,004 a year earlier."
  - question: "Does Alaska produce natural gas?"
    answer: "Yes, Alaska produced 371,876 million cubic feet in 2024, 11th among states. Most of it feeds Anchorage and the Cook Inlet region."
  - question: "Which states produce no natural gas?"
    answer: "Sixteen states report no marketed production, including Connecticut, Georgia, Hawaii, Iowa, Maine, Massachusetts, Minnesota, New Hampshire, New Jersey, North Carolina, Rhode Island, South Carolina, Vermont, Washington, Wisconsin and Delaware. The ranking covers only the 34 states that produced gas."
