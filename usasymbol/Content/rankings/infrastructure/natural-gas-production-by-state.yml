    icon: "fa-solid fa-gas-pump"
    title: "States With the Least Natural Gas Production"
    paragraphs:
      - "Missouri produced just 1 million cubic feet, Nevada 4 and Maryland 5. Maryland's gas comes from Garrett County in the far western panhandle, at the edge of the Appalachian basin."
      - "Alaska ranks 11th at 371,876 million cubic feet, mostly from Cook Inlet, which supplies the Anchorage area. Power plants that burn gas are one reason electric rates vary, as the [average electric bill by state](/rankings/economy/average-electric-bill-by-state) ranking shows."
