  - id: states-with-growing-natural-gas-production
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With Growing Natural Gas Production"
    paragraphs:
      - "Texas added 615,319 million cubic feet from 2023 to 2024, the largest gain of any state. New Mexico grew 13.6% and has almost doubled its 2020 output of 1,965,533, with associated gas from Permian oil wells doing the lifting."
      - "Louisiana went the other way, falling from 4,352,670 to 3,614,212 million cubic feet as low gas prices in 2024 slowed drilling in the Haynesville shale. West Virginia gained 8.9%, helped by the Marcellus and Utica shales that underlie the Ohio River valley."
