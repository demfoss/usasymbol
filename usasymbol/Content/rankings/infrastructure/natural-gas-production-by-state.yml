  description: "Texas produced 12,019,704 million cubic feet of marketed natural gas in 2024, the most of any state. Pennsylvania is second and Louisiana third."
page:
  h1: "Natural Gas Production by State 2026"
  quick_answer:
    - "Natural gas production by state is led by Texas at 12,019,704 million cubic feet in 2024, much of it from the Permian Basin, the Eagle Ford and the Haynesville shale."
    - "Pennsylvania ranks second at 7,422,303 million cubic feet, almost all from the Marcellus shale, which drillers first tapped on a large scale in 2004. Louisiana is third at 3,614,212."
    - "Missouri is last among the 34 producing states at 1 million cubic feet. New Mexico nearly doubled its output since 2020 and now ranks fourth at 3,599,780."
  methodology: "Marketed natural gas production in million cubic feet for 2024 and 2023 from the U.S. Energy Information Administration. State totals exclude federal offshore waters. The 16 states with no reported production and the District of Columbia are omitted."
  sources:
    - name: "U.S. Energy Information Administration. Natural Gas Marketed Production"
      url: "https://www.eia.gov/dnav/ng/ng_prod_sum_a_EPG0_VGM_mmcf_a.htm"
      description: "Annual marketed natural gas production by state, in million cubic feet"
