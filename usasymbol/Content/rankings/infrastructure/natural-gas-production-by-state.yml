sections:
  - id: why-texas-produces-the-most-natural-gas
    icon: "fa-solid fa-fire-flame-curved"
    title: "Why Texas Produces the Most Natural Gas"
    paragraphs:
      - "Texas produced 12,019,704 million cubic feet in 2024, about 1.6 times Pennsylvania. Gas comes out of the same West Texas wells that pump crude, plus the Eagle Ford shale in the south and part of the Haynesville shale in the east, so every oil boom adds to the gas total. The oil side is covered in [oil production by state](/rankings/infrastructure/oil-production-by-state)."
      - "Pennsylvania held second place because of the Marcellus shale, a gas-soaked rock layer that runs under much of the state. Large-scale drilling there began in 2004, and the state went from a minor producer to the nation's second largest."
