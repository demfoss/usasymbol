  description: "Wyoming mined 190,731 thousand short tons of coal in 2024, more than any other state. West Virginia is second and Pennsylvania third."
page:
  h1: "Coal Production by State 2026"
  quick_answer:
    - "Coal production by state is led by Wyoming at 190,731 thousand short tons in 2024, dug from the thick, shallow seams of the Powder River Basin."
    - "West Virginia ranks second at 79,533 thousand short tons, mostly from underground mines in the Appalachian coalfields. Pennsylvania is third at 40,597 and is home to nearly all American anthracite."
    - "Missouri is last among the 20 producing states at 147 thousand short tons. Alabama posted the biggest gain of any state, up 19.4% to 14,382 from its steelmaking coal mines, while Wyoming fell 19.6% from 237,261."
  methodology: "Coal production in thousand short tons for 2024 and 2023 from the U.S. Energy Information Administration Annual Coal Report, Table 1. Only states with reported coal mining are listed, and Oklahoma, which reported none in 2024, is omitted."
