faq:
  - question: "Which state produces the most coal?"
    answer: "Wyoming, with 190,731 thousand short tons in 2024. Its surface mines in the Powder River Basin work seams far thicker than any in the East."
  - question: "How much coal does West Virginia produce?"
    answer: "West Virginia produced 79,533 thousand short tons in 2024, second in the country and down 5.9% from 2023. Coal has been mined there since the 1800s, and the state is still the leading source of Appalachian steelmaking coal."
  - question: "How much coal does Pennsylvania produce?"
    answer: "Pennsylvania produced 40,597 thousand short tons, third in the country. Nearly all American anthracite comes from its northeastern fields."
  - question: "Which state produces the least coal?"
    answer: "Missouri, at 147 thousand short tons from one mine. Louisiana is next lowest at 264."
  - question: "Which states produced more coal in 2024 than in 2023?"
    answer: "Six did. Alabama rose 19.4%, Utah 7.2%, North Dakota and Missouri 5.5% each, Maryland 3.2% and Colorado 0.2%. Every other state mined less."
  - question: "Does North Dakota produce coal as well as oil?"
    answer: "Yes, 25,415 thousand short tons of lignite, sixth in the country, mostly from surface mines that feed power plants and a coal gasification plant. The state's Bakken wells put it near the top of [oil production by state](/rankings/infrastructure/oil-production-by-state) too."
