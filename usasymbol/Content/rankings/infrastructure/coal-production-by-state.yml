  - id: states-with-the-least-coal-production
    icon: "fa-solid fa-gem"
    title: "States With the Least Coal Production"
    paragraphs:
      - "Missouri produced just 147 thousand short tons from a single mine, and Louisiana 264 from another. Louisiana's mine digs lignite, the soft brown coal that also feeds nearby power plants in Mississippi and Texas."
      - "Alaska's 1,004 comes from one mine near Healy, which supplies power plants around Fairbanks. Where coal fades, renewables often fill the gap, as the [renewable energy by state](/rankings/infrastructure/renewable-energy-by-state) ranking shows."
