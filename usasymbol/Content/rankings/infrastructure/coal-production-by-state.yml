sections:
  - id: why-wyoming-produces-the-most-coal
    icon: "fa-solid fa-industry"
    title: "Why Wyoming Produces the Most Coal"
    paragraphs:
      - "Wyoming mined more than twice as much coal as West Virginia. The Powder River Basin holds seams up to 100 feet thick under shallow cover, so crews strip the rock off and load coal straight from open pits instead of tunneling for it, which keeps costs among the lowest in the world."
      - "The coal is sub-bituminous, low in sulfur and burned mostly in power plants, and trains carry it to utilities across the country. Output fell from 237,261 to 190,731 as plants switched to natural gas and [wind energy](/rankings/infrastructure/wind-energy-by-state)."
