  - id: west-virginia-and-appalachian-coal-production
    icon: "fa-solid fa-mountain"
    title: "West Virginia and Appalachian Coal Production"
    paragraphs:
      - "West Virginia produced 79,533 thousand short tons, and most of it came out of underground mines in the northern and southern coalfields. Much of that bituminous coal is the metallurgical grade that steelmakers turn into coke, which is why the state stays on top of the list across the [Appalachian states](/rankings/geography/appalachian-states)."
      - "Pennsylvania mines 2,958 thousand short tons of anthracite, a hard coal found around Scranton and Wilkes-Barre. Alabama grew 19.4% on its Warrior Basin steelmaking coal, while Kentucky shrank 14.2%."
