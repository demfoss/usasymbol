faq:
  - question: "Which state has the most registered vehicles?"
    answer: "California has the most at 30,940,652, ahead of Texas at 23,606,401 and New York at 20,991,098. Their large populations explain most of that."

  - question: "Which state has the most vehicles per capita?"
    answer: "Montana, with 2,174.8 per 1,000 residents, followed by South Dakota (1,521.5) and Wyoming (1,492.7). Montana's count includes 447,943 motorcycles."

  - question: "How many registered vehicles are in Texas?"
    answer: "Texas has 23,606,401 registered vehicles, second only to California. That works out to 754.4 per 1,000 residents, 43rd in the country."

  - question: "How many registered vehicles are in California?"
    answer: "California has 30,940,652, the most of any state. Per 1,000 residents it ranks 41st at 784.7."

  - question: "Which state has the fewest cars per person?"
    answer: "Delaware is lowest at 425.0 per 1,000 residents, followed by New Jersey at 658.5 and Kansas at 675.8."

  - question: "Why do rural states have more vehicles per person?"
    answer: "Distances between towns are long and public transit is scarce, so each adult often needs a vehicle and many households keep several pickups. For the models people buy, see the [most popular car by state](/rankings/culture/most-popular-car-by-state), and for where they are sold, [car dealerships by state](/rankings/economy/car-dealerships-by-state)."

