  description: "Montana has the most registered vehicles per 1,000 residents at 2,174.8. Delaware has the fewest at 425.0. California leads in total at 30,940,652."

page:
  h1: "Registered Vehicles by State"

  quick_answer:
    - "Registered vehicles by state are most numerous per resident in Montana, at 2,174.8 per 1,000 residents. Long distances and a huge fleet of trucks and motorcycles give it more than two vehicles for every person."
    - "Delaware has the fewest at 425.0 per 1,000 residents. Its 447,094 reported vehicles look low, because the state's own records count 990,678 registered that year."
    - "California registers the most vehicles in total at 30,940,652, yet ranks only 41st per 1,000 residents at 784.7. New York is 8th at 1,056.6, and its total of 20,991,098 is third in the country."

  methodology: "FHWA Highway Statistics 2024, Table MV-1, all registered motor vehicles including publicly owned ones. Per 1,000 residents uses Census Bureau July 1, 2024 estimates. D.C. is excluded. The U.S. figure is the population-weighted average of the 50 states."

  sources:
    - name: "FHWA, Highway Statistics 2024, Table MV-1 State Motor-Vehicle Registrations"
      url: "https://www.fhwa.dot.gov/policyinformation/statistics/2024/mv1.cfm"
      description: "Total registered motor vehicles by state for 2024, published January 2026"
    - name: "U.S. Census Bureau, Annual Estimates of the Resident Population (NST-EST2024)"
      url: "https://www.census.gov/data/tables/time-series/demo/popest/2020s-state-total.html"
      description: "State population estimates for July 1, 2024"
    - name: "Delaware State Police, 2024 Annual Traffic Statistical Report"
      url: "https://dsp.delaware.gov/wp-content/uploads/sites/118/2025/07/2024-Annual-Traffic-Statistical-Report.pdf"
      description: "Registered vehicle count for Delaware cited in the row note and text"

