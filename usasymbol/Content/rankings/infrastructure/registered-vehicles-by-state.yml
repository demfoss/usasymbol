  - id: "states-with-the-fewest-registered-vehicles"
    title: "States With the Fewest Registered Vehicles"
    paragraphs:
      - "Delaware sits last at 425.0 per 1,000 residents, with 447,094 vehicles reported for 1,051,917 people. State records count 990,678 registered vehicles for 2024, well above the federal figure."
      - "New Jersey (658.5) and Massachusetts (713.9) come next among large states. Commuter rail into New York and Boston, plus dense towns, let many households do without a second car, a pattern also seen in [public transit usage by state](/rankings/infrastructure/public-transit-usage-by-state). Kansas (675.8) and Nevada (731.1) round out the bottom five."
