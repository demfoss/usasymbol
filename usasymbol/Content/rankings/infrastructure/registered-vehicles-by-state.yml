sections:
  - id: "why-montana-has-the-most-registered-vehicles"
    title: "Why Montana Has the Most Registered Vehicles"
    paragraphs:
      - "Montana has 2,473,269 registered vehicles for 1,137,233 residents. Trucks make up 1,494,471 of them and motorcycles 447,943, a huge count for so few people. The state has no general sales tax, and its registration rules have long drawn owners from other states who register vehicles through Montana companies."
      - "South Dakota follows at 1,521.5, Wyoming at 1,492.7, and North Dakota at 1,351.7. Ranch work, long drives between towns, and the pickup truck as the default family vehicle push counts up in all three, and public transit barely exists outside a few cities."

  - id: "states-with-the-most-registered-vehicles"
    title: "States With the Most Registered Vehicles"
    paragraphs:
      - "California registers 30,940,652 vehicles, the most of any state, followed by Texas with 23,606,401 and New York with 20,991,098. Population does the work here, and California lands only 41st per 1,000 residents at 784.7. Texas ranks 43rd at 754.4."
      - "New York is the exception among the giants, at 1,056.6 per 1,000 residents in 8th place. Upstate and Long Island households drive everywhere, even though most New York City households do without a car. Florida counts 19,696,080 vehicles but ranks 34th at 842.7."
