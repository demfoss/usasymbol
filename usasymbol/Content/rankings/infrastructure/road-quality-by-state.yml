faq:
  - question: "Which state has the worst roads?"
    answer: "Hawaii ranks 50th overall, with 26% of urban and 16% of rural pavement rated rough. By share of major roads in poor condition, Rhode Island is worst at 37.2%."

  - question: "Which state has the best roads?"
    answer: "New Hampshire ranks first. Only 8% of its urban pavement and 3% of its rural pavement rate as rough, and Minnesota and Vermont follow close behind."

  - question: "What percentage of US roads are in poor condition?"
    answer: "13.1% of major roads were in poor condition in 2024, up from 11.8% in 2000. FHWA rates a road as poor when its roughness index exceeds 170 inches per mile."

  - question: "Which states spend the most on roads?"
    answer: "Massachusetts, New York, and New Jersey each spent more than $250,000 per lane-mile of highway. Five states, Missouri, South Carolina, West Virginia, North Dakota, and South Dakota, spent under $30,000."

  - question: "Which state has the highest road fatality rate?"
    answer: "Alaska, South Carolina, and Hawaii have the highest rural fatality rates, above 1.80 deaths per 100 million vehicle-miles. Minnesota posts the best urban rate and Maryland the lowest rural rate."

  - question: "Are roads worse in cities or rural areas?"
    answer: "Urban pavement is rougher in almost every state. California shows the extreme, 44% rough urban pavement against 5% rural, while Alaska and Maryland are the rare states where rural roads rate worse."

