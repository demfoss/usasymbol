sections:
  - id: "best-roads"
    icon: "fa-solid fa-road"
    title: "States with the Best Roads"
    paragraphs:
      - "New Hampshire ranks first, with 8% of urban pavement and 3% of rural pavement rated rough. Minnesota follows in second at 5% urban, and it also posts the country's best urban fatality rate."
      - "Alabama, Florida, Georgia, Kansas, Missouri, Nevada, and North Carolina keep rural roughness at just 1%. Reason Foundation's cost-effectiveness ranking puts Virginia and Georgia at the top nationally."

  - id: "worst-roads"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States with the Worst Roads"
    paragraphs:
      - "Hawaii ranks 50th, with 26% of urban and 16% of rural pavement rated rough. Rhode Island at 49th combines 41% rough urban pavement with 17% rural, the worst rural figure in the country."
      - "Rhode Island also leads the FHWA poor-pavement measure, with 37.2% of its major roads in poor condition. Massachusetts follows at 27%, California at 26.6%, and Hawaii at 26.5%, against a national average of 13.1%."

  - id: "urban-vs-rural-roads"
    icon: "fa-solid fa-city"
    title: "Urban vs Rural Road Conditions"
    paragraphs:
      - "California shows the widest urban-rural gap, with 44% of urban pavement rated rough, the highest share in the country, against just 5% on rural roads. New York runs 30% urban versus 4% rural."
      - "Alaska and Maryland reverse the pattern. Alaska's rural roads are rougher at 16% versus 9% urban, and Maryland pairs the nation's best urban figure of 1% with 3% rural."

  - id: "highway-spending"
    icon: "fa-solid fa-sack-dollar"
    title: "Highway Spending by State"
    paragraphs:
      - "Massachusetts, New York, and New Jersey each spent more than $250,000 per lane-mile, the highest rates in the Reason Foundation report. Missouri, South Carolina, West Virginia, North Dakota, and South Dakota spent less than $30,000."
      - "Money alone does not buy smooth pavement. Massachusetts ranks 39th for road quality despite its top-tier spending, while low-spending Missouri sits 13th."

  - id: "road-fatalities"
    icon: "fa-solid fa-car-burst"
    title: "Road Fatalities by State"
    paragraphs:
      - "Alaska, South Carolina, and Hawaii post the highest rural fatality rates, each above 1.80 deaths per 100 million vehicle-miles. Half the states exceed 1.0 on urban roads, including New Mexico, Wyoming, and Mississippi."
      - "Minnesota records the best urban fatality rate in the country, and Maryland has the lowest rural rate. Both states also place in the top 15 for pavement quality."

