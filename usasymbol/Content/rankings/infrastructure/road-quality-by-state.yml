page:
  h1: "Road Quality by State"

  quick_answer:
    - "Road quality by state is highest in New Hampshire, ranked first with 8% rough urban pavement and 3% rural. Minnesota and Vermont follow in second and third."
    - "Hawaii ranks last at 50th, with 26% of urban and 16% of rural pavement rated rough. Rhode Island sits 49th, and 37.2% of its major roads are in poor condition, the largest share nationally."
    - "California's 44% rough urban pavement is the highest in the country, against just 5% on its rural roads. Nationally, 13.1% of major roads were in poor condition in 2024, up from 11.8% in 2000."

  methodology: "Rankings use the ConsumerAffairs 2023 road conditions study, with the share of rough urban and rural pavement per state. Poor-pavement, spending, and fatality figures come from FHWA data and the Reason Foundation Annual Highway Report."

  sources:
    - name: "World Population Review — Road Quality by State"
      url: "https://worldpopulationreview.com/state-rankings/road-quality-by-state"
      description: "State road quality ranks with urban and rural pavement roughness, 2023"
    - name: "Construction Coverage — U.S. States With the Worst Roads"
      url: "https://constructioncoverage.com/research/states-with-the-worst-roads"
      description: "Share of major roads in poor condition by state, FHWA data"
