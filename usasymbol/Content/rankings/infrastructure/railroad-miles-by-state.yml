faq:
  - question: "Which state has the most railroad miles"
    answer: "Texas has the most railroad miles of any U.S. state with 10,370 rail miles, according to AAR 2021 data. Illinois is second with 6,768 miles and Pennsylvania is third with 5,228 miles."

  - question: "How many railroad miles are in the United States"
    answer: "The United States has approximately 136,667 total rail miles across all states, based on Association of American Railroads 2021 state rankings data. Texas alone accounts for about 7.6% of that national total."

  - question: "Is railroad mileage the same as passenger rail service"
    answer: "No. Most U.S. railroad mileage is freight rail, not passenger service. Amtrak operates passenger service on roughly 21,400 miles of track, most of it owned by freight railroads. A state can have extensive freight rail miles with little or no scheduled passenger service."

  - question: "What is the difference between rail miles and track miles"
    answer: "Rail miles (route miles) measure the length of a corridor once, regardless of how many parallel tracks it has. Track miles count every parallel track separately. A double-tracked 100-mile corridor is 100 route miles but 200 track miles. AAR state figures use route miles, which may undercount total physical track in dense corridors."

  - question: "Why does Texas have so many railroad miles"
    answer: "Texas combines the largest land area of any contiguous state with major freight demand: Gulf Coast ports, Permian Basin oil and gas fields, agricultural export corridors, and large manufacturing centers. BNSF and Union Pacific built extensive networks across the state in the 19th century to connect these markets, and the network has grown since."

  - question: "What state has no railroad"
    answer: "Hawaii is the only U.S. state with no freight railroad. Plantation-era narrow-gauge railroads once operated on individual islands but closed by the mid-20th century. Hawaii's island geography and reliance on air and sea freight made a modern rail network economically impractical."

