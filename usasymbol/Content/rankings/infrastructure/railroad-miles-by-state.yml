  methodology: "Rail mileage figures are from the Association of American Railroads (AAR) State Rankings 2021 report. Figures represent total route miles of railroad operated in each state. Trackage rights, yard tracks, sidings, and parallel lines may be excluded depending on the reporting carrier."

