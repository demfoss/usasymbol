sections:
  - id: "most-rail-miles"
    icon: "fa-solid fa-train"
    title: "States With the Most Railroad Miles"
    paragraphs:
      - "Texas has 10,370 rail miles -- nearly 3,600 more than second-place Illinois. The Texas network serves Gulf Coast ports, Permian Basin and Eagle Ford energy corridors, and major agricultural export hubs. BNSF and Union Pacific together operate the large majority of Texas mileage."
      - "Illinois (6,768 miles) ranks second largely because of Chicago, the largest rail interchange hub in North America. Seven Class I railroads converge on Chicago, making it the primary switching point for east-west freight moving across the country. Pennsylvania (5,228 miles) connects the industrial Northeast with Midwest markets."
      - "Ohio and California each exceed 5,000 miles. Kansas (4,914), Georgia (4,636), and Minnesota (4,617) round out the top 8. Seven of the top 10 states by rail mileage are in the Midwest or Great Plains, reflecting the region's grain corridors and the long distances between agricultural production areas and port cities."

  - id: "fewest-rail-miles"
    icon: "fa-solid fa-map-pin"
    title: "States With the Fewest Railroad Miles"
    paragraphs:
      - "Hawaii has no freight railroad. The island state's terrain and geography made a rail network economically unworkable; plantation-era narrow-gauge lines once operated on individual islands but all closed by the mid-20th century."
      - "Washington D.C. records 17 rail miles within its compact federal boundaries. Rhode Island (143 miles) and Delaware (230 miles) are the smallest states in the continental U.S. by land area and have rail totals to match. New Hampshire (369 miles) has fewer route miles than any state in the continental Northeast."
      - "Alaska (506 miles) has more land area than any other state but ranks 46th in rail mileage. Nearly all of that total is the state-owned Alaska Railroad, which runs approximately 470 miles between Seward and Fairbanks. The Alaska system has no physical connection to the contiguous U.S. rail network."

  - id: "what-counts"
    icon: "fa-solid fa-circle-info"
    title: "What Counts as Railroad Miles?"
    paragraphs:
      - "The AAR state mileage figures represent route miles -- the length of each rail corridor measured once, regardless of how many parallel tracks run along it. A double-tracked main line counts as 1 route mile, not 2. Yard tracks, sidings, and trackage rights are also generally excluded."
      - "The Bureau of Transportation Statistics distinguishes between miles of road owned (route miles), track miles (including all parallel tracks), and operated track miles. A Chicago-area corridor with four parallel main tracks might show as 1 route mile but 4 track miles. The AAR figures follow the route-mile methodology, which may undercount physical infrastructure in dense freight corridors."

  - id: "why-some-states"
    icon: "fa-solid fa-route"
    title: "Why Some States Have More Railroad Miles"
    paragraphs:
      - "Land area is the clearest predictor. Texas, Montana, Kansas, and Nebraska each combine large territories with dense agricultural or energy freight that demanded early rail investment. Plains states needed rail to move grain from farm to port before roads or trucks existed."
      - "Illinois benefits from Chicago's role as the national east-west interchange point. Every major transcontinental freight corridor either passes through or connects to Chicago, which drives Illinois mileage well above what its land area alone would suggest."
      - "Coastal states tend to have fewer rail miles because freight can move by ship along the coast. Hawaii has no freight rail at all. Small New England states are constrained by both geography and the high population density that limits rail rights-of-way."

