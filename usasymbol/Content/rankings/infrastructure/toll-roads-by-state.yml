faq:
  - question: "Which state has the most toll roads?"
    answer: "Texas, with about 639 miles of toll road, spread across tollway systems in Houston, Dallas, and Austin. Oklahoma (603 miles) and Florida (584 miles) rank second and third."

  - question: "Which states have no toll roads?"
    answer: "Twenty-one states have zero toll road miles: Alaska, Arizona, Arkansas, Connecticut, Hawaii, Idaho, Iowa, Kentucky, Michigan, Mississippi, Missouri, Montana, Nebraska, New Mexico, North Dakota, Oregon, Rhode Island, South Dakota, Tennessee, Wisconsin, and Wyoming."

  - question: "Do any toll-free states still charge tolls on bridges?"
    answer: "Yes. Michigan and Kentucky both toll river-crossing bridges without operating any toll roads, Alaska tolls its single Whittier tunnel, and Rhode Island tolls the Newport Pell Bridge. FHWA counts toll roads separately from toll bridges and tunnels, so these states show zero toll road miles even though drivers there can still pay a toll."

  - question: "How many toll road miles are there in the United States?"
    answer: "The combined Interstate and non-Interstate toll road network totals roughly 6,300 miles across the 29 states that have any, according to FHWA's Toll Facilities in the United States report."

  - question: "What is the oldest toll road in the United States still in use?"
    answer: "The Pennsylvania Turnpike, which opened in 1940, is generally considered the country's first long-distance toll superhighway. The New York State Thruway and New Jersey Turnpike followed in the early 1950s, and both remain the backbone of their states' toll networks today."

