          toll_miles: 223.2
    paragraphs:
      - "Texas leads with about 639 toll road miles, spread across the Sam Houston Tollway and Grand Parkway around Houston, the Dallas North Tollway, and Austin's toll network. Oklahoma (603 miles) and Florida (584 miles) are close behind, both anchored by statewide turnpike systems rather than a single road."
      - "New York's 566 miles are dominated by one facility: the New York State Thruway alone runs about 570 miles from New York City to the Pennsylvania and Canadian borders. Pennsylvania's total is similarly concentrated in the 550-mile Pennsylvania Turnpike, and Kansas's 236 miles match the length of the Kansas Turnpike almost exactly — in each case, a single legacy turnpike does nearly all the work."

  - id: "toll-free-states"
    icon: "fa-solid fa-road-circle-xmark"
    title: "States with No Toll Roads at All"
    table:
