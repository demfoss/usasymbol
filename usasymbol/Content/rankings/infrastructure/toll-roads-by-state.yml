page:
  h1: "Toll Roads by State"

  quick_answer:
    - "Texas has more toll road mileage than any state, about 639 miles across its Houston, Dallas, and Austin tollway networks. Oklahoma (603 miles) and Florida (584 miles) follow, both built around statewide turnpike systems."
    - "Twenty-one states have no toll roads at all: Alaska, Arizona, Arkansas, Connecticut, Hawaii, Idaho, Iowa, Kentucky, Michigan, Mississippi, Missouri, Montana, Nebraska, New Mexico, North Dakota, Oregon, Rhode Island, South Dakota, Tennessee, Wisconsin, and Wyoming."
    - "Toll-free doesn't always mean toll-free. Michigan and Kentucky charge tolls on cross-river bridges, Alaska tolls its lone Whittier Tunnel, and Rhode Island tolls the Newport Pell Bridge — none has a single mile of tolled roadway."

  methodology: "Mileage figures combine the Federal Highway Administration's Interstate and non-Interstate toll road tables from its Toll Facilities in the United States report, covering facilities in operation as of January 1, 2023. The FHWA tracks toll roads separately from toll bridges, tunnels, and ferries, so a state can show zero toll road miles here while still operating tolled bridges or tunnels elsewhere."

  sources:
    - name: "Federal Highway Administration — Toll Facilities in the United States"
      url: "https://www.fhwa.dot.gov/policyinformation/tollpage/page00.cfm"
      description: "Official federal inventory of toll roads, bridges, tunnels, and ferries by state, as of January 1, 2023"
    - name: "Wikipedia — List of Toll Roads in the United States"
      url: "https://en.wikipedia.org/wiki/List_of_toll_roads_in_the_United_States"
      description: "State-by-state directory of named toll roads, turnpikes, and express-lane systems"
    - name: "IBTTA — International Bridge, Tunnel and Turnpike Association"
      url: "https://www.ibtta.org"
      description: "Industry association representing toll road, bridge, and tunnel operators across North America"

