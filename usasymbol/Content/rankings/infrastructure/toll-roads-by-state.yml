        - state: "Oregon"
          state_slug: "oregon"
          status: "Toll-Free"
        - state: "Rhode Island"
          state_slug: "rhode-island"
          status: "Toll-Free (toll bridges only)"
        - state: "South Dakota"
          state_slug: "south-dakota"
          status: "Toll-Free"
        - state: "Tennessee"
          state_slug: "tennessee"
          status: "Toll-Free"
        - state: "Wisconsin"
          state_slug: "wisconsin"
          status: "Toll-Free"
        - state: "Wyoming"
          state_slug: "wyoming"
          status: "Toll-Free"
    paragraphs:
      - "Twenty-one states operate zero miles of toll road, per FHWA's inventory. Most cluster in the West (Arizona, Idaho, Montana, Wyoming, New Mexico, the Dakotas) and the South (Arkansas, Mississippi, Tennessee), where lower population density and heavier reliance on federal highway funding made tolling less necessary than in the traffic-choked Northeast and Midwest."
      - "'No toll roads' isn't the same as 'no tolls.' Michigan and Kentucky both charge tolls on river-crossing bridges — Michigan's Blue Water and Ambassador bridges to Canada, Kentucky's RiverLink bridges over the Ohio River — without a single mile of tolled roadway between them. Rhode Island tolls the Newport Pell Bridge, and Alaska tolls the Anton Anderson Memorial Tunnel at Whittier, its lone highway tunnel."

  - id: "famous-toll-roads"
    icon: "fa-solid fa-signs-post"
    title: "The Most Iconic Toll Roads by State"
    paragraphs:
      - "Some toll roads are landmarks in their own right. The New York State Thruway, Pennsylvania Turnpike, and New Jersey Turnpike were among the country's first long-distance toll superhighways in the 1940s and '50s, and all three still carry their state's entire toll network on their backs. The Kansas Turnpike and Oklahoma's Turner and Will Rogers turnpikes followed the same model in the Plains."
      - "Newer toll roads lean on electronic collection instead of legacy turnpikes: Florida's Turnpike and its Orlando- and Miami-area extensions, Texas's Dallas North Tollway and Grand Parkway, and Colorado's E-470 loop around Denver were all built or heavily expanded after 2000. Express toll lanes — priced lanes running alongside free ones — have since spread into states like Georgia, Minnesota, and Washington that otherwise have modest toll road totals."

