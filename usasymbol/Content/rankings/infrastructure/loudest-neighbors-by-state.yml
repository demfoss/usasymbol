sections:
  - id: "states-with-the-highest-noise-scores"
    icon: "fa-solid fa-volume-high"
    title: "States With the Highest Noise Scores"
    paragraphs:
      - "New Jersey ranks first with a noise score of 52.87, built on 144.9 construction permits per 100,000 residents and 50,374.5 daily commuters per square mile. Massachusetts is second at 41.31, with 46,321.5 commuters per square mile."
      - "Pennsylvania is third at 38.37 despite logging 871,436.3 daily commuters per square mile, the highest traffic figure in the table. Florida follows at 36.81, driven by 463.2 permits per 100,000 residents, and Rhode Island rounds out the top five at 35.54."

  - id: "states-with-the-lowest-noise-scores"
    icon: "fa-solid fa-volume-off"
    title: "States With the Lowest Noise Scores"
    paragraphs:
      - "Alaska has the lowest noise score at 8.02, with only 11.6 daily commuters per square mile, the lowest traffic figure of any state. Minnesota is second-lowest at 9.27, and Montana follows at 9.67."
      - "North Dakota is next at 10.01, and Kansas is at 10.35. Nebraska is at 10.55, and every state in this cluster reports fewer than 3,200 daily commuters per square mile."

  - id: "states-with-the-most-construction-permits"
    icon: "fa-solid fa-hard-hat"
    title: "States With the Most Construction Permits"
    paragraphs:
      - "Idaho logs 647.1 construction permits per 100,000 residents, the highest rate in the table, yet its total score of 20.29 ranks only 21st. South Carolina is close behind at 642.8 permits, with a score of 26.36."
      - "North Carolina posts 548.6 permits per 100,000 residents and ranks 14th overall at 24.86. Delaware combines 499.0 permits with 39,487.9 daily commuters per square mile for a score of 32.16, sixth highest in the table."

