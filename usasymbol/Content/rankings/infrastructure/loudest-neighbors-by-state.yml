faq:
  - question: "Which state has the loudest neighbors?"
    answer: "New Jersey ranks first with a noise score of 52.87. It combines 144.9 construction permits per 100,000 residents with 50,374.5 daily commuters per square mile."

  - question: "Which state has the quietest neighbors?"
    answer: "Alaska has the lowest noise score at 8.02, with just 11.6 daily commuters per square mile, the lowest traffic figure in the table."

  - question: "Which state has the most construction permits per capita?"
    answer: "Idaho has the highest rate at 647.1 permits per 100,000 residents. Its total score of 20.29 ranks only 21st, since its daily commuter traffic is just 988.7 per square mile."

  - question: "Which state has the heaviest daily traffic?"
    answer: "Pennsylvania logs 871,436.3 daily commuters per square mile, far above Connecticut's 56,350.6 and New Jersey's 50,374.5."

  - question: "What is the noise score in California?"
    answer: "California scores 22.65, ranking 17th, with 131.4 construction permits per 100,000 residents and 9,279.0 daily commuters per square mile."

  - question: "What is the noise score in Texas?"
    answer: "Texas scores 18.51, ranking 25th. Its 440.2 construction permits per 100,000 residents pair with 19,578.7 daily commuters per square mile."

