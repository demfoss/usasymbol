faq:
  - question: "Which state has the most Heisman Trophy winners?"
    answer: "California, with 15 winners born there between 1946 and 2023. Ohio and Texas share second place with 9 each."

  - question: "How many Heisman winners are from Texas?"
    answer: "Texas has 9, starting with Davey O'Brien in 1938 and ending so far with Kyler Murray in 2018. Doak Walker, Earl Campbell, and Johnny Manziel are also on the list."

  - question: "How many Heisman winners are from Ohio?"
    answer: "Nine players born in Ohio have won, but they account for 10 trophies. Archie Griffin won in both 1974 and 1975, the only back-to-back winner in Heisman history."

  - question: "Who was the most recent Heisman Trophy winner?"
    answer: "Fernando Mendoza of Indiana won the 2025 award. He was born in Boston, which gives Massachusetts 3 winners, alongside Angelo Bertelli in 1943 and Joe Bellino in 1960."

  - question: "Has anyone born outside the United States won the Heisman?"
    answer: "Yes, three players. Frank Sinkwich was born in Croatia, Tim Tebow in the Philippines, and Robert Griffin III in Japan."

  - question: "Did Reggie Bush keep his Heisman Trophy?"
    answer: "Bush forfeited the 2005 award in 2010 after NCAA sanctions at USC, and the Heisman Trust reinstated it on April 24, 2024. California's total of 15 includes him."

