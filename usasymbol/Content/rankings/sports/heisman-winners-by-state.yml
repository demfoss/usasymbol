sections:
  - id: "why-california-has-the-most-heisman-winners"
    title: "Why California Has the Most Heisman Winners"
    paragraphs:
      - "California is the birthplace of 15 Heisman winners, from Glenn Davis in 1946 to Jayden Daniels in 2023. Seven of them, Mike Garrett, O.J. Simpson, Charles White, Marcus Allen, Carson Palmer, Matt Leinart, and Reggie Bush, won it at USC, which made Southern California the most dependable pipeline to the trophy."
      - "Not every Californian stayed home. Ricky Williams won at Texas and Rashaan Salaam at Colorado. Bush's 2005 award was vacated in 2010 and reinstated in April 2024, so he counts here."
    table:
      columns:
        rank: "Rank"
        state: "State"
        winners: "Winners"
        latest_winner: "Latest Winner"
      rows:
        - { rank: 1, state: "California", winners: "15", latest_winner: "Jayden Daniels (2023)" }
        - { rank: 2, state: "Ohio", winners: "9", latest_winner: "Troy Smith (2006)" }
        - { rank: 2, state: "Texas", winners: "9", latest_winner: "Kyler Murray (2018)" }
        - { rank: 4, state: "Pennsylvania", winners: "7", latest_winner: "Bryce Young (2021)" }
        - { rank: 5, state: "Florida", winners: "5", latest_winner: "Travis Hunter (2024)" }
        - { rank: 6, state: "Georgia", winners: "4", latest_winner: "Cam Newton (2010)" }
        - { rank: 6, state: "Oklahoma", winners: "4", latest_winner: "Sam Bradford (2008)" }

  - id: "ohio-and-texas-heisman-winners"
    title: "Ohio and Texas Heisman Winners"
    paragraphs:
      - "Ohio and Texas tie at 9, but Ohio has handed out 10 trophies. Archie Griffin of Columbus won in 1974 and 1975 at Ohio State and remains the only two-time winner. Ohio's list also includes Larry Kelley, the 1936 winner, and Desmond Howard and Charles Woodson in the 1990s."
      - "Texas supplied Davey O'Brien in 1938 and Johnny Manziel in 2012, plus two quarterbacks who left the state. Baker Mayfield and Kyler Murray, both Texas-born, won in back-to-back years at Oklahoma, whose seven titles appear in [college football national championships by state]. Texas also fields the most FBS programs of any state, as shown in [college football attendance by state]."

  - id: "heisman-winners-born-outside-the-states"
    title: "Heisman Winners Born Outside the States"
    paragraphs:
      - "Three Heisman winners were born abroad. Frank Sinkwich, the 1942 winner, was born in Croatia, Tim Tebow in the Philippines, and Robert Griffin III in Japan."
      - "Caleb Williams, the 2022 winner, was born in Washington, D.C. The district is not a state, so he sits outside the table. Massachusetts, meanwhile, gained its third winner when Fernando Mendoza, born in Boston, won in 2025."
