faq:
  - question: "Which state has produced the most NBA players?"
    answer: "California, with 481 NBA and ABA players born there. New York is close behind at 461, and Illinois is third at 324."

  - question: "How many NBA players are from Texas?"
    answer: "Texas is the birthplace of 229 players, which ranks fifth. Chris Bosh, born in Dallas, is one of the best known."

  - question: "How many NBA players are from Illinois?"
    answer: "Illinois has 324, the third-highest total. Most come from Chicago, home to Derrick Rose, Dwyane Wade, and Anthony Davis."

  - question: "How many NBA players are from Indiana?"
    answer: "Indiana has 186 and ranks seventh. Larry Bird, born in West Baden Springs, is the most famous of them."

  - question: "Which state has no NBA players?"
    answer: "Vermont, where no NBA or ABA player has been born. Alaska, Hawaii, and New Hampshire are next with 2 each."

  - question: "Which NBA players were born in California?"
    answer: "Gary Payton, Jason Kidd, Russell Westbrook, and Klay Thompson were all born in the state. California's total of 481 is the highest in the country."

