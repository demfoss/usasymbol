page:
  h1: "NBA Players Born by State"

  quick_answer:
    - "California is the birthplace of more NBA and ABA players than any other state at 481, a lead built on the nation's largest population and playgrounds that stay open all year."
    - "New York is second at 461, only 20 behind California, and Illinois is third at 324. Indiana, at 186, outproduces much larger Florida at 141."
    - "Vermont is the only state that has never produced an NBA or ABA player. Alaska, Hawaii, and New Hampshire sit at the bottom of the table with 2 each."

  methodology: "Counts NBA, BAA, and ABA players by US birth state from Basketball-Reference's birthplace list, as of November 5, 2026. Only players who reached an NBA, BAA, or ABA roster qualify. Vermont has no player on record and is omitted. District of Columbia and foreign-born players are excluded."

