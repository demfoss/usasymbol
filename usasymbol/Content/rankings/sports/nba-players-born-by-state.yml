  - id: "nba-players-from-indiana-and-kentucky"
    icon: "fa-solid fa-trophy"
    title: "NBA Players From Indiana and Kentucky"
    paragraphs:
      - "Indiana is seventh with 186 players, ahead of Florida at 141 and Georgia at 166, both much larger states. Basketball is the state's obsession. Tiny Milan High School won the 1954 state title, the story behind the film Hoosiers, and Larry Bird grew up in French Lick and was born in nearby West Baden Springs."
      - "Kentucky, at 127, lands 14th and beats Tennessee at 109 and Massachusetts at 51. Its pull comes from college hoops, where Wildcats fans fill arenas, as in [college basketball national championships by state]. Franchise locations tell a different story in [NBA teams by state]."
    table:
      columns:
        rank: "Rank"
        state: "State"
        players: "Players"
      rows:
