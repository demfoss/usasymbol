sections:
  - id: "why-california-has-the-most-nba-players"
    icon: "fa-solid fa-basketball"
    title: "Why California Has the Most NBA Players"
    paragraphs:
      - "California is the birthplace of 481 NBA and ABA players. It has the biggest population of any state and courts that stay playable year-round, and the list runs from Gary Payton in Oakland and Jason Kidd in San Francisco to Russell Westbrook in Long Beach and Klay Thompson in Los Angeles."
      - "New York finishes only 20 behind with a far smaller population. Its output comes largely from New York City, where schoolyard and park games such as those at Rucker Park in Harlem made pickup basketball a proving ground. Kareem Abdul-Jabbar, born in Manhattan, is the most decorated name on the list."
    table:
      columns:
        rank: "Rank"
        state: "State"
        players: "Players"
      rows:
