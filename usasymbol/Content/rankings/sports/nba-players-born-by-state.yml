  - id: "states-with-the-fewest-nba-players"
    icon: "fa-solid fa-map-pin"
    title: "States With the Fewest NBA Players"
    paragraphs:
      - "Vermont is the only state with no NBA or ABA player on record, which is why it is missing from the table. Alaska, Hawaii, and New Hampshire follow with just 2 each, and Maine has 3."
      - "Small populations explain most of it, since Vermont is one of the least populated states in the country. Alaska and Hawaii add distance, as a player from either state has to find high-level competition thousands of miles from the mainland."
