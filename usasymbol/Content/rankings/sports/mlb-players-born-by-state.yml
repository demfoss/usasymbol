page:
  h1: "MLB Players Born by State"

  quick_answer:
    - "California is the birthplace of more major league players than any other state at 2,556, helped by a huge population and a baseball season that never has to wait for spring."
    - "Pennsylvania ranks second at 1,528, ahead of New York at 1,289 and Texas at 1,215. Missouri, at 692, outproduces Georgia, Alabama, and New Jersey."
    - "Alaska ranks last at 13 and Wyoming is next at 17, since short summers leave little time for the sport."

