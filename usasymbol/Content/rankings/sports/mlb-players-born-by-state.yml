sections:
  - id: "why-california-has-the-most-mlb-players"
    icon: "fa-solid fa-baseball"
    title: "Why California Has the Most MLB Players"
    paragraphs:
      - "California is the birthplace of 2,556 major leaguers, about 1,000 more than second-place Pennsylvania. Mild weather lets kids play almost year-round, and the Pacific Coast League has run professional baseball on the West Coast since 1903. Ted Williams, Joe DiMaggio, and Barry Bonds all came from the state."
      - "California also has the largest population in the country, which adds raw numbers to the climate advantage. Its own big league clubs show up in [MLB teams by state]."
    table:
      columns:
        rank: "Rank"
        state: "State"
        players: "Players"
      rows:
        - { rank: 1, state: "California", players: "2,556" }
        - { rank: 2, state: "Pennsylvania", players: "1,528" }
        - { rank: 3, state: "New York", players: "1,289" }
        - { rank: 4, state: "Texas", players: "1,215" }
