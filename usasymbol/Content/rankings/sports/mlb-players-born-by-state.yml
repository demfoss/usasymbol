faq:
  - question: "Which state has produced the most MLB players?"
    answer: "California, with 2,556 major leaguers born there. Pennsylvania is second at 1,528 and New York third at 1,289."

  - question: "How many MLB players are from Texas?"
    answer: "Texas has 1,215 and ranks fourth. Nolan Ryan, born in Refugio, is its best-known pitcher."

  - question: "How many MLB players are from Ohio?"
    answer: "Ohio has 1,101 and ranks sixth. The Cincinnati Red Stockings, the first fully professional team, began play there in 1869."

  - question: "Which state has the fewest MLB players?"
    answer: "Alaska has just 13. Wyoming is next at 17, and North Dakota has 20."

  - question: "How many MLB players are from Alabama?"
    answer: "Alabama has 514, which ranks 12th. Hank Aaron and Willie Mays, two of the game's greatest sluggers, were born there."

  - question: "How many MLB players are from Missouri?"
    answer: "Missouri has 692 and ranks eighth. Yogi Berra, the Hall of Fame catcher, grew up on The Hill in St. Louis."

