  - id: "pennsylvania-ohio-and-missouri-mlb-players"
    icon: "fa-solid fa-trophy"
    title: "Pennsylvania, Ohio and Missouri MLB Players"
    paragraphs:
      - "Pennsylvania, at 1,528, beats both New York and Texas. Baseball took hold in its industrial towns early, and Honus Wagner, born near Pittsburgh, was one of the first stars of the modern game. Ohio, at 1,101, is sixth and home to the Cincinnati Red Stockings, the first fully professional team, formed in 1869."
      - "Missouri is eighth at 692, ahead of Georgia at 589 and Alabama at 514, with Yogi Berra born in St. Louis. Alabama still sent Hank Aaron from Mobile and Willie Mays from Westfield, two of the greatest players ever. Minor leagues feed the pipeline, as seen in [minor league baseball teams by state]."
    table:
      columns:
        rank: "Rank"
        state: "State"
        players: "Players"
      rows:
        - { rank: 2, state: "Pennsylvania", players: "1,528" }
        - { rank: 6, state: "Ohio", players: "1,101" }
