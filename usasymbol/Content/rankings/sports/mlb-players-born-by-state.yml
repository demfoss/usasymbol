        - { rank: 10, state: "Georgia", players: "589" }
        - { rank: 12, state: "Alabama", players: "514" }

  - id: "states-with-the-fewest-mlb-players"
    icon: "fa-solid fa-snowflake"
    title: "States With the Fewest MLB Players"
    paragraphs:
      - "Alaska is last at 13, followed by Wyoming at 17 and North Dakota at 20. Long winters shorten the youth season, and outdoor fields in these states are frozen or buried in snow into the spring."
      - "Vermont, at 38, gave baseball Carlton Fisk, born in Bellows Falls, who caught in the majors until age 45. Hawaii, at 50, has produced players such as Kurt Suzuki despite sitting far from the mainland."
