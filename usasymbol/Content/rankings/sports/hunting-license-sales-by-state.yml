        - state: "North Carolina"
          license_holders: "654,251"
        - state: "New York"
          license_holders: "560,346"
        - state: "Minnesota"
          license_holders: "550,663"
        - state: "Missouri"
          license_holders: "509,963"

  - id: "why-western-states-have-the-most-hunters-per-capita"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Western States Have the Most Hunters Per Capita"
    paragraphs:
      - "Wyoming's 23.4 licenses per 100 residents lead the country, followed by South Dakota at 22.7 and Montana at 20.6. All three of the top five states, Wyoming, South Dakota, Montana, North Dakota, and Idaho, sit in the West among the least densely populated states in the country."
      - "That pattern holds through the rest of the top ten. Maine (15.0), West Virginia (14.3), Alaska (13.4), and Oklahoma (12.4) are also sparsely populated states with large amounts of open land relative to their population, conditions that translate into a higher share of residents holding a hunting license."

  - id: "states-with-the-fewest-hunters-per-capita"
    icon: "fa-solid fa-city"
    title: "States With the Fewest Hunters Per Capita"
    paragraphs:
      - "California and Rhode Island tie for the lowest hunting participation rate in the country at 0.7 licenses per 100 residents. Rhode Island's total of 7,985 license holders is the smallest of any state, while California still issues 278,210 licenses despite its low rate."
      - "Hawaii, Connecticut, and New Jersey tie just above them at 0.8 per 100 residents. Massachusetts is next lowest at 0.9, and Florida rounds out the bottom six at 1.0."

