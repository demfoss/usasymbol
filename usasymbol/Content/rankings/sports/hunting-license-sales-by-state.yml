sections:
  - id: "most-hunting-licenses-sold-by-state"
    icon: "fa-solid fa-ranking-star"
    title: "States With the Most Hunting Licenses Sold"
    paragraphs:
      - "Texas sells more hunting licenses than any other state, 1,170,316 in total. Pennsylvania follows at 953,903 and Georgia is third at 769,105."
      - "Tennessee ranks fourth with 728,759 licenses and Wisconsin fifth at 669,813. Despite Texas's lead in total volume, its per-capita rate is only 3.9 per 100 residents, well below Wyoming's 23.4."
    table:
      numbered: true
      columns:
        state: "State"
        license_holders: "License Holders"
      rows:
        - state: "Texas"
          license_holders: "1,170,316"
        - state: "Pennsylvania"
          license_holders: "953,903"
        - state: "Georgia"
          license_holders: "769,105"
        - state: "Tennessee"
          license_holders: "728,759"
