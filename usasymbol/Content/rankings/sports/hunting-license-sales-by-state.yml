page:
  h1: "Hunting License Sales by State"

  quick_answer:
    - "Wyoming has the highest hunting license participation rate in the country at 23.4 paid licenses per 100 residents, a total of 136,205 hunting licenses in 2023."
    - "Texas sells more hunting licenses than any other state, 1,170,316 in total, yet its participation rate is just 3.9 per 100 residents, ranking 39th on that measure."
    - "California and Rhode Island tie for the lowest hunting participation rate at 0.7 per 100 residents, far below Wyoming's 23.4."

  methodology: "Hunting license holder totals and per-capita rates are drawn from U.S. Fish and Wildlife Service license certification data for 2023, using Census Bureau population estimates. Washington, D.C. is excluded."

  sources:
    - name: "U.S. Fish and Wildlife Service. Wildlife and Sport Fish Restoration Program Hunting License Data"
      url: "https://wsfrprograms.fws.gov/Subpages/LicenseInfo/Hunting.htm"
      description: "Federal historical hunting license certification data reported annually by state wildlife agencies"
