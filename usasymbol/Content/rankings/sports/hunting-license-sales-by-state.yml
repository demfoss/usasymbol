faq:
  - question: "Which state has the most hunting licenses per capita?"
    answer: "Wyoming leads with 23.4 hunting license holders per 100 residents, a total of 136,205 licenses. South Dakota is second at 22.7 per 100."

  - question: "Which state sells the most hunting licenses overall?"
    answer: "Texas sells the most hunting licenses of any state, 1,170,316 in total. Its per-capita rate is much lower, just 3.9 per 100 residents."

  - question: "Which state has the fewest hunters per capita?"
    answer: "California and Rhode Island tie for the lowest rate at 0.7 licenses per 100 residents. Rhode Island's total of 7,985 is the smallest license count of any state."

  - question: "How many hunting licenses are sold in the United States?"
    answer: "The 50 states in this table sold a combined 15,933,728 paid hunting licenses. Texas accounts for the largest share at 1,170,316."

  - question: "Why do western states have the highest hunting participation rates?"
    answer: "Wyoming, South Dakota, Montana, North Dakota, and Idaho fill out the top five and are all sparsely populated Western states with large amounts of open land relative to their population."

  - question: "What is the hunting license rate in Texas?"
    answer: "Texas has a rate of 3.9 licenses per 100 residents, ranking 35th nationally even though it sells the most licenses in raw numbers."

