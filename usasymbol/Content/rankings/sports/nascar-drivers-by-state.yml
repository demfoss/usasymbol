faq:
  - question: "Which state has produced the most NASCAR drivers?"
    answer: "North Carolina, the birthplace of 8 of the 36 full-time 2026 Cup Series drivers: Austin Dillon, Ty Dillon, William Byron, Todd Gilliland, John Hunter Nemechek, Cody Ware, Ty Gibbs, and Connor Zilisch."

  - question: "Where was Kyle Larson born?"
    answer: "Elk Grove, California. Larson is one of five current Cup Series drivers born in California, tied for the second-most of any state."

  - question: "Are any current NASCAR drivers born outside the United States?"
    answer: "Yes, two. Daniel Suarez was born in Monterrey, Mexico, and Shane van Gisbergen was born in Auckland, New Zealand."

  - question: "How many states are the birthplace of a current NASCAR Cup Series driver?"
    answer: "14 states. North Carolina leads with 8, California is second with 5, and Michigan and Nevada are tied for third with 3 each."

  - question: "Where was Denny Hamlin born?"
    answer: "Tampa, Florida. Hamlin is one of two current Cup Series drivers born in Florida, alongside Ross Chastain, who was born in Alva."

  - question: "Why are so many NASCAR drivers born in North Carolina?"
    answer: "Most Cup Series teams keep their shops near Charlotte and Mooresville, and several current drivers, including Ty Gibbs and John Hunter Nemechek, were born into racing families already based there."

