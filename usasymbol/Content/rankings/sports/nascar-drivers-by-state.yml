sections:
  - id: "why-north-carolina-produces-the-most-nascar-drivers"
    icon: "fa-solid fa-flag-checkered"
    title: "Why North Carolina Produces the Most NASCAR Drivers"
    paragraphs:
      - "Three of North Carolina's eight drivers were born directly into the sport's family business. Ty Gibbs, born in Charlotte, is the grandson of Joe Gibbs Racing owner Joe Gibbs. John Hunter Nemechek, born in Mooresville, is the son of longtime Cup Series driver Joe Nemechek. Connor Zilisch, also born in Mooresville, grew up minutes from the shops of the teams he now races for."
      - "Mooresville calls itself Race City, USA, and most Cup Series teams keep their shops within an hour of Charlotte. Drivers who grow up there are born close to the sport before they ever sit in a car, a different path than California's five drivers, who mostly moved to North Carolina only after their careers took off."

  - id: "states-tied-for-third-place"
    icon: "fa-solid fa-people-group"
    title: "States Tied for Third Place"
    paragraphs:
      - "Michigan and Nevada are tied for third with 3 drivers each. Michigan's three, Brad Keselowski, Erik Jones, and Carson Hocevar, were all born in different corners of the state: Rochester Hills, Byron, and Portage. Nevada's three, Noah Gragson, Kyle Busch, and Riley Herbst, were all born in Las Vegas."
      - "Five states, Florida, Ohio, Tennessee, Connecticut, and Arizona, are tied at 2 drivers apiece, and five more have exactly 1."

