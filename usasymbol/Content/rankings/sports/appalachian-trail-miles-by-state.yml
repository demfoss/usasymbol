faq:
  - question: "Which state has the most Appalachian Trail miles?"
    answer: "Virginia has the most Appalachian Trail miles at 557.5. The route crosses Shenandoah National Park, the George Washington and Jefferson National Forests, and the Mount Rogers high country."
  - question: "How many states does the Appalachian Trail cross?"
    answer: "The Appalachian Trail crosses 14 states from Georgia to Maine. The official 2026 route covers 2,197.9 miles."
  - question: "How many Appalachian Trail miles are in North Carolina?"
    answer: "North Carolina touches 314.3 miles. That total combines 96.5 miles within North Carolina with 217.8 miles along the Tennessee border."
  - question: "How many Appalachian Trail miles are in Tennessee?"
    answer: "Tennessee touches 292.5 miles. The total includes 74.7 miles within the state and 217.8 miles shared with North Carolina."
  - question: "Which state has the shortest Appalachian Trail section?"
    answer: "West Virginia has the shortest section at 2.4 miles. Those miles pass through Harpers Ferry, where hikers traditionally stop at the Appalachian Trail Conservancy headquarters."
  - question: "Where does the Appalachian Trail start and end?"
    answer: "The southern terminus is Springer Mountain in Georgia and the northern terminus is Katahdin in Maine. A typical full hike takes about six months."

