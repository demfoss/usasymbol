sections:
  - id: "why-virginia-has-the-most-trail-miles"
    title: "Why Virginia Has the Most Miles"
    paragraphs:
      - "Virginia contains 557.5 miles of the Appalachian Trail, nearly one quarter of the full route. Its long diagonal course through the Blue Ridge, Shenandoah National Park, the Great Valley, and Mount Rogers helps define the [Appalachian states](/rankings/geography/appalachian-states)."
      - "Maine ranks next among states without shared border mileage at 282.0 miles. Its section finishes on Katahdin in Baxter State Park, the northern terminus for northbound hikers."

  - id: "north-carolina-tennessee-shared-trail"
    title: "North Carolina and Tennessee Trail"
    paragraphs:
      - "North Carolina touches 314.3 miles and Tennessee touches 292.5 miles. Each total includes the same 217.8 border miles through the high country, including parts of Great Smoky Mountains National Park and the Roan Highlands."
      - "North Carolina also holds Kuwohi, the trail's highest point at 6,643 feet. Tennessee's separate 74.7 miles run through Cherokee National Forest, one of the public lands counted in [national forests by state](/rankings/geography/national-forests-by-state)."

  - id: "shortest-appalachian-trail-section"
    title: "Shortest Appalachian Trail Section"
    paragraphs:
      - "West Virginia's 2.4 miles are the shortest state section, yet they cross one of the route's best-known towns. Harpers Ferry houses the Appalachian Trail Conservancy and sits near the geographic midpoint of the footpath."
      - "Maryland has the next shortest section at 40.9 miles. Its wooded ridges and modest elevation changes make the state a common place for hikers to attempt a four-state challenge that also reaches Virginia, West Virginia, and Pennsylvania."

