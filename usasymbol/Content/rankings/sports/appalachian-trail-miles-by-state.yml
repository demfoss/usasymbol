    - "North Carolina touches 314.3 miles and Tennessee touches 292.5 miles because both include 217.8 miles that follow their shared border."

  methodology: "Appalachian Trail Conservancy 2026 state mileage is used. North Carolina and Tennessee totals include 217.8 shared border miles, which appear in both state totals."

