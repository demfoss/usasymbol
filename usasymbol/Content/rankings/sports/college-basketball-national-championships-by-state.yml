page:
  h1: "College Basketball National Championships by State"

  quick_answer:
    - "California has the most NCAA Division I men's basketball championships of any state, 15, driven almost entirely by UCLA's 11 titles won between 1964 and 1995."
    - "North Carolina is second with 13 titles, split between North Carolina (6), Duke (5), and NC State (2). Kentucky is third with 10 recognized titles from Kentucky (8) and Louisville (2)."
    - "The tournament has been held 86 times since 1939; 2020 was cancelled. One title, Louisville's 2013 championship, was vacated by the NCAA in 2017 and is not counted in Kentucky's total here."

  methodology: "Counts the NCAA Division I men's basketball tournament champion for each season from 1939 through 2025. The 1984 champion, Georgetown, played home games in Washington, D.C., which is not a state and is excluded from state totals. The 2020 tournament was cancelled and is excluded."

