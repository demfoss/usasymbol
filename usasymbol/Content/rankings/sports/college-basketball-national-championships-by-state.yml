faq:
  - question: "Which state has won the most NCAA basketball championships?"
    answer: "California has the most, 15, almost all from UCLA, which won 11 titles between 1964 and 1995, including 10 in a 12-season stretch under coach John Wooden."

  - question: "How many national championships does UCLA have?"
    answer: "UCLA has 11: 1964, 1965, 1967, 1968, 1969, 1970, 1971, 1972, 1973, 1975, and 1995. The seven straight titles from 1967 to 1973 remain the longest streak in NCAA basketball history."

  - question: "Which state has the second-most college basketball championships?"
    answer: "North Carolina ranks second with 13 titles, split between North Carolina (6), Duke (5), and NC State (2), the only state with three different champion schools."

  - question: "Was an NCAA basketball championship ever vacated?"
    answer: "Yes. Louisville's 2013 title was vacated by the NCAA in 2017 following a recruiting violation. It is not counted toward Kentucky's total of 10 recognized titles."

  - question: "How many national titles does Kentucky have?"
    answer: "Kentucky's schools have 10 recognized titles: Kentucky has 8 (most recently 2012) and Louisville has 2 (1980, 1986), not counting Louisville's vacated 2013 championship."

  - question: "Has the NCAA basketball tournament happened every year?"
    answer: "No. The tournament has been held 86 times since it began in 1939; the 2020 tournament was cancelled due to the COVID-19 pandemic."

