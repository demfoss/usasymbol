sections:
  - id: "why-california-leads-college-basketball-championships"
    icon: "fa-solid fa-trophy"
    title: "Why California Leads in College Basketball Championships"
    paragraphs:
      - "California's 15 titles rest almost entirely on one program in one stretch. UCLA won 10 championships in 12 seasons from 1964 to 1975 under coach John Wooden, including seven straight from 1967 to 1973, the longest streak in the sport's history. UCLA added an 11th title in 1995."
      - "Without UCLA's run, California would have just four titles, from Stanford (1942), San Francisco (1955, 1956), and California (1959), fewer than North Carolina's 13 or Kentucky's 10."

  - id: "states-with-multiple-champion-schools"
    icon: "fa-solid fa-people-group"
    title: "States With Multiple Championship-Winning Schools"
    paragraphs:
      - "North Carolina is the only state where three different schools have won a national title: North Carolina (6), Duke (5), and NC State (2). California has titles from four different schools, UCLA, San Francisco, Stanford, and California, but UCLA alone accounts for 11 of its 15."
      - "Pennsylvania, Ohio, Michigan, Oklahoma, Wisconsin, Texas, and New York each have titles split between two schools."

