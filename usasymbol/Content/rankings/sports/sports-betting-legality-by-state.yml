sections:
  - id: "states-with-the-highest-sports-betting-handle"
    icon: "fa-solid fa-chart-column"
    title: "States With the Highest Sports Betting Handle"
    paragraphs:
      - "New York took in $26.3 billion in sports betting handle in 2025, more than any other state and well ahead of second-place Illinois at $15.5 billion. New Jersey ranks third at $12.2 billion, the state that first challenged the federal sports betting ban at the Supreme Court in 2018."
      - "Ohio and Pennsylvania round out the top five at $9.5 billion and $9.0 billion. The remaining legal markets, roughly 18 states and jurisdictions with smaller or tribal-only operations, combined for about $6.6 billion, each too small individually to crack the top 20."
    table:
      numbered: true
      columns:
        state: "State"
        handle: "2025 Handle"
      rows:
        - state: "New York"
          handle: "$26.3B"
        - state: "Illinois"
          handle: "$15.5B"
        - state: "New Jersey"
          handle: "$12.2B"
        - state: "Ohio"
          handle: "$9.5B"
        - state: "Pennsylvania"
          handle: "$9.0B"
        - state: "Arizona"
          handle: "$8.8B"
        - state: "Virginia"
          handle: "$8.4B"
        - state: "North Carolina"
          handle: "$8.1B"
        - state: "Massachusetts"
          handle: "$7.9B"
        - state: "Nevada"
          handle: "$7.7B"

  - id: "why-tennessee-has-online-only-sports-betting"
    icon: "fa-solid fa-mobile-screen"
    title: "Why Tennessee Has Online-Only Sports Betting"
    paragraphs:
      - "Tennessee legalized sports betting in 2020 without a single retail sportsbook, because the state has no commercial or tribal casinos to host one. Every dollar of its $5.9 billion 2025 handle moved through a mobile app instead, a legal structure no other top-20 state uses."
      - "Wyoming built the same online-only model for a different reason: a small population made a retail sportsbook network commercially unworkable, so its 2021 launch skipped brick-and-mortar betting entirely."

  - id: "states-where-one-app-has-a-sports-betting-monopoly"
    icon: "fa-solid fa-lock"
    title: "States Where One App Has a Sports Betting Monopoly"
    paragraphs:
      - "Florida, New Hampshire, Oregon, and Rhode Island each license only one mobile sportsbook statewide. Florida's exclusive belongs to the Seminole Tribe's Hard Rock Bet under a compact that runs through at least 2051, the longest exclusivity window of any state."
      - "DraftKings holds the monopoly in New Hampshire since 2019 and in Oregon since January 2022, while Bally Bet is the only licensed operator in Rhode Island. Every other online state licenses multiple competing sportsbooks."

