page:
  h1: "Sports Betting Legality by State"

  quick_answer:
    - "New York leads all states with $26.3 billion in legal sports betting handle in 2025, the largest regulated market in the country."
    - "Illinois ranks second at $15.5 billion and New Jersey third at $12.2 billion, both trailing New York by double-digit billions despite full statewide mobile access."
    - "12 states, including California, Texas, and Georgia, still have no legal sports betting of any kind. Missouri is the newest market, launching December 1, 2025 and taking in $350 million in its first month."

  methodology: "Legal status reflects each state's regulatory framework as of 2026. Handle figures are full 2025 calendar-year totals reported by state regulators and industry trackers; Missouri covers December 2025 only, its first month of legal wagering."

