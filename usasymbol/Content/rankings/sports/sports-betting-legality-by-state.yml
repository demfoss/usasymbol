faq:
  - question: "Which states don't have legal sports betting?"
    answer: "12 states have no legal sports betting: Alabama, Alaska, California, Georgia, Hawaii, Idaho, Minnesota, Nebraska, Oklahoma, South Carolina, Texas, and Utah."

  - question: "Which state has the most sports betting handle?"
    answer: "New York leads with $26.3 billion in 2025 handle. Illinois is second at $15.5 billion, and New Jersey is third at $12.2 billion."

  - question: "How many states allow online sports betting?"
    answer: "31 states allow full statewide mobile sports betting as of 2026. Seven more, including Mississippi, Montana, and Washington, limit wagering to tribal casino property."

  - question: "Which states only allow retail sports betting?"
    answer: "Mississippi, Montana, New Mexico, North Dakota, South Dakota, Washington, and Wisconsin restrict betting to tribal casino property, with no statewide mobile access. Wisconsin's legislature authorized mobile wagering in April 2026, but it has not launched."

  - question: "What is the newest state to legalize sports betting?"
    answer: "Missouri is the most recent state to launch, going live December 1, 2025. It took in $350 million in handle during its first month."

  - question: "Do any states have only one sports betting app?"
    answer: "Florida, New Hampshire, Oregon, and Rhode Island each license a single mobile sportsbook statewide instead of allowing multiple operators to compete."

