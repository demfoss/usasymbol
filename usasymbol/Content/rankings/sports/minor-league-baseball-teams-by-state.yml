sections:
  - id: "states-with-the-most-minor-league-teams"
    icon: "fa-solid fa-baseball-bat-ball"
    title: "States With the Most Minor League Baseball Teams"
    paragraphs:
      - "Florida has 12 Minor League teams, more than any other state, topped by the Triple-A Jacksonville Jumbo Shrimp. California and North Carolina are tied for second with 9 each, and North Carolina fields 2 Triple-A clubs of its own, the Charlotte Knights and Durham Bulls."
      - "Texas follows with 8 teams, including 3 at Triple-A: the El Paso Chihuahuas, Round Rock Express, and Sugar Land Space Cowboys. No other state has more than 2 Triple-A clubs."
    table:
      numbered: true
      columns:
        state: "State"
        team_count: "Teams"
      rows:
        - state: "Florida"
          team_count: 12
        - state: "California"
          team_count: 9
        - state: "North Carolina"
          team_count: 9
        - state: "Texas"
          team_count: 8

  - id: "states-with-no-minor-league-baseball-team"
    icon: "fa-solid fa-circle-xmark"
    title: "States With No Minor League Baseball Team"
    paragraphs:
      - "13 states have no MLB-affiliated Minor League team, including Colorado, Arizona, and Hawaii. That leaves 37 states, plus the District of Columbia's neighbors in Maryland and Virginia, with at least one club."

