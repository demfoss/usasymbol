faq:
  - question: "Which state has the most Minor League Baseball teams?"
    answer: "Florida has the most with 12, led by the Triple-A Jacksonville Jumbo Shrimp."

  - question: "How many Minor League Baseball teams does Texas have?"
    answer: "Texas has 8 Minor League teams, including 3 at Triple-A: the El Paso Chihuahuas, Round Rock Express, and Sugar Land Space Cowboys."

  - question: "Which states have no Minor League Baseball team?"
    answer: "13 states have no MLB-affiliated Minor League team, including Colorado, Arizona, and Hawaii."

  - question: "What is the highest level of Minor League Baseball?"
    answer: "Triple-A is the highest level. Teams like the Jacksonville Jumbo Shrimp, Sacramento River Cats, and Round Rock Express sit one step from the majors."

  - question: "Does North Carolina have more Minor League teams than New York?"
    answer: "Yes. North Carolina has 9 teams, 3 more than New York's 6."

  - question: "How many Minor League Baseball teams are there in total?"
    answer: "119 MLB-affiliated Minor League teams play across 37 states."

