page:
  h1: "Minor League Baseball Teams by State"

  quick_answer:
    - "Florida has the most Minor League Baseball teams of any state with 12, the highest level being the Triple-A Jacksonville Jumbo Shrimp."
    - "California and North Carolina are tied for second with 9 each. Texas is next with 8, including 3 Triple-A clubs: the El Paso Chihuahuas, Round Rock Express, and Sugar Land Space Cowboys."
    - "119 MLB-affiliated Minor League teams play across 37 states. 13 states have none, including Colorado, Arizona, and Hawaii."

  methodology: "Counts include the 4 full-season, MLB-affiliated levels: Triple-A, Double-A, High-A, and Single-A. Independent leagues not affiliated with an MLB organization and Rookie-level complex teams are not counted. Data reflects the 2025 season."

