sections:
  - id: "why-california-has-the-most-minor-league-hockey-teams"
    icon: "fa-solid fa-hockey-puck"
    title: "Why California Has the Most Minor League Hockey Teams"
    paragraphs:
      - "All five of California's teams, the Bakersfield Condors, Coachella Valley Firebirds, Ontario Reign, San Diego Gulls, and San Jose Barracuda, play in the AHL's Pacific Division, a division built specifically to cut travel time and cost for West Coast NHL organizations. California's three NHL clubs, the Kings, Sharks, and Ducks, each keep their top development affiliate inside the state rather than sending prospects across the country."
      - "That in-state pipeline is why California has zero ECHL teams even as it leads the combined AHL-ECHL count. The state's hockey development stays entirely at the AHL level."

  - id: "nhl-states-with-no-ahl-affiliate"
    icon: "fa-solid fa-arrows-left-right"
    title: "NHL Team States With No AHL Affiliate of Their Own"
    paragraphs:
      - "Three states host an NHL team but no AHL affiliate within their own borders. The Minnesota Wild's AHL affiliate, Iowa Wild, plays in Iowa. The Nashville Predators send their prospects to the Milwaukee Admirals in Wisconsin. The Seattle Kraken's AHL affiliate, the Coachella Valley Firebirds, plays 1,100 miles south in California."
      - "Washington still shows zero on this list despite the Kraken, since the Firebirds count toward California's league-leading total instead."

