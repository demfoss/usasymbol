faq:
  - question: "Which state has the most AHL or ECHL hockey teams?"
    answer: "California has the most, with five AHL teams: the Bakersfield Condors, Coachella Valley Firebirds, Ontario Reign, San Diego Gulls, and San Jose Barracuda."

  - question: "How many states have an AHL or ECHL team?"
    answer: "30 states host at least one AHL or ECHL team. The other 20 states have neither."

  - question: "Does every NHL state have its own AHL affiliate?"
    answer: "No. Minnesota, Tennessee, and Washington each have an NHL team but send their AHL affiliate to a different state: Iowa, Wisconsin, and California."

  - question: "Which states are tied for second-most minor league hockey teams?"
    answer: "Pennsylvania and New York are tied with four teams each. Pennsylvania has three AHL teams and one ECHL team; New York has three AHL teams and one ECHL team."

  - question: "Does Florida have an AHL team?"
    answer: "No. Florida's three minor league hockey teams, the Florida Everblades, Jacksonville Icemen, and Orlando Solar Bears, all play in the ECHL."

  - question: "What is the difference between the AHL and ECHL?"
    answer: "The AHL sits directly below the NHL and is the top development league for most NHL prospects. The ECHL is one level below the AHL and serves as a secondary development and roster-depth league."

