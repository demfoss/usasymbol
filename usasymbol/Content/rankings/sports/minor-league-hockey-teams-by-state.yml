page:
  h1: "AHL and ECHL Hockey Teams by State"

  quick_answer:
    - "California has the most minor league hockey teams of any state, five, all in the AHL: the Bakersfield Condors, Coachella Valley Firebirds, Ontario Reign, San Diego Gulls, and San Jose Barracuda."
    - "Pennsylvania and New York are tied for second with four teams each. Ohio, Illinois, and Florida are tied for third with three."
    - "Twenty states have no AHL or ECHL team at all. Three states with an NHL club, Minnesota, Tennessee, and Washington, have no AHL affiliate of their own; each sends its top prospects to an AHL team in a neighboring state."

  methodology: "Counts every American Hockey League (AHL) and ECHL team by home state for the 2025-26 season. Canadian-based AHL and ECHL teams are excluded."

