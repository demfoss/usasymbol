faq:
  - question: "Which state has the highest average college football attendance?"
    answer: "Nebraska has the highest average, 86,896 fans per game, all from its lone FBS program, the Cornhuskers."

  - question: "Why does Nebraska have the highest average attendance?"
    answer: "Nebraska fields only one FBS program, so its statewide average equals Memorial Stadium's 86,896 draw with no smaller school to lower it. Texas fields 13 programs and averages just 40,580 as a result."

  - question: "Which state has the most FBS college football programs?"
    answer: "Texas has the most, 13, from Texas (102,103 average) down to Sam Houston State (11,559)."

  - question: "What is the average college football attendance in Texas?"
    answer: "Texas averages 40,580 fans per game across its 13 FBS programs, ranking 23rd among states despite having more programs than any other state."

  - question: "Which state has the lowest college football attendance?"
    answer: "Hawaii has the lowest average among states with an FBS program, 13,200 at the University of Hawaii. New Mexico is next lowest at 15,497."

  - question: "How many states have an FBS college football program?"
    answer: "41 states have at least one FBS program, totaling 134 programs nationwide. The other 9 states have no FBS team."

