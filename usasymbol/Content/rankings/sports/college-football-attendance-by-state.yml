sections:
  - id: "states-with-the-highest-average-college-football-attendance"
    icon: "fa-solid fa-football"
    title: "States With the Highest Average College Football Attendance"
    paragraphs:
      - "Nebraska leads every state with an average of 86,896 fans per game, all from a single program, the Cornhuskers. Wisconsin is second at 76,009, also a one-team state, followed by Iowa at 64,233 across two programs, Iowa and Iowa State."
      - "Missouri ranks fourth at 62,621. South Carolina is fifth at 59,861, split between Clemson (80,768) and South Carolina (79,373)."
    table:
      numbered: true
      columns:
        state: "State"
        avg_attendance: "Avg Attendance"
      rows:
        - state: "Nebraska"
          avg_attendance: 86896
        - state: "Wisconsin"
          avg_attendance: 76009
        - state: "Iowa"
          avg_attendance: 64233
        - state: "Missouri"
          avg_attendance: 62621
        - state: "South Carolina"
          avg_attendance: 59861

  - id: "why-nebraska-has-the-highest-average-attendance"
    icon: "fa-solid fa-people-group"
    title: "Why Nebraska Has the Highest Average Attendance"
    paragraphs:
      - "Nebraska's Memorial Stadium draws 86,896 fans a game, and the Cornhuskers are the state's only FBS program, so no smaller-draw school pulls the state average down. Texas, by contrast, fields 13 FBS programs, from Texas at 102,103 down to Sam Houston State at 11,559, and its statewide average of 40,580 lands 23rd."
      - "Wisconsin and Missouri follow the same one-team pattern as Nebraska, each with a single large program and no smaller schools to drag the average lower."

  - id: "states-with-the-lowest-college-football-attendance"
    icon: "fa-solid fa-chart-line"
    title: "States With the Lowest College Football Attendance"
    paragraphs:
      - "Hawaii has the lowest average among states with an FBS program, 13,200 at the University of Hawaii. New Mexico is second-lowest at 15,497, split between New Mexico (16,485) and New Mexico State (14,508)."
      - "Wyoming sits at 22,706 and Nevada at 24,404, rounding out the bottom five. Both states field just one or two Group of Five programs."
    table:
      numbered: true
      columns:
        state: "State"
        avg_attendance: "Avg Attendance"
