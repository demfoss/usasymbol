faq:
  - question: "What is the most popular sport by state?"
    answer: "The most popular sport by state, and what many searches describe as the favorite sport by state, is football in roughly 30 of the 50 states. Basketball leads in Kentucky, Indiana, Kansas, North Carolina, and Massachusetts. Hockey is the top sport in Minnesota. About a dozen states, including California, New York, and Illinois, show mixed signals with two or more sports competing at the top. The answer depends on how popularity is measured: search interest, pro team presence, college fan culture, and participation data can each point to a different answer in close-call states."

  - question: "What is the most popular sport in America?"
    answer: "Football is generally the most popular spectator sport in the United States. NFL games draw the highest average television audiences of any American sport, and college football adds substantial viewership across the South, Midwest, and Plains. When NFL and college football interest are combined, no other sport competes nationally at the same scale. Baseball held that position for much of the twentieth century, but football has led TV ratings by a significant margin since the 1970s."

  - question: "Which states are biggest for college football?"
    answer: "Alabama, Georgia, Ohio, Oklahoma, Nebraska, Tennessee, Louisiana, West Virginia, South Carolina, and Mississippi are among the strongest college football states. Alabama's University of Alabama program won six national championships between 2009 and 2021 under Nick Saban, keeping the state at the center of college football attention for more than a decade. Nebraska's Memorial Stadium has sold out every home game since 1962, a record that reflects how deeply football is embedded in the state's identity without any NFL franchise competing for attention."

  - question: "Which states are most associated with basketball?"
    answer: "Kentucky, Indiana, North Carolina, Kansas, and Massachusetts have the strongest basketball identities. Kentucky's University of Kentucky Wildcats lead all programs in all-time NCAA tournament wins. Indiana gave high school basketball a cultural role that inspired the 1986 film Hoosiers, based on the 1954 Milan High School state championship story. North Carolina's Duke-UNC rivalry is one of the most storied in all of college sports, drawing national television audiences every time the two programs meet."

  - question: "Which state is most associated with hockey?"
    answer: "Minnesota is the clearest example, often called the State of Hockey. The state has more hockey rinks per capita than any other, a high school hockey state tournament that fills the Xcel Energy Center annually, and a University of Minnesota program that traces its history to 1921. The Minnesota Wild joined the NHL in 2000, but the state's hockey identity is much older than the franchise. Vermont is a secondary hockey state due to its regional proximity to Canadian hockey culture, but Minnesota is the only state where hockey is the unambiguous top sport."

  - question: "Why is the most popular sport hard to measure?"
    answer: "Popularity can mean different things depending on how you measure it. Search interest by state reflects curiosity and active online fandom. Television viewership shows what people watch at home. Pro team presence signals organized local fandom. High school participation shows where young people actually play, which matters in states like Texas where that layer is unusually thick. College sports culture captures regional identity that operates independently of professional leagues. A state can rank high on one metric and lower on another, which is why this page uses a best-fit editorial approach rather than claiming a single official ranking."

