sections:
  - id: "why-no-teams"
    icon: "fa-solid fa-map"
    title: "Why These 24 States Have No NFL, NBA, MLB, or NHL Team"
    paragraphs:
      - "Every Big 4 franchise sits inside one of the country's 30 largest media markets. Local TV rights and sponsorships depend on it, and most of the 24 no-team states can't generate the revenue those deals require. Population matters, but so does proximity to an existing market, and that's where most of the South and Mountain West lose the argument before it starts."
      - "Alaska, Hawaii, Montana, Wyoming, and the Dakotas are geographic outliers with populations too small and locations too remote for any league to consider seriously. Alaska's nearest potential opponent city is Seattle, a three-hour flight away. The logistics of building a regular-season schedule around that kind of isolation don't work under any financial model any league has ever run."
      - "Southern states are a different problem. Alabama, Mississippi, Arkansas, and South Carolina have populations that look plausible on paper, but their major cities sit deep inside markets controlled by neighboring states. Birmingham draws from Atlanta's territory. Little Rock is caught between Memphis and Dallas. Jackson, Mississippi is surrounded by franchises in every direction. When leagues draw market boundaries, these cities fall inside someone else's lines."
      - "Kansas is the list's sharpest edge case. The Kansas City metro is a legitimately passionate sports market, Chiefs games at Arrowhead draw 76,000 fans, but both stadiums sit in Missouri. Every Kansas resident rooting for the Chiefs is technically backing a team that belongs to another state, which is why Kansas has no Big 4 franchise while still ranking in the [most popular professional sports team by state](/rankings/sports/most-popular-professional-sports-team-by-state) map. A stadium move to the Kansas side has been discussed for years."

  - id: "college-sports-identity"
    icon: "fa-solid fa-helmet-safety"
    title: "States Where College Sports Fill the Gap"
    paragraphs:
      - "In most of the no-team states, professional sports didn't fill the void, college athletics took the space so completely that the void was never felt. Alabama, Iowa, Nebraska, West Virginia, and Kentucky have college programs that outdraw most Big 4 franchises in attendance and civic intensity, one reason football dominates the [most popular sport by state](/rankings/sports/most-popular-sport-by-state) picture. Alabama's football program regularly fills a 100,000-seat stadium with no professional team to compete with it."
      - "Nebraska's Memorial Stadium has sold out every home game since 1962, a streak of over 380 consecutive sellouts that no NFL franchise has matched. The Cornhuskers are the state's professional team in everything but legal structure. Coaches are paid like NFL staff. Facilities rival NFL training complexes. Game-day revenue exceeds what some small-market professional franchises generate. In a state with no Big 4 team, Nebraska football isn't filling a gap, it IS the market."
      - "Kentucky is college basketball's most concentrated fanbase. The University of Kentucky Wildcats have eight NCAA championships and Rupp Arena has operated at near capacity for decades in a city of 320,000. In a state that has never hosted an NBA team, UK basketball functions with the cultural weight of a professional product. The absence of the NBA isn't a deprivation, in Lexington, it barely registers."
      - "States like Alabama, Iowa, and Nebraska funnel their sports identity into one or two programs instead of spreading it across four leagues. The concentration produces an intensity that franchise cities rarely achieve. The SEC Championship is, in parts of the South, a bigger cultural event than any Big 4 title game."

  - id: "lost-and-almost"
    icon: "fa-solid fa-clock-rotate-left"
    title: "States That Could Get a Big 4 Team Next"
    paragraphs:
      - "Connecticut had a Big 4 franchise once. The Hartford Whalers played NHL hockey from 1979 to 1997, giving New England's southernmost state its only major professional team. The Whalers were never a powerhouse, winning one playoff series in 18 seasons, but they had a fanbase and a genuine civic presence. Owner Peter Karmanos relocated the franchise to Raleigh in 1997, where it became the Carolina Hurricanes and won the Stanley Cup in 2006."
      - "Virginia sits in a uniquely frustrating position: the state is home to millions of fans of Washington's NFL, NBA, NHL, and MLB franchises, and the Commanders' stadium sat in Landover, Maryland for decades while Northern Virginia, one of the wealthiest metro areas in the country, watched from across the line. Virginia has aggressively pursued a new Commanders stadium within its own borders. If that deal closes, Virginia immediately becomes a four-franchise state. No state on this list is closer to exiting it."

timeline:
- year: '1979'
  description: Hartford Whalers join the NHL as an expansion team. Connecticut gets its only Big 4 franchise — playing at the Hartford Civic Center for 18 seasons.
- year: '1997'
  description: Hartford Whalers relocate to Raleigh, NC and become the Carolina Hurricanes. Connecticut loses its only Big 4 team and has not had one since.
- year: '2001'
  description: Vancouver Grizzlies relocate to Memphis, TN. Tennessee becomes one of the few states with three Big 4 franchises — Titans, Predators, and now the Grizzlies.
- year: '2008'
  description: Seattle SuperSonics relocate to Oklahoma City and become the Thunder. Oklahoma gains its first Big 4 franchise. Washington state won't replace the SuperSonics for 13 years.
- year: '2017'
  description: Las Vegas Golden Knights join the NHL as an expansion team. Nevada gets its first Big 4 franchise — and the team reaches the Stanley Cup Final in its inaugural season.
- year: '2020'
  description: Oakland Raiders relocate to Las Vegas. Nevada becomes a two-franchise state. The move ends 50 years of Raiders football in Oakland and remains one of the most contested relocations in NFL history.
- year: '2021'
  description: Seattle Kraken join the NHL. Washington state returns to three Big 4 leagues — Seahawks, Mariners, Kraken. The NBA gap left by the SuperSonics remains.
- year: '2024'
  description: Arizona Coyotes fold after failing to secure a new arena and relocate to Salt Lake City as the Utah Hockey Club. Arizona drops to three Big 4 teams; Utah rises to two.

faq:
  - question: "How many U.S. states have no professional sports teams?"
    answer: "24 U.S. states have no NFL, NBA, MLB, or NHL franchise as of 2025–2026. They include large states like Alabama and Virginia as well as small states like Delaware and Rhode Island. The count uses the Big 4 definition — the four leagues with the longest histories and largest national audiences."

  - question: "Which states have never had a Big 4 sports team?"
    answer: "Many states have never hosted a Big 4 franchise, including Alaska, Hawaii, Wyoming, Montana, North Dakota, South Dakota, Idaho, and most of the Deep South. Connecticut is a prominent exception — the Hartford Whalers played NHL hockey from 1979 to 1997 before relocating to become the Carolina Hurricanes."

  - question: "Does Kansas have any professional sports teams?"
    answer: "No. The Kansas City Chiefs (NFL) and Kansas City Royals (MLB) both play at stadiums on the Missouri side of the state line, leaving Kansas without a Big 4 franchise despite being home to a large portion of both teams' fanbases. A stadium move to Kansas has been proposed but not finalized."

  - question: "Does Virginia have a professional sports team?"
    answer: "No. The Washington Commanders (NFL), Capitals (NHL), Wizards (NBA), and Nationals (MLB) all play in Maryland or Washington D.C. Virginia has aggressively pursued a new Commanders stadium within its borders, which would give the state its first Big 4 franchise. No deal has been finalized."

  - question: "What does Big 4 mean in professional sports?"
    answer: "The Big 4 refers to the four major North American professional sports leagues: the NFL (American football), NBA (basketball), MLB (baseball), and NHL (hockey). They are defined by their combination of long histories, national broadcast deals, and cultural weight. Other leagues like MLS and the WNBA are growing in stature but are not traditionally included in the Big 4; for that separate women's basketball footprint, see [WNBA teams by state](/rankings/sports/wnba-teams-by-state)."

  - question: "Which state has the most professional sports teams?"
    answer: "California has the most Big 4 teams with 13 active franchises: three NFL teams (49ers, Rams, Chargers), four NBA teams (Lakers, Clippers, Warriors, Kings), three MLB teams (Dodgers, Angels, Giants), and three NHL teams (Kings, Ducks, Sharks). The Oakland Raiders relocated to Las Vegas in 2020, reducing California's NFL count from four to three."


