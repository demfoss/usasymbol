sections:
  - id: "why-alabama-leads-so-many-states"
    icon: "fa-solid fa-football"
    title: "Why Alabama Leads So Many States"
    paragraphs:
      - "Alabama Crimson Tide topped Google search interest in 15 states from 2017 through 2022, more than any other college football program. USA Today's analysis found Alabama was the single most-searched college football team over that five-year span, a lead broad enough to top the charts in states with no direct tie to the school, including Massachusetts, Nevada, and Rhode Island."
      - "That reach spans every U.S. time zone, from Alaska and Hawaii in the Pacific to Maine and New Hampshire in the Northeast. No other program's search dominance crossed that many regions in the same data set."

  - id: "college-football-conference-popularity-by-state"
    icon: "fa-solid fa-chart-bar"
    title: "College Football Conference Popularity by State"
    paragraphs:
      - "SEC programs lead search interest in 22 states, the most of any conference, powered largely by Alabama's 15-state footprint plus home-state leaders Arkansas, Florida, Georgia, LSU, Oklahoma, Tennessee, and Texas. Big Ten programs lead in 20 states, anchored by Nebraska's five-state run across the Great Plains and Penn State's four-state hold in the Mid-Atlantic."
      - "Notre Dame Fighting Irish leads five states, Connecticut, Illinois, Indiana, New York, and North Dakota, despite fielding an independent program with no conference affiliation. ACC programs lead three states: Clemson Tigers tops North Carolina and South Carolina, and Virginia Tech Hokies tops Virginia."

  - id: "most-popular-college-team-by-region"
    icon: "fa-solid fa-map"
    title: "Most Popular College Team by Region"
    paragraphs:
      - "Nebraska Cornhuskers leads search interest across five Great Plains states: Colorado, Kansas, Nebraska, South Dakota, and Wyoming. Oregon Ducks leads three Pacific Northwest states: Idaho, Oregon, and Washington. Both results reflect the same regional search pattern USA Today's analysis identified outside each team's home state."

