faq:
  - question: "What is the most popular college football team in every state?"
    answer: "The most popular college football team in every state is listed in the table above, based on Google search interest tracked from 2017 to 2022. Alabama Crimson Tide leads 15 states, more than any other program, followed by Notre Dame Fighting Irish in five states and Penn State Nittany Lions in four."

  - question: "Why does Alabama lead so many states?"
    answer: "Alabama Crimson Tide was the single most-searched college football team nationwide from 2017 to 2022, according to USA Today's analysis of Google search data. That search volume was high enough to top the rankings in 15 states, including states with no direct connection to the school, such as Massachusetts and Nevada."

  - question: "What is the most popular college team in Texas?"
    answer: "Texas Longhorns is the most popular college football team in Texas, based on statewide Google search interest from 2017 to 2022."

  - question: "Which conference has the most popular college teams by state?"
    answer: "SEC programs lead search interest in 22 states and Big Ten programs lead in 20. Notre Dame, an independent program with no conference, leads five states, and ACC programs lead three."

  - question: "In how many states does Notre Dame lead search interest?"
    answer: "Notre Dame Fighting Irish leads Google search interest in five states: Connecticut, Illinois, Indiana, New York, and North Dakota. Indiana is Notre Dame's home state; the other four are outside it."

  - question: "Is this an official ranking of college football popularity?"
    answer: "No official body tracks statewide college football popularity. This list uses Google search interest by state, tracked from 2017 to 2022 and reported by USA Today, as one measurable signal of fan geography."

