- id: longest-ski-season-state
  icon: fa-solid fa-calendar-days
  title: Longest Ski Seasons by State
  paragraphs:
  - California has the longest typical operating window on the table, from November into July when Mammoth Mountain retains enough snow. Colorado and Vermont can run from October into June at high-elevation Arapahoe Basin and snowmaking-heavy Killington.
  - Alaska, Maine, New Hampshire, New York, Utah, and Washington commonly extend into May. Alabama has the shortest listed window from January to February, and its single area, Cloudmont, averages only 6 inches of natural snow.
