- id: largest-ski-resort-state
  icon: fa-solid fa-mountain-sun
  title: Largest Ski Resort by State
  paragraphs:
  - Park City Mountain in Utah covers 7,300 skiable acres, the largest resort listed for any state. Palisades Tahoe in California reaches 6,000 acres, while Montana's Big Sky Resort covers 5,850 and Colorado's Vail Mountain has 5,317.
  - Big Sky posts the greatest vertical drop at 4,364 feet, 854 feet more than Vail's 3,510. Oregon's 4,323-acre Mt. Bachelor has a 3,366-foot drop, while Taos Ski Valley reaches 3,248 feet across 1,294 acres in New Mexico.
