  description: New York has 52 ski areas, the most of any state. The table covers all 50 states plus acreage, vertical drop, snowfall, lifts, and prices.
page:
  h1: Ski Resorts by State
  quick_answer:
  - Ski resorts by state are most numerous in New York, which had 52 operating ski areas during the 2024/25 season. Michigan ranked second with 44, while Colorado had 34.
  - Montana has the largest vertical drop on this list. Big Sky Resort descends 4,364 feet across 5,850 skiable acres, compared with Vail Mountain's 3,510-foot drop in Colorado.
  - Alaska records the highest snowfall figure among the largest state resorts. Alyeska averages 650 inches, ahead of Wyoming's Grand Targhee at 500 inches and Washington's Crystal Mountain at 466 inches.
  methodology: Ski-area counts come from the NSAA Kottke End-of-Season Survey for 2024/25, which defines a ski area by mechanized uphill access. Resort acreage, vertical drop, snowfall, seasons, and day-pass prices reflect each state's largest listed resort.
