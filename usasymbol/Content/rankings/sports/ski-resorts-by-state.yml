- id: states-most-ski-resorts
  icon: fa-solid fa-person-skiing
  title: States With the Most Ski Resorts
  paragraphs:
  - New York leads the ski areas by state count with 52, followed by Michigan at 44. Colorado ranks third with 34, only one ahead of Wisconsin's 33.
  - New Hampshire has 30 operating areas within a much smaller state. Pennsylvania and Vermont tie at 26, while California follows with 24 despite having the second-largest resort on the table at 6,000-acre Palisades Tahoe.
  - Arkansas, Delaware, Florida, Georgia, Hawaii, Kansas, Kentucky, Louisiana, Mississippi, Nebraska, Oklahoma, South Carolina, and Texas each record zero operating ski areas.
