page:
  h1: "Which U.S. States Have WNBA Teams?"
  
  quick_answer:
    - "California has the most WNBA teams with 2: Los Angeles Sparks and Golden State Valkyries. The remaining 11 teams are spread across 11 different states plus Washington D.C."
    - "13 WNBA teams play in 12 U.S. states plus Washington D.C. The league is expanding: Golden State Valkyries joined in 2025, and Portland will join in 2026. For the broader major-league landscape, compare this with the [states with no Big 4 sports teams](/rankings/sports/states-no-big-4-sports-teams)."
    - "The Indiana Fever's Caitlin Clark drove a 265% attendance surge in her 2024 rookie season, reshaped the league's media deal, and made Indiana the most-watched team in the WNBA. The Las Vegas Aces won back-to-back championships in 2022–2023; the New York Liberty won in 2024."

  methodology: "Teams are listed by the state where their home arena is physically located. The Washington Mystics are listed under Washington D.C. Data reflects the 2025 WNBA season, including the expansion Golden State Valkyries."
  
