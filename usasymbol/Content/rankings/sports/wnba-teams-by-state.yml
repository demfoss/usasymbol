sections:
  - id: "caitlin-clark-effect"
    icon: "fa-solid fa-chart-line"
    title: "The Caitlin Clark Effect: WNBA's Popularity Explosion"
    paragraphs:
      - "Caitlin Clark arrived in the WNBA in 2024 as the #1 overall draft pick after breaking the all-time NCAA scoring record at Iowa. Within weeks she had sold out arenas the league had never filled, moved games to larger venues, and become the subject of a national debate about women's sports that had nothing to do with the game itself."
      - "Indiana Fever attendance increased 265% from 2023 to 2024. Road games featuring Clark sold out across the league, with teams moving games to larger arenas to meet demand. The Fever's home games at Gainbridge Fieldhouse averaged over 17,000 fans — previously, WNBA games rarely exceeded 10,000. Television ratings for WNBA games more than doubled compared to 2023."
      - "Clark's rivalry with Angel Reese (Chicago Sky) brought additional attention, echoing their NCAA championship battles. The increased viewership translated to business success: the WNBA signed an 11-year, $2.2 billion media rights deal in 2024 — a 400% increase over the previous contract. Player salaries are expected to rise significantly as a result."

  - id: "las-vegas-dynasty"
    icon: "fa-solid fa-trophy"
    title: "Las Vegas Aces: The WNBA's Current Dynasty"
    paragraphs:
      - "The Las Vegas Aces won back-to-back WNBA championships in 2022 and 2023, establishing themselves as the league's premier franchise. Led by A'ja Wilson — the league's back-to-back MVP and arguably the best player in women's basketball — the Aces combine star power with championship pedigree."
      - "Coach Becky Hammon, who spent years as an assistant with the NBA's San Antonio Spurs, has built a culture of excellence in Las Vegas. The Aces' success came quickly — the franchise relocated from San Antonio in 2018 and won its first title just four years later. Key players include Wilson, Kelsey Plum, Jackie Young, and Chelsea Gray."
      - "The Aces play at Michelob Ultra Arena inside the Mandalay Bay Resort — a setting that fits. Las Vegas doesn't have an NBA team, which means the Aces own the city's professional basketball identity entirely, even though Nevada's Big 4 profile is driven by the Raiders and Golden Knights in the [professional team by state](/rankings/sports/most-popular-professional-sports-team-by-state) ranking."

  - id: "expansion-era"
    icon: "fa-solid fa-plus"
    title: "WNBA Expansion: Golden State, Portland, and Beyond"
    paragraphs:
      - "The Golden State Valkyries became the WNBA's 13th team in 2025, sharing Chase Center with the NBA's Warriors under Joe Lacob's ownership group. It's the first time one ownership group has operated both an NBA and a WNBA franchise under the same roof, adding another basketball layer in a state already marked as mixed on the [most popular sport by state](/rankings/sports/most-popular-sport-by-state) map."
      - "Portland is confirmed to join the WNBA in 2026, becoming the 14th franchise. The city has a strong women's sports culture — the Portland Thorns (NWSL) are one of the most successful women's soccer teams in the world. Portland's expansion fee reportedly exceeded $100 million, reflecting the league's surging value."
      - "Toronto is considered a leading candidate for future expansion, which would give the WNBA its first international team. Other markets expressing interest include Philadelphia, Denver, Houston, and Cleveland. Commissioner Cathy Engelbert has suggested the league could eventually reach 16-18 teams, up from 12 just a few years ago."

  - id: "original-franchises"
    icon: "fa-solid fa-star"
    title: "Original WNBA Franchises: Where Are They Now?"
    paragraphs:
      - "The WNBA launched in 1997 with 8 teams: Charlotte Sting, Cleveland Rockers, Houston Comets, Los Angeles Sparks, New York Liberty, Phoenix Mercury, Sacramento Monarchs, and Utah Starzz. Only 4 of those original franchises remain in their original cities: the Sparks, Liberty, Mercury, and the franchise that became the Connecticut Sun."
      - "The Houston Comets won the first four WNBA championships (1997–2000) with Cynthia Cooper, then folded in 2008 due to ownership collapse. The Cleveland Rockers and Sacramento Monarchs also folded. Charlotte and Utah relocated. Of the eight founding franchises, half are gone from their original cities."
      - "The Utah Starzz became the San Antonio Silver Stars (2003), then the San Antonio Stars (2014), and finally relocated to Las Vegas as the Aces (2018). This franchise's journey — from struggling in Utah to championship dynasty in Vegas — illustrates how market, ownership, and talent alignment can transform a team's fortunes."

  - id: "arena-situations"
    icon: "fa-solid fa-building"
    title: "Where WNBA Teams Play: Arenas and Venues"
    paragraphs:
      - "WNBA teams play in a variety of venues, from NBA arenas to dedicated smaller facilities. The Los Angeles Sparks and New York Liberty share arenas with NBA teams (Crypto.com Arena with the Lakers/Clippers, Barclays Center with the Nets). The Golden State Valkyries will share Chase Center with the Warriors."
      - "Several teams have their own dedicated venues. The Connecticut Sun play at Mohegan Sun Arena, a casino-owned facility that has been their home since 2003. The Washington Mystics play at the Entertainment & Sports Arena in southeast D.C., a 4,200-seat venue built specifically for the team in 2018."
      - "The Atlanta Dream have had the most unstable arena situation, playing in multiple venues since their 2008 founding. They currently play at Gateway Center Arena in College Park, a suburb south of Atlanta. Arena situations often reflect ownership investment — teams with committed owners tend to secure better facilities, while struggling franchises bounce between venues."

  - id: "championship-history"
    icon: "fa-solid fa-medal"
    title: "WNBA Championship History by State"
    paragraphs:
      - "Texas leads all states with 6 WNBA championships, all won by the Houston Comets (1997-2000) and San Antonio (via the franchise now in Las Vegas). However, Houston no longer has a team (Comets folded 2008), and San Antonio's franchise moved to Vegas. California's Sparks have won 3 titles (2001, 2002, 2016)."
      - "Minnesota's Lynx have won 4 championships (2011, 2013, 2015, 2017), making them the most successful current franchise by titles. The Seattle Storm have won 4 titles (2004, 2010, 2018, 2020). The Phoenix Mercury have won 3 (2007, 2009, 2014). The Las Vegas Aces have won 2 (2022, 2023), and the New York Liberty won their first in 2024."
      - "Notable championship droughts exist: the Connecticut Sun have reached the finals 4 times but never won. The New York Liberty made the finals 5 times before finally winning in 2024. The Indiana Fever's lone title came in 2012 with Tamika Catchings — the franchise hopes Caitlin Clark can deliver another."

