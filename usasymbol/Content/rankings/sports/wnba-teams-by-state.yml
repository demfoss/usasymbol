faq:
  - question: "Which state has the most WNBA teams?"
    answer: "California has the most WNBA teams with 2: the Los Angeles Sparks and the Golden State Valkyries. The Valkyries joined the league in 2025 as an expansion team, playing at Chase Center in San Francisco. All other states with WNBA teams have just one team each."
  
  - question: "How many WNBA teams are there?"
    answer: "The WNBA has 13 teams as of 2025. The league expanded from 12 teams when the Golden State Valkyries joined in 2025. Portland will become the 14th team in 2026. The league is expected to continue expanding to potentially 16-18 teams."
  
  - question: "What team does Caitlin Clark play for?"
    answer: "Caitlin Clark plays for the Indiana Fever. She was selected #1 overall in the 2024 WNBA Draft after setting NCAA scoring records at the University of Iowa. Her arrival dramatically increased WNBA attendance and TV ratings across the entire league."
  
  - question: "What is the newest WNBA team?"
    answer: "The Golden State Valkyries are the newest WNBA team, joining the league in 2025. They play at Chase Center in San Francisco, sharing the arena with the NBA's Golden State Warriors. Portland is scheduled to become the next expansion team in 2026."
  
  - question: "Which WNBA team has won the most championships?"
    answer: "The Houston Comets won the most championships with 4 consecutive titles (1997-2000), but the franchise folded in 2008. Among active franchises, the Minnesota Lynx and Seattle Storm are tied with 4 championships each. The Las Vegas Aces won back-to-back titles in 2022-2023."
  
  - question: "Where do the Las Vegas Aces play?"
    answer: "The Las Vegas Aces play at Michelob Ultra Arena, located inside the Mandalay Bay Resort in Las Vegas, Nevada. The team relocated from San Antonio in 2018 and has won championships in 2022 and 2023, becoming the WNBA's current dynasty."
  
  - question: "Is there a WNBA team in New York?"
    answer: "Yes, the New York Liberty play at Barclays Center in Brooklyn, New York. The Liberty are one of the WNBA's original franchises (est. 1997) and won their first championship in 2024 after reaching the finals 5 times previously without winning."
  
  - question: "Will the WNBA expand to more cities?"
    answer: "Yes, the WNBA is actively expanding. Portland will join in 2026 as the 14th team. Toronto is considered a leading candidate for future expansion, which would be the league's first international team. Other cities expressing interest include Philadelphia, Denver, Houston, and Cleveland."
