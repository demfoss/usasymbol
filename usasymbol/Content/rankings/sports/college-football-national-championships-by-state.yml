faq:
  - question: "Which state has the most college football national championships?"
    answer: "Alabama has the most, 14, split between Alabama (12 titles, most recently 2020) and Auburn (2 titles, 1957 and 2010)."

  - question: "Which state has the second-most college football championships?"
    answer: "Florida ranks second with 11, spread across three schools: Miami (5), Florida State (3), and Florida (3)."

  - question: "How many national titles does Notre Dame have?"
    answer: "Notre Dame has 8 AP Poll national championships: 1943, 1946, 1947, 1949, 1966, 1973, 1977, and 1988."

  - question: "Did Indiana ever win a national championship before 2025?"
    answer: "No. Indiana's 2025 title, won in January 2026 over Miami, was the program's first ever, one year after the Hoosiers had lost more games than any FBS program in NCAA history."

  - question: "Which state has had the most different national champion schools?"
    answer: "Florida has had three different champion schools, Miami, Florida State, and Florida. Alabama's 14 titles come from just two schools, Alabama and Auburn."

  - question: "How many total college football national championships have been awarded?"
    answer: "90 AP Poll national championships have been awarded since the poll began in 1936, with a season played every year in that span."

