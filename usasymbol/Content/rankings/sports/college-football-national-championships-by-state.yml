sections:
  - id: "why-alabama-has-the-most-college-football-championships"
    icon: "fa-solid fa-football"
    title: "Why Alabama Has the Most College Football Championships"
    paragraphs:
      - "Six of Alabama's 12 titles, 2009, 2011, 2012, 2015, 2017, and 2020, came in a 12-season span under coach Nick Saban, who took over the program in 2007. That single stretch alone would rank as the fourth-most championships of any state on this list."
      - "Auburn's two titles, 1957 and 2010, push the state's total to 14, three ahead of Florida's 11 and five ahead of Oklahoma's 7."

  - id: "indianas-sudden-rise-on-this-list"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Indiana's Sudden Rise on This List"
    paragraphs:
      - "Indiana's 2025 championship, its first ever, arrived one year after the Hoosiers had lost more games than any program in NCAA FBS history entering the season. The 27-21 win over Miami in the January 2026 CFP title game made Indiana the state's second champion school alongside Notre Dame, whose 8 titles date back to 1943."
      - "That single title moved Indiana ahead of Oklahoma (7) and Ohio (6) into third place on this list, without it, Indiana would rank behind both."

