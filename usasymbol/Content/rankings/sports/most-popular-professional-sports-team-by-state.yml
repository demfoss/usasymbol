page:
  h1: "Most Popular Professional Sports Team in Every State"

  quick_answer:
    - "The most popular professional sports team in every state is a best-fit fan map, not an official ranking, because team popularity depends on location, league, media markets, history, and regional loyalty. Several states are close calls because fan loyalty splits by region, and a handful of states have no major pro team at all."
    - "NFL teams lead the most states because football has the largest national fanbase. MLB, NBA, NHL, and MLS teams lead where local or regional loyalty is unusually strong. For states without a Big Four or MLS franchise, the closest or most culturally dominant regional team is listed, with a note explaining why."

  methodology: "There is no single official source for the most popular professional sports team in every state, so this page uses a best-fit editorial method based on: search interest by state, team location and proximity, professional league popularity, media market and broadcast reach, statewide name recognition, attendance and fanbase visibility, historic loyalty and regional identity, and recent championship impact where relevant. No exact percentages are used because no single source measures statewide fandom officially. Where the answer is genuinely debatable, the table says close call or regional split."

  sources:
    - name: "Google Trends"
      url: "https://trends.google.com/"
      description: "Used to assess relative search interest by team and state as one signal of fan geography"
    - name: "ESPN"
      url: "https://www.espn.com/"
      description: "Broad league and team context, including market presence and franchise history"
    - name: "Sports Media Watch"
      url: "https://www.sportsmediawatch.com/"
      description: "TV audience and broadcast market data used to assess regional reach"

