faq:
  - question: "Which state has the most NHL teams?"
    answer: "California and New York are tied for the most NHL teams with 3 each. No state has more than three."

  - question: "How many NHL teams does Florida have?"
    answer: "Florida has 2 NHL teams, the Florida Panthers at Amerant Bank Arena and the Tampa Bay Lightning at Amalie Arena."

  - question: "Does Arizona have an NHL team?"
    answer: "No. The former Arizona Coyotes relocated to Salt Lake City in 2024 and became the Utah Mammoth, so Arizona has no NHL franchise."

  - question: "How many states have an NHL team?"
    answer: "18 states have at least one NHL franchise, out of the 25 U.S.-based teams in the league."

  - question: "How many NHL teams are in Canada?"
    answer: "7 NHL teams play in Canada: the Flames, Oilers, Canadiens, Senators, Maple Leafs, Canucks, and Jets."

  - question: "How many NHL teams does Pennsylvania have?"
    answer: "Pennsylvania has 2 NHL teams, the Philadelphia Flyers and the Pittsburgh Penguins."

