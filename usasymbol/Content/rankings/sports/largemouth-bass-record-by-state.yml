sections:
  - id: "georgia-holds-the-world-record-largemouth-bass"
    icon: "fa-solid fa-trophy"
    title: "Georgia Holds the World Record Largemouth Bass"
    paragraphs:
      - "George Perry's 22 lb, 4 oz largemouth bass, caught in Montgomery Lake, Georgia, on February 6, 1932, is not just the state record. It is also the IGFA all-tackle world record, a mark that has stood for more than 90 years."
      - "California holds the second-heaviest state record at 21 lbs, 12 oz, caught by Michael Arujo at Castaic Lake in 1991. Texas is third at 18 lbs, 2.88 oz."

  - id: "states-with-the-smallest-record-largemouth-bass"
    icon: "fa-solid fa-fish"
    title: "States With the Smallest Record Largemouth Bass"
    paragraphs:
      - "Alaska's state record is just 8 oz, caught in 2018, the lightest state record in the country by a wide margin."
      - "North Dakota's record of 8 lbs, 8 oz and Minnesota's 8 lbs, 15 oz are the next lightest, followed by South Dakota at 9 lbs, 5 oz and Montana at 9 lbs, 9.28 oz."

