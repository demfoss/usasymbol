faq:
  - question: "Which state has the largest record largemouth bass?"
    answer: "George Perry's 22 lb, 4 oz catch from 1932 remains Georgia's state record, the heaviest on the list."

  - question: "Which state has the smallest record largemouth bass?"
    answer: "Alaska has the smallest state record at just 8 oz, caught in 2018."

  - question: "What is the world record largemouth bass?"
    answer: "The world record largemouth bass is George Perry's 22 lb, 4 oz catch from Montgomery Lake, Georgia, in 1932, which is also Georgia's state record."

  - question: "What is the record largemouth bass in Texas?"
    answer: "Texas's state record is 18 lbs, 2.88 oz, caught by Barry St. Clair at Lake Fork in 1992."

  - question: "When was Georgia's record bass caught?"
    answer: "George Perry caught Georgia's 22 lb, 4 oz record bass on February 6, 1932, at Montgomery Lake. It remains the world record."

  - question: "Do any states tie for the same record weight?"
    answer: "Yes. Alabama and Arkansas are both tied at 16 lbs, 8 oz. Colorado and Maryland are tied at 11 lbs, 6 oz, and Pennsylvania and Wisconsin are tied at 11 lbs, 3 oz."

