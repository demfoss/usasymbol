    paragraphs:
      - "Texas has 318 Church's Texas Chicken locations, 271 more than second-place Georgia. George W. Church Sr. opened the first restaurant in San Antonio in 1952, across the street from the Alamo, and the chain grew outward from there. Texas also tops the rankings for [Popeyes locations by state](/rankings/food/popeyes-locations-by-state) with 457 and [Chick-fil-A locations by state](/rankings/food/chick-fil-a-locations-by-state) with 524."
      - "Georgia ranks second with 47, and the company is headquartered in Atlanta. California has 40 and Arizona 39, while Alabama and Louisiana tie at 35, so the next strongest markets sit in the South and Southwest."
