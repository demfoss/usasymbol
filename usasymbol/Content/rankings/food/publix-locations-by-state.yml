sections:
  - id: "why-florida-has-the-most-publix-locations"
    icon: "fa-solid fa-store"
    title: "Why Florida Has the Most Publix Locations"
    paragraphs:
      - "Florida leads with 916 Publix locations, more than four times Georgia's 225. Alabama follows with 97, reflecting Publix's heavily Southeastern store footprint."
      - "The ranking counts stores only. It does not adjust for population or compare store size, sales, customer demand, or market share."
  - id: "why-42-states-show-zero-publix-locations"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "Why 42 States Show Zero Publix Locations"
    paragraphs:
      - "The source lists Publix stores in 8 states, so the other 42 states are recorded as 0 and share rank 9. Kentucky has the smallest nonzero footprint with 18 locations."
      - "A zero means the chain had no location listed in that state in the July 2026 snapshot. It does not predict future expansion."
