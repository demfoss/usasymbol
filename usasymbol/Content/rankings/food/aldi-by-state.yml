faq:
  - question: "Which state has the most Aldi stores?"
    answer: "Florida has the most Aldi stores of any state at 218, narrowly ahead of Illinois at 216. Ohio ranks third at 164."

  - question: "Why does Illinois have so many Aldi stores?"
    answer: "Aldi's U.S. headquarters is located in Batavia, Illinois, near Chicago. Illinois carries 216 stores, the second-most of any state, behind only Florida's 218."

  - question: "Which states have no Aldi stores?"
    answer: "Twelve states have zero Aldi locations: Alaska, Colorado, Hawaii, Idaho, Maine, Montana, Nevada, New Mexico, Oregon, Utah, Washington, and Wyoming."

  - question: "Is Trader Joe's the same company as Aldi?"
    answer: "No. Trader Joe's is owned by Aldi Nord, while the roughly 2,392 U.S. Aldi stores counted here are run by Aldi Süd, a separate company since the two split in the 1960s. Trader Joe's does operate stores in several states that have zero Aldi Süd locations, including Colorado, Hawaii, Nevada, Oregon, Utah, and Washington."

  - question: "How many Aldi stores are there in the United States?"
    answer: "There are 2,392 Aldi stores in the United States, including 1 in the District of Columbia."

  - question: "Does Aldi have stores in Washington state?"
    answer: "No. Washington is one of 12 states with zero Aldi stores, along with its Pacific Coast neighbor, Oregon."

