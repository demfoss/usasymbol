page:
  h1: Panda Express Locations by State
  quick_answer:
    - Panda Express locations by state are led by California with 618 restaurants. The brand began at the Glendale Galleria, making California its original expansion market.
    - Maine, New Hampshire, and Rhode Island each have one restaurant. Vermont is absent, leaving a sparse New England footprint despite the chain's nationwide reach.
    - Arizona and Illinois each have 121 locations. Arizona borders the chain's California home market, while Illinois puts an equally large network in the Midwest.
  methodology: Panda Express' official state directory counts listed restaurants as retrieved October 3, 2026. DC, Guam, Puerto Rico, and unlisted Vermont are excluded, with equal counts sharing ranks.
  sources:
    - name: Panda Express Official Location Directory
      url: https://www.pandaexpress.com/locations/
      description: Complete US state totals captured from the official location directory on October 3, 2026.
    - name: Panda Restaurant Group Our Story
      url: https://www.pandarg.com/our-story
      description: Andrew and Peggy Cherng's first Panda Express at the Glendale Galleria in 1983.
