  - id: why-california-leads-panda-express
    title: Why California Leads Panda Express
    paragraphs:
      - California's 618 restaurants have a historical foundation beyond the state's size. Andrew and Peggy Cherng opened Panda Express at the Glendale Galleria in 1983, translating their sit-down Panda Inn concept into a fast-service mall restaurant, and California became the brand's starting market.
      - Maine, New Hampshire, and Rhode Island each have one location, placing the smallest networks across the country from Panda Express's original California market. New England's compact states divide the region into separate statewide totals, with Connecticut listing two and Massachusetts six. [Chick-fil-A's state network](/rankings/food/chick-fil-a-locations-by-state) provides another example of a chain whose founding region helps shape its map.
