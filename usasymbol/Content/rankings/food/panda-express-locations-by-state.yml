faq:
  - question: Which state has the most Panda Express restaurants?
    answer: California ranks first with 618. The first Panda Express was a fast-service restaurant in Glendale Galleria, adapting the founders' sit-down Panda Inn business to a shopping-mall setting.
  - question: How many Panda Express locations are in Texas?
    answer: Texas has 345 and ranks second. Its network reaches separate city markets around Houston, Dallas, Austin, and San Antonio.
  - question: How many Panda Express restaurants are in Florida?
    answer: Florida has 145 and ranks third. The network reaches inland Orlando as well as coastal markets around Tampa and South Florida.
  - question: Does Vermont have Panda Express?
    answer: Vermont has no listed Panda Express restaurant. That leaves a gap beside New Hampshire's single location in an otherwise nationwide network.
  - question: Are Puerto Rico restaurants included in state totals?
    answer: No. Puerto Rico, Guam, and DC are excluded from the 49-state ranking. Hawaii's 37 restaurants remain included because Hawaii is a state, even though its locations also sit outside the mainland.
