sections:
  - id: "chains-by-number-of-states"
    icon: "fa-solid fa-trophy"
    title: "Most Popular Fast-Food Chains by Number of States"
    paragraphs:
      - "Wendy's and Sonic each lead in five states by the most-popular-chain metric, the highest count on this map. Wendy's tops Montana, Ohio, Pennsylvania, Utah, and West Virginia — a mix of Midwest and Mid-Atlantic states where Wendy's was founded (Dublin, Ohio, 1969) and still holds strong search interest. Sonic leads Arkansas, Kansas, Mississippi, New Mexico, and Oklahoma, all in the South and Southwest where the drive-in chain has its deepest roots and longest operating history."
      - "Jimmy John's leads three Midwest states — Illinois, Iowa, and Minnesota — where the chain was founded (Champaign, Illinois, 1983) and has the highest location density relative to other chains. Subway leads Maine, North Dakota, and Vermont, three states where national fast-food competition is thinner and Subway's low-cost, wide-distribution model has historically given it broader reach."
      - "The gap between this column and the top-3 visit-count column is striking. McDonald's appears in the top 3 most-visited chains in 46 of 50 states — but leads the most-popular-by-search column in zero states. Chick-fil-A leads by customer satisfaction ratings in 38 states but tops the most-popular column in only two (Delaware and Georgia). A chain that everyone visits daily can still lose a search-interest race to a chain that generates more curiosity, buzz, or regional pride."

  - id: "regional-fast-food-favorites"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Fast-Food Favorites"
    paragraphs:
      - "The clearest cases of regional loyalty come from chains unavailable or rare outside their home territory. In-N-Out Burger leads California by all three metrics — most popular, top rated, and local favorite — despite having zero locations east of Texas. The chain's limited distribution is part of its identity: In-N-Out deliberately restricts expansion to maintain supply chain control and freshness standards, which reinforces its cult status in states where it operates."
      - "Culver's occupies the same role in Wisconsin that In-N-Out holds in California. The chain was founded in Prairie du Sac, Wisconsin, in 1984, and still has its headquarters there. It tops both the most-popular and local-favorite columns for the state. Whataburger fills that position in Texas: the San Antonio-founded chain leads both the most-popular and local-favorite columns despite Chick-fil-A and McDonald's both ranking in Texas's top 3 by visit count."
      - "In the Carolinas, Bojangles leads both North Carolina and South Carolina — a pattern rooted in the chain's founding in Charlotte in 1977 and its dominance of the Southern fried chicken biscuit category. Other state-specific local favorites that rarely appear in national fast-food rankings include Pal's Sudden Service in Tennessee, Tudor's Biscuit World in West Virginia, Gold Star Chili in Ohio, Maid-Rite in Iowa, HuHot Mongolian Grill in Montana, Nick's Hamburger Shop in South Dakota, and Blake's Lotaburger in New Mexico. These chains hold genuine local loyalty that national popularity studies consistently undercount."

  - id: "how-rankings-work"
    icon: "fa-solid fa-circle-info"
    title: "How the Most Popular Fast-Food Chains Were Ranked"
    paragraphs:
      - "The Most Popular Chain column in this table reflects search interest and study-based popularity, primarily from the FinanceBuzz / Visual Capitalist Google Trends methodology. Google Trends compares the relative search volume for fast-food chain names within each state over a defined period. A chain that generates the most searches in a state registers here even if it has fewer locations or lower customer ratings than its competitors. This is why Shake Shack leads New York despite having far fewer locations than McDonald's — New Yorkers search for it more."
      - "The Top Rated Chain column reflects customer satisfaction ratings, with the American Customer Satisfaction Index as the primary source. Chick-fil-A has led the ACSI limited-service restaurant category for most years since 2015, which explains why it appears as top-rated in 38 of 50 states. Satisfaction scores measure how happy customers are when they visit — not how often they visit or how much they search for the chain."
      - "The Top 3 Chains column reflects the most-visited chains by transaction volume or location count, based on location data from ScrapeHero and similar commercial datasets. McDonald's, Domino's, Starbucks, and Pizza Hut dominate this column nationally because they have the most locations and highest transaction frequency. This metric measures market presence and habit, not preference or satisfaction. A state can have McDonald's in its top 3 while its residents name Whataburger or In-N-Out as their actual favorite — both statements are true, they just measure different things."
      - "The Local / Regional Favorite column is editorial, sourced from local food media, regional brand loyalty surveys, and state-level dining guides. It identifies chains that residents of a given state consider distinctly theirs, regardless of national rankings. These picks sometimes overlap with the Most Popular Chain column (Whataburger in Texas, Culver's in Wisconsin) and sometimes diverge significantly (Wawa in Pennsylvania, Dunkin' in Massachusetts)."

