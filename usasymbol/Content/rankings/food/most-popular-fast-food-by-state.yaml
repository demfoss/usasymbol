faq:
  - question: "What is the most popular fast-food chain by state?"
    answer: "It varies by state and by how you measure popularity. By search interest and study data, Wendy's and Sonic each lead in five states — more than any other chain. McDonald's leads by visit count in most states but tops the search-interest column in zero. See the full table above for every state's most popular chain."

  - question: "Which fast-food chain leads in the most states?"
    answer: "Wendy's and Sonic are tied at five states each in the most-popular-by-search-interest column. Wendy's leads Montana, Ohio, Pennsylvania, Utah, and West Virginia. Sonic leads Arkansas, Kansas, Mississippi, New Mexico, and Oklahoma."

  - question: "What is the number one fast-food chain in the US overall?"
    answer: "By number of locations and visit frequency, McDonald's is the largest fast-food chain in the United States, appearing in the top 3 most-visited chains in 46 of 50 states. By customer satisfaction, Chick-fil-A leads the American Customer Satisfaction Index for most years since 2015. By state-level search interest, no single chain leads nationally."

  - question: "What is the most popular fast food in the South?"
    answer: "Sonic and Chick-fil-A dominate the South by search interest and top-rated metrics. Sonic leads Arkansas, Kansas, Mississippi, New Mexico, and Oklahoma. Bojangles tops both North and South Carolina. Popeyes leads Louisiana, where it was founded."

  - question: "Why does McDonald's lead the top-3 column but not the most-popular column?"
    answer: "The two columns measure different things. Top 3 reflects the chains with the most locations and highest visit frequency in a state — McDonald's wins by pure market presence. Most Popular Chain reflects search interest and study-based popularity data: people search more for regional favorites like Whataburger or Shake Shack because those chains carry more novelty and local identity, even if McDonald's handles more transactions."

