        - { rank: 5, state: "Wisconsin", state_slug: "wisconsin", per_million: "20.21", count: "121" }
        - { rank: 6, state: "South Dakota", state_slug: "south-dakota", per_million: "20.15", count: "19" }
        - { rank: 7, state: "Indiana", state_slug: "indiana", per_million: "19.97", count: "140" }
        - { rank: 8, state: "Minnesota", state_slug: "minnesota", per_million: "19.10", count: "112" }
        - { rank: 9, state: "Colorado", state_slug: "colorado", per_million: "17.56", count: "106" }
        - { rank: 10, state: "North Dakota", state_slug: "north-dakota", per_million: "17.38", count: "14" }
    paragraphs:
      - "Nebraska has 58 Jimmy John's locations, only 18th by count, yet its 28.57 per million residents beat every other state. Iowa follows at 27.11, and Illinois ranks third at 22.93."
      - "California has 67 locations, ranked 16th by count, but its 39 million residents leave it at 1.70 per million. Texas, with 215 stores, reaches only 6.70."
  - id: "states-with-the-fewest-jimmy-johns-locations"
    title: "States With the Fewest Jimmy John's Locations"
    paragraphs:
      - "Delaware has 2 Jimmy John's locations, Connecticut has 3, and New Jersey has 7. New Jersey is the weakest market per resident at 0.73 per million, while [Jersey Mike's locations by state](/rankings/food/jersey-mikes-locations-by-state) shows a chain founded on the Jersey Shore with 147 shops there."
