sections:
  - id: "why-illinois-has-the-most-jimmy-johns-locations"
    title: "Why Illinois Has the Most Jimmy John's Locations"
    paragraphs:
      - "Illinois has 292 Jimmy John's locations because the chain started there. Founder Jimmy John Liautaud opened the first shop in 1983 in Charleston, a college town in the east of the state, and the brand grew outward through campuses and small cities."
      - "Michigan (219), Ohio (141), Indiana (140), Wisconsin (121), and Minnesota (112) all follow that Midwest path. Texas, with 215, is the only state outside the region in the top three."
  - id: "jimmy-johns-locations-per-million-residents"
    title: "Jimmy John's Locations per Million Residents"
    table:
      columns: { rank: "Rank", state: "State", per_million: "Locations per Million Residents", count: "Locations" }
      rows:
        - { rank: 1, state: "Nebraska", state_slug: "nebraska", per_million: "28.57", count: "58" }
        - { rank: 2, state: "Iowa", state_slug: "iowa", per_million: "27.11", count: "88" }
