faq:
  - question: Which state has the most Arby's restaurants?
    answer: Ohio ranks first with 269. Nearby Michigan and Indiana also rank near the top, placing the chain's largest state networks around its original region.
  - question: How many Arby's locations are in Texas?
    answer: Texas has 143 listed restaurants and shares fourth place with Florida. Ohio's neighbors Michigan and Indiana both rank higher, an unusual map for a national chain in a state associated with Texas-born Whataburger.
  - question: How many Arby's locations are in Michigan?
    answer: Michigan has 175, placing it second. Its border with Ohio puts it beside the chain's founding market in Boardman, near Youngstown.
  - question: Which states have no listed Arby's locations?
    answer: Vermont and Rhode Island have no listed restaurants. Their absence extends the chain's sparse New England footprint, where New Hampshire has one and Massachusetts two.
  - question: Does Arby's stand for roast beef?
    answer: Arby's comes from the initials of the Raffel brothers, who founded the chain in Ohio. Roast beef fits the same initials, which helps explain the common alternative interpretation.
