seo:
  title: Arby's Locations by State | Map & Counts
  description: Ohio has 269 Arby's locations, the most of any state. New Hampshire has one, while Vermont and Rhode Island are absent from the directory.
page:
  h1: Arby's Locations by State
  quick_answer:
    - Arby's locations by state are led by Ohio with 269 restaurants. The chain began in Boardman, Ohio, giving its home region an early foothold.
    - New Hampshire has one listed restaurant. The chain's smallest network sits far from its original Ohio market, in New England rather than the Great Lakes.
    - Michigan has 175 locations and Indiana has 168. Both border Ohio, placing the chain's largest neighboring networks around its founding state.
  methodology: Arby's official US regional directory counts listed restaurants as retrieved October 3, 2026. Territories and unlisted Vermont and Rhode Island are excluded, with equal counts sharing ranks.
  sources:
    - name: Arby's Official Restaurant Directory
      url: https://www.arbys.com/locations/all/
      description: Public regional locator data retrieved October 3, 2026, with state totals checked against restaurant records.
    - name: Arby's Public Locator API
      url: https://api.arbys.com/arb/digital-exp-api/v1/locations/regions?countryCode=US
      description: Underlying US region and restaurant records used by the official directory.
    - name: Inspire Brands Founder History
      url: https://stories.inspirebrands.com/the-passing-of-arbys-co-founder-leroy-raffel/
      description: Founding in Boardman, Ohio, and the Raffel brothers behind the brand name.
