sections:
  - id: states-with-most-arbys
    title: States With the Most Arby's Locations
    paragraphs:
      - Michigan's 175 restaurants and Indiana's 168 put both Ohio neighbors ahead of Texas. That makes Arby's a useful counterexample to [Whataburger's state footprint](/rankings/food/whataburger-locations-by-state), where a different founding market anchors the restaurant network.
