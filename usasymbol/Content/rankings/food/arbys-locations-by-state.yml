  - id: why-ohio-leads-arbys
    title: Why Ohio Has the Most Arby's
    paragraphs:
      - Ohio's 269 restaurants sit in the chain's original market. Leroy and Forrest Raffel opened their first restaurant in Boardman in 1964, selling roast beef sandwiches as an alternative to hamburgers, and the surrounding region became an early base for the brand.
      - New Hampshire's single restaurant sits far from the chain's original Great Lakes base. Neighboring Massachusetts has two and Maine four, so the state's last place fits a wider New England gap in a network centered on Ohio and its neighbors. [McDonald's locations](/rankings/food/mcdonalds-by-state) offer a comparison with a chain founded in California.
