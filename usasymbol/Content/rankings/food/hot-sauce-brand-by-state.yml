faq:
  - question: "What is the most popular hot sauce brand by state?"
    answer: "Frank's RedHot is the most popular hot sauce brand by state, leading 16 states on this map. Louisiana Hot Sauce ranks second with 8 states."

  - question: "What is the most popular hot sauce in Louisiana?"
    answer: "Tabasco is the most popular hot sauce in Louisiana. Louisiana Hot Sauce, which carries the state's name, wins eight other Southern states instead but not its own namesake."

  - question: "What is the most popular hot sauce in Texas?"
    answer: "Louisiana Hot Sauce is the most popular hot sauce in Texas, one of 8 states where it ranks first."

  - question: "What is the most popular hot sauce in California?"
    answer: "Tapatio is the most popular hot sauce in California. Nevada is the only other state where Tapatio ranks first."

  - question: "Which states have a hot sauce brand found nowhere else?"
    answer: "Nine states favor a brand that wins nowhere else on the map: Nanita's Finest in Colorado, Huy Fong Sriracha in Iowa, Spanish Gardens in Kansas, Trappey's in Nebraska, Monroe's in New Mexico, Mexican Village Restaurant in North Dakota, Heinz in South Dakota, Ox Brand in Wyoming, and Valentina in Arizona."

  - question: "What is the most popular hot sauce in Hawaii?"
    answer: "Tabasco is the most popular hot sauce in Hawaii. Louisiana is the only other state where Tabasco ranks first."

