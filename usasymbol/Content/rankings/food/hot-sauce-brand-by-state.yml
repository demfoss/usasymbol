sections:
  - id: "states-where-franks-redhot-is-most-popular"
    icon: "fa-solid fa-pepper-hot"
    title: "States Where Frank's RedHot Is Most Popular"
    paragraphs:
      - "Frank's RedHot is the most popular hot sauce in 16 states, more than any other brand on this map. It wins across the Northeast and Midwest, from Maine and New York to Michigan and Wisconsin."
      - "The brand also leads Alaska, Connecticut, Indiana, Kentucky, Massachusetts, New Hampshire, New Jersey, Ohio, Pennsylvania, Rhode Island, Vermont, and West Virginia, giving it the widest reach of any single brand on the list."

  - id: "states-where-louisiana-hot-sauce-is-most-popular"
    icon: "fa-solid fa-bottle-droplet"
    title: "States Where Louisiana Hot Sauce Is Most Popular"
    paragraphs:
      - "Louisiana Hot Sauce ranks second with 8 states: Alabama, Arkansas, Illinois, Mississippi, Missouri, Oklahoma, Tennessee, and Texas."
      - "Louisiana itself is not one of them. The state favors Tabasco instead, and Hawaii is the only other state where Tabasco ranks first."

  - id: "states-with-a-local-hot-sauce-brand"
    icon: "fa-solid fa-star"
    title: "States With a Local Hot Sauce Brand"
    paragraphs:
      - "Nine states favor a brand that does not win anywhere else on the map. Colorado picks Nanita's Finest, Iowa picks Huy Fong Sriracha, and Kansas picks Spanish Gardens."
      - "Nebraska favors Trappey's, New Mexico favors Monroe's, and North Dakota favors Mexican Village Restaurant. South Dakota picks Heinz, Wyoming picks Ox Brand, and Arizona picks Valentina."

