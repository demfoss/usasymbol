faq:
  - question: How many Five Guys restaurants are in Florida?
    answer: Florida has 130 listed restaurants. Cape Coral on the Gulf side and Daytona Beach on the Atlantic side illustrate how the network reaches both coasts.
  - question: How many Five Guys locations are in California?
    answer: California has 99 and ranks second. Locations in San Francisco, Fresno, and San Diego-area Chula Vista span coastal and Central Valley markets.
  - question: How many Five Guys restaurants are in Virginia?
    answer: Virginia has 79 and ranks fifth. The Murrell family opened Five Guys as a carry-out burger restaurant in Arlington before taking the business into franchising.
  - question: Which state has the fewest Five Guys locations?
    answer: Vermont and Wyoming share the lowest listed count at two each. Neither has a metropolitan market on the scale of Miami, Tampa, or Orlando, where a chain can serve many separate neighborhoods.
  - question: Are Five Guys restaurants in every state?
    answer: Five Guys lists restaurants in 49 states, with Alaska absent. The Virginia-founded chain began offering franchises in 2003, the business model behind its reach far beyond the Washington area.
