  description: Florida has 130 Five Guys restaurants, followed by California with 99. Vermont and Wyoming have two each, the fewest among listed states.
page:
  h1: Five Guys Locations by State
  quick_answer:
    - Five Guys locations by state are led by Florida with 130 restaurants. The network reaches separate markets around Jacksonville, Orlando, Tampa, and South Florida.
    - Vermont and Wyoming have two restaurants each, the smallest listed networks. Their small populations offer fewer large city markets than Florida's coastal and inland urban areas.
    - Virginia has 79 locations. Five Guys began in Arlington, but its founding state does not have the largest current network.
  methodology: Five Guys' official state directory counts listed restaurants as retrieved October 3, 2026. DC, overseas locations, and unlisted Alaska are excluded, with equal counts sharing ranks.
