  - id: why-florida-leads-five-guys
    title: Why Florida Leads Five Guys Locations
    paragraphs:
      - Florida's 130 restaurants reach multiple separated city markets, including Jacksonville, Orlando, Tampa, Miami, and the southwest coast. Restaurants in places such as Cape Coral, Daytona Beach, and Winter Park give the chain a presence beyond the largest city centers, helping build its statewide lead across both coasts and the interior.
      - Vermont and Wyoming each have two listed restaurants in states with small populations and few large urban markets. Vermont's towns lie around the Green Mountains, while Wyoming's population centers are separated by broad stretches of plains and mountains. Their smaller city markets help explain a thinner restaurant network than Florida's, a contrast also worth exploring in [McDonald's state counts](/rankings/food/mcdonalds-by-state).
