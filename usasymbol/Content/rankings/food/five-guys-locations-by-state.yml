sections:
  - id: states-with-most-five-guys
    title: States With the Most Five Guys Locations
    paragraphs:
      - Virginia's 79 restaurants place the original market behind Florida, California, New York, and Texas. Five Guys began as an Arlington takeout business before adopting franchising in 2003, a different expansion model from [In-N-Out's restaurant network](/rankings/food/in-n-out-locations-by-state).
