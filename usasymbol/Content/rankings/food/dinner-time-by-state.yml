sections:
  - id: "states-that-eat-dinner-the-earliest"
    icon: "fa-solid fa-sun"
    title: "States That Eat Dinner the Earliest"
    paragraphs:
      - "Pennsylvania has the earliest peak dinner time of any state at 5:37 p.m. Maine is second at 5:40 p.m. After those two, six states share a 6:00 p.m. peak: Alaska, New Hampshire, New Mexico, North Dakota, Vermont, and Wyoming."
      - "Pennsylvania's early dinner time is linked to its large rural and industrial communities, where early work shifts in agriculture, manufacturing, and trades push mealtimes earlier. Maine shows a similar pattern, with a predominantly rural population and fishing and forestry industries."
      - "The early-dinner cluster after 6:00 p.m. is geographically broad but leans Northern and Mountain West. Washington (6:01 p.m.) and Oregon (6:02 p.m.) eat earlier than most Pacific Coast states are assumed to. Kentucky (6:04 p.m.) is the earliest Southern state. Florida (6:05 p.m.) is shaped in part by its large retiree population, which tends to eat earlier than working-age adults."

  - id: "states-that-eat-dinner-the-latest"
    icon: "fa-solid fa-moon"
    title: "States That Eat Dinner the Latest"
    paragraphs:
      - "Texas and Mississippi have the latest peak dinner time among states at 7:02 p.m. Arkansas and Tennessee follow at 7:00 p.m. The gap between the earliest state (Pennsylvania, 5:37 p.m.) and the latest states (Texas and Mississippi, 7:02 p.m.) is 1 hour and 25 minutes."
      - "Later-dinner states tend to have active restaurant cultures and larger working households where dinner often begins after 6:30 p.m. Texas and Mississippi sit at the far end of that pattern, with Arkansas and Tennessee close behind."
      - "Mississippi, Texas, Tennessee, and Arkansas all peak at or after 7:00 p.m. These states have active restaurant cultures and large working households where dinner typically begins after 6:30 p.m. Nebraska (6:51 p.m.) and Missouri (6:45 p.m.) are the late outliers among Midwestern states."

  - id: "what-time-do-americans-usually-eat-dinner"
    icon: "fa-solid fa-utensils"
    title: "What Time Do Americans Usually Eat Dinner?"
    paragraphs:
      - "The national peak dinner time is 6:19 p.m., the moment when the largest share of Americans are eating their evening meal. California's 6:19 p.m. exactly matches this national figure. Most Americans eat dinner somewhere between 5:07 p.m. and 8:19 p.m., with the sharpest concentration between 6:00 p.m. and 7:00 p.m."
      - "Only six states have a peak dinner time outside the 6:00–6:30 p.m. range: Pennsylvania (5:37 p.m.) and Maine (5:40 p.m.) eat before 6:00 p.m., while Mississippi (7:02 p.m.), Texas (7:02 p.m.), Arkansas (7:00 p.m.), and Tennessee (7:00 p.m.) peak at or after 7:00 p.m. The large middle cluster, from Louisiana and Michigan at 6:10 p.m. to Iowa, Hawaii, and Idaho at 6:30 p.m., eats within a tight 20-minute band around the national average."

