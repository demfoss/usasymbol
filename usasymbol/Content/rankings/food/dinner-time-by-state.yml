faq:
  - question: "What time do most Americans eat dinner?"
    answer: "The national peak dinner time is 6:19 p.m., based on American Time Use Survey data. That is the moment when the largest share of Americans are eating their evening meal. Most people eat somewhere between 5:00 p.m. and 8:30 p.m., with the heaviest concentration between 6:00 and 7:00 p.m."

  - question: "What state eats dinner the earliest?"
    answer: "Pennsylvania has the earliest peak dinner time at 5:37 p.m., followed by Maine at 5:40 p.m. Six states share a 6:00 p.m. peak: Alaska, New Hampshire, New Mexico, North Dakota, Vermont, and Wyoming."

  - question: "What state eats dinner the latest?"
    answer: "Texas and Mississippi tie for the latest peak dinner time at 7:02 p.m., followed by Arkansas and Tennessee at 7:00 p.m."

  - question: "Why does Pennsylvania eat dinner so early?"
    answer: "Pennsylvania's early peak dinner time of 5:37 p.m. is linked to its large rural and industrial population. Early work shifts in agriculture, manufacturing, and trades push mealtimes earlier. Maine shows the same pattern, with a predominantly rural population and fishing and forestry industries that start and end the workday early."

