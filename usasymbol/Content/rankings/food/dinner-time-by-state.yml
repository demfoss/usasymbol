page:
  h1: "Average Dinner Time by State"

  quick_answer:
    - "Pennsylvania has the earliest peak dinner time in the United States at 5:37 p.m., while Texas and Mississippi are the latest at 7:02 p.m. The national peak is 6:19 p.m., with most states clustering between 6:00 and 6:30 p.m."
    - "Peak dinner time is the moment when the highest share of residents in a state are eating their evening meal, based on American Time Use Survey data. It is not a fixed schedule, and most Americans eat somewhere between 5:00 p.m. and 8:30 p.m."

  methodology: "Peak dinner time represents the time of day when the highest share of residents in a state are eating their evening meal, based on American Time Use Survey (ATUS) data from 2018–2019 and 2021–2022. The 2020 survey year was excluded due to pandemic disruptions to normal eating schedules. Data compiled and ranked by World Population Review from ATUS analysis."

