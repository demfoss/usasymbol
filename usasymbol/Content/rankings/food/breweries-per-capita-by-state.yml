  description: "Vermont has 14.6 craft breweries per 100,000 adults, the most of any state. Maine is second at 14.2 and Mississippi last at 1.0."
page:
  h1: "Breweries per Capita by State"
  quick_answer:
    - "Vermont has the most craft breweries per capita at 14.6 per 100,000 adults 21 and older. Just 74 breweries are enough to top the list because so few people live in the state."
    - "Mississippi has the fewest at 1.0, with 21 breweries. It legalized homebrewing only in 2013, the last state to do so, and its craft scene started years behind."
    - "California has the most breweries in total at 939, yet ranks 31st per capita at 3.2. Colorado, home of Coors, sits 6th at 9.4."
  methodology: "Craft breweries per 100,000 adults 21 and older, 2025 state figures from the Brewers Association. Brewery counts are craft breweries operating in 2025. The District of Columbia and Puerto Rico are excluded."
  sources:
    - name: "Brewers Association. State Craft Beer Sales and Production Statistics, 2025"
