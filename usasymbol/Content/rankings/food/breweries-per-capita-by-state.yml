  - id: states-with-the-most-craft-breweries
    title: "States With the Most Craft Breweries"
    paragraphs:
      - "California has 939 craft breweries, far more than any other state, yet only 3.2 per 100,000 adults because so many people live there. Pennsylvania (538) and New York (525) follow. Pennsylvania ties Michigan at 5.4 per 100,000 adults, so its total comes from size as much as from enthusiasm."
      - "Colorado is the one big producer that also ranks near the top per capita. Its 423 breweries put it 5th in total and 6th at 9.4 per 100,000 adults, and Coors has been brewing in Golden since 1873. The full count-based list is on the [states with the most breweries](/rankings/economy/states-with-the-most-breweries) page."
    table:
