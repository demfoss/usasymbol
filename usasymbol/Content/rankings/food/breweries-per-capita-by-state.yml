faq:
  - question: "Which state has the most breweries per capita?"
    answer: "Vermont, with 14.6 craft breweries per 100,000 adults 21 and older. Maine is second at 14.2 and Montana third at 12.2."
  - question: "Which state has the fewest breweries per capita?"
    answer: "Mississippi, at 1.0 per 100,000 adults. Alabama at 1.3 and Louisiana at 1.5 are next lowest."
  - question: "Which state has the most craft breweries in total?"
    answer: "California, with 939. Pennsylvania has 538 and New York 525."
  - question: "How many breweries are in Colorado?"
    answer: "Colorado has 423 craft breweries, or 9.4 per 100,000 adults, which ranks 6th. Denver and Fort Collins are the best known brewing cities."
  - question: "How many breweries are in Oregon?"
    answer: "Oregon has 297 craft breweries, or 9.0 per 100,000 adults, which ranks 8th. Portland is often called one of the great beer cities of the country."
  - question: "Why does Texas rank low for breweries per capita?"
    answer: "Texas has 420 breweries, the 6th most of any state, but only 1.9 per 100,000 adults, which ranks 47th. A huge population spreads those breweries thin. Compare it with [beer consumption by state](/rankings/food/beer-consumption-by-state) to see where people drink the most."
