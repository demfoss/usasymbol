sections:
  - id: why-vermont-has-the-most-breweries-per-capita
    title: "Why Vermont Has the Most Breweries"
    paragraphs:
      - "Vermont has 74 craft breweries, which works out to 14.6 per 100,000 adults, the highest rate in the country. Hazy IPAs such as Heady Topper from The Alchemist made small Vermont brewers famous and sent beer fans driving across state lines for a few cans."
      - "Maine (14.2), Montana (12.2), Alaska (11.5), and Wyoming (11.2) complete the top five. All four are thinly settled, so a few taprooms in tourist towns move the rate a long way. Wyoming reaches 11.2 with only 49 breweries. See the [states by population](/rankings/demographics/states-by-population) ranking for how small these populations are."
