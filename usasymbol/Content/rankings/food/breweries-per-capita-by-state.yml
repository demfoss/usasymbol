  - id: states-with-the-fewest-breweries-per-person
    title: "States With the Fewest Breweries per Person"
    paragraphs:
      - "Mississippi trails at 1.0 per 100,000 adults, with 21 breweries. The state lifted its cap on beer strength in 2012 and legalized homebrewing in 2013, the last state to do so, so craft brewers there started years after the rest of the country. Alabama (1.3) and Louisiana (1.5) are next lowest. Rules on home production are covered in the [homebrewing laws by state](/rankings/law/homebrewing-laws-by-state) ranking."
      - "Texas has 420 breweries, 6th most in the country, but ranks 47th at 1.9 because its population is so large. Utah (2.0) and Nevada (2.0) tie for 45th."
