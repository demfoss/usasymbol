page:
  h1: "Spiciest Food Tolerance by State"

  quick_answer:
    - "New Mexico buys the most hot sauce of any state, 27.4 ounces per customer over a 12-month span, the highest figure in Instacart's state-by-state hot sauce data."
    - "Alaska ranks second at 27.2 ounces per customer, just 0.2 ounces behind New Mexico, ahead of California (26.6) and Colorado (25.9)."
    - "Alabama buys the least hot sauce per customer of any state at 16.8 ounces, behind Arkansas (17.7) and North Dakota (18.1). Louisiana, known for spicy Cajun cooking, ranks 47th at 18.2 ounces."

  methodology: "Figures show ounces of hot sauce purchased per customer on Instacart between 10/1/2024 and 9/30/2025, as published by Instacart. Data from select retailers was removed from certain states as legally required; Washington, D.C. is excluded here to cover the 50 states only."

  sources:
