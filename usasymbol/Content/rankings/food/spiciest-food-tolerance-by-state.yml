sections:
  - id: "states-with-the-highest-hot-sauce-tolerance"
    icon: "fa-solid fa-pepper-hot"
    title: "States With the Highest Hot Sauce Tolerance"
    paragraphs:
      - "New Mexico buys more hot sauce than any other state, 27.4 ounces per customer between October 2024 and September 2025, the top figure in Instacart's ranking. Alaska sits close behind at 27.2 ounces, ahead of California (26.6) and Colorado (25.9)."
      - "Nevada (24.3) and Arizona (24.1) round out the top six, keeping four of the six highest-ranked states in the Southwest or Mountain West. Alaska breaks that pattern; its 27.2-ounce figure places it second nationally despite sitting far from that regional cluster."

  - id: "states-with-the-lowest-hot-sauce-tolerance"
    icon: "fa-solid fa-droplet-slash"
    title: "States With the Lowest Hot Sauce Tolerance"
    paragraphs:
      - "Alabama buys the least hot sauce per customer of any state, 16.8 ounces, just below Arkansas (17.7) and North Dakota (18.1). Louisiana ranks 47th at 18.2 ounces, a low placement for a state widely associated with spicy Cajun and Creole cooking."
      - "Florida (18.6), South Dakota (18.4), and Mississippi (18.4) also sit near the bottom of the table. None of the five lowest-ranked states reach 19 ounces per customer, compared with 27.4 ounces in top-ranked New Mexico."

