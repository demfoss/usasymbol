faq:
  - question: "Which state buys the most hot sauce?"
    answer: "New Mexico buys the most hot sauce per customer of any state, 27.4 ounces in Instacart's 12-month dataset. Alaska ranks second at 27.2 ounces, less than a third of an ounce behind."

  - question: "Which state buys the least hot sauce?"
    answer: "Alabama ranks last at 16.8 ounces per customer, the lowest figure of any state. Arkansas (17.7 ounces) and North Dakota (18.1 ounces) are the next lowest."

  - question: "Does Louisiana buy a lot of hot sauce?"
    answer: "Louisiana ranks 47th out of 50 states at 18.2 ounces per customer, well below top-ranked New Mexico's 27.4 ounces, despite the state's reputation for spicy Cajun and Creole food."

  - question: "How much hot sauce do Texas customers buy?"
    answer: "Texas customers buy 21.4 ounces of hot sauce per year, placing the state 22nd nationally, below New Mexico (27.4), Colorado (25.9), and Arizona (24.1)."

  - question: "Is Alaska a big hot sauce state?"
    answer: "Alaska ranks second nationally at 27.2 ounces of hot sauce per customer, trailing only New Mexico's 27.4 ounces and ahead of California (26.6) and Colorado (25.9)."

  - question: "What time period does this hot sauce data cover?"
    answer: "The figures cover the 12-month period from October 1, 2024 through September 30, 2025, measured in ounces of hot sauce purchased per customer on Instacart."

