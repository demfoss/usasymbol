page:
  h1: "Michelin Star Restaurants by State"

  quick_answer:
    - "Michelin star restaurants by state are led by California with 83, including 10 with three stars. Michelin has covered the Bay Area since 2007 and the whole state since 2019."
    - "New York ranks second with 71 and Florida third with 25. Illinois has 19, and its single three-star restaurant, Smyth in Chicago, is one of only 16 in the country."
    - "Massachusetts and North Carolina each have one starred restaurant. Virginia also has one, The Inn at Little Washington, and it holds two stars."

  methodology: "MICHELIN Guide USA listings on guide.michelin.com in November 2026, counting the latest published selection of each guide region. Only the 14 states with at least one starred restaurant appear, and a state with no current guide is not ranked. Rank 1 is the most starred restaurants, ties are broken by total stars (a three-star counts as 3), and states still tied share a rank. Three Las Vegas restaurants listed only from the discontinued 2008-2009 guide are not counted."

  sources:
    - name: "MICHELIN Guide USA, Restaurants by Star Level"
      url: "https://guide.michelin.com/us/en/restaurants/3-stars-michelin/2-stars-michelin/1-star-michelin"
      description: "Official listings of one, two, and three star restaurants filtered by state and guide region"
