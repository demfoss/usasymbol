sections:
  - id: "why-california-has-the-most-michelin-star-restaurants"
    title: "Why California Has the Most Michelin Star Restaurants"
    paragraphs:
      - "California has 83 starred restaurants and 10 of the 16 three-star restaurants in the country, four of them in San Francisco. Michelin reached the Bay Area in 2007, a year after New York, and extended its inspections to the whole state in 2019."
      - "Napa and Sonoma add tasting-menu destinations such as The French Laundry in Yountville, built around the same farmland that drives [wine production by state](/rankings/food/wine-production-by-state). Los Angeles and San Diego supply more, including Providence and Addison."
    table:
      columns:
        state: "State"
        three_star: "Three-Star Restaurants"
      rows:
        - state: "California"
          three_star: "10"
        - state: "New York"
          three_star: "5"
        - state: "Illinois"
          three_star: "1"

  - id: "michelin-stars-in-texas-and-the-south"
    title: "Michelin Stars in Texas and the South"
    paragraphs:
      - "Texas has 19 starred restaurants, every one with a single star, and four of them are barbecue joints. LeRoy and Lewis and InterStellar BBQ in Austin, Goldee's Bar-B-Q in Fort Worth, and CorkScrew BBQ in Spring earned stars for brisket cooked over wood. The guide reached Texas in 2024."
      - "Florida ranks third with 25, mostly in Miami, Orlando, and Tampa, and has two restaurants with two stars. Louisiana's one two-star restaurant is Emeril's in New Orleans. Georgia has 10 starred restaurants, from Atlanta to the town of Gay."

  - id: "states-with-one-michelin-star-restaurant"
    title: "States With One Michelin Star Restaurant"
    paragraphs:
      - "Massachusetts has one starred restaurant, 311 Omakase in Boston, and North Carolina has one, Counter in Charlotte. Each state is covered through a single city, which keeps the count at one."
      - "Virginia's lone restaurant is The Inn at Little Washington, a country inn in Washington, Virginia, and it holds two stars. The District of Columbia, which is not ranked, has 20 starred restaurants, including two-star Jônt and minibar by José Andrés."
    table:
