faq:
  - question: "Which state has the most Michelin star restaurants?"
    answer: "California has the most with 83, ahead of New York with 71. California also has 10 three-star restaurants, the most of any state."

  - question: "How many Michelin star restaurants are in New York?"
    answer: "New York has 71 starred restaurants, 5 with three stars, 15 with two, and 51 with one. Most are in New York City, where Michelin published its first U.S. guide in 2006."

  - question: "Which states have Michelin star restaurants?"
    answer: "Fourteen states have at least one, from California, New York, and Florida to Massachusetts, North Carolina, and Virginia. The District of Columbia has 20 as well."

  - question: "Which states have three-star Michelin restaurants?"
    answer: "Only three. California has 10, New York has 5, and Illinois has 1, Smyth in Chicago."

  - question: "How many Michelin star restaurants are in Texas?"
    answer: "Texas has 19, all with one star, in Austin, Houston, San Antonio, Dallas, Fort Worth, and Spring. Four are barbecue restaurants."

  - question: "How many Michelin star restaurants are in Washington, D.C.?"
    answer: "The District of Columbia has 20, with two stars at Jônt and minibar by José Andrés and one star at the other 18. See [chef salary by state](/rankings/economy/chef-salary-by-state) for what the cooks behind such kitchens earn."

