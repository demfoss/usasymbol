sections:
  - id: "why-california-leads-the-taco-bell-count"
    icon: "fa-solid fa-bell"
    title: "Why California Leads the Taco Bell Count"
    paragraphs:
      - "California leads with 854 Taco Bell locations, 147 more than Texas and 404 more than Florida. The three largest totals belong to three of the nation's most populous states."
      - "The count includes company, franchise, and licensed units. It measures the chain's physical footprint, not restaurant sales, customer traffic, or locations per resident."

  - id: "how-to-read-the-lowest-taco-bell-counts"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "How to Read the Lowest Taco Bell Counts"
    paragraphs:
      - "Vermont has 1 Taco Bell location, followed by Maine with 7 and New Hampshire with 12. North Dakota and Wyoming each have 13."
      - "These are absolute unit totals. The ranking does not adjust for population, tourism, geography, or the distance residents travel to reach a restaurant."

