sections:
  - id: "states-that-spend-the-most-on-restaurants-and-takeout"
    icon: "fa-solid fa-bag-shopping"
    title: "States That Spend the Most on Restaurants and Takeout"
    paragraphs:
      - "Nevada puts more of its food budget toward restaurants and takeout than any other state, 64.9% of the total, spending $6,008 per person a year away from home against $3,254 on groceries. Oklahoma is close behind at 64.3%, followed by Rhode Island (60.5%), New York (59.8%), and California (58.6%)."
      - "Hawaii spends the most in raw dollars on groceries among the top group at $3,964 per person, yet still crosses 58.4% away from home because its restaurant spending, $5,572 per person, is the second highest of any state after Nevada's $6,008. Massachusetts (57.4%) and Mississippi (56.2%) round out the top eight."
    table:
      columns:
        rank: "Rank"
        state: "State"
        fafh_share: "Away-From-Home Share"
      rows:
        - rank: 1
          state: "Nevada"
