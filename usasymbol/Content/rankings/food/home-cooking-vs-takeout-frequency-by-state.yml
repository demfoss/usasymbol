faq:
  - question: "Which state spends the most on takeout and restaurants?"
    answer: "Nevada spends the most, with 64.9% of its food budget going to restaurants and takeout, $6,008 per person a year. Oklahoma is second at 64.3%, and Rhode Island is third at 60.5%."

  - question: "Which state relies most on home cooking?"
    answer: "Washington relies most on home cooking. Only 46.1% of its food budget goes away from home, the lowest share of any state, and its $4,612 per-person grocery spending is the highest in the country."

  - question: "Why does Oklahoma rank so high for away-from-home spending?"
    answer: "Oklahoma's 64.3% away-from-home share, second highest nationally, comes from unusually low grocery spending, $1,815 per person, the lowest of any state, rather than from high restaurant spending. Its $3,265 per-person restaurant and takeout total is close to the $3,686 state average."

  - question: "How does Texas compare on home cooking versus takeout spending?"
    answer: "Texas spends 55.8% of its food budget away from home, ranking 10th nationally, with $4,061 per person going to restaurants and takeout versus $3,214 on groceries."

  - question: "What is the average away-from-home spending share across all states?"
    answer: "The 50-state average is 53.7%. States range from Nevada's 64.9% down to Washington's 46.1%, an 18.8-point spread between the highest and lowest states."

  - question: "Which states spend the least on groceries?"
    answer: "Oklahoma spends the least on groceries at $1,815 per person a year. West Virginia is second lowest at $2,341, followed by Mississippi at $2,471."

