page:
  h1: "Home Cooking vs Takeout by State"

  quick_answer:
    - "Nevada spends the highest share of its food budget away from home at 64.9%, paying $6,008 per person annually on restaurants and takeout against $3,254 on groceries, the highest food-away-from-home total of any state."
    - "Washington has the lowest away-from-home share at 46.1%. Residents there spend $4,612 per person on groceries, the highest at-home total in the country, compared with $3,937 on restaurants and takeout."
    - "Oklahoma ranks second for away-from-home share at 64.3%, not from heavy takeout spending but from the lowest grocery spending of any state, just $1,815 per person, about half the $3,169 state average."

  methodology: "Figures are 2025 per capita food sales, with taxes and tips, from the USDA Economic Research Service's Food Expenditure Series, split into food-at-home (grocery) and food-away-from-home (restaurant, takeout) categories."

  sources:
