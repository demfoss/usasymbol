  - id: "why-nevada-spends-the-most-on-takeout"
    icon: "fa-solid fa-magnifying-glass-dollar"
    title: "Why Nevada Spends the Most on Takeout"
    paragraphs:
      - "Nevada's figures reflect food sales recorded at establishments inside the state, not a survey of individual residents. Nevada's restaurant and casino-dining industry sells $6,008 per person a year, the highest food-away-from-home total on the list, which pushes its share to 64.9% even though its at-home spending of $3,254 sits close to the 50-state average of $3,169."
      - "Oklahoma reaches the number two spot, 64.3%, through the opposite path. Its away-from-home spending, $3,265 per person, is close to the state average. What sets Oklahoma apart is grocery spending of just $1,815 per person, the lowest of any state and $526 below the next-lowest, West Virginia's $2,341. A low denominator, not high takeout spending, drives Oklahoma's rank."

  - id: "states-that-rely-most-on-home-cooking"
    icon: "fa-solid fa-kitchen-set"
    title: "States That Rely Most on Home Cooking"
    paragraphs:
      - "Washington relies on home cooking more than any other state. Its away-from-home share is 46.1%, the lowest in the country, built on $4,612 per person in grocery spending, the highest at-home total of any state, against $3,937 spent on restaurants and takeout."
      - "Alaska (46.4%), Idaho (46.8%), and Maine and Pennsylvania, tied at 48.0%, complete the bottom five. All five spend at least $3,273 per person on groceries, above the $3,169 state average, while keeping away-from-home spending below $3,937 per person."
    table:
      columns:
        rank: "Rank"
        state: "State"
        fafh_share: "Away-From-Home Share"
      rows:
