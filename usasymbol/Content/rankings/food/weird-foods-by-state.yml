sections:
  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Weird Regional Foods Outsiders Don't Understand"
    paragraphs:
      - "Many weird regional foods only seem weird if you did not grow up with them. In the South, foods like boiled peanuts, livermush, chocolate gravy, and slugburgers are familiar local staples, not dare foods. In Alaska and the Northwest, akutaq and geoduck come from local food traditions and ingredients that outsiders simply do not see often."
      - "The same pattern shows up in other regions. In the Mountain West, Rocky Mountain oysters and lamb fries grew out of ranching culture. In the Northeast and Midwest, scrapple, lutefisk, garbage plate, and chow mein sandwiches reflect immigrant foodways, working-class traditions, and local taste rather than a goal of being shocking."
      - "That is why weird does not mean bad. On this page, weird means unusual to outsiders. Some foods have misleading names, some use uncommon ingredients, and some just look different from what most Americans expect. Inside their home regions, many of these dishes are ordinary comfort foods."

  - id: "not-official"
    icon: "fa-solid fa-certificate"
    title: "Are These Official State Foods?"
    paragraphs:
      - "No. Most weird foods by state are not official state foods or official state symbols. They are regional dishes, local specialties, traditional foods, novelty snacks, or foods strongly associated with a state."

