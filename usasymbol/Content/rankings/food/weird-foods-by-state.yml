faq:
  - question: "What is the weirdest food in America?"
    answer: "There is no single answer, but scorpion lollipops, Rocky Mountain oysters, akutaq, and geoduck are common picks."

  - question: "What state has the weirdest food?"
    answer: "Arizona is a common answer because scorpion lollipops show a real insect inside the candy."

  - question: "Are weird state foods official?"
    answer: "No. Most are regional foods or local specialties, not official state foods or official state symbols."

  - question: "What are the strangest regional foods in the U.S.?"
    answer: "Common examples include livermush, scrapple, lutefisk, geoduck, akutaq, Rocky Mountain oysters, slugburgers, and boiled peanuts."

  - question: "What are Rocky Mountain oysters?"
    answer: "Rocky Mountain oysters are fried bull testicles. The name sounds like seafood, but the dish is not oysters."

  - question: "What state is known for scorpion lollipops?"
    answer: "Arizona is the state most strongly associated with scorpion lollipops."


