      - "Houston has 129 McDonald's, more than any other US city. Texas's largest city sprawls across a huge area with no citywide zoning code, so restaurants can open along almost any busy road. Three of the top six cities, Houston, San Antonio, and Dallas, are in Texas."
      - "Las Vegas ranks fourth with 74 locations, a big total for a state that sits 33rd overall. Many restaurants on and near the Strip carry a Las Vegas address even though they stand in unincorporated Clark County, and round-the-clock tourist traffic keeps them busy."

