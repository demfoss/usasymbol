    paragraphs:
      - "Ohio has one McDonald's for every 18,910 residents, the densest ratio among the ten states with the most locations. Michigan (19,060) and Illinois (19,800) follow, all Midwestern states near the chain's home base. Ray Kroc opened his first franchised McDonald's in Des Plaines, Illinois, in 1955, and the company is still headquartered in Chicago."
      - "New York has the thinnest coverage in the top 10, one restaurant per 33,890 residents. Millions of New Yorkers ride the subway instead of driving, and Manhattan rents leave little room for drive-thru lots. All chains combined tell a similar story in the [fast food restaurants per capita by state](/rankings/food/fast-food-restaurants-per-capita-by-state) ranking."

