faq:
  - question: "Which state has the most McDonald's?"
    answer: "Texas, with 1,269 restaurants, about 9% of every McDonald's in the country. Florida ranks third at 906, helped by a steady flow of tourists to Orlando's theme parks."

  - question: "Which state has the fewest McDonald's?"
    answer: "North Dakota, with 24. Vermont (26) and Wyoming (28) come next, three states where small towns sit far apart and few highways carry heavy traffic."

  - question: "How many McDonald's are in the United States?"
    answer: "13,865 across the 50 states and US territories, as of June 29, 2026. They are spread over 5,041 cities."

  - question: "Is there a state capital without a McDonald's?"
    answer: "Yes. Montpelier, Vermont, is the only state capital with no McDonald's. It is also the smallest state capital by population, and Vermont has just 26 locations statewide."

  - question: "How many McDonald's are in California?"
    answer: "California has 1,234 McDonald's, second only to Texas. Los Angeles leads its cities with 66, fewer than Houston, Chicago, San Antonio, or Las Vegas, because the Los Angeles area is split into dozens of separate cities."

  - question: "Are there McDonald's in every US state and territory?"
    answer: "Every state has at least one. American Samoa and the U.S. Virgin Islands are the only US territories with no McDonald's restaurant."

