    paragraphs:
      - "Texas has 1,269 McDonald's, more than any other state and 35 more than California. Texans drive almost everywhere, and the state has more miles of public road than any other, so drive-thrus line the interstates, farm-to-market roads, and fast-growing suburbs around Houston, Dallas, and San Antonio."
      - "California trails with 1,234 locations despite having more than 10 million more residents. Land near the coast costs far more, several California cities have limited new drive-thrus, and [In-N-Out Burger](/rankings/food/in-n-out-locations-by-state), founded near Los Angeles in 1948, competes for the same burger customers."

