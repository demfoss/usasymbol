sections:
  - id: "why-texas-has-the-most-mcdonalds"
    icon: "fa-solid fa-arrow-trend-up"
    title: "Why Texas Has the Most McDonald's"
    table:
      columns:
        rank: "Rank"
        state: "State"
        count: "McDonald's Locations"
      rows:
        - rank: 1
          state: "Texas"
