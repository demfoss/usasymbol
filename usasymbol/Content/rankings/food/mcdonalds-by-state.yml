seo:
  title: "McDonald's Locations by State 2026 | Map & Rankings"
  description: "Texas has the most McDonald's restaurants at 1,269, just ahead of California's 1,234. North Dakota has the fewest of any state, with 24 locations."

page:
  h1: "McDonald's Locations by State"

  quick_answer:
    - "Texas has the most McDonald's locations of any state, 1,269 restaurants. Sprawling suburbs and long highways give the chain endless drive-thru sites, enough to edge past more populous California."
    - "North Dakota has the fewest McDonald's, just 24. Its people are spread across small prairie towns, and only two main interstates cross the whole state."
    - "Ohio packs in McDonald's more tightly than any other top-10 state, one restaurant for every 18,910 residents. New York, where millions ride the subway instead of driving, has one per 33,890."

  methodology: "Counts for the top 10 states are current as of June 29, 2026. The other 40 states come from a 2021 count by 24/7 Wall St. with 2019 Census populations. The national total, territories included, is 13,865."

  sources:
    - name: "247wallst.com, States With the Most McDonald's Restaurants"
      url: "https://247wallst.com/special-report/2021/11/25/states-with-the-most-mcdonalds-restaurants/"
      description: "State-by-state McDonald's outlet estimates and 2019 Census population figures, published 2021"
    - name: "McDonald's USA Location Count"
      description: "National and top-10 state McDonald's location totals, city distribution, and average customer rating, current as of June 29, 2026"

