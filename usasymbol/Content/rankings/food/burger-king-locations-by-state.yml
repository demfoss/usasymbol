sections:
  - id: "why-texas-leads-the-burger-king-count"
    icon: "fa-solid fa-burger"
    title: "Why Texas Leads the Burger King Count"
    paragraphs:
      - "Texas leads with 566 Burger King restaurants, 83 more than Florida and 95 more than California. All three leaders are large-population states with room for broad statewide restaurant networks."
      - "The ranking counts physical locations and does not measure sales, customer traffic, or locations per resident. Those metrics could produce a different order."

  - id: "how-to-read-the-lowest-burger-king-counts"
    icon: "fa-solid fa-arrow-down-wide-short"
    title: "How to Read the Lowest Burger King Counts"
    paragraphs:
      - "Alaska and Vermont tie for the lowest total with 7 Burger King locations each. Wyoming has 12, followed by Montana with 16 and North Dakota with 17."
      - "Tied counts are shown as separate rows because the table includes all 50 states. States with the same count share a rank, so neither Alaska nor Vermont is placed above the other."

