sections:
  - id: "why-florida-has-the-most-hooters-locations"
    title: "Why Florida Has the Most Hooters Locations"
    paragraphs:
      - "Florida has 30 Hooters locations, more than any other state. The chain opened its first restaurant in Clearwater in 1983, so the home state still holds the biggest cluster."
      - "Hooters of America filed for Chapter 11 protection in March 2025 and closed dozens of restaurants that year. Compare the totals with [Wingstop locations by state](/rankings/food/wingstop-locations-by-state), where Texas and California each have several hundred."
