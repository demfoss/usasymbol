  - id: why-california-leads-whole-foods
    title: Why California Leads Whole Foods Stores
    paragraphs:
      - California's 95 identified stores connect to a market built through new stores and acquisitions. Whole Foods entered Palo Alto in 1989 and acquired Los Angeles-based Mrs. Gooch's in 1993, bringing established natural-food stores into its California network.
      - Wyoming and Montana each have one identified store in states with widely separated towns and few large metropolitan markets. A specialty grocery store needs a shopping catchment that can sustain its natural-food selection, and those western states offer fewer large urban catchments than California. [Walmart's state footprint](/rankings/economy/walmart-locations-by-state) provides a comparison with a broader grocery and general-merchandise chain.
