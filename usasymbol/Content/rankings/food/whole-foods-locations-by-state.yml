sections:
  - id: states-with-most-whole-foods
    title: States With the Most Whole Foods Stores
    paragraphs:
      - Massachusetts has 33 identified stores, close to New York's 35 despite a much smaller geographic footprint. Whole Foods acquired Bread & Circus and Nature's Heartland in the Boston region, making the map partly an inheritance of earlier local grocery businesses. [Trader Joe's locations](/rankings/food/trader-joes-locations-by-state) offer a different specialty-grocery comparison.
