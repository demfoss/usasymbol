faq:
  - question: How many Whole Foods stores are in California?
    answer: California has 95 identified stores after adding the confirmed September 2026 Elk Grove and San Diego openings to the indexed store pages. The total is reconciled with the company's announced California store number.
  - question: How many Whole Foods locations are in Texas?
    answer: Texas has 36 identified stores. Austin was the chain's original market, although California has the largest identified state network.
  - question: How many Whole Foods stores are in Florida?
    answer: Florida has 38 identified stores. Its company history includes the acquisition of the local Bread of Life business, another example of regional grocers contributing to the chain's footprint.
  - question: Which states have no identified Whole Foods stores?
    answer: Alaska, Delaware, North Dakota, South Dakota, Vermont, and West Virginia have no identified entry in this inventory. The group includes the neighboring Dakotas, leaving a gap across that part of the Northern Plains.
  - question: Does this count every Whole Foods store?
    answer: California's 95 identified stores include the September 2026 Elk Grove and San Diego openings, checked against the announced statewide total. Other states use live indexed store pages, which may omit unindexed stores.
