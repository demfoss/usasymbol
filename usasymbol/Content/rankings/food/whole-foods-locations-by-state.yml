  description: California has 95 identified Whole Foods stores, Florida has 38, and Texas has 36. Six listed states have one store each.
page:
  h1: Whole Foods Locations by State
  quick_answer:
    - Whole Foods locations by state are led by California with 95 identified stores. Acquisitions of existing natural-food grocers helped establish its California network beyond the chain's Texas origins.
    - Idaho, Iowa, Maine, Mississippi, Montana, and Wyoming each have one identified store. Montana and Wyoming have widely separated towns and few large metropolitan markets for a specialty grocer.
    - Massachusetts has 33 identified stores. Its network connects to the acquisition of Bread & Circus, illustrating how a relatively small state can retain a substantial specialty-grocery presence.
  methodology: Whole Foods' live US sitemap store pages plus two confirmed September 2026 California openings, retrieved October 3, 2026. DC, foreign and failed pages, and six unlisted states are excluded, with unindexed stores possibly missing.
  sources:
    - name: Whole Foods Official Store Sitemap
      url: https://www.wholefoodsmarket.com/sitemap/sitemap-stores.xml
      description: Addresses extracted from live indexed US store pages. This reproducible directory inventory may omit other unindexed stores. Six states have no identified entry.
    - name: Whole Foods Elk Grove Opening
      url: https://www.wholefoodsmarket.com/company-info/newsroom/news-releases/new-whole-foods-market-in-elk-grove-california-to-open-september-16
      description: Official announcement identifies the September 16, 2026 opening as California's 94th store. Added to the sitemap inventory.
    - name: Whole Foods San Diego Opening
      url: https://www.wholefoodsmarket.com/company-info/newsroom/news-releases/new-whole-foods-market-in-san-diego-california-to-open-september-23
      description: Official announcement identifies the September 23, 2026 opening as California's 95th store. Added to the sitemap inventory.
    - name: Whole Foods Company History
      url: https://www.wholefoodsmarket.com/company-info/whole-foods-market-history
      description: Austin origins and acquisitions of Mrs. Gooch's, Bread & Circus, and other regional natural-food grocers.
