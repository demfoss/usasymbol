sections:
  - id: "why-georgia-has-the-most-zaxbys-locations"
    title: "Why Georgia Has the Most Zaxby's Locations"
    paragraphs:
      - "Georgia has 264 Zaxby's locations, more than twice Florida's 126. The chain opened in 1990 in Statesboro, across the street from Georgia Southern University, and its headquarters are in Athens."
      - "Georgia, South Carolina, North Carolina, Tennessee, and Alabama hold 700 of the 1,023 locations. Zaxby's grew outward from its home state along the same Interstate corridors that carry [Chick-fil-A](/rankings/food/chick-fil-a-locations-by-state) and [Waffle House](/rankings/food/waffle-house-locations-by-state) across the Southeast."
  - id: "zaxbys-locations-per-million-residents"
    title: "Zaxby's Locations per Million Residents"
    table:
      columns:
        rank: "Rank"
        state: "State"
        per_million: "Locations per Million"
      rows:
