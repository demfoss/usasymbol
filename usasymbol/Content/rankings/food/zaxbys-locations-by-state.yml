    answer: "Georgia has the most Zaxby's locations with 264. The chain started in Statesboro in 1990 and is still headquartered in Georgia."
  - question: "How many Zaxby's locations are in Florida?"
    answer: "Florida has 126 Zaxby's locations and ranks second. That works out to only 5.3 per million residents."
  - question: "How many states have Zaxby's?"
    answer: "Zaxby's has listed locations in 25 states. Pennsylvania, Arizona, New Jersey, Illinois, and Montana have 1 each."
  - question: "Which state has the most Zaxby's per capita?"
    answer: "Georgia has the most Zaxby's per resident at 23.2 locations per million people. South Carolina follows at 19.7 and Alabama at 18.0."
  - question: "How many Zaxby's locations are in Texas?"
    answer: "Texas has 19 Zaxby's locations and ranks 12th. Only Indiana, with 20, has more among states outside the Southeast."
  - question: "How many Zaxby's locations are in North Carolina?"
