        - { rank: 7, state: "Kentucky", state_slug: "kentucky", per_million: "8.0" }
        - { rank: 8, state: "Arkansas", state_slug: "arkansas", per_million: "6.4" }
        - { rank: 9, state: "Florida", state_slug: "florida", per_million: "5.3" }
        - { rank: 10, state: "Indiana", state_slug: "indiana", per_million: "2.9" }
    paragraphs:
      - "South Carolina has 111 Zaxby's locations, fourth in the count, but ranks second per resident at 19.7 per million. Alabama's 94 locations give it 18.0, ahead of the much larger North Carolina at 11.0."
      - "Florida shows the opposite pattern. Its 126 restaurants are spread across one of the biggest populations in the country, so the state drops to 5.3 per million, behind Arkansas at 6.4."
  - id: "zaxbys-locations-outside-the-southeast"
    title: "Zaxby's Locations Outside the Southeast"
    paragraphs:
      - "Indiana has 20 Zaxby's locations and Texas has 19, the largest totals outside the Southeast. Texas works out to 0.6 per million, a thin footprint for a state of its size."
      - "Pennsylvania, Arizona, New Jersey, Illinois, and Montana each have a single restaurant. [Raising Cane's](/rankings/food/raising-canes-locations-by-state), by comparison, has 403 locations in Texas alone."

