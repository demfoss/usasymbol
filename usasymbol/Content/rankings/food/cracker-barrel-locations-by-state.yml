sections:
  - id: "why-florida-has-the-most-cracker-barrel-locations"
    title: "Why Florida Has the Most Cracker Barrel Locations"
    paragraphs:
      - "Florida has 60 Cracker Barrel restaurants, five more than Texas, which has 55 and more than eight million additional residents. The chain builds beside interstate exits, and Florida's long highways, including I-75, I-95, and I-4, carry a steady flow of vacationers and drivers heading south."
      - "Tennessee ranks third with 50 locations. Dan Evins opened the first Cracker Barrel in Lebanon, Tennessee, in 1969, and the chain still clusters in the home state and its neighbors. Georgia has 45 and North Carolina 40, a Southern belt that overlaps with [Waffle House locations by state](/rankings/food/waffle-house-locations-by-state)."
  - id: "cracker-barrel-locations-per-capita"
    title: "Cracker Barrel Locations per Million Residents"
    table:
      columns: { rank: "Rank", state: "State", count: "Per Million Residents", locations: "Locations" }
      rows:
        - { rank: 1, state: "Kentucky", state_slug: "kentucky", count: "7.99", locations: "37" }
        - { rank: 2, state: "Tennessee", state_slug: "tennessee", count: "6.78", locations: "50" }
