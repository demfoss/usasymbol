        - { rank: 4, state: "West Virginia", state_slug: "west-virginia", count: "5.10", locations: "9" }
        - { rank: 5, state: "Mississippi", state_slug: "mississippi", count: "4.39", locations: "13" }
        - { rank: 6, state: "South Carolina", state_slug: "south-carolina", count: "4.25", locations: "24" }
        - { rank: 7, state: "Indiana", state_slug: "indiana", count: "3.99", locations: "28" }
        - { rank: 8, state: "Georgia", state_slug: "georgia", count: "3.95", locations: "45" }
        - { rank: 9, state: "Arkansas", state_slug: "arkansas", count: "3.83", locations: "12" }
        - { rank: 10, state: "Virginia", state_slug: "virginia", count: "3.58", locations: "32" }
    paragraphs:
      - "Kentucky has 7.99 Cracker Barrel locations per million residents, the highest rate of any state. Its 37 restaurants sit along the I-65, I-75, and I-64 corridors, which funnel travelers between the Midwest and the South, and the state has under 5 million residents."
      - "Tennessee follows at 6.78 and Alabama at 5.94. Texas has the second-most restaurants but only 1.71 per million, because its 32 million residents are spread across far more territory. Rates use [population by state](/rankings/demographics/states-by-population)."
  - id: "states-with-no-cracker-barrel-locations"
    title: "States Without Cracker Barrel Locations"
    paragraphs:
      - "Alaska, Hawaii, Maine, Oregon, Vermont, Washington, and Wyoming have no Cracker Barrel restaurants, which leaves the chain in 43 states. Out west it has just 5 in California, 4 in Utah, and 3 each in Nevada and Idaho."
      - "Minnesota has 1 location, the same as Delaware, Rhode Island, New Hampshire, North Dakota, and South Dakota. Cracker Barrel is built around Southern comfort food and interstate travelers, and its map thins out in the Northwest and New England."
