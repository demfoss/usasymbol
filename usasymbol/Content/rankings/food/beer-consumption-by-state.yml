  - question: "Which state drinks the least beer?"
    answer: "Utah has the lowest beer consumption per capita at 0.46 gallons of ethanol from beer. Maryland at 0.67 and Rhode Island at 0.68 are the next two lowest states."

  - question: "What is beer consumption in Texas?"
    answer: "Texas records 1.15 gallons of ethanol from beer per capita. That places Texas 13th among the 50 states."

  - question: "What is beer consumption in California?"
