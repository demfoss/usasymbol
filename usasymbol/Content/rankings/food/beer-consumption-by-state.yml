sections:
  - id: "states-that-drink-the-most-beer"
    icon: "fa-solid fa-beer-mug-empty"
    title: "States That Drink the Most Beer"
    paragraphs:
      - "New Hampshire leads all 50 states with 1.60 gallons of ethanol from beer per capita. The top 10: New Hampshire (1.60), Montana (1.53), Vermont (1.50), North Dakota (1.33), Oregon (1.32), Pennsylvania (1.31), Nevada (1.26), Louisiana (1.21), Maine (1.21), Hawaii (1.20)."
      - "Eight of the top 10 are Northern or Mountain West states. Louisiana is the only Deep South state in the top 10; Hawaii is the only island state. North Dakota and Montana both have large rural populations with fewer restaurant and nightlife options, which pushes more consumption toward at-home and bar drinking. Pennsylvania's high rank reflects a historically strong working-class beer culture across its mid-sized cities."
      - "New Hampshire's top rank needs context. The state has no state income tax and runs its liquor stores aggressively to attract buyers from neighboring Massachusetts and Maine, which have higher prices. Because New Hampshire's resident population is small relative to total beer sold there, the per-capita figure rises sharply. The same tourism and cross-border effect applies to Nevada, where Las Vegas alone drives a large volume of out-of-state spending."

  - id: "states-that-drink-the-least-beer"
    icon: "fa-solid fa-arrow-down"
    title: "States That Drink the Least Beer"
    paragraphs:
      - "Utah ranks last with 0.46 gallons of ethanol from beer per capita, by far the lowest of any state. The next lowest, Idaho, is at 0.69, a full 50% higher. Utah's large Latter-day Saint population, which largely abstains from alcohol, is the primary driver."
      - "The bottom 10 in ascending order: Utah (0.46), Maryland (0.67), Rhode Island (0.68), Idaho (0.69), Connecticut (0.70), New Jersey (0.73), Massachusetts (0.75), New York (0.81), Washington (0.81), Virginia (0.84). The Northeast and Mid-Atlantic dominate the bottom, reflecting stronger competition from wine and spirits, higher costs of living, and denser urban populations."

  - id: "most-popular-beer-brands-by-state"
    icon: "fa-solid fa-bottle-droplet"
    title: "Most Popular Beer Brands by State"
    paragraphs:
      - "Budweiser is the top-selling beer in roughly 30 states, making it the dominant brand by a wide margin. Bud Light leads in five states: Connecticut, North Carolina, Pennsylvania, Vermont, and Washington. Together, the two Anheuser-Busch brands cover more than two-thirds of the country."
      - "The clearest exceptions are regional brands with strong local loyalty. Louisiana drinkers prefer Abita, brewed in Covington since 1986. Wisconsin's top beer is Spotted Cow, a cream ale from New Glarus Brewing sold only in Wisconsin; it cannot be purchased across state lines. Texas favors Lone Star, brewed in the state since 1884 and still marketed as 'the National Beer of Texas.'"
      - "Other notable state-specific picks: Narragansett in Rhode Island (revived after near-closure in the 1980s), Terrapin in Georgia, Dogfish Head in Delaware, Goose Island in Illinois, La Cumbre in New Mexico, Fargo Brewing in North Dakota, Snake River Brewing in Wyoming, and Denver Beer Co. in Colorado. Nevada and Kansas favor Coors Light. Indiana and New Jersey prefer Miller Lite. Arizona and Florida lean toward imports: Dos Equis and Stella Artois, respectively."

