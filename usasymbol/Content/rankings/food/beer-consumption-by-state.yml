page:
  h1: "Beer Consumption by State"

  quick_answer:
    - "Beer consumption by state is highest in New Hampshire at 1.60 gallons of ethanol from beer per capita. Montana at 1.53 and Vermont at 1.50 rank second and third."
    - "Utah ranks last at 0.46 gallons per capita. Maryland at 0.67 and Rhode Island at 0.68 are the next two lowest states."

  methodology: "Data reflects NIAAA apparent per capita alcohol consumption from beer, expressed as gallons of ethanol per capita and based on sales, tax, and shipment data rather than surveys of actual drinking. NIAAA applies an estimated ABV of 4.5% for beer, and figures for New Hampshire and Nevada may include purchases by out-of-state residents."

