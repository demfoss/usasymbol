sections:
  - id: "states-that-drink-the-most-beer"
    icon: "fa-solid fa-beer-mug-empty"
    title: "States That Drink the Most Beer"
    paragraphs:
      - "New Hampshire leads all 50 states with 1.60 gallons of ethanol from beer per capita. The top 10: New Hampshire (1.60), Montana (1.53), Vermont (1.50), North Dakota (1.33), Oregon (1.32), Pennsylvania (1.31), Nevada (1.26), Louisiana (1.21), Maine (1.21), Hawaii (1.20)."
      - "Nevada ranks seventh at 1.26 gallons per capita. Louisiana and Maine tie at 1.21, and Hawaii rounds out the top 10 at 1.20."

  - id: "states-that-drink-the-least-beer"
    icon: "fa-solid fa-arrow-down"
    title: "States That Drink the Least Beer"
    paragraphs:
      - "Utah ranks last at 0.46 gallons of ethanol from beer per capita. Maryland at 0.67, Rhode Island at 0.68, and Idaho at 0.69 are the next three lowest states."
      - "Connecticut is at 0.70, New Jersey at 0.73, and Massachusetts at 0.75. New York and Washington tie at 0.81, while Virginia closes the bottom 10 at 0.84."

