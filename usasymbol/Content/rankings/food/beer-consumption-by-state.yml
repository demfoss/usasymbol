seo:
  title: "Beer Consumption by State | New Hampshire 1.60 gal"
  description: "New Hampshire leads all states at 1.60 gallons of ethanol from beer per capita. Montana (1.53), Vermont (1.50). Utah ranks last at 0.46. NIAAA 2023 data."

page:
  h1: "Beer Consumption by State Per Capita 2026"

  quick_answer:
    - "New Hampshire leads all 50 states at 1.60 gallons of ethanol from beer per capita. Montana (1.53) and Vermont (1.50) rank second and third. Utah ranks last at 0.46, less than one-third of New Hampshire's figure."
    - "This ranking measures gallons of ethanol contained in beer sales, not total gallons of beer. That is why large-population states like California, Texas, and Florida rank in the middle of the pack per person, while small Northern states dominate the top. New Hampshire, Nevada, and the District of Columbia may show elevated figures due to cross-border shopping and tourism."

  methodology: "Data reflects NIAAA apparent per capita alcohol consumption from beer, expressed as gallons of ethanol per capita. Apparent consumption is based on sales, tax, and shipment data, not surveys of actual drinking. NIAAA applies an estimated ABV of 4.5% for beer. Figures for New Hampshire, Nevada, and Washington D.C. may include purchases by out-of-state residents. Most popular beer figures are sourced from YouGov America state-level brand preference surveys and reflect the top-reported beer brand among adults in each state; figures for Hawaii and Alaska are not available in YouGov state-level data."

