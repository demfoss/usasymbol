faq:
  - question: "Which state drinks the most beer per capita?"
    answer: "New Hampshire has the highest beer consumption per capita at 1.60 gallons of ethanol from beer per year, according to NIAAA 2023 data. Montana (1.53) and Vermont (1.50) rank second and third. New Hampshire's figure is partly inflated by cross-border sales to Massachusetts and Maine residents."

  - question: "Which state drinks the least beer?"
    answer: "Utah has the lowest beer consumption per capita at 0.46 gallons of ethanol per year, the only state well below 0.70. Utah's large Latter-day Saint population, which largely abstains from alcohol, is the main reason. Idaho (0.69) ranks second lowest."

  - question: "What does gallons of ethanol from beer per capita mean?"
    answer: "It measures the pure alcohol content of beer sold in a state, divided by the state's total population. Beer is about 4.5% alcohol by volume, so 1.0 gallon of ethanol equals roughly 18 to 19 gallons of actual beer. NIAAA uses this metric because it lets fair comparisons across beer, wine, and spirits, which all have different alcohol content."

  - question: "Why does New Hampshire have the highest beer consumption?"
    answer: "New Hampshire operates state-run liquor stores with competitive prices designed to attract buyers from neighboring Massachusetts and Maine. Its resident population is small relative to total beer sold, so the per-capita figure is high. NIAAA notes that states with significant cross-border sales show apparent consumption that exceeds actual resident drinking."

  - question: "Is beer consumption by state the same as total gallons of beer sold?"
    answer: "No. This ranking uses gallons of ethanol from beer per capita, not total volume. By total volume, the largest states (California, Texas, and Florida) sell far more beer. But per capita, they rank in the middle because their large populations divide into that volume. Total-volume rankings and per-capita rankings tell very different stories."

