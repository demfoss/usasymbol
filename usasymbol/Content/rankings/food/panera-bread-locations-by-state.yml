sections:
  - id: why-florida-leads-panera
    title: Why Florida Leads Panera Locations
    paragraphs:
      - Florida's 195 cafes combine 101 franchised and 94 company-operated locations. Its lead comes from substantial networks on both sides of that ownership split, with franchisees operating slightly more cafes than the company. Panera grants franchisees development territories for multiple cafes, a model suited to separate urban markets such as those around Miami, Orlando, and Tampa.
      - Wyoming's single cafe is franchised, in a state with widely separated population centers and fewer large urban markets to fill a development territory. Florida's multiple metro areas offer more places for the same multi-cafe model to operate. [McDonald's state footprint](/rankings/food/mcdonalds-by-state) offers a comparison with another franchise-based restaurant network.
