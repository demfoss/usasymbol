    title: Panera Franchise Locations by State
    paragraphs:
      - Ohio's 133 cafes include 124 franchises, while Virginia's 94 include 78 company-operated cafes. Identical branding can conceal very different ownership structures, so the franchise-only table below answers a different question from the combined state ranking.
      - Missouri has 69 cafes and connects the chain to its Saint Louis Bread Company origins. A founding market need not remain the largest network, as [Five Guys locations](/rankings/food/five-guys-locations-by-state) also illustrate.
