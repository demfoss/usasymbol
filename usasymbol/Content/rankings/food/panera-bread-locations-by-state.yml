faq:
  - question: How many Panera Bread locations are in California?
    answer: California has 193 bakery-cafes at fiscal year-end 2025, split between 96 franchised and 97 company-operated cafes. That nearly even ownership balance differs from Ohio's franchise-heavy network.
  - question: How many Panera Bread locations are in Texas?
    answer: Texas has 120 cafes, including 88 company-operated and 32 franchised locations. Company operation is the dominant model there, unlike Ohio, where franchisees run most cafes.
  - question: Which state has the most Panera franchises?
    answer: Ohio has 124 franchised cafes, the highest franchise-only count. Florida leads the combined ranking because company-operated cafes also contribute to its total.
  - question: Which states are missing from the Panera ranking?
    answer: Alaska and Hawaii have no listed cafes in the state ownership table. Their separation from the contiguous states gives each a different geographic setting from Panera's mainland development territories.
  - question: Are these current Panera location counts?
    answer: Florida's 195 cafes and the other totals describe fiscal year-end 2025. The ownership split records a network built through both company investment and franchise territories, with the same reporting period used across states.
