  description: Florida has 195 Panera Bread bakery-cafes and California has 193 in fiscal 2025. Wyoming has one, the fewest among listed states.
page:
  h1: Panera Bread Locations by State
  quick_answer:
    - Panera Bread locations by state are led by Florida with 195 bakery-cafes at fiscal year-end 2025. Company-operated and franchised cafes both contribute to its lead.
    - Wyoming has one bakery-cafe, operated by a franchisee. A lone location offers a foothold in a state with widely separated population centers.
    - Ohio has 133 cafes, including 124 franchised locations. Its ownership pattern differs sharply from Virginia's predominantly company-operated network.
  methodology: Franchise Watch Desk's transcription of 2026 FDD Item 20 combines company and franchised cafes at fiscal year-end 2025. DC, Canada, and unlisted Alaska and Hawaii are excluded, with equal counts sharing ranks.
  sources:
    - name: Franchise Watch Desk Panera Item 20
      url: https://franchisewatchdesk.com/franchise/panera-bread-bakery-caf/item-20
      description: Secondary transcription of the 2026 disclosure's fiscal 2025 state ownership table. The original filing PDF was not directly accessible, so the transcription is the count source.
    - name: Panera Bread Company History
      url: https://www.panerabread.com/en-us/company/our-history.html
      description: Saint Louis Bread Company origins and the later Panera name.
    - name: Panera Bread Franchise Information
      url: https://www.panerabread.com/en-us/company/franchise-information.html
      description: Area development agreements and the multi-cafe franchise model.
