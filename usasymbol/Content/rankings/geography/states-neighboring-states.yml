faq:
  - question: "Which state borders the most states?"
    answer: "Missouri and Tennessee tie with eight neighbors each. Kentucky and Colorado come next with seven, and Colorado gets there with a rectangle of straight lines that reaches Oklahoma through its narrow Panhandle."

  - question: "How many states border Tennessee?"
    answer: "Eight. They are Kentucky, Virginia, North Carolina, Georgia, Alabama, Mississippi, Arkansas, and Missouri."

  - question: "How many states border Kentucky?"
    answer: "Seven, namely Illinois, Indiana, Missouri, Ohio, Tennessee, Virginia, and West Virginia. The winding Ohio River forms Kentucky's entire northern edge and runs past four of those states, from West Virginia down to Illinois."

  - question: "How many states border Texas?"
    answer: "Four. New Mexico lies to the west, Oklahoma to the north, Arkansas to the northeast, and Louisiana to the east. Among [states by land area](/rankings/geography/states-by-land-area) only Alaska is bigger, yet Texas has half as many neighbors as Missouri."

  - question: "What state only borders one other state?"
    answer: "Maine, which touches only New Hampshire along its western edge. Every other state in the lower 48 has at least two neighbors."

  - question: "Which states do not border any other state?"
    answer: "Alaska and Hawaii. They are the only states outside the lower 48, so the other 48 states all share a line with at least one neighbor."

