        - state: "Washington"
          borders: "2"
          neighbors: "Idaho, Oregon"

  - id: "four-corners"
    icon: "fa-solid fa-border-all"
    title: "Four Corners Where Four States Meet"
    paragraphs:
      - "Arizona, Colorado, New Mexico, and Utah meet at the Four Corners, the only spot in the country where four states touch. Colorado lists Arizona as a neighbor, and Utah lists New Mexico, even though each pair shares nothing but that single point."
      - "Colorado borders seven states partly because of that corner. Congress carved these western territories out with straight survey lines, and the 37th parallel crosses a north-south meridian right at that spot. Today the monument there is run by the Navajo Nation, at the heart of the [Four Corners states](/rankings/geography/four-corners-states)."

