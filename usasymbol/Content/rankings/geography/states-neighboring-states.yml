page:
  h1: "How Many States Border Each State"

  quick_answer:
    - "Missouri and Tennessee border the most states, eight each. Both sit on the Mississippi River in the middle of the country, so they collect neighbors across the water as well as on dry land."
    - "Alaska and Hawaii border no other state, since one is cut off by Canada and the other by the Pacific. Maine has the fewest neighbors in the lower 48, with New Hampshire alone."
    - "Texas, the biggest state in the lower 48, borders only four states. The Gulf of Mexico and the Rio Grande border with Mexico take up much of its edge."

  methodology: "Neighbors include states that share a land, river, lake, or single-point boundary, based on U.S. Census Bureau and USGS boundary data. Borders with Canada and Mexico are not counted."

