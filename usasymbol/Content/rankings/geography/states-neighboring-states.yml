sections:
  - id: "most-neighbors"
    icon: "fa-solid fa-handshake"
    title: "Why Missouri Has the Most Bordering States"
    paragraphs:
      - "Missouri and Tennessee each border eight states, more than any other state. Across the [Mississippi River](/rankings/geography/mississippi-river-states), Missouri faces Illinois, Kentucky, and Tennessee, then picks up five more neighbors to the north, west, and south. Its Bootheel, a strip of land that dips south along the river, is what puts it across the water from Tennessee."
      - "Tennessee reaches eight through its shape. Long and narrow, it stretches from the Appalachian Mountains to the Mississippi, so its thin northern edge meets Kentucky and Virginia while its southern line runs past Georgia, Alabama, and Mississippi. North Carolina caps the east end, and Arkansas and Missouri sit across the river on the west."

  - id: "fewest-neighbors"
    icon: "fa-solid fa-location-dot"
    title: "States With the Fewest Bordering States"
    paragraphs:
      - "Alaska and Hawaii are the only states with no neighboring state, and both joined the Union in 1959. Canada's British Columbia and Yukon separate Alaska from Washington. Maine has the fewest neighbors in the lower 48, and Quebec and New Brunswick wrap around its north and east, making it one of the [states that border Canada](/rankings/geography/states-bordering-canada) with more foreign neighbors than American ones."
      - "Florida, Rhode Island, South Carolina, and Washington each border two states. A long peninsula leaves Florida room for only Alabama and Georgia along its northern edge. Washington is boxed into the far northwest by Canada and the Pacific, with Oregon and Idaho as its only neighbors."
    table:
      columns:
        state: "State"
        borders: "Bordering States"
        neighbors: "Neighbors"
      rows:
        - state: "Alaska"
          borders: "0"
          neighbors: "Canada only"
