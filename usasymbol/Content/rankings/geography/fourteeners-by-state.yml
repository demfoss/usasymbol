page:
  h1: "Fourteeners by State"
  quick_answer:
    - "Colorado has the most fourteeners at 53, thanks to the Sawatch, Mosquito and Sangre de Cristo ranges, which pack dozens of summits above 14,000 feet into one stretch of the Rockies."
    - "Alaska has 29 and holds the tallest of all, Denali at 20,310 feet. California has 12, topped by Mount Whitney, the highest summit in the lower 48. Washington has 2, both on Mount Rainier."
  methodology: "Peaks of 14,000 feet or higher with at least 300 feet of topographic prominence, from the Wikipedia list of 96 U.S. fourteeners. Border peaks are counted in Alaska. Only states with at least one are listed. Lists with looser rules, such as the 58 Colorado peaks on many hiking lists, give higher counts."
