faq:
  - question: "Which state has the most fourteeners?"
    answer: "Colorado, with 53. Its Sawatch Range alone is packed with giants such as Mount Elbert, Mount Massive and Mount Harvard."
  - question: "How many fourteeners are in Colorado?"
    answer: "Colorado has 53 by the 300-foot prominence rule. Many hiking lists count 58 by also including peaks such as El Diente Peak and North Maroon Peak, which are connected to a taller neighbor."
  - question: "How many fourteeners are in Alaska?"
    answer: "Alaska has 29. They include Denali at 20,310 feet, the highest summit in North America."
  - question: "How many fourteeners are in California?"
    answer: "California has 12, including Mount Whitney, Mount Williamson, White Mountain Peak and Mount Shasta. Most stand along the Sierra Nevada crest."
  - question: "Which states have no fourteeners?"
    answer: "Forty-six states have none. All 96 in the country are west of the Mississippi River, and only Colorado, Alaska, California and Washington have any."
  - question: "What is the highest fourteener in the lower 48 states?"
    answer: "Mount Whitney in California, at 14,505 feet. Colorado's tallest is Mount Elbert at 14,440 feet."
