sections:
  - id: why-colorado-has-the-most-fourteeners
    icon: "fa-solid fa-mountain"
    title: "Why Colorado Has the Most Fourteeners"
    paragraphs:
      - "Colorado leads with 53 because the Rocky Mountains peak here. Mount Elbert, at 14,440 feet in the Sawatch Range, is the highest summit of the Rockies and of Colorado, and neighbors such as Mount Massive and Mount Harvard crowd just below it."
      - "Few other places hold so many summits within a few thousand feet of the same height. Even the valleys at the foot of these peaks sit high, which is why Colorado also tops the [average elevation by state](/rankings/geography/average-elevation-by-state) list."
  - id: fourteeners-in-alaska-california-and-washington
    icon: "fa-solid fa-person-hiking"
    title: "Fourteeners in Alaska, California and Washington"
    paragraphs:
      - "Alaska has 29, and they dwarf the rest. Denali at 20,310 feet is the tallest mountain in North America, and the Alaska and St. Elias ranges hold peaks that rise far above the 14,000-foot mark. California has 12, led by Mount Whitney at 14,505 feet, the highest summit in the lower 48. Every state's top summit is listed in the [highest point by state](/rankings/geography/highest-point-by-state) ranking."
      - "Washington's two, Mount Rainier and Liberty Cap, share one mountain. Rainier is a volcano, and so are California's Mount Shasta and Alaska's Mount Wrangell, as the [states with volcanoes](/rankings/geography/states-with-volcanoes) page explains."
