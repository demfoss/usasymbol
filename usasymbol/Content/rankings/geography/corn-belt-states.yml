faq:
  - question: "What states are in the Corn Belt?"
    answer: "The Corn Belt has 6 core states — Iowa, Illinois, Indiana, Kansas, Missouri, and Nebraska — and 7 extended states: Kentucky, Michigan, Minnesota, North Dakota, Ohio, South Dakota, and Wisconsin. The 6 core states appear in every published definition of the region. The 7 extended states produce significant corn but are included in some definitions and excluded from others."

  - question: "What is the #1 corn-producing state?"
    answer: "Iowa is the #1 corn-producing state, producing approximately 2.4 billion bushels per year — about 19 percent of total U.S. corn output. Iowa has ranked first in corn production every year for decades. Its flat, glaciated terrain and deep Mollisol soils are among the most productive corn-growing conditions on earth."

  - question: "Is Minnesota in the Corn Belt?"
    answer: "Minnesota is in the extended Corn Belt. Southern Minnesota is firmly Corn Belt country, ranking 4th nationally in corn production at approximately 1.4 billion bushels per year. Northern Minnesota is too cold for reliable corn production. Minnesota is not in the core Corn Belt because soybeans are a competing crop across much of the state."

  - question: "Is Kansas in the Corn Belt?"
    answer: "Kansas is a core Corn Belt state, though it is also the leading winter wheat state. Eastern Kansas produces substantial corn; western Kansas relies more on wheat and sorghum. Kansas ranks 7th in U.S. corn production at approximately 560 million bushels per year. The distinction from other core Corn Belt states is that wheat and corn compete for acreage depending on price and rainfall."

  - question: "How much of U.S. corn comes from the Corn Belt?"
    answer: "The 13 Corn Belt states produce the vast majority of U.S. corn. Iowa and Illinois alone account for approximately 36 percent of total U.S. output. The top 3 states — Iowa, Illinois, and Nebraska — together produce roughly half of all U.S. corn. The 6 core Corn Belt states produce more than 60 percent of U.S. corn."

  - question: "What is the difference between the Corn Belt and the Wheat Belt?"
    answer: "The Corn Belt covers Iowa, Illinois, Indiana, Nebraska, Kansas, Missouri, and nearby states, where corn is the dominant crop. The Wheat Belt covers the Great Plains — Kansas (winter wheat), North Dakota, South Dakota, Montana (spring wheat) — where wheat is dominant. Kansas sits at the overlap: it is both a core Corn Belt state and the leading winter wheat state. The two belts meet along a north-south line through central Kansas and Nebraska."

