sections:
  - id: why-new-york-has-the-most-national-historic-landmarks
    icon: "fa-solid fa-landmark"
    title: "Why New York Has the Most Landmarks"
    paragraphs:
      - "New York has 277 landmarks, and 116 of them stand inside New York City. The list there runs from the Statue of Liberty and Grand Central Terminal to the Empire State Building. Upstate adds Erie Canal works and Hudson Valley homes such as Franklin Roosevelt's estate at Hyde Park."
      - "The state was a major seaport from the 1600s and a manufacturing and banking center after that, so almost every era of American life left buildings worth designating. Few states have so many centuries of continuous settlement in one place."
