page:
  h1: "National Historic Landmarks by State"
  quick_answer:
    - "New York has the most National Historic Landmarks at 277, with 116 of them in New York City alone. Its harbor, canals, and Hudson Valley estates left more designated sites than any other state."
    - "North Dakota has the fewest at 7, and Nevada follows with 8. Both were thinly settled until well into the 1800s, so few buildings from the nation's early decades survive there."
    - "Massachusetts ranks second with 192 and Pennsylvania third with 169. Boston holds 57 landmarks and Philadelphia 67, so a single city lifts each state far up the list."
  methodology: "Number of designated National Historic Landmarks in each state through December 2024. A landmark that spans two states, such as Hoover Dam, counts in both. The District of Columbia (78) and the territories are not ranked."
  sources:
