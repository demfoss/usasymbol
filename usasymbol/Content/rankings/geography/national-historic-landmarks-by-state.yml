faq:
  - question: "Which state has the most National Historic Landmarks?"
    answer: "New York has the most, with 277. New York City accounts for 116 of them, and the rest are spread across the Hudson Valley, the Erie Canal corridor, and upstate cities."
  - question: "Which state has the fewest National Historic Landmarks?"
    answer: "North Dakota has the fewest with 7. Nevada follows with 8 and Idaho with 11."
  - question: "How many National Historic Landmarks are in Massachusetts?"
    answer: "Massachusetts has 192, the second most of any state. Boston alone has 57, and Concord, Salem, and Plymouth add many more from the colonial and Revolutionary era."
  - question: "How many National Historic Landmarks are in Virginia?"
    answer: "Virginia has 126, the fifth most. Monticello, Mount Vernon, and Colonial Williamsburg are among them."
  - question: "What is a National Historic Landmark?"
    answer: "A National Historic Landmark is a site, building, district, ship, or object that the Secretary of the Interior has recognized as nationally significant. Congress opened the program with the Historic Sites Act of 1935, and the first landmarks were designated in 1960."
