  - id: states-with-the-most-historic-landmarks-in-the-east
    icon: "fa-solid fa-monument"
    title: "States With the Most Historic Landmarks"
    paragraphs:
      - "Massachusetts has 192 landmarks and Pennsylvania 169, and a single city carries much of each total. Boston alone holds 57, while Philadelphia holds 67, including Independence Hall. Virginia ranks fifth at 126 with Monticello and Mount Vernon, and Maryland, Ohio, and South Carolina tie for seventh at 76."
      - "Most of the top ten were settled before 1800. Charleston's historic district and Fort Sumter give South Carolina its count, while Annapolis does the same for Maryland. Texas and Alaska tie at 50, and Alaska's list includes the WWII battlefields on Attu and Kiska in the Aleutian Islands. Hoover Dam counts in both Arizona and Nevada. For the oldest places behind many of these totals, see the [oldest city in each state](/rankings/geography/oldest-city-by-state) and the [original 13 colonies](/rankings/government/original-13-colonies)."
  - id: states-with-the-fewest-national-historic-landmarks
    icon: "fa-solid fa-compass"
    title: "States With the Fewest Landmarks"
    paragraphs:
      - "North Dakota has 7 and Nevada 8, followed by Idaho at 11. Settlement came late and stayed sparse in all three, so there are few old towns, mansions, or downtown districts to designate. Nevada's list does include Virginia City, the silver boomtown, and Hoover Dam."
