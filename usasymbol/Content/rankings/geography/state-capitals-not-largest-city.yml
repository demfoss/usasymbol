faq:
  - question: "What is the smallest state capital in the United States?"
    answer: "Montpelier, Vermont, with 7,855 residents in the 2020 Census, is the smallest state capital by population. Burlington, Vermont's largest city, is more than five times larger. Montpelier has been Vermont's capital since 1805 and has never had more than about 10,000 residents."

  - question: "Why is Albany the capital of New York and not New York City?"
    answer: "Albany has been the seat of New York's government since the Dutch colonial era, when it was Fort Orange -- a fur-trading depot at the head of Hudson River navigation founded in 1614. When the British took control in 1664, Albany kept the courts and official records. By the time New York City grew into a global commercial metropolis, Albany had 150 years of government infrastructure in place, and legislators also deliberately kept the capital separate from New York City's commercial and financial power."

  - question: "Why is Springfield the capital of Illinois and not Chicago?"
    answer: "Springfield became Illinois's capital in 1837, when Chicago had fewer than 4,000 people. It was chosen as a geographic compromise among several competing central Illinois towns, with Abraham Lincoln among the legislators who lobbied for it. By the time Chicago became the railroad and industrial hub of the Midwest in the 1850s and 1860s, Springfield had a fully built statehouse and government infrastructure that would have cost a fortune to relocate."

  - question: "Why is Tallahassee the capital of Florida instead of Miami or Jacksonville?"
    answer: "In 1824, when the Florida territorial government needed a capital, Miami did not exist as a settlement and Jacksonville was barely established. Tallahassee was selected because it sat roughly halfway between the two oldest Florida towns: St. Augustine on the Atlantic coast and Pensacola on the Gulf coast. The midpoint logic was purely practical -- placing the capital between the two existing centers of population meant no single region could dominate the territorial government."

  - question: "Which state capital is only reachable by air or sea?"
    answer: "Juneau, Alaska. It sits on a narrow coastal strip between the Gastineau Channel and the Coast Mountains, with no highway connection to the Alaskan road network. Residents and legislators travel in and out by plane or the Alaska Marine Highway System ferry. Proposals to move the capital to a location accessible by road -- near Anchorage or the Matanuska-Susitna Valley -- have been raised since the 1970s but have never passed due to cost estimates in the billions of dollars."

  - question: "What are the 17 states where the capital is also the largest city?"
    answer: "Arizona (Phoenix), Arkansas (Little Rock), Colorado (Denver), Georgia (Atlanta), Hawaii (Honolulu), Idaho (Boise), Indiana (Indianapolis), Iowa (Des Moines), Massachusetts (Boston), Mississippi (Jackson), Ohio (Columbus), Oklahoma (Oklahoma City), Rhode Island (Providence), South Carolina (Columbia), Utah (Salt Lake City), West Virginia (Charleston), and Wyoming (Cheyenne). These 17 states represent just over one-third of all U.S. states."

  - question: "What is the oldest state capital in the United States?"
    answer: "Santa Fe, New Mexico, founded by Spanish colonists in 1607, is the oldest state capital in the country -- predating the United States by more than 150 years. It also appears in the [oldest city in each state](/rankings/geography/oldest-city-by-state) ranking. Its Palace of the Governors, built in 1610, is the oldest continuously used public building in the United States. Santa Fe also appears on this list: Albuquerque, with 564,559 people, is nearly seven times larger, making New Mexico one of the 33 states whose capital is not its largest city."

