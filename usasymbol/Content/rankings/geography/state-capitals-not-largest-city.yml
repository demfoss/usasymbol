  title: "State Capitals That Aren't the Largest City | All 33 States"
  description: "33 US state capitals are not the largest city in their state. See every capital vs. largest city, from Albany to Olympia, with the historical reasons each capital was chosen."

page:
  h1: "33 State Capitals That Are Not the Largest City in Their State"

  quick_answer:
    - "Of the 50 U.S. states, 33 have a capital that is not also the largest city - including Springfield, Illinois (pop. 114,000), which shares a state with Chicago (pop. 2.7 million). Only 17 capitals, among them Phoenix, Atlanta, and Denver, are also the most populous city in their state."
    - "The gaps range from modest (Saint Paul, Minnesota is smaller than Minneapolis by about 118,000 people) to staggering (Albany, New York is smaller than New York City by more than 8.2 million). Three forces drove most placements: legislators choosing a geographic midpoint, deliberate separation of political from commercial power, and simple timing -- the capital was fixed before the state's future economic engine existed."

  methodology: "Population figures are city-proper totals from the U.S. Census Bureau 2020 decennial census. 'Largest city' means the most populous incorporated city proper, not the metropolitan statistical area. Where a city-county consolidation exists (Louisville-Jefferson County), the consolidated figure is used. Tennessee is included here per widely cited pre-2020 sources in which Memphis exceeded Nashville; by the 2020 Census, Nashville-Davidson (consolidated) has surpassed Memphis, making Tennessee an edge case noted in the table."

  sources:
    - name: "U.S. Census Bureau -- 2020 Decennial Census"
      url: "https://www.census.gov/programs-surveys/decennial-census/decade/2020/2020-census-main.html"
      description: "City-proper population counts used for all capital and largest-city comparisons"
    - name: "National Conference of State Legislatures -- State Capitals"
