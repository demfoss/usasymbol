      description: "Official listing of all 50 state capitals with historical background"
    - name: "CGP Grey -- Which City Is the Actual Capital?"
      url: "https://www.youtube.com/watch?v=gCNeDWCI0vo"
      description: "Data analysis of population gaps and distances between state capitals and their population centers"

