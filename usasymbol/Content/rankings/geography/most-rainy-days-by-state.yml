faq:
  - question: "Which state has the most rainy days per year?"
    answer: "West Virginia has the most rainy days per year, averaging 154 days with measurable precipitation. Vermont ranks second at 153 days, and New Hampshire ranks third at 152 days."

  - question: "Which state has the fewest rainy days per year?"
    answer: "Arizona has the fewest rainy days of any state, at 51 a year. California is close behind at 52, and Nevada follows at 53."

  - question: "Does Washington have more rainy days than Louisiana?"
    answer: "Yes. Washington averages 132 rainy days a year, while Louisiana averages 112. Louisiana still receives more total rainfall, 55.6 inches against Washington's 33.4 inches, because its rain falls harder per event."

  - question: "What state gets the most total rainfall in the U.S.?"
    answer: "Louisiana receives the most total rainfall in the U.S., averaging 55.6 inches a year. Despite that total, Louisiana ranks 31st for number of rainy days, at 112, well behind West Virginia's 154."

  - question: "How many rainy days does Oregon have in a year?"
    answer: "Oregon averages 125 rainy days a year, ranking 18th among the 50 states. Its neighbor Washington ranks higher at 132 days, 11th overall."

  - question: "Why does West Virginia have more rainy days than Louisiana despite less total rain?"
    answer: "West Virginia's 44.2 inches falls across 154 days, averaging under 0.3 inches per rainy day. Louisiana's 55.6 inches falls across only 112 days, averaging closer to 0.5 inches per rainy day, roughly double the intensity."

