page:
  h1: "Most Rainy Days by State"

  quick_answer:
    - "West Virginia has the most rainy days in the U.S., averaging 154 days a year with measurable precipitation. Vermont ranks second at 153 days, and New Hampshire is third at 152 days."
    - "Louisiana receives more total rainfall than any state, 55.6 inches a year, but ranks 31st for rainy days at just 112. Arizona has the fewest rainy days of any state, at 51."
    - "Washington and Oregon, both known for rain, land in the middle of the list. Washington averages 132 rainy days, good for 11th, while Oregon averages 125 days and ranks 18th."

  methodology: "Figures reflect average annual number of days with measurable precipitation (0.01 inch or more) and average annual total precipitation by state, based on NOAA weather station records from 2000 to 2024."

