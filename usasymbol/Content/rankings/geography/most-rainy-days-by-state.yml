sections:
  - id: "why-west-virginia-leads"
    icon: "fa-solid fa-cloud-rain"
    title: "Why West Virginia Has the Most Rainy Days"
    paragraphs:
      - "West Virginia averages 154 rainy days a year, yet its total precipitation of 44.2 inches ranks outside the top ten. Louisiana receives more rain overall, 55.6 inches, but spreads it across just 112 days."
      - "The two states show how differently rain can fall. West Virginia's 44.2 inches over 154 days averages under 0.3 inches per rainy day, a pattern of frequent, lighter precipitation. Louisiana's 55.6 inches over 112 days averages roughly 0.5 inches per rainy day, closer to double the intensity per event."

  - id: "pacific-northwest-mid-pack"
    icon: "fa-solid fa-cloud"
    title: "Do Washington and Oregon Have the Most Rainy Days?"
    paragraphs:
      - "Washington averages 132 rainy days a year, ranking 11th, and Oregon averages 125 days, ranking 18th. Both states sit behind West Virginia's 154, Vermont's 153, and seven other states in the Northeast and Great Lakes region."
      - "Washington's total precipitation of 33.4 inches and Oregon's 28.1 inches also trail well behind West Virginia's 44.2 inches and Louisiana's 55.6 inches. Frequent rain along the Pacific Coast does not translate into the most rainy days nationally."

  - id: "fewest-rainy-days"
    icon: "fa-solid fa-sun"
    title: "States With the Fewest Rainy Days"
    paragraphs:
      - "Arizona has the fewest rainy days of any state, at 51 a year. California follows at 52, then Nevada at 53, New Mexico at 59, and Utah at 66, forming a five-state cluster across the Southwest and Mountain West."
      - "All five also rank near the bottom for total precipitation. Arizona records just 9.9 inches a year, and Nevada records 7.0 inches, the lowest total of any state."

