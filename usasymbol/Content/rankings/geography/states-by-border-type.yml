faq:
  - question: "What U.S. state has the most straight borders"
    answer: "Colorado has the most straight-line borders of any U.S. state at 99%. All four borders are surveyed parallels and meridians: the 37th and 41st parallels (south and north) and the 102nd and 109th meridians (east and west). Wyoming is second at 98%, followed by Kansas (97%) and New Mexico (96%)."

  - question: "What state has the most natural borders"
    answer: "West Virginia has no straight borders at all: 0% of its perimeter is a surveyed line. Every mile follows rivers (Ohio, Big Sandy, Tug Fork, Potomac) or Appalachian ridge crests. Hawaii also has 0% straight borders because it is entirely island coastline with no land boundaries."

  - question: "Why do western states have straight borders"
    answer: "Western states were created from federal territory after the Land Ordinance of 1785, which established the Public Land Survey System, a rectangular grid of meridians and parallels. Borders were drawn on paper before settlement, with no existing rivers or colonial claims to follow. Eastern states predate the survey and used visible natural features instead."

  - question: "Which states have the most river borders"
    answer: "Missouri is 73% river borders: the Mississippi, Missouri, and Des Moines rivers form nearly its entire perimeter. Iowa (62%), Texas (roughly 65% rivers including the Red River, Sabine River, and Rio Grande), and Illinois (about 50% rivers including the Mississippi and Ohio) also rank among the highest."

  - question: "Do any U.S. state borders follow mountain ridges"
    answer: "Yes. West Virginia (40%), Kentucky (30%), and Virginia (25%) have the highest mountain ridge shares. Tennessee, North Carolina, and Idaho all have significant ridgeline segments. Montana and Idaho share the Continental Divide along part of their mutual border. Mountain ridge borders are most common in the Appalachian states, where watershed divides served as colonial-era boundaries before formal surveys."

  - question: "What is the squarest state in the U.S."
    answer: "Colorado and Wyoming are the squarest U.S. states, both near-perfect rectangles with four straight borders and no natural boundary interruptions. Colorado's borders are four surveyed lines (37th and 41st parallels; 102nd and 109th meridians). Wyoming shares the same geometry. Kansas and New Mexico are close behind at 97% and 96% straight."

