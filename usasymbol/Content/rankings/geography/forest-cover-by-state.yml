page:
  h1: "Forest Cover by State"

  quick_answer:
    - "Forest cover by state is highest in Maine, where 89.5% of the land is forest. Farms were abandoned across New England after the 1800s, and the north woods grew back as working timberland."
    - "North Dakota is the least forested state at 1.7%. Its prairie was plowed for wheat, and trees survive mostly along rivers, in the Turtle Mountains and in the badlands."
    - "Alaska has the most forest land of any state at 128,577 thousand acres, yet that is only 35.2% of its land. Texas is second with 62,425 thousand acres."

  methodology: "Forest land in thousand acres and its share of land area (water excluded) from the USDA Forest Service Forest Inventory and Analysis FY2016 report. Counts cover the 50 states only."

