faq:
  - question: "What is the most forested state in the US?"
    answer: "Maine, with 89.5% of its land in forest. New Hampshire is second at 84.3% and West Virginia third at 79.0%."

  - question: "Which state has the most forest acres?"
    answer: "Alaska, with 128,577 thousand acres, or about 128.6 million. Its percentage is modest at 35.2% because so much of the state is tundra, ice and mountain."

  - question: "Which state has the least forest?"
    answer: "North Dakota, at 1.7% of its land. Most of its trees grow in river bottoms, shelterbelts planted to slow prairie wind, and the Turtle Mountains."

  - question: "What percent of Texas is forest?"
    answer: "37.3%, or 62,425 thousand acres, the most of any of the lower 48 states. The forests are concentrated in the humid east, in the Piney Woods near the Louisiana border."

  - question: "Why does Nebraska have so few trees?"
    answer: "Nebraska is 3.2% forest because it is mostly grassland, from the Sandhills in the north to cropland in the east. The state is known for Arbor Day, which began in Nebraska City in 1872 to encourage tree planting."

  - question: "How much of Oregon is forested?"
    answer: "48.5%, or 29,804 thousand acres. The wet western side of the Cascades grows dense Douglas fir, while the dry east side is mostly sagebrush and open ranchland."

