  - id: "least-forested-states"
    icon: "fa-solid fa-wheat-awn"
    title: "Least Forested States"
    paragraphs:
      - "North Dakota has 760 thousand acres of forest, only 1.7% of its land. Nebraska (3.2%), South Dakota (3.9%) and Kansas (4.8%) follow. These states sit on the Great Plains, where rainfall is too low and fires and grazing bison once kept trees out, and settlers later plowed the grass for crops."
      - "Nebraska is also the birthplace of Arbor Day. J. Sterling Morton proposed it in 1872 because the treeless plains had little wood for building and fuel. Nevada (15.9%) is low for another reason, since its basin-and-range desert supports forest only on the mountaintops."

