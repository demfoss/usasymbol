sections:
  - id: "why-maine-is-the-most-forested-state"
    icon: "fa-solid fa-tree"
    title: "Why Maine Is the Most Forested State"
    paragraphs:
      - "Maine is 89.5% forest, or 17,660 thousand acres. Many New England hill farms were abandoned after the Erie Canal and the railroads opened richer Midwestern land, and the woods grew back. Across the north, huge tracts are still managed as working forest for lumber and paper."
      - "New Hampshire (84.3%) and Vermont (77.8%) followed the same path of farm abandonment and regrowth. West Virginia (79.0%) got there for a different reason, since its steep Appalachian hills were always too rugged for large farms. See where [national forests by state](/rankings/geography/national-forests-by-state) protect that cover."

  - id: "states-with-the-most-forest-land"
    icon: "fa-solid fa-mountain-sun"
    title: "States With the Most Forest Land"
    paragraphs:
      - "Alaska has 128,577 thousand acres of forest, roughly twice Texas, the runner-up. Most of Alaska's trees are spruce, hemlock and birch in the southeast and the interior, while the tundra of the north and the glaciers hold none. Texas gets its 62,425 thousand acres largely from the pine woods of East Texas."
      - "Oregon holds 29,804 thousand acres, and much of it is federal land. Compare the totals with [public land by state](/rankings/geography/public-land-by-state)."
    table:
      columns:
        state: "State"
        acres: "Forest Land (thousand acres)"
        pct: "Percent Forest"
