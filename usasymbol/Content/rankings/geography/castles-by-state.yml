faq:
  - question: "What state has the most castles?"
    answer: "New York has the greatest concentration of castle-style landmarks in any single state. Notable examples include Lyndhurst in Tarrytown (1838), Boldt Castle on Heart Island (1900), Oheka Castle in Cold Spring Hills (1919), and Bannerman Castle on Pollepel Island (1901)."

  - question: "What is the oldest castle in the United States?"
    answer: "Lyndhurst in Tarrytown, New York, built in 1838, is the oldest castle-style landmark in the United States. It predates the next oldest documented U.S. castle, Barnsley Gardens in Georgia (1846), by eight years."

  - question: "What is the largest castle in America?"
    answer: "Biltmore Estate in Asheville, North Carolina, is the largest castle in the United States at 178,926 square feet across 250 rooms. Built in 1895 by George Vanderbilt, it remains the largest privately owned house in the country."

  - question: "Is Hearst Castle the most famous castle in America?"
    answer: "Hearst Castle in San Simeon, California (1919) is among the most visited, drawing roughly 750,000 visitors annually as a California State Park. Biltmore Estate in North Carolina receives about 1.5 million visitors per year, making it the most-visited private home in the United States."

  - question: "Which states have no castles?"
    answer: "Thirty-two states have no documented castle-style landmark. These include Texas, Illinois, Virginia, Tennessee, Louisiana, and most states in the Great Plains and Mountain West."

  - question: "Is Bishop's Castle in Colorado real?"
    answer: "Bishop's Castle in Beulah, Colorado, is a real ongoing construction project started in 1969 by Jim Bishop. He has built it alone using stone from the surrounding San Isabel National Forest, without permits or outside funding. It is free and open to the public."

