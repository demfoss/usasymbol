seo:
  title: "Castles by State | Map, Historic Sites & Facts"
  description: "New York's Lyndhurst (1838) is the oldest U.S. castle. 18 states have a notable castle; 32 have none. Hearst Castle, Biltmore, Coral Castle."

page:
  h1: "Castles by State"

  quick_answer:
    - "Lyndhurst in Tarrytown, New York, built in 1838, is the oldest castle-style landmark in the United States on this list. Eighteen states have a notable castle or castle-style building; 32 states have no documented example."
    - "North Carolina's Biltmore Estate (1895) is the largest castle in America at 178,926 square feet across 250 rooms. Hearst Castle in California (1919) is the most visited, drawing roughly 750,000 visitors per year as a California State Park."
    - "Three American castles were built entirely by one person working alone: Coral Castle in Florida (Edward Leedskalnin, 1923-1951), Loveland Castle in Ohio (Harry Andrews, 1929-1981), and Bishop's Castle in Colorado (Jim Bishop, 1969-present, still under construction)."

  methodology: "This list includes one notable castle or castle-style landmark per state where one exists. 'Castle-style' includes Gothic Revival, Romanesque Revival, Norman, Chateauesque, and similar architectural styles that visually resemble a European castle. Purely military fortifications, missions, and plantation houses without castle architectural elements are excluded. Year built reflects the year construction began or substantially commenced."

  sources:
    - name: "National Trust for Historic Preservation"
      url: "https://savingplaces.org"
      description: "Nonprofit steward of several U.S. castle-style landmarks including Lyndhurst in Tarrytown, New York"
    - name: "California State Parks – Hearst Castle"
      url: "https://www.parks.ca.gov/?page_id=592"
      description: "Official state park page for Hearst Castle, San Simeon, California"
    - name: "Biltmore Estate"
      url: "https://www.biltmore.com"
      description: "Official site of the Biltmore Estate, the largest privately owned house in the United States"

