faq:
  - question: "Which state had the most Civil War battles?"
    answer: "Virginia, with 124 of the 384 principal battles. Tennessee is a distant second with 38."
  - question: "How many Civil War battles were fought in Georgia?"
    answer: "Georgia has 27 principal battles, which ranks 4th. Most came in 1864 during Sherman's march toward Atlanta, including Kennesaw Mountain."
  - question: "How many principal Civil War battles were there?"
    answer: "The Civil War Sites Advisory Commission identified 384 principal battles in 25 states and Washington, DC."
  - question: "Were any Civil War battles fought in the North?"
    answer: "Yes, but few. Pennsylvania has two (Hanover and Gettysburg), Ohio two, and Indiana one. Maryland, a border state, has seven."
  - question: "How many Civil War battles were in Missouri?"
    answer: "Missouri has 29, which ranks 3rd. It stayed in the Union but its people were deeply split, and guerrilla warfare there was especially bitter."
  - question: "What was the first major Civil War battle in Virginia?"
    answer: "Manassas, also called Bull Run, in July 1861. It showed both sides that the war would not be short."
