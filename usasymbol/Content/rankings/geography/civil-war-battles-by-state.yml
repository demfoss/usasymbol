  description: "Virginia saw 124 of the 384 principal Civil War battles, more than any other state. Tennessee had 38, Missouri 29, and Georgia 27."
page:
  h1: "Civil War Battles by State"
  quick_answer:
    - "Virginia has the most Civil War battles of any state, 124 of the 384 principal battles. Richmond, the Confederate capital, stood only about 100 miles from Washington."
    - "Pennsylvania has just two, Hanover and Gettysburg, yet Gettysburg in 1863 was the largest battle of the war and its turning point in the East."
    - "North Dakota has five, all fought in 1863 and 1864 between Union troops and Dakota Sioux, including Whitestone Hill and Killdeer Mountain. Twenty-five states have none."
  methodology: "Principal battles from the Civil War Sites Advisory Commission report of 1993, published by the National Park Service. Each of the 384 battles is assigned to one state. Washington, DC (1 battle) and the 25 states with none are omitted."
