  - id: why-tennessee-ranks-second-for-civil-war-battles
    title: "Why Tennessee Ranks Second for Battles"
    paragraphs:
      - "Tennessee has 38 principal battles, the second most. The Tennessee and Cumberland rivers were open highways into the Confederate interior, and Union gunboats used them in 1862 to take Forts Henry and Donelson. Shiloh and Stones River followed, and railroads at Chattanooga made that city a prize both sides wanted."
      - "Tennessee was the last state to secede, in June 1861, and the first readmitted, in 1866. Many of its citizens fought for the Union."
