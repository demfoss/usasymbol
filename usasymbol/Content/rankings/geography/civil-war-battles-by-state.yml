sections:
  - id: why-virginia-has-the-most-civil-war-battles
    title: "Why Virginia Has the Most Civil War Battles"
    paragraphs:
      - "Virginia hosted 124 principal battles, nearly a third of all of them. Richmond became the Confederate capital in the spring of 1861, and Washington lay only about 100 miles north. Union armies kept pushing south toward Richmond, and Confederate armies kept crossing the Potomac, so the ground between the two capitals was fought over for four years."
      - "The war opened in Virginia at Manassas in 1861 and ended there at Appomattox Court House in 1865. Most of the other states on this list were Confederate, as the [Confederate states](/rankings/geography/confederate-states) ranking shows."
