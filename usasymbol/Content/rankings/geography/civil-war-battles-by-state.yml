  - id: civil-war-battles-in-the-north-and-west
    title: "Civil War Battles in the North and West"
    paragraphs:
      - "Pennsylvania has only two principal battles, but one of them is Gettysburg. Ohio (2) and Indiana (1) appear because of Morgan's Raid in July 1863, when Confederate cavalry crossed the Ohio River and fought at Corydon, Buffington Island, and Salineville."
      - "Maryland has 7, including Antietam in 1862, the bloodiest single day in American history. Farther west, North Dakota (5), Kansas (4), Minnesota (2), Colorado (1), and Idaho (1) record clashes with Native nations and border raids more than fights between the two armies."
