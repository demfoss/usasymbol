faq:
  - question: "What is the deepest lake in the United States?"
    answer: "Crater Lake in Oregon is the deepest lake in the United States, with a maximum depth of 1,943 feet (592 m). It formed in the volcanic caldera of Mount Mazama after a collapse approximately 7,700 years ago and is fed entirely by rain and snowfall — no rivers flow into it."

  - question: "What are the top 5 deepest lakes in the US?"
    answer: "The five deepest lakes in the United States are: Crater Lake, OR (1,943 ft / 592 m), Lake Tahoe, CA/NV (1,645 ft / 501 m), Lake Chelan, WA (1,486 ft / 453 m), Lake Superior (1,332 ft / 406 m), and Lake Michigan (923 ft / 281 m)."

  - question: "What are the deepest lakes in the US ranked by depth?"
    answer: "The deepest lakes in the US ranked by maximum depth: 1. Crater Lake, OR (1,943 ft) 2. Lake Tahoe, CA/NV (1,645 ft) 3. Lake Chelan, WA (1,486 ft) 4. Lake Superior (1,332 ft) 5. Lake Michigan (923 ft) 6. Lake Ontario (802 ft) 7. Lake Huron (750 ft) 8. Seneca Lake, NY (618 ft) 9. Cayuga Lake, NY (435 ft) 10. Flathead Lake, MT (370 ft) 11. Lake Erie (210 ft)."

  - question: "Is Lake Tahoe deeper than the Great Lakes?"
    answer: "Yes. Lake Tahoe at 1,645 feet is deeper than all five Great Lakes. Lake Superior, the deepest Great Lake, reaches 1,332 feet — about 313 feet shallower than Tahoe's deepest point on the California side near Crystal Bay."

  - question: "Why is Crater Lake so deep?"
    answer: "Crater Lake is deep because it sits inside a volcanic caldera — the collapsed remnant of Mount Mazama — rather than a river valley or glacially scoured basin. The caldera walls drop abruptly to extreme depth across a small surface area of just 20 square miles, producing nearly 2,000 feet of depth with no gradual slope."

  - question: "What is the deepest lake in the continental US?"
    answer: "Crater Lake in Oregon, at 1,943 feet, is the deepest lake in the contiguous 48 states. It is also the deepest in the entire United States, as no lake in Alaska or Hawaii exceeds that recorded depth."

  - question: "How deep is Lake Chelan in Washington?"
    answer: "Lake Chelan in Washington reaches a maximum depth of 1,486 feet (453 m). Its lake floor sits 390 feet below sea level even though the lake surface stands 1,079 feet above the ocean — the result of deep glacial carving during the last ice age that gouged the basin far below the surrounding river level."

