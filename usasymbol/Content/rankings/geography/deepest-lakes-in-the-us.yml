sections:
  - id: "deepest-lake-in-the-us"
    icon: "fa-solid fa-water"
    title: "Crater Lake: The Deepest Lake in the United States"
    paragraphs:
      - "Crater Lake, Oregon, at 1,943 feet (592 m), is the deepest lake in the United States and the ninth-deepest in the world. It formed inside the caldera of Mount Mazama, a stratovolcano that erupted roughly 40 times more powerfully than Mount St. Helens before collapsing inward around 5700 BCE. The Klamath people, who inhabited the Pacific Northwest at the time, recorded the event in oral tradition — placing Crater Lake's origin among the oldest geologically documented events in North American indigenous history."
      - "Because no rivers or streams flow into Crater Lake, its water ranks among the purest ever measured on Earth. The lake maintains its level through a natural balance between annual snowfall averaging 43 feet and slow seepage through the caldera floor. That clarity and stillness produce the lake's defining characteristic: a deep blue so saturated it registers from commercial aircraft at 30,000 feet on cloudless days."
      - "Crater Lake became a national park in 1902, the fifth in the United States. Its true maximum depth was not confirmed until 1959, when the first complete echo-sounding survey corrected earlier estimates that had understated the depth by hundreds of feet. A multibeam sonar survey in 2000 locked in the 1,943-foot figure used on every official source today."

  - id: "top-5-deepest-lakes-in-the-us"
    icon: "fa-solid fa-ranking-star"
    title: "Top 5 Deepest Lakes in the US"
    paragraphs:
      - "Lake Tahoe ranks second at 1,645 feet (501 m). Sitting at 6,225 feet above sea level in the Sierra Nevada, it straddles the California–Nevada border, with its deepest point on the California side near Crystal Bay. Tahoe holds 36.2 trillion gallons of water — enough to submerge the entire state of California under 14 inches of water — and its water-retention time is roughly 650 years, meaning the water you see today entered the lake before the American Revolution."
      - "Lake Chelan, third at 1,486 feet (453 m), was carved by a glacier during the last ice age: its floor descends to 390 feet below sea level — even though the lake surface stands more than a mile above the ocean. It is effectively a landlocked fjord in a desert basin, the kind of landform more common in Norway than in Washington state. The town of Stehekin at Chelan's north end has no road access; the only ways in are by boat up the 55-mile lake or by seaplane."
      - "Lake Superior, fourth at 1,332 feet (406 m), is the world's largest freshwater lake by surface area and the deepest of the five Great Lakes. It holds 10 percent of all surface freshwater on Earth. Superior's water temperatures stay cold enough year-round to preserve the wrecks of ships sunk more than a century ago — including the Edmund Fitzgerald, a 729-foot ore carrier lost in a November 1975 storm and discovered lying in two pieces 530 feet below the surface off the Michigan coast."

  - id: "deepest-lakes-in-the-us-ranked"
    icon: "fa-solid fa-list-ol"
    title: "Deepest Lakes in the US Ranked: What Creates Extreme Depth"
    paragraphs:
      - "The deepest lakes in the United States each owe their depth to one of three geological forces. Volcanic calderas produce the most extreme depths in the smallest footprint — Crater Lake's 1,943-foot bottom exists inside a crater just 6 miles wide, the result of a single catastrophic collapse rather than slow erosion. Glacial carving produced the next tier: Lake Chelan and New York's Finger Lakes were gouged by ice sheets advancing south during the last glacial maximum, deepening pre-existing river valleys by hundreds of feet in geologically brief intervals."
      - "The Great Lakes represent a third mechanism — basins shaped by millions of years of river cutting, tectonic warping, and at least four major glaciation cycles over the past two million years. Their depth variation reflects local bedrock: Lake Erie rests on a shallow limestone shelf that resisted glacial scouring, limiting it to 210 feet, while Lake Superior's northern basin descends into ancient Precambrian rock hard enough to hold steep underwater walls."
      - "Seneca Lake, the deepest Finger Lake at 618 feet, is one of the less obvious entries on any deepest-lakes list. Its depth rivals Lake Huron's (750 feet), yet it sits in upstate New York surrounded by vineyards. The US Navy made practical use of that depth during World War II, running sonar experiments on Seneca to simulate open-ocean submarine detection — the cold, still water column matched conditions the Navy needed to test without going to sea."

