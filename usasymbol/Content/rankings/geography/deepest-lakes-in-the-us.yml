page:
  h1: "Deepest Lakes in the US Ranked"

  quick_answer:
    - "Crater Lake in Oregon, at 1,943 feet (592 m), is the deepest lake in the United States. It formed roughly 7,700 years ago when Mount Mazama collapsed into itself after a massive volcanic eruption, leaving behind a caldera that rain and snowmelt have slowly filled over millennia. No rivers flow into it; the lake sustains its level entirely through precipitation."
    - "The five deepest lakes in the US by maximum depth: Crater Lake, OR (1,943 ft) → Lake Tahoe, CA/NV (1,645 ft) → Lake Chelan, WA (1,486 ft) → Lake Superior (1,332 ft) → Lake Michigan (923 ft). The West claims the top three slots — each formed by volcanic or glacial forces far more abrupt than gradual river erosion. The Great Lakes hold four of the next six positions, though they vary dramatically in depth: Superior is nine times deeper than Erie."

  methodology: "Maximum depth figures are sourced from USGS, NOAA, and state hydrological surveys. Where agencies report slightly differing soundings, the most widely cited peer-reviewed figure is used. State assignment reflects the state containing the deepest recorded sounding; border lakes (Tahoe, Superior) are listed under that state even when the lake spans multiple states. Surface areas are approximate open-water measurements."

