      url: "https://www.ncsl.org/about-state-legislatures/state-capitals"
      description: "Information about state capitals and legislatures"
    - name: "U.S. Census Bureau"
      url: "https://www.census.gov/programs-surveys/popest.html"
      description: "Population estimates for cities and metropolitan areas"

