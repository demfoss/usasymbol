sections:
  - id: "why-not-largest"
    icon: "fa-solid fa-city"
    title: "Why Most State Capitals Aren't the Largest Cities"
    paragraphs:
      - "Only 17 of 50 state capitals are also the largest city in their state. For the full reverse view, see the [states where the capital is not the largest city](/rankings/geography/state-capitals-not-largest-city). This surprises many people who assume capital cities would naturally grow to become the most populous. The pattern reflects historical decisions made when states were founded, often prioritizing geography, compromise, and political considerations over population size. Many capitals were selected when the state's population distribution looked very different than it does today."
      - "California provides a perfect example. Sacramento became the capital in 1854 during the Gold Rush era, chosen for its central location and accessibility via river transport. At the time, San Francisco was already larger, but Sacramento's position in the Central Valley made it more accessible to the entire state. Today, Los Angeles has nearly 4 million residents while Sacramento has about 525,000, yet Sacramento remains the capital because of its established governmental infrastructure and central location."
      - "New York presents the most dramatic case - New York City has over 8 million residents, making it America's largest city, yet tiny Albany (population 99,000) serves as the state capital. Albany was chosen in 1797 because of its location on the Hudson River and its position roughly in the center of the state. Moving a capital once it's established is extremely expensive and politically difficult, requiring relocating thousands of government workers, building new facilities, and overcoming resistance from the current capital's residents and businesses."

  - id: "smallest-capitals"
    icon: "fa-solid fa-building"
    title: "America's Smallest State Capitals"
    paragraphs:
      - "Montpelier, Vermont holds the distinction of being America's smallest state capital with a population of approximately 8,000 residents. This makes Montpelier smaller than most American suburbs, yet it houses Vermont's entire state government including the legislature, governor's office, and supreme court. Montpelier's compact size creates a unique atmosphere where residents regularly encounter state legislators at local coffee shops and grocery stores, creating an accessible and personal form of government."
      - "Pierre, South Dakota ranks as the second-smallest capital with about 14,000 residents. Pierre (pronounced 'peer') became South Dakota's capital in 1889 as a compromise between eastern and western regions of the state. Its location on the Missouri River in the geographic center of the state made it an acceptable choice to both sides, even though it remains much smaller than Sioux Falls (population 192,000) or Rapid City (population 74,000). Pierre's small size means that virtually everyone in town is somehow connected to state government."
      - "Augusta, Maine (population 18,900), Frankfort, Kentucky (population 28,600), and Juneau, Alaska (population 32,250) round out the five smallest capitals. These small capitals share common characteristics: they were chosen for geographic centrality or as political compromises, they predate modern transportation and communication, and they've remained capitals despite population shifts because of the enormous cost and disruption of relocating state governments. Their small size often creates tight-knit communities where government feels more accessible than in larger capital cities."

  - id: "largest-capitals"
    icon: "fa-solid fa-chart-line"
    title: "Largest U.S. State Capitals by Population"
    paragraphs:
      - "Phoenix, Arizona is America's largest state capital with over 1.6 million residents — the 5th largest city in the United States. The city was already Arizona's territorial capital in 1889 when it was still a small desert outpost; it grew into a megalopolis around the government, not because of it. That kind of reversal — where a small capital becomes a dominant metro — is rare."
      - "Columbus, Ohio (population 905,000), Indianapolis, Indiana (population 887,000), Austin, Texas (population 961,000), and Nashville, Tennessee (population 689,000) form the group of largest capitals after Phoenix. These cities benefit from being both political and economic centers, attracting businesses, universities, and cultural institutions. Austin's status as Texas capital helped it develop into a major technology hub, while Nashville leveraged its capital status alongside its music industry heritage to become a thriving metropolitan area."
      - "Boston, Massachusetts (population 675,000) and Denver, Colorado (population 715,000) represent older capitals that maintained their importance as their states grew. Boston served as the colonial capital and remained politically and economically dominant throughout Massachusetts history. Denver was chosen as Colorado's capital in 1867 and grew alongside the mining and railroad industries. These major capital cities demonstrate that geographic centrality isn't always necessary - historical importance, economic strength, and established infrastructure can make a large city the natural choice for state government."

  - id: "unique-capital-facts"
    icon: "fa-solid fa-map-pin"
    title: "Surprising Facts About U.S. State Capitals"
    paragraphs:
      - "Juneau, Alaska is the only state capital with no road connections to the rest of its state or the continental United States. You can only reach Juneau by airplane or ferry, making it America's most isolated capital. Despite being Alaska's third-largest city, Juneau covers an enormous land area of 3,255 square miles - larger than the entire state of Delaware. This vast size includes glaciers, mountains, and wilderness areas surrounding the actual city center. Juneau became capital when Alaska was a U.S. territory in 1906, chosen over Sitka because of its gold mining industry and strategic location."
      - "Santa Fe, New Mexico is America's highest elevation capital at 7,199 feet above sea level, nearly 1.5 miles high. Founded by Spanish colonists in 1610, Santa Fe is also the oldest state capital in the United States, predating the American Revolution by over 150 years; it also appears in our [oldest city in each state](/rankings/geography/oldest-city-by-state) list. The city's adobe architecture and rich cultural heritage reflect its Spanish and Native American roots. Denver comes in second for elevation at 5,280 feet, earning it the nickname 'The Mile High City,' though it's still nearly 2,000 feet lower than Santa Fe. For a broader view of how elevation shapes each state, see the [average elevation by state map](/rankings/geography/highest-point-by-state) showing every state's highest point."
      - "Four state capitals share their name with their state or are the only major city: Indianapolis literally means 'Indiana City,' Oklahoma City takes the state's name, Honolulu essentially represents Hawaii as a city-state situation, and Dover is Delaware's capital. Honolulu presents a special case - the City and County of Honolulu covers the entire island of Oahu, making it simultaneously a city, county, and effectively representing most of Hawaii's population. This unique governmental structure exists nowhere else among U.S. state capitals."

  - id: "capital-selection-process"
    icon: "fa-solid fa-landmark"
    title: "Why U.S. State Capitals Are Where They Are"
    paragraphs:
      - "Most state capitals were chosen through one of several methods: geographic centrality, political compromise, historical importance, or economic significance. Geographic centrality was the most common reason — placing the capital near the state's center made it equally accessible to all citizens in an era before automobiles and airplanes. Jefferson City, Missouri; Pierre, South Dakota; and Lansing, Michigan were all selected primarily because of their central locations when those states were first admitted to the Union. For the full [list of when states became states](/rankings/government/states-order-of-succession) and their exact admission dates, see our statehood timeline."
      - "Political compromises created several capitals when regions or cities competed for the honor. Oklahoma City became capital after a bitter fight between Guthrie and Oklahoma City, resolved by voters in 1910. Tallahassee, Florida was chosen in 1824 as a compromise between Pensacola in the west and St. Augustine in the east - Tallahassee sat roughly halfway between them. Baton Rouge, Louisiana became capital in 1849 as a compromise between New Orleans and the northern part of the state, which feared New Orleans' dominance."
      - "Some capitals retained their status from colonial or territorial days due to historical importance. Boston, Annapolis, and Richmond served as colonial capitals and simply continued in that role. Sacramento inherited its position from earlier California capitals Monterey and San Jose, but its Gold Rush-era importance and central location made it the permanent choice. A few states actually moved their capitals: Iowa moved from Iowa City to Des Moines in 1857, Alabama moved from Tuscaloosa to Montgomery in 1846, and North Carolina briefly moved from New Bern to Raleigh in 1792. These relocations typically happened in states' early years before massive governmental infrastructure made moving prohibitively expensive."

faq:
  - question: "What is the capital of each U.S. state?"
    answer: "Each of the 50 U.S. states has its own designated capital city. Examples include Sacramento (California), Austin (Texas), Albany (New York), and Tallahassee (Florida). The complete alphabetical list runs from Montgomery, Alabama to Cheyenne, Wyoming."
  
  - question: "What is the largest state capital by population?"
    answer: "Phoenix, Arizona is the largest state capital by population with over 1.6 million residents. This makes Phoenix not only the largest capital but also the 5th largest city in the entire United States. Columbus, Ohio (905,000) and Indianapolis, Indiana (887,000) are the second and third largest capitals."
  
  - question: "What is the smallest state capital?"
    answer: "Montpelier, Vermont is the smallest state capital with approximately 8,000 residents. Pierre, South Dakota is the second smallest with about 14,000 people. Despite their small size, both cities serve as full functioning state capitals with complete governmental infrastructure."
  
  - question: "How many state capitals are also the largest city in their state?"
    answer: "Only 17 of the 50 state capitals are also the largest city in their state. These include Phoenix (Arizona), Denver (Colorado), Boston (Massachusetts), Atlanta (Georgia), Indianapolis (Indiana), Columbus (Ohio), and Nashville (Tennessee). The remaining 33 states have capitals that are smaller than their largest cities."
  
  - question: "What are the two-letter postal abbreviations for each state?"
    answer: "Each U.S. state has a unique two-letter postal abbreviation assigned by the United States Postal Service. Examples include CA (California), TX (Texas), NY (New York), FL (Florida), and IL (Illinois). These abbreviations are used for mailing addresses and are standardized across all official communications."
  
  - question: "Which state capital is the oldest?"
    answer: "Santa Fe, New Mexico is the oldest state capital, founded by Spanish colonists in 1610 - over 400 years ago and 166 years before the Declaration of Independence. Annapolis, Maryland (founded 1649) and Boston, Massachusetts (founded 1630) are also among the oldest capitals, though they became capitals later than their founding dates."
  
  - question: "Which state capital has the highest elevation?"
    answer: "Santa Fe, New Mexico is the highest elevation state capital at 7,199 feet above sea level. Denver, Colorado is second at 5,280 feet (exactly one mile high, earning it the nickname 'Mile High City'). Cheyenne, Wyoming ranks third at 6,062 feet elevation."
  
  - question: "Can state capitals be changed or moved?"
    answer: "Yes, state capitals can be moved, though it's extremely rare in modern times due to the enormous cost and political challenges. Several states moved their capitals in the 1800s, including Alabama (to Montgomery in 1846), Iowa (to Des Moines in 1857), and Oklahoma (to Oklahoma City in 1910). Today, relocating a capital would require voter approval, legislative action, and billions of dollars to relocate government buildings and employees."

