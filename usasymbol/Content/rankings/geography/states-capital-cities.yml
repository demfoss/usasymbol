page:
  h1: "U.S. State Capitals: Complete List with Abbreviations and Population"
  
  quick_answer:
    - "All 50 U.S. states have designated capital cities where state governments operate. Phoenix, Arizona is the largest state capital by population (1.6+ million), while Montpelier, Vermont is the smallest (around 8,000 residents)."
    - "Only 17 of 50 state capitals are also the largest city in their state. The rest were chosen for geographic centrality, political compromise, or historical inertia — decisions made when population maps looked nothing like they do today."

  methodology: "This list includes all 50 U.S. state capitals with their official two-letter postal abbreviations as designated by the United States Postal Service. Population figures are approximate estimates based on recent U.S. Census data. States are listed alphabetically for easy reference."
  
  sources:
    - name: "United States Postal Service"
      url: "https://about.usps.com/who/profile/history/state-abbreviations.htm"
      description: "Official two-letter state postal abbreviations"
