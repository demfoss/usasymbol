faq:
  - question: "What states are in the Midwest?"
    answer: "Twelve states make up the Census Midwest: Illinois, Indiana, Iowa, Kansas, Michigan, Minnesota, Missouri, Nebraska, North Dakota, Ohio, South Dakota, and Wisconsin. The Census has used this 12-state definition since 1984, when the region was renamed from North Central to Midwest."

  - question: "How many states are in the Midwest?"
    answer: "There are 12 states in the Census Midwest. In everyday usage, the count varies widely — some people use Midwest to mean only the 6 Great Lakes states (Illinois, Indiana, Michigan, Minnesota, Ohio, Wisconsin), while others extend it to 12 or 13 states including Great Plains states like Kansas and Nebraska."

  - question: "Is Missouri in the Midwest?"
    answer: "Yes. Missouri is one of the 12 Census Midwest states, in the West North Central division. St. Louis and Kansas City, Missouri's two largest cities, are both considered core Midwest cities. Most geographic references treat Missouri as unambiguously Midwest."

  - question: "Is Kansas in the Midwest?"
    answer: "By Census definition, yes — Kansas is one of the 12 Census Midwest states in the West North Central division. However, Kansas is frequently classified as a Great Plains state in popular usage and some geographic references. The geographic center of the contiguous 48 states is in Smith County, Kansas."

  - question: "What is the largest Midwest state?"
    answer: "Michigan is the largest Midwest state by total area at 96,714 square miles. Minnesota is second at 86,936 square miles. By population, Illinois is the largest Midwest state at approximately 12.5 million residents, followed by Ohio at approximately 11.8 million."

  - question: "What is the smallest Midwest state?"
    answer: "Indiana is the smallest Midwest state by total area at 36,420 square miles. By population, North Dakota is the smallest Midwest state at approximately 779,000 residents, followed by South Dakota at approximately 887,000."

