faq:
  - question: "What is the windiest state in the U.S.?"
    answer: "South Dakota is the windiest state in the U.S. by average annual wind speed, at approximately 11.5 mph. Wyoming, Kansas, Nebraska, and North Dakota round out the top five. All five are Great Plains states where flat terrain and high elevation produce consistent winds."

  - question: "What is the windiest city in the United States?"
    answer: "Amarillo, Texas, consistently ranks among the windiest large cities at around 13.5 mph. Cheyenne, Wyoming (12.8 mph), Wichita, Kansas (12.7 mph), Boston, Massachusetts (12.4 mph), and Oklahoma City, Oklahoma (12.2 mph) also rank near the top. Chicago averages about 10.3 mph."

  - question: "Is Chicago really the Windiest City?"
    answer: "No. The nickname most likely came from an 1893 newspaper editorial calling Chicago politicians 'windbags,' not from weather data. By average annual wind speed, Chicago (around 10.3 mph) ranks below Amarillo, Cheyenne, Wichita, Boston, and several other U.S. cities. Illinois ranks 15th among the 50 states."

  - question: "Why is the Great Plains so windy?"
    answer: "The Great Plains is flat, open, and elevated with almost no terrain to slow the wind. Cold air from Canada and warm air from the Gulf of Mexico travel freely across the plain for hundreds of miles. There are no mountains or forests in between to interrupt them."

  - question: "What is the least windy state in the U.S.?"
    answer: "Florida is the least windy state, averaging about 6.2 mph annually. Alabama (6.3 mph), Louisiana (6.4 mph), and Georgia (6.7 mph) also rank near the bottom. Low elevation, dense forest cover, and subtropical high-pressure systems keep these states calm most of the year."

  - question: "Which state produces the most wind energy?"
    answer: "Texas produces the most wind energy in the U.S. by total installed capacity, accounting for roughly 25% of the country's wind power. Iowa generates the highest share of its electricity from wind at over 60%. North Dakota, Kansas, Oklahoma, and Illinois are also leading wind energy states."

  - question: "Why is Mount Washington in New Hampshire so windy?"
    answer: "Mount Washington sits at the intersection of three major storm tracks and its summit has no shelter from any direction. A gust of 231 mph was recorded there on April 12, 1934, a world record for a staffed weather station that stood for 62 years. The summit averages 35 mph year-round."

