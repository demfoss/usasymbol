faq:
  - question: "What states are in the Mid-Atlantic?"
    answer: "It depends on the definition. The U.S. Census Bureau defines the Mid-Atlantic (officially called the 'Middle Atlantic' division) as 3 states: New York, New Jersey, and Pennsylvania. Common usage expands this to 6 states by adding Delaware, Maryland, and Virginia. West Virginia is sometimes included, making it 7."

  - question: "How many states are in the Mid-Atlantic?"
    answer: "3 states per the U.S. Census Bureau (New York, New Jersey, Pennsylvania), or 6 states in the most common broader definition (adding Delaware, Maryland, Virginia), or 7 if West Virginia is included. No single federal standard uses all 7."

  - question: "Is Maryland in the Mid-Atlantic?"
    answer: "Yes, in common usage. Maryland is included in nearly every non-Census definition of the Mid-Atlantic. However, the U.S. Census Bureau places Maryland in its South Atlantic division, not the Middle Atlantic. The EPA, FEMA, and most travel and media organizations use broader definitions that include Maryland."

  - question: "Is Virginia in the Mid-Atlantic?"
    answer: "Northern Virginia is widely considered Mid-Atlantic because of its ties to Washington D.C. and the Baltimore-Washington corridor. The rest of Virginia — central, southern, and western — is more commonly grouped with the South. The Census Bureau places all of Virginia in its South Atlantic division, not the Mid-Atlantic."

  - question: "What is the difference between the Mid-Atlantic and the Northeast?"
    answer: "The U.S. Census places New York, New Jersey, and Pennsylvania in both — they are in the Northeast region and the Middle Atlantic division simultaneously. In everyday usage, 'Northeast' usually means New England (CT, MA, ME, NH, RI, VT) plus New York, while 'Mid-Atlantic' means New York south through Virginia. The labels overlap most at New York, New Jersey, and Pennsylvania, which credibly fit either."

  - question: "Is Washington D.C. in the Mid-Atlantic?"
    answer: "Washington D.C. is frequently included in practical discussions of the Mid-Atlantic region but is not a state. It is a federal district carved from Maryland in 1790. Most Mid-Atlantic regional offices — including EPA Region 3 and FEMA Region 3 — include D.C. in their jurisdiction. The Census Bureau places D.C. in its South Atlantic division."

