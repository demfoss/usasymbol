page:
  h1: "Mid-Atlantic States"

  quick_answer:
    - "The U.S. Census Bureau defines the Mid-Atlantic as 3 states: New York, New Jersey, and Pennsylvania. Common usage adds Delaware, Maryland, and Virginia — giving 6 states — and sometimes West Virginia, for 7. No single federal authority uses all 7."
    - "The Census definition follows a strict geographic division called the 'Middle Atlantic' — one of nine Census divisions. The common-usage definition roughly matches the colonial-era Middle Colonies (NY, NJ, PA, DE, MD), which were the five original colonies between New England and the South."
    - "New York, New Jersey, and Pennsylvania are simultaneously classified as both Mid-Atlantic and Northeast by the Census Bureau — the Bureau places all three in the Middle Atlantic division within its broader Northeast region. This overlap is the primary source of confusion between 'Mid-Atlantic' and 'Northeast' in everyday use."

  methodology: "Mid-Atlantic classification uses two explicit tiers: the U.S. Census Bureau's official Middle Atlantic division (NY, NJ, PA), and the broader common-usage definition that adds DE, MD, VA, and sometimes WV. Sources for common usage include the National Geographic Style Guide, federal agency regional offices, and major media style guides. DC is included in broader definitions as a federal district, not a state."

  sources:
    - name: "U.S. Census Bureau — Census Divisions and Regions"
      url: "https://www.census.gov/geographies/reference-maps/2010/geo/2010-census-regions-and-divisions.html"
      description: "The Census Bureau's official geographic divisions, placing New York, New Jersey, and Pennsylvania in the Middle Atlantic division within the Northeast Census region"
    - name: "National Geographic — United States Regions"
      url: "https://www.nationalgeographic.org/encyclopedia/united-states-regions/"
      description: "National Geographic's regional definition includes a broader Mid-Atlantic covering NY, NJ, PA, MD, DE, and VA"

