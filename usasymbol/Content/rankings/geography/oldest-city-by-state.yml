      url: "https://www.census.gov/programs-surveys/metro-micro.html"
      description: "Data on municipalities and incorporated places"
    - name: "Library of Congress — American Memory"
      url: "https://memory.loc.gov/ammem/index.html"
      description: "Historical records of American cities and settlements"

