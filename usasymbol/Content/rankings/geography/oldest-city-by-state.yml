faq:
  - question: "What is the oldest city in the United States?"
    answer: "St. Augustine, Florida, founded in 1565 by Spanish explorer Pedro Menéndez de Avilés, is the oldest continuously occupied European-founded city in the United States. It has been inhabited for over 460 years across four different sovereignties. Santa Fe, New Mexico (1607) is the second oldest."

  - question: "What are the top 5 oldest cities in the U.S.?"
    answer: "The five oldest U.S. cities by European founding date: 1) St. Augustine, Florida (1565), 2) Santa Fe, New Mexico (1607), 3) Albany, New York (1614), 4) Plymouth, Massachusetts (1620), 5) Kittery, Maine and Dover, New Hampshire (both 1623, tied for fifth)."

  - question: "What is the oldest state capital in the U.S.?"
    answer: "Santa Fe, New Mexico is the oldest state capital, founded by Spanish colonists in 1607. It is also the highest-elevation capital city in the country at 7,199 feet. Its Palace of the Governors, built in 1610, is the oldest continuously occupied public building in the United States."

  - question: "Which state has the most recently founded oldest city?"
    answer: "Wyoming. Cheyenne was founded in 1867 as a Union Pacific Railroad construction camp — the most recent founding date of any state's oldest city. It became Wyoming's territorial capital within the same year and remains the state capital today."

  - question: "Why do different lists show different oldest cities for the same state?"
    answer: "Because the answer depends on the definition used. \"Oldest\" can mean first European contact, first permanent settlement, first incorporated municipality, or oldest continuously inhabited place. Virginia's Jamestown (1607) predates Williamsburg (1632), but Jamestown was largely abandoned after 1699 and is now a museum site. Pennsylvania's Chester (1644) predates Philadelphia (1681), but Penn's city appears on more lists because of its historical dominance."

  - question: "Which colonial power founded the most oldest cities by state?"
    answer: "Spain and France together account for the majority. Spain founded the oldest cities in Florida, New Mexico, California, Arizona, and Texas. France founded the oldest cities in Illinois, Michigan, Wisconsin, Louisiana, Indiana, Missouri, and Mississippi. England dominates New England and the Chesapeake. The Dutch founded Albany, NY; Russia founded Kodiak, AK; Mormon settlers founded Franklin, ID and Genoa, NV."

  - question: "What is the oldest city in the South?"
    answer: "St. Augustine, Florida (1565) is the oldest city in the South and the oldest in the entire United States. Natchitoches, Louisiana (1714) — founded by the French on the Red River — is the second-oldest Southern city and the oldest settlement in the entire Louisiana Purchase territory. Mobile, Alabama (1702) is the oldest city in the Deep South outside of Louisiana."

  - question: "How does continuous habitation affect which city counts as oldest?"
    answer: "A city founded early but later abandoned — even briefly — often loses its claim. Arkansas Post was established in 1686, the earliest European settlement in Arkansas, but went through periods of abandonment. Most lists therefore use Georgetown (1789) or note Arkansas Post separately. Continuous habitation is the gold standard, which is why St. Augustine's 1565 date is considered definitive."

