seo:
  title: "Oldest City in Each U.S. State — Complete List by Founding Year"
  description: "The oldest city in every state, from St. Augustine, FL (1565) to Cheyenne, WY (1867). Includes top 5 oldest cities in America and why oldest-city lists often disagree."

page:
  h1: "Oldest City in Each U.S. State: Full List by Founding Year"

  quick_answer:
    - "St. Augustine, Florida — founded by Spanish colonists in 1565 — is the oldest continuously occupied European-founded city in the United States. It predates the Jamestown colony by 42 years and the Mayflower landing by 55."
    - "The top 5 oldest cities in the U.S.: St. Augustine, FL (1565) → Santa Fe, NM (1607) → Albany, NY (1614) → Plymouth, MA (1620) → Kittery, ME and Dover, NH (both 1623, tied for fifth). The five states with the most recent oldest cities are all in the Mountain West, where European settlement arrived by wagon train rather than sailing ship."

  methodology: "Founding years reflect the most widely cited date for each state's oldest continuously occupied European-settled place — fort, mission, trading post, or town. Where dates are genuinely contested (Pennsylvania, New Jersey, New York, Virginia), the most commonly cited figure is used. Indigenous and Native Hawaiian habitation predates all entries on this list by centuries or millennia."

  sources:
