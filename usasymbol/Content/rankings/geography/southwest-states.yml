faq:
  - question: "What are the core Southwest states?"
    answer: "Arizona and New Mexico are the core Southwest states in this table. The other four entries are included more selectively, depending on which part of the state a definition emphasizes."

  - question: "Which state is the largest in the Southwest?"
    answer: "Texas is the largest listed Southwest state at 268,596 sq mi. New Mexico is next at 121,590 sq mi, and Arizona follows at 113,990 sq mi."

  - question: "Is Texas a Southwest state?"
    answer: "Texas is frequently included, not core. The table notes tie that label to West Texas, El Paso, Big Bend, and the Trans Pecos region."

  - question: "Is Nevada in the Southwest?"
    answer: "Nevada is frequently included. The notes point to southern Nevada, Las Vegas, Lake Mead, and the Mojave Desert rather than the whole state."

  - question: "Is Utah a Southwest state?"
    answer: "Utah is sometimes included. Zion, Bryce Canyon, Capitol Reef, Canyonlands, and Arches are the southern landmarks named in the table notes."

  - question: "Is Colorado part of the Southwest?"
    answer: "Colorado is sometimes included. Mesa Verde, Durango, and the Four Corners area support the Southwest case in the table notes."

