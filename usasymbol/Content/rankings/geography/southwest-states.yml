page:
  h1: "Southwest States: Core States, Full List, and Map"

  quick_answer:
    - "Arizona and New Mexico are the only two states that appear in every definition of the American Southwest. Texas, Nevada, Utah, and Colorado are frequently included but are not in every source's definition."
    - "Texas (268,596 sq mi) is the largest state in any Southwest definition. If Texas is included, the Southwest becomes the largest U.S. region by area and population. New Mexico (121,590 sq mi) and Arizona (113,990 sq mi) are the geographic core of the region."
    - "The Southwest has no Census definition — the Census Bureau groups these states in the West region. Definitions come from geographic encyclopedias, tourism boards, and cultural references, which produce anywhere from 4 to 8 states depending on the source."

  methodology: "Southwest classification reflects the geographic consensus across major reference sources. Core states appear in virtually every published definition. Sometimes-included states appear in some definitions but not others, typically due to overlapping regional identities (Texas with the South, Nevada with the West, Colorado with the Mountain West). southwest_score: 3 = universally recognized, 2 = frequently or sometimes included."

  sources:
    - name: "Encyclopaedia Britannica — Southwestern United States"
      url: "https://www.britannica.com/place/southwestern-United-States"
      description: "Britannica's definition of the Southwestern United States, covering the region's geographic boundaries, climate, and which states are consistently included"
