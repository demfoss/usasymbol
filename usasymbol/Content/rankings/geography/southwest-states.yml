faq:
  - question: "What states are in the Southwest?"
    answer: "Arizona and New Mexico are the only states in every definition of the Southwest. Texas, Nevada, Utah, and Colorado are frequently included. The Southwest has no Census definition — the Census groups Arizona, Colorado, Nevada, New Mexico, and Utah in the West, and Texas in the South."

  - question: "Is Texas in the Southwest?"
    answer: "Texas is frequently included in the Southwest, particularly based on West Texas — the El Paso area, Big Bend National Park, and the Trans-Pecos region. East Texas and the Gulf Coast are culturally Southern and are not Southwest. Some sources include the full state; others include only West Texas."

  - question: "Is Utah in the Southwest?"
    answer: "Utah is sometimes included in the Southwest. Southern Utah — home to Zion, Bryce Canyon, Capitol Reef, Canyonlands, and Arches national parks — matches Southwest terrain and culture. Northern Utah, including Salt Lake City and the Wasatch Front, is more commonly classified as Mountain West. Utah is a Census West state."

  - question: "Is Nevada in the Southwest?"
    answer: "Nevada is frequently included in the Southwest. Southern Nevada — Las Vegas, Lake Mead, and the Mojave Desert — is consistently classified as Southwest. Northern Nevada, including Reno and the Great Basin, is more often called the Mountain West or Great Basin region. Nevada is a Census West state."

  - question: "What is the largest Southwest state?"
    answer: "If Texas is included, it is by far the largest Southwest state at 268,596 square miles. If Texas is excluded, New Mexico (121,590 sq mi) is the largest by area, and Arizona (approximately 7.2 million residents) is the largest by population."

  - question: "What is the Southwest known for?"
    answer: "The core Southwest — Arizona (113,990 sq mi) and New Mexico (121,590 sq mi) — is known for the Sonoran and Chihuahuan deserts, the Grand Canyon, Monument Valley, and a tri-cultural heritage of Native American, Hispanic, and Anglo traditions. New Mexico has 23 federally recognized tribal nations; Arizona includes the Navajo Nation, the largest Native American nation by area in the United States."

