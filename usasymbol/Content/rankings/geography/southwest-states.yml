page:
  h1: "Southwest States"

  quick_answer:
    - "The Southwest usually includes two core states, plus four others that appear in some definitions but not all."
    - "Texas is the largest state on this list at 268,596 square miles. Utah is the smallest at 84,897 square miles."
    - "Most definitions center on the desert Southwest first, then add nearby states only for specific subregions such as West Texas or southern Utah."

  methodology: "Southwest status follows the source definitions cited below. Arizona and New Mexico are treated as core states, while Texas, Nevada, Utah, and Colorado are included only for the subregions named in the source descriptions."

