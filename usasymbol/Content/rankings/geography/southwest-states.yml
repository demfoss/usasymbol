sections:
  - id: "core-southwest-states"
    icon: "fa-solid fa-sun"
    style: "law-cards"
    title: "Core Southwest States"
    paragraphs:
      - "Arizona and New Mexico are the two states most consistently treated as the American Southwest. Arizona covers 113,990 sq mi, and New Mexico covers 121,590 sq mi."
    subsections:
      - subtitle: "Arizona"
        status: "Core"
        text: |
          **Area:** 113,990 sq mi
          **Rank:** 1
          **Population:** approximately 7.2 million

          Arizona is one of the two states that appears in every definition of the Southwest. The table notes point to Phoenix, the Grand Canyon, the Sonoran Desert, and Monument Valley as the clearest markers of that identity.

          Few states match the standard image of the region as closely. Arizona sits at the center of most Southwest maps and rarely gets treated as an edge case.
      - subtitle: "New Mexico"
        status: "Core"
        text: |
          **Area:** 121,590 sq mi
          **Rank:** 2
          **Population:** approximately 2.1 million

          New Mexico is the other state that appears in every definition of the Southwest. Santa Fe, established in 1610, is the oldest state capital in the United States, and Albuquerque is the state's largest city.

          The table notes also point to 23 federally recognized tribal nations and an approximately 11 percent Native American population share. Those details help explain why New Mexico stays in the core of the region.

  - id: "often-included-southwest-states"
    icon: "fa-solid fa-mountain-sun"
    style: "law-cards"
    title: "Southwest States Often Included"
    paragraphs:
      - "Texas and Nevada are often included, but each one depends on a specific part of the state. Texas is the area outlier at 268,596 sq mi, while Nevada covers 110,572 sq mi."
    subsections:
      - subtitle: "Texas"
        status: "Frequently Included"
        text: |
          **Area:** 268,596 sq mi
          **Rank:** 3
          **Population:** approximately 29.1 million

          Texas is the largest state on the list by a wide margin, but its Southwest identity is uneven. The table notes tie that label to West Texas, especially El Paso, Big Bend, and the Trans Pecos region.

          That is why Texas lands in the frequently included group instead of the core. East Texas is described in the same notes as culturally Southern.
      - subtitle: "Nevada"
        status: "Frequently Included"
        text: |
          **Area:** 110,572 sq mi
          **Rank:** 4
          **Population:** approximately 3.1 million

          Nevada fits the Southwest most clearly in its southern half. The table notes single out Las Vegas, Lake Mead, and the Mojave Desert, with the Las Vegas metro listed at approximately 2.3 million residents.

          Northern Nevada points in another direction. Reno and the Great Basin are why the state is frequently included rather than universally treated as Southwest.

  - id: "sometimes-included-southwest-states"
    icon: "fa-solid fa-road"
    style: "law-cards"
    title: "Southwest States Sometimes Included"
    paragraphs:
      - "Utah at 84,897 sq mi and Colorado at 104,094 sq mi sit on the edge of the region in this table. Both entries point to southern terrain rather than the full state."
    subsections:
      - subtitle: "Utah"
        status: "Sometimes Included"
        text: |
          **Area:** 84,897 sq mi
          **Rank:** 5
          **Population:** approximately 3.3 million

          Utah enters Southwest definitions through its southern canyon country. The table notes name Zion, Bryce Canyon, Capitol Reef, Canyonlands, and Arches as the landscapes that place the state in this conversation.

          Northern Utah tells a different story. Salt Lake City and the Wasatch Front are more often grouped with the Mountain West, which keeps Utah in the sometimes included tier.
      - subtitle: "Colorado"
        status: "Sometimes Included"
        text: |
          **Area:** 104,094 sq mi
          **Rank:** 6
          **Population:** approximately 5.8 million

          Colorado makes the list through its southwestern corner rather than the whole state. The table notes name Mesa Verde, Durango, and the Four Corners area as the places most closely tied to the Southwest.

          The Front Range pulls the state the other way. Denver, Boulder, and Fort Collins are noted as Mountain West, which is why Colorado stays in the sometimes included group.

