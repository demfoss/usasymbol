sections:
  - id: "lowest-point-in-the-us"
    icon: "fa-solid fa-mountain"
    title: "Lowest Point in the U.S."
    paragraphs:
      - "California holds the lowest ground in the country. Badwater Basin in Death Valley sits 282 feet below sea level, yet Mount Whitney, the tallest peak in the lower 48, stands within 90 miles of it. The valley floor dropped as the crust stretched and cracked while the mountains on both sides rose."
      - "Rain and snowmelt that drain in have no outlet to the sea. Water collects on the basin floor, evaporates in the desert heat, and leaves the glaring white salt flats. Death Valley is also where the [record high temperature](/rankings/geography/record-high-temperature-by-state) of 134°F was measured."

  - id: "states-below-sea-level"
    icon: "fa-solid fa-water"
    title: "States Below Sea Level"
    paragraphs:
      - "Louisiana is the only state besides California with ground below sea level. New Orleans drops to 8 feet below, because the city grew outward from the Mississippi's natural levee into swamps that were drained with pumps. The soil dried, compacted, and sank."
      - "Levees and pumping stations now keep the water out, and Hurricane Katrina in 2005 showed what happens when levees fail. The whole state spans just 543 feet, from New Orleans up to Driskill Mountain, the third-lowest summit in the [highest point in each state](/rankings/geography/highest-point-by-state) list."

  - id: "states-with-the-highest-low-points"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Highest Low Points"
    paragraphs:
      - "Colorado's lowest ground is 3,315 feet, where the Arikaree River crosses into Kansas. That is higher than the highest point in Florida or Louisiana. Wyoming follows at 3,099 feet along the Belle Fourche River, so both states lie entirely above 3,000 feet."
      - "Rockies and high plateaus raise the whole landscape, so rivers leave these states already at altitude. New Mexico's lowest point is Red Bluff Reservoir on the Pecos River, and Utah's is Beaver Dam Wash near the Arizona border."
