  description: "Death Valley's Badwater Basin is the lowest point in the U.S., 282 feet below sea level. Louisiana's New Orleans is the only other point below it."

page:
  h1: "Lowest Point by State"

  quick_answer:
    - "Lowest point by state bottoms out in California, where Badwater Basin in Death Valley sits 282 feet below sea level. The valley floor dropped as the crust stretched and cracked while the mountains around it rose."
    - "Louisiana is the only other state with ground below sea level, 8 feet down in New Orleans. The city spread into swamps that were drained by pumps, and the soil sank as it dried out."
    - "Colorado has the highest low point at 3,315 feet, where the Arikaree River leaves for Kansas. Its lowest ground stands higher than any point in Florida or Louisiana."

  methodology: "USGS, Elevations and Distances in the United States. Lowest point means the lowest natural elevation inside the state border, with sea level counted as 0 feet. Louisiana's figure is for the New Orleans area. States tied at sea level share a rank."

