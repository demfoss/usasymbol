faq:
  - question: "What is the lowest point in the United States?"
    answer: "Badwater Basin in Death Valley National Park, California, at 282 feet below sea level. It is also the lowest point in North America."

  - question: "What is the lowest point in Louisiana?"
    answer: "New Orleans, at 8 feet below sea level. Parts of the city sit lower than the Mississippi River and Lake Pontchartrain, which is why it depends on levees and pumps."

  - question: "Which state has the highest lowest point?"
    answer: "Colorado, followed by Wyoming at 3,099 feet. Kansas, Colorado's neighbor to the east, drops to 679 feet where the Verdigris River leaves the state."

  - question: "Which states have a lowest point at sea level?"
    answer: "Twenty-two states list sea level, 0 feet. Most touch the Atlantic, the Gulf of Mexico, or the Pacific, while Pennsylvania reaches sea level along the tidal Delaware River."

  - question: "What is the lowest point in Michigan?"
    answer: "Lake Erie, at 571 feet. The lowest points of Wisconsin (Lake Michigan, 579 feet) and Minnesota (Lake Superior, 601 feet) are also lake surfaces."

  - question: "What is the lowest point in Arizona?"
    answer: "The Colorado River near Yuma, at 70 feet, where it leaves the state for Mexico. A state famous for plateaus and peaks bottoms out in a desert river valley."

