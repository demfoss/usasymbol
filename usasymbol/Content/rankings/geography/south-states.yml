faq:
  - question: "What states are in the South?"
    answer: "Sixteen states make up the Census South: Alabama, Arkansas, Delaware, Florida, Georgia, Kentucky, Louisiana, Maryland, Mississippi, North Carolina, Oklahoma, South Carolina, Tennessee, Texas, Virginia, and West Virginia. The Census divides these into three divisions: South Atlantic, East South Central, and West South Central."

  - question: "How many Southern states are there?"
    answer: "There are 16 states in the Census South, making it the largest of the four Census regions by number of states. The 16 states also make the South the most populous Census region, led by Texas at approximately 29.1 million residents and Florida at approximately 21.5 million."

  - question: "Is Delaware a Southern state?"
    answer: "By Census definition, yes — Delaware is in the South Atlantic division of the Census South. However, Delaware did not secede during the Civil War, maintained slavery but remained in the Union, and is economically and culturally integrated with Philadelphia and the Mid-Atlantic corridor. Most non-Census geographic sources consider Delaware a Mid-Atlantic state."

  - question: "Is West Virginia a Southern state?"
    answer: "By Census definition, yes — West Virginia is in the South Atlantic division. However, West Virginia formed specifically by refusing to secede from the Union in 1863, separating from Virginia at the start of the Civil War. Its Appalachian culture, terrain, and economy differ significantly from the core South. Many geographic references group West Virginia with Appalachian or Mid-Atlantic states."

  - question: "What is the largest Southern state?"
    answer: "Texas is the largest Southern state by both area (268,596 sq mi) and population (approximately 29.1 million). Texas is the second-largest state in the United States after Alaska, and is more than four times the area of Florida (65,758 sq mi), the second-largest Southern state."

  - question: "What is the smallest Southern state?"
    answer: "Delaware is the smallest Southern state by area at 2,489 square miles, and also the least populous Southern state at approximately 990,000 residents. Delaware is one of the two most contested Census South states alongside West Virginia."

