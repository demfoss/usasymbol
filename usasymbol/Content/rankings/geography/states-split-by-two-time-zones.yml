faq:
  - question: "How many states are split by two time zones"
    answer: "14 U.S. states are officially split by federal time zone boundaries. If you count Arizona — where the Navajo Nation observes DST while the rest of the state does not — the practical total is 15."

  - question: "Which states are split between Eastern and Central time"
    answer: "Five states straddle Eastern and Central time: Florida (panhandle counties west of the Apalachicola River), Indiana (select counties near Evansville and Chicago), Kentucky (western counties near the Mississippi River), Michigan (Gogebic and Ironwood counties in the Upper Peninsula), and Tennessee (West Tennessee counties west of the Tennessee River, including Memphis)."

  - question: "Which states are split between Central and Mountain time"
    answer: "Five states are split between Central and Mountain time: Kansas (Sherman and Wallace counties), Nebraska (western panhandle counties), North Dakota (southwestern counties), South Dakota (Black Hills region and western counties), and Texas (El Paso and Hudspeth counties)."

  - question: "Which states are split between Pacific and Mountain time"
    answer: "Three states are split between Pacific and Mountain time: Idaho (northern panhandle uses Pacific, rest of state uses Mountain), Nevada (West Wendover and Jackpot use Mountain, rest of state uses Pacific), and Oregon (Malheur County in the southeast corner uses Mountain)."

  - question: "Why is El Paso in a different time zone from the rest of Texas"
    answer: "El Paso and Hudspeth County use Mountain Time because they are geographically closer to New Mexico, Colorado, and the Mountain West than to the rest of Texas. El Paso sits nearer to Los Angeles than to Houston and shares a metropolitan area with Ciudad Juárez, Mexico, which also runs Mountain Time. The DOT drew the boundary to match the city's actual commercial and geographic orientation."

  - question: "Why is Arizona counted differently from the other split states"
    answer: "Arizona doesn't observe Daylight Saving Time, keeping most of the state on MST year-round. The Navajo Nation, a federally recognized tribal nation within Arizona, does observe DST by its own decision. This creates a seasonal one-hour gap between Navajo land and surrounding Arizona during summer months. The Hopi Reservation, entirely enclosed by the Navajo Nation, does not observe DST — so summer travelers crossing reservations can move through three effective clock settings without leaving the state."

  - question: "Why is northern Idaho in Pacific Time instead of Mountain"
    answer: "The northern Idaho panhandle uses Pacific Time because its economy and daily life orbit Spokane, Washington, which runs Pacific. The Department of Transportation draws time zone lines based on commerce and community alignment, not just longitude. Because Coeur d'Alene and Sandpoint residents commute to and trade with Spokane, the federal government placed the panhandle in Spokane's time zone."

  - question: "Is Michigan in one time zone or two"
    answer: "Michigan is officially in two time zones. The entire Lower Peninsula and most of the Upper Peninsula use Eastern Time. Two Upper Peninsula counties — Gogebic and Ironwood — use Central Time, reflecting their commercial ties to Wisconsin rather than to the rest of Michigan."

  - question: "What is the difference between 14 and 15 states split by time zones"
    answer: "14 is the count of states where an official federal boundary line physically divides the state into two time zones. 15 includes Arizona, where no federal boundary line exists, but the Navajo Nation's choice to observe DST creates a seasonal one-hour difference within state borders. Both are correct — it depends whether you're counting federal boundary lines or different clocks."

