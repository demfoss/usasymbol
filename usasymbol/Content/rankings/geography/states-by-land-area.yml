sections:
  - id: "alaska-size-comparison"
    icon: "fa-solid fa-globe"
    title: "How Big Is Alaska Really?"
    paragraphs:
      - "Alaska's 570,641 square miles of land area is difficult to visualize without comparison. If Alaska were a country, it would rank 17th in the world by land area - larger than France, Spain, and Germany combined. You could fit 425 Rhode Islands inside Alaska. The state is so massive that it spans four time zones, though only two are currently used (Alaska Time and Hawaii-Aleutian Time for the Aleutian Islands)."
      - "Alaska is more than twice the size of Texas, which sits at 261,914 square miles. In fact, Alaska is larger than the next three largest states combined - Texas, California, and Montana total 563,425 square miles together, still less than Alaska alone. If you could drive straight across Alaska at highway speeds without stopping, it would take approximately 20 hours to cross the state from east to west."
      - "Alaska's population density — 1.3 people per square mile, the lowest of any U.S. state — tells you what the size actually means on the ground. At 733,000 residents across 570,641 square miles, entire regions exist with no roads, no towns, no year-round human presence. The state contains 17 of the 20 highest peaks in the United States (including the [hardest state high points](/rankings/geography/highest-point-by-state) to climb), more than 100,000 glaciers, and over 3 million lakes."

  - id: "smallest-states"
    icon: "fa-solid fa-compress"
    title: "The Tiny Five: America's Smallest States"
    paragraphs:
      - "The five smallest U.S. states by land area - Rhode Island, Delaware, Connecticut, New Jersey, and New Hampshire - combined total only 24,132 square miles. This is less land than West Virginia (24,230 sq mi) occupies alone. Maryland, at rank 42 with just 9,707 square miles of land, has more land area than Rhode Island and Delaware combined."
      - "Rhode Island earned its nickname 'Little Rhody' honestly - at 1,034 square miles, you can drive from one end to the other in about an hour. Yet Rhode Island has a population of over 1 million people, giving it a population density higher than all but two other states. Delaware, the second smallest at 1,949 square miles, was the first state to ratify the U.S. Constitution in 1787 — earning 'The First State' as an official nickname that punches well above its land area."
      - "New Jersey has the highest population density of any state at over 1,200 people per square mile — in 7,354 square miles, it fits 9.3 million residents. Connecticut and New Hampshire are two of the wealthiest states per capita in the country. Four of the five smallest states rank in the top 15 for GDP per capita, which suggests that in the American economy, density compensates for acreage."

  - id: "water-vs-land"
    icon: "fa-solid fa-water"
    title: "Land Area vs Total Area: When Water Changes the Rankings"
    paragraphs:
      - "Michigan presents one of the most dramatic differences between land and total area of any U.S. state. With just 56,539 square miles of land, Michigan ranks 11th. But when you include water area, Michigan's total jumps to 96,714 square miles, moving it up to 11th place overall. The Great Lakes give Michigan over 40,175 square miles of water - more water area than the entire land area of Ohio, Indiana, or Kentucky."
      - "Florida tells a similar story. Its 53,625 square miles of land ranks 22nd, but Florida contains 12,133 square miles of water from the Atlantic Ocean, Gulf of Mexico, and countless lakes, rivers, and wetlands. Alaska has even more dramatic water numbers - 92,627 square miles of water area from its extensive coastline, but this barely impacts its ranking since its land area is so massive. Hawaii has the highest percentage of water relative to total area, with 4,509 square miles of water compared to just 6,423 square miles of land."
      - "The re-rankings are most dramatic in the Great Lakes region. Michigan's 40,175 square miles of Great Lakes water nearly doubles its total area, vaulting it past states with significantly more dry land. Louisiana's coastal wetlands and Florida's estuaries add thousands of square miles that never appear in a land-area ranking. These aren't statistical footnotes — they map directly onto how each state earns its living. A Michigan or Minnesota organizes its entire economy around water access in ways that landlocked Colorado or Kansas never will."

  - id: "eastern-vs-western"
    icon: "fa-solid fa-map-marked-alt"
    title: "Why Western States Are So Much Larger Than Eastern States"
    paragraphs:
      - "The size gap between eastern and western states is one of the most striking patterns in American geography. All 10 of the largest states are west of the Mississippi River — including Alaska, which sits entirely outside the contiguous 48. All 10 of the smallest states are in the East, concentrated in New England and the Mid-Atlantic."
      - "This size difference reflects America's historical development. The original 13 colonies were carved out when land seemed scarce and populations were concentrated along the Atlantic coast. States like Rhode Island and Connecticut were drawn with precise boundaries negotiated between colonial powers. As America expanded westward, vast territories were available. Western states were organized with less concern for compact size — surveyors often drew straight lines along latitude and longitude rather than following natural features. The East-West divide extends beyond square mileage to elevation: see [state high points ranked by difficulty](/rankings/geography/highest-point-by-state) to understand just how much higher the West rises above the East."
      - "The Louisiana Purchase of 1803 and Mexican Cession of 1848 added enormous territories that became today's large western states. With fewer people and abundant land, there was no pressure to create small states. Colorado, Wyoming, Utah, and New Mexico have nearly rectangular shapes because surveyors simply used lines of latitude and longitude. This contrast between eastern and western state sizes affects everything from political representation to resource management. Wyoming, with just 577,000 people spread across 97,000 square miles, faces very different challenges than New Jersey, with 9.3 million people in only 7,354 square miles."

