          state_slug: "delaware"
          land_sq_mi: 1949
        - rank: 50
          state: "Rhode Island"
          state_slug: "rhode-island"
          land_sq_mi: 1034
    paragraphs:
      - "The five smallest U.S. states — Rhode Island, Delaware, Connecticut, New Jersey, and New Hampshire — combined total only 24,132 square miles, less land than West Virginia (24,038 sq mi) occupies alone. Rhode Island, at 1,034 square miles, can be driven end-to-end in about an hour, yet it has a population density higher than all but two other states."
      - "New Jersey is the most densely populated state in the country, fitting 9.3 million residents into 7,354 square miles. Delaware was the first state to ratify the U.S. Constitution in 1787 — a landmark that punches well above its 1,949 square miles. Four of the five smallest states rank among the top 15 for GDP per capita."

  - id: "square-miles"
    icon: "fa-solid fa-ruler-combined"
    title: "U.S. States by Size in Square Miles"
    paragraphs:
      - "All 50 states are ranked here by land area in square miles — the Census Bureau standard for comparing state sizes. Land area means dry ground only: rivers, lakes, reservoirs, and coastal waters are excluded. Square kilometers are shown alongside. To sort by total area or water area instead, use the column headers in the main table."

  - id: "land-vs-total-area"
    icon: "fa-solid fa-water"
    title: "Land Area vs. Total Area"
    table:
      columns:
        state: "State"
        land_rank: "Land area rank"
        total_rank: "Total area rank"
        note: "Why it changes"
      rows:
        - state: "Alaska"
          state_slug: "alaska"
          land_rank: 1
          total_rank: 1
          note: "92,627 sq mi of water — rank unchanged because land area is dominant"
        - state: "Michigan"
          state_slug: "michigan"
          land_rank: 22
          total_rank: 11
          note: "40,175 sq mi of Great Lakes nearly doubles its total area"
        - state: "Florida"
          state_slug: "florida"
          land_rank: 26
          total_rank: 22
          note: "12,133 sq mi of coastal waters and wetlands"
        - state: "Hawaii"
          state_slug: "hawaii"
          land_rank: 47
          total_rank: 43
          note: "4,509 sq mi of ocean water lifts total area above Connecticut"
        - state: "Rhode Island"
          state_slug: "rhode-island"
          land_rank: 50
          total_rank: 50
          note: "Still the smallest state by both measures"
    paragraphs:
      - "Land area counts only the solid ground within a state's boundaries. Total area adds all water bodies — lakes, rivers, reservoirs, and coastal waters within state lines. For most states the difference is small, but a few look very different depending on which number you use. Michigan ranks 22nd by land area (56,539 sq mi) but 11th by total area (96,714 sq mi) because the Great Lakes add more than 40,000 square miles of water. Florida, Louisiana, and Hawaii all shift several places when water is included. This page uses land area as the primary ranking metric, which is the Census Bureau standard for comparing state sizes."

faq:
  - question: "What is the largest state in the U.S.?"
    answer: "Alaska is the largest U.S. state by land area, with 570,641 square miles (1,477,953 km²). It is more than twice the size of Texas, the second-largest state."

  - question: "What are the biggest states in the U.S.?"
    answer: "The five largest U.S. states by land area are Alaska (570,641 sq mi), Texas (261,914 sq mi), California (155,959 sq mi), Montana (145,552 sq mi), and New Mexico (121,298 sq mi). Texas is the largest state in the contiguous United States."

  - question: "What is the smallest state in the U.S.?"
    answer: "Rhode Island is the smallest U.S. state by land area, with 1,034 square miles (2,678 km²)."

  - question: "What are the smallest states in the U.S.?"
    answer: "The five smallest U.S. states by land area are Rhode Island (1,034 sq mi), Delaware (1,949 sq mi), Connecticut (4,842 sq mi), New Jersey (7,354 sq mi), and New Hampshire (8,953 sq mi)."

  - question: "What are the U.S. states by size in square miles?"
    answer: "The main table on this page ranks all 50 states by land area in square miles, from Alaska (570,641 sq mi) at #1 to Rhode Island (1,034 sq mi) at #50. Land area excludes water bodies."

  - question: "Is state size measured by land area or total area?"
    answer: "This page ranks states by land area, which counts only solid ground and excludes lakes, rivers, and coastal waters. Total area includes both land and water. The two measures produce different rankings for water-heavy states like Michigan and Florida."

  - question: "What are U.S. states by area, ranked?"
    answer: "Ranked by land area, the largest U.S. states are Alaska (570,641 sq mi), Texas (261,914 sq mi), California (155,959 sq mi), Montana (145,552 sq mi), and New Mexico (121,298 sq mi). The smallest are Rhode Island (1,034 sq mi), Delaware (1,949 sq mi), and Connecticut (4,842 sq mi). The full ranking of all 50 states by area is in the table above."

  - question: "What are the U.S. states ranked by size?"
    answer: "By land area, Alaska is #1 (570,641 sq mi), followed by Texas (#2, 261,914 sq mi), California (#3, 155,959 sq mi), Montana (#4, 145,552 sq mi), and New Mexico (#5, 121,298 sq mi). Rhode Island is #50 and the smallest state. The complete size ranking of all 50 states appears in the table on this page."

  - question: "What are the sizes of U.S. states in square miles?"
    answer: "U.S. state sizes in square miles range from Alaska at 570,641 sq mi down to Rhode Island at 1,034 sq mi. The full table above lists all 50 states with their land area in square miles (sq mi) and square kilometers (km²). Land area figures are from the U.S. Census Bureau and exclude water bodies."

