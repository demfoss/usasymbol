  - id: "largest-states"
    icon: "fa-solid fa-mountain"
    title: "Largest States in the U.S."
    table:
      columns:
        rank: "Rank"
        state: "State"
        land_sq_mi: "Land area (sq mi)"
      rows:
        - rank: 1
