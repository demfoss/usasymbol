faq:
  - question: "What is the largest state by land area?"
    answer: "Alaska is the largest U.S. state by land area with 570,641 square miles. It's more than twice the size of Texas, the second-largest state, and larger than Texas, California, and Montana combined."
  
  - question: "What is the smallest state by land area?"
    answer: "Rhode Island is the smallest U.S. state by land area with only 1,034 square miles. Despite its small size, Rhode Island has a high population density as part of the densely populated Northeast corridor."
  
  - question: "How does land area differ from total area?"
    answer: "Land area measures only the dry ground of a state, while total area includes both land and water (lakes, rivers, coastal waters). For example, Michigan has 56,539 square miles of land but 96,714 square miles of total area due to the Great Lakes."
  
  - question: "What are the top 5 largest states by land area?"
    answer: "The five largest U.S. states by land area are: 1) Alaska (570,641 sq mi), 2) Texas (261,914 sq mi), 3) California (155,959 sq mi), 4) Montana (145,552 sq mi), and 5) New Mexico (121,298 sq mi)."
  
  - question: "What are the 5 smallest states by land area?"
    answer: "The five smallest U.S. states by land area are: 1) Rhode Island (1,034 sq mi), 2) Delaware (1,949 sq mi), 3) Connecticut (4,842 sq mi), 4) New Jersey (7,354 sq mi), and 5) New Hampshire (8,953 sq mi). Combined, these states total only 24,132 square miles."
  
  - question: "Which state has the most water area?"
    answer: "Michigan has the most water area of any U.S. state with 40,175 square miles, primarily due to its extensive Great Lakes coastline. Alaska ranks second with 92,627 square miles of water, but has far more land area overall."
  
  - question: "How much larger is Alaska than Texas?"
    answer: "Alaska's land area (570,641 sq mi) is more than twice the size of Texas (261,914 sq mi). You could fit Texas into Alaska 2.18 times. Alaska is also larger than the next three largest states (Texas, California, and Montana) combined."
  
  - question: "What is the difference between land area and total area for US states?"
    answer: "Land area measures only the solid ground within a state's boundaries, excluding all water bodies. Total area includes both land and water such as lakes, rivers, reservoirs, and coastal waters. States with extensive coastlines or major lakes like Michigan, Alaska, and Florida show significant differences between their land and total area measurements."

