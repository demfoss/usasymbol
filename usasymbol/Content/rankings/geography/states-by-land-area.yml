          land_sq_mi: 145552
        - rank: 5
          state: "New Mexico"
          state_slug: "new-mexico"
          land_sq_mi: 121298
        - rank: 6
          state: "Arizona"
          state_slug: "arizona"
          land_sq_mi: 113594
        - rank: 7
          state: "Nevada"
          state_slug: "nevada"
          land_sq_mi: 109781
        - rank: 8
          state: "Colorado"
          state_slug: "colorado"
          land_sq_mi: 103642
        - rank: 9
          state: "Wyoming"
          state_slug: "wyoming"
          land_sq_mi: 97093
        - rank: 10
          state: "Oregon"
          state_slug: "oregon"
          land_sq_mi: 95988
    paragraphs:
      - "The five largest U.S. states — Alaska, Texas, California, Montana, and New Mexico — account for more than half of all U.S. land area combined. Alaska alone covers 570,641 square miles, more than twice the size of Texas (261,914 sq mi). Texas is the largest state in the contiguous United States; it would take more than 425 Rhode Islands to fill Alaska. Size does not always mean more borders, though — Texas has only four neighboring states, as shown in the [states with the most neighboring states](/rankings/geography/states-neighboring-states) ranking."
      - "Alaska is so large that if it were a country, it would rank 17th in the world by land area — bigger than France, Spain, and Germany combined. Wyoming and Oregon, which close out the top 10, are each larger than any state east of the Mississippi River."

