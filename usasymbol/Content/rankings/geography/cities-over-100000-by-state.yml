faq:
  - question: "Which state has the most cities over 100,000?"
    answer: "California has the most with 76. Its large population is divided among many cities across several major metropolitan regions."
  - question: "How many cities over 100,000 are in Texas?"
    answer: "Texas has 44 cities with at least 100,000 residents. Houston is the largest at 2,397,315."
  - question: "Which states have no city over 100,000?"
    answer: "Delaware, Maine, Vermont, West Virginia, and Wyoming have no city above 100,000. Wilmington is the largest city in that group at 73,512."
  - question: "How many California cities have over 100,000 people?"
    answer: "California has 76 cities over 100,000. Los Angeles leads the state with 3,869,089 residents."
  - question: "Does Hawaii have a city over 100,000?"
    answer: "Hawaii has one place above 100,000. Urban Honolulu has 341,868 residents and is treated as a city equivalent in the national places table."

