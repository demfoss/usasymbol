        - { rank: 4, state: "Arizona", state_slug: "arizona", city_count: 14 }
        - { rank: 5, state: "Colorado", state_slug: "colorado", city_count: 13 }
      paragraphs:
        - "California has 76 cities above 100,000 because its population is spread across many separately governed communities in the Los Angeles region, Bay Area, Inland Empire, Central Valley, and San Diego County. Los Angeles is the largest at 3,869,089."
        - "Texas follows with 44, including large suburban cities around Dallas, Houston, Austin, and San Antonio. Florida ranks third with 26, and Jacksonville leads that state at 1,017,689 residents."
