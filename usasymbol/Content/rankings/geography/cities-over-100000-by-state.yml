page:
  h1: "Cities Over 100,000 by State"
  quick_answer:
    - "Cities over 100,000 by state are most numerous in California, which has 76. Multiple large metros and separate suburban cities create the country's deepest urban roster."
    - "Delaware, Maine, Vermont, West Virginia, and Wyoming have no city above 100,000. Wilmington is the largest among those five at 73,512 residents."
    - "Texas ranks second with 44 cities over 100,000, followed by Florida with 26. Fast-growing suburbs add to both states' large-city totals."
  methodology: "Census Vintage 2025 estimates count incorporated places and other city equivalents in the official places table with at least 100,000 residents on July 1, 2025. Washington, D.C. is excluded."
