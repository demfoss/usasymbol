sections:
  - id: "why-florida-gets-the-least-snow"
    icon: "fa-solid fa-sun"
    title: "Why Florida Gets the Least Snow"
    paragraphs:
      - "Florida averages 0 snow days and 0.0 inches of snowfall a year, tied with Hawaii for the least in the country. The peninsula reaches farther south than any other part of the lower 48, and warm water from the Gulf of Mexico and the Atlantic wraps around it on three sides."
      - "Arctic cold fronts lose much of their chill crossing hundreds of miles of land before they arrive, and the air behind them is usually dry. Snow needs cold air and moisture at the same moment, a rare match this far south. Flurries did reach the Miami area on January 19, 1977, the only time snow is known to have fallen there."

  - id: "does-every-state-get-snow"
    icon: "fa-solid fa-snowflake"
    title: "Does Every U.S. State Get Snow?"
    paragraphs:
      - "Hawaii averages 0 snow days, yet snow falls on the summits of Mauna Kea and Mauna Loa in most winters. Both volcanoes rise above 13,000 feet, high enough to freeze even in the tropics, and Mauna Kea is the [highest point in Hawaii](/rankings/geography/highest-point-by-state)."
      - "Texas, California, and Arizona post low statewide numbers of 2 to 4 snow days, but each hides a snowy corner. The Sierra Nevada in California builds a deep snowpack most winters, and Flagstaff, Arizona, sits at nearly 7,000 feet, where snow is common. Winter storms off the Great Plains regularly hit the Texas Panhandle."

  - id: "states-with-the-most-snow-days"
    icon: "fa-solid fa-mountain"
    title: "States With the Most Snow Days"
    paragraphs:
      - "Alaska averages 60 snow days a year, 20 more than second-place Maine at 40. Much of Alaska lies near or above the Arctic Circle, where winter sunlight lasts only a few hours and the ground stays frozen for months."
      - "Vermont records more snowfall than Alaska, 89.3 inches against 74.5. Interior Alaska is so cold that its air holds little moisture, so snow falls often but in light amounts. Lake-effect storms push Michigan and New York into the top five, part of the [Snow Belt states](/rankings/geography/snow-belt-states) that ring the Great Lakes."
