faq:
  - question: "What is the coldest temperature ever recorded in the United States?"
    answer: "Alaska holds it at -80°F, more than ten degrees below any other state. The lower 48 record is Montana's -70°F."

  - question: "What is the coldest temperature ever recorded in Minnesota?"
    answer: "-60°F at Tower on February 2, 1996, a small town in the northeastern part of the state. Wisconsin's own record of -55°F at Couderay was set two days later in the same cold wave."

  - question: "What is the coldest temperature ever recorded in Texas?"
    answer: "-23°F at Seminole on February 8, 1933, on the open plains of the western part of the state."

  - question: "Has it ever been below zero in Florida?"
    answer: "Once on record. Tallahassee dropped to -2°F on February 13, 1899. The city sits in the Panhandle, far from the warm coastal waters that protect the peninsula."

  - question: "Which state has the highest record low temperature?"
    answer: "Hawaii, at 12°F. Florida is next, with a record low of -2°F, and then Louisiana at -16°F."

  - question: "What is the coldest temperature ever recorded in Illinois?"
    answer: "-38°F at Mount Carroll on January 31, 2019, during the polar vortex outbreak that swept the Midwest."

