sections:
  - id: "coldest-temperature-ever-recorded-in-the-us"
    icon: "fa-solid fa-snowflake"
    title: "Coldest Temperature Ever Recorded in the U.S."
    paragraphs:
      - "Prospect Creek, Alaska, reached -80°F on January 23, 1971. The camp was built to house workers on the Trans-Alaska Pipeline and sits in the Brooks Range north of the Arctic Circle. The winter sun barely clears the horizon there, and heavy cold air flows downhill into the valley and stays."
      - "No other state comes closer than ten degrees. Montana's record is -70°F, and the next-coldest records of the lower 48 belong to mountain states. Compare these extremes with the everyday averages in the [coldest states in the U.S.](/rankings/geography/coldest-states-in-the-us)."

  - id: "record-low-temperature-in-the-lower-48"
    icon: "fa-solid fa-temperature-arrow-down"
    title: "Record Low Temperature in the Lower 48"
    paragraphs:
      - "Montana's -70°F at Rogers Pass in January 1954 is the lowest reading south of Canada. Utah follows at -69°F in Peter Sinks, a bowl in the Bear River Range where cold air drains in and cannot escape on a calm, clear night."
      - "A single cold wave in early February 1996 set records in Minnesota (Tower), Wisconsin (Couderay), and Iowa (Elkader) within three days. South Dakota and Nebraska set theirs on the same day, December 22, 1989."
    table:
      columns:
        state: "State"
