  - id: "states-with-the-warmest-record-lows"
    icon: "fa-solid fa-sun"
    title: "States With the Warmest Record Lows"
    paragraphs:
      - "Hawaii's 12°F came at the Mauna Kea Observatories, near a summit that stands above 13,000 feet. Mauna Kea means white mountain in Hawaiian, and snow does fall there, even though the islands below are among the [states with no snow](/rankings/geography/states-with-no-snow) at sea level."
      - "Florida's -2°F in Tallahassee and Louisiana's -16°F in Minden were both set on February 13, 1899, during one of the strongest Arctic outbreaks ever to reach the Gulf Coast. Georgia and Delaware share the next record, -17°F."

