  description: "Alaska's -80°F at Prospect Creek in 1971 is the coldest temperature ever recorded in the U.S. Hawaii's 12°F is the warmest state record low."

page:
  h1: "Record Low Temperature by State"

  quick_answer:
    - "Record low temperature by state bottoms out in Alaska at -80°F, measured at Prospect Creek on January 23, 1971. The site was a pipeline construction camp in the Brooks Range, where cold air drains into the valleys."
    - "Montana holds the lowest record in the lower 48 at -70°F, set at Rogers Pass on the Continental Divide in 1954. Cold air slides down the surrounding slopes and pools in the pass."
    - "Hawaii is the only state whose record low is above zero. Its 12°F came high on Mauna Kea, more than 13,000 feet above the Pacific. Florida's -2°F in Tallahassee in 1899 is the mildest record on the mainland."

  methodology: "Official all-time state minimum temperatures from NOAA's State Climate Extremes Committee, as compiled on Wikipedia, with Hawaii at NOAA's 12°F reading of May 17, 1979. Where a record has been tied, the most recent date and place are shown."

  sources:
