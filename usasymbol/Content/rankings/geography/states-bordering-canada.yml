faq:
  - question: "How many U.S. states border Canada?"
    answer: "13 U.S. states border Canada: Alaska, Washington, Idaho, Montana, North Dakota, Minnesota, Michigan, Ohio, Pennsylvania, New York, Vermont, New Hampshire, and Maine. Three of them — Michigan, Ohio, and Pennsylvania — share only a water border through the Great Lakes, with no land crossing into Canada."

  - question: "Name one state that borders Canada"
    answer: "Any of the 13 qualifying states is a correct answer: Maine, New Hampshire, Vermont, New York, Pennsylvania, Ohio, Michigan, Minnesota, North Dakota, Montana, Idaho, Washington, or Alaska. This is a common U.S. civics study question. Maine (611 mi) and Michigan (721 mi) are the most-cited answers, having the longest land and water borders respectively among the contiguous states."

  - question: "Which state has the longest border with Canada?"
    answer: "Alaska has the longest border with Canada at 1,538 miles, more than double Maine's 611-mile border, which is the longest among the contiguous 48 states. Alaska's boundary runs along the 141st meridian through Yukon Territory, then follows mountain ridges southeast through the panhandle along British Columbia."

  - question: "Which state has the shortest border with Canada?"
    answer: "Pennsylvania has the shortest U.S.-Canada border at approximately 42 miles, a Lake Erie water boundary at the state's northwest corner near Erie, PA. Idaho (45 miles) and New Hampshire (58 miles) rank second and third shortest."

  - question: "Does Ohio border Canada?"
    answer: "Yes. Ohio shares a 146-mile water border with Canada via Lake Erie. The international boundary runs along the centerline of Lake Erie, with Ontario on the north side and Ohio on the south. There is no land border between Ohio and Canada — all crossings between Ohio and Ontario go through Michigan."

  - question: "What Canadian provinces and territories border U.S. states?"
    answer: "Eight Canadian provinces and territories share a border with U.S. states: Yukon (Alaska), British Columbia (Alaska, Washington, Idaho, Montana), Alberta (Montana), Saskatchewan (Montana, North Dakota), Manitoba (North Dakota, Minnesota), Ontario (Minnesota, Michigan, Ohio, Pennsylvania, New York), Quebec (New York, Vermont, New Hampshire, Maine), and New Brunswick (Maine)."

