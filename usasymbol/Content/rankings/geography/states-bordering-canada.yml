page:
  h1: "US States That Border Canada"

  quick_answer:
    - "13 U.S. states border Canada. Alaska has the longest border at 1,538 miles. Pennsylvania has the shortest at 42 miles, a Lake Erie water boundary at the state's northwest corner."
    - "Michigan's 721-mile water border via the Great Lakes and connecting rivers is longer than Washington's 427-mile land border with British Columbia, making Michigan the second-longest border state even without a single land crossing into Canada."
    - "Maine has the longest land border with Canada among the contiguous 48 states at 611 miles, touching both Quebec to the northwest and New Brunswick to the northeast."

  methodology: "Border lengths are drawn from International Boundary Commission surveys and U.S. Census TIGER/Line boundary data. Water borders follow the international boundary centerline through the Great Lakes and connecting waterways (St. Marys River, St. Clair River, Detroit River, Niagara River, St. Lawrence River). All figures are approximate and rounded to the nearest mile."

  sources:
    - name: "International Boundary Commission"
      url: "https://www.internationalboundarycommission.org/"
      description: "Official U.S.-Canada joint body that surveys and maintains the international boundary"

