faq:
  - question: "Which state has the longest name?"
    answer: "Massachusetts, North Carolina, and South Carolina all have 13 letters, the most of any U.S. state. Spaces are not counted, so both Carolinas count as 13 letters, not 14 characters."

  - question: "Which state has the shortest name?"
    answer: "Iowa, Ohio, and Utah each have 4 letters — the fewest of any state. No U.S. state has a name shorter than 4 letters."

  - question: "How many letters are in Massachusetts?"
    answer: "Massachusetts has 13 letters: M-a-s-s-a-c-h-u-s-e-t-t-s. It ties with North Carolina and South Carolina for the longest state name."

  - question: "How many letters are in North Carolina?"
    answer: "North Carolina has 13 letters — 5 in 'North' and 8 in 'Carolina.' The space between the two words is not counted."

  - question: "Do spaces count in state name length?"
    answer: "No. Only letters are counted. Spaces are excluded. That is why North Carolina has 13 letters, not 14 characters, and New Hampshire has 12 letters, not 13."

  - question: "Which states have 4 letters?"
    answer: "Three states have 4-letter names: Iowa, Ohio, and Utah. They are the shortest state names in the United States."

  - question: "Which states have 13 letters?"
    answer: "Three states have 13-letter names: Massachusetts, North Carolina, and South Carolina. They are the longest state names in the United States."

  - question: "What is the most common number of letters in a state name?"
    answer: "Eight letters is the most common. Eleven states have 8-letter names: Arkansas, Colorado, Delaware, Illinois, Kentucky, Maryland, Michigan, Missouri, Nebraska, Oklahoma, and Virginia."

