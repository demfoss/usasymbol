page:
  h1: "Number of Letters in State Names"

  quick_answer:
    - "The number of letters in U.S. state names ranges from 4 to 13. Massachusetts, North Carolina, and South Carolina each have 13 letters — the most of any state. Iowa, Ohio, and Utah each have 4 letters — the fewest. Spaces are not counted; only letters are."
    - "Eight-letter names are the most common: eleven states share that length, including Arkansas, Illinois, Kentucky, Michigan, and Virginia. Three states tie at the top and three tie at the bottom."

  methodology: "Letter counts exclude spaces and punctuation. Only alphabetic characters are counted. North Carolina = 13 letters (5 in 'North' + 8 in 'Carolina'), not 14 characters. States with identical letter counts share the same rank."

  sources:
    - name: "U.S. Census Bureau — State Names and FIPS Codes"
      url: "https://www.census.gov/library/reference/code-lists/ansi/ansi-codes-for-states.html"
      description: "Official state names as used in federal data systems"
