faq:
  - question: "What is the tallest state capitol building?"
    answer: "The Louisiana State Capitol in Baton Rouge at 450 feet. It has 34 floors and was finished in 1932 under Governor Huey Long."
  - question: "Which state has the second tallest capitol?"
    answer: "Nebraska, at 400 feet. Architect Bertram Goodhue topped the Lincoln tower with a bronze statue called the Sower."
  - question: "How tall is the Texas State Capitol?"
    answer: "The Texas State Capitol in Austin is 311 feet tall, sixth in the table. It rises higher than the U.S. Capitol in Washington."
  - question: "What is the shortest state capitol in the United States?"
    answer: "Virginia's, at 83 feet in Richmond. Jefferson based the design on the Maison Carrée, a Roman temple in Nîmes, France."
  - question: "Which state capitol is a skyscraper?"
    answer: "Louisiana, Nebraska and Florida have towers and not domes as their main feature. Florida's 22-story capitol in Tallahassee was finished in 1977 and is 322 feet tall."
  - question: "Is the capitol the tallest building in its capital city?"
    answer: "Louisiana's tower is the tallest building in Baton Rouge. Many other capitols are passed by office towers, and the [state capital cities](/rankings/geography/states-capital-cities) page shows where each one sits."
