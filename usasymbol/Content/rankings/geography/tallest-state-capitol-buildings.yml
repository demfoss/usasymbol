  - id: domed-vs-skyscraper-state-capitols
    icon: "fa-solid fa-landmark-dome"
    title: "Domed vs Skyscraper State Capitols"
    paragraphs:
      - "Most capitols in the top ten are domed buildings copied from the U.S. Capitol, and the dome is what gives them height. Texas reaches 311 feet, taller than the U.S. Capitol in Washington, and its 1888 building of pink granite was paid for with three million acres of land."
      - "Florida went the other way. Its 22-story tower, finished in 1977, stands at 322 feet beside the old capitol and looks like an office block. Louisiana and Nebraska made the same break with the dome, which is why they top the list."
  - id: shortest-state-capitol-buildings
    icon: "fa-solid fa-landmark"
    title: "Shortest State Capitol Buildings"
    paragraphs:
      - "Virginia's capitol stands 83 feet and is the shortest in the table. Thomas Jefferson modeled it on a Roman temple in France, and it was finished in 1790, so it was designed as a temple and not as a dome-topped landmark. Arizona's 92 feet reflects the 1900 building, put up when Arizona was still a territory."
      - "North Carolina's 98 feet and Nevada's 112 come from low, wide buildings with no tall dome. Even the tallest capitols are usually passed by office towers, as the [tallest building in each state](/rankings/geography/tallest-building-by-state) list shows."
