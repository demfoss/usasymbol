sections:
  - id: why-louisiana-has-the-tallest-state-capitol
    icon: "fa-solid fa-building-columns"
    title: "Why Louisiana Has the Tallest Capitol"
    paragraphs:
      - "Louisiana's capitol is a 34-story tower in Baton Rouge, built between 1930 and 1932 for Governor Huey Long. Long wanted a monument to his administration and chose a skyscraper over the usual domed hall. He was shot inside the building in 1935 and is buried in the gardens out front."
      - "Nebraska finished its 400-foot tower the same year, 1932, and paid for it as construction went along with no borrowing. Both rose in the Depression years, when the skyscraper was the symbol of modern power."
