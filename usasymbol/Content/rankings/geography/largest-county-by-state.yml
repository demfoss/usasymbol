  quick_answer:
    - "Largest county by state rankings start with Alaska's Yukon-Koyukuk Census Area at 145,769.125 square miles. Its immense central Alaska territory has no county government."
    - "California's San Bernardino County ranks second at 20,068.167 square miles. It stretches across much of the Mojave Desert and is larger than New Jersey's land area."
    - "Providence County is Rhode Island's largest at 409.484 square miles, the smallest state-leading county in the country because Rhode Island itself is so compact."
  methodology: "The 2024 Census Gazetteer provides land area for counties and county equivalents. The table selects the largest in each state and includes Alaska census areas, Louisiana parishes, and Connecticut planning regions."
