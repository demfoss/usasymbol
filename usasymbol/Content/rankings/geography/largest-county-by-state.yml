faq:
  - question: "What is the largest county in the United States by land area?"
    answer: "Yukon-Koyukuk Census Area in Alaska is the largest county equivalent at 145,769.125 square miles. It covers a vast section of the state's remote interior."
  - question: "What is the largest county in California?"
    answer: "San Bernardino County is California's largest at 20,068.167 square miles. It extends from Southern California's urban fringe to the Nevada and Arizona borders."
  - question: "Why is Yukon-Koyukuk Census Area so large?"
    answer: "Central Alaska has enormous distances and few incorporated local governments. Federal statisticians group that remote territory into a census area for county-level data."
  - question: "What is the largest county in Texas?"
    answer: "Brewster County is Texas's largest at 6,183.763 square miles. It includes Big Bend National Park along the Rio Grande."
  - question: "Which state has the smallest largest county?"
    answer: "Rhode Island does. Providence County is its largest at 409.484 square miles, smaller than every other state's largest county or equivalent."

