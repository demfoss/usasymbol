      paragraphs:
        - "Yukon-Koyukuk Census Area spans 145,769.125 square miles across Alaska's interior. The territory is a statistical county equivalent rather than a county government, which allows one unit to cover remote river valleys, forests, tundra, and widely separated communities."
        - "San Bernardino County ranks second at 20,068.167 square miles, stretching from the Los Angeles metropolitan edge across the Mojave Desert to the Colorado River. Its land area exceeds New Jersey's."
