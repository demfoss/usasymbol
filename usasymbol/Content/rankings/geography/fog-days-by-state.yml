sections:
  - id: "states-with-the-most-fog"
    icon: "fa-solid fa-smog"
    title: "States With the Most Fog Days"
    paragraphs:
      - "Louisiana records the most fog of any state, averaging 200 days a year at New Orleans. Florida follows at 198 days in Jacksonville, and Texas ranks third at 194 days in Houston."
      - "Four of the five foggiest states, Louisiana, Florida, Texas, and Alabama, border the Gulf of Mexico. Indiana is the exception, ranking fifth at 175 days in Indianapolis."

  - id: "states-with-the-least-fog"
    icon: "fa-solid fa-sun"
    title: "States With the Least Fog Days"
    paragraphs:
      - "Hawaii has the fewest fog days of any state on record, with zero at Honolulu. Kansas is next lowest at 2.4 days in Wichita, followed by Alaska at 4.8 in Anchorage and Nevada at 5 in Las Vegas."
      - "New Mexico and Arizona also sit under 10 days, at 5.9 in Albuquerque and 7 in Phoenix. Nineteen additional states, measured under a stricter heavy-fog definition, add West Virginia as the foggiest of that group, at 64.8 days in Charleston."

