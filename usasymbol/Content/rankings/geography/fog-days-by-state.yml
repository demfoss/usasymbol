faq:
  - question: "What is the foggiest state in the U.S.?"
    answer: "Louisiana is the foggiest state on record, averaging 200 days of fog a year at New Orleans. Florida is close behind at 198 days in Jacksonville."

  - question: "Which state has the least fog?"
    answer: "Hawaii has the least fog of any state, with zero recorded days at Honolulu. Kansas is next lowest at 2.4 days in Wichita."

  - question: "How many days of fog does Texas get a year?"
    answer: "Texas averages 194 days of fog a year, measured at Houston. That places it third among the states in this ranking, behind only Louisiana and Florida."

  - question: "Is Ohio or Rhode Island foggier?"
    answer: "Neither. Ohio and Rhode Island tie at 166 fog days a year, measured at Columbus and Providence."

  - question: "How much fog does Colorado get compared to Utah?"
    answer: "Colorado averages 56 fog days a year in Denver, 10 more than Utah's 46 in Salt Lake City. Both sit far below Louisiana's 200."

  - question: "Which states get fewer than 10 fog days a year?"
    answer: "Five states average under 10 days: Kansas at 2.4 in Wichita, Alaska at 4.8 in Anchorage, Nevada at 5 in Las Vegas, New Mexico at 5.9 in Albuquerque, and Arizona at 7 in Phoenix. Hawaii is lower still, at zero in Honolulu."

  - question: "How many days of fog does West Virginia get a year?"
    answer: "West Virginia averages 64.8 days of heavy fog a year at Charleston, using a stricter measurement than most of the other states. That is the highest total among the 19 states added to this ranking most recently."

  - question: "Do all 50 states have fog day data in this ranking?"
    answer: "Yes, but the count comes from two different measurements. Thirty-one states use fog days including light mist from 1961-1990 station records, while the other 19, including West Virginia and New Hampshire, use a stricter heavy-fog count from 1991-2020 station records."

