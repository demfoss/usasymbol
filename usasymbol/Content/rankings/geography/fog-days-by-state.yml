seo:
  title: "Fog Days by State | Map, Rankings & Facts"
  description: "Louisiana averages 200 fog days a year in New Orleans, the most of any state on record. Hawaii has the fewest, with zero in Honolulu."

page:
  h1: "Fog Days by State"

  quick_answer:
    - "Louisiana is the foggiest state in the U.S., averaging 200 days of fog a year at New Orleans, its largest city."
    - "Florida ranks second at 198 days in Jacksonville, and Texas is third at 194 days in Houston. All three sit along the Gulf of Mexico or the Atlantic Coast."
    - "Hawaii logs zero fog days at Honolulu, the lowest total on record. Kansas, Alaska, Nevada, New Mexico, and Arizona all measure under 10 days, at 2.4, 4.8, 5, 5.9, and 7."

  methodology: "Two datasets are combined because no single source covers all 50 states. For 31 states, figures show average annual days with fog, including light mist, at a representative city, from 1961-1990 station normals. For the other 19 states, figures show average annual days with heavy fog only (visibility of 1/4 mile or less), a stricter count, from 1991-2020 station normals. The data source column marks which definition applies to each row; comparing a state from one column directly against a state from the other should be read with that difference in mind."

  sources:
