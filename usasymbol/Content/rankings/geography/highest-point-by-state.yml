  description: "Highest point in every U.S. state with elevations in feet and meters. Denali leads at 20,310 ft; Florida's Britton Hill is lowest."

page:
  h1: "Highest Point in Each U.S. State"
  
  quick_answer:
    - "Denali in Alaska is the highest point in the United States at 20,310 feet (6,190 m). It's also the tallest mountain in North America."
    - "Mount Whitney in California is the highest point in the U.S. mainland (contiguous Lower 48) at 14,505 feet (4,421 m)."
    - "Florida has the lowest high point of any state — Britton Hill at just 345 feet (105 m). Delaware (448 ft) and Louisiana (535 ft) are also extremely flat."
    - "Colorado has the highest average elevation of any state at 6,800 feet, with 58 peaks over 14,000 feet (fourteeners)."

  methodology: "Elevations are measured from sea level using USGS and state reference data. High points may be summits, plateaus, or ridgelines."
  
  sources:
    - name: "U.S. Geological Survey (USGS)"
      url: "https://www.usgs.gov/"
      description: "Official elevation data and topographic surveys"
    - name: "Peakbagger.com"
      url: "https://www.peakbagger.com/"
      description: "Comprehensive peak database and highpointing resources"
    - name: "National Park Service"
      url: "https://www.nps.gov/"
      description: "Information on peaks within national parks"

