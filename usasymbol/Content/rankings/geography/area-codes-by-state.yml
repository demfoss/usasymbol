faq:
  - question: "Which state has the most area codes?"
    answer: "California has the most with 41 active geographic area codes. Its large population and repeated numbering relief plans produced many splits and overlays."
  - question: "How many area codes does Texas have?"
    answer: "Texas has 29 active area codes, the second-highest total after California."
  - question: "Which states have only one area code?"
    answer: "Alaska, Delaware, Hawaii, Maine, Montana, New Hampshire, North Dakota, Rhode Island, South Dakota, Vermont, and Wyoming each have one."
  - question: "What are the California area codes?"
    answer: "California has 41 active codes, from long-established codes such as 209, 213, and 415 to newer overlays such as 357 and 837."
  - question: "Why do states get new area codes?"
    answer: "A state receives relief when an existing numbering area approaches exhaustion. A split divides the territory, while an overlay places another code over the same region and normally requires ten-digit dialing."

