      rows:
        - { rank: 1, state: "California", state_slug: "california", area_code_count: 41 }
        - { rank: 2, state: "Texas", state_slug: "texas", area_code_count: 29 }
        - { rank: 3, state: "Florida", state_slug: "florida", area_code_count: 23 }
        - { rank: 3, state: "New York", state_slug: "new-york", area_code_count: 23 }
        - { rank: 5, state: "Illinois", state_slug: "illinois", area_code_count: 17 }
      paragraphs:
        - "California's 41 area codes grew from three original codes assigned in 1947. Splits once divided territories, while newer overlays add a code to the same region when available phone numbers run short."
        - "Texas has 29 area codes across its large cities and vast rural regions. Florida and New York each have 23, combining old codes with multiple overlays in heavily populated metros."
  - id: "states-with-one-area-code"
    icon: "fa-solid fa-phone"
    title: "States With One Area Code"
    table:
