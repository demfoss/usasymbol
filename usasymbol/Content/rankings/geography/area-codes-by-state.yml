        - { state: "Delaware", state_slug: "delaware", area_code: "302" }
        - { state: "Hawaii", state_slug: "hawaii", area_code: "808" }
        - { state: "Rhode Island", state_slug: "rhode-island", area_code: "401" }
        - { state: "Wyoming", state_slug: "wyoming", area_code: "307" }
      paragraphs:
        - "Alaska, Delaware, Hawaii, Maine, Montana, New Hampshire, North Dakota, Rhode Island, South Dakota, Vermont, and Wyoming still use one area code each. Lower numbering demand has allowed each code to cover an entire state."
        - "Wyoming's 307 and Delaware's 302 date to the original nationwide area-code rollout in 1947. Hawaii's familiar 808 entered service in 1957, before statehood in 1959."

