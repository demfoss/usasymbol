page:
  h1: "Driest States in the U.S."

  quick_answer:
    - "Nevada is the driest state in the U.S., averaging about 9.5 inches of precipitation a year. Utah, Wyoming, Arizona, and New Mexico round out the top five driest, all sitting in the Great Basin or the desert Southwest."
    - "Hawaii is the wettest state, averaging 63.7 inches a year, nearly seven times Nevada's total. Louisiana (60.1 inches) and Mississippi (59.0 inches) are the wettest states in the continental U.S."
    - "Kansas and Texas tie at 28.9 inches a year, right at the midpoint between the arid West and the humid East."

  methodology: "Precipitation figures are long-term statewide annual averages (rain and melted snow combined), compiled from NOAA climate normals and listed in inches. Values are rounded to the nearest tenth of an inch."

