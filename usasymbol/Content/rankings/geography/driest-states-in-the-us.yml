sections:
  - id: "why-nevada-is-the-driest-state"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Is Nevada the Driest State?"
    paragraphs:
      - "Nevada averages just 9.5 inches of precipitation a year, the lowest of any state. Most of Nevada lies in the Great Basin, a high desert plateau boxed in by the Sierra Nevada to the west. Pacific storms lose most of their moisture climbing that range, so the air reaching Nevada is already dry."
      - "The state's own north-south mountain ranges wring out a little more moisture as storms cross them. That leaves the valleys between the ranges parched, which is why Nevada sits well below Utah's 12.2 inches and Wyoming's 12.9 inches, the next two driest states."

  - id: "driest-vs-wettest-states"
    icon: "fa-solid fa-droplet"
    title: "Driest States Compared to the Wettest States"
    paragraphs:
      - "Hawaii averages 63.7 inches of precipitation a year, nearly seven times Nevada's 9.5 inches. Louisiana (60.1 inches) and Mississippi (59.0 inches) are the wettest states in the continental U.S., both well over 50 inches more than Nevada receives."
      - "Kansas and Texas both average exactly 28.9 inches, landing near the midpoint of the 50-state range between Nevada's 9.5 inches and Hawaii's 63.7 inches."
