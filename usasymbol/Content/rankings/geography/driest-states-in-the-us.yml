faq:
  - question: "What is the driest state in the U.S.?"
    answer: "Nevada is the driest state in the U.S., averaging about 9.5 inches of precipitation a year. Utah (12.2 inches) and Wyoming (12.9 inches) rank second and third."

  - question: "Why does Nevada have so little rainfall?"
    answer: "Nevada sits east of the Sierra Nevada in the Great Basin, a high desert plateau. Pacific storms lose most of their moisture crossing the Sierra Nevada before reaching the state, and Nevada's own mountain ranges wring out more moisture as storms move east, leaving the valleys between them dry."

  - question: "What is the wettest state in the U.S.?"
    answer: "Hawaii is the wettest state, averaging 63.7 inches of precipitation a year. Louisiana (60.1 inches) and Mississippi (59.0 inches) are the wettest states in the continental U.S."

  - question: "How much precipitation does Arizona get a year?"
    answer: "Arizona averages 13.6 inches of precipitation a year, the fourth-lowest total among the 50 states, behind Nevada, Utah, and Wyoming."

  - question: "Which states are tied for the same average precipitation?"
    answer: "Kansas and Texas are tied at 28.9 inches a year. Maine and Missouri are tied at 42.2 inches. Connecticut and North Carolina are tied at 50.3 inches."

  - question: "Is California a dry state?"
    answer: "California averages 22.2 inches of precipitation a year, ranking 11th driest among the 50 states. That puts it between South Dakota (20.1 inches) and Alaska (22.5 inches) on the statewide list."

