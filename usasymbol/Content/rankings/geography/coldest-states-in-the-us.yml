page:
  h1: "Coldest States in the U.S."

  quick_answer:
    - "Coldest states in the US start with Alaska at 28.1°F on average. Its Arctic north and frozen interior sit far from any warming ocean air."
    - "North Dakota is second coldest at 41.1°F, followed by Minnesota at 41.8°F and Maine at 41.9°F. North Dakota gets there through flat plains open to Canadian air, while Maine sits at the cold end of New England."
    - "Florida is the warmest at 71.5°F, with Hawaii close behind at 70.2°F. Louisiana ranks third warmest at 67.2°F and Texas fourth at 65.8°F."

  methodology: "NOAA NCEI monthly statewide mean temperatures, averaged over the 1991 to 2020 climate normal period. Hawaii is not in that dataset, so its figure comes from the published NOAA-based 1991 to 2020 list."

  sources:
    - name: "NOAA NCEI. Climate at a Glance and nClimDiv statewide monthly temperature"
      url: "https://www.ncei.noaa.gov/monitoring-content/data/us/climdiv/monthly/current/"
      description: "Statewide monthly average temperature, 1991 to 2020 average, used for 49 states"
    - name: "World Population Review. Coldest States"
      url: "https://worldpopulationreview.com/state-rankings/coldest-states"
      description: "Published average temperature list used for Hawaii only"

