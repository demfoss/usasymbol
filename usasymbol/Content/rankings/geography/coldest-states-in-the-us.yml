sections:
  - id: "coldest-states-in-the-us"
    icon: "fa-solid fa-icicles"
    title: "Why Alaska Is the Coldest State"
    paragraphs:
      - "Alaska averages 28.1°F, 13.0 degrees colder than North Dakota, the next coldest state. A large part of it lies north of the Arctic Circle, where the winter sun barely clears the horizon, and the interior is cut off from the Pacific by mountain ranges. Only the southern coast gets milder ocean air."
      - "North Dakota averages 41.1°F, Minnesota 41.8°F and Maine 41.9°F. North Dakota is flat and far from any ocean, so Canadian air sweeps in with nothing to slow it. Wyoming at 42.3°F and Montana at 42.6°F are cold for another reason, because much of both states sits high in the Rocky Mountains. Compare the pattern with [average snowfall by state](/rankings/geography/average-snowfall-by-state) and the [Snow Belt States](/rankings/geography/snow-belt-states)."

  - id: "warmest-states-in-the-us"
    icon: "fa-solid fa-sun"
    title: "Why Florida Is the Warmest State"
    paragraphs:
      - "Florida averages 71.5°F. It is a low-latitude peninsula between the Gulf of Mexico and the Atlantic, so warm water surrounds it and Arctic air rarely gets far south. Louisiana averages 67.2°F and Texas 65.8°F."
      - "Hawaii sits in the tropics and ranks second warmest at 70.2°F, only 1.3 degrees behind Florida. Steady trade winds and high volcanic slopes hold its average just below the Florida peninsula. See the [Sun Belt States](/rankings/geography/sun-belt-states) for the wider southern band."

