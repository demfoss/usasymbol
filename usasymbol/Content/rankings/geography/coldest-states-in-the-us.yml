faq:
  - question: "Which state is the coldest?"
    answer: "Alaska, at 28.1°F a year. Its northern slope lies above the Arctic Circle and its interior is shielded from Pacific warmth by mountain ranges."

  - question: "Which state is the warmest?"
    answer: "Florida, at 71.5°F. Hawaii is second warmest at 70.2°F and Louisiana is third at 67.2°F."

  - question: "What is the average temperature in Texas?"
    answer: "Texas averages 65.8°F, fourth warmest behind Florida, Hawaii, and Louisiana. A state that large runs from cool Panhandle winters to a steamy Gulf coast."

  - question: "Is Hawaii warmer than Florida?"
    answer: "No, but it is close. Hawaii averages 70.2°F against Florida's 71.5°F. Trade winds and mountain elevation pull Hawaii's yearly average down, and it ranks second warmest overall."

  - question: "What is the average temperature in Minnesota?"
    answer: "Minnesota averages 41.8°F, third coldest after Alaska and North Dakota. Winter air from central Canada flows straight down the plains with no mountains in the way."

