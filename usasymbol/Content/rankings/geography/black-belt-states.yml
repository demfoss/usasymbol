faq:
  - question: "What states are in the Black Belt region?"
    answer: "Eleven states are part of the Black Belt region: Alabama, Arkansas, Florida, Georgia, Louisiana, Mississippi, North Carolina, South Carolina, Tennessee, Texas, and Virginia. Mississippi (24 counties) and Alabama (18 counties) have the most Black Belt counties of any state."

  - question: "What is the Black Belt region in the United States?"
    answer: "The Black Belt is a crescent-shaped geographic region in the American South defined by dark, calcareous clay soil. It spans 11 states and approximately 141 counties, running from Virginia through the Carolinas, Alabama, Mississippi, and into East Texas. The region was the center of American cotton production and has the highest concentration of African American residents of any part of the country."

  - question: "Why is it called the Black Belt?"
    answer: "The Black Belt is named for two things. The first is the dark, black clay soil (a Vertisol) that made the region ideal for cotton farming. The second is the African American population concentrated there as a result of slavery. Booker T. Washington documented both meanings in 'Up from Slavery' (1901). W.E.B. Du Bois gave an entire chapter of 'The Souls of Black Folk' (1903) to the region."

  - question: "What is the Black Belt in Alabama?"
    answer: "Alabama's Black Belt is an 18-county crescent of dark clay soil running across the center of the state. Dallas County, home to Selma, is the most historically significant; it was the site of the 1965 Voting Rights March. Greene County has the highest African American population share in Alabama at roughly 80 percent. Alabama is the state that gave the Black Belt its name."

  - question: "What is the Black Belt in Mississippi?"
    answer: "Mississippi has 24 Black Belt counties, more than any other state, concentrated in the Mississippi Delta and central counties. Sunflower County was home to civil rights leader Fannie Lou Hamer. Mississippi Delta counties including Bolivar, Humphreys, Sharkey, Issaquena, and Washington are among the most economically distressed rural counties in the United States."

  - question: "Is the Black Belt a political region?"
    answer: "The Black Belt has both geographic and political dimensions. Geographically it is defined by soil type. Politically, its high African American population has shaped southern electoral maps since Reconstruction. Because African Americans in the Black Belt were systematically disenfranchised for much of the 20th century, the region became a focal point of the civil rights movement, particularly in Alabama (Selma, 1965) and Mississippi."

