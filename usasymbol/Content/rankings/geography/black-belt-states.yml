  title: "Black Belt States | Region Map and County List"
  description: "Mississippi has 24 Black Belt counties, the most of any state. The Black Belt region spans 11 southern states and roughly 141 counties in a crescent from Virginia to Texas."

page:
  h1: "Black Belt States: Region Map and County List"

  quick_answer:
    - "Mississippi's 24 Black Belt counties are the most of any state in the region. The Black Belt crosses 11 states in the American South — from Virginia in the northeast to Texas in the southwest — following a crescent of dark, calcareous clay soil that made the region the center of American cotton production."
    - "Alabama, with 18 Black Belt counties, is the region's namesake state. Dallas County, Alabama — home to Selma — is among the most historically significant counties in the entire region, site of the 1965 Voting Rights March that led to the Voting Rights Act."
    - "Florida (4 counties) and Texas (6 counties) are the smallest Black Belt states by county count. The 39 states outside the South are not part of the Black Belt region."

  methodology: "Black Belt counties are defined using the geographic and traditional demographic definition: counties within the historic crescent of dark, calcareous Vertisol clay soil running through the Deep South, as established in academic and USDA literature. County counts are approximate; exact boundaries vary by source. States outside the 11-state traditional Black Belt are listed with 0 counties."

  sources:
    - name: "USDA Economic Research Service – Black Belt"
      url: "https://www.ers.usda.gov/topics/rural-economy-population/rural-classifications/what-is-rural/black-belt/"
      description: "USDA ERS definition and data on the Black Belt region, covering 11 states across the American South"
