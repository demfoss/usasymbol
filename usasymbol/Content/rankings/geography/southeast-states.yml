faq:
  - question: "What states are in the Southeast?"
    answer: "Seven states form the universally recognized Southeast: Alabama, Florida, Georgia, Mississippi, North Carolina, South Carolina, and Tennessee. Four more — Arkansas, Kentucky, Louisiana, and Virginia — are sometimes included. The Southeast has no Census definition; the Census places all these states in the broader South region."

  - question: "How many states are in the Southeast?"
    answer: "The core Southeast consists of 7 states. With sometimes-included states, the total reaches 11. The Southeast has no fixed Census definition, so the number varies by source — the Southeastern Conference (SEC) has 16 member institutions spanning 11 states as of 2024."

  - question: "Is Virginia in the Southeast?"
    answer: "Virginia is sometimes included in the Southeast. With approximately 8.6 million residents, it is the most populous sometimes-included state. Richmond served as the Confederate capital. However, Northern Virginia's proximity to Washington D.C. and its economic character lead many sources to group Virginia with the Mid-Atlantic."

  - question: "Is Louisiana in the Southeast?"
    answer: "Louisiana is sometimes included in the Southeast. New Orleans is culturally connected to the Gulf South. However, Louisiana is a Census West South Central state and is sometimes grouped with Texas and Arkansas as South Central rather than Southeast. The SEC includes LSU (Baton Rouge) as a founding member."

  - question: "What is the largest Southeast state?"
    answer: "Florida is the largest core Southeast state by both population (approximately 21.5 million) and area (65,758 sq mi). Georgia is the second-largest by both population (approximately 10.7 million) and area (59,425 sq mi)."

  - question: "What is the smallest Southeast state?"
    answer: "South Carolina is the smallest core Southeast state by area at 32,020 square miles. Mississippi is the least populous core Southeast state at approximately 3 million residents."

