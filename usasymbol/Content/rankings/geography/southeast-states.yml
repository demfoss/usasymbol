page:
  h1: "Southeast States"

  quick_answer:
    - "Seven states form the universally recognized Southeast: Alabama, Florida, Georgia, Mississippi, North Carolina, South Carolina, and Tennessee. Florida, with approximately 21.5 million residents, is the most populous of the seven."
    - "Four states are sometimes included in the Southeast: Arkansas, Kentucky, Louisiana, and Virginia. Each has a significant reason for inclusion — cultural and geographic overlap with the core Southeast — and a reason for exclusion, such as stronger ties to the South Central, border-state, or Mid-Atlantic traditions."
    - "The Southeast has no Census definition — the Census Bureau classifies all 11 states (core and sometimes) within the broader South region. The 7-state core is widely recognized in geographic encyclopedias, tourism boards, and the Southeastern Conference (SEC), which includes institutions from all 7 core states."

  methodology: "Southeast classification reflects the geographic consensus across major reference sources and institutional usage. Core states appear in virtually every published definition of the Southeast. Sometimes-included states appear in some definitions but not others, typically because of overlapping regional identities. southeast_score: 3 = universally recognized as Southeast, 2 = sometimes included."

  sources:
    - name: "Encyclopaedia Britannica — Southeastern United States"
      url: "https://www.britannica.com/place/southeastern-United-States"
      description: "Britannica's definition of the Southeastern United States, covering its geographic boundaries and cultural characteristics"
    - name: "Southeastern Conference (SEC)"
      url: "https://www.secsports.com/about"
      description: "The SEC is an athletic conference whose geographic composition — spanning Alabama, Arkansas, Florida, Georgia, Kentucky, Louisiana, Mississippi, Missouri, South Carolina, Tennessee, Texas, and Vanderbilt (Tennessee) — reflects one widely used definition of the broader Southeast"

