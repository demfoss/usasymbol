  title: "How Many Rhode Islands Fit in Each State"
  description: "Alaska fits 551.9 Rhode Islands by land area. Texas fits 253.3. Every state compared to Rhode Island, the smallest at 1,034 sq mi."

page:
  h1: "How Many Rhode Islands Could Fit Inside Each U.S. State"

  quick_answer:
    - "Rhode Island (1,034 sq mi) is the smallest U.S. state. Alaska fits 551.9 Rhode Islands within its borders; Texas fits 253.3, and California fits 150.8."
    - "Eight states each fit 100 or more Rhode Islands — Alaska, Texas, California, Montana, New Mexico, Arizona, Nevada, and Colorado — all west of the Mississippi. Delaware, the second-smallest state, fits just 1.9."

  methodology: "Rhode Islands per state = state land area (sq mi) divided by Rhode Island land area (1,034 sq mi). Land area from U.S. Census Bureau Gazetteer Files; water excluded throughout."

  sources:
    - name: "U.S. Census Bureau (Gazetteer Files)"
      url: "https://www.census.gov/geographies/reference-files/time-series/geo/gazetteer-files.html"
      description: "Official geographic data and state area measurements used for all land area figures"

