faq:
  - question: "How many Rhode Islands fit in Alaska?"
    answer: "About 551.9, based on Alaska's 570,641 square miles of land. Juneau, the state capital, cannot be reached by road from the rest of Alaska, a sign of how much empty ground lies between towns."

  - question: "How many Rhode Islands fit in Texas?"
    answer: "Texas fits 253.3 Rhode Islands, more than any state except Alaska. El Paso, at the far western tip, sits closer to San Diego than to Beaumont on the Louisiana line."

  - question: "How many Rhode Islands fit in California?"
    answer: "California fits 150.8 Rhode Islands and ranks third. The Mojave Desert and the long Central Valley give it just enough room to edge out Montana, which fits 140.8."

  - question: "Which state fits the fewest Rhode Islands?"
    answer: "Delaware, at 1.9. Its 1,949 square miles are divided into only three counties, the fewest of any state."

  - question: "How many Rhode Islands fit in Hawaii?"
    answer: "Hawaii fits 6.2 Rhode Islands, but that land is spread along a chain of islands rather than one block. The Island of Hawaii, known as the Big Island, is larger than all the other islands combined. Its shoreline also places Hawaii high among [states by coastline length](/rankings/geography/states-by-coastline-length)."

  - question: "How many Rhode Islands fit in Montana?"
    answer: "Montana fits 140.8 Rhode Islands, fourth among the states. The name comes from the Spanish word for mountain, yet most of eastern Montana is flat Great Plains grassland."

