    paragraphs:
      - "Alaska covers 570,641 square miles of land, enough for 551.9 Rhode Islands and more than twice the 253.3 that fit in Texas. The United States bought the entire Russian colony in 1867 for $7.2 million. Nearly a century later, Congress admitted all of it as one state, and its Aleutian Islands reach so far west that they cross the 180th meridian."
      - "Congress carved most other western territories into states of similar size, often along straight survey lines. Montana (140.8), New Mexico (117.3), Arizona (109.9), Nevada (106.2), and Colorado (100.2) all clear 100 Rhode Islands, and every state that does lies west of the Mississippi River. The full [U.S. states by land area](/rankings/geography/states-by-land-area) ranking lists the raw square miles."

