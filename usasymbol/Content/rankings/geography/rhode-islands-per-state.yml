    paragraphs:
      - "Alaska (570,641 sq mi) fits 551.9 Rhode Islands — more than twice the 253.3 that fit in Texas. The gap between Alaska and every other state is wider here than in any other geographic comparison: Alaska is 2.18 times larger than Texas, yet most people picture the two as roughly comparable. Colorado is the only state that crosses exactly 100 Rhode Islands, fitting 100.2."
      - "California (150.8 RI) edges out Montana (140.8 RI) despite being more than twice as populous and far more associated with cities than open land. Montana's 145,552 square miles are almost entirely undeveloped, yet California's vast interior — the Central Valley, the Mojave, the eastern Sierra Nevada foothills — outpaces it. The full [U.S. states by land area](/rankings/geography/states-by-land-area) ranking shows how this comparison extends across all 50 states."

