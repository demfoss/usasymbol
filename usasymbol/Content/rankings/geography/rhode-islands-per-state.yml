          rhode_islands: 1.9
          land_sq_mi: 1949
    paragraphs:
      - "Delaware fits 1.9 Rhode Islands, the fewest of any state. Both states drew their borders in the 1600s, and Delaware's curved northern line still follows a 12-mile circle measured from the courthouse town of New Castle. Connecticut (4.7) and Hawaii (6.2) come next, with Hawaii's 6,423 square miles split across eight main islands."
      - "West Virginia fits 23.2 Rhode Islands, yet Maryland, one place lower, fits only 9.4. West Virginia broke away from Virginia in 1863, during the Civil War, and took the mountainous western counties with it. Maryland kept the narrow colonial shape set by its 1632 charter, squeezed between the Potomac River and the Mason-Dixon Line."

  - id: "how-big-is-rhode-island"
    icon: "fa-solid fa-ruler-combined"
    title: "How Big Is Rhode Island"
    paragraphs:
      - "Rhode Island has 1,034 square miles of land, the smallest of any state and the unit behind every number on this page. Narragansett Bay cuts deep into its middle, so a big share of the state's total area is water. Measuring land only keeps the bay from inflating the comparison."
      - "Despite the name, most of Rhode Island is mainland. The name first belonged to Aquidneck Island, home to Newport, and the official name stayed Rhode Island and Providence Plantations until voters shortened it in 2020. New Jersey, which fits 7.1 Rhode Islands, is the only state with a higher [population density](/rankings/demographics/states-by-population-density)."

