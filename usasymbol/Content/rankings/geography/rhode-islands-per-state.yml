faq:
  - question: "How many Rhode Islands fit in Alaska?"
    answer: "Alaska fits 551.9 Rhode Islands by land area. Alaska covers 570,641 square miles; Rhode Island covers 1,034 square miles. Alaska is the largest U.S. state and more than twice the size of Texas."

  - question: "How many Rhode Islands fit in Texas?"
    answer: "Texas fits 253.3 Rhode Islands. Texas covers 261,914 square miles and is the largest state in the contiguous United States. Alaska fits more than twice as many Rhode Islands as Texas does."

  - question: "How many Rhode Islands fit in California?"
    answer: "California fits 150.8 Rhode Islands. California covers 155,959 square miles, making it the third-largest U.S. state by land area. It fits more Rhode Islands than Montana (140.8), despite Montana being better known for open land."

  - question: "What state fits the fewest Rhode Islands besides Rhode Island itself?"
    answer: "Delaware fits the fewest Rhode Islands of any state besides Rhode Island: 1.9. Connecticut is next at 4.7, followed by Hawaii at 6.2. Delaware's 1,949 square miles make it the second-smallest U.S. state."

  - question: "How many Rhode Islands fit in the entire United States?"
    answer: "The combined land area of all 50 states is approximately 3,532,714 square miles, which fits about 3,417 Rhode Islands. That figure uses land area only and excludes water bodies throughout."

  - question: "How big is Rhode Island compared to other states?"
    answer: "Rhode Island (1,034 sq mi) is the smallest U.S. state by land area. It is about half the size of Delaware (1,949 sq mi), the next smallest. Rhode Island is ranked 50th in land area but has a population density higher than 48 other states."

