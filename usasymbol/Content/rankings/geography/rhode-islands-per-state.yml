  description: "Alaska fits 551.9 Rhode Islands by land area and Texas fits 253.3. Delaware, the second-smallest state, fits just 1.9 Rhode Islands."

page:
  h1: "How Many Rhode Islands Fit in Each State"

  quick_answer:
    - "Alaska fits 551.9 Rhode Islands inside its borders, more than any other state. The whole territory bought from Russia in 1867 entered the Union in 1959 as a single state."
    - "Delaware fits just 1.9 Rhode Islands, the fewest of any state. Both are colonial-era states whose borders were fixed by royal charters and land grants in the 1600s, long before the country pushed west."
    - "Texas fits 253.3 Rhode Islands, the most in the Lower 48. An independent republic until 1845, it joined the Union on terms that even let it divide into as many as five states. No split ever happened."

  methodology: "Each state's land area in square miles divided by Rhode Island's 1,034 square miles, from U.S. Census Bureau Gazetteer Files. Water is excluded, and Rhode Island itself is left out of the ranking."

  sources:
    - name: "U.S. Census Bureau (Gazetteer Files)"
      url: "https://www.census.gov/geographies/reference-files/time-series/geo/gazetteer-files.html"
      description: "Official geographic data and state area measurements used for all land area figures"

