    paragraphs:
      - "Delaware is the only other state with a ratio below 2.0 — it fits 1.9 Rhode Islands. Connecticut (4.7 RI) and Hawaii (6.2 RI) are the next closest. Hawaii's 6,423 square miles are spread across eight main islands, which makes the ratio feel smaller than the total distance across the archipelago suggests."
      - "The five smallest states combined — Rhode Island, Delaware, Connecticut, New Jersey, and New Hampshire — fit 23.4 Rhode Islands total. That is almost exactly the same as West Virginia (23.2 RI) alone. Rhode Island itself has a [population density](/rankings/demographics/states-by-population-density) higher than all but two other states, fitting more than 1 million residents into its 1,034 square miles."

  - id: "how-it-works"
    icon: "fa-solid fa-ruler-combined"
    title: "How the Rhode Island Comparison Works"
    paragraphs:
      - "The ratio divides each state's land area (in square miles, as measured by the U.S. Census Bureau) by Rhode Island's land area of 1,034 square miles. Land area counts only solid ground and excludes rivers, lakes, reservoirs, and coastal waters. The same source and exclusion rule applies to all 50 states, so the ratios are directly comparable. Using total area instead of land area would change results slightly for water-heavy states like Michigan and Florida."
      - "Rhode Island is frequently used as a size reference in U.S. geography because it is the smallest and most widely recognized benchmark. The [states-by-land-area ranking](/rankings/geography/states-by-land-area) shows all 50 states ranked by raw land area, and the [compare-states tool](/compare-states) lets you set any two states side by side with population and density context."

