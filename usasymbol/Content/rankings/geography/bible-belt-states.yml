page:
  h1: "Bible Belt States 2026: Map and Full List"

  quick_answer:
    - "Nine states are consistently identified as core Bible Belt: Alabama, Arkansas, Georgia, Louisiana, Mississippi, North Carolina, Oklahoma, South Carolina, and Tennessee. Mississippi is ranked the most religious state in the U.S. in every Gallup annual survey since 2008."
    - "Seven additional states — Florida, Kentucky, Missouri, Texas, Utah, Virginia, and West Virginia — are sometimes included depending on the source. Utah is a special case: it is among the most religious states by any measure, but its tradition is LDS rather than the Southern Protestant evangelicalism that defines the Bible Belt."
    - "Thirty-four states are not considered part of the Bible Belt. New England, the Pacific Coast, and the Mountain West are consistently the least-religious regions in U.S. surveys."

  methodology: "Bible Belt classification reflects the consensus across major SERP sources, geographic references, and survey literature. Core states appear in virtually every definition of the Bible Belt. Sometimes-included states appear in some definitions but not others, typically due to internal geographic variation, urban-rural splits, or a different dominant religious tradition. No state is fully excluded by all sources."

  sources:
