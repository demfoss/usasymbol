faq:
  - question: "What states are in the Bible Belt?"
    answer: "Nine states are consistently identified as core Bible Belt states: Alabama, Arkansas, Georgia, Louisiana, Mississippi, North Carolina, Oklahoma, South Carolina, and Tennessee. Seven additional states — Florida, Kentucky, Missouri, Texas, Utah, Virginia, and West Virginia — are sometimes included depending on the source."

  - question: "Is Texas in the Bible Belt?"
    answer: "Texas is sometimes included in the Bible Belt. Eastern and rural Texas are firmly part of the Bible Belt culturally and religiously. Major urban centers — Austin, Houston, and Dallas — are considerably more secular. Some sources include only East Texas; others include the full state."

  - question: "Is Florida in the Bible Belt?"
    answer: "Florida is sometimes included in the Bible Belt. Northern Florida, including the Panhandle, is culturally and religiously identical to Alabama and Georgia and is firmly Bible Belt territory. South Florida, the Atlantic coast, and the Tampa Bay area are far more secular. Most sources that exclude Florida cite its large non-Southern retiree and immigrant populations."

  - question: "Is Utah in the Bible Belt?"
    answer: "Utah is sometimes included in the Bible Belt because it is among the most religious states in the U.S. by every survey measure. However, Utah's dominant religion is LDS (Mormon), not Southern Protestant evangelicalism. Most definitions of the Bible Belt are built around Southern Baptist and evangelical Protestant culture, which makes Utah a special case rather than a core member."

  - question: "Which state is the most religious in the Bible Belt?"
    answer: "Mississippi is the most religious state in the Bible Belt by every major measure. Gallup has ranked Mississippi the most religious state in the U.S. in every annual survey since 2008. Pew Research found that approximately 77 percent of Mississippi residents identify as highly religious, the highest of any state in the country."

  - question: "Where did the term Bible Belt come from?"
    answer: "The term Bible Belt was coined by journalist H.L. Mencken, who first used it in print in 1924 to describe the American South during the Scopes Trial in Dayton, Tennessee. The trial concerned whether a public school teacher could legally teach evolution — a case that drew national attention to the region's strict Protestant fundamentalism. Mencken used the term pejoratively; it later became a neutral geographic descriptor."

