sections:
  - id: "what-states-are-in-the-bible-belt"
    icon: "fa-solid fa-church"
    title: "What States Are in the Bible Belt?"
    paragraphs:
      - "Nine states form the core Bible Belt: Alabama, Arkansas, Georgia, Louisiana, Mississippi, North Carolina, Oklahoma, South Carolina, and Tennessee. These nine states appear in virtually every published definition of the Bible Belt and share three traits: a dominant evangelical Protestant religious culture, high rates of weekly church attendance, and the Southern Baptist Convention as the largest single denomination. Mississippi ranks most religious in every Gallup annual survey since 2008; Tennessee hosts the Southern Baptist Convention headquarters in Nashville."
      - "Seven additional states are sometimes included: Florida, Kentucky, Missouri, Texas, Utah, Virginia, and West Virginia. Each has a significant reason for inclusion and a significant reason for exclusion. Florida's inclusion depends almost entirely on which part of the state is assessed — the northern Panhandle is culturally Alabama, while South Florida and the coastal corridor are among the most secular parts of the country. Texas is included when only East Texas is considered; urban Texas (Austin, Houston, Dallas) skews far more secular than the state's rural interior."

  - id: "where-is-the-bible-belt"
    icon: "fa-solid fa-map-location-dot"
    title: "Where Is the Bible Belt?"
    paragraphs:
      - "The Bible Belt runs through the American South, beginning in the Carolinas and Georgia in the east, through Alabama, Mississippi, Tennessee, Arkansas, Louisiana, and Oklahoma in the center and west. It is named for the high density of evangelical Protestant churches — particularly Southern Baptist — relative to population. The region coincides almost exactly with former Confederate states where Baptist and Methodist churches became the dominant social institutions after the Civil War."
      - "The term 'Bible Belt' was coined by journalist H.L. Mencken, who first used it in print in 1924 to describe the American South during the Scopes Trial in Dayton, Tennessee. The name was originally pejorative, referencing Dayton's strict Protestant fundamentalism. Over the following century it became a neutral geographic descriptor. The Southern Baptist Convention, founded in Augusta, Georgia in 1845, is the institutional anchor of the region; its 47,000 churches are concentrated almost entirely in the 9 core Bible Belt states."

  - id: "bible-belt-states-sometimes-included"
    icon: "fa-solid fa-circle-question"
    title: "Bible Belt States Sometimes Included"
    paragraphs:
      - "Utah's classification is the most debated of any sometimes-included state. Approximately 64 percent of Utah residents identify as highly religious (Pew 2014), which places it in the top 10 most religious states nationally. However, the dominant tradition is LDS (Mormon) rather than Southern Protestant evangelicalism. Because the Bible Belt is defined by Southern Baptist and evangelical Protestant culture specifically, most geographic references exclude Utah despite its high religiosity."
      - "Kentucky (63 percent highly religious, Pew 2014) and West Virginia are excluded by some sources because of their border-state history and Appalachian cultural identity, which differs from the Deep South. Missouri is similarly split: its southern Ozark counties are culturally identical to Arkansas, while St. Louis and Kansas City resemble Midwestern cities more than Bible Belt ones."

