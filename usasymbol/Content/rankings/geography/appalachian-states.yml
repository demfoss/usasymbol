faq:
  - question: "What states are in Appalachia?"
    answer: "13 states are officially part of the Appalachian Region: Alabama, Georgia, Kentucky, Maryland, Mississippi, New York, North Carolina, Ohio, Pennsylvania, South Carolina, Tennessee, Virginia, and West Virginia. The region is defined by the Appalachian Regional Commission Act of 1965 and covers 423 counties."

  - question: "How many states are in Appalachia?"
    answer: "13 states are in Appalachia according to the Appalachian Regional Commission. The ARC was established by Congress in 1965 to address the region's economic needs. The 13-state boundary is set by federal law and has been amended by Congress several times since 1965."

  - question: "How many counties are in the Appalachian Region?"
    answer: "The Appalachian Region contains 423 counties across 13 states. West Virginia contributes the most counties (55), followed by Kentucky (54), Tennessee (52), and Pennsylvania (52). Maryland has the fewest with 3 counties."

  - question: "Is New York part of Appalachia?"
    answer: "Yes, 14 counties in New York are officially part of the Appalachian Region. All 14 are in the Southern Tier, the area along New York's border with Pennsylvania. New York City, the Hudson Valley, and most of the state are outside the Appalachian boundary."

  - question: "Is Mississippi in Appalachia?"
    answer: "Yes, 24 counties in northeastern Mississippi are in the Appalachian Region. These counties border Alabama and Tennessee. Jackson, the Gulf Coast, and the Delta are not part of the Appalachian Region. Mississippi's Appalachian counties represent the southernmost extension of the region."

  - question: "Which Appalachian state has the most counties in the region?"
    answer: "West Virginia has the most Appalachian counties with 55 — and is the only state where every county is in the ARC region. Kentucky is second with 54 counties, followed by Tennessee (52) and Pennsylvania (52)."

