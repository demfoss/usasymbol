seo:
  title: "States With Volcanoes | 13 States Have Volcanoes"
  description: "Alaska has 130 potentially active volcanoes, more than any other state. Hawaii has the only currently erupting volcanoes. 13 U.S. states have volcanoes."

page:
  h1: "States With Volcanoes"

  quick_answer:
    - "Alaska has 130 potentially active volcanoes — more than all other U.S. states combined. California ranks 2nd with 19 and Oregon ranks 3rd with 17."
    - "13 of 50 U.S. states have at least one potentially active volcano. All 13 are in the West: Alaska, California, Oregon, Washington, Hawaii, Idaho, New Mexico, Nevada, Wyoming, Utah, Arizona, Colorado, and Montana."
    - "Hawaii's Kīlauea and Mauna Loa are the only volcanoes in the United States classified as currently active. Alaska has several volcanoes that erupted in the past decade, including Pavlof, Cleveland, and Bogoslof."

  methodology: "Counts reflect potentially active volcanoes monitored by the USGS Volcano Hazards Program."

  sources:
    - name: "USGS Volcano Hazards Program"
      url: "https://www.usgs.gov/programs/VHP"
      description: "Official USGS database of monitored potentially active volcanoes by state."
    - name: "Smithsonian Global Volcanism Program"
      url: "https://volcano.si.edu"
      description: "Global database of holocene volcanic activity used to verify state counts."

