sections:
  - id: alaska-dominates
    title: "Alaska Has More Volcanoes Than Any Other U.S. State"
    paragraphs:
      - "Alaska has 130 potentially active volcanoes — more than all other 49 states combined. The Aleutian Island chain and Alaska Peninsula account for most of them. Pavlof, Cleveland, Bogoslof, and Redoubt are among the most frequently active."
      - "Katmai National Park in Alaska preserves the Valley of Ten Thousand Smokes, blanketed by ash from the 1912 Novarupta eruption — the largest volcanic eruption of the 20th century. The Katmai volcano group alone contains 15 volcanoes."

  - id: cascade-range
    title: "The Cascade Range Accounts for Most Contiguous US Volcanoes"
    paragraphs:
      - "California (19), Oregon (17), and Washington (5) contain the bulk of potentially active volcanoes in the lower 48 states. All lie along the Cascade Range, a chain of stratovolcanoes built by the subducting Juan de Fuca tectonic plate."
      - "Washington's Mount St. Helens — one of 5 Cascade volcanoes in the state — produced the deadliest and most destructive eruption in U.S. history on May 18, 1980. Crater Lake in Oregon formed from the collapse of Mount Mazama roughly 7,700 years ago."

  - id: hawaii-active
    title: "Hawaii: The Only State With Currently Erupting Volcanoes"
    paragraphs:
      - "Hawaii has 5 historically active volcanoes: Kīlauea, Mauna Loa, Hualalai, Mauna Kea, and the submarine Lōʻihi. Kīlauea and Mauna Loa are the only two volcanoes in the United States rated as currently active by the USGS."
      - "Mauna Loa erupted in November 2022 for the first time since 1984. Kīlauea has erupted repeatedly since 1983. Both are monitored 24 hours a day from the USGS Hawaiian Volcano Observatory inside Hawaiʻi Volcanoes National Park."

faq:
  - question: "Which state has the most volcanoes?"
    answer: "Alaska has the most volcanoes of any U.S. state with 130 potentially active volcanoes. California is 2nd with 19 and Oregon is 3rd with 17. All 13 states with potentially active volcanoes are in the western United States."

  - question: "Does Hawaii have active volcanoes?"
    answer: "Yes. Hawaii has 5 historically active volcanoes: Kīlauea, Mauna Loa, Hualalai, Mauna Kea, and the submarine Lōʻihi. Kīlauea and Mauna Loa are classified as currently active by the USGS. Mauna Loa last erupted in 2022 and Kīlauea has erupted repeatedly since 1983."

  - question: "What states have volcanoes in the continental US?"
    answer: "11 states in the contiguous United States have potentially active volcanoes: California (19), Oregon (17), Washington (5), Idaho (5), New Mexico (4), Nevada (3), Wyoming (2), Utah (2), Arizona (2), Colorado (1), and Montana (1). All lie in the western United States."

  - question: "Is Yellowstone a volcano?"
    answer: "Yes. Yellowstone in Wyoming is a supervolcano — a caldera system capable of eruptions far larger than typical volcanoes. It last erupted 640,000 years ago. The geysers and hot springs at Yellowstone are powered by the same magma system and are actively monitored by the USGS."

  - question: "Which states have no volcanoes?"
    answer: "37 of 50 states have no potentially active volcanoes. All are east of the Rocky Mountains or outside the Pacific volcanic arc. States such as Texas, Florida, New York, and Illinois have no volcanic activity in the geologic record of the Holocene epoch."

  - question: "What was the last volcanic eruption in the contiguous US?"
    answer: "Mount St. Helens in Washington erupted most recently between 2004 and 2008, producing a new lava dome. Its 1980 eruption was the deadliest in U.S. history, killing 57 people and flattening 230 square miles of forest. Washington is ranked 4th with 5 potentially active Cascade volcanoes."

