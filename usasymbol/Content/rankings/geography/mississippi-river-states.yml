faq:
  - question: "What states does the Mississippi River flow through?"
    answer: "Ten states: Minnesota (source), Wisconsin, Iowa, Illinois, Missouri, Kentucky, Tennessee, Arkansas, Mississippi, and Louisiana (Gulf mouth). Minnesota and Louisiana are the only two through-states; the other eight are border states where the river forms a state line."

  - question: "How many states does the Mississippi River border?"
    answer: "The Mississippi River flows through or borders 10 states. Eight of the 10 serve as border states where the river forms the state line between neighbors. Minnesota contains the source at Lake Itasca and Louisiana contains the Gulf mouth — both are through-states."

  - question: "Which state has the most miles of the Mississippi River?"
    answer: "Illinois has the most Mississippi River miles of any state at approximately 581 miles, with the river forming its entire western border from Wisconsin to Cairo. Missouri ranks second with approximately 480 miles."

  - question: "Which state has the fewest miles of the Mississippi River?"
    answer: "Kentucky has the shortest Mississippi River border at approximately 51 miles, confined to its far western tip known as the Jackson Purchase. Tennessee ranks second-shortest at 112 miles."

  - question: "Does the Mississippi River flow through Tennessee?"
    answer: "The Mississippi River forms Tennessee's western border for approximately 112 miles, from the Missouri line south to the Mississippi state line. Memphis, Tennessee's largest city, sits on the east bank of the river at this stretch."

  - question: "Where does the Mississippi River start and end?"
    answer: "The Mississippi River starts at Lake Itasca in Minnesota (rank 1, source state) and ends at the Gulf of Mexico in Louisiana (rank 10, mouth state). Its total length is approximately 2,340 miles."

