faq:
  - question: "Which state gets the most rain?"
    answer: "Hawaii gets the most, averaging 61.74 inches of precipitation a year. Louisiana is the wettest mainland state at 59.73 inches, followed by Mississippi at 58.52 inches."

  - question: "Which state gets the least rain?"
    answer: "Nevada gets the least, averaging 10.18 inches a year. Arizona ranks 49th at 11.65 inches and Utah ranks 48th at 13.53 inches."

  - question: "What is the average rainfall in Washington state?"
    answer: "Washington averages 43.18 inches a year, ranking 27th. The Cascades block most Pacific moisture from reaching the eastern half, which pulls the statewide figure well below what the wet western slopes receive."

  - question: "How much rain does Alaska get a year?"
    answer: "Alaska averages 37.64 inches, ranking 30th. Southeast Alaska's coastal rainforest is very wet, but the interior and the Arctic coast are among the driest parts of the state."

  - question: "Is Oregon one of the rainiest states?"
    answer: "No. Oregon averages 32.14 inches and ranks 35th, barely above the 31.29 inches for the contiguous U.S. Western Oregon is soggy, but the large dry area east of the Cascades pulls the state average down."

  - question: "Does the rainiest state also have the most rainy days?"
    answer: "Not always. Louisiana ranks second here at 59.73 inches, but the states with the most days of rain are in the Northeast and Appalachians, where lighter rain falls more often."

