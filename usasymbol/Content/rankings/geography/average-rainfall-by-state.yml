sections:
  - id: "why-hawaii-is-the-rainiest-state"
    title: "Why Hawaii Is the Rainiest State"
    paragraphs:
      - "Hawaii averages 61.74 inches a year, the most of any state. Steady northeast trade winds carry warm, wet air off the Pacific, and when that air meets the steep volcanic slopes it rises, cools and drops its water on the windward side."
      - "Mount Waialeale on Kauai is often named one of the wettest places on Earth. Leeward coasts sit in the rain shadow of the same mountains and stay far drier, so the statewide figure blends soaked rainforest with sunny beaches."

  - id: "rainiest-states-in-the-south"
    title: "Rainiest States on the Mainland"
    paragraphs:
      - "Louisiana receives 59.73 inches a year, the most on the mainland, with Mississippi at 58.52 and Alabama at 56.87. The Gulf of Mexico supplies warm, humid air nearly year round, and afternoon thunderstorms and passing tropical storms deliver it as heavy rain."
      - "Heavy is the key word. Louisiana and Mississippi get much of their rain in sudden downpours, while states such as West Virginia spread rain over far more days, as the list of [most rainy days by state](/rankings/geography/most-rainy-days-by-state) shows."
    table:
      title: "Ten Rainiest States"
      columns:
        rank: "Rank"
        state: "State"
