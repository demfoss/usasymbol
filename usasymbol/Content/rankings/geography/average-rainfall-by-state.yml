  - id: "driest-state-in-the-us"
    title: "Driest States in the U.S."
    paragraphs:
      - "Nevada averages only 10.18 inches a year, the lowest of any state. The Sierra Nevada forces Pacific storms to climb and unload their moisture on California, so the air that reaches the Great Basin is already wrung out."
      - "Arizona (11.65 inches), Utah (13.53) and New Mexico (13.73) follow, all desert or high plateau country. Arizona gets much of its modest total from summer monsoon storms. The [driest states in the U.S.](/rankings/geography/driest-states-in-the-us) page covers the dry end in more detail."

