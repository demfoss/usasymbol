page:
  h1: "Average Rainfall by State"

  quick_answer:
    - "Hawaii has the highest average rainfall of any state at 61.74 inches a year, because trade winds push moist Pacific air up steep volcanic slopes."
    - "Louisiana leads the mainland at 59.73 inches, followed by Mississippi at 58.52 and Alabama at 56.87. Warm Gulf of Mexico moisture feeds the heavy rain across the Southeast."
    - "Nevada receives the least at 10.18 inches a year, because the Sierra Nevada strips moisture from Pacific storms before they cross the Great Basin. Arizona is next driest at 11.65 inches."

  methodology: "Average annual precipitation in inches for 1991-2020, summed from monthly statewide normals in NOAA NCEI nClimDiv. Totals count rain and melted snow. The national value is the contiguous U.S. average."

