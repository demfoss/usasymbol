faq:
  - question: "How many states are landlocked?"
    answer: "27 U.S. states have no ocean coastline. They include 16 single-landlocked states (one state away from the ocean or Great Lakes), 10 double-landlocked states (two states away), and one triple-landlocked state: Nebraska. The 23 ocean-coastal states include all Atlantic, Pacific, and Gulf of Mexico states, plus Alaska and Hawaii."

  - question: "What is the most landlocked state in the United States?"
    answer: "Nebraska is the most landlocked state in the United States — the only state where all six bordering states are also landlocked, and all of those states' neighbors are also landlocked. Reaching any ocean from Lincoln, Nebraska requires crossing at least two additional landlocked states in every direction. The nearest ocean coast is the Gulf of Mexico, approximately 1,200 miles away."

  - question: "Which states are double-landlocked?"
    answer: "Ten states are double-landlocked — no direct neighbor has an ocean or major Great Lakes coast: Colorado, Iowa, Kansas, Minnesota, Missouri, Montana, North Dakota, South Dakota, Utah, and Wyoming. All ten are in the Great Plains or Mountain West. Nebraska is the only triple-landlocked state — one tier deeper than all of these."

  - question: "Do Great Lakes states count as landlocked?"
    answer: "Great Lakes states — Illinois, Indiana, Michigan, Minnesota, Ohio, Pennsylvania, and Wisconsin — have no ocean coastline and are counted among the 27 landlocked states. However, their Great Lakes shorelines connect to the Atlantic Ocean via the St. Lawrence Seaway, making them ocean-accessible ports. Great Lakes states are classified as single-landlocked rather than fully interior states."

  - question: "What percentage of U.S. states are landlocked?"
    answer: "54 percent of U.S. states are landlocked — 27 of 50 states have no ocean coastline. By comparison, roughly one-fifth of the world's countries are landlocked. The U.S. has an unusually high proportion of landlocked states because of the large interior of the North American continent and the rectangular boundaries used to divide the Great Plains and Mountain West."

