faq:
  - question: "What states are in the West?"
    answer: "Thirteen states make up the Census West: Alaska, Arizona, California, Colorado, Hawaii, Idaho, Montana, Nevada, New Mexico, Oregon, Utah, Washington, and Wyoming. The Census divides these into the Mountain division (8 states) and the Pacific division (5 states). The 13-state composition is fixed."

  - question: "How many states are in the West?"
    answer: "There are 13 states in the Census West, making it the second-largest Census region by number of states. The West is the largest region by land area, dominated by Alaska (663,268 sq mi) and California (163,696 sq mi)."

  - question: "What is the largest Western state?"
    answer: "Alaska is the largest Western state — and the largest state in the United States — at 663,268 square miles. Alaska is more than twice the size of Texas. California (163,696 sq mi) is the second-largest West state and the third-largest state overall."

  - question: "What is the smallest Western state?"
    answer: "Hawaii is the smallest West state by area at 10,932 square miles. Wyoming, at approximately 577,000 residents, is the smallest West state by population and the least populous state in the entire United States."

  - question: "What is the most populous Western state?"
    answer: "California is the most populous West state with approximately 39.5 million residents — more than the combined population of the 8 Mountain division states. California is also the most populous state in the United States."

  - question: "What is the difference between Mountain and Pacific division states?"
    answer: "The Census West divides into the Mountain division (Arizona, Colorado, Idaho, Montana, Nevada, New Mexico, Utah, Wyoming) and the Pacific division (Alaska, California, Hawaii, Oregon, Washington). Mountain division states are landlocked interior states. Pacific division states have Pacific Ocean coastline, except Alaska, which borders the Pacific and Arctic Oceans."

