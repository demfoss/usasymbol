page:
  h1: "West States: Full Census List, Map, and Divisions"

  quick_answer:
    - "Thirteen states make up the Census West: Alaska, Arizona, California, Colorado, Hawaii, Idaho, Montana, Nevada, New Mexico, Oregon, Utah, Washington, and Wyoming. California, with approximately 39.5 million residents, is the most populous state in the country."
    - "Alaska (663,268 sq mi) is the largest state in the country by a wide margin — more than twice the size of Texas. It is also the least densely populated state at approximately 733,000 residents spread across 663,268 square miles. Hawaii is the only island state and the only West state with no land border with any other state."
    - "The Census West divides into the Mountain division (Arizona, Colorado, Idaho, Montana, Nevada, New Mexico, Utah, Wyoming) and the Pacific division (Alaska, California, Hawaii, Oregon, Washington). Wyoming (576,851 residents) is the least populous state in the country."

  methodology: "The West is one of four U.S. Census Bureau geographic regions. Its 13-state composition is fixed and uncontested. The Census further divides the West into the Mountain division (8 states) and the Pacific division (5 states). All 13 states hold equal membership — no state is disputed or sometimes-excluded."

