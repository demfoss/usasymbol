faq:
  - question: "What letter starts the most U.S. state names"
    answer: "M and N are tied for the most common starting letter of U.S. state names. Eight states start with M: Maine, Maryland, Massachusetts, Michigan, Minnesota, Mississippi, Missouri, and Montana. Eight states start with N."

  - question: "How many states start with M"
    answer: "Eight U.S. states start with M: Maine, Maryland, Massachusetts, Michigan, Minnesota, Mississippi, Missouri, and Montana. No other letter ties M except N, which also starts 8 state names."

  - question: "How many states start with N"
    answer: "Eight U.S. states start with N: Nebraska, Nevada, New Hampshire, New Jersey, New Mexico, New York, North Carolina, and North Dakota. Six of these eight are two-word names beginning with 'New' or 'North'."

  - question: "What letters have no U.S. states"
    answer: "Seven letters are not the first letter of any U.S. state name: B, E, J, Q, X, Y, and Z. This is based on the official common names of all 50 states."

  - question: "Which letters start only one U.S. state"
    answer: "Eight letters each begin exactly one state name: D (Delaware), F (Florida), G (Georgia), H (Hawaii), L (Louisiana), P (Pennsylvania), R (Rhode Island), and U (Utah)."

  - question: "Are there more states starting with M or N"
    answer: "Neither. M and N are exactly tied: eight states start with M and eight states start with N. No other letter comes close; A, I, and W each start only 4 state names."

