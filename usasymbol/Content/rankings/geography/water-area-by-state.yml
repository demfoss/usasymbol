sections:
  - id: "why-michigan-has-the-highest-percent-water"
    icon: "fa-solid fa-water"
    title: "Why Michigan Has the Highest Percent Water"
    paragraphs:
      - "Michigan is split into the Upper and Lower Peninsulas, and the two are wrapped by Lakes Superior, Michigan, Huron and Erie. The boundary runs out into the lakes, so the state owns a huge share of open freshwater on top of its inland lakes. That adds up to 40,175 square miles of water."
      - "Only Alaska has more water inside its borders. Explore the lakes behind the figure in [Great Lakes states](/rankings/geography/great-lakes-states) and the [deepest lakes in the U.S.](/rankings/geography/deepest-lakes-in-the-us)."

  - id: "states-with-the-most-water-area"
    icon: "fa-solid fa-droplet"
    title: "States With the Most Water Area"
    paragraphs:
      - "Alaska counts 94,743 square miles of water, more than twice Michigan's. Its coast is cut by fjords, bays and river deltas, and the Yukon, Kuskokwim and Copper river systems spread across the interior. Even so, water is only 14.2% of Alaska's vast total area, which is why it sits eleventh by share."
      - "Florida is third at 12,133 square miles. Lake Okeechobee, the Everglades and the Gulf and Atlantic coastal waters all count. Louisiana's bayou and marsh country adds 9,174 square miles, and Wisconsin's share of Lakes Michigan and Superior brings 11,339."
