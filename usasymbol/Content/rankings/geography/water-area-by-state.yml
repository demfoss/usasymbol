  description: "Michigan is 41.5% water, the highest share of any state, with Hawaii at 41.2%. Alaska has the most water by area at 94,743 square miles."

page:
  h1: "Water Area by State"

  quick_answer:
    - "Water area by state peaks in Michigan, where 41.5% of the total area is water. Most of it is Great Lakes shoreline water that falls inside the state boundary, which wraps around four of the five lakes."
    - "Alaska holds the most water in square miles, 94,743, more than twice Michigan's total. New Mexico is the driest on the map at 0.2%, a high desert state with only a few reservoirs and the Rio Grande."
    - "Hawaii (41.2%) and Rhode Island (33.1%) follow Michigan. Both are counted with their surrounding coastal waters, which is why small island and bay states rank so high."

  methodology: "Total water area and percent water (water area divided by total area) for the 50 states, in square miles, from the Census Bureau's 2010 state area measurements. Water counts inland, coastal and Great Lakes water inside state boundaries."

  sources:
    - name: "U.S. Census Bureau, State Area Measurements and Internal Point Coordinates"
      url: "https://www.census.gov/geographies/reference-files/2010/geo/state-area.html"
      description: "Total, land and water area in square miles for every state"

