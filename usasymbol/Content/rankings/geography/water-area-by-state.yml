faq:
  - question: "Which state has the most water?"
    answer: "Alaska, with 94,743 square miles of water. That is more than Michigan and Florida combined."

  - question: "What percent of Michigan is water?"
    answer: "41.5%, or 40,175 square miles out of 96,714. The figure includes the parts of Lakes Superior, Michigan, Huron and Erie inside the state boundary."

  - question: "Is Hawaii more water than land?"
    answer: "Not quite. Hawaii has 4,509 square miles of water and 6,423 of land, so water makes up 41.2% of its total area. Only Michigan has a higher share."

  - question: "Which state has the least water?"
    answer: "New Mexico, at 0.2% or 292 square miles. Arizona (0.3%) and Colorado (0.4%) are close behind."

  - question: "How much of Florida is water?"
    answer: "18.5%, or 12,133 square miles, the third largest water area of any state. Lake Okeechobee, the Everglades and thousands of smaller lakes explain most of the inland share."

  - question: "How much of the United States is water?"
    answer: "About 7.0% of the total area of the 50 states and Washington, D.C. is water, or 264,837 of 3,796,742 square miles."

