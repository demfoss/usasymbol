  - id: "small-states-with-the-highest-percent-water"
    icon: "fa-solid fa-anchor"
    title: "Small States With the Highest Water Share"
    paragraphs:
      - "Rhode Island, Massachusetts, Maryland and Delaware all rank in the top six because their land is tiny and a big bay or ocean sound sits inside their lines. Narragansett Bay carves deep into Rhode Island, the Ocean State, and Maryland holds much of the Chesapeake Bay. Hawaii's 41.2% comes from the sea around its islands."
      - "At the other end, New Mexico has only 292 square miles of water. It is a high desert where the Rio Grande and a few reservoirs are almost the only large bodies of water. See [states with no natural lakes](/rankings/geography/states-with-no-natural-lakes) for another dry-land view."

