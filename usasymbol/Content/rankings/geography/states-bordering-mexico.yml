faq:
  - question: "How many U.S. states border Mexico?"
    answer: "4 U.S. states border Mexico: California, Arizona, New Mexico, and Texas. The total U.S.-Mexico border is approximately 1,954 miles. Texas has the longest section at 1,254 miles. California has the shortest at 140 miles."

  - question: "Name one state that borders Mexico?"
    answer: "Any of the 4 qualifying states is a correct answer: California, Arizona, New Mexico, or Texas. This is a common U.S. civics study question. Texas (1,254 mi) has the longest border with Mexico, covering 64% of the total 1,954-mile boundary. California (140 mi) has the shortest."

  - question: "Which state has the longest border with Mexico?"
    answer: "Texas has the longest U.S. border with Mexico at approximately 1,254 miles, about 64% of the entire 1,954-mile U.S.-Mexico boundary. The Texas-Mexico border follows the Rio Grande from El Paso west to the Gulf of Mexico near Brownsville, running through four Mexican states: Chihuahua, Coahuila, Nuevo León, and Tamaulipas."

  - question: "Which state has the shortest border with Mexico?"
    answer: "California has the shortest border with Mexico at approximately 140 miles. The border runs from the Pacific Ocean east to the Colorado River, where California, Arizona, and Baja California meet. California borders only one Mexican state: Baja California."

  - question: "Does Texas border Mexico by land or by river?"
    answer: "Texas's entire 1,254-mile border with Mexico follows the Rio Grande, a river boundary rather than a surveyed straight line. The other three border states — California (140 mi), Arizona (373 mi), and New Mexico (180 mi) — all have straight surveyed land borders drawn along a parallel established by the Gadsden Purchase of 1853."

  - question: "What Mexican states border the United States?"
    answer: "Six Mexican states border the United States: Baja California (bordering California), Sonora (bordering Arizona), Chihuahua (bordering New Mexico and Texas), Coahuila (bordering Texas), Nuevo León (bordering Texas), and Tamaulipas (bordering Texas). Chihuahua is the only Mexican state that touches two U.S. states, sharing borders with both New Mexico (180 mi) and part of the Texas line."

