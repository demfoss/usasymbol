page:
  h1: "States Bordering Mexico: Full List, Border Lengths, and Mexican States"

  quick_answer:
    - "4 U.S. states border Mexico: California, Arizona, New Mexico, and Texas. The total U.S.-Mexico border is approximately 1,954 miles. Texas has the longest section at 1,254 miles."
    - "Texas's 1,254-mile border follows the Rio Grande, a river boundary that shifts with the river's course. The other three states have straight land borders drawn along surveyed parallels and meridians from the Gadsden Purchase of 1853."
    - "California has the shortest border with Mexico at 140 miles. It is the only one of the four states where the border begins at an ocean, starting at the Pacific coast at Border Field State Park near San Diego."

  methodology: "Border lengths are drawn from U.S. Census TIGER/Line boundary data and International Boundary and Water Commission (IBWC) surveys. The Texas border follows the centerline of the Rio Grande. The California, Arizona, and New Mexico borders follow surveyed straight lines. All figures are approximate and rounded to the nearest mile."

  sources:
    - name: "International Boundary and Water Commission"
      url: "https://www.ibwc.gov/"
      description: "Official U.S.-Mexico joint body managing the Rio Grande boundary and international water treaties"

