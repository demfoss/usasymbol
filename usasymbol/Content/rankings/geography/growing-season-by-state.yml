sections:
  - id: "longest-growing-season-in-the-us"
    title: "Longest Growing Season in the U.S."
    paragraphs:
      - "Hawaii averages 362.4 frost-free days a year, the most of any state. Of its 50 stations, 49 stay above freezing all year, because the islands sit in the tropical Pacific where the ocean keeps nights warm. The exception is a station high on Mauna Loa at about 3,400 meters, which counts 235 days."
      - "Florida ranks second at 331.4 days. Everglades City never freezes in a typical year, while Crestview in the Panhandle has 237 days. Louisiana, Texas and the Deep South follow, and the [hottest states in the U.S.](/rankings/geography/hottest-states-in-the-us) overlap with this top ten."
    table:
      title: "Ten Longest Growing Seasons"
      columns:
        rank: "Rank"
        state: "State"
        avg_growing_season_days: "Avg. Growing Season (days)"
      rows:
