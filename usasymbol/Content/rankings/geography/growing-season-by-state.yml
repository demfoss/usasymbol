faq:
  - question: "What state has the longest growing season?"
    answer: "Hawaii, at 362.4 days a year. On the mainland the longest is Florida at 331.4 days, followed by Louisiana at 275.9 days."

  - question: "What state has the shortest growing season?"
    answer: "Wyoming has the shortest, with 110.6 days between the last spring freeze and the first fall freeze. Montana ranks 49th at 113.4 days."

  - question: "What is the growing season in Texas?"
    answer: "Texas averages 253.9 days and ranks 5th. Dalhart in the Panhandle has 170 days, while McAllen in the Rio Grande Valley has 365."

  - question: "How long is the growing season in Arizona?"
    answer: "Arizona averages 233.4 days, ranking 9th. Phoenix Sky Harbor counts all 365 days, but Flagstaff, at about 2,172 meters, counts only 81."

  - question: "How long is the growing season in Alaska?"
    answer: "Alaska averages 118.4 days and ranks 48th. Stations range from 21 days on the Arctic coast to 218 days at Beaver Falls."

  - question: "What does growing season length mean?"
    answer: "Growing season length is the number of days between the last spring freeze and the first fall freeze, a freeze being a low of 32°F. Tender crops such as tomatoes and squash are usually planted after the last spring freeze."

