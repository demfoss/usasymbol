  - id: "growing-season-in-california"
    title: "Growing Season in California"
    paragraphs:
      - "California ranks 4th at 271.7 days, yet a single average cannot describe it. Bodie, high in the eastern Sierra at about 2,551 meters, counts 14 days, while Bodega on the coast counts a full 365."
      - "Washington splits the same way, from 65 days at Paradise on Mount Rainier to 276 at Olga in the San Juan Islands. Because one state can hold both extremes, the [planting zones by state](/rankings/agriculture/planting-zones-by-state) map, which is built on winter minimum temperatures, gets closer to a specific garden."

