  - id: "shortest-growing-season-in-the-us"
    title: "Shortest Growing Season in the U.S."
    paragraphs:
      - "Wyoming has the shortest growing season at 110.6 days, with Montana at 113.4 and Alaska at 118.4. Wyoming's stations sit on high plains and mountain basins where still, clear nights let cold air settle, and the Darwin Ranch station records only 17 days between freezes."
      - "Alaska ranks 48th. The Arctic coast station at Utqiagvik counts 21 days, yet Beaver Falls in coastal southeast Alaska counts 218. In the lower states, altitude does most of the work, as the [average elevation by state](/rankings/geography/average-elevation-by-state) ranking suggests, and the [coldest states in the U.S.](/rankings/geography/coldest-states-in-the-us) add latitude on top."
