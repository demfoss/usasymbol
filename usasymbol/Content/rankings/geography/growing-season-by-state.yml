page:
  h1: "Growing Season Length by State"

  quick_answer:
    - "Hawaii has the longest growing season of any state at 362.4 frost-free days a year, because almost every station on the islands never sees a freeze."
    - "Florida follows at 331.4 days and Louisiana at 275.9, where warm Gulf and Atlantic water keeps winter cold snaps short."
    - "Wyoming has the shortest season at 110.6 days, with Montana at 113.4 and Alaska at 118.4. Cold air pools in high basins, and the Darwin Ranch station in Wyoming has only 17 days between freezes."

  methodology: "Median days between the last spring and first fall 32°F freeze (50% probability) from NOAA 1991-2020 Climate Normals, averaged across each state's stations. 365 days means no freeze in a typical year. State values are unweighted station means."

  sources:
    - name: "NOAA NCEI U.S. Climate Normals 1991-2020, Annual/Seasonal Normals (ANN-TMIN-PRBGSL-T32FP50)"
      url: "https://www.ncei.noaa.gov/products/land-based-station/us-climate-normals"
    - name: "NOAA NCEI Climate Normals Annual/Seasonal Data Archive"
      url: "https://www.ncei.noaa.gov/data/normals-annualseasonal/1991-2020/archive/"

