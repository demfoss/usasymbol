page:
  h1: "Great Lakes States"

  quick_answer:
    - "8 states have Great Lakes shoreline, Illinois, Indiana, Michigan, Minnesota, New York, Ohio, Pennsylvania, and Wisconsin. Michigan borders 4 of the 5 Great Lakes and has 3,224 miles of coastline, more than any other state."
    - "Pennsylvania has the shortest Great Lakes shoreline of any of the 8 states, approximately 51 miles along Lake Erie. Indiana is second shortest at 45 miles, also along Lake Michigan. Both states touch only one Great Lake."
    - "Lake Michigan is the only Great Lake touched exclusively by U.S. states, Illinois, Indiana, Michigan, and Wisconsin all border it, with no Canadian shoreline. The other four lakes are shared with Canada."

  methodology: "Great Lakes states are defined as the 8 U.S. states with direct shoreline on one or more of the five Great Lakes, rather than the broader 'Great Lakes region' used in some economic and governmental contexts. Shoreline lengths are approximate per NOAA Great Lakes Environmental Research Laboratory."

  sources:
    - name: "NOAA Great Lakes Environmental Research Laboratory"
      url: "https://www.glerl.noaa.gov/data/now/wlevels/dbd/levels.html"
      description: "NOAA's authoritative data on Great Lakes physical characteristics including shoreline lengths, surface areas, depths, and water levels by state"
    - name: "Great Lakes Commission"
      url: "https://www.glc.org/about/greatlakes"
      description: "The Great Lakes Commission, a statutory interstate compact agency representing all 8 Great Lakes states and 2 Canadian provinces, with geographic and economic data on the region"

