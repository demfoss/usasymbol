faq:
  - question: "What states are in the Great Lakes region?"
    answer: "8 states have Great Lakes shoreline: Illinois, Indiana, Michigan, Minnesota, New York, Ohio, Pennsylvania, and Wisconsin. These are the states with direct coastal access to one or more of the five Great Lakes. A broader 'Great Lakes region' used in some economic contexts can include additional states, but the 8-state definition is the standard geographic one."

  - question: "How many states touch the Great Lakes?"
    answer: "8 U.S. states touch the Great Lakes: Illinois, Indiana, Michigan, Minnesota, New York, Ohio, Pennsylvania, and Wisconsin. The five Great Lakes also border two Canadian provinces — Ontario and Quebec — on their northern and eastern shores."

  - question: "Which state has the most Great Lakes shoreline?"
    answer: "Michigan has the most Great Lakes shoreline by far — approximately 3,224 miles, which exceeds the combined shoreline of the other 7 Great Lakes states. Michigan borders 4 of the 5 Great Lakes: Superior, Michigan, Huron, and Erie. Its unusual shape, with two peninsulas, gives it more lake coastline than any other state."

  - question: "Which Great Lake does Illinois border?"
    answer: "Illinois borders only Lake Michigan, along approximately 63 miles of shoreline in the Chicago metropolitan area. Illinois has the second-shortest Great Lakes shoreline of any state, but Chicago — located at the southwestern corner of Lake Michigan — is the largest city on any Great Lake."

  - question: "Does Pennsylvania border the Great Lakes?"
    answer: "Yes. Pennsylvania borders Lake Erie along a 51-mile strip in its northwestern corner. Erie is the only Great Lakes city in Pennsylvania. This narrow strip is Pennsylvania's sole connection to the Great Lakes and gives the state access to water-borne trade with the interior of North America."

  - question: "Which Great Lake is entirely in the United States?"
    answer: "Lake Michigan is the only Great Lake lying entirely within the United States. All of its shoreline belongs to four U.S. states — Illinois, Indiana, Michigan, and Wisconsin. The other four Great Lakes — Superior, Huron, Erie, and Ontario — all share their northern or eastern shores with Canada."

