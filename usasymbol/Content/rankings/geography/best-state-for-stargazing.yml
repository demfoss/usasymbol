page:
  h1: "Best State for Stargazing"

  quick_answer:
    - "South Dakota ranks as the best state for stargazing, with a star visibility score of 7.79 out of 10 and 52.66% of its land falling under Bortle 1-3 dark skies."
    - "Wyoming ranks second at 7.65, helped by statewide light pollution laws. Arizona posts the lowest cloud cover of any top-10 state at 6.7% annually, even though it ranks fifth overall."
    - "Rhode Island scores just 0.56 out of 10, with only 0.05% of its land reaching Bortle 1-3 darkness and 14.5% average cloud cover, the steepest contrast in the rankings."

  methodology: "Star visibility scores weigh each state's Bortle scale dark-sky share against average annual cloud cover, from a Live Casinos study. Certified Dark Sky Places counts are listed by World Population Review, based on DarkSky International data."

  sources:
    - "Live Casinos stargazing study, via Mental Floss and Vice"
    - "World Population Review, Darkest States 2026, citing DarkSky International"
    - "DarkSky International, International Dark Sky Places program"

