sections:
  - id: "why-south-dakota-ranks-first"
    icon: "fa-solid fa-star"
    title: "Why South Dakota Has the Best Stargazing"
    paragraphs:
      - "South Dakota tops the ranking with a 7.79 star visibility score, built on 52.66% of the state falling within Bortle 1-3 dark skies. Its 9.42% share of Bortle 1 territory is the highest of any state in the country."
      - "Cloud cover stays low at 11.65% annually, so clear nights are common. That combination of dark, open land and low cloud cover is what separates South Dakota from Wyoming and Alaska, the next two states on the list."

