faq:
  - question: "What is the best state for stargazing?"
    answer: "South Dakota ranks first with a star visibility score of 7.79 out of 10. The state combines 52.66% Bortle 1-3 dark sky coverage with low annual cloud cover of 11.65%."

  - question: "What is the worst state for stargazing?"
    answer: "Rhode Island scores lowest at 0.56 out of 10. Only 0.05% of its land reaches Bortle 1-3 darkness, and cloud cover averages 14.5% annually."

  - question: "Which state has the most certified Dark Sky Places?"
    answer: "Utah has 19 certified International Dark Sky Places, the most of any state. Arizona has 9, and New Mexico has 8."

  - question: "Which state has the least cloud cover for stargazing?"
    answer: "Arizona averages just 6.7% annual cloud cover, the lowest of any state in the top 10. Its overall star visibility score of 7.37 ranks fifth, behind states with darker skies but more cloud cover."

  - question: "Does Wyoming have light pollution laws?"
    answer: "Yes. Wyoming is one of the few states with active statewide light pollution laws. It ranks second overall with a 7.65 star visibility score, and Hot Springs County within the state scores 8.71."

  - question: "Which states rank in the top five for stargazing?"
    answer: "South Dakota (7.79), Wyoming (7.65), Alaska (7.64), Montana (7.51), and Arizona (7.37) make up the top five. All five are western or Great Plains states."

