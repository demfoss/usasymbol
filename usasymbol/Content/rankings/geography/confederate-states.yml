faq:
  - question: "What states were in the Confederacy?"
    answer: "Eleven states formally seceded to form the Confederacy: South Carolina, Mississippi, Florida, Alabama, Georgia, Louisiana, Texas, Virginia, Arkansas, North Carolina, and Tennessee. South Carolina was first (December 20, 1860); Tennessee was last (June 8, 1861). Kentucky and Missouri had Confederate governments recognized by the CSA but never completed formal secession."

  - question: "How many Confederate states were there?"
    answer: "There were 11 formally seceding Confederate states. The Confederate government claimed 13 states by including Kentucky and Missouri, whose Confederate-aligned provisional governments were recognized by the Confederate Congress in November 1861. The Confederate Battle Flag reflects this claim with 13 stars."

  - question: "What was the first Confederate state?"
    answer: "South Carolina was the first Confederate state, seceding on December 20, 1860, by a convention vote of 169 to 0. Fort Sumter, in Charleston Harbor, is where Confederate forces fired the opening shots of the Civil War on April 12, 1861 — nearly four months after South Carolina's secession."

  - question: "What was the last Confederate state?"
    answer: "Tennessee was the last of the 11 states to formally secede, on June 8, 1861, by a popular referendum of 104,913 to 47,238. East Tennessee voted against secession by a 2-to-1 margin but was overruled. Tennessee was admitted to the Confederacy on July 2, 1861."

  - question: "Why did the Confederate flag have 13 stars?"
    answer: "The Confederate Battle Flag has 13 stars because the Confederacy counted 13 member states: the 11 that formally seceded, plus Kentucky and Missouri. Both states had Confederate provisional governments recognized by the Confederate Congress in November 1861 — Kentucky on November 20 and Missouri on November 28. Neither state's full legislature ever passed a secession ordinance."

  - question: "What was the Confederate capital?"
    answer: "The Confederacy had two capitals. Montgomery, Alabama, was the first capital, from February 18 to May 29, 1861. Richmond, Virginia, became the permanent capital on May 29, 1861, and remained so until Union forces captured it on April 3, 1865. The Virginia State Capitol, designed by Thomas Jefferson, served as the Confederate Capitol."

