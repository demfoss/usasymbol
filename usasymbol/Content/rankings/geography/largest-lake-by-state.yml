faq:
  - question: "What is the largest lake in the United States inside a single state?"
    answer: "The Great Salt Lake in Utah, at about 1,700 square miles. Alaska's Iliamna Lake is next at 1,014 square miles and is the largest freshwater lake that sits entirely in one state."
  - question: "What is the largest lake in Florida?"
    answer: "Lake Okeechobee, at 730 square miles. It is shallow and sits just north of the Everglades, and it is the largest natural freshwater lake in the lower 48 that lies wholly in one state."
  - question: "What is the largest lake in Michigan?"
    answer: "Houghton Lake, at 31 square miles. Michigan touches four of the Great Lakes, but those are shared with other states and Canada, so the biggest lake wholly inside the state is much smaller. See the [Great Lakes states](/rankings/geography/great-lakes-states) for the shared waters."
  - question: "What is the largest lake in Texas?"
    answer: "Sam Rayburn Reservoir, at 179 square miles. Texas has almost no large natural lakes, so its biggest lakes were created by dams."
  - question: "What is the largest lake in California?"
    answer: "The Salton Sea, at 343 square miles. It formed in 1905 when the Colorado River broke through an irrigation canal and flowed into the desert basin for about two years."
  - question: "Which state's largest lake is the smallest?"
    answer: "Delaware, where Lums Pond covers 0.31 square miles. Hawaii is next at 0.47 square miles."
