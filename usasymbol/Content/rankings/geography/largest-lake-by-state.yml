sections:
  - id: why-utah-has-the-largest-lake
    icon: "fa-solid fa-water"
    title: "Why Utah Has the Largest Lake"
    paragraphs:
      - "Utah's Great Salt Lake covers about 1,700 square miles because it is a terminal lake. The Bear, Weber and Jordan rivers pour in, nothing flows out, and the water leaves only by evaporation. That leaves the salt behind, which is why the lake is far saltier than the ocean."
      - "Its size swings with snowfall and drought, so the area can fall well below that figure in dry years. Alaska's Iliamna Lake, at 1,014 square miles, is the largest freshwater lake in the table and drains into Bristol Bay, home to the biggest sockeye salmon runs on Earth. For states with the most water overall, see [water area by state](/rankings/geography/water-area-by-state)."
