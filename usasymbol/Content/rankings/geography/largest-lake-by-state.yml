seo:
  title: "Largest Lake in Each State | Map & Facts"
  description: "Utah's Great Salt Lake is the largest lake inside one state at about 1,700 square miles. Alaska's Iliamna Lake follows at 1,014 and Florida's Okeechobee at 730."
page:
  h1: "Largest Lake in Each U.S. State"
  quick_answer:
    - "Utah has the largest lake wholly inside one state, the Great Salt Lake, at about 1,700 square miles. It has no outlet, so the water leaves only by evaporation and the lake grows salty."
    - "Alaska's Iliamna Lake covers 1,014 square miles and is the largest freshwater lake in the table. Florida's Lake Okeechobee follows at 730 square miles, a shallow basin in the Everglades watershed."
    - "Delaware sits last. Lums Pond, a man-made pond, covers just 0.31 square miles. Hawaii's biggest lake, the Wahiawa Reservoir on Oahu, covers 0.47 square miles."
  methodology: "Each state's largest lake lying wholly inside its borders, natural or man-made, by surface area in square miles. Data from Lakepedia, checked against the Wikipedia list of largest U.S. lakes. Shared lakes such as the Great Lakes and Lake Tahoe are excluded. Great Salt Lake area changes with water level and ranges from about 950 to over 1,700 square miles."
