faq:
  - question: "What state has the highest average humidity?"
    answer: "Louisiana has the highest average annual relative humidity at 74.0%, based on readings near New Orleans. Michigan, Mississippi, and Washington are tied for second at 72.5%."

  - question: "What state has the lowest average humidity?"
    answer: "Arizona has the lowest average relative humidity at 39.0%, based on readings from Tucson. New Mexico is next at 44.5%, more than 5 points higher."

  - question: "What is the average humidity in Florida?"
    answer: "Florida averages 72.0% relative humidity, tied with Oregon for fifth place among the 50 states. That figure is based on readings from Tampa."

  - question: "What is the average humidity in Arizona?"
    answer: "Arizona averages 39.0% relative humidity, the lowest of any state, based on Tucson weather station readings. It ranks about 35 percentage points below Louisiana's 74.0%."

  - question: "How is average annual humidity calculated for this ranking?"
    answer: "Each state's figure combines its morning (4-6 a.m.) and afternoon (3-5 p.m.) relative humidity averages from a representative weather station, since no single statewide humidity measurement exists. The two readings are averaged and rounded to the nearest tenth of a percent."

  - question: "Which states have humidity above 70%?"
    answer: "Fourteen states average above 70%: Louisiana (74.0%), Michigan, Mississippi, and Washington (72.5% each), Florida and Oregon (72.0% each), Maine and New York (71.5% each), New Jersey, West Virginia, and Wisconsin (71.0% each), and Alaska, Illinois, and Indiana (70.5% each)."

