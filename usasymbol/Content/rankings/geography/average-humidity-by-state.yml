    - "Louisiana has the highest average annual relative humidity in the U.S., at 74.0%, based on morning and afternoon readings near New Orleans."
    - "Michigan, Mississippi, and Washington tie for second at 72.5%, each more than 33 percentage points above the driest state in the ranking."
    - "Arizona has the lowest average humidity, at 39.0%, based on readings from Tucson, about 35 percentage points below Louisiana's 74.0%."

  methodology: "Figures combine morning (4-6 a.m.) and afternoon (3-5 p.m.) relative humidity averages recorded at a representative weather station for each state, since no direct statewide humidity measurement exists. Values are averaged and rounded to the nearest tenth of a percent."

