sections:
  - id: "states-with-the-highest-humidity"
    icon: "fa-solid fa-droplet"
    title: "States With the Highest Humidity"
    paragraphs:
      - "Louisiana tops the list at 74.0% average relative humidity, based on readings near New Orleans. Michigan, Mississippi, and Washington follow in a three-way tie at 72.5%, and Florida and Oregon tie for fifth at 72.0%."
      - "Nine more states sit between 71.0% and 71.5%: Maine, New York, New Jersey, West Virginia, and Wisconsin among them. All 11 top states are Gulf Coast, Great Lakes, Northeast, or Pacific Northwest states."

  - id: "states-with-the-lowest-humidity"
    icon: "fa-solid fa-sun"
    title: "States With the Lowest Humidity"
    paragraphs:
      - "Arizona has the lowest average relative humidity at 39.0%, based on Tucson readings. New Mexico ranks second-lowest at 44.5%, and Colorado follows at 47.5%."
      - "Nevada (51.5%), Wyoming (53.0%), Idaho (54.5%), and Utah (55.0%) round out the bottom seven. Every one of these seven states sits in the interior Southwest or Mountain West."

