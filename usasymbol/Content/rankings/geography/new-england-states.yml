faq:
  - question: "What states are in New England?"
    answer: "Six states make up New England: Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, and Vermont. The six-state boundary is fixed and uncontested — it is a formal U.S. Census geographic division and has been defined consistently since the colonial era."

  - question: "How many states are in New England?"
    answer: "There are six states in New England: Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, and Vermont. No other states are included in any standard definition of New England."

  - question: "What is the largest New England state?"
    answer: "Maine is the largest New England state by area, at 35,380 square miles. It is more than three times the size of the next-largest New England state (Massachusetts, at 10,554 square miles) and accounts for more than half of the region's total land area."

  - question: "What is the smallest New England state?"
    answer: "Rhode Island is the smallest New England state, at 1,545 square miles — and also the smallest state in the entire United States. Its full official name is Rhode Island and Providence Plantations. Despite its size, Rhode Island was the first colony to declare independence from Britain (May 4, 1776)."

  - question: "Why is New England called New England?"
    answer: "Captain John Smith named the region in 1616 in his book 'A Description of New England,' based on his 1614 coastal survey. He chose the name to attract English colonists and to appeal to King James I, who approved it. The name replaced the earlier French label 'Norumbega' and has been used continuously for more than 400 years."

  - question: "Which New England state was last to join the Union?"
    answer: "Maine was the last New England state to achieve statehood, on March 15, 1820, as the 23rd state. Maine had been part of Massachusetts since 1652. It separated under the Missouri Compromise, which admitted Maine as a free state and Missouri as a slave state simultaneously."

