faq:
  - question: "What states are in the Northeast?"
    answer: "Nine states make up the Census Northeast: Connecticut, Maine, Massachusetts, New Hampshire, New Jersey, New York, Pennsylvania, Rhode Island, and Vermont. The region divides into two Census divisions: New England (6 states) and Middle Atlantic (New Jersey, New York, Pennsylvania)."

  - question: "How many states are in the Northeast?"
    answer: "There are 9 states in the Census Northeast. The six New England states (Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, Vermont) plus New Jersey, New York, and Pennsylvania make up the full region. The boundary is fixed — no other states are included."

  - question: "What is the largest Northeast state?"
    answer: "New York is the largest Northeast state by both population and area. It has approximately 20.2 million residents and covers 54,555 square miles. New York City, with approximately 8.3 million residents, is the largest city in the United States."

  - question: "What is the smallest Northeast state?"
    answer: "Rhode Island is the smallest Northeast state at 1,545 square miles — and also the smallest state in the entire United States. Vermont is the least populous Northeast state at approximately 643,000 residents."

  - question: "Is New York in New England?"
    answer: "No. New York is part of the Census Northeast but is not a New England state. New England consists of 6 states: Connecticut, Maine, Massachusetts, New Hampshire, Rhode Island, and Vermont. New York is in the Middle Atlantic Census division, along with New Jersey and Pennsylvania."

  - question: "What is the most densely populated Northeast state?"
    answer: "New Jersey is the most densely populated state in the entire United States, with approximately 1,263 residents per square mile. Its population of approximately 9.3 million is packed into just 8,723 square miles, placing it between New York City to the north and Philadelphia to the southwest."

