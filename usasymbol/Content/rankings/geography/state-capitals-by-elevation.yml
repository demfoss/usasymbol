faq:
  - question: "What is the highest elevation state capital in the US"
    answer: "Santa Fe, New Mexico is the highest elevation state capital in the United States at 7,199 feet (2,194 m) above sea level. It sits on the western flank of the Sangre de Cristo Mountains in northern New Mexico."

  - question: "Is Denver the highest elevation state capital"
    answer: "No. Denver ranks third at 5,280 feet (1,609 m). Santa Fe, New Mexico (7,199 ft) and Cheyenne, Wyoming (6,062 ft) are both higher. Denver's 'Mile High City' label is accurate, but it ranks third among all state capitals by elevation."

  - question: "What is the lowest elevation state capital"
    answer: "Providence, Rhode Island is the lowest elevation state capital at 10 feet (3 m) above sea level. Honolulu, Hawaii (18 ft) and Boston, Massachusetts (19 ft) are next. Juneau, Alaska sits at 33 feet, hemmed by mountains on a tidewater channel."

  - question: "How much higher is Santa Fe than Denver"
    answer: "Santa Fe is 1,919 feet higher than Denver. Santa Fe sits at 7,199 feet (2,194 m) and Denver at 5,280 feet (1,609 m). Cheyenne, Wyoming at 6,062 feet also exceeds Denver by 782 feet."

  - question: "What is the elevation of Cheyenne Wyoming"
    answer: "Cheyenne, Wyoming sits at 6,062 feet (1,848 m) above sea level, making it the second-highest state capital in the United States. It sits on the eastern slope of the Laramie Range, 782 feet above Denver."

  - question: "Which state capitals are below 40 feet above sea level"
    answer: "Eight state capitals sit below 40 feet: Providence, RI (10 ft), Honolulu, HI (18 ft), Boston, MA (19 ft), Sacramento, CA (30 ft), Hartford, CT (30 ft), Juneau, AK (33 ft), Dover, DE (33 ft), and Annapolis, MD (36 ft)."

