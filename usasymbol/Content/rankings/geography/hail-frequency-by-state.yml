sections:
  - id: "why-texas-leads-in-hailstorms"
    icon: "fa-solid fa-cloud-bolt"
    title: "Why Texas Leads the U.S. in Hailstorms"
    paragraphs:
      - "Texas recorded 1,243 hailstorms from 2012 to 2021, nearly double Iowa's 685. Texas anchors the southern end of Hail Alley, a region that runs from southwest Texas northeastward to northwest Missouri, then northwestward into western South Dakota, tracing the Rocky Mountain Front Range into eastern New Mexico and west Texas."
      - "A 2012 study cited in the source material found that the Great Plains area experiences the most hailstorms of any U.S. region. Nebraska, Oklahoma, and South Dakota all rank in the top ten, each falling within that same Hail Alley corridor."

  - id: "why-colorado-hail-causes-so-much-damage"
    icon: "fa-solid fa-mountain"
    title: "Why Colorado Hail Causes So Much Damage"
    paragraphs:
      - "Colorado ranks just 26th by storm count, with 38 hailstorms recorded from 2012 to 2021, yet its decade damage total of $1.2 billion trails only Texas. Higher elevation is the reason: thinner air at altitude reduces drag on falling hailstones and increases the kinetic energy they carry on impact."
      - "Storms in the Front Range and adjacent High Plains also tend to produce more hailstones per square foot than storms elsewhere in the country, according to the Insurance Institute for Business & Home Safety."

  - id: "states-with-frequent-hail-outside-the-great-plains"
    icon: "fa-solid fa-map"
    title: "States With Frequent Hail Outside the Great Plains"
    paragraphs:
      - "South Carolina ranks fifth with 302 hailstorms, ahead of Kansas at 192 and both Dakotas, despite sitting outside the traditional Hail Alley corridor. Mississippi ranks sixth with 288 storms and $565.3 million in damage, the third-highest damage total of any state. Georgia rounds out the top ten at 144 storms."

