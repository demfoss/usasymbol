page:
  h1: "Hail Frequency by State"

  quick_answer:
    - "Texas recorded 1,243 hailstorms between 2012 and 2021, more than any other state and nearly double second-ranked Iowa's 685. Nebraska, Oklahoma, and South Carolina round out the top five."
    - "Colorado ranks 26th by hailstorm count with just 38 storms, yet recorded $1.2 billion in property damage over the decade, the second-highest total behind Texas's $6.5 billion."
    - "Six states, including Alaska, Hawaii, and Rhode Island, saw too little hail activity over the decade to be ranked separately in the underlying study."

  methodology: "Hailstorm counts and property damage totals are drawn from the NOAA Storm Events Database for 2012 through 2021, covering storms that caused reported property damage. Six low-activity states were not separately ranked in the source study."

  sources:
