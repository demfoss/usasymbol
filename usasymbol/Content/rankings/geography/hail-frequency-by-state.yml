faq:
  - question: "What state has the most hailstorms?"
    answer: "Texas recorded 1,243 hailstorms between 2012 and 2021, the most of any state. Iowa is second with 685, and Nebraska is third with 548."

  - question: "What states are in Hail Alley?"
    answer: "Hail Alley runs from southwest Texas northeastward to northwest Missouri, then northwestward into western South Dakota, following the Rocky Mountain Front Range into eastern New Mexico and west Texas. Texas, Nebraska, Oklahoma, Kansas, South Dakota, and North Dakota all rank in the top nine by storm count."

  - question: "Why does Colorado have such damaging hail?"
    answer: "Colorado's higher elevation reduces air density, which lowers drag on falling hailstones and raises the kinetic energy they carry on impact. With only 38 hailstorms recorded from 2012 to 2021, Colorado still posted $1.2 billion in damage, second only to Texas."

  - question: "What state has the least hail?"
    answer: "Connecticut, Maine, Massachusetts, and New Hampshire each recorded just two hailstorms between 2012 and 2021, the fewest among ranked states. Six additional states, including Alaska, Hawaii, and Rhode Island, saw too little hail activity to be ranked at all."

  - question: "How much hail damage does Mississippi have?"
    answer: "Mississippi recorded $565.3 million in hail damage from 2012 to 2021, the third-highest total of any state, despite ranking sixth by storm count at 288 hailstorms."

  - question: "Which state has the highest hail damage costs?"
    answer: "Texas leads with $6.5 billion in hail damage from 2012 to 2021. Colorado is second at $1.2 billion, and Mississippi is third at $565.3 million."

