  title: "Record High Temperature by State | Map, Dates & Places"
  description: "Death Valley's 134°F in 1913 is California's record and the official world record. Alaska and Hawaii share the lowest state record, 100°F."

page:
  h1: "Record High Temperature by State"

  quick_answer:
    - "Record high temperature by state peaks in California, where Death Valley hit 134°F on July 10, 1913. The desert basin sits below sea level and traps heated air between steep mountains."
    - "Alaska and Hawaii share the lowest state record, 100°F. Ocean all around keeps Hawaii from overheating, and Alaska's mark came at Fort Yukon, just north of the Arctic Circle, in 1915."
    - "The summer of 1936 still holds more state records than any other year. Eleven states list a 1936 date, from North Dakota's 121°F at Steele to New Jersey's 110°F at Runyon."

  methodology: "Official all-time state maximum temperatures reviewed by NOAA's State Climate Extremes Committee, as compiled on Wikipedia. Where a record has been tied, the most recent date and place are shown."

  sources:
    - name: "NOAA NCEI, State Climate Extremes Committee records"
