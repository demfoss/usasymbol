sections:
  - id: "why-death-valley-is-so-hot"
    icon: "fa-solid fa-sun"
    title: "Why Death Valley Is So Hot"
    paragraphs:
      - "California holds the highest state record, 134°F at Greenland Ranch in Death Valley on July 10, 1913. The valley floor drops to 282 feet below sea level at Badwater Basin, the lowest point in North America."
      - "Steep mountain walls surround the basin. Sunlight bakes the bare rock and salt flats, the heated air rises, cools against the mountains, and sinks back down to be heated again. Some meteorologists doubt the 1913 reading, but it remains the official world record."

  - id: "dust-bowl-heat-wave-and-state-records"
    icon: "fa-solid fa-wind"
    title: "Dust Bowl Heat Wave and State Records"
    paragraphs:
      - "Eleven states still list a 1936 record, more than any other year. The heat struck in the middle of the Dust Bowl, when years of drought had dried out the soil across the Plains and Midwest."
      - "Dry ground cannot cool itself by evaporating water, so the sun's energy went straight into heating the air. North Dakota hit 121°F at Steele that July, matching Kansas for the highest record of any state on the Canadian border or the Great Plains."
