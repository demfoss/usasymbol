faq:
  - question: "What is the hottest temperature ever recorded in Texas?"
    answer: "120°F, reached at Monahans on June 28, 1994. The same temperature had been recorded at Seymour in 1936."

  - question: "What is the hottest temperature ever recorded in Florida?"
    answer: "109°F at Monticello on June 29, 1931. Sea breezes and humid air keep Florida from the extreme spikes seen in desert states, even though its summers are long."

  - question: "What state has the highest record temperature?"
    answer: "California, with 134°F in Death Valley on July 10, 1913. Arizona is second at 128°F, set at Lake Havasu City in 1994."

  - question: "What state has the lowest record high temperature?"
    answer: "Alaska and Hawaii tie at 100°F. Hawaii's record came at Pahala in 1931, and Alaska's at Fort Yukon in 1915."

  - question: "What is the hottest temperature ever recorded in Arizona?"
    answer: "128°F at Lake Havasu City on June 29, 1994, the highest reading in any state outside California."

  - question: "Has it ever been 100 degrees in Alaska?"
    answer: "Yes, once on record. Fort Yukon reached 100°F on June 27, 1915, and no Alaska reading has matched it since. The state also holds the [coldest](/rankings/geography/coldest-states-in-the-us) record low in the country."

  - question: "What is the hottest temperature ever recorded in New York?"
    answer: "108°F at Troy on July 22, 1926. New York City's own record is lower, since the city sits right on the Atlantic coast."

