  - id: "recent-state-heat-records"
    icon: "fa-solid fa-temperature-arrow-up"
    title: "Recent State Heat Records"
    paragraphs:
      - "Washington and Oregon both set new records on June 29, 2021, during the Pacific Northwest heat dome. Hanford reached 120°F and Pelton Dam 119°F, in a region where many homes had no air conditioning."
      - "Utah followed two weeks later with 117°F at St. George. Colorado (2019), South Carolina (2012), and South Dakota (2006) are the only other states whose record dates come from this century."

  - id: "states-with-the-lowest-record-high-temperatures"
    icon: "fa-solid fa-water"
    title: "States With the Lowest Record Highs"
    paragraphs:
      - "Alaska and Hawaii share the lowest record, 100°F. Hawaii sits in the middle of the Pacific Ocean, which warms and cools slowly and keeps island air from ever getting extremely hot."
      - "Rhode Island (104°F), Maine (105°F), and Vermont (105°F) come next, cooled by the Atlantic and northern latitude. Compare the averages in the [hottest states in the U.S.](/rankings/geography/hottest-states-in-the-us) to see how records and everyday heat differ."

