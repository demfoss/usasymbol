faq:
  - question: "Which state has the most counties?"
    answer: "Texas has the most counties of any state, with 254. Georgia is second with 159, and Virginia is third with 133."

  - question: "Which state has the fewest counties?"
    answer: "Delaware has the fewest, with just 3 counties. Hawaii and Rhode Island tie for second-fewest at 5 each."

  - question: "Why does Louisiana have parishes instead of counties?"
    answer: "Louisiana has 64 parishes, a term dating to the state's French and Spanish colonial period. They count as county-equivalents in the state total."

  - question: "How many boroughs does Alaska have?"
    answer: "Alaska has 19 organized boroughs plus 11 census areas within its Unorganized Borough, for 30 county-equivalents total. It has no counties at all."

  - question: "How many independent cities does Virginia have?"
    answer: "Virginia has 38 independent cities, counted as county-equivalents alongside the state's 95 counties, for 133 total, more independent cities than any other state. Missouri, Maryland, and Nevada each add just one, St. Louis, Baltimore, and Carson City respectively."

  - question: "How many counties does Connecticut have?"
    answer: "Connecticut has 9 planning regions counted as county-equivalents. They replaced the state's 8 historical counties in 2022."

