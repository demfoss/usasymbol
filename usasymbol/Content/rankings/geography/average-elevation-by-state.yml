sections:
  - id: "why-colorado-has-the-highest-average-elevation"
    icon: "fa-solid fa-mountain"
    title: "Why Colorado Has the Highest Average Elevation"
    paragraphs:
      - "Colorado averages 6,800 feet because the Rocky Mountains run through the western half and the land east of them is a high plateau, not a lowland. The state's lowest point, along the Arikaree River at the Kansas line, is still above 3,000 feet. Denver earns the nickname Mile High City at 5,280 feet, as shown in [state capitals by elevation](/rankings/geography/state-capitals-by-elevation)."
      - "Wyoming (6,700 feet), Utah (6,100 feet), New Mexico (5,700 feet), and Nevada (5,500 feet) complete the top five. All sit on the Rockies or on the high plateaus and basin ranges beside them."
    table:
      columns:
        state: "State"
        elevation: "Average Elevation"
      rows:
        - state: "Colorado"
