  description: "Colorado averages 6,800 feet, the highest of any state, and Wyoming follows at 6,700. Delaware is the lowest at 60 feet."

page:
  h1: "Average Elevation by State"

  quick_answer:
    - "Average elevation by state is highest in Colorado at 6,800 feet. The Rocky Mountains fill the west, and the High Plains in the east already start above 3,000 feet."
    - "Delaware averages just 60 feet, the lowest of any state. Nearly all of it is flat Atlantic coastal plain that slopes gently down to the ocean and the Delaware Bay."
    - "Hawaii averages 3,030 feet, higher than California's 2,900, because its volcanoes rise steeply from the shore. Alaska, home of Denali, averages only 1,900 feet thanks to huge lowlands."

  methodology: "USGS mean elevation of each state above sea level, mostly rounded to the nearest 100 feet. Delaware (60 feet) and Hawaii (3,030 feet) are reported more precisely. Tied states share a rank."

  sources:
    - name: "USGS, Elevations and Distances in the United States"
