  - id: "states-with-the-lowest-average-elevation"
    icon: "fa-solid fa-water"
    title: "States With the Lowest Average Elevation"
    paragraphs:
      - "Delaware averages 60 feet, the lowest of any state. Most of the state is Atlantic coastal plain, with a shoreline on both the ocean and the Delaware Bay, so even its inland ground rises very slowly."
      - "Florida and Louisiana tie at 100 feet. Florida is a limestone platform barely above the water, and Louisiana is built from sediment dropped by the Mississippi River. Rhode Island (200 feet), New Jersey (250 feet), and Mississippi (300 feet) follow. West Virginia, at 1,500 feet, is the highest-averaging state east of the Mississippi, which makes it the exception to the low-lying East."
    table:
      columns:
