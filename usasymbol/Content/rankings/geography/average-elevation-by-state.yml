faq:
  - question: "What is the average elevation of Colorado?"
    answer: "6,800 feet, the highest of any state. Even its lowest ground, at the Kansas border, is above 3,000 feet."

  - question: "What state has the lowest average elevation?"
    answer: "Delaware, at 60 feet. Florida and Louisiana come next, tied at 100 feet."

  - question: "What is the average elevation of Florida?"
    answer: "100 feet. Florida is a low limestone peninsula, and its highest natural point, Britton Hill in the Panhandle, is only 345 feet."

  - question: "What is the average elevation of Texas?"
    answer: "1,700 feet, equal to Washington. Texas climbs gradually from the Gulf Coast in the southeast to the mountains of the far west."

  - question: "Is Hawaii higher than California on average?"
    answer: "Yes, 3,030 feet against 2,900 feet. The Central Valley and the long coast offset the Sierra Nevada, while Hawaii has little flat land away from the shore."

  - question: "What is the average elevation of New Mexico?"
    answer: "5,700 feet, fourth in the nation. Santa Fe, the capital, sits at 7,199 feet, the highest state capital in the country."

