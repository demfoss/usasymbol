  - id: "average-elevation-of-alaska-and-hawaii"
    icon: "fa-solid fa-volcano"
    title: "Average Elevation of Alaska and Hawaii"
    paragraphs:
      - "Alaska averages 1,900 feet, the same as North Dakota, even though Denali towers over it. Vast stretches of the state are lowland, including the North Slope, the Yukon-Kuskokwim delta, and a [coastline longer than any other state's](/rankings/geography/states-by-coastline-length)."
      - "Hawaii averages 3,030 feet and passes California (2,900 feet) and Washington (1,700 feet). Its islands are the tops of volcanoes that climb steeply from the ocean floor, so even coastal land quickly turns to slope."

