faq:
  - question: "What states are in the Pacific Northwest?"
    answer: "Washington and Oregon are in every definition of the Pacific Northwest. Idaho is in most definitions, giving the standard 3-state answer. Western Montana and far northern California appear in some geographic and ecological definitions. No federal agency defines the Pacific Northwest with the same boundary — the Forest Service uses 2 states, the EPA uses 4."

  - question: "How many states are in the Pacific Northwest?"
    answer: "Two states — Washington and Oregon — are in every definition. Three states — Washington, Oregon, and Idaho — is the most common answer used by Wikipedia, WorldAtlas, and most travel and media organizations. The number ranges from 2 (U.S. Forest Service definition) to 4 (EPA Region 10, which adds Alaska) depending on the source."

  - question: "Is Idaho in the Pacific Northwest?"
    answer: "Yes, in most definitions. Idaho is included by EPA Region 10, Wikipedia, WorldAtlas, and most reference sources as part of the Pacific Northwest. It is excluded from the U.S. Forest Service's Pacific Northwest Region (Region 6), which covers only Washington and Oregon. Idaho has no Pacific coastline, which is the most common reason for its exclusion from narrower definitions."

  - question: "Is Montana in the Pacific Northwest?"
    answer: "Western Montana — including Missoula, Kalispell, and Glacier National Park — is sometimes included in geographic and ecological definitions of the Pacific Northwest. Eastern Montana is Great Plains and is not Pacific Northwest by any definition. No federal agency places any part of Montana in the Pacific Northwest."

  - question: "Is California in the Pacific Northwest?"
    answer: "Far northern California — roughly north of Redding — shares the temperate rainforest ecology of southern Oregon and is occasionally included in geographic definitions of the Pacific Northwest. No federal agency and no major reference source includes California in the Pacific Northwest. Most definitions stop at the Oregon-California border."

  - question: "What is the largest city in the Pacific Northwest?"
    answer: "Seattle, Washington is the largest city in the Pacific Northwest with a metropolitan area population of approximately 4 million. Portland, Oregon is the second largest at approximately 2.5 million. Boise, Idaho is the largest city in the third core Pacific Northwest state, with a metro population of approximately 800,000."

