sections:
  - id: "pacific-northwest-states-at-a-glance"
    icon: "fa-solid fa-trees"
    style: "law-cards"
    title: "Pacific Northwest States at a Glance"
    paragraphs:
      - "Washington and Oregon are the fixed core of the Pacific Northwest, Idaho is the usual third state, and the outer edge starts to get debatable. That makes this page a natural fit for card-style state summaries."
    subsections:
      - subtitle: "Washington"
        status: "Always"
        text: |
          **Area:** 71,298 sq mi
          **Inclusion:** every definition

          Washington appears in every definition of the Pacific Northwest and anchors the region's northern coastal image. Seattle is the largest city named in the table notes, and the state combines Pacific shoreline with the Cascade Range better than any other candidate.

          That is why Washington never drops out of the map. It is one of the two states nobody argues about.
      - subtitle: "Oregon"
        status: "Always"
        text: |
          **Area:** 98,379 sq mi
          **Inclusion:** every definition

          Oregon is the other state that appears in every definition. Portland is the region's second-largest city, and the notes tie Oregon directly to both Forest Service Region 6 and EPA Region 10.

          In practical terms, Oregon and Washington create the stable two-state core. Everything else is an expansion outward from that pair.
      - subtitle: "Idaho"
        status: "Usually"
        text: |
          **Area:** 83,569 sq mi
          **Inclusion:** most definitions

          Idaho is the most common third state in Pacific Northwest definitions. The table notes say it is included by EPA Region 10 but left out of the narrowest Washington-Oregon-only definition.

          That makes Idaho the hinge state on the page. It is usually in, but it is also the first state people debate because it has no Pacific coastline.
      - subtitle: "Montana"
        status: "Sometimes"
        text: |
          **Area:** 147,040 sq mi
          **Inclusion:** ecological definitions only

          Montana appears on this page because western Montana shares ecology with the Pacific Northwest. Missoula, Kalispell, and Glacier National Park are the examples named in the notes.

          No federal agency includes Montana in its Pacific Northwest boundary. That makes it a true edge case rather than a core member.
      - subtitle: "California"
        status: "Sometimes"
        text: |
          **Area:** 163,696 sq mi
          **Inclusion:** far northern edge only

          California enters the discussion only through its far northern section, where redwood and temperate rainforest landscapes connect visually with southern Oregon. The notes say no federal agency includes it.

          That puts California on the widest fringe of the definition. It is useful on the map because it shows how ecological logic can stretch beyond the standard three-state answer.

  - id: "what-states-are-in-the-pacific-northwest"
    icon: "fa-solid fa-map-location-dot"
    title: "What States Are in the Pacific Northwest?"
    paragraphs:
      - "Washington and Oregon are the only two states in every definition of the Pacific Northwest, the one point all sources agree on. Idaho is in most definitions, including EPA Region 10 and Wikipedia, giving a standard 3-state U.S. core. Western Montana and far northern California appear in geographic and ecological definitions but are excluded from all federal agency boundaries. British Columbia is the Canadian portion of the region included in most broad definitions."
      - "The disagreement exists because the Pacific Northwest has no statutory or Census definition. Unlike the Appalachian Region (defined by Congress and the ARC) or New England (a fixed 6-state Census division), the Pacific Northwest is a cultural and geographic concept with no authoritative boundary. Each agency and reference draws the line differently based on its own purpose."

  - id: "how-federal-agencies-define-the-pacific-northwest"
    icon: "fa-solid fa-scale-balanced"
    title: "How Federal Agencies Define the Pacific Northwest"
    paragraphs:
      - "The U.S. Forest Service uses the narrowest definition: its Pacific Northwest Region (Region 6) covers Washington and Oregon only. The EPA uses the broadest federal definition: Region 10 covers Washington, Oregon, Idaho, and Alaska. The Census Bureau's Pacific division, which groups states for statistical purposes, covers Washington, Oregon, California, Hawaii, and Alaska, omitting Idaho entirely and adding states no one considers Pacific Northwest culturally."
      - "Wikipedia, WorldAtlas, and most travel and media organizations use a middle definition of 3 states: Washington, Oregon, and Idaho. This is the most common answer to 'what states are in the Pacific Northwest' across reference sources. Britannica describes the region as Washington, Oregon, and 'part of' Idaho, acknowledging that eastern Idaho is culturally and geographically distinct from the western part of the state that connects to the Pacific Northwest."

  - id: "why-washington-and-oregon-are-the-core"
    icon: "fa-solid fa-circle-info"
    title: "Why Washington and Oregon Are the Core"
    paragraphs:
      - "Washington and Oregon share three defining characteristics no other U.S. state replicates together: Pacific Ocean coastline, the Cascade Range as a dominant interior divide, and a west-of-Cascades temperate rainforest climate. This combination, wet coast, mountain spine, arid interior, defines the Pacific Northwest landscape more precisely than any political boundary. Both states have been grouped together since the Oregon Territory (1848), which covered present-day Oregon, Washington, Idaho, and parts of Montana and Wyoming."
      - "Idaho's case for inclusion rests on the Columbia River watershed. The Columbia drains Washington, Oregon, and most of Idaho, connecting all three states in a single hydrologic system. Western Idaho shares the geography, ecology, and cultural character of eastern Oregon and Washington. Idaho's exclusion from some definitions comes down to the Pacific coast: it is the only state commonly called Pacific Northwest that has no ocean shoreline."

