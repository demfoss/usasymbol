seo:
  title: "Wild West States | List, Map & Famous Frontier Towns"
  description: "Arizona, Texas, Kansas, Wyoming, and 13 more western states made up the Wild West, land of Tombstone, Dodge City, Deadwood, and the cattle trails."

page:
  h1: "Wild West States"

  quick_answer:
    - "Wild West states are the 17 western states that were frontier territory between about 1865 and 1900, from Texas and Arizona north to Montana, Wyoming, and Washington. Most were still territories, not states, when cattle drives and mining rushes peaked."
    - "Missouri is the most surprising state left off the list. Independence launched the Oregon, California, and Santa Fe trails, but Missouri had been a state since 1821, so the Wild West began where those trails ended."
    - "Arizona holds the most famous Wild West moment. The Gunfight at the O.K. Corral in Tombstone in 1881 lasted about 30 seconds and still shapes how films and books picture the era."

  methodology: "States counted were frontier territories or newly admitted states during the core Wild West era of about 1865 to 1900, based on National Archives, Smithsonian, and National Park Service histories. States settled before the Civil War are excluded."

  sources:
    - name: "National Archives – The American West"
      url: "https://www.archives.gov/research/american-west"
      description: "Primary records on frontier settlement, Indian Wars, land grants, and law enforcement in the American West"
    - name: "Smithsonian – The American West"
      url: "https://americanhistory.si.edu/west"
      description: "Smithsonian National Museum of American History resources on the history and mythology of the American West"
    - name: "National Park Service – Frontier and Western History"
      url: "https://www.nps.gov/subjects/travelwesternnationalparks/index.htm"
      description: "NPS sites covering frontier forts, cattle trails, mining towns, and Wild West history across the 17 western states"

