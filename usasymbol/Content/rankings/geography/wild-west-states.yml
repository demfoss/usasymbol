faq:
  - question: "What states are considered the Wild West?"
    answer: "Seventeen states are counted. Arizona, California, Colorado, Idaho, Kansas, Montana, Nebraska, Nevada, New Mexico, North Dakota, Oklahoma, Oregon, South Dakota, Texas, Utah, Washington, and Wyoming were all frontier country between about 1865 and 1900."

  - question: "What is the most famous Wild West town?"
    answer: "Tombstone, Arizona, is the usual answer. Prospector Ed Schieffelin was warned he would find only his tombstone in that Apache country, so he gave the name to the silver claim he struck instead."

  - question: "Is Texas part of the Wild West?"
    answer: "Yes. Texas supplied the longhorn cattle that cowboys drove north to Kansas, and Comanche and Apache warriors held much of its western plains into the 1870s."

  - question: "Was Oklahoma part of the Wild West?"
    answer: "Yes. As Indian Territory, Oklahoma drew outlaws from neighboring states for decades. The Land Run of 1889 then filled towns like Guthrie and Oklahoma City almost overnight."

  - question: "When did the Wild West end?"
    answer: "Around 1890 to 1900. The 1890 census reported that a continuous frontier line no longer existed, and Frederick Jackson Turner built his 1893 Frontier Thesis on that finding. Arizona and New Mexico became states in 1912, the last of the 48 contiguous states."

  - question: "Is California considered the Wild West?"
    answer: "Yes. Gold Rush mining camps of 1849 had almost no government, so miners wrote their own claim rules and handed out their own punishments."

