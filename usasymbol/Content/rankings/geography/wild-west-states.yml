sections:
  - id: "why-these-states-are-called-the-wild-west"
    icon: "fa-solid fa-hat-cowboy"
    title: "Why These States Are Called the Wild West"
    paragraphs:
      - "Arizona, Wyoming, Montana, and most of the other 17 Wild West states were still federal territories when the Civil War ended in 1865. Governors and judges were appointed from Washington, sheriffs patrolled counties bigger than some eastern states, and a mining camp could fill with newcomers before any court arrived."
      - "Three forces moved faster than the law. Silver strikes like the Comstock Lode pulled miners into Nevada, Texas cattle walked north to Kansas railheads, and the transcontinental railroad met at Promontory Summit, Utah, in 1869. Across Nevada, Utah, and Idaho, much of that land never left federal hands, as the [public land by state](/rankings/geography/public-land-by-state) ranking shows."

  - id: "famous-wild-west-towns-by-state"
    icon: "fa-solid fa-star"
    title: "Famous Wild West Towns by State"
    paragraphs:
      - "Tombstone in Arizona, Deadwood in South Dakota, and Dodge City in Kansas are the towns most tied to Wild West legend. Wild Bill Hickok was shot at a Deadwood poker table in 1876, holding the aces and eights now called the dead man's hand. Dodge City kept Wyatt Earp and Bat Masterson busy as the cattle trade moved west."
      - "New Mexico produced the era's most famous outlaw. Billy the Kid rose to fame in the Lincoln County War of 1878, and Sheriff Pat Garrett shot him in 1881. Lincoln and Tombstone both lie in the [Southwest states](/rankings/geography/southwest-states), the same desert country where Geronimo surrendered in 1886 and the Apache Wars came to an end."

  - id: "states-not-considered-the-wild-west"
    icon: "fa-solid fa-circle-question"
    title: "States Not Considered the Wild West"
    paragraphs:
      - "Missouri sits just outside the line. Jesse James robbed banks and trains there, and St. Joseph sent the first Pony Express rider west in 1860, yet Missouri already had courts, towns, and farms long before the frontier era."
      - "Arkansas came even closer. Fort Smith, on its western border, housed Judge Isaac Parker's court, which sent deputy marshals into Indian Territory, now Oklahoma. Alaska had a gold rush frontier of its own after the Klondike strike of 1896, yet today it counts among the [West states](/rankings/geography/west-states), not the Old West."

