faq:
  - question: "What states are considered Wild West states?"
    answer: "17 states are considered Wild West states: Arizona, California, Colorado, Idaho, Kansas, Montana, Nebraska, Nevada, New Mexico, North Dakota, Oklahoma, Oregon, South Dakota, Texas, Utah, Washington, and Wyoming. All 17 were frontier territories during the core Wild West era of 1865 to 1900."

  - question: "What is the most famous Wild West state?"
    answer: "Arizona is often considered the most iconic Wild West state because of Tombstone and the Gunfight at the OK Corral (1881), the most famous event in Wild West history. South Dakota (Deadwood, Wild Bill Hickok) and Kansas (Dodge City, Wyatt Earp) are also among the most famous."

  - question: "Is Texas a Wild West state?"
    answer: "Yes. Texas is one of the 17 Wild West states. The Chisholm Trail cattle drives ran from Texas to Kansas railheads; the Texas Rangers policed the frontier; and battles with the Comanche and Apache Nations defined the western Texas frontier throughout the 1870s and 1880s."

  - question: "Is Missouri a Wild West state?"
    answer: "No. Missouri was the Gateway to the West — the starting point of the Oregon, Santa Fe, and California Trails — but was itself a settled state, not frontier territory. Jesse James operated in Missouri, but Missouri was a functioning state, not the unsettled frontier territory that defines the Wild West."

  - question: "When did the Wild West era end?"
    answer: "The Wild West era is generally considered to have ended around 1900. Historian Frederick Jackson Turner declared the American frontier officially closed in his 1893 Frontier Thesis, noting that the 1890 Census found no continuous frontier line remaining. Oklahoma was one of the last territories, achieving statehood in 1907 — the last contiguous U.S. state to do so."

  - question: "Is California a Wild West state?"
    answer: "Yes. California's Wild West history begins with the Gold Rush of 1849, which brought 300,000 settlers to the territory in two years and created a chaotic frontier society before institutions of law could be established. The Pony Express ran from St. Joseph, Missouri to Sacramento. Frontier boomtowns throughout the Sierra Nevada were among the wildest in the West."

