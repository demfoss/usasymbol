faq:
  - question: "Can you see the northern lights in Alaska?"
    answer: "Yes. Alaska needs only a Kp index of 2 to 3, the lowest threshold of any state. Fairbanks sees the aurora on roughly 120 to 160 clear nights a year."

  - question: "What states can see the aurora borealis regularly?"
    answer: "Minnesota, Michigan's Upper Peninsula, Montana, North Dakota, Idaho, and Washington all need only a Kp of 4 to 5. Vermont, Maine, Wisconsin, and Oregon follow closely at a Kp of 5."

  - question: "Can you see the northern lights in Texas or Florida?"
    answer: "Only rarely. Texas, Georgia, and Florida need a Kp index of 7 to 8 or higher, a level reached only during the strongest geomagnetic storms."

  - question: "What Kp index is needed to see the northern lights?"
    answer: "It depends on latitude. At Kp 0, the aurora's southern edge sits near 66 degrees magnetic latitude. Each Kp level moves that edge about 2 degrees farther south, reaching roughly 48 degrees at Kp 9."

  - question: "Which state has the best northern lights visibility?"
    answer: "Alaska, with a minimum Kp of 2 to 3. No other state on record needs less geomagnetic activity to see the aurora."

  - question: "Do Colorado and Pennsylvania ever see the northern lights?"
    answer: "Yes, but only at a Kp of 6 to 7, higher than the northern-tier states. Indiana shares the same 6 to 7 threshold."

