sections:
  - id: "why-alaska-leads-northern-lights"
    icon: "fa-solid fa-mountain-sun"
    title: "Why Alaska Leads the U.S. for Aurora Visibility"
    paragraphs:
      - "Alaska needs a Kp index of only 2 to 3 to see the northern lights, the lowest threshold of any state on record. Fairbanks sees the aurora on roughly 120 to 160 clear nights a year, a total no other U.S. location approaches."

  - id: "why-northern-states-see-aurora-most"
    icon: "fa-solid fa-compass"
    title: "Why Northern States See the Aurora Most Often"
    paragraphs:
      - "The aurora forms in a ring around Earth's magnetic pole, and that ring only expands south as geomagnetic activity rises. At a Kp of 0, the ring's southern edge sits near 66 degrees magnetic latitude. Each added Kp level pushes it roughly 2 degrees closer to the equator, reaching about 48 degrees at Kp 9."
      - "That is why Minnesota, Michigan's Upper Peninsula, Montana, North Dakota, Idaho, and Washington need only a Kp of 4 to 5. Their northern latitude sits closer to that ring than states farther south."

  - id: "states-that-rarely-see-aurora"
    icon: "fa-solid fa-cloud-sun"
    title: "Which States Rarely See the Northern Lights"
    paragraphs:
      - "Texas, Georgia, and Florida need a Kp index of 7 to 8 or higher, a level reached only during the strongest geomagnetic storms. Colorado, Pennsylvania, and Indiana sit a step above the northern tier at Kp 6 to 7, still well beyond a typical night's activity."

