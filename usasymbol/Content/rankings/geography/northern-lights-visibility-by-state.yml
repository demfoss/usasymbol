page:
  h1: "Northern Lights Visibility by State"

  quick_answer:
    - "Alaska has the best aurora visibility in the U.S., with the northern lights visible at a Kp index of just 2 to 3, the lowest threshold of any state on record."
    - "Minnesota, Michigan's Upper Peninsula, Montana, North Dakota, Idaho, and Washington need a Kp index of only 4 to 5, letting them catch the aurora several times a month during solar maximum."
    - "Texas, Georgia, and Florida sit at the opposite end, needing a Kp index of 7 to 8 or higher, a threshold reached only during the strongest geomagnetic storms."

  methodology: "Minimum Kp index (geomagnetic activity level, 0 to 9) needed to see the aurora from each state, drawn from NOAA Space Weather Prediction Center Kp viewline guidance and published aurora-viewing thresholds. Visibility score is 10 minus the minimum Kp, used only so the map's color scale reads intuitively. Most states outside this list have no defined threshold in these sources and effectively require a Kp of 9."

  sources:
    - name: "NOAA / NWS Space Weather Prediction Center. Tips on Viewing the Aurora"
      url: "https://www.spaceweather.gov/content/tips-viewing-aurora"
      description: "Explains Kp index ranges 0 to 9 and how the auroral oval's southern edge moves from about 66 degrees magnetic latitude at Kp 0 to about 48 degrees at Kp 9"
    - name: "Geophysical Institute, University of Alaska Fairbanks. Aurora Forecast"
      url: "https://www.gi.alaska.edu/monitors/aurora-forecast"
      description: "Source for Fairbanks, Alaska aurora visibility at Kp 2 to 3 and estimated annual clear-night viewing totals"

