sections:
  - id: why-texas-has-the-longest-river
    title: "Why Texas Has the Longest River"
    paragraphs:
      - "Texas covers so much ground that a river can start on the High Plains, cross the Hill Country and still reach the Gulf without leaving the state. The Colorado River of Texas, 862 miles long, does exactly that and ends at Matagorda Bay. It has no connection to the better known Colorado River of the Southwest."
      - "Bigger border rivers such as the Rio Grande and the Red River are longer, but they form state or national lines, so they belong to more than one jurisdiction. The same logic keeps the Missouri and the Mississippi off this table, see [Mississippi River states](/rankings/geography/mississippi-river-states) for the states they touch."
