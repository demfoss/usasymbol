page:
  h1: "Longest River in Each U.S. State"
  quick_answer:
    - "Texas has the longest river that stays inside one state, the Colorado River at 862 miles. It starts on the dry plains of West Texas and runs all the way to Matagorda Bay on the Gulf of Mexico."
    - "Alaska's Kuskokwim River runs 702 miles through roadless country to the Bering Sea, and North Dakota's Sheyenne River winds 591 miles through the Red River valley before it joins the Red River."
    - "Rhode Island sits last. The Woonasquatucket River runs just 16 miles, mostly through Providence. Hawaii's Wailuku River on the Big Island is 28 miles, and Delaware's Murderkill River is 22."
  methodology: "Longest river lying entirely inside each state, length in miles, as given in the Wikipedia list of longest rivers of the United States by state. Thirteen states are omitted because that list's pick is a border river or its length conflicts with the river's own article. They are Arizona, California, Connecticut, Illinois, Mississippi, Nevada, New Jersey, Oklahoma, Oregon, South Carolina, Utah, West Virginia and Wyoming. Other sources differ by a few miles for some rivers."
  sources:
