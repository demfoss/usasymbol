faq:
  - question: "What is the longest river in Texas?"
    answer: "The Colorado River, at 862 miles. It is the longest river that lies wholly inside Texas, and it flows from the High Plains to Matagorda Bay on the Gulf of Mexico."
  - question: "What is the longest river in Alaska?"
    answer: "The Kuskokwim River, at 702 miles, is the longest river entirely within Alaska. The Yukon is longer, but it flows in from Canada. The Kuskokwim drains southwest Alaska into the Bering Sea."
  - question: "What is the longest river in New York?"
    answer: "The Hudson River, at 315 miles. It is the longest river that stays inside the state, and its lower stretch is a tidal estuary that reaches New York City and the Atlantic."
  - question: "What is the longest river in Wisconsin?"
    answer: "The Wisconsin River, at 430 miles. It starts at Lac Vieux Desert on the Michigan border and empties into the Mississippi River in the southwest corner of the state."
  - question: "What is the longest river in Michigan?"
    answer: "The Grand River, at 252 miles. It crosses the southern half of the Lower Peninsula and reaches Lake Michigan at Grand Haven. See [largest lake by state](/rankings/geography/largest-lake-by-state) for the biggest lake in each state."
  - question: "Which state has the shortest longest river?"
    answer: "Rhode Island, where the Woonasquatucket River runs 16 miles. Delaware's Murderkill River at 22 miles and Hawaii's Wailuku River at 28 miles are next."
