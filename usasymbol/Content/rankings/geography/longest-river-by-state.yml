  - id: states-with-the-shortest-longest-rivers
    title: "States With the Shortest Longest Rivers"
    paragraphs:
      - "Rhode Island's Woonasquatucket River runs 16 miles and spends much of that distance in Providence, where it once powered mills. Delaware's Murderkill River is 22 miles, and the name comes from the Dutch word kill, meaning creek."
      - "Hawaii's Wailuku River is 28 miles long on the Big Island and flows past Rainbow Falls near Hilo. Steep volcanic slopes send Hawaiian streams to the sea quickly, so none gets a chance to grow long. Compare the [water area by state](/rankings/geography/water-area-by-state) to see how much surface water each state holds."
