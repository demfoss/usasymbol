faq:
  - question: "What state has the longest name"
    answer: "Massachusetts, North Carolina, and South Carolina all tie for the longest U.S. state name at 13 letters each when spaces are not counted. If spaces are included as characters, North Carolina and South Carolina reach 14 characters versus 13 for Massachusetts."

  - question: "What state has the shortest name"
    answer: "Iowa, Ohio, and Utah are the three shortest U.S. state names, each with 4 letters. No state has a name shorter than 4 letters. All three are single-word names."

  - question: "Do you count spaces when measuring state name length"
    answer: "Most rankings count letters only and exclude spaces. Under that method, Massachusetts, North Carolina, and South Carolina all tie at 13. If spaces count as characters, North Carolina and South Carolina reach 14 characters and Massachusetts stays at 13."

  - question: "Is Rhode Island the longest state name"
    answer: "Rhode Island is not the longest current state name; it ranks 7th at 11 letters. It was historically notable because its full official name, 'State of Rhode Island and Providence Plantations,' ran to 47 characters. Voters removed 'Providence Plantations' in November 2020."

  - question: "What states have 4-letter names"
    answer: "Iowa, Ohio, and Utah are the only U.S. states with 4-letter names. They are also the three shortest state names. No other state has fewer than 5 letters."

  - question: "What is the most common state name length"
    answer: "Eight letters is the most common state name length. Eleven states share 8-letter names: Arkansas, Colorado, Delaware, Illinois, Kentucky, Maryland, Michigan, Missouri, Nebraska, Oklahoma, and Virginia."

