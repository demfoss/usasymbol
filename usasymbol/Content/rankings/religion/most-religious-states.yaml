page:
  h1: "Most Religious States"

  quick_answer:
    - "Mississippi is the most religious state in 2026, with 50% of adults classified as highly religious. South Carolina ranks second at 46%, followed by Louisiana and South Dakota at 45%, and Utah at 42%."
    - "The ranking is based on Pew Research Center's 2023–24 Religious Landscape Study, which classifies adults as highly religious using four combined measures: prayer frequency, belief in God or a universal spirit with absolute certainty, the importance of religion in daily life, and religious service attendance."

  methodology: "This ranking uses Pew Research Center's 2023–24 Religious Landscape Study (n=36,908, conducted July 17, 2023–March 4, 2024). Pew classifies adults as highly religious based on a combined scale using prayer frequency, belief in God or a universal spirit with absolute certainty, the importance of religion, and religious service attendance at least monthly. Adults scoring 7–8 out of 8 are classified as highly religious. The District of Columbia (18%) is excluded — it is not a state."

