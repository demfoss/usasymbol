sections:
  - id: "why-mississippi-most-religious"
    icon: "fa-solid fa-church"
    title: "Why Mississippi Is the Most Religious State"
    paragraphs:
      - "Mississippi tops all four measures, from 54% attending services to 74% believing in God with certainty. Church life there runs through Southern Baptist and Black Protestant congregations in small towns, and the largest church, Pinelake Church, is Southern Baptist. Compare it with the [biggest church in each state](/rankings/religion/biggest-church-by-state)."
      - "South Carolina sits four points behind at 46%, a wider gap than the single point separating it from Louisiana at 45%. Tennessee at 44% rounds out a top five where South Dakota is the only state outside the South."
