sections:
  - id: "mississippi-leads-all-four-sub-measures"
    icon: "fa-solid fa-chart-bar"
    title: "Mississippi Leads on All Four Sub-Measures"
    paragraphs:
      - "Mississippi (50%) is the only state that scores highest on all four Pew sub-measures simultaneously: religion_important (61%), attend_services (54%), pray_daily (62%), and believe_in_god (74%). South Carolina (46%) ranks second overall but does not lead on any individual sub-measure. The 4-point gap between first and second place is larger than the 1-point gap separating second from third."
      - "Mississippi's believe_in_god rate (74%) is 3 points above Arkansas (73%) and 4 points above South Carolina (71%), both of which rank lower overall. Its pray_daily rate (62%) is 4 points above Louisiana (58%) and Arkansas (58%), the next closest states on that measure."

  - id: "utah-believe-gap"
    icon: "fa-solid fa-circle-info"
    title: "Utah's believe_in_god Rate Is the Lowest in the Top 10"
    paragraphs:
      - "Utah (42%) ranks sixth most religious, but its believe_in_god rate (55%) is the lowest of any state in the top 10. Arkansas (40%), which ranks 8th, scores 73% on believe_in_god, 18 points higher than Utah despite ranking lower overall. Louisiana (45%), ranked 3rd, scores 72% on believe_in_god versus Utah's 55%."
      - "South Dakota (45%) ties Louisiana for third place. Its attend_services rate (50%) is the highest of any top-10 state other than Mississippi (54%). South Dakota's believe_in_god rate (62%) is 10 points below Louisiana's (72%) despite both states scoring 45% overall."

  - id: "four-way-tie-rank-10"
    icon: "fa-solid fa-equals"
    title: "Four States Tie at Rank 10 With Different Sub-Score Profiles"
    paragraphs:
      - "Georgia, Kansas, North Dakota, and Oklahoma all score 38% highly religious, tying at rank 10. North Dakota leads the group on attend_services (43%) but scores lowest on believe_in_god (59%). Georgia leads on pray_daily (56%) and believe_in_god (66%). Kansas scores lowest on both attend_services (39%) and pray_daily (50%)."

faq:
  - question: "What is the most religious state in the United States?"
    answer: "Mississippi is the most religious state, with 50% of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study. South Carolina ranks second at 46%, followed by Louisiana and South Dakota at 45%."

  - question: "What is the least religious state in the United States?"
    answer: "Vermont is the least religious state, with 13% of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study. New Hampshire (15%) and Maine (17%) rank second and third least religious."

  - question: "Why is Mississippi the most religious state?"
    answer: "Mississippi scores highest on all four Pew sub-measures simultaneously: religion_important (61%), attend_services (54%), pray_daily (62%), and believe_in_god (74%). No other state in the top 10 leads on all four at once."

  - question: "Is Utah more religious than Mississippi?"
    answer: "No. Mississippi (50% highly religious) ranks above Utah (42%, sixth). Utah's believe_in_god rate (55%) is the lowest of any state in the top 10, 19 points below Mississippi's (74%)."

  - question: "How does Pew Research measure religiousness by state?"
    answer: "Pew uses four measures: daily prayer, belief in God or a universal spirit with absolute certainty, religion very important in daily life, and attending religious services at least monthly. Adults scoring 7–8 out of 8 are classified as highly religious. The 2023–24 study surveyed 36,908 U.S. adults."
