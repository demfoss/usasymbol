seo:
  title: "Most Religious States | Map, Rankings & Facts"
  description: "Mississippi is the most religious state, with 50% of adults highly religious. Vermont is the least religious at 13%, and Utah ranks sixth at 42%."

page:
  h1: "Most Religious States"

  quick_answer:
    - "The most religious state is Mississippi, where 50% of adults are highly religious. Southern Baptist and Black Protestant congregations anchor community life across its small towns and rural counties."
    - "Vermont is the least religious state at 13%. Only 17% of Vermonters attend services at least monthly and 30% believe in God with absolute certainty, the lowest marks in the country on both."
    - "Utah ranks sixth at 42%, yet only 55% of Utahns say they are certain God exists, the lowest of any top-10 state. Its 48% service attendance still beats Louisiana, Tennessee, and Arkansas."

  methodology: "Pew Research Center's 2023–24 Religious Landscape Study of 36,908 adults. Highly religious means scoring 7–8 out of 8 on prayer, certain belief in God or a universal spirit, importance of religion, and monthly service attendance."

  sources:
