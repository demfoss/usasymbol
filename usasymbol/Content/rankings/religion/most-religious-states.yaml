  - id: "why-vermont-least-religious"
    icon: "fa-solid fa-snowflake"
    title: "Why Vermont Is the Least Religious State"
    paragraphs:
      - "Vermont has the lowest share of highly religious adults at 13%, and it also trails on attendance (17%) and certain belief in God (30%). White-steepled village churches are a Vermont postcard staple, but a culture that prizes independence from institutions and the back-to-the-land newcomers of the 1960s and 1970s helped make it one of the most secular states."
      - "New Hampshire (15%) and Maine (17%) fill the next two spots, so the whole northern New England corner sits at the bottom. The full [least religious states](/rankings/religion/least-religious-states) ranking shows Nevada and Oregon tied at 19% just outside that group."
