sections:
  - id: "vermont-nh-lowest-religion-important"
    icon: "fa-solid fa-chart-bar"
    title: "Vermont and New Hampshire Tie on the Lowest religion_important Rate"
    paragraphs:
      - "Vermont (13%) and New Hampshire (15%) both score 16% on religion_important, the lowest of any two states on that sub-measure. Vermont's pray_daily rate (22%) and believe_in_god rate (30%) are both the lowest nationally. New Hampshire's believe_in_god rate (33%) is the second lowest nationally."
      - "Maine (17%) ranks third least religious but has a higher pray_daily rate (32%) than Vermont (22%) and New Hampshire (25%), and a higher believe_in_god rate (38%) versus New Hampshire's (33%). Maine's overall score is 4 points above Vermont's despite both states ranking in the bottom 3."

  - id: "nevada-oregon-tied-different-sub-scores"
    icon: "fa-solid fa-circle-info"
    title: "Nevada and Oregon Tie at 19% With a 12-Point Gap on pray_daily"
    paragraphs:
      - "Nevada (19%) and Oregon (19%) tie for fourth least religious. Nevada's pray_daily rate (41%) is 12 points above Oregon's (29%), the largest pray_daily divergence between any two tied states in the ranking. On attend_services and religion_important, the two states score identically at 20% each."
      - "Nevada's believe_in_god rate (48%) is also 7 points above Oregon's (41%). Oregon equals Nevada only on attend_services at 20% each. Nevada scores higher on three of four sub-measures despite the identical overall score."

  - id: "iowa-hawaii-tied-different-profiles"
    icon: "fa-solid fa-equals"
    title: "Iowa and Hawaii Tie at 21% With Different Sub-Score Profiles"
    paragraphs:
      - "Iowa (21%) and Hawaii (21%) tie for seventh least religious but have different sub-score profiles. Iowa's attend_services rate (30%) is 11 points above Hawaii's (19%). Hawaii's believe_in_god rate (48%) is one point above Iowa's (47%), and Hawaii's pray_daily (34%) exceeds Iowa's (31%) by 3 points."

faq:
  - question: "What is the least religious state in the U.S.?"
    answer: "Vermont is the least religious state, with 13% of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study. New Hampshire (15%) and Maine (17%) rank second and third."

  - question: "What is the most religious state in the U.S.?"
    answer: "Mississippi is the most religious state, with 50% of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study."

  - question: "How does Pew Research measure religiousness by state?"
    answer: "Pew uses four measures: whether adults pray daily, believe in God or a universal spirit with absolute certainty, consider religion very important in their lives, and attend religious services at least monthly. Each measure scores 0–2 points; adults scoring 7–8 out of 8 are classified as highly religious. The 2023–24 study surveyed 36,908 U.S. adults."

  - question: "Which region has the least religious states?"
    answer: "New England has the highest concentration of least religious states. Vermont, New Hampshire, Maine, Massachusetts, Rhode Island, and Connecticut all rank in the bottom 10 most highly religious states, based on Pew Research Center's 2023–24 Religious Landscape Study."
