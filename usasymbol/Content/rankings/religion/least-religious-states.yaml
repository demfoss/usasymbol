  description: "Vermont is the least religious state at 13% highly religious adults, followed by New Hampshire (15%) and Maine (17%). Pew Research Center 2023-24 data."

page:
  h1: "Least Religious States 2026"

  quick_answer:
    - "Vermont is the least religious state in the U.S., with 13% of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study. New Hampshire (15%) and Maine (17%) follow."
    - "The ranking uses Pew's overall religiousness scale, which combines four measures: daily prayer, belief in God or a universal spirit with absolute certainty, religion very important, and monthly religious service attendance. Adults scoring 7–8 out of 8 are classified as highly religious. Mississippi ranks as the most religious state at 50%."

  methodology: "States ranked by the percentage of adults classified as highly religious in Pew Research Center's 2023–24 Religious Landscape Study (n=36,908, conducted July 17, 2023–March 4, 2024). Highly religious = scoring 7–8 out of 8 across four measures: daily prayer, certainty of belief in God or a universal spirit, religion very important in daily life, and attending religious services at least monthly. The District of Columbia (18% highly religious) is excluded — it is not a state. Pew notes that differences between some individual states may not be statistically significant given state-level margins of error."

  sources:
    - name: "Pew Research Center — How religious is your state? (2023–24 Religious Landscape Study)"
      url: "https://www.pewresearch.org/short-reads/2025/09/16/how-religious-is-your-state/"
      description: "State-level religiousness rankings from a 36,908-respondent national survey, published September 16, 2025"

