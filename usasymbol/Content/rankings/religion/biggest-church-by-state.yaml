faq:
  - question: "What is the biggest church in the United States?"
    answer: "Life.Church in Edmond, Oklahoma is the biggest church in the United States by average weekly attendance, with approximately 85,000 attendees per week across its campuses. It is affiliated with the Evangelical Covenant Church and operates locations in multiple states."

  - question: "What is the biggest church in each state?"
    answer: "See the full table above for the biggest church in every state by average weekly attendance. The top three states are Oklahoma (Life.Church, 85,000), Alabama (Church of the Highlands, 60,000), and Texas (Lakewood Church, 45,000)."

  - question: "What is the difference between biggest church by attendance and biggest church building?"
    answer: "Biggest church by attendance counts average weekly attendees, the number of people who show up each week. Biggest church building measures square footage or seating capacity regardless of how many people attend. These lists are completely different. Lakewood Church in Houston seats about 16,800 and averages 45,000 weekly attendees across multiple services; a historic cathedral may seat 2,000 but hold services with far fewer people present."

  - question: "What is a megachurch?"
    answer: "A megachurch is a Protestant Christian congregation with a consistent average weekly attendance of at least 2,000 persons, as defined by the Hartford Institute for Religion Research. The United States has approximately 1,750 megachurches, which represent less than 0.5 percent of congregations but attract roughly 10 percent of all Protestant churchgoers."

  - question: "Which states have the largest megachurches?"
    answer: "Oklahoma, Alabama, Texas, Ohio, California, North Carolina, and Kentucky have the largest state-level megachurches by attendance. All seven states have their largest church exceeding 23,000 weekly attendees. States in the Northeast generally have the smallest figures, with several states in New England having no publicly confirmed megachurch-scale congregation."

