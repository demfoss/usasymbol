sections:
  - id: "largest-churches-in-the-us"
    icon: "fa-solid fa-church"
    title: "Largest Churches in the United States"
    paragraphs:
      - "Life.Church in Edmond, Oklahoma leads all states with 85,000 average weekly attendees across its campuses. Church of the Highlands in Birmingham, Alabama ranks second at 60,000. Lakewood Church in Houston, Texas ranks third at 45,000."
      - "Crossroads Church in Cincinnati, Ohio ranks fourth nationally at 35,253 weekly attendees, making it the largest church in Ohio and the highest-attendance single-state church in the Midwest in this dataset. Southeast Christian Church in Louisville, Kentucky (25,917) and Elevation Church in Matthews, North Carolina (26,000) rank fifth and sixth by the secondary table."

  - id: "states-with-biggest-megachurches"
    icon: "fa-solid fa-map-location-dot"
    title: "States With the Biggest Megachurches"
    paragraphs:
      - "Oklahoma (85,000), Alabama (60,000), Texas (45,000), Ohio (35,253), and California (28,000) account for the five largest state-level attendance figures. Oklahoma, Alabama, Tennessee (21,000), Kentucky (25,917), and North Carolina (26,000) all have their largest church exceeding 20,000 weekly attendees."
      - "The Northeast shows the opposite pattern. New Hampshire's largest church (Bethany at Chester Road, 2,000) sits exactly at the megachurch threshold. The absence of Delaware, Maine, Rhode Island, and Vermont from the dataset reflects the genuine scarcity of megachurch-scale congregations in New England. Vermont has no church that publicly reports attendance above the 2,000 threshold to the major databases."
      - "Louisiana and Tennessee's largest churches (Greater Saint Stephen Full Gospel Baptist and Mount Zion Baptist) are both Baptist, the only denomination to lead in two adjacent Southern states in this dataset. Iowa and North Dakota's largest churches are both Evangelical Lutheran, the only denomination leading in two states outside the South. Oklahoma's Life.Church (85,000) is affiliated with the Evangelical Covenant Church."


