page:
  h1: "Biggest Church by State 2026"

  quick_answer:
    - "Life.Church in Edmond, Oklahoma averages 85,000 weekly attendees across its campuses, the highest of any church in the United States. Church of the Highlands (Alabama) ranks second at 60,000; Lakewood Church (Texas) third at 45,000."
    - "Oklahoma (85,000), Alabama (60,000), and Texas (45,000) lead all states. New Hampshire's largest church averages 2,000 weekly attendees, the lowest of any state with data. Four states (Delaware, Maine, Rhode Island, Vermont) have no publicly reported attendance figures in this dataset."

  methodology: "Average weekly attendance figures are drawn from the Outreach 100 list (Lifeway Research / Outreach Magazine), the Hartford Institute for Religion Research megachurch database, and publicly reported church data. Figures reflect in-person weekend attendance and may be self-reported by the congregation or estimated from available sources. Multi-campus churches report total combined attendance across all locations. Data for Delaware, Maine, Rhode Island, and Vermont was not available in the source datasets."

