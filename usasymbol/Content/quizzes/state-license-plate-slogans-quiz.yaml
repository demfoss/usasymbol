title: "License Plate Slogans Quiz"
slug: "state-license-plate-slogans-quiz"
description: "Test your knowledge of all 50 U.S. state license plate slogans — from 'Vacationland' to 'Live Free or Die' — with a fast, replayable quiz that makes the nicknames stick."

difficulty: "Medium"
estimated_time: "8–10 min"

tags: ["license plate slogans quiz", "state license plate quiz", "guess the state by slogan", "us license plate trivia"]

seo:
  title: "License Plate Slogans Quiz – Identify All 50 U.S. State Plate Slogans"
  description: "Can you match every U.S. license plate slogan to the right state? This free quiz covers all 50 states with randomized questions, instant feedback, and the history behind each slogan."
  intro_paragraphs:
    - "Can you match 'Vacationland' to Maine, 'Famous Potatoes' to Idaho, or 'Live Free or Die' to New Hampshire? Each question shows a license plate and asks which state it belongs to."
    - "Questions and answer positions are shuffled every round, so this works as a license plate slogan practice quiz you can replay until every nickname sticks."
    - "Some slogans are famous. Others are surprisingly obscure — even for people who live in that state. A few rounds here go a long way."

content:
  sections:
    - id: "how-it-works"
      title: "How the License Plate Slogans Quiz Works"
      paragraphs:
        - "Each question shows a U.S. state license plate. Your task is to identify which state issued it — either by recognizing the slogan, the plate design, or both."
        - "Questions and answer positions shuffle every round. This makes it ideal for repeated practice and builds long-term recall."
        - "After each answer you'll see a short explanation covering the slogan's origin, what it means, and any interesting history behind it."

    - id: "famous-slogans"
      title: "The Most Famous License Plate Slogans"
      paragraphs:
        - "A handful of state slogans have become part of American culture far beyond the license plate."
      list:
        - "'Live Free or Die' (New Hampshire) — taken from a 1809 toast by General John Stark, it's the most quoted state motto in the country."
        - "'Famous Potatoes' (Idaho) — one of the most self-aware and beloved plate slogans in the U.S."
        - "'Vacationland' (Maine) — Maine has used this slogan since 1936, longer than almost any other state."
        - "'Virginia is for Lovers' — a 1969 tourism campaign that became one of the most recognized travel slogans of the 20th century."
        - "'Land of Enchantment' (New Mexico) — adopted in 1935, it predates most state tourism slogans by decades."

    - id: "rivalries"
      title: "The License Plate Slogan Rivalries"
      paragraphs:
        - "Some slogans directly overlap — or compete. Ohio's 'Birthplace of Aviation' and North Carolina's 'First in Flight' both claim the Wright Brothers, who were born in Ohio but made their first flight at Kitty Hawk, NC."
        - "New Mexico used 'Sunshine State' on its plates decades before Florida adopted the same nickname. Florida now owns it in the public mind."
        - "Both Indiana and Missouri have claimed regional geographic importance — 'Crossroads of America' and 'Gateway to the West' — representing their central roles in American expansion."

    - id: "more-quizzes"
      title: "More U.S. State Symbol Quizzes"
      paragraphs:
        - "Once you've worked through all 50 license plate slogans, there's more to explore. Our state flags quiz covers the design history behind every flag."
        - "You can also test yourself on state seals, state capitals, state birds, and other official symbols."
        - "Mixing different quizzes is one of the fastest ways to build a solid mental picture of all 50 states."

faq:
  - question: "Does the quiz cover all 50 states?"
    answer: "Yes — every U.S. state is included, all 50."

  - question: "Are the questions different each time?"
    answer: "Yes. Both the question order and the position of the correct answer among the four choices are shuffled every round."

  - question: "Which license plate slogans are hardest to guess?"
    answer: "Slogans like 'Legendary' (North Dakota), 'Pacific Wonderland' (Oregon), 'Crossroads of America' (Indiana), and 'Constitution State' (Connecticut) tend to trip people up. The most famous ones — 'Live Free or Die,' 'Famous Potatoes,' 'Vacationland' — are usually the easiest."

  - question: "Do I need an account to play?"
    answer: "No. The quiz is completely free and starts immediately — no sign-up required."

  - question: "What happens when I get an answer wrong?"
    answer: "You see the correct state immediately, along with a short explanation of the slogan's history and what it represents."

  - question: "How often do states change their license plate slogans?"
    answer: "Occasionally — slogans can change with new administrations or rebranding campaigns. Some states have kept the same slogan for decades; others change it every few years. This quiz uses each state's most recognized or current slogan."

sources:
  - name: "USA Symbol — State License Plates"
    url: "https://usasymbol.com/symbols/license-plates"
    description: "Reference hub for U.S. state license plates and slogans on USA Symbol."

questions:
  - question: "Which state's plate carries the slogan 'Heart of Dixie'?"
    state_abbreviation: "AL"
    image_url: "/images/license-plates/alabama/heart-of-dixie.webp"
    choices: ["Alabama", "Georgia", "Tennessee", "Mississippi"]
    correct_answer: "Alabama"
    explanation: "'Heart of Dixie' has appeared on Alabama plates since 1955. It refers to Alabama's central role in the antebellum South and the Civil Rights era — a phrase that remains both a point of pride and ongoing debate."

  - question: "Which state's plate reads 'The Last Frontier'?"
    state_abbreviation: "AK"
    image_url: "/images/license-plates/alaska/1968-last-frontier.webp"
    choices: ["Washington", "Alaska", "Montana", "Oregon"]
    correct_answer: "Alaska"
    explanation: "'The Last Frontier' has been Alaska's plate slogan since 1963, capturing the state's vast wilderness and its identity as America's final and largest undeveloped territory — larger than the next three biggest states combined."

  - question: "Which state's plate bears the slogan 'Grand Canyon State'?"
    state_abbreviation: "AZ"
    image_url: "/images/license-plates/arizona/arizona-grand-canyon-state-standard-plate.jpg"
    choices: ["Nevada", "Colorado", "Arizona", "New Mexico"]
    correct_answer: "Arizona"
    explanation: "Arizona adopted 'Grand Canyon State' to highlight its most iconic natural landmark. The Grand Canyon is 277 miles long and up to 18 miles wide — carved over millions of years by the Colorado River."

  - question: "Which state's plate uses the slogan 'The Natural State'?"
    state_abbreviation: "AR"
    image_url: "/images/license-plates/arkansas/1995-natural-state.webp"
    choices: ["Tennessee", "Missouri", "Oklahoma", "Arkansas"]
    correct_answer: "Arkansas"
    explanation: "'The Natural State' replaced the earlier 'Land of Opportunity' in 1995 to spotlight Arkansas's rivers, lakes, forests, and mountains. It was chosen in a statewide contest and stuck immediately."

  - question: "Which state issued this iconic license plate?"
    state_abbreviation: "CA"
    image_url: "/images/license-plates/california/1993-half-dome.webp"
    choices: ["California", "Oregon", "Nevada", "Hawaii"]
    correct_answer: "California"
    explanation: "California's 1993 plate design features the distinctive silhouette of Half Dome in Yosemite — one of the most recognizable rock formations in North America. California is the most populous U.S. state and issues more license plates than any other."

  - question: "Which state issued this license plate?"
    state_abbreviation: "CO"
    image_url: "/images/license-plates/colorado/colorful-colorado-plate.webp"
    choices: ["Utah", "Colorado", "Wyoming", "Montana"]
    correct_answer: "Colorado"
    explanation: "'Colorful Colorado' has been the state's plate slogan since the 1950s — a reference to the vivid red sandstone, green forests, white snow, and blue skies that make up the state's landscape. Colorado has one of the most consistently used plate slogans in the country."

  - question: "Which state's plate shows the slogan 'Constitution State'?"
    state_abbreviation: "CT"
    image_url: "/images/license-plates/connecticut/constitution-state-plate.webp"
    choices: ["Massachusetts", "Rhode Island", "Connecticut", "New York"]
    correct_answer: "Connecticut"
    explanation: "Connecticut calls itself the 'Constitution State' because its Fundamental Orders of 1639 is considered one of the first written constitutions in history — predating the U.S. Constitution by 150 years."

  - question: "Which state's plate uses the slogan 'The First State'?"
    state_abbreviation: "DE"
    image_url: "/images/license-plates/delaware/first-state-plate.webp"
    choices: ["Maryland", "Pennsylvania", "New Jersey", "Delaware"]
    correct_answer: "Delaware"
    explanation: "Delaware earned 'The First State' by being the first to ratify the U.S. Constitution on December 7, 1787. Delaware residents take this distinction seriously — it appears on plates, signs, and practically every state identifier."

  - question: "Which state's plate carries the slogan 'Sunshine State'?"
    state_abbreviation: "FL"
    image_url: "/images/license-plates/florida/1950s-sunshine-state.webp"
    choices: ["Florida", "Georgia", "Alabama", "South Carolina"]
    correct_answer: "Florida"
    explanation: "Florida's 'Sunshine State' slogan dates to the 1940s and officially became the state nickname in 1970. Florida averages over 230 sunny days per year, making it one of the sunniest states in the country."

  - question: "Which state's plate features the slogan 'Peach State'?"
    state_abbreviation: "GA"
    image_url: "/images/license-plates/georgia/peach-state-plate.webp"
    choices: ["Alabama", "Georgia", "Tennessee", "North Carolina"]
    correct_answer: "Georgia"
    explanation: "Georgia's 'Peach State' nickname comes from its long association with peach farming, which dominated the state's agriculture in the late 19th and early 20th centuries. Georgia peaches remain famous for their size and sweetness."

  - question: "Which state's plate shows the slogan 'Aloha State'?"
    state_abbreviation: "HI"
    image_url: "/images/license-plates/hawaii/rainbow-aloha-state-plate.webp"
    choices: ["California", "Washington", "Hawaii", "Oregon"]
    correct_answer: "Hawaii"
    explanation: "'Aloha State' captures Hawaii's spirit of welcome — 'aloha' means love, peace, and compassion in Hawaiian, and is used as both hello and goodbye. Hawaii adopted this as its official state nickname when it became the 50th state in 1959."

  - question: "Which state's plate famously reads 'Famous Potatoes'?"
    state_abbreviation: "ID"
    image_url: "/images/license-plates/idaho/famous-potatoes-plate.webp"
    choices: ["Montana", "Wyoming", "Oregon", "Idaho"]
    correct_answer: "Idaho"
    explanation: "Idaho introduced 'Famous Potatoes' in 1957 and it became one of the most celebrated plate slogans in the country — celebrated for its blunt, unapologetic practicality. Idaho produces about one-third of all U.S. potatoes."

  - question: "Which state's plate carries the slogan 'Land of Lincoln'?"
    state_abbreviation: "IL"
    image_url: "/images/license-plates/illinois/land-of-lincoln-plate.webp"
    choices: ["Illinois", "Indiana", "Iowa", "Wisconsin"]
    correct_answer: "Illinois"
    explanation: "Abraham Lincoln lived in Illinois for 24 years before becoming president. He practiced law in Springfield, served in the state legislature, and launched his political career there. Illinois has used 'Land of Lincoln' on its plates since 1954."

  - question: "Which state's plate carries the slogan 'Crossroads of America'?"
    state_abbreviation: "IN"
    image_url: "/images/license-plates/indiana/indiana-crossroads-plate.webp"
    choices: ["Ohio", "Indiana", "Illinois", "Kentucky"]
    correct_answer: "Indiana"
    explanation: "'Crossroads of America' became Indiana's official state motto in 1937, reflecting the state's central position in national highway, railroad, and now interstate travel. More interstate highways converge in Indiana than in any other state."

  - question: "Which state's plate uses the slogan 'Corn State'?"
    state_abbreviation: "IA"
    image_url: "/images/license-plates/iowa/iowa-corn-state-plate.webp"
    choices: ["Minnesota", "Nebraska", "Iowa", "Missouri"]
    correct_answer: "Iowa"
    explanation: "Iowa has been the top corn-producing state in the U.S. for much of the 20th and 21st centuries. 'Corn State' sums it up plainly — Iowa grows around 2 billion bushels of corn per year."

  - question: "Which state's plate shows the slogan 'To the Stars'?"
    state_abbreviation: "KS"
    image_url: "/images/license-plates/kansas/kansas-to-the-stars-plate.webp"
    choices: ["Nebraska", "Oklahoma", "Missouri", "Kansas"]
    correct_answer: "Kansas"
    explanation: "Kansas's plate slogan 'To the Stars' is the short form of the state motto 'Ad Astra per Aspera' — Latin for 'To the Stars Through Difficulties.' It was adopted in 1861 and references both the Great Plains landscape and the state's pioneering spirit."

  - question: "Which state's plate bears the slogan 'Bluegrass State'?"
    state_abbreviation: "KY"
    image_url: "/images/license-plates/kentucky/kentucky-bluegrass-state-plate.png"
    choices: ["Kentucky", "Tennessee", "Virginia", "West Virginia"]
    correct_answer: "Kentucky"
    explanation: "Kentucky's 'Bluegrass State' nickname comes from its famous bluegrass pastures — the ideal environment for raising thoroughbred horses. The Bluegrass Region in central Kentucky is home to many of the world's most famous horse farms and the Kentucky Derby."

  - question: "Which state's plate features the slogan 'Sportsman's Paradise'?"
    state_abbreviation: "LA"
    image_url: "/images/license-plates/louisiana/2005-pelican-sportsmans-paradise.jpg"
    choices: ["Mississippi", "Louisiana", "Alabama", "Arkansas"]
    correct_answer: "Louisiana"
    explanation: "Louisiana has used 'Sportsman's Paradise' on its plates since 1958, celebrating the state's unmatched hunting and fishing. With 3 million acres of coastal wetlands and some of the best duck hunting in North America, it's a well-earned title."

  - question: "Which state's plate reads 'Vacationland'?"
    state_abbreviation: "ME"
    image_url: "/images/license-plates/maine/maine-vacationland-chickadee-current.jpg"
    choices: ["Vermont", "New Hampshire", "Maine", "Massachusetts"]
    correct_answer: "Maine"
    explanation: "'Vacationland' has been on Maine plates since 1936 — one of the longest-running plate slogans in the country. Maine's coastline, lobster, Acadia National Park, and fall foliage draw millions of tourists every summer."

  - question: "Which state issued this license plate?"
    state_abbreviation: "MD"
    image_url: "/images/license-plates/maryland/2010-fort-mchenry-plate.jpg"
    choices: ["Delaware", "Virginia", "Pennsylvania", "Maryland"]
    correct_answer: "Maryland"
    explanation: "Maryland's Fort McHenry plate celebrates the fort that survived the British bombardment in 1814 — the battle that inspired Francis Scott Key to write 'The Star-Spangled Banner.' The plate's distinctive black-and-gold design echoes Maryland's state colors."

  - question: "Which state's plate shows the slogan 'Spirit of America'?"
    state_abbreviation: "MA"
    image_url: "/images/license-plates/massachusetts/spirit-of-america-plate.jpg"
    choices: ["Massachusetts", "Connecticut", "Rhode Island", "New York"]
    correct_answer: "Massachusetts"
    explanation: "Massachusetts used 'Spirit of America' to highlight its foundational role in American history — the Mayflower landing, the Boston Tea Party, Lexington and Concord, and Paul Revere's ride all took place here. The state was the birthplace of American independence."

  - question: "Which state's plate uses the slogan 'Water Wonderland'?"
    state_abbreviation: "MI"
    image_url: "/images/license-plates/michigan/1959-water-wonderland-plate.jpg"
    choices: ["Wisconsin", "Michigan", "Ohio", "Minnesota"]
    correct_answer: "Michigan"
    explanation: "'Water Wonderland' appeared on Michigan plates from 1954 to 1968, highlighting the state's 3,200 miles of Great Lakes shoreline — more than any other state. Michigan borders four of the five Great Lakes and has over 11,000 inland lakes."

  - question: "Which state's plate features the slogan '10,000 Lakes'?"
    state_abbreviation: "MN"
    image_url: "/images/license-plates/minnesota/1952-10000-lakes-plate.jpg"
    choices: ["North Dakota", "Wisconsin", "Minnesota", "Iowa"]
    correct_answer: "Minnesota"
    explanation: "Minnesota's 'Land of 10,000 Lakes' has been on plates since 1950. Minnesota actually has closer to 11,842 lakes larger than ten acres — but '10,000 Lakes' has a better ring to it."

  - question: "Which state's plate bears the slogan 'Birthplace of American Music'?"
    state_abbreviation: "MS"
    image_url: "/images/license-plates/mississippi/2012-birthplace-american-music-plate.jpg"
    choices: ["Alabama", "Louisiana", "Arkansas", "Mississippi"]
    correct_answer: "Mississippi"
    explanation: "Mississippi adopted 'Birthplace of American Music' in 2012, celebrating the state's unmatched musical heritage: blues originated in the Mississippi Delta, and the state produced Elvis Presley, B.B. King, Robert Johnson, Jimmy Buffett, and countless others."

  - question: "Which state's plate carries the slogan 'Show Me State'?"
    state_abbreviation: "MO"
    image_url: "/images/license-plates/missouri/2009-bluebird-show-me-state.jpg"
    choices: ["Missouri", "Kansas", "Illinois", "Arkansas"]
    correct_answer: "Missouri"
    explanation: "'Show Me State' reflects Missouri's reputation for skepticism and pragmatism — the phrase means 'don't just tell me, demonstrate it.' The origin is disputed, but it's been associated with Missouri since at least the 1890s. The Eastern Bluebird on this plate is the state bird."

  - question: "Which state's plate reads 'Big Sky Country'?"
    state_abbreviation: "MT"
    image_url: "/images/license-plates/montana/1967-big-sky-country.jpg"
    choices: ["Wyoming", "Montana", "Idaho", "North Dakota"]
    correct_answer: "Montana"
    explanation: "'Big Sky Country' has been Montana's plate slogan since 1967 — inspired by the 1962 novel 'The Big Sky' by A.B. Guthrie Jr. Montana is the fourth-largest state by area, with vast open landscapes that produce some of the most expansive skies in the country."

  - question: "Which state's plate uses the slogan 'Cornhusker State'?"
    state_abbreviation: "NE"
    image_url: "/images/license-plates/nebraska/1969-cornhusker-state.jpg"
    choices: ["Iowa", "South Dakota", "Nebraska", "Kansas"]
    correct_answer: "Nebraska"
    explanation: "'Cornhusker State' has appeared on Nebraska plates since 1969, reflecting the state's dominant corn agriculture. A cornhusker was a person — or machine — that stripped corn kernels from their husks during harvest. Nebraska is consistently one of the top corn-producing states."

  - question: "Which state's plate bears the slogan 'Silver State'?"
    state_abbreviation: "NV"
    image_url: "/images/license-plates/nevada/2001-silver-state-sunset.jpg"
    choices: ["Arizona", "Utah", "Colorado", "Nevada"]
    correct_answer: "Nevada"
    explanation: "'Silver State' references Nevada's massive silver mining boom in the 1860s — the Comstock Lode was the first major silver discovery in the U.S. and triggered a rush that shaped Nevada's entire early economy. Nevada's name comes from the Spanish word for 'snow-capped.'"

  - question: "Which state's plate shows the slogan 'Live Free or Die'?"
    state_abbreviation: "NH"
    image_url: "/images/license-plates/new-hampshire/1999-current-live-free-or-die.jpg"
    choices: ["New Hampshire", "Vermont", "Maine", "Massachusetts"]
    correct_answer: "New Hampshire"
    explanation: "'Live Free or Die' is widely considered the most famous state license plate motto in the country. The phrase comes from a 1809 toast by Revolutionary War general John Stark: 'Live free or die: Death is not the worst of evils.' New Hampshire has used it on plates since 1971."

  - question: "Which state's plate carries the slogan 'Garden State'?"
    state_abbreviation: "NJ"
    image_url: "/images/license-plates/new-jersey/2014-current-garden-state.jpg"
    choices: ["Delaware", "New Jersey", "Pennsylvania", "Maryland"]
    correct_answer: "New Jersey"
    explanation: "'Garden State' was coined by Abraham Browning in an 1876 speech comparing New Jersey to a barrel being squeezed between Philadelphia and New York. Despite its dense urban image, New Jersey has significant agriculture — it's a top producer of blueberries, cranberries, and tomatoes."

  - question: "Which state's plate reads 'Land of Enchantment'?"
    state_abbreviation: "NM"
    image_url: "/images/license-plates/new-mexico/2010-turquoise-land-of-enchantment.jpg"
    choices: ["Arizona", "Colorado", "New Mexico", "Texas"]
    correct_answer: "New Mexico"
    explanation: "'Land of Enchantment' has been New Mexico's nickname since 1935 — one of the earliest official state tourism slogans in the country. The phrase captures the state's ancient landscapes, adobe architecture, Indigenous culture, and stark desert beauty."

  - question: "Which state's plate shows the motto 'Excelsior'?"
    state_abbreviation: "NY"
    image_url: "/images/license-plates/new-york/2020-excelsior.jpg"
    choices: ["Pennsylvania", "New Jersey", "Connecticut", "New York"]
    correct_answer: "New York"
    explanation: "'Excelsior' means 'Ever Upward' in Latin and has been New York's state motto since 1778. The word appears on the state seal and periodically on license plates. It was also the title of a famous 1841 poem by Henry Wadsworth Longfellow that brought the word into popular use."

  - question: "Which state's plate bears the slogan 'First in Flight'?"
    state_abbreviation: "NC"
    image_url: "/images/license-plates/north-carolina/standard-plates-official.jpg"
    choices: ["North Carolina", "Virginia", "South Carolina", "Tennessee"]
    correct_answer: "North Carolina"
    explanation: "North Carolina's 'First in Flight' refers to the Wright Brothers' first successful airplane flight at Kitty Hawk on December 17, 1903. Ohio, where the Wright Brothers were born, uses 'Birthplace of Aviation' — a friendly rivalry that has sparked real legislative disputes in both states."

  - question: "Which state's plate uses the slogan 'Legendary'?"
    state_abbreviation: "ND"
    image_url: "/images/license-plates/north-dakota/2016-legendary.jpg"
    choices: ["Montana", "North Dakota", "South Dakota", "Minnesota"]
    correct_answer: "North Dakota"
    explanation: "North Dakota adopted 'Legendary' in 2009 as a tourism slogan to promote the state's dramatic Badlands, Theodore Roosevelt National Park, and Native American heritage. It replaced 'Discover the Spirit,' which had itself replaced 'Peace Garden State.'"

  - question: "Which state's plate features the slogan 'Birthplace of Aviation'?"
    state_abbreviation: "OH"
    image_url: "/images/license-plates/ohio/1997-birthplace-of-aviation.jpg"
    choices: ["Indiana", "Pennsylvania", "Ohio", "Michigan"]
    correct_answer: "Ohio"
    explanation: "Ohio adopted 'Birthplace of Aviation' in 1997 to claim the Wright Brothers — Wilbur and Orville were born in Ohio and built their aircraft in Dayton. North Carolina, where the first flight happened, uses 'First in Flight' — the debate over who gets credit has been going for decades."

  - question: "Which state issued this license plate?"
    state_abbreviation: "OK"
    image_url: "/images/license-plates/oklahoma/1989-oklahoma-is-ok.jpg"
    choices: ["Kansas", "Missouri", "Texas", "Oklahoma"]
    correct_answer: "Oklahoma"
    explanation: "'Oklahoma is OK' — with OK serving double duty as the state abbreviation and an informal endorsement — appeared on Oklahoma plates from 1969 through the 2000s. It became one of the most recognized (and most parodied) plate slogans in the country."

  - question: "Which state's plate reads 'Pacific Wonderland'?"
    state_abbreviation: "OR"
    image_url: "/images/license-plates/oregon/2009-pacific-wonderland.jpg"
    choices: ["Oregon", "Washington", "Idaho", "California"]
    correct_answer: "Oregon"
    explanation: "'Pacific Wonderland' appeared on Oregon plates from 1959 to 1989 and returned in 2009 as an optional plate slogan. Oregon's coastline, Crater Lake, Columbia River Gorge, and Cascade Range mountains make the 'wonderland' label easy to defend."

  - question: "Which state's plate carries the slogan 'Keystone State'?"
    state_abbreviation: "PA"
    image_url: "/images/license-plates/pennsylvania/1977-keystone-state.jpg"
    choices: ["New York", "Pennsylvania", "New Jersey", "Ohio"]
    correct_answer: "Pennsylvania"
    explanation: "Pennsylvania earned the 'Keystone State' nickname because of its central geographic and political position among the original 13 colonies — like a keystone in an arch, which holds all the other stones in place. The state was also the site of the Constitutional Convention in 1787."

  - question: "Which state's plate bears the slogan 'Ocean State'?"
    state_abbreviation: "RI"
    image_url: "/images/license-plates/rhode-island/2023-ocean-passenger.jpg"
    choices: ["Connecticut", "Massachusetts", "Rhode Island", "New York"]
    correct_answer: "Rhode Island"
    explanation: "Rhode Island calls itself the 'Ocean State' because despite being the smallest state in the country, it has over 400 miles of coastline. Narragansett Bay cuts deeply into the state's interior, giving Rhode Island a remarkably high coastline-to-land ratio."

  - question: "Which state's plate features the slogan 'Smiling Faces, Beautiful Places'?"
    state_abbreviation: "SC"
    image_url: "/images/license-plates/south-carolina/1998-smiling-faces-beautiful-places.jpg"
    choices: ["North Carolina", "Georgia", "Alabama", "South Carolina"]
    correct_answer: "South Carolina"
    explanation: "South Carolina adopted 'Smiling Faces, Beautiful Places' as its tourism motto in 1981. It celebrates both the state's landscape — from the Blue Ridge Mountains to the Lowcountry coast — and the Southern hospitality that South Carolina is known for."

  - question: "Which state's plate reads 'Great Faces, Great Places'?"
    state_abbreviation: "SD"
    image_url: "/images/license-plates/south-dakota/1990-great-faces-great-places.jpg"
    choices: ["South Dakota", "Nebraska", "North Dakota", "Montana"]
    correct_answer: "South Dakota"
    explanation: "'Great Faces, Great Places' refers directly to Mount Rushmore — four great faces carved into the Black Hills — and the state's other natural attractions including the Badlands, Custer State Park, and the Missouri River. South Dakota has used some form of this slogan since 1990."

  - question: "Which state's plate carries the slogan 'Volunteer State'?"
    state_abbreviation: "TN"
    image_url: "/images/license-plates/tennessee/2006-volunteer-state.jpg"
    choices: ["Kentucky", "Tennessee", "Arkansas", "Georgia"]
    correct_answer: "Tennessee"
    explanation: "Tennessee earned 'Volunteer State' from the overwhelming response to Andrew Jackson's call for troops during the War of 1812 — far more Tennesseans volunteered than were needed. The tradition continued in the Mexican-American War and Civil War."

  - question: "Which state's plate bears the slogan 'The Lone Star State'?"
    state_abbreviation: "TX"
    image_url: "/images/license-plates/texas/1992-lone-star-state.jpg"
    choices: ["Oklahoma", "New Mexico", "Texas", "Louisiana"]
    correct_answer: "Texas"
    explanation: "'The Lone Star State' refers to the single star on the Texas state flag — a symbol of Texas's six years as an independent republic (1836–1845) before joining the United States. No other state has existed as an independent country in the modern era."

  - question: "Which state's plate famously reads 'Greatest Snow on Earth'?"
    state_abbreviation: "UT"
    image_url: "/images/license-plates/utah/1985-greatest-snow-on-earth.png"
    choices: ["Colorado", "Arizona", "Wyoming", "Utah"]
    correct_answer: "Utah"
    explanation: "Utah's 'Greatest Snow on Earth' claim is backed by science: the Wasatch Range receives a unique combination of cold, dry air from the Pacific and moisture from the Great Salt Lake, producing extraordinarily light, fluffy powder that skiers worldwide seek out."

  - question: "Which state's plate uses the slogan 'Green Mountain State'?"
    state_abbreviation: "VT"
    image_url: "/images/license-plates/vermont/1985-green-mountain-state.png"
    choices: ["Vermont", "New Hampshire", "Maine", "Massachusetts"]
    correct_answer: "Vermont"
