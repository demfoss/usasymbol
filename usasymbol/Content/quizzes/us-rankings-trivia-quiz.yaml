title: U.S. Rankings Trivia Quiz
slug: us-rankings-trivia-quiz
description: 'How well do you know America? A friendly trivia quiz built from our state rankings: biggest,
  oldest, most populous, top producers and more.'
difficulty: Easy
estimated_time: 5 min
category: Rankings
questions_per_round: 10
tags:
- us trivia quiz
- us states trivia
- usa geography quiz
- state rankings quiz
- how well do you know america
seo:
  title: How Well Do You Know America? U.S. Trivia Quiz
  description: Free U.S. trivia quiz with questions on the biggest, oldest and most populous states, top
    farm and energy producers, and famous firsts.
  intro_paragraphs:
  - Which state is the biggest? Where did the Roosevelts grow up? Which state really grows the most peaches?
    These questions come straight from the topics in our state rankings.
  - There are no exact percentages here, only the kind of facts a curious person ought to know. Each round
    draws ten questions from a pool of more than 100, and the answers are shuffled every time.
content:
  sections:
  - id: about
    title: Where these questions come from
    paragraphs:
    - Every question is based on a topic from our state rankings, from land area and population to farm
      output and energy. When you miss one, the explanation tells you why, and each ranking page has the
      full list of states.
    links:
    - text: Browse all state rankings
      href: /rankings
faq:
- question: How many questions are there?
  answer: There are 108 questions in the pool, and every round picks 10 of them at random.
- question: Are the questions hard?
  answer: No. They are meant to be fun, with no exact percentages and no tricky math, only the facts behind
    the rankings.
questions:
- question: Which of these is officially a commonwealth rather than just a state?
  choices:
  - Kentucky
  - Ohio
  - Georgia
  - Maine
  correct_answer: Kentucky
  explanation: Kentucky, Massachusetts, Pennsylvania and Virginia call themselves commonwealths.
- question: From which country did the United States buy Alaska in 1867?
  choices:
  - Russia
  - Britain
  - Spain
  - Canada
  correct_answer: Russia
  explanation: Alaska cost about two cents an acre, and critics at the time called it 'Seward's Folly'.
- question: Which state has the most electoral votes?
  choices:
  - Florida
  - California
  - Texas
  - New York
  correct_answer: California
  explanation: The most populous state gets the most electoral votes.
- question: What is the capital of Florida?
  choices:
  - Tallahassee
  - Jacksonville
  - Orlando
  - Miami
  correct_answer: Tallahassee
  explanation: Tallahassee was picked partly because it sat roughly halfway between two early cities.
- question: Which state has the fewest people?
  choices:
  - Alaska
  - North Dakota
  - Wyoming
  - Vermont
  correct_answer: Wyoming
  explanation: Wyoming is the least populous state, with fewer residents than many single cities.
- question: Which state has the lowest average elevation?
  choices:
  - Mississippi
  - Florida
  - Delaware
  - Louisiana
  correct_answer: Delaware
  explanation: Delaware is the flattest and lowest state, with an average elevation not far above sea
    level.
- question: Which state has the tallest state capitol building, at about 450 feet?
  choices:
  - Florida
  - Texas
  - Michigan
  - Louisiana
  correct_answer: Louisiana
  explanation: The Louisiana State Capitol in Baton Rouge is the tallest state capitol in the country.
- question: Which state sees the most lightning strikes per square mile?
  choices:
  - Arizona
  - Florida
  - Texas
  - Colorado
  correct_answer: Florida
  explanation: Warm, humid air and sea breezes fire up daily thunderstorms in Florida.
- question: Which Great Lake lies entirely within the United States?
  choices:
  - Lake Michigan
  - Lake Erie
  - Lake Ontario
  - Lake Huron
  correct_answer: Lake Michigan
  explanation: The other four Great Lakes are shared with Canada.
- question: Which was the last state to join the Union?
  choices:
  - Alaska
  - Hawaii
  - Arizona
  - New Mexico
  correct_answer: Hawaii
  explanation: Hawaii became the 50th state in August 1959, a few months after Alaska.
- question: Which state has the most 14,000-foot mountains?
  choices:
  - Wyoming
  - Colorado
  - California
  - Utah
  correct_answer: Colorado
  explanation: Colorado's 'fourteeners' are a hiking bucket list of their own.
- question: In which state was Abraham Lincoln born?
  choices:
  - Illinois
  - Indiana
  - Ohio
  - Kentucky
  correct_answer: Kentucky
  explanation: Lincoln was born in a log cabin in Kentucky and later made his name in Illinois.
- question: Which state generates the most wind power?
  choices:
  - Iowa
  - Texas
  - Oklahoma
  - Kansas
  correct_answer: Texas
  explanation: Texas has the most wind turbines of any state.
- question: Which state has the most counties?
  choices:
  - Kentucky
  - Georgia
  - Virginia
  - Texas
  correct_answer: Texas
  explanation: Texas has more counties than any other state.
- question: Which state grows the most apples?
  choices:
  - Pennsylvania
  - Michigan
  - New York
  - Washington
  correct_answer: Washington
  explanation: Washington grows more than half of America's apples.
- question: Which state has the largest economy?
  choices:
  - Texas
  - Florida
  - California
  - New York
  correct_answer: California
  explanation: California's economy would rank among the biggest in the world if it were a country.
- question: Which lake is the deepest in the United States?
  choices:
  - Lake Tahoe, California and Nevada
  - Crater Lake, Oregon
  - Lake Michigan
  - Lake Champlain
  correct_answer: Crater Lake, Oregon
  explanation: Crater Lake fills the crater of a collapsed volcano and is famous for its deep blue water.
- question: Which state hosts the Preakness Stakes, the second race of horse racing's Triple Crown?
  choices:
  - Kentucky
  - New York
  - Florida
  - Maryland
  correct_answer: Maryland
  explanation: The Preakness is run in Baltimore.
- question: Which state has the most people?
  choices:
  - California
  - Texas
  - New York
  - Florida
  correct_answer: California
  explanation: California has more residents than any other state, and Texas is second.
- question: Silicon Valley, the home of many tech giants, is in which state?
  choices:
  - Massachusetts
  - Texas
  - California
  - Washington
  correct_answer: California
  explanation: Silicon Valley sits south of San Francisco.
- question: Which state grows the most coffee in the U.S.?
  choices:
  - Hawaii
  - Alaska
  - Florida
  - California
  correct_answer: Hawaii
  explanation: Kona coffee from Hawaii is famous around the world.
- question: Which state has the highest average elevation?
  choices:
  - Montana
  - Wyoming
  - Colorado
  - Idaho
  correct_answer: Colorado
  explanation: Even Colorado's lowest point is higher than the highest point of many states.
- question: Which state has the most national parks?
  choices:
  - Alaska
  - Utah
  - California
  - Colorado
  correct_answer: California
  explanation: California has nine, including Yosemite, Sequoia and Joshua Tree.
- question: Which state raises the most hogs?
  choices:
  - North Carolina
  - Texas
  - Georgia
  - Iowa
  correct_answer: Iowa
  explanation: Iowa has far more hogs than people.
- question: Which of these states is NOT one of the Four Corners states?
  choices:
  - New Mexico
  - Colorado
  - Utah
  - Nevada
  correct_answer: Nevada
  explanation: The Four Corners are Utah, Colorado, Arizona and New Mexico, the only place where four
    states meet.
- question: Which state is the most crowded, with the highest population density?
  choices:
  - Rhode Island
  - New Jersey
  - Connecticut
  - Massachusetts
  correct_answer: New Jersey
  explanation: New Jersey packs more people per square mile than any other state.
- question: Which state grows the most tobacco?
  choices:
  - Tennessee
  - Kentucky
  - Virginia
  - North Carolina
  correct_answer: North Carolina
  explanation: North Carolina is first, and Kentucky is second.
- question: In which state was basketball invented?
  choices:
  - North Carolina
  - Indiana
  - Kentucky
  - Massachusetts
  correct_answer: Massachusetts
  explanation: James Naismith invented it in 1891 in Springfield, Massachusetts.
- question: What is the capital of New York?
  choices:
  - Buffalo
  - New York City
  - Albany
  - Syracuse
  correct_answer: Albany
  explanation: Many people guess New York City, but the capital has been Albany since 1797.
- question: Which state usually has the most expensive gas?
  choices:
  - Oklahoma
  - Mississippi
  - Texas
  - California
  correct_answer: California
  explanation: California's taxes and special fuel rules push prices up.
- question: Which state has a single word name with the most letters?
  choices:
  - Mississippi
  - Connecticut
  - Pennsylvania
  - Massachusetts
  correct_answer: Massachusetts
  explanation: Massachusetts has 13 letters.
- question: Which U.S. state is the largest by total area?
  choices:
  - California
  - Montana
  - Texas
  - Alaska
  correct_answer: Alaska
  explanation: Alaska is more than twice the size of Texas, the next largest state.
- question: What is the oldest college in the United States?
  choices:
  - William & Mary
  - Princeton
  - Harvard
  - Yale
  correct_answer: Harvard
  explanation: Harvard was founded in 1636 in Massachusetts.
- question: In which state were both presidents Theodore Roosevelt and Franklin D. Roosevelt born?
  choices:
  - Massachusetts
  - New York
  - Virginia
  - Ohio
  correct_answer: New York
  explanation: Theodore was born in New York City, and Franklin in Hyde Park, New York.
- question: Which state has the most lighthouses?
  choices:
  - Florida
  - Maine
  - California
  - Michigan
  correct_answer: Michigan
  explanation: Michigan's long Great Lakes shoreline is dotted with lighthouses.
- question: Which of these states is landlocked, with no ocean or Great Lakes coast?
  choices:
  - Louisiana
  - Nebraska
  - Maryland
  - Maine
  correct_answer: Nebraska
  explanation: Nebraska has no ocean coast and no Great Lakes shoreline.
- question: Which state has the youngest population, by median age?
  choices:
  - Alaska
  - Idaho
  - Utah
  - Texas
  correct_answer: Utah
  explanation: Utah has the youngest population, thanks to big families.
- question: Which state recorded the coldest temperature in U.S. history?
  choices:
  - Wyoming
  - Alaska
  - Montana
  - Minnesota
  correct_answer: Alaska
  explanation: The record low came in interior Alaska in 1971.
- question: Which of these capitals is also the largest city in its state?
  choices:
  - Albany, New York
  - Boston, Massachusetts
  - Harrisburg, Pennsylvania
  - Austin, Texas
  correct_answer: Boston, Massachusetts
  explanation: Austin is a big city, but Houston is bigger. Boston is the largest city in its state.
- question: In which state is the Baseball Hall of Fame?
  choices:
  - Pennsylvania
  - New York
  - Massachusetts
  - Ohio
  correct_answer: New York
  explanation: The Hall of Fame is in Cooperstown, New York.
- question: Which state hosted the 2002 Winter Olympics?
  choices:
  - Colorado
  - Washington
  - Montana
  - Utah
  correct_answer: Utah
  explanation: Salt Lake City hosted those Games.
- question: Which of these was NOT one of the original thirteen colonies?
  choices:
  - Connecticut
  - Vermont
  - Georgia
  - Rhode Island
  correct_answer: Vermont
  explanation: Vermont joined in 1791 as the 14th state.
- question: The 1849 Gold Rush brought thousands of prospectors to which state?
  choices:
  - Nevada
  - Alaska
  - California
  - Colorado
  correct_answer: California
  explanation: The 49ers gave a football team its name.
- question: Georgia is called the Peach State. Which state actually grows the most peaches?
  choices:
  - Alabama
  - California
  - Georgia
  - South Carolina
  correct_answer: California
  explanation: California grows far more peaches than Georgia, which still has the nickname.
- question: Which state has the lowest median household income?
  choices:
  - Mississippi
  - West Virginia
  - Louisiana
  - Arkansas
  correct_answer: Mississippi
  explanation: Mississippi has been at or near the bottom of income rankings for decades.
- question: Which state has the fewest counties, only three?
  choices:
  - Delaware
  - Rhode Island
  - Connecticut
  - Hawaii
  correct_answer: Delaware
  explanation: Delaware's three counties are Kent, New Castle and Sussex.
- question: Which of these states does NOT border Mexico?
  choices:
  - Nevada
  - Texas
  - California
  - Arizona
  correct_answer: Nevada
  explanation: Only California, Arizona, New Mexico and Texas touch Mexico.
- question: Which state is the driest in the country?
  choices:
  - Nevada
  - Arizona
  - Utah
  - New Mexico
  correct_answer: Nevada
  explanation: Nevada gets less rain than any other state, though Arizona's deserts feel drier.
- question: Which state is generally the most expensive place to live?
  choices:
  - Mississippi
  - Hawaii
  - Oklahoma
  - Kansas
  correct_answer: Hawaii
  explanation: Island shipping costs and expensive housing push Hawaii to the top.
- question: Which state grows the most potatoes?
  choices:
  - Nebraska
  - Georgia
  - Maine
  - Idaho
  correct_answer: Idaho
  explanation: Idaho is so tied to potatoes that its license plates once said 'Famous Potatoes'.
- question: Which state makes the most wine?
  choices:
  - New York
  - Oregon
  - Washington
  - California
  correct_answer: California
  explanation: California makes roughly four out of every five bottles of American wine.
- question: Which state makes the most cheese?
  choices:
  - Vermont
  - New York
  - Wisconsin
  - Idaho
  correct_answer: Wisconsin
  explanation: Wisconsin is known as 'America's Dairyland'.
- question: Which state grows the most cotton?
  choices:
  - Texas
  - Mississippi
  - Georgia
  - Arkansas
  correct_answer: Texas
  explanation: Texas grows more cotton than any other state.
- question: The Indianapolis 500 is run in which state?
  choices:
  - Kentucky
  - Michigan
  - Ohio
  - Indiana
  correct_answer: Indiana
  explanation: The race has been held at the Indianapolis Motor Speedway since 1911.
- question: Which state records the most tornadoes in a typical year?
  choices:
  - Nebraska
  - Texas
  - Kansas
  - Oklahoma
  correct_answer: Texas
  explanation: Texas is huge, so it wins by count. Kansas and Oklahoma get more per square mile.
- question: Which state is the birthplace of the most U.S. presidents?
  choices:
  - New York
  - Ohio
  - Massachusetts
  - Virginia
  correct_answer: Virginia
  explanation: Virginia has produced eight presidents, and Ohio is close behind.
- question: Which state has the oldest population, by median age?
  choices:
  - Vermont
  - Maine
  - Florida
  - West Virginia
  correct_answer: Maine
  explanation: Florida is famous for retirees, but Maine has the highest median age.
- question: Kilauea, one of the most active volcanoes on Earth, is in which state?
  choices:
  - Oregon
  - Alaska
  - Hawaii
  - Washington
  correct_answer: Hawaii
  explanation: Hawaii's volcanoes are still building new land.
- question: Which state has a one-house (unicameral) legislature, the only one in the country?
  choices:
  - Kansas
  - Nebraska
  - Montana
  - Wyoming
  correct_answer: Nebraska
  explanation: Nebraska's legislature has just one chamber, and its members run without party labels.
- question: Which state has the most cattle?
  choices:
  - Oklahoma
  - Kansas
  - Nebraska
  - Texas
  correct_answer: Texas
  explanation: Texas has the biggest cattle herd by far.
- question: Which state grows the most corn?
  choices:
  - Kansas
  - Nebraska
  - Iowa
  - Indiana
  correct_answer: Iowa
  explanation: Iowa is the heart of the Corn Belt.
- question: Which of these states is split between two time zones?
  choices:
  - Colorado
  - Georgia
  - Ohio
  - Florida
  correct_answer: Florida
  explanation: Part of the Florida Panhandle follows Central Time, while the rest of the state follows
    Eastern Time.
- question: Which state has the most farms?
  choices:
  - Missouri
  - Texas
  - Iowa
  - California
  correct_answer: Texas
  explanation: Texas has the most farms, ahead of Missouri.
- question: In which state was Barack Obama born?
  choices:
  - Illinois
  - Massachusetts
  - Indiana
  - Hawaii
  correct_answer: Hawaii
  explanation: He was born in Honolulu.
- question: Which state has the largest county (San Bernardino County) in the lower 48?
  choices:
  - California
  - Arizona
  - Texas
  - Nevada
  correct_answer: California
  explanation: San Bernardino County is larger than several entire states.
- question: Which U.S. state is the smallest by area?
  choices:
  - Rhode Island
  - Hawaii
  - Connecticut
  - Delaware
  correct_answer: Rhode Island
  explanation: Rhode Island fits inside Alaska roughly 400 times, and it still has a big coastline for
    its size.
- question: Which is the longest river in the United States?
  choices:
  - Missouri River
  - Rio Grande
  - Colorado River
  - Columbia River
  correct_answer: Missouri River
  explanation: The Missouri River is the longest river in the country, and it flows into the Mississippi.
- question: Which state produces the most crude oil?
  choices:
  - California
  - North Dakota
  - Alaska
  - Texas
  correct_answer: Texas
  explanation: Texas has led the nation for decades.
- question: Which was the first U.S. national park?
  choices:
  - Grand Canyon
  - Yosemite
  - Yellowstone
  - Glacier
  correct_answer: Yellowstone
  explanation: Yellowstone was set aside in 1872, and it is widely seen as the first national park in
    the world.
- question: Which is the most populous city in the United States?
  choices:
  - Los Angeles
  - New York City
  - Chicago
  - Houston
  correct_answer: New York City
  explanation: New York City has far more residents than any other U.S. city.
- question: Which state produces the most coal?
  choices:
  - Wyoming
  - Pennsylvania
  - Kentucky
  - West Virginia
  correct_answer: Wyoming
  explanation: Wyoming's huge open-pit mines out-produce the Appalachian states.
- question: Which is the oldest continuously inhabited European-founded city in the U.S.?
  choices:
  - St. Augustine, Florida
  - Plymouth, Massachusetts
  - Jamestown, Virginia
  - Santa Fe, New Mexico
  correct_answer: St. Augustine, Florida
  explanation: Spain founded St. Augustine in 1565.
- question: In which state is the lowest point in the U.S., at Badwater Basin?
  choices:
  - Nevada
  - Florida
  - Louisiana
  - California
  correct_answer: California
  explanation: Badwater Basin in Death Valley sits far below sea level.
- question: Which state is home to both Harvard and MIT?
  choices:
  - New York
  - Connecticut
  - Massachusetts
  - Rhode Island
  correct_answer: Massachusetts
  explanation: Both are in the Boston area, just across the river from each other.
- question: Which state has the coldest average temperature?
  choices:
  - Alaska
  - Minnesota
  - Montana
  - North Dakota
  correct_answer: Alaska
  explanation: Alaska's average temperature is lower than any other state's.
- question: Which of these states shares a border with Canada?
  choices:
  - Colorado
  - Iowa
  - Maine
  - Kansas
  correct_answer: Maine
  explanation: Maine has a long border with Canada.
- question: Which of these states has no state income tax?
  choices:
  - California
  - Texas
  - New York
  - Illinois
  correct_answer: Texas
  explanation: Texas has no personal income tax, and neither do Florida, Nevada, Washington and a few
    other states.
- question: Which state shares a border with the most other states, tied with Tennessee?
  choices:
  - Texas
  - Colorado
  - Pennsylvania
  - Missouri
  correct_answer: Missouri
  explanation: Missouri and Tennessee each border eight states.
- question: Which U.S. building is the tallest in the country?
  choices:
  - Salesforce Tower, California
  - Central Park Tower, New York
  - One World Trade Center, New York
  - Willis Tower, Illinois
  correct_answer: One World Trade Center, New York
  explanation: One World Trade Center reaches 1,776 feet, a nod to the year of independence.
- question: What is the capital of Pennsylvania?
  choices:
  - Pittsburgh
  - Philadelphia
  - Harrisburg
  - Scranton
  correct_answer: Harrisburg
  explanation: Philadelphia was a capital long ago, but today it is Harrisburg.
- question: Deep-dish pizza is most famous in which state?
  choices:
  - Illinois
  - Ohio
  - New York
  - Michigan
  correct_answer: Illinois
  explanation: Deep-dish pizza is a Chicago tradition.
- question: Which state was the first to ratify the U.S. Constitution?
  choices:
  - Pennsylvania
  - Delaware
  - New Jersey
  - Virginia
  correct_answer: Delaware
  explanation: Delaware ratified on December 7, 1787, which is why it is called the First State.
- question: Which state grows the most pumpkins?
  choices:
  - Illinois
  - California
  - Ohio
  - Pennsylvania
  correct_answer: Illinois
  explanation: Illinois grows most of the pumpkins used for pie filling.
- question: What is the capital of Washington State?
  choices:
  - Spokane
  - Olympia
  - Seattle
  - Tacoma
  correct_answer: Olympia
  explanation: Seattle is bigger, but Olympia is the capital.
- question: Which state grows the most cranberries?
  choices:
  - Massachusetts
  - Wisconsin
  - Oregon
  - New Jersey
  correct_answer: Wisconsin
  explanation: Wisconsin passed Massachusetts as the top cranberry state long ago.
- question: Which state has the longest coastline in the country?
  choices:
  - Alaska
  - Florida
  - California
  - Hawaii
  correct_answer: Alaska
  explanation: Alaska's coastline is longer than that of all the other states combined.
- question: Which state has the largest share of its land owned by the federal government?
  choices:
  - Nevada
  - Alaska
  - Utah
  - Idaho
  correct_answer: Nevada
  explanation: About eight in ten acres in Nevada are federal land.
- question: Which state holds the record for the hottest air temperature ever measured in the U.S.?
  choices:
  - Texas
  - Nevada
  - California
  - Arizona
  correct_answer: California
  explanation: Death Valley set the record in 1913, and it is still among the hottest readings ever recorded
    on Earth.
- question: Which of these capital cities is the OLDEST in the country, founded in 1610?
  choices:
  - Richmond, Virginia
  - Annapolis, Maryland
  - Boston, Massachusetts
  - Santa Fe, New Mexico
  correct_answer: Santa Fe, New Mexico
  explanation: Santa Fe is the oldest state capital in the United States.
- question: Which state has the highest life expectancy?
  choices:
  - Nevada
  - Texas
  - Alaska
  - Hawaii
  correct_answer: Hawaii
  explanation: Hawaii leads the country in life expectancy.
- question: Which state is most often ranked number one for public schools?
  choices:
  - Arizona
  - Massachusetts
  - Nevada
  - Mississippi
  correct_answer: Massachusetts
  explanation: Massachusetts regularly tops national education rankings.
- question: Which state grows almost all of the country's almonds?
  choices:
  - Florida
  - California
  - Texas
  - Arizona
  correct_answer: California
  explanation: California's Central Valley grows nearly every almond in the country.
- question: Which state grows the most rice?
  choices:
  - Arkansas
  - California
  - Texas
  - Louisiana
  correct_answer: Arkansas
  explanation: Arkansas is the top rice state, and California is second.
- question: Which state produces the most honey?
  choices:
  - Florida
  - Ohio
  - North Dakota
  - Georgia
  correct_answer: North Dakota
  explanation: North Dakota's wide fields of clover and sunflowers are a bee paradise.
- question: Which state catches the most seafood by weight?
  choices:
  - Louisiana
  - Alaska
  - Maine
  - Washington
  correct_answer: Alaska
  explanation: Alaska's fisheries, especially pollock and salmon, are the largest in the country.
- question: Which mountain is the highest point in the United States?
  choices:
  - Mount Rainier, Washington
  - Mount Elbert, Colorado
  - Denali, Alaska
  - Mount Whitney, California
  correct_answer: Denali, Alaska
  explanation: Denali rises about 20,000 feet and is the tallest peak in North America.
- question: Which of these famous universities is NOT in the Ivy League?
  choices:
  - Stanford
  - Cornell
  - Brown
  - Dartmouth
  correct_answer: Stanford
  explanation: Stanford is in California, and the Ivy League is a set of eight schools in the Northeast.
- question: In which state is the best chance to see the northern lights?
  choices:
  - Alaska
  - Minnesota
  - Montana
  - Maine
  correct_answer: Alaska
  explanation: Interior Alaska sits under the auroral oval, which makes it one of the best places in the
    U.S.
- question: Which state touches the most Great Lakes?
  choices:
  - Michigan
  - Ohio
  - Minnesota
  - Illinois
  correct_answer: Michigan
  explanation: Michigan borders four of the five Great Lakes.
- question: Which state is home to the Tongass, the largest national forest in the country?
  choices:
  - Alaska
  - Montana
  - Oregon
  - California
  correct_answer: Alaska
  explanation: The Tongass covers most of Southeast Alaska.
- question: Which state produces the most maple syrup?
  choices:
  - Ohio
  - Maine
  - New York
  - Vermont
  correct_answer: Vermont
  explanation: Vermont taps more maple trees than any other state.
- question: The Green Bay Packers play in which state?
  choices:
  - Wisconsin
  - Minnesota
  - Illinois
  - Michigan
  correct_answer: Wisconsin
  explanation: The Packers are the only major pro team owned by its fans.
- question: Which state lands the most lobster?
  choices:
  - New Hampshire
  - Rhode Island
  - Massachusetts
  - Maine
  correct_answer: Maine
  explanation: Maine hauls in the vast majority of America's lobster.
- question: Which state is home to Old Faithful?
  choices:
  - Montana
  - Wyoming
  - Idaho
  - Utah
  correct_answer: Wyoming
  explanation: Old Faithful is in Yellowstone National Park, most of which lies in Wyoming.
- question: Which state has the most cities with more than 100,000 residents?
  choices:
  - Florida
  - California
  - New York
  - Texas
  correct_answer: California
  explanation: California has dozens of cities above that mark.
- question: Which state has the highest share of Latter-day Saints?
  choices:
  - Wyoming
  - Nevada
  - Idaho
  - Utah
  correct_answer: Utah
  explanation: Utah has the highest share of Latter-day Saints in the country.
- question: Which state has the most National Historic Landmarks?
  choices:
  - Ohio
  - New York
  - Texas
  - California
  correct_answer: New York
  explanation: New York is packed with landmarks from every era.
- question: Which state has the lowest population density?
