title: "U.S. State Capitals Quiz"
slug: "state-capitals-quiz"
description: "Learn and test all 50 U.S. state capitals with a fast quiz that uses randomized questions, instant feedback, and memorable facts to improve recall."

difficulty: "Hard"
estimated_time: "10–15 min"

tags: ["state capitals quiz", "50 states and capitals quiz", "states and capitals quiz", "state capitals practice test"]

seo:
  title: "U.S. State Capitals Quiz - Test All 50 States and Capitals"
  description: "Can you name all 50 U.S. state capitals? This free states and capitals quiz covers every state with randomized questions, instant feedback, and useful facts that help the capitals stick."
  intro_paragraphs:
    - "Can you name the capital of every U.S. state? This states and capitals quiz covers all 50 — including the ones that regularly catch people off guard."
    - "Questions shuffle every round, so it works as a one-time challenge or a state capitals practice test you can repeat until every answer is automatic."
    - "A heads-up before you start: only 17 state capitals are also the largest city in their state. The other 33 are somewhere more surprising."

content:
  sections:
    - id: "hardest-capitals"
      title: "State Capitals That Aren't the Biggest City"
      paragraphs:
        - "The most common mistakes on this quiz come from states where people instinctively name the largest or most famous city instead of the actual capital."
      list:
        - "Kentucky — Frankfort, not Louisville or Lexington"
        - "Nevada — Carson City, not Las Vegas or Reno"
        - "Illinois — Springfield, not Chicago"
        - "New York — Albany, not New York City"
        - "Pennsylvania — Harrisburg, not Philadelphia or Pittsburgh"
        - "Michigan — Lansing, not Detroit or Grand Rapids"
        - "Maryland — Annapolis, not Baltimore"
        - "New Mexico — Santa Fe, not Albuquerque"
        - "Montana — Helena, not Billings"
        - "Vermont — Montpelier, not Burlington"

    - id: "capitals-trivia"
      title: "State Capitals by the Numbers"
      paragraphs:
        - "A few facts worth knowing before or after the quiz:"
      list:
        - "Most populous capital: Phoenix, Arizona — over 1.6 million residents."
        - "Least populous capital: Montpelier, Vermont — fewer than 8,000 residents."
        - "Largest capital by area: Juneau, Alaska — bigger than Rhode Island."
        - "Smallest capital by area: Annapolis, Maryland."
        - "Oldest capital: Santa Fe, New Mexico — founded in 1610."
        - "Only capital unreachable by road: Juneau, Alaska — accessible only by air or sea."
        - "Washington, D.C. is the federal capital but is not a state capital."

    - id: "more-quizzes"
      title: "More U.S. State Symbol Quizzes"
      paragraphs:
        - "Once you've nailed the capitals, state flags and state nicknames are the next challenge — both have their own full 50-question quiz."
        - "For a broader test, try the U.S. States General Knowledge Quiz, which mixes capitals, flags, birds, mottos, and nicknames in a single round."

faq:
  - question: "Does this quiz cover all 50 state capitals?"
    answer: "Yes, every U.S. state is included. Washington, D.C. is not in the quiz — it's the federal capital, not a state capital."

  - question: "Which state capitals are the hardest to remember?"
    answer: "The trickiest ones are usually where the capital is not the largest or most famous city: Frankfort (Kentucky), Carson City (Nevada), Springfield (Illinois), Albany (New York), and Montpelier (Vermont) are the most commonly missed."

  - question: "Are the questions different each time I play?"
    answer: "Yes. Both the question order and the answer choices shuffle every round, so replaying the quiz is useful for practice."

  - question: "What is the most populous U.S. state capital?"
    answer: "Phoenix, Arizona, with over 1.6 million residents. It's one of the few cases where the state capital is also the largest city in the state by a wide margin."

  - question: "What is the least populous U.S. state capital?"
    answer: "Montpelier, Vermont, with fewer than 8,000 residents — the smallest state capital in the country by population."

  - question: "Which state capital can't be reached by road?"
    answer: "Juneau, Alaska. It's surrounded by water and mountains, so you can only get there by plane or boat."

  - question: "Is this good for studying for a geography test?"
    answer: "Yes. The randomized format and instant feedback after each answer make it a practical study tool. The quiz also notes when the capital is not the state's largest city, which is where most mistakes happen."

  - question: "Do I need to sign up to play?"
    answer: "No. The quiz is free and starts immediately, no account required."

questions:
  - question: "What is the capital of Alabama?"
    choices: ["Montgomery", "Birmingham", "Mobile", "Huntsville"]
    correct_answer: "Montgomery"
    explanation: "Montgomery has been Alabama's capital since 1846 and briefly served as the first capital of the Confederacy in 1861 before Richmond, Virginia took over."

  - question: "What is the capital of Alaska?"
    choices: ["Anchorage", "Fairbanks", "Sitka", "Juneau"]
    correct_answer: "Juneau"
    explanation: "Juneau is the only U.S. state capital with no road access — you can only reach it by air or sea. It's also the largest state capital by land area, bigger than the entire state of Rhode Island."

  - question: "What is the capital of Arizona?"
    choices: ["Tucson", "Phoenix", "Mesa", "Scottsdale"]
    correct_answer: "Phoenix"
    explanation: "Phoenix is the most populous state capital in the U.S., with over 1.6 million residents. It's one of the few cases where the capital is also by far the largest city in the state."

  - question: "What is the capital of Arkansas?"
    choices: ["Fort Smith", "Fayetteville", "Little Rock", "Jonesboro"]
    correct_answer: "Little Rock"
    explanation: "Little Rock sits on the south bank of the Arkansas River and has been the state capital since Arkansas joined the Union in 1836."

  - question: "What is the capital of California?"
    choices: ["Sacramento", "Los Angeles", "San Francisco", "San Diego"]
    correct_answer: "Sacramento"
    explanation: "Sacramento replaced Monterey as the state capital in 1854, largely because of its central location during the Gold Rush era."

  - question: "What is the capital of Colorado?"
    choices: ["Colorado Springs", "Boulder", "Fort Collins", "Denver"]
    correct_answer: "Denver"
    explanation: "Denver, the Mile High City, sits at exactly 5,280 feet above sea level — a fact etched into the steps of the State Capitol building."

  - question: "What is the capital of Connecticut?"
    choices: ["New Haven", "Hartford", "Bridgeport", "Stamford"]
    correct_answer: "Hartford"
    explanation: "Hartford is one of the oldest cities in the U.S. and was once considered the insurance capital of the country because so many major insurers were headquartered there."

  - question: "What is the capital of Delaware?"
    choices: ["Dover", "Wilmington", "Newark", "Middletown"]
    correct_answer: "Dover"
    explanation: "Dover replaced New Castle as Delaware's capital in 1777. Wilmington is far larger, but Dover has been the seat of government for nearly 250 years."

  - question: "What is the capital of Florida?"
    choices: ["Miami", "Orlando", "Tallahassee", "Jacksonville"]
    correct_answer: "Tallahassee"
    explanation: "Tallahassee was chosen as Florida's capital in 1824 as a geographic compromise between the existing population centers of Pensacola in the west and St. Augustine in the east."

  - question: "What is the capital of Georgia?"
    choices: ["Savannah", "Augusta", "Macon", "Atlanta"]
    correct_answer: "Atlanta"
    explanation: "Atlanta became Georgia's capital in 1868. It's one of the cases where the capital and the state's largest city are the same — Atlanta is the dominant city in the Southeast."

  - question: "What is the capital of Hawaii?"
    choices: ["Honolulu", "Hilo", "Kailua", "Pearl City"]
    correct_answer: "Honolulu"
    explanation: "Honolulu is the southernmost state capital in the U.S. and the only state capital located outside the contiguous 48 states."

  - question: "What is the capital of Idaho?"
    choices: ["Nampa", "Boise", "Meridian", "Idaho Falls"]
    correct_answer: "Boise"
    explanation: "Boise is both the capital and the largest city in Idaho — one of the states where the capital and biggest city are the same."

  - question: "What is the capital of Illinois?"
    choices: ["Chicago", "Rockford", "Aurora", "Springfield"]
    correct_answer: "Springfield"
    explanation: "Springfield has been Illinois's capital since 1837 and is the hometown and burial site of Abraham Lincoln. Chicago is far larger but has never been the state capital."

  - question: "What is the capital of Indiana?"
    choices: ["Fort Wayne", "Evansville", "Indianapolis", "South Bend"]
    correct_answer: "Indianapolis"
    explanation: "Indianapolis was purpose-built as a state capital in 1820, chosen for its central location. It's both the capital and the largest city in Indiana."

  - question: "What is the capital of Iowa?"
    choices: ["Des Moines", "Cedar Rapids", "Davenport", "Sioux City"]
    correct_answer: "Des Moines"
    explanation: "Des Moines has been Iowa's capital since 1857. Cedar Rapids is the second-largest city and is often confused with the capital, but Des Moines is both the capital and the largest city."

  - question: "What is the capital of Kansas?"
    choices: ["Wichita", "Topeka", "Kansas City", "Overland Park"]
    correct_answer: "Topeka"
    explanation: "Topeka is the capital of Kansas, while Wichita is the largest city. The two are about 150 miles apart. Topeka sits on the Kansas River in the northeastern part of the state."

  - question: "What is the capital of Kentucky?"
    choices: ["Louisville", "Lexington", "Bowling Green", "Frankfort"]
    correct_answer: "Frankfort"
    explanation: "Frankfort is one of the most commonly missed state capitals — both Louisville and Lexington are far more famous and populous, but neither is the capital. Frankfort has been the seat of government since 1792."

  - question: "What is the capital of Louisiana?"
    choices: ["New Orleans", "Shreveport", "Baton Rouge", "Lafayette"]
    correct_answer: "Baton Rouge"
    explanation: "Baton Rouge became Louisiana's capital in 1849, replacing New Orleans. The current State Capitol building, completed in 1932, is the tallest state capitol in the U.S."

  - question: "What is the capital of Maine?"
    choices: ["Augusta", "Portland", "Bangor", "Lewiston"]
    correct_answer: "Augusta"
    explanation: "Augusta is the second-least populous state capital in the U.S. Portland is the largest city in Maine by a significant margin, but Augusta has been the capital since 1832."

  - question: "What is the capital of Maryland?"
    choices: ["Baltimore", "Annapolis", "Rockville", "Frederick"]
    correct_answer: "Annapolis"
    explanation: "Annapolis is one of the smallest state capitals by area in the U.S. Baltimore has more than ten times the population, but Annapolis has been Maryland's capital since 1694."

  - question: "What is the capital of Massachusetts?"
    choices: ["Worcester", "Springfield", "Cambridge", "Boston"]
    correct_answer: "Boston"
    explanation: "Boston is both the capital and the largest city in Massachusetts — one of the states where the two coincide. It's also the oldest major city in the U.S., founded in 1630."

  - question: "What is the capital of Michigan?"
    choices: ["Detroit", "Grand Rapids", "Lansing", "Warren"]
    correct_answer: "Lansing"
    explanation: "Lansing replaced Detroit as Michigan's capital in 1847. Detroit is the largest city in the state by far, so this one catches people regularly."

  - question: "What is the capital of Minnesota?"
    choices: ["Saint Paul", "Minneapolis", "Rochester", "Duluth"]
    correct_answer: "Saint Paul"
    explanation: "Saint Paul is the capital, while Minneapolis — just across the Mississippi River — is slightly larger. The two are often called the Twin Cities. Saint Paul has been the capital since 1858."

  - question: "What is the capital of Mississippi?"
    choices: ["Biloxi", "Jackson", "Hattiesburg", "Gulfport"]
    correct_answer: "Jackson"
    explanation: "Jackson is both the capital and the largest city in Mississippi. It was named after President Andrew Jackson and has been the state capital since 1822."

  - question: "What is the capital of Missouri?"
    choices: ["Kansas City", "St. Louis", "Springfield", "Jefferson City"]
    correct_answer: "Jefferson City"
    explanation: "Jefferson City sits on the Missouri River in the center of the state and was named after President Thomas Jefferson. Kansas City and St. Louis are both far larger but neither is the capital."

  - question: "What is the capital of Montana?"
    choices: ["Billings", "Missoula", "Helena", "Great Falls"]
    correct_answer: "Helena"
    explanation: "Helena is Montana's capital, while Billings is the largest city by a wide margin. Helena was founded during the 1864 gold rush and became the capital when Montana achieved statehood in 1889."

  - question: "What is the capital of Nebraska?"
    choices: ["Lincoln", "Omaha", "Bellevue", "Grand Island"]
    correct_answer: "Lincoln"
    explanation: "Lincoln is Nebraska's capital, while Omaha — just across the Missouri River from Iowa — is the state's largest city. Lincoln has been the capital since 1867."

  - question: "What is the capital of Nevada?"
    choices: ["Las Vegas", "Carson City", "Henderson", "Reno"]
    correct_answer: "Carson City"
    explanation: "Carson City is one of the least populous state capitals in the U.S. Las Vegas has more than 20 times its population, but Carson City has been the capital since Nevada became a state in 1864."

  - question: "What is the capital of New Hampshire?"
    choices: ["Manchester", "Nashua", "Portsmouth", "Concord"]
    correct_answer: "Concord"
    explanation: "Concord has been New Hampshire's capital since 1808. Manchester is the state's largest city and is sometimes confused with the capital, but Concord is the seat of government."

  - question: "What is the capital of New Jersey?"
    choices: ["Trenton", "Newark", "Jersey City", "Paterson"]
    correct_answer: "Trenton"
    explanation: "Trenton has been New Jersey's capital since 1790. Newark and Jersey City are both far more populous, but Trenton sits on the Delaware River and has been the seat of government since before the U.S. Constitution was ratified."

  - question: "What is the capital of New Mexico?"
    choices: ["Albuquerque", "Las Cruces", "Santa Fe", "Roswell"]
    correct_answer: "Santa Fe"
    explanation: "Santa Fe is the oldest state capital in the U.S., founded in 1610 by Spanish colonists — more than a decade before the Pilgrims landed at Plymouth Rock. Albuquerque is four times larger but not the capital."

  - question: "What is the capital of New York?"
    choices: ["New York City", "Albany", "Buffalo", "Rochester"]
    correct_answer: "Albany"
    explanation: "Albany has been New York's capital since 1797. New York City is the most common wrong answer — it has never been the state capital, though it served as the first U.S. federal capital from 1785 to 1790."

  - question: "What is the capital of North Carolina?"
    choices: ["Charlotte", "Greensboro", "Durham", "Raleigh"]
    correct_answer: "Raleigh"
    explanation: "Raleigh, part of the Research Triangle, is both the capital and the second-largest city in North Carolina. Charlotte is larger but is not the capital."

  - question: "What is the capital of North Dakota?"
    choices: ["Bismarck", "Fargo", "Grand Forks", "Minot"]
    correct_answer: "Bismarck"
    explanation: "Bismarck sits on the Missouri River in the south-central part of the state. Fargo, near the Minnesota border, is the largest city but not the capital."

  - question: "What is the capital of Ohio?"
    choices: ["Cleveland", "Cincinnati", "Columbus", "Toledo"]
    correct_answer: "Columbus"
    explanation: "Columbus is both the capital and the largest city in Ohio, surpassing Cleveland and Cincinnati. It was founded in 1812 specifically to serve as the state capital."

  - question: "What is the capital of Oklahoma?"
    choices: ["Tulsa", "Oklahoma City", "Norman", "Broken Arrow"]
    correct_answer: "Oklahoma City"
    explanation: "Oklahoma City is both the capital and the largest city in Oklahoma. The city was famously founded on April 22, 1889 — the day of the Land Run, when 10,000 settlers claimed plots in a single afternoon."

  - question: "What is the capital of Oregon?"
    choices: ["Portland", "Eugene", "Gresham", "Salem"]
    correct_answer: "Salem"
    explanation: "Salem is Oregon's capital, while Portland — about 47 miles to the north — is the largest city. Salem has been the capital since Oregon became a state in 1859."

  - question: "What is the capital of Pennsylvania?"
    choices: ["Harrisburg", "Philadelphia", "Pittsburgh", "Allentown"]
    correct_answer: "Harrisburg"
    explanation: "Harrisburg has been Pennsylvania's capital since 1812. Philadelphia is far larger and more famous, but the capital was moved inland partly for security reasons."

  - question: "What is the capital of Rhode Island?"
    choices: ["Warwick", "Providence", "Cranston", "Pawtucket"]
    correct_answer: "Providence"
    explanation: "Providence is both the capital and the most populous city in Rhode Island. It was one of the first cities established in the American colonies, founded by Roger Williams in 1636."

  - question: "What is the capital of South Carolina?"
    choices: ["Charleston", "Greenville", "Columbia", "North Charleston"]
    correct_answer: "Columbia"
    explanation: "Columbia became South Carolina's capital in 1786. Charleston is the oldest and second-largest city and is commonly confused with the capital, but Columbia has been the seat of government for over 200 years."

  - question: "What is the capital of South Dakota?"
    choices: ["Sioux Falls", "Rapid City", "Aberdeen", "Pierre"]
    correct_answer: "Pierre"
    explanation: "Pierre (pronounced 'Peer') is the second-least populous state capital in the U.S., after Montpelier. Sioux Falls is nearly fifteen times larger but is not the capital."

  - question: "What is the capital of Tennessee?"
    choices: ["Nashville", "Memphis", "Knoxville", "Chattanooga"]
    correct_answer: "Nashville"
    explanation: "Nashville is both the capital and the largest city in Tennessee. It has been the permanent capital since 1826 and is widely known as Music City."

  - question: "What is the capital of Texas?"
    choices: ["Houston", "Austin", "Dallas", "San Antonio"]
    correct_answer: "Austin"
    explanation: "Austin is the capital of Texas, while Houston is the state's largest city. Austin has been the capital since 1839, when it was chosen as the capital of the Republic of Texas — before Texas even joined the Union."

  - question: "What is the capital of Utah?"
    choices: ["Provo", "West Valley City", "Salt Lake City", "Ogden"]
    correct_answer: "Salt Lake City"
    explanation: "Salt Lake City is both the capital and the largest city in Utah. It was founded in 1847 by Mormon pioneers and became the territorial capital in 1851."

  - question: "What is the capital of Vermont?"
    choices: ["Burlington", "South Burlington", "Rutland", "Montpelier"]
    correct_answer: "Montpelier"
    explanation: "Montpelier is the least populous state capital in the U.S., with fewer than 8,000 residents. Burlington is the largest city in Vermont by a wide margin but has never been the state capital."

  - question: "What is the capital of Virginia?"
    choices: ["Richmond", "Virginia Beach", "Norfolk", "Chesapeake"]
    correct_answer: "Richmond"
    explanation: "Richmond has been Virginia's capital since 1780. Virginia Beach is the most populous city in the state, but Richmond is the historic seat of government — and was also the capital of the Confederacy during the Civil War."

  - question: "What is the capital of Washington?"
    choices: ["Seattle", "Olympia", "Spokane", "Tacoma"]
    correct_answer: "Olympia"
    explanation: "Olympia is Washington's capital, while Seattle is the largest city by a wide margin. Olympia sits at the southern tip of Puget Sound and has been the capital since Washington became a territory in 1853."

  - question: "What is the capital of West Virginia?"
    choices: ["Huntington", "Morgantown", "Charleston", "Parkersburg"]
    correct_answer: "Charleston"
    explanation: "Charleston has been West Virginia's capital since 1885 after the seat of government alternated between Wheeling and Charleston for years. Huntington is the second-largest city."

  - question: "What is the capital of Wisconsin?"
    choices: ["Milwaukee", "Green Bay", "Kenosha", "Madison"]
    correct_answer: "Madison"
    explanation: "Madison is Wisconsin's capital and home to the University of Wisconsin. Milwaukee is the largest city in the state, but Madison — an isthmus city surrounded by lakes — has been the capital since 1837."

  - question: "What is the capital of Wyoming?"
    choices: ["Cheyenne", "Casper", "Laramie", "Gillette"]
    correct_answer: "Cheyenne"
    explanation: "Cheyenne is Wyoming's capital and largest city — one of the states where both coincide. It sits near the Colorado border and was founded in 1867 as a railroad town before becoming the territorial capital."
