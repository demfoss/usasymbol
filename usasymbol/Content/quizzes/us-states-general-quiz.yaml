seo:
  title: "U.S. States Trivia Quiz – Test Your Knowledge of Capitals, Flags & Symbols"
  description: "How well do you know the 50 U.S. states? This free trivia quiz mixes capitals, flags, birds, mottos, nicknames, and more with randomized questions and instant feedback."
  intro_paragraphs:
    - "How well do you know the 50 U.S. states? This U.S. states trivia quiz tests your knowledge across six categories: state capitals, flags, birds, mottos, translations, and well-known nicknames."
    - "Every round is shuffled, so it works equally well as a one-time challenge or a repeated study tool."
