title: "U.S. State Abbreviations Quiz"
slug: "state-abbreviations-quiz"
description: "Master all 50 U.S. state abbreviations with a two-way quiz that trains both state-to-code and code-to-state recall."

difficulty: "Easy"
estimated_time: "5–6 min"

tags: ["state abbreviations quiz", "us state abbreviations", "50 states abbreviations quiz", "state abbreviation practice test"]

seo:
  title: "U.S. State Abbreviations Quiz – All 50 Two-Letter Postal Codes"
  description: "Can you match all 50 U.S. state abbreviations? This free quiz tests both directions - abbreviation to state and state to abbreviation - with randomized questions and instant feedback."
  intro_paragraphs:
    - "Do you know the two-letter postal abbreviation for every U.S. state? This quiz tests both directions — given an abbreviation, name the state, and given a state, pick the correct two-letter code."
    - "Every round is shuffled, so it works as a quick check or a full state abbreviation practice test you can repeat until every code sticks."
    - "The obvious ones like CA, TX, and NY won't slow you down. The eight M-states and eight N-states — where the codes look nearly identical — are where this quiz gets interesting."

content:
  sections:
    - id: "m-states"
      title: "The Eight M-States — The Hardest Group"
      paragraphs:
        - "Eight states start with M, and each gets a different two-letter code. These are the most commonly confused abbreviations in the quiz:"
      list:
        - "MA — Massachusetts"
        - "MD — Maryland"
        - "ME — Maine"
        - "MI — Michigan"
        - "MN — Minnesota"
        - "MO — Missouri"
        - "MS — Mississippi"
        - "MT — Montana"

    - id: "n-states"
      title: "The Eight N-States — Almost as Tricky"
      paragraphs:
        - "Eight states also start with N, each with a distinct abbreviation:"
      list:
        - "NC — North Carolina"
        - "ND — North Dakota"
        - "NE — Nebraska"
        - "NH — New Hampshire"
        - "NJ — New Jersey"
        - "NM — New Mexico"
        - "NV — Nevada"
        - "NY — New York"

    - id: "i-states"
      title: "The Four I-States — One Letter Apart"
      paragraphs:
        - "Idaho, Illinois, Indiana, and Iowa all start with I, and each gets a different second letter. These are among the most searched abbreviations on the site:"
      list:
        - "ID — Idaho (I + D from IDaho)"
        - "IL — Illinois (I + L from ILlinois)"
        - "IN — Indiana (I + N from INdiana)"
        - "IA — Iowa (I + A from IAowa)"

    - id: "w-states"
      title: "The Four W-States — All Start With W"
      paragraphs:
        - "Washington, West Virginia, Wisconsin, and Wyoming each use W plus a distinctive second letter. The two-word states use the initial of the second word:"
      list:
        - "WA — Washington (W + A from WAshington)"
        - "WV — West Virginia (W for West, V for Virginia)"
        - "WI — Wisconsin (W + I from WIsconsin)"
        - "WY — Wyoming (W + Y from WYoming)"

    - id: "other-tricky"
      title: "Other Abbreviations That Catch People Off Guard"
      paragraphs:
        - "Beyond the letter-group clusters, a few individual abbreviations don't follow the obvious pattern:"
      list:
        - "KS — Kansas (not KA, because KY was already assigned to Kentucky)"
        - "KY — Kentucky (K + Y from KentuckY)"
        - "OH — Ohio (O + H from oHio, not OI)"
        - "RI — Rhode Island (R for Rhode, I for Island)"
        - "TN — Tennessee (T + N from TeNnessee)"
        - "TX — Texas (T + X from TeXas)"
        - "CT — Connecticut (C + T from ConnecTicut)"
        - "WV — West Virginia (W for West, V for Virginia)"

    - id: "more-quizzes"
      title: "More U.S. State Symbol Quizzes"
      paragraphs:
        - "Once you've locked in the abbreviations, the state capitals quiz is a natural next challenge — many of the same states that have tricky abbreviations also have surprising capitals."
        - "For a broader test, the U.S. States General Knowledge Quiz mixes abbreviations, capitals, flags, birds, and nicknames in a single round."
      links:
        - text: "State Capitals Quiz"
          href: "/quizzes/state-capitals-quiz"
        - text: "U.S. States General Knowledge Quiz"
          href: "/quizzes/us-states-general-quiz"

faq:
  - question: "Which state abbreviations are the hardest to remember?"
    answer: "The eight M-states (MA, MD, ME, MI, MN, MO, MS, MT) and eight N-states (NC, ND, NE, NH, NJ, NM, NV, NY) are the most commonly confused. Within the M-states, MN (Minnesota) and MO (Missouri) trip people up most often."

  - question: "Why does Kansas use KS instead of KA?"
    answer: "KA isn't used because the USPS assigns unique codes, and the system reserves the Y position for Kentucky (KY). Kansas takes KS — the K from Kansas and the S from KanSas."

  - question: "Why does Pennsylvania use PA instead of PE?"
    answer: "PA comes from a traditional abbreviation used long before the USPS standardized two-letter codes in 1963. 'Penna.' was the common shorthand, which naturally produced PA."

  - question: "Does the quiz include Washington, D.C.?"
    answer: "No. D.C. uses the code DC, but it is not a state — it's the federal district. The quiz covers all 50 states only."

  - question: "Does the quiz test both directions?"
    answer: "Yes. Some questions show an abbreviation and ask which state it belongs to. Others show a state name and ask for the correct two-letter code. Both directions are tested."

  - question: "Are the questions different each time I play?"
    answer: "Yes. Both the question order and the answer choices shuffle every round."

  - question: "What state is MA?"
    answer: "MA is Massachusetts — the first two letters of the state name. It's one of the eight M-states that cause the most confusion, alongside MD (Maryland), ME (Maine), MI (Michigan), MN (Minnesota), MO (Missouri), MS (Mississippi), and MT (Montana)."

  - question: "What state is MD?"
    answer: "MD is Maryland — M plus D from MarylanD. Of the eight M-states, Maryland is the only one whose abbreviation ends in D, which makes it easier to remember once you know the pattern."

  - question: "What state is ME?"
    answer: "ME is Maine — the first two letters. ME is one of the most searched state abbreviations because it looks like the English word 'me', which makes it memorable but also easy to overlook when scanning a list."

  - question: "What does IN stand for?"
    answer: "IN is Indiana — the first two letters. The four I-states (Idaho/ID, Illinois/IL, Indiana/IN, Iowa/IA) all start with I, so the second letter is what distinguishes them."

  - question: "What state is ID?"
    answer: "ID is Idaho — I plus D from IDaho. It's easy to confuse with IL (Illinois), IN (Indiana), and IA (Iowa), so knowing the second letter is key: D for Idaho."

  - question: "What state is AL? What is the AL state abbreviation?"
    answer: "AL is Alabama — the first two letters of the state name. The four A-states each take a different code: Alabama is AL, Alaska is AK, Arizona is AZ, and Arkansas is AR."

  - question: "What is the abbreviation for Alabama?"
    answer: "The abbreviation for Alabama is AL. It's the first two letters of the state name. People sometimes confuse it with AK (Alaska), AZ (Arizona), or AR (Arkansas) because all four start with A."

  - question: "What is the abbreviation for Missouri? What state is MO?"
    answer: "Missouri's abbreviation is MO — the first two letters. MO is often confused with MI (Michigan), MN (Minnesota), and MS (Mississippi). Among the eight M-states, MO belongs exclusively to Missouri."

  - question: "What is the abbreviation for Arkansas? What state is AR?"
    answer: "Arkansas is AR — the first two letters. It looks similar to AK (Alaska) and AZ (Arizona), but AR is uniquely Arkansas. The pronunciation of Arkansas ('AR-kan-saw') surprises some people, but the abbreviation is straightforward."

  - question: "What is the abbreviation for Michigan? What state is MI?"
    answer: "Michigan is MI — M plus I from MIchigan. Among the eight M-states, MI is Michigan. The most common mix-up is between MI (Michigan), MN (Minnesota), and MO (Missouri)."

  - question: "What is the abbreviation for Louisiana? What state is LA?"
    answer: "Louisiana is LA — the first two letters. LA is widely associated with Los Angeles the city, but as a U.S. postal code it belongs to the state of Louisiana. Florida is FL, Alabama is AL — LA is Louisiana."

  - question: "What is the abbreviation for Nebraska? What state is NE?"
    answer: "Nebraska is NE — the first two letters. NE is easy to confuse with NV (Nevada), NJ (New Jersey), and NH (New Hampshire). Among the eight N-states, NE ends in E, which maps to NEbraska."

  - question: "What is the abbreviation for Minnesota? What state is MN?"
    answer: "Minnesota is MN — M plus N from MiNnesota. MN is one of the trickiest M-states because the N doesn't come from an early position in the word. Missouri is MO, Michigan is MI — MN belongs to Minnesota."

  - question: "What is the abbreviation for Montana? What state is MT?"
    answer: "Montana is MT — the first two letters. MT is straightforward once you know the M-state set. Missouri is MO, Minnesota is MN — MT is uniquely Montana's."

  - question: "Do I need to sign up to play?"
    answer: "No. The quiz is free and starts immediately, no account required."

