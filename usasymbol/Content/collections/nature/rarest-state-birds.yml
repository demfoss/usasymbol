  quick_answer:
    - "Hawaii's state bird, the nene, is the only state bird formally listed as at-risk on the IUCN Red List, classified Near Threatened after its wild population fell below 30 birds in the 1950s."
    - "Minnesota's common loon carries an official state designation as a Species in Greatest Conservation Need, even though its population within Minnesota remains stable today."
    - "Four more state birds, Pennsylvania's ruffed grouse, New Hampshire's purple finch, Colorado's lark bunting, and Oklahoma's scissor-tailed flycatcher, are not classified as globally threatened but have documented population declines of 30% or more."

  methodology: "Rarity here follows the IUCN Red List where a global assessment exists, plus state wildlife agency conservation designations and long-term population trend data from the North American Breeding Bird Survey and Partners in Flight. A steep documented decline is presented as a decline, not relabeled as an official threatened status the species does not hold."

