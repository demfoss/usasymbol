sections:
  - id: rarest-state-birds
    icon: "fa-solid fa-dove"
    style: "law-cards"
    title: "State Birds Facing the Most Conservation Concern"
    paragraphs:
      - "These six state birds fall into two different categories worth keeping separate. The nene and the common loon carry official conservation designations. The other four remain common enough to avoid a threatened classification, yet each has lost roughly a third or more of its population over the decades tracked by national bird surveys."
    subsections:
      - subtitle: "Hawaii"
        text: |
          **Conservation Status:** IUCN Near Threatened
          **Wild Population:** About 3,800

          The nene, or Hawaiian goose, is the only state bird with a current global IUCN Red List classification of Near Threatened. Hunting and introduced predators drove the wild population below 30 birds by the 1950s, wiping the species out on every island except Hawaii itself. A captive breeding program that began in 1949 has since released more than 2,800 birds back onto four islands.

          The nene is the clearest entry on this list because no other state bird carries a current global threat classification. Its recovery from fewer than 30 birds to roughly 3,800 remains one of the most complete species rescues in US conservation history.
        anchor_phrases:
          - "IUCN Near Threatened"
          - "fewer than 30 birds"
      - subtitle: "Minnesota"
        text: |
          **Conservation Status:** MN Species in Greatest Conservation Need
          **Range:** Contracting toward the state's north

          Minnesota's Department of Natural Resources has designated the common loon a Species in Greatest Conservation Need, even though the state holds more breeding loons than anywhere outside Alaska. Loons have already disappeared as breeding birds from Illinois, Indiana, Iowa, and Ohio, and mercury contamination, lead poisoning, and shoreline development are pushing the remaining Midwest population toward Minnesota's northern lakes.

          The loon earns its place on a future-facing risk rather than a current shortage. Audubon modeling projects the species could lose more than half its current summer range by 2080 if those pressures continue.
      - subtitle: "Pennsylvania"
        text: |
          **Conservation Status:** Not federally listed; sharp state decline
          **Population Change:** Down about 70% since the early 1960s

          Pennsylvania's ruffed grouse population has fallen by roughly 70% since the early 1960s, and Pennsylvania Game Commission research has traced much of the recent decline to West Nile virus, which arrived in the state in the early 2000s and proved lethal to grouse chicks. Habitat fragmentation from development adds further pressure in the state's southern regions.

          The ruffed grouse belongs on this list less for a global threat status, which it does not carry, than for the scale of its loss in the one state that chose it as an emblem.
        anchor_phrases:
          - "down about 70%"
      - subtitle: "New Hampshire"
        text: |
          **Conservation Status:** Not federally listed; long-term decline
          **Population Change:** Down about 32% since 1966

          New Hampshire's purple finch population has dropped by roughly 32% nationwide since 1966, according to the North American Breeding Bird Survey, and by nearly 14% within New Hampshire alone between 2012 and 2022. Cornell Lab of Ornithology research found purple finches lose direct confrontations with the introduced house finch more than 95% of the time.

          The purple finch's decline traces to a specific rival rather than habitat loss, a house finch invasion that began in New York in 1939 and has been out-competing New Hampshire's state bird ever since.
      - subtitle: "Colorado"
        text: |
          **Conservation Status:** IUCN Least Concern; Common Bird in Steep Decline
          **Population Change:** Down about 86% since 1970

          Colorado's lark bunting has lost roughly 86% of its population since 1970, according to Partners in Flight, as native prairie has been converted to cropland and grazing pressure has reduced nesting cover. The organization lists the species as a Common Bird in Steep Decline despite its IUCN status of Least Concern.

          The lark bunting shows how a still-abundant species, with an estimated 10 million birds worldwide, can be vanishing fast in the one state it represents.
        anchor_phrases:
          - "down about 86%"
      - subtitle: "Oklahoma"
        text: |
          **Conservation Status:** IUCN Least Concern; declining trend
          **Population Change:** Down about 31% since 1966

          Oklahoma's scissor-tailed flycatcher population fell about 31% between 1966 and 2014, per the North American Breeding Bird Survey, even as the species' breeding range has expanded eastward thanks to artificial nesting sites like telephone poles. Pesticide exposure on its wintering grounds in Mexico and Central America is a growing concern for adult survival.

          The flycatcher closes this list as its most stable case, a species still common across Oklahoma but trending downward for reasons largely outside the state's control.

  - id: recovered-not-rare
    icon: "fa-solid fa-arrow-trend-up"
    title: "State Birds That Were Once Endangered but Recovered"
    paragraphs:
      - "Louisiana's brown pelican is not on this list, and that omission is deliberate. The species was listed as federally endangered in 1970 after DDT wiped out its Louisiana nesting colonies, and Louisiana ran a reintroduction program starting in 1968 that moved chicks from Florida to rebuild the population. The US Fish and Wildlife Service delisted it in 2009, and the global population now stands near 620,000."
      - "That recovery is real, but it means the brown pelican no longer meets this list's bar for current rarity or conservation concern. Its history shows the same near-extinction pattern found in Hawaii's nene, just with a fully completed recovery on the other side of it."

faq:
  - question: "Which state bird is the rarest?"
    answer: "Hawaii's nene is the rarest, the only state bird with a current IUCN Red List classification of Near Threatened."
  - question: "Is any US state bird officially endangered?"
    answer: "No state bird currently holds full US Endangered Species Act status. The nene comes closest, classified Near Threatened globally after its wild population fell below 30 birds in the 1950s."
  - question: "Why is the common loon a conservation concern in Minnesota if its population is stable there today?"
    answer: "Minnesota's Department of Natural Resources designated the loon a Species in Greatest Conservation Need because of forward-looking threats, mercury contamination, lead poisoning, and projected range loss, not a current population shortage."
  - question: "Which state bird has declined the most?"
    answer: "Colorado's lark bunting has the steepest documented decline among state birds, down roughly 86% since 1970 according to Partners in Flight, even though it remains classified as globally Least Concern."
  - question: "Was Louisiana's brown pelican ever considered a rare state bird?"
    answer: "Yes. It was federally endangered from 1970 to 2009 after DDT collapsed its Louisiana nesting colonies, but the species has since fully recovered to a global population near 620,000, so it is not included among currently rare or threatened state birds here."

