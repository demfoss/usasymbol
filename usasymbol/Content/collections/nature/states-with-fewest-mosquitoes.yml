sections:
  - id: toughest-climates-for-mosquitoes
    icon: "fa-solid fa-droplet-slash"
    style: "law-cards"
    title: "States With the Toughest Climate for Mosquitoes"
    paragraphs:
      - "Mosquitoes need two things to thrive: standing water for larvae and warm air for adult flight. The four states below rank at the top of this list because they consistently deny mosquitoes one or both."
    subsections:
      - subtitle: "Nevada"
        text: |
          **Avg. Annual Precipitation:** 9.5"
          **Avg. Elevation:** 5,500 ft

          Nevada receives less rain than any other state, about 9.5 inches a year, and sits inside the rain shadow of the Sierra Nevada, which blocks most Pacific moisture before it reaches the state. Las Vegas alone averages under 4.2 inches annually, one of the driest major cities in the country.

          Mosquitoes need standing water to lay eggs, and Nevada's landscape rarely provides it outside irrigated valleys and the Colorado River corridor. That scarcity of breeding habitat, not a lack of warm temperatures, is why Nevada tops this list.
        anchor_phrases:
          - "9.5 inches a year"
          - "rain shadow of the Sierra Nevada"
      - subtitle: "Utah"
        text: |
          **Avg. Annual Precipitation:** 12.2"
          **Avg. Elevation:** 6,100 ft

          Utah combines a desert climate with the country's third-highest average elevation at 6,100 feet. The Great Salt Lake Desert and the state's canyon country post some of the lowest rainfall totals in the Mountain West, while the Wasatch Range keeps large stretches of the state above 6,000 feet.

          That pairing works against mosquitoes twice over. Low humidity limits the standing water they need to breed, and cooler air at elevation slows the flight activity of any adults that do hatch.
      - subtitle: "Wyoming"
        text: |
          **Avg. Annual Precipitation:** 12.9"
          **Avg. Elevation:** 6,700 ft

          Wyoming holds the country's second-highest average elevation at 6,700 feet, trailing only Colorado. Wind sweeps across its open plains and high basins for much of the year, drying out the small pools mosquitoes rely on before larvae can mature.

          Wyoming ranks here on elevation as much as dryness. Much of the state sits above the altitude where mosquito flight activity drops off sharply once air temperatures fall below roughly 50 degrees Fahrenheit.
      - subtitle: "Colorado"
        text: |
          **Avg. Annual Precipitation:** 15.9"
          **Avg. Elevation:** 6,800 ft

          Colorado has the highest average elevation of any US state at 6,800 feet, a figure driven by 58 peaks above 14,000 feet. The Rocky Mountains put much of the state's land well above the thin, cool air that slows mosquito metabolism and flight.

          Colorado's rainfall total runs higher than Nevada's or Utah's, which is why it ranks lower on this list. Its case rests on altitude rather than aridity, a different route to the same result.
        anchor_phrases:
          - "highest average elevation"

  - id: more-tough-mosquito-climates
    icon: "fa-solid fa-mountain-sun"
    style: "law-cards"
    title: "More States With Tough Conditions for Mosquitoes"
    paragraphs:
      - "New Mexico, Arizona, and Montana round out this list through variations on the same two mechanisms: too little standing water or too short a warm season."
    subsections:
      - subtitle: "New Mexico"
        text: |
          **Avg. Annual Precipitation:** 14.6"
          **Avg. Elevation:** 5,700 ft

          New Mexico pairs the fourth-driest climate in the country with the fourth-highest average elevation, 5,700 feet. Its high desert plateaus receive most of their scant rainfall in short summer monsoon bursts rather than steady moisture, leaving little standing water between storms.

          New Mexico rounds out the arid Southwest cluster on this list, sharing the same rain-shadow and elevation pattern found in Nevada, Utah, and Arizona.
      - subtitle: "Arizona"
        text: |
          **Avg. Annual Precipitation:** 13.6"
          **Avg. Elevation:** 4,100 ft

          Arizona's statewide average of 13.6 inches of rain ranks it the third-driest state, even though its lower average elevation of 4,100 feet keeps its southern deserts hot rather than cold. Heat alone does not stop mosquitoes, but the extreme dryness of the Sonoran Desert limits how much standing water survives between monsoon storms.

          Arizona shows that aridity, not cold, does most of the work in its driest regions, a contrast with the elevation-driven entries higher on this list.
      - subtitle: "Montana"
        text: |
          **Avg. Annual Precipitation:** 15.3"
          **Avg. Elevation:** 3,400 ft

          Montana receives 15.3 inches of rain a year, and its long, cold winters compress the mosquito season into a few warm months compared with states farther south. Snowmelt does create seasonal breeding pools each spring, but they dry out earlier in the year than pools in wetter regions.

          Montana earns its spot through a short season rather than a lack of water altogether, a different mechanism than the dry-climate states topping this list.

  - id: how-climate-limits-mosquitoes
    icon: "fa-solid fa-temperature-low"
    title: "How Dryness and Altitude Limit Mosquitoes"
    paragraphs:
      - "Female mosquitoes lay eggs in still or slow-moving water, so any climate that keeps water from pooling for more than a few days interrupts their life cycle before larvae can mature. Statewide aridity, not daytime heat, is the more direct limiting factor in desert states like Nevada and Arizona."
      - "Elevation works through a separate mechanism. Mosquitoes are weak, low-altitude fliers whose activity falls off sharply once air temperatures drop below roughly 50 degrees Fahrenheit, a threshold that much of Colorado and Wyoming crosses even in summer at higher elevations."

faq:
  - question: "Which state has the fewest mosquitoes?"
    answer: "No agency publishes a verified state-by-state mosquito count. By climate alone, Nevada has the toughest conditions for mosquito breeding of any state, averaging just 9.5 inches of rain a year."
  - question: "Does altitude actually reduce mosquito activity?"
    answer: "Yes. Mosquito flight activity drops off sharply once air temperatures fall below about 50 degrees Fahrenheit, a threshold that high-elevation states like Colorado and Wyoming cross more often than low-lying states."
  - question: "Is there a US state with zero mosquitoes?"
    answer: "No state is mosquito-free. Even Nevada and other dry, high-elevation states have native mosquito species; populations are simply lower and more seasonal than in warm, wet regions."
  - question: "Why is Nevada the driest state?"
    answer: "Nevada sits inside the rain shadow of the Sierra Nevada mountain range, which blocks most Pacific storm moisture before it can reach the state's interior."
  - question: "Do cold winters get rid of mosquitoes for good?"
    answer: "No. Many mosquito species survive winter as dormant eggs or larvae and resume activity once temperatures rise, so a cold winter shortens the active season without eliminating the population."

