page:
  h1: "Which States Have the Harshest Climate for Mosquitoes?"
  intro_title: "No State Publishes a Mosquito Count, But Climate Data Tells a Story"

  quick_answer:
    - "No government agency or study counts mosquitoes state by state, so this list ranks states instead by NOAA precipitation data and elevation, the two climate factors entomologists cite most often for limiting mosquito breeding and activity."
    - "Nevada is the driest state in the country, averaging about 9.5 inches of rain a year, conditions that leave mosquitoes with little standing water to lay eggs in."
    - "Colorado and Wyoming have the country's highest average elevations, 6,800 and 6,700 feet, where cooler, thinner air slows the flight activity mosquitoes need to feed and breed."

  methodology: "No agency publishes a verified state-by-state mosquito population count, and pest-control service data mostly reflects where a company operates branches rather than where mosquitoes actually live. This list instead ranks states by NOAA average annual precipitation and average elevation, the two conditions field entomologists point to for limiting mosquito breeding water and adult flight activity. It is a climate-based proxy, not a direct mosquito census."

  sources:
    - name: "World Population Review - Driest States in the US"
