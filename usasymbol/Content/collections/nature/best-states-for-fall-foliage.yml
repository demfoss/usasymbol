sections:
  - id: top-fall-foliage-states
    icon: "fa-solid fa-leaf"
    style: "law-cards"
    title: "Best States for Fall Foliage"
    paragraphs:
      - "These eight states earn their place through documented tourism: named scenic drives, national parks with dedicated foliage programming, and, in Vermont's case, visitor data tied directly to the season. New England anchors the list, with Appalachian and upper Midwest states extending it, and Colorado showing that fall color reaches well past the East Coast."
    subsections:
      - subtitle: "Vermont"
        text: |
          **Known For:** Sugar maple density, Stowe

          Vermont has the country's highest sugar maple density, producing the saturated red-orange-gold combinations the state is known for. The state tourism board reports 19% of its 13 million annual visitors come specifically for the six-week fall leaf season, and Stowe has been named among the best places to see fall foliage in the country.

          Vermont leads this list because foliage tourism is not a side attraction there. It is a measured, documented share of the state's entire visitor economy, peaking from late September in the Northeast Kingdom through mid-October statewide.
        anchor_phrases:
          - "highest sugar maple density"
          - "19% of its 13 million annual visitors"
      - subtitle: "New Hampshire"
        text: |
          **Known For:** Kancamagus Highway, White Mountains

          The Kancamagus Highway runs 34.5 miles from Lincoln to Conway through White Mountain National Forest, passing Sabbaday Falls and Rocky Gorge along the way. New Hampshire draws millions of visitors during fall foliage season, and its color typically peaks earlier than the rest of New England, as soon as mid-September.

          New Hampshire earns its place with a single, concentrated route that draws the crowds Vermont's whole state does, compressed into one 34.5-mile drive through the White Mountains.
      - subtitle: "Maine"
        text: |
          **Known For:** Acadia National Park

          Acadia National Park pairs hardwood fall color with Atlantic coastline views, with the sweet spot for peak color typically falling in mid-October. Maine's warming climate has already pushed that peak roughly two weeks later than it ran in 1950.

          Maine belongs on this list for a coastal foliage experience no inland New England state can match, framing the season's most famous colors against ocean and granite rather than only forest.
      - subtitle: "New York"
        text: |
          **Known For:** Adirondack Park

          The Adirondacks were named America's top fall foliage destination for 2026 by Priceline, based on hotel search data for early and late October travel. The park's overall foliage season stretches from mid-September through late October, with peak color typically arriving in the first week of October.

          New York earns its spot through sheer scale. The Adirondack Park's six million acres give the state a foliage season long enough to reward visits across several different weeks.
      - subtitle: "North Carolina"
        text: |
          **Known For:** Blue Ridge Parkway, Great Smoky Mountains

          The Blue Ridge Parkway threads more than 200 scenic overlooks through western North Carolina, with peak color timing shifting by elevation, mid-October at higher stretches and late October to early November in lower valleys near Asheville. The Great Smoky Mountains add a second major national park destination nearby.

          North Carolina represents Appalachian fall foliage at its most accessible, a single road corridor that lets visitors chase peak color across a five- to six-week window just by changing elevation.
      - subtitle: "West Virginia"
        text: |
          **Known For:** New River Gorge, Monongahela National Forest

          New River Gorge National Park covers more than 70,000 acres, and its gorge microclimates can extend color into early November in some years. Monongahela National Forest's Dolly Sods plateau, sitting between 2,500 and 4,700 feet, offers panoramic views as color moves downhill through October.

          West Virginia earns its place with more than 75 state parks, forests, and wildlife areas layered across dramatic elevation changes, giving the state one of the longer foliage windows in central Appalachia.
      - subtitle: "Michigan"
        text: |
          **Known For:** Upper Peninsula, Porcupine Mountains

          Michigan's Upper Peninsula holds some of the state's most vivid color, concentrated around the Porcupine Mountains Wilderness State Park and Ottawa National Forest near Ironwood. Visitors can ride a chairlift at the Porcupine Mountains to view sugar maples, birches, and aspens from above the canopy.

          Michigan extends this list into the upper Midwest, proving fall foliage tourism isn't confined to the Appalachian and New England corridor that dominates the rest of this ranking.
      - subtitle: "Colorado"
        text: |
          **Known For:** San Juan Mountains, aspen groves

          Colorado's San Juan Mountains turn gold rather than red, as aspen groves rather than maples drive the show. The 236-mile San Juan Skyway loop, connecting Durango, Silverton, Ouray, Ridgway, and Telluride, typically peaks in late September at high elevation and early October in lower valleys.

          Colorado closes this list as its western outlier, proof that fall foliage tourism extends well past the hardwood forests of the East into the Rocky Mountains' aspen country.
        anchor_phrases:
          - "San Juan Skyway"

  - id: when-fall-foliage-peaks
    icon: "fa-solid fa-calendar-days"
    title: "When Does Fall Foliage Peak by State?"
    paragraphs:
      - "Peak color moves on two tracks: north to south, and high elevation to low. New Hampshire and northern Vermont typically turn first, as early as mid-September, while coastal Maine and low-elevation stretches of the Blue Ridge Parkway and New River Gorge often hold their color into late October or early November."
      - "Elevation matters as much as latitude within a single state. Colorado's high mountain passes and West Virginia's Dolly Sods plateau change color weeks before the valley towns below them, which is why a single state can offer a foliage window stretching well past a month."

faq:
  - question: "What is the best state for fall foliage?"
    answer: "Vermont draws the most concentrated fall foliage tourism of any state, with 19% of its 13 million annual visitors coming specifically for the six-week fall season, according to the state tourism board."
  - question: "When does fall foliage peak in New England?"
    answer: "Timing varies by state. New Hampshire often peaks as early as mid-September, Vermont runs late September through mid-October depending on region, and Maine's Acadia National Park typically peaks in mid-October."
  - question: "What is the best scenic drive for fall foliage?"
    answer: "New Hampshire's 34.5-mile Kancamagus Highway and North Carolina's Blue Ridge Parkway are two of the most visited fall foliage routes in the country, along with Colorado's 236-mile San Juan Skyway for aspen color out West."
  - question: "Is Colorado good for fall foliage even though it's mostly evergreen forest?"
    answer: "Yes. Colorado's color comes from aspen groves rather than maples, concentrated in the San Juan Mountains, and typically peaks in late September at high elevation."
  - question: "How does elevation affect fall foliage timing?"
    answer: "Higher elevations change color first because cooler temperatures arrive there earlier in the season. In states like Colorado, West Virginia, and North Carolina, peak color can move from a mountain pass to the valley below it over several weeks."
  - question: "Why does Maine's fall foliage peak later than it used to?"
    answer: "Maine's warming climate has pushed peak color roughly two weeks later than it ran in 1950, shifting the best viewing window for Acadia National Park closer to late October."

