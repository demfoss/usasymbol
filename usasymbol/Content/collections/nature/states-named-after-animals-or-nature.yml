page:
  h1: "US States Named After Mountains, Lakes, and Nature"
  intro_title: "Eight States Take Their Name From a Natural Feature, Not an Animal"

  quick_answer:
    - "No US state is named directly after an animal. Every state name Americans sometimes describe that way turns out, on closer etymological review, to trace to a landscape feature such as a mountain, lake, or meadow instead."
    - "Vermont offers the clearest case: a French translation of Green Mountains first used in an April 1777 broadside by Thomas Young, not by the earlier explorer Samuel de Champlain, as popular accounts often claim."
    - "Arizona and Kentucky both carry disputed etymologies. Arizona may mean place of the small spring in O'odham or good oak trees in Basque, and Kentucky's leading Iroquoian root for meadow competes with at least two rival theories."

  methodology: "Etymologies were checked against standard state-name references and, where scholarly disagreement exists, against the specific historians who documented competing theories. Only states whose best-supported root is a landscape feature are included. States named for a river are covered separately and are not repeated here, and no state qualifies as animal-derived by any credible source found."

