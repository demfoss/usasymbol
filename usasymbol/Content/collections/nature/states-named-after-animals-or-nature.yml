sections:
  - id: states-named-nature-features
    icon: "fa-solid fa-mountain"
    style: "law-cards"
    title: "States Named After a Mountain, Lake, or Land Feature"
    paragraphs:
      - "None of these eight names traces to an animal. Each one describes terrain instead, mountains, a lake, a hill, snow, or open meadow, and two carry genuine scholarly disagreement about which nature word is the real root."
    subsections:
      - subtitle: "Vermont"
        text: |
          **Nature Root:** Green mountain (French: vert + mont)
          **Capital:** Montpelier

          Vermont's name combines the French words vert and mont into green mountain, first documented in a Philadelphia broadside Thomas Young wrote in April 1777, honoring Ethan Allen's Green Mountain Boys. The popular story crediting explorer Samuel de Champlain with the name has not held up under later historical review.

          Vermont makes this list as the state whose name most directly describes its own terrain, still visible today in the Green Mountains running the length of the state.
        anchor_phrases:
          - "green mountain"
          - "Thomas Young"
      - subtitle: "Michigan"
        text: |
          **Nature Root:** Large lake (Ojibwe: michigami)
          **Capital:** Lansing

          Michigan comes from the Ojibwe word michigami, meaning large lake or large body of water, a fitting root for the only state that touches four of the five Great Lakes.

          Michigan earns a spot here because its name describes water at a scale no river could match, a lake so large the surrounding Ojibwe communities named the land for it.
      - subtitle: "Massachusetts"
        text: |
          **Nature Root:** Great hill (Algonquian)
          **Capital:** Boston

          The name comes from the Massachusett people, whose Algonquian phrase translates to at the great hill, a reference historians tie to the Blue Hills south of Boston.

          Massachusetts belongs on this list as a rare case of a state named for a single specific hill rather than a mountain range or a body of water, a small landmark that gave its name to an entire state.
      - subtitle: "Montana"
        text: |
          **Nature Root:** Mountain (Spanish: montaña)
          **Capital:** Helena

          Montana takes its name straight from the Spanish word montaña, meaning mountain, chosen by Congress in 1864 despite mountainous terrain covering only the state's western third.

          Montana qualifies here even though its eastern plains carry no mountains at all, a name that describes one region of the state rather than the whole of it.
      - subtitle: "Nevada"
        text: |
          **Nature Root:** Snow-covered (Spanish: nevada)
          **Capital:** Carson City

          Nevada's name comes from the Spanish word nevada, meaning snow-covered, originally describing the Sierra Nevada range along the state's western border rather than Nevada's own desert interior.

          Nevada earns its place through a naming irony worth noting: the state is best known today for its dry desert basin, yet its name describes the snow-capped mountains that mark its edge.
      - subtitle: "Wyoming"
        text: |
          **Nature Root:** Large plains or meadow (Delaware/Munsee)
          **Capital:** Cheyenne

          Wyoming's name traces to a Delaware or Munsee word variously translated as large plains, extensive meadows, or at the big river flat, first applied to a valley in Pennsylvania and later borrowed for the western territory in 1865.

          Wyoming makes this list on a detail worth stating plainly: the name describes a Pennsylvania valley, not the Rocky Mountain landscape most people now associate with the state.
      - subtitle: "Arizona"
        text: |
          **Nature Root:** Small spring, disputed (O'odham)
          **Capital:** Phoenix

          The most cited origin traces Arizona to the O'odham words ali and shonak, meaning place of the small spring, referring to a village south of present-day Nogales. A rival theory from historian Don Garate argues the name instead comes from a Basque phrase for good oak trees.

          Arizona belongs on this list either way, since both competing theories point to a natural feature, water or trees, without settling which one is correct.
        anchor_phrases:
          - "place of the small spring"
      - subtitle: "Kentucky"
        text: |
          **Nature Root:** Meadow or prairie, disputed (Iroquoian)
          **Capital:** Frankfort

          The leading theory ties Kentucky to an Iroquoian word for meadow or prairie, related to the Mohawk kenhtà:ke. Other researchers propose an Algonquian or Shawnee root instead, and a third theory links the name to the Catawba people.

          Kentucky closes this list as its most contested entry, a reminder that not every state name resolves into a single agreed-upon nature word.

  - id: no-animal-named-states
    icon: "fa-solid fa-paw"
    title: "Why No State Is Named After an Animal"
    paragraphs:
      - "Many US cities and towns carry animal names, Buffalo, Elkhart, and dozens of smaller places among them, but no state name traces to an animal under any credible etymology found for this list. State names instead lean on land itself: mountains, lakes, hills, snow, and open meadow described in French, Spanish, and several Indigenous languages."
      - "That pattern holds even where a state's official animal is well known. Utah's Rocky Mountain elk and California's grizzly bear are state symbols chosen long after each state was named, with no bearing on the name's actual origin."

