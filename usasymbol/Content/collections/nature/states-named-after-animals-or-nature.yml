faq:
  - question: "Is any US state named after an animal?"
    answer: "No. Every state name sometimes attributed to an animal turns out, under credible etymology, to trace to a mountain, lake, hill, or other land feature instead."
  - question: "What does Michigan mean?"
    answer: "Michigan comes from the Ojibwe word michigami, meaning large lake, referring to the Great Lakes the state borders."
  - question: "Is Vermont really named for its green mountains?"
    answer: "Yes. The name combines the French words for green and mountain, though the credit for coining it belongs to Thomas Young's 1777 broadside rather than explorer Samuel de Champlain, as often claimed."
  - question: "Why is Nevada named for snow when it's known for desert?"
    answer: "Nevada's name describes the snow-capped Sierra Nevada range along its western border, not the dry desert basin that covers most of the state's interior."
  - question: "What is Arizona's name actually disputed between?"
    answer: "The two leading theories trace Arizona to an O'odham phrase for place of the small spring or a Basque phrase for good oak trees. Historians have not settled which one is correct."

