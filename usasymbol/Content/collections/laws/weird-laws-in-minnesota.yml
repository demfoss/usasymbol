page:
  h1: "Real Minnesota Laws You Won't Believe"
  quick_answer:
    - "Four Minnesota claims check out: a greased pig contest ban, a hitchhiking ban, a mosquito nuisance declaration, and the decriminalization of public drunkenness."
    - "Public drunkenness isn't a crime in Minnesota at all. State law directly bars charging or convicting anyone for the offense, a rule most people assume works the opposite way."
    - "The duck-on-your-head border crossing story and the red-car-on-Lake-Street rule are folklore with no statute or ordinance behind either one."
