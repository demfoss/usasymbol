    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Minnesota We Couldn't Verify"
    paragraphs:
      - "A cluster of Weird Minnesota Laws Still on the Books claims keeps circulating with no statute number or ordinance ever attached to any of them."
    subsections:
      - subtitle: "All bathtubs must have feet"
        status: "Not Verified"
        text: |
          **Claim:** Minnesota law requires every bathtub to be built with feet.

          **Why We Couldn't Verify It:** No statute or building-code section matching this claim has been located. It appears only on generic listicle round-ups with no citation.

      - subtitle: "It's illegal to tease a skunk"
        status: "Not Verified"
        text: |
          **Claim:** Teasing or harassing a skunk is specifically illegal in Minnesota.

          **Why We Couldn't Verify It:** General animal cruelty statutes exist, but no skunk-specific provision has turned up. This may be a garbled version of the state's real wolf-harassment law, applied to a different animal.

      - subtitle: "You can't bring an elephant onto Main Street"
        status: "Not Verified"
        text: |
          **Claim:** A Minnesota law bans bringing an elephant onto Main Street.

          **Why We Couldn't Verify It:** No town name, ordinance number, or date has ever been attached to this claim by anyone repeating it, which usually signals it never had a real source to begin with.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Minnesota Laws That Are Myths"
    paragraphs:
      - "Minnesota's own State Law Library has fielded questions about one Strange Minnesota Laws claim so often that it addressed the myth directly on its website."
    subsections:
      - subtitle: "You can't cross the Wisconsin border with a duck on your head"
        status: "Myth"
        text: |
          **Myth:** Crossing into Wisconsin with a duck sitting on your head is illegal in Minnesota.

          **Reality:** The Minnesota State Law Library gets this question often enough that it addressed it directly, pointing to journalism that tackled the claim and found no supporting statute anywhere in state law.

      - subtitle: "Driving a red car down Lake Street in Minneapolis is illegal"
        status: "Myth"
        text: |
          **Myth:** Minneapolis bans driving a red car down Lake Street.

          **Reality:** No ordinance matching this claim has ever been tracked down to a specific city code section. It exists only as an oft-repeated rumor with no ordinance number behind it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Minnesota's 120-Day Cap Leaves Small Statutes Standing"
    paragraphs:
      - "Minnesota's Constitution caps the Legislature at 120 working days across each two-year term, and lawmakers can't meet in regular session past the Monday after the third Saturday in May. With that hard limit competing against budget bills and current priorities every session, a narrow statute like the greased pig ban simply never becomes urgent enough to spend floor time repealing."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Minnesota is the last state in the country still restricting grocery and convenience stores to selling only 3.2% beer, a Prohibition-era workaround from the 1930s."
      - "The greased pig ban also covers chickens and turkeys released or thrown for the same kind of capture contest."
      - "Minnesota's mosquito abatement law gives local boards the power to act on private land, not just public property."
      - "The hitchhiking statute also covers standing in a road to solicit a job or a charitable donation, not just a ride."
      - "Minnesota's 120-legislative-day cap applies per two-year term, not per year, so a busy first year can leave very little time in the second."

