    highlights:
      - name: "Greased Pig Contests Are Banned"
        status: "Verified"
        image: "/images/collections/laws/minnesota-greased-pig.jpg"
        description: |
          **Law:** Minnesota bans contests where a greased or oiled pig is released and the goal is to capture it, along with similar contests involving a released or thrown chicken or turkey.

          **Meaning:** The rule covers the classic county-fair greased pig chase directly by name, along with bird-catching contests built the same way.

          **Reason:** These contests were a genuine source of animal injuries and stress at fairs and festivals, and lawmakers wrote a specific ban rather than relying on the state's general animal cruelty statute.

      - name: "You Can't Stand in the Road to Hitchhike"
        status: "Verified"
        image: "/images/collections/laws/minnesota-hitchhiking-ban.jpg"
        description: |
          **Law:** Standing in a roadway to solicit a ride, a job, business, or a donation from someone in a passing vehicle is against state law.

          **Meaning:** The rule targets standing directly in the traveled roadway, not just holding a sign from the shoulder.

          **Reason:** It's a straightforward traffic-safety rule. A pedestrian standing in a lane to flag down cars creates a genuine collision risk for drivers and the person doing the flagging.

      - name: "Mosquito Breeding Grounds Are Legally a Public Nuisance"
        status: "Verified"
        image: "/images/collections/laws/minnesota-mosquito-nuisance.jpg"
        description: |
          **Law:** Areas where mosquitoes incubate or hatch are declared public nuisances that local boards can act to abate.

          **Meaning:** A standing-water breeding site on private land can trigger a legal abatement order, not just a neighbor's complaint.

          **Reason:** Minnesota's mosquito population is large enough that the state created a dedicated legal category for breeding sites, giving mosquito control boards real enforcement authority instead of relying on general nuisance law.

      - name: "Public Drunkenness Isn't a Crime"
        status: "Verified"
        image: "/images/collections/laws/minnesota-public-drunkenness.jpg"
        description: |
          **Law:** Nobody can be charged with or convicted of the offense of drunkenness or public drunkenness in Minnesota.

          **Meaning:** Being visibly intoxicated in public, by itself, isn't something police can arrest or charge someone for. Other conduct like disorderly conduct or DWI is still fully prosecutable.

          **Reason:** The law reflects a broader policy shift toward treating public intoxication as a public-health issue rather than a criminal one, moving people toward treatment options instead of jail.

