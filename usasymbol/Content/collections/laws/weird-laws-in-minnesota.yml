faq:
  - question: "Is public drunkenness illegal in Minnesota?"
    answer: "No. State law directly bars charging or convicting anyone for public drunkenness. Other offenses like disorderly conduct or DWI can still apply to related behavior."
  - question: "Is it illegal to catch a greased pig in Minnesota?"
    answer: "Yes. Operating or participating in a greased pig, chicken, or turkey capture contest is a misdemeanor under state law."
  - question: "Can you hitchhike in Minnesota?"
    answer: "Standing in a roadway to solicit a ride is against state law. The rule targets standing in the traveled lane, not holding a sign from the shoulder."
  - question: "Is the duck-on-your-head border law real?"
    answer: "No. Minnesota's own State Law Library has addressed this myth directly, and no statute supports the claim."
  - question: "What is the weirdest real law still on the books in Minnesota?"
    answer: "The public drunkenness rule surprises the most people, since it works backward from what everyone assumes. Being visibly intoxicated in public isn't, by itself, a crime in Minnesota."
  - question: "Is mosquito breeding a legal nuisance in Minnesota?"
    answer: "Yes. State law declares areas where mosquitoes incubate or hatch to be public nuisances, and local boards can act to abate them, even on private property."
