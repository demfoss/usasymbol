page:
  h1: "Weird Alcohol Laws in Mississippi"

  quick_answer:
    - "Mississippi still lets each of its 82 counties vote by referendum on whether to allow alcohol sales, a system the state set up when it repealed statewide Prohibition in 1966."
    - "Owning or possessing a still, the equipment used to make moonshine, is a felony in Mississippi carrying up to three years in the state penitentiary for a first offense."
    - "Sealed beer, wine, and liquor can legally ride anywhere in a Mississippi car, including the front seat, as long as the manufacturer's seal has not been broken."

