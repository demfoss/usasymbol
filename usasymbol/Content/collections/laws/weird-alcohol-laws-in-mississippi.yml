faq:
  - question: "Are there still dry counties in Mississippi?"
    answer: "Yes. As of 2025, 51 of Mississippi's 82 counties are wet, 26 are dry except for specific exempted cities, three have one wet and one dry judicial district, and Benton County is fully dry with no exceptions."

  - question: "Is owning a moonshine still illegal in Mississippi?"
    answer: "Yes. Owning, controlling, or possessing a still or any integral part of one is a felony, with a first offense carrying a minimum sentence of 12 months and up to 36 months in the state penitentiary."

  - question: "Can you have an open container of alcohol in a car in Mississippi?"
    answer: "Sealed beer, wine, and liquor in the manufacturer's original container can legally ride anywhere in the vehicle, including the front seat. The transport rule applies to unbroken seals; a container that has been opened is treated differently under Mississippi's open-container rules."

  - question: "Why did it take Mississippi so long to repeal Prohibition?"
    answer: "Mississippi was the first state to ratify national Prohibition and held onto its own statewide ban until 1966, decades after national Prohibition ended in 1933. The 1966 Local Option Law replaced the statewide ban with the county-by-county referendum system still in use today."

