sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Mississippi That Are Real"
    paragraphs:
      - "Mississippi's alcohol code still carries the marks of the state's slow, county-by-county exit from Prohibition, along with a few rules aimed squarely at unlicensed production and transport."
    highlights:
      - name: "Counties Still Vote Wet or Dry"
        status: "Verified"
        image: "/images/collections/laws/mississippi-dry-county-vote.jpg"
        anchor_phrases:
          - "Local Option Law"
          - "1966"
        description: |
          **Law:** Since Mississippi repealed statewide Prohibition in 1966, the state's Local Option Law lets each of its 82 counties hold a referendum deciding whether to allow retail alcohol sales.

          **Meaning:** A bottle of wine legal to buy in one county can be flatly unavailable a few miles away if voters in the next county chose to stay dry.

          **Reason:** Mississippi was the first state to ratify the 18th Amendment establishing national Prohibition and the last state to repeal its own statewide ban, so the county referendum system became the compromise that finally let wet areas sell alcohol without forcing it on the whole state.
      - name: "Owning a Still Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/mississippi-moonshine-still-ban.jpg"
        anchor_phrases:
          - "still"
          - "felony"
        description: |
          **Law:** Mississippi law makes it illegal for anyone to own, control, or possess a distillery, commonly called a still, or any integral part of one.

          **Meaning:** The offense covers owning the equipment itself, whether or not it has ever been used to make moonshine.

          **Reason:** A first offense carries a minimum sentence of 12 months and up to 36 months in the state penitentiary, showing Mississippi still treats unlicensed distilling as a serious crime rather than a folk-craft loophole.
      - name: "Sealed Alcohol Can Ride Anywhere in the Car"
        status: "Verified"
        image: "/images/collections/laws/mississippi-sealed-container-transport.jpg"
        anchor_phrases:
          - "sealed container"
        description: |
          **Law:** Mississippi law allows transporting beer, light wine, and other alcoholic beverages in their original manufacturer-sealed container anywhere in a vehicle, regardless of location.

          **Meaning:** Unlike states that require sealed alcohol to stay in the trunk, Mississippi permits it in the passenger compartment as long as the seal has not been broken.

          **Reason:** The rule focuses enforcement on open, accessible containers rather than the mere presence of alcohol in a car, since an unbroken seal already prevents the driver or a passenger from drinking en route.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Mississippi Still Lets Counties Vote Themselves Dry"
    paragraphs:
      - "Mississippi ratified national Prohibition before any other state and did not repeal its own statewide ban until 1966, more than three decades after the rest of the country ended Prohibition. The 1966 Local Option Law was the compromise that finally allowed alcohol sales in Mississippi again, but only where a county's voters approved it."
      - "That referendum system is still active today. As of 2025, 51 of the state's 82 counties are wet, while 26 more stay dry outside a handful of exempted cities, and Benton County remains dry with no exceptions at all. Changing a county's status still requires a new public vote, the same process the 1966 law set up nearly 60 years ago."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Mississippi ratified the 18th Amendment establishing national Prohibition before any other state and repealed its own statewide ban in 1966, the last state to do so."
      - "26 Mississippi counties are dry except for their county seat or a handful of named municipalities, a middle category between fully wet and fully dry."
      - "Three Mississippi counties are split, with one judicial district wet and the other dry within the same county."
      - "Benton County is Mississippi's only fully dry county, with no municipal or business exceptions."

