sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Maine That Are Real"
    paragraphs:
      - "A hunting ban from the 1880s and a billboard law from the 1970s both still hold up as genuine Unusual Laws in Maine, verified in the current statute book rather than just repeated online. Neither one reads the way the internet version tells it."
    highlights:
      - name: "The Sunday Hunting Ban"
        status: "Verified"
        image: "/images/collections/laws/maine-sunday-hunting-ban.jpg"
        anchor_phrases:
          - "Sunday hunting ban"
        description: |
          **Law:** Maine still makes it a crime to hunt wild animals or wild birds on Sunday.

          **Meaning:** Getting caught with hunting equipment in the woods or on the water that day is treated as evidence of a violation on its own, penalized as a Class E crime.

          **Reason:** The rule traces back to 1883, when Sunday was set aside by law as a day of rest. Maine's Supreme Court upheld the ban again in 2024 after hunters argued a newer constitutional food-sourcing amendment should override it. It didn't.
      - name: "The Statewide Billboard Ban"
        status: "Verified"
        image: "/images/collections/laws/maine-billboard-ban.jpg"
        anchor_phrases:
          - "billboard ban"
        description: |
          **Law:** No one may put up a sign visible from a public road unless it meets narrow exceptions written into the statute.

          **Meaning:** Businesses can advertise on their own property, but the classic roadside billboard, rented land next to the highway, is off limits statewide.

          **Reason:** Legislators passed the ban in 1977 to protect scenic highway views that tourism depends on. Existing billboards had to come down after the law took effect, not just new ones.
      - name: "The Snow-and-Ice Duty of Care"
        status: "Verified"
        image: "/images/collections/laws/maine-snow-ice-law.jpg"
        anchor_phrases:
          - "snow-and-ice law"
        description: |
          **Law:** Drivers are required to take reasonable measures to keep snow or ice from flying off their vehicle while it's on the road.

          **Meaning:** This is not the sweeping "clear every inch of your car" rule people describe online. It targets snow and ice that comes loose from a moving vehicle and becomes a hazard for the cars behind it, especially off pickup roofs and hoods.

          **Reason:** Lawmakers wrote it after repeated reports of snow slabs coming off vehicles at highway speed and striking trailing cars.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Maine We Couldn't Verify"
    paragraphs:
      - "A handful of Maine claims show up on nearly every weird-law list, yet none of them trace back to an actual statute or town ordinance. Weird Maine Laws Still on the Books gets used as a label for stories that never had a legal source to begin with."
    subsections:
      - subtitle: "You can't catch lobsters with your bare hands in Maine"
        status: "Not Verified"
        anchor_phrases:
          - "bare-handed lobster catching"
        text: |
          **Claim:** Catching lobsters with your bare hands is illegal in Maine.

          **Why We Couldn't Verify It:** No statute banning bare-handed lobster catching turns up in Maine's marine resources law. Maine's actual lobster rules focus on trap licensing, gauge size, and v-notching egg-bearing females, not on what body part touches the lobster first. The claim may have grown out of those unrelated licensing rules.
      - subtitle: "Blowing your nose in public is illegal in Waterville"
        status: "Not Verified"
        anchor_phrases:
          - "public nose-blowing claim"
        text: |
          **Claim:** Blowing your nose in public is against the law in Waterville.

          **Why We Couldn't Verify It:** Waterville's municipal code has no ordinance matching this claim, and no date or enforcement record has ever surfaced. The story circulates with no city clerk record behind it, which is usually a sign it started as a joke rather than an actual local rule.
      - subtitle: "Maine bans owning beavers, hippos, kangaroos, and giraffes as pets"
        status: "Not Verified"
        anchor_phrases:
          - "exotic pet ban claim"
        text: |
          **Claim:** Maine specifically bans keeping beavers, hippos, kangaroos, and giraffes as household pets.

          **Why We Couldn't Verify It:** Maine does license wildlife importation and possession in general terms, but no species-specific ban matching this exact list has been located. The claim likely stretches a general permitting requirement into a dramatic species-by-species list.
      - subtitle: "South Berwick fines drivers $175 for parking in front of a Dunkin'"
        status: "Not Verified"
        anchor_phrases:
          - "Dunkin' parking fine claim"
        text: |
          **Claim:** Parking in front of a specific Dunkin' location on Main Street in South Berwick carries a $175 fine.

          **Why We Couldn't Verify It:** No South Berwick parking ordinance sets a fine at that figure for that location. The oddly specific dollar amount and address suggest a single local anecdote that got repeated as if it were town code.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Maine Laws That Are Myths"
    paragraphs:
      - "Some Strange Maine Laws claims fall apart the moment you check what real law already covers the same ground. Biting someone is assault everywhere, no landlord carve-out required, and dancing itself was never the crime some versions describe."
    subsections:
      - subtitle: "It's illegal to bite your landlord in Rumford"
        status: "Myth"
        anchor_phrases:
          - "landlord-biting claim"
        text: |
          **Myth:** Biting your landlord is specifically illegal in Rumford.

          **Reality:** Biting a person is already assault under ordinary Maine criminal law, landlord or not. Rumford has no separate ordinance naming landlords, and this version of the joke gets pinned on a different small town in almost every state's weird-law list.
      - subtitle: "Dancing in a bar that serves alcohol is illegal"
        status: "Myth"
        anchor_phrases:
          - "dancing in a bar claim"
        text: |
          **Myth:** Dancing inside a bar that sells alcohol is against the law in Maine.

          **Reality:** Maine regulates public entertainment through venue licensing, not through a ban on dancing itself. A bar that adds live music or dancing may need an entertainment license, which is a permitting rule, not a prohibition on movement.
      - subtitle: "It's illegal to own an armadillo as a pet in Maine"
        status: "Myth"
        anchor_phrases:
          - "armadillo pet claim"
        text: |
          **Myth:** Keeping an armadillo as a pet is illegal in Maine.

          **Reality:** Armadillos don't naturally range anywhere near Maine, so there was never a reason to write a species-specific ban. General wildlife importation rules would apply to bringing one in, the same as almost any non-native animal, which is a different thing than a targeted armadillo law.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Maine's Home Rule Towns Multiply Unverifiable Claims"
    paragraphs:
      - "Maine amended its constitution in 1969 to grant municipalities home rule, letting towns pass their own ordinances without asking the Legislature for permission first. That single change is a big reason town-level claims about Waterville or Rumford are so hard to confirm or kill. Every town keeps its own code, and unlike a state's central statute book, there is no single searchable database covering every ordinance every small town has ever passed."
      - "Maine's Legislature also meets every single year, unlike states that convene only every other year. Annual sessions give lawmakers more chances to file repeal bills, yet obscure statutes like the Sunday hunting ban still survive because nobody spends limited floor time removing a rule that almost never gets enforced against anyone."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Maine and Massachusetts are the only two states left with a complete ban on Sunday hunting."
      - "Hunters carrying a cased weapon broken into at least two separate pieces on a Sunday get a specific carve-out written directly into the statute, avoiding the automatic evidence-of-violation standard."
      - "A driver cited for snow or ice flying off a vehicle can face a fine anywhere from $50 for a first offense up to $250 if it causes damage."
      - "Maine's windshield-clarity law is a separate statute from the snow-and-ice rule. One bans signs, posters, or opaque material blocking the driver's view. The other targets loose snow coming off the vehicle itself."
      - "Maine voters have held constitutional power to force a statewide people's veto referendum on any new law since 1908, though nobody has ever used it to erase a rule as small as a hunting or billboard statute."

