page:
  h1: "Weird Laws in Maine That Are Older Than They Sound"

  quick_answer:
    - "Three Maine laws checked out as real: the Sunday hunting ban, the statewide billboard ban, and the snow-and-ice duty-of-care rule for drivers."
    - "The popular snow law is often described as a windshield rule, but the actual statute targets snow flying off a moving vehicle and endangering other drivers."
    - "Claims about bare-handed lobster catching, nose-blowing bans, and an armadillo pet ban have no statute or ordinance behind them anywhere in Maine."

