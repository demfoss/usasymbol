faq:
  - question: "Is it illegal to hunt on Sundays in Maine?"
    answer: "Yes. Maine bans hunting wild animals or wild birds on Sunday statewide, and violating it is a Class E crime. The rule dates to 1883, and Maine's Supreme Court upheld it again in 2024."
  - question: "Are billboards illegal in Maine?"
    answer: "Off-premise billboards are banned statewide under a law passed in 1977. Businesses can still advertise on their own property, but roadside billboard space cannot legally be rented or built along Maine's public roads."
  - question: "Do you have to clear snow off your car in Maine?"
    answer: "Maine law requires drivers to take reasonable steps to keep snow and ice from flying off a moving vehicle. It is a narrower rule than the popular version suggests, and it exists alongside a separate law about keeping windshields clear of anything that blocks the driver's view."
  - question: "Is it illegal to catch lobsters with your bare hands in Maine?"
    answer: "No statute banning bare-handed lobster catching has been found in Maine law. The claim isn't backed by an actual rule, though Maine does regulate lobster licensing, trap gauges, and egg-bearing females separately."
  - question: "Is it illegal to own an armadillo in Maine?"
    answer: "No specific armadillo ban exists in Maine. General wildlife importation rules would apply to bringing in almost any non-native species, but there's no targeted armadillo law behind this claim."
  - question: "What is the weirdest law still enforced in Maine?"
    answer: "The Sunday hunting ban is the strongest candidate. It's over 140 years old, still carries a real criminal penalty, and was tested and upheld in court as recently as 2024."
