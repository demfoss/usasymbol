  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Old Laws Don't Get Repealed"
    paragraphs:
      - "The Texas Legislature meets for 140 days every two years. In a session that short, repealing a rarely enforced statute is almost never a floor priority. The result is a code base that accumulates old rules faster than anyone cleans them up. The obscene devices presumption in § 43.23 is a direct example: a federal court held it unconstitutional as applied to private use in 2008, but the text still sits in the Texas Penal Code — unenforced, unrepealed — because no legislative session since then has moved to formally remove it."
      - "Texas has over 1,200 incorporated cities and towns, each with its own municipal code. Claims without a Texas Statutes citation are usually local ordinances, historical ordinances that may have been repealed, or unsourced claims."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Texas is one of roughly 9 US states that still recognize common-law (informal) marriage — Family Code § 2.401 has been used in divorce and estate litigation"
      - "The Texas Legislature meets for only 140 days every two years — the biennial schedule is a structural reason why outdated statutes stay in the code"
      - "The 5th Circuit's 2008 ruling in Reliable Consultants v. Earle found § 43.23 unconstitutional as applied to private use, but the statute was never formally repealed"
      - "The Fence Cutting Wars of the 1880s were a genuine range conflict with real fatalities — the 1884 law that followed made fence-cutting a felony, not a misdemeanor"
      - "Texas has over 1,200 incorporated cities, each with its own municipal code — most 'weird Texas law' claims without a statute citation are local ordinances or unverified"


faq:
  - question: "What is the weirdest law in Texas that is actually real?"
    answer: "Penal Code § 43.23 is one of the strangest: possession of six or more obscene devices creates an evidentiary presumption of commercial intent. A 2008 federal appeals court found parts of the law unconstitutional as applied to private use, but the text remains in the code. Texas informal marriage is also often misunderstood because it requires agreement, cohabitation, and public representation, not a fixed number of years together."

  - question: "Are weird Texas laws still enforceable?"
    answer: "Some are. Penal Code § 42.01 (public profanity in a breach-of-peace context) is enforceable and has been cited in disorderly conduct cases. Family Code § 2.401 (informal marriage) is actively used — informal marriages are litigated in Texas courts every year, typically in divorce or estate proceedings. Penal Code § 43.23 (obscene devices presumption) remains in the code but has been held unenforceable against private use since 2008. Claims without a statute citation are unverifiable as enforceable laws."

  - question: "Is common-law marriage legal in Texas?"
    answer: "Yes. Texas Family Code § 2.401 recognizes informal marriage without a ceremony. The three requirements are: agreement to be married, living together in Texas as spouses, and representing to others that you are married. There is no waiting period or cohabitation minimum. The popular version — that living together for a set number of years automatically creates a marriage — is wrong. The law requires a genuine agreement to be married, not just cohabitation."

  - question: "Is it illegal to swear in public in Texas?"
    answer: "Texas Penal Code § 42.01 makes it a Class C misdemeanor to use profane or vulgar language in a public place 'in a manner reasonably likely to provoke a breach of the peace.' That qualifier defines the offense. Casual or loud profanity does not satisfy it. The law covers verbal conduct that creates a realistic risk of physical confrontation — not someone swearing at their phone in a grocery store."

  - question: "What is the difference between a Texas state law and a local ordinance?"
    answer: "A Texas state law is passed by the Texas Legislature and applies everywhere in the state. A local ordinance is passed by a city council and applies only within that city's limits. Texas has over 1,200 incorporated cities and towns, each with its own municipal code. Many frequently cited 'Texas laws' — barefoot permits, wire cutter bans — are either local ordinances from specific cities or claims with no confirmed source. If a weird law claim does not include a Texas Statutes citation, it is likely not a statewide law."
