sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Texas That Are Real"
    paragraphs:
      - "Plenty of so-called Unusual Laws in Texas turn out to be real statutes once you read the actual text. They are usually narrower, older, or more technical than the viral version, which is why they can sound fake at first glance."
    highlights:
      - name: "Common-Law Marriage Is Legal"
        status: "Verified"
        image: "/images/collections/laws/texas-common-law-marriage.jpg"
        anchor_phrases:
          - "informal marriage"
          - "common-law marriage"
        description: |
          **Law:** Texas recognizes informal marriage without a ceremony or license.

          **Meaning:** A couple can be treated as legally married if they truly agreed to be married, lived together in Texas, and openly acted like spouses.

          **Reason:** The rule survived because older Texas life often moved faster than official paperwork, especially in rural places where families formed long before documents did.
      - name: "Public Profanity Is Only Illegal Under One Condition"
        status: "Verified"
        image: "/images/collections/laws/texas-public-profanity.jpg"
        anchor_phrases:
          - "public-profane-language rule"
          - "profanity rule"
        description: |
          **Law:** Texas does not ban random swearing in public.

          **Meaning:** The law only matters when abusive or profane language is likely to trigger an immediate fight, so it works more like a breach-of-peace rule than a rule about politeness.

          **Reason:** Lawmakers wanted a way to stop face-to-face confrontations before they turned physical.
      - name: "The Six-Device Rule Is About Selling, Not Owning"
        status: "Verified"
        image: "/images/collections/laws/texas-obscene-devices-presumption.jpg"
        anchor_phrases:
          - "obscene-devices presumption"
          - "six-device rule"
        description: |
          **Law:** Texas once treated possession of six or more obscene devices as evidence that someone meant to sell them, not just keep them privately.

          **Meaning:** What sounds bizarre was really aimed at storefront vice and commercial distribution, not at what adults kept at home.

          **Reason:** The state was targeting commercial obscenity sales, and even after a 2008 federal ruling blocked the law against private adult use, the old wording still remained in the code.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Texas We Couldn't Verify"
    paragraphs:
      - "Some Weird Laws in Texas claims may have started as local rumors or half-remembered ordinances. But these examples keep circulating without any actual statute, city code, or date of passage behind them."
    subsections:
      - subtitle: "You Need a Permit to Go Barefoot in Austin"
        status: "Not Verified"
        anchor_phrases:
          - "barefoot permits"
        text: |
          **Claim:** You need a permit to go barefoot in Austin.

          **Why We Couldn't Verify It:** No current Austin ordinance requiring a barefoot permit has been found. The rumor probably grew out of store or restaurant health rules and then got retold as if the whole city had outlawed walking barefoot.
      - subtitle: "Carrying Wire Cutters in Your Pocket Is Illegal in Austin"
        status: "Not Verified"
        anchor_phrases:
          - "wire-cutter bans"
        text: |
          **Claim:** Carrying wire cutters in your pocket is illegal in Austin.

          **Why We Couldn't Verify It:** This one likely survives because fence cutting really was a major Texas conflict in the 1880s. But there is a big difference between punishing actual fence damage and banning someone from merely carrying wire cutters, and no current Austin ordinance or Texas law says that.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Texas Laws That Are Myths"
    paragraphs:
      - "Some Strange Texas Laws claims are not just unverified. Each one is either a general property crime dressed up as a bizarre special law or a line copied from generic weird-law lists with no Texas source behind it."
    subsections:
      - subtitle: "It's Illegal to Eat Your Neighbor's Garbage"
        status: "Myth"
        anchor_phrases:
          - "garbage eating"
        text: |
          **Myth:** It's illegal to eat your neighbor's garbage.

          **Reality:** There is no special Texas law about eating your neighbor's garbage. The story is basically ordinary trespass or property law rewritten to sound disgusting enough for a weird-law list.
      - subtitle: "It's Illegal to Milk Someone Else's Cow Without Permission"
        status: "Myth"
        anchor_phrases:
          - "milking someone else's cow"
        text: |
          **Myth:** It's illegal to milk someone else's cow without permission.

          **Reality:** Texas does not have a special law written just for unauthorized cow-milking. It is simply a ranch-flavored rewrite of ordinary theft, which is why it sounds colorful enough to keep getting recycled online.
      - subtitle: "You Can Only Take Three Sips of Beer While Standing"
        status: "Myth"
        text: |
          **Myth:** You can only take three sips of beer while standing.

          **Reality:** This is a recycled internet joke, not a Texas law. The same line shows up under different states, which is usually the clearest sign that nobody got it from any real statute in the first place.
      - subtitle: "Criminals Must Give 24 Hours' Notice Before Committing a Crime"
        status: "Myth"
        text: |
          **Myth:** Criminals must give 24 hours' notice before committing a crime.

          **Reality:** This is another stock weird-law joke pasted onto different states. It does not resemble how criminal law works anywhere, and no Texas source has ever backed it up.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Old Laws Don't Get Repealed"
    paragraphs:
      - "The Texas Legislature meets for only 140 days every two years, and repealing a rarely enforced statute is almost never worth precious floor time in a session that short. The obscene-devices presumption is the clearest example: a federal court ruled it unconstitutional as applied to private use in 2008, yet the text still sits in the code because no later session has bothered to clean it out."
      - "Texas also has more than 1,200 incorporated cities and towns, each with its own municipal code. When a viral claim has no Texas Statutes citation, it is usually one of three things: a real local ordinance from a specific city, a historical rule that has long since faded away, or a claim that never had a source attached to it at all."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Texas is one of fewer than 10 U.S. states that still recognize common-law marriage by agreement alone, without a ceremony or license."
      - "Class C misdemeanors, the category that covers the public profanity rule, are fine-only in Texas — up to $500, with no jail time attached."
      - "County clerks across Texas accept a formal Declaration of Informal Marriage, letting couples who never had a ceremony put an official date on record for when their marriage began."
      - "Texas cities can pass their own ordinances, but only the Legislature can create a felony or jail-time offense — city rules generally cap out at a fine."

