faq:
  - question: "What is the weirdest law in Texas that is actually real?"
    answer: "The obscene devices rule is one of the strangest: owning six or more qualifies as evidence of intent to sell commercially, not personal use. A 2008 federal appeals ruling found it unconstitutional as applied to private use, but the text was never removed from the code. Texas's informal marriage rule is also widely misunderstood — it requires agreement, cohabitation, and public representation as a couple, not a fixed number of years together."

  - question: "Are weird Texas laws still enforceable?"
    answer: "Some are. The public profanity rule is enforceable and has been used in disorderly conduct cases, but only when language is likely to provoke real violence. The informal marriage rule is actively used — Texas courts handle these cases every year, mostly in divorce or estate disputes. The obscene devices presumption remains in the code but hasn't been enforced against private use since a 2008 federal ruling. Claims with no statute behind them were never real laws to begin with."

  - question: "Is common-law marriage legal in Texas?"
    answer: "Yes. Texas recognizes informal marriage without a ceremony. The requirements are a genuine agreement to be married, living together in Texas as spouses, and telling others you are married. There's no waiting period or minimum number of years together — the popular version of this claim gets that detail wrong."

  - question: "Is it illegal to swear in public in Texas?"
    answer: "Only under one condition: the language has to be likely to provoke a real fight, not just be offensive to someone nearby. Casual or loud profanity doesn't meet that bar. The rule covers verbal conduct that creates a realistic risk of physical confrontation, not someone swearing at their phone in a grocery store."

  - question: "What's the difference between a Texas state law and a local ordinance?"
    answer: "A state law comes from the Texas Legislature and applies everywhere in the state. A local ordinance comes from a city council and only applies inside that city's limits. Texas has more than 1,200 incorporated cities and towns, each with its own code. Many viral 'Texas law' claims, like barefoot permits or wire cutter bans, are either local ordinances from a specific city or claims with no source at any level. If a claim doesn't point to an actual Texas statute, it's probably not a statewide law."
