page:
  h1: "Strange Texas Laws"

  quick_answer:
    - "Three of the most-cited laws on this page are real statutes: informal marriage, the public-profane-language rule, and the obscene-devices presumption. Online versions usually paraphrase them until the meaning changes."
    - "Informal marriage requires a genuine agreement to be married, not a certain number of years together. The profanity rule only applies when language is likely to provoke real violence, and the six-device rule was about commercial sale, not private ownership."
    - "Most other viral Texas claims, including barefoot permits, wire-cutter bans, garbage eating, and milking someone else's cow, are either unverified or just ordinary theft law dressed up as something bizarre."

  sources:
    - name: "Texas Penal Code — Disorderly Conduct (§ 42.01)"
