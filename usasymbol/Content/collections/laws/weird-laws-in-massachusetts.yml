page:
  h1: "Weird Massachusetts Laws Still on the Books"
  quick_answer:
    - "Four Massachusetts weird-law claims are real: a Salem fortune-telling license, a pigeon-net protection statute, a dueling-death murder rule, and a Sunday hunting ban."
    - "The pigeon law only protects pigeons near active netting beds used for trapping, not pigeons in general."
    - "Claims about a goatee permit and a ban on tomatoes in clam chowder are myths with no statute behind them."
