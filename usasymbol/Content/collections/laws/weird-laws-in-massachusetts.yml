sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Massachusetts That Are Real"
    paragraphs:
      - "Salem still requires a license to read palms for money, a rule that fits a city built on witchcraft tourism. Unusual Laws in Massachusetts also include a pigeon-protection statute and a dueling rule most people assume died out centuries ago."
    highlights:
      - name: "Salem Requires a License to Tell Fortunes"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-salem-fortune-telling-license.jpg"
        description: |
          **Law:** Salem's city code makes it illegal to practice palmistry, fortune-telling, phrenology, card reading, or astrology for money without a license from the licensing board.

          **Meaning:** Applicants generally must have lived or run a metaphysical business in Salem for at least 12 months before the city will grant one.

          **Reason:** Salem built an entire tourism economy around witchcraft history, so the city treats fortune-telling as a regulated trade rather than a novelty, closer to how it licenses any other storefront business.

      - name: "You Can't Interfere With Pigeon Nets"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-pigeon-net-law.jpg"
        description: |
          **Law:** State law bans willfully killing pigeons on, or scaring them away from, beds built to trap them in nets, within 100 rods of the site.

          **Meaning:** Interfering with an active pigeon-trapping operation on land that isn't yours can bring a fine of up to $20 or a month in jail, plus damages owed to the trap's owner.

          **Reason:** Netting wild pigeons for food and sport was once a real commercial practice in Massachusetts, and lawmakers wrote a property-style protection for the trapping beds themselves.

      - name: "Dying in a Duel Abroad Counts as Murder Back Home"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-dueling-law.jpg"
        description: |
          **Law:** A Massachusetts resident who arranges a duel inside the state but fights it elsewhere, and dies from the wound after returning, can be charged with murder in the county where the death happens.

          **Meaning:** Leaving the state to duel doesn't dodge Massachusetts jurisdiction if the fatal outcome plays out back home.

          **Reason:** Dueling was a real method some 18th and 19th century disputes were settled, often just across a state line where it was tolerated, and lawmakers closed that loophole directly.

      - name: "Sunday Is a Closed Season for Hunting"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-sunday-hunting-ban.jpg"
        description: |
          **Law:** Massachusetts treats every Sunday as a closed hunting season statewide, with no general exception for licensed hunters.

          **Meaning:** Carrying a rifle, shotgun, bow, or handgun into the field to hunt birds or mammals on a Sunday is against the law, aside from a short list of activities like supervised trap and skeet shooting.

          **Reason:** The rule traces back to old Puritan blue laws that reserved Sundays for rest and worship, and unlike most of those laws, this one never got repealed.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Massachusetts We Couldn't Verify"
    paragraphs:
      - "A limit on sandwiches at a wake is one of the odder claims that keeps circulating among Real Massachusetts Laws You Won't Believe lists online. Three more share the same problem: no ordinance, no date, no city record."
    subsections:
      - subtitle: "Squirt guns are banned in Marlboro"
        status: "Not Verified"
        text: |
          **Claim:** The city of Marlboro has an ordinance banning squirt guns.

          **Why We Couldn't Verify It:** No matching provision appears in Marlborough's current municipal code. The claim has circulated on weird-law lists for years without ever citing a bylaw number or an enforcement date.

      - subtitle: "Eating peanuts in church is illegal"
        status: "Not Verified"
        text: |
          **Claim:** A Massachusetts law or local ordinance bans eating peanuts inside a church.

          **Why We Couldn't Verify It:** No statute or municipal code section matching this claim can be found anywhere. It has no attached town, date, or penalty, which is typical of a claim that started as a joke and got repeated as fact.

      - subtitle: "There's a limit on the number of sandwiches served at a wake"
        status: "Not Verified"
        text: |
          **Claim:** State or local law caps how many sandwiches can be served at a wake.

          **Why We Couldn't Verify It:** No provision regulating wake catering appears in Massachusetts general law or any town code found. Funeral homes are regulated for licensing and health standards, not sandwich counts.

      - subtitle: "Loud snoring with the windows open can violate Framingham's noise ordinance"
        status: "Not Verified"
        text: |
          **Claim:** Framingham's noise ordinance can be used to cite someone for snoring loudly with the windows open.

          **Why We Couldn't Verify It:** Framingham does have a real nuisance noise ordinance, but its published text addresses general noise levels and property impact, not bodily sounds like snoring specifically. No citation record supports the claim as written.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Massachusetts Laws That Are Myths"
    paragraphs:
      - "Tomato soup started one of the most repeated Strange Massachusetts Laws myths, and a fake grooming permit is close behind it."
    subsections:
      - subtitle: "It's illegal to put tomatoes in clam chowder"
        status: "Myth"
        text: |
          **Myth:** Massachusetts law bans tomato-based clam chowder in favor of the traditional cream version.

          **Reality:** No such law exists today. The story traces back to an unconfirmed 1939 bill said to have been floated in Massachusetts and Maine, but no record shows either version actually passed. What survives is a real regional food rivalry, not a real statute.

      - subtitle: "You need a permit to wear a goatee in Massachusetts"
        status: "Myth"
        text: |
          **Myth:** Growing or wearing a goatee requires a special state permit.

          **Reality:** No licensing requirement for facial hair exists anywhere in Massachusetts law. The claim has no attached agency, fee, or penalty, and it reads like a joke that got repeated often enough to sound official.

      - subtitle: "Gorillas can't ride in the back seat of a car"
        status: "Myth"
        text: |
          **Myth:** Massachusetts bans keeping a gorilla in the back seat of a car.

          **Reality:** This claim shows up on generic weird-law lists for multiple states with nearly identical wording, which is the clearest sign it was never a real ordinance anywhere. Massachusetts has no gorilla-specific transportation statute.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Town Meeting Government Keeps Old Bylaws Alive in Massachusetts"
    paragraphs:
      - "Most of Massachusetts' 351 cities and towns still run under town meeting government, where residents vote directly on local bylaws at an annual meeting. Repealing a small, harmless bylaw means putting it on a warrant alongside budget votes and zoning changes, and it rarely rises high enough on the agenda to get a vote of its own. State-level statutes face a similar problem: the Massachusetts Legislature is one of the few full-time state legislatures in the country, but that time gets absorbed by active bills, not by hunting down centuries-old provisions like the dueling statute."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Massachusetts still requires licensed milk dealers to put their own name on every container they sell, a labeling rule left over from door-to-door dairy delivery, with a maximum fine of just ten dollars."
      - "Salem's fortune-telling license grew directly out of the city's 1692 witch trial history, which the city now leans into as a tourism identity instead of trying to distance itself from it."
      - "The Massachusetts Legislature is one of only a handful of state legislatures that meets full time year-round, yet that hasn't been enough to clear out its oldest statutes."
      - "The pigeon-net statute measures its protection zone in rods, an old land-surveying unit equal to 16.5 feet, a sign of just how old the underlying law really is."
      - "Massachusetts' Sunday hunting ban has stood since the colonial era even as the state repealed most of its other Puritan-era blue laws over the past century."

