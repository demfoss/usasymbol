faq:
  - question: "Is Salem's fortune-telling license law real?"
    answer: "Yes. Salem's city code requires a license from the licensing board to practice palmistry, card reading, astrology, or fortune-telling for money, and most applicants must have lived or worked in the city for at least a year first."
  - question: "Is it illegal to hunt on Sundays in Massachusetts?"
    answer: "Yes, statewide. Every Sunday is a closed hunting season with almost no exceptions, a rule that dates back to Massachusetts' colonial-era blue laws."
  - question: "Is there really a Massachusetts law about tomatoes in clam chowder?"
    answer: "No. It's one of the most repeated food myths in New England. An unconfirmed 1939 bill is often cited as the origin, but no record shows it ever became law in Massachusetts or Maine."
  - question: "What is the weirdest real law still on the books in Massachusetts?"
    answer: "The pigeon-net protection statute stands out. It bans killing or scaring pigeons away from active netting beds within 100 rods, a rule built for a commercial pigeon-trapping trade that mostly disappeared generations ago."
  - question: "Do you need a permit for a goatee in Massachusetts?"
    answer: "No. There's no facial hair licensing requirement anywhere in Massachusetts law. It's a myth with no agency, fee, or statute attached to it."
  - question: "What happens if you duel outside Massachusetts and die from it?"
    answer: "If you're a Massachusetts resident who arranged the duel while in the state, dying from the wound after returning can lead to a murder charge in the county where you die. Leaving the state doesn't remove the state's jurisdiction."
