sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in West Virginia That Are Real"
    paragraphs:
      - "West Virginia has a real, working legal process for claiming roadkill, and that's just one of several Unusual Laws in West Virginia that check out against the actual code and its history."
    highlights:
      - name: "You Can Legally Keep and Eat Roadkill"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-roadkill-law.jpg"
        description: |
          **Law:** Wildlife accidentally struck and killed by a vehicle can be lawfully possessed if the person notifies law enforcement within 12 hours and obtains a nonhunting game tag within 24 hours.

          **Meaning:** It's a formal, documented process, not an informal free-for-all. Certain protected species like elk and bear cubs are excluded.

          **Reason:** The law gives a legal path for something that was already happening anyway, letting people salvage usable meat rather than have it go to waste on the roadside, while still tracking wildlife deaths through the tag system.

      - name: "Disturbing a Festival or Assembly Is a Misdemeanor"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-disturbance-law.jpg"
        description: |
          **Law:** Willfully interrupting a school, Sunday school, literary society, Fourth of July celebration, church festival, or similar lawful gathering is a misdemeanor, fined $10 to $50.

          **Meaning:** The law bundles together a wide range of community gatherings under one statute rather than writing a separate rule for each type of event.

          **Reason:** It reflects an era when local gatherings, civic, religious, and educational, were treated as public goods worth specific legal protection from disruption.

      - name: "Adultery and Fornication Carry a Fine"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-adultery-law.jpg"
        description: |
          **Law:** Committing adultery or fornication is a misdemeanor carrying a fine of at least $20.

          **Meaning:** The statute remains in the code, though prosecutions under it are rare in practice today.

          **Reason:** It's a leftover morals statute from an era when this kind of personal conduct was treated as a routine criminal matter, never formally repealed even as enforcement stopped.

      - name: "You Once Had to Remove Your Hat in a Theater"
        status: "Repealed"
        image: "/images/collections/laws/west-virginia-theater-hat-law.jpg"
        description: |
          **Law:** West Virginia once fined moviegoers for wearing a hat inside a theater.

          **Meaning:** The rule was one of a batch of old statutes the Legislature formally cleared out in 2010, alongside restrictions like a ban on owning certain flags.

          **Reason:** Hats blocking the view of people seated behind you was a real, practical annoyance in old theaters, but the rule outlived its usefulness once theater seating and screen placement changed, and lawmakers finally repealed it decades later.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in West Virginia We Couldn't Verify"
    paragraphs:
      - "A batch of Weird West Virginia Laws Still on the Books claims about specific towns keeps circulating with no ordinance ever confirmed behind most of them."
    subsections:
      - subtitle: "Alderson bans walking a pet lion, tiger, or leopard, even on a leash"
        status: "Not Verified"
        text: |
          **Claim:** A specific Alderson ordinance bans walking big cats like lions or tigers, even on a leash.

          **Why We Couldn't Verify It:** No matching Alderson municipal code section has been located. The claim appears only on generic listicle round-ups with no citation.

      - subtitle: "Digging ginseng on a neighbor's land is illegal"
        status: "Not Verified"
        text: |
          **Claim:** West Virginia specifically bans digging ginseng on someone else's property without permission.

          **Why We Couldn't Verify It:** General trespass and theft law would cover unauthorized digging on private land, but a ginseng-specific statute matching this exact claim hasn't been confirmed.

      - subtitle: "Nicholas County clergy can't tell jokes during a sermon"
        status: "Not Verified"
        text: |
          **Claim:** A Nicholas County ordinance bans clergy from cracking jokes during a sermon.

          **Why We Couldn't Verify It:** No ordinance number or date has ever been attached to this claim, which usually signals it never had a real source behind it.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange West Virginia Laws That Are Myths"
    paragraphs:
      - "One Strange West Virginia Laws claim is not just unverified but flatly false and worth correcting directly."
    subsections:
      - subtitle: "A husband can legally abuse his wife on a Sunday on courthouse steps"
        status: "Myth"
        text: |
          **Myth:** West Virginia law supposedly allows a man to physically abuse his wife if it happens on a Sunday on the steps of a courthouse.

          **Reality:** This is completely false. Domestic violence is a crime in West Virginia under general assault and battery law, with no exception for any day, location, or circumstance. This claim is a piece of dangerous, fabricated folklore, not a real statute of any kind.

      - subtitle: "Whistling underwater is illegal"
        status: "Myth"
        text: |
          **Myth:** West Virginia specifically bans whistling while underwater.

          **Reality:** No statute anywhere addresses underwater whistling. This near-identical claim shows up recycled across multiple states' weird-law lists, a strong sign of a stock joke rather than a real ordinance.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why West Virginia's 2010 Cleanup Didn't Catch Everything"
    paragraphs:
      - "In 2010, West Virginia's Legislature actually did repeal a batch of genuinely obsolete statutes, including the theater hat rule and a restriction on owning certain flags, proving old laws can be cleared out when lawmakers make it a priority. But the Legislature's regular session is constitutionally capped at 60 days a year, and a targeted cleanup effort like that one only catches what someone actively flags for review, which is exactly why laws like the adultery fine and the festival-disturbance statute survived that same round of repeals untouched."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "West Virginia's roadkill law excludes certain species entirely, including elk, spotted fawns, and bear cubs, regardless of how the animal died."
      - "The 2010 repeal effort also removed an old restriction on owning red or black flags, a leftover from an earlier anti-anarchist and anti-communist legal era."
      - "The festival-disturbance statute's $10 to $50 fine range has stayed unchanged even as its companion morals laws have been debated for repeal."
      - "West Virginia's regular legislative session is capped at 60 days a year by the state constitution, extendable only by a two-thirds vote of both chambers."
      - "The Marlinton Roadkill Cook-off, an annual West Virginia festival, celebrates the same legal roadkill-salvage culture the state's actual statute enables."

