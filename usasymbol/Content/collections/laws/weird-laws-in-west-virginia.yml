faq:
  - question: "Is it legal to eat roadkill in West Virginia?"
    answer: "Yes. State law lets you keep and eat wildlife accidentally struck by a vehicle, as long as you notify authorities within 12 hours and get a nonhunting game tag within 24 hours."
  - question: "Is adultery actually illegal in West Virginia?"
    answer: "Technically yes. State law still classifies adultery and fornication as a misdemeanor with at least a $20 fine, though prosecutions are rare today."
  - question: "Did West Virginia really ban wearing hats in theaters?"
    answer: "Yes, historically. The rule was formally repealed in 2010 as part of a batch of obsolete statutes the Legislature cleared out that year."
  - question: "Is it illegal to disturb a Fourth of July celebration in West Virginia?"
    answer: "Yes. State law makes willfully interrupting a Fourth of July celebration, church festival, or similar lawful gathering a misdemeanor, fined $10 to $50."
  - question: "Is the courthouse-steps spousal abuse claim real?"
    answer: "No, and it's important to be clear about this. It's completely false. Domestic violence is a crime in West Virginia under ordinary assault law, with no day-of-week or location exception."
  - question: "What is the weirdest real law still on the books in West Virginia?"
    answer: "The roadkill possession law surprises people most, since it's a genuinely functional legal process with real notification and tagging requirements, not just an informal custom."
