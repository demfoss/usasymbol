  quick_answer:
    - "Four West Virginia claims check out: a legal roadkill possession law, a ban on disturbing festivals and assemblies, an adultery fine, and a repealed theater hat rule."
    - "Roadkill in West Virginia is legal to keep and eat, but only if you notify authorities within 12 hours and get a tag within 24 hours."
    - "The claim about a legal 'Sunday courthouse steps' exception for spousal abuse is completely false and dangerous folklore, not a real law of any kind."
