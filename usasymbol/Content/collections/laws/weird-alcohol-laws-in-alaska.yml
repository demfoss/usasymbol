sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Alaska That Are Real"
    paragraphs:
      - "Alaska pushes more alcohol control down to the local and individual level than most states, and backs that local control with some of the harshest penalties in the country for breaking it."
    subsections:
      - subtitle: "Villages Can Vote Themselves Dry or Damp"
        status: "Verified"
        image: "/images/collections/laws/alaska-local-option-villages.jpg"
        anchor_phrases:
          - "local option election"
          - "dry"
          - "damp"
        text: |
          **Law:** Alaska's Title 4 local option law, passed in 1981, lets any community hold a referendum to ban alcohol entirely (dry), allow limited personal possession without retail sales (damp), or remain fully wet.

          **Meaning:** More than 100 rural communities have held at least one local option election since 1981, and nearly 70% of those votes ended in some form of restriction.

          **Reason:** The law came from small communities themselves, seeking a legal tool to fight alcohol-linked violence and trauma that state-level policy could not address village by village.
      - subtitle: "Bootlegging Into a Dry Village Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/alaska-bootlegging-felony.jpg"
        anchor_phrases:
          - "Class C felony"
          - "bootlegging"
        text: |
          **Law:** Selling alcohol without a license in a community that has voted dry is a Class C felony in Alaska, punishable by up to five years in prison and a $50,000 fine.

          **Meaning:** Even a single case of beer resold off a bush flight can carry the same felony charge as a larger bootlegging operation.

          **Reason:** Remote villages are reachable mainly by small aircraft with little luggage screening, so lawmakers raised the penalty for bootlegging instead of relying on interdiction that rural geography makes nearly impossible.
      - subtitle: "Happy Hour Is Illegal Statewide"
        status: "Verified"
        image: "/images/collections/laws/alaska-happy-hour-ban.jpg"
        anchor_phrases:
          - "happy hour"
        text: |
          **Law:** Alaska Statute 04.16.015 bars selling a drink below what the business paid for it, offering free drinks as a marketing device, or running a discount that doesn't apply for a full calendar week at every hour the business is open.

          **Meaning:** A bar can still price a fixed-price special all day, every day, but it cannot run a limited after-work discount window the way most states allow.

          **Reason:** Alaska adopted the ban during the 1980s wave of anti-drunk-driving legislation, joining a short list of states, including Massachusetts and Oklahoma, that outlawed happy hour outright rather than just limiting it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Alaska Handed Alcohol Control to Individual Villages"
    paragraphs:
      - "Alaska's geography makes a one-size-fits-all alcohol policy hard to justify. A rule that fits urban Anchorage rarely fits a village reachable only by plane, so the 1981 local option law let each community decide for itself rather than waiting on the legislature to set one statewide standard."
      - "The tradeoff shows up in bootlegging enforcement. Nearly 70% of local option votes have chosen some restriction, but restriction did not end demand. Remote geography that made local control appealing in the first place is the same geography that makes policing a dry village's borders nearly impossible, which is why lawmakers leaned on a felony-level penalty instead of routine enforcement."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "A 'damp' community under Alaska's local option law allows people to possess alcohol but bans local retail sales entirely."
      - "Alaska is one of roughly ten states nationwide with an outright statewide happy hour ban, a group that also includes Massachusetts, Oklahoma, and Rhode Island."
      - "Bars in Alaska can still advertise a 'happy hour' for food, as long as alcohol itself is not sold at a special price during it."
      - "Alaska's local option law has been used in over 100 communities since 1981, making it one of the most heavily used local alcohol referendum systems in the country."

