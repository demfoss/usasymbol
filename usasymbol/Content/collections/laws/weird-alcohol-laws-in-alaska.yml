page:
  h1: "Weird Alcohol Laws in Alaska"

  quick_answer:
    - "Since 1981, any Alaska community can hold a local option election to go dry, banning alcohol outright, or damp, allowing limited possession without retail sales. Over 100 communities have voted since then."
    - "Selling alcohol without a license inside a community that has voted dry is a Class C felony in Alaska, carrying up to five years in prison and a $50,000 fine."
    - "Alaska bans happy hour statewide. Bars cannot sell drinks below cost, give away free drinks as a promotion, or run a discount that doesn't last a full calendar week."

