faq:
  - question: "Can an Alaska community ban alcohol entirely?"
    answer: "Yes. Under the 1981 Title 4 local option law, any community can hold a referendum to go dry, banning alcohol outright, or damp, allowing possession without local retail sales. Over 100 communities have voted since the law passed, with close to 70% choosing some restriction."

  - question: "What happens if you sell alcohol in a dry Alaska village?"
    answer: "Selling alcohol without a license in a community that has voted dry is a Class C felony, carrying up to five years in prison and a $50,000 fine. The penalty applies regardless of how small the sale is."

  - question: "Is happy hour illegal in Alaska?"
    answer: "Yes. Alaska Statute 04.16.015 bans selling drinks below cost, giving away free drinks as a promotion, and running any discount that does not last a full week at every open hour. Alaska adopted the ban in the 1980s alongside a handful of other states responding to drunk driving concerns."

  - question: "What is the difference between a dry and a damp community in Alaska?"
    answer: "A dry community bans alcohol outright, making even simple possession illegal in most cases. A damp community allows people to possess alcohol for personal use but still prohibits local retail sales, so residents typically have to bring alcohol in from elsewhere."

