sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Tennessee That Are Real"
    paragraphs:
      - "A law that put a teacher on trial in 1925 anchors the list of Unusual Laws in Tennessee that turn out to be genuinely real, even the ones since repealed."
    highlights:
      - name: "The Butler Act Banned Teaching Evolution"
        status: "Repealed"
        image: "/images/collections/laws/tennessee-butler-act.jpg"
        description: |
          **Law:** Tennessee made it a crime for public school and university teachers to teach that humans descended from a lower order of animals instead of the biblical creation account.

          **Meaning:** Violating it was a misdemeanor punishable by a $100 to $500 fine, enforced against classroom teaching specifically.

          **Reason:** State Representative John Washington Butler pushed the bill after reading newspaper accounts of children questioning the Bible in school. Governor Austin Peay signed it in 1925, and it produced the famous Scopes "Monkey Trial" that same year in Dayton. It stayed law until its repeal in 1967.

      - name: "Fish Can Only Be Caught With a Rod, Line, or Trotline"
        status: "Verified"
        image: "/images/collections/laws/tennessee-fishing-method.jpg"
        description: |
          **Law:** Tennessee law limits legal fish-taking methods to rod and reel, hand-held hook and line, or a trotline with no more than 100 hooks that gets checked daily.

          **Meaning:** Any other capture method, including grabbing fish by hand outside permitted noodling seasons, is expressly forbidden. The law never mentions lassoing, despite how the claim usually gets told online.

          **Reason:** Restricting the tools people can use to catch fish protects breeding populations from being wiped out by unregulated, high-volume methods.

      - name: "Live Skunks Can't Be Owned, Sold, or Brought Into the State"
        status: "Verified"
        image: "/images/collections/laws/tennessee-skunk-ban.jpg"
        description: |
          **Law:** Importing, possessing, selling, or trading a live skunk in Tennessee is a misdemeanor, with exceptions for zoos, research institutions, and licensed wildlife rehabbers.

          **Meaning:** A pet skunk purchased out of state can't legally be brought across the Tennessee line.

          **Reason:** Skunks carry a documented rabies risk, and the ban functions as a straightforward public-health measure rather than an arbitrary animal restriction.

      - name: "Red Fox Pelts Can Only Be Sold in Certain Counties"
        status: "Verified"
        image: "/images/collections/laws/tennessee-fox-pelt.jpg"
        description: |
          **Law:** Buying or selling raw red fox pelts is illegal except in counties within specific population brackets open to legal red fox hunting.

          **Meaning:** A legally trapped fox pelt from one county might be unsellable simply because that county falls outside the population range the law sets.

          **Reason:** The rule ties legal pelt sales directly to counties where red fox hunting is already permitted, closing off a black-market resale path for pelts taken elsewhere.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Tennessee We Couldn't Verify"
    paragraphs:
      - "A cluster of Weird Tennessee Laws Still on the Books claims about small towns keeps circulating with no ordinance number ever cited by anyone repeating them."
    subsections:
      - subtitle: "Frogs can't croak after 11 p.m. in Memphis"
        status: "Not Verified"
        text: |
          **Claim:** Memphis bans frogs from croaking after 11 p.m.

          **Why We Couldn't Verify It:** No Memphis city code section or enforcement case supports this claim. It appears only on generic listicle round-ups with no citation attached.

      - subtitle: "Women in Dyersburg can't call men to ask them on a date"
        status: "Not Verified"
        text: |
          **Claim:** A Dyersburg ordinance bans women from calling men to ask for a date.

          **Why We Couldn't Verify It:** No matching ordinance turns up in Dyersburg's municipal code. The claim shows up only in generic multi-state "weird law" round-ups.

      - subtitle: "Sharing a streaming password is illegal"
        status: "Not Verified"
        text: |
          **Claim:** Sharing your Netflix or streaming password with a friend is a crime in Tennessee.

          **Why We Couldn't Verify It:** Tennessee did tighten unauthorized-access rules aimed at people who resell streaming credentials commercially, but no statute criminalizes ordinary password sharing between friends and family the way the claim suggests.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Tennessee Laws That Are Myths"
    paragraphs:
      - "Every Strange Tennessee Laws myth in this section traces back to either a copy-pasted internet joke or an ordinary statute stretched into something stranger."
    subsections:
      - subtitle: "You can't hunt whales, except from a moving vehicle"
        status: "Myth"
        text: |
          **Myth:** Tennessee bans hunting whales from anywhere except a moving vehicle.

          **Reality:** This exact "except whales" punchline shows up on weird-law lists for dozens of landlocked states, which is the giveaway that it's a copy-pasted joke rather than real statutory text. No landlocked state would need a whale-specific carve-out.

      - subtitle: "Horse theft is still punishable by hanging"
        status: "Myth"
        text: |
          **Myth:** Stealing a horse in Tennessee can still be punished by hanging.

          **Reality:** No current or historical statute prescribes hanging for horse theft. Modern horse theft is prosecuted as ordinary larceny, graded by the animal's value just like any other stolen property.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Tennessee's 90-Day Session Limit Leaves Old Rules Standing"
    paragraphs:
      - "Each two-year Tennessee General Assembly is capped at 90 legislative session days total, split across two annual sessions running roughly January through April or May. With that little floor time, and dozens of home-rule municipalities each maintaining their own local ordinances, repealing a narrowly written statute like the fish-capture-method law almost never rises to the top of the agenda."

