      - "The state's 'Volunteer State' nickname comes from roughly 3,500 Tennesseans answering a War of 1812 recruitment call."
      - "Great Smoky Mountains National Park, on Tennessee's eastern border, is the most-visited national park in the country."
      - "By 1810, Tennessee already had over 14,000 registered distilleries, a whiskey culture that predates both Jack Daniel's and George Dickel."
      - "Tennessee borders eight other states, tied for the most of any state in the country."

