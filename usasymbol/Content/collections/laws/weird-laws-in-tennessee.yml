faq:
  - question: "Was the Butler Act a real Tennessee law?"
    answer: "Yes. It banned teaching evolution in public schools and universities from 1925 until its repeal in 1967, and it's the law behind the famous Scopes 'Monkey Trial' in Dayton."
  - question: "Can you catch fish by hand in Tennessee?"
    answer: "Only within specific noodling regulations. General law limits fish-taking methods to rod and reel, hand-held hook and line, or a checked trotline, and any other method outside a permitted exception is forbidden."
  - question: "Is it illegal to own a skunk in Tennessee?"
    answer: "Yes. Importing, possessing, or selling a live skunk is a misdemeanor, with exceptions only for zoos, research institutions, and licensed wildlife rehabbers."
  - question: "Can you hunt whales in Tennessee if you're in a moving vehicle?"
    answer: "No such law exists. The claim is a recycled internet joke that appears on weird-law lists for many landlocked states, not real Tennessee statutory text."
  - question: "What is the weirdest real law still on the books in Tennessee?"
    answer: "The fish-capture-method statute surprises people most, since a strict rule about rods, lines, and trotlines sounds mundane until you realize it makes hand-fishing outside permitted seasons illegal statewide."
  - question: "Is horse theft still punishable by hanging in Tennessee?"
    answer: "No. This is a myth with no statutory basis. Horse theft is prosecuted today as ordinary larceny, the same as any other stolen property."
