page:
  h1: "Weird Alcohol Laws in New York"

  quick_answer:
    - "New York grocery stores can sell beer and low-alcohol wine products under 6% ABV, but real table wine is reserved for licensed liquor stores under a rule that has outlasted years of repeal efforts."
    - "A New York liquor store can sell wine, cider, and spirits, plus a short list of extras like corkscrews and ice, but state law still keeps mixers off its shelves."
    - "New York's to-go cocktail law, first allowed during the pandemic, has been extended by the legislature rather than made permanent, most recently for another five years in 2024."

