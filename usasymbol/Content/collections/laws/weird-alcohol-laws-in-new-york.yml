faq:
  - question: "Why can't you buy wine at the grocery store in New York?"
    answer: "New York law only lets grocery and drug stores sell wine products under 6% alcohol by volume, alongside beer and cider, under a specific license that caps alcohol at 25% of total inventory. Standard table wine above that threshold is reserved for licensed liquor stores."

  - question: "Can New York liquor stores sell mixers like tonic water?"
    answer: "Not currently. State law lets liquor stores sell wine, cider, spirits, and a short list of extras such as corkscrews and ice, but mixers are not on that approved list, even though several bills to add them have been introduced in recent legislative sessions."

  - question: "Are to-go cocktails still legal in New York?"
    answer: "Yes, but only under a temporary extension. New York first allowed sealed to-go cocktails during the pandemic, let the rule lapse in 2022, then brought it back and extended it again in 2024 for five more years rather than making it permanent."

  - question: "What alcohol can New York grocery stores actually sell?"
    answer: "A licensed grocery or drug store can sell beer, cider, and wine products under 6% ABV, as long as food and drug items still make up more than half the store's inventory. Full-strength wine and spirits stay off grocery shelves entirely."

