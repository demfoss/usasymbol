sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in New York That Are Real"
    paragraphs:
      - "New York's alcohol rules split retailers into narrow lanes, one for grocery stores, one for liquor stores, and neither lane gets to carry everything a customer might want."
    highlights:
      - name: "Grocery Stores Can't Sell Real Wine"
        status: "Verified"
        image: "/images/collections/laws/new-york-grocery-wine-ban.jpg"
        anchor_phrases:
          - "grocery stores can sell beer and low-alcohol wine products under 6% ABV"
        description: |
          **Law:** A grocery or drug store beer and wine product license lets a store sell beer, cider, and wine products under 6% alcohol by volume, but only if food and drug items still make up more than half its inventory and alcohol stays under 25%.

          **Meaning:** The wine coolers and low-proof wine products on a supermarket shelf are legal, but a standard 12% ABV bottle of cabernet is not, no matter how the store is licensed.

          **Reason:** New York's three-tier system after Prohibition steered full-strength wine into dedicated liquor stores, and repeated legislative pushes to let grocery chains sell it outright have stalled for years against liquor-store industry opposition.
      - name: "Liquor Stores Can Sell a Corkscrew, Not a Mixer"
        status: "Verified"
        image: "/images/collections/laws/new-york-liquor-store-product-limits.jpg"
        anchor_phrases:
          - "state law still keeps mixers off its shelves"
        description: |
          **Law:** New York liquor stores can sell wine, wine products, cider, and liquor, along with a narrow list of extras such as corkscrews, ice, and unflavored still water, but current law does not let them stock mixers.

          **Meaning:** A shopper buying vodka can pick up ice on the way to the register but has to find tonic water or club soda somewhere else.

          **Reason:** New York's liquor code has historically restricted what a package store can carry beyond alcohol itself, and while a 2023 law opened the door to gift and promotional items, lawmakers are still weighing separate bills to add mixers and glassware to the approved list.
      - name: "To-Go Cocktails Keep Getting Renewed, Not Made Permanent"
        status: "Verified"
        image: "/images/collections/laws/new-york-to-go-cocktails-law.jpg"
        anchor_phrases:
          - "extended by the legislature rather than made permanent"
        description: |
          **Law:** New York allows bars and restaurants to sell sealed to-go cocktails alongside a substantial food order, a rule the legislature has renewed rather than written into law permanently, most recently through a five-year extension enacted in 2024.

          **Meaning:** The option to grab a sealed margarita with takeout dinner depends on a law that has an expiration date built in, not a settled rule.

          **Reason:** Lawmakers first allowed to-go alcohol as a pandemic relief measure for struggling restaurants, and the repeated extensions reflect an unresolved fight in Albany over whether the change should become a fixture of state law or fade out once the current extension lapses.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New York Keeps Wine Out of the Supermarket"
    paragraphs:
      - "New York's grocery-wine ban survives because it sits at the center of a long-running fight between two well-organized industries. Grocery chains have pushed for decades to add full-strength wine to their shelves, while the state's licensed liquor stores have lobbied just as hard to keep that business for themselves."
      - "Every attempt to change the law runs into the same math: thousands of small liquor stores exist because the current system guarantees them a category of sales that grocery chains cannot touch. Until that political balance shifts, the 6% ABV line stays exactly where it is, and shoppers keep splitting one purchase across two different kinds of stores."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New York's grocery beer and wine license requires alcohol to stay under 25% of total store inventory, even for stores that qualify to sell it at all."
      - "Liquor store hours for off-premises sales generally run 9 a.m. to midnight Monday through Saturday, with Sunday liquor and wine sales limited to noon through 9 p.m."
      - "Beer can be sold earlier than liquor and wine at many grocery stores and delis, often starting around 8 a.m."
      - "New York's to-go cocktail rule requires the drink to be sealed with a secure lid and sold alongside a substantial food order to stay within open-container law."

