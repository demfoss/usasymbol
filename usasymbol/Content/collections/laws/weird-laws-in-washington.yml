  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Washington Laws That Are Myths"
    paragraphs:
      - "One Strange Washington Laws claim about hugging while driving gets exaggerated into something broader than the actual statute covers."
    subsections:
      - subtitle: "Any physical contact between a driver and passenger is illegal"
        status: "Myth"
        text: |
          **Myth:** Washington bans any hugging or physical affection at all while driving.

          **Reality:** The real statute only applies when an embrace actually prevents free control of the vehicle. Holding hands or a quick side-hug at a stoplight isn't what the law targets, even though the claim is often repeated as a blanket ban on all contact.

      - subtitle: "Bigfoot hunting is illegal statewide"
        status: "Myth"
        text: |
          **Myth:** Washington has a statewide law protecting Bigfoot from hunters.

          **Reality:** The real protection is local, limited to ordinances in Skamania and Whatcom counties, not a statewide statute. Outside those two counties, no equivalent protection exists.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Washington's County-by-County Ordinances Rarely Get Cleaned Up"
    paragraphs:
      - "Washington has 39 counties, each with authority to pass its own local ordinances independent of the state legislature, which is exactly how a Bigfoot protection law can exist in Skamania and Whatcom counties but nowhere else in the state. With no statewide office responsible for reviewing every county's ordinance book, a novelty rule like the Bigfoot protection law simply stays in place because repealing it was never anyone's priority, and by now it's a genuine local landmark rather than an oversight."

