faq:
  - question: "Is Bigfoot actually protected by law in Washington?"
    answer: "Yes, locally. Skamania County passed a real ordinance in 1969 protecting Bigfoot from harm, downgraded to a misdemeanor in 1984, and Whatcom County adopted a similar rule in 1992. It's not a statewide law."
  - question: "Is it illegal to hug someone while driving in Washington?"
    answer: "Only if the embrace prevents you from freely controlling the vehicle. State law treats a violation as evidence of reckless driving, not a ban on all physical contact."
  - question: "Can shoe stores still use X-ray machines to fit shoes in Washington?"
    answer: "No. State law bans using X-ray or fluoroscopic devices to fit shoes or view foot bones, limiting that kind of equipment to licensed medical professionals."
  - question: "Is it illegal to harm a racing pigeon in Washington?"
    answer: "Yes, if the pigeon is tagged as a racing or carrier pigeon. Injuring, trapping, or killing one is a civil infraction under state law."
  - question: "Is Bigfoot hunting illegal everywhere in Washington?"
    answer: "No. The real protection only applies in Skamania and Whatcom counties. No statewide law addresses Bigfoot."
  - question: "What is the weirdest real law still on the books in Washington?"
    answer: "The Skamania County Bigfoot ordinance stands out most, since it's a genuine, still-active local law protecting a creature that has never been scientifically confirmed to exist."
