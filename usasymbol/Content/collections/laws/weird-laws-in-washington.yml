    title: "Unusual Laws in Washington That Are Real"
    paragraphs:
      - "Skamania County has protected Bigfoot by ordinance since 1969, and that's just one of several Unusual Laws in Washington that check out against the actual code."
    highlights:
      - name: "Bigfoot Is Legally Protected in Skamania County"
        status: "Verified"
        image: "/images/collections/laws/washington-bigfoot-ordinance.jpg"
        description: |
          **Law:** Skamania County passed an ordinance in 1969 making it illegal to harm Sasquatch, updated in 1984 to a misdemeanor carrying up to a year in jail or a $1,000 fine. Whatcom County adopted a similar rule in 1992.

          **Meaning:** The ordinance is real and remains on the books, even though the animal it protects has never been scientifically confirmed to exist.

          **Reason:** County officials passed it partly to discourage armed "hunting parties" that had started showing up in the area chasing Bigfoot sightings, treating public safety as the real motivation behind a law aimed at a legendary creature.

      - name: "You Can't Embrace Someone While Driving"
        status: "Verified"
        image: "/images/collections/laws/washington-embracing-driving.jpg"
        description: |
          **Law:** Operating a vehicle while embracing another person in a way that prevents free and unhampered control of the car is unlawful, and counts as evidence of reckless driving.

          **Meaning:** The law doesn't ban all physical contact between a driver and passenger, only an embrace that interferes with actually operating the vehicle.

          **Reason:** It's a distracted-driving statute framed around a specific, once-common scenario, giving officers a clear standard tied to control of the vehicle rather than a vague general distraction rule.

      - name: "Shoe Stores Can't Use X-Ray Machines to Fit Shoes"
        status: "Verified"
        image: "/images/collections/laws/washington-shoe-xray-ban.jpg"
        description: |
          **Law:** Operating an X-ray or fluoroscopic device to fit shoes or view foot bones is banned for anyone other than licensed medical professionals.

          **Meaning:** The novelty shoe-fitting fluoroscopes once common in shoe stores are flatly illegal today, not just discouraged.

          **Reason:** These machines exposed customers and shoe salespeople to unnecessary radiation for decades before their health risks were understood, and the ban closed off the practice for good.

      - name: "Tagged Racing Pigeons Are Legally Protected"
        status: "Verified"
        image: "/images/collections/laws/washington-pigeon-law.jpg"
        description: |
          **Law:** Injuring, trapping, or killing a tagged racing or carrier pigeon is a civil infraction.

          **Meaning:** The bird has to be identifiably tagged as a racing or carrier pigeon for the protection to apply, not just any wild pigeon.

          **Reason:** Racing pigeons represent real financial and competitive investment for their owners, and the law treats interfering with a tagged bird as damaging someone else's property.

