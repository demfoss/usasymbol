sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Missouri That Are Real"
    paragraphs:
      - "Missouri once taxed bachelors a dollar a year, and that's just the start of the Unusual Laws in Missouri that check out against the actual code and historical record."
    highlights:
      - name: "Bear Wrestling Is a Class A Misdemeanor"
        status: "Verified"
        image: "/images/collections/laws/missouri-bear-wrestling.jpg"
        description: |
          **Law:** Missouri bans promoting, staging, training a bear for, or personally engaging in bear wrestling for entertainment, wagering, or gain.

          **Meaning:** It's not just the physical match that's banned. Collecting admission fees or training a bear for a future match both count as violations too.

          **Reason:** Traveling bear-wrestling shows once drew paying crowds at fairs across the country, and Missouri passed a direct 1996 ban rather than relying only on general animal cruelty law.

      - name: "Car Dealers Can't Sell Vehicles on Sundays"
        status: "Verified"
        image: "/images/collections/laws/missouri-sunday-car-sales.jpg"
        description: |
          **Law:** Licensed dealers, distributors, and manufacturers cannot buy, sell, or trade motor vehicles on Sundays, with exceptions for motorcycles, RVs, and powersports vehicles.

          **Meaning:** A dealership lot can stay open for service and parts on Sunday, just not for closing a new or used car sale.

          **Reason:** It's a classic Sunday "blue law" that survived while many of its companion restrictions faded, kept in place partly because dealer associations have historically supported it as a guaranteed day off.

      - name: "Keeping a Dangerous Wild Animal Requires Registration"
        status: "Verified"
        image: "/images/collections/laws/missouri-wild-animal-registration.jpg"
        description: |
          **Law:** Keeping a dangerous wild animal, including a bear, without registering it with local law enforcement is a criminal offense.

          **Meaning:** This is the real law behind the popular claim about bears in Missouri. It regulates ownership and registration broadly, not specifically how one gets transported in a car.

          **Reason:** Unregistered dangerous animals create a genuine public-safety gap for first responders who might not know a private residence houses one, so the law closes that gap with a registration requirement.

      - name: "Bachelors Once Paid an Annual Tax"
        status: "Repealed"
        image: "/images/collections/laws/missouri-bachelor-tax.jpg"
        description: |
          **Law:** Missouri required unmarried white men between 21 and 50 to pay a $1 annual tax, starting in December 1820.

          **Meaning:** The tax was only ever actually collected for the single year of 1821 before lawmakers scrapped it.

          **Reason:** It was an early social-engineering attempt to encourage marriage and family formation in the young state. The General Assembly repealed it in January 1822 and replaced it with a flat poll tax on all men instead.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Missouri We Couldn't Verify"
    paragraphs:
      - "A cluster of Weird Missouri Laws Still on the Books claims about specific towns keeps circulating with no confirmed ordinance behind most of them."
    subsections:
      - subtitle: "University City limits front-yard sales to two days a year"
        status: "Not Verified"
        text: |
          **Claim:** A University City ordinance restricts front-yard household sales to two days annually.

          **Why We Couldn't Verify It:** A specific ordinance number is cited in some sources, but the current municipal code section could not be independently confirmed in the time available. Treat this as plausible but unconfirmed.

      - subtitle: "Only the vehicle owner can honk a car's horn in University City"
        status: "Not Verified"
        text: |
          **Claim:** University City bans anyone other than a car's owner from honking its horn.

          **Why We Couldn't Verify It:** No confirmed municipal code section matching this claim was located. It appears only on listicle sites without an ordinance citation.

      - subtitle: "Milkmen aren't allowed to run while delivering milk"
        status: "Not Verified"
        text: |
          **Claim:** A Missouri law bans milkmen from running while making deliveries.

          **Why We Couldn't Verify It:** No statute or municipal ordinance addressing milk-delivery speed has been located. Missouri's real dairy statutes focus on pasteurization and grading, not delivery method.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Missouri Laws That Are Myths"
    paragraphs:
      - "Two Strange Missouri Laws claims turn out to be exaggerations of real statutes or recycled jokes shared with several other states."
    subsections:
      - subtitle: "You can't drive with an uncaged bear in the car"
        status: "Myth"
        text: |
          **Myth:** Missouri specifically bans driving with an uncaged bear in your vehicle.

          **Reality:** The real law requires registering any dangerous wild animal you keep, including a bear, with local law enforcement. Nothing in the statute specifically addresses caging requirements for car travel, making the driving-specific version an embellishment.

      - subtitle: "An on-duty firefighter can't rescue a woman in a nightgown"
        status: "Myth"
        text: |
          **Myth:** St. Louis firefighters are legally barred from rescuing a woman wearing a nightgown.

          **Reality:** No ordinance or statute matching this claim has ever been located. This exact story pattern shows up attached to different cities across several states, a strong sign it's a recycled joke rather than a real rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Missouri's Hard May 30 Deadline Leaves Old Statutes Standing"
    paragraphs:
      - "Missouri's Constitution forces the General Assembly to adjourn its regular session by 6 p.m. on May 30 every year, with no bill consideration allowed after 6 p.m. on the first Friday following the second Monday in May. That hard stop leaves roughly five months a year for lawmakers to push through current priorities, which is why a niche statute like the bear wrestling ban rarely gets revisited even decades after it was written."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Missouri's bachelor tax lasted barely a year in practice before being replaced by a flat poll tax on all men in 1822."
      - "The bear wrestling statute also criminalizes exposing a bear to surgery in anticipation of a match, not just the fight itself."
      - "Missouri's Sunday car sales ban carves out an exception for motorcycles, recreational vehicles, and powersports dealers."
      - "Missouri's regular legislative session runs from January to a hard May 30 deadline every single year, with no built-in extensions."
      - "The dangerous wild animal law covers more than bears, requiring registration for a broad list of exotic and potentially dangerous species kept privately."

