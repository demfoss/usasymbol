faq:
  - question: "Is bear wrestling actually illegal in Missouri?"
    answer: "Yes. Promoting, staging, training a bear for, or participating in bear wrestling is a class A misdemeanor under a 1996 law."
  - question: "Can you buy a car on a Sunday in Missouri?"
    answer: "Not from a licensed dealer. State law bans selling motor vehicles on Sundays, though exceptions exist for motorcycles, RVs, and powersports vehicles."
  - question: "Did Missouri really tax bachelors?"
    answer: "Yes, briefly. Unmarried men between 21 and 50 paid a $1 annual tax starting in 1821, but the General Assembly repealed it just one year later in 1822."
  - question: "Do you need a permit to own a bear in Missouri?"
    answer: "Yes. Keeping a dangerous wild animal, including a bear, without registering it with local law enforcement is a criminal offense under state law."
  - question: "Is it illegal to drive with an uncaged bear in Missouri?"
    answer: "Not as a standalone driving law. The real statute requires registering dangerous wild animals you keep, but it doesn't specifically address car travel or caging in transit."
  - question: "What is the weirdest real law still on the books in Missouri?"
    answer: "The bear wrestling ban surprises people most, since it reads like satire but is a genuine, currently enforceable class A misdemeanor."
