faq:
  - question: "Is bear wrestling illegal in Oklahoma?"
    answer: "Yes. Promoting, participating in, or working at a bear wrestling exhibition is illegal, punishable by up to a year in jail or a $2,000 fine, the same penalty that applies to horse tripping."
  - question: "When did tattoos become legal in Oklahoma?"
    answer: "In 2006. Oklahoma banned tattooing statewide starting in 1963 and was the last state in the country to legalize it, more than four decades later."
  - question: "Is swearing illegal in Oklahoma?"
    answer: "Technically yes, but the penalty is just $1 per offense, a fine that has stayed unchanged since the law was codified in 1910."
  - question: "Was the nine-foot bedsheet law in Oklahoma real?"
    answer: "Yes. An 1908 law required hotel bed sheets to be nine feet long, tied to a tall Oklahoma politician's frustration with short sheets. It stayed in effect until 1956."
  - question: "Is it actually illegal to hunt whales in Oklahoma?"
    answer: "Not as a standalone whale law. Oklahoma bans hunting threatened species generally, and most whales qualify, which is where this claim comes from."
  - question: "What is the weirdest real law still on the books in Oklahoma?"
    answer: "The $1 profanity fine surprises people most, since it's a genuinely enforceable statute that has simply never kept pace with inflation since 1910."
