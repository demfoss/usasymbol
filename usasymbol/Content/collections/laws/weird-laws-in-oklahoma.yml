sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Oklahoma That Are Real"
    paragraphs:
      - "Oklahoma banned tattooing for over 40 years, longer than any other state, and that's just one of several Unusual Laws in Oklahoma that hold up against the actual code and its history."
    highlights:
      - name: "Bear Wrestling and Horse Tripping Are Banned Together"
        status: "Verified"
        image: "/images/collections/laws/oklahoma-bear-wrestling.jpg"
        description: |
          **Law:** Promoting, participating in, or working at a bear wrestling exhibition or a horse tripping event is illegal, punishable by up to a year in jail or a $2,000 fine.

          **Meaning:** Both events are banned under one statute rather than two separate laws, treating them as the same category of staged-animal-abuse entertainment.

          **Reason:** Both activities were once genuine traveling entertainment attractions at fairs, and lawmakers wrote a direct combined ban rather than relying on general cruelty statutes.

      - name: "Profane Swearing Costs Exactly One Dollar"
        status: "Verified"
        image: "/images/collections/laws/oklahoma-profane-swearing.jpg"
        description: |
          **Law:** Anyone found guilty of profane swearing is fined $1 for each offense.

          **Meaning:** The fine has stayed literally unchanged since the law was first codified in 1910, making it more symbolic than punitive today.

          **Reason:** It's a leftover public-conduct statute from an era when regulating public language was considered a routine part of the criminal code, never repealed even as its penalty became meaningless with inflation.

      - name: "Tattooing Was Banned Until 2006"
        status: "Repealed"
        image: "/images/collections/laws/oklahoma-tattoo-ban.jpg"
        description: |
          **Law:** Oklahoma banned tattooing statewide starting in 1963, officially over concerns about rising hepatitis cases from unregulated tattoo parlors.

          **Meaning:** Oklahoma was the last state in the country to allow tattooing, holding out more than four decades after most states had already legalized and regulated the practice.

          **Reason:** Governor Brad Henry signed a repeal in May 2006, replacing the outright ban with health and safety regulation through the state health department instead of a blanket prohibition.

      - name: "Hotel Bedsheets Once Had to Be Nine Feet Long"
        status: "Repealed"
        image: "/images/collections/laws/oklahoma-nine-foot-sheet.jpg"
        description: |
          **Law:** An early Oklahoma law, passed shortly after statehood in 1908, required hotel bed sheets to be nine feet long, with three extra feet to fully cover the head and feet.

          **Meaning:** A hotel using standard, shorter sheets was technically breaking state law for decades.

          **Reason:** The rule is tied to legendary lawmaker "Alfalfa Bill" Murray, a notably tall man reportedly fed up with short hotel sheets. It stayed in effect until after his death in 1956.

