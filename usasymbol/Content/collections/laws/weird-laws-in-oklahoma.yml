      - "The nine-foot hotel sheet law is tied to a real, tall Oklahoma politician named William 'Alfalfa Bill' Murray, who later became governor."
      - "Oklahoma legalized tattooing through Senate Bill 806, signed in May 2006 and effective that November."
      - "The bear wrestling and horse tripping ban carries the same maximum penalty for both offenses: up to a year in jail or a $2,000 fine."
      - "Oklahoma's 90-day session limit was approved by voters in a 1966 constitutional amendment, replacing an older, less structured session calendar."

