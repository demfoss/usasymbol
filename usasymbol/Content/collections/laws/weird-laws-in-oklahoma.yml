  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Oklahoma Laws That Are Myths"
    paragraphs:
      - "One Strange Oklahoma Laws claim about whales turns out to be a real law wearing a much funnier disguise."
    subsections:
      - subtitle: "It's illegal to hunt whales in landlocked Oklahoma"
        status: "Myth"
        text: |
          **Myth:** Oklahoma has a standalone law specifically banning whale hunting.

          **Reality:** No statute mentions whales by name. The rule people are pointing to is a general ban on hunting or killing threatened species, and since most whales qualify as threatened, hunting one technically violates that broader wildlife law, not some whale-specific statute.

      - subtitle: "Making an ugly face at a dog is illegal"
        status: "Myth"
        text: |
          **Myth:** Oklahoma bans making ugly faces at dogs.

          **Reality:** No statute anywhere addresses facial expressions directed at animals. This is a pure internet joke with no ordinance behind it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Oklahoma's 90-Day Session Leaves Old Statutes Alone"
    paragraphs:
      - "Oklahoma's Legislature is constitutionally limited to a 90-business-day session running from the first Monday in February through the last Friday in May, a rule voters put in place in 1966. With that narrow window consumed almost entirely by current-year priorities, a symbolic $1 profanity fine or a decades-old bear wrestling statute rarely becomes urgent enough to spend floor time repealing, even when everyone agrees it's outdated."

