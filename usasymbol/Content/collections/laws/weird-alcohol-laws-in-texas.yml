sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Texas That Are Real"
    paragraphs:
      - "Texas built its alcohol map one county election at a time starting in 1876, and pieces of that patchwork still shape where and when a drink is legal today."
    highlights:
      - name: "Dry Counties Trace to an 1876 Local-Option Vote"
        status: "Verified"
        image: "/images/collections/laws/texas-dry-counties-local-option.jpg"
        anchor_phrases:
          - "local option"
          - "1876"
        description: |
          **Law:** The Texas Constitution of 1876 created local-option elections, letting individual counties vote to allow or ban alcohol sales within their borders.

          **Meaning:** Jasper County held the state's first local-option election on December 18, 1876, and went dry. Nine days later, Lamar County voted wet. That same county-by-county pattern still produces a small number of fully dry counties in Texas today.

          **Reason:** By 1918, before national Prohibition even took effect, 201 of Texas's 254 counties were already completely dry, a legacy the state never fully reversed after repeal in 1935.
      - name: "Liquor Stores Close on Sundays, but Grocery Stores Don't"
        status: "Verified"
        image: "/images/collections/laws/texas-sunday-sales-hours.jpg"
        anchor_phrases:
          - "10 a.m."
          - "Sundays"
        description: |
          **Law:** House Bill 1518, effective September 1, 2021, lets grocery and convenience stores sell beer and wine starting at 10 a.m. on Sundays instead of noon.

          **Meaning:** A shopper can buy beer or wine at 10 a.m. on a Sunday, but package stores selling liquor remain closed that entire day.

          **Reason:** The 2021 change loosened the state's blue-law hours for beer and wine specifically, without touching the separate rule that keeps liquor stores shut on Sundays.
      - name: "Texas A&M Bans Alcohol at University-Sponsored Tailgates"
        status: "Verified"
        image: "/images/collections/laws/texas-am-tailgate-alcohol-ban.jpg"
        anchor_phrases:
          - "Texas A&M"
          - "university-sponsored"
        description: |
          **Law:** Texas A&M's student rules prohibit possessing, using, or distributing alcohol at any event the university sponsors or authorizes, including organization-run tailgates, except where university regulations expressly allow it.

          **Meaning:** A student organization hosting a game-day tailgate under the university's name has to follow the same alcohol restrictions as any other campus-sponsored event.

          **Reason:** The rule applies regardless of the age of those present and layers on top of, rather than replaces, ordinary state and local alcohol law.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Weird Texas Alcohol Laws That Are Myths"
    paragraphs:
      - "A few Texas alcohol claims circulate constantly online despite the Texas Alcoholic Beverage Commission confirming they were never real law."
    subsections:
      - subtitle: "The Three Sips of Beer Law"
        status: "Myth"
        anchor_phrases:
          - "three sips"
        text: |
          **Myth:** It's illegal in Texas to take more than three sips of beer while standing up.

          **Reality:** The Texas Alcoholic Beverage Commission has stated there is not, and never has been, a three-sips law in Texas. No statute matching the claim exists.
      - subtitle: "The Banned Encyclopedia Britannica"
        status: "Myth"
        anchor_phrases:
          - "Encyclopedia Britannica"
        text: |
          **Myth:** Owning an Encyclopedia Britannica set is illegal in Texas because one volume contains a beer recipe.

          **Reality:** This is an urban legend with no basis in Texas law. No statute has ever restricted ownership of the encyclopedia or any reference book for containing a homebrewing recipe.

  - id: why-the-county-map-persists
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Texas Still Has Dry Counties"
    paragraphs:
      - "Statewide prohibition arrived in Texas through a 1919 constitutional amendment, ratified before national Prohibition even began, but the state reversed course faster than many of its counties did. When Texas voters repealed the state dry law in 1935, the prohibition question reverted to the local level rather than disappearing, restoring the same local-option elections the 1876 constitution had first authorized."
      - "That reversal is the reason a Texas county can still go completely dry today: nothing in state law requires a county to hold a wet vote once alcohol becomes legal again statewide. A county that never scheduled a new local-option election simply stayed dry by default, carrying its Prohibition-era status forward into the present."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Jasper County's December 18, 1876, local-option election was the first in Texas history, and the county chose to go dry."
      - "Texas ratified the Eighteenth Amendment for national Prohibition in February 1918, a year before the amendment took effect nationwide."
      - "Texas voters approved repealing the state's own prohibition amendment in 1935, two years after the federal Twenty-first Amendment ended national Prohibition."
      - "House Bill 1518's Sunday sales change applies only to beer and wine; Texas package stores still cannot sell liquor on Sundays at all."

