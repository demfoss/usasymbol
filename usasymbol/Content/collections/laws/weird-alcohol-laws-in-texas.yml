faq:
  - question: "Does Texas still have dry counties?"
    answer: "Yes. A small number of Texas counties remain completely dry today, a direct result of the local-option election system the 1876 state constitution created. Counties that never held a new wet vote after Texas repealed statewide prohibition in 1935 simply stayed dry."

  - question: "Can you buy liquor on Sunday in Texas?"
    answer: "No. Package stores selling liquor stay closed on Sundays statewide. Beer and wine are different: House Bill 1518, effective September 1, 2021, lets grocery and convenience stores sell those starting at 10 a.m. on Sundays."

  - question: "Is the Texas three-sips beer law real?"
    answer: "No. The Texas Alcoholic Beverage Commission has confirmed there is no law, and never has been one, limiting beer drinking to three sips while standing. It is a widely repeated myth with no statute behind it."

  - question: "Does Texas A&M allow alcohol at tailgates?"
    answer: "Only under specific university authorization. Texas A&M's student rules ban alcohol at any university-sponsored or -authorized event, including organization-run tailgates, unless university regulations expressly permit it, regardless of the attendees' ages."

