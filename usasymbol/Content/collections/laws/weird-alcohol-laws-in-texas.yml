page:
  h1: "Weird Alcohol Laws in Texas"

  quick_answer:
    - "Texas still has fully dry counties, a direct result of a local-option system the 1876 constitution created, letting each county vote alcohol in or out."
    - "Liquor stores in Texas stay closed on Sundays even though beer and wine sales are legal starting at 10 a.m., a rule set by a 2021 law."
    - "The famous 'three sips of beer' law, claiming it's illegal to drink more than three sips while standing, has no basis in Texas law according to the Texas Alcoholic Beverage Commission."

