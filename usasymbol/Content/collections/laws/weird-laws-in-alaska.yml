sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Alaska That Are Real"
    paragraphs:
      - "Many Unusual Laws in Alaska make more sense once you remember how remote much of the state is. Bush planes, dry villages, and subsistence rules create legal situations that barely exist anywhere else in the country."
    highlights:
      - name: "No Same-Day Hunting After Flying"
        status: "Verified"
        image: "/images/collections/laws/alaska-bush-plane-kobuk-dunes.webp"
        anchor_phrases:
          - "same-day airborne hunting ban"
        description: |
          **Law:** Alaska bans hunting on the same day you were airborne in an aircraft.

          **Meaning:** The rule stops hunters from spotting game from the air, landing nearby, and immediately taking advantage of that aerial access.

          **Reason:** In a state where bush planes often replace roads, lawmakers ended up writing a very Alaska-specific fair-chase rule.
      - name: "Entire Villages Can Vote Out Alcohol"
        status: "Verified"
        image: "/images/collections/laws/alaska-dry-village-alcohol.jpg"
        anchor_phrases:
          - "local-option alcohol system"
        description: |
          **Law:** More than 100 Alaska communities have voted under the state's local-option system to restrict or ban alcohol.

          **Meaning:** In the strictest dry villages, carrying in alcohol can be a crime even though the same beer is legal in Anchorage.

          **Reason:** Isolated communities wanted local control over alcohol-related harm that hit them much harder than Alaska's larger cities.
      - name: "Rural Residents Get First Access to Fish and Game"
        status: "Verified"
        image: "/images/collections/laws/alaska-subsistence-fish-camp.webp"
        anchor_phrases:
          - "subsistence priority for fish and game"
        description: |
          **Law:** When fish or game runs short, Alaska's subsistence priority can give rural and Alaska Native users first access ahead of sport and commercial users.

          **Meaning:** The rule treats hunting and fishing as part of food supply in many places, not just recreation.

          **Reason:** This matters most in villages where household freezers depend on a successful season.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Alaska We Couldn't Verify"
    paragraphs:
      - "Some Weird Laws in Alaska claims sound plausible because moose, bears, and bush planes are part of everyday life there. But these stories keep circulating without any actual ordinance, statute, or date of passage attached to them."
    subsections:
      - subtitle: "It's Illegal to Give Alcohol to a Moose"
        status: "Not Verified"
        anchor_phrases:
          - "giving alcohol to a moose"
        text: |
          **Claim:** It's illegal to give alcohol to a moose.

          **Why We Couldn't Verify It:** This claim is often tied to Fairbanks, but no matching rule has been found in the Fairbanks North Star Borough code. Alaska does have real wildlife and public-safety rules, which is why the story sounds believable, but none of them specifically creates a moose-and-alcohol law.
      - subtitle: "Moose Are Banned From the Sidewalks of Anchorage"
        status: "Not Verified"
        anchor_phrases:
          - "moose on sidewalks"
        text: |
          **Claim:** Moose are banned from the sidewalks of Anchorage.

          **Why We Couldn't Verify It:** Anchorage really does publish guidance about living around moose, which is why this joke sounds plausible. But no ordinance specifically banning moose from sidewalks appears in the Anchorage code, and the punchline has outlived any real source.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Alaska Laws That Are Myths"
    paragraphs:
      - "Some Strange Alaska Laws claims are not just unverified. They read more like exaggerations of real Alaska life than actual laws lawmakers ever wrote down."
    subsections:
      - subtitle: "Pushing a Moose Out of a Moving Airplane Is Illegal"
        status: "Myth"
        text: |
          **Myth:** Pushing a moose out of a moving airplane is illegal.

          **Reality:** No Alaska statute says anything like this. The joke only works because Alaska really does have unusual aircraft and hunting rules, so a parody version can pass as real if nobody checks the wording.
      - subtitle: "Waking a Sleeping Bear for a Photo Is Illegal"
        status: "Myth"
        anchor_phrases:
          - "sleeping-bear photo bans"
        text: |
          **Myth:** Waking a sleeping bear for a photo is illegal.

          **Reality:** Alaska does have real wildlife-harassment rules, so the setup feels believable. But no statute says it this way, which is why this reads more like a tourist-state campfire story built on top of real bear rules.
      - subtitle: "Carrying a Concealed Slingshot Requires a Permit"
        status: "Myth"
        text: |
          **Myth:** Carrying a concealed slingshot requires a permit.

          **Reality:** Alaska has allowed permitless concealed carry of firearms since 2003. No slingshot-specific permit rule exists there, so this looks more like imported confusion from another state's laws than anything Alaska ever wrote.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Alaska's Real Laws Are Stranger Than Its Myths"
    paragraphs:
      - "Alaska's genuinely unusual laws exist because ordinary state rules do not fit a state this large and this remote. Bush planes replace roads for many communities, so the airborne hunting ban had to close a loophole that barely exists anywhere with a normal highway network. Letting villages vote on their own alcohol rules solves a problem no other state has at this scale."
      - "The animal myths spread for the same reason they sound believable. Anchorage logs hundreds of moose encounters with residents every year, so a made-up rule about moose on sidewalks or feeding a moose alcohol feels plausible to anyone who has never checked the code. In Alaska, the real laws and the fake ones both sound dramatic because daily life really does involve bears, moose, and bush planes."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Alaska's local-option system has multiple tiers, not just on-or-off — some communities vote to ban only the sale of alcohol while others ban possession outright."
      - "Congress created a separate federal subsistence priority for rural Alaskans on federal land in 1980, a different rule from the state's own subsistence law, which is part of why the two can disagree on the same river."
      - "A same-day airborne hunting violation can cost a hunter the aircraft used in the hunt, not just the hunting license."
      - "Anchorage logs hundreds of moose-related incidents with residents every year, which is part of why exaggerated moose laws feel believable even though none of them are real."

