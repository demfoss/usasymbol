faq:
  - question: "Is it really illegal to have alcohol in Alaska?"
    answer: "In most of Alaska, no. But in communities that have voted 'dry' under Alaska Statute § 04.11.491, possession of alcohol is a criminal offense within the community's borders. Over 100 Alaska communities have voted dry or damp. Importing alcohol into a dry village — including carrying it on a supply flight — is a separate crime and can be charged as a felony for larger quantities."

  - question: "Is the airborne hunting ban a real Alaska law?"
    answer: "Yes. Alaska Statute § 16.05.783 makes it a class A misdemeanor to hunt or shoot at game on the same day you were airborne in an aircraft. The prohibition applies to both pilots and passengers. It was enacted because Alaska's geography — unlike any other state — makes same-day aerial scouting a practical hunting strategy: a pilot could spot game from the air and hunt it the same afternoon."

  - question: "Is it illegal to give alcohol to a moose in Alaska?"
    answer: "No specific Alaska statute says so. Alaska's animal cruelty law (AS § 11.61.140) covers inflicting pain or suffering on animals, which could apply in some circumstances, but there is no moose-specific or alcohol-specific provision in the state code. Fairbanks has had documented incidents of moose eating fermented fruit — which may be where the claim originates — but no ordinance has been located."
