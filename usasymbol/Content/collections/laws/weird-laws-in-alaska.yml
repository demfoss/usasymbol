faq:
  - question: "What are some weird laws in Alaska?"
    answer: "Three of the most verifiable: a ban on hunting any animal the same day you flew in an aircraft, a local-option system that lets more than 100 rural communities ban alcohol entirely, and a subsistence priority rule giving rural residents first access to fish and game when stocks run short. Many famous claims, like moose on sidewalks or sleeping-bear selfie bans, can't be confirmed in any Alaska statute."

  - question: "Are Alaska's weird laws real?"
    answer: "Some are. The same-day airborne hunting ban and the local-option dry-community alcohol rule are current, verified state laws with real enforcement and real penalties. Many of the most-shared claims, like moose banned from sidewalks or giving alcohol to a moose, couldn't be confirmed in any Alaska statute or municipal code after checking official sources."

  - question: "What is the weirdest law in Alaska?"
    answer: "The strongest verified candidate is the local-option alcohol system. In more than 100 Alaska communities that have voted to go dry, carrying one alcoholic drink off a bush plane is a criminal misdemeanor. No other state gives individual communities that much legal authority over a substance that's fully legal everywhere else in the same state."

  - question: "Is it illegal to feed alcohol to a moose in Alaska?"
    answer: "No confirmed statute or ordinance covers this specific claim. It's often attributed to a Fairbanks rule, but no matching provision exists in the Fairbanks North Star Borough code. Alaska's general wildlife feeding rules don't name moose or alcohol specifically."

