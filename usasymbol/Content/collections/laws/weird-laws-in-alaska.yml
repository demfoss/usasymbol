seo:
  title: "Weird Laws in Alaska: Dry Villages, the Airborne Hunting Ban, and the Moose Myths"
  description: "In over 100 Alaska communities, possessing alcohol is a criminal offense — local option voting made it so. The airborne same-day hunting ban is real and Alaska-specific. The moose-alcohol claim has no confirmed statute."

hero_image: "/images/collections/laws/alaska-state-capitol.webp"
hero_image_alt: "Alaska State Capitol building in Juneau"
hero_image_caption: "The Alaska State Capitol in Juneau. Two of Alaska's most unusual laws exist because of the state's geography: vast distances, remote indigenous communities, and wildlife that routinely enters city limits."

page:
  h1: "Weird Laws in Alaska: Dry Villages Are Real, Most Moose Claims Are Not"

  quick_answer:
    - "Alaska's most unusual laws are geographic, not quirky. Under the local option system (Alaska Statute § 04.11.491), over 100 communities have voted to prohibit alcohol — possession is a crime, and flying a bottle of wine into a dry village is a felony. The same-day airborne hunting ban (AS § 16.05.783) makes it illegal to hunt game the same day you scouted it from an aircraft."
    - "Both laws exist because Alaska is larger than Texas, California, and Montana combined. The alcohol law reflects the voting decisions of remote indigenous communities. The airborne hunting ban exists because the state is large enough that pilots were spotting game from the air and hunting it an hour later."
    - "The moose-centric claims — giving alcohol to a moose, waking a sleeping bear for a photo — have no confirmed specific statute. They are either misrepresentations of Alaska's general wildlife harassment prohibition or unverified internet items."

