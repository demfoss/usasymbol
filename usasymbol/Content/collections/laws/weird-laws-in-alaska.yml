sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    title: "Two Alaska Laws That Are Real — and Why They Exist"
    subsections:
      - subtitle: "Dry Villages — Possession of Alcohol Is a Crime (AS § 04.11.491)"
        text: |
          **Status: Real state law — current, affects over 100 communities**

          Alaska Statute § 04.11.491 gives communities the right to vote on their own alcohol policy. A community can vote to go "dry" — prohibiting the sale, importation, and possession of alcohol within its borders — or "damp," which allows possession but not sales. Of Alaska's roughly 345 incorporated communities, over 100 have voted dry or damp.

          In a dry community, possessing a bottle of beer is a criminal offense. Importing alcohol — by plane, boat, or snowmobile — into a community that has voted dry is a separate crime, and for larger quantities can be charged as a class C felony. A traveler flying into a dry village with alcohol in their luggage has committed a crime under Alaska law the moment they land.

          The system emerged from the particular history of alcohol's effects on remote indigenous communities in Alaska, which had limited or no access to treatment and limited ability to regulate what came in on supply flights. The local option vote gave communities control that the state's general licensing system could not provide.

      - subtitle: "Same-Day Airborne Hunting Ban (AS § 16.05.783)"
        text: |
          **Status: Real state law — current**

          Alaska Statute § 16.05.783 makes it illegal to hunt or shoot at game on the same day you were airborne in any aircraft. If you fly over a hillside in the morning and spot a caribou herd, you cannot land and hunt that herd on the same day.

          The law exists because Alaska is large enough that aerial scouting was a genuine hunting practice. A pilot could cover terrain in two hours that would take weeks on foot, locate a trophy animal, land nearby, and hunt it the same afternoon. The statute closes that advantage.

          The prohibition also applies to the pilot: they cannot fly hunters in to pursue game the pilot spotted from the air on the same day. Violations are a class A misdemeanor. No other state has a landscape where same-day aerial scouting is a practical hunting strategy.

  - id: urban-legends
    icon: "fa-solid fa-ghost"
    title: "The Moose Claims — What the Statute Actually Says"
    subsections:
      - subtitle: "Giving Alcohol to a Moose"
        text: |
          **Claim:** It is illegal in Alaska to give a moose a beer.
          **Status: No specific statute located — likely misattribution**

          This is the most-cited Alaska weird law. No Alaska statute specifically prohibits giving alcohol to a moose. Alaska's animal cruelty statute (AS § 11.61.140) makes it a crime to "knowingly inflict severe or prolonged physical pain or suffering on an animal." Giving a moose alcohol could theoretically be prosecuted under this general provision, but there is no moose-specific or alcohol-specific provision anywhere in the Alaska code.

          The claim may derive from Fairbanks — which has had documented incidents of moose becoming disoriented after eating fermented crab apples — but no Fairbanks municipal ordinance matching this description has been located.

      - subtitle: "Waking a Sleeping Bear to Take a Photo"
        text: |
          **Claim:** It is illegal in Alaska to wake a sleeping bear to take a photograph.
          **Status: Misrepresents a real law**

          Alaska Statute § 16.05.905 prohibits intentionally harassing, hazing, or disturbing game — which includes bears. Deliberately waking a sleeping bear would violate this provision.

          But that is not a "bear photography law." It is a general wildlife harassment statute that applies to all game animals in all circumstances. The popular framing takes a broadly applicable wildlife rule and presents it as a quirky tourist-specific prohibition. The actual statute does not mention photography, sleeping, or any specific method of disturbance.

