faq:
  - question: "What are some weird laws in Alaska?"
    answer: "Three of the most verifiable: Alaska bans hunting any animal on the same day you flew in an aircraft, closing a loophole bush-plane hunters used to spot game from altitude; over 100 rural communities have voted to ban all alcohol including personal possession; and state law gives rural subsistence users legal priority over sport and commercial fishers when stocks run short. Many famous claims — moose on sidewalks, sleeping-bear selfie bans — cannot be confirmed in any Alaska statute."

  - question: "What are some strange laws in Alaska?"
    answer: "Alaska's genuinely strange laws reflect its geography. The same-day airborne hunting ban exists because bush planes gave hunters an unfair scouting advantage over game. The local-option alcohol law makes possession of a single beer a misdemeanor in more than 100 dry communities, and the list changes as villages vote. The subsistence fishing priority means the riverbank you stand on can determine which legal system governs your catch — state or federal rules apply on opposite sides of some Alaska rivers."

  - question: "Are Alaska weird laws real?"
    answer: "Some are. The same-day airborne hunting prohibition and the local-option dry-community alcohol ban are current, verified state laws with statute numbers, enforcement records, and real penalties. Many of the most-shared claims — moose banned from sidewalks, sleeping-bear photography rules, giving alcohol to a moose — could not be confirmed in any Alaska statute or municipal code after checking official sources. Alaska's legislature publishes every statute at le.alaska.gov; any real law can be looked up in under a minute."

  - question: "What is the weirdest law in Alaska?"
    answer: "The strongest verified candidate is the local-option alcohol prohibition. In more than 100 Alaska communities that have voted to go dry, carrying one alcoholic drink off a bush plane is a criminal misdemeanor punishable by up to one year in jail and a $10,000 fine. No other state gives individual communities that level of legal authority over a substance that is fully legal elsewhere in the same state."

