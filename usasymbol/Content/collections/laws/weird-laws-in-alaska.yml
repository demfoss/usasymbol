  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Alaska's Real Laws Sound Stranger Than the Made-Up Ones"
    paragraphs:
      - "Most weird-law lists are built around absurdity — the funnier the claim, the more it circulates. Alaska's unusual laws are not funny. A dry village system that makes possession a crime is a serious policy with a documented history. A same-day airborne hunting ban is a class A misdemeanor backed by decades of enforcement. Neither fits the format of a list item designed to get shares."
      - "The moose claims circulate precisely because they sound lighter. 'You can't give a moose a beer' is more shareable than 'rural communities can vote to make alcohol possession illegal.' The real laws are more unusual. They just require more than one sentence to explain."

