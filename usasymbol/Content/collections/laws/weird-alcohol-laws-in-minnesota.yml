faq:
  - question: "When could Minnesota grocery stores start selling full-strength beer?"
    answer: "The Legislature lifted the state's 3.2% alcohol-by-weight cap on grocery and convenience store beer effective January 2, 2017, ending Minnesota's status as the last state with the Prohibition-era restriction."

  - question: "Why didn't Minnesota liquor stores used to open on Sundays?"
    answer: "A statewide ban on Sunday package-store sales stood for 159 years, largely due to opposition from independent liquor store owners who argued Sunday hours would raise costs without adding new sales. Lawmakers ended the ban in 2017, allowing sales from 11 a.m. to 6 p.m."

  - question: "Why do some Minnesota cities own their own liquor stores?"
    answer: "A law passed right after Prohibition's 1933 repeal let city governments set up their own monopoly liquor retailers, called municipal liquor stores. Roughly 176 Minnesota communities still run one today, with the profits going toward the local budget instead of a private owner."

  - question: "Can grocery stores in Minnesota sell wine?"
    answer: "A grocery store can sell wine and full-strength liquor if it operates a separate, walled-off liquor department with its own entrance, which is how chains like Hy-Vee and Target sell spirits alongside groceries."

