page:
  h1: "Weird Alcohol Laws in Minnesota"

  quick_answer:
    - "Minnesota grocery and convenience stores could sell only 3.2% beer, a Prohibition-era holdover, until the Legislature lifted the cap on January 2, 2017."
    - "A statewide ban on Sunday liquor-store sales stood for 159 years before lawmakers finally allowed Sunday hours starting July 2, 2017."
    - "Roughly 176 Minnesota communities still run their own city-owned liquor stores, a local monopoly model unique among most states."

