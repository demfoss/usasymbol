sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Minnesota That Are Real"
    paragraphs:
      - "Minnesota held onto several Prohibition-era alcohol restrictions longer than almost any other state, and one local ownership model survives from the same era."
    highlights:
      - name: "Grocery Stores Sold Only 3.2 Beer Until 2017"
        status: "Verified"
        image: "/images/collections/laws/minnesota-3-2-beer-cap.jpg"
        anchor_phrases:
          - "3.2% alcohol"
          - "January 2, 2017"
        description: |
          **Law:** From the end of Prohibition until January 2, 2017, Minnesota law let grocery and convenience stores sell only beer capped at 3.2% alcohol by weight, a limit tracing back to the 1933 Cullen-Harrison Act.

          **Meaning:** Buying a full-strength beer or any wine off the shelf meant a trip to a licensed liquor store, not the corner gas station.

          **Reason:** Minnesota kept the low-strength cap for decades after most states dropped it, holding out as the last state with the restriction before the Legislature finally lifted it in 2017.
      - name: "Liquor Stores Were Closed on Sundays for 159 Years"
        status: "Verified"
        image: "/images/collections/laws/minnesota-sunday-sales-ban.jpg"
        anchor_phrases:
          - "159 years"
          - "Sunday"
        description: |
          **Law:** A statewide ban on Sunday package-store sales stood until 2017, when a new law allowed sales from 11 a.m. to 6 p.m. on Sundays.

          **Meaning:** Before 2017, a Minnesotan wanting a Sunday bottle of wine had to either visit a bar or drive across the border into Wisconsin.

          **Reason:** Independent liquor stores lobbied against the change for years, and the ban only fell after repeated legislative attempts finally succeeded.
      - name: "Some Minnesota Cities Run Their Own Liquor Stores"
        status: "Verified"
        image: "/images/collections/laws/minnesota-municipal-liquor-stores.jpg"
        anchor_phrases:
          - "municipal liquor store"
        description: |
          **Law:** State law lets a city government own and operate a monopoly liquor retailer within its borders, a setup called a "municipal liquor store."

          **Meaning:** In roughly 176 Minnesota communities, the liquor store on Main Street is a city department, and its profits fund the local budget instead of a private owner.

          **Reason:** The idea began right after Prohibition's repeal in 1933 as a way for smaller communities to control local alcohol sales, and cities have kept the model because it now brings in more than $400 million a year combined.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why It Took Minnesota Until 2017 to Allow Sunday Liquor Sales"
    paragraphs:
      - "Minnesota's Sunday package-store ban outlived similar bans in nearly every neighboring state, and border towns felt the difference directly. Shoppers who wanted a Sunday bottle simply drove into Wisconsin, taking their sales tax revenue with them."
      - "Independent liquor store owners fought the change for years, arguing a Sunday shift would raise costs without adding new demand, since customers would just spread the same week's purchases across an extra day. Lawmakers passed the change anyway in 2017, letting individual cities opt out if they chose, though most licensed stores opened on Sundays once the law took effect."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "3.2 beer takes its name from the 1933 Cullen-Harrison Act, a nine-month transitional law that legalized low-strength beer months before full Prohibition repeal."
      - "Grocery stores in Minnesota could already sell full-strength alcohol before 2017 if they built a separate walled-off liquor section with its own entrance."
      - "Minnesota's 2017 Sunday sales law let individual cities opt out of allowing Sunday hours, though most licensed stores chose to open anyway."
      - "Minnesota's municipal liquor stores posted a combined $437.4 million in sales in 2023, their 28th consecutive year of record sales."

