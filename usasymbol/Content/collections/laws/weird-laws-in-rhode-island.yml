faq:
  - question: "Is it really illegal to swear in public in Rhode Island?"
    answer: "Yes, technically. State law fines profane swearing and cursing up to $5, a penalty that has stood unchanged since 1909."
  - question: "Are stores allowed to open on Thanksgiving in Rhode Island?"
    answer: "No, with a short list of exceptions. Pharmacies, small food retailers, florists, and bakeries can open only if they hold a local license, and every other retail store must stay closed."
  - question: "What size do quahogs have to be in Rhode Island?"
    answer: "At least one inch thick at the hinge. Anything smaller has to be returned to the water, whether you're digging recreationally or harvesting commercially."
  - question: "Is racing a horse on the road illegal in Rhode Island?"
    answer: "Yes. Driving a horse on a public highway to race it or test its speed carries a fine of up to $20 or up to ten days in jail."
  - question: "Is the pickle-juice trolley law real?"
    answer: "No. Rhode Island's last trolley stopped running in 1948, and no statute or record has ever mentioned pickle juice or trolleys together."
  - question: "What is the weirdest real law still on the books in Rhode Island?"
    answer: "The $5 profanity fine surprises people most, since it's an enforceable statute rather than folklore, just frozen at a penalty amount from over a century ago."
