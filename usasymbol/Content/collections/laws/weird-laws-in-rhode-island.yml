sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Rhode Island That Are Real"
    paragraphs:
      - "A century-old profanity fine and a rule about clam thickness both hold up as genuine Unusual Laws in Rhode Island once you check the actual code."
    highlights:
      - name: "Racing a Horse on a Public Highway Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-horse-racing.jpg"
        description: |
          **Law:** Driving a horse on a public highway to race it or test its speed is punishable by a fine of up to $20 or ten days in jail.

          **Meaning:** Ordinary riding isn't covered. The law only kicks in when the point of the drive is speed or competition.

          **Reason:** The rule dates to Rhode Island's 1896 code, written for an era when horses were the main traffic on public roads and racing them created a real collision risk for everyone else.

      - name: "Stores Must Close on Thanksgiving and Christmas"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-holiday-closure.jpg"
        description: |
          **Law:** Retail stores can't open on Thanksgiving Day or December 25, with narrow carve-outs for pharmacies, small food shops, florists, and bakeries that still need a local license to open.

          **Meaning:** Most other Rhode Island blue laws, like Sunday shopping and Sunday liquor sales, have been repealed over the decades. This one survived and is still actively enforced and amended.

          **Reason:** It's a direct descendant of Rhode Island's historic Sunday and holiday closing laws, one of the few pieces of that tradition lawmakers never got around to lifting.

      - name: "Cursing in Public Carries a $5 Fine"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-profanity-fine.jpg"
        description: |
          **Law:** Profane swearing and cursing is punishable by a fine of up to $5.

          **Meaning:** The penalty has stayed frozen at that amount since it was re-codified in 1909, tracing back to an 1896 original.

          **Reason:** It's a leftover public-conduct law from a much stricter era of regulating speech in public, never repealed, just never enforced for its face value in modern dollars.

      - name: "Quahogs Must Be at Least One Inch Thick to Keep"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-quahog-size.jpg"
        description: |
          **Law:** Rhode Island bans taking or possessing quahog clams under one inch of shell thickness at the hinge, with narrow exceptions for licensed processing facilities.

          **Meaning:** Undersized quahogs have to go back in the water. The rule applies to recreational diggers and commercial harvesters alike.

          **Reason:** Quahogging is a genuine Rhode Island industry and cultural signature, and the size limit exists to keep the population from being harvested faster than it can reproduce.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Rhode Island We Couldn't Verify"
    paragraphs:
      - "A handful of Weird Rhode Island Laws Still on the Books claims keep circulating online without a single matching statute or town ordinance behind them."
    subsections:
      - subtitle: "You can't sell a toothbrush and toothpaste to the same customer on a Sunday in Providence"
        status: "Not Verified"
        text: |
          **Claim:** Providence has a rule against selling both a toothbrush and toothpaste to the same shopper on a Sunday.

          **Why We Couldn't Verify It:** No Providence ordinance or state blue law matches this description. It doesn't appear anywhere in Title 5 of the General Laws, which governs Rhode Island's Sunday business rules.

      - subtitle: "Horses can't be ridden faster than 10 mph"
        status: "Not Verified"
        text: |
          **Claim:** Riding a horse faster than 10 miles per hour is illegal statewide.

          **Why We Couldn't Verify It:** The real horse statute bans racing or speed-testing on a highway but sets no numeric speed limit anywhere in its text. The 10 mph figure appears to be a listicle addition with no source.

      - subtitle: "You can't wear see-through clothing in public"
        status: "Not Verified"
        text: |
          **Claim:** Rhode Island bans wearing transparent or see-through clothing in public.

          **Why We Couldn't Verify It:** General indecent-exposure law exists, but no section addresses clothing transparency specifically. This looks like a garbled restatement of the ordinary indecency statute.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Rhode Island Laws That Are Myths"
    paragraphs:
      - "Some Strange Rhode Island Laws claims collapse the moment you check a date. One targets a trolley system that hasn't run since 1948."
    subsections:
      - subtitle: "It's illegal to throw pickle juice at a trolley car"
        status: "Myth"
        text: |
          **Myth:** Rhode Island bans throwing pickle juice at a passing trolley car.

          **Reality:** Rhode Island's last streetcar line stopped running in 1948, which makes a modern trolley-targeting law nonsensical on its face. No statute, ordinance, or historical record supports this claim.

      - subtitle: "It's illegal to keep garbage in your bathtub"
        status: "Myth"
        text: |
          **Myth:** Storing garbage in a bathtub is against Rhode Island law.

          **Reality:** This exact claim appears nearly word for word on weird-law lists for other states too, a strong sign it's a recycled stock joke rather than a real ordinance anywhere.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How 39 Home Rule Towns Keep Rhode Island's Old Statutes Alive"
    paragraphs:
      - "Rhode Island's Constitution grants cities and towns home rule under Article XIII, letting all 39 of its municipalities write and amend local ordinances independently of the General Assembly. Layer that fragmented local structure on top of a state code still built on 1896 and 1909 codifications, and small penalties like the $5 profanity fine simply never come up for a formal repeal vote."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Rhode Island is the smallest U.S. state by area, yet it has roughly 384 miles of tidal shoreline along Narragansett Bay."
      - "Providence was founded in 1636 by Roger Williams after he fled religious persecution in the Massachusetts Bay Colony."
      - "Rhode Island was the last of the original 13 colonies to ratify the U.S. Constitution, holding out until May 29, 1790."
      - "In 2020, voters approved removing 'and Providence Plantations' from the state's official name because of the word's association with slavery."
      - "The state's name may come from an explorer comparing an island to Greece's Rhodes, or from a Dutch phrase meaning 'a reddish island.'"

