page:
  h1: "Real Rhode Island Laws You Won't Believe"
  quick_answer:
    - "Four Rhode Island claims check out: a horse-racing highway law, a Thanksgiving and Christmas retail closure rule, a $5 profanity fine, and a quahog minimum-size law."
    - "The profanity fine is real but tiny. Cursing in public can technically cost you $5, a penalty that hasn't changed since the statute was recodified in 1909."
    - "The pickle-juice-at-a-trolley claim and the garbage-in-a-bathtub claim are recycled internet jokes with no ordinance or statute behind either one."
