sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Maine That Are Real"
    paragraphs:
      - "Maine kept a state monopoly on spirits after Prohibition but found an unusual way to run it, and its towns still exercise the same local option power that has shaped New England alcohol law for generations."
    highlights:
      - name: "The State Owns Its Spirits Monopoly but Leases It Out"
        status: "Verified"
        image: "/images/collections/laws/maine-agency-liquor-stores.jpg"
        anchor_phrases:
          - "Pine State Trading Co"
          - "Agency Liquor Stores"
        description: |
          **Law:** Maine holds a legal monopoly on warehousing and distributing distilled spirits and fortified wine, but the state leased operation of that monopoly to Pine State Trading Co under a 10-year contract that took effect July 1, 2014.

          **Meaning:** Spirits in Maine still flow through what is technically a state-controlled system, but a private company runs the actual warehousing and distribution day to day.

          **Reason:** The lease model let Maine keep the legal and financial benefits of a spirits monopoly, including guaranteed revenue payments from the contractor, without directly operating the logistics itself.
      - name: "Nearly 60 Maine Towns Have Voted Themselves Dry"
        status: "Verified"
        image: "/images/collections/laws/maine-dry-towns-local-option.jpg"
        anchor_phrases:
          - "dry communities"
        description: |
          **Law:** Under Maine's local option system in Title 28-A, § 123, individual municipalities can vote to prohibit alcohol sales entirely, and close to 60 Maine towns currently do.

          **Meaning:** A town just a few miles from a place selling liquor freely can be completely dry if its own local option vote came out that way.

          **Reason:** Maine leaves the decision to sell alcohol at the municipal level rather than mandating one statewide rule, which is why the map of dry and wet towns looks patchy rather than following any single regional pattern.
      - name: "Sunday Sales Start an Hour Later Than Every Other Day"
        status: "Verified"
        image: "/images/collections/laws/maine-sunday-sales-hours.jpg"
        anchor_phrases:
          - "9 a.m."
        description: |
          **Law:** Maine Revised Statutes Title 28-A, § 4 sets general alcohol sale hours from 6 a.m. to 1 a.m. Monday through Saturday, but pushes the Sunday start time to 9 a.m., while state agency liquor stores can open as early as 5 a.m. on Sundays.

          **Meaning:** A retailer that could legally sell beer at 6 a.m. on a Saturday has to wait three additional hours to sell the same product on a Sunday.

          **Reason:** The later Sunday start reflects an old blue-law-style carveout for the day, one that Maine narrowed over the decades instead of eliminating outright, leaving a smaller but still distinct Sunday exception on the books.

  - id: why-towns-still-vote-dry
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Maine Still Has Dry Towns"
    paragraphs:
      - "Maine's local option law traces back to a long New England tradition of letting towns, not the state legislature, decide whether alcohol gets sold within their own borders. Title 28-A, § 123 keeps that structure alive today, and it means the question of buying a beer can hinge entirely on which side of a town line you're standing on."
      - "Nothing forces a dry town to hold a new vote, so many stay dry simply because no local campaign pushes for a change rather than because residents actively prefer prohibition. Close to 60 towns fit that description today, a small but persistent holdover from a system that once produced far more dry communities across the state before most of them eventually voted wet."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Pine State Trading Co's contract to run Maine's spirits distribution monopoly began July 1, 2014, and runs on a 10-year term."
      - "Maine's local option law, Title 28-A § 123, lets any municipality vote on its own alcohol sales policy independent of its neighbors."
      - "State-run agency liquor stores in Maine can open as early as 5 a.m. on Sundays, earlier than the 9 a.m. start required for most other retailers."
      - "Nearly 60 Maine towns remain completely dry today, down from a much larger number of dry communities earlier in the state's history."

