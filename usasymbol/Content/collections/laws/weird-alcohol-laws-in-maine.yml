faq:
  - question: "Does Maine own its liquor stores?"
    answer: "The state holds the legal monopoly on distributing spirits and fortified wine, but it leases the operation to a private company, Pine State Trading Co, under a contract that began July 1, 2014. Spirits sell through licensed Agency Liquor Stores, some located inside grocery stores."

  - question: "How many dry towns does Maine have?"
    answer: "Close to 60 Maine municipalities remain completely dry under local option votes, which let towns decide their own alcohol sales policy under Maine Revised Statutes Title 28-A, § 123."

  - question: "What time can you buy alcohol in Maine on Sunday?"
    answer: "General retailers can sell alcohol starting at 9 a.m. on Sundays, an hour later than the 6 a.m. start allowed Monday through Saturday. State-run agency liquor stores can open even earlier, as early as 5 a.m. on Sundays."

  - question: "Can a Maine town ban alcohol sales entirely?"
    answer: "Yes. Under the local option system, any Maine municipality can vote to prohibit alcohol sales within its borders, and nearly 60 towns currently do, even though the state as a whole permits alcohol sales."

