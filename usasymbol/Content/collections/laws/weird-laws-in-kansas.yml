faq:
  - question: "Is it legal to marry your first cousin in Kansas?"
    answer: "No. Kansas law voids first-cousin marriages performed inside the state and treats them as incestuous. A first-cousin marriage validly performed in another state can still be recognized once the couple lives in Kansas, based on a 1981 Kansas Supreme Court ruling."
  - question: "Can you hunt from horseback in Kansas?"
    answer: "Yes, but you cannot fire a weapon while still mounted. Kansas regulations require a hunter to dismount before shooting. Riding a horse or mule to the hunting spot itself is completely legal."
  - question: "Is noodling for catfish legal in Kansas?"
    answer: "Yes, for flathead catfish only, during a set summer window, and only with a separate handfishing permit. Hooks, scuba gear, and containers like barrels or bathtubs are all banned."
  - question: "Is the Natoma striped-suit knife law real?"
    answer: "No confirmed ordinance backs up this claim, and it has circulated for years without a date, a case, or an actual code section ever surfacing."
  - question: "Does Kansas really require overtime after a worker's seventh straight day?"
    answer: "No. The real Kansas overtime statute sets the threshold at 46 hours worked in one week, not a seventh consecutive day. It also only applies to employers not already covered by federal overtime law."
  - question: "What is the weirdest real law still on the books in Kansas?"
    answer: "The noodling rule stands out the most, since state regulators had to specifically ban using a barrel, box, or bathtub to lure catfish toward a bare hand. The first-cousin marriage ban is a close second because of how far the out-of-state exception actually goes."
