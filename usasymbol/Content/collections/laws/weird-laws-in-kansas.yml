sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Kansas That Are Real"
    paragraphs:
      - "Checking the actual code turns up real statutes behind some of the wildest Kansas claims, from a marriage ban with a court-tested exception to a hunting rule written for horseback safety. These examples anchor Unusual Laws in Kansas that hold up once you read the text itself."
    highlights:
      - name: "Kansas Bans Marriage Between First Cousins"
        status: "Verified"
        image: "/images/collections/laws/kansas-cousin-marriage-ban.jpg"
        description: |
          **Law:** Kansas voids marriages between first cousins, grouping the ban into the same statute that outlaws marriage between parents and children, siblings, and aunts, uncles, nieces, and nephews.

          **Meaning:** A first-cousin marriage performed inside Kansas counts as incestuous and legally void from the start, not just annulled after the fact.

          **Reason:** A 1981 Kansas Supreme Court inheritance case, In re Estate of Loughmiller, still lets a first-cousin marriage validly performed in another state stand once the couple lives in Kansas, so the ban really only reaches marriages contracted here.
      - name: "Hunters Can't Fire a Gun From Horseback"
        status: "Verified"
        image: "/images/collections/laws/kansas-horseback-hunting-rule.jpg"
        description: |
          **Law:** Kansas hunting regulations let hunters use horses and mules in the field but ban firing a weapon while still mounted on one.

          **Meaning:** A hunter on horseback has to dismount before taking a shot at game, even though riding out to the spot is perfectly legal.

          **Reason:** Wildlife officers write the rule as a safety measure, since a spooked or moving horse under a hunter holding a loaded weapon creates a real risk of an accidental discharge.
      - name: "Noodling for Catfish Is Legal, With a Catch"
        status: "Verified"
        image: "/images/collections/laws/kansas-handfishing-catfish-law.jpg"
        description: |
          **Law:** Kansas allows handfishing, better known as noodling, for flathead catfish during a set summer window on specific waters including the Kansas River.

          **Meaning:** Wildlife officers require a separate permit on top of a regular fishing license, and noodlers can't use hooks, scuba gear, or a barrel, box, or bathtub to lure fish toward their hands.

          **Reason:** The barrel-and-bathtub restriction exists because noodlers once used containers to trap and corner catfish before grabbing them, turning a hands-only tradition into something closer to fish trapping.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Kansas We Couldn't Verify"
    paragraphs:
      - "Natoma's supposed knife ordinance is the most repeated claim on this list, and it belongs in the file of Real Kansas Laws You Won't Believe precisely because nobody can produce the ordinance itself. A cherry pie dessert ban and a pedestrian taillight rule round out the claims with no statute behind them."
    subsections:
      - subtitle: "Natoma Bans Throwing Knives at Men in Striped Suits"
        status: "Not Verified"
        text: |
          **Claim:** The small town of Natoma passed an ordinance making it illegal to throw a knife at a man wearing a striped suit.

          **Why We Couldn't Verify It:** No Natoma city ordinance matching this claim turns up in any public code archive, and the story circulates with no date, no case, and no council record attached. Kansas listicles have repeated the line for years, but nobody has ever produced the actual ordinance number.
      - subtitle: "Ice Cream on Cherry Pie Is Illegal on Sundays"
        status: "Not Verified"
        text: |
          **Claim:** Serving cherry pie topped with ice cream on a Sunday was once against Kansas law.

          **Why We Couldn't Verify It:** Kansas did enforce real blue laws restricting Sunday business for decades, but no statute or repealed code section specifically naming cherry pie or ice cream has ever surfaced. The claim likely grew out of general Sunday commerce restrictions that had nothing to do with dessert pairings.
      - subtitle: "Pedestrians Must Wear Tail Lights After Dark"
        status: "Not Verified"
        text: |
          **Claim:** Anyone walking along or across a Kansas highway at night must wear a taillight so drivers can see them coming.

          **Why We Couldn't Verify It:** Kansas traffic law does address pedestrian visibility in general terms, but no statute requiring an actual taillight, reflector, or lighted device on a walking pedestrian has been located. The claim reads like a garbled retelling of ordinary bicycle or roadway-equipment rules.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Kansas Laws That Are Myths"
    paragraphs:
      - "A landlocked state banning whale hunting sounds like a punchline, and that punchline is exactly why it keeps getting listed among Weird Kansas Laws Still on the Books alongside two other claims that collapse under a quick fact check. Two trains frozen on a track and a fabricated overtime rule round out this section's parade of recycled internet jokes."
    subsections:
      - subtitle: "Hunting Whales Is Illegal in Kansas"
        status: "Myth"
        text: |
          **Myth:** Kansas has a specific law making it illegal to hunt whales.

          **Reality:** Kansas sits nowhere near an ocean, so the claim survives purely as a joke about a landlocked state regulating something nobody could ever do there. Federal law already protects whales nationwide, and no Kansas statute has ever needed to repeat that protection locally.
      - subtitle: "Two Trains Meeting Head-On Must Both Stop and Wait for the Other to Leave First"
        status: "Myth"
        text: |
          **Myth:** If two trains approach each other on the same track, Kansas law supposedly requires both to stop completely, and neither can move again until the other train has gone.

          **Reality:** Real railroad safety in Kansas runs on signaling and right-of-way rules, not a rule that would leave two trains stuck facing each other forever. The line reads like a logic-puzzle joke, and versions of it get recycled for other states with the wording barely changed.
      - subtitle: "Kansas Requires Overtime Pay After a Worker's Seventh Straight Day"
        status: "Myth"
        text: |
          **Myth:** Kansas has a law guaranteeing time-and-a-half pay for anyone who works a seventh consecutive day in one workweek.

          **Reality:** The actual statute behind this claim sets overtime at 46 hours worked in a single week, with no separate seventh-day trigger anywhere in the text. It also only applies to employers not already covered by federal wage law, a detail the online versions of this claim leave out entirely.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Kansas's Short Annual Sessions Let Old Rules Linger"
    paragraphs:
      - "Kansas holds a legislative session every year, unlike states that meet only every other year, but state law still caps each session at 90 days in odd-numbered years and 60 days in even-numbered years. Lawmakers spend that limited floor time on budgets and current fights, not on hunting down a mounted-hunter rule or a decades-old marriage statute for cleanup. A specific fix for an odd hunting restriction rarely competes for a spot on a 60-day calendar."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Kansas is one of just a handful of states where handfishing for catfish is fully legal, since most states ban the practice outright."
      - "The first-cousin marriage ban sits inside the same statute as Kansas's rules against parent-child and sibling marriages, treated as one broad incest law rather than a standalone cousin rule."
      - "The horseback shooting restriction applies specifically to horses and mules. Hunting on foot, from a blind, or with dogs is unaffected by it."
      - "Kansas's own overtime law only kicks in for employers not already covered by the federal Fair Labor Standards Act, which is why most Kansas workers never actually rely on it."
      - "The 1981 Kansas Supreme Court case that upheld an out-of-state cousin marriage grew out of an inheritance dispute, not a direct challenge to the marriage itself."

