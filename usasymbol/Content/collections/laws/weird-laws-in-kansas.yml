page:
  h1: "Weird Laws in Kansas That Sound Too Strange to Be True"
  quick_answer:
    - "Three Kansas weird-law claims check out as real: the first-cousin marriage ban, the no-shooting-from-horseback hunting rule, and the state's own overtime statute."
    - "The most repeated Kansas myth mixes a real overtime law with a fake seventh-day rule that never actually appears in the statute text."
    - "The Natoma knife law and the cherry-pie-and-ice-cream ban have no confirmed statute, ordinance, or date behind them anywhere."
