faq:
  - question: "Why do Montana breweries close so early?"
    answer: "State law limits breweries to a three-pint-per-customer cap and an 8 p.m. taproom cutoff, hours before bars have to close. The Montana Tavern Association pushed for the rule after brewery taprooms began competing directly with traditional bars."

  - question: "How much alcohol can you buy at a Montana distillery?"
    answer: "A customer can buy up to 4.5 liters, about six standard 750-milliliter bottles, for off-premise use in a single day, plus up to two ounces for on-site tasting between 10 a.m. and 8 p.m."

  - question: "Are there dry counties in Montana?"
    answer: "No. Montana does not have counties or municipalities where alcohol sales are entirely prohibited, though local jurisdictions can still add their own rules on top of the state's licensing system."

  - question: "Why are Montana liquor licenses so valuable?"
    answer: "A population-based quota, in place since the 1940s, caps how many licenses a town can hold and grandfathered in existing holders as the cap tightened. New bars and restaurants have to buy a license on the resale market instead of getting one directly from the state."

