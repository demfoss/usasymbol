sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Montana That Are Real"
    paragraphs:
      - "Montana built its modern liquor rules around protecting bars and package stores from newer competitors, and the results still shape how the state's distilleries, breweries, and license market work."
    highlights:
      - name: "Distilleries Can Only Sell You So Much a Day"
        status: "Verified"
        image: "/images/collections/laws/montana-distillery-sales-cap.jpg"
        anchor_phrases:
          - "4.5 liters"
        description: |
          **Law:** Montana law caps how much spirits a distillery can sell one customer per day: up to 4.5 liters, about six standard 750-milliliter bottles, for off-premise purchase, plus up to two ounces for on-premise tasting between 10 a.m. and 8 p.m.

          **Meaning:** A visitor stocking up at a distillery gift shop cannot buy more than six bottles in a single visit, no matter how much they're willing to spend.

          **Reason:** The caps keep small distillery tasting rooms from operating like full liquor stores, preserving the licensed retail system that Montana's bars and package stores depend on.
      - name: "Brewery Taprooms Have to Close by 8 p.m."
        status: "Verified"
        image: "/images/collections/laws/montana-brewery-taproom-cutoff.jpg"
        anchor_phrases:
          - "8 p.m."
          - "three pints"
        description: |
          **Law:** Montana breweries can pour up to three pints per customer in their taprooms but must stop serving by 8 p.m., hours earlier than the 2 a.m. close allowed at bars.

          **Meaning:** A brewery taproom can be full of customers at 7:45 p.m. and legally empty of alcohol service fifteen minutes later, regardless of how busy the night is.

          **Reason:** The Montana Tavern Association pushed for the restriction because breweries, originally licensed only as producers, threatened to undercut tavern business by serving customers directly at lower prices, so lawmakers drew a hard line between the two license types.
      - name: "Liquor Licenses Are Capped by Population, and Grandfathered In"
        status: "Verified"
        image: "/images/collections/laws/montana-liquor-license-quota.jpg"
        anchor_phrases:
          - "capped"
          - "grandfathered"
        description: |
          **Law:** Since the 1940s, Montana has capped the number of liquor licenses available in a town based on its population, with existing license holders grandfathered in as the cap tightened around them.

          **Meaning:** A new bar or restaurant in a town that has already hit its quota cannot get a license from the state and has to buy one from an existing holder instead.

          **Reason:** The fixed supply created a resale market where license values have climbed for decades, since demand for new bars and restaurants keeps growing while the state-set quota does not move.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Montana Breweries Have to Stop Pouring at 8 p.m."
    paragraphs:
      - "Montana breweries were originally licensed only as producers, meant to brew beer for distribution rather than serve it directly to customers. When taprooms became popular and started drawing customers who might otherwise have gone to a bar, the Montana Tavern Association argued the arrangement let breweries undercut licensed bars on price without carrying the same licensing costs."
      - "State lawmakers responded by writing a firm line between the two business types: a three-pint limit per customer and an 8 p.m. cutoff for breweries, hours before the 2 a.m. close bars are allowed to keep. The rule has stayed in place since, even as Montana's craft beer industry has grown well beyond what regulators anticipated when they first drew the distinction."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Montana bars can serve alcohol until 2 a.m., but breweries must stop taproom service at 8 p.m. under a separate set of rules."
      - "A distillery customer in Montana can buy up to six 750-milliliter bottles for off-premise use in a single day, the legal maximum of 4.5 liters."
      - "Montana's liquor license quota system dates to the 1940s and grandfathered in existing license holders as the population-based caps tightened."
      - "Montana has no dry counties or municipalities, though local jurisdictions can still set their own additional rules on top of state law."

