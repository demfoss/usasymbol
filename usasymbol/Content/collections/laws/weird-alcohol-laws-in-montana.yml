page:
  h1: "Weird Alcohol Laws in Montana"

  quick_answer:
    - "Montana caps how much spirits a distillery can sell one customer per day, roughly six standard bottles for off-premise purchase and two ounces for on-site tasting."
    - "Montana breweries can pour up to three pints per customer but must stop taproom service by 8 p.m., hours before the 2 a.m. close allowed at bars."
    - "A population-based liquor license quota, in place since the 1940s, caps how many bars a town can license and grandfathered in existing holders as the cap tightened."

