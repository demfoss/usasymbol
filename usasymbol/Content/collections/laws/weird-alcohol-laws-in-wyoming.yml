faq:
  - question: "Is it illegal to be drunk in a mine in Wyoming?"
    answer: "Yes. Wyoming Statute § 35-10-402 makes it a misdemeanor to enter a mine, smelter, machine shop, or sawmill while under the influence of alcohol, or to carry liquor into one, with penalties of up to a $500 fine and a year in jail."

  - question: "Can you get in trouble for skiing drunk in Wyoming?"
    answer: "Yes. Wyoming Statute § 6-9-301 bans using a ski slope or trail, or riding a lift uphill, while impaired by alcohol or drugs, treating impaired skiing similarly to how the state treats impaired driving."

  - question: "Can you get a DUI on a horse in Wyoming?"
    answer: "No, not since the 2026 Saddles, Not Steering Wheels Act clarified that Wyoming's DUI statute doesn't apply to someone riding a horse, mule, or other equine. A visibly drunk rider could still face a public intoxication charge instead."

  - question: "Does Wyoming control liquor sales directly?"
    answer: "Yes, for wine and spirits. The Wyoming Liquor Division is the exclusive wholesaler of all spirits and listed wines statewide, while beer distribution stays in private hands, a split system unlike most other control states."

