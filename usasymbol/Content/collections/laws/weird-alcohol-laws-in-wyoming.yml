page:
  h1: "Weird Alcohol Laws in Wyoming"

  quick_answer:
    - "Wyoming law makes it a misdemeanor to enter a mine, sawmill, or smelter while under the influence of alcohol, or to carry liquor into one, punishable by up to a year in jail."
    - "Skiing while impaired is illegal in Wyoming under a statute that also bans riding a ski lift uphill while under the influence of alcohol or drugs."
    - "In 2026, lawmakers passed the Saddles, Not Steering Wheels Act to formally exclude horses from Wyoming's DUI statute after the law's broad 'vehicle' definition left the question unclear."

