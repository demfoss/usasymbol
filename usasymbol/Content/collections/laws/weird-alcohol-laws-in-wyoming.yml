sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Wyoming That Are Real"
    paragraphs:
      - "Wyoming pairs an old-fashioned state liquor monopoly with impairment laws tailored to how people actually spend time there, from mine shafts to ski slopes to the saddle."
    highlights:
      - name: "Entering a Mine Drunk Is a Misdemeanor"
        status: "Verified"
        image: "/images/collections/laws/wyoming-drunk-in-mine-law.jpg"
        anchor_phrases:
          - "under the influence"
          - "mine"
        description: |
          **Law:** Wyoming Statute § 35-10-402 makes it a misdemeanor to enter a mine, smelter, metallurgical works, machine shop, or sawmill while under the influence of alcohol, or to carry liquor into one of those sites or a logging or grading camp.

          **Meaning:** The law covers the buildings connected to those worksites too, not just the mine shaft or shop floor itself, and applies to anyone under the influence, not only employees.

          **Reason:** Conviction carries a fine of up to $500 and up to a year in jail, reflecting how dangerous drinking around heavy machinery and active mining operations genuinely is.
      - name: "Skiing Impaired Is Treated Like Drunk Driving"
        status: "Verified"
        image: "/images/collections/laws/wyoming-ski-impairment-law.jpg"
        anchor_phrases:
          - "Wyoming Statute § 6-9-301"
          - "passenger tramway"
        description: |
          **Law:** Wyoming Statute § 6-9-301 bans moving uphill on a ski lift or using any slope or trail while impaired by alcohol or drugs, alongside a broader ban on reckless skiing.

          **Meaning:** A skier who has had too much at the lodge can be cited under this statute without ever getting behind the wheel of a car.

          **Reason:** Lawmakers wrote the impairment ban directly into skier-safety law rather than relying on general public-intoxication statutes, giving ski areas a specific tool for citing impaired skiers and lift riders.
      - name: "Horses Are Now Officially Excluded From DUI Law"
        status: "Verified"
        image: "/images/collections/laws/wyoming-saddles-not-steering-wheels.jpg"
        anchor_phrases:
          - "Saddles, Not Steering Wheels Act"
          - "2026"
        description: |
          **Law:** Wyoming's 2026 Saddles, Not Steering Wheels Act, House Bill 31, clarifies that the state's driving-under-the-influence statute does not apply to a person riding a horse, mule, or other equine.

          **Meaning:** Before this law, Wyoming's DUI statute defined "vehicle" broadly enough that it never clearly excluded a ridden horse, leaving open the theoretical possibility of a DUI charge for drunk horseback riding.

          **Reason:** The bill doesn't grant blanket protection. A rider who is visibly drunk on horseback can still face a public intoxication charge, but not the same DUI charge that applies to drivers.

  - id: why-wyoming-writes-such-specific-laws
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Wyoming's Alcohol Laws Target Specific Activities"
    paragraphs:
      - "Wyoming's economy has long run on industries where impairment carries outsized physical risk: mining, ranching, and, more recently, ski tourism. The mine-entry law and the skier-impairment statute both reflect that pattern, writing alcohol restrictions directly into safety codes for specific high-risk settings rather than leaving everything to a single general public-intoxication law."
      - "The 2026 horseback-riding clarification followed the opposite pattern. Instead of adding a new restriction, lawmakers narrowed an old one. Wyoming's DUI statute had never been written with equestrians in mind, and its broad definition of a vehicle left just enough ambiguity that Representative Julie Jarvis introduced the Saddles, Not Steering Wheels Act to settle the question before it ever became a real prosecution."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "A conviction under Wyoming's mine-entry intoxication law can carry up to a year in jail on top of a $500 fine."
      - "Wyoming's Liquor Division is the exclusive wholesaler of all spirits and listed wines statewide, stocking more than 2,000 SKUs out of a single Cheyenne warehouse."
      - "Unlike wine and spirits, beer distribution in Wyoming stays entirely in private hands rather than running through the state wholesale system."
      - "The Saddles, Not Steering Wheels Act passed during Wyoming's 2026 Budget Session, which opened February 9."

