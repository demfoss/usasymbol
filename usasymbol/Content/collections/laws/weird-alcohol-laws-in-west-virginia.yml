faq:
  - question: "Is drinking alcohol in public technically illegal in West Virginia?"
    answer: "By the literal text of the state constitution, yes. Article VI, Section 46 requires any law allowing liquor sales to also forbid consuming it in a saloon or public place. In practice, later laws redefining beer and licensing private clubs let bars and restaurants operate legally around that ban."

  - question: "Why did West Virginia call beer 'non-intoxicating'?"
    answer: "In 1937, the state reclassified standard beer as 'non-intoxicating beer,' a category separate from the 'intoxicating liquors' the 1934 constitutional amendment restricted to private places. That reclassification let bars keep selling beer without amending the constitution."

  - question: "Does West Virginia still have dry counties?"
    answer: "No county remains fully dry. Calhoun County was the last holdout for wine and hard liquor sales, going wet after an August 11, 2021, vote. The town of Brandonville remains West Virginia's last dry municipality."

  - question: "Is moonshine legal in West Virginia?"
    answer: "Owning a still is legal, but distilling moonshine without a state or federal license is not. The state's moonshine history runs deep. Authorities seized 683 illegal stills in West Virginia during 1923 and 1924 alone, the 14th-highest total in the country that period."

