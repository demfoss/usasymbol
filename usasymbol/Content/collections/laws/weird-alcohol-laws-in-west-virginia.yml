page:
  h1: "Weird Alcohol Laws in West Virginia"

  quick_answer:
    - "West Virginia's constitution has banned consuming intoxicating liquor in a saloon or other public place since 1934, so the state redefined ordinary beer as 'non-intoxicating' in 1937 just to keep bars open."
    - "West Virginia seized 683 illegal stills in 1923 and 1924 alone, the 14th-highest total of any state, cementing the region's moonshine reputation during national Prohibition."
    - "Calhoun County was West Virginia's last dry county for wine and liquor sales until voters approved going wet on August 11, 2021."

