sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in West Virginia That Are Real"
    paragraphs:
      - "West Virginia never fully wrote its Prohibition-era restrictions out of law. Instead, the state built a series of legal workarounds on top of them that are still in effect."
    highlights:
      - name: "The State Constitution Still Bans Drinking in Public"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-constitutional-saloon-ban.jpg"
        anchor_phrases:
          - "Article VI, Section 46"
          - "saloon or other public place"
        description: |
          **Law:** West Virginia Constitution Article VI, Section 46, adopted in 1934 to end statewide Prohibition, requires any law permitting liquor sales to also forbid and penalize consuming it "in a saloon or other public place."

          **Meaning:** Taken literally, the provision bans exactly the kind of public drinking that happens in bars and restaurants across the state every day.

          **Reason:** Rather than amend the constitution, the state has spent decades building narrower statutes and licensing categories around the ban instead of repealing it outright.
      - name: "Beer Got Redefined as 'Non-Intoxicating' to Get Around the Ban"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-non-intoxicating-beer.jpg"
        anchor_phrases:
          - "non-intoxicating beer"
          - "1937"
        description: |
          **Law:** In 1937, West Virginia legally redefined standard beer as "non-intoxicating beer," a separate legal category from the "intoxicating liquors" named in the constitutional ban.

          **Meaning:** Because beer no longer counted as "intoxicating liquor" under state law, bars and restaurants could legally sell and serve it despite the constitutional public-drinking ban.

          **Reason:** The reclassification let the legislature reopen beer sales in public establishments without touching the constitutional language voters had approved just three years earlier.
      - name: "Private Clubs Exist Because They Aren't 'Public Places'"
        status: "Verified"
        image: "/images/collections/laws/west-virginia-private-club-licensing.jpg"
        anchor_phrases:
          - "private clubs"
          - "1948"
        description: |
          **Law:** West Virginia began licensing private clubs, including veterans' organizations, fraternal groups, and country clubs, to sell liquor starting in 1948.

          **Meaning:** These clubs could serve liquor that ordinary bars and restaurants still could not, because state law treated a membership-only club as something other than the "public place" the constitution restricts.

          **Reason:** The private club category became a second major workaround, alongside the non-intoxicating beer rule, for operating what functioned as a full bar without amending the underlying constitutional ban.

  - id: why-the-workarounds-exist
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why West Virginia Built Laws Around Its Own Constitution"
    paragraphs:
      - "West Virginia's mountain distilling tradition predates the state itself. Settlers from Scotland, Ireland, and England brought stills with them in the 18th century, and whiskey was traded for salt, nails, and taxes long before anyone called it moonshine. When national Prohibition began in 1920, that existing distilling knowledge turned into a documented surge in illegal production, including 683 stills seized across the state in 1923 and 1924 alone."
      - "When the state repealed its own Prohibition law in 1934, lawmakers wrote a public-drinking ban directly into the constitution rather than trusting an ordinary statute to hold. That decision is why later legislatures had to work around the language instead of just repealing it: redefining beer in 1937, then licensing private clubs in 1948, each time building a legal category the constitutional ban didn't cover rather than amending the ban itself."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "West Virginia's 683 stills seized in 1923 and 1924 ranked 14th-highest among all states during that period of national Prohibition."
      - "It remains legal to own a still in West Virginia as long as it isn't used to distill moonshine without a license."
      - "Calhoun County stayed dry for wine and hard liquor sales until an August 11, 2021, vote made it wet, and no West Virginia county remains fully dry today."
      - "The town of Brandonville is West Virginia's last remaining dry municipality, even though every county in the state is now wet."

