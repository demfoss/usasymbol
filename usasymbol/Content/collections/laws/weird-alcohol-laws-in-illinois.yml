    title: "Unusual Alcohol Laws in Illinois That Are Real"
    paragraphs:
      - "Illinois built some of the strictest bar and retailer alcohol rules in the country, then loosened one of them only after decades of pressure from restaurants."
    highlights:
      - name: "Illinois Banned Happy Hour for 26 Years"
        status: "Verified"
        image: "/images/collections/laws/illinois-happy-hour-ban.jpg"
        anchor_phrases:
          - "banned happy hour"
        description: |
          **Law:** Illinois barred bars and restaurants from offering discounted drink specials, commonly known as happy hour, from 1989 until Public Act 099-0046 took effect in 2015.

          **Meaning:** For over a quarter century, an Illinois bar could not legally advertise a two-for-one drink deal or a reduced-price cocktail hour.

          **Reason:** Lawmakers passed the ban to cut drunk driving deaths, and the state's alcohol-related fatal crash share did fall from roughly 49.6% in 1988 to around 41% by 2012, though the 2015 repeal still capped discounts at four hours a day and fifteen hours a week.
      - name: "Grocery Stores Can Sell Spirits, Not Just Beer and Wine"
        status: "Verified"
        image: "/images/collections/laws/illinois-grocery-spirits-sales.jpg"
        anchor_phrases:
          - "grocery stores can sell spirits"
        description: |
          **Law:** Illinois allows licensed grocery stores to sell distilled spirits alongside beer and wine for off-premise consumption.

          **Meaning:** A shopper can pick up a bottle of bourbon in the same store as a case of beer and a bottle of cabernet, without a separate liquor store trip.

          **Reason:** Illinois never restricted spirits to a dedicated retail category the way many states did, so grocery chains that meet licensing requirements can carry the full range of alcohol categories.
      - name: "An 1872 Law Still Makes Bars Liable for What Customers Do Drunk"
        status: "Verified"
        image: "/images/collections/laws/illinois-dram-shop-act.jpg"
        anchor_phrases:
          - "1872"
          - "dram shop law"
        description: |
          **Law:** The Illinois Dram Shop Act, first passed in 1872, holds bars, restaurants, and other alcohol sellers strictly liable for injuries an intoxicated customer causes to someone else.

          **Meaning:** A bar can be sued for damages even without proof that staff knew the customer was already drunk when they kept serving.

          **Reason:** Before 1872, Illinois held that only the act of drinking, not the act of selling, caused alcohol-related harm. The law flipped that assumption and remains one of the oldest and strictest dram shop statutes in the country.

  - id: why-the-ban-lasted
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Illinois Kept the Happy Hour Ban for So Long"
    paragraphs:
      - "Illinois passed its happy hour ban in 1989 during a broader statewide push against drunk driving, and the numbers gave lawmakers little reason to reconsider it for years. Alcohol-related crashes made up nearly half of all fatal crashes in the late 1980s, a figure that kept dropping through the following two decades."
      - "Restaurant and bar owners eventually argued the ban had outlived its usefulness and mainly hurt legitimate hospitality businesses rather than problem drinking. Public Act 099-0046 restored discount pricing in 2015, but lawmakers kept the practice on a short leash, capping specials at four hours a day and fifteen hours a week instead of returning to an unrestricted market."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Illinois's happy hour ban lasted 26 years, from 1989 to 2015, longer than almost any other state's version of the rule."
      - "Illinois's share of fatal crashes involving alcohol fell from about 49.6% in 1988 to roughly 41% by 2012, the period covering most of the ban."
      - "Public Act 099-0046 legalized happy hour again in 2015 but limited price discounts to four hours a day and fifteen hours a week."
      - "The Illinois Dram Shop Act of 1872 predates most other states' liquor liability laws by decades."

