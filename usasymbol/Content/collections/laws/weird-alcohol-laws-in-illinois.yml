faq:
  - question: "Is happy hour legal in Illinois?"
    answer: "Yes, since 2015. Public Act 099-0046 ended a 26-year statewide ban, though bars and restaurants can only offer discounted drink specials for up to four hours a day and fifteen hours a week."

  - question: "Why did Illinois ban happy hour in the first place?"
    answer: "Lawmakers passed the 1989 ban to reduce drunk driving deaths. Illinois's share of fatal crashes involving alcohol dropped from about 49.6% in 1988 to roughly 41% by 2012, a trend often cited in debates over whether the ban worked."

  - question: "Can grocery stores in Illinois sell hard liquor?"
    answer: "Yes. Licensed grocery stores can sell distilled spirits along with beer and wine for off-premise consumption, unlike states that restrict spirits sales to dedicated liquor stores."

  - question: "What is the Illinois Dram Shop Act?"
    answer: "First passed in 1872, it holds bars, restaurants, and other alcohol sellers strictly liable for injuries an intoxicated patron causes to someone else. It remains one of the oldest dram shop liability laws in the United States and does not require proof the server knew the customer was drunk."

