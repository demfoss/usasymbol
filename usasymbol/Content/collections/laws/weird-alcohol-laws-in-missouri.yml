faq:
  - question: "Is it legal to drink alcohol in a car in Missouri?"
    answer: "A passenger can generally have and drink an open alcohol container in most of Missouri, since the state has no statewide open-container ban. The driver cannot drink while operating the vehicle, and cities including St. Louis, Kansas City, Springfield, and Columbia ban open containers within their own limits."

  - question: "Can parents legally give their kids alcohol in Missouri?"
    answer: "Yes, in a private setting like their home. Missouri law exempts a parent or legal guardian giving alcohol to their own child, though the exception does not cover public places or extend to other adults, and deliberately intoxicating a child can still count as child abuse."

  - question: "Does Missouri have dry counties?"
    answer: "No. Missouri's 1934 Liquor Control Law ended local governments' power to ban alcohol on their own, replacing a patchwork where roughly half the state's counties had gone dry with one statewide regulatory system."

  - question: "Why don't St. Louis and Kansas City allow open containers if the state does?"
    answer: "Missouri never passed a statewide open-container ban, so individual cities wrote their own. St. Louis, Kansas City, Springfield, and Columbia each prohibit open containers within city limits even though the surrounding unincorporated areas of the state do not."

