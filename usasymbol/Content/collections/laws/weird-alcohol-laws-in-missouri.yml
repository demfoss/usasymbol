sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Missouri That Are Real"
    paragraphs:
      - "Missouri centralized alcohol regulation at the state level back in 1934, but it left a few gaps and exceptions that still stand out compared to most states."
    highlights:
      - name: "Passengers Can Legally Drink in a Moving Car"
        status: "Verified"
        image: "/images/collections/laws/missouri-open-container-gap.jpg"
        anchor_phrases:
          - "open alcohol container"
        description: |
          **Law:** Missouri has no statewide law banning open alcohol containers in the passenger area of a moving vehicle, making it one of only six states without one.

          **Meaning:** A passenger, not the driver, can legally hold and drink an open beer while riding through most of the state, though the driver cannot drink at all while operating the vehicle.

          **Reason:** Missouri lawmakers have repeatedly declined to pass a statewide open-container law, so several major cities, including St. Louis, Kansas City, Springfield, and Columbia, passed their own local ordinances to close the gap within city limits.
      - name: "Parents Can Give Their Kids a Drink at Home"
        status: "Verified"
        image: "/images/collections/laws/missouri-parental-consent-drinking.jpg"
        anchor_phrases:
          - "parent or legal guardian"
        description: |
          **Law:** Missouri's drinking-age statute carves out an exception letting a parent or legal guardian give alcohol to their own child in a private setting like their home.

          **Meaning:** The exception does not extend to public places, restaurants, or bars, and it covers only the minor's own parent or guardian, not another adult.

          **Reason:** The carve-out treats supervised family drinking differently from underage drinking generally, though a parent who deliberately gets a child drunk can still face child-abuse charges under separate Missouri law.
      - name: "Cities Couldn't Regulate Alcohol Until 1934"
        status: "Verified"
        image: "/images/collections/laws/missouri-1934-liquor-control-law.jpg"
        anchor_phrases:
          - "1934 Liquor Control Law"
        description: |
          **Law:** Missouri's 1934 Liquor Control Law created the state's first statewide alcohol authority and stripped cities and counties of the power to pass their own alcohol prohibitions.

          **Meaning:** Before 1934, an 1857 statute left liquor regulation entirely to local governments, and by the time national Prohibition ended, roughly half of Missouri's counties had gone dry on their own.

          **Reason:** The 1934 law replaced that patchwork with one statewide system, which is part of why Missouri has no dry counties today even though many other former Prohibition-era states still do.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Missouri Never Passed a Statewide Open-Container Law"
    paragraphs:
      - "Missouri's 1934 Liquor Control Law centralized alcohol regulation at the state level, but it never added a ban on open containers inside a moving vehicle. That gap has stayed unfilled for nine decades, even as federal highway funding incentives pushed nearly every other state to adopt one."
      - "Cities filled the gap instead of the state. St. Louis, Kansas City, Springfield, and Columbia each passed local ordinances banning open containers within city limits, so the legal picture changes the moment a driver crosses from an unincorporated stretch of highway into one of those cities."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Missouri is one of only six states without a statewide law restricting open alcohol containers in a vehicle's passenger area."
      - "Before the 1934 Liquor Control Law, an 1857 Missouri statute left alcohol regulation entirely to local governments, and roughly half the state's counties had gone dry by the end of national Prohibition."
      - "Commercial motor vehicle passengers in Missouri are still barred from having open containers, even though private-vehicle passengers generally are not."
      - "A Missouri driver who consumes alcohol while operating a vehicle can still be charged, regardless of what the state's open-container law does or does not cover."

