  h1: "Weird Alcohol Laws in Missouri"

  quick_answer:
    - "Missouri has no statewide law banning open alcohol containers in a car's passenger area, making it one of only six states without one."
    - "Missouri lets a parent or legal guardian give their own child alcohol in a private setting like their home, an exception most states don't carry."
    - "Missouri's 1934 Liquor Control Law stripped cities and counties of the power to ban alcohol locally, ending a patchwork where about half the state's counties had gone dry on their own."

