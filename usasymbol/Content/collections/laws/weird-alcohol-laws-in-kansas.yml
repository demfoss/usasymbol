faq:
  - question: "What is a cereal malt beverage in Kansas?"
    answer: "It is a legal category created in 1937 for beer with 3.2% alcohol by weight or less, defined separately from intoxicating liquor. The category let Kansas permit weak beer sales while the state's broader liquor prohibition was still in effect."

  - question: "When did Kansas end prohibition?"
    answer: "Kansas voted wet in 1948, fifteen years after the 21st Amendment ended national Prohibition in 1933. Kansas had banned liquor at the state level since 1881, giving it one of the longest prohibition histories of any state."

  - question: "Are there still dry counties in Kansas?"
    answer: "Yes, one. Wallace County is Kansas's last fully dry county as of 2023, prohibiting on-premises liquor sales while still allowing sale of 3.2% cereal malt beverage. Kansas previously had three dry counties before the others voted wet."

  - question: "Did Kansas ever ratify the 21st Amendment?"
    answer: "No. Kansas never formally ratified the 21st Amendment that repealed national Prohibition, even though the state itself legalized alcohol sales in 1948 through its own separate vote."

