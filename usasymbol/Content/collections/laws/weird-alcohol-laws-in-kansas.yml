sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Kansas That Are Real"
    paragraphs:
      - "Kansas held out against legal alcohol longer than any other state, and its legal system still carries the scars of that resistance."
    highlights:
      - name: "Kansas Invented a Legal Category to Get Around Its Own Ban"
        status: "Verified"
        image: "/images/collections/laws/kansas-cereal-malt-beverage.jpg"
        anchor_phrases:
          - "cereal malt beverage"
          - "3.2 percent"
        description: |
          **Law:** In 1937, Kansas lawmakers defined beer with 3.2% alcohol by weight or less as a "cereal malt beverage," excluding it from the legal definition of intoxicating liquor.

          **Meaning:** Weak beer under the CMB label could be sold under looser rules than everything else classified as alcohol, creating a separate legal lane entirely.

          **Reason:** Kansas still banned intoxicating liquor statewide at the time, so the CMB category let lawmakers permit a low-alcohol product without technically repealing prohibition, a workaround that outlasted the ban itself.
      - name: "Kansas Stayed Dry 15 Years After National Prohibition Ended"
        status: "Verified"
        image: "/images/collections/laws/kansas-prohibition-history.jpg"
        anchor_phrases:
          - "1948"
        description: |
          **Law:** Kansas did not vote to end its statewide prohibition on intoxicating liquor until 1948, fifteen years after the 21st Amendment repealed national Prohibition in 1933.

          **Meaning:** For a decade and a half, Kansas residents lived under stricter alcohol law than most of the rest of the country, even though the federal ban had already ended.

          **Reason:** Kansas had banned liquor at the state level since 1881, decades before national Prohibition began, and that deep-rooted temperance tradition made it the last state to formally go wet.
      - name: "One Kansas County Is Still Completely Dry"
        status: "Verified"
        image: "/images/collections/laws/kansas-dry-county.jpg"
        anchor_phrases:
          - "dry county"
        description: |
          **Law:** As of 2023, Wallace County remains Kansas's one fully dry county, where on-premises liquor sales are prohibited, though sale of 3.2% cereal malt beverage is still permitted there.

          **Meaning:** A bar in Wallace County cannot pour a standard drink, but a store can still sell the state's old CMB-category beer.

          **Reason:** Wallace County never passed the local option votes that brought Kansas's other formerly dry counties, including Haskell and Stanton, into wet status, leaving it as the last holdout of a much larger dry map.

  - id: why-the-longest-holdout
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Kansas Took So Long to Go Wet"
    paragraphs:
      - "Kansas banned intoxicating liquor at the state level in 1881, more than 50 years before national Prohibition even started, making it a pioneer of the temperance movement rather than a follower. That head start meant Kansas had decades of political and cultural investment in prohibition long before the rest of the country caught up, and long before most of the country repealed it again."
      - "The 3.2% cereal malt beverage category, created in 1937, gave lawmakers a middle path that let some alcohol flow legally without abandoning the state's core prohibition stance. Kansas did not fully go wet until 1948, and even then it kept the CMB distinction in law long after it stopped serving its original purpose, which is part of why Wallace County can still sell 3.2% beer today despite banning liquor by the drink."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Kansas banned liquor statewide in 1881, more than 50 years before the rest of the country adopted national Prohibition."
      - "The 1937 cereal malt beverage category defined 3.2% alcohol by weight as legally separate from intoxicating liquor, a distinction that still shapes Kansas law."
      - "Kansas did not ratify the 21st Amendment that ended national Prohibition, even though the state itself went wet in 1948."
      - "Kansas went from three fully dry counties, Haskell, Stanton, and Wallace, down to just one, Wallace County, as of March 2023."

