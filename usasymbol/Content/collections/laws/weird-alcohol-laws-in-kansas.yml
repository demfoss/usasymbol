page:
  h1: "Weird Alcohol Laws in Kansas"

  quick_answer:
    - "Kansas defined beer at 3.2% alcohol by weight or less as a separate 'cereal malt beverage' in 1937, a category created specifically to dodge the state's own liquor ban."
    - "Kansas did not vote wet until 1948, fifteen years after national Prohibition ended, the longest state-level prohibition in the country."
    - "Kansas still has one fully dry county, Wallace County, where on-premises liquor sales remain prohibited even though 3.2% beer can be sold."

