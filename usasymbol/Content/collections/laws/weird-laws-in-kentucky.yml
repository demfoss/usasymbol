page:
  h1: "Weird Kentucky Laws Still on the Books"
  quick_answer:
    - "Four Kentucky laws check out as real: banning snake handling in church, banning dyed baby chicks, capping cousin marriage at second cousins, and a seasonal hand-fishing rule."
    - "Kentucky's cousin-marriage law only blocks first cousins. Second cousins and more distant relatives can legally marry."
    - "The bikini-highway-escort story and several other viral claims have no confirmed statute or ordinance behind them at any level."
  sources:
    - name: "Kentucky Revised Statutes — Use of Reptiles in Religious Services (437.060)"
