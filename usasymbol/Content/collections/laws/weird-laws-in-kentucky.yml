faq:
  - question: "Is it illegal to handle snakes in church in Kentucky?"
    answer: "Yes. Kentucky law bans displaying, handling, or using any reptile during a religious service or gathering, with a fine of $50 to $100. Lawmakers passed it in the early 1940s in response to Appalachian Pentecostal snake-handling practices."
  - question: "Can first cousins get married in Kentucky?"
    answer: "No. Kentucky voids any marriage between people more closely related than second cousins, which rules out first cousins. Second cousins and more distant relatives can legally marry."
  - question: "Is hand-fishing for catfish legal in Kentucky?"
    answer: "Yes, within limits. Kentucky calls it grabbing, and it's legal from June 1 through August 31 during daylight hours, with a daily catch limit and a ban on lakes smaller than 500 surface acres, aside from a few Ballard County exceptions."
  - question: "Is it illegal to sell dyed baby chicks in Kentucky?"
    answer: "Yes. Selling, dyeing, or displaying colored baby chicks, ducklings, or rabbits is against the law statewide, along with selling baby fowl younger than two months old in groups smaller than six."
  - question: "What is the weirdest law in Kentucky?"
    answer: "The reptile-handling ban is the strongest candidate, since it's a real, still-enforceable statute written specifically to stop snake handling in church. Most of Kentucky's other famous 'weird laws,' like the bikini highway escort story, turn out to be unverified or recycled myths."
  - question: "Does Kentucky really require permission to buy a hat in Owensboro?"
    answer: "No. No ordinance matching this claim exists anywhere in Owensboro's municipal code, and the story has no date or case attached to it."
