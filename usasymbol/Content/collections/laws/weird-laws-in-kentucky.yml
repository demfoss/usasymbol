sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Kentucky That Are Real"
    paragraphs:
      - "A church snake-handling ban and a hard limit on cousin marriage both hold up as genuine statutes once you check the actual code. Real Kentucky Laws You Won't Believe usually turn out narrower than the viral version, but these four are on the books today."
    highlights:
      - name: "Snake Handling in Church Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/kentucky-reptile-religious-ban.jpg"
        description: |
          **Law:** Kentucky makes it illegal to display, handle, or use any reptile during a religious service or gathering.

          **Meaning:** The ban targets snake handling specifically, not owning a pet lizard or running a petting zoo.

          **Reason:** Lawmakers passed the rule in the early 1940s after Appalachian Pentecostal congregations began handling venomous snakes as an act of faith, and the fine still sits at $50 to $100 per offense.
      - name: "You Can't Sell Dyed Baby Chicks or Bunnies"
        status: "Verified"
        image: "/images/collections/laws/kentucky-dyed-baby-chicks.jpg"
        description: |
          **Law:** Selling, dyeing, or displaying colored baby chicks, ducklings, or rabbits is banned statewide, and so is selling any baby fowl younger than two months in a batch smaller than six.

          **Meaning:** Feed stores can't dye an Easter chick pink or sell a single fluffy duckling on impulse.

          **Reason:** The 1966 law followed a wave of Easter-season novelty sales that left families with an animal nobody planned to keep once the dye wore off and the holiday ended.
      - name: "First Cousins Can't Marry, Second Cousins Can"
        status: "Verified"
        image: "/images/collections/laws/kentucky-cousin-marriage.jpg"
        description: |
          **Law:** Kentucky voids any marriage between people more closely related than second cousins.

          **Meaning:** First cousins cannot legally marry in Kentucky, but second cousins and any more distant relative can.

          **Reason:** The rule descends from old consanguinity law written to prevent close-family unions. Kentucky drew its line one generation further out than states that ban cousin marriage outright.
      - name: "Hand-Fishing for Catfish Is Legal, But Only for Three Months"
        status: "Verified"
        image: "/images/collections/laws/kentucky-hand-fishing-grabbing.jpg"
        description: |
          **Law:** Kentucky allows anglers to catch rough fish by hand, a method the state calls grabbing, during a set summer season.

          **Meaning:** Grabbing only runs June 1 through August 31 in daylight hours, with a daily catch limit and a ban on lakes smaller than 500 surface acres.

          **Reason:** Small lakes can't absorb the pressure of hand-caught limits, so regulators fenced the method off to larger waters during the hottest months, when catfish nest in shallow cover.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Kentucky We Couldn't Verify"
    paragraphs:
      - "An Owensboro hat rule is probably the most-repeated Weird Laws in Kentucky claim with zero paper trail behind it. Nobody attaches a date, a case, or an ordinance number to it, and that pattern repeats across the whole category."
    subsections:
      - subtitle: "Throwing Flowers at a Public Speaker Is Illegal"
        status: "Not Verified"
        text: |
          **Claim:** Tossing flowers at someone giving a speech in public is against the law in Kentucky.

          **Why We Couldn't Verify It:** No statute or city ordinance describing this scenario turns up anywhere in Kentucky's code. The claim carries no date, no city, and no case behind it, the usual sign that a listicle repeated a line nobody ever traced back to a real law.
      - subtitle: "A Woman in Owensboro Needs Her Husband's Permission to Buy a Hat"
        status: "Not Verified"
        text: |
          **Claim:** Married women in Owensboro must get their husband's permission before buying a new hat.

          **Why We Couldn't Verify It:** Owensboro's municipal code contains nothing resembling this rule, and no version of the story includes a year or ordinance number. Similar husband-permission jokes get attached to small towns across several states, usually without any of them checking out.
      - subtitle: "Kentucky Requires Annual Bathing"
        status: "Not Verified"
        text: |
          **Claim:** State law requires every Kentucky resident to bathe or shower at least once a year.

          **Why We Couldn't Verify It:** Kentucky's health and sanitation statutes set no minimum bathing frequency for individuals. The line reads like a joke standing in for a general public health code, not an actual requirement anyone has ever cited by number.
      - subtitle: "A Woman Can't Marry the Same Man More Than Three Times"
        status: "Not Verified"
        text: |
          **Claim:** Kentucky law caps how many times a woman can remarry the same husband at three.

          **Why We Couldn't Verify It:** Chapter 402, Kentucky's marriage law, sets no numeric limit on remarrying a former spouse. No court record, bill number, or repealed section matching this claim has ever surfaced.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Kentucky Laws That Are Myths"
    paragraphs:
      - "A landlocked state supposedly regulating whale hunting is the clearest tell in this section. Unusual Laws in Kentucky lists like to recycle the same handful of jokes, and each one collapses as soon as you check what the state's actual code covers."
    subsections:
      - subtitle: "Hunting Whales From a Moving Vehicle Is Illegal"
        status: "Myth"
        text: |
          **Myth:** Kentucky bans hunting from a moving vehicle, except for whales.

          **Reality:** Kentucky is landlocked with no ocean access and no whale population, so the exception has nothing to apply to. General vehicle-hunting restrictions do exist for public-safety reasons involving deer and other game, but the whale clause is a stock punchline recycled across weird-law lists for states nowhere near a coast.
      - subtitle: "Carrying an Ice Cream Cone in Your Pocket Is Illegal"
        status: "Myth"
        text: |
          **Myth:** It's illegal to carry an ice cream cone in your back pocket in Kentucky.

          **Reality:** This exact claim gets pinned on Alabama, Georgia, and several other states depending on who is retelling it. The horse-luring story behind it belongs to old folklore, not to any Kentucky statute ever located.
      - subtitle: "Women Between 90 and 199 Pounds Need a Police Escort in a Bikini"
        status: "Myth"
        text: |
          **Myth:** Women weighing between 90 and 199 pounds can't walk on a highway in a bathing suit without a police escort.

          **Reality:** The oddly specific weight range is a signature of a joke format recycled across dozens of state weird-law lists, each with a different statute number pasted in. Kentucky's actual laws in that part of the code cover unrelated morality offenses, not roadway attire, and no matching ordinance exists at any level.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Kentucky's 30-Day Sessions Let Old Laws Linger"
    paragraphs:
      - "Kentucky's General Assembly meets every year, unlike states that only convene every other year, but the schedule still limits how much old law gets touched. Odd-year sessions cap out at 30 legislative days, while even-year budget sessions get twice that at 60. A 1940s reptile statute or a decades-old marriage rule rarely makes the priority list when lawmakers are racing a 30-day clock against a state budget."
      - "The Legislative Research Commission, Kentucky's nonpartisan research arm since 1948, keeps the Kentucky Revised Statutes updated and searchable online, but its job is publishing the code accurately, not flagging which sections nobody enforces anymore. Repeal takes a bill and floor time, and floor time is the one thing short sessions never have enough of."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Kentucky's reptile-handling law sits in the criminal code's chapter on offenses against public peace, filed near unlawful assembly rather than with any wildlife or religious-freedom statute."
      - "The dyed-baby-animal statute lives inside Kentucky's 'Offenses Against Morality' chapter, the same chapter that covers gambling promotion, not the animal cruelty code most people would guess."
      - "Nevada is the only other state whose marriage statute uses almost the same wording as Kentucky's, barring unions nearer than second cousins."
      - "Kentucky's hand-fishing regulation carves out three Ballard County wildlife-management-area lakes as exceptions to its 500-acre minimum, the only small lakes in the state where the method stays legal."
      - "Owensboro, the city blamed for the husband's-permission hat story, keeps no ordinance archive matching the claim at all."

