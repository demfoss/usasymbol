page:
  h1: "Weird Alcohol Laws in Vermont"

  quick_answer:
    - "Vermont caps a single pour of spirituous liquor at 4 ounces, whether served straight or mixed into one drink, and bars can't legally serve a customer more than two drinks at a time."
    - "All spirits and fortified wine sold in Vermont must pass through the state's own Board of Liquor and Lottery before reaching a store shelf, a full government monopoly on hard liquor."
    - "Happy hour drink specials are barred statewide after 10 p.m., part of a broader set of serving rules built around limiting how fast a customer can drink."

