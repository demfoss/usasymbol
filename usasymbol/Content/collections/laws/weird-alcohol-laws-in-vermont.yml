sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Vermont That Are Real"
    paragraphs:
      - "Vermont regulates how alcohol is served almost as closely as it regulates who can sell it, with rules that reach down to the size of a single pour."
    highlights:
      - name: "A Single Drink Can't Exceed 4 Ounces of Spirits"
        status: "Verified"
        image: "/images/collections/laws/vermont-spirits-pour-limit.jpg"
        anchor_phrases:
          - "4 ounces"
          - "two drinks"
        description: |
          **Law:** Vermont limits spirituous liquor to 4 ounces per serving or per single drink made with it, and bartenders cannot serve more than two drinks to one customer at the same time.

          **Meaning:** A bartender can't legally build a double or triple pour into one cocktail, and can't hand a customer two full drinks in the same round without a second server involved.

          **Reason:** State regulators built the caps directly into licensing rules for on-premise servers, aiming to slow the pace at which a single customer can consume hard liquor.
      - name: "The State Controls Every Bottle of Spirits and Fortified Wine"
        status: "Verified"
        image: "/images/collections/laws/vermont-spirits-monopoly.jpg"
        anchor_phrases:
          - "Board of Liquor and Lottery"
        description: |
          **Law:** All spirits and fortified wine imported or transported into Vermont must go through the state's Board of Liquor and Lottery before reaching retailers.

          **Meaning:** A store cannot source hard liquor or fortified wine directly from a distributor the way it might with beer; the product has to clear the state system first.

          **Reason:** The monopoly structure lets Vermont set uniform pricing and availability for spirits statewide rather than leaving it to private wholesalers.
      - name: "Happy Hour Ends at 10 P.M. Statewide"
        status: "Verified"
        image: "/images/collections/laws/vermont-happy-hour-cutoff.jpg"
        anchor_phrases:
          - "Happy Hour"
          - "10:00 p.m."
        description: |
          **Law:** Vermont bars a licensee from running discounted happy hour drink specials after 10 p.m.

          **Meaning:** A bar can still offer a happy hour price earlier in the evening, but the same discount can't legally continue into late-night hours.

          **Reason:** The cutoff sits alongside Vermont's pitcher-size and pour limits as part of a broader regulatory approach aimed at late-night overconsumption specifically.

  - id: why-vermont-limits-the-pour
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Vermont Regulates the Size of a Drink"
    paragraphs:
      - "Vermont's serving rules go further than most states by reaching directly into how a bartender pours a drink rather than just when and where alcohol can be sold. The 4-ounce spirits cap, the two-drink limit, and the 32-ounce pitcher rule all work together as a single approach: control consumption at the point of service, not just at the point of sale."
      - "That approach traces back to the state's decision after Prohibition to keep spirits under direct government control through the Board of Liquor and Lottery, rather than fully privatizing hard liquor distribution the way many states eventually did. Vermont kept both the wholesale monopoly and the serving limits in place well after most of its regional neighbors loosened similar rules."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Vermont's pitcher-size limit caps beer and wine pitchers at 32 ounces, regardless of how many people are splitting it."
      - "The state's two-drinks-at-once rule applies per customer, not per table, so a group order still has to go drink by drink per person."
      - "Vermont's open container law requires any previously opened bottle to ride in the trunk, not the passenger compartment, of a vehicle."
      - "All spirits sold anywhere in Vermont, from a small-town general store to a Burlington restaurant, pass through the same state liquor control system before reaching a shelf."

