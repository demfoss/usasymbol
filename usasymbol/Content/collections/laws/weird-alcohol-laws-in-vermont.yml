faq:
  - question: "How much liquor can a Vermont bartender pour in one drink?"
    answer: "No more than 4 ounces of spirituous liquor per serving or per single drink made with it. State rules also cap bartenders at serving no more than two drinks to one customer at the same time."

  - question: "Does Vermont control liquor sales directly?"
    answer: "Yes, for spirits and fortified wine. All such products imported into Vermont must pass through the state's Board of Liquor and Lottery before reaching retailers, giving the state direct control over that part of the market."

  - question: "Can bars in Vermont run happy hour all night?"
    answer: "No. Vermont bars discounted happy hour drink specials after 10 p.m. statewide, so a bar can offer earlier-evening pricing but has to stop the discount by that hour."

  - question: "Why does Vermont limit pitcher sizes?"
    answer: "State rules cap beer and wine pitchers at 32 ounces as part of a broader set of serving limits, alongside the 4-ounce spirits cap and two-drink rule, aimed at slowing how quickly a single customer can drink at a licensed establishment."

