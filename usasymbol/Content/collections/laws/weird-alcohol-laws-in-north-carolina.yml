faq:
  - question: "Is moonshine legal in North Carolina?"
    answer: "Only when it is licensed and taxed. Craft distilleries can legally produce and sell moonshine-style spirits under North Carolina Alcoholic Beverage Control Commission rules, but making or selling untaxed, unlicensed spirits remains a criminal offense."

  - question: "Can you buy liquor in North Carolina on Sunday?"
    answer: "Not from a store. Every state-run ABC store in North Carolina closes on Sunday statewide, with no city or county exception. Restaurants and bars can still serve mixed drinks on Sunday under separate rules."

  - question: "What is North Carolina's Brunch Bill?"
    answer: "Senate Bill 155, passed in 2017, lets cities and counties vote to allow restaurants and bars to start serving alcohol at 10 a.m. on Sundays instead of the statewide default of noon. Adoption varies by city, so the earliest legal drink time depends on where you are."

  - question: "Why do North Carolina ABC stores still close on Sundays?"
    answer: "Proposals to let ABC stores open on Sundays have been introduced repeatedly, most recently in 2026, but each attempt has been removed from reform legislation after pushback from religious conservatives in the legislature, leaving the statewide closure in place."

