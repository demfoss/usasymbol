page:
  h1: "Weird Alcohol Laws in North Carolina"

  quick_answer:
    - "North Carolina still treats unlicensed, untaxed spirits, moonshine included, as a criminal offense, even in a state famous for the practice."
    - "Every state-run ABC store in North Carolina closes on Sunday statewide, with no city or county able to opt out of that closure."
    - "The 2017 Brunch Bill let cities and counties allow alcohol sales as early as 10 a.m. on Sundays in restaurants and bars, but only where local government adopted it."

