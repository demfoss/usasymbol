sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in North Carolina That Are Real"
    paragraphs:
      - "North Carolina built one of the country's strictest liquor control systems on top of a region famous for evading exactly that kind of control, and both halves of that history are still on the books."
    highlights:
      - name: "Moonshine Without a License Is Still a Crime"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-moonshine-law.jpg"
        anchor_phrases:
          - "unlicensed, untaxed spirits"
        description: |
          **Law:** North Carolina makes the possession, sale, or production of untaxed spirits, moonshine included, a criminal offense enforced by the state Alcoholic Beverage Control Commission.

          **Meaning:** A backyard still that skips state licensing and tax stamps is illegal no matter how small the batch, even though licensed distilleries can legally sell moonshine-style spirits.

          **Reason:** Western North Carolina's mountains supplied so much illegal "white lightning" to northern cities in the twentieth century that the state built enforcement specifically around untaxed spirits, and that enforcement never went away even as legal craft distilling grew around it.
      - name: "Every State ABC Store Closes on Sunday"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-abc-sunday-closure.jpg"
        anchor_phrases:
          - "closes on Sunday statewide"
        description: |
          **Law:** North Carolina's state-run ABC stores, the only legal source for liquor in the state, close on Sundays with no local variance or city option to stay open.

          **Meaning:** A restaurant or bar can serve a mixed drink on Sunday, but nobody can walk into an ABC store and buy a bottle to take home that same day.

          **Reason:** Lawmakers considered letting ABC stores open on Sundays as recently as 2026, but the provision was stripped from reform legislation after opposition from religious conservatives, leaving the closure intact.
      - name: "Sunday Brunch Drinks Depend on Which City You're In"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-brunch-bill.jpg"
        anchor_phrases:
          - "2017 Brunch Bill"
        description: |
          **Law:** Senate Bill 155, known as the Brunch Bill, lets North Carolina cities and counties vote to allow restaurants and bars to serve alcohol starting at 10 a.m. on Sundays instead of the default noon start.

          **Meaning:** Ordering a mimosa at 10:30 on a Sunday is legal in a city that opted in and against the rules in a city that has not.

          **Reason:** The 2017 law handed the decision to local governments rather than changing the statewide default, so the earlier Sunday start spread city by city as restaurants lobbied their own councils to adopt it.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why North Carolina Still Polices Its Own Moonshine History"
    paragraphs:
      - "North Carolina's moonshine enforcement did not fade once the state legalized craft distilling. Licensed distillers now sell moonshine-style spirits under state control, paying the same taxes and following the same rules as any other liquor producer, which makes the line between legal product and criminal offense entirely about licensing and tax stamps rather than the recipe itself."
      - "The Sunday ABC closure survives for a simpler reason: it has never lost a fight in the legislature. Reform bills keep adding provisions for earlier brunch service and looser happy-hour rules, and Sunday ABC sales keep getting cut from those same bills before a final vote, most recently in 2026."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "North Carolina's Alcoholic Beverage Control Act of 1937 ended statewide prohibition and created the ABC system that still runs every liquor store in the state today."
      - "In 1934, Virginia and South Carolina both rushed to open liquor stores along the North Carolina border to capture the business of North Carolina residents crossing state lines during Prohibition-era restrictions."
      - "The Brunch Bill applies only to restaurants, bars, and other on-premises license holders; it does not touch ABC store hours at all."
      - "North Carolina's ABC Commission still classifies moonshine by whether it carries state tax stamps, not by alcohol content or how it was distilled."

