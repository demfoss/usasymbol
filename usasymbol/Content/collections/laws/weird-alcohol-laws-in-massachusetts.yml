page:
  h1: "Weird Alcohol Laws in Massachusetts"

  quick_answer:
    - "Massachusetts has banned happy hour drink specials since 1984, making it one of the few states where a bar cannot legally sell two-for-one drinks or free rounds."
    - "Liquor stores stayed closed on Sundays for two centuries. The ban did not fully lift until 2003, with morning hours arriving only in 2014."
    - "A population-based quota caps how many liquor licenses a town can hand out, pushing secondary-market license prices as high as $450,000 in Boston."

