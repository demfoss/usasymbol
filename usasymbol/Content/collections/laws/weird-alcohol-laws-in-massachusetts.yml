faq:
  - question: "Is happy hour illegal in Massachusetts?"
    answer: "Yes. Regulation 204 CMR 4.00 has banned time-limited drink discounts, free drinks, and two-for-one specials since 1984, and the rule applies to every bar and restaurant in the state regardless of city or town."

  - question: "Why does Massachusetts ban happy hour drink specials?"
    answer: "The Alcoholic Beverages Control Commission adopted the rule after a 1983 drunk-driving death in Braintree involving a driver who had been drinking during a promotional special. Governor Michael Dukakis signed off on the regulation in 1984, and it has stayed in place through decades of repeal attempts."

  - question: "When did Massachusetts start allowing Sunday liquor sales?"
    answer: "Package stores could open on Sunday afternoons starting in 2003, with year-round Sunday sales following in 2004. A 2014 law then moved the start time from noon to 10 a.m."

  - question: "Why are liquor licenses so expensive in Massachusetts?"
    answer: "A population-based quota, written just after Prohibition, limits how many licenses a town can issue directly. Once a town hits its cap, restaurant owners have to buy an existing license on the secondary market, where prices in Boston have reached $450,000."

