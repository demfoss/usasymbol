sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Massachusetts That Are Real"
    paragraphs:
      - "Massachusetts regulates alcohol through a mix of century-old blue laws and rules written just after Prohibition, and several of them still shape how the state drinks today."
    highlights:
      - name: "Happy Hour Has Been Illegal Since 1984"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-happy-hour-ban.jpg"
        anchor_phrases:
          - "happy hour"
          - "204 CMR 4.00"
        description: |
          **Law:** Regulation 204 CMR 4.00 bans time-limited drink discounts statewide, along with free drinks, two-for-one specials, and pitchers sold for one person.

          **Meaning:** A bartender cannot run a Friday drink special, hold a game that awards alcohol as a prize, or price a larger drink the same as a smaller one.

          **Reason:** The Alcoholic Beverages Control Commission adopted the rule in 1984 after a drunk-driving death in Braintree tied to a promotional drink deal, and repeal bills have failed ever since.
      - name: "Liquor Stores Stayed Closed on Sundays for Two Centuries"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-sunday-blue-law.jpg"
        anchor_phrases:
          - "closed on Sundays"
        description: |
          **Law:** A colonial-era blue law barred package stores from opening on Sundays until 2003, when the state allowed noon openings, followed by year-round Sunday hours in 2004.

          **Meaning:** Even after that repeal, stores still could not open before noon on Sundays until a 2014 law moved the start time back to 10 a.m.

          **Reason:** Pressure from tailgating Patriots fans and shoppers crossing into New Hampshire for unrestricted hours finally pushed lawmakers to end the ban.
      - name: "A Town Can Only Hold So Many Liquor Licenses"
        status: "Verified"
        image: "/images/collections/laws/massachusetts-liquor-license-quota.jpg"
        anchor_phrases:
          - "liquor licenses"
          - "secondary market"
        description: |
          **Law:** State law caps how many on-premises and package-store licenses a municipality can issue, often near one license per 2,000 residents.

          **Meaning:** Once a town reaches its quota, a new restaurant cannot get a license directly from the state and has to buy one on the secondary market instead.

          **Reason:** The formula dates to just after Prohibition and has never been rewritten for how many restaurants a modern town supports, which is why secondary-market licenses in Boston have sold for as much as $450,000.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Happy Hour Ban Has Outlasted Every Repeal Bill"
    paragraphs:
      - "Kathleen Barry, 20, died in a 1983 drunk-driving crash in Braintree after the driver had been drinking at a bar running a promotional special. Governor Michael Dukakis and the Alcoholic Beverages Control Commission responded the next year with 204 CMR 4.00, the regulation still known as the happy hour ban."
      - "More than 40 other states allow some form of drink specials today, and Massachusetts lawmakers have introduced repeal bills more than once. Every version has stalled, in part because reversing a rule tied directly to a named drunk-driving death carries more political risk than leaving it alone."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Massachusetts adopted the happy hour ban through 204 CMR 4.00, a regulation enforced by the Alcoholic Beverages Control Commission rather than a law passed by the Legislature."
      - "The ban covers more than pricing: it also bars a bar from holding a contest that awards alcohol as a prize."
      - "The Sunday liquor-store ban lasted from the colonial era until 2003, one of the longest-running blue laws in the country."
      - "Massachusetts is one of only 17 states that caps the number of liquor licenses a town can hold using a population formula."

