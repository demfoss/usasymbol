page:
  h1: "Strange Montana Laws Still in Effect Today"
  quick_answer:
    - "Four Montana weird-law claims check out: hunting from a vehicle, aerial hunting permits, common-law marriage, and a Billings pet rat ban."
    - "The vehicle-hunting law is narrower than people think. It bans shooting from a truck, not driving to a hunting spot."
    - "A sheep-in-the-truck rule and a horse-in-a-bar rule are unverified, and a runaway railroad-sheep story is really just an ordinary vandalism law."
