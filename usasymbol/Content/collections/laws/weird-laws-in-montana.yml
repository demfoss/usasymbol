sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Montana That Are Real"
    paragraphs:
      - "A statute banning gunfire from inside a moving truck anchors the strongest of the Real Montana Laws You Won't Believe that hold up against the actual code. All four below are still active parts of state or city law today."
    highlights:
      - name: "You Can't Hunt From a Vehicle"
        status: "Verified"
        image: "/images/collections/laws/montana-vehicle-hunting-ban.jpg"
        description: |
          **Law:** Montana bans shooting or attempting to shoot any game animal or game bird from a self-propelled, motor-driven, or drawn vehicle.

          **Meaning:** Driving to a hunting spot is fine. Firing a weapon from inside or on top of the truck itself is not, and a conviction brings a fine, possible jail time, and a loss of hunting privileges for at least two years.

          **Reason:** Wardens wrote the rule to stop road hunting, where a vehicle turns into a moving blind and gives animals no real chance to react, undercutting the fair-chase standard hunters are expected to follow.

      - name: "Aerial Hunting Requires a State Permit"
        status: "Verified"
        image: "/images/collections/laws/montana-aerial-hunting-permit.jpg"
        description: |
          **Law:** Montana prohibits aerial hunting of predatory animals from an aircraft unless the hunter holds a permit issued by the Department of Livestock.

          **Meaning:** Chasing or shooting coyotes and similar predators from a plane sounds like a myth, but it is a licensed, regulated activity with its own residency rules and application deadline.

          **Reason:** Ranchers have used aircraft to control predator losses on open range for decades, so lawmakers built a permit system instead of banning the practice outright.

      - name: "Common-Law Marriage Is Still Legal"
        status: "Verified"
        image: "/images/collections/laws/montana-common-law-marriage.jpg"
        description: |
          **Law:** Montana is one of the few remaining states that recognizes a marriage formed without a ceremony or license.

          **Meaning:** Couples must show mutual agreement to be married, cohabitation, and public reputation as spouses before a court will treat the relationship as a legal marriage.

          **Reason:** Rural distances and limited access to courthouses or clergy made ceremonial marriage impractical for many early Montana settlers, and the state never wrote the informal option out of its code.

      - name: "Billings Banned Pet Rats"
        status: "Verified"
        image: "/images/collections/laws/montana-billings-rat-ban.jpg"
        description: |
          **Law:** Billings city code makes it unlawful to sell, keep, or bring a pet rat into city limits.

          **Meaning:** The ban exempts rats raised as feed for reptiles or birds of prey, plus rats used in legitimate research or classroom programs.

          **Reason:** City records tie the rule to public-health concerns and a well-known standoff involving a resident housing dozens of rats in a downtown motel room, an incident locals still bring up decades later.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Montana We Couldn't Verify"
    paragraphs:
      - "A pickup-truck chaperone requirement for sheep is the most repeated of the Weird Laws in Montana claims with no ordinance behind it, and a saloon door rule for horses runs a close second."
    subsections:
      - subtitle: "A sheep can't ride in your truck cab without a chaperone"
        status: "Not Verified"
        text: |
          **Claim:** Montana requires a second person to accompany any sheep riding inside the cab of a truck.

          **Why We Couldn't Verify It:** No statute or county ordinance naming sheep, truck cabs, or a chaperone requirement turns up anywhere in the Montana Code. The claim shows up on dozens of listicles with identical wording but never a section number, which usually means nobody traced it to an actual source.

      - subtitle: "It's illegal to bring a horse into a bar"
        status: "Not Verified"
        text: |
          **Claim:** Montana law bars horses and pack mules from entering a saloon or tavern.

          **Why We Couldn't Verify It:** At least one Montana law firm's own review of the state's weird-law claims lists this one as unconfirmed. No bar-specific animal statute has surfaced, and the story likely grew out of general nuisance or health-code rules that already cover animals in food-service establishments.

      - subtitle: "Honking near a sandwich shop after 9 p.m. is against the law"
        status: "Not Verified"
        text: |
          **Claim:** Sounding a car horn in front of a sandwich shop after nine at night breaks a Montana law.

          **Why We Couldn't Verify It:** No city or state noise ordinance singles out sandwich shops specifically. Generic nighttime noise rules exist in many Montana towns, and this claim appears to be an oddly specific mutation of one of those ordinary rules.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Montana Laws That Are Myths"
    paragraphs:
      - "A runaway story about sheep and a train is the clearest myth among these Weird Montana Laws Still on the Books, and a fishing rule aimed only at married women tells a similar, recycled story."
    subsections:
      - subtitle: "Guiding a sheep onto railroad tracks to injure a train carries five years or a $50,000 fine"
        status: "Myth"
        text: |
          **Myth:** A specific Montana statute punishes leading a sheep onto railroad tracks with intent to derail or damage a train.

          **Reality:** Montana does criminalize interfering with railroad property and equipment, but the actual code has no sheep-specific clause and no version of that exact penalty. The sheep detail is a colorful embellishment layered onto an ordinary vandalism and railroad-interference law that applies to any object or method, not livestock in particular.

      - subtitle: "A married woman can't fish alone in Montana"
        status: "Myth"
        text: |
          **Myth:** Montana law forbids a married woman from fishing without her husband present, except on Sundays.

          **Reality:** No such restriction exists anywhere in Montana's fish and game code. Versions of this exact claim, sometimes with a different day of the week swapped in, circulate on generic weird-law lists for several other states too, a strong sign it was never tied to real Montana law at all.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Montana's 90-Day Legislature Lets Old Rules Linger"
    paragraphs:
      - "Montana's constitution caps the legislature at 90 regular session days, and only in odd-numbered years. Lawmakers spend that limited window fighting over budgets, water rights, and current bills, leaving almost no time to hunt down obscure statutes for repeal. Billings and other cities operate their own separate municipal codes on top of that, so a local rule like the pet rat ban can sit untouched for decades without a single state office reviewing it."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Montana's aerial hunting permit system runs on an annual cycle, valid every February 1 through the following January 31, with a separate application deadline each January."
      - "Resident landowners can aerially hunt predatory animals over their own property without a permit at all, as long as they file a written notice with the state first."
      - "The vehicle-hunting law still lets someone spot game from a truck window. The line falls at pulling the trigger, not at looking."
      - "Billings appears to be the only Montana city with a rat-specific ban written into its animal code, while most other Montana towns regulate pets with no mention of rodents."
      - "A conviction under Montana's vehicle-hunting law can cost a hunter two full years of hunting and fishing privileges statewide, on top of any fine."

