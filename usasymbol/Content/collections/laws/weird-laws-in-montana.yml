faq:
  - question: "Is it illegal to hunt from a vehicle in Montana?"
    answer: "Yes. Shooting or attempting to shoot a game animal or game bird from a self-propelled or drawn vehicle is illegal statewide. Driving to a hunting location is not affected, only firing a weapon from the vehicle itself."
  - question: "Does Montana still recognize common-law marriage?"
    answer: "Yes, Montana is one of a small number of states that still recognizes marriage without a license or ceremony, as long as a couple can show mutual agreement, cohabitation, and public reputation as spouses."
  - question: "Can you really hunt predators from an airplane in Montana?"
    answer: "With a permit, yes. The Department of Livestock issues aerial hunting permits for predatory animals, and resident landowners can hunt over their own land without one at all."
  - question: "Why did Billings ban pet rats?"
    answer: "City code bars keeping, selling, or bringing rats into Billings as pets, with exceptions for research, education, and reptile or bird-of-prey feed. Locals often trace the rule back to a notorious 1990s standoff involving dozens of rats kept in a downtown motel room."
  - question: "Is the Montana sheep-on-the-railroad-tracks law real?"
    answer: "Not as commonly described. Montana does punish railroad vandalism and interference, but no version of the code names sheep specifically or spells out a $50,000 fine tied to livestock."
  - question: "What is the weirdest real law still on the books in Montana?"
    answer: "The aerial hunting permit surprises the most people, mainly because shooting predators from an airplane sounds invented. It is a real, licensed activity with its own application window and residency rules."
