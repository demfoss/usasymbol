  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Unenforceable Rules Stay on the Books — and the Internet"
    paragraphs:
      - "Florida municipalities have never conducted systematic audits of dead-letter provisions. Beach towns passed public conduct ordinances throughout the early twentieth century — rules about swimwear, noise, and public behavior that had a purpose in 1935 and no constituency to repeal them by 1980. Most of those rules quietly stopped being enforced without being formally removed. Some were repealed when enabling state law changed; others just accumulated."
      - "The internet generalization problem is separate: a Sarasota ordinance gets copied to a list site without a citation, the city name drops off the next copy, and by the third iteration it is a 'Florida state law.' The claims that survive longest online tend to be the ones that were never sourced in the first place — there is no authoritative document to contradict them."

