faq:
  - question: "What is the weirdest Florida law that is actually real?"
    answer: "The unlimited homestead exemption is the most consequential: no dollar cap on the home it protects from creditors. O.J. Simpson's Miami-area home was shielded under it from the Goldman family's $33.5 million civil judgment. The dwarf tossing law has the most unusual arc, banned in 1989 and repealed in 2011 after the person it was meant to protect testified it cost him income."

  - question: "What is the Romeo and Juliet law in Florida?"
    answer: "It lets a person already on the sex offender registry petition a court for removal, but only after conviction, and only when the offense was consensual, the age gap was four years or less, and the younger person was at least 14. A court decides case by case. It doesn't decriminalize anything and can't be used as a trial defense."

  - question: "Is it illegal to sing in a swimsuit in Florida?"
    answer: "No ordinance matching this claim has been found in Florida statutes, the Sarasota municipal code, or any historical record. It's circulated on internet lists for over twenty years without a source ever being cited."

  - question: "Are weird Florida laws state laws or local ordinances?"
    answer: "The four confirmed real laws here are all state-level, one constitutional rule and three statutes. The unverified claims have no confirmed source at any level. Florida has more than 400 incorporated municipalities, each with its own code, which is how a city-specific rule can end up described as a statewide Florida law."

  - question: "What happened with Florida's dwarf tossing law?"
    answer: "Florida banned dwarf tossing at licensed bars in 1989, the first state to do so. In 2011, Dave Flood, a Florida little person, testified that the ban blocked him from earning a living through an activity he had freely chosen, and the Legislature repealed it that same year."
