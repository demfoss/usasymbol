      - "O.J. Simpson's Miami-area home was shielded from the Goldman and Brown families' $33.5 million civil judgment by the homestead exemption — the Goldmans could not force a sale of the property"
      - "Florida was the first U.S. state to ban dwarf tossing (1989) and the first to repeal that ban (2011) — the repeal came after Dave Flood, a Florida little person, testified the ban cost him income"
      - "The Romeo and Juliet law (§ 943.04354, enacted 2007) is a court petition process, not a consent-law exemption — it does not prevent prosecution and cannot be used as a trial defense"
