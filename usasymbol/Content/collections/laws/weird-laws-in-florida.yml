faq:
  - question: "What is the weirdest Florida law that is actually real?"
    answer: "The unlimited homestead exemption (Art. X § 4) is the most consequential: no dollar cap, no limit on the value of the residence protected from creditors. O.J. Simpson's Miami-area home was shielded under it from the Goldman family's $33.5 million civil judgment. The dwarf tossing statute (§ 561.665) has the most unusual arc: Florida enacted the ban in 1989 and repealed it in 2011 after Dave Flood, the person the law was meant to protect, testified it prevented him from earning a living."

  - question: "What is the Romeo and Juliet law in Florida?"
    answer: "Florida Statute § 943.04354, enacted in 2007, lets a person on the sex offender registry petition a court for removal if: the offense was consensual, the offender was 18 or younger or no more than four years older than the victim, the victim was at least 14, and no other qualifying offenses are on record. The court decides — removal is not automatic. The law does not decriminalize anything, does not prevent prosecution, and cannot be used as a trial defense. It applies only after conviction, to cases where lifetime registration is disproportionate to the conduct."

  - question: "Is it illegal to sing in a swimsuit in Florida?"
    answer: "No ordinance matching this claim has been found — not in Florida statutes, not in the Sarasota municipal code, and not in historical records. The claim has been on internet lists for over twenty years without a source citation appearing. It is unverified."

  - question: "Are weird Florida laws state laws or local ordinances?"
    answer: "The four confirmed real laws here are all state-level — a constitutional provision and three statutes (two current, one repealed). The unverified claims have no confirmed source at any level. Claims attributed to a specific city could be local ordinances, but most have not been confirmed even there. Florida has over 400 incorporated municipalities, each with its own code — that is how a Sarasota-specific rule ends up being described as a Florida state law on list sites."

  - question: "What happened with Florida's dwarf tossing law?"
    answer: "Florida Statute § 561.665 banned dwarf tossing in licensed bars — the first such law in the country, passed in 1989. In 2011, Dave Flood, a Florida little person, testified before the legislature that the ban prevented him from earning a living through participation he had freely chosen. The legislature repealed § 561.665 via HB 4063."
