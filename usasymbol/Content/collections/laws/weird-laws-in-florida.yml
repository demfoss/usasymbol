      url: "https://www.leg.state.fl.us/statutes/"

sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Florida That Are Real"
    paragraphs:
      - "Several Unusual Laws in Florida hold up once you read the actual text, and one even made national news through the O.J. Simpson case. A couple depend on broad carve-outs, and one was eventually repealed by the very person it was supposed to protect."
    highlights:
      - name: "The Homestead Rule That Has No Dollar Limit"
        status: "Verified"
        image: "/images/collections/laws/florida-homestead-exemption.jpg"
        anchor_phrases:
          - "no-cap homestead rule"
          - "homestead rule"
        description: |
          **Law:** Florida's constitution protects a primary residence from forced sale by most creditors, and unlike many states it puts no dollar cap on the home's value.

          **Meaning:** That is why O.J. Simpson could shield his Miami-area home from a $33.5 million civil judgment.

          **Reason:** The rule began as a family-protection measure, but in modern Florida it can also protect very expensive property.
      - name: "Romeo and Juliet Relief Is a Court Petition, Not an Exemption"
        status: "Verified"
        image: "/images/collections/laws/florida-romeo-juliet-law.jpg"
        anchor_phrases:
          - "Romeo and Juliet registry-relief law"
          - "Romeo and Juliet law"
        description: |
          **Law:** This law lets someone already on the sex offender registry ask a court for removal in a narrow group of consensual age-gap cases.

          **Meaning:** It does not stop prosecution and it does not erase the conviction; it simply creates a later path off the registry.

          **Reason:** Florida's old system treated some teenage relationships too much like predatory crimes.
      - name: "Buying Fireworks Just Means Signing a Form"
        status: "Verified"
        image: "/images/collections/laws/florida-fireworks-exception.jpg"
        anchor_phrases:
          - "fireworks agricultural exception"
        description: |
          **Law:** Florida bans the sale of most consumer fireworks, but a real exception covers fireworks bought to scare birds away from farms and fish hatcheries.

          **Meaning:** That old agricultural carve-out became the loophole roadside fireworks stores still rely on today.

          **Reason:** In practice, signing the paper often mattered more than actually having crops to protect.
      - name: "Florida Banned, Then Un-Banned, Dwarf Tossing"
        status: "Verified"
        image: "/images/collections/laws/florida-dwarf-tossing-repealed.jpg"
        anchor_phrases:
          - "dwarf-tossing ban"
        description: |
          **Law:** Florida became the first state to ban dwarf tossing at licensed bars in 1989.

          **Meaning:** In 2011, Dave Flood argued that the ban took away income from an activity he had chosen for himself, and lawmakers repealed it.

          **Reason:** The strangest part is the reversal itself: the person the law was meant to protect helped end it.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Florida We Couldn't Verify"
    paragraphs:
      - "Some Weird Laws in Florida claims have been repeated for so long that people assume a citation must exist somewhere. But these examples still circulate without any actual ordinance, statute, or date of passage behind them."
    subsections:
      - subtitle: "Singing in Public in a Swimsuit Is Illegal in Sarasota"
        status: "Not Verified"
        anchor_phrases:
          - "singing in a swimsuit"
        text: |
          **Claim:** Singing in public in a swimsuit is illegal in Sarasota.

          **Why We Couldn't Verify It:** No provision in the Sarasota code or Florida statutes matches this story. It has been tied to Sarasota for decades, which makes it look more like a durable local rumor than a real law anyone can actually cite.
      - subtitle: "Tying an Elephant to a Sarasota Parking Meter Requires Paying the Meter"
        status: "Not Verified"
        text: |
          **Claim:** Tying an elephant to a Sarasota parking meter requires paying the meter.

          **Why We Couldn't Verify It:** Sarasota really was the winter home of Ringling Bros. and Barnum & Bailey Circus, which is exactly why this rumor sounds plausible. But no current or historical ordinance text has been found showing that the joke ever began as a real law.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Florida Laws That Are Myths"
    paragraphs:
      - "Some Strange Florida Laws claims are not just unverified. They fall apart as soon as you look for a statute number, a city code, or even a consistent origin story."
    subsections:
      - subtitle: "Unmarried Women Can't Parachute on Sundays"
        status: "Myth"
        anchor_phrases:
          - "unmarried women parachuting on Sundays"
        text: |
          **Myth:** Unmarried women can't parachute on Sundays.

          **Reality:** No source has ever been produced for this claim: no statute number, no county, no date, no ordinance. It survives because generic weird-law lists keep recycling it, sometimes attaching the same story to other states.
      - subtitle: "Women Can't Fall Asleep Under a Hair Dryer in a Salon"
        status: "Myth"
        anchor_phrases:
          - "sleeping under a salon hair dryer"
        text: |
          **Myth:** Women can't fall asleep under a hair dryer in a salon.

          **Reality:** Florida really does regulate salons, but through normal cosmetology rules about licensing, sanitation, and equipment safety. The sleeping-under-a-dryer version is the comic exaggeration, not an actual rule anyone wrote into law.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Unenforceable Rules Stay on the Books"
    paragraphs:
      - "Florida has never run a systematic audit of dead-letter ordinances. Beach towns passed public-conduct rules throughout the early twentieth century, covering swimwear, noise, and behavior that made sense in 1935 and then simply outlived the era that produced them. Many were never formally cleaned out of the legal conversation even after enforcement faded away."
      - "Local claims also lose their city names as they get copied from one list site to another. A supposed Sarasota rule can gradually turn into a statewide Florida law online, even when no statute or ordinance text exists anywhere to support it."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Florida's homestead protection dates back to the state's 1868 constitution, making it one of the oldest consumer-debt protections still active in any U.S. state."
      - "The Romeo and Juliet law was written because Florida's registry made no distinction between a predatory repeat offender and a teenager convicted of consensual conduct with a classmate."
      - "Florida has more than 400 incorporated municipalities, each running its own code, which is how a single city's rule can end up mislabeled as a statewide Florida law."
      - "The agricultural fireworks exception predates Florida's modern roadside fireworks retail industry, which grew up around the carve-out rather than the other way around."

