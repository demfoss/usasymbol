page:
  h1: "Unusual Laws in Florida"

  quick_answer:
    - "Four commonly cited Florida laws are real: the no-cap homestead rule, the Romeo and Juliet registry-relief law, the fireworks agricultural exception, and the now-repealed dwarf-tossing ban."
    - "The homestead rule has no dollar cap, which is why O.J. Simpson used it to shield his Miami-area home from a $33.5 million civil judgment. The Romeo and Juliet law is a post-conviction petition for registry relief, not a defense at trial."
    - "Claims about singing in a swimsuit, unmarried women parachuting on Sundays, and sleeping under a salon hair dryer have no confirmed statute or ordinance behind them."

  sources:
    - name: "Florida Statutes — Chapter 791 (Fireworks)"
      url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799/0791/0791.html"
    - name: "Florida Statutes — § 943.04354 (Romeo and Juliet)"
      url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0900-0999/0943/Sections/0943.04354.html"
