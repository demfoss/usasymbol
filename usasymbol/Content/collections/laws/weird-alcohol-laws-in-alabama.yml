sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Alabama Alcohol Laws That Are Real"
    paragraphs:
      - "Alabama's alcohol code still carries the fingerprints of the control-state system built after Prohibition. Three rules show how that system reaches from the ABC store counter into modern wine shipping and county-level votes."
    subsections:
      - subtitle: "Wineries Can Ship Only Twelve Cases a Year"
        status: "Verified"
        image: "/images/collections/laws/alabama-wine-shipping-cap.jpg"
        anchor_phrases:
          - "twelve cases of wine"
          - "Direct Wine Shipper License"
        text: |
          **Law:** Since August 2021, a winery holding a Direct Wine Shipper License can ship up to twelve cases of wine a year to an Alabama household.

          **Meaning:** Retailers cannot use this license at all, and shipments cannot go to a school, dorm, prison, healthcare facility, or any address already licensed by the ABC Board. Beer and spirits still cannot be shipped to a home under any license.

          **Reason:** Alabama also requires the fulfillment centers that pack and route those shipments to hold their own state license, making it one of the few states to regulate that link of the supply chain directly rather than trusting it to self-report.
      - subtitle: "Every Bottle of Liquor Passes Through a State Store"
        status: "Verified"
        image: "/images/collections/laws/alabama-abc-store-monopoly.jpg"
        anchor_phrases:
          - "ABC store"
          - "state-run store"
        text: |
          **Law:** Alabama is a control state for spirits, meaning distilled liquor is sold only through ABC stores the state owns and operates, while beer moves through separately licensed private wholesalers.

          **Meaning:** A private retailer cannot simply stock hard liquor next to beer and wine the way a grocery store in a license state can.

          **Reason:** The ABC Board also limits itself to four price-change dates a year, each requiring 60 days' notice, a holdover from a system designed to keep liquor pricing centrally controlled rather than left to store-level competition.
      - subtitle: "Dry Counties Still Outnumber Fully Wet Ones"
        status: "Verified"
        image: "/images/collections/laws/alabama-dry-counties-map.jpg"
        anchor_phrases:
          - "dry counties"
          - "local option"
        text: |
          **Law:** Alabama has allowed counties and cities to vote themselves wet or dry by local referendum since Prohibition ended in 1933, and roughly two dozen of the state's 67 counties are still dry or only partially wet.

          **Meaning:** A dry county can still contain wet cities inside it, so the map looks less like a clean line and more like a patchwork.

          **Reason:** The last Alabama county that was fully dry voted to go wet only in the past decade, showing how long a Prohibition-era local-option rule can keep outliving the vote that first created it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Alabama Still Regulates Alcohol Like a Control State"
    paragraphs:
      - "Alabama's 1933 repeal of statewide Prohibition never fully repealed the instinct behind it. Lawmakers kept the state itself as the seller of hard liquor rather than licensing private stores, and they let individual counties opt out of alcohol sales entirely if local voters wanted to."
      - "That same instinct shows up in how Alabama treats internet-era wine shipping. Rather than opening the door to any out-of-state retailer, the 2021 law kept the state firmly in the loop by capping shipments at twelve cases, restricting the license to wineries only, and adding a fulfillment-center license nobody was required to hold before. The tool changed from a store counter to a shipping label, but the underlying idea, that alcohol distribution should run through a channel the state can track, has not."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Alabama's ABC Board can only change liquor prices on four set dates each year: February 1, May 1, August 1, and November 1."
      - "Alabama was the third state in the country to require fulfillment centers used for wine shipping to carry their own license."
      - "A winery shipping wine into Alabama cannot address a package to a mailbox, a locker, or any premises already holding an ABC license."
      - "Alabama's last fully dry county went wet within the past decade, meaning every county in the state now has at least one location where alcohol is legally sold."

