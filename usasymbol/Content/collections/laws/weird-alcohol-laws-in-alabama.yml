page:
  h1: "Weird Alcohol Laws in Alabama"

  quick_answer:
    - "Alabama caps direct wine shipments to residents at twelve cases a year, and only wineries, not retailers, can ship at all. Beer and spirits cannot be shipped directly to a home under any circumstance."
    - "Every bottle of liquor sold in Alabama passes through a state-run ABC store or a licensed wholesaler. There is no private retail channel for spirits."
    - "About two dozen of Alabama's 67 counties remain dry or partially dry today, even though nearly every town of any size inside them has voted itself wet."

