faq:
  - question: "Can wineries ship wine directly to homes in Alabama?"
    answer: "Yes, but only wineries holding a Direct Wine Shipper License, and only up to twelve cases per household each year. Retailers cannot ship wine to Alabama consumers, and beer and spirits cannot be shipped directly to a home under any license."

  - question: "Why can't you buy liquor at a regular store in Alabama?"
    answer: "Alabama is a control state for spirits, so distilled liquor is sold only through ABC stores the state itself owns and operates. Beer is handled differently, moving through licensed private wholesalers rather than state stores."

  - question: "Are there still dry counties in Alabama?"
    answer: "About two dozen of Alabama's 67 counties remain dry or partially dry today. Counties and cities have been able to vote themselves wet or dry by local referendum since Prohibition ended in 1933, and even a dry county typically has wet cities inside it."

  - question: "Does Alabama require a license to run a wine fulfillment center?"
    answer: "Yes. Alabama was the third state to require fulfillment centers, the companies that pack and route wine shipments to consumers, to hold their own state license, adding a layer of oversight most states leave unregulated."

