sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in North Dakota That Are Real"
    paragraphs:
      - "A restaurant in Bismarck really can let you walk out with a half-finished bottle of wine, and it ranks among the Weird North Dakota Laws Still on the Books once you read the actual code."
    highlights:
      - name: "Restaurants Can Let You Take Home Leftover Wine"
        status: "Verified"
        image: "/images/collections/laws/north-dakota-wine-carryout.jpg"
        anchor_phrases:
          - "wine-recorking rule"
          - "wine carryout law"
        description: |
          **Law:** North Dakota lets certain restaurants send a partly finished bottle of wine home with a customer.

          **Meaning:** The bottle has to be resealed so it is obvious if it gets reopened, and it only applies at places where food makes up at least thirty percent of what they sell compared to alcohol.

          **Reason:** Lawmakers wanted to separate real restaurants from bars pouring drinks with little food service, so the food-sales threshold became the test for who qualifies.
      - name: "Grand Forks Allows Pet Potbellied Pigs, With Limits"
        status: "Verified"
        image: "/images/collections/laws/north-dakota-potbellied-pig.jpg"
        anchor_phrases:
          - "pet-pig ordinance"
          - "miniature pig ordinance"
        description: |
          **Law:** Grand Forks bans most farm animals inside city limits, but carves out an exception for registered miniature potbellied pigs.

          **Meaning:** A household can keep up to two pigs, and each one has to stay under about a hundred pounds and be at least six months old before it counts.

          **Reason:** City leaders were responding to a real trend of people keeping small pet pigs and needed a way to allow them without opening the door to full-size livestock in residential yards.
      - name: "The Sunday Shopping Ban Was Real Until 2019"
        status: "Repealed"
        image: "/images/collections/laws/north-dakota-blue-law-repeal.jpg"
        anchor_phrases:
          - "Sunday closing law"
          - "blue law repeal"
        description: |
          **Law:** North Dakota once forced most retailers to stay closed from midnight until noon every Sunday.

          **Meaning:** Grocery stores were exempt, but stores selling clothing, jewelry, vehicles, and building supplies had to wait until midday to open their doors.

          **Reason:** The rule traced back to old Sabbath-observance laws carried over from territorial days. Lawmakers finally repealed it in 2019 after a close vote, ending one of the country's strictest Sunday sales rules.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in North Dakota We Couldn't Verify"
    paragraphs:
      - "No statute number or city ordinance backs up the most common Weird Laws in North Dakota claims that keep circulating on list sites."
    subsections:
      - subtitle: "Falling Asleep With Your Shoes On Is Illegal"
        status: "Not Verified"
        anchor_phrases:
          - "sleeping with shoes on"
        text: |
          **Claim:** You can get in trouble for falling asleep with your shoes on in North Dakota.

          **Why We Couldn't Verify It:** No Century Code section or municipal ordinance matching this claim shows up anywhere official. It reads like old boarding-house etiquette that got retold as a law somewhere along the way, with no state or city ever named as the source.
      - subtitle: "Fargo Bans Wearing a Hat to a Dance"
        status: "Not Verified"
        anchor_phrases:
          - "hat-at-a-dance rule"
        text: |
          **Claim:** Wearing a hat while dancing can get you arrested in Fargo.

          **Why We Couldn't Verify It:** Fargo's city code has no dance-hall provision addressing hats. The claim has no date, no case, and no ordinance number attached to it, which is usually a sign it was invented for a listicle rather than pulled from an actual code book.
      - subtitle: "Fargo Requires a Permit to Kill a Pigeon"
        status: "Not Verified"
        anchor_phrases:
          - "pigeon-killing permit"
        text: |
          **Claim:** You need a city permit before killing a pigeon in Fargo, even on your own property.

          **Why We Couldn't Verify It:** Fargo's animal control rules cover nuisance wildlife generally, but no specific pigeon-permit requirement turns up in the published code. Pest control disputes involving birds are common enough that a plausible-sounding rumor like this one tends to stick around.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange North Dakota Laws That Are Myths"
    paragraphs:
      - "Recycled jokes and garbled rules explain most of what shows up under Real North Dakota Laws You Won't Believe, since none of these three claims trace back to an actual statute."
    subsections:
      - subtitle: "Bars Can't Serve Beer and Pretzels at the Same Time"
        status: "Myth"
        anchor_phrases:
          - "beer and pretzels law"
        text: |
          **Myth:** North Dakota bars are not allowed to serve beer and pretzels together.

          **Reality:** No such statute exists anywhere in the Century Code. The story most likely grew out of real food-to-alcohol sales ratio rules, like the one governing wine carryout, that get twisted into a claim about snacks. Pretzels next to a beer have never been illegal here.
      - subtitle: "It Was Once Legal to Shoot Native Americans From a Covered Wagon"
        status: "Myth"
        text: |
          **Myth:** An old North Dakota law supposedly allowed settlers to shoot Native Americans on horseback from a covered wagon.

          **Reality:** This claim has no statute, date, or court record attached to it anywhere. Versions of the same story get recycled across several Western states' weird-law lists with almost identical wording, which is the clearest sign it never came from an actual code.
      - subtitle: "Horses Are Banned From Sleeping in Bathtubs"
        status: "Myth"
        text: |
          **Myth:** North Dakota law bans horses from sleeping in bathtubs.

          **Reality:** Livestock-in-the-house jokes like this one show up on generic weird-law lists for dozens of states with the same premise swapped in. No North Dakota ordinance regulates where a horse can sleep, in a bathtub or otherwise.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why North Dakota's 80-Day Legislature Leaves Old Rules Alone"
    paragraphs:
      - "North Dakota's Constitution caps regular legislative sessions at eighty days across a two-year biennium, and lawmakers only convene starting in January of odd-numbered years. Cleaning up a narrow, rarely enforced statute almost never beats out live budget and policy fights for that limited floor time."
      - "That short calendar is also why a rule as sweeping as the Sunday shopping ban lasted into 2019. Once a law sits quietly on the books without causing daily problems, it can take decades before any legislative session has room to touch it."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "North Dakota is one of only four states, alongside Montana, Nevada, and Texas, where the legislature meets just once every two years."
      - "The 2019 repeal of the Sunday closing law passed the state Senate by only four votes, 25 to 21."
      - "North Dakota's lawmakers are part-time citizen legislators. Farmers, lawyers, and small-business owners return to their regular jobs the moment a session ends."
      - "North Dakota still bans off-sale liquor purchases between 2 a.m. and 8 a.m. on Sundays, a narrower leftover from the same era as the old blue laws."
      - "Fireworks sales in North Dakota are restricted to licensed nonprofit organizations, not open retailers, statewide."

