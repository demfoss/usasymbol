page:
  h1: "Unusual Laws in North Dakota You Won't Believe Are Real"

  quick_answer:
    - "Three real North Dakota rules hold up: a restaurant wine-recorking law, a Grand Forks pet-pig ordinance, and a Sunday sales ban repealed only in 2019."
    - "The famous beer-and-pretzels story is not a real statute. It likely grew out of a genuine food-to-alcohol sales ratio rule written for a different purpose."
    - "Claims like sleeping with your shoes on or hunting Native Americans from a covered wagon have no statute behind them and are internet fiction."

