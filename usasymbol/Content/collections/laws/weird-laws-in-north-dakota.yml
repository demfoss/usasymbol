faq:
  - question: "Can restaurants in North Dakota really let you take home an open bottle of wine?"
    answer: "Yes. A restaurant where food makes up at least thirty percent of its sales compared to alcohol can reseal a partly finished bottle and let a customer carry it out with a receipt. The seal has to make it obvious if the bottle gets reopened later."
  - question: "Is it illegal to serve beer and pretzels together in North Dakota?"
    answer: "No. This is one of the most repeated North Dakota law myths, but no statute or ordinance says anything about it. The rumor likely grew out of real food-to-alcohol sales ratio rules that apply to other things entirely."
  - question: "When did North Dakota get rid of its Sunday shopping ban?"
    answer: "The Legislature repealed the ban in 2019, and it took effect August 1 of that year. Before the repeal, most non-grocery retailers had to stay closed statewide from midnight until noon every Sunday."
  - question: "What is the weirdest real law in North Dakota?"
    answer: "The Grand Forks pet-pig ordinance is a strong contender. City code bans most farm animals but still lets residents keep up to two registered miniature potbellied pigs, each under about a hundred pounds, once they turn six months old."
  - question: "Why does North Dakota still have so many old, unenforced laws?"
    answer: "The state Constitution limits the Legislature to eighty days of work every two years. With that little floor time, repealing a narrow or outdated statute rarely competes successfully against live budget and policy bills for a vote."
  - question: "Is it legal to buy liquor early on a Sunday morning in North Dakota?"
    answer: "Not entirely. Off-sale liquor purchases are still banned between 2 a.m. and 8 a.m. on Sundays, a narrower rule left over from the same era as the repealed blue laws."
