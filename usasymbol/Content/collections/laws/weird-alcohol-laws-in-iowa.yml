faq:
  - question: "Is Iowa a control state for liquor?"
    answer: "Partly. Iowa controls only the wholesale side, buying spirits directly from producers through the Alcoholic Beverages Division and reselling them to private retailers, who handle the actual customer sale. Retail stores themselves are privately owned and operated."

  - question: "When did Iowa stop running its own liquor stores?"
    answer: "Iowa closed all 207 of its state-operated retail liquor stores in 1987 and replaced them with 256 privately licensed outlets. The state kept its wholesale monopoly on spirits, which continues to this day."

  - question: "Can Iowa convenience stores sell liquor?"
    answer: "Yes, since a 2023 licensing reform. Grocery, liquor, and convenience stores can now sell beer, wine, and spirits for off-premise consumption, including on Sundays, under a single combined license instead of separate permits for each category."

  - question: "How long has Iowa controlled liquor wholesaling?"
    answer: "The Iowa Alcoholic Beverages Division has held its wholesale monopoly on spirits since March 8, 1934, buying every bottle from producers before it reaches a private retailer's shelf. That structure has outlasted several rounds of retail-side reform."

