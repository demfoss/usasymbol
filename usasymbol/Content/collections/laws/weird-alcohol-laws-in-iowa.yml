page:
  h1: "Weird Alcohol Laws in Iowa"

  quick_answer:
    - "Iowa is a control state only at the wholesale level. The Alcoholic Beverages Division buys every bottle of spirits from producers and resells it to private retailers, who handle the actual customer sale."
    - "Iowa closed its 207 state-run liquor stores in 1987 and replaced them with private licensed retailers, but the state kept its wholesale monopoly on spirits."
    - "A 2023 law let grocery, liquor, and convenience stores use one single license to sell beer, wine, and spirits for off-premise consumption, including on Sundays."

