sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Iowa That Are Real"
    paragraphs:
      - "Iowa built a hybrid system that keeps government control over the wholesale liquor pipeline while letting private businesses run the storefronts customers actually visit."
    highlights:
      - name: "The State Wholesales Every Bottle of Liquor Sold"
        status: "Verified"
        image: "/images/collections/laws/iowa-wholesale-monopoly.jpg"
        anchor_phrases:
          - "exclusive wholesaler"
        description: |
          **Law:** Since March 8, 1934, the Iowa Alcoholic Beverages Division has acted as the exclusive wholesaler of distilled spirits, buying directly from producers and reselling to private retailers.

          **Meaning:** Every bottle of liquor on an Iowa store shelf, whether at a grocery chain or a small-town liquor store, passed through the state's own wholesale warehouse first.

          **Reason:** Iowa kept government control over the wholesale layer of the liquor trade even after moving retail sales fully into private hands, a compromise between full state control and a completely open market.
      - name: "Iowa Sold Off 207 State-Run Liquor Stores in 1987"
        status: "Verified"
        image: "/images/collections/laws/iowa-1987-store-closures.jpg"
        anchor_phrases:
          - "1987"
        description: |
          **Law:** A 1987 reorganization closed all 207 of Iowa's state-operated retail liquor stores and replaced them with 256 privately licensed outlets.

          **Meaning:** Iowa stopped running its own liquor stores that year, but the Alcoholic Beverages Division kept its wholesale role, still supplying every one of the new private stores.

          **Reason:** The switch let Iowa shed the cost and staffing of running retail stores directly while preserving the wholesale revenue and product oversight the state wanted to keep.
      - name: "One License Now Covers Beer, Wine, and Spirits, Even on Sundays"
        status: "Verified"
        image: "/images/collections/laws/iowa-2023-single-license.jpg"
        anchor_phrases:
          - "single license"
        description: |
          **Law:** As of 2023, Iowa simplified retail alcohol licensing so grocery, liquor, and convenience stores can sell beer, wine, and spirits for off-premise consumption, including Sundays, under one license instead of separate permits.

          **Meaning:** A convenience store no longer needs a different license for beer than it does for a bottle of whiskey; one license now covers the whole off-premise lineup.

          **Reason:** The change cut licensing paperwork for retailers while leaving the state's wholesale monopoly on spirits fully intact, showing the two sides of Iowa's system can be adjusted independently.

  - id: why-the-hybrid-survives
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Iowa Never Fully Privatized Liquor"
    paragraphs:
      - "Iowa's Alcoholic Beverages Division has held its wholesale monopoly on spirits continuously since March 1934, making it one of the longest-running pieces of the state's post-Prohibition regulatory structure. Retail sales moved fully to private companies in 1987, but nobody seriously proposed giving up the wholesale side, since it generates steady revenue without the overhead of running actual stores."
      - "Later changes kept refining the retail side rather than the wholesale core. The 2023 single-license reform made it easier for stores to sell every category of alcohol, extending even to Sunday sales, but it left the Division's control over buying and reselling spirits from producers untouched. Iowa effectively split the liquor trade into two separate questions and only ever loosened one of them."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Iowa's wholesale liquor monopoly has run continuously since March 8, 1934, longer than most other pieces of the state's alcohol regulatory system."
      - "The 1987 reorganization replaced 207 state-run stores with 256 private licensed outlets almost overnight."
      - "Iowa's 2023 licensing reform allowed spirits sales in convenience stores for the first time under the simplified single-license system."
      - "Because the state wholesales every bottle of spirits, Iowa can track liquor sales data across every private retailer in the state through one central pipeline."

