page:
  h1: "Weird Alcohol Laws in Ohio"

  quick_answer:
    - "Ohio controls every bottle of spirituous liquor sold in the state through its Division of Liquor Control, even though the stores themselves are privately run contract agencies."
    - "Ohio law bans Sunday alcohol sales by default statewide, and only local option elections, precinct by precinct, can turn that default off."
    - "The same Ohio county can have one precinct selling beer on Sunday and another blocks away that still cannot, because local option votes apply location by location."

