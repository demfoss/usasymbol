faq:
  - question: "Is Ohio a control state for alcohol?"
    answer: "Yes, for spirits. Ohio's Division of Liquor Control holds the exclusive authority to sell spirituous liquor, distributing it through privately run contract agencies that the state licenses and supplies. Beer and wine move through a more conventional private distribution system."

  - question: "Can you buy liquor on Sunday in Ohio?"
    answer: "Only where a local option election has approved it. Ohio Revised Code bans Sunday alcohol sales as the statewide default, and individual precincts or even single business locations must vote to allow it in their specific area."

  - question: "Why do some Ohio bars sell alcohol on Sunday and others don't?"
    answer: "Ohio's local option system lets residents vote on Sunday sales precinct by precinct, and in some cases location by location under the particular-location option. A bar in an approved precinct can sell on Sunday while one in a neighboring precinct that never held or passed a vote cannot."

  - question: "How does Ohio's liquor control system work?"
    answer: "The Ohio Division of Liquor Control supplies and licenses privately operated contract agencies that sell spirituous liquor on the state's behalf, generating over a billion dollars a year in sales. Beer and wine, by contrast, move through a standard private wholesale and retail system."

