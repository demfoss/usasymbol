sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Ohio That Are Real"
    paragraphs:
      - "Ohio combines a state monopoly on hard liquor with a Sunday sales rule that gets decided one precinct at a time, producing a patchwork most residents never fully map out."
    highlights:
      - name: "Every Bottle of Spirits Passes Through the State First"
        status: "Verified"
        image: "/images/collections/laws/ohio-liquor-control-monopoly.jpg"
        anchor_phrases:
          - "Division of Liquor Control"
        description: |
          **Law:** Ohio's Division of Liquor Control holds the exclusive authority to sell spirituous liquor in the state, distributing it through privately operated contract liquor agencies that the state licenses and supplies.

          **Meaning:** A bottle of whiskey on a store shelf in Ohio got there through a state-run supply chain, even though the person ringing it up works for a private business.

          **Reason:** Ohio kept the post-Prohibition control-state model for hard liquor, generating over a billion dollars a year in liquor sales revenue that flows through state channels rather than a fully open private market.
      - name: "Sunday Liquor Sales Are Illegal by Default"
        status: "Verified"
        image: "/images/collections/laws/ohio-sunday-sales-ban.jpg"
        anchor_phrases:
          - "Ohio law bans Sunday alcohol sales by default statewide"
        description: |
          **Law:** Ohio Revised Code prohibits the general sale of beer, wine, and spirits on Sundays, treating it as the statewide default rather than an exception.

          **Meaning:** Unless a specific location has voted its way out of the ban, alcohol sales on Sunday are not legal there.

          **Reason:** The default ban traces back to Ohio's Sunday closing laws, and rather than repeal it outright, the legislature built a local-option system that lets individual communities decide for themselves instead of overriding the rule statewide.
      - name: "One Precinct Can Vote for Sunday Sales While Its Neighbor Can't"
        status: "Verified"
        image: "/images/collections/laws/ohio-local-option-precincts.jpg"
        anchor_phrases:
          - "precinct by precinct"
        description: |
          **Law:** Ohio's local option elections let residents vote on Sunday alcohol sales and hours by precinct, or even by a single business location under the state's particular-location option.

          **Meaning:** Two bars a few blocks apart can end up on opposite sides of the Sunday sales rule if only one of their precincts held and passed the vote.

          **Reason:** Ohio built the local option system so that Sunday sales rules would reflect what residents in a specific area actually wanted, rather than forcing one statewide answer onto every community regardless of local preference.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Ohio Never Just Repealed Its Sunday Ban"
    paragraphs:
      - "Ohio's Sunday alcohol ban has survived because the legislature chose a workaround instead of a repeal. Rather than lift the statewide restriction outright, lawmakers built a system of local option elections that lets individual precincts and even single business locations vote their way into an exception, one petition drive at a time."
      - "That design keeps the underlying ban technically alive across the entire state while letting most populated areas function as if it barely exists. It also means a change in Sunday sales rules almost never comes from Columbus. It comes from a local petition, a special election, and a specific precinct deciding it wants a different answer than the state's default."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Ohio's state liquor agencies generated roughly $1.74 billion in high-proof liquor sales in 2022, all moving through the state's contract agency system."
      - "Ohio's particular-location local option is the most commonly used type of local liquor election in the state, because it lets a single business seek Sunday sales approval without a citywide vote."
      - "Common Sunday sales hours approved through local option in Ohio run from either 10 a.m. or 11 a.m. until midnight."
      - "Beer sold on Sunday in a precinct that has already approved general Sunday sales does not require a separate D-6 permit."

