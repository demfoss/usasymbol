sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Idaho That Are Real"
    paragraphs:
      - "Idaho splits its alcohol rules between a state-run monopoly on strong spirits and a private market for everything below a specific ABV line, then adds a population formula on top for bar licenses."
    highlights:
      - name: "Idaho Owns Every Store That Sells Strong Liquor"
        status: "Verified"
        image: "/images/collections/laws/idaho-state-liquor-monopoly.jpg"
        anchor_phrases:
          - "state-run liquor stores"
        description: |
          **Law:** The Idaho State Liquor Division holds a monopoly on retail sales of distilled spirits above 16% alcohol by volume, sold only through state-operated stores and authorized contract retailers.

          **Meaning:** A bottle of standard-proof vodka or whiskey can only come from a state store or a store under state contract, never an ordinary retailer.

          **Reason:** Idaho kept the post-Prohibition state dispensary model for hard liquor even as it let private distributors handle beer and wine, making it one of seven states that still runs its own liquor stores outright.
      - name: "A Bottle's Alcohol Content Decides Who Can Sell It"
        status: "Verified"
        image: "/images/collections/laws/idaho-abv-threshold.jpg"
        anchor_phrases:
          - "16% alcohol by volume"
        description: |
          **Law:** Wine at 16% ABV or below and low-proof spirits at 14% ABV or below can be sold through private retailers, while anything stronger stays inside the state store system.

          **Meaning:** Two bottles that look nearly identical on a shelf, a fortified wine at 15% and one at 17%, can be sold through completely different retail channels.

          **Reason:** The ABV cutoffs let Idaho keep its state monopoly narrowly focused on hard liquor rather than extending state control to every wine and low-proof product on the market.
      - name: "Bar Licenses Are Capped by City Population"
        status: "Verified"
        image: "/images/collections/laws/idaho-license-quota-system.jpg"
        anchor_phrases:
          - "one license for each one thousand five hundred"
        description: |
          **Law:** Idaho Code § 23-903 limits liquor-by-the-drink licenses inside an incorporated city to one license for each 1,500 residents, based on the most recent census figure.

          **Meaning:** A small town cannot simply approve as many bar licenses as it wants; the population count sets a hard ceiling.

          **Reason:** Lawmakers built the quota in 1959 to keep the number of liquor-serving establishments tied to local population growth rather than market demand alone, and in 2023 the legislature further tightened the system by banning the resale of existing quota licenses.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Idaho Still Runs Its Own Liquor Stores"
    paragraphs:
      - "Idaho set up its state liquor dispensary system after Prohibition ended in 1933, following a wave of states that chose direct government control over hard liquor rather than a fully private licensing model. Most of those states have since sold off their retail operations to private chains, but Idaho kept its dispensary structure largely intact for anything above 16% ABV."
      - "Beer and wine distribution moved to private companies over time, which is why grocery stores can stock a full wine aisle but still cannot carry a bottle of bourbon. The 1959 population-based quota for bar licenses added a second layer of control, this time aimed at the number of places pouring drinks rather than the bottles on a store shelf."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Idaho is one of only seven U.S. states where the government directly operates the retail stores that sell distilled spirits."
      - "The Idaho State Liquor Division does not oversee beer or wine at all; those categories move through private distributors."
      - "Idaho Code § 23-903 ties every city's bar license count to its most recent census population, recalculated as the city grows."
      - "A 2023 law change banned the sale and transfer of existing quota liquor licenses, closing a secondary market that had built up around the population cap."

