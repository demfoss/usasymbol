page:
  h1: "Weird Alcohol Laws in Idaho"

  quick_answer:
    - "Idaho is a control state: the Idaho State Liquor Division runs every store that sells spirits above 16% alcohol by volume, while private retailers handle beer and wine."
    - "Wine at 16% ABV or under and low-proof spirits at 14% ABV or under can be sold privately, so two bottles that look similar on a shelf can fall under completely different rules."
    - "Since 1959, Idaho has capped the number of liquor-by-the-drink licenses in each incorporated city at one license per 1,500 residents."

