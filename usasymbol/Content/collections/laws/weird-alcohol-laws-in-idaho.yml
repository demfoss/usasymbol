faq:
  - question: "Why can't Idaho grocery stores sell hard liquor?"
    answer: "Idaho reserves the sale of distilled spirits above 16% alcohol by volume for state-operated liquor stores and authorized contract retailers under the Idaho State Liquor Division's monopoly. Grocery stores can sell beer and most wine, but not standard-proof liquor."

  - question: "What alcohol content can Idaho private retailers sell?"
    answer: "Private retailers can sell beer, wine at 16% ABV or below, and low-proof spirits at 14% ABV or below. Anything above those thresholds falls under the state liquor monopoly and can only be sold through state stores or contract retailers."

  - question: "How many bars can a small Idaho town have?"
    answer: "Idaho Code § 23-903 limits liquor-by-the-drink licenses within an incorporated city to one for every 1,500 residents based on the latest census. A town of 3,000 people, for example, is generally capped at two such licenses."

  - question: "Is Idaho a control state for alcohol?"
    answer: "Yes, but only partly. Idaho controls the sale of distilled spirits above 16% ABV directly through the state liquor system, while beer and lower-proof wine and spirits move through private distributors and retailers, a hybrid setup rather than a full state monopoly."

