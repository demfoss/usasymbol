page:
  h1: "Unusual Laws in Louisiana That Are Still on the Books"
  quick_answer:
    - "Three Louisiana claims check out: the no-straw daiquiri rule, a boxing conduct law, and a $5 pollster registration requirement."
    - "The daiquiri law does not ban drive-through booze. It exempts frozen drinks from the open-container rule only if the lid stays sealed and no straw is inserted."
    - "The bald-men haircut price cap and the false-teeth assault claim are internet stories with no matching statute anywhere in Louisiana law."
