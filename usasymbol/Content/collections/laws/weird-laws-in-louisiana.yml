sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Louisiana That Are Real"
    paragraphs:
      - "A loophole built for frozen daiquiris survives to this day, and it ranks among the most surprising Real Louisiana Laws You Won't Believe. Two smaller, stranger statutes back it up: one for boxing matches, one for pollsters."
    highlights:
      - name: "The Drive-Through Daiquiri Loophole"
        status: "Verified"
        image: "/images/collections/laws/louisiana-daiquiri-straw-law.jpg"
        anchor_phrases:
          - "no-straw daiquiri rule"
        description: |
          **Law:** Louisiana's open-container statute defines a frozen drink as legally closed, not open, as long as the lid stays on, no straw pokes through the top, and nobody has taken a sip.

          **Meaning:** A sealed daiquiri cup can legally ride in a moving car. Stick a straw through the lid and the same cup becomes an open container.

          **Reason:** Lafayette daiquiri shops built the sealed-cup, taped-straw routine in the early 1980s to work around the state's open-container rules, and the practice became common enough that the law now defines it directly.
      - name: "No Insulting the Boxers"
        status: "Verified"
        image: "/images/collections/laws/louisiana-boxing-conduct-law.jpg"
        anchor_phrases:
          - "boxing conduct law"
        description: |
          **Law:** Louisiana bans open betting or quoting odds inside a boxing arena, and separately bans insulting or abusive remarks from seconds, managers, or spectators directed at the fighters.

          **Meaning:** Heckling a boxer from ringside is not just bad manners in Louisiana. Club officers and the state boxing commission's representative are required to eject anyone who breaks either rule on the spot.

          **Reason:** The rule dates to Louisiana's mid-century push to regulate boxing as a licensed sport rather than an unruly carnival attraction, keeping betting and crowd behavior under the same roof as the referee.
      - name: "Pollsters Have to Register With the State"
        status: "Verified"
        image: "/images/collections/laws/louisiana-poll-conductor-registration.jpg"
        anchor_phrases:
          - "pollster registration requirement"
        description: |
          **Law:** Anyone who offers professional public opinion polling services in Louisiana must register with the Secretary of State before starting, then renew every year by February 15.

          **Meaning:** Only the company or person running the poll has to file, not every phone-bank worker underneath them, and the current filing fee is five dollars.

          **Reason:** Lawmakers wanted a public record of who is conducting polls in the state, likely to add accountability during a stretch of Louisiana's history when election-season polling could be run by almost anyone with a phone list.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Louisiana We Couldn't Verify"
    paragraphs:
      - "Four claims keep showing up on Weird Laws in Louisiana lists without a single statute number, city ordinance, or parish code attached to any of them. Some sound plausible enough that nobody bothers to check."
    subsections:
      - subtitle: "Biting someone with false teeth counts as aggravated assault"
        status: "Not Verified"
        anchor_phrases:
          - "false-teeth assault claim"
        text: |
          **Claim:** Biting someone with your natural teeth is simple assault in Louisiana, but biting with false teeth upgrades the charge to aggravated assault.

          **Why We Couldn't Verify It:** No section of Louisiana's assault or battery statutes mentions teeth, natural or artificial. Searches of the current criminal code turn up general definitions for assault and battery only, with nothing that distinguishes dentures from a real bite.
      - subtitle: "Mourners at a wake can only eat three sandwiches"
        status: "Not Verified"
        anchor_phrases:
          - "three-sandwich wake claim"
        text: |
          **Claim:** Louisiana limits mourners at a funeral wake to three sandwiches each.

          **Why We Couldn't Verify It:** No statute, parish ordinance, or funeral-home regulation matching this number has turned up anywhere official. The story reads like kitchen etiquette from crowded wakes that got repeated as law, with no date or location ever attached to it.
      - subtitle: "Gargling in public is illegal in Lafayette"
        status: "Not Verified"
        anchor_phrases:
          - "gargling in public claim"
        text: |
          **Claim:** The city of Lafayette bans gargling in public places.

          **Why We Couldn't Verify It:** Lafayette's municipal code contains no ordinance using the word gargle or anything resembling one. Every version of this claim traces back to other weird-law roundups rather than to city hall.
      - subtitle: "Roller skating on the sidewalk is illegal in Abbeville"
        status: "Not Verified"
        anchor_phrases:
          - "roller-skating claim"
        text: |
          **Claim:** Abbeville has a specific ban on roller skating on public sidewalks.

          **Why We Couldn't Verify It:** No Abbeville ordinance addressing roller skates, skateboards, or sidewalk wheels has surfaced in any searchable city code. The claim shows up only on general-interest law lists, never on a municipal site.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Louisiana Laws That Are Myths"
    paragraphs:
      - "Two Strange Louisiana Laws claims collapse the moment you look for a source behind them. Both have a clear, ordinary explanation once you know where the story really came from."
    subsections:
      - subtitle: "Haircuts for bald men are capped at 25 cents"
        status: "Myth"
        anchor_phrases:
          - "bald-men haircut claim"
        text: |
          **Myth:** Louisiana law caps the price of a haircut for a bald man at 25 cents.

          **Reality:** No barbering statute, price regulation, or consumer-protection rule anywhere in Louisiana mentions bald customers or haircut pricing at all. Fact-checkers who traced the story found no bill, hearing, or news record behind it. It reads like a joke that got repeated until it sounded official.
      - subtitle: "Robbing a bank and shooting the teller with a water pistol is a separate crime"
        status: "Myth"
        anchor_phrases:
          - "water pistol bank robbery claim"
        text: |
          **Myth:** Louisiana has a specific law against robbing a bank and shooting the teller with a water pistol.

          **Reality:** Armed robbery in Louisiana already covers using any object to make a victim believe they are being threatened, water pistol or otherwise. A separate statute naming toy guns has never existed. The claim is a version of a joke that circulates attached to whichever state a given list is written about.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Louisiana's Split Sessions Leave Old Statutes Alone"
    paragraphs:
      - "Louisiana's Legislature does not meet the same way every year. Even-numbered years bring a general session, open to any subject, running up to 60 legislative days across an 85-day window. Odd-numbered years bring a fiscal-only session capped at 45 legislative days, limited mostly to budget and tax matters. Cleaning up a leftover boxing statute or an old open-container carve-out has to compete for floor time in barely half of the calendar the Legislature actually has."
      - "Louisiana also writes its statutes in the civil-law tradition inherited from French and Spanish rule, organizing law into detailed numbered codes rather than building on case-by-case court rulings the way most states do. That structure keeps narrow, specific statutes like the daiquiri exception sitting exactly where they were written instead of getting folded into broader case law over time."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Every public opinion poll registration filed with the Secretary of State becomes a permanent public record, and the office can publish the full list each year."
      - "The pollster registration law applies to the company running a poll, not each individual caller, so one $5 filing covers an entire phone-bank operation for the year."
      - "Louisiana was the last state in the country to pass a statewide open-container law for drivers, holding out until 2004 under federal highway-funding pressure."
      - "Fiscal-only legislative sessions in odd years cannot introduce most general bills at all unless two-thirds of each chamber votes to allow it."
      - "The boxing conduct law sits inside Louisiana's Title 4, the same title that regulates horse racing and other licensed amusements, rather than inside the criminal code."

