faq:
  - question: "Is the Louisiana daiquiri drive-through law real?"
    answer: "Yes. State law treats a frozen alcoholic drink as a closed container as long as the lid is sealed, no straw is inserted, and nothing has been sipped out. Insert the straw and the same cup counts as an open container in the car."
  - question: "What is the weirdest real law still on the books in Louisiana?"
    answer: "The daiquiri exemption surprises the most people, since drive-through alcohol sounds like it should be flatly illegal. The registration requirement for professional pollsters is a close second, since almost nobody expects polling to require a state filing at all."
  - question: "Is it true bald men get cheap haircuts by law in Louisiana?"
    answer: "No. No pricing statute, barbering regulation, or consumer law anywhere in Louisiana mentions bald customers. It is a widely repeated joke with no bill or hearing behind it."
  - question: "Do Louisiana laws use counties like other states?"
    answer: "No. Louisiana divides itself into 64 parishes instead of counties, a structure that traces back to the state's early French and Spanish colonial church districts."
  - question: "Is biting someone with false teeth really a different crime in Louisiana?"
    answer: "No matching statute has been found. Louisiana's assault and battery laws make no distinction between natural teeth and dentures anywhere in the current code."
  - question: "Why does Louisiana still have an old boxing conduct law about insults?"
    answer: "Louisiana wrote it during a mid-century push to regulate boxing as a licensed sport with real oversight. Betting and crowd conduct at the ring were folded into the same statute, and nobody has had a reason to repeal it since."
