faq:
  - question: "Does Connecticut have a minimum price for liquor?"
    answer: "Yes. Wholesalers must post a minimum price for every bottle, and retailers cannot sell below their own cost calculated from that posted floor plus taxes and delivery. The system is designed to stop large retailers from underpricing small package stores."

  - question: "Can you buy alcohol at a Connecticut package store on Sunday?"
    answer: "No. Package stores cannot sell alcohol on Sundays at all in Connecticut. Restaurants and other on-premises establishments can still serve alcohol on Sundays, but only between 10 a.m. and 6 p.m."

  - question: "What are Connecticut's standard alcohol sale hours?"
    answer: "The default hours run from 9 a.m. to 10 p.m., Monday through Saturday. Sunday follows a separate, more limited rule that bans package store sales entirely while allowing restaurant service for part of the day."

  - question: "Why does Connecticut regulate liquor prices so closely?"
    answer: "Connecticut has an unusually large number of small, independently owned package stores, and minimum pricing rules were built to keep large chains from underpricing them out of business. The same protective logic shapes the state's restricted sale hours."

