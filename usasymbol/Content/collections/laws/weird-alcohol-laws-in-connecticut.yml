sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Connecticut That Are Real"
    paragraphs:
      - "Connecticut regulates liquor pricing and sale hours more tightly than most nearby states, rules that trace back to protecting the state's dense network of small package stores."
    subsections:
      - subtitle: "Every Bottle Has a State-Set Minimum Price"
        status: "Verified"
        image: "/images/collections/laws/connecticut-minimum-bottle-price.jpg"
        anchor_phrases:
          - "minimum bottle price"
        text: |
          **Law:** Connecticut requires wholesalers to post a minimum price for every bottle, calculated from a case price divided by the number of bottles, plus a per-bottle markup that scales with bottle size. No retailer can sell below their own cost under that posted floor.

          **Meaning:** Two package stores across the street from each other cannot compete on price below the state-set floor, no matter how much either wants to discount a slow-moving bottle.

          **Reason:** The minimum pricing system was built to keep large chains from underpricing small, independently owned package stores out of business, a concern that carries extra weight in a state with thousands of small liquor retailers.
      - subtitle: "Package Stores Cannot Sell Alcohol on Sundays"
        status: "Verified"
        image: "/images/collections/laws/connecticut-sunday-package-store-ban.jpg"
        anchor_phrases:
          - "Sunday"
          - "package store"
        text: |
          **Law:** Connecticut bans off-premises alcohol sales at package stores on Sundays entirely, while restaurants and other on-premises establishments can serve alcohol on Sundays from 10 a.m. to 6 p.m.

          **Meaning:** A resident can order a drink with Sunday brunch but cannot pick up a six-pack at the package store on the way home from the same meal.

          **Reason:** The split reflects Connecticut's long-standing distinction between where alcohol is consumed on-site under staff supervision and where it is taken home for unsupervised use, with off-premises sales facing the tighter restriction.
      - subtitle: "Standard Sale Hours Run 9 a.m. to 10 p.m."
        status: "Verified"
        image: "/images/collections/laws/connecticut-sale-hours.jpg"
        anchor_phrases:
          - "9 AM and 10 PM"
        text: |
          **Law:** The default hours for selling alcohol in Connecticut run from 9 a.m. to 10 p.m., Monday through Saturday, tighter than the near round-the-clock windows some neighboring states allow.

          **Meaning:** A late-night run for beer or wine simply is not possible in Connecticut outside of a licensed bar or restaurant already serving drinks on-site.

          **Reason:** The compressed hours are part of the same package-store-protection framework behind Connecticut's minimum pricing rule, limiting how long any single retailer can compete for the same customers in a day.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Connecticut Still Protects Its Package Stores"
    paragraphs:
      - "Connecticut has one of the highest concentrations of small, independently owned package stores of any state, and its pricing and hours rules were both built with that retail landscape in mind. Minimum bottle pricing removes price as a competitive weapon that a large chain could use to undercut a family-owned shop, while restricted hours limit how long any one store can chase the same customers in a single day."
      - "Efforts to loosen both rules have surfaced repeatedly in the legislature, usually framed around convenience or competitive pricing for consumers. Package store owners have pushed back consistently, arguing that a state with as many small liquor retailers as Connecticut cannot deregulate pricing and hours without pushing a large share of them out of business."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Connecticut's minimum bottle markup scales by size: 2 cents for containers 200 milliliters or smaller, 4 cents up to 500 milliliters, and 8 cents above that."
      - "A wholesaler cannot post a bottle price lower than a case price divided evenly across every bottle in that case."
      - "Restaurants and bars can serve alcohol on Connecticut Sundays for eight hours, from 10 a.m. to 6 p.m., while package stores get none."
      - "Connecticut's 9 a.m. to 10 p.m. default hours apply Monday through Saturday, with Sunday treated as a separate, more restricted case."

