page:
  h1: "Weird Alcohol Laws in Connecticut"

  quick_answer:
    - "Connecticut sets a legal minimum price on every bottle of liquor. A store cannot sell below its own cost, calculated from a state-posted minimum price plus taxes and delivery."
    - "Package stores in Connecticut cannot sell alcohol on Sundays at all, while restaurants and bars can serve alcohol on Sundays from 10 a.m. to 6 p.m."
    - "Connecticut's default alcohol sale hours run from 9 a.m. to 10 p.m., Monday through Saturday, one of the narrower standard windows among states this size."

