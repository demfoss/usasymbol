sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in California That Are Real"
    paragraphs:
      - "California's Alcoholic Beverage Control agency polices how alcohol is sold as closely as what is sold, with rules that shape everyday bar behavior most drinkers never think to question."
    subsections:
      - subtitle: "Free Drinks and Two-for-One Specials Are Banned"
        status: "Verified"
        image: "/images/collections/laws/california-happy-hour-restrictions.jpg"
        anchor_phrases:
          - "all-you-can-drink"
          - "two-for-one"
        text: |
          **Law:** California prohibits bars and restaurants from offering free drinks, unlimited all-you-can-drink specials, or two-for-one alcohol promotions as a way to draw in customers.

          **Meaning:** A venue can still run a discounted-price special on a specific drink, but it cannot structure a promotion around unlimited pours or a buy-one-get-one deal.

          **Reason:** The ABC's model house policies treat volume-based drink promotions as a direct driver of overconsumption, so the rule targets the promotion structure itself rather than the price of any single drink.
      - subtitle: "Bartenders Must Pour Every Drink Themselves"
        status: "Verified"
        image: "/images/collections/laws/california-self-pour-ban.jpg"
        anchor_phrases:
          - "pour their own drinks"
        text: |
          **Law:** Customers in a California bar or restaurant cannot pour their own alcoholic drinks; a bartender or server has to control every pour.

          **Meaning:** Even self-serve tap-wall venues, which exist in California, still route the tap access through a metered, staff-controlled card system rather than letting a guest pull an unlimited pour on their own.

          **Reason:** Keeping pours under staff control gives the licensee a clear, enforceable point of accountability for how much alcohol any one customer consumes in a sitting.
      - subtitle: "Cities Can Now Create Open-Container Zones"
        status: "Verified"
        image: "/images/collections/laws/california-entertainment-zones.jpg"
        anchor_phrases:
          - "entertainment zone"
          - "Senate Bill 969"
        text: |
          **Law:** Since Senate Bill 969 took effect statewide on January 1, 2025, any California city or county can designate an 'entertainment zone' where patrons may carry and consume alcohol on public streets and sidewalks during a permitted special event.

          **Meaning:** Outside of a designated zone and event window, California's standard open-container rules still apply on public streets.

          **Reason:** The law responded to cities that wanted a legal way to run festival-style events with drinks in hand, something previously only possible through narrower, one-off local exceptions.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why California Regulates the Pour, Not Just the Bottle"
    paragraphs:
      - "California's alcohol rules focus heavily on how a drink reaches a customer, not only on what is being sold. Banning free drinks and self-service pours both aim at the same target: keeping a single, accountable staff member between a bottle and a customer's glass at every step."
      - "The 2025 entertainment zone law shows the same logic running in the opposite direction. Rather than loosening the underlying open-container rule statewide, lawmakers built a narrow, permit-based exception that cities can turn on only for a specific event and area, keeping the default rule intact everywhere else."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "California allows alcohol sales every day of the week, including Sunday, between 6 a.m. and 2 a.m."
      - "BYOB at a California restaurant is a courtesy the business extends, not a right guaranteed by state law, and a corkage fee is standard when it is allowed."
      - "Self-serve tap-wall bars operate legally in California only when access is metered and tracked through a staff-controlled card or wristband system."
      - "Senate Bill 969's entertainment zones require a specific local permit for each event; a city cannot make open containers legal citywide under the law."

