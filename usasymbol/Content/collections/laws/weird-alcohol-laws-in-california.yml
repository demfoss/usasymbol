page:
  h1: "Weird Alcohol Laws in California"

  quick_answer:
    - "California bans free drinks, all-you-can-drink specials, and two-for-one alcohol promotions at bars and restaurants, a rule most drinkers only learn about when a bartender turns down the request."
    - "Customers cannot pour their own drinks in a California bar or restaurant. Every pour has to come from a bartender or server, even at a self-serve-style tap wall."
    - "Since 2025, California cities and counties can designate 'entertainment zones' where people may carry an open alcoholic drink on public streets during a permitted event, a narrow exception to the state's usual open-container rules."

