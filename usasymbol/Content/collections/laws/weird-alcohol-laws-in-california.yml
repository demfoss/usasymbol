faq:
  - question: "Is happy hour illegal in California?"
    answer: "Not entirely. California bars can still discount specific drinks, but state rules ban free drinks, all-you-can-drink specials, and two-for-one alcohol promotions. The restriction targets the structure of a promotion, not the existence of a happy hour."

  - question: "Can you pour your own beer at a self-serve bar in California?"
    answer: "Only through a staff-controlled system. California requires every pour to be tracked and controlled, so self-serve tap walls operate legally by metering access through a staff-issued card or wristband rather than letting guests pour freely on their own."

  - question: "What are California's entertainment zones?"
    answer: "Since January 1, 2025, Senate Bill 969 lets cities and counties designate entertainment zones where people can carry an open alcoholic drink on public streets and sidewalks during a permitted event. Outside of a designated zone and event window, standard open-container rules still apply."

  - question: "Is BYOB legal at California restaurants?"
    answer: "BYOB is common but not a guaranteed right under state law. Licensed restaurants extend it as a courtesy, usually charging a corkage fee, and only businesses holding the appropriate on-sale license can allow it at all."

