sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in North Carolina That Are Real"
    paragraphs:
      - "A felony charge for hauling off pine straw sounds like a joke until you read the actual statute, and it's one of several Weird Laws in North Carolina that turn out to be real, narrower versions of the viral claim."
    highlights:
      - name: "Pine Straw Theft Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-pine-straw-theft.jpg"
        description: |
          **Law:** North Carolina makes it a Class H felony to rake or carry away pine straw or pine needles from land that's posted against removal.

          **Meaning:** If a landowner has put up the required signs, hauling off bags of pine straw without permission isn't a fine, it's a felony charge.

          **Reason:** Pine straw is a real cash crop for the state's landscaping industry, and growers pushed for a stronger deterrent after unposted land kept getting stripped bare by opportunistic haulers.

      - name: "Stealing Restaurant Grease Can Be a Crime"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-kitchen-grease-theft.jpg"
        description: |
          **Law:** North Carolina makes it illegal to take waste kitchen grease from a business's collection bin without permission, with theft of $1,000 or more charged as a felony.

          **Meaning:** Grease behind a restaurant isn't abandoned trash. A hauler usually owns a contract for it, and taking it yourself can bring criminal charges.

          **Reason:** Lawmakers passed the rule after restaurants and licensed haulers reported organized theft from bins overnight, since used "yellow grease" resells for real money as biodiesel feedstock.

      - name: "Sharing a Hotel Room Unmarried Is Still on the Books"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-hotel-occupancy-law.jpg"
        description: |
          **Law:** North Carolina still criminalizes an unmarried man and woman occupying the same hotel or boarding house bedroom for an "immoral purpose," or falsely registering as spouses.

          **Meaning:** Written narrowly, the charge is a Class 2 misdemeanor, and it has nothing to do with two people simply splitting a room rate.

          **Reason:** The rule dates to an era when hotel registers doubled as the state's main tool for policing unmarried couples traveling together, and nobody has stripped the old wording from the code since.

      - name: "Beach Bingo Prizes Are Capped at $10"
        status: "Verified"
        image: "/images/collections/laws/north-carolina-beach-bingo-prize-cap.jpg"
        description: |
          **Law:** North Carolina's separate "beach bingo" statute caps any single prize at $10, with steep penalties for going over.

          **Meaning:** A boardwalk arcade running bingo for tourists can't offer a $50 gift card as a prize. Cross that line and the operator risks a felony charge, not just a fine.

          **Reason:** The narrower beach version was written to keep boardwalk bingo a low-stakes tourist amusement, kept separate from the higher-stakes charity bingo nonprofits are allowed to run inland.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in North Carolina We Couldn't Verify"
    paragraphs:
      - "Small-town rules about chickens, lawn height, and dog limits keep circulating online with no source attached to any of them. These are the Weird North Carolina Laws Still on the Books that nobody, including the towns themselves, can point to an actual ordinance number for."
    subsections:
      - subtitle: "Ahoskie Bans Chickens From Roaming Free"
        status: "Not Verified"
        text: |
          **Claim:** A widely repeated line claims the town of Ahoskie makes it illegal to let chickens roam free within town limits.

          **Why We Couldn't Verify It:** No current Ahoskie ordinance matching that description turns up in the town's published code, and none of the lists repeating the claim cite a section number or an adoption date.

      - subtitle: "Huntersville Won't Let Your Grass Top 10 Inches"
        status: "Not Verified"
        text: |
          **Claim:** Multiple weird-law lists say Huntersville caps lawn height at exactly 10 inches, with fines for going over.

          **Why We Couldn't Verify It:** The town's public nuisance rules address overgrown yards in general terms, but no source produces the specific 10-inch figure or a citable code section behind it.

      - subtitle: "Haw River Limits Households to Two Dogs"
        status: "Not Verified"
        text: |
          **Claim:** A recurring claim holds that Haw River bars anyone on a lot under roughly two-thirds of an acre from owning more than two dogs.

          **Why We Couldn't Verify It:** That acreage figure is oddly precise for a rule nobody can point to in the town's current ordinances. No date or enforcement record turns up anywhere official either.

      - subtitle: "Aurora Requires a Screen on Every Window"
        status: "Not Verified"
        text: |
          **Claim:** Some lists claim the small town of Aurora has its own ordinance requiring a screen on every window.

          **Why We Couldn't Verify It:** General housing codes often require screens on operable windows, but no distinct Aurora ordinance singling this out has surfaced, and the claim never comes attached to a section number.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange North Carolina Laws That Are Myths"
    paragraphs:
      - "An off-key singing ban and an elephant-plowing rule sound like prime examples of Real North Carolina Laws You Won't Believe, and that's exactly the problem: neither one is real, and both trace back to recycled internet jokes."
    subsections:
      - subtitle: "Singing Off-Key in Public Is Illegal"
        status: "Myth"
        text: |
          **Myth:** Some lists claim North Carolina made it illegal to sing off-key in public, often citing a specific 19th-century Lumberton case as proof.

          **Reality:** No such statute exists, and the supposed court case has no verifiable record anywhere official. What's real is ordinary disturbing-the-peace law, which covers loud or disruptive noise regardless of pitch.

      - subtitle: "You Can't Plow a Field With an Elephant"
        status: "Myth"
        text: |
          **Myth:** A popular version of this claim says Nags Head specifically bans plowing cotton fields with elephants.

          **Reality:** The same elephant-plowing joke shows up recycled across weird-law lists for other states with nearly identical wording. No Nags Head ordinance or state statute mentions elephants or plowing at all.

      - subtitle: "Rollerblading on Highways Has Its Own Ban"
        status: "Myth"
        text: |
          **Myth:** Weird-law roundups claim North Carolina wrote a specific statute against rollerblading on highways.

          **Reality:** What's real is a general rule keeping non-motorized wheeled devices off limited-access highways built for motor traffic. There's no rollerblade-specific statute, just an ordinary traffic-safety rule applied to skates the same way it applies to bicycles.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why North Carolina's Short Legislative Sessions Leave Old Statutes Alone"
    paragraphs:
      - "North Carolina's General Assembly runs on a two-year cycle: a long session in odd years that starts in January and can stretch into midsummer, followed by a short session in even years built mainly for budget adjustments and unfinished business. Cleaning out an obscure criminal statute like the hotel occupancy rule almost never competes for space on that short-session calendar."
      - "Hundreds of incorporated cities and towns across the state also write their own municipal codes, separate from the General Statutes. That's part of why claims like Huntersville's grass height or Ahoskie's chicken rule are so hard to pin down: some really are buried in a specific town's code, others are recycled guesses, and no single statewide office tracks every local ordinance closely enough to confirm which is which."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "North Carolina added its kitchen grease theft law in 2013, once restaurants and licensed haulers started reporting organized theft from grease bins overnight."
      - "Used fryer oil is worth real money on the resale market, sometimes 30 to 40 cents a pound, which is part of why grease theft became common enough to legislate."
      - "Beach bingo is legally its own category in North Carolina, separate from the charity bingo nonprofits run inland, complete with its own license and its own prize ceiling."
      - "A regular North Carolina bingo session can't run more than five hours, and the same statute bars two sessions in the same building within 48 hours of each other."
      - "North Carolina has 100 counties, and each incorporated town inside them can pass its own ordinances that never touch the state's General Statutes at all."

