faq:
  - question: "Is stealing pine straw actually a felony in North Carolina?"
    answer: "Yes, if the land is posted against removal. North Carolina classifies raking or hauling away pine straw or pine needles under those conditions as a Class H felony, not just a citation."
  - question: "Can you get charged for stealing restaurant grease in North Carolina?"
    answer: "Yes. Taking waste kitchen grease from a business's bin without permission is illegal, and theft of $1,000 or more is charged as a felony. Smaller amounts are still a crime, just a misdemeanor instead."
  - question: "Is it illegal to share a hotel room with someone you're not married to in North Carolina?"
    answer: "Technically, the old statute is still active, but it only applies to occupying a room for an 'immoral purpose' or falsely claiming to be married. It is not enforced against ordinary travelers splitting a room rate."
  - question: "How long can a bingo game legally run in North Carolina?"
    answer: "Five hours per session, under state law. Beach bingo games run under a separate, stricter statute with a $10 prize cap."
  - question: "Is it illegal to sing off-key in North Carolina?"
    answer: "No. This is a widely repeated myth with no real statute behind it. General disturbing-the-peace law covers loud or disruptive noise, but nothing in North Carolina law mentions musical pitch."
  - question: "What is the weirdest real law still active in North Carolina?"
    answer: "The kitchen grease theft law tends to surprise people most, since most residents have no idea restaurant fryer oil is valuable enough to steal, let alone valuable enough to write a felony statute around."
