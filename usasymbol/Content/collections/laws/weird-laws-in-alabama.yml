    facts:
      - "Code of Alabama § 13A-12-5 makes bear wrestling a Class B felony — the prohibition covers promoting matches, participating in them, and training bears for the purpose"
      - "The bear wrestling statute sits in Title 13A, Chapter 12 alongside gambling offenses — the legislature treated it as a conduct crime, not solely an animal cruelty issue"
      - "Alabama capped beer at 6% ABV for most of the twentieth century; Free the Hops, founded 2004, successfully lobbied for repeal in 2009"
      - "The 2009 Alabama beer law change also removed a 16-ounce bottle limit, which had blocked large-format craft beers and most imported Belgian ales from being sold in the state"
      - "Railroad interference is a real felony in Alabama under Title 37 — but the 'capital offense' version of the salt claim has no basis in the statute"


faq:
  - question: "What is the weirdest Alabama law that is actually real?"
    answer: "Code of Alabama § 13A-12-5, the bear wrestling prohibition, is a Class B felony covering promoting, participating in, and training bears for wrestling matches. The pre-2009 beer ABV cap is a close second: Alabama banned the sale of beer exceeding 6% alcohol by volume for most of the twentieth century, which barred most craft imports and high-gravity ales from being sold in the state at all."

  - question: "Is putting salt on a railroad track really illegal in Alabama?"
    answer: "Deliberately placing materials on railroad tracks in a way that endangers operations is a felony under Alabama Code, Title 37. Salt near tracks historically attracted livestock onto the rails, causing derailments — which is the practical reason the prohibition exists. The 'punishable by death' version of this claim has no basis in the statute. Capital punishment in Alabama applies to aggravated murder, not railroad interference."

  - question: "Is the fake mustache law in Alabama real?"
    answer: "No. No statute or ordinance matching this claim has been found in Alabama law — not statewide, not at the county level, not in any city code. The claim has circulated for over twenty years without a source citation being produced."
