  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Misquote Outlasts the Correction"
    paragraphs:
      - "The railroad salt claim illustrates a specific failure mode: a real law gets attached to a false punishment, and the false part is what spreads. 'Interfering with railroad operations is a felony' is accurate but uninteresting. 'Putting salt on a railroad track is punishable by death' is wrong but shareable. The correction requires reading the statute; the original claim requires only copying a sentence."
      - "The bear wrestling statute circulates for the opposite reason — the actual law needs no embellishment. A current Class B felony specifically targeting bear wrestling matches is strange enough on its own."

