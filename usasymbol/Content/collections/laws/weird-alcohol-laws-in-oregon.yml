faq:
  - question: "Is Oregon a control state for alcohol?"
    answer: "Yes, for distilled spirits. The Oregon Liquor and Cannabis Commission centrally warehouses and distributes all spirits sold in the state's 282 liquor stores, a system it has run since forming in 1933 shortly after Prohibition ended."

  - question: "Could Oregon bars advertise happy hour prices?"
    answer: "Not until 2017. Oregon barred bars from advertising happy hour drink prices for decades before the OLCC lifted that restriction, while keeping bans on advertising that promotes rapid or excessive drinking."

  - question: "How long can happy hour last in Oregon?"
    answer: "State rules cap happy hour at four hours per day and four days per week. Bars also cannot advertise happy hour outside their own premises or run promotions like two-for-one specials or all-you-can-drink deals."

  - question: "Can Oregon wineries ship wine directly to customers?"
    answer: "Yes. Oregon wineries, breweries, and brewery-public houses automatically get a direct shipper permit along with their license, letting them ship or deliver wine straight to Oregon consumers without a separate application."

