sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Oregon That Are Real"
    paragraphs:
      - "Oregon pairs a tightly controlled spirits market with rules aimed squarely at how bars talk about drink prices, an odd combination for a state known for its craft beverage scene."
    highlights:
      - name: "Every Bottle of Liquor Runs Through One State Warehouse"
        status: "Verified"
        image: "/images/collections/laws/oregon-olcc-spirits-monopoly.jpg"
        anchor_phrases:
          - "one warehouse in Milwaukie"
        description: |
          **Law:** The Oregon Liquor and Cannabis Commission centrally warehouses and distributes distilled spirits to the state's 282 liquor stores, with almost all liquor sold in Oregon moving through the Milwaukie distribution center first.

          **Meaning:** A bottle of gin bought anywhere in the state, from a coastal town to downtown Portland, passed through the exact same state-run supply chain.

          **Reason:** Oregon set up the OLCC just days after national Prohibition ended in 1933 to keep tight control over hard liquor, and unlike many control states that later privatized retail, Oregon kept its state-store model largely intact.
      - name: "Bars Couldn't Advertise Happy Hour Prices Until 2017"
        status: "Verified"
        image: "/images/collections/laws/oregon-happy-hour-ad-ban.jpg"
        anchor_phrases:
          - "advertise happy hour drink prices"
        description: |
          **Law:** For decades, Oregon law barred bars from advertising their happy hour drink prices at all, a restriction the OLCC finally lifted in 2017 while keeping bans on ads that encourage rapid or excessive drinking.

          **Meaning:** A bar could legally run a discounted happy hour but was not allowed to tell anyone the price outside its own doors until the rule changed.

          **Reason:** Regulators originally wrote the ad ban to limit alcohol marketing aimed at encouraging heavier drinking, and it took sustained industry pushback before the OLCC agreed the blanket advertising ban did more to confuse customers than protect them.
      - name: "Happy Hour Is Capped at Four Hours, Four Days a Week"
        status: "Verified"
        image: "/images/collections/laws/oregon-happy-hour-time-limit.jpg"
        anchor_phrases:
          - "four hours per day and not more than four days per week"
        description: |
          **Law:** Oregon limits happy hour promotions to no more than four hours per day and four days per week, and bars cannot advertise happy hour outside the licensed premises even after the 2017 change.

          **Meaning:** A bar cannot legally run all-day drink specials every day of the week, no matter how it prices them.

          **Reason:** The time limits exist alongside a ban on "two-for-one" and all-you-can-drink specials, both aimed at keeping discount pricing from turning into an incentive for rapid, heavy consumption.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Oregon Loosened Its Rules on Talking About Drink Prices, Not the Drinking Itself"
    paragraphs:
      - "Oregon's 2017 change to happy hour advertising did not touch the underlying limits on how long a discount can run or how it can be structured. Lawmakers and the OLCC drew a clear line between telling customers a price exists, which the state decided was reasonable commercial speech, and structuring promotions in ways that push people toward drinking faster or more, which remained restricted."
      - "That distinction explains why Oregon still looks strict on paper even after loosening one of its most criticized rules. The state's spirits monopoly persisted for the same underlying reason: Oregon built its control system around limiting how alcohol reaches consumers, then adjusted individual pieces of that system only when a specific rule stopped making practical sense."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "The OLCC was created within days of the 21st Amendment's ratification in December 1933, making it one of the country's oldest liquor control agencies."
      - "Oregon wineries, breweries, and brewery-public houses automatically receive a direct shipper permit with their license, letting them ship or deliver wine straight to Oregon consumers."
      - "Oregon is one of 17 states classified as an alcoholic beverage control state, directly managing spirits sales rather than leaving them to private retailers."
      - "Even after the 2017 change, Oregon bars still cannot advertise happy hour pricing anywhere outside their own licensed premises."

