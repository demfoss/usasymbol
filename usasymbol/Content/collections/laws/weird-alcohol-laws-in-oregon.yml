page:
  h1: "Weird Alcohol Laws in Oregon"

  quick_answer:
    - "Oregon runs a full state monopoly on distilled spirits, distributing every bottle sold in the state's 282 liquor stores through one warehouse in Milwaukie."
    - "Bars in Oregon could not advertise happy hour drink prices at all until the OLCC lifted that decades-old restriction in 2017."
    - "Oregon still caps happy hour at four hours a day and four days a week, even after the advertising rule loosened."

