page:
  h1: "Weird Alcohol Laws in Georgia"

  quick_answer:
    - "Georgia's 2018 Brunch Bill lets cities and counties allow alcohol sales starting at 11 a.m. on Sundays instead of 12:30 p.m., but only where local voters separately approved it."
    - "Dozens of Georgia cities, including Atlanta, Savannah, and Athens-Clarke County, adopted the Brunch Bill, while others, like Morrow in Clayton County, voted it down."
    - "Five of Georgia's 159 counties still ban alcohol sales entirely, and a few more allow beer and wine but keep distilled spirits off the shelf."

