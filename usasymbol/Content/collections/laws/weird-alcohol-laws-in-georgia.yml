sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Georgia That Are Real"
    paragraphs:
      - "Georgia's alcohol rules run through the same local-option pattern found across much of the South: a statewide law sets the outer limits, and each city or county decides separately whether to use it."
    subsections:
      - subtitle: "The Brunch Bill Moved Sunday Sales to 11 a.m., Locally"
        status: "Verified"
        image: "/images/collections/laws/georgia-brunch-bill-sunday-sales.jpg"
        anchor_phrases:
          - "Brunch Bill"
          - "11 a.m."
        text: |
          **Law:** Georgia Senate Bill 17, known as the Brunch Bill, took effect September 1, 2018, allowing restaurants and wineries that serve food to sell alcohol as early as 11 a.m. on Sundays instead of the previous 12:30 p.m. start.

          **Meaning:** The change is not automatic anywhere; each city or county has to hold its own local vote to roll back its Sunday on-premises hours to 11 a.m.

          **Reason:** Restaurant owners pushed for the change specifically to serve mimosas and Bloody Marys with Sunday brunch, arguing the old 12:30 p.m. rule cost them meaningful weekend business.
      - subtitle: "Cities Vote Individually, and Not All Say Yes"
        status: "Verified"
        image: "/images/collections/laws/georgia-brunch-bill-local-votes.jpg"
        anchor_phrases:
          - "local ordinances"
        text: |
          **Law:** Dozens of Georgia cities and counties, including Atlanta, Savannah, Athens-Clarke County, and Cobb, DeKalb, and Gwinnett counties, have separately adopted the Brunch Bill through their own local elections since 2018.

          **Meaning:** Adoption is genuinely uneven; Morrow in Clayton County is one documented example of a city that put the measure to a vote and rejected it.

          **Reason:** Because the state law only authorizes local governments to make the change rather than mandating it statewide, Georgia's Sunday brunch hours vary city by city even along the same commute.
      - subtitle: "Five Counties Still Ban Alcohol Sales Entirely"
        status: "Verified"
        image: "/images/collections/laws/georgia-dry-counties.jpg"
        anchor_phrases:
          - "dry counties"
        text: |
          **Law:** Five of Georgia's 159 counties still do not allow alcohol sales at all, and a handful of others allow beer and wine while separately banning distilled spirits, including Bleckley, Bulloch, and Butts counties.

          **Meaning:** Georgia's local option system covers far more than just Sunday hours; the same city-by-city and county-by-county votes decide whether alcohol can be sold at all.

          **Reason:** Georgia devolved alcohol regulation to county voters after Prohibition, and pockets of strong local opposition have kept a small number of counties fully or partially dry for decades since.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Georgia Leaves So Many Alcohol Decisions to Local Voters"
    paragraphs:
      - "Georgia's Brunch Bill is a state law that authorizes a local choice rather than mandating one outcome, and that structure is not new. The same local-option pattern already governed whether a Georgia county allowed alcohol sales at all, so lawmakers simply extended a familiar mechanism to a narrower question about Sunday morning hours."
      - "That is why a short drive across a county line in Georgia can mean a genuinely different set of alcohol rules. A city like Atlanta adopted the Brunch Bill quickly, while Morrow rejected it, and five counties statewide still ban alcohol sales altogether under the same local-option principle that shaped Georgia's alcohol law since Prohibition ended."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Georgia's Brunch Bill only covers restaurants and wineries that serve food; it does not change hours for retail package stores."
      - "Athens-Clarke County adopted the Brunch Bill in the same November 2018 election where Georgia voters approved several other statewide ballot measures."
      - "Bleckley County bans distilled spirits sales for both retail and on-site consumption, while Bulloch County bans only the retail sale of spirits."
      - "Because Brunch Bill adoption requires a separate local vote, a Georgia city can wait years after the 2018 state law before putting the question on its own ballot."

