faq:
  - question: "What time can you buy alcohol on Sunday in Georgia?"
    answer: "It depends on the city. Where local voters have adopted the 2018 Brunch Bill, restaurants and wineries serving food can sell alcohol starting at 11 a.m. on Sundays. Where a city has not adopted it, the older 12:30 p.m. start time still applies."

  - question: "Did every Georgia city adopt the Brunch Bill?"
    answer: "No. Adoption required a separate local vote in each city or county. Places like Atlanta, Savannah, and Athens-Clarke County adopted it, while at least one city, Morrow in Clayton County, put it to a vote and rejected it."

  - question: "Are there dry counties in Georgia?"
    answer: "Yes. Five of Georgia's 159 counties still ban alcohol sales entirely, and a few more counties, including Bleckley, Bulloch, and Butts, allow beer and wine while separately banning distilled spirits sales."

  - question: "Does the Georgia Brunch Bill apply to liquor stores?"
    answer: "No. The Brunch Bill only covers on-premises alcohol sales at restaurants and wineries that serve food. It does not change the hours for retail package stores, which follow a separate set of Sunday sale rules."

