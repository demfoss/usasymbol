sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Wisconsin That Are Real"
    paragraphs:
      - "Wisconsin's drinking laws run more permissive than most states in ways tied directly to the state's brewing history and its bar industry's lobbying power."
    highlights:
      - name: "Minors Can Drink With a Parent at Any Age"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-parent-guardian-exception.jpg"
        anchor_phrases:
          - "parent, guardian or spouse"
        description: |
          **Law:** Wisconsin Statute § 125.07 allows a person under 21, including minors well under 18, to possess and consume alcohol on licensed premises if accompanied by a parent, guardian, or spouse of legal drinking age.

          **Meaning:** The exception applies at the discretion of the bar or restaurant; a licensee can still choose to refuse service to an underage patron even with a parent present.

          **Reason:** Legal experts describe the statute as unusually broad since it sets no minimum age for the exception, putting Wisconsin's law well outside the mainstream of state underage-drinking rules.
      - name: "A First OWI Is a Civil Infraction, Not a Crime"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-first-owi-infraction.jpg"
        anchor_phrases:
          - "civil infraction"
        description: |
          **Law:** Wisconsin treats a first-offense operating-while-intoxicated charge as a traffic infraction, not a criminal offense, unlike every other state.

          **Meaning:** A first-time OWI still carries real consequences, including fines and license penalties, but it does not create a criminal record the way a first DUI does almost everywhere else in the country.

          **Reason:** Legal researchers point to Wisconsin's drinking culture and organized tavern-industry lobbying as the reasons the state never reclassified a first offense as criminal, even as it did for repeat offenses.
      - name: "Open Containers Have a Chauffeur Exception"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-open-container-limo-exception.jpg"
        anchor_phrases:
          - "chauffeured buses or limousines"
        description: |
          **Law:** Wisconsin's open container law requires alcohol in a vehicle to stay in the trunk, or out of reach of the driver and passengers if there is no trunk, with a specific exception for chauffeured buses and limousines.

          **Meaning:** Passengers in a hired limousine or bus can legally have open containers within reach, a carve-out that doesn't exist for a private car with a designated driver.

          **Reason:** The exception recognizes that a chauffeured vehicle separates the person drinking from the person driving, the underlying concern behind the open container rule in the first place.

  - id: why-wisconsin-stays-lenient
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Wisconsin's Drinking Laws Stay So Permissive"
    paragraphs:
      - "Milwaukee's brewing industry grew directly out of a wave of 19th-century German immigration, earning the city the nickname 'German Athens' and building the foundation for Pabst, Miller, Schlitz, and Blatz. Prohibition cut that industry's brewery count roughly in half by 1933, but the drinking culture the breweries had built survived the shutdown."
      - "The Tavern League of Wisconsin formed in 1935, right after Prohibition ended, specifically to protect bar owners' interests in the years that followed. Since then it has successfully lobbied against measures that would tighten drinking laws, including funding alternatives like the SafeRide program rather than accepting stricter penalties, a pattern researchers point to directly when explaining why Wisconsin never criminalized a first-offense OWI the way every other state eventually did."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Wisconsin's brewery count fell by roughly half during Prohibition as companies scrambled to survive by making near beer, ice cream, and soda instead."
      - "The Tavern League of Wisconsin has operated continuously since 1935, making it one of the longest-running alcohol industry lobbying groups in the country."
      - "Wisconsin Statute § 125.07's parent-accompaniment exception appears in multiple subsections of the law, covering both possession and presence on licensed premises."
      - "A first-offense OWI in Wisconsin is classified as a traffic violation, carrying penalties without the criminal record attached to a first DUI in every other state."

