faq:
  - question: "Can a minor drink alcohol with their parents in Wisconsin?"
    answer: "Yes, under Wisconsin Statute § 125.07. A person under 21, at any age, can possess and consume alcohol on licensed premises if accompanied by a parent, guardian, or spouse who has reached the legal drinking age, though the establishment can still refuse to allow it."

  - question: "Is a first DUI a crime in Wisconsin?"
    answer: "No. Wisconsin is the only state that treats a first-offense operating-while-intoxicated charge as a civil traffic infraction rather than a criminal offense, even though it still carries fines and license consequences."

  - question: "Why does Wisconsin have such lenient drinking laws?"
    answer: "The state's brewing history and organized tavern-industry lobbying both play a role. The Tavern League of Wisconsin, active since 1935, has successfully pushed back against measures that would tighten alcohol laws, including efforts to criminalize a first-offense OWI."

  - question: "Are open containers ever legal in a Wisconsin vehicle?"
    answer: "Generally no, but Wisconsin's open container law makes an exception for chauffeured buses and limousines, where passengers can have open containers within reach since a hired driver, not the drinker, is operating the vehicle."

