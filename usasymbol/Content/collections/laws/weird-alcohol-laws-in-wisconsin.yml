page:
  h1: "Weird Alcohol Laws in Wisconsin"

  quick_answer:
    - "Wisconsin law lets a minor of any age, not just 18 to 20, drink alcohol on licensed premises if accompanied by a parent, guardian, or spouse of legal drinking age."
    - "Wisconsin is the only state where a first-offense OWI is treated as a civil traffic infraction rather than a criminal charge."
    - "The Tavern League of Wisconsin, founded in 1935, has spent decades lobbying to keep the state's bar-friendly alcohol laws in place."

