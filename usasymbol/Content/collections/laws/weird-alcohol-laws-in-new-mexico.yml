sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in New Mexico That Are Real"
    paragraphs:
      - "New Mexico regulates alcohol through a mix of statewide statute and tribal law, and the two systems do not always line up at the border of a reservation."
    highlights:
      - name: "No Selling Alcohol From a Drive-Up Window"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-drive-up-window-ban.jpg"
        anchor_phrases:
          - "drive-up window"
        description: |
          **Law:** New Mexico statute makes it a violation of the Liquor Control Act for a licensee to sell or deliver alcoholic beverages from a drive-up window.

          **Meaning:** A liquor store or package outlet cannot hand a bottle through a car window the way a fast-food restaurant hands over a bag of food.

          **Reason:** Regulators wrote the ban to keep alcohol purchases away from the driver's seat, cutting the odds that a customer buys a drink and opens it before ever leaving the parking lot.
      - name: "Direct Wine Shipments Are Capped by Statute"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-wine-shipment-cap.jpg"
        anchor_phrases:
          - "24 nine-liter cases"
        description: |
          **Law:** A winery holding a direct wine shipment permit may ship no more than 24 nine-liter cases of wine per year to a single New Mexico resident who is 21 or older, for personal use only.

          **Meaning:** A serious collector cannot simply order case after case straight from a winery's website without running into the state's annual ceiling.

          **Reason:** New Mexico opened the door to direct-to-consumer wine shipping while keeping a volume cap and a mandatory age-verification label, balancing consumer access against underage-delivery risk.
      - name: "The Navajo Nation Runs Its Own Alcohol Ban"
        status: "Verified"
        image: "/images/collections/laws/new-mexico-navajo-nation-prohibition.jpg"
        anchor_phrases:
          - "Navajo Nation"
          - "own alcohol prohibition"
        description: |
          **Law:** The Navajo Nation, whose land stretches across parts of northwestern New Mexico, Arizona, and Utah, has maintained its own tribal ban on alcohol possession and sale since the 1950s.

          **Meaning:** A traveler can legally buy beer in Gallup or Farmington under state law, then cross onto the reservation where possessing that same can is a tribal offense.

          **Reason:** The tribal council chose to keep prohibition in place even after Congress lifted the federal ban on selling liquor to Native Americans in 1953, and border towns like Gallup still see alcohol sales driven by that line on the map.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New Mexico's Alcohol Map Has Two Sets of Rules"
    paragraphs:
      - "New Mexico's drive-up window ban and shipment cap both trace back to the same instinct: keep alcohol sales tied to a checkable transaction rather than a quick handoff. A clerk behind a counter can verify an ID and watch a customer leave on foot or as a passenger, something a drive-up window makes harder to enforce."
      - "The Navajo Nation's prohibition runs on a separate track entirely. Congress repealed the federal ban on selling alcohol to Native Americans in 1953 and left the choice to each tribal government. The Navajo Nation kept its ban, and that decision still shapes towns like Gallup, where liquor stores sit just outside reservation lines and draw customers who cannot buy alcohol at home."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New Mexico's direct wine shipment permit costs a winery $50 a year to hold, on top of the 24-case annual limit per recipient."
      - "Every direct-shipped wine package must carry a label reading that it contains alcohol and requires a signature from someone 21 or older."
      - "The Navajo Nation is the largest reservation in the United States, and its prohibition has stayed in place for more than 70 years even as neighboring towns loosened their own alcohol rules."
      - "New Mexico's Alcohol and Gaming Division, not city or county government, issues and enforces the state's liquor licenses statewide."

