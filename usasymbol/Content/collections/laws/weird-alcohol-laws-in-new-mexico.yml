faq:
  - question: "Is it illegal to buy alcohol from a drive-up window in New Mexico?"
    answer: "Yes. New Mexico statute makes it a violation of the Liquor Control Act for any licensee to sell or deliver alcoholic beverages from a drive-up window, regardless of the type of store."

  - question: "Can a winery ship wine directly to a home in New Mexico?"
    answer: "Yes, with a direct wine shipment permit, but the law caps deliveries at 24 nine-liter cases per year to any one resident, and each shipment must be labeled to show it contains alcohol and requires an adult signature."

  - question: "Why can't you buy alcohol on the Navajo Nation in New Mexico?"
    answer: "The Navajo Nation has enforced its own tribal prohibition on alcohol possession and sale since the 1950s, a choice the tribal government made after Congress repealed the federal ban on liquor sales to Native Americans in 1953. It applies on tribal land regardless of what New Mexico state law allows just outside the border."

  - question: "Does New Mexico state law apply on the Navajo Nation?"
    answer: "No. Alcohol law on the Navajo Nation is set by the tribal government, separate from New Mexico's state statutes. That is why border towns such as Gallup sell alcohol freely under state law while the reservation itself remains dry."

