page:
  h1: "Weird Alcohol Laws in New Mexico"

  quick_answer:
    - "New Mexico bans selling or delivering alcohol from a drive-up window, a rule written directly into the Liquor Control Act rather than left to local ordinance."
    - "Wineries can ship directly to a New Mexico resident, but state law caps it at 24 nine-liter cases a year, and every package must carry an age-verification label."
    - "The Navajo Nation, which covers a large part of northwestern New Mexico, has enforced its own alcohol prohibition since the 1950s, completely separate from state law."

  sources:
