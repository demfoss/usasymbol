sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Nebraska That Are Real"
    paragraphs:
      - "Nebraska's alcohol code carries a handful of rules that look strange today but trace back to specific enforcement problems from decades past."
    highlights:
      - name: "Mixing Beer and Liquor in One Drink Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/nebraska-boilermaker-ban.jpg"
        anchor_phrases:
          - "boilermaker"
        description: |
          **Law:** Nebraska is the only state that bans selling a drink combining beer with a distilled spirit, making a boilermaker or a beer-and-shot cocktail illegal to serve.

          **Meaning:** A bartender can legally pour a Long Island Iced Tea with five different liquors in it, but cannot legally serve a boilermaker that is roughly a third as strong.

          **Reason:** The statute traces back to 1935 and Prohibition-era concerns about "needle beer," non-alcoholic near-beer spiked with added alcohol, and lawmakers have never repealed the rule despite repeated attempts to overturn it.
      - name: "Kegs Need a Registered Label"
        status: "Verified"
        image: "/images/collections/laws/nebraska-keg-registration-law.jpg"
        anchor_phrases:
          - "registration label"
        description: |
          **Law:** Nebraska law requires every beer keg to carry a registration label, and possessing an unregistered or unlabeled keg is a criminal offense punishable by up to three months in jail and a $500 fine.

          **Meaning:** The label has to sit on the upper third of the keg, and removing or tampering with it can trigger the same penalty as never registering it at all.

          **Reason:** Registration ties a keg back to the retailer who sold it, giving law enforcement a way to trace who supplied alcohol if the keg turns up at an underage drinking party.
      - name: "Sunday Sales Start at Noon Unless a City Says Otherwise"
        status: "Verified"
        image: "/images/collections/laws/nebraska-sunday-sales-noon.jpg"
        anchor_phrases:
          - "before noon"
        description: |
          **Law:** Nebraska bans alcohol sales before noon on Sundays statewide, though individual cities and counties can vote to lift the restriction locally.

          **Meaning:** Lincoln has no special Sunday restriction of its own, but a driver crossing into a town that has not opted out will find stores and bars closed for alcohol sales until noon.

          **Reason:** The default statewide rule reflects Nebraska's older blue-law tradition, while the local-option override lets individual communities decide for themselves whether to keep it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Nebraska Still Bans the Boilermaker"
    paragraphs:
      - "Nebraska's ban on mixing beer with a distilled spirit dates to a 1935 statute written not long after Prohibition ended. The original target was so-called needle beer, the practice of spiking legal near-beer with extra alcohol during the years when only weak, non-intoxicating beer was allowed."
      - "State legislators have tried to repeal the rule more than once, arguing it makes no sense next to a drink like a Long Island Iced Tea that stays legal despite carrying far more alcohol than a boilermaker. Each repeal attempt has stalled, leaving Nebraska as the only state where ordering a beer with a shot dropped in it is against the law."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "A Nebraska boilermaker runs about 10% alcohol by volume, while a legal Long Island Iced Tea can reach roughly 33%, the exact contrast repeal advocates point to."
      - "Nebraska's keg registration label must sit on the upper third of the keg, and tampering with it carries the same penalty as never registering the keg at all."
      - "On- and off-premise retailers in Nebraska can sell alcohol from 6 a.m. to 1 a.m. Monday through Saturday under the state's standard sales-hour rule."
      - "Lincoln is one of the Nebraska cities that has opted out of the statewide noon start time for Sunday alcohol sales."

