faq:
  - question: "Why is a boilermaker illegal in Nebraska?"
    answer: "A 1935 statute banned selling any drink that combines beer with a distilled spirit, originally aimed at stopping 'needle beer,' near-beer spiked with added alcohol during the Prohibition era. Nebraska remains the only state with the rule despite repeated repeal attempts."

  - question: "Can you get in trouble for an unlabeled keg in Nebraska?"
    answer: "Yes. Nebraska requires every beer keg to carry a registration label on its upper third, and possessing an unregistered or unlabeled keg can bring up to three months in jail and a $500 fine."

  - question: "Can you buy alcohol before noon on Sunday in Nebraska?"
    answer: "Not by default. Nebraska law bans alcohol sales before noon statewide on Sundays, but cities and counties can vote to lift that restriction locally, and some, including Lincoln, have opted out."

  - question: "What are Nebraska's standard alcohol sales hours?"
    answer: "On- and off-premise retailers can sell alcohol from 6 a.m. to 1 a.m. Monday through Saturday statewide. Sunday hours follow the separate noon-start rule unless a city or county has voted to lift it."

