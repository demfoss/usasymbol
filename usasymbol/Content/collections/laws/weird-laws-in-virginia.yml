page:
  h1: "Real Virginia Laws You Won't Believe"
  quick_answer:
    - "Four Virginia claims check out: a public swearing and intoxication law, a Sunday hunting restriction, a golf cart highway-crossing rule, and a 2020 repealed fornication ban."
    - "Virginia's fornication law was ruled unconstitutional by the state's own Supreme Court in 2005, but the Legislature didn't formally repeal it until 2020, 15 years later."
    - "The claim about a tickling law is a distorted version of the state's general assault statute, and the underwater-whistling claim misreads an ordinary abusive-language law."
