      - "The Sunday raccoon-hunting cutoff of 2 a.m. was removed in 2018, allowing hunting all day."
      - "Virginia's public swearing and public intoxication offenses share a single statute rather than being written as two separate laws."
      - "The golf cart highway-crossing law applies only at an event venue on the same day as the event, not for general road use."
      - "Virginia's odd-year legislative sessions are constitutionally capped at 30 days, half the length of even-year sessions."

