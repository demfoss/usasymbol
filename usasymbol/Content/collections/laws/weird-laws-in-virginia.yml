sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Virginia That Are Real"
    paragraphs:
      - "A colonial-era ban on unmarried sex stayed on Virginia's books until 2020, and that's just one of several Unusual Laws in Virginia that hold up against the actual code and its history."
    highlights:
      - name: "Swearing and Public Intoxication Share One Statute"
        status: "Verified"
        image: "/images/collections/laws/virginia-profane-swearing.jpg"
        description: |
          **Law:** Cursing or swearing in public, or being publicly intoxicated, is a Class 4 misdemeanor under the same statute.

          **Meaning:** Officers can also authorize transporting a publicly intoxicated person to a detox center instead of making an arrest.

          **Reason:** Combining the two offenses into one law reflects an older approach that treated visible public disorder, whether from language or alcohol, as a single category of concern.

      - name: "Sunday Hunting Rules Are Narrower Than They Used to Be"
        status: "Verified"
        image: "/images/collections/laws/virginia-sunday-hunting.jpg"
        description: |
          **Law:** Hunting with a gun near a place of worship is banned on Sundays, and hunting deer or bear with dogs on Sundays is also restricted.

          **Meaning:** Raccoon hunters could once legally chase their prey only until 2 a.m. on Sunday mornings. That specific time cutoff was removed in 2018, allowing raccoon hunting all day.

          **Reason:** The rule descends from Virginia's Sunday blue-law tradition, gradually narrowed over decades of amendments rather than repealed outright.

      - name: "Golf Carts Can Legally Cross Certain Highways"
        status: "Verified"
        image: "/images/collections/laws/virginia-golf-cart-law.jpg"
        description: |
          **Law:** Golf carts and similar utility vehicles can cross one- or two-lane highways at an event venue on the same day as the event.

          **Meaning:** It's a narrow, event-specific exception, not a general permission for golf carts on public roads.

          **Reason:** The rule accommodates venues like fairgrounds and racetracks where crossing a public road briefly is the only way to move carts between parking and event areas.

      - name: "Virginia's Fornication Ban Wasn't Repealed Until 2020"
        status: "Repealed"
        image: "/images/collections/laws/virginia-fornication-law.jpg"
        description: |
          **Law:** Virginia's colonial-era statute made sex between unmarried people a Class 4 misdemeanor.

          **Meaning:** The law stayed technically on the books for 15 years after courts said it couldn't be enforced.

          **Reason:** Virginia's own Supreme Court struck the law down as unconstitutional in a 2005 case, applying the U.S. Supreme Court's Lawrence v. Texas ruling, but the General Assembly didn't formally remove it from the code until 2020.

