faq:
  - question: "Is swearing in public illegal in Virginia?"
    answer: "Yes, technically. State law makes profane swearing in public a Class 4 misdemeanor, the same statute that also covers public intoxication."
  - question: "Can you hunt raccoons on Sundays in Virginia?"
    answer: "Yes, all day. A 2 a.m. cutoff that once applied to Sunday raccoon hunting was removed in 2018, though other Sunday hunting restrictions still apply to certain animals and locations."
  - question: "Was fornication actually illegal in Virginia?"
    answer: "Yes, until 2020. The state's own Supreme Court ruled the law unconstitutional in 2005, but the General Assembly didn't formally repeal it from the code until 15 years later."
  - question: "Can golf carts drive on Virginia highways?"
    answer: "Only in a narrow situation. Golf carts can cross a one- or two-lane highway at an event venue on the same day as the event, not for general road travel."
  - question: "Is tickling someone actually its own crime in Virginia?"
    answer: "No. The law people cite is the state's general assault and battery statute, which covers unwanted physical contact broadly and never mentions tickling specifically."
  - question: "What is the weirdest real law still on the books in Virginia?"
    answer: "The fornication law's repeal timeline stands out most, since a court declared it unenforceable in 2005 but it remained technically written into the code for another 15 years."
