    subsections:
      - subtitle: "X-ray machines can't be used to fit shoes"
        status: "Not Verified"
        text: |
          **Claim:** Virginia bans using X-ray machines to measure feet for shoe fitting.

          **Why We Couldn't Verify It:** No current statute matching this exact claim has been confirmed. Shoe-fitting fluoroscopes were a real, later-banned public-health hazard nationally in the mid-20th century, but the specific Virginia citation couldn't be verified.

      - subtitle: "You can only keep a pet skunk for two months"
        status: "Not Verified"
        text: |
          **Claim:** Virginia caps pet skunk ownership at two months before it becomes illegal.

          **Why We Couldn't Verify It:** Virginia does regulate live skunk possession generally, but a specific two-month ownership limit couldn't be confirmed in the exact form claimed.

      - subtitle: "Driving barefoot is illegal"
        status: "Not Verified"
        text: |
          **Claim:** Virginia bans driving a car without shoes on.

          **Why We Couldn't Verify It:** No statute addressing footwear while driving has been located. General safe-operation rules would apply to any actual hazard, but no barefoot-specific ban has been confirmed.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Virginia Laws That Are Myths"
    paragraphs:
      - "Two Strange Virginia Laws claims turn out to be real statutes stretched into something much odder-sounding than what they actually say."
    subsections:
      - subtitle: "Tickling a woman against her will is its own specific crime"
        status: "Myth"
        text: |
          **Myth:** Virginia has a standalone law specifically against tickling someone against their will.

          **Reality:** The statute people point to is Virginia's ordinary assault and battery law, which covers unwanted physical contact generally. It never mentions tickling by name.

      - subtitle: "Whistling underwater in a public pool is illegal"
        status: "Myth"
        text: |
          **Myth:** Virginia specifically bans whistling underwater in a public swimming pool.

          **Reality:** The statute actually cited is Virginia's general abusive-language law, which bans cursing or provoking language directed at another person. It has nothing to do with whistling or swimming pools.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Virginia's 30-Day Sessions Leave Old Statutes Behind"
    paragraphs:
      - "Virginia's Constitution caps regular sessions at just 30 days in odd-numbered years, extendable by 30 more days only with a two-thirds vote, compared to 60 days in even years. With that short odd-year window eaten up by current legislative priorities, a statute like the fornication ban can sit unrepealed for 15 years after a court effectively nullifies it, simply because a formal repeal vote never becomes urgent."

