sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Nevada That Are Real"
    paragraphs:
      - "Nevada built its alcohol rules around a 24-hour gaming and tourism economy, which is why the state's laws look so different from a typical Alcoholic Beverage Control state."
    highlights:
      - name: "Bars Can Legally Stay Open All Night, Every Night"
        status: "Verified"
        image: "/images/collections/laws/nevada-24-hour-alcohol-sales.jpg"
        anchor_phrases:
          - "NRS 369.487"
          - "no statewide mandatory closing time"
        description: |
          **Law:** Nevada Revised Statute 369.487 allows the sale of alcohol 24 hours a day, seven days a week, with no statewide mandatory closing time.

          **Meaning:** A casino bar in Las Vegas or Reno can pour drinks continuously without ever declaring last call, something almost no other state permits statewide.

          **Reason:** Cities and counties can still set their own local hours, but major population centers including Clark County, Las Vegas, and Reno all choose to allow round-the-clock service, reinforcing Nevada's identity as a 24-hour gaming and tourism economy.
      - name: "Minors Can't Loiter Where Alcohol Is Sold, With Exceptions"
        status: "Verified"
        image: "/images/collections/laws/nevada-minor-bar-loitering-ban.jpg"
        anchor_phrases:
          - "NRS 202.030"
        description: |
          **Law:** NRS 202.030 makes it a misdemeanor for anyone under 21 to be present on the premises of a bar, punishable by up to a $500 fine.

          **Meaning:** The rule does not apply to restaurants that serve alcohol only alongside meals at tables separate from the bar, or to grocery and drug stores that don't sell drinks for on-premises consumption.

          **Reason:** Casino resorts add their own layer on top of the state law: NRS 463.350 lets a minor sit in a hotel-casino's theater or show-room if accompanied by a parent or responsible adult, even though the same minor could not linger at the casino's bar.
      - name: "Open Containers Are Legal on Parts of the Strip"
        status: "Verified"
        image: "/images/collections/laws/nevada-strip-open-container-rules.jpg"
        anchor_phrases:
          - "Las Vegas Strip"
        description: |
          **Law:** Nevada allows open alcohol containers in plastic or paper cups on the Las Vegas Strip, though a Clark County ordinance bans carrying glass containers there.

          **Meaning:** Downtown, on Fremont Street, an open container is only legal if it was purchased from a licensed establishment; carrying one bought at a store is prohibited.

          **Reason:** The patchwork reflects Nevada's broader approach of letting local jurisdictions write the specific rules for public drinking, while the state itself sets almost no default restriction at all.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Nevada Never Set a Statewide Last Call"
    paragraphs:
      - "Nevada built its modern gaming economy on round-the-clock casino floors, and its alcohol laws followed that model instead of the closing-time rules found almost everywhere else. NRS 369.487 sets no mandatory closing time for alcohol sales, leaving the decision to cities and counties instead of the Legislature."
      - "Clark County, home to the Las Vegas Strip, and the cities of Las Vegas and Reno all chose to allow continuous service rather than impose their own cutoff. That local choice, repeated across the state's major population centers, is why Nevada functions as a genuine 24-hour drinking state rather than one that merely lacks a rule on paper."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "NRS 369.487 is the specific statute that leaves Nevada without a statewide mandatory closing time for alcohol sales."
      - "Underage loitering at a bar under NRS 202.030 is a misdemeanor carrying up to a $500 fine, separate from any minor-in-possession charge."
      - "A minor can sit in a hotel-casino's show-room under NRS 463.350 if accompanied by a parent, even though the same minor cannot linger at that casino's bar."
      - "Nevada's open-container rules vary by exact location on the Las Vegas Strip: plastic and paper cups are allowed, but a county ordinance bans glass."

