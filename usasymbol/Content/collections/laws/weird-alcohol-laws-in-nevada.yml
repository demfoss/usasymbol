faq:
  - question: "Do Nevada bars have a last call?"
    answer: "Not statewide. NRS 369.487 sets no mandatory closing time for alcohol sales, and Clark County, Las Vegas, and Reno all choose to allow round-the-clock service. Smaller jurisdictions can set their own local hours."

  - question: "Can minors sit at a bar in Nevada?"
    answer: "No. NRS 202.030 bars anyone under 21 from loitering on a bar's premises, with a $500 fine as the penalty. Restaurants that serve alcohol only alongside meals at separate tables are exempt from the rule."

  - question: "Can minors be inside a casino in Nevada?"
    answer: "Areas where gaming and drinking happen are off-limits to minors under NRS 463.350, but a minor accompanied by a parent or responsible adult can be present in a hotel-casino's theater or show-room."

  - question: "Is it legal to walk around Las Vegas with a drink?"
    answer: "On the Strip, an open container in a plastic or paper cup is legal, though a Clark County ordinance bans glass. On Fremont Street downtown, the drink has to have come from a licensed establishment; one bought at a store does not qualify."

