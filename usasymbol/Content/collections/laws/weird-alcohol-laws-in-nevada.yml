  quick_answer:
    - "Nevada Revised Statute 369.487 allows alcohol sales 24 hours a day, seven days a week, with no statewide mandatory closing time."
    - "Nevada law bars anyone under 21 from loitering at a bar, with exceptions for restaurants serving alcohol only alongside meals and for certain casino venues."
    - "Open containers are legal in plastic or paper on the Las Vegas Strip, but Clark County bans glass, and downtown Fremont Street requires proof the drink came from a licensed establishment."

