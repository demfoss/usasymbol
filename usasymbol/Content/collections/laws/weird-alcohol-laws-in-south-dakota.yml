faq:
  - question: "Is alcohol legal on the Pine Ridge Reservation?"
    answer: "No. The Oglala Sioux Tribe has banned the sale and possession of alcohol on Pine Ridge since 1832. Residents voted to legalize it in 2013, but disputes over the vote led to a canceled 2016 revote, and the ban has remained in place since."

  - question: "When did South Dakota allow Sunday alcohol sales?"
    answer: "South Dakota lifted its statewide ban on Sunday alcohol sales on July 1, 2019, through Senate Bill 157. Before that date, retailers could not legally sell alcohol on Sundays anywhere in the state."

  - question: "Can wineries ship wine directly to South Dakota?"
    answer: "Yes, under a Direct Wine Shipper license created in 2015. The law caps shipments at 12 cases, or roughly 108 liters, per person per year, whether the winery is based in South Dakota or another state."

  - question: "What happened to the liquor stores near Pine Ridge?"
    answer: "For decades, four stores in Whiteclay, Nebraska, just across the border from Pine Ridge, sold millions of cans of beer annually to reservation residents. Nebraska regulators revoked the stores' liquor licenses effective May 1, 2024, ending the arrangement."

