sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in South Dakota That Are Real"
    paragraphs:
      - "South Dakota's alcohol rules split between a tribal prohibition older than the state itself and a set of modern statutes governing sales hours and direct shipping."
    highlights:
      - name: "Pine Ridge Reservation's Alcohol Ban Predates the State"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-pine-ridge-alcohol-ban.jpg"
        anchor_phrases:
          - "alcohol sales and possession"
          - "1832"
        description: |
          **Law:** The Oglala Sioux Tribe has prohibited the sale and possession of alcohol on the Pine Ridge Reservation since 1832, nearly six decades before South Dakota became a state.

          **Meaning:** Tribal law, not South Dakota state law, governs the reservation. Residents voted narrowly in 2013 to legalize alcohol sales, but protests and a canceled 2016 revote left the ban in place.

          **Reason:** The tribe cited alcohol-related crime and health problems on the reservation as the reason the prohibition has outlasted a vote meant to repeal it.
      - name: "Sunday Sales Were Banned Statewide Until 2019"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-sunday-sales-repeal.jpg"
        anchor_phrases:
          - "Sunday alcohol sales"
          - "Senate Bill 157"
        description: |
          **Law:** South Dakota Codified Laws § 35-4-81 sets alcohol sale hours from 7 a.m. to 2 a.m., covering every day of the week including Sunday.

          **Meaning:** Before Senate Bill 157 took effect on July 1, 2019, retailers across the state could not legally sell alcohol on Sundays at all.

          **Reason:** South Dakota was one of the last states to drop its Sunday blue law, and cities still retain some authority to add local restrictions on top of the state rule.
      - name: "Wine Shippers Face a 12-Case Annual Cap"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-wine-shipper-cap.jpg"
        anchor_phrases:
          - "12 cases"
          - "Direct Wine Shipper license"
        description: |
          **Law:** Under the Direct Wine Shipper license created in 2015, an in-state or out-of-state winery may ship wine straight to a South Dakota resident, but no more than 12 cases per person per year.

          **Meaning:** A wine club or out-of-state winery has to track shipments per household, not just per order, to stay under the cap.

          **Reason:** Lawmakers used the case limit to open direct shipping to consumers without turning it into a wholesale workaround for the state's three-tier distribution system.

  - id: why-the-ban-outlasted-the-vote
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Pine Ridge Alcohol Ban Survived a Legalization Vote"
    paragraphs:
      - "Voters on the Pine Ridge Reservation approved legalizing alcohol sales in August 2013 by a margin of 1,843 to 1,683. The plan was to use tax revenue for treatment and education programs, addressing addiction with the same substance driving it. Questions about how the vote was conducted followed almost immediately, and opponents argued the tribal council had never properly finalized the result."
      - "A revote was scheduled for 2016 to settle the dispute, but protests convinced the tribal council to cancel it rather than risk reopening the fight. No commercial alcohol sales followed, and the century-old ban has remained the operating rule on the reservation ever since. The nearby town of Whiteclay, Nebraska, filled the gap for decades, selling millions of cans of beer a year to reservation residents until Nebraska regulators forced its last liquor stores to close in 2024."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "The Oglala Sioux Tribe's alcohol ban on Pine Ridge has been in continuous effect since 1832, longer than South Dakota has existed as a state."
      - "Whiteclay, Nebraska, a town of about 14 people bordering Pine Ridge, sold roughly 5 million cans of beer a year before its last liquor licenses were revoked in 2024."
      - "South Dakota's Sunday sales ban lasted until 2019, decades after most Midwestern neighbors had already repealed similar blue laws."
      - "South Dakota's direct wine shipping cap works out to no more than 108 liters of wine per household per year, based on nine liters per case."

