page:
  h1: "Weird Alcohol Laws in South Dakota"

  quick_answer:
    - "The Oglala Sioux Tribe has banned alcohol sales and possession on the Pine Ridge Reservation since 1832, and the ban still stands even though residents voted to end it in 2013."
    - "South Dakota only lifted its statewide ban on Sunday alcohol sales in 2019, when Senate Bill 157 allowed sales starting at 7 a.m."
    - "Out-of-state wineries can ship directly to South Dakota residents, but state law caps each shipper at 12 cases per household per year."

