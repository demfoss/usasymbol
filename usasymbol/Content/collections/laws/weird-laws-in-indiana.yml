faq:
  - question: "Is it illegal to coast downhill in neutral in Indiana?"
    answer: "Yes. Indiana's traffic code bans coasting on a downgrade with the transmission in neutral, and commercial drivers can't coast with the clutch disengaged either. Losing engine braking on a hill is the safety concern behind the rule."

  - question: "Is noodling, or hand fishing, legal in Indiana?"
    answer: "No. Taking fish using only your hands is banned under Indiana's fishing code, a Class C misdemeanor. A dozen nearby states legalized the practice between 2001 and 2018, but Indiana kept its ban in place."

  - question: "Did Indiana really try to legally redefine pi?"
    answer: "Yes, in 1897. A bill declaring pi equal to 3.2 passed the Indiana House unanimously before a Purdue math professor talked the Senate into shelving it. Pi was never actually redefined."

  - question: "When could you first buy carryout alcohol on a Sunday in Indiana?"
    answer: "2018. Indiana banned Sunday carryout sales from statehood until state lawmakers passed a law allowing noon-to-8-p.m. sales that year."

  - question: "Is the mustache-kissing law in Indiana real?"
    answer: "That claim doesn't check out. No statute, county code, or city ordinance matching it exists anywhere in Indiana. The story circulates without a date or location attached, which is typical of an urban legend rather than a real law."

  - question: "Is it illegal to run a lemonade stand in Indiana?"
    answer: "Not under any law written specifically about lemonade. Some county health departments have applied general food-vendor permit rules to kids' stands, which is where the myth started, and state lawmakers have pushed legislation limiting how far local health rules can go against casual stands."
