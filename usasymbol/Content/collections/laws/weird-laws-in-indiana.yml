page:
  h1: "Unusual Laws in Indiana That Are Still Enforced Today"

  quick_answer:
    - "Indiana's noodling ban, its downhill-coasting rule, and Warsaw's snowball ordinance are real, and the old Sunday carryout ban stayed law until 2018."
    - "Pi was never legally redefined in Indiana. A 1897 bill setting it at 3.2 passed the House, then died in the Senate."
    - "Mustache-kissing bans, the Gary garlic rule, and father's-permission ring claims have no matching statute or ordinance anywhere in Indiana."

