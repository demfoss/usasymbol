sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Indiana That Are Real"
    paragraphs:
      - "A statewide ban on coasting downhill in neutral gear has sat in the Indiana traffic code for decades, and it still applies to every driver in the state. It belongs on any honest list of Weird Indiana Laws Still on the Books, alongside a hand-fishing ban and one small city's rule about winter mischief."
    highlights:
      - name: "Coasting Downhill in Neutral Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/indiana-coasting-neutral.jpg"
        anchor_phrases:
          - "coasting downhill in neutral"
        description: |
          **Law:** Indiana bans drivers from coasting down a hill with the transmission in neutral or, for commercial vehicles, with the clutch disengaged.

          **Meaning:** Shifting out of gear on a downgrade to save fuel or coast quietly is a traffic violation, not a clever driving trick.

          **Reason:** Losing engine braking on a hill cuts a driver's ability to react to traffic or control speed, so the rule targets a real stopping-distance problem rather than random behavior.
      - name: "Catching Fish With Bare Hands Is Banned"
        status: "Verified"
        image: "/images/collections/laws/indiana-noodling-ban.jpg"
        anchor_phrases:
          - "hand-fishing ban"
          - "noodling"
        description: |
          **Law:** Indiana prohibits taking fish from state waters using the hands alone, the technique known as noodling.

          **Meaning:** Reaching into underwater holes to grab spawning catfish by hand, instead of using a rod, net, or another legal method, breaks this rule even if the fish gets released.

          **Reason:** Noodling targets catfish while they guard nests, and wildlife officials have treated that spawning-season disruption as a bigger risk to the population than ordinary rod-and-reel fishing.
      - name: "Sunday Carryout Alcohol Was Banned Until 2018"
        status: "Verified (Repealed)"
        image: "/images/collections/laws/indiana-sunday-alcohol-ban.jpg"
        anchor_phrases:
          - "Sunday carryout ban"
        description: |
          **Law:** From statehood in 1816 until 2018, Indiana barred stores from selling carryout beer, wine, and liquor on Sundays.

          **Meaning:** Shoppers could buy a drink at a restaurant or bar on Sunday but could not carry a bottle out of a liquor store or grocery.

          **Reason:** The ban traced back to religious blue-law traditions treating Sunday as a day set apart from ordinary commerce, and it outlasted Prohibition by more than 80 years before lawmakers finally repealed it.
      - name: "Warsaw Bans Throwing Snowballs Across the Street"
        status: "Verified"
        image: "/images/collections/laws/indiana-warsaw-snowball-ordinance.jpg"
        anchor_phrases:
          - "Warsaw's snowball ordinance"
        description: |
          **Law:** Warsaw makes it unlawful to throw a snowball, stone, or other hard object along, across, or over any street, alley, or sidewalk within city limits.

          **Meaning:** A snowball fight that sends a throw across traffic or a public sidewalk technically breaks city code, not just neighborhood etiquette.

          **Reason:** The ordinance groups snowballs with rocks and other missiles because the real concern is a hard object striking a driver, cyclist, or pedestrian without warning.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Indiana We Couldn't Verify"
    paragraphs:
      - "No statute or city code has ever turned up to back the mustache-kissing claim that headlines nearly every list of Weird Laws in Indiana, and it isn't the only one that fails a records search."
    subsections:
      - subtitle: "A Man With a Mustache Cannot Kiss in Public If It Tickles"
        status: "Not Verified"
        anchor_phrases:
          - "mustache-kissing claim"
        text: |
          **Claim:** A man with a mustache who habitually kisses other people commits a public offense if his mustache tickles them.

          **Why We Couldn't Verify It:** No Indiana statute or municipal ordinance matching this claim has turned up in any code search. There is no city, county, or date attached to the story anywhere, which is usually the sign of a joke that got repeated until it sounded official.
      - subtitle: "Movie Theaters Ban Garlic Eaters for Four Hours in Gary"
        status: "Not Verified"
        anchor_phrases:
          - "Gary garlic rule"
        text: |
          **Claim:** Anyone who has eaten garlic within four hours cannot ride a streetcar or enter a movie theater in Gary.

          **Why We Couldn't Verify It:** Gary's current code of ordinances contains no garlic restriction, no streetcar reference, and no theater rule resembling this claim. Streetcars stopped running in Gary decades ago, which suggests the story is older than any code still in force.
      - subtitle: "A Man Needs a Father's Written Permission to Buy an Engagement Ring"
        status: "Not Verified"
        anchor_phrases:
          - "father's-permission ring claim"
        text: |
          **Claim:** Indiana law requires a man to carry a signed letter from his fiancée's father before he can purchase an engagement ring.

          **Why We Couldn't Verify It:** Indiana's actual ring statutes only cover what happens after an engagement ends, deciding who keeps the ring. Nothing in state law addresses permission to buy one in the first place, and no county or store has ever produced the supposed letter requirement.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Indiana Laws That Are Myths"
    paragraphs:
      - "Indiana's pi story anchors nearly every list of Real Indiana Laws You Won't Believe. The one detail people get wrong is that pi was never actually redefined in law."
    subsections:
      - subtitle: "Indiana Legally Set Pi to Exactly 3.2"
        status: "Myth"
        anchor_phrases:
          - "Indiana pi bill"
        text: |
          **Myth:** Indiana passed a law defining pi as exactly 3.2.

          **Reality:** An 1897 bill making that claim passed the Indiana House by a lopsided vote, but a Purdue math professor visiting the Statehouse persuaded the Senate to shelve it before a final vote. Because it never passed, pi was never redefined in Indiana or anywhere else.
      - subtitle: "Carrying Ice Cream in Your Back Pocket Is Illegal"
        status: "Myth"
        anchor_phrases:
          - "ice-cream-in-your-back-pocket claim"
        text: |
          **Myth:** Carrying ice cream in your back pocket is illegal in Indiana.

          **Reality:** The identical claim gets attached to Alabama, Kentucky, Georgia, and other states depending on which list you read, always with the same explanation about luring horses. No Indiana statute or ordinance uses that wording, which is the usual sign of a joke copied from state to state.
      - subtitle: "Indiana Has a Law Banning Kids' Lemonade Stands"
        status: "Myth"
        anchor_phrases:
          - "lemonade stand claim"
        text: |
          **Myth:** A specific Indiana law makes children's lemonade stands illegal.

          **Reality:** No statute names lemonade at all. County health departments occasionally applied general food-vendor permit rules to kids' stands, which is where the "illegal" story came from, and state lawmakers have since pushed legislation limiting how far local health rules can go against casual stands.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Indiana's 1980 Home Rule Act Lets City Ordinances Outlive Their Purpose"
    paragraphs:
      - "Indiana replaced its old Dillon's Rule system with the Home Rule Act in 1980, giving cities and towns broad authority to pass ordinances without asking the General Assembly first. Warsaw's snowball rule and thousands of similar small-town ordinances exist because of that shift, not because state lawmakers ever debated them."
      - "Nobody at the Statehouse reviews municipal code on a set schedule, and repealing an obscure local ordinance takes a council vote nobody is pushing for. A rule about snowballs on a public street just sits there, technically enforceable, until a reporter or a curious resident notices it again."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Indiana's noodling ban carries the same Class C misdemeanor charge as many minor traffic tickets, not a felony."
      - "When Indiana finally allowed Sunday carryout sales in 2018, lawmakers gave stores the narrowest window of the week: just noon to 8 p.m."
      - "State law defines public nudity in unusually specific terms, spelling out clothing-coverage requirements in more detail than most states bother to write into a criminal code."
      - "Indiana's ban on hand-fishing sits in the same code section as bans on catching fish with firearms and explosives, all treated as equally unsafe methods."
      - "About a dozen nearby and southern states legalized noodling between 2001 and 2018. Indiana never followed suit."

