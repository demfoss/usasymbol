faq:
  - question: "Does Utah still have the Zion Curtain law?"
    answer: "It depends on the restaurant. Utah dropped the mandatory drink-mixing wall in 2017 in favor of an optional buffer zone, but a 2023 legislative push reinstated a version of the barrier requirement specifically for restaurants receiving new liquor licenses."

  - question: "Why is Utah a control state for alcohol?"
    answer: "Utah is one of 18 U.S. control states, where government directly manages some or all alcohol wholesale or retail sales. Utah's system routes wine and spirits for off-premise consumption through state-run stores rather than private retailers."

  - question: "Is Utah beer really weaker than beer in other states?"
    answer: "Not by much, and the reputation is largely a myth. Utah's old 3.2% cap was measured by weight, equal to roughly 4% by volume, similar to many standard beers. The cap rose to 4% by weight, about 5% ABV, on November 1, 2019, and state liquor stores have always sold stronger beer."

  - question: "Can you buy canned cocktails in Utah?"
    answer: "Yes, since May 1, 2024. Utah law allows retailers outside the state liquor store system to sell sealed canned cocktails up to 12 ounces with no more than 10% alcohol by volume."

