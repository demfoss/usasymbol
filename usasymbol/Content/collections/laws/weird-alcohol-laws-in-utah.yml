sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Utah That Are Real"
    paragraphs:
      - "Utah runs one of the most tightly regulated alcohol systems in the country, and the state keeps adjusting the rules even after loosening them."
    highlights:
      - name: "The Zion Curtain Keeps Coming Back"
        status: "Verified"
        image: "/images/collections/laws/utah-zion-curtain-law.jpg"
        anchor_phrases:
          - "Zion Curtain"
        description: |
          **Law:** Utah's original Zion Curtain rule required restaurants to mix and pour drinks behind a physical wall, out of customers' view, intended to shield children from watching alcohol preparation.

          **Meaning:** The wall requirement fell in 2017, replaced by an optional buffer zone between the bar and dining area. In 2023, lawmakers moved to bring back a version of the barrier requirement specifically for newly licensed restaurants.

          **Reason:** Utah's lawmakers have repeatedly balanced restaurant industry pressure to drop the rule against a persistent preference for keeping alcohol preparation out of general view.
      - name: "Utah Runs a Full State Liquor Monopoly"
        status: "Verified"
        image: "/images/collections/laws/utah-state-liquor-monopoly.jpg"
        anchor_phrases:
          - "control state"
          - "monopoly"
        description: |
          **Law:** Utah is one of 18 control states, where the state government directly controls the wholesale or retail sale of alcohol, and Utah's version covers wine and spirits at the state level.

          **Meaning:** Wine and spirits for off-premise consumption are sold only through state-run stores, not private retailers.

          **Reason:** A 2024 law began gradually increasing the state's full-service restaurant license quota over seven years, moving from 1 license per 4,467 residents toward 1 per 3,167, easing a separate bottleneck in the same control system.
      - name: "Canned Cocktails Got a New Legal Lane in 2024"
        status: "Verified"
        image: "/images/collections/laws/utah-canned-cocktails-2024.jpg"
        anchor_phrases:
          - "canned cocktails"
        description: |
          **Law:** Since May 1, 2024, Utah retailers can sell pre-mixed canned cocktails in sealed containers up to 12 ounces with no more than 10% alcohol by volume outside the state liquor store system.

          **Meaning:** A shopper can now buy a sealed, single-serving cocktail in some retail settings without visiting a state-run liquor store.

          **Reason:** The change carved out a narrow retail category for ready-to-drink products without altering Utah's broader control-state structure for spirits and wine.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Utah Alcohol Claims That Are Myths"
    paragraphs:
      - "Utah's reputation for weak beer is one of the most repeated alcohol myths in the country, and it rests on a measurement mix-up rather than an actual state secret."
    subsections:
      - subtitle: "Utah Only Sells Watered-Down Beer"
        status: "Myth"
        anchor_phrases:
          - "3.2 beer"
        text: |
          **Myth:** Utah beer sold outside state liquor stores is weak "near beer," far under the strength found elsewhere.

          **Reality:** Utah measured alcohol by weight rather than by volume, so its old 3.2% cap actually equaled about 4% alcohol by volume, close to many standard beers sold nationwide. The state raised the grocery and convenience store cap to 4% by weight, or roughly 5% ABV, on November 1, 2019, and state liquor stores have always carried stronger beer and barley wine as well.

  - id: why-the-curtain-keeps-returning
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Zion Curtain Keeps Coming Back"
    paragraphs:
      - "Utah tore down the mandatory drink-mixing wall in 2017 after years of restaurant industry complaints that it hurt business without changing how much alcohol customers actually consumed. Restaurants got the option of a 10-foot buffer zone instead, letting diners watch drinks being made as long as they weren't seated right next to the bar."
      - "Six years later, lawmakers introduced legislation that would reinstate a stricter barrier requirement for restaurants receiving new liquor licenses, alongside a proposed permanent ban on miniature liquor bottles. The repeated cycle reflects a legislature still weighing the same tension it faced in 2017: how visible alcohol preparation should be in a state where a majority of lawmakers belong to a faith that discourages drinking altogether."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Utah is one of only 18 control states nationwide where government controls some or all wholesale or retail alcohol sales."
      - "The 2024 restaurant license quota change spreads its increase over seven years rather than taking effect all at once."
      - "Utah's new canned cocktail rule caps container size at 12 ounces and alcohol content at 10% ABV."
      - "The 3.2 beer cap that fueled Utah's weak-beer reputation for decades ended on November 1, 2019."

