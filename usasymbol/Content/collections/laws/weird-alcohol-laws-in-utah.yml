page:
  h1: "Weird Alcohol Laws in Utah"

  quick_answer:
    - "Utah's Zion Curtain law required restaurants to mix drinks behind a wall hidden from customers. It fell in 2017, but lawmakers revived a version of the barrier requirement for newly licensed restaurants in 2023."
    - "Utah runs a full government monopoly on wine and spirits, one of 18 control states where the government controls wholesale or retail alcohol sales."
    - "The claim that Utah only sells weak 'near beer' is a myth built on a unit-conversion mix-up, and the actual grocery-store cap rose from 3.2% to 4% alcohol by weight in 2019."

