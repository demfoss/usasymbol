      - "Wooley v. Maynard, the license plate motto case, was decided 6-3 by the Supreme Court in 1977."
      - "Owning a pet ferret became legal in New Hampshire in 1993, even though hunting with one has stayed illegal since 1935."
      - "New Hampshire's House of Representatives has the smallest citizen-to-representative ratio of any state legislature in the country."
      - "The seaweed-collecting restriction applies only below the high-water mark, leaving beach areas above that line unaffected."

