page:
  h1: "Real New Hampshire Laws You Won't Believe"
  quick_answer:
    - "Four New Hampshire claims check out: no seatbelt law for adults, a nighttime seaweed-collecting ban, a 1935 ferret-hunting ban, and the license plate case that reached the Supreme Court."
    - "New Hampshire is the only state that doesn't require adults to wear seatbelts, a direct extension of the 'Live Free or Die' motto into traffic law."
    - "The claim about a Sunday urination rule is a total fabrication with no statute behind it, and the tomatoes-on-Sunday claim is a distorted blue-law myth."
