  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange New Hampshire Laws That Are Myths"
    paragraphs:
      - "Two Strange New Hampshire Laws claims collapse the moment you look for an actual citation behind either one."
    subsections:
      - subtitle: "You can't look upward while urinating on a Sunday"
        status: "Myth"
        text: |
          **Myth:** New Hampshire bans looking upward while urinating on Sundays.

          **Reality:** No statute anywhere addresses this. It's a total fabrication with no documented origin, the kind of specific-sounding claim that spreads purely because it's absurd.

      - subtitle: "Selling tomatoes on Sunday is illegal"
        status: "Myth"
        text: |
          **Myth:** New Hampshire has a specific ban on selling tomatoes on Sundays.

          **Reality:** No tomato-specific statute exists. This appears to be a distorted memory of general Sunday blue-law history involving broader retail categories, narrowed down into a joke about one vegetable.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New Hampshire's 400-Member House Rarely Cleans House"
    paragraphs:
      - "New Hampshire's House of Representatives has 400 members, making it the largest state legislative body in the country and the third-largest parliamentary body in the world. With up to 1,000 bills to consider in a single session and one representative for roughly every 3,300 residents, a narrow statute like the ferret-hunting ban competes against an enormous volume of current legislation, and mostly loses."

