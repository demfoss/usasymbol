faq:
  - question: "Do adults have to wear seatbelts in New Hampshire?"
    answer: "No. New Hampshire is the only state with no seatbelt requirement for drivers and passengers 18 and older, though children through age 17 must still be restrained."
  - question: "Is hunting with a ferret illegal in New Hampshire?"
    answer: "Yes. Having a ferret in your possession while hunting has been against the law since a 1935 codification, even though owning a pet ferret has been legal since 1993."
  - question: "What was the Supreme Court case about New Hampshire license plates?"
    answer: "Wooley v. Maynard, decided in 1977. A Jehovah's Witness couple was jailed for covering the 'Live Free or Die' motto, and the Supreme Court ruled the state couldn't force citizens to display it."
  - question: "Can you collect seaweed on a New Hampshire beach?"
    answer: "During the day, generally yes. State law specifically bans collecting seaweed or rockweed below the high-water mark between evening and morning."
  - question: "Is there really a law about urinating on Sundays in New Hampshire?"
    answer: "No. This is a fabricated claim with no statute behind it anywhere in New Hampshire law."
  - question: "What is the weirdest real law still on the books in New Hampshire?"
    answer: "The ferret-hunting ban stands out because it's oddly specific: only dogs and falcons are authorized hunting companions, and the rule has survived unchanged since 1935."
