sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in New Hampshire That Are Real"
    paragraphs:
      - "New Hampshire is the only state where an adult can legally skip the seatbelt, and that's just one of several Unusual Laws in New Hampshire that hold up against the actual statute."
    highlights:
      - name: "Adults Aren't Required to Wear Seatbelts"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-seatbelt-law.jpg"
        description: |
          **Law:** New Hampshire is the only state in the country with no seatbelt requirement for drivers or passengers age 18 and older.

          **Meaning:** Children through age 17 must still be properly restrained. The exemption applies only to adults.

          **Reason:** Repeated legislative attempts to pass a universal seatbelt law have failed for decades, largely on personal-liberty grounds tied directly to the state's "Live Free or Die" motto.

      - name: "You Can't Collect Seaweed at Night"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-seaweed-law.jpg"
        description: |
          **Law:** Carrying away seaweed or rockweed from the shore below the high-water mark between evening and morning is a violation.

          **Meaning:** Daytime collecting isn't covered by this particular statute. The rule specifically targets the nighttime window.

          **Reason:** It was written to curb unauthorized, hard-to-monitor harvesting of a coastal resource used commercially as fertilizer and animal feed along New Hampshire's short shoreline.

      - name: "Hunting With a Ferret Has Been Illegal Since 1935"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-ferret-law.jpg"
        description: |
          **Law:** Having a ferret in your possession while hunting, or clearly on your way to or from hunting, is against the law.

          **Meaning:** Only dogs and falcons are authorized hunting companions in New Hampshire. A ferret used to flush rabbits from burrows doesn't qualify.

          **Reason:** The ban dates to a 1935 codification of the state's hunting rules. Owning a pet ferret has been legal since 1993, but the hunting-specific ban was never lifted, and lawmakers have floated repeal bills as recently as 2026.

      - name: "Covering the License Plate Motto Was Once a Crime"
        status: "Repealed"
        image: "/images/collections/laws/new-hampshire-license-plate-motto.jpg"
        description: |
          **Law:** New Hampshire once made it a misdemeanor to obscure the "Live Free or Die" motto stamped on a vehicle's license plate.

          **Meaning:** A Jehovah's Witness couple who covered the motto for religious reasons was convicted and jailed under this exact law in the 1970s.

          **Reason:** Their case, Wooley v. Maynard, reached the U.S. Supreme Court in 1977, which ruled the state couldn't force citizens to display an ideological message on their own property. The plates still carry the motto today, but the state can no longer punish drivers for covering it.

