sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in New York That Are Real"
    paragraphs:
      - "Four of the most-cited Unusual Laws in New York check out once you read the actual statute text, and each one is narrower and stranger in the real wording than the internet version suggests."
    highlights:
      - name: "Throwing Balls at a Person for Entertainment Is a Crime"
        status: "Verified"
        image: "/images/collections/laws/new-york-offensive-exhibition.jpg"
        description: |
          **Law:** New York bans running a public entertainment act where someone is held up to ridicule by having balls, arrows, or knives thrown at their head or body, or where a firearm is discharged at a person.

          **Meaning:** It is not about backyard dodgeball. The statute targets promoters who stage the spectacle, not people getting hit by accident.

          **Reason:** Early 20th-century carnivals ran "hit the target" acts where workers took the throws for tips, and lawmakers stepped in to stop operators from profiting off staged human targets.
      - name: "Selling Dog or Cat Fur Is Illegal"
        status: "Verified"
        image: "/images/collections/laws/new-york-dog-cat-fur-ban.jpg"
        description: |
          **Law:** New York prohibits importing, selling, manufacturing, or transporting the fur, hair, skin, or flesh of a domesticated dog or cat.

          **Meaning:** Coyote, fox, and other wild furs are unaffected. Only products made from dogs and cats are covered, and a company must certify to retailers that a fur item does not contain either.

          **Reason:** Lawmakers passed the ban after learning that cheap fur-trimmed garments sold in the United States sometimes contained dog or cat fur mislabeled as something else.
      - name: "Tiger Selfies Are Banned at Traveling Shows"
        status: "Verified"
        image: "/images/collections/laws/new-york-tiger-selfie-ban.jpg"
        description: |
          **Law:** Since 2015, New York has banned direct public contact with lions, tigers, leopards, jaguars, and cougars at traveling exhibits and fairs.

          **Meaning:** Petting zoos and circuses can no longer let visitors pose for photos next to big cats.

          **Reason:** Dating-app "tiger selfies" had turned into a photo trend, and wildlife advocates pushed the bill after cubs bred for the photo ops were mistreated and then discarded once grown.
      - name: "Dueling Is Still on the Books as a Crime"
        status: "Verified"
        image: "/images/collections/laws/new-york-dueling-law.jpg"
        description: |
          **Law:** New York's Military Law still makes it a court-martial offense to fight, promote, or fail to report a duel.

          **Meaning:** The rule today only reaches people subject to the state's military code, such as National Guard members, not the general public.

          **Reason:** New York passed its first anti-dueling statutes after the 1804 Burr-Hamilton duel turned a sitting vice president into a fugitive from justice, and the ban never left the code even as its reach narrowed over time.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in New York We Couldn't Verify"
    paragraphs:
      - "Not every entry on a New York weird-laws list traces back to an actual page of legal text, and three claims here keep circulating with nothing but a listicle behind them."
    subsections:
      - subtitle: "Carrying an Ice Cream Cone in Your Back Pocket on Sundays Is Illegal"
        status: "Not Verified"
        text: |
          **Claim:** It's illegal to carry an ice cream cone in your back pocket on Sundays.

          **Why We Couldn't Verify It:** No current state or New York City code section matching this claim has turned up. Theories about its origin range from old Sunday blue laws to a horse-theft scare, but none point to an actual statute, so the story stays a rumor rather than a rule.
      - subtitle: "Wearing Slippers Past 10 p.m. Is Illegal"
        status: "Not Verified"
        text: |
          **Claim:** New Yorkers can be fined for wearing slippers outdoors after 10 p.m.

          **Why We Couldn't Verify It:** Every version of this claim traces back to other weird-law roundups, never to a city or state code section. No date, location, or statute number attaches to it anywhere official, which is usually the sign of a rumor repeating itself.
      - subtitle: "Puppet Shows in Storefront Windows Are Banned"
        status: "Not Verified"
        text: |
          **Claim:** Running a puppet show inside a storefront window is against the law in New York City.

          **Why We Couldn't Verify It:** Secondary sources describe an old nuisance-style rule with a small fine attached, but no current New York City Administrative Code section confirming it has surfaced. Without a citation, the claim can't be marked as real.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange New York Laws That Are Myths"
    paragraphs:
      - "A few Strange New York Laws claims are not just unverified. Each one has a clean explanation, whether that's a bill that never passed or a joke borrowed from another state's list."
    subsections:
      - subtitle: "Flirting Can Get You a $25 Fine in New York"
        status: "Myth"
        text: |
          **Myth:** Flirting in public can get you fined $25 in New York.

          **Reality:** A Dutchess County assemblyman introduced an anti-flirting bill in January 1902 aimed at curbing street harassment tied to prostitution. It never passed the Legislature. Retellings added a repeat-offender punishment of wearing horse blinders, a detail with no legal record behind it at all.
      - subtitle: "You Can't Let a Donkey Sleep in a Bathtub"
        status: "Myth"
        text: |
          **Myth:** It's illegal to let a donkey sleep in your bathtub in New York.

          **Reality:** This claim belongs to Arizona, where an old law really did address stray donkeys and tubs. New York versions of the same joke swap in the state name with nothing behind it locally.
      - subtitle: "Men Can't Wear a Jacket and Pants That Don't Match"
        status: "Myth"
        text: |
          **Myth:** New York bans men from going outside in a mismatched jacket and pants.

          **Reality:** This exact line shows up attached to a different small town in almost every state's weird-law roundup, worded nearly the same way each time. That kind of copy-paste repetition, not a real code section, is the giveaway.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New York's Consolidated Laws Keep Old Statutes Buried"
    paragraphs:
      - "New York organizes its statutes into more than 90 separate Consolidated Laws, from the Penal Law to the Agriculture and Markets Law to the Military Law, each maintained on its own track. A narrow rule like the dueling statute can sit inside Military Law for two centuries without ever crossing paths with a criminal-code cleanup bill, because nobody assigned to modernize the Penal Law has jurisdiction to touch it."
      - "New York City adds another layer on top of state law through its own Administrative Code and Charter, covering all five boroughs under one municipal government instead of hundreds of separate small-town codes. That structure is exactly why unsourced claims about window puppet shows or slipper curfews are hard to pin down: they would have to trace to one specific, searchable code section rather than a vague sense that the city once banned something."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New York's Agriculture and Markets Law caps corporate penalties for dog or cat fur sales at $25,000 per repeat violation, far steeper than the $1,000 first-offense fine for an individual."
      - "The tiger-selfie ban carries fines of $500 to $1,000 per violation, charged to the exhibitor running the show, not the visitor taking the photo."
      - "New York indicted Aaron Burr under an early dueling law after his 1804 duel with Alexander Hamilton, even though Burr was serving as sitting vice president at the time."
      - "New York's offensive exhibition law also covers dance marathons, making it illegal to run a contest where someone competes for more than eight straight hours without a break."
      - "New York's Consolidated Laws span more than 90 separate law books, one reason a rule tucked into an obscure title can outlast decades of unrelated reform bills."

