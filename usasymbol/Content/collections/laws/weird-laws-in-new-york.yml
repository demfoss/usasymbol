faq:
  - question: "Is it actually illegal to throw a ball at someone for entertainment in New York?"
    answer: "Yes. New York's offensive exhibition law bans running a public show where a person is held up to ridicule by having balls, knives, or arrows thrown at them, or by having a firearm discharged at them. It targets promoters staging the spectacle, not accidental contact during a game."
  - question: "Is dueling still illegal in New York?"
    answer: "Yes, under the Military Law. Today the rule reaches people subject to New York's military code, such as National Guard members, and covers fighting a duel, promoting one, or failing to report a challenge."
  - question: "Did New York really pass a law against flirting?"
    answer: "No. An assemblyman introduced an anti-flirting bill in 1902, but it never became law. The story kept spreading anyway, eventually picking up an invented punishment involving horse blinders."
  - question: "Is it illegal to sell dog or cat fur in New York?"
    answer: "Yes. New York's Agriculture and Markets Law bans importing, selling, or transporting fur, hair, skin, or flesh from a domesticated dog or cat, with penalties up to $25,000 for repeat corporate violations. Coyote and fox fur are not covered."
  - question: "What is the weirdest law in New York that's actually real?"
    answer: "The dueling statute is the strongest contender. It traces back to New York's response to the 1804 Burr-Hamilton duel and has never been fully removed from the Military Law, even though its modern reach is narrow."
  - question: "Is the ice cream cone in your pocket law real in New York?"
    answer: "No confirmed statute backs it up. The claim is repeated across weird-law lists with several competing origin stories, but no current city or state code section matches it."
