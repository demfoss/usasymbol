page:
  h1: "Unusual Laws in New York You Won't Believe Are Real"
  quick_answer:
    - "Four Weird Laws in New York claims are real: the carnival ball-throwing ban, the dog and cat fur ban, the tiger-selfie ban, and a dueling statute still in the Military Law."
    - "The dueling law only binds people subject to New York's military code today, not the general public looking to settle a grudge."
    - "The flirting fine and the donkey-in-a-bathtub story are myths. Ice cream cones in back pockets and 10 p.m. slippers have no confirmed source at all."
