faq:
  - question: "Why can't you buy liquor at a private store in New Hampshire?"
    answer: "New Hampshire has been a control state since its Liquor Commission formed in 1934, meaning the government, not private retailers, owns and runs every liquor store in the state. It is also the only control state that sells liquor tax-free."

  - question: "Why does New Hampshire put liquor stores at highway rest stops?"
    answer: "New Hampshire has no general sales tax, which makes selling tax-free liquor to out-of-state drivers passing through on the interstate a significant revenue source. The state has combined liquor stores with rest areas, gas pumps, and welcome centers along I-93 and I-95 for that reason."

  - question: "Has New Hampshire ever tried to privatize its liquor stores?"
    answer: "Yes. The most recent serious attempt was a 2009 bill that would have let grocery and liquor stores sell hard alcohol directly. It was killed in the House, and no later effort has come as close to passing."

  - question: "Can wineries ship wine directly to New Hampshire residents?"
    answer: "Yes, under a Direct Shipper Permit from the New Hampshire Liquor Commission. Each shipper is capped at an aggregate 600 liters of the same brand per year, and exceeding that requires offering the extra volume to the state Commission itself."

