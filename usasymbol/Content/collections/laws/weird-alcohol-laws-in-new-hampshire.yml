page:
  h1: "Weird Alcohol Laws in New Hampshire"

  quick_answer:
    - "New Hampshire has sold liquor only through state-run outlets since the Liquor Commission formed in 1934, and it's the only control state that sells that liquor tax-free."
    - "Several state liquor stores sit directly inside highway rest areas on I-93 and I-95, combining liquor sales with gas pumps and a state welcome center."
    - "Out-of-state wineries can ship wine directly to New Hampshire residents under a permit, but each shipper is capped at 600 liters of one brand per year."

