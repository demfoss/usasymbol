sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in New Hampshire That Are Real"
    paragraphs:
      - "New Hampshire's lack of a general sales or income tax shapes almost everything about how the state sells alcohol, from who can sell it to where the stores sit."
    highlights:
      - name: "The State Runs Every Liquor Store"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-state-liquor-monopoly.jpg"
        anchor_phrases:
          - "control state"
          - "1934"
        description: |
          **Law:** New Hampshire is a control state that has sold liquor only through government-owned New Hampshire Liquor & Wine Outlets since the Liquor Commission formed in 1934, and it is the only control state that sells its liquor tax-free.

          **Meaning:** A private business cannot open a standalone liquor store in New Hampshire; every full-strength spirits sale in the state runs through a state-operated outlet instead.

          **Reason:** The Legislature has repeatedly rejected bills to privatize the system, most recently a 2009 proposal, largely because liquor store profits fund close to 6.5% of state revenue in a state with no sales or income tax.
      - name: "Some Liquor Stores Sit on the Interstate Itself"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-highway-liquor-store.jpg"
        anchor_phrases:
          - "highway rest areas"
        description: |
          **Law:** New Hampshire operates several state liquor outlets directly inside highway rest areas along interstates 93 and 95, combining the liquor store with gas pumps, food, and a state welcome center in one building.

          **Meaning:** A driver passing through New Hampshire on I-93 near Hooksett can buy liquor, fill up their tank, and pick up state tourism brochures without leaving the rest stop.

          **Reason:** New Hampshire's lack of a sales tax makes highway liquor sales to out-of-state travelers a significant revenue draw, which is why the state keeps investing in these locations, including a planned 22,000-square-foot outlet on I-95 in Hampton.
      - name: "Out-of-State Wineries Can Ship In, but Only So Much"
        status: "Verified"
        image: "/images/collections/laws/new-hampshire-wine-shipping-cap.jpg"
        anchor_phrases:
          - "Direct Shipper Permit"
          - "600 liters"
        description: |
          **Law:** New Hampshire allows out-of-state wineries and retailers to ship wine directly to residents under a Direct Shipper Permit, capped at an aggregate 600 liters of the same brand per shipper per year.

          **Meaning:** A shipper who wants to send more than 600 liters of one brand into the state in a calendar year has to offer to sell the excess to the New Hampshire Liquor Commission itself.

          **Reason:** The cap lets New Hampshire preserve some of the revenue advantage of its state-run wholesale system even while allowing a workaround that most control states restrict much more tightly or ban outright.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New Hampshire Never Privatized Its Liquor Stores"
    paragraphs:
      - "New Hampshire has no general sales tax and no income tax on wages, which leaves liquor sales as one of the state's more reliable, self-generated revenue sources. The New Hampshire Liquor Commission, formed in 1934, built that revenue stream by keeping every liquor sale inside a state-run outlet rather than licensing private retailers the way most states do."
      - "The most serious privatization push came in 2009, when a bill would have let grocery and liquor stores sell hard alcohol on their own. It died in the House. With state-operated stores now bringing in close to $500 million a year and covering roughly 6.5% of state revenue, later legislatures have had even less incentive to hand that stream to private retailers."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New Hampshire's state-operated liquor stores bring in close to $500 million a year, ranking the state seventh in gross sales among control states."
      - "New Hampshire is the only control state that sells liquor tax-free, a direct result of having no general state sales tax."
      - "The state's highway liquor stores near Hooksett sit on both sides of I-93/293, each paired with its own rest-stop building."
      - "A wine shipper who wants to send more than 600 liters of one brand into New Hampshire in a year must first offer to sell the excess to the state Liquor Commission."

