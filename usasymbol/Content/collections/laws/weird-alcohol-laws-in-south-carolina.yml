faq:
  - question: "Did South Carolina really require minibottles for drinks?"
    answer: "Yes. From 1973 until January 1, 2006, South Carolina law required every mixed drink served in a bar or restaurant to be poured from a sealed 1.7-ounce minibottle. Free pouring from standard-sized bottles was illegal statewide during that entire period."

  - question: "Why did it take so long for South Carolina to end the minibottle law?"
    answer: "The minibottle requirement was written into South Carolina's constitution, not an ordinary statute, so repealing it required a statewide constitutional referendum rather than a routine legislative vote. Voters approved that change in 2004, and free pouring became legal in 2006."

  - question: "Can you buy liquor in South Carolina on Sunday?"
    answer: "Statewide retail liquor sales are banned on Sunday by default, but counties and cities can hold local referendums to allow Sunday beer and wine sales. Places like Charleston, Columbia, and Greenville have already passed such measures, while others have not."

  - question: "Are there still dry counties in South Carolina?"
    answer: "No, South Carolina has no dry counties today. What varies locally is Sunday retail sales, which depend on whether a specific county or city has passed its own referendum allowing beer and wine sales that day."

