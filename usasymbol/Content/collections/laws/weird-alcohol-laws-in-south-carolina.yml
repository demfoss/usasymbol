sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in South Carolina That Are Real"
    paragraphs:
      - "South Carolina spent decades regulating exactly how much alcohol went into a single drink, and it still leaves Sunday sales up to a patchwork of local votes."
    highlights:
      - name: "Every Mixed Drink Had to Come From a Tiny Sealed Bottle"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-minibottle-law.jpg"
        anchor_phrases:
          - "sealed 1.7-ounce minibottle"
        description: |
          **Law:** From March 28, 1973 until January 1, 2006, South Carolina law required every alcoholic drink served at a bar or restaurant to be poured from a sealed 1.7-ounce minibottle, with free pouring from standard bottles illegal statewide.

          **Meaning:** A bartender couldn't measure out a shot from a regular liquor bottle; the drink had to start life as a small, factory-sealed bottle cracked open at the bar.

          **Reason:** The minibottle rule simplified alcohol tax collection and guaranteed every customer received a standardized pour, and by the early 1990s South Carolina was the only state left enforcing it after Utah repealed its own minibottle law in 1990.
      - name: "Free Pouring Took a Constitutional Amendment to Legalize"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-free-pour-referendum.jpg"
        anchor_phrases:
          - "2004 referendum"
        description: |
          **Law:** Ending the minibottle mandate required South Carolina voters to approve a change to the state constitution in a 2004 referendum, after which free pouring from standard-sized bottles became legal on January 1, 2006.

          **Meaning:** Bartenders could not simply start free pouring once public opinion shifted; the mandate was embedded deeply enough in state law that only a constitutional vote could remove it.

          **Reason:** South Carolina had originally written minibottle requirements into its constitution rather than ordinary statute, which is why loosening it took a statewide ballot measure instead of a routine legislative vote.
      - name: "Sunday Liquor Sales Still Depend on a Local Vote"
        status: "Verified"
        image: "/images/collections/laws/south-carolina-sunday-sales-local-option.jpg"
        anchor_phrases:
          - "local referendums"
        description: |
          **Law:** South Carolina bans statewide retail liquor sales on Sunday by default, but counties and cities can hold referendums to allow Sunday sales of beer and wine, and places including Charleston, Columbia, and Greenville have already done so.

          **Meaning:** Whether a store can sell beer or wine on a Sunday depends entirely on whether that specific county or city ever held and passed its own vote.

          **Reason:** South Carolina left the Sunday sales decision to local government rather than changing the statewide default, so the rule spread unevenly as individual communities pursued their own referendums over time.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why South Carolina's Minibottle Law Outlasted Every Other State's"
    paragraphs:
      - "South Carolina's minibottle law survived so long because it solved two problems lawmakers actually cared about: it made alcohol tax collection simple to track bottle by bottle, and it guaranteed a standardized pour that supporters argued reduced over-service. Those practical arguments kept the law defensible long after every other state had dropped similar rules."
      - "Undoing it took more than public frustration with tiny, wasteful bottles. Because the requirement sat inside South Carolina's constitution rather than a regular statute, repeal needed a full referendum rather than a simple bill, which is why the law lasted until 2004 at the ballot box and 2006 in practice, decades after most bartenders in the rest of the country had already moved on."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "South Carolina's minibottle law took effect on March 28, 1973, after decades in which bars could not legally serve their own liquor at all and customers had to bring their own bottles."
      - "There are no dry counties in South Carolina today, though Sunday alcohol retail sales still vary by county and city based on local referendum results."
      - "South Carolina's standard retail liquor sale hours run 9 a.m. to 7 p.m. Monday through Saturday under state law."
      - "Vintage South Carolina minibottles have become a minor collectible item among bar memorabilia collectors since free pouring became legal in 2006."

