page:
  h1: "Weird Alcohol Laws in South Carolina"

  quick_answer:
    - "South Carolina mandated that every mixed drink served in the state come from a sealed 1.7-ounce minibottle from 1973 until free pouring finally became legal on January 1, 2006."
    - "By the early 1990s, South Carolina was the only state left in the country still requiring the minibottle for every drink, after Utah dropped its own version in 1990."
    - "South Carolina still bans statewide retail liquor sales on Sunday, though counties and cities can hold local referendums to allow Sunday beer and wine sales, and more than a dozen already have."

