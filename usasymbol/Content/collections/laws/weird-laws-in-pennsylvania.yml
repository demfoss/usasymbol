page:
  h1: "Real Pennsylvania Laws You Won't Believe"
  quick_answer:
    - "Four Pennsylvania claims check out: a real fortune-telling ban, a towed-trailer occupancy law, an explosives-in-waters permit rule, and the 2025 repeal of the state's Sunday hunting ban."
    - "The Sunday hunting ban was a genuine 200-year-old blue law until Governor Shapiro signed its full repeal in July 2025, ending one of the country's oldest surviving hunting restrictions."
    - "The bathtub-singing law and the horse-and-blanket driving rules are internet fiction with no matching statute or enacted bill anywhere in Pennsylvania's history."
