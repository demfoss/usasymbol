sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Pennsylvania That Are Real"
    paragraphs:
      - "A fortune-teller can still be fined under a law dating to 1861, and that is just the start of the Unusual Laws in Pennsylvania that hold up against the actual code."
    highlights:
      - name: "Fortune-Telling for Money Is a Crime"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-fortune-telling.jpg"
        description: |
          **Law:** Pennsylvania makes it a misdemeanor to tell fortunes, read palms, or sell love potions for payment.

          **Meaning:** The rule only covers doing it "for gain or lucre." A friend reading your palm for fun breaks no law, but charging for the same act does.

          **Reason:** The statute dates to 1861 and was aimed at con artists who used fortune-telling to defraud people out of money. It survived two full recodifications, in 1939 and again in 1972.

      - name: "You Can't Ride Inside a Towed Trailer or Boat"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-towed-trailer.jpg"
        description: |
          **Law:** Nobody may occupy a house trailer, mobile home, or boat while it's being towed on a highway, and towing one with a person inside is also banned.

          **Meaning:** A camper being pulled down the interstate has to be empty. Riding inside it, even just for a short trip, is a ticket.

          **Reason:** An unsecured trailer interior offers no seatbelts, no crash protection, and no way to see the road, so the rule treats it as a basic highway-safety issue rather than a novelty.

      - name: "Explosives in Pennsylvania Waters Require a Permit"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-explosives-waters.jpg"
        description: |
          **Law:** Placing explosives in Pennsylvania's waters without a Fish and Boat Commission permit is a misdemeanor.

          **Meaning:** This is the real law behind the old "you can't dynamite fish in Pennsylvania" claim. Permits exist only for legitimate engineering work, never for catching fish.

          **Reason:** Blast fishing kills indiscriminately and can wreck a waterway's fish population for years, so the law closes off the method entirely rather than trying to regulate it.

      - name: "The Sunday Hunting Ban Lasted Nearly 200 Years"
        status: "Repealed"
        image: "/images/collections/laws/pennsylvania-sunday-hunting.jpg"
        description: |
          **Law:** Pennsylvania banned hunting on Sundays for roughly two centuries, one of the last states in the country to hold onto the restriction.

          **Meaning:** Hunters could scout, trap, or fish on a Sunday, but firing a gun or bow at game was off-limits until lawmakers chipped away at the rule with a few exception dates starting in 2019.

          **Reason:** The ban traces to a much older blue-law tradition meant to keep Sundays reserved for churchgoing. Governor Shapiro signed House Bill 1431 in July 2025, fully repealing it after years of pressure from sportsmen's groups and the state Game Commission.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Pennsylvania We Couldn't Verify"
    paragraphs:
      - "Search for Weird Laws in Pennsylvania and a handful of claims keep surfacing on law-firm blogs without a single ordinance number behind any of them."
    subsections:
      - subtitle: "Fish can only be caught by the mouth, not by hand"
        status: "Not Verified"
        text: |
          **Claim:** Pennsylvania law bans catching a fish with any body part other than the mouth.

          **Why We Couldn't Verify It:** The Fish and Boat Code lists authorized gear like rods and lines, which indirectly rules out hand-fishing, but no regulation anywhere uses "mouth" language or names hand-fishing specifically. The claim looks like an exaggerated retelling of the general gear rule.

      - subtitle: "Pittsburgh once banned driving mules through the streets"
        status: "Not Verified"
        text: |
          **Claim:** An old Pittsburgh ordinance made it illegal to drive a mule down city streets.

          **Why We Couldn't Verify It:** No ordinance number or date turns up in Pittsburgh's current municipal code. If a rule like this ever existed, it may have been dropped during a later recodification, but nothing confirms it was ever on the books.

      - subtitle: "Drivers must carry flares in case of a breakdown on a dark road"
        status: "Not Verified"
        text: |
          **Claim:** Every Pennsylvania driver is required to carry warning flares for emergencies.

          **Why We Couldn't Verify It:** The Vehicle Code sets emergency-equipment rules for commercial trucks, but no section requires flares in an ordinary passenger car. This appears to be a blur of the commercial rule into a claim about all drivers.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Pennsylvania Laws That Are Myths"
    paragraphs:
      - "Weird Pennsylvania Laws Still on the Books lists online almost always include two stories that were never enacted at all, no matter how specific the dates sound."
    subsections:
      - subtitle: "The 1969 'Bathroom Singing Prohibition Act' bans singing in the bathtub"
        status: "Myth"
        text: |
          **Myth:** A 1969 law called the Bathroom Singing Prohibition Act makes it illegal to sing in the bathtub.

          **Reality:** No such act exists in Pennsylvania's legislative history. The specific name and year appear to be an invention added by blogs to make a generic joke sound like real legal citation. Only an extreme noise disturbance could ever trigger an ordinary disorderly-conduct charge.

      - subtitle: "Drivers must stop and cover their car with a blanket when a horse approaches"
        status: "Myth"
        text: |
          **Myth:** A Pennsylvania law required drivers to pull over, cover the car with a blanket matching the scenery, and send up a warning rocket whenever a horse approached.

          **Reality:** This traces to a real but satirical set of rules floated by a rural anti-automobile group in the early 1900s. The proposal was never passed into law, yet it gets reprinted constantly as if it were an actual enacted statute.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why 2,560 Pennsylvania Municipalities Never Finish Cleaning Their Codes"
    paragraphs:
      - "Pennsylvania has 2,560 separate municipalities, more boroughs and townships than almost any other state, and each one writes and amends its own ordinances independently. Add the largest full-time state legislature in the country, and there's still no single body responsible for auditing thousands of local codes for outdated rules, which is exactly how a two-century-old Sunday hunting ban outlasted the automobile, the airplane, and the internet."

