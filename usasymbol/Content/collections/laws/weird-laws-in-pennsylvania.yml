faq:
  - question: "Is fortune-telling illegal in Pennsylvania?"
    answer: "Yes. Telling fortunes, reading palms, or selling love potions for payment is a misdemeanor under a law dating to 1861. Doing it for free, as a hobby or a party trick, isn't covered."
  - question: "Can you ride inside a camper while it's being towed in Pennsylvania?"
    answer: "No. State law bans occupying a house trailer, mobile home, or boat while it's being towed on a highway, and towing one with someone inside is also illegal."
  - question: "Is dynamite fishing illegal in Pennsylvania?"
    answer: "Placing explosives in state waters without a Fish and Boat Commission permit is a misdemeanor. Permits are issued only for legitimate engineering work, never for catching fish."
  - question: "When did Pennsylvania repeal its Sunday hunting ban?"
    answer: "Governor Shapiro signed House Bill 1431 in July 2025, fully repealing a restriction that had stood for roughly 200 years and made Pennsylvania one of the last states to allow hunting every day of the week."
  - question: "Is the bathtub-singing law in Pennsylvania real?"
    answer: "No. There is no 'Bathroom Singing Prohibition Act of 1969' or any other law banning singing in the bathtub anywhere in Pennsylvania's legislative record."
  - question: "What is the weirdest real law still on the books in Pennsylvania?"
    answer: "The fortune-telling ban surprises people the most, since it's a currently enforced criminal statute rather than some forgotten relic, and it's over 160 years old."
