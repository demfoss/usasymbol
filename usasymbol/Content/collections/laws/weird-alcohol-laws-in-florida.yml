page:
  h1: "Weird Alcohol Laws in Florida"

  quick_answer:
    - "Florida banned the 64-ounce beer growler for years, the industry-standard size sold nearly everywhere else, while allowing only 32-ounce or one-gallon containers. A 2015 law finally legalized it."
    - "Craft breweries fought a multi-year legislative battle over the growler ban before Governor Rick Scott signed the fix, which took effect July 1, 2015."
    - "Florida made to-go cocktails permanent in 2021, but only if a licensed restaurant seals the drink in a container designed to prevent immediate consumption."

