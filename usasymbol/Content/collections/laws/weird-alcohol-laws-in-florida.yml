    title: "Unusual Alcohol Laws in Florida That Are Real"
    paragraphs:
      - "Florida's container rules for beer once landed on an oddly specific gap, and its newer to-go cocktail law shows the same instinct toward tightly controlled packaging."
    subsections:
      - subtitle: "The 64-Ounce Growler Was Illegal for Years"
        status: "Verified"
        image: "/images/collections/laws/florida-growler-ban-history.jpg"
        anchor_phrases:
          - "64-ounce"
          - "growler"
        text: |
          **Law:** For years, Florida law allowed beer to be sold in containers of 32 ounces or smaller, or a full gallon or larger, but banned every size in between, including the industry-standard 64-ounce growler used almost everywhere else in the country.

          **Meaning:** A Florida brewery could legally sell two pints in a small jug or eight pints in a full gallon jug, but not the four-pint growler that most craft drinkers actually wanted.

          **Reason:** Craft brewers fought a multi-year legislative battle over the gap before Governor Rick Scott signed a fix, and the 64-ounce growler finally became legal statewide on July 1, 2015.
      - subtitle: "To-Go Cocktails Must Leave in a Sealed Container"
        status: "Verified"
        image: "/images/collections/laws/florida-to-go-cocktails-sealed.jpg"
        anchor_phrases:
          - "sealed container"
          - "Cocktails-to-Go"
        text: |
          **Law:** Senate Bill 148, signed May 13, 2021, made Cocktails-to-Go permanent under Florida's beverage law, but only for restaurants holding a 4COP quota license or 4COP-SFS license, and only if the drink is placed in a securely sealed container with an unbroken seal.

          **Meaning:** A restaurant can legally sell a mixed drink for the road, but it has to be packaged so a customer cannot immediately start drinking it in the car.

          **Reason:** The sealed-container requirement mirrors open-container law by design, letting Florida legalize to-go cocktails permanently without conflicting with the state's rules against drinking while driving.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Florida Regulates Container Size So Specifically"
    paragraphs:
      - "Florida's old growler gap was not an accident of drafting so much as a rule written before the craft beer boom made a 64-ounce growler the standard container nearly every small brewery wanted to sell. Once craft breweries multiplied, brewers spent years lobbying to close a gap that had made perfect sense in an earlier retail landscape but stopped making sense once the market shifted around it."
      - "The to-go cocktail law shows Florida applying that same container-first thinking to a newer problem. Rather than simply allowing drinks to leave a restaurant, lawmakers built the permanent 2021 law around a sealed, tamper-evident container, borrowing the same logic that open-container law already applies to a driver's own vehicle."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Before 2015, a 128-ounce (one-gallon) beer jug was legal in Florida even though the much smaller 64-ounce growler was not."
      - "Florida's growler fight ran for several legislative sessions before Governor Rick Scott signed the fix that took effect July 1, 2015."
      - "Florida's Cocktails-to-Go law only applies to restaurants holding a 4COP quota or 4COP-SFS license, not every bar or liquor store."
      - "The sealed-container rule for to-go cocktails is meant to prevent a drink from being consumed immediately, mirroring Florida's open-container restrictions for vehicles."

