faq:
  - question: "Was the beer growler really illegal in Florida?"
    answer: "Yes, the standard 64-ounce growler was illegal for years. Florida law only allowed beer containers of 32 ounces or smaller, or a full gallon or larger, skipping the size in between. Governor Rick Scott signed a fix that legalized the 64-ounce growler statewide starting July 1, 2015."

  - question: "Can you still buy a to-go cocktail in Florida?"
    answer: "Yes. Senate Bill 148 made Cocktails-to-Go permanent in 2021, but only restaurants holding a 4COP quota or 4COP-SFS license can sell them, and the drink must leave in a securely sealed container with an unbroken seal."

  - question: "Why did Florida ban the 64-ounce growler in the first place?"
    answer: "The container-size rule predated the craft beer boom and simply never included a 64-ounce category. Once craft breweries began treating the 64-ounce growler as their standard container, brewers spent years lobbying the legislature until the gap was closed in 2015."

  - question: "What size beer containers are legal in Florida now?"
    answer: "Florida now allows beer in any standard container size, including the 64-ounce growler that was illegal before 2015. Smaller 32-ounce containers and full-gallon jugs, both of which were always legal, are still sold as well."

