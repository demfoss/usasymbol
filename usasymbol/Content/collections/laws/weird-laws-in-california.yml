faq:
  - question: "What is the weirdest law in California?"
    answer: "Carmel-by-the-Sea's high-heels permit is one of the most genuinely strange. The city requires a free permit for any shoe with a pointed heel taller than 2 inches, issued to protect against slip-and-fall lawsuits on cobblestone streets."
  - question: "Is it really illegal to eat an orange in a bathtub in California?"
    answer: "No. That law does not exist in California at any level of government."
  - question: "Can you get a DUI on a bicycle in California?"
    answer: "Yes. California Vehicle Code section 21200.5 makes it illegal to ride a bicycle on a public road under the influence of alcohol or drugs. Fines and mandatory education programs apply."
  - question: "Is jaywalking still illegal in California?"
    answer: "No. The Freedom to Walk Act, signed in 2022, decriminalized jaywalking unless there is an immediate risk of collision. Officers can still act when crossing is genuinely dangerous."
  - question: "Are any of these California laws actually enforced?"
    answer: "Rarely. The Carmel high-heels permit has no known enforcement history. The Chico nuclear ordinance has never been invoked. The bicycle DUI law is occasionally enforced, though arrests are uncommon."
