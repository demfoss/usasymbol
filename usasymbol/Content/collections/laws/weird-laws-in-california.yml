sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in California That Are Real"
    paragraphs:
      - "Some Unusual Laws in California are genuine city ordinances, not statewide statutes. The strangest ones come from two small cities most Californians have never thought about legally: Carmel-by-the-Sea and Chico."
    highlights:
      - name: "Carmel High-Heels Permit"
        status: "Verified"
        image: "/images/collections/laws/carmel-by-the-sea-town.webp"
        description: |
          **Law:** Carmel-by-the-Sea requires a permit for shoes with heels taller than 2 inches and a base smaller than one square inch.

          **Meaning:** The permit is free and issued by City Hall. The rule is not a fashion ban. It is a liability shield tied to unusually uneven sidewalks.

          **Reason:** Carmel's old streets, tree roots, and irregular paving created enough slip-and-fall risk that the city wanted legal protection against injury claims.
      - name: "Chico Nuclear Device Ordinance"
        status: "Verified"
        image: "/images/collections/laws/chico-california.webp"
        description: |
          **Law:** Chico makes it unlawful to detonate a nuclear device within city limits.

          **Meaning:** The ordinance really does attach a $500 fine to one of the most absurd acts imaginable. That tiny penalty is what made the law famous.

          **Reason:** Cold War era municipal drafting sometimes produced symbolic civil-defense rules that were never updated after the original panic passed.
      - name: "Bicycle DUI Is Real"
        status: "Verified"
        image: "/images/collections/laws/california-bicycle.webp"
        description: |
          **Law:** California makes it illegal to ride a bicycle on a public road while under the influence of alcohol or drugs.

          **Meaning:** A cyclist can still be stopped, fined, and ordered into alcohol education even though the offense is not treated like a standard motor-vehicle DUI.

          **Reason:** Lawmakers treated impaired cycling as a real road-safety problem because a drunk rider can still cause collisions and injuries in traffic.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in California We Couldn't Verify"
    paragraphs:
      - "Some Weird Laws in California claims have circulated for decades without a traceable ordinance. No city, no code section, no court case."
    subsections:
      - subtitle: "Animals cannot mate publicly within 1,500 feet of a tavern, school, or place of worship"
        status: "Not Verified"
        text: |
          **Claim:** Animals cannot mate publicly within 1,500 feet of a tavern, school, or place of worship.

          **Why We Couldn't Verify It:** This claim is usually pinned on Fresno, but repeated searches of the Fresno Municipal Code do not show matching language. It may have grown out of a nuisance or livestock-control rule, yet no original ordinance text has surfaced.
      - subtitle: "Women cannot drive wearing a house coat in California"
        status: "Not Verified"
        text: |
          **Claim:** Women cannot drive wearing a house coat in California.

          **Why We Couldn't Verify It:** The California Vehicle Code contains no clothing rule for drivers that says anything like this. The story keeps appearing without a citation because no known statute, ordinance, or official source supports it.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange California Laws That Are Myths"
    paragraphs:
      - "These Strange California Laws are myths with documented explanations. None survived basic fact-checking."
    subsections:
      - subtitle: "It's illegal to eat an orange in a hotel bathtub in California"
        status: "Myth"
        text: |
          **Myth:** It's illegal to eat an orange in a hotel bathtub in California.

          **Reality:** No California law about citrus in bathtubs exists at any level of government. The story shows up on early internet weird-law lists as a joke-style entry, and its fake precision is exactly what helps it spread.
      - subtitle: "It's illegal to whistle for your lost canary before 7 a.m. on Sundays"
        status: "Myth"
        text: |
          **Myth:** It's illegal to whistle for your lost canary before 7 a.m. on Sundays.

          **Reality:** No source city or ordinance has ever been tied to this claim. California cities do have ordinary noise rules, but none of them say anything about canaries, lost birds, or whistling as a special offense.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why California's Weirdest Laws Come from City Codes, Not Sacramento"
    paragraphs:
      - "California has 482 incorporated municipalities, each maintaining its own code of ordinances. The state legislature sessions year-round and regularly reviews state law for obsolete provisions. City codes are a different story. Chico, Carmel, and hundreds of other cities update their codes on their own schedule, with no statewide review process and no obligation to sunset old ordinances."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Carmel-by-the-Sea has no home mail delivery and no house numbers. Residents use P.O. boxes. The city's municipal code is not indexed in most public legal databases."
      - "California's Law Revision Commission has recommended the repeal of thousands of obsolete state statutes since its creation in 1953. City ordinances fall entirely outside its jurisdiction."
      - "The Calaveras County Jumping Frog Jubilee has run annually since 1928, inspired by Mark Twain's 1865 story. Contest regulations for the event occasionally get misquoted online as official California law."
      - "California's Vehicle Code runs to over 40,000 sections and receives regular legislative review. Most city codes do not."

