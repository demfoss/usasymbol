sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Washington That Are Real"
    paragraphs:
      - "Washington is the only state that dismantled its own three-tier liquor distribution system through a direct ballot vote, and a few older container rules survived the overhaul untouched."
    highlights:
      - name: "Costco Bankrolled the End of the State Liquor Monopoly"
        status: "Verified"
        image: "/images/collections/laws/washington-costco-privatization.jpg"
        anchor_phrases:
          - "Initiative 1100"
          - "$22 million"
        description: |
          **Law:** Washington voters approved Initiative 1100 in 2011, ending the Washington State Liquor Control Board's role as the state's sole distributor of spirits, a system that had run since 1933.

          **Meaning:** Grocery stores and warehouse clubs could begin selling liquor starting June 1, 2012, something no private retailer had been allowed to do in the state for nearly 80 years.

          **Reason:** Costco spent a record $22 million, mostly on advertising, to back the initiative after years of lobbying to sell liquor the way it already sold beer and wine.
      - name: "Only Large Stores Can Sell Spirits"
        status: "Verified"
        image: "/images/collections/laws/washington-10000-sqft-rule.jpg"
        anchor_phrases:
          - "10,000 square feet"
        description: |
          **Law:** Initiative 1100 requires any new liquor retailer to operate in an enclosed space of at least 10,000 square feet within a single structure.

          **Meaning:** Gas stations and small convenience stores are locked out of spirits sales entirely, regardless of how well they might otherwise meet licensing requirements.

          **Reason:** The size threshold was written into the same 2012 law that ended the state monopoly, aimed at limiting liquor sales to larger retailers better equipped to prevent underage sales.
      - name: "Destroying a Marked Keg or Bottle Is a Misdemeanor"
        status: "Verified"
        image: "/images/collections/laws/washington-keg-destruction-law.jpg"
        anchor_phrases:
          - "RCW 19.76.110"
          - "wantonly destroy"
        description: |
          **Law:** Washington Revised Code § 19.76.110 makes it a misdemeanor to wantonly destroy a cask, barrel, keg, bottle, or box that has been properly registered and marked by its owner.

          **Meaning:** A registered container carries legal protection distinct from the beverage inside it; damaging one intentionally can trigger fines even if the container is otherwise unremarkable.

          **Reason:** The law sets per-item fines, five dollars for a cask, barrel, keg, or box and fifty cents for a bottle, structured to deter theft or destruction of containers breweries and distributors relied on being returned and reused.

  - id: why-washington-broke-the-monopoly
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Washington Gave Up Its State Liquor Stores"
    paragraphs:
      - "From 1933 until 2012, the Washington State Liquor Control Board controlled every bottle of spirits sold in the state, running its own retail stores and setting prices directly. That put Washington in the same category as Utah, Virginia, and other control states, until Costco decided the arrangement no longer made sense for a company already selling beer and wine off the same shelves."
      - "Costco's $22 million campaign made Washington the only state to unwind a working three-tier distribution system through a statewide ballot initiative rather than a slower legislative phase-out. The size and community-notice requirements built into the same measure were the compromise that got it past concerns about minors buying liquor at every corner store overnight."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Costco's $22 million campaign for Initiative 1100 was, at the time, one of the most expensive ballot measure campaigns in Washington history."
      - "The Washington State Liquor Control Board controlled spirits distribution for 79 years, from 1933 until private sales began in June 2012."
      - "Washington briefly allowed limited off-premises spirits sales starting in 2005, permitting Sunday sales from noon to 5 p.m. in select state stores years before full privatization."
      - "The keg-destruction misdemeanor under RCW 19.76.110 applies specifically to containers the owner has registered and marked, not to unmarked packaging."

