faq:
  - question: "When did Washington allow private liquor sales?"
    answer: "Private retailers could begin selling spirits on June 1, 2012, after voters approved Initiative 1100 in 2011. Before that, the Washington State Liquor Control Board had run the state's sole spirits distribution system since 1933."

  - question: "Why can't gas stations sell liquor in Washington?"
    answer: "Initiative 1100 requires liquor retailers to operate in a space of at least 10,000 square feet within one structure, a size threshold that excludes gas stations and small convenience stores by design."

  - question: "How much did Costco spend to change Washington's liquor laws?"
    answer: "Costco spent a record $22 million, mostly on advertising, backing Initiative 1100 in 2011. The measure ended the state's spirits distribution monopoly and let large retailers like Costco sell liquor directly."

  - question: "Is it illegal to destroy a beer keg in Washington?"
    answer: "Yes, if the keg is registered and marked by its owner. Washington Revised Code § 19.76.110 makes wantonly destroying such a container a misdemeanor, with set fines per item, part of an older law protecting reusable beverage packaging."

