page:
  h1: "Weird Alcohol Laws in Washington"

  quick_answer:
    - "Costco spent a record $22 million backing Initiative 1100, the 2011 ballot measure that ended Washington's state liquor monopoly and let private retailers sell spirits starting in 2012."
    - "Under the same law, only stores of at least 10,000 square feet can sell spirits, which is why gas stations and small convenience stores in Washington still can't."
    - "It's a misdemeanor in Washington to wantonly destroy a registered beer cask, barrel, keg, bottle, or box, with fines set per container under a law that predates modern craft brewing."

