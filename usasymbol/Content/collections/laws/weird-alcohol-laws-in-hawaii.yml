sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Hawaii That Are Real"
    paragraphs:
      - "Hawaii's alcohol rules trace back to a licensing system built around counties, not a single state board. That structure explains most of what looks unusual from the mainland."
    highlights:
      - name: "Grocery Stores Can Sell Spirits, Not Just Beer and Wine"
        status: "Verified"
        image: "/images/collections/laws/hawaii-grocery-spirits-sales.jpg"
        anchor_phrases:
          - "grocery stores"
        description: |
          **Law:** A grocery store holding the correct retail dealer license can sell beer, wine, and distilled spirits for off-premise consumption, all under one roof.

          **Meaning:** Shoppers can put a bottle of whiskey in the same cart as milk and produce, something most states reserve for a separate liquor store.

          **Reason:** Hawaii never carved spirits into a state-controlled retail category the way many mainland states did after Prohibition, so grocery chains simply picked up full off-premise licenses instead.
      - name: "Bars Could Only Serve One Drink at a Time Until 2014"
        status: "Verified"
        image: "/images/collections/laws/hawaii-one-drink-rule.jpg"
        anchor_phrases:
          - "one drink at a time"
        description: |
          **Law:** For decades, Hawaii barred restaurants and bars from placing more than one alcoholic drink in front of a single customer at once.

          **Meaning:** A patron sitting with friends could not have two cocktails on the table at the same time, even if both were already paid for.

          **Reason:** Lawmakers repealed the rule in 2014 after deciding it did not slow anyone's drinking and, if anything, pushed people to finish a drink faster so they could order the next one.
      - name: "Direct Alcohol Shipping Is Capped at Six Cases a Year"
        status: "Verified"
        image: "/images/collections/laws/hawaii-direct-shipping-cap.jpg"
        anchor_phrases:
          - "six cases"
        description: |
          **Law:** Starting July 1, 2025, Hawaii expanded direct-to-consumer shipping to cover beer and distilled spirits, not just wine, but capped each household at six cases a year across every category combined.

          **Meaning:** A resident who orders wine, whiskey, and a case of mainland craft beer in the same year draws from one shared six-case limit, not three separate ones.

          **Reason:** The expansion followed years of pressure from small distillers and out-of-state retailers who could already ship wine, while the combined cap kept the new law from turning into an unregulated retail channel.

  - id: why-counties-decide
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Hawaii Never Built One Statewide Liquor Board"
    paragraphs:
      - "Four separate liquor commissions, one for Honolulu, Hawaii, Maui, and Kauai counties, issue licenses and set enforcement rules under the framework laid out in Hawaii Revised Statutes Chapter 281. No single state agency runs the system the way a mainland Alcoholic Beverage Control board typically does."
      - "That county-level split is why off-premise sale hours are not identical across the islands. Most counties allow beer, wine, and spirits sales from roughly 6 a.m. to 11 p.m., while Honolulu County extends the window later into the night. Each commission also reviews its own license applications and sets its own fee schedule, so a bar owner opening a second location on a different island effectively starts the licensing process over."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Hawaii Revised Statutes Chapter 281 sets the statewide legal framework, but each of the four county liquor commissions writes its own detailed rules on top of it."
      - "The 2025 direct-shipping expansion was the first time Hawaii allowed beer and spirits, not just wine, to ship straight to a resident's door."
      - "Hawaii's one-drink rule stood for decades before lawmakers repealed it in 2014, making it legal for a bar to serve a customer two drinks at once for the first time."
      - "Honolulu County allows off-premise alcohol sales later into the night than most of the other three counties."

