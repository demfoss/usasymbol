faq:
  - question: "Can you buy liquor in a Hawaii grocery store?"
    answer: "Yes. Grocery and general merchandise stores that hold the correct retail dealer license can sell beer, wine, and distilled spirits for off-premise consumption in the same store, which is unusual compared to states that reserve spirits sales for dedicated liquor stores."

  - question: "Is Hawaii's one-drink rule still in effect?"
    answer: "No. The rule that stopped bars from serving a customer more than one alcoholic drink at a time was repealed in 2014. Bars can now serve multiple drinks to the same patron at once."

  - question: "Why do alcohol sale hours differ between Hawaii's islands?"
    answer: "Hawaii has no single statewide alcohol control board. Four county liquor commissions, covering Honolulu, Hawaii, Maui, and Kauai counties, each set their own hours and licensing rules under the general framework of Hawaii Revised Statutes Chapter 281, so the details vary from island to island."

  - question: "How much alcohol can be shipped to a home in Hawaii?"
    answer: "Since July 1, 2025, Hawaii residents can have beer, wine, and distilled spirits shipped directly to them, but the total is capped at six cases per household per year across all three categories combined."

