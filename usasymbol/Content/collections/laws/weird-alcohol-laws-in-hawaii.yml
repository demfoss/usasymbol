page:
  h1: "Weird Alcohol Laws in Hawaii"

  quick_answer:
    - "Hawaii lets grocery stores sell beer, wine, and spirits under one retail license, a setup most states reserve for dedicated liquor stores alone."
    - "Bars once could not legally serve a customer more than one drink at a time. Lawmakers repealed that rule in 2014."
    - "Alcohol licensing runs through four separate county liquor commissions instead of one state agency, which is why sale hours differ between islands."

