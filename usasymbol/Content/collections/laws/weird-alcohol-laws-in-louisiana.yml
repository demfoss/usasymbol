faq:
  - question: "Is it legal to have a daiquiri in your car in Louisiana?"
    answer: "Yes, if the cup is sealed under the specific terms of Louisiana Revised Statutes Title 32, § 300: the lid must be on, no straw can be inserted through it, and none of the contents can have been removed. That standard is what allows drive-thru daiquiri shops to operate legally."

  - question: "Why can you drink on the street in New Orleans?"
    answer: "A local ordinance permits open alcohol containers in plastic cups within the French Quarter and nearby areas, overriding the state's general open container ban for that specific zone. Glass containers are still not allowed."

  - question: "Can an 18 year old drink alcohol in Louisiana?"
    answer: "Only under specific supervised conditions. Louisiana allows 18 to 20 year olds to consume alcohol at a licensed outlet if a parent, spouse, or guardian is present, and separately allows consumption in a private residence with a family member's presence and consent."

  - question: "What is the 'tape rule' for Louisiana daiquiris?"
    answer: "Many drive-thru daiquiri shops place a sticker or piece of tape over the straw hole in a cup's lid before handing it to a customer, which keeps the drink legally sealed under the open container statute until the customer removes it themselves."

