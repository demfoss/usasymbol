page:
  h1: "Weird Alcohol Laws in Louisiana"

  quick_answer:
    - "A sealed daiquiri with the lid intact and no straw inserted is legal to carry in a vehicle in Louisiana, the loophole behind the state's drive-thru daiquiri shops."
    - "New Orleans allows open containers in plastic cups within the French Quarter and nearby areas under a local ordinance that overrides the general statewide open container ban."
    - "Louisiana lets 18 to 20 year olds legally consume alcohol at a licensed outlet if a parent, spouse, or guardian is present, an exception most states don't offer."

