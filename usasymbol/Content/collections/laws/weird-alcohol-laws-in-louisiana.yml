sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Louisiana That Are Real"
    paragraphs:
      - "Louisiana's open container law reads like most states' versions until it reaches a specific carveout for frozen drinks, one that spawned an entire drive-thru daiquiri industry."
    highlights:
      - name: "A Sealed Daiquiri Is Legal to Drive Home With"
        status: "Verified"
        image: "/images/collections/laws/louisiana-drive-thru-daiquiri.jpg"
        anchor_phrases:
          - "sealed"
          - "drive-thru daiquiri"
        description: |
          **Law:** Under Louisiana Revised Statutes Title 32, § 300, a frozen alcoholic drink counts as a closed container, and therefore legal to have in a vehicle, if the lid is on, no straw pokes through it, and none of the contents have been removed.

          **Meaning:** A drive-thru daiquiri shop can legally hand a customer a frozen cocktail through the window as long as the cup meets that specific sealed standard.

          **Reason:** The distinction between regular open containers and sealed frozen drinks let a real drive-thru daiquiri industry grow across the state, with the so-called "tape rule," a sticker over the straw hole, becoming the practical way shops satisfy the law.
      - name: "New Orleans Allows Open Containers in the French Quarter"
        status: "Verified"
        image: "/images/collections/laws/louisiana-go-cup-culture.jpg"
        anchor_phrases:
          - "go-cup"
        description: |
          **Law:** A local New Orleans ordinance permits open alcohol containers in plastic cups within the French Quarter and surrounding areas, overriding the general statewide open container ban for pedestrians in that zone.

          **Meaning:** Walking down Bourbon Street with a drink in a plastic "go-cup" is legal in a way that carrying the same open drink almost anywhere else in Louisiana is not.

          **Reason:** The city built its go-cup culture around tourism and its dense entertainment district, and state law leaves room for that kind of local carveout rather than forcing one open container standard on every city.
      - name: "18 to 20 Year Olds Can Legally Drink With Family Present"
        status: "Verified"
        image: "/images/collections/laws/louisiana-family-drinking-exception.jpg"
        anchor_phrases:
          - "parent, spouse, or guardian"
        description: |
          **Law:** Louisiana allows a person aged 18 to 20 to consume alcohol at a licensed alcoholic beverage outlet if accompanied by a parent, spouse, or legal guardian, and separately allows consumption in a private residence with a family member's presence and consent.

          **Meaning:** A 19-year-old having a glass of wine at a restaurant table with a parent present is not automatically breaking the law the way it would be in most states.

          **Reason:** The exception treats supervised family consumption differently from unsupervised underage drinking, reflecting a legal distinction many states dropped entirely when the national drinking age moved to 21.

  - id: why-the-daiquiri-loophole-works
    icon: "fa-solid fa-clock-rotate-left"
    title: "How the Daiquiri Loophole Became an Industry"
    paragraphs:
      - "Louisiana's open container statute defines what counts as sealed in specific, almost mechanical terms: a lid in place, no straw through it, no contents removed. That precision is exactly what let entrepreneurs build a real drive-thru daiquiri business around it. David Irvin, who opened one of the first drive-thru daiquiri shops, is credited with the taped-lid solution that satisfies the law's straw requirement without stopping a customer from popping the tape once parked."
      - "The rule only works because it targets the container, not the contents or the driver's blood alcohol level. A sealed daiquiri in the car is legal under the open container statute, but drinking it while driving still falls under Louisiana's DWI law separately. The daiquiri shops built an entire retail category around staying on the right side of one specific statute while leaving the general drunk driving law untouched."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Louisiana's sealed-container standard for frozen drinks requires the lid intact, no straw inserted, and none of the contents removed, all three conditions at once."
      - "The 'tape rule' nickname comes from daiquiri shops placing a sticker over the straw hole in a cup's lid to keep the drink legally sealed until a customer chooses to open it."
      - "New Orleans's go-cup exception applies specifically to plastic cups; glass containers remain illegal to carry openly in the French Quarter."
      - "Louisiana's family-supervised drinking exception for 18 to 20 year olds applies to licensed outlets and private residences, not to public possession or unsupervised purchase."

