sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Arizona That Are Real"
    paragraphs:
      - "Arizona's license system draws sharp lines between what a store can sell and how many bars a county can hold, with a narrow carve-out for the smallest producers."
    subsections:
      - subtitle: "Grocery Stores Sell Beer and Wine, Never Spirits"
        status: "Verified"
        image: "/images/collections/laws/arizona-grocery-beer-wine-only.jpg"
        anchor_phrases:
          - "Series 10"
          - "beer and wine"
        text: |
          **Law:** A Series 10 license lets grocery, convenience, and specialty stores sell beer and wine in sealed packages for off-premises consumption, but the license does not cover distilled spirits at all.

          **Meaning:** A shopper can grab a six-pack and a bottle of wine at checkout, but the same store cannot legally stock whiskey or vodka next to them.

          **Reason:** Spirits sales require the separate, quota-controlled Series 9 liquor-store license, keeping hard liquor retail capped to a fixed number of licenses even as beer and wine ride along with ordinary grocery retail.
      - subtitle: "Bar Licenses Are Capped by County Population"
        status: "Verified"
        image: "/images/collections/laws/arizona-liquor-license-quota.jpg"
        anchor_phrases:
          - "quota license"
        text: |
          **Law:** Arizona's bar (Series 6), beer-and-wine bar (Series 7), and liquor store (Series 9) licenses are all quota licenses, with the total number set by county population.

          **Meaning:** In a county that has already reached its quota, a new bar cannot simply apply for a license; it has to buy an existing one on the open market, often for a large sum.

          **Reason:** The quota system dates back to Arizona's original post-Prohibition licensing scheme, built to keep the number of liquor outlets tied to population rather than open-ended demand.
      - subtitle: "A Small Distillery Can Deliver Its Own Spirits"
        status: "Verified"
        image: "/images/collections/laws/arizona-craft-distillery-self-distribute.jpg"
        anchor_phrases:
          - "self-distribute"
          - "1,189 gallons"
        text: |
          **Law:** An in-state craft distillery producing 1,189 gallons or less of spirits a year can self-distribute, selling and delivering its own product directly to licensed retailers in and out of state.

          **Meaning:** Larger craft distillers, up to the state's 20,000-gallon craft distillery cap, must instead route sales through the standard three-tier wholesale system.

          **Reason:** The exemption gives the smallest producers a way to reach retailers before they can justify a wholesaler contract, and Arizona also lets a craft distiller hold a farm winery license on the same premises for combined tastings.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Arizona's Liquor Licenses Trade for So Much Money"
    paragraphs:
      - "Arizona's population-based quota system was built to keep the number of bars and liquor stores from outpacing local demand, but decades of growth have pushed many counties to their caps. A new bar owner in a maxed-out market cannot wait for the state to issue more licenses; the only path in is buying one from an existing holder."
      - "That scarcity is what turns an ordinary liquor license into a tradable asset worth far more than its original filing fee. Some Arizona quota licenses have sold for hundreds of thousands of dollars, a direct result of a cap that has not kept pace with how many cities and counties have grown since the license count was last set."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Arizona microbreweries can produce anywhere from 1,000 to 6,200,000 gallons of beer a year under a single Series 3 license."
      - "An Arizona farm winery license covers production between 200 and 40,000 gallons of wine a year."
      - "A craft distillery and a farm winery can share the same Arizona premises, letting one location pour both spirits and wine samples."
      - "Series 9 liquor stores in Arizona can sell beer, wine, and spirits for off-premises use, but the license does not allow on-site consumption."

