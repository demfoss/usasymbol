page:
  h1: "Weird Alcohol Laws in Arizona"

  quick_answer:
    - "Arizona caps the number of bar and liquor-store licenses in each county by population, so a maxed-out county forces new bars to buy an existing license instead of applying for a new one."
    - "A grocery or convenience store license in Arizona covers beer and wine only. Selling spirits requires a completely separate, quota-controlled liquor-store license."
    - "A craft distillery producing under 1,189 gallons a year can legally sell and deliver its own spirits directly to licensed retailers, skipping the standard wholesaler system entirely."

