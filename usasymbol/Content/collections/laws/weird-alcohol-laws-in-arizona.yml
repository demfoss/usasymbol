faq:
  - question: "Can you buy liquor at an Arizona grocery store?"
    answer: "No. A Series 10 grocery or convenience store license covers only beer and wine. Distilled spirits require a separate, quota-controlled Series 9 liquor-store license that grocery stores generally do not hold."

  - question: "Why are Arizona bar licenses so expensive?"
    answer: "Arizona caps the number of bar and liquor-store licenses per county based on population. Once a county reaches its quota, a new bar owner has to buy an existing license from another holder instead of applying for a new one, and that scarcity drives prices up."

  - question: "Can a small Arizona distillery sell directly to stores?"
    answer: "Yes, within limits. A craft distillery producing 1,189 gallons or less of spirits a year can self-distribute, delivering its own product straight to licensed retailers. Larger craft distillers must go through Arizona's standard three-tier wholesale system instead."

  - question: "What is the production cap for an Arizona craft distillery license?"
    answer: "An in-state craft distillery license covers production of up to 20,000 gallons of distilled spirits a year. Distillers under that cap can also hold a farm winery license on the same premises, allowing combined spirits and wine sampling."

