faq:
  - question: "When did Colorado grocery stores start selling real beer?"
    answer: "January 1, 2019. Before that date, grocery and convenience stores could sell only 3.2 beer, a weak Prohibition-era category measured by weight, under a phase-out schedule set by Senate Bill 16-197 in 2016."

  - question: "Can Colorado grocery stores sell liquor and wine everywhere now?"
    answer: "It depends on the store. A 2016 law let grocery chains add licenses gradually, up to five by 2017 and twenty by 2032, but a 2025 law then stopped grocers from acquiring further full-alcohol-sales licenses through the buyout system they had been using."

  - question: "Why was Colorado's 3.2 beer measured differently from normal beer?"
    answer: "3.2 beer was measured as alcohol by weight, not alcohol by volume, the standard used for nearly all other beer labeling in the U.S. The category traced back to a 1933 federal law that legalized low-strength beer months before Prohibition fully ended."

  - question: "What did Colorado's 2025 liquor law change?"
    answer: "Senate Bill 33 ended a nine-year practice that let grocery chains buy out two nearby independent liquor stores and merge the licenses to add spirits sales chainwide. Grocery locations that already sell spirits keep that ability, but new locations can no longer use the same buyout path."

