sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Colorado That Are Real"
    paragraphs:
      - "Colorado spent decades keeping grocery stores at arm's length from real beer and full liquor licenses, and the fight over how far to loosen that distance is still ongoing."
    subsections:
      - subtitle: "Grocery Beer Was Capped at 3.2% Until 2019"
        status: "Verified"
        image: "/images/collections/laws/colorado-32-beer-law.jpg"
        anchor_phrases:
          - "3.2 beer"
        text: |
          **Law:** Colorado grocery and convenience stores could sell only 3.2 beer, meaning 3.2% alcohol by weight, until Senate Bill 16-197 phased the category out entirely on January 1, 2019.

          **Meaning:** The 3.2 measurement is not directly comparable to standard alcohol-by-volume labeling, so the beer on grocery shelves was noticeably weaker than the same brand sold in a liquor store.

          **Reason:** Colorado was one of the last states to hold onto the 3.2 category, a rule that traced back to a 1933 federal law legalizing low-strength beer nine months before national Prohibition fully ended.
      - subtitle: "Grocery Chains Held Just One Liquor License Statewide"
        status: "Verified"
        image: "/images/collections/laws/colorado-grocery-license-limit.jpg"
        anchor_phrases:
          - "one Colorado location"
        text: |
          **Law:** Before the 2016 reform, a grocery store chain could hold only one liquor license good for wine, spirits, and full-strength beer at a single location statewide, no matter how many stores it operated.

          **Meaning:** A shopper could buy full-strength beer, wine, and liquor at one flagship location of a chain while every other branch across the state stayed limited to 3.2 beer.

          **Reason:** Senate Bill 16-197 phased in more licenses gradually, up to five by 2017, twenty by 2032, and no cap after 2037, a deliberately slow schedule meant to protect independent liquor stores from sudden grocery-chain competition.
      - subtitle: "Colorado Just Stopped Grocers From Adding More Spirits Licenses"
        status: "Verified"
        image: "/images/collections/laws/colorado-2025-license-freeze.jpg"
        anchor_phrases:
          - "Senate Bill 33"
        text: |
          **Law:** Governor Polis signed Senate Bill 33 in 2025, ending a nine-year practice that let grocery chains buy out two nearby independent liquor stores and merge their licenses to add spirits sales at all of the chain's locations.

          **Meaning:** Grocery stores that already added spirits under the old rule can keep selling them, but the path for new grocery locations to do the same has closed.

          **Reason:** The 2025 law responded to independent liquor store owners who argued the buyout system, meant as a gradual transition, was consolidating licenses into grocery chains faster than lawmakers originally intended.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Colorado Keeps Rewriting Its Grocery Liquor Rules"
    paragraphs:
      - "Colorado's 3.2 beer law survived far longer than in most states because grocery and liquor interests kept blocking each other's preferred reforms for decades. When the compromise finally passed in 2016, it deliberately phased in change over more than twenty years rather than all at once, protecting independent liquor stores from an immediate flood of grocery-chain competition."
      - "That same tension resurfaced almost immediately after full-strength beer arrived on grocery shelves in 2019. Grocers began using a license-buyout provision to add spirits location by location, and by 2025 independent liquor stores had pushed back hard enough that lawmakers froze the practice, showing the 2016 compromise was a pause in the fight rather than an ending."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Colorado beer tax collections rose by 1.6 million gallons in January 2019 alone, the first month full-strength beer was legal in grocery stores."
      - "3.2 beer measured alcohol by weight, not by volume, the opposite of how nearly every other beer category in the country is labeled."
      - "Senate Bill 16-197's license schedule allowed grocery chains up to five liquor licenses by 2017, twenty by 2032, and an unlimited number starting in 2037."
      - "Senate Bill 33 in 2025 did not roll back spirits sales already added at existing grocery locations; it only stopped new locations from using the same buyout path."

