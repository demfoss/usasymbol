page:
  h1: "Weird Alcohol Laws in Colorado"

  quick_answer:
    - "Until January 1, 2019, Colorado grocery and convenience stores could sell only 3.2 beer, a weak Prohibition-era category measured by weight rather than the standard alcohol-by-volume scale."
    - "Colorado limited grocery chains to a single statewide liquor license for decades, only phasing in additional locations starting in 2017 under a 2016 law."
    - "In 2025, Colorado stopped grocery stores from acquiring any more full-alcohol-sales licenses, ending a nine-year practice that had let grocers buy out nearby liquor stores to add spirits."

