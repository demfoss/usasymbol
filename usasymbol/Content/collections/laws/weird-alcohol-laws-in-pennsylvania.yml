faq:
  - question: "Why does Pennsylvania have state-run liquor stores?"
    answer: "The Pennsylvania Liquor Control Board was created in 1933 to run the state's wine and spirits retail system after Prohibition ended, opening its first 63 stores in January 1934. That state-store model has stayed in place for more than 90 years despite repeated privatization attempts, including a 2015 bill Governor Tom Wolf vetoed."

  - question: "When could Pennsylvania beer distributors start selling six-packs?"
    answer: "Not until Act 166 took effect in January 2017. Before that, distributors could only sell beer by the case, quarter-keg, half-keg, or full keg, a restriction that had been in place since Prohibition's repeal."

  - question: "Do Pennsylvania grocery stores still have wine kiosks?"
    answer: "No. The PLCB's self-service wine kiosk program from the early 2010s was discontinued after major retailers like Wegmans and Walmart pulled out. Act 39, signed in 2016, replaced it with a simpler system letting licensed grocers sell up to four bottles of wine per transaction at a separate register."

  - question: "Can grocery stores in Pennsylvania sell beer?"
    answer: "Yes, since Act 39 passed in 2016, which ended beer distributors' decades-long near-monopoly on off-premises beer sales and let licensed grocery and convenience stores sell beer as well."

