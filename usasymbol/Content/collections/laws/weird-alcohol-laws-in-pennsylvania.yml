sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Pennsylvania That Are Real"
    paragraphs:
      - "Pennsylvania built one of the most tightly controlled alcohol markets in the country after Prohibition and has spent the last decade slowly loosening pieces of it one law at a time."
    highlights:
      - name: "The State Runs Every Wine and Spirits Store"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-plcb-state-stores.jpg"
        anchor_phrases:
          - "state-run Fine Wine and Good Spirits stores"
        description: |
          **Law:** The Pennsylvania Liquor Control Board operates about 560 Fine Wine and Good Spirits stores statewide, and any restaurant or licensed retailer must buy its wine and spirits directly from the PLCB.

          **Meaning:** A restaurant cannot simply order a bottle of wine from an out-of-state distributor; it has to come through the state's own store system, and if a brand isn't on the PLCB's registered list, it cannot legally be bought or sold in Pennsylvania at all.

          **Reason:** The PLCB was created on December 1, 1933, and opened its first 63 stores the following January, and Pennsylvania has kept that state-run retail model for wine and spirits intact for more than 90 years while other control states privatized their own systems.
      - name: "Beer Distributors Couldn't Sell a Six-Pack Until 2017"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-six-pack-law.jpg"
        anchor_phrases:
          - "Act 166"
        description: |
          **Law:** Since Prohibition's repeal, Pennsylvania beer distributors could only sell beer by the case, quarter-keg, half-keg, or full keg, until Act 166 in January 2017 finally let them sell six-packs and single bottles.

          **Meaning:** Someone who only wanted a six-pack for a small gathering had to either buy a full case at a distributor or find beer at a bar or restaurant instead, for decades.

          **Reason:** The case-only rule reflected Pennsylvania's original post-Prohibition licensing structure, which never anticipated smaller households wanting smaller quantities, and it took a sustained legislative push, including Act 39 opening grocery and convenience store beer sales in 2016, before lawmakers finally revised it.
      - name: "Grocery Stores Once Sold Wine From Self-Service Kiosks"
        status: "Verified"
        image: "/images/collections/laws/pennsylvania-wine-kiosks.jpg"
        anchor_phrases:
          - "self-service wine kiosks"
        description: |
          **Law:** In the early 2010s, the PLCB tested self-service wine-dispensing kiosks in select grocery stores, including Wegmans and Giant, as a way to sell wine outside its own retail stores without a full legislative overhaul.

          **Meaning:** Shoppers used a touchscreen machine to select and pay for wine bottles inside a regular grocery store, a workaround for Pennsylvania's usual state-store requirement.

          **Reason:** The kiosk program drew criticism and low usage, and major retailers eventually pulled out entirely; lawmakers replaced the experiment with Act 39 in 2016, which lets licensed grocers sell up to four bottles of wine per transaction at a separate register instead.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Pennsylvania Changes Its Alcohol Laws One Piece at a Time"
    paragraphs:
      - "Pennsylvania's state-store system has outlasted repeated privatization attempts, including a 2015 bill that Governor Tom Wolf vetoed outright. Rather than dismantling the PLCB's core structure, the legislature has instead carved out narrow exceptions around it, allowing grocery and convenience stores to sell limited quantities of beer and wine while keeping the state's own stores as the primary channel for spirits."
      - "That pattern explains both the six-pack rule and the wine kiosk experiment. Distributors kept their case-only restriction until Act 166 targeted that specific limit in 2017, and the kiosk program existed only because it let the PLCB test grocery-store wine sales without asking lawmakers to rewrite the underlying law, a workaround that folded once Act 39 offered a simpler legislative fix."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "The PLCB may grant one retail liquor license for every 3,000 residents of a county and one wholesale license for every 30,000, with a minimum of five wholesale licenses guaranteed per county."
      - "Act 39, signed in 2016, ended beer distributors' decades-long near-monopoly on off-premises beer sales by letting grocery and convenience stores sell beer too."
      - "Walmart canceled plans for 23 wine kiosks in its Pennsylvania stores before the program was phased out statewide."
      - "Pennsylvania's municipal license quota system limits how many retail liquor licenses a single town can hold, based on that municipality's population."

