page:
  h1: "Weird Alcohol Laws in Pennsylvania"

  quick_answer:
    - "Pennsylvania has sold every bottle of wine and spirits through state-run stores since the Pennsylvania Liquor Control Board opened its first 63 stores in January 1934."
    - "Beer distributors in Pennsylvania could only sell beer by the case or keg for decades, until Act 166 finally allowed six-packs and singles starting in 2017."
    - "Pennsylvania briefly let grocery stores sell wine through self-service kiosks in the early 2010s, an experiment retailers abandoned before lawmakers replaced it with a simpler grocery-wine license."

