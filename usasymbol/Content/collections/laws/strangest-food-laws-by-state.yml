faq:
  - question: "Which state has the most permissive food law in the US?"
    answer: "Wyoming's Food Freedom Act, passed in 2015 and expanded in 2020 and 2023, exempts homemade food, drink, and even meat sold directly to consumers from state licensing, permitting, and inspection entirely. It was the first law of its kind in the country."

  - question: "Is it legal to eat roadkill in the US?"
    answer: "Rules vary widely by state. West Virginia allows it if the driver reports the collision within 12 hours and obtains a game tag within 24 hours. Alaska runs a formal moose salvage program through its state troopers that channels meat to registered volunteers and charities."

  - question: "Is foie gras illegal in the United States?"
    answer: "Not nationwide. California bans selling foie gras produced through force-feeding, a law passed in 2004 that didn't take effect until 2012 and has faced repeated court challenges from producers and restaurants ever since."

  - question: "Why does Wisconsin require a license to make cheese?"
    answer: "The requirement dates back to grading standards Wisconsin established in the 1870s and still applies today through the state's Department of Agriculture, Trade and Consumer Protection. Roughly 1,200 cheesemakers currently hold the license, and the advanced Master Cheesemaker credential exists only in Wisconsin."

  - question: "Can you legally buy raw milk in every state?"
    answer: "No, the rules vary widely. Vermont and South Carolina both allow fairly broad raw milk sales, Vermont with no license up to 87.5 gallons a week and South Carolina through a single permit that covers retail stores. New York permits it too, but only in person at the farm, with no delivery or retail sales allowed."

  - question: "What is New Mexico's official state question?"
    answer: "New Mexico adopted 'Red or Green?' as its official state question in 1996, referring to chile pepper color. It is the only state in the country with an official state question, and the sanctioned answer is 'red and green, or Christmas.'"

