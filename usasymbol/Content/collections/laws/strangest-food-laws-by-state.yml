page:
  h1: "Strangest Food Laws in Every US State"

  quick_answer:
    - "Wyoming's Food Freedom Act, the first law of its kind in the country, lets producers sell homemade food, raw milk, and even meat directly to consumers with no state license, permit, or inspection."
    - "Roadkill salvage is legal in West Virginia and Alaska alike. A West Virginia driver needs a police report within 12 hours and a game tag within 24, while Alaska runs a moose salvage list through its state troopers that supplies charities and registered volunteers."
    - "Hawaii became the first state to ban shark fin possession and sale in 2010, while California spent eight years phasing in a force-feeding ban that foie gras producers still fight in court."
    - "Wisconsin remains the only state that requires a license to make cheese, a rule tracing back to 19th-century grading standards that still governs roughly 1,200 licensed cheesemakers today."

  methodology: "Every law on this page comes from a real, currently or historically enacted statute, regulation, or administrative rule, checked against primary state code, a state agency page, or news coverage that cites the underlying law directly. States were picked for laws with a genuinely unusual structure or history, not just the first search result, so the list runs to 15 states rather than a forced 50."

