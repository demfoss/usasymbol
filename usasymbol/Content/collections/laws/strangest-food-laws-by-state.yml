sections:
  - id: state-food-laws
    icon: "fa-solid fa-utensils"
    style: "law-cards"
    title: "Strangest Food Laws by State"
    paragraphs:
      - "Food law rarely makes headlines, yet it governs everything from what a rancher can sell off the farm to what a diner can order at a chile stand. Fifteen states below each have one law worth knowing, verified against the actual statute or regulation behind it."
    subsections:
      - subtitle: "Wyoming"
        status: "Verified"
        anchor_phrases:
          - "Food Freedom Act"
        text: |
          **Law:** Wyoming's Food Freedom Act exempts homemade food and drink sold directly to consumers from state licensing, permitting, inspection, packaging, and labeling requirements.

          **Meaning:** A producer can sell raw milk, cheese, baked goods, and even homemade meat straight from the farm, at a farmers market, or through a designated agent without registering with the state at all. Wyoming passed the original 2015 version first in the nation, then expanded it in 2020 and 2023 to add dairy and third-party retail sales.

          **Reason:** No other state hands producers this much control over homemade food sales, which is why Wyoming's law became the model that several other states later copied in some form.

      - subtitle: "West Virginia"
        status: "Verified"
        anchor_phrases:
          - "roadkill"
        text: |
          **Law:** West Virginia lets a driver who hits a deer, wild turkey, or rabbit keep the animal for food, provided they report the collision to law enforcement within 12 hours and obtain a non-hunting game tag within 24 hours.

          **Meaning:** Protected birds, elk, spotted fawns, and bear cubs cannot be salvaged this way, no matter how the paperwork is filed.

          **Reason:** A dead deer on the shoulder is wasted meat and a hazard that draws scavengers toward traffic, so the law gives drivers a legal path to claim it instead of leaving the carcass to rot.

      - subtitle: "Alaska"
        status: "Verified"
        anchor_phrases:
          - "moose roadkill"
        text: |
          **Law:** When a moose is killed by a vehicle, Alaska State Troopers can call registered salvage teams, who typically have about 30 minutes to respond and either keep the meat themselves or hand it off to a charity.

          **Meaning:** The Alaska Department of Public Safety runs the sign-up online, a system it moved to a digital roadkill database after the Alaska Moose Federation, which had coordinated salvage for years, closed in 2020.

          **Reason:** A single moose carries several hundred pounds of meat, and with hundreds struck by vehicles every year, Alaska treats that lost protein as too valuable to leave beside the highway.

      - subtitle: "Hawaii"
        status: "Verified"
        anchor_phrases:
          - "shark fin ban"
        text: |
          **Law:** Hawaii banned the possession, sale, trade, and distribution of shark fins starting July 1, 2011, the first such ban by any US state.

          **Meaning:** A first offense carries an administrative fine between $5,000 and $15,000, and the ban covers fins on their own, not sharks caught whole for other purposes.

          **Reason:** Lawmakers targeted the fin trade because finning typically means slicing the fins off a live shark and discarding the body at sea, and Hawaii's statute went on to become model legislation for more than a dozen other states.

      - subtitle: "California"
        status: "Verified"
        anchor_phrases:
          - "foie gras ban"
        text: |
          **Law:** California prohibits force-feeding a bird to enlarge its liver beyond normal size and bans selling any product made that way, effectively outlawing foie gras produced through force-feeding.

          **Meaning:** Signed in 2004 as SB 1520, the law didn't take effect until July 2012, giving producers eight years to invent a force-feeding-free method. None arrived. Violators face $1,000 per violation plus $1,000 for each day it continues.

          **Reason:** Restaurants and foie gras producers have repeatedly sued to overturn the ban, making it one of the most litigated food statutes in the country, and it still resurfaces in court years after taking effect.

      - subtitle: "Illinois"
        status: "Verified"
        anchor_phrases:
          - "horse meat"
        text: |
          **Law:** Illinois bans slaughtering horses for human consumption and bars importing or exporting horsemeat intended to be eaten, a law Governor Rod Blagojevich signed in 2007.

          **Meaning:** The ban shut down Cavel International in DeKalb, at the time the last horse slaughterhouse still operating in the United States. Violating the law carries up to 30 days in jail and a $1,500 fine.

          **Reason:** Illinois effectively ended domestic horse slaughter for human consumption with this one law, since Cavel's closure left no USDA-inspected horse slaughter facility operating anywhere in the country.

      - subtitle: "Wisconsin"
        status: "Verified"
        anchor_phrases:
          - "licensed cheesemaker"
        text: |
          **Law:** Wisconsin is the only state that requires a license to make cheese, and cheese carrying the state's official grade mark must be evaluated by a grader licensed through the Department of Agriculture, Trade and Consumer Protection.

          **Meaning:** Around 1,200 licensed cheesemakers currently hold the credential, and the elite Master Cheesemaker certification, which demands years of additional training beyond the base license, exists only in Wisconsin.

          **Reason:** The requirement traces back to grading standards Wisconsin set in the 1870s, treating cheesemaking as a licensed trade rather than something anyone can do commercially without training.

      - subtitle: "Vermont"
        status: "Verified"
        anchor_phrases:
          - "raw milk"
        text: |
          **Law:** Vermont lets farmers sell raw milk directly to consumers with no license at all, up to 87.5 gallons a week. Producers who meet additional requirements can sell as much as 350 gallons a week and deliver or sell at farmers markets.

          **Meaning:** Selling more than 350 gallons in one week is illegal, and the milk has to pass straight from producer to consumer for personal use, never resold.

          **Reason:** The tiered system built into Vermont's dairy statute lets a small farm sell raw milk without registering with the state at all, one of the more permissive raw milk laws anywhere in the country.

      - subtitle: "South Carolina"
        status: "Verified"
        anchor_phrases:
          - "raw milk retail"
        text: |
          **Law:** South Carolina lets a raw milk producer holding a "Raw Milk for Human Consumption" permit supply retail stores without those stores needing a separate permit, as long as the milk isn't repackaged or relabeled.

          **Meaning:** Most states that allow raw milk sales require a permit at every step, farm, distributor, and store. South Carolina's producer permit covers the whole chain instead.

          **Reason:** That single-permit structure is what makes South Carolina's raw milk law stand out among states that allow the sale at all, since a health food store can carry it without ever applying for its own license.

      - subtitle: "Utah"
        status: "Verified"
        anchor_phrases:
          - "Home Consumption and Homemade Food Act"
        text: |
          **Law:** Utah's Home Consumption and Homemade Food Act, passed in 2018, lets home cooks sell almost any homemade food directly to consumers with no state or local inspection, permit, or license.

          **Meaning:** Sellers must label products as processed without government inspection and not for resale. Raw milk and most raw meat are excluded, though poultry and rabbits raised by the seller are allowed.

          **Reason:** A follow-up 2021 law, the Microenterprise Home Kitchen Act, went further and let people sell home-cooked meals containing meat under tighter rules, making Utah one of the most permissive states for selling food out of a home kitchen.

      - subtitle: "Texas"
        status: "Verified"
        anchor_phrases:
          - "Cottage Food Law"
        text: |
          **Law:** Texas's Cottage Food Law lets home bakers and cooks sell homemade goods like bread, jams, and pickles directly to customers with no permit, inspection, or license, and a 2019 rewrite opened the allowed-foods list instead of limiting sellers to items named specifically in the statute.

          **Meaning:** The annual sales cap has also climbed sharply, from $50,000 to $150,000, and now adjusts automatically for inflation.

          **Reason:** Texas built one of the broadest cottage food laws in the country by repeatedly loosening it rather than tightening it as home sellers scaled up their businesses.

      - subtitle: "Maine"
        status: "Verified"
        anchor_phrases:
          - "Food Sovereignty Act"
        text: |
          **Law:** Maine's Food Sovereignty Act, signed in 2017, lets towns pass local ordinances allowing direct farm-to-consumer food sales, including raw milk, meat, and cheese, without state licensing, as long as the sale happens face-to-face at the farm.

          **Meaning:** More than 70 Maine towns adopted these ordinances within a few years of the law passing, though a 2017 amendment kept meat and poultry inspection under state control even in participating towns.

          **Reason:** The law hands food regulation down to individual towns rather than the state, so the actual level of oversight a farm faces depends on which town it happens to sit in.

      - subtitle: "Florida"
        status: "Verified"
        anchor_phrases:
          - "turtle harvest ban"
        text: |
          **Law:** Florida banned commercial harvesting of freshwater turtles in 2009, a rule wildlife officials called the most restrictive turtle protection in the country, and limited noncommercial harvest to one turtle per person per day.

          **Meaning:** Commercial turtle farms were given until 2011 to keep pulling turtles from the wild to restock captive breeding stock before the rule applied to them in full.

          **Reason:** Florida turtles were being caught in bulk for export to Asian food markets, and the Fish and Wildlife Conservation Commission acted after several species started declining fast enough to alarm biologists.

      - subtitle: "New Mexico"
        status: "Verified"
        anchor_phrases:
          - "Red or Green"
        text: |
          **Law:** New Mexico adopted "Red or Green?" as its official state question in 1996 through a House Joint Memorial, with "red and green, or Christmas" recognized as the sanctioned answer.

          **Meaning:** The question refers to which chile pepper color a diner wants on their order, and New Mexico is the only state with an official state question of any kind.

          **Reason:** Lawmakers created the question to recognize how much the chile industry means to the state economy, turning an ordinary restaurant question into a line of actual state law.

      - subtitle: "New York"
        status: "Verified"
        anchor_phrases:
          - "raw milk"
        text: |
          **Law:** New York allows raw milk sales, but only directly from the farm to the consumer. A producer needs a Raw Milk Sales permit, and the law bars off-farm delivery, mail order, and retail store sales entirely.

          **Meaning:** Anyone who wants raw milk in New York has to travel to the farm that produced it in person, with no exceptions written into the statute.

          **Reason:** Bills to allow retail raw milk sales have been introduced repeatedly in Albany without passing, so New York stays one of the stricter raw milk states even though the product itself is legal.

