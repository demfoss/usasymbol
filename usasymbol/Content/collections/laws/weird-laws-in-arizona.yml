page:
  h1: "Weird Arizona Laws Still on the Books"
  quick_answer:
    - "Three Arizona weird-law claims are confirmed real: the saguaro cactus felony, a Kingman donkey ordinance, and the Stupid Motorist Law that bills you for your own flood rescue."
    - "The cactus law is not a fine. Cutting a protected saguaro is a class 4 felony, and Arizona Game and Fish actively investigates violations."
    - "Women-in-pants claims, six-women-per-house stories, and dog-face laws are either unverified or recycled from other states' lists with no Arizona source."
  sources:
    - name: "Arizona Native Plant Law — ARS Title 3, Chapter 7"
      url: "https://azleg.gov/arsDetail/?title=03"
    - name: "Arizona Revised Statutes — Stupid Motorist Law (Title 28)"
      url: "https://azleg.gov/ars/28/00910.htm"
    - name: "Arizona Game and Fish Department — Native Plant Protection"
      url: "https://www.azgfd.com"
    - name: "Mohave County Historical Society — Kingman Flood Records"
      url: "https://www.mohavemuseum.org"

sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Arizona That Are Real"
    paragraphs:
      - "A cactus felony, a monsoon rescue bill, and a donkey ordinance from 1924 are all documented. These Unusual Laws in Arizona are not folklore."
    highlights:
      - name: "Saguaro Cactus Felony"
        status: "Verified"
        image: "/images/collections/laws/arizona-saguaro-cactus.jpg"
        description: |
          **Law:** Cutting down, damaging, or removing a protected native plant — including a saguaro cactus — without a permit is a class 4 felony in Arizona.

          **Meaning:** A conviction carries up to 3.75 years in prison. Arizona Game and Fish officers investigate tip-offs about cactus theft the way other agencies respond to stolen vehicles.

          **Reason:** Saguaros take 75 years to grow to full height. Mid-20th-century development destroyed thousands of them, and the state set penalties serious enough to make any developer pause before ordering a bulldozer.

      - name: "Stupid Motorist Law"
        status: "Verified"
        image: "/images/collections/laws/arizona-flooded-wash.jpg"
        description: |
          **Law:** Arizona law makes it a misdemeanor to drive around a barricade into a flooded roadway. Get stranded and need rescuing, and the county can bill you for the full cost of the operation.

          **Meaning:** Rescue bills have reached tens of thousands of dollars. The law applies every summer monsoon season, and it is enforced.

          **Reason:** Arizona's desert washes flood fast and without warning. Enough drivers were ignoring barricades and requiring emergency extraction that the legislature made financial accountability part of the rule.

      - name: "Donkey Sleeping in a Bathtub"
        status: "Verified"
        image: "/images/collections/laws/arizona-kingman-donkey.jpg"
        description: |
          **Law:** A Kingman, Arizona ordinance makes it unlawful to leave a donkey sleeping in a bathtub.

          **Meaning:** The rule targets leaving a work animal unattended in a residential fixture where it could be trapped or carried away during a flash flood.

          **Reason:** In 1924, a local merchant's donkey habitually slept in an abandoned bathtub near a wash. A flash flood swept the tub — and the donkey inside — several miles downstream. The rescue operation prompted Kingman to codify the lesson.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Arizona We Couldn't Verify"
    paragraphs:
      - "A Tucson pants ban and a Maricopa County occupancy rule are still passed around as Weird Laws in Arizona. Neither one has a statute number, a date, or a traceable record in official code."
    subsections:
      - subtitle: "Women are not allowed to wear pants in Tucson"
        status: "Not Verified"
        text: |
          **Claim:** Women cannot legally wear pants in Tucson, Arizona.

          **Why We Couldn't Verify It:** No provision in Tucson's Municipal Code restricts women's clothing in this way. The claim appears on dozens of weird-law lists without a year, a section number, or any historical context explaining who passed such a rule and why.

      - subtitle: "No more than six women can live in the same house in Maricopa County"
        status: "Not Verified"
        text: |
          **Claim:** No more than six women can share a residence in Maricopa County, with seven or more constituting a legal brothel.

          **Why We Couldn't Verify It:** Maricopa County codes include occupancy limits and adult-use regulations, but nothing matching this specific language. The story may trace to early anti-prostitution zoning, but no ordinance with this exact rule has surfaced in county records.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Arizona Laws That Are Myths"
    paragraphs:
      - "Check enough Strange Arizona Laws lists and these two entries always show up. Neither one connects to a real statute, a city ordinance, or a pin-downable jurisdiction."
    subsections:
      - subtitle: "Making ugly faces at a dog can get you arrested in Arizona"
        status: "Myth"
        text: |
          **Myth:** You can be arrested in Arizona for making ugly faces at a dog.

          **Reality:** No Arizona statute or municipal ordinance targets facial expressions aimed at animals. Word-for-word identical versions of this claim appear on fake weird-law lists for Oklahoma, Mississippi, and several other states. Arizona animal-cruelty law requires actual harm or neglect, not a face.

      - subtitle: "Playing cards with a Native American is illegal in Globe, Arizona"
        status: "Myth"
        text: |
          **Myth:** Playing cards with a Native American is illegal in Globe, Arizona.

          **Reality:** No Globe city ordinance and no Arizona state law contains this prohibition. The claim likely grew from federal gaming regulations governing reservation land, then got reframed as a local Arizona rule. Globe has appeared as the source in multiple lists, but no ordinance number, date, or enforcement record supports it.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Arizona's Term Limits Keep Old Ordinances Off the Repeal List"
    paragraphs:
      - "Arizona voters adopted legislative term limits in 1992, among the first states to do so. Each election cycle brings significant turnover, and no institutional memory accumulates around obscure statutes or forgotten city ordinances. Repealing an odd Kingman rule or auditing a Maricopa County occupancy claim simply does not reach the floor when budget bills and water-rights disputes fill the calendar. Arizona's 91 incorporated cities and towns each update their own codes independently, with no statewide review schedule and no obligation to flag rules that have outlived their original reason."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Arizona issues rescue cost bills under the Stupid Motorist Law every monsoon season. A single extraction from a flooded wash can exceed $10,000."
      - "Hi Jolly, the Syrian-born camel driver hired to lead the US Army Camel Corps through Arizona, died in Quartzsite in 1902. His grave marker is topped with a small metal camel."
      - "Saguaro National Park, established near Tucson in 1933, was created partly because early real estate developers had already cleared saguaro-dense land for subdivisions."
      - "Arizona's term-limit law caps state legislators at four consecutive terms in each chamber — among the strictest consecutive-service limits in the country."
      - "The last confirmed feral camel sighting in Arizona involved an animal locals called the Red Ghost, documented crossing the territory from 1883 until a rancher shot it in 1891."

