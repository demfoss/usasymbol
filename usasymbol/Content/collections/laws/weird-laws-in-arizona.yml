faq:
  - question: "Is it really illegal to cut down a cactus in Arizona?"
    answer: "Yes. Cutting, damaging, or removing a protected native plant without a permit is a class 4 felony under Arizona law. Saguaro cacti are fully protected. Convicted violators face up to 3.75 years in prison, and the state investigates reports through a dedicated patrol unit."
  - question: "What is the weirdest law still on the books in Arizona?"
    answer: "The saguaro cactus felony surprises most people because the penalty is so serious. Damaging a protected cactus can carry more prison time than many non-violent property crimes."
  - question: "Is the donkey-in-bathtub law real?"
    answer: "Yes. Kingman passed the ordinance after a 1924 flood swept a merchant's donkey miles downstream inside an abandoned bathtub. The rescue made local news and the ordinance followed."
  - question: "What is the Stupid Motorist Law in Arizona?"
    answer: "Arizona law makes it a misdemeanor to drive around a barricade into flooded water. Get stranded, and the county can bill you for the full cost of the rescue. Arizona enforces it every monsoon season."
  - question: "Are any of Arizona's weird laws actually enforced?"
    answer: "Two of them are. The saguaro cactus felony is actively investigated and prosecuted each year. Rescue bills under the Stupid Motorist Law arrive every monsoon season. Both the Kingman donkey ordinance and the camel-era wildlife rules have no known modern enforcement history."
