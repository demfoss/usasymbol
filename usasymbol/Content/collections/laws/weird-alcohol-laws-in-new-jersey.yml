faq:
  - question: "Are there still dry towns in New Jersey?"
    answer: "Yes, roughly 30 as of 2024, down from 32 in 2016. Ocean City has stayed dry since 1909 to preserve its family-oriented identity, and reversing a dry town's status requires its own new referendum."

  - question: "Why do so many New Jersey restaurants ask you to bring your own wine?"
    answer: "New Jersey's 1947 license formula caps consumption licenses at one per 3,000 residents, and the fixed supply pushed resale prices as high as $500,000 in some towns. Many restaurants skip a liquor license entirely and rely on the state's BYOB law instead."

  - question: "Could New Jersey restaurants always advertise as BYOB?"
    answer: "No. New Jersey barred unlicensed restaurants from advertising that they allowed BYOB until November 18, 2018, when a court struck the ban down after an Atlantic City business challenged it on free-speech grounds."

  - question: "How much does a New Jersey liquor license cost?"
    answer: "Prices vary widely by town, but consumption licenses have sold for $350,000 to $500,000 in popular areas and occasionally more than $1 million. Governor Phil Murphy signed a reform bill in January 2024 aimed at easing that scarcity."

