page:
  h1: "Weird Alcohol Laws in New Jersey"

  quick_answer:
    - "About 30 New Jersey towns remain legally dry, banning retail alcohol sales and refusing to issue any bar or restaurant liquor license."
    - "New Jersey's BYOB law lets diners bring their own wine or beer into restaurants without a liquor license, a workaround for the state's tight license caps."
    - "New Jersey barred unlicensed restaurants from even advertising that they allowed BYOB until a 2018 court ruling struck the ban down."

