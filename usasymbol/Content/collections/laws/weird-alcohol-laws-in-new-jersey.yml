sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in New Jersey That Are Real"
    paragraphs:
      - "New Jersey's alcohol laws still run through a licensing system written in 1947, and its effects show up in everything from dry towns to how the state's restaurants serve wine."
    highlights:
      - name: "About 30 Towns Still Ban Alcohol Sales Entirely"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-dry-towns.jpg"
        anchor_phrases:
          - "dry"
        description: |
          **Law:** New Jersey lets municipalities go "dry" through a local referendum, and roughly 30 towns, down from 32 in 2016, still bar retail alcohol sales and refuse to issue any bar or restaurant liquor license.

          **Meaning:** Residents in a dry town can still legally possess and drink alcohol at home; the ban only stops local businesses from selling it.

          **Reason:** Many of these bans trace back to early-1900s temperance referendums, and towns like Ocean City have kept theirs since 1909 to preserve a family-oriented identity, with reversal requiring its own new referendum.
      - name: "Most Restaurants Can't Serve Alcohol, So Diners Bring Their Own"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-byob-law.jpg"
        anchor_phrases:
          - "BYOB"
        description: |
          **Law:** New Jersey's BYOB law lets patrons bring their own wine or beer, though not hard liquor, into a restaurant that holds no liquor license, and restaurants can charge a corkage or service fee for it.

          **Meaning:** A wide swath of New Jersey's restaurant scene, especially in license-scarce shore towns like those in Atlantic County, runs entirely on BYOB rather than a bar license.

          **Reason:** A 1947 law capped consumption licenses at one per 3,000 residents and distribution licenses at one per 7,500, a formula never adjusted for how many restaurants a modern town supports, which pushed license prices as high as $500,000 and made BYOB the only realistic option for most new restaurants.
      - name: "Restaurants Couldn't Even Advertise Being BYOB Until 2018"
        status: "Verified"
        image: "/images/collections/laws/new-jersey-byob-advertising-ban.jpg"
        anchor_phrases:
          - "advertising"
        description: |
          **Law:** Before November 18, 2018, New Jersey barred unlicensed restaurants from advertising that customers could bring their own alcohol.

          **Meaning:** A restaurant could legally allow BYOB but could not put up a sign or run an ad mentioning it, forcing the practice to spread mostly by word of mouth.

          **Reason:** A New Jersey court struck the advertising ban down after an Atlantic City business challenged it, ruling that the state could regulate alcohol sales themselves but not restrict truthful speech about a legal practice.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why New Jersey Diners Bring Their Own Wine"
    paragraphs:
      - "New Jersey's 1947 liquor license cap, one consumption license per 3,000 residents, has never been rewritten to match how many restaurants a modern town can support. In dense or popular areas, the fixed supply of licenses meant existing ones traded on a resale market instead, with prices in some towns climbing past $350,000 and occasionally past $1 million."
      - "Rather than pay that much just to serve a glass of wine, most new restaurants in the state simply skip a liquor license and let customers bring their own bottle instead. Governor Phil Murphy signed the state's first major license reform in nearly a century in January 2024, aimed at easing the scarcity that made BYOB the default rather than the exception."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "New Jersey's dry-town count dropped from 32 in 2016 to about 30 by 2024, as towns like Haddon Heights voted to end alcohol bans that had lasted more than a century."
      - "A New Jersey petition signed by at least 15% of a town's registered voters can force a referendum on going dry or reversing an existing dry vote."
      - "New Jersey's 1947 license formula caps consumption licenses at one per 3,000 residents and distribution licenses at one per 7,500."
      - "Governor Phil Murphy signed New Jersey's first major liquor license overhaul in nearly a century on January 16, 2024."

