sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Michigan That Are Real"
    paragraphs:
      - "Adultery is still a felony in Michigan, one of just a handful of states where that's true. Real Michigan Laws You Won't Believe also include a 1931 seduction statute and two related morality laws that only came off the books in the last decade."
    highlights:
      - name: "Adultery Is Still a Felony"
        status: "Verified"
        image: "/images/collections/laws/michigan-adultery-felony-law.jpg"
        description: |
          **Law:** Michigan law makes committing adultery a felony, with the same punishment applying to an unmarried man involved with a married woman.

          **Meaning:** On paper, a conviction can carry state prison time, though prosecutors almost never bring charges under this statute today.

          **Reason:** The rule dates to Michigan's 1931 penal code, written during an era when adultery was treated as a criminal offense against public morality, not just a private matter for divorce court.

      - name: "Seducing an Unmarried Woman Is Still a Felony"
        status: "Verified"
        image: "/images/collections/laws/michigan-seduction-law.jpg"
        description: |
          **Law:** Michigan law makes it a felony for a man to "seduce and debauch" an unmarried woman, punishable by up to five years in prison or a $2,500 fine.

          **Meaning:** Prosecutors have one year from the alleged offense to bring charges, a short window that makes modern enforcement almost impossible.

          **Reason:** Like the adultery statute, it comes from the same 1931 penal code built to criminalize behavior considered morally scandalous at the time, not just civilly actionable.

      - name: "Cursing Near Women and Children Was Illegal Until 2016"
        status: "Verified"
        image: "/images/collections/laws/michigan-repealed-profanity-law.jpg"
        description: |
          **Law:** Michigan once made it a misdemeanor to use indecent, obscene, or insulting language within the hearing of any woman or child.

          **Meaning:** Lawmakers formally repealed the section in 2016, decades after it had stopped being enforced in any serious way.

          **Reason:** The rule reflected early-1900s ideas about protecting women and children from coarse language in public, a purpose modern disorderly conduct laws already cover.

      - name: "Living Together Unmarried Was a Crime Until 2023"
        status: "Verified"
        image: "/images/collections/laws/michigan-cohabitation-law-repealed.jpg"
        description: |
          **Law:** Michigan classified unmarried couples who "lewdly and lasciviously" lived together as committing a misdemeanor.

          **Meaning:** The law sat unenforced for decades before the legislature repealed it in 2023, partly because it complicated federal tax dependent rules for unmarried couples.

          **Reason:** It came from the same morality-focused wave of early-1900s statutes as the adultery and seduction laws, built to discourage cohabitation outside marriage.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Michigan We Couldn't Verify"
    paragraphs:
      - "A rule about pigs and nose rings is one of the odder Weird Laws in Michigan claims still floating around online. Three more claims share the same problem: no ordinance number, no city record, no date."
    subsections:
      - subtitle: "Roaming pigs in Detroit must wear a nose ring"
        status: "Not Verified"
        text: |
          **Claim:** Detroit's municipal code requires any pig allowed to roam freely to wear a ring through its nose.

          **Why We Couldn't Verify It:** No matching section turns up in Detroit's current code of ordinances. The claim has no cited chapter number and no explanation of when or why such a rule would have been written.

      - subtitle: "Serenading someone outside their home is banned in Kalamazoo"
        status: "Not Verified"
        text: |
          **Claim:** Kalamazoo has an ordinance specifically prohibiting playing music outside someone's window for romantic purposes.

          **Why We Couldn't Verify It:** Kalamazoo does have a general noise ordinance, but nothing in the published code singles out serenading. The claim appears to have been invented or exaggerated from that general nuisance rule.

      - subtitle: "Farmers in Clawson can legally sleep in buildings with their livestock"
        status: "Not Verified"
        text: |
          **Claim:** Clawson's city code contains a specific exception letting farmers sleep in the same building as their animals.

          **Why We Couldn't Verify It:** No provision matching this description appears in any available version of Clawson's municipal code. Clawson is a small, developed Detroit suburb, which makes a still-active farming exception an odd detail with no record to back it up.

      - subtitle: "Hunting is illegal on your own wedding day in Michigan"
        status: "Not Verified"
        text: |
          **Claim:** State law specifically bans hunting on the day you get married.

          **Why We Couldn't Verify It:** No section of Michigan's hunting and wildlife statutes mentions weddings or marriage dates. The claim has no citation attached anywhere it appears and reads like a joke that got repeated as fact.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Michigan Laws That Are Myths"
    paragraphs:
      - "A haircut myth tied to Battle Creek is the most persistent of the Strange Michigan Laws claims that turn out to be false, and it has a surprisingly specific historical origin."
    subsections:
      - subtitle: "A wife needs her husband's permission to cut her hair"
        status: "Myth"
        text: |
          **Myth:** Michigan law, sometimes pinned to Battle Creek, requires a married woman to get her husband's written permission before cutting her hair.

          **Reality:** No such statute has ever existed, according to attorneys and reporters who have specifically investigated the claim. It likely grew out of old coverture-era assumptions that a wife's legal identity merged with her husband's, mixed with 1920s newspaper panic over the new bobbed-hair trend among young women.

      - subtitle: "It's illegal to sneak up on someone from behind and yell 'boo'"
        status: "Myth"
        text: |
          **Myth:** Michigan has a specific statute against startling someone by yelling "boo" from behind.

          **Reality:** No statute, ordinance, or case record supports this claim anywhere in Michigan. It's a version of a joke entry that gets recycled across many states' weird-law lists with the same wording and no source ever attached.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Michigan's 1931 Penal Code Still Shapes Its Weirdest Laws"
    paragraphs:
      - "Michigan's core criminal statutes still come from a single 1931 penal code, and lawmakers generally repeal it one section at a time rather than through a full rewrite. The obscene-language law waited until 2015 for its repeal bill, and the cohabitation ban waited until 2023. Adultery and seduction remain felonies simply because no specific bill has targeted those sections yet, not because anyone in Lansing actively defends them."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Michigan's seduction statute gives prosecutors only one year from the alleged offense to bring charges, one of the shortest statutes of limitations anywhere in the state's penal code."
      - "The 2023 repeal of Michigan's cohabitation ban passed partly because the outdated law was creating real complications for unmarried couples filing federal tax dependent claims."
      - "Michigan's adultery felony predates no-fault divorce in the state by decades, from an era when proving adultery in court actually mattered for a legal separation."
      - "The bobbed-hair panic that likely inspired the haircut permission myth was a real national news phenomenon in the 1920s, covered breathlessly by newspapers as a symbol of changing gender roles."
      - "Michigan repealed its obscene-language statute in 2015 through Public Act 210, a single-purpose bill that removed just that one section from the penal code."

