faq:
  - question: "Is adultery still illegal in Michigan?"
    answer: "Yes, technically. Michigan law still classifies adultery as a felony, though prosecutors almost never bring charges under it today."
  - question: "When did Michigan repeal its ban on unmarried couples living together?"
    answer: "In 2023. The law had classified cohabiting unmarried couples as committing a misdemeanor, and lawmakers repealed it partly to fix complications it caused with federal tax dependent rules."
  - question: "Is it true a Michigan wife needs her husband's permission for a haircut?"
    answer: "No. Attorneys and reporters who investigated the claim found no statute requiring this, either historically or today. It's an urban legend likely rooted in 1920s newspaper coverage of the bobbed-hair trend."
  - question: "What is the weirdest real law still on the books in Michigan?"
    answer: "The 1931 seduction statute stands out, making it a felony for a man to seduce an unmarried woman, with prosecutors given just one year to file charges."
  - question: "Is it illegal to hunt on your wedding day in Michigan?"
    answer: "No confirmed statute supports this claim. Michigan's hunting regulations don't mention weddings or marriage dates anywhere."
  - question: "Does Detroit really require roaming pigs to wear nose rings?"
    answer: "No record of this ordinance appears in Detroit's current municipal code. It's a widely repeated claim with no citation attached."
