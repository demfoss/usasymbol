faq:
  - question: "Can a Michigan county still vote to ban alcohol sales?"
    answer: "Legally, yes. Michigan's original 1933 liquor law lets a county's voters block retail alcohol sales countywide by referendum, and neither the Legislature nor the Liquor Control Commission can override a county that goes dry that way, even though most of Michigan has stayed wet for decades."

  - question: "Why can't bars serve mixed drinks on Sunday in Hillsdale County?"
    answer: "A local-option law in place since 1980 bans on-premises spirits and mixed-drink sales in Hillsdale County from 7 a.m. Sunday to 2 a.m. Monday. It is the only county in Michigan with that restriction, and package sales at stores are not affected."

  - question: "When did Michigan allow Sunday alcohol sales statewide?"
    answer: "Michigan changed its rules in 2010 to allow Sunday morning alcohol sales across most of the state, ending most of the state's older blue laws. Hillsdale County's separate on-premises ban was not part of that change."

  - question: "What is Michigan's dram shop law?"
    answer: "It holds a bar, restaurant, or other licensee liable for injuries caused by a visibly intoxicated patron they kept serving, and it applies the same standard to serving a minor without making a diligent inquiry into their age."

