page:
  h1: "Weird Alcohol Laws in Michigan"

  quick_answer:
    - "Michigan's original 1933 liquor law still lets a county's voters block retail alcohol sales entirely by referendum, a provision written right after Prohibition ended."
    - "Hillsdale County has banned on-premises Sunday bar sales since 1980, and it remains the only county in Michigan with that restriction."
    - "Michigan's dram shop law makes a bar or restaurant financially liable for injuries caused by a visibly intoxicated patron they kept serving."

