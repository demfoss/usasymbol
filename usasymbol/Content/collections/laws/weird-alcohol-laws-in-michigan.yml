sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Michigan That Are Real"
    paragraphs:
      - "Michigan rebuilt its alcohol rules from scratch after Prohibition, and a few pieces of that original 1933 framework, plus one county's local holdout, still shape the state today."
    highlights:
      - name: "Counties Can Still Vote Themselves Dry"
        status: "Verified"
        image: "/images/collections/laws/michigan-county-dry-vote.jpg"
        anchor_phrases:
          - "county's voters"
          - "1933"
        description: |
          **Law:** Since the 1933 Liquor Control Act, Michigan law bars the Legislature and the Liquor Control Commission from licensing alcohol sales in any county where a majority of voters reject it by referendum.

          **Meaning:** The mechanism gives individual counties a direct, standing veto over retail alcohol sales within their own borders.

          **Reason:** The provision was written into Michigan's very first post-Prohibition liquor law and has never been repealed, so the legal path to a countywide dry vote still exists today even though most Michigan counties settled the question decades ago.
      - name: "Hillsdale County Still Bans Sunday Bar Sales"
        status: "Verified"
        image: "/images/collections/laws/michigan-hillsdale-sunday-ban.jpg"
        anchor_phrases:
          - "Sunday"
          - "on-premises"
        description: |
          **Law:** A local-option ban in place since 1980 stops Hillsdale County bars and restaurants from selling spirits and mixed drinks for on-premises consumption from 7 a.m. Sunday to 2 a.m. Monday.

          **Meaning:** Package sales at grocery and liquor stores are legal on Sundays in Hillsdale County; only sit-down bar and restaurant liquor service is restricted.

          **Reason:** The county is Michigan's last blue-law holdout, and the state's repeal process is complicated enough that county officials have tried and failed to reverse it more than once.
      - name: "Serving a Visibly Intoxicated Guest Can Make the Bar Liable"
        status: "Verified"
        image: "/images/collections/laws/michigan-dram-shop-law.jpg"
        anchor_phrases:
          - "dram shop law"
          - "diligent inquiry"
        description: |
          **Law:** Michigan's dram shop law holds bars, restaurants, and other licensees financially responsible for injuries caused by a visibly intoxicated patron they kept serving.

          **Meaning:** A bartender who fails to make a "diligent inquiry" into a young-looking customer's age faces the same liability as one who serves a minor outright.

          **Reason:** The law shifts part of the cost of drunk-driving and other alcohol-related harm onto the business that profited from the last round, not only the drinker.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why One Michigan County Still Closes the Bar on Sunday"
    paragraphs:
      - "Michigan lifted most statewide Sunday restrictions in 2010, allowing morning alcohol sales across the rest of the state. Hillsdale County's ban, a separate local-option law dating to 1980, was untouched by that change because ending it requires its own countywide repeal process."
      - "State lawmakers introduced bills in 2025 aimed at simplifying that repeal process, after years of failed attempts by county officials to hold a new vote. Until a repeal succeeds, Hillsdale remains the only county in Michigan where a restaurant cannot serve a mixed drink or a glass of whiskey on a Sunday."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Michigan's first liquor control commission had 17 members, one per congressional district, before the Legislature replaced it with the current five-member commission in December 1933."
      - "Beer and wine sold under Michigan's original 1933 liquor law was capped at 3.2% alcohol by weight, the federal transition limit used nationwide just before full Prohibition repeal."
      - "Hillsdale County's Sunday ban only restricts on-premises bar and restaurant sales; grocery and liquor stores there can still sell packaged alcohol on Sundays."
      - "Michigan's dram shop law requires servers to make a 'diligent inquiry' into a customer's age, not just a visual guess, before pouring a drink."

