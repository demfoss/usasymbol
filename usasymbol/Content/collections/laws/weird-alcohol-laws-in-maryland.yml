page:
  h1: "Weird Alcohol Laws in Maryland"

  quick_answer:
    - "Maryland has banned beer and wine sales in chain grocery stores since 1978, one of only three states with a rule like it, though four Montgomery County supermarkets kept the right under a grandfather clause."
    - "Sunday alcohol sales bans in Maryland are set county by county, not statewide. Baltimore County and Garrett County restrict Sunday sales while most other counties allow them."
    - "The town of Washington Grove has no legal alcohol sales at all, a completely dry municipality inside an otherwise wet county."

