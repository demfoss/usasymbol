sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Maryland That Are Real"
    paragraphs:
      - "Maryland regulates alcohol at the county level more than most states, which produces a genuinely uneven map of what is legal to buy and where."
    highlights:
      - name: "Chain Grocery Stores Still Can't Sell Beer or Wine"
        status: "Verified"
        image: "/images/collections/laws/maryland-grocery-store-ban.jpg"
        anchor_phrases:
          - "1978"
          - "chain stores"
        description: |
          **Law:** A 1978 Maryland law bars retail chain stores, including grocery chains and big-box retailers, from selling beer, wine, or liquor, making Maryland one of only three states with a ban like it.

          **Meaning:** A shopper filling a cart at most Maryland grocery chains cannot pick up a six-pack alongside their groceries the way shoppers can in most other states.

          **Reason:** The 1978 law was written to protect independently owned liquor stores from chain-store competition, and lawmakers never repealed it even as grocery retail consolidated nationally around large chains.
      - name: "Four Supermarkets Kept the Right to Sell Beer and Wine Anyway"
        status: "Verified"
        image: "/images/collections/laws/maryland-grandfather-clause-stores.jpg"
        anchor_phrases:
          - "grandfather clause"
        description: |
          **Law:** A grandfather clause let four Montgomery County supermarkets, Shoppers, Giant, Safeway, and Magruder's, keep selling beer and wine at one location each, despite the 1978 chain-store ban.

          **Meaning:** A handful of specific store locations sell beer and wine legally while every other branch of the same chain elsewhere in Maryland cannot.

          **Reason:** Those particular stores were already selling beer and wine before the 1978 law took effect, and the legislature chose to preserve their existing licenses rather than force them to stop.
      - name: "Sunday Alcohol Bans Depend on Which County You're In"
        status: "Verified"
        image: "/images/collections/laws/maryland-county-sunday-bans.jpg"
        anchor_phrases:
          - "Baltimore County"
          - "Garrett County"
        description: |
          **Law:** Maryland leaves Sunday alcohol sales restrictions to individual counties rather than setting one statewide rule, and Baltimore County and Garrett County both prohibit alcohol sales on Sundays.

          **Meaning:** A store just over a county line from Baltimore County can legally sell alcohol on a Sunday when a store inside Baltimore County cannot.

          **Reason:** Maryland's Alcoholic Beverages Article sets a general statewide framework but gives county liquor boards the authority to set stricter local rules, which is why Sunday sales rules never became uniform statewide.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Maryland Alcohol Laws That Are Myths"
    paragraphs:
      - "One common claim about Maryland alcohol law overstates a real, narrower rule until it sounds like a statewide ban that doesn't actually exist."
    subsections:
      - subtitle: "Maryland Bans Alcohol Sales on Sundays Statewide"
        status: "Myth"
        anchor_phrases:
          - "bans alcohol sales on Sundays statewide"
        text: |
          **Myth:** Maryland bans alcohol sales on Sundays across the entire state.

          **Reality:** Sunday restrictions apply only in specific counties, including Baltimore County and Garrett County. Most Maryland jurisdictions allow Sunday alcohol sales, so the actual rule depends entirely on local county law rather than one statewide ban.

  - id: why-the-ban-persists
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Maryland Never Repealed Its Grocery Store Ban"
    paragraphs:
      - "Maryland's 1978 chain-store alcohol ban has survived nearly five decades of retail change, including the rise of national grocery chains that dominate the market almost everywhere else. Independent liquor store owners have consistently opposed repeal efforts, arguing the ban protects small businesses that would struggle to compete against chain retailers selling beer and wine at scale."
      - "Governor Wes Moore has publicly pushed to change the law, calling for reform as recently as December 2024, and Maryland lawmakers have introduced repeal bills in multiple recent legislative sessions. None have passed yet, which keeps Maryland grouped with only two other states that maintain a chain-store alcohol ban this broad."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Maryland's 1978 chain-store alcohol ban makes it one of only three states nationwide with a restriction this broad."
      - "The four grandfathered Montgomery County supermarkets are each limited to just one location selling beer and wine, not every branch of the chain."
      - "Washington Grove, a small town in Montgomery County, has no legal alcohol sales anywhere within its limits."
      - "Maryland's Alcoholic Beverages Article sets the statewide legal framework, but individual county liquor boards can add stricter local rules on top of it."

