faq:
  - question: "Why can't you buy beer at most Maryland grocery stores?"
    answer: "A 1978 Maryland law bans retail chain stores, including most grocery chains, from selling beer, wine, or liquor. The law was meant to protect independently owned liquor stores from chain competition and remains in effect today, making Maryland one of only three states with a ban this broad."

  - question: "Which Maryland grocery stores can sell beer and wine?"
    answer: "Four Montgomery County supermarkets, Shoppers, Giant, Safeway, and Magruder's, kept the right to sell beer and wine at one location each under a grandfather clause, because those specific stores were already selling alcohol before the 1978 ban took effect."

  - question: "Is it true Maryland bans alcohol sales on Sundays?"
    answer: "Not statewide. Only specific counties, including Baltimore County and Garrett County, restrict Sunday alcohol sales. Most Maryland jurisdictions allow Sunday sales, so the claim of a statewide ban is a myth built around a real but narrower county-level rule."

  - question: "Are there dry towns in Maryland?"
    answer: "Yes. Washington Grove, a small town in Montgomery County, has no legal alcohol sales within its limits, even though the surrounding county allows them."

