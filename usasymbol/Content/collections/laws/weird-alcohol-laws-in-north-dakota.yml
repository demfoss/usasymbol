faq:
  - question: "Can you buy alcohol before noon on Sundays in North Dakota?"
    answer: "Yes. Since SB 2220 passed in 2021, North Dakota allows alcohol sales starting at 8 a.m. every day of the week, including Sunday, replacing the old rule that blocked sales until noon."

  - question: "Does North Dakota limit how many bars a city can have?"
    answer: "There is no statewide quota. Cities such as Fargo, Bismarck, and Grand Forks each set their own license caps, often tied to local population, rather than following a single number set by the state."

  - question: "Is beer and pretzels really illegal in North Dakota?"
    answer: "No. This is one of the most repeated weird-law myths in the country, and North Dakota's own Legislative Council has said no statute matches the claim. It likely grew out of a real, unrelated rule about minors being allowed in food-serving areas of bars."

  - question: "Does North Dakota regulate happy hour drink specials?"
    answer: "Not at the state level. North Dakota has no law restricting happy hour pricing or alcohol discount promotions statewide, which leaves any limits on drink specials to individual city ordinances."

