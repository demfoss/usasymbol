page:
  h1: "Weird Alcohol Laws in North Dakota"

  quick_answer:
    - "North Dakota lets alcohol be sold from 8 a.m. to 2 a.m. every day of the week, a rule that only applied to Sundays after a 2021 law extended it."
    - "Bar and liquor license limits in North Dakota come from individual cities, not a statewide quota, so Fargo, Bismarck, and Grand Forks each set their own caps."
    - "The widely repeated claim that North Dakota bans serving beer and pretzels together has no real statute behind it, according to the state's own legislative council."

