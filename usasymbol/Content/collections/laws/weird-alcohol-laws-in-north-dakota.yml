sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in North Dakota That Are Real"
    paragraphs:
      - "North Dakota keeps state alcohol rules short and hands most of the detail work to individual cities, which is why the rules can look different a few miles apart."
    highlights:
      - name: "Sunday Alcohol Sales Start at 8 A.M. Statewide"
        status: "Verified"
        image: "/images/collections/laws/north-dakota-sunday-sales-hours.jpg"
        anchor_phrases:
          - "8 a.m. to 2 a.m. every day"
        description: |
          **Law:** North Dakota law allows alcohol to be sold, served, or consumed between 8 a.m. and 2 a.m. any day, Sunday included, following SB 2220's passage in 2021.

          **Meaning:** A bar or store can legally open and start serving at the same early hour on Sunday as any other day of the week.

          **Reason:** Before 2021, North Dakota barred alcohol sales before noon on Sundays, a holdover blue law that the legislature dropped once lawmakers decided the four-hour gap no longer served any real purpose.
      - name: "Bar License Caps Come From City Hall, Not the State"
        status: "Verified"
        image: "/images/collections/laws/north-dakota-city-license-quota.jpg"
        anchor_phrases:
          - "cities set their own caps"
        description: |
          **Law:** North Dakota has no statewide quota on liquor licenses; cities like Fargo, Bismarck, and Grand Forks each set their own caps, often tied to population.

          **Meaning:** The number of bars a town can license depends entirely on that town's own ordinance, not a formula written into state law.

          **Reason:** North Dakota left licensing authority with municipalities rather than centralizing it, so a growing city can loosen its own cap as its population increases without waiting on legislative action in Bismarck.
      - name: "Happy Hour Discounts Aren't Regulated by the State"
        status: "Verified"
        image: "/images/collections/laws/north-dakota-happy-hour-rules.jpg"
        anchor_phrases:
          - "not regulated by state"
        description: |
          **Law:** North Dakota has no statewide law restricting happy hour pricing or alcohol discount promotions, leaving any such restrictions to local ordinance.

          **Meaning:** A bar in one North Dakota town can run drink specials that would be illegal under a neighboring city's own rules, because the state sets no floor either way.

          **Reason:** North Dakota's approach mirrors its licensing structure, pushing decisions that many other states handle at the state level down to individual cities and counties instead.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange North Dakota Alcohol Laws That Are Myths"
    paragraphs:
      - "One North Dakota alcohol claim shows up on nearly every weird-law list in the country, and the state's own legislative council has said flatly that it isn't real."
    subsections:
      - subtitle: "It's Illegal to Serve Beer and Pretzels at the Same Time"
        status: "Myth"
        anchor_phrases:
          - "beer and pretzels at the same time"
        text: |
          **Myth:** North Dakota bars are not allowed to serve beer and pretzels together.

          **Reality:** No such prohibition exists in North Dakota's alcohol code. A spokesperson for the North Dakota Legislative Council has traced the claim to a misreading of the state's separate rule on minors in bars, where a bar that serves food may let someone under 21 inside a specific area, a detail that got twisted into a fake ban on a bar snack.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why North Dakota Pushed Its Sunday Rule to City Hall Instead"
    paragraphs:
      - "North Dakota's decision to drop most alcohol regulation down to the city level explains why so many of its real rules and its myths both center on inconsistency. The Sunday sales change came from the legislature because hours of sale genuinely needed a single statewide standard, but license counts and happy hour pricing stayed local because lawmakers saw no reason to override what individual cities already handled well enough on their own."
      - "The beer-and-pretzels myth spread for the opposite reason: it sounds exactly like the kind of oddly specific local ordinance North Dakota's patchwork system could plausibly produce, even though nothing in the state's actual alcohol code comes close to banning a bar snack."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "SB 2220, the 2021 law that moved Sunday alcohol sales to 8 a.m., passed the North Dakota legislature with broad bipartisan support."
      - "North Dakota's largest cities have historically tied their bar license counts to population ratios rather than a fixed statewide number."
      - "North Dakota's Attorney General's office, not a separate alcohol control agency, oversees manufacturer and distributor licensing for breweries, wineries, and distilleries."
      - "The beer-and-pretzels myth has circulated in national weird-law roundups for years without anyone ever producing a matching statute or city ordinance."

