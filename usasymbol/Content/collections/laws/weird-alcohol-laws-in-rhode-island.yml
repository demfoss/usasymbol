page:
  h1: "Weird Alcohol Laws in Rhode Island"

  quick_answer:
    - "Rhode Island liquor stores must close on Christmas Day, Thanksgiving Day, and New Year's Day, a rule with no local exception written into state law."
    - "Rhode Island only repealed its Sunday liquor sales ban in recent years, and stores can now sell alcohol on Sundays from 10 a.m. to 6 p.m."
    - "Home brewers in Rhode Island can make up to 200 gallons of beer a year for personal use, though a household with only one adult of legal drinking age is capped at 100 gallons."

