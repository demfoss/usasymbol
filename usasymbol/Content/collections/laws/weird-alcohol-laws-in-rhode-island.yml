sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Rhode Island That Are Real"
    paragraphs:
      - "Rhode Island still carries some of New England's old blue-law instincts around alcohol, even as it has loosened Sunday sales in recent years."
    highlights:
      - name: "Liquor Stores Must Close on Three Specific Holidays"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-holiday-closures.jpg"
        anchor_phrases:
          - "Christmas Day, Thanksgiving Day, and New Year's Day"
        description: |
          **Law:** Rhode Island retail Class A liquor license holders are not authorized to open for the sale of alcoholic beverages on Christmas Day, Thanksgiving Day, or New Year's Day.

          **Meaning:** Even a store that stays open every other day of the year, including Sundays, has to shut its doors completely on those three specific dates.

          **Reason:** The holiday closures date back to Rhode Island's older alcohol blue laws, and unlike the Sunday sales ban the state eventually repealed, lawmakers have kept this narrower set of holiday restrictions in place.
      - name: "The Night Before a Holiday Gets Extended Hours"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-holiday-eve-hours.jpg"
        anchor_phrases:
          - "packaged alcoholic beverages may be sold until 11:00 p.m."
        description: |
          **Law:** On the night before a legal holiday, Rhode Island allows packaged alcoholic beverages to be sold until 11:00 p.m., and when the holiday falls on a Monday, that extended window shifts to the preceding Saturday night.

          **Meaning:** Shoppers effectively get a later closing time right before a stretch when stores will be shut, a built-in stock-up window ahead of each holiday closure.

          **Reason:** Rhode Island's holiday-eve rule exists specifically to offset the mandatory closures, giving retailers and customers one predictable extra hour before the store goes dark for the holiday itself.
      - name: "Home Brewers Are Capped at 200 Gallons a Year"
        status: "Verified"
        image: "/images/collections/laws/rhode-island-homebrew-limit.jpg"
        anchor_phrases:
          - "200 gallons of beer per calendar year"
        description: |
          **Law:** Rhode Island allows home brewers to produce up to 200 gallons of beer per calendar year for personal or family use in a household with more than one adult of legal drinking age, dropping to 100 gallons if only one adult lives there.

          **Meaning:** A serious home-brewing household has real room to experiment, but the limit still exists and scales down for a single-adult home rather than applying one flat number to everyone.

          **Reason:** The household-size distinction reflects that home brewing law is written around personal consumption, not production capacity, so state law ties the ceiling to how many adults are actually expected to drink it.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Rhode Island Kept Its Holiday Closures After Ending the Sunday Ban"
    paragraphs:
      - "Rhode Island's decision to repeal its Sunday sales ban but keep three holiday closures shows lawmakers treating those two restrictions as separate questions. Sunday sales affected commerce every single week, which built sustained pressure from retailers and consumers to change it, while the three annual holiday closures affect business only a handful of days a year, drawing far less organized opposition."
      - "The holiday-eve extended hours rule reinforces that read. Rather than eliminate the closures outright, the legislature built in a release valve the night before, letting customers stock up legally instead of removing the restriction itself. It is a smaller, quieter compromise than the Sunday repeal, but it has left the underlying holiday rule fully intact."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Rhode Island's Sunday liquor sales window runs from 10 a.m. to 6 p.m., shorter than the state's typical weekday retail hours."
      - "Rhode Island General Laws § 3-8-1 governs holiday and Sunday alcohol sales rules alongside the specific statutes for each license type."
      - "Home brewers in Rhode Island cannot sell or distribute their beer to the public; the 200-gallon limit applies strictly to personal and family use."
      - "Grocery and drug stores in Rhode Island operate under different licensing rules than dedicated liquor stores, affecting what alcohol categories each can carry."

