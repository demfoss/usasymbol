faq:
  - question: "Can you buy alcohol in Rhode Island on Christmas?"
    answer: "No. Rhode Island retail Class A liquor license holders cannot open for alcohol sales on Christmas Day, Thanksgiving Day, or New Year's Day, a rule that applies statewide with no local exception."

  - question: "Can you buy alcohol in Rhode Island on Sundays?"
    answer: "Yes. Rhode Island repealed its ban on Sunday liquor sales, and stores can now sell alcohol on Sundays between 10 a.m. and 6 p.m., a shorter window than the typical weekday hours."

  - question: "How much beer can you legally home brew in Rhode Island?"
    answer: "Up to 200 gallons per calendar year for personal or family use in a household with more than one adult of legal drinking age. That limit drops to 100 gallons if only one adult of legal drinking age lives in the household, and none of it can be sold or distributed to the public."

  - question: "Why do Rhode Island liquor stores get extended hours before a holiday?"
    answer: "State law lets stores sell packaged alcoholic beverages until 11 p.m. the night before a legal holiday, shifting to the Saturday before when the holiday falls on a Monday. It functions as a built-in stock-up window ahead of the mandatory holiday closures on Christmas, Thanksgiving, and New Year's Day."

