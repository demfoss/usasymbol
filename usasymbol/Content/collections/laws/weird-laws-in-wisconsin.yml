  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Wisconsin Laws That Are Myths"
    paragraphs:
      - "Wisconsin's own State Law Library has directly addressed one Strange Wisconsin Laws claim that refuses to go away."
    subsections:
      - subtitle: "Apple pie must legally be served with a slice of cheese"
        status: "Myth"
        text: |
          **Myth:** Wisconsin law requires apple pie to be served with a slice of cheese.

          **Reality:** A real 1935 to 1937 law required restaurants to serve butter and cheese with meals generally, but it never mentioned pie or required cheese on any specific dish. The Wisconsin State Law Library directly debunked this exact claim in 2009.

      - subtitle: "Women can't walk certain streets at night without a male escort"
        status: "Myth"
        text: |
          **Myth:** A Racine ordinance requires women to be accompanied by a man while walking at night.

          **Reality:** No statute or ordinance matches this claim. Nearly identical "women need a male escort" jokes show up recycled across weird-law lists for several other states too, a strong sign of a stock entry rather than a real rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Wisconsin's 1,850 Local Governments Keep Old Rules Alive"
    paragraphs:
      - "Wisconsin recognizes 190 cities, 415 villages, and 1,265 towns, each with real authority to pass and enforce its own local ordinances. With that many separate local governments writing rules independently, and the state's dairy industry deeply tied to its legal history, a statute like the restaurant margarine rule survives not from oversight but because dairy interests have kept it politically relevant even as the original 1895 ban itself faded into history."

