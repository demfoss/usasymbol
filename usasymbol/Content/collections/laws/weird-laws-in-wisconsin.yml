sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Wisconsin That Are Real"
    paragraphs:
      - "Wisconsin banned yellow margarine for 72 years to protect its dairy industry, one of several Unusual Laws in Wisconsin that check out against the actual code and its history."
    highlights:
      - name: "Colored Margarine Was Banned for 72 Years"
        status: "Repealed"
        image: "/images/collections/laws/wisconsin-margarine-ban.jpg"
        description: |
          **Law:** Wisconsin banned manufacturing or selling yellow-colored margarine starting in 1895, treating it as a threat to the dairy industry.

          **Meaning:** For decades, Wisconsin residents who wanted colored margarine had to cross state lines to buy it.

          **Reason:** The ban finally ended in 1967 after state senator Gordon Roseleip, a defender of the law, agreed to a blindfolded taste test comparing butter and margarine and couldn't reliably tell them apart, undercutting his own argument.

      - name: "Restaurants Still Can't Serve Margarine as Butter"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-margarine-restaurant-law.jpg"
        description: |
          **Law:** Restaurants can't serve margarine to a customer who ordered or was billed for butter, unless the customer specifically requests margarine. State institutions like prisons and schools are further restricted from serving margarine at all.

          **Meaning:** The dairy-industry protections from the 19th century never fully disappeared. They just narrowed from an outright ban to a labeling and substitution rule.

          **Reason:** It's a direct descendant of the state's long margarine-versus-butter legal battle, softened over time but never fully repealed given Wisconsin's continued dairy industry ties.

      - name: "Public Buildings Can't Charge to Use the Toilet"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-toilet-fee-law.jpg"
        description: |
          **Law:** The owner or manager of a public building can't charge an admission fee for using a toilet compartment.

          **Meaning:** Pay-per-use restroom stalls, once common in some public buildings, are flatly illegal in Wisconsin.

          **Reason:** The law treats restroom access as a basic public accommodation rather than a chargeable service, closing off a practice that had drawn public complaints elsewhere.

      - name: "Businesses Can't Legally Operate on the Wrong Time Zone"
        status: "Verified"
        image: "/images/collections/laws/wisconsin-time-zone-law.jpg"
        description: |
          **Law:** Operating a business using Eastern, Mountain, or Pacific time instead of Central time is punishable by a fine of $25 to $500 or 10 to 30 days in jail.

          **Meaning:** A business can't unilaterally decide to run on a different clock than the rest of the state, even informally.

          **Reason:** The rule targets confusion from businesses trying to sidestep local daylight saving disputes or align with out-of-state partners, keeping scheduling consistent statewide.

