faq:
  - question: "Was margarine actually illegal in Wisconsin?"
    answer: "Yes, colored margarine specifically. The state banned it from 1895 to 1967, finally repealing the law after a state senator's own blindfolded taste test failed to tell butter and margarine apart."
  - question: "Can a restaurant serve you margarine instead of butter in Wisconsin?"
    answer: "Only if you ask for it. State law bans serving margarine to a customer who ordered or was billed for butter, unless the customer specifically requests margarine."
  - question: "Can a business in Wisconsin operate on Eastern time instead of Central time?"
    answer: "No. State law fines businesses $25 to $500, with possible jail time, for operating on any time zone other than Central."
  - question: "Can a public building charge you to use the restroom in Wisconsin?"
    answer: "No. State law bans charging an admission fee to use a toilet compartment in a public building."
  - question: "Is the apple-pie-with-cheese law in Wisconsin real?"
    answer: "No. This is a well-documented myth. Wisconsin's own State Law Library confirmed in 2009 that no such requirement has ever existed."
  - question: "What is the weirdest real law still on the books in Wisconsin?"
    answer: "The margarine restaurant rule stands out most, since it's the direct, still-active descendant of a dairy-protection fight that started well over a century ago."
