page:
  h1: "Weird Alcohol Laws in Arkansas"

  quick_answer:
    - "Only 44 of Arkansas's 75 counties are fully wet. The rest stay dry or partially dry through a local option system that has run since 1942."
    - "A dry Arkansas county can still have private clubs pouring drinks at restaurants and hotels, even though nobody there can buy a six-pack at a store."
    - "Sunday alcohol sales are not automatic anywhere in Arkansas. Each city or county has to separately vote to allow off-premises sales, typically between 10 a.m. and midnight."

