sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Arkansas That Are Real"
    paragraphs:
      - "Arkansas never adopted one statewide answer to alcohol sales. Instead, the state pushed the decision down to counties and cities, and the patchwork that resulted is still visible on the map today."
    subsections:
      - subtitle: "44 of 75 Counties Are Wet, the Rest Are Not"
        status: "Verified"
        image: "/images/collections/laws/arkansas-wet-dry-counties.jpg"
        anchor_phrases:
          - "44 of 75 counties"
          - "local option"
        text: |
          **Law:** Arkansas counties choose wet or dry status through local option elections, and a petition signed by 38% of a county's registered voters is required just to get the question on the ballot.

          **Meaning:** Even a wet county typically contains dry cities or townships inside its own borders, so the real map is more patchwork than a simple county-by-county line.

          **Reason:** Initiated Act 1 of 1942 handed the choice to individual counties, nine years after every Arkansas county started out automatically wet when statewide Prohibition ended in 1933.
      - subtitle: "Private Clubs Pour Drinks in Dry Counties"
        status: "Verified"
        image: "/images/collections/laws/arkansas-private-club-permit.jpg"
        anchor_phrases:
          - "private club permit"
        text: |
          **Law:** A business in a dry Arkansas county can apply for a private club permit, letting it serve alcohol by the drink even though retail package sales stay illegal countywide.

          **Meaning:** A resident of dry Faulkner or Craighead County cannot buy a six-pack at a gas station, but can still order a drink at a restaurant or hotel holding a private club permit.

          **Reason:** The permit was designed as a release valve for restaurants, hotels, and event venues rather than a backdoor repeal of a county's dry vote, which is why some dry counties still have a large number of active private clubs.
      - subtitle: "Sunday Sales Depend on the City, Not the State"
        status: "Verified"
        image: "/images/collections/laws/arkansas-sunday-sales-local-vote.jpg"
        anchor_phrases:
          - "Sunday sales"
        text: |
          **Law:** Arkansas has no statewide default allowing off-premises Sunday alcohol sales. Cities and counties must separately authorize it, typically within a 10 a.m. to midnight window.

          **Meaning:** A shopper can buy beer on Sunday in Bentonville, Rogers, or Fayetteville, all of which voted yes, while a town a short drive away may still ban Sunday package sales entirely.

          **Reason:** More Arkansas cities have voted in favor of Sunday sales in recent years, a shift retailers point to as lost weekend revenue driving local elections rather than any statewide legislative push.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Arkansas Never Settled on One Statewide Rule"
    paragraphs:
      - "Every Arkansas county started out wet in 1933 when Prohibition ended nationally, but that uniformity lasted less than a decade. Initiated Act 1 of 1942 let counties opt back out, and dozens did, creating the wet-dry map that still holds today. The 38% petition threshold keeps the question from reopening constantly, which is part of why some counties have stayed dry for generations."
      - "Sunday sales tell a newer version of the same story. Rather than a single legislative fix, Arkansas cities have been voting one at a time to allow off-premises sales, with places like Fayetteville and Siloam Springs joining earlier adopters such as Bentonville and Rogers. Each vote only changes that one city, so the map keeps shifting in small pieces instead of all at once."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Every Arkansas county was automatically wet in 1933 at the end of national Prohibition, before Initiated Act 1 of 1942 let counties opt back out."
      - "A 38% voter petition is required just to place a wet or dry question on an Arkansas county ballot."
      - "Faulkner and Craighead counties are both dry for retail sales but still host a large number of private clubs serving drinks."
      - "Cities that adopted Sunday alcohol sales in recent years include Fayetteville, Siloam Springs, Bentonville, Rogers, and Springdale."

