faq:
  - question: "Are there still dry counties in Arkansas?"
    answer: "Yes. Only 44 of Arkansas's 75 counties are fully wet, and the rest are dry or partially dry. Even wet counties often contain dry cities or townships, so the actual pattern is more mixed than a simple county-level map suggests."

  - question: "Can you get a drink in a dry Arkansas county?"
    answer: "Often, yes. Businesses in dry counties can apply for a private club permit that allows serving alcohol by the drink at restaurants and hotels, even though retail package sales remain illegal countywide."

  - question: "What does it take to change a county from dry to wet in Arkansas?"
    answer: "A petition signed by 38% of a county's registered voters is required to place a wet-or-dry question on the ballot. Elections are typically held during November general elections, and results only apply to that county."

  - question: "Can you buy alcohol on Sunday in Arkansas?"
    answer: "It depends on the city. Arkansas has no statewide default allowing Sunday off-premises sales, so each city or county must vote separately to allow it, usually within a 10 a.m. to midnight window. Cities including Fayetteville, Bentonville, and Rogers have adopted it."

