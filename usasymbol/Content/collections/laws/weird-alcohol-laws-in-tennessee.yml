page:
  h1: "Weird Alcohol Laws in Tennessee"

  quick_answer:
    - "Moore County, home to the Jack Daniel's Distillery, is a dry county. Visitors can't buy a drink there, only a souvenir bottle under a 1995 exception."
    - "Tennessee capped beer at 6.3% alcohol by volume for decades, requiring a special license for anything stronger, until a 2017 law raised the limit to 10.1% ABV."
    - "Every Tennessee county and city starts out legally dry. Alcohol sales require a local vote to opt in, which is why only 1 of the state's 95 counties allows no alcohol sales at all today."

