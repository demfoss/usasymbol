sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Tennessee That Are Real"
    paragraphs:
      - "Tennessee's alcohol code runs on local option and licensing thresholds, which is how a distillery can operate in a county where nobody can legally buy a drink."
    highlights:
      - name: "Jack Daniel's Sits in a Dry County"
        status: "Verified"
        image: "/images/collections/laws/tennessee-moore-county-dry.jpg"
        anchor_phrases:
          - "dry county"
          - "1995"
        description: |
          **Law:** Moore County, where the Jack Daniel's Distillery has operated since 1866, remains a dry county under Tennessee's local-option system.

          **Meaning:** Visitors touring the distillery cannot buy a drink there. Since a 1995 local vote, they can buy a souvenir commemorative bottle at the on-site White Rabbit Bottle Shop, which happens to come filled with whiskey.

          **Reason:** Moore County voters have repeatedly declined to go fully wet even as the distillery became the county's largest employer and a major tourist draw.
      - name: "The Old 6.3% Beer Cap Blocked Craft Brewing"
        status: "Verified"
        image: "/images/collections/laws/tennessee-high-gravity-beer-cap.jpg"
        anchor_phrases:
          - "6.3 percent"
          - "10.1 percent"
        description: |
          **Law:** Tennessee capped standard beer sales at 6.3% alcohol by volume for decades, requiring brewers to hold a separate high-gravity license for anything stronger.

          **Meaning:** Many craft and import beers common elsewhere simply weren't sold in Tennessee, or required a special license most retailers skipped.

          **Reason:** A law effective January 1, 2017, raised the limit to 10.1% ABV without the extra license and allowed high-gravity beer into grocery stores for the first time.
      - name: "Counties and Cities Start Out Dry by Default"
        status: "Verified"
        image: "/images/collections/laws/tennessee-local-option-dry-default.jpg"
        anchor_phrases:
          - "dry by default"
          - "local-option"
        description: |
          **Law:** Tennessee's local jurisdictions are legally dry unless voters in that county or city approve alcohol sales through a referendum.

          **Meaning:** Only 1 of Tennessee's 95 counties is completely dry today, but that is the result of decades of individual local-option votes, not a single statewide decision.

          **Reason:** The system traces back to Tennessee's temperance movement, which passed the first prohibition-style law in the United States in 1838, long before the state repealed statewide prohibition after 1933.

  - id: why-moore-county-stays-dry
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Jack Daniel's County Never Went Wet"
    paragraphs:
      - "Tennessee's temperance movement did not start with national Prohibition. State lawmakers passed a prohibition-style law in 1838, decades before the Eighteenth Amendment, and several major temperance organizations trace their roots to Tennessee. That history shaped the local-option system still governing the state: alcohol sales are the exception a community votes in, not the default it starts with."
      - "Moore County kept voting no even after Jack Daniel's became its economic anchor and a nationally known tourist destination. The 1995 workaround, letting the distillery sell whiskey packaged as a souvenir bottle, gave visitors a way to leave with real whiskey without requiring the county to reverse its dry status at the ballot box."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Tennessee passed the first prohibition-style law in the United States in 1838, nearly a century before national Prohibition began."
      - "Wine did not reach Tennessee grocery store shelves until July 1, 2016, after 78 municipalities approved local referendums in November 2014."
      - "The 2017 high-gravity beer law raised Tennessee's ABV limit from 6.3% to 10.1% without requiring brewers to hold a special license."
      - "Moore County's 1995 exception applies only to sales at the distillery itself, not to bars or stores anywhere else in the county."

