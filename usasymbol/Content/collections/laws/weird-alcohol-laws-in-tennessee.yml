faq:
  - question: "Can you buy a drink at the Jack Daniel's Distillery?"
    answer: "Not a drink by the glass. Moore County, where the distillery sits, is a dry county. A 1995 local exception lets the on-site shop sell commemorative bottles that come filled with real whiskey, which is the only way to leave with Jack Daniel's bought on-site."

  - question: "What was Tennessee's high-gravity beer law?"
    answer: "For decades Tennessee capped standard beer at 6.3% alcohol by volume, requiring brewers to hold a separate license to sell anything stronger. A law effective January 1, 2017, raised the cap to 10.1% ABV without that extra license and let high-gravity beer into grocery stores for the first time."

  - question: "Are Tennessee counties dry or wet by default?"
    answer: "Dry. Tennessee's local-option system makes every county and city legally dry unless voters approve alcohol sales through a referendum. Only 1 of the state's 95 counties remains completely dry today, but every wet jurisdiction got there through its own local vote."

  - question: "When could Tennessee grocery stores start selling wine?"
    answer: "July 1, 2016, in the municipalities where voters had approved it. Seventy-eight communities passed local wine-in-grocery-stores referendums in November 2014 after Governor Bill Haslam signed the enabling law earlier that year."

