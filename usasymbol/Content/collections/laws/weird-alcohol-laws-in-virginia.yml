faq:
  - question: "Can you buy liquor at a Virginia grocery store?"
    answer: "No. Distilled spirits sell only through Virginia ABC stores, a state monopoly running since 1934. Beer and wine are different and sell through ordinary grocery stores, gas stations, and other retailers."

  - question: "What is Virginia's food-to-liquor ratio?"
    answer: "A rule requiring restaurants with a mixed-beverage license to earn a set share of revenue from food rather than liquor. It started at 51% food in 1968, shifted to 45% in the 1980s, and as of July 1, 2026, only applies at that full rate to venues under $25,000 in monthly food sales."

  - question: "Did Virginia change its restaurant liquor rules in 2026?"
    answer: "Yes. Governor Abigail Spanberger signed a law creating tiered food-to-beverage ratio requirements effective July 1, 2026. Restaurants earning over $48,000 a month in food sales are now exempt from the ratio entirely, while smaller venues still face reduced or original thresholds."

  - question: "How much money has Virginia's ABC monopoly generated?"
    answer: "More than $9 billion for the state's general fund since Virginia ABC began operating in 1934, according to the agency's own figures, making it one of the state's more significant long-running revenue sources."

