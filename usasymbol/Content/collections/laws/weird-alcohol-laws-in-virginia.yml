sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Virginia That Are Real"
    paragraphs:
      - "Virginia's alcohol code combines a direct state monopoly on spirits with restaurant licensing rules that reach into a business's own sales mix."
    highlights:
      - name: "Virginia Owns Every Store That Sells Spirits"
        status: "Verified"
        image: "/images/collections/laws/virginia-abc-spirits-monopoly.jpg"
        anchor_phrases:
          - "ABC stores"
          - "monopoly"
        description: |
          **Law:** Virginia ABC stores are the only retail outlets where customers can buy distilled spirits, a state monopoly the Virginia Alcoholic Beverage Control Authority has run since 1934.

          **Meaning:** Beer and wine sell through ordinary grocery stores, gas stations, and big-box retailers, but spirits do not, regardless of the retailer's size.

          **Reason:** Virginia ABC has generated more than $9 billion for the state's general fund since 1934, making the monopoly a significant and durable revenue source alongside its regulatory role.
      - name: "Restaurants Had to Sell More Food Than Liquor for Decades"
        status: "Verified"
        image: "/images/collections/laws/virginia-food-beverage-ratio.jpg"
        anchor_phrases:
          - "45%"
          - "Mixed Beverage Act"
        description: |
          **Law:** Virginia's 1968 Mixed Beverage Act required restaurants serving liquor to earn more revenue from food than from alcohol, a ratio that shifted to 45% food and 55% liquor in the 1980s after beer and wine were exempted from the count in 1990.

          **Meaning:** A restaurant licensed to serve cocktails had to track and report its food-versus-liquor sales split to keep that license.

          **Reason:** The rule dates to Prohibition-era concerns about preventing a return to bars that functioned as pure drinking establishments rather than dining rooms.
      - name: "The Food Ratio Is Loosening in 2026"
        status: "Verified"
        image: "/images/collections/laws/virginia-ratio-reform-2026.jpg"
        anchor_phrases:
          - "July 1, 2026"
          - "tiered"
        description: |
          **Law:** A law signed by Governor Abigail Spanberger creates tiered food-to-beverage ratio requirements effective July 1, 2026, exempting restaurants with more than $48,000 in monthly food sales from the ratio entirely.

          **Meaning:** Restaurants with $25,000 to $48,000 in monthly food sales now face just a 30% ratio, while smaller venues under $25,000 still must hit the original 45% threshold.

          **Reason:** Lawmakers built in a study requirement, directing Virginia ABC to report the reform's impact back to the General Assembly in 2027 before deciding whether to go further.

  - id: why-the-ratio-lasted-so-long
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Virginia's Food Ratio Survived for Over 50 Years"
    paragraphs:
      - "Virginia's food-to-beverage ratio traces directly to Prohibition. When the state legalized mixed drinks again through the 1968 Mixed Beverage Act, lawmakers didn't want licensed bars sliding back toward the old saloon model, so they tied the right to serve liquor to a restaurant's food sales. The original 51% food to 49% liquor split shifted to 45/55 in the 1980s, and beer and wine stopped counting toward the ratio at all in 1990."
      - "The rule stuck around for decades even as restaurant owners argued it punished successful bars and cocktail-focused venues that simply didn't sell much food by design. It took until 2026 for the legislature to build in real exceptions, tying the requirement to a restaurant's actual monthly food revenue rather than applying one fixed threshold to every licensee statewide."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Virginia ABC has contributed more than $9 billion to the state's general fund since the agency began operating in 1934."
      - "The original 1968 Mixed Beverage Act set the food ratio at 51% food to 49% liquor, a full 6 points stricter than the 45/55 split most people associate with the rule today."
      - "Beer and wine stopped counting toward Virginia's food-to-beverage ratio in 1990, meaning it has applied only to liquor sales for over three decades."
      - "The 2026 reform requires Virginia ABC to report back to the General Assembly in 2027 on how the new tiered ratio system is working before any further changes."

