page:
  h1: "Weird Alcohol Laws in Virginia"

  quick_answer:
    - "Virginia ABC stores are the only place to buy distilled spirits for off-premise use, a state monopoly running since 1934 that has generated more than $9 billion for the general fund."
    - "Since the 1980s, Virginia restaurants serving liquor have had to earn at least 45% of their revenue from food, a ratio set in 1968 and only significantly eased starting July 1, 2026."
    - "Virginia's mixed-beverage licensing rules require fully opaque clothing on the buttocks, genitals, and areola for anyone on a licensed premises, folding a dress-code rule directly into liquor law."

