        status: "Not Verified"
        text: |
          **Claim:** Marion bans eating a doughnut while walking backward on a public street.

          **Why We Couldn't Verify It:** No Marion municipal code section matching this claim has been located. It appears only on generic listicle round-ups with no citation.

      - subtitle: "Women can't wear patent leather shoes in public in Cleveland"
        status: "Not Verified"
        text: |
          **Claim:** A Cleveland ordinance bans women from wearing patent leather shoes in public.

          **Why We Couldn't Verify It:** No matching Cleveland code section has turned up. The claim circulates only on multi-state listicle sites with no ordinance number.

      - subtitle: "More than five unrelated women can't live in one house"
        status: "Not Verified"
        text: |
          **Claim:** Ohio bans more than five women from sharing a single household.

          **Why We Couldn't Verify It:** No statute matching this claim has been located. It may be a garbled memory of an old zoning rule limiting unrelated occupants, but no exact source has surfaced.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Ohio Laws That Are Myths"
    paragraphs:
      - "Two Strange Ohio Laws claims turn out to be a dressed-up ordinary rule or pure invention once you check for a real citation."
    subsections:
      - subtitle: "It's illegal to get a fish drunk"
        status: "Myth"
        text: |
          **Myth:** Ohio law specifically bans intoxicating a fish.

          **Reality:** No statute uses this language anywhere in the code. The rumor likely grew out of real environmental rules against using substances to stun fish for easier catching, stretched into a much funnier-sounding claim.

      - subtitle: "Leaving chewing gum in public places is illegal in Cleveland"
        status: "Myth"
        text: |
          **Myth:** Cleveland has a specific ban on discarding chewing gum in public.

          **Reality:** No gum-specific ordinance exists. This is an ordinary litter law dressed up to sound like a novelty rule aimed at one particular item.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Ohio's 938 Home Rule Towns Keep Old Statutes Standing"
    paragraphs:
      - "Ohio recognizes 88 counties and 938 separate municipalities, all of which hold home rule authority to pass their own local ordinances independent of the state legislature. With that much local law-writing happening at once, and no centralized office responsible for reviewing every town's code, a statute like the bread-weight law or the Sunday arrest exemption can sit untouched for generations simply because repealing it never becomes anyone's priority."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Ohio's dangerous wild animal law was sponsored by a state senator from Zanesville, the town where the 2011 exotic animal release happened."
      - "The bread-weight law requires measuring an average of at least 25 loaves, not just spot-checking a single one."
      - "The Sunday-and-July-4 arrest exemption still allows arrests for treason, felonies, and breach of the peace."
      - "Ohio has 253 incorporated cities and 673 villages, adding up to 926 separate municipal governments."
      - "The dyed-chicks law also sets a minimum sale age for young poultry, banning the sale of birds younger than four weeks old in small lots."

