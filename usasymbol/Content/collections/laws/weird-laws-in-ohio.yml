faq:
  - question: "Can you really not be arrested on the Fourth of July in Ohio?"
    answer: "For most ordinary matters, yes. State law exempts people from arrest on Sundays and the Fourth of July, though treason, felonies, and breach-of-the-peace arrests are still fully allowed."
  - question: "Is there a minimum legal weight for bread in Ohio?"
    answer: "Yes. Bread must weigh at least 12 ounces, and any heavier loaf has to be sold in exact two-ounce increments, verified using an average of at least 25 loaves."
  - question: "Is it illegal to dye Easter chicks and rabbits in Ohio?"
    answer: "Yes. State law bans dyeing or coloring rabbits, chicks, and ducklings, and also bans selling, raffling, or giving away any animal that's already been colored."
  - question: "Why does Ohio regulate owning tigers and other exotic animals?"
    answer: "The current law followed the 2011 Zanesville tragedy, when dozens of exotic animals, including 18 tigers and 17 lions, were released and shot by deputies after their owner freed them and took his own life."
  - question: "Is the drunk fish law in Ohio real?"
    answer: "No specific statute uses that language. It's unverified folklore, likely stemming from real environmental rules against stunning fish with substances to catch them more easily."
  - question: "What is the weirdest real law still on the books in Ohio?"
    answer: "The Sunday-and-July-4 arrest exemption surprises people most, since it sounds like a joke but is a genuine, still-active provision of the state's civil procedure code."
