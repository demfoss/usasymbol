sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Ohio That Are Real"
    paragraphs:
      - "Most people can't be arrested in Ohio on the Fourth of July, and that's just one of several Unusual Laws in Ohio that hold up once you check the actual code."
    highlights:
      - name: "You Can't Be Arrested on Sundays or the Fourth of July"
        status: "Verified"
        image: "/images/collections/laws/ohio-arrest-exemption.jpg"
        description: |
          **Law:** Ohio law bars arresting most people on Sundays, on the Fourth of July, or during a sitting session of the legislature or a court.

          **Meaning:** Treason, felonies, and breach-of-the-peace arrests are still fully allowed. The exemption only covers ordinary civil-process arrests.

          **Reason:** It's a leftover protection from an era when civil arrest for debt was common, meant to guarantee people a few sacred days a year free from that kind of legal harassment.

      - name: "Bread Loaves Have a Legal Minimum Weight"
        status: "Verified"
        image: "/images/collections/laws/ohio-bread-weight-law.jpg"
        description: |
          **Law:** Bread sold in Ohio must weigh at least 12 ounces, and any loaf heavier than that must be sold in exact two-ounce increments.

          **Meaning:** Bakers can't quietly shrink a loaf to save on ingredients while charging the same price. The weight has to be verifiable using an average of at least 25 loaves.

          **Reason:** It's a consumer-protection measure from an era when bread was a household staple bought by weight, closing off a subtle way bakeries could shortchange customers.

      - name: "You Can't Dye Baby Chicks or Rabbits"
        status: "Verified"
        image: "/images/collections/laws/ohio-dyed-chicks-law.jpg"
        description: |
          **Law:** Dyeing or otherwise coloring rabbits, chicks, or ducklings is banned, along with selling, raffling, or giving away any animal that's been colored.

          **Meaning:** The classic Easter-season practice of selling brightly dyed baby animals is flatly illegal in Ohio, not just discouraged.

          **Reason:** Dyed animals sold as novelty gifts were frequently abandoned once the color faded and the animal grew, and the law closes off the practice at the source.

      - name: "Exotic Animal Owners Must Register and Report Escapes"
        status: "Verified"
        image: "/images/collections/laws/ohio-wild-animal-law.jpg"
        description: |
          **Law:** Ohio requires owners of dangerous wild animals and restricted snakes to register them and immediately notify local law enforcement and the state if one escapes.

          **Meaning:** Private ownership of animals like tigers and lions is tightly regulated, not banned outright, but escapes trigger an immediate legal notification duty.

          **Reason:** The law followed the 2011 Zanesville tragedy, when dozens of exotic animals, including 18 tigers and 17 lions, were released and shot by deputies after their owner freed them and died by suicide.

