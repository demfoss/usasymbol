faq:
  - question: "Is it really illegal to eat fried chicken with a fork in Gainesville?"
    answer: "Yes, technically. The 1961 ordinance requires eating fried chicken with your fingers."
  - question: "Is Georgia's llama liability law real?"
    answer: "Yes. Georgia shields llama activity sponsors and professionals from lawsuits over injuries caused by a llama's normal, unpredictable behavior, mirroring the state's older equine liability law."
  - question: "Does a Georgia sheriff really have to milk a cow?"
    answer: "If the sheriff's office impounds a milk cow or milk goat, state law requires someone to milk it twice a day, along with feeding and watering all impounded livestock at least twice daily."
  - question: "Is the giraffe utility-pole law in Georgia real?"
    answer: "No. It's one of the most recycled fake laws online, appearing on generic weird-law lists for multiple states with identical wording and no ordinance number ever attached."
  - question: "What is the weirdest real law still on the books in Georgia?"
    answer: "The fried chicken ordinance surprises most people. It began as a 1961 marketing stunt and remains technically enforceable."
  - question: "Is it illegal to picnic in a cemetery in Georgia?"
    answer: "No confirmed statewide or citywide ban exists. Columbus does prohibit loud noise and disorderly conduct in its cemeteries, which is likely where the picnic myth got started."
