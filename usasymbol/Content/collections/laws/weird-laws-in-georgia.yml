sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Georgia That Are Real"
    paragraphs:
      - "A city ordinance about eating fried chicken and a state law naming llamas by species anchor the Unusual Laws in Georgia that check out against the actual code. Each one is still technically enforceable today."
    highlights:
      - name: "Gainesville's Fried Chicken Ordinance"
        status: "Verified"
        image: "/images/collections/laws/georgia-gainesville-fried-chicken.jpg"
        description: |
          **Law:** Gainesville, Georgia passed a 1961 ordinance requiring people to eat fried chicken with their fingers, not a knife and fork.

          **Meaning:** Using utensils on fried chicken within city limits technically breaks the law, though it has been enforced exactly once in over 60 years.

          **Reason:** The city council wrote it purely as a publicity stunt to reinforce Gainesville's identity as the self-declared poultry capital of the world. In 2009, police staged a tongue-in-cheek "arrest" of a 91-year-old visitor caught using a fork, and the mayor pardoned her the same day.

      - name: "Georgia's Llama Liability Law"
        status: "Verified"
        image: "/images/collections/laws/georgia-llama-liability.jpg"
        description: |
          **Law:** Georgia shields llama activity sponsors and llama professionals from lawsuits over injuries caused by the ordinary, unpredictable behavior of a llama.

          **Meaning:** Get hurt because a llama spooked, kicked, or reacted unpredictably during a sanctioned activity, and the operator generally can't be sued for it.

          **Reason:** Lawmakers modeled the rule on Georgia's older equine liability law, extending the same protection to llama-related businesses and hobby farms once llama ownership became common enough to need its own legal category.

      - name: "A Sheriff Must Milk an Impounded Cow"
        status: "Verified"
        image: "/images/collections/laws/georgia-sheriff-milk-cow.jpg"
        description: |
          **Law:** Georgia law requires whoever holds impounded livestock to feed and water the animals at least twice a day, and specifically to milk any impounded milk cow or milk goat twice a day.

          **Meaning:** If a sheriff's office impounds a dairy animal during a legal dispute, someone on staff has to actually milk it on schedule, not just feed it.

          **Reason:** The rule exists to prevent animal suffering while livestock sits in custody, since an unmilked dairy animal can develop painful, serious health problems within a single day.

      - name: "Athens Bans the 'Alabama Slingshot' Downtown"
        status: "Verified"
        image: "/images/collections/laws/georgia-athens-slingshot.jpg"
        description: |
          **Law:** Athens-Clarke County ordinance bans using a slingshot, including what the code specifically calls an "Alabama slingshot," anywhere in the downtown area.

          **Meaning:** Carrying or firing any slingshot-type device downtown violates the ordinance regardless of what's loaded into it.

          **Reason:** The rule sits among Athens's general public-safety offenses aimed at projectile weapons in a dense pedestrian downtown, grouping slingshots with other devices capable of hurting a passerby.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Georgia We Couldn't Verify"
    paragraphs:
      - "Not all Real Georgia Laws You Won't Believe hold up once you look for the actual ordinance. A piggyback-ride ban in Atlanta and a banned phrase in Marietta are two of the strangest, and neither has a citation attached anywhere."
    subsections:
      - subtitle: "Giving someone a piggyback ride is illegal in Atlanta"
        status: "Not Verified"
        text: |
          **Claim:** Atlanta bans one man from giving another man a piggyback ride.

          **Why We Couldn't Verify It:** No ordinance number, date, or Atlanta municipal code section matches this description. The claim shows up across weird-law compilations with nearly identical wording and no original source ever cited.

      - subtitle: "Saying 'Oh Boy' in a women's restroom is banned in Marietta"
        status: "Not Verified"
        text: |
          **Claim:** Marietta has an ordinance banning the phrase "Oh Boy" inside women's public restrooms.

          **Why We Couldn't Verify It:** No version of Marietta's city code contains this language, and no explanation for how or why such a rule would exist has ever surfaced. It appears only in internet listicles with no ordinance number or historical record behind it.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Georgia Laws That Are Myths"
    paragraphs:
      - "A giraffe tied to a utility pole is the most repeated Strange Georgia Laws myth of all, and it collapses the same way two other widely shared claims do, under a basic records check."
    subsections:
      - subtitle: "It's illegal to tie a giraffe to a utility pole in Georgia"
        status: "Myth"
        text: |
          **Myth:** Georgia law specifically bans tying a giraffe to a telephone pole or utility pole.

          **Reality:** No such statute exists in Georgia's modern code, and no giraffe-specific ordinance has ever been documented in any Georgia city. The claim appears on generic "weird law" lists for multiple states with the same wording, which is the clearest sign it was never a real rule anywhere.

      - subtitle: "It's illegal to keep a donkey sleeping in a bathtub in Georgia"
        status: "Myth"
        text: |
          **Myth:** A Georgia town makes it unlawful for a donkey to sleep in a bathtub.

          **Reality:** This is a real ordinance, just not a Georgia one. Kingman, Arizona passed it after a 1924 flood swept a merchant's donkey downstream inside an abandoned bathtub. Generic weird-law lists have recycled the Arizona story and reattached it to Georgia and other states with no matching local ordinance anywhere.

      - subtitle: "Picnicking in a Georgia graveyard is illegal"
        status: "Myth"
        text: |
          **Myth:** Having a picnic in a cemetery, such as Magnolia Cemetery in Columbus, breaks Georgia law.

          **Reality:** Columbus does ban loud noise and disorderly conduct in its cemeteries, and a separate Georgia statute bans disruptive conduct within 500 feet of a funeral or memorial service. Neither one mentions picnicking, and a quiet picnic breaks neither rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Georgia's 159 Counties Each Guard Their Own Odd Ordinances"
    paragraphs:
      - "Georgia has 159 counties, second only to Texas, plus hundreds of separate city governments layered on top of them. A 1961 publicity ordinance in Gainesville or a slingshot ban in Athens never gets reviewed alongside any other town's code, because no statewide body is responsible for auditing all of them at once, and a small city council rarely has a reason to revisit a rule nobody is currently breaking."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Gainesville still markets itself as the poultry capital of the world, and the fried chicken ordinance remains part of that branding decades after it was written."
      - "Georgia's llama liability law was built directly on the state's older equine liability statute, extending nearly identical legal language from horses to llamas."
      - "Quitman, Georgia has a separate real ordinance banning chickens, ducks, and geese from running loose on city streets, unrelated to any of the myths about Georgia poultry."
      - "Georgia has 159 counties, more than every state except Texas, despite ranking well below Texas in total land area."
      - "The 2009 Gainesville fried-chicken citation against a 91-year-old visitor was reversed by mayoral pardon on the same day it was issued."

