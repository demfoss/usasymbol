page:
  h1: "Weird Georgia Laws Still on the Books"
  quick_answer:
    - "Four Georgia weird-law claims check out: Gainesville's fried chicken ordinance, a llama liability statute, a sheriff's cow-milking duty, and an Athens slingshot ban."
    - "The fried chicken law was a 1961 publicity stunt that's still technically enforceable, and it was only ever used once, in 2009."
    - "A giraffe tied to a utility pole and a donkey sleeping in a bathtub are myths recycled from other states, with no matching Georgia statute."
  sources:
