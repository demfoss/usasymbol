sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Nebraska That Are Real"
    paragraphs:
      - "A repealed dueling statute and a still-active rule about flying drunk anchor the Unusual Laws in Nebraska that hold up against the real code. Both come with a clear reason behind them."
    highlights:
      - name: "Nebraska Banned Dueling for Over a Century"
        status: "Repealed"
        image: "/images/collections/laws/nebraska-dueling-ban.jpg"
        description: |
          **Law:** Nebraska's criminal code once made it a crime to fight a duel, challenge someone to one, or even carry a challenge on someone else's behalf.

          **Meaning:** Anyone tied to arranging or fighting a duel in Nebraska, as a participant, a second, or a messenger, faced criminal charges under the old statute.

          **Reason:** Lawmakers wrote the ban into the earliest territorial code as frontier states tried to stamp out honor killings settled with pistols. Nebraska finally struck the law from its books in 2026, folding the repeal into a routine cleanup bill rather than giving it a standalone vote.

      - name: "Flying a Plane Drunk Is a Real Crime"
        status: "Verified"
        image: "/images/collections/laws/nebraska-aircraft-dui.jpg"
        description: |
          **Law:** Nebraska makes it illegal to operate or control an aircraft while under the influence of alcohol or drugs, or with a blood alcohol level of .05 percent or higher.

          **Meaning:** Pilots face arrest at a lower blood alcohol threshold than drivers do. Nebraska's legal limit behind the wheel of a car is .08 percent.

          **Reason:** State lawmakers set the tighter aviation limit because one lapse in judgment at altitude carries far higher stakes than one on a highway.

      - name: "You Can't Legally Marry With an Untreated Venereal Disease"
        status: "Verified"
        image: "/images/collections/laws/nebraska-marriage-law.jpg"
        description: |
          **Law:** Nebraska's marriage statute sets the minimum age for both parties at seventeen and separately bars anyone afflicted with a venereal disease from marrying in the state.

          **Meaning:** A county clerk can lawfully deny a marriage license to an applicant diagnosed with a sexually transmitted infection at the time of the application.

          **Reason:** Lawmakers added the health restriction during a public health push to slow the spread of syphilis and gonorrhea through mandatory premarital screening, a practice many states later dropped, though Nebraska never removed the underlying language.

      - name: "Lincoln's Fortune-Telling Ban"
        status: "Struck Down"
        image: "/images/collections/laws/nebraska-fortune-telling-ban.jpg"
        description: |
          **Law:** Lincoln's municipal code once banned telling fortunes for money, naming everything from palm reading and astrology to card reading and "oriental mysteries" specifically.

          **Meaning:** Professional psychics, tarot readers, and astrologers operating in Lincoln could be cited for practicing their trade, regardless of how the reading was performed.

          **Reason:** City officials wrote the ordinance to police fortune-telling as a suspected scam, but a federal appeals court threw it out in 1998, ruling Lincoln never proved the practice caused real harm and that punishing a stated belief violates the First Amendment.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Nebraska We Couldn't Verify"
    paragraphs:
      - "One claim shows up on nearly every Real Nebraska Laws You Won't Believe list: bars supposedly have to keep a pot of soup going alongside the beer taps. Three more join it with the same problem, no statute or ordinance actually says so."
    subsections:
      - subtitle: "Bars must serve soup along with beer"
        status: "Not Verified"
        text: |
          **Claim:** Nebraska bars and taverns are required to keep a pot of soup available any time they're serving beer.

          **Why We Couldn't Verify It:** No statute in the Nebraska Liquor Control Act mentions soup, food service, or anything resembling this requirement, and Class C licenses carry no food mandate at all. The claim shows up on nearly every general listicle of state weird laws with almost identical wording, which usually means nobody traced it back to an actual ordinance.

      - subtitle: "A child burping during a church service can get parents arrested"
        status: "Not Verified"
        text: |
          **Claim:** Parents in Omaha can reportedly be arrested if their child burps or sneezes loudly during a church service.

          **Why We Couldn't Verify It:** Omaha's municipal code has no ordinance addressing burping, sneezing, or noise tied specifically to worship services. General disorderly conduct laws exist, but nothing connects them to this exact scenario, and nobody repeating the claim points to a date or a code section.

      - subtitle: "Lehigh banned selling doughnut holes"
        status: "Not Verified"
        text: |
          **Claim:** The small village of Lehigh supposedly passed an ordinance making it illegal to sell doughnut holes.

          **Why We Couldn't Verify It:** Lehigh is a real but tiny Nebraska village, and no published version of its code contains anything about doughnuts. The claim has no attributed date or source, and it reads like a joke that got repeated until it sounded official.

      - subtitle: "Barbers in Waterloo can't eat onions during work hours"
        status: "Not Verified"
        text: |
          **Claim:** Barbers in Waterloo are said to be banned from eating onions between 7 a.m. and 7 p.m.

          **Why We Couldn't Verify It:** Waterloo's current code turns up no rule about onions, barbershops, or eating on the job. Oddly specific details like the exact time window are what make these claims sound real, but nobody has ever produced the actual text.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Nebraska Laws That Are Myths"
    paragraphs:
      - "Landlocked geography alone should have killed the whale-hunting story, yet it remains the most repeated Strange Nebraska Laws claim online, right alongside a joke about fishing from a giraffe's back."
    subsections:
      - subtitle: "Whale hunting is illegal in Nebraska"
        status: "Myth"
        text: |
          **Myth:** Nebraska has a specific law banning people from hunting or fishing for whales.

          **Reality:** Nebraska Game and Parks fields this question often enough that a staff outreach manager has publicly confirmed no such law exists. The state sits nowhere near an ocean, so lawmakers never had a reason to write one. It's a stock entry that circulates on landlocked-state lists purely for the joke value.

      - subtitle: "Fishing from the back of a giraffe is illegal"
        status: "Myth"
        text: |
          **Myth:** You can't legally fish while sitting on the back of a giraffe in Nebraska.

          **Reality:** Giraffes aren't native or common pets in Nebraska, and no fishing regulation in the state code mentions them. Nearly identical versions of this exact joke appear on weird-law lists for a dozen other states, worded almost the same way every time, a sure sign it was never a real law anywhere.

      - subtitle: "Mothers need a state license to give their daughters a perm"
        status: "Myth"
        text: |
          **Myth:** A mother needs a special state license before she can give her own daughter a home perm.

          **Reality:** Nebraska does license cosmetologists, and giving perms for pay generally falls under that ordinary licensing law, the same rule that covers haircuts and coloring. Nothing in the code singles out mothers, daughters, or family relationships. The myth just dresses up a routine licensing requirement as something stranger.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Nebraska's One-Chamber Legislature Took Until 2026 to Repeal Dueling"
    paragraphs:
      - "Nebraska runs the only one-house, nonpartisan legislature in the country, a structure voters created in 1934 after U.S. Senator George Norris argued the old two-chamber system wasted time and hid deals in secret conference committees. Forty-nine senators now handle every bill alone, with no second chamber to double-check outdated statutes or push a routine repeal forward. That workload is exactly why the dueling ban sat untouched for more than a hundred years until it finally got folded into an unrelated cleanup bill in 2026."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Grand Island's city code still requires 12 hours' notice to the police chief before leading a horse, mule, or ox through parts of downtown."
      - "Kearney's code spells out exactly how a horse-drawn vehicle should park, with the horse positioned at a right angle to the direction of traffic."
      - "Hastings has a standing ordinance against spitting on sidewalks and crosswalks, though the city attorney says he's never seen it enforced."
      - "The Legislature's first unicameral session convened in 1937, ran 98 days, and passed 214 bills for about $103,445 total, a fraction of what a single modern session costs."
      - "A Nebraska law professor who has studied the state's outdated ordinances says several small-town rules were only ever passed as tongue-in-cheek political statements, never meant as serious law."

