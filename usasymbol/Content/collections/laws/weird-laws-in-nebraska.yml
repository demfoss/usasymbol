faq:
  - question: "Is it illegal to marry someone with a venereal disease in Nebraska?"
    answer: "Yes. Nebraska's marriage statute bars anyone with a venereal disease from marrying in the state, alongside a minimum age of seventeen for both parties. The rule dates back to an era of mandatory premarital health screening that most states have since dropped."
  - question: "Is Nebraska's dueling law still on the books?"
    answer: "No. Lawmakers repealed it in 2026 as part of a broader cleanup bill, more than a century after it was first written into the criminal code."
  - question: "Can you get in trouble for flying a plane drunk in Nebraska?"
    answer: "Yes, and the legal threshold is stricter than driving. Nebraska sets the blood alcohol limit for pilots at .05 percent, compared with .08 percent behind the wheel of a car."
  - question: "Was fortune telling ever illegal in Nebraska?"
    answer: "In Lincoln, yes. A city ordinance once banned reading palms, cards, and horoscopes for money, but a federal appeals court struck it down in 1998 for violating the First Amendment."
  - question: "Is it illegal to hunt whales in Nebraska?"
    answer: "No, this one is pure internet myth. Nebraska has no coastline and no statute addressing whale hunting at all."
  - question: "What is the weirdest real law that used to exist in Nebraska?"
    answer: "The dueling ban is a strong candidate. Fighting a duel, challenging someone to one, or even delivering the challenge on someone else's behalf was a crime, and the statute stayed in the code for more than a hundred years before anyone repealed it."
