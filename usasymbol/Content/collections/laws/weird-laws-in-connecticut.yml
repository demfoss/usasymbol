faq:
  - question: "Is it true that a pickle has to bounce to be legal in Connecticut?"
    answer: "No. A 1948 Hartford peddler was fined for selling spoiled pickles, not for failing a bounce test."
  - question: "Is the Connecticut helium balloon law real?"
    answer: "Yes. Releasing ten or more helium balloons within a 24-hour period is a fineable violation under Connecticut law. Lawmakers passed it in 1990 to protect marine life and birds from swallowing balloon debris."
  - question: "Can anyone carry a white cane in Connecticut?"
    answer: "No. Connecticut law reserves a white cane, or a white cane tipped in red, for people who are legally blind. Carrying one without being blind is technically a violation, since drivers are trained to yield automatically to that signal."
  - question: "Is Silly String actually banned in Connecticut?"
    answer: "It's banned in one town. Southington outlawed Silly String at carnivals and parades after the 1995 Apple Harvest Festival, with a $99 fine for violators."
  - question: "What is the weirdest real law still on the books in Connecticut?"
    answer: "Connecticut's dueling ban surprises most people, since dueling died out generations ago. It survives inside the state's military code, written for National Guard members rather than the general public."
  - question: "Where did the Connecticut kissing-on-Sunday myth come from?"
    answer: "A fabricated 1781 pamphlet about Puritan 'Blue Laws' that never existed is the source. The real kissing incident people cite alongside it actually happened in Boston."
