sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Connecticut That Are Real"
    paragraphs:
      - "A statewide balloon ban and a small-town crackdown on Silly String anchor the Unusual Laws in Connecticut that hold up against the actual statute book. Each one still carries a real fine today."
    highlights:
      - name: "The Helium Balloon Release Ban"
        status: "Verified"
        image: "/images/collections/laws/connecticut-balloon-release.jpg"
        description: |
          **Law:** Connecticut bans knowingly releasing ten or more helium or other lighter-than-air balloons into the atmosphere within any 24-hour period.

          **Meaning:** A backyard party with a few stray balloons is fine. Organize a mass release of ten or more, and the violation carries a fine.

          **Reason:** Lawmakers passed the rule in 1990 after testimony about balloons drifting out to sea and killing marine animals and birds that mistook the deflated pieces for food.

      - name: "Only Blind Pedestrians May Carry a White Cane"
        status: "Verified"
        image: "/images/collections/laws/connecticut-white-cane.jpg"
        description: |
          **Law:** Connecticut makes it unlawful for anyone who is not blind to carry or use a white cane, or a white cane tipped in red, on a street or in any public place.

          **Meaning:** The color combination is reserved. Carrying one as a prop or a costume piece in public technically violates the statute.

          **Reason:** Drivers are trained to yield automatically to a white cane. Letting sighted people carry one for fun would undercut the exact signal blind pedestrians depend on to cross safely.

      - name: "Southington's Silly String Ban"
        status: "Verified"
        image: "/images/collections/laws/connecticut-southington-silly-string.jpg"
        description: |
          **Law:** Southington bans the sale, use, or possession of Silly String at carnivals, parades, and other public places, with a $99 fine for violators.

          **Meaning:** Spraying the aerosol string at home is still allowed. The council carved out that exception before passing the final ordinance.

          **Reason:** At the 1995 Apple Harvest Festival, spectators sprayed Silly String on parade marchers, band instruments, and classic cars, stripping paint and littering the street. The town banned it the following year.

      - name: "Connecticut's Dueling Ban"
        status: "Verified"
        image: "/images/collections/laws/connecticut-dueling-law.jpg"
        description: |
          **Law:** Connecticut's Code of Military Justice makes it a punishable offense for anyone subject to the code to fight a duel, arrange one, or fail to report a challenge to the proper authority.

          **Meaning:** The rule applies to state military personnel, mainly the National Guard, not to civilians in general.

          **Reason:** The provision dates to a 1967 rewrite of the state's military code, decades after dueling had already vanished from American life, and it was simply never stripped out.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Connecticut We Couldn't Verify"
    paragraphs:
      - "Not all Real Connecticut Laws You Won't Believe hold up once you look for the actual ordinance. A Hartford street-crossing claim and a Waterbury car-kissing rule are two of the most repeated, and neither has a citation attached anywhere."
    subsections:
      - subtitle: "You can't cross a Hartford street while walking on your hands"
        status: "Not Verified"
        text: |
          **Claim:** Hartford bans crossing a street while walking on your hands.

          **Why We Couldn't Verify It:** No ordinance number, date, or Hartford municipal code section matching this claim has been located. The story appears on dozens of weird-law lists with identical wording and no source ever cited.

      - subtitle: "Kissing in a parked car is illegal in Waterbury"
        status: "Not Verified"
        text: |
          **Claim:** Waterbury has a specific law against kissing inside a parked car.

          **Why We Couldn't Verify It:** Waterbury's municipal code contains no provision matching this description. No date, court case, or enforcement record ties the claim to an actual city ordinance, and the rationale offered for it varies from list to list.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Connecticut Laws That Are Myths"
    paragraphs:
      - "A pickle that must bounce and a husband banned from kissing his wife on Sunday are the two most repeated Strange Connecticut Laws myths, and both collapse under a basic records check."
    subsections:
      - subtitle: "A Connecticut pickle must bounce to be sold legally"
        status: "Myth"
        text: |
          **Myth:** Connecticut law requires a pickle to bounce when dropped, or it cannot legally be sold.

          **Reality:** In 1948, two Hartford peddlers were fined for selling pickles the state food inspector called "unfit for human consumption," and he colorfully said a good pickle should bounce. No statute or regulation ever wrote that standard into law. The Connecticut State Library has documented the case and found no bounce requirement anywhere in the record.

      - subtitle: "A man cannot legally kiss his wife on Sunday in Hartford"
        status: "Myth"
        text: |
          **Myth:** Hartford law forbids a husband from kissing his wife on a Sunday.

          **Reality:** The claim traces to an entirely fabricated 1781 pamphlet describing fictional Puritan "Blue Laws" that never existed in Connecticut. The one real incident often cited alongside it, a sea captain punished for kissing his wife in public on a Sunday, actually happened in Boston in 1656, not Connecticut.

      - subtitle: "It's illegal to walk backward after sunset in Connecticut"
        status: "Myth"
        text: |
          **Myth:** Walking backward after sunset is against the law somewhere in Connecticut.

          **Reality:** No town or state statute names this restriction, and no version of the claim ever attaches a specific city, date, or ordinance number. Nearly identical backward-walking claims are recycled across weird-law lists for other states with the same missing details.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Connecticut's 169 Towns Each Keep Their Own Odd Rules"
    paragraphs:
      - "Connecticut abolished functioning county government back in 1960, leaving all 169 towns and cities to run their own home-rule charters with no county board sitting above them to review local code. Southington's Silly String ordinance and Hartford's obscure street rules simply have no larger body ever tasked with revisiting them, so they sit untouched unless a specific incident forces a town council to act."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Southington still enforces its Silly String ban every year during the Apple Harvest Festival, the same event that prompted the ordinance in 1996."
      - "Connecticut's balloon-release law was one of the first state-level restrictions of its kind in the country when it passed in 1990."
      - "Connecticut is one of only a few states with no functioning county government, splitting all local authority among 169 individual towns instead."
      - "The white cane statute doesn't just protect blind pedestrians. It also bars sighted people from carrying one, so drivers can trust the signal without question."
      - "Connecticut's dueling ban lives inside the state's military code, not its general criminal statutes, because it was written for National Guard members specifically."

