sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Delaware That Are Real"
    paragraphs:
      - "Delaware keeps alcohol sales concentrated in dedicated package stores far more tightly than most nearby states, and one of its oldest beach towns still carries the temperance roots that shaped it."
    subsections:
      - subtitle: "No Alcohol in Grocery, Convenience, or Gas Stations"
        status: "Verified"
        image: "/images/collections/laws/delaware-package-store-only.jpg"
        anchor_phrases:
          - "grocery stores, convenience stores, or gas stations"
        text: |
          **Law:** Delaware restricts sales of wine, spirits, and full-strength beer exclusively to licensed package stores, prohibiting alcohol sales in grocery stores, convenience stores, and gas stations entirely.

          **Meaning:** A quick beer run in Delaware always means a separate stop at a dedicated liquor store, never a stop already built into a grocery or gas run.

          **Reason:** The rule keeps Delaware's package store network as the sole retail channel for alcohol, a structural choice that also underpins the state's separate Sunday-hours and pricing rules for those same stores.
      - subtitle: "Happy Hour Specials Are Illegal Statewide"
        status: "Verified"
        image: "/images/collections/laws/delaware-happy-hour-ban.jpg"
        anchor_phrases:
          - "happy hour"
        text: |
          **Law:** Delaware forbids free or discounted drinks, including two-for-one offers, making it one of roughly a dozen states that bans happy hour outright rather than merely limiting it.

          **Meaning:** A bar can still offer a fixed-price drink special or a food-and-drink combo deal, but not a time-limited discount window built specifically around alcohol.

          **Reason:** Delaware adopted its ban during the same 1980s wave of anti-drunk-driving legislation that produced similar bans in Massachusetts and several other states, after regulators linked drink specials to higher rates of impaired driving.
      - subtitle: "A Beach Town Still Carries Its Dry Founding"
        status: "Verified"
        image: "/images/collections/laws/delaware-rehoboth-dry-founding.jpg"
        anchor_phrases:
          - "Rehoboth Beach"
        text: |
          **Law:** Rehoboth Beach was founded in 1873 on land set aside by a Methodist minister for a Christian camp meeting ground that explicitly prohibited alcohol sales by an 1881 amendment, and the town's current code still bans drinking on the boardwalk, beach, parking lots, and public streets.

          **Meaning:** A visitor can legally buy a drink inside a Rehoboth Beach restaurant or bar but cannot legally carry that drink out onto the boardwalk or sand.

          **Reason:** The town's temperance-era founding as an explicitly alcohol-free religious retreat shaped its earliest ordinances, and the modern open-container restrictions carry that same public-space boundary forward even as the town itself became a major commercial beach destination.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Delaware Keeps Alcohol Inside Dedicated Stores"
    paragraphs:
      - "Delaware's package-store-only rule concentrates every alcohol sale into a single, easily licensed retail category rather than spreading it across grocery and gas station counters. That structure makes the rest of Delaware's alcohol code, from Sunday hours to special sale-day licensing fees, easier to enforce because there is only one type of storefront to police."
      - "Rehoboth Beach's boardwalk and beach restrictions trace back even further than the state's package store rule, to an 1881 amendment written by a Methodist camp meeting association that had no interest in alcohol being sold anywhere near its grounds. The town grew far beyond that religious origin, but the line it drew between indoor drinking and public outdoor drinking never fully disappeared from the code."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Delaware package stores can sell alcohol on Sundays only between noon and 8 p.m., and only if the store pays a $500 biennial fee for a special Sunday license."
      - "Delaware package stores are typically open until 1 a.m. Monday through Saturday, far later than their Sunday closing time."
      - "Delaware allows licensed third-party delivery services to deliver alcohol as of 2025, but retailers still cannot deliver it directly themselves."
      - "A Women's Christian Temperance Union fountain, erected in Rehoboth Beach in 1929, still stands as a physical marker of the town's dry, camp-meeting origins."

