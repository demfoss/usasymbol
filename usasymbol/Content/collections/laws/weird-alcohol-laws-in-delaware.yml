page:
  h1: "Weird Alcohol Laws in Delaware"

  quick_answer:
    - "Delaware bans the sale of beer, wine, and spirits in grocery stores, convenience stores, and gas stations. Every bottle has to come from a licensed package store instead."
    - "Delaware is one of roughly a dozen states that outlaws happy hour outright, banning free drinks, two-for-one deals, and any special that runs only part of the day."
    - "Rehoboth Beach was founded in 1873 as a Methodist camp meeting ground that banned alcohol sales by 1881, and the town still restricts drinking on its boardwalk, beach, and public streets today."

