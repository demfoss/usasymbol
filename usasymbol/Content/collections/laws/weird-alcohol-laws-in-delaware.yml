faq:
  - question: "Can you buy beer at a gas station in Delaware?"
    answer: "No. Delaware restricts wine, spirits, and full-strength beer sales exclusively to licensed package stores, prohibiting alcohol sales in grocery stores, convenience stores, and gas stations across the state."

  - question: "Is happy hour illegal in Delaware?"
    answer: "Yes. Delaware bans free or discounted drink specials, including two-for-one offers, making it one of roughly a dozen states with an outright happy hour ban. Bars can still offer fixed-price specials or food-and-drink combos instead."

  - question: "Can you drink alcohol on the Rehoboth Beach boardwalk?"
    answer: "No. Rehoboth Beach ordinances ban alcohol consumption on the boardwalk, beach, parking lots, and public streets, a restriction that traces back to the town's 1873 founding as a Methodist camp meeting ground that prohibited alcohol sales by 1881."

  - question: "What are Delaware's Sunday alcohol sale hours?"
    answer: "Package stores can sell alcohol on Sundays only between noon and 8 p.m., and only after paying a $500 biennial fee for a special Sunday license. Many smaller independent shops choose to close early or stay closed on Sundays entirely."

