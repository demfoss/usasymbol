  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange South Dakota Laws That Are Myths"
    paragraphs:
      - "One Strange South Dakota Laws claim about cheese factories turns out to belong to a completely different state."
    subsections:
      - subtitle: "It's illegal to fall asleep in a cheese factory"
        status: "Myth"
        text: |
          **Myth:** South Dakota bans falling asleep in a cheese factory.

          **Reality:** No South Dakota statute matches this claim. A genuinely real version of this law exists in Illinois, banning sleeping in food-prep areas like bakeries and cheese factories, and the claim appears to have been misattributed to South Dakota over time.

      - subtitle: "Horses must wear pants to enter a fountain or hotel"
        status: "Myth"
        text: |
          **Myth:** South Dakota law requires horses to wear pants before entering a fountain or a Sioux Falls hotel.

          **Reality:** No ordinance matches this claim. Nearly identical "animal must wear pants" jokes show up attached to different towns across several other states, a strong sign of a recycled internet gag rather than a real law.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why South Dakota's 40-Day Session Leaves Old Rules Alone"
    paragraphs:
      - "South Dakota's Legislature is constitutionally capped at 40 legislative days in odd years and just 35 in even years, one of the shortest maximum session lengths of any state. With so little floor time available for current priorities alone, a narrow statute like the mink-den rule almost never becomes pressing enough to spend a legislative day repealing, no matter how outdated it starts to feel."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "South Dakota's 1983 trust law change is credited with turning the state into the top jurisdiction in the country for dynasty trusts."
      - "The mink and beaver den law also bans using poison, gas, or smokers to capture the animals, not just physically digging out a den."
      - "South Dakota's legal fireworks window narrows further if a county declares extreme fire danger, even during the normal summer season."
      - "South Dakota's 40-day session cap has applied since a 2008 constitutional amendment set the current limit."
      - "The cheese-factory sleeping law that's often misattributed to South Dakota is a genuinely real statute, just in Illinois."

