sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in South Dakota That Are Real"
    paragraphs:
      - "South Dakota rewrote the rules for trust law nationwide in 1983, one of several Unusual Laws in South Dakota that check out against the actual code and its history."
    highlights:
      - name: "Trusts Can Legally Last Forever"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-dynasty-trust.jpg"
        description: |
          **Law:** South Dakota abolished the rule against perpetuities in 1983, removing the traditional legal limit on how long a trust could exist.

          **Meaning:** A trust set up under South Dakota law can legally continue for generations, passing wealth down indefinitely without being forced to dissolve.

          **Reason:** It was the first state in the country to make this change, and the move deliberately built South Dakota's reputation as the national destination for "dynasty trusts," drawing wealthy families and estate planners from across the country.

      - name: "You Can't Disturb a Mink Den or Beaver House"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-mink-den.jpg"
        description: |
          **Law:** Digging, disturbing, or molesting a mink den or beaver house to capture the animal inside is banned, along with using dogs, poison, gas, or smokers to hunt mink, muskrats, or beavers.

          **Meaning:** Legal trapping methods are limited to approved techniques. Flushing an animal out of its den by force isn't one of them.

          **Reason:** The rule protects fur-bearing animal populations from destructive hunting methods that damage habitat along with the target animal.

      - name: "Consumer Fireworks Only Have a Two-Week Window"
        status: "Verified"
        image: "/images/collections/laws/south-dakota-fireworks-law.jpg"
        description: |
          **Law:** Using consumer fireworks outside the period from June 27 through the first Sunday after July 4, or December 28 through January 1, is a Class 2 misdemeanor.

          **Meaning:** Counties can further restrict or ban fireworks entirely during extreme fire danger, even within that already-narrow window.

          **Reason:** South Dakota's dry summer conditions create real wildfire risk, and narrowing the legal fireworks season to two defined windows gives fire officials a clear enforcement line.

