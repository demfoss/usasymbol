faq:
  - question: "Can a trust really last forever in South Dakota?"
    answer: "Yes. South Dakota abolished the rule against perpetuities in 1983, the first state to do so, allowing trusts to continue indefinitely instead of being forced to dissolve after a set period."
  - question: "Is it illegal to dig out a mink den in South Dakota?"
    answer: "Yes. State law bans disturbing a mink den or beaver house to capture the animal inside, along with using dogs, poison, gas, or smokers for the same purpose."
  - question: "When can you legally use fireworks in South Dakota?"
    answer: "Only during two set windows: June 27 through the first Sunday after July 4, and December 28 through January 1. Counties can restrict fireworks further during extreme fire danger."
  - question: "Is the cheese factory sleeping law a real South Dakota rule?"
    answer: "No. The claim is a myth. A genuinely real version of this law exists in Illinois, not South Dakota."
  - question: "Do horses need to wear pants in South Dakota?"
    answer: "No. This is a recycled internet joke with no ordinance behind it, similar to nearly identical claims made about towns in other states."
  - question: "What is the weirdest real law still on the books in South Dakota?"
    answer: "The 1983 trust law stands out most, since it sounds like a minor technical change but actually built South Dakota's national reputation as the place to set up a trust that never has to end."
