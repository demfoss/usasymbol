page:
  h1: "Weird Alcohol Laws in Kentucky"

  quick_answer:
    - "Bourbon County, the place bourbon whiskey takes its name from, has stayed a dry county for decades, even as distillers there keep making and exporting it."
    - "Kentucky's 1891 local option law lets any county, city, or precinct vote itself wet, dry, or 'moist,' a middle category with limited alcohol sales, resulting in a genuine patchwork of rules."
    - "Wine can be sold in a Kentucky pharmacy under the right license, but grocery stores need a separate entrance and age-restricted staffing to sell it, a much higher bar."

