faq:
  - question: "Is Bourbon County, Kentucky, actually dry?"
    answer: "Yes. Bourbon County, the county that gave bourbon whiskey its name, is a dry county under local option law, meaning stores there cannot sell alcohol even though distilleries in the county legally produce and export bourbon."

  - question: "What does a 'moist' county mean in Kentucky?"
    answer: "A moist county falls between wet and dry status, typically allowing limited alcohol sales, such as by-the-drink service at licensed restaurants, without permitting full retail sales the way a wet county does. Kentucky currently has about 49 moist counties out of 120."

  - question: "How many dry counties does Kentucky have?"
    answer: "Kentucky has roughly 39 dry counties as of the most recent counts, down from a larger number decades ago, alongside about 32 wet counties and 49 moist counties operating under partial rules."

  - question: "Why can pharmacies sell wine in Kentucky but not all grocery stores?"
    answer: "Pharmacies can sell wine under a license without the extra requirements grocery stores face, which include a separate store entrance for the alcohol section and rules against staffing it with employees under 21. The distinction dates to Prohibition-era retail categories that Kentucky never fully updated."

