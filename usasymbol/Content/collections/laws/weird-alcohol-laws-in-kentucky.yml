sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Kentucky That Are Real"
    paragraphs:
      - "Kentucky handed alcohol decisions down to the county level over a century ago, and the resulting patchwork produces contradictions that still surprise people, starting with the county that gave bourbon its name."
    highlights:
      - name: "Bourbon County Itself Has Stayed a Dry County"
        status: "Verified"
        image: "/images/collections/laws/kentucky-bourbon-county-dry.jpg"
        anchor_phrases:
          - "Bourbon County"
        description: |
          **Law:** Bourbon County, Kentucky, the county whose name became attached to bourbon whiskey, is a dry county under county-wide prohibition on alcohol sales.

          **Meaning:** A distillery in Bourbon County can legally produce and ship bourbon out of state, but a store inside the county cannot sell a bottle of it over the counter.

          **Reason:** Local option votes decided county alcohol status independently of the bourbon industry's growth, and Bourbon County's dry status simply never changed even as the whiskey named after it became a global export.
      - name: "Counties Vote Themselves Wet, Dry, or 'Moist'"
        status: "Verified"
        image: "/images/collections/laws/kentucky-wet-dry-moist-counties.jpg"
        anchor_phrases:
          - "wet"
          - "dry"
          - "moist"
        description: |
          **Law:** Under the local option framework in KRS Chapter 242, dating to a 1891 constitutional amendment, each of Kentucky's 120 counties, cities, and even precincts can vote to be wet, dry, or "moist," a middle category allowing limited alcohol sales such as by-the-drink service at restaurants.

          **Meaning:** Kentucky has no single statewide answer to whether alcohol is legal; the honest answer depends on which county line you're standing behind.

          **Reason:** Lawmakers built local option into the state constitution to let communities set their own alcohol policy rather than impose one rule statewide, and the system has produced a genuine mix of dry, wet, and moist jurisdictions ever since.
      - name: "Wine Sells in Pharmacies More Easily Than in Grocery Stores"
        status: "Verified"
        image: "/images/collections/laws/kentucky-pharmacy-wine-sales.jpg"
        anchor_phrases:
          - "pharmacies"
        description: |
          **Law:** Kentucky allows wine sales in licensed pharmacies, while grocery stores need a separate store entrance for the alcohol section and must keep employees under 21 out of that area to sell wine.

          **Meaning:** A pharmacy counter can sell a bottle of wine more simply than a full-size grocery store can, despite the grocery store selling far more food and household goods overall.

          **Reason:** The rule traces back to Prohibition-era carveouts that treated pharmacies differently from general retailers, an assumption that never got updated even as pharmacies and supermarkets both became everyday retail stops.

  - id: why-bourbon-county-stayed-dry
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Home of Bourbon Never Went Wet"
    paragraphs:
      - "Bourbon County's dry status is not a myth or a joke, fact-checkers have confirmed it repeatedly because the claim sounds too ironic to be true. Kentucky's constitution has let counties set their own alcohol policy since 1891, and that vote has always been separate from where a product is made or exported. A distillery pays no attention to county lines when it ships bottles nationwide, so Bourbon County's whiskey industry grew for export while the local retail market for a drink stayed closed."
      - "Changing a county's wet or dry status requires another local option election, and dry counties often stay dry simply because no local campaign pushes hard enough to force a new vote. Kentucky now counts roughly 39 dry counties out of 120, down from a much higher share decades ago, but Bourbon County has remained on the dry list through every round of changes elsewhere in the state."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Kentucky's local option system has operated since an 1891 constitutional amendment, making it one of the oldest alcohol local-control laws in the country."
      - "Of Kentucky's 120 counties, roughly 39 are dry, 32 are wet, and 49 are 'moist' under the most recent counts."
      - "Bourbon County's dry status has been fact-checked and confirmed real multiple times because the irony makes people assume it's an urban legend."
      - "A Kentucky Supreme Court justice described the state's alcohol statutes in 1985 as a 'maze of obscure statutory language,' a description still often quoted today."

