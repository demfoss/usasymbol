page:
  h1: "Weird Alcohol Laws in Indiana"

  quick_answer:
    - "Indiana is the only state that regulates carryout beer by temperature. Gas stations and convenience stores cannot sell beer that has been iced or cooled."
    - "Indiana banned all Sunday carryout alcohol sales from statehood in 1816 until repealing the ban in 2018, making it the last state with a full statewide Sunday ban."
    - "Liquor licenses in Indiana are capped by local population under a quota system, similar to the approach several other Midwestern states use."

