faq:
  - question: "Why can't you buy cold beer at Indiana gas stations?"
    answer: "Indiana Code § 7.1-5-10-11 prohibits beer dealer's permit holders, including gas stations and convenience stores, from selling carryout beer that has been iced or cooled. Liquor stores and bars hold different permits and can sell cold beer, so the restriction only hits certain retailers."

  - question: "When did Indiana allow Sunday alcohol sales?"
    answer: "Indiana repealed its statewide Sunday carryout alcohol ban in 2018, ending a restriction that had been in place since statehood in 1816. Indiana had been the last state with a complete Sunday carryout ban covering beer, wine, and liquor."

  - question: "Is Indiana's cold beer law still enforced?"
    answer: "Yes, the law remains on the books despite repeated repeal attempts. A 2017 Ball State University study found around 61% public support for allowing cold carryout beer sales everywhere, but the Indiana Association of Beverage Retailers lobbied successfully to keep the restriction in place."

  - question: "How does Indiana limit the number of liquor licenses?"
    answer: "The Indiana Alcohol and Tobacco Commission ties the number of available liquor licenses in a given area to local population under a quota system, which caps how many bars and restaurants can hold a license at once regardless of demand."

