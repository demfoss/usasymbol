sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Indiana That Are Real"
    paragraphs:
      - "Indiana held onto some of the oldest alcohol restrictions in the country longer than almost any other state, and one of the strangest ones is still on the books today."
    highlights:
      - name: "Gas Stations Cannot Sell Cold Beer to Go"
        status: "Verified"
        image: "/images/collections/laws/indiana-cold-beer-ban.jpg"
        anchor_phrases:
          - "cold beer"
          - "iced or cooled"
        description: |
          **Law:** Indiana Code § 7.1-5-10-11 makes it a Class B misdemeanor for a beer dealer's permit holder, which covers gas stations and convenience stores, to sell carryout beer that was iced or cooled before or at the time of sale.

          **Meaning:** A gas station can stock beer in a cooler for display, but it legally cannot sell that same chilled bottle for someone to take home; only room-temperature carryout beer is allowed there.

          **Reason:** The rule dates to a 1941 amendment of the Liquor Control Act and survives today mainly because liquor stores, which can sell cold beer, have successfully lobbied against repeal for decades.
      - name: "Sunday Carryout Alcohol Sales Were Banned From 1816 to 2018"
        status: "Verified"
        image: "/images/collections/laws/indiana-sunday-sales-history.jpg"
        anchor_phrases:
          - "1816"
          - "2018"
        description: |
          **Law:** Indiana banned Sunday carryout sales of beer, wine, and liquor from statehood in 1816 until the legislature repealed the ban in 2018.

          **Meaning:** For 202 years, buying a six-pack or a bottle of wine to take home on a Sunday was flatly illegal anywhere in Indiana.

          **Reason:** Indiana was the only state with a complete statewide Sunday carryout ban by the time it repealed the law, even though public support for repeal polled around 61% for years before lawmakers finally acted.
      - name: "Bar Licenses Are Capped by Local Population"
        status: "Verified"
        image: "/images/collections/laws/indiana-license-quota.jpg"
        anchor_phrases:
          - "quota"
        description: |
          **Law:** Indiana limits the number of liquor licenses available in a given area based on a population-tied quota system administered by the Indiana Alcohol and Tobacco Commission.

          **Meaning:** A town cannot approve unlimited bar or restaurant liquor licenses; the local population sets a ceiling on how many exist at once.

          **Reason:** The quota keeps the number of license holders from outpacing demand in smaller communities, which also means existing licenses can carry real market value when a local quota is full.

  - id: why-cold-beer-stays-banned
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Indiana Never Fixed Its Cold Beer Law"
    paragraphs:
      - "Indiana's cold beer restriction started in 1941 as an amendment to the state's Liquor Control Act, aimed at drawing a clear line between beer dealer permits held by grocery and convenience stores and the broader permits held by liquor stores and taverns. The distinction let liquor stores sell cold beer while gas stations could not, and that split never went away."
      - "Convenience store operators have pushed to repeal the rule for years, and a 2017 Ball State study found roughly 61% public support for allowing cold carryout beer everywhere. The Indiana Association of Beverage Retailers, representing liquor stores that benefit from the current split, lobbied successfully against the change, and the state Senate voted the repeal down that same year."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Indiana Code § 7.1-5-10-11 applies only to beer dealer's permit holders, not to liquor stores or bars, which is why the cold beer rule only affects certain retailers."
      - "Indiana's 2018 repeal of the Sunday carryout ban ended the longest-running statewide alcohol restriction of its kind in the country."
      - "A 2017 Ball State University study found about 61% public support for repealing the cold beer law, yet the legislature kept it in place."
      - "Liquor stores and bars in Indiana can sell cold beer because they hold different permit types than gas stations and convenience stores."

