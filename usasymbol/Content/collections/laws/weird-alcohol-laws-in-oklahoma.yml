page:
  h1: "Weird Alcohol Laws in Oklahoma"

  quick_answer:
    - "Oklahoma capped grocery-store beer at 3.2% alcohol by weight, roughly 4% by volume, from 1933 until a statewide reform ended the rule in 2018."
    - "Voters approved State Question 792 in 2016, and by October 2018 grocery and convenience stores could sell wine and full-strength chilled beer up to 8.99% ABV every day of the week."
    - "Oklahoma's last dry counties, where liquor-by-the-drink had stayed banned since 1959, voted to allow it in 2018, the same year the broader reform took effect."

