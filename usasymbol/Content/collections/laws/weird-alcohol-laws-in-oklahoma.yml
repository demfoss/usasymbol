faq:
  - question: "Why did Oklahoma grocery stores only sell weak beer for so long?"
    answer: "Oklahoma never ratified the 21st Amendment when Prohibition ended in 1933, so the state legalized only 3.2% alcohol-by-weight beer, calling it non-intoxicating, while stronger beer stayed limited to liquor stores. That cap lasted until a 2018 reform allowed full-strength beer in grocery and convenience stores."

  - question: "When did Oklahoma allow wine in grocery stores?"
    answer: "State Question 792, approved by voters in 2016, took effect October 1, 2018, letting grocery and convenience stores sell wine up to 15% ABV and chilled beer up to 8.99% ABV every day of the week, including Sunday."

  - question: "Does Oklahoma still have dry counties?"
    answer: "No. The last counties that had banned liquor-by-the-drink since 1959 voted to allow it in 2018, ending dry-county restrictions on mixed drinks statewide, though individual cities and counties can still hold their own local option votes on other alcohol rules."

  - question: "What changed in Oklahoma's 2018 alcohol law reform?"
    answer: "The reform let grocery and convenience stores sell full-strength wine and chilled beer for the first time, allowed liquor stores to refrigerate beer and sell non-alcohol items, and coincided with the last dry counties voting to permit liquor-by-the-drink sales."

