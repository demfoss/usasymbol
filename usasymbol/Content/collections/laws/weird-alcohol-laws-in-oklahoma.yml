sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Alcohol Laws in Oklahoma That Are Real"
    paragraphs:
      - "Oklahoma held onto some of the country's tightest alcohol restrictions well into the 2010s, then unwound most of them within the space of two years."
    highlights:
      - name: "Grocery Beer Was Capped at 3.2% for 85 Years"
        status: "Verified"
        image: "/images/collections/laws/oklahoma-3-2-beer-law.jpg"
        anchor_phrases:
          - "3.2% alcohol by weight"
        description: |
          **Law:** Under the Oklahoma Beer Act of 1933, grocery and convenience stores could only sell "low-point" beer capped at 3.2% alcohol by weight, roughly 4% by volume, until a 2018 reform allowed full-strength beer in those same stores.

          **Meaning:** For most of the twentieth century, a six-pack from an Oklahoma grocery store was measurably weaker than the same brand sold in a liquor store.

          **Reason:** Oklahoma refused to ratify the 21st Amendment when Prohibition ended nationally in 1933, and the 3.2% cap let the state legalize a limited category of beer as "non-intoxicating" without fully repealing statewide prohibition.
      - name: "State Question 792 Rewrote Retail Alcohol Sales in 2018"
        status: "Verified"
        image: "/images/collections/laws/oklahoma-sq792-reform.jpg"
        anchor_phrases:
          - "State Question 792"
        description: |
          **Law:** Following voter approval of SQ 792 in 2016, Oklahoma grocery and convenience stores gained the right, starting October 1, 2018, to sell wine up to 15% ABV and chilled high-point beer up to 8.99% ABV, every day including Sunday, from 6 a.m. to 2 a.m.

          **Meaning:** A single 2018 law change let full-strength beer and wine reach store shelves that had been legally restricted to weak beer for generations.

          **Reason:** Oklahomans voted for the reform to modernize alcohol retail after decades of complaints that the old system pushed shoppers between separate stores for beer that differed only by a few percentage points of alcohol.
      - name: "Oklahoma's Last Dry Counties Went Wet in 2018"
        status: "Verified"
        image: "/images/collections/laws/oklahoma-dry-county-repeal.jpg"
        anchor_phrases:
          - "last dry counties"
        description: |
          **Law:** Fourteen Oklahoma counties had banned liquor-by-the-drink sales since 1959, and the final holdouts voted to allow it in 2018, ending dry-county restrictions statewide.

          **Meaning:** A restaurant that could only serve 3.2% beer under the old county rule can now serve a full cocktail menu if voters in that county approved the change.

          **Reason:** Oklahoma became the 49th state to allow liquor-by-the-drink at all back in 1984, and it took another 34 years for every individual county to catch up to that statewide option through local votes.

  - id: why-the-line-holds
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Oklahoma Took So Long to Change Its Beer Law"
    paragraphs:
      - "Oklahoma's 3.2% beer cap lasted as long as it did because the state built its entire post-Prohibition alcohol system around avoiding a full repeal of statewide prohibition. Refusing to ratify the 21st Amendment in 1933 let lawmakers legalize a narrow category of low-alcohol beer without ever fully endorsing the broader alcohol market other states adopted."
      - "That patchwork approach meant real reform needed a statewide vote rather than a simple legislative fix. Once State Question 792 passed in 2016, the two-year window before implementation gave grocery stores, distributors, and county governments time to adjust, which is why the 3.2% cap and the last dry counties both fell within roughly the same stretch of 2018."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Oklahoma's 1917 Bone-Dry Law made it illegal to even possess liquor received from a common carrier, with penalties up to $500 and six months in jail."
      - "3.2% beer measured by weight equals roughly 4% alcohol by volume, a distinction that confused generations of Oklahoma shoppers comparing labels."
      - "Oklahoma became the 49th state to allow liquor-by-the-drink in 1984, when voters approved State Question 563."
      - "Liquor stores gained new flexibility under the 2018 reform too, including the right to refrigerate beer and sell items like limes and corkscrews alongside alcohol."

