sections:
  - id: named-after-people-list
    icon: "fa-solid fa-signature"
    style: law-cards
    title: "State Capitals Named After Real People"
    snippet_paragraph: "These ten capitals carry the names of explorers, generals, fur traders, and royals. None of them held the U.S. presidency."
    highlights:
      - name: "Austin, Texas"
        image: "/images/collections/capitals/named-after-people/austin-texas.jpg"
        description: "**Named for:** Stephen F. Austin, 1839. The Texas Congress passed a bill in May 1838 requiring that any newly chosen capital site be named Austin, honoring the recently deceased 'Father of Texas' who led the first legal American settlement in the region. The village of Waterloo was renamed Austin the moment it was picked as the site."
        anchor_phrases: ["Stephen F. Austin"]
      - name: "Raleigh, North Carolina"
        image: "/images/collections/capitals/named-after-people/raleigh-north-carolina.jpg"
        description: "**Named for:** Sir Walter Raleigh, 1792. North Carolina's legislature named its newly platted capital after the English explorer who financed the failed Roanoke Colony in the 1580s. Raleigh never set foot in North Carolina; the honor came two centuries after his death."
        anchor_phrases: ["Sir Walter Raleigh"]
      - name: "Bismarck, North Dakota"
        image: "/images/collections/capitals/named-after-people/bismarck-north-dakota.jpg"
        description: "**Named for:** Otto von Bismarck, 1873. The Northern Pacific Railway renamed the townsite of Edwinton to Bismarck to court German investment in its transcontinental line. Bismarck sent a thank-you note but no money. It remains the only U.S. state capital named for a foreign statesman."
        anchor_phrases: ["Otto von Bismarck"]
      - name: "Denver, Colorado"
        image: "/images/collections/capitals/named-after-people/denver-colorado.jpg"
        description: "**Named for:** James W. Denver, 1858. Land speculator William Larimer Jr. named the townsite after the sitting governor of Kansas Territory, hoping the flattery would help it become a county seat. Denver did not visit the city bearing his name until 1882."
        anchor_phrases: ["James W. Denver"]
      - name: "Pierre, South Dakota"
        image: "/images/collections/capitals/named-after-people/pierre-south-dakota.jpg"
        description: "**Named for:** Pierre Chouteau Jr., founded 1880. The railroad town took its name from the St. Louis fur trader who built Fort Pierre across the Missouri River decades earlier and pioneered steamboat trade on the river. South Dakota voters made it the permanent capital in 1904."
        anchor_phrases: ["Pierre Chouteau Jr."]
      - name: "Charleston, West Virginia"
        image: "/images/collections/capitals/named-after-people/charleston-west-virginia.jpg"
        description: "**Named for:** Charles Clendenin, 1794. Founder George Clendenin named the settlement Charles Town for his father. The name was shortened to Charleston in 1818 to avoid confusion with another Charles Town in the state's eastern panhandle, named for George Washington's brother."
        anchor_phrases: ["Charles Clendenin"]
      - name: "Annapolis, Maryland"
        image: "/images/collections/capitals/named-after-people/annapolis-maryland.jpg"
        description: "**Named for:** Princess Anne, 1695. Royal Governor Francis Nicholson renamed the town from Arundel Town to honor the heir to the English throne, who became Queen Anne in 1702. She later returned the favor, chartering Annapolis as a city in 1708."
        anchor_phrases: ["Princess Anne"]
      - name: "Columbus, Ohio"
        image: "/images/collections/capitals/named-after-people/columbus-ohio.jpg"
        description: "**Named for:** Christopher Columbus, 1812. Ohio's legislature named its new, purpose-built capital after the Italian explorer to mark his legacy of discovery. Columbus died in 1506, nearly 300 years before Ohio existed, and never claimed any political office in America."
        anchor_phrases: ["Christopher Columbus"]
      - name: "Montgomery, Alabama"
        image: "/images/collections/capitals/named-after-people/montgomery-alabama.jpg"
        description: "**Named for:** Richard Montgomery, 1819. The Alabama legislature honored the first American general killed in the Revolutionary War, who died leading the invasion of Quebec in 1775. The name was suggested after his remains were reburied in New York in 1818."
        anchor_phrases: ["Richard Montgomery"]
      - name: "Trenton, New Jersey"
        image: "/images/collections/capitals/named-after-people/trenton-new-jersey.jpg"
        description: "**Named for:** William Trent, 1719. Quaker settlers first built at the Falls of the Delaware in 1679, but the town took its lasting name from Trent, a merchant who bought up much of the surrounding land. 'Trent-towne' contracted over time into Trenton."
        anchor_phrases: ["William Trent"]

  - id: how-these-differ-from-presidential-capitals
    icon: "fa-solid fa-scale-balanced"
    title: "How These Differ From the Presidential Four"
    paragraphs:
      - "Only four state capitals honor U.S. presidents: Jefferson City, Jackson, Madison, and Lincoln. Every other named capital on this list honors someone who never held the office, whether an explorer three centuries removed like Raleigh or Columbus, a general like Montgomery, a fur trader like Chouteau, or a European statesman like Bismarck."
      - "Jackson, Mississippi does not belong on this list. Andrew Jackson was already a national hero when the city was named for him in 1821, but he became the seventh president twelve years later, which places that capital firmly in the presidential group."

faq:
  - question: "Which state capitals are named after people who were not presidents?"
    answer: "At least ten, including Austin (Stephen F. Austin), Raleigh (Sir Walter Raleigh), Bismarck (Otto von Bismarck), Denver (James W. Denver), Pierre (Pierre Chouteau Jr.), Charleston, West Virginia (Charles Clendenin), Annapolis (Princess Anne), Columbus (Christopher Columbus), Montgomery (Richard Montgomery), and Trenton (William Trent)."

  - question: "Is Bismarck, North Dakota really named after the German chancellor?"
    answer: "Yes. The Northern Pacific Railway renamed the town in 1873 to attract German investors to its rail line. Bismarck acknowledged the honor with a note but never invested. It is the only U.S. state capital named for a foreign statesman."

  - question: "Is Denver named after a president?"
    answer: "No. Denver is named after James W. Denver, who was governor of Kansas Territory in 1858 when land speculator William Larimer named the townsite after him as a favor-seeking gesture."

  - question: "Why is Columbus, Ohio not on the presidents list?"
    answer: "Christopher Columbus was an Italian explorer who died in 1506, nearly three centuries before Ohio existed. He never held any American political office, so Columbus belongs with the non-presidential capitals, not the presidential ones."

  - question: "Is Austin named after a president?"
    answer: "No. Austin is named after Stephen F. Austin, known as the Father of Texas for leading the first major American colonization of the region. He died in 1836, three years before the capital took his name."

  - question: "Is Jackson, Mississippi named after a non-president?"
    answer: "No. Jackson is named after Andrew Jackson, who became the seventh U.S. president in 1829, eight years after the capital was named for him in 1821. That places Jackson with the four presidential capitals, not this list."
