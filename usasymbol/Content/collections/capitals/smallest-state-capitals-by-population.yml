  - id: smallest-capitals-spotlight
    icon: "fa-solid fa-city"
    style: law-cards
    title: "The 10 Smallest State Capitals"
    snippet_paragraph: "These ten capitals govern their states with populations smaller than a single big-city high school district."
    highlights:
      - name: "Montpelier, Vermont"
        image: "/images/collections/capitals/smallest-capitals/montpelier-vermont.jpg"
        description: "**Population:** 7,915. Montpelier is the only U.S. state capital with no McDonald's or Starbucks within city limits; the city denied a McDonald's application in 1995, and the nearest one sits in neighboring Barre. Its size keeps national chains out and small, local businesses in charge of downtown."
        anchor_phrases: ["Montpelier"]
      - name: "Pierre, South Dakota"
        image: "/images/collections/capitals/smallest-capitals/pierre-south-dakota.jpg"
        description: "**Population:** 13,788. Pierre is one of only four state capitals with no interstate highway passing through it, sitting 34 miles north of Interstate 90 on Highway 83. Voters chose it as the permanent capital in 1904 largely for its central location on the Missouri River."
        anchor_phrases: ["Pierre"]
      - name: "Augusta, Maine"
        image: "/images/collections/capitals/smallest-capitals/augusta-maine.jpg"
        description: "**Population:** 18,500. Augusta grew up around Fort Western, a supply post built on the Kennebec River in 1754. The fort still stands today as the oldest surviving wooden fort in the country, predating the city's rise as Maine's seat of government by decades."
        anchor_phrases: ["Augusta"]
      - name: "Frankfort, Kentucky"
        image: "/images/collections/capitals/smallest-capitals/frankfort-kentucky.jpg"
        description: "**Population:** 28,105. Frankfort beat out the larger city of Lexington for capital status in 1792, the same year Kentucky joined the Union. It has stayed the smallest-footprint choice among Kentucky's early rival towns ever since."
        anchor_phrases: ["Frankfort"]
      - name: "Juneau, Alaska"
        image: "/images/collections/capitals/smallest-capitals/juneau-alaska.jpg"
        description: "**Population:** 31,572. Juneau is the only capital on the U.S. mainland with no road connection to the rest of its state. Residents and visitors reach it only by boat or plane, or by a ferry crossing from Bellingham, Washington that takes two to three days."
        anchor_phrases: ["Juneau"]
      - name: "Helena, Montana"
        image: "/images/collections/capitals/smallest-capitals/helena-montana.jpg"
        description: "**Population:** 32,285. Helena began in 1864 as a gold-mining camp along a gulch that prospectors nicknamed Last Chance, after one final, successful attempt to strike gold there. The gold money built the city that became Montana's capital in 1875."
        anchor_phrases: ["Helena", "Last Chance"]
      - name: "Dover, Delaware"
        image: "/images/collections/capitals/smallest-capitals/dover-delaware.jpg"
        description: "**Population:** 39,837. William Penn ordered Dover's founding in 1683 to give his Pennsylvania colony access to the sea. Delaware's government moved there from New Castle in 1777 for a reason unrelated to size: New Castle sat too close to the Delaware River and British warships."
        anchor_phrases: ["Dover"]
      - name: "Annapolis, Maryland"
        image: "/images/collections/capitals/smallest-capitals/annapolis-maryland.jpg"
        description: "**Population:** 40,689. Annapolis has held Maryland's government since 1695, making it one of the oldest continuously serving state capitals despite never growing much beyond a small city. It also hosts the U.S. Naval Academy, which brings more people to town daily than actually live there."
        anchor_phrases: ["Annapolis"]
      - name: "Jefferson City, Missouri"
        image: "/images/collections/capitals/smallest-capitals/jefferson-city-missouri.jpg"
        description: "**Population:** 42,488. Missouri's legislature chose the site on a bluff above the Missouri River in 1821, deliberately picking an undeveloped spot near the state's geographic center over larger existing towns like St. Charles and St. Louis."
        anchor_phrases: ["Jefferson City"]
      - name: "Concord, New Hampshire"
        image: "/images/collections/capitals/smallest-capitals/concord-new-hampshire.jpg"
        description: "**Population:** 44,674. Concord traces back to a 1659 settlement called Penacook, making it one of the oldest towns to end up as a capital. It became New Hampshire's seat of government in 1808, chosen for its central location rather than its size."
        anchor_phrases: ["Concord"]

  - id: why-so-small
    icon: "fa-solid fa-magnifying-glass-chart"
    title: "Why Some Capitals Stayed Small"
    paragraphs:
      - "Most of the smallest capitals were picked for geography, not growth potential. State legislatures in the 1800s favored a central location over an existing commercial hub, which routed government business to small river towns and gold-camp outposts instead of each state's biggest city."
      - "Larger commercial centers, like Charlotte in North Carolina or St. Louis in Missouri, grew around industry and trade instead. Their state capitals stayed put in smaller towns chosen for convenience decades earlier, and the population gap between commerce and government only widened over time."

faq:
  - question: "What is the smallest state capital in the US?"
    answer: "Montpelier, Vermont, with about 7,900 residents. It is the only state capital with no McDonald's or Starbucks within city limits."

  - question: "What is the second smallest state capital?"
    answer: "Pierre, South Dakota, with roughly 13,800 residents. Pierre is also one of only four state capitals with no interstate highway."

  - question: "What is the largest state capital by population?"
    answer: "Phoenix, Arizona, with more than 1.6 million residents. Phoenix is also the fifth-largest city in the country, capital or otherwise."

  - question: "Is Montpelier the smallest capital city in the country?"
    answer: "Yes, among the 50 state capitals. Montpelier's population of under 8,000 is smaller than every other capital, including Pierre, South Dakota, the next smallest at about 13,800."

  - question: "Why is Juneau so small for a state capital?"
    answer: "Juneau has no road connection to the rest of Alaska, reachable only by boat or plane. That isolation has capped its growth even as it governs the largest state by land area."

  - question: "How many state capitals have fewer than 50,000 people?"
    answer: "Twelve: Montpelier, Pierre, Augusta, Frankfort, Juneau, Helena, Dover, Annapolis, Jefferson City, Concord, Charleston (West Virginia), and Harrisburg."
