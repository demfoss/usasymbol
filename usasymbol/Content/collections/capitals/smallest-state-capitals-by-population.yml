page:
  h1: "What Is the Smallest State Capital by Population?"
  intro_title: "Montpelier Is Smallest, and Not Close"

  quick_answer:
    - "Montpelier, Vermont is the smallest U.S. state capital, with about 7,900 residents. It is also the only state capital with no McDonald's or Starbucks inside city limits."
    - "Pierre, South Dakota is the second-smallest capital at roughly 13,800 residents, and one of only four state capitals with no interstate highway running through it."
    - "Phoenix, Arizona is the largest state capital by far, with more than 1.6 million residents, over 200 times the population of Montpelier."

  methodology: "Population figures are U.S. Census Bureau city population estimates for each state capital, current as of 2024."
