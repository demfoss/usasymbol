page:
  h1: "Which States Moved Their Capital to a Different City?"
  intro_title: "Ten States, Ten Capitals That Used to Be Somewhere Else"

  quick_answer:
    - "Georgia has changed its capital five times: Savannah, Augusta, Louisville, Milledgeville, and finally Atlanta in 1868, more moves than any other state."
    - "New York's capital moved between Kingston, Poughkeepsie, and Albany after the British burned Kingston in 1777, before Albany became permanent in 1797."
    - "Virginia's capital moved from Williamsburg to Richmond in 1780, during the Revolutionary War, partly to put the seat of government farther from the coast and British ships."

  methodology: "Capital history confirmed through state archives, legislative acts, and documented dates for each relocation."
