sections:
  - id: capitals-that-moved-list
    icon: "fa-solid fa-route"
    style: law-cards
    title: "States That Moved Their Capital"
    snippet_paragraph: "Each of these ten states governed from a different city before settling on the capital it has today."
    highlights:
      - name: "Georgia: Savannah to Atlanta"
        image: "/images/collections/capitals/moved-capitals/georgia.jpg"
        description: "**Path:** Savannah (1733) to Augusta (1786) to Louisville (1796) to Milledgeville (1807) to Atlanta (1868). No state has moved its capital more times. Each move chased the state's population inland and then, after the Civil War, toward its new rail hub in Atlanta."
        anchor_phrases: ["Savannah", "Milledgeville", "Atlanta"]
      - name: "New York: Kingston to Albany"
        image: "/images/collections/capitals/moved-capitals/new-york.jpg"
        description: "**Path:** Kingston (1777) to Albany (permanent, 1797). British troops burned Kingston months after it became the first capital. The legislature spent the next two decades bouncing between Kingston, Poughkeepsie, Albany, and New York City before settling permanently on Albany."
        anchor_phrases: ["Kingston", "Albany"]
      - name: "Illinois: Kaskaskia to Springfield"
        image: "/images/collections/capitals/moved-capitals/illinois.jpg"
        description: "**Path:** Kaskaskia (1818) to Vandalia (1820) to Springfield (1839). Vandalia was picked with a 20-year expiration built into the law. Springfield won the next vote partly through the lobbying of a young state legislator named Abraham Lincoln."
        anchor_phrases: ["Kaskaskia", "Vandalia", "Springfield"]
      - name: "Alabama: Huntsville to Montgomery"
        image: "/images/collections/capitals/moved-capitals/alabama.jpg"
        description: "**Path:** St. Stephens (1817) to Huntsville (1819) to Cahaba (1820) to Tuscaloosa (1826) to Montgomery (1846). Flooding plagued Cahaba, the first permanent capital, and lawmakers eventually chased the state's growing southeastern population to Montgomery."
        anchor_phrases: ["Cahaba", "Tuscaloosa", "Montgomery"]
      - name: "Ohio: Chillicothe to Columbus"
        image: "/images/collections/capitals/moved-capitals/ohio.jpg"
        description: "**Path:** Chillicothe (1803) to Zanesville (1810) to Chillicothe (1812) to Columbus (1816). Ohio's capital swung back and forth once before lawmakers built a new city from scratch near the state's geographic center and named it after Christopher Columbus."
        anchor_phrases: ["Chillicothe", "Zanesville", "Columbus"]
      - name: "California: San Jose to Sacramento"
        image: "/images/collections/capitals/moved-capitals/california.jpg"
        description: "**Path:** San Jose (1849) to Vallejo (1852) to Benicia (1853) to Sacramento (1854). California cycled through four capitals in five years right after statehood. Benicia's capitol still stands, the only surviving statehouse in California outside Sacramento."
        anchor_phrases: ["San Jose", "Vallejo", "Benicia", "Sacramento"]
      - name: "Virginia: Williamsburg to Richmond"
        image: "/images/collections/capitals/moved-capitals/virginia.jpg"
        description: "**Path:** Jamestown (1607) to Williamsburg (1699) to Richmond (1780). Governor Thomas Jefferson pushed the move to Richmond during the Revolutionary War, partly to put the government farther inland and out of easy reach of British naval raids."
        anchor_phrases: ["Williamsburg", "Richmond"]
      - name: "South Carolina: Charleston to Columbia"
        image: "/images/collections/capitals/moved-capitals/south-carolina.jpg"
        description: "**Path:** Charleston (colonial era) to Columbia (1786). South Carolina moved its government inland to a newly platted town at the center of the state, reducing the coastal Low Country's outsized grip on state politics."
        anchor_phrases: ["Charleston", "Columbia"]
      - name: "North Carolina: New Bern to Raleigh"
        image: "/images/collections/capitals/moved-capitals/north-carolina.jpg"
        description: "**Path:** New Bern (1765) to Raleigh (1792). Governor William Tryon made New Bern the colonial capital, but after independence, lawmakers built Raleigh from scratch on purchased farmland near the state's population center."
        anchor_phrases: ["New Bern", "Raleigh"]
      - name: "Pennsylvania: Philadelphia to Harrisburg"
        image: "/images/collections/capitals/moved-capitals/pennsylvania.jpg"
        description: "**Path:** Philadelphia (to 1799) to Lancaster (1799) to Harrisburg (1812). Repeated yellow fever epidemics in Philadelphia pushed the legislature to Lancaster first, then Harrisburg's river access and central location won it permanent status in 1812."
        anchor_phrases: ["Philadelphia", "Lancaster", "Harrisburg"]

  - id: georgia-five-capitals-timeline
    icon: "fa-solid fa-clock-rotate-left"
    title: "Georgia's Five Capitals, in Order"
    timeline:
      - year: "1733"
        description: "Savannah becomes Georgia's first capital, the year James Oglethorpe founds the colony."
      - year: "1786"
        description: "The capital moves to Augusta, farther from the coast and closer to the state's growing inland population."
      - year: "1796"
        description: "Louisville, a planned town built specifically to serve as capital, takes over the role."
      - year: "1807"
        description: "Milledgeville becomes capital, chosen for its central location. It holds the role for 60 years."
      - year: "1868"
        description: "Atlanta, rebuilt after being burned during the Civil War, becomes Georgia's fifth and current capital during Reconstruction."

  - id: why-capitals-moved
    icon: "fa-solid fa-map-location-dot"
    title: "Why States Kept Moving Their Capitals"
    paragraphs:
      - "War pushed several of these moves. New York fled Kingston after the British burned it, and Virginia moved inland to Richmond during the Revolution to put distance between the government and British ships on the coast."
      - "Geography and politics drove the rest. States repeatedly picked new capitals closer to their population's center as settlement spread west, which explains why Ohio, Alabama, and Illinois each cycled through two or more cities before landing on a permanent choice."

faq:
  - question: "Which state has had the most capitals?"
    answer: "Georgia, with five: Savannah, Augusta, Louisville, Milledgeville, and Atlanta. No other state has changed its capital city that many times."

  - question: "Why did New York move its capital to Albany?"
    answer: "British troops burned Kingston, New York's first capital, in 1777. The legislature then rotated among several cities for two decades before making Albany the permanent capital in 1797."

  - question: "Was Richmond always Virginia's capital?"
    answer: "No. Virginia's capital was Jamestown starting in 1607, then Williamsburg from 1699. It moved to Richmond in 1780, during the Revolutionary War."

  - question: "Did Illinois really almost keep Vandalia as its capital?"
    answer: "The 1820 law that made Vandalia the capital gave it 20 years in the role. Lawmakers moved the capital to Springfield in 1839, one year before that term was set to expire."

  - question: "How many state capitals were never the state's first capital?"
    answer: "At least ten, including Atlanta, Albany, Springfield, Montgomery, Columbus, Sacramento, Richmond, Columbia, Raleigh, and Harrisburg. Each replaced an earlier capital city."

  - question: "Is Benicia, California still standing?"
    answer: "Yes. Benicia served as California's capital from 1853 to 1854, and its capitol building still stands today as the only surviving state capitol in California outside Sacramento."
