sections:
  - id: pre-1776-capitals-list
    icon: "fa-solid fa-scroll"
    style: law-cards
    title: "State Capitals Founded Before 1776"
    snippet_paragraph: "These twelve capitals, ordered from oldest to youngest, all existed as settlements before the Declaration of Independence."
    highlights:
      - name: "Santa Fe, New Mexico"
        image: "/images/collections/capitals/pre-1776/santa-fe-new-mexico.jpg"
        description: "**Founded:** 1610. Spanish colonial governor Pedro de Peralta established Santa Fe as the capital of the province of Nuevo Mexico, making it the oldest state capital in the country by 20 years over its nearest rival, Boston."
        anchor_phrases: ["Santa Fe"]
      - name: "Albany, New York"
        image: "/images/collections/capitals/pre-1776/albany-new-york.jpg"
        description: "**Founded:** 1624. Dutch settlers built Fort Orange on the Hudson River as a fur-trading post, six years before Boston existed. Albany did not become New York's permanent capital until 1797, more than 170 years after its founding."
        anchor_phrases: ["Albany"]
      - name: "Boston, Massachusetts"
        image: "/images/collections/capitals/pre-1776/boston-massachusetts.jpg"
        description: "**Founded:** 1630. Puritan colonists led by John Winthrop settled the Shawmut Peninsula and made it the seat of the Massachusetts Bay Colony almost immediately, a role the city has never lost in the four centuries since."
        anchor_phrases: ["Boston"]
      - name: "Hartford, Connecticut"
        image: "/images/collections/capitals/pre-1776/hartford-connecticut.jpg"
        description: "**Founded:** 1636. Reverend Thomas Hooker led a hundred settlers and their livestock overland from Massachusetts Bay to found Hartford, which became the seat of the Connecticut Colony within a few years."
        anchor_phrases: ["Hartford"]
      - name: "Providence, Rhode Island"
        image: "/images/collections/capitals/pre-1776/providence-rhode-island.jpg"
        description: "**Founded:** 1636. Roger Williams founded Providence after being banished from Massachusetts Bay for advocating religious tolerance, the same principle that shaped the colony he went on to lead."
        anchor_phrases: ["Providence"]
      - name: "Annapolis, Maryland"
        image: "/images/collections/capitals/pre-1776/annapolis-maryland.jpg"
        description: "**Founded:** 1649. Puritan settlers established the town, first called Providence, on the Severn River. It became Maryland's capital in 1695 and was renamed Annapolis to honor Princess Anne, later Queen Anne of England."
        anchor_phrases: ["Annapolis"]
      - name: "Concord, New Hampshire"
        image: "/images/collections/capitals/pre-1776/concord-new-hampshire.jpg"
        description: "**Founded:** 1659. English settlers established the village of Penacook along the Merrimack River. It was incorporated as Rumford in 1733 and renamed Concord in 1765, more than a century after its first settlers arrived."
        anchor_phrases: ["Concord"]
      - name: "Trenton, New Jersey"
        image: "/images/collections/capitals/pre-1776/trenton-new-jersey.jpg"
        description: "**Founded:** 1679. Quakers led by Mahlon Stacy settled the Falls of the Delaware, seeking religious freedom from persecution in England. The town later took the name Trenton from landholder William Trent around 1719."
        anchor_phrases: ["Trenton"]
      - name: "Dover, Delaware"
        image: "/images/collections/capitals/pre-1776/dover-delaware.jpg"
        description: "**Founded:** 1683. William Penn ordered Dover's establishment to give his Pennsylvania colony access to the Atlantic. The town's streets and central square were formally laid out in 1717, decades before it became Delaware's capital in 1777."
        anchor_phrases: ["Dover"]
      - name: "Baton Rouge, Louisiana"
        image: "/images/collections/capitals/pre-1776/baton-rouge-louisiana.jpg"
        description: "**Founded:** 1699. French explorer Pierre le Moyne d'Iberville named the site for a red pole marking a boundary between Houma and Bayagoula hunting grounds. France built a fort there in 1719, and the settlement changed hands between France, Britain, and Spain before Louisiana statehood."
        anchor_phrases: ["Baton Rouge"]
      - name: "Richmond, Virginia"
        image: "/images/collections/capitals/pre-1776/richmond-virginia.jpg"
        description: "**Founded:** 1737. Colonel William Byrd II laid out Richmond on the James River at the falls, a site he had inherited from his father. The Virginia government moved there from Williamsburg in 1780, during the Revolutionary War."
        anchor_phrases: ["Richmond"]
      - name: "Augusta, Maine"
        image: "/images/collections/capitals/pre-1776/augusta-maine.jpg"
        description: "**Founded:** 1754. The Kennebec Proprietors built Fort Western on the Kennebec River to secure the region and support trade. The settlement that grew around the fort became Augusta, Maine's capital, decades later."
        anchor_phrases: ["Augusta", "Fort Western"]

  - id: why-these-came-first
    icon: "fa-solid fa-ship"
    title: "Why These Twelve Came First"
    paragraphs:
      - "Every capital on this list started as a coastal or river settlement tied to colonial trade, religious refuge, or military defense. Santa Fe, Albany, and Baton Rouge began under three different European flags, Spain, the Netherlands, and France, before any of them were American soil."
      - "None of these towns were founded to be capitals. Santa Fe governed a Spanish province, Boston anchored the Massachusetts Bay Colony, and Dover secured Pennsylvania's access to the sea. Capital status came later, sometimes more than a century after the first settlers arrived."

faq:
  - question: "What is the oldest state capital in the United States?"
    answer: "Santa Fe, New Mexico, founded in 1610 under Spanish colonial rule. It predates the second-oldest capital, Albany, by 14 years and the Pilgrims' landing at Plymouth by a decade."

  - question: "How many state capitals were founded before 1776?"
    answer: "Twelve: Santa Fe, Albany, Boston, Hartford, Providence, Annapolis, Concord, Trenton, Dover, Baton Rouge, Richmond, and Augusta."

  - question: "Is Boston the oldest state capital?"
    answer: "No. Boston was founded in 1630, but Santa Fe (1610) and Albany (1624) both predate it by at least six years."

  - question: "Was Baton Rouge founded under French rule?"
    answer: "Yes. French explorer Pierre le Moyne d'Iberville named the site in 1699, and France built a fort there in 1719. Louisiana later passed through Spanish and British control before becoming a U.S. territory."

  - question: "Why did some pre-1776 towns become capitals so much later?"
    answer: "State legislatures often picked existing colonial towns for their location, not their age. Albany was founded in 1624 but did not become New York's permanent capital until 1797, and Richmond became Virginia's capital in 1780, 43 years after William Byrd II founded it."

  - question: "Are most state capitals older or younger than the United States?"
    answer: "Younger. Only twelve of the 50 state capitals existed before 1776. The other 38 were founded or chosen as capitals after independence, many during westward expansion in the 1800s."
