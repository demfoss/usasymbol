- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Idaho Cities Rank Highest for Reported Crime
  paragraphs:
  - Chubbuck ranks first because its combined 2024 reported crime rate is 2,951.8 per 100,000, which is 860.1 points
    above Garden City. Property crime supplies 91.0% of Chubbuck's total, while violent crime contributes 265.1
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Garden City has the highest violent-crime
    rate in this group at 656.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Garden City has the smallest FBI coverage population in
    this list at 12,956; one additional reported offense changes its rate by about 7.7 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Boise reports the largest raw combined offense count in this group (3,302), but Chubbuck ranks first after population
    adjustment.
  - 'Garden City, ranked #2 overall, has the highest violent-crime rate; Chubbuck''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 860.1 rate points between Chubbuck and Garden City.
  - Property crime's share ranges from 68.3% in Caldwell to 91.0% in Chubbuck.
faq:
- question: What city has the highest reported crime rate in Idaho?
  answer: Chubbuck ranks first among qualifying city agencies matched to Census places at 2,951.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Chubbuck rank first for reported crime in Idaho?
  answer: Its combined violent and property crime rate is 2,951.8 per 100,000 residents covered. Property crime
    contributes 2,686.7 and violent crime contributes 265.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Idaho is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
