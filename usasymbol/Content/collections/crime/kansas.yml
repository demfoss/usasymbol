- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Kansas Cities Rank Highest for Reported Crime
  paragraphs:
  - Merriam ranks first because its combined 2024 reported crime rate is 6,021.9 per 100,000, which is 1,110.1 points
    above Mission. Property crime supplies 92.8% of Merriam's total, while violent crime contributes 435.4 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Kansas City has the highest violent-crime
    rate in this group at 1,047.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Mission has the smallest FBI coverage population in this
    list at 10,037; one additional reported offense changes its rate by about 10.0 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Wichita reports the largest raw combined offense count in this group (11,238), but Merriam ranks first after
    population adjustment.
  - 'Kansas City, ranked #3 overall, has the highest violent-crime rate; Merriam''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 1,110.1 rate points between Merriam and Mission.
  - Property crime's share ranges from 74.8% in Junction City to 93.1% in Mission.
faq:
- question: What city has the highest reported crime rate in Kansas?
  answer: Merriam ranks first among qualifying city agencies matched to Census places at 6,021.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Merriam rank first for reported crime in Kansas?
  answer: Its combined violent and property crime rate is 6,021.9 per 100,000 residents covered. Property crime
    contributes 5,586.4 and violent crime contributes 435.4 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Kansas is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
