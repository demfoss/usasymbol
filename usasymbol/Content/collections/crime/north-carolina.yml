- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These North Carolina Cities Rank Highest for Reported Crime
  paragraphs:
  - Lumberton ranks first because its combined 2024 reported crime rate is 11,620.5 per 100,000, which is 2,141.2
    points above Pineville. Property crime supplies 85.6% of Lumberton's total, while violent crime contributes
    1,676.5 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Laurinburg has the highest violent-crime
    rate in this group at 1,894.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Pineville has the smallest FBI coverage population in this
    list at 11,330; one additional reported offense changes its rate by about 8.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Asheville reports the largest raw combined offense count in this group (4,467), but Lumberton ranks first after
    population adjustment.
  - 'Laurinburg, ranked #5 overall, has the highest violent-crime rate; Lumberton''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 2,141.2 rate points between Lumberton and Pineville.
  - Property crime's share ranges from 72.7% in Laurinburg to 92.7% in Garner.
faq:
- question: What city has the highest reported crime rate in North Carolina?
  answer: Lumberton ranks first among qualifying city agencies matched to Census places at 11,620.5 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Lumberton rank first for reported crime in North Carolina?
  answer: Its combined violent and property crime rate is 11,620.5 per 100,000 residents covered. Property crime
    contributes 9,943.9 and violent crime contributes 1,676.5 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in North Carolina is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
