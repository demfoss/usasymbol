- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Alaska Cities Rank Highest for Reported Crime
  paragraphs:
  - Fairbanks ranks first because its combined 2024 reported crime rate is 4,160.9 per 100,000, which is 380.2 points
    above Anchorage. Property crime supplies 83.2% of Fairbanks's total, while violent crime contributes 697.7 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Anchorage has the highest violent-crime
    rate in this group at 1,014.8 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Wasilla has the smallest FBI coverage population in this
    list at 10,240; one additional reported offense changes its rate by about 9.8 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Anchorage reports the largest raw combined offense count in this group (10,849), but Fairbanks ranks first after
    population adjustment.
  - 'Anchorage, ranked #2 overall, has the highest violent-crime rate; Fairbanks''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 909.6 rate points between Anchorage and Wasilla.
  - Property crime's share ranges from 73.2% in Anchorage to 84.4% in Wasilla.
faq:
- question: What city has the highest reported crime rate in Alaska?
  answer: Fairbanks ranks first among qualifying city agencies matched to Census places at 4,160.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Fairbanks rank first for reported crime in Alaska?
  answer: Its combined violent and property crime rate is 4,160.9 per 100,000 residents covered. Property crime
    contributes 3,463.2 and violent crime contributes 697.7 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Alaska is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
