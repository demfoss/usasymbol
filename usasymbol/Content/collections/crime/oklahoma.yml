- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Oklahoma Cities Rank Highest for Reported Crime
  paragraphs:
  - Tulsa ranks first because its combined 2024 reported crime rate is 4,569.3 per 100,000, which is 321.9 points
    above Ardmore. Property crime supplies 79.4% of Tulsa's total, while violent crime contributes 941.9 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Ardmore has the highest violent-crime rate
    in this group at 1,141.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Warr Acres has the smallest FBI coverage population in
    this list at 10,482; one additional reported offense changes its rate by about 9.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Oklahoma City reports the largest raw combined offense count in this group (25,324), but Tulsa ranks first after
    population adjustment.
  - 'Ardmore, ranked #2 overall, has the highest violent-crime rate; Tulsa''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 321.9 rate points between Tulsa and Ardmore.
  - Property crime's share ranges from 73.1% in Ardmore to 92.0% in Durant.
faq:
- question: What city has the highest reported crime rate in Oklahoma?
  answer: Tulsa ranks first among qualifying city agencies matched to Census places at 4,569.3 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Tulsa rank first for reported crime in Oklahoma?
  answer: Its combined violent and property crime rate is 4,569.3 per 100,000 residents covered. Property crime
    contributes 3,627.4 and violent crime contributes 941.9 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Oklahoma is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
