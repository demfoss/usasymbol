- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Kentucky Cities Rank Highest for Reported Crime
  paragraphs:
  - St. Matthews ranks first because its combined 2024 reported crime rate is 5,223.0 per 100,000, which is 1,055.7
    points above Newport. Property crime supplies 97.6% of St. Matthews's total, while violent crime contributes
    127.2 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Louisville has the highest violent-crime
    rate in this group at 707.4 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Newport has the smallest FBI coverage population in this
    list at 13,702; one additional reported offense changes its rate by about 7.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Louisville reports the largest raw combined offense count in this group (27,301), but St. Matthews ranks first
    after population adjustment.
  - 'Louisville, ranked #3 overall, has the highest violent-crime rate; St. Matthews''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 1,055.7 rate points between St. Matthews and Newport.
  - Property crime's share ranges from 82.5% in Louisville to 97.6% in St. Matthews.
faq:
- question: What city has the highest reported crime rate in Kentucky?
  answer: St. Matthews ranks first among qualifying city agencies matched to Census places at 5,223.0 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does St. Matthews rank first for reported crime in Kentucky?
  answer: Its combined violent and property crime rate is 5,223.0 per 100,000 residents covered. Property crime
    contributes 5,095.7 and violent crime contributes 127.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Kentucky is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
