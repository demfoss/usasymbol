- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Georgia Cities Rank Highest for Reported Crime
  paragraphs:
  - College Park ranks first because its combined 2024 reported crime rate is 8,731.0 per 100,000, which is 861.2
    points above East Point. Property crime supplies 84.1% of College Park's total, while violent crime contributes
    1,386.9 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Americus has the highest violent-crime rate
    in this group at 1,653.7 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Vidalia has the smallest FBI coverage population in this
    list at 10,724; one additional reported offense changes its rate by about 9.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - East Point reports the largest raw combined offense count in this group (3,008), but College Park ranks first
    after population adjustment.
  - 'Americus, ranked #6 overall, has the highest violent-crime rate; College Park''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 1,799.4 rate points between East Point and Moultrie.
  - Property crime's share ranges from 70.4% in Americus to 90.3% in Doraville.
faq:
- question: What city has the highest reported crime rate in Georgia?
  answer: College Park ranks first among qualifying city agencies matched to Census places at 8,731.0 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does College Park rank first for reported crime in Georgia?
  answer: Its combined violent and property crime rate is 8,731.0 per 100,000 residents covered. Property crime
    contributes 7,344.1 and violent crime contributes 1,386.9 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Georgia is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
