- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Arizona Cities Rank Highest for Reported Crime
  paragraphs:
  - Tucson ranks first because its combined 2024 reported crime rate is 3,901.9 per 100,000, which is 71.8 points
    above Nogales. Property crime supplies 84.9% of Tucson's total, while violent crime contributes 588.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Phoenix has the highest violent-crime rate
    in this group at 799.6 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Show Low has the smallest FBI coverage population in this
    list at 12,341; one additional reported offense changes its rate by about 8.1 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Phoenix reports the largest raw combined offense count in this group (51,962), but Tucson ranks first after
    population adjustment.
  - 'Phoenix, ranked #6 overall, has the highest violent-crime rate; Tucson''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 302.9 rate points between Show Low and Flagstaff.
  - Property crime's share ranges from 74.4% in Phoenix to 94.0% in Nogales.
  - 'Nogales has the highest property-crime rate in the group even though it ranks #2 on the combined list.'
faq:
- question: What city has the highest reported crime rate in Arizona?
  answer: Tucson ranks first among qualifying city agencies matched to Census places at 3,901.9 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Tucson rank first for reported crime in Arizona?
  answer: Its combined violent and property crime rate is 3,901.9 per 100,000 residents covered. Property crime
    contributes 3,313.1 and violent crime contributes 588.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Arizona is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
