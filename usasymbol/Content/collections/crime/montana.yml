- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Montana Cities Rank Highest for Reported Crime
  paragraphs:
  - Missoula ranks first because its combined 2024 reported crime rate is 4,226.3 per 100,000, which is 225.6 points
    above Great Falls. Property crime supplies 85.9% of Missoula's total, while violent crime contributes 596.9
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Billings has the highest violent-crime rate
    in this group at 746.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Belgrade has the smallest FBI coverage population in this
    list at 13,184; one additional reported offense changes its rate by about 7.6 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Billings reports the largest raw combined offense count in this group (4,676), but Missoula ranks first after
    population adjustment.
  - 'Billings, ranked #3 overall, has the highest violent-crime rate; Missoula''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 733.4 rate points between Billings and Helena.
  - Property crime's share ranges from 77.2% in Belgrade to 88.4% in Kalispell.
faq:
- question: What city has the highest reported crime rate in Montana?
  answer: Missoula ranks first among qualifying city agencies matched to Census places at 4,226.3 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Missoula rank first for reported crime in Montana?
  answer: Its combined violent and property crime rate is 4,226.3 per 100,000 residents covered. Property crime
    contributes 3,629.4 and violent crime contributes 596.9 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Montana is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
