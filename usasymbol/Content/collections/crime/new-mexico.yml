- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These New Mexico Cities Rank Highest for Reported Crime
  paragraphs:
  - Santa Fe ranks first because its combined 2024 reported crime rate is 5,998.8 per 100,000, which is 188.3 points
    above Albuquerque. Property crime supplies 86.0% of Santa Fe's total, while violent crime contributes 842.1
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Gallup has the highest violent-crime rate
    in this group at 1,503.6 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Portales has the smallest FBI coverage population in this
    list at 11,772; one additional reported offense changes its rate by about 8.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Albuquerque reports the largest raw combined offense count in this group (32,466), but Santa Fe ranks first
    after population adjustment.
  - 'Gallup, ranked #4 overall, has the highest violent-crime rate; Santa Fe''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 889.0 rate points between Hobbs and Portales.
  - Property crime's share ranges from 72.1% in Farmington to 87.1% in Las Cruces.
faq:
- question: What city has the highest reported crime rate in New Mexico?
  answer: Santa Fe ranks first among qualifying city agencies matched to Census places at 5,998.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Santa Fe rank first for reported crime in New Mexico?
  answer: Its combined violent and property crime rate is 5,998.8 per 100,000 residents covered. Property crime
    contributes 5,156.6 and violent crime contributes 842.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in New Mexico is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
