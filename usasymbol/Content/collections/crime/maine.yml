- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Maine Cities Rank Highest for Reported Crime
  paragraphs:
  - Bangor ranks first because its combined 2024 reported crime rate is 4,399.0 per 100,000, which is 57.5 points
    above Augusta. Property crime supplies 96.3% of Bangor's total, while violent crime contributes 161.4 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Biddeford has the highest violent-crime
    rate in this group at 313.8 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Waterville has the smallest FBI coverage population in
    this list at 16,867; one additional reported offense changes its rate by about 5.9 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Portland reports the largest raw combined offense count in this group (1,903), but Bangor ranks first after
    population adjustment.
  - 'Biddeford, ranked #6 overall, has the highest violent-crime rate; Bangor''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 1,175.6 rate points between Augusta and Waterville.
  - Property crime's share ranges from 86.2% in Lewiston to 96.3% in Bangor.
faq:
- question: What city has the highest reported crime rate in Maine?
  answer: Bangor ranks first among qualifying city agencies matched to Census places at 4,399.0 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Bangor rank first for reported crime in Maine?
  answer: Its combined violent and property crime rate is 4,399.0 per 100,000 residents covered. Property crime
    contributes 4,237.6 and violent crime contributes 161.4 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Maine is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
