- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These North Dakota Cities Rank Highest for Reported Crime
  paragraphs:
  - Fargo ranks first because its combined 2024 reported crime rate is 4,195.1 per 100,000, which is 1,325.9 points
    above Mandan. Property crime supplies 88.1% of Fargo's total, while violent crime contributes 498.2 points per
    100,000.
  - The total-crime order is not automatically the violent-crime order. Fargo has the highest violent-crime rate
    in this group at 498.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Jamestown has the smallest FBI coverage population in this
    list at 15,651; one additional reported offense changes its rate by about 6.4 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Fargo leads both the per-capita ranking and the raw combined offense count among the included North Dakota cities,
    with 5,692 reported offenses.
  - Fargo also has the group's highest violent-crime rate, so its first-place total is not driven by property crime
    alone.
  - The list's largest adjacent gap is 1,325.9 rate points between Fargo and Mandan.
  - Property crime's share ranges from 81.5% in Minot to 92.4% in Jamestown.
faq:
- question: What city has the highest reported crime rate in North Dakota?
  answer: Fargo ranks first among qualifying city agencies matched to Census places at 4,195.1 total reported crimes
    per 100,000 residents covered in 2024.
- question: Why does Fargo rank first for reported crime in North Dakota?
  answer: Its combined violent and property crime rate is 4,195.1 per 100,000 residents covered. Property crime
    contributes 3,696.9 and violent crime contributes 498.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in North Dakota is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
