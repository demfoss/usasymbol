page:
  h1: Most Dangerous Cities in North Dakota
  intro_title: Highest Reported City Crime Rates in North Dakota
  quick_answer:
  - Fargo has the highest 2024 reported total crime rate among qualifying North Dakota city agencies matched to
    Census places at 4,195.1 per 100,000 residents covered.
  - Its rate combines 498.2 violent crimes and 3,696.9 property crimes per 100,000. The table compares 9 qualifying
    cities with coverage populations of at least 10,000.
  - These are city-agency reporting rates, not neighborhood risk estimates. Reporting practices, agency boundaries,
    and the number of crimes reported to police affect the comparison.
  methodology: Cities are ranked by total reported crime rate, calculated as FBI Table 8 violent crime plus property
    crime divided by the agency coverage population and multiplied by 100,000. Eligibility requires a 2024 coverage
    population of at least 10,000 and a matching 2024 Census Gazetteer place; the table is limited to the top 10.
    Arson is not included in the FBI property-crime total. Display names may simplify an FBI agency label, while
    rates continue to use that agency's coverage population.
  sources:
  - name: FBI Crime Data Explorer, 2024 CIUS Table 8
    url: https://cde.ucr.cjis.gov/LATEST/
    description: Official city-agency population and reported offense counts used for every rate
  - name: U.S. Census Bureau 2024 Gazetteer, Places
    url: https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_Gaz_place_national.zip
    description: Official place names and internal-point coordinates used for map markers
