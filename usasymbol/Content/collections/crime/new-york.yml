- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These New York Cities Rank Highest for Reported Crime
  paragraphs:
  - Syracuse ranks first because its combined 2024 reported crime rate is 4,999.5 per 100,000, which is 315.2 points
    above Elmira. Property crime supplies 84.7% of Syracuse's total, while violent crime contributes 765.3 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Syracuse has the highest violent-crime rate
    in this group at 765.3 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Oneida has the smallest FBI coverage population in this
    list at 10,021; one additional reported offense changes its rate by about 10.0 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Buffalo reports the largest raw combined offense count in this group (12,361), but Syracuse ranks first after
    population adjustment.
  - Syracuse also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 315.2 rate points between Syracuse and Elmira.
  - Property crime's share ranges from 84.4% in Buffalo to 92.5% in Johnson City Village.
faq:
- question: What city has the highest reported crime rate in New York?
  answer: Syracuse ranks first among qualifying city agencies matched to Census places at 4,999.5 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Syracuse rank first for reported crime in New York?
  answer: Its combined violent and property crime rate is 4,999.5 per 100,000 residents covered. Property crime
    contributes 4,234.2 and violent crime contributes 765.3 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in New York is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
