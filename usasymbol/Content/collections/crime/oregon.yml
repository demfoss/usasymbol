- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Oregon Cities Rank Highest for Reported Crime
  paragraphs:
  - Portland ranks first because its combined 2024 reported crime rate is 6,246.4 per 100,000, which is 1,158.8
    points above Coos Bay. Property crime supplies 88.5% of Portland's total, while violent crime contributes 720.1
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Portland has the highest violent-crime rate
    in this group at 720.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Coos Bay has the smallest FBI coverage population in this
    list at 15,469; one additional reported offense changes its rate by about 6.5 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Portland leads both the per-capita ranking and the raw combined offense count among the included Oregon cities,
    with 38,919 reported offenses.
  - Portland also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 1,158.8 rate points between Portland and Coos Bay.
  - Property crime's share ranges from 84.0% in Salem to 94.5% in Roseburg.
faq:
- question: What city has the highest reported crime rate in Oregon?
  answer: Portland ranks first among qualifying city agencies matched to Census places at 6,246.4 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Portland rank first for reported crime in Oregon?
  answer: Its combined violent and property crime rate is 6,246.4 per 100,000 residents covered. Property crime
    contributes 5,526.2 and violent crime contributes 720.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Oregon is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
