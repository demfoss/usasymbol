- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Maryland Cities Rank Highest for Reported Crime
  paragraphs:
  - Takoma Park ranks first because its combined 2024 reported crime rate is 7,612.8 per 100,000, which is 1,300.8
    points above Elkton. Property crime supplies 92.9% of Takoma Park's total, while violent crime contributes 539.7
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Baltimore has the highest violent-crime
    rate in this group at 1,606.2 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Cambridge has the smallest FBI coverage population in this
    list at 13,205; one additional reported offense changes its rate by about 7.6 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Baltimore reports the largest raw combined offense count in this group (32,656), but Takoma Park ranks first
    after population adjustment.
  - 'Baltimore, ranked #3 overall, has the highest violent-crime rate; Takoma Park''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 1,300.8 rate points between Takoma Park and Elkton.
  - Property crime's share ranges from 72.1% in Baltimore to 92.9% in Takoma Park.
faq:
- question: What city has the highest reported crime rate in Maryland?
  answer: Takoma Park ranks first among qualifying city agencies matched to Census places at 7,612.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Takoma Park rank first for reported crime in Maryland?
  answer: Its combined violent and property crime rate is 7,612.8 per 100,000 residents covered. Property crime
    contributes 7,073.1 and violent crime contributes 539.7 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Maryland is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
