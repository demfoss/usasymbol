- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Vermont Cities Rank Highest for Reported Crime
  paragraphs:
  - Burlington ranks first because its combined 2024 reported crime rate is 4,768.8 per 100,000, which is 88.0 points
    above Brattleboro. Property crime supplies 90.0% of Burlington's total, while violent crime contributes 479.1
    points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Brattleboro has the highest violent-crime
    rate in this group at 645.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Milton has the smallest FBI coverage population in this
    list at 10,733; one additional reported offense changes its rate by about 9.3 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Burlington leads both the per-capita ranking and the raw combined offense count among the included Vermont cities,
    with 2,120 reported offenses.
  - 'Brattleboro, ranked #2 overall, has the highest violent-crime rate; Burlington''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 1,998.1 rate points between Bennington and Milton.
  - Property crime's share ranges from 78.3% in Milton to 94.9% in South Burlington.
  - 'South Burlington has the highest property-crime rate in the group even though it ranks #3 on the combined list.'
faq:
- question: What city has the highest reported crime rate in Vermont?
  answer: Burlington ranks first among qualifying city agencies matched to Census places at 4,768.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Burlington rank first for reported crime in Vermont?
  answer: Its combined violent and property crime rate is 4,768.8 per 100,000 residents covered. Property crime
    contributes 4,289.6 and violent crime contributes 479.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Vermont is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
