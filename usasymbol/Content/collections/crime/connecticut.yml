- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Connecticut Cities Rank Highest for Reported Crime
  paragraphs:
  - New Haven ranks first because its combined 2024 reported crime rate is 4,121.9 per 100,000, which is 575.4 points
    above Orange. Property crime supplies 87.0% of New Haven's total, while violent crime contributes 534.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. New Haven has the highest violent-crime
    rate in this group at 534.8 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Derby has the smallest FBI coverage population in this
    list at 12,437; one additional reported offense changes its rate by about 8.0 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - New Haven leads both the per-capita ranking and the raw combined offense count among the included Connecticut
    cities, with 5,657 reported offenses.
  - New Haven also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 575.4 rate points between New Haven and Orange.
  - Property crime's share ranges from 82.0% in New Britain to 98.8% in Orange.
faq:
- question: What city has the highest reported crime rate in Connecticut?
  answer: New Haven ranks first among qualifying city agencies matched to Census places at 4,121.9 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does New Haven rank first for reported crime in Connecticut?
  answer: Its combined violent and property crime rate is 4,121.9 per 100,000 residents covered. Property crime
    contributes 3,587.1 and violent crime contributes 534.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Connecticut is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
