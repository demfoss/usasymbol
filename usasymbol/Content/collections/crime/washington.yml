- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Washington Cities Rank Highest for Reported Crime
  paragraphs:
  - Tukwila ranks first because its combined 2024 reported crime rate is 16,170.6 per 100,000, which is 9,235.1
    points above Fife. Property crime supplies 94.3% of Tukwila's total, while violent crime contributes 926.8 points
    per 100,000.
  - The total-crime order is not automatically the violent-crime order. Tacoma has the highest violent-crime rate
    in this group at 1,063.0 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Fife has the smallest FBI coverage population in this list
    at 10,612; one additional reported offense changes its rate by about 9.4 per 100,000. This mathematical effect
    explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Seattle reports the largest raw combined offense count in this group (43,952), but Tukwila ranks first after
    population adjustment.
  - 'Tacoma, ranked #3 overall, has the highest violent-crime rate; Tukwila''s #1 position comes from the combined
    violent-and-property measure.'
  - The list's largest adjacent gap is 9,235.1 rate points between Tukwila and Fife.
  - Property crime's share ranges from 84.1% in Tacoma to 98.8% in Burlington.
faq:
- question: What city has the highest reported crime rate in Washington?
  answer: Tukwila ranks first among qualifying city agencies matched to Census places at 16,170.6 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Tukwila rank first for reported crime in Washington?
  answer: Its combined violent and property crime rate is 16,170.6 per 100,000 residents covered. Property crime
    contributes 15,243.9 and violent crime contributes 926.8 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Washington is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
