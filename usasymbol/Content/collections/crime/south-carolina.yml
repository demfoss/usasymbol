- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These South Carolina Cities Rank Highest for Reported Crime
  paragraphs:
  - Orangeburg ranks first because its combined 2024 reported crime rate is 7,455.0 per 100,000, which is 687.9
    points above Myrtle Beach. Property crime supplies 83.3% of Orangeburg's total, while violent crime contributes
    1,246.2 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Spartanburg has the highest violent-crime
    rate in this group at 1,480.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Gaffney has the smallest FBI coverage population in this
    list at 12,399; one additional reported offense changes its rate by about 8.1 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - North Charleston reports the largest raw combined offense count in this group (5,887), but Orangeburg ranks
    first after population adjustment.
  - 'Spartanburg, ranked #3 overall, has the highest violent-crime rate; Orangeburg''s #1 position comes from the
    combined violent-and-property measure.'
  - The list's largest adjacent gap is 1,080.0 rate points between Anderson and West Columbia.
  - Property crime's share ranges from 77.2% in Sumter to 94.9% in Gaffney.
faq:
- question: What city has the highest reported crime rate in South Carolina?
  answer: Orangeburg ranks first among qualifying city agencies matched to Census places at 7,455.0 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Orangeburg rank first for reported crime in South Carolina?
  answer: Its combined violent and property crime rate is 7,455.0 per 100,000 residents covered. Property crime
    contributes 6,208.7 and violent crime contributes 1,246.2 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in South Carolina is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
