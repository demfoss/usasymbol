- id: why-these-cities-rank-highest
  icon: fa-solid fa-chart-line
  title: Why These Iowa Cities Rank Highest for Reported Crime
  paragraphs:
  - Fort Dodge ranks first because its combined 2024 reported crime rate is 4,256.8 per 100,000, which is 134.7
    points above Davenport. Property crime supplies 75.1% of Fort Dodge's total, while violent crime contributes
    1,061.1 points per 100,000.
  - The total-crime order is not automatically the violent-crime order. Fort Dodge has the highest violent-crime
    rate in this group at 1,061.1 per 100,000, while the published ranking combines violent and property offenses.
  - Coverage size also affects how quickly a rate moves. Clinton has the smallest FBI coverage population in this
    list at 24,171; one additional reported offense changes its rate by about 4.1 per 100,000. This mathematical
    effect explains volatility in smaller-city rates, not the underlying social causes of crime.
  facts:
  - Des Moines reports the largest raw combined offense count in this group (8,013), but Fort Dodge ranks first
    after population adjustment.
  - Fort Dodge also has the group's highest violent-crime rate, so its first-place total is not driven by property
    crime alone.
  - The list's largest adjacent gap is 743.2 rate points between Des Moines and Clinton.
  - Property crime's share ranges from 75.1% in Fort Dodge to 91.2% in Mason City.
  - 'Davenport has the highest property-crime rate in the group even though it ranks #2 on the combined list.'
faq:
- question: What city has the highest reported crime rate in Iowa?
  answer: Fort Dodge ranks first among qualifying city agencies matched to Census places at 4,256.8 total reported
    crimes per 100,000 residents covered in 2024.
- question: Why does Fort Dodge rank first for reported crime in Iowa?
  answer: Its combined violent and property crime rate is 4,256.8 per 100,000 residents covered. Property crime
    contributes 3,195.7 and violent crime contributes 1,061.1 per 100,000 to that total.
- question: What crimes are included in the total crime rate?
  answer: Violent crime includes murder, rape, robbery, and aggravated assault. Property crime includes burglary,
    larceny-theft, and motor vehicle theft. FBI Table 8 lists arson separately, so it is not added to the property
    total.
- question: Does a high city crime rate mean every neighborhood in Iowa is dangerous?
  answer: No. FBI Table 8 reports at the law-enforcement agency level. Crime can vary sharply within a city, and
    the dataset does not provide neighborhood-level risk.
- question: Why can coverage population differ from city population?
  answer: A police agency's jurisdiction may not match Census place boundaries exactly. The calculation uses the
    FBI coverage population because that is the population associated with the reported offenses.
