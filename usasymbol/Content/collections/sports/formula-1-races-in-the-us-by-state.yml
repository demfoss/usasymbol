page:
  h1: "Formula 1 Races in the US by State"
  intro_title: "Three States, One Season, and a Boom That's Happened Before"

  quick_answer:
    - "Three states currently host a Formula 1 World Championship race in the same season: Texas (Circuit of the Americas, Austin), Florida (Miami Grand Prix), and Nevada (Las Vegas Grand Prix)."
    - "Three US races in one season isn't new. 1982 also had three, Long Beach and Detroit street circuits plus the Caesars Palace Grand Prix in Las Vegas, and all three were gone from the calendar within six years."
    - "Eight states have hosted an F1 World Championship race since 1950: Texas, Florida, Nevada, California, New York, Michigan, Arizona, and Indiana."

  methodology: "Counts races that were part of the official Formula 1 World Championship calendar, which began in 1950. Pre-championship American Grand Prix races held in Savannah, Georgia (1908-1911) and Santa Monica, California (1914-1916), decades before Formula 1 existed, are not counted."

