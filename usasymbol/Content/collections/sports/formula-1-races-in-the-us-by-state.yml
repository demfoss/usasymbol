  - id: "the-last-time-the-us-had-three-f1-races-at-once"
    icon: "fa-solid fa-clock-rotate-left"
    title: "The Last Time the US Had Three F1 Races at Once"
    paragraphs:
      - "1982 was the first season any country hosted three World Championship rounds, all three in the United States: Long Beach in April, Detroit in June, and the Caesars Palace Grand Prix in a Las Vegas hotel parking lot in September. Many in the sport at the time called it a saturation point; none of the three drew crowds or acclaim to match Watkins Glen's."
      - "All three were gone from the calendar within six years. Caesars Palace lasted two runnings, Detroit lasted through 1988, and Long Beach's F1 race ended in 1983, though the city kept hosting IndyCar racing on a shortened version of the same street circuit for decades after."
      - "Today's three-race lineup rests on different footing. Formula 1's American owner, Liberty Media, bought the sport for roughly $8 billion in a deal completed in January 2017, and Netflix's Drive to Survive, launched in 2019, is credited with driving a reported 10 percent US fan base growth since it premiered. F1's global revenue nearly doubled, from $1.8 billion in 2017 to $3.41 billion in 2024."

  - id: "closing-facts"
    style: "gradient"
    title: "More Formula 1 in the US Facts"
    facts:
      - "Watkins Glen, New York, hosted the US Grand Prix for 20 straight years, 1961 to 1980, the longest run of any American F1 venue."
      - "The 1984 Dallas Grand Prix was run in over 100°F heat at Fair Park; the asphalt softened and broke apart during the race, and only 8 cars finished."
      - "The Phoenix street race drew an estimated 10,000-15,000 fans by its final 1990 running, and organizers cancelled the event in 1991 after a Chicago Bulls road game and a local ostrich race reportedly outdrew it."
      - "Long Beach's F1-era street circuit later became the long-running home of the IndyCar Grand Prix of Long Beach, still run on a version of the same downtown streets."

faq:
  - question: "How many Formula 1 races are held in the US?"
    answer: "Three: the United States Grand Prix at Circuit of the Americas in Austin, Texas, the Miami Grand Prix in Florida, and the Las Vegas Grand Prix in Nevada."

  - question: "Has the US ever hosted three F1 races in one season before?"
    answer: "Yes. 1982 was the first season any country hosted three World Championship rounds, all in the US: Long Beach, Detroit, and the Caesars Palace Grand Prix in Las Vegas. All three were off the calendar within six years."

  - question: "Which state has hosted a Formula 1 race the longest?"
    answer: "New York, where Watkins Glen hosted the US Grand Prix for 20 consecutive years, 1961 to 1980, the longest run of any American F1 venue."

  - question: "Which is the newest Formula 1 race in the US?"
    answer: "The Las Vegas Grand Prix, first held in 2023 on a street circuit down Las Vegas Boulevard, with recorded speeds above 212 mph."

  - question: "Why did Formula 1 stop racing in Dallas, Detroit, and Phoenix?"
    answer: "Each had a different problem. Dallas's Fair Park track surface broke apart in over 100°F heat during the 1984 race. Detroit's bumpy downtown street circuit ran through 1988 before losing its date. Phoenix drew estimated crowds as low as 10,000-15,000 by 1990 and was cancelled in 1991."

  - question: "How many states have ever hosted a Formula 1 World Championship race?"
    answer: "Eight: Texas, Florida, Nevada, California, New York, Michigan, Arizona, and Indiana, whose Indianapolis Motor Speedway hosted races in two separate eras, 1950-1960 and 2000-2007."

