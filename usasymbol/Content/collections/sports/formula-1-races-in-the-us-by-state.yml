sections:
  - id: "current-us-formula-1-races"
    icon: "fa-solid fa-flag-checkered"
    style: "law-cards"
    title: "Formula 1 Races in the US Today"
    paragraphs:
      - "Three US races currently share one F1 season, each built for a different kind of track."
    subsections:
      - subtitle: "Texas: United States Grand Prix at Circuit of the Americas"
        image: "/images/collections/sports/formula-1-races-in-the-us-by-state/texas-cota.jpg"
        text: |
          **First held:** 2012
          **Track type:** Permanent purpose-built circuit, 3.426 miles, 20 turns

          Circuit of the Americas, outside Austin, was the first purpose-built Formula 1 facility in the United States, designed by Hermann Tilke with a 133-foot elevation change and a first turn modeled on Britain's Silverstone. Its 2012 debut ended a five-year gap since Indianapolis last hosted a US race in 2007.

          COTA is the anchor of the current US boom because it is a permanent facility built specifically for F1, not a repurposed street circuit. That stability is exactly what the sport's earlier US venues, Dallas, Detroit, and Phoenix, never had.
        anchor_phrases:
          - "Circuit of the Americas"

      - subtitle: "Florida: Miami Grand Prix"
        image: "/images/collections/sports/formula-1-races-in-the-us-by-state/florida-miami.jpg"
        text: |
          **First held:** 2022
          **Track type:** Temporary circuit built around Hard Rock Stadium, 3.363 miles, 19 turns

          The Miami International Autodrome is built entirely from the parking lots surrounding Hard Rock Stadium, home of the NFL's Miami Dolphins, without using any public roads. Its 2022 debut averaged 2.6 million US TV viewers, the most ever for a live F1 telecast in the country.

          Miami proved a US race built around a major sports venue, rather than closed city streets, could draw both a crowd and a television audience, a template Las Vegas would follow a year later with a different setting.
        anchor_phrases:
          - "Miami International Autodrome"

      - subtitle: "Nevada: Las Vegas Grand Prix"
        image: "/images/collections/sports/formula-1-races-in-the-us-by-state/nevada-las-vegas.jpg"
        text: |
          **First held:** 2023
          **Track type:** Street circuit down the Las Vegas Strip, 3.8 miles, 17 turns

          The Las Vegas Grand Prix runs at night down Las Vegas Boulevard, past the Strip's casinos and hotels, and cars reach recorded speeds above 212 mph on its long straight, among the fastest of any circuit on the calendar.

          Las Vegas is the newest of the three current US races and the one built most explicitly as a spectacle, night racing on a world-famous street, mirroring the glitz of the sport's earlier, short-lived Caesars Palace race on a different part of the same city 41 years earlier.
        anchor_phrases:
          - "Las Vegas Grand Prix"

