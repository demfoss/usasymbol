sections:
  - id: table-intro
    icon: "fa-solid fa-list"
    title: "Every State's Official Sport, Listed"
    paragraphs:
      - "19 states have written an official sport into law, and 5 of them named more than one. The oldest designation is Maryland's, from 1962; the newest is Montana's, from 2025."

  - id: first-official-state-sports
    icon: "fa-solid fa-clock-rotate-left"
    title: "The First Official State Sports"
    paragraphs:
      - "Texas is often credited as the first state to name an official sport, but the record actually belongs to Maryland, 35 years earlier."
    subsections:
      - subtitle: "Maryland: Jousting (1962)"
        text: "**Adopted:** 1962\n**Signature event:** St. Mary's County Fair Joust\n\nMaryland named jousting its official state sport in 1962, making it the first US state to formalize any sport at all. State Delegate Henry J. Fowler, who also led the Maryland Jousting Tournament Association, introduced the bill after ring tournaments had already run in Maryland since the colony's earliest English governors. Riders gallop an 80-yard course spearing small metal rings with a lance, a contest organized around county fairs rather than a professional league.\n\nThat head start is why Maryland, not Texas, holds the actual first-in-the-nation claim. No other state had named an official sport for 35 years after Maryland's law took effect."
        anchor_phrases:
          - "Maryland named jousting its official state sport in 1962"
      - subtitle: "Texas: Rodeo (1997)"
        text: "**Adopted:** 1997\n**Signature event:** West of the Pecos Rodeo, Pecos (since 1883)\n\nTexas named rodeo its official state sport in 1997, and Governor George W. Bush signed the resolution that June, naming Houston, San Antonio, and Fort Worth as home to the state's internationally known rodeos. The choice traced to Pecos, where ranch hands staged what is widely credited as the world's first rodeo on July 4, 1883. Bill Pickett, a Black cowboy from Taylor, Texas, invented the steer-wrestling event still used in rodeo today and became the first African American inducted into the National Rodeo Hall of Fame in 1972.\n\nTexas is frequently called the first state with an official sport, and its 1997 law did start a wave, with Wyoming and South Dakota following in 2003. But that title belongs to Maryland's 1962 jousting law."
        anchor_phrases:
          - "Texas named rodeo its official state sport in 1997"

  - id: state-sports-invented-within-their-own-state
    icon: "fa-solid fa-lightbulb"
    title: "State Sports Invented Within Their Own State"
    paragraphs:
      - "Most states named a sport already popular somewhere else. A few named the sport their own residents actually invented."
    subsections:
      - subtitle: "Massachusetts: Basketball (2006) and Volleyball (2014)"
        text: "**Adopted:** 2006 (basketball), 2014 (volleyball)\n**Birthplaces:** Springfield and Holyoke, 20 miles apart\n\nJames Naismith invented basketball in Springfield in 1891, nailing two peach baskets to a gymnasium balcony at the International YMCA Training School. Four years later and 20 miles away, YMCA instructor William G. Morgan invented volleyball at the Holyoke YMCA, originally naming it Mintonette. Massachusetts named basketball the sport of the commonwealth in 2006, a proposal that began as a class project by fourth-graders at the Mulready School in Hudson, then added volleyball as its recreational and team sport in 2014.\n\nFew states can claim the birthplace of one widely played sport. Massachusetts can claim two, both invented in YMCA gymnasiums a few miles apart."
        anchor_phrases:
          - "James Naismith invented basketball in Springfield in 1891"
      - subtitle: "Washington: Pickleball (2022)"
        text: "**Adopted:** 2022\n**Invented:** Bainbridge Island, summer 1965\n\nPickleball began on Bainbridge Island in 1965, when state representative Joel Pritchard, Bill Bell, and Barney McCallum came back from golf to find their families with nothing to do. Unable to find a full set of badminton rackets, they lowered the net and improvised with ping-pong paddles and a perforated plastic ball. Washington's legislature named pickleball the official state sport in 2022, after the bill passed the Senate 46 to 1 and the House 83 to 15.\n\nWashington is the only state whose official sport was also invented inside its own borders."
        anchor_phrases:
          - "Pickleball began on Bainbridge Island in 1965"
      - subtitle: "Missouri: Jumping Jack (2014)"
        text: "**Adopted:** 2014\n**Credited inventor:** Gen. John J. Pershing, born near Laclede, Missouri, 1860\n\nMissouri's official state exercise honors General John J. Pershing, who is credited with inventing the jumping jack drill for cadets while serving as a tactical officer at West Point. Pershing was born near Laclede in 1860 and later commanded the American Expeditionary Forces in World War I. Successive fourth-grade classes at Pershing Elementary School in St. Joseph lobbied lawmakers for years before the designation finally passed in 2014.\n\nMissouri paired that honor with a second one: archery, made the state's official sport in 2022 after Missouri bowyer Holless Wilbur Allen invented the compound bow in 1966."
        anchor_phrases:
          - "credited with inventing the jumping jack"

  - id: states-with-more-than-one-official-sport
    icon: "fa-solid fa-layer-group"
    title: "States With More Than One Official Sport"
    paragraphs:
      - "5 states have named more than one official sport, usually splitting the honor between an individual activity and a team game. Maryland leads with 3: jousting (1962), lacrosse (2004), and walking (2008). Colorado, Hawaii, Massachusetts, and Missouri each have 2."
      - "Hawaii's split is the most deliberate. Outrigger canoe paddling became the state team sport in 1986, and surfing became the state individual sport in 1998, twelve years apart because lawmakers wanted a team-based tradition and a solo one recognized separately."

  - id: every-other-states-official-sport
    icon: "fa-solid fa-trophy"
    title: "Every Other State's Official Sport"
    paragraphs:
      - "The remaining designations span dog mushing in Alaska to curling in North Dakota, each tied to a real state law and a real local tradition."
    highlights:
      - name: "Alaska: Dog Mushing (1972)"
        image: "/images/sports/alaska/dog-mushing-hero.jpg"
        description: "Alaska named dog mushing its state sport in 1972, a year before the first full Iditarod Trail Sled Dog Race ran in March 1973. Sled dogs carried people, mail, and supplies across Alaska's winters long before the sport became a spectator race."
      - name: "California: Surfing (2018)"
        image: "/images/sports/california/surfing-huntington-beach.jpg"
        description: "California named surfing its state sport in 2018, tracing the choice to 1907, when Hawaiian waterman George Freeth first rode a board off the Redondo Beach pier. Huntington Beach now holds the trademarked nickname Surf City USA."
      - name: "Colorado: Pack Burro Racing (2012)"
        image: "/images/sports/colorado/pack-burro-racing-fairplay.jpg"
        description: "Colorado's state summer heritage sport has runners lead, not ride, a burro over mountain trails, a nod to miners who once led pack-loaded burros through the same high country. Elementary school students in Fairplay petitioned for the honor starting in 2007."
      - name: "Colorado: Skiing and Snowboarding (2008)"
        image: "/images/sports/colorado/skiing-snowboarding-vail.jpg"
        description: "Colorado's state winter sport traces to the Army's 10th Mountain Division, which trained at Camp Hale during World War II. Veterans of the division went on to found Arapahoe Basin, Aspen Mountain, and Vail."
      - name: "Delaware: Bicycling (2014)"
        image: "/images/sports/delaware/bicycling-jack-markell-trail.jpg"
        description: "Delaware has the lowest mean elevation of any US state, which makes cycling practical almost anywhere. Students from Wilbur Elementary School in Bear testified before lawmakers in support of the 2014 designation."
      - name: "Hawaii: Outrigger Canoe Paddling (1986)"
        image: "/images/sports/hawaii/outrigger-canoe-molokai-hoe.jpg"
        description: "Hawaii's state team sport, heihei waʻa, descends from the double-hulled canoes that first carried Polynesian voyagers to the islands. The designation followed renewed interest sparked by the canoe Hōkūleʻa's 1976 voyage to Tahiti."
      - name: "Hawaii: Surfing (1998)"
        image: "/images/sports/hawaii/surfing-pipeline-north-shore.jpg"
        description: "Hawaii's state individual sport, heʻe nalu, was practiced by Native Hawaiian aliʻi centuries before European contact. Ancient chiefs rode long olo boards on waves reserved for royalty alone."
      - name: "Maryland: Lacrosse (2004)"
        image: "/images/sports/maryland/lacrosse-johns-hopkins-maryland.jpg"
        description: "Maryland's state team sport recognizes a game Native American nations played for centuries before Europeans arrived. Johns Hopkins and the University of Maryland have played their lacrosse rivalry since 1904."
      - name: "Maryland: Walking (2008)"
        image: "/images/sports/maryland/walking-chesapeake-bay-bridge.jpg"
        description: "Maryland became the first state to name an official exercise in 2008, citing rising obesity rates and the Surgeon General's recommendation of 30 minutes of daily activity. The Chesapeake Bay Bridge Walk let residents cross the span on foot from 1975 to 2006."
      - name: "Michigan: American Football (1972)"
        image: "/images/sports/michigan/football-hero.jpg"
        description: "Michigan named American football its official state sport in 1972, the same year Alaska and Michigan both formalized a sport. The designation reflects a state built around college and high school football traditions from Ann Arbor to Detroit."
      - name: "Minnesota: Ice Hockey (2009)"
        image: "/images/sports/minnesota/ice-hockey-minnesota.jpg"
        description: "Minnesota's designation followed a petition drive by sixth-graders at Minnetonka Middle School East, who collected more than 600 signatures. The United States Hockey Hall of Fame has stood in Eveleth, Minnesota, since 1973."
      - name: "Missouri: Archery (2022)"
        image: "/images/sports/missouri/archery-hall-of-fame-springfield.jpg"
        description: "Missouri is the only state to name archery its official sport, a choice tied to bowyer Holless Wilbur Allen, who invented the compound bow in Missouri in 1966. The Archery Hall of Fame and Museum has occupied space inside Bass Pro Shops in Springfield since 2012."
      - name: "Montana: Rodeo (2025)"
        image: "/images/sports/montana/red-lodge-home-of-champions-rodeo.jpg"
        description: "Montana became the fourth state to name rodeo its official sport in 2025, after Texas, Wyoming, and South Dakota. Red Lodge's Home of Champions Rodeo has run nearly every July since 1929."
      - name: "New Hampshire: Skiing (1998)"
        image: "/images/sports/new-hampshire/cannon-mountain-aerial-tramway.jpg"
        description: "New Hampshire built one of the country's earliest ski industries around its White Mountains. Katharine Peckett opened the first ski school in America at Sugar Hill in 1929, and Cannon Mountain opened North America's first passenger aerial tramway in 1938."
      - name: "New York: Baseball (2021)"
        image: "/images/sports/new-york/national-baseball-hall-of-fame-cooperstown.jpg"
        description: "The idea for New York's state sport began in a Cooperstown elementary school, where fourth-graders studying state government noticed New York had never named one. The National Baseball Hall of Fame has stood in Cooperstown since 1939."
      - name: "North Carolina: Stock Car Racing (2011)"
        image: "/images/sports/north-carolina/nascar-hall-of-fame-charlotte.jpg"
        description: "More than 90 percent of NASCAR Cup Series teams are headquartered in the Charlotte region. The sport traces to Prohibition-era bootleggers like Junior Johnson, who outran revenue agents before turning that driving skill into a racing career."
      - name: "North Dakota: Curling (2023)"
        image: "/images/sports/north-dakota/capital-curling-club-bismarck.jpg"
        description: "North Dakota has 11 curling clubs, more than any other state, a legacy of Scottish and Canadian immigrants who settled the Red River Valley. Eleven-year-old Bismarck curler Alaina Schmit brought the proposal to lawmakers herself."
      - name: "South Dakota: Rodeo (2003)"
        image: "/images/sports/south-dakota/black-hills-roundup-belle-fourche.jpg"
        description: "South Dakota's bill was sponsored by State Representative Larry Rhoden, who became the state's governor in 2025. Belle Fourche's Black Hills Roundup has run nearly every year since 1918."
      - name: "Wyoming: Rodeo (2003)"
        image: "/images/sports/wyoming/cheyenne-frontier-days-crowd.jpg"
        description: "Wyoming's Bucking Horse and Rider symbol has appeared on license plates since 1936, the longest-running plate design in the world, years before rodeo became official. Cheyenne Frontier Days has run since 1897 and calls itself the world's largest outdoor rodeo."

  - id: state-sport-facts
    icon: "fa-solid fa-star"
    style: "gradient"
    title: "State Sport Facts"
    facts:
      - "Rodeo is the most-designated state sport, named official by 4 states: Texas, Wyoming, South Dakota, and Montana."
      - "Maryland, not Texas, was the first state to name an official sport, in 1962, 35 years before Texas's 1997 rodeo law."
      - "Massachusetts is the only state that can claim the birthplace of two of its official sports: basketball (Springfield, 1891) and volleyball (Holyoke, 1895)."
      - "Missouri is the only state to name archery its official sport, honoring compound bow inventor Holless Wilbur Allen."
      - "Washington is the only state whose official sport, pickleball, was invented within its own borders in the same era the state later made it official."
      - "Three of the last four state sport designations, adopted by Missouri (2022), North Dakota (2023), and Montana (2025), began with a petition or proposal from a student or child."

faq:
  - question: "Which state was the first to name an official sport?"
    answer: "Maryland was first, naming jousting its state sport in 1962. Texas is sometimes credited as first for its 1997 rodeo law, but that came 35 years after Maryland's."

  - question: "How many states have an official state sport?"
    answer: "19 states have named at least one official sport, for a combined 25 designations."

  - question: "Which states have more than one official sport?"
    answer: "5 states have named more than one: Maryland (3), and Colorado, Hawaii, Massachusetts, and Missouri (2 each)."

  - question: "What is the most common official state sport?"
    answer: "Rodeo, named official by 4 states: Texas (1997), Wyoming (2003), South Dakota (2003), and Montana (2025)."

  - question: "Is Oklahoma's official sport wrestling?"
    answer: "No. Oklahoma has not designated an official state sport by law, despite the state's strong wrestling tradition."

  - question: "Which state's official sport was invented there?"
    answer: "Washington's official sport, pickleball, was invented on Bainbridge Island in 1965. Massachusetts can also claim two of its sports, basketball and volleyball, both invented within the state in the 1890s."

