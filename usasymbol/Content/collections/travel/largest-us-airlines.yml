faq:
  - question: "What is the largest airline in the United States?"
    answer: "American Airlines, with about 224 million passengers in 2025. Delta was second at about 200 million."

  - question: "What are the big four U.S. airlines?"
    answer: "American, Delta, United, and Southwest. Each carried more than 160 million passengers in 2025, nearly three times as many as Alaska Airlines, the next largest."

  - question: "Which state has the most airline headquarters?"
    answer: "Texas. American Airlines is based in Fort Worth and Southwest in Dallas, so two of the four largest U.S. airlines answer to North Texas."

  - question: "Is Southwest the largest domestic airline?"
    answer: "Southwest carries more domestic passengers than almost any other airline because nearly all of its flights stay inside the United States. Counting international flights too, American is larger."

  - question: "Where is Delta Air Lines headquartered?"
    answer: "Atlanta, Georgia, next to Hartsfield-Jackson Atlanta International, the busiest airport in the country and Delta's largest hub."

