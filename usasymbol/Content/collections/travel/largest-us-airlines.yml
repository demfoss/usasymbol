page:
  h1: "Largest Airlines in the United States"
  intro_title: "Four Giants and the Airlines Chasing Them"

  quick_answer:
    - "American Airlines is the largest U.S. airline, with about 224 million passengers in 2025. Its biggest hub sits at Dallas/Fort Worth, a short drive from its Fort Worth headquarters."
    - "Delta, United, and Southwest follow, and together with American they carry most of the country's air travelers. Texas is home to two of the four, American in Fort Worth and Southwest in Dallas."
    - "Below the big four, the next airline is far smaller. Alaska Airlines carried about 59 million passengers after buying Hawaiian Airlines in 2024."

  methodology: "Passengers carried in 2025 as reported by each airline and compiled in Wikipedia's list of largest airlines in North America, with Delta's figure from its full-year 2025 results. Some airlines count passengers on regional partners and some do not, so figures are rounded and best read as approximate."

  sources:
