sections:
  - id: "largest-us-airlines"
    icon: "fa-solid fa-plane"
    style: "law-cards"
    title: "Largest U.S. Airlines and Their Home States"
    paragraphs:
      - "Each airline below is listed with the state where it keeps its headquarters and its biggest base. Codes are the two-character IATA airline codes printed on tickets and departure boards, and the full list of [airline codes](https://goairports.org/airlines) covers carriers worldwide."
    subsections:
      - subtitle: "American Airlines"
        text: "**Home state:** Texas\n**Main hub:** Dallas/Fort Worth\n\n[American Airlines](https://goairports.org/airlines/north-america/united-states/american-airlines/) carried about 224 million passengers in 2025, more than any other airline in the country. Its largest hub, Dallas/Fort Worth International, sits a few miles from its Fort Worth headquarters.\n\nSize came through mergers. American absorbed US Airways in 2013, which added hubs in Charlotte, Philadelphia, and Phoenix to its network."
      - subtitle: "Delta Air Lines"
        text: "**Home state:** Georgia\n**Main hub:** Atlanta\n\n[Delta Air Lines](https://goairports.org/airlines/north-america/united-states/delta-air-lines/) carried about 200 million passengers in 2025. It began in 1925 as a crop-dusting company in Macon, Georgia, and moved its headquarters to Atlanta in 1941.\n\nAtlanta's Hartsfield-Jackson, the busiest airport in the country, is Delta's home hub. Most of its passengers there are connecting between two Delta flights."
      - subtitle: "United Airlines"
        text: "**Home state:** Illinois\n**Main hub:** Chicago O'Hare\n\n[United Airlines](https://goairports.org/airlines/north-america/united-states/united-airlines/) carried about 181 million passengers in 2025 from its headquarters in Chicago's Willis Tower. Its hubs include Chicago O'Hare, Denver, Houston, Newark, San Francisco, and Washington Dulles.\n\nUnited flies more international routes than most rivals, a reach it gained largely from its 2010 merger with Continental Airlines."
      - subtitle: "Southwest Airlines"
        text: "**Home state:** Texas\n**Main base:** Dallas Love Field\n\n[Southwest Airlines](https://goairports.org/airlines/north-america/united-states/southwest-airlines/) carried about 168 million passengers in 2025. It started in 1971 with flights between Dallas, Houston, and San Antonio, all inside Texas.\n\nSouthwest still flies point to point rather than through classic hubs, and it carries more domestic passengers than almost any other airline. Its stock ticker is LUV, a nod to its home at Dallas Love Field."
      - subtitle: "Alaska Airlines"
        text: "**Home state:** Washington\n**Main hub:** Seattle-Tacoma\n\nAlaska Airlines carried about 59 million passengers in 2025. Its parent company bought Hawaiian Airlines in 2024, adding Honolulu routes and long-haul jets to a network built around Seattle.\n\nThe airline is named for the state where it began in the 1930s, though its headquarters has been in the Seattle area for decades."
      - subtitle: "JetBlue Airways"
        text: "**Home state:** New York\n**Main hub:** New York JFK\n\nJetBlue carried about 39 million passengers in 2025 from its headquarters in Long Island City, Queens. Its first flight left JFK in February 2000.\n\nNew York's crowded airports are the reason JetBlue exists. It was built to sell low fares out of JFK, and Boston and Fort Lauderdale became its other major bases."
      - subtitle: "Frontier Airlines"
        text: "**Home state:** Colorado\n**Main base:** Denver\n\nFrontier carried about 33 million passengers in 2025. Every plane wears a different animal on its tail, a tradition from its Denver roots.\n\nFrontier is an ultra low-cost carrier, selling a cheap base fare and charging separately for bags, seats, and other extras."
      - subtitle: "Spirit Airlines"
        text: "**Home state:** Florida\n**Main base:** Fort Lauderdale\n\nSpirit carried about 32 million passengers in 2025 from its headquarters in Dania Beach, Florida. Its bright yellow planes made it the best-known ultra low-cost airline in the country.\n\nSpirit filed for bankruptcy protection in November 2024 and again in August 2025, so its place on this list depends on how far it shrinks."
      - subtitle: "Allegiant Air"
        text: "**Home state:** Nevada\n**Main base:** Las Vegas\n\nAllegiant carried about 19 million passengers in 2025. It flies mostly from small and midsize cities to vacation spots like Las Vegas, Orlando, and the Florida Gulf Coast.\n\nMany of its routes run only a few days a week, which lets Allegiant serve towns that bigger airlines skip."
      - subtitle: "Sun Country Airlines"
        text: "**Home state:** Minnesota\n**Main base:** Minneapolis-Saint Paul\n\nSun Country carried about 4 million passengers in 2025. It flies scheduled leisure routes from Minneapolis, especially to warm destinations in winter.\n\nIts business mixes passenger flights with charter flying and cargo flights for Amazon, which keeps its planes busy when vacation demand drops."

