page:
  h1: "Famous Inventions From Every State"
  intro_title: "18 States, 18 Inventions: From Edison's Light Bulb to the Integrated Circuit"

  quick_answer:
    - "Thomas Edison invented the light bulb and phonograph at his laboratory in Menlo Park, New Jersey, in the late 1870s."
    - "The Wright brothers made the first powered flight at Kitty Hawk, North Carolina, on December 17, 1903, though they designed and built the plane at their bicycle shop in Dayton, Ohio."
    - "Pennsylvania is usually credited with the first general-purpose computer, the 1945 ENIAC, but Iowa's Atanasoff-Berry Computer, built between 1939 and 1942, has the stronger legal claim after a 1973 court ruling invalidated ENIAC's patent."

  methodology: "Entries reflect where each invention was actually developed, patented, or first demonstrated, which is not always the inventor's birth state. Only inventions with a clear, well-documented tie to a single state are included, so this list covers 18 states rather than all 50."

