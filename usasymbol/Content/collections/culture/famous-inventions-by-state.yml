sections:
  - id: where-americas-most-famous-inventions-actually-happened
    icon: "fa-solid fa-lightbulb"
    title: "Where America's Most Famous Inventions Actually Happened"
    paragraphs:
      - "Some of the country's most famous inventions happened in a state most people wouldn't guess, or split across two states entirely."
    subsections:
      - subtitle: "New Jersey: The Light Bulb (1879)"
        text: "**Inventor:** Thomas Edison\n**Location:** Menlo Park, New Jersey\n\nThomas Edison built his research laboratory in Menlo Park, New Jersey, in 1876 and used it to develop the practical incandescent light bulb, first demonstrated publicly in 1879. The same lab produced the phonograph in 1877, the first device to record and play back sound.\n\nEdison was born in Milan, Ohio, but it was the Menlo Park lab, not his birthplace, that earned him the nickname the Wizard of Menlo Park."
        anchor_phrases:
          - "Thomas Edison built his research laboratory in Menlo Park, New Jersey"
      - subtitle: "North Carolina: The Airplane (1903)"
        text: "**Inventors:** Orville and Wilbur Wright\n**Location:** Kitty Hawk, North Carolina\n\nOn December 17, 1903, Orville Wright piloted the Wright Flyer for 12 seconds over the dunes at Kitty Hawk, the first sustained, controlled, powered flight in history. North Carolina still puts First in Flight on its license plates because of that morning.\n\nThe Wright brothers actually designed and built the plane 600 miles away, in their bicycle shop in Dayton, Ohio, which is why Ohio's state quarter calls itself the Birthplace of Aviation. Both claims are accurate; they just describe different parts of the same invention."
        anchor_phrases:
          - "the first sustained, controlled, powered flight in history"

  - id: the-real-first-computer-pennsylvania-or-iowa
    icon: "fa-solid fa-microchip"
    title: "The Real First Computer: Pennsylvania or Iowa?"
    paragraphs:
      - "Most textbooks credit Pennsylvania with the first computer. A federal court disagreed."
    subsections:
      - subtitle: "Pennsylvania: ENIAC (1945)"
        text: "**Inventors:** John Mauchly and J. Presper Eckert\n**Location:** University of Pennsylvania\n\nENIAC, the Electronic Numerical Integrator and Computer, was completed in 1945 at the University of Pennsylvania's Moore School of Electrical Engineering. Built for the US Army to calculate artillery trajectories, it weighed over 30 tons, used 18,000 vacuum tubes, and filled nearly 2,000 square feet. It is popularly remembered as the first general-purpose electronic computer.\n\nENIAC's own patent didn't survive a legal challenge. In 1973, a federal court ruled that Mauchly and Eckert had drawn on earlier work by John Vincent Atanasoff, invalidating the ENIAC patent."
        anchor_phrases:
          - "ENIAC, the Electronic Numerical Integrator and Computer, was completed in 1945"
      - subtitle: "Iowa: The Atanasoff-Berry Computer (1939-1942)"
        text: "**Inventors:** John Vincent Atanasoff and Clifford Berry\n**Location:** Iowa State College\n\nPhysics professor John Vincent Atanasoff and graduate student Clifford Berry built the Atanasoff-Berry Computer at Iowa State College between 1939 and 1942, using binary arithmetic and more than 300 vacuum tubes years before ENIAC existed. World War II interrupted further development, and the two never patented the machine.\n\nThat 1973 court ruling gave Atanasoff, not Mauchly and Eckert, the legal title of inventor of the first electronic digital computer, even though ENIAC remains the more famous name."
        anchor_phrases:
          - "built the Atanasoff-Berry Computer at Iowa State College between 1939 and 1942"

  - id: more-famous-inventions-by-state
    icon: "fa-solid fa-flask"
    title: "More Famous Inventions by State"
    paragraphs:
      - "The rest of the list spans a revolver forged in Hartford to a piece of tape rolled out in St. Paul."
    highlights:
      - name: "Massachusetts: The Telephone (1876)"
        image: "/images/collections/culture/famous-inventions-by-state/bell-telephone-boston.jpg"
        description: "Alexander Graham Bell patented the telephone in Boston in 1876 and made the first call to his assistant, Thomas Watson, in the next room."
      - name: "Connecticut: The Revolver (1836)"
        image: "/images/collections/culture/famous-inventions-by-state/colt-revolver-hartford.jpg"
        description: "Samuel Colt patented the first commercially viable revolving-cylinder pistol and built his factory in Hartford in 1836, standardizing interchangeable parts for firearms."
      - name: "Michigan: The Moving Assembly Line (1913)"
        image: "/images/collections/culture/famous-inventions-by-state/ford-assembly-line-highland-park.jpg"
        description: "Henry Ford installed the first moving assembly line for automobiles at his Highland Park, Michigan plant in 1913, cutting Model T production time from 12 hours to about 90 minutes."
      - name: "Wisconsin: The Modern Typewriter (1868)"
        image: "/images/collections/culture/famous-inventions-by-state/sholes-typewriter-milwaukee.jpg"
        description: "Christopher Latham Sholes developed and patented the first practical typewriter in Milwaukee in 1868, later selling the design to Remington."
      - name: "Illinois: The Ferris Wheel (1893)"
        image: "/images/collections/culture/famous-inventions-by-state/ferris-wheel-chicago.jpg"
        description: "Engineer George Ferris built the original Ferris Wheel for the 1893 World's Columbian Exposition in Chicago, a 264-foot answer to the Eiffel Tower."
      - name: "Minnesota: Scotch Tape (1930)"
        image: "/images/collections/culture/famous-inventions-by-state/scotch-tape-st-paul.jpg"
        description: "3M engineer Richard Drew developed transparent Scotch tape at the company's St. Paul labs in 1930, following his earlier invention of masking tape there in 1925."
      - name: "Georgia: Coca-Cola (1886)"
        image: "/images/collections/culture/famous-inventions-by-state/coca-cola-atlanta.jpg"
        description: "Pharmacist John Pemberton invented Coca-Cola in Atlanta in 1886, first selling it as a soda fountain drink for five cents a glass."
      - name: "Tennessee: Cotton Candy (1897)"
        image: "/images/collections/culture/famous-inventions-by-state/cotton-candy-nashville.jpg"
        description: "Dentist William Morrison and confectioner John C. Wharton patented an electric cotton candy machine in Nashville in 1897, debuting it nationally at the 1904 St. Louis World's Fair."
      - name: "Texas: The Integrated Circuit (1958)"
        image: "/images/collections/culture/famous-inventions-by-state/integrated-circuit-texas-instruments.jpg"
        description: "Jack Kilby built the first working integrated circuit at Texas Instruments in Dallas in 1958, a breakthrough that won him the Nobel Prize in Physics in 2000."
      - name: "California: The Apple I Computer (1976)"
        image: "/images/collections/culture/famous-inventions-by-state/apple-i-cupertino.jpg"
        description: "Steve Wozniak designed and hand-built the Apple I in the Los Altos and Cupertino area in 1976, the machine that launched Apple with Steve Jobs."
      - name: "Utah: Electronic Television (1927)"
        image: "/images/collections/culture/famous-inventions-by-state/farnsworth-television.jpg"
        description: "Utah-born Philo Farnsworth, who conceived the idea of electronic television as a Rigby, Idaho teenager, achieved the first working electronic television transmission in 1927 and filed his patent the same year."
      - name: "Missouri: The Ice Cream Cone (1904)"
        image: "/images/collections/culture/famous-inventions-by-state/ice-cream-cone-st-louis.jpg"
        description: "The ice cream cone was popularized at the 1904 St. Louis World's Fair, where several vendors independently rolled waffles into cones to serve ice cream. No single inventor is universally credited."
      - name: "Ohio: The Electric Self-Starter (1911)"
        image: "/images/collections/culture/famous-inventions-by-state/kettering-self-starter-dayton.jpg"
        description: "Charles Kettering, born in Loudonville, Ohio, successfully tested the automobile's first electric self-starter in Dayton on February 16, 1911, ending the era of dangerous hand-crank starts."
      - name: "New York: The Safety Elevator (1854)"
        image: "/images/collections/culture/famous-inventions-by-state/otis-elevator-new-york.jpg"
        description: "Elisha Otis demonstrated his safety elevator, which locked in place if its hoisting cable snapped, at the 1854 New York Crystal Palace Exhibition, making tall buildings practical."

faq:
  - question: "Which state invented the light bulb?"
    answer: "New Jersey. Thomas Edison developed the practical incandescent light bulb at his Menlo Park laboratory, first demonstrating it in 1879."

  - question: "Which state did the Wright brothers fly from?"
    answer: "The first powered flight happened at Kitty Hawk, North Carolina, on December 17, 1903. The Wright brothers designed and built the plane in Dayton, Ohio."

  - question: "What state invented the first computer?"
    answer: "Pennsylvania is popularly credited for ENIAC (1945), but a 1973 federal court ruling gave the legal title to Iowa's Atanasoff-Berry Computer, built between 1939 and 1942."

  - question: "Where was Coca-Cola invented?"
    answer: "Atlanta, Georgia. Pharmacist John Pemberton invented Coca-Cola there in 1886."

  - question: "Who invented the integrated circuit and where?"
    answer: "Jack Kilby built the first working integrated circuit at Texas Instruments in Dallas, Texas, in 1958, an achievement that later won him the Nobel Prize in Physics."

  - question: "Was Thomas Edison born in New Jersey?"
    answer: "No. Edison was born in Milan, Ohio. He invented the light bulb and phonograph at his laboratory in Menlo Park, New Jersey, as an adult."

