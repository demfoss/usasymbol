sections:
  - id: "athlete-by-state"
    icon: "fa-solid fa-medal"
    style: "law-cards"
    title: "Most Famous Athlete From Every State"
    paragraphs:
      - "Baseball and football dominate the list, but boxing, track and field, and even speed skating each claim a state of their own. Every pick below is tied to where the athlete grew up and first competed, not just where they were born."
    highlights:
      - name: "Alabama: Henry Aaron"
        image: "/images/collections/culture/most-famous-athlete-by-state/alabama.jpg"
        description: "Henry Aaron grew up in Mobile and became one of baseball's greatest hitters, earning induction into the National Baseball Hall of Fame. That combination of power and longevity makes him Alabama's clearest choice."

      - name: "Alaska: Trajan Langdon"
        image: "/images/collections/culture/most-famous-athlete-by-state/alaska.jpg"
        description: "Trajan Langdon starred at Duke as an All-American guard before a long pro career and now serves as president of basketball operations for the Detroit Pistons. Alaska produces few nationally known athletes, and Langdon's front-office standing keeps him the state's top pick."

      - name: "Arizona: Jim Palmer"
        image: "/images/collections/culture/most-famous-athlete-by-state/arizona.jpg"
        description: "Jim Palmer won three Cy Young Awards and more games than any other pitcher during the 1970s. His sustained dominance over a full decade gives Arizona a pick built on consistency rather than a single signature moment."

      - name: "Arkansas: Sonny Liston"
        image: "/images/collections/culture/most-famous-athlete-by-state/arkansas.jpg"
        description: "Sonny Liston fought his way into the International Boxing Hall of Fame as one of the most feared heavyweights of his era. His punching power alone made him a national figure, which is why he represents Arkansas."

      - name: "California: Tom Brady"
        image: "/images/collections/culture/most-famous-athlete-by-state/california.jpg"
        description: "Tom Brady attended high school in San Mateo before going on to win seven Super Bowl championships, more than any other player in NFL history. No other state pick on this list matches that championship total, which makes him the natural headline entry."

      - name: "Colorado: Jack Dempsey"
        image: "/images/collections/culture/most-famous-athlete-by-state/colorado.jpg"
        description: "Jack Dempsey held the world heavyweight title from 1919 to 1926 and became one of the first athletes to draw million-dollar gates. Colorado's boxing history begins and ends with him."

      - name: "Connecticut: Hilary Knight"
        image: "/images/collections/culture/most-famous-athlete-by-state/connecticut.jpg"
        description: "Hilary Knight has won two Olympic gold medals and three silvers with the U.S. women's ice hockey team. Her sustained Olympic run over multiple Games makes her Connecticut's representative."

      - name: "Delaware: Randy White"
        image: "/images/collections/culture/most-famous-athlete-by-state/delaware.jpg"
        description: "Randy White earned nine Pro Bowl selections and shared MVP honors in Super Bowl XII as a Dallas Cowboys defensive lineman. Delaware rarely produces a player of his caliber, and that championship pedigree secures his spot."

      - name: "Florida: Deion Sanders"
        image: "/images/collections/culture/most-famous-athlete-by-state/florida.jpg"
        description: "Deion Sanders played professional football and baseball in the same year, a feat almost no modern athlete has matched. That dual-sport career, plus his Pro Football Hall of Fame induction, makes him Florida's pick over a deep field of contenders."

      - name: "Georgia: Ty Cobb"
        image: "/images/collections/culture/most-famous-athlete-by-state/georgia.jpg"
        description: "Ty Cobb earned the nickname the Georgia Peach and became one of the most dominant hitters the sport has ever seen. His name is still shorthand for early-era baseball excellence in his home state."

      - name: "Hawaii: Duke Kahanamoku"
        image: "/images/collections/culture/most-famous-athlete-by-state/hawaii.jpg"
        description: "Duke Kahanamoku won three Olympic gold medals in swimming and is widely credited as the father of modern surfing. Few athletes are as tied to their state's identity, which is why he represents Hawaii."

      - name: "Idaho: Harmon Killebrew"
        image: "/images/collections/culture/most-famous-athlete-by-state/idaho.jpg"
        description: "Harmon Killebrew hit 573 career home runs over 22 seasons, a total that still ranks among the best in baseball history. That power output makes him Idaho's clear representative."

      - name: "Illinois: Jackie Joyner-Kersee"
        image: "/images/collections/culture/most-famous-athlete-by-state/illinois.jpg"
        description: "Jackie Joyner-Kersee won six Olympic medals across the heptathlon and long jump and still holds the world heptathlon record set in 1988. That combination of range and longevity makes her Illinois's choice."

      - name: "Indiana: Larry Bird"
        image: "/images/collections/culture/most-famous-athlete-by-state/indiana.jpg"
        description: "Larry Bird won three NBA championships and three MVP awards with the Boston Celtics after starring at Indiana State. His deep ties to Indiana basketball culture make him the obvious pick."

      - name: "Iowa: Dan Gable"
        image: "/images/collections/culture/most-famous-athlete-by-state/iowa.jpg"
        description: "Dan Gable finished his college wrestling career with a 117-1 record and won Olympic gold in 1972 without surrendering a single point. Iowa's wrestling identity runs directly through his name."

      - name: "Kansas: Barry Sanders"
        image: "/images/collections/culture/most-famous-athlete-by-state/kansas.jpg"
        description: "Barry Sanders won the Heisman Trophy at Oklahoma State and retired with the fourth-most rushing yards in NFL history despite walking away in his prime. That combination of peak production and mystery makes him Kansas's pick."

      - name: "Kentucky: Muhammad Ali"
        image: "/images/collections/culture/most-famous-athlete-by-state/kentucky.jpg"
        description: "Muhammad Ali won Olympic gold in 1960 and became a three-time heavyweight champion out of Louisville. He is arguably the single most recognizable athlete on this entire list, which makes Kentucky's choice an easy one."

      - name: "Louisiana: Peyton Manning"
        image: "/images/collections/culture/most-famous-athlete-by-state/louisiana.jpg"
        description: "Peyton Manning grew up in New Orleans and retired holding the NFL career records for passing yards and touchdowns. Louisiana's football tradition finds its clearest national ambassador in him."

      - name: "Maine: Joan Benoit Samuelson"
        image: "/images/collections/culture/most-famous-athlete-by-state/maine.jpg"
        description: "Joan Benoit Samuelson won the first-ever Olympic women's marathon in 1984, running the race in 2 hours 24 minutes 52 seconds. That milestone win, run for a sport just opening its biggest stage to women, makes her Maine's representative."

      - name: "Maryland: Babe Ruth"
        image: "/images/collections/culture/most-famous-athlete-by-state/maryland.jpg"
        description: "Babe Ruth grew up in Baltimore and won seven World Series titles as one of the first true two-way stars in baseball. No athlete on this list is more synonymous with American sports history, which secures Maryland's pick."

      - name: "Massachusetts: Rocky Marciano"
        image: "/images/collections/culture/most-famous-athlete-by-state/massachusetts.jpg"
        description: "Rocky Marciano retired as heavyweight champion with an undefeated record, a feat no other heavyweight titleholder has matched. Massachusetts's boxing history centers on that unbeaten run."

      - name: "Michigan: Joe Louis"
        image: "/images/collections/culture/most-famous-athlete-by-state/michigan.jpg"
        description: "Joe Louis held the heavyweight title for more than a decade, the longest reign in boxing history at the weight. Michigan's connection to boxing greatness runs through him."

      - name: "Minnesota: Bronko Nagurski"
        image: "/images/collections/culture/most-famous-athlete-by-state/minnesota.jpg"
        description: "Bronko Nagurski is regarded as one of the most complete players ever to take an NFL field, starring on both offense and defense. Minnesota's earliest football legend remains its representative."

      - name: "Mississippi: Walter Payton"
        image: "/images/collections/culture/most-famous-athlete-by-state/mississippi.jpg"
        description: "Walter Payton retired as the second all-time leading rusher in NFL history and earned Pro Football Hall of Fame induction. Mississippi's football tradition points directly to him."

      - name: "Missouri: Yogi Berra"
        image: "/images/collections/culture/most-famous-athlete-by-state/missouri.jpg"
        description: "Yogi Berra won ten World Series titles, more than any other player in MLB history. That record alone makes him Missouri's clearest choice."

      - name: "Montana: Dave McNally"
        image: "/images/collections/culture/most-famous-athlete-by-state/montana.jpg"
        description: "Dave McNally made three All-Star teams and won two World Series titles as a pitcher for the Baltimore Orioles. Montana rarely produces a major league star, and McNally's championship résumé keeps him at the top."

      - name: "Nebraska: Bob Gibson"
        image: "/images/collections/culture/most-famous-athlete-by-state/nebraska.jpg"
        description: "Bob Gibson won two Cy Young Awards and two World Series titles while pitching for the St. Louis Cardinals. Nebraska's baseball legacy centers on his dominance on the mound."

      - name: "Nevada: Greg Maddux"
        image: "/images/collections/culture/most-famous-athlete-by-state/nevada.jpg"
        description: "Greg Maddux won four consecutive Cy Young Awards and 18 Gold Gloves over a 23-year career. That rare mix of pitching precision and defensive skill makes him Nevada's pick."

      - name: "New Hampshire: Carlton Fisk"
        image: "/images/collections/culture/most-famous-athlete-by-state/new-hampshire.jpg"
        description: "Carlton Fisk hit the iconic walk-off home run in Game 6 of the 1975 World Series, one of baseball's most replayed moments. New Hampshire's baseball identity is tied to that single swing."

      - name: "New Jersey: Carl Lewis"
        image: "/images/collections/culture/most-famous-athlete-by-state/new-jersey.jpg"
        description: "Carl Lewis won nine Olympic gold medals across four separate Olympic Games in sprinting and the long jump. That span of dominance across more than a decade makes him New Jersey's representative."

      - name: "New Mexico: Ralph Kiner"
        image: "/images/collections/culture/most-famous-athlete-by-state/new-mexico.jpg"
        description: "Ralph Kiner led the National League in home runs seven consecutive seasons, a run no other player has matched. New Mexico's Baseball Hall of Fame connection runs through him."

      - name: "New York: Jim Brown"
        image: "/images/collections/culture/most-famous-athlete-by-state/new-york.jpg"
        description: "Jim Brown won three NFL MVP awards and later became a prominent civil rights activist off the field. New York's football history includes plenty of stars, but few combined on-field dominance with off-field impact the way Brown did."

      - name: "North Carolina: Michael Jordan"
        image: "/images/collections/culture/most-famous-athlete-by-state/north-carolina.jpg"
        description: "Michael Jordan starred at the University of North Carolina before winning six NBA championships and five MVP awards with the Chicago Bulls. His college roots keep him tied to North Carolina, where he is widely considered the greatest basketball player ever."

      - name: "North Dakota: Roger Maris"
        image: "/images/collections/culture/most-famous-athlete-by-state/north-dakota.jpg"
        description: "Roger Maris hit 61 home runs in the 1961 season, breaking Babe Ruth's single-season record that had stood for 34 years. North Dakota's most famous athletic feat belongs to him."

      - name: "Ohio: LeBron James"
        image: "/images/collections/culture/most-famous-athlete-by-state/ohio.jpg"
        description: "LeBron James grew up in Akron and has won NBA championships with three different franchises across more than two decades. Ohio's basketball identity is inseparable from his career."

      - name: "Oklahoma: Jim Thorpe"
        image: "/images/collections/culture/most-famous-athlete-by-state/oklahoma.jpg"
        description: "Jim Thorpe won Olympic gold in the pentathlon and decathlon and later became the first president of the league that would become the NFL. Few athletes in American history matched his range across sports, which makes him Oklahoma's pick."

      - name: "Oregon: Don Schollander"
        image: "/images/collections/culture/most-famous-athlete-by-state/oregon.jpg"
        description: "Don Schollander won seven Olympic gold medals in swimming during the 1960s, becoming the first swimmer to win four golds at a single Games. Oregon's Olympic swimming legacy starts with him."

      - name: "Pennsylvania: Wilt Chamberlain"
        image: "/images/collections/culture/most-famous-athlete-by-state/pennsylvania.jpg"
        description: "Wilt Chamberlain scored 100 points in a single NBA game in 1962, a record that has never been approached since. Pennsylvania's basketball history has no bigger single-game feat than that."

      - name: "Rhode Island: Nap Lajoie"
        image: "/images/collections/culture/most-famous-athlete-by-state/rhode-island.jpg"
        description: "Nap Lajoie batted .426 in 1901, still the highest single-season batting average in American League history. Rhode Island's earliest baseball star remains its representative more than a century later."

      - name: "South Carolina: Joe Frazier"
        image: "/images/collections/culture/most-famous-athlete-by-state/south-carolina.jpg"
        description: "Joe Frazier won Olympic gold in 1964 before becoming undisputed heavyweight champion, famously handing Muhammad Ali his first professional loss. South Carolina's boxing legacy centers on that rivalry."

      - name: "South Dakota: Becky Hammon"
        image: "/images/collections/culture/most-famous-athlete-by-state/south-dakota.jpg"
        description: "Becky Hammon earned six WNBA All-Star selections before moving into coaching, where she became one of the first women to serve as an NBA head coach candidate. South Dakota's basketball tradition points to her."

      - name: "Tennessee: Wilma Rudolph"
        image: "/images/collections/culture/most-famous-athlete-by-state/tennessee.jpg"
        description: "Wilma Rudolph became the first American woman to win three gold medals in a single Olympics, at the 1960 Rome Games. Tennessee's track and field history has no bigger name."

      - name: "Texas: Simone Biles"
        image: "/images/collections/culture/most-famous-athlete-by-state/texas.jpg"
        description: "Simone Biles has won seven Olympic gold medals and 30 world championship medals, the most of any gymnast in history. Texas produces plenty of star athletes, but none with a medal count that matches hers."

      - name: "Utah: Merlin Olsen"
        image: "/images/collections/culture/most-famous-athlete-by-state/utah.jpg"
        description: "Merlin Olsen earned 14 Pro Bowl selections as part of the Los Angeles Rams' Fearsome Foursome defensive line. Utah's football legacy runs through his sustained excellence at defensive tackle."

      - name: "Vermont: Mikaela Shiffrin"
        image: "/images/collections/culture/most-famous-athlete-by-state/vermont.jpg"
        description: "Mikaela Shiffrin has won multiple Olympic gold medals and World Cup skiing titles across a career built in New England's mountains. Vermont's skiing tradition finds its top ambassador in her."

      - name: "Virginia: Arthur Ashe"
        image: "/images/collections/culture/most-famous-athlete-by-state/virginia.jpg"
        description: "Arthur Ashe remains the only Black man to win the Australian Open, Wimbledon, and the U.S. Open. Virginia's tennis history and its broader civil rights history both run through him."

      - name: "Washington: John Stockton"
        image: "/images/collections/culture/most-famous-athlete-by-state/washington.jpg"
        description: "John Stockton retired as the NBA's all-time leader in both assists and steals, records that still stand. Washington's basketball identity centers on that combination of playmaking and defense."

      - name: "West Virginia: Jerry West"
        image: "/images/collections/culture/most-famous-athlete-by-state/west-virginia.jpg"
        description: "Jerry West earned 12 All-NBA selections, and his silhouette became the model for the NBA's official logo. West Virginia's basketball legacy is literally embedded in the league's branding through him."

      - name: "Wisconsin: Eric Heiden"
        image: "/images/collections/culture/most-famous-athlete-by-state/wisconsin.jpg"
        description: "Eric Heiden won all five individual speed skating gold medals at the 1980 Lake Placid Olympics, a sweep no other athlete has repeated at a single Winter Games. Wisconsin's Olympic legacy has no equal to that performance."

      - name: "Wyoming: Boyd Dowler"
        image: "/images/collections/culture/most-famous-athlete-by-state/wyoming.jpg"
        description: "Boyd Dowler won five NFL championships, including two Super Bowls, as a receiver for the Vince Lombardi-era Green Bay Packers. Wyoming's football tradition is thin, which makes his championship run its clear standout."

  - id: "one-sport-two-states-athlete-by-state"
    icon: "fa-solid fa-scale-balanced"
    title: "How Different Sports Dominate Different States"
    paragraphs:
      - "Baseball claims more state picks than any other sport, from Henry Aaron in Alabama to Roger Maris in North Dakota. Boxing runs a close second, with four states, Arkansas, Colorado, Michigan, and Kentucky, built around heavyweight champions."
      - "A handful of states break the pattern entirely. Iowa's pick is a wrestler, Wisconsin's is a speed skater, and Vermont's is an alpine skier, a reminder that the list follows each state's own sporting culture rather than a single national sport."

