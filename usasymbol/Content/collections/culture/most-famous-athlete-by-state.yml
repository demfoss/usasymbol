page:
  h1: "Most Famous Athlete From Every State"
  intro_title: "One Defining Athlete for Every State in the Union"

  quick_answer:
    - "Tom Brady represents California, where he attended high school, with seven Super Bowl championships, more than any other player in NFL history."
    - "Simone Biles represents Texas with seven Olympic gold medals and 30 world championship medals, the most decorated gymnast in the sport's history."
    - "Michael Jordan represents North Carolina, where he starred at the University of North Carolina, with six NBA championships and five MVP awards."
    - "Boxing produced four state picks alone: Sonny Liston in Arkansas, Jack Dempsey in Colorado, Joe Louis in Michigan, and Muhammad Ali in Kentucky."

  methodology: "Sports Illustrated ranked the five best athletes from each of the 50 states for a 2026 package tied to America's 250th anniversary, based primarily on where each athlete attended high school, or spent their formative years if homeschooled, rather than strict birthplace. This collection uses SI's top-ranked athlete for each state."

  sources:
    - name: "Sports Illustrated: Ranking America's Best Athletes From Every State"
      url: "https://www.si.com/ranking-best-athletes-from-every-state-in-america"
      description: "Sports Illustrated's state-by-state ranking of the five best athletes from each state, based on where each athlete attended high school or spent their formative years"

