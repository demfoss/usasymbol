faq:
  - question: "Who is the most famous athlete from California?"
    answer: "Tom Brady represents California, where he attended high school in San Mateo, with seven Super Bowl championships, more than any other player in NFL history."

  - question: "Who is the most famous athlete from Texas?"
    answer: "Simone Biles represents Texas. She has won seven Olympic gold medals and 30 world championship medals, the most decorated gymnast in the sport's history."

  - question: "Who is the most famous athlete from North Carolina?"
    answer: "Michael Jordan represents North Carolina, where he starred at the University of North Carolina before his NBA career with the Chicago Bulls."

  - question: "Which state's pick is a boxer?"
    answer: "Four states are represented by boxers: Sonny Liston in Arkansas, Jack Dempsey in Colorado, Joe Louis in Michigan, and Muhammad Ali in Kentucky."

  - question: "How was the most famous athlete from each state determined?"
    answer: "Sports Illustrated ranked the five best athletes from each state based mainly on where they attended high school or spent their formative years, not strict birthplace, and this list uses SI's top-ranked athlete per state."

  - question: "Who is the most famous athlete from Ohio?"
    answer: "LeBron James represents Ohio. He grew up in Akron and has won NBA championships with three different franchises over more than two decades."

