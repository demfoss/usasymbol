sections:
  - id: "scientist-by-state"
    icon: "fa-solid fa-flask"
    style: "law-cards"
    title: "Most Famous Scientist From Every State"
    paragraphs:
      - "A handful of names on this list, Edison and Franklin among them, are known well beyond the world of science. Most of the rest built their reputations inside a single field, from genetics to information theory, before the awards and the textbooks carried their names further."
    highlights:
      - name: "Alabama: Edward O. Wilson"
        image: "/images/collections/culture/most-famous-scientist-by-state/alabama.jpg"
        description: "Edward O. Wilson was born in Birmingham, Alabama, in 1929 and became the world's leading authority on ants before earning two Pulitzer Prizes for his writing on biodiversity and human nature."

      - name: "Alaska: Susan Henrichs"
        image: "/images/collections/culture/most-famous-scientist-by-state/alaska.jpg"
        description: "Susan Henrichs was born and raised in Anchorage, Alaska, and built a research career in marine organic chemistry before serving as provost of the University of Alaska Fairbanks."

      - name: "Arizona: Emmett Chappelle"
        image: "/images/collections/culture/most-famous-scientist-by-state/arizona.jpg"
        description: "Emmett Chappelle was born in Phoenix, Arizona, and developed bioluminescence-based methods at NASA for detecting life, work that later earned him a place in the National Inventors Hall of Fame."

      - name: "Arkansas: William J. Darby"
        image: "/images/collections/culture/most-famous-scientist-by-state/arkansas.jpg"
        description: "William J. Darby was born in North Little Rock, Arkansas, and spent decades researching nutrition science at Vanderbilt University before his 1972 election to the National Academy of Sciences."

      - name: "California: Gordon Moore"
        image: "/images/collections/culture/most-famous-scientist-by-state/california.jpg"
        description: "Gordon Moore was born in Pescadero, California, in 1929 and co-founded Intel, where his 1965 prediction about transistor density became known as Moore's Law."

      - name: "Colorado: Willard Libby"
        image: "/images/collections/culture/most-famous-scientist-by-state/colorado.jpg"
        description: "Willard Libby was born in Grand Valley, Colorado, and won the 1960 Nobel Prize in Chemistry for developing the radiocarbon dating method used across archaeology and geology."

      - name: "Connecticut: John Franklin Enders"
        image: "/images/collections/culture/most-famous-scientist-by-state/connecticut.jpg"
        description: "John Franklin Enders was born in West Hartford, Connecticut, and shared the 1954 Nobel Prize in Physiology or Medicine for cultivating poliovirus in the lab, work that earned him the nickname the Father of Modern Vaccines."

      - name: "Delaware: Annie Jump Cannon"
        image: "/images/collections/culture/most-famous-scientist-by-state/delaware.jpg"
        description: "Annie Jump Cannon was born in Dover, Delaware, in 1863 and personally classified the spectra of hundreds of thousands of stars, work that became the foundation of modern stellar classification."

      - name: "Florida: Kenneth M. Ford"
        image: "/images/collections/culture/most-famous-scientist-by-state/florida.jpg"
        description: "Kenneth M. Ford was born in Florida and founded the Florida Institute for Human and Machine Cognition, where his research has focused on artificial intelligence and human-computer collaboration."

      - name: "Georgia: Charles Herty"
        image: "/images/collections/culture/most-famous-scientist-by-state/georgia.jpg"
        description: "Charles Herty was born in Milledgeville, Georgia, in 1867 and redesigned how turpentine and rosin were collected from pine trees, a method that reshaped the entire Southern naval stores industry."

      - name: "Hawaii: Isabella Abbott"
        image: "/images/collections/culture/most-famous-scientist-by-state/hawaii.jpg"
        description: "Isabella Abbott was born on Maui in 1919 and became the first Native Hawaiian woman to earn a PhD in science, building a career as the leading authority on Pacific marine algae."

      - name: "Idaho: James Rainwater"
        image: "/images/collections/culture/most-famous-scientist-by-state/idaho.jpg"
        description: "James Rainwater was born in Council, Idaho, in 1917 and shared the 1975 Nobel Prize in Physics for his theory explaining the asymmetric shape of certain atomic nuclei."

      - name: "Illinois: Edward Doisy"
        image: "/images/collections/culture/most-famous-scientist-by-state/illinois.jpg"
        description: "Edward Doisy was born in Hume, Illinois, in 1893 and shared the 1943 Nobel Prize in Physiology or Medicine for discovering the chemical structure of vitamin K."

      - name: "Indiana: Margaret Hamilton"
        image: "/images/collections/culture/most-famous-scientist-by-state/indiana.jpg"
        description: "Margaret Hamilton was born in Paoli, Indiana, and led the team that wrote the on-board flight software for NASA's Apollo program, coining the term software engineering along the way."

      - name: "Iowa: James Van Allen"
        image: "/images/collections/culture/most-famous-scientist-by-state/iowa.jpg"
        description: "James Van Allen was born in Mount Pleasant, Iowa, in 1914 and discovered the radiation belts that circle Earth, now named after him, using data from the first American satellite."

      - name: "Kansas: Jack Kilby"
        image: "/images/collections/culture/most-famous-scientist-by-state/kansas.jpg"
        description: "Jack Kilby was born in Great Bend, Kansas, in 1923 and co-invented the integrated circuit at Texas Instruments, an achievement that earned him the 2000 Nobel Prize in Physics."

      - name: "Kentucky: Thomas Hunt Morgan"
        image: "/images/collections/culture/most-famous-scientist-by-state/kentucky.jpg"
        description: "Thomas Hunt Morgan was born in Lexington, Kentucky, and won the 1933 Nobel Prize in Physiology or Medicine for showing that chromosomes carry hereditary information."

      - name: "Louisiana: Ken Thompson"
        image: "/images/collections/culture/most-famous-scientist-by-state/louisiana.jpg"
        description: "Ken Thompson was born in New Orleans, Louisiana, in 1943 and designed the original Unix operating system at Bell Labs, later co-inventing the Go programming language and winning the Turing Award."

      - name: "Maine: Victor McKusick"
        image: "/images/collections/culture/most-famous-scientist-by-state/maine.jpg"
        description: "Victor McKusick was born on a dairy farm in Parkman, Maine, in 1921 and founded the first medical genetics clinic at Johns Hopkins, work that earned him recognition as the father of medical genetics."

      - name: "Maryland: Benjamin Banneker"
        image: "/images/collections/culture/most-famous-scientist-by-state/maryland.jpg"
        description: "Benjamin Banneker was born in Baltimore County, Maryland, in 1731, built one of the first striking clocks made in America, and helped survey the original boundaries of Washington, D.C."

      - name: "Massachusetts: Benjamin Franklin"
        image: "/images/collections/culture/most-famous-scientist-by-state/massachusetts.jpg"
        description: "Benjamin Franklin was born in Boston, Massachusetts, in 1706 and won the Royal Society's Copley Medal for his experiments on electricity, including his description of the lightning rod."

      - name: "Michigan: Claude Shannon"
        image: "/images/collections/culture/most-famous-scientist-by-state/michigan.jpg"
        description: "Claude Shannon was born in Petoskey, Michigan, in 1916 and published A Mathematical Theory of Communication in 1948, the paper that founded the field of information theory."

      - name: "Minnesota: Melvin Calvin"
        image: "/images/collections/culture/most-famous-scientist-by-state/minnesota.jpg"
        description: "Melvin Calvin was born in St. Paul, Minnesota, in 1911 and won the 1961 Nobel Prize in Chemistry for mapping the chemical steps of photosynthesis, a pathway now called the Calvin cycle."

      - name: "Mississippi: Lafayette Frederick"
        image: "/images/collections/culture/most-famous-scientist-by-state/mississippi.jpg"
        description: "Lafayette Frederick was born near Friars Point, Mississippi, in 1923 and built a research career in plant pathology and mycology, becoming a leading specialist in myxomycete ecology."

      - name: "Missouri: George Washington Carver"
        image: "/images/collections/culture/most-famous-scientist-by-state/missouri.jpg"
        description: "George Washington Carver was born into slavery in Diamond, Missouri, and developed dozens of alternative crop products and soil conservation techniques that reshaped Southern agriculture."

      - name: "Montana: Maurice Hilleman"
        image: "/images/collections/culture/most-famous-scientist-by-state/montana.jpg"
        description: "Maurice Hilleman was born in Miles City, Montana, in 1919 and developed more vaccines than any other scientist, including eight of the fourteen routinely given to children today."

      - name: "Nebraska: George Beadle"
        image: "/images/collections/culture/most-famous-scientist-by-state/nebraska.jpg"
        description: "George Beadle was born in Wahoo, Nebraska, in 1903 and shared the 1958 Nobel Prize in Physiology or Medicine for the one-gene-one-enzyme hypothesis that linked genes to biochemical function."

      - name: "Nevada: Mary Hill Fulstone"
        image: "/images/collections/culture/most-famous-scientist-by-state/nevada.jpg"
        description: "Mary Hill Fulstone was born in Eureka, Nevada, in 1892 and became the longest-practicing physician in Nevada history, delivering care across the state's rural mining communities for decades."

      - name: "New Hampshire: Charles Greeley Abbot"
        image: "/images/collections/culture/most-famous-scientist-by-state/new-hampshire.jpg"
        description: "Charles Greeley Abbot was born in Wilton, New Hampshire, in 1872 and spent decades measuring variations in the sun's energy output as head of the Smithsonian Astrophysical Observatory."

      - name: "New Jersey: Frederick Reines"
        image: "/images/collections/culture/most-famous-scientist-by-state/new-jersey.jpg"
        description: "Frederick Reines was born in Paterson, New Jersey, in 1918 and won the 1995 Nobel Prize in Physics for the first experimental detection of the neutrino."

      - name: "New Mexico: Floy Agnes Lee"
        image: "/images/collections/culture/most-famous-scientist-by-state/new-mexico.jpg"
        description: "Floy Agnes Lee was born in Albuquerque, New Mexico, in 1922 and worked as a biologist on the Manhattan Project at Los Alamos, one of the few Native American scientists on the wartime research team."

      - name: "New York: Richard Feynman"
        image: "/images/collections/culture/most-famous-scientist-by-state/new-york.jpg"
        description: "Richard Feynman was born in Queens, New York, in 1918 and won the 1965 Nobel Prize in Physics for his work on quantum electrodynamics, later becoming one of science's best-known public teachers."

      - name: "North Carolina: Kary Mullis"
        image: "/images/collections/culture/most-famous-scientist-by-state/north-carolina.jpg"
        description: "Kary Mullis was born in Lenoir, North Carolina, in 1944 and won the 1993 Nobel Prize in Chemistry for inventing the polymerase chain reaction, the DNA-copying method now used in labs worldwide."

      - name: "North Dakota: Kenneth Libbrecht"
        image: "/images/collections/culture/most-famous-scientist-by-state/north-dakota.jpg"
        description: "Kenneth Libbrecht was born in Fargo, North Dakota, in 1958 and became a Caltech physics professor known for his research on crystal growth and his widely reproduced photographs of snowflakes."

      - name: "Ohio: Thomas Edison"
        image: "/images/collections/culture/most-famous-scientist-by-state/ohio.jpg"
        description: "Thomas Edison was born in Milan, Ohio, in 1847 and held more than 1,000 patents by the end of his life, including the practical incandescent light bulb and the phonograph."

      - name: "Oklahoma: Joseph F. Hoffman"
        image: "/images/collections/culture/most-famous-scientist-by-state/oklahoma.jpg"
        description: "Joseph F. Hoffman was born in Oklahoma City, Oklahoma, in 1925 and spent his career researching the physiology of red blood cells, earning election to the National Academy of Sciences in 1981."

      - name: "Oregon: Linus Pauling"
        image: "/images/collections/culture/most-famous-scientist-by-state/oregon.jpg"
        description: "Linus Pauling was born in Portland, Oregon, in 1901 and remains the only person to win two unshared Nobel Prizes, for Chemistry in 1954 and for Peace in 1962."

      - name: "Pennsylvania: Rachel Carson"
        image: "/images/collections/culture/most-famous-scientist-by-state/pennsylvania.jpg"
        description: "Rachel Carson was born in Springdale, Pennsylvania, in 1907 and published Silent Spring in 1962, a book documenting the effects of pesticides that helped launch the modern environmental movement."

      - name: "Rhode Island: Joseph Brown"
        image: "/images/collections/culture/most-famous-scientist-by-state/rhode-island.jpg"
        description: "Joseph Brown was born in Providence, Rhode Island, in 1733 and taught as one of the college's first science professors while pursuing astronomy alongside his work as an industrialist and architect."

      - name: "South Carolina: Charles Townes"
        image: "/images/collections/culture/most-famous-scientist-by-state/south-carolina.jpg"
        description: "Charles Townes was born in Greenville, South Carolina, in 1915 and won the 1964 Nobel Prize in Physics for work that led directly to the invention of the laser."

      - name: "South Dakota: Ernest Lawrence"
        image: "/images/collections/culture/most-famous-scientist-by-state/south-dakota.jpg"
        description: "Ernest Lawrence was born in Canton, South Dakota, in 1901 and invented the cyclotron in 1929, an achievement that earned him the 1939 Nobel Prize in Physics and later gave his name to the element lawrencium."

      - name: "Tennessee: Mildred Stahlman"
        image: "/images/collections/culture/most-famous-scientist-by-state/tennessee.jpg"
        description: "Mildred Stahlman was born in Nashville, Tennessee, in 1922 and built the nation's first modern newborn intensive care unit, pioneering treatments that transformed neonatology."

      - name: "Texas: Robert Curl"
        image: "/images/collections/culture/most-famous-scientist-by-state/texas.jpg"
        description: "Robert Curl was born in Alice, Texas, in 1933 and shared the 1996 Nobel Prize in Chemistry for the discovery of fullerenes, the soccer-ball-shaped carbon molecules known as buckyballs."

      - name: "Utah: Philo Farnsworth"
        image: "/images/collections/culture/most-famous-scientist-by-state/utah.jpg"
        description: "Philo Farnsworth was born in Beaver, Utah, in 1906 and transmitted the first fully electronic television image at age 21, laying the technical groundwork for modern television."

      - name: "Vermont: Nettie Stevens"
        image: "/images/collections/culture/most-famous-scientist-by-state/vermont.jpg"
        description: "Nettie Stevens was born in Cavendish, Vermont, in 1861 and discovered in 1905 that sex is determined by chromosomes, a finding that overturned the leading theories of her era."

      - name: "Virginia: Matthew Fontaine Maury"
        image: "/images/collections/culture/most-famous-scientist-by-state/virginia.jpg"
        description: "Matthew Fontaine Maury was born in Spotsylvania County near Fredericksburg, Virginia, in 1806 and mapped the ocean's winds and currents, work that earned him the nickname Pathfinder of the Seas."

      - name: "Washington: Philip Abelson"
        image: "/images/collections/culture/most-famous-scientist-by-state/washington.jpg"
        description: "Philip Abelson was born in Tacoma, Washington, in 1913 and co-discovered the element neptunium before developing isotope separation techniques used in the Manhattan Project."

      - name: "West Virginia: Katherine Johnson"
        image: "/images/collections/culture/most-famous-scientist-by-state/west-virginia.jpg"
        description: "Katherine Johnson was born in White Sulphur Springs, West Virginia, in 1918 and calculated the trajectories for America's early crewed spaceflights, work later depicted in the film Hidden Figures."

      - name: "Wisconsin: Charles Van Hise"
        image: "/images/collections/culture/most-famous-scientist-by-state/wisconsin.jpg"
        description: "Charles Van Hise was born in Fulton, Wisconsin, in 1857 and became a pioneering geologist and conservationist while serving as president of the University of Wisconsin."

      - name: "Wyoming: George Frison"
        image: "/images/collections/culture/most-famous-scientist-by-state/wyoming.jpg"
        description: "George Frison was born in Worland, Wyoming, in 1924 and became one of the nation's leading Paleoindian archaeologists, earning election to the National Academy of Sciences for his work on early hunting sites."

  - id: "how-these-scientists-changed-their-fields"
    icon: "fa-solid fa-atom"
    title: "How These Scientists Changed Their Fields"
    paragraphs:
      - "Nine of the fifty entries on this list are Nobel laureates, including Linus Pauling of Oregon, who remains the only person ever to win two unshared prizes in different categories. Several others, including Thomas Edison of Ohio and Claude Shannon of Michigan, never won a Nobel Prize but reshaped entire industries anyway."
      - "A handful of names built their careers on discoveries once dismissed or overlooked. Nettie Stevens of Vermont identified sex chromosomes in 1905 at a time when the leading theory credited environmental factors, and Katherine Johnson of West Virginia calculated orbital trajectories by hand years before her work reached wide public recognition."

