faq:
  - question: "Who is the most famous scientist from Ohio?"
    answer: "Thomas Edison represents Ohio, born in Milan in 1847. He held more than 1,000 patents, including the practical light bulb and the phonograph."

  - question: "Who is the most famous scientist from New York?"
    answer: "Richard Feynman represents New York, born in Queens. He won the 1965 Nobel Prize in Physics and became one of science's most widely read public teachers."

