page:
  h1: "Most Famous Scientist From Every State"
  intro_title: "One Notable Scientist for Every State in the Union"

  quick_answer:
    - "Thomas Edison represents Ohio, born in Milan in 1847. He held more than 1,000 patents, including the practical light bulb and the phonograph."
    - "Linus Pauling represents Oregon, born in Portland in 1901. He remains the only person to win two unshared Nobel Prizes, in Chemistry and in Peace."
    - "Richard Feynman represents New York, born in Queens in 1918. He won the 1965 Nobel Prize in Physics and became one of the most widely read popularizers of science."
    - "Not every state has a Nobel laureate. Alaska's Susan Henrichs and Nevada's Mary Hill Fulstone are respected scientists in their fields without that level of international recognition."

  methodology: "Each state's scientist was selected by matching a documented birthplace to career achievement, since no single published index ranks a scientist for every state the way some entertainment outlets do for actors or musicians. Selections favor Nobel laureates and other scientists with major, well-documented achievements who were actually born in that state, drawing on biographical and institutional records. Where a state has no internationally famous scientist, the most documented working or historical scientist born there is used instead."

  sources:
    - name: "Wikipedia biographical entries"
      url: "https://en.wikipedia.org/wiki/Category:American_scientists"
      description: "Birthplace, career, and award information for American scientists, cross-checked against individual biography pages and, where applicable, NobelPrize.org"

