faq:
  - question: "Which state's native artist has won the most Grammys?"
    answer: "Texas. Houston-born Beyoncé has won 35 Grammy Awards from 99 nominations, more of both than any artist in history."

  - question: "Which artist born in Ohio has more than 20 Grammy nominations?"
    answer: "Two do. Dave Grohl, born in Warren, has 45 nominations and 19 wins, most of them with Foo Fighters. John Legend, born in Springfield, has 40 nominations and 13 wins."

  - question: "Which artist born in Michigan has more than 20 Grammy nominations?"
    answer: "Stevie Wonder, born in Saginaw, has 75 nominations and 25 wins. Madonna, born in Bay City, has 28 nominations and 7 wins."

  - question: "Which artist born in New Jersey has more than 20 Grammy nominations?"
    answer: "Bruce Springsteen leads with 51 nominations. Paul Simon has 36, Frank Sinatra 31, and Whitney Houston 25, which gives New Jersey more 20-plus nominees than any other state on this list."

  - question: "Which artist born in Georgia has more than 20 Grammy nominations?"
    answer: "Kanye West, born in Atlanta, has 76 nominations and 24 wins, though he grew up in Chicago. Ray Charles, born in Albany, has 37 nominations and 17 wins."

  - question: "Which artist born in Virginia has more than 20 Grammy nominations?"
    answer: "Pharrell Williams, born in Virginia Beach, has 39 nominations and 13 wins. Missy Elliott, born in Portsmouth, has 22 nominations and 4 wins, and the two often worked with fellow Virginian Timbaland."

  - question: "Is J. Cole from North Carolina?"
    answer: "J. Cole grew up in Fayetteville, North Carolina, but he was born in Frankfurt, Germany, on a U.S. Army base. He has 18 Grammy nominations."

  - question: "Which artist born in Missouri has the most Grammy nominations?"
    answer: "Eminem, born in St. Joseph, has 47 Grammy nominations and 15 wins. Sheryl Crow, born in Kennett, has 32 nominations and 9 wins."

  - question: "How many Grammys did Michael Jackson win?"
    answer: "Michael Jackson, born in Gary, Indiana, won 13 Grammy Awards from 38 nominations. Eight of them came in one night in 1984, a record no artist has broken."

  - question: "Who holds the record for most Album of the Year wins?"
    answer: "Pennsylvania's Taylor Swift has won Album of the Year four times. Frank Sinatra, Stevie Wonder, and Paul Simon share second place with three each."
