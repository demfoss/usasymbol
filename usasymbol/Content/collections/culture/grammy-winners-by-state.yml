sections:
  - id: "grammy-records-set-by-state-born-artists"
    icon: "fa-solid fa-trophy"
    title: "Grammy Records Set by State-Born Artists"
    paragraphs:
      - "Two artists on this list don't just have big win totals. They hold outright Grammy records."
    subsections:
      - subtitle: "Texas: Beyoncé, the Most Decorated Artist Ever"
        text: "**Born:** Houston, Texas\n**Grammy wins:** 35\n\nBeyoncé passed every other artist in Grammy history at the 2025 ceremony, where Cowboy Carter won Album of the Year and made her the first Black woman to win that award in the 21st century. Her 35 wins came from 99 nominations, both records for any artist.\n\nHer path there ran through nearly every genre the Grammys track, from Destiny's Child R&B records to a country album that finally broke her Album of the Year drought."
        anchor_phrases:
          - "Beyoncé passed every other artist in Grammy history"
      - subtitle: "Pennsylvania: Taylor Swift's Album of the Year Record"
        text: "**Born:** West Reading, Pennsylvania\n**Grammy wins:** 14, including a record 4 for Album of the Year\n\nTaylor Swift has won Album of the Year four times, for Fearless (2010), 1989 (2016), Folklore (2021), and Midnights (2024). No other artist, in any state, has won the award more than three times.\n\nHer 14 total wins put her behind several artists on raw count, but the Album of the Year record is hers alone."
        anchor_phrases:
          - "Taylor Swift has won Album of the Year four times"

  - id: "more-grammy-winning-artists-by-state"
    icon: "fa-solid fa-music"
    title: "More Grammy-Winning Artists by State"
    paragraphs:
      - "The rest of the list runs from a Chicago-born producer to a Kentucky coal miner's daughter."
    highlights:
      - name: "Illinois: Quincy Jones"
        image: "/images/collections/culture/grammy-winners-by-state/illinois.jpg"
        description: "Quincy Jones, born in Chicago, won 28 Grammy Awards across a seven-decade career as a producer, composer, and bandleader, more nominations (79) than any artist in Grammy history."
      - name: "Michigan: Stevie Wonder"
        image: "/images/collections/culture/grammy-winners-by-state/michigan.jpg"
        description: "Stevie Wonder, born in Saginaw, has won 25 Grammy Awards, including Album of the Year three times in the 1970s alone."
      - name: "New Jersey: Bruce Springsteen"
        image: "/images/collections/culture/grammy-winners-by-state/new-jersey.jpg"
        description: "Bruce Springsteen, born in Long Branch, has won 20 Grammy Awards. Fellow New Jersey native Lauryn Hill, born in South Orange, once won 5 Grammys in a single night for The Miseducation of Lauryn Hill in 1999."
      - name: "Mississippi: B.B. King"
        image: "/images/collections/culture/grammy-winners-by-state/mississippi.jpg"
        description: "B.B. King, born in Itta Bena, won 15 Grammy Awards over his blues career, plus a Lifetime Achievement Award in 1987."
      - name: "Georgia: Ray Charles"
        image: "/images/collections/culture/grammy-winners-by-state/georgia.jpg"
        description: "Ray Charles, born in Albany, won 13 Grammy Awards, 9 of them between 1960 and 1966 alone, plus a Lifetime Achievement Award."
      - name: "Ohio: John Legend"
        image: "/images/collections/culture/grammy-winners-by-state/ohio.jpg"
        description: "John Legend, born in Springfield, has won 12 Grammy Awards and became the first Black man to reach EGOT status, winning an Emmy, Grammy, Oscar, and Tony, in 2018."
      - name: "Tennessee: Dolly Parton"
        image: "/images/collections/culture/grammy-winners-by-state/tennessee.jpg"
        description: "Dolly Parton, born near Sevierville, has won 10 competitive Grammy Awards plus a Lifetime Achievement Award, from hits including 9 to 5 and Jolene."
      - name: "California: Billie Eilish"
        image: "/images/collections/culture/grammy-winners-by-state/california.jpg"
        description: "Billie Eilish, born in Los Angeles, has won 9 Grammy Awards, including Record of the Year and Album of the Year at her very first nomination in 2020, at age 18."
      - name: "Minnesota: Prince"
        image: "/images/collections/culture/grammy-winners-by-state/minnesota.jpg"
        description: "Prince, born in Minneapolis, won 7 Grammy Awards over a career that also earned him an Academy Award for Purple Rain's soundtrack."
      - name: "New York: Mariah Carey"
        image: "/images/collections/culture/grammy-winners-by-state/new-york.jpg"
        description: "Mariah Carey, born in Huntington on Long Island, has won 5 Grammy Awards, including Best New Artist for her 1990 debut."
      - name: "Louisiana: Harry Connick Jr."
        image: "/images/collections/culture/grammy-winners-by-state/louisiana.jpg"
        description: "Harry Connick Jr., born in New Orleans, has won 3 Grammy Awards, all for Best Jazz Male Vocal Performance."
      - name: "Kentucky: Loretta Lynn"
        image: "/images/collections/culture/grammy-winners-by-state/kentucky.jpg"
        description: "Loretta Lynn, born in Butcher Hollow, won 3 Grammy Awards, including Best Country Album in 2005 for Van Lear Rose, recorded with Jack White at age 72."

