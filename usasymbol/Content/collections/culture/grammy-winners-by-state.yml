  - id: "more-state-grammy-records"
    icon: "fa-solid fa-star"
    title: "More Grammy Records by State"
    paragraphs:
      - "Indiana's Michael Jackson, born in Gary, won 8 Grammys in a single night in 1984 on the strength of Thriller, a one-night record that still stands. North Carolina's Roberta Flack, born in Black Mountain, became the first artist to win Record of the Year two years running, for The First Time Ever I Saw Your Face and Killing Me Softly With His Song."
      - "Missouri has two artists past 30 nominations. Eminem, born in St. Joseph, has 47 and has won Best Rap Album six times, while Sheryl Crow, born in Kennett, has 32. Arkansas-born Johnny Cash won 13, the first of them for Jackson, a 1967 duet with June Carter."
      - "Some states' top winners are a surprise. Wisconsin's leader is Les Paul, born in Waukesha, the guitarist whose solid-body electric guitar and multitrack recording changed popular music. New Mexico's is John Denver, born in Roswell, whose only win came shortly after his death in 1997."

  - id: "more-grammy-winning-artists-by-state"
    icon: "fa-solid fa-music"
    title: "More Grammy-Winning Artists by State"
    paragraphs:
      - "The rest of the list runs from a Chicago-born producer to a Kentucky coal miner's daughter."
    highlights:
      - name: "Illinois: Quincy Jones"
        image: "/images/collections/culture/grammy-winners-by-state/illinois.jpg"
        description: "Quincy Jones, born in Chicago, won 28 Grammy Awards from 80 nominations across a seven-decade career as a producer, composer, and bandleader. He produced Michael Jackson's Thriller, the best-selling album of all time."
      - name: "Michigan: Stevie Wonder"
        image: "/images/collections/culture/grammy-winners-by-state/michigan.jpg"
        description: "Stevie Wonder, born in Saginaw, has won 25 Grammy Awards from 75 nominations, including Album of the Year three times in the 1970s alone."
      - name: "New Jersey: Bruce Springsteen"
        image: "/images/collections/culture/grammy-winners-by-state/new-jersey.jpg"
        description: "Bruce Springsteen, born in Long Branch, has won 20 Grammy Awards from 51 nominations. Fellow New Jersey native Lauryn Hill, born in East Orange, won 5 Grammys in a single night for The Miseducation of Lauryn Hill in 1999."
      - name: "Georgia: Ray Charles"
        image: "/images/collections/culture/grammy-winners-by-state/georgia.jpg"
        description: "Ray Charles, born in Albany, won 17 Grammy Awards. Eight of them came in a single night in 2005, months after his death, for Genius Loves Company, which also won Album of the Year."
      - name: "Mississippi: B.B. King"
        image: "/images/collections/culture/grammy-winners-by-state/mississippi.jpg"
        description: "B.B. King, born near Itta Bena, won 15 Grammy Awards over his blues career, starting with The Thrill Is Gone in 1971."
      - name: "Ohio: John Legend"
        image: "/images/collections/culture/grammy-winners-by-state/ohio.jpg"
        description: "John Legend, born in Springfield, has won 13 Grammy Awards and in 2018 became the first Black man to reach EGOT status, with an Emmy, Grammy, Oscar, and Tony."
      - name: "Tennessee: Dolly Parton"
        image: "/images/collections/culture/grammy-winners-by-state/tennessee.jpg"
        description: "Dolly Parton, born near Sevierville, has won 10 Grammy Awards from 55 nominations, with hits including 9 to 5 and Jolene."
      - name: "California: Billie Eilish"
        image: "/images/collections/culture/grammy-winners-by-state/california.jpg"
        description: "Billie Eilish, born in Los Angeles, has won 10 Grammy Awards. At 18 she swept Record, Album, and Song of the Year plus Best New Artist in 2020, and she won Song of the Year again in 2026 for Wildflower."
      - name: "Minnesota: Prince"
        image: "/images/collections/culture/grammy-winners-by-state/minnesota.jpg"
        description: "Prince, born in Minneapolis, won 7 Grammy Awards from 37 nominations over a career that also earned him an Academy Award for the Purple Rain soundtrack."
      - name: "New York: Mariah Carey"
        image: "/images/collections/culture/grammy-winners-by-state/new-york.jpg"
        description: "Mariah Carey, born in Huntington on Long Island, has won 5 Grammy Awards from 34 nominations, including Best New Artist for her 1990 debut."
      - name: "Louisiana: Harry Connick Jr."
        image: "/images/collections/culture/grammy-winners-by-state/louisiana.jpg"
        description: "Harry Connick Jr., born in New Orleans, has won 3 Grammy Awards from 16 nominations, the first two back to back for Best Jazz Vocal Performance, Male."
      - name: "Kentucky: Loretta Lynn"
        image: "/images/collections/culture/grammy-winners-by-state/kentucky.jpg"
        description: "Loretta Lynn, born in Butcher Hollow, won 3 Grammy Awards, including Best Country Album in 2005 for Van Lear Rose, recorded with Jack White at age 72."

