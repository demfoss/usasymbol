faq:
  - question: "Which state's native artist has won the most Grammys?"
    answer: "Texas's Beyoncé has won 35 Grammy Awards, more than any artist in history, regardless of birth state."

  - question: "Who holds the record for most Album of the Year wins?"
    answer: "Pennsylvania's Taylor Swift has won Album of the Year 4 times, a record no other artist has matched."

  - question: "How many Grammys has Stevie Wonder won?"
    answer: "Stevie Wonder, born in Saginaw, Michigan, has won 25 Grammy Awards, including Album of the Year three times in the 1970s."

  - question: "Was Prince born in Minnesota?"
    answer: "Yes. Prince was born in Minneapolis, Minnesota, and won 7 Grammy Awards over his career."

  - question: "Which artist won 5 Grammys in one night?"
    answer: "Lauryn Hill, born in South Orange, New Jersey, won 5 Grammys in a single night in 1999 for The Miseducation of Lauryn Hill."

  - question: "How many Grammys does Quincy Jones have?"
    answer: "Quincy Jones, born in Chicago, Illinois, won 28 Grammy Awards, the second-most of any state-born artist on this list."

