page:
  h1: "Grammy-Winning Artists by State"
  intro_title: "From Beyoncé's Houston to Springsteen's Jersey Shore"

  quick_answer:
    - "Beyoncé, born in Houston, Texas, has won 35 Grammy Awards from 99 nominations, more wins and more nominations than any artist in Grammy history."
    - "Illinois's Quincy Jones has 80 nominations, Georgia's Kanye West 76, and Michigan's Stevie Wonder 75. All three rank among the ten most-nominated artists ever."
    - "Pennsylvania's Taylor Swift holds a record of her own. She is the only artist to win Album of the Year four times. Hawaii's Bruno Mars, Missouri's Eminem, and Indiana's Michael Jackson each have at least 13 wins."

  methodology: "Each artist is listed under the state where they were born. Win and nomination totals follow each artist's GRAMMY.com profile after the 68th Grammy Awards in 2026. The list covers the 35 states where a native-born artist with a documented Grammy win could be confirmed. Alaska, Colorado, Delaware, Idaho, Iowa, Maine, Montana, Nebraska, Nevada, New Hampshire, Rhode Island, South Dakota, Utah, Vermont, and Wyoming are not yet included."

  sources:
    - name: "Recording Academy / GRAMMY.com. Artist Award Pages"
      url: "https://www.grammy.com/"
      description: "Official Grammy win and nomination totals by artist"
    - name: "Wikipedia. List of Grammy Award records"
      url: "https://en.wikipedia.org/wiki/List_of_Grammy_Award_records"
      description: "Most nominations and most wins by individual artists"
