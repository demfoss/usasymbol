page:
  h1: "Grammy-Winning Artist Born in Every State"
  intro_title: "14 States, One Record-Setting Artist Each"

  quick_answer:
    - "Beyoncé, born in Houston, Texas, has won 35 Grammy Awards, more than any artist in Grammy history."
    - "Illinois's Quincy Jones (28 wins) and Michigan's Stevie Wonder (25 wins) rank second and third among state-born record holders."
    - "Pennsylvania's Taylor Swift holds a record of her own: she is the only artist to win Album of the Year four times."

  methodology: "Entries reflect each artist's birth state and their total competitive Grammy Award wins as of the most recent ceremony. The list covers the 14 states with a clearly documented record-setting native artist, not all 50."

