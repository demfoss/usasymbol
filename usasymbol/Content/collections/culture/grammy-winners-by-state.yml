sections:
  - id: "grammy-records-set-by-state-born-artists"
    icon: "fa-solid fa-trophy"
    title: "Grammy Records Set by State-Born Artists"
    paragraphs:
      - "Two artists on this list hold outright Grammy records, one for total wins and one for the biggest award of the night."
    subsections:
      - subtitle: "Texas: Beyoncé, the Most Decorated Artist Ever"
        text: "**Born:** Houston, Texas\n**Grammy wins:** 35 from 99 nominations\n\nBeyoncé passed every other artist in Grammy history at the 2025 ceremony, where Cowboy Carter won Album of the Year and made her the first Black woman to win that award in the 21st century. Her 35 wins and 99 nominations are both records.\n\nHer path there ran through nearly every genre the Grammys track, from Destiny's Child R&B records to a country album that finally ended her Album of the Year drought."
        anchor_phrases:
          - "Beyoncé passed every other artist in Grammy history"
      - subtitle: "Pennsylvania: Taylor Swift's Album of the Year Record"
        text: "**Born:** West Reading, Pennsylvania\n**Grammy wins:** 14 from 58 nominations, including a record 4 for Album of the Year\n\nTaylor Swift has won Album of the Year four times, for Fearless (2010), 1989 (2016), Folklore (2021), and Midnights (2024). Frank Sinatra, Stevie Wonder, and Paul Simon each won it three times.\n\nHer 14 total wins trail several artists on raw count, but the Album of the Year record is hers alone."
        anchor_phrases:
          - "Taylor Swift has won Album of the Year four times"

  - id: "artists-with-20-grammy-nominations-by-state"
    icon: "fa-solid fa-list-ol"
    title: "Artists With 20+ Grammy Nominations by State"
    paragraphs:
      - "Ohio, New Jersey, Georgia, Michigan, Missouri, and Virginia each have more than one native artist with at least 20 Grammy nominations. New Jersey leads with four, from Frank Sinatra of Hoboken to Whitney Houston of Newark."
      - "Ohio's pair comes from very different worlds. Dave Grohl, born in Warren, earned most of his 45 nominations with Foo Fighters, while Springfield-born John Legend has 40 as a solo singer and songwriter. Georgia-born Kanye West, raised in Chicago, has 76."
