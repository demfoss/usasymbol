sections:
  - id: "chef-by-state"
    icon: "fa-solid fa-kitchen-set"
    style: "law-cards"
    title: "Most Famous Chef From Every State"
    paragraphs:
      - "Thirty-seven states have a chef whose birthplace and national credentials both check out. The rest are missing on purpose, not by accident."
    highlights:
      - name: "Alabama: Frank Stitt"
        image: "/images/collections/culture/most-famous-chef-by-state/alabama.jpg"
        description: "Frank Stitt was born in Cullman and won the James Beard Award for Best Chef Southeast in 2001. He built his reputation on three Birmingham restaurants, led by Highlands Bar and Grill, which he opened in 1980."

      - name: "Arizona: Ken Hom"
        image: "/images/collections/culture/most-famous-chef-by-state/arizona.jpg"
        description: "Ken Hom was born in Tucson in 1949, though he was raised in Chicago after his father's death. He introduced Chinese cooking to Western television audiences through the BBC series Chinese Cookery and later received honorary British titles for his culinary work."

      - name: "Arkansas: Matthew McClure"
        image: "/images/collections/culture/most-famous-chef-by-state/arkansas.jpg"
        description: "Matthew McClure grew up in Little Rock and now runs the kitchen at The Hive in Bentonville. He has been a James Beard Foundation semifinalist five years running and won Food & Wine's People's Best New Chef award for the Midwest in 2015."

      - name: "California: Julia Child"
        image: "/images/collections/culture/most-famous-chef-by-state/california.jpg"
        description: "Julia Child was born in Pasadena in 1912 and did not cook professionally until her thirties. She co-wrote Mastering the Art of French Cooking in 1961 and became one of the first women to host her own television cooking program."

      - name: "Connecticut: David Bouley"
        image: "/images/collections/culture/most-famous-chef-by-state/connecticut.jpg"
        description: "David Bouley was born in Storrs in 1953 and won multiple James Beard Awards over his career. His flagship restaurant, Bouley, in Tribeca became one of New York's most decorated dining rooms."

      - name: "Florida: Art Smith"
        image: "/images/collections/culture/most-famous-chef-by-state/florida.jpg"
        description: "Art Smith is a sixth-generation Floridian and a two-time James Beard Award winner. He spent a decade, from 1997 to 2007, as Oprah Winfrey's personal chef."

      - name: "Georgia: Paula Deen"
        image: "/images/collections/culture/most-famous-chef-by-state/georgia.jpg"
        description: "Paula Deen was born in Albany in 1947 and turned Southern home cooking into a national television and cookbook empire on the Food Network."

      - name: "Hawaii: Sam Choy"
        image: "/images/collections/culture/most-famous-chef-by-state/hawaii.jpg"
        description: "Sam Choy was born in Laie in 1952 and became known as the godfather of poke. He helped create Hawaii Regional Cuisine, published more than a dozen cookbooks, and won a James Beard Award for his restaurant in Kona."

      - name: "Idaho: Kris Komori"
        image: "/images/collections/culture/most-famous-chef-by-state/idaho.jpg"
        description: "Kris Komori leads the kitchen at KIN in downtown Boise and won the James Beard Award for Best Chef: Mountain in 2023, the region that covers Idaho."

      - name: "Illinois: Dale Talde"
        image: "/images/collections/culture/most-famous-chef-by-state/illinois.jpg"
        description: "Dale Talde was born in Chicago in 1978 and competed on two seasons of Top Chef before building a restaurant group and a career as a cookbook author."

      - name: "Indiana: Colonel Harland Sanders"
        image: "/images/collections/culture/most-famous-chef-by-state/indiana.jpg"
        description: "Harland Sanders was born in Henryville and developed his fried chicken recipe in the 1940s. That recipe became the foundation of Kentucky Fried Chicken, one of the most recognized fast-food brands in the world."

      - name: "Iowa: Eric Ziebold"
        image: "/images/collections/culture/most-famous-chef-by-state/iowa.jpg"
        description: "Eric Ziebold was born in Ames in 1972 and trained under Thomas Keller before winning a James Beard Award as executive chef of CityZen. He now runs two Michelin-starred restaurants in Washington, D.C."

      - name: "Kentucky: Dean Fearing"
        image: "/images/collections/culture/most-famous-chef-by-state/kentucky.jpg"
        description: "Dean Fearing was born in Ashland in 1955 and spent 20 years as executive chef of The Mansion on Turtle Creek in Dallas, where he helped establish Southwestern cuisine as a defined American style."

      - name: "Louisiana: Paul Prudhomme"
        image: "/images/collections/culture/most-famous-chef-by-state/louisiana.jpg"
        description: "Paul Prudhomme was born on a sharecropper farm outside Opelousas in 1940. From his restaurant K-Paul's Louisiana Kitchen, he pushed Cajun dishes like blackened redfish and jambalaya into the national spotlight."

      - name: "Maryland: Michael Voltaggio"
        image: "/images/collections/culture/most-famous-chef-by-state/maryland.jpg"
        description: "Michael Voltaggio was born in Frederick in 1978 and won season six of Top Chef, one of two Voltaggio brothers from the same Maryland city to compete on the show."

      - name: "Massachusetts: Emeril Lagasse"
        image: "/images/collections/culture/most-famous-chef-by-state/massachusetts.jpg"
        description: "Emeril Lagasse was born in Fall River in 1959, the son of a French-Canadian father and Portuguese mother. He became a Food Network fixture known for shouting Bam! and for the New Orleans restaurant group he built later in his career."

      - name: "Michigan: Grant Achatz"
        image: "/images/collections/culture/most-famous-chef-by-state/michigan.jpg"
        description: "Grant Achatz was born in St. Clair in 1974 and opened Alinea in Chicago, one of the country's most acclaimed restaurants. He has won multiple James Beard Awards for pushing molecular gastronomy into American fine dining."

      - name: "Minnesota: Justin Sutherland"
        image: "/images/collections/culture/most-famous-chef-by-state/minnesota.jpg"
        description: "Justin Sutherland grew up in St. Paul and won Iron Chef America and a Daytime Emmy Award. He also competed on Top Chef Season 16 before opening his own Minneapolis restaurants."

      - name: "Mississippi: John Besh"
        image: "/images/collections/culture/most-famous-chef-by-state/mississippi.jpg"
        description: "John Besh was born in Meridian in 1968 and built a New Orleans restaurant group alongside a television career as a chef, author, and philanthropist."

      - name: "Missouri: Danny Meyer"
        image: "/images/collections/culture/most-famous-chef-by-state/missouri.jpg"
        description: "Danny Meyer was born in St. Louis in 1958 and founded Union Square Hospitality Group and Shake Shack. His restaurant group has collected 28 James Beard Foundation Awards, more than almost any other operator in the country."

      - name: "Nebraska: Matthew Lightner"
        image: "/images/collections/culture/most-famous-chef-by-state/nebraska.jpg"
        description: "Matthew Lightner was born in Norfolk in 1980 and earned two Michelin stars as executive chef of Atera in New York City. Food & Wine named him one of its Best New Chefs in 2010."

      - name: "New Hampshire: Frank McClelland"
        image: "/images/collections/culture/most-famous-chef-by-state/new-hampshire.jpg"
        description: "Frank McClelland spent his childhood on his grandparents' farm in Hebron before founding L'Espalier in Boston. He won the James Beard Award for Best Northeast Chef in 2007 and later earned 17 consecutive AAA Five Diamond Awards."

      - name: "New Jersey: Alice Waters"
        image: "/images/collections/culture/most-famous-chef-by-state/new-jersey.jpg"
        description: "Alice Waters was born in Chatham in 1944 and founded Chez Panisse in Berkeley, a restaurant credited with launching the farm-to-table movement. In 1992 she became the first woman to win the James Beard Award for Best Chef in America."

      - name: "New York: Bobby Flay"
        image: "/images/collections/culture/most-famous-chef-by-state/new-york.jpg"
        description: "Bobby Flay was born in New York City in 1964 and grew up training in his father's restaurant business. He became one of Food Network's most recognizable stars through Iron Chef America and four Daytime Emmy wins."

      - name: "North Carolina: Ashley Christensen"
        image: "/images/collections/culture/most-famous-chef-by-state/north-carolina.jpg"
        description: "Ashley Christensen was born in Greensboro and runs a Raleigh restaurant group. She won the James Beard Award for Best Chef Southeast in 2014 and was named the Foundation's Outstanding Chef in 2019."

      - name: "Ohio: Michael Symon"
        image: "/images/collections/culture/most-famous-chef-by-state/ohio.jpg"
        description: "Michael Symon was born in Cleveland in 1969 and became an Iron Chef on Food Network. His flagship restaurant, Lola, is credited with helping revive downtown Cleveland's dining scene."

      - name: "Oklahoma: Rick Bayless"
        image: "/images/collections/culture/most-famous-chef-by-state/oklahoma.jpg"
        description: "Rick Bayless was born in Oklahoma City in 1953 to a family of restaurateurs. He went on to win seven James Beard Awards and host the long-running PBS series Mexico: One Plate at a Time."

      - name: "Oregon: James Beard"
        image: "/images/collections/culture/most-famous-chef-by-state/oregon.jpg"
        description: "James Beard was born in Portland in 1903 and became the first chef to demonstrate cooking on network television in 1946. The James Beard Foundation named its awards, the culinary industry's top honor, after him."

      - name: "Rhode Island: Wylie Dufresne"
        image: "/images/collections/culture/most-famous-chef-by-state/rhode-island.jpg"
        description: "Wylie Dufresne was born in Providence in 1970 and became a leading American voice in molecular gastronomy. His Manhattan restaurant, wd~50, ran for 12 years and drew chefs from around the country to study his techniques."

      - name: "South Carolina: Kardea Brown"
        image: "/images/collections/culture/most-famous-chef-by-state/south-carolina.jpg"
        description: "Kardea Brown was born in Charleston in 1987 and grew up on the Sea Islands within a Gullah Geechee family. She hosts Food Network's Delicious Miss Brown, built around the coastal Southern recipes passed down through her family."

      - name: "South Dakota: Sean Sherman"
        image: "/images/collections/culture/most-famous-chef-by-state/south-dakota.jpg"
        description: "Sean Sherman was born on the Pine Ridge Indian Reservation in 1974 and is known as The Sioux Chef. His cookbook on Indigenous cuisine won a James Beard Award, and he later received a MacArthur Fellowship for his work reviving Native foodways."

      - name: "Tennessee: Carla Hall"
        image: "/images/collections/culture/most-famous-chef-by-state/tennessee.jpg"
        description: "Carla Hall was born in Nashville in 1964 and appeared on two seasons of Top Chef before co-hosting ABC's daytime show The Chew for seven years."

      - name: "Texas: Stephan Pyles"
        image: "/images/collections/culture/most-famous-chef-by-state/texas.jpg"
        description: "Stephan Pyles was born in Big Spring in 1952, where he bussed tables at his family's truck stop diner as a child. He became the first chef from the Southwest to win a James Beard Best Chef award and helped define Southwestern cuisine."

      - name: "Virginia: Edna Lewis"
        image: "/images/collections/culture/most-famous-chef-by-state/virginia.jpg"
        description: "Edna Lewis was born in Freetown in 1916 and became known as the first African-American celebrity chef. She opened the New York restaurant Cafe Nicholson and helped popularize farm-to-table, seasonal Southern cooking decades before it became a trend."

      - name: "Washington: Mario Batali"
        image: "/images/collections/culture/most-famous-chef-by-state/washington.jpg"
        description: "Mario Batali was born in Seattle in 1960 and became one of Food Network's most recognizable personalities in the early 2000s, appearing on Iron Chef America and building a national restaurant group."

      - name: "West Virginia: Katie Lee"
        image: "/images/collections/culture/most-famous-chef-by-state/west-virginia.jpg"
        description: "Katie Lee was born in Huntington in 1981 and raised in Milton. She co-hosts Food Network's talk show The Kitchen and previously judged Iron Chef America."

      - name: "Wisconsin: Paul Bartolotta"
        image: "/images/collections/culture/most-famous-chef-by-state/wisconsin.jpg"
        description: "Paul Bartolotta was born in Milwaukee in 1961 and won two James Beard Awards. He co-founded The Bartolotta Restaurants, a group that has anchored the Milwaukee dining scene for decades."

  - id: "states-without-a-chef-on-the-list"
    icon: "fa-solid fa-circle-question"
    title: "States Without a Famous Chef on the List"
    paragraphs:
      - "Thirteen states are missing: Alaska, Colorado, Delaware, Kansas, Maine, Montana, Nevada, New Mexico, North Dakota, Pennsylvania, Utah, Vermont, and Wyoming. Each one has working chefs with regional followings and even James Beard nominations, but none turned up a chef whose birthplace and national recognition could both be verified."
      - "Pennsylvania is the largest state left off the list. Philadelphia and Pittsburgh both have James Beard-winning chefs today, but the ones with real national profiles, such as Michael Solomonov, were born outside the state and moved there for their careers."

faq:
  - question: "Who is the most famous chef from California?"
    answer: "Julia Child represents California. Born in Pasadena in 1912, she co-wrote Mastering the Art of French Cooking and became one of the first women to host her own television cooking show."

  - question: "Who is the most famous chef from New York?"
    answer: "Bobby Flay represents New York, born in New York City in 1964. He became a Food Network mainstay through Iron Chef America and four Daytime Emmy Awards."

  - question: "Which states don't have a chef on this list?"
    answer: "Thirteen states are left off: Alaska, Colorado, Delaware, Kansas, Maine, Montana, Nevada, New Mexico, North Dakota, Pennsylvania, Utah, Vermont, and Wyoming. No chef born in those states could be verified as genuinely nationally famous."

  - question: "Is James Beard actually from Oregon?"
    answer: "Yes. James Beard was born in Portland in 1903 and became the first chef to appear on network television. The James Beard Awards, the culinary industry's top honor, are named after him."

  - question: "How was the most famous chef from each state determined?"
    answer: "Each chef's documented birthplace was matched against a verifiable national credential, such as a James Beard Award, a Michelin star, or a Food Network career, since no single published ranking covers a chef for every state."

  - question: "Who represents Louisiana on the list?"
    answer: "Paul Prudhomme represents Louisiana. Born outside Opelousas in 1940, he brought Cajun dishes like blackened redfish into the national spotlight from his restaurant K-Paul's Louisiana Kitchen."

