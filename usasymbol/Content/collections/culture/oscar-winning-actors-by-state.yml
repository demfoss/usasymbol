faq:
  - question: "Which state's native actor has won the most Oscars?"
    answer: "New Jersey's Jack Nicholson has won 3 competitive acting Oscars, more than any other actor born in a single state."

  - question: "Was Will Smith born in Pennsylvania?"
    answer: "Yes. Will Smith was born in Philadelphia and won Best Actor for King Richard in 2022."

  - question: "Which actor won two Oscars in consecutive years?"
    answer: "Spencer Tracy, born in Milwaukee, Wisconsin, won Best Actor in both 1938 (Captains Courageous) and 1939 (Boys Town), the only back-to-back winner on this list."

  - question: "Who is the Oscar-winning actor from Texas?"
    answer: "Renée Zellweger, born in Katy, Texas, has won 2 Oscars: Best Supporting Actress for Cold Mountain (2004) and Best Actress for Judy (2020)."

  - question: "Which Ohio-born actor won an Oscar?"
    answer: "Paul Newman, born in Shaker Heights, Ohio, won Best Actor for The Color of Money in 1987, on his seventh nomination."

  - question: "How many states have a native-born Oscar-winning actor on this list?"
    answer: "21 states are represented, from Alabama's Octavia Spencer to Wisconsin's Spencer Tracy."

