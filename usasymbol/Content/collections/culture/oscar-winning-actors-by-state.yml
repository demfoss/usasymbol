page:
  h1: "Oscar-Winning Actor Born in Every State"
  intro_title: "21 States With a Native-Born Academy Award Winner"

  quick_answer:
    - "Jack Nicholson, born in Neptune, New Jersey, has won 3 competitive Academy Awards for acting, more than any other actor on this list."
    - "Four other actors on the list are two-time winners: Jessica Lange (Minnesota), Renée Zellweger (Texas), Spencer Tracy (Wisconsin), and Paul Newman (Ohio)."
    - "Wisconsin's Spencer Tracy won back-to-back Best Actor Oscars in 1938 and 1939, the only actor on this list to win in consecutive years."

  methodology: "Entries reflect each actor's birth state and their competitive Academy Award wins in an acting category (Best Actor, Best Actress, Best Supporting Actor, Best Supporting Actress). Honorary Oscars are not counted as wins. The list covers 21 states with a clearly documented native-born winner, not all 50."

  sources:
