        image: "/images/collections/culture/oscar-winning-actors-by-state/arizona.jpg"
        description: "Emma Stone, born in Scottsdale, won Best Actress for La La Land in 2017 and again for Poor Things in 2024."
      - name: "California: Leonardo DiCaprio"
        image: "/images/collections/culture/oscar-winning-actors-by-state/california.jpg"
        description: "Leonardo DiCaprio, born in Los Angeles, won Best Actor for The Revenant in 2016 after five prior nominations."
      - name: "Georgia: Julia Roberts"
        image: "/images/collections/culture/oscar-winning-actors-by-state/georgia.jpg"
        description: "Julia Roberts, born in Smyrna, won Best Actress for Erin Brockovich in 2001."
      - name: "Indiana: Anne Baxter"
        image: "/images/collections/culture/oscar-winning-actors-by-state/indiana.jpg"
        description: "Anne Baxter, born in Michigan City, won Best Supporting Actress for The Razor's Edge in 1947."
      - name: "Kentucky: George Clooney"
        image: "/images/collections/culture/oscar-winning-actors-by-state/kentucky.jpg"
        description: "George Clooney, born in Lexington, won Best Supporting Actor for Syriana in 2006."
      - name: "Louisiana: Reese Witherspoon"
        image: "/images/collections/culture/oscar-winning-actors-by-state/louisiana.jpg"
        description: "Reese Witherspoon, born in New Orleans, won Best Actress for Walk the Line in 2006."
      - name: "Massachusetts: Olympia Dukakis"
        image: "/images/collections/culture/oscar-winning-actors-by-state/massachusetts.jpg"
        description: "Olympia Dukakis, born in Lowell, won Best Supporting Actress for Moonstruck in 1988."
      - name: "Michigan: Ellen Burstyn"
        image: "/images/collections/culture/oscar-winning-actors-by-state/michigan.jpg"
        description: "Ellen Burstyn, born in Detroit, won Best Actress for Alice Doesn't Live Here Anymore in 1975."
      - name: "Minnesota: Jessica Lange"
        image: "/images/collections/culture/oscar-winning-actors-by-state/minnesota.jpg"
        description: "Jessica Lange, born in Cloquet, won Best Supporting Actress for Tootsie in 1983 and Best Actress for Blue Sky in 1995."
      - name: "Missouri: Ginger Rogers"
        image: "/images/collections/culture/oscar-winning-actors-by-state/missouri.jpg"
        description: "Ginger Rogers, born in Independence, won Best Actress for Kitty Foyle in 1941, more than 80 years before any other Missouri-born actor matched the honor."
      - name: "Nebraska: Henry Fonda"
        image: "/images/collections/culture/oscar-winning-actors-by-state/nebraska.jpg"
        description: "Henry Fonda, born in Grand Island, won Best Actor for On Golden Pond in 1982, his only competitive win after decades of acclaimed roles."
      - name: "New Jersey: Jack Nicholson"
        image: "/images/collections/culture/oscar-winning-actors-by-state/new-jersey.jpg"
        description: "Jack Nicholson, born in Neptune, has won 3 competitive acting Oscars: One Flew Over the Cuckoo's Nest (1976), Terms of Endearment (1984), and As Good as It Gets (1998), the most of any actor on this list."
      - name: "New York: Robert De Niro"
        image: "/images/collections/culture/oscar-winning-actors-by-state/new-york.jpg"
        description: "Robert De Niro, born in New York City, won Best Supporting Actor for The Godfather Part II in 1975 and Best Actor for Raging Bull in 1981."
      - name: "Ohio: Paul Newman"
        image: "/images/collections/culture/oscar-winning-actors-by-state/ohio.jpg"
        description: "Paul Newman, born in Shaker Heights, won Best Actor for The Color of Money in 1987 on his seventh nomination."
      - name: "Oklahoma: Brad Pitt"
        image: "/images/collections/culture/oscar-winning-actors-by-state/oklahoma.jpg"
        description: "Brad Pitt, born in Shawnee, won Best Supporting Actor for Once Upon a Time in Hollywood in 2020."
      - name: "Pennsylvania: Will Smith"
        image: "/images/collections/culture/oscar-winning-actors-by-state/pennsylvania.jpg"
        description: "Will Smith, born in Philadelphia, won Best Actor for King Richard in 2022 after three prior nominations."
      - name: "Tennessee: Morgan Freeman"
        image: "/images/collections/culture/oscar-winning-actors-by-state/tennessee.jpg"
        description: "Morgan Freeman, born in Memphis, won Best Supporting Actor for Million Dollar Baby in 2005."
      - name: "Texas: Renée Zellweger"
        image: "/images/collections/culture/oscar-winning-actors-by-state/texas.jpg"
        description: "Renée Zellweger, born in Katy, won Best Supporting Actress for Cold Mountain in 2004 and Best Actress for Judy in 2020."
      - name: "Virginia: Sandra Bullock"
        image: "/images/collections/culture/oscar-winning-actors-by-state/virginia.jpg"
        description: "Sandra Bullock, born in Arlington, won Best Actress for The Blind Side in 2010."
      - name: "Wisconsin: Spencer Tracy"
        image: "/images/collections/culture/oscar-winning-actors-by-state/wisconsin.jpg"
        description: "Spencer Tracy, born in Milwaukee, won back-to-back Best Actor Oscars for Captains Courageous (1938) and Boys Town (1939), the only consecutive-year winner on this list."

  - id: "states-with-multiple-time-oscar-winners"
    icon: "fa-solid fa-trophy"
    title: "States With Multiple-Time Oscar Winners"
    paragraphs:
      - "New Jersey's Jack Nicholson leads the group with 3 competitive wins. Four states follow with a two-time winner: Minnesota's Jessica Lange, Texas's Renée Zellweger, Wisconsin's Spencer Tracy, and New York's Robert De Niro."
      - "Tracy's pair stands apart because they came back to back, in 1938 and 1939. Every other multiple winner on the list has years, sometimes decades, between their two statues."

