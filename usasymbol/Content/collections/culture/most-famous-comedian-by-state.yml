sections:
  - id: "comedian-by-state"
    icon: "fa-solid fa-face-laugh-squint"
    style: "law-cards"
    title: "Most Famous Comedian From Every State"
    paragraphs:
      - "A handful of the country's best-known comedians actually grew up on the coasts. Most of the names below were born somewhere else in the 50 states before the clubs and the cameras found them."
    highlights:
      - name: "Alabama: Roy Wood Jr."
        image: "/images/collections/culture/most-famous-comedian-by-state/alabama.jpg"
        description: "Roy Wood Jr. was born in Birmingham, Alabama, and spent more than a decade as a correspondent on The Daily Show before headlining his own Comedy Central specials."

      - name: "Alaska: Dan Mintz"
        image: "/images/collections/culture/most-famous-comedian-by-state/alaska.jpg"
        description: "Dan Mintz was born in Anchorage, Alaska, and is known for a flat, deadpan delivery on stage as well as voicing Tina Belcher on Bob's Burgers."

      - name: "Arizona: Pablo Francisco"
        image: "/images/collections/culture/most-famous-comedian-by-state/arizona.jpg"
        description: "Pablo Francisco was born in Tucson, Arizona, and built a following on MADtv and Comedy Central Presents with rapid-fire impressions and sound effects."

      - name: "Arkansas: Matt Besser"
        image: "/images/collections/culture/most-famous-comedian-by-state/arkansas.jpg"
        description: "Matt Besser was born in Little Rock, Arkansas, and co-founded the Upright Citizens Brigade, one of the most influential improv and sketch groups in modern comedy."

      - name: "California: Will Ferrell"
        image: "/images/collections/culture/most-famous-comedian-by-state/california.jpg"
        description: "Will Ferrell was born in Irvine, California, and spent seven seasons on Saturday Night Live before headlining Anchorman and Elf."

      - name: "Colorado: Tim Allen"
        image: "/images/collections/culture/most-famous-comedian-by-state/colorado.jpg"
        description: "Tim Allen was born in Denver, Colorado, and worked as a little-known stand-up comedian before Home Improvement made him a household name."

      - name: "Connecticut: Lisa Lampanelli"
        image: "/images/collections/culture/most-famous-comedian-by-state/connecticut.jpg"
        description: "Lisa Lampanelli was born in Trumbull, Connecticut, and became known as the Friars Club's go-to insult comic on decades of celebrity roasts."

      - name: "Delaware: Aubrey Plaza"
        image: "/images/collections/culture/most-famous-comedian-by-state/delaware.jpg"
        description: "Aubrey Plaza was born in Wilmington, Delaware, and turned her deadpan comic persona into April Ludgate on Parks and Recreation."

      - name: "Florida: Carrot Top"
        image: "/images/collections/culture/most-famous-comedian-by-state/florida.jpg"
        description: "Carrot Top, born Scott Thompson in Rockledge, Florida, built one of comedy's longest-running acts around visual prop comedy and has headlined Las Vegas for decades."

      - name: "Georgia: Jeff Foxworthy"
        image: "/images/collections/culture/most-famous-comedian-by-state/georgia.jpg"
        description: "Jeff Foxworthy was born in Atlanta, Georgia, and turned the line \"you might be a redneck\" into the best-selling comedy album series in recording history."

      - name: "Hawaii: Frank De Lima"
        image: "/images/collections/culture/most-famous-comedian-by-state/hawaii.jpg"
        description: "Frank De Lima was born on Oahu, Hawaii, and has spent decades performing song-parody stand-up about island culture and local politics."

      - name: "Idaho: Ryan Hamilton"
        image: "/images/collections/culture/most-famous-comedian-by-state/idaho.jpg"
        description: "Ryan Hamilton was born in Ashton, Idaho, and built a national following as a clean comedian with a Comedy Central Presents half hour and a Netflix special."

      - name: "Illinois: Richard Pryor"
        image: "/images/collections/culture/most-famous-comedian-by-state/illinois.jpg"
        description: "Richard Pryor was born in Peoria, Illinois, in 1940 and is widely considered one of the most influential stand-up comedians in American history for his raw, confessional style."

      - name: "Indiana: David Letterman"
        image: "/images/collections/culture/most-famous-comedian-by-state/indiana.jpg"
        description: "David Letterman was born in Indianapolis, Indiana, and started out doing stand-up before hosting late night television for more than three decades."

      - name: "Iowa: Brooks Wheelan"
        image: "/images/collections/culture/most-famous-comedian-by-state/iowa.jpg"
        description: "Brooks Wheelan was born in Cedar Rapids, Iowa, and joined the cast of Saturday Night Live for the 2013-2014 season before returning to touring stand-up."

      - name: "Kansas: Bridget Everett"
        image: "/images/collections/culture/most-famous-comedian-by-state/kansas.jpg"
        description: "Bridget Everett was born in Manhattan, Kansas, and turned her cabaret-rooted stand-up into the HBO series Somebody Somewhere, set in her home state."

      - name: "Kentucky: Rob Riggle"
        image: "/images/collections/culture/most-famous-comedian-by-state/kentucky.jpg"
        description: "Rob Riggle was born in Louisville, Kentucky, and moved between The Daily Show, Saturday Night Live, and film comedies like The Hangover."

      - name: "Louisiana: Ellen DeGeneres"
        image: "/images/collections/culture/most-famous-comedian-by-state/louisiana.jpg"
        description: "Ellen DeGeneres was born in Metairie, Louisiana, and started as a stand-up comedian before hosting one of the longest-running daytime talk shows on television."

      - name: "Maine: Bob Marley"
        image: "/images/collections/culture/most-famous-comedian-by-state/maine.jpg"
        description: "Bob Marley was born in Portland, Maine, and has built his career on Comedy Central specials and a recurring role in The Boondock Saints."

      - name: "Maryland: Stavros Halkias"
        image: "/images/collections/culture/most-famous-comedian-by-state/maryland.jpg"
        description: "Stavros Halkias was born in Baltimore, Maryland, and rose from local club sets to a popular podcast and the Netflix special Stavros Halkias: Fat Rascal."

      - name: "Massachusetts: Denis Leary"
        image: "/images/collections/culture/most-famous-comedian-by-state/massachusetts.jpg"
        description: "Denis Leary was born in Worcester, Massachusetts, and built his name on the rapid-fire stand-up special No Cure for Cancer before starring in Rescue Me."

      - name: "Michigan: Michael Kosta"
        image: "/images/collections/culture/most-famous-comedian-by-state/michigan.jpg"
        description: "Michael Kosta was born in Ann Arbor, Michigan, and became a senior correspondent and rotating host on The Daily Show after years on the club circuit."

      - name: "Minnesota: Mitch Hedberg"
        image: "/images/collections/culture/most-famous-comedian-by-state/minnesota.jpg"
        description: "Mitch Hedberg was born in St. Paul, Minnesota, and became one of stand-up's most quoted one-liner comedians before his death in 2005."

      - name: "Mississippi: Tig Notaro"
        image: "/images/collections/culture/most-famous-comedian-by-state/mississippi.jpg"
        description: "Tig Notaro was born in Jackson, Mississippi, and has earned two Grammy Award nominations for Best Comedy Album with her deadpan, personal style."

      - name: "Missouri: Kathleen Madigan"
        image: "/images/collections/culture/most-famous-comedian-by-state/missouri.jpg"
        description: "Kathleen Madigan was born in Florissant, Missouri, and has released more than a dozen stand-up specials over a touring career that spans three decades."

      - name: "Montana: Dana Carvey"
        image: "/images/collections/culture/most-famous-comedian-by-state/montana.jpg"
        description: "Dana Carvey was born in Missoula, Montana, and created enduring Saturday Night Live characters including the Church Lady and Garth from Wayne's World."

      - name: "Nebraska: Larry the Cable Guy"
        image: "/images/collections/culture/most-famous-comedian-by-state/nebraska.jpg"
        description: "Larry the Cable Guy, born Daniel Whitney in Pawnee City, Nebraska, became one of the top-grossing stand-up comedians in the country through the Blue Collar Comedy Tour."

      - name: "Nevada: K-von"
        image: "/images/collections/culture/most-famous-comedian-by-state/nevada.jpg"
        description: "K-von, born Kevan Moezzi in Reno, Nevada, built a national following through Last Comic Standing and years of touring clubs and military bases."

      - name: "New Hampshire: Sarah Silverman"
        image: "/images/collections/culture/most-famous-comedian-by-state/new-hampshire.jpg"
        description: "Sarah Silverman was born in Bedford, New Hampshire, and built a career on provocative stand-up specials including Jesus Is Magic and her own Comedy Central series."

      - name: "New Jersey: Joe Piscopo"
        image: "/images/collections/culture/most-famous-comedian-by-state/new-jersey.jpg"
        description: "Joe Piscopo was born in Passaic, New Jersey, and spent four seasons on Saturday Night Live known for his Frank Sinatra impression."

      - name: "New Mexico: Scott Kennedy"
        image: "/images/collections/culture/most-famous-comedian-by-state/new-mexico.jpg"
        description: "Scott Kennedy was born in Albuquerque, New Mexico, and built a two-decade club career before his death in 2013. He remains one of the state's most documented stand-up comedians."

      - name: "New York: Jerry Seinfeld"
        image: "/images/collections/culture/most-famous-comedian-by-state/new-york.jpg"
        description: "Jerry Seinfeld was born in Brooklyn, New York, and turned observational stand-up into one of the most successful sitcoms in television history."

      - name: "North Carolina: Fortune Feimster"
        image: "/images/collections/culture/most-famous-comedian-by-state/north-carolina.jpg"
        description: "Fortune Feimster was born in Charlotte, North Carolina, and moved from The Mindy Project to headlining her own Netflix stand-up specials."

      - name: "North Dakota: Amber Preston"
        image: "/images/collections/culture/most-famous-comedian-by-state/north-dakota.jpg"
        description: "Amber Preston was born in Fargo, North Dakota, and was named one of comedy's top comics to watch by Marc Maron before building a national touring career."

      - name: "Ohio: Drew Carey"
        image: "/images/collections/culture/most-famous-comedian-by-state/ohio.jpg"
        description: "Drew Carey was born in Cleveland, Ohio, and parlayed his stand-up act into The Drew Carey Show and two decades hosting The Price Is Right."

      - name: "Oklahoma: Bill Hader"
        image: "/images/collections/culture/most-famous-comedian-by-state/oklahoma.jpg"
        description: "Bill Hader was born in Tulsa, Oklahoma, and spent eight seasons on Saturday Night Live before writing, directing, and starring in HBO's Barry."

      - name: "Oregon: Ian Karmel"
        image: "/images/collections/culture/most-famous-comedian-by-state/oregon.jpg"
        description: "Ian Karmel was born in Portland, Oregon, and served as co-head writer for CBS's The Late Late Show with James Corden, earning multiple Emmy nominations."

      - name: "Pennsylvania: Anthony Jeselnik"
        image: "/images/collections/culture/most-famous-comedian-by-state/pennsylvania.jpg"
        description: "Anthony Jeselnik was born in Upper St. Clair, Pennsylvania, and built a career on dark, one-line stand-up along with hosting several Comedy Central Roasts."

      - name: "Rhode Island: Paul Mecurio"
        image: "/images/collections/culture/most-famous-comedian-by-state/rhode-island.jpg"
        description: "Paul Mecurio was born and raised in Providence, Rhode Island, and won an Emmy and a Peabody Award for his writing on The Daily Show."

      - name: "South Carolina: Chris Rock"
        image: "/images/collections/culture/most-famous-comedian-by-state/south-carolina.jpg"
        description: "Chris Rock was born in Andrews, South Carolina, before his family moved to Brooklyn, and he is regularly ranked among the greatest stand-up comedians of all time."

      - name: "South Dakota: Gary Mule Deer"
        image: "/images/collections/culture/most-famous-comedian-by-state/south-dakota.jpg"
        description: "Gary Mule Deer was born in Deadwood, South Dakota, and made more than 350 television appearances across six decades, including regular spots on The Tonight Show."

      - name: "Tennessee: Nate Bargatze"
        image: "/images/collections/culture/most-famous-comedian-by-state/tennessee.jpg"
        description: "Nate Bargatze was born in Nashville, Tennessee, and became the highest-grossing stand-up comedian of 2024, selling more than a million tickets on tour."

      - name: "Texas: Steve Martin"
        image: "/images/collections/culture/most-famous-comedian-by-state/texas.jpg"
        description: "Steve Martin was born in Waco, Texas, in 1945 and won back-to-back Grammy Awards for his comedy albums before becoming a leading film comedian."

      - name: "Utah: Roseanne Barr"
        image: "/images/collections/culture/most-famous-comedian-by-state/utah.jpg"
        description: "Roseanne Barr was born in Salt Lake City, Utah, and started her stand-up career at a local open mic before her sitcom Roseanne became a ratings powerhouse."

      - name: "Vermont: Damon Wayans Jr."
        image: "/images/collections/culture/most-famous-comedian-by-state/vermont.jpg"
        description: "Damon Wayans Jr. was born in Huntington, Vermont, in his grandmother's home and later built his stand-up and acting career around his role on New Girl."

      - name: "Virginia: Patton Oswalt"
        image: "/images/collections/culture/most-famous-comedian-by-state/virginia.jpg"
        description: "Patton Oswalt was born in Portsmouth, Virginia, the son of a Marine Corps officer, and became one of stand-up's most acclaimed voices with specials like Werewolves and Lycanthropes."

      - name: "Washington: Sam Kinison"
        image: "/images/collections/culture/most-famous-comedian-by-state/washington.jpg"
        description: "Sam Kinison was born in Yakima, Washington, and became one of the defining, most explosive stand-up voices of the 1980s comedy boom."

      - name: "West Virginia: Steve Harvey"
        image: "/images/collections/culture/most-famous-comedian-by-state/west-virginia.jpg"
        description: "Steve Harvey was born in Welch, West Virginia, and worked clubs for years before the Kings of Comedy tour and hosting Family Feud made him a household name."

      - name: "Wisconsin: Will Durst"
        image: "/images/collections/culture/most-famous-comedian-by-state/wisconsin.jpg"
        description: "Will Durst was born in Milwaukee, Wisconsin, and has spent decades as a political satirist, syndicated columnist, and stand-up comedian."

      - name: "Wyoming: Brandt Tobler"
        image: "/images/collections/culture/most-famous-comedian-by-state/wyoming.jpg"
        description: "Brandt Tobler was born and raised in Cheyenne, Wyoming, and has become the state's most recognized working comedian, appearing on Comedy Central's This Is Not Happening."

  - id: "how-these-comedians-got-their-start"
    icon: "fa-solid fa-microphone"
    title: "How These Comedians Got Their Start"
    paragraphs:
      - "Several names on this list built entire careers around the place they were born. Fortune Feimster and Bridget Everett both set major projects in their home states, Charlotte and Kansas respectively, while Jeff Foxworthy turned Georgia small-town life into an entire comedy franchise."
      - "Others left almost as soon as they could. Chris Rock's family moved from Andrews, South Carolina, to Brooklyn while he was young, and Sarah Silverman left Bedford, New Hampshire, for New York University before building her stand-up career in city clubs."

