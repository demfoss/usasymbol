faq:
  - question: "Who is the most famous comedian from Texas?"
    answer: "Steve Martin represents Texas. Born in Waco in 1945, he won back-to-back Grammy Awards for his comedy albums before moving into film."

  - question: "Who is the most famous comedian from New York?"
    answer: "Jerry Seinfeld represents New York, born in Brooklyn. He turned observational stand-up into one of the most successful sitcoms in television history."

  - question: "Which state comedian is considered the most influential in stand-up history?"
    answer: "Richard Pryor, born in Peoria, Illinois, is widely credited as one of the most influential stand-up comedians in American history for his raw, confessional style."

  - question: "Is Chris Rock really from South Carolina?"
    answer: "Chris Rock was born in Andrews, South Carolina, in 1965, before his family relocated to Brooklyn, New York, where he was raised and began performing."

  - question: "Who is the most famous comedian from West Virginia?"
    answer: "Steve Harvey represents West Virginia, born in Welch. He worked clubs for years before the Kings of Comedy tour and hosting Family Feud."

  - question: "How was the most famous comedian from each state determined?"
    answer: "Each pick matches a documented birthplace to career achievement, favoring the most nationally recognized stand-up comedian actually born in that state rather than one who simply lived or worked there."

