  title: "Most Famous Comedian From Every State"
  description: "One comedian represents each U.S. state, from Richard Pryor in Illinois to Chris Rock in South Carolina and Steve Martin in Texas."

hero_image: "/images/collections/culture/most-famous-comedian-by-state/hero.jpg"
hero_image_alt: "Collage of well-known American stand-up comedians representing all 50 U.S. states"
hero_image_caption: "One comedian represents every U.S. state, from Jerry Seinfeld in New York to Chris Rock in South Carolina and Steve Harvey in West Virginia."

page:
  h1: "Most Famous Comedian From Every State"
  intro_title: "One Recognizable Comedian for Every State in the Union"

  quick_answer:
    - "Richard Pryor represents Illinois, born in Peoria in 1940. He is widely regarded as one of the most influential stand-up comedians in American history."
    - "Chris Rock represents South Carolina, born in the small town of Andrews before his family moved to Brooklyn, where he built his stand-up career."
    - "Steve Martin represents Texas, born in Waco in 1945. He won two Grammy Awards for his comedy albums before moving into film."
    - "Not every state has a household name. Wyoming's Brandt Tobler and North Dakota's Amber Preston are respected touring comedians without the national name recognition of the biggest entries on this list."

  methodology: "Each state's comedian was selected by matching documented birthplaces to career achievement, since no single published index ranks a comedian for every state the way some entertainment outlets do for actors or musicians. Selections favor the most nationally recognized stand-up comedian actually born in that state, drawing on biographical records, television credits, and touring history. Where a state has no widely famous comedian, the most documented working stand-up from that state is used instead."

  sources:
    - name: "Wikipedia biographical entries"
      url: "https://en.wikipedia.org/wiki/Category:American_stand-up_comedians"
      description: "Birthplace, career, and credit information for American stand-up comedians, cross-checked against individual biography pages"

