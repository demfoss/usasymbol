faq:
  - question: "How many states are included in this list?"
    answer: "This collection covers 23 states, each tied to one nationally documented, convicted criminal case. States without a well-sourced, appropriately verified case are left out rather than filled with an obscure or unresolved one."

  - question: "How was each person assigned to a state?"
    answer: "Each person is assigned to the state where their crimes were primarily committed and prosecuted, which in most cases differs from their birth state."

  - question: "Are any cases on this list unresolved or disputed?"
    answer: "No. Every entry ended in a documented conviction, guilty plea, or death sentence recorded in court proceedings. Unsolved or disputed cases were excluded rather than framed as settled fact."

  - question: "Who is the most famous criminal from Florida?"
    answer: "Ted Bundy is tied to Florida through the 1978 Chi Omega murders in Tallahassee, his 1979 conviction, and his 1989 execution there, though he committed earlier murders in other states."

  - question: "Which case on this list is the most recent?"
    answer: "Bryan Kohberger's Idaho case is the most recent, with the crimes committed in 2022 and sentencing completed in 2025."

  - question: "Which case on this list is the oldest?"
    answer: "Robert Chambliss's 1963 Birmingham church bombing and Byron De La Beckwith's 1963 killing of Medgar Evers in Mississippi are the earliest crimes on the list, though both cases took over a decade to reach conviction."

