sections:
  - id: "criminal-by-state"
    icon: "fa-solid fa-scale-balanced"
    style: "law-cards"
    title: "Most Notorious Criminal From Each State"
    paragraphs:
      - "Each entry below is assigned to the state where the underlying crimes were committed and prosecuted. Every case ended in a documented conviction, guilty plea, or death sentence, and the record for each is drawn from court proceedings and established news coverage."
    highlights:
      - name: "Alabama: Robert Chambliss"
        image: "/images/collections/culture/most-famous-criminal-by-state/alabama.jpg"
        description: "Robert Chambliss, a Ku Klux Klan member, planted the bomb that killed four girls at Birmingham's 16th Street Baptist Church on September 15, 1963. Alabama did not convict him until 1977, fourteen years after the bombing, when he received a life sentence for first-degree murder. He died in prison in 1985, and the case stands as one of the most extensively documented crimes of the civil rights era."

      - name: "Alaska: Robert Hansen"
        image: "/images/collections/culture/most-famous-criminal-by-state/alaska.jpg"
        description: "Robert Hansen, an Anchorage baker, abducted and killed women in the wilderness outside the city between 1971 and 1983. He was convicted in 1984 after confessing to 17 killings as part of a plea agreement covering four murder counts, and he received a sentence of 461 years plus life without parole. Hansen died in state custody in 2014."

      - name: "Arizona: Jodi Arias"
        image: "/images/collections/culture/most-famous-criminal-by-state/arizona.jpg"
        description: "Jodi Arias killed her boyfriend, Travis Alexander, in his Mesa home in June 2008. A jury convicted her of first-degree murder in 2013, and after a second sentencing jury deadlocked on the death penalty, a judge sentenced her to life without parole in 2015. She remains incarcerated at Arizona's Perryville prison."

      - name: "California: Charles Manson"
        image: "/images/collections/culture/most-famous-criminal-by-state/california.jpg"
        description: "Charles Manson directed members of his followers, later called the Manson Family, in the Tate-LaBianca killings across Los Angeles in August 1969. A jury convicted him of first-degree murder and conspiracy in 1971 and sentenced him to death, a sentence commuted to life in prison in 1972 when California voided its death penalty statute. Manson died in prison in 2017."

      - name: "Florida: Ted Bundy"
        image: "/images/collections/culture/most-famous-criminal-by-state/florida.jpg"
        description: "Ted Bundy killed two women at Florida State University's Chi Omega sorority house in Tallahassee in January 1978 and murdered a 12-year-old girl weeks later. A Florida jury convicted him in July 1979, and he was executed in the electric chair at Florida State Prison in January 1989 after confessing to dozens of murders committed across several states."

      - name: "Georgia: Wayne Williams"
        image: "/images/collections/culture/most-famous-criminal-by-state/georgia.jpg"
        description: "Wayne Williams was investigated in connection with the Atlanta murders of 1979 to 1981, a series of killings of Black children and young adults that gripped the city. A jury convicted him of two of the adult murders in February 1982 based on fiber and hair evidence, and he received two consecutive life sentences. He has been denied parole repeatedly since becoming eligible in 2005."

      - name: "Idaho: Bryan Kohberger"
        image: "/images/collections/culture/most-famous-criminal-by-state/idaho.jpg"
        description: "Bryan Kohberger killed four University of Idaho students in an off-campus house in Moscow in November 2022. He pleaded guilty in 2023 to avoid the death penalty, and in July 2025 a judge sentenced him to four consecutive life terms without parole plus ten years for burglary. It is the most recent case in this collection."

      - name: "Illinois: John Wayne Gacy"
        image: "/images/collections/culture/most-famous-criminal-by-state/illinois.jpg"
        description: "John Wayne Gacy murdered 33 teenage boys and young men in Cook County between 1972 and 1978, burying most of the victims beneath his suburban Chicago home. A jury convicted him on all 33 counts in 1980, and he was executed by lethal injection at Stateville Correctional Center in May 1994."

      - name: "Kansas: Dennis Rader"
        image: "/images/collections/culture/most-famous-criminal-by-state/kansas.jpg"
        description: "Dennis Rader, who called himself BTK, killed 10 people around Wichita between 1974 and 1991 and sent taunting letters to police and news outlets during that span. He was arrested in 2005 after decades at large, and a Sedgwick County judge sentenced him to 10 consecutive life terms, requiring at least 175 years served before any parole eligibility."

      - name: "Massachusetts: James Bulger"
        image: "/images/collections/culture/most-famous-criminal-by-state/massachusetts.jpg"
        description: "James \"Whitey\" Bulger led the Winter Hill Gang in Boston through decades of organized crime while serving as an FBI informant, an arrangement that shielded him from prosecution for years. A federal jury convicted him in 2013 on 31 counts, including participation in 11 murders, and he received two consecutive life sentences plus five years. Bulger was killed by fellow inmates at a West Virginia federal prison in 2018."

      - name: "Mississippi: Byron De La Beckwith"
        image: "/images/collections/culture/most-famous-criminal-by-state/mississippi.jpg"
        description: "Byron De La Beckwith shot and killed civil rights leader Medgar Evers outside his Jackson home in June 1963. Two 1964 trials ended in hung juries, and Beckwith walked free for three decades before a Mississippi jury convicted him of murder in February 1994 based on new witness testimony and physical evidence. He died in prison in 2001."

      - name: "Montana: Ted Kaczynski"
        image: "/images/collections/culture/most-famous-criminal-by-state/montana.jpg"
        description: "Ted Kaczynski, known as the Unabomber, built and mailed bombs from a remote cabin near Lincoln, Montana, killing three people and injuring 23 others in a campaign that ran from 1978 to 1995. His brother recognized his writing in a published manifesto and alerted the FBI, leading to his arrest at the cabin in 1996. Kaczynski pleaded guilty in 1998 to four consecutive life terms and died by suicide in a federal prison medical facility in 2023."

      - name: "Nebraska: Charles Starkweather"
        image: "/images/collections/culture/most-famous-criminal-by-state/nebraska.jpg"
        description: "Charles Starkweather killed 11 people across Nebraska and Wyoming during a spree with his 14-year-old girlfriend, Caril Ann Fugate, between December 1957 and January 1958. He was captured near Douglas, Wyoming, and convicted in Nebraska, where he was executed in the electric chair in June 1959. The case became one of the most chronicled crime sprees of the 1950s."

      - name: "New York: David Berkowitz"
        image: "/images/collections/culture/most-famous-criminal-by-state/new-york.jpg"
        description: "David Berkowitz, who signed letters to police as Son of Sam, shot 13 people in New York City between 1976 and 1977, killing six. He pleaded guilty in 1978 and was sentenced to six consecutive terms of 25 years to life. Berkowitz has repeatedly been denied parole and remains incarcerated."

      - name: "Ohio: Ariel Castro"
        image: "/images/collections/culture/most-famous-criminal-by-state/ohio.jpg"
        description: "Ariel Castro held three women captive in his Cleveland home for roughly a decade, beginning in 2002, until one of them helped the group escape in May 2013. He pleaded guilty to hundreds of counts including kidnapping and rape, and a judge sentenced him to life plus 1,000 years in August 2013. Castro died by suicide in his prison cell about a month later."

      - name: "Oklahoma: Timothy McVeigh"
        image: "/images/collections/culture/most-famous-criminal-by-state/oklahoma.jpg"
        description: "Timothy McVeigh detonated a truck bomb outside the Alfred P. Murrah Federal Building in Oklahoma City on April 19, 1995, killing 168 people. A federal jury convicted him on 15 counts of murder and conspiracy in 1997, and he was executed by lethal injection in June 2001, the first federal execution carried out since 1963."

      - name: "Oregon: Diane Downs"
        image: "/images/collections/culture/most-famous-criminal-by-state/oregon.jpg"
        description: "Diane Downs shot her three children near Springfield, Oregon, in May 1983, killing one and wounding the other two, then told police a stranger had attacked them during an attempted carjacking. Investigators found inconsistencies in her account, and a jury convicted her of murder and attempted murder in 1984. She received a sentence of life plus 50 years and has been denied parole multiple times."

      - name: "South Carolina: Susan Smith"
        image: "/images/collections/culture/most-famous-criminal-by-state/south-carolina.jpg"
        description: "Susan Smith drowned her two young sons by letting her car roll into John D. Long Lake in Union, South Carolina, in October 1994, after first telling police a carjacker had taken the children. She confessed nine days later once investigators pressed the inconsistencies in her story. A jury convicted her of murder in 1995, and she was sentenced to life with the possibility of parole."

      - name: "Texas: Angel Maturino Resendiz"
        image: "/images/collections/culture/most-famous-criminal-by-state/texas.jpg"
        description: "Angel Maturino Resendiz, known as the Railroad Killer, traveled by freight train between crime scenes and was linked to killings in Texas and several other states through the 1990s. A Texas jury sentenced him to death in 2000 for the murder of a Houston physician, and he was executed by lethal injection in Huntsville in June 2006. Authorities connected him to eight killings in Texas alone."

      - name: "Utah: Mark Hofmann"
        image: "/images/collections/culture/most-famous-criminal-by-state/utah.jpg"
        description: "Mark Hofmann, a document forger who sold fabricated historical papers, killed two people with pipe bombs in Salt Lake City in October 1985 to stop his fraud from being exposed. He was seriously injured the next day when a bomb he was carrying detonated in his car, leading to his arrest. Hofmann pleaded guilty to second-degree murder and theft by deception in 1987 and was sentenced to life in prison."

      - name: "Virginia: John Allen Muhammad"
        image: "/images/collections/culture/most-famous-criminal-by-state/virginia.jpg"
        description: "John Allen Muhammad, along with teenage accomplice Lee Boyd Malvo, carried out a series of sniper shootings across the Washington, D.C. area in October 2002, killing 10 people. A Virginia jury convicted Muhammad in 2003 for a killing at a Manassas-area gas station, and he was executed by lethal injection at Greensville Correctional Center in November 2009. Malvo is serving a life sentence."

      - name: "Washington: Gary Ridgway"
        image: "/images/collections/culture/most-famous-criminal-by-state/washington.jpg"
        description: "Gary Ridgway, known as the Green River Killer, murdered women in the Seattle area between 1982 and 1998, mainly targeting sex workers and runaways. He pleaded guilty in 2003 to 48 counts of murder as part of an agreement that spared him the death penalty in exchange for identifying burial sites, and a King County judge sentenced him to consecutive life terms without parole. A 49th conviction followed in 2011 after another victim's remains were identified."

      - name: "Wisconsin: Jeffrey Dahmer"
        image: "/images/collections/culture/most-famous-criminal-by-state/wisconsin.jpg"
        description: "Jeffrey Dahmer killed 17 men and boys in Wisconsin and Ohio between 1978 and 1991, most of the murders occurring in his Milwaukee apartment. A jury found him sane and convicted him in February 1992, and he was sentenced to 15 consecutive life terms. Dahmer was beaten to death by a fellow inmate at a Wisconsin prison in November 1994."

  - id: "how-these-cases-differ"
    icon: "fa-solid fa-timeline"
    title: "How These Cases Differ in Scale and Era"
    paragraphs:
      - "Some entries span decades of investigation. Byron De La Beckwith walked free for 30 years after two hung juries before Mississippi convicted him in 1994, and Robert Chambliss was not convicted until 1977 for a bombing committed in 1963."
      - "Others closed quickly by comparison. Idaho's Bryan Kohberger pleaded guilty within three years of his 2022 crimes, and Susan Smith was convicted less than a year after her 1994 crime in South Carolina. Sentencing outcomes vary just as widely, from executions in Florida, Illinois, Nebraska, Oklahoma, Texas, and Virginia to life sentences with parole eligibility in New York and South Carolina."

