page:
  h1: "The Most Notorious Convicted Criminal From Each State"
  intro_title: "23 States, 23 Documented Criminal Cases"

  quick_answer:
    - "Twenty-three states carry a nationally documented, convicted criminal case tied to where the crimes were committed, from Ted Bundy in Florida to Jeffrey Dahmer in Wisconsin."
    - "Charles Manson directed the Tate-LaBianca killings in California in 1969 and died in prison in 2017, while Timothy McVeigh's 1995 Oklahoma City bombing killed 168 people before his 2001 execution."
    - "Some cases reach back decades, like Robert Chambliss's 1963 Birmingham church bombing, while Idaho's entry is recent: Bryan Kohberger pleaded guilty to the 2022 University of Idaho student murders and was sentenced in 2025."
    - "States without a nationally documented, appropriately sourced case are left out rather than filled with a speculative or unconfirmed local case, so this list totals 23 states, not all 50."

  methodology: "Each person here is assigned to the state where their crimes were primarily committed and prosecuted, not their birth state, since that produces a clearer regional association. Only cases with a documented legal outcome, a conviction, guilty plea, or death sentence recorded in court records and established news coverage, qualify, and unsolved or disputed cases are excluded rather than framed as fact."

  sources:
    - name: "FBI History: Famous Cases & Criminals"
      url: "https://www.fbi.gov/history/famous-cases"
      description: "Federal Bureau of Investigation case summaries used to confirm crime details, investigation timelines, and outcomes for federal cases"
    - name: "Death Penalty Information Center"
      url: "https://deathpenaltyinfo.org"
      description: "Independent research center tracking capital sentences and executions, used to confirm sentencing and execution dates"
    - name: "Encyclopaedia Britannica"
      url: "https://www.britannica.com"
      description: "Reference biographies used to verify conviction dates, sentences, and case outcomes"
    - name: "History.com: This Day in History"
      url: "https://www.history.com"
      description: "Dated historical case summaries used to confirm timelines for trials, sentences, and executions"

