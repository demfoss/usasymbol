faq:
  - question: "Who is the most famous author from Maine?"
    answer: "Stephen King represents Maine. Nearly all of his novels are set in fictional versions of the state, and he released his 66th book in 2025."

  - question: "Who is the most famous author from Texas?"
    answer: "Colleen Hoover represents Texas, with 26 books that have sold more than 20 million copies and a spot on Time's Most Influential People list in 2023."

  - question: "Which states are represented by Pulitzer Prize winners?"
    answer: "More than a dozen states are represented by Pulitzer winners, including Georgia's Alice Walker, Ohio's Toni Morrison, Michigan's Jeffrey Eugenides, and Pennsylvania's John Updike, who won the prize twice."

  - question: "Who is the most famous author from Mississippi?"
    answer: "William Faulkner represents Mississippi. He lived and is buried in Oxford, and he set most of his novels in the fictional Yoknapatawpha County built around it."

  - question: "How was the most famous author from each state determined?"
    answer: "Each state's author was chosen based on fame in terms of ubiquity, literary acclaim, and financial success, with extra weight given to authors who set their work in their home state, then matched to the author's birth state."

  - question: "Who is the most famous author from New York?"
    answer: "James Baldwin represents New York, with novels including If Beale Street Could Talk and Go Tell It on the Mountain that shaped American writing on race and identity."

