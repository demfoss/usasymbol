sections:
  - id: "author-by-state"
    icon: "fa-solid fa-book"
    style: "law-cards"
    title: "Most Famous Author From Every State"
    paragraphs:
      - "Some states were an easy call, built around a single writer whose work defines the place in the national imagination. Others came down to a choice between a literary Pulitzer winner and a commercially dominant best seller, and the pick below often favors whichever author set their work in their home state."
    highlights:
      - name: "Alabama: Harper Lee"
        image: "/images/collections/culture/most-famous-author-by-state/alabama.jpg"
        description: "Harper Lee was born and raised in Monroeville and set To Kill a Mockingbird in a fictional Alabama town modeled directly on it. The novel remains one of the most widely read books in American schools, which keeps her the state's clear representative."

      - name: "Alaska: Velma Wallis"
        image: "/images/collections/culture/most-famous-author-by-state/alaska.jpg"
        description: "Velma Wallis was born near Fort Yukon in a remote Alaska Native village and wrote Two Old Women, a novel that has sold more than 1.5 million copies and won the American Book Award in 2003. Her firsthand roots in the state give her book an authenticity few other Alaska-linked authors can match."

      - name: "Arizona: Jeannette Walls"
        image: "/images/collections/culture/most-famous-author-by-state/arizona.jpg"
        description: "Jeannette Walls wrote The Glass Castle, a memoir that became a 2005 best seller and was adapted into a 2017 film starring Brie Larson. The book's staying power in book clubs and classrooms makes her Arizona's pick."

      - name: "Arkansas: John Grisham"
        image: "/images/collections/culture/most-famous-author-by-state/arkansas.jpg"
        description: "John Grisham was born in Jonesboro and helped define the modern legal thriller with novels like A Time to Kill. His decades of best sellers have made him one of the most commercially successful authors alive, securing Arkansas's spot."

      - name: "California: Joan Didion"
        image: "/images/collections/culture/most-famous-author-by-state/california.jpg"
        description: "Joan Didion built a career on essays and novels that captured California's culture, and she won the National Book Award in 2005 for The Year of Magical Thinking. Her influence on American nonfiction writing makes her the state's representative."

      - name: "Colorado: Ken Kesey"
        image: "/images/collections/culture/most-famous-author-by-state/colorado.jpg"
        description: "Ken Kesey was born in La Junta and wrote One Flew Over the Cuckoo's Nest, later adapted into an Oscar-winning film. That single novel's lasting place in American literature makes him Colorado's clear choice."

      - name: "Connecticut: Harriet Beecher Stowe"
        image: "/images/collections/culture/most-famous-author-by-state/connecticut.jpg"
        description: "Harriet Beecher Stowe wrote Uncle Tom's Cabin in 1852, a novel credited with shifting public opinion on slavery before the Civil War, and she died in Hartford in 1896. Few authors from any state have had that kind of direct historical impact."

      - name: "Delaware: Rebecca Lee Crumpler"
        image: "/images/collections/culture/most-famous-author-by-state/delaware.jpg"
        description: "Rebecca Lee Crumpler became the first Black woman to earn a medical degree in the United States and wrote A Book of Medical Discourses in 1883. Delaware's pick stands apart from the rest of the list as a medical text rather than fiction, reflecting a genuinely rare achievement."

      - name: "Florida: Carl Hiaasen"
        image: "/images/collections/culture/most-famous-author-by-state/florida.jpg"
        description: "Carl Hiaasen built a career on satirical novels like Hoot, Flush, and Bad Monkey, most of them set in his home state, and wrote a Miami Herald column until 2021. His decades of skewering Florida's excesses in fiction make him the natural pick."

      - name: "Georgia: Alice Walker"
        image: "/images/collections/culture/most-famous-author-by-state/georgia.jpg"
        description: "Alice Walker was born in Putnam County in 1944 and won the Pulitzer Prize in 1983 for The Color Purple. That prize, plus the novel's continued place in American literature, makes her Georgia's representative."

      - name: "Hawaii: Kaui Hart Hemmings"
        image: "/images/collections/culture/most-famous-author-by-state/hawaii.jpg"
        description: "Kaui Hart Hemmings was born and raised on Oahu and wrote The Descendants, adapted into a 2011 film starring George Clooney. Her novel's grounding in island family life makes her Hawaii's pick."

      - name: "Idaho: Vardis Fisher"
        image: "/images/collections/culture/most-famous-author-by-state/idaho.jpg"
        description: "Vardis Fisher was born in Annis and wrote Children of God along with his sprawling twelve-part Testament of Man series. His prolific output over decades gives Idaho a writer whose body of work rivals any state's."

      - name: "Illinois: Ernest Hemingway"
        image: "/images/collections/culture/most-famous-author-by-state/illinois.jpg"
        description: "Ernest Hemingway was born in Oak Park and wrote The Old Man and the Sea, which won the Pulitzer Prize and helped secure his Nobel Prize in Literature. Few American authors carry his level of global recognition, which makes Illinois's choice unmistakable."

      - name: "Indiana: Kurt Vonnegut"
        image: "/images/collections/culture/most-famous-author-by-state/indiana.jpg"
        description: "Kurt Vonnegut was born in Indianapolis and wrote Slaughterhouse-Five in 1969, a novel that became a defining work of American satire and anti-war literature. His hometown ties run through much of his fiction, keeping him Indiana's representative."

      - name: "Iowa: Bill Bryson"
        image: "/images/collections/culture/most-famous-author-by-state/iowa.jpg"
        description: "Bill Bryson was born in Des Moines and wrote A Walk in the Woods, a 1997 travel memoir adapted into a 2015 film. His wry, widely translated travel writing makes him Iowa's pick."

      - name: "Kansas: William Inge"
        image: "/images/collections/culture/most-famous-author-by-state/kansas.jpg"
        description: "William Inge was born in Independence and won an Academy Award for the 1961 screenplay Splendor in the Grass. His plays and screenplays about small-town Midwestern life keep him tied to Kansas."

      - name: "Kentucky: Hunter S. Thompson"
        image: "/images/collections/culture/most-famous-author-by-state/kentucky.jpg"
        description: "Hunter S. Thompson was born in Louisville and founded gonzo journalism with Fear and Loathing in Las Vegas in 1971. His influence on American nonfiction writing extends well beyond that single book, making him Kentucky's pick."

      - name: "Louisiana: Anne Rice"
        image: "/images/collections/culture/most-famous-author-by-state/louisiana.jpg"
        description: "Anne Rice was born in New Orleans and set Interview with the Vampire in the city's French Quarter, launching a series that reshaped modern vampire fiction. Louisiana's gothic literary identity is built largely on her work."

      - name: "Maine: Stephen King"
        image: "/images/collections/culture/most-famous-author-by-state/maine.jpg"
        description: "Stephen King was born in Portland and has set nearly all of his novels in fictional versions of Maine, releasing his 66th book in 2025. No other author on this list has built as consistent and long-running a body of work tied to a single home state."

      - name: "Maryland: Tom Clancy"
        image: "/images/collections/culture/most-famous-author-by-state/maryland.jpg"
        description: "Tom Clancy was born in Baltimore and created the Jack Ryan series, including the 1989 best seller Clear and Present Danger. His technically detailed military thrillers defined an entire genre, securing Maryland's pick."

      - name: "Massachusetts: W.E.B. Du Bois"
        image: "/images/collections/culture/most-famous-author-by-state/massachusetts.jpg"
        description: "W.E.B. Du Bois was born in Great Barrington in 1868 and wrote The Souls of Black Folk in 1903, a foundational text in African American literature and sociology. His influence extends across both fields, giving Massachusetts a pick with lasting national impact."

      - name: "Michigan: Jeffrey Eugenides"
        image: "/images/collections/culture/most-famous-author-by-state/michigan.jpg"
        description: "Jeffrey Eugenides was born in Detroit, wrote The Virgin Suicides in 1993, and won the Pulitzer Prize in 2002 for Middlesex. That prize-winning novel, set partly in Detroit, makes him Michigan's clear representative."

      - name: "Minnesota: F. Scott Fitzgerald"
        image: "/images/collections/culture/most-famous-author-by-state/minnesota.jpg"
        description: "F. Scott Fitzgerald was born in St. Paul and wrote The Great Gatsby, widely considered one of the defining novels of American literature. Minnesota's literary reputation rests substantially on his name."

      - name: "Mississippi: William Faulkner"
        image: "/images/collections/culture/most-famous-author-by-state/mississippi.jpg"
        description: "William Faulkner lived, wrote, and is buried in Oxford, setting most of his novels in the fictional Yoknapatawpha County built around it. That deep, sustained connection to a single Mississippi place makes him the state's defining author."

      - name: "Missouri: Maya Angelou"
        image: "/images/collections/culture/most-famous-author-by-state/missouri.jpg"
        description: "Maya Angelou was born in St. Louis and wrote I Know Why the Caged Bird Sings in 1969, a memoir that became a staple of American literature classrooms. Her later work as a poet and public figure further cemented Missouri's pick."

      - name: "Montana: Maile Meloy"
        image: "/images/collections/culture/most-famous-author-by-state/montana.jpg"
        description: "Maile Meloy was born in Helena and wrote Liars and Saints in 2003, alongside frequent contributions to The New Yorker. Her steady literary output makes her Montana's representative."

      - name: "Nebraska: Nicholas Sparks"
        image: "/images/collections/culture/most-famous-author-by-state/nebraska.jpg"
        description: "Nicholas Sparks was born in Omaha and wrote The Notebook in 1996, which became one of the best-known romance novels of its era after its film adaptation. His prolific catalog of adapted best sellers keeps him Nebraska's pick."

      - name: "Nevada: Charles Bock"
        image: "/images/collections/culture/most-famous-author-by-state/nevada.jpg"
        description: "Charles Bock was born in Las Vegas and wrote Beautiful Children in 2008, a novel set in the city and named a New York Times Notable Book. Nevada's most recognized literary voice writes directly about the place he grew up."

      - name: "New Hampshire: Dan Brown"
        image: "/images/collections/culture/most-famous-author-by-state/new-hampshire.jpg"
        description: "Dan Brown grew up at Phillips Exeter Academy and wrote The Da Vinci Code in 2003, one of the best-selling novels of the 2000s. New Hampshire's most commercially dominant author built a career on that single global best seller."

      - name: "New Jersey: Philip Roth"
        image: "/images/collections/culture/most-famous-author-by-state/new-jersey.jpg"
        description: "Philip Roth was born in Newark and wrote American Pastoral and Portnoy's Complaint, novels that repeatedly returned to his home state's postwar Jewish communities. That body of work makes him New Jersey's clear representative."

      - name: "New Mexico: Rudolfo Anaya"
        image: "/images/collections/culture/most-famous-author-by-state/new-mexico.jpg"
        description: "Rudolfo Anaya was born in Pastura and wrote Bless Me, Ultima in 1972, a novel considered a founding work of Chicano literature. His role in establishing that literary tradition makes him New Mexico's pick."

      - name: "New York: James Baldwin"
        image: "/images/collections/culture/most-famous-author-by-state/new-york.jpg"
        description: "James Baldwin was born in New York City and wrote If Beale Street Could Talk and Go Tell It on the Mountain, novels that shaped American writing on race and identity. His national and international influence makes him the clear pick for New York."

      - name: "North Carolina: Thomas Wolfe"
        image: "/images/collections/culture/most-famous-author-by-state/north-carolina.jpg"
        description: "Thomas Wolfe was born in Asheville and wrote Look Homeward, Angel, a thinly veiled account of his own upbringing there. His sprawling, autobiographical style influenced generations of American novelists after him."

      - name: "North Dakota: Louis L'Amour"
        image: "/images/collections/culture/most-famous-author-by-state/north-dakota.jpg"
        description: "Louis L'Amour was born in Jamestown in 1908 and wrote 86 novels, with all 101 of his books still in print at the time of his death in 1988. That sustained commercial output makes him North Dakota's representative."

      - name: "Ohio: Toni Morrison"
        image: "/images/collections/culture/most-famous-author-by-state/ohio.jpg"
        description: "Toni Morrison was born in Lorain and won the Pulitzer Prize in 1988 for Beloved. Her later Nobel Prize in Literature makes her one of the most decorated writers on this entire list, anchoring Ohio's pick."

      - name: "Oklahoma: Ralph Ellison"
        image: "/images/collections/culture/most-famous-author-by-state/oklahoma.jpg"
        description: "Ralph Ellison was born in Oklahoma City and wrote Invisible Man in 1952, a novel that won the National Book Award and remains a cornerstone of American literature. Oklahoma's literary reputation rests heavily on that single, enduring work."

      - name: "Oregon: Beverly Cleary"
        image: "/images/collections/culture/most-famous-author-by-state/oregon.jpg"
        description: "Beverly Cleary was born in Yamhill and wrote the Henry Huggins and Ramona series of children's books, living to 104 years old. Generations of young readers grew up on her work, making her Oregon's pick."

      - name: "Pennsylvania: John Updike"
        image: "/images/collections/culture/most-famous-author-by-state/pennsylvania.jpg"
        description: "John Updike won the Pulitzer Prize twice, in 1981 and 1990, and wrote The Witches of Eastwick among dozens of other novels. That rare double Pulitzer makes him Pennsylvania's clear representative."

      - name: "Rhode Island: Cormac McCarthy"
        image: "/images/collections/culture/most-famous-author-by-state/rhode-island.jpg"
        description: "Cormac McCarthy was born in Providence and wrote All the Pretty Horses and The Road, the latter winning the Pulitzer Prize in 2007. His stark, widely acclaimed prose style makes him Rhode Island's pick."

      - name: "South Carolina: Peggy Parish"
        image: "/images/collections/culture/most-famous-author-by-state/south-carolina.jpg"
        description: "Peggy Parish created the Amelia Bedelia character, a children's book series that celebrated its 60th anniversary in 2023. Generations of early readers have learned wordplay through her books, keeping her South Carolina's representative."

      - name: "South Dakota: Adam Johnson"
        image: "/images/collections/culture/most-famous-author-by-state/south-dakota.jpg"
        description: "Adam Johnson was born in Sioux Falls and won the Pulitzer Prize in 2012 for The Orphan Master's Son, a novel set in North Korea. That prize gives South Dakota a writer recognized for tackling subject matter far outside his home state."

      - name: "Tennessee: Peter Taylor"
        image: "/images/collections/culture/most-famous-author-by-state/tennessee.jpg"
        description: "Peter Taylor won the Pulitzer Prize in 1987 for A Summons to Memphis, a novel steeped in the city where he set much of his fiction. His close attention to Tennessee's social world makes him the state's pick."

      - name: "Texas: Colleen Hoover"
        image: "/images/collections/culture/most-famous-author-by-state/texas.jpg"
        description: "Colleen Hoover was born and raised in Saltillo and has released 26 books that have sold more than 20 million copies, earning her a spot on Time's Most Influential People list in 2023. No other author on this list has built that scale of readership in the current market, making her Texas's headline pick."

      - name: "Utah: Thomas Savage"
        image: "/images/collections/culture/most-famous-author-by-state/utah.jpg"
        description: "Thomas Savage was born in Salt Lake City and wrote The Power of the Dog in 1967, adapted into an Oscar-nominated 2021 film decades after publication. That late-life rediscovery of his novel makes him Utah's pick."

      - name: "Vermont: Ralph Nading Hill"
        image: "/images/collections/culture/most-famous-author-by-state/vermont.jpg"
        description: "Ralph Nading Hill was born in Burlington, edited Vermont Life magazine, and wrote The Winooski about the state's river valley. His career spent documenting Vermont directly makes him its representative."

      - name: "Virginia: Willa Cather"
        image: "/images/collections/culture/most-famous-author-by-state/virginia.jpg"
        description: "Willa Cather wrote O Pioneers! and My Antonia and won the Pulitzer Prize for One of Ours. Her place among the defining American novelists of the early twentieth century makes her Virginia's pick."

      - name: "Washington: Debbie Macomber"
        image: "/images/collections/culture/most-famous-author-by-state/washington.jpg"
        description: "Debbie Macomber was born in Yakima and has more than 200 books in print, including the Cedar Cove series adapted into a Hallmark television show. Her sustained commercial success over decades makes her Washington's representative."

      - name: "West Virginia: Mary Lee Settle"
        image: "/images/collections/culture/most-famous-author-by-state/west-virginia.jpg"
        description: "Mary Lee Settle wrote the five-novel Beulah Quintet and won the National Book Award in 1978. Her decades-long project chronicling her home region's history makes her West Virginia's pick."

      - name: "Wisconsin: Laura Ingalls Wilder"
        image: "/images/collections/culture/most-famous-author-by-state/wisconsin.jpg"
        description: "Laura Ingalls Wilder was born in the Wisconsin big woods and wrote Little House on the Prairie in 1935, part of a series that has shaped how generations of readers picture pioneer childhood. Her deep ties to the state's frontier history make her the clear representative."

      - name: "Wyoming: Patricia MacLachlan"
        image: "/images/collections/culture/most-famous-author-by-state/wyoming.jpg"
