hero_image_caption: "One writer represents every U.S. state, from Stephen King in Maine to Toni Morrison in Ohio and Colleen Hoover in Texas."

page:
  h1: "Most Famous Author From Every State"
  intro_title: "One Defining Author for Every State in the Union"

  quick_answer:
    - "Stephen King represents Maine, where nearly all of his novels are set in fictional versions of the state, with his 66th book released in 2025."
    - "Colleen Hoover represents Texas with more than 20 million copies sold across 26 books, making her one of the best-selling living authors on the list."
    - "Three Pulitzer Prize winners anchor separate states: Alice Walker for The Color Purple in Georgia, Toni Morrison for Beloved in Ohio, and Jeffrey Eugenides for Middlesex in Michigan."
    - "William Faulkner represents Mississippi, where he set most of his novels in the fictional Yoknapatawpha County built around his hometown of Oxford."

  methodology: "This collection follows Business Insider's 2025 editorial ranking, which weighed each author's fame in terms of ubiquity, literary acclaim, and financial success, with extra consideration given to authors who set their work in their home state. Authors are matched to the state where they were born."

  sources:
    - name: "Business Insider: The Most Famous Author From Every State"
      url: "https://www.yahoo.com/entertainment/articles/most-famous-author-every-state-133653896.html"
      description: "Business Insider's state-by-state editorial selection of each state's most famous author, published May 7, 2025 and syndicated via Yahoo Entertainment"

