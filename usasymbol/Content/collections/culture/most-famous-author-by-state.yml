    title: "How Many Pulitzer Prize Winners Made the List"
    paragraphs:
      - "More than a dozen of the writers on this list have won a Pulitzer Prize, including Alice Walker for Georgia, Toni Morrison for Ohio, Jeffrey Eugenides for Michigan, John Updike for Pennsylvania, and Cormac McCarthy for Rhode Island. Updike is the only author on the list to win the prize twice, in 1981 and 1990."
      - "Commercial success tells a different story. Colleen Hoover in Texas, Louis L'Amour in North Dakota, and Debbie Macomber in Washington built their reputations on sales figures and best-seller lists rather than literary awards, proof that the most famous author from a state is not always the most decorated one."

