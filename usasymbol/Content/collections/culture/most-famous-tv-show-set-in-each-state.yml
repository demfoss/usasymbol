sections:
  - id: "tv-show-by-state"
    icon: "fa-solid fa-tv"
    style: "law-cards"
    title: "The Most Famous TV Show Set in Each State"
    paragraphs:
      - "Television has claimed some states more thoroughly than others. New Jersey belongs to The Sopranos, Montana now belongs to Yellowstone, and Wisconsin has quietly hosted the same fictional city, Genoa City, for more than 50 years of daytime television."
    highlights:
      - name: "Alabama: Hart of Dixie"
        description: "The CW dramedy (2011-2015) follows a young Manhattan doctor who relocates to practice medicine in the small fictional town of Bluebell, Alabama."

      - name: "Alaska: Northern Exposure"
        description: "The CBS series (1990-1995) follows a New York doctor sent to practice in the fictional small town of Cicely, Alaska, though it was actually filmed in Roslyn, Washington."

      - name: "Arizona: Medium"
        description: "Patricia Arquette starred in this NBC/CBS series (2005-2011) as a psychic working with the Phoenix, Arizona district attorney's office, loosely based on real-life medium Allison DuBois, who lives in the Phoenix area."

      - name: "Arkansas: 19 Kids and Counting"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/arkansas.jpg"
        description: "The TLC reality series (2008-2015) followed the large Duggar family of Tontitown, Arkansas, until it was cancelled amid a family scandal."

      - name: "California: Beverly Hills, 90210"
        description: "The Fox teen drama (1990-2000) followed a group of friends at a fictional Beverly Hills high school, one of the defining shows of the affluent Southern California teen genre."

      - name: "Colorado: Last Man Standing"
        description: "Tim Allen starred in this ABC/Fox sitcom (2011-2021) as a father of three running a Colorado-based outdoor sporting goods company."

      - name: "Connecticut: Gilmore Girls"
        description: "The WB/CW series (2000-2007) follows a single mother and daughter in the fictional small Connecticut town of Stars Hollow, still one of the most rewatched shows of its era."

      - name: "Delaware: The Pretender"
        description: "The NBC series (1996-2000) follows a genius who escapes a secretive research facility, the Centre, based in the fictional town of Blue Cove, Delaware, and assumes new identities to evade capture."

      - name: "Florida: The Golden Girls"
        description: "The NBC sitcom (1985-1992) follows four older women sharing a home in Miami, one of American television's most enduring ensemble comedies."

      - name: "Georgia: The Walking Dead"
        description: "AMC's zombie drama (2010-2022) is set in and around Atlanta and was filmed largely on location across Georgia, which became a major production hub partly because of the show's success."

      - name: "Hawaii: Hawaii Five-0"
        description: "The CBS police procedural (original 1968-1980, rebooted 2010-2020) follows an elite Hawaii state police task force and was filmed largely on Oahu across both versions."

      - name: "Idaho: The Grinder"
        description: "Rob Lowe starred in this Fox sitcom (2015-2016) as a former TV lawyer who joins his family's real law firm in Boise, Idaho."

      - name: "Illinois: Roseanne"
        description: "The ABC sitcom (1988-1997, revived 2018) follows a working-class family in the fictional town of Lanford, Illinois, and remains a touchstone for blue-collar sitcom storytelling."

      - name: "Indiana: Stranger Things"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/indiana.jpg"
        description: "Netflix's sci-fi series (2016-present) is set in the fictional small town of Hawkins, Indiana, deliberately contrasting the sleepy Midwestern setting with the supernatural events unfolding beneath it."

      - name: "Iowa: American Pickers"
        description: "The History Channel reality series (2010-present) follows antique pickers traveling the country, based out of Le Claire, Iowa."

      - name: "Kansas: Smallville"
        description: "The CW series (2001-2011) depicts Clark Kent's teenage years in the fictional town of Smallville, Kansas, before he becomes Superman."

      - name: "Kentucky: Justified"
        description: "Timothy Olyphant starred in this FX crime drama (2010-2015), based on Elmore Leonard's writing, as a US Marshal returned to his native Harlan County, Kentucky."

      - name: "Louisiana: True Blood"
        description: "The HBO vampire drama (2008-2014) is set in the fictional Louisiana town of Bon Temps, drawing heavily on the state's swamp and small-town Southern Gothic imagery."

      - name: "Maine: Murder, She Wrote"
        description: "Angela Lansbury starred in this CBS mystery series (1984-1996) as a mystery writer solving crimes in the fictional coastal town of Cabot Cove, Maine."

      - name: "Maryland: The Wire"
        description: "HBO's crime drama (2002-2008) depicts Baltimore's drug trade, police department, schools, and politics across five seasons, and is widely regarded as one of the greatest television series ever made."

      - name: "Massachusetts: Cheers"
        description: "The NBC sitcom (1982-1993), set in a Boston bar where 'everybody knows your name,' is one of the most acclaimed sitcoms in television history and later spawned the spinoff Frasier."

      - name: "Michigan: Home Improvement"
        description: "Tim Allen starred in this ABC sitcom (1991-1999) as the host of a fictional Detroit-based home improvement TV show."

      - name: "Minnesota: The Mary Tyler Moore Show"
        description: "The CBS sitcom (1970-1977) follows a single career woman working at a Minneapolis TV newsroom, a landmark series for its portrayal of an independent working woman."

      - name: "Mississippi: In the Heat of the Night"
        description: "The NBC/CBS drama (1988-1995), a television adaptation of the 1967 film, follows a police force in a small Mississippi town."

      - name: "Missouri: Superstore"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/missouri.jpg"
        description: "The NBC sitcom (2015-2021) is set at a fictional big-box retail store in St. Louis, Missouri, following its employees' daily grind."

      - name: "Montana: Yellowstone"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/montana.jpg"
        description: "Kevin Costner starred in this Paramount Network drama (2018-present) as the patriarch of a Montana ranching family fighting to protect their land, reviving prime-time interest in Western drama."

      - name: "Nebraska: Bless This Mess"
        description: "The ABC sitcom (2019-2020) follows a couple who leave New York City to run an inherited farm in rural Nebraska."

      - name: "Nevada: CSI: Crime Scene Investigation"
        description: "The CBS procedural (2000-2015) follows Las Vegas, Nevada forensic investigators and was one of the most-watched dramas of the 2000s, anchoring a multi-city franchise."

      - name: "New Hampshire: Stan Against Evil"
        description: "The IFC horror-comedy (2016-2018) follows a New Hampshire sheriff battling demons haunting his small town."

      - name: "New Jersey: The Sopranos"
        description: "HBO's crime drama (1999-2007) follows New Jersey mob boss Tony Soprano and is widely credited with launching the modern era of prestige television drama."

      - name: "New Mexico: Breaking Bad"
        description: "AMC's crime drama (2008-2013) follows a New Mexico chemistry teacher turned methamphetamine manufacturer, filmed on location in Albuquerque, and is regarded as one of the most acclaimed series ever made."

      - name: "New York: Friends"
        description: "The NBC sitcom (1994-2004) follows six friends navigating life and love in New York City and remains one of the most popular sitcoms in television history."

      - name: "North Carolina: One Tree Hill"
        description: "The CW drama (2003-2012) follows two half-brothers in the fictional town of Tree Hill, North Carolina, and was filmed largely in Wilmington."

      - name: "North Dakota: Blood & Oil"
        description: "The ABC drama (2015) followed an oil boomtown in North Dakota's Bakken shale region before it was cancelled after a single season."

      - name: "Ohio: Glee"
        description: "The Fox musical comedy-drama (2009-2015) follows a high school show choir in the fictional town of Lima, Ohio."

      - name: "Oklahoma: Saving Grace"
        description: "Holly Hunter starred in this TNT drama (2007-2010) as an Oklahoma City police detective guided by an unconventional angel."

      - name: "Oregon: Grimm"
        description: "The NBC supernatural drama (2011-2017) follows a Portland, Oregon police detective who discovers he can see supernatural creatures hidden among ordinary people."

      - name: "Pennsylvania: The Office"
        description: "The NBC mockumentary sitcom (2005-2013) is set at the fictional Dunder Mifflin paper company in Scranton, Pennsylvania, a city that has since embraced the show as a tourism draw."

      - name: "Rhode Island: Family Guy"
        description: "The Fox animated sitcom (1999-present) is set in the fictional town of Quahog, Rhode Island."

      - name: "South Carolina: Southern Charm"
        description: "Bravo's reality series (2014-present) follows a group of socialites in Charleston, South Carolina."

      - name: "South Dakota: Deadwood"
        description: "HBO's Western drama (2004-2006) is set in the real 1870s gold-rush boomtown of Deadwood, South Dakota, and is loosely based on actual historical figures who lived there."

      - name: "Tennessee: Nashville"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/tennessee.jpg"
        description: "The ABC/CMT drama (2012-2018) follows country music stars navigating the industry in Nashville, Tennessee."

      - name: "Texas: Dallas"
        image: "/images/collections/culture/most-famous-tv-show-set-in-each-state/texas.jpg"
        description: "The CBS prime-time soap opera (1978-1991) follows the wealthy Ewing family's oil business in Dallas, Texas, and was one of the most-watched shows of its era."

      - name: "Utah: Big Love"
        description: "HBO's drama (2006-2011) follows a Utah man secretly practicing polygamy across three households."

      - name: "Vermont: Newhart"
        description: "Bob Newhart starred in this CBS sitcom (1982-1990) as the owner of a small Vermont inn."

      - name: "Virginia: Criminal Minds"
        description: "The CBS procedural (2005-2020) follows an FBI Behavioral Analysis Unit based out of Quantico, Virginia."

      - name: "Washington: Grey's Anatomy"
        description: "ABC's medical drama (2005-present) is set at a fictional Seattle, Washington hospital and is one of the longest-running scripted primetime dramas in US television history."

      - name: "West Virginia: Outcast"
        description: "Cinemax's horror drama (2016-2018), based on Robert Kirkman's comic, is set in the fictional town of Rome, West Virginia."

      - name: "Wisconsin: The Young and the Restless"
        description: "The CBS soap opera (1973-present) is set in the fictional Wisconsin city of Genoa City and is one of the longest-running and most-watched daytime soap operas ever made."

      - name: "Wyoming: Longmire"
        description: "The A&E/Netflix Western crime drama (2012-2017), based on Craig Johnson's novels, follows a Wyoming sheriff investigating crimes across his rural county."

  - id: "shows-filmed-somewhere-other-than-their-setting"
    icon: "fa-solid fa-map-location-dot"
    title: "State Shows That Were Actually Filmed Somewhere Else"
    paragraphs:
      - "Northern Exposure is Alaska's defining show, but it was filmed in Roslyn, Washington, whose downtown still leans into the association with murals and a preserved 'Roslyn's Cafe' sign from the opening credits. In the Heat of the Night is set in small-town Mississippi but was largely filmed in Louisiana and Georgia rather than Mississippi itself."
      - "Some shows go the opposite direction. Breaking Bad and The Walking Dead were both filmed almost entirely in the states where they're set, Albuquerque and Georgia respectively, and both productions became major, lasting boosts to their state's film and TV industry."

faq:
  - question: "What is the most famous TV show set in every state?"
    answer: "One series represents each state's on-screen identity, from Friends in New York to Yellowstone in Montana and Breaking Bad in New Mexico, listed state by state above."

  - question: "What TV show is New Mexico best known for?"
    answer: "Breaking Bad (2008-2013), filmed on location in Albuquerque, is widely regarded as one of the greatest television dramas ever made and is closely tied to the city's tourism identity today."

  - question: "Was Northern Exposure actually filmed in Alaska?"
    answer: "No. The show is set in the fictional Alaska town of Cicely, but it was filmed in Roslyn, Washington, whose downtown still displays props and signage from the series."

  - question: "What is the longest-running TV show set in a specific state?"
    answer: "The Young and the Restless, set in the fictional Wisconsin city of Genoa City, has aired since 1973, making it one of the longest-running scripted television series in US history."

  - question: "What TV show is Georgia known for filming?"
    answer: "The Walking Dead (2010-2022) was filmed largely on location in and around Atlanta, and the show's success helped establish Georgia as a major television and film production hub."

  - question: "Which state is associated with The Sopranos?"
    answer: "New Jersey. HBO's crime drama (1999-2007) follows mob boss Tony Soprano and is credited with launching the modern era of prestige television drama."

