page:
  h1: "The Most Famous TV Show Set in Each State"
  intro_title: "One Signature Series for Every State, From Cheers' Boston Bar to Breaking Bad's Albuquerque"

  quick_answer:
    - "New Mexico's defining show is Breaking Bad (2008-2013), filmed on location in Albuquerque and widely regarded as one of the greatest television dramas ever made."
    - "New York's Friends and Wisconsin's The Young and the Restless anchor their states decades apart, one a 1990s sitcom phenomenon, the other a daytime soap opera still airing after more than 50 years."
    - "Several state-defining shows were filmed somewhere else entirely. Northern Exposure represents Alaska but was shot in Roslyn, Washington, and Twin Peaks-style small-town mysteries aside, most Alaska-set shows never film there at all."

  methodology: "Selections reflect the TV series most closely identified with each state's setting, drawn from established television reference lists, not a ratings or filming-location count. Where a show's actual production location differs from its fictional setting, that distinction is noted."

  sources:
    - name: "Best Life — The Most Famous TV Shows That Take Place in Every State"
      url: "https://bestlifeonline.com/most-famous-tv-shows-every-state/"
      description: "State-by-state picks for the television series most identified with each US state"
