sections:
  - id: "states-named-people"
    icon: "fa-solid fa-user"
    style: "law-cards"
    title: "All States Named After a Real Person"
    subsections:
      - subtitle: "Georgia"
        text: |
          **Named after:** King George II
          **Capital:** Atlanta

          James Oglethorpe received a royal charter in 1732 for a new colony south of the Carolinas, and King George II's name was attached to it in the charter itself.

          Georgia belongs on this list because the naming is documented in that founding charter, with no dispute among historians about which George it honors.
      - subtitle: "Virginia"
        text: |
          **Named after:** Queen Elizabeth I
          **Capital:** Richmond

          Sir Walter Raleigh named the territory for Elizabeth I, England's unmarried monarch known as the Virgin Queen, during his 1580s expeditions to the coast.

          Virginia earns its place as one of the oldest person-based state names in the country, predating Jamestown's founding by two decades.
      - subtitle: "West Virginia"
        text: |
          **Named after:** Queen Elizabeth I
          **Capital:** Charleston

          When Virginia's western counties broke away in 1863 rather than join the Confederacy, they kept the Virginia name and simply added West.

          It qualifies for this list through the same royal root as its parent state, carried forward into a name created by a wartime split rather than a new charter.
      - subtitle: "Louisiana"
        text: |
          **Named after:** King Louis XIV
          **Capital:** Baton Rouge

          French explorer Rene-Robert Cavelier de La Salle claimed the Mississippi River basin for France in 1682 and named the territory Louisiane for King Louis XIV.

          Louisiana stands out on this list as the only entry honoring a French monarch rather than an English one.
      - subtitle: "Maryland"
        text: |
          **Named after:** Queen Henrietta Maria
          **Capital:** Annapolis

          King Charles I signed the 1632 charter establishing the colony and named it for his wife, Henrietta Maria of France.

          Maryland is the only state on this list named for a queen consort rather than a reigning monarch or an explorer's patron.
      - subtitle: "Pennsylvania"
        text: |
          **Named after:** Admiral William Penn
          **Capital:** Harrisburg

          King Charles II granted the land to Quaker leader William Penn in 1681 to settle a debt owed to Penn's late father, Admiral Sir William Penn, and the king's charter attached the family name to silvania, Latin for woodland.

          Pennsylvania's inclusion here carries a documented twist: the younger Penn wanted the colony called simply Sylvania and worried the honor would look self-serving, but the king's charter kept the Penn name regardless.
      - subtitle: "Washington"
        text: |
          **Named after:** George Washington
          **Capital:** Olympia

          Congress created Washington Territory in 1853, choosing the first president's name over the originally proposed Columbia to avoid confusion with the District of Columbia.

          Washington is the only state in this group, and the only state in the country, named directly for a U.S. president.
      - subtitle: "North Carolina"
        text: |
          **Named after:** King Charles I and II
          **Capital:** Raleigh

          The Province of Carolina was named in the 1660s for King Charles I using the Latin form of his name, Carolus, and the honor carried forward when his son Charles II reissued the colony's charter.

          North Carolina belongs on this list for the same royal Latin root shared by its southern twin, split from one province into two in 1712.
      - subtitle: "South Carolina"
        text: |
          **Named after:** King Charles I and II
          **Capital:** Columbia

          South Carolina took shape from the same 1712 division of the Province of Carolina, keeping the Carolus root that names both Carolinas after the same two kings.

          Its place on this list rests on that shared charter history rather than a separate naming event of its own.
      - subtitle: "New York"
        text: |
          **Named after:** Duke of York
          **Capital:** Albany

          England seized the Dutch colony of New Netherland in 1664 and renamed it for James Stuart, the Duke of York, who later became King James II.

          New York qualifies here as a state renamed through conquest, its person-based name applied by a new ruling power rather than a founding charter.
      - subtitle: "Delaware"
        text: |
          **Named after:** Lord De La Warr
          **Capital:** Dover

          Thomas West, Lord De La Warr, served as the first governor of Virginia and explored the bay in 1610 that colonists then named in his honor, with the state later taking the same name.

          Delaware makes this list through an unusual two-step path: the person's name landed on the bay and river first, and the state name followed from the water feature rather than directly from the man.

