faq:
  - question: "What states are named after people?"
    answer: "Delaware, Georgia, Louisiana, Maryland, New York, North Carolina, Pennsylvania, South Carolina, Virginia, Washington, and West Virginia all carry the name of a documented real person."
  - question: "What state is named after a US president?"
    answer: "Washington is the only state named directly for a U.S. president, honoring George Washington when Congress created the territory in 1853."
  - question: "Why do North Carolina and South Carolina share a name?"
    answer: "Both derive from Carolus, the Latin form of Charles, honoring King Charles I and King Charles II. A single Province of Carolina split into the two states in 1712."
  - question: "Is Pennsylvania named after William Penn?"
    answer: "Yes, though the charter specifically honored his father, Admiral Sir William Penn, a distinction the younger Penn was uneasy about since he had hoped for a plainer name."
  - question: "Why is Delaware named after a person if it's usually described as named after a river?"
    answer: "Both are true. Delaware Bay and River were named for Lord De La Warr, Virginia's first governor, and the state later took its name from the water feature rather than from the man directly."

