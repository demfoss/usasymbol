faq:
  - question: "What states are named after rivers?"
    answer: "Colorado, Connecticut, Delaware, Kansas, Minnesota, Mississippi, Nebraska, Ohio, and Wisconsin are all named after a river."
  - question: "How many states are named after rivers?"
    answer: "Nine of the 50 U.S. states take their name from a river."
  - question: "What does the name Mississippi mean?"
    answer: "Mississippi comes from the Ojibwe misi-ziibi, meaning great river, describing the Mississippi River itself."
  - question: "Is Colorado named after the Colorado River?"
    answer: "Yes, though the river only touches the state's western edge. The name refers to the river's reddish sediment, from the Spanish word for reddish."
  - question: "Is Delaware named after a river or a person?"
    answer: "Both. Delaware Bay and River were named for Lord De La Warr, and the state later took its name from the river rather than from the man directly."

