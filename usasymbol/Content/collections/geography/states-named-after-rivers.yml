sections:
  - id: "states-named-rivers"
    icon: "fa-solid fa-water"
    style: "law-cards"
    title: "All States Named After a River"
    subsections:
      - subtitle: "Mississippi"
        text: |
          **Namesake river:** Mississippi River
          **Capital:** Jackson

          The name comes from the Ojibwe misi-ziibi, meaning great river, carried into English through French traders working the upper river in the 1600s.

          Mississippi is the clearest case on this list, since the state name is a near-direct translation of the river's original description rather than a shortened or altered form.
      - subtitle: "Ohio"
        text: |
          **Namesake river:** Ohio River
          **Capital:** Columbus

          Ohio derives from the Seneca ohi:yo, meaning large creek, a name French explorers first recorded for both the Ohio and Allegheny Rivers before it settled on the Ohio alone.

          It belongs on this list because the state's eastern and southern borders still trace the river's course, the same waterway that gave the name its start.
      - subtitle: "Colorado"
        text: |
          **Namesake river:** Colorado River
          **Capital:** Denver

          Spanish explorers called the river Rio Colorado, or reddish river, for the red sediment it carried, and the name later applied to the territory even though the river itself only clips the state's western edge.

          Colorado stands out on this list as the one entry named for a river's color rather than its size, length, or a translated description of the water.
      - subtitle: "Connecticut"
        text: |
          **Namesake river:** Connecticut River
          **Capital:** Hartford

          The name comes from an Eastern Algonquian phrase describing a long tidal river, referring to the waterway that still runs the length of the state today.

          Connecticut earns its place here through one of the oldest river-derived names in New England, recorded by English settlers within a decade of their arrival.
      - subtitle: "Wisconsin"
        text: |
          **Namesake river:** Wisconsin River
          **Capital:** Madison

          The Miami-Illinois name for the river describes it running through a reddish place, likely referring to the sandstone bluffs near the Wisconsin Dells that the river cuts through.

          Wisconsin fits this list through a name that describes the river's landscape rather than its size, similar in spirit to Colorado's color-based root.
      - subtitle: "Minnesota"
        text: |
          **Namesake river:** Minnesota River
          **Capital:** Saint Paul

          Minnesota comes from the Dakota mni sota, meaning cloudy water, a description of the river's sediment-clouded appearance that early French traders also noted.

          It belongs on this list because the cloudy-water description applies specifically to the Minnesota River, not to the state's better-known lakes.
      - subtitle: "Kansas"
        text: |
          **Namesake river:** Kansas River
          **Capital:** Topeka

          The name traces to the Kansa people, whose name was applied to the river French traders navigated, and then to the surrounding territory.

          Kansas makes this list through the same river-then-territory naming pattern seen in Nebraska and Minnesota, all three following a waterway inland from the Missouri.
      - subtitle: "Nebraska"
        text: |
          **Namesake river:** Platte River
          **Capital:** Lincoln

          Nebraska comes from a Chiwere word meaning flattened water, the Native description of the wide, shallow Platte River that French traders had separately named Riviere Platte, French for flat river.

          Its place on this list is a case of two languages describing the same river feature independently, with the Native name winning out as the eventual state name.
      - subtitle: "Delaware"
        text: |
          **Namesake river:** Delaware River
          **Capital:** Dover

          Delaware Bay and River were named for Thomas West, Lord De La Warr, Virginia's first governor, after his 1610 voyage into the bay, and the state later took the river's name directly.

          Delaware closes this list as the one river-named state where the river itself was named for a person first, making the state name a river name at one remove from a name honoring a colonial governor.

