faq:
  - question: "What US states are also first names?"
    answer: "Georgia and Virginia are state names that are also common English first names. Carolina and Dakota, the shared roots of the two Carolinas and two Dakotas, are also widely used as given names."
  - question: "Is Virginia a first name or a state name first?"
    answer: "Virginia was already an English given name, from the Latin virgo, before Sir Walter Raleigh applied it to the American colony in the 1580s in honor of Elizabeth I."
  - question: "Is Carolina a state?"
    answer: "Not on its own. The actual states are North Carolina and South Carolina. Carolina is the shared root name, feminine form of Carolus, Latin for Charles, and it is used independently as a given name."
  - question: "When did Dakota become popular as a first name?"
    answer: "Dakota gained popularity as a given name in the United States starting in the late 20th century, well over a century after North Dakota and South Dakota entered the Union in 1889."

