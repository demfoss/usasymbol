page:
  h1: "States That Are Also First Names"
  intro_title: "Four State Names Double as Given Names"
  quick_answer:
    - "Georgia and Virginia are U.S. state names used as common English first names, given to people independent of the states themselves."
    - "Carolina and Dakota are not state names on their own, since the actual states are North and South Carolina and North and South Dakota, but both roots are widely used as given names, Carolina especially in Spanish and Italian-speaking communities."
    - "Georgia and Virginia predate their use as common first names, both entering wide use as given names generations after the states were named for royalty."
  methodology: "Names were included only where the word functions as a genuinely common English or widely used international given name, not a rare or invented usage. Editorial judgment on frequency of use is stated plainly rather than backed by a claimed formula."
  sources:
