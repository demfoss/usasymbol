sections:
  - id: "states-first-names"
    icon: "fa-solid fa-user"
    style: "law-cards"
    title: "State Names Used as First Names"
    subsections:
      - subtitle: "Georgia"
        text: |
          **Also used as:** A common English first name

          Georgia entered English as a given name in its own right, unconnected to any deliberate reference to the state, and appears throughout the 20th and 21st centuries in birth records without a spike tied to any single event.

          Georgia belongs on this list because it functions as a first name on its own terms, the same word doing double duty as a state and as a name parents choose independent of geography.
      - subtitle: "Virginia"
        text: |
          **Also used as:** A common English first name

          Virginia was already established as an English given name, taken from the Latin virgo for maiden, before Sir Walter Raleigh applied it to the colony in honor of Elizabeth I in the 1580s.

          It earns its place here because the name-then-state order runs backward from most entries on this list. Virginia was a first name before it was a state name, not the other way around.
      - subtitle: "Carolina"
        text: |
          **Also used as:** A common given name, especially in Spanish and Italian-speaking communities

          Carolina is the feminine form of Carolus, Latin for Charles, and the root shared by both North Carolina and South Carolina, though neither state is written as simply Carolina.

          It qualifies for this list as a widely used given name in its own right across Latin America, Spain, and Italy, distinct from either Carolina state and older than both.
      - subtitle: "Dakota"
        text: |
          **Also used as:** A common modern given name, used for both boys and girls

          Dakota comes from the Sioux word for ally or friend, the same root behind North Dakota and South Dakota, and became a popular unisex first name in the United States starting in the late 20th century.

          Dakota makes this list as the most recently popularized entry, gaining traction as a given name well after both Dakota states had already existed for a century.

