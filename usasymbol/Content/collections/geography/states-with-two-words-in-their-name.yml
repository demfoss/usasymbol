  quick_answer:
    - "Ten U.S. states have two-word names: New Hampshire, New Jersey, New Mexico, New York, North Carolina, North Dakota, Rhode Island, South Carolina, South Dakota, and West Virginia."
    - "Four use a direction (North or South) to split one original territory: the Carolinas split in 1712 and the Dakotas split in 1889."
