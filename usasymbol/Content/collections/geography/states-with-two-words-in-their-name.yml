faq:
  - question: "What states have two words in their name?"
    answer: "New Hampshire, New Jersey, New Mexico, New York, North Carolina, North Dakota, Rhode Island, South Carolina, South Dakota, and West Virginia all have two-word names."
  - question: "How many US states have two-word names?"
    answer: "Ten of the 50 U.S. states have a two-word name."
  - question: "Why do North Carolina, South Carolina, North Dakota, and South Dakota share names?"
    answer: "Each pair started as a single colony or territory. The Province of Carolina split in 1712 and Dakota Territory split in 1889, leaving a directional word attached to a shared root name."
  - question: "Why do four state names start with New?"
    answer: "New Hampshire, New Jersey, New Mexico, and New York each borrowed an existing place name from England or Spanish colonial territory and added New to distinguish the American version."
  - question: "Is Rhode Island really a two-word name?"
    answer: "Rhode Island itself is two words, and its official name was even longer until 2020, when voters shortened Rhode Island and Providence Plantations to just Rhode Island."

