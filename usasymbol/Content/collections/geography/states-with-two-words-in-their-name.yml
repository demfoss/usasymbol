sections:
  - id: "two-word-states"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States With Two-Word Names"
    subsections:
      - subtitle: "New Hampshire"
        text: |
          **Abbreviation:** NH
          **Capital:** Concord

          Captain John Mason named the territory in 1629 after Hampshire, the English county where he had lived, and attached New to mark it as the American counterpart.

          New Hampshire belongs on this list as the oldest of the four New-prefixed states, chartered decades before New York or New Jersey took their names.
      - subtitle: "New Jersey"
        text: |
          **Abbreviation:** NJ
          **Capital:** Trenton

          King Charles II granted the territory to Sir George Carteret in 1664, and Carteret named it after Jersey, the Channel Island he had defended during the English Civil War.

          Its name traces to a real island 3,000 miles away, making New Jersey one of four states whose second word is a place name transplanted from England's coast.
      - subtitle: "New Mexico"
        text: |
          **Abbreviation:** NM
          **Capital:** Santa Fe

          Spanish colonists used the name Nuevo México as early as 1563, decades before the modern nation of Mexico existed, for the upper Rio Grande territory.

          New Mexico earns its spot here as the only two-word state name that predates the country it appears to reference.
      - subtitle: "New York"
        text: |
          **Abbreviation:** NY
          **Capital:** Albany

          England seized the Dutch colony of New Netherland in 1664 and renamed it for James Stuart, the Duke of York, brother of King Charles II.

          A change of ruling nation is the reason for New York's two-word name, unlike the colonial charters that produced New Hampshire and New Jersey.
      - subtitle: "North Carolina"
        text: |
          **Abbreviation:** NC
          **Capital:** Raleigh

          The single Province of Carolina, named for King Charles I and King Charles II, split into two colonies in 1712 over disputes about governance and land claims.

          North Carolina belongs on this list because its second word, Carolina, is shared with its southern twin, a direct result of that 1712 split.
      - subtitle: "North Dakota"
        text: |
          **Abbreviation:** ND
          **Capital:** Bismarck

          Dakota Territory, named for the Dakota Sioux word for ally or friend, split into two states when both were admitted to the Union on the same day in 1889.

          Its name is one half of a pair created by that single admission date, the same mechanism that produced South Dakota.
      - subtitle: "Rhode Island"
        text: |
          **Abbreviation:** RI
          **Capital:** Providence

          The origin of the first word is disputed. One theory traces it to the Dutch phrase roodt eylandt, meaning red island, while another points to a resemblance early explorers saw to the Greek island of Rhodes.

          Rhode Island qualifies for this list even though it is not a mainland peninsula at all, since the state's full historic name, Rhode Island and Providence Plantations, was two words long before it was shortened by voters in 2020.
      - subtitle: "South Carolina"
        text: |
          **Abbreviation:** SC
          **Capital:** Columbia

          South Carolina took its name from the same 1712 division of the Province of Carolina that created North Carolina, keeping the shared reference to King Charles.

          Its inclusion here rests on the identical royal root as its northern counterpart, split only by the directional first word.
      - subtitle: "South Dakota"
        text: |
          **Abbreviation:** SD
          **Capital:** Pierre

          South Dakota shares its second word, and its root meaning of ally or friend, with North Dakota, both carved from the former Dakota Territory in 1889.

          It belongs on this list for the same reason as its northern twin, a single territory divided by an admission-day compromise in Congress.
      - subtitle: "West Virginia"
        text: |
          **Abbreviation:** WV
          **Capital:** Charleston

          Western counties of Virginia refused to join the Confederacy in 1861 and formed a separate Union-loyal state, admitted in 1863 as West Virginia.

          It closes this list as the only two-word state name created by a wartime political split rather than a colonial charter or a Congressional admission deal.

