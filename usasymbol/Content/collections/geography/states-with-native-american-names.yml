sections:
  - id: "native-american-names"
    icon: "fa-solid fa-earth-americas"
    style: "law-cards"
    title: "All States With Native American Names"
    highlights:
      - { name: "Alabama", image: "/images/flags/alabama/flag.webp", description: "Alabama comes from a Choctaw phrase meaning thicket-clearers or plant-cutters, describing the Alabama people who lived along the river of the same name." }
      - { name: "Alaska", image: "/images/flags/alaska/flag.webp", description: "Alaska comes from the Aleut alaxsxaq, meaning mainland, used by Aleut people to describe the land connected to the Alaska Peninsula rather than the surrounding islands." }
      - { name: "Arizona", image: "/images/flags/arizona/flag.webp", description: "Arizona's origin is genuinely disputed between a Basque phrase for good oak and an O'odham phrase for having a little spring, with the O'odham root favored by most modern references." }
      - { name: "Arkansas", image: "/images/flags/arkansas/flag.webp", description: "Arkansas comes from a French rendering of a Quapaw name recorded through the Kansa language, referring to the people who lived along the lower Mississippi." }
      - { name: "Connecticut", image: "/images/flags/connecticut/flag.webp", description: "Connecticut derives from an Eastern Algonquian phrase meaning at the long tidal river, describing the Connecticut River that still runs the length of the state." }
      - { name: "Illinois", image: "/images/flags/illinois/flag.webp", description: "Illinois comes from a Miami-Illinois word meaning speaks normally, which French traders adapted to describe the Illiniwek confederation of tribes." }
      - { name: "Iowa", image: "/images/flags/iowa/flag.webp", description: "Iowa takes its name from the Iowa tribe, whose own name entered English through French traders, though the exact original meaning is no longer certain." }
      - { name: "Kansas", image: "/images/flags/kansas/flag.webp", description: "Kansas comes from the Kansa people, whose name was applied first to the Kansas River and then to the surrounding territory by French traders." }
      - { name: "Kentucky", image: "/images/flags/kentucky/flag.webp", description: "Kentucky has an Iroquoian root generally translated as meadow or prairie, though linguists have never settled on one definitive source word or tribe." }
      - { name: "Massachusetts", image: "/images/flags/massachusetts/flag.webp", description: "Massachusetts comes from the Massachusett language, meaning near the great hill, referring to the Blue Hills south of present-day Boston." }
      - { name: "Michigan", image: "/images/flags/michigan/flag.webp", description: "Michigan comes from the Ojibwe mishigami, meaning large water or large lake, referring to Lake Michigan." }
      - { name: "Minnesota", image: "/images/flags/minnesota/flag.webp", description: "Minnesota comes from the Dakota mni sota, meaning cloudy water, a description of the sediment-clouded Minnesota River." }
      - { name: "Mississippi", image: "/images/flags/mississippi/flag.webp", description: "Mississippi comes from the Ojibwe misi-ziibi, meaning great river, one of the more directly translated Native American state names." }
      - { name: "Missouri", image: "/images/flags/missouri/flag.webp", description: "Missouri comes from a Miami-Illinois word referring to the Missouri tribe's dugout canoes, applied first to the people and then to the river and territory." }
      - { name: "Nebraska", image: "/images/flags/nebraska/flag.webp", description: "Nebraska comes from a Chiwere word meaning flattened water, describing the wide, shallow Platte River." }
      - { name: "North Dakota", image: "/images/flags/north-dakota/flag.webp", description: "North Dakota comes from the Sioux word dakhota, meaning ally or friend, the name the Dakota people used for themselves." }
      - { name: "Ohio", image: "/images/flags/ohio/flag.webp", description: "Ohio comes from the Seneca ohi:yo, meaning large creek, originally used for both the Ohio and Allegheny Rivers." }
      - { name: "Oklahoma", image: "/images/flags/oklahoma/flag.webp", description: "Oklahoma was devised from Choctaw words for red and people, coined in the 1860s as a translation of the phrase Indian Territory rather than an older place name." }
      - { name: "South Dakota", image: "/images/flags/south-dakota/flag.webp", description: "South Dakota shares its Sioux root, meaning ally or friend, with North Dakota, both carved from the single Dakota Territory in 1889." }
      - { name: "Tennessee", image: "/images/flags/tennessee/flag.webp", description: "Tennessee is named for Tanasi, a Cherokee village on the Little Tennessee River, though the meaning of the village name itself is no longer known." }
      - { name: "Texas", image: "/images/flags/texas/flag.webp", description: "Texas comes from the Caddo word taysha, meaning friend, used to describe an alliance among Caddo-speaking groups before Spanish colonizers adopted it as a place name." }
      - { name: "Utah", image: "/images/flags/utah/flag.webp", description: "Utah comes from the Ute people's own name, adapted through Spanish, with a possible root meaning of high or people of the mountains." }
      - { name: "Wisconsin", image: "/images/flags/wisconsin/flag.webp", description: "Wisconsin comes from a Miami-Illinois name for the Wisconsin River, likely describing it running through a reddish place near present-day Wisconsin Dells." }
      - { name: "Wyoming", image: "/images/flags/wyoming/flag.webp", description: "Wyoming comes from a Munsee Delaware phrase meaning at the big river flat, a name first used for a valley in Pennsylvania and later transplanted west by Congress." }

faq:
  - question: "What states have Native American names?"
    answer: "24 states have names derived from Native American or Alaska Native languages, including Alabama, Connecticut, Michigan, Ohio, Tennessee, Texas, and Wyoming, among others."
  - question: "How many US state names come from Native American languages?"
    answer: "24 of the 50 U.S. states have names with a Native American or Alaska Native language origin, the largest single origin category among the states."
  - question: "What is the most common meaning behind these names?"
    answer: "Water and rivers come up repeatedly. Mississippi means great river in Ojibwe, Michigan means large water, and Minnesota and Nebraska both describe how a river's water looked to the people who named it."
  - question: "Is Arizona's name really disputed?"
    answer: "Yes. Sources split between a Basque phrase meaning good oak and an O'odham phrase meaning having a little spring, and most modern references favor the O'odham origin without fully ruling out the other."
  - question: "Is Oklahoma an old Native American place name?"
    answer: "Not exactly. Oklahoma was coined in the 1860s from Choctaw words for red and people as a translation for Indian Territory, making it a deliberately devised name rather than an inherited one."

