page:
  h1: "States With Native American Names"
  intro_title: "24 States Have Native American Names"
  quick_answer:
    - "24 U.S. states have names derived from Native American or Alaska Native languages, more than any other origin category, including Alabama, Michigan, Ohio, and Texas."
    - "Mississippi and Michigan both come from words meaning great water or large water, one from Ojibwe describing a river and the other a lake."
    - "Some of these names are certain, like Ohio from the Seneca word for large creek, while others, like Kentucky, have a meaning scholars still debate."
  methodology: "Etymologies were checked against standard state name-origin references. Names with reasonable scholarly consensus on a Native American or Alaska Native language source were included; genuine disputes over exact meaning are noted rather than resolved with false precision."
