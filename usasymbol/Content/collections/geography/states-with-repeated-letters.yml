faq:
  - question: "What states have a repeated letter?"
    answer: "13 states have a letter that repeats three or more times: Alabama, Alaska, Arkansas, Colorado, Connecticut, Illinois, Massachusetts, Mississippi, New Jersey, Pennsylvania, Tennessee, Virginia, and West Virginia."
  - question: "Which state has the most repeated letters?"
    answer: "Mississippi and Tennessee tie for the most, each repeating one letter four times. Alabama and Massachusetts also reach four repeats."
  - question: "What counts as a repeated letter for this list?"
    answer: "A state qualifies if any single letter appears three or more times in its name, counted case-insensitively and ignoring spaces between words."
  - question: "Does Mississippi repeat more than one letter?"
    answer: "Yes. Both I and S appear four times each in Mississippi, the only state on this list with two letters tied for its highest repeat count."
  - question: "Why are Virginia and West Virginia both on this list?"
    answer: "West Virginia's name contains Virginia in full, so it inherits the same three I repeats found in Virginia, with no additional repeated letters added by West."

