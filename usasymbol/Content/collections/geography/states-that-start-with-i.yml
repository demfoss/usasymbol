          **Abbreviation:** ID
          **Capital:** Boise

          Idaho begins with I and appears in the West region of the project's state table.

          Its initial I qualifies Idaho for this four-state group.
      - subtitle: "Illinois"
        text: |
          **Abbreviation:** IL
          **Capital:** Springfield

          Illinois begins with I and appears in the Midwest region of the project's state table.

          Its initial I qualifies Illinois for this four-state group. At 8 letters, it is the longest name in the group.
      - subtitle: "Indiana"
        text: |
          **Abbreviation:** IN
          **Capital:** Indianapolis

          Indiana begins with I and appears in the Midwest region of the project's state table.

          Its initial I qualifies Indiana for this four-state group.
      - subtitle: "Iowa"
        text: |
          **Abbreviation:** IA
          **Capital:** Des Moines

          Iowa begins with I and appears in the Midwest region of the project's state table.

          Its initial I qualifies Iowa for this four-state group. Its 4 letters make it the shortest name in the group.

