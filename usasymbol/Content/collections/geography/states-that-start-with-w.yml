      - subtitle: "Washington"
        text: |
          **Abbreviation:** WA
          **Capital:** Olympia

          Washington begins with W and appears in the West region of the project's state table.

          Its initial W is the objective reason Washington opens this four-state group.
      - subtitle: "West Virginia"
        text: |
          **Abbreviation:** WV
          **Capital:** Charleston

          West Virginia begins with W and appears in the South region of the project's state table.

          Its first character qualifies West Virginia, the only two-word name in the group.
      - subtitle: "Wisconsin"
        text: |
          **Abbreviation:** WI
          **Capital:** Madison

          Wisconsin begins with W and appears in the Midwest region of the project's state table.

          Its initial W places Wisconsin between West Virginia and Wyoming alphabetically.
      - subtitle: "Wyoming"
        text: |
          **Abbreviation:** WY
          **Capital:** Cheyenne

          Wyoming begins with W and appears in the West region of the project's state table.

          Its first letter qualifies Wyoming, which has the shortest name in the group at 7 letters.

