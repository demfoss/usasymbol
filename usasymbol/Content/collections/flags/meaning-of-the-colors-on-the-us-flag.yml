expert_quote:
  text: "The colors of the pales (the vertical stripes) are those used in the flag of the United States of America; White signifies purity and innocence, Red, hardiness and valour, and Blue, the colour of the Chief (the broad band above the stripes) signifies vigilance, perseverance and justice."
