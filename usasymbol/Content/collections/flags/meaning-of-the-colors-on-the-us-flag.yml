  - id: where-meanings-come-from
    icon: "fa-solid fa-book-open"
    title: "The Source: Not the Flag Law, But the Great Seal"
    paragraphs:
      - "The Flag Resolution of June 14, 1777 reads in full: *'Resolved, That the flag of the thirteen United States be thirteen stripes, alternate red and white; that the union be thirteen stars, white in a blue field, representing a new constellation.'* Design only. No symbolism assigned to any color."
      - "Five years later, on June 20, 1782, Secretary of the Continental Congress Charles Thomson submitted his written description of the newly adopted Great Seal. That is the primary source document. Thomson explicitly noted that the seal's colors 'are those used in the flag of the United States' — then defined each one. Because he made that connection himself, his definitions carry directly to the flag."
      - "No subsequent flag law added color symbolism. The U.S. Flag Code, codified in 1942, governs how the flag is displayed and treated — not what it means. The State Department, USA.gov, and other federal sources now state these meanings as applying to the flag, citing the Great Seal origin. They are officially recognized. They are not derived from flag legislation."

  - id: stars-and-stripes
    icon: "fa-solid fa-star"
    title: "What the Stars and Stripes Represent"
    img: us-flag
    paragraphs:
      - "The 13 stripes represent the 13 original colonies — seven red, six white. Congress fixed that count permanently in 1818. New states would be marked by stars, not additional stripes; the stripe count has not changed in over 200 years."
      - "The 50 stars represent the 50 states. The current arrangement has been official since July 4, 1960, when Hawaii's star was added. The 1777 resolution called the original 13 stars 'a new constellation' — deliberate language that framed the United States as something genuinely new, not a renamed colony or a continuation of prior governance. The [official flags of all 50 states](/symbols/flags) carry their own design histories, each adopted independently of the national flag's 1777 resolution."

  - id: why-red-white-blue
    icon: "fa-solid fa-circle-question"
    title: "Why Is the U.S. Flag Red, White, and Blue?"
    paragraphs:
      - "The 1777 resolution gave no explanation. The colors were not selected for symbolic purpose — they were inherited. Red, white, and blue already appeared in Continental Army regimental colors and in the Grand Union Flag, the pre-independence flag that incorporated the British Union Jack. The National Archives notes that the flag's colors are the same as those in the British flag, which was the dominant visual reference for colonial-era Americans."
      - "The colors came first; the meaning was attached afterward. Thomson's 1782 definitions were describing colors already in place, not prescribing new ones. A related question — whether the U.S. maintains a separate [peace flag vs. war flag](/collections/flags/us-peace-flag-vs-war-flag) — is also rooted in this gap between design and interpretation. Federal law recognizes neither distinction."


  - id: common-vs-official
    icon: "fa-solid fa-circle-half-stroke"
    title: "What Popular Sources Add That Government Sources Don't"
    paragraphs:
      - "A second layer of meaning circulates widely in patriotic and commercial writing. Red picks up blood shed in war, sacrifice, and devotion. White expands to freedom and unity. Blue takes on loyalty. None of these appear in Thomson's document or any other official U.S. government source — they are cultural interpretations built up over two centuries of use."
      - "These readings are not wrong as expressions of what the flag means culturally. But Thomson's 1782 text — as cited by the State Department and USA.gov — is what the official record contains. The popular expansions are not in it."

faq:
  - question: "What does red mean on the American flag?"
    answer: "Red represents valor and bravery. Thomson's original 1782 phrasing was 'hardiness and valour' — the modern State Department and USA.gov rendering softens 'hardiness' to 'bravery,' but the core meaning is military courage."

  - question: "What does white mean on the U.S. flag?"
    answer: "White stands for purity and innocence, per Charles Thomson's 1782 Great Seal description. No official source has modified this wording."

  - question: "What does blue mean on the American flag?"
    answer: "Blue represents vigilance, perseverance, and justice — three qualities, where red and white each carry one. All three come from Charles Thomson's 1782 Great Seal description and have not been revised by any subsequent official source."

  - question: "Did the original flag law explain what the colors mean?"
    answer: "No. The Flag Resolution of June 14, 1777 established the design — stripes and stars — but assigned no meaning to any color. The symbolism came five years later, through Charles Thomson's 1782 description of the Great Seal of the United States, not through any flag legislation."

  - question: "Where do the official color meanings come from?"
    answer: "From the Great Seal of the United States. On June 20, 1782, Secretary of the Continental Congress Charles Thomson described the seal's colors and explicitly connected them to the flag: white for purity and innocence, red for hardiness and valor, blue for vigilance, perseverance, and justice. The State Department and USA.gov cite his wording as the official source."

  - question: "What do the stripes on the American flag represent?"
    answer: "The 13 stripes represent the 13 original colonies — seven red, six white. Congress fixed the count at 13 in 1818; every state admitted after that is represented by a star, not an additional stripe."

  - question: "What do the 50 stars on the American flag represent?"
    answer: "The 50 stars represent the 50 states. The current arrangement has been official since July 4, 1960, when Hawaii's star was added. A new star is added on July 4 following a state's admission."

  - question: "Why is the American flag red, white, and blue?"
    answer: "The 1777 Flag Resolution gave no explanation for the color choice. Red, white, and blue were already in use in early American iconography including the Continental Army's regimental colors and the pre-independence Grand Union Flag. The colors came with the design. Thomson's 1782 symbolism described colors that were already in place — it attached meaning after the fact, through an authoritative government document."
