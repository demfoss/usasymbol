sections:
  - id: what-colors-mean
    icon: "fa-solid fa-palette"
    title: "What Do the Colors on the U.S. Flag Mean?"
    img: flag-color-swatches
    subsections:
      - subtitle: "Red — Valor and Bravery"
        text: "Thomson's exact phrase was *hardiness and valour* — a pairing that emphasizes physical toughness as much as courage. Modern government sources, including the State Department and USA.gov, render this as 'valor and bravery.' The meaning is broadly consistent, but the original wording is more martial: hardiness is about endurance under difficulty, not just battlefield courage."
      - subtitle: "White — Purity and Innocence"
        text: "White stands for purity and innocence. Thomson's 1782 wording has not been modified or expanded by any subsequent official source."
      - subtitle: "Blue — Vigilance, Perseverance, and Justice"
        text: "Blue is assigned three qualities — vigilance, perseverance, and justice — while red and white each carry one. Thomson's description tied blue to the canton, the broad band at the top of the Great Seal design (equivalent to the star field on the flag). All three qualities appear in his original text and have remained unchanged."
