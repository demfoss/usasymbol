sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "Interactive Map: The 7 States with a Single Star"
    paragraphs:
      - "The map below highlights all seven US states whose flags feature a single prominent star — spread from the Pacific Coast to the Great Plains and the Southeast."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "Quick Reference Table: State Flags & Their Stars"
    paragraphs:
      - "The table below covers all seven single-star state flags at a glance — star color, what it represents, and its placement on the flag — giving you an instant comparison across seven very different expressions of a single idea."

  - id: classic-lone-star-flags
    icon: "fa-solid fa-star"
    img: texas-lone-star
    title: "The Classic Lone Star Flags"
    paragraphs:
      - "The term 'Lone Star flag' officially belongs to Texas — but the concept of a single star declaring independence, sovereignty, or founding pride appears on three state flags with deep historical roots: Texas, California, and North Carolina."
    subsections:
      - subtitle: "Texas: The Lone Star State"
        text: "The **Texas state flag** is the most recognized single-star flag in the world. A single large **white five-pointed star** stands centered on a blue vertical stripe — flanked by a white horizontal stripe above and a red one below. The flag was adopted in 1839, when Texas was still an independent republic, and became the state flag upon annexation in 1845. The **Lone Star** is not a decoration — it IS the flag's entire statement. It declares that Texas was once a sovereign nation and has never forgotten it. Standardized in 2001, the [Texas Lone Star flag history and meaning](/states/texas/flag/texas-state-flag) remains the oldest current single-star state flag and consistently ranks among the best-designed in America by vexillologists."
      - subtitle: "California: The 1846 Red Star"
        text: "California's single **red five-pointed star** sits in the **upper-left canton** of the Bear Flag — above the grizzly bear and to the left of the 'CALIFORNIA REPUBLIC' text. The red star traces directly to the **Bear Flag Revolt of June 14, 1846**, when American settlers in Sonoma raised a handmade flag with a star and a grizzly bear to declare the short-lived California Republic. That revolt lasted 25 days. The star remained. When California officially adopted the Bear Flag in 1911 and standardized it in 1953, the red star came with it — a permanent memorial to the revolutionary moment that launched California's American identity. Full history on the [California Bear Flag red star and revolt history](/states/california/flag/california-state-flag)."
      - subtitle: "North Carolina: The 'NC' Star"
        text: "North Carolina's flag features a single **white five-pointed star** centered on the blue vertical stripe, flanked by the gold letters **'N'** and **'C'**. The date 'May 20, 1775' — the disputed date of the Mecklenburg Declaration of Independence — arcs above, and 'April 12, 1776' — the Halifax Resolves date — arcs below. The star-between-initials design was finalized in 1885 and gives the flag a clean, legible identity among the many busier seal-on-blue designs of the era. The [North Carolina star flag design and history](/states/north-carolina/flag/north-carolina-state-flag) is one of the few state flags where a star anchors a typographic composition."

  - id: industry-nickname-stars
    icon: "fa-solid fa-industry"
    img: arizona-copper-star
    title: "Stars Representing State Nicknames & Industry"
    paragraphs:
      - "Two state flags use a single star specifically to represent a state's defining economic identity — the mineral resource that drove settlement, statehood, and prosperity. Arizona's copper and Nevada's silver are not decorative choices. They are statements of economic history compressed into a single heraldic element."
    subsections:
      - subtitle: "Arizona: The Copper Star"
        text: "Arizona's flag is a masterclass in design economy. The upper half shows thirteen rays of alternating red and gold radiating outward — representing the original thirteen colonies and the colors of the setting sun over Arizona's desert. At the center of the flag, where the rays converge and the lower blue half begins, sits a single **copper-colored five-pointed star**. Copper is not a stylistic choice — Arizona is the **largest copper-producing state in the United States**, responsible for more than 70% of US copper output. The copper star was designed by Colonel Charles W. Harris in 1910 for the Arizona Rifle Team at a national shooting competition. The legislature officially adopted the flag in 1917. Full history on the [Arizona copper star flag design and meaning](/states/arizona/flag/arizona-state-flag)."
      - subtitle: "Nevada: The Silver Star"
        text: "Nevada's flag features a **silver five-pointed star** in the **upper-left corner**, nested between two sprays of sagebrush — Nevada's state flower — with the words **'Battle Born'** on a scroll above. 'Battle Born' refers to Nevada's admission to the Union in 1864, during the Civil War, when Congress accelerated Nevada's statehood to secure additional electoral votes for President Lincoln. The silver star represents Nevada's **'Silver State'** nickname, earned from the massive silver ore deposits of the Comstock Lode discovered in 1859, which transformed Nevada from empty desert territory to a state almost overnight. Adopted in 1929 and standardized in 1991, the [Nevada silver star and Battle Born flag history](/states/nevada/flag/nevada-state-flag) places the star in the **canton** — the upper-left position traditionally reserved for the most important element of a flag composition."

  - id: new-2024-star-flags
    icon: "fa-solid fa-clock-rotate-left"
    img: minnesota-north-star
    title: "The Newest Single-Star Flags: 2024 Redesigns"
    paragraphs:
      - "In 2024, two states adopted redesigned flags that both placed a single star at the center of their new identity. Minnesota and Utah independently reached the same conclusion: that a clean, prominent star communicates a state's identity more clearly than a dense state seal. Their simultaneous redesigns — one in March, one in May — made 2024 the most active year for US state flag changes since the early 20th century."
    subsections:
      - subtitle: "Minnesota: The Eight-Pointed North Star"
        text: "Minnesota adopted its redesigned state flag in **May 2024**, replacing a seal-on-blue design that had been widely criticized as one of the least distinctive state flags in the country. The new flag features a single **eight-pointed white star** — the **North Star** — on a divided field of dark navy blue and lighter sky blue, with a stylized white shape representing Minnesota's waters and the state's geographic outline. The eight-pointed star design was deliberately chosen to echo the **Ojibwe star quilt** pattern, honoring Minnesota's Indigenous heritage. It represents Minnesota's state motto **'L'Étoile du Nord'** ('The North Star') — a motto adopted in 1861 that had never been visualized on the old flag. The [Minnesota 2024 North Star flag redesign history](/states/minnesota/flag/minnesota-state-flag) is the only current US state flag featuring an **eight-pointed star** — every other star on a state flag has five points."
      - subtitle: "Utah: The Star Beneath the Beehive"
        text: "Utah adopted its redesigned state flag in **March 2024**, replacing the seal-on-blue design in use since 1913. The new flag centers the **beehive** — Utah's most enduring symbol — on a blue field, with a **white five-pointed star** positioned directly beneath the beehive. The star represents Utah's status as the **45th state** admitted to the Union, on January 4, 1896. A sego lily (Utah's state flower) and a stylized mountain range complete the design. The [Utah 2024 flag redesign beehive and star meaning](/states/utah/flag/utah-state-flag) became the cleaner, more legible alternative that vexillologists had long advocated — and the star gives the new design a numerically specific historical anchor that the old seal-on-blue never achieved."

  - id: mythbuster-hidden-stars
    icon: "fa-solid fa-magnifying-glass"
    title: "Mythbuster: States with a Star Hidden in the Seal"
    paragraphs:
      - "Several US state flags technically contain exactly one star — but the star is buried deep within a **state seal** or coat of arms, invisible from any practical viewing distance. **Vexillologists** do not classify these as single-star flags because the star functions as a secondary element within a complex composition, not as a primary design statement. The distinction matters: a flag is not a star flag just because a star appears somewhere on it."
      - "**Maine** is the clearest example. The Maine state coat of arms features the **North Star** (*Polaris*) directly above the shield, representing Maine's northern position as the first US state to see sunrise. The star is there — one star, clearly visible up close. But it competes with a pine tree, a moose, a farmer, a sailor, and the motto *Dirigo* for visual attention within the coat of arms, which then sits on a blue field as part of the classic **'seal on a bedsheet'** design that vexillologists frequently criticize. Maine's flag — which voters chose to keep in the 2024 referendum — is a seal flag that happens to contain a star, not a star flag. The single star on the [Maine state flag moose and North Star design](/states/maine/flag/maine-state-flag) is hidden in plain sight."
      - "**Massachusetts** presents a similar case: its coat of arms includes a gold star on the blue chief above the shield, marking Massachusetts's place among the original thirteen colonies. The star exists — but it is architecturally inseparable from the shield, supporters, and motto. The practical test is simple: from 30 feet away, can you immediately identify the flag by its star? For Texas, yes. For Maine and Massachusetts, no. That distinction — between a star flag and a seal-on-bedsheet flag that happens to contain a star — is the core of vexillological flag literacy."

  - id: territories-star-flags
    icon: "fa-solid fa-globe-americas"
    title: "US Territories with One Star"
    paragraphs:
      - "Beyond the 50 states, several US territories feature a single prominent star on their flags. The most recognizable is Puerto Rico — but the US Virgin Islands and American Samoa also carry eagle imagery that intersects with the star-flag tradition."
    subsections:
      - subtitle: "Puerto Rico"
        text: "Puerto Rico's flag places a **white five-pointed star** at the center of a **blue equilateral triangle** on the hoist side, against five alternating red and white horizontal stripes. The stripes echo the US flag; the triangle and star were designed in 1895 by the Puerto Rican independence movement. The star represents the island of Puerto Rico — one island, one star. NAVA's state and territory flag surveys consistently rank Puerto Rico's design among the top-scoring in the US system, citing its bold geometry and immediate legibility at any distance."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Single-Star State Flags"
    facts:
      - "Texas's Lone Star flag is the oldest current single-star state flag, adopted in 1839 — six years before Texas statehood"
      - "Arizona's copper star is the only metallic-colored star on any US state flag"
      - "Minnesota's 2024 North Star is the only eight-pointed star on any US state flag — all others are five-pointed"
      - "California's red star traces to the 1846 Bear Flag Revolt — it has been on the flag since the original handmade design"
      - "Nevada's silver star represents the Comstock Lode silver rush of 1859 — the ore deposit that transformed Nevada from empty desert territory into a state within five years"
      - "Nevada's 'Battle Born' motto on the flag refers to statehood during the Civil War (1864), not to the silver star — they are two separate historical facts on the same flag"
      - "Utah's star marks the state's precise position as the 45th state admitted to the Union (1896)"
      - "In 2024, both Minnesota and Utah adopted star-centered redesigns in the same year — the largest single-year addition to the single-star club"
      - "The North American Vexillological Association (NAVA) ranks Texas among the top-5 best-designed US state flags"
      - "Puerto Rico's single-star flag predates the US acquiring the territory — it was designed by the Puerto Rican independence movement in 1895"


faq:
  - question: "Which US state flag is officially the Lone Star flag?"
    answer: "Texas is the only US state flag officially known as the 'Lone Star Flag.' The name refers to the single white five-pointed star on the blue vertical stripe, which has represented Texas since the Republic of Texas adopted the design in 1839. The star symbolizes Texas's history as an independent sovereign nation before joining the United States in 1845. Texas is officially nicknamed 'The Lone Star State' in recognition of this history."

  - question: "Does the new Minnesota flag have a star?"
    answer: "Yes. The 2024 Minnesota flag redesign (adopted May 2024) features a single eight-pointed white star representing the 'North Star' — referencing Minnesota's state motto L'Étoile du Nord ('The North Star'), adopted in 1861. The eight-pointed design echoes the Ojibwe star quilt pattern, honoring Minnesota's Indigenous heritage. The new flag replaced a seal-on-blue design that had never visually represented the North Star motto. Minnesota's eight-pointed star is the only non-five-pointed star on any current US state flag."

  - question: "Why is the star on the Arizona flag copper?"
    answer: "Arizona's state flag features a copper-colored star because copper is Arizona's most economically significant mineral resource. Arizona is the largest copper-producing state in the United States, responsible for more than 70% of national copper output. The copper star was part of Colonel Charles W. Harris's original 1910 design for the Arizona Rifle Team, intended to represent Arizona's identity and economic foundation. The flag was officially adopted by the Arizona legislature in 1917."

  - question: "How many US state flags have a star on them?"
    answer: "Seven US state flags feature a single prominent star as the primary design element: Texas (white), California (red), North Carolina (white), Arizona (copper), Nevada (silver), Minnesota (white, 8-pointed — 2024 redesign), and Utah (white — 2024 redesign). Additional states have stars buried within state seals on their flags, but these are not classified as star flags because the star is not the primary visual element."

  - question: "What state flag has a red star?"
    answer: "California's state flag (the Bear Flag) features a red five-pointed star in the upper-left canton, above the California grizzly bear. The red star traces directly to the Bear Flag Revolt of June 14, 1846, when American settlers raised a handmade flag with a red star and grizzly bear while briefly declaring the California Republic. California officially adopted the Bear Flag in 1911 and standardized the design in 1953."

  - question: "What is a 'seal on a bedsheet' flag?"
    answer: "The 'seal on a bedsheet' is a vexillological term coined by the North American Vexillological Association (NAVA) to describe state flags that simply place a state seal on a solid blue background. These flags are widely criticized because they are complex, illegible at a distance, and nearly indistinguishable from each other. States like Maine and Massachusetts technically have a star in their coat of arms, but those stars are buried within the seal composition — making them seal-on-bedsheet flags, not single-star flags. The 2024 redesigns of Minnesota and Utah were specifically intended to escape this category."

  - question: "Which US territory flag has a single star?"
    answer: "Puerto Rico's flag features a single white five-pointed star in a blue equilateral triangle on the hoist side of the flag. The star represents the island of Puerto Rico itself. The flag design dates to 1895, created by the Puerto Rican independence movement. Puerto Rico's single-star flag is considered one of the best-designed flags in the entire American territorial and state system."

  - question: "What does the North Star represent on the Minnesota flag?"
    answer: "Minnesota's state motto is L'Étoile du Nord — French for 'The North Star' — adopted in 1861 when Minnesota was the northernmost US state. The 2024 flag redesign replaced the old seal-on-blue design with a flag centered on an eight-pointed white star representing this motto. The eight-pointed form was chosen to echo the Ojibwe star quilt pattern, honoring Minnesota's Indigenous heritage. For the first time, the state's 165-year-old motto is visually represented on the flag."
