sections:
  - id: weapons-overview
    icon: "fa-solid fa-shield-halved"
    title: "What Each Weapon or Tool Represents"
    highlights:
      - name: "Virginia — Spear, Sword, and Fallen Crown"
        image: "/images/flags/virginia/flag.webp"
        description: "**What it represents:** The defeat of tyranny — Virtus holds a spear over a fallen king whose own sword has dropped and crown rolled away. Every element is a weapon. The motto 'Sic Semper Tyrannis' (Thus always to tyrants) frames the entire scene. Designed in 1776 as a political declaration, unchanged ever since."
      - name: "South Carolina — The Crescent Gorget (Not a Moon)"
        image: "/images/flags/south-carolina/flag.webp"
        description: "**What it represents:** Military armor, not the night sky. The crescent on South Carolina's flag is a gorget — a crescent-shaped metal plate worn at the throat by SC militia officers in 1775. Colonel Moultrie took it directly from his soldiers' uniforms when designing the regimental flag. It predates the palmetto on the flag."
      - name: "Massachusetts — Bow of Peace, Sword of Courage"
        image: "/images/flags/massachusetts/flag.webp"
        description: "**What they represent:** Opposite messages on one flag. A Native American figure holds a bow with the arrow pointing downward — peace. Above the coat of arms, a bent arm brandishes a sword — courage. Massachusetts is the only US state flag where a weapon means peace and a weapon means war simultaneously."
      - name: "Montana — Pickaxe and Plow"
        image: "/images/flags/montana/flag.webp"
        description: "**What it represents:** Montana's twin founding economies — a miner's pickaxe and shovel alongside a plow in the state seal. The motto 'Oro y Plata' (Gold and Silver) makes the mining reference explicit. Adopted 1905."
      - name: "Delaware — The Continental Soldier's Musket"
        image: "/images/flags/delaware/flag.webp"
        description: "**What it represents:** Delaware's military service in the Revolutionary War. The coat of arms is supported by a farmer on the left and a soldier with a musket on the right — one of the few state flags to use a historical figure rather than an allegorical one. Delaware's regiment was among the most decorated in the Continental Army."
      - name: "Idaho — Military Equipment in the Seal"
        image: "/images/flags/idaho/flag.webp"
        description: "**What it represents:** Frontier defense and territorial-era military identity. Idaho's complex seal includes military figures with equipment alongside mining, justice, and agricultural symbols. Adopted 1907."
      - name: "Nebraska — Blacksmith's Hammer and Anvil"
        image: "/images/flags/nebraska/flag.webp"
        description: "**What it represents:** Industrial labor and frontier craftsmanship — a blacksmith working at hammer and anvil in the Nebraska seal, alongside a farmer, cabin, and steamboat. Adopted 1925."

  - id: virginia-weapons
    icon: "fa-solid fa-sword"
    title: "Virginia: The Spear, the Dropped Sword, and the Fallen Crown"
    paragraphs:
      - "Virginia's state flag carries the most elaborate weapon narrative of any US state flag. The state seal shows Virtus (Virtue), a female warrior, holding a spear in one hand and a sheathed sword in the other. Beneath her foot: a fallen king. The king's crown has rolled away. The chain of tyranny is broken. His own sword lies on the ground, dropped in defeat."
      - "Every element is a weapon: the spear Virtus carries, the sword she holds in reserve, the sword the king has lost, and even the chain — a tool of oppression — now broken. The motto 'Sic Semper Tyrannis' (Thus always to tyrants) frames the entire scene. This flag was designed in 1776 as a political declaration, and nothing about it has been softened since."

  - id: south-carolina-crescent
    icon: "fa-solid fa-moon"
    title: "South Carolina's Crescent: Not a Moon — A Military Gorget"
    paragraphs:
      - "The white crescent on South Carolina's flag is frequently misidentified as a moon. It is not. It is a gorget — a crescent-shaped piece of military armor worn at the throat by officers of the South Carolina militia in 1775. When Colonel William Moultrie designed a flag for his regiment defending Charleston in 1775, he used the gorget from his soldiers' uniforms as the symbol."
      - "The gorget was already a recognizable piece of colonial military identity — George Washington wore one in his most famous portraits. For South Carolina's militia, it meant military service and unit identity. When the flag was formalized (and the palmetto added after the Battle of Sullivan's Island in 1776), the crescent stayed as a military honor mark."
      - "Today, the South Carolina crescent is one of the best-known symbols on any US state flag — but most viewers do not know it represents a piece of armor rather than the night sky."

  - id: other-weapon-flags
    icon: "fa-solid fa-shield"
    title: "Massachusetts, Montana, Delaware, Idaho, Nebraska"
    paragraphs:
      - "**Massachusetts**: Massachusetts's coat of arms shows a Native American figure holding a bow with the arrow pointing downward — a deliberate peaceful gesture. But above the coat of arms, a bent arm brandishes a sword — representing courage and directly referencing the motto 'By the sword we seek peace, but peace only under liberty.' The two weapons appear on the same flag, one pointing down and one pointing forward."
      - "**Montana**: Montana's flag shows the state seal, which includes two specific tools: a miner's pickaxe and shovel, alongside a plow. These are the implements of Montana's two founding industries — mining and agriculture. Montana's motto 'Oro y Plata' (Gold and Silver) makes the mining reference explicit."
      - "**Delaware**: Delaware's coat of arms — on the state flag — is supported by a farmer on the left and a soldier on the right. The soldier holds a musket. Delaware's militia served in the Continental Army, and the musket-bearing soldier is a direct acknowledgment of that Revolutionary War service."
      - "**Idaho**: Idaho's state seal, shown on the flag, includes a soldier with military equipment. Idaho's seal is one of the more complex in the US, showing Liberty, Justice, a miner, mountains, and military figures."
      - "**Nebraska**: Nebraska's seal on the flag shows a blacksmith working at a hammer and anvil — one of the industrial labor images alongside a farmer, cabin, and steamboat. The blacksmith with hammer represents craftsmanship and industrial development."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Weapons on US State Flags"
    facts:
      - "South Carolina's crescent is a gorget — military throat armor — not a crescent moon"
      - "Virginia's flag has shown weapons unchanged since 1776 — 250 years"
      - "Massachusetts is the only state flag with both a peaceful weapon (downward arrow = peace) and an aggressive one (sword = courage) on the same flag"
      - "Virginia's 'Sic Semper Tyrannis' was shouted by John Wilkes Booth after assassinating Lincoln — the words on the flag became historically tied to that act"
      - "Montana's pickaxe and plow represent the state's twin economies: mining (gold and silver) and agriculture"
      - "South Carolina's crescent appeared before the palmetto — the gorget was on Moultrie's regimental flag in 1775; the palmetto was added after 1776"
      - "Delaware's musket-bearing soldier represents one of the most decorated units in the Continental Army — the Delaware Regiment, nicknamed 'The Blue Hen's Chickens'"

