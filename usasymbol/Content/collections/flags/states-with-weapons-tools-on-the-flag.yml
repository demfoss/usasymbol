faq:
  - question: "Which US state flags have weapons on them?"
    answer: "Seven US state flags display weapons or military tools: Virginia (spear held by Virtus; king's dropped sword), Massachusetts (bow and arrow; sword above shield), South Carolina (crescent gorget — military armor), Delaware (soldier with musket), Montana (pickaxe and shovel in seal), Idaho (military equipment in seal), and Nebraska (blacksmith's hammer and anvil)."

  - question: "Which state flag has a sword on it?"
    answer: "Virginia's flag shows two swords: one held by Virtus (the female warrior) and one dropped by the fallen king she has defeated. The scene illustrates the motto 'Sic Semper Tyrannis' (Thus always to tyrants). Massachusetts's flag also features a sword — a bent arm brandishing a sword above the coat of arms, representing courage."

  - question: "What is the crescent on the South Carolina flag?"
    answer: "The crescent on South Carolina's flag is a gorget — a crescent-shaped piece of metal armor worn at the throat by officers of the South Carolina militia in 1775. It is not a moon. Colonel William Moultrie used it on his regiment's flag, taken directly from his soldiers' uniforms. It represents military identity from the Revolutionary War era."

  - question: "Which state flag has a bow and arrow on it?"
    answer: "Massachusetts's state flag shows a Native American figure holding a bow, with the arrow pointing downward to signify peace. The same flag also shows a bent arm brandishing a sword above the coat of arms. Massachusetts is the only US state flag that uses a weapon both as a sign of peace (downward arrow) and a sign of courage (raised sword)."
