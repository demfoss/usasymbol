page:
  h1: "Which State Flags Have Native American Symbols?"
  intro_title: "Direct Tribal Imagery and Official Symbolic References"

  quick_answer:
    - "Five current state flags show direct Indigenous imagery: Florida, Kansas, Massachusetts, New Mexico, and Oklahoma."
    - "New Mexico uses the sacred Zia Sun Symbol, while Oklahoma uses an Osage warrior shield. Florida, Kansas, and Massachusetts depict Indigenous people within state seals or arms."
    - "Utah and Wyoming belong in a separate indirect category. Utah law links its mountain peaks to Indigenous peoples, while Wyoming's official explanation links its red border to Native Americans."

  methodology: "Direct entries require an official government or tribal source identifying a person, tribal emblem, or named cultural symbol in the current flag artwork. Abstract colors and shapes appear only in a separate indirect category when an official source explicitly gives them an Indigenous meaning; names, animals, and unsupported visual interpretations do not qualify."
