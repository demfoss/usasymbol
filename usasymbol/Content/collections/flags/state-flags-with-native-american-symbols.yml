sections:
  - id: "direct-indigenous-imagery"
    icon: "fa-solid fa-shield-halved"
    style: "law-cards"
    title: "State Flags With Direct Indigenous Imagery"
    paragraphs:
      - "Five current flags meet the direct standard. Two use named tribal symbols, and three reproduce people within a state seal or coat of arms. Inclusion describes what the official artwork contains, not whether every community views that use as respectful or representative."
    subsections:
      - subtitle: "New Mexico"
        text: |-
          **Type:** Sacred tribal symbol
          **Community:** Pueblo of Zia

          New Mexico's flag places a modified red Zia Sun Symbol on a yellow field. The Pueblo of Zia explains that four is sacred, connecting the four groups of rays to winds, seasons, directions, and obligations, with the circle binding them together.

          Named origin and tribal documentation make this the clearest tribal-symbol entry. Respect also requires context: the Pueblo calls the symbol sacred, provides a permission request process, and the New Mexico Legislature has acknowledged questions about its adoption and use.
        anchor_phrases:
          - "Zia Sun Symbol"
          - "Pueblo of Zia"
      - subtitle: "Oklahoma"
        text: |-
          **Type:** Tribal emblem and cultural objects
          **Communities:** Osage and Choctaw

          Oklahoma centers an Osage warrior shield of buffalo hide with seven eagle feathers. A calumet and olive branch cross its face, while an Oklahoma Historical Society account traces the blue field to a flag carried by Choctaw soldiers during the Civil War.

          Specific Osage and Choctaw connections qualify Oklahoma directly. Official state history also frames the shield, calumet, olive branch, and star-shaped crosses as a layered peace design rather than a generic decorative pattern.
        anchor_phrases:
          - "Osage warrior shield"
          - "Oklahoma Historical Society"
      - subtitle: "Florida"
        text: |-
          **Type:** Depicted person
          **Community:** Seminole

          Florida places its Great Seal at the crossing of a red saltire. The Department of State says a 1985 revision changed the foreground figure to a Seminole woman, correcting earlier artwork that portrayed a woman from the Western Plains.

          Florida qualifies because its current official seal identifies a particular Native community instead of relying on inference from clothing or setting. The figure remains one element in a larger seal scene that also includes water, a steamboat, sun, and sabal palm.
        anchor_phrases:
          - "Seminole woman"
          - "Great Seal"
      - subtitle: "Kansas"
        text: |-
          **Type:** Historical seal scene
          **Community:** Not named in the statute

          Kansas law describes a buffalo herd in the seal's background as retreating while two Native Americans pursue it on horseback. The same seal appears at the center of the dark blue state flag beneath a sunflower crest.

          Explicit statutory language supports inclusion, but the law does not name a nation or explain the riders' perspective. Kansas therefore belongs as a direct depiction, not as evidence that the flag carries a specific tribal emblem.
        anchor_phrases:
          - "Kansas law"
          - "two Native Americans"
      - subtitle: "Massachusetts"
        text: |-
          **Type:** Heraldic human figure
          **Community:** Not named in current law

          Massachusetts law specifies a Native figure in shirt, leggings, and moccasins holding a bow and a downward-pointing arrow. A crest above the shield shows an arm holding a broadsword, and the complete arms appear on the current white flag.

          Direct human imagery makes inclusion unambiguous, while its meaning and composition remain contested. A state advisory commission is reviewing replacement flag, seal, and motto ideas, but the existing flag remains legally current in August 2026.
        anchor_phrases:
          - "Massachusetts law"
          - "state advisory commission"

  - id: "official-indirect-references"
    icon: "fa-solid fa-mountain-sun"
    style: "law-cards"
    title: "Official Indigenous References Without Tribal Emblems"
    paragraphs:
      - "Utah and Wyoming use no identifiable Indigenous person or named tribal emblem in the relevant element. Both remain worth documenting because official state sources assign an Indigenous meaning to an abstract part of the design."
    subsections:
      - subtitle: "Utah"
        text: |-
          **Type:** Statutory abstract symbolism
          **Element:** White mountain band

          Utah's current flag has five peaks along the upper edge of its white middle band. Section 63G-1-501 says the band represents snowy mountains and peace, and that the peaks symbolize Utah's Indigenous peoples.

          Statutory wording supports an Indigenous association, but the peaks are not a tribal emblem and the law does not assign one peak to each nation. Utah therefore belongs in the indirect section rather than beside the Zia or Osage symbols.
        anchor_phrases:
          - "Utah's current flag"
          - "Indigenous association"
      - subtitle: "Wyoming"
        text: |-
          **Type:** Official color association
          **Element:** Red outer border

          Wyoming's Secretary of State says the flag's red border represents Native Americans and the blood of pioneers. The central bison and state seal are separate elements, and the explanation does not connect the border to a named nation.

          Official attribution places Wyoming in the broad reference set. A color with two assigned meanings is weaker evidence than a depicted person or documented tribal symbol, so it remains clearly labeled as indirect.
        anchor_phrases:
          - "Wyoming's Secretary of State"
          - "red border"

  - id: "flags-not-counted"
    icon: "fa-solid fa-circle-xmark"
    title: "State Flags Not Counted Without Evidence"
    paragraphs:
      - "Minnesota's 2024 flag uses a white North Star, a dark blue shape based on the state outline, and a light blue field representing water. Minnesota's official explanation does not identify those elements as tribal imagery, so the current flag is not included. Its retired seal-based flag did depict a Native rider, but a historical design cannot determine the current list."
      - "Native-derived place names, bison, eagles, stars, arrows, and geometric patterns do not qualify by themselves. Similar motifs can belong to many visual traditions, and assigning a tribal meaning without documentation would turn resemblance into an unsupported claim."

  - id: "indigenous-state-flag-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Indigenous Symbols on State Flags"
    facts:
      - "The Pueblo of Zia calls the Zia Sun Symbol sacred and provides a form for requesting permission to use it."
      - "Oklahoma's shield is identified as Osage, while the flag's blue field has an official historical link to Choctaw soldiers."
      - "Florida revised its seal artwork in 1985 to depict a Seminole woman instead of a Western Plains figure."
      - "Kansas law now describes the two riders in its seal scene as Native Americans."
      - "Massachusetts still uses its current Native figure and sword-bearing crest while a replacement-symbol process continues."
      - "Utah law assigns Indigenous meaning to the mountain peaks without naming individual nations."
      - "Wyoming's official color explanation is an association, not a tribal emblem."

faq:
  - question: "Which state flags have Native American symbols?"
    answer: "New Mexico and Oklahoma carry the clearest named tribal symbols: the Zia Sun Symbol and an Osage warrior shield. Florida, Kansas, and Massachusetts directly depict Indigenous people. Utah and Wyoming use abstract elements with official Indigenous associations."
  - question: "What Native American symbol is on the New Mexico flag?"
    answer: "New Mexico uses the sacred Zia Sun Symbol from the Pueblo of Zia. Four groups of four rays extend from a central circle, and the Pueblo explains that four connects to directions, seasons, winds, and sacred obligations."
  - question: "What tribe does the Oklahoma flag represent?"
    answer: "The central shield is an Osage warrior shield. Oklahoma Historical Society materials also trace the blue field to a flag carried by Choctaw soldiers and describe the calumet, eagle feathers, and star signs in the design."
  - question: "Does the Florida flag show a Seminole woman?"
    answer: "Yes. Florida's flag carries the state seal, and the Florida Department of State says the revised 1985 seal depicts a Seminole woman in the foreground."
  - question: "Why is the Massachusetts flag being redesigned?"
    answer: "Massachusetts created an advisory commission to recommend a new flag, seal, and motto through a public process. The current arms place a Native figure below a sword-bearing crest, a composition that the redesign process is reconsidering. No replacement had become law by August 2026."
  - question: "Does the new Minnesota flag have Native American imagery?"
    answer: "Minnesota's official description assigns the 2024 flag's elements to the North Star, the state outline, and water, not to a tribe or Indigenous cultural motif. The old flag included a Native rider, but it was retired on May 11, 2024."

