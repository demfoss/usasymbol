page:
  h1: "Best and Worst State Flags Ranked"
  intro_title: "An Editorial Ranking of All 50 Current State Flags"
  quick_answer:
    - "New Mexico has the best state flag in our ranking. Its red Zia sun on yellow earns full marks for recognition, readability, symbolism, and distinctiveness."
    - "Maryland ranks second for unmistakable heraldry, while Arizona places third with a bold copper star and sunset rays that remain clear at distance."
    - "Wisconsin ranks last because its crowded coat of arms, small date, and state name are difficult to read on moving fabric and resemble several blue state flags."
  methodology: "USA Symbol editors scored every current primary state flag from 1 to 5 on recognizability, simplicity and distance readability, meaningful symbolism, and distinctiveness among the 50 states. Totals range from 4 to 20; tied totals are ordered by overall performance when flown, with no extra hidden points. This is an editorial ranking, not a NAVA poll or a claim about public preference."
