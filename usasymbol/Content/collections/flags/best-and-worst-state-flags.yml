sections:
  - id: best-state-flags
    icon: "fa-solid fa-trophy"
    style: "law-cards"
    title: "Five Best State Flags"
    subsections:
      - id: new-mexico
        subtitle: "1. New Mexico"
        text: |-
          **Score:** 20/20
          **Defining feature:** Red Zia sun on yellow

          New Mexico centers one ancient geometric symbol on a high-contrast field. Four groups of four rays connect the design to the Zia people's sacred number and cycle of life.

          Every element remains recognizable when the flag is small, moving, or seen from the reverse. Full marks in all four criteria make it the clearest overall winner.
      - id: maryland
        subtitle: "2. Maryland"
        text: |-
          **Score:** 19/20
          **Defining feature:** Calvert and Crossland heraldry

          Maryland quarters the black-and-gold Calvert pattern with the red-and-white Crossland cross bottony. Both derive from the arms of George Calvert's family.

          Dense geometry costs one simplicity point, yet no other state flag can be mistaken for it. Historical meaning and instant recognition secure second place.
      - id: arizona
        subtitle: "3. Arizona"
        text: |-
          **Score:** 19/20
          **Defining feature:** Copper star and 13 rays

          Arizona sends 13 alternating red and yellow rays above a blue lower field, with a copper-colored star at the center. The palette refers to western sunsets, copper production, and the Colorado River.

          Strong shapes survive distance and give Arizona a silhouette unlike any seal-based flag. A slightly less direct symbolic system breaks the 19-point tie with Maryland.
      - id: alaska
        subtitle: "4. Alaska"
        text: |-
          **Score:** 18/20
          **Defining feature:** Big Dipper and North Star

          Thirteen-year-old Benny Benson designed Alaska's blue flag with eight gold stars in 1927. Seven form the Big Dipper, while the larger North Star points to the future state and its northern location.

          Sparse celestial geometry reads cleanly without words or a seal. A familiar star field is less exclusive than the top three designs, placing Alaska fourth.
      - id: colorado
        subtitle: "5. Colorado"
        text: |-
          **Score:** 18/20
          **Defining feature:** Red C and gold disk

          Colorado overlays a red letter C and gold disk on white between two blue stripes. The emblem turns the state initial into a simple, centered device.

          Bold proportions and limited colors work well at flagpole distance. Colorado wins the 18-point tie on immediate state recognition and structural balance.

  - id: worst-state-flags
    icon: "fa-solid fa-ranking-star"
    style: "law-cards"
    title: "Five Worst State Flags"
    subsections:
      - id: wisconsin
        subtitle: "50. Wisconsin"
        text: |-
          **Score:** 7/20
          **Defining feature:** Coat of arms with name and date

          Wisconsin centers a detailed coat of arms between the word WISCONSIN and the date 1848. Lawmakers added the text and date in 1979 to distinguish the flag from other blue state banners.

          Added labels identify the design only when they remain readable. From a distance, the flag still becomes a complex central patch on blue, leaving it last in this review.
      - id: nebraska
        subtitle: "49. Nebraska"
        text: |-
          **Score:** 8/20
          **Defining feature:** State seal in gold on blue

          Nebraska reproduces its state seal in gold and silver on a blue field. The seal contains a steamboat, train, mountains, cabin, wheat, blacksmith, and the motto Equality Before the Law.

          Many meaningful details compete inside one small circle and resemble neighboring seal-on-blue flags at viewing distance. That combination places Nebraska just above the bottom.
      - id: kansas
        subtitle: "48. Kansas"
        text: |-
          **Score:** 9/20
          **Defining feature:** Seal, sunflower crest, and state name

          Kansas stacks a sunflower crest above a detailed state seal and the word KANSAS below. The seal alone includes 34 stars, landscape scenes, wagons, animals, and a motto.

          Strong state references cannot overcome the amount of information competing for space. Lettering helps identification nearby but does little on a tall pole.
      - id: montana
        subtitle: "47. Montana"
        text: |-
          **Score:** 9/20
          **Defining feature:** State seal above MONTANA

          Montana places its landscape seal on blue and spells MONTANA above it. Mountains, the Great Falls of the Missouri, farming tools, and the Spanish motto Oro y Plata fill the seal.

          Local imagery earns symbolism points, yet the small landscape and name depend on close viewing. Shared seal-on-blue structure keeps the flag near the bottom.
      - id: oregon
        subtitle: "46. Oregon"
        text: |-
          **Score:** 10/20
          **Defining feature:** Different front and reverse

          Oregon's front carries a shield, eagle, 33 stars, state name, and 1859 on navy blue. Its reverse shows a single gold beaver, making Oregon the only current state flag with different designs on each side.

          The beaver side is simple and memorable, but the official front is crowded and expensive to reproduce correctly. That split personality prevents a lower placement while keeping Oregon in the bottom five.

  - id: state-flag-scoring-rubric
    icon: "fa-solid fa-list-check"
    title: "How the State Flag Ranking Was Scored"
    paragraphs:
      - "Recognizability measures whether a flag quickly calls its state to mind. Simplicity and readability measure performance on moving fabric and at distance, not whether a child can reproduce every contour perfectly."
      - "Symbolism rewards elements with a documented, state-specific meaning. Distinctiveness compares each design with the other 49 current state flags, which is why an individually meaningful seal can still score poorly if it resembles a large blue-field group."
      - "Each category receives an integer from 1 to 5 and contributes equally to the total. Ties remain ties in score; their displayed order reflects the editors' judgment of balance and real-world flag use rather than an unreported decimal. Minnesota and Utah are evaluated using the designs that became official in 2024."

  - id: what-the-ranking-rewards
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "What the Best State Flags Have in Common"
    facts:
      - "Every top-five flag uses a large central symbol or geometric pattern that survives reduction to a small image."
      - "New Mexico is the only flag in this review to score 5 in all four categories."
      - "Maryland reaches second place despite its complexity because its heraldic pattern remains unmistakable at distance."
      - "Minnesota and Utah both enter the upper half after replacing seal-heavy blue flags in 2024."
      - "Four of the bottom five rely on a state seal or coat of arms placed on blue."
      - "Oregon's gold beaver reverse scores better as a design than its official front, but both sides form one state flag."

faq:
  - question: "What is the best U.S. state flag?"
    answer: "New Mexico ranks first in this USA Symbol editorial review with 20 of 20 points. Its red Zia sun and yellow field are recognizable, readable, symbolically tied to the state, and unlike every other current state flag."
  - question: "What is the worst U.S. state flag?"
    answer: "Wisconsin ranks last here. Its coat of arms contains meaningful state imagery, but the small details, state name, date, and blue field do not remain distinct on moving fabric or at normal viewing distance."
  - question: "Is this the official NAVA state flag ranking?"
    answer: "No. USA Symbol editors applied the four criteria published on this page to all 50 current flags. NAVA's flag-design guidance informed the rubric, but the scores and order are ours and should not be attributed to NAVA or presented as a public-opinion poll."
  - question: "Where do the new Minnesota and Utah flags rank?"
    answer: "Utah ranks 13th and Minnesota 14th. Both score 17 of 20, including full marks for simplicity and distance readability. Their current designs became official in 2024 and replaced detailed blue flags centered on state seals."
  - question: "Why is Maryland ranked so high if its flag is complex?"
    answer: "Maryland loses one point for simplicity but earns maximum scores for recognition, symbolism, and distinctiveness. Its Calvert and Crossland quarters create a complex pattern that still remains identifiable when detail is reduced."
  - question: "Why do seal-on-blue state flags rank low?"
    answer: "Seals contain details designed for documents, not distant moving fabric. On a blue flag those details shrink into a central patch shared by many states, reducing readability and distinctiveness even when the seal itself carries strong meaning."

