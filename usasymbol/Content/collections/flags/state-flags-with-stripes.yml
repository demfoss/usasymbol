page:
  h1: "Which U.S. State Flags Have Stripes?"
  intro_title: "14 State Flags With Horizontal, Vertical, or Diagonal Stripes"

  quick_answer:
    - "Fourteen current U.S. state flags have broad straight stripes, bars, or striped fields. Hawaii leads with eight horizontal stripes outside its Union Jack canton."
    - "Iowa has the clearest vertical tricolor, while Alabama and Florida use diagonal saltires. North Carolina and Texas combine a vertical field with two horizontal bars."
    - "Utah is excluded because its 2024 law defines three segments divided by irregular horizontal lines, including a five-peaked mountain edge. Arizona's radiating wedges and thin flag borders are also not counted as stripes."

  methodology: "A stripe is a broad straight band or part of a clearly striped field. The count includes horizontal, vertical, and diagonal bars, but excludes thin borders, outlines, narrow dividers, ribbons, rays, and stripes contained only inside a seal or coat of arms."

