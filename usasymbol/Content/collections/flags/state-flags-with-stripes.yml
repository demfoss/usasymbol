sections:
  - id: horizontal-striped-state-flags
    icon: "fa-solid fa-grip-lines"
    style: "law-cards"
    title: "State Flags With Horizontal Stripes"
    highlights:
      - name: "California"
        image: "/images/flags/california/flag.webp"
        description: "California places one broad red horizontal stripe near the bottom of the Bear Flag. It qualifies because the stripe crosses most of the field and functions as a primary design element."
      - name: "Colorado"
        image: "/images/flags/colorado/flag.webp"
        description: "Colorado uses three equal-width horizontal stripes in blue, white, and blue, crossed by a red C and gold disc. The full-width bands make it a direct striped-field example."
      - name: "Georgia"
        image: "/images/flags/georgia/flag.webp"
        description: "Georgia has three horizontal stripes, red over white over red, with the state coat of arms and 13 stars in a blue canton. The stripes form the main field outside the canton."
      - name: "Hawaii"
        image: "/images/flags/hawaii/flag.webp"
        description: "Hawaii law specifies eight alternating horizontal stripes of white, red, and blue. The Union Jack canton adds a compound saltire and bordered cross, so the flag combines horizontal stripes with crossed bands."
      - name: "Missouri"
        image: "/images/flags/missouri/flag.webp"
        description: "Missouri uses three equal horizontal stripes of red, white, and blue, with the state coat of arms centered over them. Official state material calls all three large stripes."
      - name: "North Carolina"
        image: "/images/flags/north-carolina/flag.webp"
        description: "North Carolina law defines two equally proportioned fly bars, red above white, beside a blue vertical union. The flag qualifies as a mixed horizontal-and-vertical layout."
      - name: "Ohio"
        image: "/images/flags/ohio/flag.webp"
        description: "Ohio's swallowtail flag has three red and two white horizontal stripes that taper toward its forked end. State law says they represent Ohio's roads and waterways."
      - name: "Texas"
        image: "/images/flags/texas/flag.webp"
        description: "Texas combines white and red horizontal fields with a full-height blue field at the hoist. Texas law refers to each color field as a stripe when describing horizontal and vertical display."

  - id: vertical-striped-state-flags
    icon: "fa-solid fa-grip-lines-vertical"
    style: "law-cards"
    title: "State Flags With Vertical Stripes"
    highlights:
      - name: "Iowa"
        image: "/images/flags/iowa/flag.webp"
        description: "Iowa law specifies three vertical stripes of blue, white, and red, with the center white stripe wider in the original design. The tricolor field makes Iowa the clearest vertical-striped state flag."
      - name: "Mississippi"
        image: "/images/flags/mississippi/flag.webp"
        description: "Mississippi places broad red bands at both ends of a blue center field, separated by narrow gold lines. The red bands qualify as vertical stripes, while the thin gold dividers are excluded by the methodology."
      - name: "Tennessee"
        image: "/images/flags/tennessee/flag.webp"
        description: "Tennessee places a broad blue vertical bar at the fly edge of its red field. The narrow white line beside it is a separator, so only the blue bar counts as a stripe."

  - id: diagonal-striped-state-flags
    icon: "fa-solid fa-xmark"
    style: "law-cards"
    title: "State Flags With Diagonal Stripes"
    highlights:
      - name: "Alabama"
        image: "/images/flags/alabama/flag.webp"
        description: "Alabama's entire flag is a crimson saltire on white. The two broad crossing diagonal bars qualify even though heraldic language describes the shape as a cross rather than as ordinary parallel stripes."
      - name: "Florida"
        image: "/images/flags/florida/flag.webp"
        description: "Florida law sends a red bar from each corner to the outer rim of the central seal. The four arms read as two interrupted diagonal bars, forming a broad saltire across the white field."
      - name: "Maryland"
        image: "/images/flags/maryland/flag.webp"
        description: "Maryland's Calvert quarters contain alternating vertical gold and black fields crossed by a diagonal counterchanged band. The Secretary of State's display rules specifically identify the black stripe on that diagonal band."

  - id: flags-not-counted-as-striped
    icon: "fa-solid fa-circle-xmark"
    style: "law-cards"
    title: "State Flags That Look Striped but Do Not Qualify"
    highlights:
      - name: "Utah"
        image: "/images/flags/utah/flag.webp"
        description: "Utah's current flag has blue, white, and red stacked segments, but the statute divides them with two irregular horizontal lines. The upper boundary forms five mountain peaks, so these are color segments rather than straight parallel stripes under this methodology."
      - name: "Arizona"
        image: "/images/flags/arizona/flag.webp"
        description: "Arizona has 13 alternating red and gold rays spreading from a central point. Rays widen as they travel outward, so they are triangular wedges rather than stripes of consistent direction and width."
      - name: "West Virginia"
        image: "/images/flags/west-virginia/flag.webp"
        description: "West Virginia surrounds its white field with a narrow blue border. A border frames the design instead of crossing the field as a band, so it does not count as a stripe."
      - name: "Wyoming"
        image: "/images/flags/wyoming/flag.webp"
        description: "Wyoming uses white and red borders around a blue field. Those nested edge treatments are visually broad in places but remain borders, which the methodology excludes from the striped list."

  - id: state-flag-stripe-patterns
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "State Flag Stripe Facts"
    facts:
      - "Hawaii has eight primary horizontal stripes, the largest explicit stripe count among current state flags."
      - "Ohio has five horizontal stripes on the only nonrectangular U.S. state flag."
      - "Iowa is the only current state flag built as a blue, white, and red vertical tricolor."
      - "Alabama and Florida both use broad diagonal saltires, but Florida interrupts its red bars with the state seal."
      - "Mississippi's broad red end bands count as stripes, while its narrow gold divider lines do not."
      - "Utah law calls its blue, white, and red areas segments divided by irregular horizontal lines, not stripes."

faq:
  - question: "How many U.S. state flags have stripes?"
    answer: "Fourteen current state flags have broad straight stripes, bars, or clearly striped fields under this definition. The total includes horizontal, vertical, and diagonal designs but excludes borders, rays, narrow outlines, and details found only inside seals."

  - question: "Which state flag has the most stripes?"
    answer: "Hawaii has the most clearly specified primary stripes, with eight alternating horizontal stripes of white, red, and blue. Its Union Jack canton also contains crossed red and white bands, but those are treated as a compound canton design rather than added to the main count."

  - question: "Which state flags have vertical stripes?"
    answer: "Iowa has three vertical tricolor stripes. Mississippi has two broad red end bands around a blue center field, and Tennessee has one broad blue bar at the fly. North Carolina and Texas mix vertical and horizontal fields."

  - question: "Which state flags have diagonal stripes?"
    answer: "Alabama and Florida use broad diagonal saltires. Maryland's Calvert quarters combine vertical striping with a diagonal counterchanged band."

  - question: "Does the Utah state flag have stripes?"
    answer: "Not under this page's straight-band definition. Utah law describes three segments divided by irregular horizontal lines, with the upper line shaped as a five-peaked mountain. The stacked colors can look stripe-like, but their legal and geometric structure differs from parallel stripes."

  - question: "Why is Arizona not counted as a striped flag?"
    answer: "Arizona's 13 red and gold shapes are rays that spread from a common point and widen toward the top and sides. This methodology counts broad straight bands, not radiating wedges."

