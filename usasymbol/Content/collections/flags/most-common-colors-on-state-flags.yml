page:
  h1: "What Are the Most Common Colors on State Flags?"
  intro_title: "Every Color Family Across All 50 State Flags"

  quick_answer:
    - "Blue is the most common color family, appearing on 46 of the 50 current U.S. state flags. It forms a large field or band on 40."
    - "White appears on 43 flags, gold or yellow on 38, and red on 30 when documented major emblems and seal palettes are included."
    - "Washington is the only state flag with a green field. Copper is the rarest major color family, appearing only in Arizona's central star."

  methodology: "Counts cover each primary current flag. Major colors include fields, stripes, symbols, lettering, and recognizable seal areas; tiny shadows, outlines, and optional fringe do not count. Field-or-band counts cover only backgrounds, stripes, crosses, and diamonds. Navy through light blue form Blue; crimson and ruby form Red; gold, yellow, and amber form Gold/Yellow; silver and gray form Gray/Silver; buff and tan form Tan/Buff; eggshell is White; brown shades form Brown; copper stays separate."
