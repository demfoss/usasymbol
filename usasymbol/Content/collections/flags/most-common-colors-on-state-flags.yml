sections:
  - id: "most-common-state-flag-colors"
    icon: "fa-solid fa-palette"
    style: "law-cards"
    title: "Most Common State Flag Colors"
    paragraphs:
      - "Six broad families account for most visible flag palettes. Each count below uses the documented-major-color method, so a specified color inside a central seal qualifies even when it is not part of the background."
    highlights:
      - name: "Blue"
        image: "/images/flags/alaska/flag.webp"
        description: "**Flags:** 46. **Large fields or bands:** 40. Navy, indigo, cobalt, azure, sky blue, and Minnesota's two blues all enter one family. Blue ranks first because it dominates many backgrounds and also appears inside several official seals."
      - name: "White"
        image: "/images/flags/west-virginia/flag.webp"
        description: "**Flags:** 43. **Large fields or bands:** 21. White forms entire fields on flags such as Illinois and Rhode Island, but it also enters the count through stars, stripes, shields, lettering, and specified emblem details."
      - name: "Gold and Yellow"
        image: "/images/flags/utah/flag.webp"
        description: "**Flags:** 38. **Large fields or bands:** 4. Gold, yellow, and amber share one family because official descriptions often use the terms interchangeably for the same visual role. Utah's gold beehive and hexagon make the family easy to see."
      - name: "Red"
        image: "/images/flags/tennessee/flag.webp"
        description: "**Flags:** 30. **Large fields or bands:** 16. Crimson, ruby, and Old Glory Red normalize to Red. Tennessee belongs here because red covers most of its field, while other states use the family only for lettering or seal details."
      - name: "Brown"
        image: "/images/flags/california/flag.webp"
        description: "**Flags:** 23. **Large fields or bands:** 0. Brown is concentrated in animals, ships, tools, mountains, and human-made objects rather than backgrounds. California's grizzly bear is the clearest large standalone example."
      - name: "Green"
        image: "/images/flags/washington/flag.webp"
        description: "**Flags:** 24. **Large fields or bands:** 1. Plants, landscapes, branches, and seal artwork account for most green appearances. Washington alone promotes green from emblem detail to the entire field."

  - id: "state-flag-color-counts"
    icon: "fa-solid fa-chart-column"
    title: "State Flag Color Counts"
    paragraphs:
      - "Palette count records every documented major use in the 50-state table. Field or band count is narrower and records only large background regions, including Maryland's heraldic quarters and Delaware's central diamond."
    table:
      headers: ["Normalized Color Family", "Flags With Major Color", "Flags With Field or Band"]
      rows:
        - ["Blue", "46", "40"]
        - ["White", "43", "21"]
        - ["Gold/Yellow", "38", "4"]
        - ["Red", "30", "17"]
        - ["Brown", "23", "0"]
        - ["Green", "24", "1"]
        - ["Tan/Buff", "5", "2"]
        - ["Gray/Silver", "5", "0"]
        - ["Black", "3", "1"]
        - ["Purple", "2", "0"]
        - ["Copper", "1", "0"]
        - ["Orange", "2", "0"]
      caption: "Counts use the current primary flags of all 50 states and the normalization rules stated in the methodology."
      first_column_is_header: true

  - id: "how-state-flag-colors-were-counted"
    icon: "fa-solid fa-list-check"
    title: "How State Flag Colors Were Counted"
    paragraphs:
      - "Color names were normalized before counting. Every navy, indigo, cobalt, azure, sky blue, and light blue entry became Blue. Crimson and ruby became Red, while gold, yellow, and amber became Gold/Yellow. Silver joined Gray/Silver, but copper stayed separate because Arizona identifies its central star with that metal."
      - "Complex seals require a second rule. A color must occupy a recognizable part of the official artwork, while published specifications resolve its normalized family. Washington regulations name Irish Green, Oriental Blue, Spanish Yellow, black, and eggshell for its field, seal, rings, lettering, and portrait. Delaware law separately specifies the colors of each coat-of-arms element, so its statutory green, orange, white, yellow, and silver details also qualify."
      - "Optional gold fringe does not count. Tiny antialiasing shades, shadows, facial highlights, and outlines also do not count unless an official specification identifies them. This prevents a detailed seal from gaining several accidental colors that a simpler geometric flag could never have."

  - id: "washington-only-green-state-flag-field"
    icon: "fa-solid fa-leaf"
    style: "law-cards"
    title: "The Only Green State Flag Field"
    highlights:
      - name: "Washington"
        image: "/images/flags/washington/flag.webp"
        description: "**Field family:** Green. **Official shade:** Irish Green. Washington law requires a dark green field with the state seal in the center, and Secretary of State regulations identify the background as Irish Green. No other current state flag uses green as a large field or band; green appears on 23 others only within plants, landscapes, wreaths, shields, or emblem details."

  - id: "state-flag-color-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "State Flag Color Facts"
    facts:
      - "Blue appears somewhere in 46 documented major palettes and forms a field or band on 40 flags."
      - "White is the second most common family overall, appearing on 43 flags."
      - "Gold and yellow are combined because state specifications use both names for closely related flag colors."
      - "Washington is the only current state flag with a green field."
      - "Arizona is the only state flag with a copper star and the only major palette counted in the Copper family."
      - "Delaware and New York are the two major palettes in this table with Orange as a separate documented family."
      - "Minnesota's dark blue and bright blue both normalize to Blue, while its eight-pointed star adds White."
      - "Utah's current Beehive Flag contributes Blue, White, Red, and Gold/Yellow."

faq:
  - question: "What is the most common color on U.S. state flags?"
    answer: "Blue is the most common normalized color family. It appears as a documented major color on 46 current state flags and forms a large field or band on 40."
  - question: "How many state flags have red, white, and blue?"
    answer: "Twenty-five current state flags include all three families somewhere in their documented major palette. Some display them as broad fields or stripes, while others contain one of the colors only inside an emblem or seal."
  - question: "Which state flag is the only one with a green background?"
    answer: "Washington is the only state with a green flag field. State law requires dark green fabric, and Secretary of State regulations specify Irish Green for the background."
  - question: "Are gold and yellow counted as the same flag color?"
    answer: "Yes for this comparison. Gold, yellow, old gold, golden yellow, and amber are grouped as Gold/Yellow because official flag descriptions often apply those labels to closely related hues. Buff and tan remain a separate family."
  - question: "Do colors inside state seals count?"
    answer: "A seal color counts when it occupies a recognizable part of the current official artwork. Published state specifications resolve shade names and borderline cases, while tiny shadows, highlights, outlines, and optional fringe remain excluded."
  - question: "What colors are on the new Minnesota and Utah flags?"
    answer: "Minnesota's 2024 flag uses dark blue, bright blue, and white, normalized here to Blue and White. Utah's primary Beehive Flag uses Blue, White, Red, and Gold/Yellow."

