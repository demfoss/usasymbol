      - subtitle: "United Kingdom flag"
        text: "The Union Jack entered Hawaiian flag history through King Kamehameha I's relationship with Britain. Hawaii kept the kingdom-era design through republic, territory, and statehood, even though Britain never ruled Hawaii."

