faq:
  - question: "Which US state flag looks like the French flag?"
    answer: "Iowa's state flag looks like the French flag. Both use three vertical stripes of blue, white, and red in the same order. Iowa distinguishes its version by adding a bald eagle carrying the state motto in blue streamers and the word 'IOWA' on the white center stripe. Iowa was part of the Louisiana Territory, which France sold to the United States in 1803, and the flag adopted on March 29, 1921 was designed to honor that heritage."

  - question: "Why does the Texas flag look like Chile's flag?"
    answer: "Both flags use a lone white star, a blue area, a white stripe, and a red stripe. The structural difference is the blue: Texas uses a full-height vertical blue stripe covering the entire left third of the flag; Chile uses a small blue canton in the upper-left corner only. No historical source documents Chile as a design reference for Texas. Chile's flag (1817) predates Texas's by 22 years, and historians attribute the similarity to shared 19th-century independence movement symbolism, not copying."

  - question: "Why does Hawaii have the British flag on it?"
    answer: "Hawaii carries the British Union Jack in its canton because King Kamehameha I flew the British flag as a sign of alliance with Britain. When he created a flag for the Kingdom of Hawaii around 1816, he incorporated the Union Jack alongside eight island stripes. The flag survived Hawaii's transition from kingdom to republic to US territory to US state in 1959 without modification."

  - question: "Do Puerto Rico and Cuba have the same flag?"
    answer: "No, but they were designed as deliberate mirror images. Cuba uses a red triangle with a white star over alternating blue and white stripes. Puerto Rico uses a white triangle with a red star over the same striped pattern. Puerto Rican independence activists in New York inverted Cuba's flag colors in 1895 to express solidarity with Cuba's independence movement while asserting a distinct Puerto Rican identity."

  - question: "Which US state flag has the Union Jack on it?"
    answer: "Hawaii. The British Union Jack appears in the upper-left canton of Hawaii's state flag. Hawaii is the only US state flag to incorporate a foreign nation's flag as a design element. King Kamehameha I added the Union Jack to the Kingdom of Hawaii's flag around 1816, and it has remained unchanged through every political transition since."

  - question: "Why does Iowa's flag look like France's flag?"
    answer: "Iowa's General Assembly designed the flag that way on purpose. When it adopted the state flag on March 29, 1921, it chose a French tricolor layout to honor Iowa's French colonial heritage: Iowa was part of the Louisiana Territory, which France sold to the United States in 1803. Dixie Cornell Gebhardt of the Iowa Daughters of the American Revolution added a bald eagle and the word 'Iowa' to the white stripe to distinguish it from France's plain tricolor."

  - question: "What state flags look like foreign country flags?"
    answer: "Four US state or territory flags are routinely confused with foreign national flags: Texas resembles Chile's flag (same lone star and red-white-blue layout, different blue area structure), Iowa resembles France's flag (identical tricolor, Iowa adds an eagle), Hawaii contains the British Union Jack in its canton, and Puerto Rico's flag mirrors Cuba's with the triangle and stripe colors swapped."
