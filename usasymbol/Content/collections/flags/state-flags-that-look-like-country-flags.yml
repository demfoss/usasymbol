        text: "Iowa keeps France's **blue-white-red vertical tricolor**, then adds a bald eagle, blue motto streamers, and the word **IOWA** on the center stripe. At small sizes, those added details disappear. The eagle also connects Iowa to [state flags with bald eagles](/collections/flags/state-flags-with-eagles)."
      - subtitle: "France national flag"
        text: "France's flag is the plain tricolor: blue at the hoist, white in the middle, red at the fly. Iowa copied that layout intentionally because the state was once part of the French-controlled Louisiana Territory."

