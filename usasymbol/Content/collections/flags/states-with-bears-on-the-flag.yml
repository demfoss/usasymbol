      - "The bear on the California flag is modeled after Monarch, a real grizzly who lived at Golden Gate Park from 1889 to 1911"
      - "Missouri is technically a 'three-bear' flag if you count the bear on the shield within the seal"
      - "NAVA's 2001 state flag survey ranked California's flag among the top-scoring US state designs for clarity and distinctiveness; Missouri's ranked in the bottom half for legibility"
      - "Missouri's flag has faced periodic redesign proposals — the 2020s saw renewed discussion — but none have advanced to a legislative vote as of 2026"


faq:
  - question: "Which US state flags have a bear on them?"
    answer: "Exactly two: California and Missouri. California's Bear Flag shows a single California grizzly bear (Ursus arctos californicus) as its central and dominant image — impossible to miss. Missouri's flag shows two grizzly bears as heraldic shield-holders on the state seal, embedded within a complex composition at the center of a red-white-blue tricolor. Both are grizzlies; no US state flag depicts a black bear or polar bear."

  - question: "Are the bears on state flags a specific species?"
    answer: "Yes — both are grizzly bears (Ursus arctos). California's is specifically a California grizzly (Ursus arctos californicus), a subspecies that went extinct in 1922. Missouri's bears are grizzlies in the heraldic sense — chosen in 1822 to represent frontier strength — without being tied to a specific subspecies. No US state flag depicts a black bear, brown bear, or polar bear."

  - question: "Why are there bears on the Missouri flag?"
    answer: "Missouri's bears trace back to the state seal, designed in 1822. The legislature chose two grizzly bears as heraldic shield-holders to symbolize the strength and bravery of Missouri's citizens. Because Missouri's flag displays its state seal, the bears appear on the flag by extension. See the full history on the Missouri state flag page."

  - question: "What is the meaning of the bear on the California flag?"
    answer: "The bear on the California flag symbolizes strength, independence, and defiance — values that trace directly to the Bear Flag Revolt of June 14, 1846. The specific bear depicted is modeled after Monarch, the last California grizzly in captivity. The California grizzly is now extinct since 1922."

  - question: "How many US state flags feature animals?"
    answer: "More than a dozen US state flags feature animals, either as central symbols or within incorporated state seals. Common examples include Wyoming (bison), Louisiana (pelican), Michigan (elk and moose), and California (grizzly bear). Of those, bears appear on exactly two flags: California and Missouri — both depicting grizzlies."

  - question: "What bear is on the California flag?"
    answer: "The California state flag shows a California grizzly bear (Ursus arctos californicus), a now-extinct subspecies of the brown bear. The specific bear depicted is modeled after Monarch — a grizzly captured in 1889 and displayed at San Francisco's Golden Gate Park until his death in 1911."

  - question: "When was the California Bear Flag adopted?"
    answer: "The California Bear Flag was officially adopted as the state flag on February 3, 1911. The design traces back to the original Bear Flag raised during the Bear Flag Revolt of June 14, 1846. The flag was standardized with exact specifications in 1953."

  - question: "What is the history of the Missouri state flag?"
    answer: "The history of the Missouri state flag spans two distinct eras. The state seal — featuring two grizzly bears — was designed in 1822, one year after statehood. The flag itself was not adopted until March 22, 1913, when Representative Ida Stratton introduced the tricolor design incorporating the seal. The red, white, and blue stripes honor Missouri's French colonial heritage. Because the flag inherits its bears from a seal designed 91 years earlier, Missouri's grizzlies were never a flag design choice — they arrived on the flag as legacy symbols of governance."

  - question: "What is the history of the California state flag?"
    answer: "The history of the California state flag begins on June 14, 1846, with the Bear Flag Revolt — when American settlers in Sonoma raised a handmade grizzly bear flag and briefly declared the California Republic. The republic lasted 25 days before the U.S. Navy arrived. California was admitted to the Union in 1850, but the Bear Flag was not officially adopted as the state flag until February 3, 1911. The original 1846 flag was destroyed in the fires following the 1906 San Francisco earthquake. The flag design was standardized with exact specifications in 1953."

  - question: "What does the Missouri state seal mean and why is it on the flag?"
    answer: "A state seal is an official emblem used on government documents, laws, and public buildings — it is a state's most formal symbol. Missouri's state seal, adopted in 1822, features two grizzly bears as shield-holders, a central shield divided between a grizzly bear and a bald eagle, a crescent moon, and 24 stars. Missouri's flag displays the state seal at its center (within a blue ring), which is why the bears appear on the flag at all. Using the state seal on a flag is a common American convention — roughly 30 states feature their seal on their flag."

  - question: "Is the Missouri flag a tricolor?"
    answer: "Yes. Missouri's flag is a horizontal tricolor of red, white, and blue — an homage to the French flag, reflecting Missouri's French colonial heritage. The state seal, which includes two grizzly bears, appears at the center within a blue ring surrounded by 24 stars, one for each state at the time of Missouri's admission."
