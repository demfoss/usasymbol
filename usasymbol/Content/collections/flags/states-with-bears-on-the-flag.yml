sections:
  - id: california-flag-bear
    icon: "fa-solid fa-paw"
    title: "California State Flag: The Grizzly Bear"
    paragraphs:
      - "California's state flag is commonly called the 'Bear Flag.' The grizzly stands at the center of a white field, walking left across a strip of green grass. Below the bear, in bold black capital letters: **CALIFORNIA REPUBLIC**. In the upper left, a red five-pointed star echoes the Lone Star of Texas. A red horizontal stripe runs along the bottom."
      - "The bear on today's standardized flag is based on a real animal: **Monarch**, a California grizzly captured in 1889 and brought to San Francisco's Golden Gate Park. Monarch became a local celebrity and lived in captivity until 1911. Artist Charles Christian Nahl had painted Monarch in 1855 — it is that painting, filtered through Donald Graeme Kelley's 1953 standardized illustration, that walks across the California flag today."
      - "The California grizzly (*Ursus arctos californicus*) is now extinct. The last confirmed wild California grizzly was shot in Tulare County in August 1922. The subspecies was officially declared extinct in 1924. The bear on the flag is therefore a portrait of an animal no longer found in California."
    subsections:
      - subtitle: "The Bear Flag Revolt of 1846"
        text: "On June 14, 1846, American settlers in Sonoma raised a handmade grizzly-and-star flag and declared the short-lived **California Republic**. The republic lasted 25 days before the U.S. Navy replaced the Bear Flag with the Stars and Stripes. California adopted the Bear Flag as its state flag in 1911 and standardized the design in 1953."
      - subtitle: "The 65-Year Gap: Why Did California Wait Until 1911?"
        text: "California entered the Union in September 1850, but the Bear Flag was not officially adopted as the state flag until February 3, 1911 — 61 years later. During that gap, the Bear Flag existed as a widely recognized symbol of California without legal standing. Multiple legislative attempts to formalize it failed or stalled. The original 1846 flag was destroyed in the fires following the 1906 San Francisco earthquake, which may have prompted renewed interest in preserving the design officially. The [California state flag](/states/california/flag/california-state-flag) page covers the full legislative record."

  - id: missouri-flag-bears
    icon: "fa-solid fa-shield"
    title: "Missouri State Flag: The Hidden Grizzlies"
    paragraphs:
      - "Missouri's flag is a tricolor of red, white, and blue horizontal stripes — honoring Missouri's French colonial heritage. At the center sits a blue ring and, inside it, the Missouri state seal. That seal is where the bears live."
      - "Two **grizzly bears** stand upright on either side of the central shield, acting as heraldic shield-holders. They face outward, each resting a forepaw on the shield. They are easy to miss at a distance. Up close, they are unmistakable. The shield itself depicts a crescent moon and a grizzly bear (a third bear, in the inner seal design). A bald eagle perches above. The 24 stars on the blue ring mark Missouri as the 24th state admitted to the Union."
    subsections:
      - subtitle: "Why Does the Missouri Flag Have Bears on It?"
        text: "Missouri placed grizzly bears on the state seal in 1822, one year after statehood. The bears symbolized strength (*fortitudo*) and bravery in a frontier state. The seal motto, *Salus Populi Suprema Lex Esto* ('The welfare of the people shall be the supreme law'), pairs that strength with public duty."
      - subtitle: "History of the Missouri State Flag"
        text: "The state seal — including the two grizzly bears — was designed in 1822, one year after Missouri entered the Union as the 24th state. The flag itself was adopted on March 22, 1913, when Representative Ida Stratton introduced the tricolor design that incorporated the seal. That means Missouri's bears predate the flag by 91 years."

  - id: bear-comparison
    icon: "fa-solid fa-arrows-left-right"
    style: "compare-cards"
    title: "California vs. Missouri: The Two Bear Flags Compared"
    paragraphs:
      - "Both flags carry grizzly bears, but the similarity ends quickly: California builds the whole design around one bear, while Missouri inherits its bears from the state seal."
    subsections:
      - subtitle: "Visibility: Dominant vs. Hidden"
        text: "California's bear is the entire point of the [California state flag](/states/california/flag/california-state-flag) — impossible to miss from 50 feet. Missouri's bears are embedded in a state seal inside a blue ring on a tricolor. California's flag was designed around the bear; Missouri's flag inherited the bears from a seal designed 91 years before the flag was adopted."

      - subtitle: "Symbolism: Revolution vs. Governance"
        text: "California's bear carries the emotional weight of a revolutionary moment — the 1846 Bear Flag Revolt. It is a symbol of independence and defiance. On the [Missouri state flag](/states/missouri/flag/missouri-state-flag), the bears are heraldic shield-holders chosen by a legislature to project governmental strength. One bear is a rebel; the other two are guardians of the state."

      - subtitle: "Species: Extinct vs. Still Symbolic"
        text: "Both flags show grizzly bears (*Ursus arctos*), but California's specific subspecies — the California grizzly (*Ursus arctos californicus*) — has been extinct since 1922. Missouri's grizzlies are heraldic figures from the 1822 state seal and are not tied to a specific subspecies."

      - subtitle: "Design Philosophy: Clean Simplicity vs. Heraldic Complexity"
        text: "California's flag is considered a strong design by vexillological standards: a simple, distinctive image on a plain field, readable at any distance. Missouri's flag frequently appears in state flag redesign discussions — the bears are invisible at a distance because the seal is too dense to read. [States that border Missouri](/states/missouri/borders) all have simpler, more legible flag designs by comparison."

  - id: other-state-flags-animals
    icon: "fa-solid fa-shield-cat"
    title: "Which Other State Flags Have Animals on Them?"
    paragraphs:
      - "Bears are rare on state flags, but animals in general are common — especially on state seals incorporated into flag designs. Here is a quick overview of notable animal flags across the US."
    subsections:
      - subtitle: "Wyoming — American Bison"
        text: "Wyoming's flag features a silhouette of an American bison (buffalo) at its center — the only US state flag to prominently feature a bison. The bison carries the Wyoming state seal on its side."
      - subtitle: "Louisiana — Brown Pelican"
        text: "Louisiana's flag features a brown pelican feeding three chicks in a nest — the medieval heraldic image of 'pelican in her piety,' symbolizing self-sacrifice. The pelican has been on Louisiana's seal since 1804, eight years before statehood."
      - subtitle: "Michigan — Elk and Moose"
        text: "Michigan's state seal — and thus its flag — features both an elk and a moose as shield-holders. Like Missouri's bears, Michigan's large animals are heraldic supporters that anchor the coat of arms in the Great Lakes' wilderness identity."
      - subtitle: "New York — Eagle"
        text: "New York's flag seal features a bald eagle perched atop a globe. Eagles are the most common animal on US state flags and seals, and New York uses the bird as a crest rather than a central shield figure."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About Bear Flags"
    facts:
      - "Only 2 of 50 US state flags feature bears: California and Missouri"
      - "Both bears are grizzlies — the only bear species on any US state flag"
      - "The California grizzly depicted on the flag is extinct since 1922"
      - "Missouri's seal was designed in 1822; the flag was adopted in 1913"
      - "The original Bear Flag of 1846 was destroyed in the 1906 San Francisco earthquake"
      - "The bear on the California flag is modeled after Monarch, a real grizzly who lived at Golden Gate Park from 1889 to 1911"
      - "Missouri is technically a 'three-bear' flag if you count the bear on the shield within the seal"
      - "NAVA's 2001 state flag survey ranked California's flag among the top-scoring US state designs for clarity and distinctiveness; Missouri's ranked in the bottom half for legibility"
      - "Missouri's flag has faced periodic redesign proposals — the 2020s saw renewed discussion — but none have advanced to a legislative vote as of 2026"


faq:
  - question: "Which US state flags have a bear on them?"
    answer: "Exactly two: California and Missouri. California's Bear Flag shows a single California grizzly bear (Ursus arctos californicus) as its central and dominant image — impossible to miss. Missouri's flag shows two grizzly bears as heraldic shield-holders on the state seal, embedded within a complex composition at the center of a red-white-blue tricolor. Both are grizzlies; no US state flag depicts a black bear or polar bear."

  - question: "Are the bears on state flags a specific species?"
    answer: "Yes — both are grizzly bears (Ursus arctos). California's is specifically a California grizzly (Ursus arctos californicus), a subspecies that went extinct in 1922. Missouri's bears are grizzlies in the heraldic sense — chosen in 1822 to represent frontier strength — without being tied to a specific subspecies. No US state flag depicts a black bear, brown bear, or polar bear."

  - question: "Why are there bears on the Missouri flag?"
    answer: "Missouri's bears trace back to the state seal, designed in 1822. The legislature chose two grizzly bears as heraldic shield-holders to symbolize the strength and bravery of Missouri's citizens. Because Missouri's flag displays its state seal, the bears appear on the flag by extension."

  - question: "What is the meaning of the bear on the California flag?"
    answer: "The bear on the California flag symbolizes strength, independence, and defiance — values that trace directly to the Bear Flag Revolt of June 14, 1846. The specific bear depicted is modeled after Monarch, the last California grizzly in captivity. The California grizzly is now extinct since 1922."

  - question: "How many US state flags feature animals?"
    answer: "More than a dozen US state flags feature animals, either as central symbols or within incorporated state seals. Common examples include Wyoming (bison), Louisiana (pelican), Michigan (elk and moose), and California (grizzly bear). Of those, bears appear on exactly two flags: California and Missouri — both depicting grizzlies."

  - question: "What bear is on the California flag?"
    answer: "The California state flag shows a California grizzly bear (Ursus arctos californicus), a now-extinct subspecies of the brown bear. The specific bear depicted is modeled after Monarch — a grizzly captured in 1889 and displayed at San Francisco's Golden Gate Park until his death in 1911."

  - question: "When was the California Bear Flag adopted?"
    answer: "The California Bear Flag was officially adopted as the state flag on February 3, 1911. The design traces back to the original Bear Flag raised during the Bear Flag Revolt of June 14, 1846. The flag was standardized with exact specifications in 1953."

  - question: "What is the history of the Missouri state flag?"
    answer: "Missouri's state seal, featuring two grizzly bears, was designed in 1822, one year after statehood. The flag was adopted on March 22, 1913, when Representative Ida Stratton introduced the tricolor design incorporating the seal. The bears appear on the flag because the seal appears on the flag."

  - question: "What is the history of the California state flag?"
    answer: "The California state flag traces to the Bear Flag Revolt of June 14, 1846, when settlers in Sonoma raised a handmade grizzly bear flag. California joined the Union in 1850 but did not officially adopt the Bear Flag until February 3, 1911. The design was standardized in 1953."

  - question: "What does the Missouri state seal mean and why is it on the flag?"
    answer: "Missouri's state seal, adopted in 1822, features two grizzly bears as shield-holders, a central shield, a crescent moon, and 24 stars. Missouri's flag places that seal inside a blue ring at the center. That is why the bears appear on the flag."

  - question: "Is the Missouri flag a tricolor?"
    answer: "Yes. Missouri's flag is a horizontal tricolor of red, white, and blue — an homage to the French flag, reflecting Missouri's French colonial heritage. The state seal, which includes two grizzly bears, appears at the center within a blue ring surrounded by 24 stars, one for each state at the time of Missouri's admission."
