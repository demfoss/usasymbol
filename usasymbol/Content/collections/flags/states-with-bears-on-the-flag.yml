page:
  h1: "Which US State Flags Have Bears on Them?"
  intro_title: "Why Do California and Missouri Have Bears on Their Flags?"

  quick_answer:
    - "Exactly two US state flags feature bears: California and Missouri."
    - "California's flag shows a single California grizzly bear (Ursus arctos californicus) — now extinct — as its dominant central symbol."
    - "Missouri's flag shows two grizzly bears flanking the state seal, symbolizing the strength and bravery of its citizens. They date from the 1822 state seal — one year after statehood."

  methodology: >
    Data compiled from official state flag statutes, the National Conference of State Legislatures (NCSL),
    each state's Secretary of State office, and vexillological archives. All 50 state flags were reviewed
    for bear imagery, including seals incorporated into flag designs.

