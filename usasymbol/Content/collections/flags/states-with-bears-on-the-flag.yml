seo:
  title: "Which US State Flags Have Bears on Them? (Complete List & History)"
  description: "Exactly two US state flags have bears: California and Missouri. Both are grizzlies — one dominates the entire flag, the other is buried in a state seal from 1822. Here's the full history of both."

