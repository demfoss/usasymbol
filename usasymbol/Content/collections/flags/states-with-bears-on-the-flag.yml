sections:
  - id: california-flag-bear
    icon: "fa-solid fa-paw"
    img: california-bear-detail
    title: "California State Flag: The Iconic Grizzly Bear"
    paragraphs:
      - "California's state flag is so synonymous with its bear that it is simply called the 'Bear Flag.' The grizzly stands at the center of a white field, walking left across a strip of green grass. Below the bear, in bold black capital letters: **CALIFORNIA REPUBLIC**. In the upper left, a red five-pointed star echoes the Lone Star of Texas — a nod to the revolutionary spirit that both flags share. A red horizontal stripe runs along the bottom."
      - "The bear on today's standardized flag is based on a real animal: **Monarch**, a California grizzly captured in 1889 and brought to San Francisco's Golden Gate Park. Monarch became a local celebrity and lived in captivity until 1911. Artist Charles Christian Nahl had painted Monarch in 1855 — it is that painting, filtered through Donald Graeme Kelley's 1953 standardized illustration, that walks across the California flag today."
      - "The California grizzly (*Ursus arctos californicus*) is now extinct. The last confirmed wild California grizzly was shot in Tulare County in August 1922. The subspecies was officially declared extinct in 1924, and the full story is told on the [California's extinct grizzly bear](/states/california/mammal/grizzly-bear) symbol page. California thus carries a memorial on its flag — a portrait of a lost animal that represents what the state once was."
    subsections:
      - subtitle: "The Bear Flag Revolt of 1846"
        text: "On June 14, 1846, a group of American settlers in Sonoma, California, seized the Mexican garrison and raised a handmade flag bearing a grizzly bear and a lone star. They declared the independent 'California Republic.' The republic lasted 25 days. On July 9, 1846, the U.S. Navy arrived and replaced the Bear Flag with the Stars and Stripes. The original flag was lost in the fires following the 1906 San Francisco earthquake. California officially readopted the Bear Flag design as its state flag in 1911, and the design was standardized in 1953."
      - subtitle: "The 65-Year Gap: Why Did California Wait Until 1911?"
        text: "California entered the Union in September 1850, but the Bear Flag was not officially adopted as the state flag until February 3, 1911 — 61 years later. During that gap, the Bear Flag existed as a widely recognized symbol of California without legal standing. Multiple legislative attempts to formalize it failed or stalled. The original 1846 flag was destroyed in the fires following the 1906 San Francisco earthquake, which may have prompted renewed interest in preserving the design officially. The [California state flag](/states/california/flag/california-state-flag) page covers the full legislative record."

  - id: missouri-flag-bears
    icon: "fa-solid fa-shield"
    img: missouri-bears-detail
    title: "Missouri State Flag: The Hidden Grizzlies"
    paragraphs:
      - "Missouri's flag is a tricolor of red, white, and blue horizontal stripes — honoring Missouri's French colonial heritage. At the center sits a blue ring and, inside it, the Missouri state seal. That seal is where the bears live."
      - "Two **grizzly bears** stand upright on either side of the central shield, acting as heraldic shield-holders. They face outward, each resting a forepaw on the shield. They are easy to miss at a distance. Up close, they are unmistakable. The shield itself depicts a crescent moon and a grizzly bear (a third bear, in the inner seal design). A bald eagle perches above. The 24 stars on the blue ring mark Missouri as the 24th state admitted to the Union."
    subsections:
      - subtitle: "Why Does the Missouri Flag Have Bears on It?"
        text: "Missouri's legislature placed grizzly bears on the state seal in 1822, one year after statehood. The choice was deliberate: bears symbolized strength (*fortitudo*) and bravery — virtues the legislature wanted to associate with the citizens of the new state. Missouri was frontier territory in 1822. The grizzly represented the raw power of the American wilderness that Missourians were pushing into and taming. The motto on the seal — *Salus Populi Suprema Lex Esto* ('The welfare of the people shall be the supreme law') — pairs with the bears to project a government built on strength in service of its citizens."
      - subtitle: "History of the Missouri State Flag"
        text: "The history of the Missouri state flag spans nearly a century. The state seal — including the two grizzly bears — was designed in 1822, one year after Missouri entered the Union as the 24th state. The seal was the work of the state legislature, which chose heraldic bears to project strength on the frontier. The flag itself was not adopted until March 22, 1913, when Representative Ida Stratton introduced the design featuring Missouri's French-heritage tricolor. The full [Missouri state flag history and meaning](/states/missouri/flag/missouri-state-flag) explains how the tricolor and seal came together 91 years apart. Missouri's flag faces periodic criticism for being overly complex — the detailed seal is difficult to read at distance, and redesign proposals have circulated, though none have advanced to the legislature as of 2026."

  - id: bear-comparison
    icon: "fa-solid fa-arrows-left-right"
    style: "compare-cards"
    img: california-flag-full
    img_right: missouri-flag-detail
    title: "California vs. Missouri: The Two Bear Flags Compared"
    paragraphs:
      - "Both flags carry grizzly bears, but the similarity ends there. Here is how they compare across four dimensions that define each flag's identity."
    subsections:
      - subtitle: "Visibility: Dominant vs. Hidden"
        text: "California's bear is the entire point of the [California state flag](/states/california/flag/california-state-flag) — impossible to miss from 50 feet. Missouri's bears are embedded in a state seal inside a blue ring on a tricolor. California's flag was designed around the bear; Missouri's flag inherited the bears from a seal designed 91 years before the flag was adopted."

      - subtitle: "Symbolism: Revolution vs. Governance"
        text: "California's bear carries the emotional weight of a revolutionary moment — the 1846 Bear Flag Revolt. It is a symbol of independence and defiance. On the [Missouri state flag](/states/missouri/flag/missouri-state-flag), the bears are heraldic shield-holders chosen by a legislature to project governmental strength. One bear is a rebel; the other two are guardians of the state."

      - subtitle: "Species: Extinct vs. Still Symbolic"
        text: "Both flags show grizzly bears (*Ursus arctos*), but California's specific subspecies — the California grizzly (*Ursus arctos californicus*) — has been extinct since 1922. The California flag is in part a memorial to a lost animal. Missouri's grizzlies represent the frontier archetype of power and strength without being tied to a specific subspecies."

      - subtitle: "Design Philosophy: Clean Simplicity vs. Heraldic Complexity"
        text: "California's flag is considered a strong design by vexillological standards: a simple, distinctive image on a plain field, readable at any distance. Missouri's flag frequently appears in state flag redesign discussions — the bears are invisible at a distance because the seal is too dense to read. [States that border Missouri](/states/missouri/borders) all have simpler, more legible flag designs by comparison."

  - id: other-state-flags-animals
    icon: "fa-solid fa-shield-cat"
    title: "Which Other State Flags Have Animals on Them?"
    paragraphs:
      - "Bears are rare on state flags, but animals in general are common — especially on state seals incorporated into flag designs. Here is a quick overview of notable animal flags across the US."
    subsections:
      - subtitle: "Wyoming — American Bison"
        text: "Wyoming's flag features a silhouette of an American bison (buffalo) at its center — the only US state flag to prominently feature a bison. The bison carries the Wyoming state seal on its side."
      - subtitle: "Louisiana — Brown Pelican"
        text: "Louisiana's flag features a brown pelican feeding three chicks in a nest — the medieval heraldic image of 'pelican in her piety,' symbolizing self-sacrifice. The pelican has been on Louisiana's seal since 1804, eight years before statehood."
      - subtitle: "Michigan — Elk and Moose"
        text: "Michigan's state seal — and thus its flag — features both an elk and a moose as shield-holders. Like Missouri's bears, Michigan's large animals are heraldic supporters that anchor the coat of arms in the Great Lakes' wilderness identity."
      - subtitle: "New York — Eagle"
        text: "New York's flag seal features a bald eagle perched atop a globe. Eagles are the most common animal on US state flags and seals, appearing in one form or another on a dozen state designs. For a full comparison of all designs, see the complete [list of US state flags](/symbols/flags)."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Bear Flags"
    facts:
      - "Only 2 of 50 US state flags feature bears: California and Missouri"
      - "Both bears are grizzlies — the only bear species on any US state flag"
      - "The California grizzly depicted on the flag is extinct since 1922"
      - "Missouri's seal was designed in 1822; the flag was adopted in 1913"
