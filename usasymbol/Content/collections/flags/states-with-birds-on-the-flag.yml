sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "Interactive Map: US State Flags with Birds"
    paragraphs:
      - "Bird imagery clusters around state seals: Louisiana uses a pelican as the main emblem, while most eagle states inherit the bird through a seal or coat of arms."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "All 10 States Featuring Birds"
    paragraphs:
      - "Louisiana is the outlier by species and placement: its brown pelican sits at the center of the flag, while most eagles are embedded in seals or crests."

  - id: louisiana-pelican-flag
    icon: "fa-solid fa-dove"
    title: "The Only US State Flag with a Pelican"
    paragraphs:
      - "Louisiana is the only US state whose flag features a bird other than the bald eagle. That bird is the **brown pelican** (*Pelecanus occidentalis*), rendered in the heraldic pose known as **'pelican in her piety'**: the mother pelican stands in her nest, wings spread, wounding her own breast to feed three chicks below her with her blood. The three drops falling from her breast appear explicitly on the flag."
      - "The symbolism is medieval in origin — European heraldry used the pelican-in-her-piety as a representation of self-sacrifice, parental devotion, and Christian charity. Louisiana inherited this image from French colonial tradition, where the pelican was already associated with the territory long before American statehood. The design appears on the territorial seal of 1804 and migrated to the official state flag when Louisiana formally adopted it in 1912."
    subsections:
      - subtitle: "History of the Louisiana State Flag"
        text: "Louisiana's connection to the pelican predates statehood by over a century. French colonial administrators embedded the pelican-in-her-piety in the region's heraldry during the 18th century. The territorial seal adopted in 1804 already bore the image. Louisiana officially adopted its [pelican in her piety flag](/states/louisiana/flag/louisiana-state-flag) in 1912 and standardized it in 2010."

  - id: eagle-flags-group-1
    icon: "fa-solid fa-feather"
    title: "US State Flags Featuring the Bald Eagle"
    paragraphs:
      - "Nine US state flags feature the **bald eagle** (*Haliaeetus leucocephalus*). Most arrived at the eagle through a state seal or coat of arms drawn from the **Great Seal of the United States**; Iowa is the main layout exception, with the eagle flying across a tricolor. For each eagle flag in detail, see [US state flags with eagles](/collections/flags/state-flags-with-eagles)."
    subsections:
      - subtitle: "Illinois"
        text: "The **Illinois state flag** places the **state seal** on a white background, with the bald eagle perched on a boulder at center — wings raised, clutching a **shield** bearing thirteen stars and stripes, and a ribbon in its beak reading *State Sovereignty, National Union*. The word 'ILLINOIS' was added in 1970 after a Vietnam War-era petition. See the [Illinois bald eagle flag history](/states/illinois/flag/illinois-state-flag) for the design story."
      - subtitle: "Iowa"
        text: "The **Iowa state flag** is a vertical **tricolor** of blue, white, and red — a nod to Iowa's French territorial heritage. On the white center stripe, a **bald eagle** soars with wings spread, carrying a blue ribbon in its beak with the state motto: *Our Liberties We Prize and Our Rights We Will Maintain*. Iowa is the only eagle-flag state where the bird flies freely on the flag rather than within a **state seal** or **coat of arms**. See the [Iowa tricolor eagle flag](/states/iowa/flag/iowa-state-flag) for the full design history."
      - subtitle: "Michigan"
        text: "Michigan's flag displays the **state coat of arms** on a dark blue field, with the bald eagle as the **crest** at the apex — wings spread, holding an **olive branch** and a **bundle of arrows** that mirror the Great Seal. The central shield shows a man on a peninsula pointing toward the sunrise, flanked by an elk and a moose as shield-holders. Michigan is the only US state flag with three distinct animals: eagle, elk, and moose. See the [Michigan state flag](/states/michigan/flag/michigan-state-flag)."

  - id: eagle-flags-group-2
    icon: "fa-solid fa-shield"
    title: "New York, North Dakota & Pennsylvania"
    paragraphs:
      - "New York and Pennsylvania use the eagle as a crest above a coat of arms; North Dakota makes the eagle the dominant element of the entire flag."
    subsections:
      - subtitle: "New York"
        text: "New York's flag centers the **state coat of arms** on a deep blue field. The bald eagle serves as the **crest**, perched atop a globe representing the Western Hemisphere with wings fully spread — one of the most architecturally elaborate eagle placements on any state flag. The coat of arms dates to 1778, making New York's eagle one of the oldest in continuous American state heraldry. Full design history on the [New York state flag with eagle crest](/states/new-york/flag/new-york-state-flag)."
      - subtitle: "North Dakota"
        text: "North Dakota's flag is the most eagle-dominated of all 50 states — the **bald eagle** fills the entire design, modeled directly on the regimental colors of the First North Dakota Infantry from the Spanish-American War. The eagle holds an **olive branch and arrows**, carries a **shield** of thirteen stripes, and grips a ribbon reading **'E Pluribus Unum'** — an almost exact reproduction of the **national emblem**. The [North Dakota Great Seal eagle flag](/states/north-dakota/flag/north-dakota-state-flag) is less a state seal flag and more a declaration of pure American patriotism."
      - subtitle: "Pennsylvania"
        text: "Pennsylvania's flag displays the **state coat of arms** on a deep blue field, with the bald eagle as the **crest** at the very top — wings spread above two horses that serve as shield-holders. The coat of arms dates to 1778, and the flag was formally adopted in 1907. Pennsylvania's eagle crest reflects the same founding-era heraldic conventions that shaped the Great Seal just four years after the coat of arms was first designed. See the [Pennsylvania state flag and coat of arms](/states/pennsylvania/flag/pennsylvania-state-flag)."

  - id: eagle-flags-utah-oregon
    icon: "fa-solid fa-arrows-rotate"
    title: "Oregon, Missouri & Wyoming"
    paragraphs:
      - "Oregon, Missouri, and Wyoming show how easy it is for an eagle to be present but visually secondary: one appears on Oregon's front-side seal, one inside Missouri's seal, and one inside the seal printed on Wyoming's bison."
    subsections:
      - subtitle: "Oregon"
        text: "Oregon's flag is the only US state flag with two completely different designs on each side. The **obverse side** (front) shows the state seal on a navy blue background, with a bald eagle perched at the top of the shield — wings spread above a panorama of mountains, ocean, and a covered wagon. Turn the flag over and the eagle vanishes: the **reverse side** shows only a golden beaver. Oregon's eagle exists exclusively on the **obverse side state seal**, so it is visible only from one face of the flag."
      - subtitle: "Missouri"
        text: "Missouri's flag places the state seal inside a blue ring on a red-white-blue tricolor. The seal includes the United States coat of arms, and that coat of arms contains a bald eagle with arrows and an olive branch. Missouri is better known in flag-animal lists for its grizzly bears, but the eagle is also present inside the seal."
      - subtitle: "Wyoming"
        text: "Wyoming's flag is visually a bison flag first: a large white bison carries the state seal on its body. Inside that seal is an eagle resting on a shield. The bird is real flag imagery, but it is nested two layers deep — seal inside bison, eagle inside seal."

  - id: territories-bird-flags
    icon: "fa-solid fa-globe-americas"
    title: "US Territories with Bird Flags (Bonus)"
    paragraphs:
      - "Beyond the 50 states, two US territories feature birds prominently on their official flags. Both use the bald eagle with local or territorial details."
    subsections:
      - subtitle: "American Samoa"
        text: "American Samoa's flag features a **bald eagle** in flight across a red and blue background, holding a **war club** (*uatogi*) and a **fly whisk** (*fue*) in its talons rather than the Great Seal arrows and olive branch. The flag was adopted in 1960."
      - subtitle: "US Virgin Islands"
        text: "The US Virgin Islands flag shows a simplified **US coat of arms** eagle on a white background: a golden bald eagle holding a laurel branch and three arrows, flanked by the yellow letters **'V'** and **'I'**. It was adopted in 1921, four years after the United States purchased the islands from Denmark."

  - id: why-birds-on-flags
    icon: "fa-solid fa-landmark"
    title: "Why Do State Flags Feature Birds?"
    paragraphs:
      - "The short answer is **state seals**. Most birds on US state flags arrived through a state seal designed before the flag itself. The bald eagle appears again and again because state seals borrowed from the **Great Seal of the United States** (1782)."
      - "Louisiana took a different path. Its **pelican-in-her-piety** came from French colonial heraldry and was already on Louisiana's territorial seal by 1804, eight years before statehood. The pelican was not modeled on the national emblem."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About Bird Flags"
    facts:
      - "10 of 50 US state flags feature birds — 9 bald eagles and 1 brown pelican"
      - "Louisiana is the only state whose flag features a bird other than the bald eagle"
      - "The pelican-in-her-piety on Louisiana's flag traces to French colonial heraldry, predating American statehood by over a century"
      - "North Dakota's eagle is almost identical to the Great Seal of the United States"
      - "Oregon's eagle is visible only on the obverse (front) of its two-sided flag"
      - "Iowa's eagle is the only bird-flag eagle not enclosed within a state seal — it flies on a tricolor"
      - "The 2024 Minnesota and Utah flag redesigns removed bird imagery from their current flag designs"
      - "The bald eagle was chosen as the US national emblem in 1782 because it is native only to North America"
      - "The pelican-in-her-piety heraldic motif originates in medieval bestiaries, where the pelican was believed to feed her young with her own blood"


faq:
  - question: "How many US state flags have birds on them?"
    answer: "Exactly 10 US state flags feature birds: Illinois, Iowa, Louisiana, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Nine feature the bald eagle. Louisiana is the only current state flag with a different bird — the brown pelican in the heraldic 'pelican in her piety' pose."

  - question: "What is the most common bird on US state flags?"
    answer: "The bald eagle is by far the most common bird on US state flags, appearing on 9 of the 10 bird-flag states: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Most appear through state seals or coats of arms rather than as standalone flag designs."

  - question: "Does the new 2024 Minnesota flag have a loon on it?"
    answer: "No. Minnesota's redesigned 2024 flag does not feature a bird. The new design centers on an eight-pointed North Star with dark and light blue fields. The common loon remains on the state seal, which is no longer displayed on the flag."

  - question: "What state flag has a pelican on it?"
    answer: "Louisiana's state flag is the only US state flag featuring a pelican. The Louisiana flag shows a brown pelican (*Pelecanus occidentalis*) in the 'pelican in her piety' heraldic pose — standing in a nest, wounding her own breast to feed three chicks with her blood. The design traces to French colonial heraldry and has been Louisiana's symbol since the territorial seal of 1804."

  - question: "What is 'pelican in her piety' on the Louisiana flag?"
    answer: "The 'pelican in her piety' is a heraldic motif dating to medieval European bestiaries, where the pelican was believed to wound her own breast and feed her starving chicks with her blood — a symbol of self-sacrifice and parental devotion. French colonizers applied this symbol to Louisiana in the 18th century. On the Louisiana state flag, three blood drops fall from the pelican's breast explicitly. The phrase 'in her piety' refers to the devotion and sacrifice the image represents."

  - question: "What is the only US state flag with two sides?"
    answer: "Oregon is the only US state flag with two completely different designs on each side. The obverse (front) features the state seal — including a bald eagle — on a navy blue background. The reverse shows only a golden beaver. This makes Oregon the only state where the bird (the eagle) is conditionally present: visible on the front, completely absent on the back."

  - question: "Which US state flags have eagles on them?"
    answer: "Nine US state flags feature a bald eagle: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. Iowa places its eagle on a tricolor; most of the others inherit the eagle through a state seal or coat of arms."

  - question: "How many US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals, either as central symbols or within incorporated state seals. Birds appear on 10 flags. Other examples include California and Missouri with grizzly bears, Wyoming with a bison, Oregon with a reverse-side beaver, and Maine with a moose in its coat of arms."
