    description: "French explorer La Salle claims Louisiana for France. The pelican is already embedded in French colonial heraldry for the region — its association with Louisiana predates American statehood by nearly 130 years."
  - year: "1782"
    description: "The Great Seal of the United States is adopted, placing the bald eagle at the center of American national identity. This design becomes the direct template for eagle imagery on state seals and flags for the next century."
  - year: "1812"
    description: "Louisiana enters the Union as the 18th state, bringing its pelican symbol with it from the colonial and territorial seal. The pelican already appears on the territorial seal adopted in 1804."
  - year: "1868"
    description: "Illinois redesigns its state seal with the bald eagle at center, holding a shield and the state motto ribbon. This eagle becomes the defining image of the Illinois state flag."
  - year: "1901"
    description: "New York officially adopts its state flag, displaying the state coat of arms with a bald eagle crest atop a globe."
  - year: "1907"
    description: "Pennsylvania adopts its state flag, featuring the state coat of arms with a bald eagle as crest."
  - year: "1911"
    description: "Michigan and North Dakota adopt their state flags. North Dakota's eagle design is modeled on the regimental colors of the First North Dakota Infantry, which drew directly from the Great Seal."
  - year: "1912"
    description: "Louisiana officially adopts its state flag with the pelican-in-her-piety design on a blue field. The pelican feeds three chicks in a nest above the state motto ribbon."
  - year: "1921"
    description: "Iowa adopts its vertical tricolor flag with a bald eagle on the white center stripe — the only eagle-flag state to place the bird outside of a state seal."
  - year: "1925"
    description: "Oregon adopts its state flag. The obverse (front) features the state seal with a bald eagle; the reverse shows only a beaver, making Oregon the only two-sided state flag."
  - year: "2024"
    description: "Minnesota adopts a redesigned flag replacing its seal-on-blue design. The new flag features a North Star and no bird imagery. The common loon remains on the state seal only."

expert_quote:
  text: "The pelican-in-her-piety is one of the few heraldic symbols that survived intact from medieval European bestiaries into American state government. French colonizers brought it to Louisiana in the 18th century; Louisiana kept it through territorial status, statehood, and two centuries of flag revisions. No other US state inherited its flag bird from a pre-American empire."
  source: "Louisiana Secretary of State — State Symbols"


