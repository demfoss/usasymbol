sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "Interactive Map: US State Flags with Birds"
    paragraphs:
      - "The map below pinpoints all nine US states whose flags feature a bird — charting the geographic spread of avian symbolism across American vexillology, from the Great Lakes to the Gulf Coast."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "Quick Reference Table: All 9 States Featuring Birds"
    paragraphs:
      - "The table below covers all nine bird-flag states at a glance — species, placement, and year adopted — so you can instantly compare Louisiana's pelican against the eight bald eagle designs."

  - id: louisiana-pelican-flag
    icon: "fa-solid fa-dove"
    img: louisiana-pelican-detail
    title: "The Only US State Flag with a Pelican"
    paragraphs:
      - "Louisiana is the only US state whose flag features a bird other than the bald eagle. That bird is the **brown pelican** (*Pelecanus occidentalis*), rendered in the heraldic pose known as **'pelican in her piety'**: the mother pelican stands in her nest, wings spread, wounding her own breast to feed three chicks below her with her blood. The three drops falling from her breast appear explicitly on the flag."
      - "The symbolism is medieval in origin — European heraldry used the pelican-in-her-piety as a representation of self-sacrifice, parental devotion, and Christian charity. Louisiana inherited this image from French colonial tradition, where the pelican was already associated with the territory long before American statehood. The design appears on the territorial seal of 1804 and migrated to the official state flag when Louisiana formally adopted it in 1912."
    subsections:
      - subtitle: "History of the Louisiana State Flag"
        text: "Louisiana's connection to the pelican predates statehood by over a century. French colonial administrators embedded the pelican-in-her-piety in the region's heraldry during the 18th century. When Louisiana entered the Union in 1812 as the 18th state, the pelican came with it. The territorial seal adopted in 1804 already bore the image. Louisiana officially adopted its [pelican in her piety flag](/states/louisiana/flag/louisiana-state-flag) in 1912, standardized in 2010. Its bird is unique, its heraldic pose is ancient, and its symbolism cuts deeper than simple patriotism."

  - id: eagle-flags-group-1
    icon: "fa-solid fa-feather"
    title: "US State Flags Featuring the Bald Eagle"
    paragraphs:
      - "Eight US state flags feature the **bald eagle** (*Haliaeetus leucocephalus*). All eight arrived at the eagle the same way: a state seal drawn from the **Great Seal of the United States**, adopted decades later as a state flag. For each eagle flag in detail, see [US state flags with eagles](/collections/flags/states-with-eagles-on-the-flag)."
    subsections:
      - subtitle: "Illinois"
        text: "The **Illinois state flag** places the **state seal** on a white background, with the bald eagle perched on a boulder at center — wings raised, clutching a **shield** bearing thirteen stars and stripes, and a ribbon in its beak reading *State Sovereignty, National Union*. The white field and prominent eagle make Illinois one of the most recognizable seal-flag designs in the country. The word 'ILLINOIS' was added in 1970 after a Vietnam War-era petition. See the full [Illinois bald eagle flag history](/states/illinois/flag/illinois-state-flag) for the complete design story."
      - subtitle: "Iowa"
        text: "The **Iowa state flag** is a vertical **tricolor** of blue, white, and red — a nod to Iowa's French territorial heritage. On the white center stripe, a **bald eagle** soars with wings spread, carrying a blue ribbon in its beak with the state motto: *Our Liberties We Prize and Our Rights We Will Maintain*. Iowa is the only eagle-flag state where the bird flies freely on the flag rather than within a **state seal** or **coat of arms**. See the [Iowa tricolor eagle flag](/states/iowa/flag/iowa-state-flag) for the full design history."
      - subtitle: "Michigan"
        text: "Michigan's flag displays the **state coat of arms** on a dark blue field, with the bald eagle as the **crest** at the apex — wings spread, holding an **olive branch** and a **bundle of arrows** that mirror the Great Seal. The central shield shows a man on a peninsula pointing toward the sunrise, flanked by an elk and a moose as shield-holders. Michigan is the only US state flag with three distinct animals: eagle, elk, and moose. See the [Michigan state flag](/states/michigan/flag/michigan-state-flag)."

  - id: eagle-flags-group-2
    icon: "fa-solid fa-shield"
    title: "New York, North Dakota & Pennsylvania"
    paragraphs:
      - "Three of the eight eagle-flag states place the bird in prominent heraldic positions — as a crest above a coat of arms or as the dominant element of the entire flag. Each eagle carries distinct national symbolism rooted in the founding era."
    subsections:
      - subtitle: "New York"
        text: "New York's flag centers the **state coat of arms** on a deep blue field. The bald eagle serves as the **crest**, perched atop a globe representing the Western Hemisphere with wings fully spread — one of the most architecturally elaborate eagle placements on any state flag. The coat of arms dates to 1778, making New York's eagle one of the oldest in continuous American state heraldry. Full design history on the [New York state flag with eagle crest](/states/new-york/flag/new-york-state-flag)."
      - subtitle: "North Dakota"
        text: "North Dakota's flag is the most eagle-dominated of all 50 states — the **bald eagle** fills the entire design, modeled directly on the regimental colors of the First North Dakota Infantry from the Spanish-American War. The eagle holds an **olive branch and arrows**, carries a **shield** of thirteen stripes, and grips a ribbon reading **'E Pluribus Unum'** — an almost exact reproduction of the **national emblem**. The [North Dakota Great Seal eagle flag](/states/north-dakota/flag/north-dakota-state-flag) is less a state seal flag and more a declaration of pure American patriotism."
      - subtitle: "Pennsylvania"
        text: "Pennsylvania's flag displays the **state coat of arms** on a deep blue field, with the bald eagle as the **crest** at the very top — wings spread above two horses that serve as shield-holders. The coat of arms dates to 1778, and the flag was formally adopted in 1907. Pennsylvania's eagle crest reflects the same founding-era heraldic conventions that shaped the Great Seal just four years after the coat of arms was first designed. See the [Pennsylvania state flag and coat of arms](/states/pennsylvania/flag/pennsylvania-state-flag)."

  - id: eagle-flags-utah-oregon
    icon: "fa-solid fa-arrows-rotate"
    img: iowa-eagle-detail
    title: "Utah & Oregon"
    paragraphs:
      - "Utah and Oregon round out the eight eagle-flag states with two of the most distinctive stories — one involving a beehive, the other involving a flag with two completely different faces."
    subsections:
      - subtitle: "Utah"
        text: "Utah's flag features the **state seal** at center on a blue field, with a bald eagle positioned above the state's iconic **beehive** — wings spread, representing federal protection over the state. The beehive below symbolizes Utah's pioneer spirit of industry and cooperation. The flag was adopted in 1913 and standardized in 2011. The eagle and beehive together capture the balance between national allegiance and local pioneer identity. Full history on the [Utah Beehive State flag with eagle](/states/utah/flag/utah-state-flag)."
      - subtitle: "Oregon"
        text: "Oregon's flag is the only US state flag with two completely different designs on each side. The **obverse side** (front) shows the state seal on a navy blue background, with a bald eagle perched at the top of the shield — wings spread above a panorama of mountains, ocean, and a covered wagon. Turn the flag over and the eagle vanishes: the **reverse side** shows only a golden beaver. Oregon's eagle exists exclusively on the **obverse side state seal**, making it the most conditional bird on any US state flag. The full two-sided story is documented on the [Oregon two-sided state flag](/states/oregon/flag/oregon-state-flag)."

  - id: territories-bird-flags
    icon: "fa-solid fa-globe-americas"
    title: "US Territories with Bird Flags (Bonus)"
    paragraphs:
      - "Beyond the 50 states, two US territories feature birds prominently on their official flags — both choose the bald eagle, adapted to reflect local identity."
    subsections:
      - subtitle: "American Samoa"
        text: "American Samoa's flag features a **bald eagle** in flight across a red and blue background, holding a **war club** (*uatogi*) and a **fly whisk** (*fue*) — traditional Samoan objects — in its talons rather than the standard Great Seal arrows and olive branch. The substitution transforms the national emblem into a bicultural symbol, blending Polynesian tradition with American sovereignty. Adopted in 1960, it is one of the most culturally layered bird flags in the American system."
      - subtitle: "US Virgin Islands"
        text: "The US Virgin Islands flag shows a simplified **US coat of arms** eagle on a white background: a golden bald eagle holding a laurel branch and three arrows, flanked by the yellow letters **'V'** and **'I'**. Adopted in 1921 — just four years after the United States purchased the islands from Denmark — the eagle design is a deliberate statement of American territorial identity, rendered in the cleanest possible heraldic form."

  - id: why-birds-on-flags
    icon: "fa-solid fa-landmark"
    title: "Why Do State Flags Feature Birds?"
    paragraphs:
      - "The short answer is **state seals**. Nearly every bird on a US state flag arrived there through a state seal designed long before the flag itself. States drafted their seals in the late 18th and early 19th centuries, drawing heavily from the **Great Seal of the United States** (1782) for patriotic alignment. The bald eagle dominated that conversation — eight states embedded it in their seals, and when those states eventually adopted official flags, the eagle migrated from seal to flag by convention."
      - "Louisiana took a different path. Its **pelican-in-her-piety** came from French colonial heraldry — already embedded in Louisiana's official imagery by 1804, eight years before statehood. The pelican was not modeled on the national emblem. It was a pre-existing local symbol from a different imperial tradition entirely, which is why the Louisiana flag reads differently from every other bird flag in the country: the design logic is medieval European, not American founding-era. For a broader look at wildlife symbolism on state flags, see [US state flags with bears](/collections/flags/states-with-bears-on-the-flag)."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Bird Flags"
    facts:
      - "9 of 50 US state flags feature birds — 8 bald eagles and 1 brown pelican"
      - "Louisiana is the only state whose flag features a bird other than the bald eagle"
      - "The pelican-in-her-piety on Louisiana's flag traces to French colonial heraldry, predating American statehood by over a century"
      - "North Dakota's eagle is almost identical to the Great Seal of the United States"
      - "Oregon's eagle is visible only on the obverse (front) of its two-sided flag"
      - "Iowa's eagle is the only bird-flag eagle not enclosed within a state seal — it flies on a tricolor"
      - "The 2024 Minnesota flag redesign removed all bird imagery from the flag; the loon is now only on the state seal"
      - "The bald eagle was chosen as the US national emblem in 1782 because it is native only to North America"
      - "The pelican-in-her-piety heraldic motif originates in medieval bestiaries, where the pelican was believed to feed her young with her own blood"


faq:
  - question: "How many US state flags have birds on them?"
    answer: "Exactly 9 US state flags feature birds: Illinois, Iowa, Louisiana, Michigan, New York, North Dakota, Oregon, Pennsylvania, and Utah. Eight of the nine feature the bald eagle. Louisiana is the only US state flag with a different bird — the brown pelican, depicted in the heraldic 'pelican in her piety' pose."

  - question: "What is the most common bird on US state flags?"
    answer: "The bald eagle is by far the most common bird on US state flags, appearing on 8 of the 9 bird-flag states: Illinois, Iowa, Michigan, New York, North Dakota, Oregon, Pennsylvania, and Utah. The bald eagle has been the US national emblem since 1782, and its prevalence on state flags reflects its deep roots in American state seal design traditions."

  - question: "Does the new 2024 Minnesota flag have a loon on it?"
    answer: "No. Minnesota's redesigned 2024 flag does not feature a bird of any kind. The new design centers on a stylized eight-pointed North Star on a dark blue background with a light blue accent — inspired by the Ojibwe star quilt pattern. The common loon (Minnesota's state bird) appears only on the state seal, which is no longer displayed on the new flag. During the 2023 redesign process, a proposed design nicknamed the 'Laser Loon' — featuring a loon with a dramatic ray of light — went viral and was widely debated, but it was never officially adopted. The loon did not make it onto the final 2024 flag."

  - question: "What state flag has a pelican on it?"
    answer: "Louisiana's state flag is the only US state flag featuring a pelican. The Louisiana flag shows a brown pelican (*Pelecanus occidentalis*) in the 'pelican in her piety' heraldic pose — standing in a nest, wounding her own breast to feed three chicks with her blood. The design traces to French colonial heraldry and has been Louisiana's symbol since the territorial seal of 1804."

  - question: "What is 'pelican in her piety' on the Louisiana flag?"
    answer: "The 'pelican in her piety' is a heraldic motif dating to medieval European bestiaries, where the pelican was believed to wound her own breast and feed her starving chicks with her blood — a symbol of self-sacrifice and parental devotion. French colonizers applied this symbol to Louisiana in the 18th century. On the Louisiana state flag, three blood drops fall from the pelican's breast explicitly. The phrase 'in her piety' refers to the devotion and sacrifice the image represents."

  - question: "What is the only US state flag with two sides?"
    answer: "Oregon is the only US state flag with two completely different designs on each side. The obverse (front) features the state seal — including a bald eagle — on a navy blue background. The reverse shows only a golden beaver. This makes Oregon the only state where the bird (the eagle) is conditionally present: visible on the front, completely absent on the back."

  - question: "Which US state flags have eagles on them?"
    answer: "Eight US state flags feature a bald eagle: Illinois, Iowa, Michigan, New York, North Dakota, Oregon, Pennsylvania, and Utah. Each eagle traces back to a state seal that drew from the Great Seal of the United States, adopted in 1782."

  - question: "How many US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals, as central symbols or within incorporated state seals. Birds are the single most common category — 9 flags. Other notable animal flags: California and Missouri (grizzly bears), Wyoming (American bison), Oregon (beaver, reverse side), Maine (moose in coat of arms). See the full guide to US state flags with animals for the complete list."
