page:
  h1: "Which US States Have Birds on Their Flags?"
  intro_title: "Nine State Flags Feature Birds — Eight Eagles and One Pelican"

  quick_answer:
    - "Exactly 9 US state flags feature birds: Illinois, Iowa, Louisiana, Michigan, New York, North Dakota, Oregon, Pennsylvania, and Utah."
    - "Eight of the nine feature the bald eagle — America's national emblem. Louisiana is the only state with a different bird: the brown pelican."
    - "Oregon's eagle appears only on the obverse (front) side of its two-sided flag — the reverse shows only a beaver."
    - "The Minnesota state flag redesigned in 2024 does NOT feature a bird. The loon appears only on the state seal, not on the new flag."

  methodology: >
    Sources include official state flag statutes, the Congressional Research Service report on the Great Seal,
    and North American Vexillological Association (NAVA) vexillological archives. Each of the 50 US state flags
    was examined individually for bird imagery, whether as a standalone design element or embedded within a state seal.

  sources:
    - name: "Congressional Research Service — The Great Seal of the United States"
      url: "https://crsreports.congress.gov/product/pdf/RL/98-4"
    - name: "North American Vexillological Association (NAVA)"
      url: "https://nava.org/"
    - name: "Louisiana Secretary of State — State Symbols"
      url: "https://www.sos.la.gov/HistoricalResources/AboutLouisiana/Pages/default.aspx"
    - name: "Oregon Blue Book — State Flag"
      url: "https://sos.oregon.gov/blue-book/Pages/state/symbols/flag.aspx"
    - name: "Minnesota Secretary of State — New State Flag"
      url: "https://www.sos.mn.gov/about-minnesota/state-symbols/state-flag/"


