page:
  h1: "Oldest and Newest U.S. State Flags"
  intro_title: "A Timeline That Separates Design Age From Legal Dates"

  quick_answer:
    - "Minnesota has the newest U.S. state flag. Its blue design with an eight-pointed North Star became official on May 11, 2024."
    - "Utah's beehive flag took effect on March 9, 2024, and Mississippi's New Magnolia flag became law on January 11, 2021. Those are the next two newest complete replacements."
    - "Texas begins the oldest current design lineage in 1839, but its legal history includes a statutory gap from 1879 to 1933. Hawaii's present version has a clearer documented line from 1845 through kingdom, republic, territory, and state."

  methodology: "Design lineage means the earliest year in which the recognizable basis of today's design obtained official flag status. A proposal, contest selection, or referendum does not start the lineage until the design legally becomes the official flag. Latest milestone records a later change that affected wording, artwork, proportions, colors, reverse design, or legal status. Mere code renumbering is excluded, and a later specification date does not automatically erase an older design lineage."

  sources:
    - name: "National Conference of State Legislatures, Flags Across America"
      url: "https://www.ncsl.org/resources/map-monday-flags-across-america"
      description: "Current national overview of early state flag lineages and the 2024 redesigns"
    - name: "U.S. Senate, Flags of the States and Territories"
      url: "https://www.govinfo.gov/content/pkg/CDOC-105sdoc13/pdf/CDOC-105sdoc13.pdf"
      description: "Federal compilation used as a historical baseline for state flag adoption records"
    - name: "Minnesota Secretary of State, State Flag"
      url: "https://www.sos.mn.gov/about-minnesota/state-symbols/state-flag/"
      description: "Official design history and May 11, 2024 adoption date"
    - name: "Utah Online Public Library, State Flag"
      url: "https://onlinelibrary.utah.gov/state-symbol/flag/"
      description: "Official state-symbol record for the March 9, 2024 effective date"
    - name: "Mississippi Secretary of State, Official and Statistical Register"
      url: "https://www.sos.ms.gov/content/documents/ed_pubs/pubs/BlueBook20-24/1%20General%20Info%20Section.pdf"
      description: "Official account of the New Magnolia vote and January 11, 2021 law"
    - name: "Texas State Library, State Flag Description"
      url: "https://www.tsl.texas.gov/ref/abouttx/flagdes"
      description: "Official identification of the state flag as the Republic of Texas design adopted in 1839"
