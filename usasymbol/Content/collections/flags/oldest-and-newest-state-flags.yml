sections:
  - id: "oldest-and-newest-flag-spotlights"
    icon: "fa-solid fa-clock-rotate-left"
    style: "law-cards"
    title: "Oldest and Newest State Flag Designs"
    paragraphs:
      - "The six boundary cases show why a single adoption-year column can mislead. Three trace the oldest surviving design lineages, while three are complete replacements adopted since 2021."
    subsections:
      - subtitle: "Texas"
        text: |
          **Design lineage:** January 25, 1839
          **Legal caution:** Statutory gap, 1879 to 1933

          The Republic of Texas approved the Lone Star flag in 1839, and the same composition later became the state banner. A broad 1879 repeal omitted the flag law until Texas enacted a new flag code in 1933.

          Texas starts the oldest current design lineage, but calling its official status continuously unbroken would hide that statutory gap. The record belongs to the design, not to uninterrupted codification.

      - subtitle: "Hawaii"
        text: |
          **Current version since:** 1845
          **Governments represented:** Five

          Hawaii's Legislature states that the current version was adopted in 1845 and retained by the Kingdom, Provisional Government, Republic, Territory, and State of Hawaii. Its eight stripes and Union Jack survived each political transition.

          Hawaii provides the cleanest early continuity claim because an official legislative record follows the same version across all five governments. It is the second-oldest current state flag lineage after Texas.

      - subtitle: "South Carolina"
        text: |
          **Current configuration since:** January 28, 1861
          **Older source design:** 1775

          South Carolina added a palmetto tree to William Moultrie's Revolutionary-era crescent banner and adopted the resulting configuration in 1861. The older military symbolism does not make the current flag a 1775 adoption.

          South Carolina belongs among the oldest current designs because the crescent-and-palmetto combination dates to 1861. Separating inspiration from adoption keeps the Revolutionary origin from inflating the flag's official age.

      - subtitle: "Mississippi"
        text: |
          **Current flag since:** January 11, 2021
          **Public vote:** November 3, 2020

          Mississippi voters approved the New Magnolia proposal in 2020, and Governor Tate Reeves signed House Bill 1 on January 11, 2021. The law replaced the retired 1894 flag with a new magnolia-centered design.

          Mississippi is the third-newest complete state flag replacement. Its 2021 legal date, rather than the 2020 referendum or the commission's selection date, controls this timeline.

      - subtitle: "Utah"
        text: |
          **Current flag since:** March 9, 2024
          **Historic flag retained:** Yes

          Utah approved the beehive design in 2023, but the law delayed its effect until State Flag Day on March 9, 2024. The former seal-on-blue banner remains legally designated as Utah's historic state flag.

          Utah held the newest-state-flag title for 63 days. Its position is based on the effective date, not the governor's 2023 signature date.

      - subtitle: "Minnesota"
        text: |
          **Current flag since:** May 11, 2024
          **Status:** Newest U.S. state flag

          Minnesota's State Emblems Redesign Commission selected the North Star design in December 2023. State law made the new emblem official on May 11, 2024, when it was first raised over the Capitol.

          Minnesota belongs at the newest end because no state has adopted a replacement after that date. Its effective date came 63 days after Utah's new flag took effect.

  - id: "how-state-flag-adoption-dates-work"
    icon: "fa-solid fa-scale-balanced"
    title: "How State Flag Adoption Dates Work"
    paragraphs:
      - "Original design dates answer who first created or used the recognizable composition. Adoption dates mark legislative or governmental approval. Current-form dates move forward only when a later change alters what appears on the flag, such as Illinois adding its name in 1970 or New York adding E Pluribus Unum in 2020."
      - "Specification dates can change proportions, colors, or official artwork without replacing the design family. Colorado therefore retains a 1911 lineage even though lawmakers fixed its final proportions in 1964. Texas presents a different issue: its 1839 design survived, but its explicit statutory status did not remain continuous."

faq:
  - question: "Which U.S. state has the newest flag?"
    answer: "Minnesota. Its current flag became official on May 11, 2024, and was raised over the State Capitol that morning. Utah's new flag took effect on March 9 of the same year."

  - question: "Which U.S. state has the oldest flag?"
    answer: "Texas has the oldest current design lineage, beginning with the Republic of Texas flag approved on January 25, 1839. Its legal status was not perfectly continuous because an 1879 statutory repeal omitted the flag law until 1933."

  - question: "Is Hawaii's flag older than the Texas flag?"
    answer: "No. Texas adopted the Lone Star design in 1839, while Hawaii's Legislature dates the current Hawaiian version to 1845. Hawaii has the clearer continuity record because the same version served the kingdom, provisional government, republic, territory, and state."

  - question: "Why are Utah and Minnesota both listed as 2024 flags?"
    answer: "Both designs became official in 2024, but on different dates. Utah's flag took effect March 9. Minnesota's followed on May 11, making Minnesota's design newer by 63 days."

  - question: "Was Mississippi's new flag adopted in 2020 or 2021?"
    answer: "Mississippi voters approved the design on November 3, 2020. The legislature then codified it, and Governor Tate Reeves signed the bill on January 11, 2021. This page uses the 2021 legal adoption date."

  - question: "Does a new seal make a state flag new?"
    answer: "A seal change can alter the visible flag without replacing its overall format. New York's 2020 motto addition is recorded as a design milestone, while the blue coat-of-arms flag keeps its 1901 lineage. The table reports both dates instead of forcing one answer."

