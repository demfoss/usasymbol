sections:
  - id: "red-white-blue-only-flags"
    icon: "fa-solid fa-palette"
    style: "law-cards"
    title: "State Flags Built From Three Colors Only"
    paragraphs:
      - "Each of these seven flags earns its place by avoiding a fourth color entirely, including gold seal outlines, green foliage, or metallic accents common on other state flags."
    subsections:
      - id: "texas"
        subtitle: "Texas"
        text: |-
          **Colors:** Blue, white, red
          **Design:** Lone Star on a tricolor field

          Texas divides its field into a blue vertical band holding one white star, with a white and red horizontal bar filling the rest of the flag. Adopted in 1839, the design has never added a seal, a second star, or any additional color.

          Texas belongs at the top of this list because its palette matches the national flag exactly, with no artwork inside the star to introduce a stray color.
      - id: "tennessee"
        subtitle: "Tennessee"
        text: |-
          **Colors:** Red, white, blue
          **Design:** Three stars in a blue circle

          Tennessee's red field holds a blue circle outlined in white, containing three white five-pointed stars for the state's three grand divisions. A blue bar with a thin white edge runs along the fly side.

          Tennessee qualifies because its 1905 design uses geometric shapes rather than a seal, leaving no surface where a fourth color could appear.
      - id: "hawaii"
        subtitle: "Hawaii"
        text: |-
          **Colors:** White, red, blue
          **Design:** Eight stripes and a Union Jack canton

          Hawaii repeats white, red, and blue across eight horizontal stripes representing its main islands, with the British Union Jack placed as a canton in the upper corner. The Union Jack itself is built from the same three colors.

          Hawaii makes the list because even its borrowed foreign emblem stays within the same three-color rule as the rest of the flag.
      - id: "ohio"
        subtitle: "Ohio"
        text: |-
          **Colors:** Red, white, blue
          **Design:** Swallowtail burgee with 17 stars

          Ohio's burgee-shaped flag places three red and two white stripes behind a blue triangular field holding 17 white stars, one for Ohio's rank as the 17th state. Cleveland architect John Eisenmann designed it in 1901.

          Ohio stays on this list because its unusual swallowtail shape carries no seal or lettering, only stripes, a triangle, and stars in the three permitted colors.

  - id: "flags-that-almost-qualify"
    icon: "fa-solid fa-circle-xmark"
    title: "Flags That Look Red, White, and Blue but Are Not"
    paragraphs:
      - "Several flags read as red, white, and blue from a distance but fail this test on close inspection. Mississippi's New Magnolia flag adds a gold star representing Native Americans alongside its red, white, and blue fields."
      - "North Carolina's state colors are officially defined as red and blue, but the flag itself renders the star and the letters N and C in gold, not white. Wyoming stays qualified only because its bison and seal use white and blue, without the gold tassels sometimes attached to the physical flagpole."
      - "Any seal-on-blue flag with a detailed emblem, such as Kansas or Nebraska, typically fails immediately, since state seals almost always include landscape colors like green or brown."

  - id: "red-white-blue-flag-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About Three-Color State Flags"
    facts:
      - "Seven of 50 current state flags use only red, white, and blue in their official design."
      - "Hawaii is the only state flag in this group that includes another country's flag, the British Union Jack, within its own three-color palette."
      - "Ohio is the only U.S. state flag shaped as a swallowtail burgee rather than a rectangle."
      - "Arkansas is the only flag on this list where the state's name is spelled out, in blue lettering inside the white diamond."
      - "Mississippi's flag nearly qualifies but is disqualified by one gold star representing Native American heritage."

faq:
  - question: "Which state flags use only red, white, and blue?"
    answer: "Seven current state flags use only these three colors: Arkansas, Hawaii, Iowa, Ohio, Tennessee, Texas, and Wyoming. No other color appears anywhere in their official designs."
  - question: "Does Mississippi's flag count as red, white, and blue only?"
    answer: "No. Mississippi's New Magnolia flag uses red, white, and blue as its base colors but also includes one gold star representing Native Americans, which disqualifies it from this list."
  - question: "Is the Texas flag the same colors as the U.S. flag?"
    answer: "Yes. The Texas flag uses the same red, white, and blue as the national flag, arranged as one white star on a blue field beside white and red horizontal bars."
  - question: "Why doesn't North Carolina's flag qualify as red, white, and blue only?"
    answer: "North Carolina's official state colors are red and blue, but the flag itself renders its star and initials N and C in gold rather than white, which adds a fourth color to the design."
  - question: "Is Hawaii's flag really only three colors if it has a British flag on it?"
    answer: "Yes. The Union Jack canton on Hawaii's flag is itself built from red, white, and blue, so including it does not introduce a new color to the overall design."
  - question: "Do seal-on-blue state flags ever use only red, white, and blue?"
    answer: "Rarely. Most state seals depict landscapes, tools, or wildlife that require additional colors such as green or brown, which is why detailed seal flags like Kansas and Nebraska are not on this list."

