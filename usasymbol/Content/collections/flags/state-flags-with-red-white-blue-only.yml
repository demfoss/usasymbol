page:
  h1: "Which State Flags Use Only Red, White, and Blue?"
  intro_title: "The Seven State Flags With No Fourth Color"

  quick_answer:
    - "Seven current state flags use only red, white, and blue, with no gold, green, black, or other colors anywhere in the design: Arkansas, Hawaii, Iowa, Ohio, Tennessee, Texas, and Wyoming."
    - "Texas keeps the palette to a single star and two stripes. Hawaii repeats the same three colors in eight stripes plus a Union Jack canton that is itself red, white, and blue."
    - "Many flags that look tricolor at a glance fail this test. Mississippi's magnolia flag adds a gold star, and North Carolina's star and initials are rendered in gold, disqualifying both."

  methodology: "A flag qualifies only if its official design description and artwork contain exclusively red, white, and blue, with all three colors present. A single gold outline, seal detail, or metallic accent removes a flag from the list, even if red, white, and blue dominate the design."

