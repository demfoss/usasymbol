sections:
  - id: "newest-state-flag-spotlights"
    icon: "fa-solid fa-flag"
    style: "law-cards"
    title: "The Newest State Flags, Newest First"
    paragraphs:
      - "Three states have replaced their entire flag design since 2020, and a fourth adopted its current flag in 2003 after decades without a change. Each entry lists the exact date its flag became legally official."
    subsections:
      - id: "minnesota"
        subtitle: "Minnesota"
        text: |-
          **Official since:** May 11, 2024
          **Status:** Newest U.S. state flag

          Minnesota's State Emblems Redesign Commission reviewed 2,128 public submissions and adapted 24-year-old designer Andrew Prekker's concept for the final flag. The design places a white eight-pointed North Star on a dark blue shape representing the state, beside a light blue field for its waters.

          Minnesota holds the newest-flag title because no state has adopted a full redesign since May 2024. It replaced a seal-based banner in use since 1957 that was difficult to recognize from a distance.
        anchor_phrases:
          - "newest U.S. state flag"
      - id: "utah"
        subtitle: "Utah"
        text: |-
          **Official since:** March 9, 2024
          **Signed into law:** March 21, 2023

          Governor Spencer Cox signed Senate Bill 31 in 2023, and the new beehive design took effect on State Flag Day, March 9, 2024. A gold beehive sits beneath a white mountain peak on blue, white, and red fields, while the former seal-based flag remains legally preserved as Utah's historic state flag.

          Utah held the newest-flag title for 63 days before Minnesota's design overtook it. Its executive order also set out how state buildings could fly both the new and historic flags together.
        anchor_phrases:
          - "historic state flag"
      - id: "mississippi"
        subtitle: "Mississippi"
        text: |-
          **Official since:** January 11, 2021
          **Public vote:** November 3, 2020

          Mississippi voters approved the New Magnolia design with about 73% support in a November 2020 referendum, after the state retired its 1894 flag that July. Governor Tate Reeves signed House Bill 1 into law on January 11, 2021, and the flag was raised at the State Capitol that same day.

          Mississippi is the third-newest complete redesign and the only one of the three driven by a statewide public vote rather than a commission's final selection alone.
        anchor_phrases:
          - "New Magnolia design"
      - id: "georgia"
        subtitle: "Georgia"
        text: |-
          **Official since:** May 8, 2003
          **Defining feature:** State arms and 13 stars

          Georgia's current red-white-red flag places the state coat of arms, circled by 13 stars for the original states, inside a blue canton. Lawmakers adopted it in 2003 after two earlier flags in 2001 and the 1956 to 2001 banner drew criticism over Confederate battle flag imagery.

          Georgia belongs on this list as a reminder that full state flag redesigns are rare. Its 2003 flag stood as the most recent full replacement anywhere in the country until Mississippi's vote 17 years later.
        anchor_phrases:
          - "state coat of arms"

  - id: "how-the-newest-flags-compare"
    icon: "fa-solid fa-scale-balanced"
    title: "How the Three Newest State Flags Compare"
    paragraphs:
      - "All three 2020s redesigns replaced flags criticized on the same two grounds: Mississippi's carried a disputed Confederate emblem, while Utah's and Minnesota's earlier flags reproduced detailed state seals that lost their shape at a distance."
      - "Adoption paths differed. Mississippi required a statewide referendum after a commission narrowed the field, Utah's legislature enacted a design directly, and Minnesota's statutory commission held final authority to select and adjust the winning submission."
      - "Each new flag also kept its predecessor on the books in some form. Mississippi's 1894 banner was fully retired, but Utah's former seal flag remains the designated historic state flag, available for official and ceremonial use."

  - id: "newest-state-flag-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About the Newest State Flags"
    facts:
      - "Minnesota's flag became official 63 days after Utah's, making the two flags the closest pair of redesigns in U.S. history."
      - "Mississippi's flag commission narrowed nearly 3,000 public submissions down to five finalists before the statewide vote."
      - "Minnesota's winning design came from a 24-year-old graphic designer, Andrew Prekker, chosen from 2,128 public entries."
      - "Utah's new flag law also created a legal status for the historic state flag, so the former design stays in official use."
      - "Georgia's 2003 flag was the country's only full state flag redesign for 17 years, until Mississippi's 2020 vote."

faq:
  - question: "What is the newest U.S. state flag?"
    answer: "Minnesota has the newest state flag. Its North Star design became official on May 11, 2024, when it was raised over the State Capitol."
  - question: "Is Utah's flag older or newer than Minnesota's?"
    answer: "Utah's beehive flag is older by 63 days. It took effect on March 9, 2024, while Minnesota's flag became official on May 11, 2024."
  - question: "When did Mississippi get its new flag?"
    answer: "Mississippi's New Magnolia flag became law on January 11, 2021, after voters approved it in a November 2020 referendum with about 73% support."
  - question: "What was the last state flag redesign before 2020?"
    answer: "Georgia adopted its current red-white-red flag with the state arms and 13 stars in 2003. No other state fully redesigned its flag again until Mississippi's 2020 referendum."
  - question: "Why did Minnesota and Utah replace their flags so close together?"
    answer: "Both states ran separate redesign processes that happened to finish in the same year. Utah's legislature enacted its design in 2023 with a 2024 effective date, while Minnesota's commission finalized its design in December 2023, also taking effect in 2024."
  - question: "Does Utah still use its old flag?"
    answer: "Yes. Utah's 2023 law preserved the former seal-based banner as the state's historic flag, so it remains legally recognized alongside the newer beehive design."

