page:
  h1: "What Is the Newest U.S. State Flag?"
  intro_title: "The Three Newest State Flag Designs"

  quick_answer:
    - "Minnesota has the newest U.S. state flag. Its North Star design became official on May 11, 2024, replacing a seal-based banner used since 1957."
    - "Utah's beehive flag took effect 63 days earlier, on March 9, 2024, after Governor Spencer Cox signed Senate Bill 31 in 2023."
    - "Mississippi's New Magnolia flag is the third newest, signed into law on January 11, 2021, after voters approved it in a November 2020 referendum."

  methodology: "Ranking uses each flag's legal effective date, not the date a design was selected, signed, or approved by a commission. A state qualifies as newest only after its redesigned flag became the official flag in law, not merely a finalist or proposal."

