faq:
  - question: "Which US state flag has a sun on it?"
    answer: "Three US state flags prominently feature sun imagery: New Mexico (Zia Pueblo sun symbol — a red circle with four groups of four rays on gold), Arizona (13 alternating red and gold sun rays around a copper star), and South Dakota (gold sunburst surrounding the state seal on a sky-blue field). New Mexico's Zia symbol is the most distinctive and most recognized sun flag in the US."

  - question: "What is the Zia symbol on New Mexico's flag?"
    answer: "The Zia symbol is a sacred symbol of the Zia Pueblo people of New Mexico. It shows a central circle with four groups of four rays (16 total), representing four sacred obligations: the four cardinal directions, four seasons, four stages of life, and four times of day. New Mexico adopted it as the state flag symbol in 1925. The Zia Pueblo consider the symbol sacred and have asked that it be used with cultural respect."

  - question: "What do the rays on the Arizona flag mean?"
    answer: "Arizona's flag has 13 alternating red and gold rays radiating from a copper star. The 13 rays represent the 13 original colonies. The colors echo the setting desert sun. The copper star at center represents Arizona's copper mining industry — Arizona is the largest copper-producing state in the US."

  - question: "Why does South Dakota's flag have a sunburst?"
    answer: "South Dakota's gold sunburst reflects the state's historical nickname 'The Sunshine State of America.' The sunburst was added as a distinctive design element to differentiate South Dakota's flag from other plain seal-on-blue state flags. The current design, including the sunburst, was adopted in 1992."
