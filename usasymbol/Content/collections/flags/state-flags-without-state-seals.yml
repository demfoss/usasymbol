sections:
  - id: independent-state-flag-designs
    icon: "fa-solid fa-shapes"
    style: "law-cards"
    title: "State Flags With Independent Designs"
    highlights:
      - name: "Alabama"
        image: "/images/flags/alabama/flag.webp"
        description: "Alabama specifies a crimson cross of St. Andrew on white. The geometric saltire is the flag's complete device, so no state seal appears."
      - name: "Alaska"
        image: "/images/flags/alaska/flag.webp"
        description: "Alaska places the Big Dipper and North Star on dark blue. Benny Benson's constellation design qualifies because it is separate from the territorial imagery retained in the state seal."
      - name: "Arizona"
        image: "/images/flags/arizona/flag.webp"
        description: "Arizona combines 13 red and gold rays with a copper-colored star and a blue lower field. Those large geometric elements form an independent flag design rather than a seal reproduction."
      - name: "Arkansas"
        image: "/images/flags/arkansas/flag.webp"
        description: "Arkansas uses a white diamond, blue border, stars, and the state name. The diamond composition was created for the flag and does not reproduce the official seal."
      - name: "California"
        image: "/images/flags/california/flag.webp"
        description: "California's Bear Flag shows a grizzly, one red star, a red stripe, and the words California Republic. Its historic banner design is independent of the state seal."
      - name: "Colorado"
        image: "/images/flags/colorado/flag.webp"
        description: "Colorado centers a gold disc inside a red letter C across blue and white stripes. The letterform and color fields replace any need for a seal."
      - name: "Hawaii"
        image: "/images/flags/hawaii/flag.webp"
        description: "Hawaii combines the Union Jack with eight horizontal stripes for the main islands. The former kingdom's banner remained the state flag without adding a state seal."
      - name: "Indiana"
        image: "/images/flags/indiana/flag.webp"
        description: "Indiana uses a gold torch surrounded by 19 stars on blue. Paul Hadley's competition design was made as a flag and contains no seal."
      - name: "Iowa"
        image: "/images/flags/iowa/flag.webp"
        description: "Iowa uses a blue, white, and red vertical tricolor with an eagle carrying a motto ribbon. The composition is a separate flag design, not the Iowa seal."
      - name: "Minnesota"
        image: "/images/flags/minnesota/flag.webp"
        description: "Minnesota's eight-pointed North Star sits on a dark blue state-shaped field beside light blue. The design became official on May 11, 2024 and retired the former seal-bearing flag."
      - name: "Mississippi"
        image: "/images/flags/mississippi/flag.webp"
        description: "Mississippi centers a white magnolia inside a ring of stars and the words In God We Trust. The New Magnolia design became official in 2021 without using the state seal."
      - name: "Nevada"
        image: "/images/flags/nevada/flag.webp"
        description: "Nevada places a silver star, sagebrush wreath, and Battle Born ribbon in the upper hoist. The compact emblem is independently defined for the flag."
      - name: "New Mexico"
        image: "/images/flags/new-mexico/flag.webp"
        description: "New Mexico centers a red Zia sun symbol on yellow. The single-symbol composition is wholly separate from the detailed Great Seal of New Mexico."
      - name: "North Carolina"
        image: "/images/flags/north-carolina/flag.webp"
        description: "North Carolina combines red and white horizontal bars with a blue vertical field carrying a star, initials, and two dates. None of those elements forms the state seal."
      - name: "North Dakota"
        image: "/images/flags/north-dakota/flag.webp"
        description: "North Dakota adapted the eagle device of its Spanish-American War regimental flag. The flag predates and differs from North Dakota's arrowhead-shaped coat of arms and does not display the seal."
      - name: "Ohio"
        image: "/images/flags/ohio/flag.webp"
        description: "Ohio uses a swallowtail burgee with a red disc, white ring, stripes, and 17 stars. Its nonrectangular construction and geometric symbols are independent of the state seal."
      - name: "Oklahoma"
        image: "/images/flags/oklahoma/flag.webp"
        description: "Oklahoma centers an Osage shield crossed by a peace pipe and olive branch on blue. State law specifies that symbolic arrangement as the flag rather than placing the complete seal on the field."
      - name: "Rhode Island"
        image: "/images/flags/rhode-island/flag.webp"
        description: "Rhode Island uses a gold anchor, a blue Hope ribbon, and 13 stars on white. The anchor also appears in state emblems, but the flag does not reproduce the complete seal."
      - name: "South Carolina"
        image: "/images/flags/south-carolina/flag.webp"
        description: "South Carolina pairs a white crescent with a palmetto tree on indigo. Both are standalone flag symbols and neither reproduces either face of the two-sided state seal."
      - name: "Tennessee"
        image: "/images/flags/tennessee/flag.webp"
        description: "Tennessee places three white stars inside a blue disc on red, with a narrow blue bar at the fly. LeRoy Reeves designed the composition specifically as a flag."
      - name: "Texas"
        image: "/images/flags/texas/flag.webp"
        description: "Texas uses one white star in a blue vertical field beside white and red horizontal fields. The Lone Star design is independent of the circular state seal."
      - name: "Utah"
        image: "/images/flags/utah/flag.webp"
        description: "Utah's beehive, mountain, and star design became official on March 9, 2024. The former official flag used the Great Seal, but the current flag does not."

  - id: state-flags-with-coats-of-arms
    icon: "fa-solid fa-shield-halved"
    style: "law-cards"
    title: "State Flags With Coats of Arms Instead of Seals"
    highlights:
      - name: "Connecticut"
        image: "/images/flags/connecticut/flag.webp"
        description: "Connecticut displays the state's armorial bearings, a shield with three grapevines and a motto ribbon. The arms share imagery with the seal but are not the complete state seal."
      - name: "Delaware"
        image: "/images/flags/delaware/flag.webp"
        description: "Delaware law places the state coat of arms inside a buff diamond on colonial blue. The Great Seal contains the arms within its own seal design, but the flag specifies the arms alone."
      - name: "Georgia"
        image: "/images/flags/georgia/flag.webp"
        description: "Georgia places the state coat of arms and 13 stars in a blue canton beside three stripes. The arms are a component shared with the seal, not the complete seal itself."
      - name: "Louisiana"
        image: "/images/flags/louisiana/flag.webp"
        description: "Louisiana law calls the pelican feeding her young the state coat of arms. The state seal uses the same pelican device for authentication, but the flag displays the armorial device and motto without a full seal border."
      - name: "Maine"
        image: "/images/flags/maine/flag.webp"
        description: "Maine law requires the state coat of arms on both sides of a blue flag. The seal is legally distinct even though it is built from the same arms and closely resembles the flag device."
      - name: "Maryland"
        image: "/images/flags/maryland/flag.webp"
        description: "Maryland quarters the heraldic banners of the Calvert and Crossland families. The entire field is armorial, but no Maryland state seal appears on it."
      - name: "Massachusetts"
        image: "/images/flags/massachusetts/flag.webp"
        description: "Massachusetts regulations define the flag as a white field bearing the arms of the Commonwealth. They separately define the seal as those arms inside a circular inscription and beaded border."
      - name: "Michigan"
        image: "/images/flags/michigan/flag.webp"
        description: "Michigan law states that the flag is blue and charged with the arms of the state. The Great Seal adds an outer inscription around those arms, which the flag omits."
      - name: "Missouri"
        image: "/images/flags/missouri/flag.webp"
        description: "Missouri centers its coat of arms within a blue ring of 24 stars over red, white, and blue stripes. The Great Seal adds its own identifying scroll outside the arms."
      - name: "New Jersey"
        image: "/images/flags/new-jersey/flag.webp"
        description: "New Jersey places the state coat of arms on a buff field. The arms provide the flag's central device without reproducing a complete state seal."
      - name: "New York"
        image: "/images/flags/new-york/flag.webp"
        description: "New York officially treats its coat of arms, Great Seal, and state flag as three separate emblems. The flag places the coat of arms on blue rather than showing the Great Seal."
      - name: "Pennsylvania"
        image: "/images/flags/pennsylvania/flag.webp"
        description: "Pennsylvania's official manual identifies the central device as the state coat of arms. The arms sit directly on blue and are not presented as the Great Seal."
      - name: "Vermont"
        image: "/images/flags/vermont/flag.webp"
        description: "Vermont law says the flag shall be blue with the state coat of arms. A separate statute defines the Great Seal as a reproduction of Ira Allen's 1779 seal."
      - name: "West Virginia"
        image: "/images/flags/west-virginia/flag.webp"
        description: "West Virginia displays the state coat of arms between rhododendron branches on white with a blue border. The arms are related to the Great Seal but function as the flag device."
      - name: "Wisconsin"
        image: "/images/flags/wisconsin/flag.webp"
        description: "Wisconsin places its coat of arms between the state name and 1848 on blue. The Great Seal surrounds those arms with a title, 13 stars, and an ornamental border that the flag omits."

  - id: illinois-seal-derived-emblem
    icon: "fa-solid fa-circle-half-stroke"
    style: "law-cards"
    title: "Illinois Uses Part of Its State Seal"
    highlights:
      - name: "Illinois"
        image: "/images/flags/illinois/flag.webp"
        description: "Illinois uses the colored emblem portion of its state seal with the state name below. The complete seal also has an outer inscription and date, so Illinois is classified here as seal-derived rather than as a full-seal flag."

  - id: state-flags-that-use-the-seal
    icon: "fa-solid fa-stamp"
    title: "Which State Flags Do Use the State Seal?"
    paragraphs:
      - "Twelve current state flags use the complete seal or the legally specified state-seal design: Florida, Idaho, Kansas, Kentucky, Montana, Nebraska, New Hampshire, Oregon, South Dakota, Virginia, Washington, and Wyoming. They are excluded from the 38-state table."
      - "Oregon needs special treatment because its two sides differ. The obverse carries the state escutcheon, stars, name, and date that form the state seal design, while the reverse carries a gold beaver. A seal on either official side keeps Oregon out of the no-seal group."
      - "Virginia uses the obverse of its Great Seal, and Wyoming places its Great Seal on a white bison silhouette. A seal does not stop counting merely because the flag adds a background, text, wreath, sun rays, or another surrounding element."

  - id: state-seal-vs-coat-of-arms
    icon: "fa-solid fa-scale-balanced"
    title: "State Seal vs Coat of Arms on a Flag"
    paragraphs:
      - "A coat of arms is a heraldic design made from elements such as a shield, crest, supporters, and motto. A state seal is an official authentication device that may place those same arms inside a circular border with the state's name or another legend."
      - "Visual overlap explains why simple counts often disagree. New York, Massachusetts, Michigan, and Vermont define their arms and seals separately in law, so a flag bearing only the arms is not counted as a full-seal flag here."

faq:
  - question: "How many state flags do not have the state seal?"
    answer: "Thirty-eight current U.S. state flags omit the complete official state seal. That total includes 15 flags with coats of arms or other heraldry, Illinois with only the emblem portion of its seal, and 22 independent symbolic designs."

  - question: "Is a coat of arms the same as a state seal?"
    answer: "No. A coat of arms is a heraldic emblem, while a seal is an official authentication device. A seal can contain the coat of arms inside an identifying border, which makes the two look similar. Massachusetts and Michigan laws explicitly define the seal as the arms plus an outer inscription."

  - question: "Does the Oregon flag have the state seal?"
    answer: "Yes. Oregon's obverse uses the state seal design with its escutcheon, 33 stars, state name, and 1859 date. The reverse shows a beaver, but both sides together make one official flag, so Oregon is not counted as a flag without a seal."

  - question: "Does the Illinois flag use the state seal?"
    answer: "Illinois uses the emblem portion of the state seal, not the complete seal with its outer identifying words and date. This page therefore labels Illinois seal-derived and separates it from both full-seal flags and fully independent designs."

  - question: "Do the new Minnesota and Utah flags have seals?"
    answer: "No. Minnesota's current flag uses an eight-pointed North Star and two blue fields. Utah's uses a beehive, mountains, and a star. Both states retired seal-bearing official flags in 2024, although Utah preserves its former design as the historic state flag."

  - question: "Which state flags use coats of arms instead of seals?"
    answer: "Connecticut, Delaware, Georgia, Louisiana, Maine, Maryland, Massachusetts, Michigan, Missouri, New Jersey, New York, Pennsylvania, Vermont, West Virginia, and Wisconsin use a coat of arms or closely related heraldic device without reproducing the complete state seal."

