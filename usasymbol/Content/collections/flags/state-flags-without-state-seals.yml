seo:
  title: "State Flags Without the State Seal"
  description: "Most state flags skip the full seal — some use heraldry instead, others a design of their own. See which states avoid the seal and what they use."

hero_image: "/images/flags/new-mexico/flag.webp"
hero_image_alt: "New Mexico state flag with a red Zia sun symbol centered on a yellow field and no state seal"
hero_image_caption: "New Mexico uses one red Zia sun symbol on yellow rather than reproducing its state seal. It is one of 38 current state flags that omit the full official seal."

page:
  h1: "Which State Flags Do Not Use the State Seal?"
  intro_title: "38 State Flags Without a Full State Seal"

  quick_answer:
    - "38 current U.S. state flags do not display the full official state seal. New Mexico is the clearest example, using only a red Zia sun symbol on yellow."
    - "Fifteen of the 38 use a coat of arms or another armorial device. A coat of arms is an emblem that may appear inside a seal, but it is not the complete seal with its border or identifying inscription."
    - "Oregon is not on the list because its obverse uses the state seal design, even though its reverse shows a beaver. Minnesota and Utah joined the list when their new flags became official in 2024."

  methodology: "A flag qualifies when it omits the complete official state seal. State laws and official descriptions were used to separate a seal from a coat of arms, a seal-derived emblem, or an independently specified flag design."

