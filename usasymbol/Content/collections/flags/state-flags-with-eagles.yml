faq:
  - question: "Which state flags have eagles on them?"
    answer: "Seven U.S. state flags feature eagles: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, and Pennsylvania. All seven use the bald eagle, America's national bird, as a symbol of strength and national unity."
  
  - question: "What does the eagle on state flags symbolize?"
    answer: "Eagles on state flags symbolize strength, freedom, courage, and connection to American values. Most eagle designs show the bird holding olive branches (representing peace) and arrows (representing military strength), mirroring the Great Seal of the United States."
  
  - question: "Which state has the best eagle flag design?"
    answer: "North Dakota is often considered to have the most detailed eagle flag, featuring a design nearly identical to the Great Seal with 13 stars, shield, olive branches, arrows, and the motto 'E Pluribus Unum.' Iowa's unique horizontal flying eagle also stands out for its distinctive design."
  
  - question: "Why do state flags use the bald eagle instead of state birds?"
    answer: "State flags use the bald eagle to represent national unity and American ideals rather than regional wildlife. The eagle symbolizes each state's connection to the federal government and founding values, while state birds celebrate local ecosystems and heritage."
  
  - question: "Do all eagle flags look the same?"
    answer: "Most eagle flags follow similar 'seal-on-bedsheet' patterns with a state seal featuring an eagle on a blue background, making them difficult to distinguish. Iowa's tricolor design and Pennsylvania's golden eagle provide more distinctive variations."
  
  - question: "When were eagle flags adopted?"
    answer: "Most eagle flags were adopted between 1900 and 1925, during a period of strong American nationalism following the Spanish-American War and World War I. North Dakota (1911), Illinois (1915), and Iowa (1921) adopted their eagle flags during this era."
  
  - question: "Is the bald eagle on state flags the same as the national emblem?"
    answer: "Yes, the bald eagle designs on most state flags closely mirror the Great Seal of the United States adopted in 1782. States intentionally copied this symbolism to demonstrate their loyalty to the Union and connection to American founding principles."
  
  - question: "What state has a pelican instead of an eagle on its flag?"
    answer: "Louisiana is the only state with a different bird (brown pelican) on its flag. The pelican represents Louisiana's unique coastal identity and appears on the state seal feeding its young, symbolizing self-sacrifice."
