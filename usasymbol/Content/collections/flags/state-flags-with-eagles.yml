sections:
  - id: "why-eagles"
    icon: "fa-solid fa-feather-pointed"
    title: "Why State Flags Feature Eagles"
    paragraphs:
      - "The bald eagle became America's national emblem in 1782 when the Continental Congress adopted the Great Seal of the United States. Founding fathers chose the eagle for its majestic beauty, long life, great strength, and because it's native only to North America. The eagle represented a new nation's independence from European powers."
      - "States that adopted eagle imagery on their flags did so to demonstrate loyalty to the Union and connection to American ideals. Most eagle flags emerged during the late 1800s and early 1900s, a period of strong nationalism following the Civil War. The shared symbolism — olive branches for peace, arrows for military readiness — echoed the federal government's Great Seal design."
      - "Unlike many state symbols chosen for regional wildlife (like California's grizzly bear or Louisiana's brown pelican), eagles on state flags represent national rather than local identity. The bald eagle doesn't nest in every state with an eagle flag, yet these states chose the bird to emphasize their American character above regional distinctions."

  - id: "most-detailed"
    icon: "fa-solid fa-magnifying-glass"
    title: "States with the Most Detailed Eagle Designs"
    paragraphs:
      - "North Dakota's flag features the most elaborate eagle design among all state flags. Adopted in 1911, the design is nearly identical to the Great Seal of the United States. The bald eagle clutches an olive branch with 13 olives in its right talon and 13 arrows in its left. A shield on the eagle's breast displays 13 red and white stripes representing the original colonies, topped with a blue field. Above the eagle, 13 gold stars form a sunburst pattern."
      - "The eagle's beak holds a ribbon with 'E Pluribus Unum' ('Out of Many, One'), the same motto found on U.S. currency. The only difference from the regimental flag carried by North Dakota troops is a red scroll beneath the eagle reading 'North Dakota.' This design was so successful that a 1953 effort to change the flag was defeated."
      - "Iowa's flag presents a unique horizontal eagle design. Rather than facing forward, the bald eagle flies across the white center stripe carrying a blue ribbon in its beak. The ribbon displays Iowa's motto: 'Our Liberties We Prize and Our Rights We Will Maintain.' This dynamic flying pose distinguishes Iowa's eagle from the static, heraldic eagles on other state flags."

  - id: "symbolism-explained"
    icon: "fa-solid fa-book-open"
    title: "Eagle Symbolism on State Flags"
    paragraphs:
      - "Nearly every state eagle follows the Great Seal's symbolism: olive branches represent the power of peace, arrows represent military strength, and the shield represents self-reliance and defense. The eagle faces the olive branch (right side from the viewer's perspective), symbolizing America's preference for peace over war. This orientation was specifically chosen by the founding fathers."
      - "The number 13 appears repeatedly in eagle flag designs — 13 stars, 13 arrows, 13 olive leaves, 13 stripes — all representing the original thirteen colonies. States that joined the Union later still use this symbolism to connect themselves to America's founding narrative. It's a visual reminder that newer states share the same constitutional heritage as the original thirteen."
      - "Illinois's eagle carries the state motto 'State Sovereignty, National Union' in its beak. The motto's word order was controversial — the Secretary of State in 1867 wanted to reverse it to emphasize national unity during Reconstruction, but the Senate rejected the change. Legend says he printed 'Sovereignty' upside-down on the seal in protest, making it harder to read."

  - id: "eagle-vs-other-birds"
    icon: "fa-solid fa-dove"
    title: "Eagles vs. Other Birds on State Flags"
    paragraphs:
      - "While seven states feature eagles, only one state features a different bird species on its flag: Louisiana displays the brown pelican (the state bird) feeding its young, a symbol of self-sacrifice that appears on the state seal. The pelican is far more unique to Louisiana's identity than an eagle would be, making it a more distinctive choice."
      - "Interestingly, states with eagles on their flags often have different birds as official state birds. Illinois, for example, has the Northern Cardinal as its state bird, not the bald eagle. North Dakota's state bird is the Western Meadowlark. Only Iowa maintains some consistency — though the eagle represents integration into the Union rather than serving as the state bird (Iowa's state bird is the Eastern Goldfinch)."
      - "This separation between flag symbols and state birds reveals that eagle flags serve a different purpose: they represent political values and national connection rather than regional wildlife. Eagles on flags say 'we are American first' while state birds celebrate local ecosystems and heritage."

  - id: "flag-design-patterns"
    icon: "fa-solid fa-palette"
    title: "Common Design Patterns in Eagle Flags"
    paragraphs:
      - "Most eagle flags follow a 'seal-on-bedsheet' design pattern — a state seal featuring an eagle placed on a solid blue background. Illinois, Michigan, New York, North Dakota, and Pennsylvania all use this approach. Critics argue this makes state flags hard to distinguish from a distance, violating good flag design principles that favor simple, recognizable symbols."
      - "Iowa breaks this pattern with its tricolor design (blue, white, red vertical stripes) inspired by the French flag, acknowledging France's historical claim to Iowa territory through the Louisiana Purchase. The eagle appears only on the white stripe, making Iowa's flag more distinctive and easier to identify than typical seal-on-blue designs."
      - "Pennsylvania's golden eagle (rather than the traditional bald eagle coloring) makes its flag slightly more distinctive. Michigan's inclusion of an elk and moose supporting the shield adds unique wildlife elements. However, flag design experts consistently rank most eagle flags among America's worst-designed state flags due to complexity and similarity — a 2001 survey by the North American Vexillological Association ranked many eagle flags in the bottom half."

  - id: "historical-evolution"
    icon: "fa-solid fa-clock-rotate-left"
    title: "How Eagle Flags Evolved"
    paragraphs:
      - "Most eagle flags were adopted between 1900 and 1925, during a period of intense American patriotism following the Spanish-American War and World War I. States wanted to demonstrate loyalty to the Union and distinguish themselves from European monarchies. The bald eagle, already established as America's symbol for over a century, was a natural choice."
      - "North Dakota's flag began as a military regimental flag carried by North Dakota troops during the Spanish-American War (1898-1899) and the Philippine Insurrection. Soldiers recognized the flag's patriotic appeal, and the state legislature officially adopted it in 1911. Similarly, many eagle flags originated from military unit insignia before becoming official state symbols."
      - "Illinois modified its eagle flag in 1970 after Vietnam War soldiers couldn't identify which state it represented — the seal looked too similar to other states' flags. The legislature added 'ILLINOIS' in white letters below the seal. This practical change highlighted a common problem: complex eagle seals on blue backgrounds are nearly impossible to distinguish without close examination."

  - id: "bald-eagle-facts"
    icon: "fa-solid fa-circle-info"
    title: "Bald Eagle Facts: America's National Bird"
    paragraphs:
      - "The bald eagle (Haliaeetus leucocephalus) is native to North America and found near large bodies of water with abundant fish. Despite its name, the bald eagle has a full head of white feathers — 'bald' comes from an old English word meaning 'white-headed.' Adult bald eagles develop their distinctive white head and tail feathers at 4-5 years old."
      - "Bald eagles nearly went extinct in the lower 48 states by the 1960s due to DDT pesticide poisoning, habitat destruction, and illegal hunting. Only about 417 breeding pairs remained in 1963. After DDT was banned in 1972 and the Endangered Species Act protected eagles, populations recovered dramatically. Today, over 300,000 bald eagles live in North America, with healthy populations even in states like Illinois and Iowa."
      - "Eagles mate for life and return to the same nest each year, adding new material until some nests reach 2,000 pounds and the size of a small car. They can live 20-30 years in the wild. Their wingspan reaches 6-8 feet, and they can dive at speeds over 100 mph when hunting fish. Native American tribes consider eagles sacred, using their feathers in important ceremonies — federal law allows only enrolled tribal members to possess eagle feathers."

