page:
  h1: "State Flags with Eagles: Which States Feature America's National Bird"
  
  quick_answer:
    - "Nine U.S. state flags feature eagles: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming."
    - "All nine use the bald eagle (Haliaeetus leucocephalus), the U.S. national bird and national emblem."
    - "North Dakota and Iowa feature the most prominent eagle designs, with the bird as the central element holding olive branches and arrows."
    - "Oregon and Wyoming are easy to miss: Oregon's eagle appears only on the obverse seal, while Wyoming's eagle is inside the seal printed on the bison."

  intro_paragraphs:
    - "The bald eagle appears on nine state flags across the United States. Most of these eagles come through state seals or coats of arms, not through a standalone flag design."
    - "State flags with eagles often mirror the imagery from the Great Seal of the United States, where the eagle holds arrows and an olive branch. Iowa is the clearest visual exception: its eagle flies across the white stripe of a tricolor instead of sitting inside a seal."

  insights:
    - "North Dakota's flag features the most detailed bald eagle, nearly identical to the Great Seal design with 13 stars, shield, and the motto 'E Pluribus Unum.'"
    - "Iowa's eagle is unique — it flies horizontally across the flag carrying a ribbon with the state motto, rather than facing forward like most eagle designs."
    - "Pennsylvania renders its eagle as a golden crest above the coat of arms, while Iowa shows a flying eagle on a tricolor."
    - "Illinois added the word 'ILLINOIS' below its eagle in 1970 because soldiers couldn't identify the flag during the Vietnam War."
    - "Michigan's flag includes an eagle, elk, and moose in the same coat of arms."

  methodology: "This list includes all U.S. state flags that feature eagles as part of their official design, as adopted by state legislatures. Information verified through state government sources and vexillology databases. The year adopted reflects official legislative adoption dates."
  
