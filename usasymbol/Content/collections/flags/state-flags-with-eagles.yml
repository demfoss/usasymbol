faq:
  - question: "Which state flags have eagles on them?"
    answer: "Nine U.S. state flags feature eagles: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming. All nine use the bald eagle, usually through a state seal or coat of arms."
  
  - question: "What does the eagle on state flags symbolize?"
    answer: "Eagles on state flags usually borrow from the Great Seal of the United States. The olive branch represents peace, the arrows represent military readiness, and the shield and stars connect the design to federal heraldry."
  
  - question: "Which state has the best eagle flag design?"
    answer: "North Dakota has the most detailed eagle flag, with 13 stars, a shield, olive branch, arrows, and the motto 'E Pluribus Unum.' Iowa is the main layout exception because its eagle flies across a tricolor instead of sitting inside a seal."
  
  - question: "Why do state flags use the bald eagle instead of state birds?"
    answer: "State flags usually use the bald eagle because it came through state seals modeled on the Great Seal. Official state birds are separate symbols and often name local species instead."
  
  - question: "Do all eagle flags look the same?"
    answer: "No. Many eagle flags use a state seal on a plain field, but Iowa's eagle flies across a tricolor, North Dakota's eagle dominates the flag, Oregon's appears only on the obverse seal, and Wyoming's is nested inside the seal on the bison."
  
  - question: "When were eagle flags adopted?"
    answer: "Most eagle flags were adopted between 1900 and 1925, during a period of strong American nationalism following the Spanish-American War and World War I. North Dakota (1911), Illinois (1915), and Iowa (1921) adopted their eagle flags during this era."
  
  - question: "Is the bald eagle on state flags the same as the national emblem?"
    answer: "Yes, many bald eagle designs on state flags closely mirror the Great Seal of the United States adopted in 1782. The repeated arrows, olive branch, shield, and stars are the clearest signs of that source."
  
  - question: "What state has a pelican instead of an eagle on its flag?"
    answer: "Louisiana is the only current state flag with a bird other than a bald eagle. Its brown pelican appears at the center of the flag, feeding its young in the heraldic 'pelican in her piety' pose."
