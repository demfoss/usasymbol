sections:
  - id: plants-overview
    icon: "fa-solid fa-leaf"
    title: "What Each Plant or Tree Represents"
    highlights:
      - name: "South Carolina — The Sabal Palmetto"
        image: "/images/flags/south-carolina/flag.webp"
        description: "**What it represents:** Resilience under attack. In June 1776, Fort Moultrie's palmetto-log walls deflected British cannonballs — the spongy wood absorbed rather than splintered. The palmetto saved Charleston. South Carolina's flag has been in use since 1861; NAVA scores it near the top of all US state flag designs for clean, readable simplicity."
      - name: "Connecticut — Three Grapevines"
        image: "/images/flags/connecticut/flag.webp"
        description: "**What it represents:** Settlers transplanted from England to the New World who continued to flourish — matching the motto 'Qui Transtulit Sustinet' (He who transplanted still sustains). Three white grapevines on a white shield. The design traces to Connecticut's 1662 royal charter, making it one of the oldest state symbols in continuous use anywhere in the US."
      - name: "Mississippi — The Magnolia Blossom (2020)"
        image: "/images/flags/mississippi/flag.webp"
        description: "**What it represents:** Mississippi's identity beyond its Confederate history — the magnolia is the state flower, familiar and apolitical, chosen by a statewide public vote after the 1894 flag was retired. Adopted January 11, 2021: the most recent state flag in the United States, and the most recent plant flag."
      - name: "Maine — White Pine in the Coat of Arms"
        image: "/images/flags/maine/flag.webp"
        description: "**What it represents:** Maine's timber heritage and forested identity — the white pine is Maine's state tree and shares the coat of arms with the state moose. Voters kept this design in a 2024 statewide referendum over a proposed simpler pine tree design."
      - name: "Vermont — Pine in the Landscape Scene"
        image: "/images/flags/vermont/flag.webp"
        description: "**What it represents:** Vermont's Green Mountain forests and logging heritage. A large pine tree anchors the left side of the coat of arms landscape, alongside mountains, a cow, grain, and a deer. Vermont's flag contains more pictorial elements than any other US state flag. Last updated 1923."
      - name: "Florida — Sabal Palmetto in the State Seal"
        image: "/images/flags/florida/flag.webp"
        description: "**What it represents:** Florida's state tree and subtropical coastal environment. Florida and South Carolina share the palmetto symbol, but Florida's appears within the state seal as part of a coastal scene — much smaller and less dominant than South Carolina's full-flag palmetto design."

  - id: prominent-plant-flags
    icon: "fa-solid fa-leaf"
    title: "South Carolina and Connecticut: Two Designs Built Around Plants"
    paragraphs:
      - "South Carolina's flag is the clearest plant flag in the United States. A white Sabal palmetto — the state tree — stands at the center of an indigo blue field, with a white crescent in the upper left. No seal, no text, no coat of arms. The design is immediately legible from any distance. Its simplicity places it among the top-rated US state flag designs by vexillological standards."
      - "The palmetto's place on the flag comes from a specific battle. In June 1776, at Fort Moultrie on Sullivan's Island, a small South Carolina garrison held off a British naval attack. The fort was built from Sabal palmetto logs, whose spongy wood absorbed and deflected British cannonballs rather than splintering under impact. The palmetto came to stand for resilience under attack."
      - "Connecticut's flag shows a white shield on blue with three white grapevines — each bearing grapes — arranged vertically. Below the shield, a white ribbon carries the Latin motto 'Qui Transtulit Sustinet' (He who transplanted still sustains). The grapevines symbolize the settlers transplanted from England to the New World who continued to flourish. The design dates to Connecticut's royal charter of 1662, making it one of the oldest state symbols still in continuous use."

  - id: mississippi-magnolia
    icon: "fa-solid fa-seedling"
    title: "Mississippi's 2020 Magnolia Flag: A New Plant Flag"
    paragraphs:
      - "Mississippi held a statewide flag referendum in 2020 after the state legislature voted to retire the 1894 design, which incorporated the Confederate battle emblem. The replacement — the Magnolia flag — features a white magnolia blossom at center on a blue field, with a gold border, a red stripe, and a canton of 20 gold stars in the upper left."
      - "The magnolia blossom is Mississippi's state flower and appears on the state tree (the Southern Magnolia, *Magnolia grandiflora*). The flower was a conscious choice: recognizable as distinctly Southern, not politically charged, and familiar to every Mississippi resident. The design was selected by a commission and ratified by voters — one of the most transparent flag adoption processes in US history."
      - "Mississippi's Magnolia flag is the most recent plant flag in the United States, adopted January 11, 2021."

  - id: pine-tree-flags
    icon: "fa-solid fa-tree"
    title: "Maine and Vermont: Pine Trees in the Coat of Arms"
    paragraphs:
      - "Maine's state flag shows the state coat of arms on a blue field. At the center of the arms, a moose reclines beneath a white pine tree — the moose and pine together are the two defining elements of Maine's wilderness identity. The pine tree also appears in the upper-left corner of the shield. Maine adopted this flag design in 1909."
      - "Vermont's flag shows the state coat of arms on a blue field, with a landscape scene: a large pine tree at the left, mountains in the background, a cow, sheaves of grain, and a deer's head. Unlike Maine's heraldic moose, Vermont's tree is part of a pastoral landscape. The pine represents Vermont's Green Mountain forests and the lumber industry. Vermont last updated the flag design in 1923."
      - "Both pine tree flags are 'seal-on-blue' designs where the tree is embedded in a complex scene. At normal flag-viewing distance, the trees are not clearly distinguishable — unlike South Carolina's dominant palmetto or Connecticut's three visible grapevines."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Plant and Tree Flags"
    facts:
      - "South Carolina's palmetto flag has been used since 1861 — it flew over the state when it seceded from the Union"
      - "Connecticut's grapevine design dates to a royal charter from 1662 — over 360 years of continuous use"
      - "Mississippi's Magnolia flag is the newest state flag in the US — adopted January 11, 2021"
      - "The Sabal palmetto appears on two state flags: South Carolina (dominant design) and Florida (within state seal)"
      - "Fort Moultrie's palmetto-log walls absorbed British cannonballs because the soft, fibrous wood doesn't splinter"
      - "NAVA's state flag rankings consistently score South Carolina's palmetto design near the top for simplicity and distinctiveness"
      - "Maine's pine tree survived a 2024 statewide referendum — voters chose to keep the current coat-of-arms design"
      - "Vermont's flag scene includes a cow, deer, grain sheaves, and pine tree — more elements than any other state flag"

