faq:
  - question: "Which US state flags have trees on them?"
    answer: "Six US state flags feature trees or plants prominently: South Carolina (Sabal palmetto tree, dominant design), Connecticut (three grapevines on the shield), Mississippi (magnolia blossom, adopted 2020), Maine (white pine in coat of arms), Vermont (pine tree in coat-of-arms scene), and Florida (Sabal palmetto within the state seal)."

  - question: "Which state flag has a palmetto tree on it?"
    answer: "South Carolina's flag features a white Sabal palmetto tree on an indigo blue field — the clearest plant flag in the US. Florida's flag also shows a palmetto within the state seal at the center, though it is much smaller. The palmetto became South Carolina's symbol after palmetto-log walls at Fort Moultrie deflected British cannonballs in 1776."

  - question: "What is the newest plant flag in the United States?"
    answer: "Mississippi's Magnolia flag, adopted January 11, 2021, is the newest plant flag and the newest state flag in the United States. It features a white magnolia blossom — the state flower — on a blue field. It replaced a 1894 design that incorporated the Confederate battle emblem."

  - question: "What do the grapevines on the Connecticut flag mean?"
    answer: "Connecticut's three grapevines represent settlers transplanted from England to the New World who continued to flourish — matching the state's Latin motto 'Qui Transtulit Sustinet' (He who transplanted still sustains). The design dates to Connecticut's 1662 royal charter."

  - question: "Why is there a palmetto on the South Carolina flag?"
    answer: "The palmetto on South Carolina's flag commemorates the Battle of Sullivan's Island in June 1776. Fort Moultrie, defending Charleston, was built from Sabal palmetto logs. The spongy, fibrous wood absorbed and deflected British cannonballs rather than splintering — allowing the garrison to hold off the British fleet. The palmetto came to represent resilience and defiance."
