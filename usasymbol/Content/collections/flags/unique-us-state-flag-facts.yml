sections:
  - id: "state-flag-records"
    icon: "fa-solid fa-flag"
    style: "law-cards"
    title: "U.S. State Flags With One-of-a-Kind Records"
    paragraphs:
      - "Five flags qualify through a design distinction documented by an official state source. Each record uses a narrow definition so that a memorable fact does not become a broader claim than the evidence supports."
    subsections:
      - subtitle: "Ohio"
        text: |
          **Record:** Only nonrectangular U.S. state flag
          **Official shape:** Burgee

          Ohio Revised Code requires a burgee-shaped flag with three red stripes, two white stripes, a blue triangular field, and 17 stars. The forked fly gives the banner its instantly recognizable silhouette.

          Ohio belongs here because no other U.S. state departs from the rectangular outline. The record concerns the flag's outer shape, not merely the arrangement of symbols inside it.
      - subtitle: "Oregon"
        text: |
          **Record:** Only state flag with different designs on each side
          **Reverse symbol:** Beaver

          Oregon law puts the state escutcheon, 33 stars, the words State of Oregon, and 1859 on one side. A gold beaver appears alone on the other side of the navy field.

          Oregon earns its record because its reverse is a separate composition rather than a mirrored copy of the front. No other state assigns two different official faces to one flag.
      - subtitle: "Washington"
        text: |
          **Record:** Only state flag with a green field and a U.S. president
          **Adopted:** 1923

          Washington law requires a dark green field with the state seal in the center. George Washington's portrait occupies that seal, creating the pairing identified in state legislative research.

          Washington belongs on the list for a precisely documented pairing: no other state flag combines a green field with the portrait of a past U.S. president. The portrait appears through the seal, but it remains part of the official flag design.
      - subtitle: "Hawaii"
        text: |
          **Record:** Only state flag incorporating a foreign national flag
          **Flag in the canton:** United Kingdom

          Hawaii places the Union Jack in its upper-left canton above eight horizontal stripes. The Office of the Lieutenant Governor connects the design to the Hawaiian Kingdom's historical ties with Great Britain.

          Hawaii makes the list because the British emblem is not simply an influence or a lookalike. A recognizable foreign national flag forms an official component of the state banner itself.
      - subtitle: "Maryland"
        text: |
          **Record:** Only state flag based on British heraldry
          **Families represented:** Calvert and Crossland

          Maryland quarters the black and gold arms of the Calvert family with the red and white arms associated with the Crossland family. The combined design became the official state flag in 1904.

          Maryland belongs under the careful wording used by the Maryland State Archives: it is the only U.S. state flag based on British heraldry. That claim is narrower and better supported than calling it the country's only heraldic state flag.
  - id: "what-makes-a-state-flag-record"
    icon: "fa-solid fa-circle-check"
    title: "What Counts as a State Flag Record"
    paragraphs:
      - "A record needs a feature that can be defined and checked across all 50 official state flags. Shape establishes Ohio's case, front-versus-reverse construction establishes Oregon's, and a named emblem or field color establishes the Washington and Hawaii cases."
      - "Maryland needs more care because heraldic influence appears on several state flags. Its defensible distinction is the one published by the Maryland State Archives: a design based on British family heraldry, specifically the Calvert and Crossland arms."

  - id: "state-flag-record-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "More Facts About These State Flags"
    facts:
      - "Ohio's 17 stars combine 13 for the original states with four more to identify Ohio as the 17th state admitted to the Union."
      - "Oregon's front displays 33 stars because Oregon entered the Union as the 33rd state in 1859."
      - "Washington law allows gold or yellow fringe, but it does not require fringe on the flag."
      - "Hawaii's familiar flag design was established during the Hawaiian Kingdom and remained in use through later changes in government."
      - "Maryland law specifies a gold cross bottony when an ornament tops a staff carrying the state flag."

faq:
  - question: "What is the only nonrectangular U.S. state flag?"
    answer: "Ohio has the only nonrectangular state flag. State law describes it as burgee-shaped, with a swallowtail fly, five horizontal stripes, a blue triangular field, a circular O, and 17 white stars."

  - question: "Which state flag has a different design on the back?"
    answer: "Oregon's flag has the state escutcheon and 33 stars on its front, but its reverse shows a gold beaver on navy blue. Oregon's official Blue Book identifies it as the only state flag with different patterns on each side."

  - question: "Which state flag has a president on it?"
    answer: "Washington's flag carries the state seal, whose central figure is George Washington. State legislative research identifies it as the only state flag featuring a past U.S. president, as well as the only one with a green field."

  - question: "Why does Hawaii have the Union Jack on its flag?"
    answer: "The Union Jack records the Hawaiian Kingdom's historical relationship with Great Britain. Hawaii's official history traces the design to Kamehameha I, and the British flag remains in the canton above eight stripes for the major islands."

  - question: "Is Maryland the only heraldic state flag?"
    answer: "Maryland's safest official distinction is narrower: the Maryland State Archives describes it as the only U.S. state flag based on British heraldry. Its quarters reproduce the arms of the Calvert and Crossland families."

  - question: "Which U.S. state flags have one-of-a-kind designs?"
    answer: "Ohio, Oregon, Washington, Hawaii, and Maryland each have a documented distinction. Their records cover nonrectangular shape, different front and reverse designs, a green field and presidential portrait, a foreign national flag, and British family heraldry."

