page:
  h1: "Unique U.S. State Flag Records"
  intro_title: "Five State Flags That Break the Pattern"

  quick_answer:
    - "Ohio has the only nonrectangular U.S. state flag. Its swallowtail burgee shape is written into state law and separates it from every other state banner."
    - "Oregon is the only state with different designs on its two flag faces: the state escutcheon appears on the front, while a gold beaver occupies the reverse."
    - "Washington alone combines a green field with a U.S. president's portrait, while Hawaii uniquely incorporates another country's national flag through the Union Jack in its canton."

  methodology: "Selections are limited to distinctions explicitly supported by state statutes, state archives, secretaries of state, or legislative research. Maryland is included under the narrower description used by its state archives: the only state flag based on British heraldry."

