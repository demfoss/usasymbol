sections:
  - id: ships-overview
    icon: "fa-solid fa-ship"
    title: "What Each Ship Represents"
    highlights:
      - name: "Oregon — British Ship Leaving, American Ship Arriving"
        image: "/images/flags/oregon/flag.webp"
        description: "**What it represents:** The 1846 Oregon Treaty — a British man-of-war sails away as an American merchant vessel arrives, depicting the transfer of Pacific sovereignty from Britain to the US. Oregon is also the only US state with a two-sided flag: the front shows this ship scene; the back shows only a golden beaver. Adopted 1925."
      - name: "New Hampshire — The USS Raleigh Under Construction"
        image: "/images/flags/new-hampshire/flag.webp"
        description: "**What it represents:** New Hampshire's claim to naval heritage — the USS Raleigh was one of 13 frigates authorized by Congress in 1775 for the first Continental Navy. The flag shows the ship still on the stocks at Portsmouth, not yet launched. It is the only US state flag depicting a ship being built rather than at sea."
      - name: "New York — Hudson River Trade"
        image: "/images/flags/new-york/flag.webp"
        description: "**What it represents:** The maritime commerce that made New York the dominant colonial trading hub — a full-rigged sailing ship and a smaller sloop on the Hudson River, shown in the coat of arms since 1778. New York was already the center of Atlantic trade when the design was created."
      - name: "Pennsylvania — Trans-Atlantic Commerce"
        image: "/images/flags/pennsylvania/flag.webp"
        description: "**What it represents:** Pennsylvania's role in trans-Atlantic trade through Philadelphia, one of the largest colonial ports. A full-rigged sailing ship fills the upper third of the coat of arms shield on the state flag, adopted in its current form in 1907."
      - name: "Nebraska — Steamboat on the Missouri River"
        image: "/images/flags/nebraska/flag.webp"
        description: "**What it represents:** 19th-century commerce and westward expansion — Nebraska's seal shows a steamboat alongside a locomotive, making it the only US state flag depicting both river and rail transportation together. Unlike Oregon's specific narrative, Nebraska's steamboat is a general symbol of frontier commerce."

  - id: oregon-ship
    icon: "fa-solid fa-ship"
    title: "Oregon: The Most Historically Specific Ship Flag"
    paragraphs:
      - "Oregon's state flag (front) shows the state seal on a navy blue field. The seal's central scene depicts two ships on the Pacific Ocean. One ship — a British man-of-war — sails away from the viewer, its sails filled as it departs. A second ship — an American merchant vessel — approaches the coast."
      - "The contrast is intentional and historically specific. The scene represents the transfer of Pacific sovereignty from British to American influence in the Oregon Territory. The Oregon Treaty of 1846 settled the border with British Canada at the 49th parallel, formally ending joint occupation of the region. The flag design (adopted 1925) commemorates that transition."
      - "Oregon is also the only US state with a two-sided flag: the front shows the state seal (with the ships), while the reverse shows only a gold beaver. This makes Oregon's flag unique — the ship appears only on the front."

  - id: other-ship-flags
    icon: "fa-solid fa-anchor"
    title: "New Hampshire, New York, Pennsylvania, Nebraska"
    paragraphs:
      - "**New Hampshire**: New Hampshire's state seal — displayed on the blue state flag — shows the frigate USS Raleigh being built on the stocks at Portsmouth. The Raleigh was one of 13 frigates authorized by the Continental Congress in 1775 as the core of the first American navy. New Hampshire's inclusion of this ship in its state seal (and thus its flag) is a claim to naval heritage: the state helped build the first US fleet."
      - "**New York**: New York's coat of arms — displayed on the blue state flag — shows a shield divided into two panels. The upper panel depicts a landscape with the Hudson River and two ships: a full-rigged sailing ship and a smaller sloop. The ships represent the maritime commerce that made New York the primary trading port of the colonial period. The coat of arms was designed in 1778, when New York was already the dominant trading hub of the Atlantic seaboard."
      - "**Pennsylvania**: Pennsylvania's coat of arms shows a shield with three panels. The upper third contains a full-rigged sailing ship on a blue sea. The ship represents Pennsylvania's role in trans-Atlantic trade through Philadelphia, which was one of the largest ports in the British colonies and the new republic. The coat of arms appears on the state flag, adopted in its current form in 1907."
      - "**Nebraska**: Nebraska's state seal — on the state flag — shows a steamboat on the Missouri River as one of several transportation symbols. The steamboat, alongside a locomotive, represents Nebraska's 19th-century growth through river commerce and railroad expansion. Unlike Oregon's historically specific ships, Nebraska's steamboat is a general symbol of industrial transportation."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Ships on US State Flags"
    facts:
      - "Oregon is the only US state flag with two ships, and the only flag where the ship scene tells a specific historical story"
      - "New Hampshire's ship is the only US state flag depicting a ship being built — not yet launched"
      - "Oregon's ship scene appears only on the front of the flag — the reverse shows only a beaver"
      - "New York's coat of arms has been in continuous use since 1778, making its ship scene one of the oldest maritime symbols on any US state flag"
      - "Pennsylvania's ship represents Philadelphia — the largest US port city in the colonial era"
      - "Nebraska's steamboat is paired with a locomotive — the only state flag showing both river and rail transportation together"
      - "The USS Raleigh (New Hampshire's flag ship) was captured by the British in 1778, two years after being launched"

