faq:
  - question: "Which US state flags have ships on them?"
    answer: "Five US state flags feature ships or boats: Oregon (two ships — a departing British man-of-war and an arriving American merchant vessel), New Hampshire (the frigate USS Raleigh under construction), New York (sailing ship and sloop on the Hudson River), Pennsylvania (sailing ship in the coat of arms shield), and Nebraska (steamboat on the Missouri River in the seal)."

  - question: "Which state flag has two ships on it?"
    answer: "Oregon's state flag (front side) shows two ships on the Pacific Ocean: a British man-of-war sailing away and an American merchant vessel arriving. The scene represents the end of British sovereignty and the arrival of American governance in the Pacific Northwest, commemorating the 1846 Oregon Treaty."

  - question: "Which state flag shows a ship being built?"
    answer: "New Hampshire's state flag shows the frigate USS Raleigh under construction on the stocks at Portsmouth — not yet launched. The Raleigh was one of 13 frigates commissioned in 1775 for the first Continental Navy. It is the only US state flag to depict a ship being built rather than at sea."

  - question: "Why does Oregon's flag show two ships?"
    answer: "Oregon's state seal — displayed on the front of the state flag — shows a British man-of-war departing and an American merchant vessel arriving on the Pacific. This represents the 1846 Oregon Treaty, which ended joint British-American occupation of the Oregon Territory and established American sovereignty over the region north to the 49th parallel."
