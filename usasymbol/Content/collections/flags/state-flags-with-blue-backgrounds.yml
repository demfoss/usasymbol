faq:
  - question: "How many state flags have a blue background?"
    answer: "27 of 50 US state flags have a blue background, making blue the most common primary flag color in the US. The 27 states are Alaska, Arkansas, Connecticut, Georgia, Idaho, Indiana, Kansas, Kentucky, Louisiana, Maine, Michigan, Minnesota, Montana, Nebraska, Nevada, New Hampshire, New York, North Dakota, Oklahoma, Oregon, Pennsylvania, South Carolina, South Dakota, Vermont, Virginia, Wisconsin, and Wyoming."

  - question: "Which state flag is blue with stars?"
    answer: "Alaska's flag is the most prominent blue flag with stars: 8 gold stars on a navy blue field, 7 forming the Big Dipper and 1 representing Polaris. Indiana's flag has 19 stars on navy blue. New Hampshire's seal includes 9 stars. Minnesota's 2024 flag centers a single eight-pointed white North Star on blue."

  - question: "Why are so many state flags blue?"
    answer: "Blue entered state flag design through state seals, most of which borrowed from the Great Seal of the United States (1782). When states formally adopted flags between 1900 and 1930, the standard template was the military regimental flag — blue field, seal centered. The color stayed even as designs evolved."

  - question: "What is the oldest blue state flag?"
    answer: "South Carolina's flag, dating to 1861. It uses indigo blue — a color tied to the colonial indigo crop — with a white palmetto tree and crescent moon. The design traces to Colonel William Moultrie's regimental colors from 1775."

  - question: "What state flag is blue with a tree?"
    answer: "South Carolina's flag shows a white palmetto tree on an indigo blue field. Vermont's flag shows a pine tree within the coat of arms on a navy blue field. Maine's coat of arms also includes a pine tree on a navy background."

  - question: "Is the Oklahoma flag blue?"
    answer: "Yes. Oklahoma's flag uses sky blue — lighter than the navy used by most other blue-flag states. It centers an Osage war shield with a crossed peace pipe and war club. Oklahoma is the only US state flag with Native American imagery as its primary symbol."

  - question: "What state flag is dark blue with an animal?"
    answer: "Wyoming's navy blue flag shows a large white American bison silhouette with the state seal on its body. Louisiana's blue flag shows a brown pelican in her nest. Oregon's navy blue obverse shows an eagle in the state seal."

  - question: "Which blue state flag has no state seal?"
    answer: "Four blue-background flags have no state seal: Alaska (Big Dipper stars), South Carolina (palmetto and crescent), Oklahoma (Osage war shield), and Nevada (silver star and sagebrush wreath). Indiana and North Dakota also avoid a traditional circular seal — Indiana uses a torch-and-stars layout, North Dakota uses an eagle design without seal text."

