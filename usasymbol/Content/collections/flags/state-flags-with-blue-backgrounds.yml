sections:
  - id: seal-vs-distinctive
    icon: "fa-solid fa-shield"
    title: "Seal on Blue vs. Distinctive Blue Flags"
    paragraphs:
      - "16 of the 27 blue-background flags follow the same format: a state seal or coat of arms centered on a plain blue field. The other 11 have a primary visual symbol that reads at distance — a star, a palmetto, a shield, a bison, a pelican, or a diamond."
      - "The 11 distinctive blue flags: Alaska (8 constellation stars), South Carolina (palmetto and crescent), Oklahoma (Osage war shield), Nevada (silver star and sagebrush), Indiana (torch and 19 stars), North Dakota (eagle without seal text), Wyoming (bison silhouette), Louisiana (pelican), Arkansas (red diamond with stars), Georgia (coat of arms with arch of 13 stars), and Minnesota's 2024 North Star."

  - id: four-no-seal-blue-flags
    icon: "fa-solid fa-star"
    title: "Blue Flags with No State Seal: Alaska, South Carolina, Oklahoma, Nevada"
    highlights:
      - name: "Alaska — Big Dipper and North Star"
        image: "/images/flags/alaska/flag.webp"
        description: "Alaska's navy blue flag maps two real constellations: 7 stars form the Big Dipper (Ursa Major) and 1 larger gold star represents Polaris, the North Star. No text, no seal, no other element. Designed by 13-year-old Benny Benson of Seward in a 1927 Alaska territorial contest; adopted as the state flag in 1959. NAVA consistently ranks it among the top 5 best-designed US state flags."
      - name: "South Carolina — Palmetto and Crescent on Indigo"
        image: "/images/flags/south-carolina/flag.webp"
        description: "South Carolina's flag is the oldest blue flag in the group, dating to 1861, and uses indigo rather than navy. The palmetto tree and crescent moon trace to Revolutionary War regimental colors: Colonel William Moultrie's troops carried a blue flag with a crescent in 1775. The indigo color honors South Carolina's colonial indigo crop, which made the state one of the wealthiest in colonial America."
      - name: "Oklahoma — Osage War Shield on Sky Blue"
        image: "/images/flags/oklahoma/flag.webp"
        description: "Oklahoma's flag uses sky blue (lighter than navy) and centers an Osage war shield decorated with small crosses, flanked by a crossed peace pipe (calumet) and a war club. It is the only current US state flag with Native American imagery as its primary design element. Oklahoma originally adopted an all-blue flag with a white star in 1911; the Osage shield design replaced it in 1925. The word 'Oklahoma' was added in 1941 after reports that soldiers couldn't identify the flag."
      - name: "Nevada — Cobalt Blue with Silver Star"
        image: "/images/flags/nevada/flag.webp"
        description: "Nevada's cobalt blue flag places a silver five-pointed star in the upper-left corner, framed by two sprays of sagebrush and a 'Battle Born' scroll. No state seal anywhere. The silver star refers to the Comstock Lode silver rush of 1859 — the richest silver deposit ever found in the US. 'Battle Born' refers to Nevada's Civil War statehood in 1864. The flag was adopted in 1929."

  - id: why-blue
    icon: "fa-solid fa-flag"
    title: "Why Blue Became the Default Color for US State Flags"
    paragraphs:
      - "Blue appears in the Great Seal of the United States (1782) as the color of the canton — carrying the qualities of vigilance, perseverance, and justice. Most state seals borrowed from the Great Seal's color vocabulary, so blue entered state flag designs through the seals themselves."
      - "When states formally adopted flags between 1900 and 1930, the military regimental flag was the standard template: blue field, identifying element centered. The result is that most of the 27 states ended up with navy blue as the default. Indiana (1917) and Nevada (1929) ran design competitions during the same period and deliberately chose non-seal layouts — both ended up with recognizable blue flags anyway."
      - "Minnesota's 2024 redesign shows the pattern continuing: even when states redesign to escape the seal-on-blue format, they tend to keep the blue field. The color is no longer accidental."

  - id: shades-of-blue
    icon: "fa-solid fa-palette"
    title: "Shades of Blue Across the 27 Flags"
    paragraphs:
      - "19 of the 27 use navy or dark blue. The four exceptions: South Carolina uses indigo, tracing to the colonial indigo crop that dominated SC's economy before the Revolution. Oklahoma and South Dakota use sky blue, visibly lighter than navy. Nevada uses cobalt blue, more saturated than navy."
      - "South Carolina's indigo is the oldest shade in the group. Colonel Moultrie chose the blue of his troops' uniforms in 1775, and the flag has kept that hue through every revision in over 250 years."

