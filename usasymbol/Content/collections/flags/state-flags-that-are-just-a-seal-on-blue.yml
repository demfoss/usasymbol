faq:
  - question: "Which state flags are just a seal on a blue background?"
    answer: "16 US state flags place a state seal on a plain blue field: Connecticut, Idaho, Kansas, Kentucky, Maine, Michigan, Montana, Nebraska, New Hampshire, New York, Oregon, Pennsylvania, South Dakota, Vermont, Virginia, and Wisconsin. Illinois had this format but added its state name in 1970."

  - question: "Why do so many state flags look the same?"
    answer: "Most seal-on-blue flags were adopted between 1900 and 1930, when the military regimental flag — blue field with the regiment's identifier centered — was the standard template. State legislatures used the already-engraved state seal as the identifier. No design competition was held."

  - question: "Which state added its name to its flag because soldiers couldn't identify it?"
    answer: "Illinois. In 1969, Sergeant Howard Wyman wrote to Governor Ogilvie from Camp Eagle, Vietnam, saying he couldn't identify the Illinois flag among other state flags. The legislature amended the law in 1969; 'ILLINOIS' was added below the seal, effective 1970."

  - question: "Which states changed their seal-on-blue flags in 2024?"
    answer: "Minnesota and Utah. Minnesota's new flag (effective May 2024) centers a single eight-pointed North Star on blue, designed by Andrew Prekker. Utah's new flag (adopted March 2024) centers a golden beehive on blue. Both redesigns replaced flags that had placed the state seal on a blue field."

  - question: "Which seal-on-blue flag is the oldest?"
    answer: "Connecticut, adopted 1897. It is also the only seal-on-blue flag with no state name on it."

  - question: "What does NAVA say about seal-on-blue flags?"
    answer: "The North American Vexillological Association's 2001 survey ranked 72 US and Canadian flags on five criteria including simplicity, no seals or lettering, and distinctiveness. Seal-on-blue flags failed on three of those five criteria and ranked in the bottom third of the survey."

  - question: "Do Connecticut and Virginia have their state name on the flag?"
    answer: "No. Connecticut and Virginia are the only two seal-on-blue flags with no state name. Connecticut shows three grapevines and the Latin motto Qui Transtulit Sustinet. Virginia shows Virtus standing over a fallen tyrant with the motto Sic Semper Tyrannis."

