expert_quote:
  text: "The flag of Texas shall be as follows: the field shall be divided into two vertical sections; the first from the staff to be one third of the whole length of the flag, shall be blue, and shall have a white star of five points in the center thereof... the remaining two thirds shall be divided into two equal horizontal strips, the upper of which shall be white and the lower red."
  source: "Republic of Texas Congress — Flag Specification, January 25, 1839"


