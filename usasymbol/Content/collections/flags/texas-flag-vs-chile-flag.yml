sections:
  - id: two-flags-visual
    icon: "fa-solid fa-flag"
    style: compare-cards
    title: "The Two Flags Side by Side"
    img: texas-flag
    img_right: chile-flag
    subsections:
      - subtitle: "Texas Lone Star Flag"
        text: "Adopted January 25, 1839. A **full-height vertical blue stripe** covers the entire left side — one-third of the flag's width. A white five-pointed star sits at the center of that stripe. The right two-thirds splits into two equal horizontal bands: white on top, red on the bottom."
      - subtitle: "Chilean national flag"
        text: "Adopted October 18, 1817. The blue is a **square canton confined to the upper-left corner** — not a full stripe. A white star sits inside that canton. The upper-right field is white; the entire bottom half, spanning the full width, is red."

  - id: main-difference
    icon: "fa-solid fa-arrows-left-right"
    title: "The Main Difference at a Glance"
    paragraphs:
      - "If you only check one feature, check the blue. On the Texas flag, blue forms a full-height vertical stripe along the entire left side. On the Chilean flag, blue appears only as a square canton in the upper-left corner."
      - "That single structural difference changes the rest of the layout. Texas keeps red only in the bottom-right quadrant, while Chile stretches red across the full bottom half of the flag."

  - id: side-by-side-differences
    icon: "fa-solid fa-table-columns"
    title: "What Is the Difference Between the Texas and Chile Flags?"
    table:
      headers: ["Feature", "Texas Flag", "Chile Flag"]
      rows:
        - ["Adopted", "January 25, 1839", "October 18, 1817"]
        - ["Aspect ratio", "2:3", "2:3"]
