seo:
  title: "Texas vs Chile Flag: Are They the Same?"
  description: "The Texas and Chile flags look alike but are not the same. The difference comes down to one structural feature: the blue area. Side-by-side comparison, history, and why the confusion persists."

hero_image: "/images/collections/flags/texas-flag-vs-chile-flag.webp"
hero_image_alt: "Side-by-side comparison of the Texas flag and the Chile flag, showing their similar red, white, and blue layouts with key design differences"
hero_image_caption: "Texas flag vs. Chile flag: a side-by-side comparison showing why the two are often confused. Both use red, white, and blue, but the Texas flag has a full-height blue vertical stripe with one white star, while Chile's flag places the blue canton and star only in the upper left."

page:
  h1: "Texas vs Chile Flag: Are They the Same?"
  intro_title: "One Lone Star, Two Flags — One Structural Difference"

  quick_answer:
    - "Are the Texas and Chile flags the same? No. The key difference is the blue area: Texas has a full-height vertical blue stripe covering the entire left edge of the flag; Chile has a blue canton in the upper-left corner only."
    - "Which came first? Chile — by more than 21 years. Chile adopted its current flag on October 18, 1817. Texas adopted the Lone Star Flag on January 25, 1839."
    - "Did Texas copy Chile? No documented evidence of direct copying exists. Historians attribute the similarity to shared 19th-century independence-era flag traditions across the Americas, not deliberate imitation."

  methodology: >
    Compiled from official sources: the Texas State Library and Archives Commission, the Texas Government Code
    (Chapter 3100), the Biblioteca del Congreso Nacional de Chile, and the North American Vexillological
    Association (NAVA). Historical dates follow primary legislative records. Claims about design influence
    are noted as unconfirmed where no primary documentation exists.

  sources:
