faq:
  - question: "Which state flag has the most stars?"
    answer: "Oregon has the most stars of any state flag, 33 gold stars in a ring around the state shield. They mark Oregon as the 33rd state. Arkansas is second with 29 stars, and Missouri third with 24."

  - question: "Which US state flags have stars on them?"
    answer: "Seventeen state flags feature stars. Oregon (33), Arkansas (29), Missouri (24), Mississippi (21), Indiana (19), Ohio (17), Georgia (13), Rhode Island (13), Alaska (8), and Tennessee (3) have several. Texas, California, North Carolina, Arizona, Nevada, Minnesota, and Utah each have one."

  - question: "How many stars are on the Arkansas flag?"
    answer: "The Arkansas flag has 29 stars. Twenty-five white stars border the diamond because Arkansas was the 25th state. Four blue stars sit inside the diamond, three below the state name and one above it."

  - question: "Which state flag is made entirely of stars?"
    answer: "Alaska's flag is the only state flag made of stars alone. It shows 8 gold stars on a dark blue field, seven forming the Big Dipper and one standing for Polaris, the North Star. There is no seal, coat of arms, or lettering."

  - question: "What does the star on the Texas flag represent?"
    answer: "The single white star, known as the Lone Star, stands for Texas as an independent republic and the unity of its people. It gave Texas its nickname, the Lone Star State. The current flag was adopted in 1839, six years before statehood."

  - question: "What do the 3 stars on the Tennessee flag mean?"
    answer: "Tennessee's three stars stand for the state's three grand divisions, East Tennessee in the Appalachian region, Middle Tennessee around Nashville, and West Tennessee in the lowlands near the Mississippi River. The flag was adopted in 1905."
