sections:
  - id: most-stars
    icon: "fa-solid fa-star"
    title: "State Flags With the Most Stars"
    paragraphs:
      - "Oregon's flag has the most stars of any state, 33 in total. They form a gold ring around the state shield, and the number is no accident. Oregon joined the Union as the 33rd state on February 14, 1859."
      - "Arkansas comes second with 29. Twenty-five white stars line the blue band around the diamond, because Arkansas was the 25th state. Inside the diamond sit 4 blue stars. The three below the state name stand for Spain, France, and the United States, the three nations that have ruled the land. The single star above the name, added in 1923, stands for the Confederacy."
      - "Missouri is third with 24 white stars in the blue band around its coat of arms, one for each state in the Union when Missouri joined as the 24th. Mississippi follows with 21. Twenty white stars mark it as the 20th state, and a gold star at the top honors the state's Native American tribes."

  - id: pure-star-flags
    icon: "fa-solid fa-star"
    title: "Alaska and Texas Star Flags"
    paragraphs:
      - "Alaska's flag is the only state flag made of stars and nothing else. A 13-year-old named Benny Benson won a 1927 territorial contest with this design. Seven gold stars form the Big Dipper, and the eighth, larger and set apart, is Polaris, the North Star."
      - "Benson explained his choices himself. The blue stood for the sky and for the forget-me-not, which later became the state flower. The North Star stood for Alaska's future as the northernmost state. The design became the territorial flag in 1927 and stayed when Alaska joined the Union in 1959."
      - "Texas uses a single large white star on a blue stripe beside white and red bands. The Lone Star flew over the Republic of Texas, and the current flag was adopted in 1839, six years before Texas became a state. That star gave Texas its nickname, the Lone Star State."

  - id: stars-with-meaning
    icon: "fa-solid fa-hashtag"
    title: "Indiana, Ohio, and Tennessee Star Counts"
    paragraphs:
      - "Indiana's 19 stars tell a story in rings. The 13 outer stars are the original colonies, the 5 inner stars are the next five states, and the large star above the torch is Indiana, the 19th state. Paul Hadley's design won a 1916 contest held by the Daughters of the American Revolution, and the state adopted it in 1917."
      - "Ohio flies the only state flag that is not a rectangle, a swallowtail shape called a burgee. Its blue triangle holds 17 white stars. Thirteen are grouped around the white circle with a red center, standing for the original colonies, and 4 more at the peak bring the total to 17, because Ohio was the 17th state. The design has stayed the same since 1902."
      - "Tennessee's 3 white stars sit inside a blue circle on a crimson field. They stand for the state's three grand divisions, East Tennessee in the mountains, Middle Tennessee around Nashville, and West Tennessee in the lowlands near the Mississippi River."

  - id: thirteen-stars
    icon: "fa-solid fa-flag-usa"
    title: "Georgia and Rhode Island: 13 Stars for 13 Colonies"
    paragraphs:
      - "Two original colonies put exactly 13 stars on their flags. Georgia's 2003 flag circles its coat of arms with a ring of 13 white stars in the blue canton. Rhode Island's flag, adopted in 1897, rings a gold anchor with 13 gold stars on a white field."
      - "Ohio and Indiana also start their counts with 13 stars for the colonies, then add stars for the states that joined after them."

  - id: one-star-flags
    icon: "fa-solid fa-map"
    title: "Flags With a Single Star"
    paragraphs:
      - "Seven state flags use one star. Texas has the most famous, the white Lone Star. California's red star sits in the upper corner above its grizzly bear and recalls the 1846 Bear Flag Revolt."
      - "Arizona's copper star honors copper mining and sits on 13 red and gold rays for the original colonies. Arizona mines more copper than any other state. North Carolina's white star sits between the letters N and C, above two dates from 1775 and 1776. Nevada's silver star sits above the words Battle Born."
      - "Minnesota and Utah are the newest single-star flags, both adopted in 2024. Minnesota's eight-pointed North Star comes from its motto L'Étoile du Nord, and Utah's star marks it as the 45th state."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Star Flag Facts"
    facts:
      - "Oregon has the most stars of any state flag, 33, one for each state in the Union when Oregon joined"
      - "Arkansas uses two star colors, 25 white stars around the edge and 4 blue stars inside the diamond"
      - "Six states count their stars to match their order of admission, Oregon, Arkansas, Missouri, Mississippi, Indiana, and Ohio"
      - "Alaska's flag was designed by a 13-year-old, Benny Benson, in 1927"
      - "Ohio is the only state with a non-rectangular flag, and its 17 stars have not changed since 1902"
      - "Arizona's flag was designed by Colonel Charles Harris for the state rifle team at the 1910 National Matches"

