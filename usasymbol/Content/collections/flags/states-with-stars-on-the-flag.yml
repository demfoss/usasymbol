page:
  h1: "Which State Flags Have Stars?"
  intro_title: "From Oregon's 33 Stars to Texas's Lone Star"

  quick_answer:
    - "Seventeen state flags use stars as a main design element. Ten of them carry several stars, and seven carry a single star."
    - "Oregon has the most stars of any state flag, with 33 gold stars circling its shield because Oregon was the 33rd state. Arkansas comes second with 29, and Missouri third with 24."
    - "Many flags count their stars to match the order the state joined the Union. Oregon (33rd), Arkansas (25th), Missouri (24th), Mississippi (20th), Indiana (19th), and Ohio (17th) all do this."
    - "Alaska's flag is the only one built from stars alone. Its 8 gold stars form the Big Dipper and the North Star."
    - "Texas, California, North Carolina, Arizona, Nevada, Minnesota, and Utah each fly a single star. Minnesota and Utah added theirs with new flags in 2024."

  methodology: "Flags were included when stars are a main, clearly visible part of the design. Tiny stars inside detailed state seals are not counted. Star counts and meanings follow each state's official flag description."
  sources:
    - name: "North American Vexillological Association (NAVA)"
      url: "https://nava.org/"
      description: "US state flag design history and vexillological analysis"
    - name: "Arkansas Secretary of State — Story of the Flag"
      url: "https://www.sos.arkansas.gov/education/arkansas-history/history-of-the-flag/story-of-the-flag"
      description: "Official description of the 29 stars on the Arkansas flag"
    - name: "Missouri Secretary of State — State Flag"
      url: "https://www.sos.mo.gov/symbol/flag"
      description: "Official description of the Missouri flag and its band of 24 stars"
    - name: "Ohio Revised Code Section 5.01"
      url: "https://codes.ohio.gov/ohio-revised-code/section-5.01"
      description: "Legal specification of the Ohio burgee and its 17 stars"
    - name: "State Government Official Sources"
      url: "https://www.usa.gov/states-and-territories"
      description: "Official state flag descriptions and adoption records"

