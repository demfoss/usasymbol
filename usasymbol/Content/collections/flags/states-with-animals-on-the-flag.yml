sections:
  - id: interactive-map-intro
    icon: "fa-solid fa-map"
    title: "Interactive Map: US State Flags Featuring Animals"
    paragraphs:
      - "The map below highlights every US state whose official flag features an animal — tracing the geographic distribution of wildlife symbolism across American vexillology, from the Pacific grizzly to the Gulf Coast pelican."

  - id: table-intro
    icon: "fa-solid fa-table"
    title: "State-by-State Reference: Animals on US Flags"
    paragraphs:
      - "Each entry includes the animal species, its position on the flag (dominant design vs. buried in a seal), and the year the flag was adopted — three details that together tell you how prominent the animal actually is."

  - id: iconic-mammals
    icon: "fa-solid fa-paw"
    img: california-bear-flag
    title: "California and Wyoming: The Only States Where the Animal IS the Flag"
    paragraphs:
      - "Two US state flags place a single mammal at their absolute center — not within a seal, not as a heraldic supporter, but as the entire point of the flag. California's **grizzly bear** and Wyoming's **American bison** are the only two states where the animal IS the flag."
    subsections:
      - subtitle: "California: The Grizzly Bear"
        text: "The **California state flag** — known simply as the Bear Flag — features a **California grizzly bear** (*Ursus arctos californicus*) walking left across a strip of green grass on a white field. Below the bear, the words **CALIFORNIA REPUBLIC** appear in bold black capitals. The design traces to the Bear Flag Revolt of June 14, 1846, when American settlers briefly declared independence from Mexico in Sonoma and raised a handmade grizzly flag. The bear was officially standardized in 1953 based on illustrations of **Monarch**, the last California grizzly in captivity. The California grizzly has been extinct since 1922 — making the Bear Flag part memorial, part symbol. See the [California Bear Flag history and meaning](/states/california/flag/california-state-flag) for the full story."
      - subtitle: "Wyoming: The American Bison"
        text: "Wyoming's flag shows a large **white American bison** (*Bison bison*) silhouette at center on a blue field, framed by a red and white border. The bison carries the **state seal** on its body — a design detail that is easy to miss at a distance. Verna Keays of Buffalo, Wyoming designed it after winning a 1916 Daughters of the American Revolution contest; the flag was adopted on January 31, 1917. The bison is also the **national mammal of the United States** (since 2016) and the state mammal of Wyoming, Kansas, and Oklahoma. See the [Wyoming bison flag history and meaning](/states/wyoming/flag/wyoming-state-flag)."

  - id: oregon-beaver-flag
    icon: "fa-solid fa-arrows-rotate"
    img: oregon-flag-reverse
    title: "The Only Two-Sided State Flag: Oregon's Beaver"
    paragraphs:
      - "Oregon holds a unique distinction in American vexillology: it is the **only US state with a completely different design on each side of its flag**. The **obverse side** (front) — the side displayed on a standard flag pole — features the state seal on a navy blue background, with a bald eagle at the top of the shield. Turn the flag over, and the eagle is gone. The **reverse side** shows only a **golden beaver** on the same navy field."
      - "The **North American beaver** (*Castor canadensis*) has been Oregon's official state animal since 1969, but its appearance on the flag predates that designation by 44 years — the beaver was added to the reverse side when the [Oregon state flag](/states/oregon/flag/oregon-state-flag) was adopted in 1925, so that the flag would read clearly from both sides on parade floats and public buildings. Because both faces must be separately printed, Oregon's flag costs more to manufacture than any single-sided design. No other state flag places an animal exclusively on the **reverse side**."
    subsections:
      - subtitle: "Why Does Oregon Have Two Flag Sides?"
        text: "The two-sided design was a practical decision made at the time of the flag's 1925 adoption. A flag displaying only the state seal on one side would show an awkward mirror image of the seal on the reverse — difficult to read and visually confusing. Rather than accept a mirror, Oregon chose a completely different reverse design: the state animal on a plain field. The result is a flag that requires double the printing cost but delivers a fully legible, meaningful image on both faces."

  - id: moose-badger-elk
    icon: "fa-solid fa-tree"
    img: wisconsin-badger-detail
    title: "Flags with Moose, Badgers, and Elk"
    paragraphs:
      - "California's grizzly and Wyoming's bison are impossible to miss. The animals on the next tier are different: a moose reclining inside a coat of arms, an elk head rising above a shield, a badger perched at the apex of heraldic design. You need to know where to look — but they were placed there intentionally."
    subsections:
      - subtitle: "Maine: The Moose and the 2024 Referendum"
        text: "Maine's state flag features the **state coat of arms** on a blue field. At the center of that coat of arms, a **moose** reclines beneath a towering pine tree — a scene that captures Maine's northwoods identity in a single image. A farmer and a sailor flank the shield as supporters, and the North Star appears above with the motto *Dirigo* ('I Lead'). Maine's moose has endured longer than most state flag debates: in **November 2024**, Maine held a statewide **flag referendum** asking voters whether to adopt a simpler pine tree design. Voters chose to **keep the current moose and pine tree design**, rejecting the proposed redesign. The moose stays. The [Maine state flag and 2024 referendum history](/states/maine/flag/maine-state-flag) page documents the full story."
      - subtitle: "Michigan: Elk and Moose as Heraldic Supporters"
        text: "Michigan's flag shows the **state coat of arms** on a dark blue field, with an **elk** on the left and a **moose** on the right as heraldic shield-supporters — the only US state flag to show both animals at once. Above the shield, a bald eagle serves as the crest, making Michigan's flag the only one with three distinct animals. Full details on the [Michigan state flag](/states/michigan/flag/michigan-state-flag)."
      - subtitle: "Wisconsin: The Badger Above the Shield"
        text: "Wisconsin's flag carries the **state coat of arms** — and directly above the shield, at the very apex of the heraldic design, sits a **badger**. The badger is Wisconsin's most distinctive heraldic animal: its elevated position above the shield gives it a prominence that surpasses even the human supporters flanking the shield below. The badger earned Wisconsin its nickname — 'The Badger State' — from the lead miners who burrowed into hillsides for winter shelter in the early 19th century. The [Wisconsin state flag with badger crest history](/states/wisconsin/flag/wisconsin-state-flag) has carried the badger since 1863."

  - id: agricultural-animals
    icon: "fa-solid fa-wheat-awn"
    title: "Agricultural Animals on State Seals"
    paragraphs:
      - "Not every flag animal is a predator or a symbol of wilderness. Delaware's ox and Idaho's elk speak to working landscapes — the ox-powered farms of a first-state colony, the elk herds above a Rocky Mountain mining camp. Both are buried deep inside state seals, invisible from 30 feet, but deliberate choices by the legislatures that put them there."
    subsections:
      - subtitle: "Delaware: The Ox"
        text: "Delaware's flag displays the **state coat of arms** on a buff diamond background — one of the few US state flags not using blue as a field color. Inside the central shield, an **ox** fills the lower-left quadrant. Delaware ratified the US Constitution on December 7, 1787, making it the first state, and its coat of arms dates to that founding period. The ox was a practical choice: Delaware's colonial economy ran on livestock and grain farming. The [Delaware state flag](/states/delaware/flag/delaware-state-flag) is also notable for its colonial buff background, which makes the coat of arms easier to read than the typical dark-blue seal-on-blue design."
      - subtitle: "Idaho: Elk and Horse"
        text: "Idaho's flag shows the **state coat of arms** on a blue field, with an **elk head** as the crest above the central shield — the element that most clearly identifies the flag from a distance. The shield packs in mountains, forests, a steamer on the river, and a woman holding scales and a torch. A **horse** appears within the wider seal composition. Idaho adopted this flag in 1907, and the elk crest has remained unchanged. See the [Idaho state flag](/states/idaho/flag/idaho-state-flag) for the full breakdown of the seal elements."

  - id: missouri-bears
    icon: "fa-solid fa-shield"
    title: "Missouri: Three Hidden Grizzly Bears"
    paragraphs:
      - "Missouri's flag is a horizontal **tricolor** of red, white, and blue — but its animal symbolism is one of the richest of any state flag. The **state seal** at the center contains **three grizzly bears**: two stand upright as heraldic **shield-holders** on either side of the central shield, and a third grizzly appears depicted within the inner shield itself."
      - "The bears were added to the Missouri state seal in 1822 — one year after statehood — to represent the strength of Missouri's frontier citizens. When the flag was formally adopted in 1913, the seal came with it, bears and all. From any practical viewing distance, the grizzlies disappear into the heraldic detail. You have to know they're there. For the full story, see the guide to [US state flags with bears](/collections/flags/states-with-bears-on-the-flag)."

  - id: bird-flags-overview
    icon: "fa-solid fa-feather"
    title: "State Flags with Birds: Eagles and Pelicans"
    paragraphs:
      - "Eight US state flags feature the **bald eagle** — *Haliaeetus leucocephalus* — embedded in state seals and coats of arms: Illinois, Iowa, Michigan, New York, North Dakota, Oregon (obverse only), Pennsylvania, and Utah. The eagle's presence on these flags traces directly to the **Great Seal of the United States** (1782), which established the bald eagle as the national emblem. State seal designers in the late 18th and early 19th centuries adopted the eagle as a declaration of federal patriotism — and when states formalized flags, the eagle came with them."
      - "**Louisiana** stands alone as the only state flag featuring a bird other than the bald eagle: the **brown pelican** in the ancient heraldic pose of **'pelican in her piety.'** Louisiana inherited this symbol from French colonial heraldry — the pelican appears on Louisiana's territorial seal of 1804, a full eight years before statehood. See the [Louisiana pelican flag history and meaning](/states/louisiana/flag/louisiana-state-flag) for the full story. For a complete guide to all nine bird flags, see [US state flags with birds](/collections/flags/states-with-birds-on-the-flag). For the eight eagle states specifically, see [US state flags with eagles](/collections/flags/states-with-eagles-on-the-flag)."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Animal Flags"
    facts:
      - "California and Wyoming are the only two states where a single animal IS the dominant design of the entire flag"
      - "Oregon's beaver appears only on the reverse side — invisible when the flag is displayed front-facing on a standard flagpole"
      - "Maine's moose survived a 2024 statewide referendum — voters chose to keep the current moose and pine tree design"
      - "Wisconsin's badger has the highest heraldic position of any state animal — it sits above the state shield"
      - "Missouri's state flag technically contains three grizzly bears — two as shield-holders and one depicted within the inner shield"
      - "The California grizzly depicted on the Bear Flag has been extinct since 1922"
      - "The 2024 redesigns of Minnesota and Utah flags removed all animal imagery from those states' official flags"
      - "The bald eagle is the most common animal on US state flags — appearing on 8 of 50"
      - "Wyoming's bison carries the state seal on its body — a flag within a flag concept"
      - "Delaware's flag uses a colonial buff (tan) diamond background — one of only two US state flags not using blue as a primary background color"


faq:
  - question: "Which state flag has a bear on it?"
    answer: "Two US state flags feature bears: California and Missouri. California's Bear Flag shows a California grizzly bear (Ursus arctos californicus) as the central and dominant design — the most famous animal flag in the United States. Missouri's flag shows two grizzly bears as heraldic shield-holders on the state seal, with a third bear depicted within the inner shield. For the full history of both, see the complete guide to US state flags with bears."

  - question: "Which state flag has a buffalo (bison) on it?"
    answer: "Wyoming is the only US state flag featuring an American bison (Bison bison). The flag shows a large white bison silhouette at the center of a blue field, with the state seal imprinted on the bison's body. Verna Keays designed it after winning a 1916 DAR contest; the flag was adopted January 31, 1917. The North American Vexillological Association consistently ranks it among the most effective US state flag designs."

  - question: "Do the new Minnesota and Utah flags feature animals?"
    answer: "No. Both the 2024 Minnesota flag and the 2024 Utah flag removed animal imagery from their designs. Minnesota's new flag features a stylized eight-pointed North Star on a dark blue and light blue background — no animals of any kind. The common loon, Minnesota's state bird, now appears only on the state seal, which is no longer displayed on the flag. Utah's new flag centers on a beehive, a sego lily, and a star — geometric and botanical symbols with no animals. Both redesigns were part of a broader movement to simplify seal-on-blue state flags."

  - question: "What US state flag has an animal on both sides?"
    answer: "Oregon is unique — it is the only US state flag with two completely different designs, each featuring a different animal. The obverse (front) shows the state seal, which includes a bald eagle. The reverse shows a golden beaver. No other state flag has an animal on both sides, or any animal that appears only on the reverse."

  - question: "Which US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals. The most prominent include: California (grizzly bear), Wyoming (American bison), Louisiana (brown pelican), Oregon (beaver on reverse side), Maine (moose on state seal), Missouri (grizzly bears on state seal), Michigan (elk and moose on coat of arms), Wisconsin (badger above shield), Delaware (ox on shield), and Idaho (elk crest). Eight additional states feature the bald eagle on their flags: Illinois, Iowa, Michigan, New York, North Dakota, Oregon, Pennsylvania, and Utah."

  - question: "What is the only US state flag with a beaver on it?"
    answer: "Oregon is the only US state flag featuring a beaver — but it appears only on the reverse (back) side of the flag. The front of Oregon's flag shows the state seal with a bald eagle. Oregon is the only US state flag with two completely different designs on each side, making it the most expensive state flag to produce."

  - question: "Which US state flag has a moose on it?"
    answer: "Maine's state flag features a moose within the state coat of arms — reclining beneath a pine tree at the center of the shield. In November 2024, Maine voters held a referendum on whether to change the flag design. They voted to keep the current moose and pine tree design. Michigan's flag also features a moose as one of two heraldic shield-supporters on the state coat of arms (alongside an elk)."

  - question: "How many US state flags have the bald eagle?"
    answer: "Eight US state flags feature the bald eagle: Illinois, Iowa, Michigan, New York, North Dakota, Oregon (obverse side only), Pennsylvania, and Utah. The bald eagle is the most common animal on US state flags, tracing its presence to the Great Seal of the United States (1782). For a complete guide to all eight, see the full article on US state flags with eagles."
