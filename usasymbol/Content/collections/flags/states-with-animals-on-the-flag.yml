seo:
  title: "All US State Flags with Animals: The Complete Guide (Bears, Bison & More)"
  description: "Which US state flags have animals? From California's grizzly bear and Wyoming's bison to Oregon's beaver and Wisconsin's badger — the complete guide with table, map, and FAQ."

hero_image: "/images/flags/wyoming/flag.webp"
hero_image_alt: "Wyoming state flag featuring a white American bison silhouette — the most prominent animal-flag design in the United States"
hero_image_caption: "Wyoming's flag is one of the boldest animal designs in American vexillology — a white bison silhouette that dominates the entire blue field, with the state seal imprinted on the bison's body."

page:
  h1: "All US State Flags with Animals: The Complete Guide"
  intro_title: "Bears, Bison, Eagles, and the Animals Hidden in State Seals"

  quick_answer:
    - "More than a dozen US state flags feature animals — from California's grizzly bear and Wyoming's American bison to Louisiana's brown pelican and Wisconsin's badger."
    - "California and Wyoming are the only states with a single dominant animal as the primary flag design. All other state animals appear within incorporated state seals or coats of arms."
    - "Oregon's beaver appears only on the reverse side of its two-sided flag — the front shows the state seal. Oregon is the only US state with two different flag designs."
    - "The 2024 flag redesigns for Minnesota and Utah removed animals from their flags. Both new designs use geometric symbols and no longer display state seals."
    - "Eight state flags feature the bald eagle — the most common animal on US state flags by a wide margin."

  methodology: >
    All 50 US state flags were cross-referenced against official state statutes, North American Vexillological
    Association (NAVA) design records, and each state's Secretary of State office. Animal imagery was assessed
    across both primary flag designs and incorporated state seals and coats of arms, including heraldic supporters.

  sources:
    - name: "North American Vexillological Association (NAVA)"
      url: "https://nava.org/"
    - name: "Congressional Research Service — The Great Seal of the United States"
      url: "https://crsreports.congress.gov/product/pdf/RL/98-4"
    - name: "California State Library — State Symbols"
      url: "https://www.library.ca.gov/california-history/state-symbols/"
    - name: "Wyoming Secretary of State — State Flag"
      url: "https://sos.wyo.gov/Services/StateInfo_Symbols.aspx"
    - name: "Oregon Blue Book — State Flag"
      url: "https://sos.oregon.gov/blue-book/Pages/state/symbols/flag.aspx"
