sections:
  - id: table-intro
    icon: "fa-solid fa-table"
    title: "State-by-State Reference: Animals on US Flags"
    paragraphs:
      - "Each entry includes the animal species, its position on the flag (dominant design vs. buried in a seal), and the year the flag was adopted — three details that together tell you how prominent the animal actually is."

  - id: iconic-mammals
    icon: "fa-solid fa-paw"
    title: "California and Wyoming: Animal-First Flag Designs"
    paragraphs:
      - "Two US state flags place a single mammal at the center of the design rather than inside a seal: California's grizzly bear and Wyoming's American bison."
    subsections:
      - subtitle: "California: The Grizzly Bear"
        text: "The California state flag features a California grizzly bear (*Ursus arctos californicus*) walking across a white field above the words CALIFORNIA REPUBLIC. The design traces to the Bear Flag Revolt of June 14, 1846, and was standardized in 1953 from illustrations of Monarch, the last California grizzly in captivity. The California grizzly has been extinct since 1922."
      - subtitle: "Wyoming: The American Bison"
        text: "Wyoming's flag shows a large white American bison (*Bison bison*) silhouette at center on a blue field, framed by a red and white border. The bison carries the state seal on its body. Verna Keays of Buffalo, Wyoming designed it after winning a 1916 Daughters of the American Revolution contest; the flag was adopted on January 31, 1917. The bison is also the national mammal of the United States (since 2016) and the state mammal of Wyoming, Kansas, and Oklahoma."

  - id: oregon-beaver-flag
    icon: "fa-solid fa-arrows-rotate"
    title: "The Only Two-Sided State Flag: Oregon's Beaver"
    paragraphs:
      - "Oregon holds a unique distinction in American vexillology: it is the only US state with a completely different design on each side of its flag. The obverse side (front) — the side displayed on a standard flag pole — features the state seal on a navy blue background, with a bald eagle at the top of the shield. Turn the flag over, and the eagle is gone. The reverse side shows only a golden beaver on the same navy field."
      - "The North American beaver (*Castor canadensis*) has been Oregon's official state animal since 1969, but its appearance on the flag predates that designation by 44 years — the beaver was added to the reverse side when the [Oregon state flag](/states/oregon/flag/oregon-state-flag) was adopted in 1925, so that the flag would read clearly from both sides on parade floats and public buildings. Because both faces must be separately printed, Oregon's flag costs more to manufacture than a single-sided design."
    subsections:
      - subtitle: "Why Does Oregon Have Two Flag Sides?"
        text: "The two-sided design was a practical decision made at the time of the flag's 1925 adoption. A flag displaying only the state seal on one side would show a mirror image of the seal on the reverse. Oregon instead chose a separate reverse design: the state animal on a plain field. The result is a flag that requires printing two different faces."

  - id: moose-badger-elk
    icon: "fa-solid fa-tree"
    title: "Flags with Moose, Badgers, and Elk"
    paragraphs:
      - "California's grizzly and Wyoming's bison are impossible to miss. The animals on the next tier are different: a moose reclining inside a coat of arms, an elk head rising above a shield, a badger perched at the apex of heraldic design. You need to know where to look — but they were placed there intentionally."
    subsections:
      - subtitle: "Maine: The Moose and the 2024 Referendum"
        text: "Maine's state flag features the state coat of arms on a blue field. At the center of that coat of arms, a moose reclines beneath a pine tree. A farmer and a sailor flank the shield as supporters, and the North Star appears above with the motto *Dirigo* ('I Lead'). In November 2024, Maine held a statewide flag referendum asking voters whether to adopt a simpler pine tree design. Voters chose to keep the current moose and pine tree design."
      - subtitle: "Michigan: Elk and Moose as Heraldic Supporters"
        text: "Michigan's flag shows the state coat of arms on a dark blue field, with an elk on the left and a moose on the right as heraldic shield-supporters. Above the shield, a bald eagle serves as the crest, so Michigan's flag includes three animal figures."
      - subtitle: "Wisconsin: The Badger Above the Shield"
        text: "Wisconsin's flag carries the state coat of arms. Directly above the shield sits a badger, matching Wisconsin's 'Badger State' nickname. The nickname traces to lead miners who burrowed into hillsides for winter shelter in the early 19th century."

  - id: agricultural-animals
    icon: "fa-solid fa-wheat-awn"
    title: "Agricultural Animals on State Seals"
    paragraphs:
      - "Delaware's ox and Idaho's elk are seal details rather than central flag designs. Both are hard to see at distance, but each is part of the official coat of arms shown on the flag."
    subsections:
      - subtitle: "Delaware: The Ox"
        text: "Delaware's flag displays the state coat of arms on a buff diamond background. Inside the central shield, an ox fills the lower-left quadrant. Delaware ratified the US Constitution on December 7, 1787, making it the first state, and the ox points to the livestock and grain farming in the state's early economy."
      - subtitle: "Idaho: Elk and Horse"
        text: "Idaho's flag shows the state coat of arms on a blue field, with an elk head as the crest above the central shield. The shield also includes mountains, forests, a steamer on the river, and a woman holding scales and a torch. A horse appears within the wider seal composition. Idaho adopted this flag in 1907."

  - id: missouri-bears
    icon: "fa-solid fa-shield"
    title: "Missouri: Three Hidden Grizzly Bears"
    paragraphs:
      - "Missouri's flag is a horizontal tricolor of red, white, and blue. The state seal at the center contains three grizzly bears: two stand upright as heraldic shield-holders on either side of the central shield, and a third grizzly appears within the inner shield."
      - "The bears were added to the Missouri state seal in 1822 — one year after statehood — to represent the strength of Missouri's frontier citizens. When the flag was formally adopted in 1913, the seal came with it. From normal flag-viewing distance, the grizzlies disappear into the heraldic detail."

  - id: bird-flags-overview
    icon: "fa-solid fa-feather"
    title: "State Flags with Birds: Eagles and Pelicans"
    paragraphs:
      - "Nine US state flags feature the bald eagle — *Haliaeetus leucocephalus* — embedded in state seals and coats of arms: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon (obverse only), Pennsylvania, and Wyoming. The eagle's presence on these flags traces directly to the Great Seal of the United States (1782), which established the bald eagle as the national emblem."
      - "Louisiana is the only current state flag featuring a bird other than the bald eagle: the brown pelican in the heraldic pose of 'pelican in her piety.' Louisiana inherited this symbol from French colonial heraldry — the pelican appears on Louisiana's territorial seal of 1804, a full eight years before statehood. See [US state flags with birds](/collections/flags/states-with-birds-on-the-flag) for the ten bird flags and [US state flags with eagles](/collections/flags/state-flags-with-eagles) for the nine eagle states."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts About Animal Flags"
    facts:
      - "California and Wyoming are the only two states where a single animal IS the dominant design of the entire flag"
      - "Oregon's beaver appears only on the reverse side — invisible when the flag is displayed front-facing on a standard flagpole"
      - "Maine's moose survived a 2024 statewide referendum — voters chose to keep the current moose and pine tree design"
      - "Wisconsin's badger has the highest heraldic position of any state animal — it sits above the state shield"
      - "Missouri's state flag technically contains three grizzly bears — two as shield-holders and one depicted within the inner shield"
      - "The California grizzly depicted on the Bear Flag has been extinct since 1922"
      - "The 2024 redesigns of Minnesota and Utah flags removed all animal imagery from those states' official flags"
      - "The bald eagle is the most common animal on US state flags — appearing on 9 of 50"
      - "Wyoming's bison carries the state seal on its body — a flag within a flag concept"
      - "Delaware's flag uses a colonial buff (tan) diamond background — one of only two US state flags not using blue as a primary background color"


faq:
  - question: "Which state flag has a bear on it?"
    answer: "Two US state flags feature bears: California and Missouri. California's Bear Flag shows a California grizzly bear (Ursus arctos californicus) as the central design. Missouri's flag shows two grizzly bears as heraldic shield-holders on the state seal, with a third bear depicted within the inner shield."

  - question: "Which state flag has a buffalo (bison) on it?"
    answer: "Wyoming is the only US state flag featuring an American bison (Bison bison). The flag shows a large white bison silhouette at the center of a blue field, with the state seal imprinted on the bison's body. Verna Keays designed it after winning a 1916 DAR contest; the flag was adopted January 31, 1917."

  - question: "Do the new Minnesota and Utah flags feature animals?"
    answer: "No. Both the 2024 Minnesota flag and the 2024 Utah flag removed animal imagery from their designs. Minnesota now uses an eight-pointed North Star, while Utah centers a beehive, sego lily, and star. Both redesigns moved away from seal-on-blue flags."

  - question: "What US state flag has an animal on both sides?"
    answer: "Oregon is the only US state flag with two completely different designs, each featuring a different animal. The obverse (front) shows the state seal, which includes a bald eagle. The reverse shows a golden beaver."

  - question: "Which US state flags have animals on them?"
    answer: "More than a dozen US state flags feature animals. The most prominent include California (grizzly bear), Wyoming (American bison), Louisiana (brown pelican), Oregon (beaver on reverse side), Maine (moose), Missouri (grizzly bears), Michigan (elk and moose), Wisconsin (badger), Delaware (ox), and Idaho (elk crest). Nine states feature the bald eagle on current flags: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon, Pennsylvania, and Wyoming."

  - question: "What is the only US state flag with a beaver on it?"
    answer: "Oregon is the only US state flag featuring a beaver, and it appears only on the reverse side. The front of Oregon's flag shows the state seal with a bald eagle. Oregon is the only US state flag with two completely different designs on each side."

  - question: "Which US state flag has a moose on it?"
    answer: "Maine's state flag features a moose within the state coat of arms — reclining beneath a pine tree at the center of the shield. In November 2024, Maine voters held a referendum on whether to change the flag design. They voted to keep the current moose and pine tree design. Michigan's flag also features a moose as one of two heraldic shield-supporters on the state coat of arms (alongside an elk)."

  - question: "How many US state flags have the bald eagle?"
    answer: "Nine US state flags feature the bald eagle: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, Oregon (obverse side only), Pennsylvania, and Wyoming. The bald eagle is the most common animal on US state flags, tracing its presence to the Great Seal of the United States (1782)."
