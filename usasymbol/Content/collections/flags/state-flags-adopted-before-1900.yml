sections:
  - id: "pre-1900-state-flags"
    icon: "fa-solid fa-clock-rotate-left"
    style: "law-cards"
    title: "State Flags First Adopted Before 1900"
    paragraphs:
      - "These nine states still fly a design that predates the 20th century. Three come from the founding and Civil War era, while the rest arrived in a wave of late-1890s statehouse action."
    subsections:
      - id: "texas"
        subtitle: "Texas"
        text: |-
          **Design lineage:** January 25, 1839
          **Legal note:** Statutory gap, 1879 to 1933

          The Republic of Texas approved the Lone Star flag in 1839, six years before Texas joined the Union. A broad 1879 law repeal left the flag without an explicit statute until Texas enacted a new flag code in 1933.

          Texas holds the oldest current design lineage of any state flag by more than a decade. Its position is unmatched even though a later statutory gap briefly interrupted formal recognition.
        anchor_phrases:
          - "oldest current design lineage"
      - id: "hawaii"
        subtitle: "Hawaii"
        text: |-
          **Current version since:** 1845
          **Governments represented:** Five

          Hawaii's Legislature dates the current design to 1845 and records that it was retained by the Kingdom, Provisional Government, Republic, Territory, and State of Hawaii in turn. Eight stripes and a Union Jack canton survived each transition of government.

          Hawaii belongs on this list because no other state flag has a documented record of continuous use across five distinct governments. That unbroken thread makes it the clearest 19th-century survivor after Texas.
      - id: "south-carolina"
        subtitle: "South Carolina"
        text: |-
          **Current configuration since:** January 28, 1861
          **Older source design:** 1775

          South Carolina's General Assembly combined a palmetto tree with William Moultrie's Revolutionary-era crescent banner and adopted the resulting flag on January 28, 1861. The tree commemorates the palmetto-log fort that withstood a British naval bombardment in 1776.

          South Carolina qualifies from its 1861 adoption date, not the earlier 1775 crescent design that inspired it. Separating inspiration from formal adoption keeps the flag's age accurate.
      - id: "virginia"
        subtitle: "Virginia"
        text: |-
          **Design lineage:** 1861
          **Latest specification:** 1950

          Virginia adopted a seal-on-blue flag in 1861, showing the goddess Virtus standing over a defeated tyrant beneath the motto SIC SEMPER TYRANNIS. The current statutory wording that governs its exact appearance dates to the 1950 Code of Virginia.

          Virginia earns its place because the seal-and-motto composition has stayed intact for more than 160 years, even as lawmakers refined the legal description around it.
      - id: "north-carolina"
        subtitle: "North Carolina"
        text: |-
          **Design lineage:** 1885
          **Latest milestone:** 1991

          North Carolina fixed its current star, the initials N and C, and its red-over-white color bars in 1885. Two gold ribbons carry the dates of the Mecklenburg Declaration and the Halifax Resolves, both tied to the state's Revolutionary War history.

          North Carolina makes the list because the 1885 statute, not the earlier Revolutionary dates it references, is what set the modern flag. Lawmakers only adjusted proportions afterward, in 1991.
      - id: "alabama"
        subtitle: "Alabama"
        text: |-
          **Design lineage:** 1895
          **Defining feature:** Crimson saint andrew's cross

          Alabama's legislature adopted a crimson diagonal cross on a white field in 1895, one of the simplest state flag designs in the country. The cross shape echoes the Confederate battle flag's saltire without reproducing its colors or stars.

          Alabama rounds out the pre-1900 group with the plainest geometry on this list. A single cross and two colors have needed no redesign since the 19th century.

  - id: "why-these-flags-are-old"
    icon: "fa-solid fa-scroll"
    title: "Why Nine States Kept Their 19th-Century Flags"
    paragraphs:
      - "Six of the nine states adopted their current designs in a short stretch between the Civil War and the 1890s, when many states first codified an official flag rather than relying on militia banners or informal usage."
      - "Longevity does not mean the designs are frozen in time. Connecticut amended its flag and arms statute in 1990, North Carolina adjusted proportions in 1991, and Virginia's governing statute dates to 1950, even though each state's core imagery has not changed since the 19th century."
      - "No state on this list has reopened a full redesign process in the way Mississippi, Utah, and Minnesota did in the 2020s. Their flags remain the longest continuously recognized state symbols in the country."

  - id: "old-state-flag-facts"
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Facts About the Oldest State Flags"
    facts:
      - "Texas has flown a version of its Lone Star flag for 187 years, longer than any other current state flag design."
      - "Hawaii's flag is the only state banner recorded as serving five different governments."
      - "South Carolina's palmetto tree commemorates a 1776 naval battle, but the flag itself was not adopted until 1861."
      - "Alabama's 1895 crimson cross remains one of only two current state flags built from a single geometric symbol without a seal, star field, or lettering."
      - "New Jersey, Connecticut, and Rhode Island all adopted their current flags within two years of each other, between 1896 and 1897."

faq:
  - question: "Which U.S. state flag is the oldest?"
    answer: "Texas has the oldest current state flag design. The Republic of Texas approved the Lone Star flag on January 25, 1839, more than 20 years before any other state on this list adopted its current design."
  - question: "How many state flags date to before 1900?"
    answer: "Nine current state flags trace their design to before 1900: Texas, Hawaii, South Carolina, Virginia, North Carolina, Alabama, New Jersey, Connecticut, and Rhode Island."
  - question: "Is Hawaii's flag older than Texas's flag?"
    answer: "No. Texas adopted the Lone Star design in 1839, six years before Hawaii's Legislature dates its current flag to 1845. Hawaii's record is notable instead for surviving five separate governments unchanged."
  - question: "Did any of these flags change after 1900?"
    answer: "The core imagery has not changed, but several states updated the legal description around it. Connecticut amended its flag and arms statute in 1990, and North Carolina adjusted its proportions in 1991, without altering the historic design itself."
  - question: "Why did so many states adopt flags in the 1890s?"
    answer: "New Jersey, Connecticut, and Rhode Island all codified their current designs between 1896 and 1897, part of a broader national trend of states formally adopting an official flag for the first time rather than relying on militia or ceremonial banners."
  - question: "Are any pre-1900 state flags being considered for redesign?"
    answer: "None of the nine states on this list has an active flag redesign process underway, unlike Massachusetts, which is reviewing a possible new flag as of 2026. Their 19th-century designs remain unchanged."

