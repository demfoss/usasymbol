      description: "Statutory history of the 1885 flag design"
    - name: "Connecticut General Statutes, Sections 3-105 and 3-107"
      url: "https://www.cga.ct.gov/current/pub/chap_033.htm"
      description: "Official flag and arms descriptions with adoption history"

