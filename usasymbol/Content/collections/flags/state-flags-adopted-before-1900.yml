page:
  h1: "Which State Flags Were Adopted Before 1900?"
  intro_title: "Nine Current State Flags With a 19th-Century Design"

  quick_answer:
    - "Texas has the oldest current state flag design. The Republic of Texas approved the Lone Star flag on January 25, 1839, six years before statehood."
    - "Hawaii's flag dates to 1845 and survived five different governments. South Carolina, Virginia, and North Carolina followed with Civil War and Reconstruction-era designs."
    - "Alabama, New Jersey, Connecticut, and Rhode Island close out the list, all adopting their current designs in the final years of the 1890s."

  methodology: "A flag qualifies when the recognizable basis of its current design first became an official flag before January 1, 1900. Later specification updates, such as fixed proportions or standardized colors, do not remove a state from this list as long as the original design lineage survived. A design that was replaced and later restored counts from its most recent adoption, not its first appearance."

  sources:
