sections:
  - id: people-overview
    icon: "fa-solid fa-person"
    title: "State Flags With Human Figures List"
    highlights:
      - name: "Virginia — Virtus, the Warrior Who Defeats a King"
        image: "/images/flags/virginia/flag.webp"
        description: "**Who:** Virtus, a female warrior from classical Roman personification — not a historical person. She stands over a fallen king whose crown has rolled away, sword dropped, chain broken. **Why:** Virginia's 1776 designers wanted a flag that declared the end of tyranny. The motto below — 'Sic Semper Tyrannis' — frames the entire scene. Unchanged in 250 years."
      - name: "Massachusetts — Native American with a Bow"
        image: "/images/flags/massachusetts/flag.webp"
        description: "**Who:** A figure from the Massachusett tribe, holding a bow with the arrow pointing downward. **Why:** The downward arrow signals peaceful intent; a bent arm brandishing a sword above the shield signals courage. Massachusetts is the only US state flag where an Indigenous person is the central coat of arms figure. The design has been the subject of redesign discussions."
      - name: "New York — Liberty and Justice"
        image: "/images/flags/new-york/flag.webp"
        description: "**Who:** Liberty (with pole and Phrygian cap) on the left, Justice (blindfolded, with scales) on the right — allegorical shield-supporters. **Why:** Designed in 1778 to represent the two pillars of civil society in the new republic. New York's coat of arms is among the oldest in continuous use of any US state."
      - name: "New Jersey — Liberty and Ceres"
        image: "/images/flags/new-jersey/flag.webp"
        description: "**Who:** Liberty holding a cornucopia on the left, Ceres (Roman goddess of grain) wearing a helmet on the right. **Why:** Ceres was chosen to represent New Jersey's agricultural identity — the 'Garden State' nickname predates its official adoption by decades. Design dates to 1896."
      - name: "Delaware — Farmer and Soldier"
        image: "/images/flags/delaware/flag.webp"
        description: "**Who:** A farmer with a hoe and a soldier with a musket — historically grounded figures, not allegorical. **Why:** Agriculture and military service were Delaware's two colonial identities. Delaware's regiment was one of the most decorated in the Continental Army. First state to ratify the Constitution (1787)."
      - name: "Idaho — A Woman with Scales and Torch"
        image: "/images/flags/idaho/flag.webp"
        description: "**Who:** A woman representing Liberty and Justice, prominently in the foreground of the state seal. **Why:** Idaho granted women the right to vote in 1896 — 24 years before the 19th Amendment. Her prominent placement was a deliberate recognition of that milestone. Adopted 1907."
      - name: "Oregon — Settlers and Miners"
        image: "/images/flags/oregon/flag.webp"
        description: "**Who:** Multiple settler figures — miners, a farmer, arriving ships, a wagon train — in the state seal's panoramic scene. **Why:** The 1925 designers wanted the flag to represent the industries and people who built Oregon: agriculture, commerce, mining, westward expansion."
      - name: "North Carolina — Liberty and Plenty"
        image: "/images/flags/north-carolina/flag.webp"
        description: "**Who:** Two allegorical women — Liberty (seated, with staff) and Plenty (with horn of abundance) — in the state seal. **Why:** Standard 18th-century heraldic symbolism representing the aspirations of statehood: freedom and prosperity. North Carolina adopted this flag in 1885."

  - id: virginia-virtus
    icon: "fa-solid fa-person-military-pointing"
    title: "Virginia Flag Human Figure"
    paragraphs:
      - "Virginia's state flag shows a circular seal on a blue field. At the center of the seal, a female warrior — Virtus, personifying Virtue — stands over a fallen king. The king lies on the ground, his crown rolled away, his chain broken. In one hand Virtus holds a spear; in the other, a sheathed sword. Below the scene: 'Sic Semper Tyrannis' (Thus always to tyrants)."
      - "The figure of Virtus was designed in 1776, making Virginia's flag one of the oldest continuous state flag designs in the United States. The imagery was explicitly political: the state was in the process of breaking from British rule, and the flag was meant to communicate that tyranny ends with defeat. Virtus is derived from classical Roman personification — the concept of virtue or 'manly excellence' was frequently depicted as a female figure in Roman and Renaissance art. She appears in armor rather than robes to emphasize active courage rather than passive virtue."
      - "The motto gained a darker resonance in 1865. John Wilkes Booth reportedly shouted 'Sic Semper Tyrannis' after shooting Abraham Lincoln at Ford's Theatre. Booth had cast himself as a patriot liberating the South — the flag had given him a historical script. Virginia has never changed the design."

  - id: idaho-oregon
    icon: "fa-solid fa-venus"
    title: "Idaho and Oregon Flag Human Figures"
    paragraphs:
      - "Idaho's flag shows the state seal on a blue field. The seal features a woman holding scales and a torch — a figure representing Liberty and Justice — prominently in the foreground. The woman's presence is historically significant: Idaho granted women the right to vote in 1896, 24 years before the 19th Amendment. The inclusion of a female figure in the state seal at that time was a deliberate acknowledgment."
      - "Oregon's flag (front side) shows the state seal, which depicts a settler scene: miners, a farmer, a wagon train, a ship arriving at the coast, and an eagle above. The figures represent the industries and settlers who built Oregon. At the time of adoption (1925), the image was meant to convey progress and western expansion."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Human Figure Flag Facts"
    facts:
      - "Virginia's Virtus is the only flag figure depicted in the act of defeating a specific opponent (a fallen tyrannical king)"
      - "Massachusetts's Native American figure is the only indigenous person depicted as the central figure on a US state flag"
      - "Virginia's flag design has not changed since 1776 — 250 years of an unaltered seal"
      - "Idaho's female figure was a deliberate recognition of Idaho's 1896 women's suffrage law"
      - "New York and New Jersey both use Liberty as a shield-supporter, but New York's Liberty holds a pole and cap; New Jersey's holds a cornucopia"
      - "Delaware is the only state flag to use a farmer and soldier — historical figures — rather than allegorical ones"
      - "John Wilkes Booth cited Virginia's motto 'Sic Semper Tyrannis' as his justification for assassinating Lincoln in 1865"
      - "Massachusetts's coat of arms and flag design have been the subject of redesign debates due to the colonial framing of the Native American figure"

