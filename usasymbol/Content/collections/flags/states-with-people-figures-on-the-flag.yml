faq:
  - question: "Which US state flags have human figures on them?"
    answer: "Eight US state flags feature human figures: Virginia (Virtus and a fallen king), Massachusetts (Native American with bow), New York (Liberty and Justice), New Jersey (Liberty and Ceres), Delaware (farmer and soldier), Idaho (woman with scales and torch), North Carolina (Liberty and Plenty in seal), and Oregon (settler figures in seal)."

  - question: "Which US state flag has a person being killed on it?"
    answer: "Virginia's flag shows a female warrior (Virtus) standing over a defeated tyrannical king — the only US state flag depicting one figure defeating another. The king lies on the ground with his crown dropped and chain broken. This is not death per se, but defeat — the motto 'Sic Semper Tyrannis' (Thus always to tyrants) frames the scene as a warning, not an execution."

  - question: "Which state flag has a Native American on it?"
    answer: "Massachusetts's state flag shows a Native American figure from the Massachusett tribe holding a bow, with the arrow pointing downward (a sign of peace). The figure has been on the Massachusetts flag since 1908 and has been the subject of redesign discussions due to the colonial framing of a Native American being depicted on a European-style coat of arms."

  - question: "What does the woman on the Virginia flag represent?"
    answer: "The woman on the Virginia flag is Virtus — an allegorical figure representing Virtue in the classical Roman tradition. She is depicted as a female warrior in armor, standing over a fallen tyrannical king. The scene illustrates the motto 'Sic Semper Tyrannis' (Thus always to tyrants) — the idea that tyranny will always be defeated. The design was adopted in 1776."
