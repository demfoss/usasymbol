sections:
  - id: "why-each-flag-changed"
    icon: "fa-solid fa-arrows-rotate"
    style: "law-cards"
    title: "Why Each State Changed Its Flag"
    paragraphs:
      - "The three changes share a 2020s timeframe but not a common motive. Mississippi's process began with a disputed historical symbol, while Utah's and Minnesota's began with a readability problem."
    subsections:
      - id: "mississippi"
        subtitle: "Mississippi"
        text: |-
          **Reason for change:** Removing the Confederate battle emblem
          **New flag official:** January 11, 2021

          Mississippi's 1894 flag was the last U.S. state flag to include the Confederate battle emblem in its canton. The state retired that flag on July 1, 2020, and a legislatively created commission narrowed nearly 3,000 public submissions to five finalists before voters chose the New Magnolia design on November 3, 2020.

          Mississippi belongs at the center of this story because its change addressed a specific, named symbol rather than a general design complaint. Governor Reeves described the old flag as a "roadblock to unity" when he signed the new one into law.
        anchor_phrases:
          - "Confederate battle emblem"
      - id: "utah"
        subtitle: "Utah"
        text: |-
          **Reason for change:** Replacing a hard-to-read seal design
          **New flag official:** March 9, 2024

          Utah's previous flag placed a detailed state seal on a blue field, a format state officials said blurred into a solid color patch at a distance or in wind. Governor Spencer Cox signed Senate Bill 31 in 2023, introducing a beehive, mountain peak, and red rock imagery built from simpler shapes.

          Utah shows a redesign driven by legibility rather than controversy. Cox called the new flag a symbol "with input from the people of Utah," while the law kept the former seal design in official use as the historic state flag.
        anchor_phrases:
          - "historic state flag"
      - id: "minnesota"
        subtitle: "Minnesota"
        text: |-
          **Reason for change:** Replacing a seal criticized for imagery and readability
          **New flag official:** May 11, 2024

          Minnesota's former flag reproduced a state seal that had drawn criticism for imagery some viewed as insensitive to Native American history, alongside the same at-a-distance readability problem seen in Utah's old design. The State Emblems Redesign Commission reviewed 2,128 public submissions and adapted a concept from 24-year-old designer Andrew Prekker.

          Minnesota's process stands out for its scale of public input. Commission chair Luis Fitch summarized the winning design's imagery simply: the Mississippi River pointing up to the North Star.
        anchor_phrases:
          - "North Star"

  - id: "how-the-three-changes-differ"
    icon: "fa-solid fa-code-compare"
    title: "How the Mississippi, Utah, and Minnesota Changes Differ"
    paragraphs:
      - "Mississippi required a statewide referendum after its commission narrowed the finalists, giving voters the final decision. Utah's legislature enacted a design directly through Senate Bill 31, without a public referendum. Minnesota delegated final design authority to a statutory commission rather than the legislature or the voters."
      - "Only Mississippi's process was driven primarily by objections to a specific symbol. Utah and Minnesota both centered their public complaints on distance readability, though Minnesota's former seal also drew criticism over its depiction of Native Americans."
      - "Utah is the only one of the three that formally preserved its previous flag in law. Mississippi's 1894 flag was fully retired, and Minnesota's earlier seal-based flag holds no comparable legal status today."

faq:
  - question: "Why did Mississippi change its state flag?"
    answer: "Mississippi changed its flag to remove the Confederate battle emblem, which had appeared on the state flag since 1894 and made it the last U.S. state flag to carry that symbol. Voters approved a replacement, the New Magnolia design, in a November 2020 referendum."
  - question: "Why did Utah change its state flag?"
    answer: "Utah replaced a flag that placed a detailed state seal on a blue field, a design state officials said was difficult to recognize at a distance or on moving fabric. The new beehive flag took effect March 9, 2024, and the former design remains Utah's legally recognized historic state flag."
  - question: "Why did Minnesota change its state flag?"
    answer: "Minnesota replaced a seal-based flag that had drawn criticism over its depiction of Native Americans and over general readability. A redesign commission reviewed 2,128 public submissions before finalizing a North Star design that became official May 11, 2024."
  - question: "Did voters get to choose the new Mississippi flag?"
    answer: "Yes. After a commission selected five finalist designs, Mississippi voters chose the New Magnolia flag in a statewide referendum on November 3, 2020, with about 73% approval."
  - question: "Did Utah or Minnesota hold a public vote on their new flags?"
    answer: "No. Utah's legislature enacted its beehive design through Senate Bill 31, and Minnesota's statutory redesign commission held final authority over the North Star design. Neither change went to a statewide referendum."
  - question: "Are Mississippi, Utah, and Minnesota the only states to recently change their flags?"
    answer: "They are the only states to complete a full flag replacement since 2020. Maine voters rejected a proposed flag change in 2024, and Illinois and Massachusetts have run public design reviews without enacting a new flag as of 2026."

