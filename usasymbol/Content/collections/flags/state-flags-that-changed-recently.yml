page:
  h1: "Why Did Mississippi, Utah, and Minnesota Change Their Flags?"
  intro_title: "The Story Behind Three State Flag Changes"

  quick_answer:
    - "Mississippi changed its flag to remove the Confederate battle emblem, the last U.S. state flag to carry it, after voters approved the New Magnolia design in November 2020."
    - "Utah and Minnesota both changed their flags because their previous seal-based designs were hard to recognize at a distance, not because of a disputed symbol."
    - "All three changes followed a public design process. Mississippi held a statewide referendum, Minnesota's commission reviewed public submissions, and Utah's legislature enacted a design developed with public input."

  methodology: "Cases were selected from states that fully replaced their official flag design between 2020 and 2026, using state legislation, referendum results, and commission records to document each reason for change and its adoption date."

