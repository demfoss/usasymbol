page:
  h1: "Former U.S. State Flags"
  intro_title: "Eight Historic Flags That Explain How Designs Change"

  quick_answer:
    - "Minnesota made the most recent major replacement, retiring its seal-based 1957 flag on May 11, 2024, for a simplified North Star design."
    - "Mississippi retired the last current state flag containing the Confederate battle emblem in 2020, then adopted the voter-approved New Magnolia flag in 2021."
    - "Maine's pine-and-star flag lasted only from 1901 to 1909, yet its continuing popularity brought a proposed restoration to voters in 2024."

  methodology: "This is a curated gallery, not a catalog of every official variation or unofficial banner. Entries were chosen when an authoritative state source documents the design and transition and a reliable local reconstruction is available. Dates describe the pictured version rather than every minor manufacturing change."

