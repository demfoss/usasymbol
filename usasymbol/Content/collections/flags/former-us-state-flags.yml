sections:
  - id: notable-former-state-flags
    icon: "fa-solid fa-clock-rotate-left"
    style: "law-cards"
    title: "Notable Former U.S. State Flags"
    subsections:
      - subtitle: "Minnesota"
        text: |-
          **Pictured version:** 1983 seal rendering
          **Retired:** May 11, 2024

          Minnesota's former blue flag placed the state seal within pink-and-white lady's-slippers, three dates, and 19 stars. The Legislature adopted the basic flag in 1957, while a 1983 seal revision produced the later artwork shown here.

          Minnesota belongs in this gallery because the transition replaced many small details with a North Star and two blue fields. Few before-and-after pairs show the modern move from a seal illustration to large flag-scale geometry as clearly.
        anchor_phrases:
          - "Minnesota's former blue flag"
          - "North Star"
      - subtitle: "Utah"
        text: |-
          **Former role:** Official state flag
          **Current role:** Historic state flag

          Utah's former banner reproduced the state seal on dark blue, including a beehive, U.S. flags, and the dates 1847 and 1896. Senate Bill 31 established the new flag and preserved the earlier banner under a separate legal title.

          Utah earns a place because replacement did not mean legal erasure. Its two-flag framework makes a useful distinction between the design used as the main civic symbol and the design retained for history and ceremony.
        anchor_phrases:
          - "historic state flag"
      - subtitle: "Mississippi"
        text: |-
          **Adopted:** 1894
          **Retired:** July 1, 2020

          Mississippi's former flag placed the Confederate battle emblem in its canton above blue, white, and red horizontal bars. State archives document both the emblem and the design's original purpose of honoring Confederate soldiers.

          Mississippi belongs here because its retirement ended the last current state flag to display that battle emblem. The New Magnolia replacement followed a commission process and statewide vote, tying design change directly to public historical debate.
        anchor_phrases:
          - "Confederate battle emblem"
          - "New Magnolia"
      - subtitle: "Georgia"
        text: |-
          **Adopted:** 1956
          **Replaced:** 2001

          Georgia's 1956 banner combined the state seal with a Confederate battle flag occupying roughly two-thirds of the design. The New Georgia Encyclopedia connects its legislative adoption to resistance after Brown v. Board of Education.

          Georgia belongs because its sequence shows that replacement can occur in stages. A crowded 2001 compromise lasted only two years before voters selected the simpler current design in a 2004 referendum.
        anchor_phrases:
          - "Georgia's 1956 banner"
          - "Brown v. Board of Education"
      - subtitle: "Maine"
        text: |-
          **Official:** 1901–1909
          **Elements:** Pine tree and North Star

          Maine's first official flag placed a pine tree in the center of a buff field and a five-pointed blue star near the upper hoist. State archival research reports that no surviving record explains why lawmakers replaced it after eight years.

          Maine earns its place because a short-lived former flag became a durable alternative symbol. Its revival progressed far enough to reach a 2024 referendum, although voters retained the current coat-of-arms flag.
        anchor_phrases:
          - "Maine's first official flag"
          - "2024 referendum"
      - subtitle: "New Mexico"
        text: |-
          **Authorized:** 1915
          **Replaced:** 1925

          Ralph Emerson Twitchell's first statehood flag used a blue field, a miniature U.S. flag, the state seal, and NEW MEXICO set diagonally. A Daughters of the American Revolution competition later selected Harry Mera's red Zia symbol on yellow.

          New Mexico belongs because the replacement discarded several layers of text and seals for one strong central mark. The contrast is among the clearest demonstrations of how a distinctive local symbol can define an entire flag.
        anchor_phrases:
          - "red Zia symbol"
      - subtitle: "Nevada"
        text: |-
          **Pictured version:** 1929–1991
          **Change:** State-name placement

          Don Louis Shellback III's contest design set a silver star inside sagebrush and threaded NEVADA between the star's points. A 1991 amendment moved the name into a semicircle below the star and specified colors and production details.

          Nevada belongs because a modest lettering change created a separately recognized fourth official version. Its history shows that former flags are not always wholesale redesigns. Legibility can be enough to prompt revision.
        anchor_phrases:
          - "Don Louis Shellback III"
          - "fourth official version"
      - subtitle: "Vermont"
        text: |-
          **Authorized:** 1803
          **Replaced:** 1837

          Vermont's first state flag used green-and-white stripes with stars in a blue canton. The state changed flags in 1837 and adopted the present blue flag with the coat of arms in 1923.

          Vermont belongs because its early banners followed changing national visual patterns before the state chose its own coat of arms. The sequence spans 120 years and shows that state flag identity developed gradually rather than at statehood.
        anchor_phrases:
          - "Vermont's first state flag"

  - id: how-former-flags-are-counted
    icon: "fa-solid fa-list-check"
    title: "What Counts as a Former State Flag"
    paragraphs:
      - "A former flag needs documented official use or authorization, followed by a replacement or statutory redesign. Military colors, proposed contest entries, territorial banners, and popular reproductions do not automatically qualify as former official state flags."
      - "Artwork can vary even when the governing law stays substantially the same. Minnesota's 1983 image reflects a revised seal within its 1957 flag framework, while Nevada's 1991 lettering amendment created a fourth version recognized by the Legislature. The labels on each card identify what the pictured file represents."

  - id: former-state-flag-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Historic State Flag Facts"
    facts:
      - "Maine's first official flag served for only eight years, from 1901 to 1909."
      - "Utah law preserves its former seal banner as the historic state flag."
      - "Nevada recognizes four official flag designs dating from 1905, 1915, 1929, and 1991."
      - "New Mexico's first statehood flag printed the state name diagonally across a blue field."
      - "Minnesota's former flag used 19 stars because Minnesota was the 19th state admitted after the original 13."

faq:
  - question: "Which states recently replaced their flags?"
    answer: "Mississippi adopted its New Magnolia flag in 2021. Utah and Minnesota followed with new official designs that took effect in 2024."
  - question: "What happened to Minnesota's old state flag?"
    answer: "Minnesota retired the seal-based flag on May 11, 2024. State law and the Secretary of State identify it as the historic state flag, while the simplified North Star design is now official."
  - question: "Why did Mississippi change its state flag?"
    answer: "Mississippi retired the 1894 flag after decades of debate over its Confederate battle emblem. The Legislature required a replacement without that emblem, a commission selected the New Magnolia design, and voters approved it in November 2020."
  - question: "Was Maine's pine tree flag restored?"
    answer: "No. Maine voters rejected the 2024 proposal to restore a version of the 1901 pine-and-star flag, so the coat-of-arms banner remains official."
  - question: "Are old state flag images always exact?"
    answer: "Not necessarily. Older laws sometimes described elements without fixing every color shade, proportion, or artistic detail. Reproductions should be read as documented renderings of a legal design, not always as exact copies of one surviving cloth flag."
  - question: "Is this every former U.S. state flag?"
    answer: "No. The gallery is a curated set of well-documented examples with reliable images. Many states have additional legal revisions, seal updates, territorial banners, military colors, and unofficial variants that require separate treatment."

