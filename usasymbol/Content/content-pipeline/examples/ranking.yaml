sections:
  - id: "oldest-colleges-in-the-united-states"
    icon: "fa-solid fa-graduation-cap"
    title: "10 Oldest Colleges in the United States"
    paragraphs:
      - "Harvard opened in 1636 by a vote of the Massachusetts Bay Colony's General Court. The College of William and Mary followed in 1693, 57 years later."
      - "Yale (1701), Penn (1740), Delaware (1743), Princeton (1746), Columbia (1754), Brown (1764), Rutgers (1766), and Dartmouth (1769) complete the top ten. Most were founded to train Protestant ministers. Penn was the exception, designed by Benjamin Franklin as a secular school focused on practical skills."
      - "Several changed names after independence. King's College became Columbia in 1784, and the College of New Jersey took the name Princeton in 1896."

  - id: "why-western-states-have-the-newest-colleges"
    icon: "fa-solid fa-train"
    title: "Why Western States Have the Newest Colleges"
    paragraphs:
      - "Wyoming (1886), Montana (1878), Nevada (1874), and Colorado (1874) opened their first colleges more than two centuries after Harvard. Railroads reached the Mountain West before any college did. The University of Wyoming opened in Laramie, a town founded in 1868 as a stop on the Union Pacific Railroad."

