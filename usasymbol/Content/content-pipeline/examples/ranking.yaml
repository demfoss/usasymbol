page:
  h1: "Oldest College in Each U.S. State"

  quick_answer:
    - "Harvard University, founded in 1636 in Cambridge, Massachusetts, is the oldest college in the United States. It opened just six years after the Massachusetts Bay Colony was established."
    - "Ten colleges on the list opened before the Revolutionary War began in 1775, every one of them in the original thirteen colonies."
    - "Wyoming (1886), Montana (1878), Nevada (1874), and Colorado (1874) have the most recently founded oldest colleges. Three of the four were still territories when their first college opened."

  methodology: "Founding years use each state's oldest continuously operating higher-education institution. Acceptance rates use 2025 NCES or school data."

