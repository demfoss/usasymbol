faq:
  - question: "Is Harvard the oldest college in the United States?"
    answer: "Yes. Harvard opened in 1636 and was named in 1639 after John Harvard, a young minister who left the college his library and half his estate."

  - question: "What are the 10 oldest colleges in the United States?"
    answer: "Harvard, William and Mary, Yale, Penn, Delaware, Princeton, Columbia, Brown, Rutgers, and Dartmouth, founded between 1636 and 1769. Their home states also open the [statehood order](/rankings/government/states-order-of-succession)."

  - question: "What is the oldest college in Virginia?"
    answer: "The College of William and Mary, chartered in 1693 by King William III and Queen Mary II, whose names it still carries. It ranks second nationally."

  - question: "What is the oldest college in Wyoming?"
    answer: "The University of Wyoming, founded in 1886, four years before Wyoming became a state. No state's oldest college is more recent."

