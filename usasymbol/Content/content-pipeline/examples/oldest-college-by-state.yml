faq:
  - question: "Is Harvard the oldest college in the United States?"
    answer: "Harvard University, established in 1636, is the oldest institution of higher education in the United States. It predates the next oldest school, William and Mary, by nearly 60 years."

  - question: "What are the 10 oldest colleges in the United States?"
    answer: "The 10 oldest include the Colonial Nine (Harvard, William and Mary, Yale, Princeton, Columbia, Penn, Brown, Rutgers, and Dartmouth) followed by the University of Delaware, tracing its origins to 1743."

