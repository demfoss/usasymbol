sections:
  - id: "10-oldest-universities-in-continuous-operation"
    icon: "fa-solid fa-graduation-cap"
    title: "10 Oldest Universities in Continuous Operation"
    paragraphs:
      - "Harvard University leads every ranking of oldest American colleges, and the lead is not close. Founded in 1636 by a vote of the Massachusetts Bay Colony's General Court, Harvard predates the second-oldest American college, the College of William and Mary (1693), by 57 years. That gap, longer than the span from the Civil War to the Moon landing, reflects how long it took other colonies to muster the resources and population to sustain a second institution."
      - "The remaining eight in the top ten were all founded before the Revolutionary War: Yale (1701, Connecticut), University of Pennsylvania (1740), University of Delaware (1743), Princeton (1746, New Jersey), Columbia (1754, New York), Brown (1764, Rhode Island), Rutgers (1766, New Jersey), and Dartmouth (1769, New Hampshire). Every one of them was initially intended to train Protestant ministers, except Penn, which Benjamin Franklin deliberately designed as a secular institution focused on practical arts. That distinction set Penn apart from its contemporaries in a way that still shapes its curriculum."
      - "Together, these ten institutions span just 133 founding years, from 1636 to 1769, yet represent more than three centuries of unbroken educational tradition. No other country has a comparable cluster of institutions this old still actively granting degrees. Placed on this map, all ten fall within a corridor running from New Hampshire to New Jersey, a rectangle roughly 400 miles long and 150 miles wide."


