sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Illinois State Rock
    paragraphs:
      - "Dolostone is Illinois's official state rock, designated by the Illinois General Assembly in 2022. It is a sedimentary rock that makes up the bedrock beneath nearly all of Illinois except the far north, though it is usually hidden under layers of soil and glacial deposits."
      - "Illinois had no official state rock until students researched the state's geology themselves and pushed the designation through, making dolostone one of the newest state symbols in the country."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Dolostone?"
    paragraphs:
      - "Dolostone is a sedimentary rock made mostly of the mineral dolomite, a calcium-magnesium carbonate. It typically appears gray to tan and fine-grained, similar in look to limestone, which it is closely related to and often confused with."
      - "Dolostone forms when magnesium-rich water alters limestone after deposition, a process that swaps some calcium in the original rock for magnesium. The rock takes its name from the Dolomite Alps in Italy, where it was first formally described."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Illinois Chose Dolostone as Its State Rock"
    paragraphs:
      - "Dolostone underlies nearly the entire state, making it as close to a universal Illinois bedrock as any single rock type. It also has a direct link to Illinois history: dolostone quarried near Galena hosted the lead ore that triggered the state's early-1800s mining boom and gave the town its name."
      - "The rock has been used directly in Illinois landmarks; the Old State Capitol building in Springfield was built with thousands of dolostone blocks quarried from a site now under Lake Springfield. That combination of statewide bedrock and direct historical use gave dolostone a stronger claim than the other finalists, sandstone and limestone."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Dolostone Became Illinois's State Rock"
    paragraphs:
      - "Students at Pleasantdale Middle School in Burr Ridge and Maplebrook Elementary School in Naperville discovered that Illinois had never named an official state rock. After researching candidates with area geologists and museums, they built a statewide ballot pitting dolostone against sandstone and limestone, and dolostone won more than half the vote."
      - "State Senator Laura Ellman and State Representative Janet Yang Rohr, both of Naperville, carried the students' proposal into the legislature. Governor J.B. Pritzker signed it into law in 2022, and the designation took effect January 1, 2023."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Dolostone Is Found in Illinois"
    paragraphs:
      - "Thornton Quarry, about 25 miles south of Chicago, cuts through one of the most visible dolostone exposures in the state, a Silurian-age reef formation roughly 300 feet thick, crossed by the Tri-State Tollway. The rock also underlies most of the state at shallower depth, which is why it was chosen as a symbol reachable from nearly any Illinois county."
    sites:
      - name: Thornton Quarry
        city: Thornton
        lat: 41.5636
        lng: -87.6081
        note: "Major dolostone quarry exposing a Silurian reef"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Dolostone Facts"
    facts:
      - "Adopted as Illinois's state rock in 2022, effective January 1, 2023."
      - "The designation began with a statewide student vote organized by elementary and middle school students in Burr Ridge and Naperville."
      - "Dolostone underlies nearly all of Illinois except the far northern part of the state."
      - "The Old State Capitol in Springfield was built with about 3,300 dolostone blocks."

