faq:
  - question: What is Illinois's state rock?
    answer: "Illinois's state rock is dolostone, a sedimentary rock made mostly of the mineral dolomite, adopted by the Illinois General Assembly in 2022."
  - question: When did Illinois adopt dolostone as its state rock?
    answer: "The Illinois General Assembly designated dolostone the official state rock in 2022, effective January 1, 2023."
  - question: Why did Illinois choose dolostone?
    answer: "Dolostone underlies nearly the entire state and was quarried for landmarks like the Old State Capitol; it also won a statewide student vote organized by Naperville and Burr Ridge students over sandstone and limestone."
  - question: Where can you find dolostone in Illinois?
    answer: "Thornton Quarry, south of Chicago, exposes a large, visible dolostone formation, though dolostone forms the bedrock under most of the state."

