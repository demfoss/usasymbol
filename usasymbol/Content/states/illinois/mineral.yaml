faq:
  - question: What is Illinois's state mineral?
    answer: "Illinois's state mineral is fluorite, calcium fluoride, adopted by the Illinois General Assembly in 1965."
  - question: When did Illinois adopt fluorite as its state mineral?
    answer: "The Illinois General Assembly designated fluorite the official state mineral in 1965."
  - question: Why did Illinois choose fluorite?
    answer: "Illinois led the nation in fluorite production for decades, with most of it mined in the Illinois-Kentucky Fluorspar District around Rosiclare in Hardin County."
  - question: Where can you find fluorite in Illinois?
    answer: "Rosiclare and Cave-in-Rock in Hardin County, in the far southern tip of Illinois, were the historic centers of the state's fluorite mining district."

