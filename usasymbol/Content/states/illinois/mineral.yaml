seo_title: "Illinois State Mineral | Fluorite"
seo_description: "Illinois's state mineral is fluorite, adopted in 1965. Southern Illinois around Rosiclare once led the nation in fluorite production."
hero_image: /images/minerals/illinois/illinois-state-mineral-hero.webp
hero_image_alt: "A purple and blue banded fluorite crystal cluster."
hero_image_caption: "Fluorite, Illinois's official state mineral, was mined for generations in the Rosiclare area of Hardin County."
intro_text: "Illinois's state mineral is fluorite, adopted in 1965 to recognize the mineral behind the state's decades-long lead in national fluorite production, centered on Hardin and Pope counties. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Illinois State Mineral
    paragraphs:
      - "Fluorite is Illinois's official state mineral, designated by the Illinois General Assembly in 1965. It is calcium fluoride, a mineral known for its wide range of colors and for forming in cube-shaped or banded crystals."
      - "Illinois was a natural choice for this designation because the state was, for decades, the country's leading fluorite producer, with the bulk of that output coming from a single district in the southern tip of the state."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Fluorite?"
    paragraphs:
      - "Fluorite is calcium fluoride, CaF2, a mineral that grows in cube-shaped crystals and comes in an unusually wide range of colors, from deep purple and blue to yellow, green, and colorless. Illinois specimens are especially known for purple and blue banding, with sharp zones of color recording changes in the fluid the crystal grew from."
      - "Fluorite is soft enough for a knife blade to scratch, and many specimens glow blue under ultraviolet light. It forms in hydrothermal veins, where hot mineral-rich fluids moving through cracks in rock cool and deposit crystals."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Illinois Chose Fluorite as Its State Mineral"
    paragraphs:
      - "Illinois's fluorite industry centered on the Illinois-Kentucky Fluorspar District in the southern part of the state, especially around Rosiclare and Cave-in-Rock in Hardin County. For much of the 20th century Illinois led the nation in fluorite production, and Rosiclare was known as the Fluorspar Capital of the World."
      - "The mineral fed real industry, used as a flux in steelmaking and as a raw material for hydrofluoric acid, opalescent glass, and enamel. Naming fluorite the state mineral in 1965 recognized a resource that had shaped the economy of the state's southern counties for generations."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Fluorite Became Illinois's State Mineral"
    paragraphs:
      - "State lawmakers designated fluorite the official state mineral in 1965, formally recognizing the mineral tied to the Hardin and Pope county mining district in the state's far south."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Fluorite Is Found in Illinois"
    paragraphs:
      - "The Illinois-Kentucky Fluorspar District, centered on Rosiclare and Cave-in-Rock in Hardin County, produced most of the state's fluorite. Underground mining there continued for over a century before the last Illinois fluorite mine closed in 1995."
    sites:
      - name: Rosiclare
        city: Rosiclare
        lat: 37.4267
        lng: -88.3489
        note: "Historic center of the Illinois-Kentucky Fluorspar District"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Fluorite Facts"
    facts:
      - "Adopted as Illinois's state mineral in 1965."
      - "Rosiclare, Illinois was nicknamed the Fluorspar Capital of the World during the district's peak production years."
      - "Illinois fluorite is prized by collectors for sharp purple and blue color banding."
      - "The last commercial fluorite mine in Illinois closed in December 1995."

