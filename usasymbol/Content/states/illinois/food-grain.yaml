sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Illinois's State Grain?"
    paragraphs:
      - "Corn is Illinois's official state grain, designated by the Illinois General Assembly in 2018. Corn is planted on more Illinois farmland than any other crop, covering much of the state's central and northern prairie."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Corn"
    paragraphs:
      - "Corn is a tall grass that produces ears covered in kernels, planted in Illinois each spring and harvested in fall. Most Illinois corn is field corn, used for animal feed, ethanol fuel, and processed food ingredients, rather than the sweet corn eaten directly off the cob. Illinois's deep, fertile prairie soil is especially well suited to growing it."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Corn Became Illinois's State Grain"
    paragraphs:
      - "The Illinois General Assembly designated corn the official state grain in 2018, formally recognizing a crop that has defined the state's agricultural identity for generations."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose Corn"
    paragraphs:
      - "Illinois is consistently one of the top corn-producing states in the country, thanks to its rich prairie soil and long growing season. Corn also underpins much of the state's economy, supplying feed for livestock, raw material for ethanol plants, and export crops shipped along the Mississippi and Illinois Rivers."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Corn Facts"
    facts:
      - "Adopted as Illinois's state grain in 2018."
      - "Illinois is regularly among the top two corn-producing states in the country."
      - "Most Illinois corn is field corn, used for animal feed, ethanol, and food processing."
      - "Illinois's deep prairie soil makes it especially productive for growing corn."

