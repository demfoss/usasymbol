faq:
  - question: "What is Illinois's state grain?"
    answer: "Illinois's state grain is corn, adopted by the Illinois General Assembly in 2018."
  - question: "When did Illinois adopt corn as its state grain?"
    answer: "The Illinois General Assembly designated corn the official state grain in 2018."
  - question: "Why did Illinois choose corn?"
    answer: "Illinois's fertile prairie soil and long growing season make it one of the top corn-producing states, and corn underpins much of the state's farm economy."
  - question: "Is corn grown in Illinois today?"
