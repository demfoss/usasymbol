sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Illinois's State Vegetable?"
    paragraphs:
      - "Sweet corn is Illinois's official state vegetable, designated by the Illinois General Assembly in 2015. Illinois is one of the nation's leading corn-growing states, though most of that corn is field corn grown for feed and industry, separate from the sweet corn grown for eating."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Sweet Corn"
    paragraphs:
      - "Sweet corn is a variety of corn bred for its high sugar content, picked and eaten while the kernels are still tender rather than left to dry like field corn. It is grown on farms across Illinois and sold fresh at farm stands and farmers markets through the summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Sweet Corn Became Illinois's State Vegetable"
    paragraphs:
      - "The Illinois General Assembly designated sweet corn the official state vegetable in 2015, following a push by students who petitioned lawmakers to give the state an official vegetable."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose Sweet Corn"
    paragraphs:
      - "Illinois lawmakers chose sweet corn because corn is one of the state's most important crops and a familiar sight on farms throughout Illinois, making it a natural fit for the vegetable designation."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sweet Corn Facts"
    facts:
      - "Adopted as Illinois's state vegetable in 2015."
      - "Illinois is one of the top corn-producing states in the country."
      - "Sweet corn differs from the field corn grown for feed and industry."
      - "The designation followed a student petition to state lawmakers."

