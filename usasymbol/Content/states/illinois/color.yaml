faq:
  - question: "What are the official colors of Illinois?"
    answer: "The traditional semi-official state colors of Illinois are Blue and Orange, derived from the University of Illinois at Urbana-Champaign's official colors adopted on October 24, 1894. Illinois has no separate legislative act designating official state colors."
  - question: "What is the HEX code for Illini Orange?"
    answer: "The official HEX code for Illini Orange is #FF5F05, corresponding to Pantone PMS 1655, as standardized in the University of Illinois Brand Guidelines."
  - question: "What is the HEX code for Illini Blue?"
    answer: "The official HEX code for Illini Blue is #13294B, corresponding to Pantone PMS 2767, as standardized in the University of Illinois Brand Guidelines."
  - question: "When did the University of Illinois adopt orange and blue?"
    answer: "The University of Illinois officially adopted orange and navy blue on October 24, 1894, at a full university convocation led by President Andrew Sloan Draper, who personally explained the historical significance of each color before the congregation voted unanimously in favor."
  - question: "Why did the University of Illinois choose orange?"
    answer: "University President Andrew Draper explained in 1894 that orange 'has come down to us through 200 years of history — it was the color under which the world's first great battle for liberty was fought,' referencing William of Orange's victory at the Battle of the Boyne in 1690."
  - question: "Why did the University of Illinois choose blue?"
    answer: "President Draper described blue in 1894 as 'an emblem of steadfastness and stability,' drawing on the traditional heraldic symbolism of blue as the color of loyalty, truth, and enduring civic commitment — values central to the University's mission as a public land-grant institution."
  - question: "Does Illinois have a separate official state color from the University of Illinois colors?"
    answer: "No. Illinois does not have officially legislated state colors. The state flag uses blue lettering on a white field but does not incorporate orange. Blue and orange function as Illinois's semi-official traditional state colors entirely through the dominance of the University of Illinois's institutional color tradition."

