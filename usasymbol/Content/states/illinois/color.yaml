sections:
  - id: "official-designation"
    title: "History of Illinois State Colors"
    style: "default"
    paragraphs:
      - "Illinois has no legislative act that designates official state colors. Blue and orange are semi-official, rooted in the choice made by the University of Illinois on October 24, 1894."
      - "University President Andrew Draper adopted Illini Orange and Illini Blue that year, and the pairing has since become part of the way people picture the state."
  - id: "symbolism"
    title: "What Illinois State Colors Mean"
    style: "highlight"
    paragraphs:
      - "Orange recalls William of Orange and the battle for liberty. Blue stands for steadfastness and stability."
      - "The university reference shades are Illini Orange (PMS 1655) and Illini Blue (PMS 2767)."
  - id: "state-emblems"
    title: "Where Illinois Colors Appear"
    style: "default"
    paragraphs:
      - "Blue and orange are most visible in University of Illinois athletics and branding, including the Fighting Illini teams. They also appear in state cultural use and alongside the Illinois state flag."
