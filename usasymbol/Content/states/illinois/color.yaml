title: "Official and Traditional Colors of Illinois"
state: "Illinois"
adopted_year: null

seo_title: "Illinois State Colors: Official HEX Codes & Meaning"
seo_description: "Illinois state colors are Blue and Orange, based on the University of Illinois colors adopted in 1894. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "The traditional state colors of Illinois are **Blue** and **Orange**, derived from the University of Illinois at Urbana-Champaign, which adopted these colors in 1894. While Illinois has no separate legislative act designating official state colors, blue and orange are deeply embedded in state identity through the University of Illinois, civic culture, and [the Illinois state flag](/states/illinois/flag/illinois-state-flag). Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Illinois colors accurately."

official_colors: "Blue and Orange"
official_since: "Semi-official (University of Illinois colors adopted October 24, 1894)"
primary_use: "University of Illinois athletics and branding, state cultural identity, Fighting Illini athletic programs"
known_for: "Illini Orange (PMS 1655) and Illini Blue (PMS 2767), adopted in 1894 by University President Andrew Draper — orange representing the legacy of William of Orange and the battle for liberty, blue representing steadfastness and stability"

