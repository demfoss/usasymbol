seo_title: "Illinois State Colors | Blue Orange"
seo_description: "Illinois state colors are Blue and Orange, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Illinois are **Blue** and **Orange**, derived from the University of Illinois at Urbana-Champaign, which adopted these colors in 1894. While Illinois has no separate legislative act designating official state colors, blue and orange are well established in state identity through the University of Illinois, civic culture, and [the Illinois state flag](/states/illinois/flag/illinois-state-flag). The color cards below list practical HEX, RGB, CMYK, and Pantone references for Illinois blue and orange. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Blue and Orange"
official_since: "Semi-official (University of Illinois colors adopted October 24, 1894)"
primary_use: "University of Illinois athletics and branding, state cultural use, Fighting Illini athletic programs"
known_for: "Illini Orange (PMS 1655) and Illini Blue (PMS 2767), adopted in 1894 by University President Andrew Draper — orange representing the legacy of William of Orange and the battle for liberty, blue representing steadfastness and stability"

