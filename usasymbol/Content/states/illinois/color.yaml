sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Illinois does not have officially legislated state colors designated by a separate statute. Blue and orange have become the widely recognized semi-official state colors through the dominance of the University of Illinois at Urbana-Champaign — the state's flagship land-grant public university — whose color tradition dates to October 24, 1894. The University of Illinois was founded in 1867 under the Morrill Land-Grant Act and has served as the primary publicly funded center of higher education in Illinois for over 150 years, giving its institutional colors a de facto state-level visibility that few other universities in any state have achieved, similar to identity language used in [Illinois's nickname history](/states/illinois/nickname/the-prairie-state)."
      - "The path to blue and orange was neither direct nor inevitable. The University of Illinois cycled through at least seven distinct color schemes between 1879 and 1894, including silver and cardinal, blue and white, yellow and black, gold and black, Dartmouth green, crimson and olive green, and orange and black, before University President Andrew Sloan Draper convened a combined faculty and student committee in October 1894 to settle the question permanently. The committee proposed navy blue and orange; the Athletic Association ratified the choice; and Draper submitted the question to a full university convocation on October 24, 1894, where the entire congregation rose in unanimous approval. Orange and navy blue have been the University's official colors ever since."
    subsections:
      - subtitle: "The October 24, 1894 Convocation"
        text: "The moment of official adoption is documented in detail by University historian Winton Solberg and in the pages of The Illini student newspaper. President Draper addressed the convocation with a speech that remains one of the most philosophically specific explanations of a university's color choice in American academic history. He stated: 'Concerning the matter of University colors — after very careful consideration by the committee, it was decided to recommend the adoption of orange and navy blue as the University colors.' He then personally explained the meaning of each color before asking the congregation to rise in support. The entire assembly rose and applauded. 'I am proud to be able to be the first to hold aloft the University colors,' Draper said. 'May they long be held aloft and be proudly triumphant, not only on the athletic field, but also in the fields of literature, of science and of art.'"
      - subtitle: "From University Colors to State Identity"
        text: "The transition of blue and orange from University of Illinois institutional colors to widely recognized Illinois state colors occurred gradually over the 20th century as the University of Illinois became the dominant cultural and athletic institution representing the state nationally. The Fighting Illini athletic program — particularly its football and basketball programs — brought the blue and orange into national visibility through Big Ten Conference competition, bowl game appearances, and NCAA tournament runs. By the late 20th century, blue and orange were routinely described as Illinois's state colors in popular media and tourism contexts, a semi-official status that reflects the University's role as the state's primary public symbol-maker even in the absence of a formal legislative designation and places Illinois within the broader [U.S. state colors](/symbols/colors) reference set."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Illinois's blue and orange carry one of the most intellectually documented color origin stories of any US state's traditional palette. Unlike states whose colors evolved from flag design or geological association, Illinois's colors were deliberately chosen in 1894 with explicit philosophical justifications delivered by the university president himself. Orange was linked to a 200-year-old tradition of liberty and Protestant democratic resistance; blue was identified as the color of steadfastness and civic stability. These meanings, spoken aloud in a public convocation and preserved in university archives, give Illinois's traditional state colors a depth of documented intentionality that distinguishes them from virtually every other state in the Union."
    subsections:
      - subtitle: "Orange: The Color of Liberty"
        text: "President Draper's explanation of orange drew on a specific and historically precise reference: the Battle of the Boyne, fought on July 11, 1690, in which William of Orange — the Protestant King William III of England — defeated the Catholic claimant James II. The battle became a defining moment in the history of constitutional monarchy and Protestant political liberty in the English-speaking world, and orange became the symbolic color of that tradition. Draper described orange as the color under which 'the world's first great battle for liberty was fought,' connecting the University of Illinois's mission of democratic public education directly to this 200-year-old tradition of popular and intellectual freedom. The specific Illini Orange — PMS 1655, HEX #FF5F05 — is a vivid, warm, red-leaning orange that has become one of the most recognizable university colors in the United States."
      - subtitle: "Blue: The Color of Steadfastness"
        text: "Draper's description of blue as 'an emblem of steadfastness and stability' draws on the traditional heraldic symbolism of blue (azure) as the color of loyalty, truth, and enduring commitment — values central to the mission of a land-grant university established to serve the public good of the entire state of Illinois. The specific Illini Blue adopted in 1894 was navy blue; the current official shade — PMS 2767, HEX #13294B — is a very deep navy, almost indigo in tone, that creates a dramatic visual contrast with the vivid Illini Orange. This pairing of deep navy and bright orange has been described by the University of Illinois brand guidelines as chosen with 'accessibility and differentiation in mind,' continuing the deliberate, purposeful color philosophy established by Draper in 1894."

  - id: "state-emblems"
    title: "Usage in University, State, and Cultural Contexts"
    style: "default"
    paragraphs:
      - "Blue and orange appear throughout Illinois's public life primarily through the University of Illinois system, whose three campuses in Urbana-Champaign, Chicago, and Springfield collectively serve over 90,000 students and whose athletic programs bring the colors into national visibility annually. The Illinois state flag — adopted in 1915 and revised in 1969 — features the bald eagle of the state seal on a white field with the state name in blue lettering, but does not incorporate orange, maintaining a distinction between the state flag's official colors and the University's semi-official state color tradition. Blue and orange appear on University of Illinois athletics uniforms, Grange Grove tailgate areas, Memorial Stadium, the State Farm Center arena, and across the University's extensive brand presence throughout Illinois and nationally. The Illinois state seal, adopted in 1818 and revised multiple times, uses a blue field and does not include orange, further confirming that the blue-and-orange combination derives its state-level identity from the University rather than from formal governmental heraldry, with statehood context compared in [states and capital cities reference data](/rankings/geography/states-capital-cities)."

      - "Because civic branding and legal symbolism differ in Illinois, readers often pair color history with [Illinois's state motto page](/states/illinois/motto/state-sovereignty-national-union) to see how official and semi-official identity elements evolved together."

