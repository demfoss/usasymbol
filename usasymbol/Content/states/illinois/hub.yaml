seo_description: "Illinois symbols include the northern cardinal, violet, white oak, Land of Lincoln nickname, and state sovereignty motto."
snippet_answer: Illinois's northern cardinal and violet are among the most familiar official state symbols in the Midwest, both chosen through schoolchildren's votes in 1929. The white oak, Land of Lincoln nickname, state-sovereignty motto, and 1868 seal flag connect the state's prairie and woodland identity to its most famous historical figure.
