name_meaning:
  heading: What Does Illinois Mean?
  paragraphs:
  - Illinois is the 21st U.S. state, admitted to the Union on December 3, 1818. The name comes through French spellings of an Indigenous name associated with the Illinois or Illiniwek confederation.
  - Older sources often claimed Illinois meant "superior men," but that explanation is now treated as a false or oversimplified etymology. A more careful account connects the name with Miami-Illinois language forms referring to the people or to those who speak in the regular way.
  - Illinois is widely known as the Prairie State and the Land of Lincoln. Its postal abbreviation is IL, and residents are Illinoisans.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From French renderings of an Indigenous name connected with the Illinois or Illiniwek people.
    - label: Etymology caution
      text: The old "superior men" explanation is widely repeated but not the careful modern account.
    - label: Statehood
      text: Illinois became the 21st state on December 3, 1818.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Illinois, a Midwestern state stretching from Chicago to the Mississippi and Ohio river regions.
    - label: River
      text: Also used for the Illinois River, a major waterway tied to the state's geography and name.
    - label: Confederation
      text: Illinois or Illiniwek referred to a group of Indigenous peoples encountered by French speakers.
    - label: People
      text: People from Illinois are called Illinoisans.
  - heading: Nicknames and Short Forms
    items:
    - label: Prairie State
      text: Official nickname tied to the prairie landscapes that once covered much of Illinois.
    - label: Land of Lincoln
      text: Popular state identity from Abraham Lincoln's long residence and political career in Illinois.
    - label: Inland Empire
      text: Older promotional nickname that emphasized the state's trade and agricultural position.
    - label: Abbreviation
      text: IL; older short form Ill.
editorial:
  heading: What Illinois's Symbols Say About the State
  paragraphs:
  - Illinois's [state flag](/states/illinois/flag) is really a seal flag, but the seal has a sharper story than that phrase suggests. The banner reading State Sovereignty, National Union was deliberately twisted by Sharon Tyndale so National Union would be easier to read.
  - The [violet](/states/illinois/flower), [northern cardinal](/states/illinois/bird), and [white oak](/states/illinois/tree) all came through public or schoolchildren voting. That makes Illinois's symbol set unusually democratic in process, even when the symbols themselves are familiar Midwestern choices.
  - The [white-tailed deer](/states/illinois/mammal/white-tailed-deer) gives Illinois a recovery story rather than a frontier trophy. It nearly vanished from the state, then returned through restocking, regulation, and the kind of managed habitat that defines much of modern Illinois.
faq:
- question: What is the Illinois state abbreviation?
  answer: The Illinois postal abbreviation is [IL](/states/illinois/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: Is Springfield Illinois's largest city?
  answer: No. Springfield is the capital, but Chicago is far larger. Springfield is one of [33 state capitals that are not the largest city in their state](/rankings/geography/state-capitals-not-largest-city).
- question: What is Illinois's most famous state symbol?
  answer: The [Illinois state flag](/states/illinois/flag) is one of the state's main official symbols because it carries the state seal, eagle, dates, and motto.
- question: What is Illinois's state bird?
  answer: Illinois's state bird is the [northern cardinal](/states/illinois/bird), adopted in 1929 after a schoolchildren's vote.
- question: What is Illinois's state flower?
  answer: Illinois's state flower is the [violet](/states/illinois/flower), adopted in 1908 after Illinois schoolchildren voted for it.
- question: Why is Illinois called the Prairie State?
  answer: Illinois is called the Prairie State because prairie once covered much of its landscape before large-scale farming and settlement. The nickname is covered on the [Illinois nickname](/states/illinois/nickname) page.
- question: How many official state symbols does Illinois have?
  answer: The Illinois hub gathers the state-symbol pages now present on USA Symbol, including the flag, cardinal, violet, white oak, motto, colors, and white-tailed deer.
