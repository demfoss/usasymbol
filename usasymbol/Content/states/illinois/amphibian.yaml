seo_title: "Illinois State Amphibian | Eastern Tiger Salamander"
seo_description: "Illinois's state amphibian is the eastern tiger salamander, adopted in 2005. Learn what it looks like, where it lives, and why it became official."
hero_image: /images/amphibians/illinois/illinois-state-amphibian-hero.webp
hero_image_alt: "A dark eastern tiger salamander with yellow blotches resting on damp soil."
hero_image_caption: "The eastern tiger salamander, Illinois's state amphibian, is one of the largest land salamanders in North America."
intro_text: "Illinois's state amphibian is the eastern tiger salamander, a large, dark salamander marked with yellow blotches, adopted in 2005. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Illinois?
    paragraphs:
      - "The eastern tiger salamander is Illinois's official state amphibian, designated by the Illinois Legislature in 2005. Its scientific name is Ambystoma tigrinum."
      - "It is found across much of Illinois, in prairies, woodlands, and near ponds used for breeding."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Eastern Tiger Salamander
    paragraphs:
      - "The eastern tiger salamander has a thick body with dark brown to black skin marked by irregular yellow blotches, giving it a tiger-like pattern."
      - "Adults can grow to over a foot long, making it one of the largest salamander species that lives on land in North America."
      - "It spends most of its adult life underground in burrows, often ones dug by other animals, and only comes to the surface at night or during rain."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Illinois Legislature designated the eastern tiger salamander the official state amphibian in 2005, following a campaign led by Illinois students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Illinois Chose the Eastern Tiger Salamander
    paragraphs:
      - "The eastern tiger salamander is found throughout much of Illinois, making it a widely recognized amphibian native to the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Eastern Tiger Salamander
    paragraphs:
      - "The eastern tiger salamander lives across most of Illinois, favoring prairies and woodlands near ponds and other still water used for breeding."
    sites:
