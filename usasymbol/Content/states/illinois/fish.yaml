seo_title: Illinois State Fish | Bluegill
seo_description: The Illinois state fish is the bluegill, adopted in 1986. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/illinois/illinois-fish-hero.webp
hero_image_alt: A bluegill with an olive and yellow striped body, a deep round shape, and a dark spot at the back of its gill cover.
hero_image_caption: The bluegill, the Illinois state fish, is common in waters all across the state.
intro_text: Illinois's state fish is the bluegill, a small, common sunfish found all over the state. Illinois schoolchildren chose it in 1986. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Illinois?
  paragraphs:
  - The bluegill is the official state fish of Illinois. It became the state fish in 1986, and state law names it the official State fish. Its scientific name is Lepomis macrochirus.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Bluegill
  paragraphs:
  - The bluegill is the most common member of the sunfish family. It has olive to yellow colors with stripes on its body.
  - Look for a dark flap at the back of its gill cover. That dark spot is the easiest way to recognize it. Many males have bright blue gill covers, which is how the fish got its name.
  - An average bluegill is 8 to 10 inches long and weighs about a quarter of a pound.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - Illinois schoolchildren voted for the bluegill as the state fish in 1986. Illinois state symbols become official through acts of the Illinois General Assembly, and state law now names the bluegill the official State fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Illinois Chose the Bluegill
  paragraphs:
  - Official sources say schoolchildren picked the bluegill, but they do not give a detailed reason. The state does describe it as a very common fish throughout Illinois, so many people know it.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Bluegill
  paragraphs:
  - The bluegill is native to Illinois and common across the whole state. Look for it in lakes, ponds, and rivers from northern to southern Illinois.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Bluegill Facts
  facts:
  - Adopted in 1986 by the Illinois Legislature after a schoolchildren's vote.
  - Scientific name is Lepomis macrochirus.
  - Usually grows 8 to 10 inches long.
  - Has a dark flap at the back of each gill cover.
  - Usually lives five to six years.
faq:
- question: What is Illinois's state fish?
  answer: The state fish of Illinois is the bluegill, a common sunfish found throughout the state.
- question: When did Illinois adopt the Bluegill?
  answer: The bluegill became the Illinois state fish in 1986 after Illinois schoolchildren voted for it.
- question: Why did Illinois choose the Bluegill?
  answer: Illinois schoolchildren picked it, but official sources do not give a detailed reason. The bluegill is very common across Illinois, so many people recognize it.
- question: How did the bluegill get its name?
  answer: Its name comes from the bright blue gill covers that many males have.
- question: How big does a bluegill get in Illinois?
  answer: An average bluegill is 8 to 10 inches long and weighs about a quarter of a pound.
