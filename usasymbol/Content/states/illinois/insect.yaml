intro_text: "Illinois's state insect is the monarch butterfly, a bright orange-and-black butterfly officially adopted in 1975. A Decatur third-grade class pushed the state Legislature to make it official."

sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Illinois?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Illinois's official state insect. The Illinois General Assembly designated it in 1975."
  - "Illinois does not see monarchs year-round as residents. The butterflies are common in the state from May through October before migrating to central Mexico for the winter."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with rows of small white spots."
  - "Adult monarchs measure about 2 inches long, with a wingspan of 3.5 to 5 inches, one of the larger butterflies found in Illinois fields and meadows."
  - "Monarch caterpillars feed only on milkweed. The full journey from egg to adult butterfly takes about 20 to 33 days."

- id: history
  icon: fa-solid fa-landmark
  title: How Illinois Chose the Monarch Butterfly
  paragraphs:
  - "In 1974, a third-grade class at Dennis School in Decatur proposed the monarch butterfly as Illinois's official insect. State Representative Webber Borchers of Decatur introduced the bill, and the students campaigned for its passage."
  - "The bill passed in 1975, and the Dennis School class watched Governor Daniel Walker sign it into law."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Illinois
  paragraphs:
  - "Monarchs are seen across Illinois from May through October, in fields, meadows, and roadsides where milkweed and nectar flowers grow."
  - "Numbers peak during the fall migration, when monarchs from across the Midwest pass through Illinois on their way to overwintering sites in the mountains of central Mexico."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted: 1975, by the Illinois General Assembly."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: 3.5 to 5 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Proposed by a third-grade class at Dennis School in Decatur, with Representative Webber Borchers sponsoring the bill."
  - "Monarch caterpillars eat only milkweed, and the full egg-to-adult cycle takes about 20 to 33 days."




