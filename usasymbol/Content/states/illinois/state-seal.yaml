meaning: 'The Great Seal of Illinois is built around a tension written into its design: the motto "State Sovereignty, National Union" wraps on a banner held by an eagle, but Sharon Tyndale, who redesigned the seal in 1868, deliberately oriented the banner so "National Union" reads right-side up while "State Sovereignty" reads upside down. Adopted at the height of Reconstruction, the 1868 seal encodes a political argument in its typography.'
