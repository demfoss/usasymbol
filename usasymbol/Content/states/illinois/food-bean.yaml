sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Illinois's State Bean?"
    paragraphs:
      - "The soybean is Illinois's official state bean, designated by the Illinois General Assembly in 2025. Illinois farmers plant soybeans on millions of acres each year, usually rotating them with corn."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Soybean"
    paragraphs:
      - "Soybeans are small, round beans that grow in pods on a bushy green plant. Illinois farmers plant soybeans in late spring and harvest them in fall, and the crop is processed into products such as cooking oil, animal feed, and protein used in packaged foods. Rotating soybeans with corn each year helps keep Illinois farmland fertile."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Soybean Became Illinois's State Bean"
    paragraphs:
      - "The Illinois General Assembly designated the soybean the official state bean in 2025, recognizing a crop that ranks among the state's most valuable exports."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose the Soybean"
    paragraphs:
      - "Illinois is regularly one of the top soybean-producing states in the country, and the crop is a major part of the state's farm economy and export trade. Soybeans are typically grown in rotation with corn, making the two crops closely linked across Illinois's farmland."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Soybean Facts"
    facts:
      - "Adopted as Illinois's state bean in 2025."
      - "Illinois is regularly among the top soybean-producing states in the country."
      - "Soybeans are commonly rotated with corn on Illinois farms."
      - "Soybeans are processed into cooking oil, animal feed, and food protein."

