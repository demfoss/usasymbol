sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Illinois's State Snack Food?"
    paragraphs:
      - "Popcorn is Illinois's official state snack food, designated by the Illinois General Assembly in 2004. Popcorn comes from a specific variety of corn that puffs up and turns inside out when heated."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Popcorn"
    paragraphs:
      - "Popcorn kernels have a hard outer shell and a dense starchy center holding a small amount of moisture. When heated, that moisture turns to steam and builds pressure until the kernel bursts, turning the starch inside out into a fluffy piece of popcorn. It is typically eaten salted or buttered."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Popcorn Became Illinois's State Snack Food"
    paragraphs:
      - "The Illinois General Assembly designated popcorn the official state snack food in 2004."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose Popcorn"
    paragraphs:
      - "Illinois is one of the country's leading corn producing states, and popcorn is grown and processed there alongside field corn. The snack food designation reflects that agricultural connection rather than a single dish or recipe."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Popcorn Facts"
    facts:
      - "Adopted as Illinois's state snack food in 2004."
      - "Popcorn is a distinct variety of corn, separate from the field corn used for animal feed."
      - "Illinois is one of the top corn producing states in the country."
      - "Popcorn kernels pop when steam pressure builds inside the hard outer shell."

