sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Illinois's State Pie?"
    paragraphs:
      - "Pumpkin pie is Illinois's official state pie, designated by the Illinois General Assembly in 2016. It is a custard pie made from cooked pumpkin, spices, and a pastry crust."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Pumpkin Pie"
    paragraphs:
      - "Pumpkin pie is made by blending pumpkin puree with eggs, sugar, and spices such as cinnamon and nutmeg, then baking the mixture in a pastry crust until it sets into a firm custard."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Pumpkin Pie Became Illinois's State Pie"
    paragraphs:
      - "The Illinois General Assembly designated pumpkin pie the official state pie in 2016, adding it to the state's list of official symbols."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose Pumpkin Pie"
    paragraphs:
      - "Illinois grows more pumpkins than any other state, and the town of Morton in central Illinois is home to a major pumpkin processing plant that cans most of the pumpkin sold in the United States. Pumpkin pie directly reflects that agricultural industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Pumpkin Pie Comes From in Illinois"
    paragraphs:
      - "Morton, Illinois, calls itself the Pumpkin Capital of the World and hosts a large pumpkin processing facility along with an annual pumpkin festival."
    sites:
      - name: Morton
        city: Morton
        lat: 40.6169
        lng: -89.4687
        note: "Known as the Pumpkin Capital of the World"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pumpkin Pie Facts"
    facts:
      - "Adopted as Illinois's state pie in 2016."
      - "Illinois is the top pumpkin-producing state in the country."
      - "Morton, Illinois, hosts an annual Pumpkin Festival and a major pumpkin processing plant."

