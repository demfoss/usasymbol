author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-10"
seo_title: "Illinois State Tree: White Oak - Two Schoolchildren Votes, 66 Years Apart"
seo_description: "White Oak became Illinois's state tree in 1973 after 900,000 schoolchildren voted to replace Native Oak from 1908. Learn about the two democratic votes separated by 66 years."

intro_text: "White Oak became Illinois's state tree in 1973. Schoolchildren voted to replace Native Oak, adopted in 1908. About 900,000 students participated in the 1973 vote. White Oak defeated Northern Red Oak by more than two to one, and the species is part of broader comparisons on the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Illinois State Tree?"
    paragraphs:
      - "White Oak serves as Illinois's official state tree. This deciduous hardwood grows throughout all 102 counties. The tree reaches heights of 100 feet with trunk diameters of three to four feet and overlaps with habitats used by [Illinois's white-tailed deer](/states/illinois/mammal/white-tailed-deer)."
      - "The bark appears gray or almost white with shallow furrows. Leaves have seven to nine rounded lobes. Each leaf grows up to 10 inches long. Leaves turn red in fall."
      - "White Oak produces acorns that grow singly or in pairs. The acorns measure up to three-fourths inch long. The wood is strong, durable, and valued for cabinetry."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Illinois State Tree Name"
    paragraphs:
      - "The common name is White Oak. The scientific name is Quercus alba. The species name alba means 'white' in Latin, referring to the pale bark color."
      - "Early settlers called it 'stave oak' for its use in barrel making. The wood splits easily along its grain, making it ideal for cooperage work."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of the Illinois State Tree"
    paragraphs:
      - "Illinois selected Native Oak as its state tree in 1908. Mrs. James C. Fessler of Rochelle suggested in 1907 that schoolchildren vote for state symbols. Students cast 43,496 votes that November. Oak received 21,897 votes, beating Maple with 16,517 and Elm with 5,082."
      - "Senator Andrew J. Jackson of Rockford introduced legislation. The bill passed in early 1908. Governor Charles S. Deneen signed it into law on February 21, 1908, effective July 1, 1908."
      - "The 1908 law created a problem. Illinois has approximately 17 to 20 native oak species. The law did not specify which species. This ambiguity lasted 65 years, unlike the clearer designation on [Illinois's state flower page](/states/illinois/flower/violet)."

  - id: clarification
    icon: "fa-solid fa-vote-yea"
    title: "The 1973 Clarification Vote"
    paragraphs:
      - "State officials recognized the need for clarification by the early 1970s. They organized another statewide vote among schoolchildren. About 900,000 students participated, making it one of the largest student votes in Illinois history."
      - "White Oak won decisively with 333,964 votes. Northern Red Oak placed second with 142,247 votes. The margin exceeded two to one. The legislature amended the 1908 law to specify White Oak."
      - "The amended bill became law in 1973. Illinois finally had a clearly defined state tree 66 years after the original vote."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Illinois State Tree Facts"
    facts:
      - "Illinois held two schoolchildren votes for state tree: 21,897 students in 1907 and 900,000 in 1973"
      - "The 1908 law specified 'Native Oak' without naming a species, creating 65 years of ambiguity"
      - "White Oak defeated Northern Red Oak by 333,964 to 142,247 in the 1973 clarification vote"
      - "Mrs. James C. Fessler of Rochelle suggested the original 1907 schoolchildren vote"
      - "Illinois has approximately 17 to 20 native oak species, making clarification necessary"

  - id: ambiguity-problem
    icon: "fa-solid fa-question-circle"
    title: "The Native Oak Ambiguity"
    paragraphs:
      - "The 1908 designation of 'Native Oak' created confusion that lasted decades. Students and legislators wanted to honor oak trees, but the vague wording caused problems."
      - "Illinois contains numerous oak species. White Oak grows statewide. Northern Red Oak dominates northern forests. Black Oak, Bur Oak, Pin Oak, and Swamp White Oak also thrive in Illinois. Each has different characteristics and wood properties."
      - "Official documents could not specify which oak represented Illinois. Tourism materials and state publications struggled with this ambiguity. The problem became more apparent as other states adopted specific tree species."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Illinois State Tree and Flower"
    paragraphs:
      - "Illinois's state flower is the Violet (Viola sororia), designated in 1908. Schoolchildren voted for the violet the same year they selected Native Oak. The violet vote was more specific from the start, though the law mentioned 'native violet' rather than a particular species. The Dooryard Violet is the most common species in Illinois."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a White Oak"
    paragraphs:
      - "The leaves provide clear identification. Each leaf has seven to nine rounded lobes with smooth edges. No bristles appear at the lobe tips. This distinguishes white oak from red oak species, which have pointed, bristle-tipped lobes."
      - "The bark is gray or almost white. Shallow furrows divide the bark into narrow ridges. The bark texture is distinctive among Illinois oaks."
      - "Acorns mature in a single growing season. The cap covers only one-fourth of the acorn. White Oak acorns taste less bitter than red oak acorns."

  - id: uses
    icon: "fa-solid fa-hammer"
    title: "Uses and Importance"
    paragraphs:
      - "White Oak wood is among the most valuable hardwoods in North America. The tight grain makes it waterproof when properly cut. Barrel makers prize it for wine and whiskey casks. The wood imparts flavor to aging spirits."
      - "Furniture makers use white oak for cabinets, tables, and chairs. The wood takes stain well and shows beautiful grain patterns. Construction workers use it for interior finishing and flooring."
      - "Wildlife depends on white oak acorns. Deer, squirrels, blue jays, wild turkeys, and wood ducks eat them. White oak produces heavy acorn crops every four to ten years. These mast years provide crucial food for forest animals."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "White Oak is often associated with strength and endurance. The tree lives 200 to 300 years when conditions favor growth. Its massive trunk and spreading branches suggest stability. Early settlers relied on white oak for building homes, barns, and fences, reflecting civic values also expressed in [Illinois's official motto](/states/illinois/motto/state-sovereignty-national-union)."

  - id: "regional-context"
    icon: "fa-solid fa-map"
    title: "Regional Context"
    paragraphs:
      - "Oak distributions and forest transitions make more sense when viewed through [States Neighboring States](/rankings/geography/states-neighboring-states), especially across Midwest river corridors."

faq:
  - question: "What is the Illinois state tree?"
    answer: "The White Oak (Quercus alba) is Illinois's official state tree. The legislature clarified this designation in 1973 after schoolchildren voted to replace the ambiguous 'Native Oak' designation from 1908."
  
  - question: "What is the Illinois state tree called?"
    answer: "Illinois's state tree is called White Oak. The scientific name is Quercus alba, meaning 'white oak' in Latin. Early settlers called it 'stave oak' for its use in barrel making."
  
  - question: "When did Illinois adopt the White Oak as state tree?"
    answer: "Illinois adopted White Oak specifically in 1973. The state had designated 'Native Oak' in 1908, but this created ambiguity because Illinois has 17 to 20 native oak species. The 1973 vote by 900,000 schoolchildren clarified the designation."
  
  - question: "Why did Illinois change from Native Oak to White Oak?"
    answer: "The 1908 law designated 'Native Oak' without specifying which species. Illinois has 17 to 20 native oak species, creating 65 years of confusion. In 1973, 900,000 schoolchildren voted to clarify. White Oak won with 333,964 votes, defeating Northern Red Oak's 142,247 votes."
  
  - question: "Who voted for Illinois's state tree?"
    answer: "Schoolchildren voted twice for Illinois's state tree. In 1907, 21,897 students voted for 'Oak' over Maple and Elm. In 1973, about 900,000 students voted to specify White Oak over Northern Red Oak. Both votes were suggested to clarify state symbols through democratic participation."
  
  - question: "What are some facts about the Illinois state tree?"
    answer: "Illinois held two schoolchildren votes 66 years apart (1907 and 1973). The 1908 'Native Oak' designation created 65 years of ambiguity. White Oak won the 1973 clarification vote by more than two to one. Mrs. James C. Fessler suggested the original 1907 vote. Illinois has 17 to 20 native oak species."
  
  - question: "How tall does White Oak grow in Illinois?"
    answer: "White Oak commonly reaches 100 feet tall in Illinois. Trunk diameters range from three to four feet. The tree develops a broad crown with spreading branches. White Oak grows in all 102 Illinois counties."
  
  - question: "Why is White Oak important for wildlife?"
    answer: "White Oak acorns provide crucial food for Illinois wildlife. Deer, squirrels, blue jays, wild turkeys, and wood ducks eat the acorns. The tree produces heavy acorn crops every four to ten years. These mast years are critical for forest animal populations."

