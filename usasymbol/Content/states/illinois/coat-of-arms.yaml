type: State Coat of Arms
state: Illinois
name: Illinois State Coat of Arms
adopted_year: 1869
is_official: true
meaning: "The Illinois coat of arms hides a political argument in plain sight. Secretary of State Sharon Tyndale designed the seal in 1868 after the Legislature refused to change the motto's word order. To register his disagreement, Tyndale printed the word 'Sovereignty' upside down on the banner in the eagle's beak — and it has stayed that way ever since. The eagle, the shield with thirteen stripes, and the rising sun over the Illinois River complete a design that has carried this hidden protest for over 150 years."
meaning_title: Meaning of the Illinois Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Illinois Coat of Arms: Meaning, Symbols and History'
seo_description: "The Illinois coat of arms, adopted in 1869, shows an eagle on a rock with a motto banner — the word 'Sovereignty' appears upside down on purpose."
hero_image: /images/coats-of-arms/illinois/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Illinois, adopted 1869, showing a bald eagle perched on a rock holding a shield and a banner reading State Sovereignty National Union
hero_image_caption: The Illinois Coat of Arms, adopted 1869. A bald eagle perches on a rock holding a shield with thirteen stripes and thirteen stars. The banner in the eagle's beak reads "State Sovereignty, National Union" — with the word "Sovereignty" printed upside down.
intro_text: "On the Illinois coat of arms, the word 'Sovereignty' is printed upside down — a deliberate protest embedded in the design by Secretary of State Sharon Tyndale when he redesigned the seal in 1868. The coat of arms shows a bald eagle on a rock, holding a shield with thirteen stripes and thirteen stars, with a rising sun and river behind it. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Illinois Coat of Arms?
  paragraphs:
  - "The coat of arms appears on the Illinois state seal, used on official documents, government correspondence, and public buildings. The Legislature adopted the current design in 1869, replacing a simpler version that had been in use since the 1830s."
  - "Illinois is one of the few states whose official seal contains a deliberate hidden protest — the upside-down word 'Sovereignty' — that was placed there by its designer and never officially corrected. The seal has been in continuous use since 1869 with the inverted text intact."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Illinois Coat of Arms
  paragraphs:
  - "Illinois became a state on December 3, 1818. Its first official seal, adopted in 1819, was effectively a copy of the Great Seal of the United States. A revised version in 1839 made minor changes to the eagle and stars but kept the same basic arrangement. By the 1860s, the seal had been stamped so many times it had worn down badly."
  - "Sharon Tyndale, who served as Illinois Secretary of State from 1865 to 1869, decided the seal needed a complete redesign. In January 1867, he persuaded Senator Allen C. Fuller to sponsor a bill authorizing a new design. Tyndale wanted to change the motto from 'State Sovereignty, National Union' to 'National Union, State Sovereignty' — a pointed shift in emphasis following the Civil War. The Legislature rejected the change on March 7, 1867, and ordered him to keep the original wording."
  - "Tyndale complied with the letter of the Legislature's order but found a way to register his disagreement. He printed the word 'Sovereignty' upside down on the motto banner. The new seal was completed in 1868 and officially adopted by the Legislature in 1869. The inverted 'Sovereignty' was either not noticed or not challenged, and it has remained on every version of the Illinois seal since."
  - "Sharon Tyndale did not live long after the seal's adoption. He was assassinated outside his home in Springfield on April 29, 1871. His killer was never identified."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Illinois Coat of Arms
  paragraphs:
  - "The Illinois coat of arms is built around a bald eagle, a shield, a motto banner, a rock, and a landscape of sun, water, and prairie. Most of the design references either American federal symbols or the physical geography of Illinois."
  elements:
  - id: eagle
    name: The Bald Eagle
    image: /images/coats-of-arms/illinois/elements/eagle.webp
    paragraphs:
    - "A bald eagle perches at the center of the design on a large rock. The eagle faces left, holds a shield in its talons, and grips a long banner in its beak. The bald eagle is the national bird of the United States and appears on the federal seal; Illinois adopted this symbol to connect the state's emblem to the broader American national identity."
  - id: shield
    name: The Shield
    image: /images/coats-of-arms/illinois/elements/shield.webp
    paragraphs:
    - "The eagle holds a shield displaying thirteen alternating red and white vertical stripes and a row of thirteen stars. Both the stripes and the stars represent the original thirteen states that formed the United States. The same shield design appears on the Great Seal of the United States, from which Illinois drew its early seals."
  - id: banner
    name: The Motto Banner
    image: /images/coats-of-arms/illinois/elements/banner.webp
    paragraphs:
    - "A long banner trails from the eagle's beak. It reads 'State Sovereignty, National Union' — the official state motto of Illinois. Look closely at the word 'Sovereignty': it appears printed upside down on every official version of the seal."
    - "This was not an accident. Secretary of State Sharon Tyndale wanted the motto reversed to read 'National Union, State Sovereignty,' reflecting the outcome of the Civil War. When the Legislature refused in 1867, Tyndale built his protest into the design itself by inverting the word 'Sovereignty.' The Legislature adopted the seal in 1869 without correcting it."
  - id: rock_and_date
    name: The Rock
    image: /images/coats-of-arms/illinois/elements/rock-and-date.webp
    paragraphs:
    - "The eagle stands on a large, bare rock. The date August 26, 1818 appears in the outer ring of the seal, marking the day Illinois signed its first state Constitution in Kaskaskia — more than three months before the federal government officially admitted Illinois to the Union on December 3, 1818."
  - id: landscape
    name: The Sun, River, and Prairie
    image: /images/coats-of-arms/illinois/elements/landscape.webp
    paragraphs:
    - "Behind the eagle, a sun rises over a body of water. The water is understood to represent the Illinois River. A flat prairie stretches into the background, reflecting the character of the Illinois landscape at the time of statehood."
    - "The rising sun is a common symbol on American state seals of the nineteenth century, generally representing a new beginning or the promise of a young state."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Illinois Coat of Arms
  paragraphs:
  - "Most of the design follows the conventions of American state heraldry: eagle, shield, stripes, stars, rising sun. Illinois borrowed directly from the Great Seal of the United States in its first two seal designs and kept many of those elements when Tyndale redesigned it in 1868."
  - "What makes the Illinois seal different from almost every other state seal in the country is what Tyndale added: the upside-down 'Sovereignty.' It is one of the rare cases in American official history where a government document contains a deliberate political protest concealed within the official imagery."
  - "The motto 'State Sovereignty, National Union' was contentious after the Civil War. Tyndale believed the Union's survival was more important than the concept of state sovereignty, and he encoded that belief into the seal that Illinois still uses today."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Illinois Coat of Arms Facts
  facts:
  - "Adopted: 1869, after Secretary of State Sharon Tyndale redesigned the seal in 1868 to replace a version that had worn down from heavy use."
  - "The word 'Sovereignty' in the motto banner appears upside down — a deliberate protest by designer Sharon Tyndale after the Legislature rejected his proposal to reverse the motto's word order on March 7, 1867."
  - "Illinois's first state seal, adopted in 1819, was essentially an identical copy of the Great Seal of the United States."
  - "The date August 26, 1818 on the seal marks the signing of Illinois's first Constitution in Kaskaskia — the day the state was constitutionally formed, before Congress formally admitted it to the Union."
  - "Sharon Tyndale, who designed the seal, was assassinated outside his Springfield home on April 29, 1871. His killer was never identified."
  - "The thirteen stripes and thirteen stars on the eagle's shield represent the original thirteen states of the United States."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Illinois Coat of Arms
  paragraphs:
  - "Illinois went through several seal designs before the current one. The territorial seal, created in 1809 when Illinois was still a territory, was modeled closely on the Great Seal of the United States. The first state seal adopted in 1819 was nearly identical to the federal seal."
  - "A second state seal, adopted in 1839, made modest changes — the eagle's wings were reduced and the number of stars was adjusted — but the design remained derivative of the federal seal. The 1869 design by Sharon Tyndale was the first to give Illinois a genuinely distinct visual identity."
