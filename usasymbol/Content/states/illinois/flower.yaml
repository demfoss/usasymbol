seo_title: "Illinois State Flower: Violet – History & Facts"
seo_description: "The Violet became Illinois's state flower in 1908. These small purple flowers bloom across Illinois prairies and woodlands each spring."

intro_text: "The Violet gained official status as Illinois's state flower in 1908. These small purple flowers bloom in woodlands and prairies throughout Illinois. Native violets carpet forest floors and grassy areas across the state each spring, often in habitats shared with [Illinois's state bird, the Northern Cardinal](/states/illinois/bird/northern-cardinal)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Illinois State Flower?"
    paragraphs:
      - "Violet stands as the floral emblem of Illinois. Each flower displays five petals in shades of purple, blue, or white depending on the species. The blooms measure about half an inch to one inch across. Heart-shaped leaves grow on short stems from the plant's base. A distinctive spur extends from the back of each flower."
      - "Illinois violets bloom from March through May across the state. Early spring triggers the first blooms in southern Illinois. Northern regions see flowers appear several weeks later. The plants grow 4 to 8 inches tall. Low growing stems spread across the ground. Violets thrive in moist soil with partial shade."
      - "Native violet species grow throughout Illinois in diverse habitats. Woodlands provide ideal conditions for many varieties. Prairie violets prefer open grasslands. The plants tolerate various soil types. Some species grow in wetlands while others thrive in dry upland areas. Illinois hosts more than 30 native violet species, including regions linked to [Illinois's state tree, the White Oak](/states/illinois/tree/white-oak)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Illinois State Flower Name"
    paragraphs:
      - "This flower carries the common name Violet and the scientific name Viola sororia for the most common Illinois species. The plant belongs to the Violaceae family. This family contains about 900 species of violets and pansies found worldwide."
      - "The genus name Viola comes from the Latin word for violet. The species name sororia means sisterly, referring to how closely this violet resembles other species. Common blue violet serves as another name for Viola sororia. People also call it common meadow violet or hooded violet."
      - "Illinois never specified which violet species qualified as the official state flower. The 1908 designation simply said violet without naming a particular species. This allows all native Illinois violets to represent the state. Viola sororia appears most frequently across Illinois landscapes among the many violet species."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Violet Became the Illinois State Flower"
    paragraphs:
      - "Illinois lawmakers named the Violet the state flower in 1908. School children throughout Illinois voted for their preferred flower before the official designation. The violet won this statewide vote among students. Girls' clubs and women's organizations also supported the violet selection, and this process is commonly compared on the [list of U.S. state flowers](/symbols/flowers)."
      - "The violet's widespread distribution across Illinois influenced the choice. Every county in the state had native violet populations. The flowers bloomed reliably each spring. Their delicate beauty appealed to Illinois residents. Native violets required no special cultivation or care."
      - "Some debate occurred over selecting a specific violet species. Lawmakers decided against naming one particular type. They wanted the designation to include all native Illinois violets. The legislature passed the resolution on January 21, 1908. Illinois became one of the first states to adopt an official floral emblem through student voting."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Illinois State Flower Facts"
    facts:
      - "Illinois hosts over 30 native violet species with flowers ranging from deep purple to white, growing in habitats from woodlands to prairies"
      - "Violets produce two types of flowers including showy spring blooms for pollination and hidden summer flowers that self-pollinate without opening"
      - "Illinois adopted the Violet on January 21, 1908, following a vote by school children across the state who selected it as their favorite flower"
      - "Native Americans and early settlers ate violet leaves in salads and used the flowers to make syrup, with the leaves being rich in vitamins A and C"
      - "Violet seeds have a special appendage that attracts ants which carry the seeds to new locations and help spread the plants"
      - "The common blue violet can produce flowers in fall as well as spring when conditions remain favorable with adequate moisture"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Illinois State Flower and Bird"
    paragraphs:
      - "The Northern Cardinal serves as Illinois's state bird, a brilliant red songbird common throughout the state. Both symbols represent Illinois officially. Illinois adopted the Violet in 1908 and designated the Northern Cardinal as state bird in 1929."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Violet is commonly seen as representing modesty and faithfulness in traditional flower symbolism. The flower has been linked to Illinois's prairie heritage and woodland ecosystems. Its ability to thrive in diverse conditions carries connotations of adaptability and resilience across Illinois's varied landscapes, a theme that overlaps with [Illinois's white-tailed deer conservation story](/states/illinois/mammal/white-tailed-deer)."

  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Context"
    paragraphs:
      - "Bloom timing varies by latitude and terrain, so interstate framing through [States Neighboring States](/rankings/geography/states-neighboring-states) helps readers compare Illinois flowering windows with nearby states."

faq:
  - question: "What is Illinois's state flower?"
    answer: "Illinois's state flower is the Violet, a small purple flower that blooms in woodlands and prairies throughout the state each spring."
  
  - question: "When did Illinois adopt the Violet as its state flower?"
    answer: "Illinois adopted the Violet on January 21, 1908. The designation followed a statewide vote by school children who selected it as their favorite flower."
  
  - question: "Why did Illinois choose the Violet?"
    answer: "Illinois chose the Violet because it grows abundantly throughout every county in the state. School children voted for it in a statewide election. The flower's widespread distribution, reliable spring blooms, and delicate beauty made it an appropriate symbol. Girls' clubs and women's organizations also supported the selection."
  
  - question: "Which species of violet is Illinois's state flower?"
    answer: "Illinois never specified a particular violet species as the state flower. The 1908 designation includes all native Illinois violets. The common blue violet appears most frequently across the state among more than 30 native violet species."
  
  - question: "When do violets bloom in Illinois?"
    answer: "Violets bloom from March through May in Illinois. Early spring triggers the first blooms in southern Illinois while northern regions see flowers several weeks later. Some species can produce fall blooms when conditions remain favorable."

