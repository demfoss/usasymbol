sections:
- id: land-of-lincoln
  icon: fa-solid fa-landmark
  title: What "Land of Lincoln" Means on Illinois Plates
  paragraphs:
  - '"Land of Lincoln" works as a plate slogan because the claim is specific and verifiable. Abraham Lincoln was not born in Illinois — he was born in Kentucky — but he became Lincoln in Illinois. He arrived at 21, taught himself law, served in the state legislature, built a legal reputation across the Illinois circuit courts, and won the 1858 Senate debates that made him a national figure. By the time he left for Washington in 1861, Illinois had shaped everything about how Lincoln thought and argued.'
  - 'No other state can make an equivalent claim. Lincoln''s Kentucky birthplace and Indiana boyhood home are historically significant, but neither produced the lawyer, the legislator, or the president. Illinois did. The slogan is not a tourism aspiration — it is a statement of historical fact that holds up under scrutiny, which is why it has never been seriously challenged or replaced in over seven decades on the plate.'
  - 'The phrase is also Illinois''s official state slogan and appears widely in government materials — see the [Illinois state motto](/states/illinois/motto) for the formal constitutional phrase the state also carries, and [Illinois''s state nickname](/states/illinois/nickname) for the full context of "Land of Lincoln" alongside "The Prairie State."'

- id: lincoln-illinois
  icon: fa-solid fa-scale-balanced
  title: Why Illinois Can Make This Claim
  paragraphs:
  - 'Lincoln arrived in Illinois in 1830, at 21, with no legal training and no political connections. He settled in New Salem, then moved to Springfield in 1837 after passing the bar. For the next 24 years he rode the Eighth Judicial Circuit — traveling hundreds of miles by horse each term to argue cases in county courts across central Illinois. That circuit work shaped his rhetorical precision and his ability to address juries of ordinary people, which would later define his public speeches.'
  - 'Springfield remains the most Lincoln-dense city in the country outside Washington, D.C. The Lincoln Home National Historic Site, the Abraham Lincoln Presidential Library and Museum, and Lincoln''s tomb in Oak Ridge Cemetery are all in Springfield — a concentration of primary Lincoln sites that no other state can match. When Illinois put "Land of Lincoln" on its plate, it was pointing to a physical place, not a sentiment.'
  - 'The 1858 Lincoln–Douglas debates took place across seven Illinois cities. Lincoln lost that Senate race to Stephen Douglas, but the debates were published nationally and established Lincoln as the leading voice against the expansion of slavery. Without those Illinois debates, the 1860 Republican nomination almost certainly goes to someone else. The plate slogan is ultimately shorthand for that entire chain of events.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Illinois License Plate Designs by Era
  paragraphs:
  - Illinois plates have gone through multiple visual generations since statehood, but "Land of Lincoln" has been constant since 1954 — longer than most state slogans anywhere in the country.
  versions:
  - name: Land of Lincoln Introduced
    years: 1954–1967
    image: /images/license-plates/illinois/1954-illinois-plate.webp
    description: Illinois first used "Land of Lincoln" on its standard plate in 1954. Beginning in 1955, the state entered a long run of plates in the same basic format, with the italicized slogan alternating between the bottom in odd years and the top in even years.
  - name: Statehood Sesquicentennial Plate
    years: 1968
    image: /images/license-plates/illinois/1968-illinois-plate.webp
    description: Illinois marked its 150th statehood anniversary with a commemorative plate. An "18" in each upper corner was meant to read together as 1818, the year Illinois became a state. "Land of Lincoln" remained prominent across the top.
  - name: Minimized Slogan Era
    years: 1979–2000
    image: /images/license-plates/illinois/1979-illinois-plate.webp
    description: Beginning in 1979, "Land of Lincoln" became smaller than it had been on earlier plates. The slogan remained continuous, but the state name and registration number dominated the design more clearly.
  - name: Lincoln Graphic Plate
    years: 2001–2016
    image: /images/license-plates/illinois/2001-illinois-plate.webp
    description: Illinois added Abraham Lincoln as a plate graphic in 2001, pairing a portrait with the long-running slogan for the first time. The design made the person behind the phrase visible on the plate itself.
  - name: Current Standard Plate
    years: 2017–present
    image: /images/license-plates/illinois/current-illinois-plate.webp
    description: Illinois's current standard plate retains "Land of Lincoln" and keeps Lincoln imagery on the left side while adding a state skyline and capitol motif. The slogan has been present on every standard plate since 1954.

- id: why-lasted
  icon: fa-solid fa-rotate
  title: Why "Land of Lincoln" Has Outlasted Every Redesign
  paragraphs:
  - '"Land of Lincoln" has survived every Illinois plate redesign since 1954 because it anchors the state to a specific historical person, not a landscape, a season, or a generic claim about quality of life. Slogans that describe a feeling ("Beautiful," "Discover") age out. Slogans tied to verifiable history do not. Lincoln''s Illinois years are not in dispute, and no legislature has found a reason to remove the phrase.'
  - 'Illinois also invested in Lincoln-related infrastructure in a way that makes the slogan defensible as current fact, not just history. The Abraham Lincoln Presidential Library opened in Springfield in 2004, the Lincoln Home National Historic Site draws hundreds of thousands of visitors annually, and Lincoln''s name appears on dozens of Illinois counties, cities, and institutions. The plate slogan is supported by the state''s ongoing cultural and economic commitment to the Lincoln identity.'
  - 'For comparison, see how other states chose their plate slogans: [Alaska''s "The Last Frontier"](/states/alaska/license-plate) and [Hawaii''s "Aloha State"](/states/hawaii/license-plate) each reflect a different kind of state identity — geographic and cultural, respectively. Illinois''s is biographical, and that specificity is what has kept it unchanged for over 70 years.'

timeline:
- year: 1818
  description: Illinois becomes the 21st U.S. state on December 3. Early plates carry only "Illinois" with no slogan or graphic imagery.
- year: 1830
  description: Abraham Lincoln arrives in Illinois at age 21, settling first in New Salem. He will spend the next 31 years in the state, building his legal career and entering politics.
- year: 1837
  description: Lincoln moves to Springfield and begins practicing law. He will remain in Springfield until leaving for Washington after his 1860 presidential election.
- year: 1858
  description: Lincoln and Stephen Douglas debate across seven Illinois cities during the Senate race. Lincoln loses the seat but gains national prominence — the event that makes his 1860 presidential run possible.
- year: 1861
  description: Lincoln leaves Springfield for Washington after winning the 1860 presidential election. His farewell address to Springfield on February 11, 1861, is one of the most quoted speeches in Illinois history.
- year: 1954
  description: Illinois adds "Land of Lincoln" to its standard license plate, timed to observance of the 145th anniversary of Lincoln's birth. The slogan has appeared on every Illinois standard plate since.
- year: 1955
  description: Illinois begins a long run of similarly formatted plates, with the italicized "Land of Lincoln" slogan alternating between bottom placement in odd years and top placement in even years.
- year: 1968
  description: Illinois issues a commemorative plate for the state's 150th statehood anniversary. The "18" in each upper corner is intended to be read as 1818, the statehood year.
- year: 1979
  description: Illinois reduces the size of "Land of Lincoln" compared with earlier plates while keeping the slogan on the standard issue.
- year: 2001
  description: Abraham Lincoln is added as a graphic element on the standard plate, accompanying the long-standing slogan.
- year: 2004
  description: The Abraham Lincoln Presidential Library and Museum opens in Springfield, reinforcing the infrastructure that supports the plate slogan as current fact, not just historical reference.

faq:
- question: What is Illinois's license plate slogan?
  answer: Illinois's license plate slogan is "Land of Lincoln," which has appeared on every Illinois standard plate since 1954. It is also Illinois's official state slogan.
- question: Why does Illinois say "Land of Lincoln" on its license plates?
  answer: Abraham Lincoln spent 31 years in Illinois — from 1830 to 1861 — building his legal career and entering national politics. He arrived in New Salem at 21, moved to Springfield in 1837, and left only when elected president. Illinois's claim to Lincoln is based on where he became the figure history remembers.
- question: When did Illinois add "Land of Lincoln" to its license plates?
  answer: Illinois added "Land of Lincoln" to its standard plates in 1954, timed to observance of the 145th anniversary of Lincoln's birth on February 12, 1809.
- question: Was Lincoln born in Illinois?
  answer: No. Abraham Lincoln was born in Hardin County, Kentucky, on February 12, 1809, and spent his early childhood in Indiana. He arrived in Illinois in 1830 at age 21 and spent the next 31 years there — which is the basis of the "Land of Lincoln" claim.
- question: What is the difference between "Land of Lincoln" and "Prairie State"?
  answer: '"Prairie State" is Illinois''s older informal nickname, reflecting the tall-grass prairie ecosystems that once covered most of the state before large-scale agriculture. "Land of Lincoln" is the official state slogan and the phrase on the license plate — biographical rather than geographic, and introduced much later. Both are covered on the [Illinois state nickname](/states/illinois/nickname) page.'
- question: How long has "Land of Lincoln" been on Illinois plates?
  answer: '"Land of Lincoln" has been on Illinois plates continuously since 1954 — more than 70 years. It is one of the longest-running unchanged plate slogans in U.S. history.'
- question: What Lincoln sites can you visit in Illinois?
  answer: Springfield, Illinois, holds the largest concentration of Lincoln primary sites outside Washington, D.C., including the Lincoln Home National Historic Site, the Abraham Lincoln Presidential Library and Museum, and Lincoln's tomb at Oak Ridge Cemetery. The Lincoln–Douglas debate sites are distributed across seven Illinois cities.

