seo_title: 'Illinois License Plate Slogan: Land of Lincoln History & Designs'
seo_description: Illinois license plates have carried "Land of Lincoln" since 1954, when the state added the slogan ahead of the Lincoln sesquicentennial. Learn what the phrase means, when it was added, and how Illinois plate designs changed over the decades.
hero_image: /images/license-plates/illinois/land-of-lincoln-plate.webp
hero_image_alt: Illinois Land of Lincoln license plate
hero_image_caption: Illinois's "Land of Lincoln" plate — the slogan introduced in 1954 that has appeared on every standard Illinois plate since, making it one of the most enduring license plate slogans in the United States.
intro_text: '**"Land of Lincoln"** has appeared on Illinois license plates since 1954, when the state added the slogan ahead of the 145th anniversary of Abraham Lincoln''s birth. The phrase is not just a nickname — it functions as Illinois''s official state slogan and is backed by the strongest single historical claim any state makes on a plate: Lincoln lived and worked in Illinois for 31 years, built his entire legal and political career there, and left Springfield for Washington only when elected president in 1860.'
quick_answer: '"Land of Lincoln" has been the Illinois license plate slogan since 1954. It reflects the 31 years Abraham Lincoln spent in Illinois — arriving in 1830, building a law practice in Springfield, and leaving for Washington after his 1860 presidential election. The phrase is also Illinois''s official state slogan.'
