hero_image_caption: Illinois's "Land of Lincoln" plate — the slogan introduced in 1954 that has appeared on every standard Illinois plate since, making it one of the most enduring license plate slogans in the United States.
intro_text: "**\"Land of Lincoln\"** has appeared on Illinois license plates since 1954 and functions as the state's official slogan. The claim is unusually direct: Abraham Lincoln lived and worked in Illinois for 31 years, built his legal and political career there, and left Springfield only after winning the presidency in 1860. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Land of Lincoln\" has been the Illinois license plate slogan since 1954. It reflects the 31 years Abraham Lincoln spent in Illinois — arriving in 1830, building a law practice in Springfield, and leaving for Washington after his 1860 presidential election. The phrase is also Illinois's official state slogan."
