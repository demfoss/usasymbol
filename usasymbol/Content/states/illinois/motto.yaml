seo_description: "Illinois's state motto is \"State Sovereignty, National Union.\" Sharon Tyndale arranged the 1868 seal banner so \"National Union\" reads right-side up."

intro_text: "Illinois's state motto is <strong>State Sovereignty, National Union</strong>. On the state seal, the motto is inscribed on a banner held by an eagle — arranged so \"National Union\" reads right-side up and \"State Sovereignty\" reads upside down, a deliberate choice made by Secretary of State Sharon Tyndale in 1868, three years after the Civil War ended."

