faq:
  - question: "What is Illinois's state motto?"
    answer: "Illinois's state motto is \"State Sovereignty, National Union.\" It has appeared on the state seal since Illinois became the 21st state in 1818. In the current 1868 design, \"National Union\" reads right-side up and \"State Sovereignty\" reads upside down on the motto banner."

  - question: "What does \"State Sovereignty, National Union\" mean?"
    answer: "The phrase expresses the constitutional balance between the authority of individual states to govern themselves and the authority of the United States as a unified nation. Both ideas were part of American political thought from the founding; the Civil War made the tension between them explicit."

  - question: "Why does \"State Sovereignty\" read upside down on the Illinois seal?"
    answer: "In the 1868 redesign, Secretary of State Sharon Tyndale arranged the motto banner so \"National Union\" faces right-side up and \"State Sovereignty\" faces upside down. Tyndale said the reason was readability. The redesign was completed three years after the Civil War ended, and critics have interpreted the orientation as a deliberate political choice placing national authority above state sovereignty."

  - question: "When did Illinois adopt its state motto?"
    answer: "\"State Sovereignty, National Union\" was part of the original state seal adopted in 1818 when Illinois became a state. The current arrangement, with \"National Union\" reading right-side up, dates to Sharon Tyndale's 1868 redesign."

  - question: "Where does Illinois's motto appear?"
    answer: "On the ribbon banner held by the eagle on the Great Seal of Illinois, and on the Illinois state flag, which displays the full seal design on a white field. The flag was adopted in 1915 and revised in 1969 to add \"Illinois\" below the seal."

