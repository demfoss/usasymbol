title: "State Sovereignty, National Union"
language: "English"
english_translation: ""
adopted_year: 1819

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Illinois State Motto: State Sovereignty, National Union"
seo_description: "Illinois's motto 'State Sovereignty, National Union' has a word appearing upside down on the current seal — a silent act of political protest by Secretary of State Sharon Tyndale in 1868. The word order was also controversial after the Civil War. Full history of the motto and its hidden meaning."

intro_text: "Illinois's state motto is <strong>State Sovereignty, National Union</strong>, adopted on February 19, 1819. The phrase appears on a banner in the beak of an eagle on the state seal. But the current seal — redesigned in 1868 — has something unusual: the word 'Sovereignty' appears upside down on the banner. That inversion was a deliberate act by Secretary of State Sharon Tyndale, who had tried and failed to get the word order reversed after the Civil War."

sections:
  - id: "upside-down-sovereignty"
    icon: "fa-solid fa-rotate"
    title: "Why 'Sovereignty' Appears Upside Down on Illinois's Seal"
    paragraphs:
      - "Illinois's current state seal, designed in 1868, shows an eagle clutching a banner with the state motto. Look closely at the banner and something is off: the word 'SOVEREIGNTY' appears upside down while 'NATIONAL UNION' reads right-side up at the top of the ribbon. This was not an accident."
      - "The Civil War had just ended. Secretary of State Sharon Tyndale believed that 'State Sovereignty' — appearing first and in the dominant position — sent the wrong message for a Union-loyal state after the Confederacy's defeat in the name of states' rights. He approached Senator Allen C. Fuller in January 1867, proposing that the legislature change the motto to 'National Union, State Sovereignty' — putting federal authority first."
      - "The legislature disagreed. A bill passed on March 7, 1867 authorized a new seal but required the original motto unchanged, with 'State Sovereignty' first. Tyndale was tasked with executing the redesign. He complied with the letter of the law but twisted the banner: 'National Union' sits at the top of the ribbon, clearly readable. 'Sovereignty' hangs below it, inverted. The legislature noticed and never corrected it. The upside-down banner has been Illinois's official seal ever since."

  - id: "word-order-controversy"
    icon: "fa-solid fa-scale-balanced"
    title: "The Political Weight of Word Order"
    paragraphs:
      - "Illinois adopted the motto on February 19, 1819 — barely a year after statehood on December 3, 1818. The legislature needed a seal and modeled it on the Great Seal of the United States. Where the federal seal carries 'E Pluribus Unum,' Illinois substituted 'State Sovereignty, National Union.' The swap was deliberate: it expressed the political tension of the era around the balance between state and federal power, at the height of Missouri Compromise debates."
      - "Word order in the motto was never innocent. 'State Sovereignty' first meant something. In 1819, it signaled a state asserting its right to self-governance alongside federal membership. After the Civil War — fought partly over exactly this question — the same word order carried a different charge. Tyndale's protest, and the legislature's refusal to change the words, captured the political fault line in one banner."
      - "The Illinois General Assembly has never moved to fix the inverted 'Sovereignty,' correct the banner, or change the motto. The upside-down word remains part of the official seal to this day — a 19th-century political argument frozen into the state's most official symbol."

  - id: "1819-origins"
    icon: "fa-solid fa-landmark"
    title: "Where the Motto Came From in 1819"
    paragraphs:
      - "Illinois became the 21st state on December 3, 1818. In its first full legislative session, the General Assembly needed an official seal. They hired gunsmith Philip Creamer to engrave it for $85. The design closely followed the federal Great Seal: an eagle at the center, a shield on its chest, stars above. The one change was the motto — replacing 'E Pluribus Unum' with 'State Sovereignty, National Union.'"
      - "No single author for the phrase is on record. It expressed the prevailing view among Illinois legislators that statehood meant both self-governance and Union membership — that these weren't opposites but paired commitments. Illinois entered as a free state positioned between slave states: Kentucky to the south and Missouri to the west. The political pressure to define Illinois's relationship to both was real from day one."
      - "The seal wore out from heavy use. The legislature ordered a replacement in 1839 — the Second Great Seal — with the same motto. The third (and current) seal came in 1868, the one where Tyndale made his silent edit. Illinois Revised Statutes contain the seal description."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Illinois State Motto Facts"
    style: "gradient"
    facts:
      - "The word 'SOVEREIGNTY' appears upside down on the current Illinois state seal — placed that way by Secretary of State Sharon Tyndale in 1868."
      - "Tyndale tried to reverse the motto to 'National Union, State Sovereignty' post-Civil War; the legislature blocked him."
      - "Gunsmith Philip Creamer engraved Illinois's first seal for $85 in 1819."
      - "Illinois has had three official seals (1819, 1839, 1868) — the motto stayed the same on all three."
      - "The motto replaced 'E Pluribus Unum' on the federal-seal-style design: a deliberate substitution."
      - "Illinois entered the Union bordered by slave states: Kentucky to the south, Missouri to the west."

faq:
  - question: "What is Illinois's state motto?"
    answer: "Illinois's state motto is 'State Sovereignty, National Union,' adopted on February 19, 1819, as part of the first state seal design."

  - question: "Why does 'Sovereignty' appear upside down on Illinois's seal?"
    answer: "Secretary of State Sharon Tyndale placed it that way deliberately in 1868. After the Civil War, he wanted to reverse the motto to 'National Union, State Sovereignty.' The legislature blocked him and required the original wording. Tasked with designing the new seal anyway, Tyndale twisted the banner so 'National Union' reads right-side up at the top and 'Sovereignty' hangs inverted below. The legislature never corrected it."

  - question: "When did Illinois adopt its motto?"
    answer: "February 19, 1819 — during the first full legislative session after Illinois became the 21st state on December 3, 1818."

  - question: "What does 'State Sovereignty, National Union' mean?"
    answer: "'State Sovereignty' means the right of Illinois to govern itself. 'National Union' means membership in and loyalty to the federal government. The two concepts express the founding-era view that statehood meant both self-governance and Union membership. The word order — 'State Sovereignty' first — became politically charged after the Civil War."

  - question: "Is Illinois's motto in English or Latin?"
    answer: "English. Illinois chose plain English in 1819 at a time when many states still used Latin. The phrase was a direct political statement about state and federal authority rather than a classical-language formality."

  - question: "Where does Illinois's motto appear?"
    answer: "On the state seal (an eagle holding a banner with the motto — 'Sovereignty' upside down), the state flag (which features the seal), official documents, and driver's licenses. The current seal was designed in 1868."

