sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Illinois's State Fruit?"
    paragraphs:
      - "The GoldRush apple is Illinois's official state fruit, designated by the Illinois General Assembly in 2007. It is a modern apple variety developed through a cooperative breeding program that included the University of Illinois."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the GoldRush Apple"
    paragraphs:
      - "The GoldRush is a yellow-green apple with a firm, crisp texture and a tangy, sweet flavor that grows sweeter after storage. It was bred in the 1990s as part of the PRI disease-resistant apple breeding program, a joint effort among Purdue, Rutgers, and the University of Illinois."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the GoldRush Apple Became Illinois's State Fruit"
    paragraphs:
      - "The Illinois General Assembly designated the GoldRush apple the official state fruit in 2007, following a push by Illinois students to recognize the variety."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Illinois Chose the GoldRush Apple"
    paragraphs:
      - "The GoldRush apple was developed with University of Illinois involvement as part of a disease-resistant breeding program, giving the variety a direct research connection to the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "GoldRush Apple Facts"
    facts:
      - "Adopted as Illinois's state fruit in 2007."
      - "The GoldRush apple was bred through the PRI program, which included the University of Illinois."
      - "The GoldRush apple's flavor grows sweeter the longer it is stored."

