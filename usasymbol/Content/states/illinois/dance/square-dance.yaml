faq:
  - question: What is Illinois's state dance?
    answer: "Illinois's official dance is square dance, adopted in 1990."
  - question: When did Illinois adopt square dance as its state dance?
    answer: "Illinois adopted square dance as its official dance in 1990."
  - question: Why did Illinois choose square dance?
    answer: "Square dance was already central to social life in Illinois's prairie barn dances and community clubs, and it fit a national movement of states naming it their official dance."
  - question: Is square dance the same in every state?
    answer: "The core formation and calls are shared nationally, but many states, including Illinois, adopted square dance through the same 1970s-1990s campaign, so the exact designation and local traditions vary by state."

