seo_title: 'Illinois State Bird: Northern Cardinal'
seo_description: Illinois made the Northern Cardinal its official state bird in 1929 after a schoolchildren vote. Learn what is firmly documented, what is often overstated, and why the vote matters most.
intro_text: Illinois's official state bird is the <strong>Northern Cardinal</strong>, made official in <strong>1929</strong> and now listed in <strong>5 ILCS 460/10</strong>. The solid part of the story is that Illinois schoolchildren chose the cardinal in <strong>1928</strong> and lawmakers carried that choice into law the next year. That public route into state symbolism is the strongest documented reason the designation still matters. The familiar claim that Illinois was the first cardinal state is shakier than Illinois summaries sometimes suggest.
