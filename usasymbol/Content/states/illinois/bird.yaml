sections:
- id: why-illinois-chose-the-cardinal
  icon: fa-solid fa-circle-question
  title: Why Is the Northern Cardinal Illinois's State Bird?
  paragraphs:
  - Illinois chose the cardinal through a schoolchildren's vote in 1928, then made that choice official in 1929. That vote-to-law sequence is the firmest part of the story and the clearest reason the designation still matters.
  - 'The Illinois Department of Natural Resources says schoolchildren voted on five candidates: cardinal, bluebird, meadowlark, bobwhite, and oriole. The cardinal won. That makes the choice more specific than the usual vague state-symbol folklore — there was a real ballot, real competition, and a documented result that the legislature then codified.'
- id: was-illinois-really-the-first-cardinal-state
  icon: fa-solid fa-scale-balanced
  title: Was Illinois the First State to Choose the Cardinal?
  paragraphs:
  - Illinois sources, including the Department of Natural Resources, call Illinois the first of seven states to choose the cardinal. That framing shows up across a lot of Illinois summaries.
  - But Kentucky's official Legislative History project dates Kentucky's cardinal approval to <strong>February 17, 1926</strong> — three years before Illinois adopted the bird in 1929. That makes the first-state claim unreliable, and it is worth flagging because it circulates widely.
  - The stronger Illinois claim is not about priority. It is about process. The schoolchildren vote is documented, specific, and unusual — that is what Illinois contributes to the cardinal story, not a superlative that the dates do not fully support.
- id: seven-cardinal-states-what-makes-illinois-different
  icon: fa-solid fa-map
  title: Seven States Share This Bird — What Sets Illinois Apart
  paragraphs:
  - 'The Northern Cardinal is the state bird of Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia — more states than any other species except the Western Meadowlark. That scale raises a fair question: what, if anything, distinguishes one cardinal state from another?'
  - For Illinois, the answer is the 1928 vote. Most of the other cardinal states designated the bird through standard legislative action. Illinois ran a statewide educational ballot first, then let the result drive the legislation. Among the seven, that public-participation path is what gives the Illinois designation its distinct character.
faq:
- question: What is Illinois's state bird?
  answer: Illinois's state bird is the Northern Cardinal, adopted in 1929 and listed in 5 ILCS 460/10.
- question: How did Illinois choose the Northern Cardinal?
  answer: Illinois schoolchildren voted on five candidates in 1928 — cardinal, bluebird, meadowlark, bobwhite, and oriole. The cardinal won, and lawmakers codified that result in 1929.
- question: Was Illinois the first state to choose the cardinal?
  answer: Illinois sources often claim it was, but Kentucky's official legislative history dates Kentucky's cardinal approval to February 17, 1926 — three years earlier. The first-state claim is not well-supported.
- question: What other states use the Northern Cardinal as their state bird?
  answer: Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia also use the Northern Cardinal, making it one of the most shared state birds in the country.
- question: What were the other birds on Illinois's 1928 ballot?
  answer: Bluebird, meadowlark, bobwhite, and oriole. The cardinal won the schoolchildren's vote and was made official the following year.
