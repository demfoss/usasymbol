title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1929
legislation: 5 ILCS 460/10
meaning: The durable Illinois story is the 1928 schoolchildren vote carried into 1929 law. That part is better supported than the repeated claim that Illinois was the first cardinal state.
author: USA Symbol Team
