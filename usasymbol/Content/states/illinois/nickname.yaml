author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-13"
seo_title: "Illinois State Nickname: 'The Prairie State' & 'Land of Lincoln'"
seo_description: "Illinois earned the Prairie State nickname for its historic prairies, and uses the slogan Land of Lincoln in reference to Abraham Lincoln."

intro_text: "Illinois is commonly known by two major names: <i>the Prairie State</i> and the Land of Lincoln. The Prairie State reflects the expansive grasslands that once covered much of Illinois before large-scale settlement. Land of Lincoln honors Abraham Lincoln, who spent 31 years living and working in the state and built his political career in Springfield. Neither name has been formally adopted as an official nickname by state law, although Land of Lincoln functions as Illinois’s official state slogan and appears widely in government and public materials."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Prairie State'"
    paragraphs:
      - "Why is Illinois called the Prairie State? The explanation lies in the state's early geography. Before large-scale farming began in the 1800s, prairie grasslands covered roughly 22 million acres of Illinois. These tall-grass ecosystems dominated central and northern regions, where grasses could reach several feet in height — forming the eastern edge of the vast grassland belt that stretched all the way to Kansas, a state whose [origins of the Sunflower State](/states/kansas/nickname/the-sunflower-state) nickname is rooted in the same prairie landscape, though Kansas retained far more of it than Illinois ever did. Wildflowers appeared in seasonal waves, adding color to the landscape and connecting directly to [Illinois's state flower, the Violet](/states/illinois/flower/violet). French explorers used the word prairie, meaning meadow, to describe this terrain."
      - "Settlers entering Illinois during the 1800s encountered sweeping stretches of open grass. Except for trees growing along rivers or wetlands, the land appeared almost treeless in many areas. Writers and travelers began referring to Illinois as the Prairie State in the 1840s, using the term to distinguish it from heavily wooded states farther east. The nickname persisted because it reflected a defining natural feature of Illinois before agricultural development reshaped the region."
      - "Today, less than one percent of the original prairie survives. Most of the grasslands were converted into farmland used for corn and soybean production. A few preserves protect remaining patches of native prairie, offering a glimpse of the landscape that once dominated Illinois. The Prairie State nickname serves as a reminder of this lost ecosystem — and earns its place in the [united states nicknames by state](/symbols/nicknames) as one of the most ecologically rooted of all state identities."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Land of Lincoln"
        text: "Illinois gained the Land of Lincoln nickname because Abraham Lincoln spent the majority of his adult life in the state. Lincoln arrived in Illinois in 1830 and lived in Illinois until 1861. He worked a series of jobs, studied law, and eventually entered public service. His legal practice in Springfield and his time in the state legislature helped establish his national reputation. Although unofficial, Land of Lincoln appears on Illinois license plates and is strongly associated with the state's identity, including the constitutional language shown on [Illinois's state motto page](/states/illinois/motto/state-sovereignty-national-union)."
      - subtitle: "The Inland Empire"
        text: "This nickname circulated among writers and boosters in the late 1800s and early 1900s. The phrase suggested that Illinois held economic influence despite having no access to ocean coasts. Chicago's rapid growth during this era played a major role. As railroads, manufacturing centers, and trade routes expanded, Illinois became a powerful hub linking the eastern and western United States, with interstate context summarized in [States Neighboring States](/rankings/geography/states-neighboring-states). While the term appears less today, historical references still highlight its use during Illinois's industrial rise."
      - subtitle: "The Sucker State"
        text: "The Sucker State is an early nickname from the 1800s, and several theories attempt to explain its origin. One idea connects it to miners from southern Illinois who traveled north to Galena's lead mines during the summer and returned home in winter, much like sucker fish moving with seasonal flows. Another interpretation refers to settlers who were supposedly easy to deceive. Because the nickname carried negative associations, its use faded by the late 1800s. Today it appears mainly in historical accounts rather than as a modern label, while official branding is more often anchored to symbols like the [Illinois state flag](/states/illinois/flag/illinois-state-flag)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Prairie grasslands once covered about 22 million acres of Illinois before large-scale settlement."
      - "Less than one percent of Illinois's original prairie landscape remains today."
      - "Abraham Lincoln spent 31 years in Illinois, shaping his legal and political career in Springfield."
      - "Illinois license plates display Land of Lincoln rather than the Prairie State nickname."
      - "The state motto is State Sovereignty, National Union, adopted in 1818."
      - "Chicago grew rapidly during the railroad boom of the 1800s and became Illinois's largest city."

faq:
  - question: "What is Illinois’s nickname?"
    answer: "Illinois is commonly known as the Prairie State. The nickname reflects the vast prairie grasslands that once covered much of the state."

  - question: "Why is Illinois called the Prairie State?"
    answer: "Illinois is called the Prairie State because large areas of natural prairie dominated the landscape before settlement and large-scale farming in the 1800s."

  - question: "Why is Illinois called the Land of Lincoln?"
    answer: "Illinois is called the Land of Lincoln to honor Abraham Lincoln, who spent much of his adult life in the state and built his political career in Springfield."

  - question: "Is Land of Lincoln an official Illinois nickname?"
    answer: "No, Land of Lincoln is not an official state nickname adopted by law. It is a widely recognized and commonly used nickname associated with Abraham Lincoln’s legacy in Illinois."

  - question: "What is Illinois’s nickname and motto?"
    answer: "Illinois is known as the Prairie State and the Land of Lincoln. The state motto is State Sovereignty, National Union."

