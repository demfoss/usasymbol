sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Illinois?
    paragraphs:
      - "The painted turtle is Illinois's official state reptile, designated by the Illinois Legislature in 2005. Its scientific name is Chrysemys picta."
      - "It is the most widespread native turtle in Illinois, found in ponds, lakes, and slow-moving rivers throughout the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Painted Turtle
    paragraphs:
      - "The painted turtle has a smooth, dark olive to black shell with red and yellow markings along its edges and a patterned yellow underside."
      - "Adults typically grow to less than 10 inches long, and they are often seen basking in groups on logs and rocks near water."
      - "It is a strong swimmer and spends much of its time in slow-moving or still freshwater habitat across the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Illinois Legislature designated the painted turtle the official state reptile in 2005, following a campaign led by Illinois students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Illinois Chose the Painted Turtle
    paragraphs:
      - "The painted turtle is the most common and widespread native turtle in Illinois, making it a familiar and easily recognized species for the state to represent."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Painted Turtle
    paragraphs:
      - "The painted turtle is found in ponds, lakes, and slow rivers throughout Illinois, including wetlands along the Illinois River."
