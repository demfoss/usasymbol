faq:
- question: What is Illinois's state soil?
  answer: "Illinois's state soil is the Drummer series, a deep black, poorly drained prairie soil found across millions of acres in the flat central counties. The Illinois Legislature officially designated it the state soil in 2001."
- question: Why is it called Drummer soil?
  answer: "The Drummer series was first studied and described in Ford County, Illinois, and named for Drummer Township in that county. USDA soil scientists name soil series after the towns, townships, creeks, or counties where they are first documented."
- question: What color is Drummer soil?
  answer: "The surface of Drummer soil is jet black — one of the darkest soils in the United States. That color comes from organic matter built up over thousands of years under tallgrass prairie. Below the black surface, the soil turns dark gray and then gray, the result of long periods of waterlogging."
- question: Why is Drummer soil so black?
  answer: "The black color comes from organic matter. For thousands of years, tallgrass prairie grew on poorly drained land where water sat for much of the year. When the grass died, its roots could not fully decompose because the waterlogged soil had almost no oxygen. Organic matter accumulated instead, turning the surface layer jet black. The organic matter content can reach 6 percent — much higher than most soils."
- question: Where is Drummer soil found in Illinois?
  answer: "Drummer soil is found across central and eastern Illinois, primarily in Ford, Champaign, Iroquois, Livingston, McLean, and the surrounding Corn Belt counties. It sits on nearly flat glacial lake beds and uplands across the Grand Prairie — the core of Illinois's agricultural heartland."
- question: What grows in Drummer soil?
  answer: "Corn and soybeans are the primary crops, and Drummer soil is among the most productive corn-growing soils in the world. Illinois farmers on this soil regularly achieve yields above 200 bushels per acre. Before European settlement, the same land supported tallgrass prairie — big bluestem and Indian grass up to 12 feet tall."
- question: Who chose Drummer as the state soil?
  answer: "The Illinois General Assembly designated the Drummer series as the official state soil in 2001. Soil scientists from the University of Illinois and the USDA Natural Resources Conservation Service supported the designation based on the soil's agricultural significance and its role in shaping Illinois's identity as a Corn Belt state."
- question: How deep is Drummer soil?
  answer: "The black surface layer alone can extend 18 inches or more below the ground. The full soil profile goes well past 48 inches before reaching parent material — glacial lake sediment deposited after the last ice age. The unusual depth of the organic-rich surface is one reason Drummer soil is so productive."

