  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Illinois State Flag Facts"
    facts:
      - "Illinois adopted its flag on July 6, 1915"
      - "Lucy Derwent designed the original flag after winning a DAR contest"
      - "The word Illinois was added to the flag on July 1, 1970"
      - "Bruce McDaniel petitioned to add the state name after Vietnam War service"
      - "The motto Sovereignty appears upside down on the seal"
      - "The flag ranked 49th out of 72 in a 2001 NAVA survey"

faq:
  - question: "What is the official state flag of Illinois?"
    answer: "The state flag of Illinois is the official banner of Illinois, featuring the state seal centered on a white field with the word Illinois in blue below."

  - question: "How would you describe the design of the Illinois state flag?"
    answer: "The Illinois flag shows a white background with the state seal in the center. The seal depicts a bald eagle holding a shield and banner. The word Illinois appears in blue below the seal."

  - question: "How do historians explain the symbolism of Illinois' flag?"
    answer: "The flag represents liberty and strength through the bald eagle. The motto State Sovereignty, National Union reflects the balance between state and federal power. The seal shows Illinois as part of the Union."

  - question: "What symbols appear on the Illinois state flag?"
    answer: "The seal shows a bald eagle perched on a rock, holding a shield with thirteen stars and stripes. A banner reads State Sovereignty, National Union. The background shows a sunrise over water. The dates 1818 and 1868 appear on the seal."

  - question: "In what year did Illinois' current flag become official?"
    answer: "Illinois adopted its flag on July 6, 1915. The word Illinois was added on July 1, 1970."

