seo_title: "Illinois State Flag: Meaning, Seal & Eagle Symbol, History"
seo_description: "Review how Illinois's flag was adopted in law, what its main symbols refer to, and how officials describe the flag of Illinois today."

intro_text: "Illinois adopted its state flag on July 6, 1915, featuring the state seal on a white field. The word Illinois was added below the seal in 1970. The seal shows a bald eagle holding a shield in its talons and a banner with [Illinois's state motto](/states/illinois/motto/state-sovereignty-national-union) in its beak."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Illinois State Flag Is Designed"
    paragraphs:
      - "The Illinois state flag is the official flag of Illinois. A white field covers the entire flag. The state seal appears in full color at the center, and this format appears in the broader [list of U.S. state flags](/symbols/flags)."
      - "Below the seal, the word Illinois appears in blue. The seal shows a bald eagle perched on a rock with wings uplifted, holding a shield in its talons and a banner in its beak."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Illinois Flag Communicates"
    paragraphs:
      - "The Illinois state flag represents liberty and strength through the bald eagle. The seal depicts Illinois as part of the Union while maintaining state sovereignty. The design reflects the balance between state and federal power and aligns with themes in [Illinois's nickname history](/states/illinois/nickname/the-prairie-state)."
      - "The eagle holds a banner reading State Sovereignty, National Union. This motto reflects the relationship between Illinois and the federal government. Secretary of State Sharon Tyndale twisted the banner so the word Sovereignty appears upside down, making it less readable than National Union."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Illinois Flag History and Adoption"
    paragraphs:
      - "Illinois became the 21st state on December 3, 1818. The first Great Seal was adopted in 1819 and essentially copied the Great Seal of the United States. This seal was recut in 1839, becoming the Second Great Seal, with broader context in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "Illinois Secretary of State Sharon Tyndale spearheaded the drive to create a third state seal. In 1867, he asked State Senator Allen C. Fuller to introduce legislation requiring a new seal. Tyndale suggested reversing the motto from State Sovereignty, National Union to National Union, State Sovereignty. The legislature kept the original wording. Tyndale designed the new seal anyway, twisting the banner so Sovereignty appears upside down. The seal was officially adopted in 1868."
      - "Ella Park Lawrence began a campaign to adopt a state flag in 1912 during her time as state regent of the Daughters of the American Revolution. On April 1, 1914, she announced a contest to design an Illinois state flag. Thirty-five designs were submitted. Lucy Derwent's design won. The flag became official on July 6, 1915."
      - "In the 1960s, Chief Petty Officer Bruce McDaniel petitioned to have the state name added to the flag. He noted that many people he served with during the Vietnam War did not recognize the banner. Governor Richard B. Ogilvie signed the addition into law on September 17, 1969. The new flag, designed by Sanford Hutchinson, became official on July 1, 1970."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Illinois Flag"
    symbols:
      - id: bald-eagle
        name: "Illinois State Flag Eagle"
        image: "symbols/eagle.svg"
        paragraphs:
          - "A bald eagle perches on a rock with wings uplifted. The eagle holds a shield in its talons and a banner in its beak. The eagle represents liberty through strength and peace."
          - "The shield shows thirteen stars and thirteen stripes representing the original thirteen states. The bald eagle appears on several U.S. state flags and seals."

      - id: banner-and-motto
        name: "Illinois State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The eagle holds a banner reading State Sovereignty, National Union in its beak. This motto reflects the balance between state and federal power."
          - "Sharon Tyndale twisted the banner when designing the 1868 seal. The word Sovereignty appears upside down, making it less readable. Tyndale wanted to emphasize National Union over State Sovereignty."

      - id: dates
        name: "Illinois State Flag Dates"
        image: "symbols/dates.svg"
        paragraphs:
          - "Two dates appear on the seal. The date 1818 marks the year Illinois became a state. The date 1868 marks the year the current seal was adopted."
          - "The date August 26, 1818, when Illinois's first constitution was adopted in Kaskaskia, appears along the bottom arc of the circle on the seal."

      - id: sun-and-water
        name: "Illinois State Flag Sun and Water"
        image: "symbols/sun-water.svg"
        paragraphs:
          - "A sunrise appears over water in the background. The water represents the Illinois River. The sun represents natural beauty and a bright future."
          - "The prairie grass and landscape elements show Illinois's agricultural heritage and natural resources, including ecosystems associated with [Illinois's state flower, the Violet](/states/illinois/flower/violet)."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Illinois State Flag Colors"
    paragraphs:
      - "The Illinois state flag uses white as the primary field color. The state seal adds red, white, and blue matching the U.S. national flag, plus supporting colors. Illinois Executive Order 1970-2 outlines official color values with Cable and Pantone specifications."
