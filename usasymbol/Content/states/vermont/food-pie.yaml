sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Vermont's State Pie?"
    paragraphs:
      - "Apple pie is Vermont's official state pie, designated by the Vermont General Assembly in 1999. It is a fruit pie made from sliced apples baked in a pastry crust, tied to Vermont's apple orchards."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Apple Pie"
    paragraphs:
      - "Apple pie is made from sliced apples mixed with sugar and spices such as cinnamon, baked inside a pastry crust until the fruit softens and the crust turns golden. Vermont grows apple varieties well suited to its cool climate, including varieties commonly used in pies."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Apple Pie Became Vermont's State Pie"
    paragraphs:
      - "The Vermont General Assembly designated apple pie the official state pie in 1999. State law goes further than most, suggesting that apple pie in Vermont be served with a glass of cold milk, a slice of cheddar cheese weighing at least half an ounce, or a scoop of vanilla ice cream."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Vermont Chose Apple Pie"
    paragraphs:
      - "Vermont has long grown apples in its cool hillside orchards, and pairing apple pie with cheddar cheese or dairy is a tradition rooted in the state's dairy farming industry. The specific serving language in state law reflects both the apple crop and Vermont's identity as a dairy state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Apple Pie Facts"
    facts:
      - "Adopted as Vermont's state pie in 1999."
      - "State law suggests serving it with cold milk, cheddar cheese, or vanilla ice cream."
      - "The cheddar cheese pairing reflects Vermont's long dairy farming tradition."

