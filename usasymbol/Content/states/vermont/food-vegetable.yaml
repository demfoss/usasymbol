sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Vermont's State Vegetable?"
    paragraphs:
      - "The Gilfeather turnip is Vermont's official state vegetable, designated by the Vermont General Assembly in 2015. It is a pale, sweet-tasting turnip variety developed by a Vermont farmer in the late 1800s."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Gilfeather Turnip"
    paragraphs:
      - "The Gilfeather turnip has smooth, white to tan skin and a milder, sweeter flavor than many other turnip varieties, closer to a rutabaga. It grows in cool weather and is typically harvested in the fall after a light frost, which is said to improve its sweetness."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Gilfeather Turnip Became Vermont's State Vegetable"
    paragraphs:
      - "The Vermont General Assembly designated the Gilfeather turnip the official state vegetable in 2015, recognizing a variety developed by farmer John Gilfeather in Wardsboro, Vermont, in the late 19th century."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Vermont Chose the Gilfeather Turnip"
    paragraphs:
      - "Vermont chose the Gilfeather turnip because it is a variety unique to the state, developed and kept secret for years by a single Wardsboro farmer before eventually spreading to gardens and farms across Vermont."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Gilfeather Turnip Comes From in Vermont"
    paragraphs:
      - "The Gilfeather turnip originated in the town of Wardsboro in southern Vermont, where farmer John Gilfeather first developed the variety in the late 1800s. Wardsboro still holds an annual festival celebrating the turnip."
