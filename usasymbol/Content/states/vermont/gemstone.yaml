intro_text: "Vermont's state gem is grossular garnet, adopted in 1991, found in some of the finest documented specimens at Belvidere Mountain near Eden Mills and Lowell in the state's north-central mineral district. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Vermont State Gem
    paragraphs:
      - "Grossular garnet is Vermont's official state gem, designated by the state legislature in 1991. It occurs at Belvidere Mountain alongside more than forty other rock-forming minerals, in a locality mineral collectors consider one of the best of its kind anywhere."
      - "Vermont chose a gem defined by a single, well-documented site rather than one traded commercially, giving the designation a direct tie to the state's own geology."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Grossular Garnet?"
    paragraphs:
      - "Grossular garnet is a calcium-aluminum garnet, chemically distinct from the more common iron- and magnesium-rich garnets used widely in jewelry. At Belvidere Mountain it typically forms as well-shaped orange-brown to reddish-brown crystals, a color variety often called hessonite."
      - "The crystals grow embedded in altered ultramafic rock, the same serpentine-rich rock that also hosted Vermont's historic asbestos mining at the same site. Collectors prize the Belvidere material for its crystal form and color, not just its rarity."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Vermont Chose Grossular Garnet as Its State Gem"
    paragraphs:
      - "Mineral collectors recognize Belvidere Mountain, near Eden Mills and Lowell, for producing some of the finest documented grossular garnet specimens anywhere in the world. That reputation gave Vermont a gemstone tied to a single, well-known locality rather than one mined broadly across the state."
      - "The designation also complemented Vermont's other mineral symbols, giving the state's collecting and mineralogical community a gem specific to Vermont ground alongside the state's mineral, talc, and its trio of state rocks."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Grossular Garnet Became Vermont's State Gem"
    paragraphs:
      - "The Vermont Legislature designated grossular garnet the official state gem in 1991, the same bill that named talc the state mineral."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Grossular Garnet Is Found in Vermont"
    paragraphs:
      - "Belvidere Mountain, on the border of Eden and Lowell in north-central Vermont, is the source of the state's finest grossular garnet. The site is better known historically for asbestos mining, but its rock also produced garnet crystals collectors rank among the best documented anywhere."
    sites:
