faq:
  - question: What is Vermont's state gem?
    answer: "Vermont's state gem is grossular garnet, a calcium-aluminum garnet adopted by the state legislature in 1991."
  - question: When did Vermont adopt grossular garnet as its state gem?
    answer: "The Vermont Legislature designated grossular garnet the official state gem in 1991."
  - question: Why did Vermont choose grossular garnet?
    answer: "Belvidere Mountain near Eden Mills and Lowell produces grossular garnet specimens that mineral collectors consider among the finest of their kind found anywhere, giving Vermont a gem tied to a specific, well-documented site."
  - question: What color is Vermont's grossular garnet?
    answer: "Belvidere Mountain garnet typically appears orange-brown to reddish-brown, a variety often called hessonite, though grossular garnet can also occur in green and yellow."

