seo_title: "Vermont State Mineral | Talc"
seo_description: "Vermont's state mineral is talc, adopted in 1991. The softest mineral on the Mohs scale, it made Vermont the country's second-largest talc producer."
hero_image: /images/minerals/vermont/vermont-state-mineral-hero.webp
hero_image_alt: "A pale green, soft talc specimen with a soapy sheen."
hero_image_caption: "Talc, Vermont's official state mineral, is the softest mineral on the Mohs hardness scale."
intro_text: "Vermont's state mineral is talc, adopted in 1991, the softest mineral on the Mohs scale and long mined from metamorphic rock in the state's southern Green Mountains. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Vermont State Mineral
    paragraphs:
      - "Talc is Vermont's official state mineral, designated by the state legislature in 1991. It is the softest mineral known, ranking 1 on the Mohs hardness scale, and Vermont has mined it commercially for well over a century."
      - "Vermont was a natural choice for this symbol because, around 1990, the state ranked second only to California among American talc producers."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Talc?"
    paragraphs:
      - "Talc is a soft, white to pale green mineral known for its greasy or soapy feel, a texture that comes from its structure of loosely bonded sheets that slide easily against each other. That same softness is why it sits at the very bottom of the Mohs hardness scale."
      - "Vermont's talc formed when ancient ocean-floor rock, rich in magnesium, was caught up in the collision of continents that built the Green Mountains and altered by heat and pressure into the soft, sheet-structured mineral found today."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Vermont Chose Talc as Its State Mineral"
    paragraphs:
      - "Talc mining has operated in southern Vermont, particularly Windham County, for well over a century, supplying an industrial mineral used in products from paper to ceramics to cosmetics. By 1990, Vermont trailed only California in total U.S. talc production."
      - "That output placed talc alongside granite, marble, and slate as one of the pillars of Vermont's more than two-hundred-year-old minerals industry, and the 1991 designation recognized its economic weight even though talc draws far less public attention than Vermont's building stones."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Talc Became Vermont's State Mineral"
    paragraphs:
      - "The Vermont Legislature designated talc the official state mineral in 1991, the same bill that named grossular garnet the state gem. The following year, in 1992, lawmakers separately named granite, marble, and slate the state's three official state rocks."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Talc Is Found in Vermont"
    paragraphs:
      - "Windham County in southern Vermont became the center of the state's talc mining, with mines operating in and around the town of Windham. Companies have worked multiple talc deposits in the area since the 19th century."
    sites:
      - name: Windham
        city: Windham
