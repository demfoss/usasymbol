type: State Flower
state: Vermont
name: Red Clover
scientific_name: Trifolium pratense
adopted_year: 1894
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-20"
seo_title: "Vermont State Flower | Red Clover"
seo_description: "Vermont adopted red clover in 1894. The flower fits the state's meadow landscape and long dairy tradition."

intro_text: "Vermont designated the Red Clover as its official state flower in 1894. Pink-purple flower heads bloom on plants 6 to 24 inches tall. This nitrogen-fixing legume grows in meadows and pastures throughout Vermont from late spring through early fall and remains part of the broader [U.S. state flowers guide](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Vermont"
    paragraphs:
      - "Vermont's floral emblem, the Red Clover, dates back to 1894. Each flower head contains 40 to 100 tiny florets. The blooms appear pink to purple rather than true red. Rounded flower heads measure half an inch to one inch across. Three-part leaves with pale chevron markings identify the plant. Stems grow from spreading roots that form dense mats."
      - "Red Clover blooms from May through September across Vermont. Peak flowering occurs in June and July throughout most regions. The Champlain Valley, Green Mountains, and Connecticut River Valley showcase abundant displays. Individual flower heads last one to two weeks. Plants prefer moist well-drained soil. Full sun to partial shade suits red clover best."
      - "Native to Europe and Asia, red clover naturalized throughout Vermont centuries ago. Farmers planted the legume extensively for hay and pasture improvement. The plant fixes nitrogen through bacteria in root nodules. This enriches soil for other crops. Honeybees and bumblebees pollinate the flowers heavily. Vermont's dairy industry relies on red clover as nutritious cattle feed."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Red Clover"
    paragraphs:
      - "The common name is Red Clover. The scientific name is Trifolium pratense. The plant belongs to the Fabaceae family. This enormous family includes peas, beans, and about 19,000 species of flowering plants worldwide."
      - "Trifolium comes from Latin words meaning three leaves. Each leaf divides into three heart-shaped leaflets. The species name pratense means of meadows in Latin. Red clover thrives in open grasslands and pastures. The common name describes the pinkish-red color of flower heads, though blooms range from pale pink to deep magenta."
      - "Other common names include purple clover, cow clover, and meadow clover. Farmers sometimes call it beebread because pollinators visit the flowers constantly. The plant appears similar to white clover but grows taller with larger flower heads. Vermont's agricultural heritage connects deeply to this widespread legume."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of Vermont's State Flower Selection"
    paragraphs:
      - "The legislature proclaimed the Red Clover as Vermont's official state flower in 1894. Vermont became one of the earliest states to designate a floral emblem. The choice reflected the plant's importance to Vermont agriculture. Red clover covered thousands of acres in hay fields and pastures across the state."
      - "Dairy farming dominated Vermont's economy during the 1890s. Farmers valued red clover for enriching soil and feeding cattle. The plant grew reliably in Vermont's cool climate. Its nitrogen-fixing ability improved yields of corn and other crops planted in rotation. Agricultural prosperity depended heavily on this humble legume and on livestock traditions later represented by [Vermont's Morgan horse](/states/vermont/mammal/morgan-horse)."
      - "No formal vote or campaign preceded the designation. The legislature recognized red clover's economic and cultural significance. The flower represented Vermont's agricultural character and rural landscape. Artists featured red clover in paintings of Vermont pastures and meadows. The simple pink blooms symbolized the state's farming heritage and complemented the seasonal identity of [Vermont's sugar maple](/states/vermont/tree/sugar-maple)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Red Clover Facts and Information"
    facts:
      - "Vermont adopted the Red Clover on February 1, 1894, making it one of the earliest official state flower designations in the United States"
      - "Red clover fixes 100 to 150 pounds of nitrogen per acre annually through bacteria in its root nodules, enriching soil for subsequent crops"
      - "The flower heads contain 40 to 100 individual florets that open progressively from bottom to top over one to two weeks"
      - "Bumblebees with long tongues pollinate red clover most effectively, while honeybees often bite holes at flower bases to steal nectar"
      - "Vermont dairy farmers plant red clover extensively as high-protein cattle feed, continuing a tradition that dates back over 200 years"
      - "The pale chevron or V-shaped marking on each leaflet distinguishes red clover from similar legumes growing in Vermont meadows"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Vermont's Flower and Bird Symbols"
    paragraphs:
      - "The [Hermit Thrush](/states/vermont/bird/hermit-thrush) serves as Vermont's state bird, a woodland songbird known for its beautiful flute-like call. Both symbols represent Vermont officially. Vermont adopted the Red Clover in 1894 and designated the Hermit Thrush as state bird in 1941."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Red Clover commonly represents Vermont's agricultural heritage, rural character, and connection to dairy farming. The flower frequently represents hard work and prosperity through its role in enriching soil and feeding livestock. Its modest appearance is considered to reflect Vermont's unpretentious nature and practical values rooted in farming traditions, values echoed in [Vermont's official motto](/states/vermont/motto/freedom-and-unity)."

faq:
  - question: "What is Vermont's state flower?"
    answer: "Vermont's state flower is the Red Clover. This pink-purple legume blooms in meadows and pastures across Vermont from May through September and plays a vital role in the state's dairy farming industry."
  
  - question: "When did Vermont adopt the Red Clover as its state flower?"
    answer: "Vermont adopted the Red Clover on February 1, 1894. This made Vermont one of the earliest states to designate an official floral emblem, reflecting the plant's agricultural importance."
  
  - question: "Why did Vermont choose the Red Clover?"
    answer: "Vermont chose the Red Clover because it was essential to the state's dairy farming economy. The plant enriched soil through nitrogen fixation and provided nutritious cattle feed. Its widespread presence across Vermont pastures made it a natural symbol of the state's agricultural character."
  
  - question: "Is red clover native to Vermont?"
    answer: "No, red clover is not native to Vermont. The plant originated in Europe and Asia but naturalized throughout Vermont centuries ago. Farmers introduced it for hay production and pasture improvement, and it became integral to Vermont agriculture."
  
  - question: "How does red clover help Vermont's soil?"
    answer: "Red clover improves soil by fixing nitrogen through bacteria in its root nodules. The plant adds 100 to 150 pounds of nitrogen per acre annually. This enriches soil for corn and other crops planted in rotation with clover."

