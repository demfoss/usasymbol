name_meaning:
  heading: What Does Vermont Mean?
  paragraphs:
  - Vermont became the 14th state in 1791 after existing as an independent republic. The name is commonly traced to French words meaning green mountain.
  - "That meaning is not just a language note. It is the whole symbol system in miniature: Green Mountain State nickname, sugar maple forests, red clover pastures, dairy farms, and a flag with a mountain-and-farm coat of arms."
  - Vermont's postal abbreviation is VT, and residents are Vermonters. The state motto Freedom and Unity is older than Vermont's admission to the Union.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Commonly traced to French words meaning green mountain.
    - label: Statehood
      text: Vermont entered the Union in 1791 as the 14th state.
    - label: Republic period
      text: Vermont's motto dates to 1779, when Vermont was still an independent republic.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Vermont, a New England state defined by the Green Mountains, working farms, and northern hardwood forests.
    - label: People
      text: People from Vermont are called Vermonters.
    - label: Agriculture
      text: Milk, sugar maple, red clover, Morgan horse, and Randall Lineback cattle all keep the hub close to working land.
  - heading: Nicknames and Short Forms
    items:
    - label: The Green Mountain State
      text: The nickname repeats the literal meaning usually attached to Vermont's name.
    - label: Abbreviation
      text: VT; older short form Vt.
editorial:
  heading: What Vermont's Symbols Say About the State
  paragraphs:
  - The [Green Mountain State nickname](/states/vermont/nickname), [sugar maple](/states/vermont/tree), and [red clover](/states/vermont/flower) make Vermont's symbol list feel rooted in hillsides, pasture, and fall color rather than in broad national imagery.
  - The [Hermit Thrush](/states/vermont/bird) is a good Vermont choice because the state accepted a seasonal bird. The argument was not that it stayed through winter, but that its song belonged to Vermont's forest season.
  - Vermont's animal and beverage symbols are unusually farm-specific. [Milk](/states/vermont/beverage/milk), the [Morgan horse](/states/vermont/mammal/morgan-horse), and [Randall Lineback cattle](/states/vermont/mammal/randall-lineback) turn the hub into a record of dairy, draft power, local breeding, and conservation.
faq:
- question: What is Vermont's most famous state symbol?
  answer: The [Green Mountain State nickname](/states/vermont/nickname) is the clearest shorthand because it matches the meaning usually attached to Vermont's name and the mountain landscape behind many of its symbols.
- question: What is Vermont's state bird?
  answer: Vermont's state bird is the [Hermit Thrush](/states/vermont/bird), adopted in 1941 even though it leaves the state for winter.
- question: What is Vermont's state flower?
  answer: Vermont's state flower is [red clover](/states/vermont/flower), adopted in 1894.
- question: Why is milk Vermont's state beverage instead of maple syrup?
  answer: "[Milk](/states/vermont/beverage/milk) is the official state beverage. Maple syrup is a separate Vermont symbol as a flavor, while milk names the dairy economy that shaped the state's farms."
- question: How many official state symbols does Vermont have?
  answer: Vermont's state symbols list here includes the flag, Hermit Thrush, red clover, sugar maple, Freedom and Unity motto, Green Mountain State nickname, colors, milk, Morgan horse, and Randall Lineback cattle.
