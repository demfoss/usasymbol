intro_text: "Vermont's state fruit is the apple, adopted in 1999 to recognize a crop grown in orchards across the state's hillsides for generations. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Vermont's State Fruit?"
    paragraphs:
      - "The apple is Vermont's official state fruit, designated by the Vermont General Assembly in 1999. Apple orchards are found across the state, often on hillsides with well-drained soil."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Apple"
    paragraphs:
      - "Apples are round tree fruits that grow in many colors and flavors, from tart to sweet. Vermont's cool climate and hillside orchards favor varieties like McIntosh, and many farms open in fall for pick-your-own picking."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Apple Became Vermont's State Fruit"
    paragraphs:
      - "The Vermont General Assembly designated the apple the official state fruit in 1999."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Vermont Chose the Apple"
    paragraphs:
      - "Apple orchards have been part of Vermont's farm landscape since colonial times, and fall apple picking remains a defining tradition across the state's hillside farms."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Apple Facts"
    facts:
      - "Adopted as Vermont's state fruit in 1999."
      - "Vermont apple orchards commonly grow the McIntosh variety."
      - "Many Vermont farms open for pick-your-own apple picking each fall."

