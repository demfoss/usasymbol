seo_title: "Vermont State Flag | Pine Tree, Cow & Ship"
seo_description: "Vermont's flag uses a pastoral coat of arms with pine tree, cow, wheat, and ship."

intro_text: "Vermont adopted its state flag in 1923, displaying the state coat of arms on a blue background. The coat of arms shows a pine tree, a cow, wheat sheaves, and mountains. The motto Freedom and Unity appears below the shield, and the design belongs to the broader [U.S. state flags collection](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Vermont State Flag Is Designed"
    paragraphs:
      - "The Vermont state flag is the official state flag of the state of Vermont. A blue rectangular field forms the background. The coat of arms depicts pine trees, a cow, wheat sheaves, and the Green Mountains. Two pine branch supporters flank the shield on each side."
      - "The Vermont General Assembly adopted this design on June 1, 1923. The flag replaced an earlier striped design that caused confusion with the United States flag. Vermont flies this flag at government buildings and public spaces across the state."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Vermont Flag Communicates"
    paragraphs:
      - "The Vermont state flag meaning comes from symbols depicting Vermont's forests, farmland, and cultural identity. Each element on the coat of arms reflects aspects of Vermont's identity and economy."
      - "The coat of arms balances freedom of individual citizens with the welfare of the common good. This dual purpose appears in [the state motto Freedom and Unity](/states/vermont/motto/freedom-and-unity) displayed below the shield."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Vermont Flag History and Adoption"
    paragraphs:
      - "Vermont introduced its first official state flag on May 1, 1804. The design mimicked the United States flag with 17 stars and 17 stripes. Vermont expected the U.S. flag would adopt this pattern when the number of states reached seventeen. The word VERMONT was embroidered along the top red stripe."
      - "The U.S. flag never added the extra stripes. This created confusion between Vermont's flag and the national banner. Vermont changed its flag design on October 20, 1837. The new version used 13 stripes like the U.S. flag. A single large star surrounded the coat of arms in the blue canton. The star varied between five points and eight points in different versions."
      - "Vermont militia used flags during the Civil War, Spanish-American War, and World War I that showed the coat of arms on a blue field. This design matched the governor's flag. Because of ongoing confusion with striped flags, Vermont adopted the governor's flag design as the official state flag on June 1, 1923. The flag has remained unchanged since then, while Vermont's mountain-driven identity continues under [the Green Mountain State nickname](/states/vermont/nickname/the-green-mountain-state)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Vermont Flag"
    versions:
      - name: "Green Mountain Boys Flag"
        years: "Pre-1804"
        image: "versions/green-mountain-boys.webp"
        description: "Unofficial flag used by Vermont militia led by Ethan Allen before statehood."

      - name: "First Official Flag"
        years: "1804–1837"
        image: "versions/first-1804.webp"
        description: "Red and white striped flag with 17 stars and 17 stripes, with VERMONT inscribed on the top stripe."

      - name: "Second Official Flag"
        years: "1837–1923"
        image: "versions/second-1837.webp"
        description: "Thirteen stripes with coat of arms inside a star in the canton, varying between 5-pointed and 8-pointed stars."

      - name: "Current State Flag"
        years: "1923–present"
        image: "versions/current-1923.webp"
        description: "Blue field with state coat of arms in the center, adopted to avoid confusion with the U.S. flag."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Vermont Flag"
    symbols:
      - id: coat-of-arms
        name: "Vermont State Flag Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The coat of arms dominates the center of the flag. Ira Allen designed this emblem in 1778. The shield contains symbols representing Vermont's landscape and economy."
          - "Two pine branch supporters frame the shield on both sides. These branches symbolize the small pine boughs worn at the Battle of Plattsburgh near the end of the War of 1812."

      - id: pine-tree
        name: "Vermont State Flag Pine Tree"
        image: "symbols/pine-tree.svg"
        paragraphs:
          - "A pine tree stands in the middle of the shield. The tree represents Vermont's extensive forests. Pine trees grow throughout the state and support the timber industry."
          - "The pine tree appears as one of the central elements on the coat of arms. It reflects Vermont's natural landscape and forestry heritage."

      - id: cow
        name: "Vermont State Flag Cow"
        image: "symbols/cow.svg"
        paragraphs:
          - "A red cow stands in the foreground of the shield. The cow represents Vermont's dairy industry. Dairy farming has been a major part of Vermont's economy for generations."
          - "The cow appears on a green field alongside wheat sheaves. Together these elements show Vermont's agricultural character."

      - id: wheat-sheaves
        name: "Vermont State Flag Wheat Sheaves"
        image: "symbols/wheat-sheaves.svg"
        paragraphs:
          - "Three wheat sheaves stand on the shield. These bundles of grain represent Vermont's agriculture. Wheat and other crops have long been part of Vermont farming."
          - "The sheaves appear next to the cow on a green field. The combination emphasizes Vermont's agricultural heritage."

      - id: deer-head
        name: "Vermont State Flag Deer Head"
        image: "symbols/deer-head.svg"
        paragraphs:
          - "A deer head sits on top of the shield. The deer represents Vermont's wildlife. Deer roam throughout Vermont's forests and mountains."
          - "The deer head serves as the crest above the coat of arms. It highlights the state's natural environment and hunting traditions."

      - id: mountains
        name: "Vermont State Flag Mountains"
        image: "symbols/mountains.svg"
        paragraphs:
          - "Green mountains appear in the background of the shield. These represent the Green Mountains that run through Vermont. The state takes its name from the French words vert mont, meaning green mountain."
          - "The mountains provide the backdrop for the other symbols on the coat of arms. They anchor the design in Vermont's physical geography."

      - id: motto
        name: "Vermont State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The words Freedom and Unity appear on a banner below the shield. This motto balances two ideals. Freedom represents individual liberty. Unity represents the common good."
          - "The motto reflects Vermont's political philosophy. It appears on both the state flag and the state seal, and remains central to Vermont's civic identity."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Vermont State Flag Colors"
    paragraphs:
      - "The Vermont state flag uses multiple colors in the coat of arms on a blue background. The shield contains green, red, gold, and white elements, including green mountain symbolism linked to [Vermont's sugar maple heritage](/states/vermont/tree/sugar-maple)."
    colors:
      - name: "Blue"
        hex: "#003F87"
      - name: "Green"
        hex: "#228B22"
      - name: "Red"
        hex: "#C8102E"
      - name: "Gold"
        hex: "#FFD700"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Vermont State Flag Facts"
    facts:
      - "Vermont switched from striped designs to the current blue governor-style flag on June 1, 1923"
      - "The coat of arms was designed by Ira Allen in 1778"
      - "Vermont's first official flag had 17 stars and 17 stripes"
      - "The flag changed in 1837 to avoid confusion with the U.S. flag"
      - "The motto Freedom and Unity appears on the flag"
      - "The pine tree represents Vermont's forests and timber industry"

faq:
  - question: "What design is recognized as the state flag of Vermont?"
    answer: "The Vermont state flag is the official banner of Vermont, featuring the state coat of arms on a blue field."

  - question: "What does Vermont's flag look like?"
    answer: "The flag shows a blue background with the Vermont coat of arms in the center. The coat of arms includes a pine tree, cow, wheat sheaves, deer head, and mountains, with the motto Freedom and Unity below."

  - question: "How are the colors of the Vermont state flag described?"
    answer: "The Vermont coat of arms appears on the flag, showing a pine tree, red cow, three wheat sheaves, mountains, a deer head, and pine branch supporters, with the state motto below."

  - question: "When was the present Vermont flag approved in law?"
    answer: "Vermont adopted its current state flag on June 1, 1923."

  - question: "When did Vermont adopt its current state flag?"
    answer: "Ira Allen designed the coat of arms in 1778 that appears on the flag. The current flag design was based on the Vermont governor's flag when it was adopted in 1923."

  - question: "How would you describe the design of the Vermont state flag?"
    answer: "Earlier Vermont flags had red and white stripes similar to the U.S. flag. The current flag uses a simple blue field to avoid confusion with the national flag."

