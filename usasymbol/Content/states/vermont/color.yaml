timeline:
  - year: "1609"
    description: "Samuel de Champlain documents the Green Mountains in French as Verts Monts, encoding the color green permanently into what will become Vermont's name and foundational identity"
  - year: "1777"
    description: "Vermont declares independence as a republic on January 15, adopting a constitution that prohibits slavery — the first such document in North America; the Green Mountain Boys who fought for Vermont's independence take their name directly from the forested mountains that give the state its green identity"
  - year: "1791"
    description: "Vermont admitted to the Union on March 4 as the 14th state; the University of Vermont is chartered in Burlington in the same year, establishing the institution that will adopt green and gold as official colors and anchor the pairing in Vermont's civic life"
  - year: "1895"
    description: "Vermont designates the sugar maple as its official state tree, formally acknowledging the tree whose golden autumn foliage and amber syrup make gold the state's most important agricultural color"
  - year: "1930"
    description: "Long Trail completed along the length of the Green Mountains — at 272 miles, the oldest long-distance hiking trail in the United States — cementing Vermont's green mountain landscape as the state's defining geographic and experiential identity"

expert_quote:
  text: "Vermont is one of the few states in the Union whose color tradition requires no explanation — the Green Mountains are literally in the name, and the gold of maple leaves and maple syrup has been Vermont's agricultural signature for three centuries."
  source: "Vermont Historical Society, Montpelier, Natural and Cultural Heritage Documentation"

faq:
  - question: "What are the state colors of Vermont?"
    answer: "Vermont's traditional state colors are Green and Gold, reflecting the forested Green Mountains that give Vermont its name and the golden autumn foliage and maple syrup that define Vermont's agricultural and tourism identity. Vermont has not formally designated official state colors by legislative statute."
  - question: "What is the HEX code for Vermont Green?"
    answer: "The standard HEX code for Vermont Green is #154734, corresponding to Pantone PMS 3435, consistent with the deep forest green of the Green Mountains and the University of Vermont's official brand color."
  - question: "What is the HEX code for Vermont Gold?"
    answer: "The standard HEX code for Vermont Gold is #FFB81C, corresponding to Pantone PMS 123, consistent with the amber-gold of Vermont maple syrup and the brilliant autumn foliage of the sugar maple, Vermont's official state tree."
  - question: "Why is Vermont associated with green?"
    answer: "Vermont takes its name directly from the French Verts Monts, meaning Green Mountains — making green more literally embedded in Vermont's identity than in any other state. The Green Mountains cover approximately 78 percent of Vermont's land area with dense forest, making the state one of the most forested in the nation."
  - question: "Are green and gold Vermont's official state colors?"
    answer: "Green and gold are traditional rather than officially designated state colors in Vermont. The Vermont Legislature has not formally codified state colors by statute, but green and gold are treated as Vermont's color tradition through the Green Mountains, maple syrup, autumn foliage, and University of Vermont athletics."

