seo_title: "Vermont State Colors | Green Gold"
seo_description: "Vermont state colors are Green and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Vermont are **Green** and **Gold**, derived from Vermont's forested mountains and maple heritage tied to [the Green Mountain State](/states/vermont/nickname/the-green-mountain-state). Although Vermont has not formally designated official state colors by legislative statute, green and gold are the widely recognized palette of the state through tourism branding, the University of Vermont, and state cultural communications. The specifications below list HEX, RGB, CMYK, and Pantone values for Vermont color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Green and Gold"
official_since: "Unofficial (no formal legislative designation; derived from natural landscape and agricultural tradition)"
primary_use: "University of Vermont athletics, Vermont state tourism branding, Vermont Agency of Agriculture communications, state cultural use"
known_for: "Green representing the forested mountains encoded in Vermont's very name (Verts Monts), and gold representing the autumn maple foliage and agricultural richness that have made Vermont one of America's most distinctive and beloved rural states"

color_data:
  - name: "Green"
    hex: "#154734"
    rgb: "21, 71, 52"
    cmyk: "70, 0, 27, 72"
    pantone: "PMS 3435"
    symbolism: "Represents the dense, year-round forest cover of the Green Mountains that runs the length of Vermont from north to south — the same mountains that gave Vermont its name, sheltered Ethan Allen's Green Mountain Boys during the Revolutionary War, and continue to define Vermont's landscape, climate, and identity as one of the most forested states in the nation; the deep forest green of Vermont's mountains is among the most visually defining colors of any New England state"
  - name: "Gold"
    hex: "#FFB81C"
    rgb: "255, 184, 28"
    cmyk: "0, 28, 89, 0"
    pantone: "PMS 123"
    symbolism: "Represents the brilliant gold of Vermont's autumn maple foliage — the most celebrated fall color display in North America — as well as the amber of Vermont maple syrup, the state's most iconic agricultural product and the source of more than 40 percent of all maple syrup produced in the United States; gold also evokes the grain fields and hay meadows of Vermont's working agricultural landscape, which has sustained the dairy and farming economy that defines Vermont's rural character since the eighteenth century"

sections:
  - id: "official-designation"
    title: "Status and History of Vermont's Traditional Colors"
    style: "default"
    paragraphs:
      - "Vermont has not designated official state colors by legislative statute, making green and gold a traditional color tradition rooted in the state's natural landscape and cultural associations rather than formal law. Vermont's legislative approach to state symbols has been selective — the state has official designations for its flower (red clover), tree (sugar maple), bird (hermit thrush), and insect (honeybee), among others — but has not codified official colors in the manner of states like Texas or West Virginia."
      - "The identification of Vermont with green and gold develops organically from two sources that are inseparable from Vermont's identity: the Green Mountains that define the state's name and topography, and the autumn foliage that makes Vermont one of the most visited states in the country during October. The University of Vermont, the state's flagship public research university founded in Burlington in 1791, reinforces this color pairing by using green and gold as its official athletic colors — a choice that mirrors the state's natural palette and ensures the green-and-gold combination maintains consistent institutional visibility across Vermont's civic life, alongside official emblems like [the Vermont state flag](/states/vermont/flag/vermont-state-flag)."
    subsections:
      - subtitle: "Verts Monts: A State Whose Name Is Its Color"
        text: "Vermont is one of only a handful of U.S. states whose name contains a direct color reference. The name derives from the French *Verts Monts* — Green Mountains — as recorded by Samuel de Champlain and subsequent French explorers who documented the forested spine running the length of what would become the fourteenth state. When Vermont declared independence as a republic on January 15, 1777 — becoming the first new political entity in North America to prohibit slavery in its founding constitution — and was admitted to the Union as the 14th state on March 4, 1791, the green of its mountains was already encoded in the state's name. No other color is as definitionally connected to Vermont's identity as green, a theme repeated in [Vermont's motto history](/states/vermont/motto/freedom-and-unity)."
      - subtitle: "University of Vermont and the Green and Gold Tradition"
        text: "The University of Vermont, chartered in 1791 and one of the oldest universities in the United States, adopted green and gold as its official colors, creating an institutional anchor for the pairing that extends the color tradition beyond the purely natural into Vermont's academic and athletic life. UVM's Catamounts compete across NCAA Division I sports in green and gold uniforms that mirror the Vermont landscape, ensuring that the state's traditional color pairing has consistent, high-visibility representation in competitive contexts. The university's adoption of the same palette that nature imposed on Vermont's landscape reflects the deep connection between Vermont's environment and its institutional character."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Vermont's green and gold represent a color tradition more directly derived from nature than perhaps any other state in the Union. Green is not a symbolic choice for Vermont — it is a geographic fact. The Green Mountains, which cover more than 75 percent of Vermont's land area with forest, make Vermont one of the most densely wooded states in the nation, a reality visible from satellite imagery, from the summits of the Long Trail, and from every rural road in the state's fourteen counties. Gold is the color of Vermont in its second season of greatest fame: the autumn foliage that draws hundreds of thousands of visitors to Vermont each October in one of the largest seasonal tourism events in New England."
    subsections:
      - subtitle: "Green: The Mountain Forest Identity"
        text: "Vermont's forest cover — approximately 78 percent of the state's 9,616 square miles — is the defining environmental fact of the Green Mountain State. The Green Mountains, a southern extension of the Appalachian range running 160 miles from the Massachusetts border to the Canadian border, are covered in northern hardwood and boreal forest that presents a nearly unbroken canopy of green from late spring through early autumn. The Long Trail, completed in 1930 as the oldest long-distance hiking trail in the United States, traverses the full length of the Green Mountains along a 272-mile route through this forest. Vermont's forest cover underpins the state's $1.5 billion outdoor recreation economy, regulates the watersheds of the Connecticut and Winooski Rivers, and sequesters carbon at a rate that makes Vermont one of the lowest per-capita carbon-emitting states in the nation."
      - subtitle: "Gold: Maple Syrup, Foliage, and Agricultural Heritage"
        text: "Vermont produces more maple syrup than any other U.S. state, accounting for more than 40 percent of national production from approximately 6 million taps across the state's sugar maple forests. The sugar maple (Acer saccharum) — [Vermont's official state tree](/states/vermont/tree/sugar-maple) — produces both the amber-gold syrup that has defined Vermont's agricultural identity for centuries and the brilliant gold foliage that makes Vermont's autumn the most photographed seasonal display in North America. Vermont's fall foliage season, which peaks between late September and mid-October, attracts an estimated 3.5 million visitors annually and generates over $460 million in economic activity — making the gold of autumn Vermont's most economically significant color. The gold of hay fields, the amber of farmstead cheese, and the warm yellows of goldenrod along Vermont roadsides extend this palette through the agricultural landscape that defines Vermont's rural character."

  - id: "state-emblems"
    title: "Usage in Tourism, Agriculture, and Institutional Branding"
    style: "default"
    paragraphs:
      - "Green and gold pervade Vermont's tourism and agricultural branding in ways that give the unofficial color pairing a near-official status in public communications. Vermont Tourism, the state's official tourism promotion agency, uses green and gold extensively in marketing campaigns that emphasize the foliage season and the Green Mountain landscape. Vermont's Agency of Agriculture, Food and Markets uses green in its branding to signal Vermont's commitment to sustainable farming and land stewardship. The Vermont maple syrup industry, represented by the Vermont Maple Sugar Makers' Association, uses gold as its primary color tradition, consistent with the amber palette of Grade A maple syrup and the golden autumn foliage of the sugar maple forests from which it is derived. The Vermont Ski Areas Association and the Vermont Department of Forests, Parks and Recreation both employ green as their dominant color, reflecting the forest and mountain environment that defines Vermont's outdoor economy and aligns with themes in [state symbol hubs](/symbols/trees)."

