intro_text: "Vermont's state seal was designed in 1779 by a government that was not yet a U.S. state. The seal shows a tall pine tree against the Green Mountains, with a cow and wheat sheaves below and the motto 'Freedom and Unity' at the bottom. Vermont joined the Union as the 14th state on March 4, 1791. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
