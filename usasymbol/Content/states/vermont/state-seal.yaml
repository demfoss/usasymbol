timeline:
- year: '1775'
  description: Ethan Allen and the Green Mountain Boys capture Fort Ticonderoga from the British on May 10, establishing Vermont's military identity before independence is declared.
- year: '1777'
  description: Vermont declares independence on January 15 and adopts a constitution that is the first in America to ban adult slavery and the first to grant universal male suffrage regardless of property ownership.
- year: '1779'
  description: The Vermont General Assembly adopts the Great Seal of the Republic of Vermont, establishing the pine tree, Green Mountains, cow, wheat sheaves, and the motto "Freedom and Unity."
- year: '1790'
  description: New York relinquishes its territorial claims to Vermont, removing the main obstacle to statehood. Congress approves Vermont's admission.
- year: '1791'
  description: Vermont joins the Union on March 4 as the 14th state, the first added after the original thirteen colonies. The seal is adapted for statehood while retaining the 1779 composition.

faq:
- question: What does the Vermont state seal show?
  answer: The Vermont state seal shows a tall pine tree in the center against a backdrop of the Green Mountains. A cow appears in the lower portion alongside sheaves of grain. The motto "Freedom and Unity" appears at the bottom. The design was adopted in 1779 when Vermont was still an independent republic.
- question: When was the Vermont state seal adopted?
  answer: The Great Seal of Vermont was adopted in 1779 by the Vermont General Assembly, twelve years before Vermont joined the United States. Vermont operated as an independent republic from 1777 to 1791 and had its own constitution, currency, and postal service before achieving statehood on March 4, 1791.
- question: What does the pine tree mean on the Vermont state seal?
  answer: The pine tree represents Vermont's forests and the state's authority over its own timber. During the colonial era, the British Crown's Broad Arrow policy reserved the tallest white pines for Royal Navy masts. Placing a pine tree at the center of Vermont's seal was a declaration that Vermont's forests belonged to Vermont.
- question: What does "Freedom and Unity" mean on the Vermont seal?
  answer: '"Freedom and Unity" is Vermont''s state motto and reflects the two founding commitments of the 1777 Republic of Vermont. "Freedom" referenced the specific liberties codified in Vermont''s constitution, including the first prohibition of adult slavery in America. "Unity" reflected the communal cooperation required in Vermont''s rural, mountainous terrain.'
- question: Why is there a cow on the Vermont state seal?
  answer: The cow represents Vermont's dairy-centered agricultural economy, which has been the foundation of Vermont's farming communities since the eighteenth century. Vermont produces more milk per capita than any other state. The cow on the seal was a direct representation of how Vermont's population actually made its living, not a classical or heraldic symbol.
- question: What was the Republic of Vermont?
  answer: The Republic of Vermont was an independent state that existed from January 15, 1777 to March 4, 1791. Vermont declared independence from both Britain and from New York and New Hampshire, which disputed its territory. It operated with its own constitution, legislature, currency, postal service, and diplomatic relations before Congress admitted it to the Union as the 14th state.

