meaning: "The Great Seal of Vermont was designed in 1779 by a republic that would not join the United States for another twelve years. The pine tree at the center, the Green Mountains behind it, the cow and wheat sheaves below, and the motto 'Freedom and Unity' all reflect the character of an independent commonwealth that built its identity before it built its statehood."
