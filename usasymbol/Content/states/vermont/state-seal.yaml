sections:
- id: history
  icon: fa-solid fa-landmark
  title: Vermont State Seal History and Origin
  paragraphs:
  - "Vermont declared independence in January 1777, not from Britain directly, but from the colonies of New York and New Hampshire, which both claimed Vermont's territory. The Vermont General Assembly adopted a state seal in 1779, while Vermont was still an independent republic operating under its own 1777 constitution. That constitution was notable on two counts: it was the first in America to explicitly prohibit adult slavery, and the first to grant voting rights to all adult men regardless of property ownership."
  - "Vermont operated as an independent republic for fourteen years, with its own currency, postal service, and diplomatic correspondence. Congress repeatedly blocked Vermont's admission because New York disputed the territory, and because admitting Vermont would disrupt the balance between large and small states. The dispute was resolved in 1790, and Vermont entered the Union on March 4, 1791, as the 14th state, the first added after the original thirteen colonies."
  - "The 1779 seal design was adapted for statehood in 1791 but retained its original composition. The pine tree, Green Mountains, cow, wheat sheaves, and the motto 'Freedom and Unity' have remained the core elements of the Vermont seal since the republic era."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Vermont State Seal Symbols Mean
  paragraphs:
  - "The Vermont seal organizes a landscape scene within a circular frame, with each element drawn from the specific geography and economy of Vermont rather than from classical or heraldic convention."
  elements:
  - id: pine-tree
    name: Pine Tree
    image: /images/state-seals/vermont/elements/pine-tree.svg
    paragraphs:
    - "A tall pine tree stands at the center of the Vermont seal. Pine trees had been contested symbols in colonial New England: the British Crown's Broad Arrow policy reserved the tallest white pines for Royal Navy masts, prohibiting colonists from cutting them. Vermont's seal claimed that tree as a symbol of the state's forests and the state's authority over its own land."
    - "Vermont's timber industry was central to its early economy. The forests of the Green Mountains supplied lumber for construction and fuel throughout New England. The pine on the seal was not an abstract symbol; it was a direct representation of a resource that Vermont had fought, politically and legally, to control."
  - id: green-mountains
    name: Green Mountains
    image: /images/state-seals/vermont/elements/green-mountains.svg
    paragraphs:
    - "The Green Mountains appear in the background of the seal behind the pine tree. The range gave Vermont its name: 'Vermont' is derived from the French 'Verts Monts,' meaning Green Mountains, a name proposed by Thomas Young in 1777 as Vermont was organizing its independence. The mountains are not generic landscape filler; they are the origin of the state's identity."
    - "The Green Mountains run the length of Vermont from north to south and shaped the state's development. They divided eastern and western Vermont into distinct communities, made agriculture difficult at elevation, and provided the timber, waterpower, and eventually the tourism economy that sustained the state across different eras."
  - id: cow
    name: Dairy Cow
    image: /images/state-seals/vermont/elements/cow.svg
    paragraphs:
    - "A cow appears in the lower portion of the seal. Vermont's dairy industry has been central to its agricultural economy since the eighteenth century. Vermont produces more milk per capita than any other state, and dairy farming shaped the landscape of Vermont's valleys and hillsides, where the cleared pastures remain characteristic features of the terrain."
    - "The cow on the seal was a practical statement about how Vermont's population actually lived. It was not a classical allegory or a heraldic symbol imported from European tradition. It was a direct representation of the livestock that defined Vermont's farms and communities."
  - id: wheat-sheaves
    name: Wheat Sheaves
    image: /images/state-seals/vermont/elements/wheat-sheaves.svg
    paragraphs:
    - "Sheaves of grain appear alongside the cow. Grain agriculture was part of Vermont's early economy before the region shifted more fully to dairy in the nineteenth century. The wheat sheaves on the seal represent the agricultural foundation of the Vermont settlement: the crops that fed the population and sustained the farms through Vermont's demanding growing seasons."
  - id: freedom-and-unity
    name: Freedom and Unity (State Motto)
    image: /images/state-seals/vermont/elements/freedom-and-unity.svg
    paragraphs:
    - "The motto 'Freedom and Unity' appears at the bottom of the seal. It was adopted alongside the seal in 1779 and reflects the two founding commitments of the Republic of Vermont: individual liberty, as written into the 1777 constitution, and the communal bonds required for a small mountain republic to survive."
    - "Vermont's constitution of 1777 was among the most progressive of any American founding document. It banned adult slavery by name, guaranteed freedom of religion, and extended voting rights to all adult men. 'Freedom' was not an abstraction on Vermont's seal; it described a specific set of legal commitments already codified in Vermont law."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Vermont State Seal'
  paragraphs:
  - "The composition of the Vermont state seal has remained consistent from the republic era through statehood. The pine tree, Green Mountains, cow, wheat sheaves, and the motto 'Freedom and Unity' have not changed. The principal adaptation at statehood in 1791 was updating the border text to reflect Vermont's status as a state of the United States."
  versions:
  - name: Republic of Vermont Seal (1779)
    years: 1779–1791
    image: /images/state-seals/vermont/versions/1779-republic.jpg
    description: Adopted by the Vermont General Assembly in 1779, when Vermont was an independent republic. The border text identified the Republic of Vermont. The design established the pine tree, Green Mountains, cow, wheat sheaves, and the motto "Freedom and Unity."
  - name: State Seal at Admission (1791–present)
    years: 1791–present
    image: /images/state-seals/vermont/versions/1791-statehood.svg
    description: Adapted when Vermont joined the Union on March 4, 1791, as the 14th state. The border text was updated to reflect statehood. The core composition remained identical to the 1779 republic design.

