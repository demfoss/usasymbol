intro_text: Vermont's state cold water fish is the brook trout, the state's only native stream-dwelling trout, adopted in 1978. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Cold Water Fish of Vermont?
  paragraphs:
  - The brook trout is the official state cold water fish of Vermont. The Vermont General Assembly named it in 1978, and its scientific name is Salvelinus fontinalis.
  - Vermont also has a state warm water fish, the walleye.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a greenish back covered in wavy, worm-like markings. Its sides have pale yellowish spots and small bright red spots, each circled by a blue halo.
  - Its tail is not forked, which is why some people call it a squaretail. It also goes by brookie and speckled trout.
  - Even though people call it a trout, the brook trout is really a char. Its light spots on a dark body help anglers tell it apart from brown and rainbow trout.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Cold Water Fish
  paragraphs:
  - Students at Cornwall Elementary School led the push for Vermont's state fish. Their work led the Vermont General Assembly to pass a joint resolution on May 3, 1978, naming two state fish.
  - The brook trout became the state cold water fish and the walleye became the state warm water fish. In 2012, state lawmakers added both fish to Vermont law.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Vermont Chose the Brook Trout
  paragraphs:
  - Vermont lawmakers called the brook trout and the walleye high-quality, handsome game fish. They said both fish reflect Vermont's reputation for clean water.
  - The brook trout stands for the state's icy mountain streams, while the walleye stands for its warmer lakes.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Brook trout live in cold water all across Vermont. Nearly every small, cold stream in the state has them, especially streams flowing out of the Green Mountains and the Northeast Kingdom highlands.
  - They rarely live in water warmer than 68°F. Good brook trout waters include the White, Mettawee, Ottauquechee, Cold, Mill, and Deerfield rivers.
