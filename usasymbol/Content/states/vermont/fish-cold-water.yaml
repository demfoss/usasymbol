- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1978 by the Vermont General Assembly.
  - Scientific name is Salvelinus fontinalis.
  - Vermont's only native stream-dwelling trout, and it is really a char.
  - In small mountain streams, most brook trout are only six to seven inches long.
  - The Vermont record brook trout weighed 5 pounds 12 ounces. It was caught in Paran Creek in 1977.
faq:
- question: What is Vermont's state fish?
  answer: Vermont has two state fish. The brook trout is the state cold water fish, and the walleye is the state warm water fish.
- question: When did Vermont adopt the Brook trout?
  answer: The Vermont General Assembly named the brook trout the state cold water fish on May 3, 1978. Lawmakers added it to state law in 2012.
- question: Why did Vermont choose the Brook trout?
  answer: Lawmakers said it is a handsome, high-quality game fish that reflects Vermont's clean water and cold mountain streams. Students at Cornwall Elementary School pushed for the designation.
- question: Is the brook trout really a trout?
  answer: Not exactly. The brook trout is a char, which is a close relative of trout. It is still Vermont's only native stream-dwelling trout.
- question: Why is the brook trout called a squaretail?
  answer: Most trout have a forked tail, but the brook trout's tail is nearly straight across. That square shape gave it the nickname squaretail.
