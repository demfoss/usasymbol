hero_image_caption: "The northern leopard frog, Vermont's state amphibian, is named for its dark, leopard-like spots."
intro_text: "Vermont's state amphibian is the northern leopard frog, a spotted green frog common in the state's wetlands and fields, adopted in 1998. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Vermont?
    paragraphs:
      - "The northern leopard frog is Vermont's official state amphibian, designated by the Vermont Legislature in 1998. Its scientific name is Rana pipiens."
      - "It is a common frog found in ponds, marshes, and grassy fields across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Northern Leopard Frog
    paragraphs:
      - "The northern leopard frog has smooth green or brown skin covered in large, dark, rounded spots edged with lighter borders, which give it its leopard-like pattern."
      - "It grows to about 2 to 4 inches long and has a light-colored belly and ridged folds running down its back."
      - "It is known for spending time away from water in summer, hopping through wet meadows and grasslands far from ponds."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Vermont Legislature designated the northern leopard frog the official state amphibian in 1998, recognizing a frog familiar to students and residents across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Vermont Chose the Northern Leopard Frog
    paragraphs:
      - "Official sources name the northern leopard frog as Vermont's state amphibian because it is a common, easily recognized species found throughout the state, but they do not give a more detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Northern Leopard Frog
    paragraphs:
      - "Northern leopard frogs live in ponds, marshes, streams, and wet meadows throughout Vermont, including the Champlain Valley and other lowland wetlands."
    sites:
      - name: Lake Champlain wetlands
        city: Burlington
        lat: 44.48
        lng: -73.21
        note: "Common wetland habitat in Vermont"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Northern Leopard Frog Facts
    facts:
      - "Adopted in 1998 by the Vermont Legislature."
      - "Named for the dark, leopard-like spots covering its green or brown skin."
      - "Grows to about 2 to 4 inches long."
      - "Often found far from water, hopping through wet meadows in summer."
      - "Found in ponds, marshes, and fields throughout Vermont."

