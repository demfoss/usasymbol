faq:
  - question: "What is Vermont's state heritage breed of livestock?"
    answer: "Vermont's official state heritage breed of livestock is the Randall Lineback cattle (Bos taurus), designated on March 9, 2006, when Governor Jim Douglas signed House Bill No. 468 into law. Vermont is the only state to designate a heritage breed of cattle, creating a unique category of state symbol recognizing agricultural genetic diversity and history."
  
  - question: "Why did Vermont choose the Randall Lineback as its heritage breed?"
    answer: "Vermont chose the Randall Lineback because it is the only traditional breed of cattle to have originated in Vermont. The Samuel Randall family of Sunderland developed the breed by maintaining a closed herd from approximately 1912 to 1985, preserving the last pure population of New England landrace cattle. As recently as 1985, the breed faced extinction when only 15-20 animals remained. The designation recognizes the breed's contributions to Vermont agricultural history and affirms that preserving critically rare genetics is integral to Vermont heritage. The Randall Lineback represents Vermont's diversified agricultural past when farms required triple-purpose animals for dairy, beef, and draft work."
  
  - question: "How did the Randall Lineback cattle survive near-extinction?"
    answer: "When Everett Randall died in 1985, his cattle herd was dispersed and most animals faced slaughter. Cynthia Creech, working with Connecticut organic farmer Philip Lang, purchased the last 9 cows and 6 bulls from various buyers who had acquired animals from the Randall farm. Creech moved these 15 surviving animals to Tennessee, nursed them back to health from terrible condition (they were skinny, lice-covered, and had manure burn from being locked in a barn), and began rebuilding the population. She later moved the herd to upstate New York for better climate. Joe Henderson of Chapel Hill Farm in Virginia acquired 25 animals from Creech's herd and built the population to over 200 animals through natural breeding and embryo transfer. These conservation efforts have grown the population from 15 animals in 1985 to approximately 500-600 registered animals today."
  
  - question: "What makes Randall Lineback cattle different from other cattle breeds?"
    answer: "Randall Linebacks are a landrace breed that developed naturally through local farmer selection over centuries rather than through formal breeding programs. They are triple-purpose cattle historically used for dairy production, beef, and draft work as oxen, making them versatile for small diversified farms. They possess remarkable hardiness and survival skills, including the ability to thrive on marginal forages without grain, birth and raise calves unassisted, defend against predators, and tolerate harsh New England winters without intensive management. Their distinctive lineback color pattern features a white stripe down the spine with black markings on a white base and variable blue-roan shading on the sides. Unlike modern specialized breeds, Randall Linebacks retain genetic flexibility allowing adaptation to varied conditions without antibiotics, vaccines, or controlled environments."
  
  - question: "Where can I see Randall Lineback cattle in Vermont?"
    answer: "Randall Lineback cattle can be seen at Newhall Farm in Reading, Vermont, which maintains a conservation herd and operates a grass-fed veal program. The Heritage Rare Breeds Foundation in Hartland, Vermont, also works with rare livestock including Randall Linebacks and occasionally offers public tours. Private farms throughout Vermont maintain small herds, and viewing opportunities are generally available by contacting breeders through the Randall Lineback Breed Association. The cattle occasionally appear at Vermont agricultural fairs and heritage breed exhibitions. Because the breed is critically rare, seeing them requires more effort than viewing common livestock, but breeders typically welcome serious visitors interested in conservation."
  
  - question: "What is a landrace breed?"
    answer: "A landrace breed is a local variety of domestic animal that developed over time through natural selection and informal farmer selection in a specific geographic area, rather than through deliberate breeding programs guided by written standards. Landrace animals gain uniformity mainly through isolation from outside genetics and adaptation to local environmental conditions. They typically possess hardiness, disease resistance, and efficiency with local forages because only animals suited to the environment survived to reproduce across generations. The Randall Lineback is a landrace breed that originated from the mixing of English, French, and Dutch cattle imported to New England in the 1600s, then developed through two centuries of farmer selection for triple-purpose utility in Vermont's challenging climate. Most landrace cattle disappeared during the late 1800s and 1900s when specialized pure breeds were imported and crossed with or replaced local animals. The Randall Lineback is the last survivor of New England's landrace cattle populations."
  
  - question: "How rare are Randall Lineback cattle today?"
    answer: "Randall Lineback cattle are critically rare with approximately 500-600 registered animals worldwide as of 2022. This represents significant recovery from the 15 animals that survived near-extinction in 1985, but the breed remains among America's rarest cattle. The Livestock Conservancy lists them as 'critically rare,' their most endangered conservation status. For comparison, Holstein cattle (the dominant dairy breed) number in the millions, while the entire global Randall Lineback population could fit in a few large barns. All current Randall Linebacks descend from the 15 animals rescued in 1985, creating genetic bottleneck that conservation breeders manage carefully through tracking family lines and maintaining the broadest possible genetic base. The breed requires active conservation efforts to survive, as economic forces favor specialized commercial breeds over heritage genetics."
  
  - question: "What is the connection between Randall Lineback cattle and the Randall family?"
    answer: "The breed is named after the Samuel Randall family of Sunderland, Vermont, who maintained the cattle herd from approximately 1912 to 1985. Samuel Randall, along with his wife and son Everett, farmed in Sunderland and kept a closed herd of lineback-patterned cattle that retained original landrace traits unlike most New England cattle that had been crossbred with Holsteins. For over 73 years, the Randalls bred their cattle only to each other without introducing outside genetics. The family kept approximately 22 milking stanchions, operating a small dairy farm typical of Vermont before agricultural consolidation. When Everett Randall died in 1985, the herd was dispersed, nearly ending the breed. Samuel and Everett Randall unknowingly preserved the last genetic link to centuries of New England landrace cattle through their practical choice to maintain animals they liked rather than following industry trends toward Holstein crossbreeding."

