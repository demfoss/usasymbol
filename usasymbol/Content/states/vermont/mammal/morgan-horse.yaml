title: "Morgan Horse"
scientific_name: "Equus caballus"
adopted_year: 1961

seo_title: "Vermont State Animal - Morgan Horse | Official State Mammal"
seo_description: "The Morgan horse is Vermont's state animal, designated in 1961. Bred from a single stallion named Figure, symbolizes Vermont's agricultural heritage and self-reliance."

intro_text: "Vermont's state animal is the Morgan horse (Equus caballus), designated in 1961 following House Bill No. 106 signed by Governor F. Ray Keyser Jr. The legislature selected this Vermont-bred horse to represent the state's agricultural heritage, self-reliance, and versatility. Morgan horses symbolize Vermont character through their strength, steady temperament, and ability to excel at multiple tasks from farm work to cavalry service to family riding, and they remain part of the national [state mammals index](/symbols/mammals)."

common_name: "Morgan Horse"
official_since: "1961"
status: "Thriving breed maintained through UVM Morgan Horse Farm breeding program and private breeders worldwide"
habitat_in_state: "Farms, stables, and pastures throughout Vermont; maintained at University of Vermont Morgan Horse Farm National Historic Site in Weybridge"
known_for: "Only American horse breed founded by a single stallion; versatility in farm work, cavalry service, and riding; compact build with exceptional strength and stamina"

size: "14 to 15.2 hands (56 to 62 inches) at withers; compact, muscular build"
weight: "900 to 1,100 pounds depending on sex and individual; sturdy despite relatively small size"
coloration: "Bay, black, chestnut most common; original stallion Figure was bay with black points; expressive heads with large eyes"
distinctive_traits: "Compact yet powerful build; thick, flowing mane and tail; arched neck; short back; strong legs; alert, intelligent expression; exceptional prepotency (ability to pass traits to offspring)"

habitat: "Pastures, farms, stables; adapted to Vermont's rocky terrain and harsh winters requiring thrifty feed requirements"
range_in_state: "Found throughout Vermont on private farms and at University of Vermont Morgan Horse Farm in Weybridge; breed originated in Randolph"
conservation_status: "Stable population worldwide; breed maintained through American Morgan Horse Association registry; UVM Morgan Horse Farm preserves government bloodlines"
where_to_find: "University of Vermont Morgan Horse Farm in Weybridge (National Historic Site); private farms throughout Vermont; Vermont Morgan Horse Association events"
symbol_connections: "Coat of arms features deer head representing wildlife; Morgan represents agricultural heritage parallel to sugar maple (state tree) representing natural resources; both symbolize self-reliance central to Vermont motto 'Freedom and Unity'"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Vermont Legislature designated the Morgan horse as the official state animal through House Bill No. 106, enacted as Act No. 42 of 1961, signed by Governor F. Ray Keyser Jr. and effective March 23, 1961. The designation recognized the breed's Vermont origins and the horse's role in shaping state agricultural history."
      - "Vermont acted partly in response to Massachusetts considering the Morgan as their state horse. Though Figure was born in Springfield, Massachusetts, in 1789, he spent only his first two years there before Justin Morgan brought him to Randolph, Vermont, in 1791 or 1792."
    
    subsections:
      - subtitle: "Vermont Claims the Breed's Legacy"
        text: "The legislative debate clarified that while Figure originated in Massachusetts, Vermont bred and developed the Morgan horse breed. Justin Morgan brought Figure to his farm in Randolph when the colt was two or three years old, and Vermont's landscape, farming practices, and breeding programs shaped the breed's characteristics over subsequent generations. Figure spent 28 of his 32 years in Vermont and New Hampshire, producing countless offspring throughout the Connecticut River Valley. Vermont breeders recognized the exceptional qualities being passed to Figure's descendants and deliberately bred his sons and daughters to preserve these traits, effectively founding the breed on Vermont farms during the early 1800s."
      
      - subtitle: "Who Championed the Designation"
        text: "Marilyn Childs, former Director of the American Morgan Horse Association based in Middlebury, and Amber Broderick, former Director of the National Museum of the Morgan Horse, led efforts to secure the Morgan as Vermont's state animal. Their campaign emphasized the breed's historical significance to Vermont agriculture, the horse's contribution to American military history through Vermont cavalry regiments, and the ongoing preservation work at the University of Vermont Morgan Horse Farm. The designation aligned with Vermont's mid-twentieth-century effort to define state identity through official symbols, following adoption of the [Hermit Thrush as state bird](/states/vermont/bird/hermit-thrush) in 1941 and the sugar maple as state tree in 1949."
      
      - subtitle: "The 1961 Context"
        text: "Vermont's 1961 designation occurred during a period when Morgan horses faced uncertain future. Modern agriculture relied increasingly on tractors rather than draft animals, and recreational riding favored larger horse breeds. The state animal designation drew attention to Morgan preservation efforts and Vermont's unique equestrian heritage. The University of Vermont Morgan Horse Farm, established in 1878 by Joseph Battell and operated by the U.S. Department of Agriculture from 1907 to 1951, had already demonstrated Morgan importance to American horse breeding. By officially recognizing the Morgan in 1961, Vermont committed to preserving the breed through state-supported institutions even as the horse's traditional agricultural roles diminished."

  - id: "state-symbolism"
    icon: "fa-horse-head"
    title: "What the Morgan Horse Represents"
    style: "highlight"
    paragraphs:
      - "The Morgan horse embodies Vermont's character through versatility and self-reliance. Farmers who owned only one horse required an animal capable of plowing fields Monday through Friday, pulling the family carriage to church Sunday morning, and winning a harness race Sunday afternoon in the same rural economy represented by [Vermont's sugar maple](/states/vermont/tree/sugar-maple)."
      - "Vermont's landscape shaped both human settlement patterns and horse breeding practices. Rocky soil, narrow valleys, and harsh winters demanded animals that thrived on modest feed, navigated difficult terrain, and maintained soundness across long working lives spanning two decades or more."
      - "The breed's foundation story mirrors Vermont's emphasis on individual merit over pedigree. Figure, a small colt of uncertain breeding, proved himself through performance rather than paperwork. His ability exceeded expectation based on size, demonstrating qualities Vermonters valued: determination, strength beyond appearance, and willingness to work."
    
    subsections:
      - subtitle: "Symbol of Vermont Self-Reliance"
        text: "Morgan horses exemplify the self-sufficient character central to Vermont identity. Settlers arriving in Vermont's Green Mountains faced subsistence farming on rocky hillsides with limited resources. They needed horses that consumed less grain than larger breeds while performing multiple functions from draft work to transportation to recreation. Morgans thrived on pasture grass and hay, requiring minimal grain supplementation compared to draft horses or Thoroughbreds. This efficiency made horse ownership economically feasible for small farmers who formed Vermont's social foundation. The same self-reliance that allowed Vermonters to prosper in challenging mountain environments appeared in their horses, creating symbolic connection between people and animal central to state identity and to [Freedom and Unity](/states/vermont/motto/freedom-and-unity)."
      
      - subtitle: "Agricultural Foundation"
        text: "Morgan horses built Vermont agriculture during the nineteenth century. Vermont farms operated on hillsides too steep for large draft horses, in valleys too narrow for extensive field cultivation, and across terrain littered with stones deposited by glaciers. Morgans pulled plows through rocky soil, hauled stones for walls, skidded logs from forests being cleared for farmland, and transported goods between farms and villages. Their compact build and sure-footedness suited Vermont's topography better than larger breeds. Farmers depended on horses that remained sound across years of demanding work, and Morgans reliably served fifteen to twenty years without breaking down. This longevity made economic sense for families who could not afford replacing animals frequently."
      
      - subtitle: "Military Heritage"
        text: "Morgan horses served Vermont and the Union during the Civil War, cementing their place in state military history. The 1st Vermont Cavalry, mounted exclusively on Morgan horses, fought in 75 major engagements between 1861 and 1865. Of approximately 1,000 Morgan horses that went to war with Vermont cavalry regiments, only 200 returned home, having survived combat, disease, and the extreme demands of military service. Generals on both sides recognized Morgans for stamina, courage under fire, and ability to maintain condition on limited forage during long campaigns. General Philip Sheridan's cavalry mount Rienzi was a Morgan, as was Confederate General Stonewall Jackson's famous horse Little Sorrel. The breed's military service demonstrated qualities beyond agricultural work, validating Vermont breeders' belief in Morgan versatility."
      
      - subtitle: "Foundation for American Breeds"
        text: "Morgan blood flows through several major American horse breeds, extending Vermont's equine influence nationwide. The American Standardbred, developed for harness racing, traces to Morgan stallions including Sherman Morgan and Black Hawk. The American Saddlebred incorporates Morgan ancestry through Denmark and Gaines Denmark. Tennessee Walking Horse breeding includes Morgan bloodlines from Allan F-1. Quarter Horse pedigrees show Morgan influence particularly through Steel Dust and other foundation sires. This genetic legacy means that Vermont's contribution to American horse breeding extends far beyond Morgan horses themselves, with Vermont bloodlines shaping equine characteristics across the continent during westward expansion."
      
      - subtitle: "The Name That Became a Breed"
        text: "Figure became known as 'Justin Morgan's horse' and eventually simply as 'the Justin Morgan horse' following the custom of naming stallions by their owner's name. After Justin Morgan died in 1798, the horse continued carrying Morgan's name through successive ownerships. Figure's exceptional prepotency—his ability to consistently pass his own characteristics to offspring regardless of the mare's qualities—created a recognizable type across generations. By the 1840s, Vermont and New Hampshire breeders deliberately sought second-, third-, and fourth-generation descendants of Figure and bred them together to preserve the distinct Morgan type they recognized. This breeding program, conducted by farmers rather than wealthy estate owners, created the only horse breed founded entirely by a single stallion's genetic influence."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Morgan Horses"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Morgan horses stand 14 to 15.2 hands high (56 to 62 inches measured at the withers) and weigh 900 to 1,100 pounds. Despite their relatively small size, Morgans exhibit muscular, powerful build with compact body structure. The head features refined features with large, expressive eyes, short alert ears, and a slightly dished or straight profile. The neck arches prominently from well-defined withers to a clean-cut throatlatch. Morgan bodies show short, strong backs with deep chests providing substantial lung capacity. Hindquarters demonstrate muscular development with well-rounded croups. Legs display strong bone structure, flat knees, short cannons, and well-defined tendons. Hooves are proportionally sized for the body with dense horn. The overall impression combines elegance with substance, power with refinement."
        list_items:
          - "**Size**: 14 to 15.2 hands (56-62 inches) at withers; compact, muscular build"
          - "**Weight**: 900-1,100 pounds; heavy for height due to muscle density and bone substance"
          - "**Color**: Bay, black, chestnut most common; palomino, buckskin, gray less frequent; original Figure was dark bay"
          - "**Features**: Arched neck, short back, muscular hindquarters, thick mane and tail, expressive head with large eyes"
      
      - subtitle: "Movement and Gait"
        text: "Morgan horses move with distinctive animation and cadence. The trot, particularly valued in harness racing during the breed's development, exhibits high action with flexed knees and hocks creating elevated, ground-covering strides. The walk demonstrates energy and purpose with overstriding rear hooves landing ahead of front hoof prints. Morgans move freely from the shoulder with balanced collection allowing quick transitions and changes of direction. This natural balance made Morgans suitable for cavalry work requiring rapid maneuvers. The breed's way of going combines elegance with efficiency, traveling long distances without fatigue while maintaining showy appearance appreciated in parade and show ring contexts."
      
      - subtitle: "Temperament and Intelligence"
        text: "Morgan temperament balances spirited energy with willing cooperation. Owners consistently describe Morgans as intelligent, alert, and eager to please human partners. The breed demonstrates courage without recklessness, making them suitable for novice riders while providing sufficient spirit for experienced horsemen. Morgans form strong bonds with handlers, displaying loyalty and affection that made them valued family horses during Vermont's agricultural era. Their people-oriented nature allowed farmers to work Morgans in draft harness, ride them for transportation, and trust children around them with minimal risk. This tractable disposition, combined with intelligence allowing quick learning of new tasks, created the versatility central to Morgan utility on nineteenth-century Vermont farms."

  - id: "in-the-state"
    icon: "fa-map-location-dot"
    title: "Morgan Horses in Vermont Today"
    style: "default"
    paragraphs:
      - "Vermont maintains Morgan horses throughout the state on private farms, riding stables, and at the University of Vermont Morgan Horse Farm in Weybridge. The UVM Morgan Horse Farm, designated a National Historic Site, operates as a breeding and education center preserving government bloodlines developed during federal ownership from 1907 to 1951."
      - "The Vermont Morgan Horse Association, organized in 1966, promotes the breed through shows, educational programs, and advocacy. The National Museum of the Morgan Horse in Middlebury preserves breed history through exhibits, archives, and special events documenting Morgan contributions to American agricultural and military history."
    
    facts:
      - "**UVM Morgan Horse Farm**: National Historic Site in Weybridge; breeds 15-20 Morgan foals annually; maintains Battell, Government, and UVM bloodlines"
      - "**American Morgan Horse Association**: Headquartered in Shelburne, Vermont; maintains breed registry; over 175,000 registered Morgans since 1894"
      - "**Figure's Statue**: Bronze statue at UVM Morgan Horse Farm erected 1921; commemorates foundation stallion buried in Tunbridge, Vermont, in 1821"
      - "**Randolph Origins**: Town of Randolph where Justin Morgan established farm and bred Figure; commemorated as breed birthplace"
    
    subsections:
      - subtitle: "The UVM Morgan Horse Farm Legacy"
        text: "Joseph Battell purchased land in Weybridge in 1878 and established a breeding farm to preserve Morgan bloodlines he feared were becoming diluted through crossbreeding with other types. Battell published the first Morgan Horse Register in 1894, documenting pedigrees and establishing breed standards. In 1907, he sold the farm to the U.S. Department of Agriculture, which operated it as the U.S. Morgan Horse Farm until 1951. During this period, the federal government bred over 500 Morgans for cavalry remount programs, creating the 'Government' bloodline known for substantial bone, athleticism, and endurance. The University of Vermont acquired the farm in 1951 and continues breeding, education, and research programs while maintaining the property as a National Historic Site open to public visitors from May through October annually."

  - id: "where-to-see"
    icon: "fa-location-dot"
    title: "Where to See Morgan Horses in Vermont"
    style: "default"
    paragraphs:
      - "The University of Vermont Morgan Horse Farm in Weybridge offers the most accessible viewing opportunity with 40-plus Morgans maintained on the 150-year-old working farm. Guided tours operate May through October, providing visitors with breed history, demonstrations, and viewing of multiple generations from foals to mature breeding stock."
      - "The National Museum of the Morgan Horse in Middlebury presents exhibits on breed development, Justin Morgan and Figure's history, Morgan contributions to American westward expansion, Civil War service, and contemporary uses. The museum houses archives including photographs, documents, and artifacts spanning two centuries of Morgan horse history."
    
    list_items:
      - "**UVM Morgan Horse Farm, Weybridge**: Guided tours daily late May through October; breeding demonstrations; foals born March through June; National Historic Site designation"
      - "**National Museum of the Morgan Horse, Middlebury**: Exhibits on breed history, Figure's life, military service; research library; special events; educational programs"
      - "**Vermont Morgan Horse Association Events**: Shows, clinics, trail rides throughout Vermont; check association calendar for public events and demonstrations"
      - "**Private Farms**: Many Vermont farms welcome visitors by appointment; Vermont Morgan Horse Association provides breeder directory for farm visits"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Current Status and Breed Management"
    style: "default"
    paragraphs:
      - "The Morgan horse breed maintains healthy population worldwide with active breeding programs in North America, Europe, and Australia. The American Morgan Horse Association, headquartered in Shelburne, Vermont, maintains the breed registry, promotes Morgan horses, and supports preservation of historic bloodlines."
      - "Morgan versatility ensures continued relevance as modern horses transition from agricultural work to recreational and competitive uses. Morgans compete successfully in dressage, jumping, combined driving, endurance riding, Western pleasure, and numerous other equestrian disciplines while remaining suitable for family riding and beginner instruction."
    
    subsections:
      - subtitle: "Breed Management in Vermont"
        text: "Vermont maintains Morgan horse standards through the University of Vermont Morgan Horse Farm breeding program and private breeders affiliated with the Vermont Morgan Horse Association. The UVM farm focuses on preserving Government bloodline characteristics including substantial bone, endurance capability, and versatile temperament suitable for multiple disciplines. Private Vermont breeders produce Morgans for show, pleasure riding, competitive driving, and therapeutic riding programs. The state's role as breed birthplace creates tourism value, with the UVM farm attracting thousands of annual visitors interested in agricultural heritage and equine history. Vermont promotes Morgan horses through state marketing emphasizing agricultural traditions and rural character central to state identity and tourism economy."
      
      - subtitle: "Marguerite Henry's Literary Legacy"
        text: "The 1945 children's novel 'Justin Morgan Had a Horse' by Marguerite Henry introduced Morgan history to young readers nationwide and remains in print eight decades after publication. Henry fictionalized Figure's early life and Justin Morgan's relationship with the colt, creating a narrative emphasizing determination, loyalty, and the underdog succeeding against expectations. Disney's 1972 film adaptation expanded the story's reach, cementing Morgan horses in American popular culture. While historians distinguish Henry's fiction from documented facts—particularly regarding when Justin Morgan acquired Figure and the circumstances of his early training—the book successfully generated public interest in breed preservation and Vermont heritage. The emotional resonance of Henry's story telling introduced generations to Morgan history, even as scholars worked to document the more complex historical reality."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Morgan horse connects to Vermont's coat of arms through complementary agricultural symbolism. The coat of arms, adopted with the Great Seal in 1779 and designed by Ira Allen, features a deer head at the crest representing Vermont wildlife. The shield depicts a pine tree, cow, and wheat sheaves against Green Mountain backdrop, symbolizing natural resources and agricultural production."
      - "While the coat of arms emphasizes Vermont's forest and farm resources, the Morgan horse represents the animal power that made agricultural development possible. Vermont farms depicted on the seal required horses to clear land, plow fields, and transport goods, with Morgan horses specifically providing this power throughout the nineteenth century."
    
    subsections:
      - subtitle: "Sugar Maple and Natural Resources"
        text: "Vermont designated the sugar maple as state tree in 1949, twelve years before selecting the Morgan horse. Both symbols represent resource self-sufficiency and products that supported Vermont economy. Sugar maples provided maple syrup, Vermont's most famous export, allowing farmers to generate income from forest resources during late winter when other farm work remained impossible. Morgan horses provided transportation and power enabling farmers to tap maple trees, collect sap, and transport finished syrup to markets. The partnership between Vermont's tree and Vermont's horse exemplifies integrated agricultural systems where multiple resources worked together supporting farm viability in challenging mountain environment."
        link:
          label: "See Vermont state tree"
          url: "/states/vermont/tree/sugar-maple"
      
      - subtitle: "Freedom and Unity Motto"
        text: "Vermont's motto 'Freedom and Unity,' adopted with the original 1779 seal, reflects the Vermont Republic's fourteen-year existence (1777-1791) as an independent entity before joining the United States as the fourteenth state. The motto balances individual liberty with communal cooperation, themes embodied in Morgan horse breeding practices. Vermont farmers exercised freedom in selecting which mares to breed to Morgan stallions, making individual breeding decisions without centralized authority. These independent choices collectively created unity in breed type as farmers recognized and preserved Morgan characteristics they valued. The cooperative effort to preserve Morgan bloodlines in the 1840s demonstrated unity in action, with breeders across Vermont and New Hampshire working together toward shared preservation goals while maintaining individual farm operations."
        link:
          label: "See Vermont state motto"
          url: "/states/vermont/motto/freedom-and-unity"
      
      - subtitle: "Green Mountain State Identity"
        text: "Vermont's nickname 'The Green Mountain State' derives from French words 'vert mont' meaning green mountain. The Green Mountains that gave Vermont its name provided both opportunity and obstacle for agricultural settlement. Morgan horses specifically adapted to mountain farming, navigating steep hillsides, working in narrow valleys between ridges, and maintaining condition on pastures interrupted by rock outcroppings. The breed's success in Green Mountain terrain made Vermont agriculture viable where larger draft breeds struggled. This geographic connection ties Morgan horses directly to Vermont's defining landscape feature, with the horse representing successful human adaptation to mountain environment that shapes state character and identity, as described in [Vermont's nickname page](/states/vermont/nickname/the-green-mountain-state)."

