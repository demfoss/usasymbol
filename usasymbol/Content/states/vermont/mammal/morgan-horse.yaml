faq:
  - question: "What is Vermont's state animal?"
    answer: "Vermont's state animal is the Morgan horse (Equus caballus), designated as the official state mammal on March 23, 1961, when Governor F. Ray Keyser Jr. signed Act No. 42 into law following passage of House Bill No. 106 by the Vermont Legislature."
  
  - question: "When was the Morgan horse designated as Vermont's state animal?"
    answer: "The Morgan horse became Vermont's state animal on March 23, 1961. The designation recognized the breed's Vermont origins and historical importance to state agriculture, military service, and equestrian heritage. Vermont acted partly in response to Massachusetts considering the Morgan as their state horse, asserting that while the foundation stallion Figure was born in Massachusetts, Vermont bred and developed the Morgan horse breed."
  
  - question: "Why did Vermont choose the Morgan horse as its state animal?"
    answer: "Vermont chose the Morgan horse because the breed originated in Vermont, shaped state agricultural history, and symbolizes Vermont character through versatility, self-reliance, and steady temperament. Every registered Morgan traces ancestry to a single stallion, Figure, who spent 28 of his 32 years in Vermont after Justin Morgan brought him to Randolph around 1791-1792. Vermont farmers bred Morgan horses throughout the nineteenth century, creating an animal that could plow fields, pull carriages, win races, and serve as cavalry mounts. The breed embodies Vermont values of hard work, adaptability, and making the most of limited resources."
  
  - question: "Where can I see Morgan horses in Vermont?"
    answer: "The University of Vermont Morgan Horse Farm in Weybridge offers the best viewing opportunity, with guided tours daily from late May through October. This National Historic Site maintains 40-plus Morgan horses including breeding stock, foals, and horses used for educational demonstrations. The National Museum of the Morgan Horse in Middlebury provides exhibits on breed history, Justin Morgan's life, Figure's legacy, and Morgan contributions to American westward expansion and military service. Many private farms throughout Vermont also welcome visitors by appointment; contact the Vermont Morgan Horse Association for breeder directories and event schedules including shows, clinics, and trail rides."
  
  - question: "How did the Morgan horse breed begin?"
    answer: "The Morgan horse breed descended entirely from a single stallion named Figure, born in 1789 in Springfield, Massachusetts. Justin Morgan, a singing master and schoolteacher, acquired Figure around 1791-1792 and brought him to Randolph, Vermont. Figure proved exceptional at farm work, racing, and pulling competitions despite standing only 14 hands high and weighing approximately 900 pounds. More significantly, Figure possessed remarkable prepotency—the ability to consistently pass his own characteristics to offspring regardless of the mare's type. All registered Morgan horses trace their ancestry to Figure through his best-known sons Bulrush, Sherman, and Woodbury. Vermont and New Hampshire breeders recognized the distinctive type appearing in Figure's descendants and by the 1840s deliberately bred second-, third-, and fourth-generation offspring together to preserve Morgan characteristics."
  
  - question: "What makes Morgan horses unique?"
    answer: "Morgan horses are the only American horse breed founded by a single stallion whose genetic influence created a recognizable type across generations. Morgans combine compact size (14 to 15.2 hands) with substantial strength, allowing them to outpull much larger draft horses in pulling competitions. The breed demonstrates exceptional versatility, succeeding in farm work, cavalry service, harness racing, pleasure riding, competitive driving, dressage, jumping, and endurance riding. Morgans exhibit steady, willing temperament making them suitable for novice riders while providing sufficient spirit for experienced horsemen. They require modest feed compared to larger breeds, thriving on pasture grass and hay with minimal grain supplementation. This efficiency made Morgan ownership economically feasible for Vermont's small farmers during the breed's development."
  
  - question: "Did Morgan horses serve in the Civil War?"
    answer: "Yes, Morgan horses served extensively in the Civil War, particularly with Vermont cavalry regiments. The 1st Vermont Cavalry was mounted exclusively on Morgan horses and fought in 75 major engagements between 1861 and 1865. Of approximately 1,000 Morgan horses that went to war with Vermont cavalry units, only 200 returned home. The breed earned reputation as the finest cavalry and artillery horses in either army through stamina, courage under fire, and ability to maintain condition on limited forage during long campaigns. General Philip Sheridan's famous cavalry mount Rienzi was a Morgan, as was Confederate General Stonewall Jackson's horse Little Sorrel. This military service demonstrated Morgan versatility beyond agricultural work and cemented the breed's place in American military history."
  
  - question: "Who was Justin Morgan and what happened to Figure?"
    answer: "Justin Morgan (1747-1798) was a schoolteacher, singing master, and composer who moved from Springfield, Massachusetts, to Randolph, Vermont, with his family around 1789. He acquired a two-year-old bay colt named Figure around 1791-1792, possibly as payment for a debt. Morgan advertised Figure's stud services beginning in 1793, standing the stallion in Vermont and New Hampshire. Justin Morgan died in 1798, but Figure lived until 1821, dying at age 32 near Chelsea, Vermont, after sustaining a kick injury from another horse. Figure was buried in Tunbridge, Vermont. A bronze statue erected at the University of Vermont Morgan Horse Farm in 1921 commemorates the foundation stallion. Figure became known as 'the Justin Morgan horse' following the custom of naming stallions by their owner's name, and eventually the entire breed carried Morgan's name."

