seo_title: "Vermont State Rock | Granite, Marble, and Slate"
seo_description: "Vermont named three state rocks in 1992: granite, marble, and slate, honoring quarrying industries in Barre, Danby-Proctor, and the Slate Valley."
hero_image: /images/rocks/vermont/vermont-state-rock-hero.webp
hero_image_alt: "Three cut stone samples side by side: gray granite, white marble, and gray-green slate."
hero_image_caption: "Granite, marble, and slate, Vermont's three official state rocks, each anchor a distinct regional quarrying industry."
intro_text: "Vermont named three official state rocks in 1992: granite, marble, and slate, recognizing quarrying industries centered in Barre, the Rutland County marble belt, and the Slate Valley near Fair Haven and Poultney. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Vermont State Rock
    paragraphs:
      - "Vermont is one of the few states with more than one official state rock. In 1992, the state legislature named granite, marble, and slate together as state rocks, each representing a distinct quarrying region and industry that had shaped Vermont's economy for generations."
      - "Rather than choose a single winner, lawmakers recognized that all three stones were, and still are, central to Vermont's identity as one of the country's most productive dimension-stone states."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Are Granite, Marble, and Slate?"
    paragraphs:
      - "Granite is a coarse-grained igneous rock that crystallizes slowly from cooling magma deep underground, giving it a speckled gray texture and considerable hardness. Vermont's Barre granite is prized for monument and building work because it cuts cleanly and holds fine detail."
      - "Marble is a metamorphic rock formed when limestone recrystallizes under heat and pressure. Vermont's marble, quarried around Danby and Proctor in Rutland County, ranges from white to gray and takes a smooth, even polish."
      - "Slate is a fine-grained metamorphic rock formed from compressed shale or clay, which splits naturally into thin, flat sheets. Vermont's Slate Valley, around Fair Haven and Poultney, produces roofing slate in shades of gray-green, purple, and red."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Vermont Chose Granite, Marble, and Slate as Its State Rocks"
    paragraphs:
      - "Each stone anchors its own Vermont region and workforce. Barre's granite industry grew around quarries including the E.L. Smith Quarry, one of the largest monumental granite quarries in the world, drawing thousands of quarry and finishing workers by 1900."
      - "The Danby quarry near Proctor, developed by the Vermont Marble Company under Redfield Proctor, grew into the world's largest underground marble quarry, extending more than a mile into Dorset Mountain. To the west, the Slate Valley around Fair Haven and Poultney drew waves of Welsh, Irish, Italian, and Slavic immigrants beginning in the mid-1800s to work its slate quarries, at its peak supporting more than eighty operating quarries."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Granite, Marble, and Slate Became Vermont's State Rocks"
    paragraphs:
      - "State lawmakers named grossular garnet the state gem and talc the state mineral in 1991. The following year, after lobbying from Vermont's granite, marble, and slate industries, the legislature named all three stones state rocks together in 1992, rather than choosing just one."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Granite, Marble, and Slate Are Found in Vermont"
    paragraphs:
      - "Barre remains the center of Vermont's granite industry, while Danby and Proctor anchor the state's marble quarrying in Rutland County. The Slate Valley, stretching from Fair Haven and Poultney into neighboring New York, is Vermont's historic slate-producing region."
