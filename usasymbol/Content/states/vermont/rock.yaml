faq:
  - question: What are Vermont's state rocks?
    answer: "Vermont has three official state rocks: granite, marble, and slate, all adopted together in 1992."
  - question: When did Vermont adopt granite, marble, and slate as its state rocks?
    answer: "The Vermont Legislature designated granite, marble, and slate together as state rocks in 1992."
  - question: Why did Vermont choose three state rocks instead of one?
    answer: "Granite, marble, and slate each anchor a distinct Vermont quarrying region and industry, so lawmakers recognized all three together rather than favoring one over the others."
  - question: Where are granite, marble, and slate quarried in Vermont?
    answer: "Granite is quarried around Barre, marble around Danby and Proctor, and slate in the Slate Valley near Fair Haven and Poultney."

