  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Granite, Marble, and Slate Facts"
    facts:
      - "Adopted together as Vermont's three state rocks in 1992, a year after grossular garnet and talc became the state gem and mineral."
      - "Barre's E.L. Smith Quarry is one of the largest monumental granite quarries in the world."
      - "The Danby marble quarry near Proctor extends more than a mile into Dorset Mountain and is the world's largest underground marble quarry."
      - "Immigrants from Wales, Ireland, Italy, and Poland built the workforce of Vermont's Slate Valley around Fair Haven and Poultney beginning in the mid-1800s."

