seo_title: "Vermont State Motto | Freedom and Unity"
seo_description: "Vermont was an independent republic for 14 years before joining the US — longer than any other territory. Its motto was adopted in 1779, while Vermont was still a sovereign nation. Vermont's motto directly inspired Daniel Webster's 'Liberty and Union' Senate speech — which became North Dakota's state motto. Governor Thomas Chittenden's epitaph quotes it."

intro_text: "Vermont's state motto is <strong>Freedom and Unity</strong>, adopted on February 20, 1779 — while Vermont was still an independent republic, twelve years before it joined the United States. Vermont existed as a sovereign nation from 1777 to 1791, issuing its own currency and operating its own postal system. Ira Allen, 27 years old, designed the seal and motto in 1778. Vermont's motto later directly inspired Daniel Webster's 'Liberty and Union, now and forever, one and inseparable' — the speech that became North Dakota's state motto. In 2015, Vermont added a second, ceremonial Latin motto: <em>Stella quarta decima fulgeat</em> (May the fourteenth star shine bright), proposed by a high school student."

sections:
  - id: "republic-before-statehood"
    icon: "fa-solid fa-flag"
    title: "A Sovereign Republic's Motto — 12 Years Before Statehood"
    paragraphs:
      - "Vermont declared independence on January 15, 1777 — not from Britain, but from New York and New Hampshire, both of which claimed Vermont's territory. Vermont was not fighting to join the United States; it was fighting to exist at all. By July 8, 1777, the republic had its name, derived from the French <em>vert mont</em> meaning green mountains. Ethan Allen and the Green Mountain Boys had been resisting New York land grants since the 1760s."
      - "Vermont operated as an independent republic for fourteen years — longer than any other territory before joining the United States. It had its own currency, its own postal system, its own constitution (the first in the world to explicitly ban slavery and grant universal male suffrage), and its own foreign policy. Vermont negotiated with British representatives in Canada and maintained a diplomatic posture independent of the Continental Congress."
      - "Ira Allen, Ethan Allen's younger brother, designed the Great Seal for the Vermont Republic in 1778 at age 27. Reuben Dean of Windsor carved the physical seal. The Vermont General Assembly accepted it by resolution on February 20, 1779. When Vermont finally joined the United States as the 14th state on March 4, 1791, the legislature readopted the same motto for the new state seal — carrying a republic's motto into the union."

  - id: "inspired-north-dakotas-motto"
    icon: "fa-solid fa-link"
    title: "Vermont's Motto Inspired North Dakota's Motto"
    paragraphs:
      - "Daniel Webster delivered his Second Reply to Hayne in the U.S. Senate on January 26-27, 1830 — described as the most famous speech in Senate history. Webster closed with the words: 'Liberty and Union, now and forever, one and inseparable!' That phrase became North Dakota's state motto in 1889. But Webster derived it directly from Vermont's earlier phrase."
      - "The connection is documented. Writer Dorothy Canfield Fisher explicitly traced Webster's 'Liberty and Union' to Vermont's 'Freedom and Unity,' noting that the Vermont motto — created for a republic that had to balance its own independence with the larger union — provided the philosophical framework Webster used to argue against nullification and state secession 50 years later."
      - "Vermont's motto thus runs through American political history in two directions: it captured the founding tension of a republic that valued individual freedom but needed collective action, and it provided the intellectual vocabulary for one of the most celebrated defenses of federal union in American history. A phrase Ira Allen chose at 27 helped shape how Daniel Webster argued against secession — an argument tested 30 years later in the Civil War."

  - id: "seal-and-14-branches"
    icon: "fa-solid fa-tree"
    title: "The Pine Tree With Fourteen Branches"
    paragraphs:
      - "Vermont's Great Seal shows a pine tree at the center of the shield, surrounded by sheaves of wheat and a cow in the lower portion, with mountains in the background. The pine tree has fourteen branches — widely interpreted as representing Vermont's status as the 14th state. The number is consistent with the seal's other symbolism."
      - "The motto 'Freedom and Unity' appears on a scroll beneath the shield, with two crossed pine branches between the shield and the scroll. This design is Ira Allen's 1778 original, though the original seal wore out by 1821 and a more pictorial version replaced it. In 1937, the Vermont legislature returned to Allen's original design — the version currently in use."
      - "Governor Thomas Chittenden, Vermont's first governor during both the republic and early statehood periods, valued the motto so deeply that it appears in his epitaph. In 2015, high school student Angela Kubicke proposed a second ceremonial motto — <em>Stella quarta decima fulgeat</em>, Latin for 'May the fourteenth star shine bright' — which the legislature adopted. 'Freedom and Unity' remains the primary official motto."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Vermont State Motto Facts"
    style: "gradient"
    facts:
      - "Vermont was an independent republic for 14 years (1777–1791) before joining the U.S. — the motto was adopted during that republic period."
      - "Vermont's 'Freedom and Unity' directly inspired Daniel Webster's 'Liberty and Union' — which became North Dakota's state motto."
      - "Ira Allen designed the seal in 1778 at age 27; Vermont was only a year old."
      - "Vermont's constitution (1777) was the first in the world to explicitly ban slavery and grant universal male suffrage."
      - "Governor Thomas Chittenden's epitaph quotes the motto."
      - "In 2015, Vermont added a second ceremonial Latin motto proposed by a high school student: 'Stella quarta decima fulgeat' (May the fourteenth star shine bright)."

faq:
  - question: "What is Vermont's state motto?"
    answer: "Vermont's state motto is 'Freedom and Unity,' adopted on February 20, 1779. Uniquely, this was adopted while Vermont was still an independent republic — twelve years before Vermont joined the United States as the 14th state in 1791."

  - question: "Who designed Vermont's motto?"
    answer: "Ira Allen, younger brother of Ethan Allen and a member of the Vermont Legislature, designed the Great Seal and motto in 1778 at age 27. Reuben Dean of Windsor carved the physical seal. The General Assembly accepted the design by resolution on February 20, 1779."

  - question: "Did Vermont's motto influence any other state?"
    answer: "Yes — directly. Vermont's 'Freedom and Unity' inspired Daniel Webster's 'Liberty and Union, now and forever, one and inseparable,' which he delivered in the Senate on January 26-27, 1830 in what is called the most famous Senate speech in history. That phrase became North Dakota's state motto in 1889."

  - question: "When did Vermont officially adopt its motto?"
    answer: "February 20, 1779, when the Vermont General Assembly accepted Ira Allen's seal design. Vermont was then an independent republic. When Vermont became the 14th U.S. state on March 4, 1791, the legislature readopted the same motto for the state seal."

  - question: "Does Vermont have more than one official motto?"
    answer: "Yes. 'Freedom and Unity' is the primary official motto, adopted in 1779. In 2015, Vermont added a second ceremonial motto: 'Stella quarta decima fulgeat' (Latin: 'May the fourteenth star shine bright'), proposed by high school student Angela Kubicke — a reference to Vermont being the 14th state."

  - question: "Where does Vermont's motto appear?"
    answer: "On a scroll beneath the shield on the Great Seal and state flag. The seal shows a pine tree with fourteen branches, sheaves of wheat, a cow, and mountains. The motto is also displayed above entrances at the Vermont Supreme Court and above the rostrum in Representatives Hall at the State House in Montpelier."

