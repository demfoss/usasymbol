sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Vermont?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Vermont's official state butterfly. The Vermont General Assembly designated it in 1987."
  - "Monarchs breed in Vermont each summer rather than only passing through, and they are a separate symbol from the European honey bee, Vermont's official state insect."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches, one of the larger butterflies seen in Vermont."
  - "Monarch caterpillars feed only on milkweed and take on its toxins, which make both the caterpillar and adult butterfly poisonous to predators. Their bold orange and black coloring works as a warning."

- id: history
  icon: fa-solid fa-landmark
  title: How Vermont Chose the Monarch Butterfly
  paragraphs:
  - "The idea for a state butterfly came from Cornwall Elementary School in Middlebury, where a fifth-grade class taught by Paul Kaplan proposed naming the monarch as an official Vermont symbol."
  - "The Vermont General Assembly took up the students' proposal and made the monarch butterfly the official state butterfly in 1987."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Vermont
  paragraphs:
  - "Monarchs breed in Vermont over the summer, with adults and caterpillars most commonly seen in fields and gardens wherever milkweed grows. Sightings peak in late summer and early autumn as monarchs gather before their migration south."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted: 1987, by the Vermont General Assembly."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: about 3.5 to 4 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Proposed by a fifth-grade class at Cornwall Elementary School in Middlebury, taught by Paul Kaplan."
  - "Monarch caterpillars eat only milkweed, which makes them and the adult butterflies poisonous to predators."




