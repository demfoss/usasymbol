faq:
- question: What is Vermont's state butterfly?
  answer: "Vermont's state butterfly is the monarch butterfly, adopted by the Vermont General Assembly in 1987."
- question: When did Vermont adopt the monarch butterfly?
  answer: "Vermont adopted the monarch butterfly as its official state butterfly in 1987."
- question: Why did Vermont choose the monarch butterfly?
  answer: "A fifth-grade class at Cornwall Elementary School in Middlebury, taught by Paul Kaplan, proposed the monarch as a state symbol, and the Vermont General Assembly made it official in 1987."
- question: What does Vermont's state butterfly look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in Vermont?
  answer: "Monarchs breed in Vermont over the summer, appearing in fields and gardens with milkweed, and are most commonly seen in late summer and early autumn."
- question: Who helped choose Vermont's state butterfly?
  answer: "A fifth-grade class at Cornwall Elementary School in Middlebury, taught by Paul Kaplan, first proposed the monarch as Vermont's state butterfly."
- question: Does Vermont have a separate state insect?
  answer: "Yes. Vermont's state insect is the [European honey bee](/states/vermont/insect/european-honey-bee), adopted in 1978, separate from the monarch's designation as state butterfly."

