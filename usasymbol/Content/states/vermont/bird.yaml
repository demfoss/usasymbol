title: Hermit Thrush
scientific_name: Catharus guttatus
adopted_year: 1941
legislation: 1 V.S.A. Sec. 497
meaning: "Vermont's bird page makes the most sense as an argument about seasonal identity. The state did not choose a year-round resident. It chose the Hermit Thrush in 1941 even though the bird leaves for winter, because supporters treated its song and its summer presence across Vermont as more important than permanent residency. That gives the symbol a distinctive Vermont logic: the bird stands for the state's warm-season woods rather than for uninterrupted year-round presence."
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "Vermont State Bird | Hermit Thrush"
seo_description: "Vermont adopted the Hermit Thrush in 1941, favoring its song and summer presence over year-round residency."
intro_text: "Vermont's official state bird is the <strong>Hermit Thrush</strong>, adopted on <strong>June 1, 1941</strong> under <strong>1 V.S.A. Sec. 497</strong>. The bird does <strong>not</strong> stay in Vermont year-round — it arrives in spring, breeds across the state, and leaves before winter. That was the actual problem in the legislature: some lawmakers argued that a migratory bird could not honestly represent the state. The Hermit Thrush won anyway. Supporters said its song and its presence across all fourteen counties were the stronger argument. Vermont ended up choosing the bird of its forest season rather than the bird that stays."
