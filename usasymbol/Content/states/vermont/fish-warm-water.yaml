- id: facts
  icon: fa-solid fa-lightbulb
  title: Walleye Facts
  facts:
  - Adopted in 2012 by the Vermont Legislature.
  - Its scientific name is Sander vitreus.
  - State law calls it the walleye pike, but it belongs to the perch family.
  - Its large, light-sensitive eyes help it feed in dim water.
  - In Vermont, it is native only to Lake Champlain and its lower tributaries.
faq:
- question: What is Vermont's state fish?
  answer: Vermont has two state fish. The walleye is the state warm water fish, and the brook trout is the state cold water fish.
- question: When did Vermont adopt the Walleye?
  answer: Vermont lawmakers first recognized the walleye in 1978. The Vermont Legislature made it the official state warm water fish by law in 2012.
- question: Why did Vermont choose the Walleye?
  answer: Lawmakers called it a handsome, high-quality game fish that reflects Vermont's clean water. It stands for the state's warmer lakes and good fishing.
- question: Is the walleye native to Vermont?
  answer: Yes. It is native to Lake Champlain and the lower parts of rivers that flow into it. People have stocked it in other Vermont waters, such as Lake Carmi and the Connecticut River.
- question: Why is it called a walleye?
  answer: It gets its name from its large, glassy eyes. Those eyes are sensitive to light, so the fish often feeds in dim or deep water.
