intro_text: Vermont's state warm water fish is the walleye, a native game fish of Lake Champlain with big glassy eyes, adopted in 2012. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Warm Water Fish of Vermont?
  paragraphs:
  - The walleye is Vermont's official state warm water fish. State law made it official in 2012 and calls it the walleye pike. Its scientific name is Sander vitreus.
  - Vermont also has a state cold water fish, which is the brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Walleye
  paragraphs:
  - The walleye is a freshwater fish in the perch family. Its body is long and mostly olive and gold.
  - Its large, glassy eyes stand out the most and gave the fish its name. Its eyes are sensitive to light, so walleyes often stay in deep, dark water during the day and move into shallow water at night.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Warm Water Fish
  paragraphs:
  - Vermont lawmakers first recognized the walleye and the brook trout as state fish in 1978. In 2012, the Vermont Legislature passed a law that made both fish official state symbols.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Vermont Chose the Walleye
  paragraphs:
  - Lawmakers called the walleye and brook trout high-quality, handsome game fish that reflect Vermont's reputation for clean water.
  - They chose two fish to stand for two kinds of water. The brook trout stands for icy mountain streams, and the walleye stands for the state's warmer lakes and the good fishing found there.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Walleye
  paragraphs:
  - In Vermont, walleyes are native only to Lake Champlain and the lower parts of some rivers that flow into it. Each spring, they spawn in rivers such as the Missisquoi, Winooski, Lamoille, and Poultney.
  - People have also introduced walleyes into other waters, including the Connecticut River, Chittenden Reservoir, Lake Carmi, Island Pond, and Salem Lake.
