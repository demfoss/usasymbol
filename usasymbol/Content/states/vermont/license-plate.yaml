sections:
- id: see-vermont
  icon: fa-solid fa-eye
  title: The SEE Vermont Era
  paragraphs:
  - Vermont began using "SEE" with the state name in 1957, creating the short tourism phrase "SEE VERMONT." The slogan appeared on the 1957-1966 annual plates.
  - The run was interrupted in 1967 and 1968. Vermont DMV history explains that the word "See" was omitted on the 1967 plates because DMV wanted space for possible revalidation stickers as the state moved toward multi-year plates.
  - '"SEE" returned on the 1969-1971 base and continued on the 1972-1976 base. So the accurate range is 1957-1966 and 1969-1976, not one uninterrupted 1957-1976 stretch.'

- id: green-mountain-state
  icon: fa-solid fa-mountain
  title: What "Green Mountain State" Means
  paragraphs:
  - '"Green Mountain State" is Vermont''s official nickname and the phrase used on the state''s current standard plate. It points to the Green Mountains that run through Vermont and to the French roots usually associated with the state name: vert mont, or green mountain.'
  - The slogan first appeared on Vermont passenger plates in 1985, along with a redesigned green plate that added a white sugar maple graphic near the top left. The current standard plate still uses "Green Mountain State," although the passenger serial format changed to ABC 123 on January 1, 1990.
  - Vermont's plate slogan is landscape-based rather than motto-based. The state motto is "Freedom and Unity," but the license plate uses the nickname that most directly matches Vermont's mountain identity.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Vermont License Plate Slogans by Era
  paragraphs:
  - Vermont's standard passenger slogan history is compact, but the sequence matters because two older summaries often compress it too far.
