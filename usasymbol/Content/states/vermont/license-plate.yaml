intro_text: '**"Green Mountain State"** is Vermont''s current standard license plate slogan. It first appeared on the 1985 passenger base and remains the state''s plate identity today. Earlier plates used **"SEE VERMONT"** and **"GREEN MOUNTAINS,"** though both ran with interruptions rather than as one simple continuous streak. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: '"Green Mountain State" is Vermont''s current license plate slogan. It began on the 1985 base and continues on the current standard plate, whose ABC 123 format started January 1, 1990. Earlier standard slogans were "GREEN MOUNTAINS" in 1948-1950, "SEE VERMONT" in 1957-1966 and 1969-1976, and "GREEN MOUNTAINS" again on the 1977-1984 base.'
