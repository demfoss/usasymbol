seo_title: 'Vermont License Plate Slogan: Green Mountain State, SEE & Green Mountains'
seo_description: Vermont's current license plate slogan is "Green Mountain State." Learn the corrected history from Green Mountains in 1948-1950, SEE Vermont in 1957-1966 and 1969-1976, Green Mountains in 1977-1984, and the 1985 modern slogan.
hero_image: /images/license-plates/vermont/1985-green-mountain-state.png
hero_image_alt: Vermont license plate with Green Mountain State slogan
hero_image_caption: Vermont introduced "Green Mountain State" on the 1985 base. The current standard plate keeps that slogan, with a later serial-format update beginning January 1, 1990.
intro_text: '**"Green Mountain State"** is Vermont''s current standard license plate slogan. It first appeared on the 1985 passenger base and remains the state''s plate identity today. Vermont''s earlier slogan history needs two careful corrections: **"SEE"** did not run continuously from 1957 to 1976 because 1967-1968 plates had no slogan, and **"GREEN MOUNTAINS"** returned for the 1977-1984 base, not just for a single year.'
quick_answer: '"Green Mountain State" is Vermont''s current license plate slogan. It began on the 1985 base and continues on the current standard plate, whose ABC 123 format started January 1, 1990. Earlier standard slogans were "GREEN MOUNTAINS" in 1948-1950, "SEE VERMONT" in 1957-1966 and 1969-1976, and "GREEN MOUNTAINS" again on the 1977-1984 base.'
