sections:
- id: green-mountain-state
  icon: fa-solid fa-mountain
  title: What "Green Mountain State" Means
  paragraphs:
  - '"Green Mountain State" is Vermont''s official nickname and the phrase used on the state''s current standard plate. It points to the Green Mountains that run through Vermont and to the French roots usually associated with the state name: vert mont, or green mountain.'
  - The slogan first appeared on Vermont passenger plates in 1985, along with a redesigned green plate that added a white sugar maple graphic near the top left. The current standard plate still uses "Green Mountain State," although the passenger serial format changed to ABC 123 on January 1, 1990.
  - Vermont's plate slogan is landscape-based rather than motto-based. The state motto is "Freedom and Unity," but the license plate uses the nickname that most directly matches Vermont's mountain identity.

- id: see-vermont
  icon: fa-solid fa-eye
  title: The SEE Vermont Era
  paragraphs:
  - Vermont began using "SEE" with the state name in 1957, creating the short tourism phrase "SEE VERMONT." The slogan appeared on the 1957-1966 annual plates.
  - The run was interrupted in 1967 and 1968. Vermont DMV history explains that the word "See" was omitted on the 1967 plates because DMV wanted space for possible revalidation stickers as the state moved toward multi-year plates.
  - '"SEE" returned on the 1969-1971 base and continued on the 1972-1976 base. So the accurate range is 1957-1966 and 1969-1976, not one uninterrupted 1957-1976 stretch.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Vermont License Plate Slogans by Era
  paragraphs:
  - Vermont's standard passenger slogan history is compact, but the sequence matters because two older summaries often compress it too far.
  versions:
  - name: GREEN MOUNTAINS
    years: 1948-1950
    image: /images/license-plates/vermont/1948-green-mountains.jpg
    description: Vermont's first plate slogan. The state DMV history says "Green Mountains" first appeared in 1948 and was used through 1950.
  - name: SEE VERMONT
    years: 1957-1966
    image: /images/license-plates/vermont/1957-see-vermont.jpg
    description: '"SEE" appeared next to the state name, producing "SEE VERMONT." The 1957 plate was Vermont''s first 6-by-12-inch standard-size plate.'
  - name: SEE VERMONT
    years: 1969-1976
    image: /images/license-plates/vermont/1969-see-vermont.jpg
    description: '"SEE" returned on the 1969-1971 base and continued on the 1972-1976 base, with the state name and slogan moved to the top on the later version.'
  - name: GREEN MOUNTAINS
    years: 1977-1984
    image: /images/license-plates/vermont/1977-green-mountains.png
    description: The original landscape slogan returned on a new green base and was revalidated until 1989. This was a full base period, not a one-year callback.
  - name: Green Mountain State
    years: 1985-present
    image: /images/license-plates/vermont/1985-green-mountain-state.png
    description: Vermont introduced the modern slogan in 1985. The current standard plate format began January 1, 1990, but it retained "Green Mountain State."

- id: corrected-dates
  icon: fa-solid fa-clock-rotate-left
  title: Date Corrections
  paragraphs:
  - The safest way to state the SEE era is "1957-1966 and 1969-1976." Saying "1957-1976" is only shorthand and hides the 1967-1968 no-slogan plate.
  - The 1977 Green Mountains return should be listed as 1977-1984, with plates revalidated until 1989. It was not merely a single-year slogan.
  - The current slogan began in 1985, while the current passenger serial format began January 1, 1990. Those are related but not identical milestones.

timeline:
- year: '1948'
  description: Vermont adds its first standard plate slogan, "GREEN MOUNTAINS."
- year: '1950'
  description: The first "GREEN MOUNTAINS" run ends after the 1950 plate year.
- year: '1957'
  description: '"SEE" appears beside the state name, creating "SEE VERMONT" on the first 6-by-12-inch Vermont plate.'
- year: '1967'
  description: Vermont omits "SEE" as it moves to a debossed plate and prepares for sticker revalidation.
- year: '1969'
  description: '"SEE VERMONT" returns on the 1969-1971 base.'
- year: '1972'
  description: Vermont keeps "SEE" on the 1972-1976 base, moving the state name and slogan to the top.
- year: '1977'
  description: '"GREEN MOUNTAINS" returns on the 1977-1984 base, later revalidated until 1989.'
- year: '1985'
  description: Vermont introduces "Green Mountain State" on a redesigned plate with a sugar maple graphic.
- year: '1990'
  description: The current ABC 123 passenger format begins on January 1 while retaining "Green Mountain State."

faq:
- question: What is Vermont's license plate slogan?
  answer: Vermont's current standard license plate slogan is "Green Mountain State." It first appeared in 1985 and remains on the current standard plate.
- question: Did Vermont use SEE from 1957 to 1976?
  answer: Not continuously. Vermont used "SEE VERMONT" from 1957 to 1966, omitted the slogan in 1967-1968, and used "SEE VERMONT" again from 1969 to 1976.
- question: When did Vermont first use Green Mountains on plates?
  answer: Vermont first used "GREEN MOUNTAINS" in 1948 and kept it through 1950.
- question: Was Green Mountains only used again in 1977?
  answer: No. "GREEN MOUNTAINS" returned on the 1977-1984 standard base, which was revalidated until 1989.
- question: When did Green Mountain State start on Vermont plates?
  answer: Vermont introduced "Green Mountain State" on the 1985 base. The current ABC 123 standard plate format began January 1, 1990, with the same slogan.
- question: What does Green Mountain State mean?
  answer: It is Vermont's official nickname and refers to the Green Mountains, the range that defines much of the state's geography and gives Vermont its name identity.

