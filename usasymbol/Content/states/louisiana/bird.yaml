sections:
- id: symbol-before-statute
  icon: fa-solid fa-scroll
  title: The Bird Law Came After the Pelican Symbol
  paragraphs:
  - R.S. 49:159 is more revealing than most state-bird statutes. It does not read like a fresh pick from a bird list. It says the official bird shall be the Brown Pelican as it presently appears on the seal of the state of Louisiana.
  - That wording reverses the usual order of a state-symbol page. In Louisiana, the pelican was already carrying public meaning. The bird law came later.
  - By the time lawmakers acted in 1966, the pelican had long been part of Louisiana's official visual identity through the seal and the [state flag](/states/louisiana/flag/louisiana-state-flag). The statute ratified an existing emblem instead of creating a new one.
- id: why-the-pelican-carried-weight
  icon: fa-solid fa-heart
  title: Why the Pelican Already Carried State Meaning
  paragraphs:
  - Louisiana did not use a neutral bird image. On the seal, state law describes a pelican tearing at her breast to feed her young. That is the visual center of the symbol.
  - Because of that image, the pelican came to represent care, sacrifice, and protection long before 1966. The bird worked not just as wildlife but as a political and moral emblem.
  - Louisiana has carried the Pelican State nickname since the nineteenth century, well before any formal bird statute. The 1966 law was one stage in a symbolic career that began with the seal, moved into the flag, gave the state its nickname, and only then arrived at a bird designation.
- id: official-after-absence
  icon: fa-solid fa-landmark
  title: Louisiana Made It Official After the Bird Had Vanished
  paragraphs:
  - Louisiana Department of Wildlife and Fisheries says brown pelicans ceased nesting in Louisiana in 1961 and had virtually disappeared from the state by 1963 because of DDT-driven collapse.
  - That makes the 1966 designation stranger and more deliberate than a routine wildlife tribute. Louisiana officially embraced the bird at the moment when the living species had just collapsed inside the state.
  - Restoration began in 1968, with pelicans relocated from Florida to coastal Louisiana, including Queen Bess Island. Read in that order, the bird law looks less like a celebration of abundance than a refusal to let Louisiana's oldest bird symbol disappear.
faq:
- question: What is Louisiana's official state bird?
  answer: Louisiana's official state bird is the Brown Pelican.
- question: Why is Louisiana's bird law unusual?
  answer: Because R.S. 49:159 did not create a brand-new emblem. It made official the Brown Pelican as it already appeared on the state seal, which means the symbol existed before the bird statute.
- question: Why was the 1966 timing so unusual?
  answer: Louisiana made the Brown Pelican its official bird after pelicans had virtually disappeared from the state by 1963. The designation came during absence, not abundance.
- question: Why does the pelican appear on Louisiana's flag and seal?
  answer: Louisiana had already adopted the pelican as a symbol of care, sacrifice, and protection. The bird law came later and formalized an emblem that was already central to the seal and flag.
- question: How did Louisiana get brown pelicans back?
  answer: Restoration began in 1968, when pelicans were relocated from Florida to coastal Louisiana, including Queen Bess Island. The recovery later turned the symbolic bird back into a living Louisiana presence.
- question: Is the Brown Pelican exclusive to Louisiana as a state bird?
  answer: Yes. No other U.S. state uses the Brown Pelican as its official state bird. Despite the species ranging along the Gulf and Atlantic coasts, Louisiana is the only state to have designated it.
