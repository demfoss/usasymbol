title: Brown Pelican
scientific_name: Pelecanus occidentalis
adopted_year: 1966
legislation: R.S. 49:159
meaning: Louisiana's bird law formalized an emblem the state had been using long before 1966. The Brown Pelican was already central to the seal and flag, so the designation ratified an older symbol at the very moment the living bird had just disappeared from Louisiana's coast.
author: USA Symbol Team
date_published: '2025-11-29'
date_modified: "2026-05-02"
seo_title: "Louisiana State Bird | Brown Pelican"
seo_description: "Louisiana made the Brown Pelican its state bird in 1966, just after the species had disappeared locally."
intro_text: Louisiana's official state bird is the <strong>Brown Pelican</strong>, made official in <strong>1966</strong> under <strong>R.S. 49:159</strong>. The unusual part is that the statute describes the bird <strong>as it presently appears on the seal of the state of Louisiana</strong>. In other words, Louisiana was not inventing a new symbol. It was formalizing a pelican emblem already embedded in the seal and flag, even though brown pelicans had virtually disappeared from Louisiana by 1963.
