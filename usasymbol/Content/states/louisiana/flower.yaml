seo_title: "Louisiana State Flower | Magnolia"
seo_description: "Louisiana's state flower is the magnolia, adopted July 12, 1900. The blooms reach 12 inches across with a lemony fragrance — and unlike most flowers, magnolias are still pollinated by beetles, as they were 95 million years ago."

intro_text: "The magnolia is Louisiana's official state flower, adopted on July 12, 1900. The blooms can reach 12 inches across with a sweet lemony fragrance, opening on evergreen trees that stay green through Louisiana's mild winters. What makes the magnolia unlike most state flowers: it is one of the oldest flowering tree lineages on Earth, evolving before bees existed — magnolias are still pollinated by beetles today, just as they were 95 million years ago. The flower also appears on Louisiana's 2002 state quarter. Explore all of Louisiana's symbols on the [Louisiana state hub](/states/louisiana), or compare floral emblems on the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Louisiana State Flower?"
    paragraphs:
      - "Louisiana officially recognizes the Magnolia as its state flower. Each blossom displays thick creamy white petals arranged in a cup shape. The flowers measure 8 to 12 inches across when fully open. A sweet lemony fragrance fills the air around blooming trees. The petals have a waxy texture that resists wilting."
      - "Magnolia trees bloom from May through June across Louisiana. Some trees produce scattered flowers into summer. Individual blooms last only two to three days before browning. New buds open continuously throughout the blooming period. The evergreen trees grow 60 to 80 feet tall. Glossy dark green leaves with rusty brown undersides cover the branches year-round."
      - "Native magnolia trees grow wild in Louisiana forests and swamps. The trees prefer moist acidic soil. Partial shade to full sun suits magnolias well. Young trees need protection from harsh sun. Mature trees tolerate various conditions. Louisiana landscapes feature magnolias in parks, gardens, and along historic avenues throughout the state."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Louisiana State Flower Name"
    paragraphs:
      - "Known as Magnolia, this flower's scientific designation is Magnolia grandiflora. The species belongs to the Magnoliaceae family. This ancient plant family dates back over 95 million years based on fossil evidence. About 210 magnolia species exist worldwide."
      - "The genus name Magnolia honors French botanist Pierre Magnol who lived in the 1600s. The species name grandiflora means large flower in Latin. The blooms rank among the largest of any native North American tree. Common names include Southern magnolia and bull bay magnolia."
      - "Magnolia trees existed before bees evolved. Beetles pollinate the flowers today just as they did millions of years ago. The thick petals protect reproductive parts from beetle damage. This primitive pollination system predates most modern flowering plants. Magnolias represent one of Earth's oldest flowering tree lineages."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Louisiana Chose the Magnolia"
    paragraphs:
      - "Louisiana lawmakers designated the Magnolia as the official state flower in 1900. The state legislature made this choice without organizing a public vote. Magnolia trees already symbolized Louisiana in popular culture. The spectacular flowers and stately trees represented Southern elegance and heritage while complementing themes in the [Louisiana state motto](/states/louisiana/motto/union-justice-and-confidence)."
      - "Louisiana residents strongly identified with magnolia trees. The evergreen trees thrived in Louisiana's humid climate. Grand magnolias shaded plantation homes and city streets. Artists featured magnolias in paintings of Louisiana scenes. Writers described magnolia fragrance in stories about the South."
      - "No competing flowers challenged the magnolia selection. The decision seemed natural to legislators. Some debate occurred over specifying the flower versus the tree. The 1900 resolution named the magnolia flower specifically. Later interpretations included the entire tree as Louisiana's symbol. The designation became official on July 12, 1900."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Louisiana State Flower Facts"
    facts:
      - "Magnolia trees can live for over 100 years, with some Louisiana specimens planted in the 1800s still thriving today"
      - "The flowers attract beetles as pollinators rather than bees, using a primitive pollination system that evolved before bees existed on Earth"
      - "Louisiana adopted the Magnolia on July 12, 1900, during a period when Southern states were establishing official symbols"
      - "Magnolia leaves remain on the tree for two years before falling, with the rusty brown undersides often used in floral arrangements"
      - "Each magnolia flower contains both male and female parts that mature at different times to prevent self-pollination"
      - "The magnolia appears on Louisiana's state quarter released in 2002 as part of the 50 State Quarters Program"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Louisiana State Flower and Bird"
    paragraphs:
      - "The Brown Pelican serves as Louisiana's state bird, a large coastal waterbird common along Louisiana's Gulf Coast. Both symbols represent Louisiana officially. Louisiana adopted the Magnolia in 1900 and designated the Brown Pelican as state bird in 1966; see the [Louisiana state bird page](/states/louisiana/bird/brown-pelican)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Magnolia Symbolizes"
    paragraphs:
      - "The Magnolia is commonly seen as representing Southern grace, dignity, and hospitality. The flower traditionally symbolizes nobility and perseverance due to its ancient lineage. Its large white blooms frequently represent purity and beauty while carrying connotations of Louisiana's cultural heritage and historic plantation landscapes, including identity terms such as [the Pelican State nickname](/states/louisiana/nickname/the-pelican-state)."

faq:
  - question: "What is Louisiana's state flower?"
    answer: "Louisiana's state flower is the magnolia, a large fragrant white flower that blooms on evergreen magnolia trees throughout the state. It was adopted on July 12, 1900."

  - question: "What does the Louisiana magnolia flower look like?"
    answer: "Magnolia flowers display thick, creamy white petals in a cup shape, measuring 8 to 12 inches across when fully open — among the largest blooms of any native North American tree. A sweet lemony fragrance surrounds the tree. The petals have a waxy texture that slows wilting, and individual flowers last two to three days before browning. The trees feature large, glossy dark green leaves with rusty-brown undersides."

  - question: "Does the magnolia appear on any Louisiana symbols?"
    answer: "Yes. The magnolia appears on Louisiana's state quarter, released in 2002 as part of the U.S. 50 State Quarters Program. The coin also features a pelican and a trumpet, but the magnolia image anchors the floral identity of the state."
  
  - question: "When did Louisiana adopt the Magnolia as its state flower?"
    answer: "Louisiana adopted the Magnolia on July 12, 1900. The state legislature made this designation without organizing a public vote."
  
  - question: "Why did Louisiana choose the Magnolia?"
    answer: "Louisiana chose the Magnolia because the trees thrived in the state's humid climate and already symbolized Louisiana in popular culture. The spectacular flowers and stately evergreen trees represented Southern elegance and heritage. No other flower received serious consideration during the selection process."
  
  - question: "Is the magnolia native to Louisiana?"
    answer: "Yes, the magnolia is native to Louisiana and grows wild in forests and swamps throughout the state. The trees prefer moist acidic soil and can live for over 100 years."
  
  - question: "When do magnolia trees bloom in Louisiana?"
    answer: "Magnolia trees bloom from May through June in Louisiana, with some trees producing scattered flowers into summer. Individual blooms last only two to three days, but new buds open continuously throughout the blooming period."

