seo_title: 'Louisiana State Drink: Why It''s Milk, Not the Sazerac'
seo_description: Louisiana's official state drink is milk, designated in 1983 to honor the state's dairy industry — not the Sazerac, Hurricane, or any New Orleans cocktail. Here's what the designation actually means.
intro_text: Louisiana's official state drink is <strong>milk</strong>, designated in <strong>1983</strong> as a tribute to the state's dairy industry. In a state that gave American cocktail culture the Sazerac, the Hurricane, and café au lait, that choice has surprised people ever since — the officially designated state drink is the one you pour for a child.
