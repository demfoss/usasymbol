intro_text: "Louisiana's state gemstone, adopted in 2011, is a cabochon gemstone cut from the shell of the eastern oyster, popularly known as LaPearlite and tied directly to the state's coastal oyster industry. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Louisiana State Gemstone
    paragraphs:
      - "Louisiana's state gemstone, designated by the Louisiana Legislature in 2011, is a cabochon cut and polished from the shell of the eastern oyster, Crassostrea virginica. The material is widely known by the popular name LaPearlite, though the law itself describes it by material rather than by that name."
      - "The designation replaced agate, which had been Louisiana's state gemstone since 1976 and moved to the state mineral title the same year."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is LaPearlite?"
    paragraphs:
      - "LaPearlite is cut from the inner shell layers of the eastern oyster, a mollusk built largely from calcium carbonate. Polished cabochons show a soft, pearly sheen in cream, gray, and purple tones, drawn out of shell material usually discarded as waste."
      - "Unlike a mined mineral, it is a biogenic material, meaning it forms inside a living organism rather than in rock. Louisiana jeweler Anne Dale developed the cutting and polishing technique that turns oyster shell into finished cabochons."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Louisiana Chose LaPearlite as Its State Gemstone"
    paragraphs:
      - "Louisiana produces more oysters than almost any other state, and its coastal parishes have built a working economy around the eastern oyster for generations. A gemstone made from oyster shell gave the state a symbol tied directly to that industry rather than to an imported or generic gem material."
      - "Anne Dale, a Louisiana jeweler, pioneered the cabochon-cutting process that made oyster shell usable as a polished gem, and her work helped drive the 2011 push to designate it the official state gemstone."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How LaPearlite Became Louisiana's State Gemstone"
    paragraphs:
      - "Louisiana lawmakers passed the bill creating the new gemstone designation in 2011, and Governor Bobby Jindal signed it into law that August. The bill's sponsor had originally intended to name the material LaPearlite in the statute, but dropped the name because it was already trademarked, so the law instead describes the gemstone by its material: a cabochon cut gemstone derived from the Crassostrea virginica mollusk."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "LaPearlite Facts"
    facts:
      - "Adopted as Louisiana's state gemstone in 2011, replacing agate, which moved to the state mineral title the same year."
      - "The gemstone is cut from the shell of the eastern oyster, Crassostrea virginica, Louisiana's most commercially important shellfish."
      - "Because the name LaPearlite was already trademarked, the actual statute describes the gemstone by its material rather than by that popular name."
      - "Louisiana jeweler Anne Dale developed the cabochon-cutting technique that turns oyster shell into a polished gem."

