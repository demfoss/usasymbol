faq:
  - question: What is Louisiana's state gemstone?
    answer: "Louisiana's state gemstone is a cabochon cut gemstone made from the shell of the eastern oyster, popularly known as LaPearlite, adopted in 2011."
  - question: When did Louisiana adopt LaPearlite as its state gemstone?
    answer: "The Louisiana Legislature created the designation in 2011, and Governor Bobby Jindal signed it into law that August."
  - question: Why did Louisiana choose LaPearlite?
    answer: "Louisiana is one of the country's leading oyster producers, and a gemstone cut from oyster shell gave the state a symbol tied directly to its coastal oyster industry."
  - question: Is LaPearlite the material's official legal name?
    answer: "No. The statute describes the gemstone as a cabochon cut from Crassostrea virginica oyster shell rather than using the name LaPearlite, because that name was already trademarked."

