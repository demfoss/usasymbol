name_meaning:
  heading: What Does Louisiana Mean?
  paragraphs:
  - Louisiana is the 18th U.S. state, admitted to the Union on April 30, 1812. The name comes from La Louisiane, the French colonial name honoring King Louis XIV of France.
  - The Pelican State nickname is older in public identity than the 1966 state-bird law. The pelican appeared on the seal from statehood and later became the official bird after already carrying the flag and seal.
  - Louisiana's postal abbreviation is LA, and residents are Louisianans. Its state motto, Union, Justice and Confidence, began with the first state seal and later settled into its modern word order after the Civil War period.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From French La Louisiane, named for King Louis XIV.
    - label: Statehood
      text: Louisiana became the 18th state on April 30, 1812.
    - label: Nickname
      text: The Pelican State comes from the pelican emblem on the state seal and flag.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Louisiana, a Gulf Coast state shaped by wetlands, the Mississippi River, New Orleans, and French, Spanish, Creole, and American layers.
    - label: People
      text: People from Louisiana are commonly called Louisianans.
    - label: Colonial name
      text: La Louisiane named a much larger French colonial territory before it named the modern state.
  - heading: Nicknames and Short Forms
    items:
    - label: Pelican State
      text: Official nickname tied to the brown pelican and the state seal.
    - label: Bayou State
      text: Informal nickname from Louisiana's bayous and wetlands.
    - label: Creole State
      text: Cultural nickname connected with Louisiana's colonial and Creole heritage.
    - label: Abbreviation
      text: LA; older short form La.
editorial:
  heading: What Louisiana's Symbols Say About the State
  paragraphs:
  - Louisiana's [brown pelican](/states/louisiana/bird) is not just another bird symbol. The state made it official after the pelican had already lived for generations on the seal and flag, even as the real bird had nearly disappeared from the coast.
  - The [bald cypress](/states/louisiana/tree), [magnolia](/states/louisiana/flower), and [Louisiana black bear](/states/louisiana/mammal/black-bear) keep the symbol set rooted in wetlands, bottomland forests, and Gulf Coast conservation rather than generic Southern scenery.
  - The [Catahoula Leopard Dog](/states/louisiana/dog) gives Louisiana a working-breed symbol with a specific homegrown identity, while [milk](/states/louisiana/beverage/milk) is the deliberately plain official drink in a state better known for cocktails and cafe culture.
faq:
- question: Does Louisiana get snow?
  answer: Almost never. Louisiana averages fewer than 1 snow day per year, ranking among the [states with the least snow in the U.S.](/rankings/geography/states-with-no-snow).
- question: What is Louisiana's most famous state symbol?
  answer: The [brown pelican](/states/louisiana/bird) is Louisiana's most famous symbol because it appears in the state nickname, seal, flag, and bird law.
- question: What is Louisiana's state bird?
  answer: Louisiana's state bird is the [brown pelican](/states/louisiana/bird), made official in 1966.
- question: What is Louisiana's state flower?
  answer: Louisiana's state flower is the [magnolia](/states/louisiana/flower), adopted in 1900.
- question: Why is Louisiana called the Pelican State?
  answer: Louisiana is called the Pelican State because the pelican has appeared on the state seal since statehood and remains central to the flag and official bird symbolism. The [Louisiana nickname](/states/louisiana/nickname) page explains the history.
- question: How many official state symbols does Louisiana have?
  answer: Louisiana's state symbols list here includes the flag, brown pelican, magnolia, bald cypress, motto, colors, Catahoula dog, milk, and mammal symbols.
