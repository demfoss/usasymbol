seo_description: "Louisiana symbols include the brown pelican, magnolia, bald cypress, pelican flag, and Union, Justice and Confidence motto."
snippet_answer: The brown pelican is Louisiana's most recognizable official state symbol and appears on both the state flag and seal. The magnolia, bald cypress, Catahoula dog, and Union, Justice and Confidence motto complete a list shaped by Gulf Coast wetlands, French and Spanish colonial history, and pelican conservation.
