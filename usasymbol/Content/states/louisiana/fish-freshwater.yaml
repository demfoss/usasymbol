- id: facts
  icon: fa-solid fa-lightbulb
  title: White Crappie Facts
  facts:
  - Adopted in 1993 by the Louisiana Legislature.
  - Scientific name is Pomoxis annularis.
  - Called white perch in north Louisiana and sac-a-lait in south Louisiana.
  - Sac-a-lait means "sack of milk" in Cajun French.
  - Prefers moving water and does well in muddy, cloudy water.
faq:
- question: What is Louisiana's state fish?
  answer: Louisiana's state freshwater fish is the white crappie, which locals call the white perch or sac-a-lait. The state saltwater fish is the spotted seatrout.
- question: When did Louisiana adopt the White Crappie?
  answer: The Louisiana Legislature made the white crappie the official state freshwater fish in 1993.
- question: Why did Louisiana choose the White Crappie?
  answer: The law gives no reason. People in Louisiana value the fish for its mild, sweet meat, and it is a favorite catch across the state.
- question: Is Louisiana's white perch the same fish as the white crappie?
  answer: Yes. Louisiana's law says white perch, but it lists the scientific name of the white crappie. Another fish elsewhere in the country is also called white perch, but it is a different species.
- question: What does sac-a-lait mean?
  answer: Sac-a-lait is Cajun French for "sack of milk." The name comes from the fish's white, mild meat.
