hero_image_caption: The white crappie, called white perch or sac-a-lait in Louisiana, is the state freshwater fish.
intro_text: Louisiana's state freshwater fish is the white crappie, which the state calls the white perch or sac-a-lait. State lawmakers adopted it in 1993. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of Louisiana?
  paragraphs:
  - The white crappie has been the official state freshwater fish of Louisiana since 1993. Its scientific name is Pomoxis annularis.
  - State law calls it the white perch and also gives its Cajun French name, sac-a-lait. Louisiana also has a state saltwater fish, which is the spotted seatrout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the White Crappie
  paragraphs:
  - The white crappie is a silvery fish with faint dark bars running up and down its sides. Its body is tall and flat, and it has a large mouth.
  - It belongs to the sunfish family. A close cousin, the black crappie, also lives in Louisiana. The black crappie looks darker and has black spots scattered across its body instead of neat bars.
  - Its Cajun name, sac-a-lait, means "sack of milk." The name comes from the fish's white, mild meat.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The Louisiana Legislature made the white crappie the official state freshwater fish in 1993. The law also allows the fish to appear on official state documents and with the state insignia.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Louisiana Chose the White Crappie
  paragraphs:
  - The law does not explain why lawmakers chose this fish. Fishing experts in Louisiana say people value it highly for its mild, sweet meat, and it is a favorite catch in lakes and bayous across the state.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the White Crappie
  paragraphs:
  - White crappie live in lakes, rivers, and bayous all over Louisiana. They like moving water and are more common than black crappie in cloudy, muddy water.
  - They usually stay close to cover, such as sunken trees and brush. Some of the biggest white crappie on the state's record list came from Poverty Point Reservoir and Lake Martin.
