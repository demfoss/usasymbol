seo_title: "Louisiana State Nickname | The Pelican State"
seo_description: "Louisiana is known as The Pelican State, its official state nickname. Learn what Pelican State means, why Louisiana uses it, and what other nicknames the state has had."

intro_text: "Louisiana holds the official state nickname <i>The Pelican State</i>. This name appears on the state seal adopted in 1812 when Louisiana became the 18th state. The brown pelican nests along Louisiana's coast and lives in the wetlands that cover much of southern Louisiana, and readers can compare details on the [Louisiana state bird page](/states/louisiana/bird/brown-pelican). People started calling Louisiana the Pelican State because these large birds were so common in the region. The pelican also became Louisiana's official state bird in 1966."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Pelican State'"
    paragraphs:
      - "The Pelican State nickname points to the brown pelican that lives along Louisiana's Gulf Coast. The state seal from 1812 shows a pelican feeding three chicks in a nest. This image comes from an old legend about pelicans tearing their own chests to feed their young with blood during times when food runs short. The legend is not true, but people used it to show care and protection."
      - "Brown pelicans build nests on coastal islands and hunt fish in shallow waters. Louisiana's wetlands provide perfect habitat for these birds. The nickname became popular because pelicans were such a common sight in the state. Visitors to Louisiana in the 1800s wrote about seeing large flocks of pelicans near the mouth of the Mississippi River. Today the brown pelican appears on Louisiana's state flag, state seal, and many government documents."
      - "The brown pelican population dropped in the mid-1900s because of pesticide use. Louisiana removed the bird from the state emblem in 1966, then brought it back in 1970 after conservation efforts helped pelican numbers recover. The pelican remains a key part of Louisiana's identity and explains why people call it the Pelican State — one of the longest-running bird-based designations found across the [all 50 state nicknames explained](/symbols/nicknames) and closely aligned with language on the [Louisiana state motto page](/states/louisiana/motto/union-justice-and-confidence)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Boot"
        text: "Louisiana earned this nickname because the state's shape looks like a boot on a map. The northwestern parishes form the top of the boot, while the toe points east toward Mississippi — a state whose [Magnolia State history](/states/mississippi/nickname/the-magnolia-state) shares much of Louisiana's Gulf Coast heritage and Deep South identity. The heel sits along the Texas border. Children in Louisiana schools learn to recognize their state by its boot shape using maps similar to [states neighboring states](/rankings/geography/states-neighboring-states). This nickname became popular in the 20th century as more people looked at maps and noticed the resemblance. The Boot nickname is informal and does not appear on any official state documents, but Louisianans use it regularly when talking about their state."
      - subtitle: "Bayou State"
        text: "This name comes from the many slow-moving streams called bayous that flow through Louisiana. Bayou is a word borrowed from the Choctaw language. Louisiana contains more bayous than any other state. These waterways connect swamps, lakes, and rivers across southern Louisiana. People built homes along bayous and used them for transportation before roads were common. Bayou Teche, Bayou Lafourche, and Bayou Bartholomew are among the most well-known. The Bayou State nickname appeared in newspapers during the 1800s and remains in use today."
      - subtitle: "Creole State"
        text: "Louisiana gained this nickname from its Creole population and culture. Creole originally described people born in Louisiana during French and Spanish colonial rule. The term later included people of mixed European, African, and Native American heritage. Creole culture shaped Louisiana's food, music, and language. New Orleans developed as the center of Creole society, and this cultural identity also appears in symbols like the [Louisiana state flower](/states/louisiana/flower/magnolia). The Creole State nickname was common in the 1800s and early 1900s. Today people still recognize Louisiana's unique Creole heritage, though this nickname is less common than others."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The pelican appeared on Louisiana's first state seal in 1812, the same year Louisiana became a state."
      - "Louisiana's state motto is Union, Justice, Confidence, and it appears below the pelican on the state seal."
      - "Brown pelicans can hold up to three gallons of water in their throat pouch when catching fish."
      - "Louisiana removed the pelican from its seal between 1966 and 1970 because the bird population had dropped so low."
      - "The New Orleans Pelicans NBA team takes its name from Louisiana's state bird and nickname."
      - "Louisiana contains about 40 percent of the wetlands in the continental United States."

faq:
  - question: "What is Louisiana’s nickname?"
    answer: "Louisiana’s nickname is the Pelican State. The name comes from the brown pelican, a bird native to Louisiana’s coastal regions and wetlands."

  - question: "Why is Louisiana called the Pelican State?"
    answer: "Louisiana is called the Pelican State because the brown pelican has long been associated with the state. The bird appears on Louisiana’s state seal and was later designated as the official state bird."

  - question: "What is the origin of Louisiana’s nickname?"
    answer: "The origin of Louisiana’s nickname dates to the early 19th century when the pelican became a widely used state symbol. Images of a pelican feeding its young appeared on official seals and documents."

  - question: "What does the Pelican State nickname mean?"
    answer: "The Pelican State nickname reflects Louisiana’s strong connection to its coastal environment. The pelican symbolizes care, community, and the natural resources of the region."

  - question: "What does the Louisiana nickname The Boot mean?"
    answer: "The Boot is a popular nickname based on Louisiana’s shape on a map. The outline resembles a boot, with the toe pointing toward the Mississippi border."

  - question: "What is Louisiana’s nickname and motto?"
    answer: "Louisiana’s nickname is the Pelican State, and its state motto is Union, Justice, Confidence. Both appear together on Louisiana’s official state seal."

