sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Louisiana's State Fruit?"
    paragraphs:
      - "The Louisiana strawberry is Louisiana's official state fruit, designated by the Louisiana Legislature in 1980. Strawberry farming has a long history in Tangipahoa Parish, especially around Ponchatoula."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Louisiana Strawberry"
    paragraphs:
      - "Louisiana strawberries are small, deep red berries known for their sweetness, grown in the sandy soil of the state's southeastern parishes. They ripen earlier in the season than strawberries grown farther north, thanks to Louisiana's mild winters."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Louisiana Strawberry Became Louisiana's State Fruit"
    paragraphs:
      - "The Louisiana Legislature designated the Louisiana strawberry the official state fruit in 1980."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Louisiana Chose the Strawberry"
    paragraphs:
      - "Ponchatoula, in Tangipahoa Parish, became known as the Strawberry Capital of the World in the early 1900s, and the crop has remained central to the local economy and identity ever since."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Louisiana Strawberry Comes From in Louisiana"
    paragraphs:
      - "Ponchatoula, in Tangipahoa Parish, is the historic heart of Louisiana strawberry farming and hosts the annual Louisiana Strawberry Festival each April."
