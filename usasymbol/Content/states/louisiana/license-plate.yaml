faq:
- question: What is Louisiana's license plate slogan?
  answer: "Louisiana's license plate slogan is \"Sportsman's Paradise,\" reflecting the state's position as the largest wetland hunting and fishing territory in the continental U.S. Louisiana's coastal marshes, bayous, and river bottomlands produce access to migratory waterfowl, inshore saltwater fish, and freshwater game that draw sportsmen from across the country."
- question: "Why does Louisiana call itself a Sportsman's Paradise?"
  answer: "Louisiana has roughly 40 percent of the continental U.S.'s coastal wetlands, sits along the Mississippi Flyway for migratory waterfowl, and holds major freshwater and saltwater fisheries including the Atchafalaya Basin and Gulf Coast inshore waters. The state's hunting and fishing seasons, species diversity, and acreage of accessible public land produce conditions that most states cannot match."
- question: What is on the Louisiana license plate?
  answer: "As of 2026, Louisiana's standard plate is the temporary America 250 design, issued for the national semiquincentennial period, and it still carries the \"Sportsman's Paradise\" slogan. The earlier 2005-style standard base used a pelican graphic with the same slogan."
- question: Why is the pelican on Louisiana's license plate?
  answer: "The brown pelican has been on Louisiana's seal since statehood in 1812 and is the official state bird. It appears on the plate as part of the same design language that runs through the flag and seal. The pelican also carries a conservation narrative — the bird nearly disappeared from Louisiana's coast in the 1960s and recovered over the following decades, giving the image a meaning beyond heraldry. See the [Louisiana state bird page](/states/louisiana/bird)."
- question: What are Louisiana's wetlands, and why are they shrinking?
  answer: "Louisiana's wetlands are the product of Mississippi River sediment deposition over thousands of years. They are shrinking because the levee system built to control the river also stopped the sediment replenishment that built and maintained the marsh. Louisiana loses land to subsidence and sea-level rise at one of the highest rates in the world — a process the state is attempting to slow through large-scale coastal restoration and sediment diversion projects."

