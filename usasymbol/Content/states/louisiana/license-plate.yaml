seo_title: "Louisiana License Plate Slogans: Sportsman's Paradise, YAMS & Bayou State"
seo_description: "Louisiana's main license plate slogan is \"Sportsman's Paradise,\" but passenger plates have also used YAMS, Sportsmen's Paradise, Bayou State, World's Fair, Louisiana Purchase Bicentennial, and America 250 designs."
hero_image: /images/license-plates/louisiana/2025-america-250-sportsmans-paradise.jpg
hero_image_alt: Louisiana America 250 license plate with Sportsman's Paradise slogan
hero_image_caption: "Louisiana's 2025-2026 America 250 standard plate keeps the state's long-running \"Sportsman's Paradise\" slogan while temporarily replacing the pelican-centered base."
intro_text: "**\"Sportsman's Paradise\"** is Louisiana's main license plate slogan, but the plate history is more complicated than one phrase. Louisiana's first passenger-plate slogan was the unusual \"YAMS\" in 1954, a nod to sweet potato production. \"Sportsmen's Paradise\" appeared in 1958 and returned in the early 1960s, while the singular \"Sportsman's Paradise\" first appeared in 1959. Later plates used \"Bayou State,\" a 1983 World's Fair design, Louisiana Purchase and statehood bicentennial plates, a Battle of New Orleans bicentennial plate, and the current 2025-2026 America 250 standard plate."
quick_answer: "\"Sportsman's Paradise\" is Louisiana's main plate slogan, rooted in the state's wetland hunting and fishing identity. It first appeared in singular form in 1959 and returned as the durable standard identity after the Bayou State period. As of 2026, Louisiana's temporary America 250 standard plate still carries the Sportsman's Paradise slogan."
