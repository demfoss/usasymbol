- id: pelican-connection
  icon: fa-solid fa-rotate
  title: The Pelican and the Paradise
  paragraphs:
  - "Louisiana's plate carries two overlapping identities. The Sportsman's Paradise slogan is about access — what the landscape offers people who hunt and fish. The pelican emblem that often appears alongside it is about the landscape itself — what it sustains and what it has nearly lost. Both point at the same wetland system from different angles."
  - "The pelican's return to Louisiana's coast after near-extinction is the compressed version of the larger wetland story. The same ecosystem that produces the duck hunting and the inshore fishing also produced the pelican colonies that DDT-era pesticide runoff destroyed. Banning those pesticides and protecting the nesting islands brought the bird back. The state removed the Louisiana brown pelican from the endangered species list in 1995."
  - 'For context on how other states chose their plate slogans, see [U.S. license plate slogans by state](/license-plates).'

timeline:
