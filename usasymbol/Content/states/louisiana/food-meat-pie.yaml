sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Louisiana's State Meat Pie?"
    paragraphs:
      - "The Natchitoches meat pie is Louisiana's official state meat pie, designated by the Louisiana Legislature in 2003. It is a fried, half-moon shaped pastry filled with seasoned ground meat, named for the town where it originated."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Natchitoches Meat Pie"
    paragraphs:
      - "A Natchitoches meat pie is made by folding a thin pastry dough around a filling of seasoned ground beef and pork, then frying it until the crust turns golden and crisp. The filling typically includes onions, bell pepper, and Cajun seasoning, reflecting the blend of French, Spanish, and Creole influences found in the Natchitoches area."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Natchitoches Meat Pie Became Louisiana's State Meat Pie"
    paragraphs:
      - "The Louisiana Legislature designated the Natchitoches meat pie the official state meat pie in 2003."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Louisiana Chose the Natchitoches Meat Pie"
    paragraphs:
      - "Natchitoches, founded in 1714, is the oldest permanent settlement in the Louisiana Purchase territory, and its meat pie has been a local specialty for generations. The town holds an annual meat pie festival, and the dish is closely associated with Natchitoches's identity within the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Natchitoches Meat Pie Comes From in Louisiana"
    paragraphs:
      - "Natchitoches, in northwest Louisiana, is the historic home of the meat pie and hosts an annual festival celebrating the dish."
