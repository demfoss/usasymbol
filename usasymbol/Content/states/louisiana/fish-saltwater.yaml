intro_text: Louisiana's state saltwater fish is the spotted seatrout, a silvery, black-spotted fish of the coastal bays and marshes, adopted in 2001. Most people in Louisiana call it the speckled trout. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Louisiana?
  paragraphs:
  - The spotted seatrout became Louisiana's official state saltwater fish in 2001. State law names it the spotted sea trout, or speckled trout, and its scientific name is Cynoscion nebulosus.
  - Louisiana also has a state freshwater fish, the white crappie.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Spotted Seatrout
  paragraphs:
  - The spotted seatrout has a long, streamlined body. Its back is dark silvery gray or green, and it fades to white on the belly.
  - Black spots cover the upper sides of its body. The top fin and tail are always spotted, which makes the fish easy to recognize.
  - Its lower jaw sticks out past the upper jaw. The upper jaw often has one or two large, pointed teeth near the front.
  - Even with its name, it is not a real trout. It belongs to the drum family, a group of fish that can make croaking or drumming sounds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - The Louisiana Legislature passed a bill in 2001 that made the spotted seatrout the official state saltwater fish. The law took effect on August 15, 2001.
  - The law also allows the fish to appear on official state documents and with the state's insignia.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Louisiana Chose the Spotted Seatrout
  paragraphs:
  - Official sources name the spotted seatrout but do not give a detailed reason for choosing it.
  - It is a very popular fish in Louisiana, though. State biologists call it the number one saltwater fish that anglers in the state try to catch.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Spotted Seatrout
  paragraphs:
  - Spotted seatrout live along Louisiana's whole coast. They are found in inland bays and marshes and as far out as 30 feet deep in the Gulf.
  - Larger fish often move to saltier lower bays and the nearby Gulf in spring and summer. Smaller fish stay year-round in the upper parts of bays and marshes, such as Barataria Bay and Terrebonne Bay.
