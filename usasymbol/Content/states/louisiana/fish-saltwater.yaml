- id: facts
  icon: fa-solid fa-lightbulb
  title: Spotted Seatrout Facts
  facts:
  - Adopted in 2001 by the Louisiana Legislature.
  - Its scientific name is Cynoscion nebulosus.
  - Most people in Louisiana call it the speckled trout or just the speck.
  - Young fish grow to about 8 inches by age one and over 12 inches by age two.
  - Almost all spotted seatrout that weigh 5 pounds or more are females.
faq:
- question: What is Louisiana's state fish?
  answer: Louisiana's state saltwater fish is the spotted seatrout, also called the speckled trout. It became official in 2001.
- question: When did Louisiana adopt the Spotted seatrout?
  answer: The Louisiana Legislature made the spotted seatrout the state saltwater fish in 2001. The law took effect on August 15, 2001.
- question: Why did Louisiana choose the Spotted seatrout?
  answer: Official sources do not give a detailed reason. The fish is the most targeted saltwater fish among Louisiana anglers.
- question: Is the spotted seatrout really a trout?
  answer: No. It only looks a bit like a trout because of its spots. It is a member of the drum family, which also includes the red drum.
- question: How can you identify a spotted seatrout?
  answer: Look for a silvery gray back, a white belly, and black spots on the upper body. Its top fin and tail are always spotted.
