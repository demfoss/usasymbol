seo_title: "Louisiana State Mineral | Agate"
seo_description: "Louisiana's state mineral is agate, redesignated in 2011. It is found as banded pebbles in river gravel across the state, not mined from bedrock."
hero_image: /images/minerals/louisiana/louisiana-state-mineral-hero.webp
