faq:
  - question: What is Louisiana's state mineral?
    answer: "Louisiana's state mineral is agate, a banded variety of quartz found in river gravel, redesignated in 2011 after previously serving as the state gemstone."
  - question: When did Louisiana adopt agate as its state mineral?
    answer: "The Louisiana Legislature moved agate to the state mineral title in 2011, after first naming it state gemstone in 1976."
  - question: Why did Louisiana choose agate?
    answer: "Agate pebbles are common enough in Louisiana's river gravel for rockhounds to collect them across the state, and the designation kept a long-recognized symbol in place when a new gemstone was created in 2011."
  - question: Where can you find agate in Louisiana?
    answer: "Louisiana agate turns up in river gravel and gravel bars across the state rather than at any single mine or quarry, since it arrives secondhand, carried downstream from older rock formations."

