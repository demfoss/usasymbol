intro_text: "Louisiana's state mineral is agate, redesignated in 2011 as the banded quartz pebble that rockhounds have long collected from the state's river gravel. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Louisiana State Mineral
    paragraphs:
      - "Agate is Louisiana's official state mineral, a title it has held since 2011. It had previously served as the state's official gemstone starting in 1976, before lawmakers moved it to the mineral category and created a new gemstone in its place."
      - "Louisiana's official description keeps the designation simple, naming agate as found in the state's own gravel rather than pointing to a single mine or deposit."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Agate?"
    paragraphs:
      - "Agate is a banded variety of chalcedony, a fine-grained form of quartz, known for the parallel or curved color bands that run through a cut and polished piece. Louisiana agate typically shows grays, browns, and reds rather than the vivid blues or greens seen in agate from other regions."
      - "Agate forms as silica-rich groundwater deposits layer after layer inside cavities in older rock. Louisiana's agate arrived secondhand, carried and rounded by ancient rivers before settling into the gravel beds where collectors find it today."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Louisiana Chose Agate as Its State Mineral"
    paragraphs:
      - "Louisiana has no bedrock mines producing gemstones, so its mineral symbols reflect what turns up in river gravel and terrace deposits instead. Agate pebbles, washed down from older rock formations to the north, are common enough across the state for rockhounds to collect them from gravel bars and road cuts."
      - "State lawmakers first honored agate as the official gemstone in 1976. When a 2011 bill created a new gemstone from Louisiana's own oyster shells, agate moved into the mineral category rather than being dropped from the state's symbols altogether."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Agate Became Louisiana's State Mineral"
    paragraphs:
      - "The Louisiana Legislature first designated agate the state gemstone in 1976. In 2011, lawmakers passed a bill creating a new state gemstone from eastern oyster shell and moved agate to the state mineral title instead."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Agate Facts"
    facts:
      - "Redesignated Louisiana's state mineral in 2011, after serving as the state gemstone since 1976."
      - "Louisiana's law describes the mineral simply as agate, as found in Louisiana gravel, without naming a specific deposit."
      - "Agate is a variety of chalcedony, a cryptocrystalline form of quartz, and shares its chemical formula, SiO2, with ordinary quartz."
      - "Louisiana agate arrives in gravel deposits after being carried and rounded by ancient rivers rather than being mined directly from bedrock."

