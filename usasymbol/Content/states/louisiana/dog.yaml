seo_title: "Catahoula Leopard Dog: Louisiana's State Dog Since 1979"
seo_description: "The Catahoula Leopard Dog is Louisiana's official state dog since 1979 — America's first domesticated breed, developed from Native American, Spanish, and French bloodlines unique to Louisiana."

intro_text: "The <strong>Catahoula Leopard Dog</strong> became Louisiana's official state dog in 1979, making Louisiana one of the first states to designate an official dog breed and placing it on the [U.S. state dogs hub](/symbols/dogs). Named after Catahoula Parish in northern Louisiana, this breed is believed to be the first dog breed developed in the United States. Known for their striking 'glass eyes,' webbed feet, and fearless herding ability, Catahoulas remain working dogs throughout Louisiana's swamps and farms alongside habitat tied to the [Louisiana state tree](/states/louisiana/tree/bald-cypress)."

sections:
  - id: "why-chosen"
    icon: "fa-solid fa-bullseye"
    title: "Why Louisiana Chose the Catahoula"
    paragraphs:
      - "Louisiana designated the Catahoula Leopard Dog as its official state dog on July 9, 1979. Governor Edwin Edwards signed the legislation, recognizing the breed's unique Louisiana heritage."
      - "The Catahoula was chosen because it originated in Louisiana—specifically in the Catahoula Parish area—making it truly native to the state. It is widely believed to be the first domesticated dog breed developed in what is now the United States."
      - "The breed represented Louisiana's rural working heritage. For over two centuries, Catahoulas worked alongside Louisiana farmers and hunters, herding wild hogs and cattle in swamps and forests. They were indispensable to the state's agricultural economy and reflected values captured in the [Louisiana state motto](/states/louisiana/motto/union-justice-and-confidence)."

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "History: America's First Dog Breed"
    subsections:
      - subtitle: "Pre-1700s — Native American Dogs"
        text: "The Catahoula's ancestors were dogs kept by the Choctaw and other Native American peoples in Louisiana. These dogs were bred for hunting and may have had wolf ancestry."
      - subtitle: "1700s — Spanish and French Influence"
        text: "When Spanish explorers arrived with their war dogs (mastiffs and greyhounds), and later when French settlers brought their hounds, these dogs interbred with Native American dogs. The Catahoula began to take shape."
      - subtitle: "1800s — Working Dog Development"
        text: "Louisiana settlers refined the breed for herding wild hogs and cattle in dense swamps and forests. The dogs' unique herding style—surrounding and holding livestock—proved invaluable."
      - subtitle: "Early 1900s — Name Origin"
        text: "The breed became known as the 'Catahoula Cur' or 'Catahoula Leopard Dog,' named after Catahoula Parish in northern Louisiana where many breeding programs were centered."
      - subtitle: "1979 — Official State Dog"
        text: "Governor Edwin Edwards signed legislation making the Catahoula Louisiana's official state dog—one of the first state dog designations in America."
      - subtitle: "1995 — UKC Recognition"
        text: "The United Kennel Club officially recognized the Catahoula Leopard Dog. The breed remains unrecognized by the American Kennel Club but maintains a devoted following."

  - id: "louisiana-connection"
    icon: "fa-solid fa-map-marker-alt"
    title: "The Catahoula's Louisiana Legacy"
    paragraphs:
      - "The Catahoula is inseparable from Louisiana's identity. The breed's name comes from Catahoula Parish, and the word 'Catahoula' itself may derive from the Choctaw word meaning 'sacred lake.' That regional identity also supports [the Pelican State nickname](/states/louisiana/nickname/the-pelican-state)."
      - "For over 200 years, Louisiana farmers depended on Catahoulas to work wild hogs—feral pigs that roamed the state's swamps and forests. The dogs' fearless nature and unique 'baying' technique allowed small teams to capture wild hogs for market."
      - "Today, Catahoulas remain working dogs throughout Louisiana. They're used for hunting, herding, and as family protectors. The breed's versatility makes them suited to Louisiana's diverse landscape, from bayou swamps to piney woods, including the multi-state region summarized in [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "Louisiana celebrates the breed through annual Catahoula events, including the Uncle Earl's Hog Dog Trials in Winnfield, which draws competitors from across the South."

  - id: "physical"
    icon: "fa-solid fa-magnifying-glass"
    title: "Physical Characteristics"
    subsections:
      - subtitle: "Size and Build"
        text: "Catahoulas are medium to large dogs, standing 22-26 inches at the shoulder. Males typically weigh 65-95 pounds; females are smaller at 50-65 pounds. They have a muscular, athletic build designed for endurance work."
      - subtitle: "The Glass Eyes"
        text: "Catahoulas are famous for their striking eyes. Many have heterochromia—two different colored eyes, or 'cracked' eyes with multiple colors in one eye. Blue, green, amber, and brown are common. This trait is called 'glass eyes.'"
      - subtitle: "Coat and Color"
        text: "Their short coat comes in an extraordinary variety of colors and patterns. The 'leopard' pattern (merle) is most famous—a base color with darker patches—but solids, brindles, and patchwork patterns occur. No two Catahoulas look exactly alike."
      - subtitle: "Webbed Feet"
        text: "Catahoulas have prominent webbed feet—more extensive than most breeds. This adaptation helps them swim and navigate Louisiana's swampy terrain."

  - id: "behavior"
    icon: "fa-solid fa-dog"
    title: "Temperament & Behavior"
    subsections:
      - subtitle: "Working Drive"
        text: "Catahoulas are bred to work. They have intense energy and need a job to do—whether herding, hunting, or structured activities. Without adequate exercise and mental stimulation, they can become destructive."
      - subtitle: "Loyal but Independent"
        text: "These dogs bond deeply with their families but maintain an independent streak. They can be wary of strangers, making them excellent watchdogs. Early socialization is essential."
      - subtitle: "Herding Style"
        text: "Catahoulas have a unique herding method. They create a 'canine fence' around livestock, then bay loudly to alert the handler. This technique was developed for containing dangerous wild hogs."
      - subtitle: "Training Needs"
        text: "Catahoulas require firm, consistent training from an experienced handler. They respond poorly to harsh methods but thrive with positive reinforcement. They're not recommended for first-time dog owners."

  - id: "care"
    icon: "fa-solid fa-heart"
    title: "Care Requirements"
    subsections:
      - subtitle: "Exercise Needs"
        text: "High energy requires 60+ minutes of vigorous exercise daily. Ideal activities include running, swimming, hiking, and working livestock. A tired Catahoula is a well-behaved Catahoula."
      - subtitle: "Living Environment"
        text: "Catahoulas do best in rural or suburban homes with large yards. They're not suited to apartment living. A secure fence is essential—these dogs can climb and jump."
      - subtitle: "Grooming"
        text: "Their short coat requires minimal grooming—weekly brushing is sufficient. They shed moderately year-round. Regular nail trimming and ear cleaning are important."
      - subtitle: "Health Considerations"
        list:
          - "Hip dysplasia (have breeding stock tested)"
          - "Deafness (associated with merle coloring)"
          - "Eye problems (related to the merle gene)"
          - "Generally healthy with 10-14 year lifespan"

  - id: "interesting-facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "The Catahoula is believed to be the first dog breed developed in the United States"
      - "Louisiana was among the first states to designate an official state dog (1979)"
      - "The name 'Catahoula' may come from Choctaw words meaning 'sacred lake'"
      - "Catahoulas have webbed feet—more extensive than most breeds"
      - "No two Catahoulas have exactly the same coat pattern"
      - "Their 'glass eyes' can contain multiple colors in a single eye"
      - "Catahoulas can climb trees—a trait used when hunting"
      - "They're known as 'hog dogs' for their skill at hunting wild boar"
      - "Jim Bowie, famous for the Bowie knife, reportedly owned Catahoulas"
      - "The breed is not recognized by the AKC but is registered with the UKC"
      - "Annual hog dog trials in Louisiana celebrate the breed's working heritage"
      - "Louisiana's Catahoula Parish is named after the same Native American word as the dog"

faq:
  - question: "What is Louisiana's state dog?"
    answer: "Louisiana's state dog is the Catahoula Leopard Dog, designated in 1979. It is believed to be the first dog breed developed in the United States."

  - question: "Why is it called a 'Leopard' dog?"
    answer: "The 'leopard' refers to the breed's distinctive merle coat pattern—a base color with darker spots or patches, resembling a leopard's coat."

  - question: "What are 'glass eyes' in Catahoulas?"
    answer: "Glass eyes refers to the breed's striking heterochromia—eyes that are blue, green, or contain multiple colors. Many Catahoulas have two different colored eyes."

  - question: "Are Catahoulas good family dogs?"
    answer: "Catahoulas can be excellent family dogs for experienced, active owners. They're loyal and protective but require extensive exercise, training, and socialization."

  - question: "Why do Catahoulas have webbed feet?"
    answer: "Their webbed feet help them navigate Louisiana's swampy terrain. The extensive webbing aids swimming and provides traction in muddy conditions."

  - question: "Is the Catahoula AKC recognized?"
    answer: "No, the Catahoula is not recognized by the American Kennel Club. It is recognized by the United Kennel Club (since 1995) and has its own breed registry."

  - question: "How much exercise does a Catahoula need?"
    answer: "Catahoulas need at least 60 minutes of vigorous exercise daily. They were bred as working dogs and become destructive without adequate physical and mental stimulation."

  - question: "Does Louisiana have other state animals?"
    answer: "Yes, Louisiana's state mammal is the Black Bear. Learn more on our Louisiana State Animal page."

