etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Smith, Miller, and Taylor carry medieval trade names — metalworking, milling, and tailoring — distributed across Louisiana's northern parishes and urban centers."
    examples:
      - Smith (metalworker or blacksmith)
      - Miller (grain mill operator)
      - Taylor (cutter of cloth)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Louisiana's largest surname group spans both its Anglo-American and French Acadian lines, from Williams and Johnson to French patronymics like Hebert and Landry carried by Acadian exiles resettled in the 1760s."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Hebert (son of Haribert, army-bright)

  - type: Descriptive Names
    icon: fa-solid fa-palette
    description: "Brown, Leblanc, and White are descriptive nicknames for hair or complexion in both English and French naming traditions, with Leblanc marking Louisiana's Acadian imprint."
    examples:
      - Brown (brown hair or complexion)
      - Leblanc (the white one, fair hair or complexion)
      - White (white or fair hair)

faq:
  - question: "What are the most common last names in Louisiana?"
    answer: "The most common last names in Louisiana are Williams, Smith, Johnson, Jones, and Brown."

  - question: "What is the most common last name in Louisiana?"
    answer: "Williams is the most common last name in Louisiana, appearing 54,506 times (about 1 in every 89 residents)."

