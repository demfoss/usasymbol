seo:
  title: "Top 20 Last Names in Louisiana: Origins and Meanings"
  description: "Williams leads Louisiana's most common surnames, but Cajun names like Broussard, Guidry, and Fontenot set the state apart. See the full top 20 with origins and meanings."

page:
  h1: "Most Common Last Names in Louisiana"
  intro: "Williams, Smith, and Johnson top Louisiana's surname list, but the state's real naming story runs through the Acadiana parishes, where French Acadian surnames like Hebert, Landry, and Broussard appear at rates 30 to 50 times higher than their national averages. No other state has a top-20 list so split between Anglo-American and French Creole roots."
  heritage_title: "Acadian Exiles, Creole Settlers, and the Names They Left Behind"
  heritage_body: "Louisiana's French surname concentration traces directly to the Grand Derangement of 1755, when British forces expelled Acadians from Nova Scotia. Thousands resettled along the Bayou Teche corridor and in parishes like Lafayette, St. Martin, and Vermilion through the 1760s and 1770s, carrying family names that had already been established in Canada for over a century. Those same surnames, Landry, Broussard, Hebert, LeBlanc, Guidry, and Fontenot, remained geographically concentrated in southern Louisiana because the Cajun community was largely self-contained for generations. African American families in the state adopted surnames from English-speaking enslavers, which explains why Williams, Johnson, and Jackson rank disproportionately high compared to neighboring states with smaller Black populations."
  fun_fact: "Guidry is a Louisiana signature surname because it links directly to Acadian resettlement in the Vermilion and Lafayette parish area. The name derives from a Germanic personal name, Widric, filtered through Norman French, and arrived through the Acadian migration of the 1760s."

surnames:
  - rank: 1
    name: Williams
    count: 54506
    ratio: 89
    origin: welsh
    type: Patronymic
    meaning: "Derived from the given name William, itself from the Old Germanic Willahelm, meaning resolute protector. In Louisiana, Williams ranks first largely because of the state's substantial African American population, who adopted the surnames of English-speaking enslavers after emancipation. It is the third most common surname nationally but reaches its highest raw count in Louisiana relative to state population compared to most Southern states."

  - rank: 2
    name: Smith
    count: 51821
    ratio: 94
    origin: english
    type: Occupational
    meaning: "From the Old English smitan, meaning to strike, Smith identified a metalworker or blacksmith. It is the most common surname in the United States overall. In Louisiana, it ranks second rather than first, displaced by Williams due to the state's demographic composition."

  - rank: 3
    name: Johnson
    count: 47356
    ratio: 103
    origin: english
    type: Patronymic
    meaning: "Meaning son of John, with John derived from the Hebrew Yohanan, meaning God is gracious. Johnson is the second most common surname nationally and ranks third in Louisiana. Its prevalence here reflects both Anglo-American settlement in northern Louisiana parishes and post-emancipation surname adoption by African American families statewide."

  - rank: 4
    name: Jones
    count: 35409
    ratio: 138
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John, derived from the given name Ioan. Jones is the fifth most common surname in the United States. In Louisiana, it appears across both the northern Protestant parishes settled by Anglo-Americans from the Carolinas and Georgia in the early 1800s and in urban New Orleans."

  - rank: 5
    name: Brown
    count: 33852
    ratio: 144
    origin: english
    type: Descriptive
    meaning: "From the Old English brun, referring to brown hair, skin, or complexion. Brown is the fourth most common surname nationally. In Louisiana, it is distributed broadly across the state, with notable concentrations in the northern parishes that received English and Irish migration through the Mississippi and Red River valleys in the early nineteenth century."

  - rank: 6
    name: Davis
    count: 27532
    ratio: 177
    origin: welsh
    type: Patronymic
    meaning: "A patronymic meaning son of David, with David from the Hebrew Dawid, meaning beloved. Davis ranks sixth nationally and sixth in Louisiana, reflecting the state's significant Welsh and English-descended population in the Florida Parishes and the northern uplands settled before statehood in 1812."

  - rank: 7
    name: Jackson
    count: 25552
    ratio: 191
    origin: english
    type: Patronymic
    meaning: "Meaning son of Jack, a medieval diminutive of John. Jackson ranks sixteenth nationally but climbs to seventh in Louisiana, a gap explained by the state's large African American population, many of whom adopted the surname after emancipation. The name is especially common in parishes along the Mississippi River corridor."

  - rank: 8
    name: Thomas
    count: 23632
    ratio: 206
    origin: english
    type: Patronymic
    meaning: "From the Aramaic personal name Toma, meaning twin, transmitted through Greek and Latin into English. Thomas ranks twelfth nationally but reaches eighth in Louisiana, again reflecting post-emancipation surname patterns among African American families in the state's river parishes and urban centers."

  - rank: 9
    name: Hebert
    count: 21391
    ratio: 228
    origin: french
    type: Patronymic
    meaning: "Derived from the Old Germanic personal name Haribert, meaning army-bright, filtered through Norman French as Hebert. Over 41 percent of all Heberts in the United States live in Louisiana, concentrated in Lafayette, St. Mary, and Iberia parishes. The family arrived in Louisiana as part of the Acadian resettlement of the 1760s, having originally emigrated from the Poitou region of France to Nova Scotia in the 1630s."

  - rank: 10
    name: Miller
    count: 20747
    ratio: 235
    origin: english
    type: Occupational
    meaning: "From the Old English mylenweard or Middle English miller, denoting someone who operated a grain mill. Miller is the seventh most common surname in the United States. In Louisiana, it appears most frequently in the northern parishes and in the German Coast region along the Mississippi River, where German settlers who arrived in the 1720s sometimes anglicized the surname Mueller to Miller."

  - rank: 11
    name: Landry
    count: 20495
    ratio: 238
    origin: french
    type: Patronymic
    meaning: "Derived from the Old Germanic personal name Landric, meaning land-ruler, adopted into French as Landry. Nearly 40 percent of all Landry bearers in the United States live in Louisiana. The Landry family was among the earliest Acadian settlers in Nova Scotia and resettled in the Attakapas and Opelousas districts of southern Louisiana after the 1755 expulsion, with the name now concentrated in St. Mary, Lafourche, and Terrebonne parishes."

  - rank: 12
    name: Broussard
    count: 18519
    ratio: 263
    origin: french
    type: Habitational
    meaning: "From the French broussard, referring to someone who lived near or in brushwood or scrubland. More than 52 percent of all Broussards in the United States live in Louisiana. The Broussard family, including the Acadian resistance leader Joseph Broussard dit Beausoleil, was central to the resettlement of the Attakapas district around present-day St. Martinville in the 1760s."

  - rank: 13
    name: Leblanc
    count: 17883
    ratio: 272
    origin: french
    type: Descriptive
    meaning: "From the Old French le blanc, meaning the white one, referring to fair hair or complexion. Nearly 33 percent of all LeBlancs in the United States reside in Louisiana. The LeBlanc family was one of the founding Acadian clans in Nova Scotia and resettled heavily in the Lafourche and Terrebonne parishes of southern Louisiana following the deportation of 1755."

  - rank: 14
    name: Taylor
    count: 16957
    ratio: 287
    origin: english
    type: Occupational
    meaning: "From the Old French tailleur, meaning cutter, referring to a tailor or garment maker. Taylor is the eleventh most common surname in the United States. In Louisiana, it appears across the state but is more concentrated in the northern parishes that received Anglo-American settlers from the Upper South in the early 1800s."

  - rank: 15
    name: Martin
    count: 16892
    ratio: 288
    origin: french
    type: Patronymic
    meaning: "Derived from the Latin Martinus, a diminutive of Mars, the Roman god of war, and popularized by Saint Martin of Tours. Martin is the seventeenth most common surname nationally. In Louisiana, it appears in both the French Creole south, where it entered through Acadian and French colonial settlement, and in the Anglo-American north."

  - rank: 16
    name: Wilson
    count: 16529
    ratio: 295
    origin: english
    type: Patronymic
    meaning: "Meaning son of Will, a short form of William, from the Old Germanic Willahelm. Wilson ranks ninth nationally. In Louisiana, it is distributed primarily across the northern parishes settled by English-speaking migrants from Tennessee, Mississippi, and Georgia during the territorial period before 1812."

  - rank: 17
    name: Lewis
    count: 16323
    ratio: 298
    origin: welsh
    type: Patronymic
    meaning: "From the Welsh Llywelyn or the Norman French Louis, both ultimately derived from the Old Germanic Hludwig, meaning famous warrior. Lewis ranks twenty-fifth nationally but climbs to seventeenth in Louisiana. It is common among both African American families in the river parishes and Anglo-American families in the Florida Parishes."

  - rank: 18
    name: Harris
    count: 16088
    ratio: 303
    origin: english
    type: Patronymic
    meaning: "A patronymic meaning son of Harry, a medieval English form of Henry, itself from the Old Germanic Heimrich, meaning home-ruler. Harris ranks twenty-first nationally. In Louisiana, it is found across the state with concentrations in East Baton Rouge and Orleans parishes."

  - rank: 19
    name: Guidry
    count: 15756
    ratio: 309
    origin: french
    type: Patronymic
    meaning: "Derived from the Old Germanic personal name Widric, meaning wood-ruler, transmitted through Norman French as Guidry. Nearly 60 percent of all Guidrys in the United States live in Louisiana, making it one of the most geographically concentrated surnames in the country. The family settled in the Attakapas and Vermilion districts of southern Louisiana in the 1760s as part of the Acadian resettlement, and the name remains densest in Vermilion and Lafayette parishes today."

  - rank: 20
    name: White
    count: 15670
    ratio: 311
    origin: english
    type: Descriptive
    meaning: "From the Old English hwit, referring to white or fair hair or complexion. White ranks eighteenth nationally. In Louisiana, it appears across the northern and central parishes with Anglo-American heritage, and in New Orleans, where it was also adopted by some free people of color in the antebellum period."

unique_surnames:
  - name: Guidry
    state_rank: 19
    national_rank: 1708
    origin: french
    why: "Guidry derives from a Germanic personal name, Widric, filtered through Norman French, and in Louisiana it is almost inseparable from Acadiana. Acadian families carried the name into southern Louisiana during the resettlement of the 1760s, and Vermilion and Lafayette parishes kept it anchored in Cajun communities for generations."

  - name: Fontenot
    state_rank: 21
    national_rank: 1818
    origin: french
    why: "Fontenot derives from Old French fontenot, a diminutive of fontaine meaning a small spring or fountain, and in Louisiana it belongs especially to the old Opelousas district. Acadian families carried the name into St. Landry and Evangeline parish communities in the late 1760s, where it became one of the classic Cajun surnames."

  - name: Boudreaux
    state_rank: 25
    national_rank: 2213
    origin: french
    why: "Boudreaux is the Louisiana form of French Boudreau, and the Louisiana family is Acadian, tracing back to Michel Boudreau of La Rochelle and Acadia. In Louisiana the name is unmistakably Cajun, with strong roots in the Teche country and in Lafourche and Terrebonne parishes after the Acadian migrations of the 1760s and 1780s. It later became familiar enough in Cajun culture to appear as a stand-in name in Louisiana folk humor."

  - name: Broussard
    state_rank: 12
    national_rank: 1252
    origin: french
    why: "Broussard comes from French broussard, referring to someone who lived near brushwood or scrubland, and in Louisiana it is tied to the Attakapas country. Joseph Broussard dit Beausoleil, an Acadian militia leader, helped negotiate the resettlement of Acadian exiles around St. Martinville in the 1760s, anchoring the surname in Lafayette, St. Martin, and Iberia parishes."

  - name: Hebert
    state_rank: 9
    national_rank: 823
    origin: french
    why: "Hebert derives from the Germanic Haribert, meaning 'army-bright,' and became one of the great Acadian family names before it became a Louisiana name. Hebert families were among the early French settlers in Acadia in the 1600s, and descendants resettled in southern Louisiana after the 1755 deportation, especially around Lafayette, St. Mary, and Assumption parishes."

etymology_groups:
  - type: "Occupational Names"
    icon: "fa-solid fa-hammer"
    description: "Three of Louisiana's top 20 surnames are occupational: Smith (rank 2), Miller (rank 10), and Taylor (rank 14). That proportion is slightly below the national average for top-20 lists, reflecting the outsized presence of French Acadian patronymics that displace occupational names in the lower half of the ranking. Smith and Miller both have German-language equivalents that were sometimes anglicized by German Coast settlers along the Mississippi River in the 1720s."
    examples:
      - Smith (metalworker)
      - Miller (grain mill operator)
      - Taylor (garment cutter)

  - type: "Patronymic Names"
    icon: "fa-solid fa-person"
    description: "Patronymics dominate Louisiana's top 20, accounting for at least twelve of the twenty surnames. English and Welsh patronymics like Williams, Johnson, Jones, and Davis reflect Anglo-American settlement in the northern parishes and post-emancipation surname adoption by African American families. French patronymics like Hebert, Landry, and Guidry reflect the Acadian resettlement of the 1760s in the southern parishes, giving Louisiana a dual-patronymic structure found in no other state."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Hebert (from Germanic Haribert, army-bright)
      - Landry (from Germanic Landric, land-ruler)
      - Guidry (from Germanic Widric, wood-ruler)

  - type: "Descriptive or Place-Based Names"
    icon: "fa-solid fa-map-location-dot"
    description: "Descriptive and habitational surnames account for four of Louisiana's top 20: Brown (rank 5), LeBlanc (rank 13), White (rank 20), and Broussard (rank 12). Brown and LeBlanc mean essentially the same thing in their respective languages, a coincidence that reflects Louisiana's bilingual naming heritage. Broussard, meaning one who lived near brushwood, is the only habitational name in the top 20 and is almost entirely unique to Louisiana at the national level."
    examples:
      - Brown (brown hair or complexion)
      - LeBlanc (the white or fair one)
      - White (fair hair or complexion)
      - Broussard (dweller near brushwood)

faq:
  - question: "What is the most common last name in Louisiana?"
    answer: "Williams is the most common last name in Louisiana, with approximately 54,506 bearers recorded in 2010 Census data, giving a ratio of about 1 in every 89 residents. It ranks above Smith and Johnson largely because of Louisiana's substantial African American population, who adopted English surnames after emancipation."

  - question: "What are the most common Cajun last names in Louisiana?"
    answer: "The most common Cajun surnames in Louisiana are Hebert, Landry, Broussard, LeBlanc, Guidry, Fontenot, and Boudreaux, all of which appear in the state's top 25. Each of these names is carried by 30 to 65 percent of its national bearers in Louisiana alone, concentrated in the Acadiana parishes of Lafayette, Vermilion, St. Martin, and Lafourche. They arrived with Acadian exiles resettling southern Louisiana in the 1760s after the British deportation from Nova Scotia."

