seo_title: "Louisiana State Tree | Bald Cypress"
seo_description: 'Louisiana adopted bald cypress in 1963, honoring the swamp conifer whose knees, buttressed trunks, and rot-resistant wood fit the wetlands.'

intro_text: "Louisiana recognized the Bald Cypress as its official state tree in 1963. No other tree fits the state's swamps and bayous more naturally, and its buttressed trunk and cypress knees make it one of the most distinctive trees in the South. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Louisiana"
    paragraphs:
      - "The Bald Cypress is Louisiana's official state tree. This deciduous conifer grows 100 to 120 feet tall in Louisiana swamps, though exceptional specimens have exceeded 150 feet. The trunk develops a dramatic flared base that can measure 10 to 15 feet in diameter at the waterline. This buttressed base provides stability in soft, waterlogged soils. The bark is reddish-brown with a fibrous, stringy texture that peels in vertical strips. These adaptations make bald cypress perfectly suited to Louisiana's wetland environments where the tree spends months with its roots submerged."
      - "The foliage appears feathery and light green, growing in flat sprays along the branches. Despite being a conifer, bald cypress drops all its needles each fall, giving the tree its 'bald' name. The needles turn russet-brown before falling, creating spectacular autumn color in Louisiana swamps. Small round cones develop in clusters near branch tips. Each cone measures about one inch in diameter and disintegrates to release seeds rather than opening like pine cones."
      - "Bald cypress grows throughout Louisiana's coastal plain and Mississippi River floodplain. The species thrives in permanently flooded swamps, along bayou edges, and in areas with seasonal flooding. Louisiana contains some of North America's most extensive cypress swamp ecosystems. The tree produces distinctive woody projections called cypress knees that rise from the roots above water level. These knees can reach four feet tall and create the recognizable look of Louisiana swamp forests."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Bald Cypress"
    paragraphs:
      - "The common name is Bald Cypress, referring to the tree's deciduous nature. Unlike most conifers that keep their needles year-round, bald cypress sheds all foliage in winter. The scientific name Taxodium distichum combines Latin and Greek roots. Taxodium means 'similar to yew' in Latin. Distichum means 'in two ranks,' describing how the needles arrange themselves in flat sprays."
      - "Louisianans call this tree simply 'cypress' in everyday speech. Loggers historically used the term red cypress for heartwood and yellow cypress for sapwood from the same species. Swamp cypress and southern cypress are regional names emphasizing the tree's habitat. The species belongs to the Cupressaceae family, the cypress family. Louisiana's cypress stands are among the most famous in North America."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Bald Cypress Became the Louisiana State Tree"
    paragraphs:
      - "Louisiana designated the Bald Cypress as its official state tree on July 16, 1963. The Louisiana Legislature passed Act 301 during the 1963 regular session. Governor Jimmie Davis signed the legislation establishing cypress as the state's arboreal symbol. The bill recognized the tree's unique association with Louisiana's distinctive wetland landscapes and its economic importance to the state's history, echoing principles in the [Louisiana state motto](/states/louisiana/motto/union-justice-and-confidence)."
      - "Louisiana picked bald cypress because no other tree defines the state's landscape so completely. The species grows throughout Louisiana's coastal wetlands, creating the swamp forests that characterize much of southern Louisiana. These cypress swamps form critical habitat for Louisiana's diverse wildlife and protect coastal areas from storm surge. The tree's ability to thrive in standing water made it a symbol of Louisiana's adaptation to its watery environment. Visitors to Louisiana immediately associate cypress swamps draped in Spanish moss with the state's character."
      - "The tree held enormous economic significance for Louisiana's development. From the 1880s through 1920s, Louisiana led the nation in cypress lumber production. The wood's natural resistance to decay made it invaluable for building in Louisiana's humid climate. Cypress lumber built houses, boats, barns, and pilings throughout the state. New Orleans and other Louisiana cities relied heavily on cypress for construction. The lumber industry employed thousands of Louisianans and drove economic growth across the state. Virgin cypress forests supplied timber that built Louisiana's infrastructure and supported communities for generations."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Louisiana State Tree Facts"
    facts:
      - "Louisiana adopted Bald Cypress on July 16, 1963, through Act 301 signed by Governor Jimmie Davis"
      - "Cypress knees are woody root projections that grow up to four feet tall in Louisiana swamps - their exact function remains scientifically debated"
      - "The tree is a deciduous conifer, shedding all its needles each fall unlike most cone-bearing trees"
      - "Bald cypress can live over 1,000 years, with some Louisiana specimens estimated at 1,500 to 2,000 years old"
      - "Louisiana produced more cypress lumber than any other state from 1899 to 1913, harvesting billions of board feet"
      - "The wood contains cypressene, a natural oil that resists rot and insect damage even after decades of water exposure"
      - "Louisiana's Atchafalaya Basin contains the largest contiguous cypress swamp in North America at nearly 900,000 acres"
      - "The flared trunk base can measure three times wider than the trunk itself, providing stability in soft swamp mud"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Louisiana State Tree and Flower"
    paragraphs:
      - "Louisiana's state flower is the Magnolia (Magnolia grandiflora), designated in 1900. The state adopted its floral symbol more than six decades before choosing the cypress tree. Both the Bald Cypress and the Magnolia represent Louisiana's native flora; see the [Louisiana state flower page](/states/louisiana/flower/magnolia). The towering cypress dominates wetland forests while magnolias grow in upland areas and gardens across Louisiana. Cypress trees create the swamp ecosystems in spring when magnolias bloom with large white flowers. The pair shows Louisiana's contrasting landscapes from swamps to gardens."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Louisiana Bald Cypress"
    paragraphs:
      - "The trunk base provides the most distinctive identification feature in Louisiana swamps. Look for a dramatically flared or buttressed trunk base that spreads wider than the trunk above. In standing water, this base often extends outward in curved ridges. The bark appears reddish-brown to gray with a fibrous texture. Long vertical strips of bark peel away in thin sections:. Around the base, watch for cypress knees - woody projections rising from the roots like small stumps or cones poking above the water surface."
      - "The foliage grows in feathery flat sprays along the branches. Each needle measures one-half to three-quarters of an inch long. The needles attach directly to small twigs in two flat rows. In spring and summer, the foliage appears light green. During fall, the needles turn orange-brown or russet before dropping completely. By winter, bald cypress stands bare like a deciduous hardwood, unusual for a cone-bearing tree. This seasonal change creates dramatic shifts in Louisiana swamp colors."
      - "The overall form shows a tall straight trunk extending upward with minimal taper. Young trees develop a pyramidal shape. Mature trees form irregular crowns with branches spreading horizontally. Trees growing in open water often lean at angles, creating picturesque swamp scenes. Spanish moss frequently drapes from cypress branches in Louisiana, adding to the characteristic appearance often associated with [the Pelican State nickname](/states/louisiana/nickname/the-pelican-state). Small round cones appear in clusters during summer and fall, turning from green to brown as they mature."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Louisiana State Tree Symbolizes"
    paragraphs:
      - "The Bald Cypress reflects Louisiana's unique relationship with water and wetlands. Its ability to thrive in swamps represents adaptation and resilience in challenging environments. The tree symbolizes Louisiana's distinctive cultural landscape where land and water merge. For many Louisianans, cypress swamps draped in Spanish moss evoke the mystery and beauty of the bayou country. The ancient trees connect modern Louisiana to pristine wilderness that existed before European settlement and to coastal wildlife such as the [official state bird](/states/louisiana/bird/brown-pelican). Conservation efforts to protect remaining old-growth cypress forests reflect Louisiana's commitment to preserving its natural heritage and the ecosystems that define the state's character within the broader [states neighboring states geography set](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Louisiana state tree?"
    answer: "The Bald Cypress (Taxodium distichum) is Louisiana's official state tree. The Louisiana Legislature designated it on July 16, 1963, through Act 301 signed by Governor Jimmie Davis."
  
  - question: "What is the Louisiana state tree called?"
    answer: "Louisiana's state tree is called Bald Cypress. It's also known simply as cypress, swamp cypress, or southern cypress. The scientific name is Taxodium distichum. The 'bald' refers to the tree shedding its needles each winter."
  
  - question: "When was the Louisiana state tree adopted?"
    answer: "Louisiana adopted the Bald Cypress as its official state tree on July 16, 1963. The designation came through Act 301 passed during the 1963 regular legislative session and signed by Governor Jimmie Davis."
  
  - question: "Why is the Bald Cypress Louisiana's state tree?"
    answer: "Louisiana chose the Bald Cypress because it defines the state's distinctive swamp landscapes and grows throughout Louisiana's wetlands. The tree thrives in standing water where few others survive, symbolizing Louisiana's adaptation to its watery environment. Historically, cypress lumber was Louisiana's most valuable timber resource from the 1880s through 1920s, building much of the state's infrastructure."
  
  - question: "What is the Louisiana state tree name?"
    answer: "The name is Bald Cypress. The scientific name is Taxodium distichum, meaning 'similar to yew' with needles 'in two ranks.' The tree is called 'bald' because it drops all its needles each fall, unlike most conifers."
  
  - question: "Where does the Louisiana state tree grow?"
    answer: "The Bald Cypress grows throughout Louisiana's coastal plain and Mississippi River floodplain. It thrives in permanently flooded swamps, along bayous, and in areas with seasonal flooding. Louisiana's Atchafalaya Basin contains the largest cypress swamp in North America. The tree grows naturally along the Gulf Coast from Texas to Florida and north through the Mississippi River valley."
  
  - question: "What are some facts about the Louisiana state tree?"
    answer: "The Bald Cypress grows 100 to 120 feet tall and can live over 1,000 years. It produces distinctive woody projections called cypress knees. It's a deciduous conifer that drops its needles each fall. The flared trunk base provides stability in swamp mud. Louisiana led the nation in cypress lumber production from 1899 to 1913. The wood naturally resists decay even in water."
  
  - question: "How do you recognize the Louisiana state tree?"
    answer: "Look for a dramatically flared trunk base, often three times wider than the trunk above. Watch for cypress knees - woody projections rising from roots above water. The bark is reddish-brown and fibrous. Feathery light green needles grow in flat sprays and turn orange-brown before dropping in fall. The tree often grows directly in standing water."

