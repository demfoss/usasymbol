sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Louisiana's State Cuisine?"
    paragraphs:
      - "Gumbo is Louisiana's official state cuisine, designated by the Louisiana Legislature in 2004. It is a thick stew built on a roux base and often includes meat, seafood, and vegetables served over rice."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Gumbo"
    paragraphs:
      - "Gumbo starts with a roux, flour cooked slowly in oil or fat until it darkens, which thickens and flavors the stew. Cooks build on that base with the trinity of onion, celery, and bell pepper, then add ingredients such as andouille sausage, chicken, shrimp, or crab. Many versions are thickened further with okra or filé powder, ground from dried sassafras leaves, and the finished stew is ladled over rice."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Gumbo Became Louisiana's State Cuisine"
    paragraphs:
      - "The Louisiana Legislature designated gumbo the official state cuisine in 2004."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Louisiana Chose Gumbo"
    paragraphs:
      - "Gumbo developed in Louisiana out of a mix of French, African, Spanish, and Native American cooking, reflecting the state's varied history and its Creole and Cajun food traditions. Its combination of local seafood, meats, and the filé powder used by the region's Native American communities makes it a dish that grew specifically out of Louisiana's people and ingredients."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Gumbo Facts"
    facts:
      - "Adopted as Louisiana's state cuisine in 2004."
      - "Gumbo is built on a roux, flour slowly cooked in oil or fat."
      - "The dish blends French, African, Spanish, and Native American cooking traditions."
      - "Filé powder, ground from dried sassafras leaves, is a traditional gumbo thickener."

