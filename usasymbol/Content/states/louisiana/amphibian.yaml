sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Louisiana?
    paragraphs:
      - "The American green tree frog is Louisiana's official state amphibian, designated by the Louisiana Legislature in 1993. Its scientific name is Hyla cinerea."
      - "It is a small, slender frog common in wetlands, ponds, and gardens across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Green Tree Frog
    paragraphs:
      - "The American green tree frog has smooth, bright green skin, often with a pale cream or white stripe running along each side."
      - "It usually grows to about two inches long, with large toe pads that let it grip leaves, plant stems, and windows."
      - "It is best known for its loud, repeated call, which is often heard on warm, humid evenings near water."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "Louisiana schoolchildren helped lead the effort for a state amphibian, and the Louisiana Legislature designated the American green tree frog as the official choice in 1993."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Louisiana Chose the American Green Tree Frog
    paragraphs:
      - "The American green tree frog is common throughout Louisiana's wetlands and swamps, making it a familiar sound and sight across the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Green Tree Frog
    paragraphs:
      - "The American green tree frog lives throughout Louisiana, in swamps, marshes, ponds, and even backyard gardens near standing water."
    sites:
