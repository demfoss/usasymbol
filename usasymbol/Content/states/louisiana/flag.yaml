faq:
  - question: "What design is recognized as the state flag of Louisiana?"
    answer: "The Louisiana state flag is the official banner of Louisiana. It features a white pelican feeding three chicks on a blue field with the state motto below."

  - question: "What does Louisiana's flag look like?"
    answer: "The flag shows a white pelican standing in a nest with three chicks. The bird pecks at her breast, drawing blood to feed the young. The motto Union Justice Confidence appears on a white ribbon below the nest on a blue background."

  - question: "What meaning is attached to Louisiana's flag?"
    answer: "The flag represents self-sacrifice and devotion to citizens. The pelican feeding her young with her own blood symbolizes the state's commitment to protecting and providing for its people."

  - question: "How do historians explain the symbolism of Louisiana's flag?"
    answer: "The flag means sacrifice for the common good. The pelican imagery comes from medieval legend about parental devotion. The motto reflects Louisiana's values of unity, justice, and confidence."

  - question: "Which animal is depicted on the state flag of Louisiana?"
    answer: "A brown pelican is depicted on the Louisiana state flag. The pelican stands in a nest, drawing blood from her own breast to feed three chicks below — a heraldic pose called 'the pelican in her piety.' Brown pelicans are native to Louisiana's Gulf Coast and became the state symbol during the territorial period of 1803. Louisiana is known as 'the Pelican State' partly because of this enduring image on the flag and seal."

  - question: "When did Louisiana add blood drops to its flag?"
    answer: "Louisiana added three blood drops to the pelican image in 2006. The original 1912 flag showed the pelican feeding its chicks but without visible blood. The 2006 revision required three drops to match the traditional heraldic symbolism of the pelican in her piety. A 2010 update then standardized the full design, specifying that the pelican should appear 'in her vigilance' — a heraldic term for the protective stance."

  - question: "Which colors define Louisiana's flag?"
    answer: "The Louisiana state flag is primarily blue with a white pelican, yellow nest, red blood drops, and white ribbon for the motto."

