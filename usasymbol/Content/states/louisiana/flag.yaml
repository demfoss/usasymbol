seo_title: "Louisiana State Flag | Pelican & Meaning"
seo_description: "Louisiana's flag shows the pelican in her piety feeding three chicks, a medieval symbol of sacrifice."

intro_text: "Louisiana's state flag centers on a striking image: a **white pelican** standing in a nest, drawing blood from her own breast to feed three chicks below — the ancient heraldic symbol of self-sacrifice known as \"the pelican in her piety.\" The design sits on a solid blue field, with the state motto *Union Justice Confidence* on a white ribbon below the nest. Louisiana officially adopted this flag in 1912, added the three blood drops in 2006, and standardized the full design in 2010. The pelican has represented Louisiana since the territorial period of 1803 and is also [the state bird](/states/louisiana/bird/brown-pelican). The flag appears in the [U.S. state flags collection](/symbols/flags) and the motto is covered on [Louisiana's motto page](/states/louisiana/motto/union-justice-and-confidence)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Louisiana State Flag Is Designed"
    paragraphs:
      - "The Louisiana state flag is the official civic flag of Louisiana. A solid blue background covers the field. A white pelican stands in the center, feeding blood to three young birds in a nest."
      - "The state motto Union Justice Confidence appears on a white ribbon below. This image has roots in Louisiana's colonial period. Courthouses, state offices, and schools across Louisiana display this flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Louisiana Flag Communicates"
    paragraphs:
      - "The pelican represents self-sacrifice and devotion. Medieval legend claimed pelicans wounded their own breasts. They fed their young with blood during famine. This symbolism became associated with Christian sacrifice and parental care, and it connects directly to the [official Louisiana state bird](/states/louisiana/bird/brown-pelican)."
      - "Louisiana adopted the pelican as a symbol of commitment to its citizens. The three chicks represent the people being nurtured. The blood dripping from the pelican's breast emphasizes sacrifice."
      - "The motto Union Justice Confidence reflects Louisiana's political values. Union refers to loyalty to the United States. Justice represents fair governance. Confidence expresses trust in democratic institutions and appears alongside Louisiana's broader [state color tradition](/symbols/colors)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Louisiana Flag History and Adoption"
    paragraphs:
      - "Louisiana recognized its state flag in 1912. The legislature codified a design that had appeared on unofficial banners for decades. The pelican image traced back to 1803. Louisiana's territorial seal showed this symbol first. Pelican imagery appeared on military and civic banners during the 19th century, including during the Civil War. These designs influenced later state symbolism but were not formally adopted as official state flags."
      - "The 1912 flag showed a pelican feeding three chicks. No visible blood drops appeared. The designer of the flag is not recorded in official state records. The design emerged from existing state symbolism tied to [the Pelican State nickname](/states/louisiana/nickname/the-pelican-state)."
      - "The legislature updated the flag in 2006. The revision required three drops of blood. This matched historical pelican symbolism. In 2010, lawmakers passed additional specifications. The pelican must appear in her vigilance. That's a heraldic term for the protective stance."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Louisiana Flag"
    versions:
      - name: "Original Pelican Flag"
        years: "1912–2006"
        image: "versions/pelican-1912.webp"
        description: "The first official Louisiana state flag adopted in 1912, showing a pelican feeding three chicks without visible blood."

      - name: "Revised Pelican Flag"
        years: "2006–2010"
        image: "versions/pelican-2006.webp"
        description: "A revised version requiring three drops of blood to reflect traditional pelican symbolism."

      - name: "Current State Flag"
        years: "2010–present"
