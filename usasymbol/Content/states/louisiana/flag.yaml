        description: "The current official flag standardized by statute, depicting the pelican in her vigilance with three blood drops."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Louisiana Flag"
    symbols:
      - id: pelican
        name: "Louisiana Pelican"
        image: "symbols/pelican.svg"
        paragraphs:
          - "A white pelican dominates the flag's center. The bird stands in a nest with wings spread. She pecks at her breast, drawing blood to feed three chicks below."
          - "This image comes from medieval Christian symbolism. European heraldry used the pelican in her piety as a symbol of sacrifice. Louisiana adopted the pelican as its state bird during the territorial period."
          - "Brown pelicans are native to Louisiana's coastal regions. The bird became associated with state identity centuries before the flag was created. The 2010 revision specified the pelican should appear in her vigilance. That's a heraldic term for the protective stance shown on the flag."

      - id: motto
        name: "State Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The motto Union Justice Confidence appears on a white ribbon below the nest. Louisiana adopted this motto in 1864 during the Civil War. Each word represents a core principle of state governance."
          - "The motto replaced an earlier French phrase. English became the official language for state mottos after Louisiana rejoined the Union."

      - id: field
        name: "Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "The blue background covers the entire flag. Louisiana chose blue to match colors used in other state flags. It demonstrates loyalty to the United States."
          - "The shade of blue was standardized in 2010. Specifications require the same blue used in the United States flag."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Louisiana State Flag Colors"
    paragraphs:
      - "The flag uses blue, white, yellow, and red. Blue forms the field and matches the shade in the United States flag. White appears in the pelican and ribbon. Yellow colors the nest. Red represents the blood drops."
