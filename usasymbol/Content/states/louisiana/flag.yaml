      - "The pelican symbol dates to Louisiana's territorial period in 1803"
      - "Three drops of blood were added to the design in 2006"
      - "The flag was updated in 2010 to show the pelican in her vigilance"
      - "The motto Union Justice Confidence was adopted in 1864"
