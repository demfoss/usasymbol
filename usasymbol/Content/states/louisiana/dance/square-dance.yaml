faq:
  - question: What is Louisiana's state dance?
    answer: "Louisiana's official state American folk dance is square dance, adopted in 1999."
  - question: When did Louisiana adopt square dance as its state dance?
    answer: "Louisiana adopted square dance as its official state American folk dance in 1999."
  - question: Why did Louisiana choose square dance?
    answer: "Square dance had spread through Louisiana's rural community halls and fit a national movement of states naming it their official folk dance, even as the state's own Cajun and zydeco traditions remained distinct."
  - question: Is square dance the same in every state?
    answer: "The core formation and calls are shared nationally, but many states, including Louisiana, adopted square dance through the same 1970s-1990s campaign, so the exact designation and local traditions vary by state."

