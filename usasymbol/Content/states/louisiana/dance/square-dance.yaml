sections:
  - id: overview
    icon: fa-solid fa-music
    title: Louisiana State Dance
    paragraphs:
      - "Louisiana named square dance its official state American folk dance in 1999. The designation recognized a caller-led dance that had spread through rural community halls even as the state kept its own distinct Cajun and zydeco dance traditions alive."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples in a square, each pair facing the center from its own side. A caller directs the group through a sequence of figures, so dancers respond to spoken instructions rather than a memorized routine."
      - "Music comes from a string band built around fiddle, banjo, and guitar, with the caller's voice layered over the rhythm. Figures alternate between whole-square movements involving all eight dancers and partner-specific figures."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand in a square, each facing the center, with partners side by side on their own side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod first to your partner and then to your corner as the music begins."
      - title: "Circle Left and Right"
        description: "Join hands as a full square and move together in a circle, first left and then right, on the caller's cue."
      - title: "Do-Si-Do with Your Partner"
        description: "Walk around your partner back to back without turning to face them, then return to your original spot."
      - title: "Allemande Left and Promenade"
        description: "Turn your corner with a left-hand grip, then walk your partner around the square side by side to finish the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Louisiana
    paragraphs:
      - "Square dance took root in Louisiana's rural parishes and community halls, where a caller could teach the figures to a room of newcomers in a single evening. That accessibility kept the dance active alongside the state's own Cajun and zydeco social dances, which remained distinct traditions in their own right."
      - "Louisiana's adoption in 1999 followed the broader national campaign that ran from the 1970s through the 1990s, in which square-dance callers' associations and folk-dance organizations urged state legislatures to name square dance an official folk dance."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Square Dance Became Louisiana's Dance"
    paragraphs:
      - "The Louisiana Legislature designated square dance the state's official American folk dance in 1999."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Louisiana adopted square dance as its official state American folk dance in 1999."
      - "The dance is led by a caller who directs eight dancers arranged in a square of four couples."
      - "Louisiana's square-dance halls existed alongside the state's own Cajun and zydeco dance traditions."
      - "Square dance is typically danced to string-band music built around fiddle, banjo, and guitar."

