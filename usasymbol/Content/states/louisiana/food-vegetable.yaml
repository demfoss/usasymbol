sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Louisiana's State Vegetable?"
    paragraphs:
      - "The sweet potato is Louisiana's official state vegetable, designated by the Louisiana Legislature in 2003. Louisiana has long ranked among the top sweet potato producing states, with the crop centered around the town of Opelousas and the surrounding parishes."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sweet Potato"
    paragraphs:
      - "Sweet potatoes are starchy, orange-fleshed root vegetables grown in warm, sandy soil through the summer and dug up in the fall. In Louisiana they are baked, candied, or used in pies, and are closely tied to the state's harvest traditions."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sweet Potato Became Louisiana's State Vegetable"
    paragraphs:
      - "The Louisiana Legislature designated the sweet potato the official state vegetable in 2003, formalizing a status the crop already held in the state's agricultural identity."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Louisiana Chose the Sweet Potato"
    paragraphs:
      - "Louisiana chose the sweet potato because the state has grown it commercially for generations, particularly around Opelousas in St. Landry Parish, which holds an annual Yambilee festival celebrating the crop."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Sweet Potato Comes From in Louisiana"
    paragraphs:
      - "Louisiana's sweet potato farming is centered around Opelousas in St. Landry Parish, home to the annual Louisiana Yambilee festival that celebrates the harvest each fall."
