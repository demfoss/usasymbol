faq:
  - question: "What is Louisiana's state dog?"
    answer: "Louisiana's state dog is the Catahoula leopard dog (Canis lupus familiaris), designated in 1979. This is the only dog breed that originated in Louisiana, developed over centuries from Native American, Spanish, and French dog bloodlines."

  - question: "When was the Catahoula leopard dog designated as Louisiana's state dog?"
    answer: "The Catahoula leopard dog became Louisiana's official state dog on July 16, 1979, through Senate Concurrent Resolution 35, recognizing the breed as Louisiana's only native dog breed."

  - question: "Why did Louisiana choose the Catahoula leopard dog as its state dog?"
    answer: "Louisiana chose the Catahoula because it is the only dog breed that originated in Louisiana, developed specifically for Louisiana's environment and working needs. The breed embodies Louisiana's multicultural heritage through its Native American, Spanish, and French ancestry, and represents the state's working-class outdoor traditions including wild hog hunting and cattle herding."

  - question: "What makes Catahoula leopard dogs distinctive?"
    answer: "Catahoulas are known for distinctive leopard (merle) spotted coat patterns, striking glass eyes (often blue or multi-colored), webbed feet for swimming in swamps, and intense working drive. They were bred as hog-hunting and cattle-herding dogs, making them intelligent, independent, and requiring experienced owners who can provide adequate exercise and training."

  - question: "Where did the Catahoula leopard dog originate?"
    answer: "The Catahoula originated in Catahoula Parish in north-central Louisiana, giving the breed its name. The breed developed over 200-300 years through crosses between Native American dogs, Spanish war dogs and mastiffs, and French hounds brought by Acadian settlers, creating a unique American breed adapted to Louisiana's swamps and forests."

  - question: "Are Catahoula leopard dogs good family pets?"
    answer: "Catahoulas can be good family dogs for experienced owners who understand working breeds. They require extensive exercise, mental stimulation, and firm, confident training. They are not suitable for first-time dog owners or families wanting low-maintenance pets. Catahoulas need jobs—hunting, herding, agility, or other activities—and become destructive without adequate outlets for their intense working drive."

  - question: "What were Catahoulas bred to do?"
    answer: "Catahoulas were bred primarily for hunting wild hogs in Louisiana's swamps and forests. They work in packs to locate, pursue, and bay dangerous hogs weighing 200+ pounds. Catahoulas also excel at herding semi-feral cattle through swamps and marshes. The breed developed webbed feet for swimming through Louisiana's wetlands and the courage to confront dangerous animals."

  - question: "Are Catahoula leopard dogs recognized by the American Kennel Club?"
    answer: "No, the American Kennel Club does not recognize Catahoulas. However, the United Kennel Club officially recognized the breed as the Louisiana Catahoula Leopard Dog in 1995. Many Catahoula enthusiasts prefer to maintain the breed as a working dog rather than conforming to show dog standards, which has limited AKC recognition efforts."

