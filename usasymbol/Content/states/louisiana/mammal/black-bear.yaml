faq:
  - question: "What is Louisiana's state mammal?"
    answer: "Louisiana's state mammal is the Louisiana black bear (Ursus americanus luteolus), designated in 1992. This is a distinct subspecies of American black bear found only in the Gulf Coast region, with Louisiana supporting the vast majority of the population."

  - question: "When was the Louisiana black bear designated as the state mammal?"
    answer: "The Louisiana black bear became Louisiana's official state mammal on June 15, 1992, the same year the subspecies was listed as threatened under the Endangered Species Act due to critically low population numbers."

  - question: "Why did Louisiana choose the black bear as its state mammal?"
    answer: "Louisiana chose the Louisiana black bear because it is a unique subspecies found primarily in Louisiana's distinctive bottomland hardwood forests and swamps. The designation in 1992 recognized both the bear's importance to Louisiana's natural heritage and the urgent need for conservation to prevent extinction. The bear symbolizes Louisiana's wildest ecosystems and the state's commitment to wildlife protection."

  - question: "Where can I see Louisiana black bears?"
    answer: "Louisiana black bears are extremely difficult to see in the wild due to their nocturnal habits and remote swamp habitat. Your best chances are at Tensas River National Wildlife Refuge in northeast Louisiana, Atchafalaya National Wildlife Refuge in south-central Louisiana, or Upper Ouachita National Wildlife Refuge in north-central Louisiana. However, even in these areas, bear sightings are rare and require patience and luck."

  - question: "Are Louisiana black bears endangered?"
    answer: "Louisiana black bears were listed as threatened under the Endangered Species Act from 1992 to 2016. The species successfully recovered from approximately 150-170 individuals to 750-1,000, leading to delisting in 2016. While no longer federally threatened, the bears remain protected under Louisiana state law, and hunting is prohibited."

  - question: "How is the Louisiana black bear different from other black bears?"
    answer: "The Louisiana black bear is a distinct subspecies (Ursus americanus luteolus) with a broader, flatter skull and longer, narrower muzzle than other American black bear subspecies. Louisiana bears are adapted to hot, humid Gulf Coast climates and depend specifically on bottomland hardwood forests along major rivers. They are genetically distinct and geographically isolated from other black bear populations."

  - question: "What caused Louisiana black bears to nearly go extinct?"
    answer: "Louisiana black bears nearly went extinct due to two primary factors: massive habitat loss (over 80 percent of bottomland hardwood forests were converted to agriculture) and unregulated hunting. By the early 1990s, only 150-170 bears survived in isolated habitat fragments. Federal protection in 1992 and extensive habitat restoration allowed populations to recover."

  - question: "Can you hunt Louisiana black bears?"
    answer: "No, hunting Louisiana black bears is prohibited under Louisiana state law. Although the subspecies was removed from the federal threatened species list in 2016, Louisiana maintains hunting prohibition to ensure continued population stability and prevent conflicts with recovering bear populations."

