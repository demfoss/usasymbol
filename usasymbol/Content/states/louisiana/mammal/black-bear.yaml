title: "Louisiana State Mammal | Louisiana Black Bear"
scientific_name: "Ursus americanus luteolus"
adopted_year: 1992

seo_title: "Louisiana State Mammal | Louisiana Black Bear"
seo_description: "Louisiana's state mammal is the Louisiana Black Bear, adopted in 1992. Learn why this official Louisiana symbol was chosen and what it represents."

intro_text: "The Louisiana Black Bear is the official Louisiana state mammal, designated in 1992. This page gives the direct answer for searches like 'louisiana state mammal', 'louisiana state animal', and 'louisiana state mammal' while explaining how the symbol fits the state's official animal designations. Symbol of Louisiana swamp ecosystems, recovery from near-extinction, largest land carnivore in Louisiana. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Louisiana Black Bear"
official_since: "1992"
status: "Recovered from threatened status (delisted 2016); population stable at 750-1,000 individuals"
habitat_in_state: "Bottomland hardwood forests, river swamps, especially Atchafalaya Basin, Tensas River corridor, Upper Ouachita River"
known_for: "Symbol of Louisiana swamp ecosystems, recovery from near-extinction, largest land carnivore in Louisiana"

size: "5 to 6 feet in length when standing on all fours"
weight: "Males: 250-450 pounds; Females: 120-250 pounds; Louisiana bears typically larger than other Gulf Coast black bear populations"
coloration: "Black to dark brown coat; some individuals have brown muzzle; occasional white chest blaze; lighter coloring than northern black bears"
distinctive_traits: "Broader, flatter skull than other black bear subspecies; longer, narrower muzzle; larger overall size; adapted to hot, humid Louisiana climate"

habitat: "Bottomland hardwood forests along major rivers, cypress-tupelo swamps, coastal marshes"
range_in_state: "Three separate populations: Tensas River basin (northeast Louisiana), Upper Ouachita River (north-central), Atchafalaya River basin (south-central); historically throughout Louisiana's forested wetlands"
conservation_status: "Listed as threatened 1992-2016; population recovered from approximately 150-170 to 750-1,000; habitat restoration ongoing; hunting prohibited"
where_to_find: "Tensas River National Wildlife Refuge, Atchafalaya National Wildlife Refuge, Upper Ouachita National Wildlife Refuge, Bayou Teche National Wildlife Refuge; rarely seen due to nocturnal habits and swamp habitat"
symbol_connections: "Represents Louisiana's unique bottomland hardwood ecosystems; embodies recovery from near-extinction through habitat protection; symbolizes wildness in Louisiana's swamps and bayous; connects to Theodore Roosevelt's 1907 Louisiana bear hunt that inspired the 'teddy bear'"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Louisiana State Legislature designated the Louisiana black bear as the official state mammal on June 15, 1992, through House Concurrent Resolution 37. The designation occurred the same year the U.S. Fish and Wildlife Service listed the subspecies as threatened under the Endangered Species Act, highlighting the urgent need for conservation action to prevent the bear's extinction in Louisiana."
      - "The timing reflected Louisiana's recognition that the black bear population had reached critical levels after decades of habitat destruction and unregulated hunting. By 1992, only 150-170 Louisiana black bears survived in isolated pockets of remaining bottomland hardwood forest. The designation as state mammal elevated public awareness of the bear's plight and demonstrated Louisiana's commitment to preventing the loss of this unique subspecies found nowhere else on Earth, similar to conservation framing on the [Louisiana state bird page](/states/louisiana/bird/brown-pelican)."

    subsections:
      - subtitle: "A Subspecies Unique to the Gulf Coast"
        text: "The Louisiana black bear is a distinct subspecies of American black bear that evolved in the Gulf Coast's bottomland hardwood forests. Scientists recognize it as separate from other black bear subspecies based on skull measurements, genetics, and geographic isolation. Louisiana black bears show adaptations to hot, humid climates including lighter body weight relative to northern bears and behavioral patterns suited to southern forests. The subspecies historically ranged from east Texas through Louisiana and into southern Mississippi, but Louisiana now supports the vast majority of surviving population."

      - subtitle: "Why Louisiana Chose the Black Bear"
        text: "Louisiana selected the black bear because it represents the state's most distinctive wildlife and unique bottomland forest ecosystems. Unlike the white-tailed deer or other common Louisiana mammals, the Louisiana black bear is found only in the Gulf Coast region and specifically depends on Louisiana's signature habitat—the vast river swamps and bottomland hardwood forests along the Mississippi, Atchafalaya, Tensas, and Ouachita rivers. The bear's near-extinction and need for recovery made it an appropriate symbol for Louisiana's broader environmental challenges and conservation commitments."

  - id: "state-symbolism"
    title: "What the Louisiana Black Bear Represents"
    style: "highlight"
    paragraphs:
      - "The Louisiana black bear embodies the wildness that persists in Louisiana's swamps, bayous, and bottomland forests despite centuries of human alteration. These bears navigate landscapes most people never see—the cypress-tupelo swamps where water stands year-round, the dense bottomland forests that flood each spring, the tangled undergrowth of palmetto and greenbrier. The bear's survival in these challenging environments represents Louisiana's unique natural character, the wildness that coexists with human development in ways unlike any other state."
      - "For Louisiana's indigenous peoples including the Chitimacha, Houma, and Choctaw, black bears held spiritual significance and provided important resources. Bears appear in creation stories and traditional knowledge passed through generations. The bear's strength, intelligence, and connection to forest ecosystems made it a respected presence in Native cosmology. European settlers and later Cajun and Creole communities also developed relationships with bears, hunting them for meat and hides while respecting their power and wariness."
      - "The designation symbolizes Louisiana's environmental transformation and the costs of prioritizing economic development over habitat protection. Louisiana lost over 80 percent of its original bottomland hardwood forests to logging and agricultural conversion between 1880 and 1980. This massive habitat destruction nearly eliminated the Louisiana black bear and fundamentally altered the state's ecology. The bear's designation in 1992 acknowledged this loss while committing to preventing complete extinction through habitat restoration and protection."

    subsections:
      - subtitle: "Bottomland Hardwood Forest Dependence"
        text: "Louisiana black bears depend completely on bottomland hardwood forests—the seasonally flooded forests along rivers dominated by oak, sweet gum, cypress, tupelo, and other water-tolerant trees. These forests provide the hard mast (acorns, pecans) and soft mast (berries, fruits) that bears need to build fat reserves for winter denning. Female bears den in large hollow trees or root cavities in bottomland forests, giving birth to cubs during winter. When Louisiana converted millions of acres of bottomland forest to agriculture, especially soybean farming in northeast Louisiana, bear habitat disappeared and populations crashed."

      - subtitle: "The Teddy Bear Connection"
        text: "Louisiana's black bear gained unexpected fame in 1907 when President Theodore Roosevelt traveled to Tensas Parish in northeastern Louisiana for a bear hunting expedition. The hunt went poorly until guides cornered a small black bear and tied it to a tree for Roosevelt to shoot. Roosevelt refused, considering it unsportsmanlike. Political cartoonist Clifford Berryman illustrated the incident, creating an image that inspired toy manufacturers to create 'Teddy's Bear'—the first teddy bears. While this story is often told, it ironically occurred during the period when Louisiana's black bear population was collapsing due to unregulated hunting and habitat loss."

      - subtitle: "Three Isolated Populations"
        text: "Modern Louisiana black bears exist in three geographically isolated populations that cannot easily interbreed due to habitat fragmentation. The Tensas River basin population in northeast Louisiana is the largest and most stable. The Upper Ouachita River population in north-central Louisiana is smaller and more vulnerable. The Atchafalaya River basin population in south-central Louisiana occupies the state's largest remaining bottomland swamp but faces threats from development and hurricanes. This isolation creates genetic concerns—small, isolated populations lose genetic diversity over time, potentially reducing long-term viability."

      - subtitle: "Recovery Through Habitat Protection"
        text: "Louisiana black bear recovery depended primarily on protecting and restoring bottomland hardwood forest habitat. The U.S. Fish and Wildlife Service established or expanded national wildlife refuges including Tensas River, Upper Ouachita, Atchafalaya, and Bayou Teche specifically to protect bear habitat. Private landowners enrolled in conservation easements and habitat restoration programs, planting hardwood trees on former agricultural land. The USDA's Wetlands Reserve Program paid farmers to retire marginal farmland and restore bottomland forests, creating wildlife corridors connecting isolated bear populations."

      - subtitle: "Coexistence Challenges"
        text: "As Louisiana black bear populations recovered, bears increasingly encountered humans in rural communities adjacent to bear habitat. Bears raid garbage cans, damage apiaries seeking honey, feed in agricultural fields, and occasionally enter residences searching for food. Louisiana addressed these conflicts through public education about bear-proof garbage containers, removal of attractants, and bear-resistant beekeeping equipment. The Louisiana Black Bear Conservation Coalition coordinates between wildlife agencies, landowners, and communities to reduce conflicts while maintaining support for bear recovery."

  - id: "identification"
    title: "How to Identify Louisiana Black Bears"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Louisiana black bears are the largest subspecies of American black bear in the Gulf Coast region. They show distinctive skull characteristics that distinguish them from other black bear subspecies, though these differences are subtle and require expert analysis to confirm. In the field, Louisiana bears appear similar to other black bears but typically show adaptations to southern climates."
        list_items:
          - "**Size**: 5-6 feet long when on all fours; males substantially larger than females"
          - "**Weight**: Males 250-450 pounds, females 120-250 pounds; weight varies seasonally"
          - "**Color**: Black to dark brown; lighter than northern bears; some show brown muzzles"
          - "**Distinguishing features**: Broader, flatter skull; longer, narrower muzzle; larger size than other Gulf Coast bears"

      - subtitle: "Seasonal Weight Fluctuations"
        text: "Louisiana black bears show dramatic weight changes across seasons. Bears build fat reserves from late summer through fall, consuming enormous quantities of acorns, pecans, and other foods. Males may gain 100+ pounds in autumn. Pregnant females must accumulate sufficient fat to sustain themselves and nurse cubs through winter denning when they don't eat. By spring emergence, bears have lost 20-40 percent of autumn body weight. These weight fluctuations reflect the boom-and-bust food availability in bottomland forests where mast crop production varies dramatically between years."

      - subtitle: "Adaptations to Southern Climates"
        text: "Louisiana black bears show adaptations to hot, humid Gulf Coast conditions that distinguish them from northern black bears. They have slightly lighter body weights relative to body size, reducing heat stress. Louisiana bears show less pronounced winter dormancy than northern bears—mild Louisiana winters allow bears to remain somewhat active, and some adult males don't den at all. Pregnant females still den to give birth, but denning periods are shorter than in northern populations. These adaptations reflect millions of years of evolution in southern environments."

  - id: "history"
    title: "Louisiana Black Bears Through Time"
    style: "default"
    paragraphs:
      - "Louisiana black bears evolved as a distinct subspecies in the Gulf Coast's bottomland hardwood forests, diverging from other American black bear populations as the last ice age ended and sea levels rose. Genetic studies suggest Louisiana black bears have been isolated from other black bear populations for thousands of years, long enough to develop the distinctive skull characteristics and adaptations that define the subspecies."
      - "When European explorers first encountered Louisiana in the 1500s and 1600s, black bears inhabited bottomland forests throughout the region. The vast Mississippi River alluvial plain—one of North America's largest forested wetlands—supported substantial bear populations. Early French and Spanish colonists documented bears along major rivers, and Native American peoples including the Chitimacha and Houma incorporated bears into their subsistence and spiritual practices."

    subsections:
      - subtitle: "Pre-Settlement Abundance"
        text: "Before European colonization, Louisiana's approximately 20 million acres of bottomland hardwood forest supported black bear populations numbering in the tens of thousands. Bears ranged across the entire Mississippi River alluvial plain from the Arkansas border south to coastal Louisiana, along the Red River and its tributaries, throughout the Atchafalaya Basin, and along smaller coastal rivers. This continuous habitat allowed bears to move freely, maintaining genetic diversity and healthy populations despite natural mortality from flooding, food shortages, and conflicts with other bears."

      - subtitle: "Logging Era Devastation"
        text: "Commercial logging of Louisiana's bottomland hardwood forests began in earnest after the Civil War and accelerated through the early 1900s. Logging companies clear-cut millions of acres of virgin cypress-tupelo swamps and oak-dominated bottomland forests, floating logs to sawmills via rivers and newly dug canals. By 1930, most of Louisiana's virgin bottomland forest had been cut, eliminating prime bear habitat. However, logged forests could regenerate if left alone, so the logging era damaged but didn't permanently eliminate bear habitat."

      - subtitle: "Agricultural Conversion"
        text: "The true disaster for Louisiana black bears came with agricultural conversion of bottomland hardwood forests, particularly in northeast Louisiana's Tensas River basin. Improved drainage technology and federal agricultural policies in the 1960s and 1970s encouraged converting bottomland forests to soybean farming. Between 1960 and 1990, hundreds of thousands of acres of regenerated bottomland forest were cleared and converted to agriculture. Unlike logged forests which could recover, agricultural conversion permanently removed bear habitat. By 1990, Louisiana retained less than 4 million acres of bottomland forest—an 80+ percent loss from pre-settlement conditions."

      - subtitle: "Unregulated Hunting Pressure"
        text: "Simultaneous with habitat loss, unregulated hunting reduced Louisiana black bear numbers. Through the early 1900s, bears were hunted year-round without bag limits. Some hunters killed multiple bears annually for meat, hides, and sport. The combination of shrinking habitat and overhunting proved devastating. Louisiana closed bear hunting in 1987 when biologists recognized populations had crashed to unsustainable levels. By this time, only an estimated 150-170 bears survived in Louisiana, concentrated in three isolated areas with remaining bottomland forest."

      - subtitle: "Federal Listing and Recovery"
        text: "The U.S. Fish and Wildlife Service listed the Louisiana black bear as threatened under the Endangered Species Act in January 1992, the same year Louisiana designated it as state mammal. The listing triggered protections including hunting prohibition, habitat protection on federal lands, and funding for recovery programs. Louisiana Department of Wildlife and Fisheries, in partnership with federal agencies and private conservation organizations, implemented a comprehensive recovery plan focusing on habitat restoration, corridor creation, and public education. These efforts proved successful—by 2016, the population had recovered to 750-1,000 bears, leading to delisting."

  - id: "behavior"
    title: "Louisiana Black Bear Behavior"
    style: "default"

    subsections:
      - subtitle: "Seasonal Activity Patterns"
        text: "Louisiana black bears show less pronounced seasonal dormancy than northern bears due to mild Gulf Coast winters. Pregnant females den in winter to give birth, typically entering dens in December or January and emerging with cubs in March or April. However, adult males and non-pregnant females in Louisiana may remain active through winter, especially during warm periods. Some males don't den at all, continuing to forage through winter when food is available. This flexibility reflects adaptation to Louisiana's climate where winter temperatures rarely drop below freezing for extended periods."

      - subtitle: "Denning Behavior"
        text: "Louisiana black bears den primarily in large hollow trees, preferring living trees with cavities at least 20 feet above ground. These elevated dens provide protection from flooding that regularly inundates bottomland forests. Pregnant females select den sites carefully, seeking secure locations where newborn cubs will be safe. The scarcity of large, hollow trees in logged and second-growth forests creates den site limitations—one factor that slowed bear recovery. Conservation programs specifically protect large hollow trees when found, and some areas have installed artificial dens (culvert-style structures) to supplement natural den sites."

      - subtitle: "Diet and Foraging"
        text: "Louisiana black bears are omnivores with diets varying seasonally based on food availability. Spring diet emphasizes new vegetation and emerging agricultural crops. Summer brings soft mast including berries, fruits, and palmetto hearts. Fall is critical when bears consume hard mast—primarily acorns from various oak species and pecans. Bears must accumulate sufficient fat reserves during fall to survive winter denning. In years when mast crops fail, bears struggle to gain weight, reducing reproductive success and increasing mortality. Bears also consume occasional animal protein including carrion, insects, and rarely small mammals."

      - subtitle: "Reproduction and Cub Rearing"
        text: "Female Louisiana black bears reach sexual maturity at 3-4 years old and typically breed every other year, producing litters of 1-4 cubs (average 2) during winter denning. Cubs are born tiny and helpless in January or February, weighing less than one pound. They nurse and grow rapidly in the den, emerging with their mother in March or April weighing 5-10 pounds. Cubs remain with mothers through their first year, learning to forage and climb trees for safety. Mothers fiercely defend cubs from threats including male bears, which occasionally kill cubs. This slow reproductive rate means bear populations recover slowly even when habitat and food are adequate."

  - id: "conservation"
    title: "Recovery Success and Ongoing Challenges"
    style: "default"
    paragraphs:
      - "The Louisiana black bear's recovery from approximately 150-170 individuals in the early 1990s to 750-1,000 by 2016 represents one of the Endangered Species Act's success stories. However, the species faces ongoing challenges including habitat fragmentation, genetic isolation, climate change impacts, and human-wildlife conflicts in recovering populations. Louisiana's commitment to continued conservation will determine whether recovery proves sustainable or represents a temporary reprieve, especially across corridors discussed in [states neighboring states data](/rankings/geography/states-neighboring-states)."

    subsections:
      - subtitle: "Delisting and Continued Monitoring"
        text: "The U.S. Fish and Wildlife Service removed the Louisiana black bear from the threatened species list in March 2016, declaring recovery goals met. However, delisting didn't eliminate all protections—Louisiana state law continues prohibiting bear hunting, and many bears live on protected federal wildlife refuges and state wildlife management areas. Federal and state biologists continue monitoring bear populations through DNA analysis from hair snares, GPS collar tracking, and trail camera surveys to ensure populations remain stable after delisting."

      - subtitle: "Habitat Corridor Development"
        text: "Louisiana's most significant ongoing conservation effort focuses on creating habitat corridors connecting isolated bear populations. Wildlife biologists identify potential corridor routes—typically following river systems and existing forest patches—and work with private landowners to restore bottomland hardwood forest along these routes. The goal is allowing bears to move between the Tensas, Upper Ouachita, and Atchafalaya populations, reducing genetic isolation and creating a single interconnected population. However, corridor development requires decades to achieve as newly planted trees must mature before providing functional bear habitat."

      - subtitle: "Private Land Conservation"
        text: "Over 80 percent of Louisiana black bear habitat occurs on private land, making private landowner cooperation essential for sustained recovery. The Louisiana Black Bear Conservation Coalition works with landowners to implement bear-friendly forestry practices, establish conservation easements preventing habitat conversion, and resolve bear-human conflicts. Federal programs including the Wetlands Reserve Program and Regional Conservation Partnership Program provide financial incentives for landowners to restore and protect bottomland hardwood forests on their properties. These voluntary conservation partnerships have restored tens of thousands of acres of bear habitat."

      - subtitle: "Climate Change Threats"
        text: "Climate change poses emerging threats to Louisiana black bears through multiple mechanisms. Sea level rise threatens coastal bear habitat in the Atchafalaya Basin, potentially inundating den sites and reducing available habitat. More intense hurricanes damage bottomland forests, killing mast-producing trees and flooding dens. Changing precipitation patterns may alter forest composition, potentially reducing food availability. Additionally, warmer temperatures could affect bear reproduction and cub survival. While these impacts remain largely speculative, climate projections suggest Louisiana's coastal and low-lying bear habitat faces increasing vulnerability."

      - subtitle: "Community Coexistence Programs"
        text: "As bear populations expand, encounters with humans increase in rural Louisiana communities. The Louisiana Department of Wildlife and Fisheries operates the Louisiana Black Bear Hotline for residents to report bear sightings and receive guidance on reducing conflicts. Programs distribute bear-resistant garbage containers, educate beekeepers about electric fencing, and teach farmers to use non-lethal deterrents when bears damage crops. Most Louisianans view bear recovery positively, but maintaining this support requires addressing conflicts effectively and compensating property owners for bear-related damages."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Louisiana black bear connects directly to Louisiana's state motto, 'Union, Justice, Confidence,' adopted in 1864. The bear's recovery required union between federal and state agencies, private conservation organizations, and landowners working toward shared conservation goals. Justice appears in protecting an endangered species and restoring ecosystems damaged by unchecked exploitation. Confidence is needed to believe that habitat restoration and protection can sustain recovered populations long-term despite ongoing development pressures, as outlined on the [Louisiana state motto page](/states/louisiana/motto/union-justice-and-confidence)."
      - "Louisiana designated the brown pelican as state bird in 1966, 26 years before adopting the black bear as state mammal. Both species nearly disappeared from Louisiana due to human activities—pesticides nearly eliminated pelicans while habitat loss nearly eliminated bears. Both recovered through sustained conservation efforts, demonstrating that environmental damage can be reversed through scientific management and public commitment. The paired symbols celebrate Louisiana's most successful wildlife recoveries."

    subsections:
      - subtitle: "Bald Cypress and Bottomland Habitat"
        text: "Louisiana's state tree, the bald cypress, shares habitat with Louisiana black bears in the state's swamps and bottomland forests. Cypress-tupelo swamps provide important bear habitat, particularly during flooding when bears climb cypress trees to escape rising water. Large hollow cypress trees offer excellent den sites for pregnant females. Both the cypress and the bear represent Louisiana's unique wetland ecosystems—the swamps, bayous, and bottomland forests that distinguish Louisiana from other states and support the state's distinctive biodiversity."
        link:
          label: "See Louisiana state tree"
          url: "/states/louisiana/tree/bald-cypress"

      - subtitle: "Brown Pelican Recovery Parallels"
        text: "Louisiana's state bird, the brown pelican, disappeared from the state by the early 1960s due to DDT pesticide causing eggshell thinning. The species was reintroduced beginning in 1968 and recovered sufficiently by 2009 to be removed from the endangered species list. This timeline closely parallels the Louisiana black bear's recovery trajectory—listed in 1992, recovered by 2016. Both symbols represent Louisiana's environmental redemption narrative: acknowledging past environmental destruction while demonstrating successful recovery through sustained conservation commitment."
        link:
          label: "See Louisiana state bird"
          url: "/states/louisiana/bird/brown-pelican"

      - subtitle: "State Motto and Conservation Partnership"
        text: "Louisiana's motto 'Union, Justice, Confidence' applies directly to Louisiana black bear conservation. Union manifests in partnerships between state and federal agencies, private conservation organizations, and thousands of private landowners who protect and restore bear habitat. Justice appears in protecting an endangered species and preventing its extinction. Confidence means trusting that conservation investments will yield long-term results even when recovery takes decades. The bear's successful recovery validates this confidence and demonstrates that united conservation efforts achieve justice for imperiled species."
        link:
          label: "See Louisiana state motto"
          url: "/states/louisiana/motto/union-justice-and-confidence"

