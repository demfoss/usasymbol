seo_title: "Louisiana State Colors | Blue White Gold"
seo_description: "Louisiana state colors are Blue, White, and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Louisiana are **Blue**, **White**, and **Gold**, enacted by the Louisiana Legislature in 1972 under Acts 1972, No. 603, §1. Officially designated in 1972, they appear prominently on [the Louisiana state flag](/states/louisiana/flag/louisiana-state-flag) and throughout official state branding and government communications. For Louisiana, the specifications pair HEX, RGB, CMYK, and Pantone values with context from the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Blue, White, and Gold"
official_since: "1972 (Acts 1972, No. 603, §1; Louisiana Revised Statutes § 49:169.1)"
primary_use: "State Flag, state seal, state government branding, Louisiana state agency insignia"
known_for: "The Pelican Flag — one of the most symbolically complex state flags in the US — depicts a mother brown pelican (Pelecanus occidentalis) wounding her own breast to feed three chicks, a medieval Christian symbol of self-sacrifice adopted by French settlers in Louisiana as early as 1812; blue, white, and gold are the only state colors formally enacted in Louisiana law, enacted by Act 603 of 1972"

