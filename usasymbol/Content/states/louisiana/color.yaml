timeline:
  - year: "1682"
    description: "René-Robert Cavelier, Sieur de La Salle, claims the Louisiana territory for France; the French Tricolor's blue, white, and gold tradition begins its century-long association with the land that would become Louisiana"
  - year: "1812"
    description: "Louisiana admitted to the Union on April 30 as the 18th state; Governor William C. C. Claiborne selects the brown pelican for Louisiana's first territorial seal, establishing the blue-field-and-white-pelican image that will define the state's color tradition"
  - year: "1878"
    description: "Following Reconstruction, the pre-Civil War pelican flag with a white pelican on a blue field returns to common use in Louisiana, establishing blue and white as the state's de facto colors in the post-war period"
  - year: "1912"
    description: "Louisiana General Assembly officially adopts the Pelican Flag on July 1, making the blue-field-and-white-pelican design Louisiana's official state flag; gold accents on the pelican and nest establish the three-color tradition"
  - year: "1972"
    description: "Acts 1972, No. 603, §1 officially designates blue, white, and gold as Louisiana's state colors, codified in Louisiana Revised Statutes § 49:169.1 — one of the few instances in US history of a state legislature formally enacting its colors by name"
  - year: "2010"
    description: "Louisiana adopts a standardized redesign of the Pelican Flag on November 22, specifying 12 official Pantone colors for the crest and reintroducing the three drops of blood on the pelican's breast, completing the most precise color specification in Louisiana flag history"

expert_quote:
  text: "Blue, white and gold became the official colors of the state of Louisiana in 1972 with Acts 1972, No. 603, §1. The blue color of the field is one that stands for truth. The eastern brown pelican depicted in white and gold is the state bird, long used in Louisiana as a symbol of self-sacrifice."
  source: "Louisiana Revised Statutes § 49:169.1 and state color documentation, Louisiana Secretary of State's Office"

faq:
  - question: "What are the official colors of Louisiana?"
    answer: "The official state colors of Louisiana are Blue, White, and Gold, designated by Acts 1972, No. 603, §1 and codified in Louisiana Revised Statutes § 49:169.1. Louisiana is one of the few US states to have officially enacted its state colors through a dedicated legislative statute."
  - question: "What is the HEX code for Louisiana Blue?"
    answer: "The standard HEX code for Louisiana Blue is #002868, corresponding to Pantone PMS 286, representing the solid blue field of the Louisiana state flag as specified in Louisiana Revised Statutes RS 49:153(A)."
  - question: "What is the HEX code for Louisiana Gold?"
    answer: "The standard HEX code for Louisiana Gold is #FDB913, corresponding to Pantone PMS 116, representing the gold accents on the pelican, chick beaks, and nest details of the Louisiana state flag as standardized in the 2010 redesign."
  - question: "Why does Louisiana use a pelican on its flag?"
    answer: "Louisiana uses a brown pelican because the bird was selected by Governor William C. C. Claiborne for Louisiana's first territorial seal in 1812. The pelican in her piety — a medieval Christian symbol of a mother wounding herself to feed her young — resonated strongly with Louisiana's French Catholic settlers and represents the state's commitment to self-sacrifice for its citizens."
  - question: "When were Louisiana's state colors officially designated?"
    answer: "Louisiana's state colors — blue, white, and gold — were officially designated in 1972 by Acts 1972, No. 603, §1, codified in Louisiana Revised Statutes § 49:169.1. This formal legislative designation came 60 years after the Pelican Flag's adoption in 1912."
  - question: "Why does the Louisiana pelican have three drops of blood?"
    answer: "The three drops of blood on the pelican's breast represent the medieval legend that mother pelicans wound themselves to feed their chicks — a symbol of self-sacrifice. The drops were a traditional element of Louisiana's 19th-century flag and seal but were omitted from later renderings. Their absence was discovered by an eighth-grade student in Houma, leading to Act 391 of 2006 requiring their restoration, implemented in the 2010 flag redesign."
  - question: "What are the Mardi Gras colors and how do they relate to Louisiana's state colors?"
    answer: "Louisiana's official Mardi Gras colors are purple (justice), gold (power), and green (faith). Gold is shared between the Mardi Gras palette and the official state colors, connecting Louisiana's most globally recognized cultural celebration directly to its official state color tradition."

