sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Louisiana is one of the few US states to have officially designated its state colors by name through a dedicated legislative act. Acts 1972, No. 603, §1 enacted blue, white, and gold as the official colors of the state of Louisiana, codified in Louisiana Revised Statutes § 49:169.1. This makes Louisiana's color designation significantly more authoritative than states where colors are merely implied from flag design — Louisiana's legislature formally chose these three colors and recorded them in statute. The 1972 act followed decades of the Pelican Flag flying in blue, white, and gold since its 1912 adoption, formally recognizing the color tradition that had defined Louisiana's official imagery since the earliest days of territorial governance and reinforcing the [Brown Pelican as a core state symbol](/states/louisiana/bird/brown-pelican)."
      - "The Louisiana state flag itself — governed by Louisiana Revised Statutes RS 49:153(A) — is one of the most legally detailed flag specifications in the United States. The 2010 redesign standardized a 12-color Pantone palette for the flag's crest, specifying individual Pantone values for the mother pelican's body (Cool Gray 8C), the pelican's yellow-brown crown (PMS 124), the chicks' beaks (PMS 152 and PMS 1375), the drops of blood (PMS 200), multiple nest tones, and the white banner. This level of chromatic specificity — 12 distinct Pantone colors for a single flag design — is exceptional in American state flag history and reflects Louisiana's commitment to visual precision in its official symbolism."
    subsections:
      - subtitle: "The Pelican Flag: From 1812 to 2010"
        text: "The brown pelican's presence on Louisiana's official symbols dates to 1812, when territorial governor William C. C. Claiborne selected the pelican for Louisiana's first territorial seal. The image of the 'pelican in her piety' — a mother pelican wounding her own breast to feed her young — was well known to Louisiana's French Catholic settlers from medieval Christian iconography, where it symbolized Christ's sacrifice and the Eucharist. Louisiana has flown more flags than any other US state, with historians documenting at least nine distinct flag designs prior to the modern Pelican Flag's adoption on July 1, 1912. A critical detail — the three drops of blood on the pelican's breast, traditional in the 19th century flag and seal — was discovered missing from official renderings by an eighth-grade student at Vandebilt Catholic High School in Houma, Louisiana, who brought the omission to his state legislator's attention. This led to Act 391 of 2006 requiring the three blood drops, and the current standardized flag design was formally adopted on November 22, 2010, which also aligns with the identity behind [the Pelican State nickname](/states/louisiana/nickname/the-pelican-state)."
      - subtitle: "Acts 1972, No. 603 and Louisiana Revised Statutes § 49:169.1"
        text: "The legislative record of Act 603 of 1972 places Louisiana among a small group of states that have formally designated their colors through statute rather than through design inference. Louisiana Revised Statutes § 49:169.1 records blue, white, and gold as the state's official colors, providing legal standing that distinguishes Louisiana's color tradition from those of states where colors are merely traditional. The 1972 designation came 60 years after the Pelican Flag's adoption, reflecting the Louisiana Legislature's decision to formally codify what had long been the state's recognized color palette. These same three colors — blue, white, and gold — also dominate Louisiana's official state painting, reinforcing their status as the Commonwealth's primary public imagery across multiple official symbolic contexts."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Louisiana's blue, white, and gold carry one of the richest symbolic layering of any US state color tradition, drawing simultaneously from medieval Christian iconography, French colonial heritage, Caribbean natural history, and American civic values. The blue field is the deep sky and the bayou water; the white pelican is piety and sacrifice; the gold is the light of the subtropical sun and the glory of French Louisiana. Together, the three colors form a palette that is simultaneously European in its heraldic roots and distinctly Louisianan in its natural and cultural specificity — no other state flag encodes the same blend of Catholic theology, ornithological misidentification, and colonial history into its official colors."
    subsections:
      - subtitle: "Blue: Truth and French Colonial Heritage"
        text: "Louisiana's blue represents truth in the state's official color documentation, a traditional heraldic value that connects the flag's field to the broad American patriotic tradition of blue as civic virtue. But Louisiana's blue also carries a specifically French dimension: France governed Louisiana territory from 1682 to 1762 and again from 1800 to 1803, making the blue of the French Tricolor well established in Louisiana's colonial DNA. Louisiana retains the most thoroughgoing French cultural heritage of any US state — French is still spoken in Cajun communities, French-derived Creole culture defines New Orleans's cuisine and music, and French architectural traditions shape the French Quarter. The blue of the Louisiana flag connects this French heritage to the American present, functioning as a color that belongs simultaneously to both traditions. Blue also speaks to Louisiana's defining geography: the state's 7,721 miles of coastline, the vast Lake Pontchartrain, the Mississippi River Delta, and the largest coastal wetland system in the contiguous United States are all defined by deep, reflective blue water."
      - subtitle: "White: Piety, Sacrifice, and the Pelican's Story"
        text: "White on the Louisiana flag carries its meaning primarily through the pelican — rendered in white against the blue field — and through the motto ribbon below the nest. The pelican in her piety is one of the oldest Christian heraldic symbols in Western tradition: medieval bestiaries described the mother pelican wounding her own breast and feeding her blood to starving chicks, a behavior interpreted as an allegory for Christ's sacrifice on the Cross. This symbol was brought to Louisiana by French Catholic missionaries and settlers, for whom it was already familiar from European religious art. Ornithologists note that pelicans do not actually perform this behavior — the confusion likely arose from watching mother pelicans lower their pouches to their chests to allow chicks to feed, which can resemble self-wounding. Louisiana adopted the scientifically incorrect but theologically powerful image as a statement about the state's commitment to its citizens: as the pelican sacrifices herself, so Louisiana sacrifices for its people. White in this context represents the purity of sacrificial intent."
      - subtitle: "Gold: French Glory, Mardi Gras, and the Louisiana Landscape"
        text: "Gold on the Louisiana flag appears in the pelican's plumage details, the chick beaks, and the nest accents as standardized in the 2010 redesign's 12-color Pantone specification. Gold in Louisiana's cultural tradition resonates across multiple dimensions: it is one of the three Mardi Gras colors (gold representing power, alongside purple for justice and green for faith), connecting the state's most globally recognized cultural celebration to its official color palette; it echoes the gold of the French fleur-de-lis that Louisiana's French colonial rulers flew over the territory for over a century; and it evokes the golden tones of Louisiana's subtropical landscape — the yellow-gold of Spanish moss, the golden marshgrass of the Atchafalaya Basin, and the amber light that filters through centuries-old live oak canopies. Louisiana's wings of the pelican are described as visually echoing the fleur-de-lis of France, making gold the color that most directly connects the bird's image to the French colonial heritage that shaped the state's culture."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue, white, and gold dominate the Louisiana state flag, governed by Louisiana Revised Statutes RS 49:153(A), and the Louisiana state seal, which depicts the same pelican-in-her-piety crest as the flag. Both flag and seal specifications are maintained by the Louisiana Secretary of State's office, which provides official artwork for all state agency reproduction. Louisiana Revised Statutes § 49:169.1 designating blue, white, and gold as official state colors means these three colors carry the authority of Louisiana law in all official state communications, publications, and branding. The colors also appear in Louisiana's official state painting. Beyond official governmental contexts, blue, white, and gold are well established in Louisiana's institutional color traditions: Tulane University uses olive green and blue; Louisiana State University uses purple and gold — with LSU's gold directly echoing the state flag's gold tradition; and the New Orleans Saints NFL franchise uses black and gold, making Louisiana one of the states where a major sports franchise's colors most directly reference the state's official palette, similar to broader [states and capital cities reference pages](/rankings/geography/states-capital-cities)."

