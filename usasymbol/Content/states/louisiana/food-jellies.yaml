faq:
  - question: "What are Louisiana's state jellies?"
    answer: "Louisiana's state jellies are mayhaw jelly and Louisiana sugar cane jelly, adopted by the Louisiana Legislature in 2003."
  - question: "When did Louisiana adopt its state jellies?"
    answer: "The Louisiana Legislature designated mayhaw jelly and sugar cane jelly as the official state jellies in 2003."
  - question: "Why did Louisiana choose mayhaw jelly and sugar cane jelly?"
    answer: "Mayhaw berries grow wild in Louisiana's wetlands, and sugar cane has been farmed commercially in the state for centuries, giving both jellies a direct tie to Louisiana's land and crops."
  - question: "Are mayhaw and sugar cane jelly still made in Louisiana today?"
    answer: "Yes, both jellies are still made in Louisiana, often sold at farm stands, festivals, and specialty food shops."

