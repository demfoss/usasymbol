intro_text: "Louisiana's state jellies are mayhaw jelly and Louisiana sugar cane jelly, adopted by the state legislature in 2003 to recognize two preserves tied to the state's wetlands and sugar cane farmland. This profile appears in the [list of U.S. state foods](/symbols/dishes)."

sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Are Louisiana's State Jellies?"
    paragraphs:
      - "Mayhaw jelly and Louisiana sugar cane jelly are Louisiana's official state jellies, designated together by the Louisiana Legislature in 2003. One is made from a wild swamp berry and the other from the syrup of Louisiana's sugar cane crop."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Mayhaw Jelly and Sugar Cane Jelly"
    paragraphs:
      - "Mayhaws are small, tart red berries that grow on trees in swamps, bayous, and wet bottomland across the South, including Louisiana. Their juice is cooked with sugar into a tart, deep red jelly. Louisiana sugar cane jelly is made by boiling down cane syrup, produced from sugar cane grown in the state, into a thick, dark, sweet spread."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How These Jellies Became Louisiana's State Jellies"
    paragraphs:
      - "The Louisiana Legislature designated mayhaw jelly and sugar cane jelly as the state's official jellies together in 2003."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Louisiana Chose These Jellies"
    paragraphs:
      - "Mayhaw trees grow wild in Louisiana's swamps and wetlands, and families in the state have long gathered the berries each spring to make jelly. Sugar cane has been grown commercially in south Louisiana since the 1700s, and the state remains one of the country's leading sugar cane producers, giving cane syrup and sugar cane jelly deep roots in Louisiana farming."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Mayhaw Jelly and Sugar Cane Jelly Facts"
    facts:
      - "Adopted as Louisiana's state jellies in 2003."
      - "Mayhaw berries grow wild in Louisiana's swamps and wet bottomland."
      - "Louisiana is one of the leading sugar cane producing states in the country."
      - "Sugar cane has been grown commercially in Louisiana since the 1700s."

