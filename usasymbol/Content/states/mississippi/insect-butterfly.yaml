sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Mississippi?
  paragraphs:
  - "The spicebush swallowtail, Papilio troilus, is Mississippi's official state butterfly. The Mississippi Legislature designated it in 1991."
  - "Mississippi also has a separate state insect, the European honey bee, adopted earlier in 1980."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Spicebush Swallowtail
  paragraphs:
  - "The spicebush swallowtail is mostly black with a row of pale spots along the wing edges and a wash of blue-green on the hindwings."
  - "Adults have a wingspan of about 3 to 4 inches, giving it a broad, gliding flight."
  - "Caterpillars are pale green with large fake eyespots, a pattern that helps them look like small snakes to predators."

- id: history
  icon: fa-solid fa-landmark
  title: How Mississippi Chose the Spicebush Swallowtail
  paragraphs:
  - "The Mississippi Legislature designated the spicebush swallowtail as the official state butterfly in 1991."
  - "The butterfly is common across the state and feeds on spicebush and sassafras, plants found in Mississippi's woodlands."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Spicebush Swallowtail in Mississippi
  paragraphs:
  - "The spicebush swallowtail is found across Mississippi, especially in woodlands and along forest edges where spicebush and sassafras grow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Spicebush Swallowtail Facts
  facts:
  - "Adopted: 1991, by the Mississippi Legislature."
  - "Scientific name: Papilio troilus."
  - "Wingspan: about 3 to 4 inches."
  - "Caterpillars have large fake eyespots that make them look like small snakes."
  - "Caterpillars feed on spicebush and sassafras leaves."
  - "Mississippi also has a separate state insect, the European honey bee, adopted in 1980."




