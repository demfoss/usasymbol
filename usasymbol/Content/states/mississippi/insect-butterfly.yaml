faq:
- question: What is Mississippi's state butterfly?
  answer: "Mississippi's state butterfly is the spicebush swallowtail, adopted by the Mississippi Legislature in 1991."
- question: When did Mississippi adopt the spicebush swallowtail?
  answer: "Mississippi adopted the spicebush swallowtail as its official state butterfly in 1991."
- question: Why did Mississippi choose the spicebush swallowtail?
  answer: "The spicebush swallowtail is common across Mississippi and feeds on spicebush and sassafras, plants found throughout the state's woodlands."
- question: What does the spicebush swallowtail look like?
  answer: "It is mostly black with pale spots along the wing edges and a wash of blue-green on the hindwings, with a wingspan of about 3 to 4 inches."
- question: Where is the spicebush swallowtail found in Mississippi?
  answer: "It is found statewide, especially in woodlands and along forest edges where spicebush and sassafras grow."
- question: Is the spicebush swallowtail the same as Mississippi's state insect?
  answer: "No. Mississippi's state insect is the European honey bee, adopted in 1980. The spicebush swallowtail is a separate designation, the state butterfly, adopted in 1991."

