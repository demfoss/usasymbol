sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Mississippi's State Fruit?"
    paragraphs:
      - "The blueberry is Mississippi's official state fruit, designated by the Mississippi Legislature in 2023. Blueberries are grown commercially on farms across south Mississippi."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Blueberry"
    paragraphs:
      - "Blueberries are small, round, deep blue berries that grow in clusters on bushes. Mississippi's warm climate suits the rabbiteye blueberry variety, which ripens earlier in the summer than northern highbush varieties."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Blueberry Became Mississippi's State Fruit"
    paragraphs:
      - "The Mississippi Legislature designated the blueberry the official state fruit in 2023."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Mississippi Chose the Blueberry"
    paragraphs:
      - "Blueberry farming has grown into a significant crop for south Mississippi, where the climate favors rabbiteye blueberries, and Mississippi lawmakers recognized the fruit's growing role in the state's agriculture."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blueberry Facts"
    facts:
      - "Adopted as Mississippi's state fruit in 2023."
      - "South Mississippi farms grow rabbiteye blueberries, suited to the region's warm climate."
      - "Mississippi blueberries typically ripen in early summer."

