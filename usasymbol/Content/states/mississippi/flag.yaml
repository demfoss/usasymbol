seo_title: "Mississippi State Flag | New Magnolia Meaning"
seo_description: "Mississippi replaced the most divisive state flag in the country in 2021. The new magnolia design ended 126 years of Confederate symbolism. What changed and why."

intro_text: "Mississippi adopted a new state flag in 2021, replacing a design that included Confederate imagery. The current flag displays a magnolia blossom on a dark blue field surrounded by twenty stars. Gold and red stripes border the design with the phrase In God We Trust below. This page appears in the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Mississippi State Flag Is Designed"
    paragraphs:
      - "The Mississippi state flag is the official civic flag of Mississippi. The background uses a dark blue field. A white magnolia flower sits in the center surrounded by a circle of twenty gold stars."
      - "A single gold star appears above the magnolia representing Mississippi as the twentieth state. Gold and red vertical stripes frame both sides of the design. The national motto In God We Trust appears in gold letters below the magnolia. Courthouses, state offices, and schools across Mississippi display this flag alongside wording associated with the [Mississippi state motto](/states/mississippi/motto/virtute-et-armis)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Mississippi Flag Communicates"
    paragraphs:
      - "The flag represents Mississippi through natural and historical symbolism. The magnolia honors Mississippi's official state flower and tree. The flower has represented Mississippi since the 1800s and appears throughout state culture and identity; see the [official Mississippi state flower](/states/mississippi/flower/magnolia)."
      - "Twenty stars surrounding the magnolia represent Mississippi as the twentieth state admitted to the Union in 1817. A single larger star above the magnolia emphasizes this distinction. The circle of stars also symbolizes unity and Mississippi's place among the states."
      - "Gold represents the wealth of Mississippi's natural resources and spirit. Red symbolizes the blood shed by Mississippians in service to the state and nation. Blue represents vigilance, perseverance, and justice. The motto In God We Trust reflects values shared across Mississippi communities."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Mississippi Flag History and Adoption"
    paragraphs:
      - "Mississippi authorized its current flag in 2021. The legislature retired the previous flag in June 2020 after decades of controversy over its Confederate battle flag imagery. A commission selected a new design from nearly 3,000 public submissions. Voters approved the new flag by a margin of nearly 73 percent in November 2020."
      - "The winning design came from Rocky Vaughan, Sue Anna Joe, Kara Giles, Dominique Pugh, and Micah Whitson working as a team. Their magnolia-centered design emphasized Mississippi's natural heritage and avoided divisive symbols connected to [The Magnolia State nickname](/states/mississippi/nickname/the-magnolia-state). The legislature certified the flag in January 2021. Mississippi officially adopted it on January 11, 2021."
      - "The previous flag dated to 1894 and incorporated the Confederate battle flag in its canton. That design faced increasing opposition in the late twentieth and early twenty-first centuries. Mississippi became the last state to remove Confederate imagery from its official flag when it adopted the new design."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Mississippi Flag"
    versions:
      - name: "Magnolia Flag"
        years: "1861"
        image: "versions/magnolia-1861.webp"
        description: "An unofficial flag used briefly during secession, featuring a magnolia tree on a white field with a red border and blue canton with a white star."

      - name: "Confederate-Era Flag"
        years: "1894–2020"
        image: "versions/confederate-1894.webp"
        description: "Official state flag featuring three horizontal stripes and the Confederate battle flag in the canton, used for 126 years before retirement."

      - name: "Current Magnolia Flag"
        years: "2021–present"
        image: "versions/current-2021.webp"
        description: "The new flag adopted in 2021 featuring a white magnolia blossom, twenty stars, and the motto In God We Trust on a blue field with gold and red borders."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Mississippi Flag"
    symbols:
      - id: magnolia
        name: "Magnolia Blossom"
        image: "symbols/magnolia.svg"
        paragraphs:
          - "A white magnolia flower dominates the flag's center. Mississippi designated the magnolia as its state flower in 1952 and state tree in 1938. The magnolia has symbolized Mississippi since the nineteenth century and appears in the state's nickname, the Magnolia State."
          - "The blossom on the flag shows the distinctive white petals and yellow center of the Southern magnolia. This tree grows throughout Mississippi and the broader South. The magnolia represents beauty, strength, and Mississippi's natural heritage."

      - id: stars
        name: "Twenty Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Twenty gold stars form a circle around the magnolia. These stars represent Mississippi as the twentieth state admitted to the United States on December 10, 1817. The circular arrangement symbolizes unity and equality among the states."
          - "A single larger gold star sits above the magnolia. This diamond-shaped star emphasizes Mississippi's position as the twentieth state. The star also represents aspiration and Mississippi's future."

      - id: stripes
        name: "Gold and Red Stripes"
        image: "symbols/stripes.svg"
        paragraphs:
          - "Vertical gold and red stripes frame both sides of the flag. These stripes add visual balance and color to the design. Gold represents Mississippi's resources and hospitality. Red symbolizes courage and sacrifice."
          - "The stripes create a border that draws attention to the central magnolia and stars. This framing element gives structure to the overall composition."

      - id: motto
        name: "In God We Trust"
        image: "symbols/motto.svg"
        paragraphs:
          - "The phrase In God We Trust appears in gold letters below the magnolia. This national motto has appeared on U.S. currency since 1864 and became the official national motto in 1956."
          - "Including this motto on the state flag was a requirement set by the Mississippi legislature. The phrase reflects values held by many Mississippi residents and connects the state flag to national identity."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Mississippi State Flag Colors"
    paragraphs:
      - "The flag uses dark blue, gold, red, and white. Dark blue forms the field and represents vigilance and justice. Gold appears in the stars, stripes, and text. Red shows in the border stripes. White colors the magnolia blossom, reflecting the broader [Mississippi state colors](/states/mississippi/color/mississippi-traditional-state-colors-red-blue-and-gold)."
    colors:
      - name: "Dark Blue"
        hex: "#002868"
      - name: "Gold"
        hex: "#BF9B30"
      - name: "Red"
        hex: "#C8102E"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Mississippi State Flag Facts"
    facts:
      - "Mississippi adopted its current flag on January 11, 2021"
      - "Voters approved the new design with nearly 73 percent support"
      - "The flag features twenty stars representing Mississippi as the twentieth state"
      - "A team of five designers created the winning flag design"
      - "The previous flag with Confederate imagery was retired in 2020"
      - "Mississippi was the last state to remove Confederate symbols from its flag"

faq:
  - question: "What design is recognized as the state flag of Mississippi?"
    answer: "The Mississippi state flag is the official banner of Mississippi. It features a white magnolia blossom surrounded by twenty gold stars on a dark blue field with gold and red borders and the motto In God We Trust."

  - question: "What does Mississippi's flag look like?"
    answer: "The flag shows a white magnolia flower in the center with twenty gold stars in a circle around it and one larger star above. Gold and red stripes border the sides. The phrase In God We Trust appears below the magnolia on a dark blue background."

  - question: "What meaning is attached to Mississippi's flag?"
    answer: "The flag represents Mississippi's natural heritage through the magnolia and its history as the twentieth state through twenty stars. The colors symbolize vigilance, courage, and resources."

  - question: "How do historians explain the symbolism of Mississippi's flag?"
    answer: "The flag means Mississippi's identity through its state flower and admission as the twentieth state. The magnolia represents natural beauty and strength. The stars symbolize unity and Mississippi's place in the Union."

  - question: "When did Mississippi adopt its current state flag?"
    answer: "Mississippi officially adopted its current state flag on January 11, 2021, after voters approved it in November 2020, with regional context shown in [states neighboring states](/rankings/geography/states-neighboring-states)."

  - question: "What led Mississippi to replace its earlier flag?"
    answer: "Mississippi changed its state flag in 2021, retiring a previous design from 1894 that included Confederate battle flag imagery."

  - question: "What are the main visual elements on Mississippi's flag?"
    answer: "The new Mississippi state flag features a white magnolia blossom, twenty gold stars, gold and red border stripes, and the motto In God We Trust on a dark blue field. It was adopted in 2021."

  - question: "What symbols appear on the Mississippi state flag?"
    answer: "Twenty-one stars appear on the Mississippi state flag: twenty stars in a circle around the magnolia plus one larger star above it, representing Mississippi as the twentieth state."

