seo:
  title: "Most Common Last Names in Mississippi, With Origins"
  description: "The most common last names in Mississippi are Smith, Williams, and Johnson, shaped by cotton, emancipation, and a distinct French Gulf Coast."

page:
  h1: "Most Common Last Names in Mississippi"
  intro: "Smith, Williams, and Johnson were the most common last names in Mississippi in 2026, a ranking shaped by the state's cotton economy, emancipation-era surname adoption, and older Anglo settlement from Natchez into the interior. The Gulf Coast adds a smaller but unusually visible layer of French and Spanish names such as Ladner, Necaise, and Cuevas."
  heritage_title: "Cotton Mississippi and the French Coast"
  heritage_body: "French colonists planted Mississippi's earliest European surname layer at Fort Maurepas near Ocean Springs in 1699 and Fort Rosalie at Natchez in 1716. After the Mississippi Territory was organized in 1798, migrants from Virginia and the Carolinas surged in, and the Choctaw land cessions of the 1820s and Treaty of Dancing Rabbit Creek in 1830 opened millions of acres to white settlement. The Delta filled later than Natchez and the hill country, and after 1865 Freedmen's Bureau labor and marriage records helped fix surnames like Williams, Johnson, Jackson, and Harris across Black Mississippi."
  fun_fact: "Dedeaux ranks only 624th statewide, yet Forebears attributes just over half of all U.S. Dedeaux households to Mississippi, showing how tightly the Hancock and Harrison coast preserved old French family lines."

surnames:
  - rank: 1
    name: Smith
    count: 49547
    ratio: 63
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker or blacksmith. Smith became Mississippi's top surname because it arrived early with Anglo-American migrants into the Natchez District and then spread across both white and Black communities during the cotton era. Its plain English form also made it a common legal surname after emancipation."

  - rank: 2
    name: Williams
    count: 35818
    ratio: 87
    origin: english
    type: Patronymic
    meaning: "Means son of William, from Norman French and Germanic 'Willahelm', will plus helmet. Williams runs especially strong in Mississippi because the state had one of the nation's largest enslaved populations before 1865 and a vast Black rural population afterward. In Delta and central counties, it became one of the surnames most firmly rooted through emancipation, sharecropping, and church records."

  - rank: 3
    name: Johnson
    count: 34217
    ratio: 92
    origin: english
    type: Patronymic
    meaning: "Means son of John, from Hebrew 'Yohanan', God is gracious. Johnson was already common among settlers entering Mississippi after 1798 and later became widespread in Black communities that formalized family names after the Civil War. Its reach across race and region helps explain why it stays near the top statewide."

  - rank: 4
    name: Jones
    count: 33467
    ratio: 94
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John, built from 'Ioan' or 'Siôn'. Jones came south with British and Appalachian migrants and then gained a second Mississippi life among both freedpeople and the Mississippi Choctaw, for whom Jones became a notably common English surname. That dual history keeps the name unusually prominent from the hill counties to the Delta."

  - rank: 5
    name: Brown
    count: 28135
    ratio: 111
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', referring to brown hair, clothing, or complexion. Brown is one of the oldest descriptive surnames in English and spread easily in Mississippi because it belonged to no single ethnic enclave. It appears heavily in both plantation counties and upland counties, giving it a broad statewide footprint."

  - rank: 6
    name: Davis
    count: 25564
    ratio: 123
    origin: welsh
    type: Patronymic
    meaning: "Means son of David, from Hebrew 'Dawid', beloved, often transmitted through Welsh usage. Davis was part of the early southern migration into Mississippi's river counties and hill country in the early 1800s. The surname later remained common in farm communities tied to cotton, timber, and county-seat trade."

  - rank: 7
    name: Moore
    count: 16995
    ratio: 184
    origin: english
    type: Habitational
    meaning: "From Old English 'mor', someone who lived by a moor or open rough ground. In Mississippi, Moore fits both older English naming habits and the geography of upland settlement in the east and north. The name is common enough to bridge the hill country, the capital region, and the Delta."

  - rank: 8
    name: Jackson
    count: 16743
    ratio: 187
    origin: english
    type: Patronymic
    meaning: "Means son of Jack, a medieval form of John. Jackson gained extra visibility in Mississippi because Andrew Jackson's era overlapped with the state's opening to white settlement and Indian removal, and because the capital itself bears the name. After emancipation, it also became a major African American surname across central and western Mississippi."

  - rank: 9
    name: Harris
    count: 15674
    ratio: 200
    origin: english
    type: Patronymic
    meaning: "Means son of Harry, a medieval form of Henry from Germanic roots meaning home ruler. Harris is widespread across Mississippi's Black Belt and Delta counties, where post-1865 legal naming and later sharecropping communities reinforced familiar English surnames. It also appears in older white settlement records from the territorial period."

  - rank: 10
    name: Taylor
    count: 15378
    ratio: 204
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth or tailor. Taylor moved into Mississippi with the same southern migration streams that built county seats and market towns after 1798. Because it was a standard English trade surname rather than a local ethnic marker, it spread evenly across much of the state."

  - rank: 11
    name: Wilson
    count: 14250
    ratio: 220
    origin: english
    type: Patronymic
    meaning: "Means son of Will, a short form of William. Wilson followed English and Scots-Irish families into Mississippi's interior during the early statehood years and remained strong in the pine belt and hill counties. Its broad southern distribution kept it prominent even as newer migration patterns changed other regions."

  - rank: 12
    name: White
    count: 13895
    ratio: 225
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually referring to fair hair or a light complexion. White is one of those simple English surnames that appears early in Mississippi records and stays durable because it crossed social and regional lines. It remains common in both older river counties and inland farming counties."

  - rank: 13
    name: Thomas
    count: 13451
    ratio: 233
    origin: welsh
    type: Patronymic
    meaning: "From Aramaic 'Toma', twin, transmitted through the given name Thomas. Mississippi inherited Thomas from the British surname stock that moved in through Natchez and overland routes in the early nineteenth century. The name remained especially durable in church-centered rural communities where biblical given names often became surnames."

  - rank: 14
    name: Walker
    count: 12609
    ratio: 248
    origin: english
    type: Occupational
    meaning: "From Old English 'wealcere', a fuller who trod cloth to clean and thicken it. Walker is one of Mississippi's strongest occupational surnames and traveled with migrants from the older South into the hill country and pine woods. The name also stayed visible in Black communities tied to cotton and timber labor."

  - rank: 15
    name: Robinson
    count: 12476
    ratio: 251
    origin: english
    type: Patronymic
    meaning: "Means son of Robin, a medieval diminutive of Robert. Robinson is especially characteristic of the lower Mississippi Valley because it spread through both British settlement and African American family naming after emancipation. In Mississippi, that combination made it more durable than many narrower regional surnames."

  - rank: 16
    name: Miller
    count: 12359
    ratio: 254
    origin: english
    type: Occupational
    meaning: "From Middle English 'miller', the operator of a grain mill. Mississippi never had the same German Miller story as some Midwestern states, so here the name mainly reflects older English and Scots-Irish settlement. Its staying power comes from how universal the occupation once was in rural county economies."

  - rank: 17
    name: Thompson
    count: 12193
    ratio: 257
    origin: english
    type: Patronymic
    meaning: "Means son of Thom, a short form of Thomas, with the inserted 'p' added in later English spelling. Thompson moved into Mississippi with the same Anglo-American population surge that followed territorial organization and early statehood. It remained common in both the northern hill counties and the western plantation belt."

  - rank: 18
    name: Clark
    count: 11415
    ratio: 274
    origin: english
    type: Occupational
    meaning: "From Old English and Old French forms of clerk, originally a literate scribe or church official. Clark appears early in Mississippi because frontier communities needed clerks, merchants, and courthouse officials as new counties formed. The surname's administrative flavor fits a state that expanded rapidly after 1817."

  - rank: 19
    name: Anderson
    count: 11044
    ratio: 284
    origin: scottish
    type: Patronymic
    meaning: "Means son of Anders or Andrew, from Greek 'Andreas', manly. Anderson reflects the Scots and Scots-Irish element in Mississippi's upland settlement, especially in the northeastern counties and pine belt. It stayed in the top twenty because those migration routes remained influential long after the frontier closed."

  - rank: 20
    name: Martin
    count: 10868
    ratio: 288
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', associated with Mars and spread by Saint Martin. Martin has more than one Mississippi path: it belongs to the old British-American surname stock, but it also fits the state's French and Catholic Gulf Coast tradition. That mixed heritage helps the name appear statewide rather than in one narrow enclave."

unique_surnames:
  - name: Dedeaux
    state_rank: 624
    national_rank: 21081
    origin: french
    why: "Dedeaux is a French Gulf Coast surname tied to old Catholic communities in Hancock and Harrison counties. Mississippi preserves more than half of all U.S. Dedeaux households, which is extraordinary for a relatively uncommon name. It survives because the coast stayed connected to French colonial and New Orleans networks long after the rest of the state became overwhelmingly Anglo-American."

  - name: Ladner
    state_rank: 95
    national_rank: 5347
    origin: other
    why: "Ladner is one of the clearest Mississippi Coast surnames. Local family histories trace the Gulf Coast line to Christian Ladner, on the coast by 1719, and the name still clusters around Bay St. Louis, Waveland, and nearby Hancock County communities. Mississippi accounts for about half of all U.S. Ladner households, giving the surname an unusually strong Mississippi Coast concentration."

  - name: Necaise
    state_rank: 356
    national_rank: 19164
    origin: french
    why: "Necaise is a French Catholic coast surname so localized that a Hancock County community is still called Necaise Crossing. The name belongs to the same Bay St. Louis and Pass Christian world that preserved French settlement patterns, Catholic parishes, and intermarried coastal families. Nearly three quarters of U.S. Necaise households are in Mississippi."

  - name: Bosarge
    state_rank: 925
    national_rank: 18652
    origin: french
    why: "Bosarge is another Gulf surname that makes little sense unless you know the Mississippi and Mobile coast. On the Mississippi side it is rooted in seafood, boatbuilding, and Catholic coastal communities in Jackson, Harrison, and neighboring counties. Mississippi alone holds nearly a third of all U.S. Bosarge households."

  - name: LeFlore
    state_rank: 972
    national_rank: 12484
    origin: french
    why: "LeFlore points to a specifically Mississippi story because the name is inseparable from Choctaw leader Greenwood LeFlore and from Leflore County in the Delta, which was named for him. The surname links French fur-trade ancestry to Choctaw political history and the upheaval of removal in the 1820s and 1830s. That mix gives LeFlore a meaning in Mississippi that it does not carry in most other states."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Five of Mississippi's top 20 surnames are occupational: Smith, Taylor, Walker, Miller, and Clark. That is a strong showing, but the group is still outranked by patronymics because Mississippi's surname history comes more from Anglo-American settlement and post-emancipation naming than from later immigrant trades. Smith's first-place finish gives the whole category unusual weight."
    examples:
      - Smith (metalworker)
      - Taylor (tailor)
      - Clark (clerk)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Mississippi's top 20, accounting for 11 names including Williams, Johnson, Jones, Davis, Jackson, Harris, Wilson, Thomas, Robinson, Thompson, and Anderson. That heavy share reflects the British surname stock that entered after 1798 and the continuity of the same familiar names in Black communities after 1865. A small set of recurring given names generated much of the state's surname list."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Jackson (son of Jack)
      - Anderson (son of Anders)

  - type: Descriptive or Place-Based Names
    icon: fa-solid fa-map-location-dot
    description: "Brown and White represent descriptive surnames, while Moore carries a place-based landscape meaning. This category is smaller than the patronymic tier, but it helps explain why Mississippi's list still looks plain-English even after French coastal settlement and Choctaw history are taken into account. The most distinctive state signatures, such as Dedeaux and Necaise, sit outside the top 20 rather than changing its core pattern."
    examples:
      - Brown (brown hair or complexion)
      - White (fair hair or complexion)
      - Moore (near a moor)

faq:
  - question: "What are the most common last names in Mississippi?"
    answer: "The most common last names in Mississippi are Smith, Williams, Johnson, Jones, and Brown. In this dataset, Smith ranks first statewide, followed by Williams and Johnson. The order reflects both older Anglo-American settlement and the long legacy of emancipation-era surname formation in a heavily rural cotton state."

  - question: "Why are Williams and Johnson so common in Mississippi?"
    answer: "Williams and Johnson are especially common in Mississippi because both became deeply rooted in Black communities after emancipation in 1865 while already existing in the state's British-American surname pool. Mississippi's large enslaved population, followed by decades of sharecropping in the Delta and Black Belt, helped keep those names near the top. Freedmen's Bureau marriage and labor records from Mississippi show exactly the period when many such surnames became fixed in law and family use."

