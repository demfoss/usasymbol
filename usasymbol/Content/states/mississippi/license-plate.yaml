sections:
- id: hospitality-state
  icon: fa-solid fa-magnolia
  title: The Hospitality State and the 1977 Magnolia Plate
  paragraphs:
  - 'Mississippi''s first graphic plate arrived in 1977 with a green magnolia blossom centered on a reflective white background and "The Hospitality State" rendered inside it. It was a design that used the state''s defining plant and its best-known civic virtue in the same image — the magnolia carrying the slogan rather than sitting beside it. The Automobile License Plate Collectors Association agreed: the plate won their Plate of the Year award, the top recognition in American license plate collecting.'
  - '"The Hospitality State" is one of Mississippi''s recognized informal nicknames alongside the official [Magnolia State](/states/mississippi/nickname). The phrase reflects a Deep South tradition of welcome and manners that Mississippi has long presented as a regional characteristic. Putting it on the plate in 1977 was a deliberate identity choice: not geography, not history, but the way people behave when you arrive. The slogan was removed from the design in 1981 but left an impression that outlasted its four-year run.'
  - 'The magnolia the 1977 plate chose was the same flower and tree that define Mississippi''s symbol set more thoroughly than any other state. The [magnolia flower](/states/mississippi/flower) and the [Southern Magnolia tree](/states/mississippi/tree) come from the same species; the [state flag](/states/mississippi/flag) carries the blossom; and the state''s main nickname is built around it. The plate made the connection visible on every car registered in the state.'

- id: birthplace-of-american-music
  icon: fa-solid fa-guitar
  title: The 2012 Plate — B.B. King, Lucille, and the Blues Trail
  paragraphs:
  - 'The 2012 standard plate made a claim no other state plate could: a gold banner across the design reading "Birthplace of American Music," beside a rendering of Lucille — the name B.B. King gave to every guitar he played. King was born in Itta Bena, Mississippi in 1925, and he brought the Delta blues from the Mississippi fields and juke joints to concert halls across the world. Putting his guitar on the standard plate was a statement that Mississippi''s most significant export was not agricultural or industrial but musical.'
  - 'The plate was developed in collaboration with the Mississippi Development Authority as the state was building out its Blues Trail — a network of historical markers across the Delta documenting the musicians, venues, and communities that produced American blues. The plate and the trail made the same argument from different directions: that the music Americans call the blues, the foundation from which jazz, rock and roll, and soul developed, was born in Mississippi.'
  - 'The guitar on the plate generated immediate debate among King''s fans. Lucille was, for most of his career, a black Gibson ES-355 — but the plate depicted the guitar in blue, the dominant color of the design. Collectors and fans pointed out the discrepancy. The plate ran through 2018 with the blue rendering unchanged, and the larger historical claim on the gold banner proved more durable in public memory than the color argument beneath it. For how Mississippi''s musical heritage connects to the state''s broader identity, see the [Mississippi state motto](/states/mississippi/motto) and [state flag](/states/mississippi/flag), both of which trace a different, older claim about the state''s character.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Mississippi License Plate Designs by Era
  paragraphs:
  - Mississippi has produced some of the most visually inventive standard plates in the country, earning the top collectors' award twice and generating national conversation with each major redesign.
  versions:
  - name: The Hospitality State (magnolia)
    years: 1977–1981
    image: /images/license-plates/mississippi/1977-hospitality-state-plate.jpg
    description: Mississippi's first graphic plate — a green magnolia blossom centered on reflective white, with "The Hospitality State" rendered inside the flower. Won the Automobile License Plate Collectors Association Plate of the Year award. The slogan ran four years before being removed in 1981, leaving the state name and serial without promotional text for the next two decades.
  - name: Biloxi Lighthouse
    years: 2007–2012
    image: /images/license-plates/mississippi/2007-biloxi-lighthouse-plate.jpg
    description: A multicolored plate depicting the Biloxi Lighthouse — one of the few lighthouses in the country built before the Civil War that still stands on the Gulf Coast. Won the ALPCA Plate of the Year award, making Mississippi one of the few states to have earned the top collectors' distinction twice. Ran through 2012 before the music-themed redesign.
  - name: Birthplace of American Music
    years: 2012–2018
    image: /images/license-plates/mississippi/2012-birthplace-american-music-plate.jpg
    description: White background, blue design elements, and a gold banner reading "Birthplace of American Music" alongside a rendering of B.B. King's Lucille guitar. Developed in connection with Mississippi's Blues Trail marketing initiative. Fans noted the guitar was depicted in blue rather than Lucille's actual black — the plate ran six years with the rendering unchanged.
  - name: State Seal (gold gradient)
    years: 2019–2023
    image: /images/license-plates/mississippi/2019-state-seal-plate.jpg
    description: A gold gradient plate displaying the Mississippi state seal — a return to formal state imagery after the music-era design. Generated controversy because the seal version used on the plate included "In God We Trust," language added to the seal in 2014 that faced legal challenges. Ran through 2023.
  - name: Magnolia / blue circle
    years: 2024–present
    image: /images/license-plates/mississippi/2024-magnolia-plate.jpg
    description: The current standard plate, introduced for January 2024 renewals and listed by the Department of Revenue as the 2024–2029 series — white background with a central navy blue circle containing a magnolia blossom. Designed by Leah Frances Eaton of Starkville, chosen from over 400 contest submissions. Returns Mississippi plates to the magnolia imagery of the 1977 original, without a text slogan.

- id: magnolia-thread
  icon: fa-solid fa-rotate
  title: The Magnolia Running Through Mississippi Plates
  paragraphs:
  - 'Mississippi''s plate history begins and ends with the magnolia. The 1977 plate built its entire graphic around the blossom. The 2024 plate returns to that same image — a navy magnolia centered on white — without needing the "Hospitality State" text to explain what the flower means. The plant is so thoroughly embedded in Mississippi''s official identity that the image alone does the work the 1977 slogan did.'
  - 'The two plates in between — the Biloxi Lighthouse and the Birthplace of American Music — made different arguments. The lighthouse pointed to Gulf Coast history and survival; the music plate claimed national cultural credit for the Delta blues. Both earned attention outside the state. Both were eventually replaced by a design that went back to the most reliable thing Mississippi had: the tree and flower that gave the state its main [nickname](/states/mississippi/nickname), appear on the [state flag](/states/mississippi/flag), and grow on almost every piece of its land.'
  - 'For how other states have chosen what to put on their plates, see the [U.S. license plate slogans by state](/license-plates) guide.'

timeline:
- year: '1912'
  description: Mississippi begins issuing official motor vehicle license plates.
- year: '1977'
  description: Mississippi's first graphic plate — a green magnolia blossom with "The Hospitality State" inside — is issued and wins the ALPCA Plate of the Year award.
- year: '1981'
  description: '"The Hospitality State" slogan is removed from the plate design. Mississippi plates carry no promotional text for the next two-plus decades.'
- year: '2007'
  description: Mississippi issues the Biloxi Lighthouse plate — a multicolored design that wins the ALPCA Plate of the Year award, the second time Mississippi has earned that distinction.
- year: '2012'
  description: The Birthplace of American Music plate is issued — a gold banner, B.B. King's Lucille guitar in blue on white, developed alongside the Mississippi Blues Trail. Fans dispute the color rendering of Lucille.
- year: '2018'
  description: The Birthplace of American Music plate is retired after six years.
- year: '2019'
  description: Mississippi issues a gold gradient plate bearing the state seal, which includes "In God We Trust" — language added in 2014 that had faced legal challenges.
- year: '2024'
  description: A new 2024–2029 standard plate — navy blossom on a blue circle on white — begins with January renewals. Designed by Leah Frances Eaton of Starkville from over 400 contest submissions, it returns to magnolia imagery for the first time since 1981 and carries no text slogan.

faq:
- question: What is Mississippi's license plate slogan?
  answer: Mississippi's current standard passenger plate does not have a text slogan. The state's best-known historical plate slogans are "The Hospitality State" (1977–1981, on the first graphic plate with a magnolia) and "Birthplace of American Music" (2012–2018, with B.B. King's Lucille guitar).
- question: What was the 1977 Mississippi license plate?
  answer: The 1977 Mississippi plate was the state's first graphic design — a green magnolia blossom on reflective white with "The Hospitality State" inside the flower. It won the Automobile License Plate Collectors Association Plate of the Year award.
- question: Why does Mississippi's 2012 plate say "Birthplace of American Music"?
  answer: Mississippi developed the 2012 plate in connection with its Blues Trail marketing initiative, claiming credit for the Delta blues — the musical form that underpins American jazz, rock and roll, and soul. B.B. King, born in Itta Bena, Mississippi, was chosen as the representative figure, and his guitar Lucille was depicted on the plate.
- question: What guitar is on the Mississippi license plate?
  answer: The 2012 Mississippi plate depicted Lucille — the name B.B. King gave to every guitar he played throughout his career. The rendering was controversial among fans because Lucille was historically a black Gibson ES-355, but the plate showed the guitar in blue.
- question: What does the current Mississippi license plate look like?
  answer: The current Mississippi plate, introduced for January 2024 renewals and listed as the 2024–2029 series, shows a navy magnolia blossom inside a blue circle on a white background. It was designed by Leah Frances Eaton of Starkville and chosen from over 400 competition submissions. It has no text slogan.
- question: How many times has Mississippi won ALPCA Plate of the Year?
  answer: Mississippi has won the Automobile License Plate Collectors Association Plate of the Year award twice — for the 1977 Hospitality State magnolia plate and for the 2007 Biloxi Lighthouse plate.

