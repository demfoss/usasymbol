intro_text: 'Mississippi''s current 2024 magnolia standard plate has no text slogan. The state''s major passenger-plate slogans are **"The Hospitality State"** on the 1977 graphic magnolia plate and **"Birthplace of American Music"** on the 2012 music plate. **"The Magnolia State"** is a nickname, not the present plate wording. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: 'Mississippi''s notable plate slogans are "The Hospitality State" (1977–1981, on the first graphic plate with a magnolia blossom) and "Birthplace of American Music" (2012–2018, with B.B. King''s Lucille guitar on a gold banner). The current 2024–2029 standard plate uses a magnolia design by Leah Frances Eaton of Starkville, but it does not have a text slogan.'
