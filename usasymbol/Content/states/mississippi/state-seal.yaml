type: State Seal
state: Mississippi
name: Great Seal of Mississippi
adopted_year: 1817
revised_year: 2014
is_official: true
legislation: Mississippi Code Ann. § 3-3-15
meaning: "The Great Seal of Mississippi centers on an American eagle modeled directly on the Great Seal of the United States, using the same paired symbolism: an olive branch in the right talon for peace, and a bundle of arrows in the left for the power of defense. The shield on the eagle's breast carries 11 alternating white and red stripes with a blue chief bearing 11 white stars. The original design was adopted in 1798 when Mississippi was still a territory; it became the state seal in 1817 when Mississippi entered the Union as the 20th state. In 2014, the Mississippi legislature added the inscription 'In God We Trust' to the margin beneath the eagle."
