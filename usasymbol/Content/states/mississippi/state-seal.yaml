sections:
- id: history
  icon: fa-solid fa-landmark
  title: Mississippi State Seal History and Origin
  paragraphs:
  - "Mississippi's seal predates statehood. Congress organized the Mississippi Territory on January 19, 1798, and a territorial seal was adopted at that time. The design drew directly from the Great Seal of the United States, placing an American eagle at the center with an olive branch and arrows in its talons and a shield on its breast."
  - "When Mississippi entered the Union as the 20th state on December 10, 1817, the territorial seal was carried forward as the official state seal. The core composition, eagle, talons, and shield, has remained the basis of the Mississippi seal ever since."
  - "In 2014, the Mississippi legislature passed Senate Bill 2681, adding the inscription 'In God We Trust' to the margin beneath the eagle. The text is bracketed by a star on each side. The 2014 change was the first modification to the seal's text in the modern era."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Mississippi State Seal Symbols Mean
  paragraphs:
  - "Mississippi's state seal organizes its imagery around a central American eagle. The composition follows the structure of the Great Seal of the United States, with each element carrying a specific meaning about sovereignty and state character."
  elements:
  - id: eagle
    name: American Eagle
    image: /images/state-seals/mississippi/elements/eagle.webp
    paragraphs:
    - "The spread American eagle is the central and largest figure on Mississippi's seal. The eagle faces the viewer with wings raised and head held upright, a pose drawn directly from the Great Seal of the United States. Mississippi's territorial government adopted this figure in 1798, connecting the new territory to the visual language of the federal republic from its earliest official moment."
    - "The eagle's posture, wings spread and head up, was the standard emblem of American governmental authority from the 1780s onward. For Mississippi, adopting it in 1798 was a statement of alignment with the federal framework."
  - id: shield
    name: Shield on Eagle's Breast
    image: /images/state-seals/mississippi/elements/shield.webp
    paragraphs:
    - "The shield on the eagle's breast has 11 vertical alternating white and red stripes, topped by a blue chief bearing 11 white five-pointed stars. The shield is placed on the eagle's breast rather than carried separately, following the design of the U.S. Great Seal, where the shield represents the strength the eagle draws from within rather than an external instrument."
    - "The U.S. Great Seal uses 13 stripes for the original 13 colonies. Mississippi's shield carries 11 of each."
  - id: olive-branch
    name: Olive Branch
    image: /images/state-seals/mississippi/elements/olive-branch.webp
    paragraphs:
    - "The eagle holds an olive branch in its right talon. The olive branch is a classical symbol of peace, used in Greek and Roman antiquity and embedded in American federal symbolism through the Great Seal of the United States. On the U.S. Great Seal, the olive branch in the right talon represents the nation's preference for peaceful relations."
    - "On Mississippi's seal, the olive branch carries the same meaning. It is the dominant element in the talon facing right, which in heraldic terms is the position of precedence, indicating that peace is the state's primary orientation."
  - id: arrows
    name: Bundle of Arrows
    image: /images/state-seals/mississippi/elements/arrows.webp
    paragraphs:
    - "The eagle holds a bundle of three arrows in its left talon. On the Great Seal of the United States, the arrows represent the power to wage war when peace fails. Mississippi's seal uses the same figure: three arrows bundled together, signaling collective strength rather than a single capacity."
    - "The pairing of the olive branch in the right talon with the arrows in the left was deliberate in the original U.S. design and carries the same logic on Mississippi's seal. Neither element alone is sufficient; together they express a complete posture toward the outside world."
  - id: in-god-we-trust
    name: In God We Trust (2014)
    image: /images/state-seals/mississippi/elements/motto.webp
    paragraphs:
    - "The inscription 'In God We Trust' appears in the margin beneath the eagle, bracketed by a single star on each side. The text was not part of the original 1798 or 1817 design. The Mississippi legislature added it in 2014 through Senate Bill 2681, signed by Governor Phil Bryant."
    - "The 2014 change replaced a single star that had previously appeared at the base of the seal's margin. 'In God We Trust' is the national motto of the United States, adopted by Congress in 1956. Its addition to the Mississippi seal placed the state directly in that tradition."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Mississippi State Seal'
  paragraphs:
  - "The core composition of Mississippi's seal, an eagle with olive branch and arrows over a shield, has not been replaced since the territorial design of 1798. What has changed is the text in the margin beneath the eagle."
  - "The 2014 revision was the most significant modern update: a star at the base of the seal was replaced with the inscription 'In God We Trust' flanked by two smaller stars. The eagle, shield, olive branch, and arrows remained exactly as before."
  versions:
  - name: Territorial and State Seal (1798-2014)
    years: 1798–2014
    image: /images/state-seals/mississippi/versions/seal-of-mississippi-1879-2014.svg
    description: The original design adopted by the Mississippi Territory in 1798 and carried forward as the state seal in 1817. The eagle, olive branch, arrows, and breast shield have remained unchanged. A single star appeared in the margin beneath the eagle.
  - name: Current Seal (2014-present)
    years: 2014–present
    image: /images/state-seals/mississippi/versions/seal-of-mississippi-2014.svg
    description: Senate Bill 2681, signed by Governor Phil Bryant and effective July 1, 2014, replaced the star at the base of the margin with the inscription "In God We Trust" bracketed by a star on each side. The eagle composition is unchanged.

- id: facts
  icon: fa-solid fa-lightbulb
  title: Mississippi State Seal Facts
  facts:
  - "First adopted: 1798, when Congress organized the Mississippi Territory"
  - "Became state seal: December 10, 1817, when Mississippi entered the Union as the 20th state"
  - "Central figure: American eagle, wings spread, modeled on the Great Seal of the United States"
  - "Right talon: olive branch (peace)"
  - "Left talon: bundle of three arrows (military readiness)"
  - "Breast shield: 11 alternating white and red stripes, blue chief with 11 white five-pointed stars"
  - "'In God We Trust' added in 2014 via Senate Bill 2681, signed by Governor Phil Bryant"
  - "The coat of arms (a separate Mississippi emblem adopted in 1894) features the motto Virtute et Armis and is distinct from the state seal"

timeline:
- year: '1798'
  description: Congress organizes the Mississippi Territory on January 19. A territorial seal is adopted, featuring a spread American eagle with olive branch, arrows, and a starred shield on its breast.
- year: '1817'
  description: Mississippi is admitted to the Union as the 20th state on December 10. The territorial seal is designated as the official state seal without alteration to the design.
- year: '1894'
  description: Mississippi adopts a separate coat of arms, distinct from the state seal, featuring a blue shield, cotton stalks, and the motto Virtute et Armis (By Valor and Arms).
- year: '2014'
  description: Senate Bill 2681 is signed by Governor Phil Bryant and takes effect July 1. The star at the base of the seal's margin is replaced with the inscription "In God We Trust" bracketed by two stars.

faq:
- question: What does the Mississippi state seal show?
  answer: Mississippi's state seal features a spread American eagle at center, holding an olive branch in its right talon and a bundle of three arrows in its left. A shield on the eagle's breast has 11 alternating white and red stripes under a blue chief with 11 white stars. The inscription "In God We Trust" appears beneath the eagle.
- question: When was the Mississippi state seal adopted?
  answer: The seal's design was first adopted in 1798 when Mississippi was organized as a territory. It became the official state seal when Mississippi entered the Union as the 20th state on December 10, 1817. The most recent change was in 2014, when "In God We Trust" was added to the margin.
- question: What do the olive branch and arrows mean on Mississippi's seal?
  answer: The olive branch in the eagle's right talon represents peace; the three arrows in the left represent military readiness. The pairing mirrors the Great Seal of the United States adopted in 1782 and signals that Mississippi pursues peaceful relations while retaining the power of defense.
- question: When was "In God We Trust" added to Mississippi's seal?
  answer: The inscription was added in 2014 through Senate Bill 2681, signed by Governor Phil Bryant and effective July 1, 2014. It replaced a single star that had previously appeared at the base of the seal's margin.
- question: What is on the shield on Mississippi's eagle?
  answer: The shield on the eagle's breast has 11 vertical alternating white and red stripes topped by a blue chief bearing 11 white five-pointed stars. The shield rests on the eagle's breast rather than being carried separately, following the design logic of the Great Seal of the United States.
- question: Is the Mississippi state seal the same as the coat of arms?
  answer: No. Mississippi has two distinct official emblems. The state seal, dating to 1798, features an eagle with olive branch, arrows, and a starred shield. The coat of arms, adopted separately in 1894, features a blue shield with an eagle, cotton stalks, and the motto Virtute et Armis. They are governed by separate statutes.

