intro_text: "Mississippi's state seal centers on an American eagle holding an olive branch in its right talon and three arrows in its left. The eagle's breast shield carries 11 stars and alternating stripes. The design dates to 1798, became the state seal at statehood in 1817, and was updated in 2014 to add 'In God We Trust.' This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
