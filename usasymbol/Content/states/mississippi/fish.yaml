intro_text: Mississippi's state fish is the largemouth bass, a big-mouthed freshwater game fish found in lakes and ponds across the state, adopted in 1974. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Mississippi?
  paragraphs:
  - The largemouth bass is the official state fish of Mississippi. The Mississippi Legislature named it the state fish in 1974.
  - Its scientific name is Micropterus salmoides. Some state materials also call it the black bass.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Largemouth Bass
  paragraphs:
  - The largemouth bass has a long body that is green to brown on top and lighter on the belly. A dark, blotchy stripe runs along each side.
  - Its best-known feature is its huge mouth. When the mouth is closed, the upper jaw reaches past the back of the eye.
  - Large adults can grow longer than 20 inches and weigh more than 15 pounds. Anglers have nicknamed it the bigmouth bass, the bucketmouth, and the green trout.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Mississippi Legislature made the largemouth bass the official state fish in 1974. State law names it by its common name and its scientific name.
  - Lawmakers also named the wood duck, the white-tailed deer, and the bottlenose dolphin as state symbols that same year.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Mississippi Chose the Largemouth Bass
  paragraphs:
  - Official sources name the largemouth bass as the state fish but do not give a detailed reason. The fish is native to Mississippi and lives in waters all across the state.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Largemouth Bass
  paragraphs:
  - Largemouth bass live in quiet, weedy waters across Mississippi, including lakes, reservoirs, rivers, and farm ponds.
  - Two kinds live in the state. The northern largemouth bass is native, and the Florida largemouth bass has been stocked in many lakes.
  - The state record bass came from Natchez State Park Lake in 1992. Davis Lake in north Mississippi has produced the second-largest bass on record in the state.
