    type: secondary
- id: facts
  icon: fa-solid fa-lightbulb
  title: Largemouth Bass Facts
  facts:
  - Adopted in 1974 by the Mississippi Legislature.
  - Its scientific name is Micropterus salmoides.
  - Its upper jaw reaches past the back of its eye.
  - The Mississippi record weighed 18.15 pounds and was caught in 1992.
  - The northern largemouth bass is native to Mississippi.
faq:
- question: What is Mississippi's state fish?
  answer: Mississippi's state fish is the largemouth bass, which has the scientific name Micropterus salmoides.
- question: When did Mississippi adopt the Largemouth Bass?
  answer: The Mississippi Legislature named the largemouth bass the official state fish in 1974.
- question: Why did Mississippi choose the Largemouth Bass?
  answer: Official sources do not give a detailed reason. The largemouth bass is native to Mississippi and lives in lakes, rivers, and ponds across the state.
- question: How big was the biggest largemouth bass caught in Mississippi?
  answer: The state record weighed 18.15 pounds. Anthony Denny caught it at Natchez State Park Lake in 1992.
- question: How can you tell a largemouth bass from other bass?
  answer: Look at the mouth. On a largemouth bass, the upper jaw reaches past the back of the eye when the mouth is closed.
