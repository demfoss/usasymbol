faq:
- question: What is Mississippi's state soil?
  answer: "Mississippi's state soil is the Natchez Silt Loam, a deep, wind-built soil found on the steep bluff hills along the full length of western Mississippi. The Legislature designated it the official state soil on March 13, 2003."
- question: Why is it called Natchez silt loam?
  answer: "The series is named after the city of Natchez in Adams County, Mississippi, which sits on the loess bluffs where this soil is most dramatic. The city was named after the Natchez people, a Native American nation who lived on these bluffs before European settlement."
- question: What color is Natchez silt loam?
  answer: "The surface layer is dark grayish brown. Below that, the subsoil turns dark yellowish brown. The deep loess parent material is yellowish brown — a pale, uniform color that continues dozens of feet below the surface."
- question: Where is Natchez silt loam found in Mississippi?
  answer: "Natchez silt loam runs along the full western edge of Mississippi in the bluff hills that rise above the Mississippi River floodplain. The belt runs from the Tennessee border to the Louisiana border, with the most dramatic bluffs in Adams County near the city of Natchez."
- question: What grows in Natchez silt loam?
  answer: "Most Natchez silt loam is too steep to farm, so timber is the primary use. Loblolly pine, cherrybark oak, white ash, and sweetgum grow well here. On gentler slopes, farmers grow pasture and some row crops. The soil is naturally fertile but erodes easily if left without plant cover."
- question: Who chose Natchez silt loam as Mississippi's state soil?
  answer: "The Professional Soil Classifiers Association of Mississippi, working with Mississippi State University soil scientists, chose Natchez in 1988. Representative Reecy Dickson of Macon sponsored the bill that made it official in 2003, noting that 15 other states had already designated state soils."
- question: How deep is Natchez silt loam?
  answer: "The soil profile runs at least 66 inches deep, and the underlying loess — the wind-deposited silt that formed the bluffs — can exceed 50 feet in depth. Bedrock is much deeper. It is one of the deepest soils in the South."

