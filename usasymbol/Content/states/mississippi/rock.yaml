faq:
  - question: What is Mississippi's state stone?
    answer: "Mississippi's state stone is petrified wood, ancient tree trunks that were gradually replaced by silica-rich minerals and turned to stone."
  - question: When did Mississippi adopt petrified wood as its state stone?
    answer: "The Mississippi Legislature adopted petrified wood as the official state stone on May 14, 1976."
  - question: Why did Mississippi choose petrified wood?
    answer: "The Mississippi Petrified Forest near Flora preserves an ancient log jam of fossilized trees, one of only two such sites known east of the Mississippi River, and was already a recognized natural landmark before the 1976 designation."
  - question: Where can you find petrified wood in Mississippi?
    answer: "The Mississippi Petrified Forest near Flora, in Madison County, is the state's best-known site, with a public nature trail through the exposed fossil logs."

