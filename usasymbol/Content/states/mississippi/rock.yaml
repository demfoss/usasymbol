sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Mississippi State Stone
    paragraphs:
      - "Petrified wood is Mississippi's official state stone, designated by the Mississippi Legislature in 1976. It is fossilized wood, tree trunks that were buried and gradually replaced by minerals until they turned to stone while keeping their original wood grain."
      - "Mississippi's choice centers on a specific, unusual site: a buried log jam near Flora that geologists have studied for generations and that remains open to the public today."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Petrified Wood?"
    paragraphs:
      - "Petrified wood forms when a buried log is saturated with mineral-rich groundwater, and silica dissolved in that water slowly replaces the wood's original cell structure. The result is stone that still shows the tree's growth rings, bark texture, and grain, even though almost none of the original organic material remains."
      - "Mississippi's petrified logs are the remains of prehistoric fir and maple trees, preserved in shades of brown, gray, and tan. They are not a single mineral or rock type in the usual sense, but a fossil, which is why the state's designation calls it a stone rather than a mineral."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Mississippi Chose Petrified Wood as Its State Stone"
    paragraphs:
      - "The centerpiece of Mississippi's petrified wood is an ancient log jam near Flora in Madison County, where a large river is believed to have carried uprooted trees south from a colder climate around 36 million years ago before burying them in sediment. The site is one of only two petrified forests known east of the Mississippi River, a geological rarity that gave the stone a strong local claim."
      - "The Mississippi Petrified Forest was recognized as a Registered National Natural Landmark by the National Park Service in 1966, a decade before state lawmakers made petrified wood the official state stone. That existing recognition gave the designation an established scientific and educational site to point to."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Petrified Wood Became Mississippi's State Stone"
    paragraphs:
      - "The Mississippi Legislature adopted a resolution designating petrified wood the official state stone on May 14, 1976, formally recognizing the fossil logs already preserved at the Mississippi Petrified Forest near Flora."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Petrified Wood Is Found in Mississippi"
    paragraphs:
      - "The Mississippi Petrified Forest, a privately operated park and museum near Flora in Madison County, sits atop the ancient log jam that produced the state's best-known petrified wood. Visitors can walk among the exposed stone logs on a marked nature trail."
    sites:
      - name: Mississippi Petrified Forest
        city: Flora
        lat: 32.5423
        lng: -90.3226
        note: "Site of the ancient log jam and public nature trail"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Petrified Wood Facts"
    facts:
      - "Adopted as Mississippi's state stone on May 14, 1976."
      - "The Mississippi Petrified Forest near Flora is one of only two petrified forests known east of the Mississippi River."
      - "The fossil logs formed roughly 36 million years ago after a river carried uprooted trees south and buried them in a log jam."
      - "The National Park Service designated the site a Registered National Natural Landmark in 1966."

