sections:
- id: why-did-mississippis-womens-clubs-push-the-mockingbird
  icon: fa-solid fa-circle-question
  title: Why Did Mississippi's Women's Clubs Push the Mockingbird?
  paragraphs:
  - Official Mississippi references put the campaign at the center of the story. Secretary of State publications say the mockingbird was selected as the state bird by the Women's Federated Clubs and by the Legislature in 1944.
  - Mississippi did not simply attach a label to a common bird. An organized statewide civic network backed the choice and pressed the case to the Legislature — which is why the 1944 designation has a specific sponsor, not just a vague legislative moment.
- id: why-did-mississippi-join-the-mockingbird-pattern-so-late
  icon: fa-solid fa-landmark
  title: Why Did Mississippi Join the Mockingbird Pattern So Late?
  paragraphs:
  - By the time Mississippi acted in 1944, the Northern Mockingbird was already the state bird of Florida and Texas (1927), Arkansas (1929), and Tennessee (1933). Mississippi Encyclopedia describes Mississippi as the last state to adopt the species.
  - That timing gives the choice context. Mississippi was joining a bird-symbol pattern already established across the South, one that civic groups and lawmakers understood without much explanation. The Women's Federated Clubs campaign gave that regional choice a specific Mississippi sponsor and moved it into law.
faq:
- question: What is Mississippi's state bird?
  answer: Mississippi's state bird is the Northern Mockingbird.
- question: When did Mississippi adopt the Northern Mockingbird?
  answer: Mississippi made the Northern Mockingbird its official state bird in 1944.
- question: Who pushed Mississippi to adopt the mockingbird?
  answer: Official Mississippi sources say Women's Federated Clubs selected the mockingbird and helped push the choice to the Legislature in 1944.
- question: What other states share the Northern Mockingbird as a state bird?
  answer: Florida and Texas (1927), Arkansas (1929), and Tennessee (1933) all designated the mockingbird before Mississippi did in 1944.
- question: What law lists Mississippi's state bird?
  answer: Mississippi's state bird is currently listed in Miss. Code Ann. Sec. 3-3-11.
