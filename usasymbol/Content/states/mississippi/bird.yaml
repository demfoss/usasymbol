title: Northern Mockingbird
scientific_name: Mimus polyglottos
adopted_year: 1944
legislation: Miss. Code Ann. Sec. 3-3-11; Laws 1944, ch. 326
meaning: Mississippi's state bird is best read as the result of a civic campaign. Women's Federated Clubs pushed the mockingbird into law in 1944, making Mississippi the last of the five mockingbird states to join an already established Southern pattern.
author: USA Symbol Team
date_published: '2025-11-24'
date_modified: "2026-05-02"
seo_title: "Mississippi State Bird | Northern Mockingbird"
seo_description: Mississippi adopted the Northern Mockingbird in 1944 after a campaign by the Women's Federated Clubs. The choice made Mississippi the last of the five mockingbird states.
intro_text: 'Mississippi''s official state bird is the <strong>Northern Mockingbird</strong>, made official in <strong>1944</strong> and now codified in <strong>Miss. Code Ann. Sec. 3-3-11</strong>. What gives the choice a specific Mississippi story is who pushed it: Women''s Federated Clubs backed the campaign and helped carry it to the Legislature. By 1944, Mississippi became the last of the five Southern states to designate the mockingbird — joining Florida, Texas, Arkansas, and Tennessee.'
shared_states:
