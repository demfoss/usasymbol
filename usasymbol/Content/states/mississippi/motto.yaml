title: "Virtute et Armis"
language: "Latin"
english_translation: "By Valor and Arms"
adopted_year: 1894

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Mississippi State Motto: Virtute et Armis"
seo_description: "Mississippi didn't have a coat of arms for its first 77 years as a state. In 1894, the motto 'Virtute et Armis' was proposed by the state superintendent of education — not a legislator — in the same session that adopted a Confederate-themed state flag. The phrase may have reversed a British nobleman's motto that said the opposite."

intro_text: "Mississippi's state motto is <strong>Virtute et Armis</strong> — Latin for <em>By Valor and Arms</em>. Mississippi had no coat of arms for the first 77 years of statehood (1817–1894). The phrase was proposed in 1894 by James Rhea Preston, the state superintendent of education — not a politician — during the same extraordinary legislative session that adopted a new Confederate-themed state flag. Some historians believe Preston may have adapted the motto from Lord Gray De Wilton's English family motto, 'Virtute Non Armis Fido' (I trust in virtue, not arms) — reversing its message entirely."

sections:
  - id: "77-years-no-coat-of-arms"
    icon: "fa-solid fa-shield-halved"
    title: "Mississippi Went 77 Years Without a Coat of Arms"
    paragraphs:
      - "Mississippi became the 20th state on December 10, 1817. For the next 77 years, it had no official coat of arms — no formal heraldic design to carry a motto. Most states established their official symbols within the first decade of statehood. Mississippi did not."
      - "On February 7, 1894, the legislature appointed a committee to design an official coat of arms. The committee worked through 1894 developing the design. An extraordinary legislative session later that year approved it with minimal changes. The committee's design specified a blue shield with an eagle at center, cotton stalks below, and a red scroll bearing the motto in white letters on gold spaces."
      - "The same extraordinary 1894 session that approved the coat of arms also adopted a new state flag featuring a Confederate battle cross canton. Both the coat of arms with its Latin motto and the Confederate-symbol flag were products of the same legislative moment — the post-Reconstruction period when white political leaders were systematically reshaping Mississippi's official identity."

  - id: "superintendent-of-education-proposed-it"
    icon: "fa-solid fa-user"
    title: "The Motto Was Proposed by the Education Superintendent, Not a Legislator"
    paragraphs:
      - "James Rhea Preston served as Mississippi's state superintendent of education in the 1890s. When the legislature assembled a committee to design the coat of arms, Preston proposed the Latin motto 'Virtute et Armis.' He was an educator, not a politician or military figure — which makes the choice of a martial motto interesting."
      - "Historical records give limited detail about Preston's reasoning. His classical education would have made Latin mottos a natural choice. Military valor was culturally prestigious in 1890s Mississippi, where Civil War veterans dominated political leadership and Confederate memory was being actively cultivated. The phrase about valor and arms fit the era's martial self-image."
      - "Some historians have identified a possible source: Lord Gray De Wilton, an English nobleman, had a family motto reading 'Virtute Non Armis Fido' — 'I trust in virtue, not arms.' If Preston knew this motto, Mississippi's version reversed its logic entirely. Where De Wilton's phrase rejected reliance on military force, Mississippi's combined both valor and arms as equal sources of strength."

  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "What 'By Valor and Arms' Means in Latin"
    paragraphs:
      - "The phrase contains two nouns in the ablative case, indicating the means or instrument of action. 'Virtute' comes from 'virtus' — a Latin word encompassing courage, excellence, moral strength, and military virtue. In classical Latin, 'virtus' was often specifically martial: the quality of a man who excels in battle. 'Armis' means arms or weapons. The preposition 'by' is implied by the ablative case."
      - "The combination links moral courage to physical force — achieving results through both inner valor and outer military strength. This was a common theme in 19th-century state symbolism, where martial imagery reflected the Civil War generation's experience and values."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Mississippi State Motto Facts"
    style: "gradient"
    facts:
      - "Mississippi became the 20th state in 1817 but had no coat of arms for 77 years, until 1894."
      - "The motto was proposed by James Rhea Preston, the state superintendent of education — not a legislator."
      - "The 1894 session that created the coat of arms also adopted a Confederate-themed state flag."
      - "Lord Gray De Wilton's family motto 'Virtute Non Armis Fido' (I trust in virtue, not arms) may be the source — Mississippi's version reversed the sentiment."
      - "The motto appears in white letters on gold spaces along a red scroll on the coat of arms."
      - "Mississippi never adopted the motto separately — it exists only within the coat of arms statute."

faq:
  - question: "What is Mississippi's state motto?"
    answer: "Mississippi's state motto is 'Virtute et Armis,' a Latin phrase meaning 'By Valor and Arms.' It was adopted in 1894 as part of the state coat of arms — Mississippi's first official heraldic design, 77 years after statehood."

  - question: "What does 'Virtute et Armis' mean?"
    answer: "'Virtute' comes from Latin 'virtus' — courage, excellence, and military virtue. 'Armis' means arms or weapons. Together: 'By Valor and Arms,' expressing achievement through both inner courage and military strength."

  - question: "Who proposed Mississippi's motto?"
    answer: "James Rhea Preston, the state superintendent of education, proposed 'Virtute et Armis' in 1894. He was an educator rather than a politician or military figure, though the phrase reflects the martial values of post-Reconstruction Mississippi, where Civil War veterans dominated political leadership."

  - question: "When did Mississippi adopt its motto?"
    answer: "In 1894, during an extraordinary legislative session that approved both the coat of arms (which includes the motto) and a new Confederate-themed state flag. The committee designing the coat of arms was appointed on February 7, 1894."

  - question: "Where does Mississippi's motto appear?"
    answer: "On the state coat of arms, where it appears in white letters on gold spaces along a red scroll that curves around the bottom and sides of the shield. The coat of arms appears on official documents, letterhead, and government publications. Mississippi's motto does not have a standalone statute — it exists only as part of the coat of arms description."

