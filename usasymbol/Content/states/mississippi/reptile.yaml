seo_title: "Mississippi State Reptile | American Alligator"
seo_description: "Mississippi's state reptile is the American alligator, adopted in 2005. Learn what it looks like and why it became official."
hero_image: /images/reptiles/mississippi/mississippi-state-reptile-hero.webp
hero_image_alt: "An American alligator resting along the edge of a Mississippi wetland."
hero_image_caption: "The American alligator, Mississippi's state reptile, is found in swamps and rivers across the southern part of the state."
intro_text: "Mississippi's state reptile is the American alligator, a large armored reptile found in the state's rivers and wetlands, adopted in 2005. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Mississippi?
    paragraphs:
      - "The American alligator is Mississippi's official state reptile, designated by the Mississippi Legislature in 2005. Its scientific name is Alligator mississippiensis."
      - "It is a large reptile found in rivers, swamps, and lakes mainly in the southern part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Alligator
    paragraphs:
      - "The American alligator has thick, armored, dark gray to black skin, a broad rounded snout, and powerful jaws lined with sharp teeth."
      - "Adults commonly grow to ten feet or longer, with some males growing considerably larger."
      - "It spends much of its time in water but can also move quickly on land, often basking on riverbanks and mudflats in the sun."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Mississippi Legislature designated the American alligator the official state reptile in 2005, recognizing an animal long associated with the state's rivers and wetlands."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Mississippi Chose the American Alligator
    paragraphs:
      - "The American alligator is one of the most recognizable native animals in Mississippi's rivers and swamps, and its recovery from near extinction is a notable conservation success in the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Alligator
    paragraphs:
      - "The American alligator lives mainly in the rivers, swamps, and lakes of southern and western Mississippi, including the Mississippi Delta and Gulf Coast wetlands."
    sites:
      - name: Mississippi Delta wetlands
        city: Greenville
        lat: 33.41
        lng: -91.06
        note: "Riverine and wetland habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: American Alligator Facts
    facts:
      - "Adopted in 2005 by the Mississippi Legislature."
      - "Scientific name is Alligator mississippiensis."
      - "Adults commonly grow to ten feet or longer."
      - "Has a broad, rounded snout, unlike the narrower snout of a crocodile."
      - "Found mainly in the rivers, swamps, and lakes of southern Mississippi."

