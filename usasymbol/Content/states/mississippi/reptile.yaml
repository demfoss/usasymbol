faq:
  - question: What is Mississippi's state reptile?
    answer: "Mississippi's state reptile is the American alligator, adopted by the Mississippi Legislature in 2005."
  - question: When did Mississippi adopt the American alligator?
    answer: "The Mississippi Legislature designated the American alligator the official state reptile in 2005."
  - question: Why did Mississippi choose the American alligator?
    answer: "The American alligator is a familiar native species in Mississippi's rivers and swamps, and its population recovery is seen as a conservation success in the state."
  - question: Is the American alligator a turtle, snake, lizard, or alligator?
    answer: "The American alligator is an alligator, a large armored reptile related to crocodiles."

