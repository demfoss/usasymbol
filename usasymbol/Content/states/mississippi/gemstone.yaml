sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Mississippi State Gemstone
    paragraphs:
      - "Mississippi Opal is the state's official gemstone, designated by the Mississippi Legislature in 2023. Geologists with the state's Office of Geology found it in Claiborne County while mapping the Catahoula Formation, and it remains the only precious gemstone documented as forming naturally in Mississippi."
      - "The designation is recent enough that Mississippi Opal is still mostly known to specialists, unlike gemstones other states adopted generations ago with long collecting histories behind them."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Mississippi Opal?"
    paragraphs:
      - "Mississippi Opal is a form of hydrated silica, chemically related to quartz but containing water within its structure rather than a crystal lattice. In its finer examples it shows play-of-color, flashes of green and red light that shift as the stone is turned, the same optical effect prized in opals from other parts of the world."
      - "The stone formed from volcanic ash that settled into the landscape roughly 20 million years ago, later altering into the silica-rich material that became opal. That volcanic origin is unusual for Mississippi, a state with little other precious-gem-producing geology."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Mississippi Chose Mississippi Opal as Its State Gemstone"
    paragraphs:
      - "Before this discovery, Mississippi had no confirmed source of a precious gemstone within its own borders, unlike neighboring states with established gem-producing sites. Finding opal in the Catahoula Formation gave the state's Office of Geology a genuinely new, homegrown material to point to."
      - "Geologists and members of the Mississippi Geological Society pushed for the designation as a way to highlight the discovery and the state's broader geological survey work. The legislature agreed, and Governor Tate Reeves signed the bill making it official on March 3, 2023."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Mississippi Opal Became Mississippi's State Gemstone"
    paragraphs:
      - "Geologists with the Mississippi Department of Environmental Quality's Office of Geology first identified the opal in Claiborne County in 2004 during routine mapping work. Nearly two decades later, the Mississippi Legislature passed a bill naming it the state gemstone, and Governor Tate Reeves signed it into law on March 3, 2023."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Mississippi Opal Facts"
    facts:
      - "Adopted as Mississippi's state gemstone on March 3, 2023."
      - "Mississippi opal is the only precious gemstone documented to form naturally within the state."
      - "State geologists first identified it in Claiborne County in 2004, within the Catahoula Formation."
      - "The opal formed from volcanic ash deposited roughly 20 million years ago."

