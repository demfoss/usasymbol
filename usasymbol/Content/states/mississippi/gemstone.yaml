faq:
  - question: What is Mississippi's state gemstone?
    answer: "Mississippi's state gemstone is Mississippi Opal, a form of hydrated silica that can show flashes of green and red light."
  - question: When did Mississippi adopt Mississippi Opal as its state gemstone?
    answer: "Governor Tate Reeves signed the bill naming Mississippi Opal the official state gemstone on March 3, 2023."
  - question: Why did Mississippi choose Mississippi Opal?
    answer: "It is the only precious gemstone ever documented forming naturally within the state, discovered by state geologists mapping the Catahoula Formation in Claiborne County."
  - question: Is Mississippi Opal valuable?
    answer: "Fine, gem-quality pieces with strong play-of-color are rare and prized by collectors, but most material found so far is modest compared to opal from major world sources."

