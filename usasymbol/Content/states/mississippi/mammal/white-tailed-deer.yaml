title: "Mississippi State Land Mammal | White-tailed Deer"
scientific_name: "Odocoileus virginianus"
adopted_year: 1974

seo_title: "Mississippi State Land Mammal | White-tailed Deer"
seo_description: "Mississippi's state land mammal is the White-tailed Deer, adopted in 1974. Learn why this official Mississippi symbol was chosen and what it represents."

intro_text: "The White-tailed Deer is the official Mississippi state land mammal, designated in 1974. This page gives the direct answer for searches like 'mississippi state land mammal', 'mississippi state animal', and 'mississippi state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing Mississippi Delta heritage, conservation success through bottomland hardwood restoration, and highest state deer density in nation."

common_name: "White-tailed Deer"
official_since: "1974"
status: "Abundant; Mississippi has highest deer density per square mile in United States; population approximately 1.75 million"
habitat_in_state: "All 82 counties; particularly abundant in Delta bottomland hardwoods, pine forests, and agricultural edge habitat"
known_for: "Symbolizing Mississippi Delta heritage, conservation success through bottomland hardwood restoration, and highest state deer density in nation"

size: "6 to 7.5 feet long (including tail); 3 to 3.5 feet tall at shoulder"
weight: "Males: 150-300 pounds; Females: 90-200 pounds; southern deer typically smaller than northern populations"
coloration: "Reddish-brown summer coat; grayish-brown winter coat; white underside of tail, throat patch, belly, and inside legs"
distinctive_traits: "White tail raised like flag when alarmed; males grow antlers annually; exceptional speed (40 mph), jumping ability (9 feet), and swimming skill (13 mph)"

habitat: "Bottomland hardwood forests, pine stands, agricultural edges, regenerating clearcuts"
range_in_state: "Present in all 82 Mississippi counties; highest concentrations in Delta region and throughout mixed agricultural-forest landscapes"
conservation_status: "Recovered species; managed through regulated hunting; population approximately 1.75 million deer statewide—only Texas has more total deer"
where_to_find: "Delta National Forest (only bottomland hardwood national forest in U.S.); Theodore Roosevelt National Wildlife Refuge Complex; state wildlife management areas; visible along rural roads at dawn and dusk statewide"
symbol_connections: "Paired with bottlenose dolphin in 1974 legislation; connects to Delta agricultural history and bottomland hardwood restoration; Theodore Roosevelt 1902 bear hunt near Onward led to 'Teddy Bear' name"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Mississippi Legislature designated the white-tailed deer as the official state land mammal in 1974 through Senate Bill No. 2324. The same legislation simultaneously named the bottlenose dolphin as the state water mammal, creating a unique pairing that acknowledged Mississippi's dual terrestrial and coastal character and [The Magnolia State identity](/states/mississippi/nickname/the-magnolia-state)."
      - "The 1974 designation came during a period when Mississippi's deer population had rebounded dramatically from near-extinction. By choosing the white-tailed deer, legislators recognized both a conservation success story and an animal central to Mississippi's hunting culture, outdoor economy, and rural identity."
    
    subsections:
      - subtitle: "Land and Water Mammal Pairing"
        text: "Mississippi's decision to designate both land and water mammals in a single piece of legislation reflected the state's geographic diversity. The white-tailed deer represented Mississippi's forests, farmlands, and interior regions, while the bottlenose dolphin represented the Gulf Coast and coastal waters. This pairing demonstrated legislative recognition that Mississippi encompasses distinct ecosystems requiring different conservation approaches. In 1997, Mississippi added the red fox as a second state land mammal, but the white-tailed deer remains the primary terrestrial mammal symbol."
      
      - subtitle: "Why Mississippi Chose the White-Tailed Deer"
        text: "Mississippi selected the white-tailed deer because the species appears in every county and represents one of the state's greatest conservation achievements. The deer had nearly vanished from Mississippi by the early 1900s due to unregulated market hunting and habitat loss, with populations restricted to a few thousand animals in remote bottomland swamps. The designation in 1974 celebrated the successful recovery achieved through protective laws, restocking programs, and habitat management. The deer also drives Mississippi's outdoor recreation economy, with deer hunting contributing over 100 million dollars annually through license sales, equipment purchases, and tourism."

  - id: "state-symbolism"
    icon: "fa-seedling"
    title: "What the White-Tailed Deer Represents"
    style: "highlight"
    paragraphs:
      - "The white-tailed deer symbolizes Mississippi's transformation from agricultural exploitation to conservation leadership. The Mississippi Delta once contained 24 million acres of bottomland hardwood forests before 80 percent was cleared for agriculture in the mid-1900s. Today, massive restoration efforts have reforested over 700,000 acres across Mississippi, Arkansas, and Louisiana, creating renewed habitat for deer and other wildlife under principles echoed in the [Mississippi state motto](/states/mississippi/motto/virtute-et-armis)."
      - "Mississippi has the distinction of supporting the highest deer density per square mile of any state in the nation. With 1.75 million deer across 82 counties, Mississippi's success in deer management demonstrates how scientific research, landowner cooperation, and regulated hunting can sustain abundant wildlife populations while supporting human communities."
      - "The deer represents daily life across rural Mississippi. Farmers encounter deer in fields at dawn and dusk. Hunters pursue deer during fall and winter seasons that bring family and friends together across generations. The species connects modern Mississippians to the land and to traditions that Native Americans and early settlers practiced centuries ago."
    
    subsections:
      - subtitle: "The Delta Bottomland Story"
        text: "Mississippi's Delta region tells a dramatic story of habitat loss and restoration centered on bottomland hardwood forests. Before European settlement, the Mississippi River floodplain supported vast bottomland hardwood forests dominated by oak, cypress, and tupelo. These forests provided prime deer habitat with acorns for food, dense cover for protection, and seasonal flooding that concentrated deer on high ground during winter. Beginning in the 1950s and accelerating through the 1960s, high commodity prices prompted massive clearing of bottomland forests for soybean and cotton production. By the 1970s, over 80 percent of the original bottomland hardwoods had been converted to agriculture. Deer populations survived primarily along rivers, in small woodlots, and on land too wet to farm."
      
      - subtitle: "Conservation Through Restoration"
        text: "Since the 1990s, federal programs including the Wetlands Reserve Program have paid landowners to retire frequently flooded farmland and restore bottomland hardwood forests. Through 2020, over 700,000 acres across the Mississippi Alluvial Valley have been reforested with native oaks, ash, cottonwood, sycamore, and other bottomland species. This restoration benefits deer immediately—populations increase on reforested lands within just a few years as young trees provide browse and cover. The restoration also supports Louisiana black bears, waterfowl, songbirds, and countless other species. Mississippi's deer designation in 1974 came just as this conservation transformation began, and the species now thrives on restored bottomlands throughout the Delta."
      
      - subtitle: "The Only Bottomland Hardwood National Forest"
        text: "The Delta National Forest in Sharkey County, Mississippi, holds unique significance as the only bottomland hardwood forest in the entire national forest system. Established in the 1930s, the Delta National Forest preserves habitat that represents what the Mississippi Delta looked like before agricultural conversion. Mature oaks provide food for deer, wood ducks, and wild turkeys. Seasonal flooding creates wetland conditions that attract waterfowl. The forest demonstrates what bottomland hardwoods offer wildlife—dense canopy cover, abundant mast production, and vegetative diversity. Mississippi's state land mammal thrives here in habitat that once covered millions of acres across the lower Mississippi River valley, in landscapes also represented by the [Mississippi state flag](/states/mississippi/flag/mississippi-state-flag)."
      
      - subtitle: "Highest Deer Density in the Nation"
        text: "Mississippi's distinction as having the highest deer density per square mile of any state reflects ideal habitat conditions created by a mixture of agriculture, forestry, and conservation lands. Deer thrive in edge habitat where forests meet fields, and Mississippi's landscape provides endless edges—pine plantations adjacent to soybean fields, hardwood corridors along rivers cutting through farmland, regenerating clearcuts next to mature forests. This habitat diversity, combined with mild winters that allow high fawn survival and long breeding seasons, enables Mississippi to support more deer per area than northern states with harsher climates. Only Texas has more total deer, but Texas covers nearly eight times Mississippi's land area."
      
      - subtitle: "Mississippi State University Partnership"
        text: "Mississippi has built one of the nation's premier deer management programs through a long-standing partnership between the Mississippi Department of Wildlife, Fisheries, and Parks and Mississippi State University's Department of Wildlife and Fisheries. This collaboration has supported cutting-edge deer research for decades, producing science that guides management decisions statewide. The Deer Management Assistance Program, developed through this partnership, coordinates with hunting clubs covering approximately 2 million acres and 900 cooperators who collect harvest data to guide management toward specific goals. This cooperative approach gives landowners and hunters direct input into managing deer populations on their properties while maintaining statewide sustainability."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify White-Tailed Deer"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "White-tailed deer in Mississippi are medium-sized members of the deer family, typically smaller than northern populations due to Bergmann's Rule—animals in warmer climates tend to be smaller than those in colder regions. Mississippi deer display the classic features that give the species its name: a distinctive white tail that flashes as a warning signal when raised during alarm."
        list_items:
          - "**Size**: Adults measure 6–7.5 feet long including tail; stand 3–3.5 feet tall at shoulder"
          - "**Weight**: Males 150–300 pounds, females 90–200 pounds; Mississippi deer average smaller than Great Lakes populations"
          - "**Coloration**: Reddish-brown coat in summer; grayish-brown winter coat; white throat patch, belly, inside legs, and tail underside"
          - "**Antlers**: Males grow and shed antlers annually; Mississippi bucks can grow large antlers in agricultural areas with good nutrition"
      
      - subtitle: "Seasonal Behavior"
        text: "Mississippi's mild climate creates different seasonal patterns than northern states. Deer don't face extended periods of deep snow and extreme cold, allowing them to remain active and feeding throughout winter. Does can maintain better body condition year-round, leading to high fawn survival rates. The breeding season (rut) typically peaks in late December through January in Mississippi, about a month later than in northern states. This timing means fawns are born in late July and August when abundant summer vegetation provides optimal nursing conditions. Mississippi deer don't migrate to winter yards as northern deer do; instead, they maintain relatively small home ranges throughout the year."
      
      - subtitle: "Adaptability to Mississippi Habitats"
        text: "White-tailed deer demonstrate remarkable adaptability to Mississippi's diverse habitats. In the Delta, deer move between bottomland hardwood forests and agricultural fields, feeding on soybeans, corn, and winter wheat while using forests for cover and thermal protection during hot summer days. In the pine belt across central and southern Mississippi, deer thrive in regenerating pine plantations where young trees provide browse and clearcuts create herbaceous vegetation. Along the Gulf Coast, deer adapt to living in smaller forest patches surrounded by human development, feeding at night and bedding in dense thickets during day. This adaptability explains why Mississippi supports such high deer densities across varied landscapes."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "White-Tailed Deer Across Mississippi"
    style: "default"
    paragraphs:
      - "White-tailed deer inhabit all 82 Mississippi counties, making them the state's most visible and abundant large mammal. Population distribution varies by region based on habitat quality, with the highest densities occurring in areas mixing agriculture with forest cover."
      - "Mississippi's current deer population of approximately 1.75 million represents a remarkable recovery from the early 1900s when only a few thousand deer survived in remote swamps. This recovery resulted from protective legislation, restocking programs, habitat management, and regulated hunting that sustains populations while providing recreational opportunities."
    
    facts:
      - "**Geographic Distribution**: Present in all 82 Mississippi counties with no areas lacking deer"
      - "**Population**: Approximately 1.75 million deer statewide—highest density per square mile in nation"
      - "**Historical Low**: Nearly extinct by early 1900s; populations restricted to remote bottomland swamps"
      - "**Recovery Timeline**: Mississippi Game and Fish Commission formed 1932; restocking programs continued through 1960s"
      - "**Economic Impact**: Deer hunting contributes over $100 million annually to Mississippi economy"

  - id: "where-to-see"
    icon: "fa-location-dot"
    title: "Where to See White-Tailed Deer"
    style: "default"
    paragraphs:
      - "White-tailed deer are visible throughout Mississippi, particularly along agricultural edges and in mixed forest-field habitats at dawn and dusk. Public lands provide reliable viewing opportunities for residents and visitors interested in observing Mississippi's most abundant large mammal."
    
    list_items:
      - "**Delta National Forest**: Sharkey County location preserves the only bottomland hardwood national forest in United States; deer commonly seen along forest roads and in clearings"
      - "**Theodore Roosevelt National Wildlife Refuge Complex**: Seven refuges totaling over 100,000 acres provide prime deer habitat in Mississippi Delta; visitor centers offer educational exhibits"
      - "**Noxubee National Wildlife Refuge**: Located in east-central Mississippi near Starkville; excellent deer viewing opportunities along refuge roads; Swan Lake Indian Mound adds cultural interest"
      - "**State Wildlife Management Areas**: Mississippi maintains numerous WMAs throughout the state providing public access to deer habitat; particularly productive during early morning and evening hours"

  - id: "current-management"
    icon: "fa-chart-line"
    title: "Modern Deer Management"
    style: "default"
    paragraphs:
      - "Mississippi manages its deer population through science-based regulations developed in partnership with Mississippi State University researchers. The state sets harvest quotas, season dates, and antler restrictions based on population surveys, harvest data, and habitat conditions."
      - "Modern management emphasizes maintaining healthy deer populations while sustaining hunting opportunities that generate revenue for conservation. Mississippi pioneered cooperative management approaches that give hunters and landowners direct input into managing deer on their properties while maintaining statewide population goals."
    
    subsections:
      - subtitle: "Deer Management Assistance Program"
        text: "Mississippi developed the Deer Management Assistance Program in cooperation with Mississippi State University to give hunters and hunting clubs tools for managing deer populations on their properties. DMAP participants collect detailed harvest data including age, sex, weight, and antler measurements for every deer taken. Biologists analyze this data and provide recommendations tailored to each property's habitat and management goals. By the late 1990s, approximately 2 million acres and 900 cooperators participated in DMAP. This program represents one of the most extensive landowner-wildlife agency partnerships in the nation and has produced valuable research data while improving deer management outcomes on private lands."
      
      - subtitle: "Hunting Seasons and Regulations"
        text: "Mississippi offers multiple deer hunting opportunities throughout fall and winter. Archery season typically runs October through January, allowing bowhunters extended opportunities. The primitive weapon season (muzzleloaders) usually occurs in early December. Gun seasons include periods with dogs (traditional in Mississippi) and still-hunting without dogs. Statewide buck limits typically allow three bucks per license year, with antler restrictions requiring at least four points on one antler. Doe harvest is regulated to control population growth while maintaining healthy herds. These varied seasons distribute hunting pressure across several months and provide opportunities for hunters using different equipment and techniques."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The white-tailed deer connects to other Mississippi state symbols through shared themes of conservation, agriculture, and Southern heritage. The pairing of land and water mammals in 1974 legislation demonstrated legislative sophistication in recognizing Mississippi's ecological diversity from the Gulf Coast to the Delta to the pine forests in a broader regional map of [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "Mississippi's symbols frequently reference the state's agricultural identity and natural resources. The magnolia tree and flower, largemouth bass, wood duck, and white-tailed deer all represent species that thrive in Mississippi's climate and that connect to outdoor recreation, hunting, and fishing traditions important to state culture."
    
    subsections:
      - subtitle: "Bottlenose Dolphin Partnership"
        text: "Mississippi's designation of both the white-tailed deer (land mammal) and bottlenose dolphin (water mammal) in the same 1974 legislation created an unusual symbolic pairing. The pairing acknowledged that Mississippi extends from the Mississippi River bottomlands through pine forests to the Gulf Coast, encompassing fundamentally different ecosystems. While the deer represents forests, farmlands, and hunting heritage, the dolphin represents coastal waters, commercial fishing, and maritime tradition. Together, they capture Mississippi's geographic and ecological breadth. Few other states have created such deliberate pairings of terrestrial and marine mammal symbols."
        link:
          label: "See Mississippi state water mammal"
          url: "/states/mississippi/mammal/bottlenose-dolphin"
      
      - subtitle: "The Teddy Bear Connection"
        text: "Mississippi's white-tailed deer designation connects tangentially to one of America's most famous conservation stories. In November 1902, President Theodore Roosevelt hunted black bears near Onward, Mississippi, in the Delta bottomlands. When his guides captured and tied a bear to a tree for Roosevelt to shoot, he refused, considering the act unsporting. Political cartoons of the incident led toy manufacturers to create stuffed 'Teddy Bears.' This event occurred in the same Delta region where Mississippi's deer populations nearly vanished before recovering. Roosevelt's conservation ethic—evident in his refusal to shoot the tied bear—would help establish the national wildlife refuge system that now protects deer habitat throughout Mississippi including the Theodore Roosevelt National Wildlife Refuge Complex."

