faq:
  - question: "What is Mississippi's state land mammal?"
    answer: "Mississippi's state land mammal is the white-tailed deer (Odocoileus virginianus), designated in 1974 through Senate Bill No. 2324. The same legislation also designated the bottlenose dolphin as the state water mammal, creating a unique land-and-water pairing that reflects Mississippi's ecological diversity."
  
  - question: "When was the white-tailed deer designated as Mississippi's state land mammal?"
    answer: "The white-tailed deer became Mississippi's official state land mammal in 1974. The designation recognized the species' successful recovery from near-extinction in the early 1900s and acknowledged its importance to Mississippi's hunting culture and outdoor recreation economy."
  
  - question: "Why does Mississippi have the highest deer density in the United States?"
    answer: "Mississippi has the highest deer density per square mile of any state due to ideal habitat conditions created by mixed agricultural-forest landscapes, mild winters that enable high fawn survival, and effective wildlife management. The combination of pine forests, bottomland hardwoods, agricultural edge habitat, and year-round favorable climate allows Mississippi to support approximately 1.75 million deer across 82 counties. Only Texas has more total deer, but Texas covers nearly eight times Mississippi's land area."
  
  - question: "What is the Delta National Forest and why is it important for deer?"
    answer: "The Delta National Forest in Sharkey County, Mississippi, is the only bottomland hardwood national forest in the entire United States national forest system. It preserves habitat representing what the Mississippi Delta looked like before agricultural conversion—mature oak forests with seasonal flooding that provide ideal conditions for white-tailed deer, waterfowl, black bears, and other wildlife. The forest demonstrates the value of bottomland hardwoods for wildlife and serves as a model for restoration efforts throughout the Mississippi Alluvial Valley."
  
  - question: "How did Mississippi's deer population recover from near-extinction?"
    answer: "Mississippi's deer population recovered through protective laws, restocking programs, and habitat management beginning in the 1930s. The Mississippi Game and Fish Commission, formed in 1932, initiated deer stocking programs that continued through the 1960s, bringing deer from other states to suitable habitats. Bag limits, season restrictions, and hunting regulations protected recovering populations. Simultaneously, abandoned farmland and regenerating forests created improved habitat. By the 1970s, deer had recovered sufficiently for Mississippi to designate the species as its state land mammal."
  
  - question: "What is bottomland hardwood habitat and why do deer need it?"
    answer: "Bottomland hardwood forests are river floodplain forests dominated by oak, cypress, tupelo, and other water-tolerant hardwood trees. These forests experience seasonal flooding and provide excellent deer habitat with abundant acorns for food, dense cover for protection, and diverse vegetation for browse. The Mississippi Delta historically contained 24 million acres of bottomland hardwoods before 80% was cleared for agriculture. Since the 1990s, over 700,000 acres have been restored through federal programs, benefiting deer and other wildlife throughout the Mississippi Alluvial Valley."
  
  - question: "What is the Deer Management Assistance Program?"
    answer: "The Deer Management Assistance Program is a cooperative initiative developed by Mississippi Department of Wildlife, Fisheries, and Parks in partnership with Mississippi State University. DMAP participants—hunting clubs and landowners covering approximately 2 million acres—collect detailed harvest data on deer they hunt. Biologists analyze this data and provide tailored management recommendations for each property. This program gives landowners direct input into managing deer while producing valuable research data and represents one of the nation's most extensive landowner-agency wildlife partnerships."
  
  - question: "How is Mississippi's deer connected to Theodore Roosevelt and Teddy Bears?"
    answer: "In November 1902, President Theodore Roosevelt hunted black bears near Onward, Mississippi, in the Delta bottomlands. When his guides captured and tied a bear to a tree for Roosevelt to shoot, he refused, considering it unsporting. Political cartoons of this incident led to the creation of stuffed 'Teddy Bears.' This event occurred in the same Delta region where Mississippi's deer populations would later recover. The Theodore Roosevelt National Wildlife Refuge Complex in Mississippi now protects habitat for deer and other wildlife, honoring Roosevelt's conservation legacy."

