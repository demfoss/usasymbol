sections:
  - id: "official-designation"
    title: "The New Magnolia Flag and Its Adoption"
    style: "default"
    paragraphs:
      - "Mississippi adopted the New Magnolia flag on January 11, 2021, when Governor Tate Reeves signed it into law following passage by the Mississippi State House of Representatives on January 5 and the State Senate on January 6. The flag had been approved by 73 percent of Mississippi voters in a statewide referendum on November 3, 2020, one of the most decisive endorsements of a new state flag by popular vote in American history. The red, blue, and gold color scheme was not designated as official state colors by a separate statute; the colors derive their legal standing from the flag's statutory description, which assigns specific symbolic meanings to each color in the legislative text, detailed on the [Mississippi state flag page](/states/mississippi/flag/mississippi-state-flag)."
      - "The new flag replaced the 1894 Mississippi state flag, which had incorporated the Confederate battle emblem in its canton — the last remaining state flag in the United States to do so. The legislature voted to retire the 1894 flag on June 28, 2020, and Governor Reeves signed the retirement bill into law on June 30, establishing the Commission to Redesign the Mississippi State Flag. The commission received more than 2,000 submissions meeting the legislative criteria, which required the new flag to include the words 'In God We Trust' and prohibited the use of the Confederate battle flag. The commission selected the New Magnolia design — anchored by a magnolia blossom encircled by stars — as the winner and placed it before voters in the November 2020 referendum, reflecting [The Magnolia State narrative](/states/mississippi/nickname/the-magnolia-state)."
    subsections:
      - subtitle: "Commission to Redesign the Mississippi State Flag"
        text: "The nine-member Commission to Redesign the Mississippi State Flag reviewed more than 2,000 public submissions before announcing nine finalists on August 14, 2020. The finalists emphasized magnolias, the Mississippi River, and star configurations significant to the Choctaw nation, with color schemes predominantly in red, white, and blue or green and white. On September 2, 2020, the commission voted 8-1 to advance the New Magnolia design — created by Rocky Vaughan with design support from Sue Anna Joe, Kara Giles, and Dominique Pugh, and with the magnolia illustration by Dominique Pugh and the Native American star credited to Micah Whitson — to the November ballot. The commission made slight modifications to the original design before the referendum, including making the text bolder and the red and gold bars thicker. The flag is officially referred to in state law as the 'In God We Trust Flag.'"
      - subtitle: "Statutory Color Symbolism"
        text: "Mississippi law formally assigns symbolic meanings to each color in the New Magnolia flag. The statute specifies that the blue central panel echoes the American flag and signifies vigilance, justice, and perseverance; the red bars symbolize hardiness and valor; and the gold bars and magnolia stamen represent Mississippi's rich cultural history in the visual and performing arts. The magnolia itself represents the state flower, hospitality, hope, and rebirth. The circle of 20 white stars denotes Mississippi as the 20th state admitted to the Union, while the single large gold star at the top honors Indigenous peoples and symbolizes the five inhabited continents. The flag's design incorporates a diamond pattern significant to the Choctaw nation, one of the Five Civilized Tribes whose homeland centered in Mississippi for centuries before removal in the 1830s, linking directly to the [official Mississippi state flower](/states/mississippi/flower/magnolia)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Mississippi's three flag colors carry meanings that bridge American patriotic tradition and Mississippi-specific history. The red, blue, and gold of the New Magnolia flag were chosen to present Mississippi's values and identity in a palette free of the Civil War associations that had made the 1894 flag controversial. Blue and red echo the colors of the American flag, affirming Mississippi's place in the Union and its soldiers' valor across every American conflict. Gold adds a distinctly Mississippi element — representing the state's cultural arts legacy, the golden magnolia of the Magnolia State, and through the distinctive gold star, the Indigenous peoples whose civilization shaped the Mississippi landscape for millennia before European contact."
    subsections:
      - subtitle: "Blue: Vigilance, Justice, and Perseverance"
        text: "The deep blue of the New Magnolia flag's central field was selected with deliberate heraldic meaning. Vigilance, justice, and perseverance are the three virtues the Mississippi legislature assigned to blue in the flag's statutory description, reflecting both classical heraldic tradition — in which blue (azure) has long represented loyalty, truth, and wisdom — and contemporary aspirations for the state's civic symbolism. The blue field forms the visual anchor of the flag, holding the magnolia blossom, the ring of stars, and the motto 'In God We Trust' in a composition that places Mississippi's natural symbol at its center. The shade of blue specified for the New Magnolia flag approximates Old Glory Blue, the blue of the American flag, connecting Mississippi's state identity to national continuity."
      - subtitle: "Red: Hardiness and Valor"
        text: "Red appears in the New Magnolia flag as vertical bars on both sides of the central blue panel, framing the design in the color that the legislature designated as representing hardiness and valor. Mississippi's military history is one of the most distinguished in the nation relative to its population; the state has produced more Congressional Medal of Honor recipients per capita than any other state, and its soldiers served with distinction in every American conflict from the Revolutionary War through the post-9/11 era. The 20th Mississippi Infantry regiment's charge at the Battle of Franklin in November 1864, the valor of the Tuskegee Airmen trained partly at bases in Mississippi, and the service of Mississippi National Guard units in Korea, Vietnam, and the Middle East all inform the red's association with valor in the state's civic imagination."
      - subtitle: "Gold: Cultural Heritage and Indigenous Honor"
        text: "Gold carries the most layered symbolism in Mississippi's New Magnolia flag. The statute assigns gold the meaning of Mississippi's rich cultural history in the visual and performing arts — a tradition that includes the birthplace of the blues in the Mississippi Delta, the literary legacy of William Faulkner, Eudora Welty, and Tennessee Williams, and the visual arts traditions rooted in the Natchez and Choctaw cultures that predate European settlement. Gold also appears in the flag's most distinctive element: the large gold star at the top of the ring of 20 white stars, composed of a pattern of five diamonds significant to the Choctaw nation. This star explicitly honors the Indigenous peoples of Mississippi, a recognition of the Choctaw, Chickasaw, Natchez, Biloxi, and other nations whose civilizations shaped the Mississippi landscape for thousands of years before the forced removal of the 1830s."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and State Identity"
    style: "default"
    paragraphs:
      - "The New Magnolia flag's red, blue, and gold palette has rapidly established itself as Mississippi's dominant state color tradition since the flag's adoption in January 2021. State government buildings, agencies, and communications shifted from the 1894 flag's red-white-blue scheme to the New Magnolia's deeper blue, brighter red, and gold accents across all official contexts. The Mississippi Department of Archives and History, the agency that managed the flag redesign public submission process, maintains documentation of the color specifications and flag design. The magnolia blossom — white against the deep blue field — provides a natural extension of the state's floral identity, connecting the flag's colors to the flowering trees that make Mississippi the Magnolia State. The gold star honoring Indigenous peoples represents one of the most explicit acknowledgments of Native American heritage in any U.S. state flag adopted in the 21st century, and has been recognized by representatives of the Choctaw nation as a meaningful gesture of inclusion in the state's official symbolism. The 73 percent voter approval of the New Magnolia flag in the November 2020 referendum represented not only a decisive rejection of the Confederate battle emblem but also a broad public endorsement of the new color palette as the visual face of a Mississippi seeking to choose a new public image for the 21st century in a region mapped by [states neighboring states](/rankings/geography/states-neighboring-states)."

