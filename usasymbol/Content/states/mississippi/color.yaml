timeline:
  - year: "1861"
    description: "Mississippi adopts its first state flag, the Magnolia Flag, on March 30 — a white field with a magnolia tree, blue canton with a white star, and red border; the magnolia and red-blue palette establish the visual foundation that the 2021 flag will return to 160 years later"
  - year: "1894"
    description: "Mississippi adopts a second state flag on February 7, featuring a Confederate battle emblem in the canton; this flag remains the official state flag for 126 years, the longest tenure of any Mississippi flag"
  - year: "2020"
    description: "Mississippi Legislature votes on June 28 to retire the 1894 Confederate-era flag and commission a new design; the Commission to Redesign the Mississippi State Flag is established and receives more than 2,000 public submissions"
  - year: "2020"
    description: "The New Magnolia flag design, featuring red, blue, and gold with a white magnolia blossom and ring of stars, is approved by 73 percent of Mississippi voters in a November 3 statewide referendum — one of the most decisive flag votes in American history"
  - year: "2021"
    description: "Mississippi State House passes the New Magnolia flag on January 5; the State Senate passes it on January 6; Governor Tate Reeves signs it into law on January 11, establishing red, blue, and gold as Mississippi's de facto state colors"

expert_quote:
  text: "The New Magnolia also represents Mississippi's sense of hope and rebirth, as the magnolia often blooms more than once and has a long blooming season."
  source: "Commission to Redesign the Mississippi State Flag, Official Design Description, September 2020"

faq:
  - question: "What are the state colors of Mississippi?"
    answer: "The traditional state colors of Mississippi are Red, Blue, and Gold, derived from the New Magnolia flag adopted January 11, 2021. Blue represents vigilance, justice, and perseverance; red represents hardiness and valor; and gold represents Mississippi's cultural heritage and honors the state's Indigenous peoples."
  - question: "What is the HEX code for Mississippi Blue?"
    answer: "The closest standard HEX code for Mississippi Blue is #002868, corresponding to Pantone PMS 281, approximating Old Glory Blue as used in the New Magnolia flag's central blue field."
  - question: "What is the HEX code for Mississippi Red?"
    answer: "The closest standard HEX code for Mississippi Red is #BF0A30, corresponding to Pantone PMS 193, approximating Old Glory Red as used in the vertical red bars of the New Magnolia flag."
  - question: "What is the HEX code for Mississippi Gold?"
    answer: "The closest standard HEX code for Mississippi Gold is #F5A800, corresponding to Pantone PMS 123, representing the gold borders, magnolia stamen, and the distinctive gold star honoring Indigenous peoples in the New Magnolia flag."
  - question: "When was Mississippi's New Magnolia flag adopted?"
    answer: "The New Magnolia flag was officially adopted on January 11, 2021, when Governor Tate Reeves signed it into law after 73 percent of Mississippi voters approved it in a November 3, 2020 referendum. It replaced the 1894 flag that incorporated the Confederate battle emblem."
  - question: "What does the gold star on the Mississippi flag mean?"
    answer: "The single large gold star at the top of the ring of stars on the New Magnolia flag honors the Indigenous peoples of Mississippi. It is composed of a pattern of five diamonds significant to Choctaw design traditions and symbolizes the five inhabited continents. It represents the Choctaw, Chickasaw, Natchez, Biloxi, and other nations whose civilizations shaped Mississippi for thousands of years."
  - question: "Why did Mississippi change its state flag?"
    answer: "Mississippi changed its 1894 flag because it incorporated the Confederate battle emblem in its canton — the last remaining state flag in the United States to do so. The legislature voted to retire it on June 28, 2020, and commissioned the New Magnolia design, which was approved by 73 percent of voters in November 2020."

