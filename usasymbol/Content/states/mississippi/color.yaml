sections:
  - id: "official-designation"
    title: "Mississippi State Colors History"
    style: "default"
    paragraphs:
      - "Mississippi has not enacted a separate state color statute. Its red, blue and gold are defined by the flag's statutory description, and the current palette comes from the New Magnolia flag."
      - "Governor Tate Reeves signed the flag into law, and it was adopted on January 11, 2021. Voters had approved it by 73 percent in a November 2020 referendum, replacing a 126-year-old flag that included the Confederate battle emblem."
  - id: "symbolism"
    title: "What Mississippi State Colors Mean"
    style: "highlight"
    paragraphs:
      - "Gold carries the clearest stated meaning. It honors both Mississippi's cultural arts heritage and the state's Indigenous peoples, through the gold star at the top of the flag's central design."
  - id: "state-emblems"
    title: "Where Mississippi Colors Appear"
    style: "default"
    paragraphs:
      - "The New Magnolia flag is the main home of the red, blue and gold. The colors also turn up in state government branding and in state agency materials and communications."
