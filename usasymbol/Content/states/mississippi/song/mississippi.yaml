sections:
  - id: overview
    icon: fa-solid fa-music
    title: Mississippi State Song
    paragraphs:
      - "\"Mississippi\" is the state's original official song, written by Hattiesburg composer Bonita Crowe and adopted by the Legislature in 1916. It predates Mississippi's two later state songs by decades, making it the oldest of the three."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Mississippi\" Explained"
    paragraphs:
      - "The song is a formal tribute written in the patriotic style common to early twentieth-century state anthems, expressing pride in Mississippi rather than describing a specific landscape or event. It was composed for public and civic performance rather than popular radio play."
      - "Bonita Crowe was a nationally recognized pianist and composer who lived in Hattiesburg when she wrote the song. She went on to build a notable musical career, later performing at the White House as a guest of First Lady Eleanor Roosevelt and having her compositions performed by the NBC Symphony Orchestra."
      - "Because the song predates modern recording and broadcast standards, it never achieved the wide commercial reach of later Mississippi state songs, remaining better known within the state than outside it."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Mississippi" Represents Mississippi
    paragraphs:
      - "In 1916, Mississippi had no official state song at all, and Crowe's composition filled that gap directly, giving lawmakers a home-grown option written by a Mississippi resident. Its formal, patriotic tone matched what state officials of the era expected from an anthem."
      - "The song's early adoption also gave it a kind of institutional permanence. Even as Mississippi added \"Go, Mississippi\" in 1962 and \"One Mississippi\" in 2022, lawmakers left the original 1916 song in place rather than replacing it."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Mississippi\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Mississippi" Became Mississippi's State Song
    paragraphs:
      - "The Mississippi Legislature adopted Bonita Crowe's \"Mississippi\" as the state's official song in 1916, decades before the state considered any additional state songs. It remains the oldest of Mississippi's three officially recognized state songs today."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Mississippi

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Mississippi\" Facts"
    facts:
      - "Mississippi adopted \"Mississippi\" as its official state song in 1916."
      - "Composer Bonita Crowe lived in Hattiesburg, Mississippi, when she wrote the song."
      - "Crowe later performed at the White House as a guest of Eleanor Roosevelt."
      - "Mississippi has added two more official state songs since 1916 without repealing the original."

