faq:
  - question: What is Mississippi's state song?
    answer: "Mississippi's original official state song is \"Mississippi,\" adopted in 1916."
  - question: Who wrote Mississippi's state song?
    answer: "Bonita Crowe, a Hattiesburg composer and pianist, wrote both the words and music."
  - question: When did Mississippi adopt "Mississippi" as its state song?
    answer: "The Mississippi Legislature adopted the song as the official state song in 1916."
  - question: Does Mississippi have more than one official song?
    answer: "Yes. Mississippi also recognizes \"Go, Mississippi\" from 1962 and \"One Mississippi\" from 2022 as official state songs."

