faq:
  - question: "What is Utah's state snack food?"
    answer: "Utah's state snack food is Jell-O, recognized by a Utah Senate resolution in 2001."
  - question: "When did Utah recognize Jell-O as its state snack food?"
    answer: "The Utah Senate passed a resolution recognizing Jell-O as the state snack food in 2001."
  - question: "Why did Utah choose Jell-O?"
    answer: "Utah has long had one of the highest rates of Jell-O consumption per person in the country, a habit often tied to potluck traditions in the state."
