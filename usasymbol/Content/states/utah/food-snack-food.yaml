sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Utah's State Snack Food?"
    paragraphs:
      - "Jell-O is Utah's official state snack food, recognized in 2001. Unlike most of the other designations on this list, Jell-O's status came from a Utah Senate resolution rather than a full state law, a distinction Utah lawmakers themselves noted at the time."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Jell-O"
    paragraphs:
      - "Jell-O is a flavored, sweetened gelatin dessert that sets into a wobbly, colorful gel when chilled. It is sold as a powder mixed with hot water and is often served plain, layered in multiple colors, or mixed with fruit, and is a common feature at potlucks and family gatherings in Utah."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Jell-O Became Utah's State Snack Food"
    paragraphs:
      - "In 2001, the Utah Senate passed a resolution recognizing Jell-O as the state snack, a lighter legislative step than the statutes used for most other state symbols. The move followed years of Utah being associated nationally with unusually high Jell-O sales."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Utah Chose Jell-O"
    paragraphs:
      - "Utah has long ranked among the top states for Jell-O consumption per person, a pattern often linked to the dish's frequent appearance at potlucks and gatherings hosted by the Church of Jesus Christ of Latter-day Saints, which has a large presence in the state. The Senate resolution leaned into that reputation rather than a specific industry connection."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Jell-O Facts"
    facts:
      - "Recognized as Utah's state snack food by a Utah Senate resolution in 2001."
      - "Utah has consistently ranked among the top states for Jell-O consumption per person."
      - "The designation came from a legislative resolution, not a full state statute."
      - "Jell-O is commonly served at potlucks and community gatherings across Utah."

