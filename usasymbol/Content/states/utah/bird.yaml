seo_title: "California Gull: Utah State Bird Since 1955"
seo_description: "Learn how the California Gull became Utah's official state bird in 1955, why it was selected, and what the bird means for the state."

intro_text: "Utah designated the <strong>California Gull</strong> as its official state bird on <strong>February 14, 1955</strong>. Governor J. Bracken Lee signed the legislation introduced by Representative Richard C. Howe. The choice honored an 1848 event when gulls arrived in Salt Lake Valley as Mormon pioneers faced crop destruction from massive cricket swarms. Thousands of gulls fed on the crickets for days, saving substantial portions of the harvest. Pioneers credited the birds with preventing starvation that winter."

shared_states: []

sections:
  - id: "why-chosen"
    icon: "fa-solid fa-bullseye"
    title: "Why Utah Chose This Bird"
    paragraphs:
     - "A cricket plague struck in 1848. Mormon pioneers planted crops after surviving a harsh first winter in Salt Lake Valley. Hordes of crickets descended from the foothills and destroyed ripening crops. Settlers fought with clubs, fire, and water. The swarms continued, shaping [the Beehive State identity](/states/utah/nickname/the-beehive-state)."
  
     - "Gulls arrived when desperation peaked. Thousands of birds flew in and fed on crickets for days. Cricket numbers dropped enough to save substantial portions of the harvest. Pioneers credited the birds with preventing starvation."
  
     - "The gull held unofficial state bird status for decades before 1955. No law actually listed the designation. Representative Richard C. Howe sponsored legislation to correct this oversight. The legislature made it official on February 14, 1955."
  
     - "Later research challenged the story. A 1959 U.S. Department of Agriculture review found records of nineteen bird species eating Mormon crickets. Blackbirds, magpies, turkeys, and robins all participated. The report noted gulls destroy many crickets but cannot control populations alone. The gull monument still stands in Salt Lake City's Temple Square."

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "Legislative History"
    subsections:
      - subtitle: "Common Consent Period"
        text: "George Earlie Shankle wrote in 1934 that Utah considered the gull its state bird by common consent. The bird held this unofficial status for over a century. Everyone knew it symbolized pioneer survival, but statute books contained no formal designation. The Sea Gull Monument erected in Salt Lake City in 1913 reinforced public recognition."
      
      - subtitle: "Formal Adoption Process"
        text: "House Bill 51 came before the 1955 legislature. Representatives Richard C. Howe and Jaren L. Jones sponsored the measure. The bill passed without significant opposition. Governor J. Bracken Lee signed it February 14, 1955 — formalizing a designation that had existed by common consent for over a century."
      
      - subtitle: "Species Ambiguity"
        text: "Utah Code lists the state bird simply as sea gull — no specific species appears in the statute. Official state websites consistently identify it as the California Gull despite this vague language. The imprecision likely reflects the informal common-consent tradition the 1955 law was codifying: everyone knew which gull the monument in Temple Square commemorated."

  - id: "symbolism"
    icon: "fa-solid fa-heart"
    title: "What This Bird Represents"
    subsections:
      - subtitle: "Pioneer Survival"
        text: "The gull is tied to the defining survival story of Utah's pioneer settlement. Settlers faced starvation during their first full harvest season. Cricket destruction of crops would have meant death through winter. Gull arrival at the critical moment became known as the Miracle of the Gulls — a story that passed through generations and shaped Utah's founding identity. The Sea Gull Monument in Temple Square, erected in 1913, keeps that memory visible in the state's most visited public space."
      
      - subtitle: "Agricultural Protection"
        text: "Farmers valued gulls as beneficial pest controllers. The birds ate grasshoppers, beetles, and rodents from agricultural fields. They follow plows to pick up insects turned over by machinery, and have been observed waiting near irrigation channels for rodents flushed from their holes. This practical utility reinforced the gull's positive standing in Utah's agricultural communities well beyond the 1848 event."
      
      - subtitle: "Monument Recognition"
        text: "Salt Lake City's Sea Gull Monument commemorates the 1848 event. Two bronze gulls perch atop a granite column in Temple Square. The inscription reads that gulls saved pioneers from starvation by feeding on crickets. Dedicated in 1913, the monument predated official state bird designation by 42 years."

  - id: "physical"
    icon: "fa-solid fa-magnifying-glass"
    title: "Physical Characteristics"
    subsections:
      - subtitle: "Size and Structure"
        text: "Adults measure eighteen to twenty-two inches long. Wingspan ranges from forty-eight to fifty-four inches when extended. Weight varies from one pound to just over two pounds. Males run larger than females by six to ten percent in skeletal measurements. Bill appears parallel-sided without the expansion at the gonydeal angle seen in other gulls."
      
      - subtitle: "Adult Plumage"
        text: "Breeding adults show white heads, necks, and underparts. The back and upper wings display slate-gray coloring darker than ring-billed gulls. Black wingtips feature white spots at the tips. Bills are yellow with a black ring near the tip plus a red spot on the lower mandible. Dark brown eyes contrast with bright red orbital rings. Greenish-yellow legs complete the appearance."
      
      - subtitle: "Immature Development"
        text: "First-year juveniles appear mottled brown and white overall. Pink legs and bills with black tips mark young birds. Second-year gulls begin showing gray on the back while retaining brown mottling. Blue tint appears on legs and bill base. Third-year birds resemble adults closely but lack fully developed bill and wing patterns. Full adult plumage arrives in the fourth year."
      
      - subtitle: "Field Identification"
        text: "Size falls between smaller ring-billed gulls and larger herring gulls. Dark eyes distinguish California Gulls from herring gulls. More extensive black on wingtips creates a nearly square-cut shape compared to similar species. Round head and slender bill help separate them from herring gulls in flight."

  - id: "behavior"
    icon: "fa-solid fa-music"
    title: "Behavior and Song"
    subsections:
      - subtitle: "Vocalizations"
        text: "The main call consists of repetitive kee-yah notes. First two notes stretch longer and more drawn out than later ones. Pitch runs higher than corresponding herring gull calls. Voice quality sounds hoarse and scratchy rather than clear. Breeding colonies create constant noise from gulls defending territories against neighbors."
      
      - subtitle: "Foraging Methods"
        text: "California Gulls use multiple foraging strategies. They walk and wade through shallow water picking up prey, swim while grabbing food from the surface, and swoop down from flight to snatch items. Agricultural areas attract them to follow plows for exposed insects and rodents."
      
      - subtitle: "Social Structure"
        text: "Highly gregarious birds gather in flocks numbering thousands. Colony nesting brings concentrations of 4,000 nests per football field at major sites. Mono Lake hosts 44,000 to 65,000 California Gulls arriving each April. Great Salt Lake supports even larger numbers. Dense nesting means neighbors position within two feet of each other."
      
      - subtitle: "Territorial Defense"
        text: "Breeding gulls defend nest areas aggressively. They stretch necks straight up and open bills to chase intruders. Constant screaming fills colonies as birds protect territories. Despite social nature outside breeding season, territorial behavior prevents other gulls from approaching active nests closely."

  - id: "habitat"
    icon: "fa-solid fa-tree"
    title: "Habitat and Range"
    subsections:
      - subtitle: "Breeding Distribution"
        text: "Nesting occurs around interior lakes and marshes from Northwest Territories south to eastern California and Colorado. Great Salt Lake historically held eighty percent of breeding California Gulls before the 1930s. Mono Lake in California hosts the second-largest colony. New breeding colonies established on reservoirs built across the West after 1930."
      
      - subtitle: "Seasonal Movements"
        text: "Most populations migrate to the Pacific Coast for winter. Some birds remain at interior sites year-round where water stays open. Juveniles sometimes stay coastal through summer instead of returning to breeding grounds. Spring migration brings birds back to colonies three to seven weeks before egg laying begins."
      
      - subtitle: "Utah Presence"
        text: "Great Salt Lake remains the primary breeding location. Colonies nest on islands safe from land predators, where brine flies hatching in large numbers provide rich food sources. Urban gulls also feed at garbage dumps around Salt Lake City and other population centers, and agricultural lands throughout Utah attract foraging birds throughout the breeding season."
      
      - subtitle: "Habitat Preferences"
        text: "Sparsely vegetated islands and levees in saline lakes provide ideal breeding sites. Harsh conditions tolerated by California Gulls exclude ring-billed and herring gulls from some locations. Winter habitat includes seacoasts, estuaries, mudflats, beaches, and farmland. Garbage dumps supply food year-round near cities."

  - id: "interesting-facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "The scientific name Larus californicus means California gull, yet Utah claims it as the state bird while California does not. The species breeds primarily in interior states rather than coastal California where it winters."
      
      - "Young California Gulls enjoy playing with sticks. Juveniles pick up sticks, drop them, then pick them up again repeatedly. Adults almost never exhibit this play behavior. Scientists consider it practice for manipulating food items."
      
      - "Before the 1930s, eighty percent of California Gulls bred near Great Salt Lake. Dam construction created new reservoirs and breeding sites across the West. Population growth followed as gulls discovered garbage dumps near growing cities provided year-round food."
      
      - "California Gulls arrive at northern breeding sites in April when temperatures stay below zero and lake ice remains thick. Mono Lake sees up to 65,000 gulls returning from winter grounds. Downy chicks hatch in June despite harsh spring conditions."
      
      - "The 1955 Utah statute designating the state bird lists it generically as sea gull without specifying California Gull. Official websites correct this vagueness, but the law itself remains taxonomically imprecise. Birders joke about this legislative oversight."
      - "Nineteen different bird species ate Mormon crickets during the 1848 plague according to a 1959 USDA report. Blackbirds, magpies, turkeys, robins, ospreys, sparrows, and vultures all participated. Gulls got the monument, but they had plenty of help controlling the outbreak."

faq:
  - question: "When did Utah adopt the California Gull as state bird?"
    answer: "Utah officially adopted the California Gull on February 14, 1955, when Governor J. Bracken Lee signed the legislation. Representative Richard C. Howe introduced the measure. The bird had been considered Utah's state bird by common consent since the 1800s but lacked formal legal designation until 1955."
  
  - question: "What happened during the Miracle of the Gulls in 1848?"
    answer: "Mormon pioneers faced starvation when cricket swarms destroyed their 1848 crops. Thousands of gulls arrived and fed on the crickets for days, eating until full then disgorging and eating again. The birds reduced cricket numbers enough to save substantial portions of the harvest, preventing winter starvation."

  - question: "Why is Utah's state bird named after California?"
    answer: "The California Gull was first scientifically described from California specimens, giving it that name. However, the species breeds primarily around interior lakes in Utah, Nevada, and other western states. Most California Gulls only visit California during winter migration to the Pacific Coast."
  
  - question: "What does a California Gull look like?"
    answer: "Adult California Gulls have white bodies with slate-gray backs and wings. They show yellow bills with black rings and red spots, dark brown eyes, and greenish-yellow legs. Black wingtips display white spots. The birds measure eighteen to twenty-two inches long with wingspans reaching fifty-four inches."
  
  - question: "Where can you see California Gulls in Utah?"
    answer: "Great Salt Lake hosts the largest breeding colony. You find California Gulls around other Utah lakes, marshes, and agricultural areas during breeding season. They also gather at garbage dumps near cities year-round. Some birds winter along the Pacific Coast instead of staying in Utah."
  
  - question: "What do California Gulls eat?"
    answer: "These opportunistic feeders eat insects, fish, aquatic invertebrates, small rodents, eggs of other birds, and carrion. They scavenge at garbage dumps, follow plows in agricultural fields for exposed insects, and catch prey while walking, wading, swimming, or flying. Brine flies from saline lakes provide important food at some colonies."

