faq:
  - question: "What is Utah's state dinosaur?"
    answer: "The timing was extraordinary. In 1993, while Jurassic Park was in post-production and Spielberg's team had already scaled the Velociraptors up for dramatic effect, James Kirkland's team announced the discovery of a dromaeosaurid from Utah that was genuinely that size. Utahraptor ostrommaysorum — the largest known raptor, up to 7 meters — became famous almost immediately, its announcement perfectly timed to meet a public primed for giant raptors by a film still in theaters. Utah designated it as official state dinosaur by House Bill 65 in 2018."

  - question: "Why is Utahraptor famous?"
    answer: "Utahraptor is the largest known member of the dromaeosaurid (raptor) family — significantly bigger than Velociraptor or Deinonychus. Its 1993 description coincided with the release of Jurassic Park, which had already made 'raptors' famous. The timing created an immediate convergence of scientific and popular interest."

  - question: "Who is Utahraptor named after?"
    answer: "The species name ostrommaysorum honors two people: John Ostrom, the Yale paleontologist whose research established the bird-dinosaur connection, and Chris Mays, founder of Dinamation International Society, which funded the research. The name is the Latin plural possessive of both names combined."

  - question: "Why was the name changed from ostrommaysi to ostrommaysorum?"
    answer: "The original 1993 publication used ostrommaysi, treating the honorific as a single name. A 2013 grammatical correction changed it to ostrommaysorum — the proper Latin plural possessive for two honorees (Ostrom + Mays). This is a nomenclatural emendation, not a taxonomic change."

  - question: "What is the Utahraptor Project?"
    answer: "In 2001, paleontologist Scott Madsen discovered a massive 9-metric-ton block of Cedar Mountain Formation sandstone containing the bones of multiple Utahraptor individuals — juveniles through adults — along with an iguanodontian dinosaur. The multi-year excavation, transport, and preparation project, led by James Kirkland, is one of the most ambitious ongoing raptor research efforts in North America."

  - question: "How big was Utahraptor?"
    answer: "Utahraptor is estimated at 5.5–7 meters in length and possibly 280–500 kilograms in weight — the largest known dromaeosaurid. Its sickle claw was approximately 22–24 centimeters long."

  - question: "Where can I see Utahraptor fossils in Utah?"
    answer: "The Natural History Museum of Utah in Salt Lake City is the primary public resource for Utah dinosaur fossils, including Cedar Mountain Formation material. The Utah Field House of Natural History State Park Museum in Vernal covers the Uintah Basin fossil record. The Cedar Mountain Formation exposures near Moab in Grand County are accessible for geological context."

