title: "Utahraptor ostrommaysorum"
adopted_year: 2018
legislation: "Utah House Bill 65 (2018)"
meaning: "Utahraptor was announced to science in 1993 — just as Jurassic Park was in production and the Velociraptor had become, through that film's creative license, an iconic predator. The discovery of an actual large raptor, from Utah, at that precise moment was one of the more extraordinary coincidences in dinosaur science. The animal deserved the attention."
scientific_name: "Utahraptor ostrommaysorum"
period: "Early Cretaceous (Barremian), ~126 million years ago"
discovered_in: "1991"
diet: "Carnivore"
length: "~5.5–7 meters"
weight: "~280–500 kg (estimated)"
named_by: "Kirkland, Gaston & Burge, 1993"
