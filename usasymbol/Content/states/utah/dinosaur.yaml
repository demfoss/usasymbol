  - year: "1993"
    description: "Kirkland, Gaston & Burge formally name Utahraptor ostrommaysorum — the announcement coincides with the theatrical release of Jurassic Park, generating immediate global attention"
  - year: "2001"
    description: "Scott Madsen discovers the massive Utahraptor Project block in Grand County, containing multiple individuals at different growth stages in an apparent death trap"
  - year: "2013"
    description: "The species name is corrected from ostrommaysi to ostrommaysorum — a grammatical emendation to correctly reflect the Latin plural possessive for two honorees"
