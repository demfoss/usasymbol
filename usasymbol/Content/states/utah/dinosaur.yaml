faq:
  - question: "What is Utah's state dinosaur?"
    answer: "Utah's state dinosaur is Utahraptor ostrommaysorum. It was adopted in 2018."

  - question: "Why is Utahraptor famous?"
    answer: "It is the largest known dromaeosaurid, or raptor."

  - question: "Who is Utahraptor named after?"
    answer: "The species name honors John Ostrom and Chris Mays."

  - question: "Why was the name changed from ostrommaysi to ostrommaysorum?"
    answer: "It was corrected in 2013 to use the proper Latin plural form."

  - question: "What is the Utahraptor Project?"
    answer: "It is a long-running excavation and research project centered on a large multi-animal Utahraptor block."

  - question: "How big was Utahraptor?"
    answer: "It was about 5.5 to 7 meters long and may have weighed 280 to 500 kg."

  - question: "Where can I see Utahraptor fossils in Utah?"
    answer: "The Natural History Museum of Utah in Salt Lake City is the best place to start."

