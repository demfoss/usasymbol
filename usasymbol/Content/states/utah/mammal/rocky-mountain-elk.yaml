faq:
  - question: "What is Utah's state animal?"
    answer: "Utah's state animal is the Rocky Mountain elk (Cervus canadensis nelsoni), designated as the official state mammal on February 1, 1971, when Governor Calvin Rampton signed Senate Bill No. 18 into law."
  
  - question: "When was the Rocky Mountain elk designated as Utah's state animal?"
    answer: "The Rocky Mountain elk became Utah's state animal on February 1, 1971. The designation followed a proposal from fourth-grade students at Ashman Elementary School in Sevier County who researched Utah's wildlife and advocated for elk recognition because of the species' importance to hunting heritage and successful recovery from near-extinction."
  
  - question: "Why did Utah choose the Rocky Mountain elk as its state animal?"
    answer: "Utah chose the Rocky Mountain elk to honor the species' recovery from near-extinction and to represent the state's conservation achievements, wilderness heritage, and outdoor recreation traditions. By the 1890s, unregulated hunting had reduced Utah's elk to perhaps a dozen animals. Through habitat protection, hunting bans, transplants from Wyoming and Yellowstone, and science-based management, populations recovered to approximately 80,000 elk today. The designation acknowledged this conservation success story and the economic importance of elk hunting to Utah's rural communities."
  
  - question: "Where can I see elk in Utah?"
    answer: "Hardware Ranch near Hyrum offers guaranteed elk viewing during winter months (November through February) when wildlife managers feed several hundred elk and visitors ride horse-drawn sleighs through feeding areas. Other excellent viewing locations include Mirror Lake Highway in the Uinta Mountains, Wasatch Mountain State Park near Midway, Boulder Mountain along Scenic Byway 12, and the Book Cliffs region. Autumn (September and early October) provides prime viewing when bulls bugle during the rut, though elk are most active during dawn and dusk hours year-round."
  
  - question: "Are Rocky Mountain elk native to Utah?"
    answer: "Yes, Rocky Mountain elk are native to Utah and inhabited the state's mountain ranges for thousands of years before European settlement. Archaeological evidence and historical accounts confirm elk presence throughout Utah's mountains, where indigenous peoples including the Ute, Paiute, Shoshone, Goshute, and Navajo hunted them for meat, hides, and materials. Unregulated hunting during the late 1800s nearly eliminated elk from Utah, but they are not an introduced species. The 155 elk transplanted from Jackson Hole and Yellowstone between 1912 and 1920 represented the same Rocky Mountain elk subspecies that historically inhabited Utah, supplementing the tiny remnant herd rather than introducing a non-native species."
  
  - question: "How many elk live in Utah?"
    answer: "Utah's Rocky Mountain elk population currently numbers approximately 80,000 to 84,000 animals distributed throughout the state's mountain ranges. Population levels meet management objectives established by the Utah Division of Wildlife Resources through the statewide elk management plan. This represents remarkable recovery from fewer than twenty animals in 1898, when unregulated hunting and habitat loss nearly caused extinction. Elk populations grew rapidly from 18,000 in 1975 to 58,000 by 1990, then stabilized at current levels through regulated hunting designed to balance available habitat with recreational demand."
  
  - question: "Can you hunt elk in Utah?"
    answer: "Yes, Utah offers extensive elk hunting opportunities through various seasons including archery, general any-weapon, muzzleloader, and limited-entry hunts managed for older bulls with larger antlers. The Utah Division of Wildlife Resources uses regulated hunting as a primary management tool to maintain elk populations within habitat capacity and acceptable levels of agricultural conflict. Hunting license sales and federal excise taxes on firearms and ammunition through the Pittman-Robertson Act provide primary funding for elk habitat conservation and management throughout Utah. Current population levels allow approximately 80,000 elk to support sustainable harvest while maintaining healthy herds."
  
  - question: "What does 'wapiti' mean?"
    answer: "Wapiti is the Shawnee indigenous name for elk, meaning 'white rump' or 'white deer.' The name refers to the elk's distinctive cream-colored rump patch, which contrasts sharply with the animal's tan body and dark brown head and legs. European colonists applied the name 'elk' to these animals when they arrived in North America, though the term properly refers to what North Americans call moose. Many biologists and wildlife enthusiasts prefer the term wapiti because it acknowledges indigenous knowledge and avoids confusion between North American elk and Eurasian elk (which are actually moose). The scientific name Cervus canadensis means 'deer of Canada,' though the Rocky Mountain subspecies designation 'nelsoni' honors naturalist Edward W. Nelson."

