is_official: true
legislation: "Adopted by the Utah State Legislature in 1997"

author: USA Symbol Team
date_published: '2026-07-30'
date_modified: '2026-07-30'
seo_title: "Utah State Fruit | Cherry"
seo_description: "Utah's state fruit is the cherry, adopted in 1997, grown widely in orchards along Utah Lake and the Wasatch Front."
hero_image: /images/foods/utah/utah-state-fruit-hero.webp
hero_image_alt: "Ripe red cherries on a tree branch."
hero_image_caption: "The cherry, Utah's official state fruit."
intro_text: "Utah's state fruit is the cherry, adopted in 1997 to recognize a crop grown widely in orchards along the state's Wasatch Front. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Utah's State Fruit?"
    paragraphs:
      - "The cherry is Utah's official state fruit, designated by the Utah State Legislature in 1997. Cherries are grown in orchards along the Wasatch Front, especially around Utah Lake."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Cherry"
    paragraphs:
      - "Cherries are small, round stone fruits that grow on trees, ranging from sweet dark red varieties to tart red pie cherries. Utah's orchards along the benches above Utah Lake grow both types, harvested in summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Cherry Became Utah's State Fruit"
    paragraphs:
      - "The Utah State Legislature designated the cherry the official state fruit in 1997."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Utah Chose the Cherry"
    paragraphs:
      - "Orchards along the benches near Utah Lake, particularly around Santaquin and Payson, have grown cherries commercially for generations, and Utah has long been a leading producer of tart cherries used for pies and preserves."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Cherry Comes From in Utah"
    paragraphs:
      - "The area around Santaquin and Payson, along the benches near Utah Lake, is Utah's best-known cherry-growing region and hosts an annual Cherry Days festival."
    sites:
      - name: Santaquin cherry orchards
        city: Santaquin
        lat: 39.98
        lng: -111.79
        note: "Utah's leading cherry-growing region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Cherry Facts"
    facts:
      - "Adopted as Utah's state fruit in 1997."
      - "Santaquin and Payson are Utah's leading cherry-growing towns."
      - "Santaquin hosts an annual Cherry Days festival."

