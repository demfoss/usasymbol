    answer: "Utah's state vegetable is the Spanish sweet onion, adopted by the Utah Legislature in 2002."
  - question: "When did Utah adopt the Spanish sweet onion as its state vegetable?"
    answer: "The Utah Legislature designated the Spanish sweet onion the official state vegetable in 2002."
  - question: "Why did Utah choose the Spanish sweet onion?"
    answer: "Utah chose the Spanish sweet onion because it has long been grown commercially on farms across the state."
