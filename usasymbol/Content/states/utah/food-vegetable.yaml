sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Utah's State Vegetable?"
    paragraphs:
      - "The Spanish sweet onion is Utah's official state vegetable, designated by the Utah Legislature in 2002. It is a large, mild onion grown in several farming regions across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Spanish Sweet Onion"
    paragraphs:
      - "Spanish sweet onions are large, mild-flavored onions with light golden skin, grown from spring planting through late summer harvest. They are used widely in home cooking, sliced raw, grilled, or cooked into savory dishes."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Spanish Sweet Onion Became Utah's State Vegetable"
    paragraphs:
      - "The Utah Legislature designated the Spanish sweet onion the official state vegetable in 2002, alongside the sugar beet's designation as the state's historic vegetable in the same year."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Utah Chose the Spanish Sweet Onion"
    paragraphs:
      - "Utah chose the Spanish sweet onion because it has been grown commercially in the state for many years and remains a familiar crop on Utah farms."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Spanish Sweet Onion Facts"
    facts:
      - "Adopted as Utah's state vegetable in 2002."
      - "Utah also designated the sugar beet its state historic vegetable the same year."
      - "Spanish sweet onions are known for their mild flavor."
      - "Spanish sweet onions are harvested in Utah in late summer."

