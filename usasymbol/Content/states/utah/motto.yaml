seo_title: "Utah State Motto | Industry"
seo_description: "Utah's state motto is \"Industry,\" adopted in 1896. The beehive on the seal and the name Deseret, meaning \"honeybee,\" reflect the same pioneer idea."

intro_text: "Utah's state motto is <strong>Industry</strong>. Adopted at statehood in 1896, it reflects the beehive symbol of Mormon pioneers, whose proposed name for Utah, <em>Deseret</em>, means \"honeybee\" in the Jaredite language of the Book of Mormon."

