faq:
  - question: "What is Utah's state motto?"
    answer: "Utah's state motto is \"Industry.\" It was adopted at statehood in 1896 and reflects the beehive culture of the Mormon pioneers who settled Utah beginning in 1847."

  - question: "What does \"Industry\" mean as a state motto?"
    answer: "\"Industry\" means diligent, productive labor. It reflects the collective hard work of the Mormon pioneers who built communities in the Utah desert. The beehive, Utah's state emblem, represents the same idea — organized effort toward a shared goal."

  - question: "What is the connection between Utah's motto and the word Deseret?"
    answer: "Brigham Young proposed naming the region Deseret in 1849. In the Jaredite language of the Book of Mormon, deseret means \"honeybee.\" Congress rejected that name and created Utah Territory in 1850, but the beehive and Industry remained at the center of Utah's official symbols."

  - question: "When did Utah adopt \"Industry\" as its state motto?"
    answer: "\"Industry\" was adopted at statehood on January 4, 1896. The beehive and the motto had appeared on the seal of the proposed State of Deseret since 1849 and on the Utah territorial seal after 1850."

