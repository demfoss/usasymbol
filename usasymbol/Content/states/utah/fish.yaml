seo_title: Utah State Fish | Bonneville Cutthroat Trout
seo_description: The Utah state fish is the Bonneville cutthroat trout, adopted in 1997. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/utah/utah-fish-hero.webp
hero_image_alt: A Bonneville cutthroat trout with a silvery yellow-green body, scattered round black spots, and a red slash under its jaw.
hero_image_caption: The Bonneville cutthroat trout is a native Utah trout and the official state fish.
intro_text: Utah's state fish is the Bonneville cutthroat trout, a native trout with a red mark under its jaw. It became official in 1997. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Utah?
  paragraphs:
  - The Bonneville cutthroat trout is Utah's official state fish. The Utah Legislature adopted it in 1997, and its scientific name is Oncorhynchus clarkii utah.
  - It replaced the rainbow trout, which had been Utah's state fish since 1971.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Bonneville Cutthroat Trout
  paragraphs:
  - Stream-dwelling Bonneville cutthroat trout have yellow-green to silvery gray bodies. Large, round black spots are scattered along the sides and fins.
  - Like other cutthroat trout, it usually has a bright red slash under its lower jaw. That mark gives the cutthroat its name.
  - Its colors and markings can vary from one stream or lake to the next. Most fish are about 7 to 20 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 1997, Senator Pete Suazo of Salt Lake City sponsored a bill to make the Bonneville cutthroat trout the state fish. Governor Mike Leavitt signed it into law on March 12, 1997.
  - The new law replaced the rainbow trout, which had held the title since 1971.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Utah Chose the Bonneville Cutthroat Trout
  paragraphs:
  - The rainbow trout is not native to Utah, but the Bonneville cutthroat trout is. Lawmakers made the switch for historical accuracy.
  - The Bonneville cutthroat trout was also an important food source for Native Americans and pioneers.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Bonneville Cutthroat Trout
  paragraphs:
  - This trout comes from fish that lived in ancient Lake Bonneville. That huge lake later shrank into the Great Salt Lake, which is too salty for fish.
  - Today, it lives in mountain streams and lakes of the Bonneville Basin. It also lives in parts of Idaho, Nevada, and Wyoming.
  - Biologists are working to bring it back to small creeks along the Wasatch Front, such as Beus Creek in Weber County.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Bonneville Cutthroat Trout Facts
  facts:
  - Adopted in 1997 by the Utah Legislature.
  - Scientific name is Oncorhynchus clarkii utah. Some newer sources call it Oncorhynchus virginalis utah.
  - Usually grows to about 7 to 20 inches long.
  - Has a red slash under its jaw and large, round black spots.
  - Comes from trout that lived in ancient Lake Bonneville.
faq:
- question: What is Utah's state fish?
  answer: Utah's state fish is the Bonneville cutthroat trout, a trout that is native to the state.
- question: When did Utah adopt the Bonneville cutthroat trout?
  answer: The Utah Legislature adopted it in 1997. Governor Mike Leavitt signed the bill on March 12, 1997.
- question: Why did Utah choose the Bonneville cutthroat trout?
  answer: It is native to Utah, but the rainbow trout is not. It was also an important food for Native Americans and pioneers.
- question: What was Utah's state fish before the Bonneville cutthroat trout?
  answer: The rainbow trout was Utah's state fish from 1971 until 1997.
- question: Why is it called a cutthroat trout?
  answer: It has a bright red slash under its lower jaw. It looks a bit like a cut on its throat.
