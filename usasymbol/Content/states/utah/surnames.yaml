seo:
  title: "Most Common Last Names in Utah"
  description: "The most common last names in Utah are Smith, Johnson, and Anderson, but Jensen, Christensen, Hansen, and Larsen reveal the state's deep Scandinavian LDS roots."

page:
  h1: "Most Common Last Names in Utah"
  intro: "Smith, Johnson, and Anderson are the most common last names in Utah, while Jensen and Christensen make the top five because Scandinavian Latter-day Saint immigration reshaped the state's surname map. Utah's ranking still begins with broad Anglo-American names, but Danish, Norwegian, Swedish, and later Hispanic surnames show how Salt Lake Valley settlement, Mormon gathering, and modern urban growth layered the state."
  heritage_title: "Mormon Gathering, Scandinavian Converts, and Salt Lake Growth"
  heritage_body: "Mormon pioneers entered the Salt Lake Valley in 1847, and the church's organized gathering system soon drew converts from Britain, Denmark, Norway, Sweden, and other parts of Europe. Danish immigration became especially visible in Utah during the 1860s, leaving Jensen, Christensen, Hansen, Larsen, Olsen, Nielsen, and Sorensen far above their national ranks. By 2010, Salt Lake County held 1,029,655 residents, so statewide surname totals also reflect a larger urban and Hispanic population than older pioneer stereotypes suggest."
  fun_fact: "Christensen ranks fifth in Utah but only 372nd nationally, and Forebears attributes more than 15 percent of all U.S. Christensens to Utah."

surnames:
  - rank: 1
    name: Smith
    count: 28103
    ratio: 115
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith leads Utah because it arrived through several channels at once: early Anglo-American Mormon pioneers, British converts, mining towns, railroad labor, and later migration into the Wasatch Front."

  - rank: 2
    name: Johnson
    count: 26445
    ratio: 122
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', God is gracious. Johnson is common across Utah partly because it fit both English naming traditions and Scandinavian forms such as Johansson and Johansen that were often simplified in English-speaking communities."

  - rank: 3
    name: Anderson
    count: 22925
    ratio: 141
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew or Anders, from Greek 'Andreas'. Anderson ranks unusually high in Utah because Scandinavian Latter-day Saint converts settled throughout the Wasatch Front, Cache Valley, Sanpete County, and other Mormon farming communities."

  - rank: 4
    name: Jensen
    count: 17442
    ratio: 185
    origin: danish
    type: Patronymic
    meaning: "Son of Jens, the Danish form of John. Jensen's fourth-place rank is one of the clearest surname traces of Danish Mormon immigration, which peaked in Utah during the Civil War years and remained strongly tied to church communities."

  - rank: 5
    name: Christensen
    count: 15792
    ratio: 204
    origin: danish
    type: Patronymic
    meaning: "Son of Christen, a Scandinavian form of Christian. Christensen is far more common in Utah than nationally because Danish converts settled in concentrated Mormon towns rather than dispersing through many unrelated immigrant neighborhoods."

  - rank: 6
    name: Jones
    count: 15671
    ratio: 206
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John. Jones came to Utah with British and Welsh Latter-day Saint converts, including mining families who later worked in coal and metal districts from Carbon County to the Tintic region."

  - rank: 7
    name: Brown
    count: 15291
    ratio: 211
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', a nickname for brown hair or complexion. Brown spread through Utah with early American and British Mormon families and remained common as the state absorbed twentieth-century migrants into Salt Lake and Utah counties."

  - rank: 8
    name: Hansen
    count: 15224
    ratio: 212
    origin: danish
    type: Patronymic
    meaning: "Son of Hans, the Germanic and Scandinavian form of John. Hansen's top-10 rank points directly to Danish and Norwegian settlement in Utah, especially in Mormon communities where Scandinavian converts often arrived as families."

  - rank: 9
    name: Peterson
    count: 14768
    ratio: 218
    origin: english
    type: Patronymic
    meaning: "Son of Peter, from Greek 'Petros', rock. In Utah, Peterson can be English, Scottish, or an anglicized Scandinavian Petersen, making it a bridge surname between older British converts and later Nordic Mormon immigration."

  - rank: 10
    name: Davis
    count: 13556
    ratio: 238
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', beloved. Davis entered Utah with Welsh and English converts and appears strongly in pioneer-era settlement records across the Wasatch Front and central Utah farming towns."

  - rank: 11
    name: Taylor
    count: 13030
    ratio: 248
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Taylor was already common among English-speaking converts before Utah statehood in 1896, then gained more bearers through railroad, mining, military, and suburban migration."

  - rank: 12
    name: Nelson
    count: 13025
    ratio: 248
    origin: english
    type: Patronymic
    meaning: "Son of Neil or Nell, with parallel Scandinavian forms meaning son of Niels. Nelson ranks high in Utah because it overlaps British, Danish, Norwegian, and Swedish naming streams that all fed Mormon settlement."

  - rank: 13
    name: Williams
    count: 12280
    ratio: 263
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from Norman 'Willahelm', will plus helm. Williams is common in Utah through Welsh and English Mormon converts, with an added presence in mining counties where Welsh labor traditions were especially strong."

  - rank: 14
    name: Miller
    count: 11202
    ratio: 288
    origin: english
    type: Occupational
    meaning: "From Middle English 'miller', one who ran a grain mill. Utah farming settlements needed mills early, but Miller's rank mostly reflects repeated arrival through English, German, and broad American migration."

  - rank: 15
    name: Larsen
    count: 10116
    ratio: 319
    origin: danish
    type: Patronymic
    meaning: "Son of Lars, the Scandinavian form of Lawrence. Larsen is one of Utah's most visible Danish and Norwegian surnames, tied to the same nineteenth-century LDS migration that lifted Jensen, Christensen, and Hansen."

  - rank: 16
    name: Wilson
    count: 9424
    ratio: 342
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson followed British and American converts into Utah's pioneer settlements and later remained common in the growing Salt Lake City and Ogden urban corridor."

  - rank: 17
    name: Clark
    count: 9227
    ratio: 350
    origin: english
    type: Occupational
    meaning: "From Old English 'clerc', a clerk, cleric, or literate scribe. Clark is a broad Anglo-American surname in Utah, strengthened by pioneer families, railroad-era migrants, and later national movement into the Wasatch Front."

  - rank: 18
    name: Thompson
    count: 8407
    ratio: 384
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson has both English and Scandinavian pathways in Utah, which helps explain its strength in a state shaped by British converts and Nordic LDS immigration."

  - rank: 19
    name: Allen
    count: 8345
    ratio: 387
    origin: english
    type: Patronymic
    meaning: "From the personal name Alan, possibly Celtic in origin. Allen appears across Utah's older Mormon settlement belt and in later American migration, giving it a statewide pattern rather than a single ethnic signature."

  - rank: 20
    name: Martinez
    count: 8228
    ratio: 392
    origin: spanish
    type: Patronymic
    meaning: "Son of Martín, from Latin 'Martinus', of Mars. Martinez enters Utah's top 20 because Hispanic communities grew across Salt Lake, Weber, Utah, and agricultural counties, adding a modern layer to the state's older Anglo and Scandinavian surname base."

unique_surnames:
  - name: Allred
    state_rank: 45
    national_rank: 1738
    origin: english
    why: "Allred is nationally rare but ranks 45th in Utah, a classic pioneer surname carried by Latter-day Saint families who settled in the Intermountain West. Forebears places more than one-fifth of all U.S. Allreds in Utah."

  - name: Nielson
    state_rank: 42
    national_rank: 2780
    origin: danish
    why: "Nielson is a Utah-heavy spelling of a Scandinavian patronymic meaning son of Niels. Its rank reflects Danish and Norwegian LDS settlement, with the name far more visible in Utah than in the country as a whole."

  - name: Hatch
    state_rank: 66
    national_rank: 1237
    origin: english
    why: "Hatch is common enough in Utah to rank 66th, well above its national position. Its local visibility comes from long-established Mormon family networks and the way pioneer surnames remained concentrated across Utah communities."

  - name: Bingham
    state_rank: 95
    national_rank: 1278
    origin: english
    why: "Bingham is nationally modest but locally familiar in Utah, where the name is tied to pioneer families and to Bingham Canyon, the mining district that became one of the state's best-known industrial landscapes."

  - name: Call
    state_rank: 97
    national_rank: 2155
    origin: english
    why: "Call ranks 97th in Utah but far lower nationally, showing the pull of concentrated family settlement. Like Allred and Hatch, it reads as a pioneer-network surname rather than a name spread evenly across the United States."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Smith, Taylor, Miller, and Clark are Utah's top occupational surnames, but they do not tell the whole state story. These names arrived with English-speaking Mormon pioneers, British converts, miners, railroad workers, and later American migrants."
    examples:
      - Smith (metalworker)
      - Taylor (tailor)
      - Miller (grain miller)
      - Clark (clerk or cleric)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Utah's top 20 because both British and Scandinavian naming traditions favored son-of forms. Johnson, Anderson, Jensen, Christensen, Hansen, Peterson, Davis, Nelson, Williams, Larsen, Wilson, Thompson, Allen, and Martinez all come from personal names."
    examples:
      - Johnson (son of John)
      - Jensen (son of Jens)
      - Christensen (son of Christen)
      - Martinez (son of Martín)

  - type: Scandinavian Names
    icon: fa-solid fa-snowflake
    description: "Jensen, Christensen, Hansen, Larsen, Olsen, Nielsen, Nielson, Sorensen, Rasmussen, and Madsen make Utah's surname list look different from most states. Their concentration reflects nineteenth-century Latter-day Saint missions in Denmark, Norway, and Sweden and the church's organized migration to Utah."
    examples:
      - Jensen (son of Jens)
      - Hansen (son of Hans)
      - Larsen (son of Lars)
      - Sorensen (son of Søren)

faq:
  - question: "What are the most common last names in Utah?"
    answer: "The most common last names in Utah are Smith, Johnson, Anderson, Jensen, and Christensen. Hansen, Peterson, Davis, Taylor, and Nelson also rank in the top 12, giving Utah an unusually strong Scandinavian surname profile."

  - question: "Why are Scandinavian last names so common in Utah?"
    answer: "Scandinavian last names are common in Utah because Latter-day Saint missionaries converted many Danes, Norwegians, and Swedes in the nineteenth century, and church migration systems helped bring those families to Utah. That history pushed Jensen, Christensen, Hansen, Larsen, Olsen, Nielsen, and Sorensen far above their national ranks."

