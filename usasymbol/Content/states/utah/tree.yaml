    answer: "The Quaking Aspen (Populus tremuloides) is Utah's official state tree. The Utah State Legislature designated it in 2014 by passing House Bill 16, signed by Governor Gary Herbert."
  
  - question: "What is the Utah state tree called?"
    answer: "Utah's state tree is called Quaking Aspen or trembling aspen. The scientific name is Populus tremuloides, meaning 'poplar that trembles.' It's also called quakies, golden aspen, or simply aspen. The name refers to leaves that tremble in the slightest breeze."
  
  - question: "When was the Utah state tree adopted?"
    answer: "Utah designated the Quaking Aspen as its official state tree in 2014. The Legislature passed House Bill 16 during the 2014 session, signed by Governor Gary Herbert. This formalized a tree Utahns had long considered their symbolic species."
  
  - question: "Why is the Quaking Aspen Utah's state tree?"
    answer: "Utah chose Quaking Aspen because it defines the state's mountain identity and outdoor recreation culture. Aspen groves cover Utah's Wasatch Range, Uinta Mountains, and high plateaus. Pioneers used aspen timber for buildings and fuel. The tree defines ski resort landscapes at Alta, Park City, and other resorts. Fall color viewing draws thousands of tourists to see golden aspen displays each September-October. Pando, a massive aspen clone in Fishlake National Forest, may be Earth's largest and oldest living organism. Aspen represents Utah's mountains, pioneer heritage, and recreation economy."
  
  - question: "What is the Utah state tree name?"
    answer: "The name is Quaking Aspen, referring to trembling leaf motion. The scientific name is Populus tremuloides - Populus means poplar, and tremuloides means 'like trembling.' The flattened leaf stems cause the characteristic quaking motion."
  
  - question: "Where does the Utah state tree grow?"
    answer: "The Quaking Aspen grows throughout Utah's mountains at 6,000 to 11,000 feet elevation. It dominates the Wasatch Range from Logan to southern Utah, covers the Uinta Mountains, and grows on the Wasatch Plateau and Fishlake Plateau. Quaking Aspen has the widest distribution of any North American tree, growing from Alaska to Mexico."
  
  - question: "What are some facts about the Utah state tree?"
