type: State Tree
state: Utah
name: Quaking Aspen
scientific_name: Populus tremuloides
adopted_year: 2014
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-16"
seo_title: "Utah State Tree: Quaking Aspen"
seo_description: "Utah designated the Quaking Aspen as state tree in 2014. Learn why this trembling-leaf tree represents Utah's mountains and fall colors."

intro_text: "Quaking Aspen became Utah's state tree in 2014, recognizing the distinctive tree that covers Utah mountain slopes and creates the state's spectacular golden fall displays. This slender deciduous tree grows 40 to 60 feet tall across Utah mountains, its leaves trembling in the slightest breeze on flattened stems that cause the characteristic quaking motion. Aspen groves blanket Utah's Wasatch Range, Uinta Mountains, and high plateaus, providing the white-barked forests that define Utah's backcountry and appear across [U.S. state tree profiles](/symbols/trees). The species includes Pando, a massive clonal colony in Fishlake National Forest that may be the world's largest and oldest living organism."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Utah State Tree?"
    paragraphs:
      - "Utah's official state tree is the Quaking Aspen, a medium-sized deciduous tree native to the western United States and much of North America. This aspen grows 40 to 60 feet tall in Utah mountains, occasionally reaching 80 feet in favorable sites. The trunk measures one to two feet in diameter on mature trees. Individual aspen stems live only 60 to 90 years in Utah, but the underground root systems can survive thousands of years. Aspen grows rapidly in youth, adding two to three feet per year in favorable conditions. The tree reproduces primarily by sending up new shoots from spreading roots rather than by seeds. This creates clonal colonies where dozens to thousands of individual stems share a single root system. These colonies can cover acres and persist for millennia."
      - "The leaves provide instant recognition with their distinctive trembling motion. Each leaf appears nearly circular, measuring one to three inches across, with fine teeth along the edges. The leaves attach to twigs on flattened stems called petioles. These flat petioles allow leaves to twist and flutter in the slightest breeze, creating the constant shimmering motion that gives the tree its common name. The sound of wind through aspen leaves creates a gentle rustling unique to aspen groves. Leaves emerge pale yellow-green in spring, darken to bright green in summer, and transform to brilliant gold in fall. Utah's aspen forests become spectacular seas of gold each September and October, drawing thousands of visitors to mountain roads. The smooth white bark creates striking contrasts against dark conifers in mixed forests. Black scarring and markings appear on the bark where branches fall off or elk and deer rub antlers."
      - "Quaking Aspen grows throughout Utah's mountains at elevations from 6,000 to 11,000 feet. The species dominates mountain slopes across the Wasatch Range from Logan to southern Utah. Extensive aspen groves cover the Uinta Mountains, Utah's highest range. Aspen forests grow on the Wasatch Plateau, Fishlake Plateau, and the high plateaus of southern Utah. The tree thrives in Utah's mountain climate with cold winters and adequate moisture. Aspen grows in pure stands on some sites and mixes with conifers elsewhere. The species regenerates prolifically after fire, quickly colonizing burned areas. Utah contains some of North America's finest aspen forests. The Pando clone in Fishlake National Forest covers 106 acres with approximately 47,000 stems all connected by a single root system weighing an estimated 13 million pounds. Scientists believe Pando may be 80,000 years old, making it potentially the oldest living organism on Earth."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Utah State Tree Name"
    paragraphs:
      - "The official name is Quaking Aspen, referring to the trembling leaf motion. Utah residents often call it simply aspen or quakies. The scientific name Populus tremuloides combines Populus (Latin for poplar, the genus containing aspens) with tremuloides (Latin for 'like trembling'), describing the shaking leaves. Early Utah pioneers called it quaking asp, golden aspen for fall color, or simply aspen. The genus Populus includes about 35 species of poplars and aspens worldwide."
      - "Some references use trembling aspen, another common name describing the leaf motion. Native American tribes had various names for aspen. The species belongs to the Salicaceae family, the willow family. Utah's Quaking Aspen is the same species found throughout western North America and extending east through Canada. The species has the widest distribution of any North American tree, growing from Alaska to Mexico and coast to coast in northern latitudes. Utah contains exceptional aspen habitat in its mountain ranges, with groves reaching remarkable sizes and displaying brilliant fall colors that define the state's mountain landscapes."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Quaking Aspen Became the Utah State Tree"
    paragraphs:
      - "Utah designated the Quaking Aspen as its official state tree in 2014. The Utah State Legislature passed House Bill 16 during the 2014 session. Governor Gary Herbert signed the legislation establishing aspen as Utah's arboreal symbol. The designation came after decades of informal recognition - Utahns had long considered aspen their symbolic tree despite lacking official status. The 2014 designation formalized what residents already knew - aspen defined Utah's mountains and created the landscapes that made Utah unique."
      - "Utah selected Quaking Aspen because the species defines the state's mountain identity and outdoor recreation culture. When Mormon pioneers settled Utah Territory in 1847, they found extensive aspen groves covering mountain slopes. The white-barked forests provided timber for pioneer buildings and fuel for heating. Aspen wood built barns, sheds, and interior structures across pioneer Utah. The trees grew near settlements at accessible elevations, making aspen the most available mountain timber. Pioneers harvested aspen poles for corral fences and roofing supports. The wood served as fuel, though it provided less heat than oak or pine. Utah settlers learned to recognize weather patterns by watching aspen leaves - the trembling motion intensified before storms as barometric pressure changed, reinforcing the same resilience themes seen in [Utah's state motto](/states/utah/motto/industry)."
      - "The tree became central to Utah's recreation economy and cultural identity. As Utah developed into a winter sports destination in the mid-1900s, aspen groves defined ski resort landscapes. Alta, Snowbird, Park City, and Deer Valley ski areas feature aspen forests that frame runs and provide summer hiking trails. Fall color viewing became a major Utah tourism activity, with tens of thousands traveling mountain roads each September and October to see golden aspen displays. The Alpine Loop, Mirror Lake Highway, and Logan Canyon became famous for aspen colors. Utah artists, photographers, and writers used aspen imagery to represent Utah's natural beauty. The tree appeared in Utah tourism marketing, representing the mountain west lifestyle. Utah's scientific community studied aspen ecology extensively, with Utah State University and Brigham Young University conducting research on aspen genetics, fire ecology, and clonal growth. The discovery and study of the Pando clone brought international attention to Utah's aspen forests. Pando's potential status as Earth's largest and oldest living organism made Utah famous in scientific circles. The 2014 designation recognized that Quaking Aspen represented Utah's mountains, pioneer heritage, recreation industry, fall tourism, and scientific significance, while complementing [Utah's Rocky Mountain elk symbol](/states/utah/mammal/rocky-mountain-elk). The tree symbolized Utah's unique position where Great Basin desert meets Rocky Mountain forests, creating the aspen-covered slopes that define the state's mountain landscapes."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Utah State Tree Facts"
    facts:
      - "Utah designated Quaking Aspen in 2014, formalizing a tree that Utahns had long considered their symbolic species"
      - "The flattened leaf stems (petioles) allow leaves to tremble and quake in the slightest breeze, creating constant motion and gentle rustling sounds"
      - "Pando, a massive aspen clone in Utah's Fishlake National Forest, covers 106 acres with 47,000 stems sharing one root system weighing 13 million pounds"
      - "Scientists believe Pando may be 80,000 years old, potentially making it the world's oldest and largest living organism"
      - "Aspen reproduces primarily through root sprouts rather than seeds, creating clonal colonies where all stems are genetically identical"
      - "Utah's aspen forests turn brilliant gold each September and October, creating spectacular fall displays that draw thousands of tourists"
      - "The smooth white bark has black scarring where branches fell or where elk and deer rubbed antlers during rutting season"
      - "Quaking Aspen has the widest distribution of any North American tree, growing from Alaska to Mexico and coast to coast"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Utah State Tree and Flower"
    paragraphs:
      - "Utah's state flower is the [Sego Lily](/states/utah/flower/sego-lily) (Calochortus nuttallii), designated in 1911. The state adopted its floral symbol 103 years before choosing aspen. Both symbols represent Utah pioneer heritage and mountain ecosystems. The sego lily blooms white with yellow centers in spring and early summer on Utah hillsides and valleys, while aspen towers overhead in mountain forests. Mormon pioneers reportedly ate sego lily bulbs during food shortages. Together these symbols capture Utah from valley floors where pioneers settled to mountain slopes where aspen groves grow. Both represent resilience and adaptation to Utah's challenging environment."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Utah Quaking Aspen"
    paragraphs:
      - "The trembling leaves provide instant identification. Watch the leaves on a calm day - they flutter and quake constantly even in the slightest breeze. This motion distinguishes aspen from all other Utah trees. The leaves appear nearly round, one to three inches across, with fine teeth along the edges. Each leaf attaches to the twig on a flattened stem. Hold a fallen leaf by the stem and notice it's flat rather than round. This flat petiole causes the distinctive trembling. Leaf color changes dramatically with seasons - pale yellow-green in spring, bright green in summer, brilliant gold in fall. The constant shimmering motion and round leaf shape make aspen unmistakable."
      - "The bark creates striking visual impact in Utah forests. Look for smooth, white to pale green bark that appears almost luminescent against dark conifers. The bark feels smooth to touch on young trees. Black spots, scars, and markings mar the white surface where branches fell or where animals rubbed against the trunk. Horizontal lines and diamond patterns mark the bark. As trees age, the lower trunk develops rough, gray-brown furrowed bark while the upper trunk stays smooth and white. This two-toned pattern appears on older aspens. The brilliant white bark makes aspen visible from miles away on Utah mountainsides."
      - "The overall form shows a narrow, columnar crown on individual trees. Aspen trunks grow remarkably straight with minimal taper. The crown appears narrow and upright rather than spreading. Branches grow at sharp upward angles. Most Utah aspen grow in dense groves rather than as isolated trees. These groves contain dozens to thousands of stems standing close together. All stems in a grove may be part of one clonal colony sharing roots. In spring, look for long, drooping catkins that release pollen before leaves emerge. Seeds develop in cottony masses that create a snowstorm effect when released in late spring. The clonal growth pattern creates groves of uniform-aged stems, giving Utah aspen forests their characteristic even appearance."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Utah State Tree Symbolizes"
    paragraphs:
      - "Quaking Aspen represents Utah's mountain identity and connection between past and present. The tree symbolizes pioneer resourcefulness and modern outdoor recreation. For Utahns, aspen evokes golden fall colors, ski resort landscapes, and the mountain culture that defines the state. The species embodies Utah's unique geography where mountains rise abruptly from desert valleys. Aspen's clonal growth represents connection and community - individual stems linked through shared roots. Pando symbolizes Utah's natural wonders and scientific significance. The tree connects modern Utah to pioneer heritage and represents the mountain environments that make Utah distinctive among western states, much like [Utah's state bird story](/states/utah/bird/california-gull) ties landscape to identity."

