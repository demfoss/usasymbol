  - question: "How do you recognize the Utah state tree?"
    answer: "Look for leaves that tremble constantly even in slight breezes due to flattened leaf stems. Round leaves (one to three inches) with fine teeth along edges. Smooth white to pale green bark that appears luminescent against dark conifers. Black scarring and markings on bark. Narrow, columnar crown with upward-angling branches. Brilliant gold fall color. Trees grow in dense groves rather than isolated. The constant trembling motion and white bark provide certain identification."

