type: State Flower
state: Utah
name: Sego Lily
scientific_name: Calochortus nuttallii
adopted_year: 1911
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-15"
seo_title: "Utah State Flower | Sego Lily"
seo_description: "The Sego Lily became Utah's state flower in 1911. This native wildflower with white petals and yellow centers blooms across Utah's mountains and valleys each spring."

intro_text: "The Sego Lily represents Utah's floral emblem, adopted in 1911. White petals marked with purple or yellow at the base create delicate cup-shaped flowers. This native wildflower grows in mountain meadows and foothills throughout Utah from May through July and remains a cornerstone of the [U.S. state flowers collection](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Utah State Flower?"
    paragraphs:
      - "Since 1911, the Sego Lily has represented Utah officially. Each flower displays three white petals. A yellow center with purple markings creates a distinctive pattern. The blooms measure 1 to 2 inches across. Single stems rise 6 to 18 inches from underground bulbs. Grass-like leaves grow at the base of each plant."
      - "Sego Lilies bloom from late May through July across Utah. Mountain meadows between 4,000 and 8,000 feet elevation showcase abundant displays. The Wasatch Mountains, Uinta Basin, and areas around Provo Canyon feature notable populations. Individual flowers last several days. Plants prefer well-drained sandy or rocky soil. Full sun and dry conditions suit sego lilies best, especially in landscapes also associated with [Utah's quaking aspen forests](/states/utah/tree/quaking-aspen)."
      - "Native sego lily populations grow wild throughout Utah in sagebrush areas, mountain slopes, and open grasslands. The bulbs remain dormant underground through winter months. Spring moisture triggers growth and flowering. Seeds form in capsules after pollination by bees and small flies. The plants tolerate drought conditions common across Utah's landscape."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Utah State Flower Name"
    paragraphs:
      - "Known as Sego Lily, this flower's scientific designation is Calochortus nuttallii. The plant belongs to the Liliaceae family. This family includes tulips, lilies, and about 600 species of flowering plants worldwide."
      - "The genus name Calochortus combines Greek words meaning beautiful grass. The graceful flowers and grass-like leaves inspired this name. The species name nuttallii honors Thomas Nuttall, an English botanist who explored western North America during the 1830s. He collected plant specimens throughout the Rocky Mountain region."
      - "The common name sego comes from a Shoshone word for edible bulb. Native American tribes harvested sego lily bulbs as food. Other common names include mariposa lily and butterfly tulip. The flower appears in white, pink, or purple forms across its range. Utah's populations display primarily white petals with yellow and purple markings."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Sego Lily Became the Utah State Flower"
    paragraphs:
      - "Utah made official the Sego Lily as its state flower in 1911. The legislature recognized the flower's historical importance to early Mormon settlers. Stories tell of pioneers eating sego lily bulbs during food shortages in 1848 and 1849. The bulbs provided nutrition when crops failed."
      - "Sego lilies bloomed abundantly across Utah valleys each spring. The delicate white flowers symbolized survival and resilience. Early settlers learned about the edible bulbs from Native American tribes. Ute, Shoshone, and Paiute peoples had harvested the bulbs for generations before European settlement."
      - "The flower represented Utah's pioneer heritage and natural beauty. Artists featured sego lilies in paintings of Utah landscapes. The distinctive markings made the flower easily recognizable. No formal vote occurred. The legislature passed the designation based on the flower's cultural significance and native status throughout Utah, alongside the values now codified in [Utah's motto, Industry](/states/utah/motto/industry)."
      - "Utah's official symbols often carry a specific Utah story. The Sego Lily sustained Mormon pioneers through the famine winter of 1848; exactly a century after the state's founding flower was designated, Utah honored [the Ogden-born inventor who designed America's most famous military pistol](/states/utah/firearm/browning-m1911-pistol) — John Moses Browning — by making the M1911 the first official state firearm in U.S. history."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Utah State Flower Facts"
    facts:
      - "Sego lilies bloom from late May through July at elevations between 4,000 and 8,000 feet across Utah's mountain ranges and meadows"
      - "Mormon pioneers ate sego lily bulbs during food shortages in 1848-1849 when crops failed, learning this survival technique from Native American tribes"
      - "The scientific name Calochortus nuttallii honors Thomas Nuttall, an English botanist who explored and documented western plants during the 1830s"
      - "Unlike cultivated garden lilies that prefer rich soil, sego lilies thrive in poor sandy or rocky soil common throughout Utah's sagebrush country"
      - "Sego lily bulbs grow 1 to 3 inches underground and remain dormant through winter, sprouting only when spring moisture arrives"
      - "The Wasatch Mountains, Uinta Basin, and areas around Provo Canyon feature some of Utah's most abundant sego lily populations each spring"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Utah State Flower and Bird"
    paragraphs:
      - "The [California Gull](/states/utah/bird/california-gull) serves as Utah's state bird, a seabird that helped save pioneer crops from cricket infestations in 1848. Both symbols represent Utah officially. Utah adopted the Sego Lily in 1911 and designated the California Gull as state bird in 1955."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Sego Lily is often associated with survival, resilience, and pioneer heritage in Utah. The flower has been linked to stories of early Mormon settlers who relied on its bulbs for food during harsh winters. Its delicate appearance carries connotations of beauty thriving in difficult conditions, reflecting Utah's landscape and history and the long narrative behind [the Beehive State identity](/states/utah/nickname/the-beehive-state)."

faq:
  - question: "What is Utah's state flower?"
    answer: "Utah's state flower is the Sego Lily. This native wildflower displays white petals with yellow and purple markings and blooms across Utah's mountains and valleys from late May through July."
  
  - question: "When was the Sego Lily adopted as Utah's state flower?"
    answer: "Utah adopted the Sego Lily as its official state flower in 1911. The legislature recognized the flower's historical importance to early Mormon settlers who ate the bulbs during food shortages."
  
  - question: "Why did Utah choose the Sego Lily?"
    answer: "Utah chose the Sego Lily because pioneers relied on its edible bulbs for survival during crop failures in 1848-1849. The flower symbolized resilience and pioneer heritage. Native American tribes taught settlers about harvesting the bulbs."
  
  - question: "Where does the Sego Lily grow in Utah?"
    answer: "The Sego Lily grows in mountain meadows, sagebrush areas, and foothills between 4,000 and 8,000 feet elevation. The Wasatch Mountains, Uinta Basin, and areas around Provo Canyon feature notable populations. Plants prefer well-drained sandy or rocky soil."
  
  - question: "Are sego lily bulbs still eaten today?"
    answer: "Sego lily bulbs are no longer commonly eaten today, though they remain edible. Historical accounts describe them as sweet with a potato-like texture. The plants now serve primarily as wildflowers rather than food sources."

