seo_description: "Utah state symbols: official state symbols include the California gull, sego lily, quaking aspen, beehive, Industry motto, and Beehive State nickname."
snippet_answer: Utah's official state symbols are built around the beehive — an image that appears on the flag, the seal, the Industry motto, and behind the Beehive State nickname. The California gull, sego lily, quaking aspen, Rocky Mountain elk, and Utahraptor complete a list that spans pioneer settlement, mountain wildlife, and fossil country.
