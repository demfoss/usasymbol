sections:
  - id: overview
    icon: fa-solid fa-music
    title: Utah State Dance
    paragraphs:
      - "Utah made square dance its official state folk dance in 1994. The designation connected the dance to a long-running local tradition of community social gatherings organized around simple partner dances."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples in a square, each facing the middle. A caller announces each figure moments before the dancers perform it, keeping the pace lively without requiring a memorized sequence."
      - "Music typically comes from a string band with fiddle, guitar, and banjo carrying the beat. Couples exchange partners briefly during certain figures before rejoining their own partner to finish."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Line up with your partner facing the center of the square, with three other couples completing the sides."
      - title: "Circle Right with the Group"
        description: "Join hands with everyone in the square and step together in the direction the caller announces."
      - title: "Allemande Left with Your Corner"
        description: "Take the hand of the dancer to your left, walk a full turn around them, then release."
      - title: "Do-Si-Do Your Partner"
        description: "Walk toward your partner and pass shoulder to shoulder without turning to face them, then step back."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the square back to your home spot."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Utah
    paragraphs:
      - "Square dance calling organizations campaigned across the country from the 1970s through the 1990s for states to adopt the dance as an official folk symbol. Utah's 1994 designation arrived within that wave, decades after the dance had already been a staple of local social life."
      - "Utah's early settlements built halls and meetinghouses that doubled as venues for community dances, a practice tied closely to church-organized social life. That tradition of gathering neighbors for simple partner dancing gave square dance a natural home in the state."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Utah's State Dance
    paragraphs:
      - "Utah designated square dance its official state folk dance in 1994, joining many other states that made the same choice during a national push by square dance organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Utah adopted square dance as its official state folk dance in 1994."
      - "Utah's pioneer-era settlements held community social dances in local halls and meetinghouses."
      - "A caller announces each square dance figure aloud rather than dancers memorizing a set routine."
      - "Square dance became an official folk dance symbol in numerous states following a decades-long campaign by callers' associations."
      - "Four couples form the basic square, with figures danced together and in exchanged pairs."

