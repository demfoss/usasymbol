    answer: "Utah's official state folk dance is square dance, adopted in 1994."
  - question: When did Utah adopt square dance as its state dance?
    answer: "Utah adopted square dance as its state folk dance in 1994."
  - question: Why did Utah choose square dance?
    answer: "Square dance fit the state's long tradition of community social dancing that dates back to its pioneer settlements."
  - question: Is square dance the same in every state?
    answer: "The basic formation and calls are similar across states, though the social settings that kept the tradition alive, like Utah's community halls, differ by region."

