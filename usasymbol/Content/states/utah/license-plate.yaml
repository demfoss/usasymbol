sections:
- id: current-standard-plates
  icon: fa-solid fa-car-side
  title: Current Utah Standard Plates
  paragraphs:
  - Utah's plate slogan story is easy to oversimplify because "Life Elevated" is the state's most visible tourism slogan, but it is not the only current standard plate text. The Arches plate uses "Life Elevated"; the Skier plate uses both "Greatest Snow on Earth" and "Life Elevated"; the flag plate uses "In God We Trust" with "United We Stand."
  - The Arches and Skier designs entered issue on November 19, 2007. The Skier design kept Utah's snow identity while adding Life Elevated, and the Arches design shifted the state's visual identity toward red rock and national-park scenery.
  - The In God We Trust plate began as a specialty plate in 2013 and became a standard-issue option from January 1, 2017. It should be listed separately because its slogan is not Life Elevated.

- id: life-elevated-meaning
  icon: fa-solid fa-mountain
  title: What "Life Elevated" Means
  paragraphs:
  - "\"Life Elevated\" was announced in 2006 as Utah's tourism brand. It works literally because Utah is one of the highest-elevation states, and it works as a travel phrase because it can cover ski mountains, red rock deserts, national parks, and outdoor recreation without being limited to winter tourism."
  - The slogan solved a branding problem for the state. By the 2000s, Utah was not only a ski destination; it was also the home of Zion, Bryce Canyon, Arches, Canyonlands, and Capitol Reef. The Arches plate made that broader identity visible on ordinary passenger cars.
  - '"Life Elevated" did not erase the ski slogan. Utah kept "Greatest Snow on Earth" alive on the standard Skier plate, so the modern era is better understood as an expansion from ski-only imagery to parallel ski and red-rock identities.'

- id: greatest-snow
  icon: fa-solid fa-snowflake
  title: Greatest Snow on Earth
  paragraphs:
  - "\"Greatest Snow on Earth\" became Utah's standard ski slogan on the 1985 Skier base. Older drafts sometimes list 1983, but the standard passenger plate chronology and Utah DMV historical notes point to 1985."
  - The 1985 Skier plate was a major change after decades of plain plates. It promoted Utah's ski industry and the state's bid-era Olympic ambitions, and it later won ALPCA Plate of the Year for best new plate of 1986.
  - The phrase remains current on the Skier standard plate, paired with "Life Elevated" on the modern design.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Utah License Plate Slogans by Era
  paragraphs:
  - Utah's slogan history has an early 1940s tourism chapter, a long no-slogan gap, a ski era beginning in 1985, and a modern multi-standard-plate era beginning in 2007.
  versions:
  - name: Center Scenic America
    years: 1942-1943, 1945-1946
    image: /images/license-plates/utah/1942-center-scenic-america.jpg
    description: Utah's first plate slogan promoted the state as the scenic center of the West. The 1942 plate was revalidated for 1943 because of wartime metal conservation; the slogan returned on 1945 and 1946 plates.
  - name: This Is the Place
    years: '1947'
    image: /images/license-plates/utah/1947-this-is-the-place.jpg
    description: Issued for the centennial of Mormon pioneers entering the Salt Lake Valley in 1847. It is a one-year historical slogan, not part of the later ski or Life Elevated era.
  - name: The Friendly State
    years: '1948'
    image: /images/license-plates/utah/1948-friendly-state.jpg
    description: A one-year hospitality slogan. Public and official objections to advertising on plates helped end Utah slogans after 1948.
  - name: Greatest Snow on Earth
    years: 1985-November 18, 2007
    image: /images/license-plates/utah/1985-greatest-snow-on-earth.png
    description: Blue-on-white Skier base introduced in 1985. It carried "Greatest Snow on Earth" and became Utah's defining plate image before Life Elevated.
  - name: Life Elevated / Greatest Snow on Earth
    years: November 19, 2007-present
    image: /images/license-plates/utah/2007-current-skier-greatest-snow-life-elevated.png
    description: Redesigned Skier base, issued concurrently with the updated Arches base. It keeps "Greatest Snow on Earth" and adds "Life Elevated."
  - name: Life Elevated
    years: November 19, 2007-present
    image: /images/license-plates/utah/2007-current-arches-life-elevated.png
    description: Updated Arches standard base with Delicate Arch imagery and "Life Elevated."
  - name: In God We Trust / United We Stand
    years: 2013; standard from January 1, 2017-present
    image: /images/license-plates/utah/2017-current-in-god-we-trust-united-we-stand.png
    description: Flag design first issued as a specialty plate in 2013 and standardized from 2017 onward as a standard-issue option.

- id: corrected-timeline
  icon: fa-solid fa-clock-rotate-left
  title: Common Timeline Corrections
  paragraphs:
  - The ski-era date should be 1985, not 1983. Utah's own historical plate material says the Ski Utah plate was issued in 1985, and passenger plate tables list the Skier base from 1985 through November 18, 2007.
  - The Life Elevated bases should be dated to November 19, 2007, not simply 2008. Some articles describe availability as late 2007 or early 2008, but the passenger plate chronology gives the exact first issue date.
  - 'The current status should be plural: Utah has multiple standard plate slogans in circulation, including In God We Trust / United We Stand.'

timeline:
- year: '1942'
  description: Utah first uses "Center Scenic America" on standard passenger plates; the same plate is revalidated for 1943 because of World War II metal conservation.
- year: 1945-1946
  description: '"Center Scenic America" returns on postwar plates.'
- year: '1947'
  description: Utah issues "This Is the Place" for the pioneer centennial.
- year: '1948'
  description: '"The Friendly State" appears for one year, after which slogans disappear from Utah standard plates.'
- year: '1985'
  description: The Skier plate introduces "Greatest Snow on Earth" on Utah standard passenger plates.
- year: '1992'
  description: Utah introduces the Delicate Arch Centennial plate, initially as an extra-fee plate and later as a no-cost standard option alongside the Skier base.
- year: '2006'
  description: Utah announces "Life Elevated" as a statewide tourism brand.
- year: '2007'
  description: On November 19, Utah introduces updated Skier and Arches standard bases; both use Life Elevated, and the Skier plate also retains Greatest Snow on Earth.
- year: '2013'
  description: Utah first issues the In God We Trust / United We Stand plate as a specialty plate.
- year: '2017'
  description: The In God We Trust plate becomes a standard-issue option on January 1.
- year: '2025'
  description: Utah shifts new plates to flat screen printing rather than embossed characters; the slogan lineup remains the same.

faq:
- question: What is Utah's current license plate slogan?
  answer: Utah has more than one current standard slogan. The Arches plate says "Life Elevated," the Skier plate says "Greatest Snow on Earth" and "Life Elevated," and the flag plate says "In God We Trust" and "United We Stand."
- question: When did Utah introduce Life Elevated plates?
  answer: The Life Elevated Arches and Skier standard bases were introduced on November 19, 2007. Some coverage describes the rollout as 2008, but the plate chronology gives the 2007 first-issue date.
- question: Did Life Elevated replace Ski Utah?
  answer: It replaced the older ski-only branding as the main statewide tourism identity, but Utah did not remove the ski slogan from standard plates. "Greatest Snow on Earth" remains on the Skier standard plate.
- question: When did Utah first use Greatest Snow on Earth on plates?
  answer: Utah introduced the Skier standard plate with "Greatest Snow on Earth" in 1985. That date is more accurate than the sometimes-repeated 1983 date.
- question: What was Utah's first license plate slogan?
  answer: Utah's first standard plate slogan was "Center Scenic America," first used on the 1942 plate, revalidated for 1943, and used again in 1945 and 1946.
- question: Was This Is the Place a Utah plate slogan?
  answer: Yes. "This Is the Place" appeared on Utah's 1947 standard passenger plate for the pioneer centennial.

