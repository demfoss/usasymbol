seo_title: "Utah License Plate Slogan | Life Elevated"
seo_description: "Life Elevated became Utah's standard license plate slogan in 2006, replacing The Greatest Snow on Earth."
hero_image: /images/license-plates/utah/2007-current-arches-life-elevated.png
hero_image_alt: Utah Arches license plate with Life Elevated slogan
hero_image_caption: Utah's Arches standard plate carries "Life Elevated." It was introduced with the redesigned Skier base on November 19, 2007.
intro_text: "**\"Life Elevated\"** is Utah's current standard slogan on the Arches plate and also appears on the Skier plate. Utah now has several standard passenger designs, including Skier with **\"Greatest Snow on Earth\"** and the flag design with **\"In God We Trust / United We Stand.\"** This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "Utah's current standard plate slogans are \"Life Elevated\" on the Arches plate, \"Greatest Snow on Earth / Life Elevated\" on the Skier plate, and \"In God We Trust / United We Stand\" on the flag plate. The Life Elevated Arches and Skier bases were introduced November 19, 2007; the In God We Trust plate was first issued in 2013 and became a standard option on January 1, 2017."
