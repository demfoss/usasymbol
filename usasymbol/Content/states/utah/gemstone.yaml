faq:
  - question: What is Utah's state gem?
    answer: "Utah's state gem is topaz, an aluminum silicate mineral adopted by the state legislature in 1969."
  - question: When did Utah adopt topaz as its state gem?
    answer: "Governor Calvin L. Rampton signed the bill naming topaz Utah's official state gem in 1969."
  - question: Why did Utah choose topaz?
    answer: "Topaz Mountain in the Thomas Range is one of the world's most accessible topaz deposits, giving Utah a gem tied to a real, publicly collectible site rather than a stone locked behind private claims."
  - question: Can you collect topaz at Topaz Mountain?
    answer: "Yes. Topaz Mountain, on land managed by the Bureau of Land Management in Juab County, is one of the few places in the world where the public can legally collect topaz crystals."

