seo_title: "Utah State Gem | Topaz"
seo_description: "Utah's state gem is topaz, adopted in 1969. Topaz Mountain in the Thomas Range is one of the few places in the world open to public collecting."
hero_image: /images/gemstones/utah/utah-state-gemstone-hero.webp
hero_image_alt: "Amber-colored topaz crystals from Topaz Mountain, Utah, on a dark background."
hero_image_caption: "Topaz, Utah's official state gem, forms in gas cavities within the rhyolite of Topaz Mountain."
intro_text: "Utah's state gem is topaz, adopted in 1969 for the amber-colored crystals found at Topaz Mountain in the Thomas Range of Juab County. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Utah State Gem
    paragraphs:
      - "Topaz is Utah's official state gem, designated by the state legislature in 1969. The Thomas Range in Juab County, and Topaz Mountain in particular, has produced abundant crystals since long before the designation, making the gem an easy choice for the state."
      - "Utah stands out among topaz-producing regions because the public can legally collect crystals themselves at Topaz Mountain, a rare arrangement for a gem-quality mineral."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Topaz?"
    paragraphs:
      - "Topaz is a hard aluminum silicate mineral that forms as well-defined crystals inside gas cavities within volcanic rock. At Topaz Mountain, crystals and crystal clusters grow inside pockets in white rhyolite, the volcanic rock that makes up much of the mountain."
      - "Utah's natural topaz typically shows a warm amber or sherry-brown color. Prolonged exposure to sunlight gradually fades that color, so crystals collected and left in the sun for long periods can turn colorless over time."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Utah Chose Topaz as Its State Gem"
    paragraphs:
      - "Topaz Mountain, part of the Thomas Range, holds one of the most accessible topaz deposits in the world, drawing rockhounds and families to dig for crystals on land managed by the federal government. That openness made topaz a gem tied to a real, visitable place rather than a stone locked behind private claims."
      - "Utah lawmakers named topaz the state gem in 1969, giving official recognition to a mineral already central to the state's rockhounding culture and to the wider mineral-collecting reputation of the Thomas Range."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Topaz Became Utah's State Gem"
    paragraphs:
      - "Governor Calvin L. Rampton signed the bill naming topaz Utah's official state gem in 1969, formalizing a mineral already well known to the state's collectors."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Topaz Is Found in Utah"
    paragraphs:
      - "Topaz Mountain, in the Thomas Range of Juab County, is Utah's best-known topaz locality and one of the few places in the world where the public can collect the gem directly. Topaz also occurs elsewhere in Beaver and Tooele counties."
    sites:
      - name: Topaz Mountain
        city: Topaz Mountain
        lat: 39.7094
        lng: -113.1060
        note: "Public rockhounding site; type locality for Utah topaz"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Topaz Facts"
    facts:
      - "Adopted as Utah's state gem in 1969, signed into law by Governor Calvin L. Rampton."
      - "Found at Topaz Mountain in the Thomas Range, one of the few places in the world open to public topaz collecting."
      - "Utah's natural topaz crystals form in gas cavities within rhyolite and typically show a warm amber color."
      - "Extended sun exposure gradually fades Utah topaz from amber toward colorless."

