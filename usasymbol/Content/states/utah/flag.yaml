seo_title: "Utah State Flag: Meaning, Beehive Symbol, History & Facts"
seo_description: "See when Utah approved its current flag, what the central imagery means, and how color references are handled for Utah's banner."

intro_text: "Utah adopted a new state flag in 2024, featuring a beehive in a gold hexagon. The design includes horizontal stripes of blue, white, and red. A five-pointed star sits below the beehive, and the redesign now stands out among the [official U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Utah State Flag Is Designed"
    paragraphs:
      - "The Utah state flag serves as the official flag of the state of Utah. The flag displays horizontal stripes in three colors. A blue stripe runs across the top. A white stripe forms irregular mountain peaks in the middle. A red stripe fills the bottom section."
      - "A gold hexagon sits in the center of the flag. Inside the hexagon, a gold beehive appears with a white five-pointed star below it. This design replaced the previous flag on March 9, 2024."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Utah State Flag Means"
    paragraphs:
      - "The Utah state flag meaning comes from symbols reflecting Utah's geography, settlement history, and civic ideals. The design reflects Utah's geographic features and cultural identity."
      - "The beehive stands for industry and community. Utah uses the beehive as its official emblem and calls itself [the Beehive State](/states/utah/nickname/the-beehive-state). The hexagon shape represents strength and unity among Utah's people."
      - "The five-pointed star honors the five original tribal nations in Utah. It also marks 1896, when Utah became the 45th state, and complements the state's formal motto [Industry](/states/utah/motto/industry)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Utah Chose Its State Flag"
    paragraphs:
      - "Utah authorized a new state flag through legislation signed on March 21, 2023. The bill went into effect on March 9, 2024. Governor Spencer Cox signed the measure after the Utah Legislature approved it. The State Flag Task Force managed the redesign process starting in 2021."
      - "The task force received 5,703 design submissions from the public. More than 2,500 came from students. Twenty semifinalist designs were announced in September 2022. Utahns submitted 44,000 survey responses during the comment period. The task force presented a final proposal to the legislature in November 2022."
      - "Utah's first state flag was created in March 1903 for the Louisiana Purchase Exposition in St. Louis. The flag showed the state seal embroidered on a blue field. The legislature made it official in 1911. That design served as Utah's flag for 113 years before the 2024 redesign. The old flag now holds status as the Historic State Flag and remains co-official; that same 1911 era also gave Utah [its official state flower](/states/utah/flower/sego-lily)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Utah Flag"
    versions:
      - name: "Historic State Flag"
        years: "1903–2024"
        image: "versions/historic-1903.webp"
        description: "Blue field with the state seal in color, corrected in 2011 after an 89-year mistake in date placement."

      - name: "Governor's Flag"
        years: "1903–1911"
        image: "versions/governor-1903.webp"
        description: "Original flag with state seal hand-embroidered in white thread before becoming official."

      - name: "Beehive Flag"
        years: "2024–present"
        image: "versions/beehive-2024.webp"
        description: "Current state flag adopted March 9, 2024, featuring tricolor stripes and gold hexagon with beehive."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Utah Flag"
    symbols:
      - id: beehive
        name: "Utah State Flag Beehive"
        image: "symbols/beehive.svg"
        paragraphs:
          - "A gold beehive sits inside the hexagon at the flag's center. The beehive represents Utah's history and sense of community. It connects to Utah's official state motto, Industry."
          - "The beehive appeared on Utah's seal and earlier flags. Early Mormon settlers used the beehive as a symbol. They valued hard work and cooperation, themes that stayed central to Utah's identity for generations."

      - id: hexagon
        name: "Utah State Flag Hexagon"
        image: "symbols/hexagon.svg"
        paragraphs:
          - "A gold hexagon frames the beehive in the flag's center. The hexagon shape resembles honeycomb. It represents strength and unity."
          - "The gold rim symbolizes prosperity. Hexagons are among nature's strongest shapes. This geometric form cradles the beehive."

      - id: star
        name: "Utah State Flag Star"
        image: "symbols/star.svg"
        paragraphs:
          - "A white five-pointed star sits below the beehive. The star honors Utah's five original tribal nations. These include the Navajo, Shoshone, Goshute, Paiute, and Ute peoples."
          - "The star also represents 1896, the year Utah achieved statehood. Utah became the 45th star on the American flag. The star symbolizes hope and loyalty to the nation."

      - id: mountains
        name: "Utah State Flag Mountains"
        image: "symbols/mountains.svg"
        paragraphs:
          - "The white middle stripe forms five irregular peaks. These represent Utah's snowy mountain ranges. Mountains have sheltered residents from time immemorial."
          - "The white color evokes peace and Utah's world-famous snow. The five peaks also connect to the five original tribal nations."

      - id: blue-stripe
        name: "Utah State Flag Blue Stripe"
        image: "symbols/blue-stripe.svg"
        paragraphs:
          - "A blue stripe runs across the top of the flag. Blue represents Utah's wide-open skies and lakes. It links to the background of the historic flag."
          - "The color symbolizes core principles including faith, knowledge, freedom, optimism, and tradition."

      - id: red-stripe
        name: "Utah State Flag Red Stripe"
        image: "symbols/red-stripe.svg"
        paragraphs:
          - "A red stripe fills the bottom section of the flag. This represents Southern Utah's red-rock canyon landscape. Millions of people travel to see these formations each year."
          - "Red symbolizes perseverance. The shade is slightly warmer than the red used in the United States flag."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Utah State Flag Colors"
    paragraphs:
      - "The Utah state flag uses four colors. Blue, white, and red reference the colors of the United States flag. Gold appears in the hexagon and beehive, aligning with Utah's long black-and-gold visual tradition."
    colors:
      - name: "Blue"
        hex: "#002E5D"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Red"
        hex: "#C8102E"
      - name: "Gold"
        hex: "#FFB81C"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Utah State Flag Facts"
    facts:
      - "Utah adopted a new state flag on March 9, 2024"
      - "The State Flag Task Force received 5,703 design submissions"
      - "The previous flag served from 1903 to 2024"
      - "The historic flag contained an 89-year date placement error until 2011"
      - "The beehive is Utah's official state emblem"
      - "The five-pointed star honors five original tribal nations"

faq:
  - question: "Which flag serves as Utah's official banner?"
    answer: "The Utah state flag is the official banner of Utah, featuring horizontal blue, white, and red stripes with a gold hexagon containing a beehive and star."

  - question: "What are the main visual elements on Utah's flag?"
    answer: "The flag shows three horizontal stripes in blue, white, and red. A gold hexagon sits in the center with a beehive and a five-pointed star inside it."

  - question: "In what year did Utah's current flag become official?"
    answer: "The beehive represents Utah's history, sense of community, and the state motto Industry. Utah is known as the Beehive State."

  - question: "What does the Utah state flag represent?"
    answer: "Utah adopted its current state flag on March 9, 2024. The previous flag was adopted in 1911."

  - question: "How do historians explain the symbolism of Utah's flag?"
    answer: "Utah changed its flag to create a more distinctive design that better represents the state's values, landscape, and history. The redesign process involved public input and thousands of submitted designs."

