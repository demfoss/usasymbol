type: State Coat of Arms
state: Utah
name: Utah State Coat of Arms
adopted_year: 1896
is_official: true
meaning: "The Utah coat of arms compresses 50 years of history into a single image. The date 1847 marks the pioneer arrival; the beehive carries the motto 'Industry,' drawn from 'Deseret,' the Mormon settlers' name for their territory; and the six arrows acknowledge the Native American tribes who were already there. An eagle and American flags above and beside the shield place it all within the United States."
meaning_title: Meaning of the Utah Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Utah Coat of Arms: Meaning, Symbols and History'
seo_description: "The Utah coat of arms was adopted in 1896 and shows an eagle above a shield bearing a beehive, six arrows, and sego lilies."
hero_image: /images/coats-of-arms/utah/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Utah, adopted 1896, showing a bald eagle above a shield with a beehive, six crossed arrows, sego lilies, and the date 1847
hero_image_caption: The Utah Coat of Arms, adopted April 3, 1896. A bald eagle with outstretched wings perches above a shield bearing the beehive, the state motto Industry, six crossed arrows, and sego lilies flanking the date 1847.
intro_text: "The Utah coat of arms was adopted on April 3, 1896, at the first regular legislative session after Utah became the 45th state. It shows a bald eagle above a shield with six crossed arrows, a beehive bearing the motto 'Industry,' sego lilies, and the date 1847. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Utah Coat of Arms?
  paragraphs:
  - "The coat of arms is the central design within the Great Seal of Utah. The full seal surrounds it with the words 'THE GREAT SEAL OF THE STATE OF UTAH' in a circle and adds the date 1896 at the base. The coat of arms itself is the shield, the eagle above it, and the elements on and around the shield."
  - "The design was created in 1896 by Harry Edwards and C. M. Jackson. The original seal die cost $65.00 and was produced at the first regular legislative session after Utah achieved statehood."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Utah Coat of Arms
  paragraphs:
  - "Utah became the 45th state on January 4, 1896. The first regular session of the Legislature met that spring and needed to establish official state emblems. The Legislature adopted the Great Seal, which contains the coat of arms, on April 3, 1896."
  - "The design was the work of Harry Edwards and C. M. Jackson. Harry Edwards, born in Ottawa, Canada around 1862, had moved to Utah around 1893 after spending time in Chicago. He and Jackson produced the original seal design for $65.00."
  - "The symbols on the coat of arms all predate 1896. The beehive had been the central emblem of the proposed State of Deseret since 1849. The sego lily saved pioneer lives during the first winter in the Salt Lake Valley. The six arrows referenced the Native American tribes already living in the region."
  - "By the early 2000s, inconsistent versions of the seal and coat of arms had accumulated across state agencies and flag manufacturers. In 2011, the Legislature passed corrections to the official description, and graphic artist Perry Van Schelt produced a standardized rendering that became the new official design."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Utah Coat of Arms
  paragraphs:
  - "The coat of arms groups its symbols in layers: an eagle above, arrows piercing the top of the shield, a beehive and motto in the center, sego lilies at the sides, and American flags flanking the whole design."
  elements:
  - id: eagle
    name: Bald Eagle
    image: /images/coats-of-arms/utah/elements/eagle.webp
    paragraphs:
    - "A bald eagle with outstretched wings perches on top of the shield. Official state sources describe the eagle as symbolizing protection in peace and war. The bald eagle is the national bird of the United States, and its placement above the shield connects the state to federal authority."
  - id: six_arrows
    name: Six Arrows
    image: /images/coats-of-arms/utah/elements/six-arrows.webp
    paragraphs:
    - "Six arrows cross the top of the shield horizontally. Historical sources identify these arrows as representing the six Native American tribes who lived in the Utah region before Mormon pioneers arrived in 1847. The arrows are placed at the top of the shield, directly beneath the eagle."
  - id: beehive
    name: Beehive and Motto
    image: /images/coats-of-arms/utah/elements/beehive.webp
    paragraphs:
    - "A beehive sits at the center of the shield with the word 'INDUSTRY' arched above it. The beehive was the central symbol of Deseret, the name Mormon settlers chose for their proposed state in 1849. 'Deseret' comes from the Book of Mormon and means honeybee."
    - "Congress rejected the name Deseret, in part because of its specifically Mormon origin, and named the territory Utah instead. The beehive remained on the coat of arms as a direct reference to that earlier identity. 'Industry' became Utah's official state motto on March 4, 1959."
  - id: sego_lilies
    name: Sego Lilies
    image: /images/coats-of-arms/utah/elements/sego-lilies.webp
    paragraphs:
    - "Two sego lilies grow on either side of the beehive. The sego lily (Calochortus nuttallii) is Utah's state flower, officially designated on March 18, 1911. Official sources describe it as a symbol of peace."
    - "The sego lily had a practical significance for Mormon pioneers: during the difficult first winter of 1847 to 1848, they dug up and ate the bulbs of the sego lily to survive food shortages. Placing it on the coat of arms connects the official emblem to that founding hardship."
  - id: flags_and_dates
    name: American Flags and Dates
    image: /images/coats-of-arms/utah/elements/flags-dates.webp
    paragraphs:
    - "An American flag stands on each side of the shield, with their poles crossed behind it. The date 1847 appears below the beehive, marking the year Mormon pioneers entered the Salt Lake Valley. The date 1896 appears at the base of the full seal, marking the year Utah became a state."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Utah Coat of Arms
  paragraphs:
  - "Every element on the coat of arms points to a specific moment or group in Utah's early history. The 1847 date records the pioneer arrival and the sego lily records the first winter. The beehive records the community settlers built and the name they wanted for their state. The six arrows record the people who were already there."
  - "The eagle and the American flags show where that history landed: inside the United States, protected by the federal government, with a new date, 1896, that closed the territorial period and opened statehood."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Utah Coat of Arms Facts
  facts:
  - "Adopted: April 3, 1896, at the first regular legislative session after Utah became the 45th state on January 4, 1896."
  - "Designers: Harry Edwards and C. M. Jackson. The original seal die cost $65.00."
  - "The date 1847 on the shield marks the arrival of Mormon pioneers in the Salt Lake Valley. The date 1896 at the base of the seal marks the year of statehood."
  - "The six arrows at the top of the shield represent six Native American tribes who lived in the Utah region before the pioneer settlement."
  - "In 2011, the Legislature updated the official description of the seal and coat of arms. Graphic artist Perry Van Schelt produced the standardized rendering now used as the official design."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Utah Coat of Arms
  paragraphs:
  - "The coat of arms has used the same design elements since 1896. No separate earlier coat of arms existed before statehood, though the proposed State of Deseret had used the beehive as its central emblem since 1849."
  - "The main change in the coat of arms history is the 2011 standardization. Before that, flag makers and state agencies had used many inconsistent versions of the design for decades, since no single official rendering had been specified."
  versions:
  - name: Original Design (Edwards and Jackson, 1896)
    years: 1896
    image: /images/coats-of-arms/utah/versions/original-1896.png
    description: The original coat of arms as adopted on April 3, 1896, designed by Harry Edwards and C. M. Jackson for $65.00. This design established the eagle, beehive, six arrows, sego lilies, and the date 1847 that remain on the coat of arms today.
  - name: Pre-2011 Official Rendering
    years: before 2011
    image: /images/coats-of-arms/utah/versions/pre-2011.svg
    description: A long-used official rendering of the Utah seal and coat of arms before the 2011 legislative corrections. It preserves the same 1896 composition but reflects the inconsistent pre-standardization drawing used by state agencies and flag makers.
  - name: Standardized Rendering (Van Schelt, 2011)
    years: 2011-present
    image: /images/coats-of-arms/utah/versions/current-standard.svg
    description: The official standardized rendering produced by graphic artist Perry Van Schelt following the 2011 legislative corrections. It follows the same legal description as the 1896 original but establishes a single graphic standard for use across all state agencies.

faq:
- question: What does the Utah coat of arms show?
  answer: "The Utah coat of arms shows a bald eagle with outstretched wings perched above a shield. The shield has six crossed arrows at the top, the word 'INDUSTRY' and a beehive in the center, sego lilies on each side, and the date 1847 below. American flags stand on either side of the shield."
- question: What does the beehive mean on the Utah coat of arms?
  answer: "The beehive represents hard work and industry. It also refers to the name 'Deseret,' which Mormon settlers chose for their proposed state in 1849. Deseret comes from the Book of Mormon and means honeybee. Congress rejected the name Deseret and named the territory Utah, but the beehive stayed on the coat of arms."
- question: What do the six arrows mean on the Utah coat of arms?
  answer: "Historical sources say the six arrows represent the six Native American tribes who lived in the Utah region before Mormon pioneers arrived in 1847. The arrows appear at the top of the shield, just below the eagle."
- question: What does 1847 mean on the Utah coat of arms?
  answer: "The date 1847 marks the year Mormon pioneers, led by Brigham Young, arrived in the Salt Lake Valley. It appears on the shield below the beehive as a permanent record of that founding moment."
- question: When was the Utah coat of arms adopted?
  answer: "The Utah coat of arms was adopted on April 3, 1896, at the first regular session of the Legislature. Utah had become a state just three months earlier, on January 4, 1896."
- question: Who designed the Utah coat of arms?
  answer: "The original design was created by Harry Edwards and C. M. Jackson in 1896. The current standardized rendering was produced by graphic artist Perry Van Schelt in 2011, following legislative corrections to the official description."

