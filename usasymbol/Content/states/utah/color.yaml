faq:
  - question: "What are the state colors of Utah?"
    answer: "Utah's traditional state colors are Black and Gold, associated with the historic beehive symbol and prominently featured on the 2024 redesigned state flag. Utah has not formally designated official state colors by legislative statute."
  - question: "What is the HEX code for Utah Gold?"
    answer: "The standard HEX code for Utah Gold is #FFBE00, corresponding to Pantone PMS 116, consistent with the golden beehive imagery on the Utah state flag and seal."
  - question: "Why is gold associated with Utah?"
    answer: "Gold's association with Utah derives from the beehive — Utah's central state symbol since the pioneer era — whose honeycomb imagery makes gold the natural color of the state's foundational emblem. Utah's nickname, the Beehive State, reinforces this connection. The 2024 state flag redesign prominently features a golden beehive on a dark field."
  - question: "What is the Utah state flag's new design?"
    answer: "Utah adopted a redesigned state flag effective January 1, 2024, featuring a golden beehive centered on a dark blue-black field with gold stars. The new design replaced the complex coat-of-arms flag used since 1913 and brought black and gold more explicitly into Utah's official visual identity."
  - question: "Are black and gold Utah's official state colors?"
    answer: "Black and gold are traditional rather than officially designated state colors in Utah. The Utah Legislature has not formally codified official state colors by statute, but the 2024 state flag's prominent use of black and gold has given the pairing a stronger official character than any previous state emblem."

