title: "Official and Traditional Colors of Utah"
state: "Utah"
adopted_year: 2024

seo_title: "Utah State Colors: Official HEX Codes & Meaning"
seo_description: "Utah state colors are Black and Gold, based on the 2024 state flag and beehive symbol. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The traditional state colors of Utah are **Black** and **Gold**, deeply associated with the state's historic beehive symbol and prominently featured on [the Utah state flag](/states/utah/flag/utah-state-flag) redesigned in 2024. Although black and gold have not been formally designated as official state colors by the Utah Legislature, they function as Utah's most recognized color identity through the state flag, state seal imagery, and the branding of the state's most prominent institutions. All technical color values — HEX, RGB, CMYK, and Pantone — are in the specifications below, suitable for print, web, and official Utah state branding."

official_colors: "Black and Gold"
official_since: "Semi-official (no formal legislative designation; associated with state flag design and traditional beehive symbolism)"
primary_use: "State flag design (adopted 2024), state seal imagery, University of Utah athletics, Utah Jazz branding, state government informal applications"
known_for: "Black and gold tied to the beehive — the central symbol of Utah's identity as the Beehive State — and prominently displayed on the modernized 2024 state flag, which brought these colors into the state's official visual identity more explicitly than any previous flag design"

