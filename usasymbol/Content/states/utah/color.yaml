sections:
  - id: "official-designation"
    title: "Status and History of Utah's State Colors"
    style: "default"
    paragraphs:
      - "Utah has not formally designated official state colors by legislative statute, making black and gold a traditional rather than legally codified color identity. The association of black and gold with Utah's state identity derives from two primary sources: the historic beehive symbol that has anchored Utah's official emblems since the territorial period, and the 2024 redesign of the Utah state flag, which prominently features gold against a dark field in a modernized design that brought these colors into explicit official context for the first time."
      - "The semi-official status of black and gold in Utah reflects the organic way in which state color identities sometimes develop through institutional accumulation rather than legislative designation. The University of Utah's crimson and white, the Utah Jazz's purple and gold, and the state flag's various historical designs have all contributed threads to Utah's color identity, but the beehive's gold and the strength implied by black have emerged as the most broadly applicable and resonant pairing across diverse Utah institutions and contexts."
    subsections:
      - subtitle: "The 2024 Utah State Flag and the Consolidation of Black and Gold"
        text: "Utah adopted a redesigned state flag effective January 1, 2024, replacing the complex coat-of-arms design that had represented the state since 1913 with a simplified, vexillologically sound design centered on a golden beehive on a dark blue-black field. The new flag, selected through a public design competition and legislative process, brought black and gold into the state's official visual identity more explicitly than any previous state emblem. The beehive — rendered in gold at the center of the flag — serves as both the visual anchor of the new design and the direct link to [Utah's Beehive State nickname](/states/utah/nickname/the-beehive-state)."
      - subtitle: "The Beehive Symbol and Utah's Territorial Identity"
        text: "The beehive has been Utah's central symbol since before statehood. When Brigham Young led the pioneer settlers into the Salt Lake Valley in 1847, the early community they organized was called Deseret — a word from the Book of Mormon meaning honeybee — and the beehive became the emblem of their cooperative, industrious society. The proposed State of Deseret, which sought statehood in 1849, used the beehive as its primary symbol. When Utah was organized as a territory in 1850 and eventually admitted as the 45th state in 1896, the beehive was incorporated into the state seal and flag, carrying with it the golden imagery of honeycomb that makes gold the color most intrinsically connected to Utah's foundational identity and to the state motto [Industry](/states/utah/motto/industry)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Black and gold in Utah carry a symbolism rooted in the dual nature of the state's character: the stark, dramatic power of its geology and landscape, and the warm, productive industry of its people. Utah is a state of extremes — the salt flats of the Great Basin, the red rock canyons of the Colorado Plateau, the alpine peaks of the Wasatch Range, and the extraordinary geological diversity of five national parks within its borders. Black captures the weight and drama of this landscape: the volcanic rock, the deep canyon shadows, the coal seams of the Book Cliffs, and the vast night skies. Gold captures the warmth, industry, and cooperative spirit symbolized by the beehive that has defined Utah's self-image since the pioneer era."
    subsections:
      - subtitle: "Gold and the Beehive State Identity"
        text: "Utah's nickname, the Beehive State, makes gold the most conceptually essential color in the state's identity. The beehive represents industry — the collective, organized effort that allowed the pioneer settlers to transform the arid Great Basin into a functioning agricultural and civic society within years of their 1847 arrival. The honeycomb's gold is not an incidental color choice but the direct visual language of the beehive symbol: the warm amber-gold of beeswax and honey that gives the hive its visual identity. This gold appears on the Utah state seal, was reinforced by the 2024 flag redesign, and appears across Utah government branding in acknowledgment of the beehive's foundational role in the state's self-definition."
      - subtitle: "Black and Utah's Geological Grandeur"
        text: "Utah contains some of the most dramatic geological diversity in North America. The Colorado Plateau, which covers the southern and eastern portions of the state, is defined by deep canyon systems — including Canyonlands, Bryce Canyon, and Zion — where dark volcanic intrusions, coal-black basalt formations, and deep shadow create a palette of extreme contrast. The Wasatch Front's iron-rich soils and the Book Cliffs' exposed coal seams further embed black in Utah's geological identity. Utah also hosts some of the least light-polluted skies in the American West, with Torrey, Utah, designated as one of the first International Dark Sky Communities, making the deep black of Utah's night sky a recognized natural and cultural asset."

  - id: "state-emblems"
    title: "Usage in the State Flag, Seal, and Institutional Branding"
    style: "default"
    paragraphs:
      - "Black and gold appear most prominently in Utah's 2024 state flag, which features a golden beehive centered on a field of dark blue-black, with gold stars representing Utah's place in the Union and the date of statehood. The Utah state seal, which remains unchanged, features the beehive in gold at its center, flanked by [Sego Lily blooms](/states/utah/flower/sego-lily) and framed by imagery of American flags and the state motto 'Industry.' Beyond official state emblems, black and gold appear in the branding of the Utah Jazz NBA franchise — whose historical use of gold, combined with the team's statewide cultural reach, has reinforced the color pairing's association with Utah — and in the imagery of numerous Utah outdoor brands and tourism campaigns that use the contrast of dark skies and golden landscapes as a visual signature of Utah's unique environment."

