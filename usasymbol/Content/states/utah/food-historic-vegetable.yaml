faq:
  - question: "What is Utah's state historic vegetable?"
    answer: "Utah's state historic vegetable is the sugar beet, adopted by the Utah Legislature in 2002."
  - question: "When did Utah adopt the sugar beet as its state historic vegetable?"
    answer: "The Utah Legislature designated the sugar beet the official state historic vegetable in 2002."
  - question: "Why did Utah choose the sugar beet?"
    answer: "Utah chose the sugar beet because it helped establish a sugar processing industry in the state beginning in the late 1800s."
  - question: "Is the sugar beet grown in Utah today?"
    answer: "Sugar beet production in Utah has declined since its historic peak, which is why the designation is called a historic vegetable."

