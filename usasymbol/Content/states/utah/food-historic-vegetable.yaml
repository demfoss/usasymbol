sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Utah's State Historic Vegetable?"
    paragraphs:
      - "The sugar beet is Utah's official state historic vegetable, designated by the Utah Legislature in 2002. It recognizes the crop's role in building an early sugar processing industry in the state, even though large-scale beet sugar production later declined."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sugar Beet"
    paragraphs:
      - "Sugar beets are large, pale root vegetables grown for their high sugar content, which is extracted and refined into table sugar. They grow underground in cool climates and are harvested in the fall before processing."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sugar Beet Became Utah's State Historic Vegetable"
    paragraphs:
      - "The Utah Legislature designated the sugar beet the official state historic vegetable in 2002, using the word historic to reflect the crop's importance to Utah's past rather than its scale of production today."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Utah Chose the Sugar Beet"
    paragraphs:
      - "Utah chose the sugar beet because the crop helped establish a sugar processing industry in the state beginning in the late 1800s, with sugar factories operating in several Utah communities for decades."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sugar Beet Facts"
    facts:
      - "Adopted as Utah's state historic vegetable in 2002."
      - "Sugar beets once supported a sugar processing industry in Utah."
      - "Sugar is extracted from the beet root through refining."
      - "Utah also has a separate state vegetable, the Spanish sweet onion."

