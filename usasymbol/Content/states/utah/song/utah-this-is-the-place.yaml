sections:
  - id: overview
    icon: fa-solid fa-music
    title: Utah State Song
    paragraphs:
      - "\"Utah...This Is the Place\" is Utah's official state song, adopted in 2003. Brothers Sam and Gary Francis wrote both the music and words in 1996 for Utah's statehood centennial, and lawmakers chose it to replace the more formal \"Utah, We Love Thee\" after schoolchildren asked for a song they actually enjoyed singing."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Utah...This Is the Place\" Explained"
    paragraphs:
      - "The song moves through Utah's landscape, naming its mountains, canyons, and desert country before landing on its title phrase as a refrain. It has an upbeat, march-like tempo, built to be sung by school groups rather than performed as a slow anthem."
      - "Sam and Gary Francis wrote the song together in 1996, pairing a singable melody with lyrics aimed at students. Since its adoption it has become a staple at Utah school assemblies and civic ceremonies, chosen specifically because children find it easy to learn."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Utah...This Is the Place" Represents Utah
    paragraphs:
      - "The title recalls the moment Brigham Young is said to have first looked out over the Salt Lake valley in 1847 and declared it the place his followers would settle. That single phrase ties the song directly to the founding story Utah tells about itself."
      - "Lawmakers also chose the song because real students asked for it. Fourth-graders at Cook Elementary School in Syracuse sang it for state senators before the 2003 vote, arguing their previous state song was too somber for a child to enjoy."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Utah...This Is the Place\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Utah...This Is the Place" Became Utah's State Song
    paragraphs:
      - "The Utah Legislature adopted \"Utah...This Is the Place\" as the new state song in 2003, at the request of a fourth-grade class that found the existing state song, \"Utah, We Love Thee,\" too difficult and dull to sing. Rather than dropping the older song entirely, lawmakers kept it on the books as the official state hymn."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Utah

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Utah...This Is the Place\" Facts"
    facts:
      - "Utah adopted \"Utah...This Is the Place\" as its official state song in 2003."
      - "Brothers Sam and Gary Francis wrote the song in 1996 for Utah's statehood centennial."
      - "The title references Brigham Young's words on first seeing the Salt Lake valley in 1847."
      - "Fourth-graders from Cook Elementary School in Syracuse helped persuade the Legislature to adopt the song."
      - "The song replaced \"Utah, We Love Thee,\" which is now the official state hymn."

