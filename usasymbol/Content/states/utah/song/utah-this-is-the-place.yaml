faq:
  - question: What is Utah's state song?
    answer: "Utah's official state song is \"Utah...This Is the Place,\" adopted in 2003."
  - question: Who wrote Utah's state song?
    answer: "Brothers Sam Francis and Gary Francis wrote both the music and lyrics in 1996."
  - question: When did Utah adopt "Utah...This Is the Place" as its state song?
    answer: "Utah adopted the song in 2003, replacing \"Utah, We Love Thee.\""
  - question: Does Utah have more than one official song?
    answer: "Yes. Utah also recognizes \"Utah, We Love Thee\" as its official state hymn, the song this one replaced."

