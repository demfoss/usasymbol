faq:
- question: What is Utah's state soil?
  answer: "Utah's state soil is the Mivida series, a reddish-brown Aridisol found on the mesa tops and canyon benches of the Colorado Plateau in eastern Utah. It is recognized by the USDA Natural Resources Conservation Service as Utah's representative state soil and supports cattle ranching and pinyon-juniper woodland across the canyon country of the state."
- question: Why is it called Mivida soil?
  answer: "The series is named after the Mivida Mine, a uranium mine in San Juan County in southeastern Utah, near the area where USDA soil scientists first formally described and classified the series. Uranium mining was a major part of San Juan County's economy in the mid-twentieth century."
- question: What color is Mivida soil?
  answer: "The surface is reddish brown — the same iron-stained color as the sandstone canyon walls and mesa caps of eastern Utah. The color comes from iron oxides in the Jurassic and Cretaceous sandstone parent material. The calcic subsoil pales toward pink and then a whitish pink where calcium carbonate has concentrated."
- question: Where is Mivida soil found in Utah?
  answer: "Mivida soil is found on mesa tops, structural benches, and alluvial fans of the Colorado Plateau in eastern Utah, mainly in San Juan, Emery, Wayne, Grand, and Garfield counties. It grows at elevations of 4,500 to 7,000 feet in areas receiving 8 to 12 inches of precipitation per year."
- question: What grows in Mivida soil?
  answer: "Pinyon pine and Utah juniper form the natural woodland canopy. Indian ricegrass, galleta grass, blue grama, and fourwing saltbush grow in the open. Cattle and sheep graze these plants year-round. Dryland winter wheat grows in wetter Mivida sites. Ancestral Puebloans once grew corn, beans, and squash on mesa tops underlain by Mivida soil."
- question: Who chose Mivida as Utah's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Mivida series to represent Utah. It was chosen because it is the most extensive and representative soil on the Colorado Plateau — the canyon country of eastern Utah that is the most distinctive landscape in the state."
- question: How deep is Mivida soil?
  answer: "Mivida soil is deep — the full profile typically extends 60 or more inches before reaching bedrock or unweathered parent material. The calcic horizon, where calcium carbonate accumulates, runs from about 10 to 42 inches below the surface. The reddish surface and cambic layers are in the top 10 inches."

