seo_title: "Utah State Soil | Mivida Series"
seo_description: "The Utah state soil is the Mivida series. It covers mesa tops and canyon benches in eastern Utah and supports cattle ranching and pinyon-juniper woodland."
hero_image: /images/soils/utah/utah-state-soil-hero.webp
hero_image_alt: "Golden aspens below steep rocky mountains in autumn light."
hero_image_caption: "Autumn trees brighten a mountain canyon framed by Utah’s pale rock walls."
intro_text: "Utah's state soil is the Mivida series — a reddish-brown Aridisol named after the Mivida Mine in San Juan County, covering the mesa tops and canyon benches of the Colorado Plateau where cattle ranching and pinyon-juniper woodland define the landscape. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Utah State Soil
  paragraphs:
  - "Mivida soil is a desert soil with a calcium problem — in the best agricultural sense. Thousands of years of scarce rainfall have leached calcium carbonate downward from the surface and deposited it as a white, chalky layer in the subsoil. That calcic horizon is the defining feature of the Mivida series and sets it apart from the younger desert soils around it."
  - "The soil developed from eolian sand and alluvium derived from Jurassic and Cretaceous sandstone — the ancient desert and sea-floor rock that forms the canyon walls and mesa caps of eastern Utah. Very little rain falls here: 8 to 12 inches per year, most of it from summer monsoon thunderstorms and winter snow."

- id: history
  icon: fa-solid fa-landmark
  title: Why Utah Chose the Mivida Soil
  paragraphs:
  - "Soil scientists at the USDA Natural Resources Conservation Service selected the Mivida series to represent Utah because it is the most extensive and representative soil on the Colorado Plateau — the canyon country of eastern Utah that covers more of the state than any other single landscape."
  - "The series is named after the Mivida Mine, a uranium mine in San Juan County in southeastern Utah. Uranium mining shaped the economy of San Juan County through the mid-twentieth century, and the mine site gave its name to the soil series first described in that area."
  - "The Mivida series is recognized by the USDA as Utah's state soil. It was selected because the Colorado Plateau — where Mivida soil is most extensive — covers roughly half of Utah's total land area and is the most geologically distinctive region in the state."

- id: profile
  icon: fa-solid fa-layer-group
  title: Mivida Soil Profile and Horizons
  paragraphs:
  - "Dig into Mivida soil and the surface is reddish brown and gritty — fine sandy loam that crumbles easily in the dry air. A few inches down, the color intensifies slightly as a weak cambic horizon develops. Below that the soil gradually pales as calcium carbonate accumulates, and in the main calcic layer you can see white powdery coatings on the sand grains and pebbles. Deep in the profile the soil returns to a clean pinkish-tan — the wind-deposited sandstone sediment it all came from."
  layers:
  - horizon: A
    name: Surface layer
    depth_in: "0–3"
    color_hex: "#9A4A28"
    color_name: reddish brown
    texture: fine sandy loam
    note: wind-sorted sand; thin organic crust in undisturbed sites
  - horizon: Bw
    name: Cambic subsoil
    depth_in: "3–10"
    color_hex: "#B06040"
    color_name: reddish brown
    texture: fine sandy loam
    note: color slightly richer; weak structure forms here
  - horizon: Bk1
    name: Upper calcic
    depth_in: "10–24"
    color_hex: "#C07858"
    color_name: light reddish brown
    texture: fine sandy loam
    note: calcium carbonate coats peds; pH rises above 8
  - horizon: Bk2
    name: Lower calcic
    depth_in: "24–42"
    color_hex: "#D4AE80"
    color_name: pink
    texture: sandy loam
    note: white powdery carbonate; the diagnostic calcic horizon
  - horizon: C
    name: Parent material
    depth_in: "42–65"
    color_hex: "#DCC090"
    color_name: pale pink
    texture: sandy loam
    note: eolian and alluvial sandstone sediment; original deposit

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Mivida Soil Grows in Utah
  paragraphs:
  - "Mivida soil grows on the flat to gently sloping mesa tops, structural benches, and alluvial fans of the Colorado Plateau in eastern Utah — the red-rock country carved by the Colorado River and its tributaries. Elevations range from 4,500 to 7,000 feet, where the semi-arid climate delivers 8 to 12 inches of precipitation per year."
  - "San Juan County holds the type location and the largest concentration of Mivida soil. The series also extends into Emery, Wayne, and Grand counties — the heart of Utah's canyon country."
  counties:
  - San Juan
  - Emery
  - Wayne
  - Grand
  - Garfield
  - Carbon

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Mivida Soil
  paragraphs:
  - "Cattle ranching is the primary land use on Mivida soil. The mesa tops and canyon benches support sparse but reliable forage: Indian ricegrass, galleta grass, and blue grama provide year-round grazing for cattle and sheep, supplemented by fourwing saltbush and Mormon tea on the drier sites."
  - "Pinyon pine and Utah juniper form the characteristic woodland canopy over Mivida soil where elevation and precipitation allow. This pinyon-juniper zone covers millions of acres of Utah's canyon country and provides habitat for mule deer, pronghorn, and the pinyon jay. Piñon nuts were a critical food source for Ancestral Puebloans and continue to be harvested by Native communities."
  - "Dryland winter wheat is grown on Mivida soil in a few areas where annual rainfall reaches the upper end of the range. Hay and alfalfa require irrigation but are grown in valley bottoms adjacent to Mivida uplands. Much of the San Juan County landscape underlain by Mivida soil was also historically used for uranium and oil exploration."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Mivida Soil Facts
  facts:
  - "The series is named after the Mivida Mine, a uranium mine in San Juan County, southeastern Utah — the area where USDA soil scientists first formally described and mapped the series."
  - "Mivida soil is classified as a Ustic Haplocalcid — an Aridisol with a calcic horizon in a semi-arid ustic moisture regime, meaning it receives slightly more moisture than a true desert soil but dries out completely each summer."
  - "The reddish-brown color comes from iron oxides in the Jurassic and Cretaceous sandstone parent material — the same iron that paints the canyon walls and mesas of the Colorado Plateau their famous red and orange hues."
  - "Mivida soil forms at elevations of 4,500 to 7,000 feet — high enough for pinyon-juniper woodland but low enough to stay in a semi-arid desert moisture regime with only 8 to 12 inches of annual precipitation."
  - "The calcic horizon in Mivida soil — the pale layer where calcium carbonate has accumulated — formed over thousands of years as rainwater dissolved carbonate from the surface and deposited it at the depth where the soil dries out each summer."
  - "Ancestral Puebloan people farmed mesa tops underlain by Mivida soil at sites like Hovenweep and the San Juan River valley, growing corn, beans, and squash in the shallow soil during the wetter centuries of the first millennium AD."

