intro_text: "Minnesota's state gemstone is the Lake Superior agate, adopted in 1969, a banded quartz stone colored red and orange by iron and scattered across the state by glaciers. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Minnesota State Gemstone
    paragraphs:
      - "The Lake Superior agate is Minnesota's official state gemstone, designated by the Minnesota Legislature in 1969. It is a banded variety of chalcedony, colored in shades of red, orange, and yellow by iron, and it formed in ancient lava flows along what is now Minnesota's North Shore."
      - "Minnesota chose a stone found loose across the state rather than one locked in a single mine, giving rockhounds and casual beachcombers alike a real chance of finding one."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is a Lake Superior Agate?"
    paragraphs:
      - "A Lake Superior agate is a banded stone made of chalcedony, a fine-grained form of quartz, with concentric bands of red, orange, yellow, and brown wrapped around a lighter core. The color comes from iron picked up as the stone formed, which is also why the region's iron-rich soil shares the same reddish tint."
      - "Most Lake Superior agates are small, pea-sized to golf-ball-sized, though some collected specimens have weighed twenty pounds or more. Their bands are usually easiest to see when the stone is wet or held up to light, since a dry, dusty agate can look like an ordinary gray pebble."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Minnesota Chose the Lake Superior Agate as Its State Gemstone"
    paragraphs:
      - "The agates originally formed inside gas pockets in lava flows that erupted along the Lake Superior region roughly a billion years ago. Glaciers later ground up that lava rock and carried the loosened agates south and west, scattering them across gravel pits, farm fields, and beaches throughout Minnesota."
      - "That glacial spread made agate hunting a genuine statewide pastime rather than something limited to a single county, and rock clubs and hobbyists had been collecting them for decades before the legislature acted. Longtime rockhound Jean Dahlberg testified before lawmakers in support of the designation, and the bill passed in 1969."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the Lake Superior Agate Became Minnesota's State Gemstone"
    paragraphs:
      - "The Minnesota Legislature designated the Lake Superior agate the official state gemstone in 1969, after rockhound advocate Jean Dahlberg testified before a legislative committee in favor of the bill."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Lake Superior Agates Are Found in Minnesota"
    paragraphs:
      - "Moose Lake, in east-central Minnesota, calls itself the agate capital of the state and hosts an annual Agate Days festival tied to the stone. Agates also turn up widely along the North Shore of Lake Superior and in gravel pits across northeastern and north-central Minnesota, wherever glaciers deposited them."
    sites:
