  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Lake Superior Agate Facts"
    facts:
      - "Adopted as Minnesota's state gemstone in 1969."
      - "Rockhound Jean Dahlberg testified before the Minnesota Legislature in support of the designation."
      - "Glaciers scattered Lake Superior agates far from their volcanic origin point, which is why they now turn up statewide."
      - "The largest recorded Lake Superior agates have weighed more than twenty pounds, far larger than the typical pea-sized stone."

