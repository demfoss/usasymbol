faq:
  - question: What is Minnesota's state gemstone?
    answer: "Minnesota's state gemstone is the Lake Superior agate, a banded chalcedony colored red and orange by iron."
  - question: When did Minnesota adopt the Lake Superior agate as its state gemstone?
    answer: "The Minnesota Legislature designated the Lake Superior agate the official state gemstone in 1969."
  - question: Why did Minnesota choose the Lake Superior agate?
    answer: "Glaciers scattered the agates across the state from their volcanic origin along Lake Superior, making them a common find for rockhounds statewide, and longtime collector Jean Dahlberg pushed for the official designation."
  - question: Where can you find Lake Superior agates in Minnesota?
    answer: "Moose Lake, which calls itself the state's agate capital, and the North Shore of Lake Superior are among the most popular hunting spots, though agates turn up in gravel across northeastern and north-central Minnesota."

