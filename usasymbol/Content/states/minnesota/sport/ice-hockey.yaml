sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Minnesota State Sport
    paragraphs:
      - "Minnesota designated ice hockey its official state sport in 2009, giving legal standing to a level of participation few states can match. Youth leagues, high school programs, and outdoor rinks fill nearly every Minnesota community through the winter months. The state's high school tournament alone draws crowds that rival professional games."

  - id: what-is
    icon: fa-solid fa-hockey-puck
    title: "Ice Hockey in Minnesota"
    paragraphs:
      - "Two teams of six skaters, including a goaltender, try to shoot a puck into the opposing net while skating on ice at high speed, passing and checking to control the puck. Games run in three periods, with substitutions flowing on and off the bench throughout play. The Minnesota Wild, the state's NHL franchise, play home games at Grand Casino Arena in Saint Paul."
      - "High school hockey carries its own weight in Minnesota, led by the Minnesota State High School Hockey Tournament, which regularly draws more combined attendance than any other state high school sports tournament in the country. Boys' and girls' teams compete across the state from small towns to the Twin Cities suburbs. Outdoor pond hockey remains common on the state's thousands of frozen lakes each winter."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Ice Hockey Represents Minnesota
    paragraphs:
      - "Minnesota's long winters and thousands of frozen lakes gave generations of residents a natural rink long before organized leagues existed. That access turned hockey into a sport most Minnesotans learned to play rather than simply watch, from outdoor pond games to youth leagues that start players before grade school. Few states can offer that scale of built-in ice."
      - "The Iron Range town of Eveleth built on that foundation directly. The United States Hockey Hall of Fame has stood there since 1973, and twelve of its inductees grew up in Eveleth alone, a record no similarly sized town in the country can match. The Minnesota Wild added a professional layer when the franchise began play in the 2000-01 season, giving the state an NHL team to go with its amateur depth."
      - "Minnesota's high school tournament turned that participation into a statewide event. Combined attendance across tournament venues has topped 140,000 fans in recent years, more than any other state high school sports championship draws. That kind of turnout for teenage athletes is difficult to find anywhere else in the country."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Ice Hockey Became Minnesota's State Sport
    paragraphs:
      - "Minnesota's designation of ice hockey as its state sport began with sixth-graders at Minnetonka Middle School East, who spent months collecting more than 600 signatures in support of the idea. State Senator Gen Olson introduced the bill in 2007 with Senator David Tomassoni, a former professional player who had competed on Italy's 1984 Olympic team, as co-author. The bill passed with Representative John Berns leading fifteen co-authors in the House, and Governor Tim Pawlenty signed it into law in 2009."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Ice Hockey Facts
    facts:
      - "Minnesota designated ice hockey its official state sport in 2009."
      - "Sixth-graders at Minnetonka Middle School East collected more than 600 signatures to help push the designation into law."
      - "The United States Hockey Hall of Fame has stood in Eveleth, Minnesota, since 1973, and twelve of its inductees are Eveleth natives."
      - "The Minnesota State High School Hockey Tournament draws combined attendance that has topped 140,000 fans across its venues."
      - "The Minnesota Wild, the state's NHL franchise, began play in the 2000-01 season."

