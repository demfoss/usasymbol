faq:
  - question: What is Minnesota's state sport?
    answer: "Minnesota's official state sport is ice hockey, adopted in 2009."
  - question: When did Minnesota adopt ice hockey as its state sport?
    answer: "Minnesota adopted ice hockey as its state sport in 2009, following a push that began with a middle school petition drive."
  - question: Why did Minnesota choose ice hockey?
    answer: "Minnesota's long winters and thousands of frozen lakes gave the state deep youth and high school participation in hockey. The state is also home to the United States Hockey Hall of Fame in Eveleth."
  - question: Did students really help make hockey official?
    answer: "Yes. Sixth-graders at Minnetonka Middle School East collected more than 600 signatures supporting the designation before lawmakers took up the bill."

