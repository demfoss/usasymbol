legislation: Minnesota Statutes § 1.135
meaning: "Minnesota adopted a new Great Seal on May 11, 2024. The current design centers a common loon, a four-point North Star, wild rice, evergreen trees, and stylized water inside a circular border. It replaces the older frontier scene used in official form from 1861 to 2024 and shifts the seal's focus from settlement imagery to shared state symbols, language, and landscape."
