sections:
  - id: history
    icon: fa-solid fa-landmark
    title: Minnesota State Seal History and Origin
    paragraphs:
      - "Minnesota used a historic frontier-style seal for more than a century. The state began using a seal in 1858, the legislature approved Henry Sibley's revised design in 1861, and lawmakers clarified that design again in 1983 after decades of variation in artistic rendering."
      - "In 2023, the Minnesota Legislature created the State Emblems Redesign Commission to adopt a new official seal and flag. The commission reviewed hundreds of seal submissions and selected a concept derived from a design by Ross Bruggink, then revised it further before certifying the final artwork."
      - "The new Great Seal of the State of Minnesota became official on May 11, 2024. It retired the older seal that showed a settler plowing beside a Native rider and replaced it with symbols tied to Minnesota's landscape, language history, and widely shared state emblems."

  - id: elements
    icon: fa-solid fa-shapes
    title: What the Minnesota State Seal Symbols Mean
    paragraphs:
      - "The 2024 seal is built around recognition rather than narration. Instead of a historical scene with human figures, it uses a loon, wild rice, trees, water, and the North Star to identify Minnesota through nature, geography, and long-standing state symbols."
      - "The Dakota phrase Mni Sota Makoce appears across the upper interior of the seal. The phrase refers to the origin of the name Minnesota and is commonly translated as 'Land where the waters reflect the skies' or 'Land of sky-tinted water.' Its inclusion connects the seal to the state's Indigenous linguistic history."
      - "Minnesota's current seal uses a small set of symbols named directly by the Secretary of State in the official description of the design."
    elements:
      - id: wild-rice
        name: Wild Rice
        image: /images/state-seals/minnesota/elements/wild-rice.webp
        paragraphs:
          - "Wild rice appears at the left side of the inner seal. It represents Minnesota's official state grain and one of the most culturally important native plants in the region."
          - "Its presence also points to water, wetlands, and harvest traditions that long predate statehood. The redesigned seal uses wild rice as a symbol rooted in place rather than in conquest or settlement."
      - id: loon
        name: Common Loon
        image: /images/state-seals/minnesota/elements/loon.webp
        paragraphs:
          - "The common loon stands at the center of the seal and serves as its main visual anchor. The loon is Minnesota's official state bird and one of the animals most strongly identified with the state's lakes."
          - "The design keeps the bird highly stylized, with a red eye and bold black-and-white shapes, so the seal remains legible at small sizes on official documents."
      - id: north-star
        name: North Star
        image: /images/state-seals/minnesota/elements/north-star.webp
        paragraphs:
          - "A white four-pointed star appears to the right of the loon. It represents the Star of the North and preserves the idea behind Minnesota's long-standing motto, L'Etoile du Nord."
          - "The star gives the current seal continuity with earlier Minnesota symbolism even though the French motto itself no longer appears in the center artwork."
      - id: mni-sota-makoce
        name: Mni Sota Makoce
        image: /images/state-seals/minnesota/elements/mni-sota-makoce.webp
        paragraphs:
          - "The words Mni Sota Makoce arc across the sky above the loon. The phrase is the Dakota-language source of the state's name and was added by the redesign commission as a central textual element."
          - "Its placement gives the seal a clear verbal identity while shifting the focal language of the emblem away from the older French motto used on the historic seal."
      - id: trees
        name: Evergreen Trees
        image: /images/state-seals/minnesota/elements/trees.webp
        paragraphs:
          - "Green conifer shapes rise at the right side of the seal. The Secretary of State describes them as trees representing the official state tree, the Norway pine, along with Minnesota's natural areas more broadly."
          - "They function as a compact landscape symbol, balancing the wild rice and giving the seal a clear northwoods association."
      - id: water
        name: Stylized Water
        image: /images/state-seals/minnesota/elements/water.webp
        paragraphs:
          - "Bands of blue water fill the lower portion of the seal beneath the loon. They represent Minnesota's many lakes, rivers, and overall abundance of water."
          - "This element ties the entire composition together: the loon stands in water, the wild rice grows from water, and the state's own name refers to sky-tinted water."

  - id: previous-versions
    icon: fa-solid fa-clock-rotate-left
    title: 'Previous Versions of the Minnesota State Seal'
    paragraphs:
      - "Minnesota's seal changed more dramatically in 2024 than most state seals ever do. For more than 160 years, official versions kept the same basic frontier scene even while lettering, orientation, and rendering details changed."
      - "The three versions below show that progression: the 19th-century official design, the 1983 statutory redraw, and the current seal adopted on May 11, 2024."
    versions:
      - name: Historic Official Seal
        years: 1861–1983
        image: /images/state-seals/minnesota/versions/seal-of-minnesota-1861-1983.svg
        description: "The seal approved by the legislature in 1861 kept the frontier composition associated with statehood: a settler plowing, a Native rider, the Mississippi River, St. Anthony Falls, trees, and the motto L'Etoile du Nord."
      - name: Revised Historic Seal
        years: 1983–2024
        image: /images/state-seals/minnesota/versions/seal-of-minnesota-1983-2024.svg
        description: "In 1983, Minnesota rewrote the statutory description and standardized the old seal more tightly. The same core scene remained, but the official redraw adjusted details and the orientation of the Native rider."
      - name: Current Great Seal
        years: 2024–present
        image: /images/state-seals/minnesota/versions/seal-of-minnesota-2024.svg
        description: "The current seal, adopted on May 11, 2024, centers a loon, wild rice, evergreen trees, water, a four-point North Star, and the Dakota phrase Mni Sota Makoce inside a simplified circular design."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Minnesota State Seal Facts
    facts:
      - "Current seal adopted: May 11, 2024"
      - "Historic seal retired: May 11, 2024"
      - "Historic official design approved by legislature: 1861"
      - "1983 version standardized the older seal's rendering"
      - "Central bird: common loon, Minnesota's state bird"
      - "Plant symbol: wild rice, Minnesota's state grain"
      - "Text on current seal: Mni Sota Makoce"
      - "Current star: white four-point North Star"
      - "Water bands symbolize Minnesota's lakes and rivers"

timeline:
  - year: "1858"
    description: Minnesota becomes a state on May 11. A seal is used at statehood, but the design still needs legislative revision and clarification.
  - year: "1861"
    description: The legislature adopts Henry Sibley's revised official seal, including the wording "The Great Seal of the State of Minnesota 1858" and the motto L'Etoile du Nord.
  - year: "1983"
    description: Minnesota updates the statutory design description to standardize the historic seal and reduce wide artistic variation in how it is rendered.
  - year: "2023"
    description: The State Emblems Redesign Commission is created and selects a new seal concept after reviewing public submissions.
  - year: "2024"
    description: Minnesota's current Great Seal becomes official on May 11, replacing the historic frontier design with the loon-centered emblem now used by the state.

faq:
  - question: What does the current Minnesota state seal show?
    answer: "Minnesota's current seal shows a common loon, wild rice, evergreen trees, stylized water, a white four-point North Star, and the Dakota phrase Mni Sota Makoce inside a circular border."
  - question: When did Minnesota adopt its current state seal?
    answer: "Minnesota adopted its current Great Seal on May 11, 2024."
  - question: What does Mni Sota Makoce mean on the seal?
    answer: "Mni Sota Makoce is the Dakota-language source of the name Minnesota. It is commonly translated as 'Land where the waters reflect the skies' or 'Land of sky-tinted water.'"
  - question: What happened to Minnesota's old seal?
    answer: "The historic seal was retired on May 11, 2024. Official versions of that older design had been used from 1861 to 2024, with a statutory redraw in 1983."
  - question: Why did Minnesota redesign its state seal?
    answer: "Minnesota created a redesign commission in 2023 to adopt a new official seal and flag. The old seal had long drawn criticism for its frontier imagery and was also difficult to reproduce consistently."
  - question: What does the star on the Minnesota seal mean?
    answer: "The white four-point star represents the Star of the North, preserving the central idea behind Minnesota's historic motto L'Etoile du Nord."

