intro_text: "Minnesota's current state seal became official on May 11, 2024. It replaces the older pioneer-and-horseman seal with a simpler design built around a loon, a white North Star, wild rice, evergreen trees, stylized water, and the Dakota phrase Mni Sota Makoce. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
