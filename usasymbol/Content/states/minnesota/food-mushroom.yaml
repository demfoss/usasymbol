sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Minnesota's State Mushroom?"
    paragraphs:
      - "The morel is Minnesota's official state mushroom, designated by the Minnesota Legislature in 1984. It appears briefly each spring in the state's woodlands, drawing foragers throughout Minnesota."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Morel"
    paragraphs:
      - "Morels are wild mushrooms with a distinctive honeycombed cap of ridges and pits, ranging from tan to dark brown. They grow from the forest floor in spring, often near dying elm trees, old orchards, or areas that recently burned. Morels are hollow inside and must be cooked before eating."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Morel Became Minnesota's State Mushroom"
    paragraphs:
      - "The Minnesota Legislature designated the morel the official state mushroom in 1984, recognizing a wild food long popular with foragers across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Minnesota Chose the Morel"
    paragraphs:
      - "Morel hunting is a well-established spring tradition in Minnesota, drawing foragers into the state's woods every year for the short window when the mushrooms appear. The town of Boyd holds an annual Minnesota Morel Mushroom Festival, reflecting the mushroom's popularity across the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Morel Facts"
    facts:
      - "Adopted as Minnesota's state mushroom in 1984."
      - "Morels have a distinctive honeycombed cap and hollow interior."
      - "They typically appear for a few weeks each spring."
      - "The town of Boyd, Minnesota hosts an annual Morel Mushroom Festival."

