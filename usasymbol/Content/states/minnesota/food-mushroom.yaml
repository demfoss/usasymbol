faq:
  - question: "What is Minnesota's state mushroom?"
    answer: "Minnesota's state mushroom is the morel, adopted by the Minnesota Legislature in 1984."
  - question: "When did Minnesota adopt the morel as its state mushroom?"
    answer: "The Minnesota Legislature designated the morel the official state mushroom in 1984."
  - question: "Why did Minnesota choose the morel?"
    answer: "Morel hunting is a popular spring tradition across Minnesota, and the mushroom has long been valued by foragers throughout the state."
  - question: "Is the morel found in Minnesota today?"
    answer: "Yes. Foragers still search Minnesota's woodlands for morels each spring, and the town of Boyd hosts an annual festival celebrating the mushroom."

