intro_text: "Minnesota's state muffin is the blueberry muffin, adopted in 1988 to recognize the wild blueberries that grow across the state's northern forests. This profile appears in the [list of U.S. state foods](/symbols/desserts)."

sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Minnesota's State Muffin?"
    paragraphs:
      - "The blueberry muffin is Minnesota's official state muffin, designated by the Minnesota Legislature in 1988. It is a sweet muffin made with fresh or dried blueberries baked into the batter."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Blueberry Muffin"
    paragraphs:
      - "A blueberry muffin combines a simple sweet batter with whole blueberries, which soften and release juice as the muffin bakes, leaving pockets of fruit throughout. It is commonly eaten as a breakfast food."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Blueberry Muffin Became Minnesota's State Muffin"
    paragraphs:
      - "The Minnesota Legislature designated the blueberry muffin the official state muffin in 1988, following a push by Minnesota schoolchildren who campaigned for the honor."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Minnesota Chose the Blueberry Muffin"
    paragraphs:
      - "Wild blueberries grow naturally across Minnesota's northern forests and lake country, making the fruit a familiar part of the state's landscape. The blueberry muffin reflects that native crop in an everyday baked good."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blueberry Muffin Facts"
    facts:
      - "Adopted as Minnesota's state muffin in 1988."
      - "Wild blueberries grow naturally across northern Minnesota."
      - "The designation followed a campaign by Minnesota schoolchildren."

