seo_title: "Minnesota State Nickname: The North Star State"
seo_description: "The North Star State nickname is rooted in Minnesota’s motto, L’Étoile du Nord, adopted during the mid-19th century."

intro_text: "Minnesota is known as <i>The North Star State</i>. The nickname comes from the state’s French motto, <i>L’Étoile du Nord</i>, meaning “the Star of the North.” Minnesota adopted this motto in 1861 to emphasize its northern position during westward expansion. The phrase became closely associated with the state’s identity and has remained its primary nickname ever since; see the [official Minnesota state motto](/states/minnesota/motto/letoile-du-nord)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The North Star State'"
    paragraphs:
      - "Minnesota extends farther north than most of the lower 48 states, with 547 miles of border touching Canada. When Minnesota sought statehood in the 1850s, territorial leaders wanted to stress this northern position as the territory competed for federal attention and settlement. The North Star, called Polaris, sits almost directly above Earth's North Pole and has guided travelers for centuries because it stays in nearly the same spot while other stars rotate across the sky, which is reflected on the [Minnesota state flag](/states/minnesota/flag/minnesota-state-flag)."
      - "Governor Henry Sibley proposed the French motto L'Étoile du Nord in 1861, three years after statehood. The legislature approved it immediately. French fur traders and explorers had operated in the region since the 1600s, making French an appropriate choice for the motto. The North Star connected Minnesota to themes of exploration and navigation that mattered during westward expansion."
      - "Minnesota served as a jumping-off point for settlement of the northern Great Plains — including what would become North Dakota, whose [Peace Garden State meaning](/states/north-dakota/nickname/the-peace-garden-state) reflects a later, more peaceful era that followed those initial waves of westward settlement. The North Star State nickname appeared in newspapers and official documents throughout the late 1800s. Today the state flag shows a prominent star above a scene of farming and industry, keeping the North Star image central to Minnesota's identity — a design worth seeking out when you [explore other us state nicknames](/symbols/nicknames) and compare how states express their identities through symbols."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Gopher State"
        text: "This name came from an 1857 political cartoon that showed gophers representing railroad promoters pushing ambitious schemes to build tracks across Minnesota using public money. The cartoon criticized what the artist saw as attempts to profit from state resources. Gophers dig extensive tunnel systems, so the image suggested people burrowing into Minnesota's wealth. The nickname caught on even though it started as an insult. Minnesota actually has thirteen-lined ground squirrels rather than true gophers, but the name persisted anyway. The University of Minnesota made it permanent by adopting Golden Gophers for its athletic teams in the 1930s."
      - subtitle: "Land of 10,000 Lakes"
        text: "Minnesota put this slogan on license plates starting in the 1950s as part of tourism promotion. The state actually contains 11,842 lakes larger than ten acres, well over the 10,000 claimed. State officials chose a round number that sounded impressive while being technically accurate. Lake Superior forms Minnesota's northeastern boundary and is the largest freshwater lake by surface area in the world. The Land of 10,000 Lakes is probably how most Americans outside Minnesota identify the state today, making it more recognized than the older North Star nickname and closely connected to the [official Minnesota state bird](/states/minnesota/bird/common-loon)."
      - subtitle: "The Bread and Butter State"
        text: "Minnesota earned this name in the late 1800s when wheat farming and dairy production dominated the economy. Railroads reached the Red River Valley in the 1870s, opening vast areas for wheat cultivation. Minneapolis became a major flour milling center, processing grain from across the northern plains. At the same time, dairy farms supplied butter and cheese to eastern markets. The Bread and Butter State was widely used through the early 1900s but faded as Minnesota shifted toward manufacturing, mining, and services within patterns tracked by [states neighboring states](/rankings/geography/states-neighboring-states)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Minnesota became the 32nd state on May 11, 1858, shortly before the Civil War began."
      - "The state motto L'Étoile du Nord appears on the state seal and flag along with an image of the North Star."
      - "The North Star stays in almost the same position in the sky because it sits nearly above Earth's axis of rotation."
      - "Minnesota's northern point at the Northwest Angle is the northernmost part of the continental United States outside Alaska."
      - "The Mississippi River begins at Lake Itasca in northern Minnesota and flows 2,340 miles to the Gulf of Mexico."
      - "Minnesota has more miles of shoreline than California, Florida, and Hawaii combined when all its lakes are included."

faq:

  - question: "What is Minnesota nickname?"
    answer: "Minnesota's nickname is the North Star State, taken from the state motto L'Étoile du Nord. Minnesota is also called the Gopher State and Land of 10,000 Lakes."

  - question: "Why is Minnesota nickname the North Star State?"
    answer: "Minnesota adopted this name from its 1861 state motto L'Étoile du Nord, meaning the star of the north, which emphasized the state's northern location during westward expansion."

  - question: "What is the Minnesota nickname origin?"
    answer: "The Minnesota nickname origin dates to 1861 when the legislature adopted L'Étoile du Nord as the state motto. This emphasized Minnesota's role as a northern gateway to the Great Plains."

  - question: "What is Minnesota state nickname meaning?"
    answer: "The Minnesota state nickname meaning refers to Polaris, the North Star, which appears above Earth's North Pole and has guided travelers throughout history with its fixed position."

  - question: "What is the state of Minnesota nickname?"
    answer: "The state of Minnesota nickname is the North Star State. Minnesota also uses the Gopher State and Land of 10,000 Lakes, which appears on state license plates."

  - question: "What is Minnesota nickname and motto?"
    answer: "Minnesota's nickname is the North Star State and its motto is L'Étoile du Nord, French for the star of the north. Both reference Minnesota's position in the northern United States."

  - question: "What is Minnesota nickname Gopher State?"
    answer: "The Gopher State came from an 1857 political cartoon showing gophers as railroad promoters. The name stuck despite starting as criticism and became official through university sports teams."

