faq:
- question: What is Minnesota's state bird?
  answer: Minnesota's state bird is the Common Loon.
- question: When did Minnesota adopt the Common Loon?
  answer: Minnesota adopted the Common Loon in 1961.
- question: What is unusual about Minnesota's loon law?
  answer: Minnesota law does more than name the loon as state bird. It also requires that a photograph of the loon be preserved in the Office of the Secretary of State.
- question: Why did the loon fit Minnesota so well?
  answer: Because the loon had already become one of the state's clearest lake-country symbols. It gave Minnesota a bird people immediately associated with the state's waters and northern landscape.
- question: Does the loon appear in other official Minnesota symbols?
  answer: Yes. Minnesota's new state seal, adopted in 2024, includes the common loon in the center of the design.
