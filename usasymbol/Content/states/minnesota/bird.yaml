title: Common Loon
scientific_name: Gavia immer
adopted_year: 1961
legislation: Minn. Stat. 1.145; 1961 c 76
meaning: Minnesota's state bird is not just a wildlife choice. The loon became an official shorthand for the state's lake identity, and Minnesota law treats it more concretely than many bird laws do by requiring a photograph to be preserved in the Office of the Secretary of State.
author: USA Symbol Team
date_published: '2025-11-26'
date_modified: "2026-05-02"
seo_title: "Minnesota State Bird | Common Loon"
seo_description: Minnesota adopted the Common Loon as its state bird in 1961. The unusual part is that state law also requires a loon photograph to be preserved, showing how central the bird had become to Minnesota identity.
intro_text: 'Minnesota''s state bird is the <strong>Common Loon</strong>, adopted in <strong>1961</strong> and now codified in <strong>Minn. Stat. 1.145</strong>. The unusual part is that the law does more than name the bird. It also requires that a photograph of the loon be preserved in the Office of the Secretary of State. That detail helps explain why the symbol works: the loon was already more than wildlife. It had become one of the state''s clearest ways of picturing Minnesota itself.'
