seo_title: Minnesota State Fish | Walleye
seo_description: The Minnesota state fish is the walleye, adopted in 1965. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/minnesota/minnesota-fish-hero.webp
hero_image_alt: A golden olive walleye with large glassy eyes and spiny fins lying on rocks.
hero_image_caption: The walleye, Minnesota's state fish, lives in lakes and rivers all across the state.
intro_text: Minnesota's state fish is the walleye, a popular game fish with big, shiny eyes. Minnesota made it official in 1965. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Minnesota?
  paragraphs:
  - The walleye is the official fish of Minnesota. The Minnesota Legislature picked it in 1965. Its scientific name is Sander vitreus.
  - Walleyes live in lakes and rivers across Minnesota. Many Minnesotans name it as their favorite fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Walleye
  paragraphs:
  - The walleye has a long, slim body with golden olive sides and a pale belly. It has sharp teeth and a spiny fin on its back.
  - Its large, cloudy eyes are its best-known feature. The eyes reflect light, which is how the walleye got its name.
  - Its eyes are sensitive to light. Walleyes often stay in deep, dark water during the day and swim into shallow water at night.
  - Most walleyes caught in Minnesota weigh about 1 to 4 pounds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - State lawmakers first proposed the walleye as the state fish in 1953, but the idea did not pass that year.
  - In 1965, the Minnesota Legislature made the walleye the official state fish. Representative Clifford Lofvegren sponsored the law, and Governor Karl Rolvaag signed it.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Minnesota Chose the Walleye
  paragraphs:
  - The walleye is neither Minnesota's biggest fish nor its most common fish. But Minnesotans keep naming it as their favorite.
  - In the 1950s and 1960s, more people began fishing for sport. The walleye's large size and large numbers made it a top target for anglers.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Walleye
  paragraphs:
  - Walleyes live in lakes and rivers all over Minnesota. They do best in large, clear, cool lakes in the state's northern forests.
  - Mille Lacs Lake, Lake of the Woods, and Leech Lake are some of the best-known walleye waters in the state.
