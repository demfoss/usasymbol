- id: facts
  icon: fa-solid fa-lightbulb
  title: Walleye Facts
  facts:
  - Adopted in 1965 by the Minnesota Legislature.
  - Its scientific name is Sander vitreus.
  - It gets its name from its large eyes, which reflect light.
  - Minnesota's record walleye weighed 17 pounds, 8 ounces. It was caught in 1979.
  - It is also called yellow pike or yellow pickerel.
faq:
- question: What is Minnesota's state fish?
  answer: Minnesota's state fish is the walleye. It is a popular game fish found in lakes and rivers across the state.
- question: When did Minnesota adopt the Walleye?
  answer: The Minnesota Legislature made the walleye the state fish in 1965. Lawmakers had first proposed it in 1953.
- question: Why did Minnesota choose the Walleye?
  answer: Minnesotans keep naming the walleye as their favorite fish. It became a top target for anglers because of its large size and large numbers.
- question: Why is it called a walleye?
  answer: It is named for its large eyes, which reflect light. The eyes are sensitive to light, so walleyes often stay in deep water during the day.
- question: How big was the biggest walleye caught in Minnesota?
  answer: The Minnesota record walleye weighed 17 pounds, 8 ounces. It was caught in 1979.
