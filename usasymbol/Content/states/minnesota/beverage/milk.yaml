seo_title: 'Minnesota State Drink: Why Milk Was Chosen in 1984'
seo_description: Minnesota's official state drink is milk, designated in 1984 under Minnesota Statutes § 1.1495. Learn why milk was chosen, what it says about the state's dairy industry, and how the Minnesota State Fair has kept the symbol alive since 1955.
intro_text: '**Milk** is the official state drink of Minnesota, adopted in **1984** to recognize one of the most productive dairy industries in the country. Minnesota produces more than 9 billion pounds of milk a year — a number that makes the designation feel less like a symbolic gesture and more like a statement of economic fact.'
