sections:
- id: answer-fast
  icon: fa-solid fa-circle-info
  title: 'Minnesota State Drink: Milk'
  paragraphs:
  - Minnesota's official state drink is **milk**, designated in 1984. The legislature chose it to recognize the dairy industry's central role in the state's agricultural economy — not as a health statement, but as an acknowledgment of what Minnesota actually produces at scale.
  - 'Milk is the most common [official state beverage](/symbols/state-beverages) in the country, and Minnesota''s version of the designation is backed by real production numbers: more than 9 billion pounds a year, with dairy farms running through most of the southern and central counties. The Bootlegger — a regional cocktail popular in the Boundary Waters area — has more personality, but it has no official standing.'
- id: why-milk
  icon: fa-solid fa-cow
  title: Why Minnesota Chose Milk as Its Official State Drink
  paragraphs:
  - 'The logic behind the designation was direct: Minnesota''s dairy industry is one of the largest in the country, and the legislature wanted a state symbol that reflected agricultural reality rather than regional novelty. Milk was not a creative choice — it was the obvious one.'
  - Dairy farming has run through the economy of southern and central Minnesota for more than a century. The pastures, feed corn, and cooperative creameries of that region are not background scenery — they are the reason the designation makes sense. Naming milk as the state drink put an everyday product back in the context of the industry behind it.
- id: law-and-adoption
  icon: fa-solid fa-landmark
  title: 'When Minnesota Made Milk Official: The 1984 Designation'
  paragraphs:
  - The Minnesota Legislature designated milk the official state drink in 1984. The full listing, with statutory citation, is on the [Minnesota Secretary of State's state symbols page](http://sos.mn.gov/about-minnesota/state-symbols/state-drink-milk/).
  - The law did not invent a connection between the state and milk — it formalized one that already existed on a very large scale. By 1984, dairy had been central to Minnesota's agricultural economy for well over a century. The designation was recognition, not invention.
- id: dairy-state
  icon: fa-solid fa-map-pin
  title: 'Minnesota Dairy Production: A 9-Billion-Pound Industry'
  paragraphs:
  - Minnesota produces more than 9 billion pounds of milk annually, ranking it consistently among the top dairy-producing states in the country. That output comes from dairy farms concentrated across the southern and central parts of the state — a landscape built around pasture, feed corn, and the cooperative creameries that have processed the milk for generations.
  - Land O'Lakes — one of the largest dairy cooperatives in the United States — was founded by Minnesota growers in 1921 and is still headquartered in Arden Hills. The brand is global; the address never moved.
  - Milk is not an aspirational symbol for Minnesota — it is a description of what the state's farmland produces every day. The 9-billion-pound figure is the context the 1984 law was written against.
- id: fair-tradition
  icon: fa-solid fa-star
  title: 'Minnesota State Fair Milk Stand: Running Since 1955'
  paragraphs:
  - The most tangible expression of Minnesota's milk identity is not the 1984 statute — it is a stand at the Minnesota State Fair that has been serving all-you-can-drink milk since 1955. Run by the Minnesota Dairy Farmers organization, the stand draws long lines every August and has become one of the fair's most recognized traditions.
  - The milk stand predates the official state drink designation by nearly three decades. By the time the 1984 law passed, Minnesotans had already been making an annual ritual out of drinking dairy-fresh milk in the middle of the state's largest public event. The designation caught up to something that was already real.
timeline:
- year: '1921'
  description: Land O'Lakes is founded as a dairy cooperative in Minnesota. It later becomes one of the largest dairy cooperatives in the United States, headquartered in Arden Hills, Minnesota.
- year: '1955'
  description: The Minnesota Dairy Farmers organization begins operating an all-you-can-drink milk stand at the Minnesota State Fair — a tradition that continues every August.
- year: '1984'
  description: The Minnesota Legislature designates milk the official state drink, formally recognizing the dairy industry's role in the state's agricultural economy.
faq:
- question: What is the official state drink of Minnesota?
  answer: Minnesota's official state drink is milk, designated in 1984.
- question: When did Minnesota adopt milk as its state drink?
  answer: Minnesota designated milk the official state drink in 1984.
- question: Why did Minnesota choose milk as its state drink?
  answer: The designation recognized Minnesota's dairy industry, one of the largest in the country. Minnesota produces more than 9 billion pounds of milk annually, and the legislature chose milk to reflect that agricultural identity.
- question: What is the Minnesota State Fair milk stand?
  answer: The Minnesota State Fair has featured an all-you-can-drink milk stand operated by Minnesota Dairy Farmers since 1955. It is one of the fair's most enduring traditions and predates the official state drink designation by nearly thirty years.
- question: Is the Bootlegger Minnesota's state drink?
  answer: No. The Bootlegger — a popular regional cocktail associated with the Boundary Waters area — has no official state standing. Milk is Minnesota's only official state drink.
- question: How much milk does Minnesota produce?
  answer: Minnesota produces more than 9 billion pounds of milk a year, ranking it among the top dairy-producing states in the country.
- question: Where is Land O'Lakes headquartered?
  answer: Land O'Lakes, one of the largest dairy cooperatives in the United States, is headquartered in Arden Hills, Minnesota. It was founded in Minnesota in 1921.
