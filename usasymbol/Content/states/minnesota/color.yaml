  - year: "1858"
    description: "Minnesota admitted to the Union as the 32nd state on May 11, adopting the motto L'Etoile du Nord ('The Star of the North'); the state's identity as a land of water and forest — the natural basis for blue and green — is established from the first year of statehood"
  - year: "1893"
    description: "Minnesota adopts its first official state flag on April 4, designed by Amelia Hyde Center for the 1893 Chicago World's Fair; the flag features the state seal on a white field on one side and blue field on the other, establishing blue as the dominant institutional color"
  - year: "1957"
    description: "Minnesota simplifies its flag to a single-sided blue field with the state seal, deepening the association between blue and Minnesota's official identity"
  - year: "2023"
