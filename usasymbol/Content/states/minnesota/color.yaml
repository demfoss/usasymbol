seo_title: "Minnesota State Colors | Blue Green"
seo_description: "Minnesota state colors are Blue and Green, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Minnesota are **Blue** and **Green**, with blue formally specified on [the Minnesota state flag](/states/minnesota/flag/minnesota-state-flag) adopted in 2024. Minnesota has not enacted a separate legislative statute designating official state colors, but these colors appear throughout state branding and official communications. For Minnesota, the values below cover HEX, RGB, CMYK, and Pantone matching against the wider [U.S. state colors guide](/symbols/colors)."

official_colors: "Blue and Green"
official_since: "Traditional / Natural; 2024 state flag specifies Night Sky Blue (PMS 648) and Water Blue (PMS 305) under Minnesota Statute 1.141"
primary_use: "State flag (adopted May 11, 2024), Minnesota state agency branding, state tourism and environmental identity materials"
known_for: "Minnesota's blue is rooted in the Dakota name for the state, Mni Sota Makoce, meaning 'where the water reflects the sky' or 'land of sky-tinted waters'; the 2024 flag's two distinct blues were the first official color specifications in Minnesota flag history to be provided with precise Pantone and HEX values by the State Emblems Redesign Commission"

