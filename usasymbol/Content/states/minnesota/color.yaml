faq:
  - question: "What are the state colors of Minnesota?"
    answer: "Minnesota's traditional state colors are Blue and Green, symbolizing Minnesota's 11,842 lakes in blue and its vast forests and farmlands in green. The 2024 state flag specifies two official blues: Night Sky Blue (PMS 648, HEX #002C5A) and Water Blue (PMS 305, HEX #73C6E5). Minnesota has no separate state color statute."
  - question: "What is the HEX code for Minnesota Blue?"
    answer: "The 2024 Minnesota state flag specifies two blues: Night Sky Blue (#002C5A, PMS 648) representing the night sky and the shape of Minnesota, and Water Blue (#73C6E5, PMS 305) reflecting Minnesota's abundant lakes and rivers. These are the first officially codified color values in Minnesota flag history."
  - question: "When was Minnesota's new flag adopted?"
    answer: "Minnesota's new state flag was adopted on May 11, 2024, under Minnesota Statute 1.141, following a public redesign process managed by the State Emblems Redesign Commission. The commission received 2,123 design submissions before selecting a modified design by Andrew Prekker."
  - question: "What does the Minnesota flag's blue mean?"
    answer: "The dark Night Sky Blue (PMS 648) on the left of the flag represents the night sky and the geographic shape of Minnesota. The bright Water Blue (PMS 305) on the right represents Minnesota's abundance of water — its 11,842 lakes, the headwaters of the Mississippi River, and the waters of Lake Superior, rooted in the Dakota name Mni Sota Makoce ('where the water reflects the sky')."
  - question: "Why is green associated with Minnesota?"
    answer: "Green represents Minnesota's forests and farmlands, which cover approximately 17 million acres — nearly one-third of the state. The original finalist design for the 2024 flag included green stripes, but the commission simplified the design to two blues. Green remains a strong cultural color association for Minnesota through its boreal forests, the Boundary Waters Canoe Area Wilderness, and state tourism identity."
  - question: "What does Mni Sota Makoce mean?"
    answer: "Mni Sota Makoce is the Dakota name for Minnesota, translated as 'where the water reflects the sky' or 'land of sky-tinted waters.' It places blue at the center of Minnesota's identity and directly informed the 2024 flag's use of Water Blue to represent the state's abundant lakes and rivers."

