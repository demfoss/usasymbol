    pantone: "PMS 648"
    symbolism: "Represents both the night sky above Minnesota and the geographic shape of the state itself, as the dark blue concave pentagon on the left side of the 2024 state flag is a stylized outline of Minnesota's borders; the deep navy also evokes the darkness of Minnesota's legendary clear winter nights, where the North Star — represented by the eight-pointed white star on the flag — has guided travelers since the era of the Dakota and Ojibwe peoples; color specified by the Minnesota State Emblems Redesign Commission in its January 1, 2024 report to the Minnesota Legislature"
  - name: "Water Blue"
    hex: "#73C6E5"
    rgb: "115, 198, 229"
    cmyk: "50, 14, 0, 10"
    pantone: "PMS 305"
    symbolism: "Represents the abundance of water that defines Minnesota's landscape and identity; the bright, clear blue evokes the sky-tinted surface of Minnesota's 11,842 lakes, the headwaters of the Mississippi River at Lake Itasca, and the waters of Lake Superior along the northeastern border — the largest of the Great Lakes by surface area; the color takes its symbolic meaning from the Dakota name for Minnesota, Mni Sota Makoce, meaning 'where the water reflects the sky' or 'land of sky-tinted waters'; color specified by the Minnesota State Emblems Redesign Commission in its January 1, 2024 report"
  - name: "Green"
    hex: "#2D6A3F"
    rgb: "45, 106, 63"
    cmyk: "58, 0, 41, 58"
    pantone: "PMS 348"
    symbolism: "Represents the forests and farmlands of Minnesota, a state where forests cover approximately 17 million acres — nearly one-third of the total land area — spanning the boreal spruce and fir forests of the northern Boundary Waters Canoe Area Wilderness, the mixed hardwood forests of central Minnesota, and the oak savannas and tallgrass prairies of the south; green appeared in multiple early proposals for a new Minnesota flag design, including the influential North Star Flag concept and the State Emblems Redesign Commission's initial finalist design by Andrew Prekker, which originally featured blue, white, and green stripes before being simplified to the two-blue design adopted in 2024; green remains a strong traditional color association for Minnesota in state tourism materials and environmental branding"

sections:
  - id: "official-designation"
    title: "Flag History and Color Basis"
    style: "default"
    paragraphs:
      - "Minnesota has not designated official state colors by separate legislative statute. The state's color tradition derives from two primary sources: the natural landscape that inspired the state's Dakota name and has shaped its visual culture for centuries, and the 2024 state flag, which became the first Minnesota flag in history to specify official color values with precise Pantone and HEX codes. The new flag was adopted on May 11, 2024, under Minnesota Statute 1.141, following a redesign process managed by the State Emblems Redesign Commission established by the Minnesota Legislature in May 2023, as detailed on the [Minnesota state flag page](/states/minnesota/flag/minnesota-state-flag)."
      - "The commission received 2,123 flag design submissions from Minnesota residents. The selected design, based on a submission by Andrew Prekker and modified by the commission, features two distinct blues specified with precision: Night Sky Blue (PMS 648, HEX #002C5A) and Water Blue (PMS 305, HEX #73C6E5). These are the most authoritative color specifications in Minnesota flag history, as previous Minnesota flags were described in general color terms without Pantone or HEX references. Green, while not included in the final 2024 flag design, maintains a strong traditional association with Minnesota's identity through the state's vast forest and agricultural landscape."
    subsections:
      - subtitle: "The 2024 State Emblems Redesign Commission"
        text: "The Minnesota State Emblems Redesign Commission, created by the 2023 Minnesota Legislature as part of the annual state budget bill, was tasked with proposing new designs for both the state flag and the state seal. The commission included 13 members representing a cross-section of Minnesota communities, including representatives of the Indian Affairs Council, the Council for Minnesotans of African Heritage, the Minnesota Council on Latino Affairs, and the Council on Asian-Pacific Minnesotans, along with three members of the general public appointed by Governor Tim Walz. After reviewing 2,123 flag submissions, the commission selected a design concept by Andrew Prekker, modifying it to replace a stylized North Star with the historic eight-pointed Minnesota star from the floor of the State Capitol Rotunda. The commission's January 1, 2024 report, which became the legal standard for the new flag under Statute 1.141, specified Night Sky Blue and Water Blue with Pantone and HEX values — the first time official color specifications had been codified for any Minnesota state flag."
      - subtitle: "The Role of Green in Minnesota Color History"
        text: "Green's association with Minnesota's color tradition predates the 2024 redesign by decades. The influential North Star Flag proposal, which began circulating in vexillological communities around 2010 and played a notable role in sustaining public interest in flag redesign, specified a three-stripe design of blue, white, and green explicitly representing the sky, winter snows, and Minnesota's forests and farmlands. Andrew Prekker's original submission to the Redesign Commission similarly featured blue, white, and green horizontal stripes. The commission modified the design to a simpler two-blue composition to avoid visual similarity with flags of other nations, but the green stripe's removal from the final design does not diminish green's deep cultural association with Minnesota's boreal forests, its agricultural plains, and the landscape of the Boundary Waters Canoe Area Wilderness — one of the most visited wilderness areas in the United States."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Minnesota's color tradition is rooted in the physical realities of a state defined equally by water and land. The Dakota people named the region Mni Sota Makoce — translated variously as 'where the water reflects the sky' or 'land of sky-tinted waters' — a name that places blue at the center of Minnesota's identity centuries before European settlement. The sky-tinted water description captures the optical phenomenon of Minnesota's lakes reflecting the blue of the open sky, creating a landscape where the boundary between water and sky dissolves into a single dominant hue. Green, the color of Minnesota's forests and summer farmlands, completes the natural palette of a state whose landscape transitions from the prairie grasslands of the southwest to the dense boreal forests of the north, matching language in the [Minnesota state motto](/states/minnesota/motto/letoile-du-nord)."
    subsections:
      - subtitle: "Blue in Minnesota History"
        text: "Blue is the foundational color of Minnesota's identity and the one most directly encoded in the state's name. Mni Sota, the Dakota phrase that became Minnesota, refers specifically to the sky-tinted quality of the water — the blue reflection of the open sky on the surface of the lakes and rivers that cover a disproportionately large share of the state's land area. Minnesota contains 11,842 lakes of ten acres or more in surface area, giving it more lakes than any other state in the continental United States. The Mississippi River, the longest river in North America, originates at Lake Itasca in north-central Minnesota. Lake Superior, the world's largest freshwater lake by surface area, borders Minnesota's northeastern corner. The headwaters of the Red River of the North, which drains into Hudson Bay, rise in the Minnesota lake country. This unusual concentration of blue water in a single state gives Minnesota a water identity that the 2024 flag makes visually explicit through its two distinct blues — one for the night sky and land, one for the abundant surface water."
      - subtitle: "Green in Minnesota History"
        text: "Green represents the forests and agricultural landscape that cover the majority of Minnesota's 86,943 square miles. The Boundary Waters Canoe Area Wilderness in northeastern Minnesota encompasses more than one million acres of boreal forest, with spruce, fir, pine, and birch covering the ancient rock of the Canadian Shield in a landscape that has changed little since the retreat of the glaciers 10,000 years ago. The Superior National Forest, which surrounds the Boundary Waters, contains an additional 3.9 million acres of forest land. Southward, the mixed hardwood forests of central Minnesota give way to the farmlands of the southern plains, where Minnesota produces soybeans, corn, sugar beets, and wild rice — the latter a crop native to the shallow lakes of northern Minnesota and central to Ojibwe culture for centuries. The Minnesota state tree, the red (Norway) pine, is a forest species whose dark green silhouette defines the skyline of the northern lake country; see the [official Minnesota state tree](/states/minnesota/tree/red-pine). Together these landscapes make green as visually fundamental to Minnesota's identity as the blue of its legendary lakes."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and State Identity"
    style: "default"
    paragraphs:
      - "The 2024 Minnesota state flag represents the most significant redesign of a major American state flag in recent history, replacing a seal-on-blue design that dated to 1893 with a minimal two-color composition that experts in vexillology — the study and design of flags — broadly praised for its simplicity and distinctiveness. The new flag, raised over the Minnesota State Capitol at sunrise on May 11, 2024, features Night Sky Blue and Water Blue as the only colors alongside a white eight-pointed North Star. The design's dark blue concave pentagon representing Minnesota's geographic shape is an unusual design element that has no direct parallel among U.S. state flags, making the 2024 Minnesota flag one of the most visually distinctive in the country. The new state seal, adopted simultaneously, features a common loon amid wild rice on Lake Superior, replacing the controversial imagery of the previous seal that depicted a Native American riding away from a white settler plowing a field. Minnesota's traditional blue-and-green color associations appear prominently in Minnesota state tourism materials, particularly in campaigns promoting the Boundary Waters Canoe Area Wilderness, the North Shore of Lake Superior, and the state's outdoor recreation economy, which generates more than 12 billion dollars annually, with regional context summarized in [states neighboring states](/rankings/geography/states-neighboring-states)."

