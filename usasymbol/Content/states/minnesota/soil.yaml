type: State Soil
state: Minnesota
state_fips: "27"
name: Lester Loam
adopted_year: 2012
is_official: true
meaning: "Lester loam sits at the boundary where two landscapes once met — the tallgrass prairie that stretched west toward the Dakotas and the Big Woods hardwood forest that covered south-central Minnesota when settlers arrived in the 1850s. That boundary left its mark in the soil: a dark, thick surface layer built up under prairie grasses, and a clay-enriched subsoil shaped by forest. Both landscapes are largely gone now, replaced by the corn and soybean fields that make Minnesota one of the top agricultural states in the country. Lester soil is what made that agriculture possible."
meaning_title: Meaning of the Lester Loam
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-30'
date_modified: '2026-05-30'
seo_title: "Minnesota State Soil | Lester Loam"
seo_description: "The Minnesota state soil is the Lester loam, adopted in 2012. It covers over 600,000 acres in south-central Minnesota and grows corn and soybeans."
hero_image: /images/soils/minnesota/lester-loam.jpg
hero_image_alt: Lester loam soil profile with dark surface horizons above lighter brown glacial till
hero_image_caption: An official Lester loam profile shows the dark upper horizons that formed under prairie and forest vegetation above lighter glacial till. The soil was selected in part because it is both widespread in Minnesota and visually distinctive in the field.
intro_text: "Minnesota's state soil is the Lester loam — a dark, fertile soil covering over 600,000 acres across 17 counties in south-central Minnesota, first mapped near the town of Lester Prairie in 1939. Governor Mark Dayton signed it into law as the official state soil on April 28, 2012."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Minnesota State Soil
  paragraphs:
  - "The Lester loam is Minnesota's official state soil. It sits on the gently rolling ground moraines of south-central Minnesota — the same landscape of corn fields, grain elevators, and small towns that defines the agricultural heart of the state."
  - "Lester is a well-drained loamy soil with a deep dark surface and a clay-enriched subsoil. Below both of those layers lies calcareous glacial till — limestone-rich material deposited by glaciers pushing in from the northwest. The lime in that till is part of why Lester soil is so productive: it buffers the soil chemistry and releases nutrients slowly to crop roots."

- id: history
  icon: fa-solid fa-landmark
  title: Why Minnesota Chose the Lester Loam
  paragraphs:
  - "The Lester series was first described and mapped in 1939 in McLeod County, near the town of Lester Prairie in south-central Minnesota. The series was named after that town."
  - "In 1985, the Minnesota Association of Professional Soil Scientists (MAPSS) formed a committee to select a state soil. Two years later, in 1987, the members voted to designate Lester as their unofficial choice. The criteria: the soil had to be based in Minnesota, cover a large area, be economically important, and look good in a profile photograph. Lester qualified on all four counts."
  - "It took another 25 years for the Legislature to act. The bill was authored by Senator Gen Olson and Representative Mark Murdock. Governor Mark Dayton signed it into law on April 28, 2012, making the Lester loam Minnesota's official state soil."

- id: profile
  icon: fa-solid fa-layer-group
  title: Lester Loam Profile and Horizons
  paragraphs:
  - "Lester loam has five main layers. The most striking feature is the dark surface — called the Mollic epipedon — which runs seven inches deep and looks nearly black compared to the lighter soil below. That dark color comes from centuries of organic matter building up under prairie grasses and hardwood forest."
  - "Below the dark surface is the argillic horizon: a clay-enriched zone where clay minerals were carried down by water and deposited. The clay makes this layer denser, stickier, and better at holding nutrients. Below that is the calcareous parent till — yellowish-brown glacial material full of calcium carbonate from ground-up limestone."
  layers:
  - horizon: Ap
    name: Surface layer
    depth_in: "0–7"
    color_hex: "#4A3828"
    color_name: very dark grayish brown
    texture: loam
    note: thick, dark, organic-rich surface — the Mollic epipedon that marks this as productive prairie-forest soil
  - horizon: Bt1
    name: Upper argillic subsoil
    depth_in: "7–21"
    color_hex: "#7A5C3C"
    color_name: brown
    texture: clay loam
    note: clay-enriched zone; clay films coat the faces of soil aggregates; good at holding nutrients
  - horizon: Bt2
    name: Lower argillic subsoil
    depth_in: "21–38"
    color_hex: "#7D5A2E"
    color_name: dark yellowish brown
    texture: clay loam
    note: more clay and slightly more iron color; still part of the root zone for corn and soybeans
  - horizon: Bk
    name: Calcareous subsoil
    depth_in: "38–60"
    color_hex: "#A07840"
    color_name: yellowish brown
    texture: loam
    note: calcium carbonate threads visible here — ground limestone from glacial till; slightly alkaline and fizzes with acid
  - horizon: C
    name: Glacial till parent material
    depth_in: "60–80"
    color_hex: "#B08C52"
    color_name: yellowish brown
    texture: loam
    note: original calcareous till deposited by glaciers from the northwest — where Lester soil began forming after the ice retreated

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Lester Loam Grows in Minnesota
  paragraphs:
  - "Lester loam covers over 600,000 acres across 17 counties in south-central Minnesota. It sits on the gently rolling ground moraines deposited by the Des Moines Lobe of the Laurentide Ice Sheet, which pushed into Minnesota from the northwest during the last ice age."
  - "The soil is concentrated in the zone where the tallgrass prairie once met the Big Woods — the dense hardwood forest that once covered the region before European settlement. That transition zone, sometimes called the forest-prairie border, produced some of the most fertile soils in the state."
  - "Lester loam also extends into north-central Iowa, where the same glacial landscape continues south across the state line. In Minnesota, it is found primarily in the arc of counties running from Kandiyohi and Meeker south through McLeod and Sibley to Blue Earth and Brown."
  counties:
  - McLeod
  - Sibley
  - Meeker
  - Kandiyohi
  - Renville
  - Wright
  - Carver
  - Hennepin
  - Blue Earth
  - Brown
  - Le Sueur
  - Nicollet
  - Waseca

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming on Lester Loam
  paragraphs:
  - "Lester loam is prime corn and soybean country. The deep dark surface holds organic matter and nutrients. The clay-enriched subsoil retains water during dry spells. The calcareous till underneath keeps the pH balanced. The result is one of the most consistently productive farm soils in Minnesota."
  - "Before European settlers broke the sod and cleared the Big Woods in the 1850s through 1890s, Lester loam supported a mix of tallgrass prairie and hardwood forest. Prairie species included big bluestem, indiangrass, and switchgrass. The Big Woods brought sugar maple, basswood, northern red oak, and American elm — some of the most productive hardwood forest in the Midwest."
  - "Today nearly all Lester loam is in row crop production. Corn and soybeans rotate across most of it each year. Some is used for pasture and hay. The soil requires little amendment to be highly productive — the calcareous parent material keeps lime applications minimal and the argillic horizon holds fertilizer well."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Lester Loam Facts
  facts:
  - "Signed into law: April 28, 2012, by Governor Mark Dayton. The bill was authored by Senator Gen Olson and Representative Mark Murdock."
  - "Coverage: over 600,000 acres in 17 counties in south-central Minnesota, plus additional acreage across the border in north-central Iowa."
  - "The Lester series was first described in 1939 in McLeod County, near the town of Lester Prairie — the town the soil is named after."
  - "The Minnesota Association of Professional Soil Scientists (MAPSS) informally designated Lester as the state soil in 1987 — 25 years before the Legislature made it official."
  - "Lester is a Mollic Hapludalf: a soil with the thick, dark surface of a prairie soil and the clay-enriched subsoil of a forest soil. That combination reflects its origin at the prairie-Big Woods boundary."
  - "The yellowish-brown till beneath Lester soil is calcareous — full of calcium carbonate from limestone bedrock that glaciers ground up and carried from the northwest. This lime neutralizes soil acidity and releases calcium slowly to plant roots."

