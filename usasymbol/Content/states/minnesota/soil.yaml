faq:
- question: What is Minnesota's state soil?
  answer: "Minnesota's state soil is the Lester loam, a fertile, well-drained soil covering over 600,000 acres in 17 south-central Minnesota counties. Governor Mark Dayton signed it into law on April 28, 2012."
- question: Why is it called Lester loam?
  answer: "The series is named after the town of Lester Prairie in McLeod County, south-central Minnesota, where soil scientists first described and mapped this series in 1939."
- question: What color is Lester loam?
  answer: "The surface layer is very dark grayish brown — nearly black — from centuries of organic matter building up under prairie and forest. The subsoil turns brown, then dark yellowish brown, before fading to yellowish brown in the calcareous till layer below."
- question: Where is Lester loam found in Minnesota?
  answer: "Lester loam covers over 600,000 acres across 17 counties in south-central Minnesota, in the area where the tallgrass prairie once met the Big Woods hardwood forest. Key counties include McLeod, Sibley, Meeker, Renville, and Blue Earth."
- question: What grows in Lester loam?
  answer: "Today, Lester loam is primarily used for corn and soybeans, the dominant crops of Minnesota's agricultural heartland. Before European settlement, it supported tallgrass prairie and the Big Woods — sugar maple, basswood, red oak, and elm."
- question: Who chose the Lester loam as Minnesota's state soil?
  answer: "The Minnesota Association of Professional Soil Scientists chose Lester informally in 1987 after a two-year selection process. The Minnesota Legislature made it official in 2012 through a bill authored by Senator Gen Olson and Representative Mark Murdock."
- question: How deep is Lester loam?
  answer: "The soil profile goes to about 80 inches, with the dark surface layer in the top seven inches. Most crop roots grow in the top 38 inches, through the surface and argillic layers. The calcareous glacial till starts at about 38 inches and continues well below."

