seo_title: "Minnesota State Flag: North Star Symbol & History"
seo_description: "Read why Minnesota uses this flag design, what each major emblem points to, and how the state records color details for Minnesota's flag."

intro_text: "Minnesota adopted a new state flag in 2024, replacing a design that had been in use since 1957. The current flag features a white eight-pointed star on a dark blue field with a light blue stripe. A stylized pattern in the shape of Minnesota extends from the hoist side. This page is part of the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Minnesota State Flag Is Designed"
    paragraphs:
      - "The Minnesota state flag is the official government flag of Minnesota. A dark blue field covers most of the background. A light blue chevron extends from the left side forming the shape of Minnesota."
      - "An eight-pointed white star sits on the dark blue portion. The star represents Minnesota as the North Star State. Public buildings, schools, and government offices across Minnesota fly the flag, matching language from the [Minnesota state motto](/states/minnesota/motto/letoile-du-nord)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Minnesota Flag Communicates"
    paragraphs:
      - "The flag represents Minnesota's identity as the North Star State through its central star symbol. The eight-pointed star refers to both the North Star and Minnesota's role as a northern state. The design emphasizes Minnesota's position and natural landscape, reinforcing [The North Star State nickname](/states/minnesota/nickname/the-north-star-state)."
      - "The light blue chevron forms the shape of Minnesota's borders. This element represents the state's geography and connects the design directly to Minnesota's physical territory. The chevron also symbolizes Minnesota's waters, including its thousands of lakes and the Mississippi River."
      - "Dark blue represents the night sky. Light blue symbolizes water and snow. White reflects purity and clarity. Together, these colors capture Minnesota's northern climate and natural environment."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Minnesota Flag History and Adoption"
    paragraphs:
      - "Minnesota authorized its new state flag in 2024. The legislature created a State Emblems Redesign Commission in 2023 to develop a new flag. The commission reviewed thousands of public submissions and selected a final design. The new flag officially replaced the previous version on May 11, 2024, and aligned with Minnesota's broader [state color framework](/symbols/colors)."
      - "The redesign occurred because the old flag faced criticism for its imagery. The previous design showed a Native American riding away while a white settler plowed a field. Critics argued this depicted displacement and colonization. The state motto on the old flag, L'Étoile du Nord, appeared in French but excluded other languages spoken in Minnesota."
      - "The commission emphasized creating an inclusive design. The winning submission came from Andrew Prekker, a design professional. His design focused on Minnesota's geographic shape and North Star symbolism. The legislature approved the new flag with broad support."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Minnesota Flag"
    versions:
      - name: "Original State Flag"
        years: "1893–1957"
        image: "versions/original-1893.webp"
        description: "The first official flag featured a white field with the state seal showing a Native American and settler scene surrounded by symbolic imagery."

      - name: "Modified State Flag"
        years: "1957–1983"
        image: "versions/modified-1957.webp"
        description: "A revised version moved the seal to a blue background and adjusted proportions, though the central imagery remained similar."

      - name: "Final Old Flag"
        years: "1983–2024"
        image: "versions/final-old-1983.webp"
        description: "The last version before redesign featured the state seal on a blue field with gold fringe and dates, showing a Native American riding away while a settler plowed."

      - name: "Current State Flag"
        years: "2024–present"
        image: "versions/current-2024.webp"
        description: "The new flag adopted in 2024 features an eight-pointed star and stylized Minnesota shape in blue and white."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Minnesota Flag"
    symbols:
      - id: star
        name: "North Star"
        image: "symbols/star.svg"
        paragraphs:
          - "An eight-pointed white star dominates the flag's center. The star represents Minnesota's motto L'Étoile du Nord, which means The Star of the North. Minnesota adopted this motto in 1861 and has identified as the North Star State since territorial days."
          - "The eight points reference both the North Star in navigation and Minnesota's position as a northern state. The star guides travelers and symbolizes Minnesota's role as a beacon in the region."

      - id: chevron
        name: "Minnesota Shape"
        image: "symbols/chevron.svg"
        paragraphs:
          - "A light blue chevron extends from the left side of the flag. This shape mirrors Minnesota's geographic boundaries. The design creates an abstract representation of the state's territory."
          - "The chevron also represents Minnesota's abundant water resources. The state contains more than 10,000 lakes. The Mississippi River begins in Minnesota. Light blue captures both water and snow common in Minnesota's northern climate."

      - id: field
        name: "Dark Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "Dark blue covers the main portion of the flag. This color represents the night sky where the North Star appears. The shade creates strong contrast with the white star and light blue chevron."
          - "Blue has appeared on Minnesota flags since the 1890s. The new design maintains this color tradition while simplifying the overall composition and reflecting natural themes shared with the [official Minnesota state flower](/states/minnesota/flower/pink-and-white-ladys-slipper)."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Minnesota State Flag Colors"
    paragraphs:
      - "The flag uses dark blue, light blue, and white. Dark blue represents the night sky. Light blue symbolizes water and snow. White shows in the North Star and represents purity and clarity."
    colors:
      - name: "Dark Blue"
        hex: "#003865"
      - name: "Light Blue"
        hex: "#A4D4E7"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Minnesota State Flag Facts"
    facts:
      - "Minnesota adopted its new state flag on May 11, 2024"
      - "Andrew Prekker designed the current flag"
      - "The State Emblems Redesign Commission reviewed thousands of submissions"
      - "The eight-pointed star represents the North Star"
      - "The previous flag was used from 1957 to 2024 in its final form"
      - "Minnesota's motto L'Étoile du Nord means The Star of the North"

faq:
  - question: "Which flag serves as Minnesota's official banner?"
    answer: "The Minnesota state flag is the official banner of Minnesota. It features a white eight-pointed star on a dark blue field with a light blue chevron representing Minnesota's shape."

  - question: "What are the main visual elements on Minnesota's flag?"
    answer: "The flag shows a white eight-pointed star on dark blue with a light blue chevron extending from the left side. The chevron forms the shape of Minnesota's geographic boundaries."

  - question: "What does Minnesota's flag look like?"
    answer: "The flag represents Minnesota as the North Star State. The eight-pointed star symbolizes the North Star. The light blue chevron shows Minnesota's shape and represents water and snow."

  - question: "What meaning is attached to Minnesota's flag?"
    answer: "The flag means northern identity and natural abundance. The North Star emphasizes Minnesota's position. The colors represent the night sky, water, lakes, and snow common in Minnesota's climate."

  - question: "What imagery appeared on Minnesota's previous state flag?"
    answer: "Minnesota changed its flag because the old design faced criticism for depicting a Native American riding away while a white settler plowed a field. Critics argued this imagery represented displacement and colonization."

  - question: "When did Minnesota adopt its current state flag?"
    answer: "Minnesota officially adopted its new state flag on May 11, 2024, after the legislature created a redesign commission in 2023; regional comparisons appear in [states neighboring states](/rankings/geography/states-neighboring-states)."

  - question: "How would you describe the design of the Minnesota state flag?"
    answer: "The new flag features a white eight-pointed star on dark blue with a light blue chevron in the shape of Minnesota extending from the left side."

  - question: "What did Minnesota's old state flag show?"
    answer: "The old flag showed the state seal on a blue background. The seal depicted a Native American on horseback riding away while a white settler plowed a field, surrounded by forests, falls, and the state motto."

  - question: "Why did Minnesota change its state flag?"
    answer: "The old flag was considered offensive because it showed a Native American riding away from a white settler, which critics said depicted displacement and colonization rather than honoring indigenous peoples."

