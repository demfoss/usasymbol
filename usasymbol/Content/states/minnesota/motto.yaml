seo_title: "Minnesota State Motto | L'Étoile du Nord"
seo_description: "Minnesota's state motto is \"L'Étoile du Nord,\" a French phrase meaning \"The Star of the North.\" Minnesota is the only U.S. state with an official motto in French."

intro_text: "Minnesota's state motto is <strong>L'Étoile du Nord</strong>, a French phrase meaning <em>The Star of the North</em>. Minnesota is the only U.S. state with an official motto in French, chosen by Governor Henry Sibley in 1858 to honor the French-Canadian voyageurs who built the northern fur trade."

