title: "L'Étoile du Nord"
language: "French"
english_translation: "The Star of the North"
adopted_year: 1861

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Minnesota State Motto | L'Étoile du Nord! The Star of the North!"
seo_description: "Minnesota is the only U.S. state with a motto in French. Governor Henry Sibley placed it on the state seal in 1858 WITHOUT legislative approval, causing controversy. The legislature formally adopted it in 1861. Then in 2024, the new seal redesign removed it from the visual imagery — while keeping it as the official motto in statute."

intro_text: "Minnesota's state motto is <strong>L'Étoile du Nord</strong> — French for <em>The Star of the North</em>. Minnesota is the only U.S. state with a motto in French. Governor Henry Hastings Sibley placed the phrase on the state seal in 1858 without legislative authorization, drawing criticism for overstepping his authority. The legislature formally adopted it on March 5, 1861. Then in 2024, Minnesota redesigned its state seal — and removed the motto from the visual imagery while keeping it as the official verbal motto in state law. The motto now exists in statute without appearing on the seal."

sections:
  - id: "unauthorized-1858"
    icon: "fa-solid fa-gavel"
    title: "Sibley Put It on the Seal Without Legislative Approval"
    paragraphs:
      - "Henry Hastings Sibley won Minnesota's first gubernatorial election by 240 votes and was sworn in on May 24, 1858. Minnesota had just become the 32nd state on May 11. The statehood act required an official state seal. Sibley authorized temporary use of the territorial seal but began making changes without consulting the legislature."
      - "Sibley replaced the territorial seal's Latin motto with a French phrase: 'L'Étoile du Nord.' He did not seek legislative approval. Critics attacked him for acting unilaterally — changing the state's official symbols was a legislative function, not an executive one. The unauthorized seal remained in use for three years while the legislature's next session dealt with other pressing matters."
      - "The legislature convened for the 1861 session and passed a law on March 5 formally describing the official seal design. The text specified all elements including the motto. By formalizing Sibley's design, the legislature retroactively endorsed what he had done in 1858. The French motto became official — three years after Sibley placed it on the seal without permission."

  - id: "french-not-latin"
    icon: "fa-solid fa-globe"
    title: "Why French — The Only French Motto Among 50 States"
    paragraphs:
      - "Henry Sibley had worked for the American Fur Company since age 18. He spent years as a purchasing agent on Mackinac Island, then moved to Mendota in Minnesota Territory in 1834 to manage fur trading operations with Dakota tribes. His business partners and the traders who moved goods across the lake country were French-Canadian voyageurs — men who paddled canoes through the chain of lakes and rivers, transporting furs from the interior to Montreal-based companies."
      - "Sibley learned the Dakota language fluently and was given the name Wah-pe-ton Houska — 'the tall trader.' He operated in a world where French was the commercial language of the northern fur trade. Montreal-based companies had controlled the trade for a century before American expansion. French place names saturated the region. Choosing a French motto honored the voyageur culture that had shaped Minnesota's economy and exploration before American settlement arrived."
      - "No other state chose French for its official motto. Minnesota's choice reflected its specific geography and history — a northern territory where French-Canadian traders had been a dominant cultural and economic force. The phrase 'The Star of the North' also described Minnesota's geographic reality: its Northwest Angle is the northernmost point in the contiguous United States, extending above the 49th parallel."

  - id: "removed-from-seal-2024"
    icon: "fa-solid fa-rotate"
    title: "The 2024 Seal Redesign Removed the Motto From the Visual Imagery"
    paragraphs:
      - "The Minnesota legislature passed a law in 2023 creating a commission to redesign the state seal and flag. Critics had long objected to the original 1858 seal design, which showed a white farmer plowing a field while a Native American riding a horse moved away in the background — an image many interpreted as representing the displacement of Indigenous people. The commission developed new designs."
      - "On May 11, 2024, Minnesota adopted a new state seal. The motto 'L'Étoile du Nord' was not incorporated into the new visual design. For the first time since 1858, the French phrase does not appear on Minnesota's seal. However, the statute that designates 'L'Étoile du Nord' as the official state motto was not repealed. The motto exists in law without appearing on the seal — an unusual legal situation."
      - "The Minnesota North Stars professional hockey team (1967–1993) had used the English translation of the motto in their name and identity. The team relocated to Dallas in 1993 and became the Dallas Stars. Minnesota later received an NHL expansion team in 2000: the Minnesota Wild. The North Star imagery lives on in the new state flag, which prominently features an eight-pointed star, and in the state's informal nickname 'North Star State.'"

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Minnesota State Motto Facts"
    style: "gradient"
    facts:
      - "Minnesota is the only U.S. state with a motto in French."
      - "Governor Henry Sibley placed the motto on the seal in 1858 without legislative approval, causing controversy."
      - "The legislature formally adopted it on March 5, 1861 — five weeks before the Civil War began."
      - "Minnesota's Northwest Angle is the northernmost point in the contiguous United States."
      - "The Minnesota North Stars hockey team (1967–1993) used the motto's English translation in their name."
      - "The 2024 seal redesign removed the motto from the visual imagery while keeping it as the official verbal motto in statute."

faq:
  - question: "What is Minnesota's state motto?"
    answer: "Minnesota's state motto is 'L'Étoile du Nord,' a French phrase meaning 'The Star of the North.' It has been the official motto since March 5, 1861."

  - question: "What does 'L'Étoile du Nord' mean?"
    answer: "'The Star of the North' in French. The phrase refers to Polaris, the North Star, and to Minnesota's position as the northernmost state in the contiguous U.S. — its Northwest Angle extends above the 49th parallel."

  - question: "Why is Minnesota's motto in French?"
    answer: "Governor Henry Sibley chose French to honor the French-Canadian voyageurs who had dominated the northern fur trade for over a century before American settlement. Sibley had worked alongside them for years as a fur trader and spoke their language. No other state chose French for its motto."

  - question: "When did Minnesota officially adopt its motto?"
    answer: "March 5, 1861, when the legislature passed a law formally describing the state seal including the motto. Sibley had placed the phrase on the seal in 1858 without legislative approval — the 1861 law retroactively formalized his unauthorized choice."

  - question: "Does the motto still appear on the Minnesota seal?"
    answer: "No. Minnesota adopted a new state seal on May 11, 2024, which does not include the motto in its visual design. However, the statute designating 'L'Étoile du Nord' as the official state motto was not repealed — it remains the official motto in law, just not on the seal."

  - question: "Where does Minnesota's motto appear today?"
    answer: "In Minnesota state statutes as the official motto, and historically on the state seal until the 2024 redesign. The North Star imagery associated with the motto appears on the new state flag, which features an eight-pointed star. The motto's English translation appeared in the name of the Minnesota North Stars hockey team (1967–1993)."

