sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Minnesota State Motto"
    paragraphs:
      - "Minnesota's state motto is <strong>L'Étoile du Nord</strong>, a French phrase meaning <em>The Star of the North</em>. Governor Henry Sibley placed it on the state seal in 1858, and the Legislature formally adopted it on March 5, 1861."
      - "Minnesota is the only U.S. state with an official motto in French. The phrase gave Minnesota its enduring nickname, the North Star State."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"L'Étoile du Nord\""
    paragraphs:
      - "<em>L'étoile</em> means <em>the star</em>. <em>Du nord</em> means <em>of the north</em>. Together: <em>The Star of the North</em>."
      - "The phrase refers to Polaris, the North Star, which sits nearly fixed above the North Pole and has been used by navigators and travelers for centuries to find direction."

  - id: meaning
    icon: "fa-solid fa-star"
    title: "Minnesota State Motto Meaning"
    paragraphs:
      - "The North Star is a fixed point in the night sky. Travelers navigating by the stars have relied on Polaris for centuries because it barely moves while other stars rotate around it."
      - "For Minnesota, a state in the far north of the continental United States, the star was a natural symbol. The motto frames Minnesota as a guiding point — a northern star that others can orient themselves toward."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Minnesota's State Motto"
    paragraphs:
      - "Henry Hastings Sibley came to Minnesota Territory in 1834 at age 23 to work for the American Fur Company. For the next two decades he managed fur trading operations across the region, working daily alongside French-Canadian voyageurs who paddled the canoe routes through the northern lakes and forests. Sibley learned French and knew the voyageur world from the inside."
      - "When Minnesota became the 32nd state on May 11, 1858, Sibley became its first governor. For the new state seal, he chose a French motto deliberately — a direct acknowledgment of the French-Canadians who had built the region's economy long before American settlement. The territorial seal before it had carried a Latin motto, <em>Quo sursum velo videre</em>, which contained a misspelling. Sibley replaced it."
      - "Sibley placed <em>L'Étoile du Nord</em> on the seal in 1858 without formal legislative action. The Minnesota Legislature passed Laws of Minnesota 1861, Chapter 43 on March 5, 1861, formally adopting it as the official state motto."
      - "On May 11, 2024 — exactly 166 years after statehood — Minnesota adopted a redesigned state seal and flag. The text <em>L'Étoile du Nord</em> was removed from the visual design and replaced by a symbolic star. The statute designating it as the official state motto was not repealed. It remains Minnesota's legal state motto."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"L'Étoile du Nord\" on the Minnesota State Seal"
    paragraphs:
      - "On the historic seal used from 1858 to 2024, the motto appeared on a red ribbon across the top of the seal. The seal showed a farmer plowing a field, a Native American on horseback, pine trees, a waterfall, and the sun rising on the horizon."
      - "Minnesota adopted a new seal and flag design on May 11, 2024. The current seal no longer shows the text <em>L'Étoile du Nord</em>. A white four-pointed star in the innermost circle of the new seal represents the motto symbolically. The state flag shows a dark blue field with the new seal at center."
      - "Despite the redesign, <em>L'Étoile du Nord</em> remains Minnesota's official state motto under state law."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Minnesota State Motto Facts"
    style: "gradient"
    facts:
      - "Minnesota is the only U.S. state with an official state motto in French."
      - "\"L'Étoile du Nord\" means \"The Star of the North\" — a reference to Polaris, the North Star."
      - "Governor Henry Sibley chose French to honor the French-Canadian voyageurs who dominated the northern fur trade."
      - "Sibley placed the motto on the state seal in 1858. The Legislature formally adopted it on March 5, 1861."
      - "The motto gave Minnesota its nickname: the North Star State."
      - "In 2024, Minnesota redesigned its seal and flag. The text was removed from the visual design, but the motto remains official under state law."

