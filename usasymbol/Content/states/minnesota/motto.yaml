faq:
  - question: "What is Minnesota's state motto?"
    answer: "Minnesota's state motto is \"L'Étoile du Nord,\" a French phrase meaning \"The Star of the North.\" It was formally adopted by the Legislature on March 5, 1861, and remains the official state motto today."

  - question: "What does \"L'Étoile du Nord\" mean in English?"
    answer: "\"L'Étoile du Nord\" means \"The Star of the North\" in French. The phrase refers to Polaris, the North Star, which travelers have used for navigation for centuries."

  - question: "Why is Minnesota's motto in French?"
    answer: "Governor Henry Sibley chose French in 1858 to honor the French-Canadian voyageurs who had built Minnesota's fur trade economy for over a century before statehood. Sibley had worked alongside them since the 1830s and spoke French."

  - question: "When did Minnesota adopt its state motto?"
    answer: "Governor Sibley placed it on the state seal in 1858 when Minnesota became a state. The Legislature formally adopted it on March 5, 1861, through Laws of Minnesota 1861, Chapter 43."

  - question: "Is Minnesota's motto still on the state seal?"
    answer: "No. Minnesota adopted a new seal and flag on May 11, 2024, and the text \"L'Étoile du Nord\" was removed from the visual design. A symbolic star replaced it. However, the motto statute was not repealed — \"L'Étoile du Nord\" is still Minnesota's official state motto by law."

  - question: "What language is Minnesota's motto in?"
    answer: "French — making Minnesota the only U.S. state with an official motto in French. All other states use Latin, English, Spanish, Hawaiian, or Native languages."

