sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Minnesota?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Minnesota's official state butterfly. State lawmakers designated it in 2000."
  - "The designation grew out of a student campaign after Minnesotans noticed the monarch's numbers were dropping."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches, one of the larger butterflies seen in Minnesota."
  - "Monarch caterpillars are banded in white, yellow, and black, and they eat only milkweed leaves."

- id: history
  icon: fa-solid fa-landmark
  title: How Minnesota Chose the Monarch Butterfly
  paragraphs:
  - "In 2000, the Minnesota Legislature named the monarch butterfly the official state butterfly."
  - "A fourth grade class at Anderson Elementary School in Mahtomedi pushed for the designation, building on years of concern from University of Minnesota researchers and conservation groups who had tracked a steep drop in monarch numbers."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Minnesota
  paragraphs:
  - "Monarchs spend the summer across Minnesota, laying eggs on milkweed in prairies, gardens, and roadside ditches."
  - "Each fall, Minnesota's monarchs join the migration south, flying thousands of miles to overwintering sites in central Mexico."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted in 2000 by the Minnesota Legislature."
  - "Scientific name: Danaus plexippus."
  - "Wingspan of about 3.5 to 4 inches, with orange wings and black veins."
  - "Caterpillars eat only milkweed leaves."
  - "A fourth grade class in Mahtomedi helped lead the campaign for the designation."




