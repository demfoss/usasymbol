faq:
- question: What is Minnesota's state butterfly?
  answer: "Minnesota's state butterfly is the monarch butterfly, adopted by the Minnesota Legislature in 2000."
- question: When did Minnesota adopt the monarch butterfly?
  answer: "Minnesota adopted the monarch butterfly as its official state butterfly in 2000."
- question: Why did Minnesota choose the monarch butterfly?
  answer: "A fourth grade class in Mahtomedi campaigned for the designation after researchers and conservation groups raised concerns about falling monarch numbers."
- question: What does Minnesota's state butterfly look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in Minnesota?
  answer: "Monarchs are seen across Minnesota in summer, laying eggs on milkweed in prairies, gardens, and roadside ditches before migrating south each fall."
- question: Does Minnesota have a separate state bee?
  answer: "Yes. Minnesota named the rusty patched bumblebee its official state bee in 2019, a separate designation from the monarch state butterfly."

