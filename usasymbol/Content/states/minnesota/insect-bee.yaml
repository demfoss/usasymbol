faq:
- question: What is Minnesota's state bee?
  answer: "Minnesota's state bee is the rusty patched bumblebee, adopted by the Minnesota Legislature in 2019."
- question: When did Minnesota adopt the rusty patched bumblebee?
  answer: "Minnesota adopted the rusty patched bumblebee as its official state bee in 2019."
- question: Why did Minnesota choose the rusty patched bumblebee?
  answer: "Lawmakers wanted to raise awareness of native pollinators, since the rusty patched bumblebee is federally listed as endangered and Minnesota holds a large share of its remaining population."
- question: What does the rusty patched bumblebee look like?
  answer: "It has a black head and a yellow-and-black thorax, and most workers and males show a rust-colored patch in the middle of the abdomen."
- question: Where is the rusty patched bumblebee found in Minnesota?
  answer: "It is found in prairies and grasslands from the Iowa border north to Bemidji, with regular sightings in the Twin Cities metro area."
- question: Is the rusty patched bumblebee endangered?
  answer: "Yes. It was federally listed as endangered in 2017, the first bee in the continental United States to receive that status."

