sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Bee of Minnesota?
  paragraphs:
  - "The rusty patched bumblebee, Bombus affinis, is Minnesota's official state bee. State lawmakers designated it in 2019."
  - "The designation calls attention to native pollinators, since the species is federally listed as endangered."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Rusty Patched Bumblebee
  paragraphs:
  - "The rusty patched bumblebee has a black head and a yellow-and-black thorax."
  - "Most workers and males show a small rust-colored patch in the middle of the abdomen, though queens usually lack it."
  - "It is a small, fuzzy bee, generally active from spring through early fall."

- id: history
  icon: fa-solid fa-landmark
  title: How Minnesota Chose the Rusty Patched Bumblebee
  paragraphs:
  - "The Minnesota Legislature designated the rusty patched bumblebee the official state bee in 2019 to raise awareness of native pollinators and their role in the state's environment and economy."
  - "Lawmakers paired the designation with new funding for pollinator habitat grants and a statewide survey of wild bees."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Rusty Patched Bumblebee in Minnesota
  paragraphs:
  - "The rusty patched bumblebee was once common across the eastern United States and Upper Midwest, but it has disappeared from most of its former range."
  - "Minnesota now holds a large share of the surviving population, with regular sightings in prairies and grasslands from the Iowa border north to Bemidji, including the Twin Cities metro area."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Rusty Patched Bumblebee Facts
  facts:
  - "Adopted in 2019 by the Minnesota Legislature."
  - "Scientific name: Bombus affinis."
  - "Black head, yellow-and-black thorax, and a rust-colored patch on the abdomen in most workers and males."
  - "Federally listed as endangered in 2017, the first bee in the continental United States to receive that status."
  - "Minnesota holds a large share of the species' remaining population, especially in the Twin Cities metro area."




