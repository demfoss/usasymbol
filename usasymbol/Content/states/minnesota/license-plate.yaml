seo_title: 'Minnesota License Plate Slogan: 10,000 Lakes — History Since 1950'
seo_description: '"10,000 Lakes" has appeared on every Minnesota standard plate since 1950 — an unbroken streak across major design eras. Learn about the 1949 Territory Centennial plate, the 1978 canoe graphic, ExploreMinnesota.com, and the 2024 blackout specialty plate.'
hero_image: /images/license-plates/minnesota/2009-exploreminnesota-com-plate.jpg
hero_image_alt: Minnesota license plate with Explore Minnesota and 10,000 Lakes slogan, canoe and boreal forest graphic
hero_image_caption: The current Minnesota standard plate layout reads as ExploreMinnesota.com, while "10,000 lakes" remains at the bottom — the unbroken slogan Minnesota has used since 1950.
intro_text: '**"10,000 Lakes"** has appeared on every Minnesota standard plate since 1950 — an unbroken run of more than seventy years that makes it one of the most durable plate slogans in the country. The phrase has stayed the same across every design change: the pre-graphic embossed era, the 1978 canoe-and-boreal-island redesign, the 1987 addition of "Explore," and the 2009 shift to "ExploreMinnesota.com." The slogan outlasted all of it. The lake count changed formats around it. The claim never did.'
quick_answer: '"10,000 Lakes" has appeared on Minnesota standard plates since 1950 and has not left since — a streak through six design eras. The 1978 redesign added the iconic canoe-and-boreal-island graphic and switched the slogan to all lowercase. In 1987 "EXPLORE" was added before the state name; in 2009 ".com" was added after, making "ExploreMinnesota.com" the web address formed by reading the full plate.'
