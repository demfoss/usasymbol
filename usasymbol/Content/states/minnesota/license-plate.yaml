sections:
- id: ten-thousand-lakes
  icon: fa-solid fa-water
  title: What "10,000 Lakes" Means on Minnesota Plates
  paragraphs:
  - 'The number 10,000 is technically an understatement. Minnesota contains 11,842 lakes larger than ten acres, and over a million acres of lake surface in total. State officials chose 10,000 when the slogan launched in 1950 because it was round, memorable, and accurate in the direction that mattered — it understated rather than overstated. Nobody would dispute it, and everyone could picture it.'
  - 'The claim is also woven into the state''s name and character in ways no other slogan could duplicate. Minnesota comes from a Dakota word connected with water imagery — commonly interpreted as "sky-tinted water" or "cloudy water." The [state bird](/states/minnesota/bird) is the common loon, an animal defined entirely by lake habitat. The [state nickname](/states/minnesota/nickname) includes Land of 10,000 Lakes alongside the North Star State. When "10,000 Lakes" appeared on the plate in 1950, it was not a tourism department''s invention — it was the state''s most accurate single-phrase self-description put into metal.'
  - '"10,000 Lakes" is also the reason most Americans outside Minnesota can identify the state on a plate. Maine''s [Vacationland](/states/maine/license-plate) and Alaska''s [The Last Frontier](/states/alaska/license-plate) work the same way — a phrase so specific to a place that no other state could use it. No other state has 10,000 lakes. No other state puts the number on its plate. The slogan functions as a geographic fingerprint.'

- id: canoe-plate
  icon: fa-solid fa-image
  title: The 1978 Canoe Plate — Minnesota's Most Recognized Design
  paragraphs:
  - 'Before 1978, Minnesota plates were embossed metal with no graphic — "10,000 LAKES" in block capitals at the top, the state name and year in the middle, number at center. The 1978 redesign changed every visual element except the slogan. The new plate put a boreal landscape across the background: pale blue and white water stretching to the horizon, a pale blue sky, a green island with pine trees, and a small green canoe on the water. "10,000 lakes" moved to the bottom and shifted to all lowercase for the first time.'
  - 'The canoe graphic became the visual anchor Minnesota plates would carry for decades. It depicted something real and specific: a northern Minnesota lake scene, the kind of landscape found in the Boundary Waters Canoe Area Wilderness or along the Iron Range. The [common loon](/states/minnesota/bird) calls across that same water; the [red pine](/states/minnesota/tree) defines those same shorelines. The plate image and the state''s official wildlife symbols described the same place.'
  - 'The 1978 design was one of the first graphic plates in the country, introduced at a time when most states still used plain embossed plates. Minnesota''s decision to put a landscape on a registration document was a significant departure, and the canoe-and-island image proved durable enough to anchor multiple subsequent redesigns without being replaced.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Minnesota License Plate Designs by Era
  paragraphs:
  - The slogan stayed constant while the design and the text surrounding it evolved — from a wartime-era centennial plate to a URL embedded in the layout.
  versions:
  - name: Territory Centennial
    years: '1949'
    image: /images/license-plates/minnesota/1949-territory-centennial-plate.jpg
    description: A commemorative plate marking the 100th anniversary of the creation of Minnesota Territory in 1849. Black serial on waffle-textured silver, with "1849 - CENTENNIAL - 1949" at the bottom. The only Minnesota plate not to carry the 10,000 Lakes slogan — issued the year before the streak began.
  - name: 10,000 LAKES (embossed, all caps)
    years: 1950–1977
    image: /images/license-plates/minnesota/1952-10000-lakes-plate.jpg
    description: The slogan's debut era — "10,000 LAKES" centered at the top in embossed capital letters on a plain plate. Colors changed from year to year across the era, but the all-caps slogan remained constant and consistent through nearly three decades of plain embossed plates.
  - name: 10,000 lakes (canoe graphic, all lowercase)
    years: 1978–1986
    image: /images/license-plates/minnesota/1978-canoe-plate.jpg
    description: Minnesota's first graphic plate — pale blue water and sky, a green boreal island with pines, and a small green canoe on the water. The slogan moved to the bottom and switched to all lowercase for the first time. One of the earliest graphic license plate designs in the country, introduced at a time when most states still used plain embossed plates.
  - name: Explore Minnesota / 10,000 lakes
    years: 1987–2008
    image: /images/license-plates/minnesota/1987-explore-minnesota-plate.jpg
    description: '"EXPLORE" was screened in blue to the left of the state name, making the plate read "EXPLORE Minnesota." The canoe-and-island graphic remained but rendered in darker colors. The slogan at the bottom held its lowercase position. The plate that most Minnesotans think of when picturing a Minnesota license plate.'
  - name: ExploreMinnesota.com / 10,000 lakes
    years: 2009–present
    image: /images/license-plates/minnesota/2009-exploreminnesota-com-plate.jpg
    description: A ".com" was added after the state name, turning the three plate elements — "EXPLORE" + "Minnesota" + ".com" — into the tourism website address. The plate now functions simultaneously as a registration document and a URL. "10,000 lakes" continues at the bottom in lowercase, unchanged from 1978.

- id: slogan-that-outlasted-everything
  icon: fa-solid fa-rotate
  title: The Slogan That Outlasted Every Design Around It
  paragraphs:
  - '"10,000 Lakes" has survived every change Minnesota''s plate designers made. It survived the shift from plain embossed to graphic in 1978. It survived the addition of "EXPLORE" in 1987, which reorganized the plate''s visual hierarchy without touching the slogan. It survived the ".com" addition in 2009, which turned the plate into an internet address. Even the 2024 blackout plate is a specialty option rather than a replacement for the standard lake-slogan base. Through all of it, "10,000 lakes" held its place at the bottom of the standard plate.'
  - 'The 1949 Territory Centennial plate is the only Minnesota standard plate issued without the slogan — and it predates the streak by one year. The streak that followed has now run longer than most Americans have been alive. Maine''s [Vacationland](/states/maine/license-plate) is the closest comparable in the country in terms of an unbroken run, also beginning in the 1930s and still on every plate. Minnesota''s streak is shorter by about fifteen years, but the two states share the same logic: they found the truest description of themselves and stopped looking for another one.'
  - 'The [state motto](/states/minnesota/motto) — L''Étoile du Nord, the Star of the North — has been Minnesota''s since 1861. The [2024 state flag](/states/minnesota/flag) kept the North Star but replaced almost everything else. "10,000 Lakes" on the plate did what the star did on the flag: it stayed. For how other states have managed their plate text, see the [U.S. license plate slogans by state](/license-plates) guide.'

timeline:
- year: '1849'
  description: Minnesota Territory is created — the event the 1949 Centennial plate would commemorate a century later.
- year: '1858'
  description: Minnesota becomes the 32nd state on May 11. Plate-issuing begins in subsequent decades.
- year: '1949'
  description: Minnesota issues a Territory Centennial plate — "1849 - CENTENNIAL - 1949" on a silver waffle-textured base. The only standard plate without the 10,000 Lakes slogan.
- year: '1950'
  description: '"10,000 LAKES" appears on Minnesota plates for the first time, centered at the top in embossed capitals. The unbroken streak begins.'
- year: '1978'
  description: Minnesota introduces one of the first graphic license plates in the country — a boreal island, pine trees, and a canoe on pale blue water. The slogan moves to the bottom and shifts to all lowercase.
- year: '1987'
  description: '"EXPLORE" is added in blue before the state name, making the plate read "Explore Minnesota." The canoe graphic continues in darker colors.'
- year: '2009'
  description: '".com" is added after the state name. The three elements now form the tourism website: ExploreMinnesota.com. "10,000 lakes" continues unchanged at the bottom.'
- year: '2024'
  description: Minnesota begins offering a blackout specialty plate with a black background and white lettering. It is a special plate option, not a replacement for the standard ExploreMinnesota.com / 10,000 lakes plate.

faq:
- question: What does the Minnesota license plate say?
  answer: The current Minnesota plate reads "EXPLORE" before the state name and ".com" after it, forming "ExploreMinnesota.com." At the bottom, "10,000 lakes" continues the slogan that has appeared on every Minnesota standard plate since 1950.
- question: When did Minnesota first use "10,000 Lakes" on its plates?
  answer: '"10,000 Lakes" first appeared on Minnesota plates in 1950 and has appeared on every standard plate since — an unbroken streak of more than seventy years.'
- question: Does Minnesota really have 10,000 lakes?
  answer: Minnesota actually has 11,842 lakes larger than ten acres. State officials chose 10,000 as a round number when the slogan launched in 1950 because it was memorable and accurate — it understates the real count rather than overstating it.
- question: When did Minnesota get the canoe design on its license plates?
  answer: Minnesota introduced the canoe-and-boreal-island graphic in 1978 — one of the first graphic license plate designs in the country. The design shows a pale blue lake, a green pine island, and a small green canoe, representing Minnesota's northern lake country.
- question: What does "Explore Minnesota" mean on the license plate?
  answer: '"Explore" was added to Minnesota plates in 1987 before the state name as a tourism directive. In 2009, ".com" was added after the state name, turning the plate into the web address ExploreMinnesota.com while keeping "10,000 lakes" at the bottom.'
- question: What was the 1949 Minnesota license plate?
  answer: The 1949 plate was a Territory Centennial commemorative — "1849 - CENTENNIAL - 1949" on a silver waffle-textured base marking the 100th anniversary of Minnesota Territory. It is the only Minnesota standard plate issued without the 10,000 Lakes slogan, which debuted the following year.
- question: Did the Minnesota blackout plate replace the 10,000 Lakes plate?
  answer: No. Minnesota's blackout plate became available as a specialty plate option in 2024. It does not replace the standard ExploreMinnesota.com plate with "10,000 lakes" at the bottom.

