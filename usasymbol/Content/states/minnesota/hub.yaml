      text: Refers to Minnesota, a northern state known for lakes, forests, the Mississippi headwaters, and a long Canadian border.
    - label: People
      text: People from Minnesota are called Minnesotans.
    - label: Flag
      text: The 2024 flag turns the North Star identity into a simplified modern design.
  - heading: Nicknames and Short Forms
    items:
    - label: North Star State
      text: Main nickname from the French state motto.
    - label: Land of 10,000 Lakes
      text: Popular nickname tied to Minnesota's lake geography.
    - label: Gopher State
      text: Older nickname with political-cartoon roots.
    - label: Abbreviation
      text: MN; older short form Minn.
editorial:
  heading: What Minnesota's Symbols Say About the State
  paragraphs:
  - Minnesota's [2024 state flag](/states/minnesota/flag) changed the visual language of the state without abandoning the core idea. The old seal imagery left the flag, but the North Star stayed, now cleanly connected to the [motto](/states/minnesota/motto) and nickname.
  - The [pink and white lady's slipper](/states/minnesota/flower) is not a pick-and-display wildflower. It is a protected orchid that can take years to bloom, so it makes conservation part of the symbol rather than just decoration.
  - The [red pine](/states/minnesota/tree), [common loon](/states/minnesota/bird), and [milk](/states/minnesota/beverage/milk) divide Minnesota between north woods, lake sound, and dairy economy. That mix feels more Minnesota than any single postcard image could.
faq:
- question: What is Minnesota's most famous state symbol?
  answer: The [Minnesota state flag](/states/minnesota/flag) is now one of the state's most visible symbols because the 2024 redesign centers the North Star on a blue field.
- question: What is Minnesota's state bird?
  answer: Minnesota's state bird is the [common loon](/states/minnesota/bird), a lake bird known for its calls in the northern lake country.
- question: What is Minnesota's state flower?
  answer: Minnesota's state flower is the [pink and white lady's slipper](/states/minnesota/flower), adopted in 1902 and protected from picking or digging on public land.
- question: Why did Minnesota change its flag?
  answer: Minnesota changed its [state flag](/states/minnesota/flag) in 2024 after a redesign process that replaced the old seal-based imagery with a simpler North Star and state-shape design.
- question: How many official state symbols does Minnesota have?
  answer: Minnesota's state symbols list here includes the flag, loon, lady's slipper, red pine, motto, colors, nickname, and milk.
