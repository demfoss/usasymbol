seo_description: "Minnesota state symbols: official state symbols include the common loon, pink and white lady's slipper, red pine, L'Etoile du Nord motto, and 2024 North Star flag."
snippet_answer: Minnesota's common loon is one of the most beloved official state symbols in the Midwest — an emblem tied to the state's 10,000-lake identity and northern forest soundscape. The pink and white lady's slipper, red pine, L'Etoile du Nord motto, and the 2024 North Star flag round out a list shaped by lakes, forests, and a flag redesign that kept the star while leaving the old seal behind.
