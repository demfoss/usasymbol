faq:
  - question: "What is Minnesota's state fruit?"
    answer: "Minnesota's state fruit is the Honeycrisp apple, adopted by the Minnesota Legislature in 2006."
  - question: "When did Minnesota adopt the Honeycrisp apple as its state fruit?"
    answer: "The Minnesota Legislature designated the Honeycrisp apple the official state fruit in 2006."
  - question: "Why did Minnesota choose the Honeycrisp apple?"
    answer: "The Honeycrisp apple was bred and released by the University of Minnesota's apple breeding program, giving it a direct tie to the state."
  - question: "Is the Honeycrisp apple grown in Minnesota today?"
    answer: "Yes, Honeycrisp apples are grown by orchards across Minnesota and many other states."

