    title: "What Is Minnesota's State Fruit?"
    paragraphs:
      - "The Honeycrisp apple is Minnesota's official state fruit, designated by the Minnesota Legislature in 2006. It was developed by the University of Minnesota's apple breeding program."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Honeycrisp Apple"
    paragraphs:
      - "The Honeycrisp is known for its extremely crisp, juicy texture and balanced sweet-tart flavor. Bred to survive Minnesota's cold winters, it became one of the most popular apple varieties in the country after its release to growers in 1991."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Honeycrisp Apple Became Minnesota's State Fruit"
    paragraphs:
      - "The Minnesota Legislature designated the Honeycrisp apple the official state fruit in 2006."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Minnesota Chose the Honeycrisp Apple"
    paragraphs:
      - "The Honeycrisp was bred and released by the University of Minnesota's apple breeding program, giving the variety a direct and well-documented tie to the state's agricultural research."

  - id: facts
