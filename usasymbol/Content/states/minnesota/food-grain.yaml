sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Minnesota's State Grain?"
    paragraphs:
      - "Wild rice is Minnesota's official state grain, designated by the Minnesota Legislature in 1977. It grows naturally in shallow lakes and slow-moving rivers across the northern part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Wild Rice"
    paragraphs:
      - "Wild rice is a tall aquatic grass, not a true rice, that produces long, dark grains in shallow water. Traditional harvesters use a canoe and two wooden sticks, called knockers, to gently bend the stalks and knock ripe grains loose. After harvest, the rice is parched and threshed, giving it a chewy texture and nutty, smoky flavor."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Wild Rice Became Minnesota's State Grain"
    paragraphs:
      - "The Minnesota Legislature designated wild rice the official state grain in 1977, recognizing a crop with deep roots in the state's waters and culture."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Minnesota Chose Wild Rice"
    paragraphs:
      - "Wild rice, known as manoomin in the Ojibwe language, holds deep cultural and spiritual meaning for Minnesota's Ojibwe communities, whose oral history describes migrating to the Great Lakes region in search of the food that grows on water. Minnesota also grows commercial paddy wild rice and remains one of the leading producers of both wild-harvested and cultivated wild rice in the country."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Wild Rice Facts"
    facts:
      - "Adopted as Minnesota's state grain in 1977."
      - "Ojibwe communities call it manoomin, meaning the food that grows on water."
      - "Traditional harvesters use a canoe and wooden knockers to gather it."
      - "Minnesota produces both lake-harvested wild rice and cultivated paddy wild rice."

