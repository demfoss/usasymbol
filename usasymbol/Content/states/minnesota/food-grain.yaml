faq:
  - question: "What is Minnesota's state grain?"
    answer: "Minnesota's state grain is wild rice, adopted by the Minnesota Legislature in 1977."
  - question: "When did Minnesota adopt wild rice as its state grain?"
    answer: "The Minnesota Legislature designated wild rice the official state grain in 1977."
  - question: "Why did Minnesota choose wild rice?"
    answer: "Wild rice, known as manoomin, is deeply significant to Minnesota's Ojibwe communities and has long grown naturally in the state's northern lakes and rivers."
  - question: "Is wild rice harvested in Minnesota today?"
    answer: "Yes. Minnesota remains one of the top producers of both wild-harvested and cultivated wild rice in the country."

