type: State Coat of Arms
state: Minnesota
name: Minnesota State Coat of Arms
adopted_year: 1861
is_official: true
meaning: "The Minnesota coat of arms centers a frontier scene that shows two figures facing opposite directions: a settler plowing a field on the right and a Native American on horseback on the left, riding toward the setting sun. St. Anthony Falls and the Mississippi River appear in the background. The design captures the moment of transition in mid-nineteenth-century Minnesota, when European-American settlement was expanding across land where the Dakota had lived for generations. The French motto below — L'Étoile du Nord, The Star of the North — places Minnesota on the northern edge of the continent."
meaning_title: Meaning of the Minnesota Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Minnesota Coat of Arms: Meaning, Symbols and History'
seo_description: "The Minnesota coat of arms was adopted in 1861 and shows a settler plowing, a Native American on horseback, and the motto L'Étoile du Nord."
hero_image: /images/coats-of-arms/minnesota/coat-of-arms.webp
hero_image_alt: Historic Coat of Arms of the State of Minnesota, adopted 1861, showing a settler plowing at right, a Native American on horseback at left, St. Anthony Falls in the background, and the motto L'Étoile du Nord below
hero_image_caption: The Minnesota Coat of Arms, adopted in its official form in 1861. The central scene shows a settler plowing at right and a Native American on horseback riding toward the setting sun at left. St. Anthony Falls and the Mississippi River appear in the background. The French motto L'Étoile du Nord — The Star of the North — runs below.
intro_text: "The Minnesota coat of arms was adopted in 1861 and shows a settler plowing a field at right and a Native American on horseback at left, with St. Anthony Falls and the Mississippi River in the background. The French motto below — L'Étoile du Nord — names the state The Star of the North."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Minnesota Coat of Arms?
  paragraphs:
  - "The Minnesota coat of arms is a circular design built around a frontier landscape scene. The design appeared on official state documents, the historic state flag, and government correspondence from 1861 until the Minnesota Legislature adopted a new state seal on May 11, 2024. The coat of arms represents the historic heraldic tradition of the state through that 163-year period."
  - "At the center of the design is a landscape divided into foreground and background. Two human figures occupy the foreground, facing away from each other. Behind them, a famous waterfall and a broad river mark a specific point in Minnesota's geography. The year 1858 — the year of statehood — is included in the surrounding text of the design."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Minnesota Coat of Arms
  paragraphs:
  - "Minnesota became a state on May 11, 1858. A seal was used at statehood, but the design was not yet finalized by the legislature. The year 1858 was incorporated into the circular text — The Great Seal of the State of Minnesota 1858 — to mark the moment of statehood even after the design was revised."
  - "In 1861, the Minnesota Legislature formally approved the revised design associated with Henry Sibley, the state's first governor. The revised seal set the composition that would remain Minnesota's official coat of arms for more than a century: a settler plowing at right, a Native American on horseback at left, St. Anthony Falls in the background, the Mississippi River, pine trees, the sun on the western horizon, and the motto L'Étoile du Nord below."
  - "In 1983, the legislature rewrote the statutory description of the design and commissioned a standardized official redraw. That version adjusted several rendering details, including the orientation of the Native American rider. The core composition — settler, rider, falls, river, trees, motto — remained unchanged."
  - "In 2023, the Minnesota Legislature created the State Emblems Redesign Commission to adopt a new official seal and flag. A new Great Seal, centering a loon rather than a frontier scene, became official on May 11, 2024. The historic coat of arms design was retired from use on state documents on that date."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Minnesota Coat of Arms
  paragraphs:
  - "The Minnesota coat of arms is built around a frontier landscape scene contained in a circular design with the state name and the year 1858 in the surrounding text. Each element refers to a specific place, person, or moment in Minnesota's mid-nineteenth-century history."
  elements:
  - id: settler
    name: The Settler Plowing
    image: /images/coats-of-arms/minnesota/elements/settler.webp
    paragraphs:
    - "A settler plows a field on the right side of the central scene, working land in the foreground. He faces right — toward the east — with his horse and plow. The image represents the European-American agricultural settlement of Minnesota in the years around and after statehood."
    - "Placing the settler at the right side of the composition — the traditional position for the primary figure in Western visual design — reflects the perspective of the officials who created the seal in the 1850s and 1860s."
  - id: native-rider
    name: The Native American on Horseback
    image: /images/coats-of-arms/minnesota/elements/native-rider.webp
    paragraphs:
    - "A Native American on horseback appears on the left side of the central scene, riding away from the settler and toward the setting sun in the west. The figure represents the Dakota people, who were the primary indigenous inhabitants of southern Minnesota at the time of statehood."
    - "The 1983 revision to the design changed the orientation of the rider. In both the 1861 and 1983 versions, however, the figure moves west, away from the settler plowing behind him."
  - id: falls-and-river
    name: St. Anthony Falls and the Mississippi River
    image: /images/coats-of-arms/minnesota/elements/falls.webp
    paragraphs:
    - "St. Anthony Falls appears in the background of the scene, with the Mississippi River visible behind the two foreground figures. St. Anthony Falls — located in present-day Minneapolis — was the only natural waterfall on the entire Mississippi River and was a landmark of national importance in the mid-nineteenth century."
    - "The falls powered the early Minneapolis milling industry and were the reason the city grew where it did. Including them in the coat of arms anchored the design to a specific and recognizable place in Minnesota's geography."
  - id: pine-trees
    name: Pine Trees
    image: /images/coats-of-arms/minnesota/elements/pine-trees.webp
    paragraphs:
    - "Three pine trees stand in the background of the central scene. They represent the forests of northern Minnesota, where white pine and Norway pine covered millions of acres at the time of statehood."
    - "Pine trees also connect to Minnesota's economy: the timber industry was one of the state's earliest major industries after statehood, and the Norway pine later became the official state tree."
  - id: motto
    name: L'Étoile du Nord
    image: /images/coats-of-arms/minnesota/elements/motto.webp
    paragraphs:
    - "The motto L'Étoile du Nord runs below the central scene on a ribbon. It is French for The Star of the North. The phrase was Minnesota's official state motto from statehood in 1858 until it was replaced in 2023 during the redesign process."
    - "The use of French reflects Minnesota's history as a land where French Canadian voyageurs and fur traders traveled extensively from the seventeenth century onward, long before American statehood. French place names survive across Minnesota to this day."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Minnesota Coat of Arms
  paragraphs:
  - "The two-figure composition at the center of the coat of arms was not accidental. The settler faces east and the Native American figure rides west — away from each other. The design reflects the view held by mid-nineteenth-century state officials that European-American agriculture was replacing an earlier way of life on the same land."
  - "St. Anthony Falls in the background grounds the scene in a real and famous place. In 1858, the falls were among the most recognizable landmarks in the upper Midwest. Including them made the coat of arms specific to Minnesota rather than a generic frontier image."
  - "The French motto connects the design to a longer history. Minnesota's name comes from the Dakota language, but French explorers and traders were the first Europeans to map and name the rivers and lakes of the region. L'Étoile du Nord acknowledges that French-speaking history while pointing north — toward Canada, toward the border, toward the edge of the continent."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Minnesota Coat of Arms Facts
  facts:
  - "The coat of arms design was formally adopted by the Minnesota Legislature in 1861, three years after Minnesota became a state on May 11, 1858."
  - "The legislature revised the statutory description of the design in 1983 and commissioned a standardized redraw, adjusting the orientation of the Native American rider."
  - "St. Anthony Falls, shown in the background, was the only natural waterfall on the entire Mississippi River."
  - "The motto L'Étoile du Nord is French for The Star of the North. French was chosen because French Canadian voyageurs traveled Minnesota's waterways for generations before American statehood."
  - "The historic coat of arms design was retired on May 11, 2024, when Minnesota adopted a new Great Seal centered on a common loon."
  - "Henry Sibley, Minnesota's first governor, is associated with the revised 1861 design that became the official coat of arms."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Minnesota Coat of Arms
  paragraphs:
  - "Minnesota used a seal from statehood in 1858, but the legislature did not formally approve a final design until 1861. The 1861 version became the standard for more than a century. A 1983 revision standardized the rendering and adjusted several details, including the orientation of the Native American rider."
  - "The historic coat of arms design that existed from 1861 to 2024 is documented below through the two principal official renderings that survive most widely in public historical use."
  versions:
  - name: Historic Official Design
    years: 1861–1983
    image: /images/coats-of-arms/minnesota/versions/seal-of-minnesota-1861-1983.jpg
    description: The seal approved by the Minnesota Legislature in 1861. It fixed the composition that lasted for more than a century — settler plowing at right, Native rider at left, St. Anthony Falls, the Mississippi River, pine trees, and the motto L'Étoile du Nord.
  - name: Revised Historic Seal
    years: 1983–2024
    image: /images/coats-of-arms/minnesota/versions/seal-of-minnesota-1983-2024.png
    description: The 1983 statutory redraw standardized the older design and adjusted the orientation of the Native American rider. The core scene — settler, rider, falls, river, trees, motto — remained unchanged from the 1861 version.

faq:
- question: What does the Minnesota coat of arms show?
  answer: "The historic Minnesota coat of arms shows a central landscape scene with a settler plowing at right and a Native American on horseback at left. St. Anthony Falls and the Mississippi River appear in the background. Pine trees stand behind the figures. The French motto L'Étoile du Nord — The Star of the North — runs below."
- question: When was the Minnesota coat of arms adopted?
  answer: "The Minnesota Legislature formally adopted the design in 1861, three years after Minnesota became a state in 1858. The year 1858 appears on the seal to mark statehood, but the official design was not finalized until 1861."
- question: What does L'Étoile du Nord mean?
  answer: "L'Étoile du Nord is French for The Star of the North. It was Minnesota's official state motto from statehood in 1858. The French reflects the history of French Canadian voyageurs who traveled Minnesota's waterways long before American settlement."
- question: Who is the Native American on the Minnesota coat of arms?
  answer: "The figure on horseback represents the Dakota people, who were the primary indigenous inhabitants of southern Minnesota at the time of statehood. He rides toward the west, away from the settler plowing at right. The 1983 revision to the design changed the orientation of the rider."
- question: What are the falls shown in the Minnesota coat of arms?
  answer: "The falls in the background are St. Anthony Falls, located on the Mississippi River in present-day Minneapolis. At the time of statehood, they were the only natural waterfall on the entire Mississippi River and one of the most recognized landmarks in the upper Midwest."
- question: Is the Minnesota coat of arms still used today?
  answer: "The historic coat of arms design was retired on May 11, 2024, when Minnesota adopted a new Great Seal centered on a common loon. The historic frontier scene had been the state's official armorial design from 1861 to 2024."
- question: Who designed the Minnesota coat of arms?
  answer: "Henry Sibley, Minnesota's first governor, is associated with the revised 1861 design that became the official coat of arms. A first version was used at statehood in 1858, and the legislature formalized Sibley's revised design in 1861."

