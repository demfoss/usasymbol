    answer: "Minnesota's state tree is called Red Pine or Norway Pine. The scientific name is Pinus resinosa. The 'red' refers to the reddish bark. The 'Norway' name likely comes from Norway, Maine, where botanists first described it, though the tree doesn't grow in Norway, Europe."
  
  - question: "When was the Minnesota state tree adopted?"
    answer: "Minnesota proclaimed the Red Pine as its official state tree in 1953. The Legislature passed the designation during the 1953 session, recognizing a tree native to Minnesota's northern forests."
  
