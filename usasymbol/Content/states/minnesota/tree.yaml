    answer: "Minnesota chose the Red Pine because it represents the state's northern forest character. The tree grows naturally in Minnesota's north woods, thriving in cold climates and sandy soils. Red pine was economically important during Minnesota's logging era and for telephone poles. The Civilian Conservation Corps planted millions in the 1930s, restoring cutover lands. The tree symbolizes both Minnesota's lumber heritage and conservation efforts."
  
