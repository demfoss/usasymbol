seo_title: "Minnesota State Tree | Red Pine"
seo_description: 'Minnesota named red pine its state tree in 1953, recognizing a northern forest tree with reddish bark, strong lumber, and fire-adapted stands.'

intro_text: "Red Pine became Minnesota's state tree in 1953, though many Minnesotans know it by another name - Norway Pine. This tall conifer grows 60 to 80 feet in Minnesota's north woods, with its distinctive reddish bark creating splashes of color in northern forests. The tree thrives in Minnesota's sandy soils and cold climate, growing naturally only in the northern Great Lakes region and northeastern states. Minnesota's Red Pine forests supplied lumber for construction and played a vital role in the state's logging industry alongside white pine. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Minnesota State Tree?"
    paragraphs:
      - "Minnesota's official state tree is the Red Pine, commonly called Norway Pine despite having no connection to Norway. This conifer grows 60 to 80 feet tall in Minnesota forests, with exceptional specimens reaching 100 to 120 feet. The trunk measures two to three feet in diameter at maturity. Some old-growth Minnesota red pines exceed four feet across. The tree develops a tall, straight trunk with relatively few branches, making it valuable for lumber and telephone poles. Minnesota's logging industry harvested red pine alongside white pine during the late 1800s and early 1900s, though red pine never achieved white pine's economic prominence."
      - "The bark provides the tree's most distinctive feature and gives red pine its common name. The bark appears reddish-brown to orangish-red, especially on upper trunk and branches. The color becomes brighter as trees mature. Large irregular plates separate into flat sections: that flake off. The bark texture feels somewhat scaly. Needles grow in bundles of two, each needle measuring four to six inches long. The stiff, brittle needles break cleanly when bent double - a reliable identification test. Needles appear dark yellow-green, darker than white pine but lighter than jack pine. Cones measure two to three inches long, much smaller than white pine cones."
      - "Red pine grows throughout northern Minnesota, particularly in the northeastern counties. The species thrives on dry, sandy, or rocky soils where many other trees struggle. Minnesota contains some of North America's largest remaining red pine forests. The tree forms pure stands on some sites, especially after fires clear competing vegetation. Red pine is fire-resistant with thick bark that protects the trunk. Young trees need full sunlight and cannot survive in shade, so mature red pine forests have little undergrowth. The species grows naturally only in a limited range from southern Canada through Minnesota, Wisconsin, Michigan, and northeastern states."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Minnesota State Tree Name"
    paragraphs:
      - "The official name is Red Pine, referring to the reddish bark color. However, most Minnesotans call this tree Norway Pine. The Norway Pine name creates confusion since the species has no connection to Norway and doesn't grow there naturally. The name likely originated from Norway, Maine, where early botanists first scientifically described the species, or from early settlers who thought it resembled European pines. The scientific name Pinus resinosa combines Pinus (Latin for pine) with resinosa (resinous), describing the tree's high resin content."
      - "Minnesota foresters and loggers use both names interchangeably. Red pine is the technically correct common name used in scientific and forestry contexts. Norway pine remains popular in everyday Minnesota speech. Other historical names include Canadian red pine and hard pine, the latter referring to the wood's density compared to white pine. The species belongs to the Pinaceae family. Minnesota's red pine is the same species as red pine found in other northern states - no distinct Minnesota variety exists."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Red Pine Became the Minnesota State Tree"
    paragraphs:
      - "Minnesota proclaimed Red Pine as its official state tree in 1953. The Minnesota Legislature passed the designation during the 1953 session. The bill recognized a tree native to Minnesota that thrived in the state's northern climate. Minnesota became one of three states to choose a pine as state tree, joining Maine with white pine and later Idaho with western white pine. The 1953 designation formalized red pine's status as a Minnesota symbol in line with [The North Star State nickname](/states/minnesota/nickname/the-north-star-state)."
      - "Minnesota chose red pine because it represents the state's northern forest character. The tree grows naturally in Minnesota's north woods, thriving in the cold climate and sandy soils that define much of northern Minnesota. Red pine forests create the distinctive north woods landscape that shapes Minnesota's character. The species appears frequently in state forests and parks across northern counties. Its ability to survive harsh Minnesota winters and regenerate after fire made it a symbol of resilience suited to Minnesota's environment and the values in the [Minnesota state motto](/states/minnesota/motto/letoile-du-nord)."
      - "The tree held economic importance for Minnesota's development. During the logging era from 1870 to 1920, Minnesota lumber companies harvested red pine alongside the more valuable white pine. The wood's strength and straight grain made excellent lumber for construction, flooring, and millwork. Red pine's rot resistance suited it for telephone and power poles - thousands of Minnesota red pines became utility poles across the Midwest. The Civilian Conservation Corps planted millions of red pine seedlings in Minnesota during the 1930s, creating many of the mature red pine stands visible today. These plantations restored forests to cutover lands and provided timber for Minnesota's continuing forest products industry. The combination of native status, economic utility, and successful reforestation made red pine an appropriate symbol for Minnesota."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Minnesota State Tree Facts"
    facts:
      - "Minnesota proclaimed Red Pine as state tree in 1953, recognizing a species native to the state's northern forests"
      - "Most Minnesotans call it Norway Pine despite no connection to Norway - the name likely comes from Norway, Maine, where botanists first described it"
      - "Needles in bundles of two break cleanly when bent double, providing a simple field identification test"
      - "Red pine grows naturally only in a limited range from southern Canada through northern Great Lakes states - Minnesota contains significant populations"
      - "The Civilian Conservation Corps planted millions of red pine seedlings in Minnesota during the 1930s, creating many modern forests"
      - "Red pine wood was prized for telephone and power poles because of its straight growth and rot resistance"
      - "The reddish bark becomes brighter on upper trunk and branches as trees mature, creating distinctive color in winter forests"
      - "Pure red pine stands develop with little undergrowth because young trees cannot survive in shade beneath mature crowns"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Minnesota State Tree and Flower"
    paragraphs:
      - "Minnesota's state flower is the Pink and White Lady's Slipper (Cypripedium reginae), designated in 1902. The state adopted its floral symbol more than 50 years before choosing red pine. Both symbols represent Minnesota's northern environment. The rare lady's slipper orchid blooms in northern bogs and swamps, while red pine towers over upland forests. Lady's slippers flower in June across Minnesota's wetlands as red pines complete their spring growth. The pair shows Minnesota's diverse northern ecosystems from peat bogs to pine forests, reflecting the state's position at the transition between eastern hardwood forests and northern boreal forests; see the [official Minnesota state flower](/states/minnesota/flower/pink-and-white-ladys-slipper)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Minnesota Red Pine"
    paragraphs:
      - "The reddish bark makes red pine unmistakable in Minnesota forests. Look for orangish-red to reddish-brown bark, especially on the upper trunk and larger branches. The color appears brightest where sun hits the bark. Lower trunk bark may appear darker brown. Large irregular plates flake off in sections:. The bark feels somewhat scaly but not as furrowed as many pines. Young red pines show more orangish bark that darkens with age. The distinctive color sets red pine apart from all other Minnesota conifers."
      - "Examine the needles for confirmation. Red pine produces exactly two needles per bundle. Each needle measures four to six inches long, longer than jack pine needles but shorter than white pine. The needles feel stiff and brittle - they snap cleanly when bent double, unlike flexible white pine needles that bend without breaking. This snap test provides reliable identification. The needles appear dark yellow-green and grow in dense clusters at branch tips, creating tufted appearance. Needles stay on the tree for four years before dropping, giving red pine a fuller look than some pines."
      - "The overall form shows a tall straight trunk extending upward with a narrow crown. Mature trees develop an oval or irregular crown shape. Lower branches die off as trees age, leaving clean trunks for 30 to 50 feet before the first living branches. Trees growing in dense stands show very straight trunks with minimal taper. Open-grown specimens develop fuller crowns starting lower on the trunk. The cones measure two to three inches long, much smaller than white pine cones. They appear egg-shaped without prickles, turning from purple to light brown as they mature. Cones open in fall to release small winged seeds."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Minnesota State Tree Symbolizes"
    paragraphs:
      - "Red Pine represents Minnesota's northern character and resilience. The tree's ability to thrive in harsh winters and poor soils reflects the determination of Minnesotans who settled the state's challenging northern climate. Red pine symbolizes Minnesota's forest heritage and the north woods that define much of the state's landscape. For many Minnesotans, red pine forests evoke memories of camping, fishing, and outdoor recreation in northern Minnesota. The species' successful regeneration through Civilian Conservation Corps planting demonstrates Minnesota's conservation values. The tree connects modern Minnesota to both the logging era and environmental restoration efforts that followed in a region summarized by [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
