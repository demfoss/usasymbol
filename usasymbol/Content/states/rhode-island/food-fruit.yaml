sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Rhode Island's State Fruit?"
    paragraphs:
      - "The Rhode Island Greening apple is Rhode Island's official state fruit, designated by the Rhode Island General Assembly in 1991. It is one of the oldest named apple varieties to originate in America."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Rhode Island Greening Apple"
    paragraphs:
      - "The Rhode Island Greening is a large, tart, green-skinned apple prized for baking, particularly in pies, because it holds its shape and flavor when cooked. It ripens in fall and keeps well in storage."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Rhode Island Greening Apple Became Rhode Island's State Fruit"
    paragraphs:
      - "The Rhode Island General Assembly designated the Rhode Island Greening the official state fruit in 1991."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Rhode Island Chose the Rhode Island Greening Apple"
    paragraphs:
      - "The apple variety is believed to have originated on a farm near Green's End in Newport in the 1600s, making it one of the earliest American apple varieties and one that carries the state's name."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Rhode Island Greening Apple Comes From in Rhode Island"
    paragraphs:
      - "Newport, where the original tree is believed to have grown near Green's End, is historically tied to the origin of the Rhode Island Greening apple."
