faq:
  - question: "What are the colors of Rhode Island?"
    answer: "Rhode Island has no official state colors by statute. The colors of the state flag — Blue, White, and Gold — are widely recognized as the traditional state colors. The flag features a gold anchor surrounded by 13 gold stars on a white field, with a blue ribbon bearing the motto 'HOPE.'"
  - question: "Does Rhode Island have official state colors?"
    answer: "No. Rhode Island has not enacted legislation designating official state colors. The blue, white, and gold of the state flag are traditional rather than statutory."
  - question: "What is the HEX code for Rhode Island Blue?"
    answer: "The standard HEX code for Rhode Island Blue (from the flag's blue ribbon) is #003271, corresponding to Pantone PMS 294 C. This is an approximation; no official color specification exists in Rhode Island law."
  - question: "What does the gold anchor on Rhode Island's flag mean?"
    answer: "The gold anchor is the symbol of hope, derived from the biblical verse 'hope we have as an anchor of the soul' (Hebrews 6:18-19). It has appeared on Rhode Island's seal since 1647, making it one of the oldest continuously used heraldic symbols in American history."
  - question: "Why does Rhode Island's flag have a white background?"
    answer: "The white field of the Rhode Island flag corresponds to the facings on Rhode Island militia uniforms worn during the American Revolution. White and blue were the colors of Rhode Island regimental flags in the Revolutionary War, the War of 1812, and the Mexican War."

