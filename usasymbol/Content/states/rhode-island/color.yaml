title: "Official and Traditional Colors of Rhode Island"
state: "Rhode Island"
adopted_year: null

seo_title: "Rhode Island State Colors: Official HEX Codes & Meaning"
seo_description: "Rhode Island state colors are Blue, White, and Gold, based on the 1897 state flag. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The traditional state colors of Rhode Island are **Blue**, **White**, and **Gold**, derived from [the Rhode Island state flag](/states/rhode-island/flag/rhode-island-state-flag) adopted in 1897. Rhode Island has not enacted a separate state color statute; these colors trace to colonial times and appear throughout all official state insignia and branding. All technical color values — HEX, RGB, CMYK, and Pantone — are in the specifications below, suitable for print, web, and official Rhode Island state branding."

official_colors: "Blue, White, and Gold (Traditional / Unofficial — no statutory designation)"
official_since: "No statutory designation; traditional colors from the 1897 state flag"
primary_use: "State flag, state coat of arms (golden anchor on blue), ceremonial contexts, state government visual identity"
known_for: "White field with a gold anchor surrounded by 13 gold stars on a blue ribbon; the anchor has been a symbol of Rhode Island since 1647 when it appeared on the colony's first seal; Rhode Island is one of only a few U.S. states with a white-field flag; white and blue are the same colors used on Rhode Island regimental flags in the Revolutionary War"

