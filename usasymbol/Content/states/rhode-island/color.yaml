sections:
  - id: "official-designation"
    title: "Official Status and History"
    style: "default"
    paragraphs:
      - "Rhode Island has not designated official state colors by legislative statute. The blue, white, and gold of the state flag are the colors most widely recognized as representing the state, tracing their use in Rhode Island's official visual identity to the colonial era. The current state flag was adopted by the Rhode Island General Assembly at its January Session of 1897 and is described in Rhode Island General Laws § 42-4-3, which specifies the flag's dimensions, elements, and colors in heraldic terms without providing technical color specifications. This de facto pattern parallels language on [the Ocean State nickname page](/states/rhode-island/nickname/the-ocean-state)."
      - "The flag's historical origins reach back to 1647, when the Rhode Island General Assembly adopted the anchor for the colonial seal. The 1897 flag consolidated the anchor, the 13 stars, and the blue ribbon into the current design, drawing on earlier military flag traditions. The 1877 flag — the first non-military state flag — used the same white field with blue stars and an anchor, noting that 'the colors, white and blue, are the same as those used in the flags carried by the regiments of the State of Rhode Island during the American Revolution, the War of 1812, and the Mexican War.'"
    subsections:
      - subtitle: "Rhode Island General Laws § 42-4-3"
        text: "RI Gen. Laws § 42-4-3 describes the state flag as 'white, five feet and six inches fly and four feet and ten inches deep on the pike, bearing on each side in the center a gold anchor, twenty-two inches high, and underneath it a blue ribbon twenty-four inches long and five inches wide, or in these proportions, with the motto Hope in golden letters thereon, the whole surrounded by thirteen golden stars in a circle.' The statute does not specify Pantone, Cable, or HEX values. The Rhode Island flag is one of only a few U.S. state flags with a white field (joining the flags of California, which is also predominantly white)."
      - subtitle: "The Anchor and Hope: Rhode Island's Defining Symbol"
        text: "The anchor has been Rhode Island's defining symbol since the colonial era. The Rhode Island General Assembly adopted the anchor for the provincial seal in 1647 under the Cromwellian Patent of 1643. In 1644, when King Charles II granted a more liberal charter to the Colony of Rhode Island and Providence Plantations, the anchor was retained on the seal and the word 'Hope' was added above it. The inspiration was the biblical phrase from Hebrews 6:18-19: 'hope we have as an anchor of the soul.' Rhode Island's earliest colonists — religious dissenters fleeing persecution in Massachusetts — were particularly drawn to this image of steadfast hope under pressure, which is documented in [Rhode Island's motto history](/states/rhode-island/motto/hope)."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Blue, white, and gold in Rhode Island's flag tradition speak to the state's maritime identity, founding idealism, and position as the 13th and final colony to ratify the Constitution. White reflects the purity of purpose that motivated Roger Williams in founding Providence as a refuge of religious liberty. Blue reflects the defining role of Narragansett Bay in Rhode Island's geography and history. Gold reflects the hope anchored in the state seal — a symbol that has held constant for nearly 400 years, with regional context in [States That Border Rhode Island](/states/rhode-island/borders)."
    subsections:
      - subtitle: "White: Roger Williams and the Founding of Religious Liberty"
        text: "Rhode Island's founding in 1636 by Roger Williams, who was expelled from the Massachusetts Bay Colony for advocating religious tolerance and separation of church and state, gave the state a founding identity rooted in the principle of freedom of conscience. Williams established Providence as a settlement where people of all religious beliefs — including Jews, Quakers, and others persecuted elsewhere in colonial America — could live without religious coercion. This tradition of civic and moral clarity is reflected in the white field of the state flag and in Rhode Island's record as the first colony to formally renounce allegiance to King George III (May 4, 1776), before the national Declaration of Independence."
      - subtitle: "Gold: Maritime Commerce and the Thirteen Colonies"
        text: "Gold's prominence in Rhode Island's flag — the anchor, the 13 stars, and the 'HOPE' lettering are all gold — reflects both the maritime commercial wealth that made colonial Providence and Newport prosperous and the state's singular position as the 13th and final colony to ratify the United States Constitution (May 29, 1790). Rhode Island's delay in ratifying was itself a reflection of the state's fierce independence: it held out until the Bill of Rights was assured, a testament to the founding principles of liberty that have defined Rhode Island's civic identity since Williams's arrival in 1636. The 13 gold stars on the flag honor both the original 13 colonies and Rhode Island's specific rank among them."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue, white, and gold define the Rhode Island state flag in their entirety and appear extensively in state institutional contexts. The Rhode Island state coat of arms displays a gold anchor on a blue field — the same two colors that form the core of the flag's design — and this coat of arms appears on official state seals and government documents. The Rhode Island state motto 'HOPE' appears in gold on the blue ribbon of the flag. Rhode Island government agency branding, the Rhode Island General Assembly's official materials, and state ceremonial contexts all use the blue, white, and gold palette derived from the flag. The University of Rhode Island uses blue and white as its institutional colors, while Brown University uses brown and white, neither matching the gold of the state flag — a common divergence between university and state colors. Related symbol context is available on [Rhode Island state pages](/states/rhode-island)."

