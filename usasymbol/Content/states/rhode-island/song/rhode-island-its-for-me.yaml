sections:
  - id: overview
    icon: fa-solid fa-music
    title: Rhode Island State Song
    paragraphs:
      - "\"Rhode Island, It's for Me\" is the state's official song, adopted in 1996. Comedian Charlie Hall wrote the words, with music by Maria Day and an arrangement by Kathryn Chester, turning years of jokes about the state into an affectionate tribute."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Rhode Island, It's for Me\" Explained"
    paragraphs:
      - "The song paints a picture of Rhode Island's coastline, lighthouses, and changing seasons, along with city landmarks like Providence's State House dome and College Hill. It moves at an easy, singable pace built for audience participation rather than formal ceremony."
      - "Charlie Hall wrote the original lyrics for his long-running \"Ocean State Follies\" comedy revue, a show built around gentle jabs at Rhode Island life. Maria Day set the words to music, and Kathryn Chester arranged the final version submitted to the state."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Rhode Island, It's for Me" Represents Rhode Island
    paragraphs:
      - "The song stood out because it came from genuine local affection rather than a formal contest entry. Hall had spent years poking fun at the state on stage, and lawmakers saw his sincere tribute as a fitting answer."
      - "Legislators asked for revisions to work in more specific Rhode Island references before giving final approval, ensuring the song named real places rather than generic coastal imagery. That local specificity helped it read as authentically Rhode Island rather than interchangeable with any other seaside state."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Rhode Island, It's for Me\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Rhode Island, It's for Me" Became Rhode Island's State Song
    paragraphs:
      - "The Rhode Island General Assembly adopted \"Rhode Island, It's for Me\" in 1996, replacing the state's previous song, \"Rhode Island\" by T. Clarke Browne, which the legislature redesignated as the official state march rather than dropping it entirely."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Rhode Island

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Rhode Island, It's for Me\" Facts"
    facts:
      - "Rhode Island adopted \"Rhode Island, It's for Me\" as its state song in 1996."
      - "Lyricist Charlie Hall originally wrote the song for his comedy revue, \"Ocean State Follies.\""
      - "The song replaced an earlier state song, \"Rhode Island,\" which became the official state march instead."
      - "Legislators required lyric revisions to add more specific Rhode Island references before final approval."

