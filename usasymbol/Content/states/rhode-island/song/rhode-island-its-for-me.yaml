faq:
  - question: What is Rhode Island's state song?
    answer: "Rhode Island's official state song is \"Rhode Island, It's for Me,\" adopted in 1996."
  - question: Who wrote Rhode Island's state song?
    answer: "Charlie Hall wrote the lyrics, and Maria Day composed the music with an arrangement by Kathryn Chester."
  - question: When did Rhode Island adopt "Rhode Island, It's for Me" as its state song?
    answer: "The General Assembly adopted the song in 1996."
  - question: Does Rhode Island have more than one official song?
    answer: "Yes. Rhode Island also recognizes \"Rhode Island\" as its official state march, the song its current state song replaced."

