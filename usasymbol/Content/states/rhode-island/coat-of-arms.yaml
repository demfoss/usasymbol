hero_image_alt: Official Coat of Arms of the State of Rhode Island, showing a golden anchor on a blue field with the word Hope
hero_image_caption: The Rhode Island Coat of Arms, formally adopted in 1881. A golden anchor on blue with the motto "Hope," the same emblem first placed on the colonial seal in 1647.
intro_text: "The Rhode Island coat of arms shows a golden anchor on a blue field and the single word Hope. The General Assembly formally adopted the design in 1881, making official an emblem the colony had carried since 1647."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Rhode Island Coat of Arms?
  paragraphs:
  - "The design is one of the simplest state coats of arms in the country. There are no supporters, no crest, and no elaborately quartered shield. The law captures the entire design in a single sentence, making it one of the most concise official heraldic descriptions in the United States."
  - "The coat of arms appears on state documents, official buildings, and governmental seals. It shares its main symbols with the state seal and the state flag, both of which also center on the anchor and the word Hope."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Rhode Island Coat of Arms
  paragraphs:
  - "Rhode Island's use of the anchor goes back to 1647, just eleven years after Roger Williams founded the colony. That year, William Dyer, the colony's secretary, wrote the resolution that the colonial seal would be an anchor. The word Hope appeared alongside it in 1664, when King Charles II granted the colony its Royal Charter and the colonists updated their seal."
  - "The anchor and Hope passed from the colonial seal into the state seal after independence, and from the state seal into everyday use on government documents and buildings. For more than two centuries the emblem was in continuous use without a formal heraldic coat of arms to define it."
  - "The Rhode Island General Assembly formally adopted the coat of arms in 1881, effective February 1, 1882. The adoption codified in law what had been the state's working emblem for over two hundred years. No specific designer is credited in the legislation."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Rhode Island Coat of Arms
  paragraphs:
  - "The coat of arms has two elements: a golden anchor and the word Hope. Each has a documented meaning."
  elements:
  - id: anchor
    name: The Golden Anchor
    image: /images/coats-of-arms/rhode-island/elements/anchor.webp
    paragraphs:
    - "The anchor is gold and set against a plain blue field. It is drawn in a traditional heraldic style, upright with its ring at the top and its flukes at the bottom. No additional figures, supporters, or decorations appear on the shield."
    - "The anchor was chosen in 1647 as a reference to Hebrews 6:18–19, a biblical passage that calls hope 'an anchor of the soul, firm and secure.' Rhode Island was founded by Roger Williams as a colony with freedom of conscience, and the founders chose an image with a direct spiritual meaning."
  - id: motto
    name: Hope
    image: /images/coats-of-arms/rhode-island/elements/motto.webp
    paragraphs:
    - "The motto is a single word: Hope. It appears on the coat of arms as part of the official legal description and is displayed with the anchor on all official uses of the emblem."
    - "Hope was added to the colonial seal in 1664 when the Royal Charter arrived from England. The word reinforces the anchor's meaning and completes the reference to the biblical passage the founders had in mind. Hope is also the official state motto."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Rhode Island Coat of Arms
  paragraphs:
  - "The anchor and Hope work as a single idea, not two separate symbols. The image and the word are taken together from Hebrews 6:18–19, in which hope is described as 'an anchor of the soul, firm and secure.' Rhode Island's founders in 1647 chose that pairing deliberately."
  - "The simplicity of the design is part of its character. Rhode Island was the smallest colony, founded on principles of religious freedom and individual conscience. A single anchor on an open blue field, with no crowded quartering or heraldic supporters, fits the directness of those founding principles."
  - "The blue field also connects to the sea. Rhode Island is a coastal state, and its earliest economy depended on the water. The anchor ties spiritual meaning to a practical reality of life in the colony."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Rhode Island Coat of Arms Facts
  facts:
  - "Adopted: By the Rhode Island General Assembly in 1881, effective February 1, 1882."
  - "First use of the anchor: 1647, when colonial secretary William Dyer wrote the resolution establishing it as the colony's seal emblem."
  - "The motto Hope was added in 1664 following King Charles II's Royal Charter."
  - "The official legal description is one sentence: 'The arms of the state are a golden anchor on a blue field, and the motto thereof is the word Hope.'"
  - "The coat of arms has no crest, no supporters, and no quartered shield. It is one of the simplest state coats of arms in the United States."
  - "Hope is also the official Rhode Island state motto, sharing its origin with the coat of arms."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Rhode Island Coat of Arms
  paragraphs:
  - "No earlier coat of arms predates the 1881 adoption. Before that date, the anchor and Hope appeared on the state seal, which was itself descended from the colonial seal first established in 1647."
  - "The colonial seal created by William Dyer in 1647 is the earliest documented use of the anchor emblem. When the state adopted its coat of arms in 1881, it drew directly from that two-hundred-year tradition rather than creating a new design."
  versions:
  - name: Colonial Seal
    years: 1647
    image: /images/coats-of-arms/rhode-island/versions/colonial-seal.svg
    description: The colonial seal established in 1647, showing the anchor that would become the foundation of the state coat of arms. William Dyer wrote the resolution adopting it. This was a seal, not a formal coat of arms, but it is the direct ancestor of the 1881 design.
  - name: Official Standard
    years: 1881-present
    image: /images/coats-of-arms/rhode-island/versions/current-standard.svg
    description: The official Rhode Island coat of arms adopted by the General Assembly in 1881, effective February 1, 1882. A golden anchor on blue with the motto Hope. This is the standard rendering used in official state documents and in this article.

faq:
- question: What does the Rhode Island coat of arms show?
  answer: "The Rhode Island coat of arms shows a golden anchor on a blue field and the word Hope. That is the complete design: no crest, no supporters, and no divided shield."
- question: What does the anchor mean on the Rhode Island coat of arms?
  answer: "The anchor represents hope, drawn from a passage in Hebrews 6:18–19 that calls hope 'an anchor of the soul, firm and secure.' Rhode Island's colonial founders chose the image in 1647."
- question: When was the Rhode Island coat of arms adopted?
  answer: "The General Assembly formally adopted it in 1881, effective February 1, 1882. The anchor itself had been in use on the colonial seal since 1647, but it had no formal coat-of-arms status until 1881."
- question: What does Hope mean on the Rhode Island coat of arms?
  answer: "Hope is the state motto and completes the anchor's meaning. Together, anchor and Hope reference Hebrews 6:18–19, which describes hope as 'an anchor of the soul.' The word was added to the colonial seal in 1664 with the arrival of the Royal Charter."
- question: Who designed the Rhode Island coat of arms?
  answer: "The 1647 resolution adopting the anchor was written by William Dyer, the colonial secretary. No specific designer is credited in the 1881 legislation that formally established the coat of arms."
- question: How is the Rhode Island coat of arms different from the state seal?
  answer: "Both use the same anchor and Hope motto. The seal is a circular impression used to authenticate official documents. The coat of arms is a shield-based heraldic emblem used on flags, buildings, and official displays. The seal reads 'Seal of the State of Rhode Island' around the border; the coat of arms has no such border text."

