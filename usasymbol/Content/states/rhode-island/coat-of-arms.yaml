meaning: "The Rhode Island coat of arms pairs a single image with a single word: a golden anchor and the motto Hope. Both trace to a biblical passage in which hope is called an anchor of the soul. Rhode Island's founders chose that pairing in 1647, and the state has carried it forward without change."
