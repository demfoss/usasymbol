seo_title: "Rhode Island State Motto | Hope"
seo_description: "Rhode Island's state motto is \"Hope.\" One word and one of the shortest in the country, it appears above a gold anchor on the state seal, in use since the colonial era."

intro_text: "Rhode Island's state motto is <strong>Hope</strong>, one word and one of the shortest state mottos in the United States. It has appeared above a gold anchor on the state seal since the colonial era, a pairing tied to the Biblical image in Hebrews 6:19 of hope as an anchor for the soul."

