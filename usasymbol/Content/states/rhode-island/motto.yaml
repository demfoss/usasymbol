sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Rhode Island State Motto"
    paragraphs:
      - "Rhode Island's state motto is <strong>Hope</strong>, a single English word that has appeared on the state seal since the colonial period. It sits above a gold anchor on a blue field, the two central symbols of Rhode Island's official identity."
      - "At one word, Hope is one of the shortest state mottos in the country. The anchor and Hope together have remained unchanged through every version of the state seal, from the 1647 colonial patent through the current 2022 design."

  - id: meaning
    icon: "fa-solid fa-language"
    title: "Rhode Island State Motto Meaning"
    paragraphs:
      - "The word Hope pairs with the anchor as a Biblical reference. Hebrews 6:19 describes hope as an anchor for the soul, and that image gave Rhode Island's maritime anchor symbol a religious dimension alongside its geographic one."
      - "Rhode Island was founded by Roger Williams in 1636 as a colony built on the principle of religious freedom. The word Hope fit the colony's identity on two levels: it reflected the literal anchor that stood for Rhode Island's coastal economy, and it expressed the religious ideal Williams carried into the founding."
      - "As a civic motto, Hope is also deliberately open. It points forward without claiming a specific achievement, which has allowed it to remain meaningful across nearly four centuries of the state's history."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Rhode Island's State Motto"
    paragraphs:
      - "Rhode Island's anchor and Hope motto trace to the colonial period. Providence Plantations received a parliamentary patent in 1647, and the anchor with the motto Hope was used in official symbolism from that era. The colony's maritime geography on Narragansett Bay made the anchor a natural choice, and the Biblical pairing gave it a second layer of meaning."
      - "The anchor and Hope remained on the seal through American independence and statehood. Rhode Island ratified the U.S. Constitution on May 29, 1790, the last of the original 13 states to do so. Earlier seal renderings often used 13 stars to mark that fact, but Hope stayed constant in every version."
      - "Rhode Island standardized its state seal in statute in 1875, cementing the anchor and Hope in law. The most recent change came in 2022, when the seal wording was updated to reflect the shorter state name approved by voters in 2020, removing Providence Plantations from the official text. The motto Hope was not changed."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Hope\" on the Rhode Island State Seal"
    paragraphs:
      - "The motto appears on the current state seal above a gold anchor on a blue field. The full seal reads Seal of the State of Rhode Island around the outside, with the date 1636 at the bottom marking Roger Williams's founding of Providence."
      - "The state seal is used on official government documents, state letterhead, and state buildings. Hope has appeared in that position on every version of the seal from the colonial patent through the current design."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Rhode Island State Motto Facts"
    style: "gradient"
    facts:
      - "Rhode Island's state motto is \"Hope\" — one English word."
      - "At one word, it is one of the shortest state mottos in the United States."
      - "The anchor and Hope pairing has been associated with Rhode Island since the 1647 colonial patent."
      - "The motto connects to Hebrews 6:19, which describes hope as an anchor for the soul."
      - "Roger Williams founded Providence in 1636, establishing the religious freedom principles behind the motto."
      - "Rhode Island was the last of the original 13 states to ratify the U.S. Constitution, on May 29, 1790."

