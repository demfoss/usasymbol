faq:
  - question: "What is Rhode Island's state motto?"
    answer: "Rhode Island's state motto is \"Hope,\" one English word. It appears above a gold anchor on the state seal and has been associated with Rhode Island since the colonial era."

  - question: "What does \"Hope\" mean as a state motto?"
    answer: "The motto connects to Hebrews 6:19, which describes hope as an anchor for the soul. The anchor and Hope work together as both a maritime symbol and a religious one. Rhode Island was founded on the principle of religious freedom, and Hope expressed that founding ideal."

  - question: "Where does Rhode Island's motto appear?"
    answer: "Hope appears above the gold anchor on the Rhode Island state seal. The seal is used on official government documents, state letterhead, and state buildings. It has appeared in that position on every version of the seal since the colonial era."

