intro_text: "Rhode Island's state mineral is bowenite, adopted in 1966 to recognize a hard, waxy serpentine first identified in the state's Lime Rock area and long used as a jade substitute in carving. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Rhode Island State Mineral
    paragraphs:
      - "Bowenite is Rhode Island's official state mineral, adopted by the Rhode Island General Assembly in 1966. It is a hard, waxy variety of serpentine that can look enough like jade to be used as a substitute in carvings and jewelry."
      - "Rhode Island chose it because the mineral was first identified and named within the state, giving Rhode Island a direct claim to a material most people associate with jade from elsewhere."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Bowenite?"
    paragraphs:
      - "Bowenite is a compact, fine-grained variety of the serpentine mineral antigorite, with a smooth, waxy surface that takes a good polish. It ranges from pale yellow and gray to light and dark green or blue, and its density and hardness let it pass for true jade in carved objects."
      - "Bowenite forms within serpentine rock bodies associated with limestone deposits, a metamorphic setting where magnesium-rich rock has been altered by heat, pressure, and fluid over long periods. Rhode Island's deposits sit in the northern part of the state, in Providence County."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Rhode Island Chose Bowenite as Its State Mineral"
    paragraphs:
      - "The mineral was first described in the early 1800s by Rhode Island geologist George Bowen, who studied material from the northern part of the state and gave the stone his name. That local discovery tied Rhode Island directly to a mineral's identity, not just its occurrence."
      - "Its resemblance to jade also made it locally prized for carving, adding a practical, decorative use to the scientific interest in the stone. Lawmakers recognized both the discovery and the material's identity when they adopted bowenite as the state mineral in 1966."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Bowenite Became Rhode Island's State Mineral"
    paragraphs:
      - "The Rhode Island General Assembly approved a resolution naming bowenite the official state mineral in 1966, the same year lawmakers named cumberlandite the state rock."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Bowenite Is Found in Rhode Island"
    paragraphs:
      - "Bowenite occurs in the Lime Rock area of Lincoln, in northern Rhode Island, where it was first identified in rock associated with local limestone quarries. Specimens from the old quarries near Lime Rock remain the material's best-documented source in the state."
    sites:
      - name: Lime Rock
        city: Lincoln
        lat: 41.9257
        lng: -71.4409
        note: "Historic source area for Rhode Island bowenite"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Bowenite Facts"
    facts:
      - "Adopted as Rhode Island's state mineral in 1966."
      - "Named for Rhode Island geologist George Bowen, who first described the mineral in the early 1800s."
      - "Bowenite is a variety of serpentine, not true jade, though it is often used in its place for carving."
      - "Rhode Island named its state rock, cumberlandite, in the same 1966 resolution."

