faq:
  - question: What is Rhode Island's state mineral?
    answer: "Rhode Island's state mineral is bowenite, a waxy, jade-like variety of serpentine adopted in 1966."
  - question: When did Rhode Island adopt bowenite as its state mineral?
    answer: "The Rhode Island General Assembly designated bowenite the official state mineral in 1966."
  - question: Why did Rhode Island choose bowenite?
    answer: "Bowenite was first identified and named in the state by geologist George Bowen, giving Rhode Island a direct claim to the mineral's discovery."
  - question: Is bowenite the same as jade?
    answer: "No. Bowenite is a variety of serpentine, a different mineral from true jade, but its hardness and waxy polish let it pass as a jade substitute in carving."

