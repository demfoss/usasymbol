faq:
  - question: "What is Rhode Island's state marine mammal?"
    answer: "Rhode Island's state marine mammal is the harbor seal (Phoca vitulina), designated on June 30, 2016, through Chapter 129. The designation recognized the species' presence along Rhode Island's extensive 400-mile coastline and its recovery from historical bounty hunting. Harbor seals represent the Ocean State's maritime heritage and identity as the state with the longest coastline per square mile."
  
  - question: "When was the harbor seal designated as Rhode Island's state marine mammal?"
    answer: "The harbor seal became Rhode Island's official state marine mammal in 2016. The designation acknowledged Rhode Island's Ocean State nickname and the species' visibility from shore at locations throughout the state's extensive coastline. Conservation groups and educators advocated for a state marine mammal to represent Rhode Island's maritime character."
  
  - question: "Why did Rhode Island choose the harbor seal?"
    answer: "Rhode Island chose the harbor seal because it embodied the Ocean State identity. Despite being the smallest state by area, Rhode Island possesses approximately 400 miles of coastline—the highest coastline-to-area ratio of any state. Harbor seals inhabit these waters year-round and haul out on rocks visible from shore. The species also represented conservation success, recovering from bounty hunting to healthy populations after federal protection in 1972."
  
  - question: "Where can I see harbor seals in Rhode Island?"
    answer: "Harbor seals appear at multiple Rhode Island locations, with best viewing during winter months at low tide. Sachuest Point National Wildlife Refuge in Middletown offers premier viewing from observation platforms. Point Judith breakwater, Block Island's North Light area, and various Newport harbor locations also host seals. Federal law requires maintaining 150-foot distance from seals. Never approach, touch, or feed marine mammals."
  
  - question: "When is the best time to see harbor seals in Rhode Island?"
    answer: "Best harbor seal viewing occurs December through April during low tide when seals haul out on exposed rocks. Winter months bring highest numbers as northern seal populations migrate south to Rhode Island waters. Low tide exposes rocks and beaches where seals rest, while high tide forces them into water where they're less visible. Check tide charts and visit haul-out locations 1-2 hours before and after low tide."
  
  - question: "Were harbor seals always protected in Rhode Island?"
    answer: "No, harbor seals faced systematic hunting through the mid-1900s. Rhode Island participated in bounty programs paying hunters for killing seals, which fishermen viewed as competitors for fish. Massachusetts and Maine paid bounties into the 1960s. The federal Marine Mammal Protection Act of 1972 ended bounty hunting by prohibiting killing or harassing marine mammals. This protection allowed dramatic population recovery throughout New England including Rhode Island."
  
  - question: "How many harbor seals live in Rhode Island?"
    answer: "Rhode Island's harbor seal population fluctuates seasonally. Several hundred seals winter in Rhode Island waters during peak season (December-April), with smaller numbers present year-round. Exact counts prove difficult because seals move between multiple haul-out sites and spend time at sea. Regional New England harbor seal populations exceed 75,000, with Rhode Island supporting a portion of this population."
  
  - question: "What do harbor seals eat in Rhode Island waters?"
    answer: "Harbor seals in Rhode Island prey on various fish species including winter flounder, herring, menhaden, hake, and occasionally striped bass. They dive to depths exceeding 300 feet pursuing prey and can remain submerged over 20 minutes. Seals consume approximately 5-6% of their body weight daily, adjusting diet based on seasonal fish availability in coastal waters and Narragansett Bay."
  
  - question: "What should I do if I see a seal on the beach?"
    answer: "Maintain at least 150 feet distance from any seal, as federal Marine Mammal Protection Act requires. Hauled-out seals often appear sick but simply rest, thermoregulate, or molt. Never approach, touch, or feed seals. Keep pets away from seals. If the seal appears truly injured (bleeding, obvious wounds, entanglement), call NOAA's Marine Mammal Stranding Hotline (866-755-6622) or contact local authorities. Do not attempt rescue yourself."

