seo_description: "Learn the legal history of Rhode Island's flag, the meaning of its core emblems, and the official color notes used for Rhode Island."

intro_text: "Rhode Island adopted its current state flag on November 1, 1897, displaying a gold anchor surrounded by thirteen gold stars on a white field and listed in the [U.S. state flags collection](/symbols/flags). A blue ribbon beneath the anchor bears the motto Hope. The design traces back to Rhode Island's seal from the 1640s."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Rhode Island State Flag Is Designed"
    paragraphs:
      - "The Rhode Island state flag is the official state flag of the state of Rhode Island. A white field holds a gold anchor at the center. Thirteen gold five-pointed stars circle the anchor."
      - "A blue ribbon sits below the anchor. The word Hope appears in gold letters on the ribbon. Three edges of the flag are edged with golden fringe except the hoist. The flag is nearly square at four feet ten inches by five feet six inches."
      - "Rhode Island adopted the current design on November 1, 1897. The General Assembly passed legislation during the January session of 1897. This version returned to a white field after an earlier blue design."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Rhode Island Flag Communicates"
    paragraphs:
      - "The Rhode Island state flag meaning connects to the state's colonial history and founding principles. The anchor and Hope motto appeared on Rhode Island's seal as early as the 1640s and connect directly with [Rhode Island's state motto](/states/rhode-island/motto/hope)."
      - "The anchor represents hope and maritime commerce. Howard Chapin of the Rhode Island Historical Society traced the motto to a biblical verse. Hebrews 6:18-19 reads Hope we have as an anchor of the soul. Rhode Island's earliest colonists fled religious persecution in Massachusetts, a history reflected in [the Ocean State nickname](/states/rhode-island/nickname/the-ocean-state)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Rhode Island Flag History and Adoption"
    paragraphs:
      - "Rhode Island adopted its first official state flag on March 30, 1877. The flag featured a white background with a red shield at the center. A blue anchor appeared on the shield with the word Hope inscribed on it. Thirty-eight blue stars encircled the shield. The design matched the white facings on state militia uniforms."
      - "The state adopted a second flag on February 1, 1882. This version changed to a blue field. Thirteen gold stars encircled a gold anchor. The number of stars dropped from thirty-eight to thirteen representing the original colonies. Rhode Island was the thirteenth state to ratify the Constitution."
      - "The Rhode Island General Assembly adopted the current flag on November 1, 1897. Legislation passed during the January session of 1897. The design returned to a white field. The Hope motto reappeared on a blue ribbon below the anchor. The thirteen gold stars remained in a circle around the anchor."
      - "The flag statute specifies precise measurements. The anchor stands twenty-two inches high. The blue ribbon measures twenty-four inches long and five inches wide. The pike must be nine feet tall with a spearhead on top."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Rhode Island Flag"
    versions:
      - name: "State Flag"
        years: "1877–1882"
        image: "versions/rhode-island-1877.webp"
        description: "A white field with a red shield containing a blue anchor and the word Hope. Thirty-eight or thirty-nine blue stars surrounded the shield."

      - name: "State Flag"
        years: "1882–1897"
        image: "versions/rhode-island-1882.webp"
        description: "A blue field with a gold anchor surrounded by thirteen gold stars representing the original colonies."

      - name: "Modern State Flag"
        years: "1897–present"
