        description: "A white field with a gold anchor, thirteen gold stars, and a blue ribbon bearing the motto Hope."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Rhode Island Flag"
    symbols:
      - id: anchor
        name: "Rhode Island State Flag Anchor"
        image: "symbols/anchor.svg"
        paragraphs:
          - "A gold anchor stands at the center of the flag. The anchor measures twenty-two inches high according to statute. It represents hope and maritime heritage."
          - "The anchor appeared on Rhode Island's seal as early as the 1640s. It connects to the biblical phrase about hope as an anchor of the soul. Rhode Island's economy depended heavily on maritime commerce."

      - id: stars
        name: "Rhode Island State Flag Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Thirteen gold five-pointed stars form a circle around the anchor. The stars represent the original thirteen colonies. Rhode Island was the thirteenth state to ratify the United States Constitution."
          - "Earlier flag versions used different numbers of stars. The 1877 design showed thirty-eight or thirty-nine stars representing all states in the Union at that time. The number changed to thirteen in 1882."

      - id: motto
        name: "Rhode Island State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "A blue ribbon beneath the anchor displays the state motto Hope in gold letters. The ribbon measures twenty-four inches long and five inches wide. Hope has served as Rhode Island's motto since colonial times."
          - "The motto traces to Hebrews 6:18-19 which mentions hope as an anchor of the soul. Rhode Island's founders fled religious persecution seeking hope for a better life."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Rhode Island State Flag Colors"
    paragraphs:
      - "The Rhode Island state flag uses white, gold, and blue. Rhode Island is one of the few states with a white field. Rhode Island statute does not provide Cable or Pantone values for the flag colors, so practical references usually follow [Rhode Island's color guide](/states/rhode-island/color/blue-white-and-gold)."
      - "White forms the background field. Gold appears on the anchor, stars, motto lettering, and fringe. Blue colors the ribbon beneath the anchor, and this maritime symbolism aligns with geography in [States That Border Rhode Island](/states/rhode-island/borders)."
    colors:
      - name: "White"
        hex: "#ffffff"
      - name: "Gold"
        hex: "#fec500"
      - name: "Blue"
        hex: "#003271"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Rhode Island State Flag Facts"
    facts:
      - "Rhode Island formalized the white flag with anchor and Hope ribbon on November 1, 1897"
      - "The flag is nearly square with dimensions of 4 feet 10 inches by 5 feet 6 inches"
      - "Thirteen gold stars represent Rhode Island as the thirteenth colony"
      - "The anchor and Hope motto appeared on Rhode Island's seal by the 1640s"
      - "The flag features golden fringe on three edges"
      - "Rhode Island adopted two earlier flag versions in 1877 and 1882"

faq:
  - question: "What design is recognized as the state flag of Rhode Island?"
    answer: "The state flag of Rhode Island is the official banner of Rhode Island, featuring a gold anchor surrounded by thirteen gold stars on a white field with the motto Hope on a blue ribbon."

  - question: "What does Rhode Island's flag look like?"
    answer: "The flag shows a white field with a gold anchor at the center. Thirteen gold stars form a circle around the anchor. A blue ribbon below the anchor bears the word Hope in gold letters."

  - question: "What meaning is attached to Rhode Island's flag?"
    answer: "The flag represents hope and Rhode Island's maritime heritage. The anchor symbolizes hope based on a biblical verse. The thirteen stars represent the original colonies and Rhode Island as the thirteenth state."

  - question: "How do historians explain the symbolism of Rhode Island's flag?"
    answer: "The flag means hope for Rhode Island's citizens. The anchor connects to Hebrews 6:18-19 about hope as an anchor of the soul. The design honors the state's colonial founders who fled religious persecution."

  - question: "What symbols appear on the Rhode Island state flag?"
    answer: "A gold anchor appears on the Rhode Island state flag, surrounded by thirteen gold stars."

  - question: "Which emblems or icons are shown on Rhode Island's flag?"
    answer: "Thirteen stars appear on the Rhode Island state flag."

  - question: "When was the present Rhode Island flag approved in law?"
    answer: "Rhode Island adopted its current state flag on November 1, 1897."

