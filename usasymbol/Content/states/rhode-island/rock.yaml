faq:
  - question: What is Rhode Island's state rock?
    answer: "Rhode Island's state rock is cumberlandite, a dense, magnetic igneous rock adopted in 1966."
  - question: When did Rhode Island adopt cumberlandite as its state rock?
    answer: "The Rhode Island General Assembly designated cumberlandite the official state rock in 1966."
  - question: Why did Rhode Island choose cumberlandite?
    answer: "Cumberlandite occurs naturally at only one site in Rhode Island and one other location on Earth, in Sweden, making it an exceptionally rare rock to call a state symbol."
  - question: Where can you find cumberlandite in Rhode Island?
    answer: "All of it traces back to Iron Mine Hill in Cumberland, though glaciers scattered loose fragments as far south as Block Island."

