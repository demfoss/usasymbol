intro_text: "Rhode Island's state rock is cumberlandite, adopted in 1966 to recognize a dense, magnetic igneous rock native to a single four-acre site in Cumberland and known from just one other place on Earth. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Rhode Island State Rock
    paragraphs:
      - "Cumberlandite is Rhode Island's official state rock, adopted by the Rhode Island General Assembly in 1966. It is a heavy, magnetic igneous rock estimated at 1 to 1.5 billion years old, native to a small site at Iron Mine Hill in the town of Cumberland."
      - "Rhode Island chose it because the rock is documented at only one other location on the planet, giving the state one of the most genuinely rare official rock symbols in the country."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Cumberlandite?"
    paragraphs:
      - "Cumberlandite is a dense, dark igneous rock, heavy black to brown in color, marked with lighter white patches of feldspar running through it. It contains enough iron oxide to attract a magnet, a trait unusual enough that a compass held near a large piece will visibly deflect."
      - "Cumberlandite formed as magma rich in iron and titanium cooled and crystallized far below the surface. Glaciers later broke up and scattered loose pieces of the parent rock body across southern New England."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Rhode Island Chose Cumberlandite as Its State Rock"
    paragraphs:
      - "Cumberlandite's parent rock body sits within a single four-acre outcrop at Iron Mine Hill, Cumberland, and is known to occur naturally in only one other place in the world, at Taberg, Sweden. Few state rocks anywhere carry that degree of genuine rarity."
      - "Rhode Island's small size makes the distinction fitting: a rock this uncommon, tied to one named hill in one town, gave the state a symbol that could not be claimed by any other."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Cumberlandite Became Rhode Island's State Rock"
    paragraphs:
      - "The Rhode Island General Assembly approved a resolution naming cumberlandite the official state rock in 1966, the same year bowenite was named the state mineral."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Cumberlandite Is Found in Rhode Island"
    paragraphs:
      - "All cumberlandite traces back to a roughly four-acre outcrop at Iron Mine Hill in Cumberland, once mined for its iron content. Glaciers later carried loose fragments south in a boulder train that reaches as far as Block Island, so smaller pieces can still turn up well outside Cumberland."
    sites:
      - name: Iron Mine Hill
        city: Cumberland
        lat: 41.9773
        lng: -71.4356
        note: "Only known Rhode Island source of cumberlandite"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Cumberlandite Facts"
    facts:
      - "Adopted as Rhode Island's state rock in 1966."
      - "Cumberlandite is known to occur naturally in only two places in the world: Cumberland, Rhode Island, and Taberg, Sweden."
      - "The rock's iron content makes it magnetic enough to noticeably deflect a compass needle."
      - "Glacial movement scattered loose cumberlandite boulders as far south as Block Island."

