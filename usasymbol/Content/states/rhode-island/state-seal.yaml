timeline:
- year: '1636'
  description: Roger Williams founds Providence after leaving Massachusetts Bay Colony. The date later becomes the one shown on Rhode Island's current seal.
- year: '1647'
  description: Providence Plantations receives a parliamentary patent and uses anchor symbolism in its official identity.
- year: '1790'
  description: Rhode Island ratifies the U.S. Constitution on May 29, last among the original 13 states. Earlier seal renderings often used 13 stars to mark that fact.
- year: '1875'
  description: Rhode Island standardizes a long-used state seal form in statute, including anchor imagery and the Hope motto.
- year: '2020'
  description: Voters approve a constitutional amendment removing Providence Plantations from the state's official name.
- year: '2022'
  description: Official state use adopts the updated seal wording State of Rhode Island, with 1636 shown at the bottom.

faq:
- question: What does the Rhode Island state seal show?
  answer: Rhode Island's current seal shows a gold anchor on a blue field beneath the word Hope, surrounded by the words Seal of the State of Rhode Island and the date 1636.
- question: Why is there an anchor on the Rhode Island seal?
  answer: The anchor reflects Rhode Island's maritime geography and colonial economy, which were built around Narragansett Bay, coastal trade, and Atlantic shipping. It also connects to the Biblical image of hope as an anchor for the soul.
- question: What does Hope mean on the Rhode Island seal?
  answer: Hope is Rhode Island's state motto. It comes from Hebrews 6:19 and links the seal's maritime anchor to the colony's religious and moral founding ideals.
- question: Why does the seal say 1636?
  answer: The current seal uses 1636 to mark the founding of Providence by Roger Williams. That date is now emphasized more than the older 1647 colonial-patent reference often discussed in historical accounts.
- question: Did Rhode Island change its state seal recently?
  answer: Yes. The core symbols stayed the same, but the wording changed after Rhode Island voters approved removal of Providence Plantations from the official state name in 2020. Current official seal use reflects that shorter name.
- question: What happened to the older 13-star seal?
  answer: Earlier Rhode Island state seal renderings commonly used 13 stars to reference Rhode Island as the last of the original states to ratify the Constitution in 1790. That historical layer is still part of the seal's story, but the current official seal emphasizes the anchor, Hope, state name, and 1636 date instead.

