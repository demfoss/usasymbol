meaning: "Rhode Island's state seal centers on a gold anchor and the motto Hope, a pairing that works on two levels at once. The anchor reflects the state's maritime geography on Narragansett Bay and the Atlantic coast, while the Biblical phrase from Hebrews 6:19, which calls hope an anchor for the soul, gives the image its religious meaning. The current seal also bears the date 1636, marking Roger Williams's founding of Providence, and uses the shortened state name adopted after the 2021 referendum."
