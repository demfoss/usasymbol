sections:
- id: history
  icon: fa-solid fa-landmark
  title: Rhode Island State Seal History and Origin
  paragraphs:
  - "Rhode Island's anchor symbol dates to the colonial period. Providence Plantations used the anchor and the motto Hope long before American independence, drawing on both the colony's maritime economy and the Biblical line in Hebrews 6:19 describing hope as an anchor for the soul."
  - "For much of state history, the seal used the longer name State of Rhode Island and Providence Plantations. That wording reflected the colonial charter tradition, but it became controversial in the twenty-first century because of the term plantations. In November 2020, Rhode Island voters approved a constitutional amendment removing Providence Plantations from the official state name."
  - "The current seal reflects that change. By 2022, official state use had shifted to Seal of the State of Rhode Island with the date 1636. The date points to Roger Williams's founding of Providence rather than the 1647 parliamentary patent that had defined earlier seal history."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Rhode Island State Seal Symbols Mean
  paragraphs:
  - "Rhode Island's current seal relies on only three main elements, and each one carries a large share of the meaning."
  elements:
  - id: anchor
    name: Gold Anchor
    image: /images/state-seals/rhode-island/elements/anchor.webp
    paragraphs:
    - "A gold anchor on a blue field is the central and dominant image of the seal. It reflects Rhode Island's maritime geography and the colonial economy built around Narragansett Bay, coastal trade, and Atlantic shipping."
    - "The anchor had been associated with Rhode Island since the seventeenth century. Its continued use gives the current seal a direct line back to the colony's earliest official symbolism."
  - id: hope-motto
    name: Hope
    image: /images/state-seals/rhode-island/elements/motto.webp
    paragraphs:
    - "The word Hope appears above the anchor on a small scroll. It is one of the shortest state mottos in the United States and one of the oldest in continuous use."
    - "Hope connects directly to Hebrews 6:19, which describes hope as an anchor for the soul. The motto preserves the religious language of Rhode Island's founding era while functioning as a broad civic ideal."
  - id: stars
    name: Gold Stars and Border Beads
    image: /images/state-seals/rhode-island/elements/stars.webp
    paragraphs:
    - "The current seal no longer centers its meaning on the older ring of 13 stars that appeared in many earlier renderings. Instead, the modern official design emphasizes the beaded border and the surrounding inscription with 1636 at the bottom."
    - "Earlier Rhode Island seals often used 13 stars to reference Rhode Island as the last of the original colonies to ratify the Constitution in 1790. That older historical layer is still important, but it is no longer the dominant visual feature of the present official seal."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Rhode Island State Seal'
  paragraphs:
  - "Rhode Island's seal has changed less in symbol than in wording and styling. The anchor and Hope remained constant, while the surrounding text, date, and border treatment changed across the colonial, pre-2022, and current versions."
  versions:
  - name: Colonial Seal
    years: 18th century colonial use
    image: /images/state-seals/rhode-island/versions/seal-of-the-colony-of-rhode-island-and-providence-plantations.svg
    description: A colonial Rhode Island seal showing the early anchor tradition under the name Colony of Rhode Island and Providence Plantations. This version preserves the older political identity of the colony before American statehood.
  - name: Pre-2022 State Seal
    years: before 2022
    image: /images/state-seals/rhode-island/versions/seal-of-rhode-island-pre-2022.svg
    description: The modern state seal as used before the official name change took effect. It retained the wording State of Rhode Island and Providence Plantations and represented the pre-referendum form of the seal.
  - name: Current State Seal
    years: 2022–present
    image: /images/state-seals/rhode-island/versions/seal-of-rhode-island.svg
    description: The current official seal of Rhode Island. It uses the shorter state name and the date 1636, while preserving the long-standing anchor and Hope symbolism.

