sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Rhode Island?
  paragraphs:
  - "The American burying beetle, Nicrophorus americanus, is Rhode Island's official state insect. State lawmakers designated it in 2015."
  - "It is one of the largest carrion beetles in North America and is also a critically endangered species."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the American Burying Beetle
  paragraphs:
  - "The American burying beetle has a shiny black body with bright orange-red markings on its wing covers, its thorax, and the tips of its antennae."
  - "Adults grow to about 1 to 1.5 inches long, making them among the biggest carrion beetles in North America."
  - "Both parents help bury small dead animals underground and then feed and care for their larvae together, which is unusual behavior for a beetle."

- id: history
  icon: fa-solid fa-landmark
  title: How Rhode Island Chose the American Burying Beetle
  paragraphs:
  - "The Rhode Island General Assembly named the American burying beetle the official state insect in 2015."
  - "Official sources confirm the designation and its year but do not give a detailed account of the selection process."

- id: reason
  icon: fa-solid fa-circle-question
  title: Why Rhode Island Chose the American Burying Beetle
  paragraphs:
  - "The American burying beetle has disappeared from most of its historic range across the eastern United States and is now a critically endangered species."
  - "Rhode Island is one of the few states where the beetle still survives, thanks to a long-running reintroduction program, and naming it the state insect helps draw attention to that conservation work."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the American Burying Beetle in Rhode Island
  paragraphs:
  - "In Rhode Island, the American burying beetle lives on Block Island, where a reintroduced population has been established and monitored for years."
  - "The species once ranged across much of the eastern United States but is now found in only a handful of scattered locations."

- id: facts
  icon: fa-solid fa-lightbulb
  title: American Burying Beetle Facts
  facts:
  - "Adopted in 2015 by the Rhode Island General Assembly."
  - "Scientific name: Nicrophorus americanus."
  - "Shiny black body with orange-red markings on its wing covers, thorax, and antennae tips."
  - "One of the largest carrion beetles in North America, growing to about 1 to 1.5 inches long."
  - "A critically endangered species, with Rhode Island's Block Island population kept alive through reintroduction efforts."




