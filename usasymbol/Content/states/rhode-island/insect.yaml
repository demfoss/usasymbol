faq:
- question: What is Rhode Island's state insect?
  answer: "Rhode Island's state insect is the American burying beetle, adopted by the Rhode Island General Assembly in 2015."
- question: When did Rhode Island adopt the American burying beetle?
  answer: "Rhode Island adopted the American burying beetle as its official state insect in 2015."
- question: Why did Rhode Island choose the American burying beetle?
  answer: "The beetle is critically endangered and survives in Rhode Island only through a reintroduction program on Block Island, so naming it state insect highlights that conservation effort."
- question: What does the American burying beetle look like?
  answer: "It has a shiny black body with orange-red markings on its wing covers and thorax, orange-tipped antennae, and grows to about 1 to 1.5 inches long."
- question: Where is the American burying beetle found in Rhode Island?
  answer: "It lives on Block Island, where a reintroduced population has been established and monitored for years."
- question: Is the American burying beetle endangered?
  answer: "Yes. It is a critically endangered species that has disappeared from most of its historic range in the eastern United States."

