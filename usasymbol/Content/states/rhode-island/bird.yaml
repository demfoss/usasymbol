title: Rhode Island Red
scientific_name: Gallus gallus domesticus
adopted_year: 1954
legislation: R.I. Gen. Laws Sec. 42-4-5
meaning: Rhode Island did not choose a wild species. In 1954 it chose the Rhode Island Red, a breed of domestic fowl developed around Little Compton and already carrying the state's name. That makes the symbol less a nature emblem than a statement about what Rhode Island believed it had created, improved, and sent outward into the world.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: '2026-03-28'
seo_title: 'Rhode Island State Bird: Rhode Island Red'
seo_description: Rhode Island adopted the Rhode Island Red in 1954. The key point is that the state chose a homegrown chicken breed, not a wild bird, making the symbol a statement about Rhode Island agriculture and identity.
intro_text: Rhode Island's official state bird is the <strong>Rhode Island Red</strong>, adopted on <strong>May 3, 1954</strong> and now named in <strong>R.I. Gen. Laws Sec. 42-4-5</strong>. Rhode Island did not choose a wild bird. The law designates <strong>the breed of fowl commonly known as the Rhode Island Red</strong> — a domestic chicken breed developed around <strong>Little Compton</strong>, tied to local agriculture, and famous enough that Governor Dennis J. Roberts called it a symbol of Rhode Islanders all over the world.
