sections:
- id: why-did-rhode-island-choose-a-chicken-instead-of-a-wild-bird
  icon: fa-solid fa-circle-question
  title: Why Did Rhode Island Choose a Chicken Instead of a Wild Bird?
  paragraphs:
  - Because the Rhode Island Red gave the state something rarer than a scenic bird. It gave Rhode Island a symbol that the state itself had helped produce.
  - Official Rhode Island summaries say the 1954 election included wild-bird contenders such as the <strong>osprey</strong> and <strong>ruby-throated hummingbird</strong>. Lawmakers still went with the Rhode Island Red.
  - Rhode Island was not looking only for a bird people might admire outdoors. It used its state-bird slot to honor a working breed tied to the state's agricultural reputation and name.
- id: what-did-rhode-island-actually-put-into-law
  icon: fa-solid fa-gavel
  title: What Did Rhode Island Actually Put Into Law?
  paragraphs:
  - Rhode Island law does not read like a typical wildlife designation. Section 42-4-5 names <strong>the breed of fowl commonly known as the Rhode Island Red</strong> as the official state bird — a different kind of symbol from a wild species identified by habitat or migration range.
  - The state formally chose a breed it regarded as its own. That puts the symbol in state identity and economic history rather than ornithology.
- id: why-did-the-rhode-island-red-mean-more-than-farm-output
  icon: fa-solid fa-globe
  title: Why Did the Rhode Island Red Mean More Than Farm Output?
  paragraphs:
  - The breed mattered because it carried Rhode Island's name beyond the state line. Federal preservation material on Little Compton points to that town as the place where the famous Rhode Island Red was developed.
  - That helps explain Governor Dennis J. Roberts's 1954 framing of the breed as a symbol of Rhode Islanders all over the world. He was not talking about one barnyard flock. He was talking about something Rhode Island believed it had contributed to wider agricultural life.
  - The Rhode Island Red stands for local invention that became exportable identity — a breed developed in one Rhode Island town that spread worldwide and carried the state's name with it.
faq:
- question: What is Rhode Island's state bird?
  answer: Rhode Island's state bird is the Rhode Island Red.
- question: When did Rhode Island adopt the Rhode Island Red?
  answer: Rhode Island adopted the Rhode Island Red on May 3, 1954.
- question: Did Rhode Island really choose a chicken as its state bird?
  answer: Yes. Rhode Island law names the Rhode Island Red, a domestic breed of fowl, as the official state bird.
- question: Why did Rhode Island choose a domestic breed instead of a wild bird?
  answer: Because the Rhode Island Red represented something the state believed it had developed and made famous. The symbol honored Rhode Island agriculture and a breed that already carried the state's name.
- question: What does the law actually call the state bird?
  answer: The law calls it the breed of fowl commonly known as the Rhode Island Red.
- question: Where did the Rhode Island Red come from?
  answer: Historical and preservation sources tie the breed's development to Little Compton, Rhode Island.
- question: What does the Rhode Island Red mean for Rhode Island?
  answer: The Rhode Island Red represents a local agricultural creation developed in Little Compton that carried the state's name into poultry farming worldwide — which is why Governor Roberts in 1954 framed it as a symbol of Rhode Islanders all over the world, not just a barnyard emblem.
