faq:
- question: What is Rhode Island's state soil?
  answer: "Rhode Island's state soil is the Narragansett series, a silt loam over gravelly glacial till found on the state's low hills and ridges."
- question: When was the Narragansett series established?
  answer: "The Narragansett series was established in Rhode Island in 1934."
- question: Where is Narragansett soil found?
  answer: "Narragansett soil covers till plains, low ridges, and hills in Rhode Island, Connecticut, and Massachusetts."
- question: What grows on Narragansett soil?
  answer: "Cleared areas grow crops such as corn and tobacco, along with hay and pasture. Wooded areas grow oak, hickory, maple, and pine."
- question: Why does Narragansett soil have two different layers?
  answer: "The lower layer is coarse glacial till left by Ice Age glaciers. A blanket of finer, silty material later covered it, forming the smooth upper part of the soil."

