hero_image_caption: "A small lighthouse stands above the wind-shaped shore of Rhode Island."
intro_text: "Rhode Island's state soil is the Narragansett series, a smooth silt loam that sits on top of gravelly glacial till on the state's low hills and ridges. It was first described in Rhode Island in 1934. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Rhode Island State Soil
  paragraphs:
  - "Narragansett soil has two very different parts. The top 2 feet or so is soft, silty material, and below it lies coarse, gravelly glacial till full of sand and stones."
  - "That layering tells a story about the Ice Age. Glaciers left the rocky till, and a blanket of finer silt settled on top of it afterward. The till itself came from many kinds of rock, including gneiss, schist, sandstone, shale, and basalt."

- id: history
  icon: fa-solid fa-landmark
  title: Why Rhode Island Chose the Narragansett Soil
  paragraphs:
  - "The Narragansett series was established in Rhode Island in 1934 and carries a name with deep roots in the state. Narragansett is the name of a Native American nation, a bay, and a town in Rhode Island."
  - "The soil represents the well-drained uplands that held Rhode Island's farms and woodlots for centuries."

- id: profile
  icon: fa-solid fa-layer-group
  title: Narragansett Soil Profile and Horizons
  paragraphs:
  - "A Narragansett profile begins with a dark brown silt loam plow layer. The subsoil below is yellowish brown silt loam that slowly picks up gravel with depth. At a little over 2 feet, the soil changes sharply to olive brown, very gravelly coarse sand from the glacial till."
  layers:
  - horizon: Ap
    name: Plow layer
    depth_in: "0–6"
    color_hex: "#4A3A28"
    color_name: dark brown
    texture: silt loam
    note: darkest layer with the most organic matter
  - horizon: Bw1
