- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Narragansett Soil Is Found
  paragraphs:
  - "Narragansett soil covers till plains, low ridges, and hills in Rhode Island, Connecticut, and Massachusetts. Slopes range from nearly level to moderately steep."
  - "The soil is well drained. Water moves through the silty upper part at a moderate pace, then drains quickly through the sandy till below. The region receives about 40 to 50 inches of precipitation a year."

- id: agriculture
  icon: fa-solid fa-seedling
  title: Farms and Forests on Narragansett Soil
  paragraphs:
  - "Cleared areas of Narragansett soil are used for cultivated crops, hay, and pasture. Corn and tobacco are among the crops grown on it in southern New England."
  - "Wooded areas grow oak, hickory, maple, and pine. Many old farm fields on this soil have grown back into forest, a common sight across Rhode Island."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Narragansett Soil Facts
  facts:
  - "Narragansett soil is classified as a Typic Dystrudept, an Inceptisol, with coarse-loamy material over sandy or sandy-skeletal till."
  - "The series was established in Rhode Island in 1934."
  - "Its official reference profile was described in Montville, in New London County, Connecticut."
  - "The silty top layer is usually about 2 feet thick and sits on very gravelly glacial till."
  - "Narragansett soil is mapped in three states, Rhode Island, Connecticut, and Massachusetts."

