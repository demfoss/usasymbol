seo_title: "Rhode Island State Soil | Narragansett Series"
seo_description: "The Rhode Island state soil is the Narragansett series, a silty upland soil over glacial till that supports hay, pasture, crops, and oak forests."
hero_image: /images/soils/rhode-island/rhode-island-state-soil-hero.webp
