seo:
  title: "Most Common Last Names in Rhode Island"
  description: "The most common last names in Rhode Island are Smith, Brown, and Johnson, but Portuguese surnames like Silva and Medeiros rank unusually high because mill towns and waterfront communities pulled Lusophone families into the state for generations."

page:
  h1: "Most Common Last Names in Rhode Island"
  intro: "The most common last names in Rhode Island are Smith, Brown, and Johnson, but Portuguese surnames like Silva and Medeiros rank unusually high for such a small New England state. Colonial English names held at the top, while Pawtucket's mills, Providence's port neighborhoods, and later French-Canadian, Irish, Portuguese, and Cape Verdean communities changed the rest of the list."
  heritage_title: "Colonial Names, Mill Labor, and the Lusophone Shore"
  heritage_body: "Rhode Island's surname map begins with 17th-century English settlement, which helps keep Smith, Brown, Johnson, and Jones near the top. The industrial shift came early in 1790, when mechanized textile production began in Pawtucket, and the next century of mill growth drew immigrants from Ireland, French Canada, Italy, Portugal, and Cape Verde into a very small state. By 1920, 70% of Woonsocket's population was French or French Canadian, while Providence and East Providence developed durable Lusophone communities that pushed Silva, Medeiros, Costa, Cabral, Santos, and Ferreira far above their national visibility."
  fun_fact: "Rhode Island is small enough for one migration stream to reorder the statewide ranking: four Lusophone surnames, Silva, Medeiros, Costa, and Cabral, land in the top 20, and several more sit immediately behind them."

surnames:
  - rank: 1
    name: Smith
    count: 5087
    ratio: 207
    origin: english
    type: Occupational
    meaning: "From Old English 'smith', a metalworker. Smith stayed on top in Rhode Island because it came with the colony's earliest English families and remained common through the state's long manufacturing era after Pawtucket's 1790 textile breakthrough."

  - rank: 2
    name: Brown
    count: 3710
    ratio: 284
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', usually describing brown hair, complexion, or clothing. Brown is one of Rhode Island's durable colonial surnames, surviving every later immigration wave because it was already widespread in Providence, Newport, and the farming towns before industrialization."

  - rank: 3
    name: Johnson
    count: 3188
    ratio: 330
    origin: english
    type: Patronymic
    meaning: "Son of John, from the Hebrew name Yohanan, meaning God is gracious. Johnson belongs to Rhode Island's oldest English naming layer, but its rank also reflects how easily the surname crossed into later Black and immigrant communities."

  - rank: 4
    name: Silva
    count: 2740
    ratio: 384
    origin: portuguese
    type: Habitational
    meaning: "From Latin 'silva', forest or woodland. Silva's exceptional Rhode Island rank points to the state's Portuguese and Cape Verdean presence, especially in Providence's Fox Point and in East Providence waterfront communities linked to maritime work and later factory labor."

  - rank: 5
    name: Medeiros
    count: 2447
    ratio: 430
    origin: portuguese
    type: Habitational
    meaning: "A Portuguese surname usually tied to meadows or common pastureland. Medeiros is far too high here to be explained by colonial New England alone; it reflects the same Lusophone migration stream that tied Rhode Island to Portuguese Atlantic communities through fishing, whaling, docks, and mill work."

  - rank: 6
    name: Martin
    count: 2212
    ratio: 476
    origin: french
    type: Patronymic
    meaning: "From Latin Martinus, meaning of Mars. In Rhode Island, Martin travels across several histories at once, including old English usage, Irish Catholic families, and the strong French-Canadian presence that later defined Woonsocket and the Blackstone Valley."

  - rank: 7
    name: Sullivan
    count: 2156
    ratio: 488
    origin: irish
    type: Patronymic
    meaning: "From Irish 'O Suileabhain', usually interpreted as descendant of Suileabhan. Sullivan ranks this high because 19th-century Irish immigration left a deep mark on Providence and other mill towns, where Irish parish and family networks stayed dense for generations."

  - rank: 8
    name: Williams
    count: 2141
    ratio: 492
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic Willahelm. Williams fits Rhode Island's colonial English and Welsh background, but it also reflects the long Black Rhode Island presence documented in the colony from the 17th century onward."

  - rank: 9
    name: Anderson
    count: 2029
    ratio: 519
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders or Andrew, from Greek Andreas. Anderson rose in Rhode Island through both older Anglo-American use and later northern European industrial workers who entered the state's factory cities in the 19th century."

  - rank: 10
    name: Costa
    count: 2019
    ratio: 521
    origin: portuguese
    type: Habitational
    meaning: "From the Portuguese for coast or shore. Costa reads almost like a geographic summary of Rhode Island's Lusophone history, since many Portuguese and Cape Verdean families settled in shoreline and dockside neighborhoods tied to shipping, fishing, and related trades."

  - rank: 11
    name: Perry
    count: 1922
    ratio: 548
    origin: welsh
    type: Habitational
    meaning: "Usually from Welsh 'ap Herry' or from place-based English forms tied to pear trees or enclosed land. Perry has deep roots in southern New England and remained visible in Rhode Island's coastal towns long before newer immigrant surnames crowded the statewide list."

  - rank: 12
    name: Rodriguez
    count: 1852
    ratio: 568
    origin: spanish
    type: Patronymic
    meaning: "Son of Rodrigo, from a Germanic personal name meaning famous ruler. Rodriguez rose into Rhode Island's top tier through later Hispanic migration into Providence County cities, adding a newer layer to a list still dominated by colonial and 19th-century names."

  - rank: 13
    name: Cabral
    count: 1672
    ratio: 630
    origin: portuguese
    type: Habitational
    meaning: "A Portuguese surname associated with goats or rough upland ground. Cabral is one of Rhode Island's clearest Lusophone markers, carried by Portuguese and Cape Verdean families whose communities remained rooted in Providence-area neighborhoods across multiple generations."

  - rank: 14
    name: Davis
    count: 1665
    ratio: 632
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew Dawid, meaning beloved. Davis is another long-running New England surname that held its place in Rhode Island from the colonial period through the rise of Providence as the state's industrial and civic center."

  - rank: 15
    name: Murphy
    count: 1643
    ratio: 641
    origin: irish
    type: Patronymic
    meaning: "From Irish 'O Murchadha', descendant of Murchadh, often glossed as sea warrior. Murphy's strength in Rhode Island reflects the same Irish migration pattern that elevated Sullivan, especially in Providence and the state's older mill communities."

  - rank: 16
    name: Santos
    count: 1635
    ratio: 644
    origin: portuguese
    type: Religious
    meaning: "From Portuguese and Spanish 'santos', saints. In Rhode Island, Santos is another sign of the state's unusually dense Portuguese and Cape Verdean population, with the surname sustained by family networks tied to parish life, waterfront work, and urban neighborhoods."

  - rank: 17
    name: Miller
    count: 1537
    ratio: 685
    origin: english
    type: Occupational
    meaning: "An occupational surname for a miller. Miller fits Rhode Island unusually well because the state that launched the American Industrial Revolution in Pawtucket also spent generations organized around waterpower, mills, and textile production."

  - rank: 18
    name: Ferreira
    count: 1492
    ratio: 705
    origin: portuguese
    type: Habitational
    meaning: "A Portuguese surname often linked to ironworks or ferraria place names. Ferreira's Rhode Island showing reflects 20th-century Portuguese migration into Blackstone Valley and Providence-area communities, including families who built institutions strong enough to keep the name highly visible statewide."

  - rank: 19
    name: Garcia
    count: 1466
    ratio: 718
    origin: spanish
    type: Habitational
    meaning: "A very old Iberian surname, often linked to Basque origins. Garcia's place in Rhode Island's top 20 marks the state's modern Hispanic growth, especially in the same urban corridor where older Irish and Portuguese communities had already settled."

  - rank: 20
    name: Jones
    count: 1431
    ratio: 735
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John. Jones has been common across southern New England since the colonial era, and in Rhode Island it represents the older English-Welsh layer that still underlies the state's later immigrant surname mix."

unique_surnames:
  - name: Silva
    state_rank: 4
    national_rank: 232
    origin: portuguese
    why: "Silva ranks fourth in Rhode Island while sitting much lower nationally, which makes it the clearest statewide Lusophone outlier. That pattern matches the long Portuguese and Cape Verdean presence in Providence and East Providence, where waterfront and working-class neighborhoods preserved family names generation after generation."

  - name: Medeiros
    state_rank: 5
    national_rank: 2024
    origin: portuguese
    why: "Medeiros is rare in most of the United States but reaches Rhode Island's top five. Its rise reflects the state's Atlantic links to Portuguese-speaking migration networks rather than the older colonial surname pool that dominates most New England lists."

  - name: Costa
    state_rank: 10
    national_rank: 882
    origin: portuguese
    why: "Costa is visible nationally, but Rhode Island lifts it far higher than the country as a whole. The name benefited from the same shoreline and urban Lusophone settlement patterns that made Providence-area Portuguese communities unusually durable."

  - name: Cabral
    state_rank: 13
    national_rank: 1956
    origin: portuguese
    why: "Cabral is another surname that Rhode Island pushes dramatically upward relative to the national list. Portuguese and Cape Verdean households in the Providence area kept the name concentrated enough to turn it into a statewide signature."

  - name: Ferreira
    state_rank: 18
    national_rank: 1462
    origin: portuguese
    why: "Ferreira reaches Rhode Island's top 20 because Portuguese migration did not remain limited to one neighborhood or one decade. The surname stayed visible in Blackstone Valley and Providence-area communities that built clubs, churches, and family networks strong enough to reproduce the name locally."

etymology_groups:
  - type: Colonial English and Welsh Names
    icon: fa-solid fa-hammer
    description: "Smith, Brown, Johnson, Williams, Perry, Davis, Miller, and Jones reflect the older surname base laid down in colonial Rhode Island and reinforced by centuries of local continuity. Even after industrialization brought new migration streams, these names stayed near the top because they were already spread across Providence, Newport, and the inland towns."
    examples:
      - Smith (metalworker)
      - Brown (brown-haired or brown-clad)
      - Williams (son of William)
      - Jones (son of John, Welsh)

  - type: Portuguese and Cape Verdean Names
    icon: fa-solid fa-ship
    description: "Silva, Medeiros, Costa, Cabral, Santos, and Ferreira give Rhode Island one of the most Lusophone surname profiles in the country. That cluster reflects generations of Portuguese and Cape Verdean settlement in Providence and East Providence, plus related working-class communities tied to maritime trades, docks, and mills."
    examples:
      - Silva (forest or woodland)
      - Costa (coast or shore)
      - Cabral (Portuguese place-based surname)
      - Ferreira (ironworks or ferraria place name)

  - type: Irish and Mill-Town Patronymics
    icon: fa-solid fa-person
    description: "Sullivan and Murphy are the clearest Irish signals in Rhode Island's top 20, and Martin often overlaps with the same Catholic urban world. Their strength reflects 19th-century migration into Providence and factory towns, then the family and parish networks that kept Irish surnames visible long after the first immigrant generation."
    examples:
      - Sullivan (descendant of Suileabhan)
      - Murphy (descendant of Murchadh)
      - Martin (from Martinus)
      - Rodriguez (son of Rodrigo)

faq:
  - question: "What are the most common last names in Rhode Island?"
    answer: "The most common last names in Rhode Island are Smith, Brown, Johnson, Silva, and Medeiros. What makes Rhode Island unusual is how quickly Portuguese surnames enter the top 20 compared with most other New England states."

  - question: "Why are Portuguese last names so common in Rhode Island?"
    answer: "Portuguese last names are so common in Rhode Island because the state developed long-lasting Portuguese and Cape Verdean communities tied to waterfront work, mills, and urban neighborhoods in and around Providence and East Providence. That history pushed surnames like Silva, Medeiros, Costa, Cabral, Santos, and Ferreira far higher than their national rankings."

