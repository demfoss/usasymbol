intro_text: Rhode Island's state fish is the striped bass, a large silver fish with bold dark stripes, adopted in 2000. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Rhode Island?
  paragraphs:
  - The striped bass is the official state fish of Rhode Island. State lawmakers made it official in 2000, and its scientific name is Morone saxatilis.
  - Many people call it a striper or a linesider because of the stripes along its sides.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass has a thick, sturdy body. Seven or eight dark stripes run along each side, from the gills to the tail.
  - Its back can be olive green, steel blue, brown, or nearly black. Its sides are silver and its belly is white.
  - Striped bass can grow up to 5 feet long and weigh as much as 77 pounds. Some live for up to 30 years.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Rhode Island General Assembly, which is the state legislature, passed a law in 2000 naming the striped bass the official state fish.
  - State law calls it the fish commonly known as the striped bass and gives its scientific name.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Rhode Island Chose the Striped Bass
  paragraphs:
  - Official sources name the striped bass as the state fish without giving a detailed reason. It is a well-known fish along Rhode Island's coast and is popular with anglers.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass live in salt water along the Atlantic coast, and they swim up rivers to lay their eggs. In Rhode Island they are found in Narragansett Bay, Mount Hope Bay, coastal rivers and salt ponds, and the waters around Block Island.
  - They migrate along the coast and are most common in Rhode Island waters from spring through fall.
