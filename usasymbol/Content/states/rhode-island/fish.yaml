- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 2000 by the Rhode Island Legislature.
  - Its scientific name is Morone saxatilis.
  - It has seven or eight dark stripes along each side.
  - It can grow up to 5 feet long and 77 pounds.
  - It is native to the Atlantic coast of North America.
faq:
- question: What is Rhode Island's state fish?
  answer: Rhode Island's state fish is the striped bass, a silver fish with dark stripes along its sides.
- question: When did Rhode Island adopt the Striped Bass?
  answer: The Rhode Island General Assembly made the striped bass the official state fish in 2000.
- question: Why did Rhode Island choose the Striped Bass?
  answer: Official sources do not give a detailed reason. The striped bass is a familiar fish in Rhode Island's coastal waters and is popular with anglers.
- question: How can you recognize a striped bass?
  answer: Look for seven or eight dark stripes running from the gills to the tail. It also has silver sides and a white belly.
- question: Is Rhode Island the only state with the striped bass as its state fish?
  answer: No. Maryland and South Carolina also have the striped bass as their state fish, and several other coastal states use it as their state saltwater fish.
