seo_title: 'Rhode Island State Drink: Coffee Milk — What It Is and Why It Won'
seo_description: Coffee milk is Rhode Island's official state drink, designated in 1993. It is not coffee with milk — it is milk mixed with coffee syrup, a distinct Rhode Island staple since the 1920s. Learn what sets it apart.
intro_text: <strong>Coffee milk</strong> is the official state drink of <strong>Rhode Island</strong>, designated in <strong>1993</strong> — and it is not coffee with milk. It is cold milk stirred with sweet coffee syrup, closer in form to chocolate milk than to any coffee-shop drink, with a flavor that anyone from Rhode Island can place immediately and most outsiders have never encountered. The drink has been a fixture in Rhode Island diners, school cafeterias, and homes since the 1920s, and it beat out other strong local contenders — including Del's Lemonade — to earn the state's official recognition. See the full list of [Rhode Island state symbols](/states/rhode-island).
