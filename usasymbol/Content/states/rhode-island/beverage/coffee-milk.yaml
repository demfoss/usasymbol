sections:
- id: answer
  icon: fa-solid fa-circle-info
  title: 'Rhode Island State Drink: Coffee Milk'
  paragraphs:
  - 'Rhode Island''s official state drink is <strong>coffee milk</strong> — a glass of cold milk mixed with <strong>coffee syrup</strong>, not a coffee beverage with milk added. The distinction matters. Coffee milk starts with milk as its base. Coffee syrup — a thick, sweet, pre-made concentrate — is stirred in, the same way chocolate syrup produces chocolate milk. The result is cold, sweet, coffee-flavored milk: a drink that tastes unmistakably of coffee but drinks like milk.'
- id: what-is-coffee-milk
  icon: fa-solid fa-mug-hot
  title: Coffee Milk Is Not Coffee With Milk
  paragraphs:
  - 'The preparation is simple and specific: pour cold milk, add coffee syrup, stir. No brewing. No espresso. No heat required. Coffee syrup is a shelf-stable, sweet, coffee-flavored concentrate — sold in Rhode Island grocery stores for generations and largely unknown outside the state.'
  - The taste is sweet and coffee-forward, with none of the bitterness or acidity of brewed coffee. People who grew up drinking it compare the experience to chocolate milk — the same cold, sweetened, syrup-in-milk format — but with a coffee note instead. Children drink it. Adults drink it. It has been on Rhode Island school lunch trays for decades. A latte is espresso with steamed milk. Café au lait is brewed coffee and hot milk. Coffee milk is neither. It belongs in the same category as chocolate milk, not the same category as coffee — and that difference is the whole point.
- id: why-rhode-island
  icon: fa-solid fa-map-location-dot
  title: Why Rhode Island Has Been Drinking Coffee Milk Since the 1920s
  paragraphs:
  - Coffee milk's rise tracks directly to the coffee syrup industry that took hold in Rhode Island in the 1920s and 1930s. Autocrat Coffee, founded in Providence, became the dominant producer for the regional market, and the drink spread through the state's dense network of diners, luncheonettes, and family kitchens. Italian-American families were central to its early adoption and spread — Rhode Island's working-class immigrant population took to the sweet, mild drink in a way that made it feel domestic rather than commercial.
  - By mid-century, coffee milk was less a novelty than a default. It appeared on diner menus alongside regular milk and chocolate milk. Schools served it. Families kept coffee syrup in the refrigerator the same way they kept ketchup. The drink became so thoroughly woven into Rhode Island food culture that it stopped seeming regional at all — it was simply what you drank.
  - That cultural invisibility — the sense that coffee milk is just normal — is partly what makes it a strong state symbol. It does not represent Rhode Island through ceremony or official promotion. It represents Rhode Island because generations of Rhode Islanders grew up with it and assumed, briefly, that everyone else did too.
- id: official-designation
  icon: fa-solid fa-landmark
  title: Why Coffee Milk Beat Del's Lemonade for Rhode Island's Official State Drink
  paragraphs:
  - 'Rhode Island designated coffee milk its official state drink in 1993 — and the vote was not a formality. Del''s Lemonade, the frozen lemonade brand that is its own Rhode Island institution, ran as the main competing candidate. That both drinks were serious contenders says something: the state was not choosing between a local staple and a generic option, it was choosing between two genuinely Rhode Island drinks. Coffee milk won. The [Rhode Island Secretary of State](https://www.sos.ri.gov/) lists it among the state''s official symbols alongside the full range of [state beverages](/symbols/beverages) recognized across the U.S.'
- id: local-culture
  icon: fa-solid fa-store
  title: Autocrat, Eclipse, and the Coffee Cabinet
  paragraphs:
  - In Rhode Island, the coffee syrup aisle is real. Autocrat and Eclipse are the two names that matter — Autocrat the larger brand, Eclipse the older one. For most of the 20th century the two competed directly. At some point Autocrat acquired Eclipse but kept both labels in production, a detail Rhode Islanders track with mild local pride. Asking someone which syrup they use is a legitimate Rhode Island small-talk opener.
  - 'The drink also has a direct descendant: the <em>coffee cabinet</em> — the Rhode Island name for a coffee milkshake made with coffee ice cream and coffee syrup. The rest of the country calls it a milkshake or a frappe; in Rhode Island it is a cabinet. The coffee version is as locally specific as the milk version, extending the same flavor logic — sweet, coffee-forward, milk-based — into a thicker format.'
timeline:
- year: 1920s–1930s
  description: Coffee syrup production expands in Rhode Island; coffee milk becomes a common drink in diners, homes, and eventually school cafeterias across the state
- year: Mid-20th century
  description: Autocrat Coffee dominates the Rhode Island coffee syrup market; coffee milk is effectively the default flavored milk in the state
- year: '1993'
  description: Rhode Island Legislature designates coffee milk the official state drink; it defeats Del's Lemonade in the vote
faq:
- question: What is Rhode Island's state drink?
  answer: Rhode Island's official state drink is coffee milk, designated in 1993. It is made by mixing coffee syrup into cold milk — not by adding milk to coffee.
- question: What is coffee milk made of?
  answer: Coffee milk is made by stirring coffee syrup into cold milk. Coffee syrup is a sweet, thick coffee-flavored concentrate, similar in function to chocolate syrup. The result is a cold, sweet, milk-based drink.
- question: Is coffee milk the same as iced coffee or a latte?
  answer: No. Coffee milk starts with milk, not brewed coffee or espresso. It is structurally the same as chocolate milk — syrup added to cold milk — but with coffee syrup instead of chocolate syrup. It is milder, sweeter, and milk-dominant compared to any iced coffee drink.
- question: When did Rhode Island designate coffee milk as the state drink?
  answer: Rhode Island designated coffee milk the official state drink in 1993.
- question: What other drink competed against coffee milk?
  answer: Del's Lemonade — Rhode Island's well-known frozen lemonade brand — was the main competing candidate when the state drink vote took place in 1993. Coffee milk won.
- question: What brands make coffee syrup for coffee milk?
  answer: The two principal brands are Autocrat and Eclipse, both associated with Rhode Island. Autocrat later acquired Eclipse but continued selling both labels. Autocrat is the more widely available brand today.
- question: What is a coffee cabinet?
  answer: A coffee cabinet is the Rhode Island name for a coffee milkshake — made with coffee ice cream, coffee syrup, and milk. It is closely related to coffee milk and uses the same flavor base.
