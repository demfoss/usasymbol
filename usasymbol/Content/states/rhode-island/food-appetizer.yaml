sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Rhode Island's State Appetizer?"
    paragraphs:
      - "Calamari is Rhode Island's official state appetizer, designated by the Rhode Island General Assembly in 2015. Calamari is squid that is typically sliced into rings, breaded or floured, and fried."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Calamari"
    paragraphs:
      - "Calamari is prepared by slicing squid into rings, coating them in flour or breading, and frying them until crisp. Rhode Island's signature version, sometimes called Rhode Island style calamari, adds sliced banana peppers and a garlicky marinara sauce, a combination associated with the state's Italian American restaurant tradition."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Calamari Became Rhode Island's State Appetizer"
    paragraphs:
      - "The Rhode Island General Assembly designated calamari the official state appetizer in 2015."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Rhode Island Chose Calamari"
    paragraphs:
      - "Squid is landed in significant quantities by Rhode Island's commercial fishing fleet, based largely out of the Port of Galilee near Point Judith. Rhode Island restaurants, particularly those with Italian American roots, have served calamari for decades, giving the appetizer both an industry and a culinary connection to the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Calamari Comes From in Rhode Island"
    paragraphs:
      - "The Port of Galilee, near Point Judith in Narragansett, is one of the East Coast's major squid landing ports and a hub of Rhode Island's fishing industry."
