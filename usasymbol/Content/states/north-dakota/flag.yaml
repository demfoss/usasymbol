  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Dakota State Flag Facts"
    facts:
      - "North Dakota made its military-banner design the official state flag on March 3, 1911"
      - "The flag design comes from a military banner used in the Philippine-American War"
      - "Colonel John H. Fraine introduced the flag legislation"
      - "The flag features an eagle from the U.S. coat of arms"
      - "A 1953 proposal to redesign the flag with wheat and a sunset failed"
      - "The flag's official proportion is 26:33 but is often made in 3:5 ratio"

faq:
  - question: "What is the official state flag of North Dakota?"
    answer: "The state flag of North Dakota is the official banner of North Dakota, featuring an eagle from the U.S. coat of arms on a blue field with a scroll reading North Dakota."

  - question: "How would you describe the design of the North Dakota state flag?"
    answer: "The flag shows a blue field with an eagle at the center. The eagle holds an olive branch and arrows. Thirteen stars appear above the eagle. A scroll below reads North Dakota."

  - question: "How do historians explain the symbolism of North Dakota's flag?"
    answer: "The flag represents North Dakota's military service and connection to the United States. It honors soldiers who served in the Spanish-American War and Philippine-American War."

  - question: "What symbols appear on the North Dakota state flag?"
    answer: "The flag displays an eagle, thirteen stars, sun rays, a shield with stripes, an olive branch, arrows, and a scroll with the state name."

  - question: "In what year did North Dakota's current flag become official?"
    answer: "North Dakota adopted its state flag on March 3, 1911."

