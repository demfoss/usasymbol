seo_title: "North Dakota State Flag | Eagle & History"
seo_description: "North Dakota's flag eagle was copied almost exactly from a U.S. Army uniform button circa 1784. The design came from a regimental banner used in the Philippine-American War."

intro_text: "North Dakota adopted its state flag in 1911, displaying an eagle from the U.S. coat of arms and appearing in the broader [list of U.S. state flags](/symbols/flags). The design replicates the regimental banner carried by North Dakota troops during the Philippine-American War. A scroll beneath the eagle reads North Dakota."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the North Dakota State Flag Is Designed"
    paragraphs:
      - "The North Dakota state flag is the official banner of the state of North Dakota. A blue field holds an eagle at its center. The eagle faces left with wings spread wide."
      - "The design comes directly from a military banner used by the First North Dakota Infantry. Colonel John H. Fraine introduced the flag in the state legislature in 1911. He had commanded North Dakota troops during the Philippine-American War."
      - "The eagle holds an olive branch in one talon and arrows in the other. A shield covers the eagle's chest. Above the bird appear thirteen gold stars beneath sun rays. Below sits a red and gold scroll marked North Dakota."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the North Dakota Flag Communicates"
    paragraphs:
      - "The North Dakota state flag meaning ties to military service and national unity. The flag honors North Dakota soldiers who served in the Spanish-American War and Philippine-American War, echoing themes in [North Dakota's state motto](/states/north-dakota/motto/liberty-and-union-now-and-forever-one-and-inseparable)."
      - "The eagle represents strength and the United States. The thirteen stars stand for the original colonies. Sun rays symbolize the birth of a new nation."
      - "The olive branch signals peace. The arrows indicate military readiness. Together these elements connect North Dakota to the broader American republic."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "North Dakota Flag History and Adoption"
    paragraphs:
      - "Colonel John H. Fraine introduced House Bill No. 152 on January 21, 1911. The bill proposed adopting the First North Dakota Infantry's banner as the state flag. Fraine had led North Dakota troops during the Philippine-American War."
      - "The North Dakota Legislative Assembly approved the design on March 3, 1911. The original law did not specify exact colors or proportions. Infantry regiments across the country carried similar banners from 1890 to 1904. Each unit added its own designation to the scroll beneath the eagle."
      - "Legislators refined the specifications in 1943 to match the original military banner more closely. In 1951, North Dakota formed a commission to evaluate the flag. The commission proposed a new design featuring wheat and a sunset. The proposal failed in 1953, and the original design remained aligned with [the Peace Garden State identity](/states/north-dakota/nickname/the-peace-garden-state)."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the North Dakota Flag"
    symbols:
      - id: eagle
        name: "North Dakota State Flag Eagle"
        image: "symbols/eagle.svg"
        paragraphs:
          - "An eagle dominates the center of the flag. The bird faces left with wings extended. A shield covers its chest showing seven red stripes and six white stripes."
          - "The eagle comes from the Great Seal of the United States. It appears on many U.S. military banners and state flags. The design links North Dakota to federal authority and national identity."

      - id: stars
        name: "North Dakota State Flag Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Thirteen gold stars appear above the eagle in two rows. They represent the thirteen original colonies. Sun rays spread out behind the stars."
          - "The stars and rays together symbolize the founding of the American republic. They appeared on infantry standards carried during the late nineteenth century."

      - id: scroll
        name: "North Dakota State Flag Scroll"
        image: "symbols/scroll.svg"
        paragraphs:
          - "A red and gold scroll sits below the eagle. The words North Dakota appear in blue letters. This scroll distinguishes the flag from other regimental banners."
          - "Military units inscribed their designations on similar scrolls. The First North Dakota Infantry originally displayed its unit name in this space."

      - id: olive-branch
        name: "North Dakota State Flag Olive Branch and Arrows"
        image: "symbols/olive-arrows.svg"
        paragraphs:
          - "The eagle clutches an olive branch in its right talon. It holds a bundle of arrows in its left talon. These symbols come from the U.S. coat of arms."
          - "The olive branch represents peace. The arrows represent military strength. The banner in the eagle's beak reads E Pluribus Unum."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "North Dakota State Flag Colors"
    paragraphs:
      - "The North Dakota state flag uses blue, red, gold, yellow, green, silver, brown, tan, white, and black. The State Historical Society of North Dakota provides specific Pantone values for each color, and these can be compared in [the U.S. state colors guide](/symbols/colors)."
      - "Blue forms the background field. Red appears on the scroll, shield stripes, and details. Gold marks the sun rays, stars, and scroll trim. Multiple shades color the eagle's feathers and the olive branch, while geographic context sits on [the North Dakota borders page](/states/north-dakota/borders)."

  - id: context
    icon: "fa-solid fa-map-location-dot"
    title: "Flag Context in North Dakota Identity"
    paragraphs:
      - "Modern demographic growth and representation context can also be compared with [U.S. states by population](/rankings/demographics/states-by-population)."
