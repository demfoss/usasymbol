faq:
  - question: "What is North Dakota's state motto?"
    answer: "North Dakota's state motto is \"Liberty and Union, Now and Forever, One and Inseparable.\" The phrase comes from Senator Daniel Webster's speech during the Webster-Hayne debate in January 1830 and has been on the state seal since 1889."

  - question: "What does North Dakota's state motto mean?"
    answer: "The motto pairs liberty with national union, insisting the two cannot be separated. Webster used the phrase to argue that the United States was one permanent nation — no state could nullify federal law or leave the Union."

  - question: "Where does North Dakota's motto come from?"
    answer: "The phrase comes from Senator Daniel Webster's Second Reply to Hayne, delivered in the U.S. Senate on January 26–27, 1830. It became one of the most quoted lines from any Senate speech in American history."

  - question: "When did North Dakota adopt its state motto?"
    answer: "The motto appeared on North Dakota's Great Seal in 1889, when the state entered the Union. The Dakota Territory had used a slightly different version of the phrase since 1863."

  - question: "Why is North Dakota's motto worded differently than the territorial motto?"
    answer: "Dakota Territory's 1863 seal placed the phrases in a different order than Webster's original speech. When North Dakota became a state in 1889, delegates restored the correct wording to match what Webster actually said."

