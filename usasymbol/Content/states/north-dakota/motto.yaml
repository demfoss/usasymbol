seo_title: "North Dakota State Motto | Liberty and Union"
seo_description: "North Dakota's state motto is \"Liberty and Union, Now and Forever, One and Inseparable.\" The phrase comes from Daniel Webster's Senate speech in 1830."

intro_text: "North Dakota's state motto is <strong>Liberty and Union, Now and Forever, One and Inseparable</strong>. The phrase comes from Senator Daniel Webster's speech during the Webster-Hayne debate in January 1830 and has appeared on the state seal since North Dakota became a state in 1889."

