title: "Liberty and Union, Now and Forever, One and Inseparable"
language: "English"
english_translation: ""
adopted_year: 1889

author: "USA Symbol Team"
date_published: "2025-12-04"
date_modified: "2026-03-27"
seo_title: "North Dakota State Motto: Liberty and Union"
seo_description: "North Dakota has the longest state motto in the U.S. — 13 words from Daniel Webster's most famous Senate speech. Dakota Territory used the same words for 26 years but scrambled the order. President Harrison shuffled the papers before signing admission documents so no one knows whether North or South Dakota became a state first. A 1890 convention rejected replacing it with Lincoln's Gettysburg Address phrase."

intro_text: "North Dakota's state motto is <strong>Liberty and Union, Now and Forever, One and Inseparable</strong> — the longest state motto in the United States at 13 words. The phrase comes from Daniel Webster's Second Reply to Hayne, delivered in the U.S. Senate on January 26-27, 1830, and described as the most famous Senate speech in history. Dakota Territory used the same words for 26 years (1863–1889) but scrambled their order. North Dakota's 1889 constitutional convention restored Webster's original phrasing. President Benjamin Harrison shuffled the statehood papers before signing so that no one would know which state — North or South Dakota — was admitted first."

sections:
  - id: "longest-motto-13-words"
    icon: "fa-solid fa-text-width"
    title: "The Longest State Motto in the United States"
    paragraphs:
      - "North Dakota's motto contains 13 words — more than any other state motto. Rhode Island's motto is one word ('Hope'). Arizona's is two words ('Ditat Deus'). Most state mottos are under six words. North Dakota's full phrase — 'Liberty and Union, Now and Forever, One and Inseparable' — runs so long that it surrounds the entire Great Seal design in a circumferential band."
      - "The phrase wasn't invented for the motto; it was lifted directly from one of the most famous speeches in American political history. Daniel Webster closed his Second Reply to Hayne in the U.S. Senate on January 26-27, 1830, with the words: 'Liberty and Union, now and forever, one and inseparable!' The Senate chamber was packed beyond capacity. The speech defending federal union against nullification theory became Webster's defining moment."
      - "Dakota Territory had adopted Webster's words in 1863, but committee members scrambled the order. The territorial motto read: 'Liberty and Union, one and inseparable, now and forever' — placing 'now and forever' at the end instead of the middle. North Dakota's 1889 constitutional convention corrected the phrase to match Webster's original. The correction mattered: Webster's rhythm — now and forever, ONE and inseparable — placed the emphasis on unity, not time."

  - id: "harrison-shuffled-papers"
    icon: "fa-solid fa-shuffle"
    title: "President Harrison Shuffled the Papers — No One Knows Which State Was Admitted First"
    paragraphs:
      - "President Grover Cleveland signed the Omnibus Bill on February 22, 1889, enabling North Dakota, South Dakota, Montana, and Washington to seek statehood. All four needed to hold constitutional conventions and have voters approve their constitutions by October 1, 1889. President Benjamin Harrison, who took office on March 4, 1889, would sign the final admission proclamations."
      - "On November 2, 1889, Harrison signed admission proclamations for both Dakotas. But he deliberately shuffled the papers before signing so that no one — not even the Secretary of State who presented the documents — would know which state's proclamation was signed first. Harrison then made the official announcement without indicating the order."
      - "The question of which Dakota entered the Union first has never been definitively answered. Both states claim to be the 39th and 40th states simultaneously. By convention, North Dakota is typically listed as the 39th state based on alphabetical order. South Dakota is listed as the 40th. But there is no legal record establishing which state actually entered first."

  - id: "webster-hayne-debate"
    icon: "fa-solid fa-landmark"
    title: "The Webster-Hayne Debate: Where the Motto Came From"
    paragraphs:
      - "The debate began on January 19, 1830, as a discussion over federal land sales but expanded to fundamental constitutional questions. South Carolina Senator Robert Hayne argued that states retained sovereignty and could nullify federal laws — a position that would be tested in the Civil War 30 years later. Webster countered that the Constitution created a national government made by the people, not a compact between states."
      - "Webster's closing on January 27 became the most celebrated passage in Senate oratory. The final words — 'Liberty and Union, now and forever, one and inseparable!' — were printed and distributed throughout the country. Schoolchildren memorized the speech. During the Civil War, Union soldiers carried Webster's words as a rallying cry. The motto that North Dakota adopted in 1889 was already one of the most recognized phrases in American political life."
      - "A 1890 North Dakota constitutional convention considered replacing Webster's words with a phrase from Lincoln's Gettysburg Address about 'government of the people.' Representative Martin Johnson argued that Webster's concerns over states' rights had been settled by the Civil War and that Lincoln's phrase was more appropriate for the post-war era. The convention rejected the proposal and kept Webster's words."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "North Dakota State Motto Facts"
    style: "gradient"
    facts:
      - "North Dakota's motto is the longest in the U.S. — 13 words from Daniel Webster's most famous Senate speech."
      - "Dakota Territory scrambled Webster's word order for 26 years; North Dakota corrected it in 1889."
      - "President Harrison shuffled the statehood papers before signing so no one would know which Dakota was admitted first."
      - "North Dakota is typically listed as the 39th state by alphabetical convention, though the actual order is unknown."
      - "A 1890 convention rejected replacing the motto with a phrase from Lincoln's Gettysburg Address."
      - "The Webster-Hayne debate of 1830 — where the phrase originated — is called the most famous speech in Senate history."

faq:
  - question: "What is North Dakota's state motto?"
    answer: "North Dakota's state motto is 'Liberty and Union, Now and Forever, One and Inseparable,' adopted in the 1889 state constitution. At 13 words, it is the longest state motto in the United States."

  - question: "Where does North Dakota's motto come from?"
    answer: "From Daniel Webster's Second Reply to Hayne, delivered in the U.S. Senate on January 26-27, 1830 — described as the most famous Senate speech in history. Webster spoke these words defending federal union against the nullification theory of state sovereignty."

  - question: "Why did Dakota Territory have the words in a different order?"
    answer: "Dakota Territory adopted Webster's words in 1863 but scrambled the phrase to: 'Liberty and Union, one and inseparable, now and forever.' This error stood for 26 years. North Dakota's 1889 constitutional convention restored Webster's original word order, which places emphasis differently: 'Liberty and Union, now and forever, one and inseparable.'"

  - question: "When did North Dakota adopt its motto?"
    answer: "In 1889, when the constitutional convention wrote the state seal description into Article 9, Section 2 of the constitution. President Harrison admitted North Dakota to the Union on November 2, 1889."

  - question: "Is North Dakota the 39th or 40th state?"
    answer: "Officially both, and neither — no one knows. President Harrison deliberately shuffled the statehood papers before signing so no one would know which Dakota was admitted first. By alphabetical convention, North Dakota is listed as the 39th state and South Dakota as the 40th, but there is no legal record establishing the actual order."

  - question: "Where does North Dakota's motto appear?"
    answer: "On the Great Seal (in a band surrounding the entire design, with 'Great Seal' at the top, 'State of North Dakota' at the bottom, 'October 1st' on the left, and '1889' on the right) and on official state documents. The motto does not appear on North Dakota's state flag, which instead features a bald eagle with a shield design."

