seo:
  title: "Most Common Last Names in North Dakota"
  description: "The most common last names in North Dakota are Johnson, Anderson, and Olson, with Norwegian settlement, German-Russian farm colonies, and Red River Métis communities all leaving marks on the state's surname map."

page:
  h1: "Most Common Last Names in North Dakota"
  intro: "Johnson, Anderson, and Olson are the most common last names in North Dakota, a ranking shaped by the farm settlement wave that remade the state from the 1880s to 1910. The most common last names in North Dakota look more Scandinavian than those of most states, while German-Russian and Métis family lines still give the list a distinctly northern Plains profile."
  heritage_title: "Norwegian Farm Belts, German-Russian Counties, and the Red River Métis"
  heritage_body: "North Dakota's surname map was formed during the Great Dakota Boom, when more than 100,000 immigrants entered northern Dakota and the state became one of the most heavily immigrant places in the country. North Dakota Studies notes that in 1910 the largest foreign-born group was Norwegian, with 45,937 people, and that from 1892 to 1905 almost half of all immigrants into the state were Scandinavians. Germans from Russia built dense farm settlements across the state's central and southern counties, while the older fur-trade country around Pembina preserved Métis surnames that grew out of French and Indigenous families."
  fun_fact: "Poitra ranks 76th statewide in North Dakota, and Forebears attributes 63.71 percent of all U.S. Poitras to the state, an unusually strong sign of how long Métis and Turtle Mountain family networks have endured here."

surnames:
  - rank: 1
    name: Johnson
    count: 9553
    ratio: 78
    origin: scandinavian
    type: Patronymic
    meaning: "Johnson means 'son of John,' but in North Dakota much of its strength comes from Norwegian and Swedish forms such as Johnsen, Johansson, and Jonsson being anglicized in American records. The name rose with the Scandinavian farm settlement that flooded the Red River Valley and eastern prairie after 1880."

  - rank: 2
    name: Anderson
    count: 6334
    ratio: 118
    origin: scandinavian
    type: Patronymic
    meaning: "Anderson means 'son of Anders' or Andrew. Its high North Dakota rank reflects the same Norwegian and Swedish migration that made Scandinavian Lutheran churches a defining feature of the state's small towns and countryside."

  - rank: 3
    name: Olson
    count: 5418
    ratio: 138
    origin: scandinavian
    type: Patronymic
    meaning: "Olson means 'son of Ole' or Olof. Few names mark North Dakota's Norwegian settlement more clearly, and Forebears shows the state holds 2.52 percent of all American Olsons, a very large share for such a small population."

  - rank: 4
    name: Nelson
    count: 4187
    ratio: 178
    origin: scandinavian
    type: Patronymic
    meaning: "Nelson means 'son of Nels' or Nils, the Scandinavian form of Nicholas. The surname stayed unusually common because North Dakota drew thousands of Norwegian farm families during the boom years before statehood and into the early twentieth century."

  - rank: 5
    name: Miller
    count: 3624
    ratio: 206
    origin: german
    type: Occupational
    meaning: "Miller is an occupational surname for a grain miller. In North Dakota it reflects both the ordinary English form and German-speaking migration, especially in the wheat country where milling and rail shipment defined local economies."

  - rank: 6
    name: Larson
    count: 3488
    ratio: 214
    origin: scandinavian
    type: Patronymic
    meaning: "Larson means 'son of Lars.' Its place in the top 10 shows how thoroughly Scandinavian patronymics took root across North Dakota's farm belt, especially in counties settled from Minnesota and directly from Norway."

  - rank: 7
    name: Peterson
    count: 3482
    ratio: 215
    origin: scandinavian
    type: Patronymic
    meaning: "Peterson means 'son of Peter,' often simplified from Petersen. North Dakota's ranking reflects the same settlement pattern that pushed Johnson, Olson, and Larson upward, with Scandinavian families filling railroad towns and homesteads alike."

  - rank: 8
    name: Smith
    count: 3220
    ratio: 232
    origin: english
    type: Occupational
    meaning: "Smith comes from Old English for a metalworker or blacksmith. It remains a top North Dakota surname because every frontier settlement needed blacksmiths and because broad national migration eventually carried Smith into every county, even if Scandinavian names outrank it here."

  - rank: 9
    name: Hanson
    count: 3058
    ratio: 244
    origin: scandinavian
    type: Patronymic
    meaning: "Hanson means 'son of Hans,' a common name in both Scandinavian and German families. In North Dakota it sits near the top because Scandinavian immigration was so large that even secondary patronymics remained statewide staples."

  - rank: 10
    name: Thompson
    count: 2533
    ratio: 295
    origin: english
    type: Patronymic
    meaning: "Thompson means 'son of Thomas.' It reflects the broader English-speaking migration into North Dakota, but it ranks below several Nordic surnames because the state's immigrant core was not chiefly Anglo-American."

  - rank: 11
    name: Schmidt
    count: 2380
    ratio: 314
    origin: german
    type: Occupational
    meaning: "Schmidt is the German equivalent of Smith, meaning a blacksmith. Its prominence in North Dakota is a clear sign that many German families, including Germans from Russia, kept the original spelling instead of converting it to Smith."

  - rank: 12
    name: Erickson
    count: 2342
    ratio: 319
    origin: scandinavian
    type: Patronymic
    meaning: "Erickson means 'son of Erik.' It remained unusually visible in North Dakota because Erik and Eriksson were common in Scandinavian immigrant communities that spread west from the Red River Valley onto the open prairie."

  - rank: 13
    name: Brown
    count: 1893
    ratio: 395
    origin: english
    type: Descriptive
    meaning: "Brown began as a nickname for someone with brown hair, complexion, or clothing. In North Dakota it represents the broad national surname layer that sits beneath the state's more distinctive Scandinavian and German clusters."

  - rank: 14
    name: Berg
    count: 1707
    ratio: 438
    origin: scandinavian
    type: Habitational
    meaning: "Berg means 'mountain' or 'hill' in Scandinavian and German naming traditions. In North Dakota it is especially telling because many Norwegian immigrants preserved short farm-name surnames instead of shifting to more general English forms."

  - rank: 15
    name: Carlson
    count: 1700
    ratio: 440
    origin: scandinavian
    type: Patronymic
    meaning: "Carlson means 'son of Carl.' Its top-20 rank shows how deeply Scandinavian naming remained embedded in North Dakota, where even a second tier of Nordic patronymics outruns larger national surnames such as Williams and Jones."

  - rank: 16
    name: Lee
    count: 1525
    ratio: 490
    origin: english
    type: Habitational
    meaning: "Lee originally referred to a clearing or meadow in Old English. In North Dakota it functions less as an ethnic marker than as a broad American surname carried in by railroad workers, town builders, and later urban migration."

  - rank: 17
    name: Davis
    count: 1403
    ratio: 533
    origin: welsh
    type: Patronymic
    meaning: "Davis means 'son of David.' It is common nationwide, but in North Dakota it ranks below several Scandinavian names because the state's settlement history pulled so heavily from Norwegian and Swedish farming communities."

  - rank: 18
    name: Martin
    count: 1398
    ratio: 535
    origin: french
    type: Patronymic
    meaning: "Martin comes from the Latin name Martinus. In North Dakota it appears across several traditions at once, including French-Canadian Red River lines, German Catholic communities, and the wider English-speaking migration."

  - rank: 19
    name: Jacobson
    count: 1301
    ratio: 574
    origin: scandinavian
    type: Patronymic
    meaning: "Jacobson means 'son of Jacob.' Its unusually high place in North Dakota is another clue that Scandinavian naming patterns remained intact longer here than in many other states."

  - rank: 20
    name: Keller
    count: 1231
    ratio: 607
    origin: german
    type: Occupational
    meaning: "Keller is a German surname associated with a cellarer or keeper of provisions. Its top-20 status fits the strong German and German-Russian imprint on central and south-central North Dakota."

unique_surnames:
  - name: Haugen
    state_rank: 25
    national_rank: 3535
    origin: norwegian
    why: "Haugen is a classic Norwegian farm-name surname meaning hill or mound. North Dakota's very high ranking reflects the same Norwegian settlement stream that made the state one of the strongest Scandinavian surname regions in the country."

  - name: Dockter
    state_rank: 53
    national_rank: 13182
    origin: german
    why: "Dockter appears far more often in North Dakota than nationally, with Forebears placing a quarter of all U.S. bearers in the state. That concentration fits the dense German-speaking farm communities of central and south-central North Dakota, where German-Russian settlement stayed locally dominant for generations."

  - name: Halvorson
    state_rank: 57
    national_rank: 5121
    origin: norwegian
    why: "Halvorson means 'son of Halvor,' a distinctly Norwegian given name. Its concentration in North Dakota reflects the same late nineteenth-century migration that made Norwegians the state's largest foreign-born group by 1910."

  - name: Poitra
    state_rank: 76
    national_rank: 34050
    origin: french
    why: "Poitra is strongly associated with North Dakota's Métis and Turtle Mountain communities. The State Historical Society identifies Pembina as a major fur-trade center where the Métis emerged from European trader and Native families, and Forebears shows nearly two-thirds of all U.S. Poitras live in North Dakota."

  - name: Kuntz
    state_rank: 35
    national_rank: 2996
    origin: german
    why: "Kuntz is a German surname that overperforms sharply in North Dakota, where Forebears places 5.91 percent of all U.S. bearers. Its concentration matches the state's German-Russian settlement belt, especially in the counties that filled with German-speaking farm families before World War I."

etymology_groups:
  - type: Scandinavian Patronymics
    icon: fa-solid fa-person
    description: "North Dakota's top 20 is dominated by Scandinavian patronymics. Johnson, Anderson, Olson, Nelson, Larson, Peterson, Hanson, Erickson, Carlson, and Jacobson all descend from a father's given name, and they rank so high because Norwegians and other Scandinavians arrived in exceptional numbers between the 1880s and the early 1900s."
    examples:
      - Johnson (son of John)
      - Olson (son of Ole)
      - Larson (son of Lars)
      - Jacobson (son of Jacob)

  - type: German Work Names
    icon: fa-solid fa-hammer
    description: "German surnames stand out in North Dakota more than in many neighboring states. Miller, Schmidt, and Keller all sit in the top 20, and just below them are Schneider, Meyer, Wagner, Weber, and Becker, a pattern that reflects the long footprint of German and German-Russian farm settlement."
    examples:
      - Miller (grain miller)
      - Schmidt (blacksmith)
      - Keller (keeper of provisions)
      - Schneider (tailor)

  - type: Farm and Place Names
    icon: fa-solid fa-map-location-dot
    description: "North Dakota preserved many short farm-name and landscape surnames, especially from Norway. Berg, Haugen, Dahl, Lund, Ness, and Strand all refer to natural features or farm places, and their visibility points to immigrant communities that kept older naming habits intact on the prairie."
    examples:
      - Berg (mountain or hill)
      - Haugen (hill or mound)
      - Dahl (valley)
      - Lund (grove)

faq:
  - question: "Why are Scandinavian last names so common in North Dakota?"
    answer: "They are so common because North Dakota attracted very large numbers of Norwegian and other Scandinavian immigrants during the Great Dakota Boom. North Dakota Studies notes that from 1892 to 1905 almost half of all immigrants into the state were Scandinavians, and that history still shows up clearly in names like Johnson, Olson, Nelson, Larson, Peterson, and Erickson."

  - question: "Why is Smith not the most common last name in North Dakota?"
    answer: "Smith is not first in North Dakota because the state's heaviest settlement came from Scandinavian farm families rather than from older English-name populations. That pushed Johnson, Anderson, Olson, and Nelson above Smith, which would be the leading surname in many other states."

  - question: "Why is Poitra so common in North Dakota?"
    answer: "Poitra is common in North Dakota because the state preserved strong Métis and Turtle Mountain family networks. The Red River and Pembina fur-trade world produced large Métis communities early, and the surname remained especially concentrated in northern North Dakota into the present."

