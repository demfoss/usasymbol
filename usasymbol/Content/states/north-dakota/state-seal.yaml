seo_title: 'North Dakota State Seal | Liberty and Union'
seo_description: "Why does North Dakota's seal quote a Massachusetts senator? Daniel Webster's 1830 words on federal union became the 39th state's official motto."
hero_image: /images/seals/north-dakota/seal.webp
hero_image_alt: Great Seal of the State of North Dakota, official emblem adopted in 1889
hero_image_caption: The Great Seal of North Dakota, adopted in 1889 as the state prepared for admission to the Union. The design combines a central tree, wheat bundles, a plow, an anvil and sledge, a Native rider pursuing a buffalo, and the motto Liberty and Union, Now and Forever, One and Inseparable.
intro_text: "North Dakota's state seal was adopted in 1889 as the territory became the 39th state. The seal itself bears the date October 1st, 1889, when voters approved the state constitution. Its motto, Liberty and Union, Now and Forever, One and Inseparable, comes directly from Daniel Webster's 1830 Senate speech defending federal union against nullification."
