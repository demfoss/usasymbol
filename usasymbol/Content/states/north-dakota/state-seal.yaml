type: State Seal
state: North Dakota
name: Great Seal of North Dakota
adopted_year: 1889
is_official: true
legislation: N.D. Cent. Code § 54-02-03
meaning: "The Great Seal of North Dakota was designed at the 1889 constitutional convention to capture two defining facts about the new state: its agricultural identity, rooted in the wheat fields and settlers who made North Dakota viable as a state, and the Great Plains landscape that shaped its character. The motto, Liberty and Union, Now and Forever, One and Inseparable, drawn from Daniel Webster's 1830 Senate speech, placed North Dakota's founding within the larger American argument about whether federal union was permanent."
meaning_title: Great Seal of North Dakota Meaning
