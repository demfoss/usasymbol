sections:
  - id: overview
    icon: fa-solid fa-music
    title: North Dakota State Song
    paragraphs:
      - "\"North Dakota Hymn\" is North Dakota's official state song, adopted in 1947. Poet James Foley wrote the words in 1926, and Dr. C.S. Putnam arranged them to fit the existing tune known as the Austrian Hymn, giving the song its solemn, reverent character."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"North Dakota Hymn\" Explained"
    paragraphs:
      - "The song is a slow, dignified tribute to North Dakota's prairies and people, closer in tone to a church hymn than a folk ballad. Its melody is borrowed from the Austrian Hymn, the same tune long associated with hymns like \"Glorious Things of Thee Are Spoken.\""
      - "James Foley, a North Dakota poet, wrote the lyrics in 1926 at the request of state Superintendent of Public Instruction Minnie Nielson, who wanted a song schoolchildren could sing. Dr. C.S. Putnam then arranged the words to the borrowed hymn tune, adding touches of ragtime syncopation to the arrangement."
      - "The song was first performed publicly at the Bismarck City Auditorium in 1927, more than twenty years before it became official."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "North Dakota Hymn" Represents North Dakota
    paragraphs:
      - "North Dakota adopted the song because it had already been used in schools for two decades by the time lawmakers acted, giving it a built-in familiarity across the state. Its calm, reverent tone matched how the state wanted to present itself in a formal anthem."
      - "The song's connection to state education, through its origin as a request from the superintendent of public instruction, gave it an institutional foothold that other candidate songs lacked."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"North Dakota Hymn\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "North Dakota Hymn" Became North Dakota's State Song
    paragraphs:
      - "The North Dakota Legislative Assembly adopted \"North Dakota Hymn\" as the official state song on March 15, 1947, more than twenty years after Foley wrote the words for the state's schoolchildren. In 2025, North Dakota separately adopted \"Dancing Dakota,\" written by musician Chuck Suchy, as the state's official waltz."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of North Dakota

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"North Dakota Hymn\" Facts"
    facts:
      - "North Dakota adopted \"North Dakota Hymn\" as its official state song in 1947."
      - "James Foley wrote the words in 1926 at the request of the state's superintendent of public instruction."
      - "The song is set to the tune of the Austrian Hymn, the same melody used for other well-known hymns."
      - "It was first performed publicly at the Bismarck City Auditorium in 1927."
      - "North Dakota added a separate official state waltz, \"Dancing Dakota,\" in 2025."

