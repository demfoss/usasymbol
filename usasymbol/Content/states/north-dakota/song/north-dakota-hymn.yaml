faq:
  - question: What is North Dakota's state song?
    answer: "North Dakota's official state song is \"North Dakota Hymn,\" adopted in 1947."
  - question: Who wrote North Dakota's state song?
    answer: "James Foley wrote the words in 1926, and Dr. C.S. Putnam arranged the music."
  - question: When did North Dakota adopt "North Dakota Hymn" as its state song?
    answer: "The North Dakota Legislative Assembly adopted the song on March 15, 1947."
  - question: Does North Dakota have more than one official song?
    answer: "Yes. North Dakota added \"Dancing Dakota\" as its official state waltz in 2025."

