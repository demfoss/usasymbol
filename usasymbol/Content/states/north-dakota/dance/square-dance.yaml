faq:
  - question: What is North Dakota's state dance?
    answer: "North Dakota's official state dance is square dance, adopted in 1995 as the state American folk dance."
  - question: When did North Dakota adopt square dance as its state dance?
    answer: "North Dakota adopted square dance in 1995."
  - question: Why did North Dakota choose square dance?
    answer: "Square dance fit North Dakota's existing prairie community-hall tradition and arrived during a national campaign by callers' associations urging states to adopt it as an official folk dance."
  - question: Is square dance the same in every state?
    answer: "The basic formation and calls are shared nationally, though many states, including North Dakota, adopted it separately as their own state folk dance during the 1970s through 1990s."

