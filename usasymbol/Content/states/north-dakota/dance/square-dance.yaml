sections:
  - id: overview
    icon: fa-solid fa-music
    title: North Dakota State Dance
    paragraphs:
      - "North Dakota named square dance its official state American folk dance in 1995. The designation recognized a set dance that had already anchored community gatherings across the state's small towns and rural halls for decades."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square formation, each pair facing the center. A caller directs the group through a sequence of figures, so dancers respond to spoken calls rather than a fixed memorized routine."
      - "Live or recorded string-band music sets the tempo, usually built around fiddle, guitar, and banjo. The look on the floor is brisk and cooperative, with couples circling, crossing, and exchanging partners in patterns that resolve back to the original square."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Arrange four couples in a square, each pair facing the center with partners side by side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner before the calling begins."
      - title: "Circle Left"
        description: "Join hands with the full square and step together in a circle to the left, then reverse on the call."
      - title: "Do-Si-Do with Your Partner"
        description: "Walk forward and pass your partner back to back without turning, then return to place."
      - title: "Promenade Around the Square"
        description: "Take your partner's hands and walk together around the outside of the square to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents North Dakota
    paragraphs:
      - "Starting in the 1970s, square-dance callers' associations and dance organizations ran a national campaign urging states to name square dance an official folk dance. North Dakota's 1995 adoption came as part of that broader wave."
      - "The dance also fit the state's own social pattern, where small-town and rural community halls have long hosted gatherings built around live string-band music and group dancing. Square dance gave that existing prairie tradition an official name."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became the State Dance
    paragraphs:
      - "The North Dakota Legislative Assembly designated square dance the state's official American folk dance in 1995."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "North Dakota adopted square dance as its official state American folk dance in 1995."
      - "The designation places square dance alongside other North Dakota state symbols recognized by the Legislative Assembly."
      - "North Dakota's adoption came during a decades-long national push by square-dance organizations to have states name it an official folk dance."
      - "Square dance in North Dakota is traditionally danced to live string-band music at community halls."

