hero_image_caption: The northern pike became North Dakota's state fish in 1969.
intro_text: North Dakota's state fish is the northern pike, a long, toothy game fish known for its large size, adopted in 1969. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of North Dakota?
  paragraphs:
  - The northern pike is the official fish of North Dakota. State lawmakers made it the state fish in 1969. Its scientific name is Esox lucius.
  - The northern pike is native to North Dakota, and anglers catch it in lakes and rivers across the state.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Northern Pike
  paragraphs:
  - The northern pike has a long body and a long snout full of large, sharp teeth. Its body is olive green to dark, with rows of pale spots running along its sides.
  - One easy way to spot a pike is its dorsal fin. It sits far back on the body, close to the tail. Scales also cover its whole cheek.
  - Pike have a slimy coating that protects their skin. In North Dakota, they can grow longer than 40 inches and live into their teens.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In early 1969, North Dakota lawmakers introduced a resolution to name the northern pike the state fish. The state Senate and House both approved it, and it became official on March 3, 1969.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why North Dakota Chose the Northern Pike
  paragraphs:
  - The 1969 resolution said that fishing had become much more popular in North Dakota and that it brought tourism to the state. It also said that North Dakota's northern pike had become known across the nation for their huge size.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Northern Pike
  paragraphs:
  - Northern pike live in lakes, reservoirs, and rivers all over North Dakota. Lake Sakakawea and Devils Lake are among the best-known places to catch big pike.
  - Pike also live in the Missouri River system, including Lake Oahe in the south-central part of the state.
