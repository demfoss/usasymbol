- id: facts
  icon: fa-solid fa-lightbulb
  title: Northern Pike Facts
  facts:
  - Adopted in 1969 by the North Dakota Legislature.
  - Scientific name is Esox lucius.
  - Can grow longer than 40 inches in North Dakota.
  - Its dorsal fin sits far back on its body, near the tail.
  - North Dakota's record pike weighed 37 pounds, 8 ounces and was caught in Lake Sakakawea in 1968.
faq:
- question: What is North Dakota's state fish?
  answer: North Dakota's state fish is the northern pike, a long game fish with sharp teeth and pale spots on its sides.
- question: When did North Dakota adopt the Northern Pike?
  answer: North Dakota lawmakers made the northern pike the state fish on March 3, 1969.
- question: Why did North Dakota choose the Northern Pike?
  answer: Lawmakers pointed to how popular fishing had become in the state. They also noted that North Dakota's pike were known nationwide for their huge size.
- question: How big do northern pike get in North Dakota?
  answer: In North Dakota, northern pike can grow longer than 40 inches. The state record pike weighed 37 pounds, 8 ounces.
- question: Is the northern pike native to North Dakota?
  answer: Yes. The northern pike is a native fish in North Dakota. It is one of two members of the pike family found in the state, along with the muskellunge.
