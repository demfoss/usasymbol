faq:
  - question: "What is North Dakota's state horse?"
    answer: "North Dakota's honorary state equine is the Nokota horse, designated on March 30, 1993. The Nokota is a rare heritage breed descended from horses confiscated when Sitting Bull surrendered at Fort Buford in 1881. These horses represent Great Plains indigenous culture and the final decades of freedom for Plains tribes. The designation is honorary rather than a full state horse designation."
  
  - question: "When was the Nokota horse designated as North Dakota's honorary equine?"
    answer: "The Nokota horse became North Dakota's honorary state equine in 1993 through House Concurrent Resolution No. 3031. The designation recognized these rare horses that once roamed the Badlands and their connection to Native American heritage, particularly Lakota Sioux culture during Sitting Bull's era."
  
  - question: "Why did North Dakota choose the Nokota horse?"
    answer: "North Dakota chose the Nokota horse because it represents authentic indigenous heritage and frontier history. These horses descended from Lakota Sioux herds used by warriors including Sitting Bull before his surrender in 1881. The breed's near-extinction and rescue parallels broader themes of cultural survival. The Nokota embodies North Dakota's complex history including Native American culture, military conflicts, and the transformation of Great Plains landscapes."
  
  - question: "What happened to the wild Nokota horses in Theodore Roosevelt National Park?"
    answer: "Between 1978 and 1986, the National Park Service removed hundreds of wild horses from Theodore Roosevelt National Park through roundups and sales. Park officials classified horses as non-native species requiring removal despite their historical presence since the 1880s. Leo and Frank Kuntz, ranchers from Linton, rescued foundation Nokota horses by purchasing them from park removal programs and established conservation breeding programs."
  
  - question: "How is the Nokota horse connected to Sitting Bull?"
    answer: "The Nokota bloodline traces to horses confiscated when Sitting Bull surrendered at Fort Buford, North Dakota, on July 19, 1881. Military authorities seized approximately 250 horses from his band, selling them at auction or distributing them to area ranchers. These dispersed horses formed foundation stock that eventually concentrated in the Badlands region. The Nokota represents living connection to Lakota horse culture and the final years of freedom on the Great Plains."
  
  - question: "Where can I see Nokota horses today?"
    answer: "Nokota horses exist primarily in private conservation herds rather than public facilities. The Nokota Horse Conservancy maintains foundation breeding stock and may offer educational programs by arrangement. Several private North Dakota ranches breed Nokotas and may welcome visitors by appointment. Theodore Roosevelt National Park has wild horses visible in the South Unit, but current horses represent mixed breeding rather than purebred Nokotas after the original stock was removed."
  
  - question: "How many Nokota horses exist today?"
    answer: "The worldwide Nokota horse population is estimated at fewer than 1,000 horses, making the breed critically rare. Exact numbers remain uncertain due to breeding program privacy and geographic dispersal. The Livestock Conservancy lists the Nokota as a critically endangered heritage breed requiring dedicated conservation efforts to prevent extinction."
  
  - question: "What makes the Nokota horse different from other breeds?"
    answer: "Nokota horses possess unique genetic ancestry combining Spanish colonial horse bloodlines, Native American selective breeding, and possible French Canadian horse influence. Genetic testing revealed markers found in no other documented breed. Physically, Nokotas show distinctive blue roan coloring, sloping croup, angular hindquarters, and hawk-like head profile. They demonstrate exceptional endurance, intelligence, and hard hooves adapted to harsh northern Plains conditions."
  
  - question: "Why is it called honorary state equine instead of state horse?"
    answer: "The 1993 designation specified 'honorary state equine' rather than full state horse status, possibly reflecting political compromise or existing symbol categories. The honorary designation still provided official recognition for conservation efforts and public education about breed history. Despite the honorary qualifier, the Nokota remains North Dakota's only officially recognized state horse symbol."

