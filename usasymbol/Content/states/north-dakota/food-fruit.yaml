intro_text: "North Dakota's state fruit is the chokecherry, adopted in 2007 to recognize a wild fruit common across the state's prairies and river bottoms. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is North Dakota's State Fruit?"
    paragraphs:
      - "The chokecherry is North Dakota's official state fruit, designated by the North Dakota Legislative Assembly in 2007. Chokecherries grow wild on shrubs and small trees across the state's prairies and along riverbanks."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Chokecherry"
    paragraphs:
      - "Chokecherries are small, dark red to purple fruits that grow in clusters on wild shrubs. Their tart, astringent taste gives the fruit its name, and they are most often used cooked into syrups, jellies, and wine rather than eaten raw."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Chokecherry Became North Dakota's State Fruit"
    paragraphs:
      - "The North Dakota Legislative Assembly designated the chokecherry the official state fruit in 2007, following a campaign supported by North Dakota students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Dakota Chose the Chokecherry"
    paragraphs:
      - "Chokecherries grow wild across North Dakota's prairies and have long been gathered by families and Native communities for syrup and jelly, and the town of Milnor hosts an annual Chokecherry Festival celebrating the fruit."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Chokecherry Comes From in North Dakota"
    paragraphs:
      - "Milnor, in southeastern North Dakota, hosts the annual North Dakota Chokecherry Festival, celebrating the wild fruit's role in the state's food traditions."
    sites:
