name_meaning:
  heading: What Does North Dakota Mean?
  paragraphs:
  - North Dakota and South Dakota both reached statehood on November 2, 1889. Dakota comes from the Dakota people and is commonly translated as friend or ally.
  - The name is Indigenous, while the North part records the division of Dakota Territory. The symbols in this guide lean into open prairie, settlement, shelterbelts, and the Canadian border rather than a single city-centered identity.
  - North Dakota's postal abbreviation is ND, and residents are North Dakotans. Peace Garden State is the official nickname here, while Flickertail and Roughrider identities also appear in state history.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Dakota refers to the Dakota people and is commonly translated as friend or ally.
    - label: Statehood
      text: North Dakota became a state in 1889.
    - label: Motto
      text: Liberty and Union, Now and Forever, One and Inseparable comes from a national Unionist phrase associated with Daniel Webster.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to North Dakota, a northern Great Plains state bordering Canada.
    - label: Territory
      text: The name also points back to Dakota Territory, which later divided into North Dakota and South Dakota.
    - label: People
      text: People from North Dakota are called North Dakotans.
  - heading: Nicknames and Short Forms
    items:
    - label: Peace Garden State
      text: Official nickname tied to the International Peace Garden on the U.S.-Canada border.
    - label: Flickertail State
      text: Older informal nickname connected with Richardson ground squirrels.
    - label: Abbreviation
      text: ND; older short form N.D.
editorial:
  heading: What North Dakota's Symbols Say About the State
  paragraphs:
  - The [Peace Garden State nickname](/states/north-dakota/nickname) gives North Dakota an unusually diplomatic public image. It is not about mountains, mines, or a crop; it points to an international border park and a peace theme.
  - The [American elm](/states/north-dakota/tree) matters because trees were not a background detail on the open prairie. Elm shelterbelts helped make farmsteads and towns more livable against wind, dust, and winter exposure.
  - The [Nokota horse](/states/north-dakota/mammal/nokota-horse) and [wild prairie rose](/states/north-dakota/flower) keep the hub tied to plains history instead of generic state-symbol language. They make North Dakota feel sparse, wind-shaped, and specific.
faq:
- question: What is North Dakota's most famous state symbol?
  answer: The [Peace Garden State nickname](/states/north-dakota/nickname) is the clearest shorthand because it appears in official identity and points to the International Peace Garden.
- question: What is North Dakota's state bird?
  answer: The [western meadowlark](/states/north-dakota/bird) became North Dakota's bird symbol in 1947.
- question: What is North Dakota's state flower?
  answer: The [wild prairie rose](/states/north-dakota/flower), adopted in 1907, is North Dakota's flower emblem.
- question: Why is the Nokota horse listed for North Dakota?
  answer: The [Nokota horse](/states/north-dakota/mammal/nokota-horse) gives the hub a plains horse symbol tied to North Dakota history and landscape.
- question: How many official state symbols does North Dakota have?
  answer: This North Dakota collection includes the flag, western meadowlark, wild prairie rose, American elm, motto, nickname, milk, colors, and Nokota horse.
