seo_description: "North Dakota symbols include the wild prairie rose, western meadowlark, American elm, Nokota horse, and Peace Garden State nickname."
snippet_answer: North Dakota's wild prairie rose is the most recognized of the state's official state symbols and has represented the state since 1907. The western meadowlark, American elm, Nokota horse, Liberty and Union motto, and Peace Garden State nickname pair a deep prairie identity with border-state history and conservation.
