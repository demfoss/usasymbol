seo_title: "North Dakota State Tree: American Elm"
seo_description: "North Dakota designated the American Elm as state tree in 1947. Learn why this hardy tree represents North Dakota's prairie towns and shelterbelts."

intro_text: "American Elm serves as North Dakota's state tree, designated in 1947 to honor a species that brought shade to the treeless prairie and remains a notable entry in the [list of U.S. state trees](/symbols/trees). This deciduous hardwood grows 60 to 80 feet tall in North Dakota towns and shelterbelts, providing crucial windbreaks on the Great Plains. Early settlers planted elm to protect homesteads from prairie winds and create livable communities across North Dakota's grasslands. The tree's tolerance of extreme cold, drought, and wind made it essential for transforming North Dakota from treeless prairie to a state with tree-lined streets and protective shelterbelts."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the North Dakota State Tree?"
    paragraphs:
      - "North Dakota's official state tree is the American Elm, a large deciduous hardwood native to eastern North America. This elm grows 60 to 80 feet tall in North Dakota, with exceptional specimens reaching 100 feet. The trunk measures two to four feet in diameter on mature trees. American elm tolerates North Dakota's extreme climate better than most hardwoods, surviving temperatures from 110°F summer heat to -40°F winter cold. The tree grows relatively fast for North Dakota conditions, adding 12 to 18 inches per year in favorable years. Elms typically live 150 to 200 years in North Dakota. The species proved invaluable for creating windbreaks and shelterbelts that protect North Dakota farms and towns from relentless prairie winds."
      - "The bark appears gray-brown with deep vertical furrows and flat-topped ridges creating a diamond pattern. Young trees show relatively smooth bark that develops furrows as the tree ages. The leaves measure three to six inches long with a distinctive asymmetrical base - one side of the leaf extends beyond the other where it attaches to the twig. This lopsided base provides certain identification. The leaf edges show doubly serrated teeth - large teeth with smaller teeth along them. Leaves emerge light green in spring, turn dark green in summer, and change to yellow in fall before dropping. The vase-shaped crown creates the classic elm silhouette - a tall trunk dividing into ascending branches that arch outward and upward."
      - "American elm grows throughout North Dakota where humans planted it, particularly in towns, farmsteads, and shelterbelts. The species is not native to North Dakota's treeless prairie but was introduced by settlers who needed trees for windbreaks and shade. North Dakota's natural tree cover before settlement occurred only in river valleys along the Missouri, Red, and other major waterways. Settlers systematically planted elms across the prairie landscape, creating the tree-lined streets and protective shelterbelts that characterize North Dakota today. The tree thrives in North Dakota's deep prairie soils when provided adequate water. Dutch elm disease devastated North Dakota elms starting in the 1970s, killing thousands of trees in towns across the state. Disease-resistant elm varieties now allow North Dakotans to replant this historically important species."

  - id: name
    icon: "fa-solid fa-tag"
    title: "North Dakota State Tree Name"
    paragraphs:
      - "The official name is American Elm, distinguishing it from European and Asian elm species. North Dakotans call it simply elm or white elm, the latter referring to the light-colored wood. The scientific name Ulmus americana combines Ulmus (classical Latin for elm) with americana indicating North American origin. Early North Dakota settlers called these trees prairie elm when they planted them across grasslands. The genus Ulmus includes about 35 species worldwide."
      - "Some North Dakota references use the name water elm, though the tree doesn't require wetland conditions. Pioneers sometimes called large specimens cathedral trees for the arching branches. The species belongs to the Ulmaceae family, the elm family. North Dakota's American Elm is the same species found throughout eastern North America, though trees growing in North Dakota face harsher conditions than elms in milder climates. North Dakota elms develop remarkable cold hardiness, surviving winter temperatures that would kill elms in southern states."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why American Elm Became the North Dakota State Tree"
    paragraphs:
      - "North Dakota designated the American Elm as its official state tree in 1947. The North Dakota Legislature passed the designation during the 1947 session. The legislation recognized elm as the tree that transformed North Dakota's prairie landscape and made farm life tenable. By 1947, American elm had become the dominant tree in North Dakota towns and the most important species in shelterbelts protecting farms across the state. The designation honored the tree that brought shade, beauty, and wind protection to the treeless Great Plains, aligning with [the Peace Garden State identity](/states/north-dakota/nickname/the-peace-garden-state)."
      - "North Dakota selected American Elm because it represented the state's transformation from treeless grassland to a landscape where trees made human settlement sustainable. Before European settlement, North Dakota was almost entirely treeless prairie and grassland. Only narrow strips of cottonwood and willow grew along river valleys. The lack of trees meant no windbreaks to protect against winter blizzards and summer dust storms. Early homesteaders faced brutal conditions with winds sweeping unobstructed across hundreds of miles of open prairie. Settlers quickly learned they needed trees to survive. American elm proved ideal for North Dakota conditions - it tolerated cold, drought, wind, and alkaline soils common across the state, in the same spirit as [North Dakota's state motto](/states/north-dakota/motto/liberty-and-union-now-and-forever-one-and-inseparable)."
      - "The tree played a crucial role in North Dakota's agricultural development. Starting in the 1870s, North Dakota farmers planted elm shelterbelts around farmsteads and fields. These windbreaks reduced wind speed by up to 80 percent on the leeward side, protecting buildings, livestock, and crops. Shelterbelts prevented soil erosion that had devastated farms during dust bowl years. The trees trapped snow in winter, providing moisture to fields when snow melted in spring. North Dakota communities lined streets with elms, transforming dusty prairie towns into livable places with shade and beauty. Cities like Fargo, Bismarck, and Grand Forks became known for magnificent elm-lined avenues. The Civilian Conservation Corps planted thousands of miles of shelterbelts across North Dakota during the 1930s, with American elm as a primary species. These plantings helped North Dakota weather the Dust Bowl and established the state's modern agricultural landscape. The elm designation in 1947 came as North Dakota celebrated success in transforming bare prairie into productive farmland protected by millions of trees. American elm symbolized human perseverance, agricultural innovation, and the creation of livable communities in one of North America's harshest climates. The tree represented North Dakota's accomplishment in making the Great Plains habitable through systematic tree planting."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Dakota State Tree Facts"
    facts:
      - "North Dakota designated American Elm in 1947, recognizing the tree's role in transforming treeless prairie into protected farmland"
      - "Before settlement, North Dakota was almost entirely treeless prairie - only river valleys had natural tree cover"
      - "Elm shelterbelts reduce wind speed by up to 80 percent, protecting North Dakota farms from prairie winds and preventing soil erosion"
      - "The Civilian Conservation Corps planted thousands of miles of shelterbelts across North Dakota in the 1930s with American elm as a primary species"
      - "American elm tolerates temperature extremes from 110°F to -40°F, making it one of few trees suited to North Dakota's harsh climate"
      - "Dutch elm disease killed thousands of North Dakota elms starting in the 1970s, devastating tree-lined streets across the state"
      - "The asymmetrical leaf base where one side extends beyond the other provides certain identification for elm species"
      - "Disease-resistant elm varieties developed since the 1990s allow North Dakota communities to replant this historically important tree"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "North Dakota State Tree and Flower"
    paragraphs:
      - "North Dakota's state flower is the Wild Prairie Rose (Rosa arkansana), designated in 1907. The state adopted its floral symbol 40 years before choosing American elm. Both symbols represent North Dakota's transformation from wild prairie to settled landscape. The low-growing wild rose blooms pink across native prairies and roadsides, while American elm towers over towns and farmsteads. Prairie roses flower in June as elm leaves reach full size. Together these symbols capture North Dakota's character - the wild prairie rose representing the original grassland and the American elm representing human settlement and agricultural development that transformed the state; see [the state flower page](/states/north-dakota/flower/wild-prairie-rose)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a North Dakota American Elm"
    paragraphs:
      - "Check the leaf base for certain identification. Where the leaf attaches to the twig, one side of the leaf base extends noticeably beyond the other, creating an asymmetrical or lopsided appearance. This uneven base is diagnostic for all elm species. The leaves measure three to six inches long with doubly serrated edges - large teeth with smaller teeth along them. The upper leaf surface feels slightly rough. The undersides show fine hairs. Leaves attach to twigs in an alternate arrangement with one leaf per node. Fall color turns clear yellow before leaves drop."
      - "The bark develops a distinctive pattern on mature North Dakota elms. Look for gray-brown bark with deep vertical furrows separated by flat-topped ridges. The ridges often show diamond patterns where furrows intersect. The bark texture feels rough and corky. Young elm bark starts relatively smooth and light gray, gradually developing furrows and darker color as trees age. Very old trees show thick, deeply furrowed bark with irregular plated ridges. Twigs are slender and somewhat zigzagging with pointed buds."
      - "The overall form shows the classic vase shape that made elms famous. A straight trunk extends 15 to 30 feet before dividing into several major ascending limbs. These limbs arch outward and upward, creating the characteristic vase or fountain silhouette. The crown spreads 40 to 60 feet wide on mature trees, providing extensive shade. This spreading form made American elm ideal for North Dakota streets and farmyards. In spring before leaves emerge, look for clusters of small greenish flowers that develop into flat, round, papery seeds called samaras. The seeds measure about half an inch across with a notch at one end. They mature and disperse in spring, often carpeting ground beneath North Dakota elms."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the North Dakota State Tree Symbolizes"
    paragraphs:
      - "American Elm represents North Dakota's pioneer determination and agricultural innovation. The tree symbolizes human ability to adapt harsh environments for settlement through systematic tree planting. For North Dakotans, elm evokes memories of shaded main streets in prairie towns and protective shelterbelts around family farms. The species embodies the transformation from treeless grassland to a landscape where trees make life tenable. Despite Dutch elm disease devastating many trees, the elm remains North Dakota's symbol because disease-resistant varieties now allow restoration. The tree represents North Dakota's resilience - facing challenges, adapting, and persevering to create and maintain livable communities on the Great Plains, including habitat for [the Western Meadowlark state bird](/states/north-dakota/bird/western-meadowlark)."

faq:
  - question: "What is the North Dakota state tree?"
    answer: "The American Elm (Ulmus americana) is North Dakota's official state tree. The North Dakota Legislature designated it in 1947, recognizing the tree's role in transforming treeless prairie into protected farmland and livable towns."
  
  - question: "What is the North Dakota state tree called?"
    answer: "North Dakota's state tree is called American Elm. The scientific name is Ulmus americana. It's also known as white elm for the wood color or prairie elm when planted on grasslands. Early settlers called large specimens cathedral trees."
  
  - question: "When was the North Dakota state tree adopted?"
    answer: "North Dakota designated the American Elm as its official state tree in 1947. The Legislature passed the designation during the 1947 session, the same year Massachusetts chose American elm, though for different reasons - Massachusetts for New England heritage, North Dakota for prairie windbreaks."
  
  - question: "Why is the American Elm North Dakota's state tree?"
    answer: "North Dakota chose American Elm because it transformed the state from treeless prairie into protected farmland. Before settlement, North Dakota was almost entirely grassland with no natural tree cover except river valleys. American elm tolerated extreme cold, drought, and wind. Settlers planted elm shelterbelts that reduced wind speed by 80 percent, protecting farms and preventing soil erosion. The trees made prairie towns livable by providing shade. The Civilian Conservation Corps planted thousands of miles of elm shelterbelts in the 1930s, helping North Dakota weather the Dust Bowl."
  
  - question: "What is the North Dakota state tree name?"
    answer: "The name is American Elm. The scientific name is Ulmus americana - Ulmus is Latin for elm, and americana indicates North American origin. The 'American' distinguishes it from European and Asian elm species."
  
  - question: "Where does the North Dakota state tree grow?"
    answer: "The American Elm grows throughout North Dakota in towns, farmsteads, and shelterbelts where settlers planted it. The species is not native to North Dakota's treeless prairie but was introduced for windbreaks and shade. Natural elm habitat exists only in eastern river valleys. American elm grows naturally across eastern North America from Saskatchewan to Texas."
  
  - question: "What are some facts about the North Dakota state tree?"
    answer: "The American Elm grows 60 to 80 feet tall and tolerates temperatures from 110°F to -40°F. Before settlement, North Dakota was treeless prairie. Elm shelterbelts reduce wind by 80 percent. The CCC planted thousands of miles of shelterbelts with elm in the 1930s. Dutch elm disease killed thousands of North Dakota elms starting in the 1970s. The asymmetrical leaf base provides certain identification. Disease-resistant varieties now allow replanting."
  
  - question: "How do you recognize the North Dakota state tree?"
    answer: "Look for asymmetrical leaf bases where one side extends beyond the other at the twig attachment. Leaves are three to six inches long with doubly serrated edges. Gray-brown bark has deep vertical furrows creating diamond patterns. The tree forms a classic vase shape with a trunk dividing into ascending, arching limbs. The crown spreads 40 to 60 feet wide. Small papery seeds appear in spring."

