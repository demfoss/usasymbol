sections:
  - id: "official-designation"
    title: "Official Status and History"
    style: "default"
    paragraphs:
      - "North Dakota has not formally designated official state colors through legislative statute. This makes it one of a minority of U.S. states that lack a statutory color designation. In the absence of official state colors, green and yellow have emerged as the most widely associated colors through the prominent identity of North Dakota State University (NDSU), the state's land-grant university chartered in 1890 in Fargo. NDSU's green and yellow branding — applied across a university campus that serves approximately 12,000 students and operates one of the most successful Division I FCS football programs in the country with multiple national championships — has made these colors synonymous with North Dakota across the region and with [the Peace Garden State nickname](/states/north-dakota/nickname/the-peace-garden-state)."
      - "The association is reinforced by the agricultural landscape of the state itself. North Dakota is the leading producer of several major crops in the United States, including hard red spring wheat, durum wheat, sunflowers, canola, and dry beans. The visual palette of North Dakota's landscape in late summer — green fields maturing to golden yellow at harvest — mirrors the green and gold of NDSU and has made this color combination a natural expression of state identity even without legislative formalization, alongside symbols like [the Wild Prairie Rose state flower](/states/north-dakota/flower/wild-prairie-rose)."
    subsections:
      - subtitle: "North Dakota State University and the Green-Yellow Identity"
        text: "North Dakota State University was established as the North Dakota Agricultural College in 1890, the same year North Dakota was admitted to the Union. The institution's land-grant mandate — to serve the agricultural and mechanical sciences — placed it at the heart of North Dakota's farming economy from the beginning. NDSU's official colors, green (PMS 349) and yellow (PMS 7549), have been embedded in the state's institutional identity for over a century. The Bison football program, which won eight FCS national championships between 2011 and 2021, brought NDSU's green and gold to national visibility and further entrenched this color combination in the state's popular identity."
      - subtitle: "The Absence of Statutory State Colors"
        text: "Several states in the Great Plains and Midwest lack formally designated state colors, often because the practice of statutory color designation was adopted unevenly across states at different periods in American history. North Dakota's legislature has not passed a resolution or statute designating official state colors as of 2025. The state flag, adopted in 1911, uses blue as its primary field with gold heraldic details, but this has not been codified into a color designation statute. Advocates of a formal designation occasionally raise the topic in state civics discussions, but no legislation has advanced to address the gap; see [North Dakota's state flag details](/states/north-dakota/flag/north-dakota-state-flag)."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Green and yellow speak directly to North Dakota's agricultural economy and landscape. The state produces more sunflowers, durum wheat, and hard red spring wheat than any other U.S. state, and the visual cycle of its agricultural year moves from the brilliant green of early-season crops to the deep gold of harvest — a seasonal palette that has shaped the visual imagination of the state for generations."
    subsections:
      - subtitle: "Green: The Agricultural Landscape"
        text: "Green in North Dakota's identity is rooted in the vast cultivated and native landscapes of the Great Plains. The state contains over 39 million acres of farmland — approximately 90 percent of the state's total land area — making it one of the most intensively agricultural states in the nation. The spring planting season transforms the flat Red River Valley and the rolling Missouri Coteau into vast green fields stretching to the horizon. The state also manages significant native grassland preserves and wetland complexes in the Prairie Pothole Region, one of the most important waterfowl breeding areas in North America, where green vegetation covers a landscape dotted with prairie potholes."
      - subtitle: "Yellow: Wheat, Sunflowers, and the Harvest"
        text: "Yellow's association with North Dakota is inseparable from the harvest season. Hard red spring wheat, the state's single most economically significant crop, ripens to a deep golden yellow in late August. Sunflowers — North Dakota produces approximately 40 percent of the U.S. sunflower crop — blanket the landscape with brilliant yellow blooms in July and August before ripening to the dark brown heads of the fall harvest. The sunflower is also the official state flower of North Dakota, adopted in 1945, reinforcing the yellow-gold color as a native botanical symbol of the state's identity."
  - id: "state-emblems"
    title: "Usage in State Contexts"
    style: "default"
    paragraphs:
      - "Because North Dakota has no official state colors by statute, green and yellow appear in state contexts primarily through NDSU's institutional presence and the agricultural imagery used in state tourism and promotional materials. The North Dakota state flag features a blue field with a gold eagle and heraldic elements, and the North Dakota state seal uses a range of colors reflecting the landscape. The North Dakota Department of Agriculture and the North Dakota Wheat Commission routinely use green and gold in their communications, connecting the colors to the state's agricultural mission. The tourism brand 'North Dakota Legendary' has also used color palettes that reflect the golden prairies and green river valleys of the state's landscape, a geography explained on [the North Dakota border guide](/states/north-dakota/borders)."

  - id: "related-context"
    title: "Related North Dakota Context"
    style: "default"
    paragraphs:
      - "Color identity discussions are often read together with civic language on [North Dakota's official motto page](/states/north-dakota/motto/liberty-and-union-now-and-forever-one-and-inseparable)."

