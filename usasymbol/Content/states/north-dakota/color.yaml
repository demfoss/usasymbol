faq:
  - question: "What are the state colors of North Dakota?"
    answer: "North Dakota does not have official state colors designated by statute. Green and Yellow are widely recognized as the state's de facto colors through their association with North Dakota State University (NDSU) and the state's agricultural landscape of wheat fields and sunflower prairies."
  - question: "Does North Dakota have official state colors?"
    answer: "No. As of 2025, North Dakota has not enacted legislation designating official state colors. Green and yellow have emerged as widely recognized colors through NDSU and agricultural identity but lack formal statutory standing."
  - question: "What are NDSU's official colors?"
    answer: "North Dakota State University's official colors are Green (PMS 349, HEX #006633) and Yellow/Gold (PMS 7549, HEX #FFC72C). These are the closest thing to 'state colors' North Dakota has, given NDSU's dominant presence in the state's cultural identity."
  - question: "What does yellow represent in North Dakota?"
    answer: "Yellow represents the ripened grain of North Dakota's harvest season — primarily hard red spring wheat and sunflowers, whose blooms are the state's official flower. North Dakota is the top U.S. producer of sunflowers and durum wheat, making yellow the defining color of the state's agricultural cycle."

