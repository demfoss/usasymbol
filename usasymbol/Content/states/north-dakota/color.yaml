seo_title: "North Dakota State Colors | Green Yellow"
seo_description: "North Dakota state colors are Green and Yellow, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of North Dakota are **Green** and **Yellow**, reflecting the colors of North Dakota State University and the agricultural identity of the Peace Garden State. While no legislative act has formally designated official state colors, green and yellow are well established in North Dakota's cultural identity through NDSU, state branding, and [the North Dakota state flag](/states/north-dakota/flag/north-dakota-state-flag). The specifications below list HEX, RGB, CMYK, and Pantone values for North Dakota color matching."

official_colors: "Green and Yellow (Semi-official / Traditional)"
official_since: "No statutory designation; widely recognized through North Dakota State University"
primary_use: "North Dakota State University branding, regional agricultural identity, state promotional contexts"
known_for: "Green representing the vast wheat fields and grasslands of the Great Plains; yellow representing ripened grain, sunflowers, and the golden agricultural abundance that defines North Dakota's economy and landscape identity"

