seo_title: "North Dakota State Soil | Williams Series"
seo_description: "The North Dakota state soil is the Williams series, a dark prairie loam formed in glacial till that grows wheat, flax, and hay across the state."
hero_image: /images/soils/north-dakota/north-dakota-state-soil-hero.webp
