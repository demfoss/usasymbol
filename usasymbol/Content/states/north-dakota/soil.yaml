intro_text: "North Dakota's state soil is the Williams series, a dark prairie loam that formed in glacial till on the rolling plains of central and northwestern North Dakota. It is a working soil of wheat fields, hay land, and native grass pasture. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: North Dakota State Soil
  paragraphs:
  - "Williams soil is a Mollisol, the soil order of grasslands. Its dark surface layer built up over thousands of years as prairie grass roots grew, died, and turned into humus in the ground."
  - "The soil formed in calcareous glacial till, the mixed rock and clay that ice sheets dragged across the northern plains and left behind when they melted. Below the topsoil sits a clay-rich subsoil, a feature soil scientists use to separate Williams from many of its neighbors."

- id: history
  icon: fa-solid fa-landmark
  title: Why North Dakota Chose the Williams Soil
  paragraphs:
  - "The Williams series was first established in 1906 in Williams County in northwestern North Dakota, which gave the soil its name. That makes it one of the older named soil series on the northern plains."
  - "Soil scientists picked Williams to represent North Dakota because it is an extensive soil of the glaciated plains, the landscape that covers much of the state and supports its grain and livestock farms."

- id: profile
  icon: fa-solid fa-layer-group
  title: Williams Soil Profile and Horizons
  paragraphs:
  - "A Williams profile starts with a dark loam plow layer about 6 inches thick. Below it, the subsoil turns into clay loam where clay washed down from above has collected. Deeper still, white streaks of lime show up in the soil, and by about 3 feet down the profile reaches the pale glacial till it formed from."
  layers:
  - horizon: Ap
    name: Plow layer
    depth_in: "0–6"
    color_hex: "#4A4236"
    color_name: dark grayish brown
    texture: loam
    note: dark surface layer rich in organic matter
  - horizon: Bt
    name: Clay subsoil
    depth_in: "6–15"
    color_hex: "#5E5242"
    color_name: brown to grayish brown
    texture: clay loam
    note: clay that moved down from the surface collects here
  - horizon: Btk
    name: Clay and lime layer
    depth_in: "15–24"
    color_hex: "#7A6A4C"
    color_name: light olive brown
    texture: clay loam
    note: lime begins to show as white specks and threads
  - horizon: Bk
    name: Lime layer
    depth_in: "24–36"
    color_hex: "#9A8E7C"
    color_name: light brownish gray
    texture: clay loam
    note: calcium carbonate collects in this zone
  - horizon: C
    name: Glacial till
    depth_in: "36–60"
    color_hex: "#A89E8C"
    color_name: light brownish gray
    texture: clay loam
    note: the glacial till the soil formed from

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Williams Soil Is Found
  paragraphs:
  - "Williams soil covers glacial till plains and moraines in central and northwestern North Dakota. It also reaches north-central South Dakota and northeastern Montana."
  - "These uplands are dry for farm country, with roughly 12 to 19 inches of precipitation a year and an average annual temperature near 40°F. Slopes range from nearly flat to steep moraine hillsides."
  counties:
  - Williams
  - Mountrail

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Grassland on Williams Soil
  paragraphs:
  - "Most Williams soil is farmed. Small grains such as wheat and barley are the main crops, along with flax, corn, and hay. Steeper or rockier ground is kept as pasture."
  - "Before plowing, this soil grew mixed-grass prairie with western wheatgrass, needleandthread, blue grama, and green needlegrass. Those same grasses still cover the pastures and rangeland that were never broken."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Williams Soil Facts
  facts:
  - "Williams soil is classified as a fine-loamy Typic Argiustoll, a Mollisol with a clay-enriched subsoil."
  - "The series was established in 1906 and takes its name from Williams County, North Dakota."
  - "The official reference profile for the series was described in Mountrail County, North Dakota."
  - "Williams soil is well drained, but water moves slowly through its clay loam subsoil."
  - "The soil formed in calcareous glacial till left behind when ice sheets melted from the northern plains."

