faq:
- question: What is North Dakota's state soil?
  answer: "North Dakota's state soil is the Williams series, a dark prairie loam formed in glacial till. It covers the glaciated plains of central and northwestern North Dakota."
- question: Why is it called Williams soil?
  answer: "The series was established in 1906 in Williams County in northwestern North Dakota, and it is named after that county."
- question: Where is Williams soil found?
  answer: "Williams soil covers glacial till plains and moraines in central and northwestern North Dakota, north-central South Dakota, and northeastern Montana."
- question: What grows on Williams soil?
  answer: "Farmers grow small grains such as wheat and barley, plus flax, corn, and hay. Uncultivated areas are used as pasture with native grasses like western wheatgrass and blue grama."
- question: What kind of soil is Williams?
  answer: "Williams is a Mollisol, a dark grassland soil. Its subsoil is clay loam enriched with clay that moved down from the surface, and lime collects deeper in the profile."

