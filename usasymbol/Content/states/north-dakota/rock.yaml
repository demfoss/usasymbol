sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: North Dakota State Rock
    paragraphs:
      - "Knife River Flint is North Dakota's official state rock, designated by the Legislative Assembly in 2025. The stone is found almost exclusively in west-central North Dakota, and Native peoples quarried and traded it across the continent for thousands of years before European contact."
      - "North Dakota went decades without an official state rock, and the push to name one came not from lawmakers but from a group of schoolchildren who studied the state's geology firsthand."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Knife River Flint?"
    paragraphs:
      - "Knife River Flint is a form of chert, a hard, fine-grained silica rock that fractures into sharp-edged flakes when struck correctly. Fresh surfaces range from a rich brown to nearly black, and thin edges can turn translucent when held up to light."
      - "The stone often shows a faint waxy sheen, and some pieces fluoresce under ultraviolet light, an unusual trait not shared by most other flint. Fine grain and a predictable fracture made it especially well suited to shaping into blades and points."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why North Dakota Chose Knife River Flint as Its State Rock"
    paragraphs:
      - "Students in the Bottineau Rock Hounds club discovered that North Dakota was one of only two states without an official state rock and set out to fix that. They researched candidate stones, nominated several, and built a campaign around Knife River Flint before taking their case to state lawmakers."
      - "Their choice reflected the stone's singular tie to North Dakota: it occurs almost nowhere else, and it was quarried and traded so widely by Native peoples that finished tools made from it have turned up hundreds of miles away. Legislators credited the students' research when the bill passed the Senate by a vote of 44 to 2."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Knife River Flint Became North Dakota's State Rock"
    paragraphs:
      - "The Legislative Assembly passed the bill naming Knife River Flint the state rock in March 2025, and the governor signed it into law that same month, capping a campaign that began with a school rock club rather than a state agency."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Knife River Flint Is Found in North Dakota"
    paragraphs:
      - "The Lynch Quarry site, near Dunn Center in Dunn County, contains roughly 2,500 quarry pits dug along Spring Creek, a tributary of the Knife River. Native toolmakers worked the site from around 11,000 B.C. to A.D. 1600, and it was named a National Historic Landmark in 2011."
    sites:
      - name: Lynch Quarry Site (Knife River Flint Quarries)
