  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Knife River Flint Facts"
    facts:
      - "Adopted as North Dakota's state rock in 2025."
      - "Students from the Bottineau Rock Hounds club led the campaign to have Knife River Flint designated."
      - "The Lynch Quarry site near Dunn Center holds roughly 2,500 individual quarry pits dug over thousands of years."
      - "Tools made from Knife River Flint have been found as far away as Ohio, showing how widely it was traded."

