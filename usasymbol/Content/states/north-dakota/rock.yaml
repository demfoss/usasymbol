faq:
  - question: What is North Dakota's state rock?
    answer: "North Dakota's state rock is Knife River Flint, a form of chert quarried by Native peoples for thousands of years."
  - question: When did North Dakota adopt Knife River Flint as its state rock?
    answer: "The North Dakota Legislative Assembly designated Knife River Flint the official state rock in 2025."
  - question: Why did North Dakota choose Knife River Flint?
    answer: "A student rock club from Bottineau led the campaign after learning North Dakota was one of only two states without an official state rock, and lawmakers approved their choice by a wide margin."
  - question: Where can you find Knife River Flint in North Dakota?
    answer: "The Lynch Quarry site near Dunn Center in Dunn County, now a National Historic Landmark, is the best-documented source and was quarried for more than 10,000 years."

