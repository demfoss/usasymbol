title: Western Meadowlark
scientific_name: Sturnella neglecta
adopted_year: 1947
legislation: N.D. Cent. Code Sec. 54-02-06
meaning: North Dakota's state bird works because it is not just a general prairie emblem. John James Audubon distinguished the Western Meadowlark from the eastern species while traveling the Upper Missouri in present-day North Dakota, and the state still uses the bird as a public grassland symbol through the Meadowlark Initiative.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "North Dakota State Bird | Western Meadowlark"
seo_description: "North Dakota adopted the Western Meadowlark in 1947, and it still works as the state's best grassland bird symbol."
intro_text: 'North Dakota names the <strong>Western Meadowlark</strong> as its official state bird, a designation adopted in <strong>1947</strong> and now carried in <strong>N.D. Cent. Code Sec. 54-02-06</strong>. The bird has a North Dakota chapter in its own scientific story: in <strong>1843</strong>, John James Audubon distinguished the Western Meadowlark from the eastern species while traveling the Upper Missouri in what is now North Dakota. The symbol still does active public work: the North Dakota Game and Fish Department uses the meadowlark as the ambassador for its <strong>Meadowlark Initiative</strong> to conserve grasslands.'
