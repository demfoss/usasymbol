sections:
- id: why-does-the-western-meadowlark-have-a-north-dakota-chapter-of-its-own
  icon: fa-solid fa-circle-question
  title: Why Does the Western Meadowlark Have a North Dakota Chapter of Its Own?
  paragraphs:
  - North Dakota did not choose the meadowlark only because it looked right on the prairie. The stronger connection is that the species itself passes through the state's recorded natural history.
  - North Dakota Studies says John James Audubon heard the bird's different song as he moved up the Upper Missouri in 1843 and eventually identified it as a species distinct from the Eastern Meadowlark. That gives North Dakota more than scenery on this page. It gives the bird a documented chapter in the place that later adopted it.
  - North Dakota can point not just to habitat, but to a documented moment in the bird's own scientific history that happened on its ground — something no other meadowlark state can claim.
- id: why-is-the-meadowlark-still-doing-public-work-in-north-dakota
  icon: fa-solid fa-seedling
  title: Why Is the Meadowlark Still Doing Public Work in North Dakota?
  paragraphs:
  - The current statute is brief. It simply says that the meadowlark, <em>Sturnella neglecta</em>, is the official bird of North Dakota. The code does not explain the whole symbolic case for the bird.
  - North Dakota's later public use fills in that meaning. The Game and Fish Department says the Western Meadowlark is the ambassador for the Meadowlark Initiative, a statewide effort to enhance, restore, and sustain native grasslands.
  - That modern use gives the symbol more weight than old prairie nostalgia. The meadowlark still stands for North Dakota's grass-country identity, but now it also works as a public shorthand for keeping those grasslands healthy enough to support wildlife, pollinators, ranching, and rural communities.
faq:
- question: What is North Dakota's state bird?
  answer: North Dakota's state bird is the Western Meadowlark.
- question: When did North Dakota adopt the Western Meadowlark?
  answer: North Dakota adopted the Western Meadowlark in 1947.
- question: Why is the meadowlark more than a generic prairie bird for North Dakota?
  answer: Because the bird has a North Dakota chapter in its own story. John James Audubon distinguished the Western Meadowlark from the eastern species while traveling the Upper Missouri in what is now North Dakota.
- question: Does North Dakota law say Western Meadowlark or just meadowlark?
  answer: The code says the meadowlark, <em>sturnella neglecta</em>, is the official bird. The scientific name fixes the symbol as the Western Meadowlark even though the common-name line is shorter.
- question: What does the meadowlark mean for North Dakota today?
  answer: North Dakota Game and Fish uses the meadowlark as the ambassador for the Meadowlark Initiative, tying the state bird directly to grassland conservation, pollinators, ranching, and rural communities — not just a historical designation.
- question: What other states share the Western Meadowlark?
  answer: Kansas, Montana, Nebraska, Oregon, and Wyoming also use the Western Meadowlark as a state bird.
