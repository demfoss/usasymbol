sections:
- id: peace-garden-state
  icon: fa-solid fa-leaf
  title: What "Peace Garden State" Means
  paragraphs:
  - The phrase refers to the International Peace Garden on the North Dakota-Manitoba border near Dunseith. The garden was dedicated in 1932 as a symbol of peace between the United States and Canada.
  - North Dakota placed "Peace Garden State" on license plates in 1956. The legislature adopted it as the official state nickname in 1957, after the phrase had already appeared on plates.
  - The wording has been unusually durable. Even when North Dakota added newer marketing slogans, "Peace Garden State" stayed on the plate as a smaller continuing identity marker.

- id: discovery-and-legendary
  icon: fa-solid fa-sun
  title: From Discover the Spirit to Legendary
  paragraphs:
  - The original file skipped the long "Discover the Spirit" era. That was a major base, not a footnote: North Dakota used the bison-and-prairie "Discover the Spirit" plate from 1993 through November 11, 2015.
  - The "Discover the Spirit" plate also carried "PEACE GARDEN STATE" at the bottom, continuing the state's double-slogan habit. It won ALPCA's Plate of the Year award for best new general-issue plate of 1993.
  - The current sunrise/badlands plate entered use on November 12, 2015. It changed the headline from "Discover the Spirit" to "Legendary" while keeping "Peace Garden State" at the lower left. A minor redesign in November 2016 made the state name larger and easier to read.

- id: centennial
  icon: fa-solid fa-calendar
  title: Centennial Was a Short Era, Not Current
  paragraphs:
  - The older YAML described the Centennial plate as "1987-present," but that is not accurate. The Centennial base was a late-1980s to early-1990s plate tied to North Dakota's 100th statehood anniversary.
  - North Dakota entered the Union on November 2, 1889, so the centennial branding made sense around 1989. The plate kept "Peace Garden State" while adding the commemorative "Centennial" identity.
  - The Centennial base was replaced by the 1993 "Discover the Spirit" bison plate, which began the next long slogan era.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: North Dakota License Plate Slogans by Era
  paragraphs:
  - North Dakota's plate history is best read as a sequence of headline slogans layered over a persistent Peace Garden State identity.
  versions:
  - name: Peace Garden State
    years: 1956-1986
    image: /images/license-plates/north-dakota/1958-peace-garden-state.jpg
    description: The long-running official nickname appeared as the sole standard slogan after 1956.
  - name: Centennial / Peace Garden State
    years: 1987-1992
    image: /images/license-plates/north-dakota/1989-centennial.png
    description: Centennial-era plates marked North Dakota's 100th anniversary of statehood while retaining "Peace Garden State."
  - name: Discover the Spirit / Peace Garden State
    years: 1993-November 11, 2015
    image: /images/license-plates/north-dakota/1993-discover-the-spirit.jpg
    description: The bison-and-prairie base carried "Discover the Spirit" at the top and "Peace Garden State" at the bottom. It was North Dakota's main passenger plate for more than 22 years.
  - name: Legendary / Peace Garden State
    years: November 12, 2015-present
    image: /images/license-plates/north-dakota/2016-legendary.jpg
    description: The current sunrise/badlands base uses "Legendary" as the headline and keeps "Peace Garden State" at bottom left. A minor redesign followed in November 2016.

- id: international-peace-garden
  icon: fa-solid fa-earth-americas
  title: The International Peace Garden
  paragraphs:
  - The International Peace Garden sits directly on the U.S.-Canada boundary, partly in North Dakota and partly in Manitoba. It is the real place behind the plate slogan, not just a symbolic phrase.
  - State education materials note that "Peace Garden State" appeared on North Dakota plates in 1956 and became the official nickname in 1957. That sequence matters because the plate helped popularize the nickname before the law caught up.
  - The phrase gives North Dakota one of the few U.S. plate slogans rooted in international geography and diplomacy.

timeline:
- year: '1956'
  description: '"PEACE GARDEN STATE" first appears on North Dakota license plates.'
- year: '1957'
  description: North Dakota adopts "Peace Garden State" as the official state nickname.
- year: '1987'
  description: The Centennial-era plate begins, adding a commemorative headline while keeping the Peace Garden State identity.
- year: '1993'
  description: The bison-and-prairie "Discover the Spirit" base replaces the Centennial plate and wins ALPCA's Plate of the Year.
- year: '2015'
  description: The "Legendary" sunrise plate enters use on November 12, replacing the Discover the Spirit base.
- year: '2016'
  description: North Dakota makes a minor redesign to the Legendary plate, including larger state-name lettering.

faq:
- question: What is North Dakota's current license plate slogan?
  answer: North Dakota's current standard plate uses "Legendary" as the headline and "Peace Garden State" as a smaller continuing slogan.
- question: What does "Peace Garden State" mean?
  answer: It refers to the International Peace Garden on the North Dakota-Manitoba border. North Dakota first put the phrase on plates in 1956 and adopted it as the official nickname in 1957.
- question: When did North Dakota use "Discover the Spirit"?
  answer: North Dakota used "Discover the Spirit" on the bison-and-prairie passenger plate from 1993 through November 11, 2015.
- question: Is the Centennial plate still current?
  answer: No. The Centennial base belongs to the 1987-1992 period and was replaced by the 1993 Discover the Spirit plate.
- question: When did North Dakota introduce the Legendary plate?
  answer: North Dakota introduced the Legendary sunrise plate on November 12, 2015. A minor redesign followed in November 2016.
- question: Has Peace Garden State ever left North Dakota plates?
  answer: No. It has remained on North Dakota passenger plates since 1956, though since later bases it has often appeared as a smaller secondary slogan.

