seo_title: 'North Dakota License Plate Slogan: Peace Garden State, Discover the Spirit & Legendary'
seo_description: North Dakota's license plates have used "Peace Garden State" since 1956. Later bases added "Centennial," "Discover the Spirit," and "Legendary" while keeping the Peace Garden State identity.
hero_image: /images/license-plates/north-dakota/2016-legendary.jpg
hero_image_alt: North Dakota Legendary license plate
hero_image_caption: North Dakota's current Legendary plate keeps "Peace Garden State" in smaller type at the bottom left.
intro_text: 'North Dakota''s enduring license plate slogan is **"Peace Garden State,"** first placed on plates in 1956 and made the state''s official nickname in 1957. Since the late 1980s, North Dakota has often layered a newer headline phrase above or beside it: "Centennial," then "Discover the Spirit," and now "Legendary."'
quick_answer: 'North Dakota''s current standard plate uses "LEGENDARY" as the large headline and "PEACE GARDEN STATE" as the continuing secondary slogan. "Peace Garden State" first appeared in 1956. The state used "Discover the Spirit" from 1993 through November 11, 2015, then introduced the Legendary sunrise plate on November 12, 2015, with a minor design change in November 2016.'
