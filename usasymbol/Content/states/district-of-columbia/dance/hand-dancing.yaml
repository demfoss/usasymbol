sections:
  - id: overview
    icon: fa-solid fa-music
    title: District of Columbia Dance
    paragraphs:
      - "The District of Columbia named Hand Dancing its official dance in 1999, recognizing a partner style that had developed locally out of the city's swing and jitterbug dance halls decades earlier."
      - "Unlike a folk dance tied to farmland or mountain communities, Hand Dancing formed in an urban ballroom setting, giving the designation a distinctly city-based origin story."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Hand Dancing Explained"
    paragraphs:
      - "Hand Dancing is a smooth, gliding partner dance built around a six- to eight-count step pattern. Partners hold hands lightly through much of the dance, guiding each other through turns and spins with a controlled, flowing motion rather than sharp, bouncy movement."
      - "The dance is closely tied to R&B and soul music, with dancers matching the steady groove of the song rather than a fast tempo. Compared to the bouncier East Coast swing it evolved from, Hand Dancing keeps the upper body relaxed and the footwork close to the floor."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Hand Dancing
    steps:
      - title: "Face Your Partner in Closed Position"
        description: "Stand facing your partner and hold hands lightly, ready to move together through a six- to eight-count pattern."
      - title: "Learn the Basic Step Count"
        description: "Shift your weight smoothly from foot to foot through the count, keeping the motion controlled rather than bouncy."
      - title: "Add Turns Under Joined Hands"
        description: "The lead guides the follow through a turn under their joined hands, keeping the movement smooth and unhurried."
      - title: "Keep the Connection Gliding"
        description: "Maintain a light, steady hand connection throughout, letting the dance flow rather than snap between steps."
      - title: "Match the Groove of the Music"
        description: "Sync your steps to the steady rhythm of R&B or soul music rather than rushing the tempo."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Hand Dancing Represents DC
    paragraphs:
      - "Hand Dancing formed specifically in Washington, DC, as local dancers reshaped the faster, bouncier swing and jitterbug styles of the mid-twentieth century into a smoother, more controlled partner dance suited to the city's ballroom scene. That local origin gave DC a dance it could claim as genuinely its own."
      - "Because the style carries no connection to any other state's folk-dance tradition, naming Hand Dancing the official dance in 1999 tied the designation directly to the city's own social dance history rather than to a shared national dance."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Hand Dancing Became DC's Official Dance
    paragraphs:
      - "The Council of the District of Columbia designated Hand Dancing the official dance of the District in 1999, formally recognizing a style that had already been practiced locally for decades."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Hand Dancing Facts
    facts:
      - "The District of Columbia adopted Hand Dancing as its official dance in 1999."
      - "Hand Dancing developed locally in DC out of the city's mid-century swing and jitterbug ballroom scene."
      - "The dance uses a six- to eight-count step pattern with a smooth, gliding connection between partners."
      - "Hand Dancing is traditionally danced to R&B and soul music."

