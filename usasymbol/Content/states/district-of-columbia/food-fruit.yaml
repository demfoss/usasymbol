author: USA Symbol Team
date_published: '2026-07-30'
date_modified: '2026-07-30'
seo_title: "DC Official Fruit | Cherry"
seo_description: "The District of Columbia's official fruit is the cherry, adopted in 2006, tied to DC's famous cherry blossom trees."
hero_image: /images/foods/district-of-columbia/district-of-columbia-state-fruit-hero.webp
hero_image_alt: "Cherries growing on a branch with cherry blossoms in the background."
hero_image_caption: "The cherry, the District of Columbia's official fruit."
intro_text: "The District of Columbia's official fruit is the cherry, adopted in 2006 to recognize the city's famous cherry blossom trees along the Tidal Basin. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is DC's Official Fruit?"
    paragraphs:
      - "The cherry is the District of Columbia's official fruit, designated by the Council of the District of Columbia in 2006. The choice honors the thousands of cherry trees planted around the Tidal Basin."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Cherry"
    paragraphs:
      - "Cherries are small, round stone fruits that grow on trees. The trees around DC's Tidal Basin are mostly ornamental Yoshino and Kwanzan varieties, prized for their spring blossoms rather than for fruit production."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Cherry Became DC's Official Fruit"
    paragraphs:
      - "The Council of the District of Columbia designated the cherry the official fruit of the District in 2006."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why DC Chose the Cherry"
    paragraphs:
      - "The cherry was chosen because of Washington's famous cherry blossom trees, first given as a gift from the city of Tokyo, Japan in 1912 and now the centerpiece of the annual National Cherry Blossom Festival."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Cherry Comes From in DC"
    paragraphs:
      - "The Tidal Basin in downtown Washington is home to thousands of cherry blossom trees and hosts the National Cherry Blossom Festival each spring."
    sites:
      - name: Tidal Basin
        city: Washington
        lat: 38.8853
        lng: -77.0425
        note: "Home to DC's famous cherry blossom trees"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Cherry Facts"
    facts:
      - "Adopted as DC's official fruit in 2006."
      - "Tokyo, Japan gave Washington its first cherry trees in 1912."
      - "The Tidal Basin hosts the annual National Cherry Blossom Festival."

