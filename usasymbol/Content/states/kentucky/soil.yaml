faq:
- question: What is Kentucky's state soil?
  answer: "Kentucky's state soil is the Crider series, a deep, well-drained silt loam formed from limestone on the Pennyroyal Plateau in western and south-central Kentucky. The Kentucky Legislature designated it the official state soil in 1990."
- question: Why is it called Crider soil?
  answer: "The Crider series is named for Crider, a small community in Webster County, Kentucky. USDA soil scientists name series after a local geographic feature — a town, creek, or county — near where the soil is first formally studied and described."
- question: What color is Crider soil?
  answer: "The surface of Crider soil is brown silt loam. As you go deeper, the color shifts through yellowish brown into reddish yellow and then red. That reddening happens because iron oxide accumulated in the subsoil as the limestone parent material weathered and its calcium carbonate dissolved away over thousands of years."
- question: Why does Crider soil turn red?
  answer: "The red color in the deep subsoil comes from iron oxide — the same compound that makes rust red. As the limestone beneath the Pennyroyal Plateau dissolved over thousands of years, the calcium carbonate washed away in groundwater. The iron that was locked in the limestone stayed behind and concentrated in the subsoil, staining it reddish yellow and red."
- question: What is the Pennyroyal Plateau?
  answer: "The Pennyroyal Plateau — also spelled Pennyrile — is a broad limestone plain that covers much of western and south-central Kentucky. It is a karst landscape: rainwater slowly dissolves the limestone, forming sinkholes, springs, and caves. Mammoth Cave, the world's longest known cave system, formed in this same limestone. Crider soil is the dominant upland soil of the plateau."
- question: What grows in Crider soil?
  answer: "Burley tobacco was the defining crop on Crider soil for most of the twentieth century. Since tobacco acreage declined after 2004, corn, soybeans, hay, and cattle have become more common. Before European settlement, oak-hickory forest covered the same well-drained uplands."
- question: How is Crider soil different from Kentucky's Bluegrass soils?
  answer: "Crider soil sits on the Pennyroyal Plateau in western and south-central Kentucky, formed from weathered cherty limestone. The famous Bluegrass soils of central Kentucky — around Lexington and the horse farms — formed from a different limestone and have a different profile and color. Both are limestone-derived, but the Pennyroyal and Bluegrass are distinct physiographic regions with distinct soils."
- question: What is an Alfisol?
  answer: "An Alfisol is a soil with a clay-enriched argillic subsoil that formed under forest in a humid climate. Alfisols are moderately fertile — they have been leached enough that they lack the thick dark organic surface of grassland Mollisols, but they still hold enough nutrients and structure to support crops without heavy amendment. Crider is an Alfisol; Iowa's Tama and Kansas's Harney are Mollisols."

