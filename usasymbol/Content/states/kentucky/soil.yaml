meaning: "Crider soil formed by thousands of years of limestone dissolving and weathering in place. The calcium and carbonate washed away in groundwater, carving the caves and sinkholes that define the Pennyroyal Plateau. What stayed behind was iron-stained, clay-rich residuum — a deep, well-drained soil that grew Kentucky's burley tobacco for more than a century and still produces crops on the same rolling karst uplands today."
