- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Crider Soil
  paragraphs:
  - "Burley tobacco built the agricultural economy of the Pennyroyal Plateau, and Crider soil was under most of it. Tobacco is a demanding crop — it needs deep, well-drained soil with good fertility and a long growing season. Crider provides all three. Kentucky was the leading burley tobacco state for most of the twentieth century, and the Crider series supported a large part of that production."
  - "As tobacco farming declined after the federal tobacco buyout program ended in 2004, Pennyroyal farmers shifted toward corn, soybeans, hay, and cattle. Crider soil handles all of these crops. Its silty surface and deep argillic subsoil give it better water-holding capacity than many surrounding soils, which is important in Kentucky's occasional summer dry spells."
  - "Before European settlement, Crider soil supported oak-hickory forest — the eastern deciduous forest that covered most of Kentucky before clearing. Post oak, black oak, white oak, shagbark hickory, and sugar maple grew on these well-drained uplands. Some older farm woodlots on Crider soil still support these species."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Crider Soil Facts
  facts:
  - "Designated: the Kentucky Legislature officially named the Crider series the state soil in 1990."
  - "The Crider series was named for Crider, a community in Webster County, Kentucky, where it was first formally described by USDA soil scientists."
  - "The red color in the deep subsoil comes from iron oxide — the same compound that makes rust red. It accumulated over thousands of years as calcium carbonate dissolved out of the limestone parent material and iron stayed behind."
  - "Crider soil sits on the Pennyroyal Plateau, the same limestone formation that produced Mammoth Cave — the world's longest known cave system, located in Edmonson County about 30 miles south of the main Crider soil belt."
  - "Chert gravel in the lower profile is a field marker for Crider soil. Farmers and soil scientists use it to confirm they are looking at a limestone-derived soil, not a loess-derived or glacially influenced one."
  - "Crider is classified as an Alfisol — a soil order defined by a clay-enriched argillic subsoil and a moderately leached surface. Alfisols form under forest vegetation in humid climates, which distinguishes Crider from the grassland Mollisols of Kansas, Iowa, and Illinois."

