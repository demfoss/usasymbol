seo_title: "Kentucky State Soil | Crider Series"
seo_description: "Kentucky's state soil is the Crider series, adopted in 1990 — a limestone-derived silt loam of the Pennyroyal Plateau, growing corn and soybeans."
hero_image: /images/soils/kentucky/crider-soil.webp
