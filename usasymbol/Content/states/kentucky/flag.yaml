seo_title: "Kentucky State Flag: Meaning, Seal Symbol, History & Facts"
seo_description: "Read why Kentucky uses this flag design, what each major emblem points to, and how the state records color details for Kentucky's flag."

intro_text: "The Kentucky state flag was adopted in 1918 and features the state seal on a navy blue field. Two men appear in the center, shaking hands in a gesture of friendship. The state motto [United We Stand, Divided We Fall](/states/kentucky/motto/united-we-stand-divided-we-fall) encircles the seal."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Kentucky State Flag Is Designed"
    paragraphs:
      - "The Kentucky state flag is the official government flag of Kentucky. A navy blue background covers the entire field. The state seal sits in the center. A wreath of goldenrod surrounds it, and the design appears in the [list of U.S. state flags](/symbols/flags)."
      - "Two men stand in the seal's center. One wears frontier clothing. The other wears formal attire. They clasp hands in friendship. The state motto appears in ribbons above and below. Public buildings, schools, and government offices across Kentucky fly the flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Kentucky Flag Communicates"
    paragraphs:
      - "The flag represents unity and cooperation. Two men embrace in the center. The motto United We Stand, Divided We Fall reinforces solidarity among citizens."
      - "The two figures symbolize different segments of Kentucky society. One man represents frontier spirit and pioneer settlers. The other represents statesmen and civic leadership. Their handshake demonstrates partnership."
      - "Navy blue connects Kentucky to the Union. Blue was common in state flags during the early 1900s. It showed loyalty to the United States and aligns with [Kentucky's official color tradition](/states/kentucky/color)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Kentucky Flag History and Adoption"
    paragraphs:
      - "Kentucky established its state flag in 1918. The legislature approved a design featuring the state seal on navy blue. Jesse Cox Burgess designed the flag. She was an art teacher. She was the only woman to serve on the Kentucky flag commission, with statehood context in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "The seal itself predated the flag. Kentucky adopted its state seal in 1792 when it became a state. That was more than a century earlier. The seal's imagery remained consistent through multiple revisions."
      - "The legislature updated flag specifications in 1962. Officials clarified proportions and placement details. The goldenrod wreath got formalized in the statute. These adjustments standardized production."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Kentucky Flag"
    symbols:
      - id: seal
        name: "Kentucky State Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal depicts two men—a frontiersman and a statesman—clasping hands. Kentucky adopted this seal in 1792. Two men stand facing each other. They shake hands. This symbolizes unity and cooperation."
          - "The man on the left wears buckskin frontier clothing. He represents pioneers and settlers who built Kentucky. The man on the right wears formal dress from the eighteenth century. He represents political leaders and statesmen."
          - "The motto United We Stand, Divided We Fall curves around the image. This phrase originated during the American Revolution. Kentucky placed it on the seal to emphasize cooperation."

      - id: wreath
        name: "Goldenrod Wreath"
        image: "symbols/wreath.svg"
        paragraphs:
          - "A wreath of goldenrod surrounds the state seal. Goldenrod became Kentucky's state flower in 1926. The plant grows abundantly across Kentucky and is detailed on [Kentucky's state flower page](/states/kentucky/flower/goldenrod). It blooms in late summer."
          - "The wreath was added to the flag design in 1918. It creates a visual frame for the seal. It ties the flag to Kentucky's natural landscape."

      - id: field
        name: "Navy Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "The navy blue background covers the entire flag. This color became standard for many state flags in the early 1900s. It matches shades used in military and federal contexts."
          - "Kentucky chose navy blue to demonstrate loyalty to the Union. The color provides strong contrast for the seal and wreath."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Kentucky State Flag Colors"
    paragraphs:
      - "The flag uses navy blue, yellow, green, white, and brown. Navy blue forms the field. Yellow appears in the goldenrod wreath and text. The seal contains multiple colors for the figures and natural elements."
    colors:
      - name: "Navy Blue"
        hex: "#003366"
      - name: "Yellow"
