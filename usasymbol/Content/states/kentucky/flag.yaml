  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Kentucky State Flag Facts"
    facts:
      - "Kentucky adopted its state flag in 1918"
      - "Jesse Cox Burgess designed the flag"
      - "The state seal on the flag dates to 1792"
      - "A goldenrod wreath surrounds the seal"
      - "The flag was standardized with detailed specifications in 1962"
      - "The motto United We Stand, Divided We Fall appears on the seal"

faq:
  - question: "Which flag serves as Kentucky's official banner?"
    answer: "The Kentucky state flag is the official banner of Kentucky. It features the state seal surrounded by a goldenrod wreath on a navy blue field."

  - question: "What are the main visual elements on Kentucky's flag?"
    answer: "The flag shows the Kentucky state seal in the center with two men shaking hands. A goldenrod wreath circles the seal on a navy blue background."

  - question: "What does the Kentucky state flag represent?"
    answer: "The flag represents unity and cooperation among Kentucky citizens. The two men shaking hands symbolize different groups working together."

  - question: "What meaning is attached to Kentucky's flag?"
    answer: "The flag means solidarity through its motto United We Stand, Divided We Fall. The handshake between a frontiersman and a statesman shows partnership across social divisions."

  - question: "What are the key symbols on Kentucky's flag?"
    answer: "Two men appear on the state seal. One wears frontier clothing representing pioneers. The other wears formal dress representing statesmen."

  - question: "How would you describe the design of the Kentucky state flag?"
    answer: "The figures represent different segments of Kentucky society. The frontiersman symbolizes settlers and pioneers. The statesman symbolizes civic leadership."

  - question: "In what year did Kentucky's current flag become official?"
    answer: "Kentucky adopted its state flag in 1918 and standardized it in 1962."

  - question: "Which person or group shaped the current Kentucky flag?"
    answer: "Jesse Cox Burgess designed the Kentucky state flag. She was an art teacher and served on the Kentucky flag commission."

  - question: "Does Kentucky's flag have an official name?"
    answer: "No. The flag is officially called the Kentucky state flag or the flag of Kentucky."

