intro_text: '**"Bluegrass State"** has been Kentucky''s standard license plate slogan since the 1988 Churchill Downs base. The phrase appeared earlier on 1982 and 1983 expiration stickers, but 1988 made it permanent. Later plates paired it with "It''s that friendly" and "Unbridled Spirit" before the 2020 base returned to a cleaner slogan layout. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: 'Kentucky''s current standard license plate slogan is "Bluegrass State," referencing the limestone-rich central Kentucky region where horse breeding developed. The phrase has run on the standard plate continuously since 1988. Kentucky also offers "In God We Trust" as a no-cost standard-issue alternative.'
