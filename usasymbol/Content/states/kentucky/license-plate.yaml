sections:
- id: bluegrass-state
  icon: fa-solid fa-horse
  title: Why Kentucky Plates Say "Bluegrass State"
  paragraphs:
  - 'Kentucky bluegrass is not native to Kentucky and is not actually blue. European settlers brought it, and it spread through the central part of the state because the underlying limestone weathers into soil unusually rich in calcium and phosphorus — exactly the minerals that build dense bones in young horses. Breeders who tracked down the best-performing stock in the eighteenth century kept finding it raised on the same strip of central Kentucky pasture, and they followed the grass.'
  - 'The Bluegrass Region that gave the plate its slogan is also what produced the [Kentucky Derby](/states/kentucky/mammal/thoroughbred-horse) and the horse farms that ring Lexington today — stone walls, white fences, and breeding operations that ship stallions internationally. The connection between the plate slogan and the state''s most recognized industry is not a metaphor. It is a direct line from soil chemistry to the track at Churchill Downs.'
  - 'The same geography lent its name to bluegrass music: Bill Monroe named his band the Blue Grass Boys after his Kentucky roots in the 1940s, and the genre took the name from there. The grass, the horses, and the music trace to the same limestone belt in central Kentucky that the plate has been advertising since 1988.'

- id: bluegrass-region
  icon: fa-solid fa-map
  title: The Bluegrass Region Behind the Slogan
  paragraphs:
  - 'The Bluegrass Region is a geological zone, not a political one. A shallow ancient seabed left a thick limestone base near the surface across central Kentucky, and that limestone dissolves into alkaline, mineral-dense soil that grows pasture unlike almost anywhere else in North America. Horse breeders in the 1700s had no soil tests — they just noticed which farms produced the strongest animals and bought land nearby.'
  - 'Lexington sits at the center of the Inner Bluegrass, the densest part of the region, and became the world''s largest Thoroughbred breeding market as a result. The surrounding geography — the Knobs to the south and east, the coal country of Appalachia beyond that — is dramatically different, but the Bluegrass Region is the geography that produced Kentucky''s national identity. The plate slogan captures one part of a more varied state.'
  - 'The [Kentucky nickname page](/states/kentucky/nickname) covers the full history of the Bluegrass State name, including the earlier "Dark and Bloody Ground" frontier label that framed Kentucky through conflict before the horse-country identity took hold.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Kentucky License Plate Slogans by Era
  paragraphs:
  - Kentucky has used several distinct slogans across its plate history. The Bluegrass State identity is the long-running modern phrase, but earlier plates used tourism language, a friendliness tagline, and layered branding before the 2020 base settled on a clean, single-slogan design.
  versions:
  - name: TOUR Kentucky
    years: 1951-1957
    image: /images/license-plates/kentucky/1951-tour-kentucky-plate.jpg
    description: From 1951 through 1957, Kentucky inserted the word "TOUR" before the state name on its standard plates — a direct pitch for travel dollars rather than a nickname. No other slogan appeared; the plate was functioning as a billboard.
  - name: Bluegrass State sticker
    years: 1982-1983
    image: /images/license-plates/kentucky/1982-bluegrass-state-sticker.jpg
    description: The 1978 base had an unusually shaped sticker box and state abbreviation in the upper corners. In 1982 and 1983, the expiration sticker on that base carried "BLUEGRASS STATE" — the first time the phrase appeared on a Kentucky plate, though only on the sticker rather than the plate itself.
  - name: Bluegrass State
    years: 1988-present
    image: /images/license-plates/kentucky/1988-churchill-downs-bluegrass-state.jpg
    description: The Churchill Downs base introduced in 1988 put "Bluegrass State" on the plate proper and started the slogan's continuous streak. Churchill Downs — the Louisville track that runs the Kentucky Derby each May — gave the design its name and its central image.
  - name: It's that friendly
    years: 2003-2005
    image: /images/license-plates/kentucky/2003-its-that-friendly-plate.jpg
    description: The 2003 redesign added a smiling sun graphic and a second slogan, "It's that friendly," running alongside "Bluegrass State." The smiling sun made the plate immediately recognizable — and polarizing. It was replaced within two years.
  - name: Unbridled Spirit
    years: 2005-2020
    image: /images/license-plates/kentucky/2005-unbridled-spirit-plate.jpg
    description: In 2005 Kentucky introduced its "Unbridled Spirit" tourism brand onto the standard plate, pairing the logo and slogan with "BLUEGRASS STATE." The two coexisted for fifteen years before the 2020 redesign dropped the tourism branding entirely.
  - name: In God We Trust
    years: 2011-present optional
    image: /images/license-plates/kentucky/kentucky-in-god-we-trust-plate.png
    description: Kentucky introduced a no-cost "In God We Trust" option in 2011. KYTC currently lists it alongside Bluegrass State as a standard-issue passenger plate choice — no specialty fee required.
  - name: Bluegrass State redesign
    years: 2020-present
    image: /images/license-plates/kentucky/kentucky-bluegrass-state-plate.png
    description: The 2020 standard base removed Unbridled Spirit and repositioned "BLUEGRASS STATE" as the plate's dominant text element. After thirty-two years of sharing space with tourism branding, the geographic identity finally had the plate to itself.

- id: motto-connection
  icon: fa-solid fa-scroll
  title: The Motto on the Seal and the Slogan on the Plate
  paragraphs:
  - 'Kentucky''s plate slogan is geographic; the state''s motto is political. "United We Stand, Divided We Fall" was adopted in 1792 at statehood — the year Kentucky entered the Union as the 15th state — and it comes from Revolutionary-era writing warning that a union only holds if its members hold together. The phrase appears on the [Commonwealth seal and flag](/states/kentucky/flag), where it has stayed for over two centuries.'
  - 'The two phrases make different arguments about what Kentucky is. The motto fixes the state to its 1792 founding moment and the political pressures of the early republic. The plate slogan points to limestone pasture, horse farms, and a regional identity that built itself over the following century. On the plate, geography won — it is more legible at highway speed and does not require a history lesson.'
  - 'For context on how states across the country chose their plate phrases, the [U.S. license plate slogans by state](/license-plates) page maps the full range of approaches — from geography and nicknames to mottos and tourism taglines.'

timeline:
- year: '1792'
  description: Kentucky enters the Union on June 1 as the 15th state and adopts "United We Stand, Divided We Fall" as its motto — a founding political statement that would eventually share the state's official imagery with a very different geographic slogan.
- year: '1800s'
  description: Thoroughbred breeders concentrate in central Kentucky's Bluegrass Region, following the mineral-rich limestone pasture that builds exceptionally dense bones in young horses. Lexington develops into the center of American horse breeding.
- year: '1875'
  description: The first Kentucky Derby is run at Churchill Downs in Louisville, anchoring the Bluegrass State's identity to horse racing on a national stage. The track would later lend its name to the plate base that gave "Bluegrass State" its permanent run.
- year: 1951-1957
  description: Kentucky uses its standard plates for direct tourism promotion, inserting "TOUR" before the state name — making "TOUR Kentucky" the full plate text for six years.
- year: 1982-1983
  description: The expiration sticker on the 1978 base carries "BLUEGRASS STATE" — the first appearance of the phrase on any Kentucky plate, though limited to the sticker rather than the plate base.
- year: '1988'
  description: '"Bluegrass State" moves onto the plate itself on the new Churchill Downs base, beginning a continuous streak on the standard passenger plate that runs to the present.'
- year: '2003'
  description: Kentucky introduces the smiling-sun plate, adding "It's that friendly" as a second slogan alongside Bluegrass State. The design becomes one of the more recognized — and debated — state plates of its era.
- year: '2005'
  description: A new base pairs "BLUEGRASS STATE" with Kentucky's "Unbridled Spirit" tourism branding and logo, layering two identities onto the standard plate for the next fifteen years.
- year: '2011'
  description: Kentucky introduces a no-cost optional "In God We Trust" plate, listed by KYTC as a standard-issue passenger plate alternative rather than a specialty plate.
- year: '2020'
  description: The standard base is redesigned, removing Unbridled Spirit branding and giving "BLUEGRASS STATE" its most prominent position on any Kentucky plate to date.
- year: Present
  description: KYTC lists Bluegrass State and In God We Trust as the two standard-issue passenger plate options. The Bluegrass State streak has run unbroken since 1988.

faq:
- question: What is Kentucky's license plate slogan?
  answer: Kentucky's standard license plate slogan is "Bluegrass State," a reference to the central Kentucky region whose limestone soils support the horse farms that made the state internationally known. The phrase has run on the standard plate continuously since 1988. KYTC also offers "In God We Trust" as a no-cost standard-issue alternative.
- question: What is Kentucky bluegrass, and is it actually blue?
  answer: Kentucky bluegrass is a grass species that arrived with European settlers and spread through central Kentucky because the limestone bedrock weathers into soil rich in calcium and phosphorus. It is not blue — the name comes from the bluish-green tint of the seed heads in spring. The same mineral chemistry that makes the grass thrive also builds dense bones in young horses, which is why Thoroughbred breeding concentrated in the Bluegrass Region.
- question: Why is Kentucky famous for horses?
  answer: Kentucky's Thoroughbred industry developed in the Bluegrass Region because limestone soil chemistry produces calcium- and phosphorus-rich pasture ideal for raising racehorses. Breeders in the 1700s identified the connection between the region's grass and the quality of the horses raised on it, and Lexington became the center of American Thoroughbred breeding as a result. The [Kentucky state mammal page](/states/kentucky/mammal/thoroughbred-horse) covers the Thoroughbred's official designation.
- question: What does Kentucky's state motto mean?
  answer: '"United We Stand, Divided We Fall" was adopted at statehood in 1792, drawn from Revolutionary-era political writing. The phrase is a warning that a union survives only if the people in it remain committed to it. It appears on the Commonwealth seal and flag. The [Kentucky state motto page](/states/kentucky/motto) covers its full origin and context.'
- question: What is the difference between "Bluegrass State" and "Dark and Bloody Ground"?
  answer: "\"Bluegrass State\" is Kentucky's current plate slogan and official nickname, tied to the limestone grasslands and horse country of central Kentucky. \"Dark and Bloody Ground\" is an older frontier label applied to Kentucky during the violent settlement period of the late 1700s — it was never a license plate slogan. The [Kentucky nickname page](/states/kentucky/nickname) covers both phrases and their historical contexts."

