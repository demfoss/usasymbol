faq:
  - question: What is Kentucky's state mineral?
    answer: "Kentucky's state mineral is calcite, calcium carbonate, adopted by the Kentucky General Assembly in 2024."
  - question: When did Kentucky adopt calcite as its state mineral?
    answer: "The Kentucky General Assembly designated calcite the official state mineral in 2024."
  - question: Why did Kentucky choose calcite?
    answer: "Calcite is the mineral behind Kentucky's limestone bedrock, bluegrass soils, and cave country, including Mammoth Cave, and it corrected coal's earlier misclassification as a mineral."
  - question: Where can you find calcite in Kentucky?
    answer: "Calcite occurs throughout Kentucky's limestone regions, most visibly in the cave formations of Mammoth Cave National Park in south-central Kentucky."

