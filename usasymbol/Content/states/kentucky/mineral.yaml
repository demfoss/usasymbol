intro_text: "Kentucky's state mineral is calcite, adopted in 2024 as the mineral behind the state's limestone bedrock, its bluegrass soils, and the cave formations of Mammoth Cave. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Kentucky State Mineral
    paragraphs:
      - "Calcite is Kentucky's official state mineral, designated by the Kentucky General Assembly in 2024. It is calcium carbonate, the mineral that makes up limestone, one of the most common rock types found across the state."
      - "Lawmakers added calcite as part of a broader correction: coal, previously listed as the state mineral, was reclassified as the state rock the same year, opening the mineral title for a true mineral."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Calcite?"
    paragraphs:
      - "Calcite is calcium carbonate, usually colorless or white, though impurities can tint it yellow, gray, or brown. It forms sharp, glassy crystals and is soft enough to scratch with a knife, a quick way to tell it apart from harder look-alikes like quartz."
      - "Calcite is one of the most common minerals in Earth's crust and the main ingredient in limestone. In caves, dissolved calcite redeposits slowly from dripping water to build stalactites, stalagmites, and other formations."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kentucky Chose Calcite as Its State Mineral"
    paragraphs:
      - "Limestone underlies much of Kentucky, from the Bluegrass region's fertile soils to the vast cave systems of the karst country in the south-central part of the state. Calcite is the mineral that gives that limestone its identity and its ability to dissolve into caves."
      - "Mammoth Cave, the longest known cave system in the world, is carved from calcite-rich limestone and lined with calcite formations. State Representative Al Gentry, a geology graduate who sponsored the 2024 bill, pointed to that connection, along with limestone's role in Kentucky's bourbon-making water and soils, as reasons calcite deserved recognition."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Calcite Became Kentucky's State Mineral"
    paragraphs:
      - "The Kentucky General Assembly designated calcite the state mineral in 2024 through the same bill that reclassified coal as the state rock and Kentucky agate as the state gemstone. The change corrected a mismatch that had stood for over two decades: coal is not scientifically a mineral, and the state needed a true mineral to fill the title."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Calcite Is Found in Kentucky"
    paragraphs:
      - "Calcite occurs throughout Kentucky's limestone regions, most visibly in the cave country of south-central Kentucky. Mammoth Cave National Park, carved from calcite-rich limestone, displays calcite formations built up over thousands of years of dripping water."
    sites:
      - name: Mammoth Cave National Park
        city: Mammoth Cave
        lat: 37.1862
        lng: -86.1000
        note: "Calcite-rich limestone cave system"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Calcite Facts"
    facts:
      - "Adopted as Kentucky's state mineral in 2024."
      - "Calcite replaced coal as Kentucky's state mineral the same year coal was reclassified as the state rock."
      - "Mammoth Cave, the world's longest known cave system, is carved from calcite-bearing limestone."
      - "Calcite is soft enough to scratch with a fingernail's edge using a knife blade, registering just 3 on the Mohs hardness scale."

