intro_text: Kentucky's state fish is the Kentucky spotted bass, a black bass that anglers often call the Kentucky bass. State lawmakers made it official in 1956. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Kentucky?
  paragraphs:
  - The Kentucky spotted bass became Kentucky's official state fish in 1956. Its scientific name is Micropterus punctulatus.
  - It is one of four kinds of black bass that live in Kentucky waters. It belongs to the sunfish family, along with crappie and bluegill.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Kentucky Spotted Bass
  paragraphs:
  - The spotted bass has an olive-green back and a dark, blotchy stripe running along each side. Below the stripe, rows of small dark spots line its lower sides, and that is how it got its name.
  - In Kentucky, adults are usually 8 to 15 inches long and weigh between half a pound and two pounds. Bigger fish grow a thick, broad body that narrows to a strong forked tail.
  - It looks a lot like the largemouth bass, so new anglers often mix the two up.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 1956, the Kentucky Legislature named this species the "Kentucky bass" and made it the official state fish.
  - Scientists did not recognize the spotted bass as its own species until 1927. Before that, many people thought it was a cross between a largemouth bass and a smallmouth bass.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Kentucky Chose the Kentucky Spotted Bass
  paragraphs:
  - Official sources do not give a detailed reason for the choice. For many years, people believed this fish lived only in Kentucky, and anglers across the South still call it the Kentucky bass.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Kentucky Spotted Bass
  paragraphs:
  - Spotted bass live all over Kentucky. They like clear streams with moderate to swift current, and they are most common in the streams of northeastern Kentucky.
  - They also do well in big reservoirs such as Lake Cumberland, Laurel River Lake, Green River Lake, and Barren River Lake. In fall, they often swim in schools and chase baitfish near the surface.
