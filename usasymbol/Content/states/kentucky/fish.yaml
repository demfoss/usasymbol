- id: facts
  icon: fa-solid fa-lightbulb
  title: Kentucky Spotted Bass Facts
  facts:
  - Adopted in 1956 by the Kentucky Legislature.
  - Its scientific name is Micropterus punctulatus.
  - Adults in Kentucky are usually 8 to 15 inches long.
  - Scientists did not recognize it as a separate species until 1927.
  - Kentucky's state record spotted bass weighed 7 pounds, 10 ounces.
faq:
- question: What is Kentucky's state fish?
  answer: Kentucky's state fish is the Kentucky spotted bass. Many anglers simply call it the Kentucky bass.
- question: When did Kentucky adopt the Kentucky spotted bass?
  answer: The Kentucky Legislature made the Kentucky spotted bass the official state fish in 1956.
- question: Why did Kentucky choose the Kentucky spotted bass?
  answer: Official sources do not give a detailed reason. For many years, people believed the fish lived only in Kentucky, and it is still widely called the Kentucky bass.
- question: How can you tell a spotted bass from a largemouth bass?
  answer: Look below the dark stripe on its side. A spotted bass has rows of small dark spots on its lower sides, which gave it its name.
- question: Does the spotted bass live only in Kentucky?
  answer: No. People once thought it did, but it lives in many states in the south-central United States. It is found throughout Kentucky.
