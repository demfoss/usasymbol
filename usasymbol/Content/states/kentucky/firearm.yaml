seo_title: "Kentucky State Firearm: The Kentucky Long Rifle"
seo_description: "Kentucky's official state firearm is the Long Rifle — the flintlock that won the frontier and Battle of New Orleans, though invented in Pennsylvania."

intro_text: "Long before Kentucky was a state, the long rifle was already its instrument — the tool that opened the wilderness, fed families through harsh winters, and defended homesteads on the edge of the known world. Carried by Daniel Boone, wielded by frontier marksmen, and immortalized in song, the Kentucky Long Rifle became the defining weapon of America's frontier era — and one of the most storied entries in the [official state weaponry in America](/symbols/firearms)."

big_stat:
  number: "200"
  description: "Yards of effective range — more than double the accuracy of smoothbore muskets. At the Battle of New Orleans, Kentucky riflemen reportedly struck British officers at distances that seemed impossible to their opponents."

timeline:
  - year: "circa 1740"
    description: "Pennsylvania German gunsmiths in Lancaster County develop the long rifle, elongating the barrel and cutting spiral grooves into the bore to spin the ball for unprecedented accuracy."
  - year: "1775"
    description: "Daniel Boone leads the Transylvania Company expedition to blaze the Wilderness Road through the Cumberland Gap into Kentucky, relying on the long rifle for survival across 300 miles of untamed wilderness."
  - year: "1815"
    description: "Kentucky riflemen under General Andrew Jackson help decisively defeat British forces at the Battle of New Orleans, cementing the long rifle's reputation as the frontier's defining weapon."
  - year: "1821"
    description: "Samuel Woodworth writes 'The Hunters of Kentucky,' a widely popular ballad celebrating Kentucky marksmen that permanently anchors the name 'Kentucky Rifle' in American culture."
  - year: "2013"
    description: "Governor Steve Beshear signs House Bill 239, officially designating the Kentucky Long Rifle as the Commonwealth of Kentucky's official state firearm."

expert_quote:
  text: "Though forged in Pennsylvania, the Kentucky rifle earned its name on the Kentucky frontier — where it was carried by men who valued accuracy above all else."
  source: "Kentucky Historical Society — state firearm designation research, 2013"

sections:
  - id: "naming-controversy"
    icon: "fa-question-circle"
    title: "The Pennsylvania-Kentucky Naming Debate"
    paragraphs:
      - "Few American icons have a more complicated identity than the Kentucky Long Rifle. Despite its name, the rifle was manufactured almost entirely in Pennsylvania — primarily in Lancaster County, where German immigrant gunsmiths brought Old World metalworking traditions to a new continent. The rifle began its life as the 'Pennsylvania Rifle' or 'Lancaster Rifle,' and historians still point to this origin when discussing the famous misnomer."
      - "The shift in naming traces to frontier culture and popular song rather than geography. Kentucky frontiersmen — hunters, scouts, and militiamen — became synonymous with the weapon through generations of use in the wilderness beyond the Appalachians. When Samuel Woodworth wrote the ballad 'The Hunters of Kentucky' in 1821, celebrating the marksmen who helped defeat the British at the Battle of New Orleans, the name 'Kentucky Rifle' embedded itself permanently in American memory."
      - "Kentucky's 2013 legislative designation acknowledges this cultural reality: the rifle may have been built in Pennsylvania, but it was defined — and named — on the Kentucky frontier. House Bill 239 formally recognizes the rifle as an emblem of Kentucky's pioneer heritage and its role in shaping the American identity."

  - id: "legislation-hb239"
    icon: "fa-scale-balanced"
    title: "HB 239: Official State Firearm Designation"
    paragraphs:
      - "The Kentucky Long Rifle received official recognition through House Bill 239, introduced by Representative Tommy Turner in the 2013 Kentucky General Assembly. The bill passed both chambers with broad bipartisan support, backed by the Kentucky Gunmakers Association and historical preservation advocates who argued the rifle's connection to Kentucky's frontier identity warranted formal acknowledgment and supported [the Bluegrass State narrative](/states/kentucky/nickname/the-bluegrass-state)."
      - "Governor Steve Beshear signed HB 239 into law in June 2013, making Kentucky one of a growing number of states to formally honor their firearms heritage through legislation. The designation acknowledges not only the rifle's historical significance but its enduring role as a symbol of Kentucky craftsmanship, frontier independence, and contributions to the American story, alongside [Kentucky's state motto](/states/kentucky/motto/united-we-stand-divided-we-fall)."

  - id: "daniel-boone"
    icon: "fa-person-hiking"
    title: "Daniel Boone and the Kentucky Wilderness"
    paragraphs:
      - "No figure is more closely associated with the Kentucky Long Rifle than Daniel Boone. In 1775, Boone led the Transylvania Company's expedition to blaze the Wilderness Road through the Cumberland Gap — a grueling 300-mile path through some of the most challenging terrain in North America. His long rifle was not a trophy. It was survival equipment, as essential to the journey as food and water."
      - "Boone's rifle provided food during months in the wilderness, protection across hostile terrain, and the practical means to sustain a small party of settlers far beyond the reach of any settlement. His marksmanship became legendary, and stories of his accuracy — both real and embellished — helped shape the Kentucky frontier mythology that would define American identity for generations. The long rifle and Daniel Boone remain inseparable in American historical imagination."

  - id: "technical-marvel"
    icon: "fa-crosshairs"
    title: "Engineering the Rifled Barrel"
    paragraphs:
      - "The Kentucky Long Rifle's defining innovation was its rifled bore — spiral grooves cut into the barrel's interior that imparted stabilizing spin to the lead ball. This seemingly simple improvement transformed firearm accuracy. A smoothbore musket was considered effective at 50–75 yards. A skilled marksman with a long rifle could reliably hit a target at 200 yards or more, with some accounts placing accurate shots even farther, and this precision culture shaped [Kentucky's gray squirrel hunting tradition](/states/kentucky/mammal/gray-squirrel)."
      - "Pennsylvania German gunsmiths achieved this through deliberate design: longer barrels (40–48 inches) increased accuracy by extending the sight radius and allowing the powder charge to fully combust before the ball left the muzzle. The patch-and-ball loading system — wrapping the lead ball in a greased linen patch — engaged the rifling consistently, delivering shot-to-shot accuracy that contemporary armies simply could not match with standard-issue smoothbore muskets."
    subsections:
      - subtitle: "Key Technical Specifications"
        list:
          - "**Barrel length:** 40–48 inches (typical)"
          - "**Caliber:** .40–.50 (varies by maker)"
          - "**Effective range:** 150–200+ yards"
          - "**Action:** Flintlock ignition"
          - "**Loading system:** Patch-and-ball muzzleloader"
          - "**Weight:** 7–10 lbs depending on stock and barrel"
      - subtitle: "Rifle vs. Musket: The Range Advantage"
        img: "museum-artifact"
        text: "The long rifle’s smaller bore and rifled barrel delivered a dramatically longer effective range than the standard smoothbore musket, reshaping what frontier marksmen could do in the field."

  - id: "comparison"
    icon: "fa-scale-balanced"
    title: "State Firearms: A Regional Comparison"
    paragraphs:
      - "The Kentucky Long Rifle shaped firearms history across multiple states. Indiana and Pennsylvania both have direct historical connections to the long rifle tradition and have designated related firearms as official state symbols. Kentucky's designation can also be compared in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
    subsections:
      - subtitle: "Indiana State Firearm: The Grouseland Rifle (John Small)"
        text: "Indiana designated the rifle crafted by John Small — frontier gunsmith, first Sheriff of Knox County, and designer of the Indiana Territorial Seal — as its state firearm in 2012. Small's rifles were handcrafted in Vincennes during the Indiana territorial period, representing the same long rifle tradition carried westward by Kentucky and Pennsylvania frontiersmen."
        link:
          label: "View Indiana State Firearm"
          url: "/states/indiana/firearm/grouseland-rifle"
      - subtitle: "Pennsylvania Long Rifle: The Original"
        text: "Pennsylvania can claim the Kentucky Long Rifle's actual birthplace. Lancaster County workshops — staffed by German immigrant craftsmen in the 18th century — produced the overwhelming majority of these weapons. Pennsylvania's firearms heritage runs directly through the gunsmiths whose craft defined the American long rifle tradition."
        link:
          label: "View Pennsylvania State Firearm"
          url: "/states/pennsylvania/firearm/pennsylvania-long-rifle"

  - id: "where-to-see"
    icon: "fa-building-columns"
    title: "Where to See a Kentucky Long Rifle Today"
    paragraphs:
      - "Several Kentucky museums maintain original long rifle collections, offering visitors a chance to see these precision instruments up close and understand their place in state and national history."
    subsections:
      - subtitle: "Kentucky Historical Society — Frankfort"
        text: "The Kentucky Historical Society's museum in Frankfort holds significant collections of frontier-era artifacts, including original long rifles from the 18th and early 19th centuries. Their permanent exhibitions document Kentucky's role in American frontier expansion, with context connecting the rifle to figures like Daniel Boone and the broader settlement of the western frontier."
      - subtitle: "Frazier History Museum — Louisville"
        text: "The Frazier History Museum in Louisville features an extensive arms and armor collection spanning centuries of military history. Kentucky Long Rifles appear alongside British and American military weapons from the Revolutionary and Civil War eras, giving visitors rich historical context for the rifle's role in American military and frontier history."

