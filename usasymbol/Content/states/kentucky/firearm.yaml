faq:
  - question: "Why is it called the Kentucky Long Rifle if it was made in Pennsylvania?"
    answer: "The rifle was manufactured primarily by Pennsylvania German gunsmiths in Lancaster County, but Kentucky frontiersmen became so associated with the weapon that popular culture — particularly Samuel Woodworth's 1821 ballad 'The Hunters of Kentucky' — gave it the Kentucky name. Kentucky's 2013 state firearm designation embraces this cultural identity over geographic origin."
  - question: "When did Kentucky designate the Kentucky Long Rifle as its official state firearm?"
    answer: "Kentucky officially designated the Kentucky Long Rifle as its state firearm in 2013, when Governor Steve Beshear signed House Bill 239 into law. The bill was sponsored by Representative Tommy Turner and passed with bipartisan support from the Kentucky General Assembly."
  - question: "What made the Kentucky Long Rifle more accurate than other firearms of its era?"
    answer: "The rifle featured a rifled bore — spiral grooves that spin the lead ball for ballistic stability — combined with a long barrel (40–48 inches) that extended accuracy and allowed the powder charge to fully combust before the ball exited the muzzle. This design achieved effective ranges of 150–200+ yards, far exceeding the 50–75 yard effective range of smoothbore muskets used by most armies."
  - question: "Did Daniel Boone really carry a Kentucky Long Rifle?"
    answer: "Yes. Daniel Boone relied on a long rifle throughout his frontier expeditions, most famously during his 1775 journey blazing the Wilderness Road through the Cumberland Gap into Kentucky. The rifle was his primary survival tool — used for hunting, protection, and sustaining his party during months in the wilderness."
  - question: "Who sponsored the legislation designating the Kentucky Long Rifle as the state firearm?"
    answer: "House Bill 239 was sponsored by Representative Tommy Turner in the 2013 Kentucky General Assembly. The Kentucky Gunmakers Association and historical preservation advocates supported the bill, which Governor Steve Beshear signed into law in June 2013."
