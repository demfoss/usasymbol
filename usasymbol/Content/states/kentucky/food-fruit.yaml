sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Kentucky's State Fruit?"
    paragraphs:
      - "The blackberry is Kentucky's official state fruit, designated by the Kentucky General Assembly in 2004. Blackberries grow wild in fields and along fence rows throughout the state, and are also grown on farms."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Blackberry"
    paragraphs:
      - "Blackberries are small, dark purple to black fruits that grow in clusters on thorny bramble canes. In Kentucky they ripen in early to mid summer and are picked both wild and on farms for eating fresh, baking, and preserving."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Blackberry Became Kentucky's State Fruit"
    paragraphs:
      - "The Kentucky General Assembly designated the blackberry the official state fruit in 2004."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Kentucky Chose the Blackberry"
    paragraphs:
      - "Blackberries grow wild throughout Kentucky and have long been picked for jams, cobblers, and pies, making the fruit a familiar part of the state's rural food traditions."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blackberry Facts"
    facts:
      - "Adopted as Kentucky's state fruit in 2004."
      - "Blackberries grow wild across Kentucky's fields and fence rows."
      - "Kentucky blackberries typically ripen in early to mid summer."

