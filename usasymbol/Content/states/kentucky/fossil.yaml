faq:
- question: What is Kentucky's state fossil?
  answer: "Kentucky's state fossil is the brachiopod, a two-shelled Paleozoic marine invertebrate. The legislature designated the entire brachiopod group in 1986, without naming a specific genus or species."
- question: When did Kentucky adopt its state fossil?
  answer: "Kentucky adopted the brachiopod as its official state fossil in 1986."
- question: What did the brachiopod look like?
  answer: "A brachiopod had two shells — one larger than the other — hinged together, with a fleshy stalk anchoring it to the seafloor. Most Kentucky brachiopod shells are 0.5 to 3 inches across, ribbed or smooth, and range from round to fan-shaped depending on the species."
- question: Where are brachiopod fossils found in Kentucky?
  answer: "Brachiopod fossils are found across nearly the entire state. Ordovician brachiopods are common in northern Kentucky around Boone and Kenton counties. Devonian and Mississippian brachiopods appear in central and south-central Kentucky. The Falls of the Ohio near Louisville exposes one of the largest Devonian reef flats in the world, dense with brachiopod shells."
- question: When did the brachiopod live?
  answer: "Brachiopods as a group first appeared in the Cambrian and reached peak diversity during the Ordovician through Devonian, roughly 485 to 360 million years ago. The species found in Kentucky lived from about 485 to 300 million years ago. A small number of brachiopod lineages still exist in today's oceans."
- question: Who pushed to make it the state fossil?
  answer: "Kentucky designated the brachiopod in 1986. The choice of the entire group rather than one species reflected the extraordinary range of brachiopod fossils found across the state's Paleozoic rock sequence, spanning Ordovician through Pennsylvanian formations over more than 180 million years of geologic time."

