- id: facts
  icon: fa-solid fa-lightbulb
  title: Brachiopod Facts
  facts:
  - "Kentucky designated the brachiopod as its state fossil in 1986 — naming the entire group, not a single species, because hundreds of brachiopod species appear across the state's Ordovician through Pennsylvanian rocks."
  - "Brachiopods look like clams but are not related to them; their two shells are top and bottom, not left and right, and they belong to a completely separate invertebrate lineage."
  - "Brachiopods were the dominant seafloor invertebrate for over 200 million years during the Paleozoic era, before the end-Permian mass extinction 252 million years ago wiped out most families."
  - "A small number of brachiopod lineages survived the Permian extinction and still live in today's oceans, making them one of the longest-persisting animal groups on Earth."
  - "Brachiopod shells are embedded in the cut limestone of older Kentucky buildings and appear in road cuts, creek beds, and plowed fields across the state."

