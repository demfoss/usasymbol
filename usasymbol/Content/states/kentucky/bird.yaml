faq:
- question: What is Kentucky's official state bird?
  answer: Kentucky's official state bird is the Northern Cardinal, approved on February 17, 1926, and listed in KRS 2.080.
- question: Was Kentucky the first state to adopt the Northern Cardinal?
  answer: Yes. Kentucky approved the cardinal on February 17, 1926. Illinois, which is sometimes cited as the first cardinal state, adopted the bird in 1929 — three years later.
- question: What does Kentucky law call the state bird?
  answer: KRS 2.080 calls it the native redbird, commonly known as the Kentucky cardinal — a local name preserved in the statute rather than the neutral modern label Northern Cardinal.
- question: How is the cardinal connected to the Kentucky state flag?
  answer: KRS 2.030 requires the Kentucky cardinal in an alert but restful pose as the emblem at the head of any flagstaff used to display the state flag.
- question: Does Kentucky share the cardinal with other states?
  answer: Yes — with Illinois, Indiana, North Carolina, Ohio, Virginia, and West Virginia. Kentucky was the first of those seven states to adopt the bird and is the only one whose law specifies the cardinal's posture for official flag display.
