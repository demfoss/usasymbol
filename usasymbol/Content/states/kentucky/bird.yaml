title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1926
legislation: KRS 2.080
meaning: Kentucky's cardinal matters because it does more than fill a bird statute. The Commonwealth later wrote the Kentucky cardinal into the law governing display of the state flag, giving the bird a second official role.
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: "2026-05-02"
seo_title: "Kentucky State Bird | Northern Cardinal"
seo_description: "Kentucky was the first state to adopt the Northern Cardinal in 1926, and its law still uses the phrase Kentucky cardinal."
intro_text: 'Kentucky''s official state bird is the <strong>Northern Cardinal</strong>, approved on <strong>February 17, 1926</strong> — before any other state adopted the cardinal. Kentucky law calls the bird the <strong>native redbird, commonly known as the Kentucky cardinal</strong>, giving it a local name in statute. The Commonwealth later went further: a separate law requires the Kentucky cardinal, in an alert but restful pose, to stand as the emblem at the head of any flagstaff displaying the state flag.'
