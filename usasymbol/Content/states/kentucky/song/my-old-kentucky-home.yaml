    answer: "Kentucky's official state song is \"My Old Kentucky Home,\" adopted in 1928."
  - question: Who wrote Kentucky's state song?
    answer: "Stephen Foster wrote and composed the song, publishing it in 1853."
  - question: When did Kentucky adopt "My Old Kentucky Home" as its state song?
    answer: "The Kentucky General Assembly adopted it as the official state song in 1928."
