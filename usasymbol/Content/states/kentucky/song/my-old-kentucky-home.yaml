sections:
  - id: overview
    icon: fa-solid fa-music
    title: Kentucky State Song
    paragraphs:
      - "\"My Old Kentucky Home\" is Kentucky's official state song, adopted in 1928. Stephen Foster wrote and published it in 1853, and it later became closely tied to Federal Hill, a historic Bardstown mansion now preserved as a state park."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"My Old Kentucky Home\" Explained"
    paragraphs:
      - "The song is a slow, sentimental ballad of loss and longing for a home left behind, written in the minstrel-song style common in the 1850s. Its melody has become one of the most recognized in American music, familiar even to listeners who do not know its title."
      - "Foster composed it in 1852 and 1853, and early drafts of the song were titled \"Poor Uncle Tom, Good Night,\" showing the influence of Harriet Beecher Stowe's antislavery novel Uncle Tom's Cabin rather than any personal visit Foster made to Kentucky."
      - "The song is performed every year by the University of Louisville marching band just before the start of the Kentucky Derby, making it one of the most widely heard state songs in the country."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "My Old Kentucky Home" Represents Kentucky
    paragraphs:
      - "Kentucky adopted the song because Foster's title had already become attached to Federal Hill, a real Bardstown estate, giving the state a physical landmark to connect to the music. The mansion is now preserved as My Old Kentucky Home State Park."
      - "The song's national popularity by the 1920s also made it a recognizable symbol, and its continued use at the Kentucky Derby has kept it tied to one of the state's best-known traditions."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"My Old Kentucky Home\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "My Old Kentucky Home" Became Kentucky's State Song
    paragraphs:
      - "The Kentucky General Assembly adopted \"My Old Kentucky Home\" as the official state song in 1928, 75 years after Foster wrote it. Its lyrics have since been revised from Foster's original dialect text, and the version performed publicly today, including at the Derby, reflects those later changes rather than Foster's 1853 wording."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Kentucky

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"My Old Kentucky Home\" Facts"
    facts:
      - "Kentucky adopted \"My Old Kentucky Home\" as its official state song in 1928."
      - "Stephen Foster wrote and published the song in 1853."
      - "The University of Louisville marching band performs it before every Kentucky Derby."
      - "Federal Hill, the Bardstown mansion linked to the song's title, is now My Old Kentucky Home State Park."
      - "Kentucky also recognizes \"Blue Moon of Kentucky\" by Bill Monroe as its official bluegrass song."

