faq:
  - question: What is Kentucky's state gemstone?
    answer: "Kentucky's state gemstone is Kentucky agate, a banded variety of quartz redesignated in 2024 after previously serving as the state rock."
  - question: When did Kentucky adopt Kentucky agate as its state gemstone?
    answer: "The Kentucky General Assembly reclassified Kentucky agate as the state gemstone in 2024, after it was first named state rock in 2000."
  - question: Why did Kentucky choose Kentucky agate?
    answer: "Kentucky agate is a mineral variety of quartz found almost nowhere outside a small cluster of eastern Kentucky counties, and moving it to the gemstone title in 2024 corrected its earlier classification as a rock."
  - question: Where can you find Kentucky agate in Kentucky?
    answer: "Kentucky agate comes from a six-county district in the eastern part of the state, with Station Camp Creek near Irvine in Estill County known for producing red agate."

