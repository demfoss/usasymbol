intro_text: "Kentucky's state gemstone is Kentucky agate, redesignated in 2024 after 24 years as the state rock, a banded quartz gem collected from creek gravels in a small cluster of eastern counties. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Kentucky State Gemstone
    paragraphs:
      - "Kentucky agate is the state's official gemstone, a title it has held since 2024. It is a banded variety of quartz, first named Kentucky's state rock in 2000 before lawmakers reclassified it as a gemstone."
      - "The change corrected a scientific mismatch: agate is mineralogically a mineral variety, not a rock, so moving it to the gemstone title fixed the error while keeping Kentucky's best-known collectible stone in the spotlight."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Kentucky Agate?"
    paragraphs:
      - "Kentucky agate is a banded form of chalcedony, a cryptocrystalline variety of quartz, known for bold red, black, yellow, and gray bands that swirl through polished slices. The color comes largely from iron oxide staining picked up as the stone formed."
      - "Kentucky agate forms as a secondary mineral deposit within the Renfro-Borden Formation, an Early Mississippian-age rock layer. Collectors find it as rounded nodules washed out of eroding creek banks and gravel beds rather than mined directly from bedrock."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kentucky Chose Kentucky Agate as Its State Gemstone"
    paragraphs:
      - "Kentucky agate occurs almost nowhere else, concentrated in a six-county district in the eastern part of the state: Powell, Madison, Estill, Lee, Rockcastle, and Jackson counties. Its striking red and black banding has made it popular with rockhounds and lapidary hobbyists for decades."
      - "When the Kentucky General Assembly corrected the state's mineral and rock symbols in 2024, agate's mineralogy made gemstone the more accurate title. Its distinctive local origin and long collecting tradition made it an easy choice to keep as an official Kentucky symbol."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Kentucky Agate Became Kentucky's State Gemstone"
    paragraphs:
      - "Kentucky first named the stone its state rock in 2000. In 2024, the Kentucky General Assembly passed a bill sponsored by Representative Al Gentry that reclassified Kentucky agate as the state gemstone, made coal the state rock, and named calcite the new state mineral, correcting decades-old classification errors in one bill."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Kentucky Agate Is Found in Kentucky"
    paragraphs:
      - "The Kentucky agate district covers six counties in the eastern part of the state, with Estill County, near Irvine, at its center. Station Camp Creek, near Irvine, is one of the few places in the world known to produce red agate and remains a popular collecting spot after spring rains."
    sites:
      - name: Station Camp Creek
        city: Irvine
        lat: 37.6961
        lng: -83.9741
        note: "Noted collecting site for red Kentucky agate"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Kentucky Agate Facts"
    facts:
      - "Redesignated Kentucky's state gemstone in 2024, after being named state rock in 2000."
      - "Kentucky agate is concentrated in just six counties: Powell, Madison, Estill, Lee, Rockcastle, and Jackson."
      - "Station Camp Creek in Estill County is one of the few places in the world known to produce red agate."
      - "Its bands of red, black, yellow, and gray come mainly from iron oxide picked up as the stone formed within the Renfro-Borden Formation."

