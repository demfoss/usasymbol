seo:
  title: "Kentucky Last Names: Top Surnames and Meanings"
  description: "The most common last names in Kentucky are Johnson, Jones, and Brown. See all 20 top surnames with counts, origins, meanings, and settlement history."

page:
  h1: "Most Common Last Names in Kentucky"
  intro: "Johnson, Jones, and Brown top Kentucky's surname list, a ranking shaped by the state's heavy Scots-Irish and English settlement through the Cumberland Gap corridor in the late 1700s. Johnson alone appears nearly 34,000 times in state records. These three names together account for more than 93,000 Kentuckians."
  heritage_title: "Appalachian Roots and the Cumberland Gap Migration"
  heritage_body: "Most of Kentucky's dominant surnames trace directly to the Scots-Irish and English settlers who pushed through the Cumberland Gap into Harlan, Bell, and Knox counties from the 1770s onward. Daniel Boone's Wilderness Road, blazed in 1775, funneled thousands of Virginia and Carolina families into the Bluegrass region within a single generation. Names like Hall, Adams, and Howard became concentrated in eastern Kentucky's coal counties during the 1880s and 1890s as mining operations drew extended family networks into the same hollows. The relative isolation of Appalachian Kentucky through the early twentieth century meant these founding surnames compounded locally rather than diluting through large-scale immigration from southern or eastern Europe."
  fun_fact: "Mattingly is one of Kentucky's clearest signature surnames because it points to the old Catholic settlement belt around Nelson, Washington, and Marion counties. Slone, Caudill, Combs, and Mullins tell a different Kentucky story: eastern Appalachian family networks that stayed rooted in the same mountain counties for generations."

surnames:
  - rank: 1
    name: Johnson
    count: 33998
    ratio: 132
    origin: english
    type: Patronymic
    meaning: "From the Middle English patronymic meaning 'son of John,' itself derived from the Hebrew Yohanan, meaning 'God is gracious.' Johnson became one of the most common surnames carried through the Cumberland Gap by Scots-Irish settlers in the 1770s and 1780s, and it remains the single most frequent surname in Kentucky today."

  - rank: 2
    name: Jones
    count: 30292
    ratio: 148
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning 'son of John,' derived from the Welsh given name Ieuan or Siôn. Welsh and border-English families bearing the Jones surname were among the earliest settlers in central and eastern Kentucky, and the name appears prominently in land grant records from Fayette and Madison counties dating to the 1780s."

  - rank: 3
    name: Brown
    count: 28969
    ratio: 155
    origin: english
    type: Descriptive
    meaning: "From Old English brun, referring to a person with brown hair, complexion, or clothing. Brown arrived in Kentucky primarily through Virginia and North Carolina settler families who entered the state along the Wilderness Road in the late eighteenth century."

  - rank: 4
    name: Williams
    count: 24612
    ratio: 182
    origin: welsh
    type: Patronymic
    meaning: "A patronymic meaning 'son of William,' from the Norman given name Willahelm, meaning 'will helmet' or resolute protector. Williams spread widely through Kentucky's Bluegrass counties in the early 1800s, carried by Welsh-descended families migrating from Virginia and the Carolinas."

  - rank: 5
    name: Miller
    count: 24456
    ratio: 183
    origin: english
    type: Occupational
    meaning: "From Middle English milnere or millere, denoting a person who operated a grain mill. Gristmills were essential infrastructure in early Kentucky settlements, and families bearing the Miller surname appear in county records across the Bluegrass and Pennyrile regions from the earliest decades of statehood in the 1790s."

  - rank: 6
    name: Wilson
    count: 20778
    ratio: 216
    origin: english
    type: Patronymic
    meaning: "A patronymic meaning 'son of Will,' a short form of William, from the Norman Willahelm. Wilson was common among the Scots-Irish settlers who entered Kentucky through the Cumberland Gap and established farms in Lincoln and Garrard counties during the 1780s and 1790s."

  - rank: 7
    name: Davis
    count: 20446
    ratio: 219
    origin: welsh
    type: Patronymic
    meaning: "From the Welsh and English patronymic meaning 'son of David,' derived from the Hebrew Dawid, meaning beloved. Davis-bearing families were among the early settlers of the Green River country in south-central Kentucky, and the name appears consistently in Butler and Warren county land records from the early 1800s."

  - rank: 8
    name: Hall
    count: 19540
    ratio: 230
    origin: english
    type: Habitational
    meaning: "From Old English heall, referring to someone who lived at or worked in a large hall or manor house. Hall is significantly overrepresented in Kentucky relative to the national average, concentrated in Letcher, Pike, and Harlan counties in the eastern coalfields, where English settler families established deep generational roots beginning in the early nineteenth century."

  - rank: 9
    name: Moore
    count: 17382
    ratio: 258
    origin: english
    type: Topographic
    meaning: "From Old English mor, meaning an open expanse of uncultivated upland or boggy ground. Moore-bearing families entered Kentucky primarily from Virginia and the Carolinas, and the name appears in early deed records across the Bluegrass region, particularly in Bourbon and Scott counties, from the 1790s onward."

  - rank: 10
    name: Taylor
    count: 17293
    ratio: 259
    origin: english
    type: Occupational
    meaning: "From the Old French tailleur, meaning a cutter of cloth, denoting a tailor by trade. Taylor is one of the most common occupational surnames in Kentucky, carried into the state by English settler families and appearing in early court records across Mercer, Nelson, and Washington counties in the late 1700s."

  - rank: 11
    name: Thompson
    count: 15959
    ratio: 281
    origin: english
    type: Patronymic
    meaning: "A patronymic meaning 'son of Thomas,' from the Aramaic given name Toma, meaning twin. Thompson was common among Scots-Irish families who settled the eastern Kentucky mountains and the Licking River valley in the early nineteenth century, and it remains notably concentrated in that region today."

  - rank: 12
    name: Clark
    count: 15588
    ratio: 288
    origin: english
    type: Occupational
    meaning: "From Old English clerc or cleric, originally denoting a clergyman or a literate person who kept records. Clark is overrepresented in Kentucky relative to the national average, and the name gained particular prominence in the state through the legacy of explorer George Rogers Clark, whose family settled in Jefferson County in the 1780s."

  - rank: 13
    name: Thomas
    count: 14749
    ratio: 304
    origin: welsh
    type: Patronymic
    meaning: "From the Aramaic given name Toma, meaning twin, adopted widely in Wales and England after the apostle Thomas. Welsh-descended families bearing Thomas as a surname were among the settlers of the Bluegrass counties in the late eighteenth century, and the name appears in early Fayette and Jessamine county records."

  - rank: 14
    name: Martin
    count: 14563
    ratio: 308
    origin: english
    type: Patronymic
    meaning: "From the Latin given name Martinus, derived from Mars, the Roman god of war. Martin arrived in Kentucky primarily through English and Scots-Irish settler families from Virginia, and it appears in land grant records across the central Bluegrass region from the 1780s onward."

  - rank: 15
    name: Adams
    count: 14472
    ratio: 310
    origin: english
    type: Patronymic
    meaning: "A patronymic meaning 'son of Adam,' from the Hebrew adam, meaning man or earth. Adams is overrepresented in Kentucky compared to its national rank, appearing frequently in eastern Appalachian counties where English settler families established farms in the early 1800s and the name compounded through large multi-generational households."

  - rank: 16
    name: Baker
    count: 13644
    ratio: 329
    origin: english
    type: Occupational
    meaning: "From Old English baecere, denoting a person who baked bread professionally. Baker is more common in Kentucky than its national rank would suggest, and the name appears in early records across the central and western Bluegrass, carried by English settler families who moved into the state from Virginia and Maryland in the late eighteenth century."

  - rank: 17
    name: Allen
    count: 13145
    ratio: 341
    origin: english
    type: Patronymic
    meaning: "From the Old Breton given name Alan, of uncertain meaning, possibly related to a word for rock or harmony. Allen-bearing families settled across the Pennyrile and western coalfield regions of Kentucky in the early 1800s, and the name appears in deed records from Christian and Hopkins counties from that period."

  - rank: 18
    name: Howard
    count: 12630
    ratio: 355
    origin: english
    type: Occupational
    meaning: "From Old English or Old Norse elements meaning hog warden or high guardian, originally an occupational term. Howard is strikingly overrepresented in Kentucky, ranking 18th in the state but only 70th nationally. The name clusters in eastern Kentucky's mountain counties, where Howard-bearing families arrived in the early 1800s and remained through the coal era."

  - rank: 19
    name: Jackson
    count: 12604
    ratio: 356
    origin: english
    type: Patronymic
    meaning: "A patronymic meaning 'son of Jack,' a medieval diminutive of John, from the Hebrew Yohanan. Jackson spread widely across Kentucky in the early nineteenth century, partly through the cultural influence of Andrew Jackson's popularity in the region, and the name appears in county records across the Pennyrile and Green River districts."

  - rank: 20
    name: White
    count: 12454
    ratio: 360
    origin: english
    type: Descriptive
    meaning: "From Old English hwit, describing a person with pale hair or complexion. White arrived in Kentucky with English and Scots-Irish settler families from Virginia and the Carolinas, appearing in early land records across Bourbon, Clark, and Montgomery counties from the 1790s onward."

unique_surnames:
  - name: Mattingly
    state_rank: 65
    national_rank: 2310
    origin: english
    why: "Mattingly is an English habitational surname tied to places named Mattingley or Mattingly, and in Kentucky it concentrates in the old Catholic settlement belt of Nelson, Washington, and Marion counties. English Catholic families from Maryland moved into central Kentucky in the late 1700s and early 1800s, creating a surname cluster that still feels much more Kentucky than national."

  - name: Slone
    state_rank: 96
    national_rank: 3286
    origin: irish
    why: "Slone is usually treated as a variant of Sloan, an Irish and Scottish surname from Gaelic Ó Sluaghadháin, linked to a personal name meaning 'raider.' In Kentucky it belongs especially to the eastern mountains, with Knott County strongly associated with the name through Appalachian writer Verna Mae Slone. Related Slone families stayed close as mountain communities grew around farms, creeks, and later coal work."

  - name: Caudill
    state_rank: 74
    national_rank: 1946
    origin: english
    why: "Caudill is an English surname from Middle English caudel or caudell, meaning a hot spiced drink or thin gruel, with Caldwell also listed as a possible alternate source. In Kentucky it is closely associated with the eastern Appalachian counties, especially Letcher County, where Caudills appear among early settler families and local histories. The name spread as Virginia and North Carolina families moved into the mountain creek valleys and remained there for generations."

  - name: Combs
    state_rank: 43
    national_rank: 602
    origin: english
    why: "Combs is an English topographic surname for someone who lived near a valley or hollow, a meaning that fits its Kentucky geography almost too neatly. The name concentrates in Perry, Knott, Breathitt, and surrounding eastern Kentucky counties, where families moving through Virginia and North Carolina became part of the Appalachian settlement pattern."

  - name: Mullins
    state_rank: 36
    national_rank: 461
    origin: english
    why: "Mullins is usually English of Norman origin, from French place names based on Old French molins, meaning 'mills,' though an Irish Mullen-related line is also possible. In Kentucky it is strongly tied to the eastern coalfield counties. The surname spread through Appalachian family networks in places such as Pike, Letcher, and Floyd counties, where related households often stayed near the same valleys and creek settlements."

etymology_groups:
  - type: "Occupational Names"
    icon: "fa-solid fa-hammer"
    description: "Five of Kentucky's top 20 surnames are occupational in origin: Miller, Taylor, Clark, Baker, and Howard. That count is consistent with the national pattern but reflects a specifically English and Scots-Irish occupational naming tradition rather than the German or Scandinavian occupational surnames more common in Midwestern states."
    examples:
      - Miller (grain mill operator)
      - Taylor (cloth cutter)
      - Clark (cleric or record keeper)
      - Baker (bread baker)
      - Howard (hog warden)

  - type: "Patronymic Names"
    icon: "fa-solid fa-person"
    description: "Patronymics dominate Kentucky's top 20, with at least ten surnames derived from a father's given name: Johnson, Jones, Williams, Wilson, Davis, Thompson, Thomas, Martin, Adams, Allen, and Jackson. This heavy patronymic presence reflects the Welsh and Scots-Irish settler majority, both cultures with strong patronymic naming traditions that carried directly into Kentucky's founding population."
    examples:
      - Johnson (son of John)
      - Jones (son of John, Welsh form)
      - Williams (son of William)
      - Wilson (son of Will)
      - Davis (son of David)

  - type: "Descriptive or Place-Based Names"
    icon: "fa-solid fa-map-location-dot"
    description: "Descriptive and habitational surnames account for a smaller share of Kentucky's top 20, with Brown, White, Moore, and Hall representing this category. Moore and Hall both carry topographic or habitational roots tied to English landscape features, and both are overrepresented in Kentucky relative to national averages, particularly in the eastern mountain counties."
    examples:
      - Brown (brown hair or complexion)
      - White (pale hair or complexion)
      - Moore (near an open moor)
      - Hall (near or at a large hall)

faq:
  - question: "What is the most common last name in Kentucky?"
    answer: "Johnson is the most common last name in Kentucky, with approximately 33,998 people bearing the surname according to 2010 Census-era data. That works out to roughly 1 in every 132 Kentucky residents. Jones and Brown rank second and third."

  - question: "What last names are most common in eastern Kentucky?"
    answer: "Hall, Howard, Adams, and Thompson are among the surnames most heavily concentrated in eastern Kentucky's Appalachian counties. Hall and Howard in particular rank far higher in Kentucky than nationally, reflecting the deep roots of English settler families in Harlan, Pike, Letcher, and Floyd counties from the early 1800s onward."

