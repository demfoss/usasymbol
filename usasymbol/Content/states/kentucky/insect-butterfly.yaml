faq:
- question: What is Kentucky's state butterfly?
  answer: "Kentucky's state butterfly is the viceroy, adopted by the Kentucky General Assembly in 1990."
- question: When did Kentucky adopt the viceroy butterfly?
  answer: "Kentucky adopted the viceroy as its official state butterfly in 1990."
- question: What does the viceroy butterfly look like?
  answer: "It has orange wings with black veins and borders, very close to a monarch, but with an extra black line crossing the veins on its hindwings."
- question: Where is the viceroy butterfly found in Kentucky?
  answer: "It is found statewide near streams, wetlands, and forest edges where willow, poplar, and cottonwood trees grow."
- question: Is the viceroy the same as a monarch butterfly?
  answer: "No. The viceroy is a separate species that closely resembles the monarch. The easiest way to tell them apart is the black line crossing the veins on the viceroy's hindwings."

