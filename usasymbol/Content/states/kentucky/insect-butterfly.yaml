sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Kentucky?
  paragraphs:
  - "The viceroy, Limenitis archippus, is Kentucky's official state butterfly. The Kentucky General Assembly designated it in 1990."
  - "The viceroy closely resembles the monarch butterfly, but it is a separate species with its own distinct markings."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Viceroy Butterfly
  paragraphs:
  - "The viceroy has orange wings crossed by black veins and a black-bordered edge, a pattern very close to the monarch's."
  - "The easiest way to tell them apart is a black line that crosses the veins on the viceroy's hindwings, a feature the monarch does not have."
  - "Adults have a wingspan of about 2.5 to 3 inches, somewhat smaller than the monarch."

- id: history
  icon: fa-solid fa-landmark
  title: How Kentucky Chose the Viceroy Butterfly
  paragraphs:
  - "The Kentucky General Assembly designated the viceroy as the official state butterfly in 1990."
  - "The viceroy's coloring, close to that of the monarch, is thought to help protect it from predators that avoid the monarch's bitter taste, even though the viceroy itself is not toxic."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Viceroy Butterfly in Kentucky
  paragraphs:
  - "Viceroys are found across Kentucky, usually near streams, wetlands, and forest edges where willow, poplar, and cottonwood trees grow."
  - "Caterpillars feed only on the leaves of these trees, so viceroys are most common wherever willows and poplars are nearby."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Viceroy Butterfly Facts
  facts:
  - "Adopted: 1990, by the Kentucky General Assembly."
  - "Scientific name: Limenitis archippus."
  - "Wingspan: about 2.5 to 3 inches, smaller than the similar-looking monarch."
  - "A black line crossing the hindwing veins is the key way to tell a viceroy from a monarch."
  - "Caterpillars feed only on willow, poplar, and cottonwood leaves."




