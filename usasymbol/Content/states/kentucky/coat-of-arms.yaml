type: State Coat of Arms
state: Kentucky
name: Kentucky State Coat of Arms
adopted_year: 1792
is_official: true
meaning: "The Kentucky coat of arms centers on a single image: two men choosing to embrace. One comes from the frontier, the other from government. The motto beneath them, United We Stand, Divided We Fall, comes from John Dickinson's 1768 Liberty Song, written before Kentucky was even a state. Together, the image and the motto say that Kentucky was built by cooperation, not by any one group alone."
meaning_title: Meaning of the Kentucky Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-20'
date_modified: '2026-05-20'
seo_title: 'Kentucky Coat of Arms: Meaning, Symbols and History'
seo_description: "The Kentucky coat of arms was adopted in 1792 and shows a pioneer and a statesman embracing, with the motto United We Stand, Divided We Fall."
hero_image: /images/coats-of-arms/kentucky/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the Commonwealth of Kentucky, showing a pioneer in buckskin and a statesman in a swallowtail coat in a full embrace, adopted 1792
hero_image_caption: The Kentucky Coat of Arms, established December 20, 1792. A pioneer in buckskin and a statesman in a swallowtail coat stand together at the center. The outer ring reads "Commonwealth of Kentucky" and the inner circle carries the motto United We Stand, Divided We Fall.
intro_text: "On December 20, 1792, the Kentucky General Assembly created the Kentucky coat of arms, requiring it to show two friends embracing with the motto United We Stand, Divided We Fall. The original seal was engraved in 1793 by David Humphries, a silversmith from Lexington. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Kentucky Coat of Arms?
  paragraphs:
  - "The Kentucky coat of arms appears on a blue background with gold details. At its center, two men stand in a full embrace: one in frontier buckskin, one in a formal swallowtail coat. The outer ring of the design carries the words 'Commonwealth of Kentucky.' The state motto circles the two figures inside."
  - "Unlike many state coats of arms built around a quartered shield or complex heraldry, Kentucky's design is built around a single human gesture. The coat of arms is also the state seal, and it appears on the state flag, official documents, and government buildings across the commonwealth."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Kentucky Coat of Arms
  paragraphs:
  - "Kentucky became the fifteenth state on June 1, 1792. That same year, on December 20, the Kentucky General Assembly passed an act creating the state seal. The act described the design simply: 'two friends embracing, with the name of the state over their heads and around about the following motto: United we stand, divided we fall.'"
  - "A Lexington silversmith named David Humphries was hired to engrave the original seal in 1793. Humphries made two changes from what the law described. Instead of hunting clothes, he dressed both figures in swallowtail coats. Instead of a handshake, he showed a full embrace."
  - "The original seal was lost when fire destroyed Kentucky's first capitol in 1814. The design survived through copies and impressions made before the fire. New seals were produced to replace it, but different engravers interpreted the design differently over the following decades, producing versions that varied in the clothing, poses, and faces of the two figures."
  - "In 1954, Louisville artist Ernie Giancola redesigned the seal with a more natural handshake between the figures. In 1962, the General Assembly settled the longstanding variation by legally specifying what the design should show: a pioneer meeting a gentleman in a swallowtail coat."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Kentucky Coat of Arms
  paragraphs:
  - "The Kentucky coat of arms builds its meaning around two figures and a motto rather than a divided shield with multiple emblems. Each element connects to the founding principles of the state."
  elements:
  - id: figures
    name: The Pioneer and the Statesman
    image: /images/coats-of-arms/kentucky/elements/figures.webp
    paragraphs:
    - "At the center of the coat of arms, two men share a full embrace. The 1962 General Assembly described them as 'a pioneer meeting a gentleman in a swallowtail coat.' The pioneer wears frontier buckskin; the statesman wears a formal coat. They face each other and hold one another close."
    - "Official sources say the figures represent all frontiersmen and all statesmen, not any specific people. Popular tradition has long linked them to Daniel Boone and Henry Clay, but neither the original 1792 act nor any later legislation identifies them by name."
  - id: motto
    name: United We Stand, Divided We Fall
    image: /images/coats-of-arms/kentucky/elements/motto.webp
    paragraphs:
    - "The motto circles the two figures inside the coat of arms. It reads: United We Stand, Divided We Fall. The phrase comes from The Liberty Song, a patriotic song written by Founding Father John Dickinson in 1768. The original line read: 'By uniting we stand, by dividing we fall.'"
    - "The 1792 act that created the coat of arms specified this motto from the start. Dickinson wrote the song in response to British taxation before any American state existed, making it one of the earliest expressions of the idea of American unity."
  - id: ring
    name: Commonwealth of Kentucky
    image: /images/coats-of-arms/kentucky/elements/ring.webp
    paragraphs:
    - "The outer ring of the coat of arms carries the words 'Commonwealth of Kentucky.' Kentucky is one of four U.S. states that uses the word 'Commonwealth' in its official name, alongside Virginia, Massachusetts, and Pennsylvania. The outer ring marks this on every use of the coat of arms."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Kentucky Coat of Arms
  paragraphs:
  - "The Kentucky coat of arms does not use a shield divided by the flags of past governments or military symbols. Instead, it uses a single moment: two people choosing to come together. The pioneer and the statesman represent the two groups who built Kentucky, and the embrace shows them acting as equals."
  - "The motto adds a specific political idea to that image. 'United We Stand, Divided We Fall' was written in 1768 during the colonial crisis. By placing it on the coat of arms in 1792, Kentucky's founders connected the new state to the broader American case for unity."
  - "The design has stayed recognizable across more than two centuries because the core image is simple enough to survive translation across engravers, artists, and printing technologies. The clothing and poses have shifted; the gesture has not."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Kentucky Coat of Arms Facts
  facts:
  - "Adopted: December 20, 1792, when the Kentucky General Assembly passed an act requiring a seal showing 'two friends embracing' and the motto United We Stand, Divided We Fall."
  - "Original engraver: David Humphries, a Lexington silversmith, who produced the first seal in 1793. His version placed both figures in swallowtail coats instead of the frontier clothing the original act described."
  - "The original seal was destroyed when fire burned Kentucky's first capitol building in 1814."
  - "In 1954, Louisville artist Ernie Giancola redesigned the seal with a more natural handshake between the two figures."
  - "The motto comes from The Liberty Song, written by Founding Father John Dickinson in 1768. The original line was 'By uniting we stand, by dividing we fall' — written before Kentucky was a state."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Kentucky Coat of Arms
  paragraphs:
  - "The Kentucky coat of arms has gone through several distinct versions since 1792. Different engravers interpreted the original act in different ways, producing seals that varied in the clothing, poses, and faces of the two figures while keeping the same motto and the same basic gesture."
  - "The original 1793 seal by David Humphries was lost when fire destroyed the state capitol in 1814. What survives is a long sequence of later renderings: early seal impressions, Victorian-era redrawings, early twentieth-century revisions, and the standardized form used today after the 1962 legislative clarification."
