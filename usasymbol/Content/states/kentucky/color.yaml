sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Kentucky has not passed a separate state-colors law. Navy blue and gold are the traditional state colors through the Kentucky Commonwealth flag, adopted by the Kentucky General Assembly on March 26, 1918, and governed by Kentucky Revised Statutes § 2.030. The statute specifies the flag in precise terms: a field of navy blue bearing the Commonwealth's seal encircled by a wreath whose lower half consists of goldenrod in bloom and whose upper half consists of the words 'Commonwealth of Kentucky.' The flag's two dominant colors — the navy blue field and the gold of the goldenrod and lettering — have represented Kentucky in official contexts for over a century and reinforce [the Bluegrass State identity](/states/kentucky/nickname/the-bluegrass-state)."
      - "Kentucky's path to the 1918 flag was shaped by its unusual Civil War identity. Unlike most states that fought entirely for one side, Kentucky was a divided border state: it formally declared neutrality at the war's outset, then attempted to align with the Confederacy, before ultimately remaining in the Union under federal pressure. Both Union and Confederate flags flew over different parts of Kentucky during the war. Prior to any official state flag, Kentucky had used the 15-star United States flag as its de facto state symbol — reflecting its admission as the 15th state in 1792. The 1918 Commonwealth flag resolved this ambiguous visual history by establishing a clearly Kentucky-specific symbol in the distinctive navy blue and gold that have defined the state's official color tradition ever since."
    subsections:
      - subtitle: "Jesse Cox Burgess and the 1918 Design"
        text: "The Kentucky Commonwealth flag was designed by Jesse Cox Burgess, an art teacher based in Frankfort, Kentucky's state capital. Burgess's design featured the state seal — depicting a pioneer and a statesman embracing, surrounded by the motto 'United We Stand, Divided We Fall' — on a navy blue field, with goldenrod sprigs below and the Commonwealth's name above. While the flag was formally adopted in 1918, the specifications and colors were not fully standardized in Kentucky's statutes until 1928, and the flag's official design was not finalized until June 1962 when the state seal design was standardized. Kentucky Revised Statutes § 2.030 additionally specifies that the emblem atop the flagstaff displaying the Kentucky flag must be a Kentucky cardinal — the state bird — cast in bronze or brass in 'an alert but restful pose,' a detail unique in American state flag legislation and tied to [Kentucky's state bird page](/states/kentucky/bird/northern-cardinal)."
      - subtitle: "Kentucky Revised Statutes § 2.030 and the Commonwealth Distinction"
        text: "Kentucky is one of only four US states — alongside Virginia, Pennsylvania, and Massachusetts — to designate itself a Commonwealth rather than a state. The term, derived from the English political tradition of government for the 'common good' of the people, appears in gold lettering on the flag and distinguishes Kentucky's official color tradition from that of ordinary states. Kentucky Revised Statutes § 2.030 governing the flag does not specify Pantone values, but the University of Kentucky's official brand guidelines — which use the same navy blue and blue-tinged gold as the state flag tradition — have standardized the colors for athletic and institutional applications that are widely recognized as representing the Commonwealth's traditional palette."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Kentucky's navy blue and gold carry a symbolism rooted equally in civic tradition and natural beauty. Navy blue speaks to Kentucky's complex but ultimately Union-aligned civic identity, its legendary bluegrass landscape, and the loyalty and vigilance encoded in the state motto that dates to the American Revolution. Gold speaks to the goldenrod that blooms across Kentucky's hillsides each autumn, the golden bourbon aging in white oak barrels across the Bluegrass Region, and the golden light of the Kentucky Derby afternoon that is among the most recognized sporting images in American culture. Together, the two colors form a palette that is simultaneously historically grounded, botanically specific, and evocative of Kentucky's most celebrated sensory experiences."
    subsections:
      - subtitle: "Navy Blue in Kentucky History"
        text: "Navy blue is the color most closely associated with Kentucky's official identity, appearing on every iteration of the state's governmental symbolism since the Civil War era. Kentucky was admitted to the Union on June 1, 1792, as the 15th state — the first state west of the Appalachian Mountains — and its blue color tradition connects it to the broader American patriotic palette that navy blue represents across most Union-aligned state flags. The 'Bluegrass State' nickname, Kentucky's most celebrated geographic identity, reinforces blue as a natural color descriptor: Kentucky bluegrass (Poa pratensis), the limestone-filtered water and rich soil of the Inner Bluegrass region gives the grass a distinctive blue-green hue in spring, creating the world-famous pastures of the Lexington horse country that have produced Kentucky Derby winners for over 150 years."
      - subtitle: "Gold in Kentucky History"
        text: "Gold on the Kentucky flag derives its primary meaning from goldenrod (Solidago canadensis and related species), designated the official state flower in 1926. Goldenrod's brilliant golden-yellow plumes are one of the defining botanical spectacles of Kentucky's autumn landscape, blooming across roadsides, meadows, and the edges of horse farms throughout September and October. The plant's appearance on the state flag as the wreath encircling the seal makes it the most botanically literal color reference on any Kentucky official symbol. Gold also resonates through Kentucky's most culturally significant products: Kentucky straight bourbon whiskey, aged in charred white oak barrels that impart a characteristic golden amber color, is arguably the state's most globally recognized export; and the golden trophy of the Kentucky Derby — won at Churchill Downs in Louisville since 1875 — is the most famous prize in American horse racing. The 'Run for the Roses' takes place against a backdrop of gold: the golden Churchill Downs spires, the golden winner's trophy, and the golden spring sunlight of the first Saturday in May."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Navy blue and gold dominate the Kentucky Commonwealth flag, governed by Kentucky Revised Statutes § 2.030, which flies at the Kentucky State Capitol in Frankfort and all Commonwealth government buildings. The Kentucky state seal, whose current standardized design was finalized in 1962, depicts the pioneer-and-statesman embrace on a white disc surrounded by the gold motto arc and goldenrod wreath, with all text elements rendered in gold against the navy blue field. In 2000, the Kentucky General Assembly adopted a formal Pledge of Allegiance to the Kentucky flag — one of only 17 states with such a pledge — reading 'I pledge allegiance to the Kentucky flag, and to the Sovereign State for which it stands, one Commonwealth, blessed with diversity, natural wealth, beauty, and grace from on High.' Navy blue and gold appear consistently across Kentucky state agency branding, the Kentucky Tourism Cabinet's marketing materials, and official state publications. The University of Kentucky uses blue and white as its official colors, while the University of Louisville uses red and black — but the Commonwealth's traditional navy blue and gold, drawn directly from the 1918 flag and goldenrod tradition, remain the foundation of Kentucky's governmental public imagery and are cataloged in [U.S. state colors](/symbols/colors)."

      - "For cross-state political context, Kentucky's color evolution is often paired with [states and capital cities reference data](/rankings/geography/states-capital-cities)."

