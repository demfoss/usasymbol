seo_title: "Kentucky State Colors | Navy Blue Gold"
seo_description: "Kentucky state colors are Navy Blue and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Kentucky are **Navy Blue** and **Gold**, derived from [the Kentucky state flag](/states/kentucky/flag/kentucky-state-flag) adopted in 1918. No separate state-colors law exists, but navy blue and gold are widely recognized as the traditional colors of the Bluegrass State through the Commonwealth flag, state branding, and civic culture. For Kentucky, the color table records HEX, RGB, CMYK, and Pantone references alongside the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Navy Blue and Gold"
official_since: "Traditional (based on 1918 Commonwealth flag; Kentucky Revised Statutes § 2.030)"
primary_use: "Commonwealth Flag, state government branding, state agency insignia, University of Kentucky athletic traditions"
known_for: "Navy blue field carrying the state seal framed by golden sprigs of goldenrod — the state flower — with the words 'Commonwealth of Kentucky' in gold arc above; Kentucky is one of only four US states to designate itself a Commonwealth, and its blue-and-gold flag has borne that distinction since 1918"

