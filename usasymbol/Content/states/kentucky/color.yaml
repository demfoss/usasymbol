timeline:
  - year: "1792"
    description: "Kentucky admitted to the Union on June 1 as the 15th state, the first west of the Appalachians; in the absence of a state flag, Kentucky uses the 15-star US flag as its de facto state symbol"
  - year: "1861"
    description: "Kentucky declares neutrality at the Civil War's outset; both Union and Confederate flags fly over different parts of the state, creating the divided color tradition that the 1918 Commonwealth flag would ultimately resolve in favor of navy blue"
  - year: "1880"
    description: "A navy blue flag bearing the state seal is adopted for the Kentucky National Guard, establishing the blue-field tradition that Jesse Cox Burgess would formalize in the 1918 official Commonwealth flag design"
  - year: "1918"
    description: "Kentucky General Assembly officially adopts the Commonwealth flag on March 26 — the navy blue field with state seal, goldenrod wreath, and 'Commonwealth of Kentucky' in gold — establishing navy blue and gold as Kentucky's traditional state colors"
  - year: "1926"
    description: "Goldenrod officially designated the Kentucky state flower, retrospectively validating the gold element that had appeared on the flag since 1918 and cementing gold as a botanically grounded color in Kentucky's official palette"
  - year: "1962"
    description: "Kentucky flag standardized in June with the finalized state seal design; Kentucky Revised Statutes § 2.030 fully governs the navy blue field, goldenrod wreath, and gold lettering that define the Commonwealth's color tradition"

expert_quote:
  text: "The official state flag of the Commonwealth of Kentucky shall be of navy blue silk, nylon, wool or cotton bunting, or some other suitable material, with the seal of the Commonwealth encircled by a wreath, the lower half of which shall be goldenrod in bloom."
  source: "Kentucky Revised Statutes § 2.030 — official statutory definition of the Kentucky Commonwealth flag and its navy blue and goldenrod color specifications"

faq:
  - question: "What are the official colors of Kentucky?"
    answer: "The traditional state colors of Kentucky are Navy Blue and Gold, derived from the Kentucky Commonwealth flag adopted on March 26, 1918. Navy blue forms the entire flag field and gold appears in the goldenrod state flower wreath and the 'Commonwealth of Kentucky' lettering."
  - question: "What is the HEX code for Kentucky Navy Blue?"
    answer: "The standard HEX code for Kentucky Navy Blue is #003087, corresponding to Pantone PMS 281, as specified by Kentucky Revised Statutes § 2.030 governing the Commonwealth flag."
  - question: "What is the HEX code for Kentucky Gold?"
    answer: "The standard HEX code for Kentucky Gold is #C9A84C, corresponding to Pantone PMS 7554, representing the golden hue of the goldenrod state flower wreath and the 'Commonwealth of Kentucky' lettering on the state flag."
  - question: "Why does Kentucky use blue and gold?"
    answer: "Kentucky uses navy blue as the field color of its Commonwealth flag, representing loyalty and vigilance, while gold derives from goldenrod — the official state flower since 1926 — whose golden blooms encircle the state seal on the flag. Together the colors reflect Kentucky's civic and natural identity as the Bluegrass State."
  - question: "Who designed the Kentucky state flag?"
    answer: "The Kentucky Commonwealth flag was designed by Jesse Cox Burgess, an art teacher based in Frankfort, Kentucky's state capital. His design was adopted by the Kentucky General Assembly on March 26, 1918, though the flag's specifications were not fully standardized until 1962."
  - question: "Is Kentucky a state or a commonwealth?"
    answer: "Kentucky is legally a state but officially designates itself a Commonwealth — a term reflecting the English political tradition of government for the common good. Kentucky is one of only four US states with this designation, alongside Virginia, Pennsylvania, and Massachusetts. The word 'Commonwealth' appears in gold lettering on the state flag."
  - question: "What does the Kentucky state flag motto mean?"
    answer: "The Kentucky state motto 'United We Stand, Divided We Fall' inscribed on the state seal comes from 'The Liberty Song,' a patriotic song from the American Revolution. The motto circles the two figures — a pioneer and a statesman — embracing on the seal, symbolizing the unity of frontiersmen and statesmen in building the Commonwealth."

