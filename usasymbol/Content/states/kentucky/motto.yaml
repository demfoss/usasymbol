title: "United We Stand, Divided We Fall"
language: "English"
english_translation: ""
adopted_year: 1792

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Kentucky State Motto | United We Stand, Divided We Fall"
seo_description: "Kentucky's motto came from a Revolutionary War song that Governor Isaac Shelby personally sang at the Battle of King's Mountain in 1780. Kentucky also has a second official motto — a Latin phrase added in 2002 from the state constitution's preamble. Full history of both official mottos."

intro_text: "Kentucky's state motto is <strong>United We Stand, Divided We Fall</strong>, adopted on December 20, 1792 — six months after Kentucky became the 15th state. The phrase comes from <em>The Liberty Song</em>, a 1768 Revolutionary War anthem written by John Dickinson. Governor Isaac Shelby personally chose it: he had sung the song as a militia commander at the Battle of King's Mountain in 1780, where patriot forces surrounded and defeated a British force of over 900 men. Kentucky is unusual in having two official state mottos — in 2002, the legislature added a second Latin motto from the state constitution's preamble."

sections:
  - id: "liberty-song-origin"
    icon: "fa-solid fa-music"
    title: "The Revolutionary War Song Behind the Motto"
    paragraphs:
      - "In July 1768, the Boston Gazette published 'The Liberty Song,' written by John Dickinson of Pennsylvania — the same lawyer who would later draft the Articles of Confederation. The song was a call for colonial unity against British taxation, set to the tune of 'Hearts of Oak,' a British naval march. One verse declared: 'Then join hand in hand, brave Americans all! By uniting we stand, by dividing we fall!'"
      - "The song spread quickly through the colonies. Patriots sang it at taverns, town meetings, and military encampments. It became one of the defining anthems of the pre-revolutionary period. The phrase 'by uniting we stand, by dividing we fall' summarized the entire argument for colonial resistance: no individual colony could hold out alone against British power."
      - "Isaac Shelby heard and sang 'The Liberty Song' repeatedly during the Revolutionary War. When he became Kentucky's first governor in 1792 and the legislature needed a motto for the state seal, Shelby proposed the line he had carried for more than two decades. The legislature accepted it without modification."

  - id: "kings-mountain"
    icon: "fa-solid fa-shield-halved"
    title: "Shelby at King's Mountain: Where the Motto Was Tested"
    paragraphs:
      - "On October 7, 1780, Isaac Shelby led a force of patriot militia at the Battle of King's Mountain in South Carolina. British Major Patrick Ferguson had threatened to march into the backcountry, 'hang their leaders, and lay their country waste with fire and sword.' The patriot response was one of the largest voluntary militia mobilizations of the war — over-mountain men from what is now Tennessee, Virginia, and the Carolinas converged on Ferguson's position."
      - "Ferguson's force of approximately 900 Loyalist militia occupied the summit of Kings Mountain, a flat-topped ridge. The patriot militia surrounded the base and fought upward. Ferguson was killed during the battle. His entire force was captured, killed, or wounded — while patriot losses were far lighter. The battle took less than an hour."
      - "Historians credit King's Mountain with turning the tide of the Southern Campaign. It stopped the British advance into North Carolina and contributed directly to the British surrender at Yorktown a year later. Shelby understood viscerally what unified action could accomplish. When he chose the Kentucky motto 12 years later, he wasn't selecting a political slogan — he was describing a military lesson."

  - id: "two-official-mottos"
    icon: "fa-solid fa-scroll"
    title: "Kentucky's Second Motto, Added in 2002"
    paragraphs:
      - "Most states have one official motto. Kentucky has two. In 2002, the Kentucky legislature passed a bill making official a second motto: 'Deo gratiam habeamus' — Latin for 'Let us be grateful to God.' The phrase comes from the preamble of Kentucky's state constitution, which reads in part: 'We, the people of the Commonwealth of Kentucky, grateful to Almighty God for the civil, political and religious liberties we enjoy...'"
      - "The addition was unusual. Kentucky's primary motto 'United We Stand, Divided We Fall' had been on the seal since 1792. The 2002 addition gave Kentucky a Latin companion motto tied to the religious language in its foundational governing document. Both mottos remain valid under Kentucky law."
      - "The primary motto 'United We Stand, Divided We Fall' continues to appear on the state seal and flag. The two figures on the seal — a frontiersman and a statesman clasping hands — visually represent the unity the motto describes. The legislature standardized this exact design in 1962."

  - id: "1792-adoption"
    icon: "fa-solid fa-landmark"
    title: "How the Motto Was Adopted in Kentucky's First Year"
    paragraphs:
      - "Kentucky became the 15th state on June 1, 1792. Six months later, on December 20, 1792, the First General Assembly passed an act authorizing Governor Shelby to commission a seal. The legislature specified the design in detail: two friends embracing, the name of the state arcing above them, and the motto 'United We Stand, Divided We Fall' around them."
      - "In 1793, Governor Shelby contracted silversmith David Humphreys of Lexington to create the seal and a press for making impressions. Humphreys received twelve pounds sterling for the work. Fire destroyed the original seal when the capitol building burned in 1814. The design has been reconstructed and modified multiple times, with the legislature standardizing the current version in 1962."
      - "Kentucky's choice of plain English was deliberate. Latin was the prestige language for state seals in 1792 — Virginia used 'Sic Semper Tyrannis,' North Carolina used 'Esse Quam Videri.' Kentucky's founders chose the language of a song soldiers had sung rather than classical formality. The result was a motto that every Kentuckian, educated or not, could immediately understand and repeat."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Kentucky State Motto Facts"
    style: "gradient"
    facts:
      - "The phrase comes from John Dickinson's 1768 'The Liberty Song' — 24 years before Kentucky adopted it as a motto."
      - "Governor Isaac Shelby chose the motto because he had sung 'The Liberty Song' as a militia commander at the Battle of King's Mountain in 1780."
      - "Kentucky adopted the motto on December 20, 1792, six months after becoming the 15th state."
      - "Silversmith David Humphreys received twelve pounds sterling to create the original seal in 1793."
      - "Fire destroyed the original seal when the capitol burned in 1814."
      - "In 2002, Kentucky added a second official motto: 'Deo gratiam habeamus' (Let us be grateful to God), making it one of two states with dual official mottos."

faq:
  - question: "What is Kentucky's state motto?"
    answer: "Kentucky's primary state motto is 'United We Stand, Divided We Fall,' adopted on December 20, 1792. Kentucky also has a second official motto — 'Deo gratiam habeamus' (Let us be grateful to God) — added by the legislature in 2002."

  - question: "Where did Kentucky's motto come from?"
    answer: "From 'The Liberty Song,' a 1768 Revolutionary War anthem written by John Dickinson and published in the Boston Gazette. The relevant verse: 'By uniting we stand, by dividing we fall.' Governor Isaac Shelby proposed it because he had sung the song as a militia commander during the Revolutionary War."

  - question: "Why did Kentucky choose that motto?"
    answer: "Governor Isaac Shelby personally selected the phrase. He had sung 'The Liberty Song' at military gatherings during the Revolution, including at the Battle of King's Mountain in 1780, where unified patriot militia defeated a British-led force of 900 men. Shelby understood the motto as a military fact, not just a slogan."

  - question: "When did Kentucky adopt its motto?"
    answer: "December 20, 1792 — six months after Kentucky became the 15th state on June 1, 1792. The First General Assembly passed an act specifying the seal design and motto wording."

  - question: "Does Kentucky have two official mottos?"
    answer: "Yes. Kentucky's primary motto 'United We Stand, Divided We Fall' has been official since 1792. In 2002, the legislature designated a second official motto: 'Deo gratiam habeamus,' a Latin phrase from the state constitution's preamble meaning 'Let us be grateful to God.'"

  - question: "Where does Kentucky's motto appear?"
    answer: "On the Kentucky state seal (on a banner below two figures — a frontiersman and a statesman — clasping hands), and on the state flag (a navy blue field with the seal centered, surrounded by a goldenrod wreath). The legislature standardized the current seal design in 1962."

