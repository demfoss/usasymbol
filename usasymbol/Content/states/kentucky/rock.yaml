intro_text: "Kentucky's state rock is coal, redesignated in 2024 after 26 years as the state's official mineral, correcting a scientific mismatch while keeping the material that built the state's mining economy front and center. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Kentucky State Rock
    paragraphs:
      - "Coal is Kentucky's official state rock, a title it has held since 2024. It is a sedimentary rock formed from compressed ancient plant matter, and for more than a century it has been one of Kentucky's defining industries."
      - "Coal was first honored as Kentucky's state mineral in 1998, but coal is organic and geologically a rock, not a mineral. The 2024 change corrected that classification without removing coal from its place among Kentucky's official symbols."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Coal?"
    paragraphs:
      - "Coal is a black or brownish-black sedimentary rock formed when dead plant material, buried in swamps millions of years ago, was compressed and heated over long stretches of geologic time. Unlike a single mineral, it is a mix of organic carbon and small amounts of other materials, which is why it burns."
      - "Kentucky has two major coal-producing regions: the Eastern Kentucky coal field in the Appalachian counties and the Western Kentucky coal field near the Illinois Basin. Both formed from swamp forests that existed roughly 300 million years ago."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kentucky Chose Coal as Its State Rock"
    paragraphs:
      - "Coal mining shaped entire regions of Kentucky, building towns like Benham and Lynch in Harlan County and Hazard in Perry County around company mines. For generations, coal was the leading industry and employer across the Appalachian counties of eastern Kentucky."
      - "When lawmakers corrected Kentucky's state symbols in 2024, they kept coal as an official emblem rather than dropping it, moving it from mineral to rock instead. Representative Al Gentry, who sponsored the change, said the bill preserved coal's importance to Kentucky's energy production, culture, and history while fixing the science."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Coal Became Kentucky's State Rock"
    paragraphs:
      - "Kentucky first named coal its state mineral in 1998 after students from Louisville petitioned lawmakers. In 2024, the Kentucky General Assembly passed a bill sponsored by Representative Al Gentry reclassifying coal as the state rock, moving Kentucky agate into the mineral title's place as the new state gemstone and adding calcite as the new state mineral."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Coal Is Found in Kentucky"
    paragraphs:
      - "Harlan County, in the Eastern Kentucky coal field, was one of the state's most productive coal-mining regions for most of the 20th century. The Kentucky Coal Mining Museum in Benham, housed in a former company store, tells the history of the coal camps that once defined the area."
    sites:
      - name: Kentucky Coal Mining Museum
        city: Benham
        lat: 36.9679
        lng: -82.9557
        note: "Museum in a former Eastern Kentucky coal camp"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Coal Facts"
    facts:
      - "Redesignated Kentucky's state rock in 2024, after being named state mineral in 1998."
      - "Kentucky has two major coal fields: the Eastern Kentucky field in the Appalachian counties and the Western Kentucky field near the Illinois Basin."
      - "The mining towns of Benham and Lynch in Harlan County were built directly around company coal operations."
      - "The 2024 law that reclassified coal also created calcite as the new state mineral and named Kentucky agate the new state gemstone."

