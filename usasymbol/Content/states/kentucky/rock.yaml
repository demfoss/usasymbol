faq:
  - question: What is Kentucky's state rock?
    answer: "Kentucky's state rock is coal, a sedimentary rock formed from ancient compressed plant material, redesignated in 2024 after previously serving as the state mineral."
  - question: When did Kentucky adopt coal as its state rock?
    answer: "The Kentucky General Assembly reclassified coal as the state rock in 2024, more than two decades after it was first named state mineral in 1998."
  - question: Why did Kentucky choose coal?
    answer: "Coal mining built entire communities across the Eastern and Western Kentucky coal fields and remained the state's defining industry for much of the 20th century."
  - question: Why was coal changed from state mineral to state rock?
    answer: "Coal is organic and technically a rock rather than a mineral, so the 2024 law corrected the classification while keeping coal among Kentucky's official symbols."

