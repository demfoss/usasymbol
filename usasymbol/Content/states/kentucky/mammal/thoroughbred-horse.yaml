faq:
  - question: "What is Kentucky's state horse?"
    answer: "Kentucky's state horse is the Thoroughbred (Equus caballus), designated in 1996 through House Bill 716. The designation recognizes Kentucky's role as the world capital of Thoroughbred breeding and home to the Kentucky Derby."

  - question: "When was the Thoroughbred designated as Kentucky's state horse?"
    answer: "The Thoroughbred became Kentucky's official state horse on April 11, 1996, celebrating the breed's economic and cultural importance to the state and recognizing Kentucky's unparalleled role in Thoroughbred breeding."

  - question: "Why did Kentucky choose the Thoroughbred as its state horse?"
    answer: "Kentucky chose the Thoroughbred because the state produces more Thoroughbred foals annually than any other location worldwide, hosts the Kentucky Derby (America's most prestigious horse race), and has built an entire regional identity around Thoroughbred breeding in the Bluegrass region. The industry generates over $3 billion annually for Kentucky's economy, making it central to the state's prosperity and worldwide reputation."

  - question: "Where can I see Thoroughbreds in Kentucky?"
    answer: "You can see Thoroughbreds at Kentucky Horse Park in Lexington (daily tours and exhibits), Churchill Downs in Louisville (Kentucky Derby Museum and racing), Keeneland Race Course in Lexington (spring and fall race meets), and many Bluegrass breeding farms that offer tours. Thoroughbred Park in downtown Lexington features spectacular bronze Thoroughbred sculptures."

  - question: "What makes Kentucky ideal for breeding Thoroughbreds?"
    answer: "Kentucky's Bluegrass region has limestone bedrock creating calcium and phosphorus-rich water and soil that produces strong-boned horses. The bluegrass itself provides nutritious forage. The moderate climate allows year-round outdoor living. These natural advantages, combined with over 200 years of breeding expertise, make Kentucky the world's premier location for Thoroughbred breeding."

  - question: "How important is the Thoroughbred industry to Kentucky's economy?"
    answer: "The Thoroughbred industry contributes over $3 billion annually to Kentucky's economy and employs over 40,000 people. Kentucky produces approximately 25,000 Thoroughbred foals annually. The Kentucky Derby alone generates an estimated $400+ million economic impact. The industry supports extensive auxiliary businesses including veterinary services, feed production, and specialized construction."

  - question: "What is the Kentucky Derby?"
    answer: "The Kentucky Derby is America's most prestigious Thoroughbred race, run annually on the first Saturday in May at Churchill Downs in Louisville since 1875. The race covers 1.25 miles for 3-year-old Thoroughbreds and is the first leg of the Triple Crown. It attracts over 150,000 spectators and is known as 'The Most Exciting Two Minutes in Sports.'"

  - question: "How do you identify a Thoroughbred horse?"
    answer: "Thoroughbreds are 15-17 hands tall, weigh 1,000-1,200 pounds, and have refined heads, long legs, deep chests, and athletic builds bred for speed. Bay (brown with black mane/tail) is most common, followed by chestnut. They have high-strung, sensitive temperaments. All registered Thoroughbreds have lip tattoos or microchips for identification and documented bloodlines traced to foundation sires."

