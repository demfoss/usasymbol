faq:
- question: What is Connecticut's state soil?
  answer: "The Windsor series is Connecticut's proposed state soil — a deep, excessively drained sandy soil found in the Connecticut River Valley. It has not yet been formally adopted by the Connecticut Legislature."
- question: Why is it called Windsor soil?
  answer: "The series is named for Windsor, Connecticut, a Hartford County town on the Connecticut River where federal soil scientists first mapped and described this type of glacial outwash soil. The first surveys of these tobacco lands date to 1899."
- question: What color is Windsor soil?
  answer: "Windsor soil is brown near the surface and gets paler as you go deeper. The surface layer is very dark grayish brown. The subsoil is strong brown to yellowish brown. The deeper sand is pale brown to light brownish gray."
- question: Where is Windsor soil found in Connecticut?
  answer: "Windsor soil covers about 34,000 acres in Connecticut, mainly in the northern Connecticut River Valley — Hartford, Tolland, and Middlesex counties. It sits on flat glacial outwash plains and terraces alongside the Connecticut River."
- question: What grows in Windsor soil?
  answer: "Shade-grown broadleaf tobacco is the crop Windsor soil is most famous for. Farmers also grow silage corn, hay, fruit, and vegetables. Without irrigation, droughtiness limits what can grow in dry summer months."
- question: Who proposed Windsor as Connecticut's state soil?
  answer: "USDA Natural Resources Conservation Service soil scientists and state soil scientists proposed Windsor as Connecticut's official state soil. The Connecticut Legislature has not yet passed it into law."
- question: How deep is Windsor soil?
  answer: "Windsor soil is very deep — the sandy parent material extends well beyond 60 inches without hitting bedrock. The surface and subsoil layers are typically 20 to 25 inches deep before reaching the original glacial sand deposit."
- question: Why is Windsor soil good for tobacco?
  answer: "Shade tobacco needs fast-draining, well-aerated soil so roots don't sit in water. Windsor's sandy texture drains almost immediately after rain, giving roots the loose, airy conditions that produce the large, thin leaves used to wrap premium cigars. Most soils in Connecticut are too heavy and wet for this crop."

