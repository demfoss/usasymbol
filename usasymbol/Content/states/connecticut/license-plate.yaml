seo_title: 'Connecticut License Plate Slogan: The Constitution State — History & Meaning'
seo_description: Connecticut's license plate slogan is "The Constitution State," a reference to the Fundamental Orders of 1639 — often called the world's first written constitution. Learn what it means, when the phrase reached Connecticut plates, and how it connects to the state's identity.
