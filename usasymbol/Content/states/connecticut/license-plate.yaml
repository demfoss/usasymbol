sections:
- id: constitution-state-meaning
  icon: fa-solid fa-scroll
  title: What "The Constitution State" Points To
  paragraphs:
  - 'The Fundamental Orders of 1639 established the framework for governing the Connecticut Colony — setting out the structure of its government, the rights of its citizens, and the limits of its authorities — before England had issued the colony a formal charter. Connecticut did not wait for royal permission to define how it would govern itself. That act of self-authored governance is the claim behind the plate slogan.'
  - 'When the U.S. Constitution was written in 1787, Connecticut''s Roger Sherman was one of its key architects. He authored the Connecticut Compromise — the agreement that created a bicameral Congress with proportional representation in one chamber and equal representation in the other — which broke the deadlock that threatened to end the convention. The plate slogan carries both the 1639 and the 1787 layers of meaning.'
  - 'Connecticut''s [state nickname](/states/connecticut/nickname) and plate slogan are the same phrase, which means every registered vehicle functions as a reference to a document most drivers could not name but that shaped the country''s constitutional tradition.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Connecticut License Plate Slogan by Era
  paragraphs:
  - Connecticut's standard passenger plates have carried the same constitutional identity since the 1970s. Earlier Connecticut plates changed formats, colors, and numbering systems, but reliable slogan records point to 1974 as the first general-issue passenger plate use of "Constitution State."
  versions:
  - name: The Constitution State
    years: 1974–present
    image: /images/license-plates/connecticut/constitution-state-plate.webp
    description: After Connecticut officially adopted "The Constitution State" as its nickname in 1959, the phrase later moved onto standard passenger plates in 1974 and has remained there through subsequent redesigns. The plate design has changed; the slogan has not.

- id: charter-oak
  icon: fa-solid fa-tree
  title: The Charter Oak and the Plate's Deeper History
  paragraphs:
  - 'The Charter Oak appears on Connecticut''s [state quarter](/states/connecticut/quarter) and several specialty plates — a symbol that connects directly to the constitutional identity behind the slogan. In 1687, King James II sent Sir Edmund Andros to Hartford to revoke the Connecticut Colony''s Royal Charter of 1662. According to tradition, colonists hid the charter in the hollow of a large white oak to prevent its seizure. The tree became a symbol of resistance to overreaching authority.'
  - 'The Charter Oak fell in a storm in 1856, but its symbolic weight had already been established. Connecticut''s colonial charter, protected in that tree, was the document that gave the colony legal standing — and the Fundamental Orders, written decades earlier, were the governing framework that charter confirmed. The plate slogan, the Charter Oak imagery on the quarter, and the state''s broader constitutional identity are all branches of the same historical argument.'
  - 'For context on how other states have used their history on license plates, see [U.S. license plate slogans by state](/license-plates/slogans).'

timeline:
- year: '1639'
  description: The Fundamental Orders of Connecticut are adopted by the towns of Hartford, Windsor, and Wethersfield — establishing a governing framework that predates Connecticut's royal charter and is widely cited as the world's first written constitution.
- year: '1662'
  description: King Charles II grants Connecticut a Royal Charter, formally recognizing the colony. The charter reinforces the self-governing framework Connecticut had already established.
- year: '1687'
  description: Sir Edmund Andros arrives in Hartford to revoke the 1662 charter. According to tradition, colonists hide it in the hollow of the Charter Oak, preventing its seizure.
- year: '1787'
  description: Connecticut's Roger Sherman authors the Connecticut Compromise at the Constitutional Convention, breaking the deadlock over representation that threatened to end the convention.
- year: '1856'
  description: The Charter Oak falls in a storm, but its identity as a symbol of Connecticut's constitutional resistance is already fixed in the state's image.
- year: '1959'
  description: Connecticut's state legislature officially designates "The Constitution State" as the state's nickname, giving the phrase formal standing before it appears on passenger plates.
- year: '1974'
  description: '"Constitution State" appears on Connecticut general-issue passenger plates, beginning the plate-slogan streak still associated with the state.'

faq:
- question: What is Connecticut's license plate slogan?
  answer: Connecticut's license plate slogan is "The Constitution State," adopted as the state's official nickname in 1959. It refers to the Fundamental Orders of 1639, considered the world's first written constitution.
- question: What does "The Constitution State" mean?
  answer: The slogan points to the Fundamental Orders of 1639, a governing document drafted by the Connecticut Colony before England issued the colony a formal charter. It is often cited as the world's first written constitution. Connecticut's Roger Sherman also played a critical role at the 1787 Constitutional Convention.
- question: When did "The Constitution State" first appear on Connecticut plates?
  answer: '"Constitution State" first appeared on Connecticut general-issue passenger plates in 1974. The nickname itself had been made official earlier, in 1959.'
- question: What is the Charter Oak and why is it on Connecticut plates?
  answer: The Charter Oak was a large white oak tree in Hartford where, according to tradition, colonists hid the Connecticut Colony's Royal Charter in 1687 to prevent its seizure by the English crown. It became a symbol of resistance to overreaching authority. The oak appears on Connecticut's state quarter and several specialty plate designs.
- question: Did Roger Sherman's work at the Constitutional Convention influence the plate slogan?
  answer: Indirectly, yes. "The Constitution State" carries both the 1639 Fundamental Orders and the 1787 Constitutional Convention in its meaning. Roger Sherman's Connecticut Compromise — which created the bicameral Congress — is considered one of the convention's most critical contributions.

