hero_image_caption: Connecticut's standard plate carrying "The Constitution State" — a slogan rooted in a governing document written 385 years ago.
intro_text: "**\"The Constitution State\"** is Connecticut's license plate slogan, tracing directly to the Fundamental Orders of 1639 — a governing document drafted by the Connecticut Colony and widely regarded as the world's first written constitution. The phrase became Connecticut's official nickname in 1959 and reached standard passenger plates in 1974."
quick_answer: "\"The Constitution State\" is Connecticut's license plate slogan, adopted as the state's official nickname in 1959 and based on the Fundamental Orders of 1639 — a colonial governing document considered the first written constitution in history. The slogan first appeared on Connecticut passenger plates in 1974 and has remained in use since."
