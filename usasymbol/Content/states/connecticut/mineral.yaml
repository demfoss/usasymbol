intro_text: "Connecticut's state mineral is almandine garnet, adopted in 1977 to recognize the deep red crystals found across the state's schist and gneiss that once fed a working garnet abrasive industry. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Connecticut State Mineral
    paragraphs:
      - "Almandine garnet is Connecticut's official state mineral, designated by the Connecticut General Assembly in 1977. It is an iron aluminum garnet that forms dark red, well-shaped crystals in the metamorphic rock that underlies much of the state."
      - "Connecticut is considered one of the finest sources of almandine garnet in the world, a reputation built on abundant, well-formed crystals rather than a single famous deposit."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Almandine Garnet?"
    paragraphs:
      - "Almandine is an iron aluminum garnet, part of the garnet family of silicate minerals, with a color ranging from deep wine red to nearly black. Crystals commonly form as dodecahedrons, twelve-sided shapes with diamond-shaped faces, and can reach over an inch across in Connecticut specimens."
      - "With a Mohs hardness of 7 to 7.5, almandine resists scratching by most other minerals, which makes crushed garnet useful as an abrasive. It forms in metamorphic rocks such as mica schist and gneiss, where heat and pressure crystallize iron and aluminum trapped in the original rock."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Connecticut Chose Almandine Garnet as Its State Mineral"
    paragraphs:
      - "Connecticut's schist and gneiss bedrock produces almandine garnet crystals in enough quantity and quality that the state became known among mineral collectors as one of the best sources of the gem in the country. Sites such as the Green's Farm locality in Roxbury yielded dodecahedral crystals over an inch across, some loose in the soil after weathering out of the rock."
      - "Garnet's hardness also built a real industry in Connecticut, where crushed almandine was processed into abrasive powder and garnet sandpaper. That combination, a mineral abundant enough to collect and useful enough to manufacture, gave lawmakers a practical reason to adopt it as the state mineral."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Almandine Garnet Became Connecticut's State Mineral"
    paragraphs:
      - "The Connecticut General Assembly designated almandine garnet the official state mineral in 1977, formally recognizing a mineral already well known to the state's rockhounds and tied to its garnet abrasive industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Almandine Garnet Is Found in Connecticut"
    paragraphs:
      - "The Green's Farm locality in Roxbury, also known as the Roxbury garnet mine, was one of Connecticut's best-known almandine sites, producing large dodecahedral crystals in schist. The site was collected for decades before access was closed by private landowners."
    sites:
      - name: Green's Farm (Roxbury Garnet Mine)
        city: Roxbury
        lat: 41.5501
