faq:
  - question: What is Connecticut's state mineral?
    answer: "Connecticut's state mineral is almandine garnet, a deep red iron aluminum garnet adopted in 1977."
  - question: When did Connecticut adopt almandine garnet as its state mineral?
    answer: "The Connecticut General Assembly designated almandine garnet the official state mineral in 1977."
  - question: Why did Connecticut choose almandine garnet?
    answer: "Connecticut's schist bedrock produces abundant, well-formed almandine crystals, and the mineral's hardness also supported a state garnet abrasive industry."
  - question: Where can you find almandine garnet in Connecticut?
    answer: "The Green's Farm locality in Roxbury was one of the state's best-known collecting sites, though access to many historic sites is now restricted by private landowners."

