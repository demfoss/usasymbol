        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Almandine Garnet Facts"
    facts:
      - "Adopted as Connecticut's state mineral in 1977."
      - "Crystals from the Green's Farm locality in Roxbury have measured over an inch across."
      - "Crushed almandine garnet was processed in Connecticut into abrasive powder and garnet sandpaper."
      - "Almandine's hardness of 7 to 7.5 on the Mohs scale is close to that of quartz, which is why it works well as an abrasive."

