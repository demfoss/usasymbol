type: State Coat of Arms
state: Connecticut
name: Connecticut State Coat of Arms
adopted_year: 1931
is_official: true
meaning: "The Connecticut coat of arms shows three grapevines on a white shield, one vine for each of the three towns that formed Connecticut Colony in the 1630s. The motto beneath the shield, Qui transtulit sustinet, is Latin for He who transplanted still sustains. Together the vines and the motto describe the Puritan settlers who left England for a new land, and the belief that God had moved them there and would keep them there."
meaning_title: Meaning of the Connecticut Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Connecticut Coat of Arms: Meaning, Symbols and History'
seo_description: "The Connecticut coat of arms was adopted in 1931 and shows three grapevines on a white shield, with the motto Qui transtulit sustinet."
