title: American Robin
scientific_name: Turdus migratorius
adopted_year: 1943
legislation: Conn. Gen. Stat. 3-109
meaning: Connecticut did not reach for a rare bird or a legal curiosity. It made official one of the most familiar birds in New England, a species long tied to spring and to the everyday vocabulary of the region.
conservation_status: Least Concern
habitat: Lawns, orchards, parks, woodland edges
size: 9-11 inches (23-28 cm)
wingspan: 12-16 inches (31-41 cm)
weight: 2.7-3 oz (77-85 g)
shared_states_text: Michigan & Wisconsin
distinctive_song: Cheerily, cheer-up, cheerio
coloration: Rust-orange breast
coloration_details: Gray-brown back with a yellow bill
