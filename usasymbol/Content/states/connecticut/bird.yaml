seo_title: 'Connecticut State Bird: American Robin'
seo_description: Connecticut adopted the American Robin as its state bird in 1943. Learn why this familiar New England bird became the state's official symbol.
intro_text: 'Connecticut''s state bird is the <strong>American Robin</strong>, made official in <strong>1943</strong>. The choice was not meant to single out a rare Connecticut species. It worked because the robin was already part of ordinary life across the state: a bird people saw in yards, orchards, town greens, and school grounds, and one they associated with the return of spring.'
