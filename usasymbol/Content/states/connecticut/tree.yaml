seo_title: "Connecticut State Tree: White Oak & Charter Oak"
seo_description: "The White Oak became Connecticut's state tree in 1947 because of the legendary Charter Oak that hid the colony's charter in 1687 and became a symbol of American independence."

intro_text: "When British authorities came to Hartford in 1687 to reclaim Connecticut's Royal Charter, the colonists hid it in a hollow White Oak. That tree stood for another 170 years. When Connecticut designated its state tree on April 16, 1947, the White Oak (Quercus alba) was the only possible choice — it had been the state's emblem for 260 years before any legislature voted on it. Governor James L. McConaughy signed the bill after the Connecticut Tree Protective Association lobbied the legislature. The White Oak is part of the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "The White Oak"
    paragraphs:
      - "White Oak (Quercus alba) is a native hardwood found throughout the eastern United States. Mature trees reach 80 to 100 feet with a broad, spreading crown — bark whitish gray and blocky, leaves with deep rounded lobes, acorns maturing in a single season. The species lives 300 to 600 years. The Charter Oak, which fell in 1856, had likely been standing since the 1100s or 1200s."
      - "Connecticut designated the Mountain Laurel as its [state flower](/states/connecticut/flower/mountain-laurel) in 1907, forty years before the White Oak. Both species are native to Connecticut, and both were pushed through the legislature by organized citizen campaigns rather than adopted by default."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "The Charter Oak"
    paragraphs:
      - "Connecticut's legislature passed the White Oak designation in early 1947, driven by the Connecticut Tree Protective Association. Representative Edgerton introduced House Bill No. 688; the House approved it March 11, the Senate March 18, and McConaughy signed it April 16. The choice needed no debate — the state already knew which tree it meant, part of the broader [story of the Constitution State](/states/connecticut/nickname/the-constitution-state)."
      - "On October 31, 1687, Sir Edmund Andros arrived in Hartford demanding Connecticut return its Royal Charter of 1662. King James II was revoking colonial charters across New England to consolidate control. During the confrontation, the candles went out. In the darkness, Captain Joseph Wadsworth seized the charter and hid it in the hollow trunk of the White Oak standing on the Wyllys estate."
      - "The Charter Oak stood for 170 more years after that night. A storm took it down on August 21, 1856, after more than five centuries. Residents collected the acorns and the timber. The wood became furniture in Connecticut's State Capitol — the governor's desk and chairs for legislative leaders were built from it. The acorns became trees, and descendants of the Charter Oak still grow across the state, their presence tied directly to [the state's founding motto](/states/connecticut/motto/qui-transtulit-sustinet)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Connecticut State Tree Facts"
    facts:
      - "The Charter Oak hid Connecticut's Royal Charter inside its hollow trunk on October 31, 1687, protecting it from British confiscation"
      - "Captain Joseph Wadsworth carried the charter to the oak tree during a meeting when candles mysteriously went out"
      - "The Charter Oak fell during a violent storm on August 21, 1856, after standing for over 500 years"
      - "Connecticut officially adopted the White Oak as its state tree on April 16, 1947"
      - "The Charter Oak appeared on Connecticut's state quarter in 2000"
      - "Furniture in Connecticut's State Capitol, including the governor's desk, was made from Charter Oak timber"
      - "People collected Charter Oak acorns and planted offspring throughout Connecticut"
      - "Native Americans asked settler Samuel Wyllys not to cut the Charter Oak, explaining it guided their corn planting schedule"

faq:
  - question: "What is the Connecticut state tree?"
    answer: "The White Oak (Quercus alba) is Connecticut's official state tree, designated on April 16, 1947. Connecticut chose this species because of the legendary Charter Oak that hid the colony's Royal Charter in 1687, making the tree a symbol of colonial resistance long before any legislature formalized it."

  - question: "What is the Connecticut state tree called?"
    answer: "Connecticut's state tree is called the White Oak. Its scientific name is Quercus alba. The most famous individual White Oak was the Charter Oak, which stood in Hartford for over 500 years before falling in a storm in 1856."

  - question: "When was Connecticut's state tree adopted?"
    answer: "Connecticut adopted the White Oak as its state tree on April 16, 1947. Governor James L. McConaughy signed the legislation after the Connecticut Tree Protective Association lobbied for the designation."

  - question: "Why is the White Oak Connecticut's state tree?"
    answer: "Connecticut chose the White Oak because of the Charter Oak's role in state history. On October 31, 1687, when British authorities demanded the return of Connecticut's Royal Charter, the candles went out during the meeting and Captain Joseph Wadsworth hid the charter inside the hollow trunk of a White Oak on the Wyllys estate. That act of resistance made the oak a colonial symbol. The tree stood until 1856 and remained Connecticut's most recognized emblem."

  - question: "What happened to the Charter Oak?"
    answer: "The Charter Oak fell during a violent storm on August 21, 1856. When it died, residents collected its acorns and wood. The acorns were planted throughout Connecticut, creating descendant trees called Charter Oak scions. The wood became furniture now in Connecticut's State Capitol, including the governor's desk and chairs for legislative leaders."

  - question: "Where can I see Charter Oak descendants?"
    answer: "Charter Oak offspring grow throughout Connecticut. After the original tree fell in 1856, people collected and planted its acorns across the state. These descendant trees, called Charter Oak scions, stand in parks, town greens, near post offices, and by town halls. Many have commemorative plaques. A third-generation Charter Oak descendant grows on the U.S. Capitol Grounds in Washington, D.C."

