sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Connecticut does not have officially legislated state colors designated by a separate statute. However, blue has functioned as the state's sole and dominant traditional color for longer than virtually any other state in the Union, with origins tracing to the colonial seal used by the Connecticut Colony in the 17th century. The color's continuous association with Connecticut across more than 300 years of history — from colonial seal to territorial period to statehood to the modern state flag — makes it one of the most enduring state color traditions in American history and a key case in the [state colors hub](/symbols/colors)."
      - "The Connecticut state flag, codified in Connecticut General Statutes § 3-104, features the state coat of arms centered on a field of azure blue. The flag's design was formalized by the Connecticut General Assembly in 1897, though the blue background and the coat of arms design it carries had been in continuous official use for generations prior. The specific shade of Connecticut Blue is a deep, rich azure corresponding to PMS 289, distinctly darker and more saturated than the navy blues used by many other states, and closely tied to the [state motto tradition](/states/connecticut/motto/qui-transtulit-sustinet)."
    subsections:
      - subtitle: "Colonial Origins of Connecticut Blue"
        text: "Connecticut's association with blue predates American independence by over a century. The colonial seal of Connecticut, first used in the 1640s under the Connecticut Colony charter granted by King Charles II in 1662, incorporated a blue field bearing three grapevines — a design element that persists in the modern state seal and flag. During the American Revolution, Connecticut's militia regiments carried regimental colors that prominently featured blue, consistent with the colonial seal tradition. This unbroken lineage from colonial charter to modern state flag makes Connecticut's blue one of the oldest continuously maintained official color traditions among all fifty states."
      - subtitle: "Connecticut General Statutes § 3-104"
        text: "The Connecticut state flag is governed by Connecticut General Statutes § 3-104, which describes the flag as 'azure blue silk charged with the device of the seal of the state, embroidered with silk and gold.' The statute's specification of 'azure blue' as the field color establishes the blue tradition in law, though it does not prescribe exact Pantone or HEX values. The Connecticut Secretary of State's office and state procurement guidelines have since standardized PMS 289 as the official reproduction color for state applications, ensuring consistent representation of Connecticut Blue across print and digital media."

  - id: "symbolism"
    title: "What the Color Represents"
    style: "highlight"
    paragraphs:
      - "Connecticut's blue carries a depth of historical meaning that reflects the state's position as one of the nation's oldest political communities. As one of the original thirteen colonies and the fifth state to ratify the United States Constitution on January 9, 1788, Connecticut's blue embodies American democratic heritage — a color that has carried three centuries of the state's identity as one of the original colonies. The azure field of the state flag frames the state coat of arms — three grapevines bearing fruit on a silver shield below the Latin motto 'Qui Transtulit Sustinet' (He Who Transplanted Still Sustains) — creating a unified visual statement of endurance, cultivation, and faith that has represented Connecticut for more than three centuries and is often compared in the [states by population density ranking](/rankings/demographics/states-by-population-density)."
    subsections:
      - subtitle: "Blue and Connecticut's Colonial Heritage"
        text: "The choice of azure blue for Connecticut's colonial seal in the 17th century placed the state within a European heraldic tradition in which blue (azure) signified truth, loyalty, and steadfastness — values the Puritan founders of the Connecticut Colony considered central to their civic and religious community. The grapevines on the shield, representing the three original settlements of Hartford, Wethersfield, and Windsor that merged to form the Connecticut Colony in 1636, were set against this blue field as a symbol of providential cultivation: the idea that God had transplanted these communities to the New World and would sustain them. This theological and civic symbolism, embedded in Connecticut's blue for over 350 years, distinguishes it from the purely geographic or patriotic associations of blue in other states."
      - subtitle: "Blue and Long Island Sound"
        text: "Beyond its heraldic and colonial significance, Connecticut's blue carries a strong geographic resonance. Long Island Sound, the body of water forming Connecticut's entire 253-mile southern coastline, has historically been the state's primary avenue for commerce, fishing, and maritime industry. The deep blue of Long Island Sound — particularly in the colder months when the water takes on the same dark azure tone as the state flag — has created a visual connection between Connecticut's landscape and its official color that residents have recognized for generations. Connecticut's maritime economy, centered on New Haven, New London, Mystic, and Bridgeport, has reinforced this association throughout the state's history."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Connecticut Blue appears on the state flag, governed by Connecticut General Statutes § 3-104, which flies at the Connecticut State Capitol in Hartford and all state government buildings. The Connecticut state seal — whose design in its current form dates to 1784, when the General Assembly standardized the colonial seal's imagery — uses the same azure blue field bearing three silver grapevines that has defined Connecticut's official imagery since the colonial era. Blue is used consistently across Connecticut state agency branding, the Connecticut Department of Motor Vehicles license plate designs, Connecticut state court insignia, and official state publications. The Connecticut Office of Policy and Management maintains brand standards specifying PMS 289 for official state government applications, ensuring that the three-century-old blue tradition is faithfully reproduced in contemporary media across all regions of the [Connecticut borders map](/states/connecticut/borders)."

