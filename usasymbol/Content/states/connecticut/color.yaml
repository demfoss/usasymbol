seo_description: "Connecticut state color is Azure Blue, based on the state flag and colonial seal. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "The traditional state color of Connecticut is **Blue**, specifically the azure blue field of [the Connecticut state flag](/states/connecticut/flag/connecticut-state-flag) rooted in the colonial-era state seal. While Connecticut has not designated official state colors by separate legislative act, blue appears on [the Connecticut state flag](/states/connecticut/flag/connecticut-state-flag) and throughout all official state insignia and branding. Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Connecticut colors accurately."

