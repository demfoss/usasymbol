faq:
  - question: "What is the official color of Connecticut?"
    answer: "The traditional state color of Connecticut is Blue — specifically an azure blue (PMS 289) that forms the background field of the Connecticut state flag and derives from the colonial-era state seal used since the 17th century."
  - question: "What is the HEX code for Connecticut Blue?"
    answer: "The standard HEX code for Connecticut Blue is #0C2340, corresponding to Pantone PMS 289, as standardized for official state government applications by the Connecticut Secretary of State's office."
  - question: "Why does Connecticut use blue as its state color?"
    answer: "Connecticut's blue originates from the colonial seal first used in the 1640s, where azure blue was chosen in the European heraldic tradition to signify truth, loyalty, and steadfastness. The color has remained in continuous official use for over 380 years, from the colonial charter through statehood to the modern state flag."
  - question: "When was the Connecticut state flag adopted?"
    answer: "The Connecticut state flag was formally adopted by the Connecticut General Assembly in 1897, though the azure blue field and coat of arms design it features had been in continuous official use since the colonial era of the 17th century."
  - question: "Does Connecticut have more than one official state color?"
    answer: "No. Unlike most states, Connecticut's traditional state color identity is defined by a single dominant color — azure blue — which forms the entire background field of the state flag. The coat of arms on the flag incorporates silver and gold accents, but blue is the defining and primary traditional color."
  - question: "What does the Connecticut state flag look like?"
    answer: "The Connecticut state flag features a field of azure blue bearing the state coat of arms at center — a silver shield with three gold grapevines, surrounded by an ornamental white banner bearing the state motto 'Qui Transtulit Sustinet' (He Who Transplanted Still Sustains) in blue letters."

