sections:
  - id: overview
    icon: fa-solid fa-music
    title: Connecticut State Dance
    paragraphs:
      - "Square dance became Connecticut's state folk dance in 1995. The designation recognized a dance long familiar from the state's grange halls and community town gatherings."
      - "Connecticut's version of the dance follows the same national pattern found across the country: four couples, a caller, and a shared set of figures."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each pair facing the center from one of the four sides. A caller directs the group through a sequence of figures, timed to lively string-band or fiddle music."
      - "Because the caller gives instructions live rather than a fixed routine being memorized in advance, dancers must listen and respond in the moment, which keeps every session slightly different."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples take positions on the four sides of a square, each facing the center."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod first to your partner and then to your corner as the caller opens the dance."
      - title: "Circle Left with the Full Set"
        description: "All eight dancers join hands and move together to the left, matching the caller's steady count."
      - title: "Do-Si-Do Your Partner"
        description: "Pass around your partner back to back without turning to face them, returning to your original spot."
      - title: "Promenade to Close the Set"
        description: "Take your partner's hand and walk together around the square back to your home position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Connecticut
    paragraphs:
      - "Square dance found a lasting home in Connecticut's grange halls, where farm families and small-town residents gathered regularly for community events. Those halls kept the dance active well into the twentieth century, alongside New England's broader tradition of community contra and barn dances."
      - "Connecticut's 1995 designation also reflects a national trend. Square-dance callers' associations and dance organizations campaigned for decades, starting in the 1970s, to have states adopt square dance as an official folk dance, and Connecticut's action followed that broader movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became the State Dance
    paragraphs:
      - "Connecticut named square dance its state folk dance in 1995, joining a long list of states that made similar designations during the decades-long national campaign by square-dance organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Connecticut adopted square dance as its state folk dance in 1995."
      - "The dance stayed active in Connecticut through grange halls and community town gatherings."
      - "Square dance places four couples into a square, directed by a caller through each figure."
      - "Connecticut's designation followed a national campaign by square-dance callers' groups that began in the 1970s."

