faq:
  - question: What is Connecticut's state dance?
    answer: "Connecticut's state folk dance is square dance, adopted in 1995."
  - question: When did Connecticut adopt square dance as its state dance?
    answer: "Connecticut adopted square dance as its state folk dance in 1995."
  - question: Why did Connecticut choose square dance?
    answer: "Square dance already had a lasting home in Connecticut's grange halls and town gatherings, and the state's designation followed a broader national campaign by square-dance organizations."
  - question: What is a grange hall?
    answer: "A grange hall is a community meeting building historically tied to farm families and rural social life in New England. Many Connecticut grange halls hosted regular square dances for decades."

