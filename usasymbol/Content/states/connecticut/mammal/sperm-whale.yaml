faq:
  - question: "What is Connecticut's state animal?"
    answer: "Connecticut's state animal is the sperm whale (Physeter macrocephalus), designated by the General Assembly in 1975."

  - question: "Why did Connecticut choose the sperm whale?"
    answer: "Connecticut chose the sperm whale for two reasons stated in the official designation: the species' contribution to the state's history and its plight as an endangered species. New London was one of America's busiest whaling ports in the 1800s, and sperm whale oil was the most valuable product of the whaling trade. By choosing an endangered species, the legislature also drew attention to the lasting impact of commercial whaling on the ocean."

  - question: "Can you see sperm whales in Connecticut?"
    answer: "No. Sperm whales live in deep ocean waters far offshore and do not inhabit Connecticut's coastal waters. The state chose the sperm whale to honor its whaling history, not because the animal is present today. Popular locations for seeing sperm whales include the Azores in Portugal and Dominica in the Caribbean."

  - question: "What was New London's role in whaling?"
    answer: "New London was the second-busiest whaling port in the United States during the mid-1800s. It trailed only New Bedford, Massachusetts. In 1850 alone, over one million dollars worth of whale oil and bone passed through the port. The wealth from whaling funded much of New London's architecture and civic life. The city's last whaling voyage departed in September 1908."

  - question: "How big is a sperm whale?"
    answer: "Male sperm whales can grow up to 60 feet long and weigh over 90,000 pounds. They are the largest toothed animal on Earth. Females are smaller, reaching up to 40 feet. Historically, males may have grown even larger—up to 70 feet—before whaling reduced the size of the population."

  - question: "Are sperm whales endangered?"
    answer: "Yes. The sperm whale is listed as endangered under the U.S. Endangered Species Act, a status it has held since 1970. Commercial whaling reduced the global population by an estimated 60 to 70 percent. The International Whaling Commission banned commercial whaling in 1986, and populations are slowly recovering, but the species remains vulnerable."

  - question: "What is sperm whale oil?"
    answer: "Sperm whale oil was a waxy oil found in a large reservoir inside the whale's head called the spermaceti organ. It burned cleaner and brighter than other oils and did not freeze in cold weather. Before electricity and petroleum, it was used in street lamps, factory lubricants, and candles. It was the most valuable product of the whaling industry during the 1800s."

  - question: "What is the connection between Connecticut's state tree and the sperm whale?"
    answer: "Connecticut's state tree is the white oak, which appears as leaves and acorns on the state flag's shield border. White oak was the primary wood used to build whaling ships. The hulls and frames of the ships that hunted sperm whales out of New London were constructed from local Connecticut oak, creating a direct material link between the two state symbols."

