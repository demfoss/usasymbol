faq:
- question: What do the grapevines on Connecticut's flag mean?
  answer: 'The three grapevines have two competing interpretations: they represent either the three oldest settlements (Hartford, Wethersfield, and Windsor) or the three colonies that merged to form Connecticut (Connecticut Colony, Saybrook Colony, and New Haven Colony). Connecticut law has never officially chosen between them. The vine imagery traces to the 1639 Saybrook Colony seal, which originally had 15 vines, reduced to three in 1711.'
- question: What does Qui Transtulit Sustinet mean?
  answer: Qui Transtulit Sustinet is Latin for He Who Transplanted Still Sustains. It references Psalm 80 — 'Thou hast brought a vine out of Egypt' — and honored the Puritan colonists who transplanted themselves from England. The vine on the shield and the transplantation in the motto draw from the same biblical image.
- question: Why is Connecticut's flag blue?
  answer: The blue comes from Connecticut's Civil War military flags, not from colonial history. Connecticut regiments used blue backgrounds on regimental colors, and citizens associated that blue with the state. When the legislature adopted an official flag in 1897, they kept the color that military tradition had already established.
- question: When was Connecticut's flag officially adopted?
  answer: Connecticut adopted its state flag in 1897. The coat of arms design was not formally standardized until 1931, and exact color specifications were not developed until 1956.
- question: Why does Connecticut's flag rank last in design surveys?
  answer: Design critics classify Connecticut's flag as a 'seal on a bedsheet' — a detailed heraldic coat of arms placed on a plain colored field. With seven colors and complex artwork that is difficult to reproduce at small sizes or from a distance, it scores low on simplicity and recognizability — the criteria used by vexillological surveys.
