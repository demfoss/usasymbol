name_meaning:
  heading: What Does Connecticut Mean?
  paragraphs:
  - Connecticut is one of the original thirteen states and became a state in 1788 when it ratified the U.S. Constitution. The name comes from an Indigenous Algonquian-language form often rendered Quinnehtukqut or a related spelling.
  - Connecticut is usually translated as "beside the long tidal river," "long river place," or "upon the long river." The name referred to a river landscape before it became the English colonial and then state name.
  - Connecticut is officially the Constitution State, though Nutmeg State and Land of Steady Habits remain common older nicknames. Its postal abbreviation is CT; Connecticuters and Connecticut residents are both used.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From an Algonquian-language place name commonly rendered Quinnehtukqut.
    - label: Meaning
      text: Usually translated as beside the long tidal river, long river place, or upon the long river.
    - label: Statehood
      text: Connecticut ratified the U.S. Constitution on January 9, 1788.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Connecticut, one of the original thirteen states.
    - label: River
      text: Also used for the Connecticut River, the major river tied to the state's name.
    - label: Colony
      text: Connecticut Colony was one of the English colonies that later formed the state.
    - label: People
      text: People from Connecticut are often called Connecticuters, though many simply say Connecticut residents.
  - heading: Nicknames and Short Forms
    items:
    - label: Constitution State
      text: Official nickname connected with the Fundamental Orders of 1639.
    - label: Nutmeg State
      text: Informal nickname with several folk explanations tied to Yankee trade and reputation.
    - label: Land of Steady Habits
      text: Older nickname referring to Connecticut's reputation for tradition and stable customs.
    - label: Abbreviation
      text: CT; older short form Conn.
editorial:
  heading: What Connecticut's Symbols Say About the State
  paragraphs:
  - Connecticut's [state flag](/states/connecticut/flag) and [motto](/states/connecticut/motto) are rooted in colonial religious imagery. The three grapevines and the phrase Qui Transtulit Sustinet come from an older seal tradition, so the flag carries a story that predates both the state and the United States.
  - The [white oak](/states/connecticut/tree) points to the Charter Oak legend, while the [mountain laurel](/states/connecticut/flower) and [American robin](/states/connecticut/bird) are everyday New England symbols. They are familiar rather than rare, which fits a small, settled state where symbols often come from town greens, woodlots, and old civic stories.
  - The [sperm whale](/states/connecticut/mammal/sperm-whale) reaches beyond the inland image of Connecticut. It remembers New London's whaling economy, including both maritime skill and the environmental cost of the industry. The [Siberian Husky](/states/connecticut/mammal/siberian-husky) adds a very modern kind of state identity through UConn's Jonathan mascot tradition.
faq:
- question: What is the Connecticut state abbreviation?
  answer: The Connecticut postal abbreviation is [CT](/states/connecticut/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: What is Connecticut's most famous state symbol?
  answer: The Charter Oak is one of Connecticut's best-known symbols and is covered on the [Connecticut state tree](/states/connecticut/tree) page.
- question: What is Connecticut's state bird?
  answer: Connecticut's state bird is the [American robin](/states/connecticut/bird), adopted in 1943.
- question: What is Connecticut's state flower?
  answer: Connecticut's state flower is [mountain laurel](/states/connecticut/flower), adopted in 1907.
- question: What do the grapevines on Connecticut's flag mean?
  answer: The three grapevines on the [Connecticut state flag](/states/connecticut/flag) are usually interpreted as either the three oldest settlements or the three colonies that shaped Connecticut, but the state has not settled one official interpretation.
- question: How many official state symbols does Connecticut have?
  answer: The Connecticut hub groups the symbol pages now available on USA Symbol, including colonial seal imagery, the robin, mountain laurel, Charter Oak, sperm whale, and Siberian Husky.
