seo_description: "Connecticut symbols include the American robin, mountain laurel, white oak, Charter Oak legacy, sperm whale, and state flag."
snippet_answer: Find out more about the history of the emblems and state symbols that represent Connecticut, from the American robin and mountain laurel to the Charter Oak memory and sperm whale. The blue flag with three grapevines is among New England's most historically layered state designs, rooted in colonial seals and maritime history.
