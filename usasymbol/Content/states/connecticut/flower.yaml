seo_title: "Connecticut State Flower | Mountain Laurel"
seo_description: "Connecticut designated the Mountain Laurel as its official state flower in 1907. This evergreen shrub produces clusters of pink and white flowers in late spring."

intro_text: "Since 1907, the Mountain Laurel has served as Connecticut's state flower. Featured in the [list of U.S. state flowers](/symbols/flowers), this evergreen shrub grows naturally in woodlands and rocky hillsides across the state. Pink and white blossoms appear in clusters during late spring and early summer."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is Connecticut's State Flower?"
    paragraphs:
      - "Connecticut recognizes the Mountain Laurel as its state flower. Each flower cluster contains 20 to 30 individual cup-shaped blossoms. Pink buds open to reveal white or pale pink petals. Small red or purple spots mark the inside of each flower. The blooms measure about 1 inch across."
      - "This native evergreen shrub blooms from late May through June. The plant can reach heights of 5 to 15 feet. Some specimens grow even taller in ideal conditions. Glossy dark green leaves stay on the plant year-round. Connecticut's forests and hillsides display these shrubs throughout the state, often near stands of the [state tree](/states/connecticut/tree/white-oak)."
      - "The Mountain Laurel grows best in acidic soil. Partial shade provides ideal growing conditions. The plant thrives in rocky areas where other shrubs struggle. Woodlands offer perfect habitat. Hikers find these shrubs along trails and in forest understories across Connecticut."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Connecticut State Flower Name"
    paragraphs:
      - "This flower carries the common name Mountain Laurel and the scientific name Kalmia latifolia. The plant belongs to the heath family called Ericaceae."
      - "Swedish botanist Peter Kalm gave the plant its scientific name. He explored North America during the 1700s. The genus name Kalmia honors his botanical work. The species name latifolia means broad-leaved in Latin. People also call this shrub calico bush. Some use the name spoonwood because early settlers carved spoons from its hard wood."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Connecticut Chose the Mountain Laurel"
    paragraphs:
      - "The Connecticut General Assembly designated the Mountain Laurel in 1907. The legislature chose this native shrub without a formal public vote. Its abundant growth throughout Connecticut influenced the decision. The plant already held cultural significance for residents of [The Constitution State](/states/connecticut/nickname/the-constitution-state)."
      - "Native Americans used Mountain Laurel for medicinal purposes before European settlement. Early colonists admired the shrub's beautiful spring blooms. Connecticut lawmakers wanted a flower that represented the state's natural landscape. The Mountain Laurel grew wild in every county. This widespread presence made it an obvious choice."
      - "The selection process moved quickly through the legislature. Representatives agreed the Mountain Laurel deserved official recognition. No competing flowers received serious consideration. Connecticut became one of the early states to adopt an official floral emblem."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Connecticut State Flower Facts"
    facts:
      - "The Mountain Laurel is toxic to humans and animals if ingested, with all parts containing grayanotoxins that cause poisoning"
      - "Connecticut hosts an annual Laurel Festival each June in Winsted, celebrating the state flower since 1934 with parades and events"
      - "Bumblebees serve as the primary pollinators, with flowers using a unique spring mechanism that flings pollen onto visiting bees"
      - "Mountain Laurel can live for over 100 years, with some specimens in Connecticut forests dating back centuries based on size"
      - "The shrub grows slowly at 6 to 12 inches per year, often forming dense thickets in favorable locations"
      - "Connecticut designated the Mountain Laurel on March 14, 1907, making it one of the earlier state flower adoptions in America"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Connecticut State Flower and Bird"
    paragraphs:
      - "The American Robin serves as Connecticut's state bird, a familiar songbird with orange-red breast and cheerful song. Both symbols represent Connecticut officially. Connecticut adopted the Mountain Laurel in 1907 and designated the [American Robin](/states/connecticut/bird/american-robin) as state bird in 1943."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Mountain Laurel is commonly represented as a symbol of Connecticut's natural heritage. Its evergreen nature has been linked to perseverance and endurance. The hardy shrub survives harsh New England winters and carries connotations of native beauty and environmental conservation, themes echoed in the [state motto](/states/connecticut/motto/qui-transtulit-sustinet)."

faq:
  - question: "What is Connecticut's state flower?"
    answer: "Connecticut's state flower is the Mountain Laurel (Kalmia latifolia), an evergreen shrub that produces clusters of pink and white cup-shaped flowers in late spring."
  
  - question: "When did Connecticut adopt the Mountain Laurel as its state flower?"
    answer: "Connecticut designated the Mountain Laurel as its official state flower on March 14, 1907. The Connecticut General Assembly chose this native shrub without a formal public vote."
  
  - question: "Why did Connecticut choose the Mountain Laurel?"
    answer: "Connecticut chose the Mountain Laurel because it grows abundantly throughout the state and held cultural significance for residents. The shrub's widespread presence in every county and its representation of Connecticut's natural landscape made it an appropriate symbol; regional context is also visible in the [Connecticut borders profile](/states/connecticut/borders)."
  
  - question: "Is the Mountain Laurel native to Connecticut?"
    answer: "Yes, the Mountain Laurel is native to Connecticut and grows naturally in woodlands and rocky hillsides throughout the state. The plant also grows in other eastern states from Maine to Florida."
  
  - question: "When does Mountain Laurel bloom in Connecticut?"
    answer: "Mountain Laurel blooms from late May through June in Connecticut. The shrub produces clusters of pink and white flowers during this period, with peak blooming typically occurring in early June."

