title: "Qui Transtulit Sustinet"
language: "Latin"
english_translation: "He Who Transplanted Still Sustains"
adopted_year: 1784

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Connecticut State Motto | Qui Transtulit Sustinet! He Who Transplanted Still Sustains!"
seo_description: "Connecticut's motto 'Qui Transtulit Sustinet' (He Who Transplanted Still Sustains) dates to 1639 — one of the oldest state mottos in America, predating independence by nearly 150 years. It comes from Psalm 80:8. The three grapevines on the seal each tell a story. Full history."

intro_text: "Connecticut's official motto is <strong>Qui Transtulit Sustinet</strong> — Latin for <em>He Who Transplanted Still Sustains</em>. The phrase has appeared on Connecticut seals since 1639, when it was placed on the Saybrook Colony seal — 145 years before Connecticut formally adopted it as a state motto in 1784. Few state mottos in the country have such a long documented history. The phrase is rooted in Psalm 80:8 and the Puritan settlers' understanding of their migration from England as a divinely guided act."

sections:
  - id: "psalm-and-vine"
    icon: "fa-solid fa-bible"
    title: "Rooted in Psalm 80: The Vine Transplanted From Egypt"
    paragraphs:
      - "The motto's scriptural source is Psalm 80:8 — 'You brought a vine out of Egypt; you drove out the nations and planted it.' Connecticut colonists understood their migration from England (and before that, from Puritan England's religious restrictions) in exactly these terms: God had uprooted His people from one place and planted them in another. The Latin phrase 'Qui Transtulit Sustinet' asserts that the same God who transplanted them was still sustaining them in their new home."
      - "This is why the Connecticut state seal features grapevines rather than mountains, rivers, or a colonial scene. The vine is the organizing symbol of the state's entire self-understanding. The three grapevines on the current seal represent Hartford, Windsor, and Wethersfield — the three original settlements founded by the 1636 migration led by Thomas Hooker. The original Saybrook Colony seal, designed around 1639, showed 15 grapevines, each representing one of Connecticut's early towns."
      - "When Connecticut redesigned the seal in 1784 after independence, the legislature kept the phrase but simplified the design: 15 vines became 3. The theological reference stayed intact. Connecticut General Statutes §3-104 contains the current seal description."

  - id: "oldest-motto"
    icon: "fa-solid fa-clock-rotate-left"
    title: "One of the Oldest Continuously Used Mottos in America"
    paragraphs:
      - "The phrase 'Qui Transtulit Sustinet' first appeared on the Saybrook Colony seal in 1639 — 137 years before the Declaration of Independence, and 145 years before Connecticut formally adopted it with the state seal in 1784. Rhode Island's 'Hope' (1663) has a similar age, and Connecticut's 1662 colonial charter is often referenced. But few state mottos anywhere have been in unbroken official use as long as Connecticut's."
      - "Connecticut's path to the current motto was not a redesign but a continuity. When the state legislature adopted the seal in 1784, the motto wasn't debated or chosen — it was inherited. The phrase had already been part of Connecticut's identity for nearly 150 years. The 1784 act formalized what colonists had been using since before anyone in America had thought to call themselves Americans."

  - id: "hooker-and-the-migration"
    icon: "fa-solid fa-landmark"
    title: "Thomas Hooker's 1636 Migration and What the Motto Describes"
    paragraphs:
      - "Thomas Hooker was a Puritan minister in Massachusetts Bay Colony who disagreed with the colony's system of restricting church membership and voting rights. In May 1636, he led about 100 people on a two-week overland journey from Newtown (now Cambridge, Massachusetts) to the Connecticut River Valley — one of the first major inland migrations in colonial America."
      - "Hartford, Windsor, and Wethersfield were already being settled. Hooker's arrival strengthened them. The following year, on January 14, 1639, the three towns adopted the Fundamental Orders — often called the first written constitution in the Western Hemisphere. The Saybrook Colony seal with 'Qui Transtulit Sustinet' appeared the same year."
      - "The motto describes what Hooker's followers believed: God had moved them to a better place and was still providing for them there. The Connecticut River Valley offered rich alluvial soil from seasonal flooding, longer growing seasons than coastal Massachusetts, and access to trade through the river. For settlers who framed everything in theological terms, those advantages were evidence of divine sustaining."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Connecticut State Motto Facts"
    style: "gradient"
    facts:
      - "The motto has been in documented use since 1639 — over 385 years."
      - "It predates Connecticut statehood by 145 years."
      - "The original Saybrook Colony seal had 15 grapevines; the 1784 seal simplified this to 3."
      - "The three current vines represent Hartford, Windsor, and Wethersfield — Connecticut's first three towns."
      - "The phrase comes from Psalm 80:8: 'You brought a vine out of Egypt... and planted it.'"
      - "Thomas Hooker's 1636 migration is the historical event the motto describes — but Hooker himself didn't choose the phrase."

faq:
  - question: "What is Connecticut's state motto?"
    answer: "Connecticut's state motto is 'Qui Transtulit Sustinet,' a Latin phrase meaning 'He Who Transplanted Still Sustains.' It has been in use since the Saybrook Colony seal of 1639 and was formally adopted with the state seal in 1784."

  - question: "What does 'Qui Transtulit Sustinet' mean?"
    answer: "'He Who Transplanted Still Sustains.' The 'He' refers to God. The phrase means that the same God who moved the Puritan colonists from England to Connecticut continues to provide for them. It is rooted in Psalm 80:8 — 'You brought a vine out of Egypt; you drove out the nations and planted it.'"

  - question: "Why does Connecticut's seal have grapevines?"
    answer: "The grapevines come directly from the motto's source in Psalm 80:8, where God is described as transplanting a vine. The three vines on the current seal represent Hartford, Windsor, and Wethersfield — Connecticut's first three settlements. The original 1639 Saybrook seal had 15 vines, one for each of Connecticut's towns at the time."

  - question: "How old is Connecticut's state motto?"
    answer: "The phrase first appeared on the Saybrook Colony seal in 1639 — making it one of the oldest state mottos in continuous use in America. It predates Connecticut statehood by 145 years. The formal state seal adoption was in 1784."

  - question: "Is Connecticut's motto in Latin?"
    answer: "Yes. 'Qui Transtulit Sustinet' is Latin: 'qui' means 'he who,' 'transtulit' (from 'transfero') means 'transplanted,' and 'sustinet' (from 'sustineo') means 'sustains' or 'continues to sustain.'"

  - question: "Where does Connecticut's motto appear today?"
    answer: "On the state seal (showing three grapevines on a shield with the motto on a banner below), which appears on government documents, driver's licenses, state ID cards, state letterhead, and official buildings. The seal is also on the state flag."

