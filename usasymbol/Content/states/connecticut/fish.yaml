- id: facts
  icon: fa-solid fa-lightbulb
  title: American Shad Facts
  facts:
  - Adopted in 2003 by the Connecticut Legislature.
  - Its scientific name is Alosa sapidissima.
  - It is the largest herring species in Connecticut and commonly grows 15 to 24 inches long.
  - The Connecticut state record shad weighed 9.3 pounds and measured 25.8 inches.
  - Shad from the Connecticut River have swum as far as Bellows Falls, Vermont, which is 272 miles from Long Island Sound.
faq:
- question: What is Connecticut's state fish?
  answer: Connecticut's state fish is the American shad. It is a silvery fish that lives in the ocean and swims up rivers to spawn every spring.
- question: When did Connecticut adopt the American shad?
  answer: The Connecticut Legislature made the American shad the official state fish in 2003.
- question: Why did Connecticut choose the American shad?
  answer: The shad has been an important food fish in the Connecticut River since colonial times. The state picked it because of that long history.
- question: Does the American shad live in Connecticut all year?
  answer: No. Adult shad live at sea and come into Connecticut rivers in spring to spawn. Young shad stay in the rivers through summer and fall, then swim to the ocean in late fall.
- question: How can you tell an American shad from other herring?
  answer: The American shad is the largest herring in Connecticut. It has silver sides, a bluish green back, and a dark spot on its shoulder.
