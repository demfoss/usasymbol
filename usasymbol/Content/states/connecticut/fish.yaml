seo_title: Connecticut State Fish | American Shad
seo_description: The Connecticut state fish is the American shad, adopted in 2003. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/connecticut/connecticut-fish-hero.webp
hero_image_alt: A silvery American shad with a bluish green back and a dark spot behind its gill cover.
hero_image_caption: The American shad swims up Connecticut rivers every spring.
intro_text: Connecticut's state fish is the American shad, a silvery fish that swims up the state's rivers from the sea every spring. It became the state fish in 2003. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Connecticut?
  paragraphs:
  - The American shad is Connecticut's official state fish. The Connecticut Legislature named it in 2003, and its scientific name is Alosa sapidissima.
  - Adult shad live in the ocean. Each spring they return to rivers to spawn, and the Connecticut River has the biggest run in the state.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the American Shad
  paragraphs:
  - The American shad has a gray to bluish green back, silver sides, and a white belly.
  - Look for a dark spot on its shoulder, just behind the gill cover. Sometimes a few smaller spots follow it in a row.
  - It is the largest member of the herring family in Connecticut. Adults are commonly 15 to 24 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - State Representative Faith McMahon proposed a bill to make the American shad Connecticut's state fish. State lawmakers passed it, and the shad became the official state fish in 2003.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Connecticut Chose the American Shad
  paragraphs:
  - The American shad has been an important food fish in the Connecticut River since colonial times. The state says it became the state fish because of that history.
  - People in Connecticut have fished for shad for hundreds of years. Its spring run is a familiar sign that winter is over.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the American Shad
  paragraphs:
  - Shad run up all of Connecticut's major rivers in spring. These include the Connecticut, Housatonic, Pawcatuck, and Thames rivers.
  - The Connecticut River has the largest run. Smaller runs reach the Quinnipiac, Hammonasset, and East rivers.
