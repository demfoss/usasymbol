sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Connecticut?
  paragraphs:
  - "The European mantis, Mantis religiosa, is Connecticut's official state insect. The Connecticut General Assembly designated it in 1977."
  - "The mantis is not native to Connecticut. It originated in Northern Africa, Southern Europe, and temperate parts of Asia, and was introduced to the state in the 1890s to help farmers control crop pests."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Mantis
  paragraphs:
  - "A European mantis is green or brown and grows about 2 to 2.5 inches long, with a slender body built for hunting."
  - "It is best known for its front legs, which fold upward as it waits motionless for prey, a pose that gave the mantis its name. Mantis comes from a Greek word meaning prophet or diviner."
  - "The mantis feeds on aphids, flies, grasshoppers, caterpillars, and moths, making it useful to farmers and gardeners."

- id: history
  icon: fa-solid fa-landmark
  title: How Connecticut Chose the European Mantis
  paragraphs:
  - "The European mantis was brought to Connecticut in the 1890s to help farmers fight crop pests. Decades later, the Connecticut General Assembly named it the official state insect in 1977."
  - "Lawmakers chose the mantis as a symbolic reminder of the importance of the natural environment, and as recognition of its role as a beneficial insect for farmers."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the European Mantis in Connecticut
  paragraphs:
  - "The mantis is found throughout Connecticut from late spring through the first cold weather of fall, after which populations decline rapidly."
  - "Look for it in gardens, fields, and tall grass, where it waits motionless for insect prey to come within reach."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Mantis Facts
  facts:
  - "Adopted: 1977, by the Connecticut General Assembly."
  - "Scientific name: Mantis religiosa."
  - "Length: about 2 to 2.5 inches, usually green or brown."
  - "Not native to Connecticut; introduced from Europe, North Africa, and Asia in the 1890s to help control crop pests."
  - "Feeds on aphids, flies, grasshoppers, caterpillars, and moths."




