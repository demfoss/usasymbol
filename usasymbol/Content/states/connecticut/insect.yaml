faq:
- question: What is Connecticut's state insect?
  answer: "Connecticut's state insect is the European mantis, adopted by the Connecticut General Assembly in 1977."
- question: When did Connecticut adopt the European mantis?
  answer: "Connecticut adopted the European mantis as its official state insect in 1977."
- question: Why did Connecticut choose the European mantis?
  answer: "Lawmakers chose the mantis as a symbolic reminder of the importance of the natural environment and as recognition of its role as a beneficial insect for farmers."
- question: What does Connecticut's state insect look like?
  answer: "The European mantis is green or brown and grows about 2 to 2.5 inches long, with front legs that fold upward as it waits for prey."
- question: Is the European mantis native to Connecticut?
  answer: "No. It originated in Northern Africa, Southern Europe, and temperate parts of Asia, and was introduced to Connecticut in the 1890s to help control crop pests."
- question: Is a praying mantis dangerous to humans?
  answer: "No. The European mantis is harmless to humans and considered a beneficial insect because it preys on aphids, flies, and other crop pests."

