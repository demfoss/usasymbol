intro_text: 'Connecticut''s state seal descends from a colonial design in use since approximately 1647 — predating American independence by more than a century — making it the oldest continuously used state seal design in the country. Three grapevines carry the motto *Qui Transtulit Sustinet*: "He Who Transplanted Still Sustains."'
