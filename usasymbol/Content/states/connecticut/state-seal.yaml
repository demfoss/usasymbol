sections:
- id: history
  icon: fa-solid fa-landmark
  title: How Connecticut's State Seal Was Adopted in 1784
  paragraphs:
  - 'Connecticut''s seal design predates statehood by more than a century. The colony began using a seal with grapevine imagery around 1647, when the General Court adopted a design featuring three grapevines and the motto Qui Transtulit Sustinet. That colonial seal remained in use through the Revolutionary period without significant alteration.'
  - 'After independence, Connecticut formalized its state seal in 1784. The General Assembly carried forward the colonial grapevines and motto largely unchanged, a deliberate choice that tied the new state''s identity to its colonial foundations. Few other states imported their governing symbol so directly from a colonial predecessor.'
  - 'The border of the seal reads "Sigillum Reipublicae Connecticutensis," meaning "Seal of the Republic of Connecticut." That word "Reipublicae" reflects the republican political vocabulary of 1784, when Connecticut was asserting its standing as a self-governing republic within the new United States. Connecticut General Statutes § 3-107 governs the current authorized form.'

- id: meaning
  icon: fa-solid fa-book-open
  title: What Connecticut's State Seal Represents
  paragraphs:
  - 'The central meaning of Connecticut''s seal is in its motto: Qui Transtulit Sustinet, "He Who Transplanted Still Sustains." The phrase uses the agricultural image of transplanting a vine to new soil, applied to the English colonists moved from England to Connecticut, and sustained there by divine providence. Both the agricultural metaphor and the religious interpretation were deliberate.'
  - 'The three grapevines give the metaphor a visual form. A vine transplanted to new soil either takes root or dies; the three vines shown bearing fruit are a statement that Connecticut''s transplanting succeeded. The connection to the three founding towns, Windsor, Hartford, and Wethersfield, ties this abstract image to specific historical geography.'
  - 'The use of a classical heraldic shield places Connecticut in a European tradition of civic emblems, while the specifically Puritan agricultural imagery of the motto connects the seal to the religious settlers who founded the colony. Both registers, classical form and Protestant theology, are active in the design at the same time.'

- id: elements
  icon: fa-solid fa-shapes
  title: 'Seal Elements Explained: Every Figure and What It Means'
  paragraphs:
  - 'Connecticut''s seal is unusual among American state seals for its restraint. It carries no human figures, no animals, no landscapes, and no maps. Every element is symbolic: three vines, a shield, a motto, and a border inscription.'
  elements:
  - id: three-grapevines
    name: Three Grapevines
    image: /images/state-seals/connecticut/elements/three-grapevines.webp
    paragraphs:
    - 'The three grapevines on the shield each bear three clusters of grapes. They appear on a white field within a heraldic shield, the standard form for a coat of arms. The vines have been on Connecticut''s seal since the colonial period, making them the oldest surviving element of the design.'
    - 'The most common interpretation links the three vines to the three original English settlements in Connecticut: Windsor, Hartford, and Wethersfield, all founded in 1636 by settlers moving south from Massachusetts along the Connecticut River. These three towns formed the nucleus of the Connecticut Colony.'
    - 'The vine imagery also reflects the Puritan settlers'' reading of their own migration. Psalm 80 describes God transplanting a vine from Egypt to a new land; Connecticut''s founders applied this passage to their own settlement, and the seal''s motto makes the same comparison explicit.'
  - id: motto
    name: Qui Transtulit Sustinet
    image: /images/state-seals/connecticut/elements/motto.webp
    paragraphs:
    - 'Qui Transtulit Sustinet is Latin for "He Who Transplanted Still Sustains." The phrase describes the transplanting of English settlers to Connecticut and the ongoing providence believed to sustain them there. It is both a historical description and a statement of faith.'
    - 'The motto appears on a ribbon below the shield on the coat of arms and on the state flag. It has been part of Connecticut''s official imagery since approximately 1647, making it one of the oldest state mottoes in continuous use in the United States.'
  - id: heraldic-shield
    name: Heraldic Shield
    image: /images/state-seals/connecticut/elements/shield.webp
    paragraphs:
    - 'The three grapevines sit within a heraldic shield, the standard form for a coat of arms in the European tradition. The shield''s field is white (argent in heraldic terminology), which provides visual contrast for the green vines and grape clusters against it.'
    - 'The shield design is the same as Connecticut''s coat of arms, which appears separately on the state flag without the full circular seal border. The coat of arms predates the formal seal and was used on official Connecticut documents through the colonial period.'
  - id: border-inscription
    name: Border Inscription
    image: /images/state-seals/connecticut/elements/border.webp
    paragraphs:
    - 'The outer ring of the seal carries the inscription "Sigillum Reipublicae Connecticutensis," Latin for "Seal of the Republic of Connecticut." The word "Reipublicae" reflects the political vocabulary of 1784, when Connecticut was asserting its identity as a self-governing republic.'
    - 'The use of Latin for the border inscription was standard practice for colonial and early American seals, placing Connecticut in a tradition of learned civic authority. The inscription distinguishes the full official seal from the coat of arms alone, which appears on the flag without any border text.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: How Connecticut's Seal Design Developed Since the 1600s
  paragraphs:
  - 'Connecticut''s seal has one of the longest continuous design histories of any American state symbol. The colony began using a seal with grapevine imagery around 1647, more than 130 years before the state seal was formally adopted. The core design, three vines on a shield with the motto Qui Transtulit Sustinet, has remained consistent across all versions.'
  versions:
  - name: Colonial Seal (c. 1647)
    years: c. 1647–1784
    image: /images/state-seals/connecticut/versions/colonial-seal.webp
    description: The Connecticut General Court adopted a seal with three grapevines and the Latin motto around 1647. This colonial design was used continuously through the Revolutionary period and served as the direct model for the 1784 state seal.
  - name: State Seal (1784–present)
    years: 1784–present
    image: /images/state-seals/connecticut/versions/1784-seal.webp
    description: Adopted by the Connecticut General Assembly in 1784, carrying forward the colonial grapevines and motto. The border text was updated to read "Sigillum Reipublicae Connecticutensis." The basic composition has not changed since.

