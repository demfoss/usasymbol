meaning: 'Connecticut''s state seal centers on three grapevines bearing clusters of grapes, arranged on a white heraldic shield. The Latin motto below the shield, Qui Transtulit Sustinet, means "He Who Transplanted Still Sustains," connecting the English settlers transplanted to Connecticut soil with the providence that kept those settlements alive. The three vines are traditionally linked to Connecticut''s three founding English towns of 1636: Windsor, Hartford, and Wethersfield.'
