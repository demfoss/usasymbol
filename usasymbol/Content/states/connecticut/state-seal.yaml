timeline:
- year: '1636'
  description: English settlers from Massachusetts found Windsor, Hartford, and Wethersfield along the Connecticut River. These three towns are traditionally represented by the three grapevines on the seal.
- year: 'c. 1647'
  description: The Connecticut General Court adopts a seal with three grapevines and the motto Qui Transtulit Sustinet. This colonial design becomes the direct ancestor of the state seal adopted 137 years later.
- year: '1662'
  description: King Charles II grants Connecticut a royal charter, one of the most liberal colonial charters in British North America. Connecticut uses its colonial grapevine seal on official documents under this charter.
- year: '1776'
  description: Connecticut declares independence. The colonial seal remains in use through the Revolutionary period, unchanged from its 1647 form.
- year: '1784'
  description: The Connecticut General Assembly formally adopts the state seal, carrying forward the colonial grapevines and motto with the updated border inscription Sigillum Reipublicae Connecticutensis.

faq:
- question: What does Connecticut's state seal show?
  answer: Connecticut's state seal shows three grapevines, each bearing three clusters of grapes, on a white heraldic shield. The Latin motto Qui Transtulit Sustinet appears on a ribbon below the shield, and the border inscription reads "Sigillum Reipublicae Connecticutensis."
- question: What does Qui Transtulit Sustinet mean?
  answer: Qui Transtulit Sustinet is Latin for "He Who Transplanted Still Sustains." It refers to the transplanting of English settlers to Connecticut and the ongoing providence that sustained them in their new home. It is Connecticut's official state motto and has appeared on the seal since approximately 1647.
- question: Why are there three grapevines on Connecticut's state seal?
  answer: The three grapevines are traditionally associated with Connecticut's three original English settlements, Windsor, Hartford, and Wethersfield, all founded in 1636. The vine imagery also reflects the Puritan settlers' reading of their migration as a transplanting, consistent with the seal's motto.
- question: When was Connecticut's state seal adopted?
  answer: The Connecticut state seal was formally adopted in 1784 after independence. Its design traces directly to a colonial seal used since approximately 1647, making it one of the oldest continuously used seal designs in the United States.
- question: What does the Connecticut seal border say?
  answer: The outer ring of the seal reads "Sigillum Reipublicae Connecticutensis," Latin for "Seal of the Republic of Connecticut." The word "Reipublicae" reflects the republican political language current in 1784 when the General Assembly formalized the seal.
- question: Does Connecticut's state seal appear on the state flag?
  answer: The coat of arms from the seal, the three grapevines on a white shield with the motto below on a ribbon, appears at the center of the Connecticut state flag on a blue field. The flag uses the coat of arms rather than the full circular seal.
- question: Who designed Connecticut's state seal?
  answer: No individual designer is identified in the historical record. The design was developed by the Connecticut General Court around 1647 for the colonial seal and carried forward by the General Assembly in 1784 with minimal changes.

