sections:
  - id: overview
    icon: fa-solid fa-music
    title: Pennsylvania State Dance
    paragraphs:
      - "Pennsylvania named polka its official state dance in 1990. The choice recognized a dance carried into the state's industrial and coal regions by generations of Central and Eastern European immigrants."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Polka Explained"
    paragraphs:
      - "Polka is a lively couples' dance set in 2/4 time, danced with partners in a closed hold turning progressively around the floor. The step has a light, bouncing quality that gives the dance its energetic look."
      - "A polka band typically features accordion, brass, and drums, playing a quick, upbeat tempo. Dance halls fill the floor with couples moving in the same direction, weaving around each other as they turn."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Polka
    steps:
      - title: "Take a Closed Partner Hold"
        description: "Face your partner and hold hands, one at shoulder height and one at waist height, ready to move together."
      - title: "Learn the Hop-Step-Close-Step Pattern"
        description: "Hop lightly, step to the side, close your feet together, then step again, repeating the pattern in time with the music."
      - title: "Keep the Bounce Light"
        description: "Let your knees stay slightly bent so each step carries a small springy lift rather than a flat-footed stomp."
      - title: "Turn Progressively Around the Floor"
        description: "Move the pattern in a steady rotation as a couple, circling counterclockwise around the dance floor with other pairs."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Polka Represents Pennsylvania
    paragraphs:
      - "Waves of Polish, German, and Slovak immigrants settled in Pennsylvania's coal and industrial regions in the nineteenth and early twentieth centuries, bringing polka with them as part of everyday community and church-hall life. The dance became a fixture at weddings, festivals, and social clubs across those communities."
      - "That immigrant heritage gave Pennsylvania a stronger and more distinct claim to polka than to square dance, the more common choice among other states. The 1990 designation formalized a dance tradition that had already been part of the state's social fabric for generations."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Polka Became Pennsylvania's State Dance
    paragraphs:
      - "The Pennsylvania General Assembly designated polka the state's official dance in 1990."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Polka Facts
    facts:
      - "Pennsylvania adopted polka as its official state dance in 1990."
      - "Polka arrived in Pennsylvania with Polish, German, and Slovak immigrant communities who settled in the state's coal and industrial regions."
      - "The dance is set in 2/4 time and danced by couples turning progressively around the floor."
      - "Polka bands typically feature accordion, brass, and drums."

