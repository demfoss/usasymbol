intro_text: "Pennsylvania's state seal shows a shield with a ship under sail, a plow, and three wheat sheaves, flanked by two black horses and topped by an eagle, with the motto 'Virtue, Liberty and Independence.' The design dates to 1778, when Pennsylvania was the most commercially active colony and its largest city, Philadelphia, was the busiest port in British North America. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
