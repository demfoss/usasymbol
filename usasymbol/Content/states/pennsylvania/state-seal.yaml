legislation: Pennsylvania General Assembly, 1778
meaning: "Pennsylvania's coat of arms, adopted in 1778, centers on a shield that describes the state's economic identity at the founding: maritime commerce through Philadelphia, grain agriculture across its interior, and the labor of its farming communities. The two black horses, the eagle crest, and the motto 'Virtue, Liberty and Independence' together express the political ideals of one of the original thirteen states."
