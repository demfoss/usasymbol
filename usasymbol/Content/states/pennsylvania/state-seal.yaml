sections:
- id: history
  icon: fa-solid fa-landmark
  title: Pennsylvania State Seal History and Origin
  paragraphs:
  - "Pennsylvania's General Assembly adopted the coat of arms in 1778, two years after independence and nine years before the state ratified the U.S. Constitution. The timing matters: the design was created during the Revolutionary War, when Pennsylvania was already the political and commercial center of the new nation and Philadelphia was serving as the seat of the Continental Congress."
  - "The shield's three elements, a ship, a plow, and wheat sheaves, were chosen to represent the industries that had made Pennsylvania the wealthiest of the original colonies by the 1770s. The ship referenced the Delaware River trade through Philadelphia; the plow and wheat recorded the agricultural production of the Pennsylvania interior, which supplied grain to the Atlantic world."
  - "Pennsylvania ratified the U.S. Constitution on December 12, 1787, becoming the second state. The coat of arms adopted nine years earlier has remained the state's official emblem ever since, appearing on the state flag, which was officially adopted in 1907."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Pennsylvania State Seal Symbols Mean
  paragraphs:
  - "Pennsylvania's coat of arms is one of the oldest in continuous use in the United States. Each element was chosen in 1778 to represent a specific feature of the state's geography, economy, or political identity."
  elements:
  - id: eagle
    name: Eagle (Crest)
    image: /images/state-seals/pennsylvania/elements/eagle.webp
    paragraphs:
    - "An eagle appears as the crest above the shield, with wings spread. Eagles were widely used in early American heraldry as a symbol of national sovereignty, and their presence on the Pennsylvania seal links the state's identity to the larger project of American independence."
    - "The eagle's position above the shield places it as the highest element of the design, above the commercial and agricultural imagery below."
  - id: shield
    name: Shield
    image: /images/state-seals/pennsylvania/elements/shield.webp
    paragraphs:
    - "The shield is divided into three horizontal bands, each representing a different economic sector. Together they describe Pennsylvania's productive economy at the time of founding: ocean trade, inland farming, and grain production."
    - "The choice to use an economic description rather than a historical scene or allegorical figure was deliberate. Pennsylvania's founders built a seal around what the state produced and how it worked."
  - id: ship
    name: Ship Under Sail
    image: /images/state-seals/pennsylvania/elements/ship.webp
    paragraphs:
    - "A sailing ship under full sail occupies the upper third of the shield. It represents Pennsylvania's maritime commerce through Philadelphia, the primary port of the mid-Atlantic colonies and the busiest trading city in British North America before the Revolution."
    - "Philadelphia's position on the Delaware River gave Pennsylvania direct access to Atlantic trade routes. By the 1770s, Philadelphia was exporting wheat, flour, and timber to Britain, the Caribbean, and southern Europe. The ship on the seal records this commercial identity."
  - id: plow
    name: Plow
    image: /images/state-seals/pennsylvania/elements/plow.webp
    paragraphs:
    - "A plow occupies the middle section of the shield, representing agriculture as the foundation of Pennsylvania's interior economy. Pennsylvania's farming population, concentrated in Lancaster and York counties and the broader Susquehanna Valley, made it one of the most productive agricultural regions in colonial North America."
    - "The plow is not a decorative element. It specifies the kind of agriculture Pennsylvania practiced: large-scale field farming for export, not subsistence. Pennsylvania grain fed cities from Boston to the Caribbean."
  - id: wheat-sheaves
    name: Three Sheaves of Wheat
    image: /images/state-seals/pennsylvania/elements/wheat-sheaves.webp
    paragraphs:
    - "Three sheaves of wheat appear in the lower third of the shield. Wheat was Pennsylvania's primary export commodity in the 18th century. Pennsylvania and its neighbors in the mid-Atlantic region were known as the 'breadbasket colonies' because of the volume of grain they produced."
    - "The three sheaves likely represent abundance rather than a specific number with symbolic significance. Wheat appears twice on the seal, in the sheaves on the shield and implicitly in the plow above, reinforcing grain agriculture as the defining feature of Pennsylvania's economy."
  - id: black-horses
    name: Two Black Horses
    image: /images/state-seals/pennsylvania/elements/horses.webp
    paragraphs:
    - "Two black horses stand as supporters on either side of the shield, rearing upright with their forelegs raised. Black horses are rare in traditional heraldry, which typically uses specific tinctures with established meanings. Their inclusion in Pennsylvania's design makes the state seal visually distinct from most other American and European coats of arms."
    - "Horses were essential to Pennsylvania's agricultural and transportation economy. They powered the plows, pulled the wagons that carried grain to Philadelphia's docks, and moved passengers and goods along the Lancaster Turnpike, one of the first major paved roads in the United States."
  - id: olive-branch-corn
    name: Olive Branch and Cornstalk
    image: /images/state-seals/pennsylvania/elements/olive-corn.webp
    paragraphs:
    - "An olive branch and a cornstalk appear crossed beneath the shield at the base of the design. The olive branch is a traditional symbol of peace; the cornstalk represents the agricultural productivity of the American continent."
    - "Together they frame the motto ribbon below and add a final layer of meaning to the design: Pennsylvania's commercial and agricultural prosperity exists within a framework of peace and civic order."
  - id: motto
    name: Virtue, Liberty and Independence
    image: /images/state-seals/pennsylvania/elements/motto.webp
    paragraphs:
    - '"Virtue, Liberty and Independence" is Pennsylvania''s state motto, appearing on a ribbon below the shield. It was chosen in 1778 as a direct expression of Revolutionary-era political ideals. Each word addressed a specific concern of the founding generation.'
    - 'Virtue referenced the moral character considered necessary for self-government; Liberty named the goal of independence from Britain; Independence specified the political status Pennsylvania had declared two years earlier in 1776. The three words formed a political program, not merely an aspiration.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Pennsylvania State Seal'
  paragraphs:
  - "Pennsylvania's coat of arms has retained its core composition since 1778. The eagle crest, three-part shield, two black horses, olive branch, cornstalk, and motto have not changed. What has shifted over time is the rendering quality and exact proportions as different engravers and printers applied the design to official documents."
  versions:
  - name: Original Seal (1778)
    years: 1778–present
    image: /images/state-seals/pennsylvania/versions/coat-of-arms-of-pennsylvania.svg
    description: Adopted by the Pennsylvania General Assembly in 1778 during the Revolutionary War. The composition established the ship, plow, wheat, horses, eagle, and motto that remain on Pennsylvania's official emblem today. Rendering quality varied between applications across different periods.
  - name: Current Seal Rendering
    years: modern official use
    image: /images/state-seals/pennsylvania/versions/seal-of-pennsylvania.svg
    description: A modern seal rendering that places Pennsylvania's long-standing coat of arms inside the circular seal used on official state materials. The composition preserves the 1778 elements while standardizing linework and presentation.

- id: facts
  icon: fa-solid fa-lightbulb
  title: Pennsylvania State Seal Facts
  facts:
  - 'Adopted: 1778, by the Pennsylvania General Assembly during the Revolutionary War'
  - 'Motto: Virtue, Liberty and Independence'
  - 'Upper shield: ship under sail, representing Philadelphia maritime trade'
  - 'Middle shield: plow, representing Pennsylvania''s agricultural economy'
  - 'Lower shield: three sheaves of wheat, the state''s primary export commodity'
  - 'Supporters: two black horses, unusual in heraldry and specific to Pennsylvania'
  - 'Crest: eagle, connecting Pennsylvania to the national symbol of American sovereignty'
  - 'Pennsylvania ratified the U.S. Constitution on December 12, 1787, as the second state'
  - 'The state flag, adopted in 1907, displays the coat of arms on a blue background'

timeline:
- year: '1681'
  description: William Penn receives a royal charter from King Charles II and establishes the Province of Pennsylvania. Philadelphia is laid out the following year.
- year: '1774'
  description: The First Continental Congress meets in Philadelphia, establishing Pennsylvania as the political center of the emerging American resistance to British rule.
- year: '1776'
  description: Pennsylvania delegates sign the Declaration of Independence on July 4. Philadelphia is the seat of the Continental Congress throughout the Revolution.
- year: '1778'
  description: The Pennsylvania General Assembly officially adopts the coat of arms. The design, with its ship, plow, wheat sheaves, black horses, eagle, and motto, is established.
- year: '1787'
  description: Pennsylvania ratifies the U.S. Constitution on December 12, becoming the second state. The 1778 coat of arms becomes the emblem of a fully constituted American state.
- year: '1907'
  description: Pennsylvania officially adopts its state flag, displaying the coat of arms on a blue background. The flag codifies the seal's appearance in a new official context.

faq:
- question: What does the Pennsylvania state seal show?
  answer: Pennsylvania's state seal features a central shield divided into three horizontal sections, a ship under sail at the top, a plow in the middle, and three sheaves of wheat at the bottom. Two black horses stand as supporters on either side. An eagle perches above as the crest, and a ribbon below carries the motto "Virtue, Liberty and Independence." An olive branch and a cornstalk cross beneath the shield.
- question: Why are there black horses on Pennsylvania's state seal?
  answer: Two black horses flank the shield as supporters. Black horses are unusual in traditional heraldry, making Pennsylvania's seal visually distinct. Horses were central to Pennsylvania's agricultural and transportation economy in the 18th century, powering farm work and pulling the wagons that carried grain from interior farms to Philadelphia's port.
- question: What does the ship on Pennsylvania's seal represent?
  answer: The ship under sail in the upper portion of the shield represents Pennsylvania's maritime trade through Philadelphia. Philadelphia was the busiest port in British North America before the Revolution, exporting wheat, flour, and timber to Britain, the Caribbean, and southern Europe. The ship records that commercial identity.
- question: What does the motto "Virtue, Liberty and Independence" mean?
  answer: The motto, adopted in 1778 during the Revolutionary War, expressed the political ideals of Pennsylvania's founders. Virtue referenced the moral character considered necessary for self-government; Liberty named the goal of independence from British rule; Independence specified the political status Pennsylvania had declared in 1776.
- question: When was the Pennsylvania state seal adopted?
  answer: The Pennsylvania General Assembly adopted the coat of arms in 1778, during the Revolutionary War. Pennsylvania ratified the U.S. Constitution in 1787 as the second state; the 1778 design has served as the official emblem ever since.
- question: Why does Pennsylvania's seal show wheat?
  answer: Wheat appears twice on the seal, as three sheaves in the lower shield and implicitly through the plow in the middle section. Pennsylvania was the leading grain-producing colony in British North America. The mid-Atlantic region, including Pennsylvania, was known as the breadbasket colonies because of the volume of wheat and flour it exported.

