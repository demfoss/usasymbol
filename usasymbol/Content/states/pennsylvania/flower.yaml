seo_title: "Pennsylvania State Flower: Mountain Laurel"
seo_description: "The Mountain Laurel became Pennsylvania's state flower in 1933. This evergreen shrub produces clusters of pink and white flowers across Pennsylvania forests."

intro_text: "The Mountain Laurel gained official status as Pennsylvania's state flower in 1933. This native evergreen shrub grows in forests and mountainsides throughout Pennsylvania and is featured in the [list of U.S. state flowers](/symbols/flowers). Pink and white cup-shaped flowers bloom in clusters across the state each late spring and early summer, often in the same upland habitats as the [Pennsylvania state tree](/states/pennsylvania/tree/eastern-hemlock)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Pennsylvania State Flower?"
    paragraphs:
      - "Pennsylvania recognizes the Mountain Laurel as its state flower. Each flower cluster contains 20 to 30 individual cup-shaped blossoms. Pink buds open to reveal white or pale pink petals. Small red or purple spots mark the inside of each flower. The blooms measure about 1 inch across. Clusters form rounded masses 4 to 6 inches wide."
      - "Mountain Laurel blooms from late May through June across Pennsylvania. Peak flowering occurs in early June throughout most regions. The Pocono Mountains, Allegheny National Forest, and state parks showcase spectacular displays. Individual flowers last about a week. The shrub grows 5 to 15 feet tall. Some specimens reach 30 feet in ideal conditions. Glossy dark green leaves stay on the plant year-round."
      - "This native shrub grows wild in Pennsylvania forests from the Delaware Water Gap to the Laurel Highlands. The plant prefers acidic soil under oak and pine canopies. Partial shade suits Mountain Laurel best. Rocky hillsides throughout the Appalachian Mountains support dense thickets. The species thrives in Pennsylvania's climate with cold winters and warm humid summers. State forests contain some of the largest natural Mountain Laurel populations in the eastern United States."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Pennsylvania State Flower Name"
    paragraphs:
      - "Known as Mountain Laurel, this flower's scientific designation is Kalmia latifolia. The plant belongs to the Ericaceae family. This family includes rhododendrons, blueberries, and azaleas along with hundreds of other species."
      - "Swedish botanist Peter Kalm gave the plant its scientific name. He explored Pennsylvania and surrounding colonies during the 1740s. The genus name Kalmia honors his botanical work. The species name latifolia means broad-leaved in Latin. Early colonists called it calico bush because the spotted flowers resembled calico fabric patterns."
      - "People also call this shrub spoonwood. Early settlers carved spoons from the hard wood. Ivy bush appears as another common name in older texts. Pennsylvania residents most often use Mountain Laurel when referring to the state flower. The name distinguishes it from other laurel species that grow in different regions."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Mountain Laurel Became the Pennsylvania State Flower"
    paragraphs:
      - "Pennsylvania chose the Mountain Laurel as its official state flower in 1933. The Pennsylvania Federation of Women's Clubs campaigned for this designation. They organized activities promoting the Mountain Laurel across the state. School children participated in studying Pennsylvania wildflowers during this period, alongside broader lessons on [Pennsylvania's state symbols](/states/pennsylvania)."
      - "Mountain Laurel grew abundantly in Pennsylvania's forests and mountains. The spring blooms attracted tourists to the Pocono Mountains and Laurel Highlands. Pennsylvania residents valued the native shrub's beauty. The evergreen leaves provided winter interest. Dense thickets offered wildlife habitat. The plant represented Pennsylvania's forested character."
      - "Some legislators suggested the trailing arbutus instead. Others advocated for cultivated garden flowers. Mountain Laurel supporters emphasized the shrub's widespread distribution across Pennsylvania. Every region featured these pink and white blooms. The legislature agreed. Lawmakers passed the designation on May 5, 1933. Pennsylvania joined neighboring states in honoring native plants."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Pennsylvania State Flower Facts"
    facts:
      - "Mountain Laurel grows wild throughout Pennsylvania forests from the Delaware Water Gap to the Laurel Highlands with some of the largest natural populations in the eastern United States"
      - "The flowers have a unique spring mechanism that flings pollen onto visiting bees when insects land, ensuring efficient pollination"
      - "Pennsylvania adopted the Mountain Laurel on May 5, 1933, following advocacy by the Pennsylvania Federation of Women's Clubs"
      - "All parts of the Mountain Laurel are toxic to humans and animals if ingested, containing grayanotoxins that cause poisoning"
      - "Swedish botanist Peter Kalm explored Pennsylvania in the 1740s and documented this plant, leading to the genus name Kalmia in his honor"
      - "Mountain Laurel can live for over 100 years, with some ancient thickets in Pennsylvania state forests dating back centuries"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Pennsylvania State Flower and Bird"
    paragraphs:
      - "The [Ruffed Grouse](/states/pennsylvania/bird/ruffed-grouse) serves as Pennsylvania's state bird, a woodland game bird known for its distinctive drumming sound during mating season. Both symbols represent Pennsylvania officially. Pennsylvania adopted the Mountain Laurel in 1933 and designated the Ruffed Grouse as state bird in 1931, and both appear in the [state bird index](/symbols/birds)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Mountain Laurel Symbolizes"
    paragraphs:
      - "The Mountain Laurel is often associated with Pennsylvania's natural heritage and Appalachian mountain character. The flower traditionally symbolizes ambition and perseverance in flower language. Its ability to thrive on rocky hillsides frequently represents resilience while the evergreen nature carries connotations of endurance through Pennsylvania's harsh winters and the state's forested identity tied to [the Keystone State nickname](/states/pennsylvania/nickname/the-keystone-state) and regional geography in [States That Border Pennsylvania](/states/pennsylvania/borders)."

faq:
  - question: "What is Pennsylvania's state flower?"
    answer: "Pennsylvania's state flower is the Mountain Laurel, a native evergreen shrub that produces clusters of pink and white cup-shaped flowers in late spring and early summer."
  
  - question: "When did Pennsylvania adopt the Mountain Laurel as its state flower?"
    answer: "Pennsylvania adopted the Mountain Laurel on May 5, 1933. The Pennsylvania Federation of Women's Clubs campaigned for this designation."
  
  - question: "Why did Pennsylvania choose the Mountain Laurel?"
    answer: "Pennsylvania chose the Mountain Laurel because it grew abundantly across the state's forests and mountains. The spring blooms attracted tourists to the Pocono Mountains and Laurel Highlands. The shrub's widespread distribution and evergreen character made it representative of Pennsylvania's forested landscape."
  
  - question: "Is the Mountain Laurel toxic?"
    answer: "Yes, all parts of the Mountain Laurel are toxic to humans and animals if ingested. The plant contains grayanotoxins that cause poisoning. Despite its beauty, the shrub should not be consumed."
  
  - question: "When does Mountain Laurel bloom in Pennsylvania?"
    answer: "Mountain Laurel blooms from late May through June in Pennsylvania, with peak flowering occurring in early June. The Pocono Mountains, Allegheny National Forest, and state parks showcase spectacular displays during this period."

