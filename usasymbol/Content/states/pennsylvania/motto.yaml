title: "Virtue, Liberty and Independence"
language: "English"
english_translation: ""
adopted_year: 1875

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "Pennsylvania State Motto: Virtue, Liberty and Independence"
seo_description: "Pennsylvania's motto first appeared on Revolutionary War paper money in 1777 — before it was official. Caleb Lownes placed it on the state's coat of arms in 1778, but the design varied for 97 years until a legislative commission standardized it in 1875. Pennsylvania chose English while nearly every other state picked Latin."

intro_text: "Pennsylvania's state motto is <strong>Virtue, Liberty and Independence</strong> — written in English rather than the Latin chosen by most states. The phrase first appeared on Pennsylvania paper money in 1777, during the Revolutionary War, before any official adoption. Caleb Lownes, a Philadelphia merchant and prison reformer, placed it on the state's coat of arms in 1778. Artists modified the design for the next 97 years — changing horse colors, rearranging elements, adding and removing details — until a legislative commission standardized it in 1875. That standardized version closely matched Lownes's 1778 original."

sections:
  - id: "on-paper-money-first"
    icon: "fa-solid fa-money-bill"
    title: "It Appeared on Paper Money Before It Was Official"
    paragraphs:
      - "Pennsylvania printed paper currency in 1777 to finance its role in the Revolutionary War. The printing included the coat of arms design — which bore the motto 'Virtue, Liberty and Independence' — before any formal governmental body had officially adopted the phrase. The motto appeared on money Pennsylvanians used for transactions before it existed as official state symbolism."
      - "Caleb Lownes prepared the coat of arms design in 1778. Lownes was a Philadelphia merchant, a Quaker, and later a prominent prison reformer who helped design the Walnut Street Prison system — one of the first attempts at prison reform in American history. He engraved the shield with a ship, a plow, and sheaves of wheat, supported by black horses, with 'Virtue, Liberty and Independence' on a ribbon beneath."
      - "The choice of English was deliberate. Most states selecting mottos in this era chose Latin for its associations with classical republican ideals. Pennsylvania's leaders wanted language that ordinary citizens could read without translation — direct words suited to a democratic republic breaking from British authority."

  - id: "97-years-of-variation"
    icon: "fa-solid fa-clock"
    title: "The Same Motto, Dozens of Different Designs, for 97 Years"
    paragraphs:
      - "Between 1778 and 1875, artists created more than a dozen alternate versions of Pennsylvania's coat of arms. Horse colors shifted from black to white and back. The horses' positions changed. Proportions of the shield varied. Some versions included details that others omitted. No single standard held across all government uses — different offices, different documents, different versions of the same motto."
      - "The General Assembly convened a legislative commission in 1874 to resolve the inconsistency. The commission spent nearly a full year comparing earlier artwork — examining Revolutionary War-era prints, paper currency, seals from different periods, and government documents from across the state. In 1875, they approved a standard design that closely matched Lownes's 1778 version."
      - "The 1875 standardization is the official adoption date, but the motto itself predates it by 97 years. Pennsylvania did not invent new words; it decided which version of the existing design was authoritative. The phrase that had appeared on Revolutionary War paper money became, formally, the official motto of the Commonwealth."

  - id: "coat-of-arms-design"
    icon: "fa-solid fa-shield-halved"
    title: "What Surrounds the Motto"
    paragraphs:
      - "The motto appears on a ribbon below the shield on Pennsylvania's coat of arms. The shield itself shows three elements: a sailing ship in the upper third, a plow in the lower left, and three sheaves of wheat in the lower right. Two black horses serve as supporters flanking the shield — a design element unusual among American state arms. A bald eagle rests above the shield as the crest."
      - "The coat of arms appears centered on the state flag against a blue field. Pennsylvania's flag is one of the few state flags that features the full coat of arms including supporting animals rather than just a seal. Official prints of the motto do not include commas after 'Virtue' or 'Liberty' — the official form is 'Virtue Liberty and Independence' — though informal uses frequently include them."
      - "The Great Seal of Pennsylvania displays the full coat of arms with the motto. The seal appears on official government documents, state agency materials, and the office of the Governor. A 1999 Pennsylvania quarter — the second release in the 50 State Quarters program — depicted the Commonwealth Statue and a keystone alongside the motto."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Pennsylvania State Motto Facts"
    style: "gradient"
    facts:
      - "Pennsylvania's motto first appeared on Revolutionary War paper money in 1777 — before any official adoption."
      - "Caleb Lownes placed it on the state coat of arms in 1778; he was also a pioneer of American prison reform."
      - "Pennsylvania chose English while nearly every other state selected Latin for its motto."
      - "The coat of arms design varied for 97 years before a legislative commission standardized it in 1875."
      - "The official form of the motto has no commas: 'Virtue Liberty and Independence' — though informal uses add them."
      - "The 1999 Pennsylvania quarter, second in the 50 State Quarters program, featured the motto alongside the Commonwealth Statue."

faq:
  - question: "What is Pennsylvania's state motto?"
    answer: "Pennsylvania's state motto is 'Virtue, Liberty and Independence.' It was formally adopted in 1875 when a legislative commission standardized the coat of arms design, though the phrase had appeared on Pennsylvania paper money and official documents since 1777."

  - question: "What language is Pennsylvania's motto written in?"
    answer: "English. Pennsylvania chose plain English while most states of the era selected Latin. The choice was deliberate — the words could be read directly by any citizen without translation, fitting the democratic character of a new republic breaking from British authority."

  - question: "Who chose Pennsylvania's motto?"
    answer: "Caleb Lownes, a Philadelphia merchant and Quaker prison reformer, placed 'Virtue, Liberty and Independence' on the state coat of arms in 1778. The phrase had already appeared on Pennsylvania paper currency in 1777. A legislative commission standardized the design in 1875, closely matching Lownes's 1778 original."

  - question: "When did Pennsylvania officially adopt its motto?"
    answer: "Formally in 1875, when a legislative commission standardized the coat of arms design after 97 years of variation. The phrase itself first appeared on Revolutionary War paper money in 1777 and on the coat of arms in 1778 — making the official adoption date much later than the phrase's first use."

  - question: "Where does Pennsylvania's motto appear?"
    answer: "On a ribbon below the shield of the state coat of arms. The coat of arms appears on the state flag (centered on a blue field), the Great Seal (used on official documents and government letterhead), and state agency materials. The 1999 Pennsylvania quarter — second in the 50 State Quarters program — also depicted the motto."

