faq:
  - question: "What is Pennsylvania's state motto?"
    answer: "Pennsylvania's state motto is \"Virtue, Liberty, and Independence.\" It first appeared on the state coat of arms in 1778 and was officially standardized in 1875. The motto appears on the coat of arms and the state flag."

  - question: "What does Pennsylvania's state motto mean?"
    answer: "Each word captures a founding-era value. Virtue means moral character and integrity. Liberty means freedom from rule without consent. Independence means self-governance. Together they described the society Pennsylvania's founders were trying to build in 1778."

  - question: "When did Pennsylvania adopt its state motto?"
    answer: "The motto first appeared on the coat of arms designed by Caleb Lownes in 1778. The General Assembly authorized it on state militia flags in 1799. A legislative commission officially standardized the coat of arms design, including the motto, in 1875."

  - question: "Where does Pennsylvania's state motto appear?"
    answer: "The motto appears on a ribbon below the shield on Pennsylvania's coat of arms. The coat of arms is displayed on the state flag, so the motto appears on the flag as well."

  - question: "Who designed Pennsylvania's coat of arms with the motto?"
    answer: "Caleb Lownes, a Philadelphia merchant, designed the coat of arms in 1778. He placed \"Virtue, Liberty, and Independence\" on a ribbon beneath the shield. The 1875 standardized version was nearly identical to his original."

