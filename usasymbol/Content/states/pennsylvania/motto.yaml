seo_title: "Pennsylvania State Motto | Virtue, Liberty and Independence"
seo_description: "Pennsylvania's state motto is \"Virtue, Liberty, and Independence.\" The phrase first appeared on the coat of arms in 1778 and was adopted in 1875."

intro_text: "Pennsylvania's state motto is <strong>Virtue, Liberty, and Independence</strong>. The phrase first appeared on the Pennsylvania coat of arms designed by Philadelphia merchant Caleb Lownes in 1778, during the Revolutionary War, when Philadelphia was the seat of the Continental Congress. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

