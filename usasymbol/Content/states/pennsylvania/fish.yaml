sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Pennsylvania?
  paragraphs:
  - The brook trout became Pennsylvania's official state fish on March 9, 1970, when the Pennsylvania General Assembly passed a law naming it. Its scientific name is Salvelinus fontinalis.
  - Many people call it a brookie. Biologists say it is really a char, which makes it a close relative of the lake trout and the Arctic char.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a dark olive-green back covered in pale, wavy, worm-like markings.
  - Its sides have small red dots, and each one is ringed by a bright blue halo. The belly is a pale yellow-orange, and breeding males turn a deeper orange or red.
  - The easiest clue is the lower fins. They are orange-red with a bright white front edge and a black stripe right behind it.
  - Most brook trout are 9 to 10 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - Pennsylvania lawmakers named the brook trout the official state fish in 1970. The law was short and took effect right away on March 9, 1970.
  - Along with naming the fish, the law gave a few reasons why lawmakers picked it.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Pennsylvania Chose the Brook Trout
  paragraphs:
  - The law says the brook trout is the only trout native to Pennsylvania waters. That means it lived in the state's streams long before people brought in other trout.
  - Lawmakers also called it the most beautiful and widely found member of the salmon family in the state. They noted that it lives in small, cold mountain streams and lakes and in the spring-fed limestone streams of the valleys.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Wild brook trout live in the Ohio, Susquehanna, Genesee, Potomac, and Delaware river watersheds. They need cold, clear, shaded water, so most of them live in small mountain streams.
  - Some of the best-known brook trout waters are the forested streams of north-central Pennsylvania. One example is the Kettle Creek area. Big Spring Creek near Newville is a famous limestone spring creek. The state also stocks hatchery-raised brook trout in many waters.
