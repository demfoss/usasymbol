- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1970 by the Pennsylvania Legislature.
  - Its scientific name is Salvelinus fontinalis, and fontinalis means of springs.
  - Most brook trout grow to about 9 to 10 inches long.
  - Pennsylvania's record brook trout weighed 7 pounds. It was caught in Fishing Creek in Clinton County in 1996.
  - It is native to northeastern North America, and its range runs south along the Appalachian Mountains to Georgia.
faq:
- question: What is Pennsylvania's state fish?
  answer: Pennsylvania's state fish is the brook trout. It is a colorful native fish that lives in cold, clean streams.
- question: When did Pennsylvania adopt the Brook trout?
  answer: Pennsylvania lawmakers made the brook trout the official state fish on March 9, 1970.
- question: Why did Pennsylvania choose the Brook trout?
  answer: The state law says it is the only trout native to Pennsylvania waters. Lawmakers also called it the most beautiful and widespread member of the salmon family in the state.
- question: Is the brook trout really a trout?
  answer: Not exactly. Biologists group it with the chars, which are close relatives of trout and salmon. The name brook trout is still the one everyone uses.
- question: How can you tell a brook trout from other trout?
  answer: Look for pale, worm-like markings on a dark green back and red spots ringed in blue. The lower fins also have bright white front edges.
