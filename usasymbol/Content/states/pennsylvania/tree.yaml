seo_title: "Pennsylvania State Tree | Eastern Hemlock"
seo_description: 'Pennsylvania adopted eastern hemlock in 1931, honoring mountain groves, tanbark history, cool ravines, and an evergreen now threatened by adelgid.'

intro_text: "Pennsylvania designated the Eastern Hemlock as its state tree in 1931, honoring an evergreen found across the state's mountains and valleys. Its cool, shaded groves helped shape both Pennsylvania's forest character and its early lumber and tanning industries."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Pennsylvania"
    paragraphs:
      - "Pennsylvania's official state tree is the Eastern Hemlock, a large evergreen conifer native to eastern North America. This hemlock grows 60 to 80 feet tall in Pennsylvania forests, with exceptional specimens exceeding 100 feet. The trunk measures two to four feet in diameter on mature trees. Some ancient Pennsylvania hemlocks reach five feet across in protected gorges and ravines. The tree grows slowly compared to pines, adding six to twelve inches per year. Eastern hemlock can live 400 to 800 years in Pennsylvania. The species provided valuable resources for Pennsylvania's development - the bark supplied tannin for leather tanning that made Pennsylvania a leather industry center in the 1800s, while the lumber built homes and barns across the state."
      - "The needles provide the tree's most distinctive feature. Short flat needles measure one-quarter to one-half inch long, much smaller than pine or spruce needles. The needles appear glossy dark green on top with two white lines underneath. They attach to twigs on tiny stalks, unlike most conifers where needles attach directly. The needles grow in flat sprays along branches, creating a feathery appearance. The overall foliage appears lacy and delicate. Small cones hang from branch tips, measuring only three-quarters of an inch long - among the smallest cones of any Pennsylvania conifer. The cones mature in one season and drop by late winter."
      - "Eastern hemlock grows throughout Pennsylvania except in the extreme southeast corner. The species thrives in cool, moist ravines and north-facing slopes across the state. Pennsylvania's hemlocks dominate stream valleys and create dense groves in the Allegheny Plateau. The tree tolerates deep shade better than most conifers, growing slowly beneath the hardwood canopy. Young hemlocks can survive decades in shade waiting for canopy gaps. The graceful drooping branches create cathedral-like groves. Pennsylvania hemlocks face significant threats from hemlock woolly adelgid, an invasive insect that has killed millions of hemlocks across the eastern United States since the 1980s. Conservation efforts focus on protecting remaining healthy stands and developing treatment strategies."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Eastern Hemlock"
    paragraphs:
      - "The official name is Eastern Hemlock to distinguish it from western hemlock and other hemlock species. The scientific name Tsuga canadensis combines Tsuga (Japanese for 'tree mother') with canadensis (meaning of Canada). Early Pennsylvania settlers called it hemlock spruce or simply hemlock. The name hemlock comes from resemblance to a European plant called hemlock, though the tree bears no relation to the poisonous herb that killed Socrates. Pennsylvania's hemlock is not poisonous. The genus Tsuga includes about ten species worldwide."
      - "Some Pennsylvania references use Canada hemlock or Canadian hemlock. Loggers called it hemlock pine in early Pennsylvania lumber records. Native Americans had various names for the tree. The species belongs to the Pinaceae family, the pine family. Pennsylvania's Eastern Hemlock is the same species found throughout northeastern North America from Nova Scotia to Minnesota and south through the Appalachian Mountains. Pennsylvania lies near the center of the species' range where hemlocks grow most abundantly."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Eastern Hemlock Became the Pennsylvania State Tree"
    paragraphs:
      - "Pennsylvania designated the Eastern Hemlock as its official state tree in 1931. The Pennsylvania General Assembly passed the designation during the 1931 session. The legislation recognized hemlock as a tree integral to Pennsylvania's forest character and economic development. By 1931, Pennsylvania had been known for its extensive hemlock forests for over a century. The tanbark industry had peaked decades earlier, but hemlock remained a defining feature of Pennsylvania's mountain landscapes. The designation honored both the tree's economic history and its ecological importance."
      - "Pennsylvania picked Eastern Hemlock because the species shaped the state's leather industry and forest character. During the 1800s, Pennsylvania led America in leather production. The state's extensive hemlock forests supplied bark for tanning hides. Hemlock bark contains high concentrations of tannin, the chemical compound that converts raw hides into leather. Pennsylvania tanneries processed millions of hides using hemlock tannin. Entire industries developed around hemlock - loggers stripped bark from trees in spring when tannin content peaked, haulers transported bark to tanneries, and tannery workers processed leather. Towns like Bradford, Sheffield, and Kane grew into major tanning centers because of nearby hemlock forests."
      - "The tree played a crucial role beyond tanning. Hemlock lumber, while softer than pine or oak, built barns, sheds, and rough construction across Pennsylvania. The wood resisted decay, making it suitable for sills and foundation timbers. Railroad ties used hemlock treated with creosote. Pennsylvania hemlock forests created the cool, moist microhabitats that define the state's ecological diversity. Brooks and streams flowing through hemlock groves stay cold year-round, supporting native brook trout populations. The dense shade beneath hemlock canopies suppresses undergrowth, creating the open forest floor characteristic of Pennsylvania's hemlock stands. Wildlife including the [white-tailed deer](/states/pennsylvania/mammal/white-tailed-deer) use hemlock groves as thermal cover during harsh winters, the evergreen canopy providing shelter when hardwoods stand bare. The 1931 designation recognized that Eastern Hemlock represented Pennsylvania's forested mountains, supplied raw materials that built industries, and created the distinctive forest environment that shapes Pennsylvania's natural heritage. The tree connected Pennsylvania to its lumber and leather industry past while continuing to define the state's mountain landscapes and provide critical ecological functions in forest ecosystems."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Pennsylvania State Tree Facts"
    facts:
      - "Pennsylvania designated Eastern Hemlock in 1931, recognizing the tree's role in the state's leather tanning industry"
      - "The tiny needles measure only one-quarter to one-half inch long - much shorter than pine needles and among the smallest of any Pennsylvania conifer"
      - "Hemlock bark was harvested throughout Pennsylvania in the 1800s to supply tannin for leather production, making Pennsylvania a leather industry center"
      - "The small cones measure only three-quarters of an inch long - the smallest cones of any major Pennsylvania conifer"
      - "Eastern hemlock can live 400 to 800 years in Pennsylvania, with some trees witnessing centuries of state history"
      - "Hemlock woolly adelgid, an invasive insect, threatens Pennsylvania hemlocks and has killed millions of trees since arriving in the 1980s"
      - "The needles attach to twigs on tiny stalks rather than directly, distinguishing hemlock from other conifers"
      - "Pennsylvania hemlock groves keep streams cold year-round, providing essential habitat for native brook trout"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Pennsylvania State Tree and Flower"
    paragraphs:
      - "Pennsylvania's state flower is the [Mountain Laurel](/states/pennsylvania/flower/mountain-laurel) (Kalmia latifolia), designated in 1933. The state chose its tree symbol two years before adopting the flower. Both symbols are evergreens native to Pennsylvania mountains. The mountain laurel grows as a shrub beneath hemlock canopies, producing white to pink flower clusters in late spring. Hemlock and mountain laurel often grow together in Pennsylvania forests, creating layered vegetation from ground-level shrubs to towering conifers. The pair covers Pennsylvania's Appalachian forest ecosystems and the evergreen vegetation that distinguishes the state's mountain landscapes from surrounding regions."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Pennsylvania Eastern Hemlock"
    paragraphs:
      - "The needles provide the clearest identification feature. Look for very short flat needles measuring only one-quarter to one-half inch long. The needles appear glossy dark green on top with two prominent white lines underneath. Each needle has a tiny stalk attaching it to the twig - run your fingers along a twig and feel the needles pull off cleanly. This stalk distinguishes hemlock from spruces and firs where needles attach directly. The needles grow in flat sprays creating a feathery, delicate appearance. The overall texture looks lacier than pine or spruce."
      - "The cones help confirm identification. Look for tiny cones measuring only three-quarters of an inch long hanging from branch tips. These small oval cones appear among the smallest of any Pennsylvania conifer. The cones start green and mature to light brown. They open to release seeds in fall and drop by late winter. The cone size immediately distinguishes hemlock from pines, spruces, and firs that have much larger cones."
      - "The overall form shows drooping branch tips creating a graceful appearance. Young hemlocks develop narrow pyramidal crowns with branches touching the ground. Mature trees form irregular crowns with drooping branchlets that sweep downward. The branch tips always droop, even on upward-angled branches. This drooping habit creates the characteristic hemlock silhouette. The bark appears gray-brown to reddish-brown with deep furrows and broad flat ridges. Old trees develop thick bark with deep furrows. The bark texture feels rougher than pine bark. Hemlock groves create dense shade with open understories, giving Pennsylvania hemlock forests their cathedral-like quality."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Pennsylvania State Tree Symbolizes"
    paragraphs:
      - "Eastern Hemlock represents Pennsylvania's mountain heritage and industrial history. The tree symbolizes the tanbark industry that made Pennsylvania a leather production center and the cool forest groves that define Pennsylvania's mountain character. For Pennsylvanians, hemlock evokes the state's northern hardwood forests and the ecological richness of Appalachian valleys. The species reflects both Pennsylvania's resource extraction past and the conservation values protecting remaining old-growth stands. The ongoing battle against hemlock woolly adelgid represents Pennsylvania's commitment to preserving forest heritage against new threats. Eastern hemlock connects modern Pennsylvania to pioneer industries while defining the mountain landscapes that remain central to state character in [the Keystone State](/states/pennsylvania/nickname/the-keystone-state), with related civics context in [Pennsylvania's state motto](/states/pennsylvania/motto/virtue-liberty-and-independence)."

faq:
  - question: "What is the Pennsylvania state tree?"
    answer: "The Eastern Hemlock (Tsuga canadensis) is Pennsylvania's official state tree. The Pennsylvania General Assembly designated it in 1931, recognizing the tree's importance to the state's leather tanning industry and mountain forests."
  
  - question: "What is the Pennsylvania state tree called?"
    answer: "Pennsylvania's state tree is called Eastern Hemlock. The scientific name is Tsuga canadensis, meaning 'tree mother of Canada.' It's also been called hemlock spruce, Canada hemlock, or simply hemlock. Despite the name, it's not related to the poisonous hemlock plant."
  
  - question: "When was the Pennsylvania state tree adopted?"
    answer: "Pennsylvania designated the Eastern Hemlock as its official state tree in 1931. The General Assembly passed the designation during the 1931 session, two years before adopting mountain laurel as state flower."
  
  - question: "Why is the Eastern Hemlock Pennsylvania's state tree?"
    answer: "Pennsylvania chose Eastern Hemlock because it shaped the state's leather industry and forest character. Hemlock bark supplied tannin for Pennsylvania's leather tanneries in the 1800s, making the state a leather production center. The tree dominated Pennsylvania's mountain forests and created distinctive ecosystems. Hemlock groves keep streams cold for native brook trout and provide winter shelter for deer. The species represented Pennsylvania's industrial heritage and mountain forest landscapes."
  
  - question: "What is the Pennsylvania state tree name?"
    answer: "The name is Eastern Hemlock, distinguishing it from western hemlock species. The scientific name is Tsuga canadensis - Tsuga is Japanese for 'tree mother,' and canadensis means 'of Canada.' The name hemlock comes from resemblance to a European plant, though Pennsylvania's hemlock is not poisonous."
  
  - question: "Where does the Pennsylvania state tree grow?"
    answer: "The Eastern Hemlock grows throughout Pennsylvania except the extreme southeast. It thrives in cool, moist ravines and north-facing slopes. The tree dominates stream valleys and creates dense groves in the Allegheny Plateau. Eastern hemlock grows naturally throughout northeastern North America from Nova Scotia to Minnesota and south through the Appalachians."
  
  - question: "What are some facts about the Pennsylvania state tree?"
    answer: "The Eastern Hemlock grows 60 to 80 feet tall with tiny needles (one-quarter to one-half inch) on short stalks. Small cones measure only three-quarters of an inch - Pennsylvania's smallest conifer cones. Hemlock bark supplied tannin for Pennsylvania's 1800s leather industry. The tree can live 400 to 800 years. Hemlock woolly adelgid threatens populations. The tree keeps streams cold for native brook trout. Drooping branch tips create a graceful appearance."
  
  - question: "How do you recognize the Pennsylvania state tree?"
    answer: "Look for very short flat needles (one-quarter to one-half inch) with two white lines underneath. Needles attach to twigs on tiny stalks you can feel. Tiny cones measure only three-quarters of an inch long - among the smallest cones. Branch tips droop gracefully. The foliage appears feathery and delicate in flat sprays. Gray-brown bark has deep furrows. Dense shade creates open forest floors beneath hemlock groves."

