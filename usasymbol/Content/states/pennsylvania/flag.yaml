seo_title: "Pennsylvania State Flag – Meaning, History & Symbols"
seo_description: "See when Pennsylvania approved its current flag, what the central imagery means, and how color references are handled for Pennsylvania's banner."

intro_text: "Pennsylvania adopted its state flag in 1907, featuring the state coat of arms on a blue field and now cataloged in the [list of U.S. state flags](/symbols/flags). The coat of arms shows two black horses supporting a shield. An eagle perches atop the shield. The design dates to Pennsylvania's seal created in 1777."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Pennsylvania State Flag Is Designed"
    paragraphs:
      - "The Pennsylvania state flag serves as the official flag of the state of Pennsylvania. A blue field holds the state coat of arms at its center. The coat of arms features a shield supported by two black horses."
      - "An American bald eagle sits on top of the shield. The shield displays three symbols: a ship, a plow, and three sheaves of wheat. An olive branch and cornstalk appear below the shield. A red ribbon bears the state motto Virtue, Liberty and Independence."
      - "The Pennsylvania General Assembly authorized the use of the coat of arms on militia flags on April 9, 1799. Flags varied in design throughout the 1800s. The legislature standardized the flag on June 13, 1907. The blue field matches the blue in the United States flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Pennsylvania Flag Communicates"
    paragraphs:
      - "The Pennsylvania state flag meaning comes from the symbols on the coat of arms. Each element represents an aspect of Pennsylvania's economy or values during the state's founding period and aligns with [Pennsylvania's state motto](/states/pennsylvania/motto/virtue-liberty-and-independence)."
      - "The ship stands for commerce. The plow represents agriculture. The wheat sheaves show farming prosperity. Together these symbols reflect Pennsylvania's economic foundation in the late 1700s."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Pennsylvania Flag History and Adoption"
    paragraphs:
      - "Pennsylvania created its state seal in 1777. The seal was officially adopted in 1791. The General Assembly authorized the use of the state coat of arms on flags for the state militia on April 9, 1799. The authorization did not specify exact colors or dimensions."
      - "Various flag designs appeared throughout the nineteenth century. Some flags showed the coat of arms replacing the stars in the canton of the American flag. Others placed the arms alone on a blue field. The colors in the coat of arms changed in 1809. The color of the horses was not standardized until 1875."
      - "In 1805, Danish painter Christian Gullage painted the state coat of arms on a blue banner. The banner measured four feet by two feet with gold fringe at the bottom. Different versions continued to appear with varying depictions of the coat of arms."
      - "The legislature chose to standardize the flag for general use on June 13, 1907. The law required the blue field to match the blue in the flag of the United States. This design remains in use today with no changes to the basic layout."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Pennsylvania Flag"
    symbols:
      - id: horses
        name: "Pennsylvania State Flag Horses"
        image: "symbols/horses.svg"
        paragraphs:
          - "Two black horses stand on either side of the shield. The horses act as supporters holding up the coat of arms. They wear harnesses."
          - "The horses represent strength and labor. The color black was standardized in 1875 after years of variation. The horses in harness symbolize the agricultural work essential to Pennsylvania's economy."

      - id: eagle
        name: "Pennsylvania State Flag Eagle"
        image: "symbols/eagle.svg"
        paragraphs:
          - "An American bald eagle perches atop the shield. Wings spread, the eagle faces forward. It represents the United States and Pennsylvania's allegiance to the nation."
          - "The eagle connects Pennsylvania to federal authority. It appeared on the original state seal created in 1777."

      - id: ship
        name: "Pennsylvania State Flag Ship"
        image: "symbols/ship.svg"
        paragraphs:
          - "A sailing ship appears on the left section of the shield. The ship represents commerce and trade. Philadelphia was a major port city during Pennsylvania's early statehood."
          - "The ship design traces to Philadelphia's municipal seal. It shows Pennsylvania's connection to maritime commerce and international trade."

      - id: plow
        name: "Pennsylvania State Flag Plow"
        image: "symbols/plow.svg"
        paragraphs:
          - "A plow sits in the center section of the shield. It represents agriculture and farming. The plow appeared in earlier versions of the Chester County coat of arms."
          - "The plow symbolizes Pennsylvania's agricultural industry. It shows the importance of farming to the state's economy."

      - id: wheat
        name: "Pennsylvania State Flag Wheat Sheaves"
        image: "symbols/wheat.svg"
        paragraphs:
          - "Three sheaves of wheat appear on the right section of the shield. They represent the wheat fields of Sussex County. Sussex County was originally part of Pennsylvania but is now part of Delaware."
          - "The wheat sheaves show agricultural prosperity. They indicate Pennsylvania's role as a grain-producing region."

      - id: wreath
        name: "Pennsylvania State Flag Wreath"
        image: "symbols/wreath.svg"
        paragraphs:
          - "An olive branch and cornstalk cross below the shield. The olive branch represents peace. The cornstalk symbolizes prosperity."
          - "Together these elements form a wreath. They frame the motto ribbon and complete the coat of arms design."

      - id: motto
        name: "Pennsylvania State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "A red ribbon beneath the shield displays the state motto in bold black letters. The words read Virtue, Liberty and Independence. This motto declares Pennsylvania's founding values."
          - "The motto appears on both the state seal and the state flag. It reflects the ideals important to Pennsylvania's founders during the Revolutionary period."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Pennsylvania State Flag Colors"
    paragraphs:
      - "The Pennsylvania state flag uses a blue field matching the blue in the United States flag. The coat of arms includes multiple colors. Black appears on the horses and motto text. Red marks the ribbon. Gold or yellow colors the eagle and parts of the shield, reinforcing the traditional [Pennsylvania color palette](/states/pennsylvania/color/blue-and-gold)."
      - "The ship, plow, wheat, olive branch, and cornstalk use natural colors. White appears in parts of the design. The 1907 law specified only that the blue field must match the national flag, and the symbolism is often read together with [the Keystone State nickname](/states/pennsylvania/nickname/the-keystone-state)."
    colors:
      - name: "Blue"
        hex: "#003F87"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Pennsylvania State Flag Facts"
    facts:
      - "Pennsylvania fixed the standardized blue-field design in law on June 13, 1907"
      - "The state coat of arms was created in 1777 and adopted in 1791"
      - "Militia flags using the coat of arms were authorized in 1799"
      - "Two black horses support the shield on the coat of arms"
      - "The blue field matches the blue in the United States flag"
      - "The motto reads Virtue, Liberty and Independence and is listed with other entries on the [U.S. state mottos hub](/symbols/mottos)"

faq:
  - question: "Which flag serves as Pennsylvania's official banner?"
    answer: "The state flag of Pennsylvania is the official banner of Pennsylvania, featuring the state coat of arms centered on a blue field."

  - question: "What are the main visual elements on Pennsylvania's flag?"
    answer: "The flag shows a blue field with the state coat of arms in the center. Two black horses support a shield topped by an eagle. The shield displays a ship, plow, and wheat sheaves. A motto ribbon reads Virtue, Liberty and Independence."

  - question: "In what year did Pennsylvania's current flag become official?"
    answer: "The flag represents Pennsylvania's economy and values. The ship stands for commerce, the plow for agriculture, and the wheat for prosperity. The horses represent strength and labor."

  - question: "What meaning is attached to Pennsylvania's flag?"
    answer: "The flag means Pennsylvania's commitment to its founding values of virtue, liberty, and independence. The symbols show the state's agricultural and commercial heritage."

  - question: "What stands out most about Pennsylvania's flag?"
    answer: "Two black horses and an American bald eagle appear on the Pennsylvania state flag."

  - question: "What should readers know first about Pennsylvania's flag?"
    answer: "The horses represent strength and labor. They wear harnesses symbolizing agricultural work that was essential to Pennsylvania's economy."

  - question: "What does the Pennsylvania state flag represent?"
    answer: "Pennsylvania adopted its standardized state flag on June 13, 1907."

