title: "Official and Traditional Colors of Pennsylvania"
state: "Pennsylvania"
adopted_year: null

seo_title: "Pennsylvania State Colors: Official HEX Codes & Meaning"
seo_description: "Pennsylvania state colors are Blue and Gold, based on the state flag and coat of arms. Find HEX, RGB, CMYK, and Pantone codes plus the history and meaning."

intro_text: "The traditional state colors of Pennsylvania are **Blue** and **Gold**, derived from [the Pennsylvania state flag](/states/pennsylvania/flag/pennsylvania-state-flag) and state coat of arms. Pennsylvania does not have officially designated state colors established by legislation, but blue and gold appear throughout all official state flags, seals, and branding. Designers and students can find the commonly used HEX and RGB approximations below for the blue and gold of the state flag and seal, as part of the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Blue and Gold (Unofficial / Traditional — no statutory designation)"
official_since: "No official statutory designation confirmed"
primary_use: "State flag, state coat of arms, Commonwealth government branding, University of Pittsburgh and other institutional contexts"
known_for: "The blue of Pennsylvania's state flag — a deep colonial blue matching the uniform facings of Continental Army units from Pennsylvania — and the gold heraldic elements of the state coat of arms, which prominently feature the rearing horses, eagle, and ship at sea that have defined Pennsylvania's symbolic identity since 1778"

