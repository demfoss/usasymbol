faq:
  - question: "What are the state colors of Pennsylvania?"
    answer: "Pennsylvania does not have officially designated state colors by statute. Blue and Gold are widely recognized as the Commonwealth's de facto colors, derived from the blue field and gold heraldic elements of the Pennsylvania state flag and coat of arms."
  - question: "Does Pennsylvania have official state colors?"
    answer: "No. Pennsylvania has not enacted legislation designating official state colors. The Commonwealth's official State Symbols webpage does not list state colors among Pennsylvania's official symbols."
  - question: "What is the HEX code for Pennsylvania Blue?"
    answer: "The widely used HEX code for Pennsylvania Blue is #002868 (Pantone PMS 2757 C), derived from the blue field of the state flag. This is an approximation; no official specification exists in Pennsylvania law."
  - question: "What is the HEX code for Pennsylvania Gold?"
    answer: "The widely used HEX code for Pennsylvania Gold is #FFD700 (Pantone PMS 7405 C), derived from the gold heraldic elements of the state coat of arms. This is an approximation; no official specification exists in Pennsylvania law."

