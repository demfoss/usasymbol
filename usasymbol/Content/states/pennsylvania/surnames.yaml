    origin: welsh
    type: Patronymic
    meaning: "The classic Welsh patronymic, meaning son of John. Jones stayed unusually strong in Pennsylvania because Welsh migrants were prominent in the state's 19th-century mining and iron districts, especially before later eastern and southern European immigration changed the industrial workforce."

