    name: Johnson
    count: 55603
    ratio: 189
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' meaning God is gracious. Johnson is one of Pennsylvania's broad-base surnames, common in both older Anglo-American lines and in the Black urban populations that reshaped the state's biggest cities after 1916."

