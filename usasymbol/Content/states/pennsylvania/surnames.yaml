    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', describing brown hair, complexion, or clothing. Brown sits first in Pennsylvania because it is both an old British Isles surname and a major surname in the state's Black communities, especially those expanded by the Great Migration into Philadelphia and Pittsburgh."

  - rank: 2
    name: Williams
    count: 61051
    ratio: 172
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic personal name Willahelm. Williams ranks this high because it traveled through several Pennsylvania populations at once: early British settlement, Welsh and English industrial workers, and Black Pennsylvanians whose numbers grew sharply in the 20th century."

