seo:
  title: "Most Common Last Names in Pennsylvania"
  description: "The most common last names in Pennsylvania are Brown, Williams, and Johnson, while Snyder shows how deeply Pennsylvania German settlement still shapes the state's surname map."

page:
  h1: "Most Common Last Names in Pennsylvania"
  intro: "Brown, Williams, and Johnson were Pennsylvania's most common surnames in 2010, and Snyder ranked seventh because the state blends a large Black urban population with one of America's oldest German-speaking settlement belts. Pennsylvania's surname map was built in layers: Germantown in 1683, heavy German immigration through Philadelphia in the 1700s, coal and steel migration in the 1800s, and the 20th-century Great Migration into Philadelphia and Pittsburgh."
  heritage_title: "Pennsylvania Germans, Coal Towns, and the Great Migration"
  heritage_body: "Pennsylvania's most distinctive surname layer began in 1683, when Francis Daniel Pastorius and German Quakers founded Germantown outside Philadelphia. The Port of Philadelphia then recorded the arrival of chiefly German, Dutch, Swiss, and French immigrants through much of the 18th century, and by the American Revolution Pennsylvania Germans made up about one-third of the colony's population. In the 1800s, anthracite and steel drew Irish, Welsh, Italian, Polish, Slovak, and other workers into the coal fields and mill towns, while the 20th-century Great Migration strengthened Brown, Williams, Johnson, and Jackson in Philadelphia and Pittsburgh."
  fun_fact: "Snyder ranks seventh in Pennsylvania but only 144th nationally, making it one of the clearest statewide fingerprints of Pennsylvania German settlement."

