unique_surnames:
  - name: Snyder
    state_rank: 7
    national_rank: 144
    origin: german
    why: "Snyder is the Pennsylvania German surname in plain sight: an English spelling of Schneider that stayed concentrated in the commonwealth's old German counties. Its very high state rank reflects how fully German-speaking settlers became part of Pennsylvania's mainstream surname stock rather than remaining a small immigrant niche."

  - name: Moyer
    state_rank: 35
    national_rank: 890
    origin: german
    why: "Moyer is a Pennsylvania form of Meyer or Meier, a German occupational and status surname. It is far more common in Pennsylvania than nationally because the name took root in the southeastern Pennsylvania German belt and persisted there through generations of local continuity."

  - name: Shaffer
    state_rank: 39
    national_rank: 522
    origin: german
    why: "Shaffer is another Pennsylvania German surname that anglicized without disappearing. Its strong showing reflects the same Lancaster to Lehigh settlement corridor that preserved Snyder, Moyer, Kline, and other German-derived names in unusually high numbers."

  - name: Kline
    state_rank: 48
    national_rank: 688
    origin: german
    why: "Kline comes from German 'klein', meaning small. Pennsylvania stands out for Kline because German-speaking farm and church communities stayed dense enough in the southeast and south-central counties to keep the surname far above its national profile."

  - name: Klingensmith
    state_rank: 1000
    national_rank: 10131
    origin: german
    why: "Klingensmith is a much rarer but even more state-specific Pennsylvania German name, derived from a German bladesmith surname. Its presence near Pennsylvania's top 1,000 shows how the state still preserves old German surname forms that are scarce almost everywhere else in the United States."

etymology_groups:
  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Pennsylvania's top 20. Williams, Johnson, Jones, Davis, Wilson, Anderson, Thompson, Jackson, and Robinson all descend from personal names, reflecting the deep British, Welsh, Scottish, and Scotch-Irish roots of the colony and the later rise of those same surnames in Black Pennsylvania."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Jones (son of John)
      - Thompson (son of Thom)

  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Occupational surnames are unusually visible in Pennsylvania because both English and German traditions favored them. Taylor, Clark, Baker, Snyder, and Fisher all point to work roles, and two of them, Snyder and Fisher, also mark the state's long Pennsylvania German settlement belt."
    examples:
      - Snyder (tailor)
      - Taylor (tailor)
      - Baker (baker)
      - Fisher (fisherman)

  - type: Pennsylvania German Names
    icon: fa-solid fa-map-location-dot
    description: "Pennsylvania's most distinctive surname cluster comes from German-speaking settlers who began arriving in colonial numbers in the late 1600s and early 1700s. Names such as Snyder, Myers, Moyer, Shaffer, Kline, Wagner, Weaver, and Hoffman remain much more common here than in most states, especially across Lancaster, Berks, Lehigh, and neighboring counties."
    examples:
      - Snyder (from Schneider)
      - Myers (from Meier)
      - Kline (small)
      - Shaffer (German-derived surname)

faq:
  - question: "What are the most common last names in Pennsylvania?"
    answer: "The most common last names in Pennsylvania are Brown, Williams, Johnson, Jones, and Davis. In this dataset, Brown ranks first statewide, followed very closely by Williams and Johnson."

  - question: "Why is Snyder so common in Pennsylvania?"
    answer: "Snyder is so common in Pennsylvania because it is an anglicized form of the German surname Schneider, and Pennsylvania had one of the largest and oldest German-speaking populations in colonial America. The surname stayed especially strong in the Pennsylvania German counties of the southeast and south-central part of the state."

