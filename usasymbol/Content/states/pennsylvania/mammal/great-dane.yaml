title: "Great Dane"
scientific_name: "Canis lupus familiaris"
adopted_year: 1965

seo_title: "Pennsylvania State Dog - Great Dane | Official State Breed"
seo_description: "The Great Dane is Pennsylvania's state dog since 1965. This gentle giant honors William Penn and Pennsylvania's founding heritage."

intro_text: "Pennsylvania's state dog is the Great Dane, designated in 1965 to honor William Penn, Pennsylvania's founder who owned and bred these noble dogs in the late 1600s. The legislature chose this gentle giant to recognize Pennsylvania's historical connection to the breed and the qualities of strength, dignity, and gentleness that defined both Penn and the Commonwealth he established. The Great Dane represents Pennsylvania's Quaker heritage and the peaceful coexistence Penn envisioned, and appears in broader comparisons on the [U.S. state mammals and animals hub](/symbols/mammals) and the [state dogs guide](/symbols/dogs)."

common_name: "Great Dane"
