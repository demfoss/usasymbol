faq:
  - question: "What is Pennsylvania's state animal?"
    answer: "Pennsylvania's state animal is the white-tailed deer (Odocoileus virginianus), designated on June 5, 1959. The designation recognized the Pennsylvania Game Commission's successful restoration of deer from complete extirpation around 1900 to hundreds of thousands by the 1950s. Today, Pennsylvania supports approximately 1.5 million deer, though this abundance creates ecological and social challenges."
  
  - question: "When was the white-tailed deer designated as Pennsylvania's state animal?"
    answer: "The white-tailed deer became Pennsylvania's official state animal in 1959. The designation occurred during the height of Pennsylvania's deer restoration success when populations had recovered spectacularly but had not yet reached the overabundance levels that would later create forest damage, vehicle collision, and Lyme disease problems."
  
  - question: "Why did Pennsylvania choose the white-tailed deer as its state animal?"
    answer: "Pennsylvania chose the white-tailed deer because it represented remarkable conservation success. Deer went completely extinct in Pennsylvania around 1900 due to logging and unregulated hunting. The Pennsylvania Game Commission restored populations through scientific management, importing deer from other states starting in 1906 and implementing protective regulations. The recovery from zero deer to hundreds of thousands demonstrated that extinction could be reversed through science-based management funded by hunting licenses."
  
  - question: "When did white-tailed deer go extinct in Pennsylvania?"
    answer: "White-tailed deer went completely extinct in Pennsylvania around 1900. The late 1800s lumber industry clear-cut Pennsylvania's forests while unregulated market hunting supplied venison to industrial cities. By 1895, deer had become extremely rare, and the last native Pennsylvania deer died approximately 1900, marking complete extirpation requiring later restoration through importing deer from other states."
  
  - question: "How many white-tailed deer live in Pennsylvania?"
    answer: "Pennsylvania's white-tailed deer population is approximately 1.5 million animals as of the 2020s. This represents successful recovery from extinction but exceeds ecological carrying capacity in many regions. Despite annual harvest exceeding 300,000 deer, populations remain high due to excellent reproduction and abundant food from agriculture and forests. Pennsylvania supports one of the highest deer densities in the eastern United States."
  
  - question: "Why are deer a problem in Pennsylvania?"
    answer: "Pennsylvania's deer overabundance creates multiple problems: (1) Forest regeneration crisis—deer browsing prevents oak and other tree seedlings from growing, threatening future forests; (2) Over 100,000 deer-vehicle collisions annually, more than any other state; (3) Pennsylvania leads the nation in Lyme disease with over 12,000 cases yearly—deer support tick populations transmitting disease; (4) Agricultural and landscape damage costs millions annually. Managing these conflicts while satisfying hunters preferring abundant deer creates intense stakeholder disputes."
  
  - question: "Where can I see white-tailed deer in Pennsylvania?"
    answer: "White-tailed deer appear throughout Pennsylvania in all 67 counties. Best viewing locations include Allegheny National Forest in northwestern Pennsylvania, state forests and game lands statewide, Gettysburg National Military Park, Valley Forge National Historical Park, and agricultural regions throughout south-central Pennsylvania. Suburban areas in Philadelphia and Pittsburgh support visible populations. Dawn and dusk provide optimal viewing times."
  
  - question: "What is chronic wasting disease and does it affect Pennsylvania deer?"
    answer: "Chronic wasting disease (CWD) is a fatal prion disease affecting deer with no treatment or vaccine. Pennsylvania detected its first CWD case in 2012 in south-central counties. The disease spreads through contaminated environments and remains infectious for years. The Pennsylvania Game Commission conducts intensive surveillance testing and implements restrictions including mandatory harvest in zones around detections, bans on feeding and baiting, and carcass transport prohibitions. Widespread CWD could fundamentally alter Pennsylvania's deer management and hunting economy."
  
  - question: "How does deer abundance affect Pennsylvania's Lyme disease problem?"
    answer: "White-tailed deer play central role in Pennsylvania's Lyme disease epidemic. Adult black-legged ticks feed on deer blood and mate on their bodies. While deer don't transmit Lyme directly (bacteria comes from infected mice), they maintain tick populations at levels causing human disease. Pennsylvania leads the nation with over 12,000 confirmed Lyme disease cases annually. Research shows direct correlation between deer density and tick abundance—reducing deer populations could significantly decrease Lyme disease transmission."

