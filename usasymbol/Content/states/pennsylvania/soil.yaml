intro_text: "Pennsylvania's state soil is the Hazleton series, a stony, sandy soil that formed from sandstone bedrock on hilltops and ridges. Most of it lies under forest, which makes it a fitting symbol for a state named for its woods. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Pennsylvania State Soil
  paragraphs:
  - "Hazleton soil is an Inceptisol, a young soil that has started to form layers but has not changed much from the rock beneath it. It formed in place as gray, brown, or red sandstone slowly weathered and broke apart."
  - "The soil is packed with flat pieces of sandstone that soil scientists call channers. In the deeper layers, those rock fragments make up most of the soil, so a shovel hits stone long before it hits solid bedrock."

- id: history
  icon: fa-solid fa-landmark
  title: Why Pennsylvania Chose the Hazleton Soil
  paragraphs:
  - "The Hazleton series was established in 1960. Its official reference profile was described in Warren County in northwestern Pennsylvania."
  - "Hazleton represents the forested uplands that cover a large share of Pennsylvania. Choosing it put the spotlight on the woodland soils of the state's ridges and plateaus rather than its farm valleys."

- id: profile
  icon: fa-solid fa-layer-group
  title: Hazleton Soil Profile and Horizons
  paragraphs:
  - "A Hazleton profile starts with a thin layer of rotting leaves on the forest floor. Under it sits a gray, leached layer, then reddish and yellowish layers where iron and organic matter have collected. The deeper layers are mostly sandstone fragments, and solid sandstone bedrock lies about 5 feet down."
  layers:
  - horizon: Oe
    name: Forest litter
    depth_in: "0–2"
    color_hex: "#3A2620"
    color_name: dark reddish brown
    texture: partly decayed leaves
    note: leaf litter from oaks, maples, and cherry
  - horizon: E
    name: Leached layer
    depth_in: "2–4"
    color_hex: "#5C5A56"
    color_name: dark gray
    texture: sandy loam
    note: minerals washed out by water moving down
  - horizon: Bhs / Bs
    name: Iron-stained subsoil
    depth_in: "4–8"
    color_hex: "#8A4A2C"
    color_name: dark reddish brown to yellowish red
    texture: channery sandy loam
    note: iron and organic matter collect here
  - horizon: Bw
    name: Stony subsoil
    depth_in: "8–34"
    color_hex: "#B8823E"
    color_name: reddish yellow to strong brown
    texture: very to extremely channery sandy loam
    note: flat sandstone fragments become more common with depth
  - horizon: C
    name: Weathered sandstone
    depth_in: "34–58"
    color_hex: "#C49A54"
    color_name: reddish yellow
    texture: extremely channery coarse sandy loam
    note: mostly broken rock above solid bedrock
  - horizon: R
    name: Bedrock
    depth_in: "58+"
    color_hex: "#9C8460"
    color_name: yellowish brown
    texture: sandstone
    note: the rock the soil formed from

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Hazleton Soil Is Found
  paragraphs:
  - "Hazleton soil sits on summits, shoulders, and upper slopes of ridges and plateaus, the high ground where sandstone is close to the surface. It is well drained, and water moves through it easily."
  - "Beyond Pennsylvania, Hazleton soil is mapped in Kentucky, Maryland, New Jersey, Ohio, Virginia, and West Virginia. These areas receive about 36 to 60 inches of precipitation a year."
  counties:
  - Warren

- id: agriculture
  icon: fa-solid fa-tree
  title: Forests on Hazleton Soil
  paragraphs:
  - "Most Hazleton soil is woodland. Mixed oaks, maples, and cherry grow on it, with some conifers mixed in. Pennsylvania's hardwood forests, including black cherry prized for furniture, grow on soils like this."
  - "Some areas have been cleared for pasture and cropland, but the many rock fragments and the steep, high ground make much of it better suited to trees."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Hazleton Soil Facts
  facts:
  - "Hazleton soil is classified as a loamy-skeletal Typic Dystrudept, an Inceptisol with a high share of rock fragments."
  - "The series was established in 1960, with its reference profile in Warren County, Pennsylvania."
  - "Channers are flat rock fragments up to about 6 inches long, and Hazleton's deeper layers are mostly channers of sandstone."
  - "Hazleton soil formed in place from weathered acid sandstone that can be gray, brown, or red."
  - "Solid sandstone bedrock lies about 58 inches below the surface in the reference profile."

