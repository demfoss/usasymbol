faq:
- question: What is Pennsylvania's state soil?
  answer: "Pennsylvania's state soil is the Hazleton series, a stony, sandy soil formed from sandstone on ridges and plateaus. Most of it lies under forest."
- question: What does Hazleton soil look like?
  answer: "Under a thin layer of forest litter, Hazleton soil has a gray leached layer, then reddish and yellowish layers full of flat sandstone fragments. Solid sandstone sits about 5 feet down."
- question: Where is Hazleton soil found?
  answer: "Hazleton soil occurs on the high ground of ridges and plateaus in Pennsylvania and in Kentucky, Maryland, New Jersey, Ohio, Virginia, and West Virginia."
- question: What grows on Hazleton soil?
  answer: "Mostly forest, with mixed oaks, maples, cherry, and some conifers. Some areas have been cleared for pasture and cropland."
- question: What is a channer?
  answer: "A channer is a flat rock fragment, usually sandstone or shale, up to about 6 inches long. Hazleton soil gets its stony character from the channers that fill its deeper layers."

