name_meaning:
  heading: What Does Pennsylvania Mean?
  paragraphs:
  - Pennsylvania ratified the Constitution in 1787, second among the states. The name means Penn's woods, combining the Penn family name with sylvania, a Latin word connected with forest or woodland.
  - That woodland meaning still fits the symbol pages. Ruffed grouse, mountain laurel, eastern hemlock, and white-tailed deer keep the commonwealth rooted in forest country, while the motto and Keystone nickname point toward founding politics.
  - Pennsylvania's postal abbreviation is PA, and residents are Pennsylvanians. Keystone State reflects Pennsylvania's central role among the original states.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Pennsylvania means Penn's woods, from the Penn family name and sylvania, meaning woodland.
    - label: Statehood
      text: Pennsylvania ratified the Constitution in 1787 and became the 2nd state.
    - label: Motto
      text: Virtue, Liberty and Independence is Pennsylvania's state motto.
  - heading: Usage Examples and Context
    items:
    - label: Commonwealth
      text: Pennsylvania is officially styled the Commonwealth of Pennsylvania.
    - label: State
      text: Refers to Pennsylvania, a Mid-Atlantic state with major founding-era, industrial, agricultural, and forest histories.
    - label: People
      text: People from Pennsylvania are called Pennsylvanians.
  - heading: Nicknames and Short Forms
    items:
    - label: The Keystone State
      text: Main nickname, tied to Pennsylvania's central position in early American politics and geography.
    - label: PA
      text: Postal abbreviation and common short form.
    - label: Abbreviation
      text: PA; older short form Pa.
editorial:
  heading: What Pennsylvania's Symbols Say About the State
  paragraphs:
  - Pennsylvania's [Keystone State nickname](/states/pennsylvania/nickname) does more civic work than a scenery nickname would. It frames the state through position, balance, and founding-era importance.
  - The [ruffed grouse](/states/pennsylvania/bird), [mountain laurel](/states/pennsylvania/flower), [eastern hemlock](/states/pennsylvania/tree), and [white-tailed deer](/states/pennsylvania/mammal/white-tailed-deer) keep the hub in Pennsylvania's forested interior, not only Philadelphia or Pittsburgh.
  - "The [Pennsylvania Long Rifle](/states/pennsylvania/firearm) and [Great Dane](/states/pennsylvania/mammal/great-dane) make the list less predictable: one points to frontier craft, the other to a formal state dog choice."
faq:
- question: What is Pennsylvania's most famous state symbol?
  answer: The [Keystone State nickname](/states/pennsylvania/nickname) is Pennsylvania's strongest shorthand because it captures the commonwealth's central role in early American history.
- question: What is Pennsylvania's state bird?
  answer: Pennsylvania's bird emblem is the [ruffed grouse](/states/pennsylvania/bird), selected in 1931.
- question: What is Pennsylvania's state flower?
  answer: "[Mountain laurel](/states/pennsylvania/flower), adopted in 1933, is Pennsylvania's flower symbol."
- question: Why is the Pennsylvania Long Rifle included?
  answer: The [Pennsylvania Long Rifle](/states/pennsylvania/firearm) gives the hub a frontier craft symbol tied to gunsmithing and early American settlement.
- question: How many official state symbols does Pennsylvania have?
  answer: Pennsylvania's set here includes the flag, ruffed grouse, mountain laurel, eastern hemlock, motto, nickname, colors, milk, Great Dane, white-tailed deer, and Long Rifle.
