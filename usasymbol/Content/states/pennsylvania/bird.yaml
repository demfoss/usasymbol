title: Ruffed Grouse
scientific_name: Bonasa umbellus
adopted_year: 1931
legislation: Act of June 22, 1931, P.L. 662, No. 234; 71 P.S. Sec. 1005
meaning: Pennsylvania's grouse page works best when the legal wording stays visible. The 1931 act named the Ruffed Grouse the state game bird, yet modern Commonwealth pages commonly present it as Pennsylvania's official state bird. That shift matters because the symbol moved beyond a hunting label and now carries a broader meaning tied to Pennsylvania's woods and to the young-forest habitat the state still manages around it.
author: USA Symbol Team
date_published: '2024-11-27'
date_modified: "2026-05-02"
seo_title: "Pennsylvania State Bird | Ruffed Grouse"
seo_description: "Pennsylvania adopted the Ruffed Grouse in 1931 as its state game bird, though many sources now shorten that to state bird."
intro_text: "Pennsylvania commonly presents the <strong>Ruffed Grouse</strong> as its official bird, adopted on <strong>June 22, 1931</strong>, but the act itself designates it as the Commonwealth's <strong>state game bird</strong> in <strong>71 P.S. Sec. 1005</strong>. The grouse entered Pennsylvania law through a hunting-and-woods label, yet modern Commonwealth pages use it more broadly as a public state bird. The result is a symbol that started narrow and became larger: first a game-bird emblem, then a shorthand sign of Pennsylvania forest identity."
