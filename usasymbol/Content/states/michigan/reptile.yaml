faq:
  - question: What is Michigan's state reptile?
    answer: "Michigan's state reptile is the painted turtle, adopted by the Michigan Legislature in 1995."
  - question: When did Michigan adopt the painted turtle?
    answer: "The Michigan Legislature designated the painted turtle the official state reptile in 1995."
  - question: Why did Michigan choose the painted turtle?
    answer: "The painted turtle is the most common and widely recognized turtle in Michigan, often seen basking near lakes and ponds statewide."
  - question: Is the painted turtle a turtle, snake, lizard, or alligator?
    answer: "The painted turtle is a freshwater turtle, not a snake, lizard, or alligator."

