intro_text: "Michigan's state reptile is the painted turtle, a common pond turtle with a smooth, colorful shell, adopted in 1995. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Michigan?
    paragraphs:
      - "The painted turtle is Michigan's official state reptile, designated by the Michigan Legislature in 1995. Its scientific name is Chrysemys picta."
      - "It is a common freshwater turtle found in ponds, lakes, and slow-moving rivers throughout the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Painted Turtle
    paragraphs:
      - "The painted turtle has a smooth, flat, dark olive to black shell edged with red and yellow markings, and its skin has thin yellow stripes."
      - "Adults usually grow to about four to ten inches long, with females typically larger than males."
      - "It is often seen basking in rows on logs and rocks, soaking up sun before sliding back into the water when disturbed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Michigan Legislature designated the painted turtle the official state reptile in 1995, recognizing a turtle found in ponds and lakes across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Michigan Chose the Painted Turtle
    paragraphs:
      - "The painted turtle is the most common and widely seen turtle in Michigan, familiar to residents basking near lakes and ponds throughout the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Painted Turtle
    paragraphs:
      - "The painted turtle is found throughout Michigan, in ponds, lakes, marshes, and slow-moving rivers in both the Upper and Lower Peninsulas."
    sites:
      - name: Lake St. Clair wetlands
        city: Harrison Township
        lat: 42.61
        lng: -82.83
        note: "Common turtle basking habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Painted Turtle Facts
    facts:
