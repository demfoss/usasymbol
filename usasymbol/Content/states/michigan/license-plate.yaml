seo_title: "Michigan License Plate Slogan | Pure Michigan"
seo_description: "Pure Michigan is Michigan's current license plate slogan, following older slogans like Water Wonderland, Water-Winter Wonderland, and Great Lake State."
hero_image: /images/license-plates/michigan/2013-pure-michigan-plate.jpg
hero_image_alt: Michigan Pure Michigan license plate with stylized M logo and blue wave design
hero_image_caption: Michigan's Pure Michigan standard plate option — "Pure Michigan" in blue at the top, a stylized M, and the michigan.org address along the blue wave at the bottom.
intro_text: 'Michigan has used license plate slogans to define itself for more than seventy years. Since 1954, standard plates have moved through **"Water Wonderland,"** **"Water-Winter Wonderland,"** **"Great Lake State,"** **"Great Lakes,"** and **"Pure Michigan."** Each phrase reframed the state around water, winter, tourism, or brand identity. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: "Michigan's standard plate slogans in order: \"Water Wonderland\" (1954–1964), \"Water-Winter Wonderland\" (1965–1967), \"Great Lake State\" (1968 through the 1979 base), \"Great Lakes\" (1984, on cars as late as 2008), a website-address base (2006), and \"Pure Michigan\" (available as a standard plate option beginning in 2013). Pure Michigan puts the slogan and a stylized M at the top with the michigan.org address at the bottom."
