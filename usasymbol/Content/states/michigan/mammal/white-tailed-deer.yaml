faq:
  - question: "What is Michigan's state game mammal?"
    answer: "Michigan's state game mammal is the white-tailed deer (Odocoileus virginianus), designated on June 11, 1997, through Public Act 15. The designation followed a successful campaign by fourth-grade students from Zeeland who wanted to honor the deer's importance to Michigan's hunting heritage and outdoor recreation economy."
  
  - question: "When was the white-tailed deer designated as Michigan's state game mammal?"
    answer: "The white-tailed deer became Michigan's official state game mammal in 1997. Fourth-graders from Zeeland initiated the campaign after noticing that Michigan lacked an official game mammal despite the deer's central role in state culture and conservation history."
  
  - question: "Why did Michigan choose the white-tailed deer as its state game mammal?"
    answer: "Michigan chose the white-tailed deer because the species appears in all 83 counties and represents one of conservation's greatest success stories. The deer nearly went extinct in Michigan in the 1890s due to unregulated market hunting but recovered through protective laws and habitat management. The deer also drives Michigan's outdoor recreation economy, with over 500,000 hunters pursuing deer annually, generating hundreds of millions of dollars that fund wildlife conservation."
  
  - question: "How did the lumber industry affect white-tailed deer in Michigan?"
    answer: "Michigan's lumber industry created a paradox for white-tailed deer. From 1870 through the early 1900s, logging destroyed Michigan's old-growth forests where woodland caribou and moose thrived but deer struggled. However, the cutover land regenerated into young, mixed forests with abundant browse—perfect deer habitat. Deer populations exploded in northern Michigan areas where they had been scarce or absent before logging. The same industry that nearly destroyed the forests accidentally created ideal conditions for deer."
  
  - question: "Were white-tailed deer always abundant in Michigan?"
    answer: "No, white-tailed deer populations fluctuated dramatically throughout Michigan's history. In pre-settlement times, deer were scarce in northern Michigan's dense old-growth forests but common in southern Michigan's prairies and openings. Market hunting nearly eliminated deer statewide by the 1890s. The species recovered in the 1900s as young forests regenerated on logged land and conservation laws protected deer from commercial exploitation. Today, Michigan hosts approximately 1.7 to 2 million deer across all counties."
  
  - question: "How many white-tailed deer live in Michigan?"
    answer: "Michigan's current white-tailed deer population is estimated at approximately 1.7 to 2 million animals across all 83 counties. The population fluctuates based on winter severity, hunting harvest, habitat conditions, and disease. The southern Lower Peninsula supports the densest populations due to agricultural edge habitat and mild winters, while the Upper Peninsula maintains lower densities due to severe winter conditions."
  
  - question: "What is the connection between Michigan's state tree and state game mammal?"
    answer: "Michigan's state tree (white pine) and state game mammal (white-tailed deer) are connected through the lumber industry. Logging of white pine and other trees from 1870 through the early 1900s destroyed old-growth forests but created young, regenerating forests perfect for deer. The white pine represents the virgin forests that were cut; the deer represents the wildlife that benefited from that transformation. Together, they tell the story of Michigan's landscape change from wilderness to managed environment."
  
  - question: "What challenges do white-tailed deer face in Michigan's Upper Peninsula?"
    answer: "Upper Peninsula deer face severe winter challenges. In the UP, 60 to 90 percent of deer migrate to traditional wintering complexes called deer yards—dense conifer stands that provide thermal cover and reduce snow depth. Winters with deep snow lasting over 90 days cause significant mortality from starvation and energy depletion. The UP's deer population fluctuates dramatically based on winter severity, making management more challenging than in the southern Lower Peninsula where winters are milder."

