title: American Robin
scientific_name: Turdus migratorius
adopted_year: 1931
legislation: House Concurrent Resolution 30 (1931)
meaning: Michigan's state bird is best understood as a popularity symbol. In 1931, the Legislature ratified a statewide Michigan Audubon election in which the robin won as the bird ordinary Michiganders already knew best — decided by nearly 200,000 ballots, many cast by schoolchildren.
author: USA Symbol Team
date_published: '2025-11-23'
date_modified: "2026-05-02"
seo_title: "Michigan State Bird | American Robin"
seo_description: Michigan's state bird is the American Robin, adopted in 1931 after a Michigan Audubon vote with nearly 200,000 ballots, many from schoolchildren.
intro_text: Michigan's state bird is the <strong>American Robin</strong>, made official on <strong>May 21, 1931</strong> through <strong>House Concurrent Resolution 30</strong>. The robin was not chosen because it was rare or exclusive to Michigan. It won a large public vote organized by the Michigan Audubon Society — nearly 200,000 ballots, many cast by schoolchildren — and the Legislature ratified the bird people already knew from yards, parks, roadsides, and spring mornings across the state.
