meaning: "Kalkaska Sand is the soil of Michigan's northern forest — the deep, sandy ground under the white pine and red pine stands that made Michigan one of the leading timber states in the nation during the 1800s. Its dramatic layering records thousands of years of pine-needle-acidified rain washing iron and minerals down through the sand: a pale bleached zone on top, a dark reddish-brown zone below where everything accumulates. The same soil that built Michigan's lumber towns still feeds the white pine plantations, Christmas tree farms, and northern hardwood forests the state is known for today."
meaning_title: Meaning of the Kalkaska Sand Series
meaning_after_section: history
author: USA Symbol Team
