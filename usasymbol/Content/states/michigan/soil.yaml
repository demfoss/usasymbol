seo_title: "Michigan State Soil | Kalkaska Sand Series"
seo_description: "The Michigan state soil is the Kalkaska Sand series, adopted in 1990. It covers nearly 1 million acres in 29 northern Michigan counties and supports pine forests and Christmas trees."
hero_image: /images/soils/michigan/kalkaska-sand.jpg
