faq:
- question: What is Michigan's state soil?
  answer: "Michigan's state soil is the Kalkaska Sand series, a deep sandy soil found across nearly one million acres in the northern Lower Peninsula and Upper Peninsula. The Michigan Legislature designated it the official state soil on December 14, 1990, under Act 302 of 1990."
- question: Why is it called Kalkaska sand?
  answer: "The series is named after Kalkaska County in the northern Lower Peninsula of Michigan, where it was first described and mapped in 1927. The county gave the soil its name, and the soil put Kalkaska County on the map for soil scientists."
- question: What color is Kalkaska sand?
  answer: "The surface layer is nearly black from decomposed forest litter. Just below that is a pale, bleached layer that looks almost grey. Below that is a dramatic dark reddish-brown zone — the spodic horizon — where iron and organic matter accumulate. Deeper sand fades to strong brown and then light yellowish brown."
- question: Where is Kalkaska sand found in Michigan?
  answer: "Kalkaska sand covers nearly one million acres in 29 counties across Michigan's northern Lower Peninsula and Upper Peninsula. It sits on the glacial outwash plains and moraines that define the northern half of the state."
- question: What grows in Kalkaska sand?
  answer: "Most land on Kalkaska sand is forested — white pine, red pine, jack pine, and northern red oak. Where farmers use it, the best crops are potatoes, strawberries, and Christmas trees. The soil is too droughty for most row crops without irrigation."
- question: Who chose Kalkaska sand as Michigan's state soil?
  answer: "The Michigan Legislature designated Kalkaska sand through Act 302 of 1990. Kalkaska was chosen because it is the most extensive soil series in Michigan, it supports the timber and forest products industry, and it was one of the first soil series mapped in the state, in 1927."
- question: How deep is Kalkaska sand?
  answer: "Kalkaska sand is very deep — the profile reaches more than 80 inches (about 6.5 feet) before hitting unweathered parent material, and bedrock is much deeper than that. Roots can grow deep, but the soil dries out quickly because sand holds very little water between rains."

