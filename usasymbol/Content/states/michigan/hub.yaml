name_meaning:
  heading: What Does Michigan Mean?
  paragraphs:
  - Michigan is the 26th U.S. state, admitted to the Union on January 26, 1837 after the Toledo War boundary dispute. The name is generally traced to an Indigenous Great Lakes word often interpreted as "large water" or "great lake."
  - "The state's own motto makes geography the argument: Si Quaeris Peninsulam Amoenam Circumspice means \"If you seek a pleasant peninsula, look about you.\" Michigan's symbol set keeps returning to that idea of water, peninsulas, and Great Lakes shoreline."
  - Michigan's postal abbreviation is MI, and residents are Michiganders or Michigan residents. Its Wolverine State nickname is famous but historically slippery because wolverines were probably never common in the state.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Usually traced to an Indigenous Great Lakes word connected with large water or a great lake.
    - label: Statehood
      text: Michigan became the 26th state on January 26, 1837.
    - label: Geography
      text: The state motto and flag both emphasize Michigan as a peninsula landscape surrounded by Great Lakes.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Michigan, a Great Lakes state made of two peninsulas.
    - label: People
      text: Michiganders is widely used, though Michigan residents is also common.
    - label: Motto
      text: The motto came from the 1835 constitutional convention before Michigan's formal admission.
  - heading: Nicknames and Short Forms
    items:
    - label: Wolverine State
      text: Historic nickname with an uncertain origin.
    - label: Great Lakes State
      text: Informal nickname tied to Michigan's freshwater geography.
    - label: Mitten State
      text: Popular nickname from the Lower Peninsula's map shape.
    - label: Abbreviation
      text: MI; older short form Mich.
editorial:
  heading: What Michigan's Symbols Say About the State
  paragraphs:
  - Michigan's [state motto](/states/michigan/motto) may be the most literal geography lesson in American symbolism. It tells people to look around for the pleasant peninsula, while the [state flag](/states/michigan/flag) puts a man on a peninsula at the center of the shield.
  - The [eastern white pine](/states/michigan/tree) is a boom-and-recovery symbol. Michigan white pine built cities and fortunes, then left cutover land behind; the tree now carries both lumber history and reforestation memory.
  - The [American robin](/states/michigan/bird) came through a huge public vote rather than a rare-species campaign. That makes it a deliberately familiar symbol, while the [white-tailed deer](/states/michigan/mammal/white-tailed-deer) adds a modern game and recovery story.
faq:
- question: Is Lansing Michigan's largest city?
  answer: No. Lansing is the capital, but Detroit is larger. Lansing is one of [33 state capitals that are not the largest city in their state](/rankings/geography/state-capitals-not-largest-city).
- question: What is Michigan's most famous state symbol?
  answer: The [Michigan state flag](/states/michigan/flag) is one of the state's main symbols because it carries the coat of arms, peninsula shield, elk, moose, eagle, and three Latin mottoes.
- question: What is Michigan's state bird?
  answer: Michigan's state bird is the [American robin](/states/michigan/bird), adopted in 1931 after a large Michigan Audubon public vote.
- question: What is Michigan's state flower?
  answer: Michigan's state flower is the [apple blossom](/states/michigan/flower), adopted in 1897.
- question: Why is Michigan called the Wolverine State?
  answer: Michigan is called the Wolverine State even though the animal connection is uncertain. The [Michigan nickname](/states/michigan/nickname) page explains the main theories, including fur trade and Toledo War explanations.
- question: How many official state symbols does Michigan have?
  answer: Michigan's state symbols list here includes the flag, robin, apple blossom, eastern white pine, motto, colors, nickname, and white-tailed deer.
