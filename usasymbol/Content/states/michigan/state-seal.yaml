type: State Seal
state: Michigan
name: Great Seal of Michigan
adopted_year: 1835
is_official: true
legislation: Michigan Compiled Laws § 2.21
meaning: 'The Great Seal of Michigan was authorized in 1835, two years before statehood, based on a coat of arms attributed to former territorial governor Lewis Cass. A man stands on a Great Lakes shoreline at the center of the shield, his right hand raised in peace and a rifle in his left, with the word Tuebor ("I will defend") below him. An elk and a moose support the shield on either side. A bald eagle above carries the national motto E Pluribus Unum, and the state motto "Si quaeris peninsulam amoenam circumspice," meaning If you seek a pleasant peninsula, look about you, runs along the outer border.'
author: USA Symbol Team
date_published: '2026-05-10'
date_modified: '2026-05-15'
seo_title: 'Michigan State Seal | Tuebor, Elk & Moose'
seo_description: "Michigan's 1835 state seal features a man on a Great Lakes shore, the word Tuebor, an elk, a moose, and a bald eagle. See what every element means."
hero_image: /images/seals/michigan/seal.webp
hero_image_alt: Great Seal of the State of Michigan, official emblem authorized in 1835
hero_image_caption: The Great Seal of Michigan, authorized in 1835 and adopted at statehood in 1837. An elk and a moose support the central shield, where a man on a shoreline stands beneath the word Tuebor. A bald eagle with E Pluribus Unum crowns the design.
intro_text: "Michigan's state seal places a man on a Great Lakes shoreline at its center, right hand raised and the word Tuebor (\"I will defend\") on the shield beneath him. An elk, a moose, and a bald eagle surround the arms. The state motto translates as \"If you seek a pleasant peninsula, look about you,\" a phrase that only fits one state."
