  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Michigan State Flag Facts"
    facts:
      - "Michigan adopted its current state flag in 1911"
      - "The coat of arms dates to 1835 before statehood"
      - "An elk and a moose serve as supporters on the coat of arms"
      - "Three Latin mottos appear on the flag"
      - "The Brady Flag served as an unofficial state flag from 1837"
      - "A two-sided flag with U.S. coat of arms on reverse was used from 1865 to 1911"

faq:
  - question: "What is the official state flag of Michigan?"
    answer: "The Michigan state flag is the official banner of Michigan. It features the state coat of arms with an eagle, a shield showing a man on a peninsula, and an elk and moose as supporters on a dark blue field."

  - question: "How would you describe the design of the Michigan state flag?"
    answer: "The flag shows the Michigan coat of arms centered on a dark blue background. The coat of arms includes a shield with a man on a peninsula, an eagle above holding arrows and an olive branch, and an elk and moose flanking the sides. Three Latin mottos appear on ribbons."

  - question: "How do historians explain the symbolism of Michigan's flag?"
    answer: "The flag represents Michigan's geography, wildlife, and values. The peninsula symbolizes Michigan's unique landscape. The elk and moose represent native wildlife. The mottos emphasize defense, unity, and appreciation for the state's natural beauty."

  - question: "What does the Michigan state flag represent?"
    answer: "The flag means protection and natural beauty. Tuebor means I will defend. Si Quaeris Peninsulam Amoenam Circumspice means If you seek a pleasant peninsula, look about you. The imagery celebrates Michigan's position and commitment to its citizens."

  - question: "How is Michigan's flag usually described?"
    answer: "An elk, a moose, and an eagle appear on the Michigan state flag. The elk stands on the left of the shield. The moose stands on the right. The eagle perches above."

  - question: "What stands out most about Michigan's flag?"
    answer: "Three animals appear on the flag: an elk on the left, a moose on the right, and an eagle above the shield."

  - question: "What meaning is attached to Michigan's flag?"
    answer: "Tuebor is Latin for I will defend. The motto appears on a red ribbon above the eagle and represents Michigan's commitment to protecting its territory and citizens."

  - question: "In what year did Michigan's current flag become official?"
    answer: "Michigan adopted its current state flag in 1911, though earlier versions existed from 1837 and 1865. The broader region is summarized in [states neighboring states](/rankings/geography/states-neighboring-states)."

