faq:
  - question: What is Michigan's state stone?
    answer: "Michigan's state stone is the Petoskey stone, a piece of fossilized coral known to scientists as Hexagonaria percarinata."
  - question: When did Michigan adopt the Petoskey stone as its state stone?
    answer: "Governor George Romney signed the bill naming the Petoskey stone the official state stone on June 28, 1965."
  - question: Why did Michigan choose the Petoskey stone?
    answer: "The fossil coral is closely tied to the city of Petoskey and the Little Traverse Bay shoreline, where generations of beachcombers have collected it, and it shares its name with the Odawa chief Petosegay."
  - question: Where can you find Petoskey stones in Michigan?
    answer: "Beaches around Petoskey on Little Traverse Bay are the best-known spot, though the stones also turn up along other Lake Michigan and Lake Huron shorelines and inland gravel pits between Alpena and Traverse City."

