  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Petoskey Stone Facts"
    facts:
      - "Adopted as Michigan's state stone in 1965."
      - "Petoskey stones are fossilized coral from reefs that grew about 350 million years ago."
      - "The stone and the city of Petoskey are both named for the Odawa chief Petosegay."
      - "Wetting or polishing a Petoskey stone brings out its hexagonal fossil pattern, which is hard to see when the stone is dry."

