intro_text: "Michigan's state stone is the Petoskey stone, adopted in 1965, a piece of 350-million-year-old fossilized coral found along Lake Michigan beaches near the city of Petoskey. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Michigan State Stone
    paragraphs:
      - "The Petoskey stone is Michigan's official state stone, designated by the Michigan Legislature in 1965. It is not a mineral rock at all but fossilized coral, Hexagonaria percarinata, from reefs that grew in a warm sea covering the region roughly 350 million years ago."
      - "Michigan chose a fossil so tied to one part of the state that it took the name of a specific city, giving the northern Lower Peninsula's beaches an emblem found almost nowhere else."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is a Petoskey Stone?"
    paragraphs:
      - "A Petoskey stone is a fragment of fossilized colonial coral, its surface covered in a honeycomb of small hexagonal segments, each once a single coral polyp. Dry, the stone often looks like plain gray limestone, but wetting or polishing it brings the hexagonal pattern into sharp contrast."
      - "The coral colonies that became Petoskey stones grew on a reef in a shallow tropical sea that covered what is now Michigan during the Devonian period. Glaciers later broke up the ancient reef rock and scattered fragments across the northern Lower Peninsula, which is why the stones now turn up loose on beaches and in gravel."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Michigan Chose the Petoskey Stone as Its State Stone"
    paragraphs:
      - "The stone takes its name from the city of Petoskey on Little Traverse Bay, near where the fossil coral is most commonly found washed up on the shore. Beachcombing for Petoskey stones has been a popular pastime in the region for generations, especially after rain or wave action exposes fresh stones on the sand."
      - "Governor George Romney signed the bill making the Petoskey stone the official state stone on June 28, 1965, at a ceremony that included Ella Jane Petoskey, a descendant of the Odawa chief the city and stone are ultimately named for. That connection between the fossil, the city, and Michigan's Indigenous history gave the designation a depth beyond simple geology."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the Petoskey Stone Became Michigan's State Stone"
    paragraphs:
      - "The Michigan Legislature passed the bill naming the Petoskey stone the state stone in 1965, and Governor George Romney signed it into law that June, formally recognizing a fossil already closely tied to Michigan's Lake Michigan shoreline."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Petoskey Stones Are Found in Michigan"
    paragraphs:
      - "Petoskey stones are most commonly found along the beaches of Little Traverse Bay near Petoskey, as well as elsewhere along Lake Michigan and Lake Huron shorelines and in inland gravel pits between Alpena and Traverse City. They occur specifically in a rock layer geologists call the Alpena Limestone."
