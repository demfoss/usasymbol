type: State Coat of Arms
state: Michigan
name: Michigan State Coat of Arms
adopted_year: 1835
is_official: true
meaning: "The Michigan coat of arms places a frontier scene at the center of a blue shield, with the single Latin word TUEBOR marking Michigan's role as a northern border state. An elk and a moose — both native to Michigan's forests and wetlands — stand on either side. A bald eagle perches above, and the state motto below the shield describes Michigan's own geography in Latin: If you seek a pleasant peninsula, look about you."
meaning_title: Meaning of the Michigan Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Michigan Coat of Arms: Meaning, Symbols and History'
seo_description: "The Michigan coat of arms was adopted in 1835 and shows a shield with TUEBOR, supported by an elk and a moose, with a bald eagle above."
