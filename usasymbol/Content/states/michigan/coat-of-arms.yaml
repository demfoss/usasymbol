hero_image_caption: The Michigan Coat of Arms, adopted in 1835. The central shield shows a frontiersman on a peninsula with the sun rising over a lake and the word TUEBOR. An elk and a moose support the shield on either side. A bald eagle stands above holding the national motto.
intro_text: "The Michigan coat of arms dates to 1835 and carries the Latin word TUEBOR — I will defend — on a blue shield showing a frontiersman on a peninsula with the sun rising over water. An elk and a moose stand on either side, and a bald eagle perches above."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Michigan Coat of Arms?
  paragraphs:
  - "The Michigan coat of arms appears on official state documents, government buildings, and the state seal. It uses a central shield flanked by two large animals, with a bird perched above and a Latin motto running below. The design has remained essentially unchanged since Michigan adopted it at its first constitutional convention in 1835."
  - "The coat of arms is distinct from the state seal, which is a circular disc used to authenticate government documents. The coat of arms is the heraldic version of the same design — the shield, supporters, crest, and motto together as a formal armorial composition."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Michigan Coat of Arms
  paragraphs:
  - "Michigan held its first constitutional convention in 1835, two years before Congress formally admitted it to the Union. Delegates at that convention established the state's founding symbols, including the coat of arms and the state motto. Michigan officially became the twenty-sixth state on January 26, 1837."
  - "Lewis Cass, who was governor of Michigan Territory from 1813 to 1831, is credited with shaping the design of the territorial seal that became the foundation for Michigan's coat of arms. Cass selected the frontier scene on the shield and chose symbols intended to reflect Michigan's northern geography and its position on the border of the United States and British Canada."
  - "The word TUEBOR on the shield — Latin for I will defend — was chosen deliberately. Michigan shares a long water border with Canada, and delegates saw the state as a northern gateway into the United States. The motto below the shield, in Latin, was adapted from the inscription on the tomb of the English architect Christopher Wren in St. Paul's Cathedral, London. Where Wren's original line referred to a monument, Michigan's version replaced that word with 'pleasant peninsula.'"

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Michigan Coat of Arms
  paragraphs:
  - "The Michigan coat of arms is built around a blue shield supported by an elk and a moose, with a bald eagle above and the state motto on a scroll below. Each element refers to Michigan's geography, its history as a border state, or its natural environment."
  elements:
  - id: shield
    name: The Shield and TUEBOR
    image: /images/coats-of-arms/michigan/elements/shield.svg
    paragraphs:
    - "The shield has an azure (blue) background and shows a sun rising over a body of water with a peninsula in the foreground. A man stands on the peninsula with his right hand raised. The scene reflects Michigan's landscape — a state almost entirely surrounded by the Great Lakes, with the sun rising over water on nearly every horizon."
    - "Across the upper portion of the shield runs the word TUEBOR in Latin, meaning I will defend. The word refers to Michigan's position along the northern border of the United States, where the state faces British Canada across the Great Lakes. It was a deliberate choice by the delegates who designed the coat of arms in 1835."
  - id: elk
    name: The Elk
    image: /images/coats-of-arms/michigan/elements/elk.svg
    paragraphs:
    - "An elk stands on one side of the shield, facing inward toward the center of the design. Elk are native to Michigan and were once common across the state's forests. The elk on the coat of arms represents the wildlife of Michigan's northern landscape."
  - id: moose
    name: The Moose
    image: /images/coats-of-arms/michigan/elements/moose.svg
    paragraphs:
    - "A moose stands on the other side of the shield, also facing inward. Like the elk, the moose is native to Michigan, particularly in the Upper Peninsula. Together, the two animals frame the shield with a pair of large mammals that are specific to Michigan's northern forests and wetlands."
  - id: eagle
    name: The Bald Eagle
    image: /images/coats-of-arms/michigan/elements/eagle.svg
    paragraphs:
    - "A bald eagle perches above the shield, wings spread, forming the crest of the coat of arms. The eagle holds a ribbon carrying the motto E Pluribus Unum — Latin for Out of many, one — the motto of the United States. The eagle connects Michigan's state identity to the national symbol and reflects Michigan's place within the federal union."
  - id: motto
    name: Si Quaeris Peninsulam Amoenam Circumspice
    image: /images/coats-of-arms/michigan/elements/motto.svg
    paragraphs:
    - "The motto below the shield reads Si quaeris peninsulam amoenam circumspice in Latin, meaning If you seek a pleasant peninsula, look about you. It describes Michigan's own geography — a state made up of two peninsulas surrounded by four of the five Great Lakes."
    - "The phrase was adapted from the inscription on the tomb of the English architect Christopher Wren in St. Paul's Cathedral, London. Wren's original Latin line asked readers to look around at his monument — the cathedral itself. Michigan's version replaced 'monument' with 'pleasant peninsula.'"

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Michigan Coat of Arms
  paragraphs:
  - "The coat of arms connects Michigan's identity to three distinct things: its geography, its wildlife, and its position on the northern border of the United States. The peninsula scene on the shield and the motto below both point directly to Michigan's physical shape — a state surrounded by water on nearly every side."
  - "TUEBOR, placed at the top of the shield, frames Michigan not just as a place but as a border. When the design was adopted in 1835, Michigan shared a long water border with British Canada. The word I will defend signaled that Michigan saw itself as part of the country's northern defense."
  - "The elk and moose on either side are not generic animals. Both lived — and still live — in Michigan's forests. Their inclusion grounds the coat of arms in the specific landscape of the state rather than in abstract symbols."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Michigan Coat of Arms Facts
  facts:
  - "Adopted in 1835, two years before Michigan officially became a state on January 26, 1837."
  - "TUEBOR is Latin for I will defend — a reference to Michigan's position on the northern border of the United States, facing Canada across the Great Lakes."
  - "The state motto, Si quaeris peninsulam amoenam circumspice, was adapted from the tomb inscription of English architect Christopher Wren in St. Paul's Cathedral, London."
  - "Michigan's coat of arms includes two native animals — an elk and a moose — both historically found in Michigan's northern forests and wetlands."
  - "Lewis Cass, governor of Michigan Territory from 1813 to 1831, is credited with shaping the design that became the coat of arms."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Michigan Coat of Arms
  paragraphs:
  - "The Michigan coat of arms grew out of the territorial seal used before Michigan became a state. Michigan Territory was established in 1805, and a territorial seal was created at that time. The design elements that later appeared in the state coat of arms — the frontier scene, the border reference, and the geographical imagery — were already present in the territorial period."
  - "No separately adopted earlier coat of arms with different official standing preceded the 1835 design. What survives from the territorial period are seal impressions and document stamps, not a distinct coat of arms in the heraldic sense."
