seo_title: Michigan State Fish | Brook Trout
seo_description: The Michigan state fish is the brook trout, adopted in 1988. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/michigan/michigan-fish-hero.webp
hero_image_alt: A brook trout with an olive back with pale wormlike markings, red spots with blue halos, and orange lower fins edged in white and black.
hero_image_caption: The brook trout, Michigan's state fish, lives in cold, clear streams and lakes across the state.
intro_text: Michigan's state fish is the brook trout, a colorful native trout of cold, clear streams. State lawmakers named it the official state fish in 1988. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Michigan?
  paragraphs:
  - The brook trout is the official state fish of Michigan, and its scientific name is Salvelinus fontinalis.
  - The Michigan Legislature first chose "the trout" as the state fish in 1965. In 1988, lawmakers made it clear that the brook trout is the official species.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a long, streamlined body and a large mouth that reaches past its eye. Its back is olive, blue-gray, or black, and its belly is silvery white.
  - Look for pale, wiggly, wormlike markings on its back and red spots with bluish halos on its sides. The lower fins have a white front edge, then a black stripe, and the rest is reddish orange.
  - In fall, males turn bright orange-red along their lower sides. Brook trout that live in streams usually grow 7 to 9 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - Michigan lawmakers chose the trout as the state fish in 1965, but the law did not name a species. Four kinds of trout live in Michigan. These are the brook, brown, rainbow, and lake trout.
  - Many people felt the law needed to be clearer. In 1988, the Michigan Legislature passed a law naming the brook trout as the official state fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Michigan Chose the Brook Trout
  paragraphs:
  - The 1988 law settled which of Michigan's four trout species was the state fish. The state notes that the brook trout is native to Michigan and found throughout the state.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Brook trout need cool, clean water. They are most common across northern Michigan, especially in the Upper Peninsula, where almost any clear, cold stream may hold them.
  - The Black River system in the northeastern Lower Peninsula has a reputation as one of the state's best brook trout waters. Some brook trout, called coasters, live in the Great Lakes and grow much larger.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1988 by the Michigan Legislature.
  - Scientific name is Salvelinus fontinalis.
  - Stream brook trout usually grow 7 to 9 inches long.
  - Great Lakes brook trout, called coasters, can reach 25 inches and 10 pounds.
  - Brook trout usually live no longer than 6 years.
faq:
- question: What is Michigan's state fish?
  answer: Michigan's state fish is the brook trout, a native trout with red spots, blue halos, and wormlike markings on its back.
- question: When did Michigan adopt the brook trout?
  answer: The Michigan Legislature named the brook trout the state fish in 1988. Before that, a 1965 law named "the trout" without picking a species.
- question: Why did Michigan choose the brook trout?
  answer: Michigan has four kinds of trout, so lawmakers wanted to make clear which one was the state fish. The brook trout is native to Michigan and lives throughout the state.
- question: What does the brook trout look like?
  answer: It has an olive to dark back with pale wormlike markings, red spots with bluish halos on its sides, and orange lower fins edged in white and black.
- question: Where do brook trout live in Michigan?
  answer: They live in cold, clear streams and lakes, especially in the Upper Peninsula. The Black River system in the northeastern Lower Peninsula is also known for brook trout.
