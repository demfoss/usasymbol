intro_text: "Michigan's state gem is chlorastrolite, adopted in 1972 and better known as Isle Royale greenstone, a bluish-green stone found almost exclusively on Isle Royale and the Keweenaw Peninsula. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Michigan State Gem
    paragraphs:
      - "Chlorastrolite is Michigan's official state gem, designated by the Michigan Legislature in 1972. The name means green star stone, a reference to the small, star-like segments visible on a polished surface, and the material is more commonly called Isle Royale greenstone."
      - "Michigan chose a stone found almost nowhere else on Earth outside the state's own Lake Superior shoreline, making it one of the more geographically exclusive state gem designations in the country."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Chlorastrolite?"
    paragraphs:
      - "Chlorastrolite is a variety of the mineral pumpellyite, bluish green to greenish black in color, with a distinctive pattern of small, radiating, star-shaped segments across its surface. Polished, the segments give the stone what collectors call a turtleback pattern, since it resembles the pattern on a turtle's shell."
      - "The stone forms as rounded nodules inside gas cavities in ancient basalt lava flows, the same volcanic rock that also hosts the region's native copper deposits. Weathering and wave action free the nodules from the surrounding basalt, and they wash up as smooth, bean-sized pebbles along the shore."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Michigan Chose Chlorastrolite as Its State Gem"
    paragraphs:
      - "Chlorastrolite is found in significant quantity in only two places in the world, Isle Royale and the Keweenaw Peninsula, both part of Michigan's Upper Peninsula region. That rarity gave the state a gem it could claim almost exclusively, unlike widely distributed materials other states have chosen."
      - "The stone had already built a following among collectors and jewelers along Lake Superior for decades before the legislature acted, prized both for its unusual pattern and its scarcity. Naming it the state gem in 1972 formalized a material already treated as a regional signature stone."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Chlorastrolite Became Michigan's State Gem"
    paragraphs:
      - "The Michigan Legislature designated chlorastrolite the official state gem in 1972, recognizing a stone already closely tied to the Isle Royale and Keweenaw region of the Upper Peninsula."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Chlorastrolite Is Found in Michigan"
    paragraphs:
      - "Isle Royale, an island in Lake Superior now protected as a national park, is the best-known source of chlorastrolite, along with parts of the nearby Keweenaw Peninsula. Collecting the stone within Isle Royale National Park is no longer permitted, which has made older, already-collected specimens more sought after."
    sites:
      - name: Isle Royale National Park
        city: Isle Royale
        lat: 48.0084
        lng: -88.8259
        note: "Namesake source of Isle Royale greenstone"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Chlorastrolite Facts"
    facts:
      - "Adopted as Michigan's state gem in 1972."
      - "Chlorastrolite is also known as Isle Royale greenstone."
      - "The stone is a variety of the mineral pumpellyite, not a distinct mineral species of its own."
      - "Collecting chlorastrolite within Isle Royale National Park is now prohibited, making the Keweenaw Peninsula the main legal collecting area."

