faq:
  - question: What is Michigan's state gem?
    answer: "Michigan's state gem is chlorastrolite, a bluish-green variety of pumpellyite better known as Isle Royale greenstone."
  - question: When did Michigan adopt chlorastrolite as its state gem?
    answer: "The Michigan Legislature designated chlorastrolite the official state gem in 1972."
  - question: Why did Michigan choose chlorastrolite?
    answer: "The stone is found in significant quantity almost nowhere else on Earth besides Isle Royale and the Keweenaw Peninsula, giving Michigan a gem nearly exclusive to the state."
  - question: Where can you find chlorastrolite in Michigan?
    answer: "Isle Royale and the Keweenaw Peninsula are the main sources, though collecting is now banned inside Isle Royale National Park."

