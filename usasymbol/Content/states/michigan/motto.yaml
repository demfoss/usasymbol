faq:
  - question: "What is Michigan's state motto?"
    answer: "Michigan's state motto is \"Si Quaeris Peninsulam Amoenam Circumspice,\" a Latin phrase meaning \"If You Seek a Pleasant Peninsula, Look About You.\" It was adopted on June 2, 1835, at Michigan's Constitutional Convention."

  - question: "What is the English translation of Michigan's state motto?"
    answer: "The English translation is \"If You Seek a Pleasant Peninsula, Look About You.\" The phrase is addressed to the reader, who is assumed to already be standing on the peninsula."

  - question: "What does \"Si Quaeris Peninsulam Amoenam Circumspice\" mean?"
    answer: "It means \"If You Seek a Pleasant Peninsula, Look About You.\" The motto refers to Michigan's geography: the Lower Peninsula and Upper Peninsula are bordered by four of the five Great Lakes."

  - question: "When did Michigan adopt its state motto?"
    answer: "The motto was adopted on June 2, 1835, as part of the Great Seal at Michigan's Constitutional Convention, nearly two years before Michigan became a state on January 26, 1837."

  - question: "Who created Michigan's state motto?"
    answer: "Lewis Cass, who served as Michigan's Territorial Governor from 1813 to 1831, proposed the motto. He based it on the Latin epitaph above Sir Christopher Wren's tomb in St. Paul's Cathedral: \"Si monumentum requiris, circumspice\" (If you seek his monument, look around you)."

  - question: "Where does Michigan's motto appear?"
    answer: "On a white ribbon on the Great Seal of Michigan, below the central shield. The motto also appears on the state flag, which shows the coat of arms on a dark blue background."

