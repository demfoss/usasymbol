seo_title: "Michigan State Motto"
seo_description: "Michigan's state motto, \"Si Quaeris Peninsulam Amoenam Circumspice,\" means \"If You Seek a Pleasant Peninsula, Look About You.\" Adopted in 1835."

intro_text: "Michigan's state motto is <strong>Si Quaeris Peninsulam Amoenam Circumspice</strong>, a Latin phrase meaning <em>If You Seek a Pleasant Peninsula, Look About You</em>. Lewis Cass proposed it in 1835, adapting the inscription above Sir Christopher Wren's tomb in St. Paul's Cathedral, London."

