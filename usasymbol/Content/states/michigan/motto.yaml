title: "Si Quaeris Peninsulam Amoenam Circumspice"
language: "Latin"
english_translation: "If you seek a pleasant peninsula, look about you"
adopted_year: 1835

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Michigan State Motto | Si Quaeris Peninsulam Amoenam Circumspice! If you seek a pleasant peninsula, look about you!"
seo_description: "Michigan's state motto is 'Si quaeris peninsulam amoenam circumspice,' meaning 'If you seek a pleasant peninsula, look about you.'"

intro_text: "Michigan's state motto is <strong>Si Quaeris Peninsulam Amoenam Circumspice</strong> — Latin for <em>If you seek a pleasant peninsula, look about you</em>. The phrase was adapted by Lewis Cass from Christopher Wren's epitaph at St. Paul's Cathedral in London, swapping 'monument' for 'pleasant peninsula.' Cass proposed it in 1835 at Michigan's Constitutional Convention — before Michigan had even been admitted to the Union. Congress didn't grant statehood until January 26, 1837, delayed by the Toledo War. Michigan 'lost' the disputed Toledo Strip to Ohio, but received the western Upper Peninsula in exchange — land that turned out to contain some of the richest copper and iron ore deposits in North America."

sections:
  - id: "wren-epitaph-adaptation"
    icon: "fa-solid fa-church"
    title: "Adapted From Christopher Wren's Epitaph"
    paragraphs:
      - "Christopher Wren designed St. Paul's Cathedral in London, completed in 1711. When Wren died in 1723, his son arranged for an epitaph on his tomb inside the cathedral. The inscription reads: 'Si monumentum requiris, circumspice' — 'If you seek his monument, look around you.' The cathedral itself was the monument. The phrase became widely known in educated circles in England and America."
      - "Lewis Cass had served as Michigan's territorial governor from 1813 to 1831 — 18 years — and knew the state's geography better than almost anyone. When he proposed a motto for the 1835 seal, he adapted Wren's formula: he kept the conditional structure ('Si quaeris...circumspice') and replaced 'monumentum' (monument) with 'peninsulam amoenam' (pleasant peninsula). The result made the same rhetorical move as the original — telling the reader to simply look around them to find the answer."
      - "Michigan's Lower Peninsula is surrounded on three sides by Lake Michigan, Lake Huron, and Lake Erie. Michigan has 3,288 miles of Great Lakes shoreline — more than any other state. The motto's instruction to 'look about you' and see a pleasant peninsula was geographically accurate for anyone standing almost anywhere in Michigan."

  - id: "toledo-war-and-upper-peninsula"
    icon: "fa-solid fa-map"
    title: "The Motto Was Adopted Before Michigan Was a State — During the Toledo War"
    paragraphs:
      - "Michigan's Constitutional Convention met in May 1835. Governor Stevens T. Mason pushed for statehood even though Congress had not yet approved it — Michigan's population had exceeded 60,000, meeting the Northwest Ordinance requirement. The convention drafted a constitution in 45 days and adopted Lewis Cass's seal design, including the motto, on June 2, 1835."
      - "The problem was Ohio. Both Michigan Territory and Ohio claimed a narrow strip of land — 468 square miles including the city of Toledo — based on conflicting interpretations of the Northwest Ordinance's survey lines. Ohio Governor Robert Lucas established Lucas County in the disputed strip. Michigan passed the Pains and Penalties Act making it a crime for Ohio officials to exercise jurisdiction there. Governor Mason led Michigan militia to the Toledo area. The only recorded violence was a Michigan deputy stabbed with a pen knife at Phillips Corners — no one died. But the political standoff blocked Michigan's admission to the Union."
      - "Congress proposed a compromise in 1836: Michigan would cede the Toledo Strip to Ohio and receive the western three-quarters of the Upper Peninsula in exchange. Michigan's first convention in September 1836 rejected this as humiliating. The legislature called a second convention — the 'Frostbitten Convention,' held in December 1836 with a smaller quorum — which accepted the deal. President Jackson signed the statehood act on January 26, 1837."

  - id: "upper-peninsula-worth-more"
    icon: "fa-solid fa-gem"
    title: "What Michigan Got Was Worth More Than What It Lost"
    paragraphs:
      - "In 1836, most Michigan delegates who rejected the compromise considered the Upper Peninsula worthless wilderness — rocky, forested, far from the settled Lower Peninsula. The Toledo Strip included a major port city and was worth fighting for. The Upper Peninsula seemed like nothing."
      - "Copper was discovered in the Keweenaw Peninsula in the 1840s. The Marquette Iron Range began producing iron ore in the 1850s. By the late 19th century, the Upper Peninsula was producing more copper than anywhere else in the world and supplying the iron ore that fueled the steel industry driving American industrialization. The timber industry harvested vast forests across both peninsulas."
      - "Toledo today is a city of approximately 270,000 people. The Upper Peninsula added more than 16,000 square miles of territory, including mineral and timber wealth that was worth immeasurably more to Michigan's development than one Ohio port city. The 'Frostbitten Convention' delegates who accepted the deal made one of the best territorial trades in American history."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Michigan State Motto Facts"
    style: "gradient"
    facts:
      - "Lewis Cass adapted the motto from Christopher Wren's epitaph at St. Paul's Cathedral, swapping 'monument' for 'pleasant peninsula.'"
      - "Michigan's Constitutional Convention adopted the motto on June 2, 1835 — before Congress admitted Michigan as a state."
      - "Statehood was delayed until January 26, 1837 by the Toledo War dispute with Ohio."
      - "Michigan 'lost' the Toledo Strip to Ohio but gained the western Upper Peninsula — which contained far richer copper and iron ore deposits."
      - "Michigan has 3,288 miles of Great Lakes shoreline — more than any other U.S. state."
      - "Lewis Cass served as Michigan's territorial governor for 18 years (1813–1831) before proposing the motto design."

faq:
  - question: "What is Michigan's state motto?"
    answer: "Michigan's state motto is 'Si Quaeris Peninsulam Amoenam Circumspice,' a Latin phrase meaning 'If you seek a pleasant peninsula, look about you.' It was adopted on June 2, 1835, at Michigan's Constitutional Convention — before Michigan became a state."

  - question: "What does Michigan's motto mean?"
    answer: "'If you seek a pleasant peninsula, look about you' — an invitation to appreciate Michigan's geography. Michigan's Lower Peninsula is surrounded on three sides by Great Lakes, and the state has 3,288 miles of Great Lakes shoreline, more than any other state."

  - question: "Where did Michigan's motto come from?"
    answer: "Lewis Cass adapted it from Christopher Wren's epitaph at St. Paul's Cathedral in London: 'Si monumentum requiris, circumspice' (If you seek his monument, look around you). Cass replaced 'monumentum' (monument) with 'peninsulam amoenam' (pleasant peninsula), keeping the same rhetorical structure."

  - question: "What language is Michigan's motto written in?"
    answer: "Latin. 'Si Quaeris Peninsulam Amoenam Circumspice' is classical Latin, adopted in 1835 alongside the state's Great Seal design."

  - question: "When did Michigan adopt its motto?"
    answer: "June 2, 1835, at the Constitutional Convention — nearly two years before Michigan became the 26th state on January 26, 1837. Statehood was delayed by the Toledo War boundary dispute with Ohio."

  - question: "Where does Michigan's motto appear?"
    answer: "On Michigan's Great Seal (split across two white ribbons below the shield, which shows a man on a peninsula beside a lake flanked by an elk and moose), on the state flag (a blue field with the coat of arms at center, adopted 1865), and on official documents, driver's licenses, and government buildings."

