faq:
  - question: "What is Michigan's state native grain?"
    answer: "Michigan's state native grain is manoomin, or wild rice, adopted by the Michigan Legislature in 2023."
  - question: "When did Michigan adopt manoomin as its state native grain?"
    answer: "The Michigan Legislature designated manoomin the official state native grain in 2023."
  - question: "Why did Michigan choose manoomin?"
    answer: "Manoomin is deeply significant to Michigan's Anishinaabe communities, tied to their traditional migration story, ceremonies, and diet."
  - question: "Is manoomin harvested in Michigan today?"
    answer: "Yes. It still grows in lakes and rivers across northern Michigan and is harvested using traditional canoe methods."

