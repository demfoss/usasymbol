sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Michigan's State Native Grain?"
    paragraphs:
      - "Manoomin, commonly known as wild rice, is Michigan's official state native grain, designated by the Michigan Legislature in 2023. It grows naturally in shallow lakes and slow rivers across the state, especially in the north."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Manoomin"
    paragraphs:
      - "Manoomin is a tall aquatic grass that grows in shallow water and produces long, dark grains. Traditionally, harvesters pole a canoe through the rice beds and gently bend the stalks over the boat, knocking the ripe grains loose with a stick in a method passed down for generations. The grains are then parched and threshed before cooking, giving manoomin a chewy texture and nutty flavor distinct from farmed white rice."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Manoomin Became Michigan's State Native Grain"
    paragraphs:
      - "The Michigan Legislature designated manoomin the official state native grain in 2023, recognizing its deep cultural and ecological importance to the state's Native nations."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Michigan Chose Manoomin"
    paragraphs:
      - "Manoomin holds deep spiritual and cultural significance for Michigan's Anishinaabe, or Ojibwe, communities, whose oral history describes migrating to the Great Lakes region in search of the food that grows on water. It remains central to traditional harvests, ceremonies, and diets, and Michigan tribes and conservation groups continue working to protect the lakes and rivers where it grows."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Manoomin Facts"
    facts:
      - "Adopted as Michigan's state native grain in 2023."
      - "Manoomin means the food that grows on water in the Ojibwe language."
      - "It is traditionally harvested from canoes using two wooden sticks."
      - "Manoomin is sacred to Michigan's Anishinaabe communities and central to their migration story."

