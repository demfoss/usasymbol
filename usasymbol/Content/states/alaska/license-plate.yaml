seo_title: "Alaska License Plate Slogan | The Last Frontier"
seo_description: "The Last Frontier became Alaska's standard license plate slogan in 1968, replacing the short-lived North to the Future."
hero_image: /images/license-plates/alaska/1968-last-frontier.webp
hero_image_alt: Alaska yellow license plate with The Last Frontier slogan
hero_image_caption: Alaska's iconic yellow plate carrying "The Last Frontier" — the slogan introduced in 1968 and used on the standard design from 1981 to 2007.
intro_text: "**\"The Last Frontier\"** is Alaska's best-known license plate slogan, introduced in 1968 and later tied to the state's iconic yellow plate. Earlier Alaska plates used \"North to the Future\" for the 1867-1967 purchase centennial and briefly carried \"The Great Land,\" but The Last Frontier became the phrase that stuck."
quick_answer: '"The Last Frontier" is the Alaska plate slogan most people recognize, used on the standard yellow plate from 1981 to 2007 and introduced as early as 1968. Earlier standard slogans included "North to the Future" — first in its centennial form (1966–1967), then plain (1970–1975) — and "The Great Land" (1968).'
