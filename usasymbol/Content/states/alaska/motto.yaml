intro_text: "Alaska's state motto is <strong>North to the Future</strong>. It was coined by Richard Peter, a journalist from Juneau, and adopted in 1967 during the Alaska Purchase Centennial, the year-long celebration of the 100th anniversary of the United States buying Alaska from Russia."

