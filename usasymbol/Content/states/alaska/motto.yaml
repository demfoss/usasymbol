faq:
  - question: "What is Alaska's state motto?"
    answer: "Alaska's state motto is \"North to the Future.\" It was adopted in 1967 during the Alaska Purchase Centennial and was coined by Juneau journalist Richard Peter."

  - question: "What does \"North to the Future\" mean?"
    answer: "The phrase treats Alaska's northern position as a destination and points forward to its potential. It was chosen to represent Alaska as a land of opportunity, adopted just eight years after Alaska became a state."

  - question: "When did Alaska adopt its state motto?"
    answer: "Alaska adopted \"North to the Future\" in 1967, during the centennial celebration of the 1867 Alaska Purchase."

  - question: "Who coined Alaska's state motto?"
    answer: "Richard Peter, a journalist from Juneau, coined the phrase \"North to the Future\" for the Alaska Purchase Centennial in 1967."

