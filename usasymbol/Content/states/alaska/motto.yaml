title: "North to the Future"
language: "English"
english_translation: ""
adopted_year: 1967

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Alaska State Motto: North to the Future"
seo_description: "Alaska's motto 'North to the Future' was chosen by a $300 public contest in 1963 — and adopted in 1967, one year before the Prudhoe Bay oil discovery made the phrase look prophetic. Full history and meaning."

intro_text: "Alaska's official motto is <strong>North to the Future</strong>, selected through a public contest in 1963 and adopted by the legislature in 1967 — the 100th anniversary of the Alaska Purchase. A Juneau journalist named Richard Peter won the $300 prize for those three words. The phrase appears on Alaska's state seal and remains one of the few modern mottos in the country created through a popular vote rather than legislative committee."

sections:
  - id: "contest"
    icon: "fa-solid fa-trophy"
    title: "The $300 Contest That Chose a State Motto"
    paragraphs:
      - "In 1963, the Alaska Centennial Commission ran a public contest to find a motto for the upcoming 100th anniversary of the Alaska Purchase. Alaskans submitted 761 entries. The commission wanted something that captured the state's identity as a young state with wide-open possibility — not a classical Latin phrase or a reference to colonial history."
      - "Richard Peter, a journalist working in Juneau, submitted 'North to the Future.' He won $300 and a place in Alaska's permanent record. Peter later explained his thinking: he saw Alaska as a land that could offer a 'new tomorrow' for people seeking freedom and opportunity. The north, in his framing, wasn't a direction — it was a destination."
      - "The commission chose Peter's entry in December 1963. It then took four more years before the legislature formally made it the state motto in 1967, timed to the centennial of the 1867 Alaska Purchase from Russia. Alaska Statutes §44.09.045 contains the legal designation."

  - id: "meaning"
    icon: "fa-solid fa-compass"
    title: "What 'North to the Future' Actually Says"
    paragraphs:
      - "Three words in plain English — no Latin, no translation needed. 'North' names a geographic fact: Alaska is America's northernmost state, above the Arctic Circle for much of its territory. 'Future' is the promise: go north and you'll find something that hasn't been claimed, built, or decided yet."
      - "The phrase inverts how most people thought of 'north' in the mid-20th century. Cold, remote, hard. Peter's framing made north mean opportunity — the same logic that drove settlers west in earlier centuries, now pointing upward on the map. That reframing is what the Centennial Commission was looking for."

  - id: "sewards-folly-to-future"
    icon: "fa-solid fa-landmark"
    title: "From 'Seward's Folly' to 'North to the Future'"
    paragraphs:
      - "The United States bought Alaska from Russia on March 30, 1867, for $7.2 million — roughly 2 cents per acre. Secretary of State William H. Seward negotiated the deal under President Andrew Johnson. Critics called it 'Seward's Folly' and 'Seward's Icebox.' Some members of Congress refused to vote for it."
      - "The mockery stopped fast. Gold was discovered in the Klondike in 1896. Fisheries, timber, and military strategy proved Alaska's value across the 20th century. When Alaska became the 49th state in 1959, Alaskans were ready for symbols that looked ahead rather than back. The 1963 contest — and 'North to the Future' — reflected that shift directly."
      - "The phrase's prescience became clear in 1968, one year after the legislature adopted it: the Prudhoe Bay oil field was discovered on Alaska's North Slope. It turned out to be the largest oil field ever found in North America. The motto that promised a future turned out to describe one that actually arrived."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Alaska State Motto Facts"
    style: "gradient"
    facts:
      - "Richard Peter won $300 in the 1963 contest — the motto was literally commissioned with prize money."
      - "761 Alaskans entered the contest; Peter's three words beat them all."
      - "The motto was adopted in 1967, exactly 100 years after the Alaska Purchase from Russia."
      - "One year after adoption, Prudhoe Bay — the largest North American oil field — was discovered."
      - "Alaska Statutes §44.09.045 contains the legal designation of the motto."
      - "'Seward's Folly' is what critics called the 1867 purchase; Alaska's motto answered that nickname a century later."

faq:
  - question: "What is Alaska's state motto?"
    answer: "Alaska's state motto is 'North to the Future,' adopted by the state legislature in 1967 under Alaska Statutes §44.09.045."

  - question: "How was Alaska's motto chosen?"
    answer: "Through a public contest run by the Alaska Centennial Commission in 1963. Journalist Richard Peter of Juneau won the $300 prize for submitting 'North to the Future.' The commission received 761 total entries."

  - question: "What does 'North to the Future' mean?"
    answer: "Peter's intent was to frame Alaska's northern geography as a direction toward opportunity — a place where people could find freedom, resources, and fresh starts. It recast 'north' from a hardship to a destination, echoing the same logic that once drove westward expansion."

  - question: "When did Alaska officially adopt its motto?"
    answer: "The legislature adopted it in 1967, timed to the 100th anniversary of the Alaska Purchase. The contest that selected the phrase was held in 1963 — four years earlier."

  - question: "Is Alaska's motto in Latin?"
    answer: "No. 'North to the Future' is plain English, which sets it apart from the 23 U.S. states that use Latin mottos. Alaska's legislature chose a modern, English phrase rather than a classical one."

  - question: "Where does Alaska's motto appear?"
    answer: "On Alaska's state seal, official government documents, state buildings, and tourism materials. The seal includes the phrase alongside imagery of mountains and the Northern Lights."

