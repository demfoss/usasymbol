type: State Flower
state: Alaska
name: Forget-Me-Not
scientific_name: Myosotis alpestris
adopted_year: 1917
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-15"
seo_title: "Alaska State Flower | Forget-Me-Not"
seo_description: "The Forget-Me-Not became Alaska's state flower in 1917. Learn about this delicate blue wildflower and why Alaska chose it as its official floral emblem."

intro_text: "The Forget-Me-Not serves as Alaska's state flower, a position it has held since 1917, and it remains a signature entry in the [list of U.S. state flowers](/symbols/flowers). This small alpine wildflower produces clusters of brilliant blue blooms with yellow centers. Forget-Me-Nots grow naturally throughout Alaska's mountains, tundra, and river valleys from late spring through summer."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is Alaska's State Flower?"
    paragraphs:
      - "Alaska recognizes the Forget-Me-Not as its state flower. These delicate plants stand just 6 to 12 inches tall. Each stem produces multiple small flowers. The blooms typically measure one-quarter to one-half inch across. The five-petaled flowers display a distinctive sky blue color with bright yellow centers."
      - "Forget-Me-Nots thrive in Alaska's cool climate and short growing season. Plants grow in various habitats across the state. You'll find them in alpine meadows, along streams, throughout tundra regions. The flowers appear from June through August, depending on elevation and local conditions. Some areas see blooms as early as May in warmer microclimates, including northern corridors covered in [States That Border Alaska](/states/alaska/borders)."
      - "These hardy perennials adapt well to Alaska's extreme environment. They tolerate cold temperatures. The plants grow in areas where few other flowering species survive. The low growth habit protects them from harsh winds common in exposed locations. Root systems anchor firmly in rocky or sandy soils."

  - id: name
    icon: "fa-solid fa-tag"
    title: "What Is Alaska's State Flower Called?"
    paragraphs:
      - "Known as Forget-Me-Not, this flower's scientific designation is Myosotis alpestris. The species belongs to the Boraginaceae family. This family includes approximately 2,000 species of flowering plants worldwide."
      - "The scientific name Myosotis comes from Greek words meaning 'mouse ear.' This refers to the plant's small, fuzzy leaves. The species name alpestris indicates its preference for alpine environments. Several related Myosotis species grow in Alaska, but Myosotis alpestris represents the official state flower. Other common names include alpine forget-me-not and mountain forget-me-not."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Alaska Chose the Forget-Me-Not"
    paragraphs:
      - "In 1917, Alaska chose the Forget-Me-Not as its territorial flower through a vote organized by the Alaska Territorial Legislature. This occurred before Alaska achieved statehood in 1959. The flower retained its official status when Alaska became the 49th state. No legislative action was needed to reaffirm the designation, and the color symbolism later carried into [the Alaska state flag](/states/alaska/flag/alaska-state-flag)."
      - "Women's groups across Alaska promoted the Forget-Me-Not during the selection process. They emphasized the flower's abundance throughout the territory. The delicate blue blooms captured the spirit of Alaska's pristine wilderness. Advocates argued it represented Alaska's rugged character better than cultivated garden flowers."
      - "School children participated in the selection by voting for their preferred flower. The Forget-Me-Not won support across different regions of the vast territory. Its hardy nature made it a fitting choice. The widespread distribution meant residents from Ketchikan to Barrow recognized the flower. When the territorial government made the designation official on April 28, 1917, the Forget-Me-Not became one of Alaska's first official symbols."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Alaska State Flower Facts"
    facts:
      - "The Forget-Me-Not grows throughout Alaska from sea level to elevations exceeding 10,000 feet"
      - "These flowers provide important nectar sources for bees, butterflies, and other pollinators during Alaska's short summer season"
      - "Alaska adopted the Forget-Me-Not on April 28, 1917, making it one of the earliest state flower designations in the United States"
      - "The plant thrives in moist soil conditions near streams, lakes, and snowmelt areas where water remains available"
      - "Unlike tropical flowers, Forget-Me-Nots complete their entire life cycle in just a few months to survive Alaska's climate"
      - "Native Alaskans traditionally recognized the flower as a sign that summer had arrived in the high country"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Alaska State Flower and Bird"
    paragraphs:
      - "Alaska's state bird is the Willow Ptarmigan, a grouse species that changes color with the seasons. Both symbols represent Alaska officially; see [the official Alaska state bird page](/states/alaska/bird/willow-ptarmigan) for the adoption timeline. The Forget-Me-Not was adopted in 1917 during the territorial period. The Willow Ptarmigan became the state bird in 1955, four years before statehood."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Forget-Me-Not Symbolizes"
    paragraphs:
      - "The Forget-Me-Not is commonly seen as representing remembrance and enduring connection. In Alaska, the flower has been linked to the state's pioneering spirit and ability to thrive in challenging conditions. The delicate appearance contrasted with hardy nature frequently represents the resilience required to flourish in Alaska's extreme environment, a value also captured by [Alaska's state motto](/states/alaska/motto/north-to-the-future)."
      - "In ecological storytelling, the flower complements [Alaska's state tree](/states/alaska/tree/sitka-spruce): one symbolizes alpine and tundra blooms, the other coastal rainforest structure."

faq:
  - question: "What is the Alaska state flower?"
    answer: "The Forget-Me-Not (Myosotis alpestris) is Alaska's official state flower."
  
  - question: "When did Alaska adopt the Forget-Me-Not as its state flower?"
    answer: "Alaska adopted the Forget-Me-Not on April 28, 1917, while still a U.S. territory. The flower kept its official status when Alaska became a state in 1959."
  
  - question: "Why did Alaska choose the Forget-Me-Not?"
    answer: "Alaska chose the Forget-Me-Not because of its widespread abundance throughout the territory. Women's groups and school children participated in the selection. They favored this hardy wildflower that thrives in Alaska's extreme climate and represents the state's rugged character."
  
  - question: "Where does the Forget-Me-Not grow naturally?"
    answer: "The Forget-Me-Not grows throughout Alaska in alpine meadows, along streams, and across tundra regions. It thrives from sea level to elevations exceeding 10,000 feet. Plants prefer areas with moist soil conditions near water sources."
  
  - question: "Is the Forget-Me-Not native to Alaska?"
    answer: "Yes, the Forget-Me-Not is native to Alaska and grows naturally throughout the state. It has adapted to Alaska's short growing season and extreme climate conditions over thousands of years."

