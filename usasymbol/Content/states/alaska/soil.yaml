name: Tanana Soil Series
adopted_year: ~
is_official: false
meaning: "The Tanana soil is built from layers of silty loess and river alluvium carried down from Alaska's mountains and deposited over thousands of years on the flat terraces of the interior. What makes it unlike any other state soil in the country is what lies beneath: permafrost — ground that has stayed frozen for thousands of years and never thaws. That frozen layer shapes the landscape, controls what can be built, determines which plants can grow, and has defined life in interior Alaska since long before statehood."
meaning_title: Meaning of the Tanana Soil Series
meaning_after_section: history
author: USA Symbol Team
date_published: "2025-12-02"
date_modified: "2026-05-24"
seo_title: "Alaska State Soil | Tanana Series"
seo_description: "The Alaska state soil is the Tanana series. It covers an estimated 3 to 5 million acres and supports white spruce, black spruce, and paper birch forests."
