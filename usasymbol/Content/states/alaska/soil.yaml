faq:
- question: What is Alaska's state soil?
  answer: "Alaska's state soil is the Tanana series, a permafrost-bearing soil found on the river flats and low terraces of interior Alaska. It is recognized by the USDA Natural Resources Conservation Service as Alaska's representative state soil. The Alaska Legislature has not yet passed a formal law to make it official."
- question: Why is it called Tanana soil?
  answer: "The Tanana series is named after the Tanana River in interior Alaska. Tanana comes from an Athabaskan word meaning 'mountain river.' The series was first established in the Yukon-Tanana Region of Alaska in 1914."
- question: What color is Tanana soil?
  answer: "The surface organic layer is dark brown to black. Below that, the silty loess layers are olive brown. Deeper still, the alluvial and permafrost layers are gray. The frozen permafrost layer at the bottom stays gray and solid year-round."
- question: Where is Tanana soil found in Alaska?
  answer: "Tanana soil is found in the interior lowlands of Alaska, mainly in the Greater Fairbanks area and surrounding river valleys. It occurs in the Fairbanks North Star Borough, Denali Borough, and the Yukon-Koyukuk and Southeast Fairbanks Census Areas."
- question: What grows in Tanana soil?
  answer: "In its natural state, Tanana soil supports aspen, paper birch, white spruce, and black spruce. When the land is cleared and the permafrost is allowed to thaw, it can support hay, pasture grass, small grains, and vegetables."
- question: Who chose Tanana as Alaska's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Tanana series to represent Alaska. The Alaska Legislature has not yet passed a formal law to make it official."
- question: How deep is Tanana soil before hitting permafrost?
  answer: "The surface organic layers are about 5 inches deep. Below that, silty and sandy alluvial layers extend to roughly 25 inches — the depth where permanently frozen permafrost begins. The frozen layer continues to 72 inches or deeper."

