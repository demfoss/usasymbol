type: State Tree
state: Alaska
name: Sitka Spruce
scientific_name: Picea sitchensis
adopted_year: 1962
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Alaska State Tree | Sitka Spruce"
seo_description: 'Alaska chose Sitka spruce in 1962, a coastal rainforest tree tied to Native carving traditions, timber, and wartime aircraft wood.'

intro_text: "Alaska adopted the Sitka Spruce as its state tree in 1962. The species was chosen for its dominance in Alaska's coastal rainforests and its long importance to the state's timber history and Pacific coast landscape."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Alaska"
    paragraphs:
      - "Alaska recognizes the Sitka Spruce as its official state tree. This evergreen conifer grows 150 to 200 feet tall along Alaska's coast, with exceptional specimens exceeding 220 feet. The trunk measures four to eight feet in diameter at breast height, though ancient trees in protected coves can reach ten feet. These massive dimensions made Sitka spruce Alaska's premier timber species through the 20th century. The wood's exceptional strength-to-weight ratio proved crucial during World War II when Sitka spruce supplied material for aircraft construction. More warplanes were built from Sitka spruce than any other wood during the war years."
      - "The bark appears thin and scaly, flaking off in irregular patches. The color ranges from gray to purplish-brown on mature trees. Sharp, stiff needles surround the twigs on all sides. Each needle measures half an inch to one inch long, bright green on one side with prominent white bands underneath. The needles feel distinctly prickly when grasped. Cones hang from upper branches, measuring two to four inches long. These papery cones with thin, flexible scales distinguish Sitka spruce from other Alaska conifers, which produce heavier, woodier cones."
      - "Sitka spruce grows exclusively along Alaska's Pacific coast, concentrated in Southeast Alaska's temperate rainforest. The species thrives from sea level to about 2,000 feet elevation in the Alexander Archipelago, along the Alaska Panhandle, and west to Kodiak Island and the Kenai Peninsula. These coastal forests receive 80 to 200 inches of annual precipitation, creating the moisture-rich environment Sitka spruce requires. The tree tolerates salt spray and coastal exposure better than competing species. Alaska's Tongass National Forest contains the world's largest remaining intact Sitka spruce temperate rainforest ecosystem, covering 17 million acres of Southeast Alaska."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Sitka Spruce"
    paragraphs:
      - "The common name is Sitka Spruce, named after Sitka, Alaska, where Russian naturalists documented the species in the late 1700s. The scientific name is Picea sitchensis. Picea is Latin for spruce. Sitchensis refers to Sitka, establishing the tree's strong Alaska connection through its scientific name. This species belongs to the Pinaceae family, the pine family."
      - "Alaska Natives have used various names for this tree in their languages. The Tlingit people call it shéiyi or ts'ík'. These names appear in traditional stories about forest resources and canoe construction. Early Alaska loggers called it tideland spruce because it grows right to the saltwater edge in many locations. The wood industry uses the designation Sitka spruce specifically to distinguish this premium species from other spruces like white spruce or Engelmann spruce found in Alaska's interior forests."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Sitka Spruce Became the Alaska State Tree"
    paragraphs:
      - "Alaska adopted the Sitka Spruce as its official state tree on February 28, 1962. The Alaska Legislature passed the designation three years after Alaska gained statehood in 1959. The selection reflected Alaska's desire to establish symbols that represented the new state's distinctive character. No public vote determined the choice—legislators selected Sitka spruce based on the tree's economic importance and prominence in Alaska's coastal forests. The timing came as Alaska worked to define its character as America's 49th state."
      - "Alaska picked Sitka spruce because it represented the backbone of the state's timber industry. Southeast Alaska's logging operations depended almost entirely on Sitka spruce and western hemlock, with spruce providing the highest-value timber. The species grows faster and larger in Alaska than anywhere else in its range. Alaska's cool, moist coastal climate produces Sitka spruce with exceptional wood qualities—tight grain, high strength, and excellent acoustic properties. These characteristics made Alaska spruce valuable for applications from construction lumber to musical instruments. The timber industry employed thousands of Southeast Alaskans through sawmills, logging camps, and pulp mills."
      - "The tree's role in World War II influenced its cultural significance by 1962. During the war, Sitka spruce from Alaska and the Pacific Northwest built thousands of military aircraft. The wood's strength-to-weight ratio exceeded any available alternative for aircraft frames. Alaska spruce helped win the war, a fact that resonated with Alaskans who remembered that contribution. The tree also was important for Alaska Native cultures. Tlingit, Haida, and Tsimshian peoples carved Sitka spruce into totem poles, dugout canoes, and house posts for centuries. Choosing Sitka spruce honored both indigenous heritage and modern economic history while selecting a tree that grew nowhere else in America with such dominance, much like [the Alaska state flag](/states/alaska/flag/alaska-state-flag) anchors flag imagery."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Alaska State Tree Facts"
    facts:
      - "Alaska adopted Sitka Spruce on February 28, 1962, three years after achieving statehood in 1959"
      - "Sitka spruce is the world's third-tallest conifer species, exceeded only by coast redwood and Douglas-fir"
      - "The tree grows faster in Alaska than anywhere else in its range, sometimes adding two feet of height annually in youth"
      - "World War II aircraft manufacturers used more Sitka spruce than any other wood, with Alaska forests supplying substantial quantities"
      - "Alaska's Tongass National Forest contains the world's largest remaining Sitka spruce temperate rainforest at 17 million acres"
      - "The tree can live 500 to 700 years, with some ancient specimens estimated at 800 years old"
      - "Sitka spruce tolerates salt spray better than any other large conifer, growing right to Alaska's shorelines"
      - "Alaska Native peoples carved Sitka spruce into totem poles, canoes, and house posts, with some totem poles still standing after 150 years"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Alaska State Tree and Flower"
    paragraphs:
      - "Alaska's state flower is the Forget-me-not (Myosotis alpestris), designated in 1949. The state adopted its floral symbol 13 years before selecting the Sitka spruce. Both the Sitka Spruce and Forget-me-not represent Alaska's native flora adapted to cool climates; see [Alaska's state flower page](/states/alaska/flower/forget-me-not) for the flower timeline. The tiny blue forget-me-not carpets alpine meadows and tundra areas across Alaska each summer. Sitka spruce towers in coastal rainforests along the Pacific shore. These species occupy vastly different Alaska habitats—the spruce in sea-level forests receiving 200 inches of rain, the forget-me-not in windswept mountain meadows above tree line. Together they capture Alaska's ecological diversity from coastal temperate rainforest to Arctic tundra."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize an Alaska Sitka Spruce"
    paragraphs:
      - "The bark provides consistent identification features throughout the year. Sitka spruce bark appears thin and scaly, flaking off in small irregular plates. The color shows gray to purplish-brown. Unlike the thick bark with deep furrows of many conifers, Sitka spruce maintains relatively thin bark even on ancient trees. This thin bark makes the species vulnerable to fire, though Alaska's wet coastal climate rarely produces forest fires. The bark often supports extensive moss and lichen growth in Alaska's humid environment, sometimes covering the trunk completely with green vegetation."
      - "The needles offer definitive identification. Each needle grows individually from the twig rather than in bundles. The needles project from all sides of the twig, creating a bottlebrush appearance. Each needle measures half an inch to one inch long, bright green on one side with two prominent white stomatal bands underneath. The needles feel stiff and sharp—grasping a Sitka spruce branch produces a distinctly prickly sensation. This sharpness distinguishes Sitka spruce from hemlock, which shares Alaska forests but has softer, flatter needles. The needles remain on the tree for seven to ten years before dropping, maintaining dense year-round foliage."
      - "The overall form shows a narrow conical crown tapering to a pointed top. Lower branches sweep downward and then curve upward at the tips, creating a layered appearance. Forest-grown trees develop long, straight trunks with minimal taper, highly valued for lumber. Trees growing along Alaska's exposed coastlines show flagged crowns where salt spray kills branches on the windward side, leaving growth only on the protected leeward side. This flagging creates one-sided crowns that indicate prevailing wind direction. Mature trees often show massive buttressed trunk bases spreading wide for stability in Alaska's soft, wet forest soils."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Alaska State Tree Symbolizes"
    paragraphs:
      - "The Sitka Spruce reflects Alaska's coastal character and connection to temperate rainforest ecosystems. Its towering height represents the scale of Alaska's wilderness and the ancient forests that defined Southeast Alaska before modern development. The tree's importance to both Native cultures and modern timber economy symbolizes continuity between traditional and contemporary Alaska. For many Alaskans, Sitka spruce forests represent the lush, green contrast to popular images of Alaska as frozen tundra. The species proves that Alaska contains surprising ecological diversity, a perspective reinforced by [States That Border Alaska](/states/alaska/borders). Conservation debates over Tongass National Forest logging reflect ongoing tensions between timber harvest and wilderness preservation that shape modern Alaska politics and character."
      - "From a national comparison angle, Alaska's forest scale is frequently analyzed in [U.S. states by land area](/rankings/geography/states-by-land-area)."

faq:
  - question: "What is the Alaska state tree?"
    answer: "The Sitka Spruce (Picea sitchensis) is Alaska's official state tree, adopted by the Alaska Legislature on February 28, 1962."
  
  - question: "What is the Alaska state tree called?"
    answer: "Alaska's state tree is called the Sitka Spruce, named after Sitka, Alaska. The scientific name is Picea sitchensis. Alaska loggers called it tideland spruce because it grows to the saltwater edge."
  
  - question: "When was the Alaska state tree adopted?"
    answer: "Alaska adopted the Sitka Spruce as its official state tree on February 28, 1962, three years after Alaska achieved statehood in 1959."
  
  - question: "Why is the Sitka Spruce Alaska's state tree?"
    answer: "Alaska chose the Sitka Spruce because it was the state's most important timber species and dominated Southeast Alaska's coastal rainforests. The tree grows faster and larger in Alaska than anywhere else in its range. During World War II, Sitka spruce supplied material for aircraft construction due to its exceptional strength-to-weight ratio. The species also held cultural importance for Alaska Native peoples who carved it into totem poles and canoes. Its prominence in Alaska's Tongass National Forest and economic value made it the clear choice."
  
  - question: "What is the Alaska state tree name?"
    answer: "The name is Sitka Spruce, after Sitka, Alaska where Russians first documented it in the late 1700s. The scientific name is Picea sitchensis. The Tlingit people call it shéiyi or ts'ík'."
  
  - question: "Where does the Alaska state tree grow?"
    answer: "The Sitka Spruce grows exclusively along Alaska's Pacific coast, concentrated in Southeast Alaska's temperate rainforest. It thrives from sea level to about 2,000 feet elevation in the Alexander Archipelago, Alaska Panhandle, and west to Kodiak Island and the Kenai Peninsula. The tree grows in areas receiving 80 to 200 inches of annual precipitation. Alaska's Tongass National Forest contains the world's largest Sitka spruce rainforest at 17 million acres."
  
  - question: "What are some facts about the Alaska state tree?"
    answer: "The Sitka Spruce was adopted February 28, 1962. It's the world's third-tallest conifer species at 150 to 200 feet. It grows faster in Alaska than anywhere else in its range. World War II aircraft used more Sitka spruce than any other wood. The Tongass National Forest contains the world's largest Sitka spruce rainforest at 17 million acres. Trees can live 500 to 700 years. It tolerates salt spray better than any other large conifer."
  
  - question: "How do you recognize the Alaska state tree?"
    answer: "Look for thin, scaly bark that flakes in irregular plates, colored gray to purplish-brown. Needles are stiff, sharp, and prickly, growing individually around twigs in a bottlebrush pattern. Needles are bright green on one side with two white bands underneath. Cones are papery, two to four inches long with thin flexible scales. The tree grows 150 to 200 feet tall with a narrow conical crown. Coastal trees show flagged crowns where salt spray kills windward branches."

