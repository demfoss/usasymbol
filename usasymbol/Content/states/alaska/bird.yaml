title: Willow Ptarmigan
scientific_name: Lagopus lagopus
adopted_year: 1955
legislation: AS 44.09.060; Ch. 1 SLA 1955
meaning: Alaska's bird symbol is unusually exact in law. The state kept the territorial-era name Alaska Willow Ptarmigan and even the older subspecies wording instead of reducing the symbol to a shorter common label.
author: USA Symbol Team
date_published: '2025-11-23'
date_modified: "2026-05-02"
seo_title: "Alaska State Bird | Willow Ptarmigan"
seo_description: Alaska adopted the Willow Ptarmigan in 1955. The unusual part is that Alaska law still keeps the fuller territorial-era name Alaska Willow Ptarmigan.
intro_text: Alaska's state bird is the <strong>Willow Ptarmigan</strong>, chosen in <strong>1955</strong> through a territory-wide schoolchildren's contest — four years before Alaska became a state. The territorial act named it the <strong>Alaska Willow Ptarmigan</strong>, preserving a fuller name and subspecies wording that Alaska law still carries today. When statehood came in 1959, the designation transferred without revision.
