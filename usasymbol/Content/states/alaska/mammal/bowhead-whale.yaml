faq:
  - question: "What is Alaska's state marine mammal?"
    answer: "Alaska's state marine mammal is the bowhead whale (Balaena mysticetus), designated in 1983 by the 13th Legislature."

  - question: "Why did Alaska choose the bowhead whale?"
    answer: "Alaska chose the bowhead whale because it is the only large whale that lives its entire life in Arctic waters, making it uniquely tied to the state. The bowhead also holds deep cultural significance for the Inupiat peoples of northern Alaska, who have hunted it for over two thousand years. The designation honored both Alaska's Arctic landscape and its Native heritage."

  - question: "Is the bowhead whale endangered?"
    answer: "Yes, the bowhead whale is still listed as endangered under the federal Endangered Species Act. However, the Bering Sea population is recovering and has grown from fewer than 2,000 whales in the 1970s to an estimated 10,500 today. The population is increasing at about 3 percent per year."

  - question: "Can you hunt bowhead whales in Alaska?"
    answer: "Subsistence hunting of bowhead whales continues in Alaska under a quota jointly managed by the Alaska Eskimo Whaling Commission and the International Whaling Commission. Only residents of the 11 recognized Inupiat and Siberian Yupik whaling villages may participate. The annual quota allows roughly 60 to 70 strikes per year, divided among these communities for food and cultural purposes."

  - question: "Where can I see bowhead whales in Alaska?"
    answer: "The best place to see bowhead whales is near Kaktovik on Barter Island during the fall migration in late August and September. Utqiagvik (Barrow) and Point Hope also offer viewing opportunities during spring and fall migrations. These locations are remote and require advance planning, but local guides are available."

  - question: "How big is a bowhead whale?"
    answer: "Bowhead whales can grow up to 60 feet long and weigh over 120,000 pounds. Their heads alone make up about one-third of their body length. A layer of blubber up to 1.5 feet thick insulates them from Arctic cold."

  - question: "What is Alaska's state land mammal?"
    answer: "Alaska's state land mammal is the moose (Alces alces), designated in 1998. Together with the bowhead whale, Alaska's two mammal symbols represent the state's land and marine ecosystems."

  - question: "How long do bowhead whales live?"
    answer: "Bowhead whales are among the longest-lived mammals on Earth. Some individuals are believed to exceed 200 years of age. Scientists have found old harpoon tips in bowhead whales that date back to the late 1800s, confirming their extraordinary lifespan."

