title: "Bowhead Whale"
scientific_name: "Balaena mysticetus"
adopted_year: 1983

seo_title: "Alaska State Marine Mammal: Bowhead Whale (Official 1983 Designation)"

seo_description: "The bowhead whale is Alaska’s state marine mammal, designated in 1983. Discover the history of this 200-year-living Arctic giant and its cultural significance."

intro_text: "The **bowhead whale** (Balaena mysticetus) is the official state marine mammal of Alaska, designated by the legislature in 1983, and a central entry in the [list of U.S. state marine mammals](/symbols/marine-mammals). As the only baleen whale that resides year-round in Arctic waters, the bowhead represents the endurance of Alaska's marine ecosystems. It was chosen to honor the **Inupiat and Siberian Yupik** cultures, which have maintained a subsistence and spiritual relationship with this species for over 2,000 years."

common_name: "Bowhead Whale"
official_since: "1983"
status: "Endangered (federally listed under the Endangered Species Act; population recovering)"
habitat_in_state: "Bering Sea, Chukchi Sea, Beaufort Sea; lives near sea ice year-round"
known_for: "Symbolizing Inupiat cultural heritage and Alaska's Arctic marine ecosystem"

size: "Up to 60 feet in length"
weight: "Over 120,000 pounds (60 tons)"
coloration: "Dark gray to black body with white or light gray patches on the chin and lower jaw"
distinctive_traits: "Massive head (one-third of body length), thick blubber up to 1.5 feet deep, V-shaped blow spout, no dorsal fin, can break through sea ice with its head"

habitat: "Arctic and subarctic waters along the sea ice edge; Bering, Chukchi, and Beaufort Seas"
range_in_state: "Migrates annually from the northern Bering Sea through the Chukchi Sea past Point Barrow to summer grounds in the Beaufort Sea and back"
conservation_status: "Listed as endangered under the Endangered Species Act since 1973; Bering Sea population recovering at approximately 3 percent per year; current estimate around 10,500 whales"
where_to_find: "Kaktovik (fall migration, August-September); Utqiagvik (Barrow) during spring and fall migration; Point Hope during spring migration"
symbol_connections: "The bowhead whale connects to Alaska's state seal, which features a fish and two seals representing marine wildlife and the seafood economy. Alaska's state quarter shows a grizzly bear with a king salmon, linking land and sea resources. The bowhead and the moose (state land mammal, 1998) together represent Alaska's most important land and marine species."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Alaska Legislature designated the bowhead whale as the official state marine mammal in 1983 through action of the 13th Legislature. The law is codified in Alaska Statutes Title 44, Chapter 09, Section 075."
      - "The designation came during a period of growing concern about Arctic whale populations. Just six years earlier, in 1977, the International Whaling Commission had threatened to ban Inupiat subsistence whaling entirely after a flawed population count suggested fewer than 2,000 bowheads remained."

    subsections:
      - subtitle: "Recognizing Inupiat Heritage"
        text: "Alaska's choice of the bowhead whale reflected the species' central role in Native Alaskan life. The Inupiat people of northern and western Alaska had hunted bowhead whales for over two thousand years. In 1977, when outside regulators threatened to end that tradition, Inupiat whaling captains organized the Alaska Eskimo Whaling Commission to protect their rights. The state mammal designation three years later acknowledged the importance of that fight and the cultural traditions at stake."

      - subtitle: "Why the Bowhead Was Chosen"
        text: "Alaska selected the bowhead over other whale species because it is the only large whale that spends its entire life in Arctic waters. The bowhead lives near sea ice from birth to death, making it uniquely tied to Alaska's landscape. No other state in the country could claim this species as its own. The bowhead also represented a conservation story—a whale that had been nearly destroyed by commercial hunters and was slowly coming back."

  - id: "state-symbolism"
    title: "What the Bowhead Whale Represents"
    style: "highlight"
    paragraphs:
      - "The bowhead whale stands for Alaska's identity as an Arctic state. Of all whale species on Earth, only the bowhead lives its entire life among sea ice. That loyalty to the frozen north mirrors Alaska's own place as the most remote and northern state in the union and aligns with [The Last Frontier nickname](/states/alaska/nickname/the-last-frontier)."
      - "For the Inupiat and Siberian Yupik peoples of coastal Alaska, the bowhead is not just food or a resource. It is the center of culture, spirituality, and community survival. The Inupiat name for the bowhead is agviq, and elders say that the whale and the people cannot live without each other."
      - "Selecting an endangered species as a state symbol was a statement of values. Alaska declared that protecting Arctic wildlife and honoring Native traditions were part of the state's identity."

    subsections:
      - subtitle: "Center of Inupiat Culture"
        text: "Eleven villages along Alaska's northern and western coast participate in the annual bowhead whale hunt. The hunt is far more than a food source. Whaling captains earn deep respect for their knowledge of ice, weather, and whale behavior. After a successful hunt, entire communities gather to share the meat and maktak (skin and blubber). The Nalukataq festival in Point Hope celebrates the hunt with feasting, traditional dancing, and the blanket toss. These traditions have continued for generations and remain the foundation of Inupiat identity today."

      - subtitle: "A Story of Recovery"
        text: "Commercial whaling ships from New England arrived in Alaska's Arctic waters in the 1840s. By the early 1900s, they had reduced the bowhead population from an estimated 18,000 to dangerously low numbers. The species was listed as endangered in 1973 under the Endangered Species Act. Since then, the Bering Sea population has slowly recovered, growing at about 3 percent each year. Today roughly 10,500 bowhead whales swim these waters. The bowhead's comeback represents one of the more successful marine conservation stories in American history."

      - subtitle: "The 1977 Crisis and Inupiat Resistance"
        text: "In 1977, the International Whaling Commission used flawed survey data to conclude the bowhead population was critically low. The IWC moved to ban all bowhead hunting, including the subsistence hunts that Inupiat communities depended on for food and cultural survival. Inupiat whaling captains, led by figures like Harry Brower of Barrow, formed the Alaska Eskimo Whaling Commission on September 1, 1977. They challenged the science, funded their own research, and negotiated with the IWC until subsistence hunting was restored. This effort became one of the first times Alaska Native communities used organized political action to defend their way of life."

      - subtitle: "Shared Ecosystem with the Polar Bear"
        text: "The bowhead whale and the polar bear share a visible connection in communities like Kaktovik. After the annual hunt, whale bones and scraps are left on a bone pile near shore. Each fall, dozens of polar bears gather to feast on these remains. Tourists travel to Kaktovik specifically to watch the bears at the bone pile. This scene captures the bowhead's role not just as a symbol on paper but as a living part of Alaska's Arctic food web."

  - id: "identification"
    title: "How to Identify Bowhead Whales"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Bowhead whales are massive, rounded animals built for life in cold water. Their heads make up about one-third of their total body length—larger in proportion than any other whale. A layer of blubber up to 1.5 feet thick keeps them warm in Arctic temperatures that would kill most marine mammals."
        list_items:
          - "**Size**: Up to 60 feet long"
          - "**Weight**: Over 120,000 pounds (60 tons)"
          - "**Color**: Dark gray to black with white or light patches on the chin and lower jaw"
          - "**Distinguishing features**: Enormous head, no dorsal fin, V-shaped blow spout, thick rounded body"

      - subtitle: "Behavior and Diet"
        text: "Bowhead whales are slow swimmers that feed by filtering enormous amounts of water through baleen plates in their mouths. They eat mostly zooplankton—tiny shrimp-like creatures less than an inch long. Bowheads can break through sea ice up to two feet thick using the strength of their heads. They are also among the longest-lived mammals on Earth, with some individuals believed to exceed 200 years of age."

  - id: "in-the-state"
    title: "Bowhead Whales in Alaska"
    style: "default"

    paragraphs:
      - "Alaska is home to the Bering-Chukchi-Beaufort Sea stock of bowhead whales, the only population that regularly uses these waters. Every spring, bowheads migrate north from the Bering Sea through leads in the ice along the Chukchi coast, past Point Barrow, and into summer grounds in the Beaufort Sea. They reverse the route each fall."
      - "The population has grown steadily since protections began. An estimated 18,000 bowheads once swam these waters before commercial whaling. The count dropped to fewer than 2,000 by the 1970s. Today the population stands at roughly 10,500 and continues to increase, while demographic pressure around U.S. coasts can be compared in [U.S. states by population](/rankings/demographics/states-by-population)."

    facts:
      - "**Spring migration**: Bowheads move north through the Chukchi Sea from April through June, passing villages like Point Hope, Wainwright, and Barrow"
      - "**Summer grounds**: Beaufort Sea and Amundsen Gulf in Canada, July through August"
      - "**Fall migration**: Whales return south through the Beaufort and Chukchi Seas, September through November"
      - "**Population**: Approximately 10,500 whales, recovering at about 3 percent per year"

  - id: "where-to-see"
    title: "Where to See Alaska's State Marine Mammal"
    style: "default"

    paragraphs:
      - "Bowhead whales live in remote Arctic waters far from most tourist destinations. Seeing them in the wild requires travel to Alaska's North Slope. Late August through September offers the best opportunity, during the fall migration."

    list_items:
      - "**Kaktovik**: A small Inupiat village on Barter Island in the Beaufort Sea; bowheads pass close to shore during fall migration; the village also attracts polar bears to its whale bone pile, making it a popular wildlife destination"
      - "**Utqiagvik (Barrow)**: Alaska's northernmost city; bowheads migrate past during both spring and fall; local guides can arrange viewing trips onto the ice or by boat"
      - "**Point Hope**: One of the oldest continuously inhabited settlements in North America; whaling traditions here stretch back thousands of years; bowheads pass during the spring migration"
      - "**Alaska Department of Fish and Game Virtual Viewing**: ADF&G offers satellite tracking maps online showing real-time bowhead whale locations along their migration route"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "The bowhead whale remains listed as endangered under the federal Endangered Species Act and as depleted under the Marine Mammal Protection Act. Despite these listings, the Bering Sea population is one of the few whale stocks in the world that is clearly growing, especially across routes tied to [States That Border Alaska](/states/alaska/borders)."
      - "Subsistence hunting continues under a quota managed jointly by the Alaska Eskimo Whaling Commission and the International Whaling Commission. The annual quota allows for roughly 60 to 70 strikes per year, shared among 11 Inupiat and Siberian Yupik whaling villages."

    subsections:
      - subtitle: "Cooperative Management"
        text: "Since 1981, the Alaska Eskimo Whaling Commission has worked directly with the National Marine Fisheries Service to manage the bowhead hunt. This model of co-management blends Inupiat traditional knowledge with Western science. Whaling captains contribute observations about whale behavior, ice conditions, and migration timing that scientists would not be able to gather on their own. The system has become a model for how indigenous communities and government agencies can share responsibility for wildlife management."

      - subtitle: "Threats to Bowhead Whales"
        text: "Climate change poses the most significant long-term threat to bowhead whales. As Arctic sea ice shrinks, the ecosystem these whales depend on shifts in unpredictable ways. Offshore oil and gas development in the Bering and Beaufort Seas raises concerns about noise pollution disrupting whale communication and migration. Oil spills could contaminate both the whales and their zooplankton food supply. Killer whales, which rarely entered ice-covered waters in the past, are appearing more frequently as ice retreats."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Alaska's state seal features a fish and two seals around its outer ring, representing the importance of marine wildlife and the seafood economy. The bowhead whale belongs to this same marine world. Together, the seal's imagery and the state marine mammal tell a unified story about Alaska's relationship with its oceans."
      - "The state quarter, issued in 2008, depicts a grizzly bear catching a king salmon with the North Star above. The salmon is Alaska's state fish. This image connects land and sea—the same pairing represented by the moose (state land mammal) and the bowhead whale (state marine mammal), detailed on [Alaska's moose page](/states/alaska/mammal/moose)."

    subsections:
      - subtitle: "The Moose and the Bowhead"
        text: "Alaska designated the moose as its state land mammal in 1998, fifteen years after the bowhead whale received its designation. The two species represent Alaska's two great ecosystems. The moose inhabits the vast forests and river valleys of the Interior and Southcentral regions. The bowhead whale roams the frozen Arctic seas of the North Slope. Together they cover Alaska's full geographic range—from the boreal forests to the edge of the ice."
        link:
          label: "See Alaska state land mammal"
          url: "/states/alaska/mammal/moose"

      - subtitle: "State Motto and Arctic Identity"
        text: "Alaska's state motto, \"North to the Future,\" adopted in 1967, captures the state's forward-looking identity. The bowhead whale reinforces this message. By choosing a species that was recovering from near-extinction, Alaska declared that the future of its Arctic wilderness mattered. The motto and the state marine mammal together reflect a commitment to preserving what makes Alaska different from every other state."
        link:
          label: "See Alaska state motto"
          url: "/states/alaska/motto/north-to-the-future"

