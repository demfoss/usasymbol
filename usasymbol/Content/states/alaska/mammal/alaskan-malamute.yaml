faq:
  - question: "What is Alaska's state dog?"
    answer: "Alaska's state dog is the Alaskan Malamute (Canis lupus familiaris), designated in 2010 when Governor Sean Parnell signed House Bill 14 into law."

  - question: "Why did Alaska choose the Alaskan Malamute?"
    answer: "Alaska chose the Alaskan Malamute because it is one of the oldest dog breeds on Earth, with roots in Alaska stretching back roughly 5,000 years. The breed was named after the Mahlemut Inuit people of northwestern Alaska. Students at Polaris K-12 School in Anchorage researched several breeds and selected the Malamute for its unmatched history in the state—from helping Native peoples survive to hauling gold during the Gold Rush to serving in two world wars."

  - question: "How did the Alaskan Malamute become the state dog?"
    answer: "A kindergartner named Paige Hill at Polaris K-12 School in Anchorage started the idea in 2007. Over three years, students researched dog breeds, chose the Malamute, and worked with Representative Berta Gardner to pass House Bill 14. The bill was signed by Governor Sean Parnell on May 12, 2010, with over 400 students, teachers, and parents in attendance."

  - question: "Is the Alaskan Malamute different from a Siberian Husky?"
    answer: "Yes. The Alaskan Malamute is significantly larger and heavier than the Siberian Husky. Malamutes were bred to pull heavy loads over long distances, while Huskies were bred for speed in shorter races. Malamutes also have a thicker coat, a broader head, and a larger build. The two breeds look similar but serve very different purposes."

  - question: "What is the connection between the Alaskan Malamute and the Iditarod?"
    answer: "The Iditarod Trail Sled Dog Race was inspired by the 1925 Serum Run, when sled dog teams—including Alaskan Malamutes—carried life-saving medicine 674 miles from Nenana to Nome. The Iditarod follows much of that original route each spring. Dog mushing is Alaska's official state sport, making it a direct companion to the state dog designation."

  - question: "Where can I see Alaskan Malamutes in Alaska?"
    answer: "The Iditarod Trail Sled Dog Race Headquarters in Wasilla is a great starting point. The ceremonial start of the Iditarod each March in Anchorage draws thousands of spectators and showcases working sled dogs. Dog mushing tours are available across Alaska, where visitors can meet and sometimes ride behind teams of Malamutes."

  - question: "What is Alaska's state sport?"
    answer: "Alaska's state sport is dog mushing, designated in 1972. The Iditarod Trail Sled Dog Race is the most famous event in the sport and is closely connected to the Alaskan Malamute's heritage as a working sled dog."

  - question: "Did Alaskan Malamutes serve in the military?"
    answer: "Yes. During World War I, 450 Alaskan Malamutes were shipped to France to deliver supplies to isolated mountain outposts for the French army. In World War II, they served as freight haulers, pack animals, search-and-rescue dogs, and mine sniffers for the U.S. military."

