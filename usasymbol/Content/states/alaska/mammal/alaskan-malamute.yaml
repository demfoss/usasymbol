title: "Alaskan Malamute"
scientific_name: "Canis lupus familiaris"
adopted_year: 2010

seo_title: "Alaska State Dog: Alaskan Malamute | History & Facts"

seo_description: "The Alaskan Malamute became Alaska's official state dog in 2010. Explore the 5,000-year history of this ancient breed and its role in Alaska's Native heritage."

intro_text: "The **Alaskan Malamute** (Canis lupus familiaris) is the official state dog of Alaska, designated on April 18, 2010, and a cornerstone breed in the [list of U.S. state dogs](/symbols/dogs). Named after the Mahlemut (now Kuuvangmiut) people of northwestern Alaska, it is one of the oldest Arctic sled dog breeds, with roots dating back approximately 5,000 years. Unlike the faster Siberian Husky, the Malamute was bred for strength and endurance, serving as the 'freight train' of the North."

common_name: "Alaskan Malamute"
official_since: "2010"
status: "Domestic breed; one of the oldest Arctic sled dog breeds, recognized by the American Kennel Club since 1935"
habitat_in_state: "Found throughout Alaska; historically bred along the shores of Kotzebue Sound in northwestern Alaska"
known_for: "Symbolizing Alaska's Native heritage, the endurance required to survive in the Arctic, and the tradition of dog mushing"

size: "23 to 25 inches tall at the shoulder"
weight: "Males: 75-100 pounds; Females: 75-85 pounds"
coloration: "Gray and white, black and white, red and white, or sable and white; white muzzle markings common"
distinctive_traits: "Thick double coat up to two inches deep, large plume-like tail carried over the back, erect ears, broad head, wolf-like appearance with a softer expression"

habitat: "Originally bred along Kotzebue Sound in northwestern Alaska; now found statewide as working and companion dogs"
range_in_state: "Historically concentrated in the Norton Sound and Kotzebue Sound regions of western Alaska; today kept throughout the state"
conservation_status: "Domestic breed; nearly disappeared during the Gold Rush era due to crossbreeding; restored through purebred breeding programs in the 1920s and formally recognized by the AKC in 1935"
where_to_find: "Iditarod Trail Sled Dog Race Headquarters in Wasilla; dog mushing tours and demonstrations across Alaska; Anchorage parks and recreation areas where mushers train year-round"
symbol_connections: "The Alaskan Malamute connects directly to Alaska's state sport—dog mushing, designated in 1972. The Iditarod race, Alaska's most famous sporting event, was inspired by the 1925 Serum Run in which Malamutes participated. The breed also pairs with the bowhead whale (state marine mammal) and moose (state land mammal) to represent Alaska's relationship with its animals—both wild and domesticated."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Sean Parnell signed House Bill 14 into law on May 12, 2010, making the Alaskan Malamute Alaska's official state dog. The law is codified in Alaska Statutes Title 44, Chapter 09, Section 140."
      - "Over four hundred students, teachers, and parents attended the signing ceremony in Anchorage. The event marked the end of a three-year campaign that began as a kindergarten classroom idea and grew into an entire school's project."

    subsections:
      - subtitle: "A Kindergartner's Big Idea"
        text: "The push began in 2007 when a kindergartner named Paige Hill at Polaris K-12 School in Anchorage asked why Alaska did not have an official state dog. Teachers Terry Powers, Jamie Rodriguez, and Carol Bartholomew guided students through a multi-year study comparing several dog breeds. Two first-grade classes researched the options and selected the Alaskan Malamute. They then asked Representative Berta Gardner to carry the bill on their behalf."

      - subtitle: "Why the Malamute Won"
        text: "Students chose the Alaskan Malamute over other breeds, including the Siberian Husky, for one clear reason: history. The Malamute is one of the oldest dog breeds on Earth, with roots stretching back roughly 5,000 years in Alaska. No other breed could match that depth of connection to the state. As student Paige Hill told the House State Affairs Committee in 2009, they picked the Malamute partly because it is big like Alaska and because it is a hard-working dog like the people of Alaska."

  - id: "state-symbolism"
    title: "What the Alaskan Malamute Represents"
    style: "highlight"
    paragraphs:
      - "The Alaskan Malamute represents endurance, loyalty, and partnership between humans and animals in one of the harshest environments on Earth. For thousands of years, these dogs and the people they lived with depended on each other to survive, a living expression of [The Last Frontier nickname](/states/alaska/nickname/the-last-frontier)."
      - "The breed's name itself tells a story. The Mahlemut were an Inuit people who settled along the shores of Kotzebue Sound in northwestern Alaska, within the Arctic Circle. European explorers who reached Alaska in the 1700s and 1800s noted that the Mahlemut kept their dogs in unusually good condition—better than most Arctic peoples. That care produced the breed's famously gentle and social temperament."
      - "Choosing the Malamute as a state symbol acknowledged something most Americans do not know: Alaska's history was built on dogs long before it was built on gold, oil, or timber."

    subsections:
      - subtitle: "Partners, Not Just Dogs"
        text: "The Mahlemut did not simply use dogs as tools. Dogs and people lived together, worked together, and survived together. Malamutes hauled heavy supply sledges loaded with food and gear. They helped hunters track caribou and kept watch for polar bears. When parents left on hunts, Malamutes stayed behind to watch over children. This deep bond between people and dogs—stretching back thousands of years—is what the state symbol honors."

      - subtitle: "Opening Alaska to the World"
        text: "When the Klondike Gold Rush began in 1896, prospectors flooded into Alaska and the Yukon in search of fortune. Getting supplies to remote mining claims was nearly impossible without dogs. Alaskan Malamutes became essential to the rush. A single good Malamute could sell for $500, and a small team for $1,500—enormous sums at the time. These dogs hauled equipment over mountain passes and carried mail to settlements that no road or rail could reach. They helped open Alaska for settlement and development."

      - subtitle: "Service in Two World Wars"
        text: "During World War I, the Nome Kennel Club shipped 450 Alaskan Malamutes to France. French troops in remote mountain outposts had been cut off from supplies, and the dogs tackled the harsh mountain conditions with ease, delivering needed provisions. In World War II, Malamutes served the American military as freight haulers, pack animals, search-and-rescue dogs, and mine sniffers. The military attempted to train them as guard dogs, but the breed was too friendly with strangers to pass that test."

      - subtitle: "Exploring the Poles"
        text: "Between 1909 and 1956, Alaskan Malamutes contributed to some of the most famous polar expeditions in history. They joined the teams of explorers Robert Peary, Roald Amundsen, and Richard Byrd on journeys to the South Pole. These expeditions required dogs that could haul heavy supply sleds for weeks without breaking down. Malamutes were built exactly for that job. The successful exploration of Antarctica could not have been accomplished without them."

  - id: "identification"
    title: "How to Identify Alaskan Malamutes"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Alaskan Malamutes are large, powerful dogs with a wolf-like appearance and a surprisingly gentle expression. Their thick double coat—up to two inches deep—insulates them against temperatures well below zero. A plume-like tail carried over the back is one of the breed's most recognizable features."
        list_items:
          - "**Size**: 23-25 inches tall at the shoulder"
          - "**Weight**: Males 75-100 pounds; Females 75-85 pounds"
          - "**Color**: Gray and white, black and white, red and white, or sable and white"
          - "**Distinguishing features**: Broad head, erect ears, thick plume tail, wolf-like face with a softer expression than a wolf"

      - subtitle: "Built for Endurance, Not Speed"
        text: "The Alaskan Malamute is the largest of the Arctic sled dog breeds, but it was never designed to race. Unlike the smaller Siberian Husky, which was bred for speed, the Malamute was bred to pull heavy loads over very long distances. A team of Malamutes can pull over a thousand pounds. Their paw pads are wide and tough, built to grip packed snow without slipping."

  - id: "in-the-state"
    title: "Alaskan Malamutes in Alaska"
    style: "default"

    paragraphs:
      - "Alaskan Malamutes have lived in Alaska longer than any other dog breed in the world. Their ancestors arrived with the first human settlers in the Arctic thousands of years ago. Today the breed remains an active working dog in Alaska and a popular companion throughout the state."
      - "The breed nearly disappeared during the Gold Rush era. Newcomers crossbred Malamutes with smaller, faster dogs to create racing teams. By the early 1900s, purebred Malamutes were rare. Breeders in remote areas of Alaska worked through the 1920s to restore the original bloodline. The American Kennel Club formally recognized the breed in 1935."

    facts:
      - "**Origins**: Bred by the Mahlemut Inuit people along Kotzebue Sound in northwestern Alaska, roughly 5,000 years ago"
      - "**Near extinction**: Nearly lost as a pure breed during the Gold Rush due to crossbreeding with faster racing dogs"
      - "**AKC Recognition**: Officially recognized as a distinct breed in 1935"
      - "**Today**: Used in recreational mushing, weight-pulling competitions, and as family companions across Alaska"

  - id: "where-to-see"
    title: "Where to See Alaska's State Dog"
    style: "default"

    paragraphs:
      - "Alaskan Malamutes are easier to find than most state animals. Alaska has a long tradition of dog mushing, and many communities hold public events where visitors can meet working sled dogs."

    list_items:
      - "**Iditarod Trail Sled Dog Race Headquarters, Wasilla**: The official museum and visitor center for Alaska's most famous sled dog race; exhibits cover the history of dog mushing and the 1925 Serum Run; Malamutes are among the breeds showcased"
      - "**Anchorage parks and trail systems**: Year-round training is common in Anchorage-area parks, where mushers exercise dogs on trails; visitors often encounter working dog teams during winter months"
      - "**Iditarod Race Start, Anchorage (March)**: Each spring, the Iditarod begins with a ceremonial start in downtown Anchorage before the official restart in Willow; thousands of spectators line the streets to see sled dogs up close"
      - "**Dog mushing tours**: Several companies across Alaska offer guided tours where visitors can meet, pet, and sometimes ride behind teams of sled dogs, including Malamutes"

  - id: "current-status"
    title: "Current Status"
    style: "default"
    paragraphs:
      - "The Alaskan Malamute is a healthy, thriving domestic breed found throughout the United States and Alaska. The American Kennel Club consistently ranks it among the most popular large dog breeds in the country, including high-interest northern regions reflected in [U.S. states by population](/rankings/demographics/states-by-population)."
      - "In Alaska specifically, the breed remains connected to its working heritage. Recreational mushing continues as both a sport and a cultural tradition. The Alaskan Malamute Club of America, founded in 1935, works to maintain breed standards and promote responsible ownership."

    subsections:
      - subtitle: "Mushing as Living History"
        text: "Dog mushing was designated Alaska's official state sport in 1972—thirty-eight years before the Malamute became the state dog. The Iditarod Trail Sled Dog Race, run every March from Anchorage to Nome, follows much of the route used during the 1925 Serum Run. While modern racing teams use lighter, faster mixed-breed dogs, the Alaskan Malamute remains a symbol of the tradition. Some recreational mushers still run purebred Malamute teams in weight-pulling and long-distance events, and the endurance theme aligns with [Alaska's state motto](/states/alaska/motto/north-to-the-future)."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Alaskan Malamute connects most directly to Alaska's state sport. Dog mushing was designated the official state sport in 1972, and the Malamute is the oldest and most historically significant breed in that tradition. The state dog and the state sport tell the same story from two angles, and they visually pair well with [the Alaska state flag](/states/alaska/flag/alaska-state-flag)."
      - "Alaska's state quarter, issued in 2008, features a grizzly bear catching a king salmon—two animals that represent the wild side of Alaska. The Malamute represents a different but equally important relationship: the partnership between Alaskans and the animals they relied on to survive, alongside [Alaska's state land mammal, the moose](/states/alaska/mammal/moose), and [the state marine mammal, the bowhead whale](/states/alaska/mammal/bowhead-whale)."

    subsections:
      - subtitle: "A Symbol of Alaska’s Wilderness"
        text: "The moose is the largest member of the deer family and one of the most recognizable animals in Alaska. Found across forests, wetlands, and river valleys, moose are well adapted to the state’s harsh climate and long winters. Their size, strength, and ability to thrive in remote landscapes make the moose a natural symbol of Alaska’s vast wilderness and frontier spirit. In 1998, it was officially designated as the state land mammal following a student-led campaign."
        link:
          label: "See Alaska land mammal"
          url: "/states/alaska/mammal/moose"

      - subtitle: "Land, Sea, and the Dogs Between"
        text: "Alaska has three animal symbols that together cover the state's full range. The moose (state land mammal, 1998) represents Alaska's vast wilderness and interior forests. The bowhead whale (state marine mammal, 1983) represents the Arctic seas and Inupiat cultural heritage. The Alaskan Malamute (state dog, 2010) represents the human connection to both worlds—the dogs that made it possible for people to live, travel, and survive across Alaska's enormous landscape."
        link:
          label: "See Alaska state marine mammal"
          url: "/states/alaska/mammal/bowhead-whale"

