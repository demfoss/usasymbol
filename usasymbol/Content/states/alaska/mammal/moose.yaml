faq:
  - question: "What is Alaska's state land mammal?"
    answer: "Alaska's state land mammal is the moose (Alces alces), designated in 1998 when Governor Tony Knowles signed Senate Bill 265 into law."

  - question: "When was the moose designated as Alaska's state land mammal?"
    answer: "The moose became Alaska's official state land mammal on May 1, 1998, when Governor Tony Knowles signed SB 265. The law took effect on July 29, 1998."

  - question: "Why did Alaska choose the moose as its state land mammal?"
    answer: "Alaska chose the moose because it is the largest member of the deer family and the most visible large animal across the state. Elementary students from Kalifornsky Beach School on the Kenai Peninsula campaigned for the designation. The moose also represents Alaska's indigenous survival traditions, as Athabascan and other peoples have relied on moose for food, clothing, and tools for thousands of years."

  - question: "Where can I see moose in Alaska?"
    answer: "Moose are easy to spot in many parts of Alaska. Denali National Park and the Kenai Peninsula are popular viewing areas. Moose also regularly appear in Anchorage's greenbelt parks and along Interior Alaska highways. The Alaska Wildlife Conservation Center near Copper Center offers close-up viewing year-round."

  - question: "How big are Alaska's moose?"
    answer: "Alaska is home to the largest moose subspecies in the world, Alces alces gigas. Adult males can weigh up to 1,600 pounds, stand nearly 7 feet tall at the shoulder, and grow antlers spanning over 6 feet wide."

  - question: "Does Alaska have other official mammals?"
    answer: "Yes, Alaska also designated the bowhead whale as the official state marine mammal. Together, the moose and bowhead whale represent Alaska's land and sea ecosystems."

  - question: "Is the moose on Alaska's flag or seal?"
    answer: "No, the moose does not appear on Alaska's flag or state seal. The flag features the Big Dipper constellation, which represents Ursa Major, the Great Bear — another symbol connected to Alaska's wildlife and wilderness identity. The state seal focuses on Alaska's industries, including mining, transportation, and agriculture."

  - question: "How many moose live in Alaska?"
    answer: "Alaska has an estimated 175,000 moose, the largest moose population in North America. Over 7,000 are harvested each year through managed hunting and subsistence use."

