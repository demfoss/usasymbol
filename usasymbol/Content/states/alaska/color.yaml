sections:
  - id: "official-designation"
    title: "Alaska State Colors History"
    style: "default"
    paragraphs:
      - "Alaska has no law that names official state colors. Blue and gold are traditional colors that grew out of the state flag adopted in 1927, and they have stayed in use ever since."
      - "The University of Alaska system also publishes its own blue and gold specifications, which helps keep the shades fairly consistent across the state."
  - id: "symbolism"
    title: "What Alaska Blue and Gold Mean"
    style: "highlight"
    paragraphs:
      - "Blue stands for the Alaskan sky and for the forget-me-not flower. Gold stands for the North Star, the midnight sun and the mineral wealth of the state."
      - "Together they sum up the far north in two colors, from the long summer light to the stars that guide travelers at night."
  - id: "state-emblems"
    title: "Where Alaska Colors Appear"
    style: "default"
    paragraphs:
      - "The clearest place to see blue and gold is the Alaska state flag. They also show up in state branding, official insignia and the colors of the University of Alaska system."
