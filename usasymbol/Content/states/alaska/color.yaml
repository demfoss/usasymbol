sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Alaska does not have officially legislated state colors designated by a separate statute. However, the colors blue and gold have become the de facto state colors through their prominent use on the Alaska state flag, which was adopted on May 2, 1927, while Alaska was still a territory, and retained upon statehood in 1959. The flag features eight gold stars arranged as the Big Dipper and Polaris (the North Star) on a field of deep blue sky, as codified in Alaska Statute 44.09.010, and this legal continuity complements [Alaska's state motto](/states/alaska/motto/north-to-the-future)."
      - "The flag's design was created by 13-year-old Benny Benson of Chignik, Alaska, who won a territorial flag design contest in 1927. His entry was selected from 142 submissions by schoolchildren across the territory. Benson's written description specified 'blue for the Alaska sky and the forget-me-not, an Alaskan flower' and 'gold for the future State of Alaska and the valuable mineral it stores.' These two colors have since unified Alaska's governmental and cultural visual identity."
    subsections:
      - subtitle: "The 1927 Flag Design Contest"
        text: "The Alaska Territory held an official flag design contest in 1927 open to all students in grades 7 through 12. Benny Benson, a seventh-grade student of Swedish and Alutiiq descent, submitted the winning design from the Jesse Lee Home Mission School in Seward. The territorial legislature adopted his design by passage of the Alaska Flag Act on May 2, 1927. When Alaska achieved statehood on January 3, 1959, the flag design was retained unchanged and codified into Alaska state law."
      - subtitle: "Statehood and Codification"
        text: "Upon Alaska's admission to the Union as the 49th state, the blue-and-gold flag was formally incorporated into Alaska Statute 44.09.010, which describes the flag as 'eight gold stars in a field of blue.' The statute does not specify precise Pantone or HEX values, but the University of Alaska system and state government agencies have standardized PMS 281 for the blue field and PMS 116 for the gold stars in official print and digital communications."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "The blue and gold color combination carries profound geographic and cultural meaning rooted in Alaska's natural environment. Blue directly references two elements specific to Alaska: the vast, clear Alaskan sky that dominates the state's dramatic landscape, and the forget-me-not (Myosotis alpestris), which became the official state flower in 1917 and is documented on [Alaska's flower page](/states/alaska/flower/forget-me-not). Gold references Polaris, the North Star that has guided Arctic navigators and Indigenous peoples for centuries, as well as the mineral wealth that has defined Alaska's economic history from the Klondike Gold Rush through modern resource development."
    subsections:
      - subtitle: "Blue in Alaska History"
        text: "The selection of blue as the dominant field color for the Alaska flag was a deliberate choice by designer Benny Benson to capture the essence of Alaska's geography. The deep navy blue of PMS 281 evokes the midnight sky visible during Alaska's long winters, the color of glacier-fed lakes, and the petals of the forget-me-not. The forget-me-not was already an established symbol of Alaska by 1927, having been adopted as the territorial flower a decade earlier by the Alaska Pioneer Women's Association in 1917."
      - subtitle: "Gold in Alaska History"
        text: "The gold color in Alaska's flag carries a dual symbolism with deep historical resonance. Most prominently, gold represents Polaris (the North Star), which holds special navigational and cultural significance in Arctic regions. Equally important is the reference to Alaska's mineral wealth: the Klondike Gold Rush of 1896-1899 transformed Alaska and the Yukon into a world-famous destination and is a cornerstone of the state's economic and cultural identity. The bright, warm tone of PMS 116 gold also evokes the midnight sun, the remarkable phenomenon of continuous summer daylight unique to Alaska's high-latitude geography."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "The blue and gold colors appear on the Alaska state flag, which flies over all state government buildings and is displayed at official state functions. The Alaska state seal, adopted in 1913, uses a broader palette including green for forests and white for snow, but the state flag's blue and gold remain the primary colors associated with Alaska's official identity. These colors are incorporated into Alaska state highway signage, the University of Alaska system's branding across all three campuses (Fairbanks, Anchorage, and Southeast), and official state tourism marketing materials. The Alaska Department of Education and Early Development maintains the flag's specifications for use in educational settings throughout the state, including context around [The Last Frontier nickname](/states/alaska/nickname/the-last-frontier)."
      - "At a national level, Alaska's visual identity is often compared with other large states in [U.S. states by land area](/rankings/geography/states-by-land-area)."

