faq:
  - question: "What are the official colors of Alaska?"
    answer: "Alaska's traditional state colors are Blue and Gold, derived from the state flag adopted in 1927. Blue represents the Alaskan sky and the forget-me-not flower; gold represents the North Star and the state's mineral wealth."
  - question: "What is the HEX code for Alaska Blue?"
    answer: "The standard HEX code for Alaska's state blue is #003087, corresponding to Pantone PMS 281, as used in state government and University of Alaska branding."
  - question: "What is the HEX code for Alaska Gold?"
    answer: "The standard HEX code for Alaska's state gold is #FFB81C, corresponding to Pantone PMS 116, representing the gold stars on the state flag."
  - question: "Who designed the Alaska state flag?"
    answer: "The Alaska state flag was designed by Benny Benson, a 13-year-old student of Swedish and Alutiiq descent from Chignik, Alaska, who won a 1927 territorial design contest with 142 entries."
  - question: "Why did Alaska choose blue and gold?"
    answer: "Blue was chosen to represent the Alaskan sky and the forget-me-not flower, while gold represents Polaris (the North Star) and Alaska's mineral wealth, as described by designer Benny Benson in his original 1927 submission."

