title: "Official and Traditional Colors of Alaska"
state: "Alaska"
adopted_year: null

seo_title: "Alaska State Colors: Official HEX Codes & Meaning"
seo_description: "Alaska state colors are Blue and Gold, drawn from the 1927 state flag. Find HEX, RGB, CMYK, and Pantone codes plus the history and meaning."

intro_text: "The traditional state colors of Alaska are **Blue** and **Gold**, derived from the Alaska state flag adopted in 1927. While not officially designated by a separate legislative act, these colors appear on [the Alaska state flag](/states/alaska/flag/alaska-state-flag) and throughout state branding and official insignia. Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Alaska colors accurately."

official_colors: "Blue and Gold"
official_since: "Traditional (based on 1927 state flag)"
primary_use: "State Flag, state branding, University of Alaska system colors"
known_for: "Blue representing the Alaskan sky and forget-me-not flower; gold representing the North Star, the midnight sun, and the state's mineral wealth"

