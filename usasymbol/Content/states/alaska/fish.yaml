- id: facts
  icon: fa-solid fa-lightbulb
  title: King Salmon Facts
  facts:
  - Adopted in 1962 by the Alaska Legislature.
  - Scientific name is Oncorhynchus tshawytscha.
  - The largest of all Pacific salmon, often about 36 inches long.
  - Has a black gum line and black spots on both halves of its tail.
  - The world record sport-caught king weighed 97 pounds, 4 ounces. It came from the Kenai River in 1985.
faq:
- question: What is Alaska's state fish?
  answer: Alaska's state fish is the king salmon, also called the Chinook salmon. The Alaska Legislature made it official in 1962.
- question: When did Alaska adopt the King salmon?
  answer: Alaska adopted the king salmon as its state fish in 1962.
- question: Why did Alaska choose the King salmon?
  answer: Official sources do not give a detailed reason. State lawmakers have said it is an important food for Alaska Native villages and a key fish for commercial and sport fishing.
- question: Is the king salmon the same fish as the Chinook salmon?
  answer: Yes. King salmon and Chinook salmon are two names for the same fish. Some people also call it blackmouth or tyee.
- question: How big can a king salmon get?
  answer: Most adults weigh more than 30 pounds. An angler caught a 97-pound king in the Kenai River in 1985. The heaviest one on record weighed 126 pounds and was caught near Petersburg in 1949.
