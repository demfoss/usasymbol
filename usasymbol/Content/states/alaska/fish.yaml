hero_image_caption: The king salmon, Alaska's state fish, is the largest of all Pacific salmon.
intro_text: Alaska's state fish is the king salmon, the largest of all Pacific salmon, adopted in 1962. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Alaska?
  paragraphs:
  - The king salmon is Alaska's official state fish. State lawmakers gave it this title in 1962. Its scientific name is Oncorhynchus tshawytscha.
  - Many people outside Alaska call it the Chinook salmon. Alaskans usually call it the king salmon or just a king.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the King Salmon
  paragraphs:
  - The king salmon is a big, thick-bodied fish. Adults are often about 36 inches long and often weigh more than 30 pounds.
  - In the ocean, it has a blue-green back, silver sides, and a white belly. Small black spots cover its back and both halves of its tail.
  - The easiest clue is its mouth. A king salmon has a black gum line, which is why some people call it the blackmouth.
  - When it swims up rivers to spawn, its color changes to red, copper, or dark gray.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Alaska Legislature made the king salmon the official state fish in 1962. This was only a few years after Alaska became a state in 1959.
  - Alaska law lists the king salmon with the state's other official emblems.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Alaska Chose the King Salmon
  paragraphs:
  - Official sources name the king salmon as the state fish but do not give a detailed reason.
  - State lawmakers have since called the fish an important food for Alaska Native villages. They also called it a key fish for commercial fishing and sport fishing.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the King Salmon
  paragraphs:
  - King salmon hatch in fresh water, spend years at sea, and then return to rivers to spawn.
  - The Kenai River on the Kenai Peninsula is famous for its very large kings. The nearby Kasilof River also has king salmon runs every year. The Copper River is known for some of the first fresh kings of the season.
