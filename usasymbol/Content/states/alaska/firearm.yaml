seo_title: "Alaska State Bolt-Action Rifle: The Pre-1964 Winchester Model 70"
seo_description: "Alaska's official state bolt-action rifle is the Pre-1964 Winchester Model 70, adopted in 2014 via Senate Bill 175. Learn about the 12 official calibers, the controlled round feed, and why pre-1964 matters in the Alaskan wilderness."

intro_text: "Alaska did not designate a **state firearm**. It designated an **official state bolt-action rifle** — a precise legal distinction that matters. Senate Bill 175, signed by Governor Sean Parnell in 2014, recognized the Pre-1964 Winchester Model 70 as the rifle that helped Alaskans \"establish a firm foothold in the untamed and often wild Alaska wilderness.\" The pre-1964 specification is not nostalgia. It is an engineering requirement — and the most technically specific designation on the [list of official state firearms](/symbols/firearms) in the United States."

sections:
  - id: "pre-1964-rule"
    icon: "fa-solid fa-gear"
    title: "The \"Pre-1964\" Rule: Controlled Round Feed vs. Push Feed"
    paragraphs:
      - "The Winchester Model 70 was introduced in 1936 and immediately earned a reputation as the most reliable bolt-action rifle available to American hunters. Gun writers called it 'The Rifleman's Rifle.' For nearly three decades, it was the benchmark against which every competing design was measured. Then, in 1964, Winchester changed it."
      - "The 1964 redesign was a cost-cutting exercise. Winchester replaced the pre-1964 controlled round feed (CRF) extractor — a large, strong claw that seized the cartridge rim the moment it left the magazine and never let go until ejection — with a cheaper push-feed design. In push-feed operation, the extractor only grabs the cartridge when it reaches the chamber. The bolt also lost its distinctive anti-bind geometry, and the checkering on the stock was replaced with pressed imitation checkering."
      - "For hunters in the lower 48, the push-feed change was a nuisance. For hunters in Alaska, it was potentially a life-or-death reliability downgrade. In controlled round feed, a cartridge that doesn't fully chamber can be extracted and ejected safely. In push-feed, the same situation can result in the cartridge slipping off the extractor and jamming — at exactly the moment reliability matters most. Alaska's legislature understood this when it wrote the pre-1964 specification directly into SB 175."

  - id: "crf-vs-push"
    icon: "fa-solid fa-arrows-left-right"
    title: "Controlled Round Feed vs. Push Feed: What the Difference Means"
    subsections:
      - subtitle: "Controlled Round Feed (Pre-1964)"
        text: "The extractor is a large, fixed claw machined into the bolt face. It grabs the cartridge rim the instant the round exits the magazine and maintains positive control throughout the entire feeding cycle — all the way to the chamber and back out on ejection. The result: zero chance of double-feeding, and reliable extraction even in extreme cold, dirt, or rapid cycling."

      - subtitle: "Push Feed (Post-1964)"
        text: "The extractor is a smaller, spring-loaded component that snaps over the cartridge rim only when the round reaches the fully-chambered position. It is mechanically simpler and cheaper to manufacture. It works reliably under normal conditions, but lacks the positive control of CRF during the feeding phase. In field conditions — freezing temperatures, mud, rushed cycling — the margin for malfunction is wider."

      - subtitle: "Why It Matters in Alaska Specifically"
        text: "Alaskan subsistence hunters and guides often face encounters with brown bears, grizzlies, or moose at close range in dense brush. A misfire or jam in that context has consequences that most hunters in the continental United States will never face. The controlled round feed is not a collector's preference in Alaska — it is a reliability specification that the legislature chose to enshrine in state law."

      - subtitle: "Winchester's Reversal"
        text: "Winchester eventually acknowledged the 1964 changes were a mistake. In 1992, the company reintroduced the controlled round feed design under the Model 70 Classic designation. Current production Winchester Model 70 rifles use CRF. But the law specifies pre-1964 production models — the originals — because their metallurgy, tolerances, and craftsmanship represent a standard that the legislation chose to honor specifically."

  - id: "legislation-sb175"
    icon: "fa-solid fa-scale-balanced"
    title: "Senate Bill 175: The Law Behind the Legend"
    subsections:
      - subtitle: "The Sponsor: Senator Cathy Giessel"
        text: "Alaska State Senator Cathy Giessel of Anchorage introduced Senate Bill 175 in the Alaska State Legislature. Giessel, a nurse by profession and longtime Alaskan, framed the bill around subsistence hunting culture and the practical demands of Alaska's wilderness environment — not gun-rights politics. The bill's language reflects that framing."

      - subtitle: "The Official Wording"
        text: "SB 175 designates the pre-1964 Winchester Model 70 bolt-action rifle as Alaska's official state bolt-action rifle. The text of the bill states directly that this was the rifle that helped Alaska men and women \"establish a firm foothold in the untamed and often wild Alaska wilderness\" — language that grounds the designation in functional history rather than symbolism."

      - subtitle: "The Legal Precision: 'State Bolt-Action Rifle'"
        text: "The bill does not designate a 'state firearm' in the broad sense used by Utah, Arizona, or Texas. It designates specifically a 'state bolt-action rifle' — a narrower, technically precise category. This distinction is legally and semantically significant: most aggregators, databases, and competitor websites classify Alaska's designation as a 'state firearm' and miss the specific action-type term entirely. The correct legal term is state bolt-action rifle, and the same wording discipline appears in [Alaska's motto history](/states/alaska/motto/north-to-the-future)."

      - subtitle: "Governor Sean Parnell's Signature"
        text: "Governor Sean Parnell signed SB 175 into law in 2014, making Alaska the fourth state to adopt an official state firearm designation (after Utah in 2011, Arizona in 2011, Indiana in 2012, the [Kentucky Long Rifle](/states/kentucky/firearm/kentucky-long-rifle) in 2013, Pennsylvania in 2014, and West Virginia in 2013). Alaska joined a small but growing category of states that have taken the legislative step of designating an official firearm."

  - id: "twelve-calibers"
    icon: "fa-solid fa-list-ol"
    title: "The 12 Official Calibers Listed in SB 175"
    paragraphs:
      - "Senate Bill 175 specifies the pre-1964 Winchester Model 70 in twelve named calibers. This list appears verbatim in the enrolled bill and defines the full legal scope of Alaska's designation."
    calibers_grid:
      - name: ".22 Hornet"
        description: "Small, flat-shooting varmint cartridge introduced in the early 1930s"
