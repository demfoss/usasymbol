  - id: "alaska-wilderness"
    icon: "fa-solid fa-mountain"
    title: "Built for the Alaska Wilderness: Subsistence, Survival, and the Model 70"
    paragraphs:
      - "Alaska covers 663,268 square miles — larger than the next three largest U.S. states combined. Much of it is accessible only by small aircraft, boat, or foot. In the bush communities of interior and western Alaska, hunting is not a sport or a hobby — it is subsistence. Moose, caribou, black bear, brown bear, and Dall sheep are food sources that many rural Alaska communities depend on for a significant share of their annual protein intake."
      - "In that context, the firearms carried by Alaskans are working tools selected for reliability under conditions that most hunters in the continental United States will never encounter: temperatures below -40°F, wet snow, river crossings, and the possibility of encountering a brown bear at any moment. A rifle that fails in Kansas is an inconvenience. A rifle that fails in the Alaska Range is a potential emergency."
      - "The Winchester Model 70 dominated Alaska's hunting culture for decades because it delivered exactly the combination those conditions demanded: a reliable controlled round feed action, availability in calibers appropriate for large and dangerous game, and a reputation for accuracy that was built on competitive shooting results as well as hunting performance. When the Alaska legislature chose an official state bolt-action rifle, the Model 70 was the answer that required no debate — as purposeful a choice as the [1847 Colt Walker pistol](/states/texas/firearm/1847-colt-walker) was for Texas Rangers a century and a half earlier, and this wilderness framing complements [States That Border Alaska](/states/alaska/borders)."

  - id: "comparison"
    icon: "fa-solid fa-arrows-left-right"
    style: "compare-cards"
    title: "Alaska's Survival Rifle vs. Other State Firearms"
    subsections:
      - subtitle: "Alaska vs. Arizona (Colt Single Action Army, 2011)"
        text: "Arizona designated a single-action revolver from 1873 to honor the frontier mythology of Tombstone and Wyatt Earp. Alaska designated a bolt-action rifle from 1936–1963 to honor the practical demands of wilderness survival. One is history as symbol; the other is symbol as tool. The philosophical contrast between the two designations could not be sharper."
        link:
          label: "See Arizona State Firearm"
          url: "/states/arizona/firearm/colt-single-action-army"

      - subtitle: "Alaska vs. Tennessee (Barrett M82, 2016)"
        text: "Tennessee's Barrett M82 is a military-grade .50 BMG semi-automatic rifle that celebrates contemporary manufacturing and industrial innovation in a living Tennessee company. Alaska's Model 70 is a discontinued pre-1964 production bolt-action that celebrates the craftsmanship of a specific manufacturing era. Tennessee looks forward; Alaska looks backward to a specific moment in industrial quality."
        link:
          label: "See Tennessee State Firearm"
          url: "/states/tennessee/firearm/barrett-m82"

      - subtitle: "Alaska vs. Utah (Browning M1911, 2011)"
        text: "Utah honored a designer — John Moses Browning, born in Ogden — with a pistol that bears his name. Alaska honored a use case: the needs of Alaskan hunters in wilderness conditions. The M1911 is a semi-automatic pistol; the Model 70 is a precision bolt-action rifle. The weapons serve entirely different purposes and represent entirely different approaches to what a state symbol should communicate."
        link:
          label: "See Utah State Firearm"
          url: "/states/utah/firearm/browning-m1911-pistol"

      - subtitle: "The Only State to Specify an Era of Manufacturing"
        text: "Alaska is the only state in the country whose official firearm designation specifies a manufacturing era rather than a model name alone. The 'pre-1964' qualifier has no equivalent among the other nine state firearm designations. It reflects a level of technical specificity that distinguishes Alaska's designation from all others — and signals that the legislation was written by people who actually knew the firearm in detail."

  - id: "where-to-see"
    icon: "fa-solid fa-location-dot"
    title: "Where to See Historical Firearms in Alaska"
    style: "default"
    subsections:
      - subtitle: "University of Alaska Museum of the North — Fairbanks"
        text: "Alaska's primary natural history and cultural museum. Collections include historical objects from the settlement and exploration periods — the tools, including firearms, that were central to life in Alaska's interior. Located on the UAF campus, open year-round."

      - subtitle: "Alaska State Museum — Juneau"
        text: "The official state museum covers Alaska history from the Russian colonial period through statehood. Its collections document the material culture — hunting tools, frontier equipment — of the territorial era that made the Winchester Model 70 the rifle of choice across the state."

