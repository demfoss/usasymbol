faq:
  - question: "What is the official state firearm of Alaska?"
    answer: "Legally, Alaska designated an official state bolt-action rifle — not a general 'state firearm.' The designation is specifically for the Pre-1964 Winchester Model 70, adopted via Senate Bill 175, signed by Governor Sean Parnell in 2014. The precise legal term is 'state bolt-action rifle.'"

  - question: "Why did Alaska specify the 'Pre-1964' model?"
    answer: "Pre-1964 Winchester Model 70 rifles feature a controlled round feed (CRF) extraction system — a large, fixed claw that maintains positive control of the cartridge from magazine exit to ejection. In 1964, Winchester switched to a cheaper push-feed design. In Alaska's extreme wilderness conditions, where reliability can be a survival matter, the pre-1964 CRF design is considered significantly more trustworthy. The legislature wrote the manufacturing era directly into the bill."

  - question: "What calibers are included in Alaska's state rifle law?"
    answer: "Senate Bill 175 lists 12 specific calibers: .22 Hornet, .220 Swift, .243 Winchester, .250-3000 Savage, .257 Roberts, .264 Winchester Magnum, .270 W.C.F., 7mm, .300 Savage, .30-06 Springfield, .300 H&H Magnum, and .300 Winchester Magnum. This list appears in the enrolled bill text and is not reproduced by most sources covering this designation."

  - question: "Who introduced and signed Alaska's state rifle bill?"
    answer: "Senate Bill 175 was introduced by State Senator Cathy Giessel of Anchorage. Governor Sean Parnell signed it into law in 2014."

  - question: "Why is the Winchester Model 70 called 'The Rifleman's Rifle'?"
    answer: "The nickname dates to the mid-20th century when gun writers and competitive shooters consistently rated the pre-1964 Model 70 as the most accurate and reliable bolt-action production rifle available. The controlled round feed action, precise tolerances, and trigger quality made it the reference standard for American bolt-action rifles for nearly three decades."

  - question: "What is controlled round feed and why does it matter?"
    answer: "Controlled round feed (CRF) means the bolt's extractor claw grabs the cartridge rim the instant it leaves the magazine and maintains that grip through the entire feeding and chambering cycle. In contrast, push-feed designs only grab the cartridge once it reaches the chamber. CRF provides more reliable extraction in adverse conditions — cold, mud, rapid cycling — which is why Alaskan hunters and guides strongly prefer it."

  - question: "Is the Pre-1964 Winchester Model 70 still available to buy?"
    answer: "Original pre-1964 Winchester Model 70 rifles are available on the used and collector market. They command premium prices due to their reputation. Winchester currently produces the Model 70 with a controlled round feed action (reintroduced in 1992 after collectors criticized the 1964 changes), but these are new-production rifles and not the pre-1964 originals that the Alaska statute specifically designates."

  - question: "How is Alaska's designation different from other state firearms?"
    answer: "Alaska is the only state that designates a specific manufacturing era rather than just a model name. The 'pre-1964' qualifier is unique among all 10 state firearm designations and reflects a technical specificity — the difference between controlled round feed and push feed extraction — that no other state legislature has written into law. Alaska also uses the precise legal term 'state bolt-action rifle' rather than the broader 'state firearm.'"

