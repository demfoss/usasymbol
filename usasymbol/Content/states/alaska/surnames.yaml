etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Smith, Miller, Taylor, and Clark are Alaska's occupational names, arriving with Gold Rush miners, territorial administrators, and cannery-era settlers rather than any single trade community."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Taylor (cutter of cloth)
      - Clark (clerk or literate official)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Alaska's top 20, blending broad English son-names like Williams, Davis, and Wilson with Scandinavian son-names like Johnson, Anderson, and Nelson tied to Petersburg and Kodiak's Norwegian fishing settlement."
    examples:
      - Johnson (son of John, also Norwegian Johan)
      - Williams (son of William)
      - Anderson (son of Anders)
      - Nelson (son of Niels)

  - type: Descriptive Names
    icon: fa-solid fa-palette
    description: "Brown and White both began as English physical descriptions, then took on a second Alaska-specific path when BIA officials assigned color surnames to Alaska Native families in Yukon-Kuskokwim Delta villages in the early 1900s."
    examples:
      - Brown (brown hair or complexion)
      - White (fair hair or complexion)

  - type: Habitational Names
    icon: fa-solid fa-house
    description: "Moore and Lee both began as English landscape names for people near open ground, and Lee carries a second meaning in Alaska as a common Chinese and Korean surname among Anchorage's Asian American community."
    examples:
      - Moore (near open moorland)
      - Lee (near a meadow, also a Chinese and Korean surname)

faq:
  - question: "What are the most common last names in Alaska?"
    answer: "The most common last names in Alaska are Smith, Johnson, Williams, Brown, and Jones."

  - question: "What is the most common last name in Alaska?"
    answer: "Smith is the most common last name in Alaska, appearing 5,800 times (about 1 in every 122 residents)."

