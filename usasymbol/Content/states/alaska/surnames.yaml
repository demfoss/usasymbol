seo:
  title: "Most Common Last Names in Alaska"
  description: "Alaska's most common last names include Smith and Johnson, plus Russian, Norwegian, and Filipino surnames rare in other states' top 50 lists."

page:
  h1: "Most Common Last Names in Alaska"
  intro: "Smith, Johnson, and Williams top Alaska's list — but Alaska is the only state where Russian Orthodox missionary surnames, Norwegian fishing names, and Filipino cannery surnames all rank in the top 50. The fingerprints of each wave are visible in the top 20."
  heritage_title: "Gold Rush, Russian Missionaries, and Norwegian Fishermen"
  heritage_body: "Under Russian rule (1741–1867), Orthodox missionaries required Alaska Natives to take Russian surnames at baptism, permanently embedding Petrov, Alexie, and similar names into Yup'ik and Alutiiq communities on the Yukon Delta and Kodiak Island. The 1898 Gold Rush stamped Skagway, Juneau, and Fairbanks with standard American names that now dominate the top 10. Norwegian settlers in Petersburg and Kodiak (1890s–1920s) then pushed Anderson and Nelson roughly 40 positions above their national rankings."
  fun_fact: "More Alaska Natives bear Russian surnames — Petrov, Alexie, Pavlov — than surnames from their own languages, a legacy of Russian Orthodox missionaries who required Christian surnames for baptism across roughly 200 coastal villages between 1795 and 1867."

surnames:
  - rank: 1
    name: Smith
    count: 5800
    ratio: 122
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Fairbanks land records from 1903 — the year of the city's founding on the Tanana River — show Smith among the top three surnames of the first claim holders, arriving with the Gold Rush without any single ethnic community driving it."

  - rank: 2
    name: Johnson
    count: 5000
    ratio: 142
    origin: scandinavian
    type: Patronymic
    meaning: "Son of John in English — and the most common Norwegian surname (from 'Johan'). Alaska's Johnson counts blend Scandinavian fishermen who dominated Petersburg and Kodiak's salmon industry between 1900 and 1940 with military families at Elmendorf AFB who arrived from the 1940s onward."

  - rank: 3
    name: Williams
    count: 4300
    ratio: 165
    origin: english
    type: Patronymic
    meaning: "Son of William — Norman 'Willahelm', will plus helm. Elmendorf AFB and Fort Richardson's expansion in the 1940s–1960s brought a disproportionately military-connected African American community to Anchorage, where Williams is the most common surname in that demographic."

  - rank: 4
    name: Brown
    count: 3700
    ratio: 192
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', brown hair or complexion. Brown spread through the Gold Rush and expanded further when BIA officials in the early 1900s assigned color surnames to Alaska Native families in Yukon-Kuskokwim Delta villages — one of the few top-10 names with both settler and administrative-assignment roots in Alaska."

  - rank: 5
    name: Jones
    count: 3400
    ratio: 209
    origin: english
    type: Patronymic
    meaning: "Son of John via Welsh 'Ioan'. Welsh-descended miners from Utah and Nevada who joined the 1898 Klondike rush brought Jones to Alaska; Juneau and Skagway land records — the two gateway towns — show it among the top 10 surnames of original claim holders."

  - rank: 6
    name: Anderson
    count: 3000
    ratio: 237
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders — one of the most common surnames across Norway and Sweden. Petersburg's Norwegian founder Peter Buschmann recruited almost exclusively from Kinn County in western Norway in 1897, and Anderson families followed within the decade, making it one of the founding surnames of southeast Alaska's commercial fishing industry."

  - rank: 7
    name: Miller
    count: 2800
    ratio: 254
    origin: english
    type: Occupational
    meaning: "From Old English 'mylenweard', a grain miller. Miller Creek — a tributary of Goldstream Creek north of Fairbanks — was named after a Gold Rush claim-holding family, and the surname appears consistently in Fairbanks mining records from 1903–1910."

  - rank: 8
    name: Davis
    count: 2600
    ratio: 273
    origin: english
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ' (beloved). Fort Davis — a decommissioned Army post near Nome built after the Spanish-American War — reflects the name's early federal footprint in western Alaska, reinforced by military families who arrived during the 1940s–1950s infrastructure boom."

  - rank: 9
    name: Wilson
    count: 2500
    ratio: 284
    origin: english
    type: Patronymic
    meaning: "Son of Will (William). Wilson spread through Alaska via cannery labor contractors in Seattle and Portland — Wilson families from Oregon and Washington were among the most common recruits shipped north to Kodiak, Ketchikan, and Bristol Bay in the early 1900s, and some settled permanently."

  - rank: 10
    name: Nelson
    count: 2500
    ratio: 284
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Niels — a Scandinavian form equivalent to Nicholas. Nelson's presence in Alaska's top 10 is almost entirely explained by Norwegian fishing communities in Petersburg, Sitka, and Kodiak, where it peaked alongside Anderson during the commercial fishing migration of 1900–1930."

  - rank: 11
    name: Taylor
    count: 2300
    ratio: 309
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a tailor. Taylor families appear in Juneau mining records from the 1880s during the Alaska-Juneau Gold Mine's early development — many were veterans of California and Nevada mining camps who followed gold north to the Klondike and Tanana Valley."

  - rank: 12
    name: Thomas
    count: 2100
    ratio: 338
    origin: english
    type: Patronymic
    meaning: "From Aramaic 'Tʼōmā', meaning twin. Where Russian Orthodox missionaries gave coastal Alaska Natives Russian surnames, Presbyterian missions in Tlingit and Haida communities at Wrangell, Kake, and Hydaburg introduced English patronymics — Thomas became one of the most widely adopted from the 1870s onward."

  - rank: 13
    name: Moore
    count: 2100
    ratio: 338
    origin: english
    type: Habitational
    meaning: "From Old English 'mōr', near open moorland. Moore appears in Sitka land records from the 1870s — carried by Irish-descended workers when Sitka was still the territorial capital and the only significant Euro-American settlement after the 1867 purchase from Russia."

  - rank: 14
    name: Thompson
    count: 1900
    ratio: 374
    origin: english
    type: Patronymic
    meaning: "Son of Thom, with 'p' inserted as a 15th-century spelling convention. Presbyterian missions in Tlingit communities along the Inside Passage — particularly Wrangell and Kake — introduced Thompson as a standard English patronymic, displacing clan-based naming systems from the 1870s onward."

  - rank: 15
    name: White
    count: 1900
    ratio: 374
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', white hair. White arrived through the Nome gold rush of 1899–1900 and spread further through BIA color-name assignments in the Yukon-Kuskokwim Delta — the same administrative practice that spread Brown in western Alaska."

  - rank: 16
    name: Harris
    count: 1800
    ratio: 394
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry (Germanic 'Heimirich'). Richard Harris, a Canadian prospector who co-discovered gold at Silver Bow Basin in 1880, is recognized as co-founder of Juneau — giving this already-common surname a founding-era resonance in Alaska's capital that sets it apart from its generic national profile."

  - rank: 17
    name: Clark
    count: 1700
    ratio: 418
    origin: english
    type: Occupational
    meaning: "From Latin 'clericus', a literate person. Clark clusters in Juneau and Sitka because both served as territorial capitals — the U.S. Army Signal Corps surveys of the 1880s–1890s and the civilian government that followed drew heavily on literate administrators from the Lower 48, making Clark nearly absent from rural Alaska Native communities."

  - rank: 18
    name: Martin
    count: 1700
    ratio: 418
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', of Mars. Catholic missionaries working along the Yukon River in the late 1800s assigned Martin to interior Alaska Native communities alongside Russian-origin surnames — reinforced by French-Canadian Hudson's Bay Company traders who had worked the Yukon drainage before the 1867 American purchase."

  - rank: 19
    name: Lewis
    count: 1600
    ratio: 444
    origin: english
    type: Patronymic
    meaning: "From Welsh 'Llywelyn' or Germanic 'Hlodwig'. Lewis entered Alaska through Welsh-descended Gold Rush miners and U.S. Army survey teams in the 1880s–1900s — several Tanana Valley geographic features carry the name from that mapping period."

  - rank: 20
    name: Lee
    count: 1600
    ratio: 444
    origin: english
    type: Habitational
    meaning: "From Old English 'lēah', near a meadow. Lee in Alaska has dual roots: Gold Rush-era English settlers and the Korean American community in Anchorage — where Lee/Yi is the most common surname — connected through Joint Base Elmendorf-Richardson and the University of Alaska Anchorage."

