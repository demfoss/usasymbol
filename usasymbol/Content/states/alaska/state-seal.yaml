seo_title: 'Great Seal of Alaska: Northern Lights, Smelter, and What Every Element Means'
seo_description: "Alaska's state seal shows the aurora borealis rising over mountains, forests, a smelter, a railroad, ships, and salmon — every industry that built the territory in 1910. Unlike most states, Alaska chose no mythological figures. Here's what every element on the Alaska state seal means."
