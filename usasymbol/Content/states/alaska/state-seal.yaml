hero_image_caption: The Great Seal of Alaska, originally designed in 1910 for the Alaska Territory. The northern lights arc over the mountains; below, the seal catalogs every major Alaskan industry in a single image.
intro_text: 'The Great Seal of Alaska catalogs the territory''s industries — aurora borealis, mining smelter, railroad, ships, fishing — with no mythology and no allegorical figures, just a working inventory of what Alaska was in 1910. When Alaska became the 49th state in 1959, the territorial seal passed directly into use unchanged.'
