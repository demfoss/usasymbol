faq:
- question: Who designed Alaska's state flag?
  answer: Benny Benson, a 13-year-old student living at the Jesse Lee Home for Children in Seward, designed Alaska's flag in 1927. He won a territory-wide contest with roughly 700 entries, sponsored by the Alaska Department of the American Legion.
- question: What do the stars on Alaska's flag represent?
  answer: Seven stars form the Big Dipper, representing strength through the Great Bear (Ursa Major). The eighth and largest star is Polaris, the North Star, representing Alaska's position as the northernmost state. Both meanings came from Benson's original design submission.
- question: Why stars instead of the northern lights or midnight sun?
  answer: Most of the 700 contest entries used the aurora borealis, midnight sun, polar bears, or the territorial seal. Benny Benson chose constellations he watched from his window at night — a simpler and more distinctive choice that stood out from the rest.
- question: What do the colors on Alaska's flag mean?
  answer: Navy blue represents both the Alaskan sky and the forget-me-not flower — two meanings Benson stated in his original submission. Gold is used for all eight stars. Alaska statute does not define exact color values.
- question: Has Alaska's flag changed since 1927?
  answer: No. The design has not been modified since it was adopted on May 2, 1927. When Alaska became a state in 1959, the legislature kept the territorial flag exactly as Benson designed it.
