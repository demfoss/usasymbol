name_meaning:
  heading: What Does Maine Mean?
  paragraphs:
  - Maine is the 23rd U.S. state, admitted to the Union on March 15, 1820 after separating from Massachusetts through the Missouri Compromise. The exact origin of the name Maine is usually treated carefully rather than reduced to one settled translation.
  - "The state's public identity is clearer than the name origin. Maine's existing symbol pages repeatedly return to the same core image: pine forests, a North Star, coastal work, and the motto Dirigo, meaning \"I lead\" or \"I direct.\""
  - Maine's postal abbreviation is ME, and residents are Mainers. Its best-known nickname is the Pine Tree State, a name reinforced by the state tree, state flower, flag, seal, and old lumber economy.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: The state name's exact origin is debated in historical accounts.
    - label: Statehood
      text: Maine became the 23rd state on March 15, 1820.
    - label: Identity marker
      text: Pine imagery is more firmly documented in the state's official symbols than any single name etymology.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Maine, the northern New England state shaped by forests, coast, shipbuilding, and borderland history.
    - label: People
      text: People from Maine are called Mainers.
    - label: Motto
      text: Dirigo connects Maine to the North Star and maritime navigation.
  - heading: Nicknames and Short Forms
    items:
    - label: Pine Tree State
      text: Widely recognized nickname tied to white pine forests and the lumber industry.
    - label: Down East
      text: Regional nickname connected with Maine's coastal geography.
    - label: Lumber State
      text: Older nickname from the logging economy.
    - label: Abbreviation
      text: ME; older short form Me.
editorial:
  heading: What Maine's Symbols Say About the State
  paragraphs:
  - Maine's [white pine](/states/maine/tree) is not just the state tree. Its cone and tassel are also the [state flower](/states/maine/flower), and the pine stands at the center of the [state flag](/states/maine/flag). Few states let one tree carry this much official weight.
  - "The [moose](/states/maine/mammal/moose) and [black-capped chickadee](/states/maine/bird) split Maine's wildlife image into two scales: the huge animal of northern forests and the small winter bird that stays close to everyday life."
  - "[Moxie](/states/maine/beverage/moxie) gives Maine a rare beverage symbol with attitude. It is not a generic farm product or polite refreshment; the bitter-sweet soft drink became official because it already sounded like Maine in one word."
faq:
- question: What is Maine's most famous state symbol?
  answer: The [eastern white pine](/states/maine/tree) is Maine's strongest symbol because it appears as the state tree, state flower material, flag imagery, seal imagery, and the basis of the Pine Tree State nickname.
- question: What is Maine's state bird?
  answer: Maine's state bird is the [black-capped chickadee](/states/maine/bird), adopted in 1927.
- question: Why is Maine's state flower a pine cone?
  answer: Maine chose the [white pine cone and tassel](/states/maine/flower) because white pine shaped the state's forests, lumber economy, and official identity more strongly than a conventional wildflower.
- question: What does Dirigo mean?
  answer: "[Dirigo](/states/maine/motto) is Latin for \"I lead\" or \"I direct.\" On Maine's seal and flag it works with the North Star as a navigation image."
- question: How many official state symbols does Maine have?
  answer: Maine's state symbols list here includes the flag, chickadee, pine cone and tassel, white pine, motto, colors, moose, Maine Coon, and Moxie.
