seo_description: "Maine symbols include the black-capped chickadee, white pine, moose, Dirigo motto, Pine Tree State nickname, and North Star flag."
snippet_answer: Maine's black-capped chickadee and eastern white pine are two of the state's most recognized official state symbols, with the pine appearing on the flag and anchoring the Pine Tree State identity. The moose, Maine Coon cat, Dirigo motto, and Moxie designation round out a list built on forests, maritime navigation, and local character.
