intro_text: Maine's state fish is the landlocked salmon, a silvery freshwater salmon of the state's cold lakes, adopted in 1969. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Maine?
  paragraphs:
  - The Maine Legislature made the landlocked salmon the official state fish in 1969. Its scientific name is Salmo salar sebago.
  - It is a freshwater form of the Atlantic salmon. Unlike its sea-run relatives, it never swims out to the ocean.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Landlocked Salmon
  paragraphs:
  - Adult landlocked salmon are mostly silver. They have a slightly forked tail and small X-shaped markings on the back and upper sides.
  - Most adults are 16 to 18 inches long and weigh 1 to 1.5 pounds, but fish of 3 to 5 pounds are not unusual.
  - During spawning season, adult males grow a hooked jaw called a kype. Anglers know the fish for its frequent acrobatic jumps out of the water.
  - Some people also call it the Sebago salmon or the ouananiche.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Maine Legislature added the landlocked salmon to state law as the official state fish in 1969. The fish has kept this title ever since.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Maine Chose the Landlocked Salmon
  paragraphs:
  - State law names the fish but does not give a reason. One historical record says it was chosen because it was plentiful in Maine's lakes and ponds.
  - The landlocked salmon is also native to Maine. Before 1868, it lived in only four of the state's river basins.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Landlocked Salmon
  paragraphs:
  - Landlocked salmon live in cold, deep lakes all over Maine. They first lived in only four river basins, the St. Croix, the Union, the Penobscot, and the Presumpscot.
  - Lakes in those basins still have the fish, including West Grand Lake, Green Lake, Sebec Lake, and Sebago Lake. Stocking has since spread the salmon to many more lakes.
