- id: facts
  icon: fa-solid fa-lightbulb
  title: Landlocked Salmon Facts
  facts:
  - Adopted in 1969 by the Maine Legislature.
  - Scientific name is Salmo salar sebago.
  - Adults usually grow 16 to 18 inches long.
  - The oldest landlocked salmon on record in Maine was 13 years old.
  - A 22.5-pound landlocked salmon was caught in Sebago Lake in 1907.
faq:
- question: What is Maine's state fish?
  answer: Maine's state fish is the landlocked salmon, a freshwater form of the Atlantic salmon. The Maine Legislature adopted it in 1969.
- question: When did Maine adopt the landlocked salmon?
  answer: The Maine Legislature made the landlocked salmon the official state fish in 1969.
- question: Why did Maine choose the landlocked salmon?
  answer: State law does not give a reason. One historical record says it was chosen because it was plentiful in Maine's lakes and ponds. It is also native to the state.
- question: Why is it called a landlocked salmon?
  answer: It spends its whole life in fresh water and never swims to the sea. Most Atlantic salmon are born in rivers but grow up in the ocean.
- question: What does a landlocked salmon look like?
  answer: It is mostly silver, with a slightly forked tail and small X-shaped marks on its back and upper sides. Adult males grow a hooked jaw in the fall.
