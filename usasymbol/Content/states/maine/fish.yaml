# verification: Partly confirmed. Maine law names the "landlocked salmon (Salmo salar Sebago)" as the state fish, and it was adopted in 1969. The starting record's year and designation are correct. The name follows the statute's wording ("landlocked salmon"), and the scientific name now includes the subspecies "sebago" that the statute and the state wildlife agency both use.
