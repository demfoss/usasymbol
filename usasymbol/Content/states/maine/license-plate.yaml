sections:
- id: vacationland-meaning
  icon: fa-solid fa-umbrella-beach
  title: What "Vacationland" Means on Maine Plates
  paragraphs:
  - '"Vacationland" is not subtle — it is a direct pitch from a state that needed tourists and knew it. Maine''s economy in the 1930s was struggling, and the legislature saw the license plate as free advertising that crossed state lines on every car leaving the state. Every plate that reached Massachusetts, New York, or beyond carried the word home with it.'
  - 'The phrase had currency before the plates used it. Tourism materials from as early as the 1880s marketed Maine''s coast and forests to summer visitors, and "Vacationland" or close variants appeared in promotional literature before the legislature committed the state to it. What the 1936 law did was fix that identity onto the most visible medium available: a piece of metal on every registered vehicle.'
  - 'Maine''s [state nickname](/states/maine/nickname) is the Pine Tree State, not Vacationland — but the plate slogan may be better known to out-of-state visitors than the official nickname. The two identities sit comfortably together: the forests that earned Maine the Pine Tree State label are part of what makes it a [vacation destination](/states/maine) in the first place.'

- id: legislative-debate
  icon: fa-solid fa-landmark
  title: The Senator Who Called It "Asinine"
  paragraphs:
  - 'Before "Vacationland" became one of the most recognized plate slogans in the country, it had to survive a 1935 Senate floor debate. Senator Roy Fernald was among those who objected, calling the proposal "an asinine proposition." His concern was about dignity: a state plate was an official document, not a roadside billboard.'
  - 'The argument did not hold. Supporters pointed out that license plates were already a public-facing medium and that the Depression had made tourist revenue a practical necessity. The measure passed, and plates bearing "VACATIONLAND" in all capitals went out the following year.'
  - 'The episode is a reminder that what now feels like an obvious choice was once genuinely contested. Maine had other options — the [Pine Tree State](/states/maine/nickname) label was available, and the [state motto Dirigo](/states/maine/motto) carried a different kind of gravity. "Vacationland" won because it was direct about what Maine wanted from the people reading the plate.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Maine License Plate Designs by Era
  paragraphs:
  - Maine has used one slogan across three distinct design eras. The word stayed the same; its format and the plate graphic changed with each major redesign.
  versions:
  - name: VACATIONLAND (all caps)
    years: 1936–1986
    image: /images/license-plates/maine/1936-vacationland-plate.jpg
    description: The slogan debuted in 1936 in block capitals at the plate's bottom edge, where it remained for fifty years. Plates changed color and material across those decades — including solid brass issues in 1946 and 1948 during postwar steel shortages, and a shift to aluminum in 1949 as brass costs rose — but "VACATIONLAND" in all caps was constant through every annual issue.
  - name: Vacationland (lobster graphic)
    years: 1987–1998
    image: /images/license-plates/maine/1987-vacationland-lobster.jpg
    description: Maine's 1987 redesign was the state's first graphic plate. A red lobster appeared on a retro-reflective white background, with the state name and "Vacationland" screened in red. For the first time in fifty years, the slogan appeared in sentence case rather than all capitals.
  - name: Vacationland (chickadee and pine, italicized)
    years: 1999–2025
    image: /images/license-plates/maine/1999-vacationland-chickadee.jpg
    description: The 1999 base design updated the plate graphic to imagery of the black-capped chickadee and white pine — Maine's [state bird](/states/maine/bird) and [state tree](/states/maine/tree) — and italicized "Vacationland" for the first time.
  - name: Vacationland (Pine Tree plate)
    years: 2025–present
    image: /images/license-plates/maine/2025-pine-tree-vacationland.png
    description: Maine began issuing a new Pine Tree standard plate in 2025 as the chickadee plate was retired from normal replacement. The design kept the "Vacationland" slogan, preserving the uninterrupted streak that began in 1936.

- id: longevity
  icon: fa-solid fa-rotate
  title: Why "Vacationland" Has Lasted Nearly Ninety Years
  paragraphs:
  - 'Most license plate slogans come and go. States rebrand, legislatures argue, and plates change. Maine''s "Vacationland" has not changed once since 1936 — only its capitalization and formatting have evolved. Part of the reason is that the claim remains accurate. Maine''s coast, lakes, forests, and Acadia National Park draw millions of visitors each year, and no competing phrase has emerged to displace it.'
  - 'Alaska''s [The Last Frontier](/states/alaska/license-plate) is the closest parallel: a state that chose a phrase describing a real, durable condition and has never needed to revise it. Both slogans describe something still literally true and immediately understood by anyone reading the plate for the first time.'
  - 'For context on how other states have handled their plate slogans, see the [U.S. license plate slogans by state](/license-plates) guide.'

timeline:
- year: '1905'
  description: Maine begins issuing motor vehicle registration plates — porcelain construction, no slogan.
- year: '1914'
  description: Maine adds annual year markers to plates, requiring reissuance each year.
- year: '1935'
  description: The Maine legislature debates adding "Vacationland" to the plate. Senator Roy Fernald calls the proposal "an asinine proposition"; the measure passes.
- year: '1936'
  description: '"VACATIONLAND" appears on Maine plates for the first time, in all capitals at the bottom of the plate. The slogan has not left since.'
- year: '1946'
  description: Maine issues solid brass plates for 1946 and some 1948 registrations due to postwar steel shortages. "VACATIONLAND" continues unchanged.
- year: '1949'
  description: Maine transitions to aluminum plates as brass costs rise. The slogan format remains the same.
- year: '1987'
  description: Maine introduces its first graphic plate — a red lobster on a retro-reflective white background. "Vacationland" appears in sentence case for the first time.
- year: '1999'
  description: A new base design updates the plate graphic to a chickadee and pine motif and italicizes "Vacationland."
- year: '2025'
  description: Maine begins issuing the new Pine Tree standard plate. The chickadee base is retired from ordinary replacement, but "Vacationland" remains on the standard plate.

faq:
- question: What is Maine's license plate slogan?
  answer: Maine's license plate slogan is "Vacationland," which has appeared on every plate issued by the state since 1936 — one of the longest unbroken slogan runs in the United States.
- question: When did Maine first use "Vacationland" on its plates?
  answer: '"Vacationland" first appeared on Maine license plates in 1936, approved by the legislature the previous year despite opposition from senators who considered it undignified.'
- question: Why does Maine say "Vacationland" on its license plates?
  answer: The slogan was adopted in 1936 as a Depression-era effort to attract tourists. Maine lawmakers saw the license plate as free advertising that traveled across state lines on every registered vehicle leaving the state.
- question: Has Maine ever changed its license plate slogan?
  answer: No. "Vacationland" has been the only slogan on Maine plates since 1936. The formatting has changed — all caps through 1986, sentence case from 1987, and italicized since 1999 — but the word itself has never been replaced.
- question: What does the Maine license plate look like?
  answer: The current Maine standard plate is the Pine Tree plate introduced in 2025, with "Vacationland" still appearing on the design. The previous 1999 base featured a black-capped chickadee and white pine imagery with "Vacationland" in italics, and the 1987 base showed a red lobster on a white background.
- question: What does "Vacationland" mean?
  answer: '"Vacationland" positions Maine as a premier destination for leisure and travel, drawing on its coast, forests, lakes, and Acadia National Park. Tourism materials used the concept as far back as the 1880s before it became official in 1936.'

