seo_title: 'Maine License Plate Slogan: Vacationland — History Since 1936'
seo_description: Maine's license plate slogan "Vacationland" has appeared continuously since 1936, making it one of the longest-running plate slogans in the country. Learn how it started, how the 1987 and 1999 bases changed its styling, and how the 2025 Pine Tree plate kept the streak alive.
hero_image: /images/license-plates/maine/2025-pine-tree-vacationland.png
hero_image_alt: Maine Pine Tree license plate with Vacationland slogan
hero_image_caption: Maine's new Pine Tree standard plate, issued beginning in 2025, keeps the long-running "Vacationland" slogan.
intro_text: '**"Vacationland"** is the only slogan Maine has ever put on its standard passenger plates, and it has appeared continuously since 1936 — an unbroken run of nearly nine decades. The word was not inevitable: a state senator called the idea "an asinine proposition" during the 1935 floor debate. It passed anyway, and what started as a Depression-era pitch to draw tourists became one of the most durable plate slogans in American history.'
quick_answer: '"Vacationland" has appeared on Maine license plates continuously since 1936 — one of the longest unbroken plate slogans in the U.S. The all-caps format ran through 1986; a 1987 redesign introduced sentence case alongside Maine''s lobster graphic; a 1999 update italicized the slogan on the chickadee base; and the 2025 Pine Tree standard plate kept the slogan.'
