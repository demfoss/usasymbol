type: State Seal
state: Maine
name: Great Seal of Maine
adopted_year: 1820
is_official: true
legislation: Maine Revised Statutes Title 1, § 201
meaning: "Maine's state seal centers on a white pine tree and a moose, flanked by a farmer with a scythe and a seaman with an anchor, with the North Star above and the motto Dirigo, Latin for \"I lead,\" on a ribbon below the star. Adopted in 1820 when Maine became the 23rd state, the seal encodes the state's economy, geography, and founding ambitions into a single circular image."
meaning_title: Great Seal of Maine Meaning
meaning_after_section: history
