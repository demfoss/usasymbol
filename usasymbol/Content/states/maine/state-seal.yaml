intro_text: "Maine's state seal shows a white pine tree and a moose on a central shield, flanked by a farmer with a scythe and a seaman with an anchor, with the North Star above and the motto Dirigo, meaning \"I lead,\" below it. Maine adopted this seal in 1820 when it separated from Massachusetts to become the 23rd state."
