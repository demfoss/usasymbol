sections:
  - id: history
    icon: fa-solid fa-landmark
    title: Maine State Seal History and Origin
    paragraphs:
      - "Maine had been a district of Massachusetts since the colonial period. In 1820, as Congress debated how to admit Missouri as a slave state without upsetting the free-slave balance, Maine's statehood was bundled into the deal. Congress admitted Maine as the 23rd state on March 15, 1820, as part of what became the Missouri Compromise."
      - "With statehood came the need for official symbols. The new state government designed a seal that captured what Maine was: a forested, agricultural, and maritime territory that had just asserted its independence from Massachusetts. The white pine, the moose, the farmer, the seaman, the North Star, and the motto Dirigo all reflected something specific about the state's economy and geography in 1820."
      - 'The North Star and Dirigo were not decorative choices. Maine was the northernmost New England state, with ports that depended on Atlantic navigation. A star that guided sailors and a motto meaning "I lead" both suited a state whose identity was bound to the sea and to the forests that supplied its shipbuilding industry.'

  - id: elements
    icon: fa-solid fa-shapes
    title: What the Maine State Seal Symbols Mean
    paragraphs:
      - "The seal divides Maine's identity into two categories: natural resources and the people who work them. The white pine and moose represent the forested interior; the farmer and seaman represent the two industries built on that landscape. Together they describe Maine's economy in 1820 with unusual specificity."
      - 'Dirigo does double duty on the seal. As a navigational claim, it refers to the North Star shown directly above it, the fixed point sailors used to find true north. As a political statement made in 1820, it asserts that the newly independent state intended to lead, not follow, now that it had separated from Massachusetts.'
      - "Maine's seal organizes its symbols around a heraldic shield with a crest above and supporting figures on either side. Each element reflects a specific aspect of the new state's identity and economy in 1820."
    elements:
      - id: white-pine-tree
        name: White Pine Tree
        image: /images/state-seals/maine/elements/white-pine-tree.webp
        paragraphs:
          - "The Eastern white pine stands at the center of the shield. It is Maine's state tree and, in 1820, the defining resource of the state's economy. White pine timber was the most valuable wood in colonial and early American New England, prized above all for ship masts because of its height and straight grain."
          - "Under the British Broad Arrow Policy, colonial law reserved the tallest white pines in Maine for exclusive Royal Navy use. Trees were marked with a broad arrow and could not be cut without Crown permission. Maine's seal placed the tree at the center of the new state's emblem as a direct claim of ownership over the forest."
      - id: moose
        name: Moose
        image: /images/state-seals/maine/elements/moose.webp
        paragraphs:
          - "A moose lies at the base of the pine tree on the shield. The moose is Maine's state animal, the largest land mammal in New England, and in 1820 was abundant throughout Maine's forests. Its presence on the seal ties the state's identity to its wild interior."
          - 'Maine still holds the largest moose population in the contiguous United States. The moose on the seal is shown reclining beneath the pine, placing animal and tree in the same forest landscape and framing both as central to what the state was and remains.'
      - id: north-star
        name: North Star
        image: /images/state-seals/maine/elements/north-star.webp
        paragraphs:
          - "A single star with radiating rays appears above the shield as the seal's crest. This is the North Star, Polaris, the fixed navigational reference sailors used for centuries to determine true north. Its placement directly above the motto Dirigo makes the connection explicit: the star that guides is the symbol of the state that leads."
          - "Maine's position as the northernmost New England state gave Polaris geographic relevance. For ships departing Maine's ports on Atlantic voyages, the North Star was the primary navigational reference. The seal places that star at the top of the design, above all other elements."
      - id: farmer
        name: Farmer with Scythe
        image: /images/state-seals/maine/elements/farmer.webp
        paragraphs:
          - "A farmer resting on a scythe stands on one side of the shield. The scythe was the central tool of early American grain and grass harvesting. The farmer represents Maine's agricultural economy, which ran alongside the timber and maritime industries from the state's founding."
          - "Farming in early Maine was difficult: short growing season, rocky soil, and land that first had to be cleared from forest. The farmer's place on the seal acknowledges that Maine was built as much by field labor as by forestry and sea trade."
      - id: seaman
        name: Seaman with Anchor
        image: /images/state-seals/maine/elements/seaman.webp
        paragraphs:
          - "A seaman leaning on an anchor stands on the other side of the shield. The anchor is the central emblem of maritime navigation in the Western heraldic tradition. The seaman represents Maine's shipbuilding, fishing, and Atlantic trade industries."
          - "In 1820, Maine's coastline was among the most active in New England. Bath, Portland, and other ports built ships and moved timber, fish, and goods along the Atlantic seaboard. Maine became the center of American wooden shipbuilding through much of the 19th century, a trajectory visible from the moment the seal was designed."
      - id: dirigo-motto
        name: Dirigo (State Motto)
        image: /images/state-seals/maine/elements/dirigo-motto.webp
        paragraphs:
          - "*Dirigo* is Latin for \"I lead\" or \"I direct.\" It appears on the seal beneath the North Star and has been Maine's official state motto since 1820. The word connects the navigational imagery of the star above it to a political claim of leadership."
          - 'The motto applies geographically and politically. Maine is the northernmost New England state, the first in the contiguous United States where the sun rises each morning, and the furthest northeast in the lower 48. Dirigo connects all of that geography to an assertion of purpose made at the moment the state was founded.'

  - id: previous-versions
    icon: fa-solid fa-clock-rotate-left
    title: 'Previous Versions of the Maine State Seal'
    paragraphs:
      - "Maine's seal was adopted in 1820, and its core symbolism has remained remarkably stable ever since. The most important surviving early image is the original sketch associated with the seal's adoption, which shows the same pine, moose, supporters, star, and motto that define the seal today."
      - "Later official renderings mostly standardized drawing style rather than changing symbolism. Maine's history is less about multiple redesigned seals than about a durable 1820 emblem surviving into modern state use."
