lyrics_verses:
  - |-
    Grand State of Maine,
    Proudly we sing
    To tell your glories to the land,
    To shout your praises till the echoes ring.
    Should fate unkind
    Send us to roam,
    The scent of the fragrant pines,
    The tang of the salty sea
    Will call us home.
  - |-
    Oh, Pine Tree State,
    Your woods, fields and hills,
    Your lakes, streams and rock-bound coast
    Will ever fill our hearts with thrills,
    And tho' we seek far and wide
    Our search will be in vain,
    To find a fairer spot on earth
    Than Maine! Maine! Maine!
lyrics_note: "The song praises Maine's forests, hills, lakes, and rocky coastline, framing the state's natural scenery as a lasting source of pride for its people."
