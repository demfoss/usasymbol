faq:
  - question: What is Maine's state song?
    answer: "Maine's official state song is the \"State of Maine Song,\" adopted in 1937."
  - question: Who wrote Maine's state song?
    answer: "Roger Vinton Snow wrote both the words and music, entering it in a 1931 statewide contest."
  - question: When did Maine adopt the "State of Maine Song" as its state song?
    answer: "Maine adopted the song as its official state song on March 30, 1937."
  - question: Does Maine have more than one official song?
    answer: "Yes. Maine also recognizes \"Ballad of the 20th Maine,\" adopted in 2019, as its official state ballad."

