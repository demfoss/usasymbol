intro_text: "Maine's official state song is the \"State of Maine Song,\" adopted in 1937 after Portland lawyer Roger Vinton Snow won a statewide songwriting contest with it six years earlier. It is one of the few state songs written and won through open public competition rather than legislative selection alone."

