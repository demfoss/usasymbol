sections:
  - id: overview
    icon: fa-solid fa-music
    title: Maine State Song
    paragraphs:
      - "The \"State of Maine Song\" is Maine's official state song, adopted in 1937. Roger Vinton Snow, a Portland-area lawyer, wrote both the words and music, and the Legislature chose the song after it had already proven itself in a public contest."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"State of Maine Song\" Explained"
    paragraphs:
      - "The song is a patriotic hymn to Maine's landscape, naming its pine woods, hills, lakes, streams, and rocky coast as sources of lasting pride. It is written as a stately, singable anthem rather than a folk ballad, suited for group performance at civic events."
      - "Roger Vinton Snow was a probate and corporate lawyer who also served as a town meeting moderator in Falmouth. He entered the song in a 1931 competition run by the Maine Publicity Bureau and later assigned the copyright to the state itself."
      - "Cressey and Allen, a Portland music publisher, printed the sheet music in 1932, a year before the song had any official status, which helped it circulate in schools and civic groups statewide."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "State of Maine Song" Represents Maine
    paragraphs:
      - "The song won out because it had already been tested against more than a hundred competitors and approved by public judges before lawmakers ever took it up. That gave the Legislature a ready-made consensus choice rather than a contested pick."
      - "Its lyrics stay close to the state's identity, naming specific features of Maine's geography instead of general patriotic language. For a state whose economy and identity are tied closely to its coastline and forests, that specificity mattered."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"State of Maine Song\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "State of Maine Song" Became Maine's State Song
    paragraphs:
      - "The Maine Publicity Bureau held an open contest in 1931, drawing 116 submissions that judges narrowed to four finalists before Snow's song won. The Maine Legislature formally adopted it as the official state song on March 30, 1937, six years after that contest concluded."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Maine

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"State of Maine Song\" Facts"
    facts:
      - "Maine adopted the \"State of Maine Song\" as its official state song in 1937."
      - "The song won a 1931 statewide contest that drew 116 entries."
      - "Roger Vinton Snow wrote both the words and the music."
      - "Snow assigned the song's copyright to the State of Maine."
      - "Maine also recognizes \"Ballad of the 20th Maine\" as its official state ballad."

