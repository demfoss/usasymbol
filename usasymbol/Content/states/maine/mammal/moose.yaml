faq:
  - question: "What is Maine's state animal?"
    answer: "Maine's state animal is the moose (Alces alces), designated in 1979. Maine has one of the largest moose populations in the contiguous United States, with an estimated 60,000-70,000 individuals."

  - question: "When was the moose designated as Maine's state animal?"
    answer: "The moose became Maine's official state animal in 1979 through Legislative Document 1278, recognizing the species' importance to Maine's wilderness character and celebrating its successful recovery from near-extirpation."

  - question: "Why did Maine choose the moose as its state animal?"
    answer: "Maine chose the moose because it represents the state's vast northern wilderness and forests. Moose require extensive undeveloped habitat that Maine provides, making them symbols of true wilderness. The designation celebrated Maine's successful moose conservation—recovering populations from approximately 2,000-3,000 in the early 1900s to tens of thousands by 1979."

  - question: "Where can I see moose in Maine?"
    answer: "The best areas to see moose in Maine include Moosehead Lake region, Baxter State Park, Allagash Wilderness Waterway, Route 201 corridor north of Jackman, Rangeley Lakes region, and Aroostook County. Moose are most visible at dawn and dusk along roads near wetlands. Many tour operators offer guided moose safaris with high success rates for sightings."

  - question: "How many moose live in Maine?"
    answer: "Maine's moose population is estimated at 60,000-70,000 individuals, down from a peak of 75,000-80,000 in the 1990s. The decline is primarily attributed to winter tick infestations that affect moose health and calf survival. Maine still maintains one of the largest moose populations in the lower 48 states."

  - question: "Are moose dangerous?"
    answer: "Yes, moose can be extremely dangerous, especially cows with calves and bulls during fall breeding season (the rut). Despite their seemingly docile appearance, moose are unpredictable and can charge, kick, or stomp perceived threats. Moose kill more people in North America than bears or wolves. Maintain at least 50 feet distance and never approach or feed moose."

  - question: "What is the biggest threat to Maine's moose?"
    answer: "Winter ticks are currently the biggest threat to Maine moose. Tens of thousands of ticks can infest a single moose, causing blood loss, excessive grooming that removes insulating fur, and creating 'ghost moose' with visible white scarring. Tick infestations kill many calves and weaken adults. Warming winters have increased tick populations, creating an ongoing conservation crisis."

  - question: "Can you hunt moose in Maine?"
    answer: "Yes, Maine offers limited moose hunting through a lottery system. The state issues approximately 3,000-4,000 permits annually (numbers vary based on population management goals). Over 50,000 people typically apply for these permits each year. Successful hunters can harvest one moose, providing 400-600 pounds of meat. Hunting helps manage moose populations and generates revenue for wildlife conservation."

