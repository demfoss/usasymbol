title: "Maine State Animal | Moose"
scientific_name: "Alces alces"
adopted_year: 1979

seo_title: "Maine State Animal | Moose"
seo_description: "Maine's state animal is the Moose, adopted in 1979. Learn why this official Maine symbol was chosen and what it represents."

intro_text: "The Moose is the official Maine state animal, designated in 1979. This page gives the direct answer for searches like 'maine state animal', 'maine state animal', and 'maine state mammal' while explaining how the symbol fits the state's official animal designations. Being North America's largest deer species, iconic symbol of Maine wilderness, important hunting tradition. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Moose"
official_since: "1979"
status: "Stable but declining in some regions; population estimated at 60,000-70,000 in Maine"
habitat_in_state: "Northern and western Maine forests, wetlands, beaver ponds, regenerating clear-cuts, mountainous regions"
known_for: "Being North America's largest deer species, iconic symbol of Maine wilderness, important hunting tradition"

size: "7 to 10 feet long; 5 to 6.5 feet tall at shoulder"
weight: "Males (bulls): 800-1,200 pounds, occasionally exceeding 1,400 pounds; Females (cows): 600-800 pounds"
coloration: "Dark brown to black; lighter brown legs; pale or whitish muzzle; calves born reddish-brown"
distinctive_traits: "Massive size, long legs, overhanging snout, dewlap (bell) hanging from throat, males grow massive palmate antlers (up to 6 feet wide), hump at shoulders"

habitat: "Mature forests with wetland openings, beaver ponds, regenerating clear-cuts providing browse, mountainous terrain"
range_in_state: "Throughout Maine north of Augusta; highest densities in northern and western forests including Aroostook County, Moosehead Lake region, and western mountains"
conservation_status: "Population recovered from near-extirpation in 1800s; now stable at 60,000-70,000; facing new challenges from winter ticks and climate change"
where_to_find: "Moosehead Lake region, Baxter State Park, Allagash Wilderness Waterway, Route 201 corridor, Rangeley Lakes region, Aroostook County; most visible at dawn/dusk along roads near wetlands"
symbol_connections: "Represents Maine's vast northern wilderness and forests; embodies the state's outdoor recreation heritage; symbolizes successful wildlife conservation; connects to logging industry and forest regeneration; reflects Maine's identity as 'Vacationland' offering wilderness experiences"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Maine State Legislature designated the moose as the official state animal in 1979 through Legislative Document 1278. The designation recognized the moose's fundamental importance to Maine's identity as a wilderness state and celebrated the species' successful recovery from near-extirpation in the 1800s to become one of the largest moose populations in the lower 48 states."
      - "The timing reflected Maine's growing recognition of wildlife as economic and cultural assets worth celebrating. By 1979, moose populations had recovered sufficiently to support limited hunting seasons, demonstrating that Maine's conservation efforts had succeeded. The designation as state animal elevated the moose from game species to cultural icon, cementing its status as the symbol most associated with Maine's wilderness character alongside the lobster representing Maine's coastal identity and values on the [Maine state motto page](/states/maine/motto/dirigo)."

    subsections:
      - subtitle: "Symbol of Northern Maine"
        text: "The moose specifically represents northern Maine—the vast, sparsely populated region of forests, mountains, and lakes that define the state's wilderness character. While Maine's southern coast attracts most tourists and contains most population centers, northern Maine remains wild and remote, with moose outnumbering people in some counties. The moose designation acknowledged that Maine's identity extends beyond coastal communities to encompass the northern forests that cover over 90 percent of the state's land area. The moose embodies this wild, forested character that distinguishes Maine from other New England states."

      - subtitle: "Why Maine Chose the Moose"
        text: "Maine selected the moose because no other animal so completely represents the state's wilderness and northern character. White-tailed deer are common throughout New England. Black bears, while important, lack the moose's distinctive presence and size. The moose, however, requires vast undeveloped forests, cold climates, and abundant wetlands—conditions that Maine provides but that are increasingly rare in the eastern United States. The moose's presence indicates true wilderness, making it the perfect symbol for Maine's identity as the most forested state in the nation and a destination for wilderness experiences unavailable elsewhere in the Northeast."

  - id: "state-symbolism"
    title: "What the Moose Represents"
    style: "highlight"
    paragraphs:
      - "The moose embodies wilderness on a scale rare in the eastern United States. These massive animals require extensive habitat—an adult moose needs 5-10 square miles of territory containing forests for cover, wetlands for aquatic vegetation, and regenerating clear-cuts providing browse. Maine's 17 million acres of forest, including millions of acres of undeveloped commercial timberland, provide this habitat. The moose's abundance in Maine demonstrates that the state has successfully maintained wilderness character despite 200 years of logging, development, and human population growth."
      - "For Maine's Wabanaki peoples including the Penobscot, Passamaquoddy, Maliseet, and Micmac, moose have sustained communities for thousands of years. The massive animals provided meat that could feed families through harsh winters, hides for clothing and shelter, bones and antlers for tools, and sinew for thread. Moose hunting required skill, courage, and knowledge of moose behavior and habitat. Wabanaki traditions and stories feature moose prominently, recognizing the animal's spiritual and practical importance. The moose designation honors this indigenous relationship that predates European settlement by millennia."
      - "The designation celebrates one of North America's great conservation success stories. Moose nearly disappeared from Maine by the late 1800s due to unregulated hunting and habitat loss. By 1900, perhaps 2,000-3,000 moose survived in the most remote areas. Through hunting closures, habitat protection, and scientific management, Maine's moose population recovered to 20,000-30,000 by the 1980s and peaked at 75,000+ in the 1990s. This recovery demonstrated that wildlife can thrive alongside commercial forestry and human activity when properly managed—a conservation model applied to many species."

    subsections:
      - subtitle: "Adaptation to Northern Forests"
        text: "Moose evolved specifically for northern boreal forest environments like Maine's. Their long legs allow them to wade through deep snow and navigate wetlands where shorter-legged deer struggle. Their overhanging snout and prehensile upper lip enable them to strip leaves and twigs from branches efficiently. Moose lack upper front teeth, instead using a hard palate to crush vegetation against lower incisors. These adaptations allow moose to survive Maine's harsh winters by browsing on woody vegetation when other food sources disappear. Moose represent successful specialization for the northern forest niche that defines much of Maine."

      - subtitle: "The Logging Connection"
        text: "Paradoxically, Maine's extensive commercial logging industry has benefited moose populations by creating ideal habitat. Clear-cutting forests triggers regeneration of young hardwood and softwood growth—exactly the browse moose prefer. Logging roads provide access to remote areas but also create edge habitat where forests meet clearings, concentrating nutritious vegetation. The mosaic of mature forests and regenerating clear-cuts across Maine's working forestland creates superior moose habitat compared to either unbroken virgin forest or fully developed landscapes. This relationship demonstrates how wildlife can coexist with resource extraction when managed thoughtfully."

      - subtitle: "Maine's Wilderness Tourism"
        text: "The moose has become central to Maine's tourism industry, particularly the wilderness tourism that draws visitors to northern Maine. Moose safaris—guided tours seeking moose at dawn or dusk—generate millions in annual revenue. Businesses from Moosehead Lake to the Allagash capitalize on moose imagery in logos, products, and marketing. The Maine Office of Tourism prominently features moose in campaigns promoting Maine as 'Vacationland,' alongside resilient species on the [Maine state bird page](/states/maine/bird/black-capped-chickadee). This economic importance extends the moose's value beyond hunting and wildlife watching to become a brand that markets Maine's wilderness character to millions of potential visitors who may never see a wild moose."

      - subtitle: "Winter Tick Crisis"
        text: "Maine's moose face an emerging threat that has become a defining conservation challenge: winter tick infestation. Winter ticks, which attach to moose by the thousands (sometimes 90,000+ on a single animal), drain blood and cause moose to groom excessively, removing fur and creating 'ghost moose' with white scarring from hair loss. The grooming and tick feeding weaken moose, and calves often die from anemia and hypothermia when they lose insulating fur. Warming winters allow tick populations to explode, creating a crisis that has reduced Maine's moose population from peaks of 75,000+ to current estimates of 60,000-70,000 despite reduced hunting. This challenge represents climate change's tangible impact on a beloved Maine symbol."

      - subtitle: "Moose-Vehicle Collisions"
        text: "Moose-vehicle collisions represent serious safety hazards in Maine, with 200-300 collisions annually resulting in human injuries, fatalities, and millions in property damage. Moose stand tall enough that vehicle impacts often strike their legs, sending their massive bodies through windshields with devastating results. Maine's long, straight rural roads passing through moose habitat create collision risk zones. The state has installed moose crossing signs, collision warning systems, and roadside clearing to improve visibility, but collisions remain a persistent challenge. These accidents demonstrate the complications of maintaining large wildlife populations near human development."

  - id: "identification"
    title: "How to Identify Moose"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Moose are the largest members of the deer family, instantly recognizable by their massive size, long legs, and distinctive overhanging snout. Maine's moose belong to the same species as European moose and are slightly smaller than the Alaska-Yukon subspecies but still achieve remarkable size."
        list_items:
          - "**Size**: 7-10 feet long, 5-6.5 feet tall at shoulder; bulls substantially larger than cows"
          - "**Weight**: Bulls 800-1,200 pounds (occasionally 1,400+), cows 600-800 pounds"
          - "**Color**: Dark brown to nearly black; lighter brown legs; pale muzzle"
          - "**Distinguishing features**: Overhanging snout, dewlap (bell) on throat, shoulder hump, massive palmate antlers on bulls"

      - subtitle: "Antler Characteristics"
        text: "Bull moose grow impressive palmate (flattened, palm-shaped) antlers annually, shedding them each winter and regrowing them in spring and summer. Maine bulls typically grow antlers spanning 4-5 feet, though exceptional individuals exceed 6 feet. Antler size reflects age, genetics, and nutrition—prime bulls aged 5-10 years with access to quality food grow the largest antlers. Antlers grow rapidly through summer, covered in velvet—blood-rich skin that nourishes growing bone. Bulls shed velvet in early fall by rubbing antlers against trees, revealing hardened bone beneath. Antler development consumes enormous energy and nutrients, demonstrating the bull's fitness and attractiveness to cows during fall breeding season."

      - subtitle: "Distinguishing Moose from Other Deer"
        text: "Moose are unmistakable when seen clearly due to their massive size—even female moose dwarf the largest white-tailed deer bucks. However, at distance or in poor light, large bull deer are occasionally mistaken for young moose. Key differences: moose have overhanging snouts and bulbous noses versus deer's pointed noses, moose have shoulder humps while deer lack this feature, moose have long legs creating tall, gangly profiles while deer appear more compact, and moose move with distinctive slow, deliberate gaits unlike deer's bouncing runs. Additionally, moose typically inhabit wetter areas than deer, favoring beaver ponds and swamps."

  - id: "history"
    title: "Moose in Maine History"
    style: "default"
    paragraphs:
      - "Moose have inhabited Maine since the last ice age retreated approximately 12,000 years ago, colonizing the regenerating forests that followed glacial melt. Archaeological evidence from Native American sites throughout Maine documents extensive moose hunting from earliest human habitation. The massive animals provided far more meat per kill than deer or smaller game, making moose hunting highly valuable despite the challenge of bringing down such large, dangerous animals."
      - "When European settlers arrived in Maine in the 1600s, moose were abundant but not limitless. Early accounts describe moose as common in northern Maine but not encountered daily like deer. The vast, unbroken forests of pre-settlement Maine actually provided less ideal moose habitat than later logged landscapes—moose prefer young forest growth and wetland edges rather than mature forest canopy. Paradoxically, early logging may have initially increased moose populations by creating the regenerating forest habitat moose favor."

    subsections:
      - subtitle: "Market Hunting Era"
        text: "Unregulated hunting through the 1800s devastated Maine's moose population. Market hunters killed moose commercially, selling meat to logging camps and cities. A single moose could provide 400-600 pounds of meat, making moose hunting profitable. Additionally, wealthy sportsmen hunted moose as trophies, with guiding services developing specifically for moose hunting in northern Maine. The combination of market hunting, subsistence hunting by settlers, and sport hunting without regulation reduced Maine's moose population to critically low levels by 1890. Some estimates suggest only 2,000-3,000 moose survived in the most remote regions."

      - subtitle: "Protection and Recovery"
        text: "Maine implemented its first moose hunting restrictions in 1830, recognizing that populations were declining. However, enforcement proved impossible in remote northern forests, and illegal hunting continued. Maine completely closed moose hunting in 1935, beginning a 45-year prohibition that allowed populations to recover. During this closure, habitat improvements from logging, reduced human settlement in northern Maine, and elimination of hunting pressure allowed moose to rebound. By the 1970s, moose had become common enough that limited hunting could resume. Maine reopened moose hunting in 1980 with carefully controlled lottery permits, a system that continues today."

      - subtitle: "Peak Population and Recent Declines"
        text: "Maine's moose population peaked in the 1990s at an estimated 75,000-80,000 animals—the highest density of moose in the lower 48 states. This abundance created challenges including increased moose-vehicle collisions and crop damage complaints. However, populations have declined since the peak, dropping to current estimates of 60,000-70,000. The decline correlates with increasing winter tick infestations, which have become the primary limiting factor for moose reproduction and survival. Additionally, climate change may be pushing moose toward their thermal tolerance limits—Maine's warming temperatures create stress for animals adapted to cold climates."

      - subtitle: "Moose and Maine's Tourism"
        text: "The moose's recovery transformed it from game animal to tourism icon. The Moosehead Lake region of Maine adopted the moose as its signature attraction, with businesses, festivals, and promotional materials featuring moose prominently. Greenville, Maine hosts the annual 'Moosemainea' festival celebrating moose through tours, crafts, and education. Tour operators throughout northern Maine offer moose safaris, capitalizing on visitors' desire to see Maine's most iconic wildlife. This tourism provides economic incentive for maintaining healthy moose populations and creates constituencies supporting moose conservation beyond hunters."

  - id: "behavior"
    title: "Moose Behavior in Maine"
    style: "default"

    subsections:
      - subtitle: "Seasonal Activity Patterns"
        text: "Maine moose show distinct seasonal behavior patterns adapted to the state's climate extremes. Summer finds moose feeding heavily on aquatic vegetation in ponds and wetlands, often submerging completely to reach underwater plants. They also consume terrestrial vegetation including leaves, twigs, and bark. Fall brings the rut (breeding season) when bulls become aggressive, fighting rivals and pursuing cows. Winter forces moose to conserve energy, moving less and browsing on woody vegetation since succulent summer foods have died back. Spring emergence brings relief from winter's hardships, with moose feeding intensively to recover body condition lost over winter."

      - subtitle: "Breeding and Calving"
        text: "Maine moose breed in September and October during the fall rut. Bulls compete for breeding access to cows through displays, vocalizations, and occasionally violent fights where bulls clash antlers and attempt to gore rivals. Dominant bulls may breed with multiple cows. After approximately 230-day pregnancies, cows give birth to 1-2 calves (twins are common in well-nourished populations) in late May or early June. Cows seek secluded areas away from predators and other moose for calving. Newborn calves weigh 25-35 pounds and can stand within hours, though they remain vulnerable to predators including black bears and coyotes for their first weeks."

      - subtitle: "Diet and Foraging"
        text: "Moose are browsers, feeding on woody vegetation rather than grass. Their diet changes seasonally based on availability. Summer diet emphasizes aquatic plants including water lilies, pondweed, and submerged vegetation that provide sodium—a nutrient scarce in terrestrial plants but essential for moose. They also consume leaves from deciduous trees and shrubs. Winter diet consists almost entirely of twigs and bark from trees including willow, birch, maple, and balsam fir. An adult moose consumes 40-60 pounds of vegetation daily in summer and 20-30 pounds in winter when food quality drops. This massive consumption requires moose to spend most daylight hours feeding."

      - subtitle: "Thermal Stress and Climate Adaptation"
        text: "Moose evolved for cold climates and struggle with heat. Their dark color absorbs sunlight, and thick fur provides insulation suited for -40°F winters but becomes problematic above 60°F. Maine's warming climate creates challenges—moose reduce activity during hot weather, feeding primarily at night and resting in shade or water during day. Heat stress reduces feeding time, affecting nutrition and reproduction. Additionally, warming winters reduce snow depth that historically limited white-tailed deer distribution, allowing deer to expand into moose range. Deer carry brain worm parasites that kill moose, creating another climate-related threat as deer and moose increasingly overlap."

  - id: "conservation"
    title: "Managing Maine's Moose Population"
    style: "default"
    paragraphs:
      - "Maine Department of Inland Fisheries and Wildlife manages moose through regulated hunting, habitat monitoring, and research into emerging threats including winter ticks and climate change. The current population estimate of 60,000-70,000 moose represents a decline from 1990s peaks but still makes Maine one of the premier moose destinations in the lower 48 states. Management focuses on maintaining sustainable populations while addressing human-moose conflicts and preparing for climate-driven challenges."

    subsections:
      - subtitle: "Lottery Hunting System"
        text: "Maine manages moose hunting through a lottery system where applicants enter for chance to win one of approximately 3,000-4,000 permits issued annually (numbers vary based on population goals). Winners can hunt during specific seasons in designated wildlife management districts. This system controls harvest precisely, ensuring hunting remains sustainable while providing recreational opportunities and generating revenue through application fees. The lottery has become an institution—over 50,000 people apply annually, with some hunters entering for decades before winning permits. Successful moose hunting provides 400-600 pounds of meat, making permits highly valued."

      - subtitle: "Winter Tick Research"
        text: "Maine Inland Fisheries and Wildlife has intensified research into winter tick impacts on moose populations. Biologists collar moose calves to track survival rates, documenting that tick-infested calves often die before their first birthday. Research suggests warming winters allow ticks to quest (search for hosts) later in fall when moose are more abundant, increasing infestation rates. Potential management responses include reducing moose densities to decrease tick transmission, though this controversial approach would require dramatically increased hunting. Currently, no practical method exists for directly controlling winter tick populations in wild moose, making this an ongoing conservation crisis."

      - subtitle: "Collision Reduction Efforts"
        text: "Maine Department of Transportation and wildlife agencies collaborate to reduce moose-vehicle collisions through multiple approaches. Moose crossing signs warn drivers in high-collision zones. Roadside vegetation clearing improves visibility, allowing drivers to see moose before collisions become unavoidable. Some areas have installed experimental warning systems using sensors to detect moose near roads and trigger flashing lights alerting drivers. However, the most effective collision reduction may be educating drivers about collision risks, encouraging reduced speeds during dawn/dusk hours when moose are most active, and promoting awareness that moose often stand in roads at night due to lower temperature and escape from biting insects."

      - subtitle: "Climate Change Adaptation"
        text: "Maine faces the challenge of managing moose populations as climate change alters habitat suitability. Warming temperatures may eventually make southern Maine unsuitable for moose, concentrating populations in the cooler northern counties. Longer, warmer summers increase heat stress. Milder winters reduce snow depth that historically limited deer expansion, allowing deer to spread into moose habitat carrying fatal brain worm parasites. Maine's long-term moose management must consider these climate-driven changes, potentially accepting that moose will retreat northward even as management works to maintain viable populations in suitable habitat."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The moose connects to Maine's state motto, 'Dirigo' (I lead), adopted in 1820 at statehood. Maine led the nation in moose conservation, protecting the species when other states allowed unregulated hunting to eliminate moose from their territories. Maine's successful moose recovery demonstrated leadership in wildlife management that other states later followed. The state continues leading in addressing emerging challenges like winter tick infestations, conducting research that informs moose management across North America. The moose designation celebrates this conservation leadership."
      - "Maine designated the white pine as state tree in 1945, 34 years before adopting the moose as state animal. Both symbols represent Maine's vast forests—white pines provide the structural component while moose represent the wildlife those forests support. The relationship is ecological: moose browse on vegetation in forest openings and regenerating clear-cuts, while mature white pine forests provide thermal cover during extreme weather. The paired symbols acknowledge that Maine's forests and wildlife form interconnected systems requiring both timber and wildlife management across a region reflected in [states neighboring states](/rankings/geography/states-neighboring-states)."

    subsections:
      - subtitle: "Black-capped Chickadee and Resilience"
        text: "Maine's state bird, the black-capped chickadee, shares with the moose an ability to survive Maine's harsh winters. Both species evolved adaptations for extreme cold—chickadees through lowering body temperature at night to conserve energy, moose through thick winter coats and reduced activity. Both symbols represent Maine's winter character and the resilience required to thrive in northern New England's climate. The chickadee's small size and the moose's massive bulk represent opposite survival strategies, yet both succeed in Maine's forests."
        link:
          label: "See Maine state bird"
          url: "/states/maine/bird/black-capped-chickadee"

      - subtitle: "White Pine and Forest Economy"
        text: "Maine's state tree, the white pine, historically drove the state's timber industry and continues representing Maine's forest economy. Moose populations benefit from this forestry—logging creates the regenerating forests and edge habitat that moose require for feeding. However, the relationship includes tension when moose damage valuable timber by browsing on young trees. Both symbols represent Maine's forest economy and ecology, acknowledging that Maine's identity as the most forested state encompasses both timber extraction and wildlife habitat in landscapes where both coexist through management."
        link:
          label: "See Maine state tree"
          url: "/states/maine/tree/white-pine"

      - subtitle: "State Motto and Conservation Leadership"
        text: "Maine's motto 'Dirigo' (I lead) applies directly to the state's moose conservation history. Maine led northeastern states in recognizing that wildlife required protection and scientific management rather than unlimited exploitation. The 1935 hunting closure and subsequent recovery program demonstrated leadership that influenced wildlife management across North America. Today, Maine leads research into winter tick impacts and climate change effects on moose, continuing the leadership tradition the motto proclaims and that the moose designation celebrates."
        link:
          label: "See Maine state motto"
          url: "/states/maine/motto/dirigo"

