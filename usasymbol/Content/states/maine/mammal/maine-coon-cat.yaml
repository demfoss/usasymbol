sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Maine State Legislature designated the Maine Coon cat as the official state cat on May 16, 1985, through Legislative Document 1283. Maine became the first and remains the only state to designate an official state cat, recognizing the breed's unique connection to Maine's history and its status as one of the few cat breeds native to North America."
      - "The designation celebrated Maine's role as birthplace of this distinctive breed, which developed naturally over generations in Maine's harsh climate. By 1985, Maine Coons had achieved international recognition as one of the world's most popular cat breeds, having recovered from near-extinction in the early 1900s. The state designation honored both the breed's Maine origins and the dedicated breeders who preserved Maine Coons when the breed faced disappearance due to competition from exotic imported breeds, reinforcing [the Pine Tree State nickname](/states/maine/nickname/the-pine-tree-state)."

    subsections:
      - subtitle: "Maine's Only Native Cat Breed"
        text: "The Maine Coon is the only cat breed that originated in Maine and one of the few breeds that developed naturally in North America without deliberate human breeding programs. Unlike most modern cat breeds created through selective breeding for specific traits, Maine Coons evolved through natural selection as working farm cats adapted to Maine's environment. The breed developed its distinctive characteristics—long shaggy coat, tufted ears, large size, and bushy tail—through survival advantages these traits provided in Maine's cold climate and practical farm work catching mice and rats."

      - subtitle: "First State Cat in America"
        text: "Maine's 1985 designation created a new category of state symbols—no other state had previously designated an official state cat. Several states have since considered similar designations, but Maine remains unique in recognizing a cat breed as official state symbol. This pioneering designation reflected Maine's independent character and willingness to celebrate unconventional symbols. The Maine Coon's selection over more common state symbols like horses or dogs demonstrated Maine's appreciation for the working animals that supported rural life, including the barn cats that controlled rodent populations on farms throughout the state."

  - id: "state-symbolism"
    title: "What the Maine Coon Represents"
    style: "highlight"
    paragraphs:
      - "The Maine Coon embodies adaptation and survival in harsh conditions—qualities central to Maine's identity. These cats developed in one of America's coldest climates, evolving physical characteristics that enabled survival through brutal winters. Their long, water-resistant coats, large tufted paws that act as snowshoes, and bushy tails that wrap around bodies for warmth represent successful adaptation to Maine's environment. This resilience parallels Maine's human communities who also developed distinctive characteristics for surviving and thriving in challenging northern conditions."
      - "The breed represents Maine's agricultural heritage and the practical relationships between people and animals that characterized 19th-century rural life. Maine Coons worked as mousers on farms, in barns, and aboard ships, earning their keep by controlling rodent populations that threatened grain stores and ship provisions. Unlike fancy purebred cats kept as ornamental pets, Maine Coons were valued for practical abilities—hunting skills, hardy constitutions, and tolerance for Maine's weather. The designation honors working animals that contributed to Maine's agricultural economy rather than elite show animals."
      - "The designation celebrates Maine storytelling traditions and the folklore that developed around these distinctive cats. Numerous legends attempt to explain Maine Coons' origins—stories of cats breeding with raccoons (biologically impossible but persistent in folklore), Marie Antoinette's cats escaping to Maine during the French Revolution, or Viking cats arriving centuries before Columbus. While none of these tales are historically accurate, they demonstrate Maine's tradition of tall tales and the breed's ability to inspire creative storytelling. The Maine Coon designation acknowledges that Maine identity includes not just factual history but also the myths and legends that communities create."

    subsections:
      - subtitle: "Natural Selection in Maine's Climate"
        text: "Maine Coons developed distinctive characteristics through natural selection responding to Maine's harsh climate. Their long, shaggy coats with water-resistant guard hairs shed rain and snow while providing insulation against subfreezing temperatures. Large, tufted paws spread weight on snow like snowshoes while fur between toes protects against ice. Bushy, fox-like tails wrap around bodies when cats curl up, providing additional warmth. Tufted ears protect against cold and frostbite. These adaptations arose naturally over generations as cats lacking these features suffered higher mortality during Maine winters, while well-adapted cats survived and reproduced."

      - subtitle: "The Raccoon Legend"
        text: "The most persistent legend about Maine Coon origins claims they resulted from domestic cats breeding with raccoons, supposedly explaining the breed's bushy tail, brown tabby coloring, and large size. This tale, while biologically impossible (cats and raccoons cannot interbreed due to different numbers of chromosomes), became so widespread that it inspired the breed's name. The legend represents Maine's tradition of tall tales and demonstrates how folklore shapes identity even when contradicting scientific fact. Modern genetics definitively proves Maine Coons are purely domestic cats, but the raccoon legend persists as cultural tradition."

      - subtitle: "The Marie Antoinette Theory"
        text: "Another colorful legend claims Maine Coons descended from longhaired cats owned by Marie Antoinette, allegedly shipped to Maine by a sympathetic sea captain as she awaited execution during the French Revolution. According to this story, the cats survived in Maine after plans to bring Marie Antoinette to America failed. While romantic, this tale lacks historical evidence—no records document such a cat shipment, and longhaired cats were already present in Maine through other routes. However, the story became part of Maine Coon lore, demonstrating how breeds acquire mythology that enhances their appeal regardless of historical accuracy."

      - subtitle: "Viking and Maritime Origins"
        text: "The most plausible origin theory suggests Maine Coons descended from longhaired cats brought to North America by Viking explorers around 1000 CE or later European maritime traders. Archaeological evidence confirms Vikings reached North America, and Norwegian Forest Cats—which closely resemble Maine Coons—could have accompanied Viking expeditions. Later, ships trading between Maine and Europe commonly carried cats to control rodent populations. These ship cats, particularly longhaired varieties suited to northern climates, likely interbred with domestic shorthairs in Maine, gradually creating the Maine Coon through natural selection favoring traits suited to Maine's environment."

      - subtitle: "Near-Extinction and Revival"
        text: "Maine Coons nearly disappeared in the early 1900s when exotic imported breeds including Persians became fashionable, overshadowing the homely working farm cats. Cat shows increasingly favored foreign breeds, and Maine Coon registrations declined dramatically. By the 1950s, the breed faced potential extinction. Dedicated Maine breeders, particularly the Central Maine Cat Club formed in 1953, worked to preserve and promote Maine Coons. These preservation efforts succeeded—by the 1970s, Maine Coons had regained popularity, and by 1985 when Maine designated them as state cat, they had become one of America's most popular breeds. This recovery parallels many Maine wildlife conservation successes."

  - id: "identification"
    title: "How to Identify Maine Coons"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Maine Coons are among the largest domestic cat breeds, with males often reaching substantial size. Their most distinctive features include long, shaggy coats, tufted ears, and bushy tails that can be as long as their bodies. The breed's rectangular build and slow maturation—taking 3-4 years to reach full size—distinguish them from most domestic cats."
        list_items:
          - "**Size**: 10-16 inches tall at shoulder; 19-40 inches long including tail"
          - "**Weight**: Males 13-18 pounds (some exceed 20), females 8-12 pounds"
          - "**Coat**: Long, shaggy, water-resistant with silky texture; shorter on shoulders, longer on stomach and rear"
          - "**Distinguishing features**: Tufted ears (lynx tips), bushy raccoon-like tail, large tufted paws, square muzzle, prominent ruff"

      - subtitle: "Color and Pattern Variations"
        text: "Maine Coons display over 75 color combinations, though brown tabby (the original working farm cat color) remains most traditional and common. The breed standard accepts solid colors (white, black, blue, red, cream), tabby patterns (classic, mackerel, ticked), tortoiseshell, calico, smoke, shaded, and bi-color combinations. However, pointed patterns like Siamese (colorpoint) are not accepted as they indicate crossbreeding. Eye color varies from gold, green, and copper to blue in white cats. The diversity of accepted colors reflects the breed's natural development rather than breeding for specific appearance."

      - subtitle: "Size and Growth Patterns"
        text: "Maine Coons are famous for their large size, though males significantly outsize females. The largest recorded Maine Coon measured over 48 inches from nose to tail tip, though such extreme size is uncommon. More remarkable than adult size is the breed's slow maturation—Maine Coons take 3-4 years to reach full growth, unlike most domestic cats that mature by 1-2 years. This extended growth period may relate to adaptation to Maine's climate, allowing young cats to conserve energy during their first winters before reaching breeding size. The slow growth produces particularly sturdy, muscular cats well-suited to outdoor life."

      - subtitle: "Distinguishing from Other Longhaired Breeds"
        text: "Maine Coons are sometimes confused with other longhaired breeds including Norwegian Forest Cats, Siberian Cats, and longhaired mixed breeds. Key distinctions: Maine Coons have square muzzles while Norwegian Forest Cats have triangular faces; Maine Coons' coats are shaggier and less uniform than Persians' flowing coats; Maine Coons are larger and more rectangular in build than Ragdolls. The combination of size, ear tufts, bushy tail, tufted paws, and chirping vocalizations distinguishes purebred Maine Coons. However, many 'Maine Coon mixes' exist, and positive identification requires pedigree documentation from recognized cat registries."

  - id: "history"
    title: "Maine Coon History"
    style: "default"
    paragraphs:
      - "The Maine Coon's history stretches back at least 150-200 years, though exact origins remain uncertain due to the breed developing among working-class Maine farmers who left few written records. The cats that became Maine Coons arrived in Maine through maritime trade, Viking exploration, or early European settlement, then adapted over generations to Maine's climate while serving as working mousers on farms and ships."
      - "The first documented references to distinctive longhaired cats in Maine appear in the 1860s-1870s. These early accounts describe large, shaggy farm cats particularly common in central Maine, with brown tabby coloring and bushy tails. The cats gained local recognition for exceptional mousing abilities and tolerance for cold weather. By the 1860s, Maine farmers were exhibiting their finest cats at local fairs, with 'Maine Coons' becoming a recognized type, if not yet an officially registered breed."

    subsections:
      - subtitle: "Early Cat Shows"
        text: "Maine Coons achieved early success in America's first cat shows, demonstrating the breed's quality despite humble working-cat origins. At the 1895 Madison Square Garden cat show in New York—one of America's earliest major cat shows—a brown tabby Maine Coon named Cosey won 'Best Cat.' This victory established Maine Coons as competitors in the emerging cat fancy. However, this success proved short-lived as exotic imported breeds including Persians captured public fancy in the early 1900s, overshadowing the homely American farm cats."

      - subtitle: "Decline and Near-Extinction"
        text: "Maine Coon popularity collapsed in the early 20th century as cat fanciers embraced exotic breeds from abroad. Persians, with their extreme flat faces and flowing coats, became fashionable, making Maine Coons seem plain and provincial by comparison. Cat show registrations of Maine Coons declined precipitously. By the 1950s, the breed faced potential extinction—few breeders maintained purebred lines, and Maine Coons were considered rare even in their native state. This near-loss paralleled many American agricultural heritage breeds that were nearly eliminated by changing fashions and industrialization."

      - subtitle: "The Central Maine Cat Club"
        text: "The Central Maine Cat Club, formed in 1953, spearheaded Maine Coon preservation. This group of dedicated breeders in central Maine recognized that the distinctive cats their grandparents had kept on farms were disappearing. They worked to locate remaining purebred Maine Coons, establish breeding programs, and document pedigrees that would allow breed recognition by major cat registries. The club organized cat shows specifically featuring Maine Coons, gradually rebuilding interest in the breed. This grassroots preservation effort saved Maine Coons from extinction and positioned the breed for the remarkable revival that followed."

      - subtitle: "Modern Recognition and Popularity"
        text: "The Cat Fanciers' Association (CFA), America's largest cat registry, officially recognized Maine Coons in 1976, validating decades of preservation work. This recognition allowed Maine Coons to compete in championship classes at CFA shows, dramatically increasing breed visibility. Through the 1970s-1980s, Maine Coon popularity surged as cat fanciers rediscovered the breed's distinctive appearance and friendly temperament. By 1985 when Maine designated the breed as state cat, Maine Coons had become one of America's most popular breeds. Today, Maine Coons consistently rank among the top 5 most popular cat breeds in North America and Europe."

  - id: "behavior"
    title: "Maine Coon Temperament and Behavior"
    style: "default"

    subsections:
      - subtitle: "The Gentle Giant"
        text: "Maine Coons are famous for gentle, friendly temperaments despite their imposing size. Breeders describe them as 'gentle giants'—large, powerful cats that show remarkable patience and docility. They typically get along well with children, dogs, and other cats, making them excellent family pets. Unlike some breeds that become aggressive when frightened, Maine Coons generally respond to stress by retreating rather than attacking. This gentle nature likely reflects the breed's working-cat heritage—aggressive barn cats were less likely to be tolerated by farmers, creating selection pressure for friendly temperament."

      - subtitle: "Chirping and Vocalizations"
        text: "Maine Coons rarely meow in the typical cat fashion. Instead, they produce distinctive chirping or trilling sounds—melodious, rising vocalizations that sound more bird-like than cat-like. They use these chirps to greet people, request attention, or express contentment. Some Maine Coons are quite 'talkative,' maintaining running conversations with their owners through varied chirps and trills. This unusual vocalization pattern distinguishes Maine Coons from most domestic cats and adds to their distinctive character. The evolutionary origin of this behavior remains unknown, though it may relate to their purported ship-cat ancestry where quiet vocalizations avoided disturbing crews."

      - subtitle: "Water Fascination"
        text: "Many Maine Coons show unusual fascination with water compared to typical domestic cats. They often play with water bowls, dip paws in water, and some enjoy being near running water. A few Maine Coons tolerate or even enjoy swimming, though this varies individually. This water tolerance may relate to their water-resistant coats or ship-cat heritage where cats necessarily adapted to maritime environments. Modern Maine Coons often play with water fountains, fish in sinks, or watch showers with interest—behaviors that delight owners accustomed to water-averse cats."

      - subtitle: "Intelligence and Trainability"
        text: "Maine Coons demonstrate high intelligence and problem-solving ability. They can learn to open doors, turn on faucets, and solve puzzle feeders. Many Maine Coons retrieve toys like dogs, respond to names consistently, and learn commands including sit, come, and high-five. This intelligence reflects their working-cat heritage where problem-solving and adaptability were essential for survival. Their trainability makes them suitable for leash walking, trick training, and interactive play. However, their intelligence also means Maine Coons become bored without adequate mental stimulation, potentially leading to destructive behaviors in under-stimulated individuals."

  - id: "conservation"
    title: "The Breed Today"
    style: "default"
    paragraphs:
      - "Maine Coons are now one of the world's most popular cat breeds, ranking consistently in the top 5 in North America and Europe. The breed recovered from near-extinction in the mid-1900s to achieve remarkable success in the modern cat fancy. However, this popularity creates new challenges including health issues from inbreeding, commercial breeding operations prioritizing profit over health, and dilution of breed type as breeders chase extreme features that may compromise the working-cat characteristics that define authentic Maine Coons."

    subsections:
      - subtitle: "Breed Standards and Registration"
        text: "All major cat registries including the Cat Fanciers' Association, The International Cat Association, and international organizations maintain Maine Coon breed standards defining ideal characteristics. These standards emphasize the breed's natural appearance, specifically avoiding the extreme features (ultra-flat faces, tiny ears, etc.) that characterize some modified breeds. Reputable breeders register cats with recognized registries, maintaining pedigrees documenting ancestry. However, many cats marketed as 'Maine Coons' lack registration and may not represent authentic breed type, instead being large longhaired mixed-breed cats."

      - subtitle: "Health Considerations"
        text: "Maine Coons face several genetic health concerns common in purebred cats. Hypertrophic cardiomyopathy (HCM), a heart condition, affects a significant percentage of Maine Coons and can cause sudden death in apparently healthy cats. Hip dysplasia, typically associated with large dogs, also occurs in Maine Coons due to their size. Spinal muscular atrophy (SMA), a genetic muscle disorder, appears in some lines. Responsible breeders test breeding cats for these conditions and screen out affected individuals. Buyers seeking healthy Maine Coons should choose breeders who perform genetic testing and provide health guarantees."

      - subtitle: "Preservation of Working Type"
        text: "Some Maine Coon enthusiasts worry that modern breeding emphasizes show-ring success over the working-cat characteristics that defined original Maine Coons. Show breeding sometimes produces cats with extremely long coats requiring constant grooming, exaggerated ear tufts, and such large size that cats become sedentary—traits incompatible with working farm cats. Preservation breeders deliberately maintain 'old-fashioned' or 'traditional' Maine Coons emphasizing moderate features, active temperaments, and low-maintenance coats. This tension between show-ring success and authentic breed type appears in many heritage breeds and reflects broader questions about whether modern breeding serves animals' welfare."

      - subtitle: "Maine Coon Rescues"
        text: "Maine Coon popularity has created a rescue and rehoming network for purebred and mixed-breed Maine Coons. Owners sometimes surrender cats due to size (underestimating how large Maine Coons grow), grooming requirements, or lifespan commitments. Commercial breeders occasionally retire breeding cats needing homes. Maine Coon-specific rescue organizations operate throughout North America, screening adopters and matching cats to appropriate homes. These rescues also educate potential owners about breed characteristics, helping prevent mismatches between owners and cats that lead to surrender."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Maine Coon connects to Maine's state motto, 'Dirigo' (I lead), adopted in 1820. Maine led the nation by becoming the first state to designate an official state cat, creating a new category of state symbols. The Maine Coon itself led American cat fancy—winning Best Cat at one of America's first major cat shows in 1895. Despite near-extinction, dedicated Maine breeders led the effort to preserve the breed when it faced disappearance. The breed designation celebrates this leadership in both symbolic recognition and breed conservation."
      - "Maine designated the moose as state animal in 1979, six years before adopting the Maine Coon. Both symbols represent successful adaptation to Maine's harsh climate—moose through long legs for deep snow and massive size, Maine Coons through insulating coats and tufted paws. Both nearly faced extinction in Maine (moose from overhunting, Maine Coons from changing fashions) but recovered through dedicated conservation efforts. The paired symbols demonstrate that Maine values both wild and domestic animals that embody resilience and adaptation to northern conditions, similar to patterns shown in [states neighboring states](/rankings/geography/states-neighboring-states)."

    subsections:
      - subtitle: "White Pine and Maine Maritime Heritage"
        text: "Maine's state tree, the white pine, historically provided masts for sailing ships that connected Maine to global maritime trade. Maine Coon origins likely involve ship cats brought to Maine ports aboard these vessels. Both symbols represent Maine's maritime heritage—white pines providing the physical ships while ship cats controlling rodents made long voyages possible. The connection between Maine's forests and its seagoing traditions appears in both symbols, acknowledging that Maine's identity involves both inland forests and coastal maritime culture."
        link:
          label: "See Maine state tree"
          url: "/states/maine/tree/white-pine"

      - subtitle: "Chickadee and Winter Survival"
        text: "Maine's state bird, the black-capped chickadee, shares with the Maine Coon an ability to survive Maine's brutal winters. Both species evolved specific adaptations for cold—chickadees through physiological changes allowing torpor, Maine Coons through thick insulating coats and behavioral adaptations. Both symbols represent Maine's winter character and the adaptations required to thrive in northern New England; see the [Maine state bird page](/states/maine/bird/black-capped-chickadee). The chickadee's small size and the Maine Coon's large size represent different survival strategies, yet both succeed in Maine's climate."
        link:
          label: "See Maine state bird"
          url: "/states/maine/bird/black-capped-chickadee"

      - subtitle: "State Motto and Leadership"
        text: "Maine's motto 'Dirigo' (I lead) applies to the Maine Coon designation in multiple ways. Maine led by creating the first state cat symbol, pioneering a new category other states have considered but not adopted. The state led in breed preservation when dedicated Maine breeders saved Maine Coons from extinction despite national trends favoring exotic imports. The breed itself led American cat fancy in its early years, winning major shows before imported breeds overshadowed native breeds. The designation celebrates leadership in symbolic innovation and breed conservation, explained further on the [Maine state motto page](/states/maine/motto/dirigo)."
        link:
          label: "See Maine state motto"
          url: "/states/maine/motto/dirigo"

