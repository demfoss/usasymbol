faq:
  - question: "What is Maine's state cat?"
    answer: "Maine's state cat is the Maine Coon (Felis catus), designated in 1985. Maine is the first and only U.S. state to designate an official state cat. The Maine Coon is one of the oldest natural North American cat breeds and originated in Maine."

  - question: "When was the Maine Coon designated as Maine's state cat?"
    answer: "The Maine Coon became Maine's official state cat on May 16, 1985, through Legislative Document 1283. This made Maine the first state to adopt an official state cat, creating a new category of state symbols."

  - question: "Why did Maine choose the Maine Coon as its state cat?"
    answer: "Maine chose the Maine Coon because it is the only cat breed that originated in Maine and one of the few breeds native to North America. The breed developed naturally in Maine's harsh climate as working farm cats, representing the state's agricultural heritage, resilience, and adaptation to northern conditions. The designation honored Maine's role as birthplace of this distinctive breed."

  - question: "How big do Maine Coon cats get?"
    answer: "Maine Coons are one of the largest domestic cat breeds. Males typically weigh 13-18 pounds, with some exceeding 20 pounds. Females weigh 8-12 pounds. They measure 10-16 inches tall at the shoulder and 19-40 inches long including their bushy tails. Maine Coons take 3-4 years to reach full size, unlike most cats that mature by 1-2 years."

  - question: "Where did Maine Coon cats come from?"
    answer: "Maine Coons originated in Maine during the 1800s, developing naturally from longhaired cats brought to North America by maritime traders or possibly Vikings, which then adapted to Maine's climate. Despite colorful legends about breeding with raccoons or descending from Marie Antoinette's cats, genetic evidence shows Maine Coons are purely domestic cats that evolved through natural selection in Maine's environment."

  - question: "What makes Maine Coon cats special?"
    answer: "Maine Coons are distinguished by large size, long shaggy coats, tufted ears, bushy tails, and tufted paws. They have friendly 'gentle giant' temperaments, unusual chirping vocalizations, water tolerance, high intelligence, and adaptability to cold climates. Their characteristics developed naturally through adaptation to Maine's harsh environment and work as farm mousers."

  - question: "Are Maine Coon cats good pets?"
    answer: "Maine Coons make excellent pets for families due to their gentle, friendly temperaments, patience with children, and ability to coexist peacefully with dogs and other cats. They are intelligent, playful, and interactive. However, they require regular grooming due to long coats, need adequate space due to large size, and benefit from mental stimulation due to high intelligence."

  - question: "Did Maine Coons almost go extinct?"
    answer: "Yes, Maine Coons nearly went extinct in the early-to-mid 1900s when exotic imported breeds became fashionable and Maine Coons were considered old-fashioned farm cats. By the 1950s, the breed was rare even in Maine. The Central Maine Cat Club, formed in 1953, led preservation efforts that saved the breed. Maine Coons recovered and are now one of the most popular cat breeds worldwide."

