seo_description: "Maine's state cat is the Maine Coon Cat, adopted in 1985. Learn why this official Maine symbol was chosen and what it represents."

intro_text: "The Maine Coon Cat is the official Maine state cat, designated in 1985. This page gives the direct answer for searches like 'maine state cat', 'maine state animal', and 'maine state mammal' while explaining how the symbol fits the state's official animal designations. Being one of largest domestic cat breeds, distinctive shaggy coat and tufted ears, gentle 'gentle giant' temperament, Maine origins."

