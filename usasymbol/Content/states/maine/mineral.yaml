faq:
  - question: What is Maine's state mineral?
    answer: "Maine's state mineral is tourmaline, a borosilicate gem mineral adopted by the Maine Legislature in 1971."
  - question: When did Maine adopt tourmaline as its state mineral?
    answer: "The Maine Legislature designated tourmaline the official state mineral in 1971."
  - question: Why did Maine choose tourmaline?
    answer: "Maine's Oxford County pegmatites have produced gem tourmaline since its first discovery at Mount Mica in 1820, including a 1972 find of world-class watermelon tourmaline near Newry."
  - question: Where can you find tourmaline in Maine?
    answer: "Oxford County holds Maine's best-known tourmaline sites, including Mount Mica in Paris and Plumbago Mountain near Newry, both on private land with occasional club-organized collecting trips."

