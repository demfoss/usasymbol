  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Tourmaline Facts"
    facts:
      - "Adopted as Maine's state mineral in 1971."
      - "Maine's first documented gem tourmaline discovery came at Mount Mica in Paris in 1820."
      - "A 1972 find on Plumbago Mountain near Newry produced some of the largest and finest watermelon tourmaline crystals ever recovered in North America."
      - "Tourmaline was named the U.S. national gemstone in 1970, a year before Maine adopted it as the state mineral."

