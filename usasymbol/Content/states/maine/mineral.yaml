seo_title: "Maine State Mineral | Tourmaline"
seo_description: "Maine's state mineral is tourmaline, adopted in 1971. First found at Mount Mica in 1820, it remains one of the finest gem tourmalines in the world."
hero_image: /images/minerals/maine/maine-state-mineral-hero.webp
