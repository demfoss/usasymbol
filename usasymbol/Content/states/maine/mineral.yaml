hero_image_caption: "Tourmaline, Maine's official state mineral, has been mined from Oxford County pegmatites since 1820."
intro_text: "Maine's state mineral is tourmaline, adopted in 1971 and first discovered in the state at Mount Mica in Paris in 1820, one of the earliest gem tourmaline finds in the United States. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Maine State Mineral
    paragraphs:
      - "Tourmaline is Maine's official state mineral, designated by the Maine Legislature in 1971. Gem-quality tourmaline from Oxford County's pegmatite deposits has drawn collectors and mineralogists to the state for two centuries."
      - "Maine was a natural choice for this symbol because its tourmaline ranks among the finest found anywhere, including a landmark 1972 discovery that produced some of the largest gem tourmaline crystals ever recovered in North America."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Tourmaline?"
    paragraphs:
      - "Tourmaline is a complex borosilicate mineral that grows in vivid colors, including green, pink, blue, and the bicolor pink-and-green combination known as watermelon tourmaline. Maine's pegmatites have produced especially prized examples of this two-toned variety."
      - "Maine tourmaline is a variety of elbaite, one of several tourmaline species, and forms as elongated, striated crystals with a glassy shine. Tourmaline crystallizes late in the cooling of a pegmatite, in gas- and fluid-rich pockets where elements can concentrate before hardening."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Maine Chose Tourmaline as Its State Mineral"
    paragraphs:
      - "Maine's tourmaline story begins on Mount Mica in Paris, where two students, Elijah Hamlin and Ezekiel Holmes, found green crystals in 1820, among the first documented gem tourmaline discoveries in the country. Mining and collecting there continued on and off for more than a century afterward."
      - "In 1972, a discovery on Plumbago Mountain near Newry produced world-class watermelon tourmaline and large rubellite crystals, a find that drew international attention from mineral museums and collectors. That combination of a long mining history and internationally significant finds made tourmaline an easy choice for state mineral."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Tourmaline Became Maine's State Mineral"
    paragraphs:
      - "The Maine Legislature designated tourmaline the official state mineral in 1971, a year after tourmaline was named the U.S. national gemstone, recognizing more than a century of mining tied to Oxford County's pegmatite belt."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Tourmaline Is Found in Maine"
    paragraphs:
      - "Oxford County holds Maine's best-known tourmaline deposits, including Mount Mica in Paris, the site of the state's first gem tourmaline discovery in 1820, and Plumbago Mountain near Newry, source of the 1972 find that produced the celebrated 'Jolly Green Giant' crystal. Both sites are on private land, though local mineral clubs occasionally organize collecting trips."
    sites:
