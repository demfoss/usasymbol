faq:
- question: What is Maine's state fossil?
  answer: "Maine's state fossil is the Pertica plant (Pertica quadrifaria), an early vascular land plant from the Devonian period, about 390 million years ago. It was designated the state fossil in 1976."
- question: When did Maine adopt its state fossil?
  answer: "Maine designated Pertica quadrifaria as its official state fossil in 1976, four years after the species was first formally described in 1972."
- question: What did the Pertica plant look like?
  answer: "Pertica quadrifaria was an upright plant about 3 feet (1 meter) tall with a main stem and lateral branches arranged in whorls of four. It had no true leaves — only small forked appendages at the branch tips. It would have looked something like a slender, branching green pole growing in a wet lowland."
- question: Where are Pertica plant fossils found in Maine?
  answer: "All known Pertica quadrifaria fossils come from the Trout Valley Formation in northern Maine, northeast of Baxter State Park in Piscataquis County. The outcrops are remote shale exposures in a roadless wilderness area. No other locality in the world has produced specimens of this species."
- question: When did the Pertica plant live?
  answer: "Pertica quadrifaria lived during the Early Devonian, about 390 million years ago. The entire genus went extinct by the end of the Devonian, about 358 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "Maine designated the Pertica plant in 1976, shortly after it was formally described to science in 1972. The plant's exclusive occurrence in Maine — found nowhere else on Earth — made it a natural choice as a symbol tied directly to the state's own geology."

