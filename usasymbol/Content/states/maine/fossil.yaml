intro_text: "Maine's state fossil is the Pertica plant (Pertica quadrifaria), one of the earliest complex vascular land plants on Earth, found only in northern Maine's Devonian Trout Valley Formation and officially designated in 1976. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Maine State Fossil
  paragraphs:
  - "The Pertica plant is Maine's official state fossil, designated in 1976. Pertica quadrifaria is an extinct early land plant from the Devonian period, about 390 million years ago, when plants were just beginning to colonize the land and forests as we know them did not yet exist. Maine is the only place in the world where Pertica quadrifaria has been found."
  - "The fossils are preserved as flattened compressions in dark shale, showing the branching pattern of the stems and small appendages in fine detail. They come from the Trout Valley Formation in the remote forests of northern Maine, one of the more unusual type localities of any U.S. state fossil."

- id: about
  icon: fa-solid fa-paw
  title: What the Pertica Plant Was
  paragraphs:
  - "Pertica quadrifaria was an upright land plant that grew to about 3 feet (1 meter) tall. It had a main vertical stem with lateral branches arranged in whorls of four — that is what quadrifaria means, four-ranked — each branch dividing repeatedly into smaller forks. It had no true leaves. Instead of flat leaf blades, the branches ended in small, dichotomously forking appendages that bore spore-producing organs."
  - "It was a vascular plant, meaning it had internal tissue for conducting water and nutrients up through the stem, a key adaptation for surviving on land. But it was far simpler than a modern fern or tree. It reproduced by spores, not seeds, and grew in low, wet habitats near Devonian rivers and coastal margins."
  - "Pertica quadrifaria lived during a critical window in the history of life on land. The Devonian period saw the first forests, the first tree-sized plants, and the rapid diversification of plant body plans from simple coastal mats into tall, shading canopies."

- id: history
  icon: fa-solid fa-landmark
  title: How the Pertica Plant Became Maine's State Fossil
  paragraphs:
  - "Pertica quadrifaria was formally described in 1972, just four years before Maine designated it the state fossil. The specimens came from the Trout Valley Formation in northern Maine — shale outcrops in the remote forests near Baxter State Park — and were new to science at the time of description."
  - "The choice reflected the fossil's direct connection to Maine. Pertica quadrifaria has been found nowhere else: every known specimen comes from the Trout Valley Formation in the state."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Pertica Plant Fossils Are Found in Maine
  paragraphs:
  - "All known Pertica quadrifaria fossils come from the Trout Valley Formation in northern Maine, in the wilderness area northeast of Baxter State Park in Piscataquis County. The fossils occur as compressions in fine-grained dark shale, deposited in a Devonian river delta or coastal lowland about 390 million years ago. The outcrops are in a remote, roadless area accessible only on foot or by floatplane."
  - "The type specimens — the fossils used to formally describe the species — are held at research collections rather than in a public museum. The outcrops cover a limited area and the formation is not widely exposed, so the total known specimen count is far smaller than most state fossils found in river banks or quarry walls."
