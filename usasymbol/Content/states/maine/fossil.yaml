- id: facts
  icon: fa-solid fa-lightbulb
  title: Pertica Plant Facts
  facts:
  - "Maine designated Pertica quadrifaria as its state fossil in 1976, just four years after the species was formally described to science in 1972."
  - "Every confirmed Pertica quadrifaria specimen in the world comes from a single formation in northern Maine — it has not been found anywhere else on Earth."
  - "The species name quadrifaria means four-ranked, referring to the lateral branches arranged in whorls of four along the main stem."
  - "Pertica had no true leaves: its photosynthetic surface was provided by small forked appendages at the tips of its branches."
  - "It lived about 390 million years ago, during the Devonian explosion of land plants, when the first forests were forming and the tallest plants on Earth were beginning to shade the ground."

