intro_text: "Maine's state rock is granitic pegmatite, adopted in 2023 as the coarse-grained rock whose crystal-lined pockets have made Oxford County one of the country's most productive gem-hunting regions. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Maine State Rock
    paragraphs:
      - "Granitic pegmatite is Maine's official state rock, designated by the 131st Maine Legislature in 2023. It shares granite's basic ingredients but grows far larger crystals, and Maine's pegmatites are the source rock for the state's tourmaline, one of the state's best-known natural resources."
      - "Lawmakers chose it to tie two of Maine's state symbols together: tourmaline, the state mineral since 1971, forms almost entirely within granitic pegmatite deposits."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Granitic Pegmatite?"
    paragraphs:
      - "Granitic pegmatite is a coarse-grained igneous rock with roughly the same minerals as granite, mainly feldspar and quartz, but with crystals that can grow from inches to feet across. It forms in the final stages of a magma body cooling underground, when leftover water and other fluids let ions move freely and crystallize quickly into large grains."
      - "Those same fluid-rich pockets are where gem minerals like tourmaline, beryl, and colorful varieties of quartz can grow. Historically, Maine pegmatites were also mined for feldspar, mica, and quartz used in industry."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Maine Chose Granitic Pegmatite as Its State Rock"
    paragraphs:
      - "Oxford County's pegmatite belt has supplied gem minerals since the early 1800s and industrial minerals for decades before that, giving the region a mining identity built around this one rock type. Naming it the state rock connected that broader geologic story to tourmaline, the mineral symbol Maine had already recognized."
      - "State lawmakers said the designation was meant to celebrate Maine's geology and raise awareness of the natural resources tied to its pegmatite deposits, rather than to honor a single site or discovery."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Granitic Pegmatite Became Maine's State Rock"
    paragraphs:
      - "The Maine Legislature designated granitic pegmatite the official state rock in 2023, more than 50 years after tourmaline, the mineral it hosts, became the state mineral in 1971."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Granitic Pegmatite Is Found in Maine"
    paragraphs:
      - "Oxford County contains Maine's most productive pegmatite deposits, including Mount Mica in Paris and Plumbago Mountain near Newry, both long associated with the state's tourmaline mining."
    sites:
      - name: Mount Mica
        city: Paris
        lat: 44.2151
        lng: -70.5063
        note: "Historic granitic pegmatite tourmaline deposit"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Granitic Pegmatite Facts"
    facts:
      - "Adopted as Maine's state rock in 2023."
      - "Granitic pegmatite is the host rock for tourmaline, which became Maine's state mineral more than 50 years earlier, in 1971."
      - "Oxford County's pegmatites were historically mined for feldspar, mica, and quartz in addition to gem minerals."
      - "Pegmatite crystals can grow far larger than those in ordinary granite because leftover fluids in cooling magma let ions move and crystallize quickly."

