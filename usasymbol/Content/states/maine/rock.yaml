faq:
  - question: What is Maine's state rock?
    answer: "Maine's state rock is granitic pegmatite, a coarse-grained igneous rock adopted by the Maine Legislature in 2023."
  - question: When did Maine adopt granitic pegmatite as its state rock?
    answer: "The Maine Legislature designated granitic pegmatite the official state rock in 2023."
  - question: Why did Maine choose granitic pegmatite?
    answer: "Granitic pegmatite is the host rock for tourmaline, Maine's state mineral, and its Oxford County deposits have supplied gem and industrial minerals for two centuries."
  - question: Where can you find granitic pegmatite in Maine?
    answer: "Oxford County holds Maine's best-known pegmatite deposits, including Mount Mica in Paris and Plumbago Mountain near Newry."

