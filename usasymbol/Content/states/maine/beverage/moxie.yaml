seo_title: "Maine State Soft Drink | Moxie"
seo_description: "Maine named Moxie its official soft drink in 2005, honoring the bitter soda that grew from a local tonic into a cult symbol."
intro_text: <strong>Moxie is Maine's official state soft drink</strong>, designated in <strong>2005</strong> by an act signed by Governor John Baldacci. The drink predates Coca-Cola, started life as a patent medicine called <em>Moxie Nerve Food</em>, and tastes like nothing else on a convenience store shelf — a sweet-bitter combination driven by gentian root that has divided drinkers for over a century. It is one of the few drinks that belongs to a single state the way a landscape or a dialect does. Today the word <em>moxie</em> — meaning nerve, guts, resilience — is a standard entry in the American dictionary. The drink came first. So did Maine.
