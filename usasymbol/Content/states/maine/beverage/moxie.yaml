sections:
- id: what-moxie-tastes-like
  icon: fa-solid fa-flask
  title: What Moxie Actually Tastes Like
  paragraphs:
  - Most soft drinks land somewhere between sweet and sweeter. Moxie goes somewhere else entirely. The first sip delivers a familiar cola-adjacent sweetness, and then the gentian root arrives — a dry, medicinal bitterness that spreads across the back of the palate and lingers. People who do not expect it often stop mid-sip. People who grew up on it stop noticing.
  - Gentian root is the ingredient that separates Moxie from everything else in a vending machine — one of the most intensely bitter plant compounds in common use, with a dry herbal finish that no amount of sweetener fully cancels.
  - 'Calling Moxie an acquired taste is accurate but slightly misleading. It implies the bitterness is a flaw you learn to overlook. For devoted drinkers, the bitterness is the appeal: a flavor with actual character, in a category that largely gave up on character sometime in the mid-twentieth century.'
- id: how-moxie-began
  icon: fa-solid fa-clock-rotate-left
  title: 'Moxie Nerve Food: The Medicine That Became a Soda'
  paragraphs:
  - "Dr. Augustin Thompson was a native of Union, Maine, working in Lowell, Massachusetts when he developed a concentrated liquid he called <strong>Moxie Nerve Food</strong>. The marketing made remarkable claims: the formula would treat loss of manhood, softening of the brain, paralysis, and general nervousness. It was a patent medicine — the era's elastic catch-all for anything sold as a health claim, in the years before federal law required proof of any kind."
  - The early product was not carbonated. Thompson's Nerve Food was a thick syrup meant to be taken in small doses as a tonic. Carbonation came later, as the drink transitioned from medicine cabinet to soda fountain. By the 1880s, Moxie was being sold as a carbonated beverage and was already on its way to becoming one of the most heavily advertised products in the northeastern United States.
  - Thompson leaned hard into promotion. Horse-drawn Moxie wagons circulated through cities. Billboards went up across New England. The brand's imagery — a confident man in a top hat pointing directly at the viewer — became genuinely famous. At its peak in the early twentieth century, Moxie outsold Coca-Cola in New England. Pepsi and Coca-Cola's postwar national expansion eventually cut it down — not by being better, but by being everywhere.
- id: why-maine-claimed-it
  icon: fa-solid fa-landmark
  title: Why Maine Designated Moxie Its Official State Soft Drink
  paragraphs:
  - Moxie's Maine credentials do not require argument. Thompson was born in Union, Maine — the same town where the Moxie Museum now stands. The annual Moxie Festival runs in Lisbon Falls. The pockets of genuine loyalty — families who keep it in the refrigerator, stores that stock it prominently — have always been densest in Maine. When the legislature voted in 2005, it was not inventing a connection. It was acknowledging one that had been in place for a century.
  - 'By 2005, Moxie had survived nearly 130 years, outlasting hundreds of regional soft drinks that collapsed once national brands arrived. Designating it was a way of recognizing a shared stubbornness: the drink kept going, Maine kept drinking it, and neither apologized for it.'
  - The designation passed without significant opposition. Moxie's Maine credentials were not in dispute. The only real question was why it had taken this long.
- id: festival-and-legacy
  icon: fa-solid fa-star
  title: The Moxie Festival and the Drink That Never Left Maine
  paragraphs:
  - The <strong>Moxie Festival</strong> in Lisbon Falls has run annually for decades, drawing tens of thousands of people each summer for parades, carnival rides, vintage Moxie merchandise, and the particular community pleasure of celebrating something that the rest of the country has largely never heard of. The festival is not ironic. People in Lisbon Falls are not celebrating Moxie because it is eccentric — they are celebrating it because they like it.
  - "The <strong>Moxie Museum</strong> in Union preserves the advertising history, the bottles, the signage, and the documentary record of how a Maine doctor's tonic became a New England institution. The collection covers the full arc: from the patent-medicine era, through the soda-fountain years, through the mid-century decline, and into the present moment when Moxie maintains a cult following that national brands spend millions trying to manufacture and mostly cannot."
  - Moxie is still available across New England, with its strongest retail presence in Maine. It is distributed by the Coca-Cola system nationally, which means it appears on shelves far from its origins — but it travels oddly. Outside of Maine, buying a Moxie tends to feel like a novelty. Inside Maine, it is still just a soft drink. That difference is what the 2005 designation was acknowledging.
timeline:
- year: c. 1876
  description: Dr. Augustin Thompson, a Union, Maine native working in Lowell, Massachusetts, develops Moxie Nerve Food — a medicinal tonic marketed for fatigue, nervousness, and general debility.
- year: '1884'
  description: Thompson patents the Moxie formula and begins selling the carbonated version at soda fountains across New England. The beverage transitions from tonic to soft drink.
- year: 1880s–1900s
  description: Moxie becomes one of the most heavily advertised soft drinks in the United States, briefly outselling Coca-Cola in New England at its peak. Horse-drawn Moxie wagons and aggressive billboard campaigns build the brand's fame.
- year: Mid-20th century
  description: National distribution by larger competitors erodes Moxie's market share. The drink's reach contracts toward its New England stronghold, particularly Maine.
- year: '2005'
  description: Maine Governor John Baldacci signs legislation designating Moxie as the official state soft drink of Maine — the first state in the country to designate Moxie.
faq:
- question: What is Maine's official state soft drink?
  answer: Maine's official state soft drink is Moxie. The state designated it in 2005 under legislation signed by Governor John Baldacci.
- question: When did Maine designate Moxie as its state soft drink?
  answer: Maine designated Moxie as the official state soft drink in 2005.
- question: Who invented Moxie?
  answer: Dr. Augustin Thompson, a native of Union, Maine, developed the original formula in the 1870s while working in Lowell, Massachusetts. He marketed it initially as Moxie Nerve Food, a medicinal tonic.
- question: Why does Moxie taste so bitter?
  answer: Moxie's distinctive bitterness comes from gentian root extract, a plant used in herbal medicine for its intensely bitter compounds. Thompson included it because the bitterness made the drink seem medicinal — part of its original identity as a health tonic.
- question: Is Moxie really one of the earliest mass-produced soft drinks?
  answer: Yes. Moxie's carbonated formula dates to 1884, putting it among the earliest nationally advertised soft drinks in the United States. At its peak in the late 19th and early 20th centuries, it outsold Coca-Cola in parts of New England.
- question: Where is the Moxie Festival held?
  answer: The Moxie Festival is held annually in Lisbon Falls, Maine. It is a long-running summer event drawing thousands of visitors with parades, Moxie merchandise, and community celebration of the drink's Maine identity.
- question: Where is the Moxie Museum?
  answer: The Moxie Museum is located in Union, Maine — the hometown of the drink's inventor, Dr. Augustin Thompson. It preserves advertising materials, bottles, and the full documentary history of the brand.
- question: Why is Moxie considered a distinctly Maine drink?
  answer: Moxie was invented by a Maine native, its museum is in Union, Maine, its annual festival is in Lisbon Falls, and Maine has always been the region of strongest loyalty to the brand. The 2005 state designation formalized a cultural connection that had been in place for well over a century.
