      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maine State Flag Facts"
    facts:
      - "Maine replaced its short-lived 1901 pine tree flag with the current blue coat-of-arms design in 1909"
      - "The state coat of arms on the flag dates to 1820"
      - "Maine used a different pine tree flag from 1901 to 1909"
      - "The motto Dirigo means I lead in Latin"
      - "A North Star appears above the state coat of arms"
      - "The flag features a pine tree, moose, farmer, and sailor"

faq:
  - question: "What is the official state flag of Maine?"
    answer: "The Maine state flag is the official banner of Maine. It features the state coat of arms showing a pine tree, moose, farmer, and sailor on a blue field."

  - question: "How would you describe the design of the Maine state flag?"
    answer: "The flag shows the Maine coat of arms centered on a blue background. The coat of arms includes a pine tree with a moose beneath it, flanked by a farmer and sailor, with the North Star above and the motto Dirigo below."

  - question: "How do historians explain the symbolism of Maine's flag?"
    answer: "The flag represents Maine's natural resources and economy. The pine tree symbolizes forests, the moose represents wildlife, and the farmer and sailor show agriculture and maritime trade."

  - question: "What does the Maine state flag represent?"
    answer: "The flag means leadership and direction through its motto Dirigo. The North Star emphasizes Maine's northern geographic position. The coat of arms shows the foundations of Maine's economy and identity."

  - question: "How is Maine's flag usually described?"
    answer: "Dirigo is Latin for I lead or I direct. The motto refers to Maine's position as the northernmost state in New England and the easternmost point in the continental United States."

  - question: "Which person or group shaped the current Maine flag?"
    answer: "No single designer is credited with the Maine state flag. The 1909 design emerged from the state coat of arms that had existed since 1820."

  - question: "When did Maine adopt its current state flag?"
    answer: "Maine adopted its current state flag in 1909."

  - question: "How are the colors of the Maine state flag described?"
    answer: "The original Maine state flag from 1901 to 1909 was buff-colored with a green pine tree and blue North Star. It was replaced in 1909 with the current blue flag featuring the coat of arms."

