seo_title: "Maine State Flag: Farmer, Sailor, Moose & Pine Tree"
seo_description: "Maine's flag coat of arms shows a farmer and a sailor flanking a moose and white pine — distinctly pastoral imagery. What each element on the 1909 flag means."

intro_text: "The official state flag of Maine dates to 1909 and includes the state coat of arms on a blue background, with broader context on the [list of U.S. state flags](/symbols/flags). A pine tree stands in the center of the coat of arms beneath a North Star. The state motto Dirigo appears on a banner below and is detailed on the [Maine state motto page](/states/maine/motto/dirigo)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Maine State Flag Is Designed"
    paragraphs:
      - "The Maine state flag is the official flag of Maine. A blue field covers the entire background. The state coat of arms sits in the center showing a pine tree, a moose, a farmer, and a sailor."
      - "The North Star appears above the shield. The word Dirigo sits on a banner beneath the star. This Latin motto means I lead or I direct. State buildings, schools, and public venues across Maine display this flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Maine Flag Communicates"
    paragraphs:
      - "The flag represents Maine's natural resources and geographic position through the coat of arms. The imagery emphasizes forestry, maritime trade, and agriculture as foundations of Maine's economy and identity, especially through [the Pine Tree State nickname](/states/maine/nickname/the-pine-tree-state)."
      - "The North Star symbolizes Maine's location as the northernmost state in New England. The motto Dirigo reinforces this geographic significance. Maine leads the way as the first state to see sunrise in the continental United States."
      - "The pine tree represents Maine's vast forests. The moose shows native wildlife. The farmer and sailor represent land-based and maritime labor that built Maine's economy, including habitat linked to the [Maine state tree](/states/maine/tree/white-pine)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Maine Flag History and Adoption"
    paragraphs:
      - "Maine introduced its current state flag in 1909. The legislature approved a design featuring the state coat of arms on blue. The coat of arms itself dated to 1820 when Maine separated from Massachusetts and became a state."
      - "Before 1909, Maine used a different flag design. From 1901 to 1909, the state flew a buff-colored flag with a pine tree and blue star. That earlier design proved unpopular and difficult to manufacture consistently."
      - "No single designer is credited with the 1909 flag. The design emerged from existing state symbols. The coat of arms had appeared on state documents and seals for decades before becoming part of the flag."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Maine Flag"
    versions:
      - name: "Pine Tree Flag"
        years: "1901–1909"
        image: "versions/pine-tree-1901.webp"
        description: "A buff-colored flag with a green pine tree and blue North Star, used briefly before being replaced."

      - name: "Current Coat of Arms Flag"
        years: "1909–present"
        image: "versions/current-1909.webp"
        description: "The official Maine state flag featuring the state coat of arms on a blue field."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Maine Flag"
    symbols:
      - id: coat-of-arms
        name: "Maine Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The coat of arms depicts a pine tree, a moose, a farmer, and a mariner. Maine adopted this design in 1820. A shield shows a pine tree with a moose resting beneath it. A farmer leans on a scythe on the left side. A sailor rests on an anchor on the right side."
          - "The pine tree represents Maine's lumber industry and forests. The moose symbolizes wildlife native to Maine. The farmer and sailor represent the two main sources of livelihood in early Maine: agriculture and maritime trade."
          - "The North Star sits above the shield. A banner with the motto Dirigo curves below the star. This arrangement emphasizes Maine's northern location and leadership position."

      - id: dirigo
        name: "State Motto Dirigo"
        image: "symbols/dirigo.svg"
        paragraphs:
          - "The word Dirigo appears on a banner within the coat of arms. This Latin word means I lead or I direct. Maine adopted this motto in 1820 when it became a state."
          - "The motto refers to Maine's geographic position. Maine is the northernmost state in New England and the easternmost point in the continental United States. The North Star above the motto reinforces this directional symbolism."

      - id: field
        name: "Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "The blue background covers the entire flag. Maine chose blue to match other state flags and to demonstrate loyalty to the Union."
          - "The shade of blue matches the blue used in the United States flag. This connection emphasizes Maine's place within the nation."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Maine State Flag Colors"
    paragraphs:
      - "The flag uses blue, green, brown, tan, yellow, and white. Blue forms the field. Green appears in the pine tree. Brown and tan show in the moose and human figures. Yellow highlights the North Star and banner, with palette context in [U.S. state colors](/symbols/colors)."
    colors:
      - name: "Blue"
        hex: "#003366"
      - name: "Green"
        hex: "#2D5016"
      - name: "Brown"
        hex: "#654321"
      - name: "Tan"
        hex: "#D2B48C"
      - name: "Yellow"
