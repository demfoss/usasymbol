sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Maine's State Treat?"
    paragraphs:
      - "The whoopie pie is Maine's official state treat, designated by the Maine Legislature in 2011. It is made of two soft, cake-like rounds with a sweet cream filling between them."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Whoopie Pie"
    paragraphs:
      - "A whoopie pie consists of two round, cake-like cookies, most often chocolate, sandwiched around a fluffy filling made from shortening or butter, sugar, and vanilla. It is closer in texture to a small cake than a traditional pie despite the name."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Whoopie Pie Became Maine's State Treat"
    paragraphs:
      - "In 2011, Maine lawmakers debated whether the whoopie pie or wild blueberry pie should become the state's official dessert. As a compromise, the Maine Legislature named wild blueberry pie the state dessert and created a separate designation, state treat, for the whoopie pie."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Maine Chose the Whoopie Pie"
    paragraphs:
      - "Whoopie pies have long been associated with Maine and Pennsylvania Dutch baking traditions, and Maine bakeries and roadside stands have sold them for generations. The compromise designation let lawmakers honor both the whoopie pie and the state's blueberry crop."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Whoopie Pie Facts"
    facts:
      - "Adopted as Maine's state treat in 2011."
      - "Created as a legislative compromise alongside wild blueberry pie, which became the state dessert the same year."
      - "Traditional whoopie pies use chocolate cake rounds with a sweet cream filling."

