faq:
  - question: "What is Maine's state treat?"
    answer: "Maine's state treat is the whoopie pie, adopted by the Maine Legislature in 2011."
  - question: "When did Maine adopt the whoopie pie as its state treat?"
    answer: "The Maine Legislature designated the whoopie pie the official state treat in 2011."
  - question: "Why did Maine choose the whoopie pie?"
    answer: "Lawmakers debated the whoopie pie against wild blueberry pie for state dessert in 2011 and settled the dispute by naming the whoopie pie the state treat instead."
  - question: "Is the whoopie pie the same as Maine's state dessert?"
    answer: "No. Maine's state dessert is wild blueberry pie, a separate designation also adopted in 2011."

