sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Maine?
  paragraphs:
  - "The Pink-edged Sulphur, Colias interior, is Maine's official state butterfly. The Maine Legislature designated it in 2023."
  - "Maine also has a separate state insect, the European honey bee, adopted much earlier in 1975."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Pink-edged Sulphur
  paragraphs:
  - "The Pink-edged Sulphur has plain yellow wings with a thin, faint pink line bordering the edges, a feature that gives the butterfly its name."
  - "Adults have a wingspan of about 1.5 to 2 inches, making it a small butterfly compared to species like the monarch."
  - "Caterpillars feed on blueberry plants, a link that ties the butterfly to one of Maine's signature crops."

- id: history
  icon: fa-solid fa-landmark
  title: How Maine Chose the Pink-edged Sulphur
  paragraphs:
  - "The Maine Legislature designated the Pink-edged Sulphur as the official state butterfly in 2023."
  - "The butterfly's caterpillars feed on wild blueberry plants, connecting the designation to Maine's blueberry barrens and farming heritage."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Pink-edged Sulphur in Maine
  paragraphs:
  - "The Pink-edged Sulphur is found across Maine, especially near blueberry barrens, open fields, and forest clearings where its caterpillars' host plants grow."

