faq:
- question: What is Maine's state butterfly?
  answer: "Maine's state butterfly is the Pink-edged Sulphur, adopted by the Maine Legislature in 2023."
- question: When did Maine adopt the Pink-edged Sulphur?
  answer: "Maine adopted the Pink-edged Sulphur as its official state butterfly in 2023."
- question: Why did Maine choose the Pink-edged Sulphur?
  answer: "The butterfly's caterpillars feed on wild blueberry plants, tying it to Maine's blueberry barrens and farming heritage."
- question: What does the Pink-edged Sulphur look like?
  answer: "It has plain yellow wings with a thin pink line along the edges and a wingspan of about 1.5 to 2 inches."
- question: Where is the Pink-edged Sulphur found in Maine?
  answer: "It is found statewide, especially near blueberry barrens, open fields, and forest clearings."
- question: Is the Pink-edged Sulphur the same as Maine's state insect?
  answer: "No. Maine's state insect is the European honey bee, adopted in 1975. The Pink-edged Sulphur is a separate designation, the state butterfly, adopted in 2023."

