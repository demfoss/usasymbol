seo_title: "Maine State Tree | Eastern White Pine"
seo_description: 'Maine made eastern white pine its state tree in 1945, connecting the symbol to mast pines, shipbuilding, logging, and the older pine-cone flower.'

intro_text: "Eastern White Pine has served as Maine's official state tree since 1945, but its connection to the state is much older. It appears across Maine's symbols and helps explain why Maine became known as the Pine Tree State. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Maine"
    paragraphs:
      - "Maine's official state tree is the Eastern White Pine, the tallest conifer in eastern North America. The tree reaches heights of 80 to 110 feet under typical Maine forest conditions. Before extensive logging, virgin white pines in Maine commonly exceeded 150 feet, with exceptional specimens reaching nearly 200 feet. The straight trunk can measure three to four feet in diameter at chest height. These massive dimensions made Maine's white pines the most valuable timber trees in colonial America and drove Maine's economy for over 200 years."
      - "The bark starts smooth and greenish-gray on young trees, developing irregular plates separated by furrows as the tree ages. Mature bark appears gray-brown with a somewhat scaly texture. The needles grow in bundles of five, each needle measuring two to five inches long. This five-needle arrangement distinguishes white pine from other pines in Maine. The needles appear soft, flexible, and blue-green. Long cylindrical cones hang from upper branches, measuring four to eight inches in length. The cones curve slightly and release winged seeds in fall."
      - "White pine grows throughout Maine from the coast to interior mountains. The species thrives on a variety of soil types but prefers well-drained sandy or loamy soils. Maine's climate provides ideal conditions for white pine growth. Young trees grow rapidly, adding 18 to 24 inches per year during peak growth periods. The tree forms pure stands on some sites and mixes with hardwoods like maple and birch on others. White pine forests cover millions of acres across Maine, making the species a defining feature of the state's landscape."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Eastern White Pine"
    paragraphs:
      - "The official name is Eastern White Pine to distinguish it from western white pine species. Mainers commonly call it white pine or simply pine. The scientific name Pinus strobus comes from Latin and Greek roots. Pinus is the Latin word for pine. Strobus derives from a Greek word for cone. Early colonists called these trees Weymouth pines after Captain George Weymouth who shipped Maine pine masts to England in 1605."
      - "The name white pine refers to the pale color of the wood, which appears nearly white when freshly cut. Loggers historically used the term pumpkin pine for the largest, clearest specimens with pinkish-orange heartwood. The species belongs to the Pinaceae family. Maine's white pines earned the nickname 'mast pines' during colonial times when the tallest, straightest trees became reserved for Royal Navy ship masts."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Eastern White Pine Became the Maine State Tree"
    paragraphs:
      - "Maine adopted the Eastern White Pine as its official state tree on February 20, 1945. The Maine Legislature passed a joint resolution recognizing the species as Maine's arboreal emblem. The designation formalized a relationship between Maine and white pine that had existed for centuries. Maine became known as 'The Pine Tree State' long before 1945, and the tree appeared on state symbols including the flag and seal adopted in the 1800s."
      - "Maine selected white pine because the tree shaped the state's entire history and economy. During colonial times, the tallest white pines in Maine became reserved by the British Crown for use as ship masts. British surveyors marked the best trees with a broad arrow symbol, claiming them for the Royal Navy. This Crown policy infuriated Maine colonists and contributed to revolutionary sentiment. After independence, Maine's white pine lumber industry became a cornerstone of the state's economy. The timber built homes, ships, and structures across New England and beyond, reflecting the leadership language on the [Maine state motto page](/states/maine/motto/dirigo)."
      - "The tree held immense economic value for Maine through the 19th and early 20th centuries. Maine logging operations harvested billions of board feet of white pine. The wood's light weight, straight grain, and ease of working made it ideal for construction and shipbuilding. Maine shipyards used white pine for ship decking, masts, and interior construction. The lumber industry employed thousands of Maine residents and created the state's legendary lumberjack culture. River drives floated millions of pine logs down Maine's rivers to sawmills. This heritage made white pine the obvious choice when Maine formalized its state tree designation."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maine State Tree Facts"
    facts:
      - "Maine adopted Eastern White Pine on February 20, 1945, though the tree appeared on Maine's flag and seal since the 1800s"
      - "The five-needle bundle is unique among northeastern pines - other common pines have two or three needles per bundle"
      - "Maine earned the nickname 'The Pine Tree State' because white pine forests once covered most of the state"
      - "Colonial Britain reserved the tallest Maine white pines for Royal Navy ship masts, marking them with a broad arrow and forbidding colonists from cutting them"
      - "Eastern White Pine is the tallest conifer in eastern North America, with pre-logging specimens in Maine reaching nearly 200 feet"
      - "The species can live 200 to 250 years in Maine forests, with some protected trees exceeding 400 years"
      - "White pine needles stay on the tree for 18 months before dropping, giving the tree a softer, fuller appearance than pines that hold needles longer"
      - "A single white pine tree appears prominently in the center of Maine's state flag, representing the state's forest heritage"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Maine State Tree and Flower"
    paragraphs:
      - "Maine's state flower is the White Pine Cone and Tassel, designated in 1895. The state adopted the pine cone as its floral emblem 50 years before officially recognizing the tree itself. Both symbols come from the same tree - the Eastern White Pine; see the [Maine state flower page](/states/maine/flower/white-pine-cone-and-tassel). The pine cone represents the tree's fruit, while the tassel refers to the male pollen-bearing flowers that appear in spring. Together, the state tree and state flower mark different aspects of Maine's most recognizable species. The pine cone and tassel appeared on Maine emblems before any other state symbol, reflecting the white pine's central role in Maine character."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Maine White Pine"
    paragraphs:
      - "Count the needles in each bundle for instant identification. White pine produces five needles per bundle, while other common Maine pines have two or three. The needles measure two to five inches long and feel soft and flexible compared to stiff needles on other pines. The needles appear blue-green rather than dark green. They grow in tufts at branch tips, creating a feathery appearance. Young trees display a more symmetrical, dense crown than mature trees."
      - "The bark changes dramatically with age. Young white pines show smooth greenish-gray bark with minimal texture. As trees mature, the bark develops irregular flat plates separated by shallow furrows. The plates can flake off in patches. Mature bark appears gray-brown with a shallower furrow pattern than most pines. The texture feels somewhat smooth compared to the rough, heavily plated bark of pines like red pine or pitch pine."
      - "Mature white pines develop a distinctive form in Maine forests. The straight trunk extends upward with whorls of horizontal branches arranged in layers. The crown becomes irregular with age as some branches die and others grow longer. Trees growing in open areas develop fuller, more symmetrical crowns. Forest-grown trees show tall, straight trunks with high crowns. The cones hang downward from branch tips in late summer and fall. Each cone curves slightly like a banana and has thin, flexible scales."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Maine State Tree Symbolizes"
    paragraphs:
      - "The Eastern White Pine represents Maine's independence and natural resources. The tree's colonial history connects to American independence - British restrictions on cutting mast pines fueled revolutionary anger. For Mainers, white pine symbolizes the state's logging heritage and the rugged woodsmen who built Maine's economy. The tree's towering height suggests aspiration and strength. Its appearance on the state flag and seal demonstrates how completely white pine defines Maine's character and wildlife context that includes the [Maine state bird](/states/maine/bird/black-capped-chickadee). Modern conservation efforts to maintain healthy white pine forests reflect Maine's commitment to preserving the forests that give the state its character and nickname in a region summarized by [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Maine state tree?"
    answer: "The Eastern White Pine (Pinus strobus) is Maine's official state tree. The Maine Legislature adopted it on February 20, 1945, though the tree had represented Maine on flags and seals since the 1800s."
  
  - question: "What is the Maine state tree called?"
    answer: "Maine's state tree is called Eastern White Pine or simply white pine. The scientific name is Pinus strobus. It's also been called Weymouth pine historically, and the largest specimens were known as pumpkin pines or mast pines."
  
  - question: "When was the Maine state tree adopted?"
    answer: "Maine adopted the Eastern White Pine as its official state tree on February 20, 1945. The tree already appeared on Maine's flag and seal before this formal designation. Maine's nickname 'The Pine Tree State' predates the 1945 official adoption by many decades."
  
  - question: "Why is the Eastern White Pine Maine's state tree?"
    answer: "Maine chose the Eastern White Pine because it shaped the state's entire history and economy. Colonial Britain reserved Maine's tallest pines for Royal Navy ship masts, which angered colonists. After independence, white pine lumber became Maine's most valuable resource, driving the logging industry and creating Maine's lumberjack heritage. The tree gave Maine its nickname 'The Pine Tree State' and appears on the state flag and seal."
  
  - question: "What is the Maine state tree name?"
    answer: "The name is Eastern White Pine. The scientific name is Pinus strobus, meaning 'pine with cones.' The 'white' refers to the pale color of the wood. The 'eastern' distinguishes it from western white pine species."
  
  - question: "Where does the Maine state tree grow?"
    answer: "The Eastern White Pine grows throughout Maine from coastal areas to interior mountains. It thrives on well-drained soils across the state. White pine forests cover millions of acres in Maine. The species grows naturally across northeastern North America from Newfoundland to Georgia and west to Minnesota."
  
  - question: "What are some facts about the Maine state tree?"
    answer: "The Eastern White Pine grows 80 to 110 feet tall, with historic specimens reaching nearly 200 feet. It has five needles per bundle, unlike other common pines. Maine is called 'The Pine Tree State' because of this tree. Colonial Britain reserved the tallest pines for ship masts. The tree appears on Maine's state flag. It can live over 400 years. Both Maine's state tree and state flower come from the same species."
  
  - question: "How do you recognize the Maine state tree?"
    answer: "Look for five soft, flexible needles in each bundle - this is the main identification feature. The needles are blue-green and two to five inches long. The bark is gray-brown with irregular flat plates. Long curved cones (four to eight inches) hang from upper branches. The tree grows very tall and straight with horizontal branch whorls."

