sections:
  - id: overview
    title: "What Is Maine's State Dessert?"
    paragraphs:
      - "Wild blueberry pie is Maine's official state dessert, designated by the Maine Legislature in 2011. It is made with wild Maine blueberries, a smaller and more intensely flavored variety than cultivated blueberries."

  - id: about
    title: "About Wild Blueberry Pie"
    paragraphs:
      - "Wild blueberry pie is filled with Maine's native lowbush blueberries, which are smaller, firmer, and more tart than the cultivated highbush blueberries sold in most stores. The berries are baked into a pastry crust with sugar and a light thickener."

  - id: selection
    title: "How Blueberry Pie Became Maine's Dessert"
    paragraphs:
      - "The Maine Legislature designated wild blueberry pie the official state dessert in 2011, joining the wild blueberry, which was already Maine's state fruit."

  - id: reason
    title: "Why Maine Chose Wild Blueberry Pie"
    paragraphs:
      - "Maine is the largest producer of wild blueberries in the United States, with barrens concentrated in Washington and Hancock counties. Wild blueberry pie showcases that crop directly, using berries that grow almost nowhere else in the country at this scale."

  - id: location
    title: "Where Wild Blueberry Pie Comes From in Maine"
    paragraphs:
      - "Washington County, in Down East Maine, holds the largest concentration of wild blueberry barrens in the state and hosts the annual Machias Wild Blueberry Festival."
    sites:
      - name: Machias
        city: Machias
        lat: 44.7148
        lng: -67.4620
        note: "Home of the Wild Blueberry Festival"
        type: primary

  - id: facts
    title: "Wild Blueberry Pie Facts"
    facts:
      - "Adopted as Maine's state dessert in 2011."
      - "Maine is the top producer of wild blueberries in the United States."
      - "Wild blueberries are smaller and more tart than cultivated highbush blueberries."
      - "Machias, Maine, hosts an annual Wild Blueberry Festival."

