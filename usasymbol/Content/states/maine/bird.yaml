title: Black-capped Chickadee
scientific_name: Poecile atricapillus
adopted_year: 1927
legislation: Title 1, section 209
meaning: Maine's bird symbol points away from spectacle and toward ordinary northern life. In a state famous for coast, pine woods, and oversized wilderness imagery, the Black-capped Chickadee stands for the small, familiar bird that stays through winter and fits the lived scale of the Pine Tree State.
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: "2026-05-02"
seo_title: "Maine State Bird | Black-capped Chickadee"
seo_description: "Maine adopted the Black-capped Chickadee in 1927 as a winter-hardy bird that stays when many others migrate."
intro_text: "Maine's official state bird is the <strong>Black-capped Chickadee</strong>, designated in <strong>1927</strong> and now listed in <strong>Title 1, section 209</strong> of the Maine Revised Statutes. What makes the choice distinctive is what it is not: a state strongly identified with coast, pine woods, and large wilderness imagery did not make a seabird or a grand emblem official. It chose a small year-round bird of the woods, neighborhoods, and winter life that fits the everyday side of Maine."
shared_states:
- Massachusetts
