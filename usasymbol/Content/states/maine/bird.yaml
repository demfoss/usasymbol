sections:
- id: not-the-bird-you-expect
  icon: fa-solid fa-compass
  title: Maine Did Not Choose the Bird Many People Would Expect
  paragraphs:
  - Maine is strongly associated with rocky coast, maritime life, and large wilderness imagery. Puffins, osprey, and loons are all part of the state's public picture. The 1927 designation went in a different direction entirely.
  - The Black-capped Chickadee is not a coastal or waterfront bird. It reads as the near-at-hand bird of woods, town trees, yards, and winter feeders — closer to the lived interior of Maine than to the shoreline imagery that draws visitors. Set beside the [Pine Tree State nickname](/states/maine/nickname/the-pine-tree-state) and the [Eastern White Pine](/states/maine/tree/white-pine), the chickadee points inland.
- id: a-bird-that-stays-through-winter
  icon: fa-solid fa-snowflake
  title: A Bird That Stays When Most Others Leave
  paragraphs:
  - The Black-capped Chickadee does not migrate. It winters in Maine, which means it is present during the part of the year that most defines the state's character — not the summer tourist season but the long cold stretch from November through March when Maine belongs to people who actually live there.
  - That year-round presence is what separates the chickadee from many plausible alternatives. A migratory bird that passes through in warmer months would symbolize a seasonal version of Maine. A bird that stays through the worst of a northern New England winter carries a different kind of local meaning.
- id: maine-massachusetts-the-new-england-chickadee
  icon: fa-solid fa-map
  title: Maine and Massachusetts Both Chose This Bird
  paragraphs:
  - Massachusetts adopted the Black-capped Chickadee as its state bird in 1941, fourteen years after Maine. That makes the chickadee the only state bird shared exclusively by two New England states — neither a Great Plains species like the Western Meadowlark (six states) nor a Mid-Atlantic species like the cardinal (seven states), but a bird of the northern New England woods and winter.
  - "Maine came first in 1927 and Massachusetts followed, which means two neighboring states independently converged on the same small, year-round northern bird over a fourteen-year span. The pairing reflects something genuine about the chickadee's fit with the region: it is the bird that New England residents actually encounter in their own backyards through winter, not a symbol chosen for spectacle."
faq:
- question: What is Maine's official state bird?
  answer: Maine's official state bird is the Black-capped Chickadee.
- question: When did Maine adopt the Black-capped Chickadee?
  answer: Maine adopted the Black-capped Chickadee in 1927. The current statutory listing appears in Title 1, section 209 of the Maine Revised Statutes.
- question: Why does the chickadee fit Maine as a symbol?
  answer: The chickadee is a year-round resident that stays through Maine's winters rather than migrating south. That makes it a symbol of the state's everyday northern life — the forested, cold-season Maine that residents actually live in — rather than the coastal or summer imagery more commonly associated with the state.
- question: Does the Black-capped Chickadee migrate away from Maine in winter?
  answer: No. The Black-capped Chickadee is a year-round resident in Maine and does not migrate. Its presence through the northern winter is one of the qualities that makes it a fitting emblem for the Pine Tree State.
- question: Did Maine choose a coastal bird as its state symbol?
  answer: No. Maine chose the Black-capped Chickadee rather than a seabird or coastal species, which points the symbol toward the state's forest interior and winter identity rather than its shoreline.
- question: Does Maine share the Black-capped Chickadee with another state?
  answer: Yes — with Massachusetts, which adopted the same bird in 1941. The chickadee is the only state bird shared exclusively by two New England states.
