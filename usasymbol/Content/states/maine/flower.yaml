type: State Flower
state: Maine
name: White Pine Cone and Tassel
scientific_name: Pinus strobus
adopted_year: 1895
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-15"
seo_title: "Maine State Flower | White Pine Cone and Tassel"
seo_description: "Maine designated the White Pine Cone and Tassel as its official state flower in 1895, recognizing the role of white pine forests in the state’s lumber industry."

intro_text: "Maine designated the White Pine Cone and Tassel as its official state flower in 1895, and this unusual symbol appears on the [list of U.S. state flowers](/symbols/flowers). This unusual choice features the cone and pollen-bearing tassel of the eastern white pine tree. The White Pine Cone and Tassel represents Maine's historic lumber industry and vast northern forests tied to the [Maine state tree](/states/maine/tree/white-pine)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Maine State Flower?"
    paragraphs:
      - "Maine recognizes the White Pine Cone and Tassel as its state flower. The cone grows 4 to 8 inches long with thin flexible scales. Brown mature cones hang downward from branch tips. The tassel refers to the yellowish male flowers that release pollen in spring. These pollen-bearing structures appear at the ends of new growth."
      - "White pine tassels emerge in May and June across Maine. The male flowers produce large amounts of yellow pollen. Female cones develop on the same tree but on different branches. Cones mature over two years before releasing winged seeds. The trees grow 50 to 80 feet tall in Maine forests. Soft blue-green needles grow in bundles of five."
      - "Eastern white pine dominates Maine's forests. The trees thrive throughout the state from coast to mountains. Well-drained soil suits white pines best. The species tolerates various conditions from sandy to rocky ground. Maine's climate provides ideal growing conditions. White pine became the foundation of Maine's historic shipbuilding and lumber industries."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Maine State Flower Name"
    paragraphs:
      - "This symbol carries the official name White Pine Cone and Tassel with the scientific name Pinus strobus. The species belongs to the Pinaceae family. This family includes pines, spruces, firs, and other cone-bearing evergreen trees found worldwide."
      - "The genus name Pinus covers all pine species. The species name strobus comes from the Greek word for cone. Eastern white pine serves as another common name. Some people call it northern white pine or soft pine based on the wood's workable texture."
      - "Maine selected both the cone and tassel rather than just one structure. This dual designation makes Maine's state flower unique among American states. The cone represents the mature seed-bearing structure. The tassel symbolizes the pollen-producing male flowers. Together they represent the complete reproductive cycle of this economically important tree."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the White Pine Cone and Tassel Became the Maine State Flower"
    paragraphs:
      - "The Maine legislature chose the White Pine Cone and Tassel as the state flower in 1895. This made Maine one of the first states to adopt an official floral emblem. The selection honored Maine's lumber industry rather than following other states in choosing traditional flowers. No public vote preceded the designation, and the choice aligns with state identity language on the [Maine state motto page](/states/maine/motto/dirigo)."
      - "White pine dominated Maine's economy during the 1800s. Vast pine forests covered northern Maine. Loggers harvested millions of board feet annually. The tall straight trees provided masts for sailing ships. Lumber mills processed white pine into boards for construction. The industry employed thousands of Maine workers."
      - "Some people questioned selecting a tree part instead of a flowering plant. Supporters argued that white pine defined Maine's identity better than any wildflower. The cone and tassel symbolized Maine's natural resources and economic foundation. The legislature agreed and passed the designation on February 25, 1895. Maine's choice influenced other states to consider trees and non-traditional symbols."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maine State Flower Facts"
    facts:
      - "Maine adopted the White Pine Cone and Tassel on February 25, 1895, making it one of the first states to designate an official floral emblem"
      - "Eastern white pine can live for over 400 years, with some ancient Maine specimens predating European colonization"
      - "White pine was so valuable during colonial times that the British Crown marked the tallest trees with a broad arrow symbol, reserving them for Royal Navy ship masts"
      - "A single white pine tree can produce thousands of cones during its lifetime, with each cone containing up to 100 winged seeds"
      - "The soft white pine wood made it ideal for colonial shipbuilding, furniture making, and construction throughout New England"
      - "White pine pollen creates yellow dustings on cars and surfaces each spring when the tassels release massive quantities during pollination season"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Maine State Flower and Bird"
    paragraphs:
      - "The Black-capped Chickadee serves as Maine's state bird, a small hardy songbird that remains in Maine year-round. Both symbols represent Maine officially. Maine adopted the White Pine Cone and Tassel in 1895 and designated the Black-capped Chickadee as state bird in 1927; see the [Maine state bird page](/states/maine/bird/black-capped-chickadee)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The White Pine Cone and Tassel is often associated with Maine's logging heritage and natural resources. The symbol has been linked to the state's economic history when timber drove prosperity. Its enduring presence frequently represents strength, longevity, and Maine's vast northern forests that continue to define the landscape and reinforce [the Pine Tree State nickname](/states/maine/nickname/the-pine-tree-state)."

faq:
  - question: "What is Maine's state flower?"
    answer: "Maine's state flower is the White Pine Cone and Tassel, the cone and pollen-bearing structures of the eastern white pine tree."
  
  - question: "When did Maine adopt the White Pine Cone and Tassel as its state flower?"
    answer: "Maine adopted the White Pine Cone and Tassel on February 25, 1895. This made Maine one of the first states to designate an official floral emblem."
  
  - question: "Why did Maine choose the White Pine Cone and Tassel?"
    answer: "Maine chose the White Pine Cone and Tassel to honor the state's lumber industry and economic foundation. White pine dominated Maine's forests and economy during the 1800s. The symbol highlighted Maine's natural resources and identity better than traditional wildflowers according to supporters."
  
  - question: "Is the white pine native to Maine?"
    answer: "Yes, the eastern white pine is native to Maine and dominates forests throughout the state. The trees thrive in Maine's climate and various soil conditions from coastal areas to mountains."
  
  - question: "Why did Maine choose a tree part instead of a flower?"
    answer: "Maine selected a tree part because white pine defined the state's identity and economy better than any wildflower. The lumber industry employed thousands and white pine forests covered northern Maine. This practical choice honored Maine's natural resources and economic heritage."

