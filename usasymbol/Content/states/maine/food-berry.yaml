seo_title: "Maine State Berry | Wild Blueberry"
seo_description: "Maine's state berry is the wild blueberry, adopted in 1991, grown across the state's blueberry barrens."
hero_image: /images/foods/maine/maine-state-berry-hero.webp
hero_image_alt: "Wild blueberries growing low to the ground on a barren."
hero_image_caption: "The wild blueberry, Maine's official state berry."
intro_text: "Maine's state berry is the wild blueberry, adopted in 1991 to recognize a crop grown on the state's distinctive blueberry barrens. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Maine's State Berry?"
    paragraphs:
      - "The wild blueberry is Maine's official state berry, designated by the Maine Legislature in 1991. Maine is the largest producer of wild blueberries in the United States, grown on low-bush plants across the state's barrens."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Wild Blueberry"
    paragraphs:
      - "Wild blueberries are small, dark blue berries that grow naturally on low shrubs, unlike the larger cultivated highbush blueberries grown in most other states. Maine's wild blueberry plants spread naturally across sandy, rocky barrens and are harvested in late summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Wild Blueberry Became Maine's State Berry"
    paragraphs:
      - "The Maine Legislature designated the wild blueberry the official state berry in 1991."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Maine Chose the Wild Blueberry"
    paragraphs:
      - "Maine's coastal and inland barrens produce most of the wild blueberries grown in the United States, and the crop has shaped the economy and food culture of Washington and Hancock counties for generations."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Wild Blueberry Comes From in Maine"
    paragraphs:
      - "Washington County in Down East Maine is the center of the state's wild blueberry industry, home to vast barrens and the town of Machias, which holds the Machias Wild Blueberry Festival."
    sites:
      - name: Washington County barrens
        city: Machias
        lat: 44.71
        lng: -67.46
        note: "Center of Maine's wild blueberry industry"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Wild Blueberry Facts"
    facts:
      - "Adopted as Maine's state berry in 1991."
      - "Maine is the largest producer of wild blueberries in the United States."
      - "Wild blueberries grow on low shrubs, unlike cultivated highbush varieties."

