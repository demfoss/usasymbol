faq:
  - question: "What is Maine's state sweetener?"
    answer: "Maine's state sweetener is pure Maine maple syrup, adopted by the Maine Legislature in 2015."
  - question: "When did Maine adopt maple syrup as its state sweetener?"
    answer: "The Maine Legislature designated pure Maine maple syrup the official state sweetener in 2015."
  - question: "Why did Maine choose maple syrup?"
    answer: "Maine's forests hold large numbers of sugar maple trees, and the state has a long tradition of tapping them for syrup each spring."
  - question: "Is maple syrup made in Maine today?"
    answer: "Yes. Family sugarhouses across Maine still tap sugar maple trees and produce syrup every spring."

