sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Maine's State Sweetener?"
    paragraphs:
      - "Pure Maine maple syrup is Maine's official state sweetener, designated by the Maine Legislature in 2015. It is made each spring by boiling down sap collected from the state's sugar maple trees."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Pure Maine Maple Syrup"
    paragraphs:
      - "Maple syrup starts as clear, watery sap tapped from sugar maple trees in late winter and early spring, when freezing nights and warmer days cause the sap to flow. Producers boil the sap for hours in evaporators until the water cooks off and only thick, amber syrup remains. It can take roughly 40 gallons of sap to make just one gallon of syrup."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Maple Syrup Became Maine's State Sweetener"
    paragraphs:
      - "The Maine Legislature designated pure Maine maple syrup the official state sweetener in 2015, recognizing a springtime industry with deep roots in the state's forests."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Maine Chose Maple Syrup"
    paragraphs:
      - "Maine's forests hold a large number of sugar maple trees, and the state is regularly among the top maple syrup producers in the country. Maple sugaring has been practiced in Maine since Native Americans first taught early settlers how to tap trees for sap, and the tradition continues today through family sugarhouses across the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pure Maine Maple Syrup Facts"
    facts:
      - "Adopted as Maine's state sweetener in 2015."
      - "It takes about 40 gallons of maple sap to make one gallon of syrup."
      - "Sap is collected in late winter and early spring during freeze-thaw cycles."
      - "Maine is regularly one of the top maple syrup producing states in the country."

