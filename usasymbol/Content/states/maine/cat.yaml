seo_title: "Maine Coon: Maine's Official State Cat Since 1985"
seo_description: "Discover the Maine Coon, Maine's official state cat since 1985. Learn about America's native longhair cat breed, the 'gentle giant' that originated in Maine."

intro_text: "The <strong>Maine Coon</strong> became Maine's official state cat in 1985, making Maine the first state to designate an official cat breed and placing it among notable entries on the [U.S. state mammals hub](/symbols/mammals). This 'gentle giant' is believed to be the oldest natural cat breed in North America and the only longhaired breed native to the United States. Known for their large size, tufted ears, and dog-like personalities, Maine Coons have been part of Maine's heritage for over 150 years in landscapes associated with the [Maine state tree](/states/maine/tree/white-pine)."

sections:
  - id: "why-chosen"
    icon: "fa-solid fa-bullseye"
    title: "Why Maine Chose the Maine Coon"
    paragraphs:
      - "Maine designated the Maine Coon as its official state cat on April 24, 1985. The legislation recognized the breed's unique connection to the state—it's the only cat breed named after a U.S. state."
      - "The Maine Coon was chosen because it originated in Maine and is believed to be the oldest natural cat breed in North America. The breed developed naturally in Maine's harsh climate, where its large size and heavy coat helped it survive brutal winters."
      - "By 1985, Maine Coons had become beloved worldwide, but they remained symbols of Maine's rural heritage. Farmers and sailors had kept these cats for generations, valuing them as exceptional hunters and gentle companions under values reflected in the [Maine state motto](/states/maine/motto/dirigo)."

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "History: America's Native Longhair"
    subsections:
      - subtitle: "Origins Unknown"
        text: "The Maine Coon's true origin is shrouded in mystery and legend. The most likely theory: longhaired cats brought by European sailors bred with local domestic cats, with natural selection favoring larger, heavier-coated cats in Maine's climate."
      - subtitle: "1860s — First Recognition"
        text: "Maine Coons were exhibited at early American cat shows in the 1860s. A Maine Coon named 'Cosey' won Best Cat at the first major American cat show at Madison Square Garden in 1895."
      - subtitle: "1900-1950 — Near Disappearance"
        text: "When Persian cats arrived from England, Maine Coons fell out of favor. The breed nearly disappeared from the show world, surviving only on Maine farms and in the hearts of dedicated breeders."
      - subtitle: "1968 — Revival Begins"
        text: "Dedicated breeders formed the Maine Coon Breeders and Fanciers Association, beginning serious efforts to preserve and promote the breed."
      - subtitle: "1976 — CFA Recognition"
        text: "The Cat Fanciers' Association granted the Maine Coon full championship status, confirming its place among elite pedigreed cats."
      - subtitle: "1985 — Official State Cat"
        text: "Maine became the first state to designate an official state cat, choosing its namesake breed. The legislation recognized the Maine Coon's historical significance."

  - id: "maine-connection"
    icon: "fa-solid fa-map-marker-alt"
    title: "The Maine Connection"
    paragraphs:
      - "The Maine Coon is inextricably linked to the state whose name it bears. Everything about the breed reflects Maine's character—rugged, self-sufficient, friendly but independent—and reinforces [the Pine Tree State nickname](/states/maine/nickname/the-pine-tree-state)."
      - "For generations, Maine Coons served as working cats on Maine farms and ships. They were prized mousers, keeping barns and ships free of vermin. Sailors called them 'ship cats' and took them on voyages, spreading the breed along the New England coast."
      - "The breed's physical characteristics evolved in response to Maine's environment. Their large size and muscular build, heavy water-resistant coat, tufted ears and paws, and bushy tail all developed as adaptations to harsh Maine winters."
      - "Today, Maine celebrates its state cat with annual Maine Coon events and exhibitions. The breed remains popular across Maine, where many residents feel a special connection to their 'native' cat within a broader region mapped in [states neighboring states](/rankings/geography/states-neighboring-states)."

  - id: "physical"
    icon: "fa-solid fa-magnifying-glass"
    title: "Physical Characteristics"
    subsections:
      - subtitle: "Size: The Gentle Giant"
        text: "Maine Coons are the largest domestic cat breed. Males typically weigh 15-25 pounds; females are smaller at 10-15 pounds. They can reach 40 inches from nose to tail tip. Despite their size, they're graceful and agile."
      - subtitle: "Coat and Coloring"
        text: "Their semi-long coat is silky and water-resistant, shorter on the shoulders and longer on the stomach and britches. All colors and patterns are accepted except pointed patterns. Brown tabby is most common and iconic."
      - subtitle: "Distinctive Features"
        text: "Maine Coons have large, tufted ears with 'lynx tips,' large expressive eyes, a rectangular body shape, and an extraordinarily long, bushy tail. Their large, tufted paws act like snowshoes."
      - subtitle: "Slow Development"
        text: "Maine Coons mature slowly, not reaching full size until 3-5 years old. Kittens are born with the characteristic ear tufts visible within weeks."

  - id: "behavior"
    icon: "fa-solid fa-cat"
    title: "Temperament & Behavior"
    subsections:
      - subtitle: "The 'Dog-Like' Cat"
        text: "Maine Coons are often called 'dogs of the cat world.' They follow their owners around, come when called, and can be taught to fetch. Many enjoy walks on leash."
      - subtitle: "Gentle Giants"
        text: "Despite their imposing size, Maine Coons are exceptionally gentle. They're patient with children and get along well with dogs and other cats. Aggression is rare in well-socialized cats."
      - subtitle: "Chirps and Trills"
        text: "Maine Coons are known for their unique vocalizations—chirps, trills, and chatters rather than typical meowing. They're conversational cats who 'talk' to their owners."
      - subtitle: "Water Fascination"
        text: "Unlike most cats, Maine Coons are often fascinated by water. They may dip paws in water bowls, 'fish' in sinks, or even join owners in the shower. Their water-resistant coat may explain this unusual trait."

  - id: "care"
    icon: "fa-solid fa-heart"
    title: "Care Requirements"
    subsections:
      - subtitle: "Grooming"
        text: "Their long coat requires brushing 2-3 times weekly to prevent mats. Despite length, the silky texture mats less than Persian coats. Regular ear cleaning is important due to ear tufts."
      - subtitle: "Exercise & Play"
        text: "Maine Coons are active, playful cats who need daily interactive play. They enjoy puzzle toys, cat trees, and games of fetch. Despite their size, they're agile climbers."
      - subtitle: "Living Space"
        text: "Their large size requires larger cat trees, litter boxes, and carriers. They adapt to apartments if given adequate space and exercise but thrive in homes with room to roam."
      - subtitle: "Health Screening"
        list:
          - "HCM (Hypertrophic Cardiomyopathy) - heart condition"
          - "Hip Dysplasia - more common in large breeds"
          - "SMA (Spinal Muscular Atrophy) - genetic test available"
          - "PKD (Polycystic Kidney Disease) - less common"
          - "Buy from breeders who test for these conditions"

  - id: "interesting-facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "Maine is the first state to designate an official state cat (1985)"
      - "Maine Coons are the largest domestic cat breed—males can exceed 25 pounds"
      - "They're the only longhaired cat breed native to the United States"
      - "A Maine Coon named 'Stewie' held the Guinness record at 48.5 inches long"
      - "Maine Coons don't reach full size until 3-5 years old"
      - "Their tufted paws act like snowshoes on snow and ice"
      - "Many Maine Coons are polydactyl—having extra toes"
      - "They're called 'gentle giants' for their sweet temperament despite large size"
      - "Unlike most cats, Maine Coons often enjoy water and swimming"
      - "A Maine Coon won Best Cat at the first major American cat show in 1895"
      - "Legend says they descended from Marie Antoinette's cats sent to Maine"
      - "Their chirping vocalizations are different from typical cat meows"

faq:
  - question: "What is Maine's state cat?"
    answer: "Maine's state cat is the Maine Coon, designated in 1985. Maine was the first state to designate an official state cat."

  - question: "How big do Maine Coons get?"
    answer: "Male Maine Coons typically weigh 15-25 pounds and can reach 40 inches from nose to tail. Females are smaller at 10-15 pounds. They're the largest domestic cat breed."

  - question: "Are Maine Coons good pets?"
    answer: "Yes, Maine Coons are excellent pets known as 'gentle giants.' They're friendly, patient with children, get along with dogs, and have dog-like personalities. They're among the most popular cat breeds."

  - question: "Why are Maine Coons so big?"
    answer: "Maine Coons evolved in Maine's harsh climate. Natural selection favored larger cats with heavy coats who could survive cold winters. They developed as a natural breed over centuries."

  - question: "Do Maine Coons like water?"
    answer: "Yes, unusually for cats, many Maine Coons are fascinated by water. They may play in water bowls, 'fish' in sinks, or enjoy baths. Their water-resistant coat may explain this trait."

  - question: "How long do Maine Coons live?"
    answer: "Maine Coons typically live 12-15 years. With good care and health screening from reputable breeders, some live into their late teens."

  - question: "Are Maine Coons high maintenance?"
    answer: "Moderately. Their long coat needs brushing 2-3 times weekly, and they need larger supplies due to their size. However, they're generally healthy and their coat mats less than Persian coats."

  - question: "Does Maine have a state mammal too?"
    answer: "Yes, Maine's state mammal is the Moose. Learn more on our Maine State Animal page."

