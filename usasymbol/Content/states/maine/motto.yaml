faq:
  - question: "What is the Maine state motto?"
    answer: "Maine's state motto is \"Dirigo,\" a Latin word meaning \"I Lead.\" It has appeared on the Maine state seal since 1820, when Maine became the 23rd state."

  - question: "What does \"Dirigo\" mean?"
    answer: "\"Dirigo\" is Latin for \"I Lead.\" It can also be translated as \"I Direct\" or \"I Guide.\" Maine's official sources use \"I Lead\" as the standard translation. The motto appears below the North Star on the state seal, connecting the word to the star that guided sailors to true north."

  - question: "What is the English translation of \"Dirigo\"?"
    answer: "The standard English translation is \"I Lead.\" The Latin verb dirigere means to lead, direct, or guide — all three are accurate, but \"I Lead\" is what Maine's official sources use."

  - question: "When did Maine adopt its state motto?"
    answer: "Maine adopted Dirigo in 1820 as part of the original state seal, when Maine became the 23rd state on March 15, 1820. The motto is codified in Maine Revised Statutes Title 1, § 201."

  - question: "Why is Maine called the Dirigo State?"
    answer: "Maine is sometimes called the Dirigo State because of its motto. \"Dirigo\" means \"I Lead\" in Latin, and the phrase became closely associated with Maine's identity since statehood in 1820."

