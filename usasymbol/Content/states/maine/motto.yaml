title: "Dirigo"
language: "Latin"
english_translation: "I Direct or I Lead"
adopted_year: 1820

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Maine State Motto | Dirigo! I Direct or I Lead!"
seo_description: "Maine's motto 'Dirigo' (I Lead) was written into the seal description by a man who had spent years fighting against Maine statehood. Isaac G. Reed opposed separation from Massachusetts but served dutifully on the seal committee when elected anyway. The North Star above 'Dirigo' on the seal was chosen specifically for its maritime navigation meaning."

intro_text: "Maine's state motto is <strong>Dirigo</strong> — Latin for <em>I Lead</em> or <em>I Direct</em>. The word appears beneath the North Star on Maine's state seal, adopted on June 9, 1820, less than three months after Maine became the 23rd state. The seal description was written by Colonel Isaac G. Reed of Waldoboro — a Federalist who had actively opposed Maine's separation from Massachusetts throughout the statehood movement, yet served faithfully on the seal committee after being elected to the first legislature. The choice of Dirigo connected directly to Maine's maritime identity: the legislative resolution explicitly compared the state to the North Star, 'the mariner's guide and director in conducting the ship over the pathless ocean.'"

sections:
  - id: "isaac-reed-the-opponent"
    icon: "fa-solid fa-user"
    title: "The Man Who Wrote the Seal Opposed the State It Described"
    paragraphs:
      - "Isaac G. Reed was a prominent Federalist politician in Waldoboro, Maine who led his community in opposing Maine's separation from Massachusetts. The separation movement went through six public votes between 1792 and 1819. Reed opposed statehood through all of them. When Maine residents finally approved separation by 17,091 to 7,132 in July 1819, Reed's side had lost."
      - "Waldoboro nonetheless elected Reed to the First Maine Legislature in 1820. He did not refuse. He served on the committee responsible for designing the state seal. He wrote the official seal description — including the choice of the North Star, the motto 'Dirigo,' and the seal's complete design. His stepdaughter Bertha Smouse created the first sketch at Reed's mansion in Waldoboro."
      - "Reed's willingness to serve after opposing the state's creation shows something about the speed of political reconciliation in early 19th-century Maine. Benjamin Vaughan of Hallowell proposed the design concept; Reed gave it official language. The seal was approved on June 9, 1820, 86 days after statehood."

  - id: "north-star-and-maritime"
    icon: "fa-solid fa-star"
    title: "Why the North Star and 'I Lead' Made Sense for Maine"
    paragraphs:
      - "The legislative resolution that established the seal explained why the North Star was chosen: it had been 'considered the mariner's guide and director in conducting the ship over the pathless ocean to the desired haven.' Maine's economy in 1820 depended heavily on the sea. Fishing sustained coastal communities. Shipbuilding thrived in Bath, Brewer, and Belfast. Ships and crews from Maine ports worked worldwide routes."
      - "For such a maritime state, a motto about guiding and directing — anchored by a navigation star — carried specific meaning. Polaris sits nearly aligned with Earth's rotational axis, appearing nearly stationary in the night sky while all other stars rotate around it. Sailors in the Northern Hemisphere have used it for reliable direction since ancient times. The comparison between a fixed guiding star and a state's leadership was not abstract in 1820 Maine."
      - "The word 'Dirigo' comes from the Latin verb 'dirigere,' meaning to direct, guide, or steer — the same root as the English words direction and director. Romans used it for ship navigation and military command. Maine's legislature chose a word that fit both the maritime economy of the state and the aspirational role of a new government."

  - id: "statehood-struggle"
    icon: "fa-solid fa-landmark"
    title: "Maine's Difficult Path to Statehood"
    paragraphs:
      - "Maine had been part of Massachusetts since the 1650s. After the American Revolution, separation movements began in 1785 but faced repeated failure. The War of 1812 was a turning point. British forces occupied eastern Maine from the Penobscot River to New Brunswick, hoping to annex it as the Colony of New Ireland. Massachusetts provided a weak military response. Mainers felt abandoned. The experience built momentum for separation that hadn't existed before."
      - "When Maine applied for statehood in 1819, Congress had a problem: equal numbers of free and slave states. Southern senators would not admit Maine as a free state without a corresponding slave state. The Missouri Compromise broke the deadlock, linking Maine's and Missouri's admissions. President James Monroe signed the act on March 3, 1820. Maine became the 23rd state on March 15."
      - "The First Legislature met from May 21 to June 28, 1820 in Portland. Creating a seal was urgent — every official document required authentication to function as a sovereign state. The committee moved quickly. William Moody of Saco, first president of the Maine Senate, oversaw the process. The seal was approved six days before the legislature adjourned."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Maine State Motto Facts"
    style: "gradient"
    facts:
      - "Isaac G. Reed, who wrote the seal description including 'Dirigo,' had actively opposed Maine statehood as a Federalist."
      - "Reed's stepdaughter Bertha Smouse created the first sketch of the seal at Reed's Waldoboro mansion."
      - "The legislative resolution explicitly compared Maine to the North Star as 'the mariner's guide and director in conducting the ship over the pathless ocean.'"
      - "Maine became the 23rd state on March 15, 1820; the seal was approved June 9 — 86 days later."
      - "Maine voters approved separation from Massachusetts 17,091 to 7,132 in July 1819."
      - "The correct pronunciation is DEE-ri-go, not deer-EYE-go."

faq:
  - question: "What is Maine's state motto?"
    answer: "Maine's state motto is 'Dirigo,' a Latin word meaning 'I Lead' or 'I Direct.' It appears beneath the North Star on Maine's state seal, adopted on June 9, 1820."

  - question: "What does 'Dirigo' mean?"
    answer: "'Dirigo' is first-person singular Latin for 'I direct' or 'I lead.' Maine law specifies both translations as acceptable. The word comes from the Latin verb 'dirigere' — the root of the English words direction and director. It was chosen to evoke maritime navigation, as the North Star on the seal was the 'mariner's guide.'"

  - question: "What language is Maine's motto written in?"
    answer: "Latin. 'Dirigo' is a Latin verb, adopted in 1820 alongside the state seal. Most American states chose Latin for their mottos in the early 19th century."

  - question: "When did Maine adopt its motto?"
    answer: "June 9, 1820 — 86 days after Maine became the 23rd state on March 15, 1820. The First Legislature approved the seal design, including the motto, before adjourning its first session."

  - question: "Why does Maine's seal show the North Star with 'Dirigo'?"
    answer: "The connection was deliberate and explained in the original resolution: the North Star was chosen because it had been 'the mariner's guide and director in conducting the ship over the pathless ocean to the desired haven.' Maine's economy depended on the sea in 1820. The motto 'I Lead' and the guiding star reinforced each other."

  - question: "Where does Maine's motto appear?"
    answer: "On Maine's state seal (on a label between the North Star above and the shield below, which shows a pine tree, moose, farmer, and sailor), on the state flag (a blue field with the coat of arms at center), on official documents, and on many institutions — several schools in RSU 56 bear the Dirigo name."

