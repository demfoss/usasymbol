sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of New Mexico?
    paragraphs:
      - "The New Mexico whiptail lizard is New Mexico's official state reptile, designated by the New Mexico Legislature in 2003. Its scientific name is Cnemidophorus neomexicanus, also written as Aspidoscelis neomexicana."
      - "It is a fast-moving desert lizard found across much of New Mexico and named directly after the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the New Mexico Whiptail Lizard
    paragraphs:
      - "The New Mexico whiptail lizard has a slender body with light stripes running down a dark brown or olive back, and a long, whip-like tail that gives the species its name."
      - "Adults typically grow to about 8 to 9 inches long, including the tail, and move quickly across open desert ground."
      - "The species is made up entirely of females, which reproduce through a natural process that does not require males."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The New Mexico Legislature designated the New Mexico whiptail lizard the official state reptile in 2003, recognizing a lizard named directly after the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New Mexico Chose the New Mexico Whiptail Lizard
    paragraphs:
      - "The New Mexico whiptail lizard is named after the state and is well known among scientists for its all-female population, making it one of the state's most distinctive native reptiles."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the New Mexico Whiptail Lizard
    paragraphs:
      - "New Mexico whiptail lizards are found across desert and semi-arid areas of central and southern New Mexico, including the Rio Grande valley."
