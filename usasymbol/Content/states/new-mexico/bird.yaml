title: Greater Roadrunner
scientific_name: Geococcyx californianus
adopted_year: 1949
legislation: NMSA 1978, Section 12-3-4
meaning: New Mexico's state bird is most revealing in the name the law preserves. The statute does not stop at a modern field-guide label. It calls the bird the chaparral bird, commonly called roadrunner, which makes the symbol sound regional, lived-in, and already part of everyday New Mexico language.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "New Mexico State Bird | Greater Roadrunner"
seo_description: New Mexico's state bird is the Greater Roadrunner, adopted in 1949. State law calls it the chaparral bird, commonly called roadrunner.
intro_text: 'The state bird of New Mexico is the <strong>Greater Roadrunner</strong>, adopted on <strong>March 16, 1949</strong>. New Mexico law uses a more local phrase: the <strong>chaparral bird, commonly called roadrunner</strong>, now carried in <strong>NMSA 1978, Section 12-3-4</strong>. That wording is the key to the page. It preserves the regional name people already used for a bird of desert roads, local speech, and New Mexico public identity. Locally the bird is also called <em>el paisano</em>, which reinforces why the symbol feels native to the state rather than borrowed from a field guide.'
