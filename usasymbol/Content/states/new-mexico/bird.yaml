sections:
- id: why-does-new-mexico-law-say-chaparral-bird
  icon: fa-solid fa-circle-question
  title: Why Does New Mexico Law Say Chaparral Bird?
  paragraphs:
  - Many state bird laws use only a common name or a species name and stop there. New Mexico did something more revealing. Its statute says the state bird is the chaparral bird, commonly called roadrunner.
  - That wording tells you the symbol was already part of local speech. The law did not need to teach New Mexicans what bird it meant. It preserved the name people in the region already understood.
  - New Mexico did not simply choose a desert bird. It put a regional bird name into law and let that language carry part of the symbol's meaning.
- id: why-did-the-roadrunner-fit-new-mexico-so-easily
  icon: fa-solid fa-road
  title: Why Did the Roadrunner Fit New Mexico So Easily?
  paragraphs:
  - The roadrunner already belonged to the public image of New Mexico before the law named it. It was a bird people associated with open country, roadside movement, and the dry landscapes that outsiders and residents alike linked with the state.
  - The Secretary of State's own state-symbol page pushes the same idea. It treats the roadrunner as one of the birds most closely connected to local identity, not as a technical wildlife choice that needs much explanation.
  - That closeness also helps explain why the symbol kept expanding after 1949. In 1969 New Mexico added Dusty Roadrunner as a litter-control mascot, which only makes sense if the bird was already widely readable as a public New Mexico emblem.
faq:
- question: What is New Mexico's state bird?
  answer: New Mexico's state bird is the Greater Roadrunner.
- question: When did New Mexico adopt the Greater Roadrunner?
  answer: New Mexico adopted the Greater Roadrunner as its official state bird on March 16, 1949.
- question: Why does New Mexico law say chaparral bird?
  answer: Because the statute preserves the regional name along with the more familiar name roadrunner. That wording shows the bird was already part of local speech and identity.
- question: Is the chaparral bird the same as the roadrunner?
  answer: Yes. In New Mexico law, the chaparral bird is the bird commonly called the roadrunner.
- question: What does the roadrunner mean for New Mexico?
  answer: The roadrunner was already woven into New Mexico's regional language — known locally as el paisano — and its dry-country image before 1949. The 1969 Dusty Roadrunner litter mascot shows how far that civic identity extended after the designation.
- question: What is Dusty Roadrunner?
  answer: Dusty Roadrunner is New Mexico's official litter-control mascot, added in 1969 as a later civic use of the same symbol.
