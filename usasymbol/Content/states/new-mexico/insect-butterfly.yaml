sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of New Mexico?
  paragraphs:
  - "The Sandia hairstreak, Callophrys mcfarlandi, is New Mexico's official state butterfly. State lawmakers designated it in 2003."
  - "It is a small, tailless butterfly best known for the bright green underside of its wings, and nearly all of its United States range lies within New Mexico."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Sandia Hairstreak
  paragraphs:
  - "The Sandia hairstreak is a small butterfly with a wingspan of about 1.1 to 1.25 inches and no tails on its wings."
  - "The upper side of the wings is reddish-brown in females and brown in males, but the underside is bright, iridescent green edged with thin white lines, the butterfly's most recognizable feature."
  - "Its caterpillars feed only on the flowers and seeds of beargrass, a desert plant in the agave family."

- id: history
  icon: fa-solid fa-landmark
  title: How New Mexico Chose the Sandia Hairstreak
  paragraphs:
  - "The New Mexico Legislature designated the Sandia hairstreak the official state butterfly in 2003."
  - "The butterfly was first found in the foothills of the Sandia Mountains near Albuquerque in 1958 by Noel McFarland, who later had the species named after him."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Sandia Hairstreak in New Mexico
  paragraphs:
  - "The Sandia hairstreak lives at elevations of roughly 4,200 to 7,200 feet, wherever its host plant, beargrass, grows."
  - "It is found in most New Mexico counties and is more common east of the Rio Grande, with the Sandia Mountains near Albuquerque among its best-known locations."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Sandia Hairstreak Facts
  facts:
  - "Adopted in 2003 by the New Mexico Legislature."
  - "Scientific name: Callophrys mcfarlandi."
  - "Wingspan of about 1.1 to 1.25 inches, with no tails on the wings."
  - "Bright iridescent green underside edged with thin white lines."
  - "Caterpillars eat only the flowers and seeds of beargrass."




