faq:
- question: What is New Mexico's state butterfly?
  answer: "New Mexico's state butterfly is the Sandia hairstreak, adopted by the New Mexico Legislature in 2003."
- question: When did New Mexico adopt the Sandia hairstreak?
  answer: "New Mexico adopted the Sandia hairstreak as its official state butterfly in 2003."
- question: What does the Sandia hairstreak look like?
  answer: "It is a small, tailless butterfly with reddish-brown or brown wings on top and a bright iridescent green underside edged with thin white lines."
- question: Where is the Sandia hairstreak found in New Mexico?
  answer: "It lives at elevations of about 4,200 to 7,200 feet wherever its host plant, beargrass, grows, including the Sandia Mountains near Albuquerque where it was first found."
- question: Is New Mexico's state insect the same as its state butterfly?
  answer: "No. New Mexico's state insect is the tarantula hawk wasp, adopted in 1989. The Sandia hairstreak is a separate designation, the official state butterfly, adopted in 2003."

