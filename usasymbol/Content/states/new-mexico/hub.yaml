name_meaning:
  heading: What Does New Mexico Mean?
  paragraphs:
  - New Mexico became the 47th state in 1912. The name comes from Nuevo Mexico, a Spanish colonial name used for the region long before U.S. statehood.
  - The name carries Spanish colonial history, but the modern symbols also foreground Indigenous meaning. The Zia sun symbol on the flag, the official red and yellow colors, the yucca flower, and the piñon pine all make New Mexico's hub feel place-specific rather than generic Southwestern.
  - New Mexico's postal abbreviation is NM, and residents are New Mexicans. The Land of Enchantment is the main nickname and has official status in this guide.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From Nuevo Mexico, the Spanish name used for the region before U.S. statehood.
    - label: Statehood
      text: New Mexico became the 47th state in 1912.
    - label: Motto
      text: Crescit Eundo is commonly translated as It Grows as It Goes.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to New Mexico, a Southwestern state shaped by Pueblo, Hispanic, and Anglo histories.
    - label: Flag
      text: The state flag uses a red Zia sun symbol on a yellow field.
    - label: People
      text: People from New Mexico are called New Mexicans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Land of Enchantment
      text: Main nickname and one of the strongest tourism identities among U.S. states.
    - label: Red and yellow
      text: Official colors connected with the flag and old Spain language in state law.
    - label: Abbreviation
      text: NM; older short form N.M.
editorial:
  heading: What New Mexico's Symbols Say About the State
  paragraphs:
  - New Mexico's [state flag](/states/new-mexico/flag) is the hub's visual center. The Zia sun symbol and red-on-yellow design are strong enough that the [state colors](/states/new-mexico/color) feel like part of the same symbol rather than a separate decorative choice.
  - "The [piñon pine](/states/new-mexico/tree) and [yucca flower](/states/new-mexico/flower) make the landscape specific: high desert, dry slopes, edible pine nuts, and plants that can survive where softer garden symbols would not."
  - The [greater roadrunner](/states/new-mexico/bird) and [black bear](/states/new-mexico/mammal/black-bear) widen the wildlife frame, while [Crescit Eundo](/states/new-mexico/motto) gives the state a motto that sounds like motion across open country.
faq:
- question: What is New Mexico's most famous state symbol?
  answer: The [New Mexico state flag](/states/new-mexico/flag) is the clearest visual shorthand for the state, with its red Zia sun on a yellow field.
- question: What is New Mexico's state bird?
  answer: New Mexico's state bird is the [greater roadrunner](/states/new-mexico/bird), adopted in 1949.
- question: What is New Mexico's state flower?
  answer: New Mexico's state flower is the [yucca flower](/states/new-mexico/flower), adopted in 1927.
- question: What does the Zia symbol on New Mexico's flag represent?
  answer: The [New Mexico flag](/states/new-mexico/flag) uses the Zia sun symbol, a sacred emblem associated with the Zia Pueblo, as the center of the red-and-yellow design.
- question: How many official state symbols does New Mexico have?
  answer: The New Mexico pages collected here cover the flag, roadrunner, yucca, piñon pine, motto, nickname, colors, and black bear.
