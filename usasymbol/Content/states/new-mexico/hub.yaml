seo_description: "New Mexico state symbols: official state symbols include the greater roadrunner, yucca flower, piñon pine, red Zia flag, and Land of Enchantment nickname."
snippet_answer: "The red Zia sun flag is New Mexico's most recognized official state symbol, drawn from a sacred Zia Pueblo design and one of the most visually distinctive state flags in the country. The greater roadrunner, yucca flower, piñon pine, Crescit Eundo motto, and Land of Enchantment nickname complete a list shaped by Pueblo heritage, Spanish colonial history, and high-desert life."
