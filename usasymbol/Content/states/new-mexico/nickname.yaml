title: "The Land of Enchantment"
state: "New Mexico"
type: "State Nickname"
is_official: true
adopted_year: 1999
other_nicknames:
  - "The Sunshine State"
  - "The Cactus State"
  - "The Spanish State"

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-17"
seo_title: "New Mexico State Nickname: The Land of Enchantment"
seo_description: "New Mexico is called the Land of Enchantment due to its unique landscapes, multicultural history, and distinctive Southwest character."

intro_text: "Writer Lillian Whiting first used the phrase <i>Land of Enchantment</i> as a book title in 1906 when describing New Mexico and the Southwest. The legislature officially adopted Land of Enchantment as the state nickname on June 18, 1999. The phrase appeared on New Mexico license plates starting in 1941, decades before becoming the official designation."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Land of Enchantment'"
    paragraphs:
      - "Lillian Whiting published a book about New Mexico in 1906 with Land of Enchantment in the title. The State Tourist Bureau began using the phrase in promotional materials in September 1935 when Director Joseph A. Bursey designed brochures featuring the slogan. New Mexico Magazine started advertising with Land of Enchantment that same year to encourage tourism. The nickname gained popularity through these tourism campaigns."
      - "The Land of Enchantment nickname refers to the state's diverse natural scenery, including snow-capped mountains, desert landscapes, hot springs, and dramatic rock formations. The cultural richness of Native American, Spanish, and Mexican heritage also contributes to the enchanting character. White Sands National Park features vast gypsum sand dunes that create an otherworldly landscape. Carlsbad Caverns contains massive underground chambers formed over millions of years."
      - "The Tourist Bureau sought formal recognition for its use of Land of Enchantment in 1947. License plates displayed the phrase starting in 1941, replacing Sunshine State which had appeared on plates before then. The legislature made Land of Enchantment the official state nickname through legislation passed on June 18, 1999, more than fifty years after it first appeared on license plates — one of the longer journeys from informal use to official status in the [all 50 state nicknames explained](/symbols/nicknames)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Sunshine State"
        text: "New Mexico used Sunshine State on license plates before 1941, when it was replaced by Land of Enchantment. The state receives approximately 310 days of sunshine annually in many cities, including Albuquerque. [Florida's official nickname](/states/florida/nickname/the-sunshine-state) — the Sunshine State — was not formally adopted until 1970, by which time New Mexico had already moved to Land of Enchantment for a more distinctive identity. Clear skies and abundant sunlight made the name appropriate for New Mexico's climate. The transition to Land of Enchantment occurred because tourism officials wanted a more distinctive phrase that captured broader aspects of the state's appeal beyond just weather."
      - subtitle: "The Cactus State"
        text: "Cacti grow abundantly throughout New Mexico, particularly along the southern border with Mexico and across desert plains. Multiple species thrive in the arid climate, including prickly pear, cholla, and barrel cacti. The Cactus State nickname appeared in various publications and travel guides during the early 1900s. Cacti provide food and shelter for desert wildlife and played important roles in Native American cultures. This nickname never gained the same widespread recognition as Land of Enchantment but remains associated with New Mexico's desert landscape."
      - subtitle: "The Spanish State"
        text: "New Mexico earned this nickname because of its border with Mexico, historical Spanish colonial period, and significant Spanish-speaking population. Spanish explorers arrived in the region during the 1500s and established settlements long before English colonists reached the East Coast. The same colonial wave washed across neighboring Arizona — [Arizona's state moniker](/states/arizona/nickname/the-grand-canyon-state) today emphasizes its natural grandeur, but the state shares New Mexico's deep Spanish and Mexican cultural heritage. Spanish remains widely spoken across the state today. Spanish colonial architecture, place names, and cultural traditions remain visible throughout New Mexico. The state seal features both an American eagle and a Mexican eagle, recognizing the dual heritage. This nickname acknowledges the lasting influence of Spanish and Mexican culture on New Mexico's identity."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The New Mexico nickname and motto are Land of Enchantment and Crescit eundo."
      - "The state motto comes from a first-century poem by Lucretius describing a thunderbolt gaining strength as it moves across the sky."
      - "Territorial Secretary William G. Ritch added Crescit eundo to the territorial seal in 1882, and it became the official motto when New Mexico gained statehood in 1912."
      - "New Mexico became the 47th state on January 6, 1912, after being a U.S. territory since 1850."
      - "The state quarter released in 2008 features a Zia sun symbol over a topographical outline with the inscription Land of Enchantment."
      - "A 1947 incident in Roswell involving a crashed military balloon led to decades of speculation about extraterrestrial visitors."

