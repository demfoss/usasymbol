sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is New Mexico's State Cookie?"
    paragraphs:
      - "The bizcochito is New Mexico's official state cookie, designated by the New Mexico Legislature in 1989. It is a crisp, lard or butter based cookie flavored with anise and dusted in cinnamon sugar."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Bizcochito"
    paragraphs:
      - "A bizcochito is made from a rich dough of flour, lard or butter, sugar, and anise seed, often cut into fluted diamond shapes and coated with cinnamon sugar after baking. The anise flavor sets it apart from most American sugar cookies."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Bizcochito Became New Mexico's State Cookie"
    paragraphs:
      - "The New Mexico Legislature designated the bizcochito the official state cookie in 1989, recognizing a recipe with deep roots in the state's Hispanic communities."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Mexico Chose the Bizcochito"
    paragraphs:
      - "The bizcochito traces back to recipes brought by Spanish colonists to what is now New Mexico, and it has remained a staple at weddings, holidays, and celebrations in the state's Hispanic communities for generations. That long, documented cultural presence made it the clear choice for state cookie."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Bizcochito Facts"
    facts:
      - "Adopted as New Mexico's state cookie in 1989."
      - "Flavored with anise seed and coated in cinnamon sugar."
      - "Traces back to Spanish colonial recipes brought to New Mexico."

