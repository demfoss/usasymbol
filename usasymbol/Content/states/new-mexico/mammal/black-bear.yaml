faq:
  - question: "What is New Mexico's state animal?"
    answer: "New Mexico's state animal is the black bear (Ursus americanus), designated February 8, 1963, by the state legislature. The black bear was chosen to honor the state's mountain landscapes, the legacy of Smokey Bear (rescued from a 1950 wildfire in Lincoln National Forest), and New Mexico's shift from predator eradication to science-based wildlife conservation."

  - question: "When was the black bear designated as New Mexico's state animal?"
    answer: "The black bear became New Mexico's official state animal on February 8, 1963, when the legislature codified the designation in New Mexico Statutes Chapter 12, Article 3, Section 12-3-4. The timing was significant—occurring while Smokey Bear (rescued 1950) lived at the National Zoo as the most famous black bear in American history."

  - question: "Who was Smokey Bear and why is he important to New Mexico?"
    answer: "Smokey Bear was a real black bear cub rescued from the Capitan Gap Fire in Lincoln National Forest on May 9, 1950. Found clinging to a burned tree with injured paws and legs, he became the living symbol of the U.S. Forest Service's fire prevention campaign. Smokey lived at the National Zoo for 26 years, received over 13,000 letters weekly (necessitating his own ZIP code 20252), and was buried in Capitan, New Mexico after his death in 1976. He remains the most recognized individual animal in American history."

  - question: "How many black bears live in New Mexico?"
    answer: "New Mexico's black bear population is estimated at 6,000-8,000 individuals distributed across all major mountain ranges. Recent genetic studies (2012-2016) found the highest densities in northern New Mexico at approximately 28 bears per 100 square kilometers. The Sangre de Cristo Mountains support about 17 bears per 100 km², while the Sandia Mountains near Albuquerque maintain approximately 13.2 bears per 100 km². Populations are stable to increasing thanks to science-based conservation management."

  - question: "Where can you see black bears in New Mexico?"
    answer: "Black bears inhabit all major mountain ranges in New Mexico: Sangre de Cristo, Sacramento, Sandia, Manzano, Gila, Jemez, Capitan, and Mogollon Mountains. Best viewing opportunities occur in Lincoln National Forest (Smokey Bear's origin), Gila National Forest (extensive wilderness), Carson National Forest (northern mountains), and Santa Fe National Forest. Smokey Bear Historical Park in Capitan offers museum exhibits and Smokey's burial site. Bears are shy and sightings remain rare despite healthy populations."

  - question: "Why did grizzly bears disappear from New Mexico but black bears survived?"
    answer: "Grizzly bears were systematically eliminated from New Mexico through government-sponsored predator control programs and unregulated hunting, with the last grizzly killed north of Silver City in 1931. Even a 1927 law protecting grizzlies came too late—populations had declined below viable levels. Black bears survived because they inhabited more remote mountain terrain, had omnivorous diets that reduced livestock conflicts compared to grizzlies, climbed trees to escape danger, and had less aggressive temperaments making them less feared. The 1927 shift to regulated hunting allowed black bear populations to stabilize while grizzlies could not recover."

  - question: "What do New Mexico black bears eat?"
    answer: "Black bears are opportunistic omnivores eating whatever food is seasonally available. Spring diet includes grasses, emerging plant shoots, and insects. Summer brings berries, fruits, and insects. Fall represents critical feeding period (hyperphagia) when bears consume massive quantities of acorns, pinon nuts, juniper berries, chokecherries, and other high-calorie foods to build fat reserves for hibernation. They occasionally eat small mammals, carrion, and will consume human food/trash if accessible—a major cause of human-wildlife conflicts requiring proper food storage in bear country."

  - question: "Do black bears in New Mexico come in different colors?"
    answer: "Yes! Despite their name, New Mexico's black bears display remarkable color variation including jet black, various shades of brown, cinnamon, blonde, and reddish hues. Cinnamon and lighter brown coats are especially common in the Jemez Mountains and north-central New Mexico. All color phases belong to the same species (Ursus americanus)—color does not indicate subspecies, and cubs from the same litter can have different colors. This color polymorphism appears more pronounced in southwestern populations compared to eastern forests where truly black individuals dominate."

  - question: "How does New Mexico manage its black bear population?"
    answer: "The New Mexico Department of Game and Fish manages black bears as protected game animals with regulated hunting seasons requiring licenses. Biologists set annual harvest limits based on scientific population studies using genetic sampling, den checks (weighing bears, counting cubs, collecting DNA), and hunter harvest data. Typical annual harvest is several hundred bears from a population of 6,000-8,000. Management also includes human-wildlife conflict resolution, public education about coexistence strategies, habitat protection, and monitoring population trends. The department's emblem features a stylized bear head representing its commitment to responsible wildlife stewardship."

