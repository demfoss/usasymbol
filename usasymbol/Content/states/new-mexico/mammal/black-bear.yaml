title: "New Mexico State Animal | Black Bear"
scientific_name: "Ursus americanus"
adopted_year: 1963

seo_title: "New Mexico State Animal | Black Bear"
seo_description: "New Mexico's state animal is the Black Bear, adopted in 1963. Learn why this official New Mexico symbol was chosen and what it represents."

intro_text: "The Black Bear is the official New Mexico state animal, designated in 1963. This page gives the direct answer for searches like 'new mexico state animal', 'new mexico state animal', and 'new mexico state mammal' while explaining how the symbol fits the state's official animal designations. Smokey Bear origin (rescued 1950 from Capitan Gap Fire, Lincoln National Forest), wide color variation (black to cinnamon and blonde), New Mexico Department of Game and Fish emblem (bear head), survival during predator control era when grizzlies were eliminated."

common_name: "Black Bear"
official_since: "February 8, 1963"
status: "Protected game animal; regulated hunting with licenses; population estimated 6,000-8,000 statewide and steadily growing thanks to improved conservation; highest densities in northern New Mexico mountain ranges (Sangre de Cristo, Sacramento, Sandia, Gila)"
habitat_in_state: "Conifer and mixed woodland forests in mountain ranges; primary habitat includes closed-canopy pine, oak, juniper forests at elevations typically 5,000-11,000 feet; occasionally descends to lower elevations during droughts or when seeking food"
known_for: "Smokey Bear origin (rescued 1950 from Capitan Gap Fire, Lincoln National Forest), wide color variation (black to cinnamon and blonde), New Mexico Department of Game and Fish emblem (bear head), survival during predator control era when grizzlies were eliminated"

size: "Adult males: 5-6 feet long, 30-40 inches tall at shoulder; females smaller at 4-5 feet long"
weight: "Males: 200-400 pounds (average 250 pounds); females: 150-180 pounds; largest recorded in New Mexico: 495 pounds"
coloration: "Highly variable in New Mexico: black, brown, cinnamon, blonde, reddish hues; cinnamon and lighter brown coats especially common in Jemez Mountains and north-central New Mexico; despite name, truly black individuals represent only portion of population"
distinctive_traits: "Pointed muzzle, high-set rounded ears, short tail (3-5 inches), long curved claws for climbing trees, excellent sense of smell (can detect food over 1 mile away), color variations adapted to southwestern arid environments"

habitat: "Mountain forests with mixed conifer-oak-juniper woodlands; primary habitat classified as closed-canopy forest; requires woodland cover for shelter, dens under rock slabs, tree roots, downed trees, or in crevices between boulders; forages in meadows and forest openings"
range_in_state: "All major mountain ranges: Sangre de Cristo Mountains (northern/southern), Sacramento Mountains, Sandia Mountains, Manzano Mountains, Gila Mountains, Jemez Mountains, Capitan Mountains (Smokey Bear origin), Mogollon Mountains; occasionally descends to foothills near Albuquerque and East Mountain communities during droughts"
conservation_status: "Protected game animal; population stable and growing (6,000-8,000 individuals); regulated hunting seasons managed by New Mexico Department of Game and Fish using scientific population density studies; main threats include habitat loss, human-wildlife conflict, illegal poaching; survived early 1900s predator control that eliminated grizzlies"
where_to_find: "Smokey Bear Historical Park (Capitan), Lincoln National Forest, Gila National Forest, Carson National Forest, Santa Fe National Forest, Cibola National Forest, Sandia Mountain foothills (occasionally near Albuquerque), East Mountain communities (Tijeras, Cedar Crest)"
symbol_connections: "Smokey Bear (rescued 1950, buried Capitan), pinon pine (state tree, food source for bears - nuts), roadrunner (state bird, shares high desert/mountain transition zones), turquoise (state gem, both found in mountains), yucca (state flower, lower elevation transition habitat)"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    paragraphs:
      - "The New Mexico Legislature designated the black bear as the official state animal on February 8, 1963, codified in New Mexico Statutes Chapter 12, Article 3, Section 12-3-4. The designation reflected multiple converging factors in early 1960s New Mexico: the international fame of Smokey Bear (rescued from a 1950 wildfire and living at the National Zoo in Washington DC), growing recognition of mountain wilderness as defining New Mexico's character, and a fundamental shift in wildlife management philosophy from predator eradication toward scientific conservation. The timing proved significant—just 13 years after Smokey Bear's dramatic rescue made national headlines, and 32 years after the last grizzly bear was killed in New Mexico in 1931, marking the permanent extinction of that species from the state."
      - "By 1963, New Mexico had fully committed to modern wildlife management. Regulated black bear hunting had begun in 1927 with tracking populations and setting scientifically determined harvest limits rather than unlimited killing under bounty systems. The black bear's survival through the predator control era (when grizzlies, wolves, and cougars were systematically eliminated) transformed it into a symbol of resilience and adaptation. The New Mexico Department of Game and Fish adopted a stylized bear head as its official emblem, reinforcing the animal's role as representative of responsible wildlife stewardship. The designation honored both the state's natural heritage and its commitment to balancing human activities with wildlife conservation."

    subsections:
      - subtitle: "Shift from Predator Control to Conservation"
        text: "During the early twentieth century, government-sponsored predator control programs targeted large carnivores across New Mexico and the American West. Grizzly bears were systematically eliminated, with the last confirmed grizzly killed north of Silver City in 1931. Wolves and mountain lions declined sharply under bounty systems and government trapping operations. Black bears survived primarily because they inhabited remote mountain terrain where access remained difficult, and because they posed less threat to livestock than grizzlies or wolves. The 1927 shift to regulated hunting marked a turning point—rather than removing bears entirely, wildlife officials began tracking populations and setting sustainable harvest limits. By 1963, this science-based approach had proven successful, with black bear populations stable and the species no longer threatened by extirpation."

      - subtitle: "Smokey Bear Connection"
        text: "The 1963 designation occurred while Smokey Bear lived at the National Zoo as the most famous black bear in American history. Rescued as a three-month-old, five-pound cub from the Capitan Gap Fire in May 1950, Smokey became the living symbol of the U.S. Forest Service's wildfire prevention campaign. By 1963, millions of visitors had seen him at the zoo, and he received over 13,000 letters weekly—so much mail that the Postal Service assigned him his own ZIP code (20252) in 1964. Children across America grew up learning fire prevention through Smokey's message: 'Only YOU can prevent forest fires.' New Mexico took pride in being Smokey's birthplace, and the black bear designation honored both this specific famous individual and the species' broader representation of New Mexico's wilderness."

  - id: "state-symbolism"
    icon: "fa-certificate"
    title: "What the Black Bear Represents"
    style: "highlight"
    paragraphs:
      - "The black bear represents New Mexico's mountain wilderness character—high peaks, conifer forests, aspen groves, and rugged terrain that define much of the state's landscape and cultural identity. New Mexico's geography ranges from 2,842 feet elevation (Red Bluff Reservoir) to 13,167 feet (Wheeler Peak), with extensive mountain ranges including the Sangre de Cristo, Sacramento, Sandia, Manzano, Gila, Jemez, and Capitan Mountains. These forested highlands contrast dramatically with surrounding Chihuahuan Desert lowlands, creating unique 'sky island' ecosystems where black bears thrive. The bear symbolizes this vertical diversity—a mammal equally at home in high-elevation spruce-fir forests and lower pinon-juniper woodlands, adapted to New Mexico's distinctive combination of southwestern aridity and mountain moisture."
      - "The designation symbolizes recovery and coexistence. Black bears survived the early 1900s predator control era that eliminated grizzlies and decimated wolves and mountain lions. Their persistence represents successful adaptation to human-dominated landscapes—bears living in mountains surrounding Albuquerque, occasionally descending to foothills and even entering suburbs during droughts when natural food becomes scarce. This requires New Mexico residents to learn coexistence strategies: securing trash, removing bird feeders at night, protecting livestock, and understanding that living in 'bear country' means sharing space with wildlife. The black bear thus represents not just wilderness, but the ongoing challenge and responsibility of managing landscapes where humans and large mammals coexist."
      - "The Smokey Bear legacy remains central to the black bear's symbolic importance. Smokey's rescue from the 1950 Capitan Gap Fire transformed a personal tragedy (orphaned cub, burned paws and hind legs) into an enduring conservation message about fire prevention and ecosystem protection. His 26-year life at the National Zoo, his own ZIP code, his burial at Smokey Bear Historical Park in Capitan upon his death in 1976, and his continuation as the Forest Service's fire prevention icon (75th anniversary celebrated 2019) made him arguably the most recognized individual animal in American history. Every black bear in New Mexico thus carries Smokey's symbolic weight—reminding residents of wildfire's power, forests' fragility, and the human responsibility to prevent catastrophic fires through careful behavior."

    subsections:
      - subtitle: "Mountain Wilderness Identity"
        text: "New Mexico's mountain ranges create unique ecological zones rising above surrounding deserts and grasslands. These 'sky islands' support conifer forests, aspen groves, mountain meadows, and high-elevation ecosystems dramatically different from lower elevations just miles away. Black bears require these forested mountains—closed-canopy woodlands providing food (acorns, pinon nuts, berries, insects), water (mountain springs and streams), and shelter (dens under rocks or tree roots). The bear's presence indicates healthy mountain ecosystems with adequate food resources and minimal human disturbance. As New Mexico's state animal, the black bear anchors the state's identity to these mountain landscapes rather than the deserts and grasslands that cover more total acreage but feature less prominently in tourism marketing and cultural imagery."

      - subtitle: "Resilience Through Adversity"
        text: "The black bear's survival through the predator control era demonstrates remarkable resilience. While grizzlies disappeared entirely (last killed 1931), and wolves were extirpated from New Mexico by the 1920s (only recently reintroduced in limited areas), black bears persisted in remote mountain terrain where government trappers had limited access. Their omnivorous diet—eating plants, nuts, berries, insects, and carrion rather than specializing in large prey like grizzlies—reduced conflict with livestock ranchers. Their smaller size and less aggressive temperament compared to grizzlies made them less feared. Their ability to climb trees provided escape from danger. These adaptations enabled survival when larger, more specialized predators could not withstand human pressure. Today's 6,000-8,000 black bears descend from populations that persevered through New Mexico's most intensive predator control period."

      - subtitle: "Smokey Bear's Enduring Legacy"
        text: "Smokey Bear's story remains deeply embedded in New Mexico identity and American conservation consciousness. The Capitan Gap Fire of May 1950 (combined with Los Tablos Fire) burned 17,000 acres in Lincoln National Forest. On May 9, firefighters—including the Taos Pueblo Snowball crew—found a badly burned three-month-old cub clinging to a scorched tree. First called 'Hotfoot Teddy,' he was renamed Smokey after the already-existing fire prevention campaign character. After treatment in Santa Fe, he flew to Washington DC on June 27, 1950, beginning 26 years as the living symbol of fire prevention. Congress passed legislation in 1952 protecting his name and image. He received his own ZIP code (20252) in 1964 due to receiving 13,000+ letters weekly. After his death November 9, 1976, he was buried in Capitan. His message evolved (2001) from 'Only YOU can prevent forest fires' to 'Only YOU can prevent wildfires' to recognize that not all fire is bad—controlled burns and natural fires play important ecological roles."

  - id: "identification"
    icon: "fa-magnifying-glass"
    title: "About Black Bears"

    subsections:
      - subtitle: "Physical Description and Color Variation"
        text: "Despite their name, New Mexico's black bears display remarkable color variation—jet black, various shades of brown, cinnamon, blonde, and reddish hues. Truly black individuals may actually represent a minority in some areas. Cinnamon and lighter brown coats are especially common in the Jemez Mountains and north-central New Mexico. This color polymorphism occurs across North America but appears more pronounced in southwestern populations. All color phases have the same species characteristics: relatively straight facial profile (unlike grizzlies' dished face), no shoulder hump, rounded ears positioned high on head, short tail, and long curved claws adapted for climbing trees. Adult males average 250 pounds but can reach 400 pounds; females average 150-180 pounds. The largest black bear recorded in New Mexico weighed 495 pounds."
        list_items:
          - "**Size**: Males 5-6 feet long, 30-40 inches tall at shoulder, 200-400 pounds; females 4-5 feet long, 150-180 pounds"
          - "**Coloration**: Black, brown, cinnamon, blonde, reddish variations; color does not indicate subspecies—cubs from same litter can have different colors"
          - "**Distinguishing features**: Pointed muzzle, high-set rounded ears, no shoulder hump, short 3-5 inch tail, long curved claws for climbing"
          - "**Senses**: Excellent smell (detect food over 1 mile away), good hearing, moderate eyesight; primarily rely on nose for finding food and detecting danger"

      - subtitle: "Diet and Foraging Behavior"
        text: "Black bears are opportunistic omnivores consuming whatever food sources are seasonally available. In spring after emerging from hibernation, they eat grasses, forbs (flowering plants), emerging plant shoots, and insects. Summer diet includes berries, fruits, and insects with occasional small mammals or carrion. Fall represents critical hyperphagia (excessive eating) period when bears consume massive quantities of food to build fat reserves for hibernation—acorns, pinon nuts, juniper berries, chokecherries, and other high-calorie foods. A bear's annual cycle revolves around food availability, and poor mast crops (acorn and nut production) lead bears to travel greater distances seeking food, increasing human-wildlife conflicts. New Mexico's arid climate and periodic droughts create more variable food supplies than wetter regions, requiring behavioral flexibility."

      - subtitle: "Reproduction and Life Cycle"
        text: "Female black bears (sows) reach sexual maturity at 3-4 years old and typically breed every other year. Mating occurs in early summer (May-July), but implantation is delayed—fertilized eggs don't implant in the uterus until November when the female enters her winter den. This delayed implantation means cubs are born during hibernation in January-February, weighing only 8 ounces each. Litter sizes range from 1-3 cubs (occasionally 4). Cubs remain with their mother through their first full year, learning foraging skills, den site selection, and territory navigation. Yearling cubs disperse in their second spring when the mother prepares to breed again. Males (boars) play no role in raising cubs. In the wild, black bears can live 20-25 years; in captivity, they may reach 30+ years (Smokey Bear lived 26 years)."

      - subtitle: "Hibernation and Denning"
        text: "New Mexico black bears enter dens in late October through December depending on elevation, weather, and food availability. Unlike true hibernators (whose body temperature drops dramatically), bears experience torpor—body temperature decreases only 7-8 degrees Fahrenheit, allowing them to wake quickly if disturbed. Pregnant females enter dens earliest and remain longest (up to 6 months); adult males may den for only 3-4 months. Den sites include natural caves (less common), excavations under rock slabs or tree roots, crevices between large boulders, and spaces beneath downed trees. Bears select sites with good insulation, drainage, and concealment. New Mexico Department of Game and Fish biologists conduct late-winter den checks (February-March) to weigh bears, assess body condition, count newborn cubs, and collect DNA samples for population monitoring. These data inform science-based management decisions and harvest regulations."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Black Bears in New Mexico"
    paragraphs:
      - "New Mexico supports an estimated 6,000-8,000 black bears distributed across all major mountain ranges in the state. Recent population studies using genetic sampling and spatially explicit capture-recapture methods found the highest densities in northern New Mexico—approximately 28 bears per 100 square kilometers in prime habitat areas. The Sangre de Cristo Mountains (northern and southern sections:) support density estimates around 17 bears per 100 km². The Sandia Mountains near Albuquerque maintain approximately 13.2 bears per 100 km². Other significant populations occur in the Sacramento Mountains, Gila Mountains, Jemez Mountains, Capitan Mountains, and Manzano Mountains. These populations remain stable to slightly increasing thanks to science-based management, regulated hunting seasons, habitat protection, and improved public education about coexistence strategies."
      - "Black bears in New Mexico occupy 'primary habitat' defined as closed-canopy forest and woodland types—predominantly mixed conifer forests with ponderosa pine, Douglas-fir, white fir, Engelmann spruce, and aspen at higher elevations (8,000-11,000 feet), and pinon-juniper woodlands at mid-elevations (5,000-8,000 feet). These mountain forests create islands rising above surrounding desert and grassland, requiring bears to have large home ranges encompassing adequate food resources and denning sites. Adult male home ranges can exceed 100 square miles; female home ranges typically span 10-40 square miles. During droughts or poor food years (low acorn and pinon nut production), bears descend to lower elevations and may enter foothills communities near Albuquerque, Santa Fe, and East Mountain areas, creating management challenges when bears access human food sources (trash, pet food, bird feeders)."

    facts:
      - "**Population**: 6,000-8,000 black bears statewide; highest densities (28 bears/100 km²) in northern mountain ranges; populations stable to increasing"
      - "**Mountain Ranges**: Sangre de Cristo, Sacramento, Sandia, Manzano, Gila, Jemez, Capitan, Mogollon Mountains—all major forested ranges support populations"
      - "**Elevation Range**: Primarily 5,000-11,000 feet in conifer and mixed woodland forests; occasionally descend to 4,000 feet during droughts seeking food"
      - "**Management**: Protected game animal; regulated hunting seasons with license requirements; harvest limits set using scientific population studies and density estimates"
      - "**Human Conflicts**: Several hundred bear-human encounters annually; most uneventful but can result in property damage; bears accessing trash/food may be relocated or euthanized if conflicts persist"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Black Bears"
    paragraphs:
      - "Black bears are shy, reclusive animals that actively avoid humans when possible. Actually seeing a bear in the wild remains a rare experience despite healthy populations. The best opportunities occur during early morning or evening hours in mountain forests during summer and fall when bears forage actively before hibernation. Visitors should maintain safe distances (at least 100 yards), never approach or feed bears, and make noise while hiking to avoid surprising bears at close range."

    list_items:
      - "**Smokey Bear Historical Park** (Capitan): Museum and interpretive exhibits about Smokey Bear's rescue from 1950 Capitan Gap Fire; Smokey's burial site; fire ecology education; Lincoln National Forest nearby offers bear habitat but seeing wild bears not guaranteed"
      - "**Lincoln National Forest**: Site of Smokey Bear's 1950 rescue; extensive mountain forests; Capitan Mountains, Sacramento Mountains, and Guadalupe Mountains sections:; hiking trails through bear habitat; practice proper food storage at campgrounds"
      - "**Gila National Forest**: New Mexico's largest national forest; Gila Wilderness (nation's first designated wilderness, 1924); extensive remote backcountry; higher probability of seeing bears than more accessible areas; last grizzly killed 1931 near here"
      - "**Carson National Forest**: Northern New Mexico including portions of Sangre de Cristo Mountains; Wheeler Peak Wilderness (state's highest peak, 13,167 feet); excellent bear habitat; Taos area access"
      - "**Santa Fe National Forest**: Sangre de Cristo Mountains, Jemez Mountains; Pecos Wilderness; Sandia Mountains near Albuquerque; higher human use means bears more wary but present"
      - "**Cibola National Forest**: Sandia Mountains (frequent bear sightings in foothills), Manzano Mountains, Mount Taylor; bears occasionally wander into Albuquerque East Mountain communities (Tijeras, Cedar Crest) especially during droughts"
      - "**Bandelier National Monument**: Jemez Mountains; cinnamon/brown color variations common; ancient Puebloan cliff dwellings plus bear habitat; hike early morning or evening for best chances"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Conservation and Management"
    paragraphs:
      - "New Mexico's black bear population remains stable to increasing, estimated at 6,000-8,000 individuals statewide. The New Mexico Department of Game and Fish manages bears as a protected game animal with regulated hunting seasons requiring licenses. Annual harvest typically ranges from several hundred bears, with limits set based on scientific population studies using genetic sampling, den checks, and harvest data analysis. Biologists conduct late-winter den checks to weigh bears, assess body condition, count newborn cubs, and collect DNA samples. These data inform management decisions ensuring sustainable harvest levels that maintain healthy populations. Recent studies (2012-2016) using noninvasive genetic sampling found higher densities than previously estimated in some areas, indicating successful conservation."
      - "Primary management challenges include human-wildlife conflicts, especially in communities bordering mountain forests. During droughts or years with poor acorn and pinon nut crops, hungry bears descend to lower elevations seeking food, bringing them into contact with human development. Bears accessing trash, pet food, and bird feeders can become habituated to human-associated food, losing their natural wariness and potentially becoming aggressive. New Mexico law prohibits intentionally feeding bears. When conflicts occur, Game and Fish officers may trap and relocate bears, but relocation success rates remain low—many relocated bears either return to original areas or die in unfamiliar territories. Persistent problem bears may be euthanized. Prevention through proper food storage, secured trash containers, removing attractants, and public education remains far more effective than reactive management after conflicts develop."

    subsections:
      - subtitle: "Regulated Hunting"
        text: "New Mexico classifies black bears as protected game animals legally hunted only during specific seasons with required licenses issued by the Department of Game and Fish. Hunting regulations include season dates, weapon restrictions, harvest quotas by zone, and mandatory reporting of harvested bears. Hunters must report bear kills within 24 hours, and biologists collect biological samples (tooth for aging, DNA samples) from all harvested bears, providing crucial population monitoring data. Harvest levels are set conservatively to ensure sustainable populations—even intensive hunting (several hundred bears harvested annually from population of 6,000-8,000) does not threaten population viability because bears have low reproductive rates but high survival rates when properly managed. Hunting also serves social function by maintaining bears' wariness of humans, reducing habituation that leads to conflicts."

      - subtitle: "Human-Wildlife Coexistence"
        text: "Living in 'bear country' requires New Mexico residents to practice coexistence strategies that prevent conflicts before they develop. Simple steps make dramatic differences: storing trash in bear-resistant containers or keeping garbage inside until morning of pickup; removing bird feeders from late March through November (bears don't need supplemental feeding, natural food suffices); bringing pet food inside immediately after feeding; cleaning barbecue grills after use; harvesting ripe fruit from trees; keeping chickens and livestock in secure enclosures. Communities in foothills zones (Sandia Heights, East Mountain areas, Santa Fe outskirts) experience regular bear activity, especially during dry years. Education programs teach residents that a fed bear becomes a dead bear—once habituated to human food, bears lose natural wariness, become persistent nuisance problems, and often must be destroyed. Maintaining bears' natural fear of humans protects both species."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connection to New Mexico Symbols"
    paragraphs:
      - "The black bear connects to New Mexico's other state symbols through shared mountain ecosystems and cultural associations. The pinon pine (state tree since 1949) produces pinon nuts that represent critical fall food for bears preparing for hibernation—a single tree can produce 25 pounds of nuts, and bears travel extensively seeking productive pinon stands. The roadrunner (state bird since 1949) inhabits lower elevation pinon-juniper woodlands that form the transition zone between mountain forests and desert lowlands—areas where bears occasionally descend seeking food. The turquoise (state gem since 1967) comes from mines in mountainous regions where bears live, connecting both symbols to New Mexico's highland character."

    subsections:
      - subtitle: "State Tree: Pinon Pine"
        text: "The pinon pine (Pinus edulis), designated New Mexico's state tree in 1949, produces pinon nuts that provide crucial high-calorie food for black bears during fall hyperphagia (pre-hibernation excessive eating period). Pinon nut production varies dramatically year-to-year based on weather patterns, creating 'mast years' with abundant nuts followed by lean years with few nuts. During poor mast years, bears struggle to accumulate sufficient fat reserves for hibernation, leading them to travel greater distances seeking food and increasing encounters with humans in developed areas. This ecological connection between state tree and state animal demonstrates how New Mexico's mountain ecosystems function as integrated systems where different species depend on common food resources. Indigenous peoples also harvested pinon nuts as staple food, creating cultural connections spanning thousands of years."
        link:
          label: "See New Mexico state tree"
          url: "/states/new-mexico/tree/pinon-pine"

      - subtitle: "State Bird: Roadrunner"
        text: "The greater roadrunner (Geococcyx californianus), designated state bird in 1949, inhabits lower elevations (below 7,000 feet) where pinon-juniper woodlands, grasslands, and desert scrub create mosaic landscapes. This represents the transition zone between bear habitat (higher elevation forests) and true desert. During droughts or food shortages, black bears descend through these transition zones, occasionally appearing in roadrunner territory near human communities. Both species symbolize New Mexico's distinctive ecological character—the roadrunner representing iconic desert Southwest imagery, while the black bear represents mountain wilderness. Together they span the dramatic elevation gradients defining New Mexico's landscape, from Chihuahuan Desert lowlands to high peaks exceeding 13,000 feet."
        link:
          label: "See New Mexico state bird"
          url: "/states/new-mexico/bird/greater-roadrunner"

      - subtitle: "State Flower: Yucca"
        text: "The yucca flower (from Yucca glauca), adopted as state flower in 1927, grows in lower elevation grasslands, desert areas, and pinon-juniper woodlands below primary bear habitat. Like the roadrunner, yucca represents the drier portions of New Mexico's ecological spectrum. However, yuccas extend into mountain foothills where they occasionally overlap with the lower elevation limits of black bear range. Both symbols represent native species well-adapted to New Mexico's arid Southwestern climate—yuccas through drought tolerance and specialized relationships with yucca moths for pollination, black bears through behavioral flexibility and ability to survive in relatively dry mountainous environments compared to black bears in wetter regions like the Pacific Northwest or Appalachians."
        link:
          label: "See New Mexico state flower"
          url: "/states/new-mexico/flower/yucca"

