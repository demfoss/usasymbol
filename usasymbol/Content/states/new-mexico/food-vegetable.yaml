hero_image_caption: "Chile and pinto beans, New Mexico's official state vegetables, are staples of the state's farms and kitchens."
intro_text: "New Mexico's state vegetables are chile and pinto beans, adopted together in 1965 as staples of the state's agriculture and home cooking. This profile appears in the [list of U.S. state foods](/symbols/vegetables)."

sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is New Mexico's State Vegetable?"
    paragraphs:
      - "New Mexico chile and pinto beans are the state's official state vegetables, designated together by the New Mexico Legislature in 1965. They are two of the most widely grown and widely eaten crops in the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About New Mexico Chile and Pinto Beans"
    paragraphs:
      - "New Mexico chile is a variety of chile pepper grown for both green and red harvests, used fresh, roasted, or dried into powder. Pinto beans are a mottled, tan-and-brown dry bean grown across the state's farmland and cooked whole or refried. Both crops are central to New Mexican cuisine."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Chile and Pinto Beans Became New Mexico's State Vegetable"
    paragraphs:
      - "The New Mexico Legislature designated chile and pinto beans the state's joint official vegetables in 1965, recognizing two crops long grown across the state's farmland."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Mexico Chose Chile and Pinto Beans"
    paragraphs:
      - "New Mexico lawmakers chose chile and pinto beans because both crops have deep roots in the state's farming history and are staples of everyday New Mexican cooking, from red and green chile sauces to pinto beans served alongside nearly every meal."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Chile and Pinto Beans Come From in New Mexico"
    paragraphs:
      - "New Mexico chile is most closely associated with the Hatch Valley in Doña Ana County, where the region's soil and climate produce chile prized for flavor and heat. Pinto beans are grown widely across the state, with northern New Mexico historically known for bean farming."
    sites:
      - name: Hatch Valley
        city: Hatch
        lat: 32.6698
        lng: -107.1548
        note: "Famous chile-growing region of southern New Mexico"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Chile and Pinto Beans Facts"
    facts:
      - "Adopted as New Mexico's state vegetables together in 1965."
      - "The Hatch Valley is New Mexico's best-known chile-growing region."
      - "Pinto beans are grown across many parts of New Mexico's farmland."
      - "Chile and pinto beans are staples of everyday New Mexican cooking."

