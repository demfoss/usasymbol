seo_title: "New Mexico State Vegetable | Chile and Pinto Beans"
seo_description: "New Mexico's state vegetables are chile and pinto beans, adopted in 1965, two staples of the state's agriculture and cooking."
hero_image: /images/foods/new-mexico/new-mexico-state-vegetable-hero.webp
