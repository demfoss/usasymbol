    answer: "New Mexico's state vegetables are chile and pinto beans, adopted together by the New Mexico Legislature in 1965."
  - question: "When did New Mexico adopt chile and pinto beans as its state vegetables?"
    answer: "The New Mexico Legislature designated chile and pinto beans the state's official vegetables in 1965."
  - question: "Why did New Mexico choose chile and pinto beans?"
    answer: "New Mexico chose chile and pinto beans because both crops have deep roots in the state's farming history and everyday cooking."
  - question: "Where does chile come from in New Mexico?"
    answer: "New Mexico chile is most closely associated with the Hatch Valley in Doña Ana County, known for its flavor and heat."

