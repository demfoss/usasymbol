faq:
- question: What is New Mexico's license plate slogan?
  answer: New Mexico's main license plate slogan is "Land of Enchantment."
- question: When did Land of Enchantment first appear on New Mexico plates?
  answer: It first appeared in 1941 as "The Land of Enchantment." The shorter "Land of Enchantment" form began in 1952.
- question: What are New Mexico's current standard plates?
  answer: New Mexico lists yellow, turquoise, and chile plates as standard options.
- question: What does the chile plate say?
  answer: The chile plate says "Chile Capital of the World" at the top and "Land of Enchantment" at the bottom.
- question: What did New Mexico plates say before Land of Enchantment?
  answer: New Mexico used "Sunshine State" in 1932 and a Coronado Cuarto Centennial commemorative plate in 1940.

