seo_title: 'New Mexico License Plate Slogan: Land of Enchantment, Chile Capital & History'
seo_description: New Mexico's plate slogan "Land of Enchantment" first appeared in 1941 as "The Land of Enchantment" and was shortened in 1952. Current standard plates include yellow, turquoise, and chile designs.
hero_image: /images/license-plates/new-mexico/2017-chile-capital.jpg
hero_image_alt: New Mexico chile license plate with Chile Capital of the World and Land of Enchantment slogans
hero_image_caption: New Mexico's chile plate carries "CHILE CAPITAL OF THE WORLD" at the top and "Land of Enchantment" at the bottom.
intro_text: '**"Land of Enchantment"** is New Mexico''s defining license plate slogan. It first appeared in 1941 as **"The Land of Enchantment"** and was shortened to **"Land of Enchantment"** in 1952. Today New Mexico offers three standard plate designs: the yellow yucca plate, the turquoise plate, and the chile plate. The yellow and turquoise plates use "Land of Enchantment," while the chile plate adds **"Chile Capital of the World"** at the top and keeps "Land of Enchantment" at the bottom.'
quick_answer: 'New Mexico''s main plate slogan is "Land of Enchantment." It began in 1941 as "The Land of Enchantment" and changed to the shorter form in 1952. Current standard options include the yellow yucca plate, the turquoise Land of Enchantment plate, and the chile plate reading "Chile Capital of the World."'
