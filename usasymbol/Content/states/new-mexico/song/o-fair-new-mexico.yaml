faq:
  - question: What is New Mexico's state song?
    answer: "New Mexico's official state song is \"O Fair New Mexico,\" adopted in 1917."
  - question: Who wrote New Mexico's state song?
    answer: "Elizabeth Garrett wrote both the words and the music around 1915."
  - question: When did New Mexico adopt "O Fair New Mexico" as its state song?
    answer: "The New Mexico Legislature adopted the song on March 14, 1917."
  - question: Was Elizabeth Garrett related to a famous lawman?
    answer: "Yes. She was the daughter of Pat Garrett, the sheriff known for killing outlaw Billy the Kid."

