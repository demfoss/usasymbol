sections:
  - id: overview
    icon: fa-solid fa-music
    title: New Mexico State Song
    paragraphs:
      - "\"O Fair New Mexico\" is New Mexico's official state song, adopted in 1917. Elizabeth Garrett wrote both the words and the music, and the legislature voted to make it official the day after she performed it in person at the state capitol."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"O Fair New Mexico\" Explained"
    paragraphs:
      - "The song praises New Mexico's mountains, mesas, and sunshine in a warm, declarative style, closer to a personal anthem than a ballad. Garrett originally composed it in a tango rhythm popular in the 1910s before it took on the more stately form used today."
      - "Elizabeth Garrett was born in 1885 and lost her sight at or shortly after birth. She was the daughter of Pat Garrett, the sheriff famous for killing outlaw Billy the Kid, yet she built her own career as a singer and composer independent of her father's reputation."
      - "At the request of New Mexico Governor Washington E. Lindsey, Garrett performed the song herself before the state legislature in Santa Fe in 1917."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "O Fair New Mexico" Represents New Mexico
    paragraphs:
      - "New Mexico adopted the song for its direct, affectionate portrait of the state's landscape and light, written by a New Mexican rather than an outside songwriter. Garrett's personal performance before lawmakers gave the choice an immediate, memorable endorsement."
      - "The song's popularity was cemented by a unanimous vote the day after that performance, an unusually fast and decisive path to adoption. New Mexico has since added several other official songs, but \"O Fair New Mexico\" remains the primary one taught in schools."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"O Fair New Mexico\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "O Fair New Mexico" Became New Mexico's State Song
    paragraphs:
      - "The New Mexico Legislature adopted \"O Fair New Mexico\" as the official state song on March 14, 1917, one day after Elizabeth Garrett performed it for lawmakers in Santa Fe at Governor Washington E. Lindsey's request. Legislators voted unanimously to approve it."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of New Mexico

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"O Fair New Mexico\" Facts"
    facts:
      - "New Mexico adopted \"O Fair New Mexico\" as its official state song in 1917."
      - "Elizabeth Garrett wrote both the words and the music and was blind from infancy."
      - "She was the daughter of Pat Garrett, the sheriff who killed outlaw Billy the Kid."
      - "Garrett performed the song herself before the legislature the day before its unanimous adoption."
      - "New Mexico now recognizes four other official songs alongside \"O Fair New Mexico.\""

