sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of New Mexico?
    paragraphs:
      - "The New Mexico spadefoot toad is New Mexico's official state amphibian, designated by the New Mexico Legislature in 2003. Its scientific name is Spea multiplicata, and it is well adapted to the state's dry climate."
      - "It is found across much of New Mexico's desert and grassland habitat."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the New Mexico Spadefoot Toad
    paragraphs:
      - "The New Mexico spadefoot toad is gray, brown, or olive with smooth, moist skin and large eyes with vertical pupils, unlike the rounder pupils of true toads."
      - "It has a hard, dark, spade-shaped growth on each hind foot, which it uses to dig backward into loose desert soil."
      - "Adults typically grow to about 2 inches long and spend most of the year buried underground, emerging mainly after summer rains to breed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The New Mexico Legislature designated the New Mexico spadefoot toad the official state amphibian in 2003, recognizing an amphibian well suited to the state's arid landscape."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New Mexico Chose the New Mexico Spadefoot Toad
    paragraphs:
      - "The New Mexico spadefoot toad is named after the state and is specially adapted to survive New Mexico's dry desert conditions, making it a fitting symbol of the state's unique environment."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the New Mexico Spadefoot Toad
    paragraphs:
      - "New Mexico spadefoot toads are found throughout much of New Mexico's desert and grassland regions, including areas around the Rio Grande valley."
    sites:
