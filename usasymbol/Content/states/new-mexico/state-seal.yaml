name: Great Seal of New Mexico
adopted_year: 1912
is_official: true
legislation: New Mexico Statutes Annotated § 12-3-2
meaning: "The Great Seal of New Mexico is built around one unusual image: an American bald eagle carrying a smaller Mexican eagle on its chest, the Mexican eagle gripping a serpent in its beak and a cactus in its talons. The design places the central symbol of Mexican sovereignty inside the body of the American eagle, directly marking New Mexico's transfer from Mexican rule to U.S. statehood. The Latin motto Crescit Eundo, drawn from Lucretius, was chosen to describe growth through forward motion, fitting for a territory that petitioned for statehood for decades before admission in 1912."
