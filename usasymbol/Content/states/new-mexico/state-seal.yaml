sections:
- id: history
  icon: fa-solid fa-landmark
  title: New Mexico State Seal History and Origin
  paragraphs:
  - "New Mexico waited 62 years as a U.S. territory before achieving statehood. Organized as a territory in 1850 following the Mexican-American War and the Treaty of Guadalupe Hidalgo, New Mexico spent more than six decades under territorial administration before Congress approved its statehood bid. On January 6, 1912, President William Howard Taft signed the proclamation admitting New Mexico as the 47th state."
  - "The seal was adopted with statehood and reflects New Mexico's layered past more directly than most state seals. The territory had been part of New Spain, then the Mexican Republic, then a U.S. territory for over half a century. The designers encoded that history visually: the American eagle shelters a Mexican eagle on its chest, the Mexican coat of arms element placed inside the American symbol."
  - "The motto Crescit Eundo was selected from Lucretius's first-century BCE poem De Rerum Natura. In the poem, the phrase describes a thunderbolt growing in power as it moves through clouds. New Mexico adopted it at statehood, pointing forward after decades of territorial waiting."

- id: elements
  icon: fa-solid fa-shapes
  title: What the New Mexico State Seal Symbols Mean
  paragraphs:
  - "New Mexico's seal concentrates its meaning in the relationship between two eagles and a three-word Latin motto."
  elements:
  - id: american-eagle
    name: American Bald Eagle
    image: /images/state-seals/new-mexico/elements/american-eagle.webp
    paragraphs:
    - "The American bald eagle is the dominant figure on the seal, shown with wings fully spread. It represents the United States and U.S. sovereignty over New Mexico. The spread-wing posture echoes the Great Seal of the United States, placing New Mexico in the tradition of American federal symbols."
    - "The eagle holds a ribbon with the motto Crescit Eundo. Its larger size relative to the Mexican eagle establishes the visual hierarchy: American sovereignty is the outer frame, while New Mexico's Mexican heritage is carried within it."
  - id: mexican-eagle
    name: Mexican Eagle
    image: /images/state-seals/new-mexico/elements/mexican-eagle.webp
    paragraphs:
    - "On the chest of the American eagle, a smaller Mexican golden eagle holds a serpent in its beak and a cactus (nopal) in its talons. This image is drawn directly from the Mexican national coat of arms, the same symbol that appears on the Mexican flag."
    - "The Mexican eagle traces to the Aztec legend of Tenochtitlan: priests were told to build their city where they saw an eagle perched on a cactus holding a snake. That location became the capital of the Aztec Empire and later Mexico City. Placing this symbol on the breast of the American eagle acknowledged the deep Mexican and indigenous heritage of New Mexico's people and land at the moment of statehood."
  - id: crescit-eundo
    name: Crescit Eundo (State Motto)
    image: /images/state-seals/new-mexico/elements/motto.webp
    paragraphs:
    - "*Crescit Eundo* is Latin for 'It grows as it goes.' The phrase comes from Book VI of De Rerum Natura by the Roman poet Lucretius, where it describes a thunderbolt gaining force as it moves through the atmosphere. New Mexico adopted it as the state motto alongside the seal at statehood in 1912."
    - "The motto works on two levels. In its original context it describes natural acceleration. Applied to New Mexico, it points to the state's long journey from territory to statehood, a campaign that built momentum through decades of petitioning before Congress finally approved admission in 1912."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the New Mexico State Seal'
  paragraphs:
  - "Before 1912, New Mexico operated as a U.S. territory and used a territorial seal rather than a state seal. The current seal was adopted with statehood on January 6, 1912, and the dual-eagle design and motto Crescit Eundo have remained unchanged since."
  versions:
  - name: Early State Seal Rendering
    years: early 20th century
    image: /images/state-seals/new-mexico/versions/great-seal-of-the-state-of-new-mexico.png
    description: An early published rendering of the New Mexico state seal from the statehood era. It preserves the same dual-eagle composition and Crescit Eundo motto adopted in 1912, but with older print-era linework and coloring.
  - name: State Seal (1912-present)
    years: 1912–present
    image: /images/state-seals/new-mexico/versions/seal-of-new-mexico.svg
    description: Adopted at statehood on January 6, 1912. The dual-eagle design with the American eagle carrying the Mexican eagle, and the motto Crescit Eundo, have remained the official design since.

- id: facts
  icon: fa-solid fa-lightbulb
  title: New Mexico State Seal Facts
  facts:
  - 'Adopted: January 6, 1912, at statehood as the 47th state'
  - 'Central image: American bald eagle carrying a smaller Mexican eagle on its chest'
  - 'Mexican eagle holds a serpent in its beak and a cactus in its talons'
