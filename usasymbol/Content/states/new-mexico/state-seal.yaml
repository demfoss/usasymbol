hero_image_caption: The Great Seal of New Mexico, adopted at statehood on January 6, 1912. An American bald eagle spreads its wings over a smaller Mexican eagle holding a serpent and cactus, with the motto Crescit Eundo on a ribbon below.
intro_text: "New Mexico's state seal places a Mexican eagle, holding a serpent and cactus from the Mexican coat of arms, on the chest of a larger American bald eagle. The two eagles mark New Mexico's passage from Mexican territory to the 47th U.S. state, with the Latin motto Crescit Eundo below."
