timeline:
- year: '1821'
  description: Mexico gains independence from Spain. New Mexico, previously part of New Spain, becomes Mexican territory.
- year: '1848'
  description: The Treaty of Guadalupe Hidalgo ends the Mexican-American War. New Mexico passes from Mexican to U.S. control.
- year: '1850'
  description: Congress organizes the Territory of New Mexico. The territory will seek statehood for more than 60 years.
- year: '1912'
  description: President Taft signs the proclamation admitting New Mexico as the 47th state on January 6. The state seal with the dual-eagle design and motto Crescit Eundo is adopted at statehood.

faq:
- question: What does the New Mexico state seal show?
  answer: New Mexico's state seal shows a large American bald eagle with wings spread, carrying a smaller Mexican eagle on its chest. The Mexican eagle holds a serpent in its beak and a cactus in its talons. The American eagle holds a ribbon with the motto Crescit Eundo, and the outer ring reads "Great Seal of the State of New Mexico."
- question: Why is there a Mexican eagle on the New Mexico state seal?
  answer: The Mexican eagle on New Mexico's seal represents the state's history as Mexican territory before the Mexican-American War. New Mexico was part of Mexico until 1848, and the state's population in 1912 included large numbers of Hispanic New Mexicans with deep ties to Mexican culture and law predating U.S. sovereignty. Placing the Mexican eagle inside the American eagle acknowledged that heritage directly.
- question: What does Crescit Eundo mean on New Mexico's seal?
  answer: Crescit Eundo is Latin for "It grows as it goes." The phrase comes from De Rerum Natura by the Roman poet Lucretius, where it describes a thunderbolt gaining force as it travels. New Mexico adopted it as the state motto at statehood in 1912, pointing to the state's long campaign for admission that built momentum over decades.
- question: When was the New Mexico state seal adopted?
  answer: New Mexico's state seal was adopted on January 6, 1912, when President Taft signed the proclamation admitting New Mexico as the 47th state. The dual-eagle design and motto Crescit Eundo have remained unchanged since that date.
- question: What do the snake and cactus mean on the New Mexico seal?
  answer: The serpent and cactus held by the Mexican eagle come from the Mexican national coat of arms. They trace to the Aztec legend of Tenochtitlan, where priests were told to found their city at a spot where they saw an eagle on a cactus holding a snake. The same image appears on the Mexican flag.
- question: Why did New Mexico wait so long for statehood?
  answer: New Mexico was organized as a territory in 1850 but did not achieve statehood until 1912, a wait of 62 years. Congress repeatedly delayed admission, and New Mexico and Arizona were finally admitted together in early 1912 as the last contiguous states.

