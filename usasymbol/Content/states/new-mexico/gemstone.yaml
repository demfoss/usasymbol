sections:
  - id: overview
    icon: fa-solid fa-gem
    title: New Mexico State Gem
    paragraphs:
      - "Turquoise is New Mexico's official state gem, designated by the state legislature in 1967. Miners have worked deposits in the state since long before New Mexico was a territory, and Native artisans in the Southwest have shaped the stone into jewelry for well over a thousand years."
      - "Lawmakers chose turquoise not for its rarity but for how deeply it is tied to the state's identity, from ancient Pueblo trade routes to the silver-and-turquoise jewelry sold across the Southwest today."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Turquoise?"
    paragraphs:
      - "Turquoise is an opaque blue-to-green mineral formed when water carrying copper and aluminum seeps through rock and reacts with phosphorus, usually near the surface in arid climates. Its color ranges from a pale sky blue to a deeper blue-green, and most stones carry a web of dark matrix veining left behind by the host rock."
      - "As a phosphate mineral, turquoise differs from silicate gemstones like quartz or emerald, which makes it comparatively soft and porous. Jewelers often stabilize or treat the stone to protect its color and surface before setting it in silver."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New Mexico Chose Turquoise as Its State Gem"
    paragraphs:
      - "New Mexico's turquoise history runs deeper than almost any other state's. Ancestral Pueblo peoples mined the stone in the Cerrillos Hills starting around A.D. 700, trading it as far as central Mexico, and Spanish colonists later worked the same deposits."
      - "By the late 1800s, mines near Cerrillos were supplying turquoise to jewelers on the East Coast, including Tiffany & Co., whose gemologist George Kunz helped popularize the stone nationally. That long chain of mining, trade, and craftsmanship gave New Mexico a claim on turquoise that few other states could match."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Turquoise Became New Mexico's State Gem"
    paragraphs:
      - "The New Mexico Legislature designated turquoise the official state gem on March 23, 1967, formalizing a connection between the stone and the state that had already existed for centuries through Native and Hispanic craftsmanship."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Turquoise Is Found in New Mexico"
    paragraphs:
      - "The Cerrillos Hills, just south of Santa Fe, hold New Mexico's best-known turquoise deposits and were mined on and off for well over a thousand years. Commercial mines there, including the historic Tiffany mine on Turquoise Hill, operated into the 20th century before large-scale production wound down."
    sites:
      - name: Cerrillos Hills Turquoise Mining District
        city: Cerrillos
        lat: 35.4386
        lng: -106.1275
        note: "Historic turquoise mining district since A.D. 700"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Turquoise Facts"
    facts:
      - "Adopted as New Mexico's state gem in 1967."
      - "Ancestral Pueblo peoples mined turquoise in the Cerrillos Hills starting around A.D. 700."
      - "Turquoise from the Cerrillos area supplied Tiffany & Co. in the late 1800s and early 1900s."
      - "New Mexico was the largest U.S. producer of turquoise until the 1920s, when Arizona and Nevada mines overtook it."

