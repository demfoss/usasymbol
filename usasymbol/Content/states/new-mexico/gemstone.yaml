faq:
  - question: What is New Mexico's state gem?
    answer: "New Mexico's state gem is turquoise, an opaque blue-to-green mineral adopted by the state legislature in 1967."
  - question: When did New Mexico adopt turquoise as its state gem?
    answer: "The New Mexico Legislature designated turquoise the official state gem on March 23, 1967."
  - question: Why did New Mexico choose turquoise?
    answer: "Turquoise has been mined and worked into jewelry in New Mexico since ancestral Pueblo times, and the stone remains central to Native and Hispanic silverwork traditions in the state."
  - question: Where can you find turquoise in New Mexico?
    answer: "The Cerrillos Hills south of Santa Fe hold New Mexico's best-known deposits, mined on and off since around A.D. 700."

