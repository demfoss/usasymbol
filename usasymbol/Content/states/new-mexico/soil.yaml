faq:
- question: What is New Mexico's state soil?
  answer: "New Mexico's state soil is the Penistaja series, a reddish-brown, clay-rich soil found on the mesa tops and cuesta slopes of the Colorado Plateau in northwestern New Mexico. It was selected by the USDA Natural Resources Conservation Service as the soil that best represents the state's signature landscape."
- question: Why is it called Penistaja soil?
  answer: "The series is named after Penistaja Wash, a dry creek bed in San Juan County in northwestern New Mexico. The type location — the official reference site for the series — was established there when soil scientists first formally described and classified the soil."
- question: What color is Penistaja soil?
  answer: "The surface is pale reddish-brown, bleached by sun and wind. The argillic subsoil is the reddest layer — a warm reddish brown from iron oxides in the sandstone and shale parent material. The calcic layer below is pale tan, streaked with white calcium carbonate."
- question: Where is Penistaja soil found in New Mexico?
  answer: "Penistaja soil is found on the Colorado Plateau in northwestern New Mexico, mainly in San Juan and McKinley counties. It also occurs in Rio Arriba, Sandoval, and Cibola counties. It grows on mesa tops, cuesta slopes, and ridgelines at elevations between 5,500 and 7,500 feet."
- question: What grows in Penistaja soil?
  answer: "Penistaja soil supports piñon pine, one-seed juniper, blue grama grass, galleta grass, and big sagebrush in its natural state. With summer monsoon rains, dryland farmers grow winter wheat and pinto beans. At higher elevations, ponderosa pine grows in the cooler, wetter sites."
- question: Who chose Penistaja as New Mexico's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Penistaja series to represent New Mexico. It was chosen because it covers the most distinctive landforms in the state's northwest corner — the sandstone mesas and cuesta slopes of the Colorado Plateau."
- question: How deep is Penistaja soil?
  answer: "Penistaja soil is moderately deep — typically 20 to 40 inches from the surface to weathered sandstone or shale bedrock. That depth supports grasses, shrubs, and dryland crops, but is too shallow for large trees with deep taproots."

