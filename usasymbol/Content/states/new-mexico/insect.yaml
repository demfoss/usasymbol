sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of New Mexico?
  paragraphs:
  - "The tarantula hawk wasp, Pepsis formosa, is New Mexico's official state insect. State lawmakers designated it in 1989."
  - "New Mexico schoolchildren chose the tarantula hawk wasp in a statewide student vote, beating out the yucca moth."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Tarantula Hawk Wasp
  paragraphs:
  - "The tarantula hawk wasp has a metallic blue-black body and long legs tipped with hooked claws, with wings that are usually bright orange."
  - "It is one of the largest wasps in the world, with adults measuring about 1.5 to 2 inches long."
  - "Females hunt tarantulas, paralyzing them with a sting and dragging them into a burrow as a live food source for their larva. The sting is famous for being extremely painful, though the wasp is generally docile and stings only when handled or provoked."

- id: history
  icon: fa-solid fa-landmark
  title: How New Mexico Chose the Tarantula Hawk Wasp
  paragraphs:
  - "A sixth-grade class at Edgewood Elementary School, led by teacher Ruth Bradford, organized a statewide student ballot to pick a state insect. Fourth, fifth, and sixth graders across New Mexico voted, and the tarantula hawk wasp won."
  - "Governor Garrey Carruthers signed the bill making it New Mexico's official state insect in 1989."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Tarantula Hawk Wasp in New Mexico
  paragraphs:
  - "Tarantula hawk wasps live in New Mexico's desert and semi-arid regions, wherever tarantulas are common."
  - "They are most often seen in summer, feeding on flower nectar or searching the ground for tarantula burrows."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tarantula Hawk Wasp Facts
  facts:
  - "Adopted in 1989 by the New Mexico Legislature, chosen by a statewide vote of schoolchildren."
  - "Scientific name: Pepsis formosa."
  - "Body length of about 1.5 to 2 inches, among the largest wasps in the world."
  - "Metallic blue-black body with bright orange wings and long, hooked legs."
  - "Its sting is one of the most painful of any insect, though the wasp rarely stings unless handled."




