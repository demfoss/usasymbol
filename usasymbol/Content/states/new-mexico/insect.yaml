faq:
- question: What is New Mexico's state insect?
  answer: "New Mexico's state insect is the tarantula hawk wasp, adopted by the New Mexico Legislature in 1989."
- question: When did New Mexico adopt the tarantula hawk wasp?
  answer: "New Mexico adopted the tarantula hawk wasp as its official state insect in 1989."
- question: Why did New Mexico choose the tarantula hawk wasp?
  answer: "New Mexico schoolchildren voted for a state insect in a statewide ballot organized by a sixth-grade class, and the tarantula hawk wasp won over the yucca moth."
- question: What does the tarantula hawk wasp look like?
  answer: "It has a metallic blue-black body, long legs with hooked claws, and wings that are usually bright orange. Adults measure about 1.5 to 2 inches long."
- question: Where is the tarantula hawk wasp found in New Mexico?
  answer: "It lives in desert and semi-arid parts of New Mexico wherever tarantulas are common, and is most often seen during summer."
- question: Is the tarantula hawk wasp a butterfly, bee, beetle, or dragonfly?
  answer: "It is a wasp, one of the largest in the world, known for hunting tarantulas and for having an extremely painful sting."

