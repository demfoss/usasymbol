faq:
- question: What is New Mexico's state fossil?
  answer: "New Mexico's state fossil is Coelophysis bauri, a small early dinosaur from the Late Triassic period, about 210 million years old, designated in 1981."
- question: When did New Mexico adopt its state fossil?
  answer: "New Mexico designated Coelophysis bauri as its official state fossil in 1981."
- question: What did Coelophysis look like?
  answer: "Coelophysis was a slender, two-legged dinosaur up to 9 feet long and weighing about 40 to 50 pounds. It had a long neck, narrow toothed jaws, three-fingered clawed hands, and hollow bones that kept it lightweight."
- question: Where are Coelophysis fossils found in New Mexico?
  answer: "The main site is the Ghost Ranch quarry near Abiquiú, where hundreds of specimens were found in 1947. The Ruth Hall Museum of Paleontology at Ghost Ranch displays material from the quarry."
- question: When did Coelophysis live?
  answer: "Coelophysis bauri lived during the Late Triassic period, about 215 to 205 million years ago, and went extinct about 200 million years ago at the end of the Triassic."
- question: Who discovered Coelophysis in New Mexico?
  answer: "Edwin Colbert of the American Museum of Natural History led the 1947 excavation at Ghost Ranch that uncovered hundreds of Coelophysis skeletons. Edward Drinker Cope had first named the species in 1887 from earlier fragmentary finds."

