- id: facts
  icon: fa-solid fa-lightbulb
  title: Coelophysis Facts
  facts:
  - "New Mexico designated Coelophysis bauri as its state fossil in 1981."
  - "The 1947 Ghost Ranch quarry yielded hundreds of Coelophysis skeletons in a single bone bed — one of the largest concentrations of dinosaur fossils ever found."
  - "Despite being up to 9 feet long, Coelophysis weighed only about 40 to 50 pounds thanks to its hollow bones."
  - "In 1998, a Coelophysis skull was carried aboard the Space Shuttle Endeavour to the Mir space station, making it the first dinosaur fossil in space."
  - "Coelophysis bauri was first described by paleontologist Edward Drinker Cope in 1887 from specimens found in northern New Mexico."

