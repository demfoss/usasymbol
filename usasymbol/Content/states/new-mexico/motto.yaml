faq:
  - question: "What is New Mexico's state motto?"
    answer: "New Mexico's state motto is \"Crescit Eundo,\" a Latin phrase meaning \"It Grows as It Goes.\" It was officially adopted in 1913 and has appeared on the state seal since 1887."

  - question: "What does \"Crescit Eundo\" mean in English?"
    answer: "\"Crescit Eundo\" translates from Latin as \"It Grows as It Goes\" or \"It Increases as It Goes.\" Crescit means it grows, and eundo means as it goes or by going."

  - question: "Where does \"Crescit Eundo\" come from?"
    answer: "The phrase comes from Book VI of De Rerum Natura, a scientific poem written by the Roman poet Lucretius around 50 BCE. In the poem, the phrase describes a thunderbolt that grows stronger as it travels across the sky."

  - question: "When did New Mexico adopt its state motto?"
    answer: "The New Mexico Legislature officially adopted \"Crescit Eundo\" as the state motto in 1913, the year after statehood. The phrase had already been on the territorial seal since 1887."

