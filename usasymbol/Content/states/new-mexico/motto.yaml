seo_title: "New Mexico State Motto | Crescit Eundo"
seo_description: "New Mexico's state motto is \"Crescit Eundo,\" Latin for \"It Grows as It Goes.\" The phrase comes from Lucretius and has been on the state seal since 1887."

intro_text: "New Mexico's state motto is <strong>Crescit Eundo</strong>, a Latin phrase meaning <em>It Grows as It Goes</em>. The phrase comes from Lucretius' poem <em>De Rerum Natura</em>, written around 50 BCE, where it describes a thunderbolt gaining strength as it moves across the sky."

