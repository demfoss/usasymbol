sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "New Mexico State Motto"
    paragraphs:
      - "New Mexico's state motto is <strong>Crescit Eundo</strong>, Latin for <em>It Grows as It Goes</em>. The New Mexico Legislature officially adopted it in 1913 as part of the state seal description. The phrase had already appeared on the territorial seal since 1887."
      - "The motto comes from a Roman poem written over 2,000 years ago. Lucretius used the phrase to describe a thunderbolt in his scientific epic <em>De Rerum Natura</em>. New Mexico is one of the few states whose motto can be traced to a specific line in a classical Latin text."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Crescit Eundo\""
    paragraphs:
      - "The Latin verb <em>crescit</em> comes from <em>crescere</em>, meaning to grow or increase. <em>Eundo</em> is formed from the verb <em>ire</em>, meaning to go, and translates roughly as <em>by going</em> or <em>as it goes</em>. Together the phrase means: <em>it grows as it goes</em>, or <em>it increases by going</em>."
      - "The idea is motion as the engine of growth. Something does not simply grow by standing still — it grows through movement and action. Applied to a new state, the phrase reads as a statement about building through forward progress."

  - id: meaning
    icon: "fa-solid fa-star"
    title: "New Mexico State Motto Meaning"
    paragraphs:
      - "In Lucretius' poem, the phrase describes a thunderbolt that gathers force as it travels across the sky. The original image is physical: momentum building through movement."
      - "For New Mexico, adopted as a state in 1912, the motto pointed forward. The territory had been part of the United States since 1848, had used this Latin phrase on its official seal since 1887, and carried the phrase into statehood as a statement of continuing growth and development."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of New Mexico's State Motto"
    paragraphs:
      - "The phrase entered New Mexico's official life in 1882, when William G. Ritch, acting Territorial Secretary, added <em>Crescit Eundo</em> to an older version of the territorial seal that dated from the early 1860s. Ritch chose the phrase from Lucretius — no legislative vote was required at that stage."
      - "In 1887, the New Mexico territorial legislature formally adopted Ritch's version of the seal, including the words <em>Crescit Eundo</em>, as the official territorial seal and coat of arms."
      - "New Mexico became the 47th state on January 6, 1912. The following year, in 1913, the legislature adopted the state seal — continuing the design of the territorial seal — and with it officially designated <em>Crescit Eundo</em> as the state motto. The motto appears on the seal on a scroll beneath two eagles."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Crescit Eundo\" on the New Mexico State Seal"
    paragraphs:
      - "<em>Crescit Eundo</em> appears on a scroll at the base of the New Mexico state seal. Above the scroll, a large American bald eagle spreads its wings over a smaller Mexican eagle, which holds a serpent in its beak and a cactus in its talons. The year 1912 — New Mexico's year of statehood — appears between the two eagles."
      - "The design connects the two nations whose history shaped the state: the Mexican eagle is the same symbol that appears on the flag of Mexico, representing the founding legend of Tenochtitlan. The American eagle above it reflects federal sovereignty. The seal appears on official state documents, government buildings, and the state flag."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Mexico State Motto Facts"
    style: "gradient"
    facts:
      - "\"Crescit Eundo\" is Latin for \"It Grows as It Goes\" — the idea of gaining strength through forward movement."
      - "The phrase comes from Book VI, line 341 of Lucretius' poem De Rerum Natura, written around 50 BCE, where it describes a thunderbolt."
      - "Acting Territorial Secretary William G. Ritch first added the phrase to New Mexico's territorial seal in 1882."
      - "The territorial legislature adopted it as part of the official seal in 1887 — 26 years before statehood."
      - "New Mexico became the 47th state on January 6, 1912. The motto was officially adopted with the state seal in 1913."
      - "The state seal shows an American eagle protecting a Mexican eagle — representing the two national histories behind New Mexico."

