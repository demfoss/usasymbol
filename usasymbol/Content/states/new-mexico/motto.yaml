title: "Crescit Eundo"
language: "Latin"
english_translation: "It grows as it goes"
adopted_year: 1913

author: "USA Symbol Team"
date_published: "2025-12-03"
date_modified: "2026-03-27"
seo_title: "New Mexico State Motto | Crescit Eundo! It grows as it goes!"
seo_description: "New Mexico's motto 'Crescit Eundo' describes a thunderbolt — the phrase comes from Lucretius's De Rerum Natura (50 BCE), where it describes lightning gaining power as it moves across the sky. New Mexico waited 62 years for statehood. The motto appears on the seal but NOT on the state flag, which dropped the seal in 1925 for the Zia sun symbol."

intro_text: "New Mexico's state motto is <strong>Crescit Eundo</strong> — Latin for <em>It grows as it goes</em>. The phrase comes from Lucretius's scientific poem <em>De Rerum Natura</em> (On the Nature of Things), written around 50 BCE, where it describes a thunderbolt gaining power as it moves across the sky. William G. Ritch, acting territorial secretary, added the motto to the territorial seal in 1882 without documented explanation. The territorial legislature officially adopted it in 1887. When New Mexico achieved statehood in 1912 after waiting 62 years as a territory, the state seal commission kept the motto unchanged in 1913. The motto appears on the state seal but not on the state flag — the 1915 flag originally included the seal but replaced it with the Zia sun symbol in 1925."

sections:
  - id: "thunderbolt-from-lucretius"
    icon: "fa-solid fa-bolt"
    title: "The Phrase Originally Described a Thunderbolt"
    paragraphs:
      - "Lucretius wrote <em>De Rerum Natura</em> (On the Nature of Things) around 50 BCE as a six-book poem explaining the natural world through atomic theory. In Book VI, lines 340-344, he describes how a thunderbolt gains momentum as it travels through the sky: 'Denique quod longo venit impete, sumere debet mobilitatem etiam atque etiam, quae crescit eundo' — 'What comes with a long rush must acquire more and more mobility, which grows by going.'"
      - "The phrase 'crescit eundo' — 'it grows by going' — describes the physics of a lightning bolt accelerating through the atmosphere. Lucretius was a materialist philosopher who believed everything in the universe followed natural laws. His poem was lost for over a thousand years before being rediscovered in 1417. It influenced Renaissance thought and eventually became part of classical education."
      - "William G. Ritch extracted the two-word phrase from this scientific passage and applied it to New Mexico Territory's potential for growth. He provided no written explanation for his choice in 1882. The phrase fit a territory arguing it deserved statehood: a region that grows as it goes, gaining strength through forward motion."

  - id: "62-years-to-statehood"
    icon: "fa-solid fa-clock"
    title: "62 Years as a Territory Before Statehood"
    paragraphs:
      - "The Treaty of Guadalupe Hidalgo ended the Mexican-American War in 1848, and the Compromise of 1850 established New Mexico Territory on September 9, 1850. For the next 62 years, New Mexico remained a territory — one of the longest territorial periods of any contiguous state. Congress delayed admission repeatedly, partly due to the territory's Hispanic majority, concerns about population diversity, and debates over whether the population was sufficiently 'American' for statehood."
      - "The motto's meaning — growth through forward motion — described New Mexico's actual experience. The territory expanded economically as the Santa Fe Railway arrived in 1879, mining developed, ranching grew, and population increased. New Mexico kept arguing for statehood while demonstrating the development that should qualify it. President William Howard Taft finally signed the statehood proclamation on January 6, 1912, making New Mexico the 47th state."
      - "A state seal commission consisting of Governor William C. McDonald, Attorney General Frank W. Clancy, Chief Justice Clarence J. Roberts, and Secretary of State Antonio Lucero filed their 1913 report recommending they keep the territorial seal almost unchanged — updating only the date from MDCCCL (1850) to 1912. The motto 'Crescit Eundo' continued without modification."

  - id: "three-adoption-dates"
    icon: "fa-solid fa-calendar-check"
    title: "Three Different Adoption Dates — One Motto"
    paragraphs:
      - "New Mexico's motto has a layered adoption history. William G. Ritch first added 'Crescit Eundo' to the territorial seal design in 1882, when he created a version for the first New Mexico Blue Book. The territorial legislature formally adopted a territorial coat of arms in 1887, including the motto. The state seal commission officially adopted the state seal design in June 1913, carrying the motto forward unchanged."
      - "The motto therefore has three dates associated with it: 1882 (first use), 1887 (territorial adoption), and 1913 (state adoption). The official adopted_year for state purposes is 1913, but the phrase had been on territorial documents for 31 years before statehood."
      - "New Mexico's 1915 state flag initially featured the state seal including the motto. In 1925, the legislature replaced the seal-based flag with a new design featuring the Zia sun symbol on a yellow field — the current flag. The motto still appears on the state seal but no longer on the flag."

  - id: "binational-seal-design"
    icon: "fa-solid fa-shield-halved"
    title: "What Surrounds the Motto on the Seal"
    paragraphs:
      - "The motto 'Crescit Eundo' appears on a scroll below two eagles that together represent New Mexico's history of sovereignty transfer. An American bald eagle with outstretched wings spreads above a smaller Mexican harpy eagle that holds a snake in its beak and cactus in its talons. The design shows the change of sovereignty from Mexico to the United States in 1846 — the only state seal in the country to explicitly depict the transition between two national symbols."
      - "The date '1912' appears between the eagles, marking New Mexico's statehood year. The overall circular seal is surrounded by the words 'Great Seal of the State of New Mexico.' This design has remained essentially unchanged since the territorial seal of the 1860s, making it one of the most historically continuous state seals in the country."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "New Mexico State Motto Facts"
    style: "gradient"
    facts:
      - "The phrase 'crescit eundo' comes from Lucretius's De Rerum Natura (50 BCE), where it describes a thunderbolt gaining power as it moves."
      - "William G. Ritch added the motto to the territorial seal in 1882 without a documented explanation of his reasoning."
      - "New Mexico waited 62 years for statehood, from 1850 to 1912 — one of the longest territorial periods of any contiguous state."
      - "The motto has three associated adoption dates: 1882 (Ritch's use), 1887 (territorial legislature), and 1913 (state seal commission)."
      - "New Mexico's seal depicts two eagles representing the transfer of sovereignty from Mexico to the United States — the only state seal that explicitly shows this."
      - "The 1915 state flag featured the seal, but the Zia sun symbol replaced it in 1925. The motto does not appear on the current state flag."

faq:
  - question: "What is New Mexico's state motto?"
    answer: "New Mexico's state motto is 'Crescit Eundo,' a Latin phrase meaning 'It grows as it goes.' It appears on the state seal and was formally adopted in 1913, though it has been on territorial documents since 1882."

  - question: "Where did 'Crescit Eundo' come from?"
    answer: "From Lucretius's De Rerum Natura (On the Nature of Things), Book VI, written around 50 BCE. The phrase describes a thunderbolt gaining momentum as it moves across the sky: 'what comes with a long rush must acquire more and more mobility, which grows by going.' William G. Ritch extracted the two-word phrase from this scientific passage and applied it to the territorial seal in 1882."

  - question: "What language is New Mexico's motto written in?"
    answer: "Latin. 'Crescit eundo' is classical Latin from a first-century BCE poem. 'Crescit' means 'it grows' and 'eundo' is the ablative gerund of 'ire' (to go), meaning 'by going' or 'as it goes.'"

  - question: "When did New Mexico officially adopt its motto?"
    answer: "The state seal commission formally adopted the state seal — including the motto — in June 1913, a year after New Mexico became the 47th state on January 6, 1912. The motto had been on territorial documents since 1882 and was officially adopted by the territorial legislature in 1887."

  - question: "Does New Mexico's motto appear on the state flag?"
    answer: "No. The 1915 state flag initially included the state seal with the motto. In 1925, the legislature replaced it with the current flag design — a yellow field with the Zia sun symbol in red. The motto now appears only on the state seal, not the flag."

  - question: "Why did New Mexico wait 62 years for statehood?"
    answer: "Congress delayed New Mexico's admission repeatedly from 1850 to 1912. Concerns included the territory's Hispanic majority, questions about whether the population was sufficiently 'American' for self-governance, and debates over population size. The motto 'It grows as it goes' described New Mexico's actual experience of building toward statehood while being denied it."

