intro_text: New Mexico's state fish is the Rio Grande cutthroat trout, a colorful native trout of cold mountain streams, adopted in 1955. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of New Mexico?
  paragraphs:
  - The Rio Grande cutthroat trout has been New Mexico's official state fish since 1955. State law calls it the native New Mexico cutthroat trout.
  - Its scientific name is Oncorhynchus clarkii virginalis. It is the southernmost type of cutthroat trout in North America.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Rio Grande Cutthroat Trout
  paragraphs:
  - The Rio Grande cutthroat trout has brass-colored sides that fade into a green and bronze back.
  - Many of these trout also show bright red color along their lower sides.
  - Every one has a red-orange slash along the jawline. This mark gives cutthroat trout their name.
  - Its dark, uneven spots are thickest near the tail, behind the big fin on its back.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The New Mexico Legislature made the native cutthroat trout the official state fish in 1955. The law does not name a subspecies, but the Rio Grande cutthroat trout is widely accepted as the fish lawmakers meant.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New Mexico Chose the Rio Grande Cutthroat Trout
  paragraphs:
  - Official sources name the fish without giving a detailed reason. The law does say the state fish is a native trout, and this trout is native only to northern New Mexico and southern Colorado.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Rio Grande Cutthroat Trout
  paragraphs:
  - This trout lives mostly in remote mountain streams in northern New Mexico. It needs clear, cold water with lots of oxygen and gravel bottoms.
  - It is native to the Rio Grande and Pecos River basins, and it may also be native to the Canadian River basin. Today it lives in about 450 miles of stream in New Mexico.
  - In the Rio Costilla watershed of northern New Mexico, biologists have brought the trout back to many miles of stream and to several lakes. This is one of the largest native fish restoration projects in U.S. history.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Rio Grande Cutthroat Trout Facts
  facts:
  - Adopted in 1955 by the New Mexico Legislature.
  - Its scientific name is Oncorhynchus clarkii virginalis.
  - It is the southernmost type of cutthroat trout in North America.
  - It has a red-orange slash along its jawline.
  - It is native only to northern New Mexico and southern Colorado.
faq:
- question: What is New Mexico's state fish?
  answer: New Mexico's state fish is the Rio Grande cutthroat trout, a native trout of cold mountain streams.
- question: When did New Mexico adopt the Rio Grande cutthroat trout?
  answer: The New Mexico Legislature adopted the native cutthroat trout as the state fish in 1955.
- question: Why did New Mexico choose the Rio Grande cutthroat trout?
  answer: Official sources do not give a detailed reason. The law names a native trout, and this fish lives naturally only in northern New Mexico and southern Colorado.
- question: Why is it called a cutthroat trout?
  answer: It has a red-orange slash under its lower jaw. From the side, the mark looks like a cut on its throat.
- question: Is the Rio Grande cutthroat trout endangered?
  answer: No. In 2024, federal wildlife officials decided it did not need to be listed as threatened or endangered. The biggest danger to it is nonnative trout like rainbow, brook, and brown trout.
