# verification: The starting record gave 2005 as the adoption year. The U.S. Fish and Wildlife Service says this trout has been New Mexico's state fish since 1955, and two reference sites list the same year, so 1955 is used. State law names the "native New Mexico cutthroat trout" and gives no scientific name. The state wildlife agency calls the state fish the Rio Grande cutthroat trout, Oncorhynchus clarkii virginalis. The species, scientific name and title are confirmed. The code section number was not checked against an official source, so legislation uses a general phrase. No map sites are included because no specific waters could be confirmed well enough.
