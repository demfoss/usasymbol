sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "New Mexico officially codified its state colors as 'the red and yellow of old Spain' under New Mexico Statutes Annotated Section 12-3-14 in 1999, giving statutory standing to a color tradition that had been embedded in the state's flag since its adoption in 1925. The legislation deliberately preserves the historical framing of the colors as those of Spain, rather than specifying technical color values, reflecting the enduring importance of Spanish colonial heritage to New Mexico's official identity. New Mexico is one of only two states in the Union whose flag does not include the color blue, and the only state whose flag contains neither blue nor white."
      - "The state's color tradition is inseparable from the history of its flag, which was officially adopted on March 19, 1925 following a design contest organized by the Daughters of the American Revolution chapter in New Mexico. The winning design was submitted by Dr. Harry Mera, a Santa Fe archaeologist, who combined the sacred Zia sun symbol of the indigenous Zia Pueblo people with the Spanish colonial colors of red and yellow. The result produced what the North American Vexillological Association ranked as the single best-designed flag in the United States and Canada in its 2001 survey of 72 flags."
    subsections:
      - subtitle: "New Mexico Statutes Annotated Section 12-3-14"
        text: "NMSA Section 12-3-14 designates red and yellow as the official state colors by describing them as 'the red and yellow of old Spain,' the same language used in the original 1925 flag statute. The legislation does not specify Pantone, HEX, or CMYK values, leaving precise color reproduction to institutional standards. The widely accepted standard approximations for official use are PMS 200 C for New Mexico Red and PMS 7405 C for New Mexico Yellow, consistent with the values recognized by the New Mexico Secretary of State's office and used in state government applications."
      - subtitle: "The 1925 Flag and the Design Contest"
        text: "The New Mexico state flag adopted in 1925 replaced an earlier 1915 design known as the 'Twitchell Flag,' which featured a field of blue with the U.S. flag in the canton and 'New Mexico' inscribed diagonally in silver — a design widely criticized as neither distinctive nor representative of the state's cultural heritage. The Daughters of the American Revolution organized a contest to produce a new design that would reflect New Mexico's unique history. Dr. Harry Mera's submission, pairing the Zia sun symbol with the red and yellow of Old Spain, was selected and codified into state law, establishing the color combination that would eventually be designated the official state colors in 1999."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "The red and yellow of New Mexico carry two distinct layers of meaning simultaneously: the Spanish imperial heritage of over 250 years of colonial rule, and the indigenous Puebloan traditions of the Zia people whose sacred sun symbol gives the flag its enduring power. Red is the color of the Zia sun symbol itself, a motif of major spiritual significance to the Zia Pueblo community. Yellow is the golden field upon which the sun rises — both a reference to the Spanish royal standard and a reflection of New Mexico's high desert landscape bathed in southwestern sunlight."
    subsections:
      - subtitle: "Red: The Zia Sun and Spanish Heritage"
        text: "The red of the Zia sun symbol represents one of the most recognizable indigenous iconographic elements on any U.S. state flag. The Zia are a Puebloan people who have inhabited the Zia Pueblo on the Jemez River in New Mexico for centuries. Their sun symbol — four groups of four rays radiating from a central circle — represents the sacred number four: the four cardinal directions, the four seasons, the four stages of life (childhood, youth, middle years, and old age), and the four times of day (morning, noon, evening, and night). The circle at the center binds these four sets of four together in the Circle of Life. Red also connects to the flags of Spain, whose Crown had governed the territory of Nuevo Mexico from the first Spanish settlements in 1598 under Juan de Oñate until Mexican independence in 1821."
      - subtitle: "Yellow: Old Spain and the Land of Enchantment"
        text: "The yellow field of the New Mexico flag references the colors of the Spanish royal standard, traditionally attributed to the colors of Queen Isabella I of Castile, whose sponsorship of Christopher Columbus's 1492 voyage opened the pathway to Spanish colonization of the Americas. Spain governed the territory of Nuevo Mexico for more than 250 years, longer than the United States has existed as a nation. Yellow also speaks to the physical landscape of New Mexico — the golden high desert terrain, the warm tones of adobe architecture, and the sunlit mesas and canyon walls that characterize the 'Land of Enchantment,' the state's official nickname."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Red and yellow define the New Mexico state flag in its entirety, with no other colors present. The flag consists solely of the red Zia sun symbol centered on a golden-yellow field, making New Mexico one of the most visually distinctive and minimalist state flags in the nation. The New Mexico state seal, while incorporating a wider range of colors, features the American bald eagle overlaying the Mexican brown eagle — a visual representation of the transition from Mexican to American sovereignty — and uses gold extensively in its detailing. Red and yellow appear consistently across New Mexico state government communications, tourism branding under the 'Land of Enchantment' identity, and the state's license plate designs, which have historically incorporated the Zia symbol and the state's Spanish-heritage color palette."

