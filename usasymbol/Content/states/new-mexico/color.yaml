seo_title: "New Mexico State Colors | Red Yellow"
seo_description: "New Mexico state colors are Red and Yellow, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of New Mexico are **Red** and **Yellow**, formally described in state law as 'the red and yellow of old Spain,' codified under New Mexico Statutes Annotated § 12-3-14 in 1999. These colors appear on [the New Mexico state flag](/states/new-mexico/flag/new-mexico-state-flag) adopted in 1925, which features the sacred Zia sun symbol in red on a yellow field honoring over 250 years of Spanish colonial heritage. The specifications below list HEX, RGB, CMYK, and Pantone values for New Mexico color matching."

official_colors: "Red and Yellow"
official_since: "1999 (New Mexico Statutes Annotated § 12-3-14)"
primary_use: "State flag, state government branding, official state agency insignia, ceremonial contexts"
known_for: "The red and yellow of Old Spain, honoring over 250 years of Spanish colonial heritage; red represents the sacred Zia sun symbol on the state flag; yellow represents the golden field of the flag and the historic Spanish royal standard"

