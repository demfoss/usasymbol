faq:
  - question: "What are the official colors of New Mexico?"
    answer: "The official state colors of New Mexico are Red and Yellow, formally described in law as 'the red and yellow of old Spain,' codified under New Mexico Statutes Annotated Section 12-3-14 in 1999. These colors appear on the state flag, which features the sacred Zia sun symbol in red on a yellow field."
  - question: "What is the HEX code for New Mexico Red?"
    answer: "The standard HEX code for New Mexico Red is #BF0A30, corresponding to Pantone PMS 200 C. Note that New Mexico statute does not specify official Pantone or HEX values; this is the widely accepted standard approximation used for official and institutional applications."
  - question: "What is the HEX code for New Mexico Yellow?"
    answer: "The standard HEX code for New Mexico Yellow is #FFD700, corresponding to Pantone PMS 7405 C. As with the red, New Mexico statute defines the color by historical reference ('the yellow of old Spain') rather than technical specification; this value represents the accepted standard approximation."
  - question: "When were New Mexico's state colors officially adopted?"
    answer: "New Mexico's state colors were formally codified in 1999 under NMSA Section 12-3-14, though the same red and yellow have appeared on the state flag since its official adoption on March 19, 1925."
  - question: "Why does New Mexico use red and yellow?"
    answer: "Red and yellow are the historic colors of the Spanish Crown, referencing over 250 years of Spanish colonial rule over the territory of Nuevo Mexico from 1598 to 1821. Red also represents the sacred Zia sun symbol of the indigenous Zia Pueblo people, while yellow evokes the golden high desert landscape of the Land of Enchantment."
  - question: "What does the Zia symbol on the New Mexico flag represent?"
    answer: "The Zia sun symbol is a sacred emblem of the Zia Pueblo people. Its four groups of four rays represent the four cardinal directions, four seasons, four stages of life, and four times of day — all bound together in the Circle of Life by the central circle. The symbol was incorporated into the state flag in 1925 as a tribute to New Mexico's indigenous Puebloan heritage."
  - question: "Does New Mexico's state flag have any blue in it?"
    answer: "No. New Mexico is one of only four U.S. state flags that does not include the color blue, along with Alabama, California, and Maryland. It is the only state flag among those four that also contains no white, making the New Mexico flag unique in using only two colors — red and yellow."

