seo:
  title: "Most Common Last Names in New Mexico"
  description: "The most common last names in New Mexico are Martinez, Garcia, and Chavez. Explore the top 20 with meanings, counts, and the colonial history behind the state's surname map."

page:
  h1: "Most Common Last Names in New Mexico"
  intro: "Martinez is the most common last name in New Mexico, followed by Garcia and Chavez, a top three shaped by Spanish settlement after 1598. Santa Fe's founding in 1610, the return of colonial families after the Pueblo Revolt, and later American migration all still show up in the state's surname rankings, but the strongest layer remains Hispano."
  heritage_title: "El Camino Real and the Return After 1692"
  heritage_body: "Spanish colonists moved into New Mexico along El Camino Real after 1598, and Santa Fe was established in 1610 as the colonial capital. The Pueblo Revolt of 1680 broke that first regime, but the return waves of 1693 to 1695 re-planted surnames such as Baca, Montoya, Trujillo, Vigil, and Lucero in Rio Grande settlements. After the railroad and American territorial era, Smith, Johnson, Brown, and Williams rose into the top 20 without displacing the older Hispano core."
  fun_fact: "Baca ranks 13th in New Mexico but only 1,502nd nationally in Forebears' U.S. table, and 30.27 percent of all U.S. Bacas live in New Mexico."

surnames:
  - rank: 1
    name: Martinez
    count: 28106
    ratio: 77
    origin: spanish
    type: Patronymic
    meaning: "Son of Martin, from the Latin Martinus. Martinez is New Mexico's leading surname because colonial settlement along the Rio Grande planted the name early and kept it dense in long-settled Hispano communities."

  - rank: 2
    name: Garcia
    count: 24611
    ratio: 88
    origin: spanish
    type: Patronymic
    meaning: "A Spanish surname of Basque origin, often treated as a patronymic from an old personal name. Garcia runs through New Mexico from early colonial records to modern Albuquerque and Las Cruces, which is why it sits near the top statewide."

  - rank: 3
    name: Chavez
    count: 18623
    ratio: 116
    origin: spanish
    type: Habitational
    meaning: "A place-name surname linked to Chaves in Portugal. In New Mexico it is one of the signature Hispano surnames, preserved across centuries of settlement from the upper Rio Grande to the southern borderlands."

  - rank: 4
    name: Sanchez
    count: 15156
    ratio: 143
    origin: spanish
    type: Patronymic
    meaning: "Son of Sancho, from a medieval Iberian given name. Sanchez appears in the earliest colonial layers of New Mexico and remains common in both old village networks and newer urban populations."

  - rank: 5
    name: Gonzales
    count: 14580
    ratio: 149
    origin: spanish
    type: Patronymic
    meaning: "Son of Gonzalo, from the Visigothic Gundisalvus. The Gonzales spelling outranks Gonzalez in New Mexico, a pattern often seen in older Hispano records across the Southwest."

  - rank: 6
    name: Smith
    count: 14551
    ratio: 149
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith rose with American rule after 1848, then spread further through railroad towns, military posts, and Albuquerque's twentieth-century growth."

  - rank: 7
    name: Romero
    count: 14273
    ratio: 152
    origin: spanish
    type: Occupational
    meaning: "Originally a pilgrim to Rome, from Spanish 'romero.' Romero is one of New Mexico's old Catholic surnames, visible in colonial church and land records before the American period."

  - rank: 8
    name: Lopez
    count: 12465
    ratio: 174
    origin: spanish
    type: Patronymic
    meaning: "Son of Lope, from the Latin Lupus, wolf. Lopez remained strong in New Mexico because it belongs to both the early colonial population and later Mexican American migration streams."

  - rank: 9
    name: Montoya
    count: 12327
    ratio: 176
    origin: basque
    type: Habitational
    meaning: "A Basque place-name surname. Bartolomé de Montoya appears in the 1600 settlement wave into New Mexico, which helps explain why the name is far more concentrated here than in most states."

  - rank: 10
    name: Trujillo
    count: 11228
    ratio: 193
    origin: spanish
    type: Habitational
    meaning: "A place-name surname from Trujillo in Extremadura. New Mexico records place Trujillo in the colony by 1632, and the name stayed rooted through the resettlement waves of the 1690s."

  - rank: 11
    name: Lucero
    count: 10061
    ratio: 215
    origin: spanish
    type: Descriptive
    meaning: "Spanish for a bright star or morning star. Lucero de Godoy is recorded in New Mexico by 1616, and the name still marks the landscape at Los Luceros on the Rio Grande."

  - rank: 12
    name: Johnson
    count: 9321
    ratio: 232
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', God is gracious. Johnson reflects the later American layer of New Mexico history, especially after territorial administration and modern urban growth."

  - rank: 13
    name: Baca
    count: 9043
    ratio: 239
    origin: spanish
    type: Patronymic
    meaning: "A Spanish surname of uncertain origin in Iberian records. In New Mexico it is one of the oldest documented colonial family names, carried north by Captain Cristóbal Baca in 1600."

  - rank: 14
    name: Gallegos
    count: 8736
    ratio: 248
    origin: spanish
    type: Ethnic
    meaning: "A surname meaning a person from Galicia. Gallegos was present in colonial New Mexico by 1677, and surviving genealogical records show it marrying into the Baca family before the end of the Spanish period."

  - rank: 15
    name: Rodriguez
    count: 8515
    ratio: 254
    origin: spanish
    type: Patronymic
    meaning: "Son of Rodrigo, from the Germanic Roderick. Rodriguez is common across the Spanish-speaking world, and in New Mexico it reflects both older Hispano settlement and later cross-border migration."

  - rank: 16
    name: Vigil
    count: 8248
    ratio: 263
    origin: spanish
    type: Occupational
    meaning: "From Latin 'vigil', watchful or watchman. Vigil appears directly in the 1695 resettlement wave into New Mexico and remains one of the state's most distinctively northern Rio Grande surnames."

  - rank: 17
    name: Brown
    count: 8147
    ratio: 266
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', referring to brown hair, clothing, or complexion. Brown climbed in New Mexico through the same American-era migration that lifted Smith and Johnson."

  - rank: 18
    name: Hernandez
    count: 7644
    ratio: 283
    origin: spanish
    type: Patronymic
    meaning: "Son of Hernando or Fernando, from a Germanic personal name. Hernandez is widespread in the Southwest, but New Mexico keeps it especially visible because both colonial and modern Hispanic populations reinforce it."

  - rank: 19
    name: Padilla
    count: 7604
    ratio: 285
    origin: spanish
    type: Habitational
    meaning: "A Castilian place-name surname. Padilla Villaseñor appears in New Mexico records by 1688, placing the name in the colony before the reconquest was fully stabilized."

  - rank: 20
    name: Williams
    count: 7170
    ratio: 302
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic Willahelm. Williams reflects the English-speaking migration that expanded under U.S. territorial rule and remained strong in modern Albuquerque and southeastern New Mexico."

unique_surnames:
  - name: Baca
    state_rank: 13
    national_rank: 1502
    origin: spanish
    why: "Baca is one of New Mexico's defining colonial surnames. Captain Cristóbal Baca arrived in the 1600 settlement wave, and Forebears shows that 30.27 percent of all U.S. Bacas still live in New Mexico."

  - name: Lucero
    state_rank: 11
    national_rank: 1048
    origin: spanish
    why: "Lucero is deeply tied to northern New Mexico family history. The surname appears in the colony by 1616, and Los Luceros Historic Site preserves the name in one of the state's best-known Rio Grande properties."

  - name: Vigil
    state_rank: 16
    national_rank: 1329
    origin: spanish
    why: "Vigil entered New Mexico in the 1695 resettlement wave after the Pueblo Revolt. Its statewide rank remains strikingly high because the name stayed concentrated in long-settled Hispano communities instead of dispersing evenly across the country."

  - name: Montoya
    state_rank: 9
    national_rank: 585
    origin: basque
    why: "Montoya is unusually New Mexican because it reaches back to Bartolomé de Montoya in the 1600 wave of settlers. Forebears shows 17.51 percent of all U.S. Montoyas live in New Mexico, far above what the state's population alone would predict."

  - name: Archuleta
    state_rank: 39
    national_rank: 2783
    origin: basque
    why: "Archuleta traces to the 1598 Oñate expedition, where the surname appears among the first colonizing families. That early foothold helped keep Archuleta far more visible in New Mexico than in most of the United States."

etymology_groups:
  - type: Spanish Patronymics
    icon: fa-solid fa-sun
    description: "Spanish patronymics dominate New Mexico's upper ranks. Martinez, Sanchez, Gonzales, Lopez, Rodriguez, and Hernandez all derive from fathers' given names, and their strength reflects how deeply Spanish colonial and later Mexican naming patterns shaped the state."
    examples:
      - Martinez (son of Martin)
      - Sanchez (son of Sancho)
      - Lopez (son of Lope)
      - Rodriguez (son of Rodrigo)

  - type: Colonial Family Names
    icon: fa-solid fa-landmark
    description: "New Mexico has an unusually strong layer of surnames tied to specific colonial settlement waves. Baca, Montoya, Trujillo, Vigil, and Archuleta appear in early migration records tied to 1598, 1600, or the 1693 to 1695 return after the Pueblo Revolt."
    examples:
      - Baca (colonial family name)
      - Montoya (Basque place-name surname)
      - Trujillo (from Trujillo)
      - Vigil (watchman)

  - type: Later Anglo Names
    icon: fa-solid fa-hammer
    description: "Smith, Johnson, Brown, and Williams represent the later American layer that arrived after 1848 and grew with railroads, military posts, mining, and Albuquerque's expansion. They are common, but they do not erase the older Hispano signature that defines New Mexico's list."
    examples:
      - Smith (metalworker)
      - Johnson (son of John)
      - Brown (brown-haired or brown-clad)
      - Williams (son of William)

faq:
  - question: "Why are Spanish last names so common in New Mexico?"
    answer: "Spanish last names are so common in New Mexico because Spanish colonists established permanent settlements after 1598, Santa Fe became the colonial capital in 1610, and many families returned again in the 1690s after the Pueblo Revolt. Those older family lines stayed visible even after the American territorial period brought in more English surnames."

  - question: "Why is Baca so associated with New Mexico?"
    answer: "Baca is strongly associated with New Mexico because it belongs to one of the colony's oldest documented family lines and stayed concentrated in the state for centuries. Forebears shows nearly a third of all U.S. residents named Baca live in New Mexico."

