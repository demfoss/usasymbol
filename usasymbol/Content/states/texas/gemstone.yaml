sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Texas State Gem
    paragraphs:
      - "Blue topaz is Texas's official state gem, designated by the Texas Legislature in 1969. Natural, gem-quality topaz in Texas occurs almost entirely within Mason County, making it one of only a few places in the country where the public can hunt for it."
      - "Texas lawmakers chose a gem tied to one specific, well-documented part of the state rather than a widely traded stone, giving Mason County's ranching and rockhounding community a gem uniquely their own."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Texas Blue Topaz?"
    paragraphs:
      - "Topaz is a hard aluminum silicate mineral that forms in cavities within granite and related rock. In Mason County it grows within pegmatites tied to the granitic plutons of the western Llano Uplift, especially around Streeter, Grit, and Katemcy."
      - "Most naturally occurring Texas topaz is colorless or only faintly tinted; true blue material, the color that gives the gem its name, is rarer and especially prized. At a Mohs hardness of 8, it is hard enough to hold a sharp facet edge, which makes it a favorite for cut jewelry stones."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Texas Chose Texas Blue Topaz as Its State Gem"
    paragraphs:
      - "Mason County is one of the few places in the United States where gem-quality topaz occurs naturally in the ground, and local ranches such as the Seaquist and Lindsay ranches have long let prospectors dig for a fee. That accessible, homegrown supply set Texas topaz apart from gems that states elsewhere must import or mine industrially."
      - "The designation also gave Texas hobbyist prospectors, drawn to the Hill Country each year to sift gravel and dig granite pockets, an official gem tied to their own tradition rather than a stone with no connection to the state."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Texas Blue Topaz Became Texas's State Gem"
    paragraphs:
      - "The Texas Legislature designated blue topaz the official state gem in 1969, the same year lawmakers named petrified palmwood the state stone. In 1977, Governor Dolph Briscoe signed a resolution adding an official state gem cut, the Lone Star Cut, a five-pointed star pattern designed by brothers Dr. Paul W. Worden Jr. and Gary B. Worden, making Texas the only state with its own official gemstone cut."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Texas Blue Topaz Is Found in Texas"
    paragraphs:
      - "Mason County, in the Texas Hill Country, is the source of nearly all naturally occurring Texas topaz, concentrated in granite around Streeter, Grit, and Katemcy. Several local ranches allow public prospecting for a daily fee."
