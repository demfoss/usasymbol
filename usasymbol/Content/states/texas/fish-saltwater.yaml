- id: facts
  icon: fa-solid fa-lightbulb
  title: Red Drum Facts
  facts:
  - Adopted in 2011 by the Texas Legislature.
  - Its scientific name is Sciaenops ocellatus.
  - By age three, it usually reaches 22 to 24 inches and 6 to 8 pounds.
  - The Texas record red drum weighed 59 and a half pounds.
  - Texas made it a protected game fish in 1981, which means it cannot be caught for commercial sale.
faq:
- question: What is Texas's state saltwater fish?
  answer: The red drum is Texas's state saltwater fish. Many Texans call it redfish.
- question: When did Texas adopt the red drum?
  answer: The Texas Legislature named the red drum the state saltwater fish in 2011. The governor signed the resolution on June 17, 2011.
- question: Why did Texas choose the red drum?
  answer: Lawmakers praised its size, power, and speed, and its popularity with anglers. They also pointed to its comeback after its numbers fell very low in the early 1980s.
- question: Why does the red drum have a black spot on its tail?
  answer: Scientists think the black spot near the tail fools predators into attacking the tail instead of the head. That gives the red drum a better chance to escape.
- question: Is the red drum the state fish of Texas?
  answer: It is the state saltwater fish. The Guadalupe bass is the official state fish, and it lives in fresh water.
