hero_image_caption: The red drum, also called redfish, lives in bays and coastal waters all along the Texas Gulf Coast. Photo by Scdnr, CC BY-SA 3.0.
intro_text: Texas's state saltwater fish is the red drum, a reddish-bronze Gulf Coast fish with a black spot on its tail, adopted in 2011. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Texas?
  paragraphs:
  - The red drum is the official state saltwater fish of Texas. The Texas Legislature named it in 2011, and the governor signed the resolution on June 17 that year. Its scientific name is Sciaenops ocellatus.
  - Texas also has a separate state fish, the Guadalupe bass, which lives in fresh water.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Red Drum
  paragraphs:
  - The red drum has a reddish-bronze body and a large black spot at the base of its tail. Some red drum have many spots, but it is very rare to find one with no spots at all.
  - Its mouth sits low on the front of its head, which helps it feed along the bottom. In shallow water, red drum sometimes feed head-down with their tails sticking out of the water. Anglers call this tailing.
  - Texans often call it redfish. Big adults are called bull reds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - In 2011, Texas lawmakers passed a resolution naming the red drum the official state saltwater fish. The governor signed it on June 17, 2011.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Texas Chose the Red Drum
  paragraphs:
  - The resolution praised the red drum's large size, power, and speed. It also called the fish one of the most popular game species in Texas waters.
  - The red drum also made a comeback. By the early 1980s, overfishing and illegal netting had pushed its numbers dangerously low. The state took action, and the population recovered.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Red Drum
  paragraphs:
  - Red drum live in good numbers in all Texas coastal waters, from Sabine Lake to the Rio Grande. Young fish stay in shallow bays, and adults move out into the Gulf.
  - The state has also stocked red drum in a few freshwater lakes.
