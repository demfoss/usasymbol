seo_title: "Texas State Tree | Official Pecan"
seo_description: 'Texas made pecan the first official state tree in 1919, honoring a native nut tree tied to river bottoms, orchards, and Governor Hogg''s request.'

intro_text: "The Texas state tree is the <strong>Pecan</strong> (<em>Carya illinoinensis</em>), adopted in <strong>1919</strong>. Texas became the first state to name an official state tree, choosing a native hardwood that grows 70 to 100 feet tall along rivers and creeks and produces the edible nuts tied to Texas agriculture. People searching for the state tree of Texas are usually looking for this direct answer: it is the Pecan, selected because it represents Native American food traditions, pioneer history, river-bottom landscapes, and the state's major pecan industry. Modern Texas remains one of America's leading pecan producers, with native groves and cultivated orchards across the state, and the Pecan remains a core entry in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Texas State Tree?"
    paragraphs:
      - "Texas's official state tree is the Pecan, a large deciduous hardwood native to Texas and the south-central United States. This tree grows 70 to 100 feet tall in Texas, with exceptional specimens exceeding 120 feet. The trunk measures three to six feet in diameter on mature trees. Some ancient Texas pecans reach eight feet across in river bottomlands. The tree grows at a moderate pace, adding 12 to 18 inches per year in favorable conditions. Pecan can live 200 to 300 years in Texas. The species holds enormous economic value - Texas produces 60 to 80 million pounds of pecans annually, making it America's leading pecan-producing state. The nuts generate hundreds of millions of dollars for the Texas economy through commercial orchards and native tree harvests."
      - "The leaves appear compound with 9 to 17 leaflets arranged along a central stem. Each compound leaf measures 12 to 20 inches long. The individual leaflets are lance-shaped, measuring four to seven inches long with finely serrated edges. Leaves emerge yellow-green in spring, darken to deep green in summer, and turn golden yellow in fall before dropping. The tree produces separate male and female flowers on the same tree. Long, drooping catkins release pollen in spring while small female flowers develop at branch tips. By fall, the distinctive nuts develop inside green husks that split open when ripe. Each nut has a smooth, thin shell containing the edible kernel - the pecan we eat."
      - "Pecan grows naturally throughout Texas in river valleys and bottomlands. The species thrives along Texas rivers including the Brazos, Colorado, Guadalupe, and San Antonio Rivers. Native pecan groves line waterways across Central Texas, providing shade and nuts. The tree requires deep, well-drained soils and adequate moisture. Wild pecans grow primarily in East and Central Texas where rainfall supports the tree without irrigation. Commercial pecan orchards extend into West Texas with irrigation. Texas lies at the center of the pecan's natural range, with more native pecan acreage than any other state. The tree tolerates Texas heat and occasional drought once established. San Saba County calls itself the Pecan Capital of the World, with both native groves and commercial orchards producing enormous crops."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Texas State Tree Name"
    paragraphs:
      - "The official name is Pecan, derived from the Algonquian word 'pacane' meaning 'nut requiring a stone to crack.' Spanish speakers adopted the native name, spelling it 'pacana,' which evolved into the English 'pecan.' Texans pronounce it 'puh-KAHN' rather than 'PEE-can.' The scientific name Carya illinoinensis combines Carya (Greek for nut) with illinoinensis (meaning of Illinois), though the tree grows far more abundantly in Texas than Illinois. Early Texas settlers called it pecan hickory or simply hickory, since pecans belong to the hickory genus."
      - "Some Texas references use improved pecan for cultivated varieties versus native pecan for wild trees. The genus Carya includes about 18 hickory species. Pecan is the only hickory cultivated for nuts on a commercial scale. The species belongs to the Juglandaceae family, the walnut family. Texas's Pecan is the same species grown throughout the south-central United States and northern Mexico. Texas contains the finest native pecan habitat and produces larger crops than any other state."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Pecan Became the Texas State Tree"
    paragraphs:
      - "Texas made Pecan its official state tree in 1919, becoming the first state in America to designate a state tree. Governor James Ferguson signed the legislation on March 1, 1919. The Texas Legislature passed the designation recognizing pecan as a tree integral to Texas history, economy, and character. By 1919, Texas pecan orchards had begun large-scale commercial production and wild pecan harvests employed thousands of Texans each fall. The designation honored both the tree's economic importance and its long roots in Texas culture."
      - "Texas selected Pecan because the species shaped the state's history and economy for centuries. Native Americans including the Caddo, Comanche, and Apache gathered pecans as a dietary staple long before European contact. Pecans provided concentrated nutrition that could be stored for winter. Archaeological evidence shows Native Americans harvested Texas pecans for at least 8,000 years. Spanish records described extensive pecan groves along Texas rivers in the 1500s and 1600s. Cabeza de Vaca's 1528 account noted natives gathering pecans in massive quantities. Spanish missions planted pecan trees and used the nuts for food. Mexican settlers continued the tradition, and Texas pioneers quickly learned pecan's value, reinforcing [the Lone Star State history](/states/texas/nickname/the-lone-star-state)."
      - "The tree became central to Texas agriculture in the 1800s. Sylvester Graham documented pecans along the Brazos and Colorado Rivers in 1822, and Edmond E. Risien established Texas's first commercial pecan nursery in San Saba in 1888. Governor James Stephen Hogg later asked for a pecan tree at his grave; that request helped turn the tree into a civic symbol before the Legislature made it official in 1919. Commercial orchards expanded after designation, with Texas varieties such as 'Western Schley,' 'Burkett,' and 'Wichita' becoming industry standards. The result was a state tree tied to native river bottoms, commercial orchards, and [Texas's state motto](/states/texas/motto/friendship)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Texas State Tree Facts"
    facts:
      - "Texas made Pecan its state tree on March 1, 1919, becoming the first state in America to designate an official state tree"
      - "Texas produces 60 to 80 million pounds of pecans annually, leading all states in production and generating hundreds of millions of dollars"
      - "Archaeological evidence shows Native Americans harvested Texas pecans for at least 8,000 years as a dietary staple"
      - "Governor James Stephen Hogg requested a pecan tree be planted at his grave - his famous dying wish cemented pecan's place in Texas legend"
      - "The name 'pecan' comes from the Algonquian word 'pacane' meaning 'nut requiring a stone to crack' - Spanish speakers adopted it as 'pacana'"
      - "San Saba County calls itself the Pecan Capital of the World, with both native groves and commercial orchards producing enormous crops"
      - "Texas contains more native pecan acreage than any other state, with wild trees lining rivers throughout Central and East Texas"
      - "Compound leaves contain 9 to 17 leaflets and measure 12 to 20 inches long - the numerous leaflets help identify pecan trees"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Texas State Tree and Flower"
    paragraphs:
      - "Texas's state flower is the [Bluebonnet](/states/texas/flower/bluebonnet) (Lupinus), designated in 1901. The state adopted its floral symbol 18 years before choosing pecan. Both symbols are native to Texas and hold deep cultural significance. The bluebonnet blankets Texas prairies and roadsides with blue flowers in spring, while pecan trees tower along rivers and in orchards statewide. Bluebonnets bloom in March and April as pecan trees begin leafing out. The pair covers Texas from ground-level wildflowers to towering shade trees."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Texas Pecan Tree"
    paragraphs:
      - "The compound leaves provide reliable identification. Look for leaves composed of 9 to 17 individual leaflets arranged along a central stem. The entire compound leaf measures 12 to 20 inches long. Each leaflet appears lance-shaped, four to seven inches long, with finely serrated edges and a slightly curved form. The leaflets attach in opposite or nearly opposite pairs along the stem. The terminal leaflet may be larger than side leaflets. This many-leafed compound structure distinguishes pecan from most Texas trees. Count the leaflets - if there are 9 or more, it's likely pecan or another hickory."
      - "The nuts and husks confirm identification. In fall, look for oval nuts inside green husks that split into four sections: when ripe. The nuts measure one to two inches long with smooth, thin shells that are tan to reddish-brown. The shell has a pointed tip and rounded base. Inside the shell, the edible pecan kernel has a distinctive sweet, buttery flavor. The husks start green and turn brown as they mature in October and November. Unlike walnuts which have thick, hard-to-crack husks, pecan husks split cleanly revealing the nut inside. The distinctive pecan nut shape and thin shell make identification certain."
      - "The overall form shows a large, spreading crown. Mature pecans develop massive trunks supporting crowns that spread 60 to 80 feet wide. The crown appears rounded to oval with a somewhat open branching pattern. Forest-grown trees develop taller, narrower crowns, while open-grown trees spread widely. The bark appears gray-brown with shallow furrows and flat ridges forming a somewhat scaly pattern. As trees age, the bark develops deeper furrows with broader ridges. Young trees show smoother bark. Twigs are stout with large, pointed buds. In spring, look for long, drooping catkins (male flowers) that hang from branches releasing pollen. The enormous size, spreading crown, and compound leaves make mature pecan trees unmistakable in the Texas landscape."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Texas State Tree Symbolizes"
    paragraphs:
      - "Pecan represents Texas agriculture at two scales: wild trees along rivers and commercial orchards that made Texas a leading producer. It also carries older history, from Native harvests to Governor Hogg's grave-side request. That combination makes pecan a practical state symbol rather than a purely decorative one."

faq:
  - question: "What is the Texas state tree?"
    answer: "The Pecan (Carya illinoinensis) is Texas's official state tree. Texas named it the state tree on March 1, 1919, becoming the first state in America to designate an official state tree."
  
  - question: "What is the Texas state tree called?"
    answer: "Texas's state tree is called Pecan, from the Algonquian word 'pacane' meaning 'nut requiring a stone to crack.' The scientific name is Carya illinoinensis. It's also been called pecan hickory or improved pecan for cultivated varieties. Texans pronounce it 'puh-KAHN.'"
  
  - question: "When was the Texas state tree adopted?"
    answer: "Texas made Pecan its official state tree on March 1, 1919, signed by Governor James Ferguson. Texas became the first state in America to designate a state tree, 12 years before most other states adopted tree symbols."
  
  - question: "Why is the Pecan Texas's state tree?"
    answer: "Texas chose Pecan because it shaped the state's history and economy for millennia. Native Americans harvested pecans for at least 8,000 years. Spanish records described vast groves in the 1500s-1600s. Governor James Stephen Hogg's famous dying wish for a pecan tree at his grave cemented the tree's place in Texas legend. Texas leads the nation in pecan production with 60 to 80 million pounds annually. The tree lines Texas rivers naturally and thrives in commercial orchards, generating hundreds of millions of dollars. Pecan represented Texas agriculture, Native American heritage, and natural abundance."
  
  - question: "What is the Texas state tree name?"
    answer: "The name is Pecan, from Algonquian 'pacane' (nut requiring stone to crack), through Spanish 'pacana.' The scientific name is Carya illinoinensis - Carya means nut in Greek, and illinoinensis means 'of Illinois' though it grows more abundantly in Texas."
  
  - question: "Where does the Texas state tree grow?"
    answer: "The Pecan grows naturally throughout Texas in river valleys and bottomlands, especially along the Brazos, Colorado, Guadalupe, and San Antonio Rivers. Native groves dominate Central and East Texas. Commercial orchards extend into West Texas with irrigation. Texas contains more native pecan acreage than any other state. San Saba County calls itself the Pecan Capital of the World."
  
  - question: "What are some facts about the Texas state tree?"
    answer: "The Pecan grows 70 to 100 feet tall and Texas was the first state to designate a state tree (1919). Texas produces 60 to 80 million pounds of pecans annually, leading all states. Native Americans harvested pecans for 8,000+ years. Governor Hogg requested a pecan tree at his grave in his dying wish. Compound leaves have 9 to 17 leaflets. The name comes from Algonquian 'pacane.' San Saba County is the Pecan Capital of the World. Texas contains the most native pecan acreage of any state."
  
  - question: "How do you recognize the Texas state tree?"
    answer: "Look for compound leaves with 9 to 17 lance-shaped leaflets arranged along a 12 to 20 inch stem. In fall, look for oval nuts (one to two inches) inside green husks that split into four sections: when ripe. The nuts have smooth, thin tan to reddish-brown shells. Large spreading crown (60 to 80 feet wide). Gray-brown bark with shallow furrows and scaly pattern. Long drooping catkins in spring. The many-leafed compound structure and distinctive nuts provide certain identification."

