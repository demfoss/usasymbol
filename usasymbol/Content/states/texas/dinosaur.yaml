faq:
  - question: "What is Texas's state dinosaur?"
    answer: "Texas is the only state to formally update its state dinosaur when the taxonomy changed. The original 1997 designation named Pleurocoelus — a catch-all genus applied to Texas sauropod material for decades by default. When Peter Rose's 2007 analysis showed the Texas bones were distinct enough to warrant their own name, Texas went back to the legislature: House Bill 1107 in 2009 replaced the designation with Paluxysaurus jonesi, named for the Paluxy River in Hood County where key specimens were found."

  - question: "Why did Texas change its state dinosaur from Pleurocoelus to Paluxysaurus?"
    answer: "The original 1997 designation used Pleurocoelus, a genus name that had been applied to Texas sauropod material for decades. In 2007, Peter Rose's formal analysis showed the Texas material was distinct enough from the Maryland Pleurocoelus type specimens to warrant its own genus, which he named Paluxysaurus jonesi. Texas updated the designation in 2009."

  - question: "What does Paluxysaurus jonesi mean?"
    answer: "Paluxysaurus means 'lizard of the Paluxy' — named for the Paluxy River in Hood County, Texas, near where key specimens were found. The species name jonesi honors the Jones Ranch, which was a significant collection locality for the material."

  - question: "Did Paluxysaurus make the dinosaur tracks at Glen Rose?"
    answer: "Possibly. The sauropod tracks at Dinosaur Valley State Park in Glen Rose are Early Cretaceous in age and were made by large brachiosaur-grade sauropods consistent with Paluxysaurus in size and time period. The attribution is circumstantial — no direct skeletal association with the tracks has been established — but it's the most reasonable candidate available."

  - question: "Could Texas's state dinosaur change again?"
    answer: "Potentially. Some researchers have proposed that Paluxysaurus may be synonymous with Sauroposeidon, an Oklahoma sauropod named earlier. If this synonymy were formally accepted in the paleontological literature, the name Paluxysaurus jonesi could be replaced by Sauroposeidon. Texas's willingness to update its designation once suggests it could do so again if the taxonomy requires it."

  - question: "Where can I see the Glen Rose dinosaur tracks?"
    answer: "The main trackway sites are at Dinosaur Valley State Park in Glen Rose, Somervell County, managed by Texas Parks and Wildlife. Track visibility varies with the level of the Paluxy River — low summer water exposes additional tracks on the riverbed. The park is open year-round."

