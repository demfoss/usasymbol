title: "Paluxysaurus jonesi"
adopted_year: 2009
legislation: "Texas House Bill 1107 (2009)"
meaning: "Texas's state dinosaur changed. In 1997, Texas designated Pleurocoelus as its state dinosaur. In 2009, it updated the designation to Paluxysaurus jonesi. That revision — a legislature going back to correct a symbol — is unusual enough to be worth explaining. It's also a window into how science updates official symbols when taxonomy catches up."
scientific_name: "Paluxysaurus jonesi"
period: "Early Cretaceous (Aptian–Albian), ~112–110 million years ago"
discovered_in: "1999 (formal description material); bones collected earlier in Hood County"
diet: "Herbivore"
length: "~19–20 meters (estimated)"
weight: "~20,000–30,000 kg (estimated)"
named_by: "Peter J. Rose, 2007"
fossil_sites: "Twin Mountains Formation, Hood County and Tarrant County, Texas"

author: "USA Symbol Team"
