intro_text: "Texas's state precious metal is silver, adopted in 2007 to honor the Shafter Mining District in Presidio County, whose Presidio Mine produced more than 90 percent of all silver ever mined in Texas. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Texas State Precious Metal
    paragraphs:
      - "Silver is Texas's official state precious metal, designated by the Texas Legislature in 2007. Almost all of the state's silver came from a single district, the Shafter Mining District in Presidio County in far West Texas."
      - "Texas chose silver to mark a mining history concentrated in one remote corner of the state rather than a metal mined widely across Texas ground."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Silver?"
    paragraphs:
      - "Silver is a soft, dense, silvery-white metal known for its high shine and its status as the best natural conductor of electricity. Unlike gold, it typically occurs combined with other minerals in ore veins rather than as pure nuggets, so it usually needs processing to extract."
      - "Exposed to air, silver slowly tarnishes to a dull gray or black as it reacts with trace sulfur compounds, a property that sets it apart from more chemically inert metals like gold."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Texas Chose Silver as Its State Precious Metal"
    paragraphs:
      - "Prospector John W. Spencer found silver ore near what became Shafter in 1880, and the discovery led to the Presidio Mine, operated from 1884 to 1947. That single mine produced more than 32.6 million ounces of silver, over 90 percent of all silver ever mined in Texas."
      - "The Shafter Mining District turned a remote stretch of Presidio County into a working mining town for over half a century, and geologists estimate roughly 20 million troy ounces of silver still remain in the ground there. Designating silver in 2007 recognized that concentrated, well-documented mining legacy."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Silver Became Texas's State Precious Metal"
    paragraphs:
      - "The Texas Legislature designated silver the official state precious metal in 2007, decades after large-scale mining at Shafter had ended, formally recognizing the district's place in Texas mining history."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Silver Is Found in Texas"
    paragraphs:
      - "Shafter, in Presidio County, was the center of Texas silver mining. The Presidio Mine there operated from 1884 to 1947 and remains the source of the large majority of all silver ever produced in the state."
    sites:
      - name: Presidio Mine (Shafter Mining District)
        city: Shafter
        lat: 29.8202
        lng: -104.3033
        note: "Site of the historic Presidio silver mine"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Silver Facts"
    facts:
      - "Adopted as Texas's state precious metal in 2007."
      - "The Presidio Mine near Shafter produced more than 90 percent of all silver ever mined in Texas."
      - "The Shafter Mining District operated from 1884 to 1947, yielding over 32.6 million ounces of silver."
      - "An estimated 20 million troy ounces of silver are believed to remain in the ground at Shafter."

