faq:
  - question: What is Texas's state mineral?
    answer: "Texas's official designation is a state precious metal, silver, adopted by the Texas Legislature in 2007."
  - question: When did Texas adopt silver as its state precious metal?
    answer: "The Texas Legislature designated silver the official state precious metal in 2007."
  - question: Why did Texas choose silver?
    answer: "The Presidio Mine near Shafter in Presidio County produced more than 90 percent of all silver ever mined in Texas, making silver a natural fit for a state mining symbol."
  - question: Where was silver mined in Texas?
    answer: "Almost all Texas silver came from the Shafter Mining District in Presidio County, where the Presidio Mine operated from 1884 to 1947."

