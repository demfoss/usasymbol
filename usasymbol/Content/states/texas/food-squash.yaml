    title: "What Is Texas's State Squash?"
    paragraphs:
      - "The pumpkin is Texas's official state squash, designated by the Texas Legislature in 2013. Pumpkins are grown on farms throughout Texas and are a familiar sight at fall festivals and roadside stands."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pumpkin"
    paragraphs:
      - "Pumpkins are large, orange-skinned squash that grow on sprawling vines and are harvested in the fall. In Texas they are grown for fresh eating, baking, and seasonal decoration, with many farms hosting pumpkin patches each October."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pumpkin Became Texas's State Squash"
    paragraphs:
      - "The Texas Legislature designated the pumpkin the official state squash in 2013, recognizing a crop grown by Texas farmers and closely tied to fall traditions across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Pumpkin"
    paragraphs:
      - "Texas chose the pumpkin because it is grown across many parts of the state and has become closely linked to fall farm tourism, with pumpkin patches and festivals drawing visitors each autumn."

