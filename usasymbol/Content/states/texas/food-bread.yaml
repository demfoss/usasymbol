sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Texas's State Bread?"
    paragraphs:
      - "Pan de campo, meaning camp bread in Spanish, is Texas's official state bread, designated by the Texas Legislature in 2005. It is a flat, unleavened or lightly leavened bread traditionally cooked over an open fire."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Pan de Campo"
    paragraphs:
      - "Pan de campo is made from a simple dough of flour, shortening or lard, baking powder, and water, rolled flat and cooked on a hot griddle or Dutch oven lid, traditionally over an open campfire. Its thick, slightly chewy texture made it easy for ranch hands to prepare with limited equipment while working cattle far from a kitchen."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Pan de Campo Became Texas's State Bread"
    paragraphs:
      - "The Texas Legislature designated pan de campo the official state bread in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose Pan de Campo"
    paragraphs:
      - "Pan de campo has deep roots in the vaquero and cowboy ranching culture of South Texas, where it was cooked at cattle camps using whatever fire and cookware were on hand. Wise County, Texas, home to the annual Pan de Campo Cook-off in Jacksboro, still celebrates the bread as part of the region's ranching heritage."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Pan de Campo Comes From in Texas"
    paragraphs:
      - "Jacksboro, in Wise County, Texas, known as the Cowboy Capital of the World, hosts an annual Pan de Campo Cook-off celebrating the bread's ranching roots."
    sites:
      - name: Jacksboro
        city: Jacksboro
