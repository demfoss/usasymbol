intro_text: "Texas's state fruit is the Texas Red Grapefruit, adopted in 1993 to recognize a citrus variety grown in the groves of the Rio Grande Valley. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Texas's State Fruit?"
    paragraphs:
      - "The Texas Red Grapefruit is Texas's official state fruit, designated by the Texas Legislature in 1993. It is grown mainly in the Rio Grande Valley of deep south Texas."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Texas Red Grapefruit"
    paragraphs:
      - "Texas Red Grapefruit has a yellow-blushed rind and deep red flesh that is sweeter than many other grapefruit varieties. The deep color comes from natural mutations first found on Rio Grande Valley trees in the early 1900s, later developed into varieties like the Rio Star."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Texas Red Grapefruit Became Texas's State Fruit"
    paragraphs:
      - "The Texas Legislature designated the Texas Red Grapefruit the official state fruit in 1993."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Texas Red Grapefruit"
    paragraphs:
      - "The Rio Grande Valley's warm climate and sandy soil have supported citrus growing since the early 1900s, and red-fleshed grapefruit varieties discovered and developed there became a signature Texas crop shipped nationwide."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Texas Red Grapefruit Comes From in Texas"
    paragraphs:
      - "The Rio Grande Valley in deep south Texas, including groves near Mission and Weslaco, is the center of Texas grapefruit production."
    sites:
      - name: Rio Grande Valley citrus groves
        city: Mission
        lat: 26.21
        lng: -98.32
        note: "Center of Texas grapefruit production"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Texas Red Grapefruit Facts"
    facts:
      - "Adopted as Texas's state fruit in 1993."
      - "The Rio Grande Valley is the center of Texas grapefruit production."
      - "Red-fleshed grapefruit mutations were first found on Valley trees in the early 1900s."

