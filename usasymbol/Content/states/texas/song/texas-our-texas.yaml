sections:
  - id: overview
    icon: fa-solid fa-music
    title: Texas State Song
    paragraphs:
      - "\"Texas, Our Texas\" is Texas's official state song, adopted in 1929. William J. Marsh composed the music and co-wrote the lyrics with Gladys Yoakum Wright, and the song won a statewide contest held to find a new anthem for the state."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Texas, Our Texas\" Explained"
    paragraphs:
      - "The song is a grand, sweeping anthem that praises Texas for its size and independence, built for full orchestral or choral performance. Its tone is formal and patriotic, closer to a national anthem than a folk ballad."
      - "William J. Marsh, a British-born organist and composer who settled in Fort Worth, wrote the music in 1924. He worked with Fort Worth resident Gladys Yoakum Wright on the lyrics, and together they entered the finished song in a statewide competition."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Texas, Our Texas" Represents Texas
    paragraphs:
      - "The Texas Legislature ran an open, statewide songwriting contest to select a new state song, and Marsh and Wright's entry won out over other submissions from across the state. That competitive process gave the winning song a claim to broad public support rather than a single lawmaker's preference."
      - "Its grand, expansive style matched how Texans often describe their state, and the song's scale suited Texas's identity as the largest state in the continental United States at the time of its adoption."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Texas, Our Texas\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Texas, Our Texas" Became Texas's State Song
    paragraphs:
      - "The Texas Legislature held a statewide contest for a new state song, and William J. Marsh's composition, co-written with Gladys Yoakum Wright, was selected as the winner. Lawmakers formally adopted \"Texas, Our Texas\" in 1929, five years after Marsh first wrote the music."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Texas, Our Texas\" Facts"
    facts:
      - "Texas adopted \"Texas, Our Texas\" as its state song in 1929."
      - "The song won a statewide songwriting contest held to select a new state anthem."
      - "Composer William J. Marsh was born in Liverpool, England, and later settled in Fort Worth."
      - "Marsh co-wrote the lyrics with Fort Worth resident Gladys Yoakum Wright."

