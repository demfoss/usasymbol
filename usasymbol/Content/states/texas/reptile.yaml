seo_title: "Texas State Reptile | Texas Horned Lizard"
seo_description: "Texas's state reptile is the Texas horned lizard, adopted in 1993. Learn what it looks like and why it became official."
hero_image: /images/reptiles/texas/texas-state-reptile-hero.webp
hero_image_alt: "A flat, spiny Texas horned lizard with crown-like horns resting on sandy ground."
hero_image_caption: "The Texas horned lizard, Texas's state reptile, is known for the crown of horns on its head."
intro_text: "Texas's state reptile is the Texas horned lizard, a spiny, flat-bodied lizard often called a horny toad, adopted in 1993. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Texas?
    paragraphs:
      - "The Texas horned lizard is Texas's official state reptile, designated by the Texas Legislature in 1993. Its scientific name is Phrynosoma cornutum."
      - "It is a flat, spiny lizard often nicknamed the horny toad, even though it is a true lizard and not a toad."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Texas Horned Lizard
    paragraphs:
      - "The Texas horned lizard has a flat, round body covered in spines, with a crown of longer horns on the back of its head that gives the species its name."
      - "Its coloring is usually tan, brown, or reddish with darker blotches, which helps it blend into sandy or rocky ground."
      - "It can grow to about 3 to 5 inches long and is known for a surprising defense trick: when threatened, it can squirt a thin stream of blood from its eyes to startle predators."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Texas Legislature designated the Texas horned lizard the official state reptile in 1993, recognizing a lizard that had long been a familiar and beloved animal across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Texas Chose the Texas Horned Lizard
    paragraphs:
      - "The Texas horned lizard has long been a well-known and popular animal across the state, often remembered fondly as the horny toad from childhood memories, making it a natural choice for a state symbol."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Texas Horned Lizard
    paragraphs:
      - "The Texas horned lizard lives in dry, sandy, or rocky habitats across much of Texas, though its numbers have dropped sharply in parts of the state where it was once common."
    sites:
      - name: West Texas plains
        city: San Angelo
        lat: 31.46
        lng: -100.44
        note: "Sandy, arid habitat for this species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Texas Horned Lizard Facts
    facts:
      - "Adopted in 1993 by the Texas Legislature."
      - "Often nicknamed the horny toad, though it is a true lizard."
      - "Grows to about 3 to 5 inches long."
      - "Can squirt a thin stream of blood from its eyes to startle predators."
      - "Has become harder to find in parts of Texas where it was once common."

