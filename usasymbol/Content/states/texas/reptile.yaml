faq:
  - question: What is Texas's state reptile?
    answer: "Texas's state reptile is the Texas horned lizard, adopted by the Texas Legislature in 1993."
  - question: When did Texas adopt the Texas horned lizard?
    answer: "The Texas Legislature designated the Texas horned lizard the official state reptile in 1993."
  - question: Why did Texas choose the Texas horned lizard?
    answer: "The Texas horned lizard, often called the horny toad, had long been a familiar and popular animal across the state, making it a natural choice for a state symbol."
  - question: Is the Texas horned lizard a turtle, snake, lizard, or alligator?
    answer: "The Texas horned lizard is a lizard, despite its common nickname horny toad, known for the spiny horns crowning its head."

