faq:
  - question: What is Texas's state stone?
    answer: "Texas's state stone is petrified palmwood, fossilized palm trunk wood adopted by the Texas Legislature in 1969."
  - question: When did Texas adopt petrified palmwood as its state stone?
    answer: "The Texas Legislature designated petrified palmwood the official state stone in 1969."
  - question: Why did Texas choose petrified palmwood?
    answer: "Petrified palmwood preserves evidence that East Texas once supported palm forests during the Oligocene epoch, tying the stone directly to the state's ancient landscape."
  - question: Is petrified palmwood actually wood?
    answer: "No longer. Silica minerals gradually replaced the original wood tissue, leaving stone that preserves the trunk's internal structure rather than the wood itself."

