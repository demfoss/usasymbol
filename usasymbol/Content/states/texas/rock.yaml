intro_text: "Texas's state stone is petrified palmwood, adopted in 1969, fossilized palm trunks from the Oligocene epoch found scattered across East Texas's Gulf Coastal Plain. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Texas State Stone
    paragraphs:
      - "Petrified palmwood is Texas's official state stone, designated by the Texas Legislature in 1969. It is fossilized wood from ancient palm trees, preserved when silica gradually replaced the trunk's organic tissue while retaining its internal structure."
      - "Texas chose it as a stone that records the state's own deep past, a reminder that much of East Texas once supported a warmer, wetter landscape of palm forests millions of years before the Gulf Coastal Plain looked anything like it does today."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Petrified Palmwood?"
    paragraphs:
      - "Petrified palmwood forms when a palm trunk is buried and its wood is slowly replaced, cell by cell, with silica minerals dissolved in groundwater. The process preserves the trunk's original internal pattern in stone rather than turning it into ordinary rock."
      - "A cut cross-section shows small, dot-like markings, the fossilized remains of the palm's vascular bundles, scattered across a gray, brown, or tan background. Because palms lack growth rings like true trees, petrified palmwood looks distinctly different from petrified conifer or hardwood."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Texas Chose Petrified Palmwood as Its State Stone"
    paragraphs:
      - "During the Oligocene epoch, roughly 34 to 23 million years ago, a warmer and wetter climate let palm forests grow across what is now the East Texas Gulf Coastal Plain. As those forests were buried and fossilized over time, they left behind petrified palmwood scattered through the region's soil and stream beds."
      - "Collectors and hobbyists across East Texas have dug and polished petrified palmwood for generations. It is one of the few state stones that also preserves physical evidence of the state's ancient climate."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Petrified Palmwood Became Texas's State Stone"
    paragraphs:
      - "The Texas Legislature designated petrified palmwood the official state stone in 1969, the same year lawmakers named Texas blue topaz the state gem."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Petrified Palmwood Facts"
    facts:
      - "Adopted as Texas's state stone in 1969, the same year as the state gem, Texas blue topaz."
      - "Dates to the Oligocene epoch, roughly 34 to 23 million years ago."
      - "Found scattered across many East Texas counties along the ancient Gulf Coastal Plain."
      - "Cross sections show small, rounded markings left by the palm's original vascular bundles, unlike the growth rings seen in petrified conifer wood."

