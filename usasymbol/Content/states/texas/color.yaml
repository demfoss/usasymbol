sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Texas designated blue, white, and red as its official state colors in 1933 under Acts 1933, 43rd Regular Session, Chapter 87, formally codifying the colors of the Lone Star Flag as the state's official color identity. The 1933 designation was a natural legislative formalization of colors that had represented Texas continuously since 1836, when the Congress of the Republic of Texas adopted the Lone Star Flag as the national flag of the newly independent republic. When Texas was annexed by the United States in 1846, the Lone Star Flag's colors transferred seamlessly into state identity, where they have remained for nearly two centuries and align with [the Texas flag page](/states/texas/flag/texas-state-flag)."
      - "The 1933 act explicitly tied the state colors to the specific meanings assigned to each color in the Texas Flag Code: blue for loyalty, white for purity, and red for bravery. This tripartite symbolic framework — pairing each color with a civic virtue — reflects the deliberate nation-building effort of the Texas Republic's founders, who designed the Lone Star Flag as a banner capable of representing a sovereign nation on the world stage. The 1933 legislature recognized that simply naming the colors was insufficient; the virtues they represented were inseparable from the colors themselves and from [Texas's official motto](/states/texas/motto/friendship)."
    subsections:
      - subtitle: "Acts 1933, 43rd Regular Session, Chapter 87"
        text: "The 1933 legislation designating Texas's official state colors did not specify exact Pantone or HEX values, as color standardization systems of that precision did not yet exist in American state government practice. The Texas State Library and Archives Commission and the Texas Secretary of State's office have since adopted standardized color specifications consistent with the flag's official manufacturing standards. The Texas Flag Code, codified in the Texas Government Code Chapter 3100, provides detailed specifications for the Lone Star Flag's colors, which serve as the definitive reference for the state colors."
      - subtitle: "The Republic of Texas Flag and the 1836 Origin"
        text: "The Lone Star Flag that gives Texas's state colors their historical foundation was designed by Dr. Charles Bellinger Stewart and adopted by the Congress of the Republic of Texas on January 25, 1839. The flag featured a vertical blue stripe on the hoist side bearing a single white five-pointed star, with two horizontal stripes of white over red on the fly side. The design drew on the colors of earlier Texas revolutionary flags, creating visual continuity with the Texas Revolution of 1835-1836 that produced the Republic. When Texas joined the Union on December 29, 1845, the flag was retained as the state flag, making it one of only two flags in American history — alongside Hawaii's — to have served as both the national flag of an independent republic and a U.S. state flag in [the Lone Star State narrative](/states/texas/nickname/the-lone-star-state)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "No state's colors carry a more explicitly defined symbolic framework than Texas's. The Texas Flag Code assigns specific civic virtues to each of the three colors — loyalty to blue, purity to white, and bravery to red — creating one of the most complete official color symbolism systems in American state law. These definitions are not decorative; they reflect the founding ideals of a republic that fought a revolution against Mexico to establish its independence, defended its sovereignty for a decade as an independent nation, and chose to join the United States on its own terms. The blue, white, and red of Texas are the colors of a state that was once a country, and every official interpretation of the colors acknowledges that extraordinary historical reality."
    subsections:
      - subtitle: "Blue: Loyalty in Texas History"
        text: "The designation of blue as the color of loyalty in Texas law speaks directly to the experience of the Texas Revolution and the Republic. The settlers who fought for Texas independence at the Alamo, at Goliad, and at San Jacinto in 1836 were demonstrating a loyalty to a vision of self-governance that the Mexican government under President Santa Anna had suppressed. The blue stripe of the Lone Star Flag, which frames the single white star of Texas independence, represents this fidelity — to each other, to the republic they created, and later to the United States after annexation in 1846. Texas blue, standardized as a deep navy approximating PMS 281, is one of the most authoritative blues in American state vexillology."
      - subtitle: "White: Purity in Texas History"
        text: "White's designation as purity in the Texas Flag Code reflects the aspirational quality of the republic's founding documents. The Texas Declaration of Independence, adopted on March 2, 1836 — now celebrated as Texas Independence Day — articulated a vision of civic life grounded in natural rights and constitutional government. The white star at the center of the Lone Star Flag, the most iconic single element in any American state flag, embodies this aspiration. The single star also gave Texas both its flag's name and its state nickname, the Lone Star State, making white the color most directly associated with Texas's foundational self-image as an independent, self-sufficient commonwealth."
      - subtitle: "Red: Bravery in Texas History"
        text: "Red's designation as bravery is among the most historically weighted color designations in American state law. The defenders of the Alamo — including James Bowie, Davy Crockett, and William Barret Travis — who held the San Antonio mission against Santa Anna's army for thirteen days in February and March 1836 before being overwhelmed on March 6, represent the archetype of Texan bravery embedded in the red of the state colors. The Alamo's fall, rather than ending the Texas Revolution, galvanized the Texan army under Sam Houston, who defeated Santa Anna at the Battle of San Jacinto on April 21, 1836 — Texas Independence Day in fact if not in declaration — with the battle cry 'Remember the Alamo.' Red in Texas carries the weight of that sacrifice."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue, white, and red are the defining colors of every major Texas state emblem. The Lone Star Flag, governed by the Texas Flag Code in Texas Government Code Chapter 3100, is the primary vehicle for the state colors and one of the most recognized flags in the United States. The Texas state seal, adopted at statehood and revised in 1992, features a central gold star surrounded by a wreath of live oak and olive branches on a blue field, with the state motto 'Friendship' (the meaning of the Caddo word Tejas, from which Texas takes its name) on the outer ring. The Texas Governor's Flag, the flags of the Texas House and Senate, and the insignia of Texas state agencies all incorporate the blue, white, and red palette established by the 1933 legislation. Texas state government branding guidelines specify exact color values consistent with the Lone Star Flag's manufacturing standards for all official applications, including interstate-facing materials on [States That Border Texas](/states/texas/borders)."

