expert_quote:
  text: "Texas is the only U.S. state whose official colors are directly derived from a flag that once flew over a sovereign independent republic — the blue, white, and red of the Lone Star Flag carry the weight of national sovereignty — colors that flew over a republic before they flew over a state."
  source: "Texas State Library and Archives Commission, Austin, State Symbols and Flag Documentation"

faq:
  - question: "What are the official colors of Texas?"
    answer: "The official state colors of Texas are Blue, White, and Red, formally designated in 1933 under Acts 1933, 43rd Regular Session, Chapter 87. The colors exactly match the Lone Star Flag, where blue represents loyalty, white represents purity, and red represents bravery."
  - question: "What is the HEX code for Texas Blue?"
    answer: "The standard HEX code for Texas Blue is #002868, corresponding to Pantone PMS 281, consistent with the deep navy blue of the Lone Star Flag's vertical stripe as specified in the Texas Flag Code."
  - question: "What is the HEX code for Texas Red?"
    answer: "The standard HEX code for Texas Red is #BF0A30, corresponding to Pantone PMS 193, consistent with the deep crimson red of the Lone Star Flag's lower horizontal stripe as specified in the Texas Flag Code."
  - question: "When were Texas's state colors officially adopted?"
    answer: "Texas's state colors were officially adopted in 1933 under Acts 1933, 43rd Regular Session, Chapter 87, though the same blue, white, and red had appeared on the Texas Lone Star Flag since 1839, when the Republic of Texas adopted the flag as its national banner."
  - question: "What do the colors of Texas represent?"
    answer: "Under the Texas Flag Code, blue represents loyalty, white represents purity, and red represents bravery. These designations reflect the founding ideals of the Republic of Texas and the courage demonstrated during the Texas Revolution of 1835-1836, including the defense of the Alamo and the Battle of San Jacinto."

