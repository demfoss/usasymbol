big_stat:
  number: "1836"
  description: "Year the Republic of Texas declared independence from Mexico on March 2, establishing the sovereign nation whose Lone Star Flag would become the source of Texas's official state colors — blue for loyalty, white for purity, and red for bravery — codified into law nearly a century later in 1933"

timeline:
  - year: "1836"
    description: "Republic of Texas declares independence from Mexico on March 2; the Texas Revolution produces the Lone Star State's foundational identity and the color palette of the future state flag"
  - year: "1839"
    description: "Congress of the Republic of Texas adopts the Lone Star Flag on January 25, establishing blue, white, and red as the national colors of the independent republic; designer Dr. Charles Bellinger Stewart's flag will serve Texas for nearly two centuries"
  - year: "1845"
    description: "Texas annexed by the United States on December 29, becoming the 28th state; the Lone Star Flag is retained as the state flag, making it one of only two former national flags to become a U.S. state flag"
  - year: "1933"
    description: "Texas Legislature formally designates blue, white, and red as the official state colors under Acts 1933, 43rd Regular Session, Chapter 87, codifying the virtues of loyalty (blue), purity (white), and bravery (red) into state law"
  - year: "1992"
    description: "Texas Flag Code revised and incorporated into the Texas Government Code, providing updated specifications for the Lone Star Flag's colors and their official applications across state government"

expert_quote:
  text: "Texas is the only U.S. state whose official colors are directly derived from a flag that once flew over a sovereign independent republic — the blue, white, and red of the Lone Star Flag carry the weight of national sovereignty — colors that flew over a republic before they flew over a state."
  source: "Texas State Library and Archives Commission, Austin, State Symbols and Flag Documentation"

faq:
  - question: "What are the Texas state colors?"
    answer: "The official Texas state colors are Blue, White, and Red. Texas designated them in 1933, and they match the Lone Star Flag: blue for loyalty, white for purity, and red for bravery."
  - question: "What are the official colors of Texas?"
    answer: "The official colors of Texas are Blue, White, and Red, formally designated under Acts 1933, 43rd Regular Session, Chapter 87. They are the same colors used on the Texas Lone Star Flag."
  - question: "What is the HEX code for Texas Blue?"
    answer: "The standard HEX code for Texas Blue is #002868. The matching RGB value is 0, 40, 104, and the listed Pantone reference is PMS 281."
  - question: "What is the HEX code for Texas White?"
    answer: "The standard HEX code for Texas White is #FFFFFF. The matching RGB value is 255, 255, 255."
  - question: "What is the HEX code for Texas Red?"
    answer: "The standard HEX code for Texas Red is #BF0A30. The matching RGB value is 191, 10, 48, and the listed Pantone reference is PMS 193."
  - question: "When were Texas's state colors officially adopted?"
    answer: "Texas's state colors were officially adopted in 1933 under Acts 1933, 43rd Regular Session, Chapter 87, though the same blue, white, and red had appeared on the Texas Lone Star Flag since 1839, when the Republic of Texas adopted the flag as its national banner."
  - question: "What do the colors of Texas represent?"
    answer: "Under the Texas Flag Code, blue represents loyalty, white represents purity, and red represents bravery. These designations reflect the founding ideals of the Republic of Texas and the courage demonstrated during the Texas Revolution of 1835-1836, including the defense of the Alamo and the Battle of San Jacinto."

