seo_title: "Texas State Colors | Blue White Red"
seo_description: "Texas state colors are Blue, White, and Red, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Texas are **Blue**, **White**, and **Red**. Texas adopted these colors in 1933, and they use the same palette as [the Texas state flag](/states/texas/flag/texas-state-flag): blue means loyalty, white means purity, and red means bravery. The main Texas color codes are **#002868** for blue, **#FFFFFF** for white, and **#BF0A30** for red, with RGB, CMYK, and Pantone values listed below for designers, students, and anyone comparing [U.S. state colors](/symbols/colors)."

official_colors: "Blue, White, and Red"
official_since: "1933 (Acts 1933, 43rd Regular Session, Chapter 87)"
primary_use: "State government branding, Lone Star Flag design, state agency insignia, official state communications"
known_for: "Exactly matching the colors of the Lone Star Flag of the former Republic of Texas; blue representing loyalty, white representing purity, and red representing bravery — the three foundational virtues of the Lone Star State"

