intro_text: "Texas's state health nut is the native pecan, adopted in 2001 to recognize a nut that grows wild along the state's rivers and is also the state tree of Texas. This profile appears in the [list of U.S. state foods](/symbols/nuts)."

sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Texas's State Health Nut?"
    paragraphs:
      - "The native pecan is Texas's official state health nut, designated by the Texas Legislature in 2001. Pecan trees grow wild along rivers and creeks throughout much of the state, and the pecan tree is also the official state tree of Texas."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Native Pecan"
    paragraphs:
      - "The native pecan is a smaller, thinner-shelled variety than the larger pecans grown in commercial orchards. It grows on tall trees found along Texas riverbanks and bottomlands, especially in central and eastern Texas. The nut ripens in the fall inside a husk that splits open to release the shell."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Native Pecan Became Texas's State Health Nut"
    paragraphs:
      - "The Texas Legislature designated the native pecan the official state health nut in 2001, adding to a set of state symbols that already included the pecan tree as the Texas state tree."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Native Pecan"
    paragraphs:
      - "Pecan trees grow wild across much of Texas and have long been part of the state's landscape and food traditions. The pecan tree was already the Texas state tree, and naming the native pecan the state health nut extended that recognition to the nut itself."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Native Pecan Facts"
    facts:
      - "Adopted as Texas's state health nut in 2001."
      - "The pecan tree is also the official state tree of Texas."
      - "Native pecans grow wild along rivers and creeks across central and eastern Texas."
      - "Native pecans are smaller than the larger pecan varieties grown in commercial orchards."

