faq:
  - question: "What is Texas's state health nut?"
    answer: "Texas's state health nut is the native pecan, adopted by the Texas Legislature in 2001."
  - question: "When did Texas adopt the native pecan as its state health nut?"
    answer: "The Texas Legislature designated the native pecan the official state health nut in 2001."
  - question: "Why did Texas choose the native pecan?"
    answer: "Pecan trees grow wild across much of Texas, and the pecan tree was already the Texas state tree, making the native pecan a fitting choice for the state health nut designation."
  - question: "Is the native pecan the same as the pecan tree, Texas's state tree?"
    answer: "Yes. The native pecan comes from the same pecan tree that Texas designated its official state tree, and the nut received its own state health nut designation in 2001."

