seo_title: "Texas State Motto | Friendship"
seo_description: "Texas's state motto is 'Friendship,' adopted in 1930. The word traces to the Caddo greeting recorded as Tejas, the origin of the state's name."

intro_text: "Texas's state motto is <strong>Friendship</strong> — a single English word adopted in February 1930, 94 years after Texas declared independence. The word traces to <em>táysha</em>, a Caddo greeting meaning friends or allies that Spanish Father Damián Massanet recorded as <em>Tejas</em> in 1689. House Concurrent Resolution No. 22 formally adopted it through the 41st Legislature's fourth called session. Many Texans believe 'Remember the Alamo' is the official motto because it appears on the reverse of the Great Seal — but it has no official status. Neither does 'Don't Mess with Texas,' which originated as an anti-littering slogan in 1985."

sections:
  - id: "caddo-word-to-state-name"
    icon: "fa-solid fa-person-walking"
    title: "From a Caddo Greeting to a State Name to a State Motto"
    paragraphs:
      - "Father Damián Massanet led a Spanish expedition into East Texas in 1689 and encountered the Hasinai Confederacy — a branch of the Caddo Nation. The Caddo greeted the Spanish with the word <em>táysha</em>, meaning friends or allies. Massanet wrote the word as <em>Tejas</em> in his expedition reports and used it as a name for both the people and the region. The spelling shifted over the following century and a half: Tejas became Texas."
      - "The Caddo formed a large confederacy spread across present-day Texas, Oklahoma, Arkansas, and Louisiana. The Hasinai branch in East Texas were the first Caddo the Spanish encountered, and their greeting gave a name to the entire territory. By the time Texas declared independence in 1836 and became the 28th state in 1845, the Caddo Nation had been forced from Texas — relocated to Oklahoma in 1859."
      - "In 1930, the 41st Legislature passed House Concurrent Resolution No. 22, noting that the state's name came from the Caddo word meaning friendship. By formally adopting 'Friendship' as the motto, the legislature created a direct etymological link: the motto derives from the word that became the name. Texas is the only state with a motto explicitly tracing to a Native American word that became the state's name."

  - id: "what-is-not-the-motto"
    icon: "fa-solid fa-circle-xmark"
    title: "'Remember the Alamo' Is Not the Motto. Neither Is 'Don't Mess With Texas.'"
    paragraphs:
      - "'Remember the Alamo' appears on the reverse side of Texas's Great Seal above a shield with a cannon and rifle, the Alamo facade, and a live oak. It does not have official status as a state motto. Texas's government has never designated it as such. It appears on the seal as a historical reference to the 1836 Battle of the Alamo — not as a legal motto."
      - "'Don't Mess with Texas' is an anti-littering slogan created by the Texas Department of Transportation in 1985 for a highway cleanup campaign. It became one of the most recognized advertising campaigns in state history and reduced litter on Texas highways by 72 percent over five years. It is not, and has never been, an official state motto."
      - "Texas waited 94 years after independence — from 1836 to 1930 — before officially designating any motto. During those 94 years, 'Remember the Alamo' functioned as an informal rallying cry embedded in Texas identity. The 1930 legislature's choice of 'Friendship' was quiet and etymological, connected to Indigenous history, while the more dramatically charged alternatives remained informal."

  - id: "94-years-without-a-motto"
    icon: "fa-solid fa-clock"
    title: "94 Years as a Republic and State — Without Any Official Motto"
    paragraphs:
      - "Texas declared independence from Mexico on March 2, 1836. It existed as the Republic of Texas for nine years, then joined the United States on December 29, 1845 as the 28th state. Neither the Republic nor the early state designated an official motto. Texas spent 94 years — from independence through 1930 — without a formal motto."
      - "The 41st Legislature addressed this gap in a fourth called session in February 1930. A called session is convened between regular sessions when the governor determines legislative action is needed. That the legislature convened specifically to address state business — and chose to designate a motto during that session — suggests the action was taken as part of a broader effort to codify state symbols during that period."
      - "House Concurrent Resolution No. 22 passed with little recorded opposition. The resolution explained the Caddo etymology and designated 'Friendship' as the official motto. No separate statute exists — the motto rests on the 1930 resolution. Texas is one of the later states to adopt an official motto, joining a process most states completed in the 19th century."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Texas State Motto Facts"
    style: "gradient"
    facts:
      - "The motto traces to the Caddo word 'táysha,' a greeting for friends and allies recorded as 'Tejas' by Spanish explorers in 1689."
      - "Texas had no official motto for 94 years after declaring independence in 1836 — until House Concurrent Resolution No. 22 in 1930."
      - "'Remember the Alamo' appears on the Great Seal's reverse but has no official status as a motto."
      - "'Don't Mess with Texas' is a 1985 anti-littering slogan, not an official motto — but it reduced highway litter by 72% in five years."
      - "The Caddo Nation was forced from Texas and relocated to Oklahoma in 1859 — 71 years before the legislature honored their language."
      - "Texas is the only state with a motto explicitly tracing to a Native American word that became the state's name."

faq:
  - question: "What is Texas's state motto?"
    answer: "Texas's official state motto is 'Friendship,' adopted in February 1930 through House Concurrent Resolution No. 22. The word traces to 'táysha,' a Caddo greeting meaning friends or allies that Spanish explorers recorded as 'Tejas' in 1689, which eventually became Texas."

  - question: "Is 'Remember the Alamo' the Texas state motto?"
    answer: "No. 'Remember the Alamo' appears on the reverse of Texas's Great Seal but has never been designated the official state motto. The only official Texas state motto is 'Friendship,' adopted in 1930."

  - question: "Where does 'Friendship' come from?"
    answer: "From the Caddo word 'táysha,' a greeting meaning friends or allies. When Father Damián Massanet's Spanish expedition encountered the Hasinai Confederacy in East Texas in 1689, the Caddo greeted them with this word. Massanet recorded it as 'Tejas,' which became 'Texas.' The 1930 legislature formally connected the state name's etymology to the motto."

  - question: "When did Texas adopt its motto?"
    answer: "February 1930, through House Concurrent Resolution No. 22 passed by the 41st Legislature in a fourth called session. Texas had existed without an official motto for 94 years — from independence in 1836 through 1930."

  - question: "What language is Texas's motto written in?"
    answer: "English. 'Friendship' is a plain English word, though its origin traces to the Caddo Native American language through a chain of translation: Caddo 'táysha' became Spanish 'Tejas' became English 'Texas,' whose etymological meaning became the motto."

  - question: "Where does Texas's motto appear?"
    answer: "Primarily in legislative materials, official documents, and educational resources. The motto does not appear on the Texas state flag or on the front of the Great Seal. The Great Seal's reverse shows 'Remember the Alamo' — which has no official motto status. Schools include 'Friendship' when teaching Texas state symbols alongside the bluebonnet, the mockingbird, and the Lone Star flag."

