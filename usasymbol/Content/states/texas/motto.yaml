faq:
  - question: "What is Texas's state motto?"
    answer: "Texas's state motto is \"Friendship.\" It was adopted in February 1930 by the 41st Texas Legislature. The word connects to the Caddo word táyshaʼ, meaning \"friends\" or \"allies\" — the origin of the name Texas."

  - question: "What does \"Friendship\" mean as a state motto?"
    answer: "The motto refers to the meaning behind the state's name. The Caddo people of East Texas used the word táyshaʼ to mean \"friends\" or \"allies.\" Spanish explorers wrote it as Tejas, which became Texas. The motto ties the state's identity to that original meaning."

  - question: "When did Texas adopt \"Friendship\" as its state motto?"
    answer: "Texas adopted \"Friendship\" in February 1930 during the 41st legislative session. It is now codified in Texas Government Code § 3101.001."

