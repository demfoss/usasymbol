intro_text: "Texas's state motto is <strong>Friendship</strong>. Adopted in February 1930, it connects to the Caddo word <em>táyshaʼ</em>, the origin of the name Texas, meaning \"friends\" or \"allies.\ This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

