faq:
  - question: "What is Texas's state flying mammal?"
    answer: "Texas's state flying mammal is the Mexican free-tailed bat (Tadarida brasiliensis), designated in 1995. Texas is one of few states to designate a bat as an official symbol, reflecting the species' economic importance to agriculture and prominence in Texas tourism."
  
  - question: "When was the Mexican free-tailed bat designated as Texas's state symbol?"
    answer: "The Mexican free-tailed bat became Texas's official state flying mammal in 1995 when the 74th Legislature passed Senate Concurrent Resolution No. 29, sponsored by Senator John Carona and Representative Dianne White Delisi. The designation recognized bats' agricultural pest control value and the growing popularity of bat-watching tourism in Texas."
  
  - question: "Why did Texas choose the Mexican free-tailed bat as a state symbol?"
    answer: "Texas chose the Mexican free-tailed bat because the species provides enormous economic benefits to Texas agriculture by consuming billions of crop-damaging insects annually, saving farmers millions to billions in pesticide costs and crop losses. The species also represents successful adaptation to human landscapes and creates spectacular natural tourism attractions including the Congress Avenue Bridge colony and Bracken Cave emergence. The bat's binational life cycle—breeding in Texas, wintering in Mexico—reflects Texas's border culture and connections to Mexican heritage."
  
  - question: "What is Bracken Cave and why is it important?"
    answer: "Bracken Cave near San Antonio hosts the world's largest bat colony with up to 15 million Mexican free-tailed bats during summer months. The cave serves as a maternity colony where female bats give birth to and raise pups from June through August. The nightly emergence of millions of bats creates one of the most spectacular wildlife displays on Earth, visible on weather radar. The Nature Conservancy purchased the cave in 1991 to protect it from development, ensuring the colony's survival."
  
  - question: "How much are Mexican free-tailed bats worth to Texas agriculture?"
    answer: "Mexican free-tailed bats provide pest control services worth hundreds of millions to billions of dollars annually to Texas agriculture. Studies estimate that bats save Texas cotton growers alone $740,000 to over $1 million yearly by consuming cotton bollworm moths and other pest insects. When benefits to corn, pecans, and other crops are included, total statewide agricultural savings likely reach billions. A single large colony can consume over 250 tons of insects in one summer season, providing natural pest control without chemical costs or environmental damage."
  
  - question: "Where can I see Mexican free-tailed bats in Texas?"
    answer: "The best bat viewing locations in Texas include the Congress Avenue Bridge in Austin (1.5 million bats, free public viewing nightly March-November), Bracken Cave near San Antonio (15 million bats, Nature Conservancy guided tours Thursday-Sunday May-October), Old Tunnel State Park near Fredericksburg (3 million bats, viewing platform and programs), and Eckert James River Bat Cave Preserve near Mason (4-6 million bats, open May-October). Emerge viewing is best July-August when young bats join adults."
  
  - question: "Are Mexican free-tailed bats dangerous?"
    answer: "Mexican free-tailed bats pose no danger to humans when left undisturbed. Like all wild mammals, bats can carry rabies, but transmission requires direct contact such as a bite. Less than one percent of bats carry rabies, and bats do not attack humans. Never handle bats with bare hands. The Congress Avenue Bridge colony has coexisted with millions of human visitors for decades without incident. Bat droppings (guano) can harbor histoplasma fungus if disturbed in accumulated deposits, but this risk is minimal for people viewing bat emergences outdoors."
  
  - question: "When do Mexican free-tailed bats migrate?"
    answer: "Mexican free-tailed bats arrive in Texas in March and depart by October-November. Pregnant females arrive first to establish maternity colonies in caves, bridges, and buildings. They give birth to single pups in June. Young bats begin flying in July-August, creating the largest emergence spectacles as juveniles join adults. By October and November, bats migrate south to winter in Mexico, with some populations traveling to central Mexican states. They return to Texas the following March to repeat the annual cycle."

