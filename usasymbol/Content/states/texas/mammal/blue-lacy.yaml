faq:
  - question: "What is Texas's state dog?"
    answer: "Texas's state dog is the Blue Lacy, designated in 2005. The Blue Lacy is the only dog breed developed entirely in Texas, created by the Lacy brothers in Burnet County starting in 1858 specifically for herding livestock, hunting wild hogs, and general ranch work."
  
  - question: "When was the Blue Lacy designated as Texas's state dog?"
    answer: "The Blue Lacy became Texas's official state dog in 2005 when the 79th Legislature passed House Concurrent Resolution No. 108, sponsored by Representative David Hilderbran of Kerrville. The designation recognized the breed's unique status as the only dog breed developed entirely in Texas and its historical importance to Texas ranching heritage."
  
  - question: "Why did Texas choose the Blue Lacy as the state dog?"
    answer: "Texas chose the Blue Lacy because it is the only dog breed developed entirely in Texas, created specifically for Texas ranching conditions rather than imported from elsewhere. The breed represents Texas self-sufficiency and practical innovation—the Lacy brothers developed exactly the dog they needed for working cattle, hunting, and ranch protection in the 1850s. The Blue Lacy worked alongside Texas longhorns and embodies the working dog tradition essential to frontier settlement and ranching economy."
  
  - question: "Who created the Blue Lacy breed?"
    answer: "The Blue Lacy breed was created by four brothers—Frank, George, Ewin, and Harry Lacy—who settled in Burnet County, Texas, in 1858. They developed the breed by selectively breeding dogs to perform specific ranching tasks including herding cattle, hunting wild game, and protecting property. The brothers combined greyhound for speed, scenthound for tracking ability, and possibly wolf for stamina and toughness, creating a breed perfectly adapted to Texas conditions and ranching work."
  
  - question: "What color is a Blue Lacy dog?"
    answer: "Despite the name, Blue Lacys come in three color varieties: blue (actually gray), red, and tri-colored (blue and red with white markings). The blue/gray variety is most common and gave the breed its name. All color varieties can appear in the same litter from the same parents. The coat is short and smooth, allowing heat dissipation crucial for working in Texas summers."
  
  - question: "Are Blue Lacy dogs good pets?"
    answer: "Blue Lacys are intensely driven working dogs that require significant exercise, mental stimulation, and tasks to thrive. They make excellent partners for active owners who can provide working outlets including herding, hunting, or dog sports, but they are generally unsuitable as companion-only pets for typical suburban or urban homes. The breed's high energy, strong prey drive, and need for purpose make them challenging for inexperienced dog owners. Blue Lacys form deep bonds with their handlers but become destructive if bored or underemployed."
  
  - question: "Is the Blue Lacy a rare dog breed?"
    answer: "Yes, the Blue Lacy is a rare breed with total population estimated at only a few thousand individuals, concentrated primarily in Texas on working ranches and farms. The breed has American Kennel Club Foundation Stock Service recognition but has not achieved full AKC recognition or United Kennel Club recognition. Most Blue Lacys exist outside major breed registries in the hands of working ranchers who prioritize performance over pedigree documentation."
  
  - question: "Where can I get a Blue Lacy dog?"
    answer: "Blue Lacys are available primarily through preservation breeders affiliated with the Texas Lacy Dog Association, which maintains breed standards and connects prospective owners with reputable breeders. Due to the breed's rarity and working temperament, responsible breeders carefully screen potential owners to ensure appropriate homes with adequate space, exercise opportunities, and working outlets. Blue Lacys are rarely found in pet stores or through commercial breeding operations. Prospective owners should expect waiting lists and questions about their ability to provide appropriate homes for high-drive working dogs."

