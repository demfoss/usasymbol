title: Northern Mockingbird
scientific_name: Mimus polyglottos
adopted_year: 1927
legislation: Senate Concurrent Resolution No. 8, 40th Legislature (1927)
meaning: 'Texas lawmakers did not just pick a familiar bird. They described one found in all parts of the state, in city and country, on prairie and in woods and hills, and praised it as a fighter in defense of home. That turns the bird into a compact self-portrait of Texas: broad in range, publicly visible, and proud of toughness as much as song.'
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "Texas State Bird | Northern Mockingbird"
seo_description: Texas's state bird is the Northern Mockingbird, adopted in 1927. The resolution praised it as statewide, musical, and fiercely protective of home.
intro_text: "Texas's state bird is the <strong>Northern Mockingbird</strong>, adopted in <strong>1927</strong> through <strong>Senate Concurrent Resolution No. 8</strong>. The resolution did not just name a familiar bird; it made an argument for why the mockingbird represented Texas. Lawmakers described it as found in <strong>all parts of the state</strong>, in city and country, on prairie and in woods and hills, and praised it for defending its home against all comers. That language turned the state bird into a compact Texas self-portrait: widely present, loud, and protective."
shared_states:
- Arkansas
- Florida
- Mississippi
- Tennessee
quick_facts:
  - label: "How the 1927 resolution framed the bird"
    value: "A singer found in all parts of Texas and a fighter in defense of home"
  - label: "Who first asked for the symbol"
    value: "The Texas Federation of Women's Clubs"
  - label: "Why it fit such a large state"
    value: "The bird was described as common in city and country, prairie and woods and hills"
  - label: "What later agencies still emphasize"
    value: "Mockingbirds remain among the state's most noticed birds and occur in nearly every habitat type in Texas"

sections:
- id: why-did-texas-see-the-mockingbird-as-a-statewide-bird
  icon: fa-solid fa-circle-question
  title: Why Did Texas See the Mockingbird as a Statewide Bird?
  paragraphs:
  - 'The 1927 resolution did something useful: it argued that the mockingbird belonged to all of Texas, not just to one region. Its language runs through city and country, prairie and woods and hills.'
  - For a state spanning coastal plain, hill country, plains, and desert, a bird symbol that only fit one region was no symbol at all. The mockingbird was presented as one of the few birds that could cross all of those without explanation.
- id: what-did-the-1927-resolution-say-about-texas-itself
  icon: fa-solid fa-scroll
  title: What Did the 1927 Resolution Say About Texas Itself?
  paragraphs:
  - The resolution did not praise the mockingbird only as a singer. It also praised the bird as a defender of home, language that turns the symbol into a character sketch.
  - Texas did not simply choose a familiar Southern bird. It chose one the Legislature openly treated as matching Texas ideas of boldness, self-possession, and home defense — and said so in the resolution itself.
- id: the-1927-case-still-holds-in-texas
  icon: fa-solid fa-map
  title: The 1927 Case Still Holds in Texas
  paragraphs:
  - Texas Parks and Wildlife still describes mockingbirds as some of the state's most noticed birds and says they occur in just about every habitat type in Texas — which is the same statewide argument lawmakers made in 1927, still accurate nearly a century later.
  - Arkansas, Florida, Mississippi, and Tennessee also use the mockingbird, but none of their adoption records carry the same specific language about range, toughness, and home defense that Texas built into its resolution.
faq:
- question: What is Texas's state bird?
  answer: Texas's state bird is the Northern Mockingbird.
- question: When did Texas adopt the Northern Mockingbird?
  answer: Texas adopted the Northern Mockingbird in 1927 through Senate Concurrent Resolution No. 8.
- question: Who pushed Texas to adopt the mockingbird?
  answer: Texas historical summaries say the Texas Federation of Women's Clubs asked the Legislature to adopt the mockingbird as the state bird.
- question: Why did Texas choose the mockingbird?
  answer: Texas chose the mockingbird because lawmakers treated it as a truly statewide bird and as a symbol of Texas character. The 1927 resolution stressed both its range across Texas and its fierce defense of home.
- question: What made the mockingbird fit Texas better than a more unusual bird?
  answer: The resolution argued that the mockingbird already belonged to all of Texas, in city and country and across different landscapes. That broad fit mattered more than rarity.
- question: Does Texas share the mockingbird with other states?
  answer: Yes. Arkansas, Florida, Mississippi, and Tennessee also use the Northern Mockingbird, but Texas reads the bird in a more specific way through the 1927 resolution's language about statewide range and home defense.
- question: What does the mockingbird mean for Texas?
  answer: Texas's 1927 resolution described the mockingbird as found in all parts of the state and as a fighter in defense of home — framing it as both a statewide presence and a character match for Texas, not just a familiar Southern bird.
