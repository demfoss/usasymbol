sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Texas's State Cobbler?"
    paragraphs:
      - "Peach cobbler is Texas's official state cobbler, designated by the Texas Legislature in 2013. It is a baked fruit dessert made with sliced peaches under a biscuit-like or pastry topping."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Peach Cobbler"
    paragraphs:
      - "Peach cobbler is made by baking sweetened, sliced peaches under or around a batter or biscuit dough topping, producing a dish with a soft, fruit-forward center and a browned crust. It is typically served warm, often with ice cream."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Peach Cobbler Became Texas's State Cobbler"
    paragraphs:
      - "The Texas Legislature designated peach cobbler the official state cobbler in 2013, the same year pecan pie was named the state pie."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose Peach Cobbler"
    paragraphs:
      - "Texas Hill Country, especially around Fredericksburg and Stonewall, has long been known for peach orchards, and the fruit has become closely linked to that region's identity. Peach cobbler reflects that local peach-growing tradition."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Peach Cobbler Comes From in Texas"
    paragraphs:
      - "Fredericksburg and Stonewall, in the Texas Hill Country, are known for their peach orchards and roadside peach stands, and the region hosts an annual peach celebration."
    sites:
      - name: Stonewall
        city: Stonewall
        lat: 30.2377
        lng: -98.6614
        note: "Center of Texas Hill Country peach growing"
        type: primary

  - id: facts
