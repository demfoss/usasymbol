timeline:
- year: '1836'
  description: Texas declares independence from Mexico on March 2. The Republic of Texas is established and begins creating the institutions of self-governance, including provisional official seals.
- year: '1839'
  description: The Congress of the Republic of Texas formally adopts the Great Seal, establishing the lone star, olive branch, and live oak branch as the official design.
- year: '1845'
  description: The U.S. Congress approves Texas annexation. Texas joins the Union on December 29 as the 28th state. The Great Seal is adapted with "State of Texas" in the border text.
- year: '1991'
  description: Texas standardizes the current authoritative version of the seal under Texas Government Code § 301.051, defining design requirements for both the obverse and reverse faces.

faq:
- question: What does the Texas state seal show?
  answer: The obverse of the Texas state seal shows a lone five-pointed star in the center, with an olive branch on the left representing peace and a live oak branch on the right representing strength, encircled by the words "The State of Texas." The reverse shows a shield with the Alamo, the Gonzales cannon, and Vince's Bridge, surrounded by six historic flags and the mottoes "Remember the Alamo" and "Texas One and Indivisible."
- question: What does the lone star on the Texas seal mean?
  answer: The lone star represents Texas independence and is the origin of the state's nickname, the Lone Star State. The star was associated with the Texan independence movement from the 1830s and was placed at the center of the official seal when the Republic of Texas adopted the design in 1839.
- question: When was the Texas state seal adopted?
  answer: The Great Seal of Texas was first adopted by the Congress of the Republic of Texas in 1839, six years before Texas joined the United States. When Texas became the 28th state on December 29, 1845, the seal was adapted by changing "Republic of Texas" to "State of Texas" in the border text.
- question: What do the branches on the Texas state seal mean?
  answer: The olive branch on the left of the lone star represents peace. The live oak branch on the right represents strength. The pairing was chosen during the Republic of Texas era to express the new republic's commitment to peaceful diplomacy alongside the capacity for self-defense.
- question: Why is live oak on the Texas seal instead of another tree?
  answer: Live oak is native to Texas and was associated with permanence because it keeps its leaves year-round. The wood is also among the densest of North American hardwoods and was prized in nineteenth-century shipbuilding. For a new republic establishing its durability, a tree known for structural strength was a deliberate choice.
- question: Has the Texas state seal changed since 1839?
  answer: The core design has not changed. The lone star, olive branch, and live oak branch remain exactly as adopted in 1839. The border text changed from "Republic of Texas" to "State of Texas" at annexation in 1845. The current authoritative version was standardized under Texas Government Code § 301.051 in 1991.

