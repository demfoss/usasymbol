sections:
- id: history
  icon: fa-solid fa-landmark
  title: Texas State Seal History and Origin
  paragraphs:
  - "The Great Seal of Texas was created during the Republic of Texas era. After Texas declared independence from Mexico on March 2, 1836, the new republic needed official symbols of governance. The Congress of the Republic of Texas formally adopted the Great Seal in 1839, establishing the lone star, olive branch, and live oak branch as the central design elements."
  - "Texas operated as an independent republic for nearly a decade before the United States Congress approved annexation. Texas was admitted to the Union on December 29, 1845, as the 28th state. The Great Seal was adapted for statehood: the border text changed from 'Republic of Texas' to 'State of Texas,' while the core composition remained identical to the 1839 design."
  - "The seal has been revised and standardized several times since 1845. The current authoritative version is defined in Texas Government Code § 301.051, which specifies design requirements for both the obverse and the reverse faces of the seal."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Texas State Seal Symbols Mean
  paragraphs:
  - "The Texas state seal has two faces. The obverse, reproduced on official documents, shows the lone star and the two branches. The reverse, adopted in 1961 and revised in 1991, centers a shield with the Alamo, the Gonzales cannon, and Vince's Bridge, surrounded by six historic flags and the mottoes \"Remember the Alamo\" and \"Texas One and Indivisible.\""
  elements:
  - id: lone-star
    name: The Lone Star
    image: /images/state-seals/texas/elements/lone-star.png
    paragraphs:
    - "The lone five-pointed star is the central element of the Texas state seal's obverse, positioned upright with one point at the top. The star gave Texas its permanent nickname, the Lone Star State. The same lone star design appears on the Texas state flag, making it one of the most consistent visual identities of any U.S. state."
    - "The star was already associated with Texan identity during the independence movement of the 1830s. It appeared on early Texas military flags and Republic-era currency before the Congress of the Republic placed it at the center of the official seal in 1839. Unlike most state seal imagery of the period, the lone star did not come from European heraldry or classical mythology; it came directly from the Texan independence movement itself."
  - id: olive-branch
    name: Olive Branch
    image: /images/state-seals/texas/elements/olive-branch.png
    paragraphs:
    - "An olive branch curves along the left side of the obverse, encircling the lower portion of the lone star. In Western heraldic tradition, olive branches represent peace and the preference for diplomacy over military conflict. The olive branch appears on the reverse of the United States Great Seal for the same reason."
    - "For the Republic of Texas in 1839, the olive branch carried specific weight. The republic had just fought a war of independence and Mexico never formally recognized Texan sovereignty. Placing peace as one of the two flanking symbols was a deliberate statement about the republic's preferred posture toward its neighbors."
  - id: live-oak-branch
    name: Live Oak Branch
    image: /images/state-seals/texas/elements/live-oak-branch.png
    paragraphs:
    - "A live oak branch curves along the right side of the obverse, mirroring the olive branch. Live oak represents strength and the capacity to defend that peace. The tree is native to the Texas Gulf Coast and Hill Country and keeps its leaves year-round, a quality associated with permanence rather than seasonal vulnerability."
    - "Live oak wood is exceptionally dense and was prized in nineteenth-century shipbuilding for its resistance to decay and cannonball impact. The USS Constitution, known as 'Old Ironsides,' was partly framed with live oak. For a young republic establishing its durability, a tree known for structural strength was a fitting choice."
  - id: reverse-seal
    name: Reverse Seal Design
    image: /images/state-seals/texas/elements/reverse-seal.png
    paragraphs:
    - "The reverse of the Texas state seal is a separate ceremonial design, not an eagle seal. At its center is a shield: the Alamo occupies the upper half, while the lower half shows the Gonzales cannon on one side and Vince's Bridge on the other. These scenes summarize the independence struggle in three images."
    - "Around the shield appear the six historic flags associated with Texas: Spain, France, Mexico, the Republic of Texas, the Confederate States, and the United States. A white five-pointed star rises above the shield, with the motto \"Remember the Alamo\" above and \"Texas One and Indivisible\" below. The reverse was first adopted in 1961 and standardized in revised form in 1991."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Texas State Seal'
  paragraphs:
  - "The core composition of the Texas state seal, the lone star flanked by olive and live oak branches, has remained unchanged since 1839. What has changed over time is the border text, rendering quality, and the statutory specifications governing official use."
  versions:
  - name: Republic of Texas Seal (1839)
    years: 1839–1845
    image: /images/state-seals/texas/versions/1839-republic.svg
    description: The official 1839 Republic of Texas seal design from Wikimedia Commons, showing the lone star on an azure field encircled by olive and live oak branches with the words "Republic of Texas."
  - name: State Seal at Admission (1846)
    years: 1846–1991
    image: /images/state-seals/texas/versions/1846-statehood.jpg
    description: A historical printed statehood-era rendering preserved in The American Cyclopaedia. It shows the same star-and-wreath composition after annexation, with the wording changed to "State of Texas."
  - name: Current Standardized Seal (1991–present)
    years: 1991–present
    image: /images/state-seals/texas/versions/seal-of-texas.svg
    description: The modern standardized obverse used by the Texas Secretary of State. It preserves the 1839 star, olive branch, and live oak branch design while reflecting the state's current official rendering conventions.

