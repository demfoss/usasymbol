sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Texas's State Snack?"
    paragraphs:
      - "Tortilla chips and salsa are Texas's official state snack, designated by the Texas Legislature in 2003. Tortilla chips are fried or baked pieces of corn tortilla, typically served with a tomato and chili pepper based salsa."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Tortilla Chips and Salsa"
    paragraphs:
      - "Tortilla chips are made by cutting corn tortillas into wedges and frying or baking them until crisp. Salsa, Spanish for sauce, is typically made from tomatoes, onions, chili peppers, cilantro, and lime juice, blended or chopped to different textures. The pairing is a standard starter at Tex-Mex restaurants across Texas."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Tortilla Chips and Salsa Became Texas's State Snack"
    paragraphs:
      - "The Texas Legislature designated tortilla chips and salsa the official state snack in 2003."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose Tortilla Chips and Salsa"
    paragraphs:
      - "Tortilla chips and salsa are staples of Tex-Mex cuisine, a style of cooking that developed in Texas from a blend of Mexican and Southern culinary traditions. The pairing is served at Mexican and Tex-Mex restaurants throughout the state and is closely identified with Texas food culture."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Tortilla Chips and Salsa Facts"
    facts:
      - "Adopted as Texas's state snack in 2003."
      - "Tortilla chips are made from fried or baked corn tortillas."
      - "Salsa is traditionally made from tomatoes, chili peppers, onions, and cilantro."
      - "Tortilla chips and salsa are a standard starter at Tex-Mex restaurants in Texas."

