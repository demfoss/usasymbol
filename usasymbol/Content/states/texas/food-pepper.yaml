faq:
  - question: "What is Texas's state pepper?"
    answer: "Texas's state pepper is the jalapeño, adopted by the Texas Legislature in 1995."
  - question: "When did Texas adopt the jalapeño as its state pepper?"
    answer: "The Texas Legislature designated the jalapeño the official state pepper in 1995."
  - question: "Why did Texas choose the jalapeño?"
    answer: "Texas chose the jalapeño because it is widely grown in South Texas and central to Tex-Mex cooking."
  - question: "Is the jalapeño grown in Texas today?"
