sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Texas's State Pepper?"
    paragraphs:
      - "The jalapeño is Texas's official state pepper, designated by the Texas Legislature in 1995. It is a medium-hot green chile pepper widely grown across the state and used in Texan and Tex-Mex cooking."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Jalapeño"
    paragraphs:
      - "Jalapeños are medium-hot chile peppers, typically two to three inches long, picked and eaten green or left to ripen to red. They are grown on farms across South Texas and used fresh, pickled, stuffed, or dried and smoked into chipotle peppers."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Jalapeño Became Texas's State Pepper"
    paragraphs:
      - "The Texas Legislature designated the jalapeño the official state pepper in 1995, recognizing a pepper already closely tied to Texan food culture and commercial farming."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Jalapeño"
    paragraphs:
      - "Texas chose the jalapeño because it is grown commercially across South Texas and is one of the most widely used peppers in Texan and Tex-Mex cooking, appearing in salsas, stuffed appetizers, and countless other dishes."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Jalapeño Facts"
    facts:
      - "Adopted as Texas's state pepper in 1995."
      - "Jalapeños are grown commercially across South Texas."
      - "Smoked and dried jalapeños become chipotle peppers."
      - "Texas also has a separate state native pepper, the chiltepin."

