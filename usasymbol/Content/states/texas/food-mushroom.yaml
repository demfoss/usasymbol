sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Texas's State Mushroom?"
    paragraphs:
      - "The Texas star is Texas's official state mushroom, designated by the Texas Legislature in 2021. It is an earthstar fungus known for its unusual star-shaped body, and it was first scientifically described from a specimen found in the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Texas Star"
    paragraphs:
      - "The Texas star is a type of earthstar fungus. Its outer layer splits open into pointed, star-shaped rays as it matures, revealing a round, puffball-like sac in the center that releases spores. It grows on the ground, typically appearing after rain in warm months. Unlike edible mushrooms grown for food, the Texas star is valued mainly for its striking, unusual shape."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Texas Star Became Texas's State Mushroom"
    paragraphs:
      - "The Texas Legislature designated the Texas star the official state mushroom in 2021, recognizing a fungus with a direct scientific connection to the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Texas Star"
    paragraphs:
      - "The Texas star earns its name because it was first identified and described from a specimen found growing in Texas, giving the state a direct scientific tie to the species. Its distinctive star shape also made it a memorable, recognizable choice for a state symbol."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Texas Star Facts"
    facts:
      - "Adopted as Texas's state mushroom in 2021."
      - "It is a type of earthstar fungus with a star-shaped outer layer."
      - "The species was first scientifically described from a specimen found in Texas."
      - "It typically appears on the ground after rain in warm months."

