sections:
  - id: overview
    icon: fa-solid fa-music
    title: Texas State Dance
    paragraphs:
      - "Square dance became Texas's official state folk dance in 1994. The designation put a name on a dance already familiar to generations of Texans through the state's network of community dance halls."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the center. A caller directs the action, naming each move just before dancers perform it, so no memorized routine is needed."
      - "The music usually comes from a live or recorded string band built around fiddle, guitar, and banjo. Dancers move briskly between formations, alternating partners with the group before returning to their original position."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Stand in a square with your partner beside you and another couple on each of the other three sides."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner, then to the dancer on your other side, before the calling begins."
      - title: "Circle Left with the Group"
        description: "Join hands with the full square and step together in a circle in the direction the caller names."
      - title: "Do-Si-Do Your Partner"
        description: "Walk forward and pass your partner back to back without turning, then step back to your starting spot."
      - title: "Promenade Home"
        description: "Take your partner's hands and walk together around the square back to your original position to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Texas
    paragraphs:
      - "Square dance calling associations ran a national campaign from the 1970s through the 1990s urging states to name it an official folk dance. Texas joined that wave in 1994, decades after square dance had already become a fixture of rural social life across the state."
      - "Central Texas built one of the country's most extensive networks of community dance halls, many still standing in small Hill Country towns. Those halls hosted generations of square dance sets, giving the designation a grounding beyond ceremony."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Texas's State Dance
    paragraphs:
      - "Texas designated square dance its official state folk dance in 1994, joining dozens of other states that adopted the same dance during a decades-long national push by square dance organizations."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Texas adopted square dance as its official state folk dance in 1994."
      - "Texas's Hill Country holds one of the country's largest concentrations of historic community dance halls."
      - "A caller directs square dance moves aloud, so dancers do not need to memorize a routine in advance."
      - "Square dance became an official folk dance in dozens of states following a national campaign by callers' associations."
      - "The dance is performed in sets of four couples arranged in a square formation."

