faq:
  - question: What is Texas's state dance?
    answer: "Texas's official state folk dance is square dance, adopted in 1994."
  - question: When did Texas adopt square dance as its state dance?
    answer: "Texas adopted square dance as its state folk dance in 1994."
  - question: Why did Texas choose square dance?
    answer: "Square dance was already common in the state's rural dance halls, and Texas joined a national wave of states naming it an official folk dance."
  - question: Is square dance the same in every state?
    answer: "The basic formation and calls are similar nationwide, though regional dance hall traditions like those in Texas's Hill Country shaped how often and where it was danced."

