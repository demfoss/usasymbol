- id: facts
  icon: fa-solid fa-lightbulb
  title: Guadalupe Bass Facts
  facts:
  - Adopted in 1989 by the Texas Legislature.
  - Scientific name is Micropterus treculii.
  - Found in the wild only in Texas.
  - Belongs to a group of fish called black bass.
  - The record Guadalupe bass weighed 3.71 pounds and was caught in 2014.
faq:
- question: What is Texas's state fish?
  answer: Texas's state fish is the Guadalupe bass, a small green bass that lives only in Texas.
- question: When did Texas adopt the Guadalupe bass?
  answer: The Texas Legislature adopted the Guadalupe bass as the state fish in 1989.
- question: Why did Texas choose the Guadalupe bass?
  answer: It is found nowhere else in the world. Lawmakers also wanted to honor the fish that live in the state's clear freshwater streams.
- question: Who suggested the Guadalupe bass as the state fish?
  answer: A third-grade class at Decatur Intermediate School picked the Guadalupe bass and asked state lawmakers to make it official.
- question: Is the Guadalupe bass in danger?
  answer: Its numbers dropped because streams lost water and because it bred with smallmouth bass that were stocked in its rivers. Biologists in Texas have worked to bring it back.
