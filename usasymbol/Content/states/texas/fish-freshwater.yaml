seo_title: Texas State Fish | Guadalupe Bass
seo_description: The Texas state fish is the Guadalupe bass, adopted in 1989. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/texas/texas-fish-freshwater-hero.webp
hero_image_alt: A green Guadalupe bass with dark diamond-shaped markings along its side and rows of spots on its pale belly.
hero_image_caption: The Guadalupe bass is found only in Texas, in clear Hill Country streams.
intro_text: The Guadalupe bass is the state fish of Texas. It is a small green bass that lives only in clear Central Texas streams, and it became official in 1989. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Texas?
  paragraphs:
  - The Texas Legislature named the Guadalupe bass the official state fish in 1989. Its scientific name is Micropterus treculii.
  - It lives in the wild only in Texas. Texas also has a separate state saltwater fish, the red drum.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Guadalupe Bass
  paragraphs:
  - The Guadalupe bass is a green fish with a slim body. Its color can range from lime to olive.
  - Broken, dark, diamond-shaped marks run along its sides. Spots on its pale belly line up in rows that look like stripes.
  - Its green color reaches lower on the body than on related bass. Its jaw does not reach past the back of its eye, which helps anglers tell it apart from a largemouth bass.
  - It is a small bass. Most are under a foot long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - A third-grade class at Decatur Intermediate School decided Texas needed an official fish. After studying Texas fish, the students picked the Guadalupe bass and asked state lawmakers to adopt it.
  - The Texas Legislature passed a resolution naming it the state fish, and the governor signed it in May 1989.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Texas Chose the Guadalupe Bass
  paragraphs:
  - State lawmakers chose the Guadalupe bass because it is found only in Texas. They also wanted to honor the fish that live in the state's clear freshwater streams.
  - The resolution says the fish's large numbers show how clean Texas streams are.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Guadalupe Bass
  paragraphs:
  - The Guadalupe bass lives in clear, fast-flowing streams and small rivers in the Hill Country of Central Texas.
  - Its native waters are in the San Antonio, Guadalupe, Colorado, and Brazos river systems. The fish is named after the Guadalupe River.
