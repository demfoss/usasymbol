intro_text: "Texas's state native pepper is the chiltepin, adopted in 1997 to recognize a tiny wild chile that grows naturally in the brushland of South Texas. This profile appears in the [list of U.S. state foods](/symbols/vegetables)."

sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Texas's State Native Pepper?"
    paragraphs:
      - "The chiltepin is Texas's official state native pepper, designated by the Texas Legislature in 1997. Unlike the jalapeño, which is farmed, the chiltepin grows wild in the brush country of South Texas and is considered the ancestor of many cultivated chile peppers."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Chiltepin"
    paragraphs:
      - "Chiltepins are tiny, round, extremely hot chile peppers, often no bigger than a pea, that ripen from green to bright red. They grow wild on small shrubs, usually in the shade of larger plants known as nurse trees, and are gathered by hand rather than farmed at large scale."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Chiltepin Became Texas's State Native Pepper"
    paragraphs:
      - "The Texas Legislature designated the chiltepin the official state native pepper in 1997, giving Texas a second official pepper alongside the jalapeño, this one recognizing the state's wild chile."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Chiltepin"
    paragraphs:
      - "Texas chose the chiltepin because it grows wild only in a handful of places in the United States, mostly in the brushland of South Texas, making it a distinctive native plant tied to the region's ecology and traditional foraging."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Chiltepin Comes From in Texas"
    paragraphs:
      - "Wild chiltepin plants are found in the brush country of South Texas, particularly in areas around the Rio Grande Valley, where they grow beneath the shade of native shrubs and trees."
    sites:
      - name: South Texas Brush Country
        city: McAllen
        lat: 26.2034
        lng: -98.2300
        note: "Native habitat of wild chiltepin peppers"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Chiltepin Facts"
    facts:
      - "Adopted as Texas's state native pepper in 1997."
      - "Chiltepins grow wild in South Texas rather than being farmed at large scale."
      - "The chiltepin is considered an ancestor of many cultivated chile peppers."
      - "Texas also has a separate state pepper, the jalapeño."

