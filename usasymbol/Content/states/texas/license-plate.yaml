seo_title: "Texas License Plate Slogan | The Lone Star State"
seo_description: "The Lone Star State is Texas's current license plate slogan, used on the Texas Classic base introduced in 2012."
hero_image: /images/license-plates/texas/2012-texas-classic.png
hero_image_alt: Texas Classic license plate with The Lone Star State slogan
hero_image_caption: Texas Classic, introduced in July 2012, is the current standard passenger plate base and carries "The Lone Star State" at the bottom.
intro_text: '**"The Lone Star State"** is Texas''s current standard passenger license plate slogan. The phrase first appeared on the 1992 version of the state-flag base and continues on the current **Texas Classic** plate introduced in July 2012. Earlier Texas standard plates used event-specific wording, including "HEMISFAIR" in 1968 and "Sesquicentennial" in 1985-1986. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: 'Texas''s current license plate slogan is "The Lone Star State." It first appeared on the 1992 state-flag passenger base and remains on the Texas Classic base introduced in July 2012. Earlier standard slogans included "HEMISFAIR" in 1968 and "Sesquicentennial" in 1985-1986.'
