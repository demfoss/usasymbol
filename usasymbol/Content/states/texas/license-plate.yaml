sections:
- id: current-texas-classic
  icon: fa-solid fa-id-card
  title: Texas Classic
  paragraphs:
  - Texas introduced the current Texas Classic standard plate in July 2012. It uses black lettering on white reflective sheeting, a seven-character `ABC-1234` style serial, and "The Lone Star State" along the bottom.
  - 'The Texas Classic replaced the 2009-2012 graphic plate with Davis Mountains imagery. The change was not a slogan change: "The Lone Star State" remained, but the plate moved from a scenic look to a simpler law-enforcement-friendly design.'
  - Because Texas has used several graphic bases since 1992, it is easy to overextend older designs. The cowboy-and-space-shuttle base began in 2000, not 1999, and it ended before the current Texas Classic era.

- id: lone-star-meaning
  icon: fa-solid fa-star
  title: What "The Lone Star State" Means
  paragraphs:
  - '"The Lone Star State" points to the single star on the Texas flag and to the independent Republic of Texas period. The phrase was already Texas''s best-known nickname before it became standard plate text.'
  - Texas plates used star graphics long before the full slogan appeared. The words "The Lone Star State" first arrived on the standard passenger base in 1992, after a 1990-1991 state-flag base that had no slogan.
  - The current Texas Classic plate keeps the slogan in a deliberately plain design. After several graphic bases, Texas moved back to a high-contrast black-on-white plate in 2012 while retaining the same identity phrase.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Texas License Plate Slogans by Era
  paragraphs:
  - Texas used special-event slogans before settling on its nickname as the standard passenger plate slogan.
  versions:
  - name: HEMISFAIR
    years: 1968
    image: /images/license-plates/texas/1968-hemisfair.jpg
    description: Texas used "HEMISFAIR" for the 1968 World's Fair in San Antonio, one of the state's earliest event-specific passenger plate slogans.
  - name: Sesquicentennial
    years: 1985-1986
    image: /images/license-plates/texas/1985-sesquicentennial.jpg
    description: The red, white, and blue base commemorated the 150th anniversary of the creation of the Republic of Texas in 1836.
  - name: No slogan / state flag base
    years: 1990-1991
    image: /images/license-plates/texas/1990-flag-no-slogan.jpg
    description: The early state-flag base did not yet carry "The Lone Star State"; that text arrived with the 1992 continuation of the same general design.
  - name: The Lone Star State
    years: 1992-December 28, 1995
    image: /images/license-plates/texas/1992-lone-star-state.jpg
    description: The first Texas standard passenger base to use "The Lone Star State" as plate text.
  - name: 150 Years of Statehood
    years: December 29, 1995-mid 1996
    image: /images/license-plates/texas/1995-150-years-statehood.png
    description: A special standard-issue base marking 150 years since Texas joined the United States. It won ALPCA Plate of the Year for 1995, shared with Pennsylvania.
  - name: The Lone Star State / Space Shuttle base
    years: February 2000-June 2009
    image: /images/license-plates/texas/2000-space-shuttle.png
    description: A graphic base with a cowboy, oil fields, stars, moon, and Space Shuttle. A 2005 revision added larger stars honoring the astronauts killed in the 2003 Space Shuttle Columbia disaster over Texas.
  - name: The Lone Star State / Davis Mountains base
    years: July 2009-June 2012
    image: /images/license-plates/texas/2009-davis-mountains.jpg
    description: Texas's first standard-issue non-embossed passenger plate used a Davis Mountains and sky background while keeping "The Lone Star State."
  - name: The Lone Star State / Texas Classic
    years: July 2012-present
    image: /images/license-plates/texas/2012-texas-classic.png
    description: The current black-on-white Texas Classic plate keeps the slogan but drops the scenic imagery for a simpler, high-contrast design.

- id: event-slogans
  icon: fa-solid fa-calendar-star
  title: HemisFair and Sesquicentennial
  paragraphs:
  - Texas's pre-Lone-Star-State slogans were tied to events rather than permanent identity. "HEMISFAIR" promoted San Antonio's 1968 World's Fair, while "Sesquicentennial" marked the 1836 founding of the Republic of Texas.
  - The 1985-1986 Sesquicentennial plate is especially important because it commemorated the republic, not statehood. The statehood anniversary got its own separate "150 Years of Statehood" plate beginning December 29, 1995.
  - 'That separation matters historically: the Lone Star symbol comes from the republic era, while the statehood anniversary marks Texas joining the United States.'

- id: space-shuttle
  icon: fa-solid fa-rocket
  title: The Space Shuttle Base
  paragraphs:
  - The cowboy-and-space-shuttle plate began in February 2000, not 1999. It paired ranching imagery with Houston's NASA identity and kept "The Lone Star State" as the slogan.
  - The base changed several times. A major 2005 revision added the state flag within the separator, a U.S. flag on the shuttle, and seven larger stars above the shuttle to honor the astronauts lost in the 2003 Columbia disaster.
  - The shuttle-era plate ended before the Texas Classic era. Texas used the Davis Mountains base from July 2009 through June 2012, then introduced the current Texas Classic plate in July 2012.

timeline:
- year: '1968'
  description: Texas uses "HEMISFAIR" on passenger plates for the San Antonio World's Fair.
- year: '1985'
  description: The 1985-1986 Sesquicentennial base commemorates 150 years since the creation of the Republic of Texas.
- year: '1990'
  description: A state-flag-style base appears without "The Lone Star State" text.
- year: '1992'
  description: '"The Lone Star State" first appears as a standard Texas passenger plate slogan.'
- year: '1995'
  description: On December 29, Texas issues the "150 Years of Statehood" plate.
- year: '2000'
  description: 'The Space Shuttle/cowboy graphic base debuts in February with "The Lone Star State."'
- year: '2005'
  description: Texas revises the shuttle base, including seven larger stars honoring the Columbia astronauts.
- year: '2009'
  description: The Davis Mountains non-embossed graphic base replaces the shuttle design in July.
- year: '2012'
  description: Texas introduces the current Texas Classic base in July, retaining "The Lone Star State."

faq:
- question: What is the Texas license plate slogan?
  answer: Texas's current standard passenger plate slogan is "The Lone Star State."
- question: When did Texas first put "The Lone Star State" on license plates?
  answer: Texas first used "The Lone Star State" as standard passenger plate text in 1992.
- question: What is the current Texas license plate base?
  answer: The current standard passenger base is Texas Classic, introduced in July 2012.
- question: Did Texas use "The Lone Star State" before 1992?
  answer: Texas used star symbols earlier, but the full phrase "The Lone Star State" first appeared on the standard passenger base in 1992.
- question: What was the Texas HemisFair license plate?
  answer: It was the 1968 Texas passenger plate slogan promoting HemisFair '68 in San Antonio.
- question: What was the Texas Sesquicentennial plate?
  answer: The 1985-1986 Sesquicentennial plate commemorated the 150th anniversary of the 1836 creation of the Republic of Texas.
- question: When was the Texas space shuttle license plate used?
  answer: The space shuttle/cowboy graphic base began in February 2000 and ran through June 2009, with several serial and design revisions.

