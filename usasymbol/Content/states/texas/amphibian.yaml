intro_text: "Texas's state amphibian is the Texas toad, a stout, sand-loving toad named after the state, adopted in 2009. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Texas?
    paragraphs:
      - "The Texas toad is Texas's official state amphibian, designated by the Texas Legislature in 2009. Its scientific name is Anaxyrus speciosus."
      - "It is a stocky toad common in sandy, dry habitats across much of the state, and it is named directly after Texas."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Texas Toad
    paragraphs:
      - "The Texas toad has dry, warty skin in shades of gray, olive, or brown, usually without a strong pattern, and a stocky, rounded body."
      - "It typically grows to about 2 to 3.5 inches long and has large, oval glands behind its eyes that help protect it from predators."
      - "It burrows into loose, sandy soil during the day and comes out at night, especially after summer rains, to feed and breed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Texas Legislature designated the Texas toad the official state amphibian in 2009, recognizing a species named directly after the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Texas Chose the Texas Toad
    paragraphs:
      - "The Texas toad is named after the state and is common across much of its sandy, dry habitats, making it a natural choice to represent Texas amphibians."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Texas Toad
    paragraphs:
      - "The Texas toad lives in sandy soils and grasslands across central, southern, and western Texas, where it burrows underground during the heat of the day."
    sites:
      - name: Hill Country
        city: Austin
        lat: 30.27
        lng: -97.74
        note: "Sandy, dry habitat common for this species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Texas Toad Facts
    facts:
      - "Adopted in 2009 by the Texas Legislature."
      - "Named directly after the state of Texas."
      - "Grows to about 2 to 3.5 inches long."
      - "Burrows into sandy soil during the day and is active mostly at night."
      - "Breeds in temporary pools that form after heavy summer rains."

