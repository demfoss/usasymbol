sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Texas's State Vegetable?"
    paragraphs:
      - "The sweet onion is Texas's official state vegetable, designated by the Texas Legislature in 1997. Texas sweet onions, often known as 1015 onions, are grown in the Rio Grande Valley and known for their mild, sweet flavor."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sweet Onion"
    paragraphs:
      - "Texas sweet onions are mild, low-sulfur onions with light golden skin, grown through the winter in the warm climate of South Texas. Planting traditionally begins in mid-October, which is how the popular 1015 variety got its name."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sweet Onion Became Texas's State Vegetable"
    paragraphs:
      - "The Texas Legislature designated the sweet onion the official state vegetable in 1997, recognizing a crop already well established in the Rio Grande Valley's winter growing season."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Texas Chose the Sweet Onion"
    paragraphs:
      - "Texas chose the sweet onion because the Rio Grande Valley's mild winters allow farmers to grow a distinctive, low-sulfur onion that has become a well-known Texas crop, sold nationwide each spring."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Sweet Onion Comes From in Texas"
    paragraphs:
      - "Texas sweet onions are grown primarily in the Rio Grande Valley in the far south of the state, where mild winter temperatures allow the crop to be planted in fall and harvested in spring."
    sites:
