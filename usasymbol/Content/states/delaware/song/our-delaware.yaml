sections:
  - id: overview
    icon: fa-solid fa-music
    title: Delaware State Song
    paragraphs:
      - "\"Our Delaware\" is Delaware's official state song, adopted by the General Assembly in 1925. George Beswick Hynson wrote the words as a poem published in 1906, and Will M. S. Brown set them to music that same era."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Our Delaware\" Explained"
    paragraphs:
      - "The song moves county by county across the state, opening with the hills of New Castle before turning to Kent and Sussex in later verses. It is written as an upbeat, march-like tune suited for public and civic occasions."
      - "George Beswick Hynson published the poem in 1906, and Wilmington composer Will M. S. Brown set it to music, publishing it through Brown & Edwards Music Co. A fourth verse, written by Donn Devine for the 1976 United States Bicentennial, later expanded the song's focus from Delaware's geography to broader themes of liberty and freedom."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Our Delaware" Represents Delaware
    paragraphs:
      - "Delaware is made up of only three counties, and the song's structure gives each one its own dedicated verse. That made it easy for residents anywhere in the state to hear their own county named directly in the lyrics."
      - "The song's local Wilmington publishing origins and its straightforward, singable melody helped it circulate through Delaware schools and civic events well before its formal adoption in 1925."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Our Delaware\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Our Delaware" Became Delaware's State Song
    paragraphs:
      - "Hynson published his poem in 1906, and Brown's musical setting followed soon after through a Wilmington publisher. The Delaware General Assembly designated the song official in 1925, and lawmakers added Donn Devine's fourth verse in 1976 to mark the nation's bicentennial without altering the original three county-themed verses."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Our Delaware\" Facts"
    facts:
      - "Delaware adopted \"Our Delaware\" as its official state song in 1925."
      - "George Beswick Hynson published the original poem in 1906."
      - "The song's first three verses each name a different Delaware county."
      - "A fourth verse honoring liberty was added in 1976 for the United States Bicentennial."

