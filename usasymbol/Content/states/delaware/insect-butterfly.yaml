faq:
- question: What is Delaware's state butterfly?
  answer: "Delaware's state butterfly is the eastern tiger swallowtail, adopted by the Delaware General Assembly in 1999."
- question: When did Delaware adopt the eastern tiger swallowtail?
  answer: "Delaware adopted the eastern tiger swallowtail as its official state butterfly on June 10, 1999."
- question: Why did Delaware choose the eastern tiger swallowtail?
  answer: "Students at Richardson Park Learning Center picked three butterfly candidates, and Delaware schoolchildren statewide voted for the eastern tiger swallowtail over the other two."
- question: What does the eastern tiger swallowtail look like?
  answer: "It is a large yellow butterfly with black tiger-like stripes, a black wing border, and narrow tails on the hindwings, with a wingspan of about 3 to 5.5 inches."
- question: Where is the eastern tiger swallowtail found in Delaware?
  answer: "It lives across Delaware, in deciduous woods, along streams and rivers, in wooded swamps, and in towns and cities statewide."

