sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Delaware?
  paragraphs:
  - "The eastern tiger swallowtail, Papilio glaucus, is Delaware's official state butterfly. The Delaware General Assembly designated it in 1999."
  - "It is native to Delaware and lives across the state, a separate symbol from Delaware's state bug, the ladybug."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Eastern Tiger Swallowtail
  paragraphs:
  - "The eastern tiger swallowtail is a large yellow butterfly marked with four black tiger-like stripes on each forewing and a black border along the wing edges. Each hindwing ends in a narrow tail."
  - "Adults have a wingspan of about 3 to 5.5 inches, among the largest butterflies found in Delaware. Some females have a dark, almost black form instead of the typical yellow coloring."
  - "It lives in deciduous woods, along streams and rivers, in wooded swamps, and in towns and cities across Delaware."

- id: history
  icon: fa-solid fa-landmark
  title: How Delaware Chose the Eastern Tiger Swallowtail
  paragraphs:
  - "Students at Richardson Park Learning Center picked three butterfly candidates, and Delaware schools statewide voted to choose among them."
  - "The eastern tiger swallowtail won the vote, with 1,611 of 3,175 participating students choosing it over the other candidates."
  - "The Delaware General Assembly made the tiger swallowtail the official state butterfly on June 10, 1999."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Eastern Tiger Swallowtail Facts
  facts:
  - "Adopted: 1999, by the Delaware General Assembly, following a statewide student vote."
  - "Scientific name: Papilio glaucus."
  - "Wingspan: about 3 to 5.5 inches, with yellow wings, black tiger stripes, and tailed hindwings."
  - "Won a statewide student vote, 1,611 votes to the other two candidates combined out of 3,175 votes cast."
  - "Also the state butterfly or state insect in Alabama, Georgia, South Carolina, and Virginia."




