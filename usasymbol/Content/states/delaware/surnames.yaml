seo:
  title: "Most Common Surnames in Delaware"
  description: "Smith remains the most common last name in Delaware — layered over Welsh Quaker roots, New Sweden colonists, and Wilmington's Black community."

page:
  h1: "Most Common Last Names in Delaware"
  intro: "Few states pack as much name history per square mile as Delaware — the most common last names in Delaware trace to Welsh Quakers, New Sweden colonists, and Wilmington's African American community, all layered into the country's first state."
  heritage_title: "Welsh Quakers, Swedish Colonists, and Wilmington's Working Class"
  heritage_body: "Welsh Quakers settled New Castle County in the late 1600s, seeding surnames like Jones, Davis, and Lewis across northern Delaware. Wilmington's industrial boom drew African American families from Maryland and Virginia, and Swedish colonists from Fort Christina left traces in names like Hendrickson and Rambo still found in the Delaware Valley."
  fun_fact: "The Rambo surname traces to a Swedish colonial family that arrived along the Christina River near present-day Wilmington in 1640, making it one of the few common American surnames with documented New Sweden roots."

