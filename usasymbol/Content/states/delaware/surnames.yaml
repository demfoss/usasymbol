unique_surnames:
  - name: Rambo
    state_rank: 2500
    national_rank: 12000 # UNVERIFIED
    origin: swedish
    why: "Swedish colonists arrived with the New Sweden expedition along the Christina River starting in 1640, and the Rambo family was among the earliest documented settlers. Their descendants spread through New Castle County and adjacent Pennsylvania, keeping the name concentrated in the Delaware Valley."

  - name: Hendrickson
    state_rank: 600
    national_rank: 1500 # UNVERIFIED
    origin: swedish
    why: "Swedish patronymic meaning son of Hendrick, from the New Sweden colony founded at Fort Christina in 1638. Families with this name appear in early New Castle County land records and remained in the Wilmington area for generations."

  - name: Sipple
    state_rank: 3000
    national_rank: 35000 # UNVERIFIED
    origin: german
    why: "German immigrant families with this name settled in Kent County during the 18th century, where the surname stayed locally concentrated and remained rare outside Delaware. It appears in Dover-area church records by the mid-1700s."

  - name: Vandegrift
    state_rank: 4500
    national_rank: 20000 # UNVERIFIED
    origin: dutch
    why: "Dutch colonial families used this name in the Delaware Valley during the early settlement period before English takeover in 1664. It persisted in New Castle County records through the colonial and early national periods."

etymology_groups:
  - type: "English Occupational"
    icon: fa-solid fa-hammer
    description: "Occupational surnames thrived in colonial Delaware's mill towns and port cities. Wilmington's iron foundries, grain mills along the Brandywine, and shipbuilding yards produced generations of Smiths, Millers, and Taylors. Clark reflects the colony's active merchant and legal class centered in New Castle."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Taylor (cloth cutter)
      - Clark (scribe or clerk)

  - type: "Welsh Patronymic"
    icon: fa-solid fa-dove
    description: "Welsh Quakers arrived in New Castle County in the 1680s, establishing tight-knit communities along the Brandywine Creek. Surnames like Jones, Davis, Williams, and Lewis were carried by families from Pembrokeshire and Merioneth and remain concentrated in northern Delaware today."
    examples:
      - Jones (son of John)
      - Davis (son of David)
      - Williams (son of William)
      - Lewis (son of Llywelyn)

  - type: "African American Heritage"
    icon: fa-solid fa-people-group
    description: "Wilmington became a significant destination for African American families from Maryland and Virginia after the Civil War, drawn by the leather, shipbuilding, and textile industries. Names like Johnson, Jackson, and Robinson are heavily concentrated in the city's historically Black neighborhoods."
    examples:
      - Johnson (son of John)
      - Jackson (son of Jack)
      - Robinson (son of Robin)
      - Williams (son of William)

  - type: "Swedish Colonial"
    icon: fa-solid fa-ship
    description: "The New Sweden colony, founded at Fort Christina in 1638, left a small but distinctive surname layer in the Delaware Valley. Patronymics like Anderson and Hendrickson, along with farm-origin names like Rambo, survive in New Castle County records and represent the oldest non-English surname stratum in Delaware."
    examples:
      - Anderson (son of Anders)
      - Hendrickson (son of Hendrick)
      - Rambo (Swedish farm name)

faq:
  - question: "What are the most common last names in Delaware?"
    answer: "The most common last names in Delaware are Smith, Johnson, Williams, Brown, and Jones. The statewide top ranks are led by familiar English and Welsh surnames, especially in northern Delaware."

  - question: "What Delaware surnames reflect Swedish colonial history?"
    answer: "Surnames such as Hendrickson, Anderson, and Rambo point back to the New Sweden colony founded at Fort Christina in 1638. They are not top statewide names, but they remain part of Delaware's oldest non-English surname layer."

  - question: "Why are Welsh surnames so common in Delaware?"
    answer: "Welsh Quakers settled New Castle County in the 1680s, establishing farming and mill communities along the Brandywine Creek. Their surnames — Jones, Davis, Williams, Lewis — remained concentrated in northern Delaware for centuries and still appear among the state's most popular last names."

