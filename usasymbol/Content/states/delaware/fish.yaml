intro_text: Delaware's state fish is the weakfish, a spotted, shiny game fish of Delaware Bay and the Atlantic coast, adopted in 1981. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Delaware?
  paragraphs:
  - The weakfish is Delaware's official state fish. The Delaware Legislature adopted it in 1981.
  - State law names it by its genus, Cynoscion. The weakfish species itself is Cynoscion regalis.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Weakfish
  paragraphs:
  - The weakfish has a dark olive green back. Its back and sides shine with purple, lavender, blue, gold, or copper colors.
  - Many small black, dark green, or bronze spots cover its upper body. The fin on its belly near the tail, called the anal fin, is yellowish.
  - The name comes from its weak mouth. A fishing hook can tear free easily, and the fish can escape.
  - People also call it sea trout or gray trout.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Delaware Legislature made the weakfish the official state fish in 1981.
  - Weakfish were very common in Delaware's coastal waters back then. Local anglers even held a yearly world championship weakfish tournament.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Delaware Chose the Weakfish
  paragraphs:
  - Lawmakers chose the weakfish to honor how much sport fishing helps Delaware's people and economy. They also picked it because it is a good game fish and food fish.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Weakfish
  paragraphs:
  - In Delaware, weakfish live in the Atlantic Ocean, Delaware Bay, and the Inland Bays. Adults usually stay within about ten miles of the shore.
  - Weakfish are much harder to find in Delaware today than they were in 1981. Biologists still track them in Delaware Bay.
