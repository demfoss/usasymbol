- id: facts
  icon: fa-solid fa-lightbulb
  title: Weakfish Facts
  facts:
  - Adopted in 1981 by the Delaware Legislature.
  - Scientific name is Cynoscion regalis.
  - Can grow to about 3 feet long.
  - Named for its weak mouth, which lets hooks tear free.
  - Has many small dark spots and a yellowish anal fin.
faq:
- question: What is Delaware's state fish?
  answer: Delaware's state fish is the weakfish, a spotted saltwater game fish found in Delaware Bay and along the coast.
- question: When did Delaware adopt the Weakfish?
  answer: The Delaware Legislature adopted the weakfish as the state fish in 1981.
- question: Why did Delaware choose the Weakfish?
  answer: Lawmakers wanted to honor the value of sport fishing in Delaware. They chose the weakfish because it is a good game fish and food fish.
- question: Why is it called a weakfish?
  answer: It has a weak mouth. A fishing hook can tear out easily, and the fish can get away.
- question: Is the weakfish common in Delaware today?
  answer: Not anymore. Weakfish were plentiful in 1981, but the state now lists them as uncommon in Delaware waters.
