seo_title: Delaware State Fish | Weakfish
seo_description: The Delaware state fish is the weakfish, adopted in 1981. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/delaware/delaware-fish-hero.webp
hero_image_alt: A silvery weakfish with a dark olive back, small dark spots, and a yellowish fin on its belly.
