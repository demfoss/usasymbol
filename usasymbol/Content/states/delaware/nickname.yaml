author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-16"
seo_title: "Delaware State Nickname | The First State"
seo_description: "Delaware is known as The First State, the official state nickname adopted in 2002. Learn what First State means, why Delaware uses it, and what other nicknames the state has had."

intro_text: "Delaware carries the nickname <i>The First State</i> for an important historical reason. On December 7, 1787, Delaware became the first of the 13 original colonies to ratify the United States Constitution. All thirty delegates at the convention in Dover voted yes without a single opposing vote. The Delaware state nickname became official much later in 2002 when lawmakers approved it following a request from Mrs. Anabelle O'Malley's first-grade class at Mt. Pleasant Elementary School. This title marks Delaware's unique place in forming the American government and is featured in the [state nicknames directory](/symbols/nicknames)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The First State'"
    paragraphs:
      - "The Delaware state nickname refers to ratifying the Constitution. Thirty delegates met in Dover at a place called Battell's Tavern on December 3, 1787. They voted on December 7, 1787. Every single delegate voted yes. The vote was 30 to 0 with no opposition."
      - "Pennsylvania came in second place just five days later on December 12 — a state whose [Keystone State history](/states/pennsylvania/nickname/the-keystone-state) reflects its central role in both the Revolution and the constitutional founding. New Jersey became the third state on December 18. Nine states needed to ratify before the Constitution became law. New Hampshire reached that goal on June 21, 1788, making the Constitution official."
      - "Delaware sent five delegates to write the Constitution in Philadelphia earlier that year. George Read, Gunning Bedford Jr., John Dickinson, Richard Bassett, and Jacob Broom all signed the document in September 1787. Delaware got first position in national events like presidential inaugurations because of this action. December 7 is now celebrated as Delaware Day, a state holiday since 1933, and this date appears on the [Delaware state flag](/states/delaware/flag/delaware-state-flag)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Diamond State"
        text: "Thomas Jefferson gave Delaware this nickname when he called it a jewel among states. He meant Delaware had great value because of where it sits on the East Coast. Delaware Bay provided access to shipping routes and trade. The state flag shows a buff-colored diamond shape holding the state coat of arms. This diamond design reminds people of Jefferson's description, and its palette matches Delaware's [official state colors](/states/delaware/color/colonial-blue-and-buff). Delaware's small size did not stop it from playing a big role in early American commerce and government."
      - subtitle: "Blue Hen State"
        text: "This nickname came from the Revolutionary War. Captain Jonathan Caldwell from Kent County brought fighting chickens with him to battle. These game roosters came from a famous Blue Hen and were known for winning fights. Soldiers entertained themselves by holding cockfights between battles. Delaware troops fought so bravely that other soldiers compared them to these tough fighting birds. The regiments from Kent County became known as Blue Hen's Chickens. Delaware adopted the [Delaware Blue Hen](/states/delaware/bird/delaware-blue-hen) as the official state bird in 1939."
      - subtitle: "Small Wonder"
        text: "Delaware earned this newer nickname because of its size and beauty. The state covers only about 2,500 square miles, making it the second smallest state in America. Despite being tiny, Delaware made huge contributions to the country. More than half of all publicly traded companies in the United States are incorporated in Delaware because of business-friendly laws. The nickname also points to Delaware's natural beauty, including beaches, forests, and farmland. Small Wonder became a way to promote tourism and state pride."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Delaware was the only colony claimed by Sweden, Holland, and England at different times in history."
      - "The original parchment document showing Delaware's ratification is kept at the Delaware Public Archives and ties directly to the [state motto](/states/delaware/motto/liberty-and-independence)."
      - "Delaware's flag shows the date December 7, 1787, below the diamond to mark the ratification day."
      - "Governor E. Paul Burkholder and the Georgetown Rotary Club collected 6,000 signatures to establish Delaware Day in 1933."
      - "All five Delaware delegates signed the Constitution, while only Pennsylvania had more signers with eight delegates."
      - "Over 60 percent of Fortune 500 companies are incorporated in Delaware today."

faq:
  - question: "What is Delaware’s nickname?"
    answer: "Delaware’s nickname is The First State. The name reflects Delaware’s role as the first state to ratify the United States Constitution."

  - question: "Why is Delaware called the First State?"
    answer: "Delaware is called the First State because it was the first of the original thirteen colonies to approve the U.S. Constitution."

  - question: "When did Delaware earn the First State nickname?"
    answer: "Delaware earned the First State nickname in 1787 after becoming the first state to ratify the Constitution."

  - question: "What does the First State nickname mean?"
    answer: "The First State nickname means Delaware played a leading role in the formation of the United States by ratifying the Constitution before any other state."

  - question: "Is The First State Delaware’s official nickname?"
    answer: "Yes, The First State is Delaware’s official and universally recognized state nickname."

