faq:
- question: What is Delaware's official state cocktail?
  answer: The Orange Crush, designated in August 2024.
- question: When did Delaware adopt the Orange Crush as its state cocktail?
  answer: August 2024. The bill passed on the final day of the legislative session and was signed by Governor John Carney at The Starboard in Dewey Beach.
- question: Was the Orange Crush invented in Delaware?
  answer: No. The drink originated in 1995 at Harborside Bar & Grill in Ocean City, Maryland. Delaware's designation rests on the argument that The Starboard in Dewey Beach perfected the recipe — and that the drink became central to Delaware beach culture regardless of where it started.
- question: What is in a Delaware Orange Crush?
  answer: Fresh-squeezed orange juice, orange vodka, triple sec, lemon-lime soda, and crushed ice.
- question: Where did Governor Carney sign the Orange Crush bill?
  answer: At The Starboard in Dewey Beach — not in Dover. The signing happened at the bar the designation was written around.
- question: Who introduced House Bill 444?
  answer: Representative Pete Schwartzkopf, retiring after twenty-two years in the Delaware legislature. It was his final bill.
- question: Does Delaware also have a state drink?
  answer: Yes. Delaware's official state drink is milk, a separate designation. The Orange Crush is specifically the state cocktail.
- question: How popular is the Orange Crush at The Starboard?
  answer: The Starboard in Dewey Beach reportedly sells between 25,000 and 30,000 Orange Crushes per month during the summer season.
