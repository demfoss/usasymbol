seo_title: "Delaware State Cocktail | Orange Crush"
seo_description: "Delaware named the Orange Crush its state cocktail in 2024, claiming beach-drink identity for a beverage invented in Maryland."
intro_text: Delaware's official state cocktail is the <strong>Orange Crush</strong>, designated by <strong>House Bill 444</strong> in <strong>August 2024</strong>. The drink was invented in Maryland — Delaware acknowledged it openly and designated it anyway — because no single bar anywhere sells more of them than The Starboard in Dewey Beach does every summer. Governor John Carney signed it there, not in Dover.
