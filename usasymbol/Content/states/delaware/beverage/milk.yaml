sections:
- id: why-milk
  icon: fa-solid fa-cow
  title: Why Delaware Named Milk Its Official State Drink
  paragraphs:
  - Most people think of Delaware in terms of corporations and tax law. The Delmarva Peninsula — the narrow strip of land Delaware shares with portions of Maryland and Virginia — tells a different story. When the legislature moved to designate a state beverage in 1983, dairy farming was still a visible and economically meaningful part of what Delaware produced.
  - "The choice of milk was not a vague feel-good gesture. It was a signal: that Delaware's rural, working landscape mattered and deserved recognition alongside the state's identity as the incorporation capital of the United States. Milk grounded the state in something tangible and local — something that came from the land rather than from a courthouse."
  - The 1970s and early 1980s saw a wave of milk designations across the country, driven by dairy industry advocates and farm bureaus pushing for official recognition. Delaware's 1983 designation fits that era. What it also reflects is that Delaware's farm community was organized enough, and politically connected enough, to get it done.
- id: delaware-context
  icon: fa-solid fa-map-pin
  title: Dairy Farming on the Delmarva Peninsula
  paragraphs:
  - Agriculture in Delaware has long been dominated by poultry — the state's broiler chicken industry is nationally significant and historically defines Sussex County, the southernmost and most rural of Delaware's three counties. Dairy ran alongside it, concentrated in the north, where farms in New Castle and Kent counties maintained herds and sold milk through Mid-Atlantic regional cooperatives.
  - Delaware's dairy operations were never the scale of the major production states. They were family farms supplying regional markets — not famous, but steady — and their presence shaped the agricultural character of communities that exist well outside Delaware's more visible corporate and coastal identities.
  - By 1983, those farms were already shrinking. The dairy operations that remained were smaller than they had been a generation earlier, and the people running them knew it. The state beverage designation landed in that context — an acknowledgment, from the statehouse, that what was still there was worth naming.
- id: related-drink
  icon: fa-solid fa-umbrella-beach
  title: 'Delaware State Cocktail: Orange Crush'
  paragraphs:
  - In August 2024, Delaware enacted [House Bill 444](https://legis.delaware.gov/json/BillDetail/GenerateHtmlDocument?legislationId=141510&legislationTypeId=1&docTypeId=2&legislationName=HB444), designating Orange Crush as the official state cocktail. The drink — fresh-squeezed orange juice, orange vodka, triple sec, and lemon-lime soda, served over crushed ice — has been a fixture at Delaware beach bars for decades, none more than The Starboard in Dewey Beach.
  - "Milk is the state's agricultural self-image: steady, rural, rooted in what the land produces. Orange Crush is the coastal tourist version — summer, salt air, and a drink that out-of-state visitors associate with a weekend at the shore. Delaware kept both because they are genuinely different, and neither is a substitute for the other. See the full [Orange Crush page](/states/delaware/beverage/orange-crush) for the cocktail's designation history."
timeline:
- year: '1983'
  description: Delaware designates milk as the official state beverage, recognizing the state's dairy farming heritage across New Castle and Kent counties.
- year: '2024'
  description: Delaware enacts House Bill 444 in August 2024, designating Orange Crush as the official state cocktail — a new category that leaves the milk designation intact.
faq:
- question: What is Delaware's official state beverage?
  answer: Delaware's official state beverage is milk, designated in 1983. The state also recognizes Orange Crush as its official state cocktail under a separate 2024 designation.
- question: When did Delaware designate milk as its state beverage?
  answer: Delaware designated milk as its official state beverage in 1983.
- question: Did Orange Crush replace milk as Delaware's state drink?
  answer: No. Orange Crush is Delaware's official state cocktail, designated in August 2024 under House Bill 444. Milk remains the official state beverage. The two titles cover different categories and both remain in effect.
- question: Why did Delaware choose milk as its state beverage?
  answer: The designation recognized Delaware's dairy farming heritage, particularly in New Castle and Kent counties. It also fit a broader early-1980s trend of states adopting milk as an official symbol following advocacy from dairy industries and farm bureaus.
- question: What is Delaware's official state cocktail?
  answer: Orange Crush, designated in August 2024 under House Bill 444. The drink is most closely associated with The Starboard in Dewey Beach, which reportedly sells 25,000–30,000 of them per month in summer.
- question: Does Delaware have both a state beverage and a state cocktail?
  answer: Yes. Milk is the official state beverage (1983) and Orange Crush is the official state cocktail (2024). They are separate designations covering different categories.
