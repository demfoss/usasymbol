seo_title: "Delaware State Beverage | Milk"
seo_description: "Delaware made milk its state beverage in 1983 to reflect dairy farming. Orange Crush later got a separate cocktail title."
intro_text: "Delaware's official state beverage is <strong>milk</strong>, designated in <strong>1983</strong> — and it holds that title today, even after the state added a second, very different official drink. When Delaware recognized [Orange Crush](/states/delaware/beverage/orange-crush) as its official state cocktail in August 2024, milk did not lose anything. The two designations cover different categories: one rooted in the farm counties of the Delmarva Peninsula, the other in the beach bars of Dewey Beach. This profile appears in the [list of U.S. state beverages](/symbols/beverages)."
