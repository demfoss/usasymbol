name_meaning:
  heading: What Does Delaware Mean?
  paragraphs:
  - Delaware is the second-smallest U.S. state and the first to ratify the United States Constitution, on December 7, 1787. Its name comes from the Delaware River and Delaware Bay, which were named for Thomas West, 3rd Baron De La Warr.
  - De La Warr was an English nobleman and colonial governor associated with the early Virginia colony. The state name therefore comes from a title and family name, not from an Indigenous word or a physical description of the land.
  - Delaware's central nickname is the First State, with Diamond State and Blue Hen State adding size, strategy, and Revolutionary War memory. Its postal abbreviation is DE, and residents are Delawareans.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named through the Delaware River and Bay, which honored Thomas West, 3rd Baron De La Warr.
    - label: Name type
      text: A colonial title and family name rather than a geographic description.
    - label: First state claim
      text: Delaware ratified the U.S. Constitution before any other state, on December 7, 1787.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Delaware, the first state to ratify the U.S. Constitution.
    - label: River and bay
      text: The Delaware River and Delaware Bay preserve the older geographic use of the name.
    - label: People
      text: People from Delaware are called Delawareans.
    - label: Tribe name
      text: The Lenape are sometimes called Delaware because English colonists applied the river name to the people living near it.
  - heading: Nicknames and Short Forms
    items:
    - label: The First State
      text: Official nickname tied to Delaware's first ratification of the Constitution.
    - label: The Diamond State
      text: A nickname often linked to Delaware's small size and strategic value.
    - label: Blue Hen State
      text: Refers to Delaware's Revolutionary War Blue Hen nickname tradition.
    - label: Abbreviation
      text: DE; older short form Del.
editorial:
  heading: What Delaware's Symbols Say About the State
  paragraphs:
  - Delaware's [state flag](/states/delaware/flag) is unusually explicit. It puts December 7, 1787 on the design, making the state's first-ratification claim part of the symbol rather than just a classroom fact.
  - The [Blue Hen](/states/delaware/bird) and [Liberty and Independence](/states/delaware/motto) keep Delaware close to Revolutionary-era memory. The bird is not really about ornithology; it is a state nickname and military legend turned into law.
  - "The [peach blossom](/states/delaware/flower), [American holly](/states/delaware/tree), [gray fox](/states/delaware/mammal/gray-fox), and [rescue dog](/states/delaware/mammal/rescue-dog) show a different Delaware: orchards that declined, a holly industry that mattered, classrooms that shaped state symbols, and modern animal-welfare politics."
faq:
- question: What is the Delaware state abbreviation?
  answer: The Delaware postal abbreviation is [DE](/states/delaware/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: What is Delaware's most famous state symbol?
  answer: The [Delaware state flag](/states/delaware/flag) is one of the state's most recognizable symbols because it includes December 7, 1787, the date Delaware became the first state to ratify the U.S. Constitution.
- question: What is Delaware's state bird?
  answer: Delaware's state bird is the [Blue Hen](/states/delaware/bird), a domestic chicken symbol tied to Revolutionary War nickname history.
- question: What is Delaware's state flower?
  answer: Delaware's state flower is the [peach blossom](/states/delaware/flower), adopted in 1895 during the memory of Delaware's important peach industry.
- question: Why is Delaware called the First State?
  answer: Delaware is called the First State because it was the first state to ratify the U.S. Constitution on December 7, 1787. The nickname is covered on the [Delaware nickname](/states/delaware/nickname) page.
- question: How many official state symbols does Delaware have?
  answer: The Delaware hub collects the symbol pages already present on USA Symbol, including the flag, Blue Hen, peach blossom, holly, gray fox, rescue dog, milk, and Orange Crush.
