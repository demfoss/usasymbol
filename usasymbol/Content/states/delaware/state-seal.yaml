sections:
- id: history
  icon: fa-solid fa-landmark
  title: Delaware State Seal History and Origin
  paragraphs:
  - 'Delaware adopted its first state constitution in 1776–1777, separating formally from Pennsylvania and establishing itself as an independent state. The Great Seal was created as part of that founding process and has been used in essentially the same form since 1777, making it one of the oldest continuously used state seals in the country.'
  - "Delaware had already been functioning as a distinct political unit before independence. Under Penn's charter, it was called the Three Lower Counties on Delaware, and its assembly had operated separately from Pennsylvania's since 1704. When independence came, Delaware had the institutional machinery to act quickly. The seal's designer is not documented in surviving records, but the imagery chosen drew directly from what Delaware knew about itself: its river commerce, its farming economy, and its soldiers already at war."
  - "Delaware was the first state to ratify the United States Constitution, doing so unanimously on December 7, 1787. That act of ratification is not depicted on the seal, which predates the Constitution, but it is the event that gave Delaware its nickname, the First State, and the spirit behind the motto \"Liberty and Independence\" was already embedded in the seal's design a decade before."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Delaware State Seal Symbols Mean
  paragraphs:
  - 'Delaware''s seal was designed to represent what Delaware was, not what it aspired to become. The two figures flanking the shield, a Continental soldier and a farmer, are not allegorical. They are descriptions of the actual population of Delaware in 1777: men who farmed and men who fought, often the same men in different seasons. The shield they flank holds the produce of that farming: wheat, corn, and a working ox.'
  - 'The ship above the shield represents Delaware''s economic identity as a river-and-bay colony. The Delaware River was the artery through which agricultural goods reached Philadelphia and the Atlantic trade. Commerce by water was not incidental to Delaware''s economy; it was the mechanism that connected Delaware farms to world markets. Placing the ship above the agricultural shield makes the relationship clear: the farm feeds the ship.'
  - Delaware's seal uses a small set of images to describe an entire society. Each element was chosen because it described something real about Delaware in 1777.
  elements:
  - id: shield
    name: Three-Part Shield
    image: /images/state-seals/delaware/elements/shield.svg
    paragraphs:
    - "The shield at the center of the seal is divided into three sections. The upper left holds a sheaf of wheat, the upper right holds an ear of corn (maize), and the lower section holds an ox. All three represent Delaware's agricultural economy at the time of the seal's creation."
    - "Wheat and corn were the principal cash crops of Delaware farmland. The ox represents the farm labor required to grow them: plowing, hauling, threshing. Together the three images give the shield the character of a working farm inventory rather than a decorative emblem, an intentional plainness that suited the practical character of Delaware's founders."
  - id: continental-soldier
    name: Continental Soldier
    image: /images/state-seals/delaware/elements/soldier.svg
    paragraphs:
    - "A Continental soldier stands to the right of the shield, holding a musket. He represents Delaware's direct participation in the Revolutionary War at the moment the seal was created in 1777. Delaware's Continental Regiment had already served at the Battle of Long Island in 1776, where it earned distinction as one of the best-disciplined units in the Continental Army."
    - "The soldier is not a generic figure of military virtue. He is a specific historical presence: Delaware was at war when this seal was designed, and the soldier on the seal reflects that fact. Placing him as a co-equal supporter of the shield alongside the farmer makes the argument that military service and agricultural labor are the two equal foundations of Delaware's identity."
  - id: farmer
    name: Farmer
    image: /images/state-seals/delaware/elements/farmer.svg
    paragraphs:
    - "A farmer stands to the left of the shield, holding a hoe. He represents the agricultural majority of Delaware's colonial population. The state's economy was built on grain farming, particularly wheat, and the farming communities of the Delaware peninsula supplied both food and recruits to the war effort."
    - "The farmer and the soldier facing each other across the shield establish the seal's core argument: that Delaware is a state built by people who work the land and people who defend it. The two figures are presented as equals, not as master and servant or symbol and allegory."
  - id: ship
    name: Ship Under Sail
    image: /images/state-seals/delaware/elements/ship.svg
    paragraphs:
    - "A ship under full sail appears above the shield. It represents Delaware's commercial identity and its dependence on the Delaware River and Bay as the conduit for trade. The town of New Castle was one of the busiest ports on the Atlantic seaboard in the colonial period, and the Delaware River linked Pennsylvania, Delaware, and New Jersey to Atlantic commerce."
    - "The ship's position above the shield, crowning the agricultural imagery, reflects the economic relationship: Delaware farms produced goods that Delaware ships carried to market. The seal captures the full circuit of the colonial economy in a single image."
  - id: motto
    name: Liberty and Independence
    image: /images/state-seals/delaware/elements/motto.svg
    paragraphs:
    - "\"Liberty and Independence\" is Delaware's state motto, appearing on a banner at the bottom of the seal. It was chosen in 1777 as a plain statement of the political purpose behind Delaware's decision to declare itself a state separate from both Pennsylvania and British authority."
    - 'The motto does not reference specific Delaware history or geography; it names the principles Delaware claimed were worth fighting for. In 1777, with the war ongoing, those words were not rhetorical. They were the reason the seal existed at all.'

- id: facts
  icon: fa-solid fa-lightbulb
  title: Delaware State Seal Facts
  facts:
  - 'Adopted: 1777, when Delaware approved its first state constitution'
  - 'Motto: Liberty and Independence'
  - 'Shield: Three sections — sheaf of wheat, ear of corn, ox — representing agriculture'
  - 'Supporters: Continental soldier (right) and farmer (left)'
  - 'Dates: 1704, 1776, and 1787, marking Delaware''s assembly, independence, and first-state ratification'
  - 'Ship: Represents Delaware River commerce and Atlantic trade'
  - 'Delaware was the first state to ratify the U.S. Constitution, on December 7, 1787'
  - 'The Delaware Continental Regiment was among the most respected units in the Continental Army'

timeline:
- year: '1704'
  description: Delaware's assembly separates from Pennsylvania's and begins operating independently as the Three Lower Counties on Delaware, establishing the political identity that would become a state.
- year: '1776'
  description: Delaware declares independence from Britain and from Pennsylvania, formally constituting itself as a separate state. The Constitutional Convention meets to draft Delaware's first state constitution.
- year: '1777'
  description: Delaware adopts its first state constitution. The Great Seal is created and adopted, incorporating the ship, shield, farmer, soldier, and the motto "Liberty and Independence."
- year: '1787'
  description: Delaware ratifies the United States Constitution unanimously on December 7, becoming the first state to do so and earning the nickname the First State.
- year: '2004'
  description: Delaware updates the dates on the Great Seal to 1704, 1776, and 1787, emphasizing the first General Assembly, independence from Great Britain, and Delaware's ratification of the U.S. Constitution.

faq:
- question: What is on the Delaware state seal?
  answer: Delaware's state seal shows a ship under sail above a three-part shield holding a sheaf of wheat, an ear of corn, and an ox. A farmer stands to the left of the shield and a rifleman or Continental soldier stands to the right. The motto "Liberty and Independence" runs along the bottom, and the dates 1704, 1776, and 1787 appear in the outer ring.
- question: What does the Delaware state seal mean?
  answer: The seal describes Delaware as an agricultural state (wheat, corn, ox, farmer), a trading state (the ship), and a military state (the rifleman or Continental soldier). The dates in the outer ring connect the seal to Delaware's separate assembly, independence from Great Britain, and ratification of the U.S. Constitution as the First State.
- question: When was the Delaware state seal adopted?
  answer: Delaware's state seal was adopted in 1777, when the state approved its first constitution and formally constituted itself as an independent government separate from both Pennsylvania and British authority.
- question: What does the shield on the Delaware seal represent?
  answer: The three-part shield represents Delaware's agricultural economy. The upper left section shows a sheaf of wheat, the upper right shows an ear of corn, and the lower section shows an ox. Together they describe the main crops and farm labor of Delaware's colonial economy.
- question: What does the ship mean on the Delaware state seal?
  answer: The ship under sail represents Delaware's commercial identity and its use of the Delaware River and Bay for trade. Delaware's ports, particularly New Castle, were major points of commerce in the colonial period, and river transport connected Delaware farms to Atlantic markets.
- question: What is the motto on the Delaware state seal?
  answer: The motto on Delaware's seal is "Liberty and Independence," chosen in 1777 as a direct statement of the principles behind Delaware's decision to declare itself a state. It is also Delaware's official state motto.

