hero_image_caption: The Great Seal of Delaware, adopted in 1777. A Continental soldier and a farmer flank a three-part shield; a Blue Hen stands below and a ship sails above.
intro_text: 'Delaware''s state seal is the only one in the country to feature a Blue Hen — a direct reference to the Revolutionary War soldiers who brought fighting gamecocks to camp and earned a reputation for ferocity across the Continental Army. The rest of the design, adopted in 1777, reflects who Delawareans were at that moment: farmers, fighters, and traders on the water.'
