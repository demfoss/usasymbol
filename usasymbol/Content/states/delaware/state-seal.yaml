type: State Seal
state: Delaware
name: Great Seal of Delaware
adopted_year: 1777
is_official: true
meaning: "The Great Seal of Delaware links the state to its defining founding identities: an agricultural colony turned state, a trading community on the Delaware River and Bay, and a military force whose soldiers helped win the Revolution. The shield carries wheat, corn, and an ox to represent farming, while a Continental soldier and a farmer flank it as the two pillars of Delaware life. The ship above the shield represents commerce, and the dates 1704, 1776, and 1787 connect the seal to Delaware's assembly, independence, and First State ratification."
author: USA Symbol Team
date_published: '2026-04-29'
date_modified: '2026-04-29'
seo_title: 'Delaware State Seal | Farmer, Soldier & Symbols'
seo_description: "Delaware's state seal shows a farmer, rifleman, wheat sheaf, ox, and ship, covering agricultural, military, and colonial identity."
hero_image: /images/seals/delaware/seal.webp
hero_image_alt: Great Seal of the State of Delaware, adopted 1777
hero_image_caption: The Great Seal of Delaware, adopted in 1777. A Continental soldier and a farmer flank a three-part shield; a ship sails above, with the motto and historical dates completing the seal.
intro_text: "Delaware's state seal, adopted in 1777 and updated to its current date inscription in 2004, reflects who Delawareans were at the founding moment: farmers, fighters, and traders on the water. Its coat of arms places agriculture, military service, river commerce, and the motto \"Liberty and Independence\" inside the circular Great Seal of the State of Delaware."
timeline_after_section: history

