type: State Seal
state: Delaware
name: Great Seal of Delaware
adopted_year: 1777
is_official: true
meaning: 'The Great Seal of Delaware links the state to its two defining identities: an agricultural colony turned state, and a military force whose soldiers helped win the Revolution. The shield carries wheat, corn, and an ox to represent farming, while a Continental soldier and a farmer flank it as the two pillars of Delaware life. A Blue Hen stands below the shield, recalling the Delaware soldiers of the Revolutionary War who were known across the Continental Army for their fighting spirit.'
author: USA Symbol Team
date_published: '2026-04-29'
date_modified: '2026-04-29'
seo_title: 'Great Seal of Delaware: Blue Hen, Soldier & What Each Element Means'
seo_description: "Why is a Blue Hen on the Delaware state seal? Delaware soldiers in the Revolutionary War were nicknamed the Blue Hens after the fighting cocks they brought to camp. See how the seal's wheat sheaf, ox, farmer, soldier, and ship explain Delaware's founding identity."
