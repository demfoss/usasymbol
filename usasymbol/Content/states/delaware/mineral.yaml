faq:
  - question: What is Delaware's state mineral?
    answer: "Delaware's state mineral is sillimanite, a grayish-white to brown aluminum silicate mineral adopted in 1977."
  - question: When did Delaware adopt sillimanite as its state mineral?
    answer: "The Delaware General Assembly designated sillimanite the official state mineral in 1977."
  - question: Why did Delaware choose sillimanite?
    answer: "The Delaware Mineralogical Society proposed the mineral because of the large, unusually pure sillimanite boulders found at Brandywine Springs, documented in mineralogical references since the 1890s."
  - question: Where can you find sillimanite in Delaware?
    answer: "Brandywine Springs State Park in New Castle County is Delaware's best-known site, where sillimanite occurs as large, stream-rounded boulders."

