intro_text: "Delaware's state mineral is sillimanite, adopted in 1977 to recognize the large, unusually pure boulders of the mineral found at Brandywine Springs, a locality mineralogists have documented since the 1890s. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Delaware State Mineral
    paragraphs:
      - "Sillimanite is Delaware's official state mineral, designated by the Delaware General Assembly in 1977 at the request of the Delaware Mineralogical Society. It is an aluminum silicate mineral common in the metamorphic rock of the Delaware Piedmont, in the northern part of the state."
      - "Delaware was chosen for this designation because of a single well-known site, Brandywine Springs, where sillimanite occurs as boulders unusually large and pure for the mineral."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Sillimanite?"
    paragraphs:
      - "Sillimanite is an aluminum silicate mineral that typically appears grayish white to brown, often forming fibrous, needle-like crystals that give it a silky sheen. Its fibrous form, sometimes called fibrolite, can resemble the grain of wood."
      - "Sillimanite is one of three minerals that share the same chemical formula but have different crystal structures, along with kyanite and andalusite; it forms under the highest temperatures of the three. In Delaware, it grows within metamorphic rocks like schist and gneiss that were once buried deep enough to reach those conditions."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Delaware Chose Sillimanite as Its State Mineral"
    paragraphs:
      - "Sillimanite is common in the metamorphic rocks of the Delaware Piedmont, but the boulders found at Brandywine Springs stand out for their size and purity. Mineralogists recognized the site's significance as early as the 1892 edition of Dana's System of Mineralogy, a standard mineralogical reference of the era."
      - "The Delaware Mineralogical Society proposed the designation, giving the state a mineral tied to a documented, scientifically notable locality rather than a broad regional occurrence. Lawmakers adopted the proposal in 1977."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Sillimanite Became Delaware's State Mineral"
    paragraphs:
      - "The Delaware General Assembly designated sillimanite the official state mineral in 1977, acting on a proposal from the Delaware Mineralogical Society that highlighted the Brandywine Springs boulders."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Sillimanite Is Found in Delaware"
    paragraphs:
      - "Brandywine Springs State Park, in New Castle County, is Delaware's best-known sillimanite locality, where the mineral occurs as large, stream-rounded boulders. Sillimanite also occurs more broadly across the metamorphic rocks of the Delaware Piedmont in the state's northern hills."
    sites:
      - name: Brandywine Springs State Park
        city: Wilmington
        lat: 39.7509
