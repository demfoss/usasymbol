        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sillimanite Facts"
    facts:
      - "Adopted as Delaware's state mineral in 1977."
      - "The Delaware Mineralogical Society proposed the designation to the state legislature."
      - "Sillimanite boulders at Brandywine Springs were documented in mineralogical literature as far back as 1892."
      - "Sillimanite shares its chemical formula, Al2SiO5, with two other minerals, kyanite and andalusite, that form under different temperature and pressure conditions."

