sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Delaware's State Fruit?"
    paragraphs:
      - "The strawberry is Delaware's official state fruit, designated by the Delaware General Assembly in 2010. Strawberries have a long farming history in the state, especially around Selbyville in Sussex County."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Strawberry"
    paragraphs:
      - "Strawberries are small red fruits with seeds on the outside of their flesh, grown on low plants. In Delaware they ripen in late spring, and are grown both on farms and in home gardens across the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Strawberry Became Delaware's State Fruit"
    paragraphs:
      - "The Delaware General Assembly designated the strawberry the official state fruit in 2010."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Delaware Chose the Strawberry"
    paragraphs:
      - "In the early 1900s, Selbyville in Sussex County was known as a major strawberry shipping center, and the town still holds an annual Strawberry Festival that traces back to that farming history."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Strawberry Comes From in Delaware"
    paragraphs:
      - "Selbyville, in Sussex County, was historically a key strawberry shipping hub and continues to celebrate the crop with its annual Strawberry Festival."
