name: Greenwich Soil Series
adopted_year: 2000
is_official: true
meaning: "Greenwich soil formed in two layers from two different sources. The top layer came from wind and water carrying fine silt across the coastal plain — that silt-rich layer catches water, holds nutrients, and gives crops a firm, workable surface. Below it is older, coarser sandy marine sediment that drains freely and lets roots reach deep. That combination — a fine-textured surface over well-drained sandy subsoil — makes Greenwich loam one of the most productive soils on the Delmarva Peninsula."
meaning_title: Why Greenwich Soil Is So Productive
meaning_after_section: history
