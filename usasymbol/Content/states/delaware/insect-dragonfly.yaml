faq:
- question: What is Delaware's state dragonfly?
  answer: "Delaware's state dragonfly is the blue dasher, adopted by the Delaware General Assembly in 2025."
- question: When did Delaware adopt the blue dasher?
  answer: "Delaware adopted the blue dasher as its official state dragonfly in 2025, its newest official insect symbol."
- question: Why did Delaware choose the blue dasher?
  answer: "Nearly 900 Delaware students took part in the State of Delaware Dragonfly Project, an essay and art contest launched by Senator Stephanie Hansen, and voted for the blue dasher over other dragonfly species."
- question: What does the blue dasher look like?
  answer: "Mature males have a powdery, pale blue abdomen, green eyes, and a black-and-yellow striped thorax. Females and young males are mostly brown and yellow."
- question: Where is the blue dasher found in Delaware?
  answer: "It lives near almost any still or slow-moving water in Delaware, including ponds, lakes, marshes, and ditches."

