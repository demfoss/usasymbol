sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Dragonfly of Delaware?
  paragraphs:
  - "The blue dasher, Pachydiplax longipennis, is Delaware's official state dragonfly. The Delaware General Assembly designated it in 2025."
  - "It is Delaware's newest insect symbol, joining the state bug, state butterfly, and state macroinvertebrate."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Blue Dasher
  paragraphs:
  - "Mature male blue dashers develop a powdery, pale blue abdomen and bright green eyes, with a black-and-yellow striped thorax visible underneath."
  - "Females and young males are mostly brown and yellow with pale stripes and lack the blue coloring."
  - "The blue dasher is one of the most common and widespread dragonflies in North America, and it is known for perching with its wings angled forward and down, unlike many other dragonflies."

- id: history
  icon: fa-solid fa-landmark
  title: How Delaware Chose the Blue Dasher
  paragraphs:
  - "State Senator Stephanie Hansen launched the State of Delaware Dragonfly Project in 2025, inviting students across the state to take part in an essay and art contest about Delaware's dragonflies."
  - "Nearly 900 students took part, and students and teachers then voted for their favorite species."
  - "The blue dasher won the vote, and the Delaware General Assembly made it the official state dragonfly in 2025."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Blue Dasher in Delaware
  paragraphs:
  - "Blue dashers live near almost any still or slow-moving water, including ponds, lakes, marshes, and ditches, across Delaware."
  - "Males are territorial and are often seen chasing other males in short aerial battles over open water during the warmer months."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Blue Dasher Facts
  facts:
  - "Adopted: 2025, by the Delaware General Assembly, after a statewide student vote."
  - "Scientific name: Pachydiplax longipennis."
  - "Mature males have a powdery blue abdomen and green eyes; females and young males are brown and yellow."
  - "Chosen through the State of Delaware Dragonfly Project, an essay and art contest that drew nearly 900 student participants."
  - "One of the most common and widespread dragonflies in North America, found near almost any still or slow-moving water."




