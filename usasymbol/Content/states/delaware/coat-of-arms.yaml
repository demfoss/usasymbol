type: State Coat of Arms
state: Delaware
name: Delaware State Coat of Arms
adopted_year: 1777
is_official: true
meaning: "The Delaware coat of arms places the two foundations of the state's early economy on a single shield: a sailing ship for commerce on the Delaware River and Bay, and an ox with sheaves of wheat for the farmland that fed the colony. A farmer and a soldier stand on either side, holding the shield between them. The motto Liberty and Independence names the principle that led Delaware to become the first state to ratify the United States Constitution, on December 7, 1787."
meaning_title: Meaning of the Delaware Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Delaware Coat of Arms: Meaning, Symbols and History'
seo_description: "The Delaware coat of arms was adopted in 1777 and shows a ship, an ox, and wheat, with a farmer and soldier and the motto Liberty and Independence."
hero_image: /images/coats-of-arms/delaware/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Delaware, showing a shield with a sailing ship, an ox, and sheaves of wheat, supported by a farmer and a soldier, with the motto Liberty and Independence below
hero_image_caption: The Delaware Coat of Arms. The shield shows a sailing ship at the top, an ox at the lower left, and sheaves of wheat at the lower right. A farmer stands on the left side and a soldier on the right. The motto Liberty and Independence appears on a scroll below.
intro_text: "The Delaware coat of arms was adopted in 1777, when Delaware's first state legislature convened under the new state constitution. The shield shows a sailing ship, an ox, and sheaves of wheat, held by a farmer on one side and a soldier on the other, above the motto Liberty and Independence."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Delaware Coat of Arms?
  paragraphs:
  - "The Delaware coat of arms is the central design of the state seal and appears on official documents, government buildings, and publications across Delaware. It is a traditional heraldic design with a shield, two human supporters, and a motto scroll below."
  - "The shield is divided into three sections showing a ship, an ox, and wheat. A farmer stands to the left of the shield and a soldier to the right, each one holding it up. Below runs the motto Liberty and Independence. The design reflects Delaware in its founding years: a small state with agricultural roots, an active coastline, and a colony that fought for independence."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Delaware Coat of Arms
  paragraphs:
  - "Delaware's history as a distinct political unit began in 1704, when the three lower counties on the Delaware River, which had been part of Pennsylvania under William Penn's proprietorship, were granted their own assembly. This gave what would become Delaware a separate legislative identity nearly seventy years before independence."
  - "Delaware adopted its first state constitution on September 20, 1776, shortly after the Declaration of Independence. The new General Assembly, which convened in 1777, established the coat of arms as part of the state's official identity. The design it chose reflected the two industries that defined Delaware: farming on its fertile coastal plain and trade along the Delaware River and Bay."
  - "Delaware became the first state to ratify the United States Constitution on December 7, 1787. That date earned Delaware the permanent nickname the First State, and it appears on the state flag surrounding the coat of arms. The coat of arms itself has retained its core symbols since the founding era, though the artwork has been refined over time."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Delaware Coat of Arms
  paragraphs:
  - "The Delaware coat of arms uses symbols drawn from the state's founding economy and its role in the American Revolution, arranged around a shield with two human figures standing on either side."
  elements:
  - id: ship
    name: Sailing Ship
    image: /images/coats-of-arms/delaware/elements/ship.svg
    paragraphs:
    - "A sailing ship appears in the upper section of the shield. Delaware's location along the Delaware River and Delaware Bay made maritime trade central to the colony's economy. Ships carried goods from inland farms to Philadelphia and to ports along the Atlantic coast."
    - "The ship on the coat of arms records this connection between Delaware's land and the water that gave the state its access to markets and the wider world."
  - id: ox
    name: Ox
    image: /images/coats-of-arms/delaware/elements/ox.svg
    paragraphs:
    - "An ox appears in the lower left section of the shield. In colonial Delaware, oxen were essential to farm labor: they pulled plows, hauled timber, and did the heavy work that made agricultural production possible on the coastal plain."
    - "Delaware's economy in the colonial and early national period was built primarily on farming, and the ox on the coat of arms represents that agricultural foundation."
  - id: wheat
    name: Sheaves of Wheat
    image: /images/coats-of-arms/delaware/elements/wheat.svg
    paragraphs:
    - "Sheaves of wheat appear in the lower right section of the shield. Wheat was one of Delaware's principal crops in the colonial era. Delaware's coastal plain soil and mild climate made it productive farmland, and grain was a major export through the port of Wilmington."
  - id: farmer
    name: The Farmer
    image: /images/coats-of-arms/delaware/elements/farmer.svg
    paragraphs:
    - "A farmer stands to the left of the shield, holding it up as a supporter. He represents the agricultural workers who formed the majority of Delaware's colonial population. Delaware's economy depended on its farms, and the farmer's place beside the shield gives agriculture equal standing with the military figure on the other side."
  - id: soldier
    name: The Soldier
    image: /images/coats-of-arms/delaware/elements/soldier.svg
    paragraphs:
    - "A soldier, shown as a Continental soldier or militiaman, stands to the right of the shield. He represents Delaware's service in the Revolutionary War. Delaware's troops, known as the Delaware Regiment, fought in major engagements of the Revolutionary War and were known for their discipline and effectiveness."
  - id: motto
    name: Liberty and Independence
    image: /images/coats-of-arms/delaware/elements/motto.svg
    paragraphs:
    - "The motto Liberty and Independence appears on a scroll beneath the shield. It is Delaware's state motto and expresses the founding principle behind both the Declaration of Independence and the decision to become the first state to ratify the United States Constitution."
    - "The motto is in English rather than Latin, which was unusual for state mottoes of the era. The choice made the founding idea accessible and direct."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Delaware Coat of Arms
  paragraphs:
  - "The coat of arms describes Delaware in two registers. The shield and its symbols capture what Delaware was economically: a farming colony that used the river to trade. The farmer and soldier standing on either side capture what Delaware did: it grew its food and fought for its independence."
  - "Together the six elements make a compact argument. Delaware was a small state, one of the smallest in the Union, but it placed its values directly on its coat of arms: the labor of farming, the trade of ships, the sacrifice of soldiers, and the liberty those sacrifices were meant to protect."
  - "The motto Liberty and Independence closes the design with the reason for all of it. Delaware was the first state to ratify the Constitution on December 7, 1787, making those two words not just an aspiration but an accomplished fact at the moment the coat of arms was in use."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Delaware Coat of Arms Facts
  facts:
  - "Adopted: 1777 by Delaware's first state legislature under the state's first constitution, adopted September 20, 1776."
  - "Delaware was the first state to ratify the United States Constitution, on December 7, 1787, earning the permanent nickname the First State."
  - "The Delaware Regiment, represented by the soldier on the coat of arms, was one of the most effective Continental Army units of the Revolutionary War and fought at the Battle of Long Island in August 1776."
  - "The motto Liberty and Independence is written in English rather than Latin, making it one of the few state mottoes of the era to use plain English."
  - "Delaware is the second smallest state by area but was the first in the Union, and its coat of arms reflects that founding identity: small in land, first in principle."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Delaware Coat of Arms
  paragraphs:
  - "The core symbols of the Delaware coat of arms, the ship, the ox, the wheat, the farmer, the soldier, and the motto Liberty and Independence, have been part of the design since the founding era. The artwork has been refined by engravers and seal-makers over the centuries, but no official redesign has changed the main elements or their meaning."
