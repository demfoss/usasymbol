sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Delaware's State Herb?"
    paragraphs:
      - "Sweet goldenrod, Solidago odora, is Delaware's official state herb, designated by the Delaware General Assembly in 1996. It grows wild across Delaware's fields, meadows, and woodland edges."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Sweet Goldenrod"
    paragraphs:
      - "Sweet goldenrod is a tall, native wildflower with clusters of small yellow blooms that appear in late summer and fall. Its narrow leaves release a sweet, anise-like scent when crushed, which is where the plant gets its common name. Colonists and Native Americans both used the dried leaves to brew an herbal tea."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Sweet Goldenrod Became Delaware's State Herb"
    paragraphs:
      - "The Delaware General Assembly designated sweet goldenrod the official state herb in 1996, recognizing a native plant with a long history of local use."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Delaware Chose Sweet Goldenrod"
    paragraphs:
      - "Sweet goldenrod grows throughout Delaware and has a documented history as a local tea herb, including a legend that colonists brewed it as a substitute after the Boston Tea Party made imported tea unpopular. State lawmakers did not record additional reasoning beyond the plant's native status and local history."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sweet Goldenrod Facts"
    facts:
      - "Adopted as Delaware's state herb in 1996."
      - "Its scientific name is Solidago odora."
      - "The crushed leaves smell like licorice or anise."
      - "It blooms with small yellow flowers in late summer and fall."

