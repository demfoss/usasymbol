sections:
  - id: "official-designation"
    icon: "fa-scroll"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Delaware designated the rescue dog as the official state dog on May 30, 2023, when Governor John Carney signed Senate Bill 37 at Humane Animal Partners' Wilmington campus. The legislation amended Title 29 of the Delaware Code, replacing the golden retriever that had held the position since 2016."
      - "Senator Jack Walsh sponsored the bill alongside State Representative Bryan Shupe. The Senate passed it unanimously with a 21-0 vote, and the House followed with 36 yes votes and 5 absences. Government officials gathered at the signing ceremony alongside representatives from animal welfare organizations across the state."
    
    subsections:
      - subtitle: "A Second Chance for Permanence"
        text: "Delaware had briefly designated the rescue dog as state dog once before. In 2019, Representative Bryan Shupe introduced legislation that made the rescue dog the official symbol for one year only. That temporary designation expired without renewal by the House of Representatives. Four years later, Senator Walsh brought the proposal back with the goal of making it permanent. The 2023 legislation succeeded where the earlier attempt had not, establishing the rescue dog as Delaware's state canine without an expiration date."
      
      - subtitle: "Why Delaware Chose Homeless Animals"
        text: "Delaware selected the rescue dog to recognize the state's animal welfare achievements and send a clear message about adoption. Senator Walsh explained that Delaware shelters take in thousands of pets each year waiting for permanent homes. By elevating rescue dogs to official state symbol status, lawmakers reinforced Delaware's support for animal welfare and commitment to ensuring rescued pets receive care, love, and protection from abuse. The designation was timed to coincide with Delaware's fourth anniversary as America's first and only no-kill state, achieved in 2019."

  - id: "state-symbolism"
    icon: "fa-heart"
    title: "What the Rescue Dog Represents"
    style: "highlight"
    paragraphs:
      - "The rescue dog embodies second chances and Delaware's belief that every animal deserves a home. As a symbol, it represents not a single breed but thousands of individual dogs from every background, age, size, and temperament that arrive at Delaware shelters each year seeking safety and families, complementing wildlife symbols like [the Delaware gray fox](/states/delaware/mammal/gray-fox)."
      - "Delaware earned its nickname The First State by ratifying the U.S. Constitution first on December 7, 1787. In 2019, Delaware became the first state in American history where every animal shelter achieved no-kill status. The rescue dog designation connects these two moments of leadership, showing Delaware's willingness to set examples others will follow across all areas of the [Delaware borders profile](/states/delaware/borders)."
      - "The symbol carries practical weight beyond ceremony. Governor Carney noted that it sends a message to shelter workers and potential adopters that rescue work matters in Delaware. Patrick Carroll, CEO of Humane Animal Partners, said the recognition helps save rescue animals by drawing attention to adoption as the path forward and aligns with the civic language in [Delaware's state motto](/states/delaware/motto/liberty-and-independence)."
    
    subsections:
      - subtitle: "The First No-Kill State in America"
        text: "Delaware achieved national recognition in August 2019 when Best Friends Animal Society announced it as the first state where all shelters reached a 90 percent save rate. Between 2017 and 2018, Delaware shelters took in more than 12,700 animals and saved over 11,800. This milestone came after years of coordinated effort between state government, private shelters, and community members. The Delaware Office of Animal Welfare consolidated animal control at the state level in 2016, awarding Brandywine Valley SPCA a five-year statewide animal services contract. That decision proved transformative, as Brandywine Valley SPCA sustained no-kill lifesaving each year while managing 60 percent of the state's shelter intake."
      
      - subtitle: "From Death Row to State Symbol"
        text: "Most states select wild animals native to their region as official symbols. Delaware broke this pattern by choosing animals that humans had failed and abandoned. Every rescue dog carries a story of neglect, abuse, economic hardship, or simple bad luck that landed it in a shelter. By making these animals the state symbol, Delaware acknowledged past failures while committing to better outcomes. The designation transforms rescue dogs from charity cases into representatives of state values, shifting the narrative from pity to pride."
      
      - subtitle: "One Symbol, Countless Faces"
        text: "Unlike specific state animals such as the blue hen chicken or gray fox, the rescue dog has no fixed appearance, breed, or behavior profile. A rescue dog might be a senior beagle surrendered when its owner moved, a pit bull puppy born in a shelter, or a poodle mix saved from a hoarding situation. This diversity makes the symbol unusually inclusive. Every rescue dog adopted in Delaware can claim to represent the state, giving thousands of families direct connection to an official emblem. The symbol celebrates individual stories rather than species characteristics."
      
      - subtitle: "Shelter Anniversary and Symbol Timing"
        text: "The 2023 designation coincided with the 150th anniversary of Humane Animal Partners, the organization that hosted the bill signing. Delaware SPCA, founded in 1873, and Delaware Humane Association merged in 2022 to form Humane Animal Partners after years of collaboration. This 150-year history of animal protection provided context for the rescue dog symbol. Delaware's choice honored not just the animals but also the generations of people who worked in shelters, fostered pets, and built the infrastructure that made no-kill status possible."
      
      - subtitle: "Adopt Don't Shop as State Policy"
        text: "The rescue dog designation made Delaware one of six states to recognize shelter or rescue animals as official state representatives. Colorado designated rescue dogs and cats as its state pet in 2013, followed by Tennessee in 2014, California in 2015, Illinois in 2017, and Georgia in 2018. These states share Delaware's goal of influencing more adoptions and reducing demand for puppy mills. The designation creates a permanent reminder in state law that adoption deserves equal standing with purchasing from breeders. Delaware codified a moral choice into civic identity."
      
      - subtitle: "A Pattern of Student-Driven Symbols"
        text: "Delaware has a tradition of letting young people shape state identity. In 2010, fourth graders at Joseph M. McVey Elementary School successfully campaigned to make the gray fox Delaware's state wildlife animal through a persuasive writing project. Students argued that the fox's year-round activity reflected readiness like soldiers at Dover Air Force Base. The rescue dog followed this pattern, with schoolchildren formally requesting the legislature act. This civic education model gives Delaware students ownership of their state's symbols and demonstrates that their voices influence law."

  - id: "identification"
    icon: "fa-paw"
    title: "What Is a Rescue Dog?"
    style: "default"
    
    subsections:
      - subtitle: "Definition and Scope"
        text: "A rescue dog is any dog adopted from an animal shelter, rescue organization, or foster network rather than purchased from a breeder or pet store. The term includes dogs of all breeds, mixed breeds, ages, sizes, and backgrounds. Some rescue dogs are purebred animals surrendered by owners, while others are mixed breeds born in shelters or found as strays."
      
      - subtitle: "Where Rescue Dogs Come From"
        text: "Dogs enter Delaware shelters through multiple pathways. Owner surrenders account for many, occurring when families face housing changes, financial hardship, allergies, or behavioral challenges they cannot manage. Stray dogs picked up by animal control make up another large category. Some dogs arrive from cruelty or neglect cases investigated by humane law enforcement. Others come from hoarding situations, puppy mill seizures, or natural disasters. Delaware also accepts transport dogs from overcrowded Southern shelters where euthanasia rates remain high."
        list_items:
          - "**Owner surrenders**: Dogs given up due to moving, financial problems, or behavior issues"
          - "**Strays**: Dogs found wandering without identification or owners"
          - "**Cruelty cases**: Animals seized from abusive or neglectful situations"
          - "**Transfers**: Dogs transported from high-kill shelters in other states"

  - id: "in-the-state"
    icon: "fa-map-marker-alt"
    title: "Rescue Dogs in Delaware"
    style: "default"
    
    paragraphs:
      - "Delaware shelters and rescue organizations take in thousands of dogs annually across all three counties. The state's small geographic size allows multiple organizations to coordinate effectively, sharing resources and animals to maintain the 90 percent save rate required for no-kill status."
      - "Brandywine Valley SPCA handles the largest volume, managing over 60 percent of Delaware's shelter intake with locations in multiple counties. Humane Animal Partners operates three campuses in Wilmington, Stanton/Christiana, and Rehoboth Beach. Smaller rescue organizations fill specialized roles, with some focusing on particular breeds, medical cases, or behavioral rehabilitation."
    
    facts:
      - "**Statewide intake**: 12,000-13,000 animals enter Delaware shelters annually"
      - "**Save rate**: 93%+ achieved consistently since 2019"
      - "**Brandywine Valley SPCA**: 14,000+ animals per year, 95% save rate"
      - "**Humane Animal Partners**: Three locations serving all Delaware counties"

  - id: "where-to-see"
    icon: "fa-home"
    title: "Where to Adopt Delaware's State Dog"
    style: "default"
    
    paragraphs:
      - "Multiple organizations across Delaware offer rescue dogs for adoption. Most allow you to browse available animals online, submit applications, and schedule meet-and-greet appointments. Adoption fees typically range from $100 to $500 depending on age and medical history, covering spay/neuter surgery and age-appropriate vaccinations."
    
    list_items:
      - "**Humane Animal Partners**: Three locations in Wilmington, Stanton/Christiana, and Rehoboth Beach; 150-year history of animal welfare; adopt online at humaneanimalpartners.org"
      - "**Brandywine Valley SPCA**: Open-admission shelter with 95% save rate; hosts mega adoption events throughout the year; locations in multiple counties"
      - "**Faithful Friends Animal Society**: No-kill shelter in Wilmington with sanctuary care for long-term animals; low-cost veterinary clinic and Pet Life Line counseling hotline"
      - "**First State Animal Center & SPCA**: Serving Delaware communities with adoption services and animal welfare programs"
      - "**Grass Roots Rescue**: All-volunteer foster-based rescue; dogs live in foster homes throughout Delaware and parts of Maryland"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Current Status and Animal Welfare"
    style: "default"
    paragraphs:
      - "Delaware maintains its no-kill status five years after achieving the milestone in 2019. The state's 90 percent save rate means that euthanasia occurs only for animals suffering from irredeemable medical conditions or behavioral issues that make them dangerous to rehabilitate. Healthy, adoptable dogs no longer face time limits in Delaware shelters."
      - "The COVID-19 pandemic created temporary disruptions but did not reverse Delaware's progress. Adoption demand increased during lockdowns as families sought companionship, leading to historically low shelter populations in 2020 and 2021. As life normalized, intake numbers returned to pre-pandemic levels while save rates remained consistent above 90 percent."
    
    subsections:
      - subtitle: "Programs Supporting No-Kill Success"
        text: "Delaware shelters employ multiple strategies to maintain high save rates. Mega adoption events held several times annually waive or reduce fees to move large numbers of animals into homes quickly. Trap-neuter-return programs for community cats reduce shelter intake by managing outdoor populations without removal. Low-cost spay/neuter clinics make these procedures affordable for families who might otherwise surrender intact animals. Behavior modification programs help dogs with treatable issues become adoptable. Transport networks move dogs from crowded facilities to ones with space and resources."
      
      - subtitle: "Foster Networks and Community Support"
        text: "Foster families provide critical infrastructure for Delaware's no-kill model. Puppies too young for adoption, dogs recovering from medical treatment, and animals needing behavioral work all require temporary homes. Foster care reduces shelter crowding and improves animals' quality of life while making them more adoptable. Delaware residents can volunteer as foster families through multiple organizations, receiving supplies, veterinary care, and support from shelter staff. Some fosters specialize in particular needs like bottle-feeding neonatal puppies or socializing fearful dogs."
      
      - subtitle: "October as Adopt a Dog Month"
        text: "Delaware's legislature passed Senate Concurrent Resolution 70 in 2016, designating October as Adopt a Dog Month in partnership with the American Society for the Prevention of Cruelty to Animals and American Humane Association. This annual observance preceded the rescue dog's designation as state symbol by seven years, showing Delaware's long-term commitment to promoting adoption. October events across the state highlight adoptable dogs and encourage families to consider rescue animals."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The rescue dog joins Delaware's collection of official symbols that reflect state history, natural resources, and values. Several symbols connect through shared themes of resilience, leadership, and civic participation, including the [Delaware state flag](/states/delaware/flag/delaware-state-flag)."
      - "Delaware's state motto 'Liberty and Independence' takes on new meaning alongside the rescue dog symbol. By designating rescue dogs as the state animal, Delaware extended its founding principles to include animal welfare. Just as the state defended the rights of colonists to self-govern, it now defends the rights of homeless animals to receive care and protection. The motto appears on the Great Seal of Delaware alongside the state's ratification date of December 7, 1787."
    
    subsections:
      - subtitle: "The Gray Fox Connection"
        text: "Delaware designated the gray fox as its state wildlife animal in 2010 after fourth graders at Joseph M. McVey Elementary School mounted a persuasive writing campaign. Students chose the gray fox because it remains active year-round rather than hibernating, comparing this readiness to soldiers at Dover Air Force Base. The rescue dog followed an identical pattern thirteen years later, with schoolchildren requesting the designation. Both symbols demonstrate Delaware's practice of letting young people shape state identity through civic engagement projects. Both also honor animals—one wild, one domestic—as representatives of Delaware character."
        link:
          label: "See Delaware gray fox"
          url: "/states/delaware/mammal/gray-fox"
      
      - subtitle: "The Blue Hen's Fighting Spirit"
        text: "Delaware's state bird, the blue hen chicken, earned its status through Revolutionary War history. Soldiers from Captain Jonathan Caldwell's company brought blue hen chickens known for fighting ability. The men gained the nickname 'Blue Hen's Chickens' because they fought as fiercely as their birds. The rescue dog shares this fighting spirit theme. Dogs in shelters face uncertain futures, yet they persist. Delaware recognized that resilience by making rescue dogs official symbols, just as it honored the blue hens that represented colonial soldiers' determination."
        link:
          label: "See Delaware state bird"
          url: "/states/delaware/bird/delaware-blue-hen"
      
      - subtitle: "First State, First No-Kill State"
        text: "Delaware's nickname 'The First State' commemorates its December 7, 1787 ratification of the U.S. Constitution. Delaware's small size and quick decision-making allowed it to act while larger states debated. The rescue dog designation honors another first: Delaware's 2019 achievement as America's first no-kill state. This parallel reinforces Delaware's identity as a place willing to lead on principle rather than wait for others. Both milestones involved small population and coordinated action enabling swift progress. The rescue dog symbol makes animal welfare part of Delaware's legacy of being first."
        link:
          label: "See Delaware state nickname"
          url: "/states/delaware/nickname/the-first-state"
