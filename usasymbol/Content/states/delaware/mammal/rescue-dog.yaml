faq:
  - question: "What is Delaware's state dog?"
    answer: "Senate Bill 37, signed in 2023, designated the rescue dog as Delaware's official state dog. The symbol covers all dogs adopted from shelters, rescue organizations, or foster networks — any breed, age, or background."
  
  - question: "When was the rescue dog designated as Delaware's state dog?"
    answer: "The rescue dog became Delaware's official state dog on May 30, 2023, when Governor John Carney signed Senate Bill 37 into law. Delaware had briefly designated the rescue dog as state dog in 2019, but that legislation expired after one year."
  
  - question: "Why did Delaware choose the rescue dog as its state animal?"
    answer: "Delaware chose the rescue dog to honor its 2019 achievement as America's first no-kill state and promote animal adoption over purchasing from breeders or pet stores. Senator Jack Walsh explained that Delaware shelters take in thousands of pets annually waiting for homes, and the designation reaffirms Delaware's support for animal welfare and commitment to ensuring rescued pets receive care, love, and protection from abuse."
  
  - question: "What does it mean that Delaware is a no-kill state?"
    answer: "Delaware became the first no-kill state in 2019, meaning every shelter in the state achieves at least a 90 percent save rate for all dogs and cats. Animals are euthanized only for irredeemable medical conditions or dangerous behavioral issues, not to make space for new animals. Delaware maintains a 93 percent save rate statewide."
  
  - question: "What was Delaware's state dog before the rescue dog?"
    answer: "The golden retriever was Delaware's state dog from 2016 to 2023. Senate Bill 37 replaced the golden retriever with the rescue dog as the official state canine."
  
  - question: "Where can I adopt a rescue dog in Delaware?"
    answer: "Multiple organizations offer rescue dogs for adoption across Delaware's three counties. Major adoption centers include Humane Animal Partners (Wilmington, Stanton/Christiana, and Rehoboth Beach), Brandywine Valley SPCA, Faithful Friends Animal Society, First State Animal Center & SPCA, and Grass Roots Rescue. Most allow online browsing and application submission."
  
  - question: "How many rescue dogs are available for adoption in Delaware?"
    answer: "Delaware shelters take in approximately 12,000-13,000 animals (both dogs and cats) annually. With a 93 percent save rate, the vast majority find homes through adoption, fostering, or transfers to rescue partners. Adoptable dogs are available year-round at multiple locations across the state."
  
  - question: "Does the rescue dog appear on Delaware's flag or seal?"
    answer: "No, the rescue dog does not appear on Delaware's flag or Great Seal. The Great Seal features a farmer and soldier standing beside a shield showing Delaware's agricultural and maritime heritage. Delaware's state motto 'Liberty and Independence' appears on the seal, and the rescue dog designation extends those principles to include animal welfare."

