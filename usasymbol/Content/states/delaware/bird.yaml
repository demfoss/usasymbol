seo_title: "Delaware State Bird | Delaware Blue Hen"
seo_description: Delaware's state bird is a domestic chicken. The Blue Hen has nothing to do with ornithology — it's a Revolutionary War nickname that became state law in 1939. Here's what it actually means.
intro_text: Delaware's official state bird is the <strong>Blue Hen</strong>, made official on <strong>April 14, 1939</strong>. The unusual part is that Delaware did not choose a wild bird at all. The symbol is really about history and nickname culture, not about a field-guide species. The phrase <strong>Blue Hen's Chickens</strong> was already part of Delaware's public identity long before it entered state law.
