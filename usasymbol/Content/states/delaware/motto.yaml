seo_title: "Delaware State Motto | Liberty and Independence"
seo_description: "Delaware's state motto is \"Liberty and Independence.\" Adopted in 1777 with the state's first constitution, it appears on the Great Seal of Delaware."

intro_text: "Delaware's state motto is <strong>Liberty and Independence</strong>. Adopted in 1777 when Delaware approved its first state constitution, the phrase was chosen while the Revolutionary War was still being fought — making it a declaration of principle, not a ceremonial phrase."

