title: "Liberty and Independence"
language: "English"
english_translation: ""
adopted_year: 1847

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Delaware State Motto: Liberty and Independence"
seo_description: "Delaware's motto 'Liberty and Independence' wasn't added to the state seal until 1847 — 70 years after the seal was first adopted in 1777. Why did the First State wait so long? The Society of the Cincinnati and a restoration of the seal's original figures explain the timing."

intro_text: "Delaware's official motto is <strong>Liberty and Independence</strong>, added to the Great Seal in 1847 — 70 years after the seal was first adopted on January 17, 1777. Delaware was the first state to ratify the U.S. Constitution (December 7, 1787), yet it operated for decades without a formal motto. When it finally added one, the phrase came from an organization of Revolutionary War veterans, and it arrived alongside the restoration of two figures that had been removed from the seal in 1793."

sections:
  - id: "seventy-years-no-motto"
    icon: "fa-solid fa-hourglass-half"
    title: "Seventy Years Without a Motto"
    paragraphs:
      - "Delaware adopted its Great Seal on January 17, 1777 — during the Revolutionary War. The original design showed a farmer on the left and a rifleman on the right supporting a shield decorated with a wheat sheaf, an ear of corn, and an ox, with a ship sailing above. No motto appeared on this first version."
      - "In 1793, the legislature removed the farmer and rifleman from the seal. Historical records don't explain why. The shield and ship remained. Delaware then operated with an incomplete-looking seal — and still no motto — for another 54 years."
      - "In 1847, the legislature restored both the farmer and the rifleman and added 'Liberty and Independence' on a ribbon beneath the shield. The Society of the Cincinnati, a national organization of descendants of Revolutionary War officers, provided the phrase. The motto, the seal restoration, and the connection to Revolutionary heritage all arrived together."

  - id: "meaning"
    icon: "fa-solid fa-flag"
    title: "Why These Two Words"
    paragraphs:
      - "By 1847, Delaware had been a state for 60 years. The last veterans of the Revolutionary War were dying. The Society of the Cincinnati had been formed in 1783 specifically to preserve the memory of the Continental Army's service. Their suggestion of 'Liberty and Independence' was a deliberate act of historical commemoration — not a description of the present, but a monument to what the founding generation had fought for."
      - "The two words are distinct in meaning. 'Liberty' refers to freedom from arbitrary control — the colonial complaint against British law. 'Independence' refers to the right of self-governance — what the 1776 Declaration established and what Delaware ratified as the first state in 1787. Together they summarize the Revolutionary moment in three syllables each."
      - "Delaware chose English rather than Latin at a time when many states still favored classical phrases. The plainness of the language is itself a statement: these are principles that don't need translation."

  - id: "first-state-and-the-motto"
    icon: "fa-solid fa-landmark"
    title: "First to Ratify, Last to Add a Motto"
    paragraphs:
      - "Delaware ratified the U.S. Constitution unanimously on December 7, 1787, becoming the first state to do so. This is why the state's nickname is 'The First State' and why December 7, 1787, appears on the state flag beneath the coat of arms. The vote was 30-0."
      - "Despite this founding prominence, Delaware didn't add a motto for 60 more years. The 1847 addition came after the state had lived through the post-Revolutionary consolidation period, the early republic, and the beginning of the antebellum era. The Society of Cincinnati's suggestion was almost a retrospective — honoring what the founding generation had built at a moment when that generation was passing from living memory."
      - "Caesar Rodney's famous 1776 ride adds context. Rodney, despite being ill with facial cancer, rode overnight from Dover to Philadelphia to cast Delaware's decisive vote for independence. That act of courageous commitment to liberty was exactly what the 1847 motto was meant to memorialize — not as old history, but as the state's foundational identity."

  - id: "seal-evolution"
    icon: "fa-solid fa-shield-halved"
    title: "How the Seal Changed Around the Motto"
    paragraphs:
      - "The 1847 restoration brought Delaware's seal closer to the 1777 original. Farmer and rifleman returned. The shield's quarters remained: a sheaf of wheat (representing Sussex County), an ear of corn (Kent County), an ox (animal husbandry), and a blue wavy line representing the Delaware River. A ship under sail sits above the shield."
      - "Later changes continued. In 1907, the inscription changed from 'THE DELAWARE STATE' to 'THE STATE OF DELAWARE.' In 2004, the legislature added three dates to the seal: 1704 (when Delaware's first assembly met separately from Pennsylvania), 1776 (independence), and 1787 (constitutional ratification). Delaware Code §29-3-301 describes the current seal."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Delaware State Motto Facts"
    style: "gradient"
    facts:
      - "Delaware's Great Seal was adopted in 1777 — 70 years before the motto was added in 1847."
      - "The farmer and rifleman were removed from the seal in 1793 and restored in 1847 at the same time the motto was added."
      - "Delaware was the first state to ratify the U.S. Constitution — unanimously, 30-0, on December 7, 1787."
      - "The motto was provided by the Society of the Cincinnati, a national organization of Revolutionary War officers' descendants."
      - "Delaware chose English, not Latin, for its motto — unusual for 1847 when Latin was still common in official documents."
      - "In 2004, Delaware added three dates to the seal: 1704, 1776, and 1787."

faq:
  - question: "What is Delaware's state motto?"
    answer: "Delaware's state motto is 'Liberty and Independence.' It was added to the Great Seal in 1847 — 70 years after the seal was first adopted in 1777. Delaware Code §29-3-301 contains the legal description."

  - question: "What does Delaware's motto mean?"
    answer: "'Liberty' refers to freedom from arbitrary control — the central grievance of the Revolutionary War. 'Independence' refers to the right of self-governance — what Delaware voted for first when it ratified the U.S. Constitution unanimously in 1787. Together they summarize the founding era's core principles in plain English."

  - question: "Why did it take 70 years to add a motto to Delaware's seal?"
    answer: "Delaware's 1777 seal had no motto. A 1793 revision removed the farmer and rifleman figures, leaving the seal even more sparse. In 1847, the legislature restored those figures and added 'Liberty and Independence' at the suggestion of the Society of the Cincinnati — an organization dedicated to preserving Revolutionary War memory as the last veterans were dying."

  - question: "Who suggested Delaware's motto?"
    answer: "The Society of the Cincinnati, a national organization founded in 1783 by Continental Army officers and their descendants. The organization's purpose was to preserve the memory of Revolutionary service. When Delaware restored its seal in 1847, the Society provided 'Liberty and Independence' as the appropriate motto text."

  - question: "Is Delaware's motto in English or Latin?"
    answer: "English. In 1847, this was somewhat unusual — many states still used Latin for their mottos. Delaware's choice of plain English reflects the directness of the phrase: 'Liberty and Independence' needs no translation to make its meaning clear."

  - question: "Where does Delaware's motto appear?"
    answer: "On the Great Seal (a ribbon below the shield with the farmer, rifleman, wheat sheaf, corn ear, ox, and ship), on the state flag (below the coat of arms with the date December 7, 1787), and on official documents, government buildings, and driver's licenses."

