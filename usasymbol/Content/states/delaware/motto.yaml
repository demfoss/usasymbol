faq:
  - question: "What is Delaware's state motto?"
    answer: "Delaware's state motto is \"Liberty and Independence.\" It was adopted in 1777 when the state approved its first constitution and created the Great Seal of Delaware."

  - question: "What does \"Liberty and Independence\" mean?"
    answer: "The phrase names the two principles Delaware claimed in 1777. Liberty meant freedom from British rule. Independence had a specific local meaning too: Delaware was separating from Pennsylvania, under whose charter it had operated since 1704."

  - question: "When did Delaware adopt its state motto?"
    answer: "Delaware adopted \"Liberty and Independence\" in 1777, when the General Assembly created the Great Seal of Delaware as part of the state's first constitution."

  - question: "Where does Delaware's motto appear?"
    answer: "The motto appears on a banner at the bottom of the Great Seal of Delaware. The seal shows a Continental soldier and a farmer flanking a shield with wheat, corn, and an ox, with a ship above and the motto below."

