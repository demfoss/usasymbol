sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Alabama's State Fruit?"
    paragraphs:
      - "The blackberry is Alabama's official state fruit, designated by the Alabama Legislature in 2004. Blackberries grow wild across the state, in fields, thickets, and along roadsides."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Blackberry"
    paragraphs:
      - "Blackberries are small, dark purple to black fruits that grow in clusters on thorny bramble canes. In Alabama they ripen in early summer and are commonly picked wild or grown in home gardens."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Blackberry Became Alabama's State Fruit"
    paragraphs:
      - "The Alabama Legislature designated the blackberry the official state fruit in 2004."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Blackberry"
    paragraphs:
      - "Blackberries grow wild throughout Alabama and have long been picked and used in home cooking, from jams and cobblers to pies, making the fruit a familiar part of the state's food traditions."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blackberry Facts"
