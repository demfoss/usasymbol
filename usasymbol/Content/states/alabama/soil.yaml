faq:
- question: What is Alabama's state soil?
  answer: "Alabama's state soil is the Bama series, a deep red-brown soil found on high terraces and uplands across 26 counties in western and central Alabama. The Legislature designated it the official state soil on April 22, 1997."
- question: Why is it called Bama soil?
  answer: "The name Bama comes from Alabama. The series was established in Marion County, Alabama in 1977 and named after the state where it is most common."
- question: What color is Bama soil?
  answer: "The surface layer is very dark grayish brown. Below that is a yellowish brown eluvial layer. The deep subsoil is red to yellowish red — that color comes from iron oxides that built up over thousands of years of weathering in Alabama's warm, wet climate."
- question: Where is Bama soil found in Alabama?
  answer: "Bama soil covers more than 360,000 acres across 26 Alabama counties, mainly in the western and central parts of the state. It sits on high terraces alongside major river systems in the Southern Coastal Plain."
- question: What crops grow in Bama soil?
  answer: "The main crops are cotton and corn. Farmers also grow soybeans, wheat, and pecans. The soil also supports longleaf pine, loblolly pine, and hardwood forests where land is not farmed."
- question: Who chose the Bama soil as Alabama's state soil?
  answer: "The Professional Soil Classifiers Association of Alabama recommended the Bama series at their 1996 annual meeting. The group included soil scientists from Auburn University, Alabama A&M University, the USDA, and the Alabama Cooperative Extension System. The Alabama Legislature made it official in April 1997."
- question: How deep is Bama soil?
  answer: "Bama soil is very deep — the subsoil layer alone extends from about 14 to 74 inches below the surface. The total profile goes well beyond 60 inches without hitting bedrock, which is one reason it is so well suited to farming."

