meaning: "The Bama soil is built from ancient marine and river sediments deposited millions of years ago when the Gulf of Mexico covered much of what is now southern Alabama. Those deep, well-drained layers made Bama soil some of the most productive farmland in the state — the foundation of Alabama's cotton economy and still used today for corn, soybeans, wheat, and pecans."
