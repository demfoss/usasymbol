- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Bama Soil
  paragraphs:
  - "Bama soil supports cultivated crops, pasture, hay, woodland, and most urban uses. The main crops are cotton and corn. Farmers also grow soybeans, wheat, and pecans."
  - "Cotton has the deepest connection to this soil. For most of Alabama's history, the Coastal Plain uplands where Bama soil sits were the heart of the state's cotton economy. The soil's depth and drainage made it reliable farmland even in years of heavy rainfall."
  - "Where land is not farmed, Bama soil supports stands of longleaf pine, loblolly pine, and slash pine, with scattered oak, sweetgum, hickory, and dogwood — the same forest types that covered much of Alabama before European settlement."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Bama Soil Facts
  facts:
  - "Adopted: April 22, 1997, by the Alabama Legislature under Act No. 1997-233."
  - "Coverage: more than 360,000 acres in 26 Alabama counties, mainly in the western and central Coastal Plain."
  - "The Bama series was first established in Marion County, Alabama in 1977 and is managed by the USDA Soil Survey Regional Office in Auburn."
  - "The red color of the subsoil comes from iron oxides — the same compound that makes rust red. Thousands of years of warm, wet weathering concentrated the iron in the lower layers."
  - "Bama soil formed from ancient marine and river sediments deposited when the Gulf of Mexico extended much further north than it does today."
  - "The name Bama comes directly from Alabama — making it one of the few state soils named after the state itself."

