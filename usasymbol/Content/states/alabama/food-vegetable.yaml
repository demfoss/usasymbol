    title: "What Is Alabama's State Vegetable?"
    paragraphs:
      - "The sweet potato is Alabama's official state vegetable, designated by the Alabama Legislature in 2021. It is a root vegetable long grown across the state and the wider American South."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sweet Potato"
    paragraphs:
      - "Sweet potatoes are starchy, orange-fleshed root vegetables grown in warm soil through the summer and harvested in the fall. They are a staple in Southern cooking, baked, mashed, or made into pies."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sweet Potato Became Alabama's State Vegetable"
    paragraphs:
      - "The Alabama Legislature designated the sweet potato the official state vegetable in 2021."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Sweet Potato"
    paragraphs:
      - "Sweet potatoes have been grown across Alabama for generations and remain a staple of home cooking and Southern cuisine, making the crop a familiar and lasting choice for the designation."

