seo_description: "Alabama's state motto is \"Audemus jura nostra defendere,\" a Latin phrase meaning \"We dare defend our rights.\" It was officially adopted on March 14, 1939."

intro_text: "Alabama's state motto is <strong>Audemus jura nostra defendere</strong>, a Latin phrase meaning <em>We dare defend our rights</em>. It was adopted on March 14, 1939, the same day as the Alabama coat of arms, where the motto appears on a scroll beneath the shield. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

