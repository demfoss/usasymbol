sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Alabama State Motto"
    paragraphs:
      - "Alabama's state motto is <strong>Audemus jura nostra defendere</strong>, Latin for <em>We dare defend our rights</em>. The Alabama Legislature adopted it on March 14, 1939, the same day it adopted the state coat of arms."
      - "The motto has an unusual origin. Marie Bankhead Owen of the Alabama Department of Archives and History chose the English wording from a 1781 poem, and a University of Alabama professor translated it into Latin."

  - id: meaning
    icon: "fa-solid fa-language"
    title: "Alabama State Motto Meaning"
    paragraphs:
      - "<em>Audemus</em> means \"we dare,\" the first-person plural of the Latin verb <em>audere</em>, to dare or to be bold. <em>Jura</em> means \"rights.\" <em>Nostra</em> means \"our.\" <em>Defendere</em> means \"to defend.\""
      - "Together the phrase describes a collective act. Not one person, but the people of a state standing together to protect their rights. The wording comes from Sir William Jones's 1781 poem <em>An Ode in Imitation of Alcaeus</em>, in which Jones argued that free people have both the right and the duty to resist unjust authority."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Alabama's State Motto"
    paragraphs:
      - "In 1923, Marie Bankhead Owen, Director of the Alabama Department of Archives and History, contacted B. J. Tieman, a New York heraldry expert, to design a coat of arms for Alabama. Owen chose the motto herself, selecting an English line from Sir William Jones's 1781 poem <em>An Ode in Imitation of Alcaeus</em>. She then asked Professor W. B. Saffold of the University of Alabama to translate it into Latin."
      - "The design, along with the motto, existed without official status for sixteen years. In 1939, Juliet Perry Dixon, wife of Governor Frank Dixon, pushed for the Legislature to act. State representative James Simpson of Jefferson County introduced the bill. Both houses passed it without a single dissenting vote on March 14, 1939."
      - "The 1939 act formally designated <em>Audemus jura nostra defendere</em> as Alabama's official state motto on the same day it adopted the coat of arms. The motto has not changed since."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Audemus jura nostra defendere\" on the Alabama Coat of Arms"
    paragraphs:
      - "The motto appears on a scroll beneath the shield of the Alabama coat of arms. The coat of arms shows a quartered shield with symbols of France, Spain, Great Britain, the Confederacy, and the United States. Two bald eagles flank the shield, and the ship <em>Badine</em> appears above as the crest."
      - "The state seal does not include the motto. Alabama's Great Seal centers on a map of the state with its principal rivers and uses \"Alabama\" and \"Great Seal\" as its border text. The coat of arms is the official emblem where the state motto is displayed."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Alabama State Motto Facts"
    style: "gradient"
    facts:
      - "Motto: Audemus jura nostra defendere — Latin for \"We dare defend our rights.\""
      - "Officially adopted: March 14, 1939 — the same day as the Alabama coat of arms."
      - "The English wording was chosen by Marie Bankhead Owen from a 1781 poem by Sir William Jones."
      - "The Latin translation was made by Professor W. B. Saffold of the University of Alabama."
      - "The motto appears on a scroll beneath the Alabama coat of arms shield, not on the state seal."
      - "The design existed without official legal status from 1923 to 1939 — sixteen years."

