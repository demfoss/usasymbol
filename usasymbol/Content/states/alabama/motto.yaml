timeline:
- year: 1820s–1910s
  description: Alabama's official iconography associates the state with the phrase 'Here We Rest,' drawn from a widely accepted nineteenth-century interpretation of the word 'Alabama' as a Muscogee phrase. The motto appears in state seal contexts but is never codified in law.
- year: '1920'
  description: Marie Bankhead Owen is appointed director of the Alabama Department of Archives and History. She begins a systematic effort to redesign and formalize Alabama's official state symbols, including the coat of arms.
- year: '1923'
  description: A coat of arms bearing Audemus jura nostra defendere is created. Marie Bankhead Owen selects the phrase; W. B. Saffold renders it in Latin. The Latin motto replaces 'Here We Rest' in official heraldic use, shifting Alabama's symbolic posture from passive to assertive.
- year: '1939'
  description: Alabama Legislature officially adopts the coat of arms, giving the motto legal standing under Alabama Code § 1-2-2. The phrase had appeared on official documents for sixteen years before receiving legislative approval.
faq:
- question: What does Audemus jura nostra defendere mean?
  answer: Official Alabama sources interpret the phrase as 'We Dare Maintain Our Rights.' Audemus means 'we dare,' jura nostra means 'our rights,' and defendere means 'to maintain' or 'to defend.' Alabama uses 'maintain' as its official English rendering; many secondary sources use 'defend,' which is a valid translation of the same Latin verb but not the official Alabama wording.
- question: When was Alabama's state motto officially adopted?
  answer: The motto was officially adopted in 1939 when Alabama's Legislature formally approved the state coat of arms. The design bearing the motto dates to around 1923, but the legal adoption came in 1939.
- question: Is the motto on the state seal or the coat of arms?
  answer: The motto belongs to the Alabama coat of arms, not the state seal. The coat of arms is a separate official emblem, and the motto's legal home is the coat of arms statute.
- question: Who chose Alabama's state motto?
  answer: Historical accounts credit Marie Bankhead Owen, then director of the Alabama Department of Archives and History, with selecting the phrase for the coat of arms. W. B. Saffold is credited with translating it into Latin.
