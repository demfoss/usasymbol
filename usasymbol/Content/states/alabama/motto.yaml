faq:
  - question: "What is Alabama's state motto?"
    answer: "Alabama's state motto is \"Audemus jura nostra defendere,\" a Latin phrase meaning \"We dare defend our rights.\" It was officially adopted on March 14, 1939."

  - question: "What does \"Audemus jura nostra defendere\" mean?"
    answer: "The phrase means \"We dare defend our rights\" in Latin. Audemus means \"we dare,\" jura means \"rights,\" nostra means \"our,\" and defendere means \"to defend.\""

  - question: "What is the English translation of Alabama's motto?"
    answer: "The English translation is \"We dare defend our rights.\" The wording was originally chosen in English by Marie Bankhead Owen from a 1781 poem by Sir William Jones, then translated into Latin by Professor W. B. Saffold of the University of Alabama."

  - question: "When did Alabama adopt its state motto?"
    answer: "Alabama officially adopted its state motto on March 14, 1939, the same day the Legislature adopted the state coat of arms."

  - question: "Who wrote Alabama's state motto?"
    answer: "Marie Bankhead Owen, Director of the Alabama Department of Archives and History, selected the English wording from Sir William Jones's 1781 poem. Professor W. B. Saffold of the University of Alabama translated it into Latin."

  - question: "Where does Alabama's motto appear?"
    answer: "The motto appears on a scroll beneath the shield of the Alabama coat of arms. It does not appear on the Alabama state seal, which uses \"Alabama\" and \"Great Seal\" as its border text."

