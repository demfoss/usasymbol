sections:
- id: meaning-translation
  icon: fa-solid fa-language
  title: What Does Audemus Jura Nostra Defendere Mean?
  paragraphs:
  - Official Alabama sources interpret the phrase as **"We Dare Maintain Our Rights."** *Audemus* means "we dare"; *jura nostra* means "our rights"; *defendere* means "to defend" or "to maintain."
  - The Latin word *defendere* carries both senses — active defense and ongoing preservation. Alabama's official interpretation favors "maintain," emphasizing the steady upholding of rights rather than their armed resistance. That choice of wording shapes the whole tone of the motto.
- id: defend-vs-maintain
  icon: fa-solid fa-scale-balanced
  title: '"Maintain" vs. "Defend": Which Translation Is Official?'
  paragraphs:
  - '"Defend" is the most direct modern translation of *defendere*, which is why most symbol directories, reference pages, and educational materials default to "We Dare Defend Our Rights." Alabama''s official sources — the state code, the Secretary of State, and the Department of Archives and History — consistently use "maintain." The difference is not a factual dispute; it is the gap between a generic dictionary translation and the state''s own chosen English wording.'
  - When two renderings appear side by side in search results, "maintain" is the one Alabama put into law.
- id: why-chosen
  icon: fa-solid fa-person-walking
  title: Why Alabama Chose This Motto
  paragraphs:
  - The motto was selected for Alabama's coat of arms in the early 1920s. Marie Bankhead Owen — then director of the Alabama Department of Archives and History — is credited with choosing the phrase; W. B. Saffold with rendering it in Latin. The result was a Latin inscription cut into a heraldic scroll beneath the shield — formal, legible, in a script style that made the phrase feel permanent rather than decorative.
  - 'Owen chose Latin deliberately. European heraldic tradition — the tradition Alabama''s coat of arms was drawing on — had used Latin as the standard language of mottoes since the medieval period. English mottoes existed, but Latin carried institutional weight that English did not. For a director redesigning an emblem meant to project Alabama''s standing as a serious political entity, the choice of Latin was a statement about the kind of symbol she was building: not a slogan, but an inscription.'
  - The specific phrase carried weight beyond translation. *Audemus* — we dare — puts agency at the front. The motto does not say rights will be defended; it says those who hold them will dare to act. In the 1920s, when Southern states were actively constructing a particular vision of their political identity, a motto asserting the courage to maintain one's rights was a deliberate choice, not a neutral one. Owen left no written account of why she selected this phrase over others, but the phrase she selected fits its political moment precisely.
- id: when-official
  icon: fa-solid fa-calendar
  title: When the Motto Became Official
  paragraphs:
  - The motto became official in 1939 when Alabama's Legislature formally adopted the coat of arms. The phrase had appeared on the coat of arms design since around 1923, but the 1939 legislation gave it legal standing — making that sixteen-year gap between creation and adoption a notable detail that most sources skip.
- id: earlier-motto
  icon: fa-solid fa-clock-rotate-left
  title: 'Alabama''s Earlier Motto: "Here We Rest"'
  paragraphs:
  - Before *Audemus jura nostra defendere*, Alabama was associated with **"Here We Rest"** — an English phrase tied to an earlier state seal design. When the coat of arms was redesigned in the 1920s, the Latin phrase replaced it, and the 1939 adoption made the change permanent. The shift from a passive English motto to an assertive Latin one was a deliberate choice made during the redesign, not a gradual evolution.
  - '"Here We Rest" was rooted in a nineteenth-century interpretation of the word *Alabama* itself — a popular theory held that it derived from a Muscogee (Creek) phrase meaning something close to "here we rest" or "vegetation gatherers." Historians have since questioned that etymology, but in the 1800s it was widely accepted and shaped Alabama''s early official self-image. A state that named itself after peaceful rest presented itself very differently from one whose motto declared it would dare to maintain its rights. The 1920s redesign reversed that posture entirely.'
