seo_title: 'Alabama State Motto: Audemus Jura Nostra Defendere — Meaning, Translation & History'
seo_description: Alabama's official state motto is Audemus jura nostra defendere, interpreted by Alabama as 'We Dare Maintain Our Rights.' Adopted in 1939 as part of the state coat of arms. Learn the meaning, history, and why translations differ.
intro_text: Alabama's official state motto is **Audemus jura nostra defendere** — a Latin phrase that official Alabama sources interpret as **"We Dare Maintain Our Rights."** It appears on the Alabama coat of arms and became official in 1939. Many secondary sources render the phrase as "We Dare Defend Our Rights," but the official Alabama wording uses "maintain," not "defend" — a distinction worth knowing before citing this motto anywhere.
