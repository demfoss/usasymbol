sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Alabama's State Legume?"
    paragraphs:
      - "The peanut is Alabama's official state legume, designated by the Alabama Legislature in 2022. Peanuts have been a major crop in southeast Alabama's Wiregrass region for more than a century."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Peanut"
    paragraphs:
      - "Peanuts grow underground on the roots of a low, leafy plant, unlike tree nuts, which is why peanuts are classified as a legume rather than a true nut. Alabama farmers harvest peanuts in late summer and early fall."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Peanut Became Alabama's State Legume"
    paragraphs:
      - "The Alabama Legislature designated the peanut the official state legume in 2022, formally recognizing a crop long central to southeast Alabama's farm economy."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Peanut"
    paragraphs:
      - "Dothan, in southeast Alabama, has been called the Peanut Capital of the World, and the region's peanut industry grew after boll weevil infestations pushed farmers away from cotton in the early 1900s. George Washington Carver's agricultural research at Tuskegee also helped popularize peanuts as an alternative crop."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Peanut Comes From in Alabama"
    paragraphs:
      - "Southeast Alabama's Wiregrass region, centered on Dothan, has been the heart of the state's peanut industry for over a century."
