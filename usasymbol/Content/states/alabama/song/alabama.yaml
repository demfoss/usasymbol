sections:
  - id: overview
    icon: fa-solid fa-music
    title: Alabama State Song
    paragraphs:
      - "\"Alabama\" is Alabama's official state song, adopted by the legislature in 1931. Julia S. Tutwiler wrote the words as a poem decades before Edna Gockel Gussen won a statewide competition to compose the music that fixed the song in its current form."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Alabama\" Explained"
    paragraphs:
      - "The song addresses the state directly, praising its hills, valleys, and rivers while pledging loyalty and love to the land. It moves at a stately, hymn-like tempo suited to a formal occasion rather than a marching band or dance hall."
      - "Julia Tutwiler wrote the original poem in the early 1870s. She was already known across Alabama for founding schools and pressing for prison reform, and her words were first sung to a borrowed Austrian tune long before any Alabama composer set them to original music."
      - "Edna Gockel Gussen, a Birmingham organist and choirmaster, won a 1917 competition held by the Alabama Federation of Music Clubs to compose new music for Tutwiler's words. That pairing became the version the legislature adopted in 1931."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Alabama" Represents Alabama
    paragraphs:
      - "Lawmakers chose the song because its author was already a fixture of Alabama public life. Tutwiler's education and prison-reform work touched communities statewide, giving her poem a built-in audience of teachers and civic groups who had recited it for years."
      - "The formal, statewide competition to compose original music also gave the song local ownership. Rather than borrowing a tune from elsewhere, Alabama had a Birmingham musician write music specifically for Tutwiler's words."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Alabama\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Alabama" Became Alabama's State Song
    paragraphs:
      - "Tutwiler's poem circulated for decades before the Alabama Federation of Music Clubs held a competition in 1917 to compose original music for it. The Alabama Legislature did not formally designate the pairing as the official state song until 1931, more than half a century after the words were first written."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Alabama\" Facts"
    facts:
      - "Alabama adopted \"Alabama\" as its official state song in 1931."
      - "Julia S. Tutwiler, the lyricist, is also known for founding Alabama schools and pushing for prison reform."
      - "Edna Gockel Gussen, a Birmingham organist, won a 1917 statewide competition to compose the song's music."
      - "The words were originally sung to a borrowed Austrian melody before Gussen's original composition replaced it."

