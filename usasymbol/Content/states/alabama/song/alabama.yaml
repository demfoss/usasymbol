faq:
  - question: What is Alabama's state song?
    answer: "Alabama's official state song is \"Alabama,\" adopted in 1931."
  - question: Who wrote Alabama's state song?
    answer: "Julia S. Tutwiler wrote the words in the early 1870s, and Edna Gockel Gussen composed the music in 1917."
  - question: When did Alabama adopt "Alabama" as its state song?
    answer: "The Alabama Legislature adopted \"Alabama\" as the official state song in 1931."
  - question: Did Julia Tutwiler write music too, or only the words?
    answer: "Tutwiler wrote only the words. Edna Gockel Gussen composed the music decades later after winning a statewide competition."

