timeline:
- year: Pre-1900
  description: American black bears historically widespread across Alabama; part of the native fauna in forested regions statewide
- year: Early 1900s
  description: Overhunting and large-scale forest clearing reduce black bear range to a fraction of original territory; population retreats to southwestern Alabama bottomlands
- year: Mid-to-late 1900s
  description: Surviving population stabilizes in the Mobile-Tensaw Delta; Alabama Department of Conservation and Natural Resources begins monitoring
- year: '2006'
  description: Alabama Legislature designates the American black bear as the official state mammal — after a student-led campaign
- year: '2009'
  description: A similar student campaign results in the West Indian manatee being designated as Alabama's official state marine mammal — the two symbols together cover land and sea
- year: 2010s–present
  description: Black bear sightings gradually increase in Mobile, Baldwin, Clarke, and Washington counties as the delta population slowly expands into adjacent forest habitat
faq:
- question: What is Alabama's state mammal?
  answer: Alabama's official state mammal is the American black bear (Ursus americanus), designated by the state legislature in 2006.
- question: When did the black bear become Alabama's state mammal?
  answer: The American black bear became Alabama's official state mammal in 2006. Some secondary sources incorrectly list 1996 — the primary legislative record confirms 2006.
- question: What law made the black bear Alabama's official state mammal?
  answer: A 2006 act of the Alabama Legislature designated the American black bear as the official state mammal. The bill passed with no significant opposition, following a student-led campaign that brought the proposal to the legislature.
- question: Why was the black bear chosen as Alabama's state mammal?
  answer: The black bear is native to Alabama with a historical range across most of the state. Its population was severely reduced by the early 20th century but has been slowly recovering in the Mobile-Tensaw Delta. The designation was championed by Alabama schoolchildren who organized a campaign to recognize the bear's place in Alabama's ecology and its conservation story.
- question: Is the black bear native to Alabama?
  answer: Yes. The American black bear is native to Alabama. Historically, bears ranged across much of the state. Today they are concentrated in the bottomland forests of southwestern Alabama, particularly the Mobile-Tensaw Delta.
- question: Where do black bears live in Alabama today?
  answer: Black bears in Alabama are found primarily in Mobile and Baldwin counties, centered on the Mobile-Tensaw Delta and the surrounding bottomland forests. Some dispersal has been documented into Clarke, Washington, and Choctaw counties. Confirmed breeding populations remain in the southwestern part of the state.
- question: Did students campaign for the black bear designation?
  answer: Yes. The black bear was designated after Alabama schoolchildren organized a formal campaign and petitioned the legislature. The same civic engagement pattern repeated three years later, when students successfully advocated for the West Indian manatee as Alabama's state marine mammal in 2009.
- question: What is the difference between Alabama's state mammal and state marine mammal?
  answer: Alabama has two separate mammal designations. The American black bear is the official state mammal (2006). The West Indian manatee is the official state marine mammal (2009). Both were designated after student-led campaigns.
- question: How many black bears are in Alabama?
  answer: There is no published census count for Alabama's black bear population. The population is estimated to number in the hundreds, concentrated in the Mobile-Tensaw Delta region of southwestern Alabama. Sightings have gradually increased as the population slowly expands into adjacent counties.
