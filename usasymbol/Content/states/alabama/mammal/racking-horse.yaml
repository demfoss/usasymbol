faq:
- question: What is the official state horse of Alabama?
  answer: The official state horse of Alabama is the racking horse, designated by the Alabama Legislature in 1975.
- question: What is a racking horse?
  answer: A racking horse is a gaited breed known for the rack — a smooth, four-beat lateral gait in which each hoof strikes the ground separately. The result is a nearly bounce-free ride. The breed is distinct from the Tennessee Walking Horse and has its own registry, headquartered in Decatur, Alabama.
- question: What does 'racking' mean in racking horse?
  answer: Racking refers to a four-beat lateral gait, sometimes called the single-foot, where only one hoof touches the ground at a time. The gait is natural to the breed and produces a smooth, steady ride without the vertical bounce of a trot.
- question: Where is the Racking Horse Breeders' Association of America based?
  answer: The RHBAA is headquartered in Decatur, Alabama. It was founded in 1971 when the racking horse was established as a breed distinct from the Tennessee Walking Horse.
- question: Is the racking horse related to the Tennessee Walking Horse?
  answer: Yes. Both breeds share gaited Southern ancestry. They diverged when Alabama-area breeders began selecting specifically for the rack gait rather than the running walk that defines the Tennessee Walking Horse. The racking horse has had its own breed registry — based in Alabama — since 1971.
