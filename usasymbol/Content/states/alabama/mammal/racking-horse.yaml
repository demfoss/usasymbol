sections:
- id: adoption-law
  icon: fa-solid fa-scale-balanced
  title: When Did Alabama Make the Racking Horse Official?
  subsections:
  - subtitle: The 1975 Law
    text: 'The Alabama Legislature designated the racking horse as the official state horse in 1975. The Alabama Department of Archives and History records it simply as: *Horse — Racking horse — 1975*.'
  - subtitle: Why 1975?
    text: 'The timing was not arbitrary. The Racking Horse Breeders'' Association of America (RHBAA) — founded and headquartered in **Decatur, Alabama** — had separated the racking horse from the Tennessee Walking Horse registry in 1971, establishing it as a distinct breed with its own studbook and standards. Four years later, the Legislature followed. The 1971 recognition and the 1975 designation are part of the same story: Alabama institutions shaped this breed''s identity, then the state made it official.'
- id: what-is-racking-horse
  icon: fa-solid fa-person-walking
  title: What Makes a Racking Horse Distinct?
  paragraphs:
  - 'The racking horse''s reputation rests entirely on one thing: its gait. Where most horses trot in a two-beat diagonal pattern, the rack is a four-beat lateral gait — each hoof strikes the ground at a separate moment, evenly spaced. Riders hear a distinct four-count rhythm instead of the paired *clip-clop* of a trot. The result is a gliding, rolling motion with almost no vertical bounce — described by riders as close to sitting still at speed. That smoothness made racking horses the practical choice for long plantation rides across the antebellum South.'
  subsections:
  - subtitle: What Does 'Racking' Mean?
    text: Racking describes that specific four-beat lateral gait, sometimes called the **single-foot** because only one hoof contacts the ground at a time. It is natural to the breed — not a trained variation — and it is the defining criterion for registration with the RHBAA.
- id: alabama-connection
  icon: fa-solid fa-location-dot
  title: The Breed Registry Is in Decatur, Alabama — Not Tennessee
  paragraphs:
  - The racking horse's ties to Alabama are institutional, not just historical. The **Racking Horse Breeders' Association of America** was founded and has remained headquartered in **Decatur, Alabama** since 1971. When the breed was separated from the Tennessee Walking Horse registry and given its own studbook, that work happened in Alabama.
  - 'Before 1971, racking horses were commonly shown and registered under the Tennessee Walking Horse umbrella. The RHBAA''s founding changed that permanently: a horse must now demonstrate the rack as its natural gait to qualify for the registry, regardless of bloodlines. The state did not adopt a breed with a loose regional connection — it adopted the breed whose formal identity was built within its borders.'
  - The racking horse shares ancestry with the [Tennessee Walking Horse](/states/tennessee/mammal/tennessee-walking-horse) — both developed from the same pool of gaited Southern stock. They diverged when Alabama-area breeders began selecting specifically for the rack rather than the running walk that defines the Walking Horse.
