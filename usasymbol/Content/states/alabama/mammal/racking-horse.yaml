seo_title: 'Alabama State Horse: The Racking Horse (Official Symbol Since 1975)'
seo_description: Alabama's official state horse is the racking horse, designated by the state legislature in 1975. Learn what the rack gait is, why this breed is tied to Alabama, and what makes it distinct from the Tennessee Walking Horse.
intro_text: 'The **racking horse** is the official state horse of Alabama — a gaited breed, not to be confused with any racehorse of the same name. The Alabama Legislature made it official in 1975. The connection is not just regional sentiment: the breed''s formal recognition and its national registry are rooted in Alabama.'
