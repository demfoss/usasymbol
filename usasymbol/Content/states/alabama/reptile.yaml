faq:
  - question: What is Alabama's state reptile?
    answer: "Alabama's state reptile is the Alabama red-bellied turtle, adopted by the Alabama Legislature in 1990."
  - question: When did Alabama adopt the Alabama red-bellied turtle?
    answer: "The Alabama Legislature designated the Alabama red-bellied turtle the official state reptile in 1990."
  - question: Why did Alabama choose the Alabama red-bellied turtle?
    answer: "The turtle is named after the state and found almost exclusively in Alabama's Mobile-Tensaw Delta, making it a distinctive choice to represent the state's wildlife."
  - question: Is the Alabama red-bellied turtle endangered?
    answer: "The Alabama red-bellied turtle is federally listed as threatened because its range is limited mainly to the Mobile-Tensaw Delta and nearby coastal waters."

