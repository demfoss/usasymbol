seo_title: "Alabama State Reptile | Alabama Red-bellied Turtle"
seo_description: "Alabama's state reptile is the Alabama red-bellied turtle, adopted in 1990. It is found almost nowhere else outside the Mobile-Tensaw Delta."
hero_image: /images/reptiles/alabama/alabama-state-reptile-hero.webp
hero_image_alt: "An Alabama red-bellied turtle with a dark shell and reddish underside basking near water."
hero_image_caption: "The Alabama red-bellied turtle, Alabama's state reptile, lives mainly in the Mobile-Tensaw Delta."
intro_text: "Alabama's state reptile is the Alabama red-bellied turtle, a freshwater turtle found almost nowhere else in the world outside coastal Alabama, adopted in 1990. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Alabama?
    paragraphs:
      - "The Alabama red-bellied turtle is Alabama's official state reptile, designated by the Alabama Legislature in 1990. Its scientific name is Pseudemys alabamensis, and it is named directly after the state."
      - "It is a large freshwater turtle found mainly in the Mobile-Tensaw River Delta in south Alabama."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Alabama Red-bellied Turtle
    paragraphs:
      - "Adults have a dark, smooth shell that can grow over a foot long, with a reddish or pinkish tint along the underside of the shell that gives the species its name."
      - "It spends most of its time in slow-moving fresh and brackish water, basking on logs and banks along the delta's rivers and marshes."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Alabama Legislature designated the Alabama red-bellied turtle the official state reptile in 1990, recognizing a species found almost nowhere outside the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Alabama Chose the Alabama Red-bellied Turtle
    paragraphs:
      - "The Alabama red-bellied turtle is named after the state and is found almost exclusively in Alabama's Mobile-Tensaw Delta, making it a natural choice to represent the state's reptile life."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Alabama Red-bellied Turtle
    paragraphs:
      - "The Alabama red-bellied turtle lives mainly in the Mobile-Tensaw River Delta and nearby coastal waters in Mobile and Baldwin counties, with a small range extending into neighboring Mississippi coastal waters."
    sites:
