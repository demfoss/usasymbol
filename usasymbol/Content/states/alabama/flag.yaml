faq:
- question: What is the Alabama state flag?
  answer: Alabama's official state flag is a crimson St. Andrew's Cross on a plain white field. Two diagonal bars form an X, running from corner to corner. There is no seal, star, text, or any other element on the flag. It has looked this way since 1895.
- question: When was the Alabama state flag adopted?
  answer: February 16, 1895. The Alabama legislature passed the flag act on that date. The design has not changed in the 130 years since.
- question: Who introduced the Alabama state flag legislation?
  answer: John W. A. Sanford Jr., a representative from Montgomery County, introduced the bill in the Alabama House of Representatives. No designer is credited in the law itself.
- question: What does the X on the Alabama flag represent?
  answer: The law identifies the cross as a St. Andrew's Cross, named for the apostle Andrew, traditionally said to have been crucified on an X-shaped cross. The same shape appears on the Scottish flag and, in different colors, on the Confederate Battle Flag. The 1895 law gives no explanation of the symbolism. Many historians connect the design to the Lost Cause movement, given the timing of adoption and the parallel adoption of Confederate-coded flags across Southern states in the same period.
- question: Is the Alabama flag connected to the Confederacy?
  answer: Many historians say the connection is almost certainly intentional, pointing to the adoption date (1895, during the Lost Cause movement's peak), the use of the same cross shape as the Confederate Battle Flag, and the pattern of Confederate symbol adoption across Southern state governments in the same era. The 1895 law does not state that intent, and no floor debate record confirms it. The connection is historically credible and widely accepted among scholars, but it remains interpretation rather than documented fact.
- question: Is the Alabama flag square or rectangular?
  answer: The law does not say. The 1895 act specifies bar width but not overall flag proportions. Historically the flag was often shown as square. A 1987 attorney general opinion favored rectangular proportions, and rectangular versions are more common in official contexts today — but both proportions remain in use. The statute has never been amended.
- question: Did Alabama have a state flag before 1895?
  answer: Not officially. In January 1861, women from Montgomery presented a blue silk flag to the Secession Convention, but it was never formally adopted. Alabama had no official state flag from the Civil War through readmission — a gap of roughly thirty-five years — until the 1895 act.
- question: What shade of crimson does Alabama's flag use?
  answer: 'State law specifies ''crimson'' but assigns no Pantone, CMYK, or hex value. The hex #A6192E is commonly used in digital contexts but is a convention, not a legal standard. The exact shade varies between manufacturers, buildings, and print runs.'
