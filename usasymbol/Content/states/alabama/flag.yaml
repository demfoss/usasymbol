seo_title: 'Alabama State Flag | Crimson Cross & Meaning'
seo_description: Alabama's state flag is a crimson St. Andrew's Cross on a white field, adopted February 16, 1895. Learn its history, the Confederate and Scottish readings of its design, the 1861 flag it replaced, and why it still generates debate.
intro_text: The Alabama state flag is a **crimson St. Andrew's Cross on a white field** — two diagonal bars running corner to corner, forming a stark X with nothing else on the field. The legislature adopted it on **February 16, 1895**, and the design has not changed since. Its visual language is minimal. The arguments it generates are not.
