hero_image_caption: "Star blue quartz, Alabama's official state gemstone, is named for the star-like flash of light it can show when polished."
intro_text: "Alabama's state gemstone is star blue quartz, adopted by the Alabama Legislature in 1990 to recognize a quartz variety said to flash a six-rayed star when cut and polished. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Alabama State Gemstone
    paragraphs:
      - "Star blue quartz is Alabama's official state gemstone, designated by the Alabama Legislature in 1990. The stone is a variety of quartz that can show asterism, a six-rayed star of reflected light, when cut into a rounded cabochon and polished."
      - "Lawmakers chose it as a distinctly Alabama material rather than a widely traded gem like diamond or emerald, giving the state a mineral symbol tied to its own rock collecting and lapidary community."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Star Blue Quartz?"
    paragraphs:
      - "Star blue quartz is quartz, silicon dioxide, colored blue and showing a star pattern of light across its surface when cut en cabochon. The star effect comes from tiny needle-like mineral inclusions running through the stone in set directions; light bounces off these needles as the stone is turned, producing the star."
      - "Quartz itself is one of the most common minerals on Earth, but blue, star-effect specimens are unusual. Mineralogists have questioned how common true gem-quality star blue quartz actually is in Alabama, since verified specimens matching the legislature's description are hard to find."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Alabama Chose Star Blue Quartz as Its State Gemstone"
    paragraphs:
      - "The push for a state gemstone came from Alabama's rockhounding community rather than a mining industry. State Senator Don Hale of Cullman County sponsored the bill, giving hobbyist collectors and lapidary clubs an official state gem of their own to point to."
      - "Choosing a quartz variety fit a broader pattern; many states named a gemstone found or collected within their own borders rather than an imported commercial gem. Alabama's version stands out because it followed the legislature's language closely, without a well-documented deposit backing the choice the way Arkansas's diamond or Arizona's turquoise did."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Star Blue Quartz Became Alabama's State Gemstone"
    paragraphs:
      - "Governor Guy Hunt signed the bill naming star blue quartz Alabama's state gemstone in 1990. The specimen kept on file with the Alabama Department of Archives and History, the state's official repository for its emblems, has been described by researchers who examined it as a small, gray stone rather than a vivid blue gem, which has kept the identity of Alabama's official gemstone a subject of debate among mineral collectors."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Star Blue Quartz Facts"
    facts:
      - "Adopted as Alabama's state gemstone in 1990."
      - "The bill was sponsored by State Senator Don Hale of Cullman County."
      - "Star blue quartz is chemically identical to ordinary quartz, SiO2; its star pattern comes from oriented needle-like inclusions, not a different mineral."
      - "Mineralogists have publicly questioned whether specimens matching the state's description of a vivid blue, star-effect quartz are documented anywhere in Alabama."

