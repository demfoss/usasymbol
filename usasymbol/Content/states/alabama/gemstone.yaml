seo_title: "Alabama State Gemstone | Star Blue Quartz"
seo_description: "The Alabama state gemstone is star blue quartz, adopted in 1990. Gem-quality specimens are so rare that some mineralogists question if they exist."
hero_image: /images/gemstones/alabama/alabama-state-gemstone-hero.webp
