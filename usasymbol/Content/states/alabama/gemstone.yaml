faq:
  - question: What is Alabama's state gemstone?
    answer: "Alabama's state gemstone is star blue quartz, a blue variety of quartz that can show a six-rayed star of light when cut and polished."
  - question: When did Alabama adopt star blue quartz as its state gemstone?
    answer: "The Alabama Legislature designated star blue quartz the official state gemstone in 1990."
  - question: Why did Alabama choose star blue quartz?
    answer: "State Senator Don Hale of Cullman County sponsored the designation to give Alabama's rockhounding and lapidary community an official state gem of its own."
  - question: Does star blue quartz actually exist in Alabama?
    answer: "The material named in the 1990 law is real; quartz can show a star effect from oriented mineral inclusions. But mineralogists have questioned whether documented, gem-quality specimens matching the legislature's description have ever been found in the state."

