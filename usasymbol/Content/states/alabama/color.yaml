seo_title: 'Alabama State Colors: Does Alabama Have Official State Colors?'
seo_description: Alabama does not appear to have separately designated official state colors. People usually mean crimson and white — the colors of the state flag adopted in 1895. Here's what Alabama law actually says.
intro_text: Alabama does not appear to have separately designated official state colors. When people say 'Alabama's colors are crimson and white,' they are describing the [Alabama state flag](/states/alabama/flag) — a crimson St. Andrew's cross on a white field, adopted on **February 16, 1895**. No additional legislation has formally designated those colors as official state colors apart from the flag.
