faq:
- question: Does Alabama have official state colors?
  answer: Alabama does not appear to have separately designated official state colors. Crimson and white are the colors of the state flag, adopted in 1895, but no separate legislative act formally designating them as state colors could be verified in official Alabama sources.
- question: What color is Alabama crimson?
  answer: 'Alabama law names the color ''crimson'' but assigns no Pantone or hex value. The hex #A6192E is used in digital contexts by convention. Reproductions vary because the statute is silent on exact shade.'
- question: Are Alabama's colors the same as University of Alabama colors?
  answer: Yes — both the state flag and the University of Alabama use crimson and white. The two are independent traditions that happen to share the same colors, reinforcing each other in public perception.
