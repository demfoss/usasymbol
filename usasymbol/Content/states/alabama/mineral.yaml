sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Alabama State Mineral
    paragraphs:
      - "Hematite is Alabama's official state mineral, designated by the Alabama Legislature in 1967. It is an iron oxide mineral, and for over a century it was the raw material behind Birmingham's rise as an iron and steel manufacturing center."
      - "Alabama did not choose hematite for its rarity because it is one of the most common iron ores on Earth. Lawmakers recognized how directly the mineral shaped the state's industrial history."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Hematite?"
    paragraphs:
      - "Hematite is an iron oxide mineral, chemically Fe2O3. In solid form it appears steel gray to black with a metallic shine, but when scratched or crushed to powder it leaves a distinctive red-brown streak, the same reddish tint that colors soil and rock formations across the world."
      - "Hematite is a common mineral found in sedimentary rock layers, and it forms in environments ranging from ancient seabeds to hot springs. Alabama's supply came from sedimentary iron ore beds laid down hundreds of millions of years ago."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Alabama Chose Hematite as Its State Mineral"
    paragraphs:
      - "Alabama's choice of hematite is tied directly to Red Mountain, the iron-rich ridge running through Birmingham that gave the city its industrial identity. The red rock exposed along the Red Mountain Expressway cut is visibly stained by the same iron oxide that makes up hematite."
      - "Mining hematite from Red Mountain, combined with nearby coal and limestone deposits, gave Birmingham the three raw materials needed for steelmaking in one place, a rare combination that earned it the nickname 'the Pittsburgh of the South.' Iron and steel production defined the city's economy for generations."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Hematite Became Alabama's State Mineral"
    paragraphs:
      - "State lawmakers designated hematite the official state mineral in 1967, formally recognizing the mineral behind Alabama's iron and steel industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Hematite Is Found in Alabama"
    paragraphs:
      - "Red Mountain, the ridge running through Birmingham, was the historic center of Alabama hematite mining. Large-scale mining ended there by the early 1960s, but the exposed red-stained rock layers are still visible today, most famously along the Red Mountain Expressway road cut."
    sites:
      - name: Red Mountain
        city: Birmingham
        lat: 33.4835
        lng: -86.8103
        note: "Historic hematite mining district"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Hematite Facts"
    facts:
      - "Adopted as Alabama's state mineral in 1967."
      - "Hematite gets its name from the Greek word for blood, a reference to its red streak when powdered."
      - "Red Mountain's hematite deposits, combined with nearby coal and limestone, made Birmingham one of the few places in the world with all three raw materials for steelmaking close together."
      - "Large-scale hematite mining on Red Mountain ended by the early 1960s, just a few years before the mineral became Alabama's official state symbol."

