- id: facts
  icon: fa-solid fa-lightbulb
  title: Largemouth Bass Facts
  facts:
  - Adopted in 1975 by the Alabama Legislature.
  - Its scientific name is Micropterus salmoides.
  - Its upper jaw reaches past the eye when the mouth is closed.
  - Alabama's record largemouth bass weighed 16 pounds 8 ounces and was caught in 1987.
  - It lives in ponds, lakes, and rivers across the United States.
faq:
- question: What is Alabama's state fish?
  answer: Alabama's state freshwater fish is the largemouth bass. The state saltwater fish is the fighting tarpon.
- question: When did Alabama adopt the Largemouth Bass?
  answer: The Alabama Legislature made the largemouth bass the official state freshwater fish in 1975.
- question: Why did Alabama choose the Largemouth Bass?
  answer: It is common in Alabama's lakes and rivers and is very popular with anglers.
- question: What is the biggest largemouth bass ever caught in Alabama?
  answer: The state record weighed 16 pounds 8 ounces. It was caught in 1987 at Mountain View Lake in Shelby County.
- question: How can you tell a largemouth bass from other bass?
  answer: Look at its mouth. On a largemouth bass, the upper jaw reaches back past the eye when the mouth is closed.
