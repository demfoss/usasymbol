intro_text: Alabama's state freshwater fish is the largemouth bass, a big-mouthed game fish of the state's lakes and rivers, adopted in 1975. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of Alabama?
  paragraphs:
  - The largemouth bass is Alabama's official state freshwater fish. The Alabama Legislature gave it this title in 1975.
  - Its scientific name is Micropterus salmoides. Alabama's other state fish is the fighting tarpon, which is the state saltwater fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Largemouth Bass
  paragraphs:
  - The largemouth bass has a green or olive back and lighter sides. A dark, blotchy stripe runs along each side of its body, and its belly is pale.
  - Its name comes from its very large mouth. When the mouth is closed, the upper jaw reaches back past the eye, and this is an easy way to tell it apart from other bass.
  - It is a strong, heavy fish. Alabama's record largemouth bass weighed 16 pounds 8 ounces.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The Alabama Legislature named the largemouth bass the official state freshwater fish in 1975.
  - The law listed the wrong scientific name by mistake. State archives point out the error, but the fish named in the law is still the largemouth bass.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Alabama Chose the Largemouth Bass
  paragraphs:
  - The largemouth bass is common in Alabama's inland waters and is very popular with anglers. State archives give these reasons for the choice.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Largemouth Bass
  paragraphs:
  - The largemouth bass lives in ponds, lakes, and rivers all over Alabama.
  - Lake Guntersville on the Tennessee River and Lake Eufaula on the Chattahoochee River are two of the state's best-known largemouth bass lakes.
