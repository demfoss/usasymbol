seo_title: Alabama State Freshwater Fish | Largemouth Bass
seo_description: The Alabama state freshwater fish is the largemouth bass, adopted in 1975. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/alabama/alabama-fish-freshwater-hero.webp
