seo_title: 'Alabama State Tree: Southern Longleaf Pine History and Meaning'
seo_description: Alabama's state tree is the Southern longleaf pine (Pinus palustris), adopted in 1949 and formally named by law in 1997. Learn how it built Alabama's economy, why it nearly disappeared, and what its restoration means today.
intro_text: 'Alabama''s official state tree is the <strong>Southern longleaf pine</strong> (<em>Pinus palustris</em>), first adopted in <strong>1949</strong> and specifically named by <strong>House Bill No. 533 in 1997</strong>. For most of Alabama''s history, this was not a symbolic tree — it was a working one, the spine of a regional economy built on lumber, turpentine, and naval stores. What it represents today is more complicated: a species that once covered millions of Alabama acres, lost most of that ground to industrial forestry, and now anchors some of the most significant ecological restoration work in the American South.'
