sections:
- id: answer-fast
  icon: fa-solid fa-tree
  title: Built Alabama, Nearly Lost
  paragraphs:
  - 'Alabama''s state tree is the Southern longleaf pine — adopted in 1949 and identified specifically as <em>Pinus palustris</em> in 1997. For much of the state''s history, it was the tree that built Alabama: milled into lumber for houses and ships, tapped for turpentine and naval stores, dominant across the pine savannas of the coastal plain and wiregrass region.'
  - It still grows in Alabama. It still matters. But it grows in far fewer places than it once did, and the gap between its former reach and its present range is itself part of what the designation means. See how it compares to other [U.S. state trees](/symbols/trees) and where it fits among the broader set of [Alabama state symbols](/states/alabama).
- id: why-alabama-chose-it
  icon: fa-solid fa-industry
  title: Why Alabama Chose the Longleaf Pine
  paragraphs:
  - Alabama did not designate the longleaf pine as a gesture toward nature. In 1949, the choice was a recognition of economic history. The longleaf pine had been the foundation of Alabama's timber and naval stores industries for generations. Its resin became turpentine, pitch, and tar — the naval stores that gave Alabama a role in the maritime economy. Its straight-grained heartwood was cut into some of the most durable lumber available to nineteenth-century builders.
  - Across the longleaf belt — a band of territory stretching through south and central Alabama into the coastal plain — sawmill towns rose and fell with the timber supply. Many structures built with old-growth longleaf pine are still standing because the wood is dense and resin-saturated enough to resist rot and insects in ways that younger plantation timber cannot match.
  - Hugh Kaul, the bill's sponsor, later clarified he had always meant the longleaf specifically — not the broader category of southern pines, which includes loblolly, shortleaf, and slash. But the 1949 law used the generic phrase 'southern pine,' and that ambiguity would take nearly five decades to correct.
- id: law-and-designation
  icon: fa-solid fa-landmark
  title: The 1949 Adoption and the 1997 Clarification
  paragraphs:
  - When Hugh Kaul sponsored the 1949 state tree bill, he had one tree in mind. The law that passed named 'the southern pine' — a phrase broad enough to cover several species, including loblolly, which by then was already beginning to replace longleaf across much of its range. In 1949, most Alabamians in the timber trade or living in the wiregrass would have read 'the southern pine' as a reference to the tree that had shaped the landscape. The ambiguity probably felt academic.
  - It stopped feeling academic as loblolly plantations spread. By mid-century, the distinction between 'southern pine' and 'longleaf pine' had become more than semantic. Loblolly grew faster, was easier to manage commercially, and had taken over much of the territory once dominated by longleaf. A state tree law that said 'southern pine' could now be read as honoring the replacement rather than the original.
  - House Bill No. 533, passed in 1997, closed that gap. It named the Southern longleaf pine by both common name and scientific name — <em>Pinus palustris</em> — and made explicit what Kaul had always intended. The 1997 act did not change the 1949 adoption year, but it sharpened Alabama's commitment to a specific tree with a specific history.
- id: from-dominant-to-declining
  icon: fa-solid fa-chart-line
  title: How the Longleaf Pine Lost Its Ground
  paragraphs:
  - Savannas of widely spaced longleaf pines over a carpet of wiregrass once defined what much of south Alabama looked like — part of a forest ecosystem that covered an estimated sixty to ninety million acres across the South. Alabama's share was substantial, running through the coastal plain, the wiregrass region of the southeast, and portions of central Alabama.
  - What replaced it happened fast by ecological standards. Industrial logging cleared old-growth longleaf stands from the late nineteenth century through the early twentieth. What grew back was often not replanted as longleaf. Loblolly pine — faster-growing, easier to manage in plantations, more commercially efficient over short rotations — became the timber industry's preferred species. Slash pine filled a similar role in wetter coastal plain areas. By mid-century the longleaf's range had contracted dramatically; fewer than three percent of the original ecosystem survives today in anything approaching old-growth condition.
  - 'In Alabama, the shift is visible in timber data: loblolly now vastly outnumbers longleaf across the state''s forested acreage. The tree that built Alabama''s economy was quietly replaced by the tree that better fit industrial forestry''s model. Alabama still has longleaf pine — in the Conecuh National Forest, on state and private lands managed specifically for it — but it occupies a fraction of its former territory.'
- id: restoration-and-meaning
  icon: fa-solid fa-seedling
  title: What the Longleaf Pine Represents Now
  paragraphs:
  - Longleaf pine is a strange kind of state symbol — one that is most meaningful precisely because it is less common than it once was. It does not commemorate a settled history. It names a landscape that people are still trying to recover.
  - 'The tree is built for a long game. Longleaf seedlings spend their first years in what ecologists call the grass stage — a phase in which above-ground growth looks like a clump of long grass while the seedling puts its energy into developing a deep root system and a protected bud. That bud sits low enough and is shielded well enough that fire cannot kill it. This is the key to the longleaf''s ecology: it is not just fire-tolerant but fire-dependent, requiring periodic burns to suppress competing vegetation and maintain the open savanna conditions it evolved in. Suppress the fire long enough and longleaf gives way to hardwoods and faster-growing pines that outcompete it in the absence of flame.'
  - The [red-cockaded woodpecker](https://www.fws.gov/species/red-cockaded-woodpecker-leuconotopicus-borealis), listed as federally endangered, depends on mature longleaf stands almost exclusively. The bird excavates nest cavities in living longleaf pines — specifically old trees with the fungal heart rot that makes excavation possible — and its population decline has tracked closely with the loss of longleaf forest. In Alabama, conserving the red-cockaded woodpecker and restoring longleaf pine are effectively the same project.
  - Across Alabama, land managers on public and private land have been replanting longleaf and reintroducing prescribed fire to rebuild something like the pine savannas that once defined the region — including in the [Conecuh National Forest](https://www.fs.usda.gov/r08/alabama/recreation/conecuh-national-forest-0), one of the more significant longleaf restoration sites in the Southeast. It is slow work — the grass stage alone can last several years before a seedling shows visible height. But the effort is deliberate and ongoing.
  - The longleaf pine still builds things in Alabama. It built the economy. Now it is helping rebuild the habitat, the watershed function, and the ecological structure of a landscape that had been reduced almost past recognition. As a state symbol, it earns its place not through sentiment but through a specific, documented, ongoing Alabama story.
timeline:
- year: Pre-1800s
  description: Longleaf pine dominates Alabama's coastal plain, wiregrass region, and portions of central Alabama — part of one of the largest temperate forest ecosystems in North America.
- year: 1800s–early 1900s
  description: Industrial-scale logging clears old-growth longleaf stands across Alabama. Naval stores operations — turpentine and tar production — tap and exhaust large areas of the forest. Sawmill towns rise across the longleaf belt.
- year: Early–mid 1900s
  description: Loblolly and slash pine plantations replace much of the cleared longleaf range. Fire suppression becomes the norm, working against longleaf's dependence on periodic burns. The longleaf ecosystem contracts sharply.
- year: '1949'
  description: Hugh Kaul sponsors legislation naming the southern pine as Alabama's official state tree. He intends the longleaf pine specifically, but the law uses the broader phrase 'southern pine.'
- year: '1970'
  description: The red-cockaded woodpecker, which nests almost exclusively in mature longleaf pine, is listed as endangered under the precursor to the Endangered Species Act.
- year: '1997'
  description: House Bill No. 533 passes, specifying the Southern longleaf pine (Pinus palustris) by name as Alabama's official state tree — resolving the ambiguity in the 1949 law nearly fifty years later.
- year: Ongoing
  description: Longleaf pine restoration continues across Alabama, including the Conecuh National Forest, with prescribed fire reintroduced to rebuild savanna habitat. The red-cockaded woodpecker remains a key indicator of restored longleaf stand health.
faq:
- question: What is the Alabama state tree?
  answer: Alabama's official state tree is the Southern longleaf pine, known scientifically as Pinus palustris. It was first adopted as the state tree in 1949 and specifically identified as the longleaf pine by House Bill No. 533 in 1997.
- question: When did Alabama adopt the longleaf pine as its state tree?
  answer: Alabama first designated its state tree in 1949, with a law naming the 'southern pine.' The longleaf pine was specifically named in 1997. The 1949 adoption year is still recognized as the official date.
- question: Why was the law clarified in 1997?
  answer: The 1949 law used the phrase 'southern pine,' which covers several species including loblolly and slash pine. Sponsor Hugh Kaul always intended the longleaf pine specifically, but the vague wording left room for interpretation. House Bill No. 533 in 1997 named the Southern longleaf pine by both common name and scientific name, Pinus palustris, removing the ambiguity.
- question: Why is the longleaf pine important to Alabama's history?
  answer: The longleaf pine was the foundation of Alabama's timber and naval stores industries for much of the nineteenth and early twentieth centuries. Its wood was used for lumber and railroad ties. Its resin was processed into turpentine, pitch, and tar used to seal wooden ships. The tree defined the working landscape of south and central Alabama before industrial forestry replaced most of its range with faster-growing species.
- question: Why is the longleaf pine less common now?
  answer: Industrial logging cleared most old-growth longleaf in Alabama by the early twentieth century. The cleared land was often replanted with loblolly or slash pine, which grow faster and suit commercial timber production better. Fire suppression also worked against longleaf, which depends on periodic burns to maintain the open savanna conditions it evolved in. Today loblolly pine vastly outnumbers longleaf across Alabama's forested land.
- question: What is the grass stage of longleaf pine?
  answer: Longleaf pine seedlings spend their first years in a grass stage — a period in which above-ground growth resembles a clump of long grass while the seedling develops a deep root system and a protected bud. The low, shielded bud allows the seedling to survive the periodic fires that longleaf savannas historically experienced. This adaptation is central to the species' ecology and one reason prescribed fire is essential to longleaf restoration.
- question: What wildlife depends on longleaf pine in Alabama?
  answer: The red-cockaded woodpecker — listed as federally endangered — depends almost exclusively on mature longleaf pine stands for nesting. The bird excavates cavities in living longleaf pines, specifically older trees with softened heartwood caused by fungal rot. Its population decline has closely tracked the loss of old-growth longleaf forest. In Alabama, conserving the woodpecker and restoring longleaf pine are effectively the same effort.
- question: Is there longleaf pine restoration happening in Alabama?
  answer: Yes. Restoration work is ongoing across Alabama on public lands — including the Conecuh National Forest — and on private land managed for longleaf. Prescribed fire has been reintroduced as a management tool to rebuild savanna habitat. Longleaf grows slowly, and the grass stage alone can last several years, but the effort represents a sustained attempt to recover something close to the pine savannas that once defined much of south Alabama.
- question: Who sponsored the original Alabama state tree legislation?
  answer: Hugh Kaul sponsored the 1949 bill that designated the southern pine as Alabama's official state tree. He later stated he had always meant the longleaf pine specifically.
