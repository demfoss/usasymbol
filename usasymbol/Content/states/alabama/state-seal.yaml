faq:
- question: What is on Alabama's state seal?
  answer: Alabama's state seal shows a map of the state with its principal rivers — the Alabama, Tombigbee, Coosa, Tallapoosa, Black Warrior, Tennessee, Perdido, and Chattahoochee. The border of the seal includes the state motto Audemus jura nostra defendere (We dare defend our rights).
- question: What does Alabama's state seal mean?
  answer: The map records the rivers that were Alabama's primary transportation and commerce routes in 1817, when the seal was first adopted. Before roads crossed the Alabama wilderness, the rivers were the only reliable routes for goods, settlers, and military forces. The motto, Audemus jura nostra defendere, means "We dare defend our rights."
- question: When was Alabama's state seal adopted?
  answer: Alabama's seal was first adopted in 1817 when the Alabama Territory separated from the Mississippi Territory. When Alabama became the 22nd state on December 14, 1819, the territorial seal became the official state seal. The current standardized version dates to 1939.
- question: Why does Alabama's state seal show a map instead of an allegorical figure?
  answer: Alabama's designers chose a map because the rivers were the foundation of the territory's economy and expansion. In 1817, before roads crossed the Alabama wilderness, the rivers were the only reliable routes for commerce, migration, and military movement. The map recorded what Alabama actually was at the time of its founding.
- question: What does Audemus jura nostra defendere mean?
  answer: Audemus jura nostra defendere is Latin for "We dare defend our rights." It is Alabama's official state motto and appears in the border inscription of the seal.
- question: What rivers are on Alabama's state seal?
  answer: The seal shows eight principal rivers — the Alabama, Tombigbee, Coosa, Tallapoosa, Black Warrior, Tennessee, Perdido, and Chattahoochee. These were Alabama's main transportation and commerce routes at the time the seal was adopted in 1817.
- question: Has Alabama's state seal changed over time?
  answer: The map-centered composition has not changed since 1817. The 1939 revision standardized the rendering and proportions under Alabama Code § 1-2-4, but the river map and motto remain as originally designed for the territorial seal.

