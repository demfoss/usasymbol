seo_title: 'Great Seal of Alabama: The State Seal Built Around a River Map'
seo_description: 'Why does Alabama''s state seal show a map instead of a goddess or eagle? The rivers on the seal — the Alabama, Tombigbee, Coosa, and five others — were the territory''s only highways in 1817, when the seal was first adopted. Here''s what each element means.'
