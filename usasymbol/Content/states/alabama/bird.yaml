  heading: 'Yellow-Shafted vs. Red-Shafted: One Species, Two Forms'
  framing: The northern flicker has two main forms. Alabama's yellowhammer is the yellow-shafted form — the eastern subspecies whose bright yellow underwings gave the bird its Alabama name and made the Civil War uniform comparison obvious.
