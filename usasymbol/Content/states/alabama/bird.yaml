timeline:
- year: Civil War era
  description: A company of cavalry soldiers from Huntsville, their uniforms trimmed in bright yellow, earn the 'yellowhammer' nickname from fellow soldiers who compared them to the yellow-shafted flicker. One veteran's call — 'Yallerhammer, yallerhammer, flicker, flicker!' — reportedly started the comparison that spread through Alabama regiments.
- year: Post-Civil War
  description: '''Yellowhammer State'' enters wide use as Alabama''s popular nickname. The name carries the Civil War-era story of yellow-uniformed soldiers into the state''s peacetime identity.'
- year: '1927'
  description: Representative Thomas E. Martin of Montgomery County introduces a bill designating Alabama's official state bird. Governor David Bibb Graves signs it on September 6, 1927. The law names 'the bird commonly called the yellow-hammer' — making official what the state had been calling itself for over sixty years.
faq:
- question: What is the official state bird of Alabama?
  answer: Alabama's official state bird is the yellowhammer, also known as the northern flicker (Colaptes auratus). It was designated by law on September 6, 1927, when Governor David Bibb Graves signed legislation introduced by Representative Thomas E. Martin of Montgomery County.
- question: Why is it called the yellowhammer in Alabama?
  answer: 'The name describes the bird: the yellow-shafted flicker has bright yellow underwings and undertail visible in flight. In Alabama, the name also carries a Civil War-era story — soldiers from Huntsville wore yellow-trimmed uniforms that drew comparisons to the yellow-shafted flicker, earning the nickname ''yellowhammer.'' That nickname spread to Alabama soldiers broadly and eventually became one of the state''s own names.'
- question: Is the yellowhammer the same as the northern flicker?
  answer: Yes. The yellowhammer and the northern flicker are the same species, Colaptes auratus. Alabama law uses the older common name, which reflects traditional usage in the state and across the eastern United States. Most modern field guides use 'northern flicker' as the accepted common name.
- question: When did Alabama adopt the yellowhammer as its state bird?
  answer: 'September 6, 1927. Governor David Bibb Graves signed the legislation on that date. The law states: ''The bird commonly called the yellow-hammer is hereby designated the state bird.'''
- question: Is Alabama the only state with a woodpecker as its state bird?
  answer: Yes. The northern flicker is a member of the woodpecker family, making Alabama the only U.S. state whose official bird is a woodpecker.
- question: What does the Yellowhammer State nickname mean?
  answer: The nickname traces to the Civil War, when Alabama soldiers — particularly a company from Huntsville wearing yellow-trimmed uniforms — were compared to the yellow-shafted flicker by fellow soldiers. The comparison caught on, the nickname spread, and 'Yellowhammer State' became one of Alabama's recognized state names long before the bird was made official in 1927.
- question: What does the yellowhammer look like?
  answer: The yellow-shafted flicker has bright yellow underwings and undertail, a bold black crescent across the upper chest, a white rump patch visible in flight, a red nape patch, and a gray crown. Males have a black mustache stripe. It feeds primarily on ants at ground level and is more common in Alabama during the winter months.
- question: Who introduced the state bird legislation?
  answer: Representative Thomas E. Martin of Montgomery County introduced the bill in 1927. Governor David Bibb Graves signed it on September 6, 1927.
