seo_title: 'Alabama State Bird: The Yellowhammer (Northern Flicker), Explained'
seo_description: Alabama's official state bird is the yellowhammer — also known as the northern flicker — designated in 1927 by Governor David Bibb Graves. Learn the Civil War naming story and why Alabama is the only state with a woodpecker as its official bird.
intro_text: Alabama's official state bird is the **yellowhammer** — also known as the **northern flicker** (*Colaptes auratus*) — designated by law on **September 6, 1927**. In Alabama, "yellowhammer" is not just a bird name. It carries a Civil War-era nickname that had been attached to the state for sixty years before the legislature ever wrote it down.
