type: State Coat of Arms
state: Alabama
name: Alabama State Coat of Arms
adopted_year: 1939
is_official: true
meaning: "The Alabama coat of arms uses a divided shield to tell the story of every government that once held power over Alabama's land. France, Spain, Great Britain, the Confederacy, and the United States each appear on the shield as equals, with the United States placed at the center holding all four together. The two bald eagles and the ship above remind the viewer that Alabama's history runs deeper than any single flag."
meaning_title: Meaning of the Alabama Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-17'
date_modified: '2026-05-19'
seo_title: 'Alabama Coat of Arms | Meaning, Symbols and History'
seo_description: "The Alabama coat of arms was adopted in 1939 and shows a shield with five government emblems: France, Spain, Great Britain, the Confederacy, and the United States."
hero_image: /images/coats-of-arms/alabama/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Alabama, adopted 1939, showing a quartered shield supported by two bald eagles
hero_image_caption: The Alabama Coat of Arms, adopted March 14, 1939. The quartered shield shows the flags of five governments that held sovereignty over Alabama. Two bald eagles support the shield on either side, and the ship Badine appears above as the crest.
intro_text: "The Alabama coat of arms shows a shield with symbols of five governments connected to Alabama's history: France, Spain, Great Britain, the Confederacy, and the United States. The design was created in 1923 by New York heraldist B. J. Tieman at the request of Marie Bankhead Owen. The Alabama Legislature made it official on March 14, 1939. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Alabama Coat of Arms?
  paragraphs:
  - "The coat of arms appears in official state buildings, above legislative desks, and in public schools across Alabama. It is a separate emblem from the state seal. The seal centers on a map of Alabama's rivers, while the coat of arms uses a shield to show which governments held power over Alabama through history."
  - "Two bald eagles stand on either side of the shield. Above it is a crest shaped like a sailing ship. Below is the state motto in Latin. The Legislature adopted the design on March 14, 1939, and it has not changed since."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Alabama Coat of Arms
  paragraphs:
  - "The Alabama coat of arms began with Marie Bankhead Owen, Director of the Alabama Department of Archives and History. In 1923, she contacted B. J. Tieman, a heraldry expert in New York, and asked him to design a coat of arms for the state. Tieman produced a sketch showing a quartered shield with the flags of five governments, supported by eagles and topped with a ship."
  - "Owen then selected an English motto from a poem by Sir William Jones, an eighteenth-century English scholar. The line she chose — about men who dare to defend their rights — was translated into Latin by Professor W. B. Saffold of the University of Alabama. The Latin phrase became Audemus jura nostra defendere."
  - "Artist Naomi Rabb Winston, who had studied painting at the Corcoran Gallery School of Art in Washington, D.C., was hired to paint the completed design in oils. She also worked with heraldry experts at the Library of Congress to write the formal heraldic description that was later included in the legislation. One detail in the design is historically imprecise: the Union Jack shown for Great Britain is the 1801 version, adopted after Alabama had already left British control."
  - "The design sat without official status for sixteen years. It was Juliet Perry Dixon, wife of Governor Frank Dixon, who pushed for the Legislature to act. State representative James Simpson of Jefferson County introduced the bill in 1939. Both houses passed it without a single dissenting vote on March 14, 1939."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Alabama Coat of Arms
  paragraphs:
  - "The Alabama coat of arms is built around a quartered shield supported by two eagles, with a ship above and a motto scroll below. Each part of the design has a specific historical reference."
  elements:
  - id: shield
    name: The Quartered Shield
    image: /images/coats-of-arms/alabama/elements/shield.svg
    paragraphs:
    - "The shield is divided into four sections. Each section holds the symbol of a government that controlled Alabama's territory at some point in history. The upper left shows France's three golden fleurs-de-lis on blue. The upper right shows the royal coat of arms of Spain — the castle and lion of Castile and León. The lower left shows the Union Flag of Great Britain. The lower right shows the Confederate battle flag."
    - "In the center of the shield, overlapping all four sections, is a smaller shield showing the United States: thirteen red and white vertical stripes under a blue top band. Placing the American shield at the center and on top of all the others was deliberate. It shows that the United States is the final government, the one that holds Alabama today."
  - id: eagles
    name: Two Bald Eagles
    image: /images/coats-of-arms/alabama/elements/eagles.svg
    paragraphs:
    - "A bald eagle stands on each side of the shield, facing inward. According to official state sources, the eagles represent courage. The bald eagle is also the national bird of the United States, which connects the design to American identity."
  - id: crest
    name: The Ship Badine
    image: /images/coats-of-arms/alabama/elements/crest.svg
    paragraphs:
    - "Above the shield, the crest is a model of the Badine, the ship that carried Pierre Le Moyne d'Iberville and Jean-Baptiste Le Moyne de Bienville from France to the Gulf Coast in 1699. That voyage established the first permanent European settlement in what is now Alabama, near present-day Mobile."
    - "Placing the ship above everything else on the coat of arms puts the beginning of European settlement at the top of Alabama's official history."
  - id: motto
    name: Audemus Jura Nostra Defendere
    image: /images/coats-of-arms/alabama/elements/motto.svg
    paragraphs:
    - "The motto appears on a scroll beneath the shield. It reads Audemus jura nostra defendere, Latin for We dare defend our rights. Marie Bankhead Owen chose the English wording from Sir William Jones's 1781 poem An Ode in Imitation of Alcaeus. Professor W. B. Saffold of the University of Alabama translated it into Latin."
    - "The motto is also Alabama's official state motto, adopted the same day as the coat of arms in 1939."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Alabama Coat of Arms
  paragraphs:
  - "The coat of arms treats Alabama's history as a sequence of governments, each one leaving its mark on the land. By placing all five flags on the same shield, the design does not hide the fact that France, Spain, Great Britain, and the Confederacy all held power over Alabama before the United States. The United States shield at the center shows where that sequence ended."
  - "The ship Badine at the top anchors the timeline at its earliest point — French colonial exploration in 1699. The motto below closes it with a statement of present identity: a state that will defend its own rights."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Alabama Coat of Arms Facts
  facts:
  - "Adopted: March 14, 1939, by both houses of the Alabama Legislature without a single dissenting vote."
  - "Original designer: B. J. Tieman of New York, a heraldry expert, who created the first sketch in 1923 at the request of Marie Bankhead Owen."
  - "The oil painting of the design was made by artist Naomi Rabb Winston, who consulted heraldry experts at the Library of Congress to write the formal description used in the legislation."
  - "The motto Audemus jura nostra defendere was drawn from an 1781 poem by English scholar Sir William Jones and translated into Latin by a University of Alabama professor."
  - "The ship on the crest is the Badine, which brought French explorers Iberville and Bienville to the Gulf Coast in 1699 — the voyage that started permanent European settlement near present-day Mobile."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Alabama Coat of Arms
  paragraphs:
  - "Alabama did not use an officially adopted coat of arms before 1939. What survives from earlier years are historical renderings and design-stage images rather than separate legal state coats of arms."
  - "Wikimedia Commons preserves two useful pre-adoption renderings: a decorative 1876 print and a newspaper rendering published in 1899. Both show the same broad heraldic program later formalized in 1939, but neither had official legal status."
