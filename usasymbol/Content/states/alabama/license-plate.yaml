intro_text: "Alabama's best-known license plate slogan is **\"Heart of Dixie,\"** first printed on state plates in 1955. The phrase positioned Alabama as the cultural center of the South — seven decades later, it still defines how most people picture an Alabama plate. Alabama replaced it twice in the 2000s and came back to it both times."
quick_answer: Alabama's defining license plate slogan is "Heart of Dixie," introduced in 1955. Standard plates later carried "Stars Fell on Alabama" (2002–2009) and "Sweet Home Alabama" (2009–2013). Later scenic plate designs returned "Heart of Dixie" as the state's primary phrase.
