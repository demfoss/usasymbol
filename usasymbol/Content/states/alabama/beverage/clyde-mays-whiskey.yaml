faq:
- question: What is Alabama's state beverage?
  answer: Alabama's official symbol in this category is Conecuh Ridge Alabama Fine Whiskey, designated the state spirit in 2004 — not state beverage, though both terms appear in search results.
- question: Is it officially called a state beverage or state spirit?
  answer: State spirit. The Alabama Department of Archives and History lists it as the state spirit. Reference sites sometimes call it a state beverage or state drink for indexing purposes, but the official designation is spirit.
- question: When did Alabama adopt its state spirit?
  answer: Alabama designated Conecuh Ridge Alabama Fine Whiskey as the official state spirit in 2004. The joint resolution passed both chambers, was vetoed by the governor, and took effect after a legislative override.
- question: Did the governor veto it?
  answer: Yes. Governor Bob Riley vetoed the resolution. The Alabama legislature then overrode the veto, allowing the designation to take effect.
- question: Who was Clyde May and why does he matter?
  answer: Clyde May was a Bullock County, Alabama farmer and distiller known for an apple-aged whiskey made outside licensed channels. He served federal prison time for illegal distilling. After his death, a licensed operation produced a version of his recipe under the Conecuh Ridge name. The legislature's 2004 recognition was partly based on this Alabama-specific heritage.
- question: Is the designation still official?
  answer: Yes. Conecuh Ridge Alabama Fine Whiskey remains the official state spirit. The commercial product's ownership history does not affect the state symbol status.
