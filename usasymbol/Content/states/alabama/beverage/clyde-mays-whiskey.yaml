seo_title: 'Alabama State Beverage: The Official State Spirit Explained'
seo_description: 'Alabama''s official state beverage is actually called the state spirit: Conecuh Ridge Alabama Fine Whiskey, adopted in 2004 after a governor''s veto and legislative override. Learn the legal history and the Clyde May story.'
intro_text: Alabama's official symbol in this category is <strong>Conecuh Ridge Alabama Fine Whiskey</strong>, designated the <strong>official state spirit</strong> in <strong>2004</strong>. The designation stands out because it named a specific commercial whiskey brand, passed only after the legislature overrode a governor's veto, and honored a Bullock County moonshiner whose apple-aged recipe came long before any licensed distillery existed. It is one of the more unusual entries on the [full list of Alabama state symbols](/states/alabama).
