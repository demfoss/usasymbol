intro_text: Alabama's state saltwater fish is the fighting tarpon, a giant silver game fish of the Gulf Coast, adopted in 1955. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Alabama?
  paragraphs:
  - The fighting tarpon has been an official Alabama state symbol since 1955. Its scientific name is Megalops atlanticus, and many people know it simply as the tarpon.
  - Lawmakers first named it the state fish. It became the state saltwater fish in 1975, when Alabama named the largemouth bass its state freshwater fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Fighting Tarpon
  paragraphs:
  - The fighting tarpon is a silvery saltwater game fish. Its shiny color earned it the nickname "Silver King."
  - It is a very large fish and can weigh more than 100 pounds. The biggest tarpon ever caught in Alabama weighed 203 pounds.
  - Tarpon are famous for putting up a strong fight when hooked, which helps explain the name fighting tarpon.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - The Alabama Legislature chose the tarpon as the state fish in 1955, and the law was approved on September 9 of that year.
  - The title changed to state saltwater fish in 1975. That was the year lawmakers made the largemouth bass the state freshwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Alabama Chose the Fighting Tarpon
  paragraphs:
  - The 1955 law said visitors liked coming to Alabama to catch tarpon and to meet its friendly people. Lawmakers saw this as good publicity for the state.
  - Tarpon still bring anglers from across the country to the Alabama coast each season.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Fighting Tarpon
  paragraphs:
  - Tarpon live off the Alabama coast in the Gulf of Mexico and in the Mobile estuary. They migrate along the coast and can arrive as early as mid-March.
  - Their numbers peak in July, and most of them leave by October. Anglers look for them in Mobile Bay and near Perdido Pass at Orange Beach.
