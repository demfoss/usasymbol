- id: facts
  icon: fa-solid fa-lightbulb
  title: Fighting Tarpon Facts
  facts:
  - Adopted in 1955 by the Alabama Legislature.
  - Its scientific name is Megalops atlanticus.
  - It is nicknamed the "Silver King" because of its silvery color.
  - The largest tarpon caught in Alabama weighed 203 pounds.
  - Tarpon visit Alabama waters seasonally, with the most fish in July.
faq:
- question: What is Alabama's state fish?
  answer: Alabama has two state fish. The fighting tarpon is the state saltwater fish, and the largemouth bass is the state freshwater fish.
- question: When did Alabama adopt the fighting tarpon?
  answer: The Alabama Legislature named the tarpon the state fish in 1955. It became the state saltwater fish in 1975.
- question: Why did Alabama choose the fighting tarpon?
  answer: The 1955 law said visitors enjoyed catching tarpon in Alabama and meeting its friendly people, which was good publicity for the state.
- question: Why is the tarpon called the Silver King?
  answer: The tarpon has a shiny, silvery body and grows very large. That is how it got the nickname "Silver King."
- question: When can you see tarpon in Alabama?
  answer: Tarpon can arrive off the Alabama coast as early as mid-March. Their numbers peak in July, and most of them leave by October.
