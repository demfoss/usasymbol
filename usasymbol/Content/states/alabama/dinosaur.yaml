faq:
  - question: "What is Alabama's state dinosaur?"
    answer: "Alabama's state dinosaur is Lophorhothon atopus. It was adopted in 1984."

  - question: "Is Lophorhothon a hadrosaur?"
    answer: "It is usually classified as a hadrosauroid, close to duck-billed dinosaurs. Its exact placement is still debated."

  - question: "Why was Lophorhothon found in marine sediment?"
    answer: "Its remains were buried in marine chalk after the carcass likely washed out to sea. That is why the specimen is incomplete."

  - question: "Where is the original Lophorhothon fossil?"
    answer: "The type specimen is at Harvard's Museum of Comparative Zoology."

  - question: "Are there any other dinosaurs from Alabama?"
    answer: "No formally named Alabama dinosaur besides Lophorhothon is widely recognized."

