faq:
  - question: "What is Alabama's state dinosaur?"
    answer: "The species name says it all: atopus means 'strange' or 'out of place' — Romer chose it in 1956 because he couldn't confidently classify what he had. Lophorhothon atopus is Alabama's official state dinosaur, adopted in 1984 from the only named dinosaur Alabama's geology had produced. It's a partial-skeleton hadrosauroid recovered from marine chalk in Dallas County, and its exact position in the hadrosaur family tree has been contested ever since Romer described it."

  - question: "Is Lophorhothon a hadrosaur?"
    answer: "Lophorhothon is generally classified as a hadrosauroid — part of the broader group that includes the duck-billed hadrosaurs — but its exact position within that group is actively debated. Some analyses treat it as a basal hadrosauroid rather than a full member of Hadrosauridae. The fragmentary nature of the known material makes a definitive answer difficult."

  - question: "Why was Lophorhothon found in marine sediment?"
    answer: "The Mooreville Chalk Formation is a marine deposit left by the Western Interior Seaway, the ancient ocean that divided North America during the Cretaceous. Land animals like Lophorhothon occasionally washed out to sea after death and were buried in offshore sediments. This happens regularly with coastal dinosaurs but often results in incomplete specimens."

  - question: "Where is the original Lophorhothon fossil?"
    answer: "The type specimen is held at the Museum of Comparative Zoology at Harvard University, where Thomas Langston Jr. brought it after collecting it in 1946."

  - question: "Are there any other dinosaurs from Alabama?"
    answer: "No other dinosaur species have been formally named from Alabama. The state's geology is dominated by marine Cretaceous formations that don't preserve terrestrial fossils well, which is why Lophorhothon remains the only named dinosaur from the state."

