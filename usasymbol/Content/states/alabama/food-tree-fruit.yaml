    title: "What Is Alabama's State Tree Fruit?"
    paragraphs:
      - "The peach is Alabama's official state tree fruit, designated by the Alabama Legislature in 2006. Peaches are grown commercially across several parts of the state, most notably Chilton County."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Peach"
    paragraphs:
      - "Peaches are round, fuzzy-skinned tree fruits with sweet, juicy flesh. Alabama's peach season runs through the summer months, when local orchards sell fresh peaches at roadside stands and markets."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Peach Became Alabama's State Tree Fruit"
    paragraphs:
      - "The Alabama Legislature designated the peach the official state tree fruit in 2006."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Alabama Chose the Peach"
    paragraphs:
      - "Chilton County has grown peaches commercially for generations, and the crop is closely associated with central Alabama's farming economy and summer roadside markets."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Peach Comes From in Alabama"
    paragraphs:
      - "Chilton County, in central Alabama, is the state's best-known peach-growing region, home to orchards and roadside stands that have sold Alabama peaches for decades."
