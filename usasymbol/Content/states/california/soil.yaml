faq:
- question: What is California's state soil?
  answer: "California's state soil is the San Joaquin series, a reddish-brown loam with a cemented silica hardpan buried about two feet down. It covers more than 500,000 acres in the Central Valley. Governor Pete Wilson signed it into law on August 20, 1997."
- question: Who chose the San Joaquin soil as California's state soil?
  answer: "Eighth-grade students at Martin Luther King, Jr. Middle School in Madera started the campaign as a classroom project under teacher Alex Lehman. State Senator Dick Monteith sponsored the bill. The Professional Soil Scientists Association of California provided the research, and Governor Pete Wilson signed Senate Bill 389 in 1997."
- question: What is a duripan and why does it matter?
  answer: "A duripan is a layer of soil particles cemented together by silica — the same mineral as quartz — until the layer is nearly as hard as rock. It forms where groundwater carrying dissolved silica rises and evaporates, leaving the mineral behind. Plant roots cannot push through it, and water cannot drain past it. Farmers must plan around it when planting deep-rooted crops like almonds."
- question: What color is San Joaquin soil?
  answer: "The surface is brown — an ordinary-looking loam. Below that, the subsoil becomes reddish brown from iron oxide accumulation. Deeper still, a strong brown clay layer transitions abruptly into the duripan, which has a variegated brown and light brown appearance."
- question: Where is San Joaquin soil found in California?
  answer: "San Joaquin soil covers more than 500,000 acres on the eastern side of the Central Valley, in 11 counties: Fresno, Madera, Mariposa, Merced, Placer, Sacramento, San Joaquin, Stanislaus, Sutter, Tulare, and Yuba."
- question: What grows in San Joaquin soil?
  answer: "With irrigation and management of the hardpan layer, San Joaquin soil grows almonds, grapes, figs, oranges, wheat, rice, and pasture grass — nearly 250 different crops. The Central Valley counties where it is found produce about one quarter of the nation's food supply."
- question: How old is the San Joaquin soil series?
  answer: "The San Joaquin series was first described in 1900 during a soil survey of the Fresno area — making it the oldest continuously recognized soil series in California. It has been studied and mapped for over 125 years."

