intro_text: "California's state gem is benitoite, adopted by the California Legislature in 1985 to recognize a rare blue mineral found in gem quality at a single deposit in San Benito County. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: California State Gem
    paragraphs:
      - "Benitoite is California's official state gem, designated by the California Legislature in 1985. It is best known for a deep, sapphire-like blue color, and commercial-quality crystals have been found in gem quantity at only one deposit on Earth, in San Benito County."
      - "The mineral's name comes directly from that county, making it one of the few state gems tied to a single, exclusively in-state source rather than a material also mined elsewhere."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Benitoite?"
    paragraphs:
      - "Benitoite forms small, flat, triangular crystals with a vivid blue color, occasionally colorless, white, or pink, and it fluoresces a bright blue under ultraviolet light. Its color and brilliance have drawn comparisons to sapphire, though benitoite is a different mineral entirely, a barium titanium silicate rather than a form of corundum."
      - "Crystals rarely grow larger than about two centimeters, one reason cut benitoite gems are small and relatively rare even though the mineral was discovered over a century ago."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why California Chose Benitoite as Its State Gem"
    paragraphs:
      - "Benitoite was first identified near the headwaters of the San Benito River in 1907, and gem-quality material in mineable quantity has never been confirmed anywhere else in the world. That exclusivity gave California a genuinely unique claim among all fifty states' gem symbols."
      - "The Benitoite Gem Mine, in the New Idria mining district, continued to produce collector and jewelry-grade crystals through the 20th century, reinforcing San Benito County's identity as the sole commercial source. Naming benitoite the state gem in 1985 recognized a material that, unlike most other state gemstones, genuinely cannot be found growing anywhere else."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Benitoite Became California's State Gem"
    paragraphs:
      - "The California Legislature designated benitoite the official state gem on October 1, 1985."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Benitoite Is Found in California"
    paragraphs:
      - "The Benitoite Gem Mine, in the New Idria mining district of San Benito County, is the source of essentially all gem-quality benitoite ever found. The deposit sits near the headwaters of the San Benito River, close to Santa Rita Peak."
    sites:
      - name: Benitoite Gem Mine
        city: New Idria
        lat: 36.4169
        lng: -120.6733
        note: "Only known gem-quality benitoite source"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Benitoite Facts"
    facts:
      - "Adopted as California's state gem in 1985."
      - "Benitoite was first identified near the San Benito River in 1907 and is named after San Benito County."
      - "Gem-quality benitoite in mineable quantity has never been confirmed at any other location in the world."
      - "Benitoite fluoresces bright blue under ultraviolet light."

