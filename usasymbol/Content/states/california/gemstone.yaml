faq:
  - question: What is California's state gem?
    answer: "California's state gem is benitoite, a rare, deep blue mineral first identified in San Benito County in 1907."
  - question: When did California adopt benitoite as its state gem?
    answer: "The California Legislature designated benitoite the official state gem on October 1, 1985."
  - question: Why did California choose benitoite?
    answer: "Gem-quality benitoite has only ever been confirmed in mineable quantity at one deposit, in San Benito County, giving California a gem material unique to the state."
  - question: Is benitoite rare?
    answer: "Yes. Crystals rarely grow larger than about two centimeters, and the Benitoite Gem Mine in San Benito County remains essentially the only commercial source in the world."

