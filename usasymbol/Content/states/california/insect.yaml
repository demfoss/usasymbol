sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of California?
  paragraphs:
  - "The California dogface butterfly, Zerene eurydice, is California's official state insect. The California Legislature designated it in 1972."
  - "California was the first state in the country to name an official state insect, and the dogface butterfly is found nowhere else in the world."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the California Dogface Butterfly
  paragraphs:
  - "The male dogface butterfly has black-edged forewings enclosing a patch of yellow-orange marked with two black dots. Held together, the black edges form a shape that looks like the silhouette of a dog's head, which is where the butterfly gets its name."
  - "Females are almost entirely yellow, with a black dot or two on each forewing, and are slightly larger than males. Adults have a wingspan of roughly 2 to 2.5 inches."
  - "Caterpillars are green with small dots and a white stripe down each side, and feed only on false indigo, a shrub in the pea family."

- id: history
  icon: fa-solid fa-landmark
  title: How California Chose the Dogface Butterfly
  paragraphs:
  - "The push for a state insect began in 1929, but the designation did not become official for more than four decades."
  - "Fourth-grade students at Dailey Elementary School in Fresno, taught by Betty Harding and Shirley Klein, campaigned for the dogface butterfly and enlisted the help of state Assemblyman Kenneth L. Maddy."
  - "Maddy authored the bill, and the California Legislature made the dogface butterfly the official state insect in 1972."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the California Dogface Butterfly
  paragraphs:
  - "The dogface butterfly lives only in California, mainly in foothill chaparral, oak woodland, and coniferous woodland, wherever its host plant, false indigo, grows."
  - "It ranges from the Sierra Nevada foothills and Coast Ranges of north-central California south into Southern California mountains such as the San Bernardino and Santa Ana ranges."

- id: facts
  icon: fa-solid fa-lightbulb
  title: California Dogface Butterfly Facts
  facts:
  - "Adopted: 1972, by the California Legislature, making California the first state to name an official state insect."
  - "Scientific name: Zerene eurydice."
  - "Males have black-edged, yellow-orange forewings that form the silhouette of a dog's head when open, which is where the name comes from."
  - "Females are almost entirely yellow and slightly larger than males, with a wingspan of roughly 2 to 2.5 inches."
  - "Found only in California, and appeared on a U.S. postage stamp in a 1977 series honoring American butterflies."




