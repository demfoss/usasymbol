faq:
- question: What is California's state insect?
  answer: "California's state insect is the California dogface butterfly, adopted by the California Legislature in 1972."
- question: When did California adopt the dogface butterfly?
  answer: "California adopted the dogface butterfly as its official state insect in 1972, becoming the first state to name an official state insect."
- question: Why did California choose the dogface butterfly?
  answer: "Fourth-grade students at Dailey Elementary School in Fresno campaigned for the dogface butterfly and enlisted state Assemblyman Kenneth L. Maddy, who authored the bill that made it official in 1972."
- question: What does the California dogface butterfly look like?
  answer: "Males have black-edged, yellow-orange forewings that form the silhouette of a dog's head when open. Females are almost entirely yellow with a black dot or two on each forewing."
- question: Where is the dogface butterfly found?
  answer: "It lives only in California, in foothill chaparral and oak or coniferous woodland from the Sierra Nevada foothills and Coast Ranges south into Southern California mountains such as the San Bernardino and Santa Ana ranges."
- question: Is the dogface butterfly California's state insect or state butterfly?
  answer: "California's official designation is state insect, adopted in 1972. California does not have a separate state butterfly designation."

