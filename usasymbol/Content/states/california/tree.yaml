seo_title: "California State Tree | California Redwood"
seo_description: 'California named the redwood its state tree in 1937, honoring the coast redwood and giant sequoia forests that made the state famous.'

intro_text: "The California state tree is the <strong>California Redwood</strong>, commonly known as the <strong>Coast Redwood</strong> (<em>Sequoia sempervirens</em>), adopted in <strong>1937</strong>. California chose this tree because it is native to the state's foggy coast, grows taller than any other tree species on Earth, and represents the ancient redwood forests that define Northern and Central California. If you are looking for the state tree of California, the direct answer is California Redwood; it also appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the California State Tree?"
    paragraphs:
      - "The Coast Redwood holds the position of California's official state tree. These notable conifers claim the title of world's tallest tree species. Individual specimens regularly exceed 300 feet in height, with the tallest known redwood reaching 380 feet. That's taller than the Statue of Liberty, including its pedestal."
      - "Redwood bark displays a distinctive reddish-brown color and fibrous texture. The bark grows exceptionally thick, reaching 12 inches in mature specimens. This thickness provides natural fire resistance, allowing redwoods to survive forest fires that destroy other tree species. The foliage consists of flat, needle-like leaves arranged in feathery sprays along the branches."
      - "Coast Redwoods grow naturally only in a narrow coastal strip extending from southern Oregon through central California. This range spans approximately 450 miles in length but rarely extends more than 50 miles inland. The trees require consistent fog and moderate temperatures. Coastal fog provides up to 40% of the moisture redwoods need during California's dry summer months."

  - id: name
    icon: "fa-solid fa-tag"
    title: "California State Tree Name"
    paragraphs:
      - "The common name is California Redwood or Coast Redwood. The scientific name is Sequoia sempervirens. The genus name Sequoia honors Sequoyah, the Cherokee scholar who created the Cherokee syllabary. The species name sempervirens means 'evergreen' in Latin, referring to the tree's year-round foliage."
      - "This species belongs to the Cupressaceae family, the cypress family. People sometimes confuse Coast Redwoods with their relatives, the Giant Sequoias (Sequoiadendron giganteum). Giant Sequoias grow in California's Sierra Nevada mountains and claim the title of world's largest trees by volume. Coast Redwoods, however, hold the record for height."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Redwood Became the California State Tree"
    paragraphs:
      - "The California Legislature designated the Coast Redwood as the state tree in 1937. This selection recognized the redwood's status as California's best-known and economically significant tree. The redwood logging industry had shaped California's development since the Gold Rush era, providing lumber for San Francisco's expansion and supporting coastal communities tied to [the Golden State nickname](/states/california/nickname/the-golden-state)."
      - "Conservation efforts played a crucial role in the designation. By the 1930s, extensive logging had destroyed more than 90% of California's original old-growth redwood forests. The Save the Redwoods League, founded in 1918, had campaigned vigorously to preserve remaining groves. The state tree designation helped raise public awareness about redwood conservation."
      - "The redwood's distinctive status as the world's tallest tree made it a natural choice for representing California. No other state could claim such a distinctive species. The tree embodied California's reputation for superlatives and natural wonders. Its ability to thrive only in California's specific coastal climate reinforced the state's distinctive coastal range."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "California State Tree Facts"
    facts:
      - "Coast Redwoods are the tallest trees on Earth, with the record holder 'Hyperion' measuring 380.3 feet tall"
      - "These trees can live for over 2,000 years, with some ancient specimens exceeding 2,200 years old"
      - "California adopted the redwood as its state tree on March 8, 1937"
      - "Redwood bark contains no resin or pitch, making it highly fire-resistant and allowing trees to survive multiple forest fires"
      - "A single mature redwood can absorb 250 tons of carbon dioxide from the atmosphere during its lifetime"
      - "Redwoods possess the unique ability to sprout new growth from their stumps and roots, creating 'fairy rings' of genetically identical trees"
      - "The wood's natural resistance to decay and insects made redwood California's primary building material for over a century"
      - "Coastal fog drips from redwood branches and needles, adding up to 10 inches of precipitation annually to the forest floor"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "California State Tree and Flower"
    paragraphs:
      - "California's state flower is the California Poppy (Eschscholzia californica), designated in 1903. The golden poppy was one of America's earliest state flower selections. Both the Coast Redwood and California Poppy are official symbols of California; see [California's poppy page](/states/california/flower/california-poppy) for floral history. The bright orange-gold poppy carpets California hillsides each spring, while the towering redwoods define the state's northern coastal landscape. Together, these symbols represent California's diverse ecosystems, from coastal forests to inland grasslands."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a California Redwood"
    paragraphs:
      - "Coast Redwoods display several distinctive features that make identification straightforward. The reddish-brown bark provides the most obvious visual marker. The bark's fibrous, texture with deep furrows appears almost spongy. When you touch redwood bark, it feels soft compared to other conifers."
      - "The foliage consists of flat, dark green needles arranged in two rows along the twigs. Each needle measures about half an inch long. Lower branches produce scale-like leaves similar to those found on cypress trees. The overall tree shape forms a narrow, conical crown that tapers dramatically toward the top."
      - "Mature redwoods develop massive, straight trunks that soar upward with minimal taper. The trunk's base often shows fire scars from historical burns. Many ancient trees display large burls—swollen growths that can sprout new trees. Redwood cones measure just three-quarters to one inch long, remarkably small for such enormous trees."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Coast Redwood symbolizes strength, longevity, and resilience in California culture. Its ability to survive for millennia and withstand fire represents endurance through adversity. The tree's towering height points to the scale and age that made redwoods famous. In environmental movements, the redwood has become an emblem of conservation efforts and ecological stewardship. Its presence in California's character reflects the state's commitment to preserving natural wonders for future generations and is often presented beside [the California state flag](/states/california/flag/california-state-flag)."
      - "From a regional planning lens, redwood range and policy are also discussed with [States That Border California](/states/california/borders) and growth comparisons such as [U.S. states by population](/rankings/demographics/states-by-population)."

faq:
  - question: "What is the California state tree?"
    answer: "The Coast Redwood (Sequoia sempervirens) is California's official state tree, designated by the state legislature in 1937."
  
  - question: "What is the California state tree called?"
    answer: "California's state tree is called the Coast Redwood, California Redwood, or by its scientific name Sequoia sempervirens. It's the world's tallest tree species."
  
  - question: "When was California's state tree adopted?"
    answer: "California adopted the Coast Redwood as its state tree on March 8, 1937. The designation recognized the redwood's significance to California's ecology and economy."
  
  - question: "Why is the redwood California's state tree?"
    answer: "California chose the Coast Redwood because it's the world's tallest tree species and grows naturally only in California's coastal regions. The selection also supported conservation efforts during the 1930s when logging had destroyed most old-growth redwood forests. The tree's distinctive status and economic importance made it an ideal symbol for the state."
  
  - question: "What is the California state tree name?"
    answer: "The name is Coast Redwood or California Redwood. The scientific name is Sequoia sempervirens, which means 'evergreen sequoia' in Latin."
  
  - question: "Where do California redwood trees grow?"
    answer: "Coast Redwoods grow naturally only along California's coast from southern Oregon to central California, in a narrow strip rarely extending more than 50 miles inland. They require coastal fog and moderate temperatures to thrive."
  
  - question: "What are some facts about the California state tree?"
    answer: "Coast Redwoods are Earth's tallest trees, reaching over 380 feet. They can live more than 2,000 years, resist fire with their thick bark, and absorb massive amounts of carbon dioxide. The trees grow only in California's foggy coastal regions and can sprout new growth from stumps."
  
  - question: "What is the difference between a redwood and a giant sequoia?"
    answer: "Coast Redwoods (Sequoia sempervirens) are the world's tallest trees and grow along California's coast. Giant Sequoias (Sequoiadendron giganteum) are the world's largest trees by volume and grow in the Sierra Nevada mountains. Both are related species but adapted to different environments."

