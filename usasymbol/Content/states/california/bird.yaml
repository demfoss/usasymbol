title: California Quail
scientific_name: Callipepla californica
adopted_year: 1931
legislation: Cal. Gov. Code 423; Assembly Bill 776, Chapter 777 (1931)
meaning: California chose a bird that already carried the state's name. The designation worked because the species was both native and widely recognizable, and the law elevated it not only to state bird but to the state's avifaunal emblem.
conservation_status: Least Concern
habitat: Chaparral, oak woodland, brushy edges, open ground near cover
size: 9.5-11 inches (24-28 cm)
wingspan: 14-15 inches (36-38 cm)
weight: 5-7 oz (140-200 g)
shared_states_text: Only State
distinctive_song: Sharp chi-ca-go call
coloration: Gray body with a dark forward-curving plume
coloration_details: Scaled belly and chestnut flanks
author: USA Symbol Team
date_published: '2024-01-15'
date_modified: '2026-03-27'
seo_title: 'California State Bird: California Quail'
seo_description: California's state bird is the California Quail, adopted in 1931. Learn what the law says, why it is not the condor, and why the choice still fits the state.
intro_text: 'California''s official state bird is the <strong>California Quail</strong>, adopted in <strong>1931</strong>. That also clears up a common point of confusion: the state bird is <strong>not</strong> the California condor. Current law gives the quail a broader title than many state symbols receive, calling it the official <strong>bird and avifaunal emblem</strong> of the State. The statutory wording uses the older name <strong>California valley quail</strong>, but the basic idea has not changed. California chose a native bird that already carried the state''s name and already belonged to the brushy, open landscapes many people associate with California.'
