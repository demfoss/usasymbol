sections:
- id: state-named-bird
  icon: fa-solid fa-feather-pointed
  title: A Bird Named After the State Before Any Law Said So
  paragraphs:
  - California did not have to invent a connection between this bird and the state. The species was already called the California quail — or the California valley quail in older common usage — long before any legislature acted. The name came first. The designation made it official.
  - That origin gave the 1931 choice unusual straightforwardness. The quail inhabits chaparral, oak woodland, coastal scrub, and foothill brush — terrain that runs through much of the state from north to south — so it carried both the name and a recognizable geographic claim. Placed beside the [California Poppy](/states/california/flower/california-poppy) and the [grizzly bear](/states/california/mammal/grizzly-bear), the quail completes a group of state symbols that are specifically Californian without belonging to any one corner of the state.
- id: what-the-law-made-official
  icon: fa-solid fa-scale-balanced
  title: What the 1931 Law Actually Says
  paragraphs:
  - Assembly Bill 776, Chapter 777 created the designation in 1931. Current Government Code section 423 keeps it in force — and uses language broader than most state bird laws. The quail is named the official <em>bird and avifaunal emblem</em> of the State, a formulation that goes beyond the standard phrase and gives the designation a more formal reach.
  - The statute also preserves older naming. It uses <em>California valley quail</em> as the common name and <em>Lophortyx californica</em> as the scientific name. Modern ornithological references reclassified the species into the genus <em>Callipepla</em> — so the bird is now listed as <em>Callipepla californica</em> in current field guides. California's law has never been updated to reflect that change, which means the statute holds a pre-reclassification snapshot of the species in the state's current code.
- id: why-not-the-condor
  icon: fa-solid fa-question-circle
  title: Why the Quail and Not the Condor
  paragraphs:
  - The California Condor is the bird most people associate with California by name, but it has never been the state's official bird. The confusion is understandable — the condor is one of the largest flying birds in North America and has been a focus of conservation efforts specific to California. The quail is quieter by comparison.
  - In 1931, the condor's range was already limited to a relatively narrow band along California's coastal mountains in the south and central parts of the state. It was not a bird that most Californians would encounter. The quail, by contrast, lived across a far wider stretch of the state's terrain — the kind of bird a resident of the Bay Area, the Central Valley foothills, or the inland south might all plausibly see.
  - The quail also already bore California's name. That combination — statewide presence plus an identity already tied to the state — made the case for designation straightforward enough that the 1931 legislature did not need to reach past it.
faq:
- question: Is California's state bird the California condor?
  answer: No. California's official state bird is the California Quail. The condor is a famous California bird, but it is not the state's bird symbol.
- question: Why does California law call it the California valley quail?
  answer: Because the statute preserves older legal wording. Modern bird references usually say California Quail, but California law still uses the older form California valley quail.
- question: What does California law actually make official?
  answer: California Government Code section 423 does more than call the quail the state bird. It designates the California valley quail as the official bird and avifaunal emblem of the State.
- question: When did California adopt the California Quail?
  answer: California adopted the quail in 1931 through Assembly Bill 776, Chapter 777. The current code keeps that designation in force.
