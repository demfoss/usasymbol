title: "Eureka"
language: "Greek"
english_translation: "I Have Found It"
adopted_year: 1963

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-05-02"
seo_title: "California State Motto | Eureka! I have found it!"
seo_description: "California's state motto is 'Eureka!' meaning 'I have found it.' It appears on the state seal and refers to the 1848 gold discovery that launched the Gold Rush."

intro_text: "California's official motto is <strong>Eureka</strong> — a Greek word meaning <em>I Have Found It</em>. It is the only motto in ancient Greek among all 50 states. The word appeared on California's Great Seal in 1849, chosen during the Constitutional Convention at Monterey as the Gold Rush transformed the territory. Despite appearing on the state seal for over a century, the legislature didn't formally designate it as the official motto until 1963."

sections:
  - id: "only-greek-motto"
    icon: "fa-solid fa-globe"
    title: "The Only Greek Motto in the United States"
    paragraphs:
      - "Twenty-three states use Latin mottos. Twenty-two use English. The remaining five use Hawaiian, French, Spanish, Italian, or Chinook Jargon. California stands alone with ancient Greek. The word εὕρηκα (heurēka) is the first-person singular perfect active form of εὑρίσκω — 'to find.' It means 'I have found it,' specifically referencing a completed act of discovery."
      - "Delegates at California's 1849 Constitutional Convention chose it for the Great Seal because it suited the Gold Rush moment perfectly. James Marshall had found gold at Sutter's Mill in January 1848. By 1849, tens of thousands of prospectors were flooding into California from every direction. A word about finding something — rooted in the ancient story of Archimedes discovering gold purity through water displacement — fit the era precisely."
      - "Major R. S. Garnett of the U.S. Army designed the seal's imagery. Convention clerk Caleb Lyon proposed the design to the delegates. They placed 'Eureka' at the top of the circular seal, above Minerva and a working gold miner."

  - id: "two-discoveries"
    icon: "fa-solid fa-magnifying-glass"
    title: "Two Discoveries Behind One Word"
    paragraphs:
      - "The motto carries two layered meanings. The first is literal and Californian: James Marshall's gold discovery at Sutter's Mill on January 24, 1848, launched one of the largest gold rushes in history. California's population exploded from around 14,000 in 1848 to over 250,000 by 1852. The Gold Rush pulled in miners from China, Mexico, Chile, Australia, and across Europe. 'I have found it' described what every prospector hoped to shout."
      - "The second meaning reaches back to antiquity. According to legend, the Greek mathematician Archimedes (c. 287–212 BCE) was asked by King Hiero II of Syracuse to determine whether a gold crown had been diluted with silver. While lowering himself into a bath, he noticed that water spilled over the edge in proportion to his body's volume. He realized the same principle could test the crown — and supposedly shouted 'Eureka!' as he ran through the streets. Whether or not the story is literally true, it tied California's gold discovery to a 2,000-year-old tradition of scientific discovery."

  - id: "114-years-unofficial"
    icon: "fa-solid fa-clock-rotate-left"
    title: "On the Seal for 114 Years Before Becoming Official"
    paragraphs:
      - "'Eureka' appeared on California's Great Seal in 1849 and on the state flag from 1911 onward. But for 114 years, no California statute formally designated it as the state motto. It was used everywhere — just not legally defined."
      - "In 1957, some legislators moved to replace 'Eureka' with 'In God We Trust,' the same phrase used as the U.S. national motto since 1956. The motion failed. Six years later, in 1963, the California legislature resolved the ambiguity by formally adopting 'Eureka' as the official state motto through Statutes, Chapter 1237. The California Government Code now confirms it in the description of the state seal."
      - "California had also done something no other territory did: it skipped territorial status entirely and went straight to statehood. Delegates wrote a constitution in 1849, Congress admitted California as the 31st state on September 9, 1850, and the seal with its Greek motto came along with statehood from day one."

  - id: "eureka-across-california"
    icon: "fa-solid fa-location-dot"
    title: "Eureka Across the State"
    paragraphs:
      - "Seventeen California locations carry the name Eureka. The largest is Eureka, the seat of Humboldt County on the Northern California coast, founded in 1850. Miners named the town during the Gold Rush. It remains the largest city on the Pacific coast between San Francisco and Portland."
      - "The motto appears on California's Great Seal — showing Minerva, a grizzly bear, a miner, ships on the Sacramento River, and Sierra Nevada peaks — and on the state flag. Government documents, official letterhead, and state buildings use the seal. Tech culture in Silicon Valley has adopted the word informally as a shorthand for breakthrough moments, extending the motto's reach into modern usage."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "California State Motto Facts"
    style: "gradient"
    facts:
      - "California is the only U.S. state with a motto in ancient Greek."
      - "'Eureka' appeared on the state seal in 1849 but wasn't officially designated by statute until 1963."
      - "In 1957, legislators tried to replace it with 'In God We Trust' — the motion failed."
      - "Caleb Lyon, a convention clerk, proposed the seal design including 'Eureka' to the 1849 delegates."
      - "Seventeen California locations are named Eureka, including a city in Humboldt County founded in 1850."
      - "California skipped territorial status and became the 31st state directly on September 9, 1850."

faq:
  - question: "What is California's state motto?"
    answer: "California's state motto is 'Eureka,' a Greek word meaning 'I Have Found It.' It appeared on the state seal since 1849 and was officially designated as the state motto by the legislature in 1963."

  - question: "What language is California's motto in?"
    answer: "Ancient Greek — making California the only state with a Greek motto. All other states use Latin, English, or other modern languages. The Greek word εὕρηκα (heurēka) means 'I have found it,' from the verb 'to find.'"

  - question: "What does 'Eureka' mean and why did California choose it?"
    answer: "'Eureka' means 'I Have Found It.' California delegates chose it in 1849 during the Gold Rush because it captured the moment of discovery — James Marshall had found gold at Sutter's Mill in 1848, and the word connected that event to the legend of Archimedes, who reportedly shouted it after discovering how to test gold purity."

  - question: "When did California officially adopt 'Eureka' as its motto?"
    answer: "The California legislature officially adopted it in 1963 through Statutes, Chapter 1237 — 114 years after it first appeared on the state seal in 1849."

  - question: "Did California ever try to change its motto?"
    answer: "Yes. In 1957, some legislators proposed replacing 'Eureka' with 'In God We Trust' — the same year that phrase became the U.S. national motto. The motion failed, and the legislature instead confirmed 'Eureka' as the official motto in 1963."

  - question: "Where does California's motto appear?"
    answer: "On the Great Seal (showing Minerva, a grizzly bear, a miner, Sacramento River ships, and Sierra Nevada peaks, with 'Eureka' at the top), the state flag, government buildings, official documents, and state letterhead."

