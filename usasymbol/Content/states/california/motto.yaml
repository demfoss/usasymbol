seo_description: "California's state motto is \"Eureka,\" a Greek word meaning \"I Have Found It.\" It appeared on the state seal in 1849 and was officially adopted in 1963."

intro_text: "California's state motto is <strong>Eureka</strong>, a Greek word meaning <em>I Have Found It</em>. It appeared on the state seal in 1849 and was officially adopted by the legislature in 1963 — making California the only U.S. state with a motto in ancient Greek."

