faq:
  - question: "What is California's state motto?"
    answer: "California's state motto is \"Eureka,\" a Greek word meaning \"I Have Found It.\" It appeared on the state seal since 1849 and was officially designated as the state motto by the legislature in 1963."

  - question: "What language is California's motto in?"
    answer: "Ancient Greek — making California the only state with a Greek motto. The Greek word εὕρηκα (heurēka) means \"I have found it,\" from the verb \"to find.\" All other states use Latin, English, or other modern languages."

  - question: "What does \"Eureka\" mean?"
    answer: "\"Eureka\" means \"I Have Found It\" in ancient Greek. California chose it in 1849 during the Gold Rush because it captured the moment of discovery — James Marshall had found gold at Sutter's Mill in January 1848, launching the Gold Rush."

  - question: "When did California officially adopt \"Eureka\" as its motto?"
    answer: "The California legislature officially adopted it in 1963 through Statutes, Chapter 1237 — 114 years after it first appeared on the state seal in 1849."

  - question: "Did California ever try to change its motto?"
    answer: "Yes. In 1957, legislators proposed replacing \"Eureka\" with \"In God We Trust\" — the year that phrase became the U.S. national motto. The motion failed, and the legislature instead confirmed \"Eureka\" as the official motto in 1963."

  - question: "Where does California's motto appear?"
    answer: "Eureka appears at the top of the Great Seal (above Minerva, with the grizzly bear, miner, ships, and Sierra Nevada), on the state flag, government documents, official letterhead, and state buildings."

