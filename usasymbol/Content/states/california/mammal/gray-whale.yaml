title: "California State Marine Mammal | Gray Whale"
scientific_name: "Eschrichtius robustus"
adopted_year: 1975

seo_title: "California State Marine Mammal | Gray Whale"
seo_description: "California's state marine mammal is the Gray Whale, adopted in 1975. Learn why this official California symbol was chosen and what it represents."

intro_text: "The Gray Whale is the official California state marine mammal, designated in 1975. This page gives the direct answer for searches like 'california state marine mammal', 'california state animal', and 'california state mammal' while explaining how the symbol fits the state's official animal designations. Making one of the longest migrations of any mammal on Earth; symbolizing one of the most successful wildlife recoveries in American history."

common_name: "Gray Whale"
official_since: "1975"
status: "Least Concern (recovered; removed from endangered list in 1994)"
habitat_in_state: "Coastal Pacific Ocean waters from San Diego to the Oregon border during winter migration; breeding lagoons in Baja California, Mexico"
known_for: "Making one of the longest migrations of any mammal on Earth; symbolizing one of the most successful wildlife recoveries in American history"

size: "40 to 50 feet in length"
weight: "Adults: 80,000–120,000 pounds (40–60 tons)"
coloration: "Dark gray to mottled gray-white, often covered in barnacles and whale lice that give a patchy appearance"
distinctive_traits: "No dorsal fin; small eye patches; two blowholes on top of the head; heavy, barnacle-covered skin; relatively flat mouth compared to other whales"

habitat: "Coastal shallows during migration, Arctic seas during summer feeding, tropical lagoons during winter breeding"
range_in_state: "Migrates along the entire California coast from December through April; closest to shore near rocky headlands and submarine canyons"
conservation_status: "Population estimated at 25,000–27,000; removed from the Endangered Species List in 1994 after recovering from fewer than 2,000 animals in the early 1900s"
where_to_find: "Point Reyes National Seashore, Depoe Bay (Oregon border area), Año Nuevo State Park, La Jolla Cove; whale watching tours from nearly every coastal town December through April"
symbol_connections: "The gray whale pairs with the grizzly bear to form California's land-and-sea symbol set. Both species nearly vanished and tell stories of loss and recovery. The gray whale's migration along the coast connects it to the Golden State's identity as a place shaped by the Pacific Ocean."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The California Legislature designated the gray whale as the state marine mammal in 1975. The law gave California one of the first official marine mammal symbols in the nation."
      - "The timing was deliberate. Three years earlier, in 1972, the United States passed the Marine Mammal Protection Act, banning the hunting of marine mammals in American waters. California's designation honored that landmark shift in how the country treated ocean wildlife, and it complemented [California's state motto](/states/california/motto/eureka)."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "Gray whales had been swimming past California's coast for millennia before anyone thought to make them a state symbol. The push came during the early 1970s, when scientists confirmed that the species was recovering from near-extinction. Whale watching was becoming a major pastime along the coast. Californians were beginning to see gray whales not as targets but as neighbors, and the legislature reflected that change."

      - subtitle: "Why California Chose the Gray Whale"
        text: "Several whale species pass through California waters, but only the gray whale migrates close enough to shore for ordinary residents to see. Its route hugs the coastline for thousands of miles, making it the most visible and accessible marine mammal in the state. That visibility made it the natural choice to represent California's connection to the Pacific Ocean."

  - id: "state-symbolism"
    title: "What the Gray Whale Represents"
    style: "highlight"
    paragraphs:
      - "The gray whale represents endurance and return. After coming within a few thousand animals of extinction, the species came back in numbers that scientists once thought impossible. California chose a symbol that proved recovery was real and consistent with [the Golden State identity](/states/california/nickname/the-golden-state)."
      - "For centuries before European arrival, Indigenous peoples along the California coast lived alongside gray whales. The Chumash, Tongva, and other groups observed whale migrations as seasonal markers and used beached whales as valuable resources."
      - "Today the gray whale is woven into coastal California culture. Whale watching draws hundreds of thousands of visitors each winter. Entire communities from San Diego to the Oregon border organize festivals, boat tours, and school programs around the migration."

    subsections:
      - subtitle: "The Migration as a Symbol"
        text: "Gray whales travel roughly 12,000 miles each way between their Arctic feeding grounds and breeding lagoons in Baja California, Mexico. That route passes directly along the California coast. The sheer scale of this journey—one of the longest of any mammal on Earth—made the gray whale a symbol of something bigger than any single species. It represents the idea that California sits along one of nature's great highways."

      - subtitle: "Indigenous Coastal Heritage"
        text: "The Chumash people of southern California and the Tongva of the Los Angeles Basin both lived closely alongside marine life, including whales. Whales that washed ashore provided meat, oil, and bone for tools. Some Chumash communities marked whale arrivals as seasonal events tied to the broader rhythm of coastal life. Choosing the gray whale as a state symbol quietly honored thousands of years of human observation along this coastline."

      - subtitle: "The Whaling Collapse"
        text: "Commercial whaling hit gray whales hard in the 1800s. Shore-based whalers in California targeted grays along the coast, and ships followed them into their Baja California breeding lagoons. By the early 1900s, the population had fallen to somewhere between 2,000 and 3,000 animals. Scientists debated whether gray whales would survive the century at all."

      - subtitle: "Recovery and Protection"
        text: "International whaling agreements in the 1940s began reducing the pressure on gray whales. The U.S. Endangered Species Act of 1973 and the Marine Mammal Protection Act of 1972 provided strong legal protection. By the 1980s, gray whale numbers were climbing steadily. In 1994, the species was removed from the endangered list—one of the first marine mammals to earn that status. The recovery was driven by laws passed largely because of public pressure from states like California."

      - subtitle: "Whale Watching as a Cultural Shift"
        text: "Before the 1970s, most Californians thought of whales primarily as targets for the whaling industry. The shift to whale watching represented a broader change in how Americans valued wildlife. Gray whales became the face of that change. Today, whale watching along the California coast generates over $100 million in tourism revenue annually. Schools use the migration to teach biology, geography, and conservation—making the state marine mammal a classroom tool as well as a symbol."

  - id: "identification"
    title: "How to Identify Gray Whales"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Gray whales are large, heavy-bodied animals with mottled dark gray skin. Over time, barnacles and whale lice attach to their skin and give adults a patchy, lighter appearance. They have no dorsal fin—only a series of small bumps along the lower back near the tail."
        list_items:
          - "**Size**: 40–50 feet long"
          - "**Weight**: 80,000–120,000 pounds (40–60 tons)"
          - "**Color**: Dark gray, often mottled with white patches from barnacles"
          - "**Distinguishing features**: No dorsal fin; two blowholes; heavy barnacle-covered skin; relatively flat, narrow mouth"

      - subtitle: "Behavior and Feeding"
        text: "Gray whales are bottom feeders during summer months in Arctic seas. They suck mud and sand from the ocean floor and filter out tiny crustaceans called amphipods. During migration, they do not feed much. In their Baja California breeding lagoons, mothers give birth and nurse calves for several weeks before the return journey north begins."

  - id: "in-the-state"
    title: "Gray Whales in California"
    style: "default"

    paragraphs:
      - "Gray whales pass through California waters twice each year—once heading south in December and January, and again heading north in March and April. The northbound migration brings mothers and newborn calves close to shore, making them easier to spot."
      - "The current population of 25,000 to 27,000 animals represents a full recovery. Before commercial whaling began in the 1800s, scientists estimate the population was roughly similar in size; coastal pressure context is often compared in [U.S. states by population](/rankings/demographics/states-by-population)."

    facts:
      - "**Migration timing**: Southbound December–January; northbound March–April"
      - "**Closest approach to shore**: Rocky headlands and submarine canyons along central and southern California"
      - "**Population**: 25,000–27,000 (Eastern Pacific stock)"
      - "**Breeding lagoons**: San Ignacio, San Rafael, and Scammon's Lagoon in Baja California, Mexico (UNESCO World Heritage Site)"

  - id: "where-to-see"
    title: "Where to See California's State Marine Mammal"
    style: "default"

    paragraphs:
      - "Gray whales are visible from the California coast for roughly four months each year. Headlands and rocky promontories offer the best natural vantage points. Whale watching boat tours operate out of dozens of coastal towns from December through April."

    list_items:
      - "**Point Reyes National Seashore**: One of the best spots on the Northern California coast; the lighthouse headland offers sweeping ocean views during migration season"
      - "**Año Nuevo State Park**: Located between San Francisco and Santa Cruz; gray whales pass offshore and the park offers ranger-led whale watching programs"
      - "**La Jolla Cove, San Diego**: Southern California's premier whale watching location; boat tours and kayak excursions run from December through March"
      - "**Scripps Coastal Reserve**: Part of La Jolla; the cliffs provide unobstructed views of migrating whales without the need for a boat"
      - "**Redwood Coast (Del Norte and Humboldt Counties)**: Northern California headlands where gray whales pass during both legs of migration; fewer crowds than southern California"
      - "**Monterey Bay**: Home to Monterey Bay Aquarium, which offers exhibits on gray whale migration and California marine conservation year-round"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "Gray whales are no longer endangered. The Eastern Pacific population, which migrates along the California coast, was removed from the Endangered Species List in 1994. The recovery is considered one of the greatest conservation success stories in American history."
      - "The population has stabilized at roughly pre-whaling levels. Scientists continue monitoring the species to track long-term health and detect any early signs of decline."

    subsections:
      - subtitle: "Threats and Challenges"
        text: "Climate change is the most significant threat to gray whales today. Warming Arctic waters are shifting the distribution of amphipods and other prey, which could affect feeding success. Ship strikes from commercial vessels kill an estimated 70 to 100 gray whales per year along the Pacific coast. Entanglement in fishing gear and ocean noise from shipping also pose ongoing risks."

      - subtitle: "Management and Monitoring"
        text: "The National Marine Fisheries Service and the International Whaling Commission both monitor gray whale populations. Annual population surveys use aerial counts and shore-based observations to track numbers. California state agencies work with federal partners to enforce protections under the Marine Mammal Protection Act and the Endangered Species Act. Vessel speed restrictions in key migration corridors are under discussion to reduce ship strike risk."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The gray whale and the grizzly bear together form California's paired mammal symbols—one for land, one for sea. Both species nearly vanished during the state's history. The grizzly bear is gone forever; the gray whale came back. Side by side, they tell the full story of what California has lost and what it managed to save, with legal representation tied to [California's state flag](/states/california/flag/california-state-flag)."
      - "California's coastline is central to the state's identity, and the gray whale is the symbol that represents it. From San Diego to the Oregon border, coastal communities organize their winters around the whale migration. No other state symbol captures California's relationship with the Pacific Ocean as directly."

    subsections:
      - subtitle: "The Grizzly Bear: Land and Sea"
        text: "California designated the grizzly bear as state animal in 1953 and the gray whale as state marine mammal in 1975. The grizzly bear is extinct; the gray whale recovered fully. Together they represent California's two great conservation stories—one a cautionary tale, the other a cause for hope. Both species once numbered in the tens of thousands across the state."
        link:
          label: "See California state animal"
          url: "/states/california/mammal/grizzly-bear"

      - subtitle: "The Coast Redwood and the Pacific Shore"
        text: "California's state tree, the coast redwood, grows along the Northern California coast in fog-drenched forests. Gray whales migrate past those same shores each winter. Both symbols belong to the coastline—the redwood rooted in the soil above the cliffs, the gray whale moving through the water below. The coast redwood and the gray whale together represent the two layers of California's coastal wilderness."
        link:
          label: "See California state tree"
          url: "/states/california/tree/coast-redwood"

      - subtitle: "The California Quail and Seasonal Rhythms"
        text: "California's state bird, the California quail, is a year-round resident that thrives in nearly every habitat across the state. The gray whale follows a strict seasonal pattern, appearing along the coast only during migration months. These two symbols represent opposite relationships with California—one that stays put through every season, one that arrives and departs on a clock set by the Arctic."
        link:
          label: "See California state bird"
          url: "/states/california/bird/california-quail"

      - subtitle: "The Golden State and the Ocean"
        text: "California's nickname, the Golden State, originally referenced gold discovered in 1848. Over time it expanded to include the golden poppies, golden sunsets, and golden coastline that define the state. Gray whales migrate along that golden coast every winter. The nickname and the state marine mammal share a connection to the California shoreline that no inland symbol can match."
        link:
          label: "See California state nickname"
          url: "/states/california/nickname/the-golden-state"

