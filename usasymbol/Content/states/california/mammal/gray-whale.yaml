faq:
  - question: "What is California's state marine mammal?"
    answer: "California's state marine mammal is the gray whale (Eschrichtius robustus), designated by the legislature in 1975."

  - question: "Why did California choose the gray whale?"
    answer: "California chose the gray whale because it migrates along the state's coast every winter, making it the most visible marine mammal in the state. The designation also honored the species' dramatic recovery from near-extinction and reflected a national shift toward protecting ocean wildlife after the Marine Mammal Protection Act of 1972."

  - question: "How far do gray whales migrate?"
    answer: "Gray whales travel roughly 12,000 miles each way between their Arctic feeding grounds and breeding lagoons in Baja California, Mexico. The round trip covers about 24,000 miles and is one of the longest migrations of any mammal on Earth."

  - question: "When can I see gray whales in California?"
    answer: "Gray whales are visible along the California coast from December through April. Southbound migration happens in December and January. The return trip north in March and April brings mothers and calves closer to shore, making them easier to spot. Whale watching boat tours operate out of dozens of coastal towns during these months."

  - question: "Were gray whales ever endangered?"
    answer: "Yes. Commercial whaling in the 1800s reduced the gray whale population to an estimated 2,000–3,000 animals by the early 1900s. Legal protections beginning in the 1940s allowed the population to recover. In 1994, the gray whale was removed from the Endangered Species List after reaching an estimated 25,000 to 27,000 individuals."

  - question: "What is the difference between California's state animal and state marine mammal?"
    answer: "California's state animal is the grizzly bear, designated in 1953, which represents the state's land and history. The state marine mammal is the gray whale, designated in 1975, which represents the Pacific coastline and ocean conservation. Together they cover California's land and sea ecosystems."

  - question: "Where is the best place to see gray whales in California?"
    answer: "Point Reyes National Seashore in Northern California and La Jolla Cove in San Diego are two of the best spots. Scripps Coastal Reserve near La Jolla offers cliff-side views without needing a boat. Monterey Bay Aquarium provides year-round exhibits about gray whale migration and conservation."

  - question: "Do gray whales still come to California every year?"
    answer: "Yes. Gray whales have migrated along the California coast for thousands of years, and they continue to do so today. Population surveys confirm that roughly 25,000 to 27,000 whales make the journey each year between the Arctic and their breeding lagoons in Mexico."

