faq:
  - question: "What is California's state animal?"
    answer: "California's state animal is the grizzly bear (Ursus arctos californicus), designated by the legislature in 1953. The California grizzly is extinct, but it remains the state's most recognizable symbol, appearing on the state flag and seal."

  - question: "Why is an extinct animal California's state symbol?"
    answer: "The grizzly bear was chosen because of its central role in the Bear Flag Revolt of 1846, when settlers declared the California Republic and put a grizzly bear on their flag. No other animal connects as deeply to California's founding story. Replacing the symbol would mean erasing a core part of the state's history."

  - question: "When was the last California grizzly bear seen?"
    answer: "The last confirmed California grizzly bear was killed in 1924 in the mountains of southern California. A few unconfirmed sightings were reported into the 1930s, but scientists consider the subspecies extinct."

  - question: "Where can I see a grizzly bear in California?"
    answer: "California grizzly bears no longer exist, but you can see specimens at the UC Berkeley Museum of Natural History and the California Academy of Sciences in San Francisco. The Bear Flag Monument in Sonoma marks where the grizzly bear first became California's symbol in 1846. Brown bears, a closely related species, can be seen at the San Francisco Zoo."

  - question: "Is the grizzly bear on California's flag?"
    answer: "Yes. The grizzly bear is the central image on California's state flag, known as the Bear Flag. The flag shows a brown grizzly bear standing on green grass with the words 'California Republic' below. The design traces back to the Bear Flag Revolt of 1846."

  - question: "How many grizzly bears lived in California?"
    answer: "Before European settlement, an estimated 24,000 grizzly bears lived across California. The population declined rapidly after Spanish colonization began in 1769 and collapsed during the Gold Rush era starting in 1849. Within about 75 years of large-scale hunting, the subspecies was gone."

  - question: "Could grizzly bears return to California?"
    answer: "Some conservation groups have discussed reintroducing grizzly bears to California from populations in Montana or Alaska. No formal reintroduction plan exists, and the idea is controversial among scientists, landowners, and state agencies. The California grizzly bear subspecies itself is gone forever and cannot be brought back."

  - question: "What is the difference between a grizzly bear and a brown bear?"
    answer: "Grizzly bears and brown bears are the same species (Ursus arctos) but different subspecies. The California grizzly (Ursus arctos californicus) was a subspecies found only in California. Brown bears in Alaska and the lower 48 states belong to other subspecies. The California grizzly is extinct while brown bears in other regions remain healthy."

