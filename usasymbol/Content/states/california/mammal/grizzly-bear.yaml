title: "California State Animal | Grizzly Bear"
scientific_name: "Ursus arctos californicus"
adopted_year: 1953

seo_title: "California State Animal | Grizzly Bear"
seo_description: "California's state animal is the Grizzly Bear, adopted in 1953. Learn why this official California symbol was chosen and what it represents."

intro_text: "The Grizzly Bear is the official California state animal, designated in 1953. This page gives the direct answer for searches like 'california state animal', 'california state animal', and 'california state mammal' while explaining how the symbol fits the state's official animal designations. The only state animal in the U.S. to appear on the state flag; symbol of California's independence and the Bear Flag Revolt of 1846."

common_name: "Grizzly Bear"
official_since: "1953"
status: "Extinct (last confirmed individual killed in 1924)"
habitat_in_state: "Historically: coastal mountains, Central Valley, Sierra Nevada, and desert scrublands"
known_for: "The only state animal in the U.S. to appear on the state flag; symbol of California's independence and the Bear Flag Revolt of 1846"

size: "5 to 7 feet in length; up to 7 feet tall when standing upright"
weight: "Males: 800–1,500 pounds; Females: 250–450 pounds"
coloration: "Brown to dark brown, sometimes nearly black; grizzled gray or white streaks across shoulders and back gave the species its common name"
distinctive_traits: "Large shoulder hump, dish-shaped facial profile, short rounded ears, massive front paws with long curved claws adapted for digging"

habitat: "Historically ranged from sea level to alpine elevations across nearly all of California"
range_in_state: "Once found from the coast to the Sierra Nevada and from the Mexican border to the Oregon border; by the 1880s, concentrated only in remote mountain areas"
conservation_status: "Extinct; the California grizzly bear subspecies (Ursus arctos californicus) no longer exists anywhere on Earth"
where_to_find: "Bear Flag Monument in Sonoma; California State Capitol displays; UC Berkeley Museum of Natural History specimens"
symbol_connections: "The grizzly bear is the only state animal in the United States that appears on the state flag. It also appears on the state seal and coat of arms. The Bear Flag Revolt of 1846, which gave the flag its design, is the central event in California's founding story."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The California Legislature designated the grizzly bear as the official state animal in 1953. At that time, the species had already been extinct for nearly thirty years."
      - "The choice surprised no one. The grizzly bear had appeared on California's flag since 1846 and on the state seal for decades before lawmakers made it official."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "The grizzly bear's path to becoming California's state animal began not with legislation but with revolution. On June 14, 1846, a group of American settlers seized the town of Sonoma from Mexican authorities. They declared the short-lived California Republic and raised a flag featuring a grizzly bear. That flag—and the bear on it—outlasted the republic by nearly 180 years."

      - subtitle: "Why California Chose an Extinct Animal"
        text: "By 1953, the California grizzly had been gone for almost thirty years. Lawmakers chose it anyway. No other animal carried the same weight of history for the state. The bear on the flag was already the most recognized image of California, making the formal designation a natural and fitting step."

  - id: "state-symbolism"
    title: "What the Grizzly Bear Represents"
    style: "highlight"
    paragraphs:
      - "The grizzly bear represents California's spirit of independence. When settlers declared the California Republic in 1846, they needed a symbol of strength and defiance. The grizzly bear—feared and respected across the entire West—was the obvious choice, and that framing still supports [the Golden State nickname](/states/california/nickname/the-golden-state)."
      - "For thousands of years before European arrival, grizzly bears roamed California from the coastline to the mountains. Indigenous peoples including the Yokuts, Miwok, and Chumash lived alongside bears and wove them into their stories and ceremonies."
      - "Today the grizzly bear reminds Californians of their state's founding story and the rugged character that shaped it. Even in extinction, the bear carries a meaning that no living animal could replace."

    subsections:
      - subtitle: "The Bear Flag Revolt"
        text: "On June 14, 1846, American settlers in Sonoma rose up against Mexican rule and formed the California Republic. They raised a flag showing a grizzly bear standing on green grass, with a lone red star above. William B. Ide served as president of the new republic. The California Republic lasted only 25 days before American forces absorbed the territory during the Mexican-American War, but the bear flag became a permanent part of California's identity."

      - subtitle: "Bears in Native California"
        text: "Grizzly bears held significance for many Indigenous groups across California long before Europeans arrived. The Yokuts, Chumash, and Miwok all lived in regions where bears were common. Some groups treated hunting a bear as a serious ceremonial event, believing the animal's spirit required proper thanks. These traditions reveal that the grizzly bear was woven into California's culture thousands of years before the Bear Flag Revolt made it an official symbol."

      - subtitle: "A Species That Shaped the Land"
        text: "Before 1800, an estimated 24,000 grizzly bears lived across California. They shaped the landscape as they moved—digging for ground squirrels, turning over rocks, and spreading seeds through their movements. Each autumn, bears gathered along Central Valley rivers during salmon runs, sometimes dozens at a single fishing spot. Early Spanish missionaries wrote about bears with a mix of fear and fascination in their mission journals."

      - subtitle: "The Gold Rush and the End of the Grizzly"
        text: "The California Gold Rush brought hundreds of thousands of newcomers starting in 1849. Many hunters targeted grizzly bears for sport, for fur, and to protect livestock and farms. Within fifty years of large-scale hunting, grizzly bears had vanished from most of California. The last confirmed California grizzly was killed in 1924, ending a subspecies that had existed in the region for thousands of years."

      - subtitle: "Independence as a State Value"
        text: "California has always prized its independent streak. The state entered the Union in 1850 as a free state, rejecting the national compromise on slavery. During the Civil War, California remained far from the fighting but sent troops to support the Union cause. The grizzly bear on the flag captures this tradition—a fierce, self-reliant animal that asked nothing from anyone and yielded to no other creature."

  - id: "identification"
    title: "How to Identify the California Grizzly Bear"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "The California grizzly bear was a large, powerfully built animal with a characteristic shoulder hump. Historical accounts and museum specimens show bears that could stand over six feet tall on their hind legs. Their fur ranged from light golden brown to nearly black, with grizzled gray streaks across the shoulders and back that gave the species its common name."
        list_items:
          - "**Size**: 5–7 feet long; up to 7 feet tall when standing upright"
          - "**Weight**: Males 800–1,500 pounds; females 250–450 pounds"
          - "**Color**: Brown to dark brown with grizzled gray or white streaks on shoulders and back"
          - "**Distinguishing features**: Large shoulder hump, dish-shaped face, short rounded ears, massive curved claws"

      - subtitle: "Behavior and Diet"
        text: "California grizzlies were omnivores, eating fish, insects, roots, berries, and small mammals. Each autumn, bears gorged on acorns and other foods to build fat reserves for winter hibernation. During salmon runs along Central Valley rivers, dozens of bears could gather at single fishing spots—a spectacle that early travelers described in detail in their journals and letters."

  - id: "in-the-state"
    title: "Grizzly Bears in California"
    style: "default"

    paragraphs:
      - "The California grizzly bear no longer exists. The subspecies Ursus arctos californicus was found only in California and is now extinct worldwide. No confirmed sightings have been reported since 1924, while the state continues to document this legacy with [California's official flag history](/states/california/flag/california-state-flag)."
      - "Once the most widespread large predator in the state, the grizzly bear disappeared within roughly one century of European settlement."

    subsections:
      - subtitle: "Historical Presence"
        text: "Before European contact, grizzly bears inhabited nearly every ecosystem in California. They lived along the coast, across the Central Valley, in the Sierra Nevada mountains, and even in desert scrublands near the Mexican border. Spanish missionaries documented bears near their coastal missions as early as the 1700s. The species was so common that early American settlers described seeing dozens of bears in a single day along river valleys."

      - subtitle: "Why It's Still the Symbol"
        text: "An extinct animal remains California's state symbol for one reason: no other animal connects as deeply to the state's founding story. The grizzly bear appeared on the Bear Flag Revolt banner in 1846, four years before California became a state. Replacing the symbol would mean erasing a core piece of state history. The bear on the flag was never meant to represent a living species—it represents who California chose to be when it first declared itself a nation."

      - subtitle: "Where to Learn More"
        text: "The California Academy of Sciences in San Francisco and the UC Berkeley Museum of Natural History both hold grizzly bear specimens and historical research. The California State Capitol in Sacramento displays state symbol information and historical flags. In Sonoma, the Bear Flag Monument marks the exact spot where the California Republic was declared in 1846."

  - id: "where-to-see"
    title: "Where to See California's State Animal"
    style: "default"

    paragraphs:
      - "The California grizzly bear cannot be seen alive, but its image appears across the state. Museums, monuments, and government buildings preserve the story of this extinct species and its role in California history."

    list_items:
      - "**Bear Flag Monument, Sonoma**: Marks the exact spot where settlers raised the first bear flag on June 14, 1846; includes a replica of the original flag and historical information"
      - "**California State Capitol, Sacramento**: The Capitol rotunda and museum displays feature state symbols, historical flags, and information about the grizzly bear designation"
      - "**UC Berkeley Museum of Natural History**: Houses preserved California grizzly bear specimens and research materials on the extinct subspecies"
      - "**California Academy of Sciences, San Francisco**: Natural history collections include bear specimens and educational exhibits on California's extinct wildlife"
      - "**San Francisco Zoo**: While no California grizzlies exist, the zoo houses brown bears—a closely related species—and offers programs about California's wildlife history"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "The California grizzly bear is extinct. The last confirmed individual was killed in 1924 in the mountains of southern California. A few unconfirmed reports followed into the 1930s, but scientists consider the subspecies gone forever, with policy context often discussed alongside [California's motto, Eureka](/states/california/motto/eureka)."
      - "No breeding program or reintroduction effort currently exists. The California grizzly bear subspecies was unique to California and cannot be recreated from other bear populations."

    subsections:
      - subtitle: "Why the Grizzly Bear Disappeared"
        text: "Hunting was the primary cause of the California grizzly's extinction. Spanish colonists, Mexican ranchers, and American settlers all killed bears—sometimes for safety, sometimes for sport, sometimes to protect livestock. By the late 1800s, habitat loss from farming and development had already reduced the bears' range dramatically. The combination of relentless hunting and shrinking habitat made extinction inevitable within a few decades."

      - subtitle: "Grizzly Bears in Other States Today"
        text: "Although the California subspecies is extinct, grizzly bears still live in parts of Montana, Wyoming, Idaho, Washington, and Alaska. These bears belong to different subspecies from the California grizzly. Some conservation groups have discussed whether grizzly bears could someday be reintroduced to California's wilderness, but no formal plans exist. The idea remains controversial among scientists, landowners, and state agencies."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The grizzly bear is the only state animal in the United States that appears on the state flag. California's flag, officially called the Bear Flag, shows the bear standing on a green stripe with the words 'California Republic' written below. This makes the state animal and the state flag inseparable, especially in public education across [States That Border California](/states/california/borders)."
      - "The Bear Flag Revolt of 1846 also connects to California's history as a brief independent nation. For 25 days, the state was known as the California Republic. That short experiment left a lasting mark on the state's identity and its choice of symbols."

    subsections:
      - subtitle: "On the State Flag and Seal"
        text: "California's state flag traces its design back to the Bear Flag Revolt of June 14, 1846. The original flag was hand-sewn and featured a rough drawing of a grizzly bear. The current design was standardized in 1911 and refined again in 1963. Today the bear stands on a green patch of grass, with a red star above and 'California Republic' below. The state seal also features the grizzly bear alongside a miner, a ship, and other California symbols."
        link:
          label: "See California state flag"
          url: "/states/california/flag/california-state-flag"

      - subtitle: "The California Poppy and the Gold Rush Era"
        text: "California's state flower, the California poppy (Eschscholzia californica), was designated in 1903. Both the poppy and the grizzly bear connect to the Gold Rush era that transformed the state starting in 1849. Poppies still bloom across the hillsides that prospectors once stripped bare. The grizzly bear vanished as Gold Rush settlers poured into California during that same period. Together, these two symbols capture opposite sides of that transformation—the beauty that stayed and the wildness that was lost."
        link:
          label: "See California state flower"
          url: "/states/california/flower/california-poppy"

      - subtitle: "The Coast Redwood and Ancient California"
        text: "California's state tree, the coast redwood (Sequoia sempervirens), designated in 1937, is the tallest living organism on Earth. Like the grizzly bear, redwood trees existed in California for thousands of years before humans arrived. Both species survived ice ages and drastic climate shifts over millennia. The redwood still stands; the grizzly bear does not. Side by side, these two symbols tell the story of what ancient California was and what parts of it survive today."
        link:
          label: "See California state tree"
          url: "/states/california/tree/coast-redwood"

      - subtitle: "State Motto: Eureka"
        text: "California's state motto, 'Eureka' (Greek for 'I have found it'), was adopted in reference to the Gold Rush. The word connects to discovery and sudden fortune. The grizzly bear, in its own way, also marks a moment of discovery—it was among the first large animals that Gold Rush newcomers encountered when they entered California's wilderness. Both symbols point back to 1849 and the events that made California what it is."
        link:
          label: "See California state motto"
          url: "/states/california/motto/eureka"

