seo_title: "California State Nickname | The Golden State"
seo_description: "California is known as The Golden State, the official state nickname adopted in 1968. Learn what Golden State means, why California uses it, and what other nicknames the state has had."

intro_text: "California carries the official state nickname <i>The Golden State</i>. This name became law in 1968 when state lawmakers voted to make it official. The California nickname connects to the discovery of gold in 1848 at a place called Sutter's Mill near Sacramento. Gold shaped the state's early growth and attracted thousands of people from around the world. Golden poppies bloom across hillsides each spring, adding another gold connection to California's identity and securing a strong place in the [U.S. state nickname index](/symbols/nicknames)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Golden State'"
    paragraphs:
      - "The Golden State nickname points to several gold-related features in California. James Marshall found gold at Sutter's Mill in January 1848. This discovery started the California Gold Rush. Between 1848 and 1855, more than 300,000 people moved to California hoping to find gold and get rich. The same mineral fever soon spread east — many prospectors crossed the Sierra Nevada into neighboring Nevada, whose [origins of the Silver State moniker](/states/nevada/nickname/the-silver-state) trace directly to the Comstock Lode silver rush of 1859."
      - "California's state flower adds to the golden theme. The golden poppy grows wild throughout the state and covers fields with bright orange-gold flowers from February to September. People have used the name Golden State since at least 1856, when writer Eliza Farnham published a book with that title. The California Maritime Academy named its first training ship the Golden State, and floral context is expanded on [California's poppy page](/states/california/flower/california-poppy)."
      - "Gold remains California's official state mineral. The Golden Gate Bridge in San Francisco takes its name from the Golden Gate strait, which got that name before the Gold Rush even started. People across America recognize California as the Golden State today, and this identity is routinely presented with [California's motto, Eureka](/states/california/motto/eureka)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "El Dorado State"
        text: "This nickname came from Spanish legends about a city made of gold. El Dorado means 'the golden one' in Spanish. During the Gold Rush, people compared California to this mythical place of wealth. Miners believed they could strike it rich just like the legendary El Dorado promised. A county in Northern California still carries the name El Dorado today. The same legend of golden wealth swept east through the Rocky Mountains — Colorado experienced its own version during the Pikes Peak rush of 1859, an era woven into the [Colorado state nickname](/states/colorado/nickname/the-centennial-state) story. This nickname was popular in the 1800s when gold fever brought fortune seekers from every continent."
      - subtitle: "Grape State"
        text: "California earned this name because of its huge wine industry. The state grows grapes across thousands of acres in regions like Napa Valley and Sonoma County. California produces about 85 percent of all wine made in the United States. Wine grapes need the right climate to grow well, and California's warm, dry summers work perfectly. Visitors from around the world come to tour vineyards and taste wines. The Grape State nickname highlights agriculture as a major part of California's economy."
      - subtitle: "Land of Milk and Honey"
        text: "This phrase comes from the Bible and describes a place with plenty of food and good things. People started calling California this because the state produces enormous amounts of crops. The Central Valley grows fruits, vegetables, nuts, and grains that feed millions of Americans. California farms produce more than a third of the nation's vegetables and two-thirds of its fruits and nuts. Dairy farms also produce large quantities of milk. The nickname suggests California offers abundance and opportunity for those who live there, while regional geography is mapped in [States That Border California](/states/california/borders)."
      - subtitle: "Modern Scale"
        text: "Today, nickname visibility is amplified by California's population size and media reach, which can be contrasted with national trends in [U.S. states by population](/rankings/demographics/states-by-population)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Writer Eliza Farnham used Golden State in a book title back in 1856, more than a century before it became official."
      - "California's population jumped from 14,000 to over 300,000 between 1848 and 1854 because of the Gold Rush."
      - "The Golden Gate got its name in 1846, two years before anyone discovered gold at Sutter's Mill."
      - "California became the 31st state in 1850, just two years after the Gold Rush started."
      - "The state motto is Eureka, which means 'I have found it' in Greek and refers to finding gold."
      - "Golden State Warriors, an NBA basketball team, carries California's nickname in its official name."

faq:
  - question: "What is California’s state nickname?"
    answer: "California’s state nickname is the Golden State. The name reflects the discovery of gold in 1848 and the lasting impact of the Gold Rush on the state’s history."

  - question: "Why is California called the Golden State?"
    answer: "California is called the Golden State because of the 1848 Gold Rush, which brought rapid growth and opportunity. Gold played a central role in shaping the state’s early economy."

  - question: "What does the Golden State nickname mean?"
    answer: "The Golden State nickname represents California’s association with gold, prosperity, and opportunity. It also reflects the golden poppy, the state flower."

  - question: "When did California start using the Golden State nickname?"
    answer: "California began using the Golden State nickname in the mid-19th century following the Gold Rush. The phrase appeared in publications by the 1850s."

  - question: "Is the Golden State an official nickname of California?"
    answer: "Yes, the Golden State is California’s official state nickname, formally recognized by the state."

  - question: "Does California have other nicknames?"
    answer: "California has also been referred to by historical or informal nicknames such as El Dorado State and Grape State, reflecting the Gold Rush and agricultural industries."

