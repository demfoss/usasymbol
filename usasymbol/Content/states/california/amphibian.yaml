faq:
  - question: What is California's state amphibian?
    answer: "California's state amphibian is the California red-legged frog, adopted by the California Legislature in 2014."
  - question: When did California adopt the red-legged frog?
    answer: "The California Legislature designated the California red-legged frog the official state amphibian in 2014."
  - question: Why did California choose the red-legged frog?
    answer: "It is native to California and is widely believed to be the frog that inspired Mark Twain's story about a jumping frog contest in Calaveras County."
  - question: Is the California red-legged frog endangered?
    answer: "The California red-legged frog is federally listed as threatened due to habitat loss across much of its historic range."

