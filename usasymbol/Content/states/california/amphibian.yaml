sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of California?
    paragraphs:
      - "The California red-legged frog is California's official state amphibian, designated by the California Legislature in 2014. Its scientific name is Rana draytonii."
      - "It is the largest native frog species in the western United States and is closely associated with the state's ponds, marshes, and streams."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the California Red-legged Frog
    paragraphs:
      - "This frog has a reddish-brown to olive back covered in dark flecks, with a reddish wash on the underside of its legs that gives the species its name."
      - "Adults can grow to about five inches long, making it noticeably larger than many other frogs found in California."
      - "It relies on still or slow-moving freshwater habitat with plenty of cover from plants along the banks."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The California Legislature designated the California red-legged frog the official state amphibian in 2014, following a push by conservation groups and students to give the state an official amphibian symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why California Chose the Red-legged Frog
    paragraphs:
      - "The California red-legged frog is native to the state and is thought to be the frog that inspired Mark Twain's short story 'The Celebrated Jumping Frog of Calaveras County,' giving it a strong cultural tie to California."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the California Red-legged Frog
    paragraphs:
      - "The California red-legged frog is found in scattered ponds, streams, and wetlands along the California coast and in parts of the Sierra Nevada foothills, including the Calaveras County area long tied to the species."
    sites:
      - name: Calaveras County
        city: San Andreas
        lat: 38.20
        lng: -120.68
        note: "Historic habitat linked to the species"
