faq:
- question: What does the bear on California's flag represent?
  answer: The bear represents the California grizzly, chosen during the 1846 Bear Flag Revolt to signal strength and resistance. The specific bear on the official flag is modeled after Monarch, the last California grizzly in captivity, who died in 1911. The California grizzly has been extinct since the 1920s.
- question: Why is California's flag called the Bear Flag?
  answer: The Bear Flag name comes from the 1846 Bear Flag Revolt, when American settlers in Sonoma raised an improvised flag with a grizzly bear to declare California independent from Mexico. The republic lasted 25 days before U.S. forces arrived. The state adopted the same imagery as its official flag in 1911.
- question: What does California Republic mean on the flag?
  answer: California Republic names the short-lived republic declared by settlers during the 1846 Bear Flag Revolt. The republic existed for 25 days and had no constitution, formal government, or international recognition. The U.S. Navy ended it on July 9, 1846. The text remains on the flag as a historical reference to that founding moment.
- question: What do the colors on California's flag mean?
  answer: 'California''s flag uses five colors: white (background), red (star, stripe, bear''s tongue), green (grass), tan (bear''s body), and brown (bear''s shading and lettering). California law specifies Pantone and Cable values for all five. It is one of only four U.S. state flags without blue.'
- question: When was the California state flag officially adopted?
  answer: California officially adopted the Bear Flag on February 3, 1911. The design was standardized in 1953, when Governor Earl Warren signed legislation specifying the bear's appearance and exact color values.
