- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - 'The Bear Flag Revolt lasted 25 days: June 14 to July 9, 1846'
  - The original 1846 flag was painted with blackberry juice, red clay, and fabric scraps
  - The original Bear Flag was destroyed in the 1906 San Francisco earthquake and fire
  - The bear is modeled after Monarch — the last California grizzly in captivity, who died in 1911
  - The California grizzly was declared extinct in the 1920s — the flag's bear has been gone for over 100 years
  - 'Adopted as state flag: February 3, 1911 — the same year Monarch died'
  - Standardized by Governor Earl Warren in 1953 with exact Pantone and Cable color values
  - One of only four U.S. state flags without blue
  - Ranked 13th among all North American flags in the 2001 NAVA design survey
