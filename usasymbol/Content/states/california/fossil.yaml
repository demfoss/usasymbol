- id: facts
  icon: fa-solid fa-lightbulb
  title: Saber-Toothed Cat Facts
  facts:
  - "California designated Smilodon fatalis as its state fossil in 1974, one of the earliest such designations in the country."
  - "More than 2,000 individual Smilodon specimens have been recovered from the La Brea Tar Pits in Los Angeles."
  - "The saber-toothed cat's upper canine teeth could reach 7 inches in length and were serrated like a steak knife."
  - "Smilodon fatalis weighed up to 600 pounds, heavier than a modern lion, and had significantly stronger forelegs."
  - "Healed bone fractures in La Brea specimens suggest Smilodon fatalis lived in social groups that cared for injured members."

faq:
- question: What is California's state fossil?
  answer: "California's state fossil is the saber-toothed cat, Smilodon fatalis. It was designated by the California state legislature in 1974."
- question: When did California adopt its state fossil?
  answer: "California adopted the saber-toothed cat as its state fossil in 1974, making it one of the earlier states to create this designation."
- question: What did the saber-toothed cat look like?
  answer: "Smilodon fatalis was about the size of an African lion, up to 5.5 feet long and weighing up to 600 pounds. It had a heavily muscled body and a pair of upper canine teeth that could reach 7 inches in length."
- question: Where are saber-toothed cat fossils found in California?
  answer: "The La Brea Tar Pits in Los Angeles is the most productive site, with more than 2,000 individual Smilodon specimens recovered. Fossils have also been found at the McKittrick Tar Pits in Kern County and the Carpinteria Tar Pits in Santa Barbara County."
- question: When did the saber-toothed cat live?
  answer: "Smilodon fatalis lived during the Late Pleistocene epoch and went extinct about 10,000 years ago at the end of the last Ice Age."
- question: Why is the saber-toothed cat California's state fossil?
  answer: "California chose the saber-toothed cat because the La Brea Tar Pits in Los Angeles hold the largest collection of Smilodon fossils in the world. The state had a strong scientific case backed by hundreds of specimens already on record by 1974."

