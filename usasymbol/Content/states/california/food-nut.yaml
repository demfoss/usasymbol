faq:
  - question: "What is California's state nut?"
    answer: "California's state nut is not one nut but four: the almond, walnut, pistachio and pecan, adopted together by the California Legislature in 2017."
  - question: "When did California adopt its state nut?"
    answer: "The California Legislature designated the almond, walnut, pistachio and pecan as the official state nut in 2017."
  - question: "Why did California choose the almond, walnut, pistachio and pecan?"
    answer: "California's Central Valley grows the large majority of the country's almonds, walnuts and pistachios, along with pecans on a smaller scale, making tree nut farming a major part of the state's agriculture."
  - question: "Where do California's state nuts come from?"
    answer: "Most of California's almond, walnut and pistachio orchards are grown in the Central Valley, from the Sacramento Valley south through the San Joaquin Valley."

