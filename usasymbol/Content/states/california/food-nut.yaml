intro_text: "California's state nut is a group of four nuts, the almond, walnut, pistachio and pecan, adopted together in 2017 to recognize the state's major nut-growing industry. This profile appears in the [list of U.S. state foods](/symbols/nuts)."

sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is California's State Nut?"
    paragraphs:
      - "California's official state nut is not a single nut but a group of four: the almond, walnut, pistachio and pecan. The California Legislature adopted all four together in 2017, recognizing the state's role as the country's leading grower of each one."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Almond, Walnut, Pistachio and Pecan"
    paragraphs:
      - "Almonds, walnuts and pistachios all grow on trees in California's Central Valley, where hot, dry summers and irrigated farmland suit large-scale orchards. Almonds and pistachios grow inside a hard shell surrounded by a hull, while walnuts ripen inside a green outer husk that splits away as the nut dries. Pecans are grown on a smaller scale in the state, mostly in the Sacramento Valley."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Almond, Walnut, Pistachio and Pecan Became California's State Nut"
    paragraphs:
      - "The California Legislature designated all four nuts as the official state nut together in 2017, rather than choosing a single crop, since the state grows large commercial quantities of each."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why California Chose the Almond, Walnut, Pistachio and Pecan"
    paragraphs:
      - "California's Central Valley produces the great majority of the almonds, walnuts and pistachios grown in the United States, and the state also grows pecans on a smaller scale. Naming all four as the state nut reflects how central tree nut farming is to California agriculture."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where California's State Nuts Come From"
    paragraphs:
      - "Most of California's almond, walnut and pistachio orchards are concentrated in the Central Valley, stretching from the Sacramento Valley in the north through the San Joaquin Valley in the south."
    sites:
      - name: Central Valley
        city: Fresno
        lat: 36.7378
        lng: -119.7871
