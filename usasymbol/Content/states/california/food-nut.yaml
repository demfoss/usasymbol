        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Almond, Walnut, Pistachio and Pecan Facts"
    facts:
      - "Adopted as California's state nut in 2017, covering four nuts at once."
      - "California grows the large majority of the almonds, walnuts and pistachios produced in the United States."
      - "Most orchards are concentrated in the Central Valley."
      - "Pecans are grown in California on a smaller scale than the other three nuts."

