unique_surnames:
  - name: Nguyen
    state_rank: 16
    national_rank: 50 # UNVERIFIED
    origin: vietnamese
    why: "California holds roughly 40 percent of all Vietnamese-Americans in the United States, the majority concentrated in Orange County's Little Saigon neighborhood following post-1975 refugee resettlement. No other state comes close to California's density of the Nguyen surname."

  - name: Chan
    state_rank: 55 # UNVERIFIED
    national_rank: 200 # UNVERIFIED
    origin: chinese
    why: "Chan is a Cantonese romanization of the surname 陳 (Chén), dominant among Cantonese-speaking immigrants who founded San Francisco's Chinatown in the 1850s. California's Cantonese community kept Chan disproportionately concentrated in the Bay Area and Los Angeles relative to its national distribution."

  - name: Wong
    state_rank: 70 # UNVERIFIED
    national_rank: 300 # UNVERIFIED
    origin: chinese
    why: "Wong is a second major Cantonese romanization of 王 (Wáng) or 黃 (Huáng), both common among the railroad and mining laborers who arrived in California from the 1860s onward. San Francisco's Chinatown and the broader Bay Area remain the historic center of the Wong surname in America."

  - name: Chavez
    state_rank: 35 # UNVERIFIED
    national_rank: 150 # UNVERIFIED
    origin: spanish
    why: "Chavez is strongly associated with California's Central Valley farmworker communities, where labor organizer César Chávez built the United Farm Workers movement in the 1960s. The surname is heavily concentrated in agricultural counties from Fresno to Ventura."

  - name: Yokoyama
    state_rank: 2200 # UNVERIFIED
    national_rank: 2000 # UNVERIFIED
    origin: japanese
    why: "Yokoyama, meaning 'beside the mountain,' is a Japanese surname concentrated in California due to the pre-WWII Japanese-American farming communities in the San Joaquin Valley and the Gardena and Torrance areas of Los Angeles County. California holds the largest Japanese-American population in the nation."

etymology_groups:
  - type: Spanish Patronymics
    icon: fa-solid fa-sun
    description: "Six of California's top ten surnames are Spanish patronymics, rooted in centuries of Mexican settlement and reinforced by 20th-century migration. The Central Valley and Greater Los Angeles are the primary population centers for names like Garcia, Hernandez, Martinez, Lopez, Rodriguez, and Gonzalez."
    examples:
      - Garcia (from Basque given name García)
      - Hernandez (son of Fernando — bold journey)
      - Martinez (son of Martín — of Mars)
      - Lopez (son of Lope — wolf)
      - Rodriguez (son of Rodrigo — famous ruler)
      - Gonzalez (son of Gonzalo — battle)

  - type: Anglo-American Surnames
    icon: fa-solid fa-pickaxe
    description: "English, Welsh, and Scottish surnames entered California in force during the 1848 Gold Rush and again through the 1930s Dust Bowl migration from Oklahoma and Texas. Occupational names like Smith and Taylor and patronymics like Johnson, Williams, and Davis are distributed broadly across the state."
    examples:
      - Smith (metalworker)
      - Johnson (son of John)
      - Williams (son of William)
      - Brown (dark complexion)
      - Taylor (tailor)
      - Davis (son of David)

  - type: East and Southeast Asian Surnames
    icon: fa-solid fa-ship
    description: "California's Pacific coast position made it the primary entry point for Chinese laborers from the 1850s, Japanese farmers from the 1890s, and Vietnamese refugees after 1975. Surnames like Lee, Nguyen, Chan, and Wong are disproportionately concentrated in California compared to any other state."
    examples:
      - Lee (woodland clearing; also Chinese 李 and Korean 이)
      - Nguyen (Vietnamese clan name)
      - Chan (Cantonese: 陳)
      - Wong (Cantonese: 王 or 黃)
      - Kim (Korean: 金 — gold)

faq:
  - question: "What are the most common last names in California?"
    answer: "The most common last names in California include Garcia, Hernandez, Smith, Martinez, and Lopez. California stands out because Garcia ranks ahead of Smith, which is unusual at the state level in the United States."

  - question: "Why are Spanish surnames so common in California?"
    answer: "Spanish surnames dominate because California was part of Mexico until 1848, and Spanish-speaking communities have been present since the mission era of the late 1700s. 20th-century labor migration, especially to the Central Valley agricultural industry and Los Angeles, reinforced the deep presence of common surnames in California like Garcia, Hernandez, and Martinez."

  - question: "Why is Nguyen so common in California?"
    answer: "Nguyen ranks unusually high because California has the country's largest Vietnamese American population. Orange County's Little Saigon and other post-1975 refugee communities made Nguyen a far more visible statewide surname here than in most of the country."

