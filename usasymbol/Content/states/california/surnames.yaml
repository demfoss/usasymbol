    ratio: 477
    origin: english
    type: Habitational
    meaning: "English habitational surname from a woodland clearing, and also a common romanization of Chinese 李 (Lǐ) and Korean 이 (Yi). California's Lee population spans Anglo-American settlers, San Francisco's Cantonese community, and the Korean-American population of Los Angeles."

