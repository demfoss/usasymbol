    ratio: 454
    origin: english
    type: Descriptive
    meaning: "English descriptive surname for someone with brown hair or a dark complexion, from Old English brun. Brown families came to California during the Gold Rush and again through the 1930s Dust Bowl migration from the South and Midwest."

