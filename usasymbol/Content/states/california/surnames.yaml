    ratio: 385
    origin: spanish
    type: Patronymic
    meaning: "Spanish patronymic from Gonzalo, from a Germanic root meaning 'battle.' Gonzalez became one of California's fastest-growing surnames in the late 20th century, expanding across Los Angeles and the Central Valley."

  - rank: 9
    name: Williams
    count: 89400
    ratio: 417
    origin: welsh
    type: Patronymic
    meaning: "Welsh and English patronymic meaning 'son of William,' from the Germanic name Wilhelm. Oklahoma and Texas families named Williams brought this surname to California's San Joaquin Valley during the 1930s Dust Bowl migration."

