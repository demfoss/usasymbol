seo:
  title: "Common Last Names in California — Garcia Tops Smith"
  description: "Hispanic surnames like Garcia now lead California's most common last names — the only state in the U.S. where a Spanish surname tops the list."

page:
  h1: "Most Common Last Names in California"
  intro: "Garcia tops the most common last names in California — the only U.S. state where a Hispanic surname outranks Smith. Spanish colonial roots, the 1848 Gold Rush, and Pacific Rim immigration each left a distinct layer across the state's name map."
  heritage_title: "Spanish Colonial, Dust Bowl, and Pacific Rim Roots"
  heritage_body: "Spanish surnames dominate California's top ten, rooted in Mexican settlement predating statehood and reinforced by 20th-century labor migration to the Central Valley and East Los Angeles. Anglo-American names arrived during the 1848 Gold Rush and the 1930s Dust Bowl exodus from Oklahoma and Texas. Post-1975 Vietnamese resettlement centered in Orange County's Little Saigon added Nguyen to California's most frequent names within a generation."
  fun_fact: "California is the only U.S. state where Garcia outranks Smith as the most common surname."

surnames:
  - rank: 1
    name: Garcia
    count: 186300
    ratio: 200
    origin: spanish
    type: Patronymic
    meaning: "A medieval Basque given name of uncertain, possibly pre-Roman origin, later adopted as a patronymic across the Iberian Peninsula. Garcia is deeply embedded in Southern California through centuries of Mexican settlement, with Los Angeles County holding one of the largest concentrations in the United States."

  - rank: 2
    name: Hernandez
    count: 167600
    ratio: 222
    origin: spanish
    type: Patronymic
    meaning: "Spanish patronymic from Fernando, itself from Germanic elements meaning 'bold journey.' In California, Hernandez families are concentrated in the Inland Empire and San Joaquin Valley, tied to 20th-century agricultural labor migration from Mexico."

  - rank: 3
    name: Smith
    count: 149000
    ratio: 250
    origin: english
    type: Occupational
    meaning: "English occupational surname for an ironsmith or metalworker, one of the oldest trade surnames in the language. Anglo-American settlers named Smith arrived in California during the 1848 Gold Rush, establishing the name across the Sacramento Valley."

  - rank: 4
    name: Martinez
    count: 130400
    ratio: 286
    origin: spanish
    type: Patronymic
    meaning: "Spanish patronymic from Martín, derived from the Latin Martinus meaning 'of Mars.' Agricultural communities in the Salinas Valley and Coachella Valley drew large Martinez populations through mid-20th-century farmworker migration."

  - rank: 5
    name: Lopez
    count: 111800
    ratio: 333
    origin: spanish
    type: Patronymic
    meaning: "Spanish patronymic from the given name Lope, itself from Latin lupus meaning 'wolf.' Central Valley cities like Fresno and Stockton developed dense Lopez communities through 1940s–1970s labor migration from Mexico."

  - rank: 6
    name: Johnson
    count: 104300
    ratio: 357
    origin: english
    type: Patronymic
    meaning: "English and Scandinavian patronymic meaning 'son of John,' the most common baptismal name in medieval England. Anglo-American Johnson families settled Northern California's logging communities and farming valleys from the 1860s onward."

  - rank: 7
