seo_description: "California symbols include the Bear Flag, golden poppy, California quail, coast redwood, gray whale, and grizzly bear."
snippet_answer: "The Bear Flag and California grizzly are the most recognized official state symbols of California — though the grizzly has been extinct in the wild since the 1920s. The golden poppy, California quail, coast redwood, giant sequoia, and gray whale fill out a list that spans coast, valley, and the high Sierra."
