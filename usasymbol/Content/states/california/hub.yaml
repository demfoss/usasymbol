name_meaning:
  heading: What Does California Mean?
  paragraphs:
  - California is the 31st U.S. state, admitted to the Union in 1850. The name was first applied by Spanish explorers to the Baja California region and later to Alta California, which became the American state.
  - The most widely accepted origin links California to a fictional island in the Spanish romance Las Sergas de Esplandian, published in the early 1500s. In that story, California was ruled by Queen Califia or Calafia, and the name became attached to the western lands Spanish explorers were trying to map.
  - California's best-known nickname is the Golden State, while Bear Flag State and El Dorado State point to older pieces of its public identity. Its postal abbreviation is CA, and residents are Californians.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Usually traced to a fictional island named California in the Spanish romance Las Sergas de Esplandian.
    - label: Literary source
      text: The island was associated with Queen Califia or Calafia, a legendary ruler in the story.
    - label: Statehood
      text: California became the 31st state on September 9, 1850.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to California, the Pacific Coast state admitted during the Gold Rush era.
    - label: Alta California
      text: Refers to the former Mexican province that included much of what became the U.S. state.
    - label: Baja California
      text: The name also survives in the Mexican states of Baja California and Baja California Sur.
    - label: People
      text: People from California are called Californians.
  - heading: Nicknames and Short Forms
    items:
    - label: The Golden State
      text: Official nickname tied to gold, poppies, sunshine, and the state's long promotional identity.
    - label: Bear Flag State
      text: Refers to the grizzly bear flag connected with the 1846 Bear Flag Revolt.
    - label: El Dorado State
      text: Older nickname tied to the Gold Rush and the idea of a land of wealth.
    - label: Abbreviation
      text: CA; older short form Calif.
editorial:
  heading: What California's Symbols Say About the State
  paragraphs:
  - California's [state flag](/states/california/flag) and [grizzly bear](/states/california/mammal/grizzly-bear) are inseparable. The bear comes from the 1846 Bear Flag Revolt, but it also points to loss, since the California grizzly was gone from the state before the legislature made it the official animal.
  - The [California poppy](/states/california/flower), [California quail](/states/california/bird), and [state trees](/states/california/tree) work differently. They are not about a single revolt or event; they give the state a native landscape language, from orange spring hillsides to brushy quail habitat and the tallest and largest trees on Earth.
  - The [gray whale](/states/california/mammal/gray-whale) adds the Pacific to that picture. Its migration is visible from the coast, while [Eureka](/states/california/motto) keeps the Gold Rush in the official vocabulary and [Augustynolophus](/states/california/dinosaur) gives California a fossil symbol found in its own rocks.
faq:
- question: What is California's most famous state symbol?
  answer: The grizzly bear is one of California's most famous symbols because it appears on the [California state flag](/states/california/flag) and is also the official [state animal](/states/california/mammal/grizzly-bear).
- question: What is California's state bird?
  answer: California's state bird is the [California quail](/states/california/bird), adopted in 1931.
- question: What is California's state flower?
  answer: California's state flower is the [California poppy](/states/california/flower), adopted in 1903.
- question: Why is California called the Golden State?
  answer: The Golden State nickname connects to the Gold Rush, golden poppies, sunshine, and California's long public image as a place of opportunity. The nickname is covered on the [California nickname](/states/california/nickname) page.
- question: How many official state symbols does California have?
  answer: The California hub brings together the state-symbol pages now published on USA Symbol, including the bear flag, quail, poppy, redwoods, whales, and dinosaur.
