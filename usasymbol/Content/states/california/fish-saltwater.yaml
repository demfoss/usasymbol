# verification: The official title is "State Marine Fish," not "State Saltwater Fish." California Government Code § 425.6 names the garibaldi (Hypsypops rubicundus) the official state marine fish, and that section was added by Stats. 1995, Ch. 948. The species, scientific name, and 1995 adoption year in the starting record are correct.
