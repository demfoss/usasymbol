intro_text: California's state marine fish is the garibaldi, a bright orange fish of Southern California's rocky reefs and kelp forests. It was adopted in 1995. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Marine Fish of California?
  paragraphs:
  - The garibaldi became California's official state marine fish in 1995. Its scientific name is Hypsypops rubicundus. It belongs to the damselfish family.
  - California also has a separate state fish, the golden trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Garibaldi
  paragraphs:
  - Adult garibaldi are golden orange and grow to about 14 inches long.
  - No other fish on Southern California's rocky reefs has such a bright orange color. That makes it easy for divers and snorkelers to spot.
  - Young garibaldi look even more colorful. They have a reddish orange body covered with bright blue spots.
  - When a garibaldi is disturbed, it makes a thumping sound that divers can hear underwater.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Marine Fish
  paragraphs:
  - The California Legislature named the garibaldi the official state marine fish in 1995. The same bill also paused commercial collection of the fish.
  - Lawmakers argued about the bill's protection rules, but the part naming the garibaldi the state marine fish was never questioned. The governor signed the bill in October 1995.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why California Chose the Garibaldi
  paragraphs:
  - The garibaldi was not endangered, but people worried that collectors for saltwater aquariums had reduced its numbers. Lawmakers protected the fish and made it the state marine fish in the same 1995 law.
  - Biologists say people also wanted this easy-to-see fish to stay on view for glass-bottom boat tours at Catalina Island.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Garibaldi
  paragraphs:
  - Garibaldi live along the coast from Monterey Bay south into Mexico. In California they are most common south of Point Conception, including around the Channel Islands.
  - They stay close to rocky reefs and kelp beds, usually in shallow water near shore. Santa Catalina Island and the reefs off San Diego are good places to see them.
