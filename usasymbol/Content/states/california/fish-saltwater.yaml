- id: facts
  icon: fa-solid fa-lightbulb
  title: Garibaldi Facts
  facts:
  - Adopted in 1995 by the California Legislature.
  - Scientific name is Hypsypops rubicundus.
  - Grows to about 14 inches long.
  - Young garibaldi have bright blue spots on a reddish orange body.
  - It is illegal to catch or keep one in California without a special permit.
faq:
- question: What is California's state fish?
  answer: California's state marine fish is the garibaldi, a bright orange reef fish. The state's separate freshwater symbol, called the state fish, is the golden trout.
- question: When did California adopt the Garibaldi?
  answer: The California Legislature made the garibaldi the official state marine fish in 1995.
- question: Why did California choose the Garibaldi?
  answer: People worried that collectors for the aquarium trade were taking too many garibaldi. Lawmakers protected the fish and named it the state marine fish in the same law.
- question: Can you catch a garibaldi in California?
  answer: No. The garibaldi is protected in California, and it is illegal to catch or keep one without a permit from the state.
- question: Why are baby garibaldi a different color?
  answer: Young garibaldi have a reddish orange body with bright blue spots. As they grow up, they turn the solid golden orange color of adults.
