intro_text: California's state freshwater fish is the California golden trout, a bright gold and red trout from the high Sierra Nevada. It was adopted in 1947. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of California?
  paragraphs:
  - The California golden trout became an official state symbol when the California Legislature named it the state fish in 1947. Its scientific name is Oncorhynchus mykiss aguabonita.
  - It is native only to California. The state also has a separate state marine fish, the garibaldi.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the California Golden Trout
  paragraphs:
  - Many people call the California golden trout one of the most beautiful trout in the world. Its back is deep olive-green, and its sides fade to bright gold.
  - Its belly, gill covers, lower jaw, and the stripe along its side are red to red-orange. About ten dark oval marks, called parr marks, run along each side, and most adults keep them.
  - Large round black spots show up mostly near the tail and on the back and tail fins. Its lower fins are orange, often with white or yellow tips.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The California Legislature named the golden trout the official state fish in 1947. Many years later, in 1995, the state added the garibaldi as its marine fish. Today the golden trout is known as the state freshwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why California Chose the California Golden Trout
  paragraphs:
  - Official sources do not give a detailed reason for the choice. State records point out that the golden trout is native only to California, so it is found in the wild nowhere else.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the California Golden Trout
  paragraphs:
  - In the beginning, the golden trout lived in only a few icy streams at the top of the Kern River, south of Mount Whitney. Its native waters are Golden Trout Creek and the South Fork Kern River, and much of this area is now protected as the Golden Trout Wilderness.
  - People have moved wild trout and hatchery-raised trout to new waters, so golden trout now live in many high mountain lakes and streams in the Sierra Nevada. Some have also been released in other states.
- id: facts
  icon: fa-solid fa-lightbulb
  title: California Golden Trout Facts
  facts:
  - Adopted in 1947 by the California Legislature.
  - Scientific name is Oncorhynchus mykiss aguabonita.
  - Native only to California, in the upper Kern River area.
  - Most adults keep about ten dark parr marks along their sides.
  - Golden trout in streams are usually small, but those living in lakes can grow much bigger.
faq:
- question: What is California's state fish?
  answer: California's state freshwater fish is the California golden trout. The state also has a marine fish, the garibaldi.
- question: When did California adopt the California golden trout?
  answer: The California Legislature named the golden trout the official state fish in 1947.
- question: Why did California choose the California golden trout?
  answer: Official sources do not give a detailed reason. State records say the golden trout is native only to California.
- question: Where do California golden trout live?
  answer: They come from cold, high streams at the top of the Kern River in the southern Sierra Nevada, such as Golden Trout Creek and the South Fork Kern River. Stocking has spread them to many high mountain lakes and streams.
- question: How can you tell a golden trout from other trout?
  answer: Look for gold sides, a red-orange belly and side stripe, and a row of dark oval marks along each side. Its black spots are found mostly near the tail.
