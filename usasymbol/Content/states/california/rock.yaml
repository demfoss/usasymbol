faq:
  - question: What is California's state rock?
    answer: "California's state rock is serpentine, a mottled green metamorphic rock more precisely called serpentinite."
  - question: When did California adopt serpentine as its state rock?
    answer: "The California Legislature designated serpentine the official state rock in 1965, the first state rock named by any U.S. state."
  - question: Why did California choose serpentine?
    answer: "Serpentine underlies much of California's Coast Ranges and was mined commercially for asbestos and other industrial minerals through much of the 20th century."
  - question: Was serpentine ever at risk of losing its status as California's state rock?
    answer: "Yes. A 2010 bill sought to remove serpentine as the state rock over concerns about asbestos exposure, but the bill did not pass and serpentine remains the official state rock."

