intro_text: "California's state rock is serpentine, adopted by the California Legislature in 1965 to recognize the greenish rock that underlies parts of the Coast Ranges and once anchored the state's asbestos mining industry. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: California State Rock
    paragraphs:
      - "Serpentine is California's official state rock, designated by the California Legislature in 1965, the first state in the country to name an official state rock. Technically the material is serpentinite, a rock made up mostly of serpentine-group minerals, though the law and most Californians simply call it serpentine."
      - "Lawmakers chose it for its ties to the Gold Rush era, when serpentine-hosted deposits were mined for asbestos and other industrial minerals, and for how widely it appears across California's Coast Ranges."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Serpentine?"
    paragraphs:
      - "Serpentine typically appears mottled green to black, sometimes with a greasy or silky sheen, and it can be soft enough in places to scratch with a fingernail. It forms when ocean floor rock, rich in iron and magnesium, is altered by heat, pressure, and water deep underground, part of the same tectonic processes that built California's Coast Ranges."
      - "California has some of the most extensive serpentine exposures in the country, and the rock creates a distinctive, nutrient-poor soil that supports unusual native plants found almost nowhere else."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why California Chose Serpentine as Its State Rock"
    paragraphs:
      - "Serpentine underlies large parts of California's Coast Ranges, and mineral veins within it, including chrysotile asbestos, were mined commercially for much of the 20th century. That industrial history, tied to the same mountain-building forces behind California's gold deposits, made the rock a natural symbol when lawmakers acted in 1965."
      - "In 2010, a state senator introduced a bill to remove serpentine as the state rock over concerns about asbestos exposure, since some serpentine bodies contain the mineral in a form that can be a health hazard when disturbed. After debate in the legislature, the bill did not pass, and serpentine remains California's official state rock."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Serpentine Became California's State Rock"
    paragraphs:
      - "The California Legislature designated serpentine the state rock in 1965, making California the first state in the country with an official state rock."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Serpentine Facts"
    facts:
      - "Adopted as California's state rock in 1965, the first state rock designated by any U.S. state."
      - "The official name in state law is serpentine, though geologists more precisely call the rock serpentinite."
      - "A 2010 bill to remove serpentine as the state rock, over asbestos health concerns, was debated in the legislature but did not pass."
      - "Serpentine soil is so poor in nutrients that it supports unusual native plants found almost nowhere else in California."

