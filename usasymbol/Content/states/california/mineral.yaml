faq:
  - question: What is California's state mineral?
    answer: "California's state mineral is gold, a soft, bright yellow metal adopted by the California Legislature in 1965."
  - question: When did California adopt gold as its state mineral?
    answer: "The California Legislature designated gold the official state mineral on April 23, 1965."
  - question: Why did California choose gold?
    answer: "Gold discovered at Sutter's Mill in 1848 triggered the California Gold Rush, shaping the state's population, economy, and even its nickname, the Golden State."
  - question: Where was gold discovered in California?
    answer: "Gold was discovered at Sutter's Mill in Coloma in 1848, a site now preserved as Marshall Gold Discovery State Historic Park."

