intro_text: "California's state mineral is gold, adopted by the California Legislature in 1965 in recognition of the 1848 discovery that triggered the Gold Rush and gave the state its nickname, the Golden State. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: California State Mineral
    paragraphs:
      - "Gold is California's official state mineral, designated by the California Legislature in 1965. Few state symbols are as directly tied to a state's identity. California's nickname, the Golden State, comes directly from the gold discovered at Sutter's Mill in 1848."
      - "Governor Edmund G. Brown signed the designation, calling it recognition of the role gold played in California's history and its standing as an ongoing mining industry in the state."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Gold?"
    paragraphs:
      - "Gold is a soft, dense, metallic yellow element that does not tarnish or corrode, part of why prospectors could spot it easily in stream gravel. It occurs in nature in a nearly pure state, as flakes, grains, and occasional nuggets, rather than needing to be extracted from complex ore."
      - "California gold formed in hydrothermal veins within the Sierra Nevada, then washed downhill over millions of years into stream gravels as placer deposits. Those stream deposits, easy to work with a pan or simple sluice, are what drew the first wave of 1849 prospectors."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why California Chose Gold as Its State Mineral"
    paragraphs:
      - "James Marshall's discovery of gold at Sutter's Mill in Coloma in January 1848 set off the California Gold Rush, drawing roughly 300,000 people to the state within a few years and accelerating California's path to statehood in 1850. That single event shaped California's economy, population, and identity more than perhaps any other in its history."
      - "Gold mining also remained a real industry well past the Gold Rush era, continuing into the 20th century in the Sierra Nevada foothills. Naming gold the state mineral in 1965 tied the symbol to both the historic rush and the mining that followed it."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Gold Became California's State Mineral"
    paragraphs:
      - "Governor Edmund G. Brown signed the legislation naming native gold California's state mineral on April 23, 1965, saying the choice acknowledged gold's role in the state's history and its place as an active California industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Gold Was Discovered in California"
    paragraphs:
      - "Coloma, on the American River in the Sierra Nevada foothills, is where James Marshall found gold at Sutter's Mill in 1848, the discovery that touched off the Gold Rush. The site is preserved today as Marshall Gold Discovery State Historic Park."
    sites:
      - name: Marshall Gold Discovery State Historic Park
        city: Coloma
        lat: 38.8016
        lng: -120.8917
        note: "Site of the 1848 gold discovery"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Gold Facts"
    facts:
      - "Adopted as California's state mineral in 1965."
      - "James Marshall discovered gold at Sutter's Mill in Coloma on January 24, 1848."
      - "The California Gold Rush drew an estimated 300,000 people to the state within a few years."
      - "California's nickname, the Golden State, comes directly from the 1848 gold discovery."

