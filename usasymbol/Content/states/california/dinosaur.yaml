faq:
  - question: "What is California's state dinosaur?"
    answer: "The bones had been in a museum for 75 years under the wrong name. Collected from the Moreno Formation in the 1940s and assigned to the genus Saurolophus, the material sat misidentified until 2014, when researchers established it was a distinct California-only species. California then designated it — as Augustynolophus morrisi — the official state dinosaur by Senate Bill 1540 in 2016. A hadrosaur found only in California, from the Late Cretaceous coastal lowlands of the San Joaquin Valley."

  - question: "What does Augustynolophus morrisi mean?"
    answer: "Augustynolophus honors Gretchen Augustyn, a major donor to the Natural History Museum of Los Angeles County whose funding supported research on the species. The species name morrisi honors paleontologist William J. Morris, who first described the California material in 1973."

  - question: "Why was it previously called Saurolophus morrisi?"
    answer: "When William Morris described the material in 1973, he classified it as a species of Saurolophus, a genus known from Alberta and Asia. A 2014 reanalysis by Prieto-Márquez, Erickson, and Novas found that the California material had a unique combination of features not shared by any Saurolophus species, warranting its own genus."

  - question: "Who campaigned for California's state dinosaur?"
    answer: "Students at Castaic Union School District, working with teachers and local paleontologists, led the campaign that produced Senate Bill 1540. The Natural History Museum of Los Angeles County also supported the effort."

  - question: "Why are hadrosaurs so rare in California?"
    answer: "During the Late Cretaceous, much of California's interior was shallow ocean. The terrestrial coastal strip where land animals lived was geologically active — subject to marine flooding, volcanism, and faulting — making terrestrial fossil preservation extremely unusual. The Moreno Formation represents one of the rare geological settings where coastal dinosaur remains could be preserved."

