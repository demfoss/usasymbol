expert_quote:
  text: "Augustynolophus morrisi is distinguishable from all species of Saurolophus by an autapomorphic combination of anatomical features."
  source: "Prieto-Márquez, Erickson & Novas (2014), Journal of Vertebrate Paleontology — the formal reclassification establishing Augustynolophus as a distinct genus"

faq:
  - question: "What is California's state dinosaur?"
    answer: "California's state dinosaur is Augustynolophus morrisi. It was adopted in 2017."

  - question: "What does Augustynolophus morrisi mean?"
    answer: "The genus honors Gretchen Augustyn, and morrisi honors paleontologist William J. Morris."

  - question: "Why was it previously called Saurolophus morrisi?"
    answer: "It was first placed in Saurolophus, then moved to its own genus in 2014."

  - question: "Who campaigned for California's state dinosaur?"
    answer: "Students in the Castaic Union School District led the campaign."

  - question: "Why are hadrosaurs so rare in California?"
    answer: "Late Cretaceous California had limited land deposits and poor conditions for preserving dinosaur fossils."

