seo_description: "California state colors are Blue and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of California are **Blue** and **Gold**, formally designated by the California Legislature in 1951 under California Government Code § 424. Blue represents the sky and the Pacific Ocean, while gold represents the 1849 Gold Rush and the California poppy — visible across [the California state flag](/states/california/flag/california-state-flag) and state branding statewide. For California, the reference table gives practical HEX, RGB, CMYK, and Pantone values for comparison with other [U.S. state colors](/symbols/colors)."

