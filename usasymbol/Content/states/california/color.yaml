faq:
  - question: "What are the official colors of California?"
    answer: "The official state colors of California are Blue and Gold, formally designated in 1951 under California Government Code § 424. Blue represents the sky and the Pacific Ocean; gold represents the 1849 Gold Rush and the California poppy."
  - question: "What is the HEX code for California Blue?"
    answer: "The standard HEX code for California Blue is #003262, corresponding to Pantone PMS 282 (also known as Berkeley Blue), as standardized by the University of California and the California Department of General Services."
  - question: "What is the HEX code for California Gold?"
    answer: "The standard HEX code for California Gold is #FDB515, corresponding to Pantone PMS 123 (also known as Golden Yellow), as standardized by the University of California and used in official state government branding."
  - question: "When were California's state colors officially adopted?"
    answer: "California's state colors were officially adopted in 1951 under California Government Code § 424, though blue and gold had been the University of California's official colors since 1868."
  - question: "Why does California use blue and gold?"
    answer: "Blue represents California's Pacific Ocean coastline and expansive sky, while gold represents the 1849 Gold Rush that drove California's statehood and the golden California poppy, the official state flower. The University of California adopted the same colors in 1868, establishing them as California's dominant institutional palette decades before legislative codification."
  - question: "Are California's state colors the same as UC Berkeley's colors?"
    answer: "Yes. The University of California at Berkeley standardized the same blue (PMS 282, Berkeley Blue) and gold (PMS 123, Golden Yellow) that serve as California's official state colors under Government Code § 424, and the university's 1868 adoption of these colors directly influenced their eventual designation as official state colors."

