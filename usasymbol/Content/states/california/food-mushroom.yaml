sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is California's State Mushroom?"
    paragraphs:
      - "The California golden chanterelle is California's official state mushroom, designated by the California Legislature in 2023. It grows wild in the state's coastal forests and is one of the most sought-after mushrooms among foragers."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the California Golden Chanterelle"
    paragraphs:
      - "The California golden chanterelle is a trumpet-shaped, orange-yellow mushroom with a fruity smell and wavy, false gills running down its stem. It grows on the ground near oak, pine, and Douglas fir trees, forming an underground partnership with tree roots that helps both the fungus and the tree absorb nutrients. Foragers gather it during the rainy season, typically from late fall through winter."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Golden Chanterelle Became California's State Mushroom"
    paragraphs:
      - "The California Legislature designated the California golden chanterelle the official state mushroom in 2023, recognizing a species long valued by the state's foraging and restaurant communities."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why California Chose the Golden Chanterelle"
    paragraphs:
      - "The golden chanterelle grows widely in California's coastal oak woodlands and mixed conifer forests, making it one of the most commonly foraged wild mushrooms in the state. It has long been popular with home cooks and chefs, and California's mild, wet winters give it ideal growing conditions."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "California Golden Chanterelle Facts"
    facts:
      - "Adopted as California's state mushroom in 2023."
      - "It grows near oak, pine, and Douglas fir trees in coastal forests."
      - "Foragers typically find it during the rainy season, from late fall through winter."
      - "Its bright orange-yellow color and fruity smell make it easy to identify in the wild."

