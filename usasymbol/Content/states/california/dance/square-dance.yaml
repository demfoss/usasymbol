faq:
  - question: What is California's state dance?
    answer: "California recognizes two official dances: West Coast Swing as its state dance and square dance as its state folk dance, both adopted in 1988."
  - question: When did California adopt square dance as its state dance?
    answer: "California adopted square dance as its official state folk dance in 1988."
  - question: Why did California choose square dance?
    answer: "Square dance already had a broad following at community halls statewide, and California's designation followed a national campaign by square-dance organizations active from the 1970s onward."
  - question: Is California's square dance different from its West Coast Swing designation?
    answer: "Yes. Square dance is California's official state folk dance, while West Coast Swing is the state's official state dance, and both were adopted in the same year."

