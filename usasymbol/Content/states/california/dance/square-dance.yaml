sections:
  - id: overview
    icon: fa-solid fa-music
    title: California State Dance
    paragraphs:
      - "California named square dance its official state folk dance in 1988. The same legislative action named West Coast Swing the state's official state dance, giving California two separate dance designations rather than one."
      - "As in other states, California's square dance follows the standard national pattern of four couples, a caller, and shared figures."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each pair facing the center from one of the four sides. A caller directs the group through a sequence of figures, timed to lively string-band or fiddle music."
      - "Because dancers follow the caller's live instructions rather than a memorized routine, no two square dances unfold exactly the same way, even when the same figures appear."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples take positions on the four sides of a square, each facing the center."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod first to your partner and then to your corner as the caller opens the dance."
      - title: "Circle Left with the Full Set"
        description: "All eight dancers join hands and move together to the left, keeping time with the caller's count."
      - title: "Do-Si-Do Your Partner"
        description: "Pass around your partner back to back without turning to face them, returning to your original spot."
      - title: "Promenade to Close the Set"
        description: "Take your partner's hand and walk together around the square back to your home position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents California
    paragraphs:
      - "Square dance reached California through community halls, granges, and school gatherings across the state, much as it did nationwide, giving it a broad and familiar presence by the late twentieth century. That familiarity made it a natural companion designation alongside a dance native to the state."
      - "California's 1988 folk dance designation followed a decades-long national campaign. Square-dance callers' associations and dance organizations, active from the 1970s onward, pushed state legislatures to adopt square dance officially, and California's action came as part of that broader movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How California Adopted the Square Dance
    paragraphs:
      - "California designated square dance its official state folk dance in 1988, the same year it separately named West Coast Swing the state's official state dance, giving the state two distinct dance designations rather than one."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "California adopted square dance as its official state folk dance in 1988."
      - "California separately recognizes West Coast Swing as its official state dance, also adopted in 1988."
      - "Square dance places four couples into a square, directed by a caller through each figure."
      - "California's designation followed a national campaign by square-dance callers' groups that began in the 1970s."

