faq:
  - question: What is California's state dance?
    answer: "California's official state dance is West Coast Swing, adopted in 1988."
  - question: When did California adopt West Coast Swing as its state dance?
    answer: "California adopted West Coast Swing as its official state dance in 1988."
  - question: Why did California choose West Coast Swing?
    answer: "West Coast Swing developed in Los Angeles as dancers adapted Lindy Hop to smaller local dance floors, giving California a direct connection to the dance's origin."
  - question: What is the difference between West Coast Swing and East Coast Swing?
    answer: "West Coast Swing moves along a slotted line with a slower, grounded anchor step, while East Coast Swing is bouncier and moves more in a circular pattern. West Coast Swing developed from East Coast swing and Lindy Hop on smaller Los Angeles dance floors."

