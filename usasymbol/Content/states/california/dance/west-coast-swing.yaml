sections:
  - id: overview
    icon: fa-solid fa-music
    title: California State Dance
    paragraphs:
      - "California named West Coast Swing its official state dance in 1988, recognizing a partner dance that took shape in Los Angeles as Lindy Hop adapted to smaller local dance floors."
      - "The state also separately recognizes square dance as its official state folk dance, giving California two distinct official dance designations rather than one."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "West Coast Swing Explained"
    paragraphs:
      - "West Coast Swing is a slotted partner dance, meaning partners travel back and forth along an imaginary straight line on the floor instead of circling each other. One partner typically stays anchored near one end of the slot while the other moves through it."
      - "The dance centers on a small triple-step pattern called the anchor step, which gives West Coast Swing its grounded, elastic connection between partners. Compared to the bouncier East Coast swing it grew from, West Coast Swing moves at a slower, more controlled pace that suits a wide range of music, from blues to contemporary R&B."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the West Coast Swing
    steps:
      - title: "Set Up Along the Slot"
        description: "Face your partner along an imaginary straight line on the floor, called the slot, rather than standing in a circle."
      - title: "Find Your Anchor Step"
        description: "Practice the small triple step in place that grounds each pattern and gives the dance its steady, elastic feel."
      - title: "Send Your Partner Down the Slot"
        description: "The lead sends the follow traveling away down the slot, then draws them back toward the anchor position."
      - title: "Add a Basic Push Pattern"
        description: "Practice a sugar push, where the follow travels out and returns, building the give-and-take connection central to the dance."
      - title: "Stretch the Timing to the Music"
        description: "Let the connection between partners compress and extend slightly with the phrasing of the song, a signature of West Coast Swing's feel."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why West Coast Swing Represents California
    paragraphs:
      - "West Coast Swing developed specifically in Los Angeles, where dancers adapted the fast, wide-open moves of Lindy Hop to fit smaller, crowded Hollywood-era dance floors. That local origin gave California a direct, place-based claim to the dance that few other states could match."
      - "Because the dance itself carries the state's name and traces its roots to Southern California ballrooms, naming it the official state dance in 1988 tied California's dance heritage to a style it helped create rather than adopting a tradition from elsewhere."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How West Coast Swing Became a State Dance
    paragraphs:
      - "California designated West Coast Swing its official state dance in 1988, the same year it separately named square dance the state's official folk dance, giving the state two distinct dance designations rather than one."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: West Coast Swing Facts
    facts:
      - "California adopted West Coast Swing as its official state dance in 1988."
      - "California separately recognizes square dance as its official state folk dance, also adopted in 1988."
      - "West Coast Swing developed in Los Angeles as Lindy Hop adapted to smaller Hollywood-era dance floors."
      - "The dance is built around a slotted floor pattern and a grounded anchor step rather than circular movement."

