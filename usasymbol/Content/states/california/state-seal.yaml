hero_image_alt: Great Seal of the State of California, official emblem designed in 1849
hero_image_caption: The Great Seal of California, designed at the 1849 Monterey Constitutional Convention. The figure of Minerva dominates the upper portion; the grizzly bear stands at her feet.
intro_text: 'California''s state seal uses Minerva — the goddess born fully armored, without childhood — to make a specific argument: California skipped the territorial phase entirely and entered the Union as a full state in 1850, the 31st, without a period of federal oversight.'
