seo_title: 'Great Seal of California: Minerva, Grizzly Bear & What Each Element Means'
seo_description: "California's state seal features Minerva, the Roman goddess of wisdom, because California was admitted as a state without a territorial period, just as Minerva was born an adult. Designed in 1849, the seal includes 31 stars, a grizzly bear, a gold miner, and the motto Eureka. Here's what every element means."
