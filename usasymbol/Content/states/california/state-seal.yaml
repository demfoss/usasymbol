name: Great Seal of California
adopted_year: 1849
revised_year: 1937
is_official: true
legislation: California Government Code § 400
meaning: "The Great Seal of California connects the state to classical antiquity: Minerva, the Roman goddess of wisdom (Athena in Greek mythology), is the central figure because California was born as a state without passing through a territorial period, just as Minerva was born an adult. The 31 stars, the grizzly bear, the miner, and the ships in the harbor all anchor the seal to the specific moment of California's founding in 1849."
