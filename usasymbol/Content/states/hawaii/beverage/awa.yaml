seo_title: 'Hawaii State Beverage: ʻAwa (Kava) — Official Drink, Not the Mai Tai'
seo_description: Hawaii's official state beverage is ʻawa (kava), designated in 2018. Learn why Hawaii chose ʻawa over the Mai Tai, POG, and Blue Hawaii — and what sets the official state drink apart from the drinks tourists associate with the islands.
intro_text: 'Hawaii''s official state beverage is <strong>ʻawa</strong>, designated by the legislature in <strong>2018</strong>. The choice was deliberate: Hawaii has plenty of famous drinks — the Mai Tai, POG, the Blue Hawaii — but what the state put on record is something far older. ʻAwa is a traditional Polynesian drink made from the root of <em>Piper methysticum</em> — earthy, bitter, and mildly numbing, with a ceremonial history in Hawaii that stretches back more than a thousand years.'
