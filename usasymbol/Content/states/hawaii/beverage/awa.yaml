sections:
- id: official-state-beverage
  icon: fa-solid fa-circle-check
  title: Is ʻAwa the Official State Beverage of Hawaii?
  paragraphs:
  - Yes — <strong>ʻawa is the official state beverage of Hawaii</strong>, designated in 2018. Hawaii is well known for cocktails like the Mai Tai and locally beloved blends like POG, but the legislature didn't choose any of those. It chose a drink that Hawaiian society had been using for more than a thousand years before any resort existed on the islands.
  - Most state beverage designations are quiet acknowledgments — a dairy state names milk, an agricultural state names its signature juice. Hawaii's choice was different. It placed a drink with pre-contact ceremonial roots on the same [official list](/states/hawaii) as the state flower and state bird, in a direct statement about what the state considers worth putting on record.
- id: why-awa-was-chosen
  icon: fa-solid fa-bullseye
  title: Why Hawaii Named ʻAwa Its State Beverage
  paragraphs:
  - The case for ʻawa was not about commercial profile or agricultural output. It was about cultural continuity. ʻAwa is one of the canoe plants — species brought deliberately across the Pacific by Polynesian voyagers when they settled Hawaii. Those voyagers did not carry ʻawa by accident. It was essential to the social and ceremonial life they were building.
  - ʻAwa had been embedded in Hawaiian society for over a millennium before statehood. Its role in ceremony, diplomacy, healing, and daily social life was not peripheral — it was foundational.
  - The Mai Tai was invented in the 1940s in California. POG came in 1971. ʻAwa arrived with the first Hawaiians. That gap in history is the core of the argument.
- id: what-awa-is
  icon: fa-solid fa-leaf
  title: What Is ʻAwa?
  paragraphs:
  - ʻAwa is a drink made from the root of <em>Piper methysticum</em>, a plant in the pepper family native to the Pacific Islands. The root is pounded or ground, then mixed with water and strained to produce a murky, grayish-brown liquid. The word <strong>ʻawa</strong> means <em>bitter</em> in Hawaiian — which is an honest description. The taste is earthy, sharp, and distinctly not sweet.
  - The drink produces a mild numbing sensation in the mouth and lips. That effect comes from kavalactones, the active compounds in the root. In moderate amounts, ʻawa is calming without being intoxicating in the way alcohol is. The sensation is closer to a physical settling — muscles relax, tension drops — than to the cognitive effects of alcohol.
  - Traditional preparation involved chewing or pounding the root by hand — the method affected both flavor and potency. Today's preparation typically uses a mortar or blender, and the drink is served in a coconut shell cup called an <em>ipu ʻawa</em>.
- id: awa-in-hawaii-culture
  icon: fa-solid fa-landmark
  title: ʻAwa in Hawaiian Culture and Ceremony
  paragraphs:
  - 'In Hawaii, ʻawa was not simply a social drink. It was the currency of ceremony. Offerings to the gods included ʻawa. Diplomatic meetings between aliʻi — the chiefly class — began with ʻawa. Healers used it. Priests used it. The protocols around its preparation and serving were precise and ranked: who prepared it, who served it, and who drank first all carried meaning within a highly stratified society.'
  - ʻAwa connected the human world to the divine. In Hawaiian cosmology, the plant had its own genealogy and its own spiritual associations. Drinking it in a ceremonial context was not casual — it marked a transition, an agreement, or a ritual act. That is not a metaphor; it was the lived practice of Hawaiian society for generations.
  - The cultural significance survived colonization, though not without damage. Missionary influence and the catastrophic population decline of the 19th century disrupted many traditional practices, and ʻawa ceremony was among them. The 20th-century Hawaiian cultural renaissance brought it back — not as a relic but as a living practice. The 2018 state designation extended that recognition into official identity.
- id: famous-hawaii-drinks-not-official
  icon: fa-solid fa-cocktail
  title: Mai Tai, POG, and the Drinks Hawaii Didn't Choose
  paragraphs:
  - The <strong>Mai Tai</strong> is probably the most famous Hawaiian cocktail in the world — and it was invented in Oakland, California, in 1944 by Trader Vic (Victor Bergeron). The drink spread through the tiki bar movement and became permanently attached to the idea of Hawaii in the American imagination. It arrived as tourism did, as part of a commercial fantasy about the Pacific that had more to do with mainland marketing than with Hawaiian tradition.
  - <strong>POG</strong> — passionfruit, orange, and guava — has a more genuine Hawaii origin story. The juice blend was created in 1971 by Haleakalā Dairy on Maui, using fruit grown in Hawaii and sold primarily to local schools and families. POG became genuinely embedded in local culture in a way that most tourist drinks did not. It is beloved and recognizably local — but it is not official.
  - The <strong>Blue Hawaii</strong> is a cocktail (rum, blue curaçao, pineapple juice) invented in Honolulu in 1957 and later popularized by an Elvis Presley film. The <strong>Lava Flow</strong> — coconut rum, strawberry, pineapple, and coconut cream — is a Waikīkī resort staple. Neither has any connection to Hawaiian history beyond the geography of their creation.
  - <strong>ʻOkolehao</strong> is the closest thing Hawaii has to a historically rooted spirit. Made from the fermented root of the <em>tī</em> plant (Hawaiian ti), it was distilled in the early 19th century and has some claim to being a genuinely Indigenous Hawaiian alcoholic drink. It is not the official state beverage, but among the non-official options, it stands apart from the cocktails and juice blends by having actual deep roots in Hawaiian plant culture.
  - 'The [state beverages page](/symbols/beverages) puts Hawaii''s choice in national context: most states designated milk. Hawaii chose something that predates the state itself by a thousand years. That gap between official and iconic is the whole story.'
timeline:
- year: Pre-contact
  description: Polynesian voyagers carry ʻawa to Hawaii as one of the canoe plants — species brought intentionally to sustain life and culture in the new settlement.
- year: Pre-contact – 1800s
  description: ʻAwa is central to Hawaiian ceremony, healing, and diplomatic protocol. Its use by aliʻi and in religious ritual is documented in Hawaiian oral tradition and early written accounts.
- year: 1819–1850s
  description: The collapse of the kapu system (1819) and increasing missionary and colonial influence disrupts traditional Hawaiian practices, including ceremonial ʻawa use.
- year: '1944'
  description: Trader Vic invents the Mai Tai in Oakland, California. The drink spreads through the tiki bar movement and becomes globally associated with Hawaii.
- year: '1957'
  description: The Blue Hawaii cocktail is created at the Royal Hawaiian Hotel in Honolulu.
- year: '1971'
  description: Haleakalā Dairy on Maui creates POG — a passionfruit, orange, and guava juice blend — originally for local school lunch programs. It becomes genuinely embedded in local culture.
- year: '2018'
  description: Hawaii designates ʻawa as the official state beverage, recognizing its ceremonial, cultural, and historical significance to Native Hawaiian tradition.
faq:
- question: What is Hawaii's official state beverage?
  answer: Hawaii's official state beverage is ʻawa, also known as kava. It was designated in 2018. The cocktails and juice blends tourists associate with Hawaii — the Mai Tai, POG, the Blue Hawaii — are popular and well-known, but none hold an official state designation.
- question: What is ʻawa?
  answer: ʻAwa is a traditional Polynesian drink made from the root of Piper methysticum. The root is ground or pounded, mixed with water, and strained. It has an earthy, bitter taste and produces a mild numbing sensation in the mouth. The word ʻawa means bitter in Hawaiian.
- question: Is POG the official state drink of Hawaii?
  answer: No. POG — a passionfruit, orange, and guava juice blend — is strongly associated with Hawaii and has a genuine local history going back to 1971, when Haleakalā Dairy on Maui first produced it. But it has never been designated the official state beverage. ʻAwa holds that designation.
- question: Is the Mai Tai the official state drink of Hawaii?
  answer: No. The Mai Tai is not official and was not invented in Hawaii — it was created in Oakland, California, in 1944 by Trader Vic. It became associated with Hawaii through the tiki bar movement and tourism, not through Hawaiian history.
- question: Why did Hawaii choose ʻawa instead of a more famous drink?
  answer: ʻAwa was chosen for its cultural and ceremonial significance in Native Hawaiian tradition. It was brought to Hawaii by Polynesian voyagers centuries before European contact and played a central role in Hawaiian ceremony, diplomacy, and healing. The commercially famous drinks associated with Hawaii — the Mai Tai, POG, Blue Hawaii — are recent arrivals by comparison.
- question: What does ʻawa taste like?
  answer: ʻAwa has an earthy, bitter, slightly muddy flavor. It is not sweet. It produces a numbing sensation in the mouth and lips from kavalactones, the active compounds in the root. The effect is calming rather than intoxicating in the manner of alcohol.
- question: What is ʻokolehao?
  answer: ʻOkolehao is a traditional Hawaiian spirit distilled from the fermented root of the tī plant (Hawaiian ti). It has deep roots in Hawaiian plant culture and was produced as early as the 19th century. It is not the official state beverage, but among historically rooted Hawaiian drinks, it stands apart from cocktails and juice blends.
