seo_title: 'Hawaii License Plate Slogan: Aloha State, Rainbow Plate History & Designs'
seo_description: Hawaii's license plate slogan is "Aloha State," first used on plates in 1961 after an earlier "Aloha" slogan appeared in 1957. Learn why the rainbow became Hawaii's defining plate image and how the design changed over decades.
hero_image: /images/license-plates/hawaii/rainbow-aloha-state-plate.webp
hero_image_alt: Hawaii rainbow license plate with Aloha State slogan
hero_image_caption: Hawaii's rainbow plate pairs the state's best-known natural visual with the "Aloha State" slogan, which has been on general-issue passenger plates since 1961.
intro_text: '**"Aloha State"** is Hawaii''s license plate slogan, but the exact phrase did not arrive on plates at statehood. Hawaii first used the shorter "Aloha" on general-issue passenger plates in 1957, while still a U.S. territory. "Aloha State" followed in 1961, two years after Hawaii became the 50th state, and it has remained the state''s plate slogan ever since.'
quick_answer: '"Aloha State" has appeared on Hawaii general-issue passenger plates since 1961. The shorter "Aloha" appeared first, in 1957, while Hawaii was still a territory. Hawaii''s plates are also recognized for the rainbow design, introduced in the early 1990s, which pairs the slogan with one of the most distinctive plate graphics in the United States.'
