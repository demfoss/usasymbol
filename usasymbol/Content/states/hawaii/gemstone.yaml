intro_text: "Hawaii's state gem is black coral, adopted in 1987 to recognize the deep-water coral first harvested commercially in the Au'au Channel off Maui in 1958. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Hawaii State Gem
    paragraphs:
      - "Black coral is Hawaii's official state gem, designated by the Hawaii Legislature in 1987. Unlike most state gemstones, it is not a mineral but the skeleton of a slow-growing marine coral colony, harvested from deep water and polished into jewelry."
      - "Hawaii chose black coral because divers built a real local industry around it, discovering rich beds in the channel between Maui, Lanai, and Molokai and turning the material into a signature Hawaiian gem."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Black Coral?"
    paragraphs:
      - "Black coral is the skeleton of a colonial marine animal in the order Antipatharia, built from layers of protein and chitin rather than the calcium carbonate that forms most coral reefs. In the water the living colony looks like a branching, feathery tree with small polyps covering the surface."
      - "Once the outer tissue is removed, the skeleton underneath is a dense, dark material that takes a smooth, glossy black polish, which is why jewelers prize it over the living coral itself. Hawaii's black coral grows slowly in deep, cool water rather than in shallow reefs."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Hawaii Chose Black Coral as Its State Gem"
    paragraphs:
      - "Commercial black coral diving in Hawaii began in 1958, when divers found dense beds in the Au'au Channel off Lahaina, Maui, the first significant beds located in decades. The discovery launched a jewelry industry built specifically around Hawaiian black coral."
      - "Scuba divers and the local jewelry trade pushed for the state gem designation, and the state's own Department of Land and Natural Resources testified in support. The choice reflected an industry that existed only because of Hawaii's deep coastal waters, not a material imported from elsewhere."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Black Coral Became Hawaii's State Gem"
    paragraphs:
      - "State lawmakers designated black coral the official state gem in 1987, nearly three decades after the Au'au Channel beds were first discovered, formally recognizing a fishery and jewelry trade that had grown up around it."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Black Coral Is Found in Hawaii"
    paragraphs:
      - "The Au'au Channel, the deep-water passage between Maui, Lanai, and Molokai near Lahaina, holds Hawaii's best-documented black coral beds, first fished commercially starting in 1958. Divers there work at depths far greater than a typical reef dive, since black coral grows well below the shallow, sunlit water where most reef corals live."
    sites:
      - name: Au'au Channel
        city: Lahaina
        lat: 20.8783
        lng: -156.6825
        note: "Site of Hawaii's first commercial black coral beds"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Black Coral Facts"
    facts:
      - "Adopted as Hawaii's state gem in 1987."
      - "Divers discovered Hawaii's first modern commercial black coral beds in the Au'au Channel off Lahaina, Maui, in 1958."
      - "Black coral is built from protein and chitin, not the calcium carbonate skeleton of reef-building corals."
      - "Hawaii is home to about 14 species of black coral, several of which grow slowly enough that overharvesting is a concern for regulators."

