faq:
  - question: What is Hawaii's state gem?
    answer: "Hawaii's state gem is black coral, the polished skeleton of a deep-water marine coral, adopted by the Hawaii Legislature in 1987."
  - question: When did Hawaii adopt black coral as its state gem?
    answer: "The Hawaii Legislature designated black coral the official state gem in 1987."
  - question: Why did Hawaii choose black coral?
    answer: "Divers built a jewelry industry around black coral after discovering dense beds in the Au'au Channel off Maui in 1958, and the state's scuba diving and jewelry trade pushed for the designation."
  - question: Where can you find black coral in Hawaii?
    answer: "The Au'au Channel between Maui, Lanai, and Molokai, near Lahaina, is Hawaii's best-documented source of commercial black coral, first fished there in 1958."

