# verification: confirmed. Hawaii law (Hawaii Revised Statutes § 5-11.5, from 2006) names the humuhumunukunukuapua`a (Rhinecanthus rectangulus) the official fish of the State. It was first chosen in the 1980s for five years only, and that status ended in 1990.
