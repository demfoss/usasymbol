intro_text: Hawaii's state fish is the humuhumunukunukuāpuaʻa, or reef triggerfish, a small reef fish with one of the longest names in Hawaii. It became the permanent state fish in 2006. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Hawaii?
  paragraphs:
  - The humuhumunukunukuāpuaʻa is the official fish of the State of Hawaii. The Hawaii Legislature made it official in 2006. Its scientific name is Rhinecanthus rectangulus.
  - In English it is called the reef triggerfish or rectangular triggerfish. Most people in Hawaii just call it humuhumu for short.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Humuhumunukunukuāpuaʻa
  paragraphs:
  - The humuhumu is a sturdy fish with an angular body, a bold color pattern, and a spine on its back. It grows up to about 10 inches long.
  - Its Hawaiian name means triggerfish with a snout like a pig. Its eyes sit high on its head and can move separately, which helps it watch for food and danger.
  - It swims in an unusual way. It waves its top and bottom fins to move forward or backward, or to hover over the reef.
  - When a predator chases it, a triggerfish may dive into a hole in the reef. Sometimes it makes grunting sounds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 1984, state lawmakers asked for a public survey to pick a state fish. The humuhumu won, partly because schoolchildren supported it through classroom projects.
  - People questioned how the survey was done, so lawmakers made the title last only five years. It ended in 1990, and almost nobody noticed.
  - Years later, a 6-year-old boy who loved fish told state Representative Blake Oshiro that the humuhumu was no longer the official fish. Oshiro introduced a bill, and in 2006 the humuhumu became Hawaii's permanent state fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Hawaii Chose the Humuhumunukunukuāpuaʻa
  paragraphs:
  - The humuhumu won the title in a public vote. Schoolchildren across the islands helped choose it. State law names the fish but does not give a detailed reason.
  - Not everyone agreed with the choice. Some lawmakers pointed out that the humuhumu also lives outside Hawaii, and they preferred the ʻoʻopu, a goby found only in the islands.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Humuhumunukunukuāpuaʻa
  paragraphs:
  - The humuhumu lives on shallow outer reefs around the Hawaiian Islands. It often stays near the bottom on rocky reefs where waves wash over the lava rock.
  - Snorkelers often see it at Hanauma Bay on Oahu. It is shy and keeps its distance, but it is easy to watch from a little way off.
