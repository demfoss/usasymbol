- id: facts
  icon: fa-solid fa-lightbulb
  title: Humuhumunukunukuāpuaʻa Facts
  facts:
  - Adopted in 2006 by the Hawaii Legislature.
  - Scientific name is Rhinecanthus rectangulus.
  - Grows up to about 10 inches long.
  - Its Hawaiian name has 21 letters and means triggerfish with a snout like a pig.
  - Lives on reefs from the Red Sea and East Africa across the Pacific to Hawaii.
faq:
- question: What is Hawaii's state fish?
  answer: Hawaii's state fish is the humuhumunukunukuāpuaʻa, also called the reef triggerfish or humuhumu.
- question: When did Hawaii adopt the Humuhumunukunukuāpuaʻa?
  answer: The Hawaii Legislature made it the permanent state fish in 2006. It had been chosen in the 1980s for five years, but that title ran out in 1990.
- question: Why did Hawaii choose the Humuhumunukunukuāpuaʻa?
  answer: It won a public vote, with lots of help from schoolchildren. State law does not give a detailed reason.
- question: How do you say humuhumunukunukuāpuaʻa?
  answer: Say it as who-moo-who-moo-new-koo-new-koo-ah-poo-ah-ah. Many people simply call it humuhumu.
- question: Is the humuhumu found only in Hawaii?
  answer: No. It also lives on reefs across the Indian and Pacific Oceans, but it is one of the best-known fish in Hawaii.
