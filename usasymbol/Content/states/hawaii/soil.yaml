meaning: "Hilo soil is built from the sky down. Every time Mauna Kea erupted over the past few hundred thousand years, a new layer of volcanic ash settled on the windward slopes above Hilo and began to weather. Layer after layer, the ash broke down into iron-rich clay minerals that hold enormous amounts of water — not through dense pores like ordinary clay, but through the molecular structure of the minerals themselves. Rain falls on the Hāmākua Coast at more than 140 inches a year, yet the soil drains freely because those volcanic minerals let water through while keeping nutrients and moisture available to roots. The result is some of the most naturally fertile farmland in the Pacific."
meaning_title: How Volcanic Ash Becomes Fertile Soil
meaning_after_section: history
