faq:
- question: What is Hawaii's state soil?
  answer: "Hawaii's state soil is the Hilo series — a deep, dark reddish-brown volcanic ash soil found on the Hāmākua Coast of the Big Island. It formed from layers of volcanic ash that weathered over hundreds of thousands of years under extremely heavy rainfall."
- question: What kind of soil is Hilo soil?
  answer: "Hilo soil is an Andisol — a volcanic ash soil. Andisols form where volcanic ash weathers in a wet climate. They make up less than one percent of Earth's land surface and are known for high fertility and high water-holding capacity."
- question: What color is Hilo soil?
  answer: "Hilo soil is dark reddish-brown from the surface all the way down. That color comes from ferrihydrite and other iron-rich minerals that formed as volcanic ash weathered under centuries of rain. Unlike most soils, Hilo soil barely changes color with depth."
- question: Where is Hilo soil found in Hawaii?
  answer: "Hilo soil is found on the Hāmākua Coast of the Big Island — the wet, windward slopes northeast of the city of Hilo. It covers approximately 21,000 acres in Hawaii County. No significant Hilo series acreage exists on any other Hawaiian island."
- question: How much rain does Hilo soil receive?
  answer: "Mean annual rainfall on Hilo soil is about 145 inches — more than twelve feet per year. The trade winds push moisture from the Pacific up against the slopes of Mauna Kea, producing almost constant cloud cover and rain on the Hāmākua Coast."
- question: What crops grow in Hilo soil?
  answer: "Sugarcane was the dominant crop for more than a century, using Hilo soil's deep fertility and constant rainfall. Since the last Hāmākua Coast sugar mill closed in 1994, farmers have shifted to macadamia nuts, tropical fruit orchards, and livestock pasture. Some land now supports native Hawaiian forest."
- question: Why does Hilo soil drain well if it gets so much rain?
  answer: "Volcanic minerals in Andisols — especially ferrihydrite — hold water in their molecular structure rather than in pores. This means excess rainfall passes through the soil quickly while the minerals retain the moisture plants need. Dense clay would waterlog under 145 inches of rain; Hilo soil handles it without saturating."
- question: When was the Hilo soil series established?
  answer: "The Hilo series was established in 1949 in the Soil Survey of the Territory of Hawaii, about a decade before Hawaii became a state in 1959."

