    flower: "ʻŌhiʻa Lehua (Metrosideros polymorpha)"
    symbolism: "The fiery red of the ʻōhiʻa lehua blossom, the first flower to emerge on fresh lava flows; red honors Pele, the Hawaiian volcano goddess who is said to dwell in the active craters of Kīlauea and Mauna Loa on the Big Island, and represents the volcanic fire that continues to create new land in the Hawaiian archipelago"
