title: "Official and Traditional Colors of Hawaii"
state: "Hawaii"
adopted_year: null

seo_title: "Hawaii State Colors: Official HEX Codes & Meaning"
seo_description: "Hawaii state colors follow a unique eight-island system, officially codified in 2000. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "Hawaii has no single official state color; instead, the state operates a unique **eight-island color system** in which each main island holds its own officially designated color codified in Hawaii state law in 2000, ranging from Red (Hawaiʻi Island) to Purple (Kauaʻi) and White (Niʻihau). Each color is tied to the island's official flower or lei material — a tradition rooted in Native Hawaiian culture and the Pāʻū parade, celebrated as part of [the Aloha State](/states/hawaii/nickname/the-aloha-state) identity. Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Hawaii colors accurately."

official_colors: "Eight Island Colors: Red, Pink, Gray, Orange, Green, Yellow, Purple, White"
official_since: "2000 (Hawaii Revised Statutes, island color and lei material designations)"
primary_use: "Pāʻū parade costumes, island identity branding, lei-making tradition, state cultural events"
known_for: "The only state in the United States with a multi-island color system rather than a single set of state colors; each color is derived from the island's official flower or lei material, connecting the color palette directly to Hawaii's native botanical heritage and the tradition of the Pāʻū rider parade dating to 1906"

