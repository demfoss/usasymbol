    cmyk: "3, 2, 0, 32"
    pantone: "PMS 422"
    island: "Kahoʻolawe"
    flower: "Hinahina (Helichrysum sandwicensium)"
    symbolism: "The silver-gray of the hinahina plant, a native Hawaiian everlasting flower whose silvery foliage blankets Kahoʻolawe; gray reflects both the plant's tone and the island's austere, uninhabited landscape — Kahoʻolawe was used as a US Navy bombing range from World War II until 1990 and remains under restoration, making gray a color of resilience and renewal"
  - name: "Lānaʻi Orange"
    hex: "#E07B39"
    rgb: "224, 123, 57"
    cmyk: "0, 45, 75, 12"
    pantone: "PMS 1525"
    island: "Lānaʻi"
    flower: "Kaunaʻoa (Cuscuta sandwichiana)"
    symbolism: "The vivid orange of the kaunaʻoa, a native parasitic vine — the only member of its genus endemic to Hawaii — that grows in bright orange tangles along Lānaʻi's coastal beaches; the color reflects the island's warm, dry, sun-drenched landscape, and the kaunaʻoa's medicinal properties made it an important plant in traditional Hawaiian healing practices"
  - name: "Molokaʻi Green"
    hex: "#4B7A44"
    rgb: "75, 122, 68"
    cmyk: "39, 0, 44, 52"
    pantone: "PMS 364"
    island: "Molokaʻi"
    flower: "Pua Kukui / White Kukui Blossom (Aleurites moluccanus)"
    symbolism: "The deep green of Molokaʻi's rolling rural landscape, adopted as the island color even though the kukui tree's blossoms are white; green honors Molokaʻi's identity as the most rural and traditional of the main Hawaiian islands, and the kukui tree — Hawaii's official state tree, designated in 1959 — has been central to Hawaiian culture for centuries as a source of oil for lamps, medicine, and polished nuts for royal lei"
  - name: "Oʻahu Yellow"
    hex: "#F2C75C"
    rgb: "242, 199, 92"
    cmyk: "0, 18, 62, 5"
    pantone: "PMS 1225"
    island: "Oʻahu"
    flower: "ʻIlima (Sida fallax)"
    symbolism: "The golden yellow of the ʻilima, a delicate five-petaled flower in the hibiscus family that was historically reserved for Hawaiian royalty and considered a symbol of love; creating a single ʻilima lei requires between 500 and 1,000 hand-gathered blossoms, making it among the most labor-intensive lei in Hawaii and a color that speaks to Oʻahu's status as the Gathering Place and the seat of Hawaiian royalty"
  - name: "Kauaʻi Purple"
    hex: "#6B3FA0"
    rgb: "107, 63, 160"
    cmyk: "33, 61, 0, 37"
    pantone: "PMS 267"
    island: "Kauaʻi"
    flower: "Mokihana (Pelea anisata)"
    symbolism: "The regal purple of the mokihana tree's small blossoms, an endemic native citrus tree found only in the wet forests of Mount Waialeale on Kauaʻi — the second wettest place on Earth; the mokihana berry emits a strong anise-like fragrance when crushed and was used by ancient Hawaiians as perfume; purple honors Kauaʻi's reputation as the Garden Isle, the oldest and most geologically mature of the main Hawaiian islands"
  - name: "Niʻihau White"
    hex: "#FFFFFF"
    rgb: "255, 255, 255"
    cmyk: "0, 0, 0, 0"
    pantone: "White"
    island: "Niʻihau"
    flower: "Niʻihau Shell (Pupu o Niʻihau)"
    symbolism: "Uniquely, Niʻihau's color derives not from a flower but from the rare white shells (pupu o Niʻihau) found on the island's beaches; Niʻihau shell lei are among the most prized and expensive in Hawaii, selling for hundreds to thousands of dollars each; white reflects Niʻihau's status as the Forbidden Island — a privately owned island accessible only to Native Hawaiians and invited guests — and its role as the last stronghold of the Hawaiian language as a daily spoken tongue"

sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Hawaii's eight-island color system was formally codified in Hawaii state law in 2000, when the state legislature officially designated a color and lei material for each of the eight main islands. This system has no parallel among any other US state: rather than designating a single set of state colors, Hawaii recognizes eight distinct island color identities that together form a collective palette representing the full diversity of the Hawaiian archipelago. The colors are tied directly to each island's official flower or lei material, embedding botany, geography, and Native Hawaiian cultural tradition into the official color system and complementing [Hawaii's state flag design](/states/hawaii/flag/hawaii-state-flag)."
      - "The cultural tradition underlying the island color system is considerably older than the 2000 legislative codification. The Pāʻū parade — in which women riders on horseback wear their island's color in elaborate floral costumes and drape their horses in the island's official flower — dates to at least 1906 in the modern organized form, and reflects a much older Native Hawaiian tradition of island-specific floral identity. The Kamehameha Day parade, held annually on June 11 to honor King Kamehameha I, the founder of the Hawaiian Kingdom, has featured Pāʻū riders in island colors for over a century, giving the color system a living cultural presence long before formal legislative designation and aligning with [Hawaii's sovereignty-era motto](/states/hawaii/motto/ua-mau-ke-ea-o-ka-aina-i-ka-pono)."
    subsections:
      - subtitle: "The 2000 Legislative Codification"
        text: "The Hawaii state legislature's 2000 action to officially designate island colors and lei materials gave formal legal standing to a color tradition that Hawaiians had practiced culturally for generations. The designations appear in the Hawaii Revised Statutes and assign to each island both a specific color — linked to the island's dominant botanical symbol — and an official lei material used to represent that island in cultural ceremonies, parades, and official state functions. The legislation formalized what the Pāʻū parade tradition had long expressed: that Hawaii's identity is not singular but a harmonious collective of distinct island personalities, each with its own color, flower, and cultural story, similar to the way [Hawaii's state flower page](/states/hawaii/flower/yellow-hibiscus) documents native symbolism."
      - subtitle: "The Pāʻū Parade Tradition"
        text: "The Pāʻū (skirt) rider tradition is the primary living expression of Hawaii's island color system. In Pāʻū parades, women riders wear long skirts (pāʻū) in their island's official color and adorn both themselves and their horses with the island's official lei material, creating a moving display of all eight island colors. The tradition is celebrated at major Hawaiian parades including the Kamehameha Day parade in Honolulu and Kona, the Merrie Monarch Festival in Hilo, and the Aloha Festivals parades across the islands. The sight of eight riders in eight distinct colors — red, pink, gray, orange, green, yellow, purple, and white — is one of the most visually distinctive cultural expressions in the United States."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Hawaii's eight-island color system is fundamentally a botanical and geographic color palette: each color is the color of a specific native (or historically significant) plant that grows on that island, creating a direct visual connection between the land, its native flora, and its official color identity. This approach to color symbolism — grounding official colors in the natural world rather than in heraldic tradition, military history, or national loyalty — is uniquely Hawaiian and reflects the Native Hawaiian cultural worldview in which the natural environment, the divine, and human identity are deeply interconnected."
    subsections:
      - subtitle: "Volcanic Red: Hawaiʻi Island"
        text: "The Big Island's red is the most geologically resonant of the eight island colors. The ʻōhiʻa lehua blossom — a feathery, bottlebrush-style flower that grows in brilliant red on lava fields — is one of the first living things to colonize fresh volcanic rock after an eruption, making it a symbol of resilience, renewal, and the creative power of Pele, the Hawaiian volcano goddess. Hawaiian legend holds that ʻŌhiʻa and Lehua were lovers transformed by Pele into a tree and flower; to pick the lehua blossom from the ʻōhiʻa tree is said to cause rain, as Lehua cries for separation from ʻŌhiʻa."
      - subtitle: "Royal Yellow: Oʻahu"
        text: "Oʻahu's yellow ʻilima occupies a uniquely prestigious position in Hawaiian floral culture. The ʻilima was the flower of Hawaiian royalty, historically worn only by aliʻi (chiefs) in lei of exceptional elaborateness and beauty. The flowers are paper-thin and require 500 to 1,000 individual blossoms to string a single lei, making an ʻilima lei a labor of extraordinary devotion. As the most populous island and the seat of the Hawaiian Kingdom's government at Honolulu, Oʻahu's royal yellow color reflects its historical position as the center of Hawaiian political and cultural life."
      - subtitle: "The Forbidden White: Niʻihau"
        text: "Niʻihau's white stands apart from the other seven island colors in two remarkable ways: it is the only color not derived from a flower but from a shell, and it is associated with the most restricted and culturally preserved island in Hawaii. The pupu o Niʻihau — tiny, lustrous white shells found only on Niʻihau's beaches — are used to create some of the most technically demanding and expensive lei in the world. Niʻihau is privately owned by the Robinson family and has been maintained as a Hawaiian-language community since the 19th century; it is the only place in Hawaii where Hawaiian is still spoken as the primary language of daily life."

  - id: "state-emblems"
    title: "Usage in Cultural Events, Flags, and State Identity"
    style: "default"
    paragraphs:
      - "Unlike mainland states where official colors appear primarily on the state flag and government branding, Hawaii's island colors function most visibly in living cultural performance. The state flag of Hawaii — eight horizontal stripes of white, red, and blue representing the eight main islands, with the Union Jack in the canton reflecting Hawaii's historical ties to Britain — uses a separate tricolor palette and does not incorporate the eight island colors. Instead, the eight island colors are expressed through the Pāʻū parade tradition, lei-making competitions, hula costumes, and official state cultural events. The Hawaii Tourism Authority and the Office of Hawaiian Affairs incorporate the island color system in cultural programming, and the eight colors appear in educational materials, visitor center displays, and state cultural heritage documentation. The island color system is also prominently featured at the Merrie Monarch Festival in Hilo — the world's most prestigious hula competition — where each island's competing hālau (hula school) may honor their island's color in performance regalia, with broader cross-state comparison in [U.S. state colors](/symbols/colors)."

