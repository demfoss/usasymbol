timeline:
  - year: "1906"
    description: "Pāʻū parade tradition in its modern organized form is established in Hawaii, with women riders wearing their island's color — the first formal public expression of the eight-island color system"
  - year: "1923"
    description: "Maui officially designates the Lokelani Rose as its island flower, the only non-native species and the only island flower designated before the 2000 statewide codification"
  - year: "1959"
    description: "Hawaii admitted to the Union on August 21 as the 50th state; the kukui tree (Molokaʻi's flower source) is designated the official state tree in the same year"
  - year: "2000"
    description: "Hawaii state legislature formally codifies the eight-island color and lei material system in the Hawaii Revised Statutes, giving legal standing to a color tradition practiced culturally for at least a century"

expert_quote:
  text: "Hawaii's island color system is unlike any other official color tradition in the United States — it is a living, botanical, and culturally performed palette in which the colors are not symbols of history or national loyalty but direct expressions of each island's native landscape and the Native Hawaiian worldview that sees land, life, and identity as inseparable."
  source: "Hawaii State Archives, Cultural Heritage and State Symbols Documentation"

faq:
  - question: "What is the official state color of Hawaii?"
    answer: "Hawaii does not have a single official state color. Instead, Hawaii designates an official color for each of its eight main islands: Red (Big Island), Pink (Maui), Gray (Kahoʻolawe), Orange (Lānaʻi), Green (Molokaʻi), Yellow (Oʻahu), Purple (Kauaʻi), and White (Niʻihau), codified in Hawaii state law in 2000."
  - question: "What is the HEX code for Big Island Red?"
    answer: "The standard HEX code for Hawaiʻi Island Red is #C8102E, corresponding to Pantone PMS 186, derived from the brilliant red ʻōhiʻa lehua blossom — the official flower of the Big Island."
  - question: "What is the HEX code for Oahu Yellow?"
    answer: "The standard HEX code for Oʻahu Yellow is #F2C75C, corresponding to Pantone PMS 1225, derived from the golden yellow ʻilima flower — the royal flower of the Hawaiian aliʻi."
  - question: "What is the HEX code for Kauai Purple?"
    answer: "The standard HEX code for Kauaʻi Purple is #6B3FA0, corresponding to Pantone PMS 267, derived from the blossoms of the mokihana tree, an endemic native citrus found only on Kauaʻi."
  - question: "Why does each Hawaiian island have its own color?"
    answer: "Each Hawaiian island's color is derived from its official flower or lei material — a system rooted in Native Hawaiian cultural tradition in which island identity is expressed through native botany. The tradition is most visibly expressed in the Pāʻū parade, where women riders wear their island's color. The eight-island color system was formally codified in Hawaii state law in 2000."
  - question: "What is Niihau's color and why is it different from the others?"
    answer: "Niʻihau's official color is white, derived not from a flower but from the rare white pupu o Niʻihau shells found on the island's beaches. It is the only Hawaiian island whose color comes from a shell rather than a plant, reflecting Niʻihau's unique status as the Forbidden Island — privately owned and home to Hawaii's last native Hawaiian-speaking community."
  - question: "What is the Pāʻū parade?"
    answer: "The Pāʻū parade is a Hawaiian cultural tradition in which women riders on horseback wear long skirts (pāʻū) and floral adornments in their island's official color. Dating to at least 1906 in its organized form, the parade is the primary living expression of Hawaii's eight-island color system and is featured at the Kamehameha Day parade and the Aloha Festivals across the islands."

