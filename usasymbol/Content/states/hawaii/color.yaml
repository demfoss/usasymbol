    pantone: "PMS 196"
    island: "Maui"
    flower: "Lokelani Rose (Rosa damascena)"
    symbolism: "The soft pink of the Lokelani, the Maui Rose — a Damask rose brought to Hawaii from Asia in the early 1800s and designated Maui's official flower in 1923; the only non-native species selected as an island flower, the Lokelani's pink is the color most associated with Maui's lush upcountry landscape around Kula and Haleakalā"
  - name: "Kahoʻolawe Gray"
    hex: "#A8A9AD"
