title: Nene
scientific_name: Branta sandvicensis
adopted_year: 1957
legislation: Territorial designation (1957); Haw. Rev. Stat. 5-17
meaning: The nene exists naturally only in Hawaii, and when it was chosen in 1957 the species had already fallen to as few as 30 wild birds. The symbol carried both a claim of distinct Hawaiian identity and an acknowledgment that the bird might not survive.
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: '2026-03-28'
seo_title: 'Hawaii State Bird: Nene (Hawaiian Goose)'
seo_description: Hawaii adopted the Nene as its state bird in 1957 — before statehood, and when the wild population had fallen to as few as 30 birds. The nene exists naturally only in Hawaii.
intro_text: Hawaii's official state bird is the <strong>Nene</strong>, also called the Hawaiian goose, designated in <strong>1957</strong> while Hawaii was still a U.S. territory and now codified in <strong>Haw. Rev. Stat. 5-17</strong>. The nene is endemic to the Hawaiian islands — it exists naturally nowhere else in the world. By the time of the designation, the wild population had already fallen to as few as 30 birds, making the choice something closer to a survival declaration than a ceremonial honor.
