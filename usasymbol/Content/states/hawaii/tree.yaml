type: State Tree
state: Hawaii
name: Kukui
scientific_name: Aleurites moluccana
adopted_year: 1959
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Hawaii State Tree | Kukui"
seo_description: 'Hawaii chose kukui as its state tree in 1959, replacing the coconut palm with a canoe plant whose nuts once provided light and oil.'

intro_text: "The Hawaii state tree is the <strong>Kukui</strong> or candlenut tree (<em>Aleurites moluccana</em>), adopted in <strong>1959</strong>. Hawaii chose Kukui the same year it became the 50th state, replacing the coconut palm that had served as the territorial tree. The word kukui means 'light' in Hawaiian, and the tree's oily nuts were traditionally burned for illumination, while its seeds, leaves, and wood held practical and cultural value. For searches like 'Hawaii state tree' or 'state tree of Hawaii,' the answer is Kukui, a Polynesian-introduced canoe plant tied closely to [the Aloha State image](/states/hawaii/nickname/the-aloha-state)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Hawaii State Tree?"
    paragraphs:
      - "The Kukui tree is Hawaii's official state tree. This tropical broadleaf evergreen grows 20 to 50 feet tall, sometimes reaching 80 feet. The tree has a distinctive pale green appearance from a distance, looking almost white, and appears in broader comparisons within the [list of U.S. state trees](/symbols/trees)."
      - "Large heart-shaped leaves measure four to eight inches long. Leaves often have three to five lobes with toothed edges. Small creamy-white flowers bloom in dense clusters at branch ends."
      - "The tree produces walnut-sized fruits about two inches in diameter. Each fruit contains one or two large oily nuts."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Hawaii State Tree Name"
    paragraphs:
      - "The name is Kukui in Hawaiian. Other common names include Candlenut Tree, Candleberry, and Indian Walnut. The scientific name is Aleurites moluccana. The genus name refers to the aleurone layer in seeds."
      - "Kukui means 'light' or 'torch' in Hawaiian. This name comes from the nut's use as a light source. Early Hawaiians burned the oily nuts for illumination. The English name 'candlenut' refers to the same traditional use."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of the Hawaii State Tree"
    paragraphs:
      - "Hawaii designated the Kukui tree on May 1, 1959, through Joint Resolution No. 3. The 30th Territorial Legislature approved it. This occurred months before Hawaii became the 50th state in August 1959, as reflected in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "The kukui replaced the coconut palm as Hawaii's tree symbol. Governor Lawrence McCully Judd declared the coconut palm the territorial tree on March 17, 1930. It served until April 30, 1959."
      - "The legislature chose kukui for its numerous traditional uses and cultural importance. The tree provided ancient Hawaiians with light, oil, medicine, dye, and building materials, consistent with the stewardship themes in [Hawaii's state motto](/states/hawaii/motto/ua-mau-ke-ea-o-ka-aina-i-ka-pono)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Hawaii State Tree Facts"
    facts:
      - "Polynesians brought kukui to Hawaii as a 'canoe plant' around 300 AD, making it one of the earliest introduced species"
      - "Kukui means 'light' in Hawaiian, named for its use as an ancient illumination source"
      - "Ancient Hawaiians strung candlenuts on palm leaf ribs and burned them one at a time like candles"
      - "The tree replaced coconut palm as Hawaii's tree in 1959, the same year Hawaii became the 50th state"
      - "Kukui nuts contain oil that Hawaiians used to calm water surfaces while fishing"
      - "The tree is the physical form (kinolau) of the pig god Kamapua'a in Hawaiian mythology"

  - id: canoe-plant
    icon: "fa-solid fa-sailboat"
    title: "Kukui as a Polynesian Canoe Plant"
    paragraphs:
      - "The kukui is a 'canoe plant' brought by Polynesian voyagers. Early settlers carried essential plant species in their double-hulled canoes during Pacific voyages. Kukui was among the most important plants they transported to Hawaii."
      - "Archaeological evidence shows kukui cultivation in Southeast Asia dating to 13,000 BC. Polynesians spread the tree throughout Pacific islands. The species originated in Malaysia or Indonesia, not Hawaii."
      - "Voyagers selected kukui for its versatility. The tree provided numerous resources crucial for survival. Seeds were easy to transport and grew quickly. This made kukui ideal for establishing new settlements."

  - id: traditional-uses
    icon: "fa-solid fa-fire"
    title: "Traditional Hawaiian Uses"
    paragraphs:
      - "The oily nuts served as the primary light source before Western contact. Hawaiians strung candlenuts on palm leaf midribs. They burned the nuts one at a time, each providing light for several minutes. Stone lamps also burned kukui oil."
      - "Fishermen applied kukui oil to calm water surfaces. The oil spread across choppy water, creating a clear view beneath. This helped fishermen see their nets and catch fish. A Hawaiian proverb states 'Pupuhi kukui—malino ke kai' meaning 'spewed kukui nuts—calm seas.'"
      - "The nuts provided food when roasted and ground into paste called 'inamona. The oil treated sunburn and wounds. Tree bark made black dye for tapa cloth. The durable wood formed canoes and storage containers."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Hawaii State Tree and Flower"
    paragraphs:
      - "Hawaii's state flower is the yellow hibiscus (Hibiscus brackenridgei), also called ma'o hau hele. The legislature designated it in 1988. The yellow hibiscus is native to Hawaii but endangered in the wild; see [Hawaii's state flower page](/states/hawaii/flower/yellow-hibiscus). White kukui blossoms are Molokai island's official flower."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Kukui Tree"
    paragraphs:
      - "The silvery-pale green foliage stands out from other Hawaiian trees. Young leaves and branches have star-shaped hairs that create a whitish appearance. This distinctive coloring helps identify kukui forests from a distance."
      - "Large heart-shaped leaves have three to five lobes. The leaves measure four to eight inches long with toothed edges."
      - "Small creamy-white flowers appear in dense clusters at branch ends. The flowers bloom primarily in winter and spring. Walnut-sized fruits turn from green to brown when ripe."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The kukui symbolizes enlightenment, protection, and peace in Hawaiian culture. Its role as a light source connects it to guidance and illumination. The tree represents the resourcefulness of ancient Hawaiians who used every part of the plant. Kukui also honors Polynesian voyaging heritage and the plants that enabled settlement of remote Pacific islands alongside symbols such as [the Hawaii state flag](/states/hawaii/flag/hawaii-state-flag)."

faq:
  - question: "What is the Hawaii state tree?"
    answer: "The Kukui tree (Aleurites moluccana), also called the candlenut tree, is Hawaii's official state tree. The legislature designated it on May 1, 1959, through Joint Resolution No. 3."
  
  - question: "What is the Hawaii state tree called?"
    answer: "Hawaii's state tree is called Kukui in Hawaiian, or Candlenut Tree in English. Other names include candleberry and Indian walnut. The scientific name is Aleurites moluccana. Kukui means 'light' in Hawaiian, named for the nut's use as an illumination source."
  
  - question: "When was Hawaii's state tree adopted?"
    answer: "Hawaii adopted the Kukui tree on May 1, 1959, just months before Hawaii became the 50th U.S. state in August 1959. The kukui replaced the coconut palm, which had been the territorial tree since 1930."
  
  - question: "Why is the Kukui tree Hawaii's state tree?"
    answer: "The legislature chose kukui because of its numerous traditional uses and cultural importance. The tree provided ancient Hawaiians with light, oil, medicine, dye, and building materials. It is also a 'canoe plant' brought by Polynesian voyagers around 300 AD, connecting it to Hawaii's settlement history. No single tree had more diverse applications in traditional Hawaiian life."
  
  - question: "What is the Hawaii state tree name?"
    answer: "The name is Kukui in Hawaiian or Candlenut Tree in English. The scientific name is Aleurites moluccana. Kukui means 'light' or 'torch' reflecting the nut's use as a light source."
  
  - question: "What is a canoe plant?"
    answer: "A canoe plant is a species that Polynesian voyagers brought in their double-hulled canoes during migrations across the Pacific. Kukui was among these essential plants. Polynesians transported kukui seeds to Hawaii around 300 AD or earlier. These plants provided resources crucial for survival in new settlements."
  
  - question: "How did ancient Hawaiians use kukui nuts for light?"
    answer: "Ancient Hawaiians strung candlenuts on palm leaf midribs and burned them one at a time. Each nut provided light for several minutes. They also burned kukui oil in stone lamps for illumination. The name kukui means 'light' in Hawaiian, reflecting this primary use."
  
  - question: "What are some facts about the Hawaii state tree?"
    answer: "Polynesians brought kukui to Hawaii as a canoe plant around 300 AD. Kukui means 'light' named for its use as illumination. Ancient Hawaiians burned the nuts like candles. The tree replaced coconut palm in 1959, Hawaii's statehood year. Kukui oil calmed water surfaces for fishing. The nuts make traditional inamona condiment for poke. The tree represents pig god Kamapua'a in Hawaiian mythology. White kukui blossoms are Molokai's island flower."

