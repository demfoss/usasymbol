seo:
  title: "Common Last Names in Hawaii — No English in Top Three"
  description: "Lee. Kim. Nakamura. Hawaii's top three most common last names are all non-English — shaped by Japanese plantation contracts and Korean arrivals."

page:
  h1: "Most Common Last Names in Hawaii"
  intro: "Lee, Kim, and Nakamura are Hawaii's three most common surnames — the only state where no English name reaches the top three. Japanese contract workers arrived beginning in 1885, Korean plantation hands after 1903, and Chinese merchants from the 1850s; Smith sits fourth, planted mainly by American missionaries and military families."
  heritage_title: "Plantation Immigration & Pacific Heritage"
  heritage_body: "Hawaii's sugar plantations drove contract labor from Japan (beginning 1885), Portugal (1878), and the Philippines (after 1906). Japanese Americans became Hawaii's largest ethnic group, making Japanese surnames among the state's most frequent. Portuguese families from the Azores and Madeira settled primarily on Maui and the Big Island, giving Hawaii one of the nation's highest concentrations of surnames like Silva and Freitas."
  fun_fact: "Duke Kahanamoku, the Native Hawaiian Olympic swimmer who popularized surfing worldwide, made Kahanamoku one of the most internationally recognized Hawaiian surnames of the twentieth century."

surnames:
  - rank: 1
    name: Lee
    count: 7900
    ratio: 172
    origin: korean
    type: Patronymic
    meaning: "Lee (리/李) derives from the Chinese character for plum tree and is shared by Korean, Chinese, and English families. In Hawaii, its prominence reflects Honolulu's historic Chinatown and the Korean community that arrived as plantation workers after 1903."

  - rank: 2
    name: Kim
    count: 7200
    ratio: 189
    origin: korean
    type: Patronymic
    meaning: "Kim (김/金) means gold in Korean and is the most common surname in Korea. Korean immigration to Hawaii began with plantation workers in 1903, and Honolulu's Korean community has sustained the name's visibility for over a century."

  - rank: 3
    name: Nakamura
    count: 6600
    ratio: 206
    origin: japanese
    type: Habitational
    meaning: "Nakamura means 'middle village' in Japanese, from naka (middle) and mura (village). It arrived in Hawaii with kanyaku imin government-contract workers beginning in 1885, settling across Oahu and Maui plantations."

  - rank: 4
    name: Smith
    count: 6200
    ratio: 219
    origin: english
    type: Occupational
    meaning: "Smith derives from the Old English smið, referring to a metalworker or craftsman. Its presence in Hawaii grew steadily with American missionaries, merchants, and military families from the nineteenth century onward."

  - rank: 5
    name: Wong
    count: 5900
    ratio: 230
    origin: chinese
    type: Habitational
    meaning: "Wong (王/黃) is one of the most common Chinese surnames, meaning king or yellow depending on the character. Chinese workers arrived in Hawaii's plantations as early as the 1850s, and Honolulu's Chinatown became the center of Chinese-Hawaiian family life."

  - rank: 6
    name: Johnson
    count: 5500
    ratio: 247
    origin: english
    type: Patronymic
    meaning: "Johnson means 'son of John' and ranks among the most common English-origin surnames in the United States. Military expansion after Pearl Harbor brought large numbers of Johnson families to Oahu, many of whom remained permanently."

  - rank: 7
    name: Yamamoto
    count: 5100
    ratio: 267
    origin: japanese
    type: Habitational
    meaning: "Yamamoto means 'base of the mountain' in Japanese (yama = mountain, moto = base). It became established in Hawaii through Issei plantation workers from Hiroshima and Kumamoto prefectures who arrived in the late nineteenth century."

  - rank: 8
    name: Park
    count: 4800
    ratio: 283
    origin: korean
    type: Habitational
    meaning: "Park (박/朴) is one of three dominant surnames in Korea and is derived from a word meaning gourd or plain. Early Korean plantation workers who settled in Honolulu after 1903 established the name's lasting presence on Oahu."

  - rank: 9
    name: Williams
    count: 4600
    ratio: 296
    origin: welsh
    type: Patronymic
    meaning: "Williams means 'son of William' and entered Hawaii with American Protestant missionaries from New England in the early nineteenth century. The name spread further through military and federal government workers stationed on Oahu."

  - rank: 10
    name: Tanaka
    count: 4300
    ratio: 316
    origin: japanese
    type: Habitational
    meaning: "Tanaka means 'middle of the rice field' in Japanese (ta = rice field, naka = middle). It is especially common on Maui and the Big Island, where Japanese plantation families worked the sugar and pineapple fields through the early twentieth century."

  - rank: 11
    name: Silva
    count: 4100
    ratio: 332
    origin: portuguese
    type: Habitational
    meaning: "Silva comes from the Latin silva, meaning forest or woodland. Portuguese families from the Azores brought Silva to Hawaii beginning in 1878, and it remains concentrated on Maui and the Big Island where their descendants settled."

  - rank: 12
    name: Santos
    count: 3900
    ratio: 349
    origin: portuguese
    type: Descriptive
    meaning: "Santos means 'saints' in Portuguese and Spanish, often given to families associated with All Saints' Day. In Hawaii, both Azorean plantation families and Filipino immigrants who arrived after 1906 carry this surname."

  - rank: 13
    name: Jones
    count: 3700
    ratio: 368
    origin: welsh
    type: Patronymic
    meaning: "Jones means 'son of John' in Welsh and is the most common Welsh surname. It entered Hawaii with American missionaries and settlers in the nineteenth century and grew through military and civilian employment on Oahu."

  - rank: 14
    name: Chong
    count: 3500
    ratio: 389
    origin: chinese
    type: Patronymic
    meaning: "Chong (鍾/鄭) is shared by Chinese and Korean clan lineages. Honolulu's Chinatown, established by the 1860s, was the anchor of early Chinese-Hawaiian community life where surnames like Chong became well represented."

  - rank: 15
    name: Brown
    count: 3400
    ratio: 400
    origin: english
    type: Descriptive
    meaning: "Brown derives from the Old English brún, originally describing someone with brown hair or complexion. Its presence in Hawaii reflects both early American commercial settlers and the military community that grew on Oahu after the 1890s."

  - rank: 16
    name: Suzuki
    count: 3200
    ratio: 425
    origin: japanese
    type: Occupational
    meaning: "Suzuki relates to the Japanese word for pampas grass and is one of Japan's most common surnames. Okinawan and mainland Japanese communities on Oahu and Maui contributed significantly to this surname's local presence."

  - rank: 17
    name: Freitas
    count: 3100
    ratio: 439
    origin: portuguese
    type: Habitational
    meaning: "Freitas refers to lands once associated with a convent or religious house in medieval Portugal. Portuguese families from Madeira and the Azores brought Freitas to Hawaii's Big Island and Maui during plantation recruitment in the 1870s and 1880s."

  - rank: 18
    name: Reyes
    count: 2900
    ratio: 469
    origin: spanish
    type: Descriptive
    meaning: "Reyes means 'kings' in Spanish and is common across the Philippines, a legacy of Spanish colonial naming. Filipino sakadas (contract workers) who arrived in Hawaii after 1906 carried Reyes from the Ilocos region of Luzon."

  - rank: 19
    name: Rodrigues
    count: 2800
    ratio: 486
    origin: portuguese
    type: Patronymic
    meaning: "Rodrigues means 'son of Rodrigo' in Portuguese, distinguishing the Hawaiian form from the Spanish Rodriguez spelling. Like Silva and Freitas, it arrived with Azorean plantation workers in the late nineteenth century and is concentrated on Maui."

  - rank: 20
    name: Davis
    count: 2700
    ratio: 504
    origin: welsh
    type: Patronymic
    meaning: "Davis means 'son of David' and is of Welsh origin. It spread in Hawaii through American missionaries and merchants in the nineteenth century and grew further with the military presence on Oahu following the 1898 annexation."

unique_surnames:
  - name: Kahananui
    state_rank: 450
    national_rank: 15000 # UNVERIFIED
    origin: hawaiian
    why: "Kahananui is a traditional Hawaiian surname meaning 'the great work' (ka = the, hana = work, nui = great). It is rare outside Hawaii and is concentrated among Native Hawaiian families on Oahu and the island of Hawaii."

  - name: Kealoha
    state_rank: 380
    national_rank: 14000 # UNVERIFIED
    origin: hawaiian
    why: "Kealoha means 'the beloved' in Hawaiian (ke = the, aloha = love). Nearly exclusive to Hawaii, it remains one of the most recognizable indigenous Hawaiian surnames among Native Hawaiian families statewide."

  - name: Nakasone
    state_rank: 600
    national_rank: 18000 # UNVERIFIED
    origin: japanese
    why: "Nakasone is an Okinawan surname referring to a place name, and Hawaii has one of the largest Okinawan-American communities in the United States. Families bearing this name are concentrated in Honolulu and on Oahu."

  - name: Freitas
    state_rank: 17
    national_rank: 1800 # UNVERIFIED
    origin: portuguese
    why: "Freitas is disproportionately concentrated in Hawaii relative to its national presence, a direct result of Azorean and Madeiran workers recruited for sugar plantations on Maui and the Big Island beginning in 1878. Portuguese families with this surname formed close communities that persisted well beyond the plantation era."

etymology_groups:
  - type: "Japanese Surnames"
    icon: fa-solid fa-torii-gate
    description: "Japanese immigration to Hawaii began with government-contract workers in 1885 and continued through the early twentieth century. Japanese Americans became Hawaii's largest ethnic group, making surnames like Nakamura, Yamamoto, and Tanaka among the state's most frequent. Many families trace their roots to Hiroshima, Kumamoto, and Okinawa prefectures."
    examples:
      - Nakamura (middle village)
      - Yamamoto (base of the mountain)
      - Tanaka (middle of the rice field)
      - Suzuki (pampas grass)

  - type: "Native Hawaiian Surnames"
    icon: fa-solid fa-water
    description: "Traditional Hawaiian surnames are multi-syllable compound words from the Hawaiian language, referencing nature, lineage, or spiritual concepts. They remain concentrated almost exclusively in Hawaii and among the Native Hawaiian diaspora."
    examples:
      - Kahananui (the great work)
      - Kealoha (the beloved)
      - Kahanamoku (the canoe house)

  - type: "Portuguese Plantation Surnames"
    icon: fa-solid fa-wheat-awn
    description: "Portuguese workers from the Azores and Madeira arrived in Hawaii beginning in 1878, recruited as skilled plantation laborers. Their descendants settled primarily on Maui and the Big Island, giving Hawaii one of the highest Portuguese-American surname densities in the nation."
    examples:
      - Silva (forest)
      - Freitas (convent lands)
      - Rodrigues (son of Rodrigo)
      - Santos (saints)

  - type: "East Asian Surnames"
    icon: fa-solid fa-bowl-rice
    description: "Chinese workers arrived in Hawaii's plantations as early as the 1850s, while Korean immigration began in 1903. Surnames like Lee, Wong, Kim, Park, and Chong reflect these communities, with Honolulu's Chinatown serving as the historic anchor of Chinese-Hawaiian family life."
    examples:
      - Lee (plum tree)
      - Wong (king or yellow)
      - Kim (gold)
      - Park (gourd)
      - Chong (clan surname)

  - type: "Filipino Surnames"
    icon: fa-solid fa-anchor
    description: "Filipino sakadas began arriving in Hawaii after 1906, recruited primarily from the Ilocos region of Luzon. Under Spanish colonial rule, Filipino families were assigned Spanish surnames, which is why Reyes, Santos, and Cruz appear prominently among common surnames in Hawaii."
    examples:
      - Santos (saints)
      - Reyes (kings)
      - Cruz (cross)

faq:
  - question: "What are the most common last names in Hawaii?"
    answer: "The most common last names in Hawaii include Lee, Wong, Kim, Smith, and other East Asian surnames such as Nakamura and Yamamoto. Hawaii stands apart from most states because Asian surnames dominate the top of the statewide list."

  - question: "Why are there so many Japanese surnames in Hawaii?"
    answer: "Japanese immigration to Hawaii began in 1885 with government-contract laborers recruited for the sugar plantations. By the mid-twentieth century, Japanese Americans were Hawaii's largest ethnic group, which is why surnames like Nakamura, Yamamoto, and Tanaka rank among the most popular last names in Hawaii today."

  - question: "What are some traditional Native Hawaiian surnames?"
    answer: "Traditional Native Hawaiian surnames include names such as Kealoha, Kahananui, and Kahanamoku. These names are strongly associated with Hawaii because they come directly from the Hawaiian language rather than from later immigrant communities."

