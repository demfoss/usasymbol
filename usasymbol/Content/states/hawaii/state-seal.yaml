type: State Seal
state: Hawaii
name: Great Seal of Hawaii
adopted_year: 1959
revised_year: 1959
is_official: true
legislation: Hawaii Revised Statutes § 5-8
meaning: "The Great Seal of Hawaii connects the 50th state to two distinct histories: the Kingdom of Hawaii and the American Union. The seal adapts the royal coat of arms of the Kingdom of Hawaii and surrounds it with the phoenix, the rising sun, taro leaves, and banana foliage while adding the year 1959 and fifty stars to mark Hawaii's admission as the final state. The central motto, spoken by King Kamehameha III in 1843 when Hawaiian sovereignty was restored, ties the seal directly to the Hawaiian language and the islands' political memory."
author: USA Symbol Team
date_published: '2026-04-29'
date_modified: '2026-04-29'
seo_title: 'Hawaii State Seal | Kamehameha & What It Means'
seo_description: "Hawaii's seal combines the Kingdom of Hawaii's royal coat of arms with King Kamehameha I, a rising phoenix, and a motto from 1843."
hero_image: /images/seals/hawaii/seal.webp
hero_image_alt: Great Seal of the State of Hawaii, official emblem adopted in 1959
hero_image_caption: The Great Seal of Hawaii, adopted when Hawaii became the 50th state on August 21, 1959. The coat of arms at the center descends from the royal arms of the Kingdom of Hawaii established in the 1840s.
intro_text: "Hawaii's state seal is the only American state seal built around the coat of arms of a sovereign monarchy — the Kingdom of Hawaii — placing King Kamehameha I, who unified the islands, alongside the Goddess of Liberty and the year 1959, when Hawaii became the 50th state."
