sections:
- id: history
  icon: fa-solid fa-landmark
  title: Hawaii State Seal History and Origin
  paragraphs:
  - 'When Congress admitted Hawaii as the 50th state on August 21, 1959, the new state needed an official seal. Rather than start from scratch, the designers built the seal around the royal coat of arms of the Kingdom of Hawaii, which had been in use since the 1840s under the reign of King Kamehameha III. This decision was deliberate: it connected the American state of Hawaii to the independent kingdom that had preceded it.'
  - 'The Kingdom of Hawaii had maintained formal diplomatic relations with the United States and European powers for decades before the monarchy was overthrown in 1893. By centering the state seal on the royal arms, Hawaii acknowledged that history rather than erasing it. The phoenix, the fifty stars, and the year 1959 were added to mark the new political reality while the older imagery carried the deeper roots.'
  - 'Hawaii became a U.S. territory in 1900 and had used a territorial seal before statehood. The 1959 state seal replaced the territorial version, adding the fifty stars and updating the border text from "Territory of Hawaii" to "State of Hawaii 1959." The coat of arms and the motto remained as they had appeared in the territorial period.'

- id: elements
  icon: fa-solid fa-shapes
  title: What the Hawaii State Seal Symbols Mean
  paragraphs:
  - 'Hawaii''s seal is unusual among American state seals because it holds two overlapping identities: a sovereign kingdom and an American state. The royal coat of arms carries the Hawaiian monarchical tradition; the phoenix, the fifty stars, and the American-style format carry the statehood tradition. The designers chose to keep both in tension rather than resolve them in favor of one or the other.'
  - The motto is perhaps the clearest statement of this layering. *Ua Mau ke Ea o ka Aina i ka Pono* was spoken in the Hawaiian language by a Hawaiian king at a moment of restored sovereignty after foreign occupation. Placing it on the seal of an American state preserves the meaning of that moment and acknowledges that Hawaii's political identity did not begin with American annexation.
  - The Great Seal of Hawaii draws from Hawaiian royal tradition, American state symbolism, and the natural landscape of the islands. Each element was chosen to represent a specific dimension of Hawaiian identity.
  elements:
  - id: coat-of-arms
    name: Royal Coat of Arms of Hawaii
    image: /images/state-seals/hawaii/elements/coat-of-arms.webp
    paragraphs:
    - 'The shield at the center of the seal descends from the royal arms of the Kingdom of Hawaii, which were established in the 1840s under King Kamehameha III. The quartered shield incorporates eight alternating stripes in the upper portion, echoing the Hawaiian flag, and a rising sun in the lower portion. The shield connects the American state directly to the sovereign monarchy that preceded it.'
    - "The choice to preserve the royal arms rather than create an entirely new design for statehood was significant. Most territories designed new state-specific imagery at admission. Hawaii's decision to retain the monarchical coat of arms placed the kingdom's visual heritage at the literal center of the state's official identity."
  - id: phoenix
    name: Rising Phoenix
    image: /images/state-seals/hawaii/elements/phoenix.webp
    paragraphs:
    - "A phoenix rising from flames appears above the shield at the top of the seal. The phoenix is a classical symbol of rebirth and transformation, a creature that burns and rises renewed. On Hawaii's seal it carries two meanings: the volcanic origin of the islands themselves, which rose from the ocean through fire, and the political transformation of Hawaii from kingdom to territory to state."
    - 'Hawaii is one of very few states to place a phoenix on its official seal. The image is appropriate to a place where active volcanism is a present geological reality rather than ancient history. Kilauea on the Big Island has been continuously erupting for decades.'
  - id: kamehameha
    name: King Kamehameha I
    image: /images/state-seals/hawaii/elements/kamehameha.webp
    paragraphs:
    - 'King Kamehameha I stands to the right of the central shield, depicted in traditional royal regalia. Kamehameha I unified the Hawaiian Islands between 1795 and 1810, bringing all the major islands under a single rule for the first time and establishing the Kingdom of Hawaii that would persist until 1893. His presence on the seal is a direct acknowledgment that the political entity Hawaii inherits was built by him.'
    - 'The king is shown holding a spear, consistent with historical depictions of Kamehameha as both a warrior and a statesman. He is one of a small number of historical individuals depicted on an American state seal by name and image rather than as an anonymous allegorical figure.'
  - id: goddess-of-liberty
    name: Goddess of Liberty
    image: /images/state-seals/hawaii/elements/goddess-of-liberty.webp
    paragraphs:
    - 'The Goddess of Liberty stands to the left of the shield, holding the Hawaiian state flag. She is a classical allegorical figure representing freedom and democratic governance, drawn from the same tradition as similar figures on American coins, monuments, and official seals.'
    - "Placing the Goddess of Liberty opposite King Kamehameha I creates a visual dialogue between American republican values and Hawaiian monarchical history. Neither figure dominates; both flank the coat of arms equally, suggesting that both traditions have a claim on Hawaii's official identity."
  - id: rising-sun
    name: Rising Sun with Eight Rays
    image: /images/state-seals/hawaii/elements/rising-sun.webp
    paragraphs:
    - "The sun rises with eight rays of light, one ray for each of the eight main islands of Hawaii: Hawaii (the Big Island), Maui, Oahu, Kauai, Molokai, Lanai, Niihau, and Kahoolawe. The number eight connects the seal's solar imagery directly to the geography of the archipelago."
    - "Hawaii's position in the Pacific means the sun rises over its islands before it rises over any other U.S. state. The rising sun is not merely decorative; it reflects a real geographic distinction that sets Hawaii apart from the continental states."
  - id: motto
    name: Ua Mau ke Ea o ka Aina i ka Pono
    image: /images/state-seals/hawaii/elements/motto.webp
    paragraphs:
    - '*Ua Mau ke Ea o ka Aina i ka Pono* translates from Hawaiian as "The life of the land is perpetuated in righteousness." King Kamehameha III spoke these words on July 31, 1843, at a ceremony in Honolulu marking the restoration of Hawaiian sovereignty after a five-month occupation by British naval officer Lord George Paulet, who had seized the islands without authorization from the British government.'
    - 'The words became the official motto of the Kingdom of Hawaii and have remained the motto through the territorial and state periods. It is one of the only American state mottoes in a language other than English or Latin, and the only one drawn directly from a speech by a Hawaiian monarch.'
  - id: taro-banana
    name: Taro Leaves and Banana Foliage
    image: /images/state-seals/hawaii/elements/taro-banana.webp
    paragraphs:
    - 'Taro leaves and banana foliage frame the lower portion of the seal. Taro (*kalo* in Hawaiian) is the most culturally important plant in traditional Hawaiian life: it is the primary food crop of ancient Hawaii, and in Hawaiian creation traditions, the taro plant is considered an elder sibling of the Hawaiian people, descended from the same source.'
    - 'Banana plants are similarly tied to Hawaiian agricultural and cultural history. Together, the two plants anchor the seal to the specific ecology of the islands and to the Indigenous Hawaiian relationship with the land that the motto also expresses.'
  - id: fifty-stars
    name: Fifty Stars
    image: /images/state-seals/hawaii/elements/fifty-stars.webp
    paragraphs:
    - 'Fifty stars appear around the border of the seal, one for each state in the Union. Hawaii was admitted as the 50th and final state on August 21, 1959, and the fifty stars on the seal record that count. The same number appears on the U.S. flag, where the last star added was the one representing Hawaii.'
    - 'The fifty stars on the Hawaiian seal have a particular weight: they are both the complete count and the final addition. No state has been admitted since Hawaii, and no star has been added to the U.S. flag since the Hawaiian star was added on July 4, 1960.'

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Hawaii State Seal'
  paragraphs:
  - "The imagery at the center of Hawaii's state seal has a longer history than statehood itself. The royal coat of arms of the Kingdom of Hawaii was established in the 1840s and used on official documents, currency, and diplomatic correspondence throughout the kingdom period. The territorial seal adopted in 1900 preserved the coat of arms and the motto while updating the border text."
  versions:
  - name: Royal Coat of Arms (1840s–1893)
    years: 1840s–1893
    image: /images/state-seals/hawaii/versions/royal-arms.svg
    description: The coat of arms of the Kingdom of Hawaii, established under King Kamehameha III in the 1840s. Used on official documents of the Hawaiian monarchy until the overthrow of Queen Liliuokalani in January 1893.
  - name: Territorial Seal (1900–1959)
    years: 1900–1959
    image: /images/state-seals/hawaii/versions/territorial-seal.svg
    description: When Hawaii became a U.S. territory in 1900, a territorial seal was adopted that retained the coat of arms and the Hawaiian motto. The border text read "Territory of Hawaii."
  - name: State Seal (1959–present)
    years: 1959–present
    image: /images/state-seals/hawaii/versions/1959-state-seal.svg
    description: Adopted at statehood on August 21, 1959. The coat of arms, motto, and central figures were carried over from the territorial seal. Fifty stars were added around the border and the year 1959 was added at the bottom. The border text was updated to "State of Hawaii."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Hawaii State Seal Facts
  facts:
  - "Adopted: 1959, at Hawaii's admission as the 50th state on August 21, 1959"
  - 'Central emblem: Royal coat of arms of the Kingdom of Hawaii (established 1840s)'
  - 'Motto: Ua Mau ke Ea o ka Aina i ka Pono — "The life of the land is perpetuated in righteousness"'
  - 'Motto spoken by: King Kamehameha III, July 31, 1843, upon restoration of Hawaiian sovereignty'
  - 'Phoenix at top: symbol of volcanic origin and political transformation'
  - 'King Kamehameha I (right): unified the Hawaiian Islands between 1795 and 1810'
  - 'Goddess of Liberty (left): holds the Hawaiian state flag'
  - 'Eight rays of the sun: one for each of the eight main Hawaiian islands'
  - 'Stars: 50, for all 50 U.S. states; Hawaii was the last admitted'
  - 'Taro leaves: the most culturally important plant in traditional Hawaiian life'

timeline:
- year: '1840s'
  description: King Kamehameha III establishes the royal coat of arms of the Kingdom of Hawaii, which becomes the basis for the state seal more than a century later.
- year: '1843'
  description: King Kamehameha III speaks the words "Ua Mau ke Ea o ka Aina i ka Pono" on July 31 at a ceremony restoring Hawaiian sovereignty after a five-month British occupation. The phrase becomes Hawaii's permanent motto.
- year: '1893'
  description: The Kingdom of Hawaii is overthrown in January. Queen Liliuokalani is deposed. The royal coat of arms is preserved in subsequent territorial and state seals.
- year: '1900'
  description: Hawaii becomes a U.S. territory. A territorial seal is adopted that retains the royal coat of arms and the Hawaiian motto.
- year: '1959'
  description: Congress admits Hawaii as the 50th state on August 21. The state seal is adopted, adding fifty stars and the year 1959 to the existing territorial design.
- year: '1960'
  description: On July 4, the U.S. flag is updated to fifty stars, with the final star representing Hawaii.

faq:
- question: What does Hawaii's state seal show?
  answer: Hawaii's state seal shows the royal coat of arms of the Kingdom of Hawaii at the center, flanked by King Kamehameha I on the right and the Goddess of Liberty holding the Hawaiian flag on the left. A phoenix rises above the shield. Eight rays of the rising sun represent the eight main islands. Taro leaves and banana foliage frame the base. Fifty stars circle the border, and the state motto in Hawaiian appears at the bottom.
- question: What does the motto on Hawaii's state seal mean?
  answer: The motto "Ua Mau ke Ea o ka Aina i ka Pono" means "The life of the land is perpetuated in righteousness" in Hawaiian. King Kamehameha III spoke these words on July 31, 1843, at a ceremony in Honolulu marking the restoration of Hawaiian sovereignty after a five-month occupation by a British naval officer who had seized the islands without authorization from the British government.
- question: Why is King Kamehameha on Hawaii's state seal?
  answer: King Kamehameha I unified the Hawaiian Islands between 1795 and 1810, bringing all the major islands under a single rule for the first time and founding the Kingdom of Hawaii. He is depicted on the seal to acknowledge that Hawaii's political identity was built by a Hawaiian monarch, not by American colonization.
- question: Why does Hawaii's seal have a phoenix?
  answer: The phoenix, which rises from flames, represents both the volcanic origin of the Hawaiian Islands and the political transformation of Hawaii from kingdom to territory to state. Hawaii is one of the geologically youngest and most volcanically active places in the United States; the phoenix is an apt symbol for islands that literally rose from fire.
- question: Why does Hawaii's state seal use the royal coat of arms?
  answer: When Hawaii became a state in 1959, designers chose to build the seal around the royal coat of arms of the Kingdom of Hawaii that had been in use since the 1840s. This decision connected the American state to the sovereign monarchy that preceded it, acknowledging Hawaiian history rather than replacing it with entirely new American imagery.
- question: What do the eight rays on Hawaii's seal represent?
  answer: The eight rays of the rising sun represent the eight main islands of Hawaii — Hawaii (the Big Island), Maui, Oahu, Kauai, Molokai, Lanai, Niihau, and Kahoolawe. The number eight also appears in the eight stripes of the Hawaiian flag, which similarly represents the eight main islands.
- question: When was Hawaii's state seal adopted?
  answer: Hawaii's state seal was adopted in 1959 when Hawaii became the 50th state on August 21, 1959. The central imagery — the royal coat of arms and the Hawaiian motto — had been in continuous use since the Kingdom of Hawaii era in the 1840s, preserved through the territorial period that began in 1900.

