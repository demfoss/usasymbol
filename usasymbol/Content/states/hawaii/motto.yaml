seo_title: "Hawaii State Motto | Ua Mau ke Ea o ka ʻĀina i ka Pono"
seo_description: "Hawaii's state motto is \"Ua Mau ke Ea o ka ʻĀina i ka Pono,\" Hawaiian for \"The Life of the Land Is Perpetuated in Righteousness.\" Kamehameha III, 1843."

intro_text: "Hawaii's state motto is <strong>Ua Mau ke Ea o ka ʻĀina i ka Pono</strong>, a Hawaiian phrase meaning <em>The Life of the Land Is Perpetuated in Righteousness</em>. King Kamehameha III spoke these words on July 31, 1843, at a ceremony restoring Hawaiian sovereignty after a five-month British occupation — making it one of the few American state mottoes drawn from a documented royal speech."

