title: "Ua Mau ke Ea o ka ʻĀina i ka Pono"
language: "Hawaiian"
english_translation: "The life of the land is perpetuated in righteousness"
adopted_year: 1959

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-01-01"
seo_title: "Hawaii State Motto | Ua Mau ke Ea o ka ʻĀina i ka Pono! The life of the land is perpetuated in righteousness!"
seo_description: "Find the legal and historical context for Ua Mau ke Ea o ka ʻĀina i ka Pono in Hawaii, along with the places where the motto remains visible in Hawaii."
intro_text: "Hawaii's official motto, <strong>Ua Mau ke Ea o ka ʻĀina i ka Pono</strong>, dates to 1843. The Hawaiian phrase translates to <em>The life of the land is perpetuated in righteousness</em>. King Kamehameha III spoke these words on July 31, 1843, in a moment also central to broader [state-flag history comparisons](/symbols/flags)."

sections:
  - id: "what-is"
    icon: "fa-solid fa-circle-info"
    title: "Hawaii State Motto Overview"
    paragraphs:
      - "'Ua Mau ke Ea o ka ʻĀina i ka Pono' identifies Hawaii at the state level. A state motto is an official phrase representing important values or historical moments. Hawaii adopted this Hawaiian language phrase when it became a state in 1959, and related entries appear in the [list of U.S. state mottos](/symbols/mottos)."
      - "The motto appears on Hawaii's state seal and flag. You see it on government documents, driver's licenses, and state buildings throughout Hawaii. The phrase wraps around the bottom portion of the circular state seal and complements [Hawaii's official flag tradition](/states/hawaii/flag/hawaii-state-flag)."
      - "Hawaii Revised Statutes Section 5-9 establishes the motto legally. The law specifies both the Hawaiian text and the official English translation. Hawaii is the only state with a motto in an indigenous Pacific language."

  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning Behind Hawaii's Motto"
    paragraphs:
      - "The official English translation is <strong>The life of the land is perpetuated in righteousness</strong>. Each Hawaiian word carries specific meaning: 'ua mau' means has been perpetuated, 'ke ea' means the life or sovereignty, 'o ka ʻāina' means of the land, and 'i ka pono' means in righteousness."
      - "Translation debates continue today. An alternative reading translates it as 'The sovereignty of the land is perpetuated in righteousness.' The word 'ea' has multiple meanings in Hawaiian including life, breath, and sovereignty. Hawaiian activists argue that sovereignty was the intended meaning when Kamehameha III spoke the words in 1843."
      - "The broader meaning connects to Hawaiian culture and history. 'ʻĀina' means more than physical land in Hawaiian thought - it describes the reciprocal relationship between people and land. 'Pono' extends beyond a narrow idea of righteousness to include fairness, balance, harmony, and correctness. Kamehameha III used these words to celebrate restored independence after British occupation, values echoed in [Hawaii's state tree symbolism](/states/hawaii/tree/kukui)."

  - id: "language"
    icon: "fa-solid fa-scroll"
    title: "Language and Translation"
    paragraphs:
      - "The motto uses Hawaiian, the indigenous language of the Hawaiian Islands. Hawaiian became an official state language alongside English in 1978. The phrase uses traditional Hawaiian grammar and vocabulary from the Kingdom era."
      - "Hawaii Revised Statutes provides the official translation as 'The life of the land is perpetuated in righteousness.' A plaque at Thomas Square in Honolulu offers different wording: 'The sovereignty of the kingdom continues because we are righteous.' The pronunciation is roughly <em>oo-ah mow keh eh-ah oh kah ah-EE-nah ee kah POH-noh</em> with a glottal stop before the 'Ā' in 'ʻĀina.'"

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "History of the Hawaii State Motto"
    paragraphs:
      - "The phrase originated during a sovereignty crisis in 1843. Richard Charlton, who served as British consul since 1825, claimed land on Oahu in 1840. Kamehameha III rejected the claim because Charlton lacked proper documentation under new land laws. Charlton left Hawaii for England and met Captain Lord George Paulet off the Mexico coast in late 1842."
      - "Paulet arrived in Honolulu harbor aboard HMS Carysfort on February 10, 1843. He issued an ultimatum on February 17 with six demands and threatened to bombard Honolulu. Kamehameha III surrendered under the frigate's guns and signed a provisional cession on February 25, 1843. The British flag replaced the Hawaiian flag and occupation began."
      - "Hawaiian envoys Timoteo Haʻalilio and William Richards had traveled to England to present Hawaii's case. Lord Aberdeen assured them on April 1, 1843, that Queen Victoria recognized Hawaiian independence. Rear Admiral Richard Darton Thomas arrived from Chile on July 26, 1843, aboard HMS Dublin. He reviewed Paulet's actions and determined that Charlton's complaints did not warrant takeover."
      - "Admiral Thomas held a public ceremony at Honolulu Fort on July 31, 1843. The British Union Jack was lowered and the Hawaiian flag raised again with a 21-gun salute. Later that day at Kawaiahao Church, Kamehameha III proclaimed 'Ua Mau ke Ea o ka ʻĀina i ka Pono' before a large crowd. The words became the kingdom's motto immediately. The phrase first appeared on the Kingdom of Hawaii coat of arms in May 1845."

  - id: "cultural-context"
    icon: "fa-solid fa-book-open"
    title: "Kamehameha III's 1843 Declaration"
    paragraphs:
      - "The Hawaiian Kingdom faced threats from multiple powers during the 1840s. Britain, France, and the United States all eyed Pacific control. Lord Paulet's seizure showed Hawaii's vulnerability to foreign interference. Diplomatic recognition became crucial for the kingdom's survival. The Anglo-French Proclamation of November 28, 1843, formally recognized Hawaiian independence."
      - "Hawaiian concepts shaped how people understood the motto. 'ʻĀina' translates literally as 'that which feeds' - land feeds people and people care for land. This reciprocal relationship defines Hawaiian culture. 'Pono' encompasses balance, harmony, and correctness in all actions. Kamehameha III's use of 'pono' in 1843 invoked moral justification for independence - Hawaii governed itself rightly, therefore sovereignty continued across the islands identified in [states and capital cities context](/rankings/geography/states-capital-cities)."
      - "Thomas Square in downtown Honolulu marks where the ceremony occurred on July 31, 1843. The park was named after Admiral Richard Thomas to honor his role. A bronze statue of Kamehameha III was installed on July 31, 2018, marking the 175th anniversary. July 31 was celebrated as a national holiday called Lā Hoʻihoʻi Ea (Sovereignty Restoration Day) during the Kingdom era. Modern commemorations resumed in the late 20th century."

  - id: "adoption"
    icon: "fa-solid fa-calendar-check"
    title: "When Did Hawaii Adopt Its Motto?"
    paragraphs:
      - "Kamehameha III first spoke the words on July 31, 1843, at Kawaiahao Church during thanksgiving services. The phrase became the Kingdom of Hawaii's motto immediately and appeared on the official coat of arms starting in May 1845."
      - "The Territorial Legislature adopted it as the state motto on May 1, 1959, before Hawaii became a state. Joint Resolution No. 4 of the 30th Territorial Legislature passed that day. Hawaii became the 50th state on August 21, 1959. Hawaii Revised Statutes Section 5-9 codifies the motto with both Hawaiian text and English translation."

  - id: "usage"
    icon: "fa-solid fa-location-dot"
    title: "Where Hawaii's Motto Appears Today"
    paragraphs:
      - "Hawaii's state seal displays the motto prominently around the bottom edge of the circular design. The seal shows King Kamehameha I on the left and the Goddess of Liberty holding the Hawaiian flag on the right. A phoenix rising above them represents the rebirth of the Hawaiian nation."
      - "The state flag incorporates the seal in some official uses. Driver's licenses and state ID cards show the seal with the Hawaiian motto. Government buildings display it at entrances and chambers. The Hawaii state quarter minted in 2008 includes the motto. Schools teach its meaning and pronunciation as part of Hawaiian language and history curriculum."

  - id: "nickname-vs-motto"
    icon: "fa-solid fa-tags"
    title: "Hawaii State Motto and Nickname"
    paragraphs:
      - "Hawaii's state motto differs from its state nickname. The motto is 'Ua Mau ke Ea o ka ʻĀina i ka Pono,' a Hawaiian phrase about sovereignty and righteousness from 1843. The state nickname is [The Aloha State](/states/hawaii/nickname/the-aloha-state), which refers to the Hawaiian spirit of love, peace, and compassion."
      - "The state motto functions as formal civic symbolism, especially on seals. A nickname develops through popular culture and tourism. Hawaii's motto connects to a specific historical event in 1843, while the nickname celebrates Hawaiian cultural values and hospitality."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Hawaii State Motto Facts"
    style: "gradient"
    facts:
      - "Kamehameha III spoke the motto on July 31, 1843, after Admiral Thomas restored sovereignty."
      - "Lord George Paulet occupied Hawaii for five months starting February 25, 1843."
      - "The word 'ea' means both life and sovereignty in Hawaiian language."
      - "Hawaii adopted it as state motto on May 1, 1959, before statehood on August 21."
      - "Thomas Square in Honolulu marks the location of the 1843 restoration ceremony."
      - "Hawaiian language became official state language alongside English in 1978."

faq:
  - question: "Which phrase serves as Hawaii's state motto?"
    answer: "The state motto of Hawaii is 'Ua Mau ke Ea o ka ʻĀina i ka Pono.'"

  - question: "What is the usual meaning given for Hawaii's motto?"
    answer: "In English, Hawaii’s state motto means 'The life of the land is perpetuated in righteousness.'"

