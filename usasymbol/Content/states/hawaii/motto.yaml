faq:
  - question: "What is Hawaii's state motto?"
    answer: "Hawaii's state motto is \"Ua Mau ke Ea o ka ʻĀina i ka Pono,\" a Hawaiian phrase meaning \"The Life of the Land Is Perpetuated in Righteousness.\" King Kamehameha III spoke these words on July 31, 1843, when Hawaiian sovereignty was restored after a five-month British occupation."

  - question: "What is the English translation of Hawaii's motto?"
    answer: "The official English translation is \"The Life of the Land Is Perpetuated in Righteousness.\" The Hawaiian word ea can also mean sovereignty, so some sources use \"The Sovereignty of the Land Is Perpetuated in Righteousness.\" The State of Hawaii uses the life translation in official publications."

  - question: "What language is Hawaii's state motto in?"
    answer: "Hawaii's motto is in the Hawaiian language, making it the only U.S. state motto in Hawaiian. All other states use English, Latin, Spanish, French, or Greek."

  - question: "When did Hawaii adopt its state motto?"
    answer: "The phrase was spoken by King Kamehameha III in 1843 and served as the motto of the Kingdom of Hawaii and then the Territory of Hawaii. It was formally designated as the state motto when Hawaii became the 50th state in 1959."

  - question: "Where does Hawaii's motto appear?"
    answer: "The motto appears along the lower arc of the Great Seal of Hawaii. The seal uses the royal coat of arms of the Kingdom of Hawaii at its center and has been the official state seal since 1959."

