faq:
- question: What is Hawaii's state insect?
  answer: "Hawaii's state insect is the Kamehameha butterfly, also called pulelehua, adopted by the Hawaii State Legislature in 2009."
- question: When did Hawaii adopt the Kamehameha butterfly?
  answer: "Hawaii adopted the Kamehameha butterfly as its official state insect on April 23, 2009, when Governor Linda Lingle signed the bill into law."
- question: Why did Hawaii choose the Kamehameha butterfly?
  answer: "Fifth-grade students at Pearl Ridge Elementary School researched the Kamehameha butterfly for a class project and pitched it to state lawmakers, who introduced and passed the bill in 2009."
- question: What does Hawaii's state insect look like?
  answer: "The Kamehameha butterfly is medium-sized with dark wings marked in reddish-orange, and three small forewing spots that are white on females and orange on males."
- question: Where is the Kamehameha butterfly found in Hawaii?
  answer: "It has been recorded on Oahu, Kauai, Maui, Hawaii Island, and Lanai, and today is most often seen in high-elevation damp forest such as Hawaii Volcanoes National Park and Waimea Canyon State Park."
- question: Is the Kamehameha butterfly the same as pulelehua?
  answer: "Pulelehua is the Hawaiian name for the Kamehameha butterfly. The word is also used more generally in Hawaiian to mean butterfly."

