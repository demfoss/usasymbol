intro_text: "Hawaii's state insect is the Kamehameha butterfly, also called pulelehua, officially adopted in 2009. It is one of only two butterfly species native to Hawaii."

sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Hawaii?
  paragraphs:
  - "The Kamehameha butterfly, Vanessa tameamea, is Hawaii's official state insect. The Hawaii State Legislature designated it in 2009."
  - "It is one of only two native Hawaiian butterfly species, alongside Blackburn's bluet. Its Hawaiian name, pulelehua, is also the general Hawaiian word for butterfly."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Kamehameha Butterfly
  paragraphs:
  - "The Kamehameha butterfly is medium-sized, with dark wings marked by reddish-orange patches, giving it a look partway between a painted lady and an admiral butterfly."
  - "Each forewing carries three small spots that are white on females and orange on males, one of the easiest ways to tell the sexes apart."
  - "Adults are active year-round, with more sightings in spring. They tend to stay in the mid to upper forest canopy, basking on sunlit leaves, and can enter short periods of hibernation in bark furrows or under koa tree limbs."

- id: history
  icon: fa-solid fa-landmark
  title: How Hawaii Chose the Kamehameha Butterfly
  paragraphs:
  - "The push for a state insect began as a Gifted and Talented class project by fifth-grade students at Pearl Ridge Elementary School on Oahu, who researched the Kamehameha butterfly and pitched it to state lawmakers."
  - "State lawmakers introduced a bill in January 2009, and it passed both chambers of the Hawaii State Legislature by mid-April."
  - "Governor Linda Lingle signed the bill on April 23, 2009, making the Kamehameha butterfly Hawaii's official state insect."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Kamehameha Butterfly in Hawaii
  paragraphs:
  - "Kamehameha butterfly caterpillars feed mainly on mamaki, along with related native plants such as opuhe, akolea, olona, and maoloa, while adults feed on the sap of koa trees."
  - "The butterfly has been recorded on Oahu, Kauai, Maui, Hawaii Island, and Lanai, though its range has shrunk due to habitat loss and non-native predators. Today it is most reliably seen in high-elevation damp forest, including Hawaii Volcanoes National Park, Mokuleia Forest Reserve, and Waimea Canyon State Park."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Kamehameha Butterfly Facts
  facts:
  - "Adopted: 2009, by the Hawaii State Legislature."
  - "Scientific name: Vanessa tameamea."
  - "One of only two butterfly species native to Hawaii."
  - "Females have white spots on the forewing where males have orange spots."
  - "Caterpillars feed on mamaki and related native plants; adults feed on koa tree sap."




