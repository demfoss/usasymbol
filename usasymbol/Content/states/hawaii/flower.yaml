seo_title: "Hawaii State Flower: Yellow Hibiscus – History & Facts"
seo_description: "The Yellow Hibiscus became Hawaii's state flower in 1988. This rare native flower grows wild on several Hawaiian islands."

intro_text: "Since 1988, the Yellow Hibiscus has served as Hawaii's state flower. This bright yellow flower grows naturally on several Hawaiian islands. The Yellow Hibiscus replaced the red hibiscus that Hawaii used informally for decades before statehood and aligns with [the Aloha State's](/states/hawaii/nickname/the-aloha-state) native-heritage focus."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Hawaii State Flower?"
    paragraphs:
      - "Hawaii officially recognizes the Yellow Hibiscus as its state flower. Each blossom displays five bright yellow petals arranged around a long central column. The flowers measure 4 to 6 inches across when fully open. A tubular structure called the staminal column extends from the center. This column holds the reproductive parts of the flower."
      - "Yellow Hibiscus plants bloom year-round in Hawaii's tropical climate. Individual flowers last only one day before wilting. New buds open daily to replace faded blooms. The shrub grows 10 to 30 feet tall in ideal conditions. Glossy green leaves with serrated edges cover the branches. Young leaves often show a bronze or reddish tint, and comparable entries appear in the [state flowers hub](/symbols/flowers)."
      - "This native Hawaiian species grows wild on Oahu, Molokai, Maui, and the Big Island. The plant prefers dry to mesic forests at elevations between 1,000 and 8,000 feet. Habitat loss threatens wild populations. The Yellow Hibiscus is classified as endangered. Conservation efforts aim to protect remaining wild specimens and establish new populations."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Hawaii State Flower Name"
    paragraphs:
      - "This flower carries the common name Yellow Hibiscus and the scientific name Hibiscus brackenridgei. The plant belongs to the Malvaceae family. This family includes cotton, okra, and hundreds of hibiscus species found in tropical and subtropical regions worldwide."
      - "The genus name Hibiscus comes from the Greek word for mallow. The species name brackenridgei honors William Brackenridge, a botanist who collected plants in Hawaii during the 1840s. He documented many Hawaiian species during the United States Exploring Expedition. Native Hawaiians call this flower mao hau hele, which refers to the plant's spreading growth habit."
      - "Hawaii has several native hibiscus species besides the Yellow Hibiscus. These include white hibiscus and red hibiscus varieties. The Yellow Hibiscus stands out as the only native Hawaiian hibiscus with consistently yellow flowers. This distinction helped in its selection as state flower and complements [Hawaii's official island color system](/states/hawaii/color/hawaii-official-state-colors-the-eight-island-colors)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Yellow Hibiscus Became the Hawaii State Flower"
    paragraphs:
      - "Hawaii established the Yellow Hibiscus as its official state flower in 1988. The state legislature voted to replace the generic red hibiscus with this native species. Senator David McClung introduced the bill. He argued Hawaii should honor a native plant rather than a cultivated variety, an approach consistent with [Hawaii's state tree history](/states/hawaii/tree/kukui)."
      - "Before 1988, Hawaii unofficially used red hibiscus as its floral symbol. No specific hibiscus species held official designation. Tourists associated any hibiscus with Hawaii. Many people wore hibiscus flowers tucked behind their ears. Garden varieties bloomed in hotel landscapes across the islands."
      - "Environmental groups supported the change to Yellow Hibiscus. They wanted to raise awareness about Hawaii's endangered native plants. The Yellow Hibiscus qualified as genuinely Hawaiian unlike imported hibiscus varieties. Its endangered status highlighted conservation needs. The legislature passed the new designation on June 6, 1988. Hawaii became one of few states to change its official flower after initial adoption."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Hawaii State Flower Facts"
    facts:
      - "The Yellow Hibiscus is endangered in the wild with populations declining due to habitat loss, invasive species, and browsing by feral animals"
      - "Hawaii adopted the Yellow Hibiscus on June 6, 1988, replacing the previously used red hibiscus that was not native to the islands"
      - "Each Yellow Hibiscus flower blooms for only one day, opening in the morning and wilting by evening"
      - "Native Hawaiians used Yellow Hibiscus wood to make canoe outriggers and the bark fibers for making cordage and nets"
      - "The Yellow Hibiscus grows naturally only in Hawaii and exists nowhere else in the world as a wild native plant"
      - "Conservation programs propagate Yellow Hibiscus in nurseries to plant in protected areas and restore wild populations"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Hawaii State Flower and Bird"
    paragraphs:
      - "The Nene serves as Hawaii's state bird, a rare goose found only in Hawaii. Both symbols represent Hawaii officially. Hawaii adopted the Yellow Hibiscus in 1988 and designated the Nene as state bird in 1957; see [Hawaii's Nene page](/states/hawaii/bird/nene) for the conservation timeline."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Yellow Hibiscus is often associated with Hawaii's unique natural heritage and island biodiversity. The flower has been linked to conservation efforts protecting native Hawaiian species from extinction. Its bright yellow color traditionally symbolizes the warmth and hospitality of the Hawaiian islands while representing the fragility of Hawaii's endemic flora across islands listed in [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Hawaii's state flower?"
    answer: "Hawaii's state flower is the Yellow Hibiscus, a bright yellow native flower that grows wild on several Hawaiian islands."
  
  - question: "When did Hawaii adopt the Yellow Hibiscus as its state flower?"
    answer: "Hawaii adopted the Yellow Hibiscus on June 6, 1988. The state legislature voted to replace the generic red hibiscus with this native species to honor a genuinely Hawaiian plant."
  
  - question: "Why did Hawaii choose the Yellow Hibiscus?"
    answer: "Hawaii chose the Yellow Hibiscus because it is native to Hawaii and grows nowhere else in the world. Environmental groups and legislators wanted to honor a genuine Hawaiian species rather than cultivated hibiscus varieties. The flower's endangered status also highlighted conservation needs for native plants."
  
  - question: "Is the Yellow Hibiscus endangered?"
    answer: "Yes, the Yellow Hibiscus is classified as endangered. Wild populations face threats from habitat loss, invasive species, and browsing by feral animals. Conservation programs work to protect remaining specimens and establish new populations."
  
  - question: "How long do Yellow Hibiscus flowers last?"
    answer: "Yellow Hibiscus flowers bloom for only one day. Individual flowers open in the morning and wilt by evening. The plant produces new buds daily to replace faded blooms throughout the year."

