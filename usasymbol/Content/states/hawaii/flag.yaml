faq:
- question: Why does Hawaii's flag have the Union Jack?
  answer: King Kamehameha I commissioned the original flag design around 1816, during the War of 1812, to avoid choosing between Britain and the United States. The Union Jack in the canton and the American-style stripes in the field were designed to signal friendship with both nations simultaneously. Hawaii was never a British colony. The Union Jack reflects a diplomatic relationship, not colonial status.
- question: What do the eight stripes on Hawaii's flag represent?
  answer: 'Each stripe represents one of the eight major Hawaiian islands: Hawaiʻi, Maui, Kahoʻolawe, Lānaʻi, Molokaʻi, Oʻahu, Kauaʻi, and Niʻihau. Before 1845, the stripe count varied — visitors reported seven, eight, or nine stripes. King Kamehameha III fixed the count at eight on May 25, 1845.'
- question: Is Hawaii's flag the only U.S. state flag with a foreign flag on it?
  answer: Yes. Hawaii's flag is the only U.S. state flag to include another country's national flag — the British Union Jack. No other U.S. state flag features a foreign national symbol in its design.
- question: When was Hawaii's state flag officially adopted?
  answer: The current design was officially standardized on May 25, 1845, by King Kamehameha III at the opening of the Legislative Council, following the 1843 Paulet Affair. The flag has remained unchanged since then. Hawaii became a U.S. state on August 21, 1959 — 114 years after the flag was adopted by the Kingdom.
- question: What is the Paulet Affair and how did it affect Hawaii's flag?
  answer: In February 1843, British Captain Lord George Paulet seized control of Hawaii, lowered the Hawaiian flag, and raised the British Union Flag. The occupation lasted five months before Rear Admiral Richard Thomas restored Hawaiian sovereignty on July 31, 1843. The incident prompted King Kamehameha III to formally standardize the flag design — fixing the eight-stripe arrangement that has been in use ever since.
