title: "Humpback Whale"
scientific_name: "Megaptera novaeangliae"
adopted_year: 1979

seo_title: "Hawaii State Marine Mammal: Humpback Whale | Official Symbol"
seo_description: "The humpback whale is Hawaii's state marine mammal, designated in 1979. These massive whales migrate to Hawaiian waters each winter to breed and give birth."

intro_text: "Hawaii's state marine mammal is the humpback whale (Megaptera novaeangliae), designated in 1979 following recognition of the species' importance to Hawaiian waters. The legislature chose these massive whales, which migrate annually from Alaska to breed and calve in Hawaii's warm waters, to represent the state's marine heritage and commitment to ocean conservation in [the Aloha State](/states/hawaii/nickname/the-aloha-state). Hawaii later added the Hawaiian monk seal as a second state marine mammal in 2008."

common_name: "Humpback Whale"
official_since: "1979"
status: "Least Concern (IUCN); removed from U.S. Endangered Species List in 2016 for most populations"
habitat_in_state: "Coastal waters surrounding all main Hawaiian Islands, particularly shallow channels between islands"
known_for: "Spectacular breaching displays, complex whale songs, and annual winter migration to Hawaiian breeding grounds"

size: "40 to 50 feet in length"
weight: "25 to 40 tons (50,000-80,000 pounds)"
coloration: "Dark gray to black on back and sides, white or mottled white and black on throat, belly, and underside of tail flukes"
distinctive_traits: "Long white pectoral fins (one-third of body length), knobby head, small dorsal fin, unique tail fluke patterns used for individual identification"

habitat: "Open ocean during migration, shallow coastal waters (less than 600 feet deep) during breeding season"
range_in_state: "All Hawaiian Islands; highest concentrations in channels between Maui, Lanai, and Molokai; also common off Kauai, Oahu, and Big Island"
conservation_status: "North Pacific population approximately 10,000-12,000 individuals; about 10,000 visit Hawaiian waters each winter; recovered from near-extinction after whaling ended"
where_to_find: "Auau Channel (between Maui and Lanai), Pailolo Channel (between Maui and Molokai), Kauai's south and west shores, Kohala Coast off Big Island; peak season December through April"
symbol_connections: "Represents Hawaii's transformation from whaling center to whale sanctuary; embodies migratory connection between Hawaii and Alaska; symbolizes successful marine mammal conservation and ocean stewardship"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Hawaii State Legislature designated the humpback whale as the official state marine mammal through Senate Concurrent Resolution 5 in 1979. The designation came just three years after humpback whales received federal protection under the Endangered Species Act in 1976, when populations had dropped to dangerously low levels from commercial whaling, and it is now referenced in the [U.S. marine mammals hub](/symbols/marine-mammals)."
      - "Hawaii holds the distinction of having two state marine mammals—the humpback whale (1979) and the Hawaiian monk seal (2008). This dual designation reflects Hawaii's diverse marine environment: the humpback whale represents migratory species that visit Hawaiian waters seasonally, while the monk seal represents endemic species found nowhere else on Earth."

    subsections:
      - subtitle: "From Whaling Capital to Whale Sanctuary"
        text: "The 1979 designation represented a remarkable reversal in Hawaii's relationship with whales. During the 1800s, Lahaina on Maui served as the Pacific's most important whaling port, with hundreds of whaling ships visiting annually to provision and repair. Whalers hunted humpback whales throughout Hawaiian waters. By choosing the humpback whale as state marine mammal just 134 years after Lahaina's whaling peak in 1845, Hawaii acknowledged past exploitation and committed to protection."

      - subtitle: "Timing of the Designation"
        text: "The legislature designated the humpback whale as state marine mammal during a critical period for the species. Commercial whaling had ceased only in 1966, and North Pacific humpback populations remained severely depleted. Scientists estimated fewer than 1,500 humpback whales visited Hawaii in the mid-1970s, compared to perhaps 15,000 before industrial whaling. The designation provided state-level recognition that complemented federal protection and supported emerging whale watching tourism as an alternative to exploitation."

  - id: "state-symbolism"
    title: "What the Humpback Whale Represents"
    style: "highlight"
    paragraphs:
      - "The humpback whale embodies Hawaii's deep connection to the Pacific Ocean. These massive mammals travel over 3,000 miles from Alaska's nutrient-rich feeding grounds to Hawaii's warm, clear waters specifically to breed and give birth. This annual migration links Hawaii to the broader Pacific ecosystem in ways that few other animals demonstrate so dramatically, reinforcing [Hawaii's sovereignty-era motto](/states/hawaii/motto/ua-mau-ke-ea-o-ka-aina-i-ka-pono)."
      - "Ancient Hawaiians called humpback whales 'koholā' and recognized them as sacred animals under the protection of Kanaloa, the ocean god. Hawaiian oral traditions describe whales as navigators that guided early Polynesian voyagers across the Pacific. Some Hawaiian families claimed whales as 'aumakua—ancestral guardians that provided spiritual protection and guidance. This cultural reverence made the whale a natural choice for official state recognition."
      - "The designation celebrates one of conservation's greatest success stories. North Pacific humpback whales recovered from near-extinction through international cooperation, strict protection, and dedicated research. From perhaps 1,200 individuals in the late 1960s, the population has grown to over 10,000 today. The whale's recovery demonstrates that humans can reverse environmental damage through sustained commitment."

    subsections:
      - subtitle: "Winter Visitors and Breeding Grounds"
        text: "Humpback whales spend winters (November through May) in Hawaiian waters for a single purpose: reproduction. Adult males sing complex songs to attract females and compete with other males for mating opportunities. Pregnant females give birth in shallow, protected waters where newborn calves can surface easily to breathe. Mothers nurse their calves in Hawaii's warm waters for several months before migrating back to Alaska. During this entire Hawaiian winter season, adult humpback whales eat almost nothing, surviving on fat reserves built up during summer feeding in Alaska."

      - subtitle: "Songs of the Ocean"
        text: "Male humpback whales produce the most complex vocalizations in the animal kingdom. These songs last 10-20 minutes and whales repeat them for hours. All males in Hawaiian waters sing variations of the same song during a given season, with the song evolving gradually over years. Scientists recorded these songs extensively in Hawaiian waters during the 1970s, contributing to worldwide recognition of whale intelligence and communication. The songs became cultural touchstones, appearing in recordings and inspiring musicians including Hawaiian artists who incorporated whale songs into compositions."

      - subtitle: "The Shallow Water Sanctuary"
        text: "Humpback whales prefer Hawaiian waters less than 600 feet deep during breeding season, concentrating in channels between islands where underwater topography creates protected environments. The Auau Channel between Maui and Lanai, sometimes called the 'humpback whale highway,' sees the highest whale densities in the Pacific. This preference for specific Hawaiian locations made protecting these areas critical for species recovery. Congress designated the Hawaiian Islands Humpback Whale National Marine Sanctuary in 1992, protecting 1,400 square miles of prime whale habitat surrounding the main Hawaiian Islands."

      - subtitle: "Economic Transformation"
        text: "The shift from hunting whales to watching them created a new Hawaiian industry. Whale watching tours began operating in the late 1970s, shortly after the state mammal designation. By the 2000s, whale watching generated over $20 million annually for Hawaii's economy, employing hundreds of people in boat operations, education, and tourism services. The living whale became far more valuable economically than the dead whale ever was, providing sustainable revenue without depleting the population, and this shift aligns with [Hawaii's flag-era history](/states/hawaii/flag/hawaii-state-flag)."

      - subtitle: "Bridge Between Two Worlds"
        text: "Humpback whales physically connect Hawaii to Alaska, spending summers feeding in Alaska's cold, productive waters and winters breeding in Hawaii's tropical seas. This 6,000-mile round-trip migration—one of the longest of any mammal—links two U.S. states with radically different environments. The whale carries nutrients from Alaska's rich waters to Hawaii's nutrient-poor tropical seas, connecting ecosystems separated by thousands of miles of ocean. This migratory pattern makes the humpback whale a symbol of Hawaii's place in the broader Pacific world."

  - id: "identification"
    title: "How to Identify Humpback Whales"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Humpback whales are among the most distinctive of all whale species. Their enormous pectoral fins—up to 16 feet long—are the longest appendages in the animal kingdom relative to body size. The knobby protuberances on the head and jaw, called tubercles, each contain a single hair follicle that helps whales sense water movement."
        list_items:
          - "**Size**: 40-50 feet long; females slightly larger than males"
          - "**Weight**: 25-40 tons (50,000-80,000 pounds)"
          - "**Color**: Dark gray to black back, white or mottled belly, white undersides of pectoral fins and tail flukes"
          - "**Distinguishing features**: Long white pectoral fins, knobby head, small dorsal fin, unique black and white patterns on tail flukes"

      - subtitle: "Identifying Individual Whales"
        text: "Every humpback whale has a unique pattern of black and white pigmentation on the underside of its tail flukes, similar to human fingerprints. Researchers photograph these patterns to identify and track individual whales throughout their lives. Since the 1970s, scientists have catalogued thousands of individual humpback whales visiting Hawaiian waters, documenting their movements, reproductive success, and lifespans. Some whales return to Hawaiian waters year after year for decades."

      - subtitle: "Breaching and Surface Behavior"
        text: "Humpback whales are famous for spectacular breaching—launching their entire 40-ton bodies out of the water and crashing back down. Scientists remain uncertain why whales breach, though theories include communication, removing parasites, play, and courtship displays. Other common surface behaviors include tail slapping (forcefully striking the water surface with tail flukes), pectoral fin slapping, and spyhopping (rising vertically to lift the head above water, apparently to look around)."

  - id: "history"
    title: "Humpback Whales and Hawaiian History"
    style: "default"
    paragraphs:
      - "Humpback whales have visited Hawaiian waters for thousands of years. Ancient Hawaiians encountered these massive animals during fishing expeditions and coastal travel. Hawaiian oral traditions preserve stories of whales guiding voyagers, protecting swimmers from sharks, and demonstrating loyalty to family groups—behaviors that earned whales respect and spiritual significance."
      - "The arrival of commercial whaling ships in the 1820s transformed Hawaii's relationship with whales. New England whalers discovered that the Hawaiian Islands provided ideal provisioning and repair facilities mid-Pacific. Lahaina on Maui became the Pacific's premier whaling port by the 1840s, with over 400 whaling ships visiting during peak years."

    subsections:
      - subtitle: "Lahaina's Whaling Era"
        text: "Between 1820 and 1860, Lahaina served as the center of Pacific whaling operations. During peak season, dozens of whaling ships crowded the harbor simultaneously. Sailors spent months ashore, spending wages and creating demand for food, supplies, and entertainment. Whaling brought significant revenue to Hawaii but also introduced diseases, alcohol-related problems, and cultural disruption. The whaling era declined after 1860 due to petroleum replacing whale oil, the Civil War disrupting New England's whaling fleet, and depleted whale populations."

      - subtitle: "Near-Extinction of Humpback Whales"
        text: "Industrial whaling in the 1900s nearly eliminated humpback whales from the Pacific. Modern diesel-powered whaling ships with explosive harpoons could chase and kill whales far more efficiently than 1800s sail-powered whalers. Between 1905 and 1965, whalers killed approximately 28,000 North Pacific humpback whales. By the mid-1960s, scientists estimated North Pacific populations had dropped to just 1,200-1,500 individuals—fewer than 10 percent of pre-whaling numbers. The International Whaling Commission banned commercial humpback whaling in 1966, giving the species its first meaningful protection."

      - subtitle: "Federal Protection and Research"
        text: "The United States listed humpback whales as endangered under the Endangered Species Act in 1976, providing critical legal protection in American waters. This federal listing occurred just three years before Hawaii designated the humpback whale as state marine mammal. During the 1970s, marine biologists including Louis Herman at the University of Hawaii began intensive studies of humpback whale behavior, songs, and population dynamics in Hawaiian waters. This research revolutionized understanding of whale intelligence and social behavior."

      - subtitle: "Creation of Whale Sanctuary"
        text: "Congress designated the Hawaiian Islands Humpback Whale National Marine Sanctuary in 1992, recognizing that Hawaiian waters serve as the North Pacific's most important breeding and calving grounds. The sanctuary protects 1,400 square miles of ocean surrounding the main Hawaiian Islands, regulating activities that might disturb whales during the breeding season. Sanctuary regulations prohibit approaching whales closer than 100 yards and restrict vessel speeds in critical whale habitat."

  - id: "behavior"
    title: "Humpback Whale Behavior"
    style: "default"

    subsections:
      - subtitle: "Migration Patterns"
        text: "North Pacific humpback whales undertake one of the longest migrations of any mammal, traveling over 3,000 miles each way between Alaska and Hawaii. Whales depart Alaska in October and November after spending summer feeding on small fish and krill in nutrient-rich waters. They arrive in Hawaiian waters by December and remain through March or April before returning north. During the entire Hawaiian winter season, whales eat virtually nothing, relying completely on fat reserves to fuel breeding activity, pregnancy, and nursing."

      - subtitle: "Breeding and Competition"
        text: "Male humpback whales compete intensely for access to females during the Hawaiian breeding season. Groups of males escort single females, engaging in aggressive behaviors including charging, tail slashing, and physical combat. These competition pods can involve a dozen males pursuing one female for hours or days. The complexity of these interactions, combined with singing behavior, demonstrates sophisticated social intelligence and communication abilities."

      - subtitle: "Mother-Calf Bonds"
        text: "Female humpback whales give birth in Hawaiian waters after approximately 11-month pregnancies. Newborn calves measure 12-15 feet long and weigh nearly one ton at birth. Mothers nurse calves with extremely rich milk (45-60 percent fat content) that allows rapid growth. Calves gain roughly 100 pounds per day during nursing. Mother-calf pairs remain in shallow, protected waters for several months, with mothers demonstrating fierce protectiveness. Calves make their first migration to Alaska at just a few months old, traveling alongside their mothers."

      - subtitle: "Intelligence and Communication"
        text: "Humpback whales possess large, complex brains and demonstrate sophisticated behaviors suggesting high intelligence. Beyond their famous songs, whales communicate through various vocalizations and physical displays. They show evidence of cultural learning—younger whales learn songs from older males, and songs evolve over time within populations. Whales also demonstrate problem-solving abilities, coordinating hunting strategies in Alaska that require cooperation and planning."

  - id: "conservation"
    title: "Conservation Success and Continuing Challenges"
    style: "default"
    paragraphs:
      - "The North Pacific humpback whale population has recovered dramatically from near-extinction. Current estimates suggest 10,000-12,000 individuals exist, with approximately 10,000 visiting Hawaiian waters each winter. This represents a remarkable recovery from the 1,200-1,500 individuals estimated in the mid-1960s. The U.S. Fish and Wildlife Service removed most humpback whale populations from the Endangered Species List in 2016, recognizing this conservation success."

    subsections:
      - subtitle: "Delisting and Continued Monitoring"
        text: "The 2016 delisting decision recognized that humpback whales no longer face immediate extinction risk in most regions. However, delisting did not eliminate all protections—humpback whales remain protected under the Marine Mammal Protection Act, which prohibits harassment, hunting, or harm. The Hawaiian Islands Humpback Whale National Marine Sanctuary continues operating, and NOAA maintains monitoring programs to track population trends and respond to threats."

      - subtitle: "Current Threats"
        text: "Despite population recovery, humpback whales face ongoing threats in Hawaiian waters and throughout their range. Ship strikes injure or kill whales that surface in shipping lanes. Entanglement in fishing gear, particularly lines from lobster and crab traps set in Alaska, causes injuries and deaths. Ocean noise from ships, military sonar, and other sources may interfere with whale communication and navigation. Climate change affects prey availability in Alaska feeding grounds, potentially impacting whale nutrition and reproductive success."

      - subtitle: "Whale Entanglement Response"
        text: "NOAA operates the Hawaiian Islands Large Whale Entanglement Response Network, coordinating trained responders who attempt to free whales entangled in fishing gear. These dangerous rescue operations require specialized equipment and expertise. Since the network's creation, responders have freed dozens of entangled humpback whales in Hawaiian waters. However, many entangled whales are never found, and some suffer fatal injuries from gear cutting into flesh or restricting swimming ability."

      - subtitle: "Research Continues"
        text: "Scientists continue studying humpback whales in Hawaiian waters decades after initial research began. Current projects use aerial drones to document whale behavior, satellite tags to track migration routes, underwater microphones to record songs, and genetic analysis to understand population structure and breeding patterns. This ongoing research helps inform management decisions and provides early warning of emerging threats to whale populations."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The humpback whale connects directly to Hawaii's state motto, 'Ua Mau ke Ea o ka Aina i ka Pono' (The life of the land is perpetuated in righteousness), adopted in 1959. The whale's recovery from near-extinction demonstrates righteous stewardship—when humans stopped killing whales and protected their habitat, populations recovered. This success story embodies the motto's principle that proper treatment perpetuates life."
      - "Hawaii designated the humpback whale as state marine mammal in 1979, then added the Hawaiian monk seal in 2008. These two marine mammals represent complementary aspects of Hawaiian waters. The humpback whale is a seasonal visitor connecting Hawaii to Alaska and the broader Pacific. The Hawaiian monk seal is a year-round resident found nowhere else on Earth. Together they symbolize both Hawaii's connections to the wider world and its unique endemic species."

    subsections:
      - subtitle: "The Hawaiian Monk Seal Partnership"
        text: "Hawaii's two state marine mammals—the humpback whale (1979) and Hawaiian monk seal (2008)—create a paired message about marine conservation. The humpback whale represents successful recovery through protection, with populations increasing from critical lows to healthy numbers. The Hawaiian monk seal remains critically endangered despite decades of intensive conservation work. One symbol offers hope through demonstrated success, while the other reminds Hawaiians that conservation requires ongoing commitment and sometimes fails despite best efforts."
        link:
          label: "See Hawaii's other state marine mammal"
          url: "/states/hawaii/mammal/hawaiian-monk-seal"

      - subtitle: "Migratory Connection to Alaska"
        text: "The humpback whale physically connects Hawaii to Alaska, spending half the year in each state. This makes the whale a living bridge between tropical and arctic Pacific environments. Interestingly, Alaska has never designated an official state marine mammal, though the bowhead whale holds cultural importance for Alaska Native communities. Hawaii's choice to honor a species that spends only half the year in Hawaiian waters reflects understanding that ocean ecosystems cross political boundaries and interstate context in [states and capital cities reference data](/rankings/geography/states-capital-cities)."

      - subtitle: "Cultural Renaissance and Hawaiian Values"
        text: "The 1979 designation of the humpback whale as state mammal occurred during Hawaii's cultural renaissance—a period of renewed interest in Hawaiian language, traditions, and environmental knowledge. The whale designation aligned with this movement by honoring an animal significant in ancient Hawaiian culture. The choice reflected growing recognition that Hawaiian traditional ecological knowledge, including beliefs about whales as sacred animals worthy of protection, offered valuable guidance for modern conservation alongside [Hawaii's Nene conservation story](/states/hawaii/bird/nene)."

