faq:
  - question: "What is Hawaii's state marine mammal?"
    answer: "Hawaii has two state marine mammals: the humpback whale (Megaptera novaeangliae), designated in 1979, and the Hawaiian monk seal, designated in 2008. Hawaii is the only U.S. state with two official marine mammals."

  - question: "When was the humpback whale designated as Hawaii's state marine mammal?"
    answer: "The humpback whale became Hawaii's official state marine mammal in 1979 through Senate Concurrent Resolution 5, just three years after the species received federal protection under the Endangered Species Act."

  - question: "Why did Hawaii choose the humpback whale as its state marine mammal?"
    answer: "Hawaii chose the humpback whale to honor the species' importance to Hawaiian waters and culture. Approximately 10,000 humpback whales migrate from Alaska to breed and give birth in Hawaii each winter. The designation marked Hawaii's transformation from a 19th-century whaling center to a modern whale sanctuary, symbolizing conservation success and ocean stewardship."

  - question: "When is the best time to see humpback whales in Hawaii?"
    answer: "The best time to see humpback whales in Hawaii is December through April, with peak numbers in February and March. Whales are visible from shore on all main Hawaiian Islands, particularly Maui's west coast, Kauai's south shore, and the Big Island's Kohala Coast. Whale watching boat tours operate throughout the season."

  - question: "How many humpback whales visit Hawaii each winter?"
    answer: "Approximately 10,000 humpback whales visit Hawaiian waters each winter, representing most of the North Pacific population. This is a dramatic increase from the mid-1960s when fewer than 1,500 whales survived after decades of commercial whaling."

  - question: "Are humpback whales still endangered?"
    answer: "Most humpback whale populations are no longer listed as endangered. The U.S. Fish and Wildlife Service removed most populations from the Endangered Species List in 2016 after successful recovery. However, humpback whales remain protected under the Marine Mammal Protection Act, and the Hawaiian Islands Humpback Whale National Marine Sanctuary continues protecting critical breeding habitat."

  - question: "Why do humpback whales come to Hawaii?"
    answer: "Humpback whales migrate to Hawaii specifically to breed and give birth in warm, shallow, protected waters. Adult males sing complex songs to attract females and compete for mating opportunities. Pregnant females give birth to calves in Hawaiian waters, where newborns can surface easily and stay warm. During their entire time in Hawaii (November through May), adult whales eat almost nothing, surviving on fat reserves from Alaska feeding."

  - question: "What is the Hawaiian name for humpback whale?"
    answer: "Ancient Hawaiians called humpback whales 'koholā' and considered them sacred animals under the protection of Kanaloa, the ocean god. Some Hawaiian families claimed whales as 'aumakua—ancestral guardian spirits that provided spiritual protection and guidance."

