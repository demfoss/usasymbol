faq:
- question: What does the diamond on Arkansas's flag mean?
  answer: The diamond represents Arkansas as the only state in the country where diamonds occur naturally in the ground. Crater of Diamonds State Park in Murfreesboro sits on a volcanic diamond deposit that was known when Willie Hocker designed the flag in 1912. The diamond shape also reflects Arkansas's roughly diamond-shaped geography.
- question: What do the four stars on Arkansas's flag mean?
  answer: 'The three lower stars have three simultaneous meanings: France, Spain, and the United States as the colonial sovereigns; the Louisiana Purchase of 1803; and Arkansas as the third state created from that purchase. The single upper star represents the Confederate States of America — it was added in 1923, ten years after the original 1913 design.'
- question: Why does Arkansas's flag have a Confederate star?
  answer: The Confederate star was added in 1923 by the Arkansas legislature as a deliberate act of commemoration, not part of the original 1913 design. Its current position — alone above the state name — was set by the 1924 legislature after debate over an earlier arrangement.
- question: Who designed the Arkansas state flag?
  answer: Willie Kavanaugh Hocker of Wabbaseka designed the Arkansas flag. She won a 65-entry contest in 1912 organized after the Pine Bluff DAR chapter discovered Arkansas had no official state flag when they wanted to present one to the USS Arkansas battleship.
- question: Why does Arkansas's flag have 25 stars on the border?
  answer: The 25 stars on the blue band around the diamond represent Arkansas as the 25th state admitted to the Union, on June 15, 1836.
