- id: previous-versions
  icon: fa-solid fa-flag
  title: Three Designs in Eleven Years
  versions:
  - name: Hocker's Contest Entry
    years: '1912'
    image: versions/hocker-original-1912.webp
    description: Willie K. Hocker's original submission had three blue stars in the diamond with no state name. The selection committee asked her to add 'Arkansas' before adoption; she rearranged the stars to one above and two below the name.
  - name: First Official Design
    years: 1913–1923
    image: versions/official-1913.webp
    description: Adopted February 26, 1913. The word Arkansas in the diamond with one star above and two stars below. Three stars for the colonial sovereigns and the Louisiana Purchase. No Confederate reference.
  - name: Confederate Star Added
    years: 1923–1924
    image: versions/official-1923.webp
    description: A fourth star added in 1923 to represent the Confederacy, placed with two stars above and two below the state name. The arrangement was disputed almost immediately.
  - name: Current Design
    years: 1924–present
    image: versions/modern-1924.webp
    description: One year later, the legislature moved to three stars below and one above — isolating the Confederate star above the name. Governor Bill Clinton codified this in 1987.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - The flag was created because the DAR needed one for the USS Arkansas battleship — the state had none
  - 'Designer: Willie Kavanaugh Hocker of Wabbaseka, chosen from 65 entries'
  - 'First adopted: February 26, 1913'
  - The diamond marks Arkansas as the only U.S. state with a natural diamond deposit
  - 25 border stars = 25th state, admitted June 15, 1836
  - 'Three lower stars carry three meanings: colonial sovereigns, Louisiana Purchase, third state from that purchase'
  - Confederate star added in 1923 — ten years after the original design
  - Star arrangement changed again in 1924, just one year after the Confederate star was added
  - Governor Bill Clinton codified the final design in 1987
  - Ranked 45th among all North American flags in the 2001 NAVA design survey
