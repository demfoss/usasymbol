hero_image_alt: A long olive-green alligator gar with a broad snout, rows of sharp teeth, and a pale belly.
hero_image_caption: The alligator gar is the largest fish in Arkansas and lives in the state's big rivers.
intro_text: Arkansas's state primitive fish is the alligator gar, a giant fish with a toothy snout that lives in the state's big rivers. It was adopted in 2019. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Primitive Fish of Arkansas?
  paragraphs:
  - The alligator gar is the official primitive fish of Arkansas. The Arkansas Legislature made it official in 2019, and the governor signed the bill in March of that year.
  - Its scientific name is Atractosteus spatula. It is the only official state fish Arkansas has.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Alligator Gar
  paragraphs:
  - The alligator gar is the largest fish in Arkansas. It often grows longer than 7 feet and can weigh more than 200 pounds.
  - It gets its name from its short, broad snout, which looks like an alligator's snout. Its upper jaw usually has a double row of sharp teeth.
  - Most alligator gar are dark olive-green on top and fade to a white belly. Gars have a long, torpedo-shaped body, hard scales, and fins set far back near the tail.
  - Gars can also come to the surface and gulp air, which most fish cannot do.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Primitive Fish
  paragraphs:
  - A student named Henry Foster from Fayetteville started the campaign in late 2017, when he was 10 years old. He wrote to state lawmakers and asked them to honor the alligator gar.
  - Lawmakers passed the bill in 2019, and Governor Asa Hutchinson signed it on March 25, 2019. Henry was 11 years old by then.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Arkansas Chose the Alligator Gar
  paragraphs:
  - Henry argued that the alligator gar would make Arkansas unique because no other state honored it. He did not want Arkansas to copy other states by picking catfish, bass, or trout.
  - For much of the last century, many people called the gar a trash fish. Today biologists in Arkansas are working to protect it and bring it back.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Alligator Gar
  paragraphs:
  - Alligator gar live in the Arkansas, White, Black, Red, Ouachita, Cache, Mississippi, and St. Francis rivers. They also live in some of the larger streams that flow into those rivers.
  - They like to lie still near logs and other cover in big rivers and backwaters.
