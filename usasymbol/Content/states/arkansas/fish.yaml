- id: facts
  icon: fa-solid fa-lightbulb
  title: Alligator Gar Facts
  facts:
  - Adopted in 2019 by the Arkansas Legislature.
  - Scientific name is Atractosteus spatula.
  - It is the second-largest freshwater fish in North America.
  - The heaviest fish ever caught in Arkansas was a 241-pound alligator gar from the Red River.
  - Arkansas is home to four kinds of gar, and the alligator gar is the biggest.
faq:
- question: What is Arkansas's state fish?
  answer: Arkansas's state fish is the alligator gar. Its official title is the state primitive fish.
- question: When did Arkansas adopt the Alligator Gar?
  answer: Arkansas adopted the alligator gar in 2019. The governor signed the bill on March 25, 2019.
- question: Why did Arkansas choose the Alligator Gar?
  answer: A 10-year-old student named Henry Foster started a campaign for it. He said the fish would make Arkansas unique because no other state honored it.
- question: Why is the alligator gar called a primitive fish?
  answer: Gars belong to a very old group of fish that goes back about 150 million years. They still have hard scales and can gulp air at the surface.
- question: How big can an alligator gar get in Arkansas?
  answer: Many grow longer than 7 feet and weigh more than 200 pounds. The Arkansas record is a 241-pound fish from the Red River.
