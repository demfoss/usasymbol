faq:
  - question: "What are the official colors of Arkansas?"
    answer: "The traditional state colors of Arkansas are Red, White, and Blue, derived from the state flag adopted in 1913. These colors honor the United States flag and Arkansas's admission as the 25th state."
  - question: "What is the HEX code for Arkansas Red?"
    answer: "The standard HEX code for Arkansas's state red is #BF0A30, corresponding to Pantone PMS 193, matching the red field of the state flag."
  - question: "What is the HEX code for Arkansas Blue?"
    answer: "The standard HEX code for Arkansas's state blue is #002868, corresponding to Pantone PMS 282, matching the blue of the United States flag as used on the state flag's diamond border."
  - question: "Why does Arkansas use red, white, and blue?"
    answer: "Arkansas adopted red, white, and blue through the 1913 state flag design to honor the colors of the United States flag, affirming national loyalty while incorporating state-specific symbolism such as the diamond shape representing Arkansas's geology and the 25 stars marking its status as the 25th state."
  - question: "Who designed the Arkansas state flag?"
    answer: "The Arkansas state flag was designed by Willie Kavanaugh Hocker, who won a design contest organized by the Daughters of the American Revolution in 1912. Her design was adopted by the Arkansas General Assembly in 1913."
  - question: "What does the diamond on the Arkansas flag represent?"
    answer: "The white diamond on the Arkansas flag represents the state's unique status as the only diamond-producing state in the United States, referencing the Crater of Diamonds in Murfreesboro, Arkansas."

