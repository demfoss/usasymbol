title: "Official and Traditional Colors of Arkansas"
state: "Arkansas"
adopted_year: null

seo_title: "Arkansas State Colors: Official HEX Codes & Meaning"
seo_description: "Arkansas state colors are Red, White, and Blue, based on the 1913 state flag. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "The traditional state colors of Arkansas are **Red**, **White**, and **Blue**, derived from [the Arkansas state flag](/states/arkansas/flag/arkansas-state-flag) adopted in 1913. While not officially designated by a separate legislative act, these colors have become the universally recognized color identity of the Natural State through the state flag, state branding, and official insignia. Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Arkansas colors accurately."

official_colors: "Red, White, and Blue"
official_since: "Traditional (based on 1913 state flag)"
primary_use: "State Flag, state government branding, state agency insignia"
known_for: "The red, white, and blue palette honoring the United States flag and Arkansas's admission as the 25th state, displayed through the diamond design of the state flag"

