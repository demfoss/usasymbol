sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Arkansas does not have officially legislated state colors designated by a separate statute. However, red, white, and blue have become the universally recognized traditional state colors through their prominent use on the Arkansas state flag, which was adopted by the Arkansas General Assembly in 1913. The flag's design — a red field bearing a white diamond bordered in blue, with the word ARKANSAS and surrounding stars — establishes all three colors as the foundation of the state's visual identity, as detailed on [Arkansas's flag page](/states/arkansas/flag/arkansas-state-flag)."
      - "The state flag was created through a design contest organized by the Daughters of the American Revolution in 1912. The winning design by Willie Kavanaugh Hocker was adopted by the Arkansas General Assembly in 1913 and has been modified slightly over subsequent decades, most recently in 1924 when a blue star was added above the name ARKANSAS to represent the Confederacy. The three-color palette of red, white, and blue deliberately mirrors the colors of the United States flag, embedding a statement of national loyalty into the state's primary visual symbol."
    subsections:
      - subtitle: "The 1913 Flag Adoption"
        text: "The Arkansas Legislature adopted the state flag in 1913 primarily to have a banner to display at the 1913 Panama-Pacific Exposition in San Francisco. Prior to this, Arkansas had no official state flag. Willie Kavanaugh Hocker's winning design drew directly from the colors of the US flag, ensuring that Arkansas's first official flag would signal patriotic allegiance. The 25 stars on the diamond's blue border represent Arkansas's status as the 25th state admitted to the Union on June 15, 1836."
      - subtitle: "Flag Modifications and Final Design"
        text: "The original 1913 design placed the word ARKANSAS within the diamond alongside 25 stars but without the additional star above the state name. In 1923, the General Assembly revised the flag to add a blue star above ARKANSAS representing the Confederate States of America, in which Arkansas participated from 1861 to 1865. A further clarification act in 1924 finalized the arrangement that remains in use today. Throughout all modifications, the three-color palette of red, white, and blue remained constant, reinforcing these colors as Arkansas's enduring state identity."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "The red, white, and blue of Arkansas carry layered meanings that connect the state to national identity while also referencing specific Arkansas history. The combination was chosen deliberately to honor the United States flag, and each color element of the state flag reinforces a different aspect of Arkansas's heritage — from its diamond-producing geology represented by the white diamond shape, to its 25th-state status represented by the ring of white stars on the blue border, to its proud Southern and American identity represented by the dominant red field."
    subsections:
      - subtitle: "Red in Arkansas History"
        text: "The red field of the Arkansas state flag is its most prominent visual element and directly references the red stripes of the United States flag. In traditional vexillological symbolism, red represents valor, hardiness, and the blood sacrificed in defense of the nation. For Arkansas, red also evokes the rich red clay soil of the Arkansas Delta region, one of the most agriculturally productive areas in the American South, where cotton farming defined the state's economy through the 19th and early 20th centuries."
      - subtitle: "White in Arkansas History"
        text: "White occupies a structurally significant position on the Arkansas flag as the color of the central diamond — the flag's defining geometric element. This white diamond carries a dual meaning unique to Arkansas: it references the state's geology as the only state in the Union with a commercially productive diamond mine (Crater of Diamonds State Park in Murfreesboro), and it creates the visual frame for the 25 stars and the state name. White traditionally symbolizes purity and peace, values reflected in Arkansas's official state motto, 'Regnat Populus' (The People Rule), explained on [Arkansas's motto page](/states/arkansas/motto/regnat-populus)."
      - subtitle: "Blue in Arkansas History"
        text: "Blue appears on the Arkansas flag as the border of the diamond and the color of the state name lettering, directly matching the blue of the United States flag. The specific shade of navy blue used (PMS 282) is the same deep blue found in the US flag's canton, reinforcing Arkansas's expressed intention to honor the national colors. The 25 white stars on the blue diamond border translate this patriotic blue into a historical marker, each star representing one of the states that preceded Arkansas into the Union before its own admission on June 15, 1836."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "The red, white, and blue colors appear on the Arkansas state flag, which is displayed at all state government buildings, courthouses, and official state functions. The Arkansas state seal, adopted in 1864 and revised in 1907, incorporates a broader palette including gold and green to represent the state's agricultural and natural resources, but the state flag's tricolor palette remains the dominant color identity in official state communications. These three colors are used consistently across Arkansas state agency branding, the Arkansas Department of Parks, Heritage and Tourism's marketing materials, and official state publications. The Arkansas Secretary of State's office maintains the flag specifications and distributes guidelines for accurate reproduction of the state flag's colors in print and digital media, with interstate context in [States That Border Arkansas](/states/arkansas/borders)."
      - "For macro comparisons, Arkansas's visual and geographic identity is often analyzed in [U.S. states by land area](/rankings/geography/states-by-land-area) and under [The Natural State nickname](/states/arkansas/nickname/the-natural-state)."

