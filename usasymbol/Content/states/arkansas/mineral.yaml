faq:
  - question: What is Arkansas's state mineral?
    answer: "Arkansas's state mineral is quartz crystal, clear to milky silicon dioxide adopted by the Arkansas Legislature in 1967."
  - question: When did Arkansas adopt quartz crystal as its state mineral?
    answer: "The Arkansas Legislature designated quartz crystal the official state mineral on February 22, 1967."
  - question: Why did Arkansas choose quartz crystal?
    answer: "Arkansas produces the majority of quartz crystal mined in the United States, most of it from the Ouachita Mountains around Mount Ida."
  - question: Where can you find quartz crystal in Arkansas?
    answer: "Mount Ida, in the Ouachita Mountains, is Arkansas's best-known quartz region and home to numerous commercial and pay-to-dig mines."

