intro_text: "Arkansas's state mineral is quartz crystal, adopted by the Arkansas Legislature in 1967 to recognize the clear quartz veins mined throughout the Ouachita Mountains around Mount Ida. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Arkansas State Mineral
    paragraphs:
      - "Quartz crystal is Arkansas's official state mineral, designated by the Arkansas Legislature in 1967. Arkansas is one of the few places in the world with quartz deposits large and clear enough to support commercial mining, concentrated in the Ouachita Mountains of west-central Arkansas."
      - "Lawmakers named quartz crystal alongside two other state symbols passed the same year, diamond as the state gem and bauxite as the state rock, in a single bill meant to give Arkansas collectors and hobby clubs official state minerals to point to."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Quartz Crystal?"
    paragraphs:
      - "Quartz crystal is silicon dioxide that grows as clear, six-sided crystals, often colorless or milky white, sometimes tinted smoky gray, pink, or purple. A well-formed crystal narrows to a point at one end, the shape most collectors picture when they hear the word quartz."
      - "Arkansas quartz forms in hydrothermal veins, cracks in the Ouachita Mountains' rock layers where mineral-rich hot water once flowed and slowly deposited silica. Some of these veins run tens of feet wide and hundreds of feet long, unusually large for quartz deposits anywhere in the world."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Arkansas Chose Quartz Crystal as Its State Mineral"
    paragraphs:
      - "The Ouachita Mountains around Mount Ida, in Montgomery County, hold some of the largest and clearest quartz veins in the country, earning the town the nickname Quartz Crystal Capital of the World. Commercial and hobby mining there has drawn collectors for generations."
      - "Arkansas produces the large majority of quartz mined in the United States, giving the state a genuine claim to the mineral rather than a symbolic one. That scale of production, paired with the state's active rockhounding community, made quartz an easy choice for state mineral in 1967."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Quartz Crystal Became Arkansas's State Mineral"
    paragraphs:
      - "Governor Winthrop Rockefeller signed the bill making quartz crystal the state mineral on February 22, 1967, the same act that named diamond the state gem and bauxite the state rock. Legislators introduced it partly to give the state's rock and mineral clubs official state symbols to trade with collectors elsewhere."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Quartz Crystal Is Found in Arkansas"
    paragraphs:
      - "Mount Ida, in the Ouachita Mountains of Montgomery County, is Arkansas's best-known quartz region, home to numerous commercial and pay-to-dig quartz mines."
    sites:
      - name: Mount Ida
        city: Mount Ida
        lat: 34.5484
        lng: -93.6299
        note: "Quartz Crystal Capital of the World"
