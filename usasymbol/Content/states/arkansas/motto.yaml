faq:
  - question: "What is Arkansas's state motto?"
    answer: "Arkansas's state motto is \"Regnat Populus,\" a Latin phrase meaning \"The People Rule.\" It has appeared on the state seal since Arkansas entered the Union in 1836."

  - question: "What does \"Regnat Populus\" mean?"
    answer: "The phrase means \"The People Rule\" in Latin. Regnat comes from the verb regnare, meaning to rule or reign. Populus means the people."

  - question: "What is the English translation of Arkansas's motto?"
    answer: "The English translation is \"The People Rule.\" The phrase expresses popular sovereignty, the idea that governing power belongs to the citizens."

  - question: "When did Arkansas adopt its state motto?"
    answer: "\"Regnat Populus\" has appeared on the Arkansas state seal since statehood. Arkansas entered the Union on June 15, 1836, as the 25th state."

  - question: "Where does Arkansas's motto appear?"
    answer: "The motto appears at the top of the Arkansas state seal, above the central shield showing a steamboat, beehive, plow, and sheaf of wheat."

