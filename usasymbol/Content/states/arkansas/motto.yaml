title: "Regnat Populus"
language: "Latin"
english_translation: "The People Rule"
adopted_year: 1907

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Arkansas State Motto: Regnat Populus"
seo_description: "Arkansas's motto 'Regnat Populus' (The People Rule) had wrong Latin grammar for 88 years — 'Regnant Populi' used plural forms that changed the meaning. The legislature corrected it in 1907. Full history of the motto's origin, the grammar fix, and what the difference meant."

intro_text: "Arkansas's state motto is <strong>Regnat Populus</strong> — Latin for <em>The People Rule</em>. The phrase has appeared on Arkansas's seal since territorial days around 1819, but for 88 years it used incorrect grammar: 'Regnant Populi.' The legislature corrected both the noun and verb on May 24, 1907, and the change mattered beyond grammar — from 'peoples rule' to 'the people rule,' singular and unified. Arkansas is the only state with this specific motto."

sections:
  - id: "88-years-wrong"
    icon: "fa-solid fa-pen-to-square"
    title: "Eighty-Eight Years of Incorrect Latin"
    paragraphs:
      - "Arkansas Territory formed July 4, 1819, and needed an official seal. Samuel Calhoun Roane, recording clerk of the first territorial assembly, is credited with the design. A Latin phrase about popular rule appeared on that seal — but the Latin was wrong. The phrase read <em>Regnant Populi</em>, using plural verb and noun forms. Translated literally, it meant something like 'the peoples rule' or 'some peoples rule.' That ambiguity persisted for nearly nine decades."
      - "The problem wasn't just grammatical. Plural 'peoples' implied multiple distinct groups — not one unified political body. In a state where the northwest hill country and the southeast plantation districts had argued for decades over representation and power, that ambiguity wasn't entirely neutral. The singular <em>Regnat Populus</em> asserts one people, one rule."
      - "On May 24, 1907, Acting Governor Xenophon O. Pindall signed the bill correcting both forms: 'populi' became 'populus,' and 'regnant' became 'regnat.' The official motto version Arkansas uses today is the 1907 correction. Arkansas Code Title 1, Chapter 4, Section 1-4-107 codifies the seal and motto."

  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "What 'Regnat Populus' Means"
    paragraphs:
      - "The translation is <strong>The People Rule</strong>. 'Regnat' is the third-person singular of <em>regnare</em>, 'to reign or rule.' 'Populus' is the Latin word for 'the people' as a single collective body — not a collection of groups, but a unified civic entity."
      - "The concept is popular sovereignty: government authority derives from the people, not from a monarch, aristocracy, or church. For a frontier territory founded in 1819 — in an era of Jacksonian democracy when ordinary citizens were pushing back against elite control — the phrase matched the political mood."

  - id: "history"
    icon: "fa-solid fa-landmark"
    title: "From Territorial Seal to State Motto"
    paragraphs:
      - "Arkansas Territory split from Missouri Territory in 1819. The territorial government needed a seal immediately. Roane's design put a popular-sovereignty motto at its center — a deliberate political statement in the era of the Missouri Compromise debates."
      - "Arkansas became the 25th state on June 15, 1836. The state constitution (Article 5, Section 12) directed that Arkansas would use the territorial seal until the legislature changed it. The General Assembly confirmed the motto again in 1864 during the Civil War, keeping it even through the state's Confederate years and Reconstruction."
      - "The 1907 correction was not purely grammatical housekeeping. The legislature made a deliberate choice about what the motto should mean: one people, with one claim to govern themselves. The change happened during the Progressive Era, when Arkansas was modernizing its laws and institutions across the board."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Arkansas State Motto Facts"
    style: "gradient"
    facts:
      - "Arkansas is the only U.S. state with 'Regnat Populus' as its motto."
      - "The motto had grammatically incorrect Latin — 'Regnant Populi' — from 1819 to 1907."
      - "Samuel Calhoun Roane, recording clerk of the territorial assembly, likely designed the original seal."
      - "Acting Governor Xenophon O. Pindall signed the grammar correction on May 24, 1907."
      - "South Dakota's motto 'Under God, the People Rule' echoes the same theme but adds a theological dimension."
      - "Arkansas Code §1-4-107 contains the current legal description of the seal and motto."

faq:
  - question: "What is Arkansas's state motto?"
    answer: "Arkansas's state motto is 'Regnat Populus,' a Latin phrase meaning 'The People Rule.' It became the official, grammatically correct version on May 24, 1907, when Acting Governor Xenophon O. Pindall signed the bill correcting the earlier 'Regnant Populi.'"

  - question: "What does 'Regnat Populus' mean in English?"
    answer: "'The People Rule.' 'Regnat' means 'rules' or 'reigns' (singular), and 'populus' means 'the people' as a unified body. The motto expresses the principle of popular sovereignty — that government authority comes from citizens, not monarchs or elites."

  - question: "What was wrong with the original Arkansas motto?"
    answer: "The territorial seal used 'Regnant Populi' — incorrect Latin that roughly translates as 'the peoples rule' or 'some peoples rule.' Both the verb ('regnant' → 'regnat') and the noun ('populi' → 'populus') were in plural forms. The 1907 correction made both singular, expressing one unified people rather than multiple separate groups."

  - question: "When did Arkansas officially adopt its state motto?"
    answer: "The motto phrase appeared on the territorial seal around 1819, but the grammatically correct version 'Regnat Populus' was officially adopted on May 24, 1907. Arkansas Code §1-4-107 contains the current legal designation."

  - question: "Is Arkansas the only state with this motto?"
    answer: "Yes. 'Regnat Populus' is unique to Arkansas among all 50 states. South Dakota's motto — 'Under God, the People Rule' — expresses a similar idea but is a different phrase with a theological addition."

  - question: "Where does Arkansas's motto appear?"
    answer: "On the Arkansas state seal, which shows the Goddess of Liberty, an eagle, a shield, a sword of justice, an olive branch, and the Angel of Mercy — with 'Regnat Populus' on a ribbon in the design. The seal appears on official documents, government buildings, and state letterhead."

