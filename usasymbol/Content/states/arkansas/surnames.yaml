seo:
  title: "Most Common Last Names in Arkansas — Top 20 Surnames & Origins"
  description: "Smith is the most common last name in Arkansas, shared by roughly 27,000 residents. See the full top 20 surnames, why Williams and Jackson rank high in the Delta's plantation counties, and the Scots-Irish Ozark settlers and emancipation-era roots behind Arkansas's family names."

page:
  h1: "Most Common Last Names in Arkansas"
  intro: "Smith leads the most common last names in Arkansas, carried by Scots-Irish settlers who crossed into the Ozarks from Tennessee and Kentucky after 1815. The Delta's cotton economy runs Williams and Jackson into the state's top five."
  heritage_title: "Ozark Scots-Irish and the Delta Cotton Economy: How Arkansas Got Its Names"
  heritage_body: "Scots-Irish families from Tennessee and Kentucky colonized the Ozark and Ouachita Mountains after Arkansas Territory opened in 1819, filling Benton, Carroll, and Boone counties with Smith, Jones, and Wilson at densities above the national average. The Delta's plantation economy in Phillips and Mississippi counties produced the African American Williams and Jackson concentrations that set eastern Arkansas apart from the Scots-Irish highlands."
  fun_fact: "Sam Walton relocated from Newport (Jackson County) to Bentonville (Benton County) in 1950 after his landlord reclaimed his store lease — a forced move that planted the Walton family in Benton County permanently and eventually produced the world's largest retailer at that same address."

surnames:
  - rank: 1
    name: Smith
    count: 27000
    ratio: 108
    origin: english
    type: Occupational
    meaning: "Old English 'smið' for metalworker became the most widely recorded occupational surname in England by the 13th century. Smith families carried the name into the Ozark and Ouachita mountains with the Scots-Irish migration from Tennessee and Kentucky after 1815, and it has held Arkansas's top rank through every subsequent census."

  - rank: 2
    name: Johnson
    count: 22000
    ratio: 133
    origin: english
    type: Patronymic
    meaning: "Hebrew 'Yohanan' (God is gracious) passed through Greek, Latin, and medieval English before John became the dominant given name in English parishes — and Johnson its natural patronymic. Johnson County, Arkansas was formed in 1833 and named for federal judge Benjamin Johnson, reflecting how thoroughly the surname had penetrated the territorial establishment by statehood."

  - rank: 3
    name: Williams
    count: 21000
    ratio: 139
    origin: english
    type: Patronymic
    meaning: "Norman 'Willahelm' — will plus helm — made William the dominant post-Conquest given name in England, and Williams its patronymic heir. Williams concentrations peak in the Arkansas Delta counties of Phillips and Crittenden, where African American families carried or established the name through emancipation and the sharecropping economy of the 1870s–1910s."

  - rank: 4
    name: Jones
    count: 19000
    ratio: 153
    origin: welsh
    type: Patronymic
    meaning: "The defining Welsh patronymic — son of John via 'Ioan' — spread through Appalachia as Welsh and Scots-Irish settlers mingled in the Virginia and Carolina highlands before moving west. Jones families crossed into Carroll, Benton, and Madison counties in the Ozarks from the 1820s onward, giving northwestern Arkansas a Jones density still above the national per-capita average."

  - rank: 5
    name: Brown
    count: 18000
    ratio: 162
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', describing brown hair or complexion — one of England's oldest descriptive surnames. Brown appears in both the Ozarks Scots-Irish communities and the Delta African American farming settlements, giving it an unusually even east-west distribution across Arkansas's two dominant cultural regions."

  - rank: 6
    name: Davis
    count: 14000
    ratio: 208
    origin: english
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ' (beloved), reached English largely via the Welsh form Dafydd — giving Davis a distinctly Appalachian character despite widespread English use. Davis families settled the White River valley in Independence and Izard counties in the 1830s–1850s, carried by migrants pushing west from Tennessee."

  - rank: 7
    name: Wilson
    count: 10800
    ratio: 270
    origin: english
    type: Patronymic
    meaning: "Son of Will, a contraction of William, Wilson spread through northern England and Scotland before Scots-Irish settlers carried it across the Appalachians and into the Arkansas river valleys. Wilson concentrations appear in the Arkansas River counties — Yell, Conway, and Faulkner — part of the Scots-Irish belt stretching from central Arkansas west toward Fort Smith."

  - rank: 8
    name: Taylor
    count: 9600
    ratio: 304
    origin: english
    type: Occupational
    meaning: "Old French 'tailleur', one who cuts cloth, entered English as a trade name so common it became hereditary in every county by the 14th century. Taylor reached every Arkansas county with the Scots-Irish migration of the 1820s–1850s, concentrating in Izard and Fulton counties in the Ozark highlands where families persisted through the timber era of the 1890s–1910s."

  - rank: 9
    name: Thomas
    count: 9200
    ratio: 317
    origin: english
    type: Patronymic
    meaning: "Aramaic 'Tʼōmā' (twin) — the apostle's name spread across medieval Christendom into every English-speaking household. Thomas concentrations appear in both Washington County (the Fayetteville corridor) and the Mississippi Delta, reflecting the name's presence across both the Scots-Irish highland communities and the African American plantation counties."

  - rank: 10
    name: Martin
    count: 9000
    ratio: 324
    origin: english
    type: Patronymic
    meaning: "Latin 'Martinus' (of Mars), popularized through the feast of Saint Martin of Tours, became one of the most recorded given names in medieval Christendom. Martin families settled the Ouachita Mountain counties of Polk, Scott, and Montgomery in the 1830s–1850s alongside the military road that connected Little Rock to Fort Smith."

  - rank: 11
    name: Anderson
    count: 8700
    ratio: 335
    origin: scottish
    type: Patronymic
    meaning: "Son of Anders (Andrew), from Greek 'Andreas' (manly), spread through Scotland and northern England with settlers who favored the apostle's name. Anderson families homesteaded the White River plateau in Baxter and Marion counties from the 1840s onward, part of the later Scots-Irish wave that pushed into the more remote Ozark drainages after better river-valley land was taken."

  - rank: 12
    name: Thompson
    count: 8400
    ratio: 347
    origin: english
    type: Patronymic
    meaning: "Son of Thom, with the 'p' inserted as a 15th-century scribal spelling convention. Thompson families appear in early Pulaski County records from the 1820s–1830s, when Little Rock was established as the territorial capital and drew the first wave of Anglo-American merchants and landowners from older Southern states."

  - rank: 13
    name: White
    count: 8100
    ratio: 360
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', white hair or pale complexion. White families concentrated in the Grand Prairie region of Prairie County from the 1840s onward, where Scots-Irish settlers found open grassland between the Arkansas River and the Ozark foothills suited to the stock-raising they had practiced in Tennessee."

  - rank: 14
    name: Jackson
    count: 7900
    ratio: 369
    origin: english
    type: Patronymic
    meaning: "Medieval 'Jack' — a diminutive of John so common it briefly served as a generic English word for any common man — produced Jackson throughout the British Isles. Jackson concentrations peak in the Delta counties of Lee, Phillips, and St. Francis, where African American families established surnames through emancipation and the sharecropping era of the 1870s–1910s."

  - rank: 15
    name: Harris
    count: 7100
    ratio: 411
    origin: english
    type: Patronymic
    meaning: "Germanic 'Haimric' (home-ruler) gave English the given name Harry and its patronymic Harris. Harris families settled Saline and Garland counties along the Ouachita River in the 1840s–1860s, part of the westward migration following the military road that connected Little Rock to Fort Smith."

  - rank: 16
    name: Moore
    count: 7000
    ratio: 417
    origin: english
    type: Habitational
    meaning: "From Old English 'mōr', someone near open uncultivated moorland. Moore appears in Sebastian County records from the 1840s–1850s as Anglo settlers followed the Arkansas River west toward Fort Smith and the Indian Territory border, planting the name in the river-valley farming communities of western Arkansas."

  - rank: 17
    name: Robinson
    count: 6500
    ratio: 449
    origin: english
    type: Patronymic
    meaning: "Son of Robin, a medieval diminutive of Robert (Germanic 'Hrōdbert', fame-bright). Robinson concentrations appear in Pulaski County's African American neighborhoods in Little Rock, established during the post-emancipation migration from the Delta plantation counties of Phillips and Lee."

  - rank: 18
    name: Walker
    count: 6400
    ratio: 456
    origin: english
    type: Occupational
    meaning: "Old English 'wealcere', one who treads cloth to full it — a textile trade name that became hereditary across England. Walker families settled the Arkansas River valley counties of Pope and Yell in the 1830s–1840s, part of the Scots-Irish migration moving west from the Mississippi River crossing near Memphis."

  - rank: 19
    name: Allen
    count: 6200
    ratio: 471
    origin: english
    type: Patronymic
    meaning: "Possibly from a Breton Celtic personal name 'Alaon', carried to England by Norman settlers after 1066 and spread through the British Isles as a common given name. Allen families are documented in Benton County records from the 1830s–1840s, among the earliest Scots-Irish homesteaders in the fertile Northwest Arkansas valleys."

  - rank: 20
    name: Lewis
    count: 5800
    ratio: 503
    origin: welsh
    type: Patronymic
    meaning: "Germanic 'Hlūdwig' (famous warrior) filtered through Old French as Louis before becoming Lewis in English — and independently derives from Llywelyn in Welsh. Lewis appears in early Hempstead County records (southwestern Arkansas) from the 1820s–1840s, part of the Red River valley corridor connecting the older Southern states to Arkansas Territory."

