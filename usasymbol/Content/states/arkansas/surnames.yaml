    national_rank: 3500 # UNVERIFIED
    origin: english
    why: "Sam Walton relocated from Newport (Jackson County) to Bentonville (Benton County) in 1950 and built Walmart into the world's largest retailer from the same county — drawing the extended Walton family and thousands of corporate vendors and executives to Benton County across seven decades. Benton County holds the highest per-capita Walton household concentration of any U.S. county, roughly eight times the national average." # UNVERIFIED: 'eight times' figure

  - name: Deaton
    state_rank: 280
    national_rank: 5500 # UNVERIFIED
    origin: english
    why: "Deaton families arrived in the Ozark uplands of north-central Arkansas in the 1830s–1850s with the Appalachian migration from Tennessee and Kentucky, concentrating in Stone, Van Buren, and Cleburne counties along the Little Red River drainage. Arkansas holds a higher per-capita share of U.S. Deaton households than any surrounding state, reflecting the name's geographic concentration in the isolated upland counties north of the Arkansas River." # UNVERIFIED: surrounding-state comparison

  - name: Flippin
    state_rank: 850
    national_rank: 9000 # UNVERIFIED
    origin: english
    why: "Thomas Flippin settled the White River valley in Marion County in the 1840s, and the town of Flippin takes its name directly from his family — one of the few Arkansas place names that preserves an early settler's surname in continuous use. The Flippin surname remains concentrated in Marion and Baxter counties, where Arkansas accounts for a disproportionate share of all U.S. Flippin households." # UNVERIFIED: share figure

  - name: Bledsoe
    state_rank: 320
    national_rank: 4500 # UNVERIFIED
    origin: english
    why: "Bledsoe families followed the river-road migration from Tennessee into the Arkansas Ozarks — particularly Carroll, Benton, and Madison counties — in the 1820s–1840s, part of the same Scots-Irish wave that defined the upland culture of northwest Arkansas. Arkansas retains one of the higher per-capita Bledsoe concentrations in the lower 48 states, anchored in the Fayetteville-to-Harrison corridor." # UNVERIFIED: per-capita claim

etymology_groups:
  - type: English Patronymics
    icon: fa-solid fa-person
    description: "Johnson leads an English patronymic tier nine-deep in Arkansas's top 20, rooted in the Scots-Irish migration that colonized the Ozark and Ouachita highlands from the 1820s onward. The depth of this patronymic tier reflects Arkansas's Appalachian heritage more than any neighboring Gulf Coast state where Spanish or French names compete for the middle ranks."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Jones (son of John/Ioan)
      - Wilson (son of Will)

  - type: African American Heritage Names
    icon: fa-solid fa-seedling
    description: "Williams and Jackson index significantly above the national average in eastern Arkansas, where the Delta plantation counties — Phillips, Lee, and Crittenden — produced concentrated African American communities through emancipation and the sharecropping era of the 1870s–1920s. The Delta's weight separates Arkansas's eastern surname pattern sharply from the Scots-Irish western highlands."
    examples:
      - Williams
      - Jackson
      - Robinson
      - Brown

  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Smith anchors the occupational tier at Arkansas's top rank, with Taylor and Walker following in the middle ranks — all reflecting the English trade-name tradition carried by Appalachian migrants across the Ozark and Ouachita highlands. Smith's dominance is stronger in Arkansas than in most Gulf Coast states, where competing name groups dilute the occupational tier."
    examples:
      - Smith (metalworker)
      - Taylor (tailor)
      - Walker (cloth-fuller)

faq:
  - question: "What is the most common last name in Arkansas?"
    answer: "Smith is the most common surname in Arkansas, shared by roughly 27,000 residents — about 1 in every 108 people. Scots-Irish settlers from Tennessee and Kentucky carried Smith into the Ozark and Ouachita mountains after Arkansas became a territory in 1819, and it has held the state's top rank through every subsequent census."

  - question: "Why do Williams and Jackson rank so high in Arkansas?"
    answer: "Both names concentrate in the Arkansas Delta — the cotton-plantation counties along the Mississippi River including Phillips, Lee, Crittenden, and Mississippi counties. Williams and Jackson reached the Delta with enslaved people migrated from older Southern states during the antebellum cotton expansion of the 1830s–1850s, and both remained as established surnames through emancipation and the sharecropping era."

  - question: "Are there surnames found almost exclusively in Arkansas?"
    answer: "Walton concentrates in Benton County at a per-capita rate among the highest of any U.S. county, directly tied to Sam Walton's founding of Walmart in Rogers in 1962 and the family's continued residence in Bentonville. Flippin and Deaton show similar Ozark-specific concentration patterns rooted in the 1830s–1850s Appalachian settlement of the White River valley."

  - question: "Where does the Arkansas surname data come from?"
    answer: "This list draws on the U.S. Census Bureau's 2010 Census surname data, the most comprehensive public dataset of American family names by state. Population counts are estimates derived from Census frequency tables (percentage of state population × 2,915,918). Unique surname rankings compare state-vs-national frequency from the same 2010 dataset."

