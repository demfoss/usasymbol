faq:
  - question: What is Arkansas's state gem?
    answer: "Arkansas's state gem is diamond, pure crystallized carbon and the hardest natural material known."
  - question: When did Arkansas adopt diamond as its state gem?
    answer: "The Arkansas Legislature designated diamond the official state gem on February 22, 1967."
  - question: Why did Arkansas choose diamond?
    answer: "Arkansas has a natural diamond-bearing volcanic pipe near Murfreesboro, the only diamond deposit in the country open to public digging."
  - question: Where can you find diamonds in Arkansas?
    answer: "Crater of Diamonds State Park, near Murfreesboro in Pike County, is the only diamond-producing site in the world open to the public, and visitors keep what they find."

