intro_text: "Arkansas's state gem is diamond, adopted by the Arkansas Legislature in 1967 to recognize the state's Crater of Diamonds, the only diamond deposit in the United States open to the public. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Arkansas State Gem
    paragraphs:
      - "Diamond is Arkansas's official state gem, designated by the Arkansas Legislature in 1967. Arkansas is one of the only places in North America where diamonds occur naturally in bedrock, in an eroded volcanic pipe near Murfreesboro."
      - "Arkansas earned this designation on the strength of a genuine geological rarity. The diamond-bearing pipe near Murfreesboro remains the only diamond deposit in the country open for the public to search."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Diamond?"
    paragraphs:
      - "Diamond is pure carbon crystallized under extreme heat and pressure, the hardest naturally occurring material known, which is why it can only be scratched by another diamond. Arkansas diamonds come out of the ground as small, often rounded crystals, typically colorless, yellow, or brown rather than the large, flawless stones seen in jewelry store displays."
      - "The diamonds formed deep in the Earth's mantle and were carried up rapidly through a volcanic pipe millions of years ago, along with other minerals like garnet and peridot. Because the pipe eroded down to the surface over time, diamonds and other minerals are found today by digging and sifting through the plowed field that sits atop it."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Arkansas Chose Diamond as Its State Gem"
    paragraphs:
      - "Diamonds were discovered near Murfreesboro in 1906, on a farm that sat atop what turned out to be a volcanic pipe carrying diamond-bearing rock up from deep in the mantle. Arkansas remains the only U.S. state with a documented, natural diamond source open to search."
      - "The state bought the property in the early 1970s and turned it into Crater of Diamonds State Park, where visitors can dig and keep any diamonds they find. That mix of geological rarity and hands-on public access made diamond an obvious choice for state gem when lawmakers acted in 1967."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Diamond Became Arkansas's State Gem"
    paragraphs:
      - "Governor Winthrop Rockefeller signed the bill naming diamond the state gem on February 22, 1967, the same act that designated quartz crystal the state mineral and bauxite the state rock."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Diamonds Are Found in Arkansas"
    paragraphs:
      - "Crater of Diamonds State Park, near Murfreesboro in Pike County, sits atop an eroded volcanic lamproite pipe and is the only diamond-producing site in the world open to the public. Visitors find several hundred diamonds there in a typical year."
    sites:
