  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Diamond Facts"
    facts:
      - "Adopted as Arkansas's state gem in 1967."
      - "Diamonds were first discovered near Murfreesboro in 1906."
      - "Crater of Diamonds State Park is the only diamond-producing site in the world open to the public."
      - "Visitors find more than 600 diamonds at the park in a typical year, and finders keep what they dig."

