name: Stuttgart Soil Series
adopted_year: 1997
is_official: true
meaning: "Stuttgart soil is the foundation of Arkansas's rice industry. Its secret is in the subsoil: a thick, sticky clay layer that holds water on the surface long enough for rice to grow — the same way a clay-lined pond holds water. That slow-draining clay built Arkansas into one of the top rice-producing states in the country and made the Grand Prairie, where Stuttgart soil is most concentrated, famous far beyond its size. The soil is named for the city of Stuttgart, which calls itself the Rice and Duck Capital of the World."
meaning_title: Meaning of the Stuttgart Soil Series
meaning_after_section: history
