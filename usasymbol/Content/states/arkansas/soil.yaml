seo_title: "Arkansas State Soil | Stuttgart Series"
seo_description: "The Arkansas state soil is the Stuttgart series, adopted in 1997. It covers 200,000 acres in the Grand Prairie and grows rice, soybeans, and corn."
hero_image: /images/soils/arkansas/rice-field-near-stuttgart.jpg
