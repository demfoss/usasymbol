faq:
- question: What is Arkansas's state soil?
  answer: "Arkansas's state soil is the Stuttgart series, a deep silty soil found on the Grand Prairie of east and southeast Arkansas. The Arkansas General Assembly designated it the official state soil in 1997 by Act 890."
- question: Why is it called Stuttgart soil?
  answer: "The series is named after the city of Stuttgart in Arkansas County, located in the heart of the Grand Prairie where these soils are most common. Stuttgart is known as the Rice and Duck Capital of the World."
- question: What color is Stuttgart soil?
  answer: "The surface is dark grayish brown — almost chocolate-colored when moist. Below that is a yellowish brown eluvial layer. The most striking layer is the deep red silty clay subsoil, which gets its color from iron oxides. Deeper still, the clay fades to grayish brown as poor drainage removes the iron."
- question: Where is Stuttgart soil found in Arkansas?
  answer: "Stuttgart soil covers about 200,000 acres on the Grand Prairie of east and southeast Arkansas, mainly in Arkansas, Lonoke, Prairie, Jefferson, Desha, and St. Francis counties. The Grand Prairie sits between the Arkansas and White rivers."
- question: What grows in Stuttgart soil?
  answer: "Rice is the main crop — Stuttgart soil's slow-draining clay subsoil holds paddy water in place naturally. Soybeans, corn, and small grains are also common. After rice harvest, the flooded fields attract millions of ducks, making the area one of the top duck hunting destinations in the country."
- question: Who chose Stuttgart as Arkansas's state soil?
  answer: "Representative Wanda Northcutt of District 81 introduced the bill in 1997. Her district covered parts of Arkansas, Desha, Jefferson, Lonoke, and Prairie counties — all Stuttgart soil country. The Arkansas General Assembly passed Act 890, making it official."
- question: Why is Stuttgart soil good for rice?
  answer: "The clay subsoil — starting about 23 inches down — has very slow permeability, meaning water cannot drain through it quickly. When rice farmers flood their fields, that clay layer holds the water at the surface long enough for the rice to grow, acting like a natural liner in a pond."

