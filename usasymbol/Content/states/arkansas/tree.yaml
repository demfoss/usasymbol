seo_title: "Arkansas State Tree | Pine Tree"
seo_description: 'Arkansas made pine its state tree in 1939, honoring the native shortleaf, loblolly, longleaf, and slash pines central to its timber region.'

intro_text: "Arkansas made the Pine Tree its official state tree in 1939, and it remains part of the [list of U.S. state trees](/symbols/trees). State Representative Boyd Tackett of Pike County introduced House Concurrent Resolution No. 2, citing pine timber as one of Arkansas's greatest sources of wealth. The legislation did not specify a particular pine species. Four native pine species grow in Arkansas—shortleaf pine, loblolly pine, longleaf pine, and slash pine. Loblolly and shortleaf pines remain the most common varieties across the state today."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Arkansas State Tree?"
    paragraphs:
      - "Pine trees hold official recognition as Arkansas's state tree. The designation covers all four native pine species rather than a single variety. Loblolly pine and shortleaf pine dominate Arkansas forests today. Both species can reach heights of 100 feet at maturity. Loblolly pine grows faster and typically reaches maturity in 30 to 40 years. Shortleaf pine grows more slowly but lives longer."
      - "Pine bark appears reddish-brown and develops deep fissures with age. The bark breaks into irregular scaly plates on older specimens. The needles bundle in groups of two or three, depending on the species. Loblolly pine needles measure 5 to 8 inches long. Shortleaf pine needles grow slightly shorter at 3 to 5 inches. The cones vary in size from 2 to 6 inches depending on species. Pine trees produce both male and female cones on the same tree."
      - "Arkansas pine forests cover over 5 million acres across the state. The trees grow most abundantly in the southern and eastern portions. Arkansas hosts two national forests—Ouachita National Forest and Ozark-St. Francis National Forest. Both forests contain extensive pine stands mixed with hardwoods. Before European settlement, forests covered 95 percent of Arkansas. Pine dominated approximately 17 percent of those original forests."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Arkansas State Tree Name"
    paragraphs:
      - "The common name is Pine Tree, referring to the genus Pinus. Arkansas's designation includes four native species. Loblolly pine carries the scientific name Pinus taeda. Shortleaf pine is Pinus echinata. Longleaf pine is Pinus palustris. Slash pine is Pinus elliottii. All belong to the Pinaceae family, the pine family."
      - "Loblolly pine gets its name from low-lying wet areas where it commonly grows. The term 'loblolly' refers to a mudhole or mire. Shortleaf describes the species' shorter needles compared to longleaf pine. The name longleaf comes from needles that grow 6 to 18 inches long. Lumber operators historically called shortleaf pine 'yellow pine' for its yellowish wood color."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Pine Tree Became the Arkansas State Tree"
    paragraphs:
      - "Arkansas named the Pine Tree as its state tree on January 20, 1939. State Representative Boyd Tackett of Pike County introduced House Concurrent Resolution No. 2 on January 11. The measure faced no opposition and won final approval nine days later. The resolution emphasized pine timber resources as 'one of the greatest sources of wealth' for Arkansas."
      - "The legislature chose pine for its economic importance to Arkansas's timber industry. By 1939, the lumber industry had already transformed Arkansas's economy. Railroads expanded in the late 19th century, providing access to external markets. Arkansas timber left the state at rapid rates, generating substantial revenue. The resolution specifically noted that pine timber represented 'one of the few renewable resources of the state,' echoing ideas later expressed in [Arkansas's state motto](/states/arkansas/motto/regnat-populus)."
      - "Reforestation efforts influenced the selection. By 1939, extensive logging had depleted much of Arkansas's original forest. The Arkansas Forestry Commission, established in 1930, worked to restore forest lands. The Civilian Conservation Corps helped reseed cleared areas and establish new pine plantations. The state tree designation supported these conservation efforts by recognizing pine timber's ongoing importance to Arkansas's future economic position."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Arkansas State Tree Facts"
    facts:
      - "Arkansas named the Pine Tree as state tree on January 20, 1939, without specifying a particular species"
      - "Four native pine species share the designation: loblolly, shortleaf, longleaf, and slash pine"
      - "The 'Morris Pine,' a loblolly specimen in Ashley County, stands 117 feet tall and exceeds 300 years old"
      - "Loblolly pine is the most commercially important forest species in the southern United States"
      - "Over 83 percent of saw timber grown in Arkansas consists of pine, oak, and gum"
      - "Pine forests cover over 5 million acres in Arkansas, with naturally seeded pine accounting for 17 percent of state forests"
      - "Arkansas hosts approximately 2.4 billion pine trees of sapling size and larger out of 10.7 billion total forest trees"
      - "Both Ouachita National Forest and Ozark-St. Francis National Forest contain extensive pine stands"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Arkansas State Tree and Flower"
    paragraphs:
      - "Arkansas's state flower is the Apple Blossom (Pyrus coronaria), adopted in 1901. The Apple Blossom earned its designation 38 years before the Pine Tree. Both are official symbols of Arkansas; see [Arkansas's flower page](/states/arkansas/flower/apple-blossom) for the floral timeline. The pink and white apple blossoms bloom in April and May across Arkansas orchards. Pine trees, meanwhile, dominate the state's forests year-round. The apple represented Arkansas's agricultural heritage when the state was a major apple producer. The pine symbolizes Arkansas's timber industry and forest resources that continue driving the state's economy."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize Arkansas Pine Trees"
    paragraphs:
      - "Pine trees display several identifying features. The reddish-brown bark develops deep furrows forming irregular plates. Mature bark appears rough and scaly. Young bark shows a smoother texture with a more orange-brown color. Resin often seeps from bark wounds, creating sticky patches."
      - "The needles grow in bundles called fascicles. Loblolly and shortleaf pines produce three needles per bundle. Longleaf pine grows three needles per bundle but they measure much longer. The needles appear dark green and flexible. They remain on the tree for about two years before dropping. Dead brown needles accumulate beneath pine trees, creating a soft forest floor."
      - "The growth form produces a straight central trunk. Young pines develop a pyramidal shape with branches extending to the ground. Mature trees lose lower branches, concentrating foliage near the top. The crown becomes irregular and rounded with age. Cones hang from upper branches, opening to release seeds. Small pollen cones appear in spring, releasing yellow clouds of pollen that dust everything nearby."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Pine Tree represents timber recovery and working forests in Arkansas culture. Its designation as a renewable resource symbolizes sustainable forestry practices. The tree's rapid growth reflects Arkansas's industrial development. For many Arkansans, pine forests evoke the state's rural timber landscape, tying directly to [The Natural State nickname](/states/arkansas/nickname/the-natural-state). The tree's commercial importance reflects Arkansas's connection to timber industry traditions that shaped communities across the state."
      - "From a regional view, Arkansas forest distribution is often discussed with [States That Border Arkansas](/states/arkansas/borders) and national comparisons like [U.S. states by land area](/rankings/geography/states-by-land-area)."

faq:
  - question: "What is the Arkansas state tree?"
    answer: "The Pine Tree is Arkansas's official state tree, adopted by the General Assembly on January 20, 1939. The designation includes all four native pine species without specifying one particular variety."
  
  - question: "What is the Arkansas state tree called?"
    answer: "Arkansas's state tree is called the Pine Tree. Four native species share this designation: loblolly pine (Pinus taeda), shortleaf pine (Pinus echinata), longleaf pine (Pinus palustris), and slash pine (Pinus elliottii)."
  
  - question: "When was Arkansas's state tree adopted?"
    answer: "Arkansas adopted the Pine Tree on January 20, 1939. State Representative Boyd Tackett introduced the resolution on January 11, and it passed without opposition nine days later."
  
  - question: "Why is the Pine Tree Arkansas's state tree?"
    answer: "Arkansas chose the Pine Tree because of its economic importance to the state's timber industry. The 1939 resolution cited pine timber as one of Arkansas's greatest sources of wealth and one of the few renewable resources. The designation also supported reforestation efforts underway during that period."
  
  - question: "What is the Arkansas state tree name?"
    answer: "The name is Pine Tree, referring to the genus Pinus. The most common species are loblolly pine (Pinus taeda) and shortleaf pine (Pinus echinata)."
  
  - question: "Where do Arkansas pine trees grow?"
    answer: "Pine trees grow throughout Arkansas but are most abundant in the southern and eastern portions of the state. Over 5 million acres of pine forests cover Arkansas. Both of the state's national forests—Ouachita and Ozark-St. Francis—contain extensive pine stands."
  
  - question: "What are some facts about the Arkansas state tree?"
    answer: "The Pine Tree designation covers four native species rather than one specific tree. Arkansas has over 2.4 billion pine trees. The Morris Pine in Ashley County is over 300 years old. Loblolly pine can grow 2 feet per year. Over 83 percent of Arkansas's saw timber is pine, oak, and gum."
  
  - question: "How do you recognize Arkansas pine trees?"
    answer: "Look for reddish-brown bark with deep furrows, needles bundled in groups of two or three, and straight trunks with pyramidal crowns when young. The needles stay dark green year-round. Cones hang from upper branches. Dead needles accumulate beneath the trees."

