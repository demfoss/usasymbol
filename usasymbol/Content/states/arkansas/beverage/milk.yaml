seo_title: 'Arkansas State Beverage: Why Milk, Not Grapette'
seo_description: Milk is the official state beverage of Arkansas, designated in 1985. Learn why dairy economics won out — and why Grapette, the grape soda born in Camden, has never made the official list.
intro_text: '**Milk is the official state beverage of Arkansas**, designated by the General Assembly in 1985. The vote was unanimous, the rationale was agricultural, and the result was the same answer more than forty other states have landed on. The drink Arkansas is actually famous for — the grape soda that went from a small factory in Camden to grocery shelves across the South and beyond — is not on the list at all. See the [full list of Arkansas state symbols](/states/arkansas).'
