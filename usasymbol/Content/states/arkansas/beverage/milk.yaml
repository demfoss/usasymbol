sections:
- id: answer-fast
  icon: fa-solid fa-circle-info
  title: 'Arkansas State Beverage: Milk Since 1985'
  paragraphs:
  - 'Milk is the state beverage. The Arkansas General Assembly designated it in 1985 — unopposed, on three stated grounds: it promotes health, the state wants people to drink more of it, and dairy farming matters to the rural economy. The law specifies no grade or type; the designation covers milk broadly.'
- id: why-milk
  icon: fa-solid fa-bullseye
  title: Why the Arkansas Legislature Chose Milk in 1985
  paragraphs:
  - 'The case for milk sounds almost identical to what other state legislatures said when they made the same choice: it''s healthy, we want people to drink more of it, and dairy is an industry worth acknowledging. That last reason was the real one. Arkansas dairy farming in the 1980s wasn''t a heritage gesture — it was a live operation with working farms, rural payroll, and money moving through small communities that had few other anchors.'
  - The representative who carried the bill, Bobby Glover of the Seventy-second District, framed it in economic terms. Dairy wasn't the face of Arkansas agriculture — cotton and rice carried most of that — but it was present enough that a designation made sense as recognition, not just decoration.
- id: grapette
  icon: fa-solid fa-bottle-water
  title: 'Grapette: Why Arkansas''s Most Distinctive Drink Has No Official Title'
  paragraphs:
  - Grapette is a grape soda created in Camden, Arkansas in 1939, and it is probably the most distinctly Arkansas drink in existence. It was built to compete directly with Coca-Cola — smaller bottle, lower price, a grape flavor with no national rival at the time. It worked. By mid-century, Grapette was moving through the American South and onto international markets — a reach no one would have predicted from a soft drink operation in a small Ouachita County city.
  - Camden wasn't a place that exported much beyond timber and chemicals. Grapette was the exception — a Camden-born product that found markets from the rural South to international shelves, changed hands as the industry consolidated, and still exists today.
  - 'None of that earned it a state designation. Grapette doesn''t appear on the [Arkansas state symbols](/states/arkansas) list, and no serious push to add it was recorded when the 1985 designation was made. Milk won on economic logic. Grapette won something harder to legislate: the kind of specific regional loyalty that official symbols rarely capture and can never manufacture.'
timeline:
- year: '1939'
  description: Grapette grape soda is created in Camden, Arkansas. Designed to compete with Coca-Cola on price and flavor, it will distribute across the South and internationally — without ever holding an official state designation.
- year: '1985'
  description: Representative Bobby Glover sponsors legislation to designate milk as Arkansas's official state beverage, on grounds of health promotion and dairy industry economics.
- year: June 28, 1985
  description: Act 998 takes effect. Milk becomes the official state beverage of Arkansas — unopposed in both chambers.
faq:
- question: What is the official state beverage of Arkansas?
  answer: Milk. The Arkansas General Assembly designated it in 1985 on health and economic grounds. The designation has not changed.
- question: Why did Arkansas choose milk as its state beverage?
  answer: 'The legislature cited three reasons: health benefits, a desire to encourage consumption, and the economic importance of dairy farming to the state''s rural economy. The bill met no recorded opposition.'
- question: Is Grapette the official state beverage of Arkansas?
  answer: No. Grapette was created in Camden, Arkansas in 1939 and has deep Arkansas roots, but it holds no official state designation. The official state beverage is milk.
- question: What type of milk does the designation cover?
  answer: The law specifies no grade or type — whole, skim, two percent, none of these distinctions appear in the statute. The designation covers milk broadly.
- question: When did Arkansas designate its official state beverage?
  answer: In 1985. The effective date was June 28, 1985.
- question: Who introduced the Arkansas state beverage bill?
  answer: Representative Bobby Glover of the Seventy-second District sponsored the legislation in the Arkansas General Assembly.
- question: Where was Grapette created?
  answer: Camden, Arkansas, in 1939. It was built to compete with Coca-Cola on price, distributed widely across the South and internationally, and still exists under the Grapette name. It has never held an official Arkansas state designation.
