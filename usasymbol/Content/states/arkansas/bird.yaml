seo_title: "Arkansas State Bird | Northern Mockingbird"
seo_description: Arkansas adopted the mockingbird as its state bird in 1929. Learn why it was chosen, who pushed the campaign, and how the law still describes it.
intro_text: "Arkansas's official state bird is the <strong>mockingbird</strong>, now usually identified as the <strong>Northern Mockingbird</strong>, and the designation dates to <strong>1929</strong>. The unusual part is how the symbol got there: House Concurrent Resolution No. 22 followed a campaign backed by the Arkansas State Federation of Women's Clubs. Historical accounts say the proposal first met skepticism and gained support only after speeches stressed how familiar and useful the bird was around farms and towns."
