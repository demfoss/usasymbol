title: "Arkansaurus fridayi"
adopted_year: 2017
legislation: "Arkansas Act 840 of 2017"
meaning: "Arkansas designated its state dinosaur in 2017 — before the animal had even been formally described. For two years, Arkansas had an official prehistoric symbol with no scientific name, no complete description in the literature, and no formal classification. That anomaly says something real about both the legislative process and the slow pace of paleontological publishing."
scientific_name: "Arkansaurus fridayi"
