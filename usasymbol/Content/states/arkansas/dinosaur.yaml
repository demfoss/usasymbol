faq:
  - question: "What is Arkansas's state dinosaur?"
    answer: "Arkansas designated its state dinosaur before the animal was formally published in the scientific literature. Act 840 in 2017 named Arkansaurus fridayi as the official state dinosaur; the peer-reviewed description didn't appear until 2019. It's based on fragmentary foot bones found near Nashville in Howard County in 1972 — material that spent decades at the Arkansas State University Museum of Science and Natural History in Jonesboro before researchers formally described it."

  - question: "Who found Arkansaurus?"
    answer: "James Friday discovered the bones in 1972 near Nashville, Arkansas. The species name fridayi honors him directly."

  - question: "What kind of dinosaur was Arkansaurus?"
    answer: "Arkansaurus is tentatively classified as an ornithomimosaur or close relative — a lightly built bipedal theropod. This classification is based on fragmentary foot bones and is considered provisional; more complete material would be needed to confirm the placement."

  - question: "Why was Arkansas's state dinosaur designated before it was formally named?"
    answer: "The 2017 state designation used the informal name that was in use within the paleontological community. The formal scientific publication that establishes a name in taxonomic nomenclature didn't appear until 2019. Legislative timelines and scientific publishing timelines don't always match — in this case, the law moved faster."

  - question: "Is Arkansaurus the only dinosaur found in Arkansas?"
    answer: "Arkansaurus fridayi is the only dinosaur formally named from Arkansas fossils. The state's geological history — with significant Cretaceous marine coverage and limited surveyed continental deposits — makes terrestrial dinosaur preservation unusual. The Trinity Group near Nashville is one of the few Early Cretaceous continental windows in the state."

