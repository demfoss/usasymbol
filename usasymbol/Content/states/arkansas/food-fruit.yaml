sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Arkansas's State Fruit?"
    paragraphs:
      - "The South Arkansas Vine Ripe Pink Tomato is Arkansas's official state fruit, designated by the Arkansas General Assembly in 1987. It is grown mainly in Bradley County in the southern part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the South Arkansas Vine Ripe Pink Tomato"
    paragraphs:
      - "This tomato variety has pink-red skin and is prized for its sweet, mild flavor. It grows in the sandy loam soil of south Arkansas, which farmers say produces a tomato with fewer acids and a softer bite than tomatoes grown elsewhere."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the South Arkansas Vine Ripe Pink Tomato Became Arkansas's State Fruit"
    paragraphs:
      - "The Arkansas General Assembly designated the South Arkansas Vine Ripe Pink Tomato the official state fruit in 1987."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Arkansas Chose the South Arkansas Vine Ripe Pink Tomato"
    paragraphs:
      - "Bradley County has grown pink tomatoes commercially for decades, and the crop is closely tied to the town of Warren, which holds an annual Pink Tomato Festival celebrating the local harvest."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the South Arkansas Vine Ripe Pink Tomato Comes From in Arkansas"
    paragraphs:
      - "Bradley County, in south Arkansas, is the state's best-known pink tomato growing region. The county seat, Warren, hosts the Bradley County Pink Tomato Festival each June."
