sections:
  - id: overview
    icon: fa-solid fa-music
    title: Arkansas State Song
    paragraphs:
      - "\"Arkansas,\" written and composed by Eva Ware Barnett, became Arkansas's official state song in 1917. The 1987 legislature raised it to State Anthem status and adopted three additional official songs alongside it, but Barnett's remains the original."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Arkansas\" Explained"
    paragraphs:
      - "The song describes Arkansas as a fertile, flower-covered land that opens its arms to welcome its people home. Its tone is warm and pastoral, built as a formal anthem rather than a folk tune or march."
      - "Eva Ware Barnett, a classically trained composer who taught music at Ouachita Baptist College in Arkadelphia, wrote both the words and the music and published the song in 1916. It quickly found an audience with the state's music clubs and school choirs, who performed it widely in the years before its official adoption."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Arkansas" Represents Arkansas
    paragraphs:
      - "Lawmakers adopted Barnett's song in 1917 because it had already won over Arkansas audiences through sheet music sales and performances by school and civic groups. Its warm, welcoming portrayal of the state matched how Arkansans wanted outsiders to see their home."
      - "The song's staying power carried it through the twentieth century largely unchallenged. By 1940 the Arkansas Secretary of State's office had distributed roughly 60,000 copies of its lyrics and music, keeping it in circulation in schools decades after its adoption."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Arkansas\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Arkansas" Became Arkansas's State Song
    paragraphs:
      - "The Arkansas Legislature designated Barnett's \"Arkansas\" the official state song in 1917, the year after she published it. Seventy years later, in 1987, lawmakers elevated it to State Anthem and simultaneously adopted \"Arkansas (You Run Deep in Me),\" \"Oh, Arkansas,\" and \"Arkansas Traveler\" as companion official songs, rather than replacing Barnett's original."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Arkansas

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Arkansas\" Facts"
    facts:
      - "Arkansas adopted Eva Ware Barnett's \"Arkansas\" as its official state song in 1917."
      - "Barnett wrote both the words and music, and taught at Ouachita Baptist College in Arkadelphia."
      - "In 1987 the legislature elevated the song to State Anthem and added three more official songs."
      - "The Arkansas Secretary of State distributed about 60,000 copies of the song's lyrics and music by 1940."

