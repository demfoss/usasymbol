faq:
  - question: What is Arkansas's state song?
    answer: "Arkansas's state song is \"Arkansas,\" written by Eva Ware Barnett and adopted in 1917."
  - question: Who wrote Arkansas's state song?
    answer: "Eva Ware Barnett wrote both the words and music, publishing the song in 1916."
  - question: When did Arkansas adopt "Arkansas" as its state song?
    answer: "The legislature adopted it in 1917 and elevated it to State Anthem status in 1987."
  - question: Does Arkansas have more than one official song?
    answer: "Yes. Arkansas also recognizes \"Arkansas (You Run Deep in Me),\" \"Oh, Arkansas,\" and \"Arkansas Traveler\" as official songs."

