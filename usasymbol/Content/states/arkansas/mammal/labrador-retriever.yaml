title: "Siberian Husky"
scientific_name: "Canis lupus familiaris"
adopted_year: 2024

seo_title: "Connecticut State Dog - Siberian Husky | Official"
seo_description: "Connecticut designated the Siberian Husky as state dog in 2024. The breed honors a heroic 1925 serum run where Connecticut-raised sled dogs saved lives."

intro_text: "Connecticut's state dog is the Siberian Husky, designated in 2024. The breed honors the 1925 serum run to Nome, Alaska, where sled dogs delivered life-saving diphtheria medicine across 674 miles of frozen wilderness. Connecticut-bred huskies played a crucial role in that mission, connecting the state to one of history's greatest dog sled rescues, and the breed is often referenced in the [list of U.S. state dogs](/symbols/dogs)."

common_name: "Siberian Husky"
official_since: "2024"
