faq:
  - question: "What is Connecticut's state dog?"
    answer: "Connecticut's state dog is the Siberian Husky, designated by the Connecticut General Assembly in 2024. The breed was chosen to honor Connecticut's connection to the 1925 serum run to Nome, Alaska, when sled dogs delivered life-saving diphtheria medicine."

  - question: "Why did Connecticut choose the Siberian Husky as the state dog?"
    answer: "Connecticut chose the Siberian Husky because of Elizabeth Ricker's Poland Spring kennels in Connecticut. Ricker bred and trained Siberian Huskies in the early 1900s, and several of her dogs participated in the famous 1925 serum run to Nome. The designation honors both the breed and Connecticut's overlooked role in that historic rescue."

  - question: "When was the Siberian Husky designated as Connecticut's state dog?"
    answer: "The Siberian Husky was designated as Connecticut's official state dog on May 9, 2024, when Governor Ned Lamont signed Public Act 24-16 into law."

  - question: "What was the 1925 serum run to Nome?"
    answer: "The 1925 serum run was a relay of dog sled teams that carried diphtheria medicine 674 miles from Nenana to Nome, Alaska, in five and a half days. The mission took place in January during brutal weather conditions with temperatures dropping to 50 degrees below zero. Over 150 sled dogs participated, including several Connecticut-bred Siberian Huskies from Elizabeth Ricker's kennels."

  - question: "Who was Elizabeth Ricker?"
    answer: "Elizabeth Ricker operated Poland Spring kennels in Connecticut in the early 1900s. She became one of America's premier Siberian Husky breeders, importing dogs from Siberia and breeding them for sled racing and Arctic work. Several of Ricker's dogs participated in the 1925 serum run to Nome, connecting Connecticut to one of history's most famous dog sled rescues."

  - question: "Are Siberian Huskies good pets for Connecticut's climate?"
    answer: "Siberian Huskies handle Connecticut winters well because of their thick double coat. However, they require careful management during hot summer months to prevent overheating. The breed needs substantial daily exercise regardless of weather and should not be left outside in summer heat without shade and water."

  - question: "Where can I learn more about Connecticut's connection to the 1925 serum run?"
    answer: "The Connecticut State Library in Hartford houses historical documents and photographs related to Elizabeth Ricker and Poland Spring kennels. Local historical societies in northeastern Connecticut maintain records of the region's sled dog history. The Connecticut Sled Dog Club hosts events where you can meet Siberian Huskies and learn about the breed's working heritage."

  - question: "What does the Siberian Husky represent for Connecticut?"
    answer: "The Siberian Husky represents courage, endurance, and Connecticut's unexpected contribution to American history. The breed symbolizes the working partnership between humans and dogs and honors Elizabeth Ricker's dedication to breeding and promoting Siberian Huskies in the early 1900s."

