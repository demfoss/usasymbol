faq:
  - question: "What is Arkansas's state dog?"
    answer: "Arkansas's state dog is the Labrador Retriever, designated in 2025."
  - question: "Why did Arkansas choose the Labrador Retriever?"
    answer: "Arkansas chose the Labrador Retriever because the breed fits the state's duck hunting culture, outdoor heritage, family life, and service-dog traditions."
  - question: "Is the Labrador Retriever Arkansas's state mammal?"
    answer: "No. The Labrador Retriever is Arkansas's state dog. Arkansas's state mammal is the white-tailed deer."
  - question: "Which state has the Labrador Retriever as its state dog?"
    answer: "Arkansas has the Labrador Retriever as its official state dog."

