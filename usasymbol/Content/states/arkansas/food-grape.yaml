intro_text: "Arkansas's state grape is the Cynthiana, a variety of Vitis aestivalis, adopted in 2009 to recognize a grape long grown in the state's Ozark and Arkansas River Valley wine country. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Arkansas's State Grape?"
    paragraphs:
      - "The Cynthiana, also known as Norton, is Arkansas's official state grape, designated by the Arkansas General Assembly in 2009. It is a native American grape species grown for wine across parts of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Cynthiana Grape"
    paragraphs:
      - "Cynthiana is a small, dark purple grape belonging to the species Vitis aestivalis, native to North America. It produces a deep red wine with a tart, earthy flavor and is valued for resisting many of the diseases that affect European grape varieties."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Cynthiana Became Arkansas's State Grape"
    paragraphs:
      - "The Arkansas General Assembly designated the Cynthiana the official state grape in 2009."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Arkansas Chose the Cynthiana"
    paragraphs:
      - "Arkansas has a long winemaking history centered on the Altus area in the Arkansas River Valley, where German and Swiss immigrant families planted vineyards in the late 1800s, and Cynthiana remains a signature grape for the state's wineries."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Cynthiana Comes From in Arkansas"
    paragraphs:
      - "Altus, in the Arkansas River Valley, is the center of Arkansas's wine industry and home to several wineries that grow Cynthiana grapes."
