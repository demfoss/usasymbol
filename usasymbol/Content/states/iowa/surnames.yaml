    origin: english
    type: Habitational
    meaning: "From Old English mōr, denoting someone living near a moor or boggy ground. Moore arrived in Iowa primarily with Scots-Irish migrants from Appalachian states who followed the Ohio River west into the Mississippi valley."

  - rank: 15
