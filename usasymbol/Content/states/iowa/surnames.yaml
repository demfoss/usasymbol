    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' from the Hebrew Yohanan. Scandinavian immigrants anglicized the equivalent Jonsson to Johnson, boosting its Iowa count significantly during the 1870s–1890s settlement wave."

