    origin: english
    type: Patronymic
    meaning: "Means 'son of Andrew,' from the Greek Andreas. Norwegian and Swedish settlers brought Andersen and Andersson into Iowa during the late 1800s, concentrating especially around Decorah in Winneshiek County."

