    ratio: 525
    origin: english
    type: Occupational
    meaning: "From Old English clerc, denoting a clerk or scholar, often a parish record-keeper. Clark spread through Iowa's courthouse towns as the state formalized county government throughout the 1840s and 1850s."

  - rank: 17
    name: "Larson"
    count: 5800
    ratio: 525
    origin: english
    type: Patronymic
    meaning: "The anglicized form of Scandinavian Larsen or Larsson, meaning 'son of Lars.' Swedish and Norwegian immigrants brought Larson into northwest Iowa counties around Sioux City during the 1880s railroad expansion era."

  - rank: 18
    name: "White"
    count: 5500
    ratio: 554
    origin: english
    type: Descriptive
    meaning: "A nickname for someone with fair hair or complexion, from Old English hwīt. White came to Iowa with American-born migrants from the Upper South and Mid-Atlantic who settled the mixed-farming counties of central Iowa."

  - rank: 19
