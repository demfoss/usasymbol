seo:
  title: "Most Common Last Names in Iowa"
  description: "Smith is Iowa's most common last name, while Miller ranks unusually high thanks to German settlement in river counties."

page:
  h1: "Most Common Last Names in Iowa"
  intro: "Miller ranks third in Iowa — higher than in any other state — because German immigrants named Müller flooded eastern Iowa's river-bottom counties from the 1840s and anglicized the name within a single generation. Anderson sits at fourth, pressed there by Norwegian Andersens from Decorah and Swedish Anderssons from Winneshiek County."
  heritage_title: "German, Scandinavian, and Czech Roots"
  heritage_body: "German families flooded eastern Iowa and the Des Moines corridor from the 1840s onward, making Miller and surnames like Kruse enduringly common. Danish settlers founded tight-knit communities in Elk Horn and Kimballton by the 1870s, anchoring Hansen and Larsen. Czech immigrants concentrated in Cedar Rapids by the 1880s, leaving a lasting mark on surnames like Dvorak."
  fun_fact: "Iowa's Elk Horn is home to the largest Danish immigrant settlement in the United States, which is why Danish-origin surnames like Hansen rank far higher here than in most other states."

surnames:
