    count: 5500
    ratio: 554
    origin: english
    type: Patronymic
    meaning: "Means 'son of Peter,' anglicized from Scandinavian Petersen or Petersson. Swedish settlers concentrated in Polk County and around Des Moines's north side carried Peterson into Iowa's urban surname rolls by the 1890s."

  - rank: 20
    name: "Harris"
    count: 5200
    ratio: 586
    origin: english
    type: Patronymic
    meaning: "Means 'son of Harry,' a medieval English form of Henry. Harris families were among the early American-born settlers of Muscatine and Scott counties along the Mississippi, arriving during Iowa's first settlement wave of the 1830s."

unique_surnames:
  - name: "Dvorak"
    state_rank: 450
    national_rank: 3500
    origin: other
    why: "Czech immigrants who settled Cedar Rapids's Czech Village neighborhood beginning in the 1870s made this Bohemian surname far more common in Iowa than anywhere else in the Midwest. Linn County remains its stronghold today."

  - name: "Kruse"
    state_rank: 380
    national_rank: 2000
    origin: german
    why: "Low German in origin, Kruse was carried into western and central Iowa by settlers from Schleswig-Holstein and Westphalia from the 1860s onward, with heavy concentrations in Carroll and Sac counties."

  - name: "Vande Berg"
    state_rank: 520
    national_rank: 4500 # UNVERIFIED
    origin: dutch
    why: "Dutch settlers who founded the Reformed Church community in Pella and later Orange City brought Vande Berg and related Vander- surnames into Iowa; Marion and Sioux counties still show the densest concentrations."

etymology_groups:
  - type: "Scandinavian Patronymics"
    icon: fa-solid fa-anchor
    description: "Iowa's Danish settlement in Shelby County and Norwegian enclave around Decorah drove surnames like Hansen, Nelson, Anderson, Larson, and Peterson well above their national frequencies. The -son and -sen endings mark a direct patronymic tradition immigrants carried from Scandinavia in the 1870s–1890s."
    examples:
      - Hansen (son of Hans)
      - Nelson (son of Neil/Nils)
      - Anderson (son of Andrew/Anders)
      - Larson (son of Lars)
      - Peterson (son of Peter)

  - type: "English & German Occupational Names"
    icon: fa-solid fa-hammer
    description: "Blacksmiths, millers, tailors, and clerks gave Iowa some of its most persistent surnames. German Müller became Miller, while Smith, Taylor, and Clark spread with the frontier economy that built Iowa's county seats from the 1840s onward."
    examples:
      - Smith (metalworker)
      - Miller (grain miller / German Müller)
      - Taylor (cloth cutter)
      - Clark (clerk/scholar)

  - type: "Czech & Dutch Heritage Names"
    icon: fa-solid fa-church
    description: "Cedar Rapids's Czech Village gave Iowa one of the country's most concentrated pockets of Czech surnames, led by Dvorak. Dutch Reformed settlers in Pella and Orange City seeded Marion and Sioux counties with Vande Berg and related compound surnames."
    examples:
      - Dvorak (Czech: one who lives near a manor farm)
      - Vande Berg (Dutch: from the hill)
      - Kopriva (Czech: nettle plant)

faq:
  - question: "What are the most common last names in Iowa?"
    answer: "The most common last names in Iowa are Smith, Johnson, Miller, Anderson, and Brown. Iowa's top ranks reflect a mix of English-origin names and the strong imprint of German and Scandinavian farm settlement."

  - question: "Why are Scandinavian surnames so common in Iowa?"
    answer: "Danish settlers founded tight-knit communities in Elk Horn and Kimballton in Shelby County from the 1870s onward, while Norwegians clustered around Decorah in Winneshiek County. These concentrated communities kept surnames like Hansen, Nelson, and Larson consistently high among popular last names in Iowa compared to most other Midwestern states."

  - question: "Why is Miller so common in Iowa?"
    answer: "Miller ranks unusually high in Iowa because many German families named Müller anglicized the name after settling in the state during the 1800s. That German farming settlement pattern reinforced an already common English occupational surname."

