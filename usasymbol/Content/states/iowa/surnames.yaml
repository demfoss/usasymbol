seo:
  title: "Is Your Last Name Common in Iowa? Miller, Anderson & More"
  description: "Smith is the most common last name in Iowa, but Miller ranks third — highest of any state — German Müllers flooded the river counties from the 1840s."

page:
  h1: "Most Common Last Names in Iowa"
  intro: "Miller ranks third in Iowa — higher than in any other state — because German immigrants named Müller flooded eastern Iowa's river-bottom counties from the 1840s and anglicized the name within a single generation. Anderson sits at fourth, pressed there by Norwegian Andersens from Decorah and Swedish Anderssons from Winneshiek County."
  heritage_title: "German, Scandinavian, and Czech Roots"
  heritage_body: "German families flooded eastern Iowa and the Des Moines corridor from the 1840s onward, making Miller and surnames like Kruse enduringly common. Danish settlers founded tight-knit communities in Elk Horn and Kimballton by the 1870s, anchoring Hansen and Larsen. Czech immigrants concentrated in Cedar Rapids by the 1880s, leaving a lasting mark on surnames like Dvorak."
  fun_fact: "Iowa's Elk Horn is home to the largest Danish immigrant settlement in the United States, which is why Danish-origin surnames like Hansen rank far higher here than in most other states."

surnames:
  - rank: 1
    name: "Smith"
    count: 25900
    ratio: 118
    origin: english
    type: Occupational
    meaning: "Derived from Old English smið, denoting a metalworker or blacksmith. Smith spread across rural Iowa with the 19th-century farm economy, where blacksmiths were indispensable in every county seat."

  - rank: 2
    name: "Johnson"
    count: 22800
    ratio: 134
    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' from the Hebrew Yohanan. Scandinavian immigrants anglicized the equivalent Jonsson to Johnson, boosting its Iowa count significantly during the 1870s–1890s settlement wave."

  - rank: 3
    name: "Miller"
    count: 19200
    ratio: 159
    origin: english
    type: Occupational
    meaning: "Occupational name for a grain mill operator, rooted in Old English mylenweard. It ranks higher in Iowa than nationally because German immigrants named Müller—anglicized to Miller—settled the fertile eastern counties heavily from the 1840s onward."

  - rank: 4
    name: "Anderson"
    count: 15200
    ratio: 200
    origin: english
    type: Patronymic
    meaning: "Means 'son of Andrew,' from the Greek Andreas. Norwegian and Swedish settlers brought Andersen and Andersson into Iowa during the late 1800s, concentrating especially around Decorah in Winneshiek County."

  - rank: 5
    name: "Brown"
    count: 13400
    ratio: 227
    origin: english
    type: Descriptive
    meaning: "A nickname for someone with brown hair or complexion, from Old English brún. Brown arrived with early American-born settlers migrating west from Ohio, Indiana, and Kentucky into Iowa from the 1830s onward."

  - rank: 6
    name: "Williams"
    count: 12200
    ratio: 250
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of William,' from the Germanic Wilhelm. Williams traveled into Iowa with American-born migrants from border states settling the Des Moines River valley in the mid-1800s."

  - rank: 7
    name: "Wilson"
    count: 11900
    ratio: 256
    origin: english
    type: Patronymic
    meaning: "Means 'son of Will,' a short form of William. Early British settlers carried Wilson into Iowa's first counties along the Mississippi corridor, and it has remained a consistent top-ten name ever since."

  - rank: 8
    name: "Jones"
    count: 10400
    ratio: 293
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of John,' from the Welsh Ieuan. Welsh and English families named Jones settled along the Iowa-Illinois border in river communities like Burlington early in the territorial period."

  - rank: 9
    name: "Davis"
    count: 10100
    ratio: 302
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of David,' from the Hebrew Dawid. Davis County in southern Iowa was named for Jefferson Davis, and the surname was common among American settlers who homesteaded the region in the 1840s."

  - rank: 10
    name: "Nelson"
    count: 9100
    ratio: 335
    origin: english
    type: Patronymic
    meaning: "Means 'son of Neil' or 'son of Nils,' with deep Scandinavian roots via Nilsson. Norwegian settlers around Decorah and the Story City area drove Iowa's Nelson count well above the national average."

  - rank: 11
    name: "Hansen"
    count: 8800
    ratio: 346
    origin: english
    type: Patronymic
    meaning: "Means 'son of Hans,' the Danish and Norwegian form of John. Iowa's large Danish communities in Shelby County—centered on Elk Horn and Kimballton—make Hansen far more prevalent here than in most Midwestern states."

  - rank: 12
    name: "Thompson"
    count: 8200
    ratio: 371
    origin: english
    type: Patronymic
    meaning: "Means 'son of Thomas,' from the Aramaic T'oma. British and Scots-Irish settlers carried Thompson across Iowa's early river towns like Dubuque and Davenport during the territorial era of the 1830s and 1840s."

