seo_title: "Iowa License Plate Slogan | The Corn State"
seo_description: "The Corn State appeared on Iowa license plates only in 1953 and remains the state's lone standard plate slogan."
hero_image: /images/license-plates/iowa/iowa-corn-state-plate.webp
hero_image_alt: 1953 Iowa license plate with The Corn State slogan
hero_image_caption: Iowa's 1953 passenger plate carried "The Corn State," the only confirmed slogan Iowa has used on a general-issue license plate.
intro_text: '**"The Corn State"** appeared on Iowa license plates in 1953, and that single year is the important fact. Unlike states with long-running plate slogans, Iowa has not kept a recurring slogan on its general-issue passenger plates. License Plate Room identifies 1953 as the first and, so far, only time Iowa included a slogan on a license plate.'
quick_answer: "Iowa used \"The Corn State\" on its 1953 general-issue passenger license plate. It is the only confirmed Iowa plate slogan in License Plate Room's slogan chronology. Iowa's better-known nickname, \"The Hawkeye State,\" is a state identity, but it is not part of a recurring Iowa plate-slogan streak."
