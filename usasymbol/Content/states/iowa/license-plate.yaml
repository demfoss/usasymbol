- id: why-only-once
  icon: fa-solid fa-rotate
  title: Why One Year Matters
  paragraphs:
  - 'A one-year slogan can be more useful historically than a permanent slogan because it shows a state testing an identity. In 1953, Iowa chose the agricultural identity that outsiders already associated with the state.'
  - 'The choice did not become permanent. Iowa kept its Hawkeye nickname in broader state identity and its corn reputation in agriculture, but the plate itself did not settle into a slogan streak.'
  - 'That makes Iowa different from neighboring Illinois, which has used "Land of Lincoln" continuously since 1954, and Idaho, which kept "Famous Potatoes" after 1957.'

timeline:
- year: '1838'
  description: Journalist James Edwards promotes "Hawkeye" as a name for Iowa Territory residents, helping establish Iowa's best-known nickname before statehood.
- year: '1846'
  description: Iowa enters the Union on December 28 as the 29th state.
- year: '1953'
  description: Iowa includes "THE CORN STATE" on a general-issue passenger license plate — the first and, so far, only confirmed Iowa plate slogan.
- year: Present
  description: Iowa continues to be identified strongly with corn production and the Hawkeye nickname, but it does not have a long-running general-issue plate slogan.

faq:
- question: What is Iowa's license plate slogan?
  answer: Iowa's confirmed license plate slogan is "The Corn State," used on the 1953 general-issue passenger plate. License Plate Room identifies that as the first and, so far, only Iowa plate slogan.
- question: Did Iowa use "The Hawkeye State" on license plates?
  answer: '"The Hawkeye State" is Iowa''s official nickname and a major part of Iowa identity, but it is not listed as Iowa''s recurring general-issue plate slogan in License Plate Room''s slogan chronology.'
- question: Why did Iowa use "The Corn State"?
  answer: The phrase reflected Iowa's agricultural identity. Iowa has long ranked among the leading U.S. corn-producing states, and corn is one of the most visible features of the state's rural landscape.
- question: When did Iowa use "The Corn State" on plates?
  answer: Iowa used "The Corn State" on its 1953 passenger license plate.
- question: Does Iowa have a long-running plate slogan?
  answer: 'No. Unlike states with continuous slogans, Iowa has only one confirmed general-issue slogan use: "The Corn State" in 1953.'

