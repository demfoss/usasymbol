seo_title: "Iowa State Motto | Our Liberties We Prize"
seo_description: "Iowa's state motto, \"Our Liberties We Prize And Our Rights We Will Maintain,\" is the longest of any U.S. state. Adopted by the General Assembly in 1847."

intro_text: "Iowa's state motto is <strong>Our Liberties We Prize And Our Rights We Will Maintain</strong>, the longest state motto in the United States. It was adopted 58 days after Iowa became the 29th state on December 28, 1846, and has appeared on the state seal since 1847 and on the Iowa state flag since 1921."

