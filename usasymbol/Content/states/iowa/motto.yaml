faq:
  - question: "What is Iowa's state motto?"
    answer: "Iowa's state motto is \"Our Liberties We Prize And Our Rights We Will Maintain.\" It is the longest state motto in the United States and was adopted by the first Iowa General Assembly in 1847, just 58 days after Iowa became the 29th state on December 28, 1846."

  - question: "What does Iowa's state motto mean?"
    answer: "The motto is a two-part declaration. \"Our Liberties We Prize\" states that Iowa's citizens highly value their civil liberties. \"Our Rights We Will Maintain\" commits them to actively defending those rights. The first-person plural voice makes it a statement from the people of Iowa, not from the state government."

  - question: "Why is Iowa's state motto the longest in the U.S.?"
    answer: "Iowa's motto is 53 characters long, which makes it longer than any other U.S. state motto. No single reason is documented for why the first General Assembly chose such a long phrase. The language reflects a frontier-era directness: a full statement of values rather than a short Latin phrase or single word."

  - question: "When did Iowa adopt its state motto?"
    answer: "Iowa adopted its state motto in 1847, as part of the Great Seal authorization by the first Iowa General Assembly. Iowa became a state on December 28, 1846, and the motto was adopted 58 days later."

  - question: "Where does Iowa's motto appear?"
    answer: "The motto appears on a scroll held by the bald eagle on the Great Seal of Iowa, and on the Iowa state flag. The flag, designed by Dixie Cornell Gebhardt in 1921, shows the eagle carrying a blue scroll with the full motto text. Both the seal and the flag are governed by Iowa Code § 1.8."

