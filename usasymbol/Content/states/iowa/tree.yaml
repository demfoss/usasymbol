type: State Tree
state: Iowa
name: Oak
scientific_name: Quercus spp.
adopted_year: 1961
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-24"
seo_title: "Iowa State Tree: Oak - Genus Designation Without Specific Species"
seo_description: "Iowa proclaimed Oak as state tree in 1961 without designating a specific species. Learn about Iowa's 12 native oak species and the genus-level designation."

intro_text: "Oak has been Iowa's state tree since 1961. Governor Norman A. Erbe signed the bill on March 13, 1961. The legislature designated 'Oak' at genus level without specifying a species. Iowa has 12 native oak species. Bur oak is commonly recognized since it grows in all 102 counties, and this broad approach is often compared on the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Iowa State Tree?"
    paragraphs:
      - "Oak is Iowa's official state tree. The legislature designated the genus Quercus without naming a specific oak species. This makes Iowa unusual among U.S. states. Most states specify a particular species for their state tree, unlike Iowa's broader ecosystem framing seen with [Iowa's state flower, the Wild Prairie Rose](/states/iowa/flower/wild-prairie-rose)."
      - "Twelve oak species grow native in Iowa. These include white oak, bur oak, red oak, pin oak, black oak, chinkapin oak, swamp white oak, and others. All twelve species technically represent Iowa's state tree."
      - "Bur oak is commonly recognized as Iowa's state tree. It is the only oak species found throughout all 102 Iowa counties. Many people consider it the unofficial representative of Iowa's oak designation."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Iowa State Tree Name"
    paragraphs:
      - "The common name is simply Oak. The scientific designation is Quercus spp., where 'spp.' indicates multiple species. This genus-level designation differs from typical state tree laws."
      - "The bur oak, often considered Iowa's representative oak, is scientifically named Quercus macrocarpa. Other common Iowa oaks include white oak (Quercus alba), red oak (Quercus rubra), and pin oak (Quercus palustris)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Oak Became Iowa's State Tree"
    paragraphs:
      - "Iowa's path to adopting a state tree involved two legislative attempts. In 1959, House Joint Resolution No. 5 proposed designating bur oak (Quercus macrocarpa) specifically. The resolution got stuck in committee. When the Legislature adjourned on May 7, 1959, the bur oak proposal died."
      - "Two years later, a different approach succeeded. House Joint Resolution No. 10 proposed designating 'THE OAK' without specifying a species. The 59th Iowa General Assembly passed this broader designation. Governor Norman A. Erbe signed it on March 13, 1961."
      - "The legislature chose oak for its abundance and wildlife value. The official statement: 'The Iowa General Assembly chose the oak because it is abundant and serves as shelter, food and nesting cover for many animals and birds.' No species was named, avoiding the controversy that blocked the 1959 attempt and aligning with values expressed in [Iowa's state motto](/states/iowa/motto/our-liberties-we-prize-and-our-rights-we-will-maintain)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Iowa State Tree Facts"
    facts:
      - "Iowa designated 'Oak' at genus level without specifying species (Quercus spp.)"
      - "Twelve oak species grow native in Iowa"
      - "Bur oak is the only oak found in all 102 Iowa counties"
      - "1959 attempt to designate bur oak specifically failed in committee"
      - "Oak is also the national tree of the United States"

  - id: twelve-species
    icon: "fa-solid fa-tree"
    title: "Iowa's Twelve Native Oak Species"
    paragraphs:
      - "Iowa's native oaks divide into two groups: white oaks and red oaks. White oaks include white oak, bur oak, chinkapin oak, dwarf chinkapin oak, swamp white oak, and post oak. These have rounded leaf lobes and acorns that mature in one season."
      - "Red oaks include red oak, pin oak, black oak, northern pin oak, shingle oak, and blackjack oak. These have pointed, bristle-tipped leaf lobes. Their acorns require two seasons to mature."
      - "Bur oak grows throughout the entire state. White oak is found in the eastern two-thirds. Pin oak is native to the southeast quarter. Post oak appears only in four counties, making it the rarest."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Iowa State Tree and Flower"
    paragraphs:
      - "Iowa's state flower is the Wild Rose, designated in 1897. The legislature chose wild rose after it appeared on silver service presented to the battleship USS Iowa in 1896. Like the state tree, no specific rose species was designated. The Wild Prairie Rose (Rosa pratincola) is most commonly recognized, and the same landscapes support [Iowa's state bird, the American Goldfinch](/states/iowa/bird/american-goldfinch)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize Oak Trees"
    paragraphs:
      - "Oak leaves are the primary identification feature. White oaks have rounded lobes without bristles. Red oaks have pointed lobes with bristles at the tips. Bur oak leaves have the deepest lobes, sometimes cut nearly to the midrib."
      - "Acorns distinguish oaks from all other trees. White oak acorns have caps covering one-quarter to one-third of the nut. Bur oak acorns have distinctive fringed caps. Red oak acorns have flatter caps and take two years to mature."
      - "Bark varies by species. Bur oak develops deeply furrowed, ridged bark. White oak has light gray bark with scaly ridges. Pin oak bark stays relatively smooth longer. Black oak has dark, blocky bark."

  - id: uses
    icon: "fa-solid fa-paw"
    title: "Wildlife Importance"
    paragraphs:
      - "Oak acorns provide crucial food for Iowa wildlife. Deer, wild turkeys, pheasants, quail, wood ducks, raccoons, squirrels, chipmunks, blue jays, nuthatches, grackles, and woodpeckers depend on acorns. White oak acorns taste less bitter and are preferred by many animals."
      - "Oak trees provide nesting sites for numerous bird species. Woodpeckers excavate cavities in dead branches. Squirrels build leaf nests in oak canopies."
      - "Oak woodlands offer shelter and cover. It is difficult to find natural woodland in Iowa without at least one oak species. Oak abundance makes them critical to forest ecosystems."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "Oak is often associated with strength and endurance. The genus-level designation shows Iowa's appreciation for oak diversity rather than favoring one species. The choice to designate all oaks equally honors the ecological importance of the entire oak group, and regional comparisons are easier with [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Iowa state tree?"
    answer: "Oak (Quercus spp.) is Iowa's official state tree. Governor Norman A. Erbe signed the bill on March 13, 1961. The legislature designated oak at the genus level without specifying a particular species, making Iowa unusual among states."
  
  - question: "What is the Iowa state tree called?"
    answer: "Iowa's state tree is called Oak. The scientific designation is Quercus spp., indicating the entire oak genus. Bur oak (Quercus macrocarpa) is commonly recognized as the representative species since it grows in all 102 Iowa counties."
  
  - question: "When did Iowa adopt Oak as state tree?"
    answer: "Iowa adopted Oak on March 13, 1961, when Governor Norman A. Erbe signed House Joint Resolution No. 10. A previous 1959 attempt to designate bur oak specifically had failed in committee. The 1961 law designated oak broadly without naming a species."
  
  - question: "Why didn't Iowa specify an oak species?"
    answer: "In 1959, a resolution to designate bur oak specifically got stuck in committee and failed. In 1961, the legislature took a broader approach, designating 'THE OAK' without specifying species. This avoided controversy and honored all 12 native Iowa oak species equally."
  
  - question: "How many oak species grow in Iowa?"
    answer: "Twelve oak species grow native in Iowa. Six are white oaks: white oak, bur oak, chinkapin oak, dwarf chinkapin oak, swamp white oak, and post oak. Six are red oaks: red oak, pin oak, black oak, northern pin oak, shingle oak, and blackjack oak."
  
  - question: "Is bur oak Iowa's state tree?"
    answer: "Bur oak is commonly recognized as Iowa's state tree, but the law designates 'oak' generally without specifying species. Bur oak is the only oak found in all 102 Iowa counties, making it the most widespread. Many people consider it the unofficial representative."
  
  - question: "What are some facts about the Iowa state tree?"
    answer: "Iowa designated oak at genus level (Quercus spp.) without specifying species. Twelve oak species grow native in Iowa. Bur oak is the only oak in all 102 counties. A 1959 attempt to designate bur oak specifically failed. Oak is also the national tree of the United States."
  
  - question: "Why is oak important for Iowa wildlife?"
    answer: "Oak acorns provide food for deer, wild turkeys, pheasants, quail, wood ducks, raccoons, squirrels, chipmunks, blue jays, nuthatches, grackles, and woodpeckers. Oak trees provide nesting sites and shelter. It is difficult to find Iowa woodland without at least one oak species."

