seo_title: "Iowa State Flower: Wild Prairie Rose – History & Facts"
seo_description: "The Wild Prairie Rose became Iowa's state flower in 1897. This pink native flower blooms across Iowa's prairies and roadsides each summer."

intro_text: "Iowa officially recognized the Wild Prairie Rose as its state flower in 1897. These pink five-petaled flowers bloom wild across Iowa's prairies and roadsides. The Wild Prairie Rose grows naturally in the prairie environments that once covered much of Iowa and that also support [Iowa's state bird, the American Goldfinch](/states/iowa/bird/american-goldfinch)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Iowa State Flower?"
    paragraphs:
      - "Iowa's floral emblem, the Wild Prairie Rose, dates back to 1897. Each flower displays five pink petals surrounding a cluster of yellow stamens. The blooms measure 2 to 3 inches across. A light fragrance attracts bees and butterflies. Single flowers or small clusters appear at stem tips."
      - "Wild Prairie Roses bloom from June through August in Iowa. Peak flowering occurs in late June and early July. The shrub grows 1 to 3 feet tall. Thorny stems spread through underground runners. Compound leaves with 7 to 11 leaflets cover the branches. Bright red rose hips form after flowers fade."
      - "This native rose grows wild throughout Iowa's remaining prairies. Roadsides provide common habitat where the plant thrives. The rose tolerates drought conditions typical of prairie environments. Well-drained soil suits this hardy shrub. Disturbed areas like ditches and fence lines support vigorous growth. Wild Prairie Rose spreads naturally through Iowa's landscape and often appears near mixed oak systems tied to [Iowa's state tree designation](/states/iowa/tree/oak)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Iowa State Flower Name"
    paragraphs:
      - "This flower carries the common name Wild Prairie Rose and the scientific name Rosa arkansana. The plant belongs to the Rosaceae family. This enormous family includes over 3,000 species of roses, apples, cherries, and many other flowering plants worldwide."
      - "The genus name Rosa covers all rose species. The species name arkansana refers to Arkansas where botanists first described this plant. Despite this name, the Wild Prairie Rose grows throughout the Great Plains. Some botanists consider Rosa pratincola and Rosa suffulta as separate species. Most modern classifications group these under Rosa arkansana."
      - "People call this plant prairie rose or Arkansas rose in different regions. Iowa residents typically use Wild Prairie Rose when referring to the state flower. The word wild distinguishes it from cultivated garden roses. Native Americans used rose hips for food and rose roots for medicine long before European settlement."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Wild Prairie Rose Became the Iowa State Flower"
    paragraphs:
      - "The Iowa legislature chose the Wild Prairie Rose as state flower in 1897. This made Iowa one of the earliest states to adopt an official floral emblem. The designation came during a period when states across America began selecting state symbols, and similar adoption histories are compiled on the [list of U.S. state flowers](/symbols/flowers). No organized campaign or public vote preceded the decision."
      - "Iowa lawmakers wanted a native flower that represented the state's prairie character. The Wild Prairie Rose grew naturally throughout Iowa before agricultural development. Settlers found the pink roses blooming across endless grasslands. The hardy rose survived despite farming and grazing pressure. Its persistence symbolized Iowa's pioneer spirit."
      - "Some legislators suggested cultivated roses or other garden flowers. Supporters of the Wild Prairie Rose argued that a native plant better represented Iowa. The rose's wide distribution across the state strengthened the case. The legislature passed the designation with little controversy. Iowa formalized the Wild Prairie Rose as state flower on May 7, 1897."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Iowa State Flower Facts"
    facts:
      - "The Wild Prairie Rose spreads through underground stems called rhizomes, allowing it to form dense colonies along roadsides and in prairie remnants"
      - "Rose hips from Wild Prairie Rose contain more vitamin C than citrus fruits and were used by Native Americans and pioneers as a winter food source"
      - "Iowa adopted the Wild Prairie Rose on May 7, 1897, becoming one of the first states in America to designate an official state flower"
      - "Each Wild Prairie Rose flower blooms for only a few days before petals drop, but plants produce flowers continuously throughout the summer"
      - "Birds and small mammals eat the bright red rose hips that persist on branches through winter, providing important wildlife food"
      - "The Wild Prairie Rose grows naturally from Manitoba to Texas across the Great Plains region, thriving in the same grassland environments that once covered Iowa"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Iowa State Flower and Bird"
    paragraphs:
      - "The American Goldfinch serves as Iowa's state bird, a small yellow songbird with distinctive black markings. Both symbols represent Iowa officially. Iowa adopted the Wild Prairie Rose in 1897 and designated the American Goldfinch as state bird in 1933."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Wild Prairie Rose Symbolizes"
    paragraphs:
      - "The Wild Prairie Rose commonly represents Iowa's prairie heritage and pioneer resilience. The flower has been linked to the vast grasslands that covered Iowa before agricultural settlement. Its hardy nature frequently represents the endurance and adaptability needed to thrive in Iowa's challenging prairie environment, matching values expressed in [Iowa's state motto](/states/iowa/motto/our-liberties-we-prize-and-our-rights-we-will-maintain)."

  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Context"
    paragraphs:
      - "Prairie bloom timing and habitat quality are easier to compare with nearby states using [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Iowa's state flower?"
    answer: "Iowa's state flower is the Wild Prairie Rose, a pink five-petaled native flower that blooms across prairies and roadsides throughout the state."
  
  - question: "When did Iowa adopt the Wild Prairie Rose as its state flower?"
    answer: "Iowa adopted the Wild Prairie Rose on May 7, 1897. This made Iowa one of the first states in America to designate an official state flower."
  
  - question: "Why did Iowa choose the Wild Prairie Rose?"
    answer: "Iowa chose the Wild Prairie Rose because it grows naturally throughout the state and represents Iowa's prairie heritage. Lawmakers wanted a native flower rather than cultivated garden varieties. The rose's hardy nature and wide distribution across Iowa made it an appropriate symbol of the state's pioneer character."
  
  - question: "Where does the Wild Prairie Rose grow in Iowa?"
    answer: "The Wild Prairie Rose grows wild throughout Iowa in remaining prairies, along roadsides, in ditches, and near fence lines. The plant thrives in disturbed areas and tolerates the drought conditions typical of prairie environments."
  
  - question: "When does the Wild Prairie Rose bloom in Iowa?"
    answer: "The Wild Prairie Rose blooms from June through August in Iowa, with peak flowering occurring in late June and early July. Individual flowers bloom for only a few days, but plants produce flowers continuously throughout the summer."

