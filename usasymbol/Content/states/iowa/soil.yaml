- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Tama Soil
  paragraphs:
  - "Most Tama soil is used for crops. The principal crops are corn, soybeans, small grains, and legume hays, according to the USDA series description."
  - "Tama is productive because it is deep, well drained, and rich in organic matter. Rain can move through it, roots can push deep into it, and the silty loess holds water well enough to carry crops through dry spells."
  - "Before farming, Tama supported tallgrass prairie with big bluestem, little bluestem, switchgrass, and other native grasses. Today only small prairie remnants remain, while most Tama ground is planted to row crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tama Soil Facts
  facts:
  - "The Tama series was first established in Black Hawk County, Iowa, in 1917."
  - "The Soil Science Society of America booklet says Tama covers about 933,000 acres and occurs in 28 Iowa counties."
  - "Tama formed in loess, a fine windblown silt that blankets much of eastern Iowa."
  - "Its native vegetation was tallgrass prairie, including big bluestem, little bluestem, switchgrass, and other grasses."
  - "Tama is well drained, which is one reason it differs from darker, wetter prairie soils in lower landscape positions."

