faq:
- question: What is Iowa's state soil?
  answer: "Iowa's state soil is the Tama series, the state's representative prairie soil. It is a very deep, well drained soil formed in loess across eastern and central Iowa."
- question: Why is it called Tama soil?
  answer: "The soil series was named for Tama County. USDA soil scientists usually name a soil series after the place where it was first studied and described."
- question: What color is Tama soil?
  answer: "The topsoil is very dark brown to nearly black when moist because it is rich in organic matter from old prairie roots. Below that, the soil becomes brown to yellowish brown."
- question: Where is Tama soil found in Iowa?
  answer: "Tama soil is found mainly in eastern and central Iowa on loess-covered uplands, side slopes, and stream terraces. It has been mapped in 28 Iowa counties."
- question: What grew on Tama soil before farming?
  answer: "Tallgrass prairie grew on Tama soil before farming. Common plants included big bluestem, little bluestem, switchgrass, and other native grasses."
- question: What grows in Tama soil today?
  answer: "The main crops are corn, soybeans, small grains, and legume hays. Tama is one of Iowa's best-known upland farm soils."
- question: Who chose Tama as Iowa's state soil?
  answer: "Tama is recognized as Iowa's representative state soil by soil scientists and educational soil programs such as USDA-NRCS and the Soil Science Society of America. Iowa has not clearly designated it by state law."
- question: How deep is Tama soil?
  answer: "Tama is a very deep soil. Its dark topsoil commonly extends well over a foot, and the full profile continues far below normal rooting depth before bedrock is reached."

