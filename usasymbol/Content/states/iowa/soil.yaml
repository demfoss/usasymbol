    name: Tilled surface
    depth_in: "0-8"
    color_hex: "#2F2210"
    color_name: very dark brown
    texture: silt loam to silty clay loam
    note: plow layer; rich in organic matter from former prairie roots
  - horizon: A
    name: Deep dark layer
    depth_in: "8-18"
