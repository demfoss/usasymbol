        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Geode Facts"
    facts:
      - "Adopted as Iowa's state rock in 1967."
      - "Geodes from the Keokuk area of southeastern Iowa are known to collectors worldwide as Keokuk geodes."
      - "Some of the largest Keokuk-area geodes on record measure 18 inches or more across."
      - "Geode State Park in Henry County is named for the region's geodes, but collecting inside the park is prohibited."

