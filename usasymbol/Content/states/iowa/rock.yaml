faq:
  - question: What is Iowa's state rock?
    answer: "Iowa's state rock is the geode, a hollow rock nodule lined inside with quartz or other crystals, adopted by the Iowa Legislature in 1967."
  - question: When did Iowa adopt the geode as its state rock?
    answer: "The Iowa Legislature designated the geode the official state rock in 1967."
  - question: Why did Iowa choose the geode?
    answer: "Lawmakers wanted to promote tourism around the geode-hunting areas of southeastern Iowa, where Keokuk geodes are known to collectors worldwide."
  - question: Where can you find geodes in Iowa?
    answer: "Southeastern Iowa, especially Lee, Henry, and Van Buren counties around Keokuk, is the state's main geode-hunting region, though collecting is limited to private land with permission."

