sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Iowa State Rock
    paragraphs:
      - "The geode is Iowa's official state rock, designated by the Iowa Legislature in 1967. From the outside it looks like an ordinary, rounded gray rock, but many hold a hollow center lined with sparkling crystals."
      - "Iowa lawmakers chose the geode partly to draw attention to the state's rock-hunting tourism, since geodes from the Keokuk area in southeastern Iowa are known to collectors and museums around the world."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is a Geode?"
    paragraphs:
      - "A geode is a roughly round, hollow rock nodule with an outer shell that formed inside a cavity in sedimentary rock, usually limestone. The outside is typically dull gray or brown and gives no hint of what is inside."
      - "Crack one open, and most reveal an interior lined with crystals, commonly quartz or chalcedony, growing inward from the shell toward the hollow center. Some Iowa geodes show additional minerals, like calcite, giving individual specimens distinct color and crystal patterns."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Iowa Chose the Geode as Its State Rock"
    paragraphs:
      - "Southeastern Iowa, especially the area around Keokuk in Lee County, has produced geodes prized by rockhounds for generations, commonly known as Keokuk geodes. Some of the largest specimens on record, over a foot and a half across, have come out of Lee County streams."
      - "Lawmakers named the geode the state rock in part to promote that reputation and draw rock hunters to the region. The designation gave Iowa a state symbol built around an activity, hunting for and cracking open geodes, rather than a single mine or industry."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the Geode Became Iowa's State Rock"
    paragraphs:
      - "The Iowa Legislature designated the geode the official state rock in 1967, aiming to promote tourism around the state's geode-hunting areas in the southeast."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Geodes Are Found in Iowa"
    paragraphs:
      - "Geodes erode out of bluffs and creek banks in Lee, Henry, and Van Buren counties in southeastern Iowa, an area centered on Keokuk along the Mississippi River. Geode State Park in Henry County takes its name from the area's geodes, though collecting inside the park itself is not allowed."
    sites:
      - name: Keokuk
        city: Keokuk
        lat: 40.3989
