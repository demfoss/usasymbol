      text: Iowa's best-known nickname, promoted in the territorial period.
    - label: Corn State
      text: Informal nickname tied to Iowa's farm economy.
    - label: Land Where the Tall Corn Grows
      text: Poetic agricultural nickname connected with Iowa cultural memory.
    - label: Abbreviation
      text: IA; older short form Ia.
editorial:
  heading: What Iowa's Symbols Say About the State
  paragraphs:
  - Iowa's [state flag](/states/iowa/flag) is a history lesson in three vertical stripes. Dixie Cornell Gebhardt's design uses French tricolor memory, a bald eagle, and the state motto to connect Iowa's Louisiana Purchase past with World War I-era patriotism.
  - "The [American goldfinch](/states/iowa/bird) and [wild prairie rose](/states/iowa/flower) are not showy trophies. They work because they belong to the open-country Iowa people actually see: roadsides, field edges, and prairie remnants."
  - The [oak](/states/iowa/tree) may be Iowa's most editorially interesting choice. Instead of naming bur oak alone, the state adopted oak at the genus level, making the symbol about a whole woodland group and its wildlife value.
faq:
- question: What is Iowa's most famous state symbol?
  answer: The [Iowa state flag](/states/iowa/flag) is one of the clearest symbols because it carries the eagle, state motto, and blue-white-red design tied to Iowa's French Louisiana history.
- question: What is Iowa's state bird?
  answer: Iowa's state bird is the [American goldfinch](/states/iowa/bird), adopted in 1933.
- question: What is Iowa's state flower?
  answer: Iowa's state flower is the [wild prairie rose](/states/iowa/flower), adopted in 1897.
- question: Why is Iowa's state tree listed as oak instead of bur oak?
  answer: Iowa designated [oak](/states/iowa/tree) broadly, without naming a single species. Bur oak is often treated as the representative oak because it grows throughout all 102 counties.
- question: How many official state symbols does Iowa have?
  answer: Iowa's state symbols list here includes the flag, goldfinch, wild prairie rose, oak, motto, colors, and Hawkeye nickname.
