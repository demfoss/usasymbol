seo_description: "Iowa state symbols and facts: official state symbols include the American goldfinch, wild prairie rose, bur oak, Hawkeye nickname, and state motto."
snippet_answer: The American goldfinch, wild prairie rose, and Hawkeye nickname are the best-known official state symbols of Iowa. The blue-white-red flag, Our Liberties We Prize motto, and a state tree law broad enough to cover every native oak tie Iowa's prairie identity to statehood-era language and Louisiana Purchase memory.
