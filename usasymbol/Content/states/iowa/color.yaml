seo_description: "Iowa state colors are Blue, White, and Red, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Iowa are **Blue**, **White**, and **Red**, derived from [the Iowa state flag](/states/iowa/flag/iowa-state-flag) adopted in 1921. No separate state-colors law exists, but blue, white, and red are widely recognized as the traditional colors of the Hawkeye State through the state flag and state branding. For Iowa, the reference table gives practical HEX, RGB, CMYK, and Pantone values for comparison with other [U.S. state colors](/symbols/colors)."

official_colors: "Blue, White, and Red"
official_since: "Traditional (based on 1921 state flag)"
primary_use: "State Flag, state government branding, official state insignia"
known_for: "The only US state flag consciously designed as a homage to the French Tricolor, honoring Iowa's French colonial heritage under the Louisiana Territory; designed by Dixie Cornell Gebhardt of the Iowa DAR in 1917 and adopted as Iowa's official flag in 1921, 75 years after Iowa achieved statehood"

