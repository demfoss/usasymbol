title: "Official and Traditional Colors of Iowa"
state: "Iowa"
adopted_year: null

seo_title: "Iowa State Colors: Official HEX Codes & Meaning"
seo_description: "Iowa state colors are Blue, White, and Red, based on the 1921 state flag. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "The traditional state colors of Iowa are **Blue**, **White**, and **Red**, derived from [the Iowa state flag](/states/iowa/flag/iowa-state-flag) adopted in 1921. While not officially designated by a separate legislative act, blue, white, and red have become the universally recognized traditional color identity of the Hawkeye State through the state flag and state branding. For designers and print professionals, exact HEX, RGB, CMYK, and Pantone codes are in the specifications below, alongside the full [U.S. state colors reference](/symbols/colors)."

official_colors: "Blue, White, and Red"
official_since: "Traditional (based on 1921 state flag)"
primary_use: "State Flag, state government branding, official state insignia"
known_for: "The only US state flag consciously designed as a homage to the French Tricolor, honoring Iowa's French colonial heritage under the Louisiana Territory; designed by Dixie Cornell Gebhardt of the Iowa DAR in 1917 and adopted as Iowa's official flag in 1921, 75 years after Iowa achieved statehood"

color_data:
  - name: "Blue"
    hex: "#002868"
    rgb: "0, 40, 104"
    cmyk: "100, 62, 0, 59"
    pantone: "PMS 286"
    symbolism: "Described by flag designer Dixie Cornell Gebhardt as representing loyalty, justice, and truth; occupies the hoist stripe of the Iowa state flag, the position closest to the flagpole and traditionally the most heraldically significant; blue also mirrors the blue of the French Tricolor and the United States flag, connecting Iowa's color identity simultaneously to its French colonial past and its American national present"
  - name: "White"
    hex: "#FFFFFF"
    rgb: "255, 255, 255"
    cmyk: "0, 0, 0, 0"
    pantone: "White"
    symbolism: "Described by Dixie Cornell Gebhardt as representing purity; occupies the wider central stripe of the Iowa flag — the widest of the three bands — and bears the bald eagle, the state motto ribbon, and the state name in red; white also evokes the blanket of snow that covers Iowa's agricultural plains in winter and the purity of intent expressed in the state motto 'Our liberties we prize and our rights we will maintain'"
  - name: "Red"
    hex: "#BF0A30"
    rgb: "191, 10, 48"
    cmyk: "0, 95, 75, 25"
    pantone: "PMS 193"
    symbolism: "Described by Dixie Cornell Gebhardt as representing courage; occupies the fly stripe of the Iowa flag and also appears as the color of the word 'IOWA' inscribed below the eagle on the white central stripe; Gebhardt stated in design documentation that the red 'Iowa' represents the Iowa soldier's commitment written 'in blood on the white page of history' — a direct reference to the sacrifice of Iowa's troops in World War I that prompted the flag's creation"

sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Iowa does not have officially legislated state colors designated by a separate statute. Blue, white, and red have become the universally recognized traditional state colors through the Iowa state flag, adopted on March 29, 1921 — a date that came 75 years after Iowa achieved statehood in 1846. The extraordinary delay between statehood and flag adoption reflects a specific cultural moment in Iowa history: a Civil War veterans' organization, the Grand Army of the Republic, had long opposed any state flag on the grounds that state flags were contrary to the ideal of national unity for which they and their fallen comrades had fought. Iowa was one of only three states without a flag in 1917 when the United States entered World War I, and this identity transition is also reflected in [Iowa's nickname history](/states/iowa/nickname/the-hawkeye-state)."
      - "The flag's design — three vertical stripes of blue, white, and red — was consciously modeled on the French Tricolor as a direct acknowledgment of Iowa's history as part of the French Louisiana Territory from 1682 to 1763 and again from 1800 to 1803, when the Louisiana Purchase transferred the territory to the United States. The Iowa Code § 1B.1 defines the flag as consisting of 'three vertical stripes of blue, white, and red, the blue stripe being nearest the staff and the white stripe being in the center,' with a bald eagle carrying a ribbon bearing the state motto centered on the white stripe. The white stripe is appreciably wider than the blue and red stripes, creating a design that references the French Tricolor while visually differentiating Iowa's flag from an exact copy."
    subsections:
      - subtitle: "Dixie Cornell Gebhardt and the World War I Origin"
        text: "The Iowa state flag's creation was prompted directly by World War I. When the United States entered the war in April 1917, American families sought to send their state flags to Iowa soldiers serving in France — only to discover that Iowa had no flag to send. Iowa National Guardsmen stationed along the Mexican border had made repeated requests for a state banner, and Iowa was embarrassingly represented by an unofficial flag at Continental Hall in Washington while other states displayed their official flags. Dixie Cornell Gebhardt, a resident of Knoxville, Iowa, and a member of the Iowa Daughters of the American Revolution, responded to guardsmen's appeals by designing a flag that was approved by the Iowa DAR flag committee in May 1917 and presented to the Iowa State Council for Defense on May 11, 1917. Iowa Governor William Lloyd Harding formally accepted the flag on behalf of the state on March 19, 1918, though legislative adoption was delayed until 1921. Iowa's governor called Gebhardt 'Iowa's Betsy Ross' in recognition of her contribution, and the accompanying principles are continued on [Iowa's state motto page](/states/iowa/motto/our-liberties-we-prize-and-our-rights-we-will-maintain)."
      - subtitle: "The Louisiana Purchase and the French Tricolor"
        text: "The decision to base Iowa's flag on the French Tricolor was made deliberately and with historical intent. A member of the DAR flag committee suggested that Iowa's role in the Louisiana Purchase of 1803 should be indicated by the addition of the French red, white, and blue, and this idea was officially adopted into the flag's design. The Iowa Territory had been part of the French colonial system under the name La Louisiane for over a century, first explored by French expedition leaders Jacques Marquette and Louis Jolliet in 1673, claimed for France by Robert de La Salle in 1682, and governed under the French colonial flag until 1763 — making the French Tricolor a historically accurate representation of Iowa's pre-American heritage. Napoleon Bonaparte's secret reacquisition of Louisiana from Spain in 1800 and its subsequent sale to the United States in 1803 for $15 million makes Iowa's flag one of the few American state flags to encode a specific diplomatic transaction into its color palette."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Iowa's blue, white, and red carry a dual layer of meaning that is unique among American state color traditions: each color simultaneously references French Tricolor symbolism inherited from the Louisiana Territory period and carries the specific American meaning assigned by designer Dixie Cornell Gebhardt. The result is a color palette that functions as both a historical document — recording Iowa's French colonial past — and a contemporary civic statement about the values of loyalty, purity, and courage that Iowa's founders and soldiers embodied. No other US state flag so explicitly and deliberately encodes a foreign nation's flag into its design as a historical acknowledgment."
    subsections:
      - subtitle: "Blue: Loyalty, Justice, and Truth"
        text: "Dixie Cornell Gebhardt specified blue as representing loyalty, justice, and truth — traditional heraldic values that connect Iowa's blue to the broader American patriotic tradition while also referencing the blue of the French Tricolor. Blue's position on the hoist side of the Iowa flag — the most heraldically prominent position, nearest the flagpole — gives it visual priority in the flag's design hierarchy. Iowa's association with loyalty was established during the Civil War, in which the state contributed approximately 76,000 soldiers to the Union Army — a number representing nearly 14 percent of Iowa's total population in 1860, one of the highest per capita military participation rates of any Union state. The deep navy blue of Iowa's flag connects this Civil War loyalty directly to the color tradition that French Louisiana established on the same landscape 200 years earlier."
      - subtitle: "White: Purity and Iowa's Agricultural Identity"
        text: "White occupies the central and widest stripe of the Iowa flag, a position that makes it the dominant visual element and the literal canvas on which the flag's symbolic content — the eagle, the motto ribbon, and the state name — is displayed. Gebhardt described white as representing purity, a traditional heraldic value she connected to Iowa's self-image as a state of honest agricultural labor and civic integrity. White also resonates geographically with Iowa's landscape: the state experiences heavy winter snowfall that blankets its 35.7 million acres of farmland — the largest proportion of any US state dedicated to agriculture — in a white expanse that is among the most visually dramatic seasonal transformations in the American Midwest. Iowa's agriculture, producing corn, soybeans, pork, and eggs in quantities that consistently rank it among the national leaders, is the economic foundation of the state and the cultural core of its identity."
      - subtitle: "Red: Courage and the Iowa Soldier"
        text: "Red on the Iowa flag carries its most emotionally specific meaning through Dixie Cornell Gebhardt's own documentation: she described the red 'IOWA' lettering on the white central stripe as representing the Iowa soldier's commitment written 'in blood on the white page of history' — a direct and viscerally patriotic reference to the World War I context in which the flag was designed. This specific imagery, connecting the red of the state name to the sacrifice of Iowa's soldiers, is one of the most emotionally direct color symbolism statements in any US state flag tradition. Red appears both as the fly stripe of the tricolor and as the color of the state name, giving it two distinct visual roles that reinforce the theme of courageous civic sacrifice from different positions within the flag's design."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue, white, and red dominate the Iowa state flag, governed by Iowa Code § 1B.1, which flies at the Iowa State Capitol in Des Moines and all state government buildings. The Iowa state seal, adopted in 1847 and depicting a soldier holding the US flag alongside the Mississippi River, a steamboat, wheat fields, and a lead furnace, uses a broader palette of colors representing Iowa's geographic and industrial diversity, but the state flag's blue-white-red tricolor remains the dominant color identity for Iowa in official state communications and public branding. These colors appear across Iowa state agency branding, Iowa Department of Cultural Affairs materials, and official state publications. The Iowa flag's design has remained unchanged since its 1921 adoption — Iowa Code § 1B.1 has never been amended to alter the flag's color specifications — making Iowa's blue-white-red tradition one of the most stable and unmodified state flag color records in the United States and part of [U.S. state colors](/symbols/colors)."

      - "For comparative political geography around Iowa's identity, readers often use [states and capital cities reference data](/rankings/geography/states-capital-cities)."

