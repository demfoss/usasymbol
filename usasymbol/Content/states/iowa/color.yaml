timeline:
  - year: "1673"
    description: "French explorers Jacques Marquette and Louis Jolliet become the first Europeans to reach Iowa's territory; France establishes its colonial claim to the land that would eventually become Iowa"
  - year: "1682"
    description: "Robert de La Salle claims the Iowa region for France as part of La Louisiane; the French Tricolor — the visual source of Iowa's state flag colors — begins its century-long association with Iowa's territory"
  - year: "1803"
    description: "Louisiana Purchase completed on April 30; the United States acquires Iowa's territory from Napoleonic France for approximately $15 million, ending French governance and beginning the American period that the Iowa flag's blue-white-red design commemorates"
  - year: "1846"
    description: "Iowa admitted to the Union on December 28 as the 29th state; despite statehood, Iowa will go without an official state flag for 75 years"
  - year: "1917"
    description: "Dixie Cornell Gebhardt designs the Iowa state flag in response to Iowa soldiers' requests during World War I; the French Tricolor design is approved by the Iowa DAR and the Iowa State Council for Defense"
  - year: "1921"
    description: "Iowa General Assembly officially adopts the flag on March 29 under Iowa Code § 1B.1, establishing blue, white, and red as Iowa's traditional state colors — 75 years after statehood and 118 years after the Louisiana Purchase that inspired the flag's design"

expert_quote:
  text: "The red 'Iowa' represents the Iowa soldier writing in blood on the white page of history his unwavering commitment to defend the ideals embodied by the blue of loyalty, justice, and truth."
  source: "Dixie Cornell Gebhardt, designer of the Iowa State Flag, design documentation 1917 — as cited in Iowa state flag historical records"

faq:
  - question: "What are the official colors of Iowa?"
    answer: "The traditional state colors of Iowa are Blue, White, and Red, derived from the Iowa state flag adopted on March 29, 1921. The flag's design deliberately mirrors the French Tricolor to honor Iowa's history as part of the French Louisiana Territory before the 1803 Louisiana Purchase."
  - question: "What is the HEX code for Iowa Blue?"
    answer: "The standard HEX code for Iowa Blue is #002868, corresponding to Pantone PMS 286, representing the blue hoist stripe of the Iowa state flag and the values of loyalty, justice, and truth as specified by flag designer Dixie Cornell Gebhardt."
  - question: "What is the HEX code for Iowa Red?"
    answer: "The standard HEX code for Iowa Red is #BF0A30, corresponding to Pantone PMS 193, representing the red fly stripe and the red 'IOWA' lettering on the state flag — symbolizing courage and the sacrifice of Iowa's soldiers."
  - question: "Why does the Iowa flag look like the French flag?"
    answer: "The Iowa state flag was deliberately designed to resemble the French Tricolor to honor Iowa's history as part of French Louisiana from 1682 to 1803. A DAR committee member suggested that Iowa's role in the Louisiana Purchase should be indicated by incorporating the French red, white, and blue into the flag's design."
  - question: "Who designed the Iowa state flag?"
    answer: "The Iowa state flag was designed by Dixie Cornell Gebhardt, a resident of Knoxville, Iowa, and a member of the Iowa Daughters of the American Revolution. She designed the flag in 1917 in response to Iowa soldiers' requests during World War I. Iowa's governor called her 'Iowa's Betsy Ross.'"
  - question: "Why did Iowa go 75 years without a state flag?"
    answer: "Iowa lacked an official state flag from statehood in 1846 until 1921 primarily because the Grand Army of the Republic — a Civil War veterans' organization — opposed any state flag on the grounds that state flags conflicted with the ideal of national unity for which they had fought. It took the practical need of World War I — soldiers needed a state flag to carry into battle — to finally overcome this opposition."
  - question: "What does the Iowa state flag motto mean?"
    answer: "The Iowa state motto, 'Our liberties we prize and our rights we will maintain,' appears on the blue ribbon carried by the bald eagle on the white central stripe of the Iowa flag. It expresses Iowa's commitment to democratic freedoms and was taken from the Iowa state seal, adopted in 1847."

