seo_title: "Iowa State Flag | Eagle, Tricolor & Motto"
seo_description: "Iowa's flag echoes the French tricolor — a nod to its territorial past. An eagle carries a ribbon with the state motto in its beak. What each element means."

intro_text: "The official state flag of Iowa dates to 1921 and includes a vertical tricolor design. Three stripes of blue, white, and red cover the field. A bald eagle holding streamers appears on the central white stripe, carrying [Iowa's state motto](/states/iowa/motto/our-liberties-we-prize-and-our-rights-we-will-maintain). Dixie Cornell Gebhardt designed the flag in 1917."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Iowa State Flag Is Designed"
    paragraphs:
      - "The Iowa state flag is the official state flag of Iowa. Three vertical stripes of blue, white, and red cover the field. The blue stripe sits nearest the staff. The white stripe occupies the center and is twice as wide as the other stripes, and the design is included on the [list of U.S. state flags](/symbols/flags)."
      - "A bald eagle with spread wings appears on the white stripe. The eagle carries blue streamers in its beak. The state motto Our Liberties We Prize and Our Rights We Will Maintain appears in white letters on the streamers. The word Iowa appears in red letters below the streamers."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Iowa Flag Communicates"
    paragraphs:
      - "The Iowa state flag represents the state's French territorial history and American identity. The vertical tricolor design resembles the French flag, honoring Iowa's time as French territory. The eagle represents the United States and Iowa's place in the Union, and this framing is reinforced in [Iowa's nickname narrative](/states/iowa/nickname/the-hawkeye-state)."
      - "The colors carry specific meanings assigned by designer Dixie Cornell Gebhardt. Blue represents loyalty, justice, and truth. White stands for purity. Red symbolizes courage. The state motto on the streamers reflects Iowa's admission as a free state."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Iowa Flag History and Adoption"
    paragraphs:
      - "Iowa became the 29th state on December 28, 1846. The state had no official flag for its first 75 years. Calls for national unity during and after the Civil War discouraged state flags. Iowa fought for the Union during the war, and this period is also mapped in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "The first request for a state flag came in 1909 from Iowa National Guardsmen. They made another request in 1910. In Fort Dodge, members of the military advisory board designed a flag and sent it to the Legislature. The design was not adopted because it was considered inadequate."
      - "World War I renewed requests for a state flag. The Iowa Daughters of the American Revolution took up the cause. Iowa National Guardsmen positioned along the Mexican border requested a flag, noting other states had flags to represent themselves. In 1917, Iowa was one of three states without a flag."
      - "Dixie Cornell Gebhardt, a DAR member from Knoxville, designed the flag. She was prompted to create the design by Iowa guardsmen. The DAR flag committee approved it in early May 1917. The Iowa State Council for Defense accepted it on May 11, 1917."
      - "Governor William Lloyd Harding formally accepted the flag on March 19, 1918. Legislative action on adoption failed in February 1919. The Iowa Daughters met with legislators again in September 1920, urging them to accept the flag. In January 1921, Iowa legislators deliberated on adoption. By mid-March 1921, the flag was accepted as law."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Iowa Flag"
    symbols:
      - id: tricolor-stripes
        name: "Iowa State Flag Tricolor Stripes"
        image: "symbols/tricolor.svg"
        paragraphs:
          - "Three vertical stripes of blue, white, and red cover the flag. The design is an unequal tricolor with the white stripe twice as wide as the blue and red stripes."
          - "The tricolor design honors Iowa's history as French territory. The French flag also uses blue, white, and red vertical stripes from left to right. Iowa's design borrows from the French national flag and aligns with [Iowa's official color identity](/states/iowa/color)."

      - id: bald-eagle
        name: "Iowa State Flag Eagle"
        image: "symbols/eagle.svg"
        paragraphs:
          - "A bald eagle with spread wings appears on the white stripe. The eagle represents the United States and Iowa's place in the Union."
          - "The eagle design also appears on the Iowa state seal. Iowa is one of nine U.S. state flags to feature an eagle."

      - id: motto-streamers
        name: "Iowa State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The eagle carries blue streamers in its beak. The state motto appears in white letters on the streamers: Our Liberties We Prize and Our Rights We Will Maintain."
          - "This motto reflects Iowa's admission to the United States as a free state. The motto emphasizes liberty and the protection of rights."

      - id: iowa-text
        name: "Iowa State Flag Text"
        image: "symbols/iowa-text.svg"
        paragraphs:
          - "The word Iowa appears in red letters below the eagle and streamers. The red lettering stands out against the white background."
          - "Designer Dixie Cornell Gebhardt wanted the design simple enough for school children and adults to recognize the symbolism. The word Iowa helps identify the flag."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Iowa State Flag Colors"
    paragraphs:
      - "The Iowa state flag uses blue, white, and red from the French flag. Dixie Cornell Gebhardt assigned symbolic meanings to each color. Iowa statute does not provide exact Cable or Pantone values."
    colors:
      - name: "Blue"
        hex: "#0A1F62"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Red"
        hex: "#D80025"
      - name: "Brown"
        hex: "#69310B"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Iowa State Flag Facts"
    facts:
      - "Iowa officially adopted its flag on March 29, 1921"
      - "Dixie Cornell Gebhardt designed the flag in 1917"
      - "The flag was accepted by the State Council for Defense on May 11, 1917"
      - "The design resembles the French flag to honor Iowa's territorial history"
      - "Iowa is one of nine state flags featuring an eagle"
      - "The flag ranked 42nd out of 72 in a 2001 NAVA survey"

faq:
  - question: "What design is recognized as the state flag of Iowa?"
    answer: "The state flag of Iowa is the official banner of Iowa, featuring three vertical stripes of blue, white, and red with a bald eagle holding streamers on the white stripe."

  - question: "What does Iowa's flag look like?"
    answer: "The Iowa flag shows three vertical stripes in blue, white, and red. A bald eagle appears on the wider white center stripe, carrying streamers with the state motto. The word Iowa appears in red below."

  - question: "What meaning is attached to Iowa's flag?"
    answer: "The tricolor design honors Iowa's history as French territory. The eagle represents the United States. Blue represents loyalty, justice, and truth. White stands for purity. Red symbolizes courage."

  - question: "Which colors define Iowa's flag?"
    answer: "The Iowa flag uses blue, white, and red in vertical stripes, matching the French flag. The eagle and other details add brown."

  - question: "Who designed the Iowa state flag?"
    answer: "The vertical tricolor design resembles the French flag because Iowa was once French territory. Dixie Cornell Gebhardt designed the flag to honor Iowa's French heritage by borrowing the blue, white, and red stripes."

  - question: "How are the colors of the Iowa state flag described?"
    answer: "A bald eagle appears on the Iowa state flag. The eagle spreads its wings and carries blue streamers with the state motto in its beak."

