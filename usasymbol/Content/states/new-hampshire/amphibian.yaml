faq:
  - question: What is New Hampshire's state amphibian?
    answer: "New Hampshire's state amphibian is the red-spotted newt, adopted by the New Hampshire Legislature in 1985."
  - question: When did New Hampshire adopt the red-spotted newt?
    answer: "The New Hampshire Legislature designated the red-spotted newt the official state amphibian in 1985."
  - question: Why did New Hampshire choose the red-spotted newt?
    answer: "New Hampshire schoolchildren proposed the red-spotted newt because it is common statewide and its bright orange eft stage makes it easy to spot in the state's forests."
  - question: What does the red-spotted newt look like?
    answer: "As an adult, the red-spotted newt has an olive green back with small red spots and a yellow, black-dotted belly, while young newts go through a bright orange land stage called an eft."

