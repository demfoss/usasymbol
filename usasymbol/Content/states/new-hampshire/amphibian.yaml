sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of New Hampshire?
    paragraphs:
      - "The red-spotted newt is New Hampshire's official state amphibian, designated by the New Hampshire Legislature in 1985. Its scientific name is Notophthalmus viridescens, and it is common in ponds and forests across the state."
      - "It is known for an unusual life cycle that includes a bright orange land-dwelling stage called an eft."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Red-spotted Newt
    paragraphs:
      - "As adults, red-spotted newts live in water and have an olive green back with small black-bordered red spots and a yellow belly dotted with black."
      - "Before becoming water-dwelling adults, young newts go through a bright orange land stage called an eft, which can wander forest floors for one to several years."
      - "Adults typically grow to about 3 to 5 inches long and can be found in ponds, slow streams, and nearby woods."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The New Hampshire Legislature designated the red-spotted newt the official state amphibian in 1985, following a campaign led by New Hampshire schoolchildren who proposed the newt for the honor."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New Hampshire Chose the Red-spotted Newt
    paragraphs:
      - "The red-spotted newt is common throughout New Hampshire's ponds and forests, and its bright orange eft stage makes it one of the state's most easily noticed amphibians, which helped make it a popular choice with students."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Red-spotted Newt
    paragraphs:
      - "Red-spotted newts live in ponds and slow-moving water throughout New Hampshire, with the orange eft stage commonly seen wandering nearby forest floors, including in the White Mountains region."
    sites:
      - name: White Mountain forests
        city: Conway
        lat: 43.98
        lng: -71.13
        note: "Common eft and pond habitat"
        type: primary

  - id: facts
