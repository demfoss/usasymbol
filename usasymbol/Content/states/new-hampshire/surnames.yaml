seo:
  title: "Most Common Surnames in New Hampshire"
  description: "The most common surnames in New Hampshire are Smith, Brown, and Davis, but old New England family names like Sanborn, Kimball, and Colby rank unusually high for the state."

page:
  h1: "Most Common Last Names in New Hampshire"
  intro: "Smith, Brown, and Davis are the most common surnames in New Hampshire, and Sanborn ranks fifth statewide, an unusually high finish for a colonial family name. The most common last names in New Hampshire still reflect three layers at once: seventeenth-century English settlement on the Piscataqua, inland Yankee family networks, and the French-Canadian mill migration that reshaped Manchester and other industrial towns in the late nineteenth century."
  heritage_title: "Colonial Seacoast Families and French-Canadian Mill Towns"
  heritage_body: "New Hampshire's first permanent English settlement began at Dover in 1623, and many of the surnames that still look distinctively New England were planted in that early seacoast world. The older layer never disappeared because the state remained relatively small and lightly urbanized, allowing founding-family names such as Sanborn, Kimball, Merrill, Colby, and Sargent to stay unusually visible. A later industrial layer arrived through the Amoskeag mills and other factories: New Hampshire Historical Society data shows more than 50,000 New Hampshire residents in 1920 had been born in Canada, especially Quebec, and Manchester employers were recruiting French-Canadian workers in French by 1895."
  fun_fact: "Sanborn ranks fifth in New Hampshire but only 1,125th nationally in Forebears' U.S. ranking, one of the clearest signs that old New England family names still shape the state's surname map."

surnames:
  - rank: 1
    name: Smith
    count: 4873
    ratio: 71
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith has been present since New Hampshire's first English settlements on the Piscataqua in 1623, and later industrial towns such as Manchester kept the classic trade surname at the top statewide."

  - rank: 2
    name: Brown
    count: 3623
    ratio: 96
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', referring to brown hair, clothing, or complexion. Brown is one of the plain English surnames that spread early through seacoast and inland farm towns and remained strong because New Hampshire never had a single immigrant group large enough to push it aside."

  - rank: 3
    name: Davis
    count: 2589
    ratio: 134
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', beloved. Davis fits New Hampshire's older English and Welsh New England stock and stayed common as families moved from the seacoast into Merrimack Valley and Connecticut River towns."

  - rank: 4
    name: Clark
    count: 2064
    ratio: 168
    origin: english
    type: Occupational
    meaning: "From Latin 'clericus', a clerk or scholar. Clark ranks unusually high in New Hampshire because it belongs to the colony's early record-keeping culture of church towns, courts, and schools, then remained visible in small-city business centers such as Concord and Portsmouth."

  - rank: 5
    name: Sanborn
    count: 1709
    ratio: 203
    origin: english
    type: Habitational
    meaning: "A place-based surname from Sambourne in Warwickshire, Anglicized in New England as Sanborn. Few names look more rooted in New Hampshire: Sanborn family records run deep in Hampton, and the town of Sanbornton preserves the surname in the map itself."

  - rank: 6
    name: Chase
    count: 1651
    ratio: 210
    origin: english
    type: Occupational
    meaning: "From Old French 'chace', a hunter or huntsman. Chase is one of the old Yankee surnames that spread through southern and central New Hampshire long before the mill era, giving the state a more colonial surname profile than most of the Northeast."

  - rank: 7
    name: Hall
    count: 1559
    ratio: 222
    origin: english
    type: Habitational
    meaning: "Originally for someone who lived or worked at a hall or manor house. Hall is common across New England, but in New Hampshire its durability reflects continuity from seventeenth- and eighteenth-century farming towns rather than one late immigrant surge."

  - rank: 8
    name: Johnson
    count: 1495
    ratio: 232
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', God is gracious. Johnson is common almost everywhere in the United States, but in New Hampshire it sits below several older Yankee surnames, which shows how unusually persistent the state's colonial family layer remains."

  - rank: 9
    name: Stevens
    count: 1411
    ratio: 245
    origin: english
    type: Patronymic
    meaning: "From Stephen, from Greek 'stephanos', crown. Stevens has deep roots in New Hampshire town records and reflects the same long-settled English family networks that keep names like Sanborn and Chase high on the list."

  - rank: 10
    name: Jones
    count: 1391
    ratio: 249
    origin: welsh
    type: Patronymic
    meaning: "The classic Welsh surname, son of John via 'Ioan'. Jones traveled into New Hampshire with English and Welsh settlers and stayed common enough to remain in the top ten even in a state with many rarer colonial surnames."

  - rank: 11
    name: Young
    count: 1371
    ratio: 253
    origin: english
    type: Descriptive
    meaning: "From Old English 'geong', often used to distinguish a younger man from an older relative of the same name. New Hampshire's many small towns favored that kind of practical surname, and Young still reads as an old rural New England name."

  - rank: 12
    name: Hill
    count: 1320
    ratio: 262
    origin: english
    type: Habitational
    meaning: "For someone who lived on or near a hill. In a state defined by uplands, not broad plains, Hill spread naturally through village and farm settlement and remained one of New Hampshire's most stable landscape surnames."

  - rank: 13
    name: Kimball
    count: 1245
    ratio: 278
    origin: english
    type: Patronymic
    meaning: "Derived from an old personal name related to 'Cynebald', usually interpreted as bold kin. Kimball is a strong New Hampshire surname because the family became prominent in places such as Concord, where Kimball land and institutions still mark the city landscape."

  - rank: 14
    name: Thompson
    count: 1238
    ratio: 280
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson belongs to the broad English surname layer that arrived early and stayed durable across New Hampshire's seacoast, river towns, and interior villages."

  - rank: 15
    name: Merrill
    count: 1175
    ratio: 295
    origin: english
    type: Patronymic
    meaning: "Usually traced to an older personal name that became Merrill or Merrell in English records. Its high rank in New Hampshire points to long-established Yankee family lines rather than recent migration, which is why the name sits far above its national profile here."

  - rank: 16
    name: French
    count: 1170
    ratio: 296
    origin: english
    type: Ethnic
    meaning: "An English surname meaning a person from France. In New Hampshire the name gained extra visibility because it fit two different histories at once: an old English colonial surname and the later prominence of French-speaking mill workers from Quebec in cities such as Manchester."

  - rank: 17
    name: White
    count: 1128
    ratio: 307
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually describing very fair hair or complexion. White is one of the oldest plain-English surnames in New Hampshire and stayed widely distributed as settlement moved inland from the seacoast."

  - rank: 18
    name: Perkins
    count: 1104
    ratio: 314
    origin: english
    type: Patronymic
    meaning: "From Perkin, a medieval diminutive of Peter. Perkins is another surname with a distinctly old New England feel, preserved by multigenerational family networks in a small state with strong town continuity."

  - rank: 19
    name: Colby
    count: 1064
    ratio: 326
    origin: english
    type: Habitational
    meaning: "A place-name surname from Old Norse elements meaning dark or coal settlement. Colby is strongly tied to New Hampshire through the Colby family of New London, whose name survives in Colby Hill and Colby-Sawyer College."

  - rank: 20
    name: Sargent
    count: 1049
    ratio: 330
    origin: french
    type: Occupational
    meaning: "From Old French 'sergent', a servant, officer, or military attendant. Sargent is another surname that feels especially New England because it arrived early and stayed rooted in small towns instead of being diluted by later mass immigration."

unique_surnames:
  - name: Sanborn
    state_rank: 5
    national_rank: 1125
    origin: english
    why: "Sanborn is one of New Hampshire's clearest founding-family surnames. Hampton records preserve the name deep into the colonial period, and Sanbornton keeps it visible on the state map, which helps explain why the surname ranks fifth here but sits far lower nationally."

  - name: Kimball
    state_rank: 13
    national_rank: 530
    origin: english
    why: "Kimball remained unusually common in New Hampshire because the family became prominent in central New Hampshire civic life. Concord still has Kimball landmarks, and the name's persistence shows how strongly old local family networks stayed in place."

  - name: Merrill
    state_rank: 15
    national_rank: 476
    origin: english
    why: "Merrill is much more concentrated in northern New England than in the country as a whole, and New Hampshire is one of its strongest centers. The surname reflects older Yankee settlement patterns that never disappeared under a later big-city naming wave."

  - name: Colby
    state_rank: 19
    national_rank: 1211
    origin: english
    why: "Colby is tied closely to New Hampshire through New London, where Joseph Colby and his descendants shaped the town's religious, commercial, and educational life and later gave their name to Colby Academy, now Colby-Sawyer College. That local prominence helps keep the surname far more visible here than nationally."

  - name: French
    state_rank: 16
    national_rank: 226
    origin: english
    why: "French ranks unusually well in New Hampshire because the state's industrial era reinforced an already old surname with a large French-Canadian presence. Manchester's mills were recruiting Quebec workers in French by 1895, and by 1920 more than 50,000 New Hampshire residents had been born in Canada, especially Quebec."

etymology_groups:
  - type: Colonial New England Family Names
    icon: fa-solid fa-map-location-dot
    description: "New Hampshire's most distinctive surname layer is not immigrant and not modern. It is old New England. Sanborn, Kimball, Merrill, Colby, Sargent, and Chase all rank much higher here than their national profiles would suggest because small-town family continuity remained unusually strong from the seventeenth century onward."
    examples:
      - Sanborn (place-name surname)
      - Kimball (from an old personal name)
      - Merrill (old English personal-name surname)
      - Colby (settlement surname)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics still make up a large share of New Hampshire's top 20, but they do not dominate the list the way they do in many Southern and Midwestern states. Davis, Johnson, Stevens, Jones, Thompson, and Perkins stayed strong because the state preserved an older English and Welsh naming base rather than replacing it with newer mass-migration surnames."
    examples:
      - Davis (son of David)
      - Johnson (son of John)
      - Jones (son of John, Welsh)
      - Thompson (son of Thom)

  - type: Occupational and Descriptive Names
    icon: fa-solid fa-hammer
    description: "Smith, Clark, and Sargent show how many of New Hampshire's common surnames began as jobs, while Brown, Young, and White come from plain spoken descriptive labels. That mix fits a state built by small settlements, local trades, mills, and family farms rather than by one giant immigrant metropolis."
    examples:
      - Smith (metalworker)
      - Clark (clerk)
      - Sargent (officer or attendant)
      - Brown (brown-haired or brown-clad)

faq:
  - question: "What are the most common last names in New Hampshire?"
    answer: "The most common last names in New Hampshire are Smith, Brown, Davis, Clark, and Sanborn. That top five is more old New England than most state rankings, with Sanborn standing out as a rare colonial family surname in the statewide top tier."

  - question: "Why are Sanborn and Kimball so common in New Hampshire?"
    answer: "Sanborn and Kimball are so common in New Hampshire because the state kept unusually strong continuity from its colonial and early republic family networks. Small-town settlement, lower big-city churn, and the survival of place names and institutions tied to those families helped keep both surnames far more visible here than in the country as a whole."

