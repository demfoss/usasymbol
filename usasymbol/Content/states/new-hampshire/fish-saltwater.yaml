intro_text: New Hampshire's state saltwater game fish is the striped bass. This silvery fish has dark stripes and visits the state's coast and Great Bay each summer. It was adopted in 1994. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Game Fish of New Hampshire?
  paragraphs:
  - The striped bass is the official state saltwater game fish of New Hampshire. The New Hampshire Legislature gave it this title in 1994. Its scientific name is Morone saxatilis.
  - New Hampshire also has a state freshwater fish, which is the brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass has a long, silvery body with dark stripes along each side. These lines run from behind the head toward the tail.
  - The stripes give the fish nicknames like striper and linesider. Some people also call it rockfish or rock.
  - Striped bass can grow big. Most females are full grown by the time they reach about 36 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Game Fish
  paragraphs:
  - State lawmakers named the striped bass the official state saltwater game fish in 1994. The brook trout became the state freshwater fish in the same year.
  - The state law uses an older scientific name for the fish, Roccus saxatilis.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New Hampshire Chose the Striped Bass
  paragraphs:
  - Official sources name the striped bass without giving a detailed reason. It is the coastal sport fish that anglers in New Hampshire want to catch most.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass migrate. They swim north from the mid-Atlantic in spring and return south in fall.
  - In New Hampshire, they spend about May through October in Great Bay, the Piscataqua River, and along the short Atlantic coast. There they eat small fish like river herring and silversides.
