- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 1994 by the New Hampshire Legislature.
  - Scientific name is Morone saxatilis.
  - Nicknames include striper, linesider, and rockfish.
  - Most females are full grown by about 36 inches long.
  - It visits New Hampshire waters from about May through October.
faq:
- question: What is New Hampshire's state saltwater game fish?
  answer: The striped bass is New Hampshire's state saltwater game fish.
- question: When did New Hampshire adopt the striped bass?
  answer: The New Hampshire Legislature made the striped bass the state saltwater game fish in 1994.
- question: Why did New Hampshire choose the striped bass?
  answer: Official sources do not give a detailed reason. It is the coastal sport fish that New Hampshire anglers want to catch most.
- question: Does the striped bass live in New Hampshire all year?
  answer: No. Striped bass migrate north in spring and south in fall. They usually stay in New Hampshire waters from about May through October.
- question: Why is it called a striped bass?
  answer: Dark stripes run along the sides of its silvery body. These stripes also earn it the nicknames striper and linesider.
