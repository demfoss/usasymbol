intro_text: New Hampshire's state freshwater fish is the brook trout, a colorful, speckled native trout of cold streams and ponds, adopted in 1994. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of New Hampshire?
  paragraphs:
  - The brook trout became New Hampshire's official state freshwater fish under a 1994 state law. Its scientific name is Salvelinus fontinalis.
  - Local anglers also call it the squaretail or the speckled trout. Many people just call it a brookie.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a dark olive-green back covered with pale, wavy, worm-like markings.
  - Its sides have light spots and a few small red spots, and each red spot sits inside a blue ring. The lower fins are orange-red with a bright white front edge, which makes this fish easy to recognize.
  - Its tail is almost straight across instead of deeply forked. That shape gave it the nickname squaretail.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The New Hampshire Legislature passed a law in 1994 naming the brook trout the official state freshwater fish. The law took effect in August 1994.
  - That same year, the state also named the striped bass its state saltwater game fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New Hampshire Chose the Brook Trout
  paragraphs:
  - Official sources name the brook trout without giving a detailed reason. State wildlife biologists describe it as a native fish and New Hampshire's favorite game fish.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Brook trout need cold water with plenty of oxygen, at 68 degrees Fahrenheit or cooler. In New Hampshire they live in meadow brooks, rivers, streams, and ponds.
  - The state's record brook trout came from Pleasant Lake in New London.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1994 by the New Hampshire Legislature.
  - Its scientific name is Salvelinus fontinalis.
  - It is native to eastern North America.
  - New Hampshire's record brook trout was 25.5 inches long and weighed 9 pounds.
  - Its nicknames include squaretail, speckled trout, and brookie.
faq:
- question: What is New Hampshire's state fish?
  answer: New Hampshire's state freshwater fish is the brook trout. The state also has a state saltwater game fish, the striped bass.
- question: When did New Hampshire adopt the Brook trout?
  answer: The New Hampshire Legislature made the brook trout the official state freshwater fish in 1994.
- question: Why did New Hampshire choose the Brook trout?
  answer: The law does not give a detailed reason. State biologists call the brook trout a native fish and New Hampshire's favorite game fish.
- question: How can you tell a brook trout from other trout?
  answer: Look for pale, wavy markings on a dark green back and red spots with blue rings. Its lower fins are orange with a white front edge.
- question: What is the biggest brook trout ever caught in New Hampshire?
  answer: The state record brook trout was 25.5 inches long and weighed 9 pounds. It was caught in Pleasant Lake in New London.
