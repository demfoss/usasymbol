faq:
  - question: "What is New Hampshire's state animal?"
    answer: "New Hampshire's state animal is the white-tailed deer (Odocoileus virginianus), designated in 1983. The species was chosen to honor its recovery from near-extinction in the late 1800s and its representation of New Hampshire's forested character and wildlife conservation success."

  - question: "When was the white-tailed deer designated as New Hampshire's state animal?"
    answer: "The white-tailed deer became New Hampshire's official state animal in 1983 through RSA 3:12, recognizing the species' recovery from complete elimination in southern New Hampshire by 1890 to abundant populations throughout the state by the 1980s."

  - question: "Why did New Hampshire choose the white-tailed deer as its state animal?"
    answer: "New Hampshire chose the white-tailed deer because it represents the state's forested identity, conservation success, and wildlife resilience. By 1890, southern New Hampshire had zero deer—completely eliminated by market hunting and habitat clearing. Recovery through forest regrowth, hunting regulations, and wildlife management funded by hunters demonstrated what science-based conservation can achieve. The deer embodies New Hampshire's character: adaptable, tough, thriving in harsh conditions."

  - question: "Where can I see white-tailed deer in New Hampshire?"
    answer: "White-tailed deer can be seen throughout New Hampshire, with the best opportunities along the Kancamagus Highway, Crawford Notch State Park, Franconia Notch State Park, White Mountain National Forest, Connecticut River Valley, and in suburban areas statewide. Dawn and dusk provide optimal viewing times when deer emerge from bedding areas to feed."

  - question: "How many white-tailed deer live in New Hampshire?"
    answer: "New Hampshire has approximately 100,000 white-tailed deer statewide (2023 estimate), with populations highest in southern and central regions. Annual hunting harvests typically range from 12,000-15,000 deer, maintaining populations within sustainable levels while providing recreational opportunities and funding conservation through license sales and equipment taxes."

  - question: "Did white-tailed deer almost go extinct in New Hampshire?"
    answer: "Yes—white-tailed deer were completely eliminated from southern New Hampshire by 1890, with the region counting zero deer. Market hunting and agricultural land clearing destroyed populations that once thrived throughout the state. Only scattered survivors in remote northern forests prevented total extirpation. Recovery began in the early 1900s through logging creating browse habitat, hunting regulations, and ultimately the 1937 Pittman-Robertson Act funding state wildlife programs."

  - question: "How fast can white-tailed deer run?"
    answer: "White-tailed deer can run up to 40 miles per hour for short distances, leap over 9-foot obstacles, and swim at speeds up to 13 miles per hour. When fleeing danger, they bound in a distinctive high-jumping gait, waving their white tails side-to-side to warn other deer. These athletic abilities help deer escape predators including coyotes, black bears, and occasionally bobcats."

  - question: "What threatens white-tailed deer in New Hampshire today?"
    answer: "Modern threats include vehicle collisions (approximately 1,200 annually in New Hampshire), severe winter weather causing mortality during deep snow years, chronic wasting disease risk (not yet detected in NH but present in nearby states), habitat fragmentation from development, and conflicts with humans in suburban areas. Despite these challenges, New Hampshire's deer population remains healthy under active management by the Fish and Game Department."

