distinctive_traits: "Short 'bobbed' tail (4-7 inches), tufted ears, broad cheek ruff with thin black lines, white patch on back of each ear (guides for kittens), excellent night vision and hearing"

habitat: "Scrubby or broken forests (hardwood, coniferous, mixed), swamps, farmland, rocky/bushy areas; requires large unfragmented tracts with connectivity"
range_in_state: "All 10 New Hampshire counties from Massachusetts to Canadian border; White Mountain range divides two subspecies (Lynx rufus gigas in NH); populations historically strongest in southwest corner, now statewide"
