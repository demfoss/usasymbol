faq:
  - question: "What is New Hampshire's state wildcat?"
    answer: "New Hampshire's state wildcat is the bobcat (Lynx rufus), designated in 2015 following a two-year advocacy campaign by fourth and fifth graders at The Well School in Peterborough. The species was chosen to honor its recovery from near-elimination by bounty hunters and to represent the wild character of New Hampshire's forests."

  - question: "When was the bobcat designated as New Hampshire's state wildcat?"
    answer: "The bobcat became New Hampshire's official state wildcat on June 5, 2015, when Governor Maggie Hassan signed House Bill 423 into law. The designation became effective August 4, 2015. Representative Jonathan Manley sponsored the bill on behalf of The Well School students who researched and advocated for the designation."

  - question: "Why did New Hampshire choose the bobcat as its state wildcat?"
    answer: "New Hampshire chose the bobcat because it represents the wild, untamed character of the state's forests and successful conservation recovery. Bounty hunting from 1809-1973 nearly eliminated bobcats from New Hampshire, but protection and closed hunting seasons since 1989 enabled dramatic recovery to approximately 1,400 animals today. The designation also connects to the University of New Hampshire's Wildcats mascot and celebrates student civic engagement—elementary students championed the designation through research and legislative advocacy."

  - question: "How many bobcats live in New Hampshire?"
    answer: "New Hampshire has approximately 1,400 bobcats statewide, with populations increasing 10-12% annually. Bobcats now inhabit all ten counties from the Massachusetts border to Canada. University of New Hampshire research shows greater genetic diversity in today's population compared to the 1950s-1960s, indicating a healthier, more resilient population recovering from historical persecution."

  - question: "Where can I see bobcats in New Hampshire?"
    answer: "Bobcats are extremely difficult to see in the wild due to nocturnal habits and wariness of humans. The best viewing opportunities are Bear Brook State Park (Alton) where bobcats are regularly photographed along campground roads, and Squam Lakes Natural Science Center (Holderness) which maintains captive bobcats for education. Trail cameras (wildlife cameras) provide the most reliable method for documenting bobcats in your area. Dawn and early morning offer the best chances for wild sightings."

  - question: "Is it legal to hunt bobcats in New Hampshire?"
    answer: "No—bobcat hunting and trapping have been closed in New Hampshire since 1989 and remain prohibited today. New Hampshire closed harvest seasons due to population concerns following decades of bounty hunting (1809-1973). Neighboring states (Maine, Massachusetts, Vermont) allow regulated bobcat harvest, but New Hampshire prioritizes non-consumptive values including wildlife observation, ecosystem services, and research over hunting."

  - question: "How do bobcats differ from Canada lynx?"
    answer: "Bobcats and Canada lynx both inhabit New Hampshire but differ in several ways. Lynx have larger, heavily furred feet functioning as snowshoes for traveling atop deep snow, while bobcats have smaller feet causing them to sink in powder. Lynx have longer ear tufts and shorter tails than bobcats. Lynx prefer northern boreal forests with deep snow (Pittsburg, White Mountains), while bobcats range statewide. Lynx populations remain extremely limited in New Hampshire with confirmed breeding only in Pittsburg (2011), while bobcats are relatively common."

  - question: "Are bobcats dangerous to humans?"
    answer: "No—bobcats pose virtually no threat to humans. There are no documented attacks on people in New Hampshire. Bobcats avoid humans whenever possible due to their secretive, wary nature. They may occasionally take free-roaming cats or chickens but predation rates are low. Most New Hampshire residents live near bobcats without ever seeing one. If encountered, bobcats typically flee immediately. Maintaining safe distance and never approaching wildlife protects both people and animals."

