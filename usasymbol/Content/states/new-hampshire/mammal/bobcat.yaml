title: "New Hampshire State Wildcat | Bobcat"
scientific_name: "Lynx rufus"
adopted_year: 2015

seo_title: "New Hampshire State Wildcat | Bobcat"
seo_description: "New Hampshire's state wildcat is the Bobcat, adopted in 2015. Learn why this official New Hampshire symbol was chosen and what it represents."

intro_text: "The Bobcat is the official New Hampshire state wildcat, designated in 2015. This page gives the direct answer for searches like 'new hampshire state wildcat', 'new hampshire state animal', and 'new hampshire state mammal' while explaining how the symbol fits the state's official animal designations. Short 'bobbed' tail, tufted ears, spotted coat, nocturnal habits, ability to sprint 30 mph, ambush hunting technique, excellent night vision. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Bobcat"
official_since: "2015 (signed June 5, effective August 4)"
status: "Recovered population of ~1,400 in New Hampshire; increasing 10-12% annually; greater genetic diversity than 1950s-1960s; hunting/trapping closed since 1989"
habitat_in_state: "Mixed forests, young forest stands with dense undergrowth, rock ledges, wetlands, swamps, forest edges; found in all 10 New Hampshire counties"
known_for: "Short 'bobbed' tail, tufted ears, spotted coat, nocturnal habits, ability to sprint 30 mph, ambush hunting technique, excellent night vision"

size: "28 to 49 inches long; 19 to 22 inches tall at shoulder"
weight: "Males average 27 pounds in NH; females average 17 pounds; largest recorded 51 pounds (Pittsburg, 1927); 45-pound male road-killed Tuftonboro (2017)"
