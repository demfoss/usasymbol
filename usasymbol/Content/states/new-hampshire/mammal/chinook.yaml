faq:
  - question: "What is New Hampshire's state dog?"
    answer: "New Hampshire's state dog is the Chinook, designated when Governor John Lynch signed House Bill 62 on August 7, 2009. The Chinook is a rare sled dog breed developed in Wonalancet, New Hampshire beginning in 1917."
  
  - question: "When was the Chinook designated as New Hampshire's state dog?"
    answer: "The Chinook became New Hampshire's official state dog on August 7, 2009, when Governor John Lynch signed House Bill 62. The designation followed a successful campaign by seventh-grade students at Ross A. Lurgio Middle School in Bedford."
  
  - question: "Who created the Chinook breed?"
    answer: "Arthur Treadwell Walden created the Chinook breed at his Wonalancet Farm in Tamworth, New Hampshire. The foundation dog Chinook was born January 17, 1917, from a Greenland Husky (descended from Admiral Peary's North Pole expedition dogs) crossed with a Mastiff/St. Bernard-type farm dog. Walden systematically bred Chinook and his offspring to create a breed combining power, endurance, speed, and gentle temperament."
  
  - question: "What happened to the original Chinook dog?"
    answer: "The foundation dog Chinook accompanied Arthur Walden on Admiral Richard E. Byrd's 1928-1930 Antarctic expedition. On January 17, 1929—Chinook's 12th birthday—the aging lead dog disappeared while teams moved supplies to base camp in Antarctica. Despite extensive searches, Chinook was never found. News of his death spread worldwide, and many mourned the loss of one of history's greatest lead dogs. At Walden's request, Route 113A from Tamworth to Wonalancet, New Hampshire bears the name 'Chinook Trail' to honor him."
  
  - question: "Why was the Chinook breed nearly extinct?"
    answer: "The Chinook nearly went extinct because Perry and Honey Greene, who became sole breeders after purchasing all remaining dogs in 1940, sold only neutered males or spayed females for decades, preventing anyone else from breeding Chinooks. When Perry Greene died in 1963, the population collapsed. By 1965, only 125 Chinooks existed (Guinness World Record for rarest dog). By 1981, only 11 breedable dogs remained. Dedicated breeders Neil and Marra Wollpert, Kathy Adams, and Peter Abrahams saved the breed through coordinated breeding programs and a UKC crossbreeding initiative."
  
  - question: "How many Chinooks exist today?"
    answer: "As of 2025, approximately 800-1,100 Chinooks are registered worldwide, with only about 100 puppies born annually. While recovered from the 1981 crisis when only 11 breedable dogs survived, the Chinook remains one of the world's rarest dog breeds. The breed received full American Kennel Club recognition in 2013, joining the Working Group."
  
  - question: "What role did students play in the state dog designation?"
    answer: "Seventh-grade students at Ross A. Lurgio Middle School in Bedford, New Hampshire led the successful campaign to make the Chinook the state dog. Their teacher, Jen Johnson Wells, was a Chinook owner who brought her dogs to school events. Students researched the breed's New Hampshire origins, discovered 12 other states had state dogs but most lacked the strong ties Chinooks had to New Hampshire, drafted legislation, testified at committee hearings, and watched their bill pass. The entire 100-student class traveled to the State House for the final vote, and House members recognized the students for their civic engagement."
  
  - question: "What makes the Chinook unique?"
    answer: "The Chinook is the only dog breed to originate in New Hampshire and one of the few breeds created entirely in the United States. The breed was developed to combine the power of large freight dogs with the speed of racing sled dogs while maintaining gentle, friendly temperament. All Chinooks descend from the single foundation dog born in 1917. The breed is distinguished by its tawny coat (ranging from pale honey to reddish-gold), black facial markings, muscular athletic build, and gentle nature. Chinooks excel at sledding, packing, skijoring, obedience, and as family companions."

