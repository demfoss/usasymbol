sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is New Hampshire's State Vegetable?"
    paragraphs:
      - "The white potato is New Hampshire's official state vegetable, designated by the New Hampshire General Court in 2013. The state credits the town of Londonderry with growing one of the first potato crops in colonial America."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the White Potato"
    paragraphs:
      - "White potatoes are starchy tubers with thin, light-colored skin and white flesh. They grow underground and are typically planted in spring and harvested by early fall, then baked, boiled, or mashed."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the White Potato Became New Hampshire's State Vegetable"
    paragraphs:
      - "The New Hampshire General Court designated the white potato the official state vegetable in 2013, following a campaign led by elementary school students who researched the state's potato history and petitioned lawmakers."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Hampshire Chose the White Potato"
    paragraphs:
      - "New Hampshire chose the white potato because of its historic link to Londonderry, where Scots-Irish settlers are credited with growing one of the earliest potato crops in the American colonies in the early 1700s."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the White Potato Comes From in New Hampshire"
    paragraphs:
      - "The white potato's history in New Hampshire centers on the town of Londonderry, where early Scots-Irish settlers are credited with one of the first potato crops grown in colonial America."
