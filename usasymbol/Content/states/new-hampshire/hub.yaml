name_meaning:
  heading: What Does New Hampshire Mean?
  paragraphs:
  - New Hampshire entered the Union in 1788 and became the 9th state. Its name comes from Hampshire, a county in southern England, and was applied to the colony by Captain John Mason.
  - The name is English, but the official imagery is strongly New England. White birch, purple lilac, apple cider, bobcat, deer, and the Chinook make the state feel cold-climate, wooded, and local rather than merely colonial.
  - New Hampshire's postal abbreviation is NH, and residents are New Hampshirites or Granite Staters. The Granite State nickname is tied to the state's rocky landscape and quarrying history.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for Hampshire, England.
    - label: Statehood
      text: New Hampshire ratified the Constitution in 1788, becoming the 9th state.
    - label: Motto
      text: Live Free or Die is one of the best-known state mottoes in the United States.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to New Hampshire, a northern New England state with mountains, forests, lakes, and a short Atlantic coast.
    - label: People
      text: People from New Hampshire are often called New Hampshirites.
    - label: Landscape
      text: The Granite State nickname points to the state's rocky terrain and stoneworking identity.
  - heading: Nicknames and Short Forms
    items:
    - label: The Granite State
      text: Main nickname, reflected in New Hampshire's public identity.
    - label: Live Free or Die State
      text: Informal identity built from the state motto.
    - label: Abbreviation
      text: NH; older short form N.H.
editorial:
  heading: What New Hampshire's Symbols Say About the State
  paragraphs:
  - New Hampshire's [motto](/states/new-hampshire/motto) does more work than most state mottoes. Live Free or Die gives the hub its voice before the natural symbols arrive, and it explains why the state often presents independence as a civic temperament.
  - The [white birch](/states/new-hampshire/tree), [purple lilac](/states/new-hampshire/flower), and [purple finch](/states/new-hampshire/bird) keep the guide rooted in northern New England yards and forests. The birch especially feels like a living version of the state's green-and-white landscape palette.
  - The mammal pages make the set less predictable. The [Chinook](/states/new-hampshire/mammal/chinook) is a New Hampshire-origin dog breed, while the [bobcat](/states/new-hampshire/mammal/bobcat) gives the state a quiet wildcat symbol that fits the forests better than a postcard view.
faq:
- question: What is New Hampshire's most famous state symbol?
  answer: The [Live Free or Die motto](/states/new-hampshire/motto) is the phrase most people recognize first, even outside official-symbol lists.
- question: What is New Hampshire's state bird?
  answer: New Hampshire's state bird is the [purple finch](/states/new-hampshire/bird), adopted in 1957.
- question: What is New Hampshire's state flower?
  answer: New Hampshire's state flower is the [purple lilac](/states/new-hampshire/flower), adopted in 1919.
- question: Why is the Chinook important to New Hampshire?
  answer: The [Chinook](/states/new-hampshire/mammal/chinook) is listed because it is a dog breed developed in New Hampshire and has its own state-symbol page.
- question: How many official state symbols does New Hampshire have?
  answer: New Hampshire's hub includes pages for the flag, finch, lilac, white birch, motto, nickname, apple cider, colors, deer, bobcat, and Chinook.
