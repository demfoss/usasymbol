seo_description: "New Hampshire state symbols: official state symbols include the purple finch, purple lilac, white birch, Granite State nickname, and Live Free or Die motto."
snippet_answer: Live Free or Die is the most widely recognized of all New Hampshire's official state symbols and one of the most quoted state mottos in the country. The purple finch, purple lilac, white birch, Granite State nickname, and the locally developed Chinook dog round out a list where the motto leads everything else.
