hero_image_alt: "Orange pumpkins in a New Hampshire field."
hero_image_caption: "The pumpkin, New Hampshire's official state fruit."
intro_text: "New Hampshire's state fruit is the pumpkin, adopted in 2006 to recognize a crop grown across the state and celebrated each fall at local festivals. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is New Hampshire's State Fruit?"
    paragraphs:
      - "The pumpkin is New Hampshire's official state fruit, designated by the New Hampshire General Court in 2006. Pumpkins are grown on farms across the state and are botanically classified as a fruit."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pumpkin"
    paragraphs:
      - "Pumpkins are large, round, orange squash that grow on sprawling vines. In New Hampshire they are harvested in fall, when farms sell them for carving, baking, and seasonal decoration."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pumpkin Became New Hampshire's State Fruit"
    paragraphs:
      - "The New Hampshire General Court designated the pumpkin the official state fruit in 2006, following a campaign by New Hampshire students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Hampshire Chose the Pumpkin"
    paragraphs:
      - "New Hampshire towns, including Keene, have long held large fall pumpkin festivals, and pumpkin growing is a familiar part of the state's farm economy and autumn traditions."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Pumpkin Comes From in New Hampshire"
    paragraphs:
      - "Keene, in southwestern New Hampshire, has been home to large annual pumpkin festivals that once set world records for the most jack-o'-lanterns lit in one place."
    sites:
      - name: Keene
        city: Keene
        lat: 42.93
        lng: -72.28
        note: "Home to New Hampshire's pumpkin festivals"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pumpkin Facts"
    facts:
      - "Adopted as New Hampshire's state fruit in 2006."
      - "Pumpkins are botanically classified as a fruit, not a vegetable."
      - "Keene, New Hampshire has hosted major fall pumpkin festivals."

