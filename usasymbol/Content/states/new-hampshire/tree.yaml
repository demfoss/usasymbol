seo_title: "New Hampshire State Tree | White Birch"
seo_description: 'New Hampshire made white birch its state tree in 1947, choosing a cold-climate forest tree known for pale bark and mountain scenery.'

intro_text: "New Hampshire adopted the White Birch as its state tree in 1947. Its bright bark and northern range make it one of the trees most closely associated with the state's mountains and cold-climate forests. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of New Hampshire"
    paragraphs:
      - "New Hampshire's official state tree is the White Birch, commonly called Paper Birch for its distinctive peeling bark. This medium-sized deciduous hardwood grows 50 to 70 feet tall in New Hampshire, with exceptional specimens reaching 80 feet or more. The trunk measures one to two feet in diameter on mature trees. White birch grows rapidly in youth, adding two to three feet per year, but remains relatively short-lived compared to oaks and maples, typically surviving 80 to 140 years. The tree thrives in New Hampshire's northern climate, tolerating extreme cold that would kill many hardwood species. White birch forests regenerate naturally after logging or fire, often forming pure stands that gradually give way to longer-lived hardwoods."
      - "The bark provides the tree's most recognizable feature and gives white birch both its common names. Young trees show reddish-brown bark that begins turning white around 8 to 10 years of age. Mature bark appears brilliant white with distinctive horizontal black markings called lenticels. The bark peels naturally in thin papery sheets that curl away from the trunk. This papery quality inspired the name Paper Birch. The white bark reflects sunlight and helps prevent the trunk from overheating in summer. Beneath the white outer bark lies orangish inner bark. The leaves are triangular or heart-shaped, measuring two to four inches long with doubly serrated edges - large teeth with smaller teeth along them. Leaves turn bright yellow in fall, creating spectacular autumn displays across New Hampshire hillsides."
      - "White birch grows throughout New Hampshire from valleys to mountain slopes. The species thrives across the state but grows most abundantly in the White Mountains and northern counties. New Hampshire's cool, moist climate provides ideal conditions for white birch. The tree grows on a variety of soil types from rocky mountain slopes to valley bottoms. White birch often pioneers disturbed sites, sprouting prolifically after forest fires or logging. Pure birch stands develop after disturbances, their white trunks creating ghostly groves. The tree provides food and habitat for New Hampshire wildlife including ruffed grouse, which eat the buds, and moose and deer, which browse young bark and twigs, including [the white-tailed deer state animal](/states/new-hampshire/mammal/white-tailed-deer)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the White Birch"
    paragraphs:
      - "The official designation uses White Birch, though Paper Birch is equally common in New Hampshire. Both names describe the distinctive white, papery bark. The scientific name Betula papyrifera combines Betula (Latin for birch) with papyrifera (Latin for 'paper-bearing'), directly referencing the peeling bark. Early New Hampshire settlers called it canoe birch for Native American use of bark in canoe construction. The genus Betula includes about 60 birch species worldwide."
      - "Some New Hampshire references use silver birch, though this technically refers to a European species. Native Americans had various names - the Abenaki called it maskwa. New Hampshire loggers sometimes called it white lady for the pale bark. The species belongs to the Betulaceae family, the birch family. New Hampshire's white birch is the same species that grows across northern North America from Alaska to Newfoundland and south through the northern United States. The tree grows naturally wherever climates remain cool enough to support it."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why White Birch Became the New Hampshire State Tree"
    paragraphs:
      - "New Hampshire made the White Birch its official state tree on March 11, 1947. The New Hampshire Legislature passed the designation during the 1947 session. The legislation recognized white birch as a tree closely associated with New Hampshire's landscape and northern character. By 1947, white birch had become emblematic of New Hampshire forests, appearing frequently on postcards and tourism materials showing the state's white-birch forests. The white trunks set against evergreen conifers created the quintessential New Hampshire forest scene and often appear alongside [the Purple Finch state bird](/states/new-hampshire/bird/purple-finch)."
      - "New Hampshire selected white birch because it exemplifies the state's northern forest environment. The tree thrives in New Hampshire's cold winters and cool summers, conditions that define the state's climate. White birch grows abundantly across New Hampshire, particularly in the White Mountains that give the state its most famous landmark and tourism destination. The white bark stands out visually in New Hampshire forests, making birch groves memorable for residents and visitors. The tree's presence throughout the state meant every New Hampshire citizen could easily recognize and appreciate the state tree symbol, reinforcing the character of [the Granite State](/states/new-hampshire/nickname/the-granite-state)."
      - "The tree held deep historical significance for New Hampshire's indigenous peoples and early settlers. The Abenaki and Pennacook tribes used white birch bark to construct lightweight canoes that navigated New Hampshire's rivers and lakes. A single large birch could provide enough bark for an entire canoe. The waterproof bark also covered wigwams and made containers for storing food and water. New Hampshire settlers quickly adopted birch bark for similar purposes. The wood provided fuel for heating and cooking - it burns readily even when green. New Hampshire's lumber industry used white birch for furniture, flooring, toothpicks, and popsicle sticks. The wood's fine grain suited it for turned products like spools and bobbins used in New Hampshire's textile mills. The combination of visual beauty, Native American heritage, and practical uses made white birch an ideal symbol for New Hampshire. The tree represented both the state's forest landscape and the resourcefulness required to thrive in northern New England."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Hampshire State Tree Facts"
    facts:
      - "New Hampshire made White Birch the state tree on March 11, 1947, recognizing a species that thrives in the state's northern climate"
      - "The brilliant white bark with black horizontal markings (lenticels) makes white birch instantly recognizable in New Hampshire forests"
      - "Native Americans used white birch bark to construct canoes - a single large tree could provide enough bark for an entire watercraft"
      - "The bark peels naturally in thin papery layers that are waterproof and rot-resistant, making them useful for roofing and containers"
      - "White birch is often the first tree to colonize disturbed areas in New Hampshire, sprouting prolifically after fires or logging"
      - "The white bark reflects sunlight and helps keep the trunk cool in summer - without this protection, dark bark would overheat"
      - "New Hampshire's white birch sap can be tapped like maple for syrup production, though birch syrup is less common and more labor-intensive"
      - "The tree's fall color creates spectacular yellow hillsides across New Hampshire each autumn, especially in the White Mountains"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "New Hampshire State Tree and Flower"
    paragraphs:
      - "New Hampshire's state flower is the Purple Lilac (Syringa vulgaris), designated in 1919. The state adopted its floral symbol 28 years before choosing white birch. Both symbols reflect New Hampshire's New England character. The fragrant purple lilac blooms in May around historic New Hampshire homes and villages, while white birch towers over forests across the state. The lilac's spring blossoms appear as white birch leaves emerge light green. The pair covers New Hampshire from cultivated gardens to wild forests; compare with [the New Hampshire state flower page](/states/new-hampshire/flower/purple-lilac). The lilac came from Europe while white birch is native, showing both New Hampshire's colonial heritage and natural landscape."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a New Hampshire White Birch"
    paragraphs:
      - "The bark provides instant identification. Look for brilliant white bark covered with distinctive horizontal black lines and marks called lenticels. The bark peels naturally in thin papery sheets that curl away from the trunk. Young white birch bark starts reddish-brown and gradually turns white over several years. Very old trees develop rough, dark bark at the base while maintaining white bark above. The white color distinguishes this species from gray birch, another New Hampshire birch that has non-peeling gray bark with black triangular marks. White birch bark feels papery and tears easily into strips."
      - "The leaves help confirm identification outside the distinctive bark. Each leaf has a triangular or heart-shaped form measuring two to four inches long. The edges show doubly serrated teeth - large teeth with smaller teeth along them. The leaves attach to twigs in an alternate pattern. Leaf color is bright green in summer, turning spectacular golden yellow in fall before dropping. The leaves often have slightly hairy undersides. Twigs are slender, reddish-brown, and rough with warty glands when young, becoming smooth with age."
      - "The overall form shows a single straight trunk or sometimes multiple trunks from the base. Young trees develop narrow, pyramidal crowns. Mature trees form irregular, somewhat open crowns with ascending branches. The crown shape appears less dense than maples or oaks, allowing dappled sunlight to reach the forest floor beneath white birch stands. In spring, white birch produces hanging catkins that shed pollen. The female catkins mature into small cone-like structures that break apart in fall to release tiny winged seeds. Look for dark, rough bark at the base of old trees transitioning to smooth white bark higher up."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the New Hampshire State Tree Symbolizes"
    paragraphs:
      - "White Birch represents New Hampshire's northern character and white-bark forests. The tree symbolizes the hardiness needed to thrive in New Hampshire's challenging climate. For many New Hampshire residents, white birch groves evoke childhood memories of hiking the White Mountains or walking northern forests. The species connects modern New Hampshire to Native American heritage through the canoe-building tradition. The tree's pioneering nature - quickly colonizing disturbed land - reflects [New Hampshire's motto, Live Free or Die](/states/new-hampshire/motto/live-free-or-die) and the independent spirit of its people. White birch reflects the landscape that defines New Hampshire's character as a northern New England state where wild forests meet rugged mountains."

faq:
  - question: "What is the New Hampshire state tree?"
    answer: "The White Birch (Betula papyrifera) is New Hampshire's official state tree. The New Hampshire Legislature made it the state tree on March 11, 1947. It's also called Paper Birch for its distinctive peeling white bark."
  
  - question: "What is the New Hampshire state tree called?"
    answer: "New Hampshire's state tree is called White Birch or Paper Birch. The scientific name is Betula papyrifera, meaning 'paper-bearing birch.' It's also been called canoe birch for Native American use or white lady. Early names include silver birch."
  
  - question: "When was the New Hampshire state tree adopted?"
    answer: "New Hampshire made the White Birch its official state tree on March 11, 1947. The Legislature passed the designation during the 1947 session, recognizing a tree that exemplifies New Hampshire's northern forests and climate."
  
  - question: "Why is the White Birch New Hampshire's state tree?"
    answer: "New Hampshire selected white birch because it exemplifies the state's northern forest environment and thrives in New Hampshire's cold winters. The tree grows abundantly across the state, especially in the White Mountains. The distinctive white bark creates the quintessential New Hampshire forest scene. Native Americans used birch bark for canoes, and the tree has deep historical significance. The combination of visual beauty, widespread presence, and cultural importance made it ideal for New Hampshire's symbol."
  
  - question: "What is the New Hampshire state tree name?"
    answer: "The name is White Birch or Paper Birch. The scientific name is Betula papyrifera - Betula means birch, and papyrifera means 'paper-bearing,' referring to the peeling white bark that resembles paper."
  
  - question: "Where does the New Hampshire state tree grow?"
    answer: "The White Birch grows throughout New Hampshire from valleys to mountain slopes. It thrives across the state but is most abundant in the White Mountains and northern counties. White birch grows naturally across northern North America from Alaska to Newfoundland and south through northern states wherever climates remain cool."
  
  - question: "What are some facts about the New Hampshire state tree?"
    answer: "The White Birch grows 50 to 70 feet tall with brilliant white bark marked by horizontal black lenticels. Native Americans used the bark to build canoes. The bark peels in papery layers and is waterproof. The tree is often first to colonize disturbed areas. Birch sap can be tapped for syrup. The white bark reflects sunlight to keep the trunk cool. Fall foliage turns bright yellow across New Hampshire hillsides."
  
  - question: "How do you recognize the New Hampshire state tree?"
    answer: "Look for brilliant white bark with distinctive horizontal black lines (lenticels). The bark peels naturally in thin papery sheets. Young trees have reddish-brown bark that turns white after 8 to 10 years. Leaves are triangular or heart-shaped (two to four inches) with doubly serrated edges. The leaves turn bright yellow in fall. The white bark distinguishes it from gray birch, which has non-peeling gray bark."

