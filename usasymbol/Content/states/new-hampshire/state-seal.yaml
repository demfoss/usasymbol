timeline:
- year: '1775'
  description: The Continental Congress authorizes construction of thirteen frigates for the new American navy in December. New Hampshire is assigned one of them, to be built at Portsmouth.
- year: '1776'
  description: The frigate Raleigh is built at the Portsmouth shipyard and launched. It becomes one of the first warships of the Continental Navy and the central image later chosen for the state seal.
- year: '1784'
  description: New Hampshire adopts its state seal under the permanent state constitution. The design centers on the ship under construction with granite rocks and a rising sun.
- year: '1788'
  description: New Hampshire ratifies the U.S. Constitution on June 21, becoming the ninth state to do so. The ninth ratification brought the Constitution into legal effect.
- year: '1931'
  description: The legislature standardizes the seal to its current authoritative version under New Hampshire RSA 3:1, fixing proportions, engraving details, and border text.

faq:
- question: What does the New Hampshire state seal show?
  answer: New Hampshire's state seal shows a ship under construction on the stocks, granite rocks in the foreground, a rising sun in the background, and a laurel wreath encircling the central image. The outer ring reads "Seal of the State of New Hampshire."
- question: What ship is on the New Hampshire state seal?
  answer: The ship is traditionally identified as the frigate Raleigh, one of the first thirteen warships authorized by the Continental Congress in December 1775. The Raleigh was built at Portsmouth, New Hampshire, and launched in 1776 for service in the Continental Navy.
- question: Why is a ship on the New Hampshire state seal?
  answer: The ship connects New Hampshire to the founding of the American navy. Portsmouth was one of the most active shipbuilding ports in colonial America, and the Raleigh was one of the first naval vessels built for the Continental Congress. The seal placed that contribution at the center of the state's identity in 1784.
- question: What do the granite rocks on the New Hampshire state seal mean?
  answer: The granite rocks represent New Hampshire's physical landscape. Granite is the dominant stone of the White Mountains and northern New England, and it gave the state its informal name, the Granite State. Placing rocks at the base of the image made geology the foundation of the official design.
- question: When was the New Hampshire state seal adopted?
  answer: New Hampshire adopted its state seal in 1784, under the permanent state constitution. The seal was standardized to its current authoritative version in 1931 under New Hampshire RSA 3:1.
- question: Has the New Hampshire state seal changed over time?
  answer: The composition has not changed since 1784. The ship on the stocks, granite rocks, rising sun, and laurel wreath appear in every version. The seal was standardized in 1931 to fix proportions and engraving details for consistent official use.

