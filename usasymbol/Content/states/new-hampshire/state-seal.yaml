sections:
- id: history
  icon: fa-solid fa-landmark
  title: New Hampshire State Seal History and Origin
  paragraphs:
  - "New Hampshire adopted its state seal in 1784, under the permanent state constitution that replaced the temporary wartime government. The design placed a ship under construction at its center, a direct reference to Portsmouth's role in building the Continental Navy. The frigate Raleigh, one of the thirteen warships authorized by the Continental Congress in December 1775, had been built and launched from Portsmouth in 1776."
  - "Portsmouth was among the most active shipbuilding ports in colonial America. The choice of a ship on the stocks rather than a finished vessel at sea emphasized production over ceremony, identifying the state with naval labor rather than naval command."
  - "The seal was revised and standardized in 1931. The core composition, the ship, the granite rocks, the rising sun, and the laurel wreath, remained unchanged from 1784. The revision fixed proportions and engraving details to create a consistent standard for official use under New Hampshire RSA 3:1."

- id: elements
  icon: fa-solid fa-shapes
  title: What the New Hampshire State Seal Symbols Mean
  paragraphs:
  - "New Hampshire's state seal uses four main elements to connect the state to the founding era and to the physical character of New England."
  elements:
  - id: ship-raleigh
    name: The Ship on the Stocks
    image: /images/state-seals/new-hampshire/elements/ship.webp
    paragraphs:
    - "The central image is a ship under construction on the stocks, meaning on the frame before launching. The ship is traditionally identified as the frigate Raleigh, one of thirteen warships authorized by the Continental Congress in December 1775 and built at Portsmouth, New Hampshire. The Raleigh was launched in 1776 and served in the Continental Navy during the Revolutionary War."
    - "Showing the ship under construction rather than at sea was an unusual choice for a state seal. It placed New Hampshire's identity in the act of building rather than in a finished emblem of power, reflecting the state's role as a producer of naval vessels rather than as a naval command."
  - id: rising-sun
    name: Rising Sun
    image: /images/state-seals/new-hampshire/elements/rising-sun.webp
    paragraphs:
    - "A rising sun appears behind the ship, its rays spreading across the upper field of the seal. Sunrise imagery was used widely in the founding era to represent the dawn of American independence and the start of republican self-government."
    - "In the New Hampshire design, the sun rises behind a working shipyard rather than above an open landscape. The image ties founding-era symbolism directly to the Portsmouth waterfront where the Raleigh was built."
  - id: granite-rocks
    name: Granite Rocks
    image: /images/state-seals/new-hampshire/elements/granite.webp
    paragraphs:
    - "Granite rocks appear in the foreground below the ship. They reference New Hampshire's bedrock landscape directly: the White Mountains and the hills of northern New England are composed largely of granite, and the stone defines the physical character of the region."
    - "The rocks gave New Hampshire its enduring informal name, the Granite State, and their placement in the foreground of the seal made that geological identity a foundational element of the official design from 1784 onward."
  - id: laurel-wreath
    name: Laurel Wreath
    image: /images/state-seals/new-hampshire/elements/laurel-wreath.webp
    paragraphs:
    - "A laurel wreath encircles the central image. Laurel carried classical associations with honor and victory in Greek and Roman tradition, and its use in founding-era American seals connected the new republic to the democratic heritage of antiquity."
    - "In the New Hampshire seal, the laurel wreath frames the ship and landscape, creating a visual border between the inner image and the outer ring of text. It marks the design as a formal emblem rather than an illustration."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the New Hampshire State Seal'
  paragraphs:
  - "New Hampshire's state seal has kept the same core composition since 1784. The ship on the stocks, the granite rocks, the rising sun, and the laurel wreath have appeared in every version. Revisions affected engraving quality and proportions, not the elements themselves."
  versions:
  - name: Original Seal (1784)
    years: 1784–1930
    image: /images/state-seals/new-hampshire/versions/new-hampshire-state-seal-1904.png
    description: Adopted by the New Hampshire legislature in 1784 under the permanent state constitution. The composition centered on the ship under construction with granite rocks and a rising sun. No single standardized rendering was mandated, and engraving quality varied across official applications.
  - name: Standardized Seal (1931–present)
    years: 1931–present
    image: /images/state-seals/new-hampshire/versions/seal-of-the-state-of-new-hampshire.svg
    description: The current authoritative version, standardized in 1931 under New Hampshire RSA 3:1. Proportions, engraving details, and border text were codified. All official uses of the seal are required to conform to this standard.

- id: facts
  icon: fa-solid fa-lightbulb
  title: New Hampshire State Seal Facts
  facts:
  - 'Adopted: 1784, under the permanent New Hampshire state constitution'
  - 'Standardized: 1931 under New Hampshire RSA 3:1'
  - 'Central image: ship under construction, traditionally identified as the frigate Raleigh'
