faq:
- question: What is New Hampshire's license plate slogan?
  answer: New Hampshire's license plate slogan is "Live Free or Die."
- question: When did Live Free or Die first appear on New Hampshire plates?
  answer: '"Live Free or Die" first appeared on New Hampshire standard plates in 1971.'
- question: Where does Live Free or Die come from?
  answer: 'The phrase comes from an 1809 toast written by Revolutionary War General John Stark: "Live Free or Die: Death is not the worst of evils."'
- question: What did New Hampshire plates say before Live Free or Die?
  answer: They used "SCENIC" from 1957 through 1970, with a one-year "PHOTOSCENIC" exception in 1963.
- question: Can New Hampshire force residents to display Live Free or Die?
  answer: No. In Wooley v. Maynard (1977), the U.S. Supreme Court ruled that the state could not punish residents for covering the motto when they objected to displaying it.
- question: What is on the current New Hampshire plate?
  answer: The current base, introduced in January 1999, shows the Old Man of the Mountain and Cannon Mountain, with "LIVE FREE OR DIE" at the top.

