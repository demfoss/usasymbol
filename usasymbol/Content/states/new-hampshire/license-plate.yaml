seo_title: 'New Hampshire License Plate: Live Free or Die Slogan, Scenic Era & History'
seo_description: New Hampshire's standard license plates have carried "Live Free or Die" since 1971. Earlier plates used "SCENIC" from 1957 to 1970, with a one-year "PHOTOSCENIC" exception in 1963.
hero_image: /images/license-plates/new-hampshire/1999-current-live-free-or-die.jpg
hero_image_alt: New Hampshire license plate with Live Free or Die slogan and Old Man of the Mountain design
hero_image_caption: New Hampshire's current standard plate base began in January 1999 and keeps "LIVE FREE OR DIE" at the top.
intro_text: '**"Live Free or Die"** is New Hampshire''s license plate slogan and state motto. It first appeared on New Hampshire standard plates in 1971 and has remained the state''s defining plate message through later redesigns, including the current Old Man of the Mountain base introduced in January 1999. Before the motto arrived, New Hampshire plates used **"SCENIC"** from 1957 through 1970, with a one-year **"PHOTOSCENIC"** exception in 1963.'
quick_answer: '"Live Free or Die" has been New Hampshire''s standard license plate slogan since 1971. The phrase comes from an 1809 toast by Revolutionary War General John Stark and became the official state motto in 1945. Earlier plates used "SCENIC" from 1957 to 1970, except for "PHOTOSCENIC" in 1963.'
