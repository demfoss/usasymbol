faq:
- question: What is New Hampshire's state butterfly?
  answer: "New Hampshire's state butterfly is the Karner blue, adopted by the New Hampshire General Court in 1992."
- question: When did New Hampshire adopt the Karner blue butterfly?
  answer: "New Hampshire adopted the Karner blue as its official state butterfly in 1992."
- question: What does the Karner blue butterfly look like?
  answer: "Males have bright blue wings edged in black. Females are grayish-brown with a row of orange spots along the hindwing edge."
- question: Is the Karner blue the same as New Hampshire's state insect?
  answer: "No. New Hampshire's state insect is the ladybug, adopted in 1977. The Karner blue is a separate designation, the official state butterfly, adopted in 1992."
- question: Where is the Karner blue butterfly found in New Hampshire?
  answer: "It survives only in sandy pine barren habitat that supports wild lupine, its only caterpillar food plant, including sites in the Concord area."
- question: Is the Karner blue butterfly endangered?
  answer: "Yes. The Karner blue is a federally endangered species, and New Hampshire is home to one of its few remaining populations."

