sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of New Hampshire?
  paragraphs:
  - "The Karner blue, Lycaeides melissa samuelis, is New Hampshire's official state butterfly. State lawmakers designated it in 1992."
  - "The Karner blue is a federally endangered species, and New Hampshire is home to one of its few remaining populations."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Karner Blue Butterfly
  paragraphs:
  - "The Karner blue is a small butterfly. Males have bright blue wings edged in black, while females are more grayish-brown with a row of orange spots along the hindwing edge."
  - "Both sexes have a row of small orange crescents bordered in black near the outer edge of the hindwings, visible on the underside."
  - "Its caterpillars feed only on wild lupine, which limits the butterfly to areas where that plant grows."

- id: history
  icon: fa-solid fa-landmark
  title: How New Hampshire Chose the Karner Blue Butterfly
  paragraphs:
  - "The New Hampshire General Court named the Karner blue the official state butterfly in 1992."
  - "The designation drew attention to the species and its dependence on wild lupine habitat in the state."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Karner Blue Butterfly in New Hampshire
  paragraphs:
  - "The Karner blue survives in New Hampshire only in areas with sandy pine barren habitat that supports wild lupine, including sites in the Concord area."
  - "Because it depends entirely on wild lupine, the butterfly is rare and limited to a small number of protected sites."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Karner Blue Butterfly Facts
  facts:
  - "Adopted in 1992 by the New Hampshire General Court."
  - "Scientific name: Lycaeides melissa samuelis."
  - "Males have bright blue wings; females are grayish-brown with orange spots along the hindwing edge."
  - "Caterpillars feed only on wild lupine."
  - "The Karner blue is a federally endangered species, and New Hampshire has one of its few remaining populations."




