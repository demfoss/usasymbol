meaning: "The Marlow soil formed in dense glacial till left across New Hampshire's hills when the last ice sheets retreated roughly 14,000 years ago. Under the state's spruce-fir and northern hardwood forests, slightly acidic rain slowly pulls iron and aluminum out of the upper layers, bleaching a pale gray zone in the subsoil. Those same minerals redeposit just below, building the vivid reddish-brown layer that makes the Marlow profile one of the most visually striking soils in New England."
