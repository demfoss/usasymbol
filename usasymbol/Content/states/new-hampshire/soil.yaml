faq:
- question: What is New Hampshire's state soil?
  answer: "New Hampshire's state soil is the Marlow series, a rocky, acidic spodosol formed in glacial till across the forested uplands of the Granite State. It covers hillsides throughout the state and supports northern hardwood and conifer forests."
- question: Why is it called Marlow soil?
  answer: "The Marlow series is named for Marlow, New Hampshire, a small town in Cheshire County in southwestern New Hampshire. USDA soil scientists name soil series after nearby towns, streams, or ridges where the soil was first described."
- question: What makes Marlow soil unusual?
  answer: "Marlow soil has two visually dramatic layers: a pale gray bleached zone called the E horizon, and a vivid reddish-brown zone called the Bs horizon below it. These form because acidic rainwater dissolves iron and aluminum from the upper layers and redeposits them lower down — a process called podzolization."
- question: What color is Marlow soil?
  answer: "Marlow soil changes color dramatically with depth. The surface layer is black from forest litter. Below it is a pale gray or white layer where iron has been washed out. Below that is a vivid reddish-brown zone where the iron redeposited. The bottom is olive gray compact glacial till."
- question: Where is Marlow soil found in New Hampshire?
  answer: "Marlow soil is found on upland hillsides and ridges throughout New Hampshire. It is most common in Cheshire, Sullivan, Merrimack, Grafton, and Carroll counties, covering the rocky glaciated terrain across the state's interior hills."
- question: What grows in Marlow soil?
  answer: "The primary plants are trees: sugar maple, yellow birch, and American beech are the main hardwoods. Eastern white pine, red spruce, and balsam fir grow on the cooler slopes. Sugar maples on Marlow soil supply much of New Hampshire's maple syrup production."
- question: What is the dense layer at the bottom of Marlow soil?
  answer: "The bottom layer is called the Cd horizon — dense glacial till compacted under thousands of feet of ice during the last ice age. It is so hard that plant roots cannot push through it. This layer limits usable soil depth to about two feet and causes water to pool above it in wet seasons."

