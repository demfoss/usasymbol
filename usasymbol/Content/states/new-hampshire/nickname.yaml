seo_title: "New Hampshire State Nickname: The Granite State"
seo_description: "New Hampshire is called the Granite State because its granite quarries played a major role in the state’s early economy and building history."

intro_text: "New Hampshire became known as <i>the Granite State</i> in 1825, when Colonel Philip Carrigain used the phrase in a song written for a dinner honoring General Lafayette. Granite bedrock underlies much of the state and supported a major quarrying industry during the 19th century. Reflecting this history, New Hampshire designated granite as its official state rock in 1985, and the phrase remains central in nationwide state-identity guides."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Granite State'"
    paragraphs:
      - "Colonel Philip Carrigain composed a song in June 1825 for a public dinner celebrating General Lafayette's visit to Concord. The first stanza included the line 'The GRANITE STATE to see,' marking the first known use of this phrase. The Concord newspaper published the poem on June 27, 1825. A popular singing group called the Hutchinson Family Singers reworked the tune during the 1840s, making it more about New Hampshire and helping the nickname spread across the region."
      - "The Granite State nickname comes directly from New Hampshire’s geology. Granite bedrock forms the foundation throughout much of the state. Extensive quarries produced granite for massive building projects during the 19th century, including the Library of Congress and the Brooklyn Bridge. New Hampshire's State House in Concord was built using granite quarried locally. Workers extracted granite from hills and mountains across the state, making stone quarrying a major industry for decades and reinforcing visual themes seen on [the New Hampshire state flag](/states/new-hampshire/flag/new-hampshire-state-flag)."
      - "The state seal features a granite boulder in the left foreground, included when the seal was designed. Granite was designated New Hampshire’s official state rock through legislation in 1985, recognizing its importance to the state’s history and identity. The Granite State remains New Hampshire’s most widely recognized and established state nickname, supported by long-standing public and governmental use rather than formal legislative designation — one of the most geologically specific entries across the [united states nicknames by state](/symbols/nicknames) and closely tied to [New Hampshire's state motto](/states/new-hampshire/motto/live-free-or-die)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Mother of Rivers"
        text: "Five major New England rivers start in New Hampshire's mountains and flow into neighboring states. The Connecticut River rises in the northern part of the state and forms the border with Vermont — a state whose [meaning of the Green Mountain State](/states/vermont/nickname/the-green-mountain-state) encompasses the same watershed and Appalachian mountain system that defines New Hampshire's own geography. The Pemigewasset River begins at Profile Lake in the Franconia Mountains and joins the Winnipesaukee River at Franklin to create the Merrimack River. The Androscoggin and Saco Rivers also originate in New Hampshire's granite hills. These waterways provided power for mills and factories during the Industrial Revolution. Early geographers used Mother of Rivers when describing New Hampshire because so many important waterways begin within state boundaries."
      - subtitle: "White Mountain State"
        text: "The White Mountain range cuts across the northern half of New Hampshire and covers about one quarter of the state's total area. These mountains feature granite peaks that reach impressive heights, with Mount Washington standing as the tallest at 6,288 feet above sea level. Snow covers the peaks for much of the year, giving them a white appearance visible from great distances. The Presidential Range includes Mount Adams, Mount Jefferson, and Mount Madison, all named after early American leaders. Tourists began visiting the White Mountains during the 1800s to enjoy scenic views and mountain climbing. The Appalachian Trail connects New Hampshire's peaks north to Maine's wilderness — the [Pine Tree State origins](/states/maine/nickname/the-pine-tree-state) run through the same ancient mountain chain that draws hikers to the Presidential Range today. The region remains popular for hiking, skiing, and outdoor recreation today."
      - subtitle: "Switzerland of America"
        text: "Early visitors to New Hampshire compared the White Mountains to the Alps of Switzerland because of their dramatic peaks and beautiful valleys. Travel writers during the 1800s used this comparison frequently when describing New Hampshire's mountain scenery to readers. Both regions feature rugged granite mountains, clear lakes, and small villages nestled in valleys. The nickname appeared in tourism materials and travel guides promoting New Hampshire as a vacation destination. Resort hotels were built in the White Mountains to attract wealthy visitors from Boston and New York who wanted a mountain experience similar to European destinations, a landscape also embodied by [the White Birch state tree](/states/new-hampshire/tree/white-birch). The comparison to Switzerland emphasized natural beauty and outdoor opportunities."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "New Hampshire's state motto is Live Free or Die, adopted in 1945 and written by Revolutionary War General John Stark in 1809."
      - "The Old Man of the Mountain, a granite rock formation that appeared on the state quarter, collapsed in 2003 after centuries of weathering."
      - "New Hampshire became the ninth state to ratify the U.S. Constitution on June 21, 1788, making ratification official for the entire nation."
      - "Captain John Mason named New Hampshire in 1629 after the English county of Hampshire where he spent part of his childhood."
      - "The state's first permanent settlement was established at Hilton's Point, now called Dover, during the early 1600s."
      - "New Hampshire was the first colony to establish an independent government in 1776, before the Declaration of Independence was signed."

faq:

  - question: "What is New Hampshire's nickname?"
    answer: "New Hampshire's nickname is the Granite State, which comes from extensive granite formations and quarries throughout the state. The name first appeared in a song written in 1825."

  - question: "Why is New Hampshire called the Granite State?"
    answer: "New Hampshire is called the Granite State because granite bedrock covers much of the state and granite quarries supplied stone for major buildings across New England during the 1800s."

  - question: "When did New Hampshire get the nickname Granite State?"
    answer: "New Hampshire got the nickname Granite State in 1825 when Colonel Philip Carrigain wrote a song for General Lafayette's visit that included the phrase the Granite State."

  - question: "What is New Hampshire's state motto?"
    answer: "New Hampshire's state motto is Live Free or Die, adopted in 1945. General John Stark wrote this phrase in 1809 as part of a toast to Revolutionary War veterans."

  - question: "Is the Granite State nickname official?"
    answer: "The Granite State is New Hampshire’s official state nickname, recognized through long-standing public and governmental use rather than formal legislative designation. Granite was designated the official state rock in 1985, reflecting the stone’s importance to the state’s history."

  - question: "What other nicknames does New Hampshire have?"
    answer: "New Hampshire has other nicknames including Mother of Rivers, White Mountain State, and Switzerland of America. These names refer to rivers, mountains, and scenic beauty found throughout the state."

