sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: New Hampshire State Rock
    paragraphs:
      - "Granite is New Hampshire's official state rock, designated by the New Hampshire Legislature in 1985. It is a coarse-grained igneous rock that underlies much of the state, and it gave New Hampshire its nickname, the Granite State, generations before lawmakers made the designation official."
      - "New Hampshire's choice of granite reflects a quarrying industry that once shipped the state's stone to build monuments and government buildings across the country."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Granite?"
    paragraphs:
      - "Granite is an igneous rock made mostly of quartz, feldspar, and mica, visible to the eye as light and dark speckled grains. It typically appears gray, pink, or white, and its interlocking crystal grains make it dense and resistant to weathering."
      - "Granite forms deep underground as molten rock cools slowly over thousands of years, giving its mineral grains time to grow large enough to see without magnification. Erosion later exposed New Hampshire's granite bedrock at the surface, especially across the White Mountains and central hill country."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New Hampshire Chose Granite as Its State Rock"
    paragraphs:
      - "Granite quarries once operated across New Hampshire, and the stone from Rattlesnake Hill in Concord was cut for buildings and monuments as far away as Washington, D.C., including the original Library of Congress building. At its peak, dozens of separate stone companies worked the Concord quarries."
      - "Granite had already defined New Hampshire's identity for over a century through its nickname, the Granite State, before the 1985 designation made the connection official."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Granite Became New Hampshire's State Rock"
    paragraphs:
      - "The New Hampshire Legislature designated granite the official state rock on May 31, 1985, formally recognizing the rock behind the state's long-standing nickname."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Granite Is Found in New Hampshire"
    paragraphs:
      - "Rattlesnake Hill in Concord was New Hampshire's best-known granite quarrying site, worked commercially from the early 1800s until the last operating quarry there closed in 2024. Granite bedrock is exposed widely across the state, including throughout the White Mountains."
    sites:
      - name: Rattlesnake Hill
        city: Concord
        lat: 43.1936
        lng: -71.5764
        note: "Historic New Hampshire granite quarrying site"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Granite Facts"
    facts:
      - "Adopted as New Hampshire's state rock in 1985."
      - "New Hampshire's nickname, the Granite State, predates the official state rock designation by well over a century."
      - "Granite from Rattlesnake Hill in Concord was used to build the original Library of Congress building in Washington, D.C."
      - "By 1900, more than 40 separate stone companies were quarrying granite on Rattlesnake Hill alone."

