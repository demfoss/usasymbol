faq:
  - question: What is New Hampshire's state rock?
    answer: "New Hampshire's state rock is granite, a coarse-grained igneous rock adopted by the New Hampshire Legislature in 1985."
  - question: When did New Hampshire adopt granite as its state rock?
    answer: "The New Hampshire Legislature designated granite the official state rock on May 31, 1985."
  - question: Why did New Hampshire choose granite?
    answer: "Granite quarries like Rattlesnake Hill in Concord shipped stone across the country and gave New Hampshire its long-standing nickname, the Granite State, before the 1985 law made the connection official."
  - question: Where can you find granite in New Hampshire?
    answer: "Rattlesnake Hill in Concord was New Hampshire's best-known granite quarrying site, and granite bedrock is exposed widely across the state, including the White Mountains."

