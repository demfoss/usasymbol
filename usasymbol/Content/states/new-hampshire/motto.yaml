seo_title: "New Hampshire State Motto: Live Free or Die"
seo_description: "New Hampshire's motto was written as a toast for a reunion General Stark was too sick to attend. The full toast was 'Live free or die. Death is not the greatest of evils.' The motto beat three granite-themed alternatives in 1945. In 1977, the Supreme Court ruled 7-2 that New Hampshire cannot prosecute people who cover the motto on their license plates."

intro_text: "New Hampshire's state motto is <strong>Live Free or Die</strong>, adopted on May 10, 1945. General John Stark wrote the phrase on July 31, 1809, as a toast for a Battle of Bennington reunion he was too ill to attend. The full toast read: <em>Live free or die. Death is not the greatest of evils.</em> The motto beat three granite-themed alternatives in the 1945 legislature. New Hampshire is one of the last states to adopt an official motto. The phrase appears on license plates, prompting a 1977 Supreme Court case that ruled 7-2 that New Hampshire cannot prosecute citizens who cover the motto on their plates."

sections:
  - id: "stark-couldnt-attend"
    icon: "fa-solid fa-feather"
    title: "Written by a General Too Sick to Attend the Reunion"
    paragraphs:
      - "The Battle of Bennington veterans held a reunion in August 1809 — 32 years after the battle. The committee invited John Stark as the honored guest. Stark had commanded New Hampshire militia and Massachusetts forces at Bennington on August 16, 1777, leading them to a decisive victory over British forces trying to capture military supplies. The battle helped turn the tide in the Northern theater and contributed to the British surrender at Saratoga weeks later."
      - "By 1809, Stark was 80 years old. Poor health kept him from traveling from his farm in Manchester. He sent a letter with a toast for the veterans: 'Live free or die. Death is not the greatest of evils.' The second sentence matters: Stark wasn't being nihilistic. He was saying that worse things than death exist — specifically, living without freedom. The veterans who had fought for independence understood the distinction."
      - "Stark died on May 8, 1822, at age 93. He had served in the French and Indian War, fought at Bunker Hill, and led the Bennington victory that earned him the nickname 'Hero of Bennington.' The toast he wrote for a reunion he couldn't attend became a state motto 136 years after he wrote it."

  - id: "beat-granite-alternatives"
    icon: "fa-solid fa-vote-yea"
    title: "It Beat Three Granite-Themed Alternatives in 1945"
    paragraphs:
      - "New Hampshire's original state seal had no motto. The legislature considered the question in 1945 for the first time. Four finalists emerged from deliberations. Three of them referenced New Hampshire's granite geology: 'Strong and Steadfast as Our Granite Hills,' 'Strong as Our Hills and Firm as Our Granite,' and 'Pioneers Yesterday, Today, and Tomorrow.' The fourth was Stark's 1809 toast."
      - "The legislature chose 'Live Free or Die' on May 10, 1945 — the same day Governor Robert Blood signed the bill establishing the state emblem. The motto's brevity and directness outweighed the geographic references of the granite alternatives. New Hampshire became one of the last states to choose an official motto."
      - "The phrase had precedents. The French Revolution used 'Vivre Libre ou Mourir' (Live Free or Die) as an official motto, inscribed on constitutional tokens in 1791–1792. Patrick Henry's 1775 speech — 'Give me liberty or give me death' — expressed the same idea. Stark likely knew these precedents. His version compressed the idea into four words."

  - id: "license-plates-and-supreme-court"
    icon: "fa-solid fa-car"
    title: "The License Plate That Went to the Supreme Court"
    paragraphs:
      - "New Hampshire began displaying the motto on license plates in 1971, replacing the previous motto 'Scenic' with white letters on a green background. The plates became nationally recognizable. The requirement applied to all non-commercial vehicles."
      - "George Maynard, a Jehovah's Witness, objected to the motto on religious grounds, considering it contrary to his faith. He covered the motto on his plates. New Hampshire authorities cited him repeatedly and eventually convicted him of a misdemeanor. Maynard challenged the conviction."
      - "The case reached the United States Supreme Court as Wooley v. Maynard in 1977. The Court ruled 7-2 that New Hampshire could not compel citizens to display the state motto on their vehicles. Chief Justice Warren Burger wrote that the First Amendment protects the right to refrain from speaking as well as the right to speak. New Hampshire cannot prosecute people who cover the motto. The ruling did not apply to commercial vehicles."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "New Hampshire State Motto Facts"
    style: "gradient"
    facts:
      - "John Stark wrote the motto on July 31, 1809, as a toast for a Battle of Bennington reunion he couldn't attend due to poor health."
      - "The full toast: 'Live free or die. Death is not the greatest of evils.'"
      - "The motto beat three granite-themed alternatives in the 1945 legislature."
      - "New Hampshire adopted the motto on May 10, 1945 — one of the last states to choose an official motto."
      - "License plates have displayed the motto since 1971, replacing 'Scenic.'"
      - "Wooley v. Maynard (1977) ruled 7-2 that New Hampshire cannot prosecute citizens who cover the motto on their plates."

faq:
  - question: "What is New Hampshire's state motto?"
    answer: "New Hampshire's state motto is 'Live Free or Die,' adopted on May 10, 1945. General John Stark wrote the phrase in 1809 as a toast for a Battle of Bennington reunion he was too ill to attend."

  - question: "What is the full text of John Stark's toast?"
    answer: "The full toast was: 'Live free or die. Death is not the greatest of evils.' The second sentence explains the motto's logic — Stark wasn't being nihilistic. He was saying that worse things than death exist, specifically living without freedom. He was 80 years old and had fought in the Revolutionary War when he wrote it."

  - question: "When did New Hampshire adopt 'Live Free or Die'?"
    answer: "May 10, 1945 — making New Hampshire one of the last states to choose an official motto. Four alternatives were considered; the motto beat three granite-themed options: 'Strong and Steadfast as Our Granite Hills,' 'Strong as Our Hills and Firm as Our Granite,' and 'Pioneers Yesterday, Today, and Tomorrow.'"

  - question: "Can New Hampshire force people to display the motto on their license plates?"
    answer: "No. The Supreme Court ruled 7-2 in Wooley v. Maynard (1977) that New Hampshire cannot prosecute citizens who cover the motto on their license plates. Chief Justice Burger wrote that the First Amendment protects the right to refrain from speaking as well as the right to speak. The ruling does not apply to commercial vehicles."

  - question: "Who was General John Stark?"
    answer: "A Revolutionary War general from New Hampshire. He fought at the Battle of Bunker Hill (1775) and commanded the decisive victory at the Battle of Bennington (1777), where patriot militia defeated a British force trying to capture supplies. He earned the nickname 'Hero of Bennington.' He died May 8, 1822, at age 93."

  - question: "Where does New Hampshire's motto appear?"
    answer: "On the state emblem (curving below the Old Man of the Mountain profile with the frigate Raleigh sailing in the foreground), on official state documents, and on all non-commercial license plates (since 1971, white letters on a green background). The state emblem and motto were adopted simultaneously on May 10, 1945."

