faq:
  - question: "What is New Hampshire's state motto?"
    answer: "New Hampshire's state motto is \"Live Free or Die.\" It was adopted in 1945 under New Hampshire RSA 3:2."

  - question: "Who wrote \"Live Free or Die\"?"
    answer: "General John Stark wrote the phrase in a letter dated July 31, 1809. He sent it as a toast for a reunion of Battle of Bennington veterans that he was too ill to attend. The full toast reads: \"Live Free Or Die; Death Is Not The Worst of Evils.\""

  - question: "When did New Hampshire adopt \"Live Free or Die\" as its motto?"
    answer: "New Hampshire adopted the motto in 1945. The House voted 179 to 85 in favor; the Senate adopted it unanimously the same day."

  - question: "Why does \"Live Free or Die\" appear on New Hampshire license plates?"
    answer: "In 1970, the state legislature required the motto to appear on all non-commercial license plates. A legal challenge reached the U.S. Supreme Court, which ruled in Wooley v. Maynard (1977) that New Hampshire could not force motorists to display the motto if it violated their beliefs."

