seo_description: "New Hampshire's state motto is \"Live Free or Die,\" adopted in 1945. The phrase comes from a toast General John Stark wrote on July 31, 1809."

intro_text: "New Hampshire's state motto is <strong>Live Free or Die</strong>, adopted in 1945. The phrase comes from a toast General John Stark wrote on July 31, 1809, when poor health prevented him from attending a reunion of Battle of Bennington veterans."

