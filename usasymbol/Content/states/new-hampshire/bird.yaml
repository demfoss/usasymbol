title: Purple Finch
scientific_name: Haemorhous purpureus
adopted_year: 1957
legislation: N.H. Rev. Stat. Ann. Sec. 3:10; 1957, 87:1
meaning: New Hampshire's state bird makes the most sense as the wild bird that beat the New Hampshire hen. In 1957 lawmakers chose a native finch over a domestic breed, which made the symbol point to the state's living landscape rather than to barnyard identity.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "New Hampshire State Bird | Purple Finch"
seo_description: New Hampshire adopted the Purple Finch in 1957. The stronger story is that lawmakers chose a native finch over the rival New Hampshire hen.
intro_text: New Hampshire's official state bird is the <strong>Purple Finch</strong>, adopted on <strong>April 25, 1957</strong> and now listed in <strong>N.H. Rev. Stat. Ann. Sec. 3:10</strong>. The choice is easiest to understand against the bird that lost. Lawmakers chose the Purple Finch over the <strong>New Hampshire hen</strong>, so the state bird became a statement in favor of a native wild symbol rather than a domestic one.
shared_states: []
sections:
- id: why-did-the-purple-finch-beat-the-new-hampshire-hen
  icon: fa-solid fa-circle-question
  title: Why Did the Purple Finch Beat the New Hampshire Hen?
  paragraphs:
  - The strongest New Hampshire detail is that the Purple Finch did not pass unopposed. Representative Robert S. Monahan introduced the finch bill, while Representative Doris M. Spollett pushed the New Hampshire hen as a competing symbol.
  - That contrast forced a real choice about what a state bird should be. The hen would have pointed toward a named domestic breed and an agricultural identity. The Purple Finch pointed instead to a living native bird people associated with woods, yards, and the state's ordinary outdoor life.
  - The finch also had the stronger civic coalition behind it. Historical summaries say it had support from the Audubon Society of New Hampshire, the New Hampshire Federation of Garden Clubs, and the State Federation of Women's Clubs. That backing helped make the native-bird case more persuasive.
- id: what-did-choosing-a-wild-bird-say-about-new-hampshire
  icon: fa-solid fa-tree
  title: What Did Choosing a Wild Bird Say About New Hampshire?
  paragraphs:
  - New Hampshire chose a wild bird that fit the state's own scale and setting better than a domestic emblem would have.
  - The Purple Finch suggested a state identified with woods, back roads, and small-scale everyday contact with native birds, not with a branded breed.
  - It also helps explain why New Hampshire remains the only state to use the Purple Finch. The choice was not about following a regional pattern. It was about choosing the kind of bird that sounded right for New Hampshire itself.
