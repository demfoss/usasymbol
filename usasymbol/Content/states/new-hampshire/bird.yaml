faq:
- question: What is New Hampshire's state bird?
  answer: New Hampshire's state bird is the Purple Finch.
- question: When did New Hampshire adopt the Purple Finch?
  answer: New Hampshire adopted the Purple Finch on April 25, 1957.
- question: Why did New Hampshire choose the Purple Finch?
  answer: New Hampshire chose the Purple Finch as a native wild bird instead of the rival New Hampshire hen, which was a domestic breed. That made the symbol feel closer to the state's living landscape.
- question: What bird lost to the Purple Finch?
  answer: The Purple Finch beat a competing proposal for the New Hampshire hen.
- question: What does the Purple Finch mean for New Hampshire?
  answer: The Purple Finch represents New Hampshire's preference for a native outdoor symbol over a domestic breed identity — a choice that was actively contested in 1957 and settled by a legislative vote.
- question: Is New Hampshire the only state with the Purple Finch?
  answer: Yes. New Hampshire is the only state to designate the Purple Finch as its official state bird.
