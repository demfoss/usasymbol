faq:
  - question: What is New Hampshire's state mineral?
    answer: "New Hampshire's state mineral is beryl, a hexagonal crystal mineral adopted by the New Hampshire Legislature in 1985."
  - question: When did New Hampshire adopt beryl as its state mineral?
    answer: "The New Hampshire Legislature designated beryl the official state mineral in 1985."
  - question: Why did New Hampshire choose beryl?
    answer: "New Hampshire's granite pegmatites, especially the Palermo Mine, have produced large, well-formed beryl crystals that have long drawn mineral collectors to the state."
  - question: Where can you find beryl in New Hampshire?
    answer: "The Palermo Mine near North Groton in Grafton County is New Hampshire's best-known beryl locality, though the site is on private land and not open for casual collecting."

