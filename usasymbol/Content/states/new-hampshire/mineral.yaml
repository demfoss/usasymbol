sections:
  - id: overview
    icon: fa-solid fa-cube
    title: New Hampshire State Mineral
    paragraphs:
      - "Beryl is New Hampshire's official state mineral, designated by the New Hampshire Legislature in 1985. It grows as six-sided crystals inside the state's granite pegmatites, coarse-grained rock formations that also host many of New Hampshire's other collectible minerals."
      - "New Hampshire chose beryl because its pegmatites have produced some of the largest and finest beryl crystals in New England, drawing mineral collectors to the state for generations."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Beryl?"
    paragraphs:
      - "Beryl forms as hexagonal, prism-shaped crystals that can range from colorless to pale shades of blue, green, yellow, or pink, depending on trace impurities. Gem-quality varieties include aquamarine, the pale blue-green form, and heliodor, a golden yellow variety, both of which have turned up in New Hampshire pegmatites."
      - "Beryl is a beryllium aluminum silicate mineral, hard enough to resist scratching by most other minerals. New Hampshire's beryl crystals grew slowly inside granite pegmatites, where mineral-rich fluids left over from cooling magma had room to form large, well-formed crystals."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New Hampshire Chose Beryl as Its State Mineral"
    paragraphs:
      - "New Hampshire's granite pegmatites, especially the Palermo Mine near North Groton, are known among mineral collectors worldwide for their size and variety, and beryl is one of the most visually striking minerals they produce. Some Palermo beryl crystals have grown to museum size, giving the state a genuine claim to fame among collectors."
      - "Naming beryl the state mineral tied the designation to the same pegmatite geology that already gave New Hampshire its state rock, granite, linking two symbols to one underlying rock formation."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Beryl Became New Hampshire's State Mineral"
    paragraphs:
      - "The New Hampshire Legislature designated beryl the official state mineral in 1985, the same year it named granite the state rock and smoky quartz the state gemstone, recognizing three minerals tied to the state's pegmatite geology in a single legislative session."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Beryl Is Found in New Hampshire"
    paragraphs:
      - "The Palermo Mine, near North Groton in Grafton County, is one of the most mineralogically diverse pegmatites in New England and has produced beryl in shades from pale aquamarine blue to golden heliodor. The site sits on private land and is not open for casual collecting, but its specimens are held in mineral collections and museums across the country."
    sites:
      - name: Palermo Mine
        city: North Groton
        lat: 43.7728
        lng: -71.8256
        note: "Pegmatite source of New Hampshire beryl crystals"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Beryl Facts"
    facts:
      - "Adopted as New Hampshire's state mineral in 1985."
      - "New Hampshire's Palermo Mine pegmatite has one of the longest mineral species lists of any locality in the state."
      - "Beryl's gem varieties include aquamarine (blue-green), heliodor (yellow), morganite (pink), and emerald (green), though emerald-grade beryl has not been documented in New Hampshire."
      - "Beryl was designated the state mineral the same year New Hampshire named granite its state rock and smoky quartz its state gemstone."

