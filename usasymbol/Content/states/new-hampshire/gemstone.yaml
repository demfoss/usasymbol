faq:
  - question: What is New Hampshire's state gemstone?
    answer: "New Hampshire's state gem is smoky quartz, a brown-to-black variety of quartz adopted by the New Hampshire Legislature in 1985."
  - question: When did New Hampshire adopt smoky quartz as its state gem?
    answer: "The New Hampshire Legislature designated smoky quartz the official state gem in 1985."
  - question: Why did New Hampshire choose smoky quartz?
    answer: "New Hampshire's pegmatites have produced large, well-formed smoky quartz crystals, and the designation paired it with beryl and granite, all three tied to the same pegmatite and granite geology."
  - question: Where can you find smoky quartz in New Hampshire?
    answer: "The Moat Mountain area near Conway, in the White Mountain National Forest, is a public site where visitors can dig for smoky quartz with a permit."

