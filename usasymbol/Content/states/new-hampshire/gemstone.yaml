sections:
  - id: overview
    icon: fa-solid fa-gem
    title: New Hampshire State Gem
    paragraphs:
      - "Smoky quartz is New Hampshire's official state gem, designated by the New Hampshire Legislature in 1985. It is a brown-to-black variety of quartz, and New Hampshire's granite pegmatites have produced unusually large, well-formed crystals."
      - "The designation paired smoky quartz with the state's beryl and granite symbols, all three tied to the same pegmatite and granite geology found across New Hampshire."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Smoky Quartz?"
    paragraphs:
      - "Smoky quartz is a variety of quartz ranging from light smoky brown to nearly black, often transparent enough to see through in thinner pieces. It forms the same six-sided crystal shape as clear quartz, and its color comes from natural irradiation acting on trace aluminum impurities within the crystal."
      - "In New Hampshire, smoky quartz grows inside granite pegmatites alongside beryl and other pegmatite minerals. Some New Hampshire specimens have grown to large sizes, prized by mineral collectors for their crystal form as much as their color."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New Hampshire Chose Smoky Quartz as Its State Gem"
    paragraphs:
      - "New Hampshire's pegmatites, including sites in the White Mountains near Moat Mountain, have long produced smoky quartz crystals large and clean enough to interest collectors and jewelers. Its abundance across the state's granite terrain made it a natural companion symbol to granite and beryl."
      - "Naming smoky quartz, beryl, and granite in the same 1985 legislative session tied all three official symbols to New Hampshire's pegmatite and granite geology rather than spreading the state's mineral symbols across unrelated materials."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Smoky Quartz Became New Hampshire's State Gem"
    paragraphs:
      - "The New Hampshire Legislature designated smoky quartz the official state gem in 1985, the same year it named beryl the state mineral and granite the state rock."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Smoky Quartz Is Found in New Hampshire"
    paragraphs:
      - "The Moat Mountain area near Conway, in the White Mountain National Forest, is one of New Hampshire's best-known public sites for finding smoky quartz, where it formed in pegmatite veins within an old volcanic mountain. Collectors can dig there with a permit from the U.S. Forest Service."
    sites:
      - name: Moat Mountain Mineral Site
        city: Conway
        lat: 44.03
        lng: -71.17
        note: "Public smoky quartz collecting site"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Smoky Quartz Facts"
    facts:
      - "Adopted as New Hampshire's state gem in 1985."
      - "Smoky quartz gets its brown-to-black color from natural background radiation acting on trace aluminum inside the quartz crystal."
      - "The Moat Mountain area near Conway is one of the few public, permit-based sites in New Hampshire where visitors can dig for smoky quartz themselves."
      - "Smoky quartz was named the state gem the same year New Hampshire adopted beryl as its state mineral and granite as its state rock."

