  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Hampshire State Flag Facts"
    facts:
      - "New Hampshire adopted its state flag in 1909"
      - "The flag was modified in 1931 to add nine stars"
      - "The state seal on the flag dates to 1784"
      - "The USS Raleigh was built in Portsmouth in 1776"
      - "New Hampshire was the ninth state to ratify the Constitution"
      - "Dr. Maynard H. Metcalf suggested adding the nine stars"

faq:
  - question: "Which flag serves as New Hampshire's official banner?"
    answer: "The New Hampshire state flag is the official banner of New Hampshire. It features the state seal showing the frigate USS Raleigh surrounded by nine stars on a blue field."

  - question: "What are the main visual elements on New Hampshire's flag?"
    answer: "The flag shows the New Hampshire state seal in the center on a blue background. The seal depicts the USS Raleigh in Portsmouth Harbor with a laurel wreath around it. Nine stars circle the seal."

  - question: "What does the New Hampshire state flag represent?"
    answer: "The flag represents New Hampshire's maritime heritage and constitutional role. The USS Raleigh symbolizes shipbuilding. The nine stars mark New Hampshire as the ninth state to ratify the Constitution."

  - question: "What meaning is attached to New Hampshire's flag?"
    answer: "The flag means New Hampshire's importance in founding the nation. The ninth ratification made the Constitution effective. The ship represents naval strength and Portsmouth's shipbuilding industry."

  - question: "What are the key symbols on New Hampshire's flag?"
    answer: "The frigate USS Raleigh appears on the state seal. The ship was built in Portsmouth in 1776 for the Continental Navy."

  - question: "When did New Hampshire adopt its current state flag?"
    answer: "State records do not identify a single individual who designed the flag. The design emerged from the state seal adopted in 1784. Dr. Maynard H. Metcalf suggested adding the nine stars in 1931."

