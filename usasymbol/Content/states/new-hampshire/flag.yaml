seo_title: "New Hampshire State Flag: Meaning & History"
seo_description: "Read why New Hampshire uses this flag design, what each major emblem points to, and how the state records color details for New Hampshire's flag."

intro_text: "New Hampshire established its state flag in 1909, featuring the state seal on a blue background and joining the broader [list of U.S. state flags](/symbols/flags). The seal shows the frigate USS Raleigh floating in Portsmouth Harbor. Nine stars surround the seal representing New Hampshire as the ninth state to ratify the Constitution."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the New Hampshire State Flag Is Designed"
    paragraphs:
      - "The New Hampshire state flag is the official government flag of New Hampshire. A blue field covers the background. The state seal appears in the center showing a sailing ship surrounded by a laurel wreath."
      - "Nine stars circle the wreath. The ship depicted is the frigate USS Raleigh. The seal sits on blue representing the waters of Portsmouth Harbor. Public buildings, schools, and government offices across New Hampshire fly the flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the New Hampshire Flag Communicates"
    paragraphs:
      - "The flag represents New Hampshire's maritime heritage and role in American independence. The USS Raleigh symbolizes New Hampshire's shipbuilding industry. The ship was built in Portsmouth in 1776."
      - "Nine stars mark New Hampshire as the ninth state to ratify the U.S. Constitution on June 21, 1788. That ratification made the Constitution effective by providing the required ninth state approval, a foundational event often cited on [the Granite State nickname page](/states/new-hampshire/nickname/the-granite-state)."
      - "The laurel wreath represents honor and achievement. Blue symbolizes vigilance and justice. The seal connects New Hampshire to its colonial naval history and constitutional significance, while the same period identity appears in [New Hampshire's state motto](/states/new-hampshire/motto/live-free-or-die)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "New Hampshire Flag History and Adoption"
    paragraphs:
      - "New Hampshire authorized its state flag in 1909. The legislature approved a design featuring the state seal on blue. The seal itself dated to 1784. That made it one of the oldest state seals still in use."
      - "The 1909 flag showed the seal without surrounding elements. In 1931, the legislature modified the design. Officials added nine stars around the seal. The stars represented New Hampshire's ratification position. The 1931 version also standardized the seal's appearance and proportions, completing the look now paired with [the White Birch state tree](/states/new-hampshire/tree/white-birch) in many official symbol guides."
      - "State records do not identify a single individual who designed the flag. The design emerged from the existing state seal. Dr. Maynard H. Metcalf suggested adding the nine stars in 1931. The state adopted his recommendation."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the New Hampshire Flag"
    symbols:
      - id: seal
        name: "New Hampshire State Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal depicts the frigate USS Raleigh against a rising sun. New Hampshire adopted this seal in 1784. The frigate USS Raleigh appears in the center floating on water. The ship was built in Portsmouth in 1776 for the Continental Navy."
          - "A granite boulder sits on the shoreline. This represents New Hampshire's granite bedrock and nickname as the Granite State. The rising sun appears behind the ship symbolizing new beginnings and the young nation."
          - "A laurel wreath encircles the entire image. Laurel represents honor and victory. The wreath acknowledges New Hampshire's role in the American Revolution and early republic."

      - id: stars
        name: "Nine Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Nine stars surround the seal. They were added in 1931. New Hampshire became the ninth state to ratify the U.S. Constitution on June 21, 1788."
          - "This ratification was crucial. The Constitution required nine states to approve it before taking effect. New Hampshire provided that decisive ninth vote. The stars commemorate this historical significance."

      - id: ship
        name: "USS Raleigh"
        image: "symbols/ship.svg"
        paragraphs:
          - "The frigate USS Raleigh appears in the seal's center. The ship was one of thirteen frigates authorized by the Continental Congress in 1775. Portsmouth shipbuilders constructed it in 1776."
          - "The Raleigh represented New Hampshire's contribution to the Continental Navy. Shipbuilding was a major industry in Portsmouth. The ship symbolizes maritime commerce and naval strength."

      - id: field
        name: "Blue Field"
        image: "symbols/field.svg"
        paragraphs:
      - "Blue covers the entire background. This color represents Portsmouth Harbor waters where the USS Raleigh was launched. Blue also symbolizes vigilance, perseverance, and justice. For broader visual context, compare this palette with [U.S. state colors](/symbols/colors)."
      - "The shade matches colors used in other New England state flags. New Hampshire chose blue to connect with regional and national flag traditions and with the state's wider constitutional story tracked in [state-by-state population history](/rankings/demographics/states-by-population)."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "New Hampshire State Flag Colors"
    paragraphs:
      - "The flag uses blue, yellow, brown, white, and green. Blue forms the field and water. Yellow appears in the stars and sun. Brown shows in the ship and granite. White highlights the laurel wreath. Green depicts the laurel leaves."
    colors:
      - name: "Blue"
        hex: "#003366"
      - name: "Yellow"
        hex: "#FFD700"
      - name: "Brown"
