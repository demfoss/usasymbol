seo_title: "Maryland State Flag: Calvert & Crossland Colors, History"
seo_description: "See when Maryland approved its current flag, what the central imagery means, and how color references are handled for Maryland's banner."

intro_text: "Maryland adopted its state flag in 1904, featuring heraldic designs from the Calvert and Crossland families and appearing on the [list of U.S. state flags](/symbols/flags). The flag divides into four quarters showing alternating patterns. Black and gold checkers appear in two quarters while red and white crosses fill the other two, with language tied to the [Maryland state motto](/states/maryland/motto/fatti-maschii-parole-femine)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Maryland State Flag Is Designed"
    paragraphs:
      - "The Maryland state flag serves as the official flag of Maryland. The design divides into four quarters. Two quarters show black and gold checkers in a diagonal pattern. The other two quarters display a red and white bottony cross."
      - "These patterns come from colonial-era family crests. The Calvert family founded Maryland in 1632. The Crossland family connected to the Calverts through marriage. The flag flies at government offices, schools, and public grounds throughout Maryland."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Maryland Flag Communicates"
    paragraphs:
      - "The flag represents Maryland's colonial heritage through two historic family crests. The black and gold quarters show the coat of arms of the Calvert family. The red and white quarters display the Crossland family crest, which belonged to the mother of George Calvert, the first Lord Baltimore, and this heritage supports [the Old Line State nickname](/states/maryland/nickname/the-old-line-state)."
      - "During the Civil War, these two designs took on political meaning. Marylanders who supported the Union flew the Calvert colors. Those who sympathized with the Confederacy used the Crossland pattern. After the war, combining both designs symbolized reconciliation between divided Maryland families."
      - "The flag demonstrates unity from division. Bringing both crests together created a unique state symbol that acknowledged Maryland's complex Civil War history while moving forward as one state."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Maryland Flag History and Adoption"
    paragraphs:
      - "Maryland authorized its state flag in 1904. The legislature approved a design combining the Calvert and Crossland family crests. These heraldic patterns dated to the seventeenth century when the Calvert family established the Maryland colony."
      - "The flag design appeared informally before official adoption. Maryland units used versions of these patterns during the Civil War. After 1865, groups began combining both crests to represent state unity. By the 1880s, the four-quarter design appeared at public events."
      - "The 1904 law formalized what had become common practice. No single designer received credit. The flag emerged from decades of informal use and gradual acceptance. Maryland remains one of the few states with a flag based entirely on heraldic family crests in a region now summarized by [states neighboring states](/rankings/geography/states-neighboring-states)."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Maryland Flag"
    symbols:
      - id: calvert
        name: "Calvert Colors"
        image: "symbols/calvert.svg"
        paragraphs:
          - "The black and gold quarters display the Calvert family coat of arms. George Calvert, the first Lord Baltimore, founded the Maryland colony in 1632. His family used this heraldic pattern in England before coming to America."
          - "The pattern shows six vertical bars alternating between gold and black. A diagonal band crosses from the upper left to lower right. The diagonal reverses the color pattern. This design follows traditional English heraldry rules."
          - "During the Civil War, Marylanders loyal to the Union identified with the Calvert colors. The pattern represented Maryland's official colonial government and its ties to federal authority."

      - id: crossland
        name: "Crossland Colors"
        image: "symbols/crossland.svg"
        paragraphs:
          - "The red and white quarters show the Crossland family crest. This pattern belonged to the family of George Calvert's mother. The Crossland arms became associated with Maryland through this family connection."
          - "A red and white bottony cross dominates each quarter. The cross arms end in three-lobed shapes called trefoils. This style appears in medieval European heraldry. The pattern alternates red crosses on white backgrounds with white crosses on red backgrounds."
          - "Confederate sympathizers in Maryland adopted the Crossland colors during the Civil War. The pattern became an unofficial symbol of Southern loyalty. After the war, incorporating it into the state flag helped heal divisions."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Maryland State Flag Colors"
    paragraphs:
      - "The flag uses black, gold, red, and white. Black and gold come from the Calvert family coat of arms. Red and white derive from the Crossland family crest. These four colors make Maryland's flag one of the most distinctive state banners and align with broader [U.S. state colors](/symbols/colors)."
    colors:
      - name: "Black"
        hex: "#000000"
      - name: "Gold"
        hex: "#FFD700"
      - name: "Red"
        hex: "#C8102E"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maryland State Flag Facts"
    facts:
      - "Maryland adopted its state flag in 1904"
      - "The flag design comes from two seventeenth-century family crests"
      - "George Calvert founded Maryland in 1632"
      - "The Calvert colors are black and gold"
      - "The Crossland colors are red and white"
      - "The flag symbolizes reconciliation after the Civil War"

faq:
  - question: "Which flag serves as Maryland's official banner?"
    answer: "The Maryland state flag is the official banner of Maryland. It features the Calvert family coat of arms in black and gold and the Crossland family crest in red and white, arranged in four quarters."

  - question: "What are the main visual elements on Maryland's flag?"
    answer: "The flag divides into four quarters. Two quarters show black and gold checkers in a diagonal pattern. The other two quarters display red and white bottony crosses."

  - question: "What does Maryland's flag look like?"
    answer: "The flag represents Maryland's colonial heritage through the Calvert and Crossland family crests. It also symbolizes reconciliation after the Civil War when both Union and Confederate sympathizers' symbols were combined."

  - question: "What does the Maryland flag symbolize?"
    answer: "The flag means unity from division. The black and gold represent the Calvert family who founded Maryland. The red and white show the Crossland family. Combining both crests symbolized healing after the Civil War."

  - question: "What colors appear on the Maryland state flag?"
    answer: "The Maryland state flag uses black, gold, red, and white. Black and gold are the Calvert colors. Red and white are the Crossland colors."

  - question: "How would you describe the design of the Maryland state flag?"
    answer: "The flag design comes from two colonial-era family crests. The Calvert family founded Maryland and used the black and gold pattern. The Crossland family connected to the Calverts and used the red and white cross."

  - question: "Which historic family crests form the Maryland flag design?"
    answer: "The flag is based on the coat of arms of George Calvert, first Lord Baltimore, and the crest of his mother's family, the Crosslands. Both are English heraldic designs from the 1600s."

  - question: "When was the present Maryland flag approved in law?"
    answer: "Maryland officially adopted its state flag in 1904, though the design appeared informally for decades before that date."

