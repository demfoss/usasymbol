faq:
- question: What is Maryland's state fossil?
  answer: "Maryland's state fossil is the Ecphora (Ecphora gardnerae), a spiral-shelled predatory sea snail from the Miocene epoch, adopted in 1984."
- question: When did Maryland adopt its state fossil?
  answer: "Maryland adopted the Ecphora as its state fossil in 1984. The species name was revised from Ecphora quadricostata to Ecphora gardnerae in 1994."
- question: What did the Ecphora look like?
  answer: "Ecphora gardnerae had a thick shell about 2 to 3 inches long with four distinct raised spiral ribs. Fossilized shells are often reddish-brown from iron staining."
- question: Where are Ecphora fossils found in Maryland?
  answer: "Most Ecphora fossils come from the Calvert Cliffs along the western Chesapeake Bay shore. Visitors find them on the beaches at Calvert Cliffs State Park and Flag Ponds Nature Park in Calvert County."
- question: When did the Ecphora live?
  answer: "Ecphora gardnerae lived during the Miocene epoch, roughly 15 to 8 million years ago, in the shallow seas that covered what is now the Chesapeake Bay region. It went extinct about 3.5 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "The 1984 designation reflected the long scientific importance of the Calvert Cliffs, studied by paleontologists since the early 1800s. The Ecphora was already the most recognizable fossil from the site when Maryland created the state fossil designation."

