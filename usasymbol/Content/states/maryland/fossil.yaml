- id: facts
  icon: fa-solid fa-lightbulb
  title: Ecphora Facts
  facts:
  - "Maryland adopted the Ecphora as its state fossil in 1984, one of the earliest states to designate a marine invertebrate."
  - "A fossil Ecphora (then called E. quadricostata) appeared on a 1974 U.S. postage stamp as part of a fossil invertebrate series."
  - "The species name gardnerae honors Julia A. Gardner (1882-1960), a USGS geologist who authored the standard reference on Atlantic coast Miocene mollusks."
  - "The four raised spiral ribs on the shell are unusual enough that collectors can identify broken fragments at a glance."
  - "In 1994, paleontologist Emily J. Vokes revised the taxonomy and renamed Maryland's form from Ecphora quadricostata to Ecphora gardnerae."

