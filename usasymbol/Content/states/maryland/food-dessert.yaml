sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Maryland's State Dessert?"
    paragraphs:
      - "Smith Island cake is Maryland's official state dessert, designated by the Maryland General Assembly in 2008. It is a layer cake traditionally built from eight or more thin layers held together with frosting."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Smith Island Cake"
    paragraphs:
      - "Smith Island cake is made of many thin cake layers, often eight to ten, stacked with a thin layer of frosting between each one. The most traditional version pairs yellow cake with chocolate fudge frosting, though other flavors are made today."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Smith Island Cake Became Maryland's State Dessert"
    paragraphs:
      - "The Maryland General Assembly designated Smith Island cake the official state dessert in 2008, recognizing a recipe long baked on Smith Island in the Chesapeake Bay."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Maryland Chose Smith Island Cake"
    paragraphs:
      - "Smith Island cake was traditionally baked by watermen's wives on Smith Island, a small Chesapeake Bay island community, and sent out with their husbands on long fishing and crabbing trips because the many thin layers kept the cake moist for days. The cake remains closely tied to that island's culture."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Smith Island Cake Comes From in Maryland"
    paragraphs:
      - "Smith Island, a small inhabited island in the Chesapeake Bay reachable only by boat, is the traditional home of the cake and still produces it for sale to visitors and by mail."
    sites:
      - name: Smith Island
        city: Ewell
