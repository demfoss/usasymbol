title: "Astrodon johnstoni"
adopted_year: 1998
legislation: "Maryland Senate Bill 291 (1998)"
meaning: "Maryland's claim in dinosaur history isn't recent. The teeth that give Astrodon its name were described in 1859 — before the Civil War, before most of the famous Western discoveries, and before the term 'dinosaur' was widely used in American scientific writing. This makes Maryland one of the oldest chapters in North American dinosaur paleontology."
