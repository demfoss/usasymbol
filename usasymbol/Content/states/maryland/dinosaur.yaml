faq:
  - question: "What is Maryland's state dinosaur?"
    answer: "Astrodon was described in a dental journal. In 1859, Baltimore dentist Christopher Johnston examined two unusual teeth from Prince George's County and published a description in the American Journal of Dental Science — not a paleontology publication. That tooth-based description, naming Astrodon johnstoni, stood as Maryland's contribution to the dinosaur record. Maryland designated it as state dinosaur by Senate Bill 291 in 1998; the animal itself was a large Early Cretaceous sauropod from the Arundel Formation."

  - question: "What does Astrodon mean?"
    answer: "Astrodon means 'star tooth' — from the Greek words for star (astro) and tooth (don). Christopher Johnston named it in 1859 after observing the star-shaped cross-section of the tooth's internal enamel structure, a distinctive feature he noted after polishing and sectioning the specimen."

  - question: "When was Astrodon first described?"
    answer: "The teeth were described in 1859 by Christopher Johnston, a Baltimore dentist and physician, making Astrodon one of the earliest formally described North American dinosaurs. The description predates most of the famous Western discoveries by nearly two decades."

  - question: "What is the Pleurocoelus connection?"
    answer: "Pleurocoelus is a genus named by Marsh in 1888 from additional Arundel Formation material. For much of the twentieth century, both names were applied to similar Early Cretaceous sauropod material from Maryland and Texas, creating nomenclatural confusion. Current taxonomy treats Astrodon johnstoni as a valid, distinct genus, while the Texas material formerly called Pleurocoelus has been renamed Paluxysaurus jonesi."

  - question: "Can I find Astrodon fossils myself?"
    answer: "Dinosaur Park in Laurel, Maryland — located within the Arundel Formation outcrop — allows supervised surface collecting on specific open days. It is one of the few publicly accessible sites in the United States where visitors can collect Cretaceous dinosaur material. Check the park's schedule for public collecting events."

