faq:
- question: What is Maryland's state insect?
  answer: "Maryland's state insect is the Baltimore checkerspot butterfly, adopted by the Maryland General Assembly in 1973."
- question: When did Maryland adopt the Baltimore checkerspot?
  answer: "Maryland adopted the Baltimore checkerspot butterfly as its official state insect in 1973."
- question: Why did Maryland choose the Baltimore checkerspot?
  answer: "Its black, orange, and white colors match Lord Baltimore's family colors, the same colors that appear on Maryland's state flag."
- question: What does the Baltimore checkerspot look like?
  answer: "It is a black butterfly with rows of orange spots near the wing edges and rows of white spots closer to the body, with a wingspan of about 2 to 2.5 inches."
- question: Where is the Baltimore checkerspot found?
  answer: "It lives in wet meadows and marshy fields in Maryland where its host plant, turtlehead, grows, though suitable habitat has become limited."
- question: Is the Baltimore checkerspot a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly, recognized by its black, orange, and white checkered wing pattern."

