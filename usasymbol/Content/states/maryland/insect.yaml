sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Maryland?
  paragraphs:
  - "The Baltimore checkerspot, Euphydryas phaeton, is Maryland's official state insect. State lawmakers designated it in 1973."
  - "It is a medium-sized butterfly named for its checkered pattern, which matches the colors on Maryland's state flag and the shield of Lord Baltimore."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Baltimore Checkerspot
  paragraphs:
  - "The Baltimore checkerspot has black wings marked with rows of orange spots near the outer edges and rows of white spots closer to the body, giving it a checkered look."
  - "Adults have a wingspan of about 2 to 2.5 inches, making them easy to spot as they fly low over open, damp meadows."
  - "The butterfly usually appears from late May through June, staying active for only a few weeks each year."

- id: history
  icon: fa-solid fa-landmark
  title: How Maryland Chose the Baltimore Checkerspot
  paragraphs:
  - "The Maryland General Assembly designated the Baltimore checkerspot as the official state insect in 1973."
  - "Its black, orange, and white colors match Lord Baltimore's family colors, which also appear on Maryland's state flag, making the butterfly a fitting choice for the state."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Baltimore Checkerspot in Maryland
  paragraphs:
  - "Baltimore checkerspots live in wet meadows and marshy fields where their caterpillar host plant, turtlehead, grows."
  - "Because these damp meadow habitats have become less common, sightings in Maryland are now limited to a small number of protected areas."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Baltimore Checkerspot Facts
  facts:
  - "Adopted: 1973, by the Maryland General Assembly."
  - "Scientific name: Euphydryas phaeton."
  - "Wingspan: about 2 to 2.5 inches."
  - "Black wings checkered with orange and white spots, matching Lord Baltimore's family colors on the state flag."
  - "Flies for only a few weeks each year, usually from late May through June."




