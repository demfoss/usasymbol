seo_title: "Maryland State Spirit | Rye Whiskey"
seo_description: "Maryland named rye whiskey its state spirit in 2023, reviving a distilling tradition that nearly vanished after Prohibition."
intro_text: <strong>Maryland rye whiskey is the official state spirit</strong>, designated in <strong>2023</strong> when Governor Wes Moore signed the bill on May 3. It acknowledges a spirit Maryland produced for two centuries, then lost almost entirely to Prohibition, and has spent the last decade rebuilding — not as nostalgia, but as a functioning agricultural and distilling industry. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
