faq:
- question: What is Maryland's official state cocktail?
  answer: Maryland's official state cocktail is the Orange Crush, designated in 2025.
- question: When was Orange Crush designated Maryland's state cocktail?
  answer: Maryland designated the Orange Crush as the official state cocktail in 2025, during the 447th Maryland General Assembly session.
- question: Where was the Orange Crush invented?
  answer: The Orange Crush was invented at Harborside Bar & Grill in Ocean City, Maryland, approximately in the mid-1990s — about thirty years before the 2025 state designation.
- question: What is in a Maryland Orange Crush?
  answer: A Maryland Orange Crush contains fresh-squeezed orange juice, vodka, triple sec, and lemon-lime soda, served over crushed ice. The fresh juice and crushed ice are the defining elements — substituting packaged juice or cubed ice produces a significantly different drink.
- question: Why did Maryland designate Orange Crush its state cocktail?
  answer: The immediate trigger was Delaware designating Orange Crush as a state drink in 2024. Maryland's legislative response emphasized the drink's documented Ocean City origin and its decades of association with Maryland shore culture. Delegate Wayne Hartman led the effort.
- question: Did Delaware also claim Orange Crush?
  answer: Yes. Delaware designated Orange Crush as an official state drink in 2024. Maryland responded in 2025, arguing that the drink originated at Harborside Bar & Grill in Ocean City, Maryland — a specific Maryland location — and that the origin claim gave Maryland the stronger case.
- question: What other drinks are official Maryland state symbols?
  answer: 'Maryland has three official drink designations: milk as the state beverage (1998), rye whiskey as the state spirit (2023), and Orange Crush as the state cocktail (2025).'
- question: Who sponsored the Orange Crush legislation in Maryland?
  answer: Delegate Wayne Hartman, who represents an Eastern Shore district that includes Ocean City, sponsored the designation through the Maryland General Assembly.
