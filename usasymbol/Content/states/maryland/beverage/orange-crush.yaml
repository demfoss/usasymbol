seo_description: "Maryland made the Orange Crush its state cocktail in 2025, formalizing the Ocean City drink after Delaware moved first."
intro_text: <strong>The Orange Crush is Maryland's official state cocktail</strong>, designated in <strong>2025</strong>. The drink was invented at a bar in Ocean City, Maryland, roughly thirty years before the legislature got around to making it official — and it would likely have stayed an unofficial institution forever if Delaware had not designated it first in 2024. Once Delaware moved, Maryland did not wait long.
