seo_title: "Maryland State Tree | White Oak"
seo_description: 'Maryland adopted white oak in 1941, recognizing a long-lived native tree tied to colonial shipbuilding, strong timber, and state forests.'

intro_text: "Maryland recognized White Oak as its state tree in 1941. The choice reflected both the tree's importance to the state's colonial timber economy and its long, familiar presence in Maryland forests."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Maryland"
    paragraphs:
      - "Maryland recognizes White Oak as its official state tree. This deciduous hardwood grows 80 to 100 feet tall in Maryland forests, though exceptional specimens can exceed 100 feet. The trunk develops a massive girth, commonly reaching three to four feet in diameter on mature trees. Some of Maryland's oldest white oaks measure over six feet across. The tree's strong wood and stately appearance made it Maryland's most valuable timber species during colonial times and the early republic. White oak lumber built Maryland homes, barns, and ships for over three centuries."
      - "The bark appears light gray with a scaly, plated texture. Shallow vertical furrows separate flat ridges across the trunk surface. The bark develops deep furrows on very old trees but never develops the deep, dark furrows of black oak species. The leaves grow four to nine inches long with seven to nine rounded lobes. The lobes have smooth edges without bristle tips, distinguishing white oak from red oak group species. Leaves emerge pinkish-red in spring, turn deep green in summer, and fade to brown or burgundy in fall."
      - "White oak grows throughout Maryland from the coastal plain to the Appalachian mountains. The species thrives on well-drained upland sites with deep soils. Maryland's white oaks form the dominant tree in many forest types, often growing alongside hickories, red oaks, and tulip trees. The tree produces acorns annually, though heavy crops occur every four to ten years. These acorns provide critical food for Maryland wildlife including deer, turkeys, squirrels, and black bears. White oak acorns mature in a single season, unlike red oak acorns that require two years."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the White Oak"
    paragraphs:
      - "The common name White Oak comes from the pale gray bark and light-colored wood. The scientific name Quercus alba uses the Latin word for oak (Quercus) and the Latin word for white (alba). Early Maryland colonists called these trees stave oak because the wood split cleanly for making barrel staves. Shipbuilders used the term navy oak for the strongest white oak timber."
      - "The name distinguishes this species from red oak group members that have darker bark and bitter acorns. White oak belongs to the white oak group within the genus Quercus. This group includes about 20 North American oak species with rounded leaf lobes and sweet acorns. Maryland's white oak is the most widespread and economically important member of this group. The species belongs to the Fagaceae family, the beech family."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why White Oak Became the Maryland State Tree"
    paragraphs:
      - "Maryland established the White Oak as its official state tree on April 10, 1941. The Maryland General Assembly passed legislation recognizing the species during the 1941 session. Governor Herbert O'Conor signed the bill designating white oak as Maryland's arboreal emblem. The selection honored a tree central to Maryland's historical development and continued forest resources, echoing values on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine)."
      - "Maryland picked white oak for its crucial role in the state's shipbuilding heritage. During colonial times and the early 1800s, Maryland shipyards built vessels using white oak for frames, keels, and planking. The wood's strength and natural resistance to decay made it ideal for ship construction. Baltimore shipyards constructed some of America's most famous vessels from Maryland white oak, including the privateer Chasseur and multiple U.S. Navy frigates. The USS Constellation, launched from Baltimore in 1797, used Maryland white oak throughout its frame and planking."
      - "The tree held enormous economic value beyond shipbuilding. Maryland farmers split white oak into fence rails that lasted decades without rotting. Coopers made barrels from white oak for storing Maryland tobacco, flour, and whiskey - the wood's tight grain prevented leaks. White oak provided flooring and structural timbers for Maryland buildings including the State House in Annapolis. The tree's acorns fattened hogs that fed Maryland families. This combination of shipbuilding importance and practical versatility made white oak the logical choice when Maryland designated its state tree. The species represented Maryland's colonial economy and continued to thrive in state forests."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maryland State Tree Facts"
    facts:
      - "Maryland designated White Oak as state tree on April 10, 1941, through legislation signed by Governor Herbert O'Conor"
      - "Maryland white oak built the USS Constellation in 1797, the first ship commissioned by the U.S. Navy still afloat"
      - "The rounded leaf lobes without bristle tips distinguish white oak from red oak species found in Maryland"
      - "White oak can live 300 to 600 years in Maryland forests, with some specimens estimated at over 700 years"
      - "The acorns mature in one growing season and taste sweet compared to bitter red oak acorns that need two years"
      - "Maryland shares this state tree with Illinois and Connecticut, all within the species' natural range"
      - "White oak wood contains tyloses in its vessels, creating a watertight grain that made it essential for barrel-making and shipbuilding"
      - "The Wye Oak, Maryland's most famous white oak, stood 96 feet tall with a trunk over 31 feet in circumference before falling in 2002"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Maryland State Tree and Flower"
    paragraphs:
      - "Maryland's state flower is the Black-eyed Susan (Rudbera hirta), designated in 1918. The state adopted its floral symbol more than two decades before choosing the white oak. Both the White Oak and Black-eyed Susan grow naturally throughout Maryland; see the [Maryland state flower page](/states/maryland/flower/black-eyed-susan). The towering oak dominates Maryland forests while black-eyed susans bloom in meadows and roadsides. White oak leaves emerge in spring when black-eyed susans begin their growth cycle. By summer, the oak's deep green canopy shades Maryland forests as bright yellow black-eyed susans color open areas. The pair covers Maryland's wooded and open landscapes."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Maryland White Oak"
    paragraphs:
      - "Examine the leaf lobes for the clearest identification. White oak leaves have seven to nine rounded lobes with smooth edges. The lobes create deep indentations that nearly reach the midrib. No bristle tips appear on the lobe ends - this immediately distinguishes white oak from red oak group species that have pointed, bristle-tipped lobes. The leaves feel slightly leathery. On mature trees, leaves typically grow four to seven inches long, though some reach nine inches."
      - "The bark shows a distinctive light gray color that stands out in Maryland forests. The surface consists of narrow, vertical plates separated by shallow furrows. The plates appear loosely attached and somewhat scaly. Young white oak bark starts smooth and light-colored, gradually developing the plated texture as the tree ages. The light gray bark color persists throughout the tree's life, unlike darker-barked oaks. This pale bark gives the species its common name and helps identify white oak from a distance."
      - "Mature white oaks develop a broad, rounded crown with massive horizontal limbs. The trunk remains straight for 20 to 40 feet before branching. Major limbs can measure two feet in diameter and extend outward horizontally. The crown spreads 60 to 80 feet wide on open-grown trees. Forest-grown specimens develop narrower crowns with the trunk extending higher before branching. Acorns measure three-quarters to one inch long with a shallow, warty cap covering one-quarter of the nut. The acorns mature to brown in fall and drop during September and October."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Maryland State Tree Symbolizes"
    paragraphs:
      - "White Oak symbolizes strength, endurance, and Maryland's maritime heritage. The tree's role in building Baltimore's ships connects modern Maryland to its seafaring past. The wood's longevity represents lasting values and solid foundations. For many Marylanders, white oak evokes the state's colonial history and the forests that supported early settlements. The famous Wye Oak, which stood for over 400 years before falling in 2002, became an icon of Maryland's natural heritage. Its offspring now grow across Maryland, continuing the legacy and supporting species like the [Maryland state bird](/states/maryland/bird/baltimore-oriole). The white oak's presence in Maryland forests today links residents to the same woodlands that supplied colonial shipyards and pioneer communities across a region captured in [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Maryland state tree?"
    answer: "The White Oak (Quercus alba) is Maryland's official state tree. The Maryland General Assembly designated it on April 10, 1941, signed into law by Governor Herbert O'Conor."
  
  - question: "What is the Maryland state tree called?"
    answer: "Maryland's state tree is called White Oak. The scientific name is Quercus alba, meaning 'white oak' in Latin. It's also been called stave oak for barrel-making and navy oak for shipbuilding."
  
  - question: "When was the Maryland state tree adopted?"
    answer: "Maryland adopted the White Oak as its official state tree on April 10, 1941. The General Assembly passed the designation during the 1941 legislative session. Governor Herbert O'Conor signed the legislation establishing white oak as Maryland's arboreal symbol."
  
  - question: "Why is the White Oak Maryland's state tree?"
    answer: "Maryland chose the White Oak for its central role in the state's shipbuilding heritage. Baltimore shipyards used Maryland white oak to build famous vessels including the USS Constellation in 1797. The wood's strength and decay resistance made it ideal for ships, barrels, and buildings. The tree also provided fence rails, barrel staves for Maryland tobacco, and acorns for livestock. This combination of shipbuilding importance and practical uses made white oak essential to Maryland's colonial and early American economy."
  
  - question: "What is the Maryland state tree name?"
    answer: "The name is White Oak. The scientific name is Quercus alba - Quercus is Latin for oak, and alba means white. The name refers to the light gray bark and pale wood."
  
  - question: "Where does the Maryland state tree grow?"
    answer: "The White Oak grows throughout Maryland from the coastal plain to the Appalachian mountains. It thrives on well-drained upland sites across the state. White oak grows naturally across eastern North America from Maine to northern Florida and west to Minnesota and eastern Texas."
  
  - question: "What are some facts about the Maryland state tree?"
    answer: "The White Oak grows 80 to 100 feet tall and can live 300 to 600 years. It has rounded leaf lobes without bristle tips. The acorns mature in one season and taste sweet. Maryland white oak built the USS Constellation in 1797. The famous Wye Oak stood in Maryland for over 400 years before falling in 2002. The wood is naturally watertight, perfect for barrels and ships."
  
  - question: "How do you recognize the Maryland state tree?"
    answer: "Look for leaves with seven to nine rounded lobes and smooth edges - no bristle tips. The bark is light gray with shallow vertical furrows and scaly plates. The tree develops a broad, rounded crown with massive horizontal limbs. Acorns have shallow warty caps covering one-quarter of the nut. The light gray bark color distinguishes white oak from darker-barked oak species."

