- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass (Rockfish) Facts
  facts:
  - Adopted in 1965 by the Maryland General Assembly.
  - Scientific name is Morone saxatilis.
  - Has seven or eight dark stripes running from head to tail.
  - Maryland's Chesapeake Bay record weighed 67 pounds, 8 ounces, caught in 1995.
  - Can live as long as 30 years.
faq:
- question: What is Maryland's state fish?
  answer: Maryland's state fish is the rockfish, also called the striped bass. Its scientific name is Morone saxatilis.
- question: When did Maryland adopt the Striped Bass (Rockfish)?
  answer: The Maryland General Assembly named the rockfish the official state fish in 1965.
- question: Why did Maryland choose the Striped Bass (Rockfish)?
  answer: Lawmakers said Chesapeake Bay residents knew the rockfish well because it is fun to catch and good to eat, and they called it an old Maryland fish worth honoring.
- question: Why do Marylanders call the striped bass a rockfish?
  answer: Rockfish is the common local name for the striped bass around the Chesapeake Bay. Both names refer to the same fish, and Maryland's official records use both.
- question: How big can a Maryland rockfish get?
  answer: Very big. The Maryland record for a rockfish caught in the Chesapeake Bay weighed 67 pounds, 8 ounces, and it was caught in 1995.
