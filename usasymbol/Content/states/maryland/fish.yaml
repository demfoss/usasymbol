seo_title: Maryland State Fish | Striped Bass (Rockfish)
seo_description: The Maryland state fish is the striped bass, or rockfish, adopted in 1965. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/maryland/maryland-fish-hero.webp
hero_image_alt: A silver striped bass with an olive green back and seven or eight dark stripes running from head to tail.
hero_image_caption: The striped bass, called rockfish by most Marylanders, is the official state fish of Maryland. Photo by Robert Hsiao, CC BY 3.0.
intro_text: Maryland's state fish is the striped bass, known locally as the rockfish. It is a silver, dark-striped fish of the Chesapeake Bay, adopted in 1965. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Maryland?
  paragraphs:
  - The rockfish, also called the striped bass, became Maryland's official fish when the Maryland General Assembly named it in 1965. Its scientific name is Morone saxatilis.
  - Marylanders usually call it rockfish. Anglers in many other states call the same fish striped bass or striper.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass (Rockfish)
  paragraphs:
  - The striped bass has an olive green back that fades to light silver on its sides, and it has a white belly.
  - It is easy to recognize by the seven or eight dark, unbroken stripes that run from its head to its tail.
  - It can grow very large. Maryland's record rockfish from the Chesapeake Bay weighed 67 pounds, 8 ounces, and it was caught in 1995.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Maryland General Assembly made the rockfish the official state fish in 1965. Lawmakers opened the law with a statement explaining why Marylanders value this Chesapeake Bay fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Maryland Chose the Striped Bass (Rockfish)
  paragraphs:
  - State lawmakers said people living around the Chesapeake Bay knew the rockfish well because it is fun to catch and good to eat. They called it an old Maryland fish that deserved to be honored.
  - Many people still think of the rockfish as the most important fish in the Bay for both sport and commercial fishing.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass (Rockfish)
  paragraphs:
  - Rockfish live throughout the Chesapeake Bay. Each spring, adult fish swim up the rivers and streams that feed the Bay to spawn.
  - Young fish born in the Bay usually stay there for their first 3 to 5 years. After that, many swim out to the Atlantic Ocean.
