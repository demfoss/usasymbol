name_meaning:
  heading: What Does Maryland Mean?
  paragraphs:
  - Maryland is one of the original thirteen states and became the 7th state to ratify the U.S. Constitution on April 28, 1788. The colony was founded under the Calvert family in the 1600s, and the state name honors Queen Henrietta Maria, wife of King Charles I.
  - Maryland's official symbolism keeps the Calvert connection unusually visible. The flag uses Calvert and Crossland heraldry, while the motto comes from the Calvert family rather than from a later legislative slogan.
  - Maryland's postal abbreviation is MD, and residents are Marylanders. Its best-known nickname, the Old Line State, points away from colonial naming and toward the Maryland Line soldiers of the Revolutionary War.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for Queen Henrietta Maria in the colonial period.
    - label: Statehood
      text: Maryland ratified the U.S. Constitution on April 28, 1788.
    - label: Calvert link
      text: Calvert family heraldry and motto language remain central to Maryland symbols.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Maryland, a Mid-Atlantic state spanning Chesapeake waters, Piedmont farms, Baltimore, and western mountains.
    - label: Colony
      text: Maryland began as a proprietary colony under the Calvert family.
    - label: People
      text: People from Maryland are called Marylanders.
  - heading: Nicknames and Short Forms
    items:
    - label: Old Line State
      text: Nickname honoring Maryland Line troops in the Revolutionary War.
    - label: Free State
      text: Informal nickname with a later political history.
    - label: Chesapeake State
      text: Nickname tied to the Chesapeake Bay.
    - label: Abbreviation
      text: MD; older short form Md.
editorial:
  heading: What Maryland's Symbols Say About the State
  paragraphs:
  - Maryland's [state flag](/states/maryland/flag) is the rare state flag that people recognize instantly without needing the state name printed on it. Its Calvert black-and-gold and Crossland red-and-white quarters turn family heraldry and Civil War reconciliation into one bright public emblem.
  - "The [Baltimore oriole](/states/maryland/bird), [black-eyed Susan](/states/maryland/flower), and [Chesapeake Bay retriever](/states/maryland/mammal/chesapeake-bay-retriever) all match Maryland visually or geographically: orange and black plumage, golden roadside flowers, and a water dog built for the bay."
  - Maryland's beverage symbols show a state arguing with its own image. [Milk](/states/maryland/beverage/milk) points inland to dairy farms, [rye whiskey](/states/maryland/beverage/rye-whiskey) revives a lost distilling identity, and the [Orange Crush](/states/maryland/beverage/orange-crush) makes Ocean City bar culture official after Delaware moved first.
faq:
- question: What is Maryland's most famous state symbol?
  answer: The [Maryland state flag](/states/maryland/flag) is the state's most recognizable symbol because its Calvert and Crossland heraldic quarters are visually distinctive and historically specific.
- question: What is Maryland's state bird?
  answer: Maryland's state bird is the [Baltimore oriole](/states/maryland/bird), adopted in 1947.
- question: What is Maryland's state flower?
  answer: Maryland's state flower is the [black-eyed Susan](/states/maryland/flower), adopted in 1918 after schoolchildren supported it.
- question: Why is Maryland's motto in Italian?
  answer: Maryland's [Fatti Maschii, Parole Femine](/states/maryland/motto) came from the Calvert family motto, making Maryland the only U.S. state with an official motto in Italian.
- question: How many official state symbols does Maryland have?
  answer: Maryland's state symbols list here includes the flag, oriole, black-eyed Susan, white oak, motto, colors, dinosaur, beverages, and animal symbols.
