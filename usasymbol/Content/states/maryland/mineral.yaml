faq:
  - question: What is Maryland's state mineral?
    answer: "Maryland's state mineral is chromite, the main ore of chromium, adopted by the Maryland General Assembly in 2025."
  - question: When did Maryland adopt chromite as its state mineral?
    answer: "The Maryland General Assembly designated chromite the official state mineral in 2025."
  - question: Why did Maryland choose chromite?
    answer: "Isaac Tyson Jr.'s early 1800s discovery of chromite near Baltimore made Maryland the world's primary source of chromium for decades, a first the state wanted to formally recognize."
  - question: Where can you find chromite in Maryland?
    answer: "Baltimore County holds Maryland's historic chromite deposits, centered on Bare Hills and the Soldiers Delight serpentine barrens, part of which is preserved today as a public natural area."

