sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Maryland State Mineral
    paragraphs:
      - "Chromite is Maryland's official state mineral, designated by the Maryland General Assembly in 2025. It is the main ore of chromium, a heavy, black mineral found in the serpentine rock belt that runs through Baltimore, Harford, Howard, and Montgomery counties."
      - "Maryland was chosen for this symbol because of a genuine first: in the early 1800s the state supplied nearly all of the world's chromite, before larger deposits were found overseas."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Chromite?"
    paragraphs:
      - "Chromite is a heavy, opaque mineral, iron-black to brownish-black in color, with a dull, pitchy shine and a hardness close to that of hardened steel. It forms cube-shaped crystals, though it more often appears as dense, grainy masses within its host rock."
      - "Chromite is the main commercial source of chromium and forms where magma rich in chromium and iron crystallizes and settles within serpentinized rock. Maryland's deposits occur in exactly that kind of serpentine, or 'soil barren,' terrain around Baltimore."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Maryland Chose Chromite as Its State Mineral"
    paragraphs:
      - "Baltimore merchant Isaac Tyson Jr. identified chromite deposits in Maryland between 1808 and 1827 after noticing the mineral's association with the region's serpentine rock. He built processing works in Baltimore that turned local ore into chromium chemicals and pigments, making the city the center of a young global industry."
      - "For a time, Maryland was the primary, and sometimes the only, source of chromite feeding the world's early industrial chromium demand, supplying material used in steel for buildings, bridges, and railroads. Mining declined by the 1860s as larger overseas deposits were discovered, but the state's early dominance made chromite an obvious choice to honor."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Chromite Became Maryland's State Mineral"
    paragraphs:
      - "The Maryland General Assembly designated chromite the official state mineral in 2025, recognizing the mineral tied to Isaac Tyson Jr.'s 19th-century discovery and Maryland's brief run as the world's chief chromite supplier."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Chromite Is Found in Maryland"
    paragraphs:
      - "Baltimore County holds Maryland's most significant chromite deposits, historically centered on Bare Hills and the Soldiers Delight serpentine barrens. Soldiers Delight Natural Environment Area preserves part of that landscape today and is open to the public."
    sites:
      - name: Soldiers Delight Natural Environment Area
        city: Owings Mills
        lat: 39.4197
        lng: -76.8397
        note: "Historic chromite-bearing serpentine barrens"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Chromite Facts"
    facts:
      - "Adopted as Maryland's state mineral in 2025."
      - "Isaac Tyson Jr. discovered Maryland's chromite deposits between 1808 and 1827 by tracing the mineral to the region's serpentine rock."
      - "Maryland was once the primary source of the world's chromite, supplying an industry that made chromium steel for buildings, bridges, and railroads."
      - "Baltimore's Chrome Works processed local chromite until 1985, after which the site required an extensive environmental cleanup completed in 1999."

