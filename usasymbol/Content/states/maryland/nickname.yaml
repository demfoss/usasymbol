seo_title: "Maryland State Nickname: The Old Line State"
seo_description: "Maryland’s Old Line State nickname originates from the Maryland Line, whose soldiers played a key role in the Revolutionary War."

intro_text: "Maryland carries the widely recognized nickname <i>The Old Line State</i>. This name honors Maryland troops who fought in the Revolutionary War from 1775 to 1783. The Maryland Line regiments earned respect for holding their position during the Battle of Long Island in August 1776. These soldiers fought to let other American forces escape from British troops, and the same era is reflected in language on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine). Maryland's state song mentions the Old Line and celebrates the bravery shown by Maryland soldiers during the war."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Old Line State'"
    paragraphs:
      - "The Old Line State nickname comes from the Maryland Line, which was the name for Maryland's regular army units during the Revolutionary War. These regiments fought in major battles across the colonies. The Battle of Long Island on August 27, 1776, was fought in Brooklyn — the very ground whose explosive growth would later define the [history of the Empire State](/states/new-york/nickname/the-empire-state). That stand made the Maryland Line famous. About 400 Maryland soldiers charged British forces multiple times to protect retreating American troops."
      - "The term Old Line is traditionally associated with George Washington's praise of Maryland troops after watching them hold their ground against much larger enemy forces. Only a small number of Maryland soldiers survived that battle, but their actions saved thousands of other American fighters. The Maryland Line continued fighting through the entire war. These regiments served at Valley Forge, fought at the Battle of Cowpens, and helped win the final victory at Yorktown in 1781, a military path often contextualized through [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "People started using Old Line State as Maryland's nickname in the years after the Revolutionary War ended. The name appeared in newspapers and speeches during the 1800s. Today the nickname reminds people of the courage Maryland soldiers showed when America was fighting for independence — and ranks among the most historically grounded military tributes in the [united states nicknames by state](/symbols/nicknames), with enduring visual identity on the [Maryland state flag page](/states/maryland/flag/maryland-state-flag)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Free State"
        text: "Maryland gained this nickname in the 1920s during Prohibition. The 18th Amendment banned alcohol sales across the United States starting in 1920. Maryland refused to pass its own state enforcement laws for Prohibition. A newspaper editor named Hamilton Owens started calling Maryland the Free State because the state government would not add extra rules beyond federal law. The nickname became popular and many people still use it today, alongside long-standing symbols such as the [Maryland state bird](/states/maryland/bird/baltimore-oriole). Maryland residents liked the idea of their state standing up for individual choice."
      - subtitle: "Chesapeake State"
        text: "This name comes from the Chesapeake Bay, which cuts through the middle of Maryland and forms much of the state's eastern border. The bay is about 200 miles long and contains thousands of miles of shoreline when you count all the rivers and inlets. Chesapeake is an Algonquian word meaning great shellfish bay. Fishing and crabbing in the bay have been important to Maryland's economy since colonial times. The Chesapeake State nickname appears in some writings from the 1800s but is less common than other Maryland names."
      - subtitle: "Oyster State"
        text: "People called Maryland this because the Chesapeake Bay produced enormous numbers of oysters in the 1800s and early 1900s. Watermen harvested millions of bushels each year. Baltimore became a center for oyster packing and shipping. At its peak, Maryland supplied about half of all oysters eaten in America. Oyster harvests began dropping in the mid-1900s because of overfishing and pollution. The Oyster State nickname was popular when the oyster industry was at its strongest but is rarely used now."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Maryland became the seventh state to ratify the Constitution on April 28, 1788."
      - "The state motto is Fatti maschii, parole femine, Italian words meaning manly deeds, womanly words."
      - "Maryland's state song is titled Maryland, My Maryland and includes references to the Old Line."
      - "The Maryland Line regiments included both infantry and cavalry units during the Revolutionary War."
      - "Annapolis served as the United States capital from November 1783 to August 1784."
      - "Maryland is the only state with an official state sport, which is jousting, adopted in 1962."

faq:

  - question: "What is Maryland nickname?"
    answer: "Maryland's nickname is the Old Line State. The name comes from the Maryland Line, a group of soldiers who fought during the American Revolutionary War."

  - question: "Why is Maryland called the Old Line State?"
    answer: "Maryland earned this name because Maryland Line troops showed discipline and bravery during key battles of the Revolutionary War, including the Battle of Long Island in 1776."

  - question: "What is the Maryland nickname origin?"
    answer: "The Maryland nickname origin traces to the Revolutionary War. The term Old Line referred to experienced and dependable soldiers, a reputation earned by Maryland regiments."

  - question: "What does the Old Line State nickname mean?"
    answer: "The Old Line State nickname honors Maryland's reputation for loyalty and military service, based on the performance of the Maryland Line during the fight for independence."

  - question: "What is the state of Maryland nickname?"
    answer: "The state of Maryland nickname is the Old Line State. Maryland also goes by the Free State from the 1920s and was called the Chesapeake State."

  - question: "What is Maryland nickname and motto?"
    answer: "Maryland's nickname is the Old Line State and its motto is Fatti maschii, parole femine, meaning manly deeds, womanly words."

  - question: "What was colonial Maryland nickname?"
    answer: "Colonial Maryland did not have an official nickname. The Old Line State name came after the Revolutionary War ended, honoring the Maryland Line troops who fought for independence."

