timeline:
  - year: "1632"
    description: "King Charles I grants the Maryland colonial charter to Cecil Calvert, second Baron Baltimore; the Calvert coat of arms quartering gold-and-black paternal arms with red-and-white maternal Crossland arms becomes the foundation of Maryland's future color tradition"
  - year: "1634"
    description: "First Maryland colonists arrive at St. Mary's City under the direction of Cecil Calvert; the Calvert family arms representing gold, black, red, and white serve as Maryland's colonial heraldic standard throughout the proprietary period"
  - year: "1788"
    description: "Maryland ratifies the U.S. Constitution and becomes the 7th state; the state adopts a flag consisting of the state seal on a blue field, temporarily setting aside the Calvert family colors"
  - year: "1854"
    description: "The Calvert coat of arms is restored to the Maryland state seal; gold-and-black Calvert banners, known as the 'Baltimore Colors' or 'Maryland Colors,' begin reappearing at public events as informal symbols of Maryland identity"
  - year: "1861"
    description: "The Civil War divides Maryland's loyalties; Union-loyal Marylanders adopt gold-and-black Calvert colors as their symbol while Confederate sympathizers adopt red-and-white Crossland colors as their 'secession colors,' assigning opposing Civil War meanings to the same heraldic family arms"
  - year: "1880"
    description: "The combined Calvert-and-Crossland flag design is flown publicly for the first time on October 11 at a Baltimore parade marking the 150th anniversary of the city's founding, presenting all four colors together as a symbol of post-war reconciliation"
  - year: "1888"
    description: "The combined Maryland flag is displayed on October 25 at Gettysburg Battlefield for ceremonies honoring Maryland's Civil War regiments from both sides, cementing the four-color design as a symbol of unified Maryland identity at the site of the war's most celebrated Maryland action"
  - year: "1904"
    description: "The Maryland General Assembly formally adopts the current flag under Chapter 48, Acts of 1904 on March 9, codifying gold, black, red, and white as Maryland's official heraldic colors under what is now Maryland General Provisions Code § 7-201 and § 7-202"

expert_quote:
  text: "Maryland's flag is the only genuine heraldic banner among all fifty state flags — it is not a design created for a state but a 17th-century family coat of arms that became a state flag, carrying colors whose meaning was transformed by the Civil War into something no heraldist in 1632 could have imagined."
  source: "Maryland State Archives, Office of the Secretary of State, Flag History Documentation"

faq:
  - question: "What are the state colors of Maryland?"
    answer: "The traditional state colors of Maryland are Red, White, Black, and Gold, derived from the Calvert and Crossland family coats of arms displayed on the state flag adopted in 1904 under Maryland General Provisions Code § 7-201 and § 7-202. Maryland has no separate state color statute."
  - question: "What is the HEX code for Maryland Gold?"
    answer: "The closest standard HEX code for Maryland Gold is #FFCD00, corresponding to Pantone PMS 116, which approximates the heraldic tincture Or (gold) as specified in the Calvert quarters of the state flag under Maryland General Provisions Code § 7-202. This is a standard heraldic approximation, not a legislatively mandated value."
  - question: "What is the HEX code for Maryland Red?"
    answer: "The closest standard HEX code for Maryland Red is #CE1126, corresponding to Pantone PMS 186, which approximates the heraldic tincture Gules (red) as specified in the Crossland quarters of the state flag under Maryland General Provisions Code § 7-202."
  - question: "What is the HEX code for Maryland Black?"
    answer: "Maryland Black is pure black, HEX #000000, corresponding to the heraldic tincture Sable as specified in the Calvert quarters of the state flag."
  - question: "When was Maryland's state flag officially adopted?"
    answer: "The Maryland state flag was officially adopted on March 9, 1904, under Chapter 48, Acts of 1904, by the Maryland General Assembly. The design had been in informal public use since 1880, when it was first flown at a Baltimore parade marking the 150th anniversary of the city's founding."
  - question: "Why does Maryland have four state colors?"
    answer: "Maryland's four colors — gold, black, red, and white — come from two separate heraldic coats of arms: the gold-and-black Calvert arms of the Lords Baltimore who founded the Maryland colony, and the red-and-white Crossland arms of the Calvert family's maternal line. The combined four-color flag became a symbol of Civil War reconciliation in the 1880s."
  - question: "Is Maryland's flag the only U.S. state flag based on heraldry?"
    answer: "Yes. Maryland's state flag is the only U.S. state flag that is a direct heraldic banner of arms, reproducing the 17th-century coat of arms of Cecil Calvert, the second Baron Baltimore, without modification. It is one of only four state flags containing no blue, alongside Alabama, California, and New Mexico."
  - question: "What do the Calvert and Crossland colors represent?"
    answer: "The gold and black Calvert arms represent the paternal line of the Lords Baltimore and became associated with Union loyalty during the Civil War. The red and white Crossland arms represent the maternal line of the Calvert family and became associated with Confederate sympathy during the Civil War. Together on the flag, they represent Maryland's post-war reconciliation."

