sections:
  - id: "official-designation"
    title: "Legislative Basis and Flag History"
    style: "default"
    paragraphs:
      - "Maryland has not enacted a separate legislative statute designating official state colors by name, in the manner of states such as California under Government Code § 424. Maryland's color tradition is instead inseparable from the state flag itself, which is formally designated under Maryland General Provisions Code § 7-201 as the State flag and described in precise heraldic language under § 7-202. The flag's four colors — gold, black, red, and white — derive entirely from the coats of arms of the Calvert and Crossland families, making Maryland one of the few American states whose color palette originates in 17th-century English heraldic tradition rather than modern legislative deliberation and supporting [the Old Line State nickname](/states/maryland/nickname/the-old-line-state)."
      - "The Maryland General Assembly formally adopted the current flag design under Chapter 48, Acts of 1904, on March 9, 1904. The design had already been in informal public use since October 11, 1880, when it was first flown at a Baltimore parade marking the 150th anniversary of the founding of the city, and again on October 25, 1888, at Gettysburg Battlefield for ceremonies dedicating monuments to Maryland's Civil War regiments. The 1904 codification gave permanent legal standing to a color combination that had spent more than two decades serving as a symbol of post-Civil War reconciliation in a state that had fielded troops on both sides of the conflict."
    subsections:
      - subtitle: "Maryland General Provisions Code § 7-202 and Heraldic Specifications"
        text: "Maryland General Provisions Code § 7-202 describes the state flag in formal heraldic language, specifying the first and fourth quarters as a paly of six pieces or (gold) and sable (black) with a bend dexter counterchanged, and the second and third quarters as quartered argent (white) and gules (red) with a cross bottony counterchanged. The statute does not specify Pantone or HEX values, as is common with historically derived flag descriptions rooted in heraldic tincture convention. Maryland law also requires that any ornament affixed to the top of a flagstaff carrying the state flag must be a gold cross bottony, the same trefoil-ended cross symbol appearing in the Crossland quarters of the flag, reinforcing the heraldic coherence of the four-color system across all official applications also reflected on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine)."
      - subtitle: "Cecil Calvert and the 17th-Century Origins of the Color Palette"
        text: "The four colors of Maryland's flag trace to Cecil Calvert, the second Baron Baltimore, who received the Maryland charter from King Charles I of England in 1632 and directed the first settlement of the colony in 1634. Cecil's coat of arms combined the gold-and-black paly arms of the Calvert paternal line — which George Calvert, the first Baron Baltimore, had received for military valor, the pattern of vertical bars evoking the palisade fortifications of a besieged stronghold — with the red-and-white quarterly arms bearing a cross bottony from his grandmother's Crossland family, which the Calverts were entitled to display because the Crossland heiress had married into the family. This quartered heraldic composition, unchanged in substance from the 17th century, became the state flag of Maryland in 1904 and remains the most direct link between any U.S. state's public imagery and its colonial founding family."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Maryland's four colors carry a weight of historical meaning that is unique among American state color palettes. Unlike most state colors chosen to represent natural landscapes or civic ideals, Maryland's gold, black, red, and white were assigned their symbolic meaning through centuries of English heraldic tradition before Maryland existed as a political entity, and then reinterpreted through the traumatic experience of the American Civil War. The same four colors that adorned a 17th-century English nobleman's coat of arms became, in the 1860s, the distinguishing symbols of Americans fighting on opposite sides of the bloodiest conflict in the nation's history — and then, in the 1880s, the colors of reconciliation as Maryland's divided population sought to rebuild a unified state identity across a region captured in [states neighboring states](/rankings/geography/states-neighboring-states)."
    subsections:
      - subtitle: "Gold and Black: The Calvert Arms and Union Loyalty"
        text: "The gold-and-black Calvert arms represent the paternal lineage of the Lords Baltimore and were the original Maryland colors used during the colonial period. After American independence severed Maryland's official connection to the Calvert family, the gold-and-black arms fell out of use but were reintroduced in 1854 when the Calvert coat of arms was restored to the Maryland state seal. By the outbreak of the Civil War in 1861, Marylanders who supported remaining in the Union had adopted gold and black as their identifying colors, wearing gold-and-black cockades and flying gold-and-black banners at public demonstrations. Maryland's Union regiments carried gold-and-black regimental flags, cementing the association between the Calvert colors and loyalty to the United States that persists in the flag's symbolism today."
      - subtitle: "Red and White: The Crossland Arms and Reconciliation"
        text: "The red-and-white Crossland arms gained their specific Maryland significance during the Civil War in the most divisive possible context. Following Abraham Lincoln's election in November 1860, Marylanders who sympathized with the Southern cause adopted red and white as their 'secession colors,' wearing red-and-white stockings, cravats, and accessories as a public signal of Confederate sympathy. Maryland-born Confederate soldiers wore metal cross bottony pins on their uniforms and carried red-and-white flags into battle. By the war's end, red and white were indelibly associated with the Confederate side of Maryland's divided loyalties. The genius of the combined flag design that emerged in the 1880s was that it placed the Crossland red-and-white directly alongside the Calvert gold-and-black, transforming both sets of Civil War colors into components of a unified Maryland identity. The combined flag's first public appearance at the 1880 Baltimore parade and its 1888 display at Gettysburg — the site of Maryland's most celebrated Civil War engagement — explicitly framed the four colors as symbols of reunion rather than division."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Maryland's four colors appear with exceptional consistency across the state's governmental, academic, and sporting institutions, reflecting the strength of the flag-derived color tradition. The University of Maryland, College Park athletic teams have used all four flag colors for generations, with red and white as primary colors and black and gold as accent colors; the university's football field at SNAP Interactive Stadium features both the Calvert and Crossland patterns painted in the end zones. The University of Maryland, Baltimore County (UMBC) uses all four colors in its primary institutional logo. The Baltimore Ravens of the National Football League incorporate a shield bearing alternating Calvert and Crossland banner designs in their alternate logo. The Johns Hopkins University in Baltimore features the Maryland flag's color scheme and design in its institutional seal. Maryland's standard-issue license plates from 1986 to 2010 featured the flag's distinctive design in the central seal, and the state maintains among the highest recognition rates of any U.S. state flag in national surveys — consistently ranked among the top three state flags in design quality by the North American Vexillological Association."

