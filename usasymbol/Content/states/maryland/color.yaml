seo_title: "Maryland State Colors | Red White Black Gold"
seo_description: "Maryland state colors are Red, White, Black, and Gold, drawn from the state flag and heraldic arms. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Maryland are **Red**, **White**, **Black**, and **Gold**, derived from the heraldic coats of arms on [the Maryland state flag](/states/maryland/flag/maryland-state-flag) adopted in 1904. Maryland has not designated official state colors by separate legislative statute; the colors are inseparable from the flag itself and appear throughout all official state branding and insignia. For Maryland, the color cards give HEX, RGB, CMYK, and Pantone references alongside the full [U.S. state colors index](/symbols/colors)."

official_colors: "Red, White, Black, and Gold"
official_since: "Traditional / State Flag (Maryland General Provisions Code § 7-201 and § 7-202; flag adopted 1904)"
primary_use: "State flag, state seal, University of Maryland athletics, Baltimore Ravens alternate logo, state agency branding"
known_for: "The only U.S. state flag based on English heraldic family arms; black and gold Calvert arms represented Union loyalty during the Civil War while red and white Crossland arms represented Confederate sympathy; the combined flag became a symbol of post-war reconciliation unique in American vexillology"

