        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Patuxent River Stone Facts"
    facts:
      - "Adopted as Maryland's state gem effective October 1, 2004."
      - "Patuxent River stone has not been documented anywhere outside Maryland's Patuxent River watershed."
      - "Its red and yellow banding is often compared to the red and gold colors of the Maryland state flag."
      - "Collecting is prohibited at several public access points along the river, including Jug Bay Natural Area and Patuxent River State Park."

