faq:
  - question: What is Maryland's state gem?
    answer: "Maryland's state gem is the Patuxent River stone, a red-and-yellow banded agate found only along the Patuxent River, adopted in 2004."
  - question: When did Maryland adopt the Patuxent River stone as its state gem?
    answer: "The Maryland General Assembly designated the Patuxent River stone the official state gem effective October 1, 2004."
  - question: Why did Maryland choose the Patuxent River stone?
    answer: "The stone occurs nowhere outside Maryland and shows red and yellow banding that echoes the colors of the state flag, giving Maryland a gemstone genuinely its own."
  - question: Where can you find the Patuxent River stone in Maryland?
    answer: "It occurs in gravel along the Patuxent River from Howard and Montgomery counties down to Calvert County, though collecting is restricted at public sites like Jug Bay Natural Area."

