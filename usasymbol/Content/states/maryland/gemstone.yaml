intro_text: "Maryland's state gem is the Patuxent River stone, adopted in 2004, a form of agate found only within the state and prized for red and yellow banding that echoes the colors of the Maryland flag. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Maryland State Gem
    paragraphs:
      - "The Patuxent River stone is Maryland's official state gem, designated by the Maryland General Assembly effective October 1, 2004. It is a variety of agate found nowhere else in the world, occurring only in gravel deposits along the Patuxent River."
      - "Its red and yellow coloring, close to the red and gold-yellow of the Maryland state flag, gave the designation an easy visual connection to state identity."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is the Patuxent River Stone?"
    paragraphs:
      - "The Patuxent River stone is an agate, a banded cryptocrystalline variety of quartz, colored in bands of red, orange, and yellow from iron staining. Polished pieces show smooth, rounded color zones rather than sharp crystal faces."
      - "Patuxent River stone occurs as small, water-worn nodules within river gravel rather than in solid bedrock outcrops. Some geologists have debated the stone's precise composition, with alternate descriptions ranging from iron-stained quartzite to agatized fossil material, though the state's official designation identifies it as agate."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Maryland Chose the Patuxent River Stone as Its State Gem"
    paragraphs:
      - "Maryland wanted a gemstone that was genuinely its own, and the Patuxent River stone fits that description more literally than most state gems: it has not been documented anywhere outside the state. Its river-worn banding also happens to match Maryland's own flag colors, red and gold."
      - "The Patuxent River runs entirely within Maryland, from its headwaters in Howard County to where it meets the Chesapeake Bay, giving the state a gemstone tied to a waterway that never leaves its borders."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the Patuxent River Stone Became Maryland's State Gem"
    paragraphs:
      - "The Maryland General Assembly designated the Patuxent River stone the official state gem effective October 1, 2004, adding it to the state's roster of official symbols alongside the state bird, flower, and tree."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Patuxent River Stone Is Found in Maryland"
    paragraphs:
      - "The stone occurs in gravel along the Patuxent River as it runs through central Maryland, from Howard and Montgomery counties near its headwaters down through Anne Arundel, Prince George's, and Calvert counties toward the Chesapeake Bay. Collecting is restricted at public sites such as Jug Bay Natural Area, so most legal collecting depends on private landowner permission."
    sites:
      - name: Jug Bay Natural Area
        city: Upper Marlboro
        lat: 38.7807
