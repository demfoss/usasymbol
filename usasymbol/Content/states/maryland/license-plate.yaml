sections:
- id: fort-mchenry
  icon: fa-solid fa-flag-usa
  title: The Fort McHenry Plate and the Star-Spangled Banner
  paragraphs:
  - "In June 2010, Maryland issued a new standard plate depicting Fort McHenry in red, white, and blue — bombs bursting in air, the fort's ramparts, and the American flag flying high above. The imagery came directly from the events of September 13–14, 1814, when British naval forces bombarded the fort through the night and Francis Scott Key, watching from a ship in Baltimore Harbor, was moved to write \"The Star-Spangled Banner.\" The plate put that moment on every Maryland car."
  - 'Public reaction was divided. Some appreciated the historical connection; others found the design cartoonish or busy for a standard-issue plate. Maryland had not previously used its standard plate for this kind of narrative illustration, and the Fort McHenry design was a significant departure from the plainer 1986 base it replaced. It remained the default new-issue design until the Maryland Proud flag base began in September 2016.'
  - "The plate later attracted a different kind of attention. A URL printed on the design — part of the bicentennial commemorative branding — was eventually found to redirect to an online gambling site after the original domain lapsed. The plate had been off-issue for years by the time the link surfaced publicly in 2023, but it became a widely shared oddity: a patriotic Maryland plate with an accidental casino connection. For broader context on Maryland's official symbols, see the [Maryland state flag](/states/maryland/flag), whose Calvert heraldry is as historically specific as any plate text the state has produced."

- id: tercentenary
  icon: fa-solid fa-scroll
  title: The 1934 Tercentenary Plate
  paragraphs:
  - 'Maryland''s first license plate text beyond serial numbers and the state name arrived in 1934, when the state issued a commemorative plate marking the 300th anniversary of its founding. The top of the plate read "1634 MARYLAND 1934" in abbreviated characters; the bottom edge carried the word "TERCENTENARY" in matching font. It was a precise bibliographic statement: Maryland was founded in 1634 when the Ark and the Dove landed at St. Clement''s Island, and 1934 was the tricentennial of that arrival.'
  - 'The plate required thinner steel than a standard issue — 22-gauge rather than the customary 20-gauge — because the extra lead lettering pressed into both edges demanded the reduction. That small engineering detail speaks to how seriously Maryland treated the commemorative. It was not a sticker or an add-on; the anniversary text was stamped into the metal alongside the registration number.'
  - "The Tercentenary plate connects to the same founding history visible in Maryland's other official symbols. The [state motto](/states/maryland/motto) came from the Calvert family, who founded the Maryland colony, and the [state flag](/states/maryland/flag) uses Calvert heraldry that predates the colony itself. The 1934 plate continued that pattern of treating the founding as something worth displaying."

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Maryland License Plate Designs by Era
  paragraphs:
  - Maryland has used the plate for historical commemoration, public safety messaging, and standard identification. Each major design era reflects what the state decided was worth saying at the time.
  versions:
  - name: TERCENTENARY
    years: '1934'
    image: /images/license-plates/maryland/1934-tercentenary-plate.jpg
    description: "The 1634–1934 commemorative plate marked the 300th anniversary of Maryland's founding at St. Mary's City. \"1634 MARYLAND 1934\" ran across the top; \"TERCENTENARY\" ran across the bottom. Produced in 22-gauge steel — thinner than standard — to accommodate the additional lettering pressed into both edges. The first time text beyond the state name appeared on a Maryland plate."
  - name: DRIVE CAREFULLY
    years: 1942 base
    image: /images/license-plates/maryland/1942-drive-carefully-plate.jpg
    description: Maryland added the safety slogan "DRIVE CAREFULLY" during World War II. The 1942 base used black lettering on a silver background, carrying a direct road-safety message at a time of reduced speed limits, rubber shortages, and wartime material pressures.
  - name: DRIVE CAREFULLY
    years: 1945 base
    image: /images/license-plates/maryland/1945-drive-carefully-plate.jpg
    description: Maryland repeated "DRIVE CAREFULLY" on the 1945 base, reversing the earlier color scheme to silver lettering on black. The second use shows that the message was not a one-year novelty but a wartime and immediate-postwar safety slogan.
  - name: 1986 base (web address added 2005)
    years: 1986–2009
    image: /images/license-plates/maryland/2005-web-address-1986-base.jpg
    description: Maryland's longest-running modern base design, introduced in 1986 alongside staggered registration periods that ended the uniform March 31 expiration system. Near the tail end of the base's life, in 2005, the state added a web address — Maryland had begun directing drivers to official online resources. The 1986 base ran for over two decades before giving way to the Fort McHenry design.
  - name: Fort McHenry / War of 1812 Bicentennial
    years: 2010–2016
    image: /images/license-plates/maryland/2010-fort-mchenry-plate.jpg
    description: Maryland's most visually ambitious standard plate — a full-color scene of Fort McHenry under bombardment, with the American flag and fireworks overhead. Issued in June 2010 for the War of 1812 bicentennial. The design depicted the night of September 13–14, 1814, when British forces bombarded the fort and Francis Scott Key witnessed the flag still flying at dawn. It remained the standard new-issue plate until Maryland Proud began in September 2016.
  - name: Maryland Proud
    years: 2016–present
    image: /images/license-plates/maryland/2016-maryland-proud-plate.png
    description: Maryland's current standard design, introduced September 26, 2016. The plate replaced the War of 1812 / Fort McHenry design for new standard-issue plates and returned to a cleaner white field with black serial characters, a red Maryland name, and the state flag graphic along the bottom edge.

- id: commemorative-tradition
  icon: fa-solid fa-rotate
  title: A State That Uses the Plate to Mark History
  paragraphs:
  - "Maryland's plate history follows a pattern that most states do not. Rather than settling on a fixed tourism or identity slogan — as Maine has done with [Vacationland](/states/maine/license-plate) or Alaska with [The Last Frontier](/states/alaska/license-plate) — Maryland has repeatedly used the plate as a medium for historical announcement. The 1934 Tercentenary, the wartime \"Drive Carefully,\" and the Fort McHenry bicentennial plate all did the same thing: they turned a registration document into a declaration about where the state stood in time."
  - "Maryland's [Old Line State](/states/maryland/nickname) nickname honors Revolutionary War soldiers, and its motto and flag both trace directly to the founding Calvert family. The plate has followed the same instinct — reaching back to specific events rather than forward to aspirational marketing language. Even the 2005 web address was a practical addition to a long-running plate rather than a new identity statement."
  - 'For how other states have handled their plate text, see the [U.S. license plate slogans by state](/license-plates) guide.'

timeline:
- year: '1634'
  description: Maryland is founded as an English colony at St. Clement's Island — the event the 1934 license plate would commemorate three centuries later.
- year: '1814'
  description: British forces bombard Fort McHenry on the night of September 13–14. Francis Scott Key witnesses the flag still flying at dawn and writes "The Star-Spangled Banner" — the event behind the 2010 plate.
- year: '1910'
  description: Maryland begins issuing official motor vehicle license plates — initially hand-embossed thin tin, transitioning to porcelain by 1911.
- year: '1934'
  description: Maryland issues the TERCENTENARY plate marking 300 years since the colony's founding. Text appears on both edges; production uses thinner 22-gauge steel to accommodate the extra lettering.
- year: '1942'
  description: '"DRIVE CAREFULLY" appears on Maryland plates for the first time, on the 1942 base design (black on silver). Maryland joins other states in putting wartime safety messaging on registration plates.'
- year: '1945'
  description: A second "DRIVE CAREFULLY" base (silver on black) continues the safety slogan into the postwar period.
- year: '1986'
  description: Maryland introduces a new standard base design alongside staggered registration periods, ending the uniform March 31 expiration that had been in place since 1939.
- year: '2005'
  description: A web address is added to Maryland plates near the end of the 1986 base design's long run — the state's first use of the plate to direct drivers online.
- year: '2010'
  description: Maryland issues the Fort McHenry / War of 1812 Bicentennial plate in June as the new standard design. The red, white, and blue scene of the fort under bombardment becomes Maryland's most visually distinctive plate.
- year: '2016'
  description: Maryland begins issuing the Maryland Proud flag design on September 26, replacing the War of 1812 / Fort McHenry base for new standard-issue plates.

faq:
- question: What is on the Maryland license plate?
  answer: Maryland's current standard license plate is the Maryland Proud design, introduced in 2016, with the Maryland flag graphic along the bottom edge. A widely recognized earlier modern plate, issued in 2010, showed Fort McHenry with the American flag above bombs bursting in air — imagery from the 1814 battle that inspired "The Star-Spangled Banner."
- question: What does Maryland's license plate say?
  answer: Maryland plates have carried different text at different times. The 1934 plate said "TERCENTENARY"; the 1942 and 1945 bases said "DRIVE CAREFULLY"; the 1986 base later added a web address; the 2010 Fort McHenry plate carried bicentennial branding for the War of 1812; and the current standard plate is known as Maryland Proud.
- question: Why did Maryland put Fort McHenry on its license plate?
  answer: Maryland issued the Fort McHenry plate in 2010 to mark the bicentennial of the War of 1812. Fort McHenry was the site of the September 1814 British bombardment that Francis Scott Key witnessed before writing "The Star-Spangled Banner," making it one of Maryland's most significant historical locations.
- question: What was Maryland's first license plate slogan?
  answer: The first text to appear on Maryland plates beyond the state name and serial number was "TERCENTENARY" in 1934, marking the 300th anniversary of Maryland's founding in 1634 at St. Mary's City.
- question: Why did Maryland plates say "Drive Carefully"?
  answer: Maryland added "DRIVE CAREFULLY" to its 1942 and 1945 plate bases during and just after World War II. Wartime conditions — reduced speed limits, material shortages, and public safety campaigns — made highway safety a national priority, and several states used the plate to reinforce that message.
- question: Did the Maryland War of 1812 plate really link to a gambling website?
  answer: Yes. A URL included as part of the War of 1812 bicentennial branding on the 2010 plate later redirected to an online gambling site after the original commemorative domain lapsed. The plate had been out of production for years before the link was widely noticed in 2023.

