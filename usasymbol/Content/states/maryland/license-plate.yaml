date_modified: '2026-04-28'
seo_title: "Maryland License Plate Slogan | Maryland Proud"
seo_description: "Maryland Proud is Maryland's current license plate slogan, introduced on the flag-based standard plate in 2016."
hero_image: /images/license-plates/maryland/2016-maryland-proud-plate.png
hero_image_alt: Maryland Proud standard license plate with the Maryland flag across the bottom edge
hero_image_caption: Maryland's current standard plate is the Maryland Proud flag design, introduced September 26, 2016, after the War of 1812 / Fort McHenry base.
intro_text: 'Maryland has never had one defining license plate slogan like many states. Its plates have instead marked public moments and identity shifts: the 1934 Tercentenary, wartime "Drive Carefully" plates, the 2010 Fort McHenry design, and the current **Maryland Proud** flag base introduced in 2016.'
quick_answer: "Maryland has used its license plates to mark specific historical moments rather than maintain a continuous slogan. Notable designs include the 1934 Tercentenary plate (300th anniversary of Maryland's settlement), \"Drive Carefully\" plates on the 1942 and 1945 bases, the 2010 Fort McHenry plate issued for the War of 1812 bicentennial, and the current Maryland Proud flag plate introduced on September 26, 2016."
