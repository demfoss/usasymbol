seo_title: "Maryland State Flower: Black-eyed Susan – History & Facts"
seo_description: "The Black-eyed Susan became Maryland's state flower in 1918. These golden flowers with dark centers bloom across Maryland fields and roadsides."

intro_text: "Maryland chose the Black-eyed Susan as its state flower in 1918, and it appears on the [list of U.S. state flowers](/symbols/flowers). These cheerful golden flowers with distinctive dark centers bloom throughout Maryland alongside forests tied to the [Maryland state tree](/states/maryland/tree/white-oak). Bright yellow petals surrounding a brown cone make the Black-eyed Susan easy to identify across fields and roadsides."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Maryland State Flower?"
    paragraphs:
      - "The Black-eyed Susan holds the position of Maryland's official state flower. Each flower displays 10 to 20 golden yellow petals radiating from a dark brown central cone. The blooms measure 2 to 3 inches across. Orange and yellow petals sometimes show on the same plant. A single stem typically supports one flower head."
      - "Black-eyed Susans bloom from June through September across Maryland. Peak flowering occurs in July and August. The plants grow 1 to 3 feet tall. Hairy stems and leaves give the plant a rough texture. Lance-shaped leaves alternate along the stem. The plants grow as biennials or short-lived perennials depending on conditions."
      - "Native Black-eyed Susans thrive in Maryland's fields, meadows, and roadsides. The flowers prefer full sun and well-drained soil. Drought tolerance makes them hardy across Maryland's varied terrain. Disturbed areas like construction sites support vigorous growth. The plants spread through self-seeding. Maryland summers showcase masses of these golden flowers along highways."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Maryland State Flower Name"
    paragraphs:
      - "This flower carries the common name Black-eyed Susan and the scientific name Rudbeckia hirta. The plant belongs to the Asteraceae family. This massive family includes sunflowers, daisies, asters, and over 23,000 species of flowering plants found worldwide."
      - "The genus name Rudbeckia honors Olof Rudbeck, a Swedish botanist who lived in the 1600s. The species name hirta means hairy in Latin. It describes the rough hairy texture of stems and leaves. Brown Betty and brown daisy serve as alternative common names in some regions."
      - "The name Black-eyed Susan appears in an old English song about a woman named Susan. How this name became attached to the flower remains unclear. Some sources suggest the dark center resembles an eye. The common name dates back at least to the 1700s in America. Maryland residents universally use Black-eyed Susan when referring to their state flower."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Maryland Chose the Black-eyed Susan"
    paragraphs:
      - "Maryland made the Black-eyed Susan its official state flower in 1918. The Maryland General Assembly passed this designation following advocacy by women's civic organizations. School children throughout Maryland participated in voting for their favorite flower. The Black-eyed Susan won this informal vote by a wide margin, fitting themes later reflected on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine)."
      - "Maryland wanted a native flower that grew abundantly across the state. The Black-eyed Susan met both requirements perfectly. Its golden color matched the gold in Maryland's state flag. The flowers bloomed reliably each summer along Maryland's roads. Their cheerful appearance appealed to residents statewide."
      - "No serious opposition emerged during the selection process. Other flowers including the goldenrod received some consideration. The Black-eyed Susan's strong showing in the children's vote influenced legislators. The General Assembly formalized the designation on April 18, 1918. Maryland became one of the early states to involve school children in selecting a state symbol."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maryland State Flower Facts"
    facts:
      - "The Black-eyed Susan is the official flower of the Preakness Stakes horse race held annually in Baltimore, with a blanket of these flowers draped over the winning horse"
      - "Black-eyed Susans attract butterflies, bees, and other pollinators while providing seeds that feed goldfinches and other birds in fall and winter"
      - "Maryland adopted the Black-eyed Susan on April 18, 1918, following an informal vote by school children who selected it as their favorite flower"
      - "The dark central cone contains hundreds of tiny disk flowers that bloom progressively from the outside toward the center over several weeks"
      - "Native Americans used Black-eyed Susan roots to make tea for treating colds and worms, though modern use is not recommended without expert guidance"
      - "Black-eyed Susans can grow as biennials producing only leaves the first year and flowers the second, or as short-lived perennials in favorable conditions"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Maryland State Flower and Bird"
    paragraphs:
      - "The Baltimore Oriole serves as Maryland's state bird, a striking orange and black songbird named after Lord Baltimore's family colors. Both symbols represent Maryland officially. Maryland adopted the Black-eyed Susan in 1918 and designated the Baltimore Oriole as state bird in 1947; see the [Maryland state bird page](/states/maryland/bird/baltimore-oriole)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Black-eyed Susan Symbolizes"
    paragraphs:
      - "The Black-eyed Susan commonly represents encouragement and justice in traditional flower symbolism. The flower has been linked to Maryland's state colors through its golden petals. Its hardy nature frequently represents resilience and adaptability while the cheerful blooms carry connotations of optimism and summer warmth across Maryland's landscape, reinforcing [the Old Line State nickname](/states/maryland/nickname/the-old-line-state)."

faq:
  - question: "What is Maryland's state flower?"
    answer: "Maryland's state flower is the Black-eyed Susan, a golden flower with a distinctive dark brown center that blooms in fields and roadsides throughout the state."
  
  - question: "When did Maryland adopt the Black-eyed Susan as its state flower?"
    answer: "Maryland adopted the Black-eyed Susan on April 18, 1918. The designation followed an informal vote by school children who selected it as their favorite flower."
  
  - question: "Why did Maryland choose the Black-eyed Susan?"
    answer: "Maryland chose the Black-eyed Susan because it grows abundantly across the state and is native to Maryland. The golden color matched the gold in Maryland's state flag. School children voted for it by a wide margin, and its cheerful summer blooms appealed to residents statewide."
  
  - question: "Is the Black-eyed Susan native to Maryland?"
    answer: "Yes, the Black-eyed Susan is native to Maryland and grows wild in fields, meadows, and along roadsides throughout the state. The plant thrives in Maryland's climate and tolerates drought conditions."
  
  - question: "When do Black-eyed Susans bloom in Maryland?"
    answer: "Black-eyed Susans bloom from June through September in Maryland, with peak flowering occurring in July and August. The flowers provide nectar for pollinators and seeds for birds through fall."

