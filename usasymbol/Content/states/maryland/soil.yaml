faq:
- question: What is Maryland's state soil?
  answer: "Maryland's state soil is the Sassafras series, a well-drained sandy loam of the Atlantic Coastal Plain. It is named for the Sassafras River on Maryland's upper Eastern Shore and is the dominant upland soil of the Eastern Shore and Southern Maryland."
- question: Why is it called Sassafras soil?
  answer: "The series is named for the Sassafras River, which flows between Cecil and Kent counties on Maryland's upper Eastern Shore. USDA soil scientists name series after local geographic features — rivers, towns, or counties — near where the soil is first formally studied. The Sassafras River itself was named by early English colonists, likely for the sassafras trees growing along its banks."
- question: What color is Sassafras soil?
  answer: "The surface is brown — a warm, sandy loam that warms quickly in spring. The argillic subsoil shifts to strong brown and reddish yellow from iron oxide that accumulated as the Coastal Plain sediments weathered over thousands of years. The parent material at the base is pale light yellowish brown — relatively unweathered compared to the layers above."
- question: What makes Sassafras soil good for farming?
  answer: "The sandy surface is light and easy to work, warms quickly in spring, and drains fast after rain — qualities that make it practical to plant early and harvest without getting equipment stuck in mud. The clay-enriched subsoil below holds water and nutrients within root reach during dry spells. The combination of a workable surface and a water-retaining subsoil made Sassafras soil attractive to farmers from the first colonial settlements through today."
- question: Where is Sassafras soil found in Maryland?
  answer: "Sassafras soil is found across the Coastal Plain of Maryland — primarily on the Eastern Shore east of the Chesapeake Bay, and in the Southern Maryland counties of Charles, Calvert, and St. Mary's on the Western Shore. Key Eastern Shore counties include Cecil, Kent, Queen Anne's, Caroline, Talbot, and Wicomico."
- question: What is the Delmarva Peninsula?
  answer: "The Delmarva Peninsula is the landmass between the Chesapeake Bay and Delaware Bay shared by Delaware, Maryland, and Virginia — the name comes from combining the three state names. It is one of the most intensively farmed regions on the East Coast, producing corn, soybeans, vegetables, and poultry on Coastal Plain soils, primarily the Sassafras series and close relatives. Maryland's Eastern Shore is the Maryland portion of Delmarva."
- question: How does Sassafras soil connect to the Chesapeake Bay?
  answer: "Sassafras soil drains toward the Chesapeake Bay through rivers and streams on both the Eastern Shore and Western Shore. Nutrients from fertilizer applied to these sandy Coastal Plain soils — including nitrogen and phosphorus from chicken litter spread on Eastern Shore fields — move through the soil and into waterways that flow to the Bay. Nutrient runoff from Sassafras and similar soils is one of the primary factors driving the Bay's water quality problems."
- question: What replaced tobacco on Sassafras soil?
  answer: "Corn and soybeans replaced most tobacco on Sassafras soil after Maryland's tobacco buyout program concluded in 2010 and tobacco acreage fell sharply. Vegetables — sweet corn, melons, green beans — are grown on the warmer lower Eastern Shore. Poultry operations expanded across the same landscape as tobacco declined, and chicken litter became the primary organic fertilizer applied to Sassafras soil fields."

