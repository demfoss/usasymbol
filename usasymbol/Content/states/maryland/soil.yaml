- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and History on Sassafras Soil
  paragraphs:
  - "Tobacco defined Sassafras soil for three hundred years. English colonists planted their first Maryland tobacco crops in the 1630s on Coastal Plain uplands very similar to Sassafras soil, and tobacco remained the dominant cash crop of Maryland's Eastern Shore and Southern Maryland through the nineteenth century. The light, well-drained, easily worked surface made it practical to cultivate with hand labor and horse-drawn equipment long before mechanized farming arrived."
  - "Corn and soybeans now occupy most of the Sassafras soil acreage that once grew tobacco. Maryland phased out its tobacco buyout program in 2010 after decades of declining acreage, and most former tobacco farms on the Eastern Shore converted to row crops. Vegetables — particularly sweet corn, melons, and green beans — are grown on Sassafras soil in the lower Eastern Shore counties where the growing season is longest."
  - "Poultry is the other defining land use on Sassafras soil. Maryland's Eastern Shore is part of the Delmarva poultry belt, one of the most intensive broiler chicken production regions in the country. Chicken litter applied to the light Coastal Plain soils as fertilizer has been a significant source of nitrogen and phosphorus runoff into the Chesapeake Bay — making Sassafras soil central to one of the most complex environmental management challenges in the Mid-Atlantic."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Sassafras Soil Facts
  facts:
  - "The Sassafras series is named for the Sassafras River, which flows between Cecil and Kent counties on Maryland's upper Eastern Shore and empties into the Chesapeake Bay near Ordinary Point."
  - "The soil formed in ancient Coastal Plain sediments — layers of sand, silt, and clay deposited by rivers and the ocean over millions of years as sea levels rose and fell along the Atlantic coast."
  - "Maryland colonists began farming Coastal Plain soils like Sassafras in the 1630s, making the Eastern Shore one of the earliest continuously farmed landscapes in North America."
  - "Sassafras is classified as an Ultisol — a heavily leached soil typical of the humid eastern United States. The leaching is less intense than in Louisiana's warmer, wetter climate, which is why Sassafras subsoil is strong brown rather than the deep red of Gulf South Ultisols like the Ruston series."
  - "The Delmarva Peninsula, where Sassafras soil is most extensive, produces more broiler chickens per square mile than almost any other region in the United States. Chicken litter applied as fertilizer on these sandy soils has made nutrient management a central issue for Chesapeake Bay water quality."
  - "The sassafras tree — for which the Sassafras River and ultimately the soil are named — was one of the first American exports to England. Early colonists shipped sassafras root bark to Europe in the 1600s, where it was sold as a medicine and a flavoring. The tree grows naturally in the forest understory on well-drained Coastal Plain soils like the Sassafras series."

