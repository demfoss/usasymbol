meaning: "Sassafras soil sits on the Coastal Plain uplands where Maryland's first colonists settled in the 1630s. It was the ground under the tobacco fields that made Maryland wealthy in the seventeenth and eighteenth centuries — light enough to work with hand tools, deep enough to grow tall plants, and drained enough that roots never drowned. Three centuries of tobacco, and then corn and soybeans, have changed this soil, but its sandy, well-drained profile is still the reason the Eastern Shore became one of the most intensively farmed landscapes on the East Coast."
