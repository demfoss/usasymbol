seo:
  title: "Most Common Last Names in Maryland, Explained"
  description: "The most common last names in Maryland are Smith, Johnson, and Brown, shaped by Chesapeake tobacco counties, Baltimore immigration, and freedom records."

page:
  h1: "Most Common Last Names in Maryland"
  intro: "Smith, Johnson, and Brown are the most common last names in Maryland, a statewide mix shaped by early Chesapeake tobacco counties, Baltimore's 19th-century immigrant port, and one of the South's largest free Black populations before the Civil War. That combination keeps English patronymics dominant while leaving room for distinctly Maryland names such as Dorsey and Shipley."
  heritage_title: "Chesapeake Tobacco, Baltimore Docks, and Free Black Maryland"
  heritage_body: "Maryland's surname map began with the 1634 founding of St. Mary's City and the spread of English family names through the tobacco counties of St. Mary's, Charles, Calvert, and Prince George's. Baltimore then added a second layer: passenger records started in 1833, and by the late 19th century the city's German-born population had reached 41,930, with Irish and German newcomers crowding the same port neighborhoods. Maryland's freedom records also matter because manumissions and certificates of freedom survive for counties including Anne Arundel, Baltimore, Prince George's, St. Mary's, Dorchester, and Talbot. When Maryland abolished slavery in its 1864 constitution, that older Chesapeake mix of English surnames was already deeply rooted in both Black and white communities."
  fun_fact: "Tydings is one of the most Maryland-centered surnames in the country: Forebears places nearly 73 percent of all U.S. Tydings households in Maryland, a concentration rooted around Harford County and Havre de Grace."

surnames:
  - rank: 1
    name: Smith
    count: 94900
    ratio: 105
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith has been in Maryland since the colony's earliest records and grew even stronger in Baltimore's foundries, shipyards, and railroad shops."

  - rank: 2
    name: Johnson
    count: 82506
    ratio: 120
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' through English and Scots usage. In Maryland it is especially strong in Baltimore, Prince George's County, and the older tidewater counties, where free Black and formerly enslaved families carried the name through 19th-century freedom records and after 1864 emancipation."

  - rank: 3
    name: Brown
    count: 70887
    ratio: 140
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', originally describing brown hair, complexion, or clothing. Brown spread early through Maryland's Chesapeake plantation counties and remained common in Baltimore, which helps keep it unusually high in the statewide ranking."

  - rank: 4
    name: Jones
    count: 69375
    ratio: 143
    origin: welsh
    type: Patronymic
    meaning: "The classic Welsh patronymic meaning son of John. Maryland's Eastern Shore and upper Chesapeake carried a strong Welsh and English surname layer, which helps explain why Jones ranks ahead of many immigrant surnames despite Baltimore's cosmopolitan history."

  - rank: 5
    name: Williams
    count: 68306
    ratio: 145
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from Germanic 'Willahelm'. Maryland's long plantation belt from Charles County to Dorchester County, together with the state's large free Black population before the Civil War, kept Williams near the top of the list."

  - rank: 6
    name: Davis
    count: 45804
    ratio: 217
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ', beloved. Davis appears in Maryland records long before the Civil War and remained strong on the Eastern Shore and in southern Maryland, where the same counties often held both white and Black Davis families."

  - rank: 7
    name: Miller
    count: 42316
    ratio: 235
    origin: german
    type: Occupational
    meaning: "Occupational name for a miller, from German and English forms of the same trade. Frederick and Washington counties gave Maryland a strong inland Miller belt, and 19th-century German immigration through Baltimore reinforced it."

  - rank: 8
    name: Thomas
    count: 36067
    ratio: 276
    origin: welsh
    type: Patronymic
    meaning: "From Aramaic 'T'oma', twin, used in Britain as both a given name and a patronymic surname. Thomas fits Maryland's older British surname stock and appears heavily in both Eastern Shore counties and Baltimore."

  - rank: 9
    name: Jackson
    count: 35599
    ratio: 279
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval form of John. In Maryland, Jackson spread strongly through Black communities in Baltimore and Prince George's County after emancipation, though it was already present in tidewater county records."

  - rank: 10
    name: Taylor
    count: 34121
    ratio: 291
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Baltimore's clothing trades and the commercial life of county seats across Maryland helped keep Taylor common in both city and countryside."

  - rank: 11
    name: Wilson
    count: 32099
    ratio: 310
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. The name entered Maryland from both the Chesapeake coast and the Pennsylvania backcountry, which helps explain its broad reach from western counties to the Baltimore area."

  - rank: 12
    name: Lee
    count: 30943
    ratio: 321
    origin: english
    type: Topographic
    meaning: "From Old English 'leah', a woodland clearing or meadow. Lee has deep roots in Maryland's English colonial settlement and today also reflects the continuity of plain English surnames in Baltimore and Prince George's County."

  - rank: 13
    name: Harris
    count: 30253
    ratio: 328
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris stayed strong in the tobacco counties of Charles and Prince George's and later in Baltimore's 19th-century working neighborhoods."

  - rank: 14
    name: Robinson
    count: 28119
    ratio: 353
    origin: english
    type: Patronymic
    meaning: "Son of Robin, a medieval diminutive of Robert. Robinson rose with Maryland's urban population in Baltimore, but it also appears in Eastern Shore county records well before industrialization."

  - rank: 15
    name: White
    count: 28023
    ratio: 355
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually a nickname for fair hair or light complexion. White belongs to Maryland's oldest English surname layer, visible from St. Mary's and Annapolis records to later Baltimore directories."

  - rank: 16
    name: Thompson
    count: 27131
    ratio: 366
    origin: english
    type: Patronymic
    meaning: "Son of Thom, with the inserted 'p' becoming standard in later English spelling. Thompson followed Scots-Irish and English migrants into western Maryland and the Baltimore-to-Frederick corridor, giving it wider reach than a purely tidewater surname."

  - rank: 17
    name: Moore
    count: 26897
    ratio: 369
    origin: english
    type: Habitational
    meaning: "From Old English 'mor', someone who lived by moorland or marshy ground. The surname fits Maryland's Chesapeake landscape well and appears across low-lying Eastern Shore communities as well as inland counties."

  - rank: 18
    name: Anderson
    count: 24662
    ratio: 403
    origin: scottish
    type: Patronymic
    meaning: "Son of Anders or Andrew, from Greek 'Andreas'. In Maryland it reflects both Scots-Irish migration into the western counties and the wider Atlantic mix that passed through Baltimore."

  - rank: 19
    name: Lewis
    count: 24357
    ratio: 408
    origin: welsh
    type: Patronymic
    meaning: "Used in Wales and England as a family name built from the given name Lewis and often linked with the anglicizing of Llywelyn. Maryland's western counties and its long border with Pennsylvania helped preserve Lewis as a durable British surname."

  - rank: 20
    name: Green
    count: 22499
    ratio: 442
    origin: english
    type: Topographic
    meaning: "From Middle English 'grene', someone who lived near a village green or grassy common. Green stayed high in Maryland because it works equally well in old rural counties and in Baltimore's long-established Black communities."

unique_surnames:
  - name: Dorsey
    state_rank: 73
    national_rank: 701
    origin: french
    why: "Dorsey traces to the Norman name d'Arcy, but in Maryland it became something more specific: a founding Anne Arundel and Howard County family. Tracts such as Dorsey's Search and Dorsey's Adventure kept the name tied to central Maryland from the 1600s forward, which is why it ranks far higher here than nationally."

  - name: Shipley
    state_rank: 74
    national_rank: 1272
    origin: english
    why: "Shipley is a Yorkshire place-name surname, and in Maryland it points straight to Adam Shipley, who arrived in Anne Arundel County in 1668. His descendants spread through what later became Howard County, making Shipley one of the clearest old-settler surnames in the state."

  - name: Purnell
    state_rank: 690
    national_rank: 4141
    origin: english
    why: "Purnell is a medieval English variant of Parnell or Pernell. In Maryland it is a lower Eastern Shore name above all, especially in Somerset and Worcester counties, where small farming and watermen communities kept older family names unusually concentrated."

  - name: Gaither
    state_rank: 695
    national_rank: 3059
    origin: english
    why: "Gaither is tied to central Maryland's old planter and political families. The name runs through Anne Arundel and Montgomery County records, and Gaithersburg itself was named for Benjamin Gaither, which gives the surname a Maryland visibility it does not have nationally."

  - name: Tydings
    state_rank: 979
    national_rank: 21813
    origin: english
    why: "Tydings is one of the most Maryland-centered surnames in the country. The name is rooted in Harford County and Havre de Grace, and the political prominence of Millard and Joseph Tydings kept a highly local family name visible far beyond its small numbers."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Three of Maryland's top 20 surnames are occupational: Smith, Miller, and Taylor. That pattern reflects both the colony's early craft economy and Baltimore's later industrial expansion, from mills and tailoring shops to ironworks and rail repair."
    examples:
      - Smith (metalworker)
      - Miller (miller)
      - Taylor (tailor)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Maryland's top 20, accounting for 11 names including Johnson, Jones, Williams, Davis, Thomas, Jackson, and Thompson. They arrived with English and Welsh settlement, then remained strong because Maryland's Black communities often carried the same familiar British surnames through manumission, freedom records, and emancipation."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Davis (son of David)
      - Jackson (son of Jack)

  - type: Habitational Names
    icon: fa-solid fa-map-location-dot
    description: "Maryland's place-based and descriptive names are unusually Chesapeake in feel. Lee, Moore, Brown, White, and Green all point to landscape or appearance, and they fit a state where old rural counties and a long-settled port city preserved plain English surnames for centuries."
    examples:
      - Lee (woodland clearing)
      - Moore (near a moor)
      - Green (village green)

faq:
  - question: "What is the most common last name in Maryland?"
    answer: "Smith is the most common last name in Maryland. In the state-level surname data used here, it leads with 94,900 bearers, or about 1 in every 105 residents."

  - question: "Why is Dorsey such a Maryland surname?"
    answer: "Dorsey is strongly associated with Maryland because the family was rooted in Anne Arundel and later Howard County from the colonial era onward. Land tracts such as Dorsey's Search and the prominence of the Dorsey family in local politics kept the name unusually concentrated in the state."

