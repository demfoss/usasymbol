sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Maryland State Motto"
    paragraphs:
      - "Maryland's state motto is <strong>Fatti Maschii, Parole Femine</strong>, an Italian phrase meaning <em>Manly Deeds, Womanly Words</em>. It is the only U.S. state motto written in Italian — every other state uses English, Latin, French, Spanish, Hawaiian, Greek, or a Native American language."
      - "The phrase was not invented for Maryland. It was the personal motto of the Calvert family, the Lords Baltimore who founded the colony. When King Charles I granted Maryland's royal charter in 1632, the Calvert family's Italian motto came with it, and it has been part of Maryland's official identity ever since."

  - id: meaning
    icon: "fa-solid fa-language"
    title: "Maryland State Motto Meaning"
    paragraphs:
      - "The motto pairs two ideas: action and speech. <em>Fatti maschii</em> means manly deeds — things done, not just promised. <em>Parole femine</em> means womanly words — speech that is gentle, careful, or persuasive rather than aggressive. The phrase together describes an ideal of governance: act with strength, speak with care."
      - "In 16th and 17th-century Italian culture, the contrast between <em>fatti</em> (deeds) and <em>parole</em> (words) was a common way to describe someone who delivers on their promises rather than just talking. The modifier <em>maschii</em> (manly) on deeds and <em>femine</em> (womanly) on words reflected the gendered language of Renaissance-era rhetoric, not a judgment about men and women specifically."
      - "The phrase has attracted criticism in modern times because the literal translation assigns masculine qualities to action and feminine qualities to gentleness. The words mean something different in their 17th-century context than they do today, which has prompted discussion in Maryland about how the motto should be understood and translated."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Fatti Maschii, Parole Femine\""
    paragraphs:
      - "The standard English translation is <em>Manly Deeds, Womanly Words</em>. This is the literal word-for-word version and appears in most official references."
      - "Some sources and legislators have proposed <em>Strong Deeds, Gentle Words</em> as an alternative translation that captures the intent of the phrase without the gendered framing. In Italian, <em>maschii</em> and <em>femine</em> are adjectives that can describe qualities — strength and gentleness — rather than specifically referring to men and women. Both translations are linguistically defensible."
      - "The official Italian text has not changed. The debate is about which English translation best represents the phrase for a modern audience."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Maryland's State Motto"
    paragraphs:
      - "The phrase <em>Fatti Maschii, Parole Femine</em> was the personal motto of the Calvert family long before Maryland existed. George Calvert, the 1st Baron Baltimore, petitioned King Charles I for a colonial charter in the New World. He died in April 1632 before the charter was formally issued. His son Cecil Calvert, the 2nd Baron Baltimore, received the grant and became Maryland's first proprietor."
      - "Cecil Calvert brought the family's Italian motto with him into the colony's official design. The colonial seal carried the phrase on the reverse, paired with the Calvert and Crossland family arms — the same heraldry that appears on the Maryland state flag today. Using Italian for an aristocratic family motto was not unusual in Tudor and Stuart England; it reflected the influence of Renaissance culture on the English nobility."
      - "Maryland's seal was set aside after the American Revolution. The heraldry of a British proprietary dynasty sat uncomfortably in a new republic, and Maryland used a different seal for several decades. In 1876, the Maryland General Assembly voted to restore the colonial Calvert design in full, including the Italian motto on the reverse. The seal in use today is continuous with that 1876 restoration."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Fatti Maschii, Parole Femine\" on the Maryland State Seal"
    paragraphs:
      - "The motto appears on the reverse of the Great Seal of Maryland, on a ribbon at the base of the composition. The reverse shows the quartered Calvert and Crossland shield flanked by a farmer with a spade and a fisherman with a fish, with the date 1632 also present. The phrase appears in full capitals: FATTI MASCHII PAROLE FEMINE."
      - "Maryland's Great Seal is the only U.S. state seal with two distinct sides. The obverse carries a separate, older motto: <em>SCUTO BONAE VOLUNTATIS TUAE CORONASTI NOS</em>, a Latin phrase from Psalm 5:12 meaning <em>With the shield of thy good will thou hast covered us</em>. That Latin motto was the Calvert family's religious motto. The Italian phrase on the reverse was their personal family motto. Both appear on the same official seal."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Maryland State Motto Facts"
    style: "gradient"
    facts:
      - "Maryland is the only U.S. state with a motto in Italian."
      - "The phrase \"Fatti Maschii, Parole Femine\" was the personal motto of the Calvert family, who received Maryland's royal charter in 1632."
      - "Maryland's Great Seal is the only U.S. state seal with two distinct sides, each carrying a different family motto."
      - "The Italian motto appears on the reverse of the seal; a Latin motto from Psalm 5:12 appears on the obverse."
      - "The colonial Calvert seal design was set aside after the Revolution and formally restored by the Maryland General Assembly in 1876."
      - "The quartered Calvert and Crossland arms on the seal reverse are the same design as the Maryland state flag."

