seo_title: "Maryland State Motto | Fatti Maschii, Parole Femine"
seo_description: "Maryland's state motto is \"Fatti Maschii, Parole Femine,\" Italian for \"Manly Deeds, Womanly Words,\" from the Calvert family who founded Maryland."

intro_text: "Maryland's state motto is <strong>Fatti Maschii, Parole Femine</strong>, an Italian phrase meaning <em>Manly Deeds, Womanly Words</em>. The phrase was the personal motto of the Calvert family — the Lords Baltimore who received Maryland's royal charter in 1632 — making Maryland the only U.S. state with a motto in Italian."

