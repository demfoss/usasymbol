faq:
  - question: "What is Maryland's state motto?"
    answer: "Maryland's state motto is \"Fatti Maschii, Parole Femine,\" an Italian phrase meaning \"Manly Deeds, Womanly Words.\" It comes from the Calvert family, who received Maryland's royal charter in 1632, and it appears on the reverse of the Maryland state seal."

  - question: "What language is Maryland's state motto?"
    answer: "Italian — making Maryland the only U.S. state with a motto in Italian. The phrase uses 16th-century Italian spelling and was the personal motto of the Calvert family, the Lords Baltimore who founded Maryland."

  - question: "What does \"Fatti Maschii, Parole Femine\" mean?"
    answer: "The traditional translation is \"Manly Deeds, Womanly Words.\" The phrase describes an ideal of acting with strength and speaking with care. Some sources also translate it as \"Strong Deeds, Gentle Words\" to reflect the intended meaning without the gendered framing of the original Italian."

  - question: "What is the English translation of \"Fatti Maschii, Parole Femine\"?"
    answer: "The standard translation is \"Manly Deeds, Womanly Words.\" An alternative translation, \"Strong Deeds, Gentle Words,\" has been proposed because the Italian adjectives maschii and femine can describe qualities — strength and gentleness — rather than referring to men and women specifically."

  - question: "Why does Maryland have an Italian motto?"
    answer: "The phrase was the personal motto of the Calvert family, the English Catholic lords who founded Maryland. Cecil Calvert, the 2nd Baron Baltimore, brought the motto into Maryland's colonial seal in the 17th century. Using Italian for a family motto was common among English aristocrats influenced by Renaissance culture."

