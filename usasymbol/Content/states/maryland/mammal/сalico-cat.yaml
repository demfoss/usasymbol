faq:
  - question: "What is Maryland's state cat?"
    answer: "Maryland's state cat is the calico cat, designated in 2001. Maryland is one of only a few states to have an official state cat. The calico was chosen because its orange, black, and white coloring matches the colors of the Calvert family coat of arms, connecting the state cat to Maryland's colonial founding by Lord Baltimore."
  
  - question: "When was the calico cat designated as Maryland's state cat?"
    answer: "The calico cat became Maryland's official state cat on October 1, 2001, when Governor Parris Glendening signed Chapter 100 of the Acts of the Maryland General Assembly. The designation recognized the symbolic connection between calico coloring and the Calvert family heraldic colors that have represented Maryland since the colony's founding in 1634."
  
  - question: "Why did Maryland choose the calico cat as the state cat?"
    answer: "Maryland chose the calico cat because its natural tricolor pattern of orange, black, and white matches the colors of the Calvert family coat of arms. The Calvert family, led by Lord Baltimore, founded Maryland in 1634, and their heraldic colors of gold (orange in cat coloring) and black have symbolized Maryland ever since. The calico creates a living representation of Maryland's colonial heritage and appears on the state flag through the Calvert quadrants."
  
  - question: "Are all calico cats female?"
    answer: "Approximately 99.9% of calico cats are female due to genetics. The calico pattern requires two X chromosomes—one carrying the orange gene and one carrying the black gene—which occurs naturally only in females (XX). Male cats (XY) have only one X chromosome and therefore cannot express both orange and black colors simultaneously. Male calico cats are extremely rare, occurring only through chromosomal abnormalities such as XXY (Klinefelter syndrome), appearing in roughly one in 3,000 calico cats."
  
  - question: "Is calico a cat breed?"
    answer: "No, calico is a color pattern, not a breed. The calico pattern can appear on many different cat breeds including American Shorthair, Persian, Maine Coon, Japanese Bobtail, and mixed-breed cats. Any breed that allows the genetic combinations needed for orange and black coloring with white spotting can produce calico cats. The Maryland state cat designation applies to all cats displaying the tricolor calico pattern regardless of breed."
  
  - question: "What is the connection between calico cats and the Maryland flag?"
    answer: "The calico cat's orange, black, and white coloring matches the Calvert family quadrants of the Maryland state flag. The Maryland flag, adopted in 1904, features the Calvert coat of arms in gold and black vertical stripes in two quadrants, along with the Crossland family arms in red and white in the other two quadrants. The calico cat's colors specifically represent the Calvert portion of the flag, creating a living, three-dimensional symbol of Maryland's heraldic heritage."
  
  - question: "What is the difference between calico and tortoiseshell cats?"
    answer: "Calico cats have distinct patches of orange, black, and white, with white comprising 25-75% of the coat. Tortoiseshell cats have orange and black coloring but little to no white, with colors often appearing brindled or mixed rather than in separate patches. The white component is essential for calicos to represent Maryland's Calvert colors, which include white or silver alongside gold and black. Both patterns result from X-chromosome genetics and occur almost exclusively in females."
  
  - question: "How can I adopt a calico cat in Maryland?"
    answer: "Calico cats are available for adoption at animal shelters and rescue organizations throughout Maryland including the Maryland SPCA in Baltimore, Humane Society of Harford County, Montgomery County Animal Services, and numerous local shelters and rescues statewide. Shelters regularly have calico cats and kittens available. Adopting a calico from a shelter provides a home to Maryland's state cat while supporting animal welfare organizations."

