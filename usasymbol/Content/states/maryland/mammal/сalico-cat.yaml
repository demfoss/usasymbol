title: "Calico Cat"
scientific_name: "Felis catus"
adopted_year: 2001

seo_title: "Maryland State Cat: Calico Cat | Official State Feline"
seo_description: "The calico cat is Maryland's official state cat, designated in 2001. Its orange, black, and white colors match the Calvert family coat of arms and Maryland flag."

intro_text: "Maryland's state cat is the calico cat, designated in 2001 through Chapter 100 of the Acts of the Maryland General Assembly, and included in broader symbol references on the [U.S. state mammals hub](/symbols/mammals). The calico's distinctive orange, black, and white coloring mirrors the colors of the Calvert family coat of arms, connecting Maryland's official feline to Lord Baltimore and the founding of the Maryland colony in 1634."

common_name: "Calico Cat"
official_since: "2001"
status: "Domesticated; common color pattern in domestic cats; healthy population; genetic pattern not a distinct breed"
habitat_in_state: "Homes, farms, barns, animal shelters throughout Maryland; adaptable to urban, suburban, and rural environments"
known_for: "Orange, black, and white tricolor pattern matching Maryland's Calvert coat of arms; almost exclusively female due to genetics; symbol of Maryland's colonial heritage"

size: "Varies by breed; typically 8 to 12 inches tall at shoulder; 15 to 18 inches long"
weight: "8 to 12 pounds for females; rare males typically larger"
coloration: "Tricolor pattern of orange/red, black, and white patches; pattern unique to each individual cat; white base with orange and black patches; specific arrangement varies"
distinctive_traits: "Tricolor coat pattern; almost always female (99.9%); genetic basis linked to X chromosome; each calico has unique pattern like fingerprints; matches Maryland Calvert colors"

habitat: "Domestic environments including homes, farms, barns; outdoor and indoor settings; adaptable to varied Maryland climates from mountains to coast"
range_in_state: "Found throughout Maryland in homes, shelters, farms; calico pattern occurs in various domestic cat populations statewide"
conservation_status: "Domesticated color pattern; no conservation concerns; common among domestic cat populations"
where_to_find: "Animal shelters and rescue organizations statewide; farms and barns; residential areas; calico pattern appears in mixed-breed and some purebred cats"
symbol_connections: "Orange, black, and white match Calvert family coat of arms; connects to Maryland flag design; represents state's colonial founding by Lord Baltimore; links to Catholic heritage of Calvert family"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Maryland General Assembly designated the calico cat as the official state cat through Chapter 100 of the Acts of 2001, signed into law by Governor Parris Glendening on October 1, 2001. The resolution recognized the calico's distinctive orange, black, and white coloring as matching the heraldic colors of the Calvert family, Maryland's founding family."
      - "The designation made Maryland one of only two states to recognize an official state cat at that time, joined later by Massachusetts. The choice reflected Maryland's strong emphasis on heraldic symbolism and connections to colonial heritage through official state symbols."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The campaign to designate the calico cat as Maryland's state cat originated with constituent suggestions to state legislators who recognized the symbolic connection between calico coloring and Maryland's historic colors. Unlike many state symbols chosen through student campaigns or interest group lobbying, the calico designation emerged from observations about Maryland's distinctive heraldic tradition and the coincidental match between cat coloring and state symbolism. Legislators appreciated that the calico's orange, black, and white pattern precisely replicated the colors found on both the Calvert family coat of arms and the Maryland state flag, which incorporates Calvert heraldry. The designation passed with support from legislators who valued maintaining Maryland's tradition of symbols connected to colonial history and heraldic heritage. The calico cat joined other Maryland symbols chosen specifically for their connections to the Calvert and Crossland families, including the flag design itself and the state colors."
      
      - subtitle: "Why Chosen"
        text: "Maryland selected the calico cat because its natural tricolor pattern of orange, black, and white matches the Calvert family coat of arms, creating a living symbol of the state's founding heritage. The Calvert arms feature gold (represented by orange in cat coloring) and black in a distinctive pattern, with white also present. Lord Baltimore, a member of the Calvert family, founded the Maryland colony in 1634, and the Calvert colors have symbolized Maryland ever since. Choosing an animal whose natural coloring coincidentally matches these historic colors appealed to Maryland's emphasis on heraldic symbolism and colonial heritage. The designation also recognized that calico cats are common in Maryland households and farms, making the symbol accessible to residents throughout the state. Unlike rare or exotic animals, calicos live alongside Marylanders as companions and working farm cats, creating a democratic symbol that connects grand colonial history to everyday life."

  - id: "state-symbolism"
    icon: "fa-star"
    title: "What the Calico Cat Represents"
    style: "highlight"
    paragraphs:
      - "The calico cat embodies Maryland's connection to its colonial founding through the Calvert family and Lord Baltimore. The orange, black, and white coloring mirrors the heraldic colors that have represented Maryland since 1634, creating a living link to the state's origins and to [the Old Line State nickname](/states/maryland/nickname/the-old-line-state)."
      - "The cat represents Maryland's unique heraldic tradition among American states. Maryland's flag, based on the Calvert and Crossland family arms, stands out as one of the most distinctive state flags in America. The calico cat extends this heraldic symbolism into the natural world through its matching colors."
      - "The calico symbolizes the blending of heritage and everyday life. These cats live in Maryland homes and barns, working as mousers and companions while carrying colors that connect to nobility and colonial history. This combination of practical purpose and symbolic significance reflects Maryland's approach to tradition and complements visual emblems like the [Maryland state bird](/states/maryland/bird/baltimore-oriole)."
    
    subsections:
      - subtitle: "Living Heraldry and Colonial Heritage"
        text: "The calico cat designation represents Maryland's distinctive commitment to maintaining visible connections to its colonial founding through heraldic symbols. The Calvert family coat of arms uses gold and black in a complex pattern that has represented Maryland continuously since George Calvert, the first Lord Baltimore, received his title from King James I in 1625. His son Cecil Calvert, the second Lord Baltimore, founded the Maryland colony in 1634 as a proprietary colony where the Calvert family held significant governing authority. The family's heraldic colors became Maryland's colors, appearing on colonial seals, documents, and eventually the state flag adopted in 1904. By choosing the calico cat for its matching colors, Maryland created a symbol that requires no heraldic knowledge to appreciate—anyone can observe a calico cat and see Maryland's traditional colors without understanding their historical origins. This accessibility makes heraldry democratic and living rather than purely archival."
      
      - subtitle: "Connection to Maryland Flag"
        text: "The calico cat's designation deepens Maryland's already distinctive flag symbolism. The Maryland flag, adopted in its current form in 1904, combines the Calvert family coat of arms (gold and black) with the Crossland family coat of arms (red and white), creating one of America's most recognizable state flags. The Crossland arms represented the family of George Calvert's mother, and their inclusion on the flag acknowledges both sides of Maryland's founding family heritage. The calico cat specifically connects to the Calvert portion of the flag through its orange, black, and white coloring. This creates a hierarchy of heraldic symbols—the flag represents Maryland's complete heritage through both family lines, while the calico cat specifically honors the Calvert line that directly founded the colony. The cat thus serves as both independent symbol and reference point for understanding the flag's more complex heraldry."
      
      - subtitle: "Catholic Heritage and Religious Tolerance"
        text: "The Calvert family's Catholic faith shaped Maryland's founding principles and early history in ways the calico cat symbolically references. George Calvert, first Lord Baltimore, converted to Catholicism in 1624, which prevented him from holding office in Protestant England. His son Cecil Calvert established Maryland as a haven for English Catholics facing persecution, though the colony welcomed Protestants as well and passed the Maryland Toleration Act in 1649 guaranteeing religious freedom for Christians. The Calvert colors that appear on calico cats thus connect to this tradition of religious tolerance and the creation of an American colony where Catholics could practice their faith openly. While the cat itself has no religious significance, its colors reference the family whose Catholic faith motivated them to create a colony based on religious freedom principles that influenced later American constitutional protections for religious liberty."
      
      - subtitle: "Feminine Symbol and Genetic Uniqueness"
        text: "The calico cat designation carries additional symbolism through the fact that nearly all calico cats are female due to genetics. The calico pattern requires two X chromosomes to express both orange and black coloring simultaneously, meaning only females (XX) typically display the pattern. Male cats (XY) can show only orange or black, not both. The rare male calico occurs only through chromosomal abnormalities (XXY) and represents approximately one in 3,000 calico cats. This genetic female predominance makes the calico cat a distinctive choice—most state animals can be either sex, but Maryland's state cat is inherently feminine. This creates subtle symbolism connecting to Maryland's namesake, Queen Henrietta Maria of England, wife of King Charles I, for whom the colony was named. The colony's name honors a queen; its feline symbol is predominantly female."
      
      - subtitle: "Democratic Symbolism"
        text: "The calico cat represents accessible symbolism in contrast to Maryland's sometimes aristocratic heraldic heritage. While the Calvert coat of arms references nobility, proprietary colonies, and European heraldry, calico cats live in ordinary Maryland homes, barns, and shelters without aristocratic pretensions. This democratic quality ensures that Maryland's state cat connects grand colonial history to contemporary life. Residents who might never study heraldry or colonial history can appreciate a calico cat as companion or farm mouser while unknowingly participating in Maryland's heraldic tradition. The designation suggests that Maryland heritage belongs to everyone, not just historians or those interested in aristocratic symbolism. The calico makes Maryland colors visible in neighborhoods, farms, and animal shelters throughout the state, democratizing symbols that originated in noble European families."

  - id: "identification"
    icon: "fa-cat"
    title: "How to Identify Calico Cats"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Calico cats display a distinctive tricolor pattern of orange, black, and white patches rather than representing a specific breed. The pattern can appear on various cat breeds and mixed-breed cats, making calico a color description rather than breed designation. True calico cats show distinct patches of solid orange, solid black, and white areas, with colors appearing in separate blocks rather than blended. The white typically forms the base color with orange and black patches overlaying it. Each calico's pattern is unique—no two calicos have identical marking patterns, similar to human fingerprints. The size, shape, and placement of colored patches varies dramatically between individual cats."
        list_items:
          - "**Coloring**: Tricolor pattern of orange/red, black, and white in distinct patches; white base with orange and black overlays"
          - "**Pattern**: Patches not blended; each color appears in solid blocks; unique pattern for each individual cat"
          - "**Size**: Varies by breed; calico pattern appears on breeds ranging from small to large; typically 8-12 pounds for females"
          - "**Features**: Pattern can appear on short-haired or long-haired cats; occurs in various breeds including American Shorthair, Persian, Maine Coon, Japanese Bobtail"
      
      - subtitle: "Dilute Calico Variation"
        text: "Dilute calicos display a softer version of the traditional calico pattern, with gray (dilute black), cream (dilute orange), and white coloring instead of the bold orange, black, and white. This variation results from a genetic dilution factor that lightens the pigment colors while maintaining the tricolor pattern. Dilute calicos match Maryland's Calvert colors less precisely than traditional calicos, though they still display the tricolor concept. Some admirers consider dilute calicos equally representative of Maryland colors if orange is interpreted as including cream and black includes gray. The Maryland state cat designation does not distinguish between traditional and dilute calicos, allowing both variations to represent the state."
      
      - subtitle: "Calico vs Tortoiseshell"
        text: "Calico cats differ from tortoiseshell cats in the amount and distribution of white in their coats. Tortoiseshell cats (or torties) display orange and black coloring like calicos but have little to no white, with the orange and black colors often appearing brindled or mixed rather than in distinct patches. Calicos must have substantial white areas—typically 25% to 75% of the coat—with separate orange and black patches. This white component is essential for calicos to represent Maryland's Calvert colors, which include white or silver alongside gold and black. Tortoiseshell cats, lacking the white element, do not match Maryland heraldry despite sharing the orange and black colors. The distinction matters for the state cat designation because the white element completes the connection to Calvert heraldry."

  - id: "in-the-state"
    icon: "fa-map-location-dot"
    title: "Calico Cats in Maryland"
    style: "default"
    paragraphs:
      - "Calico cats exist throughout Maryland in households, farms, barns, and animal shelters. The calico pattern occurs naturally in domestic cat populations and appears with similar frequency in Maryland as in other states, representing approximately 25-30% of female cats with the genetic potential to express the tricolor pattern."
      - "Animal shelters and rescue organizations throughout Maryland commonly have calico cats available for adoption. Farm communities particularly value calico cats as mousers, continuing a tradition of working cats that predates Maryland's statehood. The pattern appears across various breeds and mixed-breed cats, making calicos accessible to Marylanders regardless of budget or preference for specific cat breeds."
    
    facts:
      - "**Statewide Presence**: Calico cats found in homes, farms, shelters throughout Maryland from Western Maryland mountains to Eastern Shore"
      - "**Shelter Availability**: Maryland animal shelters regularly have calico cats for adoption; pattern common in shelter populations"
      - "**Farm Cats**: Calicos valued as working mousers on Maryland farms; tradition of barn cats continues in rural areas"
      - "**Genetic Frequency**: Approximately 25-30% of female cats carry genes allowing calico pattern expression; males extremely rare"
      - "**Breed Distribution**: Calico pattern appears in American Shorthair, Persian, Maine Coon, Japanese Bobtail, and mixed-breed cats"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Calico Cats in Maryland"
    style: "default"
    paragraphs:
      - "Calico cats are widely accessible throughout Maryland in homes, animal shelters, farms, and occasionally in cat shows featuring breeds that can display the calico pattern. Unlike rare wildlife requiring special viewing locations, calicos live alongside Marylanders as companion animals and working farm cats."
    
    list_items:
      - "**Animal Shelters and Rescues**: Maryland SPCA in Baltimore, Humane Society of Harford County, Montgomery County Animal Services, and local shelters statewide regularly have calico cats available for adoption; opportunity to provide homes to state symbol"
      - "**Cat Shows and Exhibitions**: Cat Fanciers' Association shows in Maryland feature breeds that can display calico patterns including Persian, Maine Coon, and American Shorthair; regional shows occur in Baltimore, Gaithersburg, and other locations"
      - "**Farms and Rural Areas**: Calico barn cats work as mousers on farms throughout Maryland; particularly common in Western Maryland, Southern Maryland, and Eastern Shore agricultural regions; part of working farm heritage"
      - "**Pet Stores and Breeders**: Some cat breeders specializing in breeds that can produce calico patterns (Japanese Bobtail, Persian, American Shorthair) occasionally have calico kittens; adoption from shelters encouraged"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Calico Pattern Genetics and Prevalence"
    style: "default"
    paragraphs:
      - "The calico pattern remains common in domestic cat populations with no conservation concerns. The pattern results from complex genetic mechanisms involving X-chromosome inactivation, ensuring continued presence of calico cats as long as domestic cat populations exist."
      - "Understanding the genetics behind calico coloring has contributed to broader scientific knowledge about X-chromosome inactivation, a process important in human genetics and medical research. Calico cats thus serve not only as Maryland symbols but also as models for genetic research."
    
    subsections:
      - subtitle: "Genetic Basis of Calico Coloring"
        text: "The calico pattern results from a genetic phenomenon called X-inactivation or lyonization, named after geneticist Mary Lyon who explained the mechanism in 1961. The gene for orange fur color in cats is located on the X chromosome. Female cats with two X chromosomes can carry both orange and non-orange (black) color genes, one on each X chromosome. During early development, each cell randomly inactivates one X chromosome. Cells that inactivate the X carrying the orange gene produce black fur; cells inactivating the X with the black gene produce orange fur. This creates the patchy orange and black pattern. The white spotting gene operates independently, creating white areas where no pigment appears. Because males have only one X chromosome (XY), they express either orange or black, not both—making male calicos extraordinarily rare and requiring chromosomal abnormalities (XXY) to occur."
      
      - subtitle: "Calico Cats in Research and Medicine"
        text: "Calico cats have contributed to scientific understanding of X-chromosome inactivation, a process relevant to human genetics and medicine. The same X-inactivation mechanism that creates calico cats operates in female mammals including humans. Understanding this process helps researchers study X-linked genetic diseases including hemophilia, muscular dystrophy, and color blindness. Some female carriers of X-linked diseases show mosaic expression patterns similar to calico coloring—some cells express the disease allele while others do not, resulting in mild symptoms compared to affected males. Calico cats thus serve as visible models of genetic processes operating invisibly in humans. This scientific significance adds dimension to Maryland's state cat beyond pure symbolism—the calico represents both colonial heritage and contributions to modern genetics."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The calico cat's orange, black, and white coloring creates the most direct symbolic connection to the Maryland state flag, which features the Calvert and Crossland family coats of arms in gold, black, red, and white. The calico specifically represents the Calvert portion with its gold and black pattern."
      - "The cat designation in 2001 complemented Maryland's existing heraldic symbols, including the state colors (red, white, black, and gold officially adopted in 1904) and the state flag. Together, these symbols create a comprehensive representation of Maryland's colonial heritage through the Calvert family and values articulated on the [Maryland state motto page](/states/maryland/motto/fatti-maschii-parole-femine)."
    
    subsections:
      - subtitle: "Maryland State Flag Connection"
        text: "The Maryland state flag, adopted in 1904, stands as one of America's most distinctive state flags due to its bold heraldic design combining two family coats of arms. The Calvert family arms appear in the upper left and lower right quadrants, featuring gold and black vertical stripes alternating in a pattern derived from European heraldry. The Crossland family arms occupy the upper right and lower left quadrants with a red and white design. The calico cat's orange, black, and white coloring mirrors the Calvert quadrants—the cat's orange represents heraldic gold, black remains black, and white provides the background or base. This color correspondence makes the calico cat a three-dimensional, living representation of one element of Maryland's flag. Residents familiar with the flag's distinctive appearance can instantly recognize the connection when they see a calico cat, creating an accessible link between formal state symbolism and everyday life."
        link:
          label: "See Maryland state flag"
          url: "/states/maryland/flag/maryland-state-flag"
      
      - subtitle: "Lord Baltimore and State Name"
        text: "The calico cat connects to Maryland's state name through the Calvert family association with the title Lord Baltimore. George Calvert, the first Lord Baltimore, received his title from King James I in 1625 and attempted to establish colonies in Newfoundland before turning his attention to the Chesapeake Bay region. His son Cecil Calvert, the second Lord Baltimore, founded Maryland in 1634, naming the colony for Queen Henrietta Maria, wife of King Charles I. The Calvert family's proprietary control of Maryland lasted until the American Revolution, and their heraldic colors remained Maryland's colors throughout this period and beyond. The calico cat, bearing Calvert colors, thus connects to the family whose noble title became synonymous with Maryland's founding. Baltimore, Maryland's largest city, takes its name from this same title, creating layers of connection between the state cat, state founder, state name, and major city name."
      
      - subtitle: "State Sport: Jousting and Medieval Heritage"
        text: "Maryland's designation of jousting as the official state sport in 1962 reflects the same appreciation for medieval and heraldic tradition that led to the calico cat designation. Jousting competitions in Maryland date to colonial times, with the sport maintaining continuous tradition through organized rings and tournaments. The sport's heraldic elements including banners, colors, and ceremonial elements echo the same medieval European traditions that produced the Calvert family coat of arms. Both the calico cat and jousting represent Maryland's unique embrace of heraldic and medieval symbolism among American states. Where most states chose modern or practical sports as official symbols, Maryland selected a medieval tournament sport. Similarly, where most states chose wildlife or working animals as state animals, Maryland selected a domestic cat for its heraldic color correspondence. These choices demonstrate Maryland's consistent emphasis on connections to colonial heritage and European heraldic tradition across a regional context shown in [states neighboring states](/rankings/geography/states-neighboring-states)."
      
      - subtitle: "State Colors"
        text: "The calico cat's designation reinforces Maryland's official state colors—red, white, black, and gold—adopted in 1904 along with the current flag design. The cat's orange, black, and white directly represent three of the four official colors, with orange serving as the feline equivalent of heraldic gold. This color correspondence makes the calico cat one of few state animals whose natural appearance directly matches official state colors. Most state birds, mammals, or fish show colors unrelated to state color schemes, making their selection based on ecological, economic, or cultural factors rather than color symbolism. Maryland's choice of calico specifically for color matching demonstrates the state's distinctive prioritization of heraldic symbolism in official symbols. The cat serves as a living, accessible representation of Maryland's official colors that residents can encounter in homes, farms, and neighborhoods rather than only seeing on flags or official documents."

