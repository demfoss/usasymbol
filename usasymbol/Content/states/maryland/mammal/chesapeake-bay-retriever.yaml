faq:
  - question: "What is Maryland's state dog?"
    answer: "Maryland's state dog is the Chesapeake Bay retriever (Canis lupus familiaris), designated in 1964. This is the only dog breed that originated in Maryland, developed specifically for retrieving waterfowl in the Chesapeake Bay's cold, rough waters."

  - question: "When was the Chesapeake Bay retriever designated as Maryland's state dog?"
    answer: "The Chesapeake Bay retriever became Maryland's official state dog on August 1, 1964, through House Bill 19. Maryland was one of the first states to designate an official state dog."

  - question: "Why did Maryland choose the Chesapeake Bay retriever?"
    answer: "Maryland chose the Chesapeake Bay retriever because it is the only dog breed that originated in Maryland and is named for the Chesapeake Bay. The breed was developed in the 1800s specifically for retrieving waterfowl in the bay's harsh conditions, representing Maryland's waterfowling heritage, maritime culture, and identity as a Chesapeake Bay state."

  - question: "How did the Chesapeake Bay retriever originate?"
    answer: "According to tradition, the breed originated from two Newfoundland puppies rescued from a shipwreck off Maryland's coast in 1807. These dogs proved exceptional at retrieving waterfowl. Maryland hunters bred them with various water dogs including Irish Water Spaniels and local dogs, developing the Chesapeake Bay retriever adapted to the bay's cold water and harsh conditions."

  - question: "What makes Chesapeake Bay retrievers different from other retrievers?"
    answer: "Chesapeake Bay retrievers have distinctive oily, water-resistant coats that shed water and dry quickly, allowing them to work in near-freezing water. Their brown coloring (deadgrass to chocolate) matches Chesapeake Bay marsh vegetation. They have amber to yellow eyes unique among retrievers. Temperamentally, they are more independent and protective than Labrador or Golden Retrievers, reflecting their commercial hunting heritage."

  - question: "Are Chesapeake Bay retrievers good family dogs?"
    answer: "Chesapeake Bay retrievers suit active families who can provide extensive exercise, particularly swimming. Their temperament is loyal and protective, with patience around children when properly socialized. However, they require experienced owners who understand the independent working-dog mindset. At least an hour of daily exercise is essential — apartment living or sedentary households are poor matches."

  - question: "How rare are Chesapeake Bay retrievers?"
    answer: "Chesapeake Bay retrievers are relatively uncommon, ranking around 40th-45th most popular breed among nearly 200 AKC-recognized breeds. They are far less common than Labrador or Golden Retrievers but popular enough to sustain healthy breeding populations. Their moderate popularity attracts owners who specifically want Chesapeakes rather than any retriever."

  - question: "Can Chesapeake Bay retrievers break ice?"
    answer: "Yes, Chesapeake Bay retrievers are famous for their willingness and ability to break thin ice to retrieve waterfowl. They use their powerful chests and shoulders as battering rams to crash through shell ice repeatedly. This ice-breaking ability made them invaluable for late-season waterfowl hunting in the Chesapeake Bay and remains a distinctive breed characteristic."

