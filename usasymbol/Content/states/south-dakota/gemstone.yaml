intro_text: "South Dakota's state gemstone is Fairburn agate, adopted in 1966 for the sharply banded agate first collected near the town of Fairburn in the southern Black Hills. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: South Dakota State Gemstone
    paragraphs:
      - "Fairburn agate is South Dakota's official state gemstone, designated by the state legislature in 1966. It is a banded variety of chalcedony named for the town of Fairburn in Custer County, near where collectors first identified it in the early 1900s."
      - "South Dakota chose it because the stone occurs almost nowhere else, found only in a narrow belt of gravel running through the southern Black Hills and adjoining badlands, making it a genuinely local gemstone rather than a widely traded one."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Fairburn Agate?"
    paragraphs:
      - "Fairburn agate is a banded variety of chalcedony, a microcrystalline form of quartz, known for sharp, contrasting fortification bands, angular lines that trace the outline of the cavity the agate formed in. Colors run from yellowish-brown to deep red set against opaque white bands."
      - "The agates formed as nodules within Oligocene-age stream gravel roughly 30 million years old, weathered out over time and now found loose on the ground. Their banding is unusually crisp compared to most agate, which is why collectors rank it among the most sought-after agates in North America."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why South Dakota Chose Fairburn Agate as Its State Gemstone"
    paragraphs:
      - "Fairburn agate occurs only in a narrow band of gravel stretching from Orella, Nebraska, to Farmingdale, South Dakota, with the classic locality centered near the town of Fairburn in Custer County. That narrow range makes it one of the more geographically specific gemstones any state has claimed as its own."
      - "The stone has long drawn rockhounds and collectors to the southern Black Hills and Badlands region, and its scarcity and sharp banding give it a reputation among agate collectors that few other American agates match."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Fairburn Agate Became South Dakota's State Gemstone"
    paragraphs:
      - "State lawmakers designated Fairburn agate the official state gemstone in 1966, the same year rose quartz became the state mineral, recognizing two materials tied to the Black Hills region in a single legislative session."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Fairburn Agate Is Found in South Dakota"
    paragraphs:
      - "The classic collecting ground lies near the town of Fairburn in Custer County, in the southern Black Hills. The agate-bearing gravel extends from there toward Farmingdale, South Dakota, and south into the Nebraska badlands near Orella."
    sites:
