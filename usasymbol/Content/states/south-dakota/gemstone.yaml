  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Fairburn Agate Facts"
    facts:
      - "Adopted as South Dakota's state gemstone in 1966."
      - "Named for the town of Fairburn in Custer County, where collectors first identified it in the early 1900s."
      - "Found only in a narrow gravel belt running from Farmingdale, South Dakota, to Orella, Nebraska."
      - "Prized by collectors for fortification banding sharper and more contrasted than most other agates."

