faq:
  - question: What is South Dakota's state gemstone?
    answer: "South Dakota's state gemstone is Fairburn agate, a banded variety of chalcedony adopted by the state legislature in 1966."
  - question: When did South Dakota adopt Fairburn agate as its state gemstone?
    answer: "The South Dakota Legislature designated Fairburn agate the official state gemstone in 1966."
  - question: Why did South Dakota choose Fairburn agate?
    answer: "Fairburn agate is found almost nowhere else, occurring only in a narrow gravel belt in the southern Black Hills and neighboring badlands, giving South Dakota a gemstone unique to the region."
  - question: Where can you find Fairburn agate in South Dakota?
    answer: "The classic collecting area is near the town of Fairburn in Custer County, with agate-bearing gravel extending toward Farmingdale, South Dakota, and south into Nebraska."

