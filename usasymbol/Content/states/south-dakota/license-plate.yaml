intro_text: "**\"Great Faces. Great Places.\"** is South Dakota's current passenger license plate slogan. It first appeared on the 1990-1995 Mount Rushmore base and remains on the plate design introduced in January 2023. Earlier slogan history includes \"RUSHMORE MEMORIAL\" in 1939 and the 1987-1990 statehood centennial base."
quick_answer: "South Dakota's current plate slogan is \"Great Faces. Great Places.\" The phrase began on the 1990-1995 passenger base and continues on the current January 2023 design. Earlier slogans included \"RUSHMORE MEMORIAL\" in 1939 and optional \"Celebrate the Century\" on the 1987-1990 centennial plate."
