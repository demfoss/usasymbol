sections:
- id: current-plate
  icon: fa-solid fa-id-card
  title: The 2023 Current Plate
  paragraphs:
  - South Dakota began its statewide license plate reissue in January 2023. The current passenger design uses a full-color Mount Rushmore background, black serials, county-coded formats, and the continuing "Great Faces. Great Places." slogan.
  - The 2023 base replaced the beige 2016-2022 Mount Rushmore plate. The serial sequences continued by county rather than starting the whole system over, so the visual design changed while the underlying county-coded registration structure remained familiar.
  - The important accuracy point is that the slogan did not end with any of the older Rushmore bases. It is still the current passenger plate slogan as of 2026.

- id: great-faces-great-places
  icon: fa-solid fa-mountain
  title: What "Great Faces. Great Places." Means
  paragraphs:
  - '"Great Faces. Great Places." works as a compact double reference. The "great faces" are the four presidents carved into Mount Rushmore, and the "great places" are the broader South Dakota landscapes: the Black Hills, Badlands, prairie, and tourist routes that surround the monument.'
  - The punctuation gives the slogan its punch. It reads as two short sentences rather than one long tourism phrase, which makes it easy to read on a plate and easy to remember.
  - 'The current 2023 plate keeps the slogan with a full-color Mount Rushmore graphic and blue-sky background. That continuity matters: South Dakota updated the base design, but not the core identity phrase.'

- id: rushmore-memorial
  icon: fa-solid fa-person-chalkboard
  title: South Dakota's First Plate Slogan
  paragraphs:
  - South Dakota's earliest documented passenger plate slogan was "RUSHMORE MEMORIAL" in 1939. Mount Rushmore was still under construction at the time; carving began in 1927 and was completed in 1941.
  - That makes the 1939 plate a small but telling piece of tourism history. South Dakota was already using its license plate to point drivers toward a landmark that had not yet become the finished national icon.
  - Later plates broadened the Rushmore idea. "RUSHMORE MEMORIAL" named the monument directly; "Great Faces. Great Places." turns the same landmark into a wider statewide tourism identity.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: South Dakota License Plate Slogans by Era
  paragraphs:
  - South Dakota's slogan sequence runs from a direct Mount Rushmore memorial label, through the statehood centennial, into the long-running Great Faces era.
  versions:
  - name: RUSHMORE MEMORIAL
    years: 1939
    image: /images/license-plates/south-dakota/1939-rushmore-memorial.jpg
    description: The earliest documented South Dakota passenger plate slogan, issued while Mount Rushmore was still being carved.
  - name: Celebrate the Century
    years: 1987-1990
    image: /images/license-plates/south-dakota/1987-centennial.png
    description: The statehood centennial base commemorated South Dakota's 100 years of statehood. "Celebrate the Century" was optional, so some plates from this base carried the phrase while others did not.
  - name: Great Faces. Great Places.
    years: 1990-1995
    image: /images/license-plates/south-dakota/1990-great-faces-great-places.jpg
    description: The slogan debuted on a gradient gold-and-white Mount Rushmore base. This corrects the oversimplified "1991" start date sometimes used for the phrase.
  - name: Great Faces. Great Places.
    years: 2000-2005
    image: /images/license-plates/south-dakota/2000-great-faces-great-places.jpg
    description: The slogan returned on the 2000 base and continued into the modern Rushmore sequence.
  - name: Great Faces. Great Places.
    years: 2006-2015
    image: /images/license-plates/south-dakota/2006-great-faces-great-places.jpg
    description: A full-color Mount Rushmore base won ALPCA's Plate of the Year for 2006 and kept the slogan.
  - name: Great Faces. Great Places.
    years: 2016-2022
    image: /images/license-plates/south-dakota/2016-great-faces-great-places.jpg
    description: The beige Mount Rushmore base continued the slogan until the January 2023 reissue.
  - name: Great Faces. Great Places.
    years: 2023-present
    image: /images/license-plates/south-dakota/2023-current-great-faces.jpg
    description: The current full-color Mount Rushmore and blue-sky design, introduced in January 2023, keeps the same slogan.

- id: centennial-decal
  icon: fa-solid fa-certificate
  title: The Optional Centennial Slogan
  paragraphs:
  - The 1987-1990 centennial plate is easy to describe too strongly. "Celebrate the Century" was not necessarily printed as a universal slogan on every plate; references describe it as optional.
  - 'The base commemorated South Dakota''s statehood centennial, but the optional phrase meant two versions circulated: one with the celebratory slogan and one without it.'
  - That nuance is worth keeping because it separates South Dakota from many states that printed anniversary wording directly on every general-issue plate.

timeline:
- year: '1939'
  description: South Dakota uses "RUSHMORE MEMORIAL" on passenger plates while Mount Rushmore is still under construction.
- year: '1941'
  description: Mount Rushmore carving is completed.
- year: '1987'
  description: The 1987-1990 Statehood Centennial base begins, with "Celebrate the Century" as an optional slogan.
- year: '1990'
  description: '"Great Faces. Great Places." appears on the 1990-1995 Mount Rushmore base.'
- year: '1996'
  description: South Dakota issues a Mount Rushmore base without the Great Faces slogan, interrupting the slogan's modern run.
- year: '2000'
  description: '"Great Faces. Great Places." returns and remains the dominant plate slogan.'
- year: '2006'
  description: A full-color Mount Rushmore plate with the slogan wins ALPCA Plate of the Year.
- year: '2016'
  description: The beige Mount Rushmore base continues "Great Faces. Great Places."
- year: '2023'
  description: South Dakota begins its January 2023 plate reissue with a new full-color Mount Rushmore design and the same slogan.

faq:
- question: What is South Dakota's current license plate slogan?
  answer: South Dakota's current passenger plate slogan is "Great Faces. Great Places."
- question: When did "Great Faces. Great Places." first appear on South Dakota plates?
  answer: It first appeared on the 1990-1995 passenger base. Some summaries say 1991, but the base is listed as 1990-1995 in plate-history references.
- question: Is "Great Faces. Great Places." still current?
  answer: Yes. South Dakota's January 2023 passenger plate reissue kept "Great Faces. Great Places." on the current Mount Rushmore design.
- question: What was South Dakota's first license plate slogan?
  answer: The earliest documented slogan was "RUSHMORE MEMORIAL" on the 1939 plate, issued while Mount Rushmore was still under construction.
- question: What was the 1987 South Dakota centennial plate slogan?
  answer: The centennial base used "Celebrate the Century" as an optional slogan. The base commemorated South Dakota's 100 years of statehood, but the phrase was not necessarily present on every plate.
- question: Did South Dakota ever drop "Great Faces. Great Places." after it started?
  answer: Yes. The 1996-2000 Mount Rushmore base is listed with no slogan. The phrase returned on the 2000 base and has remained dominant since.

