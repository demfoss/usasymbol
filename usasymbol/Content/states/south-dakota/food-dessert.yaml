sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is South Dakota's State Dessert?"
    paragraphs:
      - "Kuchen is South Dakota's official state dessert, designated by the South Dakota Legislature in 2000. It is a yeast-dough pastry filled with sweetened custard and often topped with fruit."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Kuchen"
    paragraphs:
      - "Kuchen starts with a soft, slightly sweet yeast dough pressed into a pan, then filled with an egg custard and topped with fruit such as apples, plums, or prunes before baking. The word kuchen simply means cake in German."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Kuchen Became South Dakota's State Dessert"
    paragraphs:
      - "The South Dakota Legislature designated kuchen the official state dessert in 2000, recognizing a recipe deeply tied to the state's German-Russian heritage."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Dakota Chose Kuchen"
    paragraphs:
      - "German-Russian immigrants settled heavily in South Dakota in the late 1800s, bringing kuchen recipes with them from communities along the Volga and Black Sea regions of Russia. The dessert remains closely tied to that immigrant heritage in the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Kuchen Facts"
    facts:
      - "Adopted as South Dakota's state dessert in 2000."
      - "Brought to the state by German-Russian immigrants in the late 1800s."
      - "The word kuchen means cake in German."

