sections:
- id: adoption
  icon: fa-solid fa-landmark
  title: 'South Dakota''s 1986 Milk Designation: What the Legislature Actually Did'
  paragraphs:
  - In 1986, the South Dakota Legislature added milk to the state's official symbol list. The vote didn't require much debate — dairy farming wasn't a contested choice. It was an acknowledgment of economic reality.
  - The designation placed milk alongside the pasque flower, the ring-necked pheasant, and the coyote. The logic, in this case, was agricultural before it was symbolic.
- id: why-milk
  icon: fa-solid fa-bullseye
  title: The Dairy Industry Behind South Dakota's Official State Drink
  paragraphs:
  - Dairy farming has shaped South Dakota's agricultural economy for generations, concentrated on the eastern plains where the land and water supply support it. Milk wasn't chosen as an aspirational symbol — it was chosen because it was already there, already part of what the state produced.
  - The [South Dakota Legislature's](https://sdlegislature.gov/) stated rationale, per <em>Official State Beverages</em>, was explicitly to highlight dairy's importance to the state — not a generic vote for a wholesome drink, but an economic statement. The legislature wasn't putting milk on a pedestal. It was pointing at something the state already depended on.
- id: context
  icon: fa-solid fa-map
  title: 'Other States With Milk as Official Beverage: South Dakota in Context'
  paragraphs:
  - Not even close to alone. South Dakota's 1986 designation was part of a clear pattern — Wisconsin, Oregon, Minnesota, and others named milk their official state beverage in the same era, nearly all citing dairy industry importance as the rationale.
  - The 1980s saw agricultural states formalizing economic identities on their official symbol lists, driven in large part by dairy industry advocacy. South Dakota made the same argument its Midwestern neighbors were making and landed in the same decade. The state's dairy industry was real — the designation reflects that directly, even if it wasn't a unique invention.
faq:
- question: What is the official state beverage of South Dakota?
  answer: Milk. The South Dakota Legislature designated milk as the official state beverage in 1986.
- question: When did South Dakota adopt milk as its state drink?
  answer: In 1986. The South Dakota Legislature adopted milk as the official state beverage that year, citing the importance of the dairy industry to the state.
- question: Why did South Dakota choose milk as its state beverage?
  answer: The designation was a direct acknowledgment of the dairy industry's importance to South Dakota's economy. It was an economic recognition as much as a symbolic one — dairy farming has been a significant part of the state's agricultural identity.
- question: Is milk a common state beverage across the U.S.?
  answer: Yes. Several states have designated milk as their official state beverage, particularly during the 1980s. South Dakota joined states like Wisconsin, Oregon, and Minnesota in recognizing dairy's role in their agricultural economies.
- question: Does South Dakota have any other official beverages?
  answer: Milk is the only official state beverage listed for South Dakota. The 1986 designation has not been supplemented or replaced.
