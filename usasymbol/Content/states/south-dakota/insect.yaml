faq:
- question: What is South Dakota's state insect?
  answer: "South Dakota's state insect is the European honey bee, adopted by the South Dakota Legislature in 1978."
- question: When did South Dakota adopt the European honey bee?
  answer: "South Dakota adopted the honey bee as its official state insect on February 23, 1978."
- question: Why did South Dakota choose the European honey bee?
  answer: "South Dakota chose the honey bee because the state is a leading honey producer and because bees pollinate crops like alfalfa and sunflowers that matter to South Dakota farmers."
- question: What does South Dakota's state insect look like?
  answer: "The honey bee has a golden-brown, fuzzy body with dark bands, two pairs of clear wings, and six legs. Worker bees grow to about half an inch long."
- question: Where is the European honey bee found in South Dakota?
  answer: "Honey bees are found statewide in South Dakota, kept in hives on farms and in backyard gardens, and are most active from late spring through early fall."
- question: Is the European honey bee a butterfly, bee, beetle, or dragonfly?
  answer: "The European honey bee is a bee, not a butterfly, beetle, or dragonfly. Its scientific name is Apis mellifera."

