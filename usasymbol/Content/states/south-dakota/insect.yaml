sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of South Dakota?
  paragraphs:
  - "The honey bee, Apis mellifera, is South Dakota's official state insect. The South Dakota Legislature designated it on February 23, 1978."
  - "Honey bees are common across South Dakota, kept in managed hives by commercial and backyard beekeepers throughout the state."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a golden-brown, fuzzy body marked with dark bands across its abdomen, two pairs of clear wings, and six legs. Its long antennae help it smell and taste."
  - "Worker bees, the ones most people see, grow to about half an inch long. A single hive can hold up to 80,000 bees, including one queen, a small number of male drones, and thousands of worker bees."
  - "Worker bees carry pollen home in baskets on their hind legs and tell each other where to find good flowers through a waggle dance. Only worker bees sting, and each one dies after stinging."

- id: history
  icon: fa-solid fa-landmark
  title: How South Dakota Chose the European Honey Bee
  paragraphs:
  - "The South Dakota Legislature named the honey bee the official state insect on February 23, 1978."
  - "Lawmakers chose the bee because South Dakota is a leading honey-producing state and because bees pollinate crops that matter to South Dakota farmers, including alfalfa and sunflowers."
  - "South Dakota still ranks among the top honey-producing states today. In 2024, the state's beekeepers kept about 250,000 honey-producing colonies and ranked third in the nation for honey production, according to USDA data."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the European Honey Bee in South Dakota
  paragraphs:
  - "European honey bees are found statewide, from commercial hives on farms and ranches to backyard gardens in South Dakota's cities and towns. They are most active from late spring through early fall, when crops and wildflowers are in bloom."
  - "South Dakota's wide fields of alfalfa, sunflowers, and clover give both wild and kept honey bee colonies plenty of nectar to forage each summer."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: February 23, 1978, by the South Dakota Legislature."
  - "Scientific name: Apis mellifera."
  - "Appearance: golden-brown, fuzzy body with dark bands, clear wings, and a length of about half an inch for worker bees."
  - "A single hive can hold up to 80,000 bees: one queen, drones, and thousands of worker bees."
  - "South Dakota ranked third in the nation for honey production in 2024, with about 250,000 honey-producing colonies statewide."




