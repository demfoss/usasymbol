faq:
  - question: What is South Dakota's state mineral?
    answer: "South Dakota's state mineral is rose quartz, a pink variety of quartz adopted by the state legislature in 1966."
  - question: When did South Dakota adopt rose quartz as its state mineral?
    answer: "The South Dakota Legislature designated rose quartz the official state mineral in 1966."
  - question: Why did South Dakota choose rose quartz?
    answer: "Rose quartz mined near Custer in the southern Black Hills became a signature material for the region's jewelry and lapidary trade, giving South Dakota a mineral symbol tied to its own ground."
  - question: Where can you find rose quartz in South Dakota?
    answer: "The southern Black Hills near Custer are the historic source. The Scott Rose Quartz Mine southeast of town is one of the largest known rose quartz deposits in the United States."

