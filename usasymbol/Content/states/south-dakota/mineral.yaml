sections:
  - id: overview
    icon: fa-solid fa-cube
    title: South Dakota State Mineral
    paragraphs:
      - "Rose quartz is South Dakota's official state mineral, designated by the state legislature in 1966. It is a pink variety of ordinary quartz, and the deposits near Custer in the southern Black Hills rank among the largest and highest-quality rose quartz deposits in the country."
      - "Lawmakers chose it as a mineral tied directly to South Dakota ground, not an imported or widely traded stone, giving the state a symbol rooted in its own Black Hills mining history."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Rose Quartz?"
    paragraphs:
      - "Rose quartz is quartz colored pink to rose-red by trace amounts of titanium, iron, or manganese. Unlike clear or purple quartz, it rarely forms pointed crystals; instead it occurs in coarse, blocky masses, which is why polished rose quartz usually looks cloudy or translucent rather than glassy."
      - "Rose quartz is a common variety of one of the most abundant minerals on Earth, but gem-quality masses large and clean enough to cut and carve are far less common. South Dakota's Black Hills supply is known for both the size and consistency of its color."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why South Dakota Chose Rose Quartz as Its State Mineral"
    paragraphs:
      - "South Dakota's rose quartz comes from the Custer area of the southern Black Hills, where prospectors discovered pink quartz deposits in the 1880s. The Scott Rose Quartz Mine, southeast of Custer, exposed a mass of rose quartz measured in tens of feet across, among the largest single deposits of its kind found anywhere in the country."
      - "The stone became a staple of Black Hills jewelry and lapidary work, cut into beads, cabochons, and carvings sold to visitors and collectors. Naming it the state mineral in 1966 recognized a material identified with the region rather than a rare or commercially traded gem."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Rose Quartz Became South Dakota's State Mineral"
    paragraphs:
      - "State lawmakers designated rose quartz the official state mineral in 1966, formalizing a material already closely tied to the Black Hills mining and jewelry trade."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Rose Quartz Is Found in South Dakota"
    paragraphs:
      - "The southern Black Hills near Custer are the historic center of South Dakota rose quartz mining. The Scott Rose Quartz Mine, southeast of town, is the best-known deposit and has been recognized as one of the largest sources of high-quality rose quartz in the United States."
