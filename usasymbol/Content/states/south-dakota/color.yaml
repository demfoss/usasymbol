expert_quote:
  text: "South Dakota's blue and gold trace directly to the state seal of 1889, making them among the most historically grounded state color designations in the American West — rooted in the reality of Black Hills gold and the endless sky of the Great Plains."
  source: "South Dakota State Historical Society, Pierre, State Symbols and Emblems Documentation"

faq:
  - question: "What are the official colors of South Dakota?"
    answer: "The official state colors of South Dakota are Blue and Gold, formally designated in 1909 under Laws 1909, Chapter 230. The colors were drawn from the design of the state seal and original state flag, with blue representing the Great Plains sky and Missouri River, and gold representing the Black Hills gold deposits and the sun motif of the state seal."
  - question: "What is the HEX code for South Dakota Blue?"
    answer: "The standard HEX code for South Dakota Blue is #003DA5, corresponding to Pantone PMS 286, consistent with the royal blue as rendered on the state flag and contemporary state government branding materials."
  - question: "What is the HEX code for South Dakota Gold?"
    answer: "The standard HEX code for South Dakota Gold is #FFB81C, corresponding to Pantone PMS 123, consistent with the gold sun burst and seal elements as rendered on the state flag and official state insignia."
  - question: "When were South Dakota's state colors officially adopted?"
    answer: "South Dakota's state colors were officially adopted in 1909 under Laws 1909, Chapter 230, though blue and gold had appeared on the state seal since statehood in 1889. The 1909 legislation formally codified the colors in the same session that produced the first state flag."
  - question: "Why does South Dakota use blue and gold?"
    answer: "Blue represents the expansive sky of the Great Plains and the Missouri River that bisects the state, while gold represents the Black Hills gold deposits that drove South Dakota's settlement beginning with the 1876 gold rush and the golden sun at the center of the state seal adopted at statehood in 1889."
  - question: "Do South Dakota's state colors appear on the state flag?"
    answer: "Yes. The South Dakota state flag displays the state seal on a field of blue, surrounded by a gold sun burst, making blue and gold the two dominant colors of the flag. The current flag design, refined in 1992, maintains the same blue and gold palette established when the first state flag was adopted in 1909."

