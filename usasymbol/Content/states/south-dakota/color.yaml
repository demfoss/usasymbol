seo_title: "South Dakota State Colors | Blue Gold"
seo_description: "South Dakota state colors are Blue and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of South Dakota are **Blue** and **Gold**, formally designated by the South Dakota Legislature in 1909 under Laws 1909, Chapter 230. Designated the same year South Dakota adopted its first state flag, blue and gold appear on [the South Dakota state flag](/states/south-dakota/flag/south-dakota-state-flag) and throughout official state branding and government communications. The specifications below list HEX, RGB, CMYK, and Pantone values for South Dakota color matching."

