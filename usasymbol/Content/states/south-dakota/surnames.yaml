seo:
  title: "Most Common Last Names in South Dakota"
  description: "South Dakota's most common last names are Johnson, Anderson, and Nelson, shaped by Scandinavian, German-Russian, and Lakota roots."

page:
  h1: "Most Common Last Names in South Dakota"
  intro: "Johnson, Anderson, and Nelson are the most common last names in South Dakota in the statewide surname data, a top three shaped by Scandinavian farm settlement on the eastern prairie. The list also carries a strong German and German-Russian layer through Miller, Schmidt, Meyer, Hofer, Weber, and Tschetter, while names such as Eagle, Bear, Hawk, Janis, and Bordeaux point to Lakota and older northern Plains family histories."
  heritage_title: "Scandinavian Farms, German-Russian Colonies, and Lakota Country"
  heritage_body: "South Dakota's surname map sits on Dakota, Lakota, and Nakota homelands, but the modern statewide ranking was heavily reshaped by homesteading and railroad-era immigration. The National Park Service notes that South Dakota homesteaders came from Germany, Norway, Sweden, Poland, and other countries, and that mix explains why Johnson, Anderson, Nelson, Olson, Peterson, Larson, Jensen, Hanson, Hansen, Christensen, and Carlson all land in the top 20. German-speaking settlement added another signature layer: Britannica identifies Germans as South Dakota's largest ancestry group by the early twenty-first century, including Mennonites, Hutterites, and Germans from Russia, whose communities remain especially visible in surnames like Hofer, Tschetter, Wipf, Waldner, Schmidt, Meyer, Weber, Fischer, and Wagner."
  fun_fact: "Hofer ranks 25th statewide in South Dakota, far above its national rank, because the name is strongly tied to Hutterite and German-Russian communities whose Dakota Territory roots reach back to the 1870s."

surnames:
  - rank: 1
    name: Johnson
    count: 9509
    ratio: 96
    origin: scandinavian
    type: Patronymic
    meaning: "Johnson means 'son of John,' but in South Dakota much of its strength comes from Scandinavian forms such as Johansson, Jonsson, and Johnsen being simplified in American records. Its first-place rank fits the Norwegian and Swedish farm settlement that spread across the eastern counties after railroads and homestead claims opened the prairie."

  - rank: 2
    name: Anderson
    count: 6371
    ratio: 143
    origin: scandinavian
    type: Patronymic
    meaning: "Anderson means 'son of Anders' or Andrew. The name rose high in South Dakota because Anders was common in Scandinavian families, and because many settlers arrived through the same Upper Midwest migration stream that filled Minnesota, Iowa, and the Dakotas."

  - rank: 3
    name: Nelson
    count: 5016
    ratio: 182
    origin: scandinavian
    type: Patronymic
    meaning: "Nelson means 'son of Nels' or Nils, the Scandinavian form of Nicholas. Its top-three position is one of the clearest signs that South Dakota's surname list belongs to the northern Plains rather than to the older English-name pattern that puts Smith first in many states."

  - rank: 4
    name: Smith
    count: 4774
    ratio: 191
    origin: english
    type: Occupational
    meaning: "Smith comes from Old English for a metalworker or blacksmith. It remains one of South Dakota's most common surnames because it arrived with broad American migration, town-building, and farm service work, even though Scandinavian names outrank it here."

  - rank: 5
    name: Olson
    count: 4238
    ratio: 215
    origin: scandinavian
    type: Patronymic
    meaning: "Olson means 'son of Ole' or Olof. The name is a strong Norwegian and Swedish marker in South Dakota, especially in the eastern and southeastern farm country where Scandinavian Lutheran communities became part of everyday rural life."

  - rank: 6
    name: Miller
    count: 4022
    ratio: 227
    origin: german
    type: Occupational
    meaning: "Miller is an occupational name for someone who ran a grain mill. In South Dakota it reflects both the common English surname and German-speaking immigrants whose Mueller or Muller forms were translated or simplified in American records."

  - rank: 7
    name: Peterson
    count: 3907
    ratio: 233
    origin: scandinavian
    type: Patronymic
    meaning: "Peterson means 'son of Peter,' often anglicized from Petersen or Petersson. Its high South Dakota rank follows the same Scandinavian farm settlement that pushed Johnson, Anderson, Nelson, Olson, Larson, Jensen, and Hanson into the top 20."

  - rank: 8
    name: Larson
    count: 3591
    ratio: 254
    origin: scandinavian
    type: Patronymic
    meaning: "Larson means 'son of Lars.' The surname stayed unusually common because South Dakota drew many families from Nordic communities in Minnesota, Iowa, and directly from Scandinavia during the late nineteenth-century farm boom."

  - rank: 9
    name: Jensen
    count: 2806
    ratio: 325
    origin: scandinavian
    type: Patronymic
    meaning: "Jensen means 'son of Jens,' the Danish and Scandinavian form of John. Its top-10 rank points especially to Danish and Norwegian settlement in southeastern South Dakota, where Danish communities formed alongside Norwegian, Swedish, German, and Czech farm neighborhoods."

  - rank: 10
    name: Hanson
    count: 2783
    ratio: 328
    origin: scandinavian
    type: Patronymic
    meaning: "Hanson means 'son of Hans,' a name used across Scandinavian and German-speaking families. In South Dakota it works as a northern Plains clue: a common European patronymic lifted by the state's immigrant farm settlement."

  - rank: 11
    name: Thompson
    count: 2660
    ratio: 343
    origin: english
    type: Patronymic
    meaning: "Thompson means 'son of Thomas.' It represents the English-speaking and Upper Midwestern layer of South Dakota settlement, but its rank below several Scandinavian names shows how strongly Nordic naming patterns shaped the state."

  - rank: 12
    name: Brown
    count: 2615
    ratio: 349
    origin: english
    type: Descriptive
    meaning: "Brown began as a nickname for someone with brown hair, complexion, or clothing. In South Dakota it is less an ethnic marker than a broad American surname that moved west with settlers, railroad workers, merchants, and town families."

  - rank: 13
    name: Jones
    count: 2407
    ratio: 379
    origin: welsh
    type: Patronymic
    meaning: "Jones is the classic Welsh patronymic meaning 'son of John.' Its presence in the top 20 reflects national migration into South Dakota, while its position below Nordic names marks the state's difference from many older eastern and southern surname lists."

  - rank: 14
    name: Hansen
    count: 2390
    ratio: 381
    origin: scandinavian
    type: Patronymic
    meaning: "Hansen means 'son of Hans' and preserves the -sen spelling common in Danish and Norwegian surnames. Its rank beside Hanson shows how South Dakota kept both Americanized and Scandinavian-looking spellings in everyday use."

  - rank: 15
    name: Schmidt
    count: 2113
    ratio: 431
    origin: german
    type: Occupational
    meaning: "Schmidt is the German equivalent of Smith, meaning a blacksmith. Its top-20 rank reflects South Dakota's large German-speaking settlement layer, including German-Russian families who often kept German surnames intact."

  - rank: 16
    name: Williams
    count: 1959
    ratio: 465
    origin: welsh
    type: Patronymic
    meaning: "Williams means 'son of William.' It is one of the country's strongest general surnames, but in South Dakota it ranks well below Johnson, Anderson, Nelson, and Olson because the state's immigrant farm belt shifted the balance away from older Anglo-American patterns."

  - rank: 17
    name: Meyer
    count: 1935
    ratio: 471
    origin: german
    type: Occupational
    meaning: "Meyer comes from a German word for a steward, tenant farmer, or estate manager. In South Dakota it points to the state's German ancestry base, especially the rural communities where German churches, schools, and family networks helped preserve surnames across generations."

  - rank: 18
    name: Davis
    count: 1862
    ratio: 490
    origin: welsh
    type: Patronymic
    meaning: "Davis means 'son of David.' Like Williams and Jones, it traveled west through ordinary American migration, but its South Dakota rank is held down by the unusually strong Scandinavian and German surname clusters above it."

  - rank: 19
    name: Christensen
    count: 1801
    ratio: 506
    origin: scandinavian
    type: Patronymic
    meaning: "Christensen means 'son of Christen' or Christian. The -sen ending makes the name especially characteristic of Danish and Norwegian naming, which fits South Dakota's southeastern and eastern Scandinavian settlement districts."

  - rank: 20
    name: Carlson
    count: 1760
    ratio: 518
    origin: scandinavian
    type: Patronymic
    meaning: "Carlson means 'son of Carl' or Karl. Its place in the top 20 shows how even the second tier of Scandinavian patronymics remains more visible in South Dakota than in most of the United States."

unique_surnames:
  - name: Hofer
    state_rank: 25
    national_rank: 4656
    origin: german
    why: "Hofer is a German surname often associated in South Dakota with Hutterite and German-Russian family lines. Forebears places 14.11 percent of U.S. Hofers in South Dakota, a striking concentration for a state with less than one percent of the national population."

  - name: Tschetter
    state_rank: 99
    national_rank: 22765
    origin: german
    why: "Tschetter is one of South Dakota's clearest Hutterite-linked surnames. Forebears places 39.67 percent of U.S. Tschetters in the state, and South Dakota historical sources trace Hutterite settlement in Dakota Territory to the 1870s."

  - name: Wipf
    state_rank: 101
    national_rank: 21444
    origin: german
    why: "Wipf is another rare German-speaking surname that overperforms sharply in South Dakota, where Forebears places 36.61 percent of U.S. bearers. Its concentration fits the Hutterite colony network that became especially important along the James River basin."

  - name: Eagle
    state_rank: 75
    national_rank: 3789
    origin: native american
    why: "Eagle is far more visible in South Dakota than nationally, reflecting Lakota, Dakota, and other Indigenous naming histories in a state where American Indian communities remain a major part of the population. Related high-ranking names such as Bear and Hawk show the same northern Plains pattern."

  - name: Bordeaux
    state_rank: 204
    national_rank: 10048
    origin: french
    why: "Bordeaux is a French surname that survives in South Dakota through the older fur-trade and Native borderland world of the northern Plains. Its statewide rank is modest, but its national comparison is distinctive enough to mark it as one of the state's signature family names."

etymology_groups:
  - type: Scandinavian Patronymics
    icon: fa-solid fa-person
    description: "South Dakota's top 20 is dominated by Scandinavian patronymics. Johnson, Anderson, Nelson, Olson, Peterson, Larson, Jensen, Hanson, Hansen, Christensen, and Carlson all descend from a father's given name, showing how strongly Norwegian, Swedish, and Danish farm settlement shaped the state."
    examples:
      - Johnson (son of John)
      - Olson (son of Ole)
      - Jensen (son of Jens)
      - Christensen (son of Christen)

  - type: German and German-Russian Names
    icon: fa-solid fa-hammer
    description: "German surnames form South Dakota's second major pattern. Miller, Schmidt, and Meyer appear in the top 20, while Hofer, Weber, Fischer, Wagner, Tschetter, Wipf, and Waldner show the heavier German-Russian, Mennonite, and Hutterite presence that distinguishes South Dakota from many neighboring states."
    examples:
      - Miller (grain miller)
      - Schmidt (blacksmith)
      - Meyer (steward or tenant farmer)
      - Hofer (farmstead or estate dweller)

  - type: Indigenous and Borderland Names
    icon: fa-solid fa-map-location-dot
    description: "Several South Dakota surnames outside the top 20 preserve Native and fur-trade histories rather than mass European immigration. Eagle, Bear, Hawk, Janis, Little, Crow, and Bordeaux point to Lakota, Dakota, and mixed French-Indigenous family networks across the Missouri River country and reservation communities."
    examples:
      - Eagle (Indigenous family name)
      - Bear (Indigenous family name)
      - Hawk (Indigenous family name)
      - Bordeaux (French borderland surname)

faq:
  - question: "What are the most common last names in South Dakota?"
    answer: "The most common last names in South Dakota are Johnson, Anderson, Nelson, Smith, and Olson. The full top 20 is unusually Scandinavian, with Peterson, Larson, Jensen, Hanson, Hansen, Christensen, and Carlson also ranking high."

  - question: "Why are Scandinavian last names so common in South Dakota?"
    answer: "Scandinavian last names are common in South Dakota because Norwegian, Swedish, and Danish families settled heavily in the eastern and southeastern farm counties during the homesteading and railroad era. That history pushed patronymics like Johnson, Anderson, Nelson, Olson, Peterson, Larson, Jensen, Hanson, and Hansen far above their national rankings."

  - question: "Why are German last names so common in South Dakota?"
    answer: "German last names are common because German ancestry became South Dakota's largest European ancestry layer, including Mennonite, Hutterite, and German-Russian communities. That history shows up in common names like Miller, Schmidt, Meyer, Weber, Fischer, Wagner, Hofer, Tschetter, Wipf, and Waldner."

  - question: "Why is Smith not the most common last name in South Dakota?"
    answer: "Smith is fourth in South Dakota because the state's settlement history was shaped more strongly by Scandinavian and German farm immigration than by older English-name populations. Johnson, Anderson, and Nelson all outrank Smith in the statewide surname data."

