intro_text: "South Dakota's state seal was designed in 1885 by Reverend Joseph Ward, four years before statehood. The seal shows the territorial economy in one landscape: mining on the left, farming on the right, a steamboat on the river between them, and the motto 'Under God the People Rule' arced across the top."
